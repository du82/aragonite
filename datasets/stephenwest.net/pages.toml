full_description = '''AIRSHIP CITY CHAPTER ONE “Come on, Joey. Hand it over.” Joseph stared steadily at the speaker. Don’t be afraid of him, he told himself. He’s just a kid like you. Even if he does dress like an organ grinder’s monkey. “I told you before, I don’t have it. And it’s Joseph, not Joey.” Mickey Cooper cracked a feral grin. “What do you think, lads? Does he look like a Joseph to you?” He stuck his thumbs in the pockets of his worn gold brocade waistcoat. His two companions regarded Joseph with open hostility. “Nah, he looks like a Joey to me,” said the one on his left, a weasel-faced boy with wisps of fuzz on his upper lip. The corner of his mouth lifted as he spoke. “A little runt.” Joseph snorted. “I’m a lot taller than you, Ned.” Ned flushed, his eyes narrowing in anger. “Oh yeah? Well maybe you are. But you ain’t taller than our Tom, now are you?” Joseph glanced at the hulking presence to Mickey’s right. If Tom was taller, it was only by an inch or so. But he was massive, with a barrel chest and bull neck, whereas Joseph was beanpole-slim. Tom’s dull eyes betrayed little emotion. “All right, stop rabbiting on, you two! I don’t want to hear no more of your pony.” Mickey’s grin had disappeared, and he stared at Joseph with hard eyes. “I want that guinea, Samson, and I want it now!” Joseph grinned derisively. “There haven’t been guineas since before the Great War, Mickey. It’s 1948. You should try to stay up to date.” “Oh I’m up to date all right, mate. But I thought I’d better ask you for something you could understand, what with you being a toff and all.” “I think I would understand you if you asked me for twenty shillings.” “It’s twenty-one bob to the guinea. I want twenty-one, you hear?” “I don’t care if you say it’s twenty-one or a hundred and twenty-one. You’re not getting a penny out of me.” Mickey gave another of his mocking smiles, holding out his hands. “Look, Samson, I don’t make the rules. Since before my time, the new recruits have been givin’ a little something to the head clerk. Now it’s your turn.” “Who made you the head clerk then? And since when has a little something been twenty shillings?” Mickey’s face turned murderous. “You don’t know who you’re messing with, Samson!” “Actually I do,” said Joseph with a sigh. “You want everyone to think you’re some kind of gangster. But you’re not hard. You’re just a kid like the rest of us.” As suddenly as it had come, the hard look disappeared, and Mickey was grinning again. “Am I really? I don’t think I’m the same as you. I didn’t go to no Harrow School, f’rinstance.” Ned laughed at this, a jeering laugh, and even Tom cracked a slight smile. Seemingly encouraged by this, Mickey turned to look at the rest of the office boys who were crowded in the post room of the bank. A ripple of nervous laughter started to work its way around the observing circle. Joseph felt his cheeks starting to burn. “Well, I’m not there now, am I?” He hated the defensive tone in his voice. “Had to leave, when my dad died.” He knew, as the words left his mouth, that he had made a mistake. There had been a slight quaver in his voice as he mentioned his father, and he steeled himself for the response. It wasn’t long in coming. “Oh dear,” said Mickey, an awful parody of a concerned look on his spotty face. “I think we’ve upset young Joey here, lads.” He looked at his companions. “Really, I’m ashamed of you two. Making fun of a boy who’s lost his father.” He turned his gaze back towards Joseph. “Go on then, Joey. Have a little cry.” The anger that always seemed to be just below the surface suddenly flared white-hot in Joseph, and he lashed out at Mickey. It wasn't a well-planned strike. Part of him seemed to watch his fist fly out in horror, afraid of the consequences. But another part, the part that had suddenly taken control, let out a roar of pure hatred, and drove his fist out blindly. Mickey dodged it easily, though his eyes grew wide as his head bobbed back. Joseph's hand fastened itself to Mickey's neck, seemingly of its own volition. Mickey struck out with his fists, aiming to connect with Joseph's ribs, but his arms were too short to reach. Joseph stood there, holding the smaller boy off at arm's length as he flailed away. This only served to make him more angry. Rage twisted his features as he roared dire threats at Joseph. But he was powerless to carry any of them out. Joseph felt his own anger subsiding, leaving him feeling scared and wondering what to do to get himself out of the situation. But he was saved from having to decide when something hit him hard on the side of his head. He turned to see Tom’s meaty fist withdrawing as the mailroom spun crazily, and its wooden floor suddenly rose up and hit him in the face. Joseph was thinking how unfair it was for the floor to do that, as the jeers echoed dimly around him like the caws of crows, when all went suddenly silent. He twisted around to see what was going on, and looked up into the narrow face of Janice Honeywell, the office supervisor. She was regarding him with some concern in her eyes, which peered at him through enormous black spectacles. "Are you all right, Samson?" He managed to pull himself into a sitting position. His head hurt badly, and he felt dizzy. "I think so, Miss Honeywell." She frowned at him. "You don't look all right.” He avoided her gaze, looking around the room. Everyone else seemed to have left. Almost everyone, that is. Ned was lurking behind the pigeon holes, weasel face scowling at him. "What happened, Samson?" Miss Honeywell was insistent. Joseph gave himself time to think of an answer by hauling himself laboriously to his feet. He steadied himself with a hand on a shelf. "I tripped, ma'am. Hit my head on the corner of the desk." Miss Honeywell regarded him skeptically. She lowered her voice slightly. "If there's a problem— if you're being bullied— I can help you, you know. You can tell me the truth." Joseph looked down at her earnest face. Prim and proper, buttoned up, secure in her authority here in the bank. What did that count for, out on the streets of the City or the East End? Would she follow him home tonight? Stop Mickey and his gang from beating him senseless? He looked away. "I have told the truth, ma'am." He felt less dizzy. He stood up straighter, releasing his grip on the shelf. Miss Honeywell stared at Joseph a moment or two longer, frown deepening. Then she sighed. “Look, Joseph, I know it’s not been easy for you. Things are not turning out the way you expected. But you mustn’t give up hope. The world is changing, and there are new opportunities for young men, even if they haven’t gone to university. You could still make something of your life.” Joseph nodded. “Yes, ma’am. Can I go now?” Miss Honeywell rolled her eyes slightly. “Very well.” But she was still watching him as he turned to go, and called out after him. “You’d better clean up that graze.” Joseph made his way unsteadily to the nearest toilet and washed his face in the basin, then examined his forehead in the mirror, brushing his thick black hair away to do so. The impact with Tom’s huge fist had left an ugly red mark on his left temple, but above his right eyebrow the graze wept droplets of blood. He must have scraped it against a rough floorboard when he fell. Wincing as he dabbed at it with a piece of toilet paper, he stared at himself in the mirror, asking himself the question he had asked a thousand times in the past few months. What am I doing here? He still had no answer. He didn’t belong in this place. The anger and frustration welled up inside him, so that he felt he might explode, or scream, or smash the mirror in front of him. He closed his eyes, taking a deep breath, and the moment passed. Sighing, he threw the toilet paper into the bin, and opened the door. He felt a bit steadier on his feet as he trudged back to the post room. The rest of the day passed without incident, and when it was time to leave Joseph hurried out of the building and down the street, looking anxiously over his shoulder. But there was no sign of Mickey or his thugs, and he walked on with a growing sense of relief, which lasted almost all the way home. As he turned into the street where he lived, however, the familiar sinking feeling came over him. The sight of the dingy terraced house that was now his home was an unwelcome reminder of how much his life had changed after his father’s death. He still hadn't gotten used to living here. In his mind, home was the pleasant red-brick house in Hampstead, with its green lawns and shady oaks. He sighed, and walked up the narrow steps from the pavement, letting himself in with his key. To his surprise he heard voices from the parlour. Visitors were a rare thing in this new house. He stuck his head around the door and saw his mother sitting and talking with a strange man. “Ah, here he is now,” she said, rising and beckoning him into the room. “Joseph, I’d like you to meet Mr Monmouth.” The stranger stood and held out his hand. “Hello, Joseph,” he said warmly. His grip was firm. “Get into a scrape at work?” “Oh, you mean the graze? No sir,” said Joseph quickly. He didn’t want to alarm his mother. “Just tripped and fell.” “Of course you did,” replied Monmouth, but there was a twinkle in his eye. He nodded knowingly as Joseph’s mother fussed over him, peering up at his face. “You must be more careful, Joseph.” She turned to Monmouth. “I think he’s grown too quickly, he’s not used to his height. It makes him clumsy!” “How tall are you, Joseph, six foot or so?” “Yes sir.” Joseph had learned that people automatically assumed that he would want to talk about his remarkable height. None of them ever seemed to realise that he might be tired of having the same conversation over and over again. “And you’re only sixteen! Still, I expect you hear the same thing from everyone. Must get boring, I suppose.” “Oh no, sir,” said Joseph, so as not to appear rude, but he had to work hard to suppress a grin. Especially when Monmouth gave another knowing nod. “Mr Monmouth knew your father,” said his mother brightly, as she resumed her seat on the sofa. Joseph waited for Monmouth to sit down in the shabby armchair before sitting next to his mother. “Yes, we worked together at the Zeppelin company. We were all very saddened by his death.” Monmouth frowned deeply. “A terrible loss. He was an outstandingly gifted pilot. And a dear friend.” The silence lengthened uncomfortably, and when his mother sighed deeply, Monmouth seemed to rouse himself from his reverie. “I must apologise, Miriam, I did not mean to upset you.” His mother forced a smile. “No, Robert, it’s quite all right. Would you like some more tea?” “No thank you, and indeed I must be on my way.” He stood briskly, picking up a black fedora from the side table. Joseph and his mother followed him to the door, where he paused on the threshold. “Thank you for the tea, Miriam.” He turned to go, placing the fedora on his head, then turned back. “Joseph, would you like to meet me for lunch tomorrow, in the City? I’ve something to discuss with you that you might find very interesting.” CHAPTER TWO “Well, what was all that about?” said his mother, as she closed the door behind Monmouth. Joseph was just as puzzled. “I haven’t a clue, Mum.” “Maybe he’s going to offer you a job. Oh Joseph, promise me you’ll never work for that awful Zeppelin company! I couldn’t bear the worry if you started flying as well. You wouldn’t do that to me, would you?” Joseph stared at his mother’s worry-drawn face. He understood her concerns, but her near-constant fear that he would suddenly decide to become a pilot could be tiresome. He forced a smile. “Of course not, Mum. Don’t you worry, I’ve got a good job at the bank. Anyway, whatever Mr Monmouth wants to talk to me about, I’m sure it’s nothing like that.” “So you work at the City and Empire Merchant Bank, do you?” Monmouth sat back in his chair and puffed on his cigar, regarding Joseph through the clouds of smoke. They were in the dining room of his club. Their conversation had been limited to the weather (good) and the food (bad), but now it seemed that Monmouth would finally come to the point of their meeting. “Yes sir, I work in the post room.” He briefly wondered how Monmouth had known the name of his employer. My mother must have mentioned it. “Ah.” Monmouth had that slightly annoying half-smile on his face again. “Do you ever see Winston Churchill, I wonder?” “I do sometimes, when I deliver his post.” Joseph began to feel a bit uncomfortable about the questions, as if Monmouth were prying into something that didn’t strictly speaking concern him. “Do you know Mr Churchill?” Monmouth nodded. “Yes, I have met him. So you haven’t sat in on any client meetings or anything like that?” “No.” Joseph now felt defensive, and then annoyed with himself for feeling that way. He was only sixteen, why would he be sitting in on client meetings? “I told you, I’m just a clerk.” “It’s all right.” Monmouth smiled encouragingly. “You can still help me.” “Help you with what?” “Before we get into that, I’d like to talk about your father.” “My father? What does he have to do with it?” Monmouth looked pained. He leaned forward, stubbing out his cigar, and glanced around before answering. When he did, he kept his voice low. “Joseph, there’s no easy way to say this, but I believe that your father was murdered, and I need your help to bring his murderer to justice.” Joseph stared at him, shocked and stunned. “That’s impossible,” he said eventually. “My father was killed when his airship exploded. It was an accident, pure and simple.” “It was made to seem an accident.” Monmouth shook his head. “But it wasn’t. Ever since the Hindenburg nearly caught fire at Lakehurst, we have been absolutely dedicated to safety at the Zeppelin company. The moment I heard about the explosion, I knew it could not be a fault with the airship.” “So how was it done? Who do you think did it?” Monmouth sat back in his chair. “I don’t yet know exactly how it was done. I’ve been following up clues and leads ever since the explosion. It’s taken months and months of very hard work.” He sighed, and rubbed his forehead. “Lots of dead ends, unfortunately. But just recently, I’ve had a bit of a breakthrough. I’m certain that Howard Hughes is involved in some way.” “You mean the Howard Hughes, the one who built Aeropolis? He’s a client of the bank.” “Yes, I mean him. Hughes has been an enemy of the Zeppelin company for years, but I didn’t think even he would go as far as murder. But now some new evidence has come to light. I need more information to confirm it, and I need you to get it for me.” Joseph was taken aback. “You need me? Why? What can I do?” “You can tell me what Hughes gets up to when he comes to the bank tomorrow.” “How would that help you? Are you with the police?” Monmouth shook his head. “No, I’m still helping the Zeppelin company. But now I’m with a special department, known as the ZA. W'''
