full_description = "Jan 2014 Stephen West Author of Airship City (Book One of Aeropolis) | Feb 2014 | Dec 2013 New year, new stuff05/01/14 17:31 Filed in: AeropolisAs I’ve mentioned before, I wrote the first few drafts of Airship City (then known as Aeropolis) on my iPhone. This was because I wanted to write on the Tube on my way into work, and I didn’t have a laptop then. It actually worked pretty well. It wasn’t much good for editing and rewriting, because the small screen area and touch screen controls makes it difficult to move around in the documents and make changes. But for banging out the first draft, it was near-perfect. Read More...Tags: Short StoryComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
