full_description = "Aug 2013 Stephen West Author of Airship City (Book One of Aeropolis) | Sep 2013 | Jul 2013 Airship City goes free!10/08/13 18:46 Filed in: Airship CityExciting news if you’ve been sitting on the fence about buying Airship City, or just like free books: it will be FREE to download on Amazon, starting tomorrow, the 11th of August, for three days. The starting time is midnight, Amazon time, which translates to early morning in the UK, but most people in the US will see it a lot earlier (and in Australia you’ll probably not see the price cut until Monday, I’m afraid. Although it will obviously go on until Wednesday instead of Tuesday.) To get your free download, just click on the link .Tags: kindleCommentsAirship City update03/08/13 17:35 Filed in: Aeropolis | Airship CityChanging the cover doesn’t seem to have had much of an impact on the Goodreads campaign, although, as August is a strange month, it’s hard to tell. Sales overall are slow, which is probably normal for a first book by an unknown, independent author, and I should probably just put my head down, finish the sequel, and build up my offering. But then again, I do still have three free days of promotion left on my KDP Select account for the enrolment period, which is up at the beginning of September. Watch this space…Tags: GoodreadsComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
