full_description = "Oct 2013 Stephen West Author of Airship City (Book One of Aeropolis) | Nov 2013 | Sep 2013 Cover change, and a new chapter27/10/13 12:06 Filed in: Aeropolis | Airship CityI’ve decided to go back to the original cover. I finally realised that I had chosen the yellow-danger-sign cover mostly for visual impact, but it didn’t feel very original and it certainly didn’t seem to be in keeping with the book, being quite modern and simple. I just like the old cover more.I’m using some 3D software to design a new cover, which will include an image of Joseph (something I’ve always wanted) and once that is done, I’ll then do the print edition, and also relaunch Airship City with some new content!Yes, the beauty of self-publishing via the Kindle is the ability to upload a new version whenever you like. Based on some feedback from one of my reviewers, I’ve realised that there is an exciting chapter missing from the book, and I’m in the process of writing that chapter and adding it in. Everyone who has already bought Airship City will get the opportunity to download the new file as well. My aim is to get it done in the next month or so.Tags: writingCommentsThe missing iPhone 520/10/13 22:08 Filed in: AppleI love my iPhone (I wrote my book on it!) and I’ve been following the launch of the iPhone 5s and 5c with some interest. As you may know the 5s is the new flagship version of the iPhone, while the 5c is the new kid on the block, a colourful version of the old 5 with a new case and a slightly lower price.Now when the iPhone 5 was launched last year, Apple did as they usually do, which is to keep the lowest-spec version of the previous model on as the bargain-basement offering, and so the old 4S lived on in this role. When the new phones were launched, you might have expected the iPhone 5 to take its place.But it didn’t. The 4S is still the bargain-basement offering. The iPhone 5 has simply disappeared. Read More...Tags: iPhoneCommentsChuck Yeager visits South Africa20/10/13 18:41 Filed in: FlyingChuck Yeager posted a link to this article on Twitter, and as a service to those of his fans who don’t read Afrikaans, I decided to translate as follows:World-renowned pilot in SA - Saturday 19 October 2013Surely the world’s best-known test pilot and veteran of the Second World War and the American-Vietnamese conflict was in South Africa, where he and his wife Victoria took a holiday in the Kruger National Park. Read More...Tags: Chuck YeagerComments //<![CDATA[ var disqus_shortname = 'stephenwest'; (function() { var s = document.createElement('script'); s.async = true; s.type = 'text/javascript'; s.src = 'http://disqus.com/forums/' + disqus_shortname + '/count.js'; (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s); }()); //]]>"
