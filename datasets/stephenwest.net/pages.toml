full_description = '''A few updates26/04/14 18:27 Filed in: Wattpad | Goodreads | Kindle | AirshipsA few quick updates:1. I’ve uploaded a full ePub file of Airship City to Goodreads. So if you’re on Goodreads, you can read the entire book online, or even download it. If you have read and enjoyed it, please consider rating or reviewing it! Airship City on Goodreads.2. I’m also posting the entire novel up onto Wattpad, a chapter per day. So if you’re on Wattpad, you might find it more convenient to read there. 3. If you can’t be bothered with all this and just want the convenience of the Kindle edition, it’s currently on promotion for a lot less than you might think! Airship City on Amazon4. Finally, just wanted to let you know about a great online resource for airship information— a real treasure trove. Airships.netTags: updates var disqus_shortname = 'stephenwest'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; var disqus_identifier = '1d2daba3cba86513fe84deb581854417'; dsq.src = 'http://' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); }()); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a> blog comments powered by Disqus'''
