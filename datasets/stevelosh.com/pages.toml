full_description = "PlantsLast updated on July 27th, 2017.This project started as a joke. I posted a few photographs of plants on Instagram alongside my other photos. Purely by accident I posted one plant every three images, and because Instagram shows thumbnails in three columns it ended up forming a nice line of sepia-toned thumbnails on my profile. I decided to keep up the rhythm for a while because it looked nice, and two years later I'm still making plant photos. PlantsLast updated on July 27th, 2017.This project started as a joke. I posted a few photographs of plants on Instagram alongside my other photos. Purely by accident I posted one plant every three images, and because Instagram shows thumbnails in three columns it ended up forming a nice line of sepia-toned thumbnails on my profile. I decided to keep up the rhythm for a while because it looked nice, and two years later I'm still making plant photos."
