["https://stevelosh.com/blog/2011/09/writing-vim-plugins"]
title = "Writing Vim Plugins / Steve Losh"
full_description = '''Writing Vim PluginsPosted on September 6th, 2011.A while ago I wrote a post about switching back to Vim. Since then I've written two plugins for Vim, one of which has been officially "released". A couple of people have asked me if I'd write a guide to creating Vim plugins. I don't feel confident enough to write an official "guide", but I do have some advice for Vim plugin authors that might be useful. Other People Who Know More Than I DoTim PopeScroolooseBe Pathogen-CompatiblePlease, For the Love of God, Use normal!Mapping Keys the Right WayWhen to Map Keysimap and nmap are Pure EvilLet Me Configure MappingsLocalize Mappings and SettingsLocalizing MappingsLocalizing SettingsAutoload is Your FriendBackwards Compatibility is a Big DealWhat Matters for Backards Compatibility?Use Semantic Versioning So I Can Stay SaneDocument EverythingPick Some Requirements and Stick to ThemWrite a READMECreate a Simple WebsiteWrite a Vim Help DocumentKeep a ChangelogMaking Vimscript PalatableWrap. Everything.Scripting Vim with Other LanguagesUnit Testing Will Make You DrinkTL;DR Other People Who Know More Than I Do Writing two decently-sized Vim plugins has given me some experience, but there are a lot of people that know far more than I do. There are two in particular that come to mind. I'd love for them to write some guides (or even books) about modern-day Vim scripting. Tim Pope The first is Tim Pope. He's written a ton of Vim plugins like Pathogen, Surround, Repeat, Speeddating and Fugitive. Each of those is clear, focused and polished. It would be awesome to read a guide on the ins and outs of Vim scripting by him. Scrooloose The other person that comes to mind is Scrooloose, author of NERDTree, NERDCommenter and Syntastic. His plugins are large and full-featured but work incredibly well, considering how tricky and painful Vimscript is to work with. I'd love to read a guide on writing large-scale Vim plugins by him. Be Pathogen-Compatible It's 2011. When writing your plugin, please make its source compatible with Pathogen. It's very easy to do this — just set up your project's files like this: yourplugin/ doc/ yourplugin.txt plugin/ yourplugin.vim ... README LICENSE This will let users use Pathogen (or Vundle) to install and use your plugin. The days of "unzip and drag the files into the right directories" and the horror of Vimballs are over. Pathogen and Vundle are the right way to manage plugins, so let your users use them. Please, For the Love of God, Use normal! My first piece of actual scripting advice is something simple but important. If you're writing a Vim plugin and need to perform some actions, you might be tempted to use normal. Don't. Instead, you need to use normal!. normal! is like normal, but ignores mappings the user has set up. If you use plain old normal dd and I've remapped dd to do something else, the call will use my mapping and probably not do what your plugin expects. Using normal! ensures that the call will do what you expect no matter what the user has mapped. This is a single instance of a more general theme. Vim is very customizable and users will do lots of crazy things in their .vimrc files. If a key can be mapped or a setting changed, you have to assume that some user of your plugin will have mapped or changed it. Mapping Keys the Right Way Most plugins add key mappings to make them easier to use. Unfortunately this can be tricky to get right. You can never tell what keys your users have already mapped themselves, and shadowing someone's favorite key mapping will break their muscle memory and annoy them to no end. When to Map Keys The first question to ask is whether your plugin needs to map keys itself at all. My Gundo plugin has only one feature that needs to be mapped to a key in order to make it useful: the "toggle Gundo" action. Gundo doesn't map this key itself, because no matter what "default" mapping I pick someone will have already mapped it. Instead I added a section right in the README file that shows how a user can map the key themselves: nnoremap <F5> :GundoToggle<CR> By making users add this line to their .vimrc themselves it shows them which key is used to toggle Gundo (which they would have to know anyway) and also makes it obvious how to change it to suit their taste. imap and nmap are Pure Evil Sometimes forcing the user to map their own keys won't work. Perhaps your plugin has many mappings that would be tedious for a user to set up manually (like my Threesome plugin), or its mappings are mnemonic and wouldn't really make sense if mapped to other keys. I'll talk more about how to deal with this in a moment, but the most important thing to remember when mapping your own keys is that you must always, always, always use the noremap forms of the various map commands. If you map a key with nmap and the user has remapped a key that your mapping uses, your mapped key will almost certainly not do what you want. Using nnoremap will ignore user mappings and do what you expect. This is the same principle as normal and normal!: never trust your users' configurations. Let Me Configure Mappings If you feel that your plugin must map some keys, please make those mappings configurable in some way. There are a number of ways to do this. The easiest way is to provide a configuration option that disables all mappings. The user can them remap the keys as they see fit. For example: if !exists('g:yourplugin_map_keys') let g:yourplugin_map_keys = 1 endif if g:yourplugin_map_keys nnoremap <leader>d :call <sid>YourPluginDelete()<CR> endif Normal users will get the mappings automatically set up for them, and power users can remap the keys to whatever they wish to avoid shadowing their own mappings. If your plugin's mappings all start with a common prefix (like <leader> or <localleader>) you have another option: allow users to configure this prefix. This is the approach I've used in Threesome. It works like this: if !exists('g:yourplugin_map_prefix') let g:yourplugin_map_prefix = '<leader>' endif execute "nnoremap" g:yourplugin_map_prefix."d" ":call <sid>YourPluginDelete()<CR>" The execute command lets you build the mapping string dynamically so your users can change the mapping prefix. There is a third option for solving this problem: the hasmapto() Vim function. Some plugins will use this to map a command to a key unless the user has already mapped that command to something else. I don't personally like this option because it feels less clear to me, but I know other people feel differently so I wanted to mention it. Localize Mappings and Settings The next step in being a good Vim plugin author is to try to minimize the effects of your key mappings and setting changes. Some plugins will need to have global effects but others will not. For example: if you're writing a plugin for working with Python files it should only take effect for Python buffers, not all buffers. Localizing Mappings Key binding are easy to localize to single buffers. All of the noremap commands can take an extra <buffer> argument that will localize the mapping to the current buffer. " Remaps <leader>z globally nnoremap <leader>z :YourPluginFoo<cr> " Remaps <leader>z only in the current buffer nnoremap <buffer> <leader>z :YourPluginFoo<cr> However, the problem is that you need to run this command in every buffer you want the mapping active. To do this your plugin can use an autocommand. Here's a full example, using this concept plus the previously mentioned configuration options: if !exists('g:yourplugin_map_keys') let g:yourplugin_map_keys = 1 endif if !exists('g:yourplugin_map_prefix') let g:yourplugin_map_prefix = '<leader>' endif if g:yourplugin_map_keys execute "autocommand FileType python" "nnoremap <buffer>" g:yourplugin_map_prefix."d" ":call <sid>YourPluginDelete()<CR>" endif Now your plugin will define a key mapping only for Python buffers, and your users can disable or customize this mapping as they see fit. This mapping command is quite ugly. Unfortunately that's the price of using Vimscript and trying to make a plugin that will work for many users. Later I'll talk about one possible solution to this ugliness. Localizing Settings Just as you should make mappings local to buffers when appropriate, you should do the same with settings like foldmethod, foldmarker and shiftwidth. Not all settings can be set locally in a buffer. You can read :help <settingname> to see if it's possible. You can use setlocal instead of set to localize settings to individual buffers. Like with mappings you'll need to use an autocommand to run the setlocal command every time the users opens a new buffer. Autoload is Your Friend If your plugin is something that users will be using all the time you can skip this section. If you're writing something that will only be used in specific cases, you can help your users by using Vim's autoload functionality to delay loading its code until the user actually tries to use it. The way autoload works is fairly simple. Normally you would bind a key to call one of your plugin's functions with something like this: nnoremap <leader>z :call YourPluginFunction()<CR> You can use autoloading by prepending yourplugin# to the name of the function: nnoremap <leader>z :call yourplugin#YourPluginFunction()<CR> When this mapping is run, Vim will do the following: Check to see if YourPluginFunction is already defined. If so, call it. Otherwise, look in ~/.vim/autoload/ for a file named yourplugin.vim. If it exists, parse and load the file (which presumably defines YourPluginFunction somewhere inside of it). Call the function. This means that instead of putting all of your plugin's code in plugin/yourplugin.vim you can put just the key mapping code there and pull the rest out into autoload/yourplugin.vim. If your plugin has a decent amount of code this can reduce the startup time of Vim by a significant amount. Check out the full documentation of autoload by running :help autoload to learn much more. Backwards Compatibility is a Big Deal Once you've written your Vim plugin and released it into the wild, you have to maintain it. Users will find bugs and ask for new features. Part of being a responsible developer of any kind, including a Vim plugin author, is maintaining backwards compatibility, especially for tools that users will use every day and burn into their muscle memory. Users rely on tools to work, and tools that break backwards compatibility will quickly lose users' trust. Maintaining backwards compatibility will cause your plugin's code to get crufty in spots, but it's the price of maintaining your users' happiness. What Matters for Backards Compatibility? For a Vim plugin the most important part of staying backwards compatible is ensuring that key mappings, customized or not, continue to do what users expect. If your plugin maps key X to do Y, then pressing X should always do Y, even if you change how Y is called by renaming Y to Z. This may mean changing Y into a wrapper function which simply calls Z. There are many other aspects of backwards compatibility that you will have to consider, depending on the purpose of your plugin. The rule of thumb you should follow is: if a user uses this plugin on a daily basis and has its usage burned into their muscle memory, updating the plugin should not make them relearn anything. Use Semantic Versioning So I Can Stay Sane A fast, simple, easy way to document your plugin's state is to use semantic versioning. Semantic versioning is simply the idea that instead of picking arbitrary version numbers for releases of your project, you use version numbers that describe the backwards-compatible state in a meaningful way. In a nutshell, these rules describe how you should select version numbers for new releases: Version numbers have three components: major.minor.bugfix. For example: 1.2.4 or 2.13.0. Versions with a major version of 0 (e.g. 0.2.3) make no guarantees about backwards compatibility. You are free to break anything you want. It's only after you release 1.0.0 that you begin making promises. If a release introduces backwards-incompatible changes, increment the major version number. If a release is backwards-compatible, but adds new features, increment the minor version number. If a release simply fixes bugs, refactors code, or improves performance, increment the bugfix version number. This simple scheme makes it easy for users to tell (in a broad sense) what has changed when they update your project. If only the bugfix number has changed they can update without fear and continue on without worrying about changes unless they're curious. If the minor version number has changed they might want to look at the changelog to see what new features they may want to take advantage of, but if they're busy they can simply update and move on. If the major version number has changed it's a major red flag, and they'll want to read the changelog carefully to see what is different. Some people don't like semantic versioning for the following reason: If I have to increment the major version number every time I make backwards-incompatible changes, I'll quickly be at ugly versions like 24.1.2! To this I say: "Yes, but if that happens you're doing things wrong in the first place." Keep your project in "beta" (i.e. version 0.*.*) for as long as you need to experiment freely. Take your time and make sure you've gotten things (mostly) right. Once you release 1.0.0 it's time to start being responsible and caring about backwards compatibility. Breaking functionality all the time harms your users by reducing their productivity and frustrating them. Yes, it means adding some cruft to your code over time, but it's the price of not being evil. Document Everything A critical part of releasing a Vim plugin to the world is writing documentation for it. Vim has fantastic documentation itself, so your plugins should follow in its footsteps and provide thorough docs. Pick Some Requirements and Stick to Them The most important part of your documentation is telling users what they need to have in order to use your plugin. Vim runs on nearly every system imaginable and can be compiled in many different ways, so being specific about your plugin's requirements will save users a lot of trial and error. Does your plugin only work with Vim version X.Y or later? Does it require Python/Ruby/etc support compiled in? Which version? Does it not work on Windows? Does it rely on an external tool? If the answer to any of those questions is "yes", you must mention it in the documentation. Write a README The first step to documenting your plugin is to write a README file for the repository. You can also use the text of this file as the description if you upload your plugin to the vim website, or the content of your plugin's website if you create one for it. Some examples of things to include in your README are: An overview of what the plugin does. Screenshots, if possible. Requirements. Installation instructions. Common configurat'''
year_published = 2011
clearnet = "https://stevelosh.com/blog/2011/09/writing-vim-plugins"
