["https://stevelosh.com/blog/2010/09/coming-home-to-vim"]
title = "Coming Home to Vim / Steve Losh"
full_description = '''Coming Home to VimPosted on September 20th, 2010.I'm a programmer. I work with text files for 6-12 hours every weekday so I care about the text editor I use. If switching to a different editor can increase my efficiency by even 10% it would save a good chunk of my time and let me get back to making cool things. I don't buy the "you're thinking 90% of the time and only typing 10% of the time, so your editor doesn't really matter" argument. Even if the premise is true, the conclusion is wrong. If I think for 10 minutes and then start typing, I want the typing to take the shortest time possible so I can get back to thinking. Any time I spend typing is an interruption that I want to minimize so I can keep my train of thought. I recently started using Vim as my primary editor. As I'm adjusting I'm finding a lot of the blog posts people have written about Vim very helpful, so I'm hoping this post will help people too. Some Background About MeWhy I Switched to TextMateWhy I Came Back to VimCore DifferencesVim's "Feeling"A "Language" of Text EditingThe Physics of Text"Programming" Your EditingGetting StartedMaking Vim More UsefulImportant .vimrc LinesUsing the LeaderQuicker EscapingWorking With Split WindowsAestheticsBundles I UsePathogenPeepOpenNERDTreeNERDCommenterAckSnipmateSparkupYankringSurround (and Repeat)SlimeScratchRainbow ParenthesesThings I WantHTML Indentation that Doesn't SuckPython Support for SlimeGundoA Mercurial Version of FugitiveOverall Thoughts Some Background About Me I used Vim exclusively from about 2002 to 2005. I never really learned much about it and mostly used it as a glorified nano. In 2006 I decided it was time for a change. I wanted an editor that "fit" with OS X. I tried SubEthaEdit for a while and it was kind of cool. The collaborative editing was more polished than any other version I've seen, though I didn't have much use for it. As cool as SubEthaEdit was, I always felt like there was a better editor out there for me. Then I found TextMate. At the time I thought TextMate was amazing (and it really was). It looked like a Mac application. It was super easy to learn (all the OS X text movement commands just worked). There were bundles for everything. I still used Vim occasionally (like when I had a job and only had a Windows machine), but for the most part I was a TextMate kid. After using TextMate for four years I decided it was time for another change. Development on TextMate has stalled while TextMate Forever (err, TextMate 2) is in the works. I started thinking about Vim (and reading blog posts by others about how they switched back) and decided to give it another try. A few months ago I bought Learning the vi and Vim Editors and went cold-turkey with Vim as my main text editor. I haven't looked back since. Why I Switched to TextMate As I mentioned before, there were a few reasons I switched to TextMate in the first place. First of all: it looks and acts like a real OS X application. You can drag files onto the icon to open them, it supports all the default OS X text movement commands, and the chrome looks like it belongs on OS X. I don't know if MacVim was around at the time, but if it was I never found it. This matters. The effort required to get started with a new editor is dramatically reduced if that editor supports all the conventions of the operating system you use every day. It also has a vibrant community of people writing bundles for it, so there was support for almost anything I wanted to use. Why I Came Back to Vim I came back to Vim for a number of reasons. First of all: I started reading about and desiring features that didn't seem to be coming to TextMate any time soon. The biggest of those was split windows. I saw the appeal of split windows right away and now that I use them I can't imagine not having them. Another reason is version control. A while ago I started keeping my dotfiles in a Mercurial repository which makes it extremely easy to set up new machines. Vim keeps all of its configuration in two simple places: a simple ~/.vimrc file and a ~/.vim directory full of plain text files. Vim's plain text configuration files and plugins are very easy to version control. They diff well, unlike TextMate's multiple Bundles directories and ugly XML file format. Vim's community has been around far longer than TextMate's so there's an even richer set of plugins, bundles and syntax files available. Another reason people give for enjoying Vim is that it runs everywhere. Yes, it's nice to have my favorite editor available when I SSH into a machine, but it's not a huge deal if I don't. I almost always edit files on my own machine and then deploy them with an automated script of some kind, so editing on a server is very rare for me. Core Differences For me, Vim and TextMate are very different. TextMate relies mainly on keyboard shortcuts (involving Shift, Ctrl, Cmd and Alt) to do more than simply edit text. Vim uses a "modal editing" idea to accomplish the same task. TextMate's philosophy is much the same as any normal OS X application's, and I said that acting like the OS reduces the barrier of entry for a text editor, so why do I prefer Vim's philosophy? First I should prefix my answer with this: I'm not averse to a learning curve for something as important to me as a text editor. Yes, it's awesome if I don't need to unnecessarily rewire my brain, but if it's going to save me a lot of time then I'm willing to cut a bit of slack here. My problem with TextMate's philosophy can be summed up in one word: "shadowing". If I want to define a new command in a bundle (or if someone else has already done it), I'm never really sure if I'm "overwriting" some other command that my fingers know but my brain doesn't really register. By the time I try to use the default command it could be days or weeks after I defined the custom one, and I need to figure out what I did all over again. It's quite frustrating. Vim's "insert" mode means that when I'm editing text I'm using the normal OS X text movement shortcuts that I know and love. When I want to do something special I enter normal mode and don't have to worry about shadowed commands (Vim's leader key also helps with this). Vim's "Feeling" Vim's normal mode has a unique "feeling" that I haven't seen in any other text editor (although E may change that). I've heard it described in a number of ways, and I think that while no one analogy fully explains it, together they give a pretty good description. A "Language" of Text Editing One way to think about Vim's normal-mode commands is like a language. You have "verbs" and "nouns". For example: the "change" command (c) would be a verb and the "word" item (w) is a noun. You can combine them to form imperative sentences that talk about what you want to do with your text. The wonderful part about this is that whenever you learn a new verb (like "delete" (d)) you can immediately apply it to all the nouns you know, and vice versa. Vim also has "adjectives" like "inside" and "around" (i and a) that let you craft sentences like "change inside parenthesis" (ci( or cib). Once you learn one of these you can immediately apply it to all the verbs and nouns you already know. The Physics of Text The second way to describe the feeling of Vim is "physics". It's a much less concrete description but I think it's still useful. If I throw a bowling ball into the air it behaves much the same way as if I throw a turkey sandwich. They might have very different effects when they land on someone but the act of throwing them is pretty much the same. Vim's operators/actions/verbs act the same way. daw has a very different effect than da{ but they can both be understood with a basic underlying principle: da<something> will "delete around <something>". "Programming" Your Editing The last way that I hear people talking about Vim's editing is: "it feels like you're 'programming' your text". This analogy is often made by programmers (obviously) and I think it works on more than one level. First: Vim's basic editing commands can be likened to function calls. daw can be thought of a running a function like delete(type='word', around=True). I don't think this way (I prefer the language and physics analogies) but other people do. Although I don't think of the basic Vim commands as programming I do see some aspects of it in other areas. For example: say I define a leader command in my ~/.vimrc file: nnoremap <leader>1 yypVr= I think of this as defining <leader>1 to be a function that performs the following actions: Yank/copy the current line. Paste it below (and move down to the pasted version). Select the copied line. Replace every character with =. Another more obvious "programming" aspect of Vim is creating macros. Macros are like tiny little functions you create to help you when you're editing a file. You can define them, execute them, and even edit them by pasting, editing and yanking them back. Getting Started When I switched back to Vim I did a few things that helped make my transition stick. First: I bought Learning the vi and Vim Editors and read it cover to cover. It helps quite a bit to know the history behind Vim, and the book also teaches you the basics of Vim's editing commands. I also looked through the Vim subreddit to find some good blog posts about switching. A lot of people have written about it and it was very helpful to read about their experiences. And finally, the most important part: I switched cold-turkey. Vim runs everywhere, so there's really no excuse for not doing this. Every decent OS has a version of Vim that makes insert mode "just work" for their OS (like gvim or MacVim), so the barrier to entry these days is pretty low. You can get Vim and start using it right away by staying in insert mode most of the time. Then you can start learning its real features at your own pace. Trying to use two different editors at once just slows down the learning process and makes you less productive in both. Making Vim More Useful One of the flaws of Vim is that it takes quite a bit of configuration to make it behave in a decent way. The defaults are backwards-compatible with vi (i.e. older than most college students) and not very helpful. Here are a few of the things I do to make Vim a bit more palatable. A quick side note: even if you don't use Vim, you need to remap your capslock key to something useful. Just do it, you'll thank me. Important .vimrc Lines I won't go through every line in my ~/.vimrc file, but here are some of the lines that I simply could not live without. First, a few lines that you absolutely must have: filetype off call pathogen#runtime_append_all_bundles() filetype plugin indent on set nocompatible set modelines=0 The filetype and call lines are for loading Pathogen, which is described in the bundles section. See Pathogen's docs to learn about why the first filetype line is there. set nocompatible gets rid of all the crap that Vim does to be vi compatible. It's 2010 — we don't need to be compatible with vi at the expense of functionality any more. The modelines bit prevents some security exploits having to do with modelines in files. I never use modelines so I don't miss any functionality here. Next I set my tab settings: set tabstop=4 set shiftwidth=4 set softtabstop=4 set expandtab I like all tabs to expand to four spaces. Check out this Vimcast to learn more about each of these options. Next are a few options that just make things better: set encoding=utf-8 set scrolloff=3 set autoindent set showmode set showcmd set hidden set wildmenu set wildmode=list:longest set visualbell set cursorline set ttyfast set ruler set backspace=indent,eol,start set laststatus=2 set relativenumber set undofile Each of these lines are basically to make Vim behave in a sane manner. The two "interesting" ones are the last two, and both deal with features that are new in Vim 7.3. relativenumber changes Vim's line number column to display how far away each line is from the current one, instead of showing the absolute line number. I almost never care what numeric line I'm on in a file (and if I do I can see it in the status line), so I don't miss the normal line numbers. I do care how far away a particular line might be, because it tells me what number I need to use with motion commands like d<NUMBER>d. undofile tells Vim to create <FILENAME>.un~ files whenever you edit a file. These files contain undo information so you can undo previous actions even after you close and reopen a file. Next I change the <leader> key: let mapleader = "," For me , is easier to type than \. I use leader commands constantly so it's worth changing. The next thing I do is tame searching/moving: nnoremap / /\v vnoremap / /\v set ignorecase set smartcase set gdefault set incsearch set showmatch set hlsearch nnoremap <leader><space> :noh<cr> nnoremap <tab> % vnoremap <tab> % The first two lines fix Vim's horribly broken default regex "handling" by automatically inserting a \v before any string you search for. This turns off Vim's crazy default regex characters and makes searches use normal regexes. I already know Perl/Python compatible regex formatting, why would I want to learn another scheme? ignorecase and smartcase together make Vim deal with case-sensitive search intelligently. If you search for an all-lowercase string your search will be case-insensitive, but if one or more characters is uppercase the search will be case-sensitive. Most of the time this does what you want. gdefault applies substitutions globally on lines. For example, instead of :%s/foo/bar/g you just type :%s/foo/bar/. This is almost always what you want (when was the last time you wanted to only replace the first occurrence of a word on a line?) and if you need the previous behavior you just tack on the g again. incsearch, showmatch and hlsearch work together to highlight search results (as you type). It's really quite handy, as long as you have the next line as well. The <leader><space> mapping makes it easy to clear out a search by typing ,<space>. This gets rid of the distracting highlighting once I've found what I'm looking for. The last two lines make the tab key match bracket pairs. I use this to move around all the time and <tab> is a hell of a lot easier to type than %. The next section makes Vim handle long lines correctly: set wrap set textwidth=79 set formatoptions=qrn1 set colorcolumn=85 These lines manage my line wrapping settings and also show a colored column at 85 characters (so I can see when I write a too-long line of code). See :help fo-table and the Vimcasts on soft wrapping and hard wrapping for more information. Next comes something other TextMate refugees may like: set list set listchars=tab:▸\ ,eol:¬ This makes Vim show invisible characters with the same characters that TextMate uses. You might need to adjust your color scheme so they're not too distracting. This Vimcast has more information. New Vim users will want the following lines to teach th'''
