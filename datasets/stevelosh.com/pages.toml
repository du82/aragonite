["https://stevelosh.com/blog/2013/09/teach-dont-tell"]
title = "Teach, Don't Tell / Steve Losh"
full_description = '''Teach, Don't TellPosted on September 3rd, 2013.This post is about writing technical documentation. More specifically: it's about writing documentation for programming languages and libraries. I love reading great documentation. When I have a question and the documentations explains the answer almost as if the author has magically anticipated my problem, I get a warm, fuzzy feeling inside. I feel a connection with the writer that makes me smile. I also love writing documentation. Being able to rewire the neurons in someone's brain so that they understand something they didn't understand before is extremely satisfying. Seeing (or hearing about) the "click" when a bunch of concepts suddenly fall together and make sense never fails to make my day. This post is going to be about what I think good documentation is and how I think you should go about writing it. I'm not perfect, so you should take everything with a grain of salt, but I hope you'll find it useful and thought-provoking even if you don't agree with me about everything. I'd like to say thanks to Craig Zheng and Honza Pokorny for proofreading this. Prior ReadingWhy Do We Document?TeachingA Play in Seven ActsAct 1: "Read the Source"Tools of the TradeAct 2: "Read the Tests"How to TeachAct 3: "Literate Programming"The Anatomy of Good DocumentationFirst ContactAct 4: "Read the Docstrings"The Black TriangleAct 5: "Read the API Docs"The HairballAct 6: "Read the Wiki"The ReferenceAct 7: "A New Hope" Prior Reading Before you read this post there are two other things I think you should read first. The first is Jacob Kaplan-Moss' Writing Great Documentation series. He's certainly more qualified than I am to write about this stuff, so you should check that out if you haven't already. A lot of what I say here is going to agree with and build on the ideas he talked about. The other thing you should read is The Science of Scientific Writing by George Gopen and Judith Swan. Don't be put off by the fact that it's written for scientists publishing papers in journals. Everything in that article applies equally well to programmers writing technical docs. Read the entire thing. It's worth it. Why Do We Document? Let's get started. The first thing to nail down is why we're documenting a programming language or library in the first place. There are many things you might want to accomplish, but I'm going to boil them down into a single statement: The purpose of technical documentation is to take someone who has never seen your project, teach them to be an expert user of it, and support them once they become an expert. At first glance this probably doesn't seem too controversial or interesting. But there's one word in there that makes all the difference, and it frames my entire perspective on documentation. Teaching If you want to take a person who has never played the guitar and turn them into a virtuoso guitarist, how can you do that? You teach them. If you want to take a high school student and turn them into a computer scientist, how can you do that? You teach them. If you want to take a programmer who has never seen your library before and turn them into an expert user of it, how can you do that? You teach them! Guitar lessons are usually taught in person, one-on-one, with a teacher. Computer Science is usually taught by professors in classrooms. Programming library usage is usually taught by documentation. If the goal of documentation is to turn novices into experts, then the documentation must teach. You should think of your documentation as a lesson (or series of lessons) because that's what it is. When writing technical documentation you (usually) don't have the advantage of having a one-on-one dialog with the learners. This makes it a bit more difficult, but not impossible as long as you're careful. Your documentation needs to fill the role of both the in-person lessons and the textbook. The rest of this post will be almost entirely about how to apply the "documentation is teaching" mindset to writing programming docs. A Play in Seven Acts I'm going to break up the content of this post with some venting about bad documentation. If you want to skip these little rants, go ahead. Each act in our play has two characters: a teenager and a parent. The teenager has just turned sixteen and would like to learn to drive so they can hang out with their friends without relying on their parents to drive them everywhere. Each act will demonstrate a caricature of a particularly bad form of documentation. I hope these little metaphors will help show why certain forms of documentation are ineffective cop-outs and why you should write real documentation instead. Act 1: "Read the Source" Our play starts with a son and father sitting at the breakfast table. The son is munching on some cereal before school while the father reads his iPad before leaving for work. The son says: "Hey Dad, you said you were going to teach me how to drive after school today. Are we still going to do that?" The father, without looking up from his iPad, replies: "Of course, son. The car is in the garage and I laid out a set of wrenches on the workbench. Take the car apart and look at each piece, then put it back together. Once you've done that I'll take you to the DMV for your driving test." The son quietly continued eating his cereal. If you use many open source libraries you've undoubtedly encountered some whose README says something like "read the source". Every time I see one, I die a little bit inside. Source code is not documentation. Can you learn to be a guitarist by simply listening to a piece of music intently? Can you become a painter by visiting a lot of museums? Of course not! Let me be clear: I'm not trying to say that reading source code isn't a valuable thing to do. It is! Looking at other artists' paintings is extremely useful once you know how to paint. Learning how the brakes of a car are constructed can save your life, once you know how to drive. Once your library's users know how to work with it, reading its source is absolutely worth their time. But you can't look at the finished product and understand the perspective and ideas that went into it without additional guidance. That's a job for documentation. Tools of the Trade Writing good documentation doesn't take much in the way of tools. For example: you don't need a thesaurus. Don't try to avoid using the same words by substituting synonyms. Just talk to your users like you would talk to another human being in real life! If you use the same word ten times in a row your readers probably won't even notice. But I guarantee they're going to notice if you throw in strange, uncommon words for no good reason. There are two tools I will recommend before moving on. The first isn't actually a tool, but a skill. To write great documentation, you need to be able to type. When you write docs you'll inevitably write yourself into a corner and realize you need to take a new direction. If you don't type quickly, you might be hesitant to throw away writing that doesn't really work. You need to learn to type well so you don't feel bad throwing away a chunk of a thousand words that don't fit. Steve Yegge's article Programming's Dirty Little Secret is a great rant on this topic. You should also get yourself a nice keyboard. A good keyboard won't make you a good writer (just like a good guitar won't make you a good guitarist), but it will make you want to write more just for the sheer joy of using a well-designed piece of equipment. I started practicing guitar a lot more after I got a new guitar that was much nicer than my old one. If you spend a hundred dollars, get a nice keyboard, and end up wanting to write more, it was worth it! Be thankful that a nice keyboard only costs $100 to $300 and not several thousand dollars like a nice instrument. Act 2: "Read the Tests" The next scene opens with a mother picking her daughter up from high school. "Hi Mom", she says, "are you still going to teach me to drive today?" "Yep!" she replies. "Let's get going." After ten minutes of driving they arrive at the Chevrolet factory. The girl looks around, puzzled. She asks: "What are we doing here?" The mother smiles and says: "You're in luck, honey, my friend Jim works here at the Chevy plant, and he's gonna let you watch a few crash tests of the new Malibu! Once you see a few cars smash into each other, I'll take you down to the DMV for your driving test." Another common form of "documentation" is the README instructing users to "read the tests". Tests aren't docs. Again, let's be clear: once you already know how to use a library, reading the tests is very useful. But you need documentation to make you an expert user first! You don't learn to drive by watching crash tests. But learning how your car behaves during a crash can save your life once you know how to drive. A common argument I see goes something like this: "The tests use the library, so they're a good example of how to use it!" This is true in some very superficial sense, but completely misses the mark. Most of the tests are probably going to deal with edge cases. Edge cases are things a normal user won't be encountering very often (otherwise they wouldn't be edge cases!). If you're lucky, you might get a test that verifies the library works correctly on a normal set of input. But a "normal set of input" is what the users are going to be working with the majority the time! Tests simply aren't a good guide to what a user is going to be encountering on a day-to-day basis. They can't teach a novice to be an expert. How to Teach If you accept my idea that the purpose of documentation is to teach users, the next question is obviously: "How do I teach my users?" I've been lucky enough to have the chance to teach dancing semi-formally for around 6 or 7 years, and lots of various other things informally for a long time. The only way to really learn how to teach is to do it. There's no substitute for sitting down with someone face-to-face and teaching them something. If you want to write better documentation, you need to practice teaching. I'm not talking about writing out lesson plans or anything nearly so formal. Do you have a hobby (not programming)? If so, spend a couple of hours on a weekend teaching a friend about it. You'll get some practice teaching and they'll get to learn something new. (If you don't have any non-programming hobbies, maybe you should find some.) If you like photography, teach someone the basics of exposure and composition. If you dance, teach them some basic steps. If you play an instrument, teach them how to play a simple song. If you like camping, teach them what all the gear is for. You get the idea. Don't go overboard. You don't need to give someone a degree, you just need to practice teaching a little bit. You need to practice the art of rewiring someone's neurons with your words. Once you jump into teaching something (even something simple) you'll probably realize that although you know how to do it yourself, it's a lot harder to teach someone else. This is obvious when you're working face-to-face with someone. When you tell them how to play a C major chord on the guitar and they only produce a strangled squeak, it's clear that you need to slow down and talk about how to press down on the strings properly. As programmers, we almost never get this kind of feedback about our documentation. We don't see that the person on the other end of the wire is hopelessly confused and blundering around because they're missing something we thought was obvious (but wasn't). Teaching someone in person helps you learn to anticipate this, which will pay off (for your users) when you're writing documentation. With all that said, I do want to also talk a little about the actual process of teaching. The best description of how to teach that I've seen so far is from the book How to Solve It. Everyone who wants to teach should read this book. The passage that really jumped out at me is right in the first page of the first chapter: The best [way for the teacher to help their student] is to help the student naturally. The teacher should put himself in the student's place, he should see the student's case, he should try to understand what is going on in the student's mind, and ask a question or indicate a step that could have occurred to the student himself. This, right here, is the core of teaching. This is it. This is how you do it. People don't learn by simply absorbing lots of unstructured information as it's thrown at them. You can't read a Spanish dictionary to someone to teach them Spanish. When you want to teach someone you need to put yourself in their shoes and walk along the path with them. Hold their hand, guide them around the dangerous obstacles and catch them when they fall. Don't carry them. Certainly don't just drive them to the destination in your car! The process needs to go something like this: Figure out what they already know. Figure out what you want them to know after you finish. Figure out a single idea or concept that will move state 1 a little bit closer to state 2. Nudge the student in the direction of that idea. Repeat until state 1 becomes state 2. Too often I see documentation that has very carefully considered step 2, and then simply presents it to the reader as a pronouncement from God. That isn't teaching. That's telling. People don't learn by being told, they learn by being taught. Act 3: "Literate Programming" The third act opens with a daughter talking to her mother the day before her sixteenth birthday. "Hey Mom," she says, "I don't know if you got me a present yet, but if not, what I'd really like for my birthday are driving lessons." The mother smiles and says: "Don't worry, it's all taken care of. Just wait for tomorrow." The next day at her birthday party she unwraps the present from her mom. Inside is a DVD of the show How It's Made. She looks quizzically at her mother. "That DVD has an episode about the factory that builds your car! Once you watch the whole thing I'll take you for your driving test." A horrible trend I've noticed lately is using "literate programming" tools like Docco, Rocco, etc and telling users to read the results for documentation. Programming languages and libraries are tools. Knowing how a tool was made doesn't mean you know how to use it. When you take guitar lessons, you don't visit a luthier to watch her shape a Telecaster out of Ash wood. Knowing how your car was built can help you, once you know how to drive. Knowing how your guitar was built can help you, once you know how to play. A common theme throughout these acts/rants is that all of these things I'm picking on (source, tests, literate programming, and more) are good things with real benefits once you have actual documentation in place to teach users. But until that happens, they're actually bad because they let you pretend you've written documentation and your job is done (JKM mentions this'''
year_published = 2013
clearnet = "https://stevelosh.com/blog/2013/09/teach-dont-tell"
