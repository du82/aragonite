["http://stevelosh.com/blog/2016/08/lisp-jam-postmortem"]
title = "August 2016 Lisp Game Jam Postmortem / Steve Losh"
full_description = '''August 2016 Lisp Game Jam PostmortemPosted on August 15th, 2016.The August 2016 Lisp Game Jam just wrapped up at the end of last week. I had some free time so I decided to take part, but I did something a bit different. Instead of making a new game I ported an existing one (Silt) to Common Lisp. I once read somewhere that when trying to build things and learn programming languages you should either build something you know in a language you're learning, or build something new in a language you already know, but not try to do both at the same time. I've been getting into Common Lisp over the past year, so for this game jam I decided to port my Ludum Dare 34 game from Clojure to Common Lisp. The game jam was ten days long. I didn't work on the game every day, but I did manage to finish porting it over. I improved and polished a few mechanics along the way, learned a lot, and ended up with a nice little library that sprung out of the code. I'm happy with the result. The code is on Bitbucket. You can play the game over telnet if you want to try it out: telnet silt.stevelosh.com. In this post I'm just going to jot down a few things I found interesting. Disclaimer: I'm going to simplify some of the code snippets to make them easier to read. If you want the full details you can read the actual code. Developmentncurses and cl-charmsUsing a State Machine as the Game LoopTerrain GenerationTiling Diamond SquareEntity, Aspects, and SystemsCoordinatesUser InterfaceVisibleFlavorInspectableFoodCreatures and MysteriesEnergyRandom Name GenerationSimple Data StructuresWeightlistsTicklistsProfiling and PerformanceFuture Improvements and Ideas Development Silt 2 is written in Common Lisp. It uses cl-charms (a wrapper around ncurses) to handle drawing to the terminal, and a few other Common Lisp libraries like iterate and cl-arrows. I developed it on SBCL and OS X, and the telnet server is running Debian so it works there too. It almost runs in ClozureCL, but something Unicode-related is broken with ncurses under CCL and I didn't bother debugging it. I used Roswell to build a standalone binary for "releases". This binary starts up much faster than loading everything from scratch. I use Neovim and was pleasantly surprised when running ncurses inside Neovim's terminal emulator Just Worked (especially since the cl-charms README specifically says you can't run it in emacs' terminal!). It was really nice to have the actual game running inside my text editor. ncurses and cl-charms cl-charms is a wrapper around ncurses that I used to handle drawing the game to the terminal. The original Clojure version used clojure-lanterna. The game's drawing code is pretty simple, so there's not a whole lot to say here. I loop over the screen, drawing the contents of each world coordinate at each screen coordinate, and refresh the window. cl-charms mostly worked out great. It's a bit wordy at times (always having to pass charms:*standard-window* to everything), but you can wrap it up pretty easily. I'd recommend it if you need to do console drawing in Common Lisp. cl-charms has a low-level interface that's just an FFI wrapper around ncurses, and a high-level interface that abstracts some of the Cishness away for you. I mostly used the high-level interface, but one big thing that's missing is support for colors. Working with colors in ncurses is a bit tedious, but this is Lisp so I can just abstract away all the boring stuff: (defmacro defcolors (&rest colors) `(progn ,@(iterate (for n :from 0) (for (constant nil nil) :in colors) (collect `(define-constant ,constant ,n))) (defun init-colors () ,@(iterate (for (constant fg bg) :in colors) (collect `(charms/ll:init-pair ,constant ,fg ,bg)))))) (defcolors (+color-white-black+ charms/ll:COLOR_WHITE charms/ll:COLOR_BLACK) (+color-blue-black+ charms/ll:COLOR_BLUE charms/ll:COLOR_BLACK) (+color-cyan-black+ charms/ll:COLOR_CYAN charms/ll:COLOR_BLACK) (+color-yellow-black+ charms/ll:COLOR_YELLOW charms/ll:COLOR_BLACK) (+color-green-black+ charms/ll:COLOR_GREEN charms/ll:COLOR_BLACK) (+color-pink-black+ charms/ll:COLOR_MAGENTA charms/ll:COLOR_BLACK) (+color-black-white+ charms/ll:COLOR_BLACK charms/ll:COLOR_WHITE) (+color-black-yellow+ charms/ll:COLOR_BLACK charms/ll:COLOR_YELLOW) (+color-white-blue+ charms/ll:COLOR_WHITE charms/ll:COLOR_BLUE) (+color-white-red+ charms/ll:COLOR_WHITE charms/ll:COLOR_RED) (+color-white-green+ charms/ll:COLOR_WHITE charms/ll:COLOR_GREEN)) (defmacro with-color (color &body body) (once-only (color) `(unwind-protect (progn (charms/ll:attron (charms/ll:color-pair ,color)) ,@body) (charms/ll:attroff (charms/ll:color-pair ,color))))) Using a State Machine as the Game Loop One thing many games have in common is a game loop. The original version of Silt had one, but for the rewrite I decided to structure the main flow of the game as a state machine instead. This worked out really well and I'm glad I did it. At first I looked around and tried to find a state machine library for Common Lisp, but then I realized I was being ridiculous and could just model a state machine with vanilla Lisp functions: (defun state-title () (render-title) (press-any-key) (state-intro)) (defun state-intro () (render-intro) (press-any-key) (state-generate)) (defun state-generate () (render-generate) (reset-world) (generate-world) (state-map)) (defun state-map () (charms:enable-non-blocking-mode charms:*standard-window*) (state-map-loop)) (defun state-map-loop () (case (handle-input-map) ((:quit) (state-quit)) ((:regen) (state-generate)) ((:help) (state-help)) (t (progn (unless *paused* (iterate (repeat *frame-skip*) (tick-world) (tick-log))) (render-map) (when *sleep* (sleep 0.05)) (state-map-loop))))) (defun state-help () (render-help) (press-any-key) (state-map)) (defun state-quit () 'goodbye) This worked especially well with cl-charms and ncurses because for states like the title and help screens there's no point in looping to redraw the screen over and over again while waiting for input. I just flipped ncurses into block-while-awaiting-input mode and let it free up the CPU while waiting for the user to continue. In hindsight I probably should have split out the pause state into a separate state, which would have let me use blocking input there too. Using functions for states like this is only possible because SBCL (and CCL) perform last call optimization, so the stack doesn't get blown by all the recursion happening. Terrain Generation The original Silt was made for Ludum Dare 34 in 72 hours, so I didn't spend too much time on terrain. I just created an empty world and scattered some lakes around it, which looked like this: This worked and was quick, but is pretty boring and ugly. In the past few months I've learned a lot more about terrain generation, so I fleshed things out a bit more for the new port: Now I've got oceans and mountains for the creatures to explore. Tiling Diamond Square My initial impulse was to use Perlin Noise or Simplex Noise to generate the heightmap for the world, but I ran into a problem. I wanted the world to be a torus, just like in the original game, so I needed a terrain generation algorithm that would generate tileable/wrappable heightmaps. One way to do this is to use higher-dimensional noise to get 2D noise that tiles. If you want to get a 2D heightmap that's tileable in one direction, you can use 3D noise and take a cylindrical slice of it. To get a heightmap that tiles both ways you need to use 4D noise. This article gives a really nice overview of the process. Unfortunately I couldn't find an implementation of 4D Simplex Noise in Common Lisp. black-tie and noise both only offer up to 3D noise, and I don't feel confident enough to implement it myself, even after skimming the simplex noise paper. So I decided to try a different approach and figure out how to modify Diamond Square to tile. The Wikipedia article for Diamond Square says: Another option [for the diamond step] is to 'wrap around', taking the fourth value from the other side of the array. When used with consistent initial corner values this method also allows generated fractals to be stitched together without discontinuities. This sounded great, but after thinking about it for a bit it's obviously not correct. If we have a heightmap and do what the article says, it will seem to work at first: ╔══════════════════╗ ┌─┬─┬─┬─┬─┐ ║ ┌─┬─┬─┬─┬─┐ ║ │5│ │ │ │5│ ║ │5│ │ │ │5│ ║ ├─┼─┼─┼─╱┬╲ ║ ├─┼─┼─┼─╱┬╲ ║ │ │ │ │╱│││╲ ║ │ │ │ │╱│││╲ ║ ├─┼─┼─╱─┼▼┤ ╲ ║ ├─┼─┼─╱─┼▼┤ ╲ ║ │ │ │3├─▶◉◀──? ╚═══════│3├─▶◉◀════╝ ├─┼─┼─╲─┼▲┤ ╱ ├─┼─┼─╲─┼▲┤ ╱ │ │ │ │╲│││╱ │ │ │ │╲│││╱ ├─┼─┼─┼─╲┴╱ ├─┼─┼─┼─╲┴╱ │5│ │ │ │5│ │5│ │ │ │5│ └─┴─┴─┴─┴─┘ └─┴─┴─┴─┴─┘ Wrapping like this will indeed make sure that the averages match up, but there's two problems. First: the corners are all the same value, which means that when you put four heightmaps next to each other there's an unnatural flat area of four identical height values next to each other. This probably wouldn't be noticeable in practice, but if you want to do things right it won't be acceptable. But the real problem is the jitter. If the jitter on one side of the map happens to be large and positive and the jitter on the other side happens to be large and negative, you'll get a jarring "cliff" when you try to tile them: The solution I came up with is to reduce the size of the heightmap by 1. Instead of the heightmap being \(2^n + 1\) in each dimension we can make it \(2^n\) and adjust the coordinate-wrapping function appropriately. Importantly, we don't change the calculation of the radius values as we iterate over the array, so this means quite often we'll be "reaching" for that final row/column: ? ? ┌─╲─┬─┬─╱ │ │╲│ │╱│ ├─┼─◢─◣─┤ │ │ │◉│ │ ├─┼─◥─◤─┤ │ │╱│ │╲│ ├─╱─┼─┼─╲ │5│ │ │ │? └─┴─┴─┴─┘ When we try to access that nonexistent coordinate we just wrap around back to zero. Notice that we also only need to initialize a single corner cell now. It's a simple change, but the result is much nicer: Entity, Aspects, and Systems Terrain generation is pretty, but the next step in the port was to add some plants, creatures, and artifacts. In the original game I just represented things in the world as vanilla Clojure maps, but that was getting kind of messy and I wanted to try a different approach this time. Recently I read through Game Engine Architecture (a fantastic book) and made a few games in Unity, which together made me want to try using an Entity/Component System this time around. There are a couple of ECS libraries out there for Common Lisp like cl-ecs and ecstasy, but in true Lisp fashion I ended up not being quite satisfied with any of them and writing Yet Another God Damn Library. It's called Beast. It's subtly different than the others in that it prefers to be a really thin layer over CLOS and uses inheritance instead of composition. It uses the word "aspect" instead of "component" to try to overload that word a bit less, so it's the "Basic Entity/Aspect/System Toolkit". It ended up being about 150 lines of code (not including docstrings), so I managed to avoid going down too much of a rabbit hole during the jam. If you want to know all the details, check out its documentation (it has actual documentation). But here I'll just talk about a couple of the particular bits of Silt that I used it for. Coordinates The first thing I needed was a way to keep track of where things are in the world. If the world space were continuous a quadtree would have been my first choice, but in Silt the world is split into discrete integer coordinates. Creatures move directly from \((x, y)\) to \((x+1, y+1)\). I decided to use a simple array of lists to represent this: (defparameter *coords-contents* (make-array (list +world-size+ +world-size+) :initial-element nil)) Each value in the array is a list of the entities that are currently there. This means looking up what things are at a given coordinate is a single fast aref. I tried using a hash table instead of an array at first, thinking that if the world were fairly sparse it would be wasteful to allocate an array with a ton of nil values in it. But the array method is much faster for looking things up (which happens a lot) and memory is cheap, so I decided against the hash tables. It worked great in the end. Entities need to know where they are in the world, so I defined a Beast aspect for that: (define-aspect coords x y) Then I defined a few functions to handle moving entities into, out of, and around the world: (defun coords-insert-entity (e) (push e (aref *coords-contents* (coords/x e) (coords/y e)))) (defun coords-remove-entity (e) (zap% (aref *coords-contents* (coords/x e) (coords/y e)) #'delete e %)) (defun coords-move-entity (e new-x new-y) (coords-remove-entity e) (setf (coords/x e) (wrap new-x) (coords/y e) (wrap new-y)) (coords-insert-entity e)) (defun coords-lookup (x y) (aref *coords-contents* (wrap x) (wrap y))) Entities might also like to know what's near them: (defun nearby (entity &optional (radius 1)) (remove entity (iterate outer (with x = (coords/x entity)) (with y = (coords/y entity)) (for dx :from (- radius) :to radius) (iterate (for dy :from (- radius) :to radius) (in outer (appending (coords-lookup (+ x dx) (+ y dy)))))))) This ends up compiling down to a nice tight loop of \((2 * radius + 1)^2\) arefs. I only wish iterate had a nicer syntax for looping over nested indices like this. I'm sure it's possible to write an iterate driver for it -- maybe someday I'll try making one. I also needed a way to get entities into the world array when they're created and remove them when they die. Beast (well, actually CLOS) makes this trivially easy with auxiliary methods: (defmethod entity-created :after ((entity coords)) (coords-insert-entity entity)) (defmethod entity-destroyed :after ((entity coords)) (coords-remove-entity entity)) User Interface Once I had a way of know where things are, the next step was to display them on the screen. I broke this into a few separate aspects. Visible The visible aspect is for things that are drawn on the screen with a particular glyph and color: (define-aspect visible glyph color) ;; ... (define-entity tree (coords visible ...)) (defun make-tree (x y) (create-entity 'tree :coords/x x :coords/y y :visible/glyph "T" :visible/color +color-green-black+ ;; ... )) The drawing code can then figure out what to draw for each screen coordinate: (defun draw-map () (iterate (for sx :from 0 :below *screen-width*) (for wx :from *view-x*) (iterate (for sy :from 0 :below *screen-height*) (for wy :from *view-y*) (for entity = (find-if #'visible? (coords-lookup wx wy))) (if entity (with-color (visible/color entity) (write-string-at (visible/glyph entity) sx sy)) ;;; otherwise draw the terrain (...))))) Again: my kingdom for a (for-nested ...) iterate driver! But the core is just using (find-if #'visible? (coords-lookup wx wy)) to find the first visible thing and then drawing it: I used find-if instead of remove-if-not because we can only draw one'''
year_published = 2016
clearnet = "http://stevelosh.com/blog/2016/08/lisp-jam-postmortem"
