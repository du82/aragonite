["https://stevelosh.com/blog/2012/10/a-modern-space-cadet"]
title = "A Modern Space Cadet / Steve Losh"
full_description = '''A Modern Space CadetPosted on October 3rd, 2012.I spend a lot of my time (easily over 8 hours a day) at a keyboard. As you might have guessed from my previous entries about Vim and Mutt I'm not averse to spending a few hours to improve an environment I'm going to be spending tens of thousands of hours in over the next few years, so it shouldn't be a shock that my keyboard is something I've heavily tweaked. This post is about what I've done to make my typing experience more pleasant and efficient. If you scoff at customization you won't enjoy this post. What if I have to use someone else's machine? I can count on one hand the number of times I've had to use someone else's machine ever since I got an iPhone five years ago. I like customizing my machine to save me time. Yes, there may be some excessive stuff here, but not only does it make me type faster, it's fun! The OriginalModern HardwareApple Wireless KeyboardDas Silent UltimateDas Clicky UltimateHappy Hacking Keyboard Professional 2Topre Realforce 103VerdictModern SoftwareKeyboard MaestroPCKeyboardHackKeyRemap4MacBookControl/EscapeHyperBetter ShiftingShift Key Training WheelsShift ParenthesesKey LayersGreekMathConclusion The Original There have been many, many keyboards produced in the world since the first ones emerged. One of the most famous, at least in programming circles, is the Space Cadet Keyboard. Originally used on Lisp machines and some other systems, it's not a keyboard for the minimalist. There are four "bucky keys" (modifier keys): control, meta, super, and hyper (plus shift, of course). There are also special keys that let you type Greek letters and mathematical symbols. The Space Cadet is an example of a keyboard for someone not afraid to invest some time to work faster. It's also absolutely gorgeous. The color scheme and typography is beautiful. This is the keyboard I used (loosely) as inspiration when crafting my current setup. Modern Hardware I've tried a number of modern keyboards in the past few years. They're all high-quality and more expensive than the $20 plastic toys that come with desktops. But I spend 60 or more hours a week at a keyboard and maybe one hour a week in my car, so I'm getting pretty good use out of the dollars I've put into keyboards if you compare them to the cost of my car! I'll go through the keyboards I've used in chronological order. I'm not going to write too much about the basics of mechanical keyboards and switches. If you want to learn about that, this post and this guide are good places to start. Apple Wireless Keyboard For a long time I used Apple wireless keyboards. They're light and compact, but still feel extremely solid thanks to their metal construction. They also stay really clean because there gaps between keys are tiny, instead of the funnel-shaped gaps of other keyboard that send dirt straight to the bottom. They're readily available at any Apple store, and of course they're wireless which is great. They also feel exactly like the keyboards on Apple's laptops, so your muscle memory is perfectly suited to either one if you switch between them often. Unfortunately typing on them is nowhere near as nice as the rest of the keyboards in this list. Apple keyboards have (I think) only 2mm of travel, but you have to bottom-out the keys to register the keypresses. Das Silent Ultimate The first mechanical keyboard I got was the Das Silent Ultimate. (This photo is actually my Das Clicky since I don't have the Silent any more, but they're exactly the same externally.) Compared to the Apple keyboards the switches on the Das Silent (Cherry Brown switches) feel far softer. You're not smashing your fingers against metal on every keypress. Overall the Das Silent isn't too bad. It's built like a tank so I have no doubt it'd last forever. It also has the option of blank keys, which I prefer. I didn't stick with this keyboard for long. First, its glossy finish looks good when it's in the box and terrible forever after that. It's way too easy to get dirty. Something also just feels "off" about the key switches to me, especially after I've tried the other boards in this list. They feel, for lack of a better term, "mushy" to me. Das Clicky Ultimate The next keyboard I tried was the Das Clicky Ultimate. This is exactly the same as the Das Silent except for the switches, which are the "clicky" Cherry Blues. These feel way better to me than the browns. The mushiness I described for the Silent is completely gone. They are not kidding when they say it is loud. If you're typing a lot expect to have a constant background noise of clicks. But to me the sound is soothing, especially once you get into a rhythm of typing for extended periods. Your coworkers might disagree, so tread carefully. The Das Clicky still has that godawful glossy finish, unfortunately. After a while I decided to try out what I had heard people raving about: Topre switches. Happy Hacking Keyboard Professional 2 The Happy Hacking Keyboard was my next keyboard. It's much more expensive than the Dases were, so it was a tough call, but I'm glad I got it. The HHKB uses Topre key switches, which to me feel like Cherry Browns done right. There's no "click" like the Blues, but instead of the mush of the Browns you get a satisfying "thunk" or "sshhhunk" on each press. It's a great balance: you have a nice satisfying sound that's less annoying for other people. The finish on this keyboard is perfect. It is the most unassuming, elegant, wonderful matte finish I've seen on any keyboard. The plastic is just textured enough to feel solid under your fingers (not slippery like Macbook keys) but not enough to feel like you're typing on sandpaper. If you're short on space, or want to carry your keyboard with you, the HHKB is for you. It's tiny, but still feels solid and not flimsy at all. I have two main complaints about the HHKB. First, there's two spaces on the bottom row where they could have put a modifier key but didn't. The space on the right has the logo, which is fair enough, but the one on the left is simply blank for no good reason. My other complaint is the idiotic default placement of the fn key and the arrow keys. I don't mind having to use fn to get to the arrows as a concession to a compact design, but why on earth would you place them so that you have to chord on a single hand to hit them? This problem would be completely solved if the fn key were moved from its current position (right of the right shift key) down to the empty lower-left corner. Then you could use your left hand to hold fn while your right worked the arrow keys, no single-hand contortion required. So after a while with the HHKB I got sick of the arrow key problem. I loved the Topre switches though, so the next choice was pretty obvious. Topre Realforce 103 The Topre Realforce 103UB was my next keyboard, and is the one I'm still using to this day. I believe the model I bought is now discontinued, but it's been replaced by the 104UB which is exactly the same except for an extra key on the right side. If I could swap my current keyboard for one of those I would. In fact, if anyone wants to buy my used 103UB for a bit of a discount I'd be totally willing to sell it to get the 104UB. Anyway, this keyboard has a few disadvantages. First, unlike every other keyboard here (except the wireless Apple ones) it is not a USB hub. This isn't a huge deal (I have external USB hubs), but it did come as a big surprise. Second, it's big. Really big. If you don't have plenty of room on your desk you might want to look at the tenkeyless varieties which ditch the number pad section to save space. I have room and I love having a number pad, so I got the behemoth-sized model. Also for some reason I can't fathom there's no way to get blank, black keycaps for this keyboard. You can get blank Topre keycaps in lime green, pink, yellow, and lots of other colors, but not a simple black! Now for the good parts. This thing is built like a tank. If you needed to defend your home from an intruder, it would make an acceptable blunt weapon with which to do so (and you'd probably be able to plug it right back in and start typing again). The finish is the same as on the HHKB (gorgeous), but I have to take a point off for the non-blank keycaps. I don't need to look at the keys while I type, so why marr the luxurious finish with lettering? The Realforce also uses Topre switches, but it has another trick up its sleeve that makes typing on it even nicer than the HHKB. The version I have is the "variable-weighted" one, which means that the keys under your weaker fingers take less force to press than the ones under your stronger fingers. This is fantastic for long sessions of typing. Instead of my pinkies getting tired my fingers seem to all tire out at the same rate now. Topre does make a "uniform" version that doesn't have this trick, but I really like variable weight keys myself. Verdict Right now I'm using the Topre Realforce for my day to day work. I've fallen in love with how the Topre switches feel (I prefer them over all the others except maybe the Cherry Blues for the sound) and the Happy Hacking Keyboard is just too cramped. If I were short on space the HHKB would be great, but I have plenty of room on my desk, so why not make use of it? Here's a photo of all the keyboards (along with a 13" Macbook Air) so you can see the differences in size. Modern Software Now that I've talked about the hardware it's time for the software. I use OS X exclusively, so everything I say here is OS X specific. I'm sure there are Windows and Linux equivalents somewhere though. I use three software programs that, together, give me just about unlimited flexibility in customizing how my keyboard works in OS X. Keyboard Maestro Keyboard Maestro is a utility for binding macros to keyboard shortcuts in OS X. It may not have the best user interface, but it can do a lot, and once you set up your shortcuts you never have to look at it again. It's $36. Right now I use it for application switching, with a few twists I'll cover later on. I switched to Keymando for a while. It was great being able to configure it in a programming language with a plain text file I could easily work with in version control, but compared to Keyboard Maestro it's far slower and far buggier. I'm now back to only using Keyboard Maestro. PCKeyboardHack PCKeyboardHack lets you map one key on your keyboard to another at a very low level. For example, you can change just the right Option key to send F19 instead. I use this for one single key which you'll see in the next section. It's free and open source. KeyRemap4MacBook KeyRemap4MacBook is how I do the bulk of my keyboard customizations. Like all of the other applications its user interface is horrible, but it can do damn near anything you might want. You could probably replace Keyboard Maestro with it, at least for the kind of stuff I do. It's also free and open source. The bulk of what I describe in this post is going to use KeyRemap4MacBook. I'm not going to give you a tutorial in it here — read its documentation if you want to learn how to use the things I'm going to show. Control/Escape These first few mappings aren't directly from the Space Cadet keyboard, but they were inspired by its spirit of making an efficient tool for text editing. The Capslock key on modern keyboard has become the punchline of many a joke, and for good reason: there's no reason to dedicate such an important key to a function like capslock. Many people rebind it to a more useful key like Control, Option, Escape, or Backspace. I rebound it to Control for a while and then realized that with KeyRemap4MacBook I could get even more mileage out of it. The important thing I thought of one day is that it's possible to divide keys on the keyboard into three groups: Keys you hold down to change how other keys behave, but that (usually) don't do anything if you use them on their own (like Shift and Control). Keys that you press and release but don't want to "repeat" as you hold them (like Escape or Insert). Keys that you sometimes press and release, but sometimes want to repeat (like holding Space to insert a bunch of spaces, or Backspace to kill a bunch of characters). Can you see where this is heading? The last group is pretty normal, but the first two groups are special. Specifically: there are two different ways to use them and they're each only useful in one of those ways. This means that we can combine them onto a single key without losing any useful functionality! I'm clearly not the first one to think of this, because KR4MB includes built-in support for creating these kinds of mappings. First I've mapped Capslock to Control at the OS X level by going into the Keyboard preference pane in System Preferences, clicking the Modifier Keys button in the lower right, selecting the keyboard in the dropdown list (this is surprisingly easy to miss), and changing the Capslock setting: Then I've selected the following premade option in KeyRemap4MacBook: Control_L to Control_L (+ when you type Control_L only, send Escape) Now the Capslock key on the keyboard does the following: If held down and pressed with another key, it acts like Control. If pressed and released on its own, it acts like Escape. That's two extremely important keys (at least for Vim users) on a single key in one of the prime locations on the keyboard! No more awkward stretches! If you try this and want to force yourself to learn to use it, disable the normal escape key. You'll learn fast. Update: I forgot to mention that if you use this (and the Shift improvements below) you'll probably want to change the "[Key Overlaid Modifier] Timeout" setting in the KR4MB preferences: This setting controls the maximum length of a keypress that will register as "single press". It's easier to understand with an example. The default is 1000ms, which means that if you press and hold the Capslock key for 900ms and release it, it will count as Escape. If you hold it for 1001ms before releasing, it counts as pressing and releasing Control instead. If you're finding that you're sometimes holding Control out of habit and then releasing it, but it's still firing as an Escape, you may want to turn this setting down to a lower value. I have mine set to 300ms. This is a lot more noticeable with the Shift mappings I'll describe shortly, so keep it in the back of your mind if you try those out. Hyper Modern OS X supports four "modifier" keys: Control, Option, Command, and Shift. The Space Cadet keyboard had five: Control, Meta, Super, Hyper, and Shift. Shift and Control map to each other, and OS X's Option key is pretty much the same as Meta (in fact I think Emacs users usually use Alt as Meta). I arbitrarily decided that Command was the OS X equivalent of Super. That left Hyper. Since OS X doesn't natively support a fifth modifier key I had to come up with a way to fake it. First, I realized that because I use Capslock for Control I'''
