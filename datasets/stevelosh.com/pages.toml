["https://stevelosh.com/blog/2012/10/the-homely-mutt"]
title = "The Homely Mutt / Steve Losh"
full_description = '''The Homely MuttPosted on October 1st, 2012.Now that Sparrow is effectively dead many of its users will be looking for a new email client. If you're not afraid of the terminal you may want to give Mutt a try. Mutt certainly isn't the prettiest email client around, and its setup/configuration process is one of the ugliest out there. But once you get it set up it's got a lot of advantages over many other email clients. In this post I'll show you how to set up Mutt on OS X like I do. How I Use EmailOther Guides and ResourcesOverviewGetting EmailWhy Local Email?The AlternativeInstalling offlineimapConfiguring offlineimapRetrieving PasswordsRunning offlineimapMutt!InstallingConfiguringRunningReading EmailThe IndexThe PagerAttachmentsURLsWriting EmailSending EmailPostponing DraftsContactsAutocompletingAdding ContactsSearching EmailVanilla SearchingVanilla LimitingFull-Text SearchingConclusion How I Use Email This setup is going to be specific to the way I work with email. Notably: I have a Google Apps account that provides my steve@stevelosh.com email address. I have many other email addresses, but they all simply forward to my main one. All mail I send comes from steve@stevelosh.com. I store my contacts in the OS X address book. All email comes into my inbox (or to a folder for a specific mailing list). Once I'm done with an email, I remove it from my inbox and it lives in the "All Mail" archive. I don't sort email into folders after it arrives. I sometimes read email offline and mark it for deletion, then sync that deletion back to the server once I get online again. Sometimes I write email without an internet connection and send it once I get connected again. My email setup is tailored around those requirements, so that's what it does best. Mutt is very configurable though, so if you work differently you can probably bend it to make it do what you want. In particular, extending this setup to work with multiple email accounts wouldn't be too much trouble. I used to work with two separate accounts until I said "screw it, I'll just use the one". Other Guides and Resources I've used a lot of other guides to figure out how to get this giant Rube Goldberg machine of an email client working. Here are a few of them: http://thomas.pelletier.im/2010/10/low-memory-mail-client/ http://www.andrews-corner.org/mutt.html http://jstorimer.com/shells/2010/01/19/using-mutt-with-gmail-on-osx.html http://www.vijaykiran.com/2010/01/27/mutt-for-gmail-imap-on-mac-os-x/ http://hynek.me/articles/my-mutt-gmail-setup/ https://wiki.archlinux.org/index.php/Mutt http://linsec.ca/Using_mutt_on_OS_X http://www.mutt.org/doc/manual/manual.html http://pbrisbin.com/posts/two_accounts_in_mutt http://upsilon.cc/~zack/blog/posts/2011/01/how_to_use_Notmuch_with_Mutt/ Overview I'm going to give it to you straight: getting this whole contraption set up is going to take at least an hour from start to finish, not counting the time it'll take to download all of your email and install stuff. Set aside an evening if you're serious about this. It's an investment, and you might not want to make it. If not, go use Thunderbird, er, Sparrow, er, I don't know, the Gmail web interface or something. Mutt on its own doesn't do very much, so we're going to combine it with a few other things to get the job done. Here's a bird's eye view of what it'll look like when we're done: If this diagram doesn't make you run screaming you might just be masochistic enough to make it through the initial setup of Mutt. If you do, you'll be rewarded with email bliss that won't go away when Google or Facebook decide to toss some money around. Getting Email First thing's first: we're going to pull down our email from Gmail to our local machine. All of it. It'll take a while the first time you sync, but has a few benefits. Why Local Email? Having a local copy of all of your email means you've always got access to it, no matter where you are. Looking for that one person's address they emailed you six years ago when you're trying to find their house and you don't have an internet connection? No problem, it's on your hard drive. This also acts as a backup in case Google ever decides to kill your Gmail account. It'll be stored in a common format that a lot of programs can read, so you've got a safety net. And the email is stored as normal files, so if you use something like Time Machine or Backblaze that's yet another free backup. In this setup all of your email is stored as plain text. If you want it encrypted just use OS X's full-disk encryption and you're set. I use offlineimap to pull email down from Gmail and get it on my hard drive. Offlineimap will also sync any changes you make to this local copy back up to Gmail. The Alternative You may not care as much about reading your email offline as I do. If you can tolerate always needing an internet connection to read your mail, you can skip this painful section and follow this guide instead. You'll probably still find the other sections of this post interesting though. Installing offlineimap I've gone through a number of laptops in the past few years, and each time I spend a painful half hour or so screwing around with the latest version of offlineimap's backwards-incompatible changes. If you're determined to run the latest version of offlineimap, you can install it with pip or something. If you just want to download your fucking email and get on with your life, you can follow the instructions I've laid out for you here: git clone git://github.com/spaetz/offlineimap.git cd offlineimap git checkout 679c491c56c981961e18aa43b31955900491d7a3 python setup.py install That's the version I'm using. It works. You can use a newer one if you want, but expect to spend some time figuring out how to fix the configuration in this post to work with whatever breaking changes have been made since then. The last time I tried this I got to rewrite all my nametrans stuff. That was fun. Configuring offlineimap Once you've got offlineimap installed, you'll need to create a ~/.offlineimaprc file. You can keep it in your dotfiles repo and symlink it into place if you want. Here's a sample to get you started: [general] ui = TTY.TTYUI accounts = SteveLosh pythonfile=~/.mutt/offlineimap.py fsync = False [Account SteveLosh] localrepository = SteveLosh-Local remoterepository = SteveLosh-Remote status_backend = sqlite postsynchook = notmuch new [Repository SteveLosh-Local] type = Maildir localfolders = ~/.mail/steve-stevelosh.com nametrans = lambda folder: {'drafts': '[Gmail]/Drafts', 'sent': '[Gmail]/Sent Mail', 'flagged': '[Gmail]/Starred', 'trash': '[Gmail]/Trash', 'archive': '[Gmail]/All Mail', }.get(folder, folder) [Repository SteveLosh-Remote] maxconnections = 1 type = Gmail remoteuser = steve@stevelosh.com remotepasseval = get_keychain_pass(account="steve@stevelosh.com", server="imap.gmail.com") realdelete = no nametrans = lambda folder: {'[Gmail]/Drafts': 'drafts', '[Gmail]/Sent Mail': 'sent', '[Gmail]/Starred': 'flagged', '[Gmail]/Trash': 'trash', '[Gmail]/All Mail': 'archive', }.get(folder, folder) folderfilter = lambda folder: folder not in ['[Gmail]/Trash', 'Nagios', 'Django', 'Flask', '[Gmail]/Important', '[Gmail]/Spam', ] It's kind of long, so let's go through it line by line and see what's going on. [general] ui = TTY.TTYUI accounts = SteveLosh pythonfile=~/.mutt/offlineimap.py fsync = False First we tell offlineimap to use the TTY.TTYUI ui. Yes, this program that syncs your email has multiple user interfaces. I guess if you can't decide what color the bikeshed should be you can just build a whole bunch of bikesheds instead. Then we specify the accounts. There's only one because as I said before: I only use a single email account that all my addresses forward to. If you wanted to have many, you'd change this line. The pythonfile is just a file that offlineimap will parse (as Python) before loading the rest of the config, so you can define custom helper functions more easily. We'll see more of this later. We're also telling offlineimap that it doesn't need to fsync after every single operation. This will speed things up, and since it's just a local copy it's typically not a big deal if we lose an email here and there from a crash (it'll just be synced the next time anyway). [Account SteveLosh] localrepository = SteveLosh-Local remoterepository = SteveLosh-Remote status_backend = sqlite This next section hooks up a few things. First, it tells offlineimap which local and remote repositories to use for the account. Manual configuration instead of sane defaults is a recurring theme we'll see throughout this process. Hey, I titled the entry "The Homely Mutt" for a reason. We're also going to use a SQLite-based cache for this account. If you don't already have SQLite you'll want to get it with brew install sqlite. [Repository SteveLosh-Local] type = Maildir localfolders = ~/.mail/steve-stevelosh.com nametrans = lambda folder: {'drafts': '[Gmail]/Drafts', 'sent': '[Gmail]/Sent Mail', 'flagged': '[Gmail]/Starred', 'trash': '[Gmail]/Trash', 'archive': '[Gmail]/All Mail', }.get(folder, folder) Now we're getting to the meat of the configuration. This "local repository" is going to be the mail as it sits on our hard drive. We're going to use the Maildir format because it plays nicely with Mutt (and tons of other stuff). Then we specify the path where we're going to keep the mail. This is going to take a lot of space if you've got a lot of mail. Attachments are downloaded too. When I said you're getting an offline copy of all your email I meant all of it. I think offlineimap needs the ~/.mail directory created for it. It's been a while since I did this, so I might be wrong, but if it complains about not being able to access the mail folders just go ahead and mkdir ~/.mail. Next we have the craziest part of the configuration: name translation. Here's the issue: offlineimap needs to know how to translate the names of folders on the IMAP server to folder names on your hard drive. Also, Gmail doesn't actually use folders but its own concept called "labels". But since the IMAP protocol doesn't know about labels, it fakes them by making them appear to be folders. User-created labels in Gmail (like "Mercurial" or "Clients") will appear as folders with those names through IMAP. Built-in, special Gmail folders have names that start with [Gmail]/. We need to turn those into something sane for our hard drive, so that's what this nametrans setting is for. It's a Python function that takes the remote folder name and returns the name that should be used on your local hard drive. Yes, you read that right. This is Python code embedded in the right hand side of an INI file's setting assignment. I am not fucking with you, this is seriously how you do it. Go ahead and crack open that beer now. So the "Sent Mail" folder in your Gmail account will be synced to ~/.mail/steve-stevelosh.com/sent. Cool. (No, I don't know what would happen if you created a label called [Gmail]/All Mail in Gmail. If you try please let me know, but I take no responsibility if it ends with all your email being deleted.) [Repository SteveLosh-Remote] maxconnections = 1 type = Gmail remoteuser = steve@stevelosh.com remotepasseval = get_keychain_pass(account="steve@stevelosh.com", server="imap.gmail.com") realdelete = no nametrans = lambda folder: {'[Gmail]/Drafts': 'drafts', '[Gmail]/Sent Mail': 'sent', '[Gmail]/Starred': 'flagged', '[Gmail]/Trash': 'trash', '[Gmail]/All Mail': 'archive', }.get(folder, folder) folderfilter = lambda folder: folder not in ['[Gmail]/Trash', 'Nagios', 'Django', 'Flask', '[Gmail]/Important', '[Gmail]/Spam', ] Finally, the home stretch. The last section described the folder on our local hard drive, and this one describes our Gmail account. First, we tell offlineimap to only ever use a single connection at a time. You can try increasing this number for better performance, but in my experience Google is not afraid to enforce its rate limits and would cut me off fairly often when I tried that. Just leave it at one if you want to be safe. Next is the type. Luckily offlineimap provides a Gmail type that handles a lot of the craziness that is Gmail's IMAP setup. Nice. Then we have the username. Nothing special here, except that if you have a non-apps account (i.e.: an actual vanilla Gmail account) you may or may not need to include the @gmail.com in the username. I don't know. If one doesn't work, just try the other. Next we have remotepasseval. This is a bit of Python code (drink!) that should return the password for the account. What is this get_keychain_pass function? Well, remember when we saw the pythonfile setting back in the general section? It's a function defined in there. I'll talk about that in the next section, for now just accept that it works. Next we set realdelete to no. If this is set to yes, then deleting an email in your inbox would actually delete it entirely. When you set it to no, then deleting an email from your inbox (or any label's folder) will leave it in Gmail's All Mail. If you want to really delete an email, you'll need to delete it from All Mail (which is named archive on our local filesystem, remember?). I feel like this is a good compromise. I rarely care about actually deleting mail, given that I have many unused gigabytes available on Gmail. Next we have another nametrans setting. This is a Python function (drink!) just like the one for the local repository, except it goes in the other direction. It takes the name of a local folder and returns the name of the folder on the IMAP server. Knowing this, it should be easy to understand this setting. Finally, we have folderfilter. This is a Python function (drink!) that takes a remote folder name and returns True if that folder should be synced, or False if it should not be synced. I've chosen to skip syncing my Spam and Trash folders, as well as a few mailing list labels I don't check all that often. Customize this to your own taste. Retrieving Passwords We're almost ready, but there's one more thing we need to do, and that's implement a secure way for offlineimap to get access to our Gmail password. If you don't care too much about security, you can configure offlineimap with a plaintext password right in the config file. But don't do that. It'll only take a minute to do this securely. First, you need to add your Gmail password into your OS X keychain. Open the Keychain Access app and press the + button: Then fill out the form. The "Keychain Item Name" should be http://imap.gmail.com. The "Account Name" should be your email address. The password should be your password: Press "Add". Now repeat the process for the SMTP server. The "Keychain Item Name" should be smtp://smtp.gmail.com. The "Account Name" should be your email address. The password should be your password: Now we need to create the offlineimap.py file we pointed offlineimap to earlier. It needs to contain the get_keychain_pass function, which takes an accoun'''
