title = "Links / Steve Losh"
full_description = '''LinksLast updated on June 20th, 2016.This page is a collection of links to blogs/resources I find interesting. It's mostly just a place for me to dump links that I want to remember to check every now and then when I'm bored. I figured other people might find it interesting too. BlogsArticlesYouTube ChannelsGame Development Beginner ResourcesCommon Lisp Utility Libraries Blogs Habrador: Various game programming-related articles. Martin O'Leary: Blog with some really good articles on procedural generation. Michael Malis: Lots of Lisp stuff (usually macro-related). Paul Khuong: Mostly Lisp/SBCL-related stuff. Peteris Krumins' Top 100 Books: Great list of books to read. Red Blob Games: Wonderful blog with really good posts about lots of different video game-related topics. The Digital Antiquarian: Immense amount of information on the history of "computer entertainment". Articles These are some articles that have left a lasting impression on me (this doesn't mean I endorse everything in them). Black Triangles Execution in the Kingdom of Nouns Programming's Dirtiest Little Secret The Cardinal Rule of Functions Thinking about Thinking How to Report Bugs Effectively The Best of Intentions The Rise of Worse is Better Handwriting Repair Programming Sucks The Long, Painful History of Time The Elves Leave Middle Earth — Sodas Are No Longer Free A Mathematician's Lament A Taxonomy of Tech Debt Improper Nouns Why numbering should start at zero Unix Recovery Legend Fixing Unix/Linux/POSIX Filenames How Complex Systems Fail and The Hallmarks of Cancer Software Disenchantment The short, tormented life of computer genius Phil Katz The Absolute Minimum Every Software Developer Absolutely, Positively Must Know About Unicode and Character Sets The case of the 500-mile email Project managers, ducks, and dogs marking territory Lisping at JPL Unix as IDE The illustrated guide to a Ph.D. I want off Mr. Golang's Wild Ride PHP: a fractal of bad design I should have loved biology Reverse Engineering the source code of the BioNTech/Pfizer SARS-CoV-2 Vaccine Computers can be understood What if I were 1% charged? Please, enough with the dead butterflies! Unit testing in Coders at Work "The Door Problem" The door close button Inadvertent Algorithmic Cruelty YouTube Channels 3Blue1Brown: Videos on various math topics. His series on linear algebra in particular is fantastic. Coding Math: A series of 50ish basic math lessons aimed at the kind of math you'll used in video games. Every lesson shows the concepts implemented in little Javascript demos, and it's really helpful to see how you actually use something once you learn the basic idea. Game Maker's Toolkit: Videos about game design. Makin' Stuff Look Good: Videos about how to make things look good in Unity. The best part of the channel is the "shader case studies" where he looks at visual effects in various games and shows how to recreate them with a shader. Game Development Beginner Resources These are some nice books and websites geared toward teaching beginners how to make video games. Coding Math: A YouTube channel with 50ish basic math lessons aimed at the kind of math you'll used in video games. Every lesson shows the concepts implemented in little Javascript demos, and it's really helpful to see how you actually use something once you learn the basic idea. Invent Your Own Computer Games with Python: A book about making computer games with Python. Land of Lisp: A book about writing video games with Lisp. Unfortunately it's starting to bitrot, but it can still be a fun read if you're specifically interested in Lisp. Learn to Code by Making Games: A Udemy course about making video games with Unity. It's not free, but it's worth the price. Programming Guide for Video Games: A page of links to even more resources for beginners. Common Lisp Utility Libraries Anyone who writes enough Common Lisp eventually seems to end making their own library of useful stuff (myself included). If you want to write a portable library for other people to use, please don't make the world download your own personal utility library. But it's a lot of fun to peek at other people's utilities, so here's a few to get you started. I personally like printing them out and reading them on the bus. Only non-GPL libraries are listed here (though several LLGPL'ed ones are included). alexandria cl-jpl-util cl-losh clutils de.setf.utility fare-utils incf-cl kmrcl m-util metatilities-base metatilities monkeylib-utilities pergamum quickutil rs-cll s-utils serapeum utils-kt'''
