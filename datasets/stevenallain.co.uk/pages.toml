full_description = "It is weird to me to watch a nature documentary, especially one which by title appears to be a spinoff of an Attenborough series and not have him narrate it. Instead however, Life on Our Planet which is available on… As a scientist with a keen interest in mythology and palaeontology, I recently visited the Chatham Historic Dockyard to visit the Monsters of the Deep exhibition, that was co-curated by Darren Naish of TetZoo fame. Monsters of the Deep was… On the 11th November, I visited Writtle University College for the annual conference of the European Turtle Alliance. Despite being reptiles, turtles and tortoises are not my forte and so I decided to try to fill that gap in my… A decade ago in 2013 when the discovery of the salamander chytrid fungus (Batrachochytrium salamandrivorans; Bsal) was published, my heart sank. What really scared me was the potential impact on wild newt and salamander populations in Europe, following the decline… The Sedgwick Museum of Earth Sciences tucked away in Downing College, Cambridge. Despite being hidden out of view of the public, it is well visited and represents a captivating journey through the geological wonders of our planet. This museum promises…"
