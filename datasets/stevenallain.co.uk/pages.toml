title = "#ToyTuesday: Toymany Frogs – Steve's Herpetological Blog"
description = "You may have read my post a couple of weeks back, where I introduced the fact that I was now working to review a number of figurines of amphibians and reptiles, produced by various toy companies. T…"
full_description = 'Homepage#ToyTuesday#ToyTuesday: Toymany Frogs #ToyTuesday #ToyTuesday: Toymany Frogs Steven Allain Posted on 11th February 2025 You may have read my post a couple of weeks back, where I introduced the fact that I was now working to review a number of figurines of amphibians and reptiles, produced by various toy companies. The first of these that I want to take a more detailed look at is a 12-piece amphibian figurine set produced by Toymany. It is extremely eye-catching for a couple of reasons. The first is that all of the figurines are highly detailed and realistic, the second is that the set is extremely well priced. If you’re after a collection of amphibian figures, then this may very well be the set for you. These figurines are ideal for both play and educational purposes, helping children and collectors alike learn about amphibians in an engaging way. I am trying to find ways to help use them with my teaching and outreach after having a positive reaction from my students when I introduced them to the set recently. The set showcases twelve popular species that we’ll take an individual look at below but what I want you to do is keep an eye on the attention to detail in textures and markings that highlight the unique characteristics of each species. American Bullfrog The American bullfrog (Lithobates catesbeianus) is a large, powerful amphibian native to North America, known for its deep, resonant call that resembles the sound of a bellowing bull (hence this species’ name). With its olive-green skin, robust body, and strong hind legs, it is an excellent swimmer and a formidable predator. Bullfrogs have a voracious appetite, consuming insects, fish, small mammals, and even other frogs. They thrive in ponds, lakes, and slow-moving streams, where they can remain submerged for extended periods. Due to their adaptability and rapid reproduction, they have become an invasive species in many parts of the world, outcompeting native amphibians. This figurine looks just like an American bullfrog at rest, although when compared to the rest of the frogs in the set, could be a little bigger. Click here to find out more about the American bullfrog figurine Argentine Horned Frog The Argentine horned frog (Ceratophrys ornata), also known as the “Pacman frog” due to its round body and large mouth, is a voracious predator native to the grasslands of Argentina, Brazil, and Uruguay. This stout amphibian usually has vibrant green, yellow, and brown markings that provide excellent camouflage among leaf litter. Known for its aggressive feeding behaviour, it will attempt to eat anything that fits in its mouth, including insects, small rodents, and even other frogs. Unlike many amphibians, it is not a strong swimmer and prefers to burrow in moist soil. Its unique appearance and relatively easy care make it a popular pet among amphibian enthusiasts. The figurine that Toymany has produced is of a ‘morph’ that is quite popular within the pet trade. Click here to find out more about the Argentine horned frog figurine Blue Poison Dart Frog The blue poison-dart frog (Dendrobates tinctorius “azureus“) is a striking amphibian native to the rainforests of Suriname and differentiated from the other populations of D. tinctorius found in French Guiana, and northern Brazil. It is renowned for its vivid blue coloration, often adorned with black spots or patterns, which serves as a warning to predators of its toxicity. The frog’s skin contains potent alkaloid toxins, which it derives from its diet of ants, termites, and other small invertebrates. Blue poison-dart frogs are arboreal, spending much of their time in the forest canopy near water sources, where they lay their eggs in damp, sheltered areas. Their bold colour and fascinating behaviour make them popular among amphibian enthusiasts. Toymany’s figurine has spectacularly captured the behaviour of this iconic species – after all how many other blue frogs can you name? Click here to find out more about the blue poison dart frog figurine Budgett’s Frog The Budgett’s frog (Lepidobatrachus laevis) also sometimes known as the Paraguay horned frog, is a unique, semi-aquatic amphibian native to South America. Known for its wide, flattened body and comically large mouth, this frog is an aggressive predator, feeding on insects, fish, and even other frogs. It has a distinctive defence mechanism, inflating its body and emitting a loud screech when threatened. Budgett’s frogs thrive in temporary pools and marshes, where they remain buried in mud during dry seasons, entering a state of estivation to survive harsh conditions. Their quirky appearance and bold personality make them popular in the exotic pet trade. As you can see from the photos below, this model captures the defensive posture of this unusual amphibian. Click here to find out more about the Budgett’s frog figurine Darwin’s Frog The Darwin’s frog (Rhinoderma darwinii) is a small, leaf-mimicking amphibian native to the temperate forests of Chile and Argentina. Named after Charles Darwin, who discovered it in 1834, this species is known for its unique reproductive strategy. Males carry fertilised eggs in their vocal sac, where they develop into tadpoles and eventually emerge as fully formed froglets. This remarkable adaptation helps protect the young from predators and harsh environmental conditions. Sadly, Darwin’s frog is endangered due to habitat loss and the spread of chytrid fungus, posing a serious threat to its survival. Darwin’s frogs are currently in the news because of the great work that ZSL London Zoo is doing to help rescue this species from the edge of extinction. Click here to find out more about the Darwin’s frog figurine Lehmann’s Poison Frog Lehmann’s poison frog (Oophaga lehmannii) is a brightly coloured amphibian found in the rainforests of the Amazon Basin, primarily in Peru. Known for its striking red, yellow, or orange colouration, often with contrasting black markings, this frog is both beautiful and toxic. Like other poison dart frogs, its toxicity is derived from its diet of ants and other small invertebrates that contain alkaloid compounds. These toxins serve as a defense mechanism against predators. Despite its small size, Lehmann’s poison frog is an agile climber and is typically found in the leaf litter and vegetation near streams. Click here to find out more about the Lehmann’s poison dart frog figurine Red-eyed Tree Frog The red-eyed tree frog (Agalychnis callidryas) is a striking amphibian native to the rainforests of Central America. Known for its vivid green body, blue and yellow striped sides, and bright red eyes, this nocturnal frog uses its bold colouration as a defence mechanism, startling predators when suddenly exposed. It is an excellent climber, using its sticky toe pads to navigate the dense foliage of tropical trees. Despite its intimidating appearance, the red-eyed tree frog is harmless and primarily feeds on insects. It thrives in humid environments near water, where it lays its eggs on leaves overhanging ponds, allowing the tadpoles to drop into the water upon hatching. Out of all of these frogs in this set, this has to be my favourite – just look at the detail! It is almost as if this figurine is alive. Click here to find out more about the red-eyed tree frog figurine Strawberry Poison Dart Frog The strawberry poison dart frog (Oophaga pumilio) is a small but vividly coloured amphibian native to Central America, particularly in rainforests of Nicaragua, Costa Rica, and Panama. Its bright red body (although the species is highly variable), often accompanied by blue or black limbs, serves as a warning to predators of its toxic skin, which is derived from its diet of ants and other small invertebrates. Despite its tiny size, this frog is highly territorial and exhibits complex parental care, with females transporting tadpoles to water-filled bromeliad leaves and feeding them unfertilized eggs. Its striking appearance and fascinating behaviour make it one of the most well-known poison dart frogs. The Toymay figurine is of the most widely known and popular colour variation that this frog comes in. Click here to find out more about the strawberry poison dart frog figurine Surinam Horned Frog The Surinam horned frog (Ceratophrys cornuta) is a stout, ambush predator native to the tropical rainforests of South America. It is known for its distinctive, horn-like projections above its eyes, which help it blend into leaf litter on the forest floor. With its wide mouth and powerful jaws, this frog can consume a variety of prey, including insects, small reptiles, and even other frogs. It relies on its excellent camouflage to remain hidden, waiting motionless for unsuspecting prey to come close. Like other horned frogs, the Surinam horned frog has a bold temperament and a surprisingly strong bite for its size. The Toymany figurine captures one of these distinctive amphibians mid-lunge, just check out the detail on that tongue! Click here to find out more about the Surinam horned frog figurine Wallace’s Flying Frog The Wallace’s flying frog (Rhacophorus nigropalmatus) is a tree-dwelling amphibian found in the rainforests of Malaysia and Indonesia, known additionally from the islands of Borneo and Sumatra. Named after naturalist Alfred Russel Wallace, this frog is famous for its ability to glide between trees using large, webbed feet and flaps of skin. It can leap and soar up to 50 feet, escaping predators and searching for food with ease. Its bright green body, yellow sides, and black webbing provide both camouflage and warning colouration. Living high in the canopy, Wallace’s flying frog rarely descends to the ground, only coming down to breed in small pools of water. Toymany’s figurine captures the act of gliding extremely well, including the correct facial expression of this frog in motion. I apologise that the gallery below has clipped some of the images. Click here to find out more about the Wallace’s flying frog figurine White’s Tree Frog The White’s tree frog (Litoria caerulea), also known as the dumpy tree frog, is a docile and hardy amphibian native to Australia and New Guinea. It has a plump body, smooth green to bluish skin, and large, expressive eyes. This species is known for its calm temperament and ability to adapt to various environments, often being found in urban areas. White’s tree frogs secrete a waxy coating to retain moisture, allowing them to thrive in both humid and dry conditions. Their friendly nature and ease of care make them a popular choice among amphibian enthusiasts. You can’t see them in the photos below but I really like the detail of the toes, which I intend to show in more detail in an upcoming video. Click here to find out more about the White’s tree frog figurine Yellow-banded Poison Dart Frog The yellow-banded poison dart frog (Dendrobates leucomelas) is a striking amphibian native to the rainforests of northern South America, particularly in Venezuela and Colombia. Known for its vibrant yellow and black coloration, this frog uses its bright colours as a warning to potential predators about its toxicity – just like the other three poison dart frogs also included in this set. The frog’s skin produces alkaloid toxins, which are acquired through its diet of ants and other small insects. Despite its toxicity, the yellow-banded poison dart frog is a social species, often found in groups and displaying complex vocalisations. It is typically found in humid, lowland areas near streams, where it lays its eggs in moist, sheltered environments. The size of this figurine is pretty much life size, however my one has an extra yellow smudge on the side of its head which unfortunately ruins the illusion. Other than that, I am really impressed. Click here to find out more about the yellow-banded poison dart frog Toymany’s amphibian figurine set is a great tool for stimulating imaginative play, enhancing knowledge of wildlife, and promoting environmental awareness among all audiences. I am amazed at the level of detail that these figurines have while also being extremely affordable. All of the figurines have a very dynamic pose and are true to life, which is a quality I find extremely important when considering purchasing models like these. If you’re thinking about purchasing them, you can buy them all as a complete set, or individually depending on your needs. Unfortunately, my photos don’t show you all of the fantastic details so I think my next step is to create a video going through them all. If you would like to support the work I do, then please do consider purchasing some of these amazing models. As an extra special thank you, use code TMAFAS10 at the check-out to get 10% of your order. If you liked this post and enjoy reading this blog, please consider supporting me on Patreon where you will also gain access to exclusive content. Tagged:#ToyTuesdayAmphibiansFigurinesFrogsHerpetologyProduct ReviewsToads LEAVE A RESPONSE Cancel replyYour email address will not be published. Required fields are marked *Comment * document.getElementById("comment").setAttribute( "id", "acc8f9009ac1287b1dcac6b8c56615ee" );document.getElementById("ee11f209ba").setAttribute( "id", "comment" );Name * Email * Website Steven Allain View all posts Post navigation Previous Post#SciFri: What torches do I use during amphibian surveys? You may also enjoy #ToyTuesday #ToyTuesday: Of Amphibians and Reptiles Steven Allain 21st January 2025'
