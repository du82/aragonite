title = "#SteveReviews: Attenborough and the Giant Sea Monster – Steve's Herpetological Blog"
description = "A new year, a new beginning. This year was no different but it did come with a nice little treat courtesy of the BBC. They blessed us with a new special featuring the incomparable Sir David Attenbo…"
full_description = 'Homepage#SteveReviews#SteveReviews: Attenborough and the Giant Sea Monster #SteveReviews #SteveReviews: Attenborough and the Giant Sea Monster Steven Allain Posted on 10th January 2024 A new year, a new beginning. This year was no different but it did come with a nice little treat courtesy of the BBC. They blessed us with a new special featuring the incomparable Sir David Attenborough, a man that needs no introduction. For a 97-year old, it was great to see Attenborough getting excited to release his inner schoolboy and fossil hunter, as he shadowed The Etches Collection, as they helped to remove and house a large pliosaur from a cliff along the Jurassic Coast. From the get go, Attenborough and the Giant Sea Monster is a mesmerising documentary that plunges viewers into the mysterious depths of the ocean, and the lives of these prehistoric reptiles. This documentary offers a thrilling journey into the realm of these marine giants, although doesn’t go into the specifics of the discovery and whether it is a new species or not (although it probably is), as the peer-review process takes time. Discovered by Philip Jacobs while taking a walk along the cliff face following a strong storm, he found the tip of the snout of the pliosaur, alerting Steve Etches of his potential discovery. It is upsetting that Jacobs isn’t given more recognition for his work throughout, as without him, this important fossil may have never have been found. Palaeontologist Dr Judyth Sassoon (who recently spoke at TetZooCon 2023) visit the fossil along with Attenborough to comment on the likelihood of this specimen representing a new species (based on its size), mentioning that it will likely add to the eight already known. Now, this confused me. I know for a fact that more pliosaur species are known that eight globally, but it isn’t made clear whether Dr Sassoon means from this location during the same time frame as the fossil is from or not, which is how I interpreted things. If I am incorrect, please do let me know. Also appearing within was Flip, who also stunned the crowd a TetZooCon 2023 – however this was at the same time as my talk on midwife toads so I never managed to see Luke Muscutt give his demonstration at the time (which you can watch here), so it was great to see Flip get some screentime during this documentary. Another familiar face was Neil Gostling from the University of Southampton giving us a demonstration of the techniques used to visualise fossils via various scanning techniques. I do love it when we get a nice touch of science within these kinds of documentaries. To me, I enjoy these specieals where Attenborough can reveal his inner child, while also interacting with passionate and well informed people. The most nail-biting moments were in relation to the removal of the skull from the cliff, that needed a custom sledge to collect it from the rock, before it was eroded into the ocean whence it came. It is a shame the programme was so short, but it is highly enjoyable and extremely informative. If you liked this post and enjoy reading this blog, please consider supporting me on Patreon where you will also gain access to exclusive content. Tagged:#SteveReviewsDavid AttenboroughDocumentaryFossilsNatural HistoryPalaeontology LEAVE A RESPONSE Cancel replyYour email address will not be published. Required fields are marked *Comment * document.getElementById("comment").setAttribute( "id", "aebf6f6808bb7037d646936e01f68f1b" );document.getElementById("ee11f209ba").setAttribute( "id", "comment" );Name * Email * Website Steven Allain View all posts Post navigation Previous Post#SciFri: TetZooCon 2023 Next Post#SciFri: Herpetofauna Workers Meeting 2024 You may also enjoy #SteveReviews #SteveReviews: Uncharted Amazon Steven Allain 2nd August 2023 #SteveReviews #SteveReviews: Before the Flood Steven Allain 6th November 2019 #SteveReviews #SteveReviews: Kiss The Ground Steven Allain 21st October 2020 #SteveReviews #SteveReviews: Fantastic Fungi Steven Allain 22nd September 2021'
