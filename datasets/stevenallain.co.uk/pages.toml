full_description = "I’ve decided to jump on board with a new weekly blog titled ‘#SciFri’ which will of course also tie in to my social media accounts so keep an eye out on those. On this past Tuesday night I attended a much… One of my favourite places on Earth is the Natural History Museum in London. I’ve been visiting for over 20 years now and I’m currently completing one of my Master’s projects there. It is a magical place that is the… On the 15th March, I visited the Linnean Society of London to attend a talk by the esteemed UCL Evolutionary Biochemist Dr. Nick Lane titled ‘A Bioenergetic Basis for the Three Domains of Life’. I’m a big fan of Nick’s books… Most of those who follow me on some form of social media, you’ll know that I often post things with the #StevesLibrary hashtag to share books I have recently bought or those that I am currently reading. So I thought… On the 10th March, I visited the Crystal Palace Dinosaurs for the first time in over a decade. The first and only time I’d visited them before was in a school holiday back when I was knee-high to a grasshopper…."
