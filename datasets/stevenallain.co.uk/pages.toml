["https://stevenallain.co.uk/Blog/scifri-snakes-at-the-leicester-museum"]
title = "#SciFri: Snakes at the Leicester Museum – Steve's Herpetological Blog"
description = "It will be no surprise to regular readers of this blog that I love both snakes and museums! I was fortunate enough to be in Leicester recently visiting my mum, when I also had the opportunity to me…"
full_description = 'Homepage#SciFri#SciFri: Snakes at the Leicester Museum #SciFri #SciFri: Snakes at the Leicester Museum Steven Allain Posted on 23rd August 2024 It will be no surprise to regular readers of this blog that I love both snakes and museums! I was fortunate enough to be in Leicester recently visiting my mum, when I also had the opportunity to meet up with some of friends I had through the TetZooCon community to visit the Leicester Museum and Art Gallery. I will provide a more thorough overview of the Museum itself in the coming weeks as there are some amazing fossils and interactive displays there, but one thing that we stumbled across was an exhibit focused on snakes. Being the resident snake expert in the group, I had to dive in and take a look at everything with a fine-toothed comb. For the most part, Snakes was fantastic and minimalist in design yet still packing a punch. Before we into my full overview, if you want to visit, you need to do so by the 1st September! The entrance to the exhibition reveals two additional facts. The first is that there is a subtitle and the second is that the renowned snake researcher and founder of the Madras Crocodile Bank Rom Whitaker provided a quote in support of our scaled friends Upon entering the gallery, it was quite clear that things were more sparse than I expected. Well, I am not sure what I was expecting, however the space is quite large and the number of specimens is low. However, this works extremely well and I had not appreciated the finer workings of ‘less is more’ up until this point. For those that are not as familiar with snakes I myself, this offers visitors a fascinating exploration of these often misunderstood reptiles, and a unique opportunity to learn about the biology, behaviour, and diversity of snake species from around the world. The exhibition is designed to be both educational and engaging, making it suitable for visitors of all ages. However, a number of taxidermy specimens and models are of deadly species (mostly viperids and elapids), it would have been nice to see more representation of other snakes too. Those that were featured were quite convincing, especially with the added scenery. Puff adder (Bitis arietans) Red spitting cobra (Naja pallida) Rhinoceros viper (Bitis nasicornis) Black-tailed rattlesnake (Crotalus molossus) Each of the specimens on display provide a safe close-up view of the species it represents, as well as providing detailed information about anatomy and adaptations that have helped to make that snake such successful predators. It is here where the threats facing each species are found, along with other suitable facts – which vary depending on the species and the environment it is found in. These blurbs are short and easily accessible although may be tricky for visitors who are visually impaired to appreciate. That is perhaps one of the biggest downfalls of the exhibition, is its lack of accessibility – which is a tricky balance to strike with a subject as complex as snakes. One way around this could have been to have more tactile displays and auditory displays. Not all snakes make sounds, but rattlesnakes have their rattles and other species will hiss or shriek. Would have been nice to see more of those potential sounds employed more. Check out that resin pour on the diorama of a green anaconda (Eunectes murinus) hunting! One of the strengths of the exhibition is its focus on education – especially aimed at younger ages. Interactive displays are scattered throughout, offering insights into how snakes see, feed, and camouflage themselves in various environments (see below). These features make the exhibition particularly appealing to families and potentially school groups. The exhibition also highlights conservation issues, stressing the importance of protecting these often-vilified creatures. I wonder how many people who have a limited knowledge of snakes would ever consider them in need of conservation actions, over those of rhinos and elephants etc. Then there are the dioramas, with the green anaconda photographed above being my favourite of the entire exhibition! What’s behind that door? Some flaps had more taxidermy specimens, others had facts and photographs Another fun activity teaching children (and others) about the powers of camouflage Finally right by the exit (assuming I followed the exhibition the right way around, visitors will also find information on the three native species found in Great Britain, which adds a local touch to a global exhibition, highlighting the potential conservation of these animals at home. It was also great to see that the Amphibian and Reptile Groups UK (ARG UK) helped with the preparation of some of this information. Our native species photographed below for those that have never had the fortune of spotting a wild snake in Great Britain are the adder (Vipera berus), barred grass snake (Natrix helvetica), and the smooth snake (Coronella austriaca). Apart from the smooth snake having some comical googly eyes and the scientific name of the grass snake being incorrect, these guys helped to put a big smile on my face! Our three native snake species looking like they’re about to drop the dopest album of 2024! If you’re in the area over the coming week, make sure you visit the Museum and give the snakes some love! I would encourage you to do this whether you are afraid of them or not, especially seeing as those on display are long dead or just models. The positive association of the experience and learning opportunity may help you to overcome your fear. There are of course a number of other snakes and activities that I do not want to spoil for you either. If you do visit, please let me know how you got on and what your thoughts were. If you liked this post and enjoy reading this blog, please consider supporting me on Patreon where you will also gain access to exclusive content. Tagged:#SciFriExhibitionsHerpetologyMuseumsNatural HistorySnakes LEAVE A RESPONSE Cancel replyYour email address will not be published. Required fields are marked *Comment * document.getElementById("comment").setAttribute( "id", "accd0e3d94abe080af3d5dbed333cd1d" );document.getElementById("ee11f209ba").setAttribute( "id", "comment" );Name * Email * Website Steven Allain View all posts Post navigation Previous Post#SciFri: A quick history of the Blaschka Models Next Post#SciFri: Visiting the Leicester Museum & Gallery You may also enjoy #SciFri #SciFri: Using ImageJ to work out canopy cover Steven Allain 16th August 2019 #SciFri #SciFri: In search of the marsh frogs of south Essex Steven Allain 10th August 2018 #SciFri #SciFri: The potential for damage from the JNCC 7th Quinquennial Review Steven Allain 25th June 2021 #SciFri #SciFri: April project update Steven Allain 10th April 2020'
