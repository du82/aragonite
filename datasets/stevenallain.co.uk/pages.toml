["https://stevenallain.co.uk/Blog/scifri-royal-ontario-museum"]
title = "#SciFri: Royal Ontario Museum – Steve's Herpetological Blog"
description = "Unless you’ve been living a rock for the past couple of months, you’ll know I look some time out of my busy herpetological schedule to spend some time in Toronto and the surrounding are…"
full_description = 'Homepage#SciFri#SciFri: Royal Ontario Museum #SciFri #SciFri: Royal Ontario Museum Steven Allain Posted on 13th September 2024 Unless you’ve been living a rock for the past couple of months, you’ll know I look some time out of my busy herpetological schedule to spend some time in Toronto and the surrounding areas. This is the first blog post from my travels, now I have been able to go through all of my notes and photos distilling the very best of that adventure with you. Following on from my very predictable format, I would like to tell you all about my visit to the Royal Ontario Museum (ROM). As someone that is well acquainted with museums the world over, visiting the ROM for the first time after all that I had heard about it was akin to embarking on an intellectual and cultural odyssey. It houses a vast collection of artefacts, exhibits, and unique blend of natural history and world cultures. To me, it is the unholy love child of the Natural History Museum, British Museum and Victoria and Albert Museum. If you squint do you also see Megatron? Decepticons! Transform and rise up! On the approach to the ROM, the first thing that struck me was the dramatic architecture. The modern Michael Lee-Chin Crystal, designed by architect Daniel Libeskind, juts out from the historic structure like a crystalline shard or the snout of a shark (depending on the angle you look at it). This bold architectural choice makes the ROM stand out, as no other buildings look like the top of the CN Tower has come loose and rolled down the street into the side of a historic building. Unfortunately, while I was visiting, some building work was still ongoing so not all of the galleries were on display, so I may have to visit again in the future when everything is finished. This juxtaposition of old and new symbolises the museum’s commitment to preserving history while embracing the future. The Futalognkosaurus towering over the Royal Ontario Museum lobby with a sunfish lurking in the background Upon entering the museum, you are greeted by a spacious, light-filled atrium. The design of the entrance is welcoming, with a sense of grandeur that prepares you for the journey ahead. I suspect that some of the aforementioned museums in London were used as inspiration for this, as it did have a very familiar feel to it. In one direction is the Hall of Philosophers, and in the other is a large lobby with an excellent café. It is here in this lobby that you are welcomed by the giant titanosaur Futalognkosaurus, which was originally mounted for an exhibit titled Ultimate Dinosaurs: Giants from Gondwana. I wish I could have been there to see the rest of the dinosaurs from that time as I bet they were amazing! When I finally get a DeLorean up to 88 mph, that is one of the stops I will make as I slowly destroy the fabric of reality. A familiar face welcomes you to the Dawn of Life Gallery It will surprise no one to learn that I began my exploration of the ROM in the natural history galleries, beelining for the Dawn of Life gallery – which documents the evolution of life from it’s origin to the present day through the different geological periods. Now, this isn’t something new and has been done in hundreds of museums, but the ROM has something which most European museums do not. A number of specimens from the Burgess Shale. For the uninitiated, the Burgess Shale, which was discovered in 1909 by palaeontologist Charles Walcott in the Canadian Rockies of British Columbia, is one of the most significant fossil finds in the history of palaeontology. Anomalocaris Wiwaxia Hallucigenia This remarkable deposit, dating back approximately 508 million years to the Cambrian period, contains an exceptional array of well-preserved fossils that provide a unique glimpse into early marine life. What makes the Burgess Shale particularly important is its preservation of soft-bodied organisms, which are rarely fossilized, offering an unprecedented view of the diversity and complexity of ancient ecosystems. The fossils found here have revolutionised our understanding of early animal evolution, revealing the rapid diversification of life forms during the Cambrian Explosion and challenging previous notions about the pace and nature of evolutionary processes. I’d seen a handful of these specimens before, but seeing so many in the country they were discovered was like a holy pilgrimage. Deinonychus Allosaurus Stegosaurus Corythosaurus Zuul The star attraction of the natural history section is undoubtedly the dinosaur exhibit. Walking through the gallery, I was captivated by the sheer size and scale of the dinosaur skeletons on display – it isn’t very often that I am made to feel small. The exhibit is well-curated, with informative plaques that provide context about the different species, their habitats, and their evolutionary history. This was still under construction when I visited and some of the casts, such as Tyrannosaurus rex were not on display which was a shame. Most of the other palaeontological specimens from the Cenozoic were also off limits, with them only on view from a platform, after following a long corridor. Next time I visit, I will be sure to get lost in time when this exhibit is back to its former glory. Look how inviting and interesting this display of colourful minerals looks – each with their own plaques explaining their formation and chemical composition Another highlight in the natural history section is the Earth’s Treasures gallery, which showcases a stunning collection of gems, minerals, and meteorites. The colours and textures of these natural formations are mesmerizing, and the exhibit does an excellent job of explaining the geological processes that create such beauty. It is very much like the Mineral Gallery at the Natural History Museum, except it is more modern and better curated. I feel that this helps the general visitor to engage more with the specimens as it can be tricky to get people to engage with rocks and minerals at time, especially if they’re dull and brown. This gallery also houses one of five Big Maple Leaf coins, a $1 million CAD solid gold coin weighing 100 kg struck in 2007. It was also in this gallery that I realised that I wouldn’t escape William Smith’s 1815 geological map of England and Wales, as there was a giant poster of it on one of the walls. The size and clarity of The Big Maple on display at the ROM is truly breathtaking The contemporary natural history gallery offers an immersive experience into the dynamic and evolving world of natural science. This gallery showcases the diversity of life on Earth through an impressive collection of models and taxidermy specimens, highlighting both extinct and extant species. These help to engage visitors in understanding complex ecosystems, evolutionary processes, and the impact of human activities on the natural world. With a strong emphasis on the different environments that species adapt to, the gallery serves as an educational and inspiring space for all ages. There are also a small number of fish tanks here that were always crowded so I wasn’t able to see what was in them, so just beware that there may be a bottleneck here during your visit. There were plenty of extant reptiles and amphibians in the contemporary natural history gallery to keep me happy, such as these lizards! Something that I would like to give the ROM credit for is a whole gallery dedicated to the natural history and ecology of native species, broken down into habitat. This is the first time I have seen this in a museum and helps to not only foster the curiosity of young minds, provide a sense of national pride in the species that can be found there, but also allows visitors to see what animals they may be lucky enough to see when visiting a woodland, the Rockies, or an urban park. A unique feature of this area is the Bat Cave, a re-creation of a bat’s natural habitat. This immersive exhibit offers a multi-sensory experience, complete with the sounds and sights of a real cave. It’s both educational and entertaining, making it a hit with visitors of all ages. However, it is in need of some new light bulbs and some TLC to get it back to its former glory, based on what my friends have told me. A rare sprinkler bat among a colony of other bat species within the Bat Cave After spending considerable time in the natural history galleries, I moved on to the World Cultures section, which offers a deep dive into the art, history, and culture of various civilizations across the globe. The Egyptian Gallery was my first stop, the collection includes mummies, sarcophagi, and ancient artefacts (which is why this part of the ROM reminds me of the British Museum). The exhibit is meticulously arranged, with dim lighting that adds to the mysterious aura of ancient Egypt. One of the most intriguing pieces are preserved fragments of the Book of the Dead, which offers insight into the beliefs and rituals surrounding death and the afterlife in ancient Egyptian culture. Unfortunately, it was exceptionally busy so you’re just going to have to use your imagination for this one. For a country so far away from Egypt, I was extremely impressed by the quantity and range of historical items on display. A view of part of the Chinese Gallery Next, I explored the Chinese Gallery, which houses an extensive collection of Chinese art and artefacts. The gallery spans several dynasties, offering a comprehensive overview of Chinese history. From intricate jade carvings to magnificent ceramics and bronze vessels, the exhibit showcases the artistic achievements of one of the world’s oldest civilizations. The highlight for me was the collection of ancient Chinese tombs, which are displayed in a way that allows visitors to peer inside and marvel at the craftsmanship. Elsewhere in the museum are the galleries dedicated to European history, such as housing suits of armour (like those pictured below), hundreds of swords and daggers, and other such items. As you move closer in time to the present day, there are a number of model rooms set up how a rich family would decorate them with the fashion and traditions of the day, allowing you to almost step back in time. One of the things that impressed me most about the Royal Ontario Museum is the attention to detail in the presentation of its exhibits. Each gallery is thoughtfully curated, with a narrative that guides visitors through the history and significance of the artefacts on display. The use of interactive elements, such as touch screens and virtual reality, enhances the experience, making it accessible and engaging for visitors of all ages. Also, as it is Canada, everything has both a French and English translation as you may have noticed from my photos. There was also a number points around the museum where you could interact with an audio tour, which is a fantastic addition to help aid accessibility. The museum’s layout is generally intuitive, with clear signage that helps you navigate between galleries. However, given the size of the museum, it’s easy to feel overwhelmed, especially if you’re a first-time visitor. You may found it helpful to take breaks in the various seating areas throughout the museum, where you can sit and reflect on what you’ve seen (or wait for the gallery to clear). Tiktaalik Inostrancevia alexandri Postosuchus The museum’s gift shop is worth a visit as well. It’s stocked with a wide variety of items, from educational toys and books to unique souvenirs that reflect the museum’s diverse collection. However, due to the renovation works, it wasn’t as stocked as it could have been so thankfully my bank balance wasn’t reduced as much as it could have been. As I left the Royal Ontario Museum, I felt a deep sense of satisfaction and enrichment. The museum is more than just a collection of artifacts; it’s a place where history, art, and science come to life. For a first-time visitor, the ROM offers a comprehensive and immersive experience that is both educational and entertaining. The diversity of the exhibits ensures that there’s something for everyone, whether you’re fascinated by ancient civilizations, natural history, or contemporary culture. The museum’s commitment to accessibility and engagement is evident in every aspect of the visitor experience, from the thoughtful curation of exhibits to the use of interactive technology. In conclusion, the Royal Ontario Museum is a must-visit destination for anyone in Toronto. Whether you’re a local or a tourist, a history buff or a casual visitor, the ROM offers a journey through time and space that is sure to leave a lasting impression. I’m already planning my next visit, as I’m certain there’s still much more to explore and discover in this treasure trove of knowledge and culture. The only difference to the usual museum experience I am used to is having to pay for entry, but that is something that became very apparent throughout the rest of my stay in Canada. I am also interested in seeing what research the ROM conducts regarding both extant and extinct species, and where this compares to the Natural History Museum. I’ll have to found out during my next visit! Finally, I wasn’t able to escape snakes in jars – work likes to follow me it seems If you liked this post and enjoy reading this blog, please consider supporting me on Patreon where you will also gain access to exclusive content. Tagged:#SciFriAnthropologyConservationDinosaursEducationMuseumsNatural HistoryScience CommunicationZoology LEAVE A RESPONSE Cancel replyYour email address will not be published. Required fields are marked *Comment * document.getElementById("comment").setAttribute( "id", "aaacb9f38b06f399348429b7395811ac" );document.getElementById("ee11f209ba").setAttribute( "id", "comment" );Name * Email * Website Steven Allain View all posts Post navigation Previous Post#SciFri: Birds: Brilliant and Bizarre Next Post#SciFri: ARC-BHS Joint Scientific Meeting 2024 You may also enjoy #SciFri #SciFri: The potential for damage from the JNCC 7th Quinquennial Review Steven Allain 25th June 2021 #SciFri #SciFri: ARC-BHS Joint Scientific Meeting 2024 Steven Allain 7th December 2024 #SciFri #SciFri: Titanosaur – Life as the Biggest Dinosaur Steven Allain 26th May 2023 #SciFri #SciFri: Visiting the Wellcome Collection Steven Allain 5th November 2021'
