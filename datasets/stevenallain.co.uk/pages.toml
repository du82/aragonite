title = "#SciFri: Visiting the Leicester Museum & Gallery – Steve's Herpetological Blog"
description = "If you’ve read last week’s post, you’ll know that I recently visited Leicester Museum. also known as Leicester Museum & Art Gallery, offers a rich blend of history, art, and n…"
full_description = 'Homepage#SciFri#SciFri: Visiting the Leicester Museum & Gallery #SciFri #SciFri: Visiting the Leicester Museum & Gallery Steven Allain Posted on 30th August 2024 If you’ve read last week’s post, you’ll know that I recently visited Leicester Museum. also known as Leicester Museum & Art Gallery, offers a rich blend of history, art, and natural sciences. Located in the heart of Leicester, the museum is housed in a beautiful Victorian building that first opened in 1849. Over the years, the museum has evolved, adapting to contemporary tastes and educational needs while retaining its historical charm. The museum is divided into various sections, each dedicated to different themes such as Ancient Egypt, natural history, local history, and fine art. The layout is intuitive, with clear signage guiding visitors through the exhibits. The museum’s commitment to accessibility is evident, with ramps, elevators, and informative displays catering to all age groups and abilities. Cetiosaurus stands proud among other fossils Leicester Museum’s natural history section is another highlight, providing an engaging exploration of the natural world. The centrepiece of the natural history collection is the dinosaur gallery, which features a life-sized replica of a Jurassic-era dinosaur skeleton, Cetiosaurus. I can see this gallery being a hit with younger visitors, offering a thrilling and educational experience. Alongside the dinosaurs, the gallery also showcases fossils, minerals, and specimens from around the world, providing a comprehensive overview of Earth’s natural history. However, most of the specimens on display have been found in the local area. Some Ediacaran fossils even feature on one of the walls, including specimens of Charnia. They are known for their distinctive leaf-like, segmented structure which are currently recognised as one of the first complex life forms on Earth. Charnia fossils were first discovered in Charnwood Forest (just outside Leicester), hence their name. Unfortunately, the Wild Space gallery which is a contemporary natural history collection of taxidermy specimens has closed due to the space being converted into a café. Hopefully, we’ll it be reborn elsewhere in the museum in the near future. Ichthyosaur showing a huge sclerotic ring Various marine fossils Rhomaleosaurus Atychodracon megacephalus, Ichthyosaurus The Ancient Egypt gallery is another favourite among visitors, offering a fascinating glimpse into one of history’s most enigmatic civilizations. The collection includes a variety of artefacts such as mummies, jewellery, and everyday items, each accompanied by detailed descriptions that provide context and insights into ancient Egyptian life. There are other artefacts such as pottery, tools, and mosaics on display, which are quite numerous for such a small museum. The gallery’s highlight is the well-preserved mummy of Pa-nesit-tawy, a female temple singer from Thebes, which provides a unique opportunity to learn about the burial practices and beliefs in the afterlife. The museum also showcases local history through the Leicester Stories Gallery. This section delves into the social and industrial history of Leicester, highlighting the city’s development from a small market town to a bustling industrial centre. The exhibit includes personal stories, photographs, and artefacts donated by local residents, making it a truly community-driven project. It’s a powerful reminder of the city’s diverse heritage and the people who have shaped it over the centuries. Art lovers will find much to admire in Leicester Museum’s extensive art galleries. The museum boasts an impressive collection of fine art, ranging from classical to contemporary works. The art galleries are thoughtfully arranged, with each room dedicated to a different period or style, allowing visitors to explore the evolution of artistic expression. The collection includes works by renowned artists such as Turner, Gainsborough, and Lowry, as well as pieces by lesser-known but equally talented local artists. The diversity of the collection is one of its strengths, offering something for everyone, whether you’re a fan of traditional landscapes, modern abstract art, or something in between. One of the standout exhibits is the Victorian Gallery, which showcases paintings and sculptures from the 19th century. The room is adorned with richly detailed works that capture the grandeur and complexity of the Victorian era. The gallery’s design, with its high ceilings and ornate decorations, enhances the viewing experience, making it feel like a step back in time. The extensive collection of paintings, decorative arts, sculptures and furniture that highlight the artistic movements of the time, from the romanticism and realism of early Victorian art to the later influences of the Pre-Raphaelites. The gallery not only celebrates the artistic achievements of the Victorian age but also provides a window into the social and cultural dynamics that defined the period. The German art gallery features an impressive collection of works from the 19th and early 20th centuries, showcasing the diversity and depth of German artistic expression. The gallery includes pieces from notable artists such as Franz von Stuck, Käthe Kollwitz, and others, reflecting themes from Romanticism to Expressionism. The collection highlights the cultural and social shifts in Germany during this period, offering insights into the country’s artistic and historical context. The gallery provides a focused exploration of German art, complementing the museum’s broader European art collections. A collection of fine Victorian furniture in the room adjacent to the Victorian Gallery The Picasso collection at is a remarkable showcase of the artist’s influence on modern art, featuring a selection of his works that highlight various phases of his prolific career. The collection includes prints, drawings, and ceramics, offering a glimpse into Picasso’s experimentation with form, colour, and technique. Through these pieces, visitors can explore the evolution of his style, from the bold lines and fragmented forms of Cubism to the expressive, fluid shapes in his later works. The collection not only celebrates Picasso’s artistic genius but also underscores his impact on 20th-century art, making it a significant part of the museum’s modern art offerings. What makes this collection stand out in my mind, is that is was donated to the museum by Richard Attenborough and his wife (David Attenborough’s brother), who used to live locally. Some of the Picasso works on display – in this case some plates with various faces on them In addition to the permanent collection, the museum regularly hosts temporary exhibitions that feature contemporary art and special themes. These rotating exhibits keep the museum’s offerings fresh and encourage repeat visits. The most recent of these is on snakes, which you still have this weekend to catch! Other exhibitions have included explorations of modern British art, photography, and thematic collections that challenge conventional notions of art and culture. Leicester Museum excels not only in its collections but also in the overall visitor experience. The museum shop offers a range of locally themed souvenirs, books, and gifts that reflect the themes of the exhibits, making it a great place to find something special to take home. If you’ve read my overview of The Beaney Museum in Canterbury, you may remember Thomas Sidney Cooper who loved to paint cows in the local area In conclusion, Leicester Museum is a treasure trove of knowledge, culture, and art that offers something for everyone. Its diverse exhibits, ranging from ancient history to modern art, provide a well-rounded experience that is both educational and enjoyable. Whether you’re a local resident or a visitor to the city, the museum is a must-see destination that offers a deep and enriching understanding of Leicester’s past, present, and future. The careful curation, engaging displays, and welcoming atmosphere make it a standout institution that deserves to be celebrated and revisited time and again. Finally, I’ll leave you with this gallery of rocks, minerals, and fossils with a portrait of Sir David Attenborough looking towards you If you liked this post and enjoy reading this blog, please consider supporting me on Patreon where you will also gain access to exclusive content. Tagged:#SciFriDinosaursFossilsMuseumsNatural HistoryZoology LEAVE A RESPONSE Cancel replyYour email address will not be published. Required fields are marked *Comment * document.getElementById("comment").setAttribute( "id", "a14c27bd3b3b5a9f2de417920381b7e3" );document.getElementById("ee11f209ba").setAttribute( "id", "comment" );Name * Email * Website Steven Allain View all posts Post navigation Previous Post#SciFri: Snakes at the Leicester Museum Next Post#SciFri: Birds: Brilliant and Bizarre You may also enjoy #SciFri #SciFri: Ford vs. Naish Steven Allain 18th May 2018 #SciFri #SciFri: Visiting the Maidstone Museum Steven Allain 15th April 2022 #SciFri #SciFri: What’s that lichen? Steven Allain 18th December 2020 #SciFri #SciFri: October Project Update Steven Allain 16th October 2020'
