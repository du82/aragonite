full_description = "It isn’t often that you find a documentary film about reptiles, so I was excited when I stumbled across Crocs of Katuma, when scrolling through Amazon Prime. This documentary was released in 2010, and provides an immersive exploration into the… Sometimes you just want to watch something and unwind after a long day. That means you’re looking for something that isn’t too complex or hard to follow, until at least you’ve had a chance to have a cuppa and recover… It isn’t every day that a former President of the United States narrates a wildlife documentary series, especially given that the dominant force within the genre is Sir David Attenborough. It was a surprise when I opened Netflix one day… It has been 10 months since a large number of familiar faces from the wildlife conservation scene within the UK descended on a pub in Archway, London for a very special occasion. I know, I’m a tad behind the times… It is always a bright day when a new Sir David Attenborough documentary drops, although Our Planet II is a series like no other. As the highly anticipated sequel to the acclaimed nature documentary series Our Planet, it once again… Unless you’ve been living under a rock for the past few months, you’re probably aware that towards the end of last month, the second season of Prehistoric Planet aired on Apple TV+. This was a follow-up series to the successful… It seems that at the moment, Sir David Attenborough is producing a new series every week, instead of winding down into retirement. Having a quick look at IMDB, it seems that Attenborough is producing landmark series more frequently than he… As I am sure I have stated previously on this blog (if not elsewhere) when I was younger, I wanted to be a primatologist. My large collection of plush orangutans and gorillas as a child are a testament to this…. It was going to come sooner or later, wasn’t it? I’m sorry it took me so long to getting around to write this, but with my PhD thesis deadline looming, I’ve had bigger fish to fry! For those of you…"
