["https://stevenallain.co.uk/Blog/steveslibrary-buried"]
title = "#StevesLibrary: Buried – Steve's Herpetological Blog"
description = "I know this hard to believe, but not everything I read or do is linked to herpetology. Something that has always fascinated me is the past, and how we’ve been able to learn more about the liv…"
full_description = 'Homepage#StevesLibrary#StevesLibrary: Buried #StevesLibrary #StevesLibrary: Buried Steven Allain Posted on 30th July 2023 I know this hard to believe, but not everything I read or do is linked to herpetology. Something that has always fascinated me is the past, and how we’ve been able to learn more about the lives of ancient people. This of course is a field that is always changing as new technology helps us to unlock even more secrets about the dead, as it does for the living. Having just completed my PhD within the School of Anthropology and Conservation, I thought it was about time to focus more on the anthropology side of things. Therefore, it was only natural for me to read my copy of Buried by Alice Roberts. Renowned for her expertise in archaeology and anthropology, Roberts delivers a captivating narrative that delves into the diverse rituals and customs surrounding death, and more importantly how these have changed through time. The book masterfully combines scholarly research with accessible storytelling, making it the ideal exploration of the history of human burial practices within Great Britain, taking readers on an unforgettable journey through time. Roberts adeptly sets the stage with an insightful introduction that explains the significance of burial practices in understanding human evolution and civilisation. She seamlessly navigates through various archaeological discoveries from around the world, each chapter unveiling a new layer of human history in Great Britain, and the changing burial practices that span a 1000 years of history, and the ideas that permeated through this timespan. Roberts’ eloquent prose paint vivid pictures of ancient burial sites, drawing readers into the realm of our ancestors’ beliefs, traditions, and values. There are also a number of personal stories and anecdotes, from projects or excavations Roberts has herself been involved with. Something that I didn’t appreciate until now was the fact that Roberts appeared on Time Team, the long-running archaeological TV show – something that I used to watch religiously when it was on the air. It makes perfect sense now though! This personal touch adds authenticity and a sense of intimacy to the storytelling, allowing readers to connect with the author on a deeper level. It is evident that Roberts’s passion for her subject matter fuels the book’s energy and curiosity. Buried serves as a poignant reminder of the interconnectedness of humanity. Roberts eloquently illustrates how despite our geographical and temporal differences, we share a fundamental human experience: grappling with the mystery of mortality. This theme of unity resonates deeply, making the book a profound and contemplative read. While there is certainly a vast amount of history contained within its pages, Buried also features a vast amount of science and information about techniques which combined with the storytelling, make it a captivating read. If you’re just as curious about the idea of death, mortality, and cultural exchange, then Buried is a book for you! If you liked this post and enjoy reading this blog, please consider supporting me on Patreon where you will also gain access to exclusive content. Tagged:#StevesLibraryAnthropologyBook Review LEAVE A RESPONSE Cancel replyYour email address will not be published. Required fields are marked *Comment * document.getElementById("comment").setAttribute( "id", "a72fd11df3eb2088d7d9d46c5cffbe2b" );document.getElementById("ee11f209ba").setAttribute( "id", "comment" );Name * Email * Website Steven Allain View all posts Post navigation Previous Post#SciFri: Visiting Kew Gardens Next Post#SteveReviews: Uncharted Amazon You may also enjoy #StevesLibrary #StevesLibrary: Bad Science Steven Allain 12th April 2019 #StevesLibrary #StevesLibrary: I, Mammal Steven Allain 24th October 2021 #StevesLibrary #StevesLibrary: A Buzz in the Meadow Steven Allain 26th July 2020 #StevesLibrary #StevesLibrary: Hacking The Code of Life Steven Allain 7th April 2024'
