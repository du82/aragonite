full_description = "I know this hard to believe, but not everything I read or do is linked to herpetology. Something that has always fascinated me is the past, and how we’ve been able to learn more about the lives of ancient people…. Roughly a year ago, I visited Kew Gardens for the first time since I was a child. It had been that long since I had actually been there, that it wasn’t at all like I remembered. I can only assume… It isn’t every day that a former President of the United States narrates a wildlife documentary series, especially given that the dominant force within the genre is Sir David Attenborough. It was a surprise when I opened Netflix one day… It has been 10 months since a large number of familiar faces from the wildlife conservation scene within the UK descended on a pub in Archway, London for a very special occasion. I know, I’m a tad behind the times… Back in February, I was lucky enough to attend a Fellows only event at Burlington House to commemorate the 150th anniversary of the Linnean Society of London being based there. I’ve been to a number of events at Burlington House… It is always a bright day when a new Sir David Attenborough documentary drops, although Our Planet II is a series like no other. As the highly anticipated sequel to the acclaimed nature documentary series Our Planet, it once again… It has been some time since I last wrote a book review for #StevesLibrary, and I’m still catching up on other posts too (watch this space). I recently finished Spirals in Time by Helen Scales, a book that I’ve been… Something that has looked me in the eye every time I walked I’ve walked down the high street in the near five years I’ve lived in Canterbury, is The Beaney House of Art and Knowledge (what a name!), commonly known…"
