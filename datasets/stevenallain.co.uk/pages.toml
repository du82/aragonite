full_description = "You’ve guessed it! It’s another blog post from my recent trip to New Zealand – this time all about the Dunedin Botanic Garden. The Botanic Garden is located at the northern end of central Dunedin, within walking distance of the… Whilst visiting Dunedin for the World Congress of Herpetology, I was lucky enough to have visited the Orokonui Ecosanctuary. As you can probably guess by the name, it ecological wildlife reserve that has been developed by the Otago Natural History… Unless you’ve been hiding under a rock for the past fortnight, you’re probably aware that I’ve recently been in Dunedin for the 9th World Congress of Herpetology. Aside from the conference (which was mind-blowingly awesome) I also did a number… Not long ago, I was in Norwich for a week whilst attending a PhD related summer school at the University of East Anglia. Whilst I was there, I was given the opportunity to go for a guided walk of the… Whilst visiting my mother’s house in Essex, I couldn’t help but take the opportunity to travel to Walton-on-the-Naze (known as Walton for short) with her when she headed to the beach to walk her dog. Whilst she would be ensuring… On Saturday 9th June, herpetologists from all over the UK (including me) gathered in Glasgow for a very special occasion. The Glasgow Natural History Society, in conjunction with Clyde ARG, had organised a fantastic line-up of herpetologically themed talks for… On the 19th June herpetologists from all over Europe travelled to Peterborough for Froglife’s 2018 ‘Toad Summit’. The driving force behind this one day meeting was a recently published scientific paper based on decades of painstakingly collected toad patrol data,… In September 2012 when I first moved to Cambridge, one place where I spent a lot of my time was looking around the Zoology Museum just off of Downing Street. As a zoology undergraduate, this museum was a gem and… On Monday 11th June I was lucky to join a couple of friends at Conway Hall, London for a talk by Peter Godfrey-Smith regarding his research which has culminated in his brilliant book ‘Other Minds: The Octopus and the Evolution…"
