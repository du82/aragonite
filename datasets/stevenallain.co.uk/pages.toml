full_description = "Regular readers of the blog will know that it isn’t just books on amphibians and reptiles that I read, but all areas of science. It feels like I haven’t produced one of these reviews in forever – apologies for that… Note: Every now and again I post an invited blog post by a member of the community. This time around it is the turn of Victoria Protheroe, a prolific author from the currently-dormant blog Bioweb. Thanks in advance to James… The Oxford Museum of Natural History, nestled in the heart of Oxford (which you probably guessed) is a wonderful museum that I have unfortunately only visited a handful of times. The last of which before recently was in 2017 to…"
