full_description = "If you have read any of my previous blog posts relating to any of the landmark Attenborough series, you will know that from a personal perspective, that these have been generally hit or miss. However, Asia which is the latest… When you think about countries around the world that host a plethora of unique and endemic wildlife, Cuba isn’t usually one of the first that comes to mind. However, I think that perhaps it is time that that changed. Cuba’s… It is always a cause of celebration when a new Attenborough series lands on the BBC. The latest instalment titled Mammals is an extraordinary testament to the unparalleled beauty and diversity of these animals, as well as demonstrating their ability… A dominant voice in the world of nature documentaries is that of Sir David Attenborough, who has been on our screen for 70 years. It is therefore unusual and a little novel when you find a landmark nature series without… One thing I will never get tired of is amazing documentaries on reptiles and amphibians. Thankfully, Rattled by The Orianne Society is on of these. In this short, captivating and insightful documentary a spotlight shines on one of the most… A new year, a new beginning. This year was no different but it did come with a nice little treat courtesy of the BBC. They blessed us with a new special featuring the incomparable Sir David Attenborough, a man that… It is always a momentous occasion when a new landmark Attenborough series airs on BBC One, especially one following in the footsteps of Planet Earth II. It was during the beginning year or two of my PhD when I heard… It is weird to me to watch a nature documentary, especially one which by title appears to be a spinoff of an Attenborough series and not have him narrate it. Instead however, Life on Our Planet which is available on… It is rare that you’ll see my posting about mammals on this blog, mainly because I think they’re overhyped and focussed on too much, compared to other taxa. I may focus obsessively on amphibians and reptiles, but even I often…"
