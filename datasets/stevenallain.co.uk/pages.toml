full_description = "If you know me well, you know that the one thing I love more than science, are books. Recently, I found the time to visit the British Library in London to visit and exhibition that I have been meaning too… It is rare that I get the chance to review a book with a herpetological theme (there aren’t many of them out there despite my best efforts to pitch my ideas to publishers), but that changes this week! Tadpole Hunter… If you wanted to create somewhere for herpetologists to flock in their hundreds, I could think of no better place than the Appalachian Mountains. The Great Smoky Mountains are a mountain range rising along the Tennessee–North Carolina border in the… If you’ve ever wondered what it’s like to get up close and personal with the tiniest denizens of the animal kingdom, Little Matters: Insects on Netflix is your passport to a world of minuscule marvels and creepy-crawly capers. This documentary… If you read last week’s #SciFri post, you’ll know know that this time last year I was visiting Knoxville, Tennessee for the first Global Amphibian and Reptile Disease (GARD) conference. Aside from being the ideal place to network, and hear… It isn’t often that you find a documentary film about reptiles, so I was excited when I stumbled across Crocs of Katuma, when scrolling through Amazon Prime. This documentary was released in 2010, and provides an immersive exploration into the… Today marks a year since the beginning of the first Global Amphibian and Reptile Disease (GARD) conference, held in Knoxville, Tennessee. I travelled to Knoxville alone (as I usually do for international conferences), visiting the United States for the first… Sometimes you just want to watch something and unwind after a long day. That means you’re looking for something that isn’t too complex or hard to follow, until at least you’ve had a chance to have a cuppa and recover…"
