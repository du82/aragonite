full_description = "Rebecca Stott has authored a couple of books on the life of the most famous naturalist, Charles Darwin. The first titled Darwin and the Barnacle outlines his labour of love to classify and learn everything he could do about barnacles…. Some of you may remember that I went to see Nick Lane give a talk at the Linnean Society of London back in March. I’d been aware of Nick’s research for a while involving the evolution of life. For those… If like me, some of the more questionable experiments in history such as the Harlow experiments investigating the isolation of infant monkeys interest you as much as they shock you, then ‘Elephants on Acid‘ by Alex Boese is certainly a… This book features two design elements that market it pretty well towards me, that is lots of green and a frog on the cover! I was familiar with the author as I also own her earlier work ‘Field Notes from… In 2016 when I spent 3 months in Malaysia, I took a number of books to read on the flights but also for during the downtime. It turned out that I actually read most before bed, or when we were… On Monday 11th June I was lucky to join a couple of friends at Conway Hall, London for a talk by Peter Godfrey-Smith regarding his research which has culminated in his brilliant book ‘Other Minds: The Octopus and the Evolution… One of my favourite places on Earth is the Natural History Museum in London. I’ve been visiting for over 20 years now and I’m currently completing one of my Master’s projects there. It is a magical place that is the… On the 15th March, I visited the Linnean Society of London to attend a talk by the esteemed UCL Evolutionary Biochemist Dr. Nick Lane titled ‘A Bioenergetic Basis for the Three Domains of Life’. I’m a big fan of Nick’s books… Most of those who follow me on some form of social media, you’ll know that I often post things with the #StevesLibrary hashtag to share books I have recently bought or those that I am currently reading. So I thought…"
