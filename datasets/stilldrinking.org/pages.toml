title = "CAW"
full_description = "* The meticulously over-annotated reprinting of things you can get for free on the internet, but run through spell check. Also the book with Programming Sucks. Mostly by Peter Hunt Welch, except where I quoted somebody or flat out stole a line from a friend once I was sure they didn't remember saying it. Also it turned out to be mostly about COVID-19. An investigation of the principles of commuting in one hundred meditations. Subjects include, but are not limited to, the implications of autonomy, the attitudes of whales, the perfidy of signage, and the optimal positioning of feet when approaching one's subway disembarkation. This is the story of a boy, a girl, a phone, a cat, the end of the universe, and the terrible power of ennui. IDENTIFYING INFORMATION: Peter Hunt Welch is a 20-year-old single Caucasian male who was residing in Bar Harbor, Maine this summer. He is a University of Maine at Orono student with no prior psychiatric history, who was admitted to the Acadia Hospital on an involuntary basis due to an acute level of confusion and disorganization, both behaviorally and cognitively. He was evaluated at MDI and was transferred from that facility due to psychosis, impulse thoughts, delusions, and disorientation. Ever wondered how to justify your own righteousness even while you're constantly embarrassed by it? Or how to make a case for your own existence when you contribute nothing besides nominal labor to a faceless corporation that's probably exploiting children? Are you clinging desperately to an arbitrary social model imposed by your parents and childhood friends? Or screaming in terror, your mind unhinged at the prospect of an uncaring void racing to consume the very possibility of your life having meaning?"
