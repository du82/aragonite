["https://stilldrinking.org/assholes-in-paradise"]
title = "Assholes in Paradise"
full_description = "Sea Level I know where to start, thanks to David. I have just enough time to drop off my semi-dinner (good bread seems hard to come by) and get to the top before sunset.The first part of the trip is the first real road I’ve driven, and I’m not sure what the driving culture is like. I use a standard 5 mph speeding cushion, and get passed by a lot of people, which is fine, except I’m in the slow lane on a highway sprinkled with lightly labeled stoplight intersections and I’m eventually going to have to make a left. I consider pulling over to set up the GPS, but instead choose to white-knuckle it. I navigated Bangor without an iPhone, and by God I can make one damn turn off a Hawaiian highway.I nail the turn, and start up the mountain. The switchbacks start early, which I expected: David told me the road has the greatest elevation change in the US, and maybe the world, going from approximately sea level to 10,000 feet. All the travel articles warn about lightheadedness when ascending. First Night “I visited with my brother from Los Angeles in 2007, and we decided to stay. Tried Honolulu a few years back, but the life is better in Maui,” said my first cab driver. I was taken aback by how casual he was about moving across an ocean to a foreign country before I remembered that I didn’t have to go through customs and I was not in a foreign country. I think the knowledge that I was still in the US was evicted by seeing that the airport hadn’t bothered installing windows in half the hallways, since it wasn’t likely to drop below 70 in the next hundred thousand years.I managed to acclimate to still being in America when we drove through a small, mid-highway shopping town, with the actually useful stores for locals, as opposed to the tourist villages selling crustacean homes snapped up via eminent domain. It felt a bit like Pompano, Florida, which feels a bit like Ellsworth, Maine, but with palm trees. Nothing anchors the American experience like a strip mall. After that, we drove along the North coast for about twenty minutes, through a closed tourist village, and on into the interminable night, which really only terminabled five minutes outside the village, but made me realize I should have rented a car.The cab dropped me off and drove away, and once the headlights vanished around the turn, I stood and waited for my night vision to recover.And waited.It’s easy to forget what “night” means when you live in a city, or even on a country road with periodic streetlights. After a few minutes I switched on my phone flashlight and started trying to figure out where I was staying. It wasn’t too hard: About five minutes to find the building, another minute to find the door, another minute to find the light switch, five seconds to shoo away the hallway lizard, and I was in the apartment. Looked kind of like this. The lizard, I mean. Not the apartment. It was cozy. Actually cozy, not Craigslist-apartment-listing cozy. I dropped my bags, opened the windows, flipped through the folder of closed and too-far-away delivery places, accepted that I was in the jungle and would definitely not be getting a drink or food, poured myself a glass of water, stepped on to the porch, shooed away the porch lizard, and settled into to listen to the sounds of Maui, which turned out to be some invisible birds and the most basic conversation I’ve heard this side of college.“I’m addicted to weed, I haven’t gone a day without weed in… eight years?” put the happy couple in their early 20s, no older than 24. I thought about going down and asking for a beer, but as the content of their chat sank in, I knew there was no way that encounter could have ended well. The conversation was at least post-makeout, probably post-coital: Comfortable enough to relate the highlight reel of teenage embarrassments in that humblebraggy way because they want to be seem honest and marginally sensitive but need to maintain their cool exterior and it’s all desperately precious.I wished the guy had said something memorable that wasn’t about the fact that he’d never been addicted to anything and thought getting stoned for eight years qualified as an addiction. Instead, he communicated in tiny affirmatives and subtle suggestions that their discussion would go better in a private room. Fortunately for me, the girl either didn’t notice or didn’t care. She went on to tell a story about her dad finding her cigarette stash after she hid it in a rolled-up stocking inside a laptop bag at the bottom of a backpack filled with CDs and socks in the middle of a pile of bags under a sombrero full of keychains behind her winter coats at the back of her walk-in closet, which I assume was in her summer cottage in Narnia. It sounds impressive, but, though I’m not a parent, that’s the first place I would look. Hide things under the mattress. Parents will cut open a mattress to look inside it before they look under it.Her other story that wasn’t about getting drunk involved a guy who did something undescribed to one of her friends. So she found him at a bar surrounded by girls, shouted at him, then slapped him and stormed away. She described this as the reason “You do not. Fuck with my friends,” but I’m pretty sure she guaranteed him a blowjob that night. It ain’t right, but it’s so.Ultimately, they seemed nice enough, despite being basic, and they did save me from going a day without material for catty social commentary. I finished my water, hit the bathroom, and flushed the toilet.I went out of my way to dig into web programming I should probably already know in order to present the following sound clip with no indication of time. It’s a story of noise, with third act plot twists that test belief. Play Stop Since I’m male, it would take until morning to discover my AirBnB didn’t come with toilet paper, which suggested my temporary landlord was also male, and an idiot. Though since the place was obviously a hotel with no real amenities under the guise of an AirBnB, he’d cracked the system better than I had. 2000 Feet I wish immediately that I had someone along to take pictures, as I almost die twice while snapping my head back and forth to keep the sweeping forests, fields, valleys, and hairpin switchbacks in my field of view. It becomes overcast as I move under the clouds created by the trade winds taking a sudden vertical course correction.Twenty minutes up, there’s a residential area and a resort. Not sure I would stay in it, but it reminds me a little of Portland, except on the side of a volcano in a tropical paradise instead of the Pacific Northwest, so it has more of a Pacific Deadcenter feel. A left turn out of the town puts me twenty-two miles from the summit. Coffee and David After some morning Googling, I located a coffee shop a mere forty-five-minute walk from my not-quite-apartment/not-quite-hotel. The map also showed a walk that may or may not have gone through private property down to a beach. I decided to save the beach for later, because coffee. For some reason I thought of this area as the Staten Island of Maui. When I finally got to the town of Haiku, I discovered it’s not just a coffee shop, it’s actually a whole tenth of Ellsworth, Maine, except warmer. I managed to get coffee, a croissant, toilet paper, and the other basic necessities. Because the city won’t come to Mohammed. In the coffee shop, I asked if there was a taxi service. The woman behind the counter audibly snickered and I felt like I’d asked for a kitten chariot.“There’s a guy around, but he’s never around. Oh, some girl dropped this off the other day.” She handed me a Lyft coupon.I thought I was finally in business and signed up for Lyft, after some confusion over text messages with whomever dropped off the coupon. I booted up the app, put in my location, and waited for a Lyft to arrive.And waited.It’s easy to forget what non-cities are like when you spend most of your life in a city, or even on a country road with periodic streetlights. The lack of infinite public and private transportation wasn’t really a surprise, it just took a little shaking off of my daily assumptions. The lack of ginger ale was weirder. I drained my coffee and walked back to my room, where I flipped through the amenities folder until I found a cab service to take me back to a car rental service at the airport.The car service connected me directly to the driver to sort out pickup, which was a lot more personable that the Brooklyn dispatchers I’m used to, who just ask for an intersection then say “five minutes” without even trying to sell the lie. David described his cab and told me an honest “thirty minutes” and about thirty minutes later he picked me up at the bottom of the road.“When did you fly in?” he asked.“Last night.”“Leaving already?”“No, I just need to get a rental car. Not that I don’t appreciate the ride.”“No, that makes sense. I’m David.”David came to Maui for a year in 1991 and never left. He gestured to some cane fields that the sugar companies abandoned after 180 years of cultivation, and pointed out how some of the fields grew a new crop anyway. He said he hoped the fields got put to new agricultural use, ideally hemp, but assumed at least some of them will go to housing due to a housing shortage, but there also wasn’t enough infrastructure to support too many buildings for too many people. Paradise can’t be for everyone. It would stop being paradise.We played the now standard game of introducing politics to a conversation.He opened with a middle pawn: “It’s hard to grow hemp because of its association with marijuana.”“Well,” I said, moving a knight, for maximum mobility, “we were headed in… the right direction about that. Just have to see what happens now.”“Yeah.” He glanced in the rearview mirror and decided to call off the game. “Since we put that crazy New Yorker in charge—”“We all hate him! I didn’t think he’d get a vote out of the city!”The carefulness of not wanted to get caught in a conversation with the wrong side reminded me of people avoiding the Stasi in Cold War movies.He pointed to some volcanoes in the distance I could drive up were I so inclined. I asked about the big one to our left while we were stopped at one of the two lights between my AirBnB and the airport.“Well, turn left here and you’ll be on your way to Haleakala Highway.”The name Haleakala unearthed a memory from my on-again, off-again freelance career. In 2011, I built a web presence for a law firm working with Public Access Trails Hawaii to help with a class action suit against the Department of Land and Natural Resources. They were trying to prevent the state from allowing the trail to be claimed, or possibly sold, for private ownership. The details are a little rusty and the website is down, but Facebook suggests a successful endeavor, and the trail did eventually reopen to the public. My nihilism kept me from investigating the outcome once the last payment cleared,1[1] but what’s left of my humanity felt a small swell of pride at knowing I played a part in postponing the inevitable capitalist doomsday when merely uttering the word “public” is a fifty-dollar fine.The guy at the Budget rental desk was a sweetheart and asked me if I was a troublemaker. The question surprised me into honesty: “I used to be.”“Good. If you’d said no I would have sent you to the back of the line.”Looking over the car options, I wondered how much the Camaro was, since I was on an island and figured I should be driving a bitchin Camaro. I didn’t get a choice and he gave me a red Ford Fusion, which struck me as a car that would move, so I didn’t complain.He then gave me a coupon for a free gift at the aquarium in a vowely subtown/resort, and a map with bold red lines indicating where they’d rather I’d not drive my non-Camero rental car. Since some of the places were one-lane dirt roads on cliffs with no guardrails, I told him I got that particular rush out of my system in Venezuela, being driven down similar roads by a bus driver who kept a bottle of wine in his cupholder.I pointed to a squiggle of a road going up Haleakala. “What about that one?”“Oh that one’s just fine.”He mentioned he was born on the island, so I asked him if he’d ever been to the mainland, and he said he tried living in Vegas for three years. “There was no ocean. And it was just,” hand gesture, “I’ve never wanted to go back.”I wanted to plead with him not to judge the continental U.S. by Nevada, but I settled for, “I’ve never even been to Vegas,” hopefully suggesting it wasn’t worth a mention as I crossed a country and half an ocean.He wrapped up my paperwork, complimented my rings and gave me a wink. “Go make some trouble.”I haven’t even pretended to own a car in twelve years, and certainly haven’t driven any modern ones, so I hated the Fusion instantly. I figured out how to turn it on, and the electric seat positioning comes back pretty quickly, and it went downhill from there. I didn’t even try to adjust the side mirrors because nothing looked side-mirror-controly and the last renter seemed to have been about my height. There were fifteen buttons on the steering wheel: the usual random assortment of media controls, plus a bunch labeled only with glyphs. One seemed to be “man shouting at church.”I truly believe there’s a multi-disciplinary graduate thesis waiting to be written about the fact that it took me less time to connect my phone to the car than it did to figure out how to turn off the hazard lights. To alleviate the suspense: it never occurred to me to look for a manual and I just shouted at the damn technology for the next three days. 4000 Feet I’m driving through clouds, and I’m freaking out. I can feel the pressure changing in my head, and some almost dormant hypochondria asks if I’m going to have an aneurysm, and I’ve superstitiously convinced myself that I get stupid at high elevation, because I never get any of the writing done that I plan to do on planes, and I have just read a book where a character’s brain stops working outside the atmosphere so she can’t be an astronaut. The stupid space car isn’t helping: since they didn’t put the light controls in a normal place, I have to pull into a rare shoulder and figure them out by trial and error, literally spinning or clicking what I think are the light wheels or buttons, then walking around the car to see what happened.Even after I figure things out, I think about turning back, but, for liver or wurst, once I decide to do something on whim, I tend to push through almost because of the rational and irrational fears they inspire. Conversely, if I’ve agonized through the semi-logic humans call decision-making, I’m much more apt to give up in the face of surprise adversity. If the pros and cons were so close as to demand thoughtful agony, a new con will tip the decision back easily. Once I’ve committed to the fear and tedium required for this kind of semi-adventure, cons are things to conquer.What’s it like driving through a cloud, you ask? It"
