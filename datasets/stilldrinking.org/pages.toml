["https://stilldrinking.org/35-things-that-surprised-me-before-35"]
title = "35 Things that Surprised Me Before 35"
full_description = "1. After 32, it became vital to know where my antacid and heating pad are at all times These are the most important things I own. Not everybody deals with stomach acid issues, but those of us who do know that you only have two minutes to stave off soul-destroying agony that won’t stop until you get at least 500 milligrams of calcium carbonate. It’s probably gotten a little better since I started paying attention to my diet, but when it hits, it has to be dealt with. I’ve roamed the streets at four in the morning, and, in desperate situations, forced myself to throw up, all for the want of a Tums.The back issue is more common, because our backs aren’t supposed to do what we do with them. Those of us with little or none of the discipline that would otherwise keep us in the gym need heating pads to trick our backs into working at least once a week.These bandaids become more and more necessary, because 2. This is the age where that shit catches up to you Your early twenties are the years where you get your comeuppance in a bad way if you’ve ever previously announced that you don’t believe in hangovers. That’s fair.The early thirties feel less fair, because it doesn’t really matter how you treated yourself. Yes, there are things you can do to slow the decline, but your body has no qualms reminding you that your peak breeding years are over and it’s just punching the clock until it can close up for good. Knowing that, 3. Pain management becomes economic So because you thought your body was a tank for the first third of your life, you’ve got some busted bits, and you take them to the doctor. Sometimes the doctor gives you medicine or advice, but at some point, your doctor will say: “Well, we could run a bunch of tests, but it’s probably nothing. Take some pain-killers.” This is the moment where you realize your health is negotiable. I don’t know if it was just Star Trek, but I unconsciously nursed the belief that any health problem can be solved with enough beeping things and flashing lights. This may be true up to a point, but what they never tell you is every beep costs as much as a year at community college. They probably could fix that nagging ache in your knee, if you’re comfortable taking out a second mortgage and selling your children into slavery. So you save your cash for the day when they do decide to run you through a few beep machines and discover your life is about to get really expensive. In the meantime, you suck it up and pop a few Aspirin. 4. 40 still looms I thought I’d be over arbitrary age-specific phobias after 30 came and went without much fanfare, but nope. Forty is still there, looking at its watch and tapping its foot, asking me if I’ll achieve anything interesting before I show up. 5. Selling out is fun and relaxing This got easier for my generation when Dubya won his second term. We shared a collective sigh and said, well, fuck it. Just give me some money to keep the internet on. And everything got easier, though I do wish we’d done something about science education before global warming ramped up its game. 6. You’re just not going to finish some things Deal with it. 7. Mostly because sleep is fantastic And you can never get enough of it. 8. If you’re not having kids, there are no more checkpoints If you eschew the twenty-year distraction/achievement of spawning, there’s a certain feeling of “now what?” that creeps in once you reach financial stability. I’m far too selfish to take care of a child, and I wouldn’t wish the next fifty years on one unless I get a signed and legally binding document from world leaders promising to get their shit together. I still have lots of things I want to do, but it does sometimes feel like “try not to die today” is stuck at the top of the list. 9. You have no control over your legacy I’ve always wanted to get famous on my own terms, which are straightforward: I have lots of money, no obligations, my name pops up a lot in The New Yorker, and nobody recognizes me in the street so they’re always shocked and awed to find out who I am. I wanted to do this through novels, but since my first novel took me fifteen years to write and still needs work, I thought I’d keep a blog on the side to look like I was producing something.After ten years of experimental short non-fiction, read by maybe my family, I picked up Tucker Max and thought he was funny, so I decided to write about my bad dates. These were the posts that finally got my friends to read it. Then, for no real reason, I wrote about losing my mind, and that’s what got Reddit to read it. Then one day I decided to try to write a rant without using profanity, and everyone read it. So all I wanted was to be a Quiet Writer Type poking away at a computer in Brooklyn, and so far I’ve been known as The Slutty Asshole, The Drugged Up Crazy Kid, and The Guy Who Hates Programming.Albert Hofmann was a chemist for most of a century, and the only reason you know his name is because you dropped acid in college. Oppenheimer? Atomic bomb. He probably saw that one coming, but I’m pretty sure he wasn’t picking graduate courses on the basis of which ones would help him blow the most shit up. Unless you manage to David Bowie your career, your claim to fame won’t be claimed by you at all: something will randomly catch the public consciousness one day and stamp your forehead with that one thing you did that time when you weren’t paying attention. 10. There’s no shame in settling in There’s a fixation in my generation that truly following your dreams means throwing away all your possessions, getting a great tan, and running around in deserts or on beaches (it has to involve sand for some reason) with a lot of healthy-looking young people and maybe one older guy who’s not creepy at all. You’ll also write a book or redecorate a studio apartment, or be enlightened or something. You will like to dance, at least for two-second intervals when the camera is pointed at you.I don’t mean to dump on anyone. I have a lot of spirited gypsy friends,1[1] and they have great stories and tell me about Burning Man and supply vital momentum to social progress, but part of the reason they get to run all over the country is they can sleep on the couches of people like me. And by people like me I mean people with apartments with couches, because possessions turn out to be awesome. I like watching movies on my giant TV. Video games are fantastic these days. I have books and heat and food all the time, plus lots of musical instruments that don’t have sand in the electronics. Are these things existentially fulfilling? No. But the thing about existential fulfillment is you can get to it whenever you feel like it, unlike clean water, or shelter in February. 11. Boredom is procrastination in disguise Seriously. Bored? In this day and age? We have access to, like, all the information via pocket computers, and even before that there was an effectively infinite world of crazy stuff. I thought boredom was a lack of creativity for a while, but it then it occurred to me that every time I was bored it wasn’t because the inscrutable mystery of existence didn’t have anything to offer right then, it was because I wanted to be doing something else. This realization didn’t make me drop everything and write a symphony, but it’s an occasional motivator. 12. It’s important to listen to music I used to listen to music on my headphones until I almost got hit by a car three times in two weeks. Unlikely as that was, and as unlikely as it will be as long as I keep an eye out, I decided that since it only takes one not-almost to disqualify me from the rat race, I needed my ears in the game too. Somehow this bled over into the rest of my life and I just didn’t think about my iTunes playlist or turn on my speakers unless I was throwing a party. Fact is, life gets a little more depressing without music. It’s also easier to get work done with a little music in the background, at least for me, so I’m making the effort to get tunes going. Also, these crazy kids actually have some good shit on the radio these days. Which reminds me 13. The kids don’t know your music Everybody warned me about this, but it still hurt because I made a real attempt to get to know my parents’ music, mostly because I was homeschooled and didn’t have another option. I even try to listen to the kids’ music, because I’m never the one picking the music in the office and I don’t have another option.So I try to accept people not knowing Primus, but Nirvana? I don’t even like Nirvana that much, but you can’t not know they were a thing. 14. But seriously, you should know Primus Primus has the weirdest fan demographics I’ve ever seen: frat boys up front, Grateful dead retirees in the back, and a mix of goths, punks, good ol’ boys, army lifers, pseudo-intellectuals, and kids on mushrooms in between. No publicity department anywhere has ever come to the conclusion that this is the group of people they should focus on. I don’t even know what this group of people could be defined as, but it’s always the same group. And 90 percent of us would never speak to one another in polite society, but we’ll all drop our problems when Jerry the Race Car Driver starts up. I don’t know why Primus brings the world together, but goddamn. 15. Happiness is a short commute This is one of those nice facts that’s true on the day-to-day scale and even truer when taken to absurd extremes. A thirty-minute commute is better that a two-hour commute, and no commute at all is clearly better than one that never ends. It turns out simple and measurable happiness factors like these are rare in life, and you should keep a list of any you find so you know where to start if you feel like killing yourself. 16. You can still hang out with your married friends, until they have kids Married friends without kids are the same as your friends who go excessively steady. There’s no mysterious vanishing act: they still hang out, they don’t decide to only hang out with other married couples, and they’re comfortable around their single friends unless they weren’t in the first place.Once they have kids, they’re gone, they have nothing in common with you, and you don’t want to talk to them anyway because fucking hell, enough about the kid already. 17. There are the callers and the called Some people get in touch with me all the time. Some I would never see again if I didn’t go out of my way to keep in touch with them. It’s tempting to think of this as a pecking order, but it’s a matter of temperament. Some of my friends are shut-ins, and they’re busy with books and video games and living quietly. Some of my friends are semi-famous and they have a lot of people to deal with all the time. Some of my friends are on the excessively gregarious end of the personality spectrum, and I love them but I don’t have the energy for a three-hour phone call twice a week. Some of my friends I never call, because our friendship is based on eating potato chips and watching Buffy, and we don’t have that much to talk about. It’s not important. 18. You are indeed a special snowflake, but nobody gives a shit Everybody’s got a story worth listening to for some amount time. It might be a small amount of time, but it’s not nothing. But it’s good to remember that all your stories feature you, and odds are nobody else remembers your highlights. I can definitely remember hating or being impressed by two or three strangers today, but I don’t remember why or what they looked like, and I never will. I’m too busy snowflaking through my own life. 19. Farting is part of the routine I dimly remember being embarrassed about all my methane emissions, now I just try not to emit them in elevators. I find the trick is to take care of it with gusto in the morning. 20. Alien is still the best sci-fi movie ever made I’ve exhausted most of the internet’s store of science fiction movies, so whenever I dig deep on Netflix for that shitty straight-to-video sci-fi flick that somehow missed my radar, I realize I really just want to watch Alien again. The slow build and increasing desperation are the envy of any horror flick, and the story is spacefaring humans encounter alien life for the first time, and that alien life eviscerates them like its opening the yogurt it should have had before it got drunk last night. It’s not just offing the humans, it’s messing with them by the time it’s six hours old. In fact, I’m putting that on right now, but before I go, the reason the Ripley character is so good is because Sigourney Weaver does fear so well. She’s the archetype that people dimly imagine when they say “you can’t be brave if you’re not afraid.” When evolution’s end game has a mouth erection for your skull, you’re going to be afraid. Ripley keeps moving when every instinct she has is curled up under a blanket and crying, which is why when she delivers the line “I got you, you bastard,” it doesn’t sound like a freshman ejaculating on his keyboard.Plus it’s got John Hurt in it. He was the cool old English guy before Patrick Stewart and Ian McKellan decided to be cute all over Brooklyn. 21. I still haven’t paid off my student loans This is especially galling because no one, anywhere, has ever given a damn about my college education. I got an interdisciplinary degree in film theory which was rightly ignored by everybody who hired me to do things in film, then people stopped hiring me to do things in film and my career swerved into professional nerding. 22. Ring around the collar is real I remember watching commercials as a kid thinking, “Jesus, how hard is it to wash your neck?” It’s too bad I was so judgmental about it, because now I look at my white button-ups and think, “I’m a disgusting pig.” 23. There will never be peace in the middle east I mean, I like peace, but I just saw a headline about the US sending people to train rebels in Syria, because that always works, and I’m just over it. 24. Wine is the best alcohol Every three or four years, the medical community changes its mind on whether or not wine is good for you. I’m not a doctor, but whatever they say, alcohol is bad for your liver, so if you must drink it, as I must, wine is the only game in town. You can’t chug it unless you’re insane, it’s not another variation on cat urine like beer, and nobody tries to pressure you into doing half a dozen shots of it at the end of the night to guarantee a spotty memory of whatever the pressuring party wanted to do next. Speaking of which: 25. Peer pressure still happens I happily remain immune most of the time, but people will still try to convince you you’re not cool enough if you’re not doing whatever they’re doing. At thirty-five.Judging from observation, you get a reprieve from this if you drop a kid, but even if you don’t, peer pressure should be over by twenty-five, to say nothing of the next decade. If you have to try to break somebody’s self-respect to get them to follow your example, consider the possibility that "
