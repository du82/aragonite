["https://stilldrinking.org/a-brief-history-of-manhood-as-illustrated-by-star-trek-captains"]
title = "A Brief History of Manhood as Illustrated by Star Trek Captains"
full_description = "I’m not precisely a trekkie, but I know an awful lot about Star Trek: The Next Generation. I love it. It was something my family watched together, and it represented a moment of thoughtful enjoyment when we were all still stuck together and blamed each other for dissolution of our personal dreams as various ages set in. I was disappointed later in life when I went back to Star Trek in a fit of nostalgia and discovered it wasn’t that good. It wasn’t for lack of creativity, it was the writers’ compulsion to illustrate every minor emotion and trivial event with expository speeches by whomever was the most self-righteous character present.1[1]However, Star Trek is the undeniable face of geek culture, even more so since the portion of the human race which creates humor hinging on the definition of geekdom has been universally enslaved by computers, and can no longer mock geeks for the same affliction. Despite this role as the lowest common denominator for geekery, the Star Trek franchise seems unmoved by the usual geek demands. Every incarnation of Star Trek ignores the conceit of its predecessor, and the fans devour it. Regardless of their aesthetic opinion, they clog the internet with commentary as often as they clog it with porn downloads. If you look at the vehicles for the mythology, it’s baffling: The initial Star Trek was the epitome of camp. The first six movies slowly fixed this by virtue of eventually being good movies focussed on character, a journey aided by the participants eventually learning to act. Then comes Star Trek: The Next Generation, which, aided by the digital revolution, captured an audience with special effects that were special in the good way, meaningless jargon, and Marina Sirtis’s tits. Gone are the catch phrases and cowboy sentimentality, gone are the semi-humorous references to a misremembered past, gone are the soft-focus close-ups of the female crew. Contrast this to the reincarnation of Doctor Who. Despite a budget that appears to be several billions pounds more than the original series, the new Doctor Who maintains the camp value. Things happen because the doctor shines a blue flashlight in the general direction of the problem. Doctor Who fans of old would not have accepted less.The power of geek demand is even more evident in the inevitable arc of Marvel Comics movie adaptations. I submit the Spiderman and X-Men series. The first movie has to cover the basics, the introductions, and establish the world of nuclear spiders or genetic freaks. This movie will attempt to appeal to the public at large, but will have jokes nobody but the target demographic will understand, the best example being Cyclops’ line in the first X-Men when Wolverine complains about his uniform: “What would you prefer… yellow spandex?”2[2]The second movie in both of these series is fairly good. They’ve captured the audience in just the way the first Fantastic Four movie didn’t, and whoever is directing feels liberated to focus on the most interesting story line and make a real movie. Both the second X-Men and the second Spiderman were excellent movies for the budding genre. Then comes the third. Everybody making Marvel Comics movies understands they will never have the gravitas of a DC Comics movie. Batman and Superman are comic characters that captured a notable percentage of our metaphor-making abilities; Marvel Comics, is, well, comic books, one of the socialist forces taking our children away from Jesus. So the producers are certain they have a trilogy to work with, and that’s the end of it. Here, as in the first movie, they pander to the geek power, trying to satisfy every imagined conversation starting with “Man, they’d better do the (most complex multi-year, thousand-issue, defining story of the characters) in this movie or I’ll post disparaging comments on this internet forum.” They are not paranoid; most of their fan base is having that conversation well before pre-production. So they try to cram a twenty thousand pages of story line into a two hour movie.One of the very few times I try to defend the film industry is when people complain about a movie adaptation not being true to the book it was based on. This is probably misguided, as the film industry—from the production assistants working for fifty dollars a day to George Lucas and including every pre- during- and post-production house and every TV show cast and crew and everybody who reviews or works on or distributes or is professionally related to any frame of film in any way—is composed of power crazed and developmentally paralyzed narcissistic screaming lunatics. The exceptions are too rare to be worth mentioning, so these people should be criticized for everything all the time, just because they’re mostly bad people who should suffer. However, the aforementioned critique is a misconception about what a movie is, and what the art form is capable of. At its most epic, a movie covers the narrative space of a short story. You cannot fit a four hundred page novel into a movie unless it’s fifteen hours long. You cannot fit a ten-year weekly story arc into a movie at all. Yet they try. And the movies are awful. And they did it because of the power of the geek demographic, which demanded that the movie tell a story it’s not capable of telling.Star Trek transcends this kind of obsessed fan-base hamstringing. Star Trek: The Next Generation3[3] changed the pathos with tectonic ferocity. The techno-babble was jacked up in direct proportion to the production values, and the special effects made the world of the next generation a more staggering advancement over the world of the original series than the original series was over the actual world of 1966. They could do this because the true fans of Star Trek were either nostalgic middle-class boomers or totally insane, and both kinds of people love reincarnations of dead pop culture. It gave the boomers something recognizable in modern culture, and the insane something to argue about.Spurred by the success of SNG, the producers spun up Deep Space Nine, which is the West Wing in space with slower dialogue and fewer jews. What’s next?A lot of crap, honestly. No matter. The meaning of Star Trek lies in its role as the archetypal geek obsession along with its immunity to geek demands. It’s defining its culture instead of being a byproduct of it. Add the fact that its creators are the forbidden offspring of cultural opposites: the scientist and the TV producer. Geek culture, since it’s defined by a lack of access to sex, is predominantly male, thus what Star Trek offers us is the template of what thinking geeks believe to be, and can sell as, the definition of manhood.Via the captains. James Tiberius Kirk (Star Trek, 1966-1969, and a bunch of okay movies) The best line William Shatner ever delivered was “Second star to the right. Straight on till morning.” It was at the end of Star Trek 6, the last Star Trek movie with the original cast. Personally, I didn’t get it right away; my mom4[4] pointed out that it was from Peter Pan, and that Kirk has a Peter Pan complex. This was the summation of the Kirk character: a boy who never grew up, living in the stars. I would say Kirk is the Peter Pan of the late sixties, but I won’t, because Kirk was indicative of return to youth in the heroes of the era. I’m hesitant to make judgements about the late sixties, since I wasn’t there and I’m barely aware of the thirty years I’ve been around. I’m going to defer to my parents for most of the facts. But since the music of the late sixties still informs most of the emotional assumptions of college students, I can start with that. The picture that so many young hippies hang their misinformed fashion senses upon is the flower child. It should almost have quotes. “Flower child”. The flower children are now yuppies (mostly), dead (occasionally), or still hippies (rarely). I cannot believe that a generation of undergrads adopted “child” as part of their name without a Freudian agenda: the political and social wake up call was a more senseless than usual war started by the aging generation of The Last Real Men who fought The Last Moral War. This, alongside a sexual and drug revolution, led to the kind of budding consciousness that inevitably and wrongly associates itself with childhood. Children are in fact little psychopaths, but we need to think they’re innocent and wondrous to perpetuate the species, so we imbue them with all the most irrational expectations we have for the platonic fantasy of our own egos, and say things like “children see the world the way it really is,” and depict children getting free tickets in afterlife fictions like Defending Your Life and the rapture. This leads us to confuse childlike actions (starting fights over the slightest upset, claiming things for themselves just to see if they can get away with it, complaining about everything that isn’t a silver teacup on a hooker’s ass) with the qualities we miss about being a child (idealism via ignorance, egalitarianism via powerlessness, and curiosity because everything is new and pretty).The backstory was this: the man of the factory fought the good fight, and won for the values of a hardworking, unquestioning people working for a nation. Then, after a quick honeymoon in the 50’s, they were alternately betrayed by and betraying the nation they’d bronzed in blood. The only option for a person growing up in this situation was to try not to grow up, and clutch the confusing ideal child archetype. For the actual flower children, this meant sex and drugs to a degree I wasn’t even capable of, and God knows I tried. For the geeks, this meant James T Kirk. For the geeks of the day, Kirk was the geek who battled jocks and slept with asians. Jocks and asians? Yes. Mean, gigantic aliens, without remorse, without any attempt at relating to your unique, misunderstood position as an open-hearted traveller in this cruel, cruel, M-class planet of the day. Asians because the white American psyche is basically divided into white people (like me!), black people (I feel bad for reasons I don’t completely understand!), and asians (exotic in a way I’m not required to understand! Thank Christ!). For anyone who doesn’t live in a real city, alien women in science fiction basically amount to asian women in real life. Women that men are not historically required to understand are the lifeblood of the stereotypical geek who doesn’t understand women, because now they are in their element of trying to figure out a puzzle no one else has the patience to solve. Except Kirk. James Kirk understands alien women. He is the the Peter Pan who fights space pirates and suspiciously human-looking Klingon bullies, and wins every time. No one takes away Kirk’s toys. Logic (Spock) and reason (Bones) are mere obstacles to be trampled by Kirk’s will to powerfully fulfill the dreams of Man-Geek. Every other supporting character is a foreigner or a babe. Kirk was the uber-child, a being enslaved by his impulses, and immune to punishment despite daily violations of what is apparently the only directive of the organization that gave him a heavily armed battlecruiser. The myth of Kirk is that only the unpredictable, wild card child, following his personal sense of good, against all odds and all the laws of the very government that granted him the privileges of his command, could solve the intractable problems of his mission.Hard not to love him. Jean-Luc Picard (Star Trek: The Next Generation, 1987-1994, and a few shitty movies, except the second one, which was okay) Was French. Isn’t that awesome? In the time of freedom fries, the geek man’s man5[5] remains French.6[6] Of course SNG was off the air seven years before freedom fries became a cultural necessity for the stupid, but Picard remains an icon of manhood, as symbolized by the ubiquity of the face palm. Google it. The face palm is the fundamental expression of utter disgust in geek culture. Picard would willingly sacrifice his emotional control to aid a vulcan ambassador in need of Valium. Picard will experience any form of humiliation or risk of death in order to save an innocent species, a treaty, or his ship, in that order. Picard reeked of dignity, but would sacrifice that very dignity for a cause, or even for the sake of someone else’s dignity, which made his dignity all the more profound. So if Picard’s response was to put his head in his hand, you fucked up something tragic.Picard is the opposite of Kirk. Picard felt privileged to do his duty, while it was never clear Kirk knew what the word duty meant. Picard was the picture of self restraint, Kirk sought out new and interesting aliens to punch. Kirk was a salve to a generation that realized they hadn’t questioned enough, Picard was the answer to a generation that questioned too much without waiting for an answer. Picard, above all else, was in control, and his sense of right and wrong is based on simple guiding principles which he follows without exception. He is never morally confused about the next course of action; if he cannot decide what to do, it is only because he has incomplete information. There’s a telling scene in Data’s Day7[7] where Data gives the odds of Picard’s next course of action. It was probably meant to point out that Data sees personality as a collection of probabilities, but it’s illustrative of Picard’s predictability. That’s the fundamental difference between Picard and Kirk: Kirk was an unpredictable force who could eliminate any enemy advantage because he wasn’t playing by the rules, and he didn’t play by the rules because his heart was bigger than a bunch of rules. Rules were for fascists. Picard always followed a strict code of ethics, which made him predictable, but his focus made him ridiculously good at everything. Kirk was a boy who never grew up, Picard is a man who was never a boy.This is why Picard’s two-episode torture story arc is the best work in the series.I assume non Star Trek fans have given up reading at this point, but for Star Trek fans who don’t know the story, Picard is tricked and captured by the Cardasians, who are sort of the Iranians of the Star Trek universe. Once captured, Picard is beaten, stripped naked, and left to hang by his wrists until his torturer arrives. The next episode is an hour of Picard’s relationship with his torturer.The torturer opens their relationship with a seeming act of mercy, handing Picard something to eat. Picard, starving, accepts it, and opens what looks like an alien egg filled with maggots. Picard is slightly taken aback, but even as an abused prisoner of an alien species, with no hope of escape and little of rescue, Picard will not allow himself to be seen as culturally insensitive. He eats the maggots with gusto.His torturer expected this, of course, and uses Picard’s impeccable etiquette against him by putting the primary means of torture8[8] in the maggot snack. I like to think of this as the first act of psych"
