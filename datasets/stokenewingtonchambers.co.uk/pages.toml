["https://stokenewingtonchambers.co.uk/governance-standards-committee-complaints-basics"]
title = "Accused of Councillor misconduct and Governance & Standards threat?"
description = "Are you a councillor under threat of Governance & Standards committee referral and investigation for an alleged breach of your local Code of Conduct? There are basic procedures your Monitoring Officer should be following. These basics are found in the Localism Act and in your council’s own Governance and Standards Complaints Procedure. In many post-Standards Board […]"
full_description = "Governance & Standards Committee Complaints Basics Sep 4, 2017 | Code of Conduct complaints, Local Authority councillor investigations, Public law Are you a councillor under threat of Governance & Standards committee referral and investigation for an alleged breach of your local Code of Conduct? There are basic procedures your Monitoring Officer should be following. These basics are found in the Localism Act and in your council’s own Governance and Standards Complaints Procedure. In many post-Standards Board for England cases I’ve seen, Monitoring Officers fail to get a grip on Localism Act and their own council’s procedures. These grip failures can lead to ineffective investigations – and do nothing to assist Governance and Standards Committees in assessing whether or not there has been a breach of the Code. Allegations must be written. The Localism Act states: “an allegation, in relation to a relevant authority, means a written allegation— that a member or co-opted member of the authority has failed to comply with the authority’s code of conduct” Before any request for a councillor’s explanation, the Monitoring Officer will no doubt be required by their council’s own rules to provide an exact copy of the written complaint to the councillor. The reason why the written allegation should be disclosed to the councillor at the outset is because the councillor must know exactly what’s being alleged before being expected to provide an answer to it. Not a paraphrase in an email or telephone call ambush. This isn’t a Monitoring Officer to councillor general chat. It’s an investigation into a written allegation. What are the constitutional law principles underpinning these procedures? Executive branch officers (and Monitoring and other council officers are part of the Executive) only have power to act where parliament has given them that power. The Localism Act only gives officers the power to investigate written allegations. There’s no power in law for Monitoring and other council officers to conduct fishing expeditions. Now that the Standards Board has been abolished, many councillors are feeling obliged to get their own legal advice on how to hold Executive officers to account. The sooner advice is taken, the easier it is to untangle any council and Monitoring Officer missteps. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
