description = "Thinking of throwing gum at away fans? Don’t do it. Dan Russell of the Nottingham Post reports: “A Nottingham Forest fan who threw a lump of chewing gum across the stand at the City Ground as his team conceded a goal has been hauled before the courts and hit with a £100 bill. Charlie Inger, […]"
full_description = "Yes fans, it is possible to get a Football Banning Order for throwing gum in the stands Apr 3, 2016 | Criminal law, Football Banning Orders, Football law, Private client criminal defence Thinking of throwing gum at away fans? Don’t do it. Dan Russell of the Nottingham Post reports: “A Nottingham Forest fan who threw a lump of chewing gum across the stand at the City Ground as his team conceded a goal has been hauled before the courts and hit with a £100 bill. Charlie Inger, of Wheatley Drive, Carlton, pleaded guilty to a charge under the Football Offences Act. He admitted that, at a designated football match, without lawful authority or lawful excuse, he threw chewing gum at or towards an area in which spectators were or may have been present”. While the article doesn’t say whether or not the police applied for a Football Banning Order, it’s possible for them to do so as this charge is on the Schedule of Relevant Offences. Regular readers of this blog will know that even just “messing about” with a blow up doll at the Emirates can put you in the frame. Don’t do it. If you do, it’s likely you’ll be needing a lawyer to help you explain yourself to the Magistrates. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]