description = "These #Celtic soccer fans broke the rules to show their love for Palestine.https://t.co/o62qnk2ZaE — AJ+ (@ajplus) August 18, 2016 Yes, football fans do have an ECHR right to Freedom of Expression, but fans should bear in mind two things: 1. That freedom is a qualified right – this isn’t America; and crucially 2. Celtic FC […]"
full_description = "Freedom of Speech & Celtic FC Palestine Placards Aug 18, 2016 | Criminal law, DIY Law, Football Banning Orders, Football law, Miscellany, Non-legal help, Social Media These #Celtic soccer fans broke the rules to show their love for Palestine.https://t.co/o62qnk2ZaE — AJ+ (@ajplus) August 18, 2016 Yes, football fans do have an ECHR right to Freedom of Expression, but fans should bear in mind two things: 1. That freedom is a qualified right – this isn’t America; and crucially 2. Celtic FC is not the Government. Your Article 10 ECHR right is aimed at Government interference with freedom of expression, not a private company’s. While I’m no expert on Scottish criminal law, I can see from Celtic FC’s terms and conditions, under, Standards of Conduct, that, the promotion or endorsement of any political organisation is not permitted in the stadium or on Club property. Given that the match was against Hapoel Be’er Sheva, and is likely to incur a UEFA fine, it would not surprise me if Celtic management take action against these flag wavers. I admire men of principle. But be aware that your principles may cost you a future welcome through the gates of your club. Dealing with a possible sanction is probably best met with an acknowledgement of “their club, their rules”, rather than a shouty letter telling Celtic all about your “rights”. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (fun