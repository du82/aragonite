full_description = "Why most self-represented defendants lose their cases in court: 5 things you should know FREE DOWNLOAD Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{background:#fff; clear:left; font-size:14px;font-weight:bold; } #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #ac1e34;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true); window.setTimeout(function(){ DiviPopup.openPopup('#free') }, 10000); About Schedule a call Home Direct Access Barrister Criminal law Save time, money and avoid unnecessary guilty verdicts Schedule a call Clear and simple advice Get the best possible strategy Fixed fees for peace of mind Avoid the two most common (and costly) mistakes people make when facing charges Many people charged with crimes and motoring offences make one of two mistakes They prepare their own case and risk an unnecessary conviction or harsh sentence. They hire a solicitor who outsources their case to a barrister at the last minute and charges a small fortune. Did you know that you can work directly with a barrister and cut out unnecessary “middle-man” fees? Get a fixed quote and get the best results – first time. “Kristin was great today and got the case thrown out. Kristin is a very hard working Barrister. She put in a ton of work in getting the case together.” Mr. J. Cockett Kristin Heimark What’s the real cost? I understand that there is a lot at stake – your licence, your reputation – your job. Choosing to represent yourself, or choosing the wrong lawyer, could cost you more than you think. You deserve to have a barrister on your side when facing a criminal or motoring charge. I’m a direct access qualified criminal and motoring law barrister – and I can give your case the expertise and attention it deserves to help you get your life back. Schedule a call Get clarity and certainty in three easy steps Schedule a call Provide a few basic details, then we’ll have a brief call. There’s no obligation to proceed. Receive a plan If you are comfortable to proceed, I will prepare your strategy & review it with you. Get the best result Attend court with complete peace of mind. I’ll be by your side to help you get your life back. Schedule a call “Kristin put together a watertight case which demonstrated on multiple fronts that there was no case to answer. Throughout the process she was fearless, incisive and a truly inspiring guiding light.” Cllr B Locker, Colchester Borough Council Sometimes bad things can happen to good people – don’t let it define the rest of your life. I understand the worry and stress that accusations can cause. Criminal and motoring charges often happen when you least expect them. Sometimes things just go wrong. After all, you don’t plan to have a car accident. What if you get accused of something at work, or if an argument gets out of hand? Perhaps you used violence to defend yourself and are accused of going over the top. I know that these things can just happen. Let me give you the defence you deserve. Kristin Heimark"
