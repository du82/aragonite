full_description = "Tenants’ Rights: Get Advice (2) Sep 22, 2014 | Advocacy, Criminal law, Direct Access Barristers, DIY Law, Landlord & Tenant, Tenants' Rights As an update to Tenants’ Rights: Get Advice, if you are having problems with your landlord and want to try to solve your dispute without a lawyer, you might find the following Legal Action Group books helpful: Repairs Tenants’ Rights by Jan Luba QC, Deirdre Forster & Beatrice Prevatt Quiet Enjoyment (Arden & Partington) Defending Possession Proceedings by Jan Luba QC, John Gallagher & Nic Madge The LAG books are a great place to start as they are written in plain English for lay advisers. For black-belt level reading: Residential Possession Proceedings by Gary Webber Woodfall: Landlord & Tenant Finally, my favourite for Civil Court procedure is, Sime on Civil Procedure. It is always important to get the latest edition of any law book as the law does change. I was in Stratford Mags the other day and a pupil barrister was hoofing around copies of Blackstones and Archbold from 2008. On seeing her look up the law in her outdated Archbold, I heard one of the barristers take her to one side and comment that this was, “dangerous”. I agree. UPDATE This has turned out to be a trio of posts on Tenants’ Rights. Please also see, Tenants’ Rights: Get Advice & Stop Problems Before They Start. UPDATE See also, Tenants’ Rights: Get Advice (Why should I pay you when I can get it for free?) Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block a