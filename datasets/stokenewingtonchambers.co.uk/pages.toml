description = "Want to know a trade secret? The best way to avoid contract disputes is to have a clear contract. Tip number two is that tenancy agreements can be written to favour a landlord or a tenant. Tenancy agreements are contracts. Did you negotiate yours – or did you just sign whatever the landlord or letting […]"
full_description = "Tenants’ Rights: Get Advice & Stop Problems Before They Start Sep 24, 2014 | Advocacy, DIY Law, Landlord & Tenant, Tenants' Rights Want to know a trade secret? The best way to avoid contract disputes is to have a clear contract. Tip number two is that tenancy agreements can be written to favour a landlord or a tenant. Tenancy agreements are contracts. Did you negotiate yours – or did you just sign whatever the landlord or letting agent put in front of you? The Government has published what it hopes is a balanced and comprehensive Model assured shorthold tenancy agreement. Along with the model tenancy agreement, the Government has also published, How to rent – a checklist for renting in England. If you read these before putting pen to paper, you can see issues which may need to be addressed in your landlord’s proposed agreement. I have heard landlords say, “Don’t worry, we can deal with x later”. A prospective tenant may be frightened of a landlord saying, “Don’t you trust me?”. It’s not about whether a prospective tenant thinks a landlord is a nice guy or trustworthy – it’s about everybody knowing exactly what their rights and obligations are before they sign. I resurrect one of my favourite talks on negotiating contracts, Mike Monterio’s, F*ck you, pay me and recommend it to anyone about to sign any agreement This is one of a trio of posts on Tenants’ Rights I’ve published in the last few days. Please also read, Tenants’ Rights: Get Advice & Tenants’ Rights: Get Advice (2) as they are aimed at helping tenants think about when they may need to get a fixed fee solicitor or barrister in to give them a steer – and some ideas for further reading. See also, Tenants’ Rights: Get Advice (Why should I pay you when I can get it for free?) Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
