full_description = "Challenging parking fines Nov 23, 2014 | Despicable You, DIY Law, Miscellany, Motoring Law, Road Traffic law | 1 comment Parked on private car park and have a “fine” on your windscreen? The Telegraph reports that Michael Green, a Cambridge law graduate, “is fighting to take every private parking firm in Britain to the High Court”. Mr Green may be on to something. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true); 1 Comment Lee on November 24, 2014 at 1:10 am Simples. Challenge on basis of disproportionality. Claims must be based on loss. Amount must be reasonable and necessary. Based on a legitimate aim. And it must be the minimum necessary to achieve that legitimate aim. Lee on November 24, 2014 at 1:10 am Simples. Challenge on basis of disproportionality. Claims must be based on loss. Amount must be reasonable and necessary. Based on a legitimate aim. And it must be the minimum necessary to achieve that legitimate aim."
