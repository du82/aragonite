description = "Guarantor for a tenant? Is the rent guarantee enforceable? DIY lawyering may not be the smart option. Ring 02036420152 for direct access to a L&T barrister."
full_description = "Acting as guarantor for a tenant: is it enforceable? May 16, 2017 | DIY Law, Landlord & Tenant, Tenants' Rights Guarantor for a friend’s tenancy rent and now it’s all gone wrong? Is the landlord coming after you because they say the friend you “indemnified” and “guaranteed” is in arrears – and you’re friend’s disputing the amount, skint, no-where to be found, etc. If you didn’t get legal advice before signing a rent guarantee, now’s a great time to do so. Yesterday, I advised a man in these circumstances – and it took all of five minutes for me to ascertain that the rent guarantee in his case is not enforceable. The man I helped yesterday is intelligent and can read English to a high standard. His only issue is that (up until his appointment with me) he didn’t understand the law. It made perfect sense for him to come to a direct access landlord & tenant expert – and I was pleased to give him clarity and a steer. His post-advice email to me reads: “Thanks for your advice yesterday [that] the guarantee is meaningless. Again, in absence of flowers, choccies etc, many thanks”. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuer