["https://stokenewingtonchambers.co.uk/renters-private-landlords-housing-discrimination"]
title = "Renters, Private Landlords & Housing Discrimination - Stoke Newington Chambers"
description = "It’s been a while since this screen-shot (click to enlarge) prompted a Twitter bust-up (as reported on over at the Duchess of Hackney’s blog). But I thought I’d use this little exchange as an illustration of how people who are trying to do the right thing can still get it desperately wrong. Are estate agents […]"
full_description = "Renters, Private Landlords & Housing Discrimination Feb 12, 2014 | Direct Access Barristers, DIY Law, Landlord & Tenant, Non-legal help, Women & the Law It’s been a while since this screen-shot (click to enlarge) prompted a Twitter bust-up (as reported on over at the Duchess of Hackney’s blog). But I thought I’d use this little exchange as an illustration of how people who are trying to do the right thing can still get it desperately wrong. Are estate agents and landlords permitted to discriminate against non religious believers? What can you do if you’ve been at the sharp end of an estate agent’s or landlord’s discrimination? The starting point for any discussion about housing discrimination is the Equality Act 2010. The purpose of the Equality Act was to bring all the previous anti-discrimination legislation including the Sex Discrimination Act 1974, the Race Relations Act 1975 and the Disability Discrimination Act 1995, all under one roof. The “protected characteristics” under the Equality Act are: Age Disability Gender reassignment Marriage and Civil Partnerships Race Religion or Belief (or lack of belief) Sex Sexual Orientation A person is protected from discrimination if s/he is treated less favourably because of one or more of these attributes. If you look at Part 4 of the Act, you’ll see the prohibition against discrimination in the disposal or management of premises. Schedule 5 does provide exceptions to the above rule – particularly with regard to “Small Premises”. Paragraph 3 describes Small Premises as shared accommodation – and as the Explanatory Notes show, this exception does not cover Carrie’s situation in the above screen-shot. “A Jewish family own a large house but only live in part of it. They decide to let out an unoccupied floor but any new tenant will have to share the kitchen and cooking facilities. The family only choose to let to practising Jews as they are concerned that otherwise their facilities for keeping their food kosher may be compromised. This would be permissible under this exception”. So what’s Carrie’s remedy? Sure, she can get in touch with the local renters’ activist group and they may attempt to “confront” the agent or landlord in an attempt to resolve the situation – but I do have to wonder how effective that approach is. In my view, doing anything other than following the Equality Act procedure is a huge signal to the discriminators that you have no idea what you’re doing. You can go to the Property Ombudsman – for what it’s worth. The Property Ombudsman offers: “A free, fair and independent service for dealing with unresolved disputes between sales and letting agents and consumenrs who are actual or potential buyers or sellers or landlords or tenants of residential property in the UK”. Yet, as you’ll see from this link: “The BBC London has learned that, although 36 people told the Property Ombudsman they were the victim of racial discrimination in the past three years, not one single complaint was upheld. Only two allegations resulted in a full investigation”. So if well meaning chats and Property Ombudsman complaints don’t inspire you with confidence, what next? The Equality Act does provide for a County Court remedy – and the County Court has the power to grant injunctions and award compensation for “injured feelings”. Time limits for bringing Court proceedings do apply. Perhaps, rather than showing your belly to a discriminating landlord or agent, this questionnaire may elicit the desired effect – and you may find a willingness to resolve the matter without recourse to court proceedings. NB Cllr Jacobson (in the Duchess of Hackney post) says that landlords can discriminate against [non-kosher] people in the same way that they can refuse DSS or people with pets. This, of course, is wrong as DSS and people with pets are not protected characteristics – whereas belief and lack of belief is a protected characteristic. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
