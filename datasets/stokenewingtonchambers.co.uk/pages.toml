["https://stokenewingtonchambers.co.uk/do-i-need-a-solicitor-for-a-magistrates-court-trial"]
title = "Do I need a solicitor for a Magistrates Court trial? - Stoke Newington Chambers"
description = "Do you really need a solicitor for your magistrates court case? Are you better off representing yourself, or should you get a direct access barrister?"
full_description = "Do I need a solicitor for a Magistrates Court trial? Nov 25, 2019 | Advocacy, Court Martial, Criminal law, Direct Access Barristers, DIY Law, Football Banning Orders, Football law, Houses in multiple occupation, Military law, Motoring Law, Police, Private client criminal defence, Road Traffic law Why, if you hire a solicitor, you probably won’t see your barrister until your trial date. With direct access, life doesn’t have to be like this – for either of us. Is hiring a solicitor for my magistrates court case the best decision, or is there a better way? Most people would love to have an experienced criminal barrister with them for their magistrates court case. The problem is that we hear stories of burned out barristers – and solicitors who don’t seem to do much for the fees they charge. What if your magistrates court trial is listed for tomorrow morning? How would you feel if you found out that your solicitor is ringing around barristers’ chambers at 6 pm this evening, looking for someone to cover your case? Maybe your last minute barrister will be able to pull the rabbit out of the hat and get you a good deal on the day – but do you really want your case and your life to be dealt with like that? The cost to both of us by your hiring a solicitor who hires me the night before your trial In return for your doing things the old fashioned, “solicitor first” way, you could get months of anxiety wondering if you are going to be able to overcome the case against you. You might be wondering if the magistrates will be able to see what you can see – and you may be wishing that you could just speak to your barrister now. Then there’s the impact these accusations may be having on your family or your position at work. A criminal defence barrister friend of mine recently quit his job. He’s a highly experienced criminal trial lawyer from the States – yet he doesn’t do criminal trials in England anymore. This is what he told me: And yeah, I didn’t apply to chambers at the end of my pupillage because I didn’t want to join the solicitor/barrister/no investigation/meet the client on the day of trial/keep your eye on the page count hamster wheel. It was a very dispiriting experience. Does the legal hamster wheel have to be your story – or mine? The thing to consider is this: Is the legal hamster wheel, where a solicitor instructs a barrister at the last minute, going to allow you to put your heart and soul into your case and transform you from a stressed out defendant with everything to lose – to someone who overcomes the accusations against them and gets their life back? Should you be at a magistrates court without a lawyer? Unless you know how to hold the CPS to account about Disclosure and you know how to analyse the evidence against you – and to cross-examine police officers and other witnesses – probably not. The problem is, you’ll never know if you are ready until the verdict is read out in court. By then, you may have lost your licence or good character – or worse. Why direct access works As only a few of us are authorised to work as direct access criminal barristers, you’ll need to contact me, probably weeks in advance, to make sure I’m available. This gives both of us the chance to give your case the time and attention it deserves. When you buy my barrister services direct, I win. Clearly. While I may charge a lower fee than a solicitor, the fee you pay isn’t shared by anyone – and it’s paid upfront. Plus, I get the gift of time to work with you – making sure that no stone is left unturned. But here’s the reality: you win, too. Because I am not on the hamster wheel, I can guide you throughout your journey, giving you clarity about your position and helping you become who you are supposed to be – the person who looks their problem straight in the eye, finds the most effective way forward, and gets the best possible result, as soon as possible. My simple tip Look for the “win-win”. Consider whether the “comfort” of having both a solicitor and barrister truly is the most effective use of your time and resources. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
