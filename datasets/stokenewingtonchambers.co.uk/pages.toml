title = "Forced Marriage - Stoke Newington Chambers"
description = "One of the saddest things to see is a school-kid feel powerless to change what is happening to her. People who live here in Hackney or in our neighbouring borough, Tower Hamlets, don’t know the half of what’s going on. I’d rather believe that than to think my neighbours are cultural relativists who think abuse […]"
full_description = "Forced Marriage Jan 14, 2012 | DIY Law, Non-legal help, Women & the Law One of the saddest things to see is a school-kid feel powerless to change what is happening to her. People who live here in Hackney or in our neighbouring borough, Tower Hamlets, don’t know the half of what’s going on. I’d rather believe that than to think my neighbours are cultural relativists who think abuse is ok – for other people. The Forced Marriage Act 2007 gives the Civil courts the power to grant an injunction (a Forced Marriage Protection Order) to stop a person being taken abroad and married against their will – and somebody can make this application to the court on your behalf. The first step is to let somebody know what’s happening to you – this includes your teacher, doctor and/or the police. Forced marriage may not be a crime per se, but kidnapping and abduction, false imprisonment, harassment, rape and assault are. If you are being or have been bullied into marrying someone, please get help as soon as you can. A GP is often a good first port of call. An interview with a health professional may be the only opportunity some girls/women have to tell anyone what is happening to them. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftype