description = "First time Litigants in Person tend to underestimate the time and emotional energy involved in court proceedings. That’s why they say in one breath, “Hopefully, they’ll just pay. I don’t have time for this BS” and in another, “We’re going to court”. Consider that this may not be your opponent’s first time – particularly if you […]"
full_description = "This isn’t my first time Sep 19, 2014 | Advocacy, Direct Access Barristers, DIY Law, Landlord & Tenant, Women & the Law First time Litigants in Person tend to underestimate the time and emotional energy involved in court proceedings. That’s why they say in one breath, “Hopefully, they’ll just pay. I don’t have time for this BS” and in another, “We’re going to court”. Consider that this may not be your opponent’s first time – particularly if you are dealing with their insurers or a Government body. It is likely they have a panel of lawyers on call to deal with claims – just like yours. Many of the self-represented litigants I’ve talked to have no idea of the importance of the pre-action steps they’ve taken (or failed to take) and the letters they’ve written. They didn’t realise that a professionally drafted letter before action might have killed the game off in the first half, saving themselves the expense of their day in court – and its associated costs. The other side’s lawyer is just that. They are being paid to kill the game off in the first half and make you go away. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery)