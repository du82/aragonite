title = "How to get your Magistrates Court trial adjourned - Stoke Newington Chambers"
description = "How to make an adjournment application in the magistrates court. Follow the Practice Direction and read these tips."
full_description = "How to get your Magistrates Court trial adjourned Jul 22, 2019 | Criminal law, Direct Access Barristers, DIY Law, Motoring Law, Road Traffic law Do you really want an adjournment? Will the magistrates give me an adjournment? Think getting your case adjourned to another date is going to be easy? Clearly, you’ve never been to the Magistrates Court before, and you’re not familiar with the terms, “speedy summary justice” or “cracked trial”. Adjournments can be rarer than hen’s teeth. That’s because there’s a big expectation that trials will start on the day – and on time. The pressure’s on the magistrates for your trial to start and finish on time What you don’t know is that there’s also pressure on the magistrates to make sure cases get off the ground on schedule. Targets need to be met – and “cracked” aka ineffective trials are scrutinised by court managers. Sometimes, trials “crack” due to defendants changing their pleas from Not Guilty to Guilty. But many times, trials crack because someone’s applied for an adjournment – and the magistrates gave it to them. Because the pressure is on the magistrates to get through the day without any of the cases cracking, you may have an uphill struggle getting your trial adjourned to another day. Most people want an adjournment because they are not prepared What if you are at court and your name has just been called for your No Insurance trial to start – and you realise that the wonderful letter you have from you insurance company saying that you really were insured is at home, sitting on your kitchen counter? Can someone email this to you? Can your run home and get it? Can someone else get it and bring it to you? Never assume that the magistrates are going to be relaxed about you coming back another day for your trial. While you could be lucky, with the court so hideously over-listed that they are happy for you to come back on another day for your trial – chances are, the magistrates will expect you to find someone to get your evidence to you asap and to get on with it. (“Too bad, Guilty, next!”) Here’s how to make the adjournment application If you know that you are not going to make the trial date due to a situation out of your control, you should seriously consider making an application to vacate the trial before your trial date. (“Vacate the trial” means postpone it until another day). My first point of reference for the criteria the courts will use in assessing the merits of an application to vacate a trial date are the Criminal Practice Directions (Part 24C). Find the legal test for your circumstances and start explaining, in writing, to the court and to the prosecution, why you need to come to court on a different date. What’s the best way to avoid all this drama? Don’t bury your head in the sand! As soon as you find out your trial date, get busy preparing your defence. It can take longer to gather your evidence than you may realise. If you have been accused of driving without insurance, and the issue is that you had insurance, then it’s down to you to get proof that you were insured together so you can use it as evidence in your trial. That may mean writing a letter to your insurance company – and waiting for them to respond. This takes time. Give yourself the best chance of being ready for your trial by giving yourself the gift of time. What if the unavoidable has happened and you truly cannot go to court on the date of your trial? Look at Criminal Practice Direction, 24C and contact the court accordingly and asap. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
