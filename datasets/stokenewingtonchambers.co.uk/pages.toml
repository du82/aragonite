full_description = "Thanks for telling us you have Cancer: You’re Sacked Sep 12, 2014 | Despicable You, DIY Law, Employment law, Women & the Law I’m thinking it might be time to run a, “Despicable You” series. The letter is from an employer in America who appears to have made his employee of 12 years redundant on his learning of her cancer diagnosis. Imagine: Your whole world’s just been turned upside down. You’re frightened about what the future holds and think, “but at least I have my job”. Dear Carol You are currently engaged in a battle against cancer that will be demanding physically, mentally and emotionally… The side effects of chemotherapy will be significant and distracting… Because of this, I am laying you off without pay… If you are in England & Wales, and find yourself in a similar situation, I recommend Macmillan Cancer’s, “Your Rights at Work When You’re Affected by Cancer”. As you will see, Cancer is considered a disability and you and your carer have rights under the law. Macmillan also have benefits advisers as well as resources for employers and people who are self-employed. Daily Mail article here CBS Pittsburgh article here Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='