description = "If you want to write a great essay, you must have an introduction.  It sounds simple enough, but students struggle with the concept of stating their conclusion in their introduction. When my lecturer suggested I write a “formal” introduction and conclusion, I thought he was nuts. It seemed like an utter waste of time and […]"
full_description = "Let’s Talk About Essay Writing Mar 7, 2010 | Get qualified If you want to write a great essay, you must have an introduction. It sounds simple enough, but students struggle with the concept of stating their conclusion in their introduction. When my lecturer suggested I write a “formal” introduction and conclusion, I thought he was nuts. It seemed like an utter waste of time and precious word-count. Despite my better judgment, I tried it. My arguments became stronger and my marks improved. As it’s sometimes easier to show rather than tell how it’s done, I give you the UC Davis Law Journal article, “Digitus Impudicus: The Middle Finger and the Law“. Professor Robbins has a structured and comprehensive approach which is worth emulating – you’ll see that he sets up his argument, and then spends the rest of his essay supporting that argument. The article might not be as interesting to read if Prof Robbins had merely started with the history of bird flipping, gone around the houses and then concluded with an, “oh, and by the way, it is/should be illegal to arrest someone for flipping the bird, The End”. Unfortunately, this is what most students do – and it just doesn’t leave the reader convinced the essayist knows what he’s doing or talking about. Nobody is a natural born essay-writer. Good essay-writers learn from reading great essays – and set out their conclusions from the start. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HE