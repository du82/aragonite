title = "The biggest mistake people make on their Single Justice Procedure form - Stoke Newington Chambers"
description = "What's the worst thing you can do when you get a Single Justice Procedure form in the post? Stop telling the magistrates about your personal needs."
full_description = "The biggest mistake people make on their Single Justice Procedure form Sep 29, 2019 | Advocacy, Criminal law, Direct Access Barristers, DIY Law, Motoring Law, Police, Private client criminal defence, Road Traffic law A Single Justice Procedure notice in the post can ruin your whole day – and an ill-advised response can spoil your licence for years. What is the worst thing you can do when you get a Single Justice Procedure Notice in the post? Do not bring up your personal needs when telling the magistrates why you are not guilty. Here’s the one thing many self-represented defendants write in their forms / say in court that’s guaranteed to make the magistrates roll their eyes and stop listening: “I am not guilty because getting points on my licence would have a big affect on me because my insurance premium will go sky high and I am saving money to fulfil my lifetime ambition of becoming an entrepreneur …” Here’s what the magistrate is thinking when s/he’s reading or listening to this: What does this guy’s lifetime ambitions have to do with whether he was speeding or driving without due care and attention?” By framing your not guilty argument in terms of your personal needs, you’re adopting the weakest position possible. Not only are you positioning yourself as a guilty person who’s saying that they’re not guilty, you’re positioning yourself as a undeserving charity case. You might as well be saying: “Please let me off the hook for no reason because I don’t want to pay higher insurance premiums”. What anybody reading or listening to this is hearing that you don’t understand how the court works. The magistrates aren’t there to be charitable. What they want is help from you in applying the correct law to the facts of your case. One example of how you can avoid irritating the magistrates might be, “I did not contravene the 20 mph speed limit on Green Lanes because on the date that the camera flashed me going 26 mph, the speed limit was still 30 mph”. By explaining things like this, you are making it easy for the magistrates to see what the issue is – and, if true, you are positioning yourself as a not guilty person. If, however, you are guilty, say so. If you are guilty, the next step is to tell the magistrates about your mitigation. My simple tip Persuading the magistrates not to disqualify you is a different issue to whether you are guilty of the offence. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
