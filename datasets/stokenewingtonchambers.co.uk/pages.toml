title = "Day 4: Six ways to stay out of the magistrates court (Speed awareness course & why you should consider taking it before it’s too late) - Stoke Newington Chambers"
description = "If police have offered you a speed awareness course, the offer will not be open indefinately. Facing a ban? Get a direct access barrister."
full_description = "Day 4: Six ways to stay out of the magistrates court (Speed awareness course & why you should consider taking it before it’s too late) Apr 10, 2020 | Criminal law, Direct Access Barristers, DIY Law, Motoring Law, Police, Private client criminal defence, Road Traffic law Welcome to Day 4 of this six-day series on the simple things people can do to stay out of the magistrates court. In this series, I’ll show you everyday mistakes people are making which are costing them money, points on their licence, and/or unnecessary criminal convictions. Today, I’m talking about why you should consider taking a speed awareness course if and when the police offer it. Many drivers make the big mistake of deciding that really would like a speed awareness course on the day of their magistrates court trial. The problem is that most speed awareness course offers lapse long before your trial date. Your two remaining options are to plead guilty – or to plead not guilty and have a trial. If you plead guilty or are found to be guilty after trial – you have exposed yourself to the real risk of points, a fine, prosecution costs and a Government mandated victim surcharge. This is likely to be after you have waited some time, as the higher priority Criminal trials will take precedence over Traffic cases. If, on the other hand, you accept the police offer of a speed awareness course, you can avoid points and get on with your life much faster – without have to step foot into a court. While speed awareness courses have been suspended for the next few months because of the coronavirus restrictions on groups of people physically present in classrooms, this will change in due course with an online alternative or when the lockdown is lifted. Facing a ban? If you’re facing a ban and either don’t want a speed awareness course or one is not offered, it is worth getting legal advice and representation to give yourself the best chance of keeping your licence. My simple tip Don’t expose yourself to the risk of penalty points on your licence if you do not have to by letting what could be a good deal slip through your fingers. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
