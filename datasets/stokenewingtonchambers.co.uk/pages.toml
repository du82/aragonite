. J. Cockett Kristin Heimark What’s the real cost? I understand that there is a lot at stake – your licence, your reputation – your job. Choosing to represent yourself, or choosing the wrong lawyer, could cost you more than you think. You deserve to have a barrister on your side when facing a criminal or motoring charge. I’m a direct access qualified criminal and motoring law barrister – and I can give your case the expertise and attention it deserves to help you get your life back. Schedule a call Get clarity and certainty in three easy steps Schedule a call Provide a few basic details, then we’ll have a brief call. There’s no obligation to proceed. Receive a plan If you are comfortable to proceed, I will prepare your strategy & review it with you. Get the best result Attend court with complete peace of mind. I’ll be by your side to help you get your life back. Schedule a call “Kristin put together a watertight case which demonstrated on multiple fronts that there was no case to answer. Throughout the process she was fearless, incisive and a truly inspiring guiding light.” Cllr B Locker, Colchester Borough Council Sometimes bad things can happen to good people – don’t let it define the rest of your life. I understand the worry and stress that accusations can cause. Criminal and motoring charges often happen when you least expect them. Sometimes things just go wrong. After all, you don’t plan to have a car accident. What if you get accused of something at work, or if an argument gets out of hand? Perhaps you used violence to defend yourself and are accused of going over the top. I know that these things can just happen. Let me give you the defence you deserve. Kristin Heimark"
