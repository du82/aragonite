["https://stokenewingtonchambers.co.uk/ticket-touts-whos-the-patsy"]
title = "Ticket touts: Who's the Patsy? - Stoke Newington Chambers"
description = "These leaflets were given out after the Leicester match; AISA advises not to buy or sell from them, it’s illegal ! pic.twitter.com/K7YDY67wGx — AISA (@AISA_Arsenal) February 17, 2016 AISA are right to warn Arsenal fans about the dangers of dealing with ticket touts. But AISA’s tweet isn’t the full story. Section 166 of the Criminal […]"
full_description = "Ticket touts: Who’s the Patsy? Feb 17, 2016 | Advocacy, Criminal law, Direct Access Barristers, Football Banning Orders, Football law, Private client criminal defence These leaflets were given out after the Leicester match; AISA advises not to buy or sell from them, it’s illegal ! pic.twitter.com/K7YDY67wGx — AISA (@AISA_Arsenal) February 17, 2016 AISA are right to warn Arsenal fans about the dangers of dealing with ticket touts. But AISA’s tweet isn’t the full story. Section 166 of the Criminal Justice and Public Order Act, 1994 makes it an offence for an unauthorised person to sell or otherwise dispose of to another person a ticket to a designated match. That means it’s not illegal to be given a ticket or to buy a ticket – but it is illegal to sell one. This may however be a good moment to remember the wise words of the Oracle of Omaha, Warren Buffett: “If you’ve been in the game 30 minutes and you don’t know who the patsy is, you’re the patsy”. Guys, when you see a Brussels offering to buy your ticket to the Barcelona match, you’re the patsy. Even if you buy a ticket from a tout, you’re still the patsy. Why? Because there’s no guarantee the ticket is even genuine. As you will see from Arsenal’s own site, there are people out there taking the Michael. I’ve seen with my own eyes people being turfed out of “their” seats when the true ticket-holder comes with their Arsenal dog and giant Pepsi to sit down five minutes after the match has started. Wonderful as it would be to see Arsenal v Barcelona at the Emirates, I encourage all fans to consider the risks of buying and selling tickets. Ticket Exchange exists for a reason. As s166 is on the Schedule of Relevant Offences, a person convicted of touting could potentially also be looking down the barrel of a police application for a Football Banning Order. I encourage any fan caught up in a touting or football banning order fiasco to get specialist football law advice from a qualified solicitor or barrister asap. Magistrates Court is not a game – but it is always better to try to kill a case off in the first half. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
