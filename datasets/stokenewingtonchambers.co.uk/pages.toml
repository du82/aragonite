title = "Why illegally driving in the UK on an American license can invalidate your insurance - Stoke Newington Chambers"
description = "Welcome to this three-part series of Motoring law tips for American drivers in the UK. In this series, I’ll show you some of the everyday mistakes American drivers in the UK are making which are costing them money, points on their licence, and/or unnecessary criminal convictions. In my last post, I talked about the situation […]"
full_description = "Why illegally driving in the UK on an American license can invalidate your insurance Apr 20, 2020 | Criminal law, Direct Access Barristers, DIY Law, Motoring Law, Police, Road Traffic law Not having a valid licence may also mean you aren’t insured – even if you have paid the policy premium.Welcome to this three-part series of Motoring law tips for American drivers in the UK. In this series, I’ll show you some of the everyday mistakes American drivers in the UK are making which are costing them money, points on their licence, and/or unnecessary criminal convictions. In my last post, I talked about the situation where your American licence may no longer be valid for driving in the UK. If your American licence no longer entitles you to drive in the UK, then you run the real risk of not being insured, even if you have a current premium paid policy. How can it be “no insurance” where there is a policy with your name on it? All insurance contracts are governed by the principle of, “uberrimae fidei” – which means, “utmost good faith”. If your insurance company concludes that you are not entitled to drive on your US driving licence, they may consider that your policy is void from the date you were no longer entitled to drive on it. Your insurance company saying that your bought and paid for policy is void because you did not act with utmost good faith by continuing to drive in the UK when you should not have been, means that you could be found to have been driving with no insurance. The penalty for driving with no insurance is 6-8 points, plus a fine, plus prosecution costs, plus a government mandated victim surcharge. The other problem is that the police have the power under s165A of the Road Traffic Act, 1988 to seize vehicles driven without a licence or insurance. My simple tip If you are working in the UK and think you may be here over one year, consider taking an intensive driving course and getting a British Driving Licence sorted – before you get stopped by the police or flashed by a speed camera. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
