description = "It’s been a year since that SAHCA conference. Believe me. If you were there, you won’t have forgotten it. On the one hand, we had Government repeating its quality mantra, saying that the public must be protected from rogue (solicitor) advocates – and on the other, Professor Philip Plowden and a chorus of solicitor-advocates banged […]"
full_description = "QASA and Quality Advocacy (QAA Part Deux) Dec 27, 2011 | Advocacy, Get qualified It’s been a year since that SAHCA conference. Believe me. If you were there, you won’t have forgotten it. On the one hand, we had Government repeating its quality mantra, saying that the public must be protected from rogue (solicitor) advocates – and on the other, Professor Philip Plowden and a chorus of solicitor-advocates banged on about needing evidence. Evidence that wildly incompetent advocates are failing their clients and that a further layer of post-qualification regulation is needed for it to stop. We’re all still waiting for that evidence. In the meantime, many solicitors have drawn the conclusion that the purpose of the re-qualification exercise is to enable the Bar to claw back some of the work they’ve lost to solicitor-advocates. It’s not exactly a secret that the Bar’s never been thrilled with solicitor-advocates taking “their work” – or the impact solicitor-advocacy has on availability of work for the junior Bar. To cap it off, the Criminal Bar Association revealed its QASA colours in their letter to members, published recently in the Law Society Gazette. They say: ‘We make no apology for saying that we also want to win back the position we have traditionally held of doing the most serious cases in the Crown court, and a QASA scheme will help to achieve that.’ Boom. While the turf war over court advocacy rages, I thought I’d revisit what Government’s asking all of us to do. Whereas in the past, once pupillage or higher rights training qualification was achieved, it was yours to exercise subject to established rules to act in the best interests of the client and not take or conduct work beyond one’s own competence. Now, Government wants to add an extra layer of regulation and require all advocates to re-qualify every five years – with said re-qualification to be assessed by a judge. Not a judge in a class-room. A judge who scores your real-life Hearing/Trial performance. I’ve got a few problems with that. a) What happens if Judge Craig Revell Horwood gives me a low mark – where Judge Bruno Tonioli would have said I was magnificent? b) Isn’t the judiciary full of, erm, Barristers? c) Since when is it an advocate’s job to please a judge anyway? QASA’s been put on ice whilst the powers that be attempt to avoid “unintended consequences” of favouring one branch of the profession over another. How exactly does one make a quality scheme fair when the lack of quality it’s meant to address has never been identified? NB Moses LJ elegantly skewered QASA during his 13 February speech at Middle Temple. Enjoy. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
