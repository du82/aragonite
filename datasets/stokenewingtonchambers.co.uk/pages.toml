["https://stokenewingtonchambers.co.uk/how-can-i-find-out-if-my-magistrates-court-trial-is-adjourned-due-to-the-coronavirus"]
title = "How can I find out if my magistrates court trial is adjourned due to the coronavirus? - Stoke Newington Chambers"
description = "Is your coronavirus magistrates court trial adjourned - or it will go ahead?"
full_description = "How can I find out if my magistrates court trial is adjourned due to the coronavirus? Mar 26, 2020 | Criminal law, Direct Access Barristers, DIY Law, Motoring Law, Police, Road Traffic law How will you know if your magistrates court trial is going ahead? You’ve read all the Government advice on social distancing, so you would assume that there should be no problem with getting your Magistrates Court trial adjourned. Magistrates Courts “Business as usual”? Robert Buckland, QC MP, Lord Chancellor said on 18 March 2020 “Our Crown and Magistrates courts provide a vital public service and until instructed otherwise, we expect all lawyers, magistrates, jurors, witnesses, defendants and court staff to continue to attend court as required, so the interests of justice can be served”. Given that these magistrates courts are crowded and aren’t set up for social distancing, you’d think that Robert Buckland might reconsider his expectations of other people in the middle of a world-wide pandemic. I would have thought that a man who cancelled his own constituency surgery to avoid Covid-19, would have a little more understanding of defendants, witnesses and lawyers who also want to avoid catching the coronavirus. The only people who seem to be engaging in any joined up thinking are the barristers, solicitors and front line court staff who are demanding basic health and safety for themselves – as well as the witnesses and defendants. Because there is no show without the lawyers or front line court staff, the Government finally conceded that, at this moment, Magistrates courts are only covering urgent work (overnight custody and people brought from prison). This means that, just for today, many trials are being postponed until later in the year. You must check for yourself whether or not YOUR trial has been adjourned – or if it is going ahead as planned. Magistrates’ Courts will only hear urgent cases today (overnight custody & prisoner production). Parties involved in all other hearings should not attend court unless contacted directly. You’ll be notified of new hearing date. This situation may change quickly. #coronavirus — HMCTS (@HMCTSgovuk) March 24, 2020 I say, “just for today” because the situation is subject to change on a daily basis. To find out the latest state of play, please click the link below and see, HMCTS daily operational summary on courts and tribunals during coronavirus (COVID-19) outbreak The other thing I am doing is giving you the link where you can find the court’s email address so you can to let the court know if you are sick or self-isolating – or just to get clarity on your trial date. You can find the email address for your trial court at https://courttribunalfinder.service.gov.uk/courts Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
