full_description = "QLTT to QLTS: Putting the Kibosh on Kiwi Lawyers? Mar 22, 2010 | Get qualified As of September 2010, it’s going to get a wee bit harder for overseas qualified lawyers to become English solicitors. The days of foreign lawyers from common-law jurisdictions passing an open-book solicitor’s accounts exam and having their supervising solicitors sign-off on their English work experience are drawing to a close. The SRA itself, rather than your amenable boss, will ascertain whether you have the requisite competency to practice in England & Wales. And as for non-practising English barristers? Read on. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
