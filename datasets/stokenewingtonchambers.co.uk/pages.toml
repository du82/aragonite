title = "DPP v Barreto: the mobile phone loophole you've been looking for? - Stoke Newington Chambers"
description = "Does DPP v Barreto mean that I can take a selfie while I'm stuck in traffic and not get in trouble with the police? It depends ..."
full_description = "DPP v Barreto: the mobile phone loophole you’ve been looking for? Aug 1, 2019 | Criminal law, Miscellany, Motoring Law, Police, Private client criminal defence, Road Traffic law In the frame for driving whilst using a mobile phone? DPP v Barreto: the mobile phone loophole you’ve been looking for? Up until now, most people caught by police with a mobile phone in their hands like this gentleman would find themselves in the frame for Driving a Motor Vehicle While Using a Hand-held Mobile Telephone, contrary to Section 41D of the Road Traffic Act 1988 and Regulation 110 of the Road Vehicles (Construction and Use) Regulations 1986. Then, Mr Barreto’s case came along. In a nutshell, Mr Barreto was caught videoing an accident scene on his mobile phone as he drove past it. The issue for the High Court was whether Mr Barreto’s videoing was a breach of the regulations. Luckily for Mr Barreto, the High Court decided that the regulations do not prohibit all use of a mobile phone held while driving. Will DPP v Barreto work for me? Possibly. The problem is that the High Court judged this case on it’s specific facts – and the one charge. That means that there’s no list of all the things it’s ok to do with your hand-held mobile phone while driving a car. The other problem is that prosecutors have been waiting for this case to be decided – and in the meantime, they’ve been thinking about other charges they can use to prosecute drivers using their hand-held phones while driving. One obvious possibility is the offence of Driving Without Due Care and Attention. Remember that Without Due Care and Attention and Driving a Motor Vehicle While Using a Hand-held Mobile Telephone are two different offences. Just because you may be guilty of one thing doesn’t mean that you’d also be guilty of the other. As always, apply the correct law (the legislation plus all relevant case law) to the facts of your case. Only then can you really know if the Crown Prosecution Service have charged you with the right offence – and what your prospects of success are should you end up at the Magistrates Court. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
