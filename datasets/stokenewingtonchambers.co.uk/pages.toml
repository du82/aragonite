title = "Katie Hopkins and the Twitter Pitchforks - Stoke Newington Chambers"
description = "Why a little knowledge of the law is, erm, unhelpful and how Alex Andreou’s legal analysis of s18 of the Public Order Act 1986 is flawed: Can @metpoliceuk explain why this by @KTHopkins is not “racial hatred” caught by POA1986, PtIII? @TheSunNewspaper pic.twitter.com/IxJZtpQCUO — Alex Andreou (@sturdyAlex) April 17, 2015 @sturdyAlex I’ve written on this […]"
full_description = "Katie Hopkins and the Twitter Pitchforks Apr 18, 2015 | Criminal law, Despicable You, Miscellany, Social Media Why a little knowledge of the law is, erm, unhelpful and how Alex Andreou’s legal analysis of s18 of the Public Order Act 1986 is flawed: Can @metpoliceuk explain why this by @KTHopkins is not “racial hatred” caught by POA1986, PtIII? @TheSunNewspaper pic.twitter.com/IxJZtpQCUO — Alex Andreou (@sturdyAlex) April 17, 2015 @sturdyAlex I’ve written on this area of law and know it quite well. I really think there’s a case here. It’s astonishing this was published — Gavin Phillipson (@Prof_Phillipson) April 17, 2015 Just a minute … @sturdyAlex “migrant” is not a race. — KristinHeimark (@stokenewington) April 17, 2015 Any hatred stirred must be “racial” for liability under s18 of the Public Order Act. “Racial” is defined by s17 as, “group of persons defined by reference to colour, nationality (including citizenship) or ethnic and national origins”. “Migrant” is not a race – as the term “migrant” is not limited to, or code for, people of a particular race, colour, ethnicity or nationality. It’s therefore difficult to see that the actus reus of a s18 offence has been made out. Of course, even if there were the actus reus here, the Prosecution would have to go on to also prove Ms Hopkins’ mens rea. Ms Hopkins doesn’t have to prove anything. The mens rea test for s18 is: “A person who is not shown to have intended to stir up racial hatred is not guilty of an offence under this section if he did not intend his words or behaviour, or written material, to be, and was not aware that it might be threatening, abusive or insulting”. Where is her intent to stir up racial hatred when she repeatedly uses the word, “migrant”? Please also remember that no proceedings will be instituted except by or with the consent of the Attorney General, s27(3). Yes, Ms Hopkins may say some loathsome things – but on this occasion, has her article fallen foul of s18 POA? No. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
