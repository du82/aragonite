full_description = "HMOs, Leaseholders & Estate Agents at Magistrates Courts Jul 21, 2018 | Advocacy, Criminal law, Direct Access Barristers, Houses in multiple occupation, Landlord & Tenant, Tenants' Rights I’ve been busy advising landlords on HMO liability over the past month. Some were looking for “quick” advice. While I am known for turning round work fast – “quick” is another matter. “Quick” implies, “off the top of your head, what’s the answer?” Whether a person has HMO liability will depend on the facts of their case. When it comes to applying the Housing Act 2004 to the specific facts of a case, I’ll need to see all of the documentation and take full instructions before giving advice. While I can work to tight deadlines, I don’t put my clients at risk by giving them “quick” or “off the cuff” advice. Because when it comes to defending my Housing or any of clients at the Magistrates Court, meticulous preparation is key to obtaining the best possible outcome. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
