full_description = "Contract disputes and saving driving licences Apr 10, 2018 | Advocacy, Direct Access Barristers, Miscellany, Private client criminal defence, Road Traffic law I’ve been resolving contract disputes lately – and during the last few weeks, I’ve been dealing with: Whether a “life-time membership” is enforceable against a purchaser of a private gym; The enforceability of an agreement between non-married parents to send their child to a private school; and I’ve also been assisting a local government councillor who was in a dispute with her political party. And, in a return to my beloved Traffic law roots, I helped a man save his driving licence at the Magistrates Court. He has left a lovely testimonial which you can read here. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
