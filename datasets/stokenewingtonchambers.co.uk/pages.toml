["https://stokenewingtonchambers.co.uk/why-am-i-talking"]
title = "Why am I talking? - Stoke Newington Chambers"
description = 'W.A.I.T as in "Why am I talking?" or "Should you be talking to the police?"'
full_description = "Why am I talking? Mar 18, 2022 | Advocacy, Criminal law, Direct Access Barristers, Motoring Law, Police, Private client criminal defence, Road Traffic law, Social Media People in trouble always ask, “should I talk to the police?”. The answer to my readers is, “it depends” – and that’s why you need to W.A.I.T. W.A.I.T. is something all of us should remember. It’s shorthand for, “Why am I talking?” Am I talking because I think I can talk the police out of arresting me? Is there any amount of talking at the roadside that’s going to talk the police out of arresting you or your loved one? Or maybe it is important to say something. Most people don’t ask themselves W.A.I.T. Most people bury themselves. They talk way to much, giving police a treasure trove of ammunition to use against them. Others don’t say enough. This is why you need to consider W.A.I.T. and think hard about why you are talking. If you still don’t know if you should be talking, get advice. Find a police station accredited solicitor who will help you understand “Why am I talking”. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(