["https://stokenewingtonchambers.co.uk/what-law-examiners-are-looking-for"]
title = "What Law Examiners Are Looking For - Stoke Newington Chambers"
description = "Does the feedback you receive from your lecturer and/or tutor on your problem question assignments and practice questions help you understand where you could improve? My convenor recently called a meeting of all law lecturers at our university. To gauge whether we were consistent in the way in which we approached assignment marking, we were […]"
full_description = "What Law Examiners Are Looking For Dec 1, 2009 | Get qualified Does the feedback you receive from your lecturer and/or tutor on your problem question assignments and practice questions help you understand where you could improve? My convenor recently called a meeting of all law lecturers at our university. To gauge whether we were consistent in the way in which we approached assignment marking, we were given a problem question from a previous LLB exam and two student answers – and asked to grade the answers with reasons in support. A big complaint students have is that some lecturers are more generous markers than others. I was therefore surprised that we all gave the same mark – a pass (a “D” grade) on one answer and a high 2.1 (B+) on the other. I was also surprised to find my colleagues’ reasons for those marks a little unclear – and I think I’ve discovered the reason why. Back in the day, when I went to law school and we wrote our answers with quill pens by candle light, our lecturers had complete discretion with the feedback they gave. Mostly, that feedback was limited to “well done” or “not quite right”. These days, Universities are monitored by the QAA and must show their degrees meet certain Law “Benchmarks”. In turn, Universities formulate “Assessment Criteria” – the standards they want you to achieve. These include: * Knowledge and understanding * Cognitive skills (analysis, judgment and evaluation) * Practical and Professional skills (research and problem-solving) * Key skills (communication, literacy, numeracy and IT skills) One of the problems with marking to “assessment criteria” is feedback can get garbled in management-speak. When my colleagues explained their reasons for the pass, they noted that the answer did not show sufficient, “knowledge and understanding” and “evaluation”. If I were the student, I’m not sure I’d know what that feedback meant or what I was suppose to do to improve. I’m not suggesting lecturers go back to the old days, but I think it’s much clearer to say, “you correctly identified the issue here but jumped straight to your conclusion without setting out the law and applying that law to the facts – and that’s why I could not give you marks for your knowledge or analysis”. I also found that my colleagues were impressed as I was with the superb structure of the 2.1 answer. It goes to show that a very organised and methodical answer displays cognitive, practical and professional skills and will get you a good mark, even when your depth of knowledge may be of a good, but not superb standard. IRAC definitely gets results. The irony is, law schools expect you to know the drill without showing you how it’s done. The moral of the story? Lecturers’ feedback may sound like nothing more than behind-covering, double-Dutch management-speak – but what we’re looking for in your answer hasn’t changed. Adopt and keep the discipline of IRAC and you will be rewarded. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
