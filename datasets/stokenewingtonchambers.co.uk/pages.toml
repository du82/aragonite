["https://stokenewingtonchambers.co.uk/speeding-or-perverting-why-a-lawyer-can-save-you-money-and-heartache"]
title = "Speeding or perverting: Why a lawyer can save you money and heartache - Stoke Newington Chambers"
description = "Why risk losing your career and your liberty over a speeding ticket? Smart people hire specialist motoring lawyers to get them out of trouble."
full_description = "Speeding or perverting: Why a lawyer can save you money and heartache Nov 7, 2019 | Criminal law, Direct Access Barristers, Motoring Law, Police, Private client criminal defence, Road Traffic law Tempted to pull strings or get someone else to take the blame? Isn’t it easier to pay a lawyer?If only the officer would have contacted a motoring lawyer, she would have kept her job and avoided prison. (Former) detective Clare Brown was in the passenger seat when her partner was stopped by a PCSO for speeding. Instead of challenging the PSCO’s speeding allegation in court, DC Brown thought she’d take matters into her own hands. She asked the PCSO if her job “would help”. She then asked another officer to, “lose that bloody report”. Imagine being in that DC’s shoes – risking her neck, trying to pull strings – only to get reported, sent to prison, and the dismissed from her job. Now imagine what could have happened had the DC instructed a direct access motoring barrister. For a fixed fee, the PCSO’s version and speeding findings could have been challenged in court – and/or representations could have been made to the CPS to drop the case, due to a lack of any credible evidence, before the court date. In the event that the DC’s partner was found guilty after a speeding trial, a direct access barrister possibly could have mitigated the sentence so the partner could keep their licence. My simple tip Do not call in favours to make a speeding ticket “go away”. If the potential points mean that much to you, hire a specialist lawyer to see if the police evidence can be challenged – legally. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
