["https://stokenewingtonchambers.co.uk/while-youre-waiting-maybe-youd-like-to-ask-the-cps-to-drop-the-case"]
title = "While you're waiting, maybe you'd like to ask the CPS to drop the case? - Stoke Newington Chambers"
description = "Ask CPS to drop the case & avoid going to the Magistrates Court can work - or you can land yourself into a bigger mess. Make sure you're doing it right."
full_description = "While you’re waiting, maybe you’d like to ask the CPS to drop the case? Jul 1, 2020 | Advocacy, Criminal law, Direct Access Barristers, DIY Law, Police, Private client criminal defence Sick of waiting for your case to be listed? What can you do to move your case along during the corona court backlog? Criminal proceedings hanging over your head can have a big affect on your mental health. The exponential growth of the Magistrates Court backlog of cases means that an unprecedented number of people are trying to cope with having no idea when, if, or where the Magistrates Court hammer will fall. Is there anything you can do to speed up the process? Time goes by so slowly for those who wait While it will not be the right answer for everyone, now might be the time to ask the Crown Prosecution Service whether they really do want to proceed with your case. Here’s one situation where asking the CPS to drop the case was a good idea My Public Sector worker client was facing four Criminal charges, and a certain loss of his job. Where most people are doing nothing and waiting for their court date, my client wanted to write to the Crown Prosecution Service, urging them to drop the case. But he knew he only had one shot – and he wanted to make sure he was doing it right – so he came to me. My client instructed me to write the letter to the CPS for him. As the result of my knowing how the CPS assess whether they have enough evidence to proceed, I persuaded a District Crown Prosecutor to drop three of the four charges. The CPS offered my client a police Caution for the remaining charge, in lieu of a prosecution. By asking me to write to the CPS, my client ensured that his “one time shot” was effective. He also has saved himself time and legal fees – and sealed his superb result sooner, rather than risking it much later. My simple tip Don’t wait for life to happen to you. Getting advice now can save a great deal of time, money and heartache. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
