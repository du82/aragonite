title = "Revenge Porn: My Ex Posted Our Sex Tape on Facebook - Stoke Newington Chambers"
description = "The amount of revenge porn issues I deal with staggers me. The scenario is generally this: While the relationship was going well, the couple may have exchanged private photos and videos. Then, out of spite, a guy tries to bully his ex by sharing and/or posting sex videos or photographs of her – for the […]"
full_description = "Revenge Porn: My Ex Posted Our Sex Tape on Facebook Oct 3, 2014 | Criminal law, Despicable You, DIY Law, Miscellany, Women & the Law The amount of revenge porn issues I deal with staggers me. The scenario is generally this: While the relationship was going well, the couple may have exchanged private photos and videos. Then, out of spite, a guy tries to bully his ex by sharing and/or posting sex videos or photographs of her – for the sole purpose of humiliating the girl who dared to dump him. While there is no specific law against revenge porn (yet), something can be done. What can be done to take it down and get justice will depend on the specific circumstances of a case. Civil remedies such as an injunction requiring a website to take revenge porn down may be a way forward. In AMP v Persons Unknown, a woman who had private photographs of her and her boyfriend on her mobile lost her phone. A man contacted her on Facebook about the photographs – and images of her from her mobile were later uploaded to a Swedish website. The judge in that case granted an injunction prohibiting downloading of those files – stating that her right to privacy had been violated. These principles can be applied to the ex, the website owner as well as to anybody who has the images in their possession or control. Depending on the circumstances, this may also stop website owners effectively extorting cash from victims as a “fee” to take down the images. Thomas Samuel uploaded numerous compromising images of his ex to Facebook and was convicted for sending a “communication” contrary to the Criminal law. When I’m asked for advice, I also consider whether the laws against Blackmail, Harassment and Hacking may also apply. If you’re a victim of revenge porn you may be the victim of a crime. If the police can’t or won’t help, there may be other remedies available. NB This post is from 2014. Please note that the law has changed since the time of writing. Get your free copy of, “Why most self-represented defendants lose their cases in court: 5 things you need to know”. #mc_embed_signup{clear:left; font-size:14px;font-weight:bold; color: #FFF;} #mc_embed_signup .button { font-weight: bold; border-radius: bold; background-color: #FFF; color: #000;} #mc_embed_signup form { padding: 0px;} #mc_embed_signup div#mce-responses { padding: 0px; margin: 0px; font-size: 17px;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address First Name (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
