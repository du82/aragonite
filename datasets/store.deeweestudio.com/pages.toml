003e\n\u003ctd\u003eA3 RHYTHMICAL (Anxiety)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA4 Future\u003c\/td\u003e\n\u003ctd\u003eA4 RHYTHMICAL (Future)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA5 Life And Dreams\u003c\/td\u003e\n\u003ctd\u003eA5 RHYTHMICAL (Life And Dreams)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSide B\u003c\/td\u003e\n\u003ctd\u003eSide B\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eB1 Disco Pregnancy\u003c\/td\u003e\n\u003ctd\u003eB1 RHYTHMICAL (Disco Pregnancy)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eB2 Pairs\u003c\/td\u003e\n\u003ctd\u003eB2 RHYTHMICAL (Pairs)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eB3 Primal\u003c\/td\u003e\n\u003ctd\u003eB3 RHYTHMICAL (Primal)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eB4 Before America\u003c\/td\u003e\n\u003ctd\u003eB4 RHYTHMICAL (Before America)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eB5 Poem Song For Iggor\u003c\/td\u003e\n\u003ctd\u003eB5 RHYTHMICAL (Poem Song For Iggor)\u003c\/td\u003e\n\u003c\/tr\u003e\n\u003c\/tbody\u003e\n\u003c\/table\u003e\n\u003cbr\u003e\u003cbr\u003e"}, onVariantSelected: selectCallback, enableHistoryState: true, linkOptions: true }); $('.single-option-selector:eq(0)').prepend('<option value="">Pick a Format</option>').val('').trigger('change'); }); Laima's conceptual double vinyl debut album 'Home' was released on November 8th 2019 via DEEWEE & The Vinyl Factory, featuring beats from Iggor Cavalera and production from the Dewaele brothers. Sonically, ‘Home’ is also a striking proposition. It’s a package which features two records that are designed to be played simultaneously: Laima’s vocal and synth tracks on the ‘TONAL’ disc alongside Iggor’s beats on the ‘RHYTHMICAL’ record. Syncing two records offers an unconventional way to experience the music. Rather than passively hearing the music, the listener’s need to ritualistically sync both records makes for an immersive experience. Thematically, ‘Home’ explores the tension between the dual drivers of Laima’s life. On the one hand it’s about domesticity – love for family and frustration with domestic routine. Yet on the other, it’s about creativity – her desire to express herself artistically while still tending to her role as a mother and a housewife. Inspired by Alejandro Jodorowsky, Bill Viola and Laurie Anderson, Laima’s recordings expressed her daily routine – like a secret diary that united a couple often separated by continents. “It's almost like a family photo album in another format,” says Laima. “I needed to find the balance in this dichotomy, to feel good with myself in both roles, and be aware of things that really mattered to me. To be a woman, a mum and a female producer: all of these feelings are present in the music. Recorded, produced and mixed at DEEWEE.Art direction by Ill-Studio. Photography by Justinas Vilutis VINYL DISC ONE - TONAL VINYL DISC TWO - RHYTHMICAL Side A Side A A1 Power A1 RHYTHMICAL (Power) A2 Home A2 RHYTHMICAL (Home) A3 Anxiety A3 RHYTHMICAL (Anxiety) A4 Future A4 RHYTHMICAL (Future) A5 Life And Dreams A5 RHYTHMICAL (Life And Dreams) Side B Side B B1 Disco Pregnancy B1 RHYTHMICAL (Disco Pregnancy) B2 Pairs B2 RHYTHMICAL (Pairs) B3 Primal B3 RHYTHMICAL (Primal) B4 Before America B4 RHYTHMICAL (Before America) B5 Poem Song For Iggor B5 RHYTHMICAL (Poem Song For Iggor)'''
