["https://store.deeweestudio.com/products/deewee074-cd"]
title = "DEEWEE"
description = """
This edition:
- CD jewel case with a 8 page booklet

Bolis Pupul announces debut solo album Letter To Yu, out 8th March. 

Touching upon some of life’s big themes – memory, loss, family and coming to terms and making peace with all of that – the album is a resounding audio triumph. It reconciles the competing sonic strands that make up Bolis’ aesthetic – his European and Asian roots, alongside the overarching presence of the twin American pillars of Detroit techno and Chicago house – in a manner that is pleasingly familiar and creatively inventive. Photography by Bieke Depoorter / Magnum Photos

