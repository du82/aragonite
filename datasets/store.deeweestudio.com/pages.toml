title = "DEEWEE"
description = "Justin Strauss and Max Pask have joined up to form a new project called Each Other, with their playful self-titled EP ‘Be Nice To Each Other’. The EP finds Each Other creating an eclectic range of sounds in the space of just three tracks. The opener ‘Same As It Never Was’ is the most immediate of the set, becoming more hypnotic as the minimalist topline buries itself into your subconscious. The downtempo ‘Burn It Down’ then darkens the mood, feeling closer to a dystopian sci-fi soundtrack than an underground club classic, before the playful and progressive ‘Six Weeks’ up the energy with jittering beats, sparkling synths and a cooly understated vocal. Recorded, produced and mixed at DEEWEEArt direction & photography by Ill-Studio Track list: A1 Same As It Never Was A2 Burn It Down B1 Six Weeks"
