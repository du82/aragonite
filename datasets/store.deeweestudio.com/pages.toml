description = """
Grammy-nominated Marie Davidson’s first release for Soulwax’s DEEWEE imprint, ‘Y.A.A.M.’, is produced by longtime collaborator Pierre Guerineau and is a cathartic response to power dynamics within the music industry. The rawness of the original is complemented by a new version by Soulwax, out on April 3rd, who previously reworked Davidson’s acclaimed ‘Work it’ anthem.


Photography taken from Y.A.A.M. Music Video.
Art Direction: Ill-Studio

