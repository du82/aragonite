["https://store.deeweestudio.com/products/deewee055-topical-dancer-cd"]
title = "DEEWEE"
description = """
DELAYED SHIPPING NOTICE: CDs to be shipped from 27th Nov 
This edition:
- CD jewel case with a 16 page booklet
