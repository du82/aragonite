["https://store.deeweestudio.com/products/deewee050-foundations-compilation"]
title = "DEEWEE"
description = """
Foundations, our 50th release and first compilation album released on May 7th 2021.
27 tracks including 3 brand new exclusive works* are beautifully presented across triple LP and 2CD physical editions, along with digital format. All are united by a breadth of imagination, a love of hands-on artistry, and of course by the sonic craftsmanship of the Dewaele brothers themselves.
Foundations is more than just a compilation of tracks from the DEEWEE label. It’s a beautiful object in its own right.  As with all DEEWEE releases, Parisian art directors, Ill-Studio have created a gorgeous artefact that collectors will love. It’s also a wonderful audio experience, with new music complimenting and elevating the catalogue material, and the sequencing of the 27 tracks done with as much love as any artist album or DJ set. It’s an expression of the values of a musical family with the brothers at its heart and featuring their creative input throughout.  Everything on the album has come through the DEEWEE Studios in Ghent, Belgium which was built to bring together their friends from around the world. 
All tracks produced and mixed by David & Stephen Dewaele at DEEWEE, unless indicated otherwise.
Art Direction: Ill-Studio | 3D Images: Area of Work | Graphic Design: Corentin Billot
Comes with a free download card inside the sleeve
Track list: 1. Charlotte Adigéry – Bear With Me (and I'll stand bare before you) *exclusive track2. Laima – Disco Pregnancy (Tonal + Rhythmical) ε3. Each Other – Burn It Down4. Bolis Pupul – Moon Theme ε5. James Righton – Release Party *exclusive track6. Die Verboten – Aquarius ε7. Soulwax – Heaven Scent feat. Chloe Sevigny ε8. EMS Synthi 100 – Movement 6 ε9. Soulwax – Conditions of a Shared Belief10. Soulwax – Close to Paradise11. Asa Moto – Kifesh ε12. Laila – The Other Me (DEEWEEDUB) ε13. Asa Moto – Wanowan Efem ε14. Charlotte Adigéry – Paténipat ε15. Klanken – Drie16. Phillipi – 9000 ε17. Movulango – Leave *exclusive track18. Laima – Home ε19. Emmanuelle – Italove20. Sworn Virgins – Take Your Lady ε21. Phillipi & Rodrigo – Paciencia ε22. Extra Credit – Drive Me ε23. Bolis Pupul – Wéi? ε24. Soulwax – Essential Eleven25. Sworn Virgins – Fifty Dollar Bills ε26. Phillipi & Rodrigo – Retrogrado 27. Future Sound Of Antwerp – Tom Cruise, Scientologist
ε = edited for this compilation
