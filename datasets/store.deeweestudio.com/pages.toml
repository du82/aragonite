description = """
Soulwax turn in a gloriously euphoric remix of ‘Cliché’ marking their first remix for the label, ratcheting up the energy to their trademark tempo in a monstrous, synth-heavy four to the floor rework. The original track (full title: ‘Ceci n’est pas un cliché’), is an accumulation of all the cliché lyrics Charlotte and Bolis have heard over the years and a wink to one off the most copied sentences in art, originally by Belgian surrealist artist René Magritte.
Recorded, produced and mixed at DEEWEEPhotography by Camille VivierArt direction by III-Studio
Track list:A Cliché (Soulwax Remix)B1 Cliché (Soulwax Instrumental Mix) - vinyl exclusive B2 Ceci n'est pas un cliché"""
