description = """
Now shipping from our European store
Following his impressive debut EP ‘Mirror In Man’, which touched on cosmic folk jams and Balearic pop, the Belgium singer-producer Mozes Mosuse aka Movulango has today announced his second project ‘The Irony’, a 5 track EP out 24th November via Soulwax’s DEEWEE label.
‘The Irony’ is further insight into Movulango's divine mind, building deeply personal stories on feeling and emotion that bundle into soaring melodies and lyrics. You can try your best to understand what it all means or you can sit back and let them bewitch your mind and soul.
