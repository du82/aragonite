["https://story.to.design/docs/our-vision"]
title = "Our vision"
description = "Generate and sync full Figma components from Storybook, Backlight or Histoire. Storybook to Figma. Histoire to Figma."
full_description = "Our vision When design and code fall out of sync, designers and developers misunderstand each other. Maintaining both UI kits in Figma and component libraries in code is no small task. And when you start having hundreds of variants for a button, it’s a lot of labor to maintain. A tiny code change in the design system can impact thousands of variants. It pushes the design team to architect UI kit components in complex ways, sometimes hacking Figma to make the maintenance bearable. We believe that design teams should not be wasting time maintaining UI kits to stay in-sync with code. Designers should be researching and designing new, outstanding user experiences. story.to.design does all the maintenance work, freeing-up designers to focus on what matters most. You can learn more about why we believe in the code-to-design approach and created story.to.design on our blog post announcing it. Previous page What is story.to.design? Next page Basic concepts and definitions"
year_published = 2025
