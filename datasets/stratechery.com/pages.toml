["https://stratechery.com/2013/the-intel-opportunity"]
title = "The Intel Opportunity – Stratechery by Ben Thompson"
description = "A new CEO has taken over Intel. Their core business, upon which the company has been built, is floundering. Does the new CEO, who is not really new at all (he’s the current COO), have the vis…"
full_description = "The Intel Opportunity Thursday, May 2, 2013 A new CEO has taken over Intel. Their core business, upon which the company has been built, is floundering. Does the new CEO, who is not really new at all (he’s the current COO), have the vision to ensure Intel’s continued success? I’m not talking about Brian Krzanich, who today was promoted from COO to CEO at Intel. Rather, I’m talking about Andy Grove, who took over Intel in 1987. Intel’s Identity Crisis, v1 Intel originally found success as a memory manufacturer. It’s 1103 chip was the first commercially available DRAM memory, and the DRAM business led massive growth throughout the 1970s. By the 1980s, though, it was the microprocessor business, fueled by the IBM PC, that was driving growth, while the DRAM business was fully commoditized and dominated by Japanese manufacturers. Yet Intel still fashioned itself a memory company. That was their identity, come hell or high water. By 1986, said high water was rapidly threatening to drag Intel under. In fact, 1986 remains the only year in Intel’s history that they made a loss. Global overcapacity had caused DRAM prices to plummet, and Intel, rapidly becoming one of the smallest players in DRAM, felt the pain severely. It was in this climate of doom and gloom that Grove took over as CEO. And, in a highly emotional yet patently obvious decision, he once and for all got Intel out of the memory manufacturing business. Intel was already the best microprocessor design company in the world. They just needed to accept and embrace their destiny. Intel’s Identity Crisis, v2 Intel reaped the benefit of Grove’s repositioning for 25 years. Their chip designs were the foundation of the PC era, and while they faced nominal competition from AMD, they gained many of the economic benefits of a monopolist. But for a brief spell around the turn of the century, a “good” computer required an Intel chip, and they charged prices befitting their place in the PC value chain. Throughout the PC period, Intel invested heavily in their chip design. They learned the lesson of DRAM, and were determined to never be commoditized; their microprocessors would always be superior performers. The problem with setting such ambitious goals, of course, is that you are usually successful. Intel chips have no rival when it comes to PC performance; unfortunately for Intel, PCs are in decline. Mobile devices, such as phones and tablets, are in ascendance, and there Intel’s core strength in all-out performance is a 2nd-order consideration. Power consumption is critical, as well as custom logic for specific functions such as graphics and media decoding. General purpose performance is nice-to-have. Intel’s identity as a chip designer is increasingly irrelevant. The Commodification of Chip Design Most chip designers are fabless; they create the design, then hand it off to a foundry. AMD, Nvidia, Qualcomm, MediaTek, Apple – none of them own their own factories. This certainly makes sense: manufacturing semiconductors is perhaps the most capital-intensive industry in the world, and AMD, Qualcomm, et al have been happy to focus on higher margin design work. Much of that design work, however, has an increasingly commoditized feel to it. After all, nearly all mobile chips are centered on the ARM architecture. For the cost of a license fee, companies, such as Apple, can create their own modifications, and hire a foundry to manufacture the resultant chip. The designs are unique in small ways, but design in mobile will never be dominated by one player the way Intel dominated PCs. The Rise of Manufacturing It is manufacturing capability, on the other hand, that is increasingly rare, and thus, increasingly valuable. In fact, today there are only four major foundries: Samsung, GlobalFoundries, Taiwan Semiconductor Manufacturing Company, and Intel. Only four companies have the capacity to build the chips that are in every mobile device today, and in everything tomorrow. Massive demand, limited suppliers, huge barriers to entry. It’s a good time to be a manufacturing company. It is, potentially, a good time to be Intel. After all, of those four companies, the most advanced, by a significant margin, is Intel. The only problem is that Intel sees themselves as a design company, come hell or high water. Back to the Future Today Intel has once again promoted a COO to CEO. And today, once again, Intel is increasingly under duress. And, once again, the only way out may require a remaking of their identity. It is into a climate of doom and gloom that Krzanich is taking over as CEO. And, in what will be a highly emotional yet increasingly obvious decision, he ought to commit Intel to the chip manufacturing business, i.e. manufacturing chips according to other companies’ designs.1 Intel is already the best microprocessor manufacturing company in the world. They need to accept and embrace their destiny. 2 Of course they keep the x86 design business, but it’s not their only business, and over time not even their primary business ↩Hopefully Krzanich is as inspired a choice as Grove was; in fact, he may have to be even better. The transition I’m calling for will be harder than 1987. That transformation was from a low margin volume business to a high margin one; Wall Street loves that. To go in the opposite direction will take incredible intestinal fortitude ↩ShareFacebookTwitterLinkedInEmail Get notified about new Articles Sign Up Please verify your email address to proceed. RelatedIntel and the Danger of IntegrationDateMonday, June 25, 2018Andy Grove and the iPhone SEDateTuesday, March 22, 2016Intel seizes their opportunityDateWednesday, October 30, 2013 ←The Truth About Windows Versus the Mac HTC Stalls→ Search Stratechery Plus Updates An Interview with Benedict Evans About AI Unknowns Thursday, February 27, 2025 More Chip Curbs?, Google LLM Status Check Wednesday, February 26, 2025 The iPhone 16e; Apple Intelligence Table Stakes; Apple vs. U.K, Continued Monday, February 24, 2025 View All Stratechery Plus Podcasts Cade Cunningham and the Pistons Revival, Luka's Matchup with the Mavs, What Went Wrong in PhoenixGreatest Of All Talk | Feb 28Cade Cunningham and the Pistons Revival, Luka's Matchup with the Mavs, What Went Wrong in PhoenixiPhone 16eDithering | Feb 28iPhone 16eAI Promises and Chip Precariousness, Policy Recommendations and a Changing World, Concerns and CounterpointsSharp Tech | Feb 27AI Promises and Chip Precariousness, Policy Recommendations and a Changing World, Concerns and Counterpoints Stratechery Plus Interviews An Interview with Benedict Evans About AI Unknowns Thursday, February 27, 2025 An Interview with Manna Founder and CEO Bobby Healy About Drone Delivery Thursday, February 20, 2025 An Interview with Uber CEO Dara Khosrowshahi About Aggregation and Autonomy Thursday, February 13, 2025 View All More by Ben Thompson Year in Review The most popular and most important posts on Stratechery by year. View All All Articles Explore all free articles on Stratechery. View All All Content Explore all posts on Stratechery. View All"
