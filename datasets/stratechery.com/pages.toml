title = "The Amazon Tax – Stratechery by Ben Thompson"
description = "Amazon is building a lot of businesses that look like AWS: taxes on major industries that work to everyone’s benefit. The reason, though, is that AWS is a lot like Amazon itself."
full_description = "The Amazon Tax Tuesday, March 15, 2016 Ten years ago yesterday Amazon evangelist Jeff Barr posted a 222-word post on the Amazon Web Services Blog1 that opened: Earlier today we rolled out Amazon S3, our reliable, highly scalable, low-latency data storage service. Until then Amazon Web Services had primarily been about providing developers with a way to tap into the Amazon retail store; S3, though, had nothing at all to do with retail,2 at least not directly. The Origin of AWS As Brad Stone detailed in The Everything Store, by the early 2000s Amazon was increasingly constrained by the fact the various teams in the company were all served by one monolithic technical team that had to authorize and spin up resources for every project. Stone wrote: At the same time, Bezos became enamored with a book called Creation, by Steve Grand, the developer of a 1990s video game called Creatures that allowed players to guide and nurture a seemingly intelligent organism on their computer screens. Grand wrote that his approach to creating intelligent life was to focus on designing simple computational building blocks, called primitives, and then sit back and watch surprising behaviors emerge. The book…helped to crystallize the debate over the problems with the company’s own infrastructure. If Amazon wanted to stimulate creativity among its developers, it shouldn’t try to guess what kind of services they might want; such guesses would be based on patterns of the past. Instead, it should be creating primitives — the building blocks of computing — and then getting out of the way. In other words, it needed to break its infrastructure down into the smallest, simplest atomic components and allow developers to freely access them with as much flexibility as possible. The “primitives” model modularized Amazon’s infrastructure, effectively transforming raw data center components into storage, computing, databases, etc. which could be used on an ad-hoc basis not only by Amazon’s internal teams but also outside developers: This AWS layer in the middle has several key characteristics: AWS has massive fixed costs but benefits tremendously from economies of scale The cost to build AWS was justified because the first and best customer is Amazon’s e-commerce business AWS’s focus on “primitives” meant it could be sold as-is to developers beyond Amazon, increasing the returns to scale and, by extension, deepening AWS’ moat This last point was a win-win: developers would have access to enterprise-level computing resources with zero up-front investment; Amazon, meanwhile, would get that much more scale for a set of products for which they would be the first and best customer. The AWS Tax To say that AWS succeeded in its mission is a wild understatement: the impact on developers is exactly what AWS head Andy Jassy wrote in his vision statement. Stone summarized thusly: The paper laid out the expanded AWS mission: “to enable developers and companies to use Web services to build sophisticated and scalable applications”… “We tried to imagine a student in a dorm room who would have at his or her disposal the same infrastructure as the largest companies in the world,” Jassy says. “We thought it was a great playing-field leveler for startups and smaller companies to have the same cost structure as big companies.” It was, and nearly every startup of note to be founded in the last several years has started on AWS or one of its competitors. The true measure of AWS’ impact, though, was the way it transformed the ecosystem around developers, including venture capital. The effect on Amazon has been equally significant: I detailed last year how the revelation of AWS’ financial results was effectively a Facebook-level IPO, and subsequent earnings reports in which AWS has demonstrated the power of scale — increased revenue plus increased margins — have only solidified the fact that AWS will be a substantial driver of Amazon’s revenue and (eventual!) profits for a long time to come. Social+Capital Founder Chamath Palihapitiya, when asked what company he would invest in if he could only choose one, responded on Quora: AWS is a tax on the compute economy. So whether you care about mobile apps, consumer apps, IoT, SaaS etc, more companies than not will be using AWS vs building their own infrastructure. Ecommerce was AMZN’s way to dogfood AWS, and continue to do so so that it was mission grade. If you believe that over time the software industry is a multi, deca-trillion industry, then ask yourself how valuable a company would be who taxes the majority of that industry? 1%, 2%, 5% — it doesn’t matter because the numbers are so huge — the revenues, profits, profit margins etc. I don’t see any cleaner monopoly available to buy in the public markets right now. The monopoly Palihapitiya is referring to is based on the scale effects I noted above: the larger AWS becomes, the greater advantage Amazon has in pricing AWS’ services, which means they can earn ever more business, which increases their advantage even more. The net result is that for all but the largest cloud-based companies3 this advantage, combined with the flexibility AWS affords (which is critical both operationally and financially), will lead to the inevitable conclusion that Amazon ought to service all their infrastructure needs; the payments they make for this service are Palihapitiya’s “tax”. What is worth considering, though, is the possibility that just as AWS’ effect on developers spread out into the broader startup ecosystem, it increasingly seems that AWS’ impact on Amazon itself goes far beyond its already substantial contribution to the bottom line. Amazon may have started as, to use Stone’s title, “The Everything Store,” but its future is to be a tax collector for a whole host of industries that benefit from the economies of scale, and AWS is the model. The Transformation of Amazon’s E-Commerce Business Longtime readers will recall that I went through my Amazon bear phase4 back in 2014; it was AWS that led me to recant. Even when I recanted, though, I argued that my bearish analysis about Amazon’s e-commerce business had been sound: Amazon’s “Media” business of books, CDs, DVDs, and video games was providing the vast majority of “profits”, but this business was shrinking as a percentage of Amazon’s total sales and, given secular trends in media, likely to continue to shrink on an absolute basis “Electronics and General Merchandise”5 was growing rapidly, but the nature of goods being sold meant there was relatively little margin to be had What, though, if Amazon is content with making no margin on the sale of “Electronics and General Merchandise”? I don’t mean this in the Mathew Yglesias sense, that Amazon “is a charitable organization being run by elements of the investment community for the benefit of consumers”; rather, what if the business model of Amazon’s e-commerce business has changed to “tax” collection? Consider Costco: last year the wholesale retailer had net income of $2.3 billion on sales of $114 billion to its over 81 million members; the total sum of membership fees was $2.5 billion. In other words, Costco’s 11% gross margin didn’t even quite cover the cost of running the business; the difference, along with all of the profit, came from a “tax” levied on Costco customers. I would contend Prime memberships play the same role for Amazon: the non-AWS parts of the business last year generated $2.6 billion in operating profit;6 meanwhile, Consumer Intelligent Research Partners (CIRP) estimates that Amazon now has 54 million Prime members, which at $99/member would generate $5.3 billion in revenue; the difference in profitability for Amazon’s e-commerce business, such as it is, comes from a “tax” levied on Amazon’s best customers. In fact, though, I think even this analysis is too narrow: e-commerce is inexorably taking over more and more of the U.S. retail sector in particular, and Amazon is taking over 50% of that e-commerce growth. Combine this reality with the growth in Prime and Amazon is effectively on its way towards collecting a tax on all of retail. Again, though, just as is the case with AWS, this tax is one that consumers willingly embrace: Prime is a super experience with superior prices and superior selection, and it too feeds into a scale play. The result is a business that looks like this: That is, of course, the same structure as AWS — and it shares similar characteristics: E-commerce distribution has massive fixed costs but benefits tremendously from economies of scale The cost to build-out Amazon’s fulfillment centers was justified because the first and best customer is Amazon’s e-commerce business That last bullet point may seem odd, but in fact 40% of Amazon’s sales (on a unit basis) are sold by 3rd-party merchants; most of these merchants leverage Fulfilled-by-Amazon, which means their goods are stored in Amazon’s fulfillment centers and covered by Prime. This increases the return to scale for Amazon’s fulfillment centers, increases the value of Prime, and deepens Amazon’s moat The “tax” analogy extends beyond Prime; for example, Amazon is taking a portion of these 3rd-party sales, and a greater portion of revenue from goods they sell directly. The effect, though, is consistent: Amazon is collecting a “tax” on a massive industry and no one minds because Amazon’s scale ensures the best prices and the best experience. Logistics and the Echo It seems increasingly clear that Amazon intends to repeat the model when it comes to logistics: after experimenting with six planes last year the company recently leased 20 more to flesh out its private logistics network; this is on top of registering its China subsidiary as an ocean freight forwarder. No surprise that, as the Wall Street Journal noted: In a securities filing, Amazon for the first time identified “companies that provide fulfillment and logistics services for themselves or for third parties, whether online or offline” as competition. And it referred to itself as a “transportation service provider.” In both cases, it marked the first time Amazon included such language in its annual report, known as a 10-K. So how might this play out? Well, start with the fact that Amazon itself would be this logistics network’s first-and-best customer, just as was the case with AWS. This justifies the massive expenditure necessary to build out a logistics network that competes with UPS, Fedex, et al, and most outlets are framing these moves as a way for Amazon to rein in shipping costs and improve reliability, especially around the holidays. However, I think it is a mistake to think that Amazon will stop there: just as they have with AWS and e-commerce distribution I expect the company to offer its logistics network to third parties, which will increase the returns to scale, and, by extension, deepen Amazon’s eventual moat.7 The much-buzzed about Echo fits this model too: all of the usual suspects can build out the various pieces of the connected home; Amazon will simply provide the linchpin, the Echo’s cost a “tax” on the connected home. A Primitive Organization Bezos’ famed 1997 shareholder letter makes clear the roots of this model were in place from the beginning. Specifically, Bezos is very focused on the power of scale: The stronger our market leadership, the more powerful our economic model. Market leadership can translate directly to higher revenue, higher profitability, greater capital velocity, and correspondingly stronger returns on invested capital…we choose to prioritize growth because we believe that scale is central to achieving the potential of our business model. It’s equally clear, though, that Bezos didn’t then fully appreciate that his model would extend far beyond e-commerce; that, though, is why Amazon’s internal organization is such a strength. The company is organized with multiple relatively independent teams, each with their own P&L, accountabilities, and distributed decision-making. Stone explains an early Bezos initiative (emphasis mine): The entire company, he said, would restructure itself around what he called “two-pizza teams.” Employees would be organized into autonomous groups of fewer than ten people — small enough that, when working late, the team members could be fed with two pizza pies. These teams would be independently set loose on Amazon’s biggest problems…Bezos was applying a kind of chaos theory to management, acknowledging the complexity of his organization by breaking it down to its most basic parts in the hopes that surprising results might emerge. Stone later writes that two-pizza teams didn’t ultimately make sense everywhere, but as he noted in a follow-up article the company remains very flat with responsibility widely distributed. And there, in those “most basic parts”, are the primitives that lend themselves to both scale and experimentation. Remember the quote above describing how Bezos and team arrived at the idea for AWS: If Amazon wanted to stimulate creativity among its developers, it shouldn’t try to guess what kind of services they might want; such guesses would be based on patterns of the past. Instead, it should be creating primitives — the building blocks of computing — and then getting out of the way. Steven Sinofsky is fond of noting that organizations tend to ship their org chart, and while I began by suggesting Amazon was duplicating the AWS model, it turns out that the AWS model was in many respects a representation of Amazon itself (just as the iPhone in many respects reflects Apple’s unitary organization): create a bunch of primitives, get out of the way, and take a nice skim off the top. Hosted on Typepad ↩Contrary to popular myth, Amazon was not selling excess capacity ↩I will discuss Dropbox’s recent announcement that they are moving away from AWS in tomorrow’s Daily Update ↩It’s like puberty for tech analysts ↩This nomenclature is from Amazon’s financial reports ↩This isn’t comparable to the Costco number which was net income ↩To be sure, UPS, Fedex, et al have a big head start, but their networks and cost structures are focused on businesses; Amazon will focus on consumers ↩ Get notified about new Articles Sign Up Please verify your email address to proceed. RelatedCloudflare’s DisruptionDateThursday, September 30, 2021Amazon’s New CustomerDateMonday, June 19, 2017An Interview with Brad Stone about Amazon UnboundDateThursday, May 13, 2021 ←Exponent Podcast: Is That an Echo? Exponent Podcast: Pickaxe Retailers→ Search Stratechery Plus Updates An Interview with Benedict Evans About AI Unknowns Thursday, February 27, 2025 More Chip Curbs?, Google LLM Status Check Wednesday, February 26, 2025 The iPhone 16e; Apple Intelligence Table Stakes; Apple vs. U.K, Continued Monday, February 24, 2025 View All Stratechery Plus Podcasts Cade Cunningham and the Pistons Revival, Luka's Matchup with the Mavs, What Went Wrong in PhoenixGreatest Of All Talk | Feb 28Cade Cunningham and the "
