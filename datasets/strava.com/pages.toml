exts on the Services without compensation to you. For example, we may show your Strava followers that you use a certain device, product, or service available from a third-party that has paid us to display its ads on Strava. You may adjust settings to prevent your profile name and profile photo from appearing in an ad. As noted in our Privacy Policy, we may suggest segments, routes, challenges, or clubs on Strava that may interest you, users that you may want to follow, or new features that you may want to try. We also use algorithmic ranking to determine what type of content (such as activity, post, route recommendation) to show in your feed. The main parameters for these recommendations can include your sport type, user engagement with the content type (e.g., impressions, clicks), activity features (e.g., activity uploads, average run distance), app usage (e.g. challenge joins, club joins), and basic demographic information (age, gender, tenure), and location information where relevant to the recommendatio'''
