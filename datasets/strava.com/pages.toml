["https://strava.com/legal/privacy"]
title = "Strava Privacy Policy"
description = "Do we sell your personal information for monetary value?"
full_description = 'Strava Privacy Policy Effective Date: September 30, 2024 Your privacy is very important to us. Before we get to the details, here’s a summary of our key privacy practices. Click on the links to learn more and read the full policy below. Jump to full privacy policy Privacy Summary Collection, Use, and Sharing of Data Do we sell your personal information for monetary value? No Do we sell aggregated information for monetary value? No Do we share your personal information with third parties that are not service providers? Yes, with your consent Do we share your personal information for targeted advertising? Yes, with your consent Do we use sensitive categories of data, like health information? Yes, with your consent Do we provide additional privacy protections for minors (users under 18)? Yes Do we use your contact list? Yes, with your consent Do we delete your personal information when you request account deletion? Yes, unless it is necessary to provide the Strava services or required by law Do we retain your data after you request deletion of your account? No, unless it is necessary to provide the Strava services or required by law Privacy Controls Can you control who sees your activity and content? Yes Can you control who sees your location-based activity? Yes Are your activity and profile privacy controls public (set to “Everyone”) by default? Yes, if you are 18 years of age or older Can you download and delete your personal information? Yes Do all users worldwide have the same suite of privacy controls? Yes Tracking Do we track your device location while you are not using our app? No Do we track your device location to provide Strava services to you? Yes, with your consent Do we use non-essential cookies? Yes, with your consent Do we track your browsing activities on other sites? No Do we listen to you using your device microphone? No Communication Do we give you advance notice when we make important changes and updates to our Privacy Policy? Yes Do we send you marketing communications? Yes, unless you have opted out, or, where required, with your express consent Do we send you push notifications on mobile devices? Yes, with your consent Privacy Policy Introduction Strava’s privacy policy (the “Privacy Policy”) explains the information we collect, how we use and share it, how to manage your privacy controls, and your rights in connection with our websites and the related mobile applications and services (collectively, the “Services”). Please also read our Terms of Service, which set out the terms governing the Services. Strava is headquartered in San Francisco, California, USA. If you are in the European Economic Area, the Services are provided to you by Strava Ireland Limited. Otherwise, the Services are provided to you by Strava, Inc. Throughout these Terms “Strava” refers to the relevant service provider providing the Services to you. This policy was written in English. To the extent a translated version conflicts with the English version, the English version controls. If you have any questions about our privacy practices, this Privacy Policy, or would like to contact us or our Data Protection Officer, you can do so by the email or addresses below or via https://support.strava.com. For Non-EU/EEA Data Subjects: Strava, Inc. 208 Utah Street San Francisco, CA 94103 USA Attn: Legal DPO@strava.com For EU/EEA Data Subjects: Strava Ireland Ltd. Making it Work Magennis Court Pearse Street Dublin 2 D02 FK76 Ireland Attn: Legal DPO@strava.com Information Strava Collects Strava collects information about you, including information that directly or indirectly identifies you, if you or other Strava users choose to share it with Strava. The sources from which we collect this personal information fall into three categories: information you provide, information we collect automatically, and information we collect from other sources. For example, based on how you interact with Strava and the Services, we may collect information when you track, complete, or upload activities using the Services. Strava also collects information about how you use the Services. In addition, you may choose to share information about yourself, your friends, and your activities with Strava. Specific categories of data collected and received are outlined here. Account, Profile, and User Activity We collect account information such as your name, email address, date of birth, gender, weight, username and password that helps secure and provide you with access to our Services. Profile, activity and use information is collected about you when you engage in activities such as choosing to upload a photo, video, post, or activity (including date, time and geo-location information as well as your speed and pace and perceived exertion), join a club or challenge, add your equipment usage, view others’ activities, or otherwise use the Services. Location Information We collect and process location information when you sign up for and use the Services. We do not track your device location while you are not using the Services. In order for most of our core features (e.g., GPS activity tracking, routes, segment leaderboards) to function, you must grant us permissions in your device’s privacy controls to track your device location while you use the Services. If you would like to stop the device location tracking, you may do so at any time by adjusting your device settings. Content You Share We gather information from photos, videos, posts, comments, messages, kudos, ratings, reviews, and other content you share on the Services, including when you participate in partner events or create segments or routes. Contacts’ Information You can choose to add your contacts’ information by connecting your contacts from your mobile device or social networking accounts to Strava. If you choose to share your contacts with Strava, we will access and store your contacts’ information to identify potential connections and help you connect with each other. Learn more about how we collect information about your contacts, how we use that information, and the controls available to you. Connected Devices and Apps We collect information from devices and apps you connect to Strava in accordance with the consent you give when you authorize the connection to Strava. For example, you may connect your Garmin watch or Peloton account to Strava to interact with the Services. The information generated from your connections with these third-party devices and apps, for example, step count data, or personal information, such as heart rate data (if you have consented to processing of health information), will be passed along to Strava. You may update your connected devices and apps preferences at any time in your settings. Learn more about how information from devices and apps you connect to Strava may be collected or used. Health Information Strava may collect or infer health information, such as heart rate. Certain health information may be inferred from sources such as heart rate or other measurements, including power, cadence, and weight or other indicators. Where health information can be used to uniquely identify you, it is considered personal information, and sensitive personal information under certain laws. Before you can upload health information to Strava, you must give your explicit consent to the processing of that health information by Strava. You can withdraw your consent to Strava processing your health information at any time. Payment Information When you make a payment on Strava, you will be asked to provide payment information such as your payment card or other payment details. We use Payment Card Industry (PCI) compliant third-party payment services who may store your credit card information in accordance with applicable standards. Third-Party Accounts Strava allows you to sign up and log in to the Services using accounts you create with third-party products and services, such as Meta, Google, or Apple (collectively, “Third-Party Accounts”). If you access the Services through Third-Party Accounts, we will collect information you have agreed to make available such as your name, email address, profile information and preferences. This information is collected by the Third-Party Account providers and is provided to Strava under their privacy policies. You can generally control the information we receive from these Third-Party Accounts using the privacy controls in your account with them. Technical Information, Cookies, and Log Files We collect information from your browser, computer, or mobile device, which provides us with technical information when you access or use the Services. This technical information includes device and network information, cookies, log files and analytics information. Learn more about how we use cookies and manage your preferences by visiting our Cookie Policy. The Services use log files. The information stored in those files includes IP addresses, browser type, internet service provider (ISP), referring/exit pages, platform type, date/time stamp, and number of clicks. IP addresses may be linked to session IDs, athlete IDs and device identifiers. Other Information We may collect information directly from you or through our service providers, such as when we collect your feedback through surveys. We may also collect information about you from other Strava users such as when they give you kudos or comment on your activities. How Strava Uses Information Strava uses the information we collect and receive as described below. To provide the Services We use the information we collect and receive to provide the Services, including providing you with the ability to: Record your activities and analyze your performance. For example, to compare your past efforts, analyze your training, and—with your consent—use your heart rate information to provide you with performance analysis. We may also match your GPS activities to specific segments or routes to analyze your efforts against those of other users and to establish leaderboards. Interact with other users. For example, we use personal information, including your name, avatar, athlete ID, and content you choose to share to compete on segments, participate in clubs, challenges, or events, follow other users, message other users, and use features that help users interact with one another, such as group activities or Flyby. Manage your training. For example, to set goals and use your training dashboard. Explore new places to go. For example, to discover routes or segments where you can engage in your activity. Similarly, if several users run a specific route, that information may be used to suggest the route to other users. Provide AI Features. For example, we use machine learning or artificial intelligence, including large language models, to detect anomalies on leaderboards, generate route recommendations, or provide personalized training guidance. Visualize your activities in new ways. For example, by creating personal heatmaps or using your training log. Share insights with the Strava community. For example, by sharing your public reviews and photos of specific routes or segments. We may also analyze your public photos from specific routes or segments to attach characteristics to those routes or segments (such as shaded, waterfalls, flowers). To contact you regarding the Services. We use your contact information, which includes name and email address, so we can contact you when needed regarding the Services, for example, to notify you about material changes to our terms. Subject to your privacy controls, your information, including parts of your profile, username, photos/videos, users you follow and who follow you, clubs you belong to on Strava, your activities, the devices you use, your online status, and kudos and comments you give and receive will be shared on Strava so that you may be able to participate in the Services, for example to show your place on a leaderboard. Certain information (e.g., your name, and some profile information) is also available to non-users on the web. Your precise location information, such as where you run or ride, may also be shared on Strava or to non-users, in accordance with your privacy controls. Regarding our products or features using machine learning or artificial intelligence, including large language models, ("AI Features"), we use the information we collect to enhance the quality, reliability, and/or accuracy of our AI Features by creating, developing, training, testing, improving, and maintaining AI and ML models run by Strava or our service providers. We use aggregated, de-identified information for AI Features where possible for their purpose. Depending on your privacy controls and sharing permissions, we also may use personal information such as health and location information for AI Features, for example, to provide you with training analysis and recommendations. To customize your experience We use the information we collect and receive to customize your experience. For example, we may suggest segments, routes, challenges, or clubs on Strava that may interest you, users that you may want to follow, or new features that you may want to try. Learn more about how we use information to make recommendations here. To provide you with targeted commercial content We use the information we collect and receive to serve you with relevant promotions, subject to your notification and email preferences. For example, if we see you are an active user who has been on a monthly subscription plan for an extended period of time, we may serve you a promotion to switch to a discounted annual plan. Or if you are an active user who has never subscribed, we may send you an offer for a free subscription trial. In addition, we use cookies and other tracking technologies, including SDKs and other mobile analytics to inform targeted advertising and serve relevant ads. Learn more and manage your preferences by visiting our Cookie Policy. To protect you and the Services, as well as minors We use the information we collect and receive to protect users, enforce our Terms of Service, Acceptable Use Policy, and Community Standards, and promote safety. For example, to help us find and remove content that violates our terms, such as hate speech or spam, as well as suspend or terminate accounts that share such content. We use automated tools to assist us in protecting and safeguarding you and other users and to keep the Service secure, for example to detect misuse and bad actors. Strava reserves the right to review accounts and user actions on the Services to ensure compliance with our Terms. You can learn more about how to report content that violates our terms and standards here. We also use device information and information contained in log files, including IP address, to maintain the security and integrity of our Services. To enhance safety and privacy for our younger users, we use dates of birth to help '
