title = "Strava | Running, Cycling & Hiking App - Train, Track & Share"
description = 'Start by sweating.The way you "post" in this network is by being active. Strava works with your mobile phone or favorite GPS device to track your activities and share your efforts with friends.'
full_description = '''The way you "post" in this network is by being active. Strava works with your mobile phone or favorite GPS device to track your activities and share your efforts with friends. When your workout is over, almost every metric you can imagine awaits - from basics like speed, pace and distance, to Strava exclusives, like your performance compared to past attempts and Relative Effort. Our desktop experience goes even deeper with training plans, route planning, activity breakdowns and other tools to take your planning and analysis game to the limit. Recording an activity with Strava is easy, and afterward you'll have a detailed activity map and tons of performance data. The Strava feed is full of inspiring activities, crazy adventures and interesting new routes – all the best athletic content, none of the junk posts you find on other social networks. A running club in your neighborhood, content from your favorite bicycle maker, the best trail to catch the sunset, a fun new race, the city's toughest climb, a weekend training partner - whatever your next adventure, you'll find it on Strava. Workout with friends, stay motivated, get inspired - our community is what separates Strava from the rest. Share your real-time location during an activity with up to three safety contacts. Your loved ones get peace of mind. You get to forge ahead (or stop for a snack). Workout with friends, stay motivated, get inspired - our community is what separates Strava from the rest. Recording an activity with Strava is easy, and afterward you'll have a detailed activity map and tons of performance data. The Strava feed is full of inspiring activities, crazy adventures and interesting new routes – all the best athletic content, none of the junk posts you find on other social networks. A running club in your neighborhood, content from your favorite bicycle maker, the best trail to catch the sunset, a fun new race, the city's toughest climb, a weekend training partner - whatever your next adventure, you'll find it on Strava.'''
