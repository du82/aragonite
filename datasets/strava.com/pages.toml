title = "Running App - Explore Run Maps, Route Planner & Tracker | Strava"
description = "Explore our Running App - Create routes, track progress, achieve fitness goals & share success. Your ultimate companion for a rewarding running journey."
full_description = "Yes! You can join Strava for free to record and share activities, join clubs and challenges, and use safety features like Beacon. To unlock exclusive features – think custom running goals, discovering nearby roads and trails, and competing for the fastest time on the Segment Leaderboards – you can start a subscription. Yes, you can record activities right in the Strava app. When you’re ready, just tap the record button, choose a sport, and you’re off. You choose how much you share on Strava. Use your privacy controls to hide certain details from your activities – like your pace, or the start and end points on your map – or set your entire profile to private. Visit our support page to see more ways you can customize your privacy settings. You can record and share activities for 50 different sports and counting, from cycling to pilates to pickleball. No matter how you like to move, it belongs on Strava. Strava pairs with dozens of unique devices and apps. You can likely upload old activities from your device directly to Strava, but the instructions will vary depending on the specific device. Learn more about syncing activities to Strava on our support page."
