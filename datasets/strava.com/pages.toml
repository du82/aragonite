title = "What's New"
description = "The latest updates and news from Strava, including product releases, partnerships, and tips and techniques to get the most out of Strava."
full_description = '''What's New<img class="" height="1250" src="https://images.ctfassets.net/7ajcefednbt4/3MSq6W1SbM00En8LdgcWnd/fd640ae7df885efccc4023343fcdaf39/Athlete_Intelligence_listing.jpg" style="width:100%" width="1500"/>Multi-SportMeet Athlete Intelligence: Personalized AI Insights to Reach Your GoalsLet’s face it: fitness data is everywhere but understanding it isn’t always easy. That’s where Athlete Intelligence comes in.<img class="" height="1252" src="https://images.ctfassets.net/7ajcefednbt4/301mURimxKRnLEaCP2duQz/318a966a562a845223d4d8658270a1ac/Web_Routebuilder_Improvments_Club_post_asset_3.jpg" style="width:100%" width="1500"/>Strava UpdatesWant More Out of Maps? Try ‘em Out on Desktop 🖥️To help you chart your next expedition, we’ve made improvements to our route builder. It’s now easier than ever to fine-tune the details of your route – in a way that you just can’t on a phone.<img class="" height="1252" src="https://images.ctfassets.net/7ajcefednbt4/4tq6BPe9DiKdmLioZV1zLj/dac02c656e4a3ef68e8c4da8019fcc3f/Segment_listing.jpg" style="width:100%" width="1500"/>Strava UpdatesSegment Updates: Verified Segments, Decluttering and Leaderboard FAQ’sWe’re renewing our commitment to keeping Segments clean by decluttering duplicate and unused Segments, adding verified Segments and introducing new rules on Segment leaderboards.<img class="" height="1252" src="https://images.ctfassets.net/7ajcefednbt4/1l3u5Xr9zuFSNsUIr5iOHG/e0dd9a02882f6438f51620871885b877/Quick_edit_listing.jpg" style="width:100%" width="1500"/>Strava UpdatesNew! Say Goodbye to "Morning Run" and Hello Kudos with Quick EditSomeone needs to say it: your activities deserve more than the generic “Morning Run” or “Afternoon Ride”. That’s where Quick Edit comes in.<img class="" height="1251" src="https://images.ctfassets.net/7ajcefednbt4/10dTqEEylsyWgNEafSY9Eg/a9d65b9ac3baf7ed727253774b103add/soulcycle_listing.jpg" style="width:100%" width="1500"/>Multi-SportNew! Ride with SoulCycle, Shine on StravaCalling all indoor riders: you can now share your SoulCycle activities on Strava. SoulCycle is a high-intensity, indoor cycling, cardio workout. And now you’ll be able to bring your whole Strava community along for kudos.STRAVA | SoulCycleSponsored article<img class="" height="1251" src="https://images.ctfassets.net/7ajcefednbt4/3Xfy7KFVMuSfAsweGW204s/2d4d66590aa00a99c4da734111946a44/Strava_Stories_listing.jpg" style="width:100%" width="1500"/>Multi-SportNew! Get a Clear View of Where to Go With Map-Only ModeSometimes less is more. Especially when less is an easier way to view Strava’s dynamic, athlete-centered map, AND a Global Heatmap powered by billions of miles of activity. We heard your requests and we’re introducing: Map-Only mode.<img class="" height="1251" src="https://images.ctfassets.net/7ajcefednbt4/7pzSUYgmp5fq5wjG7GsDz2/b4331da2b220df4a49baa744816b2502/Family_Plan_listing.jpg" style="width:100%" width="1500"/>Multi-SportLet the Games Begin: Family Plan is Here!You have the crew. You have the motivation. Now get the tools to make it all happen. Introducing the all-new Family Plan.<img class="" height="1251" src="https://images.ctfassets.net/7ajcefednbt4/7imPdHAQIBYuSbfj1OePHn/bec5f1b3c6e31463ffce252a46a7dcad/Start_ttime_listing.jpg" style="width:100%" width="1500"/>Strava UpdatesNew: Hide Your Start Time on Any ActivityNow you can hide the start time of individual activities right when you upload – just like you can for workout metrics like pace, heart rate or calories.<img class="" height="1251" src="https://images.ctfassets.net/7ajcefednbt4/1emSgRf8hnHY7Mu2gjqzTh/db73085933d62b3ef8fe9db8e9f1064c/Dark_Mode_listing.jpg" style="width:100%" width="1500"/>Strava UpdatesHello, Dark Mode It’s been 84 years, but the wait is finally over: dark mode is now on Strava. Thanks for hanging in there.<img class="" height="1252" src="https://images.ctfassets.net/7ajcefednbt4/4AEHgA7O2a3u0bnsw0cjik/a8589ecd7d625777fc82fe7d7f3d5de2/Segment_Leaderboard_Percentage_Rankings_Show_Exactly_How_You_Stack_Up.jpg" style="width:100%" width="1500"/>Multi-SportSegment Leaderboard Percentage Rankings Show Exactly How You Stack UpHave you ever looked at a leaderboard, seen that you rank X-hundred out of Y-thousand, and tried to do some quick napkin math to figure out what percentile that puts you in?<img class="" height="1252" src="https://images.ctfassets.net/7ajcefednbt4/1WeL8pg4M8VnlszsCwdKq8/b3774eac5bc681c765afa9621e932211/Goalks.jpg" style="width:100%" width="1500"/>Multi-SportIt Just got Easier to Set & Track a Goal on StravaGoals can get you moving. They can keep you accountable and motivated. They can get you out of your comfort zone – where you can get stronger and level up. <img class="" height="1251" src="https://images.ctfassets.net/7ajcefednbt4/50INqkWEwX5UzKlNNF2uzb/2f88625ae07f7b310b6bb7f071f324d6/Stat_overlay_Cover_listing.jpg" style="width:100%" width="1500"/>Multi-SportNew: Add Stats to Your FlyoversNow your Flyovers will have a stats overlay showcasing your pace or speed, elevation, and distance as it happened along the terrain.123'''
year_published = 2025
