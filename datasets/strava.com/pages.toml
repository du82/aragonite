rt of the Terms. Strava reserves the right to review accounts and user actions on the Services to ensure compliance with our Terms. BY ACCESSING, USING OR UPLOADING OR DOWNLOADING ANY INFORMATION OR MATERIALS TO OR FROM THE SERVICES, OR BY INDICATING YOUR ASSENT TO THESE TERMS BY CREATING AN ACCOUNT, CLICKING “SIGN UP” OR ANY SIMILAR MECHANISM, YOU ARE AGREEING TO THESE TERMS. IF YOU DO NOT AGREE TO THESE TERMS, DO NOT ACCESS OR USE THE SERVICES. This agreement was written in English. To the extent a translated version of the Terms conflict with the English version, the English version controls. If you access or use the Services on behalf of a company or other entity, you represent that you have authority to bind such entity and its affiliates to these Terms and that it is fully binding on them. In such case, the term “you” will refer to such entity and its affiliates. If you do not have authority, you may not access or use the Services. These Terms contain disclaimers of warranties and limitations on liability that may be applicable to you. Notice Regarding Dispute Resolution: These Terms contain provisions that govern how disputes between you and Strava are resolved, including an agreement to arbitrate, which will, unless you reside in the EU/EEA, with limited exception, require you to submit claims you have against us to binding and final arbitration and limit you to claims against Strava on an individual basis, unless you opt-out in accordance with the instructions below. Registration and Accounts The Services are intended solely for persons who are at least 13 years old or such higher age as required in your country to use the Services. If you are under the legal age to form a legally binding contract in your jurisdiction, you represent that your parent or legal guardian has reviewed and agreed to these Terms on your behalf. If you are a parent or legal guardian of a Strava user under the legal age to form a binding contract in your jurisdiction, you agree to b