title = "Privacy notice • Streamlit"
description = "Streamlit is an open-source Python framework for data scientists and AI/ML engineers to deliver interactive data apps – in only a few lines of code."
full_description = "Last updated: August 25, 2023Privacy noticeA quick note about privacyStreamlit aims to make it fast, easy, and delightful to create and share apps. To do so, Streamlit has open-source software you can download to build your apps; a sharing platform you can use to deploy, manage, and share your apps; and various services, like our discussion forum, where you can get more information on how to better use Streamlit. By default, each product or service collects some data so that we can understand how Streamlit products are used and use that information to improve Streamlit.The Streamlit open-source software does collect summary statistics. You can turn off summary statistics when using our open source software by changing your config file to set browser.gatherUsageStats = false.Quick Links1. ScopeSnowflake, Inc. recently acquired Streamlit, Inc. This Privacy Notice applies to personal information processed by Snowflake, Inc. (formerly, Streamlit, Inc.) (“Streamlit”, “we”, “us”, and “our”) in connection with (i) our website, hosting service for applications (“Community Cloud”), forums, blogs, and related online and offline offerings (collectively, the “Services”); and (ii) your use of our open source software (the “Software”).All capitalized terms not defined in this Privacy Notice will have the meaning set forth in our Terms of Use (the “Terms”).1.1. Personal Information Processed by Community CloudWhile Streamlit collects and processes personal information as described in this Notice, Community Cloud is not intended to be used for the processing or storage of sensitive or special categories of personal information by users. Please see the Terms of Use for Streamlit’s Community Cloud Service for more information.2. What personal information do we collect?2.1. Account creationIf you create an account with the Services, we will collect certain personal information about you, such as your name, email address, user ID, and authentication information.2.2 Communications with UsWe may collect personal information from you such as your email address when you request information about or show interest in our Services or Software, register for our newsletter, request customer or technical support, communicate with us, or otherwise provide personal information to us.2.3. Data you provide in connection with our ServicesWe collect the information you provide to the Services (including any personal information that you choose to include when using the Services, such as your name and/or email address).2.4. SurveysWe may contact you to participate in surveys. If you decide to participate, we may ask you for certain information which may include personal information.2.5. Community featuresWe may offer community features such as forums, blogs, or social media pages. If you decide to use certain community features, you may be presented with additional terms of service and or privacy notices relevant to those features or external services. Any content you provide on the public sections of these channels will be publicly accessible and is not subject to privacy protections referenced herein.2.6. Information we automatically collectWe may also collect certain information automatically when you use the Services. This information may include your user settings, unique identifiers associated with your browser or device (including Technologies), details about your browser, operating system or device, Internet service provider, pages that you visit before and during your use of the Services, information about the links you click, and other information about how you use the Services.We may also monitor your use of the Software, and compile information related to such use, including statistical and performance information related to the operation and use of the Software (“Usage Data”). Usage Data collected by the Software does not include IP address or browser user agent. As between Streamlit and you, all right, title and interest in the Usage Data and all intellectual property rights therein, belong to and are retained solely by us, and we may use such Usage Data for any purpose permitted by law, including for data gathering, analysis, Software and Services enhancements and improvements, marketing, and as may be required by applicable law or regulation.2.7. Cookies, pixel tags/web beacons, and analytics informationWe, as well as third parties that may provide content or other functionality on the Services, may use cookies, pixel tags, local storage, and other technologies (“Technologies”) to collect information through the Services. Technologies are essentially small data files placed on your device that allow us and our partners to record certain pieces of information when you visit or interact with our Services.Our use of such Technologies falls into the following categories: (i) operationally necessary Technologies; (ii) personalization Technologies; and (iii) analytics or measurement Technologies;.2.7.1 CookiesCookies are small text files placed in device browsers to store their preferences. We and our third-party partners use cookies for different reasons, including to see which areas and features are popular and to count visits to our Sites. Some cookies are required for technical reasons in order for our Sites to operate. Other cookies enable us to track and target the interests of our users to enhance the experience on our Sites (see section 2.7.3). Most browsers allow you to block and delete some or all of the cookies used by a site. However, note that if you choose to block or delete all cookies, the Services may not work properly.2.7.2 Pixel tags/web beaconsWe may include web beacons in e-mails to understand whether messages have been opened, acted on, or forwarded.2.7.3 AnalyticsWe may use Google Analytics and other service providers to collect and process analytics information on our Services. For more information about how Google uses data, please visit www.google.com/policies/privacy/partners/. You can opt out of Google Analytics’ collection and processing of data generated by your use of our website by going to http://tools.google.com/dlpage/gaoptout.3. How do we use your information?We use your personal information for a variety of business purposes, including:3.1. To provide the services and software, such as:Operating, maintaining, and improving the Services and Software;Providing and facilitating the delivery of Services and Software you request;Fulfilling our contract with you;Responding to your questions, comments, and other requests;Processing your payment card or other financial information for products or Services purchased; andProviding access to certain areas, functionalities, and features of our Services.3.2. Administrative purposes, such as:Pursuing our legitimate interests, such as research and development (including marketing research), network and information security, and fraud prevention;Measuring interest and engagement in the Services and Software;Developing new products and services;Ensuring internal quality control and safety;Authenticating and verifying individual identities;Carrying out audits;Communicating with you about your account, the Services and the Software;Preventing and prosecuting potentially prohibited or illegal activities;Enforcing our agreements; andComplying with our legal obligations.3.3. Marketing our products, services, and softwareWe may use personal information to tailor and provide you with product announcements and other content. We may provide you with these materials as permitted by applicable law.If you have any questions about our marketing practices or if you would like to opt out of the use of your personal information for marketing purposes, you may contact us at any time as set forth below.3.4. Purposes for which You consentWe may use personal information for other purposes that are clearly disclosed to you at the time you provide personal information or with your consent, as required.3.5. De-identified and aggregated information useWe may use personal information and other information about you to create de-identified and/or aggregated information. De-identified and/or aggregated information is not personal information, and we may use and disclose such information in a number of ways, including research, internal analysis, analytics, and any other legally permissible purposes.4. To Whom Do We Disclose Your Personal Information?4.1. Service providersWe may disclose your personal information with our service providers for the purposes described in Section 3 (How do we use your information).4.2. Disclosures to protect us or othersWe may access, preserve, and disclose any information we store in association with you to external parties if we, in good faith, believe doing so is required or appropriate to: (i) comply with law enforcement or national security requests and legal process, such as a court order or subpoena; (ii) protect your, our, or others’ rights, property, or safety; (iii) enforce our policies or contracts; (iv) collect amounts owed to us; or (v) assist with an investigation or prosecution of suspected or actual illegal activity.4.3. Merger, sale, or other asset transfersIf we are involved in a merger, acquisition, financing due diligence, reorganization, bankruptcy, receivership, purchase or sale of assets, or transition of service to another provider, then your information may be sold or transferred as part of such a transaction as permitted by law and/or contract.5. International data transfersAll information processed by us may be transferred, processed, and stored anywhere in the world, including but not limited to, the United States or other countries, which may have data protection laws that are different from the laws where you live. We endeavor to safeguard your information consistent with the requirements of applicable laws.6. Your choices6.1. GeneralYou may have the right to opt out of certain uses of your personal information.6.2. Email communicationsYou can unsubscribe from Streamlit emails by using the unsubscribe link found at the bottom of the email to opt out of receiving future emails. Note that you will continue to receive transaction-related emails, and you will not be able to opt out of those communications (e.g., communications regarding the Services, or updates to our Terms or this Privacy Notice).6.3. “Do not track”Do Not Track (“DNT”) is a privacy preference that users can set in certain web browsers. Please note that we do not respond to or honor DNT signals or similar mechanisms transmitted by web browsers.6.4. CookiesYou may stop or restrict the placement of Technologies on your device or remove them by adjusting your preferences as your browser or device permits. Please note you must separately opt out in each browser and on each device.7. California Users: Your California privacy rightsThe California Consumer Privacy Act of 2018 as amended by the California Privacy Rights Act of 2020 (“CCPA”), effective as of January 1, 2023, requires businesses that collect personal information of California residents to make certain disclosures regarding how they collect, use, retain and disclose such information. This section addresses those requirements. For a description of all of our data collection, use and disclosure practices, please read this Privacy Notice in its entirety.Personal Information Collection and Disclosure: Streamlit does not sell personal information as we understand the term sale to be defined by the CCPA and its implementing regulations. Streamlit does share personal information (as defined by CCPA and its implementing regulations, as set forth in the second table below.Categories of Personal Information Shared in the Preceding 12 Months:Categories of Personal Information SharedCategories of Third-Party RecipientsPurpose for DisclosureIdentifiers and Contact InformationSocial Media PlatformsCross Context BehavioralAnalytics or other Electronic Network ActivityAdvertisers, Ad Agencies, Advertising Networks and Platforms, Advertising Related Technology ProvidersAdvertising8. Your privacy rightsYou may have privacy rights regarding your personal information.You may request a copy of your personal information or request to correct, update, or delete your personal information.You may request that we disclose what personal information we collect, including the categories of personal information, the categories of sources from which the personal information is collected, the business or commercial purpose for collecting, selling, or sharing personal information, and the categories of third parties to whom we disclose personal information.Where required by law, you can object to processing of your personal information, ask us to restrict processing of your personal information, or request portability of your personal information.If we collected and processed your personal information with your consent, where required by law, you can withdraw your consent at any time. Withdrawing your consent will not affect the lawfulness of any processing we conducted prior to your withdrawal, nor will it affect processing of your personal information conducted in reliance on lawful processing grounds other than consent.Where applicable, if you wish to submit a complaint to a data protection authority about our collection and use of your personal information, you can find contact details for data protection authorities in the EEA available here, in the United Kingdom here, and in Switzerland here.Californians also have the right to opt out of the sale of personal information or the sharing of personal information for cross-context behavioral advertising, as well as the right to limit the use or disclosure of sensitive personal information for purposes other than those permitted by the CCPA if sensitive personal information is collected. As described above, we do not sell your personal information, or use or disclose sensitive personal information for purposes other than those permitted by the CCPA.You can submit a request online by filling out our Consumer Rights Request Form or by contacting us at 877-243-8061.Streamlit will verify that the information you submit (which may include your first name, last name, email address, company, and country/state) matches our records before we fulfill the request. You may use an authorized agent to submit a consumer rights request on your behalf using the methods above, however, Streamlit will require the authorized agent to provide signed permission to submit the request on your behalf and may still contact you to confirm your identity and that this request was submitted with your permission.Streamlit does not discriminate against you for exercising your rights or offer you financial incentives related to the use of your personal information.9. Data retentionStreamlit retains the personal information we receive as described in this Privacy Notice for as long as you use our Services or Software or as necessar"
