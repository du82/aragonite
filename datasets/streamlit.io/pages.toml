ow) (“Consumers”), including any security notification requirements. If Provider Content faces (i) a breach of security requiring either notification to Consumers or a government agency; or (ii) a potential breach of security that may threaten the Service, then, in either event, Provider will promptly inform Company at security@snowflake.com.1.4 Provider Content.(a) The Service may allow Provider to store, process, or share content, such as code, data, text, files, images, audio, or video created as a web application and/or any other content or materials created or uploaded by or on behalf of Provider through the Service (“Provider Content”). For clarity, Provider Content also includes anything that Provider uploads or otherwise makes available or collects through the Service, including software and Authentication Secrets (as defined in Section 1.4(b) below), but excludes (i) Feedback (as defined in Section 1.7 below); and (ii) Provider’s information provided to Company for account creation/registration.(b) If Provider provides the Service authentication information or “secrets" (“Authentication Secrets”) to third party websites or resources for interoperation with or connection to Provider Content, Provider shall ensure the Authentication Secrets are (i) unique and not used for other accounts or services; (ii) complex and hard to guess; and (iii) frequently changed (i.e., at least every 90 days).(c) By making Provider Content available and/or accessible through the Service, Provider hereby grants to Company a non-exclusive, irrevocable, transferable, sub-licensable, worldwide, royalty-free license to use, display, publish, perform, reproduce, distribute, copy, modify, and create derivative works of Provider Content in connection with operating and providing the Service. Provider acknowledges and agrees that any Provider Content set to public can be viewed by others. See Share Your App and App Indexability for more information. Provider acknowledges and agrees that 