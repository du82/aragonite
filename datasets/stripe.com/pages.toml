title = "Stripe Climate"
description = "Stripe Climate allows you to remove carbon as you grow your business"
full_description = "Stripe Climate is the easiest way to help promising permanent carbon removal technologies launch and scale. Join a growing group of ambitious businesses that are changing the course of carbon removal. There are two ways to become an early buyer of carbon removal with Stripe Climate. All purchases are facilitated by Frontier, an advance market commitment to buy an initial $1B+ of permanent carbon removal by 2030. In just a few clicks, direct a percentage of your revenue to help the earliest-stage carbon removal companies in Frontier’s portfolio get out of the lab and into the field. This is the right choice for businesses that (i) care primarily about catalyzing the field and (ii) don’t need to buy a specific number of tons to meet a climate target. Pre-order a specific number of tons via the Stripe Dashboard or API. Tons will be supplied from Frontier's offtake portfolio. This is the right choice for businesses that (i) need to buy a specific number of tons to meet a climate target or (ii) want to offer carbon removal to their own customers. If you can make a multi-year, multi-million dollar commitment to buying carbon removal, consider joining Frontier as a member. You can also make a one-time contribution. To prevent the most catastrophic effects of climate change, we should aim to limit global average temperature increase to 1.5°C above pre-industrial levels, which corresponds to reducing global annual CO₂ emissions from about 40 gigatons per year as of 2018, to net zero by 2050. To accomplish this, the world will likely need to both radically reduce the new emissions we put into the air, and remove carbon already in the atmosphere. Existing carbon removal solutions such as reforestation and soil carbon sequestration are important, but they alone are unlikely to scale to the size of the problem. New carbon removal technologies need to be developed—ones that have the potential to be high volume and low cost by 2050—even if they aren’t yet mature. Today, carbon removal solutions face a chicken-and-egg problem. As early technologies, they’re more expensive, so don’t attract a critical mass of customers. But without wider adoption, they can’t scale production to become cheaper."
