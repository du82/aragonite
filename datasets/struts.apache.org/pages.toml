title = "Download a Release"
full_description = "Edit on GitHub Download a Release of the Apache Struts Full Releases Struts 7.0.0 Prior releases Verify the integrity of the files The Apache Struts web framework is a free open-source solution for creating Java web applications. You can start with Apache Struts using Apache Maven and optionally provided archetypes for easier dependency management and version upgrade. Or download some of the distributions for fully offline development. Use the links below to download a release of Apache Struts from one of our mirrors. You must verify the integrity of the downloaded files using signatures downloaded from our main distribution directory. Full Releases Struts 7.0.0 The Apache Struts 7.0.0 is an elegant, extensible framework for creating enterprise-ready Java web applications. It is available in a full distribution, or as separate library, source, example and documentation distributions. Struts 7.0.0 is the “best available” version of Struts in the 6.x series. Version Notes Source: struts-7.0.0-src.zip (6.8MB) PGP SHA256 SHA512 Full Distribution: struts-7.0.0-all.zip (70MB) PGP SHA256 SHA512 Example Applications: struts-7.0.0-apps.zip (35MB) PGP SHA256 SHA512 Essential Dependencies Only: struts-7.0.0-min-lib.zip (5.9MB) PGP SHA256 SHA512 All Dependencies: struts-7.0.0-lib.zip (25.5MB) PGP SHA256 SHA512 Documentation: struts-7.0.0-docs.zip (2.5MB) PGP SHA256 SHA512 Prior releases If you are looking for other versions than above please check the Apache Archive site. Verify the integrity of the files We recommend that you verify the integrity of the downloaded files using the PGP or MD5/SHA256 signatures. The PGP signatures can be verified using PGP or GPG. First download the KEYS as well as the asc signature file for the particular distribution. Make sure you get these files from the main distribution directory, rather than from a mirror. Then verify the signatures using % pgpk -a KEYS % pgpv ${filename}.tar.gz.asc or % pgp -ka KEYS % pgp ${filename}.tar.gz.asc or % gpg --import KEYS % gpg --verify ${filename}.tar.gz.asc ${filename}.tar.gz Alternatively, you can verify the MD5 signature on the files. A Unix program called md5 or md5sum is included in many Unix distributions. It is also available as part of GNU Textutils. Windows users can get binary md5 programs from here, here or here."
