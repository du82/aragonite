full_description = "Apache Struts Apache Struts is a free, open-source, MVC framework for creating elegant, modern Java web applications. It favors convention over configuration, is extensible using a plugin architecture, and ships with plugins to support REST, AJAX and JSON. Download Technology Primer Apache Struts 7.0.0 GA Apache Struts 7.0.0 GA has been releasedon 19 December 2024. Read more in Announcement or in Version notes Apache Struts 6.7.0 GA Apache Struts 6.7.0 GA has been releasedon 17 November 2024. Read more in Announcement or in Version notes CVE-2024-53677 File upload logic is flawed Upgrade to Apache Struts 6.4.0 at least and migrate to the new Action File Upload mechanism. Read more in Announcement or in the Security Bulletin S2-067 Google's Patch Reward program During SFHTML5 Google announced that they extend their program to cover the Apache Struts project as well. Now you can earn money preparing patches for us! read more Apache Struts 2.5.x EOL The Apache Struts Team informs about discontinuing support for Struts 2.5.x branch, we recommend migration to the latest version of Struts, read more in Announcement Keep in touch: Star Follow @TheApacheStruts"
