full_description = 'Edit on GitHub Apache Struts Releases The Apache Struts web framework is a free open-source solution for creating Java web applications. Releases of the Apache Struts framework are made available to the general public at no charge, under the Apache License, in both binary and source distributions. Full releases for current version are listed at Download page. Individual JARs are also made available through Apache Maven repositories, like ibiblio. General Availability (GA) Releases - Ready for Prime Time! Struts 7.0.0 ("best available") Extras - Additional plugins and quick-fix solutions! Struts Extras Snapshots - Get involved with the latest and greatest fixes and improvements The latest Apache Struts Snapshots from Jenkins CI Maven Snapshots are available from the Apache Maven Repository . Older Releases are available here Archive Site Project releases have been approved by the vote of the Apache Struts Project Management Committee. Support for a release is provided by project volunteers on the User mailing list. Additional free support is provided by many other volunteer subscribers to the list. Issues with a release may be discussed on the list and reported through the issue tracker. The user mailing list and issue tracker are the only support options hosted by the Apache Struts project. Why are some version numbers missing? Prior Releases As a courtesy, we retain archival copies of the website for releases that initially were considered "General Availability" but which has been reclassified as "Not recommended" since they contain security issues Release Release Date Vulnerability Version Notes Struts 6.7.0 17 November 2024 Version notes Struts 6.6.1 18 October 2024 Version notes Struts 6.6.0 10 August 2024 Version notes Struts 6.4.0 19 April 2024 Version notes Struts 6.3.0.2 7 December 2023 S2-067 Version notes Struts 6.3.0.1 13 September 2023 S2-067, S2-066 Version notes Struts 6.3.0 4 September 2023 S2-067, S2-066, S2-065 Version notes Stru