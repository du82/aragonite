title = "Commercial Support"
full_description = "Edit on GitHub Commercial support ASF support List of companies How to add a new company ASF support Please note that the Apache Software Foundation does not offer commercial support for Apache Struts or related applications. If you encounter issues or wish to propose changes, you can submit a change request and contribute code to the project. Ensure you meet the requirements specified here. List of companies Explore commercial support options for Apache Struts and JavaEE applications through the following companies. For detailed assistance, kindly reach out to them directly. Help us keep this list current; if you’re aware of other supportive companies, please share details with us. Last updated: 2024-12-23 SoftwareMill contact details: Apache Struts Consultancy hello@softwaremill.com phone: +48 22 188 11 33 (PL) +44 56 0156 3406 (UK) scope of support: consulting, Java & UI development, audit HeroDevs contact details: email: hello@herodevs.com phone: +1 877-586-1965 scope of support: Extended Long-Term Security Support for Apache Struts, CVE Remediation How to add a new company Create a Pull Request with the required information. A committer will review it, ensuring accuracy, or seek clarification. Alternatively, you can submit a request to the User Mailing list."
