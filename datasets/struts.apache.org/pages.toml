full_description = "Edit on GitHub << back to Tag Developers Guide Tag Reference Generic Tags UI Tag Reference Generic tags are used for controlling the execution flow when the pages render. These tags also allow for data extraction from places other than your action or the value stack, such as Localization , JavaBeans, and including additional URLs or action executions. Control Tags provide control flow, such as if, else, and iterator Data Tags allow for data manipulation or creation, such as bean, push, and i18n Please make sure you have read the Tag Syntax document and understand how tag attribute syntax works. Generic Tags Struts Generic Tags control the execution flow as pages render. Control Tags Data Tags Other Tags if a script elseif action link else bean append date generator debug iterator i18n merge include sort param subset property push set text url UI Tag Reference Struts UI Tags display data in rich and reusable HTML. Form Tags Non-Form UI Tags checkbox actionerror checkboxlist actionmessage combobox component datetextfield fielderror doubleselect head file form hidden inputtransferselect label optiontransferselect optgroup password radio reset select submit textarea textfield token updownselect"
