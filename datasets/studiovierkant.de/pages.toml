full_description = "The Lorenzstaffel was colourfully designed with 89 different colours. The colourful motif fits into the child-friendly environment to the adjacent children's playground. At the same time, it offers various interpretations in terms of content. The motif can be seen as a kind of digital weather map that addresses rising temperatures in particular and climate change in general. In this way, we want to draw attention to the fact that the consequences of global warming are massive and multifaceted and will affect the coexistence and existence of future generations. endanger. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
