full_description = "SatOne’s work is well known in the graffiti and art-world. As a side-project and as a reference to his roots in graffiti, he painted his logo in over 100 (mostly unpublished) variations all around the globe. In addition you can find interpretations of his logo by 17 renown graffiti-artists. We had the pleasure to design a book about this project, which also marks the ending of it. Our goal was to give each work the space it needs to stand for itself. A limited edition of 500 signed and numbered copies were released in December 2020. 284 pages and an embossed, white hot foil stamping on its hardcover. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
