["https://studiovierkant.de/en/graffiti-im-kessel"]
title = "Graffiti im Kessel – Studio Vierkant"
description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = '''We developed the design concept for the exhibition "Graffiti im Kessel", which was on show at the StadtPalais in Stuttgart. "WALLS I WALLS" is a cooperation project between the StadtPalais and the Kunstmuseum Stuttgart. While wall works are realised indoors at the Kunstmuseum, the focus at the StadtPalais is on graffiti art, which is mainly concerned with the design of walls outdoors. With a view to some relevant spots, the history of the past decades in Stuttgart's cauldron was documented on approx. 2,000 photos. A journey along the train line was simulated in an S-Bahn carriage, while the atmosphere of Stuttgart's underground could be traced in a walk-through tunnel on a section of track. Several wooden stelae with graffiti cut-outs illustrated different style variants in life-size and anonymous quotes on the floor thematised the many different reasons for graffiti sprayers. The exhibition ran from 26.09.2020 to 18.04.2021. For the Stadtpalais Stuttgart & Art Museum Stuttgart / Stuttgart , 2020 / With Bach&Bach, Matthias Wallot Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00'''
