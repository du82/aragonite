full_description = "Die Experimentierwelten in Rottweil bringt Kindern und jungen Erwachsenen auf spielerische Weise die Grundlagen der Physik und Mathematik bei. Um die inhaltlich vielschichtigen Themen der Einrichtung einzufangen, arrangierten wir mit dem Fotografen Thommy West ein Fotoshooting, indem mehrere Kinder mit für die Experimentierwelten symbolischen Gegenständen interagierten. Das dabei entstandene Foto wurde mit 3D-Animationen komplettiert und diente als Vorlage für die Bemalung. Gemeinsam mit Mathis Anvik setzten wir die fotorealistische Gestaltung in sechs Tagen um. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
