["https://studiovierkant.de/en/murals-san-leandro"]
title = "Hands of Change – Studio Vierkant"
description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "In San Leandro, we collaborated with “The Mural Co.“ and created four large-format murals. We made use of the number of walls and assigned each wall a season as the overarching theme. The seasons symbolize the processes of change on the one hand and the cycle of life on the other. Each wall has been assigned a color system suitable for the respective season. Interacting hands are seen as a central element within the different murals. These referred to the historical context of the Bay Area. From the indigenous people, to the era of industrial revolution and the digital age to an optimistic outlook for the future. Since the four murals are located on different sides of the building, it was important to us that each wall can stand on its own and also function as a full-fledged piece of work detached from the overall concept. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
