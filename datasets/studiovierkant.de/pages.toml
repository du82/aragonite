["https://studiovierkant.de/breaking-the-law"]
title = "Breaking the Law – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Das Buch »Breaking The Law« beschäftigt sich mit dem Thema Kriminalität. Anhand von Interviews mit Überzeugungstätern werden Einblicke in die Thematik gewährt. Entstanden sind Texte mit einem professionellen Dieb, einem Sprüher, einem Hooligan, einem Dealer, einem Banker und einem Tierrechtsaktivisten. Eingerahmt wurden die Interviews mit frei zugänglichen Texten und Stock-Fotos zu den jeweiligen Themen. So wird bewusst mit dem Kontrast zwischen Klischee und Realität gespielt. Ein symbolischer Gesetzbruch erfolgt bereits, bevor man das Buch das erste Mal aufschlagen kann. Das japanisch gebundene Buch ist in einem Schuber aus silberfarbenem Maschendrahtzaun verschlossen. Die Leser:innen müssen zunächst den Zaun zerstören um Zugang zum Inhalt zu bekommen. Der sichtbare Teil des Buches hat einen Umfang von 160 Seiten und wird von einem versteckten Teil über 138 Seiten ergänzt. Um sich die versteckten Seiten ansehen zu können, muss der Leser die Seiten zerschneiden und sich so symbolisch tiefer in den Fuchsbau begeben. »Breaking The Law« – ein Spiel mit Klischees und ein Einblick in eine Schattenwelt, die für die meisten von uns ein Buch mit sieben Siegeln ist. Limitiert auf 30 Stück. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
year_published = 2025
