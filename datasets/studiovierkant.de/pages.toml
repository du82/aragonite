["https://studiovierkant.de/oesterreichischer-platz"]
title = "Österreichischer Platz – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Im Herzen von Stuttgart, am Österreichischen Platz, haben wir ein ehemaliges Parkhaus in einen lebendigen Ort für Sport und Bewegung verwandelt. Ziel war es, die düsteren und dunklen Bereiche in bunte, einladende und freundliche Räume zu transformieren und die Besucher zur aktiven Bewegung anregen. Um dies zu erreichen, setzten wir auf spielerische und bolde Typografie, die durch die Technik der Anamorphose so im Raum platziert wurde, dass sie von einem bestimmten Standpunkt aus unverzerrt gelesen werden kann. Verschiedene Wörter wie “MOVE” und “REPEAT” sind auf den Boden, die Wände und die Decke gemalt, um dynamische Botschaften zu vermitteln. Zusätzlich bereicherten wir die Komposition mit Hintergrundelementen und zahlreichen Mustern im Graffiti-Stil, um eine lebendige und energiegeladene Atmosphäre zu schaffen. So entstand ein Ort, der nicht nur funktional ist, sondern auch durch seine künstlerische Gestaltung inspiriert und motiviert. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
