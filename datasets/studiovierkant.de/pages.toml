["https://studiovierkant.de/en/breaking-the-law"]
title = "Breaking the Law – Studio Vierkant"
description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "The book »Breaking The Law« deals with the subject of crime. Based on interviews with convicting perpetrators, insights into the topic are given. This book is filled with texts about a professional thief, a sprayer, a hooligan, a dealer, a banker and an animal rights activist. The interviews were paired with free, accessible texts and stock photos on the respective topics. The contrast between cliché and reality is deliberately played with. The Japanese-bound book is locked in a slipcase made of silver-colored chain link fence, which has to be destroyed to gain access to the content. Before the book can be opened, the reader has to symbolically break the law by cutting through the fence. The visible part of the book consists of 160 pages and is supplemented by a hidden part of 138 pages. In order to look at the hidden pages, the reader has to cut up the pages. »Breaking the Law« – Plays with clichés and gives an insight into a shadowy world. Limited to 30 copies. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
