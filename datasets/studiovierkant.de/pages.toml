["https://studiovierkant.de/graffiti-im-kessel"]
title = "Graffiti im Kessel – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Wir entwickelten das Gestaltungskonzept für die Ausstellung »Graffiti im Kessel«, die im StadtPalais in Stuttgart zu sehen war. »WÄNDE I WALLS« ist ein Kooperationsprojekt zwischen dem StadtPalais und dem Kunstmuseum Stuttgart. Während im Kunstmuseum Wandarbeiten im Innenraum realisiert werden, liegt der Fokus im StadtPalais auf der Graffitikunst, die sich vor allem mit der Gestaltung von Wänden im Außenbereich befasst. Mit Blick auf einige einschlägige Spots wurde die Geschichte der vergangenen Jahrzehnte im Stuttgarter Kessel auf ca. 2.000 Fotos dokumentiert. In einem S-Bahn-Waggon wurde eine Fahrt entlang der Zugstrecke simuliert, während in einem begehbaren Tunnel auf einem Gleisanschnitt der Atmosphäre des Stuttgarter Untergrunds nachgespürt werden konnte. Mehrere Holzstehlen mit Graffiti-Ausschnitten veranschaulichten unterschiedliche Style-Varianten in Lebensgröße und anonyme Zitate thematisierten auf dem Fußboden die vielfältigen Antriebsgründe von Graffitisprüher*innen. Die Ausstellung lief vom 26.09.2020 bis zum 18.04.2021. Für das Stadtpalais Stuttgart & Kunstmuseum Stuttgart / Stuttgart , 2020 / Mit Bach&Bach, Matthias Wallot Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
year_published = 2025
