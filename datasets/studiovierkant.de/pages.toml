full_description = "Die Aerosol Alliance ist eine Gruppe von Graffitikünstler*innen, Umweltexpert*innen, Organisator*innen und Kurator*innen, die sich für die Verwendung von Sprühdosen begeistern. Gleichzeitig ist man sich über die negativen Auswirkungen, die die Verwendung von Spraydosen auf unsere Umwelt und unsere Gesundheit hat bewusst. Das Ziel der Alliance ist es, ein Bewusstsein in der Sprühfarbenindustrie ein Bewusstsein zu schaffen und diese Auswirkungen zu verringern. Für das Projekt gestalteten wir die Identität, die Farbwelt, den Social Media-Auftritt und die Website. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
