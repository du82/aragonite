["https://studiovierkant.de/murals-san-leandro"]
title = "Hands of Change – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "In San Leandro entstanden in Zusammenarbeit mit »The Mural Co.« vier großformatige Murals. Das Gestaltungskonzept umfasste zwei Handlungsstränge. Wir machten uns die Anzahl der Wände zu nutze und teilten jeder Wand eine Jahreszeit als übergeordnetes Thema zu. Die Jahreszeiten symbolisieren dabei zum einen Veränderungsprozesse und zum anderen den Kreislauf des Lebens. Jeder Wand wurde einem zur jeweiligen Jahreszeit passenden Farbsystem zugeordnet. Als zentrales Element innerhalb der unterschiedlichen Murals waren interagierende Hände zu sehen. Diese nahmen Bezug auf den historischen Kontext der Bay Area. Von den indigenen Menschen über die Epoche der Industrialisierung, das Digitale Zeitalter bis hin zu einem optimistischen Ausblick in die Zukunft wurden verschiedene Abschnitte der lokalen Geschichte dargestellt. Da sich die vier Murals auf verschiedenen Seiten des Gebäudes befinden war es uns wichtig, dass jede Wand auch für sich stehen kann und auch losgelöst vom Gesamtkonzept als vollwertige Arbeit funktioniert. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
year_published = 2025
