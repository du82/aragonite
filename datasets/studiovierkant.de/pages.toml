title = "Lorenzstaffel – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Die Lorenzstaffel wurde mit 89 verschiedenen Farben bunt gestaltet. Das farbenfrohe Motiv passt sich in die kinderfreundliche Umgebung zum angrenzenden Kinderspielplatz an. Gleichzeitig bietet es verschiedene inhaltliche Interpretationen. Man kann das Motiv als eine Art digitale Wetterkarte sehen, welche die steigenden Temperaturen im Besonderen und den Klimawandel im Allgemeinen thematisiert. Auf diese Weise möchten wir darauf aufmerksam machen, dass die Folgen der globalen Erwärmung massiv und vielfältig sind und das Zusammenleben und die Existenz zukünftiger Generationen gefährden. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
