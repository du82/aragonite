["https://studiovierkant.de/en/walls-of-vision"]
title = "Walls of Vision – Studio Vierkant"
description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = '''In the summer of 2022, we painted a façade in our neighbourhood in Stuttgart-Nord. Édouard Manet's work "Le Chemin de fer" ("The Railway") served as the basis, both in terms of the motif and the painting technique. Here, the original motif was altered. The struts of the fence were bent to visualise the process of change. In the background is a more abstract composition inspired by Robert Delaney's "Window Picture". By replacing the background of the Manet artwork with a non-representational work, the new visual language conveys an exciting mix of different painting styles and eras. The new overall work leaves room for interpretation. Is the future open or closed to youth? Is the future a "blind spot" or a "blank sheet of paper"? Do the different generations act together or against each other? With WALLS OF VISION, the non-profit Dr. Hans Riegel Foundation aims to preserve historical works of art or keep them up to date, make them accessible to a broad public free of charge and inspire young people for the visual arts. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00'''
year_published = 2025
