["https://studiovierkant.de/europaplatz-tuebingen"]
title = "Europaplatz Tübingen – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Im Zuge der Neugestaltung des ZOB / Europaplatz in Tübingen wurde im Frühjahr 2024 eine 7000 qm große Fläche freigelegt. Diese Fläche soll in den kommenden Jahren zunächst beplant und anschließend bebaut werden. Für die Interimszeit wurde ein Masterplan für eine vielseitige Zwischennutzung entwickelt, der ein breites Spektrum an Nutzungsmöglichkeiten für Aneignung und Teilhabe bietet. Der temporäre Plan umfasst eine Bühne für Konzerte und Events, mehrere Spiel- und Sportfelder, Sitz- und Aufenthaltsmöglichkeiten, einen Kletter-Parcours, eine Outdoor-Galerie und den 2021 entstandenen Aussichtspunkt “Ausguck”. Darüber hinaus wurden zwei große bepflanzte Einschnitte in die asphaltierte Fläche integriert und ein Hopfen-Hain installiert, um die Aufenthaltsqualität insbesondere in den Sommermonaten zu verbessern. Durch verschiedene Bodenbemalungen setzten wir künstlerische Akzente, die über den gesamten Platz verteilt sind. Ein asymmetrischer Zebrastreifen weist den schnellsten Weg zum Tübinger ZOB, während ein Basketball- und Badmintonfeld aus geometrischen Mustern zur sportlichen Betätigung einlädt. Verschiedene Farbpunkte und -flächen markieren zudem Orte zum Verweilen und Entspannen. Dieser kreative und funktionale Ansatz zur Zwischennutzung des Europaplatzes schafft Raum für Aktivitäten und Begegnungen und erhöht auch die Attraktivität und Lebensqualität des öffentlichen Raums. Für: Stadt Tübingen / Projekt-Konzeption: BHM Planungsgesellschaft, Umschichten und Stadtraumstrategien / Umsetzung und Realisierung des Gesamtprojekts: Umschichten, Phil Farmer, Atelier Blattmacher, Studio Vierkant / Beteiligte Gewerke: Heim Grünanlagenbau / Jahr: 2024 Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr"
year_published = 2025
clearnet = "https://studiovierkant.de/europaplatz-tuebingen"
