full_description = "2022 fand an den Wagenhallen das Container City Festival statt. Zum Ende des Jahres musste die Fläche geräumt und an die Stadt zurückgegeben werden, da dort die ersten Bauvorhaben des neuen Rosensteinquartiers realisiert wurden. Um das Kulturschutzgebiet und seine Container City nochmal ins Zentrum der Aufmerksamkeit zu rücken, organisierte der Kunstverein Wagenhalle ein buntes Programm zum Zuschauen und Mitmachen. Hierfür gestalteten wir Plakate, Flyer – welche die Veranstaltung bewarben – sowie T-Shirts, die zur Erinnerung an die Container City an dem Wochenende angeboten wurden. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
