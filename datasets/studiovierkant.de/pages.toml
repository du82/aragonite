["https://studiovierkant.de/gemeinde-lauterbach"]
title = "Gemeinde Lauterbach – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Für die Wandgestaltung einer Stützwand gegenüber einer Kita haben wir das Motiv so gestaltet, dass Kinder mit der Motivwelt interagieren können. Hierfür verwendeten wir klare und kräftige Farben. Die geometrischen Formen bestehen aus Rechtecken, Quadraten, Kreisen und Dreiecken, da Kinder diese Grundformen von ihren Holzbausteinen kennen. Im Bild verteilt sind verschiedene Buchstaben versteckt, die entdeckt werden können. Eine Zeichnung im Stile einer händischen Kinderzeichnung zeigt eine Landschaft mit verschiedenen Objekten. Ein Kind in einem Bagger erbaut hierbei das Hauptmotiv in Form von abstrahierten Bausteinen frei nach dem Motto: »Ich mal mir die Welt, wie sie mir gefällt«. Für die Gestaltung einer Sportplatzwand in Lauterbach haben wir uns aus der Motivwelt des Fußballs bedient. In der bunten Collage finden sich Elemente der Linienmarkierung von Fußballplätzen, Tornetzen und Trikotnummern. Zusätzlich sind verschiedene eingezoomte Bereiche von LED-Anzeigetafeln dargestellt. Zusätzlich befinden sich im Motiv bunte Muster, die von Fußballtrikots inspiriert sind. Die Gestaltung steht für eine bunte Vielfalt und gemeinsames Miteinander im Sport. Wir gestalteten die Arkadenwand der Stadt Lauterbach im Schwarzwald. Gemeinsam wurde mit dem Rottweiler Künstler und Grafikdesigner Robert Hak eine Interpretation des Künstlers Wilhelm Kimmich auf die Neuzeit umgemünzt. Die Wand dient einerseits als Hommage an den aus der Gegend stammenden Kimmich, sowie als Werbung für die sanierte, gleichnamige Galerie. Für ein interessantes Gesamtbild wurden verschiedene Ausschnitte aus Kimmichs Werken neu interpretiert und in einer Farbpalette umgesetzt, die aus den Originalgemälden extrahiert wurde. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr"
year_published = 2025
clearnet = "https://studiovierkant.de/gemeinde-lauterbach"
