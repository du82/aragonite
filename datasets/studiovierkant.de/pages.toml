full_description = "SatOne’s REPRODUCTION ist eine Art Reisetagebuch aus den letzten acht Jahren. Es dokumentiert über Einhundert Variationen seines Logos, die er über den gesamten Globus verstreut gemalt hat. Dabei setzte sich der Münchner Künstler intensiv mit den Merkmalen der jeweiligen kulturellen Kontexte auseinander. Die in diesem Buch vorgestellten SatOne-Logos zeigen, wie vielfältig ein Werk in ständiger Spannung zwischen Reproduktion und Singularität sein kann. Unser Ziel war es, jeder Arbeit in dem Buch den Platz einzuräumen, den sie benötigt um auch für sich allein stehen zu können. Das heißfoliengeprägte Hardcover-Buch umfasst 284 Seiten und ist auf 500 signierte Exemplare limitiert. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
