["https://studiovierkant.de/hws-top-die-wurst-liegt"]
title = "HWS – Top, die Wurst liegt – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Wir gestalteten ein Buch für die legendäre HWS-CREW, die Teil der zweiten Generation der Stuttgarter Graffiti-Szene ist und die Stadt maßgeblich geprägt hat. Die Crew legte die Messlatte sowohl qualitativ als auch quantitativ immer höher. Nach über 30 Jahren dokumentiert dieses Buch nun das Schaffen der Gruppe von 1987 bis heute auf 368 Seiten mit 648 Fotos. Es zeigt die Vielfalt des Writings mit Zügen, Bombings, Line-Produktionen und legalen Flächen und beleuchtet die engen Kontakte nach Basel und Bern sowie prägende Reisen der Crew. Mit Unterstützung des Schriftstellers Projekt_55 enthält das Buch ausführliche Textbeiträge, ein Interview und zahlreiche Anekdoten. Leser tauchen in eine Zeit ohne Handys und Internet ein, als man von Stuttgart noch nach München, Dortmund oder Basel reisen musste, um sich Graffiti anzusehen. Während die Crewmitglieder zu Erwachsenen wurden und ihre Haare langsam grau wurden, waren die grauen Wände der Stadt bunt geworden. Nachfolgende Generationen der Stuttgarter Writer*Innen mussten sich damit auseinandersetzen, dass freie Flächen selten wurden. Erscheinungsjahr: 2024 / Akteure: HWS CREW / Infos: Hardcover, Fadenbindung, 368 Seiten, 25×28,5cm, Blindprägung / Literarische Begleitung: Projekt_55 / Gestaltung: Studio Vierkant / Sprache: Deutsch / Herausgeber: Studio Vierkant Press / Druck: Offizin Scheufele / Auflage: 600 Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
