full_description = 'At Untertürkheim station, we designed several walls with an analogue vector grid. In the area of platform 6, a SLOW DOWN lettering was created using geometric shapes. The message is intended to encourage passengers to pause for a moment in the hectic pace of everyday life and to walk through the world with an open eye for their surroundings. In the opposite part of the station, a closer look reveals "Homebound" lettering. Here, too, the design is composed of the same modular principle of different geometric shapes. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00'
