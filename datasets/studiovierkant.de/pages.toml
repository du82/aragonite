full_description = "The Aerosol Alliance is a group of graffiti artists, environmental experts, organisers and curators who are passionate about the use of spray cans. At the same time, they are aware of the negative impact that the use of spray cans has on our environment and our health. The aim of the Alliance is to raise awareness in the spray paint industry and reduce these impacts. For the project, we designed the identity, the colour scheme, the social media presence and the website. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
