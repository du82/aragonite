full_description = "Das frühere Gelände des Farben- & Lackherstellers AkzoNobel wurde für vier Wochen von Kreativen auf links gedreht, bevor die Gebäude ihre letzte Reise antreten. In Zusammenarbeit mit Wöhr + Bauer, dem Kulturamt, der Wirtschaftsförderung der Stadt Stuttgart und ca. 70 Künstler*innen ist das ehemalige Industrieareal zu einer temporären Galerie umgenutzt worden. Wir kursierten und organisierten das gesamte Projekt. Nach Abschluss aller Arbeiten fand eine Vernissage auf dem Gelände statt. Neben dem offiziellen Teil mit einer Rede von Kulturamtsleiter Marc Gegenfurtner, gab es eine Performance des Citizen.KANE.Kollektivs und einen Film von Cite-Online zu sehen. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
