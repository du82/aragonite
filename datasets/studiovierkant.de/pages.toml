full_description = 'In collaboration with Marc Dasing, we designed the book "Mehr Hallen wagen! The Wagenhalle Art Association - a snapshot". It documents the optimal conditions at the Wagenhallen: sufficient space and area at favourable prices and longstanding tolerance of use in a kind of self-responsibility. More than 50 artists and creatives from a wide range of fields offer insights into their studios, workspaces and workshops before some of these spaces were to disappear forever in the course of a renovation. Since we ourselves are at home with our studio at the Wagenhallen, this project had a special significance for us. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00'
