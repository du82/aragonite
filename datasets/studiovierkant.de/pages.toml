full_description = "The Experimentierwelten in Rottweil teaches children and young adults the basics of physics and mathematics in a playful way. In order to capture the complex themes of the facility, we arranged a photo shoot with photographer Thommy West in which several children interacted with objects symbolic of the Experimentierwelten. The resulting photo was completed with 3D animations and served as a template for the painting. Together with Mathis Anvik, we realised the photo-realistic design in six days. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
