full_description = "Im Bahnhof in Untertürkheim gestalteten wir mehrere Wände mit einem analogen Vektorgrid. Im Bereich zu Gleis 6 entstand so mittels geometrischer Formen ein SLOW DOWN Schriftzug. Die Message soll die Fahrgäste dazu anhalten, in all der Hektik des Alltags auch einmal inne zu halten und mit einem offenen Auge für die Umgebung durch die Welt zu laufen. So kann man auch im gegenüberliegenden Teil des Bahnhofs bei genauerem Hinsehen einen “Homebound“-Schriftzug entziffern. Auch hier setzt sich die Gestaltung aus dem selben Baukastenprinzip aus verschiedenen geometrischen Formen zusammen. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
