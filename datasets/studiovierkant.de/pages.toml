["https://studiovierkant.de/en/europaplatz-tuebingen"]
title = "Europaplatz Tübingen – Studio Vierkant"
description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Im Zuge der Neugestaltung des ZOB / Europaplatz in Tübingen wurde im Frühjahr 2024 eine 7000 qm große Fläche freigelegt. Diese Fläche soll in den kommenden Jahren zunächst beplant und anschließend bebaut werden. Für die Interimszeit wurde ein Masterplan für eine vielseitige Zwischennutzung entwickelt, der ein breites Spektrum an Nutzungsmöglichkeiten für Aneignung und Teilhabe bietet. Der temporäre Plan umfasst eine Bühne für Konzerte und Events, mehrere Spiel- und Sportfelder, Sitz- und Aufenthaltsmöglichkeiten, einen Kletter-Parcours, eine Outdoor-Galerie und den 2021 entstandenen Aussichtspunkt “Ausguck”. Darüber hinaus wurden zwei große bepflanzte Einschnitte in die asphaltierte Fläche integriert und ein Hopfen-Hain installiert, um die Aufenthaltsqualität insbesondere in den Sommermonaten zu verbessern. Durch verschiedene Bodenbemalungen setzten wir künstlerische Akzente, die über den gesamten Platz verteilt sind. Ein asymmetrischer Zebrastreifen weist den schnellsten Weg zum Tübinger ZOB, während ein Basketball- und Badmintonfeld aus geometrischen Mustern zur sportlichen Betätigung einlädt. Verschiedene Farbpunkte und -flächen markieren zudem Orte zum Verweilen und Entspannen. Dieser kreative und funktionale Ansatz zur Zwischennutzung des Europaplatzes schafft Raum für Aktivitäten und Begegnungen und erhöht auch die Attraktivität und Lebensqualität des öffentlichen Raums. Für: Stadt Tübingen / Projekt-Konzeption: BHM Planungsgesellschaft, Umschichten and Stadtraumstrategien / Umsetzung und Realisierung des Gesamtprojekts: Umschichten, Phil Farmer, Atelier Blattmacher, Studio Vierkant / Beteiligte Gewerke: Heim Grünanlagenbau / Jahr: 2024 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00"
year_published = 2025
clearnet = "https://studiovierkant.de/en/europaplatz-tuebingen"
