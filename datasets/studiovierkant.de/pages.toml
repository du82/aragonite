full_description = "The former site of the paint & varnish manufacturer AkzoNobel was turned inside out by creatives for four weeks before the buildings embarked on their final journey. In collaboration with Wöhr + Bauer, the The former industrial site has been transformed into a new cultural centre with the help of the Stuttgart Department of Culture, the City of Stuttgart's Economic Development has been converted into a temporary gallery. We circulated and organised the whole project. After all the work was completed, a vernissage took place on the grounds. In addition to the official part with a speech by the head of the cultural office Marc Gegenfurtner, there was a performance by the Citizen.KANE.Kollektiv and a film by Cite-Online. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
