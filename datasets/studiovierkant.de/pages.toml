["https://studiovierkant.de/info-kontakt"]
title = "Info – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Studio Vierkant wurde von Philipp Becker, Jan Ducks und Georg Waibel gegründet und ist seit Anfang 2020 an den Wagenhallen im Stuttgarter Norden zuhause. Seit 2023 ist Michel Balke ein weiteres Bestandteil des Teams. Wir gestalten Identitäten und Konzepte im Print- und Digitalbereich. Ebenso arbeiten wir an Wandbildern oder großen Fassadengestaltungen. Weitere Arbeitsfelder liegen in der Ausstellungsgestaltung, der Kuration und Künstlervermittlung sowie bei beratenden Tätigkeiten im Themenfeld Urbane Kunst. Interdisziplinäre Projekte interessieren uns im Besonderen. Zweimal im Jahr besteht die Möglichkeit für ein sechsmonatiges Praktikum. Beginn ist zum 01. September und zum 01. März. Das Praktikum ist bezahlt und richtet sich hauptsächlich (nicht nur ;)) an Kommunikationsdesign-Studierende. Schickt euer Portfolio an internship@studiovierkant.de. Ehemalige und aktuelle Praktikant*innen: Mitra Asghari, Audrey Delacroix, Amelie Kress, Laurin Stemmann & Sebastian Heß. Uns ist es wichtig für jedes Projekt die Zeit einzuplanen, die eine qualitativ hochwertige Umsetzung benötigt. Da wir viele Anfragen bekommen ist es sinnvoll frühzeitig mit uns in Kontakt zu treten, damit wir einen Zeitrahmen für das Projekt blocken können. Um ein detailliertes Angebot erstellen zu können benötigen wir eine möglichst präzise Beschreibung der Aufgabenstellung, der Zielsetzung des Projekts, eine Liste der zu bespielenden Medien, bei einer Wandgestaltung die Maße der Fläche und eine Beschreibung der Oberflächenbeschaffenheit (idealerweise Fotos der Fläche), den gewünschten Umsetzungszeitraum und weitere projektrelevante Informationen. Wir arbeiten nur mit den besten verfügbaren Materialien um eine möglichst lange Haltbarkeit unserer Arbeit zu gewährleisten. Allerdings sind unsere Arbeiten im Außenbereich vielen unterschiedlichen Faktoren, wie Wasser, Sonnenstrahlung, Feinstaub und auch teilweise physischen Eingriffen, ausgesetzt. Aufgrund von UV-Strahlung bleichen bestimmte Farben schneller aus als andere. Es gibt jedoch die Möglichkeit durch UV-blockende Schutzschichten den Alterungsprozess dieser besonders UV-aktiven Farben zu verlangsamen."
year_published = 2025
