["https://studiovierkant.de/en/info-kontakt"]
title = "Info – Studio Vierkant"
description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Studio Vierkant was founded by Philipp Becker, Jan Ducks and Georg Waibel and has been based at the Wagenhallen in the north of Stuttgart since the beginning of 2020. Michel Balke has been another member of the team since 2023. We design identities and concepts in the print and digital sector. We also work on murals and large façade designs. Other fields of work include exhibition design, curation and artist mediation as well as consulting activities in the field of urban art. We are particularly interested in interdisciplinary projects. Twice a year there is the opportunity for a six-month internship. The internship starts on 01 September and 01 March. The internship is paid and is mainly (not only ;)) aimed at communication design students. Send your portfolio to internship@studiovierkant.de. Former and current interns: Mitra Asghari, Audrey Delacroix, Amelie Kress, Laurin Stemmann & Sebastian Heß. It is important for us to plan the time needed for a high-quality implementation of each project. As we receive many enquiries, it makes sense to contact us early so that we can block out a time frame for the project. In order to be able to prepare a detailed offer, we need a precise description of the task, the objective of the project, a list of the media to be covered, in the case of a wall design the dimensions of the surface and a description of the surface condition (ideally photos of the surface), the desired implementation period and other information relevant to the project. We only work with the best materials available to ensure that our work lasts as long as possible. However, our outdoor work is exposed to many different factors, such as water, solar radiation, fine dust and also sometimes physical interference. Due to UV radiation, certain colours fade faster than others. However, it is possible to slow down the ageing process of these particularly UV-active colours by applying UV-blocking protective coatings. We use facade paints for most projects. This has advantages in terms of the sustainability of the work, but also in terms of durability. Facade paints also provide a uniform finish. We try to reduce the use of foils and spray paints and only use these materials as selectively as possible to minimise the environmental impact of our work."
