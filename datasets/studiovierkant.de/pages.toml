description = "Technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a particular service explicitly requested by the subscriber or user or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Seit 2022 verfolgt die Deutsche Bahn einen nachhaltigen Gesamtansatz bei der Sanierung in die Jahre gekommener Bahnhöfe. Im Mittelpunkt steht dabei die Betrachtung des Bahnhofs als Einheit, ohne die Aufteilung in unterschiedliche Aspekte. Die Planung und Umsetzung werden durch ein zentrales Projektmanagement koordiniert. Im Rahmen dieses neuen Ansatzes, der auch Wandgestaltungen berücksichtigt, entstand eine unaufdringliche Deckengestaltung, die sich harmonisch in das Gesamtdesign des Bahnhofs einfügt. Die Motive sind inspiriert von der reichen Bildwelt der Kur- und Thermenstadt Bad Oeynhausen und empfangen die Ankömmlinge am Bahnhof mit beruhigenden Pastelltönen. Diese künstlerische Gestaltung schafft eine einladende Atmosphäre und verbindet den Bahnhof auf subtile Weise mit der Identität der Stadt. Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/ Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 Studio Vierkant/Balke Becker Ducks Waibel GbR-info@studiovierkant.de+49 (0) 176 5653 5885Mon - Fri / 09:00 - 17:00 STUDIO SQUAREInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Monday to Friday / 09:00 - 17:00"
