["https://studiovierkant.de/walls-of-vision"]
title = "Walls of Vision – Studio Vierkant"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Im Sommer 2022 bemalten wir eine Fassade in unserer Nachbarschaft in Stuttgart-Nord. Édouard Manets Werk “Le Chemin de fer” (“Die Eisenbahn”) diente als Grundlage, sowohl was das Motiv als auch was die Maltechnik betrifft. Hierbei wurde das ursprüngliche Motiv abgeändert. Die Streben des Zauns wurden verbogen, um den Prozess der Veränderung zu visualisieren. Im Hintergrund befindet sich eine eher abstrakte Komposition, inspiriert durch das “Fensterbild” von Robert Delaney. Indem der Hintergrund des Manet-Kunstwerks durch ein ungegenständliches Werk ersetzt wurde, vermittelt die neue Bildsprache eine spannende Mischung aus verschiedenen Malstilen und Epochen. Das neue Gesamtwerk lässt Raum für Interpretationen. Ist die Zukunft für die Jugend offen oder verschlossen? Ist die Zukunft ein “blinder Fleck” oder ein “weißes Blatt Papier”? Agieren die verschiedenen Generationen gemeinsam oder gegeneinander? Mit WALLS OF VISION will die gemeinnützige Dr. Hans Riegel-Stiftung historisches Kunstgut bewahren bzw. aktuell halten, einem breiten Publikum kostenlos zugänglich machen und junge Menschen für die bildende Kunst begeistern. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
year_published = 2025
