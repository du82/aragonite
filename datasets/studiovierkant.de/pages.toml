full_description = "Um das Mural-Festival analog zu dokumentieren erscheint jährlich eine Publikation. In dieser werden die beteiligten Künstler*innen vorgestellt, das Projekt und seine Facetten erklärt, der Gestaltungsprozess begleitet und O-Töne von Beteiligten ihren Platz finden. Darüberhinaus kommen in jeder Ausgabe verschiedene Expert*innen oder Journalist*innen zu Wort, die passende Artikel zu den Themenbereichen Kunst, Kultur und Graffiti beisteuern. Die Texte im Journal sind zweisprachig, auf Deutsch und auf Englisch. Gestalterisch orientiert sich die Publikation an der Gestaltung des Festivals. Das Journal erscheint in einer Auflage von 650 Stück. 200 Exemplare werden jedes Jahr zurückgehalten, damit im Jahr 2025 ein Schober mit den 4 verschiedenen Editionen befüllt werden kann. Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/ Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr Studio Vierkant/Balke Becker Ducks Waibel GbR—info@studiovierkant.de+49 (0) 176 5653 5885Mo – Fr / 09:00 — 17:00 Uhr STUDIO VIERKANTInnerer Nordbahnhof 270191 Stuttgartinfo@studiovierkant.de+49 (0) 176 5653 5885Montag bis Freitag / 09:00 — 17:00 Uhr"
