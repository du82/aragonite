full_description = "Kerfuffle on the Planet of the Apes Kingdom of the Planet of the Apes is out and I decided to update one of my responsive easter egg headers—Kerfuffle on the Planet of the Apes—with more efficient, modern code. CSS Specisithity Originally published in 2005 and updated in 2024, CSS Specisithity explains how to master specificity using Star Wars metaphors. It’s been credited with helping web designers and developers understand what’s often considered a complex subject. The popular Contract Killer template Clarify what’s expected on both sides to help build great relationships between you and your clients. Contract Killer is plain and simple and there’s no legal jargon. It’s customisable to suit your business and has been used on countless web projects since 2008. Killer Privacy General Data Protection Regulation (GDPR) templates can cost hundreds of Pounds, so I thought I’d turn my hand to writing a GDPR data protection and privacy policy in the spirit of Contract Killer. Be compliant without bamboozling customers. Layout Love I wanted a simple set of layout modules I could call on for design projects, so I developed my own. I call them Layout Love and rather than keep them to myself, I’m offering them to everyone to use which I hope will encourage people to make layouts which are more interesting. Transcending CSS Revisited I wrote my first book, Transcending CSS: The Fine Art of Web design, way back in 2006. It became a success and since then I’ve had countless people tell me it was influential in their careers. Transcending CSS Revisited is available to read online for free, with a new foreword by Rachel Andrew. February 4th, 2025 Upgrade your Squarespace layouts using CSS Container Queries Yours truly over at the SQSP Themes blog. “CSS Media Queries already make Squarespace websites responsive, but there will frequently be times when you’ll need to make elements responsive to their containers, not just to the viewport. Thankfully, CSS Container Queries are now widely implemented in browsers, and there are ways to use them on Squarespace websites.”"
