full_description = "October 16th, 2024 Podcast: One Footer in the Grave Episode 16: Contorted in a Nissan Qashqai Back after their summer break, the four chaps decide whether each other’s improbable stories are a lie or the truth. Jon talks about his new car, Andy brings up his gout, and neither are at all cross about Paul and Marcus restarting the Boagworld podcast. This episode of One Footer in the Grave is appropriately sponsored by Allopurinol, the gout medication for when your big toe hurts like a b@stard. July 3rd, 2024 Podcast: One Footer in the Grave Episode 15: Vote for me or the baby gets it It’s UK General Election time and the chaps have gathered to discuss it, but without mentioning politics. What would their top policies be if they were running for office? What do they think of novelty candidates like Count Binface? Plus, why are political party websites so terrible? Andy tells his story about being in the audience for BBC Question Time and the strange tale of designing for an intergalactic space warrior. May 24th, 2024 Podcast: One Footer in the Grave Episode 14: Scarlett Johansson is in the room Andy, Jon, Marcus, and Paul are back—sooner than expected—for another fun-packed episode. They talk about who’s voice they’d each like as an AI companion, Apple,Apple’s new iPads and why devices are now so thin that they crack when Andy sits on them. Then, inevitably, they discuss what they think about the new Dr Who. April 24th, 2024 One Footer in the Grave Episode 13: Votre saucisse est très plastique The nerds of a feather are back for another episode. They talk about whether social media is now either dead or useless for promoting our work and whether old-fashioned email is replacing it. Paul explains his monthly newsletter strategy and how, for him, it’s replaced social media. Then, the boys discuss what they should do next, as they ’ ve (obviously) reached the pinnacle of their careers. August 16th, 2021 One Footer in the Grave Episode 4: Wrapped in disappointment After Paul Boag and Marcus Lillington retired their Boagworld podcast, the pair, Jon Hicks and I decided to record a new show. We’re not just experienced podcast wafflers, we’re all “of a certain age,” so we called the new show One Footer in the Grave."
