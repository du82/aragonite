["https://stuttgarter-kickers.de/fans/kampagnen-digitales/kampagnen"]
title = "Fan-Kampagnen - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = 'FansKickers-Kampagnen in Zusammenarbeit mit FansBelieve in BlueBelieve in Blue heißt das erfolgreichste Projekt der Stuttgarter Kickers der letzten Jahre. Das im November 2007 entstandene Projekt, welches in einem Arbeitskreis der Vereinsoffiziellen der Stuttgarter Kickers und engagierten Fans entstand ist, basierte auf einer aus insgesamt einer Million Pixel bestehenden Internetseite (www.believe-in-blue.de). Diese war in 10 000 Quadrate (10×10 Pixel) unterteilt. Diese Quadrate, oder auch Kickers-Bausteine genannt, konnten von den vielen Kickers-Fans, Firmen und Gönnern bis Ende 2012 erworben werden. Unter allen Baustein-Zeichnern wurden wertvolle Preise verlost, unter anderem ein Fiat Panda von Auto Palazzo. Über die letzten Jahre entstanden das Fußball-Freizeitturnier "Believe-in-Blue-Cup" im SoccerOlympFellbach und sowie Dart-, Poker- und Tischkicker-Turniere zu Gunsten der Believe in Blue - Kampagne. Die Kampagne wurde nun im November 2016 mit ganz viel Herz unter dem Motto „Believe in Blue – nur gemeinsam“ fortgesetzt. Denn egal wo Du herkommst oder wer Du bist – wenn die Stuttgarter Kickers Dir eine Herzensangelegenheit sind, dann konntest Du Dir für 189,90 € Deinen eigenen Namen auf dem Herzen der Blauen sichern. Dieses Herz befand sich in der Mitte des Trikots der Stuttgarter Kickers, welches die Spieler der 1. Mannschaft bei einem Spiel getragen haben. Unter der Aktions-Homepage www.believe-in-blue.de findet ihr alle Informationen. Gerne könnt ihr uns per E-Mail an believe-in-blue@stuttgarter-kickers.de erreichen.12für11-FansponsoringDie aktuelle Kampagne heißt "12für11 - eine Aktion von Fans für Fans". Mit "12für11" hat jeder die Möglichkeit, Sponsor der Stuttgarter Kickers zu werden. Alle Fansponsoren sammeln sich unter dem Dach des Aktions-Logos und erhalten - wie beim Sponsoring üblich - exklusive Gegenleistungen."12für11" ist im Sommer 2012 nach der Idee des für Fans zuständigen Aufsichtsratsmitglieds Philip Pfeiffer in Zusammenarbeit mit Fans, die beruflich mit den Bereichen Sponsoring, Marketing etc. zu tun haben, entstanden.Ziel ist es, noch näher an die Mannschaft und den Verein heranzurücken und die Jungs bei ihrem sportlichen Weg zu unterstützen. Anders als beispielsweise Spenden kommen alle Sponsoring-Gelder unmittelbar dem Etat der 1. Mannschaft der Stuttgarter Kickers zugute.Mittlerweile unterstützen über 300 Fansponsoren die 1. Mannschaft und treffen sich in regelmäßigen Abständen mit den Vereinsoffiziellen oder am Infostand bei den Heimspielen im GAZi-Stadion auf der Waldau.Auf unserer Homepage findet ihr alle Informationen. Das 12für11-Orgateam ist per E-Mail 12fuer11@stuttgarter-kickers.de zu erreichen.Kickers-111-ElfAm 21. September 2010 wurden die Stuttgarter Kickers 111 Jahre alt. Zum Jubiläum konnten Fans und Freunde ihre Kickers-Elf aus 111 Jahren Vereinsgeschichte wählen, die „111 Elf“. Am Samstag, 9. Oktober 2010, trat für die Blauen eine namhafte Traditionself ehemaliger und aktueller Kickers-Spieler in der Neuauflage des Endspiels um die deutsche Meisterschaft von 1908 gegen Viktoria Berlin im GAZi-Stadion auf der Waldau an. Die tolle Jubiläumsfestlichkeit mit Empfang, Spiel und Kabinenparty organisierte der Verein in Zusammenarbeit mit dem damaligen Fan-Arbeitskreis.Anstoß blau - die Zukunftswerkstatt Nur allzu lang wurde der Zeile aus unserem traditionsreichen Kickers-Song: „Unsre Fans sind unsre Kraft“ zu wenig Beachtung geschenkt. Mit dem Abstieg in die Oberliga im Sommer 2018 standen unsere Blauen nicht nur vor dem sportlichen Tiefpunkt Ihrer Geschichte, sondern vor allem vor einer großen Herausforderung, die es zusammen zu bewältigen gilt!In einem gemeinsamen Schulterschluss der Gremien, der Fanabteilung FadSKi, dem Ehrenrat und interessierten Fanvertretern, wurde die unbedingte Notwendigkeit eines besseren Miteinanders als Basis für einen Wendepunkt ausgemacht. Daher fand am zusammen für unsere Kickers fair streiten, konstruktiv diskutieren und tragfähige Anstöße kreieren.Am 19.07.2018 fand das erste Treffen mit 51 Teilnehmern zum „ANSTOSS BLAU - Die Zukunftswerkstatt der Stuttgarter Kickers“ statt, zu dem alle Anhänger, Unterstützer, Gremien, Sponsoren, Alte und Junge, Frustrierte, Enthusiasten und ungehörte Ideengeber eingeladen waren, sich direkt zu beteiligen, ihre Ideen, Vorschläge und Kompetenzen einzubringen. Gemeinsam wurden wir kritische Punkte identifizieren, machbare Verbesserungen erörtert und daraus Maßnahmen entwickelt, welche, hoffentlich schon bald, mit Leben gefüllt werden.WAS IST EINE ZUKUNFTSWERKSTATT?Eine Zukunftswerkstatt ist eine etablierte gruppenorientierte Problemlösungsmethode, bei der die Betroffenen und Akteure von Entwicklungen selbst zu Wort kommen sollen und ihr Wissen und Ihre Ideen einbringen können. Zukunftswerkstätten eröffnen Vertretern unterschiedlicher Haltungen und Ansätze, in moderierten Gruppen, gemeinsam an Lösungen für ausgemachte Probleme oder Herausforderungen zu finden. Dazu wurden drei Phasen durchlaufen: Kritikphase, Fantasiephase und Verwirklichungsphase.Unter der Mailadresse ab@stuttgarter-kickers.de ist das Orga-Team für Anregungen, Kritik, Nachfragen und Vorschläge jederzeit offen.Euer Orga-TeamDr. Joachim Sailer, Mathias Stickel, Philip Pfeiffer'
