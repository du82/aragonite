full_description = 'Fanshop- und Ticket-InfosEintrittspreiseQuick Linkszum TicketshopInfoseite DauerkarteStadionplan & InfosInfos für GästefansStadionordnung & AGBsStadionführungenTicketpreise Tageskarten Regionalliga Südwest Saison 2024/25Tageskarte Stehplatz Block A, B, C, G, D, F (Gästefans in F)Kategorie / RabattstufePreis für Spiele in der RLSWPreis für wfv-PokalspielErwachsener / Vollzahler13,- EuroMitglied / Sponsor *11,- Euroermäßigter Personenkreis **11,- Euro Kind / Jugendlicher 6-16 Jahre ***7,- Euro Kleinkind bis 5 Jahre ****0,- EuroFamilienticket30,- Euro Gruppenticket6,- Euro pro PersonTageskarte Sitzplatz Haupttribüne Mitte Block E3 & E5 und Seite Block E6 & E7 und E2 & E1 (Gästefans in E2 & E1)Kategorie / RabattstufePreis für Spiele in der RLSWPreis für wfv-PokalspielErwachsener / Vollzahler26,- EuroMitglied / Sponsor *24,- Euroermäßigter Personenkreis **22,- EuroKind / Jugendlicher 6-16 Jahre ***14,- EuroKleinkind bis 5 Jahre ****0,- EuroFamilienticket60,- EuroGruppenticket12,- Euro pro PersonRollstuhlfahrer12,- EuroBegleitperson Rollstuhlfahrer0,- EuroDauerkartenpreise Regionalliga Südwest Saison 2024/25Stand 24.02.2025: noch 7 Heimspiele inkl. FC GöppingenDie nachstehenden Dauerkartenpreise werden im Laufe der Saison anhand der noch ausstehenden Anzahl an Heimspielen zurückgerechnet.Dauerkarte Stehplatz Block A, B, C, GKategorie / RabattstufePreisErwachsener / Vollzahler74,- EuroMitglied / Sponsor *62,- Euroermäßigter Personenkreis ** 62,- EuroKind / Jugendlicher 6-16 Jahre ***39,- EuroKleinkind bis 5 Jahre ****0,- Euro Dauerkarte Sitzplatz Haupttribüne Mitte Block E3 & E5 und Seite Block E6 & E7 & E2Kategorie / RabattstufePreisErwachsener / Vollzahler148,- EuroMitglied / Sponsor *136,- Euroermäßigter Personenkreis **124,- EuroKind / Jugendlicher 6-16 Jahre ***78,- EuroKleinkind bis 5 Jahre ****0,- Euro Rollstuhlfahrer68,- EuroBegleitperson Rollstuhlfahrer 0,- EuroHinweise:Im Kartenpreis sind die gesetzliche Mehrwertsteuer, eine Ticketsystemgebühr, der VVS-Zuschlag für das VVS-KombiTicket sowie ein Stadiongroschen zur teilweisen Refinanzierung der Stadion-Modernisierung (Neubau der Haupttribüne und Installation der Rasenheizung 2015) beinhaltet. Die Stuttgarter Kickers schulden den Stadiongroschen unmittelbar der Landeshauptstadt Stuttgart;Für die Spiele im DFB-Pokal, wfv-Pokal, Aufsstiegsspiele oder Freundschaftsspiele - bei diesen Spielen hat die Dauerkarte in der Regel keine Gültigkeit - gelten ggf. andere Preise wie bei einer Partie der Regionalliga;Das VVS-KombiTicket ist bei Kaufkarten (keine Frei- & Ehrenkarten) im Karten­preis bei den Tages- oder Dauerkarten beinhaltet.Die Eintrittskarten sind jederzeit und auch noch am Spieltag in unserem Ticketshop erhältlich, so könnt ihr euch zuhause, im Büro oder auf dem Weg zum Stadion online ein Ticket erwerben. Die Eintrittskarte (Sitzplatz, Stehplatz, Business-/VIP-Zugang oder Parkschein) kann als E-Ticket auf dem Smartphone (Wallet, pdf, Screenshot) oder als print@home-Ticket auf Papier ausgedruckt am Stadioneinlass / VIP-Zugang / Parkplatz-Zufahrt) vorgezeigt werden, dort wird der QR-Code oder Barcode gescannt.Wer kein E-Ticket erwerben möchte, kann die Eintrittskarten auch im Kickers-Fanshop im ADM-Sportpark oder an den Tageskassen am Stadion (ab ca. 120 Minuten vor Spielbeginn) erwerben.Erläuterungen:* Mitglieder bezahlen den Mitgliederpreis, wenn der gültige Mitgliedsausweis / Mitgliedsnummer beim Kauf und am Spieltag beim Betreten des Stadions auf Verlangen vorgezeigt wird (nur bei Spielen in der RLSW, kein Rabatt bei Pokalspielen);* Sponsoren & Partner erhalten im Vorverkauf über den Kickers-Fanshop / Ticketshop den Sponsoren-Preis, wenn der Firmenname oder die Firmen-Mail-Adresse beim Kauf angegeben und am Spieltag beim Betreten des Stadions auf Verlangen vorgezeigt wird (nur bei Spielen in der RLSW, kein Rabatt bei Pokalspielen);** Ermäßigter Personenkreis: Schüler, Studenten, Bundesfreiwilligendienstleistende, Auszubildende, Behinderte, Rentner / Pensionäre und Arbeitslose / Leistungsempfänger von Arbeitslosengeld bezahlen den ermäßigten Betrag, wenn der entsprechende amtliche Nachweis der Ermäßigung beim Kauf im Ticketshop hochgeladen bzw. im Fanshop vorgelegt und am Spieltag beim Betreten des Stadions auf Verlangen vorgezeigt wird;*** Kinder und Jugendliche: Kinder und Jugendliche ab 6 Jahre bis einschließlich 16 Jahre bezahlen den Kinderpreis**** Kleinkinder bis 5 Jahre bezahlen keinen Eintritt, benötigen aus Versicherungsgründen aber eine Kinder-Freikarte, die direkt bei der Kartenkontrolle am Einlass oder an jeder Tageskasse am Stadion erhältlich ist (und nicht mehr online im Ticketshop). Diese Kinder-Freikarten sind Stehplatz-Freikarten oder in Verbindung mit einer Haupttribünenkarte der Eltern / des Erziehungsberechtigten / der Begleitung auch für die Haupttribüne (sog. „Schoßkarte“) gültig. Das Kind sitzt dann auf dem Schoß der Eltern / des Erziehungsberechtigten / der Begleitung und nicht auf einem eigenen Sitzplatz. Wenn das Kind einen eigenen Sitzplatz haben soll, muss entsprechend eine Sitzplatzkarte zum Kinderpreis erworben werden;Familienticket: Für Familien bieten die Kickers ein günstiges Familienticket an, das für bis zu 2 Erwachsene und einer beliebigen Anzahl an eigenen Kindern unter 16 Jahren gültig ist. Das Familienticket können 1 Elternteil mit Kindern oder auch maximal 2 Erwachsene (Vater / Mutter / Oma / Opa / Onkel / Tante etc.) mit Kindern nutzen. Hierzu im Ticketshop 1 x Kaufkarte "Familienticket Erwachsener" und für jede weitere Person "zusätzliche Karten für Familienticket" im Ticketshop auswählen, damit für jedes Familienmitglied ein gültiges Ticket vorliegt. Gruppen-Sonderpreise:Für Vereine / Mannschaften (Kinder- oder Erwachsene-Teams) / Schulklassen / Kinder-Geburtstage / Einrichtungen ab 10 Personen bieten die Kickers im Steh- oder Sitzplatzbereich einen Sonderpreis an: - Stehplatz Block A, B, C oder G für 6,- Euro pro Kind / Jugendlicher oder Erwachsener / Trainer / Betreuer / Begleitperson - Sitzplatz Block E6 / E7 für 12,- Euro pro Kind / Jugendlicher oder Erwachsener / Trainer / Betreuer / Begleitperson (nur bei ausreichend freien Kapazitäten)Bitte beachten: Bitte meldet Euch im Vorfeld des Heimspiels schriftlich per Mail an tickets@stuttgarter-kickers.de an. Die Gruppen-Sonderpreise können ausschließlich im Vorverkauf über den Ticketshop (Buchung der Tickets zum Sonderpreise ist durch die Kickers über ein Kundenkonto erforderlich) oder im Kickers-Fanshop in Degerloch / ADM-Sportpark erworben werden und sind nicht an den Tageskassen am GAZI-Stadion erhältlich.Rollstuhlfahrer:Ein Rollstuhlfahrer mit ggf. erforderlicher Begleitperson sitzt auf der Haupttribüne in Block E6 (16 Plätze) und Block E2 (16 Plätze). Eine Begleitperson erhält freien Eintritt und benötigt eine eigene Karte. Hierzu im Ticketshop die mit dem Rolli-Symbol markierten Plätze mit 1 x Kaufkarte "Rollstuhlfahrer" und 1 x Freikarte "Rollstuhlfahrer Begleitperson" im Ticketshop auswählen. Rolli-Tickets mit Freikarte für Begleitpersonen können im Vorverkauf über den Ticketshop, im Kickers-Fanshop in Degerloch oder am Spieltag an den Tageskassen gegen Vorlage des entsprechenden Ausweises erworben werden.Das GAZi-Stadion ist voll rollstuhltauglich: Es gibt Parkplätze in untermittelbarer Stadionnähe (hinter der Gegentribüne), einen separaten Bereich auf der Haupttribüne (Ebene 1) im Block E6 und E2, wo die Rollis samt Begleitperson genug Platz finden. Ebenso sind Toiletten und ein Kiosk vorhanden, die Ebene 1 ist über einen Aufzug hinter der Haupttribüne zu erreichen.Behinderte / Versehrte / Blinde:Behinderte / Versehrte / Blinde bezahlen den ermäßigten Betrag für eine Steh- oder Sitzplatz-Karte, einen separaten Bereich auf den Tribünen gibt es nicht. Eine Begleitperson - falls nötig - erhält auf Wunsch freien Eintritt, darf aber auch gerne ein Ticket zum normalen oder auch ermäßigten Preis erwerben. Tickets für Behinderte / Versehrte / Blinde mit Freikarte für die Begleitperson können im Vorverkauf über den Ticketshop (Buchung der Freikarte ist durch die Kickers über ein Kundenkonto erforderlich, E-Mail mit Ausweis im Anhang an tickets@stuttgarter-kickers.de senden), im Kickers-Fanshop in Degerloch oder am Spieltag an den Tageskassen gegen Vorlage des entsprechenden Ausweises erworben werden. Direkt hinter der Gegentribüne stehen Behinderten-Parkplätze zur Verfügung.Gutscheine für den TicketshopAls Geschenk zum Geburtstag, für Ostern oder Weihnachten - ein Gutschein über Eintrittskarten für ein Kickers-Heimspiel bereitet bei jedem Anlass Freude!Gutscheine erwerben: Es gibt Gutscheine im Wert von 10,- Euro, 25,- Euro, 50,- Euro und 100,- Euro, die über den Ticketshop gekauft werden können (automatisierte Bezahlung per PayPal, Kreditkarte, Onlinebanking Giropay / Sofort / Klarna / iDEAL oder Apple Pay / Google Pay).Nach abgeschlossener Buchung erhält der Käufer den Gutschein als pdf zum Ausdrucken / Weiterleiten / Verschenken.Gutschein einlösen: Das Guthaben des Gutscheins kann für Tageskarten oder Dauerkarten hier im Ticketshop, im Kickers-Fanshop in Degerloch oder am Spieltag an der Servicekasse eingelöst werden. Der Gutschein ist nicht beim Kauf an den normalen Tageskassen am Stadion gültig (ausschließlich an der Servicekasse) und auch nicht für Fanartikel (Onlineshop) oder die Fußballschule (Buchungsportal) einlösbar.Im Kartenbuchungsprozess muss auf der Seite beim Bezahlvorgang im Feld „Gutschein einlösen“ der Gutscheincode (oder auch mehrere Gutscheincodes) eingegeben werden. Der Gutscheincode kann nicht im Feld "Coupon einlösen", das bei der Auswahl der Steh- oder Sitzplätze angezeigt wird, eingegeben werden, sondern erst beim Zahlungsprozess.Ein etwaiger Restwert bleibt als Guthaben erhalten. Eine Barauszahlung oder Verzinsung des Guthabens oder Restguthabens ist nicht möglich.Die Gutscheine kannst du direkt in unserem Ticketshop erwerben.Upgrade-Preise Stehplatz auf Sitzplatz:Für alle Stehplatz-Karteninhaber bieten die Kickers am Spieltag eine Upgrade-Möglichkeit für die überdachten Sitzplätze an - vorausgesetzt es gibt noch Sitzplatzkarten an der Tageskasse. Alle Käufer von Stehplatzkarten (Dauerkarten, Tickets aus dem Vorverkauf oder Tageskarten) haben am Spieltag die Möglichkeit durch Zuzahlung eines reduzierten Aufpreises an der Servicekasse / Kassenanlage Süd eine Karte für den Sitzplatz Haupttribüne zu erwerben.Änderung der Rabattstufe / Upgrade auf VollzahlerSolltest du eine Kinder-Karte oder eine ermäßigte Karte haben, jedoch nun als Vollzahler die Karte nutzen wollen, ist dies durch Zuzahlung des Differenzbetrages an der Servicekasse / Kassenanlage Süd möglich.VVS-KombiTicketAlle Zuschauer können mit den Eintrittskarten (nur Kaufkarten, keine Frei- & Ehrenkarten) ohne zusätzliche Kosten per öffentlichem Nahverkehr zu den Spielen im GAZi-Stadion auf der Waldau an- und abreisen. Die Eintrittskarten berechtigen zur Fahrt zum Stadion ab drei Stunden vor Spielbeginn und zur Rückfahrt nach Spielende bis Betriebsschluss mit allen VVS-Verkehrsmitteln (2. Klasse) innerhalb des Geltungsbereiches des VVS-Gemeinschaftstarifs. Das VVS-Ticket ist nicht übertragbar. Frei- & Ehrenkarten berechtigen nicht als VVS-KombiTicket.Business- / VIP-Tickets für die "Spielbank Stuttgart-Business-Lounge":Erlebe die Spiele der Stuttgarter Kickers in unserer exklusiven und hochwertigen "Spielbank Stuttgart Business-Lounge" im GAZi-Stadion auf der Waldau. Dank unserer Catering-Partner können wir mit unserem Stadion-Caterer „Schmücker Gastro & Catering GmbH“ den Gästen ein abwechslungsreiches Angebot an warmen und kalten Speisen sowie ein umfangreiches Getränkeangebot zur Verfügung stellen. Es erwarten Dich zwei verschiedene Business-/VIP-Kategorien, die Dir ein tolles Netzwerk-Erlebnis bieten: Kategorie "CLASSIC" an fest zugewiesenen Stehtischen in unserer Lounge sowie die Kategorie „PREMIUM“ mit fest zugewiesenen Sitzplätzen an den Tischen in der Lounge. Die Tickets werden als Paketpreis verkauft: Wähle zunächst im Saalplan deinen gewünschten Sitzplatz auf der Haupttribüne E1,E2,E3,E5,E6,E7 oder einen Business-Seats in Block E4. Im zweiten Reiter "Business-/VIP-Tickets" kannst Du die entsprechende Business-/VIP-Kategorie "CLASSIC" oder „PREMIUM“ auswählen. Ein Gast benötigt deshalb immer beide Tickets: Die Sitzplatzkarte für die Haupttribüne, die am Stadionzugang geprüft und entwertet wird und die Business-/VIP-Karte, die bei der Anmeldung an der Welcome-Zone in ein VIP-Band getauscht wird. Der Zugang befindet sich im rückwärtigen Bereich der Haupttribüne auf Ebene 0 über die „Welcome Zone“, von dort gelangen Sie via Aufzug / Treppenhaus in die "Spielbank Stuttgart Business-Lounge" in Ebene 2. Am Spieltag müssen sich unsere Gäste deshalb zuerst an der „Welcome Zone“ anmelden, ein Zugang zur Lounge ohne VIP-Band über die Haupttribüne ist nicht möglich.Alle detaillierten Information findest Du auf unserer Business-Homepage.Info-Flyer VIP-Karten Saison 2024/25Flyer VIP- / Hospitality- / Business-Karten Saison 2024/25Tageskarten Paketpreise Business- / VIP-Tickets Regionalliga Südwest Saison 2024/25:Sitzplatz auf der Haupttribüne und VIP-Zugang zur "Spielbank Stuttgart Business-Lounge"VIP-KategorieRabattstufePreisBusiness- / VIP-Paket PREMIUMErwachsener / Vollzahler175,- EuroBusiness- / VIP-Paket PREMIUMMitglieder / Sponsoren160,- EuroBusiness- / VIP-Paket PREMIUMKind / Jugendlicher 6-16 Jahre 95,- EuroBusiness- / VIP-Paket CLASSIC Erwachsener / Vollzahler 120,- EuroBusiness- / VIP-Paket CLASSIC Mitglieder / Sponsoren 110,- EuroBusiness- / VIP-Paket CLASSIC Kind / Jugendlicher 6-16 Jahre 70,- EuroBusiness- / VIP-Paket PREMIUM / CLASSICKind bis 5 Jahre0,- EuroDauerkarten Paketpreise Business- / VIP-Tickets Regionalliga Südwest Saison 2024/25:Sitzplatz auf der Haupttribüne und VIP-Zugang zur "Spielbank Stuttgart Business-Lounge"Die nachstehenden Dauerkartenpreise wurden bzw. werden im Laufe der Saison anhand der noch ausstehenden Anzahl an Heimspielen zurückgerechnet.VIP-KategorieRabattstufePreisBusiness- / VIP-Paket PREMIUMErwachsener / Vollzahler2.600,- EuroBusiness- / VIP-Paket PREMIUMMitglieder / Sponsoren2.400,- EuroBusiness- / VIP-Paket PREMIUMKind / Jugendlicher 6-16 Jahre 1.400,- EuroBusiness- / VIP-Paket CLASSIC Erwachsener / Vollzahler 1.800,- EuroBusiness- / VIP-Paket CLASSIC Mitglieder / Sponsoren 1.650,- EuroBusiness- / VIP-Paket CLASSIC Kind / Jugendlicher 6-16 Jahre 1.050,- EuroBusiness- / VIP-Paket PREMIUM / CLASSICKind bis 5 Jahre0,- Euro'
