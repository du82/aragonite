["https://stuttgarter-kickers.de/datenschutz"]
title = "Datenschutz - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = "Stuttgarter Kickers e.v.DatenschutzDiese Website, das Forum und der Onlineshop werden vom SV Stuttgarter Kickers e.V. betrieben. Der Schutz Ihrer personenbezogenen Daten ist unserem Verein sehr wichtig. In dieser Erklärung finden Sie Informationen über den Umgang mit Ihren personenbezogenen Daten beim Besuch der Kickers-Homepage, Kickers-Forum und Kickers-Online-Shop. Diese Datenschutzerklärung gilt für den gesamten Internet-Auftritt, nicht aber für Seiten anderer Anbieter, für die Sie auf unseren Seiten evtl. Links finden werden.Verantwortlich für die Verarbeitung von personenbezogenen Daten auf dieser Website ist:SV Stuttgarter Kickers e.V.Königsträßle 5670597 Stuttgart (Degerloch)Telefon: 0711 / 767 10 - 0Fax: 0711 / 767 10 - 10E-Mail: info@stuttgarter-kickers.deSie können sich bei Fragen zum Datenschutz jederzeit per Mail an datenschutz@stuttgarter-kickers.de an unseren zuständigen Mitarbeiter der Geschäftsstelle wenden.Alle Mitarbeiterinnen und Mitarbeiter unseres Vereins wurden und werden nach § 5 Bundesdatenschutzgesetz (BDSG) geschult und auf das Datengeheimnis verpflichtet. Die technischen Sicherheitsvorkehrungen auf unserer Geschäftsstelle und Fanshop (passwortgeschützte PCs und Programm-Zugänge, Software, Virenschutz, Updates) werden laufend an die aktuellen Gegebenheiten und Anforderungen angepasst und aktualisiert.Datenerfassung auf unsere WebsiteErheben und Verwenden nicht personenbezogener DatenWenn Sie diese Website nutzen, ohne anderweitig (z.B. durch Registrierung im Forum, Presse-Akkreditierungsanfragen, Bestellung im Onlineshop, etc.) Daten an uns zu übermitteln, erheben wir nur technisch notwendige Daten, die automatisch durch Ihren Browser an unseren Server übermittelt werden (z.B. Browsertyp / Browserversion, verwendetes Betriebssystem, Referrer URL, aufgerufene Seiten, Verweildauer, IP-Adresse, Datum und Uhrzeit der Anfrage).Dies ist technisch erforderlich, um Ihnen unsere Website anzeigen zu können. Soweit davon personenbezogene Daten betroffen sind, ist Art. 6 Abs. 1 lit. f DSGVO Rechtsgrundlage für die Erhebung. Eine Zusammenführung dieser Daten mit anderen Datenquellen wird nicht vorgenommen. Wir behalten uns vor, diese Daten nachträglich zu prüfen, wenn uns konkrete Anhaltspunkte für eine rechtswidrige Nutzung bekannt werden.Erheben und Verwenden personenbezogener DatenPersonenbezogene Daten (z. B. Name, Adresse, E-Mail) erheben und verarbeiten wir nur bei folgenden Unterzeiten:Bestellung von Fanartikeln in unserem Online-ShopPresse-AkkreditierungsantragRegistrierung im Kickers-ForumAnfragen über das Kontakt- / Feedback-FormularIhre personenbezogene Daten erheben und verarbeiten wir nur soweit dies für die Begründung und inhaltliche Ausgestaltung oder Änderung des Rechtsverhältnisses erforderlich ist. Nach vollständiger Vertragsabwicklung werden ihre Daten unter Berücksichtigung der gesetzlichen Aufbewahrungspflichten gelöscht, sofern Sie in eine weitere Verwendung nicht ausdrücklich eingewilligt haben. Ohne ihr Einverständnis oder eine entsprechende behördliche Anordnung werden Ihre persönlichen Daten von uns oder von uns beauftragten Personen keinen Dritten Personen zur Verfügung gestellt.Bei der Einrichtung eines Kundenkontos in unserem Onlineshop werden die von Ihnen eingegebenen Daten dauerhaft in unserer Datenbank gespeichert. Sie können jederzeit die Löschung Ihrer Daten und Ihres Profils/Kontos verlangen.Soweit Sie bei der Einrichtung Ihres Profils/Kontos auch Ihr Einverständnis zum Erhalt von werblichen Informationen erklärt haben, verwenden wir bzw. von uns dazu beauftragte Dienstleistungsunternehmen die von Ihnen angegebenen Daten für Werbezwecke. Diese Einwilligung ist freiwillig und Sie können diese jederzeit mit der Wirkung für die Zukunft widerrufen.Rechtsgrundlage für die Verarbeitung ist im Falle einer Einwilligung Art. 6 Abs. 1 lit. a DSGVO. Dient Ihre Registrierung der Vorbereitung eines Vertragsabschlusses ist Art. 6 Abs. 1 lit. b DSGVO zusätzliche Rechtsgrundlage.SpeicherdauerWir verarbeiten und speichern Ihre Daten nur so lange, wie dies für die Verarbeitung oder zur Einhaltung gesetzlicher Pflichten erforderlich ist. Nach Wegfall des Verarbeitungszwecks werden Ihre Daten gesperrt oder gelöscht. Sofern darüber hinaus gesetzliche Pflichten zur Speicherung bestehen, sperren oder löschen wir Ihre Daten mit Ablauf der gesetzlichen Speicherfristen.WiderspruchSie können der Nutzung, Verarbeitung und Übermittlung Ihrer personenbezogenen Daten zu Marketingzwecken, werblichen Zwecken oder Zwecken der Markt- und Meinungsforschung jederzeit bei uns durch eine formlose Mitteilung unter Angabe Ihrer Adresse und/oder Kunden-/Mitgliedsnummer per Mail an datenschutz@stuttgarter-kickers.de sowie auf dem Postweg an die Kickers-Geschäftsstelle widersprechen.Dies gilt allerdings nicht für die zur Abwicklung Ihrer Bestellung in unserem Onlineshop erforderlichen Daten. Nach Erhalt Ihres Widerspruchs werden wir die betroffenen Daten nicht mehr zu anderen Zwecken als zur Abwicklung Ihrer Bestellung nutzen.Löschung von DatenDer Gesetzgeber hat vielfältige Aufbewahrungspflichten und -fristen erlassen. Nach Ablauf dieser Fristen werden die Daten gemäß Art. 17 und 18 DSGVO gelöscht, wenn sie nicht mehr zur Zweck- oder Vertragserfüllung erforderlich sind und soweit gesetzliche Aufbewahrungspflichten und -fristen dem nicht entgegenstehen.Soweit es sich bei den Dokumenten um kaufmännische Dokumente handelt, gelten die Aufbewahrungspflichten aus dem Handelsgesetzbuch und der Abgabenordnung.Nach § 257 Abs. 1 Nr. 2 und 3 HGB sind empfangene Handelsbriefe, Wiedergaben (Kopien, Durchschriften) abgesandter Handelsbriefe, Geschäftspapiere und sonstige Unterlagen mit kaufmännischer und steuerlicher Bedeutung sechs Jahre aufzubewahren.Nach § 257 Abs. 1 Nr. 1 und 4 HGB sind Handelsbücher, Inventare, Personalakten, Eröffnungsbilanzen, Jahresabschlüsse, Einzelabschlüsse nach § 325 Abs. 2a HGB, Lageberichte, Konzernabschlüsse, Konzernlageberichte sowie die zu ihrem Verständnis erforderlichen Arbeitsanweisungen und sonstigen Organisationsunterlagen zehn Jahre aufzubewahren. Das gilt auch für Buchungsbelege zu den nach § 238 Abs. 1 HGB zu führenden Büchern.Eingangs- und Ausgangsrechnungen sind ebenfalls zehn Jahre aufzubewahren (§ 14b Umsatzsteuergesetz).Nach § 147 Abs. 2 i. V. m. Abs. 1 Nr.1, 4 und 4a AO, § 14b Abs. 1 UStG gilt für Bücher und Aufzeichnungen, Jahresabschlüsse, Inventare, Lageberichte, Eröffnungsbilanz sowie die zu ihrem Verständnis erforderlichen Arbeitsanweisungen und sonstigen Organisationsunterlagen, Buchungsbelege, Rechnungen und Unterlagen, die einer mit Mitteln der Datenverarbeitung abgegebenen Zollanmeldung beizufügen sind (ATLAS), sofern die Zollbehörden auf ihre Vorlage verzichtet haben eine Aufbewahrungsfrist von 10 Jahren.Ihre RechteSie haben bezüglich der Sie betreffenden personenbezogenen Daten folgende gesetzliche Rechte gegenüber den Stuttgarter Kickers:Auskunftsrecht gemäß Art. 15 DSGVOSie haben als betroffene Person das Recht, eine Bestätigung darüber zu verlangen, ob wir personenbezogene Daten verarbeiten, die Sie betreffen. Ist dies der Fall, so haben Sie das Recht auf Auskunft über diese personenbezogenen Daten sowie auf weitere Informationen, z.B. die Verarbeitungszwecke, die Empfänger und die geplante Dauer der Speicherung bzw. die Kriterien für die Festlegung der Dauer.Recht auf Berichtigung und Vervollständigung gemäß Art. 16 DSGVOSie haben als betroffene Person das Recht, unverzüglich die Berichtigung unrichtiger Daten zu verlangen. Unter Berücksichtigung der Zwecke der Verarbeitung haben Sie das Recht, die Vervollständigung unvollständiger Daten zu verlangen.Recht auf Löschung („Recht auf Vergessenwerden“) gemäß Art. 17 DSGVOSie haben als betroffene Person ein Recht zur Löschung, soweit die Verarbeitung nicht erforderlich ist. Dies ist beispielsweise der Fall, wenn Ihre Daten für die ursprünglichen Zwecke nicht mehr notwendig sind, sie Ihre datenschutzrechtliche Einwilligungserklärung widerrufen haben oder die Daten unrechtmäßig verarbeitet wurden.Recht auf Einschränkung der Verarbeitung gemäß Art. 18 DSGVOSie haben als betroffene Person ein Recht auf Einschränkung der Verarbeitung, z.B. wenn Sie der Meinung sind, die personenbezogenen Daten seien unrichtig.Recht auf Datenübertragbarkeit gemäß Art. 20 DSGVOSie haben als betroffene Person das Recht, die Sie betreffenden personenbezogenen Daten in einem strukturierten, gängigen und maschinenlesbaren Format zu erhalten.Sie haben als betroffene Person das Recht, jederzeit aus Gründen, die sich aus Ihrer besonderen Situation ergeben, gegen die Verarbeitung bestimmter Sie betreffender personenbezogener Daten Widerspruch einzulegen. Im Falle von Direktwerbung haben Sie als betroffene Person das Recht, jederzeit Widerspruch gegen die Verarbeitung Sie betreffender personenbezogener Daten zum Zwecke derartiger Werbung einzulegen; dies gilt auch für das Profiling, soweit es mit solcher Direktwerbung in Verbindung steht.Recht auf Widerruf Ihrer datenschutzrechtlichen Einwilligung gemäß Art. 7 Abs. 3 DSGVOSie können eine Einwilligung in die Verarbeitung Ihrer personenbezogenen Daten jederzeit mit Wirkung für die Zukunft widerrufen. Die Rechtmäßigkeit der bis zum Widerruf erfolgten Verarbeitung wird davon jedoch nicht berührt.Recht auf Beschwerde gemäß Art. 77 DSGVOSie können sich bei einer Aufsichtsbehörde beschweren. In der Regel können Sie sich hierfür an die Aufsichtsbehörde Ihres üblichen Aufenthaltsortes oder Arbeitsplatzes oder unseres Sitzes wenden.Anfragen über das Kontakt- und Feedback-FormularAuf unserer Website können Sie über ein Kontaktformular personenbezogene Daten eingeben. Wenn Sie das Kontaktformular nutzen, erheben und speichern wir die Daten, die Sie in die Eingabemaske eingeben (z.B. Nachname, Vorname, E-Mail-Adresse). Eine Weitergabe an Dritte findet nicht statt.Rechtsgrundlage für die Verarbeitung ist im Falle einer Einwilligung Art. 6 Abs. 1 lit. a DSGVO. Dient Ihre Anfrage der Vorbereitung eines Vertragsabschlusses ist Art. 6 Abs. 1 lit. b DSGVO zusätzliche Rechtsgrundlage. Die Daten verwenden wir ausschließlich, um Ihre Anfrage zu bearbeiten und zu beantworten.Presse AkkreditierungsantragAuf unserer Website können Medienvertreter über ein Anmeldeformular eine Akkreditierungsanfrage stellen. Grundlage ist ein Redaktions- bzw. Foto-Auftrag für ein Heimspiel der Stuttgarter Kickers, um live oder anschließend darüber medial zu berichten.Wenn Sie das Anmeldeformular nutzen, erheben und speichern wir die personenbezogene Daten, die Sie in die Eingabemaske eingeben (z.B. Nachname, Vorname, Adresse, E-Mail-Adresse, Presseausweisnummer, etc.). Eine Weitergabe an Dritte findet nicht statt. Rechtsgrundlage für die Verarbeitung ist im Falle einer Einwilligung Art. 6 Abs. 1 lit. a DSGVO. Die Daten verwenden wir ausschließlich, um Ihre Akkreditierungsanfrage zu bearbeiten und zu beantworten und werden nach dem Spiel gelöscht.Registrierung im Kickers-Forum, KommentarfunktionDas Forum ist ein auf unserer Internetseite geführtes, öffentlich einsehbares Portal, in welchem Fans und Personen Inhalte posten oder Gedanken in sogenannten Beiträgen niederschreiben können. Die Beiträge können in der Regel von Dritten kommentiert werden.Jeder Fan oder User hat die Möglichkeit, sich im Kickers-Forum unter Angabe von personenbezogenen Daten zu registrieren. Welche personenbezogenen Daten dabei übermittelt und gespeichert werden, ergibt sich aus der jeweiligen Eingabemaske, die für die Registrierung verwendet wird. Die von der betroffenen Person eingegebenen personenbezogenen Daten werden ausschließlich für die interne Verwendung bei den verantwortlichen Forum-Administratoren für die Verarbeitung und für eigene Zwecke erhoben und gespeichert.Durch eine Registrierung wird ferner die vom Internet-Service-Provider (ISP) der betroffenen Person vergebene IP-Adresse, das Datum sowie die Uhrzeit der Registrierung gespeichert. Die Speicherung dieser Daten erfolgt vor dem Hintergrund, dass nur so der Missbrauch unserer Dienste verhindert werden kann, und diese Daten im Bedarfsfall ermöglichen, begangene Straftaten aufzuklären. Insofern ist die Speicherung dieser Daten zur Absicherung des für unseren Verein erforderlich. Eine Weitergabe dieser Daten an Dritte erfolgt grundsätzlich nicht, sofern keine gesetzliche Pflicht zur Weitergabe besteht oder die Weitergabe der Strafverfolgung dient.Registrierten Personen steht die Möglichkeit frei, die bei der Registrierung angegebenen personenbezogenen Daten jederzeit abzuändern oder vollständig aus dem Datenbestand des Forums löschen zu lassen. Hierzu wenden Sie sich bitte an die Forum-Administratoren oder an unseren Datenschutzbeauftragten per Mail an datenschutz@stuttgarter-kickers.de.Die Forum-Administratoren oder der Datenschutzbeauftragte erteilt jeder betroffenen Person jederzeit auf Anfrage Auskunft darüber, welche personenbezogenen Daten über die betroffene Person gespeichert sind. Ferner werden die personenbezogenen Daten auf Wunsch oder Hinweis der betroffenen Person berichtigt oder löscht, soweit dem keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Die Forum-Administratoren oder der Datenschutzbeauftragte stehen der betroffenen Person in diesem Zusammenhang als Ansprechpartner zur Verfügung.Das Kickers-Forum bietet den Usern die Möglichkeit, individuelle Kommentare zu einzelnen Foren-Beiträgen oder Themen zu hinterlassen. Hinterlässt eine betroffene Person einen Kommentar, werden neben den von der betroffenen Person hinterlassenen Kommentaren auch Angaben zum Zeitpunkt der Kommentareingabe sowie zu dem von der betroffenen Person gewählten Nutzernamen (Pseudonym) gespeichert und veröffentlicht. Ferner wird die vom Internet-Service-Provider (ISP) der betroffenen Person vergebene IP-Adresse mitprotokolliert. Diese Speicherung der IP-Adresse erfolgt aus Sicherheitsgründen und für den Fall, dass die betroffene Person durch einen abgegebenen Kommentar die Rechte Dritter verletzt oder rechtswidrige Inhalte postet. Die Speicherung dieser personenbezogenen Daten erfolgt daher im eigenen Interesse des Vereins, damit sich dieser im Falle einer Rechtsverletzung gegebenenfalls exkulpieren könnte. Es erfolgt keine Weitergabe dieser erhobenen personenbezogenen Daten an Dritte, sofern eine solche Weitergabe nicht gesetzlich vorgeschrieben ist oder der Rechtsverteidigung des für die Verarbeitung Verantwortlichen dient.Kickers-Onlineshop, Kundenkonto, Bonitätsprüfung, Datenweitergabe und sichere DatenübertragungSämtliche personenbezogene Daten, die Sie uns bei Ihrer Bestellung / Registrierung im Onlinshop im automatisierten Verfahren zur Verfügung gestellt haben, speichern wir - unter Einhaltung der auf den Vertrag anwendbaren Datenschutzbestimmungen in dem für die Begründung, Ausgestaltung oder Abänderung des Vertragsverhältnisses jeweils erforderlichen Umfang - ausschließlich bei uns und geben diese bei der vollständigen Vertragsabwicklung / Abwicklung der Bestellung an keinen externe Vertragsp"
