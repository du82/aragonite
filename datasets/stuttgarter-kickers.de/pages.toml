title = "Waldauradio - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zur 1. Mannschaft, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = 'Digitale AngeboteWaldauradioWillkommen beim Waldauradio - dem Fansender der Stuttgarter Kickers.Auf diesen Seiten findet Ihr alle Informationen zum Waldauradio, den Link zum Radio, der ca 10-15 Minuten vor Spielbeginn aktiviert wird, dem Team mit Ansprechpartner und dem Waldauradio-Club.Für Rückfragen, Anregungen, Kritik, Lob, Hörerwünsche, Spenden bitte per Mail an waldauradio@stuttgarter-kickers.de.Viel Spaß beim Waldauradio!Wir sind ebenfalls auf Facebook: https://www.facebook.com/waldauradioKontoverbindung für Spenden: Commerzbank AG; IBAN: DE18 6008 0000 0932 5050 01 ; BIC: DRESDEFF600Kontoinhaber: Stuttgarter KickersVerwendungszweck: Spende Waldauradio, Adresse der SpendenbescheinigungLink zum WaldauradioDie nächsten Übertragungen:Paarung: aktuell plant das Team, jedes Pokalspiel und Regionalligaspiel zu übertragenDatum / Anstoß: siehe SpielplanÜbertragungsbeginn: der Link zum Radio ist immer erst zehn Minuten vor Spielbeginn aktiv.Die URL zum Radio-Server: www.radioms.de:8400/kickers.mp3Hinweis zum Server:Der Server wird immer erst jeweils ca. 10 Minuten vor Spielbeginn aktiviert. Solange der Server nicht aktiviert ist, erscheint der folgerichtige Hinweis: "The file you requested could not be found".Wir empfehlen folgende Browser für die Nutzung des Radios:Mozilla Firefox, Safari, Chrome, OperaBei der Nutzung mit Internet Explorer kann es zu technischen Problemen oder Tonstörungen kommen.Für den mobilen Gebrauch empfehlen wir den VLC Media Player. Damit kann man unseren Stream auch zeitlich steuern. Hierzu muss man den Direktlink des Radios als Netzwerkadresse eingeben.Eure Moderatoren und Ansprechpartner:<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimag