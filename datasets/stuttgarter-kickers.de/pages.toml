title = "12für11-Fansponsoring - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = 'Fans12für11-Fansponsoring12für11-FansponsorHerzlich Willkommen beim 12für 11-Fansponsoring der Stuttgarter KickersAuf dieser Seite findet Ihr alle Informationen zu 12für11 - das Fansponsoring der Stuttgarter Kickers. Euer 12für11 Team – Pia-Mareike, Philip & HolgerFansponsoring-Vertrag abschließen12für11 - Ein ÜberblickWas ist 12für11 genau?Mit 12für11 - Fansponsoring der Stuttgarter Kickers hat jeder Fan die Möglichkeit Sponsor des SV Stuttgarter Kickers e.V. zu werden. Bei dieser bundesweiten einmaligen Aktion versammeln sich alle Fansponsoren unter dem Dach des Aktionslogos "12für11 und treten als gemeinsamer Sponsor der Stuttgarter Kickers auf.Wie entstand 12für11?Zu Beginn der Saison 2011/12 entstand in Zusammenarbeit von Fans und dem Verein 12für11. Die Stuttgarter Kickers spielten zur damaligen Saison in der Regionalliga Süd. Mit den eingenommenen Sponsorengeldern sollte die 1. Mannschaft auf dem Weg in die 3. Liga unterstützt werden. Zwei Spieltage vor Saisonende war das Ziel erreicht und die Mannschaft stand als Aufsteiger fest. Damit war auch die Entscheidung gefallen, dass der Weg des Fansponsorings fortgesetzt wird.Wie funktioniert das Fansponsoring?Der Fan schließt mit dem Verein einen Sponsoring-Vertrag ab. Hier gibt es drei unterschiedliche Modelle: Fan-Sponsoring-Vertrag (Einzelperson 189,90 €), Partner-Sponsoring-Vertrag (für zwei Personen 300,00 €) und Familien-Sponsoring-Vertrag (je Familienmitglied 150,00 €). Wie bei jedem Sponsoring erhält der Fansponsor (bzw. jeder Fansponsor bei Partner- und Familienvertrag) attraktive Gegenleistungen. Der Erlös aus dem Fansponsoring geht direkt in den Etat der 1. Mannschaft.Ist das Sponsoring auf 12 Personen begrenzt?Nein, es gibt keinerlei Begrenzung an Fansponsoren und auch keine Wertung. Jeder Fansponsor ist gleich, hat die gleichen Rechte und Pflichten.Wie werde ich Fansponsor?Einfach den Antrag ausfüllen und per Post an:SV Stuttgarter KickersKönigsträßle 5670597 Stuttgart Degerlochoder einscannen und per Mail an 12fuer11@stuttgarter-kickers.de schicken.12für11-AnträgeHier findet ihr die drei verschiedene Anträge für das Fansponsoring als PDF-Download:Fan-Sponsoring für einzelne FansFan-Sponsoring für FamilienFan-Sponsoring für PartnerWeitere Fragen beantwortet gerne das 12für11-Team über 12fuer11@stuttgarter-kickers.de.Antrag 12für11 Fan-SponsoringAntrag 12für11 Familien-SponsoringAntrag 12für11 Partner-Sponsoring<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fa41c45c5-5926-46a5-9b0f-d755c74f9bc7_12fuer11-Wand.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q