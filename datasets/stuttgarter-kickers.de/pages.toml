["https://stuttgarter-kickers.de/aktuelles/digitale-angebote/livestream"]
title = "Livestream - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers - Hier findest Du die Informationen zu unseren Livestream von den Spielen der 1. Mannschaft"
full_description = "Digitale AngeboteLivestreamUnser Medienteam, das aus ehrenamtlichen Mitarbeitern aus den Bereichen Kickers-TV, Waldauradio und Liveticker besteht, hat im Sommer 2021 in Zusammenarbeit mit unserem Partner LEAGUES den Livestream gemeinsam aufgebaut.Auch in der aktuellen Regionalliga Saison 2024/25 wird es einen Livestream von allen Heimspielen von unserem Medienteam in Zusammenarbeit mit LEAGUES und von jedem Auswärtsspiel (Medienteam der Gastgeber in Zusammenarbeit mit LEAGUES) geben. Der Stream ist in Full HD, moderiert und kommentiert, von Hand gefilmt mit Wiederholungen von Highlightszenen und Super-Zeitlupen.Und jedes Mal, wenn Ihr Euch ein Stream-Ticket kauft, unterstützt Ihr Eure Kickers vom Sofa aus, denn die Blauen profitieren davon: Der Verein bekommt sowohl bei den Heim- also auch bei den Auswärtsspielen eine Umsatzbeteiligung. Über die LEAGUES-Plattform könnt ihr folgende Stream-Zugänge buchen:Match Pass: der Zugang zu einem einzelnen Spiel kostet 6,99 EuroSeason Pass: Alle Heim- und Auswärtsspiele der Kickers für 136,- EuroAway Pass: Alle Auswärtsspiele der Kickers für 85,- EuroUnser Medienpartner Stuttgarter Zeitung / Stuttgarter Nachrichten überträgt alle Auswärtsspiele live und kostenfrei für alle Abonnenten auf der STZ / STN-HomepageLEAGUES Pass: alle Spiele der Regionalliga Südwest für 25,- Euro monatlichMember Pass: Digitales Mitglied bei den Blauen werdenAlle Infos unter https://www.leagues.football/checkout/svk/Bei den Pokalspielen ist die Online-Übertragung unter anderem von der Zustimmung der Heimmannschaft und von den technischen Möglichkeiten am Austragungsort abhängig. Das Medienteam freut sich auf die Berichterstattung rund um die Blauen für Euch.Livestream-Übertragungen der Regionalliga-Spiele (Heim- und Auswärtspartien)Datum / Paarung: siehe SpielplanÜbertragungsbeginn: ca 5-10 Minuten vor SpielbeginnLink zur Homepage für den Kickers-Livestream: www.leagues.football/svkKostenpflichtiger Zugang erwerben:Der Zugang wird direkt auf der Plattform erworben und via PayPal, Lastschrift, GiroPay oder Sofortüberweisung bezahlt. Danach wird man auf den Livestream weitergeleitet. Einen Zugangcode erhält man zusätzlich als E-Mail (bitte Spam-Ordner beachten).Technische Hilfe:Der Zugang selbst ist immer nur auf einem Endgerät nutzbar.Eine stabile und schnelle Internetverbindung sind erforderlich.Für Probleme rund um den Zugang auf der Plattform wurde von die LIGEN eine Support-E-Mail eingerichtet: contact@leagues.footballLivestream-Übertragungen bei Pokalspiel:Livestream bei LEAGUES:Datum: Paarung: Link zum Streaming-Server: Hinweise:Die Gastgeber bieten in Zusammenarbeit mit LEAGUES einen Livestream an (nicht vom Kickers-Medienteam).der Zugang zum Stream kostet 5,- Euro der Stream ist in Full HD, moderiert und kommentiert, von Hand gefilmt mit Wiederholungen von Highlightszenen und Super-Zeitlupen.Livestream vom Gastgeber / ausrichtender Verein:Datum: Paarung: Übertragungsbeginn: Hinweise:Livestream bei SportTotal.tv:Datum: Paarung: Direkter Link zum Streaming-Server: Hinweise: Die Kamera ist fest am Stadiondach installiert. Durch eine auf künstlicher Intelligenz basierenden Software folgt die Kamera dem Spielgeschehen automatisch – ohne Kameramann und manuellen Aufwand vor Ort. Über eine Internetverbindung wird das Spielgeschehen live auf www.sporttotal.tv kostenfrei übertragen.Link zum Streaming-Server: SPORTTOTAL TVLivestream bei SOCCERWATCH-TV (Staige / AISportsWatch GmbH):Datum: Paarung: Direkter Link zum Streaming-Server: Hinweise: Die Kamera ist fest am Stadiondach installiert. Durch eine auf künstlicher Intelligenz basierenden Software folgt die Kamera dem Spielgeschehen automatisch – ohne Kameramann und manuellen Aufwand vor Ort. Über eine Internetverbindung wird das Spielgeschehen live auf https://soccerwatch.tv kostenfrei übertragen.Link zum Streaming-Server: Soccerwatch.tv"
