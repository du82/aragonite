full_description = "FansFan-Infos für die AuswärtsspieleInfos zum Auswärtsspiel beim FC-Astoria WalldorfQuick LinksWaldauradioLivetickerLivestreamDatum: Samstag, 01.03.2025Paarung: FC-Astoria Walldorf - Stuttgarter KickersAnstoß: 14.00 UhrStadionöffnung: 12:30 UhrStadion: Dietmar-Hopp-Sportpark (Schwetzinger Str. 94B, 69190 Walldorf)Zielstraße zum Gästeparkplatz: Heidelberger Straße in 69190 WalldorfEintrittspreise:Sitzplatz Haupttribüne Block B3 (Zugang über Haupteingang Schwetzinger Straße)Vollzahler 12 €, ermäßigt 10 €Stehplatz im Gästeblock Block D (Zugang über Heidelberger Straße)Vollzahler 8 €, ermäßigt 6 €VIP-Tageskarte:60,00 € (inklusive Sitzplatz)kein TageskassenzuschlagErmäßigungen sind gegen Vorlage eines entsprechendes Nachweises: Schüler, Studenten, Auszubildende, Rentner sowie BehinderteKinder: nicht bekanntVorverkauf / Tageskassen:Online-Vorverkauf:es findet kein Vorverkauf über den Ticketshop des FCA Walldorf statt, lediglich direkt an der StadionkasseTageskasse am Stadion: wird es am Gästeblock geben - kein ZuschlagTickets über den Kickers-Fanshop:kein VorverkaufZugänge / Gästebereich:Die Kickersfans werden im Gästefanblock D (Stehplätze) untergebracht - der Zugang erfolgt über die Heidelberger Straße Im Gästeblock kann nur mit Bargeld bezahlt werden.Taschen und Rucksäcke dürfen nicht mit ins Stadion genommen werden. Diese bitte im Fahrzeug lassen oder erst gar nicht mitnehmen. Der FCA hat keine Möglichkeit die Taschen und Rucksäcke zu verwahren.im Bereich der Haupttribüne (Block A + B) dürfen keine Fanutensilien angebracht bzw. genutzt werden, dies gilt für Fahnen, Banner und sonstige Fangegenstände.Download Stadionordnungzur Gästefan-Info des FCA WalldorfAnfahrt mit dem Auto / Bus / Parken zum Gästeblock:Autobahn Abfahrt A5 Walldorfer KreuzB291 Richtung WalldorfLinks B291 Westumgehung Richtung Heidelberg / Schwetzingen / SandhausenNach ca. 3,5 km rechts in Heidelberger Strasse Richtung WalldorfNach ca. 2 km (vor dem Kreisverkehr) rechts in den Waldweg zum FC-Astoria StadionAnfahrt mit dem Zug / ÖPNV Bis Bahnhof Wiesloch/Walldorf, dann mit Stadtbus zum Schul- und Sportzentrum WalldorfFAdSKi-Busfahrt oder gemeinsame Zugfahrten:Infos zum Fanbus: Die FAdSKi organisiert einen Bus zum Spiel und bietet auch Leberkäs im Bus an.Abfahrt: 10.30 Uhr Parkplatz GAZi-StadionPreis: 24,99 Euro, für Mitglieder 18.99 EuroAnmeldung: Bus ist ausgebuchtInfos zur Zugfahrt: keine bekanntAnsprechpartner für Kickers-Fans vor Ort:FanBe Gerd Andrae und SiBe Kim-Tobias StehleKickers-Fanprojekt Daniel Metz und Salih DemirkolKollegen der Fanabteilung um Abteilungsleiter Patrick Stelzer"
