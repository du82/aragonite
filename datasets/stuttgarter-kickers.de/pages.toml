title = "Urlaubscamps Porsche Fußballschule - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu den Angeboten der Porsche Fußballschule."
full_description = 'Porsche FußballschuleUrlaubcampsQuick LinksBuchungsportalPorsche FußballschuleFussballcampsMädchencampsZusatztrainingStadionführungKontakt & FAQ der Porsche Fußballschule<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ1gdspbqstJ98QNB_HomepageUrlaubscamp.png%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ1gdspbqstJ98QNB_HomepageUrlaubscamp.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ1gdspbqstJ98QNB_HomepageUrlaubscamp.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>Das Urlaubscamp ist Ausgebucht, es gibt nur noch Plätze auf der WartelisteDasUrlaubscampVerbringt einen unvergesslichen Familienurlaub in der Türkei und verbindet entspannte Auszeit mit der Leidenschaft für Fußball!Wir bieten ein einzigartiges Urlaubserlebnis: Während die Räuberle an einem unserer professionellen Fußballcamps teilnehmen, können sich die Eltern zurücklehnen und die traumhafte Umgebung genießen.Die Kids erwartet von Sonntag bis Dienstag und Donnerstag bis Freitag ein spannendes Training mit zwei individuell abgestimmten Einheiten pro Tag – voller Spiel, Spaß und Teamgeist. Für die Eltern bleibt Zeit, um die Seele baumeln zu lassen, das All-Inclusive-Angebot zu nutzen oder aufregende Ausflüge zu unternehmen.Unsere ersten Urlaubscamps starten in den Osterferienwochen und sind die perfekte Kombination aus sportlicher Betätigung, Familienzeit und Entspannung unter der Sonne.DerLeistungsumfang1. ReisezeitraumHin- und Rückflug: 13. bis 20. April 2025 Camp 1, und 20. bis 27. April 2025 Camp 2Abflughafen: Stuttgart2. Unterkunft und VerpflegungHotel: "The Sense De Luxe Hotel" in SideVerpflegung: All-Inclusive3. TeilnehmerOption 1: 1 Erwachsener + 1 Räuberle mit Fußballpaket (6 - 13 Jahre) ab 2317€Option 2: 2 Erwachsene + 1 Räuberle mit Fußballpaket (6 - 13 Jahre) ab 3371€Option 3: 2 Erwachsene + 1 Kind ohne Fußballpaket + 1 Räuberle mit Fußballpaket (6 - 13 Jahre) ab 4425€Option 4: 2 Erwachsene + 2 Räuberle mit Fußballpaket (6 - 13 Jahre) ab 4634€4. Fußballcamp für KinderDauer: 5 Tage (Sonntag bis Dienstag und Donnerstag bis Freitag)Inhalt: Technisch hochwertiges Fußballtraining unter professioneller Leitung5. PreisPauschalpreis für 8 Tage, 1 Erwachsene und 1 Kind mit Fußballpaket, ab 2317€ (inklusive Flug, Hotel und Fußballcamp)Wichtige HinweiseBuchungsschluss: 30. Januar 2025 – Frühzeitige Anmeldung wird empfohlen!Nutze die einzigartige Gelegenheit, deinen Urlaub mit einem unvergesslichen Fußballerlebnis für dein Räuberle zu verbinden.Die Buchung wird vollständig über unser Buchungsportal abgewickelt: Urlaubscamp – Porsche Fussballschule Stuttgarter KickersAlle weiteren Infos und Bilder zum Hotel: The Sense De Luxe Hotel - Urlaub günstig buchen - Pauschalreisen mit ANEX TourHier geht es zum BuchungsportalQ&A UrlaubscampWas ist das Fußball-Paket?Das Fußball-Paket für die Teilnehmer beinhaltet zweimal am Tag das Waschen des Trikot-Sets (Trikot, Hose, Stutzen), so wie den Transfer vom Hotel zum Fußballplatz und wieder zurück (Fahrzeit ca. 6 Minuten).Das Fußballpaket kann für das Räuberle nicht abgewählt werden!'
