["https://stuttgarter-kickers.de/aktuelles/fanshop-ticket-infos/oeffnungszeiten"]
title = "Öffnungszeiten - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zur 1. Mannschaft, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = 'Fanshop- und Ticket-InfosÖffnungszeitenQuick Linkszum Ticketshop (Eintrittskarten)zum Onlineshop (Fanartikel)Der Kickers-Fanshop und die Geschäftsstelle befinden sich im ADM-Sportpark, Königsträßle 56 in 70597 Stuttgart-Degerloch und nicht direkt am GAZi-Stadion auf der Waldau. Im Kickers-Fanshop erhälst Du von unseren Mitarbeitern alle Informationen, Fan-Artikel, Eintrittskarten, Gutscheine und vieles mehr...Hinweis Verkauf bei Heimspielen:Bei den Heimspielen öffnen die Fanartikel-Verkaufsstände im GAZi-Stadion auf der Waldau, an denen Du die Kickers-Fanartikel erwerben kannst. Ein Stand befindet sich an der Haupttribüne / Kassenanlage Süd und ein Stand unter dem B-Block / Gegengerade. Der Fanshop im ADM-Sportpark ist bei den Heim- oder Auswärtsspielen geschlossen.Öffnungszeiten Geschäftsstelle & Fanshop:Montag: geschlossenDienstag: 15.00 bis 18.00 UhrMittwoch: geschlossenDonnerstag: 15.00 bis 18.00 UhrFreitag: geschlossen, jedoch vor Heimspielen der 1. Mannschaft von 10.00 bis 15.00 Uhr geöffnetSamstag / Sonntag / Feiertag: geschlossenBitte beachten: Bei Heim- oder Auswärtsspielen am Wochenende oder unter der Woche sind der Fanshop und die Geschäftsstelle geschlossen. Telefonische Ereichbarkeit Geschäftsstelle & Fanshop:Montag: 10.00 bis 16.00 UhrDienstag: 10.00 bis 16.00 UhrMittwoch: 10.00 bis 16.00 UhrDonnerstag: 10.00 bis 16.00 UhrFreitag: 10.00 bis 12.00 UhrSamstag / Sonntag / Feiertag: geschlossenKontakt:Adresse:SV Stuttgarter Kickers e.V., Königsträßle 56, 70597 Stuttgart-DegerlochTelefon Geschäftsstelle Zentrale: 0711 / 767 10 - 0Telefon Fanshop & Tickethotline: 0711 / 767 10 - 18Telefax: 0711 / 767 10 - 10E-Mail Fanshop: fanshop@stuttgarter-kickers.deE-Mail Eintrittskarten: tickets@stuttgarter-kickers.deE-Mail Onlineshop: onlineshop@stuttgarter-kickers.deAnfahrtsbeschreibung zum Fanshop mit dem Auto:Von der Autobahn (A8) kommend, Ausfahrt Stuttgart-Degerloch / Möhringen (Ausfahrt 52b), in Richtung Stuttgart einordnen. Auf der Bundesstraße 27 (B27) in Richtung Stuttgart-Degerloch fahren. In Degerloch auf die "Jahnstraße" Richtung Fernsehturm / Waldau-Stadion (ist ausgeschildert) rechts abbiegen. Nach 800m rechts abbiegen ins Königsträßle (Bushaltestelle mit Fußgängerampel). Nach 500m im Königsträßle siehst Du den ADM-Sportpark rechter Hand gut sichbar durch die Schilder an der Einfahrt. Der Fanshop befindet sich gleich am Eingang zum Gelände in dem Glas-Container. Anfahrtsbeschreibung zum Fanshop mit der U-Bahn:Vom Stuttgarter Hauptbahnhof mit der U7 Richtung Ostfildern-Nellingen bis zur Haltestelle Waldau / GAZi-Stadion. Zum ADM-Sportpark geht es über den Georgii-Weg ins Königssträßle, vorbei an der Waldschule. An der Kreuzung Georgii-Weg / Königsträßle links halten, nach ca 300m siehst du den ADM-Sportpark rechter Hand gut sichbar durch die Schilder an der Einfahrt. Der Fanshop befindet sich gleich am Eingang zum Gelände in dem Glas-Container.'
