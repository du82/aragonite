title = "Ticket-AGBs, Stadionordnung und Polizeiverordnung - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu 1. Mannschaft, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = "Fanshop- und Ticket-InfosTicket-AGBs, Stadionordnung und PolizeiverordnungAllgemeine Hinweise:Beim Kauf der Eintrittskarte erkennt der Kunde die Allgemeinen Geschäftsbedingungen der Stuttgarter Kickers, die Stadionordnung der LHS Stuttgart für das GAZi-Stadion auf der Waldau sowie die Polizeiverordnung der LHS Stuttgart für das GAZi-Stadion auf der Waldau an.Die Eintrittskarte ist den von den Stuttgarter Kickers beauftragten Personen und dem Ordnungsdienst auf Verlangen vorzuzeigen. Bei Verlust der Eintrittskarte, Spielausfall, Abbruch der Veranstaltung oder Spielverlegung wird kein Ersatz geleistet.Die Eintrittskarte berechtigt nicht, Kinder oder Begleitpersonen mitzunehmen. Kinder unter 6 Jahre erhalten an allen Kassen eine „Kinder-Freikarte“, die aus Versicherungsgründen ausgegeben wird.Die Stuttgarter Kickers haften nicht für fahrlässig verursachte Sachschäden.Jeder Besucher willigt unwiderruflich für alle gegenwärtigen und zukünftigen Medien in die unentgeltliche Verwendung seines Abbildes und seiner Stimme für Fotografien, Live-Übertragungen, Sendungen und/oder Aufzeichnungen von Bild und/oder Ton, die im Zusammenhang mit der Veranstaltung erstellt werden, ein.Das GAZi-Stadion auf der Waldau ist während der Veranstaltung videoüberwacht.Das Mitbringen ist untersagt von (Auszug aus der Stadionordnung):große und spitze Regenschirme oder Stöcke -> bei regnerischem Wetter sind nur kleine Taschenschirme / Knirpse erlaubtRucksäcke / Taschen / Handtaschen größer als DIN A4 -> müssen an den Verwahrstellen abgegeben werdenSpeisen und Getränken jeglicher Art, auch ObstFlaschen (Glas und PET), Thermoskannen oder Dosen jeglicher Art und Größe -> als Ausnahme für Familien, Behinderte oder Bedürftige ist pro Person ein Tetra-Pack bis zu einer Größe von 0,5 Liter erlaubtTierenWaffen / Messer jeglicher ArtDrogen jeglicher ArtFeuerwerkskörpern und Pyrotechnik jeglicher Artals Wurfgeschosse verwendbare Gegenstände (z.B. Flaschen und Dosen)sperrige oder spitze Gegenstände (z. B. Koffer, Hocker, Helme, Leitern, Stühle, Fahrräder, etc)Transparenten mit rechts- oder sittenwidriger Aussageprofessionellen Video- und Fotokameras, bitte melden lassen Sie sich akkreditierendas Mitführen und Abringen von AufklebernAkkupacks, Powerbanks und sonstige elektronische Geräte (z.B. elektrisch betriebene Lärminstrumente) -> Handy, MP3-Player oder E-Zigaretten sind erlaubtBrandförderndes oder brandlasterhöhendes Material (mindestens B1 schwerentflammbar)Kinderwägen / Buggys:Stehplatzbereich: wir erlauben den Eltern das Mitnehmen von Kinderwägen an die Ecke vom G-Block / Haupttribüne am Fanshop oder zwischen G-Block und A-Block, die Eltern dürfen mit Ihren Kinderwägen entlang des Zauns stehen. Die Kinderwägen dürfen nicht mit in den Stehplatzblock genommen werden bzw. in Flucht- & Rettungswegen abstellen.Sitzplatzbereich: wir erlauben den Eltern das Mitnehmen von Kinderwägen auf die Haupttribüne über die Aufzüge hoch in Ebene 1, die Eltern dürfen ihre Kinderwagen im Rollstuhlfahrerbereich E6 Reihe 5 oder E2 Reihe 5 abstellen, solange Platz verfügbar ist, alternativ unter der Tribünenschräge, wenn kein Flucht- oder Rettungsweg beeinträchtigt wird . Die Kinderwägen dürfen nicht mit in den Sitzplatzbereich genommen werden.Business- / VIP-Bereich: Die Gäste dürfen mit dem Kinderwagen in den VIP-Bereich, jedoch nicht raus in den Sitzplatzbereich.Rollstuhlfahrer, Rollatoren und Behinderte Rollstuhlfahrer oder Inhaber von Rollatoren haben ihre Plätze im separaten und exklusiven Rollibereich der Haupttribüne Block E6 (und ggf. E2), Zugang hinter der Haupttribüne über den Aufzug in Ebene 1 mit separaten und behindertengerechten ToilettenAm Einlass werden für Behinderte / Bedürtige gerne auch Ausnahmen gemacht (z.B. Verpflegung, Materialien, etc.)Außerdem gilt es zu beachten:im Stadion gilt das Vermummungsverbotam Stadion können Durchsuchungsmaßnahmen von Personen und mitgeführten Sachen und Alkoholkontrollen durchgeführt werdendas Be- und Übersteigen von Zäunen, vor allem zum Innenraum / Spielfeld hin, ist verboten, da der Zaun bereits als Teil des Innenraums angesehen wirdChoreographien:Alle Informationen zu geplanten Choreographien müssen spätestens drei Wochen vor dem Heimspiel beim Sicherheitsbeauftragten Kim-Tobias Stehle eingereicht werden.Verwahrstellen:Im Stadion sind an drei Eingängen Verwahrstellen eingerichtet, an denen kostenfrei Taschen, Rücksäche, Helme, große Schirme, etc. abgegeben werden können:an Kassenanlage Süd direkt am Eingang / Tor 12an Kassenanlage Nord direkt am Eingang / Tor 2 (zur Zeit geschlossen)Verwahrcontainer neben dem Einlass außerhalb an Tor 5 (nur wenn Gästebereich geöffnet)Die Ticket-AGB's, Stadionordnung und Polizeiverordnung als DownloadDie aktuelle Stadionordnung für das GAZi-Stadion auf der WaldauDie aktuelle Polizeiverordnung für das GAZi-Stadion auf der WaldauDie Allgemeinen Ticket-Geschäftsbedingungen des SV Stuttgarter Kickers für den Erwerb von Eintrittskarten"
