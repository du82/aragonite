full_description = 'Porsche FußballschuleSpieltagscamp oder BÜRGER EinlaufkinderQuick LinksBuchungsportalPorsche FußballschuleFussballcampsMädchencampsZusatztrainingStadionführungKontakt & FAQ der Porsche Fussballschule<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fcad47f9d-d063-4537-9443-011d6d032dcd_B%25C3%259CRGER%2BEinlaufkinder%2B3.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>Ihr wolltet schon immer einmal als Einlaufkind Hand in Hand mit einem Kickers-Spieler aus den Katakomben des GAZi-Stadions auf der Waldau auf den Rasen einlaufen? Bejubelt von über ein paar tausend Fans?Als Verein könnt Ihr Euch im Rahmen eines Spieltagscamps über unsere Fußballschule oder über folgende E-Mail-Adresse fussballschule@stuttgarter-kickers.de bewerben. Dazu bitte die Wunschpartie und die Anzahl der Kinder angeben. Bitte beachtet, dass max. 22 Kinder einlaufen können.zum Buchungsportal der FußballschuleAls Mitglied im Kickers Kids Club könnt Ihr Euch als Spieltags-Kind bewerben. Das Spieltags-Kind darf exklusiv mit Waldi einlaufen. Als Mitglied im Kickers Kids Club kannst Du Dich exklusiv darauf bewerben. Wenn Du im Losverfahren gezogen wirst, bekommst Du rechtzeitig eine Benachrichtigung und darfst mit Waldi und den Mannschaften gemeinsam einlaufen.Bewirb Dich jetzt unter: einlaufkinder@stuttgarter-kickers.deWeitere Informationen zu unserem Kickers Kids ClubAlle anderen kleinen Kickers-Fans, die in keinem Verein sind, können sich über folgende E-Mail-Adresse einlaufkinder@stuttgarter-kickers.de als BÜRGER Einlaufkind bewerben. Dazu bitte die Wunschpartie angeben und mit viel Glück seid Ihr dabei. Bei jedem Heimspiel haben noch einzelne Kinder die Möglichkeit, als Einlaufkind dabei zu sein. FAQ-Bereich - die häufigsten Fragen:Wie alt darf das Kind sein?Das Alter der Einlaufkinder ist auf 6 bis 11 Jahre beschränkt. Wann muss das Einlaufkind am Spieltag vor Ort sein?Alle Einlaufkinder treffen sich am Spieltag 60 Minuten vor Anpfiff außerhalb des Stadions an der Kassenanlage Süd / Tor 10 und werden dort von den Kickers-Mitarbeitern/innen in Empfang genommen.Bekommt das Einlaufkind eine Eintrittskarte?Alle Einlaufkinder erhalten zwei Eintrittskarten im Steh- oder Sitzplatzbereich (je nach Verfügbarkeit / Stadionauslastung) - eine Karte für sich selbst und eine weitere Karte für eine Begleitperson. Zusätzliche Tickets für weitere Angehörige / Freunde müssen separat erworben werden.Was muss das Einlaufkind mitbringen?Die Einlaufkinder sollten bitte Turnschuhe mitbringen. Stutzen, Short und T-Shirt bekommen die Kinder am Spieltag vom Verein gestellt. Einverständniserklärung<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F9b615abf-c896-4aca-8875-e9566b520736_Einlaufkinder%2BBelinda%2BWeller.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F9b615abf-c896-4aca-8875-e9566b520736_Einlaufkinder%2BBelinda%2BWeller.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F9b615abf-c896-4aca-8875-e9566b520736_Einlaufkinder%2BBelinda%2BWeller.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F9b615abf-c896-4aca-8875-e9566b520736_Einlaufkinder%2BBelinda%2BWeller.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F9b615abf-c896-4aca-8875-e9566b520736_Einlaufkinder%2BBelinda%2BWeller.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F9b615abf-c896-4aca-8875-e9566b520736_E