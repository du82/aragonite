title = "Dauerkarten - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers - Hier findest Du alle Informationen zu den Dauerkarten für die Kickers-Heimspiele"
full_description = 'Fanshop- und Ticket-InfosDauerkartenQuick LinksHier gleich die Dauerkarte im Ticketshop erwerben!Aktuelle DauerkartenpreiseHerzlichen Dank für Dein Interesse an einer Dauerkarte! Auf dieser Seite findest Du alle Informationen zu den Dauerkarten und viele Antworten auf etwaige Fragen.Liebe Kickers-Fans,gemeinsam und hochmotiviert sind wir Anfang Juni 2024 in unser 125-jähriges Jubiläumsjahr und in die neue Saison in der Regionalliga Südwest, die am letzten Juli-Wochenende begonnen hat, gestartet.Der Dauerkarten-Verkauf für diese Saison ist am Freitag, 7. Juni 2024 für die bestehenden Dauerkarteninhaber und am Montag, 10. Juni 2024 mit dem freien Verkauf gestartet. Alle Dauerkartenbesitzer der vergangenen Saison wurden am 7. Juni 2024 zwischen 11 und 12 Uhr von uns bzw. unserem Ticketing-Partner vivenu per E-Mail angeschrieben und haben bis Sonntag, 7. Juli 2024 Zeit, ihre Steh- oder Sitzplatzdauerkarten zu verlängern.Tickets für Einzelspiele sind immer erhältlich, sobald die Spiele zeitgenau terminiert wurden. Die Spiele werden analog der letzten Spielzeit immer blockweise nach den Terminierungen der überklassigen Bundesligen angesetzt.Was uns besonders wichtig ist: trotz der allgemein weiter steigenden Preise werden wir die Eintrittspreise für die Tages- und Dauerkarten unverändert lassen und nicht erhöhen. Dauerkarteninhaber profitieren weiterhin von bis zu 20 % Rabatt im Vergleich zum Einzelkartenkauf und erhalten ein Vorkaufsrecht für das Jubiläumsturnier am 20. Juli 2024 gegen den SSV Jahn Regensburg und FC Blau Weiß Linz sowie weitere Sonderaktionen im Laufe der Saison.Sollte es innerhalb der Blauen Familie Fans geben, die unseren gemeinsamen Verein aufgrund stark eingeschränkter finanzieller Möglichkeiten nicht mehr mit dem Kauf einer Dauerkarte unterstützen können, schreibt uns gerne vertraulich eine E-Mail an tickets@stuttgarter-kickers.de. Mittels alternativer Zahlungsmodelle oder durch die Unterstützung unserer Partner versuchen wir dann eine gemeinsame Lösung zu finden. Die genauen Buchungsprozesse für bisherigen Dauerkarten-Inhaber und neue Dauerkarten-Interessenten haben wir nachstehend erläutert.Verkaufsstart / Versand der Plastik-Scheckkarten / Anzahl an Dauerkarten Saison 2024/25:Verkaufsstart: Freitag, 07.06.2024 für bestehende Dauerkarteninhaber und Montag, 10.06.2024 im freien VerkaufVersand der Dauerkarten als Plastik- / Scheckkarten: erfolgt seit dem 11. Juli 2024 und während der Saison in regelmäßigen Abständen / je nach Bestellungen durch unseren Partner vivenuAnzahl Dauerkarten Regionalliga Saison 24/25: 1.686 (Stand 24.02.2025)Anzahl Dauerkarten Regionalliga Saison 23/24: 1.640Anzahl Dauerkarten Oberliga-Saison 2022/23: 1.280Anzahl Dauerkarten Oberliga Saison 2021/22: 1.016Anzahl Dauerkarten Oberliga Saison 2020/21: -Anzahl Dauerkarten Oberliga Saison 2019/20: 968Anzahl Dauerkarten Oberliga Saison 2018/19: 945Anzahl Dauerkarten Regionalliga Saison 2017/18: 1.023Anzahl Dauerkarten Regionalliga Saison 2016/17: 1.013Anzahl Dauerkarten 3. Liga Saison 2015/16: 1.378Anzahl Dauerkarten 3. Liga Saison 2014/15: 1.274Anzahl Dauerkarten 3. Liga Saison 2013/14: 1.089Anzahl Dauerkarten 3. Liga Saison 2012/13: 1.308Infos zu den Dauerkarten:Die Dauerkarte kann als E-Ticket / print@home auf dem Smartphone (Wallet, pdf, p@h-Ticket), auf Papier ausgedruckt oder als Plastikkarte / Scheckkarte (gegen 4,50 Euro Gebühr) am Stadioneinlass vorgezeigt werden, dort wird der QR-Code oder Barcode gescannt;Die Eintrittspreise sind hier veröffentlicht, den Stadionplan / Stadioneinteilung findest Du hier;Das VVS-KombiTicket ist bei Kaufkarten (keine Frei- & Ehrenkarten) im Karten­preis bei den Tages- oder Dauerkarten beinhaltet;Versand der Dauerkarten als Plastikkarte / Scheckkarte:Die Dauerkarte als Plastikkarte / Scheckkarte wird an alle Fans, die die Dauerkarte nicht als E-Ticket erworben haben, seit 11. Juli 2024 von unserem Partner Vivenu produziert und postalisch an die im Kundenstamm angegebene Adresse verschickt.Erläuterungen zum Bestellprozess im Ticketshop: Der Bestellprozess für bisherige Dauerkarten-Inhaber:Alle Dauerkarteninhaber der letzten Spielzeit 2023/24 wurden am 7. Juni 2024 zwischen 11 und 12 Uhr von unserem Partner vivenu (Absender der E-Mail ist SV Stuttgarter Kickers Ticketing / vivenu, ggf. Spam-Postfach prüfen) angeschrieben und erhielten eine automatische Reservierungs-Bestätigung per E-Mail zugeschickt. Solltest du mehrere Dauerkarten über dein Kundenkonto bestellt haben, erhältst du auch mehrere automatische Reservierungs-Bestätigungen für jede Dauerkarte zugeschickt. Wir empfehlen, für jede Dauerkarte ein eigenes Kundenkonto anzulegen, um z.B. an zukünftigen Ticket-Aktionen teilnehmen zu können. Bitte prüfe zudem, ob du deine korrekte und vollständige Adresse im Kundenstamm hinterlegt hast. In der Reservierungs-Bestätigung ist die Dauerkarte der letzten Saison (Stehplatz-Block oder Stammplatz auf der Haupttribüne) als Vollzahler, mit entsprechender Rabattstufe oder Kind /Jugend hinterlegt. Ebenso ist automatisch die damals ausgewählte Art der Dauerkarte hinterlegt, ob du deine Dauerkarte als E-Ticket / print@home-Ticket oder als kostenpflichtige Plastikkarte / Scheckkarte (Gebühr von 4,50 Euro) postalisch zugestellt bekommst.Möchtest du Änderungen zur neuen Spielzeit vornehmen, kannst du die Reservierungs-Bestätigung ignorieren. Bitte setze Dich in diesem Fall mit den Kickers in Verbindung (tickets@stuttgarter-kickers.de) und teile uns deine Änderungswünsche mit. Die alte Reservierung wird dann storniert, dir neu ausgestellt und per E-Mail verschickt.Wenn alles passt, kannst du den Dauerkartenkauf über den Link in der E-Mail mit der Zahlung (PayPal, Kreditkarte, Onlinebanking Giropay / Sofort / Klarna / iDEAL oder Apple Pay/Google Pay) in deinem Kundenkonto abschließen. Über den Warenkorb oder dein Kundenkonto kannst du auch nochmals den Stehplatz-Block, die Sitzplatznummer oder die Art der Dauerkarte einsehen. Wenn die Buchung und Bezahlung erfolgt sind, musst du im letzten Schritt die Personalisierung vornehmen, damit auf der Dauerkarte auch der korrekte Name erscheint. Abschließend erhältst du automatisiert deine Dauerkarte per E-Mail und diese ist in Deinem Kundenkonto hinterlegt. Die Plastikkarte / Scheckkarte wird dir ab dem 11. Juli 2024 postalisch von unserem Partner Vivenu zugeschickt. Eine Abholung der Plastikkarte / Scheckkarte im Kickers-Fanshop ist daher nicht möglich.Die Dauerkarten sind über die Reservierungs-Bestätigung bis zum 7. Juli 2024 für Dich reserviert - danach verfällt diese automatisch und die Stammsitzplätze gehen in den freien Verkauf.Wenn du kein Interesse an der Verlängerung deiner Dauerkarte hast, kannst du die Reservierungs-Bestätigung ignorieren, diese verfällt automatisch ab dem 7. Juli 2024 oder du schickst uns eine kurze Info (tickets@stuttgarter-kickers.de), damit wir den Platz früher freigeben können.Der Bestellprozess für neue Dauerkarten-Interessenten:Als erstes musst du dir ein Kundenkonto (rechts oben „anmelden“) in unserem Ticketshop anlegen. Bitte prüfe, ob du deine korrekte und vollständige Adresse im Kundenkonto hinterlegt hast. Wir empfehlen, für jede Dauerkarte ein eigenes Kundenkonto anzulegen, um z.B. an zukünftigen Ticket-Aktionen teilnehmen zu können. Suche dir im Stadionplan deinen gewünschten Stehplatzblock oder Sitzplatz auf der Haupttribüne aus. Es können auch mehrere Dauerkarten pro Buchung ausgewählt werden, empfehlen aber für jede Dauerkarte ein eigenes Konto zu verwenden.Wähle nun die entsprechende Kategorie / Rabattstufe aus. Nun hast du die Wahl, ob du deine Dauerkarte als digitales E-Ticket / print@home-Ticket möchtest (E-Ticket / Wallet / pdf auf dem Smartphone oder als print@home ausgedruckt) oder ob du gegen eine Gebühr von 4,50 Euro eine Plastikkarte / Scheckkarte postalisch von unserem Partner vivenu erhalten möchtest.Im nächsten Schritt kannst du unter "Fortfahren" deine Reservierung abschließen.Ergänzend solltest du deine Mitgliedsnummer, den Sponsorname oder den Grund einer etwaigen Ermäßigung angeben und den Ermäßigungsnachweis hochladen.Abschließend bitte die „Anfrage stellen“ und die Kickers-Mitarbeiter werden schnellstmöglich deine Dauerkarte freigeben. Die Anfrage dient in erster Linie der Überprüfung der Rabattstufen (Mitglied, ermäßigter Personenkreis, etc.) mit den uns aus den früheren Spielzeiten vorliegenden oder hochgeladenen Unterlagen. Bei den Sitzplätzen wird entsprechend überprüft, ob der korrekte Stammplatz ausgewählt wurde bzw. ob der Sitzplatz frei ist.Nach unserer Überprüfung erhältst du eine Reservierungsbestätigung und kannst den Kauf innerhalb von 7 Tagen mit der Zahlung (PayPal, Kreditkarte, Onlinebanking Giropay / Sofort / Klarna / iDEAL oder Apple Pay / Google Pay) abschließen. Solltest du nicht innerhalb von 7 Tagen bezahlen, wird die Reservierungsbestätigung automatisch storniert und der Platz wieder für den Verkauf freigegeben.Wenn deine Anfrage abgelehnt werden musste, werden sich die Kickers-Mitarbeiter mit dir in Verbindung setzen, damit du eine neue Anfrage stellen kannst. Wenn die Buchung und Bezahlung funktioniert haben, musst du im letzten Schritt die Personalisierung vornehmen, damit auf der Dauerkarte auch dein Name bzw. des Karteninhabers / Kartennutzers angezeigt (E-Ticket) bzw. aufgedruckt wird (Plastikkarte / Scheckkarte). Abschließend erhältst du automatisiert deine Dauerkarte per E-Mail und diese ist in Deinem Kundenkonto hinterlegt. Die Plastikkarte / Scheckkarte wird ab dem 11. Juli 2024 postalisch von unserem Partner Vivenu zugeschickt. Die Abholung der Plastikkarte / Scheckkarte im Kickers-Fanshop ist daher nicht möglich.Bestellung im Kickers-Fanshop:Solltet Du keine Möglichkeit einer Online-Bestellung in unserem Ticketshop haben oder nutzen wollen, kannst du Dich an die Kollegen im Kickers-Fanshop wenden, die für Dich die Buchung im Ticketshop vornehmen werden.Kontakt:Sollten noch Fragen sein, stehen wir Dir gerne zur Verfügung:Telefon: 0711 / 767 10 - 18Telefax: 0711 / 767 10 - 10E-Mail: tickets@stuttgarter-kickers.deAnschrift: SV Stuttgarter Kickers, Ticketing, Königsträßle 56, 70597 Stuttgart-Degerloch. Öffnungszeiten: Bitte beachte die Fanshop-Öffnungszeiten!Der Fanshop befindet sich im ADM-Sportpark in Stuttgart-Degerloch und nicht am GAZi-Stadion auf der Waldau.Hospitality & Business- / VIP-DauerkartenErlebe die Spiele der Stuttgarter Kickers in unserer exklusiven und hochwertigen "Spielbank Stuttgart Business-Lounge" im GAZi-Stadion auf der Waldau. Es erwarten Dich zwei verschiedene Business-Kategorien, die Dir ein tolles Netzwerk-Erlebnis bieten. Dank unserer treuen Catering-Partner können wir mit unserem Stadion-Caterer „Schmücker Gastro & Catering GmbH“ den Gästen ein abwechslungsreiches Angebot an warmen und kalten Speisen sowie ein umfangreiches Getränkeangebot zur Verfügung stellen.Unsere Gäste können dabei den familiären Charakter in unserer „Spielbank Stuttgart Business-Lounge“ für interessante Gespräche mit Kunden oder zur Pflege und Ausbau des Netzwerks in unserem exklusiven Business-Umfeld mit über 100 Partnern nutzen.Analog den früheren Spielzeiten werden wir wieder unsere Business-Kategorie "CLASSIC" an fest zugewiesenen Stehtischen sowie die Business-Kategorie „PREMIUM“ mit fest zugewiesenen Sitzplätzen an den Tischen anbieten.Der Business-Bereich befindet sich auf der zweiten Ebene der Haupttribüne, der Zugang befindet sich über Kassenanlage Süd und im hinteren Bereich der Haupttribüne über die Welcome-Zone. Der Business-Bereich öffnet zur Stadionöffnung - in der Regel 60 bis 75 Minuten vor Spielbeginn - und bleibt bis ca. 90 Minuten nach Spielende geöffnet.Sichern Sie sich eine der begehrten Business-Dauerkarten oder Tageskarten für die Heimspiele im GAZi-Stadion auf der Waldau!Gerne beraten Sie unsere Mitarbeiterinnen und Mitarbeiter der Geschäftsstelle persönlich unter Telefon 0711 / 76710 - 18 sowie per Mail unter tickets@stuttgarter-kickers.de.Weitere Informationen findest du auf unserer Business-HomepageInfo-Flyer VIP-Karten Saison 2024/25Flyer VIP- / Hospitality- / Business-Karten Saison 2024/25Weitere Informationen zu den Dauerkarten:Stammplätze auf der HaupttribüneAlle Stammplätze auf der Haupttribüne aus der letzten Saison haben wir übernommen / reserviert.Die Sitzplatz-Dauerkarteninhaber hatten bis zum 7. Juli 2024 ein Vorkaufsrecht auf ihren Platz.Gültigkeit der DauerkarteDie Regionalliga-Saison 2024/25 wird mit 18 Teams gespielt, das bedeutet es gibt 17 Heimspiele auf der Waldau. Die Dauerkarten gelten ausschließlich für die Heimspiele in der Regionalliga, nicht für die Pokalwettbewerbe (DFB- oder wfv-Pokal), Auswärtsspiele, etwaige Aufstiegsspiele oder Jugendspiele.VVS-Kombi-TicketAlle Zuschauer können mit den Eintrittskarten (nur Kaufkarten, keine Frei- & Ehrenkarten) ohne zusätzliche Kosten per öffentlichem Nahverkehr zu den Spielen im GAZi-Stadion auf der Waldau an- und abreisen. Die Eintrittskarten berechtigen zur Fahrt zum Stadion ab drei Stunden vor Spielbeginn und zur Rückfahrt nach Spielende bis Betriebsschluss mit allen VVS-Verkehrsmitteln (2. Klasse) innerhalb des Geltungsbereiches des VVS-Gemeinschaftstarifs. Das VVS-Ticket ist nicht übertragbar. Frei- & Ehrenkarten berechtigen nicht als VVS-KombiTicket.DauerkartenverlustBei Verlust der Dauerkarte bitten wir um eine ausdrückliche schriftliche Verlusterklärung.Die Dauerkarte wird dann gegen eine Bearbeitungsgebühr von 10,- Euro nachgedruckt.HygienevorschriftenSeit 3. April 2022 gilt in Baden-Württemberg eine Corona-Verordnung, durch welche die weitreichenden Schutzmaßnahmen sowie Corona-Beschränkungen entfallen und eine 100%ige Stadionauslastung erlaubt ist.Die Kickers-Heimspiele im GAZi-Stadion auf der Waldau können damit ohne gesundheitliche Zugangsregelungen (z.B. 3G-Nachweis, Testnachweis, etc.) und ohne Maskenpflicht besucht werden.Catering im StadionDie Gastro-Verkaufsstände sind mit dem vollen Speisen & Getränkeangebot geöffnet.Der Ausschank von Alkohol ist erlaubt - lediglich bei Risikospielen kann es Auflagen / Verbote durch die Sicherheitsbehörden geben.Umweltzone Stuttgart:Das GAZi-Stadion auf der Waldau befindet sich innerhalb der Umweltzone Stuttgart, bitte denken Sie an eine Umweltplakette. Stuttgart-Degerloch und das Waldau-Sportgebiet gehören zur Umweltzone, die von den Diesel-Fahrverbot und ggf. bei einem Feinstaubalarm betroffen sind.AGBs und StadionordnungBeim Kauf der Eintrittskarte erkennt der Kunde unsere allgemeinen Ticket-Geschäftsbedingungen und die Stadionordnung an. Alle wichtigen Informationen, Verbote und Regelungen für Ihren Besuch im GAZi-Stadion auf der Waldau finden Sie hier.AGBs und StadionordnungRabatt für MitgliederFür die Kickers-Mitglieder wird es weiterhin eine eigene Preisklasse geben, die vor allem im Sitzplatzbereich greift. In diesem Zusammenhang verweisen wir gerne auf unsere Mitglieder-Aktion „Lebenslange Mitgliedschaft für 1899,- Euro“ oder auf eine normale Mitgliedschaft in unserem Verein. Die Ermäßigung gilt selbstverständlich a'
