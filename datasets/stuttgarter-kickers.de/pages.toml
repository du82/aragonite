["http://stuttgarter-kickers.de/fans/b-block/b-block-stuttgart"]
title = "B-Block Stuttgart e.V - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = "FansB-Block Stuttgart e.VDer B-Block im Waldaustadion ist der Mittelpunkt der Kickers-Fanszene. Trotz des sportlichen Niedergangs in den zurückliegenden Jahren, ist die Anzahl an Kickers-Fans dort erfreulicherweise gewachsen. Mittlerweile sind eine Vielzahl von Gruppen und Einzelpersonen dort anzutreffen, die sich hinter der B-Block-Zaunfahne versammeln. Auch der optische Support hat in den letzten Jahren Fortschritte gemacht. Waren früher Choreos eher eine Ausnahme, sind sie mittlerweile neben weiteren optischen Aktionen mehrmals in einer Saison zu sehen. Hinter jeder Choreo steckt nicht nur ein enormes Engagement vieler Personen, auch der finanzielle Aufwand ist dementsprechend gewachsen. Das Geld kommt vorrangig aus der aktiven Fanszene selbst. Aber auch die Becherspenden bei jedem Heimspiel tragen dazu bei. Hinzu kommen viele Einzelspenden aus dem Fanszene-Umfeld.In den zurückliegenden Jahren wurden jedoch auch die Repressionen gegen Fußballfans immer größer. Auch wir sind davon betroffen. Durch das neue Polizeigesetz in Baden-Württemberg (PolG BW) wurden die Handlungsmöglichkeiten der Polizei gegen Fans weiter verschärft. Auch aus der Kickers-Fanszene gab es Beteiligung an den Protesten gegen dieses Vorhaben. Es besteht der Wunsch, den Kampf um Fanrechte weiter fortzuführen und zu professionalisieren. Aus diesem Grund wurde die Kickers-Rechtshilfe ins Leben gerufen, die alle Kickers-Fans bei Problemen mit Polizei und Sicherheitsbehörden berät und solidarisch zur Seite steht. Mit dem B-Block Stuttgart e.V. sollen diese Aktivitäten fortan gebündelt werden. Der Verein steht allen offen, die die Kickers-Fanszene ideell aber auch finanziell unterstützen möchten. Es ist ganz egal, ob man im B-Block steht, seinen angestammten Platz hinter dem Tor hat, auf der Haupttribüne sitzt, ob man eine Dauerkarte hat oder nur vereinzelt zu Spielen kommt: alle, die sich mit den Stuttgarter Kickers verbunden fühlen, sind als Fördermitglied willkommen.Kontakt:Wenn Du uns kontaktieren möchtest, findest Du uns bei Heimspielen am Fanstand beim Aufgang zum B-Block.Für schriftliche Anfragen, kannst Du uns unter folgender E-Mail kontaktieren:info@b-block-stuttgart.deMöchtest Du uns per Post erreichen, kannst Du das unter folgender Adresse tun:B-Block Stuttgart e.V., c/o Fanprojekt Stuttgart, Alexanderstraße 17, 70184 StuttgartViele Infomationen findest du auf unser Homepage:https://b-block-stuttgart.de"
