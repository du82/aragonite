["https://stuttgarter-kickers.de/nachwuchs/porsche-fussballschule/maedchencamp"]
title = "Mädchencamps Porsche Fußballschule - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu den Angeboten der Porsche Fußballschule."
full_description = 'Porsche FußballschuleMädchencampsQuick LinksBuchungsportalPorsche FußballschuleFussballcampsMädchencampsZusatztrainingStadionführungKontakt & FAQ der Porsche Fußballschule<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbdf4152f-772f-40f9-a03e-e6abf5c87b57_M%25C3%25A4dchencamps%2BHomepage.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbdf4152f-772f-40f9-a03e-e6abf5c87b57_M%25C3%25A4dchencamps%2BHomepage.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbdf4152f-772f-40f9-a03e-e6abf5c87b57_M%25C3%25A4dchencamps%2BHomepage.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>„Girls can do anything”, “Sei deine eigene Heldin”DieMädelsUm unsere weiblichen Räuberle individueller fördern zu können, bieten wir Camps nur für Mädels an. Jedes fußballbegeisterte Mädchen im Alter von 6 bis 14 Jahren hat die Chance einmal wie Profis zu trainieren. Das Ziel der Camps ist es „Spaß und Entwicklung“ zu vereinen. Hier spielt es keine Rolle, ob du Fußballneuling bist oder bereits in einem Verein spielst. Jede Spielerin ist bei uns willkommen. Durch unser systematisches Ausbildungskonzept und unseren qualifizierten Trainer/innen profitieren alle Räuberle gleichermaßen von unseren Trainingsangeboten.Feriencamps werden in allen Schulferien (Sommer, Herbst, Winter, Ostern, Pfingsten) angeboten. Die Camps starten täglich um 10 Uhr und enden um 16 Uhr. Nach einer Trainingseinheit am Morgen gibt es eine gemeinsame Mittagspause mit Mittagessen. Danach wird die zweite Trainingseinheit des Tages absolviert. Für unsere weiblichen Räuberle werden auch Wochenend- und Spieltagscamps angeboten. Zusätzlich werden von Kooperationsvereinen auf deren eignem Vereinsgelände ebenfalls Mädchencamps angeboten.Zu den SpieltagcampsAuf dieser Seite könnt ihr euch informieren überPorsche Fußball-Mädchencamps bei den KickersDie Mädchencamps finden während den Ostern-, Pfingst-, Sommer-, Herbst- und Winterferien statt. Im Winter finden die Camps in der Halle statt, ansonsten im ADM-Sportpark oder auf der Bezirkssportanlage Waldau in Stuttgart-Degerloch. Die Trainingszeiten sind täglich von 10 bis 16 Uhr. Was euch erwartet:Training:Altersgerechtes Training für Räüberle im Alter von 6 bis 14 Jahren Spannende Wettbewerbe und AbschlussformenAusstattung:Trikot-Set bestehend aus Trikot, Hose und Stutzen von Uhlsport Eigener Fußball mit Kickers LogoDie restliche Ausrüstung (Schuhe, Duschsachen, ggf. Sweatshirt, Pants, Regenjacke, ...) bitte selbst mitbringenEmpfohlenes Schuhwerk: Multinocken / Tausendfüßler, Nockenschuhe, Turnschuhe (keine Stollenschuhe, außer es wird auf der Live-Page ausdrücklich verlangt!)Verpflegung:Warmes Mittagessen an allen Camp Tagen inklusive GetränkenEnsinger-Mineralwasser während des Trainings an allen TagenVeranstaltungstermine sowie die Anmeldung laufen online über unser Buchungsportal ab. Wir freuen uns auf euch!Jetzt AnmeldenMädchencamps bei KooperationsvereinenDie Porsche Fußballschule Stuttgarter Kickers kooperiert mit vielen anderen Vereinen in der Umgebung. Es werden Feriencamps auf den jeweiligen Vereinsgelände der Kooperationsvereine angeboten. Die Trainingszeiten sind täglich von 10 bis 16 Uhr. Was euch erwartet:Training:Altersgerechtes Training für Räuberle im Alter von 6 bis 14 Jahren Spannende Wettbewerbe und AbschlussformenAusstattung:Trikot-Set bestehend aus Trikot, Hose und Stutzen von Uhlsport Eigener Fußball mit Kickers LogoDie restliche Ausrüstung (Schuhe, Duschsachen, ggf. Sweatshirt, Pants, Regenjacke, ...) bitte selbst mitbringenEmpfohlenes Schuhwerk: Multinocken / Tausendfüßler, Nockenschuhe, Turnschuhe (keine Stollenschuhe, außer es wird auf der Live-Page ausdrücklich verlangt!)Verpflegung:Warmes Mittagessen an allen Camp Tagen inklusive GetränkenMineralwasser während des Trainings an allen TagenVeranstaltungstermine sowie die Anmeldung laufen online über unser Buchungsportal ab. Wir freuen uns auf euch! Jetzt AnmeldenMädchen Spieltagcamps vor den Kickers-HeimspielenIhr möchtet euer Fußballtraining mit einem Stadionbesuch verbinden? Dann ist unser Spieltagscamp der Kickers-Fußballschule genau das Richtige für euch. Unter dem Motto „Spaß und Entwicklung vereinen“ können sich Vereine bei uns für ein Spieltagscamp anmelden. Was euch erwartet:90-minütige Trainingseinheit Gemeinsamer Stadionbesuch der 1.Mannschaft Kickers-Shirt Verzehrgutschein Highlight: Einlaufkind mit der 1.Mannschaft Alle weiteren Infos zum Spieltagscamp hier. Wir freuen uns auf euch! Weitere Infos'
