["http://stuttgarter-kickers.de/fans/auswaertsspiele/infos-fuer-gaestefans"]
title = "Informationen für Gästefans - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers - Hier finden unsere Gästefans alle Informationen zum Besuch eines Kickers-Heimspiels"
full_description = 'FansInformationen für GästefansQuick LinksTicketshopEintrittspreiseInfos zum GAZi-StadionAGBs & StadionordnungAuf dieser Seite möchten wir unsere Gästefans über den Besuch bei einem Kickers-Spiel im GAZi-Stadion auf der Waldau informieren.Infos für unsere nächsten Gäste:Heimspiel gegen 1. Göppinger SV am Samstag, 08.03.2025:Abstimmung mit den Fanvertretern / Mitarbeitern des 1. Göppinger SV ist erfolgtdie Stehplätze für Gästefans befinden sich im F3-Blockdie Sitzplätze für Gästefans befinden sich auf der Haupttribüne Block E1 / E2Stadionzugang erfolgt für den Stehplatz-Block F3 und Sitzplätze Block E2 / E1 über Kassenanlage Süd / Tor 12+13, die Inhaber von Sitzplatzkarten können hier direkt auf die Haupttribüne, die Inhaber von Stehplatzkarten Block F3 gehen hinter der Haupttribüne entlang in den F3-Block; Die Gästefanzone / Tor 5 bleibt geschlossen - der Zugang über Kassenanlage Nord / Tor 2 (Kickers-Fanblock) ist nicht möglich.Tickets im Vorverkauf über den Ticketshop oder an der Tagekasse (nur Barzahlung möglich) - der GSV hat auch einen Secret Shop mit geblockten Sitz- und Stehplätzen für den internen Vorverkauf erhaltenCatering über den Kiosk auf der Haupttribüne Ebene 1 Toiletten sind im F3-Block oder auf der Haupttribüne vorhandenParkplatz: es gibt keinen separaten Parkbereich für die Gästefans, es werden die Parkplätze in der Gäste-Fanzone, am Fernsehturm oder im Georgii-Weg / Guts-Muths-Weg bei der Haltestelle Ruhbank empfohlen.Heimspiel gegen Kickers Offenbach am Samstag, 22.03.2025:Abstimmung mit den Fanvertretern / Mitarbeitern des OFC ist noch nicht erfolgtdie Stehplätze für Gästefans befinden sich im F1 / F2 / F3-Block - wobei der F2-Block der Stimmungsblock sein wirddie Sitzplätze für Gästefans befinden sich auf der Haupttribüne Block E1 / E2Stadionzugang erfolgt für den Stehplatz-Block F1 / F2 / F3 und Sitzplätze Block E2 / E1 über die Gästefanzone / Tor 5 - der Zugang über Kassenanlage Nord / Tor 2 (SVK-Fanblock) oder Kassenanlage Süd / Tor 12 und 13 ist nicht möglich.Tickets im Vorverkauf über unseren Ticketshop oder an der Tagekasse (nur Barzahlung möglich)Catering über den Kiosk bei Tor 5 / Block D und auf der Haupttribüne Ebene 1 Toiletten sind im D-Block und F3-Block oder auf der Haupttribüne vorhandenParkplatz: Der Fanbus und auch die PKWs / Neunsitzer können in der Gäste-Fanzone direkt vor dem Zugang zum Gästebereich abgestellt werdenTickets im Vorverkauf:Die Eintrittskarten sind jederzeit und auch noch am Spieltag in unserem Ticketshop erhältlich, so könnt ihr euch zuhause, im Büro oder auf dem Weg zum Stadion online ein Ticket erwerben.Die Eintrittskarte (Sitzplatz, Stehplatz, Business-/VIP-Zugang oder Parkschein) kann als E-Ticket auf dem Smartphone (Wallet, pdf, Screenshot) oder als print@home-Ticket auf Papier ausgedruckt am Stadioneinlass / VIP-Zugang / Parkplatz-Zufahrt) vorgezeigt werden, dort wird der QR-Code oder Barcode gescannt.Wer kein E-Ticket erwerben möchte, kann die Eintrittskarten auch im Kickers-Fanshop im ADM-Sportpark oder an den Tageskassen am Stadion (ab ca. 120 Minuten vor Spielbeginn, nur BAR-Zahlung möglich) erwerben.Gästebereich:Ja nach Anzahl der zu erwartender Gästefans können wir die Stehplatz-Blöcke im separaten Gästebereich öffnen, wobei bis zu einer Kapazität von 2.800 Gästefans im D-Block und in den F-Blöcken möglich ist:Stehplätze im F1- / F2- / F3-Block mit Zugang über die Gästefanzone / Tor 5 (bei einer größeren Anzahl Gästefans) oder lediglich der F3-Block mit Zugang über die Kassenanlage Süd / Tor 12+13 und hinter der Haupttribüne entlang in den F3-Block (bei einer geringen Anzahl an Gästefans)Sitzplätze für Gästefans wird der Block E2/E1 auf der Haupttribüne empfohlen; Zugang über die Gästefanzone / Tor 5 (bei einer größeren Anzahl Gästefans) oder über die Kassenanlage Süd / Tor 12+13 (bei einer geringen Anzahl an Gästefans).Die Plätze für Rollstuhlfahrer befinden sich auf der Haupttribüne in Block E6 Reihe 5 (Kickers) oder Block E2 Reihe 5 (Gäste), Zugang über die Kassenanlage Süd / Tor 12+13Es sind keine Gästefans / Gäste-Fanutensilien auf der Gegentribüne Block A, B, C und Westtribüne Block G erlaubt.Das VVS-KombiTicket ist bei Kaufkarten (keine Frei- & Ehrenkarten) im Karten­preis beinhaltet.Stadionöffnung ist ca. 90 Minuten vor Spielbeginn.Der Tageskartenverkauf am Stadion (nur Barzahlung) erfolgt ab ca. 90 Minuten vor SpielbeginnDownload Stadionplan und Sitzplan Haupttribüne:StadionplanSitzplan HaupttribüneFanutensilien:Folgende Fanutensilien sind in den Gästeblöcken F1 / F2 / F3 erlaubt, wenn es in früheren Begegnungen keine Vorfälle / Strafen gab:Kleine Schwenkfahnen bis 1,5 Meter Stocklänge Schwenkfahnen ab 1,5 Meter Stocklänge (Plastikleerrohr oder Teleskopstange)Doppelhalter bis 1,5 Meter StocklängeZaunfahnen und Banner dürfen im Gästebereich aufgehängt werden, wenn keine Werbebanner überhängt werdenMegafone inkl. ein Satz ErsatzakkusTrommeln, unten offen oder einsehbar, inkl. einem Satz Trommelstöcke je TrommelKonfetti ist generell verbotenBlockfahnen, Choreos, Spruchbänder etc. müssen spätestens 3 Wochen vor dem Spiel bei SiBe Kim-Tobias Stehle und FanBe Gerd Andrae beantragt werdenKontrollen / Sicherheitsmaßnahmen am Einlass:Es werden für alle Besucher, Mitarbeiter und Dienstleister rund um ein Kickers-Heimspiel im gesamten Stadion Durchsuchungsmaßnahmen (Personen und Taschen) durchgeführt, damit allen Besuchern ein sicheres Gefühl vermittelt wird.Größere Taschen / Handtaschen über DIN A4-Größe, Rücksäcke, Helme, große / spitze Regenschirme (es sind nur Taschenschirme / Knirpse erlaubt), Powerbanks, Aufkleber und sperrige Gegenstände müssen an der kostenfreien Verwahrstelle direkt am Zugang bei Kassenanlage Süd abgegeben werden. Fahrräder, Roller oder Tiere sind im Stadionbereich verboten.Außerdem gilt es zu beachten:- im Stadion gilt das Vermummungsverbot, so sind z.B. Schlauchschals, Multifunktionstücher oder Kleidungsgegenstände, die zur Vermummung dienen können, verboten- am Stadion können Alkoholkontrollen durchgeführt werden - die Alkoholgrenze liegt bei max. 1,4 PromilleAlle detaillierten Informationen zu den verbotenen Gegenständen und die Stadionordnung findest du hierdas Be- und Übersteigen von Zäunen, vor allem zum Innenraum / Spielfeld hin, ist verboten, da der Zaun bereits als Teil des Innenraums angesehen wirdVerwahrstelle: Im Gästebereich ist eine Verwahrstelle eingerichtet, an denen kostenfrei Taschen, Rucksäcke, Helme, große Schirme, etc. abgegeben werden können.Anreise mit der Stadtbahn / U-Bahn mit öffentlichen Verkehrsmitteln:Für die Gästefans wird empfohlen: vom Hauptbahnhof mit der U15 in Richtung „Ruhbank / Fernsehturm“ bis Haltestelle Ruhbank / Fernsehturm, von dort fünf Minuten Fußweg bis zum Stadion.Das VVS-KombiTicket ist bei Kaufkarten (keine Frei- & Ehrenkarten) im Karten­preis bei den Tageskarten beinhaltet.Fahrplanauskunft und mehr unter www.vvs.deAnreise mit dem PKW:Adresse: Guts-Muths-Weg 4, 70597 Stuttgart-DegerlochAnfahrt: Über die Autobahn (A8), Ausfahrt Stuttgart-Degerloch / Möhringen (Ausfahrt 52b), in Richtung Stuttgart einordnen. Auf der Bundesstraße 27 (B27) in Richtung Stuttgart-Degerloch. In Degerloch auf die „Jahnstraße“ Richtung Fernsehturm / GAZi-Stadion (ist ausgeschildert) abbiegen. Nach ca. 1 Kilometer ist das Stadion auf der rechten Seite, direkt am Fuße des Fernsehturms.Aus der Innenstadt über die Weinsteige, vom Flughafen über die Mittlere Filderstraße und von Ostfildern über die Kirchheimer Straße immer Richtung Fernsehturm, Stuttgart-Degerloch.Parkplätze:Rund um das Stadion gibt es auf dem gesamten Sportgebiet Waldau ca 1.200 freie Stellplätze, je nach Zuschauererwartung werden weitere (bis zu ca. 800) Parkflächen auf der Jahnstraße, Verlängerung Königsträßle, Kirchheimer Straße und der Mittleren Filderstraße geschaffen.Parkplatz für die Gästefans: PKWs / Neunsitzer: es gibt keinen separaten Parkbereich für die Gästefans, je nach Gästefanaufkommen werden die Parkplätze in der Gäste-Fanzone von der Polizei freigegeben. Ansonsten werden die Parkplätze am Fernsehturm oder im Georgii-Weg / Guts-Muths-Weg bei der Haltestelle Ruhbank empfohlen.Die Gäste-Fanbusse können in der Gäste-Fanzone, auf den Busparkplätze auf dem P1 oder im Georgii-Weg / Ruhbank abgestellt werden.Generelle Parkflächen:freie Parkplätze: P1 (vor Gegentribüne, am Fernsehturm), P5 (Waldparkplätze Königsträßle), P6 (Gehwegparken Jahnstraße), P7 (Gehwegparken Kirchheimer Straße), P8 (Mittlere Filderstraße) und die Tiefgarage in der Waldau-Hallemit Parkschein: P2: 78 Plätze, P3: 75 Plätze, P4: 30 Plätze, P2A / Medien: 44 Plätzen (TV-Compound, Mannschaftsbus)Behinderten-Parkplätze: 8 Plätze auf dem freien Parkplatz P1 vor der GegentribüneBusparkplätze: 5 Plätze auf dem freien Parkplatz P1 parallel zur JahnstraßeDownload Parkplan:Park- & Übersichtsplan GAZi-StadionParkplätze auf der WaldauInformationen zu verschiedenen Themen:VVS-Kombi-TicketAlle Zuschauer können mit den Eintrittskarten (nur Kaufkarten, keine Frei- & Ehrenkarten) ohne zusätzliche Kosten per öffentlichem Nahverkehr zu den Spielen im GAZi-Stadion auf der Waldau an- und abreisen. Die Eintrittskarten berechtigen zur Fahrt zum Stadion ab drei Stunden vor Spielbeginn und zur Rückfahrt nach Spielende bis Betriebsschluss mit allen VVS-Verkehrsmitteln (2. Klasse) innerhalb des Geltungsbereiches des VVS-Gemeinschaftstarifs. Das VVS-Ticket ist nicht übertragbar. Frei- & Ehrenkarten berechtigen nicht als VVS-KombiTicket.Fahrplanauskunft und mehr unter www.vvs.deCatering im StadionDie Gastro-Verkaufsstände sind mit dem vollen Speisen & Getränkeangebot geöffnet.Der Ausschank von Alkohol ist erlaubt - lediglich bei Risikospielen kann es Auflagen / Verbote durch die Sicherheitsbehörden geben. Die Alkoholgrenze liegt bei max. 1,4 Promille - es können stichprobenhaft Alkoholkontrollen am Einlass durchgeführt werden.an den Kiosken kann in BAR oder mit EC-Karte / Kreditkarten bezahlt werdeninsgesamt gibt es folgende Verkaufsstände im Stadion für unsere Gästefans:Kiosk unter Block D und ggf. Ausschankwagen im zwischen D- und F-Block (je nach Zuschauererwartung)Kiosk auf der Haupttribüne in Ebene 1Speisen-Angebot:Stadionwurst im Brötchen 4,20 EuroVegane Grillwurst im Brötchen 4,80 EuroLange Stuttgarter im Brötchen 4,80 EuroSchweinenackensteak mit Zwiebeln im Brötchen 5,50 EuroVeggie-Burger 7,50 EuroOX-Burger 8,50 EuroGetränke-Angebot:Bier Schwaben Bräu Original Urtyp Export 0,5l 4,80 Euro /// 1,0l 8,00 EuroRadler 0,5l 4,80 Euro /// 1,0l 8,00 EuroDinkelacker alkoholfrei 0,5l 4,80 Euro /// 1,0l 8,00 EuroEnsinger Mineralwasser medium / still 0,5l 4,00 Euro /// 1,0l 7,50 EuroEnsinger Apfelschorle 0,5l 4,80 Euro /// 1,0l 8,00 EuroAfri Cola 0,5l 4,80 Euro /// 1,0l 8,00 EuroAfri Cola ohne Zucker 0,5l 4,80 Euro /// 1,0l 8,00 EuroBluna Orange 0,5l 4,80 Euro /// 1,0l 8,00 EuroBluna Mix 0,5l 4,80 Euro /// 1,0l 8,00 EuroBecher Hochland Kaffee 0,3l 4,00 Eurozzgl. Becherpfand 2,00 EuroMenü-Angebote:Menü 1 "Anstoß": Stadionwurst und Getränk 0,5l 8,50 EuroAufenthalt für StadionverbotlerFans mit Stadionverbot können sich in der Gästefanzone, unmittelbar vor dem Zugang zum Gästeblock Tor 5, aufhalten.Freikarten für SchiedsrichterDie Freikarten für Schiedsrichter werden gegen Vorlage des aktuellen Ausweises bzw. Nachweis in der App an unserer Servicekasse / Kassenanlage Süd oder an der Gästekasse ausgegeben. Je nach Verfügbarkeit gibt es Steh- oder Sitzplatzkarten.Rollstuhlfahrer Rollstuhlfahrer sitzen auf der Haupttribüne in Block E6 (16 Plätze mit Begleitperson für Kickers-Fans) und ggf. Block E2 (16 Plätze mit Begleitperson für Gäste-Fans). Eine Begleitperson - falls erforderlich - erhält normalerweise freien Eintritt, darf aber auch gerne ein Ticket zum ermäßigten Preis erwerben. Rolli-Tickets mit Freikarte für Begleitpersonen können im Vorverkauf über den Ticketshop, im Kickers-Fanshop in Degerloch oder am Spieltag an den Tageskassen gegen Vorlage des entsprechenden Ausweises erworben werden.Das GAZi-Stadion ist voll rollstuhltauglich: Es gibt Parkplätze in untermittelbarer Stadionnähe (hinter der Gegentribüne), einen separaten Bereich auf der Haupttribüne (Ebene 1) im Block E6 und E2, wo die Rollis samt Begleitperson genug Platz finden. Ebenso sind Toiletten und ein Kiosk vorhanden, die Ebene 1 ist über einen Aufzug hinter der Haupttribüne zu erreichen.Behinderte / Versehrte / Blinde Behinderte / Versehrte / Blinde bezahlen den ermäßigten Betrag für eine Steh- oder Sitzplatz-Karte, einen separaten Bereich auf den Tribünen gibt es nicht. Eine Begleitperson - falls nötig - erhält normalerweise freien Eintritt, darf aber auch gerne ein Ticket zum ermäßigten Preis erwerben. Tickets für Behinderte / Versehrte / Blinde mit Freikarte für die Begleitperson können im Vorverkauf über den Ticketshop (Upload des entsprechenden Ausweises), im Kickers-Fanshop in Degerloch oder am Spieltag an den Tageskassen gegen Vorlage des entsprechenden Ausweises erworben werden. Direkt hinter der Gegentribüne stehen Behinderten-Parkplätze zur Verfügung.HygienevorschriftenSeit 3. April 2022 gilt in Baden-Württemberg eine Corona-Verordnung, durch welche die weitreichenden Schutzmaßnahmen sowie Corona-Beschränkungen entfallen und eine 100%ige Stadionauslastung erlaubt ist.Die Kickers-Heimspiele im GAZi-Stadion auf der Waldau können damit ohne gesundheitliche Zugangsregelungen (z.B. 3G-Nachweis, Testnachweis, etc.) und ohne Maskenpflicht besucht werden.Umweltzone StuttgartDas GAZi-Stadion auf der Waldau befindet sich innerhalb der Umweltzone Stuttgart, bitte denken Sie an eine Umweltplakette. Stuttgart-Degerloch und das Waldau-Sportgebiet gehören zur Umweltzone, die von den Diesel-Fahrverbot und ggf. bei einem Feinstaubalarm betroffen sind.AGBs und StadionordnungBeim Kauf der Eintrittskarte erkennt der Kunde unsere allgemeinen Ticket-Geschäftsbedingungen und die Stadionordnung an. Alle wichtigen Informationen, Verbote und Regelungen für deine Besuch im GAZi-Stadion auf der Waldau findest Du hier.VersicherungsausweisDie Eintrittskarten gelten als Versicherungsausweis im Zusammenhang mit der für die Zuschauer abgeschlossenen ARAG-Sporthaftpflichtversicherung.Kartenpreis und MehrwertsteuerIm Kartenpreis sind neben der gesetzlichen MwSt., einer Ticketsystemgebühr und dem VVS-Zuschlag für das VVS-KombiTicket ggf. auch ein Stadiongroschen, den die Stuttgarter Kickers unmittelbar der Landeshauptstadt Stuttgart schulden, enthalten.'
