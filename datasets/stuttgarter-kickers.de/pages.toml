["https://stuttgarter-kickers.de/kontakt"]
title = "Kontakt - SV Stuttgarter Kickers e.V."
full_description = 'SV Stuttgarter Kickers e.V.KontaktDu hast Fragen, Wünsche oder Anregungen? Dann kontaktiere uns gerne per E-Mail oder Telefon. Wir freuen uns über deine Kontaktanfrage.Die Kickers-Geschäftsstelle, der Kickers-Fanshop und das Kickers-Clubrestaurant befinden sich im ADM-Sportpark in Stuttgart-Degerloch und nicht am GAZi-Stadion auf der Waldau. Im Kickers-Fanshop erhalten Sie von unserem Team alle Informationen, Fan-Artikel, Eintrittskarten, Gutscheine und vieles mehr...AdresseAdresse Geschäftsstelle / Fanshop / ADM-Sportpark:SV Stuttgarter Kickers e.V., Königsträßle 56, 70597 StuttgartPostanschrift: SV Stuttgarter Kickers e.V., Postfach 70 04 43, 70574 StuttgartAdresse Kickers-Clubrestaurant:Kickers-Clubrestaurant Familie Rörich., Königsträßle 58, 70597 StuttgartHinweis Fanshop-Verkauf bei Heimspielen: Bei den Heimspielen öffnen die Fanartikel-Verkaufsstände im GAZi-Stadion auf der Waldau, an denen Sie die Kickers-Fanartikel erwerben können. Ein Stand befindet sich an der Haupttribüne / Kassenanlage Süd und ein Stand unter dem B-Block / Gegengerade. Der Fanshop im ADM-Sportpark ist bei den Spielen geschlossen.TelefonGeschäftsstelle: 0711 / 767 10 - 0Fanshop und Tickets: 0711 / 767 10 - 18Telefax: 0711 / 767 10 - 10E-MailsAllgemein: info@stuttgarter-kickers.deFanshop: fanshop@stuttgarter-kickers.deOnlineshop: onlineshop@stuttgarter-kickers.deTickets: tickets@stuttgarter-kickers.deDatenschutz: datenschutz@stuttgarter-kickers.deSpendenkontoCommerzbank AG (ehemals Dresdner Bank)Kontoinhaber: Stuttgarter KickersIBAN: DE18 6008 0000 0932 5050 01BIC: DRESDEFF600Internet & Soziale MedienHauptverein: www.stuttgarter-kickers.deFacebook: www.facebook.com/stuttgarterkickersFacebook-Kickers-Junioren: www.facebook.com/SVStuttgarterKickersJunioren X: https://x.com/svk1899 Instagram: www.instagram.com/stuttgarterkickers_offiziellLinkedIn: https://www.linkedin.com/company/sv-stuttgarter-kickers-e.-v./TikTok: https://www.tiktok.com/@stuttgarterkickersKickers-Kampagnen: www.12fuer11.de, www.111elf.de, www.believe-in-blue.deOnlineshop: https://shop.stuttgarter-kickers.deTicketshop: https://tickets.stuttgarter-kickers.deÖffnungszeitenHier findest du unsere Öffnungszeiten und die telefonische Erreichbarkeit der Geschäftsstelle, des Fanshops und vom Kickers-Clubrestaurant.Öffnungszeiten Fanshop & GeschäftsstelleMontag: geschlossenDienstag: 15.00 bis 18.00 UhrMittwoch: geschlossenDonnerstag: 15.00 bis 18.00 UhrFreitag: geschlossen, jedoch vor Heimspielen der 1. Mannschaft von 10.00 bis 15.00 Uhr geöffnetWochenende und Feiertag: Bei Heim- oder Auswärtsspielen am Wochenende oder unter der Woche sind der Fanshop und die Geschäftsstelle geschlossen.Telefonische Erreichbarkeit Fanshop & GeschäftsstelleMontag: 10.00 bis 16.00 UhrDienstag: 10.00 bis 16.00 UhrMittwoch: 10.00 bis 16.00 UhrDonnerstag: 10.00 bis 16.00 UhrFreitag: 10.00 bis 12.00 UhrWochenende und Feiertag: geschlossenÖffnungszeiten Kickers-Clubrestaurant Familie Rörich:Montag, Mittwoch bis Samstag 11.00 – 22.00 Uhr (Dienstag Ruhetag)Sonn- & Feiertag 11.00 – 21.00 UhrTelefon: 0711 / 762395Telefax: 0711 / 7678986E-Mail: info@kickers-clubrestaurant.dewww.kickers-clubrestaurant.deAnfahrtsbeschreibung mit Auto und StadtbahnAnfahrtsbeschreibung mit dem Auto:Von der Autobahn (A8) kommend, Ausfahrt Stuttgart-Degerloch / Möhringen (Ausfahrt 52b), in Richtung Stuttgart einordnen. Auf der Bundesstraße 27 (B27) in Richtung Stuttgart-Degerloch. In Degerloch auf die "Jahnstraße" Richtung Fernsehturm / Waldau-Stadion (ist ausgeschildert) rechts abbiegen. Nach 800m rechts abbiegen ins Königsträßle (Bushaltestelle mit Fußgängerampel). Nach 500m im Königsträßle sehen Sie den ADM-Sportpark rechter Hand gut sichbar durch die Schilder an der Einfahrt. Anfahrtsbeschreibung mit der Stadtbahn:Vom Stuttgarter Hauptbahnhof mit der U7 Richtung Ostfildern-Nellingen bis zur Haltestelle Waldau / GAZi-Stadion. Zum ADM-Sportpark geht es über den Georgii-Weg ins Königssträßle, vorbei an der Waldschule. An der Kreuzung Georgii-Weg / Königsträßle links halten, nach ca 300m sehen Sie den ADM-Sportpark rechter Hand gut sichbar durch die Schilder an der Einfahrt. <img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6e3524f3-0ca4-4566-ba9f-8acb636274e9_12%2B%2B%2B15.%2BJuli%2B2021%2B%2BFotoSession%2BProfis%2BTeamfotograf%2BMarkus%2BSchwarz%2BCopyright%2Bdurch%2BStuttgarter%2BKickers.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6e3524f3-0ca4-4566-ba9f-8acb636274e9_12%2B%2B%2B15.%2BJuli%2B2021%2B%2BFotoSession%2BProfis%2BTeamfotograf%2BMarkus%2BSchwarz%2BCopyright%2Bdurch%2BStuttgarter%2BKickers.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6e3524f3-0ca4-4566-ba9f-8acb636274e9_12%2B%2B%2B15.%2BJuli%2B2021%2B%2BFotoSession%2BProfis%2BTeamfotograf%2BMarkus%2BSchwarz%2BCopyright%2Bdurch%2BStuttgarter%2BKickers.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6e3524f3-0ca4-4566-ba9f-8acb636274e9_12%2B%2B%2B15.%2BJuli%2B2021%2B%2BFotoSession%2BProfis%2BTeamfotograf%2BMarkus%2BSchwarz%2BCopyright%2Bdurch%2BStuttgarter%2BKickers.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6e3524f3-0ca4-4566-ba9f-8acb636274e9_12%2B%2B%2B15.%2BJuli%2B2021%2B%2BFotoSession%2BProfis%2BTeamfotograf%2BMarkus%2BSchwarz%2BCopyright%2Bdurch%2BStuttgarter%2BKickers.jpeg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.