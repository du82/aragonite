["https://stuttgarter-kickers.de/nachwuchs/porsche-fussballschule/toptalente-foerderung"]
title = "Toptalente Porsche Fußballschule - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu den Angeboten der Porsche Fußballschule."
full_description = 'Porsche FußballschuleToptalente FörderungQuick LinksBuchungsportalPorsche FußballschuleFussballcampsMädchencampsZusatztrainingStadionführungKontakt & FAQ der Porsche Fußballschule<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6503338bfbd9a45bcec7fd39_TopTalenteHomepage.png%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6503338bfbd9a45bcec7fd39_TopTalenteHomepage.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F6503338bfbd9a45bcec7fd39_TopTalenteHomepage.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>UnsereToptalente FörderungDie Toptalente Förderung der Porsche Fußballschule Stuttgarter Kickers betreut umfangreich Spieler mit außergewöhnlichen Fähigkeiten und bildet sie individualisiert aus. Wir bilden DICH zum kreativen 360-Grad Spieler aus - beidfüßig, technisch versiert, schnell im Kopf und in den Beinen! Das Modell sieht eine Intensivförderung in Kleinstgruppen inklusive moderner Analysen in den Kernbereichen Fußball, Athletik, Mentalcoaching und Entwicklungsplanung vor. Sprich mit uns und lass dir Dein individualisiertes Entwicklungskonzept erstellen. Bewirb Dich noch heute!Dich erwarten1-2 Trainingseinheiten á 45 Minuten pro Woche – je nach Paket: Basis, Athletik und MentalcoachingIndividualisierte Zielsetzung und Ausrichtung der EntwicklungszieleAltersgerechtes und ganzheitliches Training durch qualifizierte Trainer*innen unter professionellen BedingungenÜber das Training hinausgehende Betreuung über Trainings- und Spielanalysen, Ernährungskonzeption und Entwicklungs-/KarriereplanungUnsere PaketeBasis PaketDas Basis Paket ist das Pflicht Paket und beinhaltet folgendes:Fußballerische Intensivförderung in Kleinstgruppen: Wöchentlich. 1-2 Einheiten pro Woche á 45min in Absprache auf dem Platz des Heimatvereins oder im ADM-Sportpark. Individualisiertes und ganzheitliches Training fußballerischer Fähigkeiten auf Basis der Entwicklungsziele mit dem Fokus sportlicher Alleinstellungsmerkmale (sog. Waffen) auszubilden.Zusätzliche Pakete die hinzugebucht werden können:Athletik PaketAthletische Intensivförderung in Kleinstgruppen: Individualisiertes und ganzheitliches Training athletischer Fähigkeiten auf Basis der Entwicklungsziele mit dem Fokus auf fußballspezifischen Kriterien im Bereich Ausdauer (Lauf-, Kraft- und Schnelligkeitsausdauer), Schnelligkeit (Explosivität und Topspeed), Kraft (Schnell- und Reaktivkraft), Koordination und Beweglichkeit auszubilden.Mentalcoaching PaketMentale Intensivförderung in Kleinstgruppen: Individualisiertes und ganzheitliches Mentalcoaching mentaler Fähigkeiten auf Basis der Entwicklungsziele mit dem Fokus auf fußballspezifischen Kriterien im Bereich Brainkinetic, Neuroathletik sowie Entspannungs- und Fokussierungsmethoden.ErnährungskonzeptionAuf Anfrage.Falls gewünscht im Formular ankreuzen!Analyse- / Videoanalyse PaketBeobachtung und Aufnahme eines Spiels im Verein des betreuten Spielers: Ansicht des ganzen Spiels sowie Erstellung einer animierten, individuellen Videoanalyse des Spielers.Entwicklungs PaketEntwicklungsempfehlung und Maßnahmenumsetzung: Entwicklungsbedingte Einschätzung durch den Trainer und Festlegung möglicher Meilensteine. Ableitung möglicher Maßnahmen auf Basis der Entwicklungsempfehlung sowie Planung und Organisation – z.B. Abstimmung mit dem Trainer im Heimatverein oder Organisation von Probetrainings (auch DFB-Stützpunkt (U12-U15) oder WFV-Auswahl (U13-U18)).Jetzt Bewerben und mit etwas Glück einen Platz bei den Toptalenten bekommen.Ansprechpartner der Top Talente<img alt="Maximilian Füssenhäuser" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F65085d68fbd9a45bcec7fedd_MaxPor.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>Maximilian FüssenhäuserLeiter unserer Top Talente der FußballschuleE-Mail: fuessenhaeuser@stuttgarter-kickers.deLizenz: A-Lizenz Inhaber.Werdegang:2016 - U13 FC Frickenhausen - Cheftrainer2017-18 - U13 VFL Pfullingen - Cheftrainer2019 -