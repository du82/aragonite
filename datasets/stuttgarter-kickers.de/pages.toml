["https://stuttgarter-kickers.de/nachwuchs/kids-club"]
title = "Kickers Kids Club - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zum Kickers Kids Club."
full_description = 'NachwuchsKickers Kids ClubHerzlich Willkommen beim Kids Club der Stuttgarter KickersHallo Kinder,ich bin Waldi, der Waschbär und Maskottchen der Stuttgarter Kickers. Ich freue mich sehr, dass ich der Pate des Kickers Kids Club sein darf. Der Kids Club ist ein Fanclub für fußballbegeisterte Kinder im Alter bis 14 Jahren. Mit Vollendung des 14. Lebensjahres endet automatisch die Mitgliedschaft und geht in eine normale Vereinsmitgliedschaft über. Ich würde mich freuen, wenn sich ganz viele Kinder bei uns im Kickers Kids Club anmelden würden, damit wir zusammen tolle Dinge erleben und eine Menge Spaß haben. Für einen Jahresbeitrag von 18,99 € und eine einmalige Aufnahmegebühr von 25 € bekommen die Mitglieder des Kickers Kids Clubs zahleiche Vorteile. Wie kann ich mich anmelden?Zum Eintritt in den Kickers Kids Club gibt es einen Mitgliedausweis, eine Mitgliedsurkunde, ein T-Shirt, sowie einen Aufkleber. Im GAZi-Stadion auf der Waldau steht Euch bei unseren Heimspielen ein eigener Block zur Verfügung (Bürger-Familienblock). Darüber hinaus könnt Ihr Euch über verschiedene Events freuen, die wir Euch im Laufe des Jahres anbieten werden.Ich freue mich über jedes Mitglied und wir sehen uns beim nächsten Spiel im Stadion.Euer WaldiSo einfach geht‘sAnmeldeformular herunterladen und ausdrucken.Die Eltern das Formular bitte vollständig ausfüllen und unterschreiben lassen.Anmeldeformular per Post oder per E-Mail weiterleiten.Mitgliedsantrag Kickers Kids ClubFür Euch immer da: Pia-Mareike Riedel, Maskottchen Waldi und Belinda Weller (v.l.).KontaktSV Stuttgarter Kickers e.V.Kickers Kids ClubKönigsträßle 5670597 Stuttgart-DegerlochTelefon: 0711 / 767 10 - 0E-Mail: kidsclub@stuttgarter-kickers.deDie häufigsten FragenWas ist der Kickers Kids Club?Im Kickers Kids Club erwartet Euch ein abwechslungsreiches Angebot. Als Mitglied bekommt Ihr einen tollen Einblick in die Kickers Familie. Es werden regelmäßig Ausflüge und Events geplant, an den zum Teil nur Ihr exklusiv teilnehmen könnt. Außerdem gibt es für jedes neue Mitglied nicht nur einen exklusiven Mitgliedsausweis, sondern auch ein cooles Starterpaket und eine Urkunde. Wie viel kostet eine Mitgliedschaft?Der Jahresbeitrag beträgt 18,99 Euro. Eine einmalige Aufnahmegebühr von 25 Euro kommt hinzu.Wo gibt es das Anmeldeformular?Zum einen hier oben auf der Seite oder direkt im Fanshop.Wie kann ich mich anmelden?So einfach geht‘sAnmeldeformular herunterladen und ausdrucken.Die Eltern das Formular bitte vollständig ausfüllen und unterschreiben lassen.Anmeldeformular per Post oder E-Mail an uns weiterleiten.SV Stuttgarter KickersKickers Kids ClubKönigsträßle 5670597 Stuttgart-DegerlochWie lange dauert es nach Antragsstellung, bis Ihr Euer Starterpaket erhaltet?Ihr bekommt das Starterpaket in der Regel nach zwei Wochen zugeschickt.Was beinhaltet das Starterpaket?Das Starterpaket beinhaltet Euren Mitgliedsausweis, eine Mitgliedsurkunde, ein cooles Kids Club T-Shirt und einen Kids Club Aufkleber.Was passiert nach Erreichen der Altersgrenze?Mit Vollendung des 14. Lebensjahres endet automatisch die Mitgliedschaft und geht in eine normale Vereinsmitgliedschaft über. Bis einen Monat vor Ende der Mitgliedschaft muss spätestens die Kündigung schriftlich erfolgen, ansonsten wird Eure Kids Club Mitgliedschaft automatisch in eine normale Mitgliedschaft des Vereins umgewandelt.Ich bin bereits Mitglied. Kann ich die Mitgliedschaft umschreiben lassen?Ja, die Mitgliedschaft kann umgeschrieben werden. Die Aufnahmegebühr von 25 Euro bleibt bestehen.Wie erhalte ich Eintrittskarten für den Familienblock?Familientickets für den Steh- oder Sitzplatzbereich gibt es in unserem Ticketshop oder an den Tageskassen.Bekomme ich beim Kauf im Fanshop einen preislichen Nachlass?Alle Mitglieder – also auch Kids Club Mitglieder – erhalten 10 % Rabatt auf alle Kickers-Fanartikel. Bitte den Ausweis beim Kauf im Fanshop mitbringen und vorzeigen.Der Kickers Kids Club SongDer Club Song wurde im Januar 2015 S. Zondler und dem Stuttgarter Kickers e.V. geschrieben und komponiert.Noten und MusikNoten und Text als PDF DokumentDer Song als MP3 DateiEvents und AktionenSpieltagskindFür die Heimspiele der Stuttgarter Kickers suchen wir das Kickers Kids Club Spieltag-Kind das mit Waldi einlaufen darf. Als Mitglied im Kickers Kids Club kannst Du Dich exklusiv darauf bewerben. Wenn Du im Losverfahren gezogen wirst, bekommst Du rechtzeitig eine Benachrichtigung und dann darfst mit Waldi und den Mannschaften gemeinsam einlaufen.Wir haben immer noch vereinzelt Plätze frei. Anmeldung unter: kidsclub@stuttgarter-kickers.deLaternenlaufAm Mittwoch, 15. November 2023 lädt der Kickers Kids Club zum Laternenlauf ein. Mit dabei sind die Spieler der 1. Mannschaft Paul Polauke, Marian Riedinger und natürlich Waldi. Treffpunkt ist um 17:30 Uhr im ADM-Sportpark. Eine Anmeldung ist nicht erforderlich.DownloadsStundenplanWaldi AusmalbildFörderer und Partner des Kickers Kids Club<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F142b36df-4dbd-4548-ba4a-8f77ea167540_logo-partner-wolff-mueller.png%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75"/>'
