["https://stuttgarter-kickers.de/nachwuchs/porsche-fussballschule/ernaehrungsschulung"]
title = "Ernährungsschulung Porsche Fußballschule - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu den Angeboten der Porsche Fußballschule."
full_description = 'Porsche FußballschuleErnährungsschulungQuick LinksBuchungsportalPorsche FußballschuleFussballcampsMädchencampsZusatztrainingStadionführungKontakt & FAQ der Porsche Fußballschule<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbf63b2f4-7ae0-416f-8076-1db467b38621_HomePage%2BErn%25C3%25A4hrung.png%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbf63b2f4-7ae0-416f-8076-1db467b38621_HomePage%2BErn%25C3%25A4hrung.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbf63b2f4-7ae0-416f-8076-1db467b38621_HomePage%2BErn%25C3%25A4hrung.png%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>Das ThemaSporternährungDie Ernährung ist ein wichtiger Faktor und zusammenhängend mit Leistungssport, Breiten- und Gesundheitssport. Eine ausgewogene, vollwertige Sporternährung kann die Leistung verbessern und Regeneration fördern. Dazu gehört eine spezifische Verteilung der Makronährstoffe, wie ein höherer Bedarf an Kohlenhydraten und Protein. Dabei gilt es auf die Qualität und Auswahl der Nahrungsmittel zu achten. Bei Fetten gilt es (mehrfach) ungesättigte wie Omega-3 und pflanzliche Quellen wie Nüsse, Saaten zu bevorzugen. Zudem haben Sportler*innen einen höheren Bedarf an Mikronährstoffen. Zu diesen gehören Mineralien wie u.a. Magnesium, Calcium und Vitamine u.a. C, D, K.DieErnährungspyramideDie Ernährungspyramide beinhaltet verschiedene Nahrungsmittelgruppen. Die Basis bilden Obst, Beeren, Gemüse und darauf aufbauend qualitativ hochwertige Proteine wie in Hülsenfrüchten, Bohnen, Joghurt zu finden, hochwertige Kohlenhydrate wie Kartoffeln, Vollkorngetreide und weitere.Zusätzlich wird geklärt welche Nahrungsergänzungsmitteln wie Magnesium, und spezielle Sportpräparate wirklich hilfreich sein können. Des Weiteren konkrete Beispiele für empfehlenswerte Nahrungsmittel(-kombinationen) vor dem Training/ Spieltag und an Spieltagen und welche Nahrungsmittel besonders hilfreich sein können. Es gibt noch vieles mehr im Bereich der Sporternährung zu lernen! Wie zum Beispiel welchen genauen Zusammenhang es zwischen den Nahrungsmittelbestandteilen und Muskeln, Knochen und Blut gibt.DerFlüssigkeitshaushaltNeben gezielten Nahrungsmitteln ist die Flüssigkeitszufuhr hervorzuheben. Mineralwasser, ungesüßter Tee und bei intensiven Einheiten dünne Saftschorle und isotonische Getränke sind u.a. Beispiele. Ergänzend gilt es wieder genug Salz aufzunehmen und z.B. ein Regenrationsshake mit Kakaopulver zu trinken. Zudem kann der Flüssigkeitshaushalt kann mittels sehr wasserreicher Nahrungsmittel wie Wassermelone, Gurke, Tomate, Erdbeere unterstützt werden.Unsere AngeboteErnährungsvorträge mit Kostproben und/oder KocheventsDie Ernährungsvorträge sind allgemein und auch mit unterschiedlichen Schwerpunkten möglich wie u.a. speziell ausgelegt für Kinder, Mikronährstoffe und Nahrungsergänzungsmittel, besonders hervorzuhebende Nahrungsmittel für Sportler*innen und viele mehr. Die Kostproben sind vielseitig und können z.B. aus verschiedenen Regenerationsshakes, belegten Brotscheiben, Müsliriegel und mehr bestehen. Bei der Wahl der Kostproben werden auch Nahrungsmittelunverträglichkeiten/ -allergien von Teilnehmenden beachtet.Die Kochevents sind für unterschiedliche Gruppengrößen z.B. eine Fußballmannschaft ausgelegt und ebenso mit verschiedenen Themen möglich. Beispiele für Themen können proteinreiche Gerichte, mehr Obst & Gemüse, schnellere alltägliche Gerichte, fermentierte Nahrungsmittel sein. Die gekochten Rezepte werden anschließend ausgehändigt.Hier AnmeldenVorträge bei KooperationsvereinenFür unsere Kooperationsvereine gibt es natürlich die Möglichkeit auch bei ihnen vor Ort Ernährungsvorträge, wenn gewünscht auch mit Kochevent(s) zu buchen. Bezüglich näherer Informationen siehe ,,Ernährungsvorträge mit Kostproben und/ oder Kochevents”. Hierfür gibt es buchbare Pakete. Bei Fragen gerne bei Marie melden.Jetzt AnfragenErnährungscoachingsDie Ernährungscoaching können vor Ort/ online stattfinden und z.B. begleitend während einer Saison. Diese sind für Einzelpersonen und Fußballmannschaften möglich. Als Grundlage werden von den Teilnehmenden ausgefüllte Fragebögen verwendet. Im Rahmen der Ernährungscoachings werden nützliche Inhalte behandelt und dazu Unterlagen ausgegeben. Beispiele sind u.a. welche Nahrungsmittel zu bevorzugen bzw. eher zu vermeiden sind, hilfreiche Rezepte, was getan werden kann, um ernährungstechnisch auf Spiele/ Trainingslager/ Wettkämpfe vorbereitet zu sein.ErnährungspläneDie Ernährungspläne können sowohl individuell, als auch angepasst für Mannschaften als Richtlinien genutzt werden. Diese können u.a. nützlich sein, um Leistung, Regeneration, günstigere Lipidverteilung und Mikronährstoffversorgung zu verbessern. Zu den Inhalten gehören Wochenbeispiele, Rezepte, Beispiele für empfehlenswerte Nahrungsmittel vor dem Training/ Spiel/ Wettkampf und vieles mehr. Dabei wird auf verschiedene Nahrungsmittelunverträglichkeiten/ -Allergien Rücksicht genommen. GesundheitstageUnsere Gesundheitstage sind ausgelegt für Kinder und Erwachsene und finden i.d.R. samstags statt. Nach der Begrüßung gibt es einen Smoothie/ Shake. Anschließend geht es in die Soccer Hall in Filderstadt. Dort haben die Kinder die Möglichkeit (Fußball) zu spielen und die Erwachsenen bei einer geführten Fitnesseinheit mitzumachen.Danach gibt es für alle einen Ernährungsvortrag. Während des Vortrages können die Kinder u.a. Puzzle lösen. Nach der Theorie können die gelernten Inhalte direkt beim gemeinsamen Kochen umgesetzt werden. Die zubereiteten Gerichte werden dann zusammen gegessen. Zum Abschluss gibt es neben nützlichen Unterlagen ausreichend Zeit für eine Fragerunde und auch persönliche Fragen können geklärt werden.Bei allen Angeboten können Rückfragen jederzeit geklärt werden.Jetzt E-Mail schreiben.Marie ScheffelUnsere ErnährungswissenschaftlerinMarie ScheffelMarie studierte Ernährungswissenschaften an der Universität Hohenheim. Ihre umfangreichen ernährungsmedizinischen Kenntnisse, helfen ihr die Gesundheit ihrer Mitmenschen zu fördern. Ihr Wissen basiert auf aktuellen Forschungserkenntnissen aus wissenschaftlichen Studien, Büchern und Podcasts sowie ihrem wissenschaftlichen Studium. Die englischsprachige Abschlussarbeit über das Darmmikrobiom und Gehirngesundheit behandelt u.a. gezielte, angepasste Ernährungsweisen und regelmäßige Sporteinheiten.In der Buchinger Wilhelmi Klinik betreute sie im Team der Ernährungsberatung internationale Patient*innen mit verschiedenen Erkrankungen wie Herz-Kreislauf-Erkrankungen und Lebererkrankungen. Dazu gehörten individuell abgestimmte Ernährungscoachings inklusive Unterlagen und das Vorbereiten und die Durchführung von Showküchen.In der Stiftung Healthy Minds Initiative leitet sie den Soziale Medien Bereich mit Verantwortung für die Inhalte und den deutschsprachigen Stiftungszweig. Die Aufgaben sind u.a. die Erstellung von Rezepten, Unterlagen für Veranstaltungen. Durch die zweimonatige USA-Reise und den neunmonatigen Australien- und Neuseelandaufenthalt verbesserte sie ihr C2 Englischniveau.Aktuell vervollständigt sie ihre Fitnesstrainer*in B-Lizenz. Sie betreibt Ausdauersport und macht wie Lauftraining (Halbmarathon, Marathon, Trailläufe), Fahrradfahren und Skilanglauf; Skating, einschließlich Krafttraining.Darüber hinaus schreibt Sie an einer wissenschaftlichen Arbeit im Bereich der Neurologie mit Ernährungs- und Sportwissenschaftlichen Inhalten.'
