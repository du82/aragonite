Nachwuchsmannschaft zu einem Turnier auf dem Feld oder in der Halle einladen? Dann richtet Eure Turniereinladung mit allen Informationen bitte an folgende E-Mail-Adresse: junioren@stuttgarter-kickers.deAdresse:SV Stuttgarter Kickers e.V.NachwuchsleistungszentrumKönigsträßle 5670597 Stuttgart (Degerloch)"
