full_description = 'FansFanteam / Kickers IIISchalübergabe von Spielführer Dago anlässlich des Freundschaftsspieles 2014 gegen die Hobbymannschaft Sabado Futebol aus der Nähe von Paris.Seit vielen Jahren besteht schon die Mannschaft der Stuttgarter Kickers III. Das Team, welches einst unter dem Namen "Fanteam" gegründet wurde, nahm auch einige Spielzeiten an der WFV Freizeitliga teil. Hier gelten dieselben Regeln wie im aktiven Bereich, nur gibt es keine Auf- und Absteiger.Das Training findet jeden Mittwoch ab 20.30 Uhr auf dem Kunstrasenplatz im ADM-Sportpark statt. (Königsträßle 56-58, 70597 Stuttgart-Degerloch). Voraussetzungen zum langfristigen Mitspielen sind der Spaß am Fußball, die Freude an der Gemeinschaft und eine Mitgliedschaft in einer der Abteilungen der Stuttgarter Kickers.Für Interessierte und Testspielgegner:Wir sind immer auf der Suche nach Euch! Der Ansprechpartner für Interessierte, neue Mitspieler oder auch für mögliche Testspielgegner ist Fin – zu erreichen unter Kickers3@gmx.de .<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbb1d37f1-d60b-4a3a-9687-b01c89bb3670_fanteam-mannschaftsbild.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbb1d37f1-d60b-4a3a-9687-b01c89bb3670_fanteam-mannschaftsbild.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbb1d37f1-d60b-4a3a-9687-b01c89bb3670_fanteam-mannschaftsbild.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fbb1d37f1-d60b-4a3a-9687-b01c89bb3670