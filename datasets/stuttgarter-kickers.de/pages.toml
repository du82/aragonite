["https://stuttgarter-kickers.de/aktuelles/fanshop-ticket-infos/stadionplan-infos"]
title = "Stadionplan und Infos - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers - Hier findest Du alle Informationen zum GAZi-Stadion, Pläne, Anfahrt, Parken und vieles mehr"
full_description = "Mit dem AutoÜber die Autobahn (A8), Ausfahrt Stuttgart-Degerloch / Möhringen (Ausfahrt 52b), in Richtung Stuttgart einordnen. Auf der Bundesstraße 27 (B27) in Richtung Stuttgart-Degerloch. In Degerloch auf die „Jahnstraße“ Richtung Fernsehturm / GAZi-Stadion (ist ausgeschildert) abbiegen. Nach ca. 1 Kilometer ist das Stadion auf der rechten Seite, direkt am Fuße des Fernsehturms.Aus der Innenstadt über die Weinsteige, vom Flughafen über die Mittlere Filderstraße und von Ostfildern über die Kirchheimer Straße immer Richtung Fernsehturm, Stuttgart-Degerloch. Mit der Stadtbahn / U-BahnFür die Kickers-Fans: vom Hauptbahnhof mit der U7 in Richtung „Ostfildern“ bis Haltestelle Waldau/GAZi-Stadion, von dort zwei Minuten Fußweg bis zum Stadion.Für die Gästefans: vom Hauptbahnhof mit der U15 in Richtung „Ruhbank / Fernsehturm“ bis Haltestelle Ruhbank / Fernsehturm, von dort zwei Minuten Fußweg bis zum Stadion.Fahrplanauskunft und mehr unter www.vvs.de Mit dem BusMit der Buslinie 70 bis Haltestelle Ruhbank oder Königsträßle, von der Haltestelle kurzer Fußweg zum Stadion.Fahrplanauskunft und mehr unter www.vvs.de Mit dem Fahrrad / RollerAn Kassenanlage Süd und Kassenanlage Nord stehen zahlreiche kostenfreie Fahrradständer zur Verfügung, wo die Fahrräder abgeschlossen abgestellt werden können. Die Fahrradständer sind während der Spiele nicht bewacht. Helme und Rucksäcke / Taschen können an den kostenfreien Verwahrstellen am Stadioneinlass abgegeben werden."
