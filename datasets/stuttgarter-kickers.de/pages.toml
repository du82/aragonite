description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = 'FansKickers-FanprojektSoziale Arbeit mit Fußballfans des SV Stuttgarter KickersWir verstehen uns als Ansprechpartner für Fans bei Problemen u.a. in der Schule, im Studium, in der Berufsausbildung, in der Arbeit, in der Familie, mit Behörden, sowie bei Stadionverboten.Wir beraten Euch in diesen Angelegenheiten sehr gerne, stehen aber auch in jeglicher anderer Problemlage des Lebens für Euch mit Rat und Tat zur Seite.Wir begleiten jedes Spiel unserer Blauen, egal ob daheim oder auswärts, und stehen somit auch am Spieltag selbst direkt als Ansprechpartner bei Problemen zur Verfügung.Außerdem habt Ihr die Möglichkeit, Euch während der Bürozeiten und der Öffnungszeiten der Fanräume vertrauensvoll mit Euren Problemen, auch anonym, an uns zu wenden. Gerne könnt Ihr uns aber auch telefonisch kontaktieren und einen Termin mit uns vereinbaren. Dieser muss auch nicht zwingend in unseren Räumlichkeiten stattfinden. Gerne kommen wir auch zu Euch oder wir treffen uns an einem neutralen Ort.Durch unsere Arbeit sind wir gut vernetzt, so dass wir Euch auch weitergehende Unterstützungs- und Beratungsangebote vermitteln können. Gerne begleiten wir Euch auch zu weitergehenden Terminen bei Behörden, in der Schule, bei der Arbeit oder anderen Institutionen.Wir arbeiten nach dem Nationalen Konzept Sport und Sicherheit (NKSS) und dem Kinder- und Jugendhilfegesetz und somit nach diesen Grundsätzen:ParteilichkeitAls Fanprojekt verstehen wir uns als kritische Lobbyisten für Fußballfans. Wir setzen uns grundsätzlich für die Belange von Fans ein.FreiwilligkeitNur wenn Du es willst, treten wir für Dich in Aktion.VertraulichkeitUnsere Gespräche sind streng vertraulich. Es erfolgt keine Weitergabe von Namen, Daten und Inhalten an Dritte, denn für uns gelten unter anderem folgende Paragraphen: § 203 StGB (Verletzung von Privatgeheimnissen), §35 SGB I (Sozialgeheimnis), §65 SGB VIII (Besonderer Vertrauensschutz) sowie §§ 67 ff SGB X (Schutz der Sozialdaten)und deshalb...…sichern wir jedem, der Hilfe in Anspruch nimmt, Diskretion und Verschwiegenheit zu.Kontakt:Adresse:Alexanderstraße 17, 70184 StuttgartMail: info@kickers-fanprojekt.dehttps://kickers-fanprojekt.deÖffnungszeiten Büro:Dienstag: 13-15 UhrMittwoch+Donnerstag: 10-13 UhrOffener Treff:Dienstag: 15-21 UhrMittwoch+Donnerstag: 13-18 UhrSowie nach Absprache - Geänderte Öffnungszeiten geben wir – wenn möglich – rechtzeitig bekanntAnsprechpartner Kickers-Fanprojekt<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2F232b97a1-ca09-41cd-b7bd-24bad4a4d80c_daniel-metz.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2