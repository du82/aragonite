["http://stuttgarter-kickers.de/aktuelles/medieninformation/akkreditierung"]
title = "Akkreditierungsantrag - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = "MedieninformationAkkreditierungsantragMedienakkreditierung für ein Kickers-HeimspielBitte senden Sie Ihren Akkreditierungsantrag spätestens zwei Arbeitstage vor dem Spiel an unsere Kickers-Geschäftsstelle per E-Mail an tickets@stuttgarter-kickers.de. Eine spätere Akkreditierung (bspw. am Spieltag) ist nicht möglich.Der Antragsteller versichert mit der Einreichung des Akkreditierungsantrages die Kenntnis der Durchführungsbestimmungen zu den Medienrichtlinien für die Spiele der Regionalliga Südwest und deren strikte Umsetzung bzw. Einhaltung. Eine Nichteinhaltung der in den Medienrichtlinien festgelegten Vorgaben hat den sofortigen Entzug der Akkreditierung zur Folge.PressekartePresse-Arbeitskarte für die Medientribüne im Block E4 Reihe 12 und 13mit Arbeitsplatz, Stromanschluss & Internet / WLAN sind vorhanden, aber Telefon / ISDN-Anschluss muss bei der Telekom bestellt werdenZugang zum Medienraum (vor & nach dem Spiel / in der Halbzeitpause)Zugang zur Mixed Zone (nach Spielende am Spielfeld / Kabinenzugang)Zugang zur Pressekonferenz nach dem Spiel im Medienraum, der sich im rückwärtigen Bereich der Haupttribüne befindetWLAN-Voucher ist kostenfrei im Medienraum erhältlichFotokarteFoto-Arbeitskarte für den Spielfeld-Innenraum mitZugang zum Spielfeld / InnenraumZugang zum Medienraum (vor & nach dem Spiel / in der Halbzeitpause)Zugang zur Mixed Zone (nach Spielende am Spielfeld/Kabinenzugang)Zugang zur Pressekonferenz nach dem Spiel im Medienraum, der sich im rückwärtigen Bereich der Haupttribüne befindetWLAN-Voucher ist kostenfrei im Medienraum erhältlichFotoleibchen gibt es in der Oberliga nicht bzw. sind nicht erforderlichBitte beachten SieBei einer Akkreditierung erhalten Sie von einem Mitarbeiter der Geschäftsstelle eine schriftliche Bestätigung mit den Informationen, ob Sie die Akkreditierung zugeschickt bekommen oder an der Service-/Hinterlegungskasse abgeholt werden können.HinweisWir möchten Sie ausdrücklich darauf hinweisen, dass der Medienbereich ein Arbeitsbereich ist, in dem ausschließlich arbeitende Kollegen zugelassen werden. Wir bitten Sie daher, die Pressekarten nicht an Partner, Verwandte oder Freunde weiterzugeben. Das Mitbringen von Kindern bzw. Minderjährigen ist ebenfalls nicht gestattet. Bei Fragen steht Ihnen unsere Geschäftsstelle gerne zur Verfügung."
