["https://stuttgarter-kickers.de/nachwuchs/porsche-fussballschule/camps"]
title = "Feriencamps / Wochenendcamps Porsche Fußballschule - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu den Angeboten der Porsche Fußballschule."
full_description = 'Porsche FußballschuleFeriencamps und WochenendcampsQuick LinksBuchungsportalPorsche FußballschuleFussballcampsMädchencampsZusatztrainingStadionführungKontakt & FAQ der Porsche FußballschuleUnsereCampsDie Porsche Fußballschule Stuttgarter Kickers ermöglicht allen Räuberle im Alter von 6 bis 13 Jahren einmal wie die Profis zu trainieren. Getreu unserem Motto „Spaß und Entwicklung vereinen“ steht bei uns die Freude am Fußball und die individuelle, vielseitige Förderung der Räuberle im Fokus. Durch unser systematisches Ausbildungskonzept und unseren qualifizierten Trainer/innen profitiert jeder, egal ob Fußballneuling oder etablierter Vereinsspieler, gleichermaßen von unserem Trainingsangebot. Auf dieser Seite könnt ihr euch informieren überPorsche Fußball-Feriencamps bei den KickersDie Feriencamps finden während den Ostern-, Pfingst-, Sommer-, Herbst- und Winterferien statt. Im Winter finden die Camps in der Halle statt, ansonsten im ADM-Sportpark oder auf der Bezirkssportanlage Waldau in Stuttgart-Degerloch. Die Trainingszeiten sind täglich von 10 bis 16 Uhr. Was euch erwartet:Training:Altersgerechtes Training für unsere Räuberle im Alter von 6 bis 13 Jahren Spannende Wettbewerbe und AbschlussformenAusstattung:Trikot-Set bestehend aus Trikot, Hose und Stutzen von Uhlsport Eigener Fußball mit Kickers LogoDie restliche Ausrüstung (Schuhe, Duschsachen, ggf. Sweatshirt, Pants, Regenjacke, ...) bitte selbst mitbringenEmpfohlenes Schuhwerk: Multinocken / Tausendfüßler, Nockenschuhe, Turnschuhe (keine Stollenschuhe, außer es wird auf der Live-Page ausdrücklich verlangt!)Verpflegung:Warmes Mittagessen an allen Camp Tagen inklusive GetränkenEnsinger-Mineralwasser während des Trainings an allen TagenVeranstaltungstermine sowie die Anmeldung laufen online über unser Buchungsportal ab. Wir freuen uns auf euch! Jetzt AnmeldenFeriencamps bei KooperationsvereinenDie Porsche Fußballschule Stuttgarter Kickers kooperiert mit vielen anderen Vereinen in der Umgebung. Es werden Feriencamps auf den jeweiligen Vereinsgelände der Kooperationsvereine angeboten. Die Trainingszeiten sind täglich von 10 bis 16 Uhr. Was euch erwartet:Training:Altersgerechtes Training für unsere Räuberle im Alter von 6 bis 13 Jahren Spannende Wettbewerbe und AbschlussformenAusstattung:Trikot-Set bestehend aus Trikot, Hose und Stutzen von Uhlsport Eigener Fußball mit Kickers LogoDie restliche Ausrüstung (Schuhe, Duschsachen, ggf. Sweatshirt, Pants, Regenjacke, ...) bitte selbst mitbringenEmpfohlenes Schuhwerk: Multinocken / Tausendfüßler, Nockenschuhe, Turnschuhe (keine Stollenschuhe, außer es wird auf der Live-Page ausdrücklich verlangt!)Verpflegung:Warmes Mittagessen an allen Camp Tagen inklusive GetränkenMineralwasser während des Trainings an allen TagenVeranstaltungstermine sowie die Anmeldung laufen online über unser Buchungsportal ab. Wir freuen uns auf euch! Jetzt AnmeldenSpieltagscamps vor den Kickers-HeimspielenIhr möchtet euer Fußballtraining mit einem Stadionbesuch verbinden? Dann ist unser Spieltagscamp der Kickers-Fußballschule genau das Richtige für euch. Unter dem Motto „Spaß und Entwicklung vereinen“ können sich Vereine bei uns für ein Spieltagscamp anmelden. Was euch erwartet:90-minütige Trainingseinheit Gemeinsamer Stadionbesuch der 1.Mannschaft Kickers-Shirt Verzehrgutschein Highlight: Einlaufkind mit der 1.Mannschaft Alle weiteren Infos zum Spieltagscamp hier. Wir freuen uns auf euch! Weitere InfosAnmeldung:Anmeldungen zu allen Veranstaltungen sind online über unser Buchungsportal möglichDie Teilnehmerplätze sind beschränkt, daher bitten wir um frühzeitige AnmeldungKontakt:Alle Informationen erhaltet Ihr auf der Kickers-Geschäftsstelle, Kickers-Fanshop, per Telefon 0711 / 767 10 - 80 oder per E-Mail an fussballschule@stuttgarter-kickers.deBei Rückfragen stehen Euch die Kollegen der Porsche Fussballschule Stuttgarter Kickers unter Telefon 0711 / 767 10 - 80 gerne zur Verfügung.<img alt="" loading="lazy" decoding="async" data-nimg="fill" 