["https://stuttgarter-kickers.de/fans/b-block/fanfreundschaften"]
title = "Fanfreundschaften - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers - Hier findest Du Informationen zu den Fanfreundschaften unserer Aktiven Fanszene"
full_description = 'FansFanfreundschaftenDie Wurzeln der Fanfreundschaft zwischen Stuttgart und Regensburg gehen schon viele Jahre zurück. Bereits Ende der 90er Jahre pflegten der Regensburger Fanclub Rot Weiß Bavaria 81 vermehrt Kontakte zu den Blue Boys aus Degerloch. So auch am 04.05.2005 als an einem Mittwochabend das Spiel zwischen den Rothosen und den Kickers nachgeholt werden musste. Im Anschluss wollten beide Fanclubs noch diverse Kaltgetränke genießen und luden daraufhin auch die anwesenden Ultras ein. So begann für beide Gruppen – Blaue Bomber und Ultras Regensburg – eines ihrer wichtigsten Kapitel. Zur neuen Saison erfolgten dann auch die ersten gegenseitigen Spielbesuche und die Freundschaft nahm langsam Fahrt auf. Die Fans der Stuttgarter Kickers pflegten zudem schon seit den frühen 90ern eine Freundschaft nach Linz. Durch Spielbesuche, ausufernde Feiern und legendäre Beachsoccer-Turniere in Stuttgart kam auch der Kontakt zwischen Regensburg und Blau Weiß zustande. Bereits ab der Saison 2006/2007 gab es erste Spielbesuche und gemeinsame Feiern zwischen den Fanszenen mit unvergesslichen Erlebnissen. Waren es anfänglich noch eine Handvoll Leute, die sich regelmäßig auf den Weg zu den Freunden machten, ist die Anzahl stetig gewachsen. Seit vielen Jahren bestehen persönliche Freundschaften, die nicht mehr wegzudenken sind. Ebenso beschränkt sich das Verhältnis längst nicht mehr auf die jeweiligen Ultras, sondern auf verschiedenstes Fanklientel! Seit mittlerweile fast zwei Jahrzehnten unterstützen sich die Fans der drei Vereine gegenseitig. Mit großer Wertschätzung und Respekt wird die Freundschaft zwischen den drei Städten intensiv gelebt. Heute sogar stärker denn je. Spielbesuche, gemeinsame Aktionen und Feiern mit teils dreistelliger Personenanzahl sind keine Seltenheit mehr. Es ehrt uns sehr, zu zwei solch traditionsreichen Fanszenen eine Freundschaft zu pflegen und Seite an Seite den Weg zu bestreiten. STUTTGART • LINZ • REGENSBURG<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensburg%2B1.jpg%3Fauto%3Dcompress%2Cformat&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2Fda5b031c-bef2-44a0-a637-38322abc6647_stuttgart_linz_regensbur