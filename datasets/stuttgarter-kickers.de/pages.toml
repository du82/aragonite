title = "Kontakt und Ansprechpartner - SV Stuttgarter Kickers e.V."
description = "Herzlich Willkommen beim SV Stuttgarter Kickers - Hier findest Du alle Informationen zu unserem Nachwuchs"
full_description = "NachwuchsKontakt und Ansprechpartner im NLZ und FußballschuleDu hast Fragen oder Wünsche, dann soll Dir diese Seite weiterhelfen. Denn hier findest Du alle Ansprechpartner im Kickers-Nachwuchsleistungszentrum und der Fußballschule.Anschrift der Kickers-Fußballjugend / Nachwuchsleistungszentrum:SV Stuttgarter Kickers e.V.NachwuchsleistungszentrumKönigsträßle 5670597 Stuttgart (Degerloch)Erreichbarkeit des Jugend-Orga-Teams:Telefon: 0711 / 767 10 - 40 und -41Telefax: 0711 / 767 10 - 44E-Mail: junioren@stuttgarter-kickers.deSprech- und Öffnungszeiten Kickers-Jugendhaus: Montag bis Freitag von ca. 14.00 Uhr bis 19.00 Uhr.Samstag und Sonntag ist das Jugendbüro geschlossen.Das Kickers-Jugendhaus:Für die Kickers-Jugend gibt es im ADM-Sportpark das Kickers-Jugendhaus. Das Jugendhaus befindet neben den Kabinen und ist der Anlaufpunkt für die Kickers-Jugend. Hier befindet sich das Büro für die NLZ-Leitung und das Orga-Team und ein Aufenthaltsraum mit kleiner Küche, Beamer, TV und Video für Mannschaftsbesprechungen und Videoanalyse.Organigramm Kickers-NachwuchsleistungszentrumOrganigramm Nachwuchsleistungszentrum (Stand Januar 2024)Ansprechpartner:Sportlicher Leiter NLZ:Norbert StippelTelefon: 0711 / 767 10 - 41E-Mail: stippel@stuttgarter-kickers.deAdministrativer Leiter NLZFlorian HofbergerTelefon: 0711 / 767 10 - 40E-Mail: hofberger@stuttgarter-kickers.deAdministration Porsche FußballschuleTelefon: 0711 / 767 10 - 80 (Zentrale)E-Mail: fussballschule@stuttgarter-kickers.deLevi Kaiser Telefon: 0711 / 767 10 - 81E-Mail: l.kaiser@stuttgarter-kickers.deNLZ-Orga-Team:Pädagogischer Leiter: Benaja Schmolla (E-Mail: schmolla@stuttgarter-kickers.de)Turnierkoordination: Thomas Christ / Valentin Reichenbach (E-Mail: junioren@stuttgarter-kickers.de)Kinderschutz, Prävention Gewalt und Anti-Rassismus: Florian Hofberger (E-Mail: hofberger@stuttgarter-kickers.de) und Thomas Bachmann (E-Mail bachmann@stuttgarter-kickers.de)Übergangskoordinator:Julian LeistE-Mail: leist@stu