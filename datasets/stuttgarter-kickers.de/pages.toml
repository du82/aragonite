description = "Herzlich Willkommen beim SV Stuttgarter Kickers e.V. - Hier finden Sie Informationen zu Profis, Nachwuchs, Videos, Bildergalerien und vieles mehr."
full_description = '''FansStuttgarter Kickers E-SportsDas Stuttgarter Kickers E-Sports-TeamE-SPORTS versteht sich als der sportliche Wettkampf von Video- und Computerspielern. Dieses Phänomen erfreut sich in ganz Europa zunehmender Beliebtheit. Die Wachstumsraten der Branche lagen in den vergangenen Jahren bei über 20%. Auch für die kommenden Jahre wird erwartet, dass sich diese Entwicklung fortsetzt. Deutschland ist dabei Europas größter E-SPORTS-Markt mit einem Umsatzvolumen von aktuell 70 Millionen Euro, welcher gemäß der Deloitte-Studie „Let's Play!“ bis 2023 auf eine Höhe von 180 Millionen Euro anwachsen wird.Leere Fußballstadien, ausgesetzte Spielpläne – so sah es während der Corona-Pandemie aus. Aber ein Fußball rollte immer noch - zumindest virtuell. Und das richtig erfolgreich. Das Stuttgarter Kickers E-Sports Team nahm an verschiedenen E-Sports Wettbewerben teil und etablierte sich schnell in der Welt des E-Sports. Wie bei einer echten Mannschaft steuern hier 11 Spieler virtuell die Mannschaft der Stuttgarter Kickers.Entstanden ist die Idee eines solchen Teams von Fans aus dem Kickers-Umfeld, die mit der Teilnahme an den E-Sports Wettkämpfen den Verein Stuttgarter Kickers nach außen tragen wollen. Auch wenn die Spieler auf dem virtuellen Platz nicht die Namen der derzeitigen Mannschaft tragen, tritt die Mannschaft als SVK auf.Das Team besteht aus einer breiten Altersklasse zwischen 18 und über 50 jährigen Gamern.Den Trainerstab bilden unter der Leitung von Mirco Djerdak, Cheftrainer & Mentalcoach Pierre-Jan Lechner sowie den Taktik und Assistenztrainer Enrico Dutschke und Dominik Alfarano.Aktuelle Ligen: VPL eBundesliga, VPL Championsleague, Alpen League, BEL2, VPG3ADas Stuttgarter Kickers E-Sports-Team freut sich auf Dich und Deine Unterstützung:Facebook: Stuttgarter Kickers Esports auf FacebookInstagram: https://www.instagram.com/stuttgarterkickersesportsTwitch: https://m.twitch.tv/svk_esports_etvYouTube: https://www.youtube.com/@SVKESportseTVE-Mail: esports@stuttgarter-kickers.de Kontakt kann sehr gerne über unsere Social Media Kanäle oder E-Mail aufgenommen werden.Der Spielerkader des E-Sports-TeamsTorwart:1 Volker Schall | DE13 André Hanusch | ATAbwehr:2 Marvin Haas | DE3 Dominik Liebl | DE28 André Eimertenbrink | DE44 Nico Meyer | DE72 Dennis Fischer | DE85 Björn Kornfeind | DE 97 Dennis Westphal | DEMittelfeld:6 Ryan Sydney Kettle | GB8 Mirco Djerdak | DE10 Pierre-Jan Lechner | AT14 Benjamin Beck | DE23 Pascal Hämmerle | AT31 Tobias Scheuermann | DE45 Benjamin Flum | DE71 Patrick König | HR96 René Mangold | DE99 Nico Käfer | DEAngriff:7 Jonas Andreas Steinwachs | DE9 Dominik Alfarano | DE11 Enrico Dutschke | DE19 Brandon Hallstein | USA22 Luke Kulzer | GB33 Michael Trinko | AT34 Stefan Schwarz | DESpielplanDas Team hat sich dazu entschlossen, wieder in verschiedenen virtuellen Ligen durchzustarten und ist in folgenden Ligen vertreten: <img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEpbqstJ9-LkB_VPLeBundesliganeu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>VPL eBundesligaEine über Jahre etablierte Liga, in der nur echte Fußballvereine mit ihren E-Sports Teams antreten dürfen. Die Kickers treffen hier auf Vereine wie den SC Paderborn 07, 1860 München oder auch den VFB Oldenburg. Die Spiele finden Donnerstags um 20:10 und 20:35 Uhr statt.<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEJbqstJ9-Lj-_Bandenkickneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>BEL 2Die Bandenkick Esport League, kurz BEL, ist eine 2019 gegründete Plattform. Über 90 Teams treten in gestaffelten Ligen gegeneinander an. Ein guter Mix zwischen offiziellen E-Sport Vereinen und Community Clubs bieten eine gute Mischung.<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ6EDEZbqstJ9-LkA_VPGLogoneu.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>VPG DE 3ADie größte Liga in Deutschland und Europa. Mit über 50 Tausend Gamer ein Reiz für jedes E-Sport Team sich hier zu etablieren. Die Spiele sind Montags um 21:00 Uhr und 21:30 Uhr.<img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fimages.prismic.io%2Fstuttgarter-kickers%2FZ62zIJbqstJ9-jsM_VPLChampionsLeagueEsport.jpg%3Fauto%3Dformat%2Ccompress&amp;w=3840&amp;q=75"/>VPL Champions LeagueDie VPL Champions League ist wie im realen Fußball die Königsklasse des VPL-Verbands. Hier treten die besten Europäischen Mannschaften im Rennen um den begehrten Titel "Champions League Sieger" an.'''
