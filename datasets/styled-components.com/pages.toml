title = "styled-components: API Reference"
description = "API Reference of styled-components"
full_description = '''This is the default export. This is a low-level factory we use to create the styled.tagname helper methods. This is what you pass into your styled calls – a tagged template literal. This is an ES6 language feature. You can learn more about them in the Tagged Template Literals section. This can either be a string or a function. Strings are combined with the rules as-is. Functions will receive the styled component's props as the first and only argument. The properties that are passed into an interpolated function get attached a special property, theme, which is injected by a higher level ThemeProvider component. Check the section on Theming for more information on this. You can also return objects from interpolations or input objects directly, and they'll be treated as inline styles. However this is highly discouraged, as the CSS syntax has support for pseudo selectors, media queries, nesting, etc., which the object syntax doesn't. A styled React component. This is returned when you call styled.tagname or styled(Component) with styles. This component can take any prop. It passes it on to the HTML node if it's a valid attribute, otherwise it only passes it into interpolated functions. (see Tagged Template Literal) You can pass an arbitrary classname to a styled component without problem and it will be applied next to the styles defined by the styled call. (e.g. <MyStyledComp className="bootstrap__btn" />) This is a chainable method that attaches some props to a styled component. The first and only argument is an object that will be merged into the rest of the component's props. The attrs object accepts the following values: These can be of any type, except functions. They'll stay static and will be merged into the existing component props. A function that receives the props that are passed into the component and computes a value, that is then going to be merged into the existing component props. If you want to keep all the styling you've applied to a component but just switch out what's being ultimately rendered (be it a different HTML tag or a different custom component), you can use the "as" prop to do this at runtime.'''
author = "styled-components"
year_published = 2025
