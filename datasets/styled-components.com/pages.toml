["https://styled-components.com/docs/basics"]
title = "styled-components: Basics"
description = "Get Started with styled-components basics."
full_description = '''styled-components is the result of wondering how we could enhance CSS for styling React component systems. By focusing on a single use case we managed to optimize the experience for developers as well as the output for end users. You get all of these benefits while still writing the CSS you know and love, just bound to individual components. If you use a package manager like yarn that supports the "resolutions" package.json field, we also highly recommend you add an entry to it as well corresponding to the major version range. This helps avoid an entire class of problems that arise from multiple versions of styled-components being installed in your project. It's highly recommended (but not required) to also use the Babel plugin. It offers many benefits like more legible class names, server-side rendering compatibility, smaller bundles, and more. If you're not using a module bundler or package manager we also have a global ("UMD") build hosted on the unpkg CDN. Simply add the following <script> tag to the bottom of your HTML file: This style of usage requires the react CDN bundles and the react-is CDN bundle to be on the page as well (before the styled-components script.) It removes the mapping between components and styles. This means that when you're defining your styles, you're actually creating a normal React component, that has your styles attached to it. This is a live editor, so play around with the code to get a feel for what it's like to work with styled-components! You can pass a function ("interpolations") to a styled component's template literal to adapt it based on its props. This button component has a primary state that changes its color. When setting the $primary prop to true, we are swapping out its background and text color. Quite frequently you might want to use a component, but change it slightly for a single case. Now, you could pass in an interpolated function and change them based on some props, but that's quite a lot of effort for overriding the styles once.'''
author = "styled-components"
year_published = 2025
clearnet = "https://styled-components.com/docs/basics"
