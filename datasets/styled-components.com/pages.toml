["https://styled-components.com/docs/advanced"]
title = "styled-components: Advanced Usage"
description = "Theming, refs, Security, Existing CSS, Tagged Template Literals, Server-Side Rendering and Style Objects"
full_description = "styled-components has full theming support by exporting a <ThemeProvider> wrapper component. This component provides a theme to all React components underneath itself via the context API. In the render tree all styled-components will have access to the provided theme, even when they are multiple levels deep. To illustrate this, let's create our Button component, but this time we'll pass some variables down as a theme. You can also pass a function for the theme prop. This function will receive the parent theme, that is from another <ThemeProvider> higher up the tree. This way themes themselves can be made contextual. This example renders our above themed Button and a second one that uses a second ThemeProvider to invert the background and foreground colors. The function invertTheme receives the upper theme and creates a new one. If you ever need to use the current theme outside styled components (e.g. inside big components), you can use the withTheme higher order component. You can also use useContext to access the current theme outside of styled components when working with React Hooks. You can also use useTheme to access the current theme outside of styled components when working with React Hooks. Passing a ref prop to a styled component will give you one of two things depending on the styled target: Using an older version of styled-components (below 4.0.0) or of React? Use the innerRef prop instead. Since styled-components allows you to use arbitrary input as interpolations, you must be careful to sanitize that input. Using user input as styles can lead to any CSS being evaluated in the user's browser that an attacker can place in your application. This example shows how bad user input can even lead to API endpoints being called on a user's behalf. Be very careful! This is obviously a made-up example, but CSS injection can be unobvious and have bad repercussions. Some IE versions even execute arbitrary JavaScript within url declarations. There is an upcoming standard to sanitize CSS from JavaScript, CSS.escape. It's not very well supported across browsers yet, so we recommend using the polyfill by Mathias Bynens in your app."
