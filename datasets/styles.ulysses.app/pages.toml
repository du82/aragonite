While writing your script, make use of Ulysses’  Show More
  This style allows you to create a “Hollywood standard” script with Ulysses.

The font is 12 pt. Courier, page margins are set to the conventional one-inch width, with an extra half-inch on the left margin for binding. Page numbers are located top right.

While writing your script, make use of Ulysses’ markup tags as follows:
- Heading 1 (#) to mark up character cues.
- Heading 2 (##) to mark up scene headings / slug lines.
- Heading 3 (###) to mark up “wrylies” (parenthenticals)
- Heading 5 (#####) to mark up transitions

For your title page, use the markup tags as follows:
- Heading 4 (####) for title and author name
- Block Quote for contact information, like this

####STANDARD SPEC SCRIPT
####By
####A. Writer
> writer@email.com
> (555)555-5555

Export title page and manuscript separately as two PDFs, and combine them afterwards in Preview into one document.  Show Less"""
