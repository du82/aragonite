- Use H2 to begin each front matter page, with the title wrapped in an ++inline  Show More
  A beautiful, clean style for creating 5x8" trade paperback novels, with chapter headings and/or parts. It includes blank-line scene breaks for HR, chapter and part headings for H1, and front matter formatting as follows:

- Use H2 to begin each front matter page, with the title wrapped in an ++inline comment++.

- Use H3 for left-aligned front matter content like an author biography or series information.

- Use H4 for centered front matter content like a copyright notice or dedication.

- On your book's title page, use H6 for the author's name (and series title, if appropriate), and use H5 for the book's title.

The end result will be a beautifully laid-out paperback ready for print on demand.

