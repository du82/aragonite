title = "Privacy policy | Sublime Feed"
description = "reading for human. the first feed reader that doesn't make you want to scratch your eyes out. period."
full_description = "# Privacy The following discloses the information gathering and dissemination practices for this Website and service. # Information Automatically Logged We use Sentry.io, an automatic debugging service, in the event sublimefeed.com throws an error, with minimal information held about you. We only hold your customer id for debugging purpose only on Sentry.io. Server logs are filtered for sensitive data and deleted after 14 days. We do not access logs for any purpose except for debugging or security if ever required. We have no way to tie any of this to your identity. This also applies to any third-party visiting the site. We use Cloudflare to protect the service from malicious abuse of the platform. Read their privacy policy hereopen in new window. # Billing Section sublimefeed.com uses Lemon Squeezyopen in new window to handle payments. See their respective Privacy policy. We do not store your full credit card details. # Security This site has security measures in place to protect the loss, misuse, and alteration of the information under our control. We use SSL encryption to ensure privacy between you and us. We use Cloudflareopen in new window to protect the service from malicious abuse of the platform. # Third Parties Except for debugging we do not share any data with a third party nor do we ever sell your data. We respect you as a human being. # Analytics We use our own analytics, tinylytics, to track visitors to our site. It logs no personally identifiable data and is GDPR compliant, hosted in Europe and is first party (written by me). # Cookies We use a cookie to keep you logged in. This is deleted when logging out. We do not use this cookie for anything else other than providing you with a great service."
