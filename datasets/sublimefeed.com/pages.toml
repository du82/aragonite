title = "Sublime Feed"
description = "reading for human. the first feed reader that doesn't make you want to scratch your eyes out. period."
full_description = '''A blissful reading experience for your feeds The first RSS feed reader that's tailored for a more calm approach. Embrace the FOMO and go with the flow of life. Get started for free → No credit card required Bye bye, anxiety No more "1000+ unread" anxiety. We've ditched the unread counts completely. Just you and your feeds, living in the moment. How refreshing is that? Precious moments Every visit is a moment in time, never to be repeated. Your feed is a beautiful snapshot of now. We quietly fetch everything in the background while you savor the present. Your VIP list Got favorites? Pin them! Each feed gets its own cozy corner where you can dive deep into their past posts whenever you want. No pressure though. Keep it real We love the web in all its quirky glory. Read posts on their original sites, but when things get messy, our reader mode has your back. Best of both worlds! Sublime Feed is designed with text based blogs and feeds in mind. We also support image and video based posts. We're just getting started and will keep to the core of the philosophy whilst we're building. Simple, fair pricing Free forever 10 feeds Start your journey today. No credit card needed, no strings attached. Just pure reading joy. Unlimited feeds $3/month or $30/year Unlock unlimited feeds and get first dibs on new features we're cooking up! 🎁 Looking for a one-time purchase? We offer a lifetime option too. Sign up to learn more. Start reading for free → "Because reading should be full of delightful encounters." — Vincent'''
