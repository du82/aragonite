["https://sublimetext.com/blog/articles/2011/01"]
title = "January 2011 - News - Sublime HQ"
full_description = '''Sublime Text 2: New Version January 29, 2011 by Jon Skinner A new version of the Sublime Text 2 alpha, 20110129, is out now. This primarily addresses compatibility with Linux distributions other than Ubuntu, but I've snuck in some extra features for everyone: OS X: Command+1 will select the first tab, Command+2 the second, and so on. Various Goto Anything improvements, mostly notably, symbol browsing will start at the symbol closest to the cursor, and spaces are ignored when searching through files. Previously, a space would only match against a file name with a space in it. Syntax highlighting for the Go programming language. More! The full list of changes is on the Sublime Text 2 page. Release announcements are generally posted on the forum, rather than the blog, so I'll be posting them there (and on twitter) after this release. Sublime Text 2 FAQ January 29, 2011 by Jon Skinner There's been a fantastic response to the Sublime Text 2 alpha. A few questions have come up several times; answers are below. How do I change the font? Add these lines to Preferences/User File Preferences: "font_face": "Courier New", "font_size": 10 and then change as desired. The font will change when you save. How do I open a directory as a project? Drag the directory onto the sidebar, and it'll be added to the project. You'll then be able to browse using the sidebar, and search using Ctrl+P (Command+P on OS X) How do I open files using the command line on OS X? A command line tool will be coming in the future for OS X, in the mean time you can use this method, although you'll have to replace references to Sublime Text X with Sublime Text 2. How do I reset Sublime Text 2 to a fresh state? You'll need to exit Sublime Text 2, and then delete the data directory, which can be found at: Windows: %APPDATA%/Sublime Text 2 OS X: ~/Library/Application Support/Sublime Text 2 Linux: ~/.Sublime Text 2 I'm having trouble running Sublime Text 2 on Linux Ubuntu is the only supported distribution at the moment. I'm working to expand this as soon as possible.'''
