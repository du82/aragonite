["https://sublimetext.com/blog/articles/2021/05"]
title = "May 2021 - News - Sublime HQ"
full_description = '''Sublime Text 4 May 21, 2021 by Benjamin Schaaf p.caption-st4 { margin-top: 0.5em; color: #999; font-style: italic; } .button-st4 { display: inline-block; background-color: #407fbf; color: #fff !important; border-radius: 3px; padding: 8px 15px; text-decoration: none; transition: background-color 0.15s ease-in-out; -webkit-transition: background-color 0.15s ease-in-out; } .button-st4:hover { background-color: #369; } The first stable release of Sublime Text 4 has finally arrived! We've worked hard on providing improvements without losing focus on what makes Sublime Text great. There are some new major features that we hope will significantly improve your workflow and a countless number of minor improvements across the board. A huge thanks goes out to all the beta testers on discord and all the contributors to our packages. Download Sublime Text 4 License Changes Sublime Text license keys are no longer tied to a single major version, instead they are now valid for all updates within 3 years of purchase. After that, you will still have full access to every version of Sublime Text released within the 3 year window, but newer builds will required a license upgrade. These are the same license terms we use for Sublime Merge, and they allow us to deliver more frequent and exciting updates as soon as they're ready, without having to roll them into a new major version. Tab Multi-Select File tabs have been enhanced to make split views effortless, with support throughout the interface and built-in commands. The side bar, tab bar, Goto Anything, Goto Definition, auto complete and more have all been tweaked to make code navigation easier and more intuitive than ever. Apple Silicon and Linux ARM64 Sublime Text for Mac now includes native support for Apple Silicon processors. Linux ARM64 builds are also available for devices like the Raspberry Pi. Refreshed UI The Default and Adaptive themes have been refreshed with new tab styles and inactive pane dimming. Themes and Color Schemes support auto dark-mode switching. The Adaptive theme on Windows and Linux now features custom title bars. Context-Aware Auto Complete The auto complete engine has been rewritten to provide smart completions based on existing code in a project. Suggestions are also augmented with info about their kind, and provide links to definitions. TypeScript, JSX and TSX Support Support for one of the most popular new programming languages is now shipped by default. Utilize all of the smart syntax-based features of Sublime Text within the modern JavaScript ecosystem. Superpowered Syntax Definitions The syntax highlighting engine has been significantly improved, with new features like handling non-deterministic grammars, multi-line constructs, lazy embeds and syntax inheritance. Memory usage has been reduced, and load times are faster than ever. GPU Rendering Sublime Text can now utilize your GPU on Linux, Mac and Windows when rendering the interface. This results in a fluid UI all the way up to 8K resolutions, all while using less power than before. A single frame being rendered. See our blogpost on OpenGL rendering. Updated Python API The Sublime Text API has been updated to Python 3.8, while keeping backwards compatibility with packages built for Sublime Text 3. The API has been significantly expanded, adding features that allow plugins like LSP to work better than ever. Read the revamped documentation here. Compatibility Sublime Text 4 is fully compatible with version 3. It will pickup your session and configuration automatically. If you'd prefer however, it is possible to keep things separate. Download Sublime Text 4 Full Changelog GPU Rendering New hardware_acceleration setting will composite the UI on the GPU By default, GPU rendering is enabled on Mac, and disabled on Windows and Linux Details about the active GPU will be displayed in the Console Context-aware Auto Complete The auto complete engine now suggests completions based on patterns in existing code Uses the entire project as a source, instead of just the current view Plugins may specify symbol kind info to be displayed in suggestions list Tab Multi-Select Multiple tabs can be selected using ctrl/cmd, their contents will be shown side-by-side Selecting multiple files from the sidebar will also preview them simultaneously Included themes have a tab connector joining the active sheet and tab when using sheet multi-select The sidebar can now select multiple files using alt Goto Anything allows opening tabs side-by-side using ctrl/cmd The Definition popup has a dedicated button for opening files side-by-side Multiple tabs can also be selected from the tab dropdown The menu Selection/Tab Selection contains various options for manipulating tab multi-select File/New View into File has been replaced by File/Split View using multi-select Python 3.8 API Added a Python 3.8 API environment for plugins Plugins can choose Python version via .python-version file in plugin folder Existing plugins are fully supported via legacy Python 3.3 API Many API improvements and additions - see API section for more details Goto Symbol Goto Symbol in Project is now significantly faster on huge projects Icons are now shown next to symbols, indicating the symbol kind Symbols with 3 characters or less are now indexed Syntax Definitions Added out of the box support for TypeScript, JSX and TSX - thanks to Thomas Smith Added ability to "branch" within syntax definitions, for non-deterministic or multi-line constructs Many syntax highlighting improvements, including significant improvements to: Erlang, with thanks to deathaxe Significantly improved load times, match times and reduced cache size on disk embed is now lazy loaded, resulting in much higher performance for syntaxes like markdown Added branch and fail for non-deterministic parsing Added version: 2 to fix edge cases while retaining backwards compatibility Added extends to inherit from another syntax definition. Multiple inheritance is supported, provided all parents have the same base syntax Added hidden_extensions Allow using pop alongside push/set/embed/branch Fixed a performance issue with bounded repeats in regular expressions Syntax tests can now assert that reindent is working as expected Syntax tests can now assert that symbols are indexed Prevent infinite include loops via with_prototype Fixed a number of scope related bugs Fixed some regex capture related bugs Added more information to the Show Scope Name popup OS Compatibility The following operating systems are no longer supported as a result of adding Python 3.8: OS X 10.7 OS X 10.8 Windows XP Windows Vista Platform Integration Added automatic dark/light theme and color scheme switching, based on OS theme changes subl - can now be used to read from stdin on all platforms Windows will remember their Virtual Desktop/Space/Workspace, controlled by the remember_workspace setting Scroll bars now follow platform conventions when clicking on them. Configurable using Scroll Bar.sublime-mousemap Mac: Releases use universal binaries with Apple Silicon support Mac: Updated icon to follow macOS 11 style Mac: Windows will now stay maximized when using Mac window tabs Mac: Fix various issues with the wrong cursor being used Linux: ARM64 builds are now available Linux: Text drag and drop is now supported Linux: Added proper support for Wayland Linux: Touch screen events are now handled Linux: Better support for copy+paste with other applications that don't support utf8 text Linux: Native file dialogs like those for KDE will be used when configured Windows: IME preview and multi-select support Windows, Linux: Added support for custom title bars Windows, Linux: Use vsync for animations instead of a fixed 60hz Mac, Linux: Improved compatibility with some keyboard layouts Application Behavior Added Safe Mode, to simulate a clean install. Enabled by passing --safe-mode on the command line or holding shift+alt/option at startup on Windows/macOS respectively Added Help/Report a Bug to link to our public issue tracker Added options to hot_exit setting to control behavior when the last window is closed Fixed a possible case where an update loses the current session Settings containing a UTF-8 BOM will no longer fail to load Added support for previewing TGA and PSD images Added close_deleted_files setting to control behavior of session restoration when files have been deleted on disk Popup windows now use virtual windows for improved performance Improved performance when loading files with very long lines Improved rendering performance on very long lines Improved performance with large session files Data directories have dropped the "3", though if a "3" directory still exists it will be used Mac: Quick Switch Project now works without any windows open Mac, Linux: The cache and index are now located in the proper location (~/.cache and ~/Library/Caches respectively) Auto Complete Typing the full tab trigger of a snippet will move it to the top of the results Manually typing in the only available completion will hide the auto complete popup .sublime-completion files can now specify annotation, kind and details Ranking quality improvements Improved behavior of completions starting with non-word characters auto_complete_trailing_symbols is now disabled by default cancelCompletion will no longer prevent manual invocation Added the auto_complete_when_likely setting Added auto_complete_preserve_order setting Added auto_complete_include_snippets_when_typing setting Added auto_complete_use_index setting Added auto_complete_use_history setting to control if previous choices are automatically selected Running the auto_complete command when auto complete is already showing will re-query plugins for results auto_complete_selector now applies to the position before the just-typed in character, matching auto_complete_triggers Input Handling Modifier key taps can now be used as part of a key binding. For example, ["ctrl", "ctrl"] will trigger when Ctrl is pressed twice without pressing any other keys in between Linux: AltGr can now be used in key bindings via altgr Linux: Added a workaround for a touchscreen driver bug, which would cause right click and mouse scrolling to stop working Linux: When the menu is hidden, pressing alt will show it Mac: Fix Pinyin input Mac: Keypad keys can now be bound to as expected Mac: Added key bindings for macOS application tabs Windows, Linux: Hide mouse cursor when typing. Controlled via hide_pointer_while_typing setting Windows, Linux: Fixed being unable to bind Ctrl+Break Editor Control Added File/Print, which prints via a browser Added Edit/Copy as HTML Build systems now use new annotations functionality instead of phantoms, reducing re-flow Undo history is preserved in the session Comments and layout are preserved when programmatically editing preferences Caret blinking is disabled by default. Set caret_style setting to smooth for previous behavior Improved automatic indentation detection Added relative line numbers, controlled by the relative_line_numbers setting Added setting scroll_context_lines Added setting hide_pointer_while_typing Added setting control_character_style Added Project/Recent/Remove Deleted Added chain command to run multiple commands in series switch_file command now handles filenames with compound extensions The scroll_past_end setting now supports customizing the scroll distance using numbers from 0.0 to 1.0 Double-clicking a semi-transient sheet's tab will now fully open the sheet trim_trailing_white_space_on_save can now be set to "not_on_caret" trim_trailing_white_space_on_save now trims only newly inserted trailing whitespace by default. Controlled via trim_only_modified_white_space setting Expanded draw_white_space setting, supporting leading and trailing white space Unicode white space characters, such as the zero width no-break space, are now drawn as hex values. Controlled via draw_unicode_white_space setting Fixed spelling correction to support languages with upper case characters after start of word Added commands to simplify customizing the active theme or color scheme Quick Switch Project will open the selected project in a new window if Ctrl (Cmd on Mac) is held down Added wrap_width_style preference Added console_max_history_lines Added additional settings to control the status bar: show_sidebar_button, show_indentation and show_syntax Console now uses Python syntax highlighting by default Added Central European (Mac) encoding support Key Bindings: Join Lines is now on Ctrl+Shift+J / Cmd+Shift+J Key Bindings: Expand Selection to Indentation is no longer bound by default Key Bindings: Ctrl+J / Cmd+J is now used as a prefix for sequential key bindings, similar to Ctrl+K / Cmd+K Code Folding: fixed some edge-case incorrect behaviors Linux: Added support for alternate font weight names Linux: Selection is no longer cleared when another application makes a selection Linux: Added Ctrl+Space to trigger Auto Complete Linux, Windows: Added Alt+Shift+Left Mouse Button as an alternative column selection binding Linux, Windows: Added Shift+F10 key binding to open the context menu Text Commands Macros now record Find commands Reworked Jump Back and Jump Forward commands Improved behavior of Wrap Paragraph Improved behavior of Swap Lines Added Revert Diff Hunk Added Selection/Expand Selection as a general mechanism to expand the selection Selection/Split into Lines will now split a selection into words if the selection doesn't contain any newlines Show a sum in the status bar when there are multiple selections and all of them are numbers set_file_type command now accepts "scope:" prefixed syntax names Fixed sort_lines replacing unicode newlines with regular ones Snippets Added auto_complete_include_snippets setting, for disabling auto complete integration Added ignored_snippets setting, for disabling default snippets Indexing (Goto Definition) Files ignored by .gitignore are not indexed by default. Controlled via index_exclude_gitignore setting Files without known extensions are no longer indexed by default. Controlled via index_skip_unknown_extensions setting Improved behavior with constantly changing files Significantly improved load times Files and Folders Saving files is now asynchronous Improved performance when adding directories with extreme amounts of files When save_on_focus_lost is enabled, closing an unsaved file will save and close it, instead of prompting to save Improved behavior of save_on_focus_lost in conjunction with administrator owned files Added reload_file_on_change setting to control if files are automatically reloaded or not folder_exclude_patterns and folder_include_patterns now support project-relative paths, by starting the path with // Folders in the sidebar can be recursively expanded via alt+arrow key Added preview_on_click setting to support only previewing files on left click Windows: Fixed Open Containing Folder for UNC paths Windows: Fixed Save dialog not sh'''
