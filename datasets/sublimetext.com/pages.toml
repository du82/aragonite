["https://sublimetext.com/blog/articles/2019/03"]
title = "March 2019 - News - Sublime HQ"
full_description = '''Sublime Text 3.2 March 13, 2019 by Will Bond img.screenshot-32 { width: 600px; margin: 1em 0 0; display: block; filter: drop-shadow(3px 3px 5px #9998); } p.caption-32 { margin-top: 0.5em; color: #999; font-style: italic; } The past year has been busy here at Sublime HQ. We've grown our engineering team, shipped Sublime Text 3.1 and released our second product, Sublime Merge. If you use Git and like the ethos of Sublime Text, we think you'll love it. Today we're pushing out Sublime Text 3.2, which builds off of a bunch of work we've done in Sublime Merge. This includes: first-class Git integration, incremental diffing, new theme functionality and block caret support. Beyond that is a slew of other enhancements, stability improvements and performance gains. See the full changelog below for details. Sublime Text 3.2 is available from the Download page. Git status badges in the side bar and incremental diff markers in the gutter if (!window.res) { scale = 1 res = function() { scale = window.devicePixelRatio >= 1.3 ? 2 : 1 return scale == 2 ? '@2x' : '' } } function high_dpi_32_ss() { var ss = document.getElementsByClassName("screenshot-32"); for(var i = 0; i < ss.length; i++) { ss.item(i).src = ss.item(i).src.replace(/(@2x)?\.png/, res() + '.png'); } } high_dpi_32_ss() if (window.matchMedia) { window.matchMedia('screen and (-webkit-min-device-pixel-ratio: 1.3), ' + 'only screen and (-o-min-device-pixel-ratio: 13/10), ' + 'only screen and (min-resolution: 120dpi)').addListener(function(e) { high_dpi_32_ss() }) } Changelog Git Integration New! Files and folders in the sidebar will now display badges to indicate Git status Ignored files and folders are visually de-emphasized The current Git branch and number of modifications is displayed in the status bar Commands have been added to open a repository, see file or folder history, or blame a file in Sublime Merge Themes may customize the display of sidebar badges and status bar information The setting show_git_status allows disabling Git integration All file reads are done through a custom, high-performance Git library written for Sublime Merge Read the documentation Incremental Diff New! All changes to a document are now represented by dedicated markers in the gutter Diff markers show added, modified and deleted lines The setting mini_diff controls incremental diff behavior In coordination with the new Git functionality, diffs can be calculated against HEAD or the index The git_diff_target setting controls base document source API methods View.set_reference_document() and View.reset_reference_document() allow controlling the diff The following diff-related commands were added: Next Modification Previous Modification Revert Modification Full inline diffs of each change can be displayed via the right-click context menu, or keyboard shortcuts Inline diff presentation can be changed by customizing a color scheme Read the documentation Editor Control Added block_caret setting Improve positioning and sizing of gutter icons in some situations Fixed draw_minimap_border setting not working Linux: Improved input method (IM) support - fcitx, ibus, etc Linux: Fixed a crash when using GTK_IM_MODULE=xim Linux: Tweaked behavior of up/down when on the first and last lines of a file to better match platform conventions Windows: Improved IME support Themes/UI Enhanced the .sublime-theme format: Added variables support and associated revised JSON format with variables key Added extends keyword to have one theme derive from another Colors may be specified via CSS syntax Improved performance with large numbers of rules in a .sublime-theme Linux: Moved to GTK3 Linux: Various high DPI fixes Mac: Added Mojave support Mac: Add full support for macOS native tabs Mac: Ensure context menus are shown without scrolling Mac: Error message dialogs can now be closed with the escape key Mac: Improved window placement Mac: Improved resize performance Windows: Fixed minimized and maximized state not restoring Windows: Fixed a bug where auto complete entries would contain an ellipsis when not required Text Rendering Support for Unicode 11.0 Improved rendering of combining characters Fixed a caret positioning bug when non-trivial graphemes are present Fixed some cases of incorrect glyph positions on Windows and Mac Linux: Color glyphs are now drawn properly on light backgrounds Windows: Fixed a rendering issue with certain combining characters Windows: Fixed some fonts having an incorrect baseline Color Schemes Added block_caret key to use in conjunction with block carets caret values now respect alpha as expected, rather than pre-blending against the background color Added the foreground_adjust property to rules with a background. Accepts CSS color mod adjusters to manipulate the saturation, lightness or opacity of the foreground color. Syntax Highlighting Many syntax highlighting improvements, including significant improvements to: Clojure, with thanks to Nelo Mitranim D Go, with thanks to Nelo Mitranim Lua, with thanks to Thomas Smith Fixed a crash that could occur when nesting embed patterns in .sublime-syntax files Syntax Tests: Allow syntax test files to have a UTF-8 BOM Files and Folders Improve performance of file watching for ignored paths on Windows and Mac Windows: Fixed Open File treating paths as case-sensitive Windows: Properly unlock directories after contained files are closed API Added View.set_reference_document() and View.reset_reference_document() to control diff generation Phantoms are now drawn correctly in conjunction with draw_centered Various minor improvements related to plugin module loading and unloading Added support for hwb() colors to minihtml Added a custom min-contrast() adjuster for the CSS color mod function in minihtml Mac: Fixed a plugin_host crash when running a process that itself crashes Miscellaneous Fixed a Goto Symbol in Project performance regression F21..F24 keys can now be bound Assorted minor fixes and stability improvements Linux: Improved behavior of --wait command line argument when Sublime Text isn't currently running'''
