description = "Sublime Text is a sophisticated text editor for code, markup and prose. You'll love the slick user interface, extraordinary features and amazing performance."
full_description = '''Play Pause Effortlessly Split Panes and Navigate Between Code With the new Tab Multi-Select functionality, tabs become first-class citizens in the interface. A simple modifier when performing actions will split the interface to show multiple tabs at once. Works with the side bar, tab bar, Goto Anything and more! Side-by-Side Mode for Definitions The Definitions popup now supports side-by-side mode via the icon, or holding Ctrl⌘ while clicking a link. Goto Definition, Goto Reference and Goto Symbol in Project also support side-by-side viewing. Explore the full definition, not just a summary in a small popup. View Definitions in Auto Complete When an auto-complete word is a symbol with a definition, click the Definition link, or pressing F12 will open the definition to the right. When focus returns to the original file, the auto complete window will return to its last state. Use Multiple Selections to rename variables quickly Here Ctrl+D⌘+D is used to select the next occurrence of the current word. Ctrl+K, Ctrl+D⌘+K, ⌘+D will skip an occurence. Once created, each selection allows for full-featured editing. var captions = [ byid("caption1"), byid("caption2"), byid("caption3"), byid("caption4") ] var indicators = [ byid("indicator1"), byid("indicator2"), byid("indicator3"), byid("indicator4") ] var images = [] var target = byid('target') var use_canvas = target && target.getContext if (!use_canvas) { byid('target').style.display = 'none' target = byid('fallback') target.style.display = 'block' } function load_animation() { var script = byid('anim_script') if (script) script.parentNode.removeChild(script) script = document.createElement('script') script.setAttribute('src', 'screencasts/' + plat + '_' + theme + sc_res() + '.js?v2') document.body.appendChild(script) if (use_canvas) { target.width = sc_scale * width target.height = sc_scale * height } } load_animation() if (window.matchMedia) { window.matchMedia('screen and (-webkit-min-device-pixel-ratio: 1.3) and (min-width: 1025px), ' + 'only screen and (-o-min-device-pixel-ratio: 13/10) and (min-width: 1025px), ' + 'only screen and (min-resolution: 120dpi) and (min-width: 1025px)').addListener(function(e) { show_title_bar() load_animation() }) } function handle_resize(e) { target.style.height = Math.floor(target.clientWidth / width * height) + 'px' } handle_resize() if (window.addEventListener) window.addEventListener('resize', handle_resize, false) else if (window.attachEvent) window.attachEvent('onresize', handle_resize) var cur_screencast = 0 var subcasts = 0 var sub_screencast = 0 var auto_cycle = true function count_subcasts(force) { if (!force && subcasts != 0) return if (typeof animation_urls[cur_screencast] != "string") subcasts = animation_urls[cur_screencast].length else subcasts = 1 } function reset_subcasts() { sub_screencast = 0 count_subcasts(true) } function next() { auto_cycle = false show_pause_button() auto_next() } function auto_next() { cur_screencast = (cur_screencast + 1) % captions.length reset_subcasts() transition() } function prev() { auto_cycle = false show_pause_button() auto_prev() } function auto_prev() { --cur_screencast; if (cur_screencast < 0) cur_screencast = captions.length - 1 reset_subcasts() transition() } function jump_to(num) { while (num < 0) num = captions.length + num cur_screencast = num % captions.length reset_subcasts() transition() } function switch_theme(t) { theme = t if (window && window.history) window.history.replaceState({}, '', t == 'light' ? '/#' + t : '/') update_theme_selector() show_title_bar() load_animation() } function switch_os(os) { plat = os update_wrap_class() update_os_selector() show_title_bar() load_animation() } var continuation = null var start_time = null var remaining_time = 0 var timer = null function set_timeout(f, timeout) { start_time = new Date().getTime() remaining_time = timeout continuation = f timer = window.setTimeout(f, timeout) } // Only run a callback once an animation frame is available, allowing // the animation to be paused when in the background, etc function sync_frame(f) { if (!window.requestAnimationFrame) f() else window.requestAnimationFrame(f) } // Run a timeout synced to the animation frame function sync_timeout(f, timeout) { set_timeout(function() { sync_frame(f) }, timeout) } function pause_timeout() { var elapsed = (new Date().getTime()) - start_time remaining_time = Math.max(remaining_time - elapsed, 0) window.clearTimeout(timer) } function continue_timeout() { start_time = new Date().getTime() timer = window.setTimeout(continuation, remaining_time) } function show_play_button() { byid('button-pause').style.display = 'none' byid('button-play').style.display = 'inline-block' } function show_pause_button() { byid('button-play').style.display = 'none' byid('button-pause').style.display = 'inline-block' } function play() { show_pause_button() continue_timeout() } function pause() { pause_timeout() show_play_button() } var delay_scale = 0.7 var overlay = byid('title-overlay') function display_error() { window.clearTimeout(timer) continuation = null if (use_canvas) { var ctx = target.getContext('2d') ctx.clearRect(0, 0, target.width, target.height) } else { target.innerHTML = '' } overlay.getElementsByTagName('div')[0].innerHTML = '<i>Error loading screencast</i>'; overlay.className = 'show' } function update_meta() { for (var i = 0; i < captions.length; ++i) { if (i == cur_screencast) continue; captions[i].style.display = "none" indicators[i].className = "" } captions[cur_screencast].style.display = "block" indicators[cur_screencast].className = "active" var b_tags = captions[cur_screencast].getElementsByTagName('B') if (b_tags.length > 0) { overlay.getElementsByTagName('div')[0].innerHTML = b_tags[0].innerHTML; overlay.className = 'show' } } function hide_overlay() { overlay.className = '' } function transition() { if (timer) window.clearTimeout(timer) sync_frame(function() { count_subcasts(false) var img_url = animation_urls[cur_screencast] var timeline = animation_timelines[cur_screencast] if (subcasts > 1) { img_url = img_url[sub_screencast] timeline = timeline[sub_screencast] } var next_index = (cur_screencast + 1) % captions.length var next_img_url = animation_urls[next_index] if (subcasts > 1 && sub_screencast < subcasts - 1) next_img_url = animation_urls[cur_screencast][sub_screencast + 1] else if (typeof next_img_url != "string") next_img_url = next_img_url[0] var img = prep_animation(img_url, timeline, next_img_url) if (sub_screencast == 0) { sync_timeout(function() { hide_overlay() animate(img, timeline, target, 0) }, 2400) } else { animate(img, timeline, target, 0) } }) } function draw_canvas(img, element, frame, blits) { var ctx = element.getContext('2d') for (j = 0; j < blits.length; ++j) { var blit = blits[j] var sx = blit[0] var sy = blit[1] var w = blit[2] var h = blit[3] var dx = blit[4] var dy = blit[5] ctx.drawImage(img, sx, sy, w, h, dx, dy, w, h) } } function draw_fallback(img, element, frame, blits) { if (frame == 0) { while (element.hasChildNodes()) element.removeChild(element.lastChild) } for (j = 0; j < blits.length; ++j) { var blit = blits[j] var sx = blit[0] / sc_scale var sy = blit[1] / sc_scale var w = blit[2] / sc_scale var h = blit[3] / sc_scale var dx = blit[4] / sc_scale var dy = blit[5] / sc_scale var d = document.createElement('div') d.style.position = 'absolute' d.style.left = dx + "px" d.style.top = dy + "px" d.style.width = w + "px" d.style.height = h + "px" d.style.backgroundImage = "url('" + img.src + "')" d.style.backgroundPosition = "-" + sx + "px -" + sy + "px" d.style.backgroundSize = width + "px auto" element.appendChild(d) } } function draw(img, element, frame, blits) { if (use_canvas) draw_canvas(img, element, frame, blits) else draw_fallback(img, element, frame, blits) } function animate(img, timeline, element, start_frame) { var i = start_frame; var f = function() { var frame = i++ % timeline.length var delay = timeline[frame].delay * delay_scale var blits = timeline[frame].blit draw(img, element, frame, blits) var callback = f if (i == timeline.length * 2 && subcasts > 1 && sub_screencast < subcasts - 1) { sub_screencast += 1 callback = transition } else if (i == timeline.length * 2 && auto_cycle) { callback = auto_next } sync_timeout(callback, delay) } if (timer) window.clearTimeout(timer) sync_frame(f) } function prep_animation(img_url, timeline, preload_url) { var ready = function() { sync_frame(function() { if (sub_screencast == 0) update_meta() draw(images[img_url], target, 0, timeline[0].blit) }) if (!(preload_url in images)) { images[preload_url] = new Image() images[preload_url].src = preload_url } } if (img_url in images) { ready() } else { images[img_url] = new Image() images[img_url].onload = ready images[img_url].onerror = function() { delete images[img_url] display_error() } images[img_url].src = img_url } return images[img_url] } What’s New Sublime Text 4 is packed with new features and enhancements, including: GPU Rendering Sublime Text can now utilize your GPU on Linux, Mac and Windows when rendering the interface. This results in a fluid UI all the way up to 8K resolutions, all while using less power than before. Apple Silicon and Linux ARM64 Sublime Text for Mac now includes native support for Apple Silicon processors. Linux ARM64 builds are also available for devices like the Raspberry Pi. Tab Multi-Select File tabs have been enhanced to make split views effortless, with support throughout the interface and built-in commands. The side bar, tab bar, Goto Anything, Goto Definition, auto complete and more have all been tweaked to make code navigation easier and more intuitive than ever. Context-Aware Auto Complete The auto complete engine has been rewritten to provide smart completions based on existing code in a project. Suggestions are also augmented with info about their kind, and provide links to definitions. Refreshed UI The Default and Adaptive themes have been refreshed with new tab styles and inactive pane dimming. Themes and Color Schemes support auto dark-mode switching. The Adaptive theme on Windows and Linux now features custom title bars. TypeScript, JSX and TSX Support Support for one of the most popular new programming languages is now shipped by default. Utilize all of the smart syntax-based features of Sublime Text within the modern JavaScript ecosystem. Superpowered Syntax Definitions The syntax highlighting engine has been significantly improved, with new features like handling non-deterministic grammars, multi-line constructs, lazy embeds and syntax inheritance. Memory usage has been reduced, and load times are faster than ever. Updated Python API The Sublime Text API has been updated to Python 3.8, while keeping backwards compatibility with packages built for Sublime Text 3. The API has been significantly expanded, adding features that allow plugins like LSP to work better than ever. To learn more, read the revamped documentation. Meet the Sublime Family Sublime Text The sophisticated text editor for code, markup and prose Download Download Download Sublime Merge A cross-platform Git client, done the Sublime Text way Find out more Download Download Download'''
