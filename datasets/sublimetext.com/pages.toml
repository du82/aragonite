["https://sublimetext.com/blog/articles/2008/01"]
title = "January 2008 - News - Sublime HQ"
full_description = "ClearType and Documentation January 22, 2008 by Jon Skinner The enthusiasm, support and feedback from 1.0 has been remarkable - thanks everyone! Work is progressing on the next version, you can view the current incarnation on the beta page. Notably, the beta has ClearType support, which has been one of the most heavily requested features. The first part of the documentation is up too, detailing how Selection works. It's available via the Support page. More to come! 1.0! January 18, 2008 by Jon Skinner 1.0 is out! Download it and take it for a spin, feedback is more than welcome! Like any bit of software, it's a long road to release, though in truth it's only the beginning. There's already a long list of features to add, and it's only going to get longer with your feedback. As feedback comes in, the feature list is going to get re-prioritised and added to, so the sooner you give it a try, the better chance you have of seeing your wish list come true!"
