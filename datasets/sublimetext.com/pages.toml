["https://sublimetext.com/blog/articles/2017/10"]
title = "October 2017 - News - Sublime HQ"
full_description = '''The Adaptive Theme October 6, 2017 by Will Bond With the release of Sublime Text 3.0, we refreshed the visual design for the application, icon, and website. The new icon ties into the colors and shapes of the old, but is more abstract and fits well with other modern applications. The updated Default theme is still distinctly Sublime Text, but has full high DPI support, and works well with both dark and light color schemes. The three new color schemes take advantage of the work that has gone into modernizing and enhancing the syntax definitions included with Sublime Text. Sublime Text 3 Build 3126 (Old) Default theme, IDLE color scheme Sublime Text 3.0 (New) Default theme, Sixteen color scheme As well as an overhaul of the default theme, we've also include a new theme, Adaptive, which uses the colors of your color scheme and applies variations of them to the side bar and various panels. The new color scheme setting accent is used to highlight selected options in the find panel, and to highlight modified tabs. Furthermore, on recent versions of macOS the title bar is also styled by the Adaptive theme to follow your selected color scheme. The result is a theme that acts as if it was custom designed for your color scheme. Check out this sample of Adaptive in action: var width = 800 var height = 400 if (!window.byid) { plat = 'osx' arch = '64' scale = 1 byid = function(x) { return document.getElementById(x) } res = function() { scale = window.devicePixelRatio >= 1.3 && document.body.clientWidth > 1024 ? 2 : 1 return scale == 2 ? '@2x' : '' } } var images = [] var target = byid('target') var use_canvas = target && target.getContext if (!use_canvas) { byid('target').style.display = 'none' target = byid('fallback') target.style.display = 'block' } function load_animation() { var script = byid('anim_script') if (script) script.parentNode.removeChild(script) script = document.createElement('script') script.setAttribute('src', '/screencasts/adaptive' + res() + '.js') script.setAttribute('id', 'anim_script') document.body.appendChild(script) if (use_canvas) { target.width = scale * width target.height = scale * height } } load_animation() if (window.matchMedia) { window.matchMedia('screen and (-webkit-min-device-pixel-ratio: 1.3) and (min-width: 1025px), ' + 'only screen and (-o-min-device-pixel-ratio: 13/10) and (min-width: 1025px), ' + 'only screen and (min-resolution: 120dpi) and (min-width: 1025px)').addListener(function(e) { load_animation() }) } function handle_resize(e) { target.style.height = Math.floor(target.clientWidth / width * height) + 'px' } handle_resize() if (window.addEventListener) window.addEventListener('resize', handle_resize, false) else if (window.attachEvent) window.attachEvent('onresize', handle_resize) var continuation = null var start_time = null var remaining_time = 0 var timer = null function set_timeout(f, timeout) { start_time = new Date().getTime() remaining_time = timeout continuation = f timer = window.setTimeout(f, timeout) } // Only run a callback once an animation frame is available, allowing // the animation to be paused when in the background, etc function sync_frame(f) { if (!window.requestAnimationFrame) f() else window.requestAnimationFrame(f) } // Run a timeout synced to the animation frame function sync_timeout(f, timeout) { set_timeout(function() { sync_frame(f) }, timeout) } function pause_timeout() { var elapsed = (new Date().getTime()) - start_time remaining_time = Math.max(remaining_time - elapsed, 0) window.clearTimeout(timer) } function continue_timeout() { start_time = new Date().getTime() timer = window.setTimeout(continuation, remaining_time) } function play() { continue_timeout() } function pause() { pause_timeout() } var delay_scale = 1.0 var overlay = byid('title-overlay') function display_error() { window.clearTimeout(timer) continuation = null if (use_canvas) { var ctx = target.getContext('2d') ctx.clearRect(0, 0, target.width, target.height) } else { target.innerHTML = '' } overlay.getElementsByTagName('div')[0].innerHTML = '<i>Error loading screencast</i>'; overlay.className = 'show' } function transition() { if (timer) window.clearTimeout(timer) sync_frame(function() { var img_url = animation_urls[0] var timeline = animation_timelines[0] var img = prep_animation(img_url, timeline, null) sync_timeout(function() { animate(img, timeline, target, 0) }, 2400) }) } function draw_canvas(img, element, frame, blits) { var ctx = element.getContext('2d') for (j = 0; j < blits.length; ++j) { var blit = blits[j] var sx = blit[0] var sy = blit[1] var w = blit[2] var h = blit[3] var dx = blit[4] var dy = blit[5] ctx.drawImage(img, sx, sy, w, h, dx, dy, w, h) } } function draw_fallback(img, element, frame, blits) { if (frame == 0) { while (element.hasChildNodes()) element.removeChild(element.lastChild) } for (j = 0; j < blits.length; ++j) { var blit = blits[j] var sx = blit[0] / scale var sy = blit[1] / scale var w = blit[2] / scale var h = blit[3] / scale var dx = blit[4] / scale var dy = blit[5] / scale var d = document.createElement('div') d.style.position = 'absolute' d.style.left = dx + "px" d.style.top = dy + "px" d.style.width = w + "px" d.style.height = h + "px" d.style.backgroundImage = "url('" + img.src + "')" d.style.backgroundPosition = "-" + sx + "px -" + sy + "px" d.style.backgroundSize = width + "px auto" element.appendChild(d) } } function draw(img, element, frame, blits) { if (use_canvas) draw_canvas(img, element, frame, blits) else draw_fallback(img, element, frame, blits) } function animate(img, timeline, element, start_frame) { var i = start_frame; var f = function() { var frame = i++ % timeline.length var delay = timeline[frame].delay * delay_scale var blits = timeline[frame].blit draw(img, element, frame, blits) var callback = f sync_timeout(callback, delay) } if (timer) window.clearTimeout(timer) sync_frame(f) } function prep_animation(img_url, timeline, preload_url) { var ready = function() { overlay.className = '' sync_frame(function() { draw(images[img_url], target, 0, timeline[0].blit) }) if (preload_url && !(preload_url in images)) { images[preload_url] = new Image() images[preload_url].src = preload_url } } if (img_url in images) { ready() } else { images[img_url] = new Image() images[img_url].onload = ready images[img_url].onerror = function() { delete images[img_url] display_error() } images[img_url].src = img_url } return images[img_url] } To try Adaptive out for yourself, open the Command Palette and type Select Theme. Once you've picked Adaptive, use the Select Color Scheme command to preview the available color schemes. Probably the best part is that all of the power of the Adaptive theme is available for any theme to use. Additionally, we wrote up full documentation about all of the theme engine features and syntax. Having comprehensive documentation will hopefully make theming accessible to a much wider audience. If you are looking for help in customizing a theme, or creating your own, drop by the forum or ask some questions on the Discord server.'''
