["https://sublimetext.com/blog/articles/2013/02"]
title = "February 2013 - News - Sublime HQ"
full_description = "Upgrades February 15, 2013 by Kari With the advent of Sublime Text 3 we have been flooded with kind words as well as queries and suggestions; please take the below as a first attempt at answering the most pressing questions. Upgrades from Sublime Text 2 to Sublime Text 3 will become available when version 3.0 is released later this year. Until such time, upgrading is not required, as Sublime Text 3 will accept Sublime Text 2 license keys during the beta period. For customers who purchased in the 90 days prior to the announcement of Sublime Text 3, we are reducing the cost of upgrading from $15 down to $11. Customers who purchased Sublime Text 2 before this time period are still subject to a $30 upgrade fee when 3.0 is released. All license keys purchased since the previous blog post announcing Sublime Text 3 are already full Sublime Text 3 license keys, and no upgrade will be required for these purchases. Please note that while these are Sublime Text 3 license keys, they are also valid for Sublime Text 2. Please continue to direct your queries to sales@sublimetext.com and we will endeavor to get back to you as soon as possible."
