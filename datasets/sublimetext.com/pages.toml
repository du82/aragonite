title = "June 2012 - News - Sublime HQ"
full_description = '''Sublime Text 2.0 Released June 26, 2012 by Jon Skinner var delay_scale = 0.7 var timer = null var animate = function(img, timeline, element) { var i = 0 var run_time = 0 for (var j = 0; j < timeline.length - 1; ++j) run_time += timeline[j].delay var f = function() { var frame = i++ % timeline.length var delay = timeline[frame].delay * delay_scale var blits = timeline[frame].blit var ctx = element.getContext('2d') for (j = 0; j < blits.length; ++j) { var blit = blits[j] var sx = blit[0] var sy = blit[1] var w = blit[2] var h = blit[3] var dx = blit[4] var dy = blit[5] ctx.drawImage(img, sx, sy, w, h, dx, dy, w, h) } timer = window.setTimeout(f, delay) } if (timer) window.clearTimeout(timer) f() } var animate_fallback = function(img, timeline, element) { var i = 0 var run_time = 0 for (var j = 0; j < timeline.length - 1; ++j) run_time += timeline[j].delay var f = function() { if (i % timeline.length == 0) { while (element.hasChildNodes()) element.removeChild(element.lastChild) } var frame = i++ % timeline.length var delay = timeline[frame].delay * delay_scale var blits = timeline[frame].blit for (j = 0; j < blits.length; ++j) { var blit = blits[j] var sx = blit[0] var sy = blit[1] var w = blit[2] var h = blit[3] var dx = blit[4] var dy = blit[5] var d = document.createElement('div') d.style.position = 'absolute' d.style.left = dx + "px" d.style.top = dy + "px" d.style.width = w + "px" d.style.height = h + "px" d.style.backgroundImage = "url('" + img.src + "')" d.style.backgroundPosition = "-" + sx + "px -" + sy + "px" element.appendChild(d) } timer = window.setTimeout(f, delay) } if (timer) window.clearTimeout(timer) f() } function set_animation(img_url, timeline, canvas_id, fallback_id) { var img = new Image() img.onload = function() { var canvas = document.getElementById(canvas_id) if (canvas && canvas.getContext) animate(img, timeline, canvas) else animate_fallback(img, timeline, document.getElementById(fallback_id)) } img.src = img_url } Ladies and Gentlemen, I'm pleased to announce that Sublime Text 2 has graduated out of beta, with 2.0 now available for your text editing pleasure. I'd like to thank everyone who's purchased, used or given feedback on Sublime Text 2 since the inital version in 2011. Sublime Text has had an amazingly positive reception, and it's time to raise a toast to many versions to come. Compared to the last beta, version 2.0 offers a more polished experience, with over one hundred tweaks and improvements. Some of the notable ones are: Retina display support for OS X. Additionally for OS X, the ODB Editor Suite is now supported, as is the system find pasteboard. Quick Skip Next. Quick Add Next (Ctrl+D⌘D) is one of the most popular editing commands in Sublime Text. It's now been complemented with Quick Skip Next (Ctrl+K, Ctrl+D⌘K, ⌘D), to skip over matches, so you can select just the ones you want: Lots more! Text drag and drop, improved build systems, CSS completions, modified tab highlighting with the highlight_modified_tabs setting, Vintage mode improvements, and many more. See the changelog for the full list. Download Sublime Text 2.0 now, or to see what it's all about, take the tour on the home page. skip_timeline = [{"delay": 721, "blit": [[0, 0, 450, 250, 0, 0]]}, {"delay": 470, "blit": [[122, 291, 30, 16, 125, 0], [204, 250, 112, 12, 4, 234]]}, {"delay": 377, "blit": [[248, 262, 44, 30, 0, 0], [122, 276, 30, 31, 125, 0]]}, {"delay": 352, "blit": [[380, 280, 44, 15, 0, 30], [122, 291, 30, 16, 125, 30], [92, 250, 112, 13, 4, 234]]}, {"delay": 330, "blit": [[204, 262, 44, 30, 0, 30], [92, 276, 30, 31, 125, 30]]}, {"delay": 336, "blit": [[336, 280, 44, 15, 0, 60], [122, 291, 30, 16, 125, 60], [292, 262, 7, 11, 4, 234]]}, {"delay": 295, "blit": [[404, 250, 44, 30, 0, 60], [92, 276, 30, 31, 125, 60]]}, {"delay": 351, "blit": [[292, 280, 44, 15, 0, 90], [122, 291, 30, 16, 125, 90], [204, 250, 7, 11, 4, 234]]}, {"delay": 320, "blit": [[360, 250, 44, 30, 0, 90], [92, 276, 30, 31, 125,