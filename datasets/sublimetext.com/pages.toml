["https://sublimetext.com/docs/linux_repositories.html"]
title = "Linux Package Manager Repositories"
full_description = '''Documentation TOC TOP Linux Package Manager Repositories Version: Sublime Text includes an auto-upgrade mechanism on Windows and Mac to make upgrades a snap. Instead of going against the grain of the Linux ecosystem, packages and package repositories are provided for most of the major distributions. Builds listed in the dev channel are only available to licensed users. Users who are evaluating Sublime Text before purchase will need to use the stable channel. apt — Ubuntu, Debian pacman — Arch yum — CentOS dnf — Fedora zypper — openSUSE apt🔗 The apt repository contains packages for both x86-64 and arm64. Install the GPG key: wget -qO - https://download.sublimetext.com/sublimehq-pub.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/sublimehq-archive.gpg > /dev/null Select the channel to use: Stable echo "deb https://download.sublimetext.com/ apt/stable/" | sudo tee /etc/apt/sources.list.d/sublime-text.list Dev echo "deb https://download.sublimetext.com/ apt/dev/" | sudo tee /etc/apt/sources.list.d/sublime-text.list Update apt sources and install Sublime Text: sudo apt-get update sudo apt-get install sublime-text If this fails ensure apt is set up to work with https sources: sudo apt-get install apt-transport-https pacman🔗 Install the GPG key: curl -O https://download.sublimetext.com/sublimehq-pub.gpg && sudo pacman-key --add sublimehq-pub.gpg && sudo pacman-key --lsign-key 8A8F901A && rm sublimehq-pub.gpg Select the channel to use: Stable x86_64 echo -e "\n[sublime-text]\nServer = https://download.sublimetext.com/arch/stable/x86_64" | sudo tee -a /etc/pacman.conf Dev x86_64 echo -e "\n[sublime-text]\nServer = https://download.sublimetext.com/arch/dev/x86_64" | sudo tee -a /etc/pacman.conf Stable aarch64 echo -e "\n[sublime-text]\nServer = https://download.sublimetext.com/arch/stable/aarch64" | sudo tee -a /etc/pacman.conf Dev aarch64 echo -e "\n[sublime-text]\nServer = https://download.sublimetext.com/arch/dev/aarch64" | sudo tee -a /etc/pacman.conf Update pacman and install Sublime Text: sudo pacman -Syu sublime-text yum🔗 Install the GPG key: sudo rpm -v --import https://download.sublimetext.com/sublimehq-rpm-pub.gpg Select the channel to use: Stable sudo yum-config-manager --add-repo https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo Dev sudo yum-config-manager --add-repo https://download.sublimetext.com/rpm/dev/x86_64/sublime-text.repo Update yum and install Sublime Text: sudo yum install sublime-text Note there are no RPM packages for ARM currently. dnf🔗 Install the GPG key: sudo rpm -v --import https://download.sublimetext.com/sublimehq-rpm-pub.gpg Select the channel to use: Stable sudo dnf config-manager --add-repo https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo Stable for Fedora 41/dnf5 or newer sudo dnf config-manager addrepo --from-repofile=https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo Dev sudo dnf config-manager --add-repo https://download.sublimetext.com/rpm/dev/x86_64/sublime-text.repo Dev for Fedora 41/dnf5 or newer sudo dnf config-manager addrepo --from-repofile=https://download.sublimetext.com/rpm/dev/x86_64/sublime-text.repo Update dnf and install Sublime Text: sudo dnf install sublime-text Note there are no RPM packages for ARM currently. zypper🔗 Install the GPG key: sudo rpm -v --import https://download.sublimetext.com/sublimehq-rpm-pub.gpg Select the channel to use: Stable sudo zypper addrepo -g -f https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo Dev sudo zypper addrepo -g -f https://download.sublimetext.com/rpm/dev/x86_64/sublime-text.repo Update zypper and install Sublime Text: sudo zypper install sublime-text Note there are no RPM packages for ARM currently. Introducing our Git client Sublime Merge function show_callout() { var callout = byid('merge-screenshot') callout.src = '/images/merge_callout_' + plat + res() + '.png' callout.onload = function() { callout.style.backgroundColor = 'transparent' } } show_callout()'''
