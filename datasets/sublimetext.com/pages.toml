["https://sublimetext.com/blog/articles/2012/02"]
title = "February 2012 - News - Sublime HQ"
full_description = "Sublime Text 2 Build 2181 February 22, 2012 by Jon Skinner A new beta of Sublime Text 2, Build 2181, is available now for your enjoyment. The first thing you'll notice is the new icon, by the The Iconfactory. The icon represents a key on a keyboard, and the color of the key links it with the previous icon. A selection of the other changes in this beta: Simplified Settings. Settings were previously split into File Settings and Global Settings. These two sets have now been combined into a single settings file, so you won't need to work out which setting goes where. The first time you run build 2181, your previous user settings will be automatically merged. Improved Automatic Indentation. Auto indent is now smarter, so when you press enter, the indentation of the new line will be determined correctly more often. It's aware of language features (such as indenting the line following an if statement in C), and will use bracket matching to determine indentation. Word Highlighting. When selecting a word, other occurrences of that word will be highlighted, for example, to help visualise where variables are used. This can be controlled with the match_selection setting. Text Rendering Quality. 2181 features several subtle improvements to text rendering, including: Windows now uses Consolas by default, and will give better results when using Direct Write. Improved sub-pixel positioning on OS X, matching Core Text output. Linux now uses Pango, giving better results for unicode text. Rendering of rulers, line highlights and misspellings has been improved. Lots More! Auto Complete has learnt to be less intrusive, file renaming is more intuitive, Vintage mode has been improved, large folder trees are handled better, and there are many other improvements and fixes. Downloads and the full list of changes are on the Sublime Text 2 page."
year_published = 2012
