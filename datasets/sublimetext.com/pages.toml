full_description = "Sublime Merge Tips - Editing Git Commits March 24, 2021 by Dylan Johnston Here at Sublime HQ we use Sublime Merge every day to manage our Git repositories. As a result we've built lots of features to speed up our development. In this post we'll share some of the ways we've made it easy to edit and adjust commits. Continue reading on the full post. News: March 2021 Sublime Merge Tips - Editing Git Commits March 24, 2021 by Dylan Johnston Here at Sublime HQ we use Sublime Merge every day to manage our Git repositories. As a result we've built lots of features to speed up our development. In this post we'll share some of the ways we've made it easy to edit and adjust commits. Continue reading on the full post. Archives December 2024 August 2024 November 2023 August 2023 November 2022 May 2021 April 2021 March 2021 February 2021 May 2020 May 2019 March 2019 November 2018 October 2018 September 2018 May 2018 October 2017 September 2017 September 2016 February 2016 March 2015 August 2014 December 2013 June 2013 May 2013 March 2013 February 2013 January 2013 June 2012 February 2012 January 2012 November 2011 September 2011 August 2011 July 2011 January 2011 September 2010 February 2010 October 2009 June 2009 April 2008 March 2008 January 2008 December 2007 November 2007 About Sublime HQ Pty Ltd Sydney, Australia Twitter: @sublimehq"
