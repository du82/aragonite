title = "February 2016 - News - Sublime HQ"
full_description = "Sublime Text 3 Build 3103 February 9, 2016 by Jon Skinner Build 3103 is out now. Downloads and a full changelog are on the Sublime Text 3 page. This is the first build available to everyone with the new syntax definition format, .sublime-syntax. This allows for richer syntax highlighting and better performance. 3103 also features a custom regex engine that significantly speeds up file loading and indexing. The Packages shipped with Sublime Text are now on GitHub, and 3103 incorporates many community provided improvements to them, especially to HTML, CSS and JS. I'd also like to welcome prominent community member and Package Control mastermind Will Bond to the Sublime HQ team. If you have any questions or comments about 3103, you may want to head over to the new Forum."
