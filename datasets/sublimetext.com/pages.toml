["https://sublimetext.com/blog/articles/2018/10"]
title = "October 2018 - News - Sublime HQ"
full_description = "Sublime Merge Build 1070 October 10, 2018 by Jon Skinner Sublime Merge Build 1070 is out now with Commit Folding - see the full post for more details. Sublime Merge Roadmap October 2, 2018 by Jon Skinner Just a quick post about what we're going to be adding to Sublime Merge. This isn't a comprehensive list, but it should give an indication of what we're focusing on right now. Branch Visualization. Sublime Merge itself handles large repositories well, but there's more the UI could do to help users with a lot of branches on the go. We've got some nice things cooking for this that will be coming in the near future. Stay tuned! Submodule Management. Sublime Merge understands submodules, but doesn't provide any UI for managing them. We'll be changing that soon. Tabs. Tabs have been frequently requested by users working on several repositories at once. The Switch Repository functionality (under the File menu) helps with this, but tabs have their own benefits, so they're on their way. Git Flow Integration. Git Flow is a branching strategy with an accompanying set of command line tools. We've had a lot of requests for UI support here, so it'll be making it in too. Interactive Rebase. Sublime Merge currently supports editing commit messages and squashing commits (available from the commit context menu). We'll be adding extra commit wrangling functionality, including reordering commits, moving commits between branches, and amending arbitrary commits. Plugins. Sublime Text style plugins are on our radar. This isn't at the top of the list, but they're coming. We'll also be getting a new Sublime Text Dev Build out this week, rolling in all the updates from Sublime Merge, including the updated theming system and Mojave support."
