["https://sublimetext.com/blog/articles/2013/03"]
title = "March 2013 - News - Sublime HQ"
full_description = "Sublime Text 3 Beta 3019 March 11, 2013 by Jon Skinner Build 3019 is now available for registered users to download. Some of the highlights since the first Sublime Text 3 beta: Jump Back and Jump Forward - Jump Back allows you to go to previous editing positions. This goes hand in hand with Goto Definition: you can now inspect a symbol definition, and quickly jump back to where you were previously. Jump Back is bound to Alt+Minus^Minus by default. Improved HTML Editing - HTML completions have been improved, and now offer completions for tag attributes. Tags are also closed automatically when </ is entered. Finally, auto indent logic is more friendly for HTML. Retina Performance - Sublime Text is now super smooth on Retina displays, even at maximum resolution. Large File Loading - Large plain text files, such as log files, now load significantly faster, finishing in 1/2 to 1/3 of the time depending on platform. Note that for files requiring syntax highlighting, there is only a small improvement in load time due to the regex matching bottleneck. API Parity - Sublime Text 3 now has full API parity with Sublime Text 2, along with a nice set of additions. New functionality in 3019 includes per-command callbacks, and resource loading APIs. Full details are in the API Reference. Please note that while Sublime Text 3 supports all the API functionality in Sublime Text 2, plugins are by default not source compatible, and must be ported. Lots More! The full changelog is available on the Sublime Text 3 page."
