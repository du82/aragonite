["https://sublimetext.com/blog/articles/2024/12"]
title = "December 2024 - News - Sublime HQ"
full_description = "Sublime Text 4 Build 4189 December 21, 2024 by Benjamin Schaaf .button-st4189 { display: inline-block; background-color: #407fbf; color: #fff !important; border-radius: 3px; padding: 8px 15px; text-decoration: none; transition: background-color 0.15s ease-in-out; -webkit-transition: background-color 0.15s ease-in-out; } .button-st4189:hover { background-color: #369; } Sublime Text 4, build 4189 is out now with lots of improvements and fixes. Download Sublime Text 4 Full Changelog Various syntax highlighting improvements Fixed file change detection not working for cloned views after the original is closed Fixed prompting to reload right after reloading Fixed find-in-files results not always being sorted Significantly improved cache compression performance Improved performance of custom regex engine used for syntax highlighting Reduced syntax engine memory usage under certain conditions Improved git repository scanning performance Improved rendering performance by making theming faster Added unselect_current command for tab multi-selection Fixed tab order getting reversed when a group is closed Fixed regression in Goto Definition where symbols in the current file weren't prioritized Fixed caret location swapping sides when indenting Fixed symbol icons missing in some cases Fixed find_under_expand_skip clearing the selection when there's only one occurrence Syntax test error messages have been reworked Syntax tests can now test for symbol transformations Fixed syntax engine getting confused with multiple overlapping branches Fixed transformed symbols having an incorrect region minihtml can now load images from the internet API: Fixed on_post_move not being triggered when air-dropping API: CompletionList.set_completions is now thread safe API: Improved performance when handling many completions API: View.find_all now supports limiting search to a specified region(s) API: Fixed null characters truncating log messages Windows: Fixed crash caused by various Anti-Virus programs calling CreateRemoteThread Mac: Fixed find clipboard not updating under certain conditions Mac: Fixed click-through not working"
