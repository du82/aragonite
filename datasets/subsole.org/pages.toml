["https://subsole.org/st_mint"]
title = "st_mint [subsole.org]"
full_description = "ST Mint is a FreeMiNT distribution which provides an opensource Unix environment for the 16/32 bits Atari line of computers. The target platform are Atari ST(E) and Mist FPGA board with at least 4 MB of RAM, 512MB SD Card drive, ST High Resolution. It will also on Atari TT but is not optimized for those machines. ST Mint is distributed in the form of a ready to boot disk image, to use for instance with Lotharek's UltraSatan drive After inserting the media in your Ultrasatan device, your ST should boot into ST Mint. The boot sequence is quite long, and will start in the end the XaaES graphical environment with the TeraDesk desktop. When using a 4MB machine, you should have around 1MB of RAM free for applications. Click on COMMAND.TOS, and 2048.APP and notice the two apps running simultaneously. Such a thing is not possible using the standard Atari TOS. Click on the Desk menu =⇒ TosWin2 =⇒ File =⇒ Start shell and enjoy /bin/mksh, a Korn shell clone. Note that due to the very limited hardware of the ST compared to current standards, you can at most only run simple Unix command line tools. Use the downloaded .img file as an emulated ACSI device, and just boot. If you use the Hatari emulator, it would be: See the Roadmap on github. For General Questions, please use this thread on the Atari Forums. For Bug Reports, use the Construction Kit Bug Tracker"
