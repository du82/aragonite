["https://subversion.apache.org/mailing-lists.html"]
title = "Apache Subversion Mailing Lists"
full_description = '''Copyright © 2025 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Apache, Apache Subversion, and the Apache feather logo are trademarks of The Apache Software Foundation. Subversion and the Apache Subversion logo are registered trademarks of The Apache Software Foundation. The Subversion project maintains several mailing lists for use by various members of the community. But before we say much more, please forgive us for shouting out the following: If you have a question, please check the Subversion book first. The single page edition of the book can be searched easily. If you cannot find the answer in the Subversion book, please search the archives (the search form links to <a href="https://lists.apache.org">lists.apache.org</a>, a site requiring JavaScript. If your browser doesn't support JavaScript, please check another archive linked <a href="#list-list">below</a>!): You do not need to be subscribed to post, but please expect a small delay for your post to appear (see below for details). You do not need to be subscribed to post; it's common practice on our lists to mention in post that you aren't subscribed and would appreciate being explicitly Cc:ed in any responses. That way you get your responses without getting mails about every other active thread. If it's your first post, there may be a small delay (one day or so) before your mail appears, because the moderators have to approve the unrecognized address. After the first time, there should be no more delay. We strongly recommend that newcomers to the Subversion project read the "Mailing Lists" section of the Subversion Community Guide. All of the following lists are publicly archived. (The sole exception is the private@ list whose archives are available to its subscribers.) Both public and private archives are available to members of the Apache Software Foundation. When you send mail to these lists, you are publicly publishing the contents without condition, pursuant to the Apache Public Forum Archive Policy. This is not a new policy; Subversion's mailing list archives have always been public, so please don't take this as a deterrent to participating in the community!'''
