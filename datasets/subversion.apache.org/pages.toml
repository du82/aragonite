["https://subversion.apache.org/blog"]
title = "Apache Subversion Blog"
full_description = "Copyright © 2025 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Apache, Apache Subversion, and the Apache feather logo are trademarks of The Apache Software Foundation. Subversion and the Apache Subversion logo are registered trademarks of The Apache Software Foundation. The Apache Subversion Blog is a collection of articles concerning the design and usage of Subversion. If you would like to contribute an acticle, please reach out to the mailing list dev@subversion.apache.org. C. Michael Pilato explains how svn copy can be used to maintain a vendor branch to track source maintained in a foreign repository. Continue reading This is the final part of a series (the first two parts below) describing repository dictated configuration (RDC). In part 2 we talked about the new svn:auto-props property. Today we’ll discuss the other new inherited property that involves RDC, svn:global-ignores. Continue reading Part 1 (below) described the new inheritable properties feature in Subversion 1.8 which paves the way for repository dictated configuration (RDC). In part 2 we look at the first part of Subversion 1.8′s RDC related features, the new svn:auto-props property. Continue reading This is the first article in a series of three describing the different configuration options that can be set in the repository to manage the behaviour of the working copy. Continue reading Building on WC-NG released in Subversion 1.7, the repository access module libsvn_ra_serf can significantly reduce network traffic for svn switch and svn update if the file contents already exist in the local pristine store. Continue reading Building on the existing svn:mergeinfo property, this article descibes some technical details on subtree merges as well as changes in Subversion 1.7. Continue reading Subversion 1.5 adds a versioned property svn:mergeinfo to track merges between different branches. This article explains usage and implementation details. Continue reading Starting with Subversion 1.5 you can merge changes from a foreign repository. This article contains all details. Continue reading"
