["https://subversion.apache.org/roadmap.html"]
title = "Apache Subversion Roadmap"
full_description = "Copyright © 2025 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Apache, Apache Subversion, and the Apache feather logo are trademarks of The Apache Software Foundation. Subversion and the Apache Subversion logo are registered trademarks of The Apache Software Foundation. At the moment, there is no timetable for the next release. Dates, feature deliverables, and even version numbers found in this list are all subject to change (and become increasingly more speculative the further out we attempt to project). Fortunately, the same dynamics that allow features to fall out of releases or for release dates to slip also allow for feature and release acceleration. That's the nature of open-source, community-driven software projects (and we think it's a great thing). So if you don't like what you see here, do something about it: your contributions are always welcome! We try to roll releases on Wednesdays. Like most of the other information on this page, the day we roll isn't a hard-and-fast rule, but it is something that has been useful in the past. Rolling mid-week gives us enough time for the release preparation process in the couple of days prior to the release, and some time before the weekend for validation of the release tarballs. The release is finalized and announced as soon after the completion of the validation process as possible. See the documentation of our release process for more information. Subversion has two types of releases: regular releases are intended to deliver new features more quickly, while LTS releases are intended to provide stability over longer periods. Regular releases are supported for six months from the date of their initial release. For instance, 1.11.x was supported until six months after the announcement of 1.11.0. A regular release may be used to get new features out sooner without having to support a particular release for an extended period of time, to make feature development more appealing, rewarding and faster for both the contributors and the users."
