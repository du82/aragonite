["https://subversion.apache.org/contributing.html"]
title = "Getting Involved with Apache Subversion"
full_description = '''Copyright © 2025 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Apache, Apache Subversion, and the Apache feather logo are trademarks of The Apache Software Foundation. Subversion and the Apache Subversion logo are registered trademarks of The Apache Software Foundation. There are many ways that you can contribute to Apache Subversion and the community. Fortunately most of these require little more than an interest in Subversion and helping other members of the community. The Subversion Community Guide (aka "HACKING") is a quasi-religious text that encapsulates all the finer details of the processes and best-practices surrounding contributions to the Subversion community. Anyone considering contributing to Subversion should strongly consider reading this document. There are mailing lists you can join to discuss Subversion. These are an excellent source for users and contributors interested in having technical discussions, answering questions, or resolving potential issues for newcomers. Help promote Subversion by using your blog, Twitter, Facebook, or submitting an article to your favorite local magazine. If you are a member of a different open source community, why not mention Subversion on their discussion forums or at conferences? If you love Subversion, don't hold back — speak up! The more developers use Subversion, the more bugs will be caught, the more features will be added, the more visible the project, and the more benefits the community will get. The success of any open source project depends on the number of people who use the product and contribute back to the project. By linking to https://subversion.apache.org/, you increase the chances of a new user or contributor finding out about the project and joining the community. Bug reports take little time to file and are very helpful to developers. This is one of the easiest contributions you can make. When you discover a problem with Subversion, please report it. Our preference as a community is to have you first report the bug to the users@subversion.apache.org mailing list so that other community members can provide some first-level help and triage. Often times there may already be a solution or answer to your problem.'''
year_published = 2025
clearnet = "https://subversion.apache.org/contributing.html"
