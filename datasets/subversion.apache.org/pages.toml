title = "Apache Subversion Release Notes"
full_description = "Copyright © 2025 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Apache, Apache Subversion, and the Apache feather logo are trademarks of The Apache Software Foundation. Subversion and the Apache Subversion logo are registered trademarks of The Apache Software Foundation. The Apache Subversion project publishes releases with a relatively high degree of regularity. At any given time, we're working towards our next major release while continuing to fix bugs in previous releases. Subversion's release compatibility promises make adoption of our bugfix releases easy — you'll find very few, if any, surprises in those kinds of releases in terms of features and functionality. As such, the release notes issued for a given major release (an X.Y.0 release) remain applicable for patch releases to that release line (an X.Y.Z release). You can find links to these release notes below. Over time and as new major releases come out, we drop official support for older release lines. You'll also find below the project's official support status for the various release lines available. For a more complete (albeit less descriptive) list of changes made in individual releases, see the CHANGES file. The following changes have been merged since the last patch release and will almost certainly be included in the next patch release: See also trunk/CHANGES, where all significant-enough changes will summarized for each version by the time it is released. The list above is generated daily by ^/subversion/site/tools/upcoming.py. You could find the changes queued for another release line by running that script in a working copy of, for example, the 1.10.x branch."
