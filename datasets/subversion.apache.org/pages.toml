["https://subversion.apache.org/reporting-issues.html"]
title = "Apache Subversion Issues"
full_description = '''Copyright © 2025 The Apache Software Foundation, Licensed under the Apache License, Version 2.0. Apache, Apache Subversion, and the Apache feather logo are trademarks of The Apache Software Foundation. Subversion and the Apache Subversion logo are registered trademarks of The Apache Software Foundation. If you believe you have encountered a bug in Subversion, please write to the Subversion Users mailing list (users@subversion.apache.org) and provide as much information as practical. You can copy-and-paste the following email template and fill in the relevant items: For the version or revision of your Subversion client, you can copy and paste the output of svn --version or svn --version --verbose. For more on how the Subversion developers track and handle bug reports, see the "Bugs / Issues" section of the Subversion Community Guide. Subversion is an open source project developed and supported by volunteers. This means you can contribute to Subversion! It also means that any features you request have the highest chance of becoming reality if you are willing to do the development effort. We strongly recommend to discuss any new feature ideas at the Subversion Developers mailing list (dev@subversion.apache.org). Do you know the Subversion issue number you're interested in? Use this form to view that issue directly. Here are some issue tracker query links that we believe are of general utility to folks. If you don't see one here that you like, that's okay, you can formulate your own structured query at https://issues.apache.org/jira/issues/?jql=project = SVN.'''
