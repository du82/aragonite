["https://www.sugarcane.org/sugarcane-products/ethanol/flex-fuel"]
title = "Flex Fuel - SugarCane"
full_description = "FLEX FUEL Flex fuel vehicles are built with a technology that allows them to run with 100% ethanol, fossil fuels or any mixture of the two. This gives drivers more choice and, when choosing ethanol, empowers them to help reduce air pollution. Ethanol saves up to 90% GHG emissions, when compared to fossil fuels. Flex Fuel Vehicles (FFVs) have been present in the Brazilian automotive market since March 2003, when mass production and commercialization significantly increased in Brazil and accelerated the race to produce alternative fuels. In just over 21 years, this technology has come to dominate the Brazilian market. In recent years FFV have accounted for 98% of new cars sold nationally. Now, 90% of vehicles (31.8 million units) and 50% of motorcycles (about 7 million units) in Brazil are flex-fuel. This major shift in vehicle production has brought numerous environmental and economic benefits to the country. From March 2003 to 2023, ethanol consumption (anhydrous and hydrous) saved 660 million tons of CO2eq being emitted into the atmosphere. By way of reference, it would require planting 5 billion native trees over the next 20 years to achieve the same CO2 savings. The use of ethanol in Brazil over the past four decades, has resulted in saving over 390 billion liters of fossil fuels from being consumed and imported, a cost savings estimated at USD 220 billion. 660 MILLION TONS of CO2eq avoided in the atmosphere 94% of new cars sold are flex fuel in 2003 flex fuel vehicles were launched in Brazil"
