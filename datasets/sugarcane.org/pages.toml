["https://www.sugarcane.org/blog/page/10"]
title = "Blog Archive - Page 10 of 10 - SugarCane"
full_description = "Blog A Renewed Voice in the Debate Over Renewable Fuels 05/28/2013 Sugarcane ethanol plays a modest but important role supplying the United States with clean renewable fuel. Last year, Brazilian sugarcane ethanol comprised only 3 percent of all renewable fuel consumed by Americans, but provided nearly one-quarter of the U.S. supply of advanced biofuels. These vital facts are getting lost in a debate that’s heating up in Washington, D.C., so sugarcane ethanol producers plan to step up our profile. Blog Why do Americans pay more for sugar? 05/15/2013 Most Americans who start the day stirring a spoonful of sugar into their coffee would be surprised to learn they generally pay more for the sweetener than residents of other countries buying it on the global market. Major American commodities traders track two prices for sugar – a world price and a more expensive U.S. price. Why the difference? Blog UNICA @Rio+20, be ready to commit! 06/19/2012 The day we have all been waiting for has come. Over the last few months, governments have been working on a document that needs signatures of more than 130 international leaders coming to Rio from all over the world. Keeping in line with the level of ambition associated with the summit the paper is called “The Future We Want”. It is meant to commit its signatories to do their best to put the world on a more sustainable development path and ultimately a green economy. Blog The future we want 04/22/2012 Today is Earth Day. And this year we have a number of reasons to celebrate it. Perhaps the most significant one is the chance to build the future we want. In June, the world will see Brazil hosting the largest forum ever in the history of the United Nations: Rio+20. The UN Conference on Sustainable Development represents a historic opportunity to define pathways to a more sustainable future. World leaders, along with thousands of participants from the private sector, NGOs and other groups, will come together to shape a more sustainable world where economic growth, poverty reduction, social equity and environmental protection go hand-in-hand."
