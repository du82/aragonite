["https://www.sugarcane.org/news/london-hosts-two-key-events-for-the-sugar-and-ethanol-trade-in-november-2024"]
title = "London hosts two key events for the sugar and ethanol trade in November 2024 - SugarCane Two key events for sugar and ethanol"
description = "London hosted two events organized by the Global Sugar Alliance (GSA) and the International Sugar Organization (ISO)."
full_description = "London hosts two key events for the sugar and ethanol trade in November 2024 News 12/06/2024 In the final week of November, London hosted two events organized by two of the world’s most prestigious and influential organizations for sugar and ethanol trade: the Global Sugar Alliance (GSA) and the International Sugar Organization (ISO). As part of its partnership with the Brazilian Trade and Investment Promotion Agency (ApexBrasil) through the Brazilian Sugarcane Ethanol project, the Brazilian Sugarcane and Bioenergy Industry Association (UNICA) was represented at both events by Mrs. Raquel Lages. Global Sugar Alliance Celebrates 25th Anniversary Aiming to discuss innovative solutions to the challenges faced by the sugar and ethanol sector, members of the Global Sugar Alliance (GSA) gathered in London on November 28th to mark the organization’s 25th anniversary. The Global Sugar Alliance (GSA) was founded in Seattle in 1999 by countries committed to free competition based on market principles, with the goal of ensuring fair prices for efficient producers. Together, Australia, Brazil, Canada, Chile, Colombia, Guatemala, South Africa, and Thailand account for 85% of the world’s cane sugar trade. UNICA is a founding member of the GSA, which, in 2009, expanded its advocacy efforts to include both sugar and ethanol. This expansion recognized that free and fair trade in these two key products of the sugarcane industry drives economic growth and development while providing clean, renewable transport fuels. At this year’s meeting, representatives urged governments worldwide to refrain from adopting environmentally harmful subsidies, advocating instead for the promotion of sustainable and resilient production systems, responsive policies, and multilateral trading frameworks. Brazil plays a pivotal role in global sugar production and exports, standing as the largest producer (46 million tons) and exporter in the world, with 35.2 million tons exported during the 2023/2024 harvest cycle. Additionally, Brazil is also a major producer of ethanol, with 35.9 billion liters produced in the same period. The Brazilian bioenergy sector is committed to continuous innovation, consistently developing and implementing international best practices in both agricultural and industrial production, setting a global standard. As Mrs. Lages stated, “Brazil is committed to leading the way in sustainable sugar and ethanol production, ensuring that our practices not only drive economic growth but also protect our environment and support our communities.” 33rd ISO International Seminar The International Sugar Organization (ISO) is the only intergovernmental body dedicated to improving global sugar market conditions through debate, analysis, special studies, transparent statistics, seminars, conferences, and workshops. Its proactive engagement with ethanol derived from sugar crops, beginning in the mid-1990s, has played a key role in promoting the growing contribution of biofuels to the future global energy mix. Headquartered in London, ISO’s 85 member states (as of 2023) represent 86% of global sugar production, 64% of global sugar consumption, 34% of global imports, and 92% of global exports. The ISO hosts annual seminars aimed at enhancing knowledge and understanding of the sugar market and its related challenges, being the first seminar was promoted in 1991. This year’s event took place on November 26th and 27th, focusing on fostering dialogue and experience-sharing among producers of both cane and beet sugar, as well as researchers, companies, and consumer organizations. The conference featured multiple panels, highlighting various agricultural techniques and practices from different regions, their unique challenges, and the types of energy being used and produced. Additionally, industry representatives presented the latest technologies with potential applications in sugar production and biofuel development. About Sugarcane Ethanol Project ApexBrasil and UNICA made public in 2008, through the Brazilian Sugarcane Ethanol partnership, a strategy to promote the image of sugarcane products abroad, especially Brazilian ethanol as a clean and renewable energy. In 2023, the two entities signed an agreement that provides for shared investments. The sectoral project aims to influence the process of building the image of ethanol and other sugarcane derivatives among the main global opinion makers – governments and the media, as well as trading companies, potential investors and importers, NGOs and consumers. About ApexBrasil The Brazilian Trade and Investment Promotion Agency (ApexBrasil) works to promote Brazilian products and services abroad and attract foreign investments to strategic sectors of the Brazilian economy. In order to achieve its goals, ApexBrasil carries out several trade promotion initiatives aimed at promoting Brazilian products and services abroad, such as prospective and trade missions, business rounds, support to the participation of Brazilian companies in major international fairs, visits of foreign buyers and opinion makers to learn about the Brazilian productive structure, among other business platforms that also aim at strengthening the Brazil brand. The Agency also acts in a coordinated way with public and private players to attract foreign direct investment (FDI) to Brazil with a focus on strategic sectors for the development of the competitiveness of Brazilian companies and the country. About UNICA UNICA is the main representative body for sugar, bioethanol and other bioenergy products from mills located in the Center-South region of Brazil. Currently, it has more than 120 associated companies, which represent 60% of the sugar and ethanol produced in the country. UNICA has its headquarters in São Paulo and Brasília, as well as offices in the United States and Europe. Rachel Ragoni"
year_published = 2024
