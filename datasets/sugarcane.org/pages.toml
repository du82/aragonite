["https://www.sugarcane.org/privacy-policy"]
title = "Privacy Policy - SugarCane"
full_description = "Sugarcane.org takes the privacy of its users very seriously. We are committed to safeguarding the privacy of our users while providing a valuable user-friendly service. This Privacy Policy statement explains the data processing practices of Sugarcane.org. Collection of your Personal Information This Privacy Statement applies to the Sugarcane.org website and governs data collection and usage. By using this website, you consent to the data practices described in this statement. Sugarcane.org collects personally identifiable information, such as your email address, name, country of residence and organization. There is also information about your computer hardware and software that is automatically collected by Sugarcane.org. This information can include your IP address, browser type, domain names, access times and referring website addresses. This information is used by Sugarcane.org for the operation of the service, to maintain quality of the service, and to provide general statistics regarding use of the Sugarcane.org website. Sugarcane.org secures your personal information from unauthorized access, use or disclosure on computer servers in a controlled, secure environment. Use of your Personal Information Sugarcane.org collects and uses your personal information to operate our website and deliver the services you have requested. If you have specifically signed up for email updates, Sugarcane.org will use your personally identifiable information to inform you of other opportunities or services available from Sugarcane.org. Sugarcane.org does not sell, rent or lease lists to third parties. Sugarcane.org reserves the right to share subscriber information with its sister organization, the Brazilian Sugarcane Industry Association (UNICA). Sugarcane.org encourages you to review the privacy statements of Web sites you choose to link to from our website so that you can understand how those websites collect, use and share your information. Sugarcane.org is not responsible for the privacy statements or other content on websites outside of the Sugarcane.org and Sugarcane.org family of websites. Please keep in mind that if you directly disclose personally identifiable information or personally sensitive data through Sugarcane.org, such as through comments left on Sugarcane.org’s blog or pages, the information may be collected and used by others. The Sugarcane.org website will disclose your personal information, without notice, only if required to do so by law or in the good faith belief that such action is necessary to: (a) conform to the edicts of the law or comply with legal process served on Sugarcane.org or the site; (b) protect and defend the rights or property of Sugarcane.org; and, (c) act under exigent circumstances to protect the personal safety of users of Sugarcane.org, or the public. Sugarcane.org abides by the standards set forth in the Children’s Online Privacy Protection Act of 1998 (COPPA). Changes to this Statement Sugarcane.org may occasionally update this Statement of Privacy to reflect user feedback. We encourage you to periodically review this Statement to be informed of how Sugarcane.org is protecting your information. Contact Information Sugarcane.org welcomes your comments regarding this Statement of Privacy. If you believe that sugarcane.org has not adhered to this Statement, please contact us. We will use commercially reasonable efforts to promptly determine and remedy the problem. Communication Preferences You can stop the delivery of any promotional e-mail Sugarcane.org and services by following the specific instructions in the e-mail you receive or by contacting us. Use of Cookies The Sugarcane.org website uses “cookies” to help us improve your web experience. A cookie is a text file that is placed on your hard disk by a web page server. Cookies cannot be used to run programs or deliver viruses to your computer. Cookies are uniquely assigned to you, and can only be read by a web server in the domain that issued the cookie to you. One primary use of cookies is to provide Sugarcane.org better data about how visitors use the site so that we can provide a better experience to our users. These tracking cookies do not, however, collect personal data about you; they are simply used to provide us more meaningful reports to improve the website. Additionally, where appropriate, we may use cookies to allow you to personalize your experience on Sugarcane.org. For example, if you personalize Sugarcane.org, or register with the Sugarcane.org website or services, a cookie helps us to recall your specific information on subsequent visits. This simplifies the process of recording your personal information, such as email addresses, postal or shipping addresses, and so on. When you return to the same Sugarcane.org website, the information you previously provided can be retrieved, so you can easily use the Sugarcane.org features that you customized. You have the ability to accept or decline cookies. Most web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. If you choose to decline cookies, you may not be able to fully experience the interactive features of the Sugarcane.org web services or websites you visit."
