["https://www.sugarcane.org/news/statement-unica-bioenergia-brasil-feplana"]
title = "Public Statement Unica – Bioenergia Brasil – Feplana - SugarCane"
description = "The Brazilian sugar and bioenergy sector reaffirms its support for the EU-Mercosur agreement and rejects criticism."
full_description = "Public Statement Unica – Bioenergia Brasil – Feplana News 11/28/2024 The Brazilian sugar and bioenergy sector, in response to recent statements regarding the conclusion of the free trade agreement between the European Union (EU) and Mercosur, reaffirms its support for the agreement and vehemently rejects unfounded criticisms of Brazil’s production process. It is important to emphasize that sustainability is one of the pillars of our production process, which is globally recognized and supported by international certifications, including some of the most stringent standards in Europe. Brazilian ethanol has the smallest carbon footprint worldwide and, since the introduction of flex-fuel vehicles in 2003, we have prevented the release of over 700 million tons of CO2 into the atmosphere—equivalent to planting more than 4 billion trees. This achievement has no global parallel, as Brazil relies on 100% renewable biomass energy to produce both sugar and biofuels. As Brazilian producers, we deserve and demand respect for the socio-environmental legacy we have built over the past few decades—a result from a Herculean effort to enhance competitiveness and sustainability. The sector has become a global reference in both food and energy production, operating with an efficiency that exceeds that of many other countries, combined with high levels of environmental protection and social inclusion. In the face of the seriousness and urgency of the climate crisis, as well as the growing global shortages of food and energy, cooperation and integration are imperative. This will be the commitment of the Brazilian productive sector: to produce more and better, inspiring the rest of the world to follow our example. Rachel Ragoni"
