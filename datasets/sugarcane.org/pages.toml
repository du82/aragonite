["https://sugarcane.org/who-we-are"]
title = "Who we are - SugarCane"
full_description = "WHO WE ARE Global leaders are searching for clean, renewable options to provide energy and reduce petroleum use. Sugarcane has emerged as an important alternative for meeting those needs. This powerful plant is grown in more than 100 countries and holds the potential to reduce greenhouse gas emissions (GHG), diversify energy supplies and create jobs. The Brazilian Sugarcane and Bioenergy Industry Association (UNICA) and the Brazilian Trade and Investment Promotion Agency (Apex-Brasil) developed this website to serve as a global information hub on sugarcane products and their contribution towards economic, environmental and social benefits for countries around the world. This website is part of a larger partnership between UNICA and Apex-Brasil seeking to promote the benefits of Brazilian sugarcane ethanol in North America, Europe and Asia. ABOUT US CONTACT US ABOUT THE BRAZILIAN SUGARCANE INDUSTRY ASSOCIATION UNICA is the leading trade association for the sugarcane industry in Brazil, representing 55 percent of the country’s sugarcane production and processing. UNICA’s priorities include serving as a source for credible information and analysis about the efficiency and sustainability of sugarcane products, particularly ethanol. The association works to encourage the continuous advancement of sustainable practices throughout the sugarcane industry while promote sugarcane-based biofuels as a clean and reliable alternative to fossil fuels. FOR PURCHASES OF SUGAR AND ETHANOL, PLEASE GET IN TOUCH WITH COMPANIES DIRECTLY. CHECK OUT THE FULL LIST OF UNICA’S MEMBERS THE BRAZILIAN TRADEAND INVESTMENTPROMOTION AGENCY The Brazilian Trade and Investment Promotion Agency (Apex-Brasil) works to promote Brazilian products and services abroad, and to attract foreign investment to strategic sectors of the Brazilian economy. Apex-Brasil organizes several initiatives aiming to promote Brazilian exports abroad. The Agency´s efforts comprise trade and prospective missions, business rounds, support for the participation of Brazilian companies in major international trade fairs, arrangement of technical visits of foreign buyers and opinion makers to learn about the Brazilian productive structure, and other select activities designed to strengthen the country’s branding abroad. Apex-Brasil also plays a leading role in attracting foreign direct investment (FDI) to Brazil, by working to identify business opportunities, promoting strategic events and lending support to foreign investors willing to allocate resources in Brazil. Brazil Office Sao PauloPhone: +55 (11) 3093-4949E-mail: unica@unica.com.br Europe Office Brussells Phone: +32 (0) 2 2110535 E-mail: brussels@unica.com.br USA Office WashingtonPhone: +1 (202) 506-5299E-mail: washington@unica.com.br GET IN TOUCH LEARN MORE LIBRARY BLOG INFOGRAPHICS BRAZILIAN EXPERIENCE"
