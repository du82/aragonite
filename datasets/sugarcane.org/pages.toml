full_description = "Blog Eternal Ethanol: Fueling the cooperation between India-Brazil 09/22/2022 Brazil and India have recently partnered for developing a sustainable, clean energy pathway, within the private sector, for decarbonising the mobility and the power generation sectors. Blog A climate action roadmap for sustainable sugarcane 02/22/2022 Sugarcane is a great source of renewable energy in the form of bioethanol, biogas, biomass and as a raw material for bioplastics and biomaterials Blog Sustainability of sugarcane production 01/24/2022 Sugar has long made the headlines around the world. Feared by some, craved by most and misunderstood by many, sugar comes in a number of forms, the best known of which is sucrose or table sugar. However, no matter what form it takes, it is one of the most important commodities in the lives of […] Blog Climate Solutions will Require California Creativity 11/18/2021 Successful programs like California’s Low Carbon Fuel Standard and RenovaBio remind us that not all climate answers emanate from Capitol Hill. Absent consensus on climate policy at the federal level, following the Golden State’s lead seems prudent. At this writing, two major happenings are occurring on the climate front. The first is the dwindling hope […] Blog Driving Green Financing for Brazil’s Biofuel Sector 08/27/2021 Biofuels are a central component to Brazil’s decarbonisation pathway. With the rollout Renovabio Programme, the Climate Bonds Initiative expects to see more green issuances coming from biofuel companies. Blog Bio-based Sustainable Aviation Fuels as a decarbonization pathway 08/09/2021 The global aviation industry has set a goal of carbon-neutral growth and aims to reduce net aviation carbon emissions by 50% by 2050. 2021 marks the first year of the pilot phase. While it remains uncertain what impact COVID-19 will have on future commercial aviation, and subsequent CO2 emissions, some important lessons can already be […] Blog The Biofuels Revolution