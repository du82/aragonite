full_description = "Sugarcane harvest for the first half of December 2024 News 12/28/2024 Sugar production reached 347.82 thousand tons in the first half of December 2024. Since the beginning of the 2024/2025 harvest up to December 16th, accumulated sugar production reached 39.71 million tons while in the same period at 2023/2024 harvest season it was reported 41.82million tons. The volume of ethanol produced reached 764.53 million liters in the first half of December. The accumulated production of ethanol reached 31.93 billion liters, with 11.59 billion liters of anhydrous ethanol and 20.34 billion liters of hydrous ethanol. Of the total fuel produced in the first half of December 2024, 379.16 million liters of biofuel were produced from corn. Source : UNICAdata Rachel Ragoni"
