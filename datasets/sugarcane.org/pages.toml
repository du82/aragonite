["https://www.sugarcane.org/sugarcane-products/sugar/sugar-trade"]
title = "Sugar Trade - SugarCane"
full_description = "SUGAR TRADE Brazil is the largest sugar producer (46 million tons) and exporter in the world, with 35.2 million tons exported in the 2023/2024 cycle. This amounts to an equivalent of 25% of global production and 50% of exports worldwide. LARGEST SUGAR CONSUMERS Approximately 2/3 of all sugar produced in Brazil is exported, heading to more than 145 countries around the world. Sugar is traded in the free market, with the exclusion of most developed countries who protect their sugar markets by imposing tariff-rate quotas. Brazil is a member of the Global Alliance for Sugar Trade Reform and Liberalization, which seeks to improve the world’s sugar trading environment. CHINA SUGAR POLICY EU SUGAR POLICY INDIA SUGAR POLICY US SUGAR POLICY As part of its WTO obligations, since 2001 China has enforced a sugar tariff-rate quota (TRQ) with a 15% basic-duty rate on imports up to 1.94 million MTs, and a rate of 50% over this volume. Since 2016 China has implemented the Automatic Import License (AIL) system that requires sugar importers to pre-register above basic-duty sugar imports with the regulator, and since 2020 China also requires importers to file information with the China Sugar Association (CSA) or the China Chamber of Commerce of Foodstuffs and Native Produce (CFNA). China also implements a National Reserve System for sugar, with the last major auction taking place in September 2023. The smuggling of sugar along porous land borders from Southeast Asia is another persistent challenge. 14th Five Year Plan for Economic and Social Development The 14th Five-Year Plan (2021-2025) outlines a direction for China’s sugarcane industry, focusing on increasing production efficiency, sustainability, and technological innovation. As part of the plan, the Chinese government aims to increase the domestic supply of sugarcane to reduce reliance on imports and improve the resilience of the agricultural sector. Key objectives include implementing advanced farming techniques and expanding sugarcane cultivation in regions with favorable conditions, such as Guangxi, which accounts for 70% of China’s total cane sugar production. The provincial government has been actively encouraging farmers to shift from eucalyptus plantations to sugarcane cultivation as part of its strategy to boost the province’s agricultural output and support the sugar industry. Besides, the 14th Five Year Plan also encourages the development of value-added products from sugarcane, such as biofuels and specialty sugars. Additionally, the government intends to invest in research and infrastructure to improve the sugarcane supply chain, from planting to processing, increasing the industry’s competitiveness and sustainably in the long term. China’s sugar production for the 2024/2025 marketing year is estimated at 9.25 million tons, reflecting an increase of 450,000 tons compared to the revised estimate for 2023/24. Meanwhile, sugar consumption is projected to reach 15.7 million tons, also marking an upward revision from previous estimates. From October 2023 to February 2024, China imported 2.81 million tons of sugar. The European Union (EU) is the third largest sugar producer and the second largest consumer in the world. EU sugar policy was first established in 1968 and regulates all aspects of the industry, ranging from production quotas and guaranteed prices, to exports subsidies and import restrictions. IMPORT TARIFFS AND QUOTAS 2006 Sugar Reform THE LATEST REFORM OF THE EUROPEAN SUGAR REGIME Import tariffs and quotas Most EU sugar imports are controlled by Tariff-Rate Quotas (TRQs), which set the amount of sugar that can enter the region from abroad at a reduced or zero duty. The EU applies Most-Favored Nation (MFN) tariffs to additional sugar imports. These high import duties – €339 per ton on raw cane sugar for refining and €419 per ton on white sugar – prevent imports beyond the TRQ limits from most competitive, sugar-producing countries such as Brazil, Thailand and Australia. Today, 412,054 tons of Brazilian sugar can be imported at a preferential rate of €98 per ton (78,000 tons can be imported at an even lower rate for seven years) and an erga omnes TRQ (meaning a quota open for any country to meet) of 289,977 tons is also available at the same duty rate. In addition, a temporary duty-free quota of 400,000 tons annually is open for industrial sugar imports. The EU grants duty-free, quota-free access for sugar imported from the world’s Least Developed Countries (LDC) and ACP countries that were members of the former Sugar Protocol and are signatories of Economic Partnership agreements. However, transitional safeguards have been in place to prevent a surge of imports from these countries since 2015. More and more sugar is also imported through free-trade agreements where the countries partnering with the EU don’t get full access to the EU market, but are granted a zero-duty TRQ. This is the case of Ukraine, Peru, Colombia, Central America, Panama and Moldova. On June 28, 2019 the EU and Mercosur countries closed an agreement of principle for the conclusion of a free trade agreement. This FTA will enhance the Brazilian access to the EU sugar market by reducing the WTO intra-quota tariff to zero for 180,000 tons of sugar. This is by no mean additional quantities granted to Brazil, but just a reduction of the intra-quota tariff of an existing WTO quota. 2006 Sugar Reform The European sugar reform was mainly motivated by the negative ruling of a WTO panel in a case brought by Australia, Thailand and Brazil against the EU, but the market access granted to LDCs and EU enlargement also played a role. As the EU increased its membership, the government had to offer additional import opportunities as compensation for new member states adopting the EU sugar policy and its protectionist measures. The latest reform of the European sugar regime In December 2013, the EU modified its common organisation of the markets in agricultural products, and as part of it, the EU reformed once again its sugar policy. With the intention to let producers respond to market signals, production quotas were abolished on 30 September, 2017 and export subsidies are set at zero. This reform, coupled with historically low international sugar prices, had a significant impact on the EU sugar market and prices. As a consequence, imports were also affected. India is the largest consumer and the second-largest producer of sugar in the world, after Brazil. The sugar industry is amongst the most important agro-based industries in India, impacting the livelihood of about 50 million farmer families and employing 0.5 million workers in sugar mills. Average annual production of sugarcane in the country is around 355 million tonnes, which is used to yearly produce around 30 million tonnes of sugar. There are more than 700 installed sugar factories in the countries with a crushing capacity of about 34 million tonnes and an annual output of about US$11 Billion. The fair and Remunerative Price (FRP) Model Minimum Selling Price (MSP) The fair and Remunerative Price (FRP) Model The Fair and Remunerative Price (FRP) model which replaced The Sugarcane (Control) Order-1966 in 2009-10 is aimed at ensuring remuneration for sugarcane farmers. As per this model, the cane price announced by the Central Government is decided on the basis of recommendations made by the Commission for Agricultural Costs and Prices (CACP) in consultation with the State Governments and after taking feedback from sugar industry associations. This system considers additional cost factors that were disregarded in the earlier model. Currently, the FRP of sugarcane is US$3.78 per quintal, which is 80–90% more than the A2+FL (Actual paid-out expenses incurred by farmers and imputed value of unpaid family labour) cost of cultivation. Under the FRP system, farmers do not have to wait till the end of the season. Nor do they have to wait for sugar mills to announce their profits. In fact, the model assures revenues irrespective of whether sugar mills make profits or not. As opposed to other major sugar-producing countries that privilege risk-sharing models between the industry and cane growers, the Indian model is independent of the performance of individual sugar mills. Minimum Selling Price (MSP) Meanwhile, the government introduced the concept of Minimum Selling Price (MSP) of sugar in 2018 with a view to protect the interests of farmers and to ensure that the industry gets the minimum cost of production of sugar. The MSP for sugar is US$0.42 per kg. Remunerative and assured prices, along with improvements in yield and recovery, continue to attract Indian farmers to sugarcane cultivation despite the ample supply and the low prices of sugar in the market. Exchange rate feb/2021: US$1=INR72.57 The United States is the sixth largest sugar producer and fifth largest consumer of sugar in the world. The U.S. sugar industry has enjoyed trade protection since 1789 when Congress enacted the first tariff against foreign-produced sugar. Government protection continues to this day. The framework for the current U.S. sugar program has its roots in the 1990 Farm Bill. This law established price support through preferential loan agreements, domestic market controls and tariff-rate quotas. Price Support Domestic Market Controls Tariff-Rate Quotas Other Initiatives Price Support The U.S. Department of Agriculture (USDA) provides loans to sugarcane and sugar beet producers and processors guaranteeing a minimum price regardless of the true market conditions. At the end of the loan term (usually nine months), sugar producers and processors make one of two choices: Give the government their sugar as payment for the loan; or Sell their sugar on the market if the going price is higher than the USDA loan amount. Currently, the average loan rate is US$19.75 cents per pound for raw cane sugar and US$ 25.38 cents per pound for refined beet sugar (FY2020). Domestic Market Controls The USDA dictates the amount of sugar an individual company may sell during a given year, but these allotments can and often are adjusted based on harvest conditions. If companies produce more sugar than their allotments permit, they are forbidden to sell it. Instead, they must store the excess sugar at their own expense until they have permission to sell it. The Farm Bill requires these allotments be at least 85% of domestic sugar demand. Note that marketing loans and marketing allotment programs are contingent on the use of feedstock produced in the U.S. Tariff-Rate Quotas U.S. sugar imports are strictly controlled by Tariff-rate quotas (TRQs) and established annually by the USDA and the U.S. Trade Representative. The TRQ sets the amount of sugar that can enter the country from abroad at a low or zero duty. The amount set aside for import under TRQs must meet US obligations to the World Trade Organization (WTO) – currently a minimum of 1,117,195 tons of raw sugar and 22,000 tons of refined sugar. The 2008 Farm Bill also allows USDA to increase sugar TRQs on April 1 of each year if a shortage is expected. Even though sugar production and markets have changed substantially during the past 30 years, TRQs are based on U.S. sugar trade levels from 1975 to 1981. For FY 2020, the U.S. allocated a quota of 152,691 tons of raw cane sugar to Brazil which will pay an import duty not to exceed US$ 1.375 cents per kilogram. Additional sugar imports above TRQ levels are not practical or economical under normal market conditions due to stiff over-quota tariffs. Other Initiatives Sugar-to-Ethanol Program Under another provision of the Farm Bill, the U.S. government can sell excess sugar (for instance, unneeded supplies generated by generous price supports) to ethanol producers at a significant loss. With this program, ethanol producers can pay for sugar the equivalent of what they pay for less-expensive corn. This provision provides additional, less obvious protection to the U.S. sugar market. Suspension Agreements for Sugar Imported from Mexico Since January 2015, sugar imported from Mexico have been subject to the terms of two agreements suspending an anti-dumping (AD) and countervailing duty (CVD) investigation started in 2014 by U.S. International Trade Commission and the Department of Commerce. Since the preliminary investigations found that imported Mexican sugar hurt the U.S. domestic industry, duties would have to be charged against the imported product. In December 2014 both governments agreed to export limits and reference prices for Mexican sugar. The agreement was amended in June 2017 and the Reference Prices in the amended agreement were set at: Twenty-eight cents per pound by dry weight commercial value for refined sugar (polarity greater than or equal to 99.2); and, Twenty-three cents per pound by dry weight commercial value for raw sugar (polarity less than 99.3) loaded in a bulk vessel and freely flowing (not in a container, tote, bag, or otherwise packaged)."
