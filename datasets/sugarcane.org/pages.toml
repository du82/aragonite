title = "Sugar - SugarCane"
full_description = "SUGAR The Portuguese first planted sugarcane in Brazil during the 1530s. Ever since, sugar has been an integral part of Brazil’s social, political and economic history. Brazil is now the world’s leading sugar producer and exporter, accounting for 25% of global production and 50% of world exports. SUGAR TYPES Demerara Sugar This type of sugar passes through a slight process of treatment that keeps mineral salts and others nutrients in the crystal. Refined Sugar color Icumsa 45 Refined sugar 45 Icumsa color is a type of sugar that has been submited to a process to remove non sucrose substances, leaving it very white and flavorful. White Crystal Sugar 150 IU This sugar is presented in the form of white and uniform crystals and high polarization, making it highly popular with the food industry. Organic Sugar This type of sugar is produced from sugarcane cultivated following organic best practices. Very High Polarization (VHP) The most exported type of sugar by Brazil, can be used as a basic raw material for refining and various other industrial processes. Very Very High Polarization (VVHP) This sugar type benefits from slightly higher polarization (99.6 ° Z) than VHP. Thanks to its color and natural flavor, this sugar is prefered by industries for its specific uses, as well as exported for refining. Sugar has been produced since ancient times and is the world’s most popular sweetener. Approximately 100 countries located across the tropics grow sugarcane, one of the most efficient and sustainable feedstocks to produce sugar. SUGAR GLOBAL PRODUCERS DID YOU KNOW SUGAR IS A TYPE OF CARBOHYDRATE AND IT PROVIDES ENERGY? Myths and facts SUGAR PRODUCTION PROCESS SUGARCANE BLOGEternal Ethanol: Fueling the cooperation between India-BrazilEduardo LeãoBrazil and India have recently partnered for developing a sustainable, clean energy pathway, within the private sector, for decarbonising the mobility and the power generation sectors. READ MORE News 2024: A Landmark Year for Ethanol and Sugar Production 2024 was a year of many records for the Brazilian sugar and ethanol sector, registering significant strides in production and exports. Sugarcane harvest for the first half of February 2025 Sugar production reached 7.2 thousand tons in the first half of February 2025, while ethanol production reached 380.62 million liters."
