full_description = "Sugarcane harvest for the second half of November 2024 News 12/13/2024 Sugar production reached 1.08 million tons in the second half of November 2024. Since the beginning of the 2024/2025 harvest up to December 1st, accumulated sugar production reached 39.36 million tons while in the same period at 2023/2024 harvest season it was reported 40.88 million tons. The volume of ethanol produced reached 1.19 billion liters in the second half of November. The accumulated production of ethanol reached 31.17 billion liters, with 11.33 billion liters of anhydrous ethanol and 19.84 billion liters of hydrous ethanol. Of the total fuel produced in the second half of November 2024, 368.86 million liters of biofuel were produced from corn. Source : UNICAdata Rachel Ragoni"
