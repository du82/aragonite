full_description = '''We are part of the SOLUTION To prevent global warming, the world must face challenging goals.For this, we depend on complementary solutions and every possible effort.We are part of the solution. Learn how ethanol has contributed to the reduction of emissions. SUSTAINABLE PRODUCTION ETHANOL CBIO CO2 Calculator Reset All human activity emits, directly or indirectly, gases that enhance the greenhouse effect and, as a result, we have observed climate change. The transport sector is currently responsible for about ¼ of global CO2 emissions. See here how much you emit annually and understand how Brazil has been reducing emissions from its transport matrix. You can also be part of this change with us. CALCULATE YOUR EMISSIONS 01 FUEL CONSUMPTION 02 ETHANOL MIXTURE LEVEL IN GASOLINE WHERE ARE YOU FROM? AfghanistanAlbaniaAlgeriaAndorraAngolaAntigua and BarbudaArgentinaArmeniaAustraliaAustriaAzerbaijanBahamasBahrainBangladeshBarbadosBelarusBelgiumBelizeBeninBhutanBoliviaBosnia and HerzegovinaBotswanaBrazilBruneiBulgariaBurkina FasoBurundiCabo VerdeCambodiaCameroonCanadaCentral African RepublicChadChileChinaColombiaComorosCongoCosta RicaCôte d'IvoireCroatiaCubaCyprusCzechiaDenmarkDjiboutiDominicaDominican RepublicDR CongoEcuadorEgyptEl SalvadorEquatorial GuineaEritreaEstoniaEswatiniEthiopiaFijiFinlandFranceGabonGambiaGeorgiaGermanyGhanaGreeceGrenadaGuatemalaGuineaGuinea-BissauGuyanaHaitiHoly SeeHondurasHungaryIcelandIndiaIndonesiaIranIraqIrelandIsraelItalyJamaicaJapanJordanKazakhstanKenyaKiribatiKuwaitKyrgyzstanLaosLatviaLebanonLesothoLiberiaLibyaLiechtensteinLithuaniaLuxembourgMadagascarMalawiMalaysiaMaldivesMaliMaltaMarshall IslandsMauritaniaMauritiusMexicoMicronesiaMoldovaMonacoMongoliaMontenegroMoroccoMozambiqueMyanmarNamibiaNauruNepalNetherlandsNew ZealandNicaraguaNigerNigeriaNorth KoreaNorth MacedoniaNorwayOmanPakistanPalauPanamaPapua New GuineaParaguayPeruPhilippinesPolandPortugalQatarRomaniaRussiaRwandaSaint Kitts & NevisSaint LuciaSamoaSan Marino