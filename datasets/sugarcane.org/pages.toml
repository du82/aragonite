title = "Sugarcane Products - SugarCane"
full_description = "SUGARCANEPRODUCTS Humans have cultivated sugarcane for many centuries to produce sugar. But only recently has innovation started unlocking other useful products that are clean and renewable. Use of sugarcane is expanding into an extraordinarily diverse range of value-added products such as sugar, ethanol and bioelectricity, among others. Sugarcane was the first source of renewable energy in Brazil and is currently responsible for 18% of the national matrix or 39% of all renewable energy offered in the country. This places Brazil above the world average (13.9%) and developed OECD countries (10.8%) in the use of clean and renewable energies. Brazil is the world’s largest producer of sugarcane, with approximately 657 million tons processed in the last harvest (2019/2020). SUGAR ETHANOL BIOELECTRICITY INNOVATION SUGARCANE PRODUCTION PRODUCTION BETWEEN 10 AND 90 MILLIONS TONSPRODUCTION BETWEEN 1 AND 9 MILLIONS TONSPRODUCTION LESS THAN 1 MILLION TONS Pakistan | Mexico | Colombia | Guatemala | Australia | United States of America | Philippines | Indonesia | Cuba | South Africa | Argentina | Viet Nam | Egypt | Myanmar | Peru Bolivia (Plurinational State of) | Iran (Islamic Republic of) | Ecuador | Nicaragua | El Salvador | Paraguay | Sudan | Eswatini | Honduras | Dominican Republic | Kenya | Zambia | Costa Rica | Venezuela (Bolivarian Republic of) | Uganda | Bangladesh | Nepal | Zimbabwe | Mauritius | Madagascar | Mozambique | United Republic of Tanzania | Malawi | Panama | Democratic Republic of the Congo | France | Côte d’lvoire | Lao People’s Democratic Republic | Réunion | Belize | Haiti | Ethiopia | France | Côte d’lvoire | Lao People’s Democratic Republic | Réunion | Belize | Haiti | Nigeria | Fiji | Cameroon | Japan | Guyana | Jamaica Senegal | Congo | Guadeloupe | Sri Lanka | China, Taiwan Province of | Morocco | Cambodia | Angola | Burkina Faso | Chad Mali | Uruguay | Guinea | Gabon | Liberia | Niger | Papua New Guinea | Somalia | Martinique | B