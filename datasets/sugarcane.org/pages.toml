["https://www.sugarcane.org/news/brazils-ethanol-success-story-to-be-highlighted-at-key-event-in-india"]
title = "Brazil’s ethanol success story to be highlighted at key event in India - SugarCane"
description = "In January, the Indian public will have the opportunity to explore Brazil's ethanol success story at the Auto Expo – The Motor Show."
full_description = "Brazil’s ethanol success story to be highlighted at key event in India News 01/13/2025 From January 17th to January 21st, the Indian public will have the opportunity to explore Brazil’s 40-year success story in the production and use of ethanol at the Auto Expo – The Motor Show 2025, a key event within the Bharat Mobility Global Expo 2025. The Brazilian Sugarcane and Bioenergy Industry Association (UNICA), in collaboration with the Brazilian Embassy in New Delhi and in partnership with the Brazilian Ministry of Foreign Affairs and the Brazilian Trade and Investment Promotion Agency (ApexBrasil), through the Brazilian Sugarcane Ethanol project, will showcase ethanol as a powerful solution for decarbonizing transportation and combating climate change. Currently, India is the world’s third-largest energy consumer, heavily reliant on oil imports to meet its growing energy needs, which are expected to double by 2050. Blending ethanol with gasoline offers India a dual benefit: enhancing energy security while also helping the country achieve its climate goals by decarbonizing the transportation sector and improving air quality. Under India’s ethanol blending program, the volume of biofuel in gasoline has surged from 1.5% in 2014 to 15% in 2024, with a target of 20% by 2025-26. This context sets the stage for this month’s event, where Brazil will present its extensive experience in ethanol production and use to nearly half a million visitors. Brazil will be featured in a booth at the Society of Indian Automobile Manufacturers (SIAM) Sustainable Mobility Pavilion, titled “People-Centric Mobility Ecosystem,” highlighting the benefits of ethanol as biofuel. Additionally, UNICA will participate in the 3rd International Symposium for Thriving Eco-Energy in Mobility (ISTEM), themed “Decarbonization Roadmap: Towards a Carbon-Neutral Future,” on January 21st. During the symposium, UNICA will contribute to discussions on policy frameworks for environmentally conscious and economically viable mobility. Throughout the week, Mr. Evandro Gussi, CEO of UNICA, will also engage in side discussions and bilateral meetings with Indian authorities to strengthen the relationship and cooperation between Brazil and India in the clean energy sector. About Sugarcane Ethanol Project ApexBrasil and UNICA made public in 2008, through the Brazilian Sugarcane Ethanol partnership, a strategy to promote the image of sugarcane products abroad, especially Brazilian ethanol as a clean and renewable energy. In 2023, the two entities signed an agreement that provides for shared investments. The sectoral project aims to influence the process of building the image of ethanol and other sugarcane derivatives among the main global opinion makers – governments and the media, as well as trading companies, potential investors and importers, NGOs and consumers. About ApexBrasil The Brazilian Trade and Investment Promotion Agency (ApexBrasil) works to promote Brazilian products and services abroad and attract foreign investments to strategic sectors of the Brazilian economy. In order to achieve its goals, ApexBrasil carries out several trade promotion initiatives aimed at promoting Brazilian products and services abroad, such as prospective and trade missions, business rounds, support to the participation of Brazilian companies in major international fairs, visits of foreign buyers and opinion makers to learn about the Brazilian productive structure, among other business platforms that also aim at strengthening the Brazil brand. The Agency also acts in a coordinated way with public and private players to attract foreign direct investment (FDI) to Brazil with a focus on strategic sectors for the development of the competitiveness of Brazilian companies and the country. Rachel Ragoni"
year_published = 2025
