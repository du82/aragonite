["https://www.sugarcane.org/sustainability-the-brazilian-experience/best-practice/minimal-water-use"]
title = "Minimal Water Use - SugarCane"
full_description = "MINIMALWATER USE Thanks to abundant and reliable rainfall, sugarcane is usually not irrigated in the Center-South of Brazil, where most of the country’s crop is grown. Brazilian mills have reduced water usage in the industrial process by more than 46% (from 1.52m³ to 0.82m³ per ton on average) over the past two decades. Today, nearly 95% of the water utilized by a typical sugarcane mill is treated and re-used in the industrial process, minimizing water discharge. 0,82m³ of water consumptionper sugarcane ton 46% less water consumptionin the past two decades 95% of reused water Environmental Protection Healthy Soils Mechanization Minimal Water Use Technology Vinasse and Filter Cake"
