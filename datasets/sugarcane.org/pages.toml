["https://www.sugarcane.org/news/sugarcane-harvest-for-the-second-half-of-january-2025"]
title = "Sugarcane harvest for the second half of January 2025 - SugarCane"
description = "Sugar production reached 7.3 thousand tons in the second half of January 2025, while ethanol production reached 401.8 million liters."
full_description = "Sugarcane harvest for the second half of January 2025 News 02/13/2025 Sugar production reached 7.3 thousand tons in the second half of January 2025. Since the beginning of the 2024/2025 harvest up to February 1st, 2025, accumulated sugar production reached 39.80 million tons while in the same period at 2023/2024 harvest season it was reported 42.13 million tons. The volume of ethanol produced reached 401.8 million liters in the second half of January. The accumulated production of ethanol reached 33.19 billion liters, with 12.08 billion liters of anhydrous ethanol and 21.11 billion liters of hydrous ethanol. Of the total fuel produced in the second half of January 2025, 387.67 million liters of biofuel were produced from corn. Source: UNICAdata Rachel Ragoni"
