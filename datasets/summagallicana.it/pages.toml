["https://summagallicana.it/Albertgallus/Albertgallus_italiano.htm"]
title = "il pollo di Alberto Magno"
full_description = "contenuto in De animalibus libri XXVI I Volume - libri 1-12 - 1916 II Volume � libri 13-26 - 1920 Hermann Stadler � M�nster � 1916-1920 Trascrizione di Fernando Civardi Traduzione di Elio Corti con la revisione di Roberto Ricciardi Revisione del testo italiano di Fernando Civardi � incerta l'epoca in cui Alberto avrebbe composto il suo Libro degli animali, come anche in generale quella dei suoi commenti scientifici ad Aristotele, forse dopo la sua rinuncia alla cattedra episcopale di Regensburg nel 1262. Gi� verso la met� degli anni 50 del sec. XIII Alberto si sarebbe occupato, come attivit� principale, di commentare gli scritti di Aristotele. Altri, in modo peraltro poco convincente, ne assegnano la composizione verso il 1268. Il De animalibus libri XXVI di Alberto � conservato in circa 40 manoscritti, di cui almeno 3 del sec. XIII, 10 del XIV, gli altri del XV. Il pi� importante � senza dubbio il codex Coloniensis (W 258a dell'Archivio civico di Colonia), che Hermann Stadler ha chiamato C, e che si pu� considerare lo scritto originario dell'opera, sia perch� � l'unico a offrirne il testo completo (mentre gli altri manoscritti e le edizioni a stampa soffrono di lacune e omissioni), sia perch� � esente da molti errori di lettura (la cui presenza nei codici testimoni si spiega solo in dipendenza da C), sia per la presenza di correzioni che risalgono alle fonti principali di Alberto, ossia Aristotele e Avicenna, e mostrano l'attivit� dell'autore che cambia nel corso d'opera. Nel codice C sono inserite altre due opere di Alberto: De motu et origine animae e De principiis motus processivi. La scrittura, affatto individuale, corrisponde al modo di scrivere in uso verso la met� del sec. XIII. Secondo una tradizione che risale al 1483, Alberto fu sepolto nel Convento dei Domenicani di Colonia. Qui, accanto a un'opera teologica, fu trovato un volumen de naturis animalium de manu sua (appunto il codice C). Queste opere dal Convento, distrutto nel corso delle guerre con i Francesi all'inizio del sec. XIX, furono portate nell'Archivio civico di Colonia, dove tuttora si trovano. Naturalmente, come si � detto, vi sono altri manoscritti di Alberto. Il codice C, pergamenaceo, � costituito di 429 (in realt� 427) fogli; � scritto da una mano, con aggiunte marginali (che sembrano appartenerle). Di un'altra mano sono forse piccole aggiunte (in apparato critico Stadler le designa come m2 e m3). Vi sono numerose abbreviazioni, che non sono diverse dal modo di abbreviare dell'epoca. L'ortografia, come osserva Stadler, � 'conseguente nell'inconseguenza', cio� la stessa parola nella stessa riga pu� essere scritta in modo diverso. L'interpunzione � quella in uso nei coevi manoscritti francesi."
