full_description = "Chi non � al corrente che il genere dei gallinacei viene impiegato come cibo? Ci serviamo quasi solo di esso all�arrivo improvviso e inaspettato di amici o di ospiti, dobbiamo riconoscere che gli � dovuto ogni prestigio di una mensa sontuosa, modesta e povera. Se la necessit� richiede una mensa sontuosa, ne ricavate delle carni molto apprezzate, sia lessate che arrosto, oltre alle uova che sono superiori alle uova degli altri volatili, ed esse ti garantiranno anche differenti tipi di portate. Se c�� bisogno di una mensa modesta, come nei giorni in cui mangiare carni � proibito dalla legge sacra, le sole uova ti basteranno: se invece deve essere povera e adatta ai malati, per favore, da dove si potrebbe ottenere un cibo pi� sicuro e gradito? Per cui a buon diritto il genere dei gallinacei detiene sempre il primo posto presso Columella e altri che hanno esplicitamente scritto sugli uccelli. Per cui anche i commentatori di Orazio quando canta cos�: spiegano privum non solo come qualcosa di privato e di proprio, ma qualcosa di speciale e di raro che proviene dal genere degli uccelli come lo erano presso gli antichi le galline e i tordi, meglio dei quali (i tordi) lo stesso poeta anche in un altro punto ha detto non esserci nulla. Lampridio riferisce che durante i banchetti di Alessandro Severo c�erano galline e uova, ma che nei giorni di festa si serviva anche l�oca: ma il fagiano nelle festivit� maggiori, tanto che talora ne venivano messi in tavola anche due con l�aggiunta di due polli. E in un altro punto riferisce anche che Eliogabalo un giorno mangiava solo e soltanto fagiani, un altro giorno pollastri. Da ci� risulta ormai chiaro che anche gli imperatori pi� dissoluti provavano piacere dal mangiare questi volatili, ma che mangiavano anche solo galline o pollastri: infatti i galli, e soprattutto quelli che sono molto libidinosi, vengono riservati pi� alla prolificazione che ai piaceri della gola. Ma se i galli sono ancora abbastanza teneri, cio� quando sono pollastri, la loro carne � da annoverare tra le carni di volatili che forniscono una propriet� che � a met� strada tra il far dimagrire e ingrassare, tanto lodate da Galeno. Infatti la si digerisce facilmente, fa produrre del buon sangue, favorisce il desiderio sessuale, si addice a qualunque temperamento, soprattutto se � moderatamente grassa, e i pollastri non hanno ancora cominciato ad accoppiarsi o a cantare. Infatti quando si accoppiano e quando cantano cominciano a diventare pi� asciutti, e il calore del corpo viene esacerbato da tale secchezza, e la loro carne diventa in breve tempo dura e fibrosa, fino al punto di produrre con la lessatura un sapore si salsedine che � sempre pi� intenso man mano che invecchiano, efficace anche nel rendere pi� fluide le feci. Per cui prima di questo periodo bisogner� ricorrere alla castrazione: altrimenti bisogna senza dubbio preferire le pollastre, in quanto sono di temperamento pi� freddo: e per tale motivo in caso di malati con febbre vengono preferite ai pollastri: negli altri malati questi rappresentano un alimento dal sapore buono e apprezzato che non sa di escrementi, che non si attarda a lungo nel procedere e nel discendere nell�intestino: tuttavia non offrono cibo n� in abbondanza n� molto duraturo in quanto � costituito da sangue poco denso, e fluido, e scorrevole al punto che pu� fuoriuscirne in fretta, e che inoltre viene disapprovato per sofferenti di podagra, come le altre cose che a causa della generazione di un sangue fluido facilmente penetrano, o miscelate, o attratte, nelle aree ammalate e pertanto pi� deboli."
