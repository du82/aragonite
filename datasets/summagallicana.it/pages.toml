["https://summagallicana.it/Arscoquinaria/Gessnergallus_coquinarius.htm"]
title = "Gessnergallus coquinarius - In cucina con zio Conrad"
full_description = "Durante i banchetti di Alessandro Severo c�erano abitualmente galline, uova, etc. Nei giorni di festa si serviva anche l�oca, ma il fagiano nelle festivit� maggiori: tanto che talora ne venivano messi in tavola anche due con l�aggiunta di due polli, Lampridio. L�imperatore Petrtinace era un po� troppo avaro, dal momento che quando volle mandare agli amici un po� del suo cibo, mand� due bocconcini di carne, o un frammento di trippa, talora dei fondoschiena di pollo, Giulio Capitolino. Fra gli antichi divieti riguardanti le portate, per la prima volta gi� nella legge del console Gaio Fannio stilata undici anni prima della terza guerra punica - nel 161 aC, trovo la proibizione di non porre in tavola alcun volatile eccetto una sola gallina non ingrassata. Questo articolo fu in seguito ripreso e pass� da una legge all�altra. Si trov� una scappatoia per ingannare queste leggi allevando anche i galli con cibi inzuppati nel latte. Vengono cos� considerati di sapore molto pi� raffinato, Plinio. E appena dopo aver parlato dell�ingrasso delle galline dice: Tuttavia, in questo modo di abbellire le portate, non tutto � gradito allo stesso modo, in quanto viene decantata la coscia, in altri posti solamente il petto. Risulta che Messalino Cotta, figlio dell�oratore Messalla, invent� la ricetta di arrostire le zampe d�oca. e condirle in padella con le creste dei galli, Plinio. Eliogabalo, spesso per imitare Apicio, mangi� gli stinchi dei cammelli e le creste recise ai galli vivi, le lingue dei pavoni e degli usignoli, in quanto si diceva che chi le avesse mangiate sarebbe stato al sicuro dall�epilessia, Lampridio. � Preparazioni varie. Apicio nel libro V del De re coquinaria, descrisse certe favette - o minestre di fave con la buccia - (sono dei cibi chiamati cos� dalla fava con la sua buccia, come reputo) fatte con la fava e con il pisello, e dice: Farai una favetta in un�altra maniera nel modo seguente: Lavi un pollo, lo disossi, tagli a pezzettini della cipolla, del coriandolo, dei cervelli senza i nervi, li metti dentro allo stesso pollo: deve bollire con salsa di pesce, olio e vino, quando sar� cotto tagli a pezzettini della cipolla e del coriandolo, vi fai filtrare del pisello cotto non condito, prenderai della favetta in proporzione, disponi in modi diversi: quindi triterai del pepe, del cumino: gli versi il suo brodo. Rompi anche due uova in un mortaio, le sbatti, spargi il loro liquido sui piselli interi bolliti, oppure guarnirai con gherigli, e farai cuocere a fuoco lento, e metterai in tavola."
