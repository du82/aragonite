["https://summagallicana.it/Albertgallus/Albertgallus_inglese.htm"]
title = "the chicken of Albertus Magnus"
full_description = "contained in De animalibus libri XXVI I Volume - books 1-12 - 1916 II Volume � books 13-26 - 1920 Hermann Stadler � M�nster � 1916-1920 Latin text transcribed by Fernando Civardi translated by Elio Corti with revision of Roberto Ricciardi English text reviewed by Elly Vogelaar It is uncertain when Albertus wrote his Book on the animals, as well as when he wrote his scientific commentaries to Aristotle (384-322 BC), perhaps after his renunciation to the Episcopal chair of Regensburg in 1262. Already toward 1255 Albertus would attend, as main activity, to the annotation of the writings of Aristotle. Other people, but in a less convincing way, are dating this job around 1268. De animalibus libri XXVI of Albertus is kept in about 40 manuscripts, of which 3 at least of XIII century, 10 of XIV, the others of XV. The more important is without doubt the codex Coloniensis (W 258a of civic archives of Cologne), called C by Hermann Stadler, and that can be regarded as the original writing of the work, because it is the only one offering the complete text (while the other manuscripts and the printed editions suffer from lacunae and omissions), because it is free from many errors of reading (whose presence in the testimonial codices is explained only in dependence from C), and because of the presence of corrections going back to the principal sources of Albertus, that is, Aristotle and Avicenna, showing the activity of the author changing during his work. In the codex C are enclosed other two works of Albertus: De motu et origine animae and De principiis motus processivi. The style of writing, individual at all, corresponds to the manner of writing in use toward the half of XIII century. According to a tradition dating back to 1483, Albertus was buried in the Convent of Dominicans in Cologne. Here, near a theological work, was found a volumen de naturis animalium de manu sua (just the codex C). These works were brought, from the Convent destroyed during the wars with French at the beginning of XIX century, in the civic archives of Cologne, where they still are. Naturally, as we said, there are other manuscripts of Albertus. The parchment codex C is composed of 429 (in reality 427) sheets; it is written by one hand, with marginal additions (which seem belonging to this hand). Of another hand are perhaps small additions (in critical apparatus Stadler denotes them as m2 and m3). There are many abbreviations not different from the abbreviations of that time. The orthography, as Stadler is observing, is 'consequent in the inconsequence', that is, the same word in the same line can be written in a different way. The punctuation is that in use in the coeval French manuscripts."
