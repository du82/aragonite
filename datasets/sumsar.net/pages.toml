["https://sumsar.net/blog/climate-impact-sorting-challenge/initial-prompt"]
title = "ChatGPT"
description = "ChatGPT helps you get answers, find inspiration and be more productive. It is free to use and easy to try. Just ask and ChatGPT can help with writing, learning, brainstorming and more."
full_description = '''You said:Mock up a SortableJS example, put it all (javascript, css, and html) into one html file. The items to be moved should be "cards" with text where the cards should be possible to drag and drop horisontally. ChatGPTThought for 14 secondsHere's a complete HTML file that demonstrates how to use SortableJS to create draggable and horizontally sortable "cards." This file includes all the necessary HTML, CSS, and JavaScript code in one place.htmlCopy code<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <title>SortableJS Horizontal Cards Example</title> <!-- Include SortableJS from CDN --> <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script> <style> /* Container for the cards */ #card-container { display: flex; flex-direction: row; align-items: flex-start; overflow-x: auto; padding: 10px; background-color: #f0f0f0; } /* Individual card styling */ .card { width: 150px; height: 200px; margin: 0 10px; padding: 10px; background-color: #ffffff; border: 1px solid #cccccc; border-radius: 5px; box-sizing: border-box; cursor: move; display: flex; align-items: center; justify-content: center; text-align: center; font-family: Arial, sans-serif; font-size: 16px; } /* Style for the ghost element while dragging */ .sortable-ghost { opacity: 0.4; } </style> </head> <body> <!-- Container holding the draggable cards --> <div id="card-container"> <div class="card">Card 1 Content</div> <div class="card">Card 2 Content</div> <div class="card">Card 3 Content</div> <div class="card">Card 4 Content</div> <div class="card">Card 5 Content</div> </div> <script> // Initialize SortableJS on the card container var el = document.getElementById('card-container'); var sortable = Sortable.create(el, { animation: 150, // Animation speed during sorting (ms) ghostClass: 'sortable-ghost', // Class name for the drop placeholder direction: 'horizontal' // Set the sorting direction to horizontal }); </script> </body> </html> Explanation:HTML Structure:A <div> with the id card-container acts as the container for all the cards.Multiple <div class="card"> elements represent individual cards with text content.CSS Styles:#card-container uses Flexbox to arrange cards horizontally (flex-direction: row)..card styles define the appearance of each card, including size, margin, padding, background, border, and text alignment..sortable-ghost class provides visual feedback for the card being dragged.JavaScript Initialization:The SortableJS library is included via a CDN link.Sortable.create is called on the card-container element to enable drag-and-drop functionality.The animation option adds smoothness to the dragging experience.The direction: 'horizontal' option ensures that the cards can be dragged horizontally.Usage:Simply open the HTML file in a web browser.You can click and drag any card to reorder them horizontally within the container.'''
