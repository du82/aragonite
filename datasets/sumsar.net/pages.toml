["https://sumsar.net/climate-impact-sorting-challenge"]
title = "Climate Impact Sorting Challenge"
description = "Place the cards in order of increasing climate impact. How many can you get right before you make a mistake?"
full_description = "Where is this data from? The data is from The Big Climate Database v1.2, specifically the Danish emission factors. I chose the Danish emission factors as they were the most complete, as this database is of Danish origin, but these emission factors will be roughly applicable to other European countries as well. Any caveats? Yes, lots. Notably, these emission factors are averages, and the specific climate impact of any type of food can vary significantly depending on how the food is produced. Another thing to consider is that the emission factors are per kg of food. This does not take into account that different foods have different nutritional values. For example, a kg of butter has a much higher climate impact than a kg of lettuce, but a kg of butter also has a much higher energy content than a kg of lettuce. Who made this? This was put together by me, Rasmus Bååth, in 2024, mostly by shouting at the computer until it did what I wanted (a.k.a. AI-driven development). If you want to know more about me, check out my website: https://sumsar.net. Copyright © - Rasmus Bååth Licensed under a Creative Commons Attribution 4.0 International License"
