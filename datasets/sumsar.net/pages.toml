full_description = 'I’m Rasmus Bååth and, like most people, I’m many things: A data scientist with an interest in statistical modeling, Bayesian statistics, and statistics education, but who’s mostly worked with data munging, machine learning, and DataOps. An engineering manager working with data teams over at Normative.io on helping companies estimate and reduce their CO2 emissions. A big fan of the statistical programming environment R who, somewhat reluctantly, mostly works in Python. An x-researcher with a PhD from Lund University Cognitive Science. A serial buyer of novelty URLs where only groggbloggen.se (a Swedish drinks blog) and dopparedan.nu (a very Swedish countdown to Christmas eve) have gone live, so far. A ? year old man, living in Sweden. A father of ? sons and a husband of ? wife. If you want to contact me you can do so via: E-mail: rasmus.baath[that-weird-looking-a]gmail.com Twitter: @rabaath Mastodon: @rabaath LinkedIn: rasmus-baath Everything published on my blog is licensed under a Creative Commons Attribution 4.0 International License. var number_to_word = { 1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six", 7: "seven", 8: "eight" } var age_in_ms = Date.now() - new Date("1985-02-06"); var age = new Date(age_in_ms).getUTCFullYear() - 1970; n_sons = number_to_word[2] n_wives = number_to_word[1] document.getElementById("rasmus_age").innerHTML = age; document.getElementById("rasmus_n_sons").innerHTML = n_sons; document.getElementById("rasmus_n_wives").innerHTML = n_wives;'
