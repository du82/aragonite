["https://sumsar.net/hertig-hans-slott"]
title = "Hertig Hans slott - SR:s julkalender 1994"
description = "En interaktiv version av papperskalender till Hertig Hans slott, SR:s julkalender 1994."
full_description = 'Denna sida visar pappeskalendern till en riktig pärla bland SR:s julkalendrar: Hertig Hans slot från 1994. Den fantastiskt fina papperskalender skapades av Peter Johnson och är här utlagd med hans medgivande. Du kan läsa mer om Peter Johnson på hans hemsida. Denna web-version av kalendern skapades av mig, Rasmus Bååth, mest för att det är min absoluta favoritradiokalender från när jag var barn. Själva radiokalendern skapandes av Lars In de Betou och Anders Lundin som tillsammans stod för manus, musik, regi och produktion. Ett smakprov från kalendern kan du lyssna på på Sveriges Radio.. Hertig Hans slott ligger på en klippa intill det ödsliga havet. Det uppfördes av den mytomspunne äventyraren Hertig Hans för länge sedan. Hans två sentida ättlingar, bröderna Birger (Anders Lundin) och Valdemar (Lars In de Betou), är inte mycket till äventyrare. De äter sin trista sparrissoppa och nöjer sig med att bara vänta på äventyret. Över slottsporten står det nämligen skrivet "Äventyret börjar här", och det är därför de väntar. En dag börjar bröderna utforska slottsvinden, överallt hänger porträtt av Hertig Hans i olika äventyrliga kostymeringar. Där står också en sjömanskista, "Tillhör Hertig Hans" läser de på locket. I kistan hittar de ett gammalt segel vilket de hissar upp på slottets tak. Nu börjar saker hända. Den lilla språkkunniga grodan Isadora (Magdalena Johannesson) knackar en dag på porten. Hon ska bli prinsessa och behöver ett slott att praktisera på. Först behöver hon skridskor då hon tänker bli isprinsessa. Sedan måste hon bli kysst. Hon får skridskor, men att kyssa en groda, det har bröderna ingen lust med. I slottsdammen har Birger sina hemliga blå fiskar. Valdemar packar inför äventyret och har slutat laga sparrissoppa. Nu gör han stensoppa istället. En dag bankar en liten arg gubbe så hårt på porten att den ramlar in. Han heter Wütend (Göran Forsmark), är mistlursblåsare och ryter att han vill ha kokt sten. Eftersom han är rädd för höjder vill han bo i källaren. Till slottet kommer även rymdljudsforskaren Vera (Gunvor Pontén), hennes orimligt skarpa hörsel kräver ett ljudisolerat rum.'
