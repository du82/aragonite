external-references = ["about.scarf.sh", "apache.org", "aws.amazon.com", "calendar.google.com", "denodo.com", "developers.google.com", "docs.aws.amazon.com", "docs.databricks.com", "docs.pinot.apache.org", "docs.scarf.sh", "docs.starrocks.io", "docs.timescale.com", "drill.apache.org", "druid.io", "engineering.hometogo.com", "github.com", "google.com", "lists.apache.org", "meetup.com", "microsoft.com"]

