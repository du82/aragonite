title = "Configuring Superset | Superset"
description = "superset_config.py"
full_description = '''ConfigurationConfiguring SupersetOn this pageConfiguring Superset superset_config.py​ Superset exposes hundreds of configurable parameters through its config.py module. The variables and objects exposed act as a public interface of the bulk of what you may want to configure, alter and interface with. In this python module, you'll find all these parameters, sensible defaults, as well as rich documentation in the form of comments To configure your application, you need to create your own configuration module, which will allow you to override few or many of these parameters. Instead of altering the core module, you'll want to define your own module (typically a file named superset_config.py). Add this file to your PYTHONPATH or create an environment variable SUPERSET_CONFIG_PATH specifying the full path of the superset_config.py. For example, if deploying on Superset directly on a Linux-based system where your superset_config.py is under /app directory, you can run: export SUPERSET_CONFIG_PATH=/app/superset_config.py If you are using your own custom Dockerfile with the official Superset image as base image, then you can add your overrides as shown below: COPY --chown=superset superset_config.py /app/ENV SUPERSET_CONFIG_PATH /app/superset_config.py Docker compose deployments handle application configuration differently using specific conventions. Refer to the docker compose tips & configuration for details. The following is an example of just a few of the parameters you can set in your superset_config.py file: # Superset specific configROW_LIMIT = 5000# Flask App Builder configuration# Your App secret key will be used for securely signing the session cookie# and encrypting sensitive information on the database# Make sure you are changing this key for your deployment with a strong key.# Alternatively you can set it with `SUPERSET_SECRET_KEY` environment variable.# You MUST set this for production environments or the server will refuse# to start and you will see an error in the logs accordingly.SECRET_KEY = 'YOUR_OWN_RANDOM_GENERATED_SECRET_KEY'# The SQLAlchemy connection string to your database backend# This connection defines the path to the database that stores your# superset metadata (slices, connections, tables, dashboards, ...).# Note that the connection information to connect to the datasources# you want to explore are managed directly in the web UI# The check_same_thread=false property ensures the sqlite client does not attempt# to enforce single-threaded access, which may be problematic in some edge casesSQLALCHEMY_DATABASE_URI = 'sqlite:////path/to/superset.db?check_same_thread=false'# Flask-WTF flag for CSRFWTF_CSRF_ENABLED = True# Add endpoints that need to be exempt from CSRF protectionWTF_CSRF_EXEMPT_LIST = []# A CSRF token that expires in 1 yearWTF_CSRF_TIME_LIMIT = 60 * 60 * 24 * 365# Set this API key to enable Mapbox visualizationsMAPBOX_API_KEY = '' tipNote that it is typical to copy and paste [only] the portions of the core superset/config.py that you want to alter, along with the related comments into your own superset_config.py file. All the parameters and default values defined in superset/config.py can be altered in your local superset_config.py. Administrators will want to read through the file to understand what can be configured locally as well as the default values in place. Since superset_config.py acts as a Flask configuration module, it can be used to alter the settings of Flask itself, as well as Flask extensions that Superset bundles like flask-wtf, flask-caching, flask-migrate, and flask-appbuilder. Each one of these extensions offers intricate configurability. Flask App Builder, the web framework used by Superset, also offers many configuration settings. Please consult the Flask App Builder Documentation for more information on how to configure it. At the very least, you'll want to change SECRET_KEY and SQLALCHEMY_DATABASE_URI. Continue reading for more about each of these. Specifying a SECRET_KEY​ Adding an initial SECRET_KEY​ Superset requires a user-specified SECRET_KEY to start up. This requirement was added in version 2.1.0 to force secure configurations. Add a strong SECRET_KEY to your superset_config.py file like: SECRET_KEY = 'YOUR_OWN_RANDOM_GENERATED_SECRET_KEY' You can generate a strong secure key with openssl rand -base64 42. Use a strong secret keyThis key will be used for securely signing session cookies and encrypting sensitive information stored in Superset's application metadata database. Your deployment must use a complex, unique key. Rotating to a newer SECRET_KEY​ If you wish to change your existing SECRET_KEY, add the existing SECRET_KEY to your superset_config.py file as PREVIOUS_SECRET_KEY =and provide your new key as SECRET_KEY =. You can find your current SECRET_KEY with these commands - if running Superset with Docker, execute from within the Superset application container: superset shellfrom flask import current_app; print(current_app.config["SECRET_KEY"]) Save your superset_config.py with these values and then run superset re-encrypt-secrets. Setting up a production metadata database​ Superset needs a database to store the information it manages, like the definitions of charts, dashboards, and many other things. By default, Superset is configured to use SQLite, a self-contained, single-file database that offers a simple and fast way to get started (without requiring any installation). However, for production environments, using SQLite is highly discouraged due to security, scalability, and data integrity reasons. It's important to use only the supported database engines and consider using a different database engine on a separate host or container. Superset supports the following database engines/versions: Database EngineSupported VersionsPostgreSQL10.X, 11.X, 12.X, 13.X, 14.X, 15.XMySQL5.7, 8.X Use the following database drivers and connection strings: DatabasePyPI packageConnection StringPostgreSQLpip install psycopg2postgresql://<UserName>:<DBPassword>@<Database Host>/<Database Name>MySQLpip install mysqlclientmysql://<UserName>:<DBPassword>@<Database Host>/<Database Name> tipProperly setting up metadata store is beyond the scope of this documentation. We recommend using a hosted managed service such as Amazon RDS or Google Cloud Databases to handle service and supporting infrastructure and backup strategy. To configure Superset metastore set SQLALCHEMY_DATABASE_URI config key on superset_config to the appropriate connection string. Running on a WSGI HTTP Server​ While you can run Superset on NGINX or Apache, we recommend using Gunicorn in async mode. This enables impressive concurrency even and is fairly easy to install and configure. Please refer to the documentation of your preferred technology to set up this Flask WSGI application in a way that works well in your environment. Here’s an async setup known to work well in production: -w 10 \ -k gevent \ --worker-connections 1000 \ --timeout 120 \ -b 0.0.0.0:6666 \ --limit-request-line 0 \ --limit-request-field_size 0 \ --statsd-host localhost:8125 \ "superset.app:create_app()" Refer to the Gunicorn documentation for more information. Note that the development web server (superset run or flask run) is not intended for production use. If you're not using Gunicorn, you may want to disable the use of flask-compress by setting COMPRESS_REGISTER = False in your superset_config.py. Currently, the Google BigQuery Python SDK is not compatible with gevent, due to some dynamic monkeypatching on python core library by gevent. So, when you use BigQuery datasource on Superset, you have to use gunicorn worker type except gevent. HTTPS Configuration​ You can configure HTTPS upstream via a load balancer or a reverse proxy (such as nginx) and do SSL/TLS Offloading before traffic reaches the Superset application. In this setup, local traffic from a Celery worker taking a snapshot of a chart for Alerts & Reports can access Superset at a http:// URL, from behind the ingress point. You can also configure SSL in Gunicorn (the Python webserver) if you are using an official Superset Docker image. Configuration Behind a Load Balancer​ If you are running superset behind a load balancer or reverse proxy (e.g. NGINX or ELB on AWS), you may need to utilize a healthcheck endpoint so that your load balancer knows if your superset instance is running. This is provided at /health which will return a 200 response containing “OK” if the webserver is running. If the load balancer is inserting X-Forwarded-For/X-Forwarded-Proto headers, you should set ENABLE_PROXY_FIX = True in the superset config file (superset_config.py) to extract and use the headers. In case the reverse proxy is used for providing SSL encryption, an explicit definition of the X-Forwarded-Proto may be required. For the Apache webserver this can be set as follows: RequestHeader set X-Forwarded-Proto "https" Custom OAuth2 Configuration​ Superset is built on Flask-AppBuilder (FAB), which supports many providers out of the box (GitHub, Twitter, LinkedIn, Google, Azure, etc). Beyond those, Superset can be configured to connect with other OAuth2 Authorization Server implementations that support “code” authorization. Make sure the pip package Authlib is installed on the webserver. First, configure authorization in Superset superset_config.py. from flask_appbuilder.security.manager import AUTH_OAUTH# Set the authentication type to OAuthAUTH_TYPE = AUTH_OAUTHOAUTH_PROVIDERS = [ { 'name':'egaSSO', 'token_key':'access_token', # Name of the token in the response of access_token_url 'icon':'fa-address-card', # Icon for the provider 'remote_app': { 'client_id':'myClientId', # Client Id (Identify Superset application) 'client_secret':'MySecret', # Secret for this Client Id (Identify Superset application) 'client_kwargs':{ 'scope': 'read' # Scope for the Authorization }, 'access_token_method':'POST', # HTTP Method to call access_token_url 'access_token_params':{ # Additional parameters for calls to access_token_url 'client_id':'myClientId' }, 'jwks_uri':'https://myAuthorizationServe/adfs/discovery/keys', # may be required to generate token 'access_token_headers':{ # Additional headers for calls to access_token_url 'Authorization': 'Basic Base64EncodedClientIdAndSecret' }, 'api_base_url':'https://myAuthorizationServer/oauth2AuthorizationServer/', 'access_token_url':'https://myAuthorizationServer/oauth2AuthorizationServer/token', 'authorize_url':'https://myAuthorizationServer/oauth2AuthorizationServer/authorize' } }]# Will allow user self registration, allowing to create Flask users from Authorized UserAUTH_USER_REGISTRATION = True# The default user self registration roleAUTH_USER_REGISTRATION_ROLE = "Public" Then, create a CustomSsoSecurityManager that extends SupersetSecurityManager and overrides oauth_user_info: import loggingfrom superset.security import SupersetSecurityManagerclass CustomSsoSecurityManager(SupersetSecurityManager): def oauth_user_info(self, provider, response=None): logging.debug("Oauth2 provider: {0}.".format(provider)) if provider == 'egaSSO': # As example, this line request a GET to base_url + '/' + userDetails with Bearer Authentication, # and expects that authorization server checks the token, and response with user details me = self.appbuilder.sm.oauth_remotes[provider].get('userDetails').data logging.debug("user_data: {0}".format(me)) return { 'name' : me['name'], 'email' : me['email'], 'id' : me['user_name'], 'username' : me['user_name'], 'first_name':'', 'last_name':''} ... This file must be located in the same directory as superset_config.py with the name custom_sso_security_manager.py. Finally, add the following 2 lines to superset_config.py: from custom_sso_security_manager import CustomSsoSecurityManagerCUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager Notes The redirect URL will be https://<superset-webserver>/oauth-authorized/<provider-name> When configuring an OAuth2 authorization provider if needed. For instance, the redirect URL will be https://<superset-webserver>/oauth-authorized/egaSSO for the above configuration. If an OAuth2 authorization server supports OpenID Connect 1.0, you could configure its configuration document URL only without providing api_base_url, access_token_url, authorize_url and other required options like user info endpoint, jwks uri etc. For instance: OAUTH_PROVIDERS = [ { 'name':'egaSSO', 'token_key':'access_token', # Name of the token in the response of access_token_url 'icon':'fa-address-card', # Icon for the provider 'remote_app': { 'client_id':'myClientId', # Client Id (Identify Superset application) 'client_secret':'MySecret', # Secret for this Client Id (Identify Superset application) 'server_metadata_url': 'https://myAuthorizationServer/.well-known/openid-configuration' } }] Keycloak-Specific Configuration using Flask-OIDC​ If you are using Keycloak as OpenID Connect 1.0 Provider, the above configuration based on Authlib might not work. In this case using Flask-OIDC is a viable option. Make sure the pip package Flask-OIDC is installed on the webserver. This was successfully tested using version 2.2.0. This package requires Flask-OpenID as a dependency. The following code defines a new security manager. Add it to a new file named keycloak_security_manager.py, placed in the same directory as your superset_config.py file. from flask_appbuilder.security.manager import AUTH_OIDfrom superset.security import SupersetSecurityManagerfrom flask_oidc import OpenIDConnectfrom flask_appbuilder.security.views import AuthOIDViewfrom flask_login import login_userfrom urllib.parse import quotefrom flask_appbuilder.views import ModelView, SimpleFormView, exposefrom flask import ( redirect, request)import loggingclass OIDCSecurityManager(SupersetSecurityManager): def __init__(self, appbuilder): super(OIDCSecurityManager, self).__init__(appbuilder) if self.auth_type == AUTH_OID: self.oid = OpenIDConnect(self.appbuilder.get_app) self.authoidview = AuthOIDCViewclass AuthOIDCView(AuthOIDView): @expose('/login/', methods=['GET', 'POST']) def login(self, flag=True): sm = self.appbuilder.sm oidc = sm.oid @self.appbuilder.sm.oid.require_login def handle_login(): user = sm.auth_user_oid(oidc.user_getfield('email')) if user is None: info = oidc.user_getinfo(['preferred_username', 'given_name', 'family_name', 'email']) user = sm.add_user(info.get('preferred_username'), info.get('given_name'), info.get('family_name'), info.get('email'), sm.find_role('Gamma')) login_user(user, remember=False) return redirect(self.appbuilder.get_url_for_index) return handle_login() @expose('/logout/', methods=['GET', 'POST']) def logout(self): oidc = self.appbuilder.sm.oid oidc.logout() super(AuthOIDCView, self).logout() redirect_url = request.url_root.strip('/') + self.appbuilder.get_url_for_login return redirect( oidc.client_secrets.get('issuer') + '/protocol/openid-connect/logout?redirect_uri=' + quote(redirect_url)) Then add to your superset_config.py file: from'''
