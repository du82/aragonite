full_description = '''IntroductionOn this pageSuperset A modern, enterprise-ready business intelligence web application. Why Superset? | Supported Databases | Installation and Configuration | Release Notes | Get Involved | Contributor Guide | Resources | Organizations Using Superset Why Superset?​ Superset is a modern data exploration and data visualization platform. Superset can replace or augment proprietary business intelligence tools for many teams. Superset integrates well with a variety of data sources. Superset provides: A no-code interface for building charts quickly A powerful, web-based SQL Editor for advanced querying A lightweight semantic layer for quickly defining custom dimensions and metrics Out of the box support for nearly any SQL database or data engine A wide array of beautiful visualizations to showcase your data, ranging from simple bar charts to geospatial visualizations Lightweight, configurable caching layer to help ease database load Highly extensible security roles and authentication options An API for programmatic customization A cloud-native architecture designed from the ground up for scale Screenshots & Gifs​ Video Overview superset-video-1080p.webm Large Gallery of Visualizations Craft Beautiful, Dynamic Dashboards No-Code Chart Builder Powerful SQL Editor Supported Databases​ Superset can query data from any SQL-speaking datastore or data engine (Presto, Trino, Athena, and more) that has a Python DB-API driver and a SQLAlchemy dialect. Here are some of the major database solutions that are supported: A more comprehensive list of supported databases along with the configuration instructions can be found here. Want to add support for your datastore or data engine? Read more here about the technical requirements. Installation and Configuration​ Try out Superset's quickstart guide or learn about the options for production deployments. Get Involved​ Ask and answer questions on StackOverflow using the apache-superset tag Join our community's Slack and please read our Slack Community Guidelines Join our dev@superset.apache.org Mailing list. To join, simply send an email to dev-subscribe@superset.apache.org If you want to help troubleshoot GitHub Issues involving the numerous database drivers that Superset supports, please consider adding your name and the databases you have access to on the Superset Database Familiarity Rolodex Join Superset's Town Hall and Operational Model recurring meetings. Meeting info is available on the Superset Community Calendar Contributor Guide​ Interested in contributing? Check out our CONTRIBUTING.md to find resources around contributing along with a detailed guide on how to set up a development environment. Resources​ Superset "In the Wild" - open a PR to add your org to the list! Feature Flags - the status of Superset's Feature Flags. Standard Roles - How RBAC permissions map to roles. Superset Wiki - Tons of additional community resources: best practices, community content and other information. Superset SIPs - The status of Superset's SIPs (Superset Improvement Proposals) for both consensus and implementation status. Understanding the Superset Points of View The Case for Dataset-Centric Visualization Understanding the Superset Semantic Layer Getting Started with Superset Superset in 2 Minutes using Docker Compose Installing Database Drivers Building New Database Connectors Create Your First Dashboard Comprehensive Tutorial for Contributing Code to Apache Superset Resources to master Superset by Preset Deploying Superset Official Docker image Helm Chart Recordings of Past Superset Community Events Mixed Time Series Charts How the Bing Team Customized Superset for the Internal Self-Serve Data & Analytics Platform Live Demo: Visualizing MongoDB and Pinot Data using Trino Introduction to the Superset API Building a Database Connector for Superset Visualizations Creating Viz Plugins Managing and Deploying Custom Viz Plugins Why Apache Superset is Betting on Apache ECharts Superset API Repo Activity​ Edit this page'''
