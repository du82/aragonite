["https://superset.apache.org/docs/installation/architecture"]
title = "Architecture | Superset"
description = "This page is meant to give new administrators an understanding of Superset's components."
full_description = '''InstallationArchitectureOn this pageArchitecture This page is meant to give new administrators an understanding of Superset's components. Components​ A Superset installation is made up of these components: The Superset application itself A metadata database A caching layer (optional, but necessary for some features) A worker & beat (optional, but necessary for some features) Optional components and associated features​ The optional components above are necessary to enable these features: Alerts and Reports Caching Async Queries Dashboard Thumbnails If you install with Kubernetes or Docker Compose, all of these components will be created. However, installing from PyPI only creates the application itself. Users installing from PyPI will need to configure a caching layer, worker, and beat on their own if they wish to enable the above features. Configuration of those components for a PyPI install is not currently covered in this documentation. Here are further details on each component. The Superset Application​ This is the core application. Superset operates like this: A user visits a chart or dashboard That triggers a SQL query to the data warehouse holding the underlying dataset The resulting data is served up in a data visualization The Superset application is comprised of the Python (Flask) backend application (server), API layer, and the React frontend, built via Webpack, and static assets needed for the application to work Metadata Database​ This is where chart and dashboard definitions, user information, logs, etc. are stored. Superset is tested to work with PostgreSQL and MySQL databases as the metadata database (not be confused with a data source like your data warehouse, which could be a much greater variety of options like Snowflake, Redshift, etc.). Some installation methods like our Quickstart and PyPI come configured by default to use a SQLite on-disk database. And in a Docker Compose installation, the data would be stored in a PostgreSQL container volume. Neither of these cases are recommended for production instances of Superset. For production, a properly-configured, managed, standalone database is recommended. No matter what database you use, you should plan to back it up regularly. Caching Layer​ The caching layer serves two main functions: Store the results of queries to your data warehouse so that when a chart is loaded twice, it pulls from the cache the second time, speeding up the application and reducing load on your data warehouse. Act as a message broker for the worker, enabling the Alerts & Reports, async queries, and thumbnail caching features. Most people use Redis for their cache, but Superset supports other options too. See the cache docs for more. Worker and Beat​ This is one or more workers who execute tasks like run async queries or take snapshots of reports and send emails, and a "beat" that acts as the scheduler and tells workers when to perform their tasks. Most installations use Celery for these components. Other components​ Other components can be incorporated into Superset. The best place to learn about additional configurations is the Configuration page. For instance, you could set up a load balancer or reverse proxy to implement HTTPS in front of your Superset application, or specify a Mapbox URL to enable geospatial charts, etc. Superset won't even start without certain configuration settings established, so it's essential to review that page.Edit this page'''
year_published = 2025
clearnet = "https://superset.apache.org/docs/installation/architecture"
