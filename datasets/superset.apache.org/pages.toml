["https://superset.apache.org/docs/contributing/development"]
title = "Setting up a Development Environment | Superset"
description = "The documentation in this section is a bit of a patchwork of knowledge representing the"
full_description = '''ContributingSetting up a Development EnvironmentOn this pageSetting up a Development Environment The documentation in this section is a bit of a patchwork of knowledge representing the multitude of ways that exist to run Superset (docker compose, just "docker", on "metal", using a Makefile). noteNow we have evolved to recommend and support docker compose more actively as the main way to run Superset for development and preserve your sanity. Most people should stick to the first few sections - ("Fork & Clone", "docker compose" and "Installing Dev Tools") Fork and Clone​ First, fork the repository on GitHub, then clone it. Second, you can clone the main repository directly, but you won't be able to send pull requests. git clone git@github.com:your-username/superset.gitcd superset docker compose (recommended!)​ Setting things up to squeeze a "hello world" into any part of Superset should be as simple as # getting docker compose to fire up services, and rebuilding if some docker layers have changed# using the `--build` suffix may be slower and optional if layers like py dependencies haven't changeddocker compose up --build Note that: this will pull/build docker images and run a cluster of services, including: A Superset Flask web server, mounting the local python repo/code A Superset Celery worker, also mounting the local python repo/code A Superset Node service, mounting, compiling and bundling the JS/TS assets A Superset Node websocket service to power the async backend Postgres as the metadata database and to store example datasets, charts and dashboards which should be populated upon startup Redis as the message queue for our async backend and caching backend It'll load up examples into the database upon the first startup all other details and pointers available in docker-compose.yml The local repository is mounted within the services, meaning updating the code on the host will be reflected in the docker images Superset is served at localhost:9000/ You can login with admin/admin noteInstalling and building Node modules for Apache Superset inside superset-node can take a significant amount of time. This is normal due to the size of the dependencies. Please be patient while the process completes, as long wait times do not indicate an issue with your setup. If delays seem excessive, check your internet connection or system resources. cautionSince docker compose is primarily designed to run a set of containers on a single host and can't credibly support high availability as a result, we do not support nor recommend using our docker compose constructs to support production-type use-cases. For single host environments, we recommend using minikube along our installing on k8s documentation. configured to be secure. Supported environment variables​ Affecting the Docker build process: SUPERSET_BUILD_TARGET (default=dev): which --target to build, either lean or dev are commonly used INCLUDE_FIREFOX (default=false): whether to include the Firefox headless browser in the build INCLUDE_CHROMIUM (default=false): whether to include the Firefox headless browser in the build BUILD_TRANSLATIONS(default=false): whether to compile the translations from the .po files available SUPERSET_LOAD_EXAMPLES (default=yes): whether to load the examples into the database upon startup, save some precious time on startup by SUPERSET_LOAD_EXAMPLES=no docker compose up SUPERSET_LOG_LEVEL (default=info): Can be set to debug, info, warning, error, critical for more verbose logging For more env vars that affect your configuration, see this superset_config.py used in the docker compose context to assign env vars to the superset configuration. Accessing the postgres database​ Sometimes it's useful to access the database in the docker container directly. You can enter a psql shell (the official Postgres client) by running the following command: docker compose exec db psql -U superset Also note that the database is exposed on port 5432, so you can connect to it using your favorite Postgres client or even SQL Lab itselft directly in Superset by creating a new database connection to localhost:5432. Nuking the postgres database​ At times, it's possible to end up with your development database in a bad state, it's common while switching branches that contain migrations for instance, where the database version stamp that alembic manages is no longer available after switching branch. In that case, the easy solution is to nuke the postgres db and start fresh. Note that the full state of the database will be gone after doing this, so be cautious. # first stop docker-compose if it's runningdocker-compose down# delete the volume containing the databasedocker volume rm superset_db_home# restart docker-compose, which will init a fresh database and load examplesdocker-compose up Installing Development Tools​ noteWhile docker compose simplifies a lot of the setup, there are still many things you'll want to set up locally to power your IDE, and things like commit hooks, linters, and test-runners. Note that you can do these things inside docker images with commands like docker compose exec superset_app bash for instance, but many people like to run that tooling from their host. Python environment​ Assuming you already have a way to setup your python environments like pyenv, virtualenv or something else, all you should have to do is to install our dev, pinned python requirements bundle, after installing the prerequisites mentioned in OS Dependencies pip install -r requirements/development.txt Git Hooks​ Superset uses Git pre-commit hooks courtesy of pre-commit. To install run the following: pre-commit install This will install the hooks in your local repository. From now on, a series of checks will automatically run whenever you make a Git commit. Running Pre-commit Manually​ You can also run the pre-commit checks manually in various ways: Run pre-commit on all files (same as CI): To run the pre-commit checks across all files in your repository, use the following command: pre-commit run --all-files This is the same set of checks that will run during CI, ensuring your changes meet the project's standards. Run pre-commit on a specific file: If you want to check or fix a specific file, you can do so by specifying the file path: pre-commit run --files path/to/your/file.py This will only run the checks on the file(s) you specify. Run a specific pre-commit check: To run a specific check (hook) across all files or a particular file, use the following command: pre-commit run <hook_id> --all-files Or for a specific file: pre-commit run <hook_id> --files path/to/your/file.py Replace <hook_id> with the ID of the specific hook you want to run. You can find the list of available hooks in the .pre-commit-config.yaml file. Alternatives to docker compose​ cautionThis part of the documentation is a patchwork of information related to setting up development environments without docker compose and is documented/supported to varying degrees. It's been difficult to maintain this wide array of methods and insure they're functioning across environments. Flask server​ OS Dependencies​ Make sure your machine meets the OS dependencies before following these steps. You also need to install MySQL. Ensure that you are using Python version 3.9, 3.10 or 3.11, then proceed with: # Create a virtual environment and activate it (recommended)python3 -m venv venv # setup a python3 virtualenvsource venv/bin/activate# Install external dependenciespip install -r requirements/development.txt# Install Superset in editable (development) modepip install -e .# Initialize the databasesuperset db upgrade# Create an admin user in your metadata database (use `admin` as username to be able to load the examples)superset fab create-admin# Create default roles and permissionssuperset init# Load some data to play with.# Note: you MUST have previously created an admin user with the username `admin` for this command to work.superset load-examples# Start the Flask dev web server from inside your virtualenv.# Note that your page may not have CSS at this point.# See instructions below on how to build the front-end assets.superset run -p 8088 --with-threads --reload --debugger --debug Or you can install it via our Makefile # Create a virtual environment and activate it (recommended)$ python3 -m venv venv # setup a python3 virtualenv$ source venv/bin/activate# install pip packages + pre-commit$ make install# Install superset pip packages and setup env only$ make superset# Setup pre-commit only$ make pre-commit Note: the FLASK_APP env var should not need to be set, as it's currently controlled via .flaskenv, however, if needed, it should be set to superset.app:create_app() If you have made changes to the FAB-managed templates, which are not built the same way as the newer, React-powered front-end assets, you need to start the app without the --with-threads argument like so: superset run -p 8088 --reload --debugger --debug Dependencies​ If you add a new requirement or update an existing requirement (per the install_requires section in setup.py) you must recompile (freeze) the Python dependencies to ensure that for CI, testing, etc. the build is deterministic. This can be achieved via, python3 -m venv venvsource venv/bin/activatepython3 -m pip install -r requirements/development.txt./scripts/uv-pip-compile.sh When upgrading the version number of a single package, you should run ./scripts/uv-pip-compile.sh with the -P flag: ./scripts/uv-pip-compile.sh -P some-package-to-upgrade To bring all dependencies up to date as per the restrictions defined in setup.py and requirements/*.in, run ./scripts/uv-pip-compile.sh --upgrade ./scripts/uv-pip-compile.sh --upgrade This should be done periodically, but it is recommended to do thorough manual testing of the application to ensure no breaking changes have been introduced that aren't caught by the unit and integration tests. Logging to the browser console​ This feature is only available on Python 3. When debugging your application, you can have the server logs sent directly to the browser console using the ConsoleLog package. You need to mutate the app, by adding the following to your config.py or superset_config.py: from console_log import ConsoleLogdef FLASK_APP_MUTATOR(app): app.wsgi_app = ConsoleLog(app.wsgi_app, app.logger) Then make sure you run your WSGI server using the right worker type: gunicorn "superset.app:create_app()" -k "geventwebsocket.gunicorn.workers.GeventWebSocketWorker" -b 127.0.0.1:8088 --reload You can log anything to the browser console, including objects: from superset import appapp.logger.error('An exception occurred!')app.logger.info(form_data) Frontend​ Frontend assets (TypeScript, JavaScript, CSS, and images) must be compiled in order to properly display the web UI. The superset-frontend directory contains all NPM-managed frontend assets. Note that for some legacy pages there are additional frontend assets bundled with Flask-Appbuilder (e.g. jQuery and bootstrap). These are not managed by NPM and may be phased out in the future. Prerequisite​ nvm and node​ First, be sure you are using the following versions of Node.js and npm: Node.js: Version 20 npm: Version 10 We recommend using nvm to manage your node environment: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.37.0/install.sh | bashin case it shows '-bash: nvm: command not found'export NVM_DIR="$HOME/.nvm"[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion" # This loads nvm bash_completioncd superset-frontendnvm install --ltsnvm use --lts Or if you use the default macOS starting with Catalina shell zsh, try: sh -c "$(curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.37.0/install.sh)" For those interested, you may also try out avn to automatically switch to the node version that is required to run Superset frontend. Install dependencies​ Install third-party dependencies listed in package.json via: # From the root of the repositorycd superset-frontend# Install dependencies from `package-lock.json`npm ci Note that Superset uses Scarf to capture telemetry/analytics about versions being installed, including the scarf-js npm package and an analytics pixel. As noted elsewhere in this documentation, Scarf gathers aggregated stats for the sake of security/release strategy and does not capture/retain PII. You can read here about the scarf-js package, and various means to opt out of it, but you can opt out of the npm package and the pixel by setting the SCARF_ANALYTICS environment variable to false or opt out of the pixel by adding this setting in superset-frontent/package.json: // your-package/package.json{ // ... "scarfSettings": { "enabled": false } // ...} Build assets​ There are three types of assets you can build: npm run build: the production assets, CSS/JSS minified and optimized npm run dev-server: local development assets, with sourcemaps and hot refresh support npm run build-instrumented: instrumented application code for collecting code coverage from Cypress tests If while using the above commands you encounter an error related to the limit of file watchers: Error: ENOSPC: System limit for number of file watchers reached The error is thrown because the number of files monitored by the system has reached the limit. You can address this error by increasing the number of inotify watchers. The current value of max watches can be checked with: cat /proc/sys/fs/inotify/max_user_watches Edit the file /etc/sysctl.conf to increase this value. The value needs to be decided based on the system memory (see this StackOverflow answer for more context). Open the file in an editor and add a line at the bottom specifying the max watches values. fs.inotify.max_user_watches=524288 Save the file and exit the editor. To confirm that the change succeeded, run the following command to load the updated value of max_user_watches from sysctl.conf: sudo sysctl -p Webpack dev server​ The dev server by default starts at http://localhost:9000 and proxies the backend requests to http://localhost:8088. So a typical development workflow is the following: run Superset locally using Flask, on port 8088 — but don't access it directly, # Install Superset and dependencies, plus load your virtual environment first, as detailed above.superset run -p 8088 --with-threads --reload --debugger --debug in parallel, run the Webpack dev server locally on port 9000, npm run dev-server access http://localhost:9000 (the Webpack server, not Flask) in your web browser. This will use the hot-reloading front-end assets from the Webpack development server while redirecting back-end queries to Flask/Superset: your changes on Superset codebase — either front or back-end — will then be reflected live in the browser. It's possible to change the Webpack server settings: # Start the dev server at http://localhost:9000npm run dev-server# Run the dev server on a non-default port'''
