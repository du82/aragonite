title = "Upgrading Superset | Superset"
description = "Docker Compose"
full_description = "InstallationUpgrading SupersetOn this pageUpgrading Superset Docker Compose​ First, make sure to shut down the running containers in Docker Compose: docker compose down Next, update the folder that mirrors the superset repo through git: git pull origin master Then, restart the containers and any changed Docker images will be automatically pulled down: docker compose up Updating Superset Manually​ To upgrade superset in a native installation, run the following commands: pip install apache-superset --upgrade Upgrading the Metadata Database​ Migrate the metadata database by running: superset db upgradesuperset init While upgrading superset should not delete your charts and dashboards, we recommend following best practices and to backup your metadata database before upgrading. Before upgrading production, we recommend upgrading in a staging environment and upgrading production finally during off-peak usage.Edit this page"
