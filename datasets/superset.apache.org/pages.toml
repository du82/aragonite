full_description = "ConfigurationCountry Map ToolsOn this pageThe Country Map Visualization The Country Map visualization allows you to plot lightweight choropleth maps of your countries by province, states, or other subdivision types. It does not rely on any third-party map services but would require you to provide the ISO-3166-2 codes of your country's top-level subdivisions. Comparing to a province or state's full names, the ISO code is less ambiguous and is unique to all regions in the world. Included Maps​ The current list of countries can be found in the src legacy-plugin-chart-country-map/src/countries.ts The Country Maps visualization already ships with the maps for the following countries: AfghanistanAlandAlbaniaAlgeriaAmerican SamoaAndorraAngolaAnguillaAntarcticaAntigua And BarbudaArgentinaArmeniaAustraliaAustriaAzerbaijanBahrainBangladeshBarbadosBelarusBelgiumBelizeBeninBermudaBhutanBoliviaBosnia And HerzegovinaBotswanaBrazilBruneiBulgariaBurkina FasoBurundiCambodiaCameroonCanadaCape VerdeCentral African RepublicChadChileChinaColombiaComorosCook IslandsCosta RicaCroatiaCubaCyprusCzech RepublicDemocratic Republic Of The CongoDenmarkDjiboutiDominicaDominican RepublicEcuadorEgyptEl SalvadorEquatorial GuineaEritreaEstoniaEthiopiaFijiFinlandFranceFrance (with overseas)France (regions)French PolynesiaGabonGambiaGermanyGhanaGreeceGreenlandGrenadaGuatemalaGuineaGuyanaHaitiHondurasHungaryIcelandIndiaIndonesiaIranIsraelItalyItaly (regions)JapanJordanKazakhstanKenyaKoreaKuwaitKyrgyzstanLaosLatviaLebanonLesothoLiberiaLibyaLiechtensteinLithuaniaLuxembourgMacedoniaMadagascarMalawiMalaysiaMaldivesMaliMaltaMarshall IslandsMauritaniaMauritiusMexicoMoldovaMongoliaMontenegroMontserratMoroccoMozambiqueMyanmarNamibiaNauruNepalNetherlandsNew CaledoniaNew ZealandNicaraguaNigerNigeriaNorthern Mariana IslandsNorwayOmanPakistanPalauPanamaPapua New GuineaParaguayPeruPhilippinesPhilippines (regions)PolandPortugalQatarRomaniaRussiaRwandaSaint LuciaSaint Pierre And MiquelonSaint Vincent And The GrenadinesSamoaSan MarinoSao Tome And PrincipeSaudi ArabiaSenegalSeychellesSierra LeoneSingaporeSlovakiaSloveniaSolomon IslandsSomaliaSouth AfricaSpainSri LankaSudanSurinameSwedenSwitzerlandSyriaTaiwanTajikistanTanzaniaThailandThe BahamasTimorlesteTogoTongaTrinidad And TobagoTunisiaTurkeyTurkey (regions)TurkmenistanTurks And Caicos IslandsUgandaUKUkraineUnited Arab EmiratesUnited States Minor Outlying IslandsUnited States Virgin IslandsUruguayUSAUzbekistanVanuatuVenezuelaVietnamWallis And FutunaYemenZambiaZimbabwe Adding a New Country​ To add a new country to the list, you'd have to edit files in @superset-ui/legacy-plugin-chart-country-map. Generate a new GeoJSON file for your country following the guide in this Jupyter notebook. Edit the countries list in legacy-plugin-chart-country-map/src/countries.ts. Install superset-frontend dependencies: cd superset-frontend && npm install Verify your countries in Superset plugins storybook: npm run plugins:storybook. Build and install Superset from source code. Edit this page"
