full_description = '''Catching download filename of wget or cURL command? Ask Question Asked yesterday Modified yesterday Viewed 304 times 3 I've been trying to figure out how to "catch" the filename of a downloaded file via wget or curl commands in a shell script. What I'd like (and what seems impossible) is something like this: newfilename=$(wget --content-disposition --trust-server-names --timestamping "${myurl}") xattr -w user.download.url "${myurl}" "${newfilename}" chmod 0400 "${newfilename}" setfacl -m u:lisa:r "${newfilename}" or with curl: newfilename=$(curl --continue-at - --compressed --remote-name-all --remote-header-name --remote-time "${myurl}") xattr -w user.download.url "${myurl}" "${newfilename}" Now for some reason, I guess security, neither command seems willing to return the server-provided filename (in case it could contain remote code injection)? But that makes little sense to me when the same command is perfectly willing to use that remote filename string to create a file on disk? Is there a way to do this, if necessary through some workaround that checks the destination directory for a created file via inotify watch? shellwgetcurl Share Improve this question Follow edited yesterday nyov asked yesterday nyovnyov 39822 silver badges1616 bronze badges 1 this only works if you choose the download filename yourself @FrankThomas – nyov Commented yesterday Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 6 What I'd like (and what seems impossible) is something like this: Enable the --xattr option of curl or wget. This will make it automatically store the URL to the [user.]xdg.origin.url attribute. ~/.wgetrc xattr = on The curl option --write-out can output specific fields to stdout: curl -w "%{filename_effective}" [options...] $url For wget, you can at least log to file and parse the results: log=$(mktemp /tmp/wget.XXXXXX) LC_ALL=C.utf-8 wget -o $log [options...] $url file=$(sed -En 's/^Saving to: ‘(.+)’/\1/p' $log) Share Improve this answer Follow edited yesterday answered yesterday grawitygrawity 491k6767 gold badges1k1k silver badges1.1k1.1k bronze badges 1 1 Amazing! --write-out is exactly what I've been looking for. Many thanks. – nyov Commented yesterday Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged shellwgetcurl. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 485 How to download files from command line in Windows like wget or curl 34 Downloading file from FTP using cURL 2 curl can't connect; wget can 2 What is the curl equivalent of wget -qO (wget -q -O)? 1 How can I run the equivalent “curl” command that performs similarly to this “wget” command? 0 Psexec with curl or wget 1 TLS options for curl/wget 1 Download from a redirect using wget or curl $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 1883717, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions How to deal with problems that are too hard for me to even break down into smaller problems? Does human skin recover better in dry or humid environments? What could keep a giant spider population in check? How could I justify a fast apocalypse? Who discovered that vacuum tubes could be used for logic and computation? How many non-attacking grasshoppers on a chess board? Can a statistical test prove that a value is equal to 0? Are there 