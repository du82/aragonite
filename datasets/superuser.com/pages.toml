full_description = '''I found an old CRT monitor with a RS-232 (not VGA) video input. How can I use it on a modern computer? Ask Question Asked today Modified today Viewed 22 times 0 I found an old Samsung CRT color monitor. I was hoping to use it for playing retro DOS games, but the main issue that I'm facing is that it's using RS-232, which as far as I can tell, is a very unusual choice for a monitor. I'm fairly confident it is actually RS-232 and not VGA. It has 9 pins: Five on top, four on bottom, female port. Here is a photo of the port: The best I found is an adapter that coverts RS-232 to USB, but the Amazon page says explicitly that it's not for monitor use and as such I'm hesitant to make the purchase. If anyone can give me suggestions on how to best adapt this monitor to a more modern format, please let me know. I'd prefer DisplayPort, but I can work with HDMI or even A/V. Display Information: Brand: Samsung Model: CVP4237P Manufactured: May 1995, Color Display Monitor FCC ID: A3LCVK423 Serial: H2JF502053 displayrs232crtold-hardware Share Improve this question Follow edited 2 hours ago Giacomo1968 58k2323 gold badges175175 silver badges222222 bronze badges asked 3 hours ago link joneslink jones 111 bronze badge New contributor link jones is a new contributor to this site. Take care in asking for clarification, commenting, and answering. Check out our Code of Conduct. 0 Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 Based on your description, the display seems to be a SyncMaster 3Ne (CVP4237P). This link on Reddit is for the Samsung Syncmaster 4NE but it seems to have a similar 9 pin connector. While you say you want a DisplayPort or HDMI connection, the are both digital connections and VGA is analog. So your best bet is a VGA cable like this one found on eBay: Universal RS232 DB9 9 Pin Male to VGA Video 15 Pin Male Adapter Share Improve this answer Follow answered 2 