full_description = '''Acer Aspire Says no bootable device Ask Question Asked 3 years, 2 months ago Modified today Viewed 680 times 0 My Acer aspire says there was a problem with the restart when I try to restart it then says there is no bootable device when it try’s to boot up I have checked my bios and I have unhooked the battery I have a back up on usb but it won’t even respond to that windows Share Improve this question Follow asked Dec 16, 2021 at 9:44 Leslie Elaine SanspreeLeslie Elaine Sanspree 1 Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 You may receive the error "No Bootable Device" if your computer does not detect a hard drive, solid state drive, or other bootable drive to load the operating system. This can sometimes be caused by a change to settings in your BIOS or UEFI. Use the following steps to resolve this situation: Hold the power-button for 5 seconds to power off the device. Power on the system. As soon as the first logo screen appears, immediately press the F2 key, or the DEL key if you have a desktop, to enter the BIOS. Press F9 and then ENTER to load the default configuration. Press F10 to save your changes, and restart the system. Select Yes and press ENTER to confirm. Your system should boot up normally, If you are still experiencing a problem, please contact Acer support for further assistance. Acer Support Credit Acer Community Acer-Blayn Share Improve this answer Follow answered Dec 16, 2021 at 11:55 MarkMark 37411 silver badge77 bronze badges Add a comment | You must log in to answer this question. Highly active question. Earn 10 reputation (not counting the association bonus) in order to answer this question. The reputation requirement helps protect this question from spam and non-answer activity. Not the answer you're looking for? Browse other questions tagged windows. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is t