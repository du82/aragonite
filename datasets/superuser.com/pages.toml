full_description = '''Get table of contents to include "title" style Ask Question Asked 13 years, 11 months ago Modified today Viewed 116k times 35 I know Word automatically generates a table of contents using heading levels 1 and 2. I was wondering if it was possible to make Word include the Title formatting also? I am using both Word 2010 and 2007 on Windows. windowsmicrosoft-wordmicrosoft-word-2007microsoft-office-2010microsoft-office Share Improve this question Follow edited 1 hour ago Franck Dernoncourt 23.3k6161 gold badges224224 silver badges390390 bronze badges asked Mar 12, 2011 at 3:29 surfasbsurfasb 22.8k55 gold badges5656 silver badges7777 bronze badges Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 54 Yes, this is possible - to do this you need to: Set the Title style to your desired Outline level so it will be available in the Table of Contents: Open the Styles window (Alt+Ctrl+Shift+S) Scroll down to the Title style and select Modify... Click the Format button and select Paragraph... Set the Outline level to your desired level This will add the Title style to the options available in the Table of Contents builder. To verify that the Title style will now be added to the Table of Contents: Choose the References tab Click Table of Contents Choose Insert Table of Contents... Click the Options... button Scroll through the Available styles: list to make sure that the Title style now shows up and that it has the desired TOC level Share Improve this answer Follow edited Jun 12, 2020 at 13:48 CommunityBot 1 answered Mar 23, 2011 at 1:01 jmohrjmohr 2,36522 gold badges2222 silver badges1515 bronze badges 5 1 That has to be the most detailed answer ever. Thanks! – surfasb Commented Mar 23, 2011 at 22:50 8 +1 I wish you would work for Microsoft and re-do all of their Office documentation! – Sabuncu Commented Nov 24, 2013 at 20:15 1 Just dropping by to point out that I had to do the reverse of this to stop Title styles from showing up in my TofC. I'm not sure whether Title style in Word2013 has a level assigned by default or I inherited a mucked-up style from some other document. – Carl Witthoft Commented Nov 23, 2015 at 18:41 I have some custom styles and when I select my custom style as shown in the 5th step, Table of Contents insists on not to include some of those I have selected from styles list :) do you have any idea, what can it be? and moreover each time I remove default Heading 1, 2, and 3 but when I enter edit field I see them again and again :) Okay it does not have any effect since I have no Heading 1 or 2 or 3 but Word is insisting on keeping them :) – fermat4214 Commented Jun 9, 2016 at 3:25 1 Paragraph is not an option for me in that dropdown (its greyed out/disabled). Any other ideas on how I can get it in the TOC? – Adam Moisa Commented Apr 30, 2017 at 20:15 Add a comment | You must log in to answer this question. Highly active question. Earn 10 reputation (not counting the association bonus) in order to answer this question. The reputation requirement helps protect this question from spam and non-answer activity. Not the answer you're looking for? Browse other questions tagged windowsmicrosoft-wordmicrosoft-word-2007microsoft-office-2010microsoft-office. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 3 Easy Update "Table of Contents" feature in Microsoft Word 2007 VS. Microsoft word 2010 1 Edit Microsoft Word 2007 table of contents indent? 2 Automatic Table of Contents in Word 16 How can I reset a Style in Microsoft Word? 1 MS Word - change title of Table of Contents 2 Should I use "Title" or "Heading 1" style for chapter title in Word 2016 document? 0 How to modify the indents in Table of Conten