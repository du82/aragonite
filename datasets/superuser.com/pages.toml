full_description = '''How to update Google Chrome in Ubuntu? Ask Question Asked 14 years, 10 months ago Modified today Viewed 381k times 101 How to update Google Chrome in Ubuntu? linuxubuntugoogle-chromeupdates Share Improve this question Follow edited 1 hour ago Franck Dernoncourt 23.3k6161 gold badges224224 silver badges390390 bronze badges asked Apr 13, 2010 at 1:07 OscarRyzOscarRyz 4,1411111 gold badges4141 silver badges6464 bronze badges 2 @Ignacio: Add/Remove Applications and it's not there. – OscarRyz Commented Apr 16, 2010 at 5:23 This helped me install the lasted Google Chrome on Ubuntu via command line: askubuntu.com/a/510063/48214 – Ryan Commented Mar 4, 2020 at 19:48 Add a comment | 5 Answers 5 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 120 First download and install the key from Google Linux Repository. Or run the following commands in the terminal, type the password for the user when prompted. wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add - sudo sh -c 'echo "deb http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list' sudo apt-get update To install: sudo apt-get install google-chrome-beta To update only: sudo apt-get --only-upgrade install google-chrome-stable Then update (if available) the Network Security Service libraries (libnss), or Chrome will behave weird sudo apt-get install libnss3-1d In Ubuntu 18.04 or later libnss3-1d - Network Security Service libraries - transitional package is depreciated and incorporated in generic libnss3 library. (Thanks Bishoy Melek) sudo apt-get install libnss3 Now you have to kill all instances (may be hidden) of old Google Chrome. sudo pkill -15 google-chrome sudo pkill -15 chrome Then start google-chrome as you start it. Share Improve this answer Follow edited Jun 6, 2019 at 9:28 answered Mar 5, 2013 at 9:37 ghosh'.ghosh'. 1,32511 gold badge88 silver badges77 bronze badges 12 1 Says google-chrome-stable is in the latest version available. But I'm on Chrome 30.0.1599.101 and apparently version 32 exists now. Is the debian package regularly updated as well? – Augustin Riedinger Commented Jan 30, 2014 at 11:44 No, Debian packages are NOT regularly updated. And this depends on your Ubuntu version. – ghosh'. Commented Feb 1, 2014 at 9:41 1 There is a simpler way to restart Chrome. Just open this link - chrome://restart . Source - plus.google.com/+FrancoisBeaufort/posts/VVv36sA79Mu. – Ilia Barahovsky Commented Apr 17, 2016 at 7:12 @IliaBarahovski .. Yeah. You can. But I'll prefer the bash line approach, it's the unix way of life :) – ghosh'. Commented Apr 18, 2016 at 10:14 worked for me Ubuntu 14.10 {[9303:9339:0915/095009.401468:FATAL:nss_util.cc(632)] NSS_VersionCheck("3.26") failed. NSS >= 3.26 is required. Please upgrade to the latest NSS, and if you still get this error, contact your distribution maintainer.} – Vadim Commented Sep 15, 2017 at 7:01 | Show 7 more comments 17 From the Chrome EULA page: Note: Installing Google Chrome will add the Google repository so your system will automatically keep Google Chrome up to date. If you don't want Google's repository, do "sudo touch /etc/default/google-chrome" before installing the package. [emphasis theirs] So, as mgpyone indicated Ubuntu's update-manager should take care of that for you. Here are the contents of my /etc/apt/sources.list.d/google-chrome.list deb http://dl.google.com/linux/deb/ stable main Share Improve this answer Follow answered Apr 13, 2010 at 3:15 Dennis WilliamsonDennis Williamson 111k2121 gold badges176176 silver badges191191 bronze badges 0 Add a comment | 6 If it does not update properly, just download the last .deb file from: https://www.google.com/chrome/browser/desktop/ The deb file like google-chrome-stable_current_amd64.deb Then you can: sudo dpkg -i /path/to/google-chrome-stable_current_amd64.deb Replace /path/to with your proper path. It just worked for me on Ubuntu 14.04 Share Improve this answer Follow answered Feb 12, 2017 at 18:57 BntMrxBntMrx 16111 silver badge11 bronze badge 0 Add a comment | 3 From Google Chrome Help Use your package manager to check for updates. Privacy information Google Chrome uses a process called Google Update to periodically check for updates. This process sends information, such as version number, language, operating system, and other installation or update-related details, back to Google servers. This information is not associated with you or your Google Account. Share Improve this answer Follow answered Apr 13, 2010 at 1:21 Ye Lin AungYe Lin Aung 5,69077 gold badges3434 silver badges3737 bronze badges Add a comment | 1 I had similar problem with broken package in Chrome 20.0.xxx. I could see two chrome packages in Synaptic package manager. I deleted the new version of chrome package then marked older version on chrome package for upgrade. Then upgrade all packages through, which took care of everything and my Chrome was upgraded to the latest version. Share Improve this answer Follow answered Dec 18, 2012 at 3:00 Mukesh kumarMukesh kumar 1122 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged linuxubuntugoogle-chromeupdates. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) Related 7 Cannot update Google Chrome portable 10 Disable auto-update of Google Chrome 3 Can't install Google Chrome on Ubuntu 11.04 3 How to disable Google Chrome downloads from Ubuntu updates? 4 Why Google Chrome can not Update it-self? 8 How to update google chrome portable $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-i