title = "java - Installing Eclipse 4.5 on ARM Ubuntu - Super User"
description = """
I recently got an excellent deal on a Chromebook (Hisense C11), and have used crouton to install Trusty Tahr (14.04):

(trusty)craig@localhost:~$ uname -a
Linux localhost 3.14.0 #1 SMP PREEMPT Wed ..."""
full_description = '''Installing Eclipse 4.5 on ARM Ubuntu Ask Question Asked 8 years, 11 months ago Modified today Viewed 4k times 1 I recently got an excellent deal on a Chromebook (Hisense C11), and have used crouton to install Trusty Tahr (14.04): (trusty)craig@localhost:~$ uname -a Linux localhost 3.14.0 #1 SMP PREEMPT Wed Apr 20 20:48:35 PDT 2016 armv7l armv7l armv7l GNU/Linux (trusty)craig@localhost:~$ java -version java version "1.8.0" Java(TM) SE Runtime Environment (build 1.8.0-b132) Java HotSpot(TM) Client VM (build 25.0-b70, mixed mode) I installed JDK 1.8 (ARM) from Oracle, which is working great. I then used the package manager to install the generic eclipse package, as Eclipse doesn't seem to provide ARM builds of their standard IDE packages. However, to my dismay, the trusty repository only contains Eclipse 3.8, which doesn't have support for JDK 8. How can I install Eclipse 4.5 (or any version with Java 8 support, really) in Ubuntu on ARM? I'm fine compiling if necessary, but it seems since 99% of this should be .jar-based, I figure I'm just looking for a newer version of the executable? Edit: I would also be satisfied with the ability to get my current Eclipse 3.8 installation working with Java 8, but that seems harder. ubuntujavaeclipsearm Share Improve this question Follow edited May 1, 2016 at 15:56 Craig Otis asked Mar 8, 2016 at 22:27 Craig OtisCraig Otis 85633 gold badges1111 silver badges2525 bronze badges 5 Do you encounter any problems when following the steps described in the article How to Install The Latest Eclipse Release in Ubuntu 14.04 ? – harrymc Commented May 1, 2016 at 19:28 @harrymc Eclipse no longer offers ARM builds - so downloading it straight from their website is not an option. – Craig Otis Commented May 1, 2016 at 19:58 1 I don't believe that what you are asking for is possible. Basically, you are seeking to create your own binary release of Eclipse 4.5 on ARM Ubuntu. However, instructions or a script to compile Eclipse are not made available by the Eclipse developers, and even if recompiled it might still not work because of the need to supply some platform-dependent code. – harrymc Commented May 3, 2016 at 7:15 @harrymc Sure, but somebody did it for Eclipse 3.8 in the trusty repository, I'm just trying to figure out how. Did ARM previously have first-class support, which has since been dropped? Or was it a one-off build in the first place? How does Eclipse get built for Windows? Surely there's a build script somewhere, it can't be some solo guy hiding in the shadows. :-) – Craig Otis Commented May 5, 2016 at 16:49 Oh yes, it can be one ARM developer in charge of making ARM releases, who may have left the project or is now otherwise occupied for personal reasons. You might ask to be put in contact with him on the Eclipse forums, which probably means that you will be joining the project. But be warned that this risks taking up much of your time. – harrymc Commented May 5, 2016 at 18:06 Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 Seems like Eclipse has some platform dependent code even though written in Java. Simply downloading the binary build will not work. Your only option may be compiling it. https://softwareengineering.stackexchange.com/questions/307253/why-is-eclipse-platform-dependent Share Improve this answer Follow edited Apr 12, 2017 at 7:31 CommunityBot 1 answered May 3, 2016 at 2:51 12838221283822 42844 silver badges66 bronze badges 1 1 How is that an answer? – harrymc Commented May 3, 2016 at 7:03 Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged ubuntujavaeclipsearm. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide A