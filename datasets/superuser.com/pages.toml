However, even I changed it to 'scatter with straight lines and markers', there is ..."""
full_description = '''How to connect datapoints in a scatter plot in Excel? Ask Question Asked 2 years, 11 months ago Modified today Viewed 44k times 0 I have been trying to add straight lines for each set of the data points, and have tried to change the chart type. However, even I changed it to 'scatter with straight lines and markers', there is still no lines at all. So how can I add lines to connect the datapoints? microsoft-excel Share Improve this question Follow edited Mar 18, 2022 at 3:34 Giacomo1968 58k2323 gold badges175175 silver badges222222 bronze badges asked Mar 18, 2022 at 3:33 QuestionQuestion 17722 gold badges33 silver badges66 bronze badges Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 In the chart, select a data series (by clicking, but not double-clicking, on one of its points) and then right click. Select "Format Data Series" from the context (popup) menu that appears. Depending on your version of Excel, a dialog will appear that allows you to add lines to the data series. In the latest versions, it will look like this: Simply select the "solid line" radio button and more dialog will appear which will allow choice of colour, line style, line thickness, etc. Repeat for any other series similarly without lines on your chart. It is possible that whatever method you used to create your original chart specifically set the line property to be "No line" for each of the series in your chart and that these settings remained in effect despite you changing the chart type to "scatter with straight lines and markers". Share Improve this answer Follow answered Mar 18, 2022 at 10:45 DMMDMM 91644 silver badges77 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged microsoft-excel. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep di