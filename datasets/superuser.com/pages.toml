full_description = '''Why does the backspace key act like the previous arrow on Brave and Edge browsers in Ubuntu 22.04? Ask Question Asked today Modified today Viewed 16 times 1 When I'm editing text in a textbox and I type the backspace key instead of moving the cursor back and deleting a character it acts as if I had hit the previous arrow at the top of the browser. This happens in both Brave and Edge. If I hold the shift key I get the normal backspace key behavior, but it's slower. This just started happening. I’ve rebooted and I still get this behavior. I’m on Ubuntu 22.04. What could cause this? Note that this about editing text such as when entering search terms. When I hit backspace it takes me back to another web page as if I had hit the previous arrow at the top of the browser. This happens on: Brave: Version 1.73.105 Chromium: 131.0.6778.265 Version 1.75.181 Chromium: 133.0.6943.141 Edge: Version 131.0.2903.112 Version 133.0.3065.92 This does not happen on: Brave 1.71.118 Chromium 130.0.6723.70 Edge 130.0.2849.52 ubuntumicrosoft-edgebravebackspace Share Improve this question Follow edited 1 hour ago Giacomo1968 58k2323 gold badges175175 silver badges222222 bronze badges asked 6 hours ago Dean SchulzeDean Schulze 26711 gold badge55 silver badges1414 bronze badges 2 This question is similar to: How can I re-enable backspace navigation in Chrome?, because both MS Edge and Brave browsers are based on Google Chrome. If you believe it’s different, please edit the question, make it clear how it’s different and/or how the answers on that question are not helpful for your problem. – DrMoishe Pippik Commented 5 hours ago That question is about using the backspace key to go to previous pages, not editing text in a textbox. That is also several years old. This just started happening to me a few hours ago. Before that backspace worked correctly when editing text. – Dean Schulze Commented 2 hours ago Add a comment | 0 Sorted by: Reset to default Highest score (default)