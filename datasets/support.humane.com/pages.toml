["https://support.humane.com/hc/en-us/articles/23170916262413"]
title = "Manage passcode settings – Ground Control"
description = """
Ai Pin requires your 4-digit passcode to unlock it. For more context on why and when your Ai Pin locks, see Ai Pin lock and unlock behavior.
Change passcode

Tap the touchpad with one finger to ind..."""
full_description = '''Ground Control Ground Control Setup & Settings Privacy Manage passcode settings Ai Pin requires your 4-digit passcode to unlock it. For more context on why and when your Ai Pin locks, see Ai Pin lock and unlock behavior. Change passcode Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll and pick “passcode.” Scroll and pick “change passcode.” Enter existing passcode. Enter a new passcode and then re-enter it to verify the change. Change default lockout period By default, Ai Pin automatically locks after it detaches from a Booster or accessory. Follow the steps below if you want to change when your Pin to also unlock after a period of inactivity: Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll and pick “passcode.” Scroll and pick “require after.” Pick a time interval. You can pick 15, 30, or 60 minutes, or “detach only.” (Picking “detach only” causes Ai Pin to lock only when you detach it from Battery Booster.) Enable "allow swap" Enable the "allow swap" setting to add a six-second delay when detaching your Pin from an accessory, so you won't need to re-enter your passcode when swapping out accessories. Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll and pick "allow swap" to flip the toggle on . To confirm, pick "allow swapping." To disable, pick "allow swap" to flip the toggle off . Remove passcode Removing your passcode will reduce the security of your Ai Pin, so proceed at your own risk. Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll and pick “passcode.” Scroll and pick "remove passcode." Pick "remove." To confirm, enter your current passcode. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () =