full_description = '''Ground Control Ground Control Account & Subscription Manage subscription How to cancel your Humane Plan How to cancel your Humane Plan You can cancel your plan at any time. Upon cancellation, your plan will remain active until the end of your current billing cycle. When your plan ends, Ai Pin will become inoperable. You can continue to access the data in .Center after your plan ends. You can reactivate your plan, but if you do not reactivate it within 60 days, your phone number will be rescinded. You would then need to purchase a new plan. To cancel your plan Log in to .Center. Select your profile in the bottom right. Select Settings then select Plan & Billing Under “Status,” you’ll see the option to cancel your subscription. For more information on your Humane Plan, visit this article. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.cla