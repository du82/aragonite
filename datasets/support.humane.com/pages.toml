Press and hold one finger on the touchpad. You will se..."""
full_description = '''Ground Control Ground Control Power & Charging Power off or restart Ai Pin The power setting shows the battery level of Ai Pin. It also provides options for powering OFF or restarting Ai Pin. To power off Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say "power off." Release your finger from the touchpad. The Trust Light will stop flashing and you will hear a chime indicating Ai Mic is no longer listening. Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “power” and pick it. Pick "power off." To restart Ai Pin Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say "Reboot" or "Restart". Release your finger from the touchpad. The Trust Light will stop flashing and you will hear a chime indicating Ai Mic is no longer listening. Ai Pin Trust Light will rainbow, indicating it has powered back ON. Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “power” and pick it. Pick "restart." To wake up Ai Pin after power off If connected, slide your Booster off your Ai Pin and reattach. Wait a few minutes until you see the rainbow Trust Light, indicating your Ai Pin is powered ON again and ready for use. NoteIf powering Ai Pin ON after a fully depleted battery, you may need to rest the device on the Charge Pad for 15-20 minutes for your Pin to boot up. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.rem