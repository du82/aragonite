If your Ai Pin takes a photo instead of repeating its last response when you say "repeat that," this guide explains the issue and outlines alternative commands you can use to ask Ai Pin to ...'''
full_description = '''Ground Control Ground Control Setup & Settings Connectivity If "Repeat That" Takes a Picture on Your Ai Pin Summary If your Ai Pin takes a photo instead of repeating its last response when you say "repeat that," this guide explains the issue and outlines alternative commands you can use to ask Ai Pin to repeat missed or misheard responses. It also provides additional steps to access your message history if needed. What’s Happening The "repeat that" command is currently triggering the camera to take a picture instead of Ai Pin repeating the last response. This is a known issue that we’re actively working to address in an upcoming software update. Thank you for your patience as we resolve this. Workaround In the meantime, you can use the following steps to repeat messages from your Ai Pin: Use "Say That Again": Say "say that again" instead of "repeat that." Your Ai Pin will repeat the last message it delivered. View Your Message History in .Center: Visit Humane.Center. Go to the Ai Mic section to view a full history of messages from your Ai Pin. Additional Information The issue is limited to the phrase "repeat that." Other commands, including "say that again," are unaffected. Need More Help? If you need further assistance, our support team is here to help. You can send us an email by clicking here, and one of our specialists will respond within 1 business day. When our team is available, you can also start a chat by clicking the message bubble in the lower-right corner of your screen to connect with us immediately. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classL