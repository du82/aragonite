full_description = '''Ground Control Ground Control Humane.Center Manage linked services Set up your Humane account so that your Ai Pin can access the available services seamlessly. Manage linked services Log in to your Humane.Center Account. Select your profile  in the bottom right. Select Settings  then Services  Select the desired service. Log into that service's account. Once successfully logged in, you will be redirected to .Center. If the linking was successful, you should see a green check mark and the service listed under “Linked services.” Remove a connected service Log in to your Humane.Center Account. Select your profile  in the bottom right. Select Settings  then Services  Click the delete button next to the linked service you’d like to remove. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onloa