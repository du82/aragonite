full_description = '''Ground Control Ground Control Setup & Settings Traveling internationally with Ai Pin If you’re traveling outside the US and would like to take your Ai Pin with you, here are a few tips on how to get the most out of your experience: Plan ahead Purchase your International Roaming Add-On ahead of time in Humane.Center so you can utilize your Ai Pin as soon as you land, regardless of Wi-Fi connection. See Humane Plan for more details. Once you arrive at your destination, your Ai Pin will notify you that data roaming is turned ON. To dismiss this notification, raise your hand to engage the Laser Ink Display and pick "keep on" or "turn off." Speak the local language By using Ai Pin’s built-in translation feature, you can overcome language barriers in dozens of countries. See Set translated language. Stay synced Place Ai Pin on your Charge Pad every night to ensure your photos and memories from the day are uploaded to Humane.Center. See View and manage photos & videos. Bring backup If you have a spare Battery Booster, be sure to bring it with you each day to ensure you have enough power to capture your memories and use translation. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') 