["https://support.humane.com/hc/en-us/articles/33854228948493-Troubleshooting-Touch-Pad-is-unresponsive"]
title = "Troubleshooting Touch Pad is unresponsive – Ground Control"
description = """
Summary
Ai Pin’s touchpad is the central touchpoint for interacting with your device, allowing you to issue commands, capture photos, and more. If the touchpad is unresponsive or you’re not getting..."""
full_description = '''Ground Control Ground Control Experiences Troubleshooting Touch Pad is unresponsive Summary Ai Pin’s touchpad is the central touchpoint for interacting with your device, allowing you to issue commands, capture photos, and more. If the touchpad is unresponsive or you’re not getting any feedback, it signals a problem that needs attention. This guide takes you through essential troubleshooting steps, beginning with basic actions like removing and reinserting the battery, to more advanced solutions like performing a ChargePad reset. By following these steps, you'll get your touchpad functioning again, ensuring a smooth and effective Ai Pin experience. Issue Are you pressing your Ai Pin’s touchpad and not getting any response? It could be a simple software hiccup that just needs a quick refresh, or there might be something more going on under the hood. In the steps below, we’ll help you figure out what’s happening and get your Ai Pin’s touchpad working again. Solution The troubleshooting steps outlined here start with some simplest solutions and progressively get more indepth. After taking the steps outlined for each solution, you should test to see if the issue is resolved. Step 1 : Remove the Battery Start by removing the battery from the back of your Pin. Remove the battery from your Pin. You should hear a sound when you disconnect the battery. After 30 seconds reattach the battery to the back of your Pin. You should hear a sound when you reattach your battery. If you get no sound, proceed to step 3 Try using the touchpad again. Step 2: Verify Ai Pin Lost or Stolen is turned off on your .Center Account Before you start troubleshooting, follow these steps to verify that you do not have the option “Ai Pin is lost or stolen” turned on: Log into your Humane.Center Account Navigate to the icon in the bottom right corner, and Select “Settings” Select “My Ai Pin”. Select “View” on Ai Pin is lost or stolen. Make sure the option is toggled off. Step 3: Charge Pad Reset Sometimes your Pin can get in a bad state and needs to be reset. In order to reset your Ai Pin follow the steps below. Place your Ai Pin in the charge pad. Grab a Paperclip and insert the paperclip into the hole in the back of the charge pad. Hold the paperclip down for several seconds or until you see the red light on the charge pad. Leave your Pin on the charge pad until you see the rainbow trust light on your Pin. Once the rainbow trust light stops, pick up your pin and try again. Conclusion If your touch pad is still unresponsive, or if your issue persists, please reach out to our customer support team for further assistance. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbs