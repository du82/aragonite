["https://support.humane.com/hc/en-us/articles/30592582926093-Unlock-your-Ai-Pin-using-Touchcode"]
title = "Unlock your Ai Pin using Touchcode – Ground Control"
description = '''
You can now unlock your Ai Pin via a series of touchpad gestures. This Touchcode can be used in place of a Passcode. 
Set up Touchcode by voice command

Hold down Ai Mic and say "Set up Touchcode" ...'''
full_description = '''Ground Control Ground Control Setup & Settings Getting started Unlock your Ai Pin using Touchcode You can now unlock your Ai Pin via a series of touchpad gestures. This Touchcode can be used in place of a Passcode. Set up Touchcode by voice command Hold down Ai Mic and say "Set up Touchcode" Follow the instructions from your Pin to complete set up. Set up Touchcode from Laser Ink display Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. If locked, unlock with your numerical passcode as usual, then pull your hand back to access the Home UI with 5 icons and select settings  located at the bottom of the circle. Scroll to the passcode button using your index finger and thumb to select. Select "Set up touchcode" and follow the instructions. You will need to enter your 4 digit numerical passcode first Now choose a series of 4 touchpad gestures that are your own private unlock code. Gesture options: One finger swipe up, down, left or right Two finger swipe up, down, left or right Tap with one or two fingers As you enter each gesture, your Ai Pin will confirm with a sound. Touchcode options: (A Touchcode is a series of 4 of any of these gestures) Single Swipe up Single Swipe down Single Swipe left Single Swipe right Single tap Double swipe up Double swipe down Double swipe left Double swipe right Double tap Once set up, you can begin unlocking your Ai Pin by making a circle gesture on the touchpad. Then simply repeat the four gestures you set to unlock your Ai Pin. Each gesture will make a sound, followed by an "unlock" sound to indicate that you've input your Touchcode successfully. NoteIf you forget your Touchcode, you can always use your numerical passcode as well. See Unlock Ai Pin for instructions. document.addEventListener('DOMContentLoaded', 