full_description = '''Ground Control Ground Control Power & Charging Power Check battery levels Ai Pin + Battery Booster Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Ask “What’s the power level?”, “What’s my battery life?”, or something similar. Release your finger from the touchpad. The Trust Light will stop flashing and you will hear a chime indicating Ai Mic is no longer listening. Ai Pin will let you know the power levels of both Ai Pin and the Battery Booster, respectively. If wearing any accessory other than the Booster, it will reply with only Ai Pin battery percentage. NoteIf your Booster's battery is depleted, Ai Pin will only reply with Ai Pin's battery percentage. Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. The combined battery level of your Ai Pin + Booster appears in the lower righthand corner (e.g. 95%). Low battery alerts Your Ai Pin will notify you when it reaches 10% battery and when your Booster reaches 10%. When you hear these alerts, swap out your Booster with a fully charged one. Alternatively, place both your Pin and Booster on the Charge Pad. Charge Pad Tap the side of your Charge Pad to see the cumulative power level of the device(s) on the Charge Pad. The LED that appears when you tap the Charge Pad corresponds with the following power levels: Green: Charge > 80% (Ready to use) Amber: Charge < 80% Red: Contact Support If the Battery Booster is attached to your Ai Pin, the LED will show the cumulative power level of both devices. If only the Battery Booster is present, the LED will show its power level. Note If your Ai Pin or Battery Booster is left on the Charge Pad for more than 96 hours, power level will only reach 80%. This behavior is intended to improve the longevity of your batteries. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
