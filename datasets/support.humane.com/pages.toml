["https://support.humane.com/hc/en-us/articles/22369582296333-Trust-Light-and-Beacon"]
title = "Trust Light and Beacon – Ground Control"
description = """
Trust Light
The Trust Light indicates when your Ai Pin input, optical, or audio sensors are active. The color of the light shows which sensor is active. The light lets you and others around you kno..."""
full_description = '''Ground Control Ground Control Setup & Settings Getting started Trust Light and Beacon Trust Light The Trust Light indicates when your Ai Pin input, optical, or audio sensors are active. The color of the light shows which sensor is active. The light lets you and others around you know when Ai Pin is capturing or recording data. Ai Pin doesn’t have any “wake words” and is not always listening. Those around you don’t need to worry about their privacy. No data is collected unless the Trust Light is on. Color Description Powering on Cycles through rainbow spectrum as Ai Pin is starting up Photo or video Blinks green right before and during photo or video capture Microphone Fades in and out orange while Ai Mic is active Scan Fades in and out white while scanning for hand to project Laser Ink Display Phone call Blinks magenta during outbound or ongoing call Beacon The Beacon is positioned so that you can easily see it. It indicates either a message from a Trusted Contact or an alert. Color Description Trusted Contact call Blinks magenta for incoming call from Trusted Contact Untrusted Contact call Blinks green for incoming call from Untrusted Contact Trusted Contact message Pulses blue for update on conversation from Trusted Contact Area alert Quickly pulses red for AMBER alert, weather warnings, etc. Booster powering up Cycles through rainbow spectrum to indicate Ai Pin needs additional charging until it’s ready for use Thermal alert Cycles through orange gradient to indicate Ai Pin needs to cool down until it’s ready for use again Tips & solutions The Beacon pulses orange and you hear the message "Your Ai Pin is getting warm, let's cool it down for a few minutes" This means your Pin is getting warm and needs to cool down. If you encounter this behavior, complete the following steps: Remove the battery from your Ai Pin. Avoid using your device for several minutes. Keep it off the Charge Pad and out of a Charge Case. Consider moving away from any heat sources or direct sunlight. Once your device has cooled, raise your hand, or begin using voice commands. If your device is still encountering a thermal error, continue to let your device rest. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { p