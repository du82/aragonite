["https://support.humane.com/hc/en-us/articles/23955137120141-Setting-up-Ai-Pin"]
title = "Setting up Ai Pin – Ground Control"
description = """
Setting up Ai Pin



What's included in the box:  Ai Pin, 2 Battery Boosters, Charge Pad, Adapter + Cable





Put on Ai Pin + Booster



Slide the Booster down to detach it from your Pin.

Slip yo..."""
full_description = '''Ground Control Ground Control Setup & Settings Getting started Setting up Ai Pin What's included in the box: Ai Pin, 2 Battery Boosters, Charge Pad, Adapter + Cable Put on Ai Pin + Booster Slide the Booster down to detach it from your Pin. Slip your Booster under your clothing and place your Pin in front until the two magnetically connect. It’s best to wear your Pin close to your collarbone, on the right or left side of your chest. The Trust Light displays rainbow colors to indicate your Pin is starting up. When the rainbow Trust Light stops, you are ready to proceed to the next step. Learn hand gestures Tap the touchpad and hold your hand 12 inches in front of you. Ai Pin will begin scanning for your hand to project the Laser Ink Display. Once successful, you will see the Ai Pin logo projected on your hand. Follow the voice narration and Laser Ink cues to complete the hand gesture tutorial. Not seeing the Laser Ink display on your hand? See our Laser Ink troubleshooting tips. Enter passcode Use the passcode you created during online setup. Use the push + pull gesture to scroll through the stack of numbers 0-9. When you land on the correct number, use your index finger and thumb to pick the number. Repeat the process until you have entered all 4 digits of your passcode. If you select an incorrect number, you can delete it by scrolling to the end of the stack and picking the backspace button. Alternatively, you can drop and raise your hand to restart passcode entry. Forgot your passcode? See Manage Ai Pin passcode. Explore Ai Mic Close and open your hand to go home to complete the tutorial. Drop your hand. Use Ai Mic to ask general knowledge questions, take a photo or video, send a message and much more. To use Ai Mic: Press and hold one finger on the touchpad. When you see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening, ask your question. Release your finger from the touchpad. The Trust Light stops flashing and you hear a chime indicating Ai Mic is no longer listening. Listen to Ai Mic’s response. Want more ideas on how to use Ai Mic? See Using Ai Mic. Enjoy Need further assistance? Ask your Pin for help! Use Ai Mic to ask any question you have about your Pin, Battery Booster, Humane.Center, or any other related topics. Or use the search bar at the top of any Ground Control page to ask any product question. Still need help? Our Support team would be happy to help. const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none"'''
