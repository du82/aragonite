["https://support.humane.com/hc/en-us/articles/23711919022477-Manage-multi-factor-authentication-MFA"]
title = "Manage multi-factor authentication (MFA) – Ground Control"
description = "It is highly recommended to use multi-factor authentication (MFA) to add an extra layer of protection for your data. When MFA is enabled, you will be prompted to enter an additional security code e..."
full_description = '''Ground Control Ground Control Account & Subscription Manage multi-factor authentication (MFA) It is highly recommended to use multi-factor authentication (MFA) to add an extra layer of protection for your data. When MFA is enabled, you will be prompted to enter an additional security code every time you log into your .Center account. This security code ensures that even your password becomes compromised, only you will be able to access your account. When you first set up your Ai Pin, you were given the option to set up MFA. If you haven't set it up yet, you can set up MFA now by logging into Humane.Center. You can also change or modify your authentication method at any time. Set up multi-factor authentication In Humane.Center, select your profile  in the bottom right. Scroll to Settings  , select Plan and Billing  . You will see three options: “Phone number,” “Email,” and “Authentication app.” Select  next to the authentication method you’d like to add, then see the instructions that follow for the specific authentication method. You can add more than one method, but you’ll need to set up one before adding another. To add phone authentication When prompted, provide your Humane username and password. Enter the phone number to use for authentication and then select “Submit.” Check your phone for a text message containing a code. Enter the code from that text message into .Center, then select "Submit." If successful, you’ll be redirected to .Center, where you will see “Phone” listed. To add email authentication When prompted, provide your Humane username and password. Enter an email address to use for authentication and then select “Submit.” The email address must be different from the email associated with your Humane Account. Check your email for a message containing a code. Enter the code from that email and select "Submit." If successful, you’ll be redirected to .Center where you will see “Email” listed. To add an authentication app that provides a one-time password (OTP) When prompted, provide your Humane username and password. Select “SMS” or “Email” for the delivery method of your OTP. When you receive your OTP, provide it and select “Submit.” You will see a QR code. Enter the QR code by doing one of the following: Use your authentication app of choice to scan the QR code. Enter the provided code in the OTP code field in .Center. Then provide the device name and select “Submit.” If successful, you’ll be redirected to .Center where you will see “Authentication app” listed. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML conten