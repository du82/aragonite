full_description = '''Ground Control Ground Control Experiences Play music with Ai DJ Your Ai Pin plays music provided by TIDAL. Make sure you first link your TIDAL account in Humane.Center so you can use Ai DJ on your Pin. To play a song Press and hold one finger on the touchpad. Say “Play [song/artist/genre/playlist].” Release your finger from the touchpad. Tip Ask Ai DJ to curate a playlist for you based on how you’re feeling (e.g. “Make a playlist good for a sunny day on the beach.”). Or, ask for a song based on its description (e.g. “Play the Radiohead song that Lianne La Havas covered.") Learn more about the music playing While music is playing, you can ask anything about that song. For example, “What year was this track released” or “Who produced this?” Wait for Ai Mic to respond or raise your hand to see more information using Laser Ink Display. Gestures for playback controls Action Gesture Start or stop music  Double tap one finger Seek forward or backward  Swipe left or right Turn volume up or down  Drag one finger up or down NoteWithin the first ten seconds of a song, swiping backward will play the previous song. After the first ten seconds, swiping backward will rewind to the beginning of the current song. Supported Genres The genre list may change to include more, so feel free to try other words. Alternative rock Classical Country Dance music Electronic Hip-hop Indie Jazz Pop Rap Tips & solutions The music I want to play isn’t found in TIDAL’s catalog. Make a catalog request on TIDAL's Support site here. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('ope