full_description = '''Ground Control Ground Control Setup & Settings Connectivity Turn cellular on or off Using voice To use voice to turn cellular ON or OFF, use the same voice command for turning airplane mode on or off. Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Turn airplane mode on” or “Turn airplane mode off.” Release finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Using Laser Ink Open your hand. You should see the Home UI. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “cellular” and pick it to toggle on  or off. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.queryS