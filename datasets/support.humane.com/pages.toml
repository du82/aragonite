Using touchpad
Drag one finger up or down on the touchpad. You will hear a sound indicating..."""
full_description = '''Ground Control Ground Control Setup & Settings Getting started Adjust volume and system sounds Volume The volume setting controls how loudly music plays, Ai Pin speaks, and the volume of a phone call. Using touchpad Drag one finger up or down on the touchpad. You will hear a sound indicating the volume level. Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Change volume to X%.” Release your finger from the touchpad. The Trust Light will stop flashing and you will hear a chime indicating Ai Mic is no longer listening. Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Pick "volume." Select the minus  or plus  to decrease or increase to the desired level. Adjust Sounds The sounds setting controls the loudness of system sounds, such as the attach/detach chime and camera shutter sound. You can choose from four levels: off, low, medium and high. To adjust sounds volume: Open your hand. You should see the Home UI. Push out your hand a few more inches until you see the menu. Pick settings . Pick sounds. Select the minus  or plus  to decrease or increase to the desired level. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = d