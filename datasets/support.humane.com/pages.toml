["https://support.humane.com/hc/en-us/articles/23461297087373-Learn-to-use-Laser-Ink"]
title = "Learn to use Laser Ink – Ground Control"
description = "Ai Pin turns your hand into a display for menus, experiences, and more. You can use simple gestures to make choices and initiate actions. You can also view previews of image captures, read messages..."
full_description = '''Ground Control Ground Control Setup & Settings Getting started Learn to use Laser Ink Ai Pin turns your hand into a display for menus, experiences, and more. You can use simple gestures to make choices and initiate actions. You can also view previews of image captures, read messages, and review messages before sending them. Using Laser Ink Tap the touchpad to activate Laser Ink. Open your hand. Try positioning your hand 8-12 inches from your Pin and slightly lower from where you’d anticipate the laser to appear. You may need to move your hand up and down to find the right projection spot. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Once you're done using the Laser Ink Display, lower your hand and the display will turn off. To explore what you can do with Laser Ink, see Navigating Laser Ink home & menu. Note You may intermittently see a blinking dot on the right side of the Laser Ink Display. This dot is a way for your Ai Pin to maintain consistent functionality of the Laser Ink interface. If you have difficulty getting the Laser Ink Display to track consistently, clean the sensor glass. Laser Ink Tutorial Ai Pin offers an on demand tutorial to learn the basics of Laser Ink. After Setup Once you've set up your Ai Pin and entered your passcode, you'll be taken to the Home UI. Listed below the clock is the "Laser ink basics" tutorial message. To access the tutorial, tilt your hand down to select the arrow. Once selected, touch your index finger and thumb together to pick the arrow. Laser Ink will scroll to the tutorial message. Once highlighted, touch your index finger and thumb together to pick and begin the tutorial. Ai Pin will begin to display and narrate the tutorial. To cancel tutorial at any time, press and hold one finger on the touchpad and say “cancel tutorial.” Laser Ink Tutorial Using Ai Mic At any time, Ai Pin can provide the Laser Ink tutorial on demand by using Ai Mic. Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say any combination of the following to begin the tutorial start tutorial open tutorial start the laser ink tutorial open the laser ink tutorial start laser ink tutorial open laser ink tutorial Release your finger from the touchpad and raise your hand to display Laser Ink. Ai Pin will begin to display and narrate the tutorial. To cancel tutorial at any time, press and hold one finger on the touchpad and say “cancel tutorial.” Laser Ink not displaying on hand If you're not seeing the Laser Ink Display on your hand right away, try the following steps: Make sure to tap once on the touchpad, then open your hand to turn on the laser. The white scanning Trust Light means your Pin is scanning for your hand. If you see the Trust Light scanning and still don’t see Laser Ink, try moving your hand up or down to find the projection spot. Alternatively, cover your Pin with your hand, then gradually move your hand away from your chest until you see the Laser Ink Display. Try spreading your fingers apart while your Pin is scanning to help it detect your hand. Is Trust Lock on? Press on the touchpad for two seconds to unlock Trust Lock and try again. Gestures There are four gestures for interacting with the Laser Ink Display: Close thumb and index finger to pick Tilt & roll to navigate from one item to another Push + pull to navigate from home to menu Close hand to return to previous display and/or home document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
