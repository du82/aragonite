full_description = '''Ground Control Ground Control Setup & Settings Getting started Forgot your passcode Forgot Ai Pin Passcode As of CosmOS version 1.2, you can factory reset your Ai Pin if you cannot remember your Ai Pin Passcode. Summary: You can factory reset your Ai Pin if you forget the passcode. This allows you to set a new passcode on Humane.Center to unlock your Ai Pin. Instructions/Information: If you cannot remember your Ai Pin passcode Step 1: Try to enter your Ai Pin’s passcode. On the 5th failed attempt to enter a passcode, an option to factory reset your Ai Pin will appear in the Laser Ink Display UI. Select the forgot passcode button. Warning: Factory resetting will result in some of your data being erased permanently: Any pictures/videos not uploaded to .Center All text messages Call logs Saved Wi-Fi networks Any Bluetooth devices will be unpaired and forgotten System settings such as volume levels are reset to default Step 2: Log into .Center and change your passcode. Step 3: When Ai Pin finishes rebooting, hold up your hand to go through the initial set up experience when you first got Ai Pin. You will now be able to use the new passcode you just set up on .Center. FAQs: Ai Pin is still connected to your account and all of your contacts and services are connected and usable just as they were before the factory reset. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElem