description = """
If you have trouble activating Ai Pin out of the box or unlocking Ai Pin to power OFF, we recommend resetting your Ai Pin. 

Do not insert any tool into your Ai Pin – this can cause permanent damag..."""
full_description = '''Ground Control Ground Control Power & Charging Power Reset Ai Pin If you have trouble activating Ai Pin out of the box or unlocking Ai Pin to power OFF, we recommend resetting your Ai Pin. Do not insert any tool into your Ai Pin – this can cause permanent damage to your Pin. Your tool should only be inserted into the Charge Pad. To reset Ai Pin Using Ai Mic Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say "power off." Release your finger from the touchpad. The Trust Light will stop flashing and you will hear a chime indicating Ai Mic is no longer listening. Attach your Ai Pin + Booster together and place them on a Charge Pad. Wait a few minutes until you see the rainbow Trust Light, indicating your Ai Pin is powered ON again and ready for use. Using Charge Pad Ensure that your Charge Pad is plugged into the wall outlet using the Cable and Adapter provided with your Ai Pin. Place your Ai Pin and Battery Booster into the Charge Pad. Depending on Ai Pin's battery charge, a green or amber light will appear on the top of the charge pad to confirm the connection. Insert a paperclip or SIM ejector tool into the small hole next to your Charge Pad's USB plug, and push in. Continue pressing in until you see the light on your Charge Pad turn red. As soon as it turns red, you may let go. Leave your Ai Pin alone on its Charge Pad. After 15-20 seconds, its Trust Light will display a cycle of rainbow colors. At the end of this rainbow cycle, you may see three brief white lights, and you may hear Ai Pin make a faint sound. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordi