["https://support.humane.com/hc/en-us/articles/23291121900173-Connect-to-Wi-Fi"]
title = "Connect to Wi-Fi – Ground Control"
description = "Your Ai Pin is able to perform most tasks on cellular. Connecting to Wi-Fi will improve your Ai Pin's battery life and its performance in low cellular coverage. High resolution image uploads requir..."
full_description = '''Ground Control Ground Control Setup & Settings Connectivity Connect to Wi-Fi Your Ai Pin is able to perform most tasks on cellular. Connecting to Wi-Fi will improve your Ai Pin's battery life and its performance in low cellular coverage. High resolution image uploads require connection to a Wi-Fi network. Before connecting to Wi-Fi, make sure your Ai Pin's Wi-Fi is turned ON by following these steps: Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Turn Wi-Fi on.” Release finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Ai Pin will answer, "Wi-Fi enabled." NoteAi Pin cannot currently connect to Wi-Fi networks that require user interaction through a browser (e.g. accepting terms or creating an account) before connecting. In these circumstances, we recommend connecting through your cellular connection or a mobile hotspot. Options for connecting to Wi-Fi You can connect your Ai Pin to a Wi-Fi network by doing any of the following: Enter Wi-Fi Credentials on your .Center account (recommended) Scan a QR code from you Ai Pin Use voice to enter a password into the Laser Ink Display Entering Wi-Fi information into Humane.Center (recommended) You can chose to enter your Wi-Fi details on your .Center account. When your Ai Pin powers on, it will automatically grab your Wi-Fi details from your account and connect. To do this follow these steps: Go to humane.center. Select your profile  in the bottom right corner Select Settings  Select My Ai Pin  Click the small downward-pointing arrow to the right of "Wi-Fi Networks." Click the "Add" button. Enter your Wi-Fi network's SSID and Password. Note If your network is hidden, you must select the "Hidden" option under "Advanced." You can also change the Wi-Fi encryption type under advanced settings. Using a QR code If you haven’t already, go to humane.center/WiFi to create a QR code for your network. For more information, see our create a QR Code article. Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say "Connect using a QR code." Your Ai Pin's camera will scan the area in front of you for a QR code and connect to that network automatically. TipAi Mic also understands variations on the phrase, such as "Scan with a QR Code" or "Connect to Wi-Fi using QR code." Alternatively, you can have Ai Pin scan for a code using the Laser Ink Display. To do so, follow these steps: Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Turn Wi-Fi on.” Release finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Ai Pin will answer, "Wi-Fi enabled."Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Pick “quick setup.” Pick “scan qr code.” Lower your hand and position the QR code so that Ai Pin can scan it. You should see the Trust Light flashing white and hear a scanning sound to indicate your Ai Pin is scanning for the QR code. You will hear a chime once your Pin has successfully connected to Wi-Fi. Using voice Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “wi-fi” and make sure it’s on. Pick a network. Pick “dictate.” You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say the password. You will see the password as you speak it. When speaking the password, be sure to specify “capital," "uppercase," "lowercase,” and any numbers or symbols. Accidentally entered the wrong password? Use the pick gesture to pause dictation. Pick the backspace button to erase the desired characters, then pick "dictate" again to resume where you left off. Pick “done.” The Trust Light will stop flashing and you will hear a chime indicating Ai Mic is no longer listening. Ai Pin will attempt to connect automatically. If the connection fails, you can try again or pick “quick setup" to use the QR code method. Disconnecting You can disconnect from a particular Wi-Fi network without turning Wi-Fi off completely by using Ai Mic. Simply hold one finger to your touchpad and say "Disconnect from [name of Wi-Fi network]" and your Pin will disconnect. Alternatively, you can disconnect from Laser Ink by using the following steps: Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “wi-fi” and pick it. Locate the Wi-Fi network your Pin is currently connected to and pick it. If you plan to connect to the network again, pick the option "disconnect." If you don't plan to connect to the network again, pick the option "forget this network." document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelect