["https://support.humane.com/hc/en-us/articles/23271335232013-Pair-a-Bluetooth-device"]
title = "Pair a Bluetooth device – Ground Control"
description = """
Ai Pin allows you to connect to any number of Bluetooth accessories, such as headphones, speakers, mobile phones, car audio, and more. We provide several options for connecting to Bluetooth. 
You c..."""
full_description = '''Ground Control Ground Control Setup & Settings Connectivity Pair a Bluetooth device Ai Pin allows you to connect to any number of Bluetooth accessories, such as headphones, speakers, mobile phones, car audio, and more. We provide several options for connecting to Bluetooth. You can pair Ai Pin in the following ways: Using Voice Using Laser Ink As a Discoverable Device Pairing Using Voice Press one finger to your device's touchpad and say, "Turn on Bluetooth." With your Bluetooth device in pairing mode, press one finger to the touchpad and say "Connect to [Bluetooth device name]." Your Ai Pin will say "scanning for Bluetooth devices" and, once successful, state that the device is paired. To disconnect from your Bluetooth device, press one finger to the touchpad and say "Disconnect from [Bluetooth device name]." Ai Pin will confirm disconnection. Pairing Using Laser Ink Follow these steps to turn on Bluetooth and pair to a Bluetooth device using the Laser Ink Display: Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Pick “bluetooth” and make sure it’s on . You’ll see a prompt asking you to select a device to pair. Select the device. Once the device pairs, you’ll see a message that the device is paired. Note:Ai Pin scans for Bluetooth devices for 10 seconds. If your device is not in pairing mode, Bluetooth might time out. In this case, you’ll need to go back to settings  and pick “bluetooth” or toggle Bluetooth off  and on . This will cause Ai Pin to start scanning again. Ai Pin as a Discoverable Bluetooth Device Using the Laser Ink Display, you can pair to your Ai Pin from other Bluetooth enabled systems, such as a Bluetooth car kit. Ensure Ai Pin is discoverable by navigating to the Bluetooth settings using Laser Ink. Pick 'make discoverable.' You'll then see 'discoverable as' and the name of your Ai Pin. Once your Ai Pin is discoverable, locate and select your device from within the Bluetooth Settings of your accessory. If successfully connected, the name of your accessory will be listed in the Bluetooth settings of the Laser Ink UI. If your system requires a code, both the Laser Ink Display and the interface of your accessory will show a unique code prior to pairing. If the code matches, select pair on either device to connect. Once paired, the name of your accessory will be listed in the Bluetooth settings of the Laser Ink UI. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
