["https://support.humane.com/hc/en-us/articles/27858916313997-Charge-Case-Accessory-Recall-Program"]
title = "Charge Case Accessory Recall Program – Ground Control"
description = "Out of an abundance of caution, we are recalling the Charge Case Accessory in coordination with the Consumer Product Safety Commission due to an issue with certain batt..."
full_description = '''Ground Control Ground Control Orders & Shipping Charge Case Accessory Recall Program Out of an abundance of caution, we are recalling the Charge Case Accessory in coordination with the Consumer Product Safety Commission due to an issue with certain battery cells supplied by a vendor for the Charge Case Accessory. The issue identified is isolated only to certain battery cells used in the Charge Case Accessory and is not related to the Charge Case Accessory hardware design. Importantly, Humane’s Ai Pin, its Battery Booster(s) and Charge Pad are not affected as the disqualified vendor does not supply batteries or any other components for those Humane products, and are safe for continued use. Customer safety is our priority at Humane. Upon receiving a single report of a charging issue while using a third-party USB-C cable and third-party power source, we initiated an investigation and identified a quality issue with the battery cell supplied by a third-party vendor used in your Charge Case Accessory. Our investigation determined that the battery supplier was no longer meeting our quality standards and that certain battery cells supplied by this vendor may pose a fire safety risk. As a result, we immediately disqualified this battery vendor while we work to identify a new vendor to avoid such issues and maintain our high quality standards. Again, no other Humane product is affected by this recall. The issue identified is isolated only to certain battery cells used in the Charge Case Accessory and is not related to the Charge Case Accessory hardware design. Humane’s Ai Pin, its Battery Booster(s) and Charge Pad are not affected as the disqualified vendor does not supply batteries or any other components for those Humane products, and are safe for continued use. Eligibility All customers of the Charge Case Accessory are eligible to participate in the recall. Customers will have the option to receive a replacement Charge Case Accessory or a refund. Upon confirmation of the customer’s preferred remedy, Humane will either send the customer a replacement Charge Case Accessory once they become available or issue a refund to the payment method linked to the customer’s Humane account. Simply click the link below to make your selection. LINK TO FORM Disposal Your Charge Case Accessory should be disposed of in accordance with any local and state ordinances, following the procedures established by your municipal recycling center for damaged/defective/recalled lithium batteries. Do not throw your Charge Case Accessory in the trash. Do not deposit your Charge Case Accessory in used battery recycling boxes found at various retail and home improvement stores. Terms of Recall By participating in the recall, you are confirming that you qualify for the recall and that you will dispose of your Charge Case Accessory in accordance with any local and state ordinances. FAQs Why are you recalling the Charge Case Accessory? Out of an abundance of caution, we are recalling all Charge Case Accessory units. Upon receiving a single report of a charging issue while using a third-party USB-C cable and third-party power source, we initiated an investigation and identified a quality issue with the battery cell supplied by a third-party vendor used in your Charge Case Accessory. Our investigation determined that the battery supplier was no longer meeting our quality standards and that certain battery cells supplied by this vendor may pose a fire safety risk. As a result, we immediately disqualified this battery vendor while we work to identify a new vendor to avoid such issues and maintain our high quality standards. While we know this may cause an inconvenience to you, we felt strongly this was the right thing to do. Customer safety is our priority at Humane. Are you recalling other products? No. No other Humane product is affected by this recall. The issue identified is isolated only to certain battery cells used in the Charge Case Accessory and is not related to the Charge Case Accessory hardware design. Humane’s Ai Pin, its Battery Booster(s) and Charge Pad are not affected as the disqualified vendor does not supply batteries or any other components for those Humane products, and are safe for continued use. How do I know if my Charge Case Accessory is recalled? All Charge Case Accessory units are subject to recall. I bought the Ai Pin Complete System. Do I need to return or dispose of everything? No. You only need to dispose of your Charge Case Accessory in accordance with local and state ordinances to receive a replacement or refund. My Charge Case Accessory seems fine. Do I need to participate in the recall? We are glad you have not had any issues with the Charge Case Accessory. However, we are asking all customers to immediately stop using the Charge Case Accessory and participate in the recall. How much will my refund be? Customers that purchased the Ai Pin Complete System for $699 or $799 respectively and request a refund will receive a $129 refund. Customers that purchased the Charge Case Accessory separately will receive a $149 refund. Simply click the link below to request your refund. LINK TO FORM How long will it take to receive my refund? We will initiate your refund within 10-14 business days of your selection of a refund as your preferred remedy. How long will it take to receive a replacement? Upon selecting your preferred remedy through the link below, Humane will send a replacement Charge Case Accessory once they become available in approximately 3 to 6 months. LINK TO FORM I received my Charge Case Accessory as part of a gift. Am I also eligible for the recall? Yes. No matter how you received the Charge Case Accessory, we encourage you to participate in the recall. What if I sold or gifted the Charge Case Accessory to someone else? If you sold or gifted the Charge Case Accessory to someone, we would appreciate it if you could notify the recipient of the recall and request they stop using the Charge Case Accessory immediately. They have the option to either receive a refund or a replacement through the recall. If you have any questions, please contact recall@humane.com. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragra