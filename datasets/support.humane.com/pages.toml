full_description = '''Ground Control Ground Control Setup & Settings Enable international roaming To use your Ai Pin outside of the U.S., purchase the International Roaming Pass and select how long you intend to be roaming abroad (1, 10, or 30 days). Once activated, you will have unlimited talk, text, and data for the duration of your pass. For more details on international roaming and other available passes, see Humane Plan. To learn more about using your Pin abroad, see Traveling internationally with Ai Pin. To enable international roaming Log in to Humane.Center. Select your profile  in the bottom right. Select "Settings", then "Plan & Billing." Scroll to Premium add-ons and find "International roaming." Select "Add." Select the desired package duration (1 day, 10 days, or 30 days) and the start date. You can choose today's date, or any date in the future. Select "Add to subscription." See the add-on under the Premium add-on section. If the start date is in the future, the add-on will appear as "Upcoming;" if purchased for today, will appear as "Active." document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () 