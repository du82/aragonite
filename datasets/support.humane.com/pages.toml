full_description = '''Ground Control Ground Control Humane.Center Media & data View and manage photos & videos View photos & videos Log in to Humane.Center and navigate to the Captures tab at the top of your screen. Select the thumbnail of the photo or video you want to view. In the top right corner there are buttons for various actions: download, delete, and view information. Upload to Humane.Center By default, if Ai Pin is connected to LTE wireless, low resolution versions of your photos will be marked with  and appear in .Center. Videos will appear as thumbnail images until uploaded. Full resolution photos and videos upload to .Center when all of the following conditions are met: Ai Pin connected to Wi-Fi Ai Pin + Booster placed on the Charge Pad Ai Pin + Booster have a combined power level of 50% or greater If Ai Pin has been powered off, you've unlocked it at least once since powering on Forced upload To upload to .Center immediately after taking a photo or video, select Upload in the Laser Ink Display immediately after capturing the photo or video. This option is available only on a per-photo/video basis. Tips & solutions My photos/videos aren't uploading to .Center. If you don’t see full resolution photos or videos in .Center, make sure all of the following are true: If Ai Pin has been powered off, you've unlocked it at least once since powering on. Once your Ai Pin has enough charge to unlock it, take it off the Charge Pad, unlock it, then place it back on the Charge Pad. Ai Pin is connected to a Wi-Fi network (not a mobile hotspot or metered network). Ai Pin + Battery Booster are on the Charge Pad. Ai Pin + Battery Booster have a combined power level of 50% or greater. (You can verify by asking “What’s my battery level?”) If Ai Pin has one bar of LTE signal, photos are not uploaded. They are saved and will upload when next connected to LTE at greater than two bars or when connected to Wi-Fi. document.addEventListener('DOMContentLoaded', () => { document.qu