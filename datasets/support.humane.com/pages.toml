full_description = '''Ground Control Ground Control Experiences Translation Use Ai Pin Interpreter to Translate By default, Ai Pin translates between English and a language that you set. Before setting a language, we recommend reviewing our Supported languages to make sure the desired language is listed. If you want your translated responses to be in your own voice, see Use Personal Voice to translate. Set the Translated Language Press and hold one finger on the touchpad. Say “Set language to [desired language].” Alternatively, you can say something like “Translate in [desired language].” Release your finger from the touchpad. Ai Pin will confirm “Language set to [language].” Note: If you set the language to one that is not supported, Ai Pin will not translate as expected. Translate from English to the Translated Language Press and hold two fingers on the touchpad. Say whatever you would like to have translated. Release fingers from the touchpad. Ai Pin repeats what you said in the translated language. Translate from the Translated Language to English You can use the same translation gesture if someone else is speaking the translated language and you would like it translated to English. Press and hold two fingers on the touchpad while the other person is speaking in their language. Release finger from the touchpad. Ai Pin translates what the other person says into English. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-