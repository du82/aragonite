full_description = '''Ground Control Ground Control Setup & Settings Privacy Ai Pin lock and unlock behavior Your Ai Pin locks after any of the following: Ai Pin is detached from a Battery Booster (or any surface to which it's magnetically connected) Ai Pin starts up after a software update Ai Pin is restarted Ai Pin powers on from a completely powered-off state In addition to the above, if you would like to disable your passcode entirely, or set your Pin to unlock after a period of inactivity, see Manage passcode settings. When your device's passcode is turned off, it will never lock. When Ai Pin is locked When Ai Pin starts up after having been powered off, all activity is blocked until you enter the passcode. However, when your Pin is locked because of a period of inactivity or detaching it from the Booster, Latch, or Clip, you’re still able to: Accept or end a call Issue voice requests that don’t require access to personal data Receive service notifications Receive notifications from Trusted Contacts Take a photo Translate between languages Disable Trust Lock Adjust the volume Pause or skip music forward/backward that is already playing To do anything else, your Ai Pin will need to be unlocked. See Unlock Ai Pin for instructions on unlocking. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textCont