full_description = '''Ground Control Ground Control Setup & Settings Connectivity Turn airplane mode on or off Enable airplane mode to turn off the cellular capabilities of your Ai Pin while flying. If your airline permits it, you may enable Bluetooth and Wi-Fi while in airplane mode. Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Turn airplane mode on” or “Turn airplane mode off.” Release finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Ai Pin will respond, "Airplane mode on," or "Airplane mode off." Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “airplane mode” and pick it to toggle on  or off . To turn on, confirm your selection by picking "turn on ." document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') c