full_description = '''Ground Control Ground Control Orders & Shipping Gifting Ai Pin Corporate gifts or bulk orders If you’re looking to purchase corporate gifts or bulk orders, submit your request here and our sales team will follow up directly. If you ordered Ai Pin on someone's behalf If you purchased Ai Pin to gift to someone, you can begin the gifting process once you receive your onboarding email for that device. When invited to onboard, you can select the gifting option from the onboarding email or from Humane.Center. To gift your Ai Pin from your onboarding email: Open the email titled "Last steps before we can ship your Ai Pin." At the bottom of the email, click the link "If this Ai Pin is for someone else, click here." Enter the recipient's email and confirm the proper shipping address. To change the shipping address associated with the gifted order, contact Support. Click Submit. A confirmation screen appears confirming an invite has been sent to the giftee's email address. To gift your Ai Pin from Humane.Center: You can only gift your Ai Pin once invited to onboard via email (described above). Log in to Humane.Center. Select your profile  in the bottom right. Select Settings  then select Orders  If your Ai Pin is ready for onboarding, your orders page will look something like this: Select "Gift it." Enter the recipient's email and confirm the proper shipping address. To change the shipping address associated with the gifted order, contact Support. Click Submit. A confirmation screen appears confirming an invite has been sent to the giftee's email address. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('