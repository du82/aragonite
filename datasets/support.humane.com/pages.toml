When you turn ON Trust Lock, Ai Pin disables the Time-of-Flig..."""
full_description = '''Ground Control Ground Control Setup & Settings Privacy Enable and disable Trust Lock Trust Lock helps you to protect and respect those around you by allowing you to control when your Ai Pin camera and microphone are on. When you turn ON Trust Lock, Ai Pin disables the Time-of-Flight camera, Ai Mic, and Laser Ink Display. Touchpad functions will be mostly disabled, with the exception of long-pressing to disable Trust Lock. Enable Trust Lock with Ai Mic Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Turn on Trust Lock.” Ai Pin will confirm by saying "Trust Lock enabled." Enable Trust Lock with Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Pick “trust lock.” Select “turn on.” NoteIf you enable Trust Lock while listening to music, you will be unable to pause the music until you disable Trust Lock again. To disable Trust Lock Press one finger on the touchpad for two seconds. You can raise your finger when a sound chimes, indicating Trust Lock has been disabled successfully. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
