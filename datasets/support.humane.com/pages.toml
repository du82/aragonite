Wear your Ai Pin with your Booster. You’ll get more hours of power than wearing your Pin with the Latch or Clip. 
When possible, use voice c..."""
full_description = '''Ground Control Ground Control Power & Charging Optimize Ai Pin + Booster battery life To get the most out of your Ai Pin and Battery Booster: Wear your Ai Pin with your Booster. You’ll get more hours of power than wearing your Pin with the Latch or Clip. When possible, use voice commands rather than the Laser Ink Display. When not wearing your Pin, place it on the Charge Pad. It’s not designed to wear to bed. As you recharge, so will your Pin. Keep a spare Booster charging on your Charge Pad. If your Pin's power level gets low, you can swap in your spare Booster. Connect to Wi-Fi whenever possible (Wi-Fi uses less energy than cellular). Battery performance is optimal at room temperatures. Cold ambient temperatures can cause lower performance and reduced battery life. For additional tips, navigate to the Power settings using the Laser Ink Display and select "tips." document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header