_id !== null ? 'sub-sections' : 'sections'); const sectElem = document.createElement('div'); sectElem.className = 'section'; sectElem.setAttribute('id', `sect-${section.id}`); sectElem.innerHTML = `<a class='section-link' href='javascript:void(0)'>${section.name}${svgIcon}</a><div class='articles'></div>`; buildNestedSections(section.id, sectElem, sectsData); sectWrapper.appendChild(sectElem); parentElement.appendChild(sectWrapper); // Load articles for the current section const articlesRequest = new XMLHttpRequest(); articlesRequest.open('GET', `/api/v2/help_center/en-us/sections/${section.id}/articles.json`, true); articlesRequest.onload = function () { if (this.status >= 200 && this.status < 400) { const articlesData = JSON.parse(this.response); const articlesList = sectElem.querySelector('.articles'); // Check if articlesList exists before attempting to manipulate it if (articlesList) { // Clear existing content articlesList.innerHTML = ''; articlesData.articles.forEach((article) => { const articleLink = document.createElement('a'); articleLink.className = 'article-link'; articleLink.setAttribute('id', `article-${article.id}`); articleLink.href = `${article.html_url}`; articleLink.textContent = article.title; // Append article link to articlesList articlesList.appendChild(articleLink); // Click event for showing/hiding articles articleLink.addEventListener('click', (event) => { event.stopPropagation(); // Stop the event from propagating to parent elements toggleVisibility(articleLink); }); }); } } else { console.error('Error loading articles:', this.status, this.statusText); } }; articlesRequest.send(); } }); }; // Function to load and build categories const loadCategories = async () => { try { const data = await fetchData('/api/v2/help_center/en-us/categories.json'); const catsList = document.querySelector('.sidebar-feed nav'); // Array to store promises for each category const categoryPromises = data.categories.map(async (category) => { const catElem = documen