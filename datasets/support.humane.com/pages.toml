title = "Update Ai Pin to the latest software – Ground Control"
description = """
CosmOS Release & Change Log
How it works
Your Ai Pin automatically updates with the latest software as long as the following conditions are met:

Ai Pin + Booster placed on the Charge Pad.
If A..."""
full_description = '''Ground Control Ground Control Setup & Settings Getting started Update Ai Pin to the latest software CosmOS Release & Change Log How it works Your Ai Pin automatically updates with the latest software as long as the following conditions are met: Ai Pin + Booster placed on the Charge Pad. If Ai Pin has been powered off, you've unlocked it at least once since powering on. Ai Pin and Battery Booster power levels are 80% or higher. (Tap the Charge Pad while Pin + Booster is on it. You will see a green light if power is 80% or higher.) We recommend charging your Pin + Booster on the Charge Pad overnight to automatically receive software updates and avoid any interruptions during the process. Check for software updates You can check for software updates with any of the following methods: From the Home UI when available Manually through Laser Ink settings Manually through Ai Mic prompt From the Home UI If there is an available over-the-air (OTA) software update, a message reading "update available" will appear under the clock on the Home UI. Tilt your hand down to select the arrow. Once selected, touch your index finger and thumb together to pick the arrow. Laser Ink will scroll to the "update available" message. Once highlighted, touch your index finger and thumb together to pick. Ai Pin will provide instructions on completing the update. If you don’t see "update available," you can also manually check for updates by using Ai Mic or from the Settings menu. Using Ai Mic Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Is there a software update available?" or similar phrasing. Release your finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Ai Pin will answer with the software update availability. From the Settings menu Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll and pick "about." See "check for updates.” Ai Pin will check for available updates and if available, provide instructions on completing the update Check software version Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “What's my software version," or something similar. Release finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Ai Pin will answer with the current version. 💡 Note:Verbally asking Ai Mic its software version was introduced in CosmOS version 1.1.4. If Ai Pin is unable to answer this query, your device may be on an earlier version. If this is the case, you can check the version number using Laser Ink by following the steps below. Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll and pick "about." See "version." document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.