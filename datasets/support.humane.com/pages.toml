title = "Unlock Ai Pin – Ground Control"
description = """
Tap the touchpad with one finger to indicate you’d like to activate Laser Ink.
Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand.
Once ..."""
full_description = '''Ground Control Ground Control Setup & Settings Privacy Unlock Ai Pin Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Use the push + pull gesture to scroll through the stack of numbers 0-9. When you land on the correct number, use your index finger and thumb to pick the number. If you select an incorrect number Delete your entry by scrolling to the end of the stack and picking the backspace button. Alternatively, you can drop and raise your hand to restart passcode entry. Repeat the process until you have entered all 4 digits of your passcode. If you select an incorrect number, you can delete it by scrolling to the end of the stack and picking the backspace button. Alternatively, you can drop and raise your hand to restart passcode entry. Note: After 5 failed attempts, there is a one-hour timeout before you can try again. If you've forgotten your passcode, follow the instructions below. Forgot Ai Pin Passcode As of CosmOS version 1.2, you can factory reset your Ai Pin if you cannot remember your Ai Pin Passcode Summary: You can factory reset your Ai Pin if you forget the passcode. This allows you to set a new passcode on Humane.Center to unlock your Ai Pin. Instructions/Information: If you cannot remember your Ai Pin passcode Step 1: Try to enter your Ai Pin’s passcode. On the 5th failed attempt entering your passcode, an option to factory reset your Ai Pin appears in the Laser Ink Display. Select "forgot passcode". Warning: Factory resetting results in some of your data being cleared: Any pictures/videos not uploaded to Humane.Center All text messages Call logs Wi-Fi passcode is reset and all Wi-Fi networks forgotten Any Bluetooth devices are unpaired and forgotten System settings such as volume levels are reset to default Step 2: Log into Humane.Center and change your passcode Step 3: When Ai Pin reboots, hold up your hand to go through the initial set up experience. You will now be able to use the new passcode you just set up on .Center FAQ: Will I have to reconnect my services and contacts? Ai Pin is still connected to your account and all of your contacts and services are connected and usable just as they were before the factory reset. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
