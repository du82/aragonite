["https://support.humane.com/hc/en-us/articles/24119847752333-Manage-your-Humane-Plan"]
title = "Manage your Humane Plan – Ground Control"
description = "We understand—sometimes, you need to make changes. Whether your credit card has expired and needs to be replaced, or you've moved and need to update your address in our system, this article will sh..."
full_description = '''Ground Control Ground Control Account & Subscription Manage subscription Manage your Humane Plan We understand—sometimes, you need to make changes. Whether your credit card has expired and needs to be replaced, or you've moved and need to update your address in our system, this article will show you how to update your info so you can enjoy the benefits of your Humane Plan uninterrupted! See the Humane Plan for more information on what is included in your Plan. Update payment information To ensure uninterrupted service, make sure your payment information is up to date. 1: Update Billing Address Log in to Humane.Center. Select your profile  in the bottom right. Select Settings  then select Plan & Billing  On the Plan & Billing section of your .Center profile, confirm your Billing Address. If your billing address has changed since you last used the Humane Plan, or is otherwise incorrect, you can click the blue "Update" button to the right to set a new address. Please note that your billing address must meet the following requirements when entering your payment method for the Humane Plan: Must be located within the United States Must not be located in a U.S. Territory Must not be a P.O. Box or Military Base 2: Update Credit Card Next, locate the line item reading "Payment Method" and select the blue "Update" button on the right. 1. You'll be taken to our Payment Processing service, Stripe. On the right side of this screen, if you have a credit card already entered here, click the gray "x" to remove it.2. Now click the button reading "Add payment method."3. Enter the a valid credit card number, expiration date, security code, country and billing ZIP code.4. Click the blue "Add" button at the bottom.5. Click the link on the left side of the screen reading "Return to Humane Inc." Cancel your plan You can cancel your plan at any time. When you cancel your Plan, it will remain active until the end of the current billing cycle. When your plan ends, Ai Pin will become inoperable. You can continue to access the data in .Center after your plan ends. You can reactivate your plan, but if you do not reactivate it within 60 days, your phone number will be rescinded. You would then need to purchase a new plan. To cancel your plan Log in to .Center. Select your profile  in the bottom right. Select Settings  then select Plan & Billing  Under “Status,” you’ll see the option to cancel your subscription. Reactivate your Humane Account If your Humane Plan is interrupted for any reason and you need help reactivating it, please refer to this article: Humane Plan Subscription is not Active. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sib