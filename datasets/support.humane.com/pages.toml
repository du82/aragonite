["https://support.humane.com/hc/en-us/articles/25769862591245-Using-Vision-Beta"]
title = "Using Vision (Beta) – Ground Control"
description = "Vision (Beta) uses Ai Pin's camera to scan and analyze objects and scenes in front of you, all in real-time and is enabled by default, but can easily be toggled on and off in Humane.Center as descr..."
full_description = '''Ground Control Ground Control Experiences Using Vision (Beta) Vision (Beta) uses Ai Pin's camera to scan and analyze objects and scenes in front of you, all in real-time and is enabled by default, but can easily be toggled on and off in Humane.Center as described below. Use Vision Use one finger to tap twice on the touchpad, holding your finger down on the second tap. Describe what you would like Vision to do. Release your finger from the touchpad. The Trust Light flashes white and a series of chimes sound while the image is being captured. Once the image is captured, listen to Ai Mic's response. Alternatively, any Ai Mic request beginning with "Look" will also invoke Vision. For example, "Look at this book and tell me what it's about." Examples "Translate this sign to English." "How much protein is in this?" "What style of painting is this?" NoteSome phrases may activate Vision without the use of the word "Look," for instance: "Tell me about the object in my hand." Ideas on how to use Vision Language Learning: Instantly translate text in images to aid language comprehension. Education: Identify landmarks, plants, and scientific specimens for learning. Shopping: Compare prices and find products online by scanning what you find in store. Travel: Recognize signs, landmarks, and local businesses for easier navigation. Accessibility: Help visually impaired individuals understand their surroundings. Home Improvement: Find furniture or decor ideas and learn where to purchase. Cooking: Identify ingredients and find relevant recipes. Nature: Identify flora and fauna spotted in nature. Art Exploration: Access information on art and artifacts you discover in museums or galleries. Automotive Maintenance: Identify car parts and get maintenance advice. Fashion: Identify clothing or accessories. Disable Vision Vision is now automatically enabled. If you wish to disable (and re-enable) Vision, update the setting in Humane.Center. Log in to Humane.Center Select your profile  in the bottom right corner Select Settings  Select My Ai Pin  Switch the "Vision (Beta)" toggle to OFF With Vision OFF, you will not be able to ask Ai Pin to identify what you are seeing, but you will be able to use all other Pin features. Use the same toggle to switch Vision back ON at any time.Our privacy policy has also been updated. You can review and see more details on our website. If you have any questions, comments, or feedback about Vision or our updated privacy policy please contact Customer Support. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
