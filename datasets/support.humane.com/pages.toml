Select your profile  in the bottom ri..."""
full_description = '''Ground Control Ground Control Setup & Settings Connectivity Where is my Ai Pin - Pinpoint You can located where your Ai Pin is located via the Pinpoint functionality within Humane.Center. To enable Pinpoint: Log into your account on Humane.Center Select your profile  in the bottom right corner Select Settings  Select My Ai Pin  Scroll down to "Locate My Ai Pin" and click Details Toggle Pinpoint Location Tracking to ON and close the dialog by clicking  in the corner. Now when you click on Details, a popup with map will appear with the last known location of your Ai Pin. Tips & Solutions - Wi-Fi must be enabled in order for Pinpoint to function. - Ai Pin does not need to be connected to a Wi-Fi Network, but the Wi-Fi must be ON. - Ai Pin gets location from seeing what Wi-Fi networks it can "see" to geolocate. FAQ What if I do not use Wi-Fi to connect? That is fine, just make sure the Wi-Fi function is ON in the settings. What is the frequency of refresh for Pinpoint? There is no set update time as this reduces battery life. The location is updated when Ai Pin is awake and interacted with, and there are at least two Wi-Fi networks nearby. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nt