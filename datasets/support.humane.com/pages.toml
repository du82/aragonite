title = "Use Personal Voice for translation – Ground Control"
description = """
With Ai Pin as your interpreter, you can now set up your Personal Voice to speak another language, all in your own voice!
For information on how to use Interpreter, see Use Ai Pin to translate. 
Cr..."""
full_description = '''Ground Control Ground Control Experiences Use Personal Voice for translation With Ai Pin as your interpreter, you can now set up your Personal Voice to speak another language, all in your own voice! For information on how to use Interpreter, see Use Ai Pin to translate. Create your Personal Voice Log in to Humane.Center. Select your profile  in the bottom right. Select Settings  then choose My Ai Pin  Find the "Personal Voice" option and select Get Started. Follow the prompts to set up your Personal Voice. Once your Personal Voice is created, Ai Pin will automatically use your Personal Voice for translating from English to another language. If you are translating from another language to English, the response will use the default voice. See Supported languages for translation for a full list of Ai Pin's supported languages. Translate using Personal Voice Make sure your Ai Pin uses a passcode and is unlocked. Press and hold two fingers on the touchpad. Say whatever you would like to have translated. Release fingers from the touchpad. Ai Pin will repeat what you said in the translated language. Tips & Solutions Ai Pin isn't using my Personal Voice Personal Voice works if you use the 2 finger gesture to invoke it. If you use 1 finger and say "Translate <phrase>" it will always be in the default voice. Confirm your Ai Pin uses a passcode and is unlocked. This protects your voice from being used if someone obtains your Pin. If you don't have a passcode set up and/or your Pin is locked, any translation task will use the default voice. If you don’t want to always unlock your device to use your personal voice during translation, you can enable the toggle below to allow personal voice to authenticate when your device remains locked. If you are translating from another language to English, the response will use the default voice. When the voice cloning technology cannot ensure a high quality Personal Voice, the system will fall back to using the default voice. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
