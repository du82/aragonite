First and foremost, thank you for being an early adopter of Ai Pin. Your support, feedback, and enthusiasm have been instrumental in shaping this technology, and we are truly..."""
full_description = '''Ground Control Ground Control Orders & Shipping Important Update for Consumer Ai Pin Customers Dear Ai Pin Customers, First and foremost, thank you for being an early adopter of Ai Pin. Your support, feedback, and enthusiasm have been instrumental in shaping this technology, and we are truly grateful to have had you on this journey with us. We are writing to inform you that, effective immediately, we are winding down the consumer Ai Pin as our business priorities have shifted. What This Means for You: End of Consumer Availability: Effective immediately, new purchases of the consumer Ai Pin will be discontinued. Device Timeline: Your Ai Pin will continue to function normally until 12pm PST on February 28, 2025. After this date, it will no longer connect to Humane’s servers, and .Center access will be fully retired. Device Features: Your Ai Pin features will no longer include calling, messaging, Ai queries/responses, or cloud access. Data Access: We strongly encourage you to sync your Ai Pin over Wi-Fi and download any stored pictures, videos, and notes from .Center before February 28, 2025. If you do not do this, your data will be lost upon deletion on February 28, 2025 at 12pm PST. Data Deletion: On February 28, 2025 at 12pm PST all remaining consumer data will be permanently deleted. We understand this transition may be difficult, and you may have questions. For more details on managing your data and next steps, please refer to our FAQ. Our support team is here to help at support@humane.com through February 28th, 2025. Once again, thank you for being an early supporter of Ai Pin. Your engagement has meant the world to us, and we deeply appreciate the role you’ve played in our innovation journey. Warmly, The Humane Team document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); //