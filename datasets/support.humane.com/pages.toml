title = "Wearing Ai Pin with a Clip or Latch – Ground Control"
description = """
Clip
The Clip is designed for use on thicker or rigid apparel such as jackets, handbags, or backpacks, but can also work on lighter clothing. The Clip rotates 360 degrees to allow you to position y..."""
full_description = '''Ground Control Ground Control Setup & Settings Wearing Ai Pin with a Clip or Latch Clip The Clip is designed for use on thicker or rigid apparel such as jackets, handbags, or backpacks, but can also work on lighter clothing. The Clip rotates 360 degrees to allow you to position your Ai Pin precisely. To remove your Ai Pin from the Clip, simply slide it off. The Clip does not charge Ai Pin. If your Pin is running low on power, connect it to a charged Booster or to a Booster connected to the Charge Pad. To attach the Clip Place the Clip on the back of your Ai Pin. It snaps on magnetically. Attach your Ai Pin + Clip onto your apparel item. Position your Ai Pin by rotating Ai Pin + Clip to a good position. Note: If you power off Ai Pin while it’s attached to the Clip or Latch, you’ll need to connect to the Battery Booster before turning ON Ai Pin. Latch The Latch magnetically attaches your Ai Pin to clothing. Use it when you don’t want the thickness or weight of the Battery Booster. The Latch can attach to blouses, shirts, athletic wear, light jackets, and similar items. For thicker clothing, use the Clip. The Latch does not charge Ai Pin. If your Pin is running low on power, connect it to a charged Booster or to a Booster connected to the Charge Pad. To attach the Latch Slip the Latch under your clothing in the same place where you’d typically wear your Booster. Place your Pin in front of the Latch until the two magnetically connect. You will hear a sound to indicate the two have attached. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); });