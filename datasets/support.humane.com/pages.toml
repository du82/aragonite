full_description = '''Ground Control Ground Control Orders & Shipping Warranty policy At Humane, we're committed to providing you with top-quality products, which is why we offer a warranty on Ai Pin and certain accessories. Ai Pin, Battery Booster, Charge Pad, and Adapter are all under a one year warranty period. The Cable, Latch, Clip, and Shield are under a 30 day warranty period. Our warranty covers defects in materials and workmanship for the Ai Pin and certain accessories purchased in the U.S; it excludes issues caused by misuse, unauthorized modifications, or purchases from non-authorized sellers. Claims require proof of purchase and may result in repair, replacement, or refund at Humane’s discretion. For more details see the Humane Warranty Policy. To submit a claim, contact Support. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('op