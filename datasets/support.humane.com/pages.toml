["https://support.humane.com/hc/en-us/articles/34243204841997"]
title = "Ai Pin Consumers FAQ – Ground Control"
description = "Effective immediately, we are beginning the process of winding down the consumer Ai Pin. To help guide you through this transition, we have compiled answers to common questions about what this mean..."
full_description = '''Ground Control Ground Control Account & Subscription Manage subscription Ai Pin Consumers FAQ Effective immediately, we are beginning the process of winding down the consumer Ai Pin. To help guide you through this transition, we have compiled answers to common questions about what this means for you, including key dates, refunds, data access, and next steps. Key Dates to Remember: Effective immediately: Ai Pin is no longer available for new purchases. February 28, 2025 at 12pm PST: Ai Pin devices will no longer connect to Humane’s servers, and .Center access will be fully retired. February 28, 2025 at 12pm PST: All customer data, including personal identifiable information (PII), will be permanently deleted from Humane’s servers. We recognize that this may be an unexpected change, and we are here to support you. Please review the FAQs below for details on how to download your data, manage your subscription, and recycle your device. General Questions 1. Why is Humane discontinuing the Ai Pin? We are winding down the Ai pin as we are moving onto new endeavors. We will share more in the future. Thank you for your support throughout this journey. 2. When will the Ai Pin stop working? Your Ai Pin will continue functioning normally until February 28, 2025, at 12:00pm PST. After this time, it will no longer connect to Humane’s servers, and .Center access will be fully retired. 3. What will happen to the Charge Case recall? Due to the Ai Pin service shutdown, we will no longer be providing the replacement Charge Case as originally planned. If you previously chose to wait for a replacement instead of receiving a refund, you will automatically receive a refund for the portion of your original purchase price that was allocated to the Charge Case after February 28, 2025. Orders & Refunds 1. I placed an order but haven’t completed onboarding. What happens now? If you have not completed onboarding, your order will be automatically canceled, and you will receive a full refund. 2. Will I receive a refund for my Ai Pin? Refunds are only available for customers who are still within the 90-day return window from their original shipment date. You are eligible to receive a refund if your product shipped on or after November 15th, 2024. All device shipments prior to November 15th, 2024 are not eligible for refunds. All refunds must be submitted by February 27th, 2025. Functionality & Service 1. Will my Ai Pin work with another cellular provider after the shutdown? No. Once the service is discontinued, your Ai Pin will no longer function as a cellular device or connect to Humane’s servers. This means no calls, texts, or data usage will be possible. 2. Can I port my phone number to another device or another wireless carrier? No. AI Pin’s service does not include a traditional mobile number that can be ported to another device or carrier. After service termination, Ai Pin will no longer support cellular connectivity. 3. Can I still use my Ai Pin for offline features? Yes. After February 28, 2025, Ai Pin will still allow for offline features like battery level, etc., but will not include any function that requires cloud connectivity like voice interactions, AI responses, and .Center access. Data & Account Management 1. How can I download my data before the shutdown? To ensure you retain your data before the shutdown, follow these steps: Sync AI Pin with .Center: Connect your AI Pin to Wi-Fi. Open .Center on your desktop or mobile device. Ensure your AI Pin has fully synced with .Center (check for any pending uploads). Download Your Data: Log into .Center. Navigate to your stored photos, videos, and notes. Select the files you wish to keep and download them to your device. Complete by February 28, 2025 at 12pm PST: After this date, all stored data will no longer be accessible, and will be deleted by Humane on February 28, 2025 at 12pm PST. 2. How can I delete my data before the shutdown? To ensure you delete your data before the shutdown, follow these steps: Sync AI Pin with .Center: Connect your AI Pin to Wi-Fi. Open .Center on your desktop or mobile device. Ensure your AI Pin has fully synced with .Center (check for any pending uploads). Delete Your Data: Log into .Center. Navigate to your stored photos, videos, and notes. Delete your stored photos, videos, and notes. Complete by February 28, 2025 at 12pm PST: After this date, all stored data will no longer be accessible, and will be deleted by Humane on February 28, 2025 after 12pm PST. 3. What happens to my data after the shutdown? On February 28, 2025 at 12pm PST, all remaining customer data, including personal identifiable information (PII), stored on Humane’s servers will be permanently deleted. There will be no way to recover your data after this date. 4. What happens to my Humane subscription? Will I be charged after Ai Pin shuts down? Your Humane subscription will be automatically canceled, and no further charges will be made after February 28, 2025. If you have prepaid for any months beyond this date, we will process a prorated refund. 5. Is there anything I need to do to disconnect third-party services integrated with my Ai Pin? No. When Ai Pin service shuts down, any third-party integrations (e.g., music streaming, messaging, or calendar services) will automatically be disconnected. You may want to cancel any paid subscription to music streaming services if you only use them on Ai Pin. Support & Next Steps 1. Will Humane offer any trade-in or replacement program for Ai Pin owners? We do not have a trade-in or replacement program. 2. Will Humane be offering support for Ai Pin after the shutdown date? After February 28, 2025, customer support for Ai Pin will no longer be available. 3. Can I transfer my Ai Pin subscription to another device? No. Since the consumer-facing Ai Pin service is being discontinued, there are no alternative devices to transfer your subscription to. 4. What will happen to Humane’s support channels and .Center after the shutdown? After February 28, 2025 at 12pm PST, .Center will no longer be accessible, and Humane’s Consumer Support will transition accordingly. More details will be provided closer to the shutdown date. Device Recycling 1. What should I do with my Ai Pin once it stops working? We encourage you to recycle your Ai Pin through an e-waste recycling program. Many electronics retailers and local recycling centers accept wearable devices. Learn more. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
