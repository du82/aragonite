["https://support.humane.com/hc/en-us/articles/22855012397325-Charge-Ai-Pin-Booster"]
title = "Charge Ai Pin + Booster – Ground Control"
description = """
When charging, use the Cable and Adapter provided with your Ai Pin.

Ai Pin has a built-in battery and also comes with a standalone battery, the Battery Booster. When Ai Pin and Battery Booster are..."""
full_description = '''Ground Control Ground Control Power & Charging Power Charge Ai Pin + Booster When charging, use the Cable and Adapter provided with your Ai Pin. Ai Pin has a built-in battery and also comes with a standalone battery, the Battery Booster. When Ai Pin and Battery Booster are connected, the Battery Booster charges Ai Pin’s built-in battery to increase the amount of time you can use it. Your Pin also comes with a Charge Pad. You can either charge your Booster on the Charge Pad on its own, or together with your Pin. Ai Pin cannot be charged by itself on the Charge Pad. Using the Charge Pad Place the Charge Pad on a flat surface and close enough to a wall outlet so that you can easily plug in the Adapter. Connect the USB-C Cable to the Charge Pad and the Adapter. Plug the Adapter into a wall outlet. Connect your Ai Pin + Booster together and place them on the Charge Pad. You’ll hear a sound to indicate they've connected. Once connected, a light at the top of the Charge Pad will turn on. If the light is green, that indicates the combined battery percentage of your Ai Pin + Booster is at least 80%. If the light is amber, that indicates the combined battery percentage of your Ai Pin + Booster is below 80%. Signal Strength When your Ai Pin has low network signal strength, it uses more power than normal. If you try to charge in this state, your Pin may charge more slowly, or possibly not at all. In this case, you'll see a message in your Laser Ink Display informing you that charging may not have been complete. Tips & solutions General If there are any problems with charging, please try unplugging your Charge Pad from its adapter. After 5-10 seconds, try plugging it back in. If this does not help, please try plugging your Charge Pad into a different wall outlet. If issues persist, see the following steps depending on the specific problem. Charge Pad light pulses or blinks red Upon charging, if the Charge Pad blinks red twice, you may have moisture or debris impacting charge. To resolve, follow these steps: Unplug the USB-C Cable from the Charge Pad. Remove Ai Pin and Battery Booster from the Charge Pad. Use a clean, dry cloth to thoroughly wipe the well of the Charge Pad and the Booster connectors. (The connectors look like half circles.) Do not use water on the connectors. If there is a visible moisture, tap or shake Booster to remove excess liquid. Reconnect Charge Pad and USB-C Cable. Reattach place the Booster (and, optionally, Ai Pin) on the Charge Pad. If the Charge Pad light continues to blink red, repeat steps 1-4 and set the Booster aside for 24 hours, allowing residual moisture to dry completely. If the Charge Pad continues to blink red after following the steps above, contact Support. Charge Pad light pulses red, then blinks amber If the Charge Pad blinks red for an extended period of time, followed by amber blinks, continue charging for two minutes. If at any point the Charge Pad begins to only blink red, follow steps 1-4 above. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .acco