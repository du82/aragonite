["https://support.humane.com/hc/en-us/articles/32025506926221-How-to-use-the-Quick-Action-Feature"]
title = 'How to use the "Quick Action" Feature – Ground Control'
description = 'Ai Pin has a "quick action" feature that allows you to quickly use one of three features—Interpreter, Messages, or Notes—with a two-finger touch of the touchpad. To learn more about how to use the ...'
full_description = '''Ground Control Ground Control Setup & Settings Getting started How to use the "Quick Action" Feature Ai Pin has a "quick action" feature that allows you to quickly use one of three features—Interpreter, Messages, or Notes—with a two-finger touch of the touchpad. To learn more about how to use the Quick Action feature, follow the steps below. To use the "Quick Action" feature To cycle through the three different options, two-finger swipe left or right on the touchpad and it will move through the three options of Interpreter, Messages, and Notes. You can also use Ai Mic and say, for instance, "Set my Quick Action to Interpreter." At any time, you can also ask Ai Mic, "What is my current Quick Action?" and your Pin will answer with the currently selection action. Quick Action "Interpreter" NoteAi Pin will use the most recent language you've set Interpreter to. If you've never used Interpreter, you will need to tap and hold the touchpad then say "set translation language to" and whatever language you want to translate. For more information, visit this article. Tap and hold two fingers on the touchpad. Speak a sentence that you'd like translated to another language and then release the touchpad. Ai Pin will automatically translate what you say to the language you've selected. You (or the person you're speaking with) can also speak in another language, and Ai Pin will translate to English! Quick Action "Messages" NoteThe first time you use this feature, you will need to set your default contact for Quick Action messages. Tap and hold two fingers on the touchpad. Speak a message. When you're finished speaking, release the touchpad. Your Pin will automatically send a text message to the person you set as the default, without having to say "send a message to ...". Quick Action "Notes" Tap and hold the touchpad with two fingers. Say something that you'll want to remember later. When you're done speaking, release the touchpad. Ai Pin will automatically create a note of whatever you say. You can access your Notes from your Humane.Center account at any time. document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); header.addEventListener('click', () => { console.log('click') accordion.classList.toggle('open'); }); }); }); window.onload = () => { document.querySelectorAll('.article-body p').forEach(paragraph => { if (paragraph.innerHTML.trim() === '&nbsp;') { let sibling = paragraph.nextElementSibling; let isEmpty = true; // Check if there's any HTML content in subsequent siblings while (sibling) { if (sibling.nodeType === 1 && sibling.tagName.toLowerCase() !== 'p') { // If the sibling is an element and not a paragraph, it contains content isEmpty = false; break; } sibling = sibling.nextElementSibling; } // Remove the paragraph if it contains only &nbsp; and has no HTML content below it if (isEmpty) { paragraph.remove(); } } }); };'''
