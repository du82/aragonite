full_description = '''Ground Control Ground Control Humane.Center Media & data Manage your data My Data is a dashboard for all your data in Humane.Center. It displays an overview of all the things you’ve done with your Ai Pin. You’ll see daily and cumulative totals for the following categories of data: Ai Mic: Each interaction you’ve had using Ai Mic Music: Every song played on your Pin. Calls: All answered and missed calls. Translation: All Ai Mic events involving translation. Notes: Requests to create and/or update notes and lists. You can select any of these categories to see a detailed view of your history. The detailed view shows the date and time of your action (and, in the case of Calls and Messages, the contact’s name and phone number). In the detailed view, you can delete any record by selecting the delete button. To delete data Log in to .Center and navigate to the My Data tab at the top of your screen. Select the desired data category. Find the line item(s) you’d like to delete from your data. Select delete  and confirm by selecting “Delete.” document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => {