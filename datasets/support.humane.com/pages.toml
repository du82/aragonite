ttribute('href').substring(1))); let currentSectionIndex = -1; const offset = window.innerWidth <= 768 ? 120 : 60; sections.some((section, index) => { const rect = section.getBoundingClientRect(); if (rect.top <= offset && rect.bottom > offset) { currentSectionIndex = index; return true; } return false; }); if (currentSectionIndex === -1) { // If no sections are found, set the first link as current sectionLinks[0].classList.add('current'); sectionSubNavContainer.classList.remove('sticky'); } else { sectionLinks.forEach((link, index) => { link.classList.toggle('current', index === currentSectionIndex); }); sectionSubNavContainer.classList.add('sticky'); } }; const sectionLinks = document.querySelectorAll('.section-sub-nav a'); const sections = Array.from(sectionLinks).map(link => document.getElementById(link.getAttribute('href').substring(1))); const offset = window.innerWidth <= 768 ? 120 : 60; sectionLinks.forEach((link, index) => { link.addEventListener('click', (event) => { event.preventDefault(); scrollToWithOffset(sections[index], offset); }); }); window.addEventListener('scroll', updateCurrentSection); }); function scrollToWithOffset(element, offset) { const elementPosition = element.getBoundingClientRect().top + window.pageYOffset; const offsetPosition = elementPosition - offset; window.scrollTo({ top: offsetPosition, behavior: "smooth" }); } async function fetchArticles(sectionId) { const response = await fetch(`/api/v2/help_center/sections/${sectionId}/articles.json`); const data = await response.json(); return data.articles; } function renderArticles(articles, sectionId) { const containers = document.querySelectorAll(`.sub-section [data-section-id="${sectionId}"]`); containers.forEach(container => { container.innerHTML = ''; // Clear existing content articles.forEach(article => { const articleElement = document.createElement('a'); articleElement.href = article.html_url; articleElement.textContent = article.title; const excerpt = document.createElement('p')