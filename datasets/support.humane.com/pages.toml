full_description = '''Ground Control Ground Control Setup & Settings Connectivity Turn Wi-Fi on or off Using voice Press and hold one finger on the touchpad. You will see the Trust Light flashing orange and hear a chime indicating Ai Mic is listening. Say “Turn Wi-Fi on” or “Turn Wi-Fi off.” Release finger from the touchpad. The Trust Light will stop flashing and you’ll hear a chime indicating Ai Mic is no longer listening. Ai Pin will answer "Wi-Fi enabled," or "Wi-Fi disabled." Using Laser Ink Tap the touchpad with one finger to indicate you’d like to activate Laser Ink. Open your hand. You should see the Trust Light flashing white to indicate your Ai Pin is scanning for your hand. Once detected, the Laser Ink Display will project on your hand. Push out your hand a few more inches until you see the menu. Pick settings . Scroll to “wi-fi” and pick it to toggle on  or off . document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.accordion-section header').forEach((header) => { header.addEventListener('click', () => { const section = header.closest('.accordion-section'); // Toggle the 'open' class on the accordion section section.classList.toggle('open'); // Toggle the 'open' class on the accordion content const content = section.querySelector('.accordion-content'); content.classList.toggle('open'); }); }); var secondLi = document.querySelector('.breadcrumbs li:nth-child(2)'); var catTitleElement = document.querySelector('.article-votes .cat-title'); if (secondLi && catTitleElement) { var secondLiTitle = secondLi.querySelector('a').textContent; catTitleElement.textContent = secondLiTitle; } const catBreadcrumb = document.querySelector('.breadcrumbs li:nth-of-type(2)') catBreadcrumb.style.display = "none" }); document.addEventListener('DOMContentLoaded', () => { const accordions = document.querySelectorAll('.article-body .accordions-list .accordion'); accordions.forEach(accordion => { const header = accordion.querySelector('header'); heade