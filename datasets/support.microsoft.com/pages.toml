["https://support.microsoft.com/en-us/windows/complete-guide-to-narrator-e4397a0d-ef4f-b386-d8ae-c172f109bdb1"]
title = "Complete guide to Narrator - Microsoft Support"
description = "Learn how to use Narrator, a screen-reading app built into Windows, with this complete guide and how-to articles."
full_description = '''Windows 11Windows 10 Narrator is a screen-reading application that's built into Windows 11, so there's nothing you need to download or install. This guide describes how to use the Narrator with Windows so that you can start using apps, browsing the web, and more. Below the table of contents, there’s a section about what's new in Narrator. Note: This guide is available as a Word doc and a PDF (in English only). To obtain additional languages or formats, contact the Disability Answer Desk. You want to learn how to use Narrator to do things in Office apps, like Outlook and Word? Check out the articles on this page: Use a screen reader with Office apps. Follow these links to learn how to use a screen reader to do things in Windows 11: Use a screen reader to explore and navigate the Start menu in Windows Use a screen reader to explore and navigate Settings in Windows Use a screen reader to explore and navigate File Explorer in Windows Keyboarding in Microsoft Teams 2.0 for Windows 11 Use a screen reader to set up Teams for personal and small business use Table of contents Chapter What's in it Chapter 1: Introducing Narrator An overview of Narrator including how to start and stop it. Chapter 2: Narrator basics How to get around the screen, find and open apps, change what Narrator reads, and adjust speech rate and volume. Chapter 3: Using Scan Mode How to use scan mode to navigate apps, email, and the web. Chapter 4: Reading text How to read and get info about text, such as font, text color, and punctuation. Chapter 5: Navigation How to get more info on the app or page you're exploring using Narrator views. Chapter 6: Using Narrator with Touch How to use Narrator with touch, including basic gestures. Chapter 7: Customizing Narrator How to change how the Narrator starts, determine how much feedback you hear when typing, change Narrator commands, and use third-party text-to-speech (TTS) software. Chapter 8: Using Narrator with Braille How to use Narrator with a refreshable braille display. Appendix A: Supported languages and voices A list of supported languages for legacy and natural voices in Narrator. Appendix B: Narrator keyboard commands and touch gestures A list of Narrator keyboard commands and touch gestures. Appendix C: Supported braille displays A list of braille displays supported by the Narrator. Appendix D: Narrator sounds A list of the sounds the Narrator uses and what those sounds mean. Appendix E: Narrator with Outlook How to use Narrator with Outlook extension. Appendix F: Narrator with Excel How to use Narrator with Excel extension. Appendix G: Troubleshooting Narrator Natural Voices setup issues How to Troubleshoot the Narrator Natural Voices setup issues. Appendix H: List of Issues and Bugs fixed A list of issues and bugs fixed in this release. Appendix I: History of Narrator Updates A list of narrator update history. What's new in Narrator Version released in Nov 2024 This release is for improving the overall performance of Narrator, adding three new Narrator shortcuts, and a few bug fixes across Narrator. We have addressed issues with the narrator's performance after extended use. This improvement would allow you to continuously use Narrator without it slowing down over time. Narrator now includes a few new keyboard shortcuts. Using the Narrator key + Ctrl + X, you can invoke one of these new shortcuts to copy the last phrase that Narrator spoke. This copied phrase can be available on the clipboard for you to paste anywhere, such as Teams, Outlook, or a Word document. There are also two new shortcuts added to scan mode on Narrator. When you activate the scan mode, the 'L' shortcut enables you to navigate directly to lists within a document, email, or web page. Another scan mode shortcut, ‘N’ allows you to skip past a block of links. This is especially helpful when you’re trying to get to the main content on a webpage. To try these two shortcuts, turn on scan mode by pressing the Narrator key + spacebar. With this release, we have resolved a problem where the Narrator would automatically add a "contains style" announcement whenever it detected text with styling attributes like bullets and numbers in applications like Microsoft Edge, Teams, and Outlook, among others. We also fixed an issue where a few dialog boxes in Narrator were not adopting the 200% text scaling setting on Windows. The narrator will now start auto-reading the email as soon as you press the ‘Enter’ key on the new Outlook Monarch, similar to the classic Outlook, without having to navigate to the email body and then pressing a separate shortcut to auto-read. Version released in Aug 2024. This release is for improving the performance of scan mode in Narrator. Typing in edit fields, such as the address bar, is now easier because Narrator scan mode will now turn off faster. This improvement will also help when filling in form fields, such as typing your name and address in different edit boxes. A new keyboard shortcut has been added to hear battery and network status. The new shortcut is Narrator key + Shift + B. This will announce if your laptop is plugged for charging, followed by battery status, network name, and network status. Few sample announcements are: Battery 79%, time remaining 1 hour 48 minutes, Network Sample Wi-Fi Internet access. Plugged in, battery 23%, network No internet access. Version released in Feb 2024. This release is about enhancing the reading experience for images with Narrator, early steps in supporting dictation with voice access and Narrator, ability to preview all natural voices and a bunch of bug fixes across Narrator. To give feedback, press Narrator + Alt + F while Narrator is running. Tip: The Narrator key is a modifier key in the Narrator commands. Both the Caps lock key and the Insert key serve as your Narrator key by default. For more info on the Narrator key, go to Chapter 2: Narrator basics or Appendix B: Narrator keyboard commands and touch gestures. Enhance image consumption experience in Narrator With Narrator, we have enhanced image consumption experience. There are two significant modifications: A new keyboard command has been added to allow you to switch between the graphics/images on a page or screen. Now, in Scan mode (Narrator key+spacebar), you can move forward or backward between graphics/images by pressing the keys G or Shift+G. Text recognition in images is enhanced, including handwriting recognition, and overall image descriptions are better. To experience the improved experience, navigate to any image and, while the image is in focus, execute the keyboard combination Narrator key+CTRL+d. An active internet connection is necessary for this feature, and Narrator settings must have the option to obtain Image Descriptions activated. For more information, refer to image descriptions in Chapter 2: Narrator basics. Dictate text with voice access Voice access in Windows 11 enables everyone, including people with mobility disabilities, to control their PC and author text using their voice. For example, you can open and switch between apps, browse the web, and read and author emails using your voice. Voice access uses modern, on-device speech recognition to accurately recognize speech and works even without the internet. For more information, refer to Use voice access to control your PC & author text with your voice. Narrator users can start using voice access to dictate text with voice and hear what is dictated. In addition, you can also use voice access to give Narrator commands. For example, “Turn on Narrator,” “speak faster,” “read selection,” “read next line,” etc. To know the entire list of Narrator commands supported with voice access click help icon (?) on voice access bar, select View all commands and choose Narrator commands. Note that, all voice access features do not work with Narrator. Please refer to the section below for more details. You can start voice access by searching in the Windows Search bar or pinning it to the task bar once it is open. What will work: Start and setup voice access which includes downloading a speech model. Read a list of voice access commands and Narrator commands from voice access help menu. Changing voice access microphone state. Dictating text with voice and hearing back what was dictated. What will not work: Using voice access guide with a screen reader. Core voice access features: Using different voice access commands to get different tasks done: Using “Click” commands or number overlays to interact with specific items on the screen. Using grid overlays to control the mouse pointer. Using text editing features such as corrections and spellings in voice access. Tips: You can press Alt+Tab to cycle through all open applications to move the focus to the voice access UI. If you don’t use headphones for listening to the screen reader, the audio output from the screen reader may get picked up by voice access microphone, leading to unwanted behavior. Preview natural voices in Narrator We launched natural voices in 10 new locales as part of Windows September 2023 update. Those natural voices include Chinese, Spanish (Spain), Spanish (Mexico), Japanese, English (UK), French, Portuguese, English (India), German and Korean. With this Windows update, users will be able to preview and listen to the natural voice before downloading a voice model. Once downloaded, Natural Narrator voices support text-to-speech on-device and do not require an internet connection. For more information, refer to natural voices section in Appendix A: Supported languages and voices. Notes: There are more improvements and bugs fixed in this release. For more information, refer to Appendix H: List of Issues and Bugs fixed. To see the history of narrator updates, refer to Appendix I: History of Narrator Updates. Narrator is a screen-reading app that's built into Windows 10, so there's nothing you need to download or install. This guide describes how to use Narrator with Windows so that you can start using apps, browsing the web, and more. Below the table of contents, there’s a section about what's new in Narrator. Note: This guide is available as a Word doc and a PDF (in English only). You can download a version of this guide in braille (US English non-UEB grade 2 braille). To obtain additional languages or formats, contact the Disability Answer Desk. Want to learn how to use Narrator to do things in Office apps, like Outlook and Word? Check out the articles on this page: Use a screen reader with Office apps. Table of contents Chapter What's in it Chapter 1: Introducing Narrator An overview of Narrator including how to start and stop it. Chapter 2: Narrator basics How to get around the screen, find and open apps, change what Narrator reads, and adjust speech rate and volume. Chapter 3: Using scan mode How to use scan mode to navigate apps, email, and the web. Chapter 4: Reading text How to read and get info about text, such as font, text color, and punctuation. Chapter 5: Navigation How to get more info on the app or page you're exploring using Narrator views. Chapter 6: Using Narrator with touch How to use Narrator with touch, including basic gestures. Chapter 7: Customizing Narrator How to change how Narrator starts, determine how much feedback you hear when typing, change Narrator commands, and use third-party text-to-speech (TTS) software. Chapter 8: Using Narrator with braille How to use Narrator with a refreshable braille display. Appendix A: Supported languages and voices A list of supported languages and available TTS voices in Narrator. Appendix B: Narrator keyboard commands and touch gestures A list of Narrator keyboard commands and touch gestures. Appendix C: Supported braille displays A list of braille displays supported by Narrator. Appendix D: User guides for previous versions of Narrator User guides for previous versions of Narrator Appendix E: Narrator sounds A list of the sounds Narrator uses and what those sounds mean. What's new Version released in 2020 This release is all about helping you get things done faster. To give Microsoft feedback, press Narrator + Alt + F while Narrator is running. Tip: The Narrator key is a modifier key in the Narrator commands. Both the Caps lock key and the Insert key serve as your Narrator key by default. For more info on the Narrator key, go to Chapter 2: Narrator basics or Appendix B: Narrator keyboard commands and touch gestures. Email improvements in Outlook and Windows Mail Use Scan Mode to read emails Scan Mode turns on automatically when you open an email. Use the arrow keys and other Scan Mode commands—just like you would on the web—to navigate around. Emails are read automatically When you open an email, Narrator will start reading—no commands required. Get the important info, skip the noise In Outlook, Narrator will read an email’s status (unread, forwarded, etc.), who sent it, the subject line, and any other characteristics of the email that are important or unique (for example, Narrator will read if an email is flagged, but it won’t read if an email is unflagged). Narrator won’t read any unnecessary table info, like if there are 5 empty columns, and column headers won’t be read by default. Turn column header reading in Outlook on or off by pressing Narrator + H. Web improvements No more unhelpful hyperlinks Narrator will give you the title of the webpage for a link. Press Narrator + Ctrl + D, and Narrator will take the URL of the hyperlink you are on and send it to an online service that will provide the page title to Narrator. And when focus is on an image, the Narrator + Ctrl + D command provides a description of the image. If you would like to disable all online services used by Narrator, you can turn this feature off in Narrator settings. Get a quick summary of a webpage Hear a webpage summary that includes the number of links, landmarks, and headings by pressing Narrator + S. Popular links and full webpage summary Press Narrator + S twice quickly to pull up a dialog box on the screen with the following info: the number of links, landmarks, and headings on a page, and a list of popular links for a page (popular links are the links on the page that get the most engagement). Webpages are read automatically Narrator automatically reads webpages starting at the top of the page. Sound improvements New sounds for common actions Narrator sounds are now more functional and responsive. For example, sounds now play for common actions, such as when you land on a link or when you turn on or off Scan Mode. To manage sounds for common actions, go to Narrator settings. To hear the Narrator sounds, refer to Appendix E: Narrator Sounds. Hear capital letters and words By default, Narrator reads capital letters the same as lowercase ones. This means “Word,” “WORD,” and “word” all sound the same (even though different letters are capitalized in each). If you’d like to hear when a letter is capitalized, Narrator can say “cap” before it, or re'''
