["https://support.microsoft.com/en-us/topic/7f52444a-8612-4f29-b109-2ac47dd4c83a"]
title = "Sign in to Microsoft 365 - Microsoft Support"
description = "Learn how to sign in to Office or Microsoft 365 from a desktop application or your web browser."
full_description = "How to sign in to Microsoft 365 or Office WindowsmacOSiOSAndroidWeb For Office apps installed on a Windows PC: If you're not already in an Office file or document, open an app such as Word or Excel, and open an existing file, or create a new one. Select File > Account (or Office Account if you're using Outlook). If you're not already signed in, click Sign In. In the Sign in window, type the email address and password you use with Office. This might be the personal Microsoft account you associated with Office, or the username and password you use with your work or school account. For Office apps installed on a Mac: Open any Office app such as Word and select Sign In. If you're already editing a file, go to File > New from Template... > Sign In. Note: If you're on OneNote, select OneNote from the top menu and then select Sign In. In the Sign in window, type the email address and password you use with Office. This might be the personal Microsoft account you associated with Office, or the username and password you use with your work or school account. For Office apps installed on an iPhones and iPads: Open the Office app. On the Account screen, tap Sign In. On the Sign In screen, type the email address and password you use with Office. This might be the personal Microsoft account you associated with Office, or the username and password you use with your work or school account. For Office apps installed on an Android or Chromebooks: Open the Office app. On the Recent screen, tap Sign In. On the Sign In screen, type the email address and password you use with Office. This might be the personal Microsoft account you associated with Office, or the username and password you use with your work or school account. To sign in to Office on the web: Go to www.office.com and select Sign In. ​​​​​​​Sign in Enter your email address and password. This might be your personal Microsoft account, or the username and password you use with your work or school account. The name of the account you're signed in with is displayed in the header. Select the App Launcher and then select any Office app to start using it. Can't sign in to Microsoft 365 or Office If you can't sign into your Microsoft account, most issues can be identified by our sign-in helper tool. The tool will ask you to enter the email address or mobile phone number you're trying to sign in with and check the details you provide. If we detect a problem with your account, we'll tell you what you need to do to solve the problem. If we don't detect any problem, we'll guide you through how you can help yourself. Click the button to begin: Sign-in helper Learn more How sign in works in Microsoft 365 If you subscribe to Microsoft 365, you'll be prompted to sign in to use Office after installation, or after you sign out. Your subscription has a sign-in limit that determines how many Office installs you can sign in to at the same time. Use the tabs below to select your subscription type and learn more about sign-in limits for your subscription. Office for homeOffice for business With Microsoft 365, you can install Office on all your devices and sign in to Office on five devices at the same time. This includes any combination of PCs, Macs, tablets, and phones. Get help signing in to Office Here's what you need to know Here are some tips for using Microsoft 365 on multiple devices: Each person who uses Office on a device must have an account that's associated with Microsoft 365. This can be the account that subscribes to Microsoft 365, or any accounts that share a Microsoft 365 Family subscription. When you install Office on a device, you'll be prompted to sign in the first time you start an Office app. Office remains activated as long as you're signed in. If you sign out, your account's license is removed and the app is deactivated. You can view and print files, but not create or edit files. To activate Office after you've signed out, you can sign in again with the account that's associated with your subscription. If you have more than five devices, Office will sign you out of devices automatically to stay within your sign-in limit. To use Office on a device where you've been signed out, just sign back in. With Microsoft 365, you can install and sign in to Office on 5 PCs or Macs, 5 tablets, and 5 phones. Get help signing in to Office Here's what you need to know Here are some tips for using Microsoft 365 on multiple devices: If you sign in to Windows using your work or school account, you'll be signed in to Office automatically. On Macs and mobile devices, sign in using your work or school account to activate Office. Office remains activated as long as you're signed in. If you sign out, your apps will be deactivated. You can view and print files, but not create or edit files, until you sign back in. Office will sign you out of devices automatically to stay within your sign-in limit. To use Office on a device where you've been signed out, just sign back in. Common question about signing in to Office Office for homeOffice for business Common questions I signed in. Should I stay signed in? We recommend staying signed in to Office so that your apps remain activated. What happens if I sign out of Office? If you sign out, your apps will be deactivated. You can view and print files, but not create or edit files, until you sign back in. To learn more, see What happens when you sign out of Office. If I share Microsoft 365 Family, how does signing in work? You can share your Microsoft 365 Family subscription with up to five other people. Each person will use their own Microsoft account to install Office on all their devices and be signed in to five at the same time. Get help sharing your subscription Can other people sign in to Office on my device? If a person signs in to Office on your device without a subscription, they will be able to view and print files, but not create or edit files. If you have Microsoft 365 Family, you can share your subscription with five additional people. Each person can sign in to Office using their own Microsoft account on your device to create and edit their own files. Get help sharing your subscription Common questions I signed in. Should I stay signed in? We recommend staying signed in to Office so that your apps remain activated. What happens if I sign out of Office? If you sign out, your apps will be deactivated. You can view and print files, but not create or edit files, until you sign back in. See also​​​​​​​​​​​​​​ Download, install, or reinstall Office on a PC or Mac Forgot your account or password? Easily switch between accounts Sign out of Office​​​​​​​ Why you need a Microsoft account, or work or school account with Microsoft 365 or Office Need more help? Can't sign in? ​​​​​​​If you can't sign into your Microsoft account, most issues can be identified by our sign-in helper tool.Sign-in helper ​​​​​​​Contact Support For technical support, go to Contact Microsoft Support, enter your problem and select Get Help. If you still need help, select Contact Support to be routed to the best support option. Important: To protect your account and its contents, our support agents are not allowed to send password reset links, or access and change account details."
