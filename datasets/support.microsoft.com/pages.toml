title = "Accessibility tools for Excel - Microsoft Support"
description = "Learn about accessibility tools for Excel and how to make your Excel spreadsheets accessible for everyone."
full_description = "This page lists accessibility tools for Excel. Here you'll also find tools to make your Excel spreadsheets accessible for everyone. Work with keyboard shortcuts in Excel Keyboard shortcuts in Excel Use a screen reader in Excel Screen reader support for Excel Create accessible spreadsheets in Excel Make your Excel documents accessible to people with disabilities Improve accessibility with the Accessibility Checker Check accessibility while you work in Office apps Other helpful tools Microsoft Translator for Excel Use Search/Tell Me to find the command you want Find what you need with Microsoft Search in Office Do things quickly with Tell Me Set up your device to work with accessibility in Microsoft 365 Accessibility support for Windows Technical support for customers with disabilities Microsoft wants to provide the best possible experience for all our customers. If you have a disability or questions related to accessibility, please contact the Microsoft Disability Answer Desk for technical assistance. The Disability Answer Desk support team is trained in using many popular assistive technologies and can offer assistance in English, Spanish, French, and American Sign Language. Please go to the Microsoft Disability Answer Desk site to find out the contact details for your region. If you are a government, commercial, or enterprise user, please contact the enterprise Disability Answer Desk."
