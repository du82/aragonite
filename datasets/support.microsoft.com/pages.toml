full_description = "This page lists accessibility tools for OneDrive such as keyboard shortcuts or screen readers. Work with keyboard shortcuts in OneDrive for work or school Keyboard shortcuts for OneDrive for work or school Use a screen reader in OneDrive Screen reader support for OneDrive Other helpful tools Set up your device to work with accessibility in Microsoft 365 Accessibility support for Windows Technical support for customers with disabilities Microsoft wants to provide the best possible experience for all our customers. If you have a disability or questions related to accessibility, please contact the Microsoft Disability Answer Desk for technical assistance. The Disability Answer Desk support team is trained in using many popular assistive technologies and can offer assistance in English, Spanish, French, and American Sign Language. Please go to the Microsoft Disability Answer Desk site to find out the contact details for your region. If you are a government, commercial, or enterprise user, please contact the enterprise Disability Answer Desk."
