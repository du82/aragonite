full_description = "Microsoft 365 Copilot help & learning Learn how to use Copilot, your everyday AI companion. Ready to try Copilot? Start here. Watch how Copilot helps you be more productive Duration: 1 minute 44 seconds Watch how Copilot makes it easier to create, edit, and more Duration: 1 minute 47 seconds Watch how to create more quickly with Copilot Duration: 2 minutes 25 seconds Watch how you can chat more effectively with Copilot Duration: 2 minutes 16 seconds Discover Copilot in Microsoft 365 apps Copilot Chat Outlook Word PowerPoint Teams Excel OneNote OneDrive Loop Whiteboard Planner Forms SharePoint Stream Viva Supercharge your productivity with Microsoft 365 Copilot Catch up to start your week Get ready for your day Copilot Chat Catch up on long email thread Outlook Uncover relevant files Copilot Chat Discover what was said Copilot Chat Get to work Create presentation PowerPoint Boost your brainstorm Copilot Chat Draft emails Outlook Generate meeting notes Teams Recap my week Summarize your week Copilot Chat Set my priorities for the next week Copilot Chat Optimize your workflow Introducing AI agents Copilot Chat Get started with agents Copilot Chat SharePoint agents SharePoint The art of prompting What is a prompt? Learn how you ask Copilot to do something for you. What makes a good prompt Find tips to help you get better results with Copilot. Discover prompts for all occasions Start your Copilot journey by mastering prompt skills. Learn about Copilot prompts Find out what you can get done with Copilot prompts. Edit a Copilot prompt to make it your own Find more prompt examples for your needs. Get the most from Copilot Check tips and tricks for effective Copilot prompts. Share your best prompts Learn how you can find, save, and share prompts. Copilot and your privacy Copilot Pro (home users) Learn more about how Copilot uses your data in Microsoft 365 apps at home. Microsoft 365 Copilot (IT Pros/admins) Learn more about how your organizational data is