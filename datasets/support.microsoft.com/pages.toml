["https://support.microsoft.com/en-us/account-billing/change-your-microsoft-account-password-fdde885b-86da-2965-69fd-4871309ef1f1"]
title = "Change your Microsoft account password - Microsoft Support"
description = "Get steps for how to change a known Microsoft account password."
full_description = "The steps below describe how to change a known password. If you need to reset your password because you forgot it, see Reset your Microsoft account password instead. Change your password Go to account.microsoft.com and if you're not already signed in, sign in with the username and current password for the account you want to update. From the navigation header, select Security and because you're accessing sensitive info, you'll need to enter the password for this account again. From the Password security tile, select Change my password. On the Change your password page, enter your current password and then enter your new password. For additional security, select the optional checkbox which prompts you to update your password every 72 days. Select Save. If you weren't able to change your password If you couldn't change your password this way, see Reset your Microsoft account password. Need more help? Can't sign in? ​​​​​​​If you can't sign into your Microsoft account, most issues can be identified by our sign-in helper tool.Sign-in helper ​​​​​​​Contact Support For technical support, go to Contact Microsoft Support, enter your problem and select Get Help. If you still need help, select Contact Support to be routed to the best support option. Important: To protect your account and its contents, our support agents are not allowed to send password reset links, or access and change account details."
