["https://support.microsoft.com/en-us/office/download-install-or-reinstall-microsoft-365-office-2024-or-office-2021-on-a-pc-or-mac-4414eaaf-0478-48be-9c42-23adc4716658"]
title = "Download, install, or reinstall Microsoft 365, Office 2024, or Office 2021 on a PC or Mac - Microsoft Support"
description = "Learn how to install, reinstall, or activate Microsoft 365 or Office 2019 on a PC or Mac."
full_description = '''Tip: Get expert advice, dedicated support, and personalized guidance from business specialists. With Business Assist, get help making Microsoft 365 products work for you and everyone in your business. Learn more Ready to install? Before you begin, make sure your PC or Mac meets the system requirements. If you already redeemed a product key, you're simply reinstalling the apps, or you know you have an assigned license through work or school, you can skip ahead and go to the section sign in to download and install Microsoft 365 or Office. However, if this is the first time you're installing Microsoft 365 or Office, you may have some steps to do first. Expand the Learn more section below for more info. Guided support in your browser can provide digital solutions for Office problems Try guided support Learn more about product keys, assigned licenses, Workplace Discount Program, and volume license versions If this is the first time you're installing Microsoft 365 or Office, you may have to complete a set of pre-installation steps or you may need to follow different steps than what's shown below. What you do depends on if your copy of Microsoft 365 or Office is a home or a business product and whether or not you have a product key that you still need to redeem, an account already associated with your product, or a pre-assigned license. Microsoft 365 or Office for home If you have a home product and it came with a product key*, before installing for the first time (or sharing it if you have Microsoft 365 Family), you need to redeem your product key first. Go to office.com/setup and sign in with an existing or new Microsoft account and then enter your product key to redeem it*. Redeeming your key is what adds your Microsoft 365 or Office license to your Microsoft account, and you only have to do this once per product key. If you're renewing a Microsoft 365 subscription with a new product key, use the same Microsoft account you previously associated with your expired version subscription. Tip: Once this is done, anytime you need to install or reinstall Microsoft 365 or Office you can go straight to the next section, Sign in to download Microsoft 365 or Office and select the tab for help to install on a PC or Mac. Be sure to sign in with the same Microsoft account you used to redeem your product key at office.com/setup. Microsoft 365​​​​ for business If your business subscription plan includes the desktop version of the Microsoft 365 apps you won't see an option to install it unless someone in your organization assigned a license to you. Learn how to check this in What Microsoft 365 business product or license do I have? or if you're a Microsoft 365 admin responsible for assigning licenses to people in your organization, see Assign licenses to users. Once you verify you have a license, anytime you need to install or reinstall Microsoft 365 you can go straight to the section below, Sign in to download Office and select the tab for steps to install on a PC or Mac. You'll sign in with your work or school account for these versions of Microsoft 365. *If you don't have a product key or an account Some versions of Microsoft 365 such as Office Professional Plus, Office Standard, or a stand-alone app such as Word or Project don't have an associated Microsoft account, or work or school account. The steps to install these versions can be different depending if you got Microsoft 365 through one of the following ways: Workplace Discount Program: You bought Microsoft 365 for personal use through your company benefit program and have a product key, see Install Office through the Workplace Discount Program. Volume license versions: IT departments might use a different method when installing Microsoft 365 for people in their organization. Talk to your IT department for install help. Third-party seller: You bought Microsoft 365 from a third-party and you're having problems with the product key. Sign in to download and install Microsoft 365 or Office Tip: Get tech expertise with Business Assist. Connect with our small business advisors for help making Microsoft 365 products work for you and everyone in your business. Learn more. Install on a PCInstall on a MacNeed help? Sign in to download Microsoft 365 or Office Go to www.office.com and if you're not already signed in, select Sign in. Note: If you're using Microsoft 365 operated by 21 Vianet, sign in with your work or school account to login.partner.microsoftonline.cn. If you're using Microsoft 365 Germany, sign in with your work or school account to portal.office.de. Sign in with the account you associated with this version of Microsoft 365. This account can be a Microsoft account, or work or school account. I forgot the account I use with Office After signing in, follow the steps that match the type of account you signed in with. You signed in with a Microsoft account From the Microsoft 365 home page select Install apps. Select Install (or depending on your version, Install apps>). You signed in with a work or school account From the home page select Install apps (If you set a different start page, go to aka.ms/office-install.) Notes: For Microsoft 365 operated by 21 Vianet go to login.partner.microsoftonline.cn/account. For Microsoft 365 Germany go to portal.office.de/account. Select Microsoft 365 apps to begin the installation. The 64-bit version is installed by default unless Microsoft 365 or Office detects you already have a 32-bit version of Microsoft 365 or Office (or a stand-alone app such as Project or Visio) installed. In this case, the 32-bit version of Microsoft 365 or Office will be installed instead. To change from a 32-bit version to a 64-bit version or vice versa, you need to uninstall Microsoft 365 first (including any stand-alone Microsoft 365 apps you have such as Project of Visio). Once the uninstall is complete, sign in again to www.office.com and select Other install options, choose the language and version you want (64 or 32-bit), and then select Install. (See Install Visio or Install Project if you need to reinstall those stand-alone apps.) Notes: For Microsoft 365 operated by 21 Vianet go to login.partner.microsoftonline.cn. For Microsoft 365 Germany go to portal.office.de. This completes the download of Microsoft 365 to your device. To complete the installation, follow the prompts in the "Install Microsoft 365" section below. Tip: Don't see an install option after signing in? There could be an issue with your account. Select Need help? from above and review the solutions under Account questions. Install Office Depending on your browser, select Run (in Microsoft Edge or Internet Explorer), Setup (in Chrome), or Save File (in Firefox). If you see the User Account Control prompt that says, Do you want to allow this app to make changes to your device? select Yes. The install begins. Your install is finished when you see the phrase, "You're all set! Office is installed now" and an animation plays to show you where to find Microsoft 365 applications on your computer. Select Close. Installation or sign in issues? Tip: For help with Microsoft 365 or Office 2021 installation issues on a PC, please go to Microsoft 365 troubleshooters and select the Microsoft 365 setup troubleshooter option. If you're having an installation issue such as Microsoft 365 taking long to install, try Need help? for a list of common issues. Activate Microsoft 365 or Office To open an app, select the Start button (lower-left corner of your screen) and type the name of an app, like Word. If you have Windows 8.1 or 8.0, type the name of an Microsoft 365 app on the Start screen. Can't find your Office apps? To open the app, select its icon in the search results. When the app opens, accept the license agreement. Microsoft 365 or Office is activated and ready to use. Note: The Activation Wizard appears if Microsoft 365 or Office has trouble activating. Complete the steps in the wizard to finish activation. Sign in and install Microsoft 365 or Office Go to www.office.com and if you're not already signed in, select Sign in. Note: If you're using Microsoft 365 operated by 21 Vianet, sign in with your work or school account to login.partner.microsoftonline.cn. If you're using Microsoft 365 Germany, sign in with your work or school account to portal.office.de. Sign in with the account you associated with this version of Microsoft 365 or Office. This account can be a Microsoft account, or work or school account. I forgot the account I use with Office After signing in, follow the steps that match the type of account you signed in with. You signed in with a Microsoft account From the Microsoft 365 home page select Install Office to start the download. You signed in with a work or school account From the Microsoft 365 home page select Install Office (if you set a different start page, go to aka.ms/office-install). Notes: For Microsoft 365 operated by 21 Vianet go to login.partner.microsoftonline.cn/account. For Microsoft 365 Germany go to portal.office.de/account. Select Office 365 apps to begin the download. Note: Don't see an install option after signing in? There could be an issue with your account. Select Need help? from above and review the issues listed in the section Account questions. Follow the instructions below to complete installing your Microsoft 365 apps. Install Microsoft 365 or Office Once the download has completed, open Finder, go to Downloads, and double-click Microsoft Office installer.pkg file (the name might vary slightly). Tip: If you see an error that says the Microsoft Office installer.pkg can't be opened because it is from an unidentified developer, wait 10 seconds and move the downloaded file to your desktop. Hold Control + click the file to launch the installer. On the first installation screen, select Continue to begin the installation process. Review the software license agreement, and then click Continue. Select Agree to agree to the terms of the software license agreement. Choose how you want to install Microsoft 365 and click Continue. Review the disk space requirements or change your install location, and then click Install. Note: If you want to only install specific Microsoft 365 apps and not the entire suite, click the Customize button and uncheck the programs you don't want. Enter your Mac login password, if prompted, and then click Install Software. (This is the password that you use to log in to your Mac.) The software begins to install. Click Close when the installation is finished. If Microsoft 365 installation fails, see What to try if you can't install or activate Office for Mac. Launch an app and start the activation process Click the Launchpad icon in the Dock to display all of your apps. Click the Microsoft Word icon (or another Microsoft 365 or Office icon) in the Launchpad. The What's New window opens automatically when you launch Word. Click Get Started to start activating. If you need help activating Microsoft 365 or Office, see Activate Microsoft 365 or Office for Mac. If activation fails, see What to try if you can't install or activate Microsoft 365 or Office for Mac. Installation notes Installation notes How do I pin the app icons to the dock? Go to Finder > Applications and open the Office app you want. In the Dock, Control+click or right-click the app icon and choose Options > Keep in Dock. Can I install Microsoft 365 on my iPhone or iPad? Yes, see Install and set up Microsoft 365 apps on an iPhone or iPad and set up email on an iOS device (iPhone or iPad). Sign in or installation FAQ The following are a few of the more common questions or issues when trying to install Microsoft 365 or Office. Tip: Don't see your issue listed? Try Troubleshoot installing Microsoft 365 or Office for additional issues and their possible solutions. Account questions: I don't have a Microsoft account yet, or I forgot my username or password Before you can install Microsoft 365 or Office you need to associate it with a Microsoft account, or work or school account. If you have an home product and bought Microsoft 365 or Office at a retail store or online store, but don't have a Microsoft account, it's possible you haven't redeemed your product key yet (if you got one), or you missed the step for linking your recent purchase with an account. Do the following to link an account with Microsoft 365 or Office. For an Office for home product, go to office.com/setup and create a new Microsoft account or sign in with an existing one, then follow the remaining steps on that page such as entering your product key (if you have one). Your account is successfully associated with Microsoft 365 or Office when you see the page, My Office Account followed by your Microsoft account email address, and a button to install the apps. Select the PC or Mac tabs above to help you with the rest of the install process. If the Microsoft account or work or school account isn't working, see I forgot the username or password for the account I use with Office. I don't see an option to install Microsoft 365 or Office after signing in with my work or school account After signing in with your work or school account you don't see an option to install the desktop applications on the Microsoft 365 home page, go directly to the Microsoft 365 Software page instead. Select the language and bit-version you want (PC users can choose between 32-bit and 64-bit), and then click Install. See Step 2 and 3 on the PC or Mac tabs above to help you with the rest of the install process. Notes: If your organization uses Microsoft 365 operated by 21Vianet in China, sign in to the Microsoft 365 Software page at https://portal.partner.microsoftonline.cn/OLS/MySoftware.aspx. If your organization uses Microsoft 365 Germany, sign in to the Microsoft 365 Software page at https://portal.office.de/OLS/MySoftware.aspx. If you still don't see an option to install Microsoft 365 on the Microsoft 365 Software page, it's possible your admin hasn't assigned a license to you. Find out if you have a license to install Microsoft 365. If you're a student or teacher and your institution didn't give you a license, find out if you're eligible to Get Microsoft 365 for free. I can't sign in with my work or school account If you're trying to sign in with your work or school account to www.office.com and your sign in is blocked, it likely means your Microsoft 365 administrator set up a security policy that's preventing you from signing in to that location. To install Microsoft 365, try signing in directly to the Microsoft 365 Software page instead. Select the language and bit-version you want (PC users can choose between 32-bit and 64-bit), and then click Install. See Steps 2 and 3 on the PC or Mac tabs above to help you with the rest of the install process. Notes: If your organization uses Microsoft 365 operated by 21Vianet in China, sign in to the Microsoft 365 Software page at https://portal.partner.microsoftonline.cn/OLS/MySoftware.aspx. If your organi'''
