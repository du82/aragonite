["https://support.microsoft.com/en-us/surface/cbc47825-19b9-4786-8088-eb9963d780d3"]
title = "Product safety guidelines - Microsoft Support"
description = "Learn more about Microsoft product safety for Surface, Xbox and HoloLens, including product safety warnings and information on how to report a product safety event."
full_description = "Microsoft cares about the safety of our customers and employees. We plan, design, manufacture, sell and maintain Surface, Xbox, and HoloLens devices to meet or exceed industry standards. Our products are certified to applicable international safety standards. Commitment to product safety Microsoft is committed to product safety. Safe use and handling: We provide safety information for our products with labels, user guides, and online content, and encourage everyone to use this information to understand how to use our products. Safety monitoring and continuous improvement: Creating safe products supports Microsoft’s mission to empower every person and every organization on the planet to achieve more. We monitor product performance, customer concerns, and the effectiveness of our programs to continuously improve product safety. We examine ideas and guidelines from industry associations, governmental agencies, and customers, and search for new and emerging practices and technologies. Digital and online safety: In addition to our dedication to the physical safety of our Surface, Xbox, and HoloLens products, Microsoft is also committed to digital and online safety. To learn more, see Online safety and Digital safety. Registering for product safety alerts To only receive messages from Microsoft if there is a product safety alert or recall for your device, you may do so by selecting the following link: Product safety notifications sign-up form. We recommend that you register your devices to receive warranty information, product safety alerts, and other information relevant to your product(s). To do so, see Register your Surface or Xbox.​​​​​​​ Product safety warnings Microsoft provides safety warnings and instructions with our hardware products to help you effectively use and enjoy your devices. If you would like to review our product safety warnings and instructions online, see Product safety warnings and instructions.​​​​​​​ ​​​​​​​Report a product safety event If you believe your Microsoft device has experienced a potential product safety event, such as emitting smoke or sparks, showing signs of heat damage or melting, or damaging other property or causing personal injury, we encourage you to report the event to Microsoft by selecting the following link where you will be able to provide the full details of the issue you experienced. Report a product safety event Make sure to keep all items related to the event with you, as you’ll be requested to provide photos of the Microsoft device, as well as other details you’ve previously reported. In some cases, Microsoft will need to collect your device to investigate the report. Alerts Microsoft AC power cord recall for eligible Surface Pro 3 or earlier devices For regulator information and queries please click here ."
