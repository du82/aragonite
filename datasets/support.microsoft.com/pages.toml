["https://support.microsoft.com/en-us/office/the-microsoft-365-app-transition-to-the-microsoft-365-copilot-app-22eac811-08d6-4df3-92dd-77f193e354a5"]
title = "The Microsoft 365 app transition to the Microsoft 365 Copilot app - Microsoft Support"
description = "The Microsoft 365 (Office) app is now called the Microsoft 365 Copilot app. Get the details about the change and what it means to you."
full_description = "The Microsoft 365 (Office) app is now called the Microsoft 365 Copilot app across web, mobile (iOS, Android), and Windows. The new app name and icon reflects the integration of Copilot within the Microsoft 365 app. The Microsoft 365 Copilot app continues to serve as your everyday productivity app for work and life. But in the era of AI and integration of Copilot, it's become much more than that. We've made several commercial enhancements to innovate the work experience and will soon bring this innovation to consumers with personal accounts. The app remains your starting place to find, create, share, and collaborate in one place with access to your favorite productivity applications. This branding change represents the additional ways you can collaborate with Microsoft 365 Copilot Chat for tasks such as asking questions, creating content, drafting documents, and building agents with a work account. Please find more details on this change below.​​​​​​​ What is changing? The app icon and name, “Microsoft 365 Copilot,” will begin rollout on January 15th, 2025. The web URL will also be updated to m365.cloud.microsoft to align with Microsoft’s broader unified cloud.microsoft domain for all Microsoft 365 apps. Both office.com and microsoft365.com URLs will automatically redirect. To learn more, click here. Will existing users need to take any action? Existing users with a work and/or personal account will see these changes reflected on their web, mobile (iOS, Android) and Windows app on January 15th, 2025. If you're signed in and still not seeing the change, make sure to connect to the internet and then restart the Microsoft 365 Copilot app. Do all users get access to Copilot functionality within the Microsoft 365 Copilot app? For work or school accounts: Copilot Chat is available to users with a Microsoft 365 license at no additional cost and users with a Microsoft 365 Copilot license. For personal accounts: Copilot Chat in the Microsoft 365 Copilot app is coming soon for Microsoft 365 Personal and Family subscribers (primary account holders only). Copilot Chat will not be available for users without a Microsoft 365 Personal or Family subscription. Learn more about Microsoft 365 subscription plans here. What is the difference between the Microsoft 365 Copilot app vs. standalone Microsoft Copilot app? The Microsoft 365 Copilot app is your everyday productivity app for work and life that helps you find and edit files, scan documents, and create content on the go with access to Microsoft 365 Copilot Chat*, Word, Excel, PowerPoint, PDFs, and more all in one app. The Microsoft 365 Copilot app is available to users with Entra accounts (work or school) and personal Microsoft accounts. The Microsoft Copilot app is the AI companion for everyday life. Its conversational chat experience is an easy way to learn, grow and gain confidence, all with the help of the latest large language models. The Microsoft Copilot app is only available to users with a personal Microsoft account. ​​​​​​​​​​​​​​*Microsoft 365 Copilot Chat in the Copilot app is available for Microsoft 365 Enterprise, Academic, and SMB subscribers with a work or school account. Copilot Chat is coming soon for Microsoft365 Personal and Family subscribers (primary account holders only). ​​​​​​ What about regions where Copilot is not available? For regions without Copilot availability, the Microsoft 365 Copilot app will remove the Copilot tab from the Home screen across web, desktop, and mobile app endpoints. However, the app name and icon will remain the same as Microsoft 365 Copilot for branding consistency.​​​​​​​"
year_published = 2025
