title = "How to sign in to a Microsoft account - Microsoft Support"
description = "Use your Microsoft account to sign in to Microsoft services like Windows, Microsoft 365, OneDrive, Skype, Outlook, and Xbox Live."
full_description = '''Microsoft accounts are for personal use, and for accessing services like Outlook.com, Xbox or Skype. Microsoft work and school accounts are for organizations that use Microsoft 365 for business. Choose your account type, or learn more about the differences. Microsoft account (personal)Work or school account To sign in to your Microsoft personal account, go to account.microsoft.com or select Sign in below.Sign in Tip: If you don't have a Microsoft account, you can select "No account? Create one!" Enter your email, phone number, or Skype sign-in that you use for other services (Outlook, Excel, etc.), then select Next. Tip: You can use any of the email address aliases you may have on your account - they all have the same password. Enter your password and select Sign in. Can't sign in If you can't sign into your Microsoft account, use our guided tool below to help you find the correct solution. Start See also Sign in to Hotmail or Outlook.com ​​​​​​​ Sign in to Windows Sign in to Office Sign in to Xbox Live How to check if your email address is a Microsoft account Accessing Outlook.com, OneDrive and other Microsoft services when someone has died The My Account portal helps you to manage your work or school account by setting up and managing your security info, managing your connected organizations and devices, or viewing how your organization uses your data. To sign in to your work or school account, go to myaccount.microsoft.com or select Sign in below.Sign in See also Learn more about work or school accounts Sign in to Windows Sign in to Office How to check if your email address is a Microsoft account'''
