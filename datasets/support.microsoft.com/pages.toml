["https://support.microsoft.com/en-us/office/copilot-is-now-in-microsoft-365-personal-and-family-35b88a54-fe01-49f5-8789-b74e239d8dc0"]
title = "Copilot is now in Microsoft 365 Personal and Family - Microsoft Support"
description = "Copilot is now in Microsoft 365 Personal and Family subscription plans. Get the details about what you'll see in your AI-powered productivity suite."
full_description = "The productivity apps and creativity tools you know and love are getting an upgrade. Copilot is now available in Microsoft 365 Personal and Family subscriptions, helping you to enhance your skills and uncover new possibilities. With spacious cloud storage, advanced security, and AI-powered features, Microsoft 365 helps you easily achieve more, whether you want to optimize your day or create content quickly. Microsoft 365: Your new AI-powered productivity suite Here are the updates you'll see: Get Word, Excel, PowerPoint, OneNote, and Outlook desktop apps, now enhanced with Copilot Create eye-catching designs and edit photos like a pro with the help of AI in Microsoft Designer. A new credit model designed to provide a range of options to suit your needs. To learn more, see Understanding AI credits With Copilot in your Microsoft 365 Personal or Family subscription, you can: Communicate with confidence. In Word, ask Copilot to help you draft that formal letter, give you suggestions on tone, or rewrite phrases to help you get your point across the way you want. Quickly summarize an email discussion with your family or friends to get the details you need in Outlook. Try PowerPoint to go from blank slide to complete presentation in a snap. ​​​​​​​Plan your next family vacation. Ask Copilot in OneNote to create a travel itinerary for your destination. Copilot can also provide weather updates to ensure you're prepared for your trip. You can even ask Copilot in Excel to analyze your budget spreadsheet and offer ideas to help ensure your trip stays within budget. Bring your ideas to life with Designer. Touch up personal photos with AI-powered editing or create captivating graphics effortlessly to share on social media, as personalized invitation, and more, no matter your design experience. For more information, see Frequently asked questions about Copilot in your Microsoft 365 Family and Personal subscriptions ​​​​​​​ Learn more Microsoft Copilot help & learning"
