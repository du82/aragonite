full_description = "This page lists accessibility tools for Outlook. Here you'll also find tools to make your Outlook emails accessible for everyone. Work with keyboard shortcuts in Outlook Keyboard shortcuts for Outlook Use Loop components with a keyboard in Outlook Use a screen reader in Outlook Screen reader support for Outlook Use Copilot with a screen reader in Outlook Use Copilot in Outlook with a screen reader​​​​​​​ Type with your voice Dictate your documents in Word, PowerPoint, Outlook, and OneNote Use Immersive Reader to read and write emails Languages and products supported by Immersive Reader Use Immersive Reader in Outlook Create accessible emails in Outlook Make your Outlook email accessible to people with disabilities Improve accessibility with the Accessibility Checker Check accessibility while you work in Office apps Other helpful tools Use Microsoft Editor as your writing assistant Translator for Outlook Use Search/Tell Me to find the command you want Find what you need with Microsoft Search in Office Do things quickly with Tell Me Set up your device to work with accessibility in Microsoft 365 Accessibility support for Windows Technical support for customers with disabilities Microsoft wants to provide the best possible experience for all our customers. If you have a disability or questions related to accessibility, please contact the Microsoft Disability Answer Desk for technical assistance. The Disability Answer Desk support team is trained in using many popular assistive technologies and can offer assistance in English, Spanish, French, and American Sign Language. Please go to the Microsoft Disability Answer Desk site to find out the contact details for your region. If you are a government, commercial, or enterprise user, please contact the enterprise Disability Answer Desk."
