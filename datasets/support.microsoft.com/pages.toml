full_description = "Hardware warranty, services, and repair What does my warranty cover? Your Microsoft device or accessory comes with a Standard Limited Warranty. Terms and conditions vary by country or region. Read warranty terms For more info about your Surface warranty, see Surface warranty : FAQ. Check your warranty status If you have a Surface or Xbox device or accessory, use your Microsoft account to check the warranty and make warranty claims on account.microsoft.com/devices. Check warranty status To check the warranty status for Microsoft accessories like mice, keyboards, cameras, or headsets, contact us. For more detailed info, see Check your Microsoft warranty and create service orders or Manage devices used with your Microsoft account. For Surface for Business, visit Surface Support for Business Online Service Center. Stay covered with Microsoft Complete Get Microsoft Complete Protection Plan when you purchase your device. All Microsoft devices and accessories come with a Standard Limited Warranty. Microsoft Complete provides extended hardware and accidental damage coverage. After purchase, you’ll also receive unlimited technical support from Microsoft. Available in select markets only. For more info about Microsoft Complete, see Microsoft Complete protection plan. For Surface for Business, visit Surface warranty and support plans. Get service for your Microsoft device or accessory Need to service your Microsoft device or accessory? Sign in to account.microsoft.com/devices and get service for your Surface, Surface accessory, Xbox, or Xbox accessory. Sign in to get service To get support for Microsoft accessories like mice, keyboards, cameras, or headsets, visit Microsoft PC accessories help and learning. For more info on the service process, see How to get service for Surface or Getting your Xbox device serviced. Before you get service for your Surface Get service for your out-of-warranty or damaged Surface See your options if your Surface device is out of warranty, damaged, or has a cracked screen. See the steps How much does out-of-warranty service cost for your Surface device or accessory? If your device is no longer covered by the standard limited warranty or Microsoft Complete, you may be eligible for out-of-warranty services. See service costs Find Surface Walk-in Center and Authorized Service Provider contact information Microsoft has support options for your Surface through Authorized Reseller Customer Service Centers and Authorized Service Providers. Not available in all countries and regions. Find a location Find the serial number on Microsoft or Surface device There are several ways you can find the serial number for your Microsoft or Surface device or accessory. Find serial number Other warranty and service info Service information Is my service order delayed? Update your warranty with your proof-of-purchase Model specific information Surface Pro 4 screen flickers or is scrambled Microsoft AC power cord recall for eligible Surface Pro devices Service and repair for Surface How to prepare for service How to get service or repair How to set up after service How to self-repair your Surface Other legal documents Microsoft License Terms Product safety warnings and instructions Surface regulatory information"
