["https://support.mozilla.org/en-US/kb/switching-devices"]
title = "Back up and transfer your Firefox data to a new device | Firefox Help"
description = "Learn how to transfer your browser data when switching devices using Firefox Sync. Back up your bookmarks, history, passwords, etc. with your Mozilla account."
full_description = "Firefox Firefox Last updated: 10/21/24 47% of users voted this helpful Learn how to move, install or migrate Firefox to a new device. Once you enable your Firefox Sync backup, whenever you change your phone or computer to a new device, you will be able to install Firefox without losing your data. Your bookmarks, browsing history, passwords, and open tabs will migrate with you securely. Backup assistant Frequently asked questions How can I back up my data later? If you aren’t able to perform a data backup at this time, you can do it later from the Firefox menu. These are the steps you need to follow: Click the menu button in the top right corner of the screen. Click Help. Click Switching to a new device. Follow the steps in the setup assistant to back up your data. What can I do if I lost my password? To access your backed-up Firefox data, you need to log in to the same Mozilla account you used on your old device. If you forgot your password, you’ll need to reset it using recovery keys. Resetting your password without recovery keys will wipe all your data for security reasons. What data is included in a backup? In this process, we back up the following data: Bookmarks History Lists of open tabs Passwords Saved addresses Saved credit cardsPayment methods Installed add-ons Selected settings Can I choose what data I want to sync? Yes, you can choose the data you want to sync in step 2 of the wizard, by clicking the browser settings link. You can also change this later by following the steps in How do I choose what information to sync on Firefox? How do you handle my data? When backing up your data, your history, passwords, addresses, and credit cards are included. However, we do not collect this information and it remains accessible to you alone. Here is a list of frequently asked questions regarding how we handle user data. Can I back up my data without a Mozilla account? Yes. You can learn how to save your browser data without having to sign up for an account by checking out the steps in Back up and restore information in Firefox profiles. Share this article: https://mzl.la/3MVgbx8"
year_published = 2025
