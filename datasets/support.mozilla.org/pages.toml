["https://support.mozilla.org/en-US/kb/access-mozilla-services-firefox-account"]
title = "Access Mozilla services with a Mozilla account | Mozilla Support"
description = "Mozilla account is a safe and easy way to access Mozilla services on all your devices. Learn how to create an account and access services."
full_description = "Firefox, Mozilla Account Firefox, Mozilla Account Last updated: 1 week, 2 days ago 70% of users voted this helpful Mozilla accounts let you access Mozilla services on any device with the Firefox browser by simply signing in. All you need to create a Mozilla account is an email address and a password. Table of Contents1 How do I sign up for a Mozilla account?2 What services can I use with a Mozilla account?3 What makes Mozilla accounts different? How do I sign up for a Mozilla account? You can access the sign-up page on each Mozilla service, or visit the Mozilla accounts signup page and follow the steps below: Enter your email address and click Sign up or sign in. Enter a password and your age, then click Create account. We ask your age to meet the Children's Online Privacy Protection Rule of the USA legislation. When the Mozilla accounts email arrives, enter the 6-digit confirmation code. Once your account has been confirmed, sign in to your favorite Mozilla Service using your newly created account. After you sign up, you can also sign in and add an image to your profile. If you have problems confirming your account, please see I'm having problems confirming my Mozilla account. Note: You can also use your existing Google or Apple ID to sign up for a Mozilla account. This eliminates the need to remember yet another username and password. To learn more, see Sign in to a Mozilla account using 3rd-party authentication. What services can I use with a Mozilla account? The following Mozilla services are available: Firefox Sync: Access your browsing data, like bookmarks, history, passwords, and open tabs on your desktop, laptop, and phone with just one Mozilla account login. Pocket for Firefox: Save web pages to your reading list. Firefox Add-ons: Add features to Firefox by developing add-ons. See Access your add-ons with a Mozilla account. Mozilla Support: Help other users by answering questions and contributing to help articles. See Mozilla account on support.mozilla.org. Mozilla Monitor: Learn if your information was exposed in a data breach and how to take action to protect your online accounts. See Get started with Mozilla Monitor. MDN Plus: You can upgrade your access to the Mozilla Developer Network (MDN) with MDN Plus. Mozilla Connect: Give product feedback, share ideas for new features, and participate in discussions that help shape future product releases. See What is Mozilla Connect?. Firefox Relay: Relay email masks protect your true email address from public view and automatically forwards messages to your true inbox. Mozilla VPN: A Virtual Private Network for desktop and mobile devices. What makes Mozilla accounts different? At Mozilla, we put your privacy first. Any data you store on our servers is encrypted with your password, making it impossible for anyone without your password to read your data—even Mozilla. The benefit of this is that no one can mine your data to create a profile of you. However, it does require that you make a password that is both strong and memorable. If you forget your password and reset it, your storage is wiped clean and replaced with what is currently saved in Firefox on your devices. Share this article: https://mzl.la/3BWU1pq"
