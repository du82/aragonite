description = "Firefox automatically updates itself by default, but you can always do a manual update. Learn how to update Firefox on Windows, Mac, or Linux."
full_description = "Firefox Firefox Last updated: 11/18/24 55% of users voted this helpful Note: If you use your Linux distribution's packaged version of Firefox, you will need to wait for an updated package to be released to its package repository. This article only applies if you installed Firefox manually (without using your distribution's package manager). Note: This article only applies if you installed Firefox by downloading it from Mozilla. If you installed Firefox from the Microsoft Store, then you will receive Firefox updates through the Microsoft Store. To check for Firefox updates on the Microsoft Store, see this Microsoft article. Firefox updates automatically by default but you can always check for updates at any time. Update Firefox Click the menu button at the right side of the Firefox toolbar, go to Help, and select About Firefox.In the menu bar, open the Firefox menu and choose About Firefox. The About Mozilla FirefoxAbout Firefox window will open. Firefox will check for updates automatically. If an update is available, it will be downloaded. When the download is complete, click Restart to update Firefox. Having problems? If you're having problems updating Firefox, download the Firefox installer, then close Firefox and run the installer. All of your data will be preserved. Configure how Firefox installs updates In the Menu bar at the top of the screen, click Firefox and then select Preferences or Settings, depending on your macOS version.Click the menu button and select Settings. In the General panel, go to the Firefox Updates section. Note: To learn about the option to install updates when Firefox is not running, see Enable background updates on Firefox for Windows when Firefox is not running. Share this article: https://mzl.la/3vTLpvM"
