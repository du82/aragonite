["https://support.mozilla.org/en-US/kb/how-change-your-default-browser-firefox-windows"]
title = "Make Firefox your default browser on Windows | Firefox Help"
description = "Grow and share your expertise with others. Answer questions and improve our knowledge base."
full_description = '''Firefox Firefox Last updated: 9/26/24 73% of users voted this helpful Whether you're using Windows 10 or the latest Windows 11, this guide will help you set Firefox as your default browser with minimal fuss. Setting Firefox as your default browser on Windows has become a bit more involved due to changes in how Windows manages default applications. With the release of Firefox version 126, we introduced a new guidance notification feature to help you easily navigate these changes. Note: This article applies to Windows 10 or Windows 11. For previous versions of Windows, see Make Firefox your default browser. If you don’t currently have Firefox installed on your computer, first download and install Firefox. Table of Contents1 How to set Firefox as your default browser1.1 Make Firefox your default browser in Firefox Settings1.2 Manually set Firefox as your default browser in Windows settings1.2.1 For Windows 101.2.2 For Windows 112 Related articles How to set Firefox as your default browser Make Firefox your default browser in Firefox Settings In the upper-right corner of your screen, click to open the Firefox menu. Select Settings. In the General panel, find the Startup section. If Firefox isn't currently set as your default browser, you'll see the message Firefox is not your default browser. Click the button. If you see this toast notification, it indicates that the one-click default setting did not work, and you will need to take additional steps in your Windows settings. To easily open Firefox later, add a shortcut to your taskbar: On your computer, open Firefox. At the bottom, in the Windows taskbar, right-click Firefox. Click Pin to taskbar. Manually set Firefox as your default browser in Windows settings If the guidance notifications do not appear, don't worry. You can easily set Firefox as your default browser manually by following these steps: For Windows 10 Click the Windows Start button. Type "Default apps" into the search bar. Select 'Default apps' from the search results. In the 'Default apps' menu, find and click on your current default browser listed under 'Web browser'. Choose Firefox from the list of available options to set it as your default browser. To easily open Firefox later, add a shortcut to your taskbar: On your computer, open Firefox. At the bottom, in the Windows taskbar, right-click Firefox. Click Pin to taskbar. For Windows 11 Click the Windows Start button. Type "Default apps" into the search bar. Select 'Default apps' from the search results. In the 'Default apps' window, scroll to find Firefox. Click on Firefox. Set Firefox as the default for each file type or link type you need by navigating through the settings provided. To easily open Firefox later, add a shortcut to your taskbar: On your computer, open Firefox. At the bottom, in the Windows taskbar, right-click Firefox. Click Pin to taskbar. Related articles Make Firefox your default browser Setting Firefox as the default browser does not work - What to do Share this article: https://mzl.la/3BYfa2q'''
year_published = 2025
clearnet = "https://support.mozilla.org/en-US/kb/how-change-your-default-browser-firefox-windows"
