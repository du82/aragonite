title = "Squarespace permissions explained – Squarespace Help Center"
description = """
Enable contributors to edit your site, update billing, and more.
If you have multiple contributors, you can use permissions to limit access to areas that are relevant to each contributor's work. Th..."""
full_description = "Note: While our most popular guides have been translated into Spanish, some guides are only available in English. Squarespace permissions explained Last updated January 31, 2025 20:11 Sections Enable contributors to edit your site, update billing, and more. If you have multiple contributors, you can use permissions to limit access to areas that are relevant to each contributor's work. This guide explains what each contributor role can and can't do, so you can decide which permissions to assign to your team. Note: Squarespace domains that don't share billing information with a Squarespace website have different contributor roles than those in this guide. To learn more, visit Managing domain permissions. Tips You can assign a contributor multiple roles, or make them an administrator so they have the permissions of all other roles. To publish blog posts by different authors without giving them contributor permissions, add them as basic authors instead. Domains linked to parking pages can only have an owner and administrators. Other permission levels aren't available on parking pages. Contributors can remove themselves at any time. If your company wants to purchase or manage sites in bulk with multiple site contributors, you can work with us to create a customized solution. To learn more, visit our Enterprise page. The Permissions & Ownership panel In the Permissions & Ownership panel, the owner and administrators can: Invite contributors Add basic authors Enable all contributors to license Getty Images by switching the Let non-admins purchase assets on. Edit contributor permissions Remove contributors Transfer ownership (owner only) Available permissions The type of permissions available depend on your subscription. All subscription types Most Squarespace subscriptions include these permissions: Permission type Description Owner There’s only one owner, typically the account that created the site or other subscription. Owners can manage all content and settings. They can also transfer the permission to a different account, which might happen if a designer creates a site for a client, or if someone new in an organization starts managing web content. Administrator Administrators can do almost everything the owner can do, except change ‌ownership. This is a good permission level for collaborators who need full access. Billing Accounts with billing permissions can change or cancel subscriptions and view invoices. They can’t add or edit content. This is a good permission level for someone who manages your finances. Websites These permissions are for Squarespace websites: Permission type Description Website editor Website editors can add products, blocks, and other content to existing pages. They can’t add new pages or make style changes. This is a good permission level for someone who updates your site regularly, but doesn’t make broad design decisions. Analytics (previously Reporting) Accounts with analytics permissions can access website and commerce analytics panels. Comment moderators Comment moderators can comment on blog posts without moderation and edit comments in the comments panel. They also receive email notifications for new comments. Store manager Store managers can add products, reorder products, manage orders, and invoice clients. They can also add some content like blog posts and events. This is a good permission level for someone who manages your online store. Email Campaigns editor Email Campaigns editors can create, send, and track analytics for Email Campaigns. They can't add or make changes to an Email Campaigns subscription. Viewer Accounts with viewer permissions can view password-protected sites without entering the site password and private sites. They still need the page password to view password-protected pages. Acuity Scheduling You can assign these permissions if you log in to Acuity with a Squarespace account: Permission type Description Scheduling administrator Scheduling administrators can view and manage all content in the scheduling panel. Scheduling view & edit Contributors with Scheduling view and edit permissions can view and edit calendars assigned to them. Scheduling view only Contributors with Scheduling view-only permissions can view calendars assigned to them. If you log into Acuity with an Acuity account, you can assign staff the same levels of access, but using a different process. To learn more, visit Adding and managing Acuity contributors. Enterprise If you’re on an Enterprise plan, you can assign organization-level roles, and site-level permissions to the team members in your organization: Organization role Description Team administrator Team administrators can access and edit all organization-owned websites, create and publish sites in an organization, and manage other members of their organization, including each member’s permissions at both the organization and site level. Team member Team members can access select organization-owned websites, and create trial sites in the organization. Site-level permission Description Admin Administrators have full access to edit site content and change site settings. Website manager Website managers have full access to the Pages panel to edit site content and update page settings, the Design panel to customize the site’s style and design, and the Asset library to manage images and videos. Website editor Website editors can edit website content, but can’t change site settings. Website editors can also manage images in the Asset library. Draft editor Draft editors can create, edit, save, and delete page drafts, but can't edit non-draft pages, or publish any changes. Draft editors can also manage images in the Asset library. None The member can't edit the website's content or settings. Settings access These permissions are for features and settings found in your Settings panel. If a permission type isn't listed, contributors with those permissions can't make changes in this part of the site. Note: Squarespace domains that don't share billing information with a website have different contributor roles than those in this guide. To learn more, visit Managing domain permissions. Owner Administrator Billing Buy or connect domains ✓ ✓ - Change business information ✓ ✓ - Change site availability ✓ ✓ - Change site language ✓ ✓ - Change site ownership ✓ - - Connect Squarespace Extensions ✓ ✓ - Connect third-party accounts ✓ ✓ - Delete the site ✓ ✓ ✓ Edit comments settings ✓ ✓ - Enable developer mode (version 7.0 only) ✓ ✓ - Import/export ✓ ✓ - Manage domains ✓ ✓ - Manage Google Workspace billing ✓ ✓ - Manage notifications settings ✓ ✓ - Manage permissions ✓ ✓ - View owner email address ✓ - - Billing access These permissions are for viewing and editing your site's billing settings. Owners, administrators, or team members with billing permissions can: Cancel subscription Change billing plan Upgrade trial to paid service View and change billing information View invoices Commerce access These permissions are for using your online store's Commerce features. If a permission type isn't listed, contributors with those permissions can't use these features. Website editors have commerce permissions for editing site content. Store managers have basic commerce permissions for managing the day-to-day needs of an online store. Owner/Administrator Website editor Store manager Add, edit, or remove all products ✓ ✓* ✓ Buy shipping labels ✓ - - Change shipping settings ✓ - - Change store currency ✓ - - Change tax settings ✓ - - Connect a payment processor ✓ - - Create, edit, and delete discounts ✓ - - Edit checkout settings ✓ - - Edit customer email notifications ✓ - - Edit related products ✓ - - Enable/disable customer reviews ✓ - - Fulfill, cancel, and refund orders ✓ - ✓ Invoice clients and manage projects ✓ - ✓ Manage donations ✓ - ✓ Manage accounting data ✓ - ✓ Reorder products ✓ ✓ ✓ Use Squarespace point of sale ✓ - - View orders ✓ - ✓ * Website editors can edit products, except for subscription product settings. Pages and content access These permissions are for viewing, adding, and editing site content, like pages and blocks. If a permission type isn't listed, contributors with those permissions can't make changes in this part of the site. Owner/Administrator Website editor Billing Storemanager Viewer Add and edit blog posts ✓ ✓ - ✓ - Add and edit events ✓ ✓ - ✓ - Add and edit gallery images ✓ ✓ - ✓ - Add and edit portfolio sub-pages (version 7.1 only) ✓ ✓ - ✓ - Add code blocks ✓ ✓ - ✓ - Add code injection ✓ - - - - Add pages ✓ - - - - Comment without moderation ✓ ✓ ✓ ✓ - Connect third-party storage options to form blocks ✓ - - - - Delete pages ✓ - - - - Edit cover pages (version 7.0 only) ✓ ✓ - ✓ - Edit footers ✓ ✓ - ✓ - Edit headers (version 7.0 only) ✓ ✓ - ✓ - Edit navigation titles and URL slugs ✓ - - - - Edit page content ✓ ✓ - ✓ - Edit page settings ✓ - - - - Reorder pages ✓ - - - - Reply to comments ✓ - - - - View password-protected site content ✓ ✓ - ✓ ✓ View trash can and restore pages ✓ - - - - Design access Only the owner and administrators can make design changes to a site. This includes: Changing the logo and title Creating a lock screen Creating an announcement bar Making style changes Switching templates (version 7.0 only) Asset library access Only the owner, administrators, website editor, store manager, and Email Campaigns editor can access and manage the asset library. This includes: Accessing and using the asset library Adding content to the asset library Deleting content from the asset library Editing asset library content Downloading asset library content Emptying asset library trash Restoring deleted content Organizing asset library content using folders Licensing Getty images Analytics access Only the owner, administrators, and analytics contributors can view a site's analytics panel. Contacts access These permissions are for information found in your Contacts panel. If a permission type isn't listed, contributors with those permissions can't access this part of the site. Owner/Administrator Store Manager Email Campaigns editor Access to Subscribers ✓ ✓ ✓ Access to Leads ✓ ✓ ✓ Access to Customers ✓ ✓ - Access to Members ✓ ✓ - Access to Donors ✓ ✓ - Access to Form Submitters ✓ ✓ ✓ Add Subscribers ✓ - ✓ Manage Tags ✓ ✓ ✓ Export contacts ✓ ✓ - Delete contacts ✓ ✓ - Marketing access These permissions are for features and settings found in your site's marketing panel. If a permission type isn't listed, contributors with those permissions can't make changes in this part of the site. Owner/Administrator Billing Email Campaigns editor Store Manager Automations ✓ - ✓ - Create mailing lists ✓ - ✓ ✓ Create sender details ✓ - ✓ - Draft and send email campaigns ✓ - ✓ - Edit promotional pop-up settings ✓ - - - Edit share button settings (version 7.0 only) ✓ - - - Manage Email Campaigns billing ✓ ✓ - - Manage SEO settings ✓ - - - Import and export mailing lists - - ✓ ✓ Email notifications Contributors receive automated email notifications from Squarespace based on their permissions and what information they typically need to review in their role. To manage email notifications, visit the Notifications tab of your contributor profile. Emails are sent to the email address in your profile. You can review and update your email address in the Account & Security tab of your contributor profile. Note: Administrators and contributors with billing permissions receive important emails related to the site's billing status. Because these contain essential information, it isn't possible to disable these notifications. If a permission type isn't listed, contributors with those permissions won't receive email notifications. Owner/Administrator Billing Store manager Billing notifications ✓ ✓ - Comments notifications ✓ - - Commerce orders and donations notifications ✓ - ✓ Domain verification ✓ - - Pricing plans for paywalled content ✓ - ✓ You manage site owner notifications for Acuity Scheduling separately. To learn more, visit Sending internal appointment notifications and agendas with Scheduling. Was this article helpful? Yes No 1767 out of 3406 found this helpful Related articles Inviting a contributor Editing contributor permissions Managing domain permissions Changing site ownership Logging into Google Workspace"
