["https://support.squarespace.com/hc/en-us/articles/11580957865869"]
title = "Reporting abuse – Squarespace Help Center"
description = """
How to report content or suspicious activity on a Squarespace site or associated with a Squarespace domain.
Squarespace's services are used by millions of people to express themselves, build their ..."""
full_description = '''Note: While our most popular guides have been translated into Spanish, some guides are only available in English. Reporting abuse Last updated November 15, 2024 17:05 Sections How to report content or suspicious activity on a Squarespace site or associated with a Squarespace domain. Squarespace's services are used by millions of people to express themselves, build their brands and grow their businesses. We’re proud of the creative and inspiring ways that people use our services, and we expect our users to use our platform responsibly. If you have a concern about content published to a Squarespace site or about a domain name registered with Squarespace, you can submit a report to us. We investigate all reports, and we review and address each report individually, based on the nature of the abuse contained in the report. Before you begin Visit our Terms of Service and Acceptable Use Policy to review our policies about abuse and fraudulent or illegal activity. Visit Security tips for protecting your account for account security best practices. Note: This guide is available as a resource, but shouldn't be construed or relied upon in any way as legal advice. If you believe an internet crime is taking place, consider filing a complaint through the Internet Crime Complaint Center. Per our Terms of Service, Squarespace doesn't provide advice or recommendations on any laws or requirements applicable to your site or business. Report domain abuse Squarespace Domains LLC and Squarespace Domains II LLC are committed to providing a safe and trusted service. Before submitting a domain abuse report, ensure the domain you're reporting to us is registered and managed through Squarespace (Squarespace Domains LLC or Squarespace Domains II LLC): Visit ICANN’s lookup. Enter your domain name in the search field and click Lookup. On the results page, look for the name and URL listed in the Registrar and Registrar URL sections. If Squarespace isn't your domain provider, contact the domain’s third-party provider for help. Use the table below to understand the types of suspicious domain activity we investigate and how to submit your report. Type of abuse Description Example How to report Phishing Phishing is a type of fraud that attempts to deceive users into sharing sensitive information like credit card information, passwords, or account details. "Someone using an email address associated with a domain registered at Squarespace sent me a message asking me to click a suspicious link." Complete the Phishing report form. Pharming Where phishing attempts to deceive users into sharing sensitive information, pharming attempts to redirect users to fraudulent sites through modified/hijacked DNS settings, instead of where the user originally attempted to go. “A site I used to visit is no longer available. When I try to find it online, I get redirected to a different site I believe is fraudulent in nature.” Complete the Pharming report form. Spam Spam encompasses any unsolicited bulk emails sent without the recipient's consent. This includes “spamvertising” and sending emails that violate the CAN-SPAM Act. "Someone using an email address associated with a domain registered at Squarespace is sending me unsolicited emails." Complete the Spam report form. Malware Malware, or malicious software, are programs designed to disrupt, damage, or gain access to a computer without the owner's knowledge. Malware includes viruses, spyware, ransomware, and other unwanted software. Malware being used through multiple sources are referred to as botnets. "I suspect a domain name registered at Squarespace Domains is distributing malware." Complete the Malware report form. Report copyright or trademark infringement Squarespace respects intellectual property rights and expects its customers to do the same. To learn more about how to report intellectual property infringement, visit Intellectual property and Squarespace. If you suspect someone has a registered domain that's infringing on your registered trademark, you can review ICANN’s Uniform Domain-Name Dispute-Resolution Policy. Was this article helpful? Yes No 83 out of 286 found this helpful Related articles Requesting third-party domain help About the Google Domains migration to Squarespace Squarespace's Digital Millennium Copyright Act (DMCA) designated agent Making changes to nameservers Responding to a copyright infringement notice'''
year_published = 2024
year_updated = 2024
