["https://support.squarespace.com/hc/change_language/pt"]
title = "Central de ajuda do Squarespace"
description = "In-depth articles and videos on everything Squarespace."
full_description = "• Um documento de identidade oficial, como carteira de motorista, passaporte ou cartão de residente permanente. • Um extrato bancário que mostra o cabeçalho do banco, o nome do titular da conta bancária e a cobrança mais recente do Squarespace. Você pode ocultar outros dados pessoais no documento (não é necessário para problemas na autenticação de dois fatores.) • Se você inseriu vários sites acima, anexe extratos mostrando a cobrança mais recente associada a cada site. O Squarespace respeita os direitos de propriedade intelectual e espera que os usuários façam o mesmo. O Squarespace responde prontamente a reclamações sobre violação de direitos autorais cometidas durante o uso dos Serviços. Para enviar um aviso sobre a violação de direitos autorais, você precisa enviar o formulário abaixo. Nos casos em que o Squarespace for apenas o Registrador e não prestar serviços de hospedagem na web, o Squarespace não controla o conteúdo, e o conteúdo não reside nos servidores do Squarespace; você precisará resolver a alegada violação dos direitos autorais diretamente com o proprietário do site ou com o provedor de serviços de hospedagem na web. A resposta do Squarespace aos avisos sobre uma suposta infração de direitos autorais pode incluir a retirada ou restrição do acesso ao material supostamente ilegal. As informações fornecidas no aviso sobre a violação dos direitos autorais podem ser encaminhadas ao usuário que publicou o conteúdo supostamente ilegal ou ao proprietário do site."
year_published = 2025
