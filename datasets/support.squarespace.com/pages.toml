["https://support.squarespace.com/hc/change_language/es"]
title = "Centro de ayuda de Squarespace"
description = "In-depth articles and videos on everything Squarespace."
full_description = "• ¿Ya intentaste recuperar tu cuenta en la página de inicio de sesión? Te pediremos que intentes hacerlo si todavía no lo hiciste. • Si necesitas ayuda para recuperar una cuenta de Google Workspace, comunícate con nosotros aquí. • Un documento de identidad emitido por el gobierno. Por ejemplo, una licencia de conducir, un pasaporte o una tarjeta de residente permanente. • Un extracto bancario que muestre el encabezado del banco, el nombre del titular de la cuenta de banco y el pago más reciente a Squarespace. Puedes ocultar cualquier otra información personal que aparezca en el documento. (No es necesario para problemas de autenticación en dos pasos). • Si ingresaste varios sitios web arriba, adjunta extractos que muestren el cargo más reciente asociado a cada sitio. Squarespace respeta los derechos de propiedad intelectual y espera que sus usuarios también lo hagan. Squarespace responde rápidamente a los reclamos por infracción de los derechos de copyright cometidos durante el uso de los Servicios. Para enviar una notificación de supuesta infracción de derechos de copyright, deberás enviar una notificación de infracción utilizando el formulario que sigue. Ten presente que, en los casos en los que Squarespace es solamente el Registrador de dominios y no ofrece servicios de alojamiento web, Squarespace no controla el contenido y el contenido no reside en los servidores de Squarespace; deberás resolver la supuesta infracción de derechos de copyright con el propietario del sitio o con el proveedor del servicio de alojamiento web. La respuesta de Squarespace a las notificaciones de supuesta infracción de derechos de copyright puede incluir la remoción o la restricción del acceso al material supuestamente en infracción. Ten presente que la información provista en una notificación de infracción de derechos de copyright puede enviarse al usuario que haya publicado el contenido supuestamente en infracción o al propietario del sitio."
