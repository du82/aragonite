full_description = "Contact Customer Support Chat With Us or Email Customer Care Chat directly with a customer care team member for immediate answers to your questions. We currently offer Live Chat Monday to Friday 4:00am-8pm (EST). We reply to every message we receive, 24 hours a day, 7 days a week. Use our web form to send us a message, and get help you can read whenever is most convenient. Contact Us Please choose a request type below - Starting your Squarespace account Adding and editing pages, blocks and forms Billing and paying for Squarespace Commerce Accepting payments with Squarespace Payments Google Workspace and email services for your domain Designing your site and managing your template Email Campaigns Galleries, images, and video Logging in and managing your account Purchase, connect, or transfer a domain SEO, social, and site analytics Squarespace Circle Squarespace Mobile Apps Acuity Scheduling Privacy, Policies & Terms Squarespace 5 (Legacy Platform) Security and vulnerabilities reports Account Recovery Deceased Owner Form Request a refund Squarespace Forum General US sales tax feedback Request an exemption from US sales tax Copyright Report Form Google Domains acquisition Invoicing your clients Monetized content: courses, videos, blogs, or member sites Notice of Illegal Content Trademark Report Form Phishing Report Spam Report Malware Report WHOIS contact info update/inaccuracy My site is down / email isn't working Third Party Developer OAuth Credentials Request Email Form Squarespace Capital Getting started with Squarespace Payments Check your eligibility, then set up your account to start collecting payments. Managing payments and payouts with Squarespace Payments An overview of the features and capabilities of your Squarespace payments and payouts dashboards. Understanding a negative balance with Squarespace Payments Overview of negative balances and auto-debits, and how it affects your Squarespace Payments account. Understanding Squarespace Payments account permissions Overview of the available permissions and what features you can access with each permission level. Managing your Squarespace Payments account Edit your business and payment details and review important account information. Adding background videos Learn how to add an externally hosted video as a banner or page background. The video plays on loop without sound, and won’t appear on mobile. Deleting pages or blog posts Review the different ways to delete pages and posts from your site. Restoring deleted pages or blog posts Restore any page you’ve deleted in the last 30 days. Setting a homepage Learn how to set the page that displays first when someone visits your site. Blog comments and simple likes Review and manage the comments visitors add to your blog posts. How visitors comment on your blog Visitors can comment on your post and interact with comments left by others. Starting a Squarespace trial site Information about trials and the limits that apply. Video Series: Getting Started with Squarespace Familiarize yourself with Squarespace’s pages, design options, SEO tools, and account dashboard. Extending your website trial Continue to test out Squarespace for an additional 7 days before upgrading to a paid service. Choosing the right template All Squarespace templates can work for any purpose, but there are different factors to consider as you build your site. Understanding Squarespace templates How templates work and how they're developed. Choosing the right Squarespace plan Select a website, Commerce, or domains package that includes the features you need for your business or project. Hiring a Squarespace Expert You can hire an independent designer to help you with your site through Squarespace Marketplace. Getting started with Squarespace Commerce Review the basics of building a site for your store, including adding products, marketing, and fulfilling orders. Video Series: Introducing Commerce A step-by-step tutorial about setting up your ecommerce site. Commerce FAQ Review common questions about using Squarespace Commerce. The Pages panel Use the Pages panel to build your site's navigation and organize your site content. Adding pages to your navigation Add pages to your navigation sections to build your site. Choose the page type that works best for your content. Pages and content basics Arrange images, videos, text, maps, and more in customized layouts. Importing and exporting content Move assets from other platforms into Squarespace to keep all of your content and data in one place. Moving from Squarespace version 7.0 to version 7.1 checklist Recreate your content and page layouts on version 7.1. URL slugs A URL slug is the exact address of a specific page on your site. Page settings Use page settings to edit a page's title, URL, thumbnail, and other options. Moving blocks to customize layouts Click and drag blocks to move them, using guidelines and boxes to choose a new placement. Resizing blocks Resize a block with Spacer Blocks, other blocks, or the cropping handle. Adding content with blocks Use drag-and-drop blocks to customize your pages with text, images, buttons, forms, and more. Blogging with Squarespace Set up and style your blog, then create posts to engage with your audience. Moving blocks to customize layouts Click and drag blocks to move them, using guidelines and boxes to choose a new placement. Resizing blocks Resize a block with Spacer blocks, other blocks, or the cropping handle. Adding content with blocks Drag-and-drop different block types on your pages to customize the content’s style and structure. Image galleries on Squarespace Showcase your images, stock photos, and videos. Index pages in version 7.0 Learn about this unique page that builds a visual summary of images and content from your site. Accepted currencies and payment methods for Squarespace billing You can pay for Squarespace using most popular credit or debit cards. Upgrading to paid service Purchase a website subscription in the Billing panel to launch your site. Changing your website billing plan Upgrade or downgrade your website subscription. Podcasting with Squarespace overview Information and resources to help you create and share audio content with listeners. Cover pages in version 7.0 Add a distinctive landing page that’s styled differently from the rest of your site. Reviewing your Squarespace account invoices You can open and print billing invoices for your Squarespace subscriptions from the Billing & Account panel of your site. Refund policies You can cancel your Squarespace subscriptions at any time in your site settings. Before you cancel, review our refund policies. Canceling a Squarespace domain Cancel within five days of registration for a full refund. I can't log in Regain access to your account with these steps. Updating your billing credit card Change your payment method in the Billing panel to continue to pay for your Squarespace subscription. Can I move my subscription to a different site? Review your current subscriptions, cancel service on the incorrect site, and then upgrade the correct one. Canceling a website subscription Options to deactivate your website subscription. Canceling a Squarespace trial Squarespace trial sites expire automatically after 14 days, but you can cancel or delete your trial before it's over. Resources for Squarespace customers during difficult times Learn more about the different tools you can use to communicate with your visitors during unexpected situations. Why did my renewal payment fail? Learn why you received a billing or payment failure email and the next steps to fix it My site is past due Learn how to trigger a new payment attempt when your site is marked “Past Due.” Free Squarespace domain offer Claim your free custom domain. Squarespace student discount Learn about the discount we offer for current students and faculty members of eligible schools. Free Google Workspace offer See if you’re eligible for a free custom email address through Google Workspace for one year. Extending your website trial If you need it, you can add extra time to your trial. Learn more in this guide. Upgrading to paid service Purchase a website subscription in the Billing panel to launch your site. Choosing the right Squarespace plan Select a website, Commerce, or domains package that includes the features you need for your business or project. I received a suspicious email. Is it from Squarespace? If you received a suspicious email that looks like it’s from us, don’t click links, download attachments, or reply to it. Report it to our Security team. VAT and Squarespace billing Unless you verify that you’re exempt, all payments you make to Squarespace are subject to VAT according to your country’s standard rate. US sales tax and Squarespace billing Review the list of cities and states where we collect sales tax on subscriptions. GST and Squarespace billing Information on taxes we collect from qualified Australian residents. Google Workspace pricing, billing, and invoices Manage payments for your Google Workspace plan. Canceling your Google Workspace account Switch to managing your service with Google, or completely cancel it. Ways to pay for your Squarespace subscription Review a list of payment methods and currencies you can use to pay for your Squarespace subscriptions. Updating your billing information Change your payment method in the Billing panel to continue to pay for your Squarespace subscription. Troubleshooting Google Workspace Steps to resolve common Google Workspace connection errors. Using Google Workspace with Squarespace Pricing and eligibility information for using Google Workspace to set up custom email. Album pages in version 7.0 Create a page with audio tracks and customized album art. Events pages Add an events page to display a calendar or list of events on your site. Adding drop-down menus to your navigation with folders Use a folder to create a drop-down navigation on your site. Adding products to your store Create and organize your products on store pages to sell your goods and services online. Reactivating a site Learn how to reactivate a cancelled or expired site by entering new billing information. Squarespace Education Program Learn about the discount we offer for current students and faculty members of eligible schools. Using Google Workspace with Squarespace Pricing and eligibility information for using Google Workspace to set up custom email. Signing up for Google Workspace Create a Google Workspace account and set up an email address for your custom domain. Logging into Google Workspace Enter your email address and password to access Google Workspace features. Managing form and newsletter storage Find the best option for saving visitor data collected from form submissions. Managing form and newsletter storage Find the best option for saving visitor data collected from form submissions. Using Mailchimp with Squarespace Grow your subscriber list, send newsletters, and sync information from your online store. Troubleshooting Mailchimp issues Fix common issues with form submissions sent to Mailchimp. Logging into Google Workspace Enter your email address and password to access Google Workspace features. Adding more Google Workspace users Learn how to add more email addresses to an existing Google Workspace account. Resetting a Google Workspace password Learn how to request a password reset for any Google Workspace user from your Squarespace site. Adding Google Workspace MX records If you’re having trouble sending or receiving email in your Google Workspace account, review your MX records. Troubleshooting Google Workspace domain verification Steps to resolve common errors that occur when authenticating your Google Workspace domain. Using Google Workspace with Squarespace Pricing and eligibility information for using Google Workspace to set up custom email. Google Workspace pricing, billing, and invoices Manage payments for your Google Workspace plan. Canceling your Google Workspace account Switch to managing your service with Google, or completely cancel it. Using Zoho Mail with your Squarespace Domain You can use Zoho Mail with the same Squarespace Domain that you use with your site. Using Office 365 with your Squarespace Domain To use Office 365 for custom email with your domain, you'll need to edit records in Advanced DNS Settings. Building a site header Style the menu and other elements that appear at the top of every page on your site. Adding banner images in version 7.0 Many templates create a banner at the top of a page automatically using page thumbnails. Learn more about adding, formatting, and styling a banner image. Editing footers Most templates include a footer, which appears at the bottom of your site. Switching templates in version 7.0 Change your site’s design and structure with a different template. Switching templates FAQ Answers to common questions about changing your site's templates. Hiring a Squarespace Expert You can hire an independent designer through Squarespace Marketplace. Choosing the right template Get advice on picking the right template. Understanding Squarespace templates How templates work and how they're developed. Squarespace Developer Platform FAQ Learn about Squarespace for developers and how to enable Developer Mode on your site. Changing fonts Customize your site’s text style, size, color, and spacing. Changing colors Choose a color palette for your site, then apply specific colors to different page sections. Choosing the right fonts and colors Use the three basic ideas in this guide to match your site’s design to the ideas and objectives of your content. Making style changes Edit global styles to make changes that apply to your whole site, or style individual sections. Starting over Review the different ways to start over with your site. Adding custom code to your site Enhance your site’s style and appearance using advanced coding skills. Using the CSS Editor Apply custom CSS to style fonts, colors, and backgrounds beyond Squarespace's built-in options. Using Code Injection Insert custom HTML or scripts in your site's pages. Adding custom code to your site Enhance your site’s style and appearance using advanced coding skills. How will my site appear on mobile devices? All Squarespace sites adjust on smaller browsers and fit the format of a device, thanks to responsive design and built-in mobile styles. Formatting your images for display on the web Tips for styling images to display clearly on any screen size. Adding and resizing images Learn what affects an image’s appearance on your site and how to resize it. Troubleshooting cropping issues Many images on your site crop automatically to accommodate different browser sizes. This guide reviews how Squarespace crops images and how to minimize it. How will my site appear on mobile devices? All Squarespace sites adjust on smaller browsers and fit the format of a device, thanks to responsive design and built-in m"
