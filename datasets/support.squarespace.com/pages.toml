["https://support.squarespace.com/hc/es/articles/206537297-Squarespace-permissions-explained"]
title = "Explicación de los permisos de Squarespace – Centro de ayuda de Squarespace"
description = """
Permite que los colaboradores editen tu sitio web, actualicen la facturación y más.
Si tienes varios colaboradores, puedes usar permisos para limitar el acceso a áreas del sitio que sean pertinente..."""
full_description = "Nota: Si bien hemos traducido las guías más populares al español, algunas guías están disponibles solamente en inglés. Explicación de los permisos de Squarespace Última actualización: 3 de febrero de 2025 15:52 Secciones Permite que los colaboradores editen tu sitio web, actualicen la facturación y más. Si tienes varios colaboradores, puedes usar permisos para limitar el acceso a áreas del sitio que sean pertinentes para el trabajo de cada colaborador. En esta guía se explica lo que cada rol de colaborador puede y no puede hacer para que decidas qué permisos conceder a tu equipo. Nota: los dominios de Squarespace que no comparten la información de facturación con un sitio web de Squarespace tienen otros roles de colaboradores que los que se indican en esta guía. Para informarte mejor, visita Administrar permisos de dominios. Consejos Puedes asignar varios roles a un colaborador o convertirlo en administrador para otorgarle los permisos de todos los demás roles. Para hacer publicaciones de blog con diferentes autores sin darles permisos de colaborador, añádelos como autores básicos. Los dominios vinculados a páginas de parking solo pueden tener un titular del sitio y administradores. Otros niveles de permisos no están disponibles en las páginas de parking. Los colaboradores pueden eliminarse en cualquier momento. Si tu empresa desea comprar o administrar sitios de forma masiva con varios colaboradores de sitios, puedes trabajar con nosotros para crear una solución personalizada. Para obtener más información, visita nuestra página Enterprise. El panel Permisos y propiedad En el panel Permisos y propiedad, el propietario y los administradores pueden: Invitar a colaboradores. Añadir autores básicos. Permitir que todos los colaboradores obtengan licencias de Getty Images activando la opción Permite a quienes no son administradores comprar bienes. Editar permisos de colaborador. Quitar colaboradores. Transferir titularidad (solo el titular). Permisos disponibles El tipo de permisos disponibles depende de tu suscripción. Todos los tipos de suscripción La mayoría de las suscripciones de Squarespace incluyen los siguientes permisos: Tipo de permiso Descripción Titular Solo hay un titular, normalmente la cuenta que creó el sitio u otra suscripción. Los titulares pueden administrar todos los contenidos y la configuración. También pueden transferir el permiso a otra cuenta, lo que puede suceder si un diseñador crea un sitio para un cliente o si alguien nuevo dentro de una organización comienza a administrar el contenido web. Administrador Los administradores pueden hacer casi todo lo mismo que el titular, excepto cambiar la ‌titularidad. Este es un buen nivel de permisos para los colaboradores que necesitan acceso completo. Facturación Las cuentas con permiso de facturación pueden cambiar o cancelar las suscripciones y ver las facturas. No pueden agregar o editar contenido. Este es un buen nivel de autorización para alguien que se encarga de tus finanzas. Sitios web Estos permisos son para sitios web de Squarespace: Tipo de permiso Descripción Editor de sitios web Los editores de sitios web pueden agregar productos, bloques y otro contenido a las páginas actuales. No pueden añadir nuevas páginas ni introducir cambios de estilo. Este es un buen nivel de permiso para alguien que actualiza el sitio regularmente, pero que no toma decisiones importantes sobre el diseño. Analytics (anteriormente, Generación de informes) Las cuentas con permisos de análisis pueden acceder a paneles de análisis de sitios web y Commerce. Moderador de comentarios Los moderadores de comentarios pueden comentar las entradas de blog sin moderación y editar comentarios en el panel comentarios. También reciben las notificaciones de comentarios nuevos por correo electrónico. Administrador de la tienda Los administradores de la tienda pueden agregar productos, volver a pedir productos, gestionar los pedidos y facturar a los clientes. También pueden agregar cierto contenido, como entradas de blog y eventos. Este es un nivel adecuado de permiso para alguien que administra tu tienda online. Editor de Email Marketing Los editores de Email Marketing pueden crear, enviar y realizar un seguimiento de análisis para Email Marketing. No pueden agregar ni realizar cambios en una suscripción a Email Marketing. Lector En las cuentas con permisos de visualización se pueden ver sitios protegidos con contraseña, sin introducir la contraseña del sitio, y sitios privados. Seguirán necesitando la contraseña de página para ver las páginas protegidas con contraseña. Acuity Scheduling Puedes asignar estos permisos si inicias sesión en Acuity con una cuenta de Squarespace: Tipo de permiso Descripción Administrador de Scheduling Los administradores de Scheduling pueden ver y administrar todo el contenido en el panel de programación. Ver y editar en Scheduling Los colaboradores con permisos de vista y edición de Scheduling pueden ver y editar calendarios asignados a ellos. Solo lectura en Scheduling Los colaboradores con permisos de solo lectura de Scheduling pueden ver los calendarios asignados a ellos. Si inicias sesión en Acuity con una cuenta de Acuity, puedes asignar al personal los mismos niveles de acceso, pero usando un proceso diferente. Para obtener más información, visita Agregar y administrar colaboradores de Acuity. Enterprise Si tienes un plan Enterprise, puedes asignar roles a nivel de organización y y permisos a nivel de sitio a los miembros del equipo de tu organización: Función en la organización Descripción Administrador del equipo Los administradores de equipos pueden acceder a todos los sitios web propiedad de la organización y editarlos, crear y publicar sitios en una organización y administrar a otros miembros de su organización, incluidos los permisos de cada miembro a nivel de organización y de sitio. Integrante del equipo Los miembros del equipo pueden acceder a determinados sitios web propiedad de la organización y crear sitios de prueba en la organización. Permiso por sitio Descripción Administrador Los administradores tienen acceso completo para editar el contenido del sitio y cambiar su configuración. Administrador del sitio web Los administradores del sitio web tienen acceso completo al panel de Páginas para editar el contenido del sitio y actualizar la configuración de la página, al panel de Diseño para personalizar el estilo y el diseño del sitio y a la biblioteca de recursos para administrar imágenes y videos. Editor de sitios web Los editores de sitios web pueden editar el contenido del sitio web, pero no pueden cambiar su configuración. Los editores de sitios web también pueden administrar imágenes en la biblioteca de recursos. Editor de borradores Los editores de borradores pueden crear, editar, guardar y eliminar borradores de página, pero no pueden editar páginas que no sean borradores ni publicar ningún cambio. Los editores de borradores también pueden administrar imágenes en la biblioteca de recursos. Ninguna Los miembros no pueden editar el contenido ni la configuración del sitio web. Acceso a Configuración Estos permisos son para funciones y ajustes que se encuentran en el panel Configuración. Si un tipo de permiso no aparece en la lista, los colaboradores con esos permisos no podrán hacer ningún cambio en esta parte del sitio. Nota: los dominios de Squarespace que no comparten la información de facturación con un sitio web tienen otros roles de colaboradores que los que se indican en esta guía. Para informarte mejor, visita Administrar permisos de dominios. Titular Administrador Facturación Comprar o conectar dominios ✓ ✓ - Cambiar la información comercial ✓ ✓ - Cambiar la disponibilidad del sitio ✓ ✓ - Cambiar el idioma del sitio ✓ ✓ - Cambiar la titularidad del sitio ✓ - - Conectar con Squarespace Extensions ✓ ✓ - Conectar cuentas de terceros ✓ ✓ - Eliminar el sitio ✓ ✓ ✓ Editar la configuración de comentarios ✓ ✓ - Habilitar modo de desarrollador (versión 7.0 solamente) ✓ ✓ - Importar y exportar ✓ ✓ - Gestionar dominios ✓ ✓ - Administrar la facturación de Google Workspace ✓ ✓ - Administrar la configuración de notificaciones ✓ ✓ - Administrar permisos ✓ ✓ - Ver la dirección de correo electrónico del titular ✓ - - Acceso a Facturación Estos permisos son para ver y editar la configuración de facturación de tu sitio. Los titulares, administradores o miembros del equipo con permisos de facturación pueden: Cancelar suscripción Cambiar plan de facturación Actualizar un período de prueba a un servicio pago Ver y cambiar la información de facturación Ver las facturas Acceso a Commerce Estos permisos son para usar las funciones de Commerce de tu tienda online. Si un tipo de permiso no aparece en la lista, los colaboradores con esos permisos no pueden usar estas funciones. Los editores de sitios web tienen permisos de comercio para editar contenido del sitio. Los administradores de tiendas tienen permisos básicos de comercio para administrar las necesidades diarias de una tienda online. Titular/Administrador Editor de sitios web Administrador de la tienda Agregar, editar o eliminar todos los productos ✓ ✓* ✓ Comprar etiquetas de envío ✓ - - Cambiar configuración de envío ✓ - - Cambiar moneda de la tienda ✓ - - Cambiar la configuración de impuestos ✓ - - Conectar un procesador de pago ✓ - - Crear, editar y eliminar descuentos ✓ - - Editar la configuración de pago ✓ - - Editar notificaciones por correo electrónico de los clientes ✓ - - Editar productos relacionados ✓ - - Activar/desactivar las reseñas de clientes ✓ - - Completar, cancelar y reembolsar pedidos ✓ - ✓ Facturar a los clientes y gestionar proyectos ✓ - ✓ Administrar donaciones ✓ - ✓ Administrar datos de contabilidad ✓ - ✓ Reorganizar los productos ✓ ✓ ✓ Usar Punto de venta de Squarespace ✓ - - Ver pedidos ✓ - ✓ *Los editores de sitios web pueden editar productos, excepto los ajustes de los productos por suscripción. Acceso a Páginas y contenido Estos permisos son para ver, agregar y editar contenido del sitio, como páginas y bloques. Si un tipo de permiso no aparece en la lista, los colaboradores con esos permisos no podrán hacer ningún cambio en esta parte del sitio. Titular/Administrador Editor de sitios web Facturación Administradorde la tienda Lector Agregar y editar publicaciones de blog ✓ ✓ - ✓ - Agregar y editar eventos ✓ ✓ - ✓ - Agregar y editar imágenes de galería ✓ ✓ - ✓ - Agregar y editar subpáginas de portafolio (solo versión 7.1) ✓ ✓ - ✓ - Agregar bloques de código ✓ ✓ - ✓ - Agregar inserción de código ✓ - - - - Añadir páginas ✓ - - - - Comentar sin moderación ✓ ✓ ✓ ✓ - Conectar opciones de almacenamiento de terceros a bloques de formulario ✓ - - - - Eliminar páginas ✓ - - - - Editar páginas de portada (únicamente versión 7.0) ✓ ✓ - ✓ - Editar pies de página ✓ ✓ - ✓ - Editar encabezados (solo versión 7.0) ✓ ✓ - ✓ - Editar títulos de navegación y slugs de URL ✓ - - - - Editar contenido de la página ✓ ✓ - ✓ - Editar la configuración de página ✓ - - - - Reordenar las páginas ✓ - - - - Responder a los comentarios ✓ - - - - Ver el contenido del sitio protegido con contraseña ✓ ✓ - ✓ ✓ Ver la papelera de reciclaje y restaurar páginas ✓ - - - - Acceso a Diseño Solo el titular y los administradores pueden realizar cambios de diseño en un sitio. Esto incluye: Cambiar el logotipo y el título. Crear una pantalla de bloqueo. Crear una barra de anuncios. Hacer cambios de estilo. Cambiar plantillas (solo versión 7.0). Acceso a la biblioteca de recursos Solo el propietario, los administradores, el editor del sitio web, el gerente de tienda y el editor de campañas de email marketing pueden acceder y administrar la biblioteca de recursos. Esto incluye: Acceso y uso de la biblioteca de recursos Agregar contenido a la biblioteca de recursos Borrar contenido de la biblioteca de recursos Editar contenido de biblioteca de recursos Descargar contenido de la biblioteca de recursos Vaciar papelera de la biblioteca de recursos Restauración de contenido eliminado Organizar el contenido de la biblioteca de recursos en carpetas Obtener una licencia de Getty Images Acceso a Analytics Solo el titular, los administradores y los colaboradores de Analytics pueden ver el panel de Analytics de un sitio. Acceso a contactos Estos permisos son para la información que se encuentra en tu panel Contactos. Si un tipo de permiso no aparece en la lista, los colaboradores con esos permisos no pueden acceder a esta parte del sitio. Titular/Administrador Administrador de la tienda Editor de Email Marketing Acceso a suscriptores ✓ ✓ ✓ Acceso a clientes potenciales ✓ ✓ ✓ Acceso a clientes ✓ ✓ - Acceso a miembros ✓ ✓ - Acceso a donantes ✓ ✓ - Acceso a remitentes de formularios ✓ ✓ ✓ Agregar suscriptores ✓ - ✓ Administrar etiquetas ✓ ✓ ✓ Exportar contactos ✓ ✓ - Eliminar contactos ✓ ✓ - Acceso a Marketing Estos permisos son para las funciones y configuraciones que se encuentran en el panel de marketing del sitio. Si un tipo de permiso no aparece en la lista, los colaboradores con esos permisos no podrán hacer ningún cambio en esta parte del sitio. Titular/Administrador Facturación Editor de Email Marketing Administrador de la tienda Automatizaciones ✓ - ✓ - Crear listas de correo electrónico ✓ - ✓ ✓ Crear detalles del remitente ✓ - ✓ - Crear un borrador y envía campañas por correo electrónico ✓ - ✓ - Editar la configuración del mensaje emergente con promociones ✓ - - - Editar la configuración del botón para compartir (solo versión 7.0) ✓ - - - Gestionar la facturación de Email Marketing ✓ ✓ - - Administrar la configuración de SEO ✓ - - - Importar y exportar listas de distribución de correo - - ✓ ✓ Notificaciones por correo electrónico Los colaboradores reciben notificaciones automatizadas por correo electrónico de Squarespace en función de sus permisos y de la información que normalmente necesitan revisar en su función. Para administrar las notificaciones por correo electrónico, consulta la pestaña Notificaciones de tu perfil de colaborador. Los correos electrónicos se envían a la dirección de correo electrónico de tu perfil. Puedes revisar y actualizar tu dirección de correo electrónico en la pestaña Cuenta y seguridad de tu perfil de colaborador. Nota: Los administradores y colaboradores con permisos de facturación reciben correos electrónicos importantes relacionados con el estado de facturación del sitio. Dado que contienen información importante, no es posible desactivar estas notificaciones. Si un tipo de permiso no aparece en la lista, los colaboradores con esos permisos no recibirán notificaciones por correo electrónico. Titular/Administrador Facturación Administrador de la tienda Notificaciones de facturación ✓ ✓ - Notificaciones de comentarios ✓ - - Notificaciones de pedidos de Commerce y donaciones ✓ - ✓ Verificación de dominios ✓ - - Planes de precios para el contenido con paywall ✓ - ✓ Tú administras las notificaciones del propietario del sitio para Acuity Scheduling por separado. Para obtener más información, "
