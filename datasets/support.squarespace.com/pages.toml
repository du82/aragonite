["https://support.squarespace.com/hc/es/articles/11580957865869"]
title = "Denunciar usos indebidos – Centro de ayuda de Squarespace"
description = """
Cómo denunciar contenido o actividad sospechosa en un sitio de Squarespace o asociado con un dominio de Squarespace.
Millones de personas utilizan los servicios de Squarespace para expresarse, cons..."""
full_description = 'Nota: Si bien hemos traducido las guías más populares al español, algunas guías están disponibles solamente en inglés. Denunciar usos indebidos Última actualización: 15 de noviembre de 2024 18:40 Secciones Cómo denunciar contenido o actividad sospechosa en un sitio de Squarespace o asociado con un dominio de Squarespace. Millones de personas utilizan los servicios de Squarespace para expresarse, construir sus marcas y hacer crecer sus negocios. Estamos orgullosos de las formas creativas e inspiradoras en que las personas usan nuestros servicios, y esperamos que nuestros usuarios utilicen nuestra plataforma de manera responsable. Si tienes alguna inquietud sobre el contenido publicado en un sitio de Squarespace o sobre un nombre de dominio registrado en Squarespace, puedes enviarnos una denuncia. Investigamos todas las denuncias, y revisamos y abordamos cada una individualmente, según la naturaleza del uso indebido denunciado. Antes de comenzar Visita nuestras Condiciones de Uso y nuestra Política de Uso Aceptable para revisar nuestras políticas sobre abusos y actividad fraudulenta o ilegal. Visita Consejos de seguridad para proteger tu cuenta para conocer las mejores prácticas de seguridad de la cuenta. Nota: esta guía está disponible como recurso, pero no debe interpretarse ni considerarse como si fuera asesoramiento legal. Si crees que se está cometiendo un delito en Internet, considera presentar una reclamación a través del Internet Crime Complaint Center. Según nuestras Condiciones de Uso, Squarespace no ofrece asesoramiento o recomendaciones en ninguna legislación o requisito aplicable a tu sitio o negocio. Denunciar abuso de un dominio Squarespace Domains LLC y Squarespace Domains II LLC se han comprometido a proporcionar un servicio seguro y de confianza. Antes de enviar una denuncia por uso indebido de dominio, asegúrate de que el dominio que estás denunciando esté registrado y administrado a través de Squarespace (Squarespace Domains LLC o Squarespace Domains II LLC): Visita la búsqueda de ICANN. Ingresa tu nombre de dominio en el campo de búsqueda y haz clic en Buscar. En la página de resultados, busca el nombre y la URL enumerados en las secciones Registrador de dominios y URL del registrador de dominios. Si Squarespace no es tu proveedor de dominio, comunícate con el proveedor de dominio externo para obtener ayuda. Usa la siguiente tabla para entender los tipos de actividad de dominio sospechosa que investigamos y cómo enviar tu denuncia. Tipo de uso indebido Descripción Ejemplo Cómo denunciar Phishing El phishing es un tipo de fraude que intenta engañar a los usuarios para que compartan información confidencial, como la información de tarjetas de crédito, contraseñas o datos de la cuenta. "Alguien que usa una dirección de correo electrónico asociada con un dominio registrado en Squarespace me envió un mensaje pidiéndome que haga clic en un enlace sospechoso". Completa el formulario de denuncia de phishing. Pharming Mientras que los intentos de phishing buscan engañar a los usuarios para que compartan información confidencial, los intentos de pharming buscan redireccionar a los usuarios a sitios fraudulentos mediante DNS modificados/apropiados, en lugar de los sitios a los que el usuario intentaba conectarse originalmente. “Un sitio que solía visitar ya no está disponible. Cuando trato de encontrarlo en línea, me redireccionan a otro sitio diferente que creo que es fraudulento”. Completa el formulario de denuncia de pharming. Spam El spam abarca cualquier correo electrónico masivo no solicitado que se envía sin el consentimiento del destinatario. Esto incluye la publicidad spam (o "spamvertising") y enviar correos electrónicos que contravienen la Ley CAN-SPAM. "Alguien que usa una dirección de correo electrónico asociada con un dominio registrado en Squarespace me está enviando correos electrónicos no solicitados". Completa el formulario de denuncia de spam. Malware El malware, o software malicioso, son programas diseñados para adulterar, dañar u obtener acceso a una computadora sin conocimiento de su propietario. El malware incluye virus, spyware, ransomware y otros programas no deseados. A los malware utilizados desde distintas fuentes se los conoce como botnets. "Sospecho que un nombre de dominio registrado en Squarespace Domains está distribuyendo malware". Completa el formulario de denuncia de malware. Denunciar violaciones de copyright o de marca Squarespace respeta los derechos de propiedad intelectual y espera que sus usuarios también los respeten. Para obtener más información sobre cómo denunciar una infracción de propiedad intelectual, visita Propiedad intelectual y Squarespace. Si sospechas que alguien tiene un dominio registrado que infringe tu marca registrada, puedes revisar la Política Uniforme de Resolución de Disputas de Nombres de Dominio de la ICANN. ¿Fue útil este artículo? Sí No Usuarios a los que les pareció útil: 84 de 288 Artículos relacionados Solicitud de ayuda con dominios de terceros Acerca de la migración de Google Domains a Squarespace Hacer cambios en los servidores de nombres Responder a un aviso de infracción de derechos de copyright Revisar tus suscripciones que califican en Impact'
year_published = 2024
year_updated = 2024
