full_description = "Remarque : même si nos guides les plus populaires ont été traduits en français, certains guides sont uniquement disponibles en anglais. Décryptage des autorisations Squarespace Dernière mise à jour le 3 février 2025 13:39 Sections Donnez la possibilité aux contributeurs de modifier votre site, mettre à jour la facturation, etc. Si votre site possède plusieurs contributeurs, vous pouvez utiliser les autorisations afin de limiter leur accès aux zones qui les concernent directement. Ce guide vous explique les rôles de chaque contributeur afin de vous aider à décider quelles autorisations attribuer aux membres de votre équipe. Remarque : les domaines Squarespace qui ne partagent pas d’informations de facturation avec un site Squarespace ont des rôles de contributeur différents de ceux dans ce guide. Pour en savoir plus, consultez l’article Gérer des autorisations de domaine. Conseils Vous pouvez attribuer plusieurs rôles à un contributeur ou en faire un administrateur pour qu’il dispose des autorisations qu’ont tous les autres rôles. Pour permettre à différents auteurs de publier des billets de blog sans leur donner les autorisations de contributeur, ajoutez-les plutôt en tant qu’auteurs ponctuels. Les domaines liés aux pages de domaine garé peuvent uniquement comporter un propriétaire et des administrateurs. Les autres niveaux d’autorisation ne sont pas disponibles sur les pages de domaine garé. Les contributeurs peuvent se retirer à tout moment. Si votre entreprise souhaite acheter ou gérer un grand nombre de sites avec plusieurs contributeurs, nous pouvons créer ensemble une solution personnalisée. Pour en savoir plus, consultez notre page Enterprise. Le panneau Autorisations et propriété Dans le panneau Autorisations et propriété, le propriétaire et les administrateurs peuvent : Inviter des contributeurs Ajouter des auteurs ponctuels Autoriser tous les contributeurs à acheter une licence Getty Images en activant la case Autoriser les non-administrateurs à acheter des ressources. Modifier les autorisations des contributeurs Supprimer des contributeurs Transférer la propriété (pour le Propriétaire uniquement) Autorisations disponibles Le type d'autorisations disponibles dépend de votre abonnement. Tous les types d'abonnements La plupart des abonnements Squarespace incluent les autorisations suivantes : Type d'autorisation Description Propriétaire Il n’existe qu’un seul propriétaire. Il s’agit habituellement du compte qui a créé le site ou un autre abonnement. Les propriétaires peuvent gérer tout le contenu et tous les paramètres. Ils peuvent également transférer l’autorisation à un autre compte, par exemple dans le cas où un designer crée un site pour un client ou si un nouvel employé commence à gérer le contenu web de son entreprise. Administrateur Les administrateurs peuvent faire presque tout ce que peut faire un propriétaire, sauf modifier la ‌propriété. Ce niveau d’autorisation est idéal pour les collaborateurs qui ont besoin d’un accès complet. Facturation Les comptes possédant l’autorisation Facturation peuvent modifier ou résilier les abonnements et voir les factures. Ils ne peuvent pas ajouter ou modifier le contenu. Ce niveau d’autorisation est idéal pour les personnes qui gèrent vos finances. Sites web Ces autorisations concernent les sites web de Squarespace : Type d'autorisation Description Éditeur de site web Les éditeurs de site web peuvent ajouter des produits, des blocs et d’autres contenus aux pages existantes. Ils ne peuvent pas ajouter de nouvelles pages ni effectuer des changements de style. Ce niveau d’autorisation est idéal pour les personnes qui mettent régulièrement votre site à jour mais qui ne prennent pas de décisions importantes quant au design. Analytics (anciennement Reporting) Les comptes avec des autorisations d'analyse peuvent accéder aux panneaux d'analyse du site web et Commerce Modérateurs de contenus Les modérateurs de contenus peuvent commenter les billets de blog sans modération et modifier les commentaires dans le panneau Commentaires. Ils reçoivent également des notifications par e-mail en cas de nouveaux commentaires. Gestionnaire de boutique Les gestionnaires de boutique peuvent ajouter des produits, commander à nouveau des produits, gérer les commandes et facturer les clients. Ils peuvent également ajouter des contenus tel que des billets de blog et des événements. Ce niveau d’autorisation est idéal pour les personnes qui gèrent votre boutique en ligne. Éditeur de campagnes e-mail Les éditeurs de campagnes e-mail peuvent créer, envoyer et suivre des analyses pour les campagnes e-mail. Ils ne peuvent ni ajouter ni modifier un abonnement aux campagnes e-mail. Observateur Les comptes avec des autorisations de visionneuse peuvent consulter les sites protégés par mot de passe sans entrer le mot de passe du site, ainsi que les sites privés. Ils ont toujours besoin du mot de passe de la page pour afficher les pages protégées par mot de passe. Acuity Scheduling Vous pouvez attribuer ces autorisations si vous vous connectez à Acuity avec un compte Squarespace : Type d'autorisation Description Administrateur de la planification Les administrateurs de la planification peuvent afficher et gérer tout le contenu depuis le panneau Scheduling. Affichage et modification de la planification Les contributeurs disposant d'autorisations d'affichage et de modification Scheduling peuvent consulter et modifier les calendriers qui leur sont attribués. Affichage de la planification uniquement Les contributeurs disposant d'autorisations d'affichage seul Scheduling peuvent consulter les calendriers qui leur sont attribués. Si vous vous connectez à Acuity avec un compte Acuity, vous pouvez attribuer au personnel les mêmes niveaux d’accès, mais en utilisant un processus différent. Pour en savoir plus, consultez l’article Ajouter et gérer des contributeurs Acuity. Enterprise Si vous avez souscrit un forfait Enterprise, vous pouvez attribuer des rôles au niveau de l’organisation et des autorisations au niveau du site aux membres de l’équipe de votre organisation : Rôle dans l’entreprise Description Administrateur de l’équipe Les administrateurs d’équipe peuvent accéder à tous les sites web appartenant à l’organisation et les modifier, créer et publier des sites dans une organisation et gérer les autres membres de leur organisation, y compris les autorisations de chaque membre au niveau de l’organisation et du site. Membre de l’équipe Les membres de l’équipe peuvent accéder à certains sites web appartenant à l’organisation et créer des sites d’essai dans l’organisation. Autorisation au niveau du site Description Administrateur Les administrateurs disposent d’un accès complet pour modifier le contenu du site et modifier les paramètres du site. Gestionnaire du site web Les gestionnaires de sites web ont un accès complet au panneau Pages pour modifier le contenu du site et mettre à jour les paramètres des pages, au panneau Design pour personnaliser le style et la conception du site, et à la bibliothèque de ressources pour gérer les images et les vidéos. Éditeur de site web Les éditeurs de sites web peuvent modifier le contenu du site web, mais pas les paramètres du site. Les éditeurs de sites web peuvent également gérer les images dans la bibliothèque de ressources. Éditeur de brouillon Les éditeurs de brouillons peuvent créer, modifier, enregistrer et supprimer des brouillons de page, mais ne peuvent pas modifier des pages qui ne sont pas des brouillons, ni publier de modifications. Les éditeurs de brouillons peuvent également gérer les images dans la bibliothèque de ressources. Aucun Le membre ne peut pas modifier le contenu ou les paramètres du site web. Accès aux paramètres Ces autorisations concernent les fonctionnalités et les paramètres du panneau Paramètres. Si aucun type d’autorisation n’est répertorié, les contributeurs disposant de ces autorisations ne peuvent pas apporter de modifications dans cette partie du site. Remarque : les domaines Squarespace qui ne partagent pas d’informations de facturation avec un site web ont des rôles de contributeur différents de ceux dans ce guide. Pour en savoir plus, consultez l’article Gérer des autorisations de domaine. Propriétaire Administrateur Facturation Acheter ou connecter des domaines ✓ ✓ - Modifier les informations sur l'entreprise ✓ ✓ - Modifier la disponibilité du site ✓ ✓ - Modifier la langue du site ✓ ✓ - Modifier les droits de propriété du site ✓ - - Connecter Squarespace Extensions ✓ ✓ - Connecter des comptes de tiers ✓ ✓ - Supprimer le site ✓ ✓ ✓ Modifier les paramètres des commentaires ✓ ✓ - Activer le Mode développeur (version 7.0 uniquement) ✓ ✓ - Importer/exporter ✓ ✓ - Gérer les domaines ✓ ✓ - Gérer la facturation Google Workspace ✓ ✓ - Gérer les paramètres des notifications ✓ ✓ - Gérer les autorisations ✓ ✓ - Consulter l'adresse e-mail du propriétaire ✓ - - Accès à la facturation Ces autorisations permettent de consulter et de modifier les paramètres de facturation de votre site. Les propriétaires, les administrateurs ou les membres de l’équipe disposant d’autorisations de facturation peuvent : Annuler un abonnement Modifier le forfait Passer de la version d’essai au service payant Consulter et modifier les informations de facturation Consulter des factures Accès aux paramètres de Commerce Ces autorisations permettent d’utiliser les fonctionnalités Commerce de votre boutique en ligne. Si aucun type d’autorisation n’est répertorié, les contributeurs disposant de ces autorisations ne peuvent pas utiliser ces fonctionnalités. Les éditeurs de sites web disposent d’autorisations Commerce pour modifier le contenu du site. Les gestionnaires de boutique bénéficient d’autorisations Commerce de base pour gérer les besoins quotidiens de leur boutique en ligne. Propriétaire/administrateur Éditeur de site web Gestionnaire de boutique Ajouter, modifier ou supprimer tous les produits ✓ ✓* ✓ Acheter des étiquettes d’expédition ✓ - - Modifier les paramètres de livraison ✓ - - Modifier la devise de la boutique ✓ - - Modifier les paramètres des taxes ✓ - - Connecter un processeur de paiement ✓ - - Créer, modifier et supprimer des réductions ✓ - - Modifier les paramètres de paiement ✓ - - Modifier les notifications par e-mail des clients ✓ - - Modifier les produits associés ✓ - - Activer/désactiver les avis clients ✓ - - Traiter, annuler et rembourser des commandes ✓ - ✓ Facturer des clients et gérer des projets ✓ - ✓ Gérer les dons ✓ - ✓ Gérer les données comptables ✓ - ✓ Réorganiser les produits ✓ ✓ ✓ Utiliser le point de vente Squarespace ✓ - - Consulter les commandes ✓ - ✓ * Les éditeurs de sites web peuvent modifier les produits, à l’exception des paramètres des produits par abonnement. Accès aux pages et au contenu Ces autorisations permettent de consulter, d’ajouter et de modifier le contenu du site, comme les pages et les blocs. Si aucun type d’autorisation n’est répertorié, les contributeurs disposant de ces autorisations ne peuvent pas apporter de modifications dans cette partie du site. Propriétaire/administrateur Éditeur de site web Facturation Gestionnairede boutique Observateur Ajouter et modifier des articles de blog ✓ ✓ - ✓ - Ajouter et modifier des événements ✓ ✓ - ✓ - Ajouter et modifier des images de galerie ✓ ✓ - ✓ - Ajouter et modifier des sous-pages Portfolio (version 7.1 uniquement) ✓ ✓ - ✓ - Ajouter des blocs Code ✓ ✓ - ✓ - Utiliser l'Injection de code ✓ - - - - Ajouter des pages ✓ - - - - Commenter sans modération ✓ ✓ ✓ ✓ - Connecter des options de stockage tierces aux Blocs Formulaire ✓ - - - - Supprimer des pages ✓ - - - - Modifier les pages de couverture (version 7.0 uniquement) ✓ ✓ - ✓ - Modifier les pieds de page ✓ ✓ - ✓ - Modifier les en-têtes (version 7.0 uniquement) ✓ ✓ - ✓ - Modifier les titres de navigation et les slugs d'URL ✓ - - - - Modifier le contenu d'une page ✓ ✓ - ✓ - Modifier les paramètres des pages ✓ - - - - Réorganiser des pages ✓ - - - - Répondre à des commentaires ✓ - - - - Afficher le contenu du site protégé par mot de passe ✓ ✓ - ✓ ✓ Consulter la corbeille et restaurer des pages ✓ - - - - Accès au design Seuls le propriétaire et les administrateurs peuvent modifier le design d'un site. Ces modifications comprennent : La modification du logo et du titre La création d'un écran de verrouillage La création d'une barre d'annonce Réaliser des changements de style Les changements de templates (version 7.0 uniquement) Accès à la bibliothèque de ressources Seuls le propriétaire, les administrateurs, l’éditeur de site web, le gestionnaire de boutique et l’éditeur des Campagnes e-mail peuvent accéder à la bibliothèque de ressources et la gérer. Cela comprend : Accéder à la bibliothèque de ressources et l’utiliser Ajouter du contenu à la bibliothèque de ressources Supprimer du contenu de la bibliothèque de ressources Modifier le contenu de la bibliothèque de ressources Télécharger le contenu de la bibliothèque de ressources Vider la corbeille de la bibliothèque de ressources Restaurer le contenu supprimé Organiser le contenu de la bibliothèque de ressources à l’aide de dossiers Acheter les droits d’une image Getty Images Accès aux Analytics Seuls le propriétaire, les administrateurs et les contributeurs Analytics peuvent consulter le panneau Analytics d’un site. Accès aux contacts Ces autorisations concernent les informations figurant dans votre panneau Contacts. Si aucun type d’autorisation n’est répertorié, les contributeurs disposant de ces autorisations ne peuvent pas accéder à cette partie du site. Propriétaire/administrateur Gestionnaire de boutique Éditeur de campagnes e-mail Accès aux abonnés ✓ ✓ ✓ Accès aux prospects ✓ ✓ ✓ Accès aux clients ✓ ✓ - Accès aux membres ✓ ✓ - Accès aux donateurs ✓ ✓ - Accès aux expéditeurs des formulaires ✓ ✓ ✓ Ajouter des abonnés ✓ - ✓ Gérer les tags ✓ ✓ ✓ Exporter des contacts ✓ ✓ - Supprimer des contacts ✓ ✓ - Accès aux paramètres de Marketing Ces autorisations concernent les fonctionnalités et les paramètres du panneau Marketing de votre site. Si aucun type d’autorisation n’est répertorié, les contributeurs disposant de ces autorisations ne peuvent pas apporter de modifications dans cette partie du site. Propriétaire/administrateur Facturation Éditeur de campagnes e-mail Gestionnaire de boutique Automatisations ✓ - ✓ - Création de Listes de Diffusion ✓ - ✓ ✓ Créer les coordonnées de l'expéditeur ✓ - ✓ - Création de brouillons et envoi de campagnes e-mail ✓ - ✓ - Modifier les paramètres des pop-ups promotionnels ✓ - - - Modifier les paramètres du bouton de partage (version 7.0 uniquement) ✓ - - - Gérer la facturation des Campagnes e-mail ✓ ✓ - - Gérer les paramètres SEO ✓ - - - Importer et exporter des listes de diffusion - - ✓ ✓ Notifications par e-mail Les contributeurs reçoivent des notifications automatiques par e-mail de la part de Squarespace en fonction de leurs autorisations et des informations qu’ils doivent généralement consulter dans le cadre de leur rôle. Pour gérer"
