["https://support.squarespace.com/hc/fr-fr/signin"]
title = "Centre d’aide de Squarespace"
description = "In-depth articles and videos on everything Squarespace."
full_description = "• Avez-vous déjà essayé de récupérer votre compte sur la page de connexion ? Si la réponse est non, veuillez tout d’abord suivre cette étape. • Pour votre sécurité, les informations liées au compte seront communiquées uniquement à son propriétaire. • Une pièce d’identité nationale. Par exemple, un permis de conduire, un passeport ou une carte de résident permanent. • Un relevé bancaire avec l’en-tête de la banque, le nom du titulaire du compte bancaire et la dernière transaction Squarespace. Vous pouvez masquer les autres informations personnelles visibles dans le document. (Non requis pour les problèmes d’authentification à deux facteurs.) • Si vous avez entré plusieurs sites web ci-dessus, joignez des relevés indiquant les frais les plus récents associés à chaque site. Squarespace respecte les droits de la propriété intellectuelle et attend de ses utilisateurs qu’ils en fassent de même. Squarespace traite efficacement les plaintes pour violation du copyright résultant de l’utilisation des Services. Pour soumettre un avis de violation présumée du copyright, vous devez utiliser le formulaire ci-dessous. Veuillez noter que dans les situations où Squarespace est uniquement le bureau d’enregistrement et qu’il ne fournit pas de services d’hébergement web, Squarespace n’a aucun contrôle sur le contenu qui ne se trouve d’ailleurs pas sur les serveurs de Squarespace. Vous devrez traiter la plainte pour violation présumée du copyright directement avec le propriétaire du site ou le fournisseur de services d’hébergement web. La réponse de Squarespace aux avis de violation présumée du copyright peut inclure la suppression ou la restriction de l’accès au contenu prétendument illicite. Veuillez noter que les informations incluses dans un avis de violation du copyright peuvent être transmises à l’utilisateur qui a publié le contenu prétendument illicite ou au propriétaire du site."
