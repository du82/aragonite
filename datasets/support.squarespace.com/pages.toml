["https://support.squarespace.com/hc/change_language/de"]
title = "Squarespace Hilfe-Center"
description = "In-depth articles and videos on everything Squarespace."
full_description = "• Hast du bereits versucht, dein Konto über die Anmeldeseite wiederherzustellen? Wir werden dich bitten, das zuerst zu versuchen, falls du es noch nicht getan hast. Wenn du Hilfe bei der Wiederherstellung eines Google Workspace-Kontos benötigst, kontaktiere uns hier. • Einen amtlichen Lichtbildausweis. Zum Beispiel einen Führerschein, Reisepass oder elektronischen Aufenthaltstitel. • Einen Kontoauszug, aus dem die Bank, der Name des Kontoinhabers und die letzte Zahlung an Squarespace ersichtlich werden. Es steht dir frei, weitere persönliche Informationen im Dokument zu schwärzen. (Nicht erforderlich bei Problemen mit der Zwei-Faktor-Authentifizierung.) • Wenn du oben mehrere Websites angegeben hast, füge verschiedene Kontoauszüge hinzu, aus denen die letzte Abbuchung für die jeweilige Website hervorgeht. Squarespace achtet Rechte an geistigem Eigentum und erwartet dies auch von seinen Benutzern. Squarespace reagiert zeitnah auf Ansprüche aus Urheberrechtsverletzungen, die sich aus der Nutzung unserer Services ableiten. Um einen Verdacht auf einen Verstoß gegen das Urheberrecht zu melden, musst du eine Verstoßmeldung über das untenstehende Formular einreichen. Bitte beachte, dass in Fällen, in denen Squarespace lediglich der Registrar ist und keine Web-Hosting-Dienste anbietet, Squarespace keine Kontrolle über den Inhalt hat und der Inhalt sich nicht auf den Servern von Squarespace befindet; du musst einen Verdacht auf einen Verstoß gegen das Urheberrecht direkt mit dem Website-Inhaber oder dem Web-Hosting-Dienstleister klären. Squarespace wird gegebenenfalls auf mutmaßliche Verstöße gegen das Urheberrecht reagieren, indem das angeblich Rechte verletzende Material entfernt oder der Zugang entsprechend beschränkt wird. Hinweis: Im Rahmen einer Verstoßmeldung gemachte Angaben können an den Benutzer, der die vermeintlich rechtswidrigen Inhalte veröffentlicht hat, oder an den Website-Inhaber weitergegeben werden."
