["https://support.squarespace.com/hc/it/articles/11580957865869"]
title = "Segnalare gli abusi – Centro assistenza Squarespace"
description = """
Come segnalare contenuti o attività sospette su un sito Squarespace o associato a un dominio Squarespace.
I servizi di Squarespace sono utilizzati da milioni di persone per esprimere se stessi, svi..."""
full_description = '''Nota: Sebbene le nostre guide più popolari siano state tradotte in italiano, alcune guide sono disponibili solo in inglese. Segnalare gli abusi Ultimo aggiornamento 15 novembre 2024 18:40 Sezioni Come segnalare contenuti o attività sospette su un sito Squarespace o associato a un dominio Squarespace. I servizi di Squarespace sono utilizzati da milioni di persone per esprimere se stessi, sviluppare i propri marchi e far crescere le proprie attività. Siamo orgogliosi dei modi creativi e stimolanti in cui le persone utilizzano i nostri servizi e ci aspettiamo che i nostri utenti usino la nostra piattaforma in modo responsabile. Se hai un problema relativo a contenuti pubblicati su un sito Squarespace o a un nome di dominio registrato con Squarespace, puoi segnalarcelo. Esaminiamo tutte le segnalazioni e valutiamo e gestiamo ogni caso singolarmente, in base alla natura dell'abuso segnalato. Prima di iniziare Visita i nostri Termini di Servizio e la nostra Politica d'uso accettabile per consultare le nostre politiche in materia di abusi e attività fraudolente o illegali. Visita Consigli sulla sicurezza per proteggere il tuo account per conoscere le procedure ottimali per la sicurezza dell'account. Nota: questa guida è disponibile come risorsa, ma non va utilizzata né considerata in alcun modo come consulenza valida dal punto di vista legale. Se ritieni che si stia verificando un crimine su Internet, dovresti considerare la possibilità di inoltrare un reclamo presso l'Internet Crime Complaint Center. In base ai nostri Termini di servizio, Squarespace non si occupa di fornire consigli o raccomandazioni su leggi o requisiti applicabili al tuo sito o alla tua attività. Segnala un abuso di dominio Squarespace Domains LLC e Squarespace Domains II LLC si impegnano a fornire un servizio sicuro e affidabile. Prima di inviare una segnalazione di abuso del dominio, verifica che il dominio che stai segnalando sia registrato e gestito tramite Squarespace (Squarespace Domains LLC o Squarespace Domains II LLC): Visita ICANN Lookup. Inserisci il tuo nome di dominio nel campo di ricerca e clicca su Cerca. Nella pagina dei risultati, cerca il nome e l'URL indicati nelle sezioni Registrar e URL del Registrar. Se Squarespace non è il tuo provider di dominio, contatta il provider di terze parti del dominio per ricevere assistenza. Utilizza la tabella seguente per comprendere i tipi di attività sospette sui domini che analizziamo e per sapere come inviare la tua segnalazione. Tipo di abuso Descrizione Esempio Come effettuare la segnalazione Phishing Il phishing è un tipo di frode che tenta di indurre gli utenti a condividere informazioni sensibili come i dati della carta di credito, le password o i dettagli dell'account. "Qualcuno che utilizza un indirizzo e-mail associato a un dominio registrato su Squarespace mi ha inviato un messaggio chiedendomi di fare clic su un link sospetto." Compila il Modulo di segnalazione di phishing. Pharming Mentre il phishing tenta di indurre gli utenti a condividere informazioni sensibili, il pharming mira a reindirizzare gli utenti a siti fraudolenti tramite impostazioni DNS modificate/hackerate, invece di dove l'utente intendeva andare in origine. "Un sito che visitavo non è più disponibile. Quando provo a trovarlo online, vengo reindirizzato a un altro sito che ritengo fraudolento." Compila il modulo di segnalazione pharming. Spam Lo spam comprende tutte le e-mail massive non richieste inviate senza il consenso del destinatario. Ciò include lo "spamvertising" e l'invio di e-mail che violano il CAN-SPAM Act. "Qualcuno che utilizza un indirizzo e-mail associato a un dominio registrato su Squarespace mi sta inviando e-mail non richieste." Compila il Modulo di segnalazione spam. Malware Il malware, o software dannoso, è un programma progettato per interrompere, danneggiare o ottenere l'accesso a un computer all'insaputa del proprietario. Il malware include virus, spyware, ransomware e altri software indesiderati. Il malware utilizzato da più fonti viene definito botnet. "Sospetto che un nome di dominio registrato su Squarespace Domains stia distribuendo malware." Compila il modulo di segnalazione malware. Segnala una violazione del copyright o del marchio Squarespace rispetta i diritti di proprietà intellettuale e si aspetta che i suoi clienti facciano lo stesso. Per maggiori informazioni su come segnalare una violazione della proprietà intellettuale, visita Proprietà intellettuale e Squarespace. Se sospetti che qualcuno sia in possesso di un dominio registrato e che stia violando il tuo marchio registrato, puoi consultare la Politica di risoluzione delle controversie sui nomi di dominio uniformi dell'ICANN. Questo articolo ti è stato utile? Sì No Utenti che ritengono sia utile: 84 su 288 Articoli correlati Richiedere assistenza per un dominio di terze parti Informazioni sulla migrazione di Google Domains su Squarespace Apportare modifiche ai nameserver Risposta a un avviso di violazione del copyright Revisione degli abbonamenti idonei in Impact'''
