Consenti ai collaboratori di modificare il tuo sito, aggiornare la fatturazione e altro ancora.
Se hai diversi collaboratori, puoi utilizzare le autorizzazioni per circoscrivere l'accesso di ciascu..."""
full_description = "Nota: Sebbene le nostre guide più popolari siano state tradotte in italiano, alcune guide sono disponibili solo in inglese. Panoramica delle autorizzazioni Squarespace Ultimo aggiornamento 3 febbraio 2025 19:13 Sezioni Consenti ai collaboratori di modificare il tuo sito, aggiornare la fatturazione e altro ancora. Se hai diversi collaboratori, puoi utilizzare le autorizzazioni per circoscrivere l'accesso di ciascuno di essi alle aree di pertinenza del proprio lavoro. Questa guida spiega le operazioni che ciascun collaboratore può e non può eseguire, in modo che tu possa decidere quali autorizzazioni concedere al team. Nota: i domini Squarespace che non condividono le informazioni di fatturazione con un sito web Squarespace hanno ruoli di collaboratore diversi da quelli descritti in questa guida. Per ulteriori informazioni, visita Gestire le autorizzazioni del dominio. Suggerimenti Puoi assegnare più ruoli a un collaboratore o renderlo amministratore per concedergli le autorizzazioni di tutti gli altri ruoli. Per pubblicare post del blog di autori diversi, senza concedere loro autorizzazioni di collaboratore, puoi aggiungerli come autori di base. I domini collegati alle pagine parcheggiate possono avere solo un proprietario e amministratori. Nelle pagine parcheggiate non sono disponibili altri livelli di autorizzazione. I collaboratori possono abbandonare questo ruolo in qualsiasi momento. Se la tua azienda desidera acquistare o gestire siti con diversi collaboratori, troveremo insieme la soluzione più adatta alle tue esigenze. Per ulteriori informazioni, consulta la nostra pagina Enterprise. Il pannello Autorizzazioni e proprietà Nel pannello Autorizzazioni e proprietà, il proprietario e gli amministratori possono: Invitare dei collaboratori Aggiungere degli autori Abilitare tutti i collaboratori alla licenza Getty Images attivando l'opzione Consenti agli utenti non amministratori di acquistare risorse. Modificare le autorizzazioni dei collaboratori Rimuovere dei collaboratori Trasferire la proprietà (solo proprietario) Autorizzazioni disponibili Il tipo di autorizzazioni disponibili dipende dall'abbonamento. Tutti i tipi di abbonamento La maggior parte degli abbonamenti Squarespace include le seguenti autorizzazioni: Tipo di autorizzazione Descrizione Proprietario Esiste un solo proprietario, solitamente l'account che ha creato il sito o un altro abbonamento. I proprietari possono gestire tutti i contenuti e le impostazioni. Possono anche trasferire l'autorizzazione a un account diverso, ad esempio, se un designer crea un sito per un cliente o se una persona nuova all'interno di un'organizzazione inizia a gestire contenuti web. Amministratore Gli amministratori possono eseguire quasi tutte le attività svolte dal proprietario, eccetto modificare la ‌proprietà del sito. Questo è un livello di autorizzazione ideale per i collaboratori che hanno bisogno di un accesso completo. Fatturazione Gli account con l'autorizzazione per Fatturazione possono modificare o annullare abbonamenti e visualizzare le fatture. Non possono aggiungere o modificare contenuto. Questo è un livello di autorizzazione ideale per coloro che gestiscono le finanze. Website Queste autorizzazioni sono per i siti web Squarespace: Tipo di autorizzazione Descrizione Editor del sito web Gli editor del sito web possono aggiungere prodotti, blocchi e altri contenuti alle pagine esistenti. Non possono aggiungere nuove pagine o apportare modifiche di stile. Questo è un livello di autorizzazione ideale per coloro che aggiornano regolarmente il tuo sito, ma non prendono decisioni di progettazione a livello più generale. Analytics (in precedenza Reporting) Gli account con autorizzazioni di analisi possono accedere ai pannelli di analisi di siti Web e e-commerce. Moderatori commenti I moderatori commenti possono commentare i post del blog senza moderazione e modificare i commenti nel pannello Commenti. Ricevono inoltre notifiche via e-mail per i nuovi commenti. Store manager Gli store manager possono aggiungere e riordinare i prodotti, gestire gli ordini e fatturare ai clienti. Possono anche aggiungere contenuti come post del blog ed eventi. Questo è un livello di autorizzazione ideale per coloro che gestiscono il tuo negozio online. Editor delle Campagne e-mail Gli editor di Campagne e-mail possono creare, inviare e monitorare le analisi per le Campagne e-mail. Non possono aggiungere o apportare modifiche a un abbonamento a Campagne e-mail. Visitatore Gli account con autorizzazioni di Visitatore possono visualizzare i siti protetti da password senza inserire la password del sito e i siti privati. Hanno comunque bisogno della password della pagina per visualizzare le pagine protette da password. Acuity Scheduling Puoi assegnare queste autorizzazioni se accedi ad Acuity con un account Squarespace: Tipo di autorizzazione Descrizione Amministratore Scheduling Gli amministratori Scheduling possono visualizzare e gestire tutti i contenuti nel pannello Scheduling. Visualizzazione e modifica di Scheduling I collaboratori con autorizzazioni di visualizzazione e modifica di Scheduling possono visualizzare e modificare i calendari loro assegnati. Solo visualizzazione di Scheduling I collaboratori con autorizzazioni di sola visualizzazione Scheduling possono visualizzare i calendari loro assegnati. Se accedi ad Acuity con un account Acuity, hai la possibilità di assegnare al personale gli stessi livelli di accesso, ma utilizzando una procedura diversa. Per saperne di più, visita Invitare i collaboratori in Acuity Scheduling. Enterprise Se disponi di un piano Enterprise, puoi assegnare ruoli a livello di organizzazione e autorizzazioni a livello di sito ai membri del team della tua organizzazione: Ruolo organizzazione Descrizione Amministratore del team Gli amministratori del team possono accedere a tutti i siti web di proprietà dell'organizzazione e apportarvi modifiche; creare e pubblicare siti all'interno dell'organizzazione e gestire gli altri membri dell'organizzazione, comprese le autorizzazioni di ciascun membro sia a livello di organizzazione che di sito. Membro del team I membri del team possono accedere a siti web selezionati di proprietà dell'organizzazione e creare siti di prova all'interno dell'organizzazione. Autorizzazione a livello di sito Descrizione Amministratore Gli amministratori hanno pieno accesso alla modifica dei contenuti del sito e alle sue impostazioni. Manager sito web I manager dei siti web hanno pieno accesso al pannello Pagine per modificare i contenuti e aggiornare le impostazioni delle pagine, al pannello Design per personalizzare lo stile e il design e alla Libreria delle risorse per gestire immagini e video. Editor del sito web Gli editor del sito web possono modificare i contenuti del sito, ma non le impostazioni. Possono anche gestire le immagini nella Libreria delle risorse. Editor di bozze Gli editor di bozze possono creare, modificare, salvare ed eliminare bozze di pagina, ma non possono modificare pagine già pubblicate o pubblicare modifiche. Gli editor di bozze possono anche gestire le immagini nella Libreria delle risorse. Nessuno L'utente non può modificare il contenuto o le impostazioni del sito web. Accesso impostazioni Queste autorizzazioni riguardano le funzionalità e le impostazioni disponibili nel pannello Impostazioni. Se un tipo di autorizzazione non è elencato, i collaboratori che dispongono di tali autorizzazioni non possono apportare modifiche in questa parte del sito. Nota: i domini Squarespace che non condividono le informazioni di fatturazione con un sito web hanno ruoli di collaboratore diversi da quelli descritti in questa guida. Per ulteriori informazioni, visita Gestire le autorizzazioni del dominio. Proprietario Amministratore Fatturazione Acquistare o connettere domini ✓ ✓ - Modificare informazioni business ✓ ✓ - Modificare la disponibilità sito ✓ ✓ - Cambiare la lingua del sito ✓ ✓ - Modificare proprietà sito ✓ - - Connettere Estensioni Squarespace ✓ ✓ - Collegare account di terze parti ✓ ✓ - Eliminare il sito ✓ ✓ ✓ Modificare le impostazioni dei commenti ✓ ✓ - Attivare la Modalità sviluppatore (solo la versione 7.0) ✓ ✓ - Importare/Esportare ✓ ✓ - Gestisci domini ✓ ✓ - Gestire la fatturazione di Google Workspace ✓ ✓ - Gestire le impostazioni delle notifiche ✓ ✓ - Gestire autorizzazioni ✓ ✓ - Visualizzare indirizzo email proprietario ✓ - - Accesso fatturazione Queste autorizzazioni consentono di visualizzare e modificare le impostazioni di fatturazione del sito. I proprietari, gli amministratori o i membri del team con autorizzazioni di fatturazione possono: Annullare l'abbonamento Modificare il piano tariffario Passare dalla versione di prova al servizio a pagamento Visualizzare e modificare le informazioni fatturazione Visualizzare le fatture Accesso Commerce Queste autorizzazioni servono per utilizzare le funzionalità Commerce del negozio online. Se non è elencato un tipo di autorizzazione, i collaboratori con tali autorizzazioni non possono utilizzare queste funzionalità. Gli editor di siti Web dispongono delle autorizzazioni commerciali per la modifica dei contenuti del sito. Gli Store manager dispongono delle autorizzazioni commerciali di base per la gestione delle esigenze quotidiane di un negozio online. Proprietario/Amministratore Editor del sito web Store manager Aggiungere, modificare o rimuovere tutti i prodotti ✓ ✓ * ✓ Acquistare etichette di spedizione ✓ - - Modificare impostazioni spedizione ✓ - - Modificare valuta negozio online ✓ - - Modificare impostazioni fiscali ✓ - - Connettere un processore di pagamento ✓ - - Creare, modificare ed eliminare sconti ✓ - - Modificare le impostazioni del checkout ✓ - - Modificare le notifiche e-mail dei clienti ✓ - - Modificare prodotti correlati ✓ - - Abilita/disabilita le recensioni dei clienti ✓ - - Evadere, annullare e rimborsare gli ordini ✓ - ✓ Emettere fatture ai clienti e gestire i progetti ✓ - ✓ Gestire donazioni ✓ - ✓ Gestire i dati contabili ✓ - ✓ Organizzare prodotti ✓ ✓ ✓ Usare i punti vendita di Squarespace ✓ - - Visualizzare ordini ✓ - ✓ * Gli editor di siti Web possono modificare i prodotti, ad eccezione delle impostazioni dei prodotti in abbonamento. Accesso a pagine e contenuto Queste autorizzazioni riguardano la visualizzazione, l'aggiunta e la modifica del contenuto del sito, come pagine e blocchi. Se un tipo di autorizzazione non è elencato, i collaboratori che dispongono di tali autorizzazioni non possono apportare modifiche in questa parte del sito. Proprietario/Amministratore Editor del sito web Fatturazione Storemanager Visitatore Aggiungere e modificare post del blog ✓ ✓ - ✓ - Aggiungere e modificare eventi ✓ ✓ - ✓ - Aggiungere e modificare le immagini della galleria ✓ ✓ - ✓ - Aggiungere e modificare le pagine secondarie del portfolio (solo versione 7.1) ✓ ✓ - ✓ - Aggiungere blocchi di codice ✓ ✓ - ✓ - Aggiungere iniezione di codice ✓ - - - - Aggiungere le pagine ✓ - - - - Commentare senza moderazione ✓ ✓ ✓ ✓ - Connettere opzioni di archiviazione di terze parti a Blocchi modulo ✓ - - - - Eliminare pagine ✓ - - - - Modificare pagina di copertina (solo versione 7.0) ✓ ✓ - ✓ - Modificare piè di pagina ✓ ✓ - ✓ - Modificare le intestazioni (solo versione 7.0) ✓ ✓ - ✓ - Modificare titoli navigazione e slug URL ✓ - - - - Modificare contenuto pagina ✓ ✓ - ✓ - Modificare le impostazioni di pagina ✓ - - - - Riordinare pagine ✓ - - - - Rispondere ai commenti ✓ - - - - Visualizzare i contenuti del sito protetti da password ✓ ✓ - ✓ ✓ Visualizzare il cestino e ripristinare pagine ✓ - - - - Accesso design Solo il proprietario e gli amministratori possono modificare il design un sito. Ciò include: Modificare logo e titolo Creare una schermata di blocco Creare una barra degli annunci Apportare modifiche di stile Cambiare modello (solo versione 7.0) Accesso alla libreria delle risorse Solo il proprietario, gli amministratori, l'editor del sito web, lo store manager e l'editor di Campagne e-mail possono accedere e gestire la libreria delle risorse. Sono compresi: Accesso e utilizzo della libreria delle risorse Aggiungere contenuti alla libreria delle risorse Eliminare contenuti dalla libreria delle risorse Modificare contenuti della libreria delle risorse Scaricare contenuti dalla libreria delle risorse Svuotare il cestino della libreria delle risorse Ripristinare i contenuti eliminati Organizzazione del contenuto della libreria delle risorse tramite cartelle Licenze per Getty Images Accesso Analytics Solo il proprietario, gli amministratori e i collaboratori di Analytics possono visualizzare il pannello Analytics di un sito. Accedere ai contatti Queste autorizzazioni riguardano le informazioni presenti nel pannello Contatti. Se un tipo di autorizzazione non è presente nell'elenco, i collaboratori con tali autorizzazioni non possono accedere a questa parte del sito. Proprietario/Amministratore Manager del Negozio Online Editor delle Campagne e-mail Accesso agli abbonati ✓ ✓ ✓ Accesso ai contatti ✓ ✓ ✓ Accesso ai clienti ✓ ✓ - Accesso ai membri ✓ ✓ - Accesso ai donatori ✓ ✓ - Accesso a contributori di moduli ✓ ✓ ✓ Aggiungere iscritti ✓ - ✓ Gestire tag ✓ ✓ ✓ Esportazione dei contatti ✓ ✓ - Eliminare i contatti ✓ ✓ - Accesso Marketing Queste autorizzazioni riguardano le funzionalità e le impostazioni disponibili nel pannello Marketing del tuo sito. Se un tipo di autorizzazione non è elencato, i collaboratori che dispongono di tali autorizzazioni non possono apportare modifiche in questa parte del sito. Proprietario/Amministratore Fatturazione Editor delle Campagne e-mail Manager del Negozio Online Automazioni ✓ - ✓ - Crea Mailing List ✓ - ✓ ✓ Creare i dettagli del mittente ✓ - ✓ - Crea Bozza e Invia Campagne email ✓ - ✓ - Modificare impostazioni pop-up promozionali ✓ - - - Modificare le impostazioni dei pulsanti di condivisione (solo versione 7.0) ✓ - - - Gestire la fatturazione di Campagne e-mail ✓ ✓ - - Gestire le impostazioni SEO ✓ - - - Importare ed esportare mailing list - - ✓ ✓ Notifiche e-mail I collaboratori ricevono notifiche e-mail automatiche da Squarespace in base alle loro autorizzazioni e alle informazioni che in genere devono esaminare nel loro ruolo. Per gestire le notifiche e-mail, visita la scheda Notifiche del tuo profilo collaboratore. Le e-mail vengono inviate all'indirizzo e-mail indicato nel tuo profilo. Puoi rivedere e aggiornare il tuo indirizzo email nella scheda Account e Sicurezza del tuo profilo collaboratore. Nota: Gli amministratori e i collaboratori che dispongono delle autorizzazioni specifiche per la gestione della fatturazione ricevono importanti e-mail correlate allo stato dei pagamenti del sito. Poiché queste notifiche contengono informazioni fondamentali, non è possibile disattivarle. Se un tipo di autorizzazione non è elencato, i collaboratori con tali autorizzazioni non riceveranno notifiche e-mail. Proprietario/Amministratore Fatturazione Store manager Notifiche di fatturazione ✓ ✓ - Notifiche di commenti ✓ - -"
