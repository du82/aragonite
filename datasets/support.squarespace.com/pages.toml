["https://support.squarespace.com/hc/change_language/it"]
title = "Centro assistenza Squarespace"
description = "In-depth articles and videos on everything Squarespace."
full_description = "• Hai già provato a recuperare il tuo account tramite la pagina di login? Ti consigliamo di provare se non l'hai ancora fatto. • Un documento d'identità rilasciato dallo Stato. Ad esempio, una patente di guida, un passaporto o un certificato di residenza permanente. • Un estratto conto bancario che riporti l'intestazione della banca, il nome del titolare del conto bancario e l'addebito più recente di Squarespace. Puoi tranquillamente occultare le altre informazioni personali contenute nel documento. (Non richiesto per problemi con l'autenticazione a due fattori.) • Se hai inserito più siti Web qui sopra, allega gli estratti conto che mostrano l'addebito più recente associato a ogni sito. Squarespace rispetta i diritti di proprietà intellettuale e richiede che i suoi utenti si comportino allo stesso modo. Squarespace risponde tempestivamente alle denunce di violazione del copyright commesse utilizzando i Servizi. Per inviare una segnalazione di presunta violazione del copyright, è necessario utilizzare il modulo sottostante. Nei casi in cui Squarespace svolga solo il ruolo di Registrar e non fornisca servizi di web hosting, Squarespace non esercita alcun controllo sui contenuti e questi non risiedono sui server di Squarespace. Di conseguenza, per risolvere il problema della violazione del copyright, sarà necessario rivolgersi direttamente al proprietario del sito o al fornitore del servizio di web hosting. In risposta alle segnalazioni su presunte violazioni del copyright, Squarespace può rimuovere o limitare l'accesso al materiale in questione. Si noti che le informazioni fornite in una comunicazione di violazione del copyright possono essere inoltrate all'utente che ha pubblicato il contenuto potenzialmente violato o al proprietario del sito."
