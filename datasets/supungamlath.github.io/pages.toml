["https://supungamlath.github.io/tv-analytics.html"]
title = "Remote Controlled Quadcopter"
description = """
This prototype system was designed on the request one of Sri              Lanka's largest IPTV providers who required a system to              capture TV preferences by household demographics. The              prototype system would be implemented on a selected set of              IPTV subscribers to collect analytics.              The system features a simple but reliable device that captures              InfraRed signals from the IPTV remote and lets viewers select              which members from a household are watching television at a              time. Viewers can also press the buttons to manually select              viewership. The collected data is posted to a remote server              which uses machine learning algorithms to analyze viewer              patterns and prevent ratings manipulation. I constructed              the physical device including the circuit schematics and CAD              design of the 3D printed case. An ESP32 was used as the main              processor due to its low cost and WiFi capabilities. Decoding              the IR signals from the IPTV remote was challenge, but through              trial and error I was able to try out different encodings and              decode the hexadecimal code transmitted. This prototype was a              MVP constructed for demonstration. In the next stages of the              project, a PCB and better casing will be designed."""
full_description = "Television Analytics Monitoring System Project Information Project Type: Team Project Team: Shanuka Lakshan Project Duration: August 2023 - September 2023 This prototype system was designed on the request one of Sri Lanka's largest IPTV providers who required a system to capture TV preferences by household demographics. The prototype system would be implemented on a selected set of IPTV subscribers to collect analytics. The system features a simple but reliable device that captures InfraRed signals from the IPTV remote and lets viewers select which members from a household are watching television at a time. Viewers can also press the buttons to manually select viewership. The collected data is posted to a remote server which uses machine learning algorithms to analyze viewer patterns and prevent ratings manipulation. I constructed the physical device including the circuit schematics and CAD design of the 3D printed case. An ESP32 was used as the main processor due to its low cost and WiFi capabilities. Decoding the IR signals from the IPTV remote was challenge, but through trial and error I was able to try out different encodings and decode the hexadecimal code transmitted. This prototype was a MVP constructed for demonstration. In the next stages of the project, a PCB and better casing will be designed."
