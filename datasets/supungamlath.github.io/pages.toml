["https://supungamlath.github.io/disaster-analysis.html"]
title = "Disaster Analysis and Response Tool"
description = """
As part of the IFS Hatch ChallengerX incubator, I was part of team Model.fit that developed DART - Disaster Analysis and Response Tool. DART is a predictive modelling system that helps organizations to maximize their readiness for natural disasters.
              DART works by deriving features from geographical data and past disaster response data to train artificial neural networks (ANNs) for each disaster type. This allows the tool to model the impact of a potential disaster on an organization's assets and map the response to workforce allocations, and to recommend the best response strategy.                            DART offers automated data preprocessing, feature engineering, and predictive model-building pipelines that provide graphical insights, helping clients predict damage to their assets and mitigate potential losses. For example, DART can help clients to identify their assets most vulnerable to floods and develop mitigation strategies.                            The ChallengerX Incubator program allowed us to meet and learn from industry leaders and experts from various fields, including senior executives and engineers from IFS. We learned about the latest trends in AI and ML and we gained valuable insights on how to develop and deploy global-scale products.                            I am proud of the work that our team has accomplished, and grateful for the opportunity. I believe that DART has the potential to make a real difference in the world by helping organizations to be more prepared for natural disasters."""
full_description = "Disaster Analysis and Response Tool Project Information Project Type: Team Competition Team: Chamaru Amasara, Sasmitha Manathunga, Sandil Ranasinghe Competition: IFS x Hatch ChallengerX AI / ML Incubator Project Duration: November 2022 - May 2023 Achievements: 2nd Place Runners Up As part of the IFS Hatch ChallengerX incubator, I was part of team Model.fit that developed DART - Disaster Analysis and Response Tool. DART is a predictive modelling system that helps organizations to maximize their readiness for natural disasters. DART works by deriving features from geographical data and past disaster response data to train artificial neural networks (ANNs) for each disaster type. This allows the tool to model the impact of a potential disaster on an organization's assets and map the response to workforce allocations, and to recommend the best response strategy. DART offers automated data preprocessing, feature engineering, and predictive model-building pipelines that provide graphical insights, helping clients predict damage to their assets and mitigate potential losses. For example, DART can help clients to identify their assets most vulnerable to floods and develop mitigation strategies. The ChallengerX Incubator program allowed us to meet and learn from industry leaders and experts from various fields, including senior executives and engineers from IFS. We learned about the latest trends in AI and ML and we gained valuable insights on how to develop and deploy global-scale products. I am proud of the work that our team has accomplished, and grateful for the opportunity. I believe that DART has the potential to make a real difference in the world by helping organizations to be more prepared for natural disasters."
