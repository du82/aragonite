full_description = "Showing Up + - Instead of ignoring difficult emotions or overemphasizing “positive thinking”, learn to face thoughts, emotions, and behaviors willingly, with curiosity and kindness. Stepping Out + - Create distance between the thinker and the thought and recognize that emotions are data, not directives. Step out of the struggle against your emotions and into the empowering experience of processing them. Walking Your Why + - Identify your own personal set of values and use them as a compass to keep you moving in the right direction. Moving On + - Appoint yourself the agent of your own life and approach your daily actions, interactions, and habits mindfully so that you can bring your best self into the world."
