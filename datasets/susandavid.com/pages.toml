title = "Susan David Media Kit"
description = "Susan David, Ph.D. is one of the world’s leading management thinkers and an award-winning Harvard Medical School psychologist."
full_description = "Photos + - DOWNLOAD - 2560 X 1707 DOWNLOAD - 2560 X 1438 DOWNLOAD - 1458 X 1814 DOWNLOAD - 1800 X 1200 DOWNLOAD - 1707 X 2560 Bio Download + - Susan David, Ph.D. is one of the world’s leading management thinkers and an award-winning Harvard Medical School psychologist. She has spent the past two decades studying how the way we navigate our emotions shapes everything that matters: our actions, careers, relationships, health, and happiness. Her #1 Wall Street Journal bestselling book, Emotional Agility—based on the concept that Harvard Business Review heralded as a “Management Idea of the Year” and winner of the Thinkers50 Breakthrough Idea Award—describes the psychological skills critical to thriving in times of complexity and change. Emotional Agility has been translated into 30 languages and is the winner of numerous accolades including Amazon’s Best Books of the Year Award and the Books for a Better Life Psychology Award. Dr. David’s TED Talk on emotional agility has been viewed by more than 10 million people. Named to the Thinkers50 global list of the top management thinkers, Dr. David is a sought-after keynote speaker and advisor, with clients that include the World Economic Forum, Ernst & Young, the United Nations, Google, Microsoft, Nasdaq, and many other national and multinational organizations. She is a frequent contributor to the New York Times, Washington Post, and Wall Street Journal and a guest on national radio and television. Dr. David trained as a clinical psychologist. She completed her Ph.D. and a post-doctorate at Yale University on emotions research. She is on the faculty at Harvard Medical School and is a Cofounder of the Institute of Coaching (a Harvard Medical School/McLean affiliate). She lives with her family outside of Boston. Accolades & Awards + - Amazon – Best Book of the Year CEO Reads – Editors Choice Forbes – Recommended Book for Leaders Thinkers50 – Winner: Breakthrough Idea Award Books for a Better Life – Winner Axiom – Medalist"
