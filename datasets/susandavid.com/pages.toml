["https://susandavid.com/about"]
title = "Susan David, Ph.D. - Keynote Speaker, Psychologist, & Author of the #1 WSJ bestseller Emotional Agility."
description = "She is one of the world’s leading management thinkers and an award-winning Harvard Medical School psychologist. Her TED Talk on the topic of emotional agility has been seen by more than 10 million people."
full_description = '''In South Africa, where I come from, “sawubona” is the Zulu word for “hello.” There’s a beautiful and powerful intention behind the word because “sawubona,” literally translated, means, “I see you, and by seeing you, I bring you into being.” At its core, emotional agility is about the capacity to see ourselves and others in a wholehearted and healthy way. It’s a set of essential psychological skills for our complex world—a world that often chooses not to see. It is more than just a skill set I teach, it’s what I try to live by, and I am so grateful to have the opportunity to share it with you. Susan David, Ph.D. is one of the world’s leading management thinkers and an award-winning Harvard Medical School psychologist. Her TED Talk on the topic of emotional agility has been seen by more than 11 million people. She is a frequent contributor to the New York Times, Washington Post, and Wall Street Journal and often appears on national radio and television. Join the 150,000 people around the world who receive actionable and life-changing tools every other week. Subscribe to my newsletter and I’ll immediately send you a free chapter from Emotional Agility. You’ll also receive updates with resources to help you thrive in work and life. We value your privacy. We use cookies to improve our site's quality, enhance your experience, and track usage. By clicking "Accept All", you consent to our use of cookies.'''
