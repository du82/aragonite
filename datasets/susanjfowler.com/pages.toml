full_description = '''Hello! I have moved over to a new website: susanrigetti.com. This website will be kept up for posterity’s sake, but won’t be updated going forward. Featured Blog Posts Featured Feb 19, 2017 Reflecting on one very, very strange year at Uber Feb 19, 2017 As most of you know, I left Uber in December and joined Stripe in January. I've gotten a lot of questions over the past couple of months about why I left and what my time at Uber was like. It's a strange, fascinating, and slightly horrifying story that deserves to be told while it is still fresh in my mind, so here we go. Read More → Feb 19, 2017 Aug 13, 2016 So You Want to Learn Physics... Aug 13, 2016 Over the past few years, ever since writing "If Susan Can Learn Physics, So Can You", I've been contacted by people from all backgrounds who are inspired and want to learn physics, but don't know where to start, what to learn, what to read, and how to structure their studies...this post is a condensed version of what I've sent to people who have contacted me over the years, outlining what everyone needs to learn in order to really understand physics. Read More → Aug 13, 2016'''
