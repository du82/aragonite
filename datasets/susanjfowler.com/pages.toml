title = "The 52 Books of 2016 — Susan Fowler"
description = "One of my goals this year was to read a total of 52 books - one book every week. There were no restrictions on which books would qualify, as long as each book was something that I actually wanted to read, read carefully, and took notes on while reading...here are the 52 books of 2016:&nbsp;"
full_description = "The 52 Books of 2016 December 12, 2016 Susan Rigetti One of my goals this year was to read a total of 52 books - one book every week. There were no restrictions on which books would qualify, as long as each book was something that I actually wanted to read, read carefully, and took notes on while reading. It was very challenging at the beginning of the year to find the time and to make it a habit, but eventually I got the hang of it, and now I'm hooked. I hope to read (at least) 52 books every year for the rest of my life!Without further ado, here are the 52 books of 2016: 1. Eichmann in Jerusalem, by Hannah Arendt2. Glengarry Glen Ross, by David Mamet3. The Old Man and the Sea, by Ernest Hemingway4. Letters to a Young Poet, by Ranier Maria Rilke5. The Waste Land, by T.S. Eliot6. The Book of Questions, by Pablo Neruda7. The Mythical Man-Month, by Frederick Brooks8. Realism in Mathematics, by Penelope Maddy9. A Mathematician's Apology, by G.H. Hardy10. 13 Days to Glory, by Lon Tinkle11. The Glass Menagerie, by Tennessee Williams12. Managing Oneself, by Peter Drucker13. Night, by Elie Wiesel14. Equity and Mercy, by Martha Nussbaum15. The True Believer, by Eric Hoffer16. Social Studies, by Fran Lebowitz17. Fabless, by Daniel Nenni and Paul McLellan18. The Soul of a New Machine, by Tracy Kidder19. The Supermen, by Charles J. Murray20. Intelligent Virtue, by Julia Annas21. Fearless Symmetry, by Avner Ash and Robert Gross22. Candide, by Voltaire23. Soap, Science, and Flat-Screen TVs, by David Dunmur and Tim Sluckin24. Flow, by Mihaly Csikszentmihalyi25. Animal Farm, by George Orwell26. Ants at Work, by Deborah Gordon27. The Fall of Rome, by Bryan Ward-Perkins28. The Panda's Thumb, by Stephen Jay Gould29. Unskilled and Unaware of It, by Justin Kruger and David Dunning (pdf) 30. 20,000 Leagues Under the Sea, by Jules Verne31. Letters to a Young Scientist, by E.O. Wilson32. The Meaning of Human Existence, by E.O. Wilson33. The Sixth Extinction, by Elizabeth Kolbert34. Seven Brief Lessons in Physics, by Carlo Rovelli35. In the Shadow of Man, by Jane Goodall36. An Urchin in the Storm, by Stephen Jay Gould37. Puzzles, Paradoxes, and Problems, by Peter French38. Brainstorms, by Daniel Dennett39. On Writing, by Stephen King40. Long Commentary on the De Anima of Aristotle, translated by Richard Taylor41. Code, by Charles Petzold42. The Hitchhiker's Guide to the Galaxy, by Douglas Adams43. 2001: A Space Odyssey, by Arthur C. Clarke44. Stories of Your Life and Others, by Ted Chiang45. Do Androids Dream of Electric Sheep? by Philip K. Dick46. The Lion, the Witch, and the Wardrobe, by C.S. Lewis47. The Silver Chair, by C.S. Lewis48. The Magician's Nephew, by C.S. Lewis49. The Bad Beginning, by Lemony Snicket50. The Reptile Room, by Lemony Snicket51. The Wide Window, by Lemony Snicket52. The Red Pony, by John Steinbeck In Book of the Week"
