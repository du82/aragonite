full_description = "The Four Layers of Microservice Architecture December 18, 2016 Susan Rigetti In this post, I cover the four layers of microservice architecture - the hardware layer, the communication layer, the application platform layer, and the microservice layer - and what each of them contains. Read more In Software Engineering Tags microservices, software engineering, distributed systems, SRE The Irreproducibility of Bugs in Large-Scale Production Systems November 3, 2016 Susan Rigetti The crux of reproducibility when it comes to bugs is this: being able to reproduce a bug requires that the state of the system be nearly identical at the time of reproduction as it was at the time the bug originally occurred - something that is impossible to guarantee in large production systems... Read more In Software Engineering Tags software engineering, distributed systems, SRE, devops 3 Comments The Architecture Interview October 7, 2016 Susan Rigetti In today's post, I want to share some of the things I've learned about how to structure and run these types of interviews. If you're here because you want to know how to ace the architecture interview, you should keep reading, because I think the best ways to prepare for these things is know how interviewers think about them. Read more In Software Engineering Tags distributed systems, interviews, software, software engineering 2 Comments"
