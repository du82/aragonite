["https://www.susanjfowler.com/blog/2016/8/29/the-cover-design-of-my-new-book-is-finished"]
title = "The cover design of my new book is finished! — Susan Fowler"
description = """
I'm so excited to share the cover design for my new book Production-Ready 
Microservices. I've been working on this project this entire year, and have 
been writing non-stop ever since I began working with O'Reilly in May. 
There's a lot more work to be done (this last stretch of writing, editing, 
more writing, more editing is the hardest part), but we are nearing the 
finish line and I can't wait to share all my microservice thoughts with 
you!"""
full_description = "The cover design of my new book is finished! August 29, 2016 Susan Rigetti My awesome cover animal: the leaf-cutter bee I'm so excited to share the cover design for my new book Production-Ready Microservices. I've been working on this project this entire year, and have been writing non-stop ever since I began working with O'Reilly in May. There's a lot more work to be done (this last stretch of writing, editing, more writing, more editing is the hardest part), but we are nearing the finish line and I can't wait to share all my microservice thoughts with you!Here's what it's all about (from the O'Reilly website): Recent practice in distributed systems has shifted from building and maintaining monolithic applications to breaking monoliths into microservices, but the standardization and best practices for microservice architecture and interaction between microservices remain largely undefined. After breaking apart a monolithic application or building up microservices from scratch, many engineers are left wondering “now what”?In Production-Ready Microservices, author Susan Fowler looks at lessons learned from driving high production-readiness standards across over a thousand microservices. She discusses standards that apply to every microservice, and shares strategies for bringing microservices to a production-ready state. A production-ready microservice, she argues, is one that is stable, reliable, fault-tolerant, scalable, performant, monitored, prepared for any catastrophe, and documented and understood.It'll be available for early release and pre-orders soon, and my technical report (and ebook!) on microservice standardization (which will also be published by O'Reilly) will be available sometime in the next month. I'll be updating this blog (and twitter) with all the details as this book (and the tech report and ebook) head to production! In Software Engineering Tags microservices, my books, software engineering, SRE"
