full_description = '''From the Fledgling Physicist Archives: An Introduction to Axions September 17, 2016 Susan Rigetti An introduction to axions I wrote several years ago on fledglingphysicist.com, covering the Strong CP Problem, the Peccei-Quinn Mechanism, and axions in cosmology. Read more In Physics Tags particle physics, axions, dark matter Comment From the Fledgling Physicist Archives: If Susan Can Learn Physics, So Can You August 26, 2016 Susan Rigetti Originally posted on my blog fledglingphysicist.com, here is "If Susan Can Learn Physics, So Can You"."Like most of us, I had heard throughout my life that math and physics were really difficult. If you weren’t “smart”, you shouldn’t even bother trying to learn either, people would say...That is one of the biggest, most hurtful, and most destructive lies anyone can perpetuate...Anyone can learn physics. Anyone can learn math. Being “good at it” or “smart” is beside the point." Read more In Physics Tags learning physics, physics, fledgling physicist 6 Comments So You Want to Learn Physics... August 13, 2016 Susan Rigetti Over the past few years, ever since writing "If Susan Can Learn Physics, So Can You", I've been contacted by people from all backgrounds who are inspired and want to learn physics, but don't know where to start, what to learn, what to read, and how to structure their studies...this post is a condensed version of what I've sent to people who have contacted me over the years, outlining what everyone needs to learn in order to really understand physics. Read more In Physics Tags learning physics, physics, book reviews 147 Comments'''
