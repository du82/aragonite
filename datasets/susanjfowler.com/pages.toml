full_description = "Life Without a Destiny May 21, 2017 Susan Rigetti My life is so different. I have no singular destiny, no one true passion, no goal. I flutter from one thing to the next. I want to be a physicist and a mathematician and a novelist and write a sitcom and write a symphony and design buildings and be a mother. I want to run a magazine and understand the lives of ants and be a philosopher and be a computer scientist and write an epic poem and understand every ancient language. I don't just want one thing. I want it all. Read more In Miscellaneous 92 Comments How I Manage My Time October 4, 2016 Susan Rigetti A short post describing how I structure each of my days. Read more In Miscellaneous"
