MCOTU87UUM3BHQNJVCC/proust.jpg" alt="proust.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329489608-13L7VHHCL4R8JWUBD1PN/seneca.jpg" alt="seneca.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329497488-UCS9JOBRBAE6YSR4O1Y7/karamazov.jpg" alt="karamazov.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329531519-NUAY9MKFDXVDZ3CTZMYM/schemer.jpg" alt="schemer.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329569736-Z7NA7AGA7VIO9T18F1UW/psqft.jpg" alt="psqft.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329634924-TORH72RZN5YCQE29G9ZZ/warandpeace.jpg" alt="warandpeace.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329679377-U7GFKW2IDFYQC75XVG0X/virgil.jpg" alt="virgil.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329713703-YQ1C7EJH21NRVUAK2D52/kafka.jpg" alt="kafka.jpg" /> Today I want to share twenty books I that I read both during the time I homeschooled myself through high school and during my time at ASU and Penn - books that shaped and drove this strange path of mine, that brought me to exactly where I am today. Read more In My Favorite Things Tags book reviews 9 Comments'
