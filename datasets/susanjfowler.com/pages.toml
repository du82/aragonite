["http://www.susanjfowler.com/blog"]
title = "Blog — Susan Fowler"
full_description = "My Blog Has a New Home: Squarknotes July 10, 2020 Susan Rigetti Hello all!I’ll now be blogging over at squarknotes.substack.com. I’ll keep a few posts up online here for posterity’s sake, but if you want to keep up with what I’m working on, squarknotes is the place to be!See you there! Comment My Year in Review: 2019 December 11, 2019 Susan Rigetti Here are some of the things I’m most proud of from 2019, and some of the biggest lessons I’ve learned. Read more The Age of Reasonabilism May 8, 2018 Susan Rigetti To call the “intellectual dark web” a group of “heretics” with “dangerous ideas” and claim that their beliefs are based on rational and scientific thinking, is to do a grave disservice to the truth. Read more Remembering My Father December 7, 2017 Susan Rigetti The author and her father in 1993 My father passed away eight years ago. Today would have been his 64th birthday. When he died, family and friends told me that the grief would subside with time, that time would dull the pain. The grief has never subsided, and, if anything, the pain has only grown stronger each year. The world feels less bright, less wonderful, less good without him. Read more In Lessons Learned Life Without a Destiny May 21, 2017 Susan Rigetti My life is so different. I have no singular destiny, no one true passion, no goal. I flutter from one thing to the next. I want to be a physicist and a mathematician and a novelist and write a sitcom and write a symphony and design buildings and be a mother. I want to run a magazine and understand the lives of ants and be a philosopher and be a computer scientist and write an epic poem and understand every ancient language. I don't just want one thing. I want it all. Read more In Miscellaneous 92 Comments Five Things Tech Companies Can Do Better May 20, 2017 Susan Rigetti I believe that tech companies should make a commitment to their employees, a commitment that they will act ethically, legally, responsibly, and transparently with regard to harassment, discrimination, retaliation, and other unlawful behavior. In my opinion, this commitment requires five things: ending forced arbitration, ending the practice of buying employees' silence, ending unnecessarily strict confidentiality agreements, instituting helpful harassment and discrimination training, and enforcing zero-tolerance policies toward unlawful and/or inappropriate behavior. Read more In Lessons Learned"
