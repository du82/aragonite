["https://www.susanjfowler.com/blog/2016/8/13/so-you-want-to-learn-physics"]
title = "So You Want to Learn Physics... — Susan Fowler"
description = '''
Over the past few years, ever since writing "If Susan Can Learn Physics, So 
Can You", I've been contacted by people from all backgrounds who are 
inspired and want to learn physics, but don't know where to start, what to 
learn, what to read, and how to structure their studies...this post is a 
condensed version of what I've sent to people who have contacted me over 
the years, outlining what everyone needs to learn in order to really 
understand physics.'''
full_description = '''So You Want to Learn Physics... August 13, 2016 Susan Rigetti Update (4/21/21): Updated version can be found here: https://www.susanrigetti.com/physics Introduction Over the past few years, ever since writing a blog post called "If Susan Can Learn Physics, So Can You", I've been contacted by people from all backgrounds who are inspired and want to learn physics, but don't know where to start, what to learn, what to read, and how to structure their studies. I've spoken with single mothers who want to go back to school and study physics, tenured philosophy professors who want to learn physics so that they can make significant and informed contributions to philosophy of physics, high school students who want to know what they should read to prepare for an undergraduate education in physics, and people in dozens of various careers who want to really, really learn and understand physics simply for the joy of it. This post is a condensed version of what I've sent to people who have contacted me over the years, outlining what everyone needs to learn in order to really understand physics. The general physics education given in U.S. universities is divided into what is learned at the undergraduate level and what is covered in graduate courses, and I've divided my list in a similar way. Because each subject is built upon the previous subjects and the mathematics becomes more complex and difficult, it's important to learn each topic in the order presented below. If you work through the all of the textbooks in the Undergraduate Physics list of this post, and master each of the topics, you'll have gained the knowledge equivalent of a Bachelor's Degree in Physics (and will be able to score well on the Physics GRE). If you work through the graduate core of the Graduate Physics textbooks, you'll have the equivalent knowledge of obtaining a Master's Degree in Physics. A PhD in Physics requires the graduate coursework as well as several years of research and a thesis, and the experience involved in a PhD isn't something that can be gained independently of a PhD program. Remember that anyone can learn physics. It's no different from learning programming, from learning a musical instrument, from reading great literature. Whether you turn it into a hobby or a career, the pure joy of understanding the universe around us is one of the most beautiful experiences you can ever have in life. Please comment with your experiences and with any suggestions you have for improving this list! Before You Begin Popular Books on Physics (The Good Ones)When you're solving problems, working through textbooks, getting into the nitty-gritty details of each topic, it's so easy to lose the forest for the trees and forget why you even became inspired to study physics in the first place. This is where really, really good (and non-speculative) books on physics come in handy: they inspire, they encourage, and they help you understand the big picture. One big problem is that a lot of the popular books written about physics (especially those by famous physicists) are incredibly speculative and tend to present an unrealistic view of what the study of physics is all about. When you're learning physics, it's good to avoid these types of speculative books, and stick to the good ones that talk about the real physics we know exists. Here are some of my favorite popular physics books: The Feynman Lectures on Physics (Boxed Set) and Feynman Lectures on Physics (Kindle Edition): Feynman's Lectures on Physics are essential readings for everyone interested in physics, and you'll find a copy on the bookshelf of every amateur physicist and professional physicist. These lectures are what got me into physics: my astronomy professor told me to read them and see if I liked physics - they changed my life!The Character of Physical Law by Richard Feynman: A brilliant, inspiring little book on the laws of nature.Deep Down Things: The Breathtaking Beauty of Particle Physics by Bruce Schumm: the very best popular book about particle physics. I had the honor of working with Bruce Schumm on a search for supersymmetry at the ATLAS detector, and he has one of those brilliant minds that understands physics so deeply that he can explain it to anyone without resorting to speculation.The Particle Odyssey by Frank Close: another brilliant popular introduction to particle physics and its history, beautifully illustrated with amazing figures and photographs.Weinberg's The First Three Minutes: an account of the Big Bang by one of the most brilliant physicists of all time. Mathematical PreliminariesBefore you begin studying physics and working through the topics in the sections below, you have to be familiar with some basic mathematics. A high school education usually provides you with enough mathematical background to begin, and there's no need to be familiar with calculus before starting (though you'll need to learn when you begin). How to StudyEveryone learns very differently, and knowing your learning style is important: do you learn by reading, by taking notes, by talking, by watching, by doing, or by a combination of some or all of these? Think about this before you begin so that you'll know how to structure your studies. For example, I learn by reading and by note-taking, so I read through textbooks very carefully, take copious notes, and summarize each concept in my own words before moving on to something new. (For what it's worth, I've found that Miquelrius ruled notebooks and Miquelrius graph notebooks are perfect for taking notes and these Pilot GTec pens are the best pens in the whole world). Regardless of your learning style, you'll still need to solve the physics problems in each textbook. Solving problems is the only way to really understand how the laws of physics work. There's no way around it. Even though it can feel tedious at times, there's nothing more rewarding than figuring out a really difficult physics problem and realizing that you figured it all out yourself! Undergraduate Physics OverviewThe undergraduate physics curriculum in every undergraduate physics program covers the following subjects (along with some electives in advanced topics), and usually in the following order :Introductory MechanicsElectrostaticsWaves and VibrationsModern PhysicsClassical MechanicsElectrodynamicsQuantum MechanicsThermodynamics and Statistical MechanicsAdvanced Electives in PhysicsI'm going to cover the details of each of these fields below, including the best textbooks to use and any additional reading you may find helpful in your journey. I'm also going to give some details about the mathematics you'll need to learn alongside each topic. 1. Introduction to Mechanics What It's All About An introduction to mechanics course is the first course physics course that most people will take, and it's the best place to begin independent study of physics as well. This is where you'll start learning how to see the world in mathematical terms, and the things that will be covered are: the basics of motion in a straight line, motion in two dimensions, motion in three dimensions, Newton's Laws, work, kinetic energy, potential energy, the conservation of energy, momentum, collisions, rotation and rotational motion, gravitation, and periodic motion. The Best Textbooks to UseUniversity Physics with Modern Physics by Young and Freedman (essential). Work through all of the "Mechanics" chapters (in my edition, these are chapters 1-14). This is the best introductory book I've found, and you can use it when you learn electrostatics and modern physics, too. It contains plenty of great example problems to work through, and the solutions are easy to find online. It does a great job of introducing the relevant mathematics, but you'll need to be learning calculus alongside it. You don't need to spend $250 on the new edition - Amazon has lots of copies of the 12th edition and the 13th edition that contain the same material.The Math You'll Need to Learn Alongside ItYou'll need to learn calculus while working through University Physics. My favorite introductory calculus book is Thomas' Calculus, with Stewart's Calculus coming in as a close second. Work through each chapter, and make sure you can solve problems at the end of each chapter before continuing to the next. 2. ElectrostaticsWhat It's All AboutThis is where you'll learn about the physics of electricity and magnetism (electromagnetism) in static situations (situations where no motion is involved). Topics covered are: electric charges and electric fields, magnetism and magnetic fields, Gauss's Law, capacitance, resistance and conductance, inductance, current, and how circuits work. The Best Textbooks to UseUniversity Physics with Modern Physics by Young and Freedman (essential). Work through the chapters on "Electromagnetism" (in my edition, these are chapters 21-32). You can find inexpensive copies of the 12th edition and the 13th edition.The Math You'll Need To Learn Alongside ItKeep working through the calculus textbooks (Thomas and Stewart) while you work through the basics of electrostatics, but you should finish them by the time you finish the electromagnetism chapters in University Physics. You absolutely must understand the basics of calculus before you move on to the other topics in physics. 3. Waves and VibrationsWhat It's All AboutThe mechanics of vibrations and waves are complex and important enough to demand their own course of study. Mastering this material is essential for learning about quantum mechanics, so don't skip this topic! This is where you will learn about simple harmonic oscillators, damped harmonic oscillators, forced oscillations, coupled oscillators, waves, interference, diffraction, and dispersion. The Best Textbooks to UseVibrations and Waves by French (essential) and Vibrations and Waves by King (essential). These two books complement each other very well, and contain different problems and solutions.The Math You'll Need To Learn Alongside ItBy this point, you should have finished the introductory calculus books and are ready to move on to more advanced mathematics. You should start working through Zill's Advanced Engineering Mathematics, which is an amazing introduction to more advanced topics in mathematics (linear algebra, complex analysis, real analysis, partial differential equations, and ordinary differential equations). The new edition is pretty great, but the older edition is just as good (and a lot cheaper!). The topics in this book are essential for understanding all of the rest of the topics in Undergraduate Physics - once you master them, you'll know all the math you need to know to understand undergraduate physics. 4. Modern PhysicsWhat It's All AboutThe fourth physics class that most undergraduates take is usually called "Modern Physics", and it's an introduction to topics in physics that will be taught in greater detail later in the undergraduate physics curriculum. If you plan to study the advanced topics on their own, it's possible to skip this area, but covering these topics now in your independent studies will allow you to grasp the advanced topics that you hear so much about and that probably got you into physics in the first place! This is where you'll learn the basics of thermodynamics, relativity, quantum mechanics, atomic physics, nuclear physics, particle physics, and cosmology. The Best Textbooks to UseUniversity Physics with Modern Physics by Young and Freedman (essential). Work through the "Thermodynamics" section (chapters 17-20 in my edition of the book, and the "Modern Physics" section (chapters 37-44).The Math You'll Need To Learn Alongside ItContinue working through Zill's Advanced Engineering Mathematics. Once you have mastered all of the topics in this book, you will know all the mathematics you need to know to understand undergraduate physics. 5. Classical MechanicsWhat It's All AboutThis is where you learn the real heart of classical mechanics, which you were introduced to in the very first topic (Introduction to Mechanics). You'll learn the topics in much greater depth, and learn how to use different mathematical formalisms of classical mechanics (the Lagrangian formalism and the Hamiltonian formalism) to solve problems in mechanics. The Best Textbooks to UseTaylor's Classical Mechanics (essential). This is a fantastic introduction to classical mechanics.Morin's Introduction to Classical Mechanics with Problems and Solutions (supplement). Morin's book is a good supplement to Taylor's, and contains some great problems to work through.Problems and Solutions in Introductory Mechanics by Morin (supplement). Even more great problems (with solutions) to work through, and contains some great problem-solving strategies.Kibble's Classical Mechanics (supplement). Another great book to supplement Taylor.A Student's Guide to Lagrangians and Hamiltonians (supplement). This book can help you a lot if you get stuck on understanding the Lagrangian and Hamiltonian formalisms of classical mechanics. You need to master the Lagrangian and Hamiltonian formalisms if you want to understand quantum mechanics later on!The Math You'll Need To Learn Alongside ItIf you haven't finished working through Zill by now, you should master the topics in it by the time you finish studying classical mechanics. 6. ElectrodynamicsWhat It's All AboutEarlier, you learned about electrostatics: the study of static (non-moving) electricity and magnetism. By now, you know the mathematics to understand electrodynamics, which encompasses everything about classical electricity and magnetism. You'll cover electrostatics again, then learn about Laplace's equation, multipole expansions, polarization, dielectrics, the Lorentz Force Law, the Biot-Savart Law, magnetic vector potential, electromotive force, electromagnetic induction, Maxwell's equations, electromagnetic waves and radiation, and special relativity. The Best Textbooks to UseGriffith's Introduction to Electrodynamics (essential). This is the book on undergraduate electrodynamics, and one of the very best physics textbooks ever written. Take great care to work through every single problem in the book.Div, Grad, Curl and All That by Schey (supplement). This is a short textbook on vector calculus that is very helpful when trying to work with vectors in electrodynamics.A Student's Guide to Maxwell's Equations by Fleisch (supplement). Maxwell's equations are essential in understanding electrodynamics, and this book is the best supplement on the topic. 7. Quantum MechanicsWhat It's All AboutBy this point, you're ready to really dive into the fundamentals of quantum mechanics and its applications - one of the most beautiful, interesting, and thought-provoking topics in all of physics. You'll learn to see the world at a completely new level - the quantum level. You'll learn about the wave function, the Schrodinger equation, perturbation theory, the variational principle, the WKB Approximati'''
