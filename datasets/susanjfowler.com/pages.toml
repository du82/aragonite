full_description = 'Twenty Books That Shaped My Unconventional Life August 17, 2016 Susan Rigetti <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329453006-7BEI747127WEJKTQJHBS/meditations.jpg" alt="meditations.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329371450-GPSPP5IJ2QB5W4NR8VEP/feynman.jpg" alt="feynman.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329459384-HUIKASDNSPFQRIOPVHS0/hoffer.jpg" alt="hoffer.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329404119-FKB9REIJOZUUJE2EFPXV/plutarch.jpg" alt="plutarch.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329414586-4TTGLS3KI45MX5RL7D9G/griffiths.jpg" alt="griffiths.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329422498-8CE36EPCIH5ASNVSZCAZ/plato.jpg" alt="plato.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329429371-JEQ0QKYTSU6Y7Y93T60B/rushdie.jpg" alt="rushdie.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329437527-5I9SF1NQAHIEAQPV1ACT/epictetus.jpg" alt="epictetus.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329444461-W1H3TA72NDQ8YQWJKPI8/carmichael.jpg" alt="carmichael.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329465298-R7WYHWQD01H4X96TOOCB/sexton.jpg" alt="sexton.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329471378-J4X6KFZMBO6TNWWJOTR4/wenham.jpg" alt="wenham.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329477769-DGRYLZGVHMOUEBIA29F7/esv.jpg" alt="esv.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329483644-KMCOTU87UUM3BHQNJVCC/proust.jpg" alt="proust.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329489608-13L7VHHCL4R8JWUBD1PN/seneca.jpg" alt="seneca.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329497488-UCS9JOBRBAE6YSR4O1Y7/karamazov.jpg" alt="karamazov.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329531519-NUAY9MKFDXVDZ3CTZMYM/schemer.jpg" alt="schemer.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329569736-Z7NA7AGA7VIO9T18F1UW/psqft.jpg" alt="psqft.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329634924-TORH72RZN5YCQE29G9ZZ/warandpeace.jpg" alt="warandpeace.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329679377-U7GFKW2IDFYQC75XVG0X/virgil.jpg" alt="virgil.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/57a6de391b631b6aa4789ebf/1471329713703-YQ1C7EJH21NRVUAK2D52/kafka.jpg" alt="kafka.jpg" /> Today I want to share twenty books I that I read both during the time I homeschooled myself through high school and during my time at ASU and Penn - books that shaped and drove this strange path of mine, that brought me to exactly where I am today. Read more In My Favorite Things Tags book reviews 9 Comments'
