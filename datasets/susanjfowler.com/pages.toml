["https://www.susanjfowler.com/blog/category/Lessons+Learned"]
title = "Lessons Learned — Blog — Susan Fowler"
full_description = "Remembering My Father December 7, 2017 Susan Rigetti The author and her father in 1993 My father passed away eight years ago. Today would have been his 64th birthday. When he died, family and friends told me that the grief would subside with time, that time would dull the pain. The grief has never subsided, and, if anything, the pain has only grown stronger each year. The world feels less bright, less wonderful, less good without him. Read more In Lessons Learned Five Things Tech Companies Can Do Better May 20, 2017 Susan Rigetti I believe that tech companies should make a commitment to their employees, a commitment that they will act ethically, legally, responsibly, and transparently with regard to harassment, discrimination, retaliation, and other unlawful behavior. In my opinion, this commitment requires five things: ending forced arbitration, ending the practice of buying employees' silence, ending unnecessarily strict confidentiality agreements, instituting helpful harassment and discrimination training, and enforcing zero-tolerance policies toward unlawful and/or inappropriate behavior. Read more In Lessons Learned Reflecting on one very, very strange year at Uber February 19, 2017 Susan Rigetti As most of you know, I left Uber in December and joined Stripe in January. I've gotten a lot of questions over the past couple of months about why I left and what my time at Uber was like. It's a strange, fascinating, and slightly horrifying story that deserves to be told while it is still fresh in my mind, so here we go. Read more In Lessons Learned 533 Comments How I Wrote My First Technical Book October 5, 2016 Susan Rigetti I just finished writing my first book, Production-Ready Microservices, and I've gotten a lot of questions about how I approached it, how I wrote it, and what the process was like from start to finish. The book is currently in the last stages of technical review and copyediting, so I thought I'd take advantage of this little break before I dive into writing my next two books and write something up about the whole process. Read more In Lessons Learned Tags my books, microservices, writing 2 Comments"
