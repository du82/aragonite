full_description = "What is sustainable web design? This website emits 0.49g of C02 X Want to see how your website impacts the planet? If you’re interested in implementing sustainable web design practices but not sure where to start, these two free tools can help. Wholegrain Digital’s Website Carbon can help you estimate site-based emissions while Mightybytes’ Ecograder offers handy reports on how to improve your website’s environmental impact. Launch Ecograder Explore Web Carbon Calculator Web technology has the potential to bring huge benefits to society and the environment, but only if we use it wisely… The problem The internet currently produces approximately 3.7% of global carbon emissions, which are rising in line with our hunger to consume more data. Increasingly, web technologies are also being used to sow discontent, erode privacy, prompt unethical decisions, and, in some countries, undermine personal freedoms and the well-being of society. 4th Communications tech will emit more carbon by 2025 than any country except China, India, and the U.S. View Source 29% Renewables made up only 29% of global electricity generation in 2020. View Source 19 M A typical data center can use between 11 and 19 million liters of water per day. View Source How do we do it? Sustainable web design is an approach to designing web services that puts people and planet first. It delivers digital products, services, and data that respect the principles of the Sustainable Web Manifesto: clean, efficient, open, honest, regenerative, and resilient. Read the Manifesto Discover the Web Sustainability Guidelines (WSGs) Select a category to learn about using the WSGs to deliver more sustainable web projects. View all guidelines UX Design Web Development Hosting & Infrastructure Business & Product Strategy Useful resources Check out these books for more information on sustainable web design and related topics. Explore Explore Explore Explore Explore Explore"
