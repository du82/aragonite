["https://svbtle.com/support/using-a-custom-domain"]
title = "Using a custom domain • Svbtle Support"
description = "Svbtle, a publishing platform."
full_description = "To set up a custom domain with Svbtle, you need to create special records at your DNS provider. Svbtle only supports A-records. If you’re using a subdomain, like blog.yourdomain.com, create a single A-record at your DNS provider for blog.yourdomain.com that points to 107.20.198.228 If you’re using a naked domain, like yourdomain.com, create two A-records at your DNS provider: one for www.yourdomain.com and another for yourdomain.com. Both should point to 107.20.198.228 The exact method for creating A-records differs depending on your domain registrar and/or DNS service. Once you’ve created the correct DNS records, it may take up to twenty-four hours to take effect. When your DNS settings have taken effect, log in to Svbtle and add your domain to the Blog section of Settings. Type only “yourdomain.com” or “blog.yourdomain.com” (don’t add “www.” or “http://”) in the “custom domain” box. Coming soon: full HTTPS support for custom domains, which is currently in beta. If you’d like to be part of the beta, email us and we’ll add you to the queue."
