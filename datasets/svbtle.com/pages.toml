["https://svbtle.com/promise"]
title = "Forever Promise"
description = "Svbtle, a publishing platform."
full_description = "Forever Promise We hate when the services we use and love are shut down. So Svbtle comes with a promise: your content will remain online forever. Apps and services are shut down too often, and our content tends to either get lost completely or we are forced to tediously transition it to yet another service of questionable longevity. Because we initially built Svbtle to solve our own frustrations, we feel an unusual sense of duty to our users. This service must endure. Svbtle is proud to make a few promises: We promise to do everything in our power to ensure that any content you publish on the platform will continue to be available on the web forever, at the same permanent link, as long as you want it there. This promise even applies after you stop your subscription to the service. (For more details see the small print below.) As long as you continue paying for the Svbtle service at its contemporaneous rate, you will be able to publish new content. This essentially means that we promise to never shut down the blogging platform service. If Svbtle, its parent corporation, or any affiliated entities are acquired, purchased, or taken majority control of by a third party in a way that would negatively impact the service, we will do everything in our power to ensure that the above two promises endure as part of any legal agreements into which we enter. We are a small company with low costs that are covered by paying customers. And while we hope to continue growing, we also hope to maintain a sense of dedication to how we treat our customer and user data. These promises reflect how we want our own content to be treated. In that way, both the Svbtle service and its customers’ interests are fully aligned. We like it that way. If you have any questions or concerns about these promises, please say hello: hello@svbtle.com. If you're not yet a member: Sign up → “Content” refers to user-generated data and the structural organization of that data on the Svbtle.com domain or subdomains. Such Content includes text and images included in blog posts that were authored by human paying customers on the Svbtle service using Svbtle-provided tools including the Svbtle.com website. Such Content does not include externally-linked or embedded data or illegal data. It also does not include data that violates our Terms of Service or Privacy Policy. “Available” means that the Content is accessible at a permanent URI on the Svbtle.com domain or subdomains. This policy applies to blogs using a custom domain, but the data preservation promise only covers access to Content via the permanent alternative Svbtle.com subdomain name (we can’t promise to keep domain registrations and DNS records up-to-date). “Forever” means until the HTML-based “web” is no longer generally accessible or until Svbtle or its parent company becomes financially insolvent (which we intend to avoid given that users pay for the service). Some early users of Svbtle are able to access the service without charge. These promises do not apply to those members unless they begin paying for the service. (Free users can begin paying by adding their details to Account Settings). These promises apply to Content added by accounts that have remained active and in good standing for at least three months, even if subscriptions to those accounts have been canceled. New Content can only be added to accounts with active subscriptions. The above promises only apply to Content that a reasonable person would conclude was added to the service as blog posts in good faith. Svbtle is not a file storage service and is not intended to be used as a content archive. These policies are not a guarantee and they are limited by our Terms of Service agreement and Privacy Policy and any of these agreements or policices are subject to change at any time. Changelog This Promise was last modified on Saturday, April 6th, 2019. April 6th, 2019. Updated formatting and fixed typos. No substantive changes were made. January 2, 2016. Updated text to comply with various jurisdictional requirements."
year_published = 2025
clearnet = "https://svbtle.com/promise"
