title = "Introduction • Docs • Svelte"
description = "Introduction • Svelte documentation"
full_description = "Getting started IntroductionCreating a projectProject structureWeb standardsCore concepts RoutingLoading dataForm actionsPage optionsState managementBuild and deploy Building your appAdaptersZero-config deploymentsNode serversStatic site generationSingle-page appsCloudflare PagesCloudflare WorkersNetlifyVercelWriting adaptersAdvanced Advanced routingHooksErrorsLink optionsService workersServer-only modulesSnapshotsShallow routingPackagingBest practices AuthPerformanceImagesAccessibilitySEOAppendix Frequently asked questionsIntegrationsBreakpoint DebuggingMigrating to SvelteKit v2Migrating from SapperAdditional resourcesGlossaryReference @sveltejs/kit@sveltejs/kit/hooks@sveltejs/kit/node/polyfills@sveltejs/kit/node@sveltejs/kit/vite$app/environment$app/forms$app/navigation$app/paths$app/server$app/state$app/stores$env/dynamic/private$env/dynamic/public$env/static/private$env/static/public$lib$service-workerConfigurationCommand Line InterfaceTypes SvelteKitGetting started Introduction On this page Introduction Before we beginWhat is SvelteKit?What is Svelte?SvelteKit vs Svelte Before we begin If you’re new to Svelte or SvelteKit we recommend checking out the interactive tutorial. If you get stuck, reach out for help in the Discord chatroom. What is SvelteKit?SvelteKit is a framework for rapidly developing robust, performant web applications using Svelte. If you’re coming from React, SvelteKit is similar to Next. If you’re coming from Vue, SvelteKit is similar to Nuxt. To learn more about the kinds of applications you can build with SvelteKit, see the FAQ. What is Svelte?In short, Svelte is a way of writing user interface components — like a navigation bar, comment section, or contact form — that users see and interact with in their browsers. The Svelte compiler converts your components to JavaScript that can be run to render the HTML for the page and to CSS that styles the page. You don’t need to know Svelte to understand the rest of this guide, but it will help. If you’d like to learn more, check out the Svelte tutorial. SvelteKit vs SvelteSvelte renders UI components. You can compose these components and render an entire page with just Svelte, but you need more than just Svelte to write an entire app. SvelteKit helps you build web apps while following modern best practices and providing solutions to common development challenges. It offers everything from basic functionalities — like a router that updates your UI when a link is clicked — to more advanced capabilities. Its extensive list of features includes build optimizations to load only the minimal required code; offline support; preloading pages before user navigation; configurable rendering to handle different parts of your app on the server via SSR, in the browser through client-side rendering, or at build-time with prerendering; image optimization; and much more. Building an app with all the modern best practices is fiendishly complicated, but SvelteKit does all the boring stuff for you so that you can get on with the creative part. It reflects changes to your code in the browser instantly to provide a lightning-fast and feature-rich development experience by leveraging Vite with a Svelte plugin to do Hot Module Replacement (HMR). Edit this page on GitHub previous next Creating a project"
