full_description = "Equalitylanguage featuresvalue typesreference typesPublished on 04 Mar 2022Let’s take a look at how Swift models the concept of equality, and how that concept varies between value and reference types. Loopscollectionslanguage featuresPublished on 13 Jan 2022A look at many different built-in ways to iterate over arrays, dictionaries, and other Swift collections. Availability checksavailabilitylanguage featuresPublished on 23 Jun 2021Availability checks let us conditionally use new system APIs and features while still enabling the rest of our code to keep running on older system versions. Let’s take a look at how they can be used. Type inferencetype systemlanguage featuresPublished on 08 Jul 2020An introduction to Swift’s type inference system, how it makes the syntax of the language so lightweight, and how to work around some of its limitations. Propertiespropertieslanguage featuresPublished on 22 May 2020In this Basics article, let’s take a look at a few examples of the various kinds of properties that Swift supports, and what their characteristics are. Combinecombinereactive programmingPublished on 16 Apr 2020Combine is a really powerful reactive programming framework from Apple, but getting started with it can be quite difficult, so let’s go through the basics of its API and its core concepts. Protocolsprotocolslanguage featuresPublished on 03 Apr 2020What makes Swift a protocol-oriented language, and how can protocols be used to create abstractions and to enable code reuse? That’s what we’ll take a look at in this Basics article. The Result Typeresultstandard libraryPublished on 19 Mar 2020A look at the standard library’s Result type, what kind of situations that it might be useful in, and tips and tricks that can be good to keep in mind when working with it. Optionalsoptionalslanguage featuresPublished on 11 Feb 2020Let’s explore how optional values work in Swift, including how they’re implemented under the hood, and what sort of techniques t