full_description = "Since early 2017, Swift by Sundell has been publishing articles, tips, podcasts and videos about Swift development and beyond. All of this site’s content is freely accessible to anyone, in all countries around the world, and is regularly updated with new material for a wide range of skill levels.The site is independently run by me, John Sundell. I’m incredibly passionate about programming, design and product development, and created this site to have a place to share my learnings, thoughts and ideas about iOS, Mac and Swift development in general. Besides running this site, I’m working as an iOS and Mac development freelancer, and I’m also the co-host of the Stacktrace podcast.I hope that you’ll find the material that I produce valuable, and you’re always more than welcome to contact me if you have any questions or feedback about my work.Swift by Sundell was also built to be super fast and completely private, and doesn’t track you in any way. It doesn’t execute any client-side code, contains no client-side analytics, and is statically served over Cloudflare’s global CDN for maximum worldwide performance.Thanks for reading, and hope you’ll enjoy Swift by Sundell!"
