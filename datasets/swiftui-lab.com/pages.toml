["https://swiftui-lab.com/swiftui-animations-part4"]
title = "Advanced SwiftUI Animations — Part 4: TimelineView - The SwiftUI Lab"
description = "It’s been two years since I published Part 3 of this series of articles about Advanced SwiftUI Animations. I’m super excited about this year’s WWDC introduction of TimelineView and Canvas. It opens a whole new range of possibilities that I will try to lay out in this and the next part of the series. In ... Read more"
full_description = '''Advanced SwiftUI Animations — Part 4: TimelineView September 28, 2021June 28, 2021 by javier It’s been two years since I published Part 3 of this series of articles about Advanced SwiftUI Animations. I’m super excited about this year’s WWDC introduction of TimelineView and Canvas. It opens a whole new range of possibilities that I will try to lay out in this and the next part of the series. In this post, we will explore TimelineView in detail. We will start slow, with the most common uses. However, I think the biggest potential comes with combining TimelineView and the existing animations we already know. By being a little creative, among other things, this combo will let us finally do “keyframe-like” animations. In part 5, we will explore the Canvas view, and how great it is in combination with our new friend TimelineView. The animation shown above has been created using the techniques explained in this article. The full code of that animation is available in this gist. Components of a TimelineView TimelineView is a container view that re-evaluates its content with a frequency determined by the associated scheduler: TimelineView(.periodic(from: .now, by: 0.5)) { timeline in ViewToEvaluatePeriodically() } The TimelineView receives a scheduler as a parameter. We will look at them in detail later, for now, the example uses a scheduler that fires every half a second. The other parameter is a content closure that receives a TimelineView.Context parameter that looks something like this: struct Context { let cadence: Cadence let date: Date enum Cadence: Comparable { case live case seconds case minutes } } A Cadence is an enum we can use to make some decisions on what to show in our view. Possible values are: live, seconds, and minutes. Take this as a hint to avoid showing information irrelevant for the cadence. The typical example is to avoid showing milliseconds on a clock that has a scheduler with a seconds or minutes cadence. Note that the cadence is not something you can change, but something that reflects a device state. The documentation provides only one example. On watchOS, the cadence slows down when lowering the wrist. If you find other cases where the cadence changes, I would very much like to know. Please comment below. Well, this all looks great, but there are many subtleties we should be aware of. Let’s start building our first TimelineView animation to see what these are… Understanding How TimelineView Works Look at the following code. We have two emoji characters that change randomly. The only difference between the two is that one is written in the content closure, while the other has been put on a separate view for better readability. struct ManyFaces: View { static let emoji = ["😀", "😬", "😄", "🙂", "😗", "🤓", "😏", "😕", "😟", "😎", "😜", "😍", "🤪"] var body: some View { TimelineView(.periodic(from: .now, by: 0.2)) { timeline in HStack(spacing: 120) { let randomEmoji = ManyFaces.emoji.randomElement() ?? "" Text(randomEmoji) .font(.largeTitle) .scaleEffect(4.0) SubView() } } } struct SubView: View { var body: some View { let randomEmoji = ManyFaces.emoji.randomElement() ?? "" Text(randomEmoji) .font(.largeTitle) .scaleEffect(4.0) } } } Now, let’s see what happens when we run the code: Shocked? Why does the left emoji change, but the other remains sad at all times? It turns out, the SubView is not receiving any changing parameters, which means it has no dependencies. SwiftUI has no reason to recompute the view’s body. A great talk from this year’s WWDC is Demystify SwiftUI. It explains view identify, lifetime and dependency. All these topics are very important to understand why the timeline behaves as it does. To solve the problem, we change the SubView view to add a parameter that will change with every timeline update. Note that we do not need to use the parameter, it just has to be there. Nevertheless, we will see that this unused value will be quite useful later. struct SubView: View { let date: Date // just by declaring it, the view will now be recomputed apropriately. var body: some View { let randomEmoji = ManyFaces.emoji.randomElement() ?? "" Text(randomEmoji) .font(.largeTitle) .scaleEffect(4.0) } } Now the SubView is created like this: SubView(date: timeline.date) Finally, both our emoji can experience a whirlwind of emotions: Acting Upon a Timeline Most examples about TimelineView (at the time of this writing), are usually about drawing clocks. That makes sense. The data provided by the timeline is, after all, a Date. The easiest TimelineView clock ever: TimelineView(.periodic(from: .now, by: 1.0)) { timeline in Text("\(timeline.date)") } Clocks may become a little more elaborate. For example, using an analog clock with shapes, or drawing the clock with the new Canvas view. However, TimelineView is here for more than just clocks. In many cases, we want our view to do something every time the timeline updates our view. The perfect place to put this code is the onChange(of:perform) closure. In the following example, we use this technique, to update our model every 3 seconds. struct ExampleView: View { var body: some View { TimelineView(.periodic(from: .now, by: 3.0)) { timeline in QuipView(date: timeline.date) } } struct QuipView: View { @StateObject var quips = QuipDatabase() let date: Date var body: some View { Text("_\(quips.sentence)_") .onChange(of: date) { _ in quips.advance() } } } } class QuipDatabase: ObservableObject { static var sentences = [ "There are two types of people, those who can extrapolate from incomplete data", "After all is said and done, more is said than done.", "Haikus are easy. But sometimes they don't make sense. Refrigerator.", "Confidence is the feeling you have before you really understand the problem." ] @Published var sentence: String = QuipDatabase.sentences[0] var idx = 0 func advance() { idx = (idx + 1) % QuipDatabase.sentences.count sentence = QuipDatabase.sentences[idx] } } It’s important to notice that for every timeline update, our QuipView is refreshed twice. That is, once when the timeline updates, and then again immediately after, because by calling quips.advance() we are causing the @Published value of quips.sentence to change and trigger the view update. This is perfectly fine, but it is something to be aware of, as it will become more important later on. An important concept we take from this is that although the timeline may produce a certain number of updates, the content of the view will most likely update even more times. Combining TimelineView with Traditional Animations The new TimelineView brings a lot of new opportunities. Combining it with Canvas, as we will see in a future post, is a great addition. But that puts the load of writing all the code for each frame of the animation on us. The technique I am going to expose in this section, uses the animations we already know and love to animate views from one timeline update to the next. This will finally let us create our own keyframe-like animations purely in SwiftUI. But let’s begin slow, with our little project: the metronome shown below. Play the video with the volume up, to appreciate how the beat sound is synchronized with the pendulum. Also, as metronomes do, a bell sounds every few beats: First, let’s see what our timeline looks like: struct Metronome: View { let bpm: Double = 60 // beats per minute var body: some View { TimelineView(.periodic(from: .now, by: 60 / bpm)) { timeline in MetronomeBack() .overlay(MetronomePendulum(bpm: bpm, date: timeline.date)) .overlay(MetronomeFront(), alignment: .bottom) } } } Metronomes speeds are usually specified in bpm (beats per minute). The example uses a periodic scheduler, that repeats every 60/bpm seconds. For our case, bpm = 60, so the scheduler fires every 1 second. That is, 60 times per minute. The Metronome view is composed of three layers: The MetronomeBack, MetronomePendulum, and MetronomeFront. They are overlaid in that order. The only view that will have to refresh with every timeline update, will be the MetronomePendulum, which swings from side to side. The other views won’t refresh, because they have no dependencies. The code for MetronomeBack and MetronomeFront is very simple, they use a custom shape called RoundedTrapezoid. To avoid making this page too long, the code for the custom shape is in this gist. struct MetronomeBack: View { let c1 = Color(red: 0, green: 0.3, blue: 0.5, opacity: 1) let c2 = Color(red: 0, green: 0.46, blue: 0.73, opacity: 1) var body: some View { let gradient = LinearGradient(colors: [c1, c2], startPoint: .topLeading, endPoint: .bottomTrailing) RoundedTrapezoid(pct: 0.5, cornerSizes: [CGSize(width: 15, height: 15)]) .foregroundStyle(gradient) .frame(width: 200, height: 350) } } struct MetronomeFront: View { var body: some View { RoundedTrapezoid(pct: 0.85, cornerSizes: [.zero, CGSize(width: 10, height: 10)]) .foregroundStyle(Color(red: 0, green: 0.46, blue: 0.73, opacity: 1)) .frame(width: 180, height: 100).padding(10) } } The MetronomePendulum view, however, is where things start to get interesting: struct MetronomePendulum: View { @State var pendulumOnLeft: Bool = false @State var bellCounter = 0 // sound bell every 4 beats let bpm: Double let date: Date var body: some View { Pendulum(angle: pendulumOnLeft ? -30 : 30) .animation(.easeInOut(duration: 60 / bpm), value: pendulumOnLeft) .onChange(of: date) { _ in beat() } .onAppear { beat() } } func beat() { pendulumOnLeft.toggle() // triggers the animation bellCounter = (bellCounter + 1) % 4 // keeps count of beats, to sound bell every 4th // sound bell or beat? if bellCounter == 0 { bellSound?.play() } else { beatSound?.play() } } struct Pendulum: View { let angle: Double var body: some View { return Capsule() .fill(.red) .frame(width: 10, height: 320) .overlay(weight) .rotationEffect(Angle.degrees(angle), anchor: .bottom) } var weight: some View { RoundedRectangle(cornerRadius: 10) .fill(.orange) .frame(width: 35, height: 35) .padding(.bottom, 200) } } } Our view needs to keep track of where we are in the animation. I will call this, the animation phase. Since we need to track these phases, we will use @State variables: pendulumOnLeft: keeps track of which way the pendulum is swinging.bellCounter: it keeps count of the number of beats, to determine if a beat or a bell should be heard. The example uses the .animation(_:value:) modifier. This version of the modifier, applies an animation when the specified value changes. Note that it is also possible to use an explicit animation. Instead of calling .animation(), simply toggle the pendulumOnLeft variable inside a withAnimation closure. To make our view advance through the animation phases, we monitor changes in date, using the onChange(of:perform) modifier, as we did with the previous quip example. In addition to advancing the animation phase every time the date value changes, we also do it in the onAppear closure. Otherwise, there would be a pause at the beginning. The final piece of code, non-SwiftUI related, is creating the NSSound instances. To avoid overcomplicating the example, I just created a couple of global variables: let bellSound: NSSound? = { guard let url = Bundle.main.url(forResource: "bell", withExtension: "mp3") else { return nil } return NSSound(contentsOf: url, byReference: true) }() let beatSound: NSSound? = { guard let url = Bundle.main.url(forResource: "beat", withExtension: "mp3") else { return nil } return NSSound(contentsOf: url, byReference: true) }() If you need sound files, there is a large database available at: https://freesound.org/ The ones in the example are: bell sound: metronome_pling under license CC BY 3.0 (m1rk0)beat sound: metronome.wav under license CC0 1.0 (Druminfected) The TimelineScheduler As we’ve seen already, a TimelineView needs a TimelineScheduler to determine when to update its contents. SwiftUI provides some predefined schedulers, like the ones we used. However, we can also create our own custom scheduler. I will elaborate more on that in the next section. But let’s start with the pre-existing ones. A timeline scheduler is basically a struct that adopts the TimelineScheduler protocol. The existing types are: AnimationTimelineSchedule: Updates as fast as possible, giving you the chance to draw each frame of the animation. It has parameters that let you limit the frequency of updates, and pause the updates. This one will be very useful when combining TimelineView with the new Canvas view.EveryMinuteTimelineSchedule: As the name implies, it updates every minute, at the start of the minute.ExplicitTimelineSchedule: You may provide an array with all the times you want the timeline to update.PeriodicTimelineSchedule: You may provide a start time and a frequency at which updates occur. Although you could create a timeline in this fashion: Timeline(EveryMinuteTimelineSchedule()) { timeline in ... } Since Swift 5.5 and the introduction of SE-0299, we now have support for enum-like syntax. This makes the code more readable and improves autocompletion. It is recommended that we use this syntax instead: TimelineView(.everyMinute) { timeline in ... } Note: You may have heard, but this has also been introduced with styles this year. And better yet, for styles, as long as you are using Swift 5.5, you may back-deploy it with previous versions. For each of the existing schedulers, there may be more than one enum-like option. For example, these two lines create a scheduler of the AnimationTimelineSchedule type: TimelineView(.animation) { ... } TimelineView(.animation(minimumInterval: 0.3, paused: false)) { ... } And you may even create your own (do not forget the static keyword!): extension TimelineSchedule where Self == PeriodicTimelineSchedule { static var everyFiveSeconds: PeriodicTimelineSchedule { get { .init(from: .now, by: 5.0) } } } struct ContentView: View { var body: some View { TimelineView(.everyFiveSeconds) { timeline in ... } } } Custom TimelineScheduler If none of the existing schedulers fit your needs, you may create your own. Consider the following animation: In this animation, we have a heart emoji that changes its scale, at irregular intervals and irregular amplitudes: It starts with a scale of 1.0, 0.2 seconds later grows to 1.6, 0.2 seconds later, grows to 2.0, then shrinks back to 1.0 and stays there for 0.4 seconds, before starting all over. In other words: Scale changes: 1.0 → 1.6 → 2.0 → start againTime between changes: 0.2 → 0.2 → 0.4 → start again We could create a HeartTimelineSchedule that updates exactly as the heart requires. But in the name of reusability, let’s do something more generic that can be reused in the future. Our new scheduler will be called: CyclicTimelineSchedule and will receive an array of time offsets. Each offset value will be relative to the previous value in the array. When the scheduler has exhausted the offsets, it will cycle back to the beginning of the array and start all over. struct CyclicTimelineSchedule: TimelineSchedule { '''
