description = "Introduction One of the best SwiftUI additions this year has to be the Layout protocol. Not only we finally get our hands in the layout process, but it is also a great opportunity to better understand how layout works in SwiftUI. Back in 2019 I wrote an article about Frame Behaviors with SwiftUI. In it, ... Read more"
full_description = 'The SwiftUI Layout Protocol – Part 1 September 12, 2022September 6, 2022 by javier Introduction One of the best SwiftUI additions this year has to be the Layout protocol. Not only we finally get our hands in the layout process, but it is also a great opportunity to better understand how layout works in SwiftUI. Back in 2019 I wrote an article about Frame Behaviors with SwiftUI. In it, I described how parents and children negotiate the final size of a view. Many of the things described there had to be guessed by observing the result of various tests. The whole process felt like discovering an exoplanet, where astronomers detect a tiny reduction of a sun’s luminosity and then infer that a planet must be transiting through (see planetary transit if you are interested). Now, with the Layout protocol, it is like travelling to that distant solar system and seeing it with our own eyes. It is very exciting. Creating a basic layout is not hard, we just need to implement two methods. Nevertheless, there are a lot of options we can play with to achieve more complex containers. We will explore beyond the typical Layout examples. There are some interesting topics I haven’t seen explained anywhere yet, so I will present them here. However, before we can dive into these areas, we need to begin by building a strong foundation. There’s a lot to cover, so I’ll break this post up in two parts: Part 1 – The Basics: What is the Layout Protocol?Family Dynamics of the View HierarchyOur First Layout ImplementationContainer AlignmentCustom Values: LayoutValueKeyDefault SpacingLayout Properties and Spacer()Layout CacheGreat PretendersSwitching Layouts with AnyLayoutPart 1 Conclusion Part 2 – Advanced Layouts: And The Fun Begins!Custom AnimationsBi-directional Custom ValuesAvoiding Layout Loops and CrashesRecursive LayoutsLayout CompositionAnother Composition Example: Interpolating Two LayoutsUsing Binding ParametersA Helpful Debugging ToolFinal Thoughts If you are already familiar with the Layout protocol, you may want to skip to part 2. That is alright, although I still recommend you check the first part, at least superficially. That will make sure we are both in the same page when we start exploring the more advanced features described in part 2. If at any point reading this post, you decide that the Layout protocol is not for you (at least for the moment), I still recommend you check the section: A Helpful Debugging Tool (in part 2). The tool can help you with SwiftUI in general and does not require that you understand the Layout protocol to use it. There’s a reason I put it at the very end of the second part. It is because the tool is built using the knowledge from this post. Nevertheless, you can just copy the code and use it as is. What is the Layout Protocol? The mission of the types that adopt the Layout protocol, is to tell SwiftUI how to place a set of views, and how much space it needs to do so. These types are used as view containers. Although the Layout protocol is new this year (at least publicly), we’ve been using this since day 1 of SwiftUI, every time with place views inside an HStack or VStack. Note that at least for the time being, the Layout protocol cannot be used to create lazy containers, like LazyHStack, or LazyVStack. Lazy containers are those that only render views when they scroll in and stop rendering them when they scroll out. It’s important to know that a Layout type is not a View. For example, they don’t have a body property as views have. But do not worry, for the time being you can think of them as if they were Views and use them as such. The framework uses some nice swift language tricks to make your Layout transparently produce a View when you insert them in your SwiftUI code. I’ll explain all that later in the section Great Pretenders. Family Dynamics of the View Hierarchy Before we start coding layouts, let’s refresh a pillar of the SwiftUI framework. As I described in my old post Frame Behaviors with SwiftUI, during layout, parents propose a size to their children, but it is ultimately up to the children to decide how to draw itself. It then communicates that to the parent, so it can act accordingly. There are three possible scenarios. We will concentrate on the horizontal axis (width), but the same is true for the vertical axis (height): Scenario 1: If the child takes less than what’s been offered: For this example consider a Text view that’s been offered more space than what’s needed to draw the text: struct ContentView: View { var body: some View { HStack(spacing: 0) { Rectangle().fill(.green) Text("Hello World!") Rectangle().fill(.green) } .padding(20) } } In this example, the window is 400 pt wide. So the text has been offered a third of the HStack’s width ((400 – 40) / 3 = 120). Of those 120 pt, Text only needs 74.0 and communicates that to the parent (the HStack). The parent can now take those extra 46 pt and use them with the other children. Because the other children are shapes, these take everything that’s given to them. In this case 120 + 46 / 2 = 143. Scenario 2: If the child takes exactly what’s been offered: Shapes are an example of views that take whatever is offered to them. In the previous example, those green rectangles take everything offered, but not a pixel more. Scenario 3: If the child takes more than what’s been offered: Consider the following example. Image views (unless they’ve been modified with the resizable method) are relentless. They take as much space as they need. In the example below, the Image is 300×300 and that is how much it uses to draw itself. However, by calling frame(width:100), the child is being offered only 100 pt. Is the parent helpless and should do what the child says? Not exactly. The child will use 300 pt to draw, however the parent will layout the other views as if the child were only 100 pt wide. As a result, we have a child that overflows it boundaries, but the surrounding views are not affected by the extra space use by the Image. In the example below, the black border shows the space offered to the image. struct ContentView: View { var body: some View { HStack(spacing: 0) { Rectangle().fill(.yellow) Image("peach") .frame(width: 100) .border(.black, width: 3) .zIndex(1) Rectangle().fill(.yellow) } .padding(20) } } There’s a lot of diversity in how views act. For example, we’ve seen how Text takes less than offered when it doesn’t need it. However, if it needs more than offered, several things can happen, depending on how you configure your view. For example, it may truncate the text to stay in the offered size, or it may grow vertically to show the text in the offered width. Or it can even overflow as the Image did in the example if you used the fixedSize modifier. Remember that fixedSize tells a view to use its ideal size, no matter how little they’ve been offered. If you want to learn more about these behaviors and how to alter them, check my old post Frame Behaviors with SwiftUI. Our First Layout Implementation Creating a Layout type requires that we implement at least two methods: sizeThatFits and placeSubviews. These methods receive some new types as parameters: ProposedViewSize and LayoutSubview. Before we start writing our methods, lets see what these parameters look like: ProposedViewSize The ProposedViewSize is used by the parent to tell the child how to compute its own size. The type is simple, but powerful. It is just a pair of optional CGFloats for proposed width and height. However, it is how we interpret these values what makes them interesting. These properties can have concrete values (e.g, 35.0, 74.0, etc), but there’s also special meaning when these values are 0.0, nil, or .infinity: For a concrete width, for example 45.0, the parent is offering exactly 45.0 pt, and the view should determine its own size for that offered width.For a 0.0 width, the child should respond with its minimum size.For an .infinity width, the child should respond with its maximum size.For a nil value, the child should respond with its ideal size. ProposedViewSize also has some predefined values: ProposedViewSize.zero = ProposedViewSize(width: 0, height: 0) ProposedViewSize.infinity = ProposedViewSize(width: .infinity, height: .infinity) ProposedViewSize.unspecified = ProposedViewSize(width: nil, height: nil) LayoutSubview The sizeTheFits and placeSubviews methods also receives a Layout.Subviews parameter, which is a collection of LayoutSubview elements. One for each view that is a direct descendant of the parent. In spite of its name, the type is not a view, but a proxy to one. We can query these proxies to learn layout information of the individual views we are laying out. For example, for the first time since SwiftUI’s introduction, we can directly query the minimum, ideal or maximum size of a view, or we can also get the layout priority of each view, among other interesting values. Writing the sizeThatFits Method func sizeThatFits(proposal: ProposedViewSize, subviews: Self.Subviews, cache: inout Self.Cache) -> CGSize SwiftUI will call our sizeThatFits method to determine the size of a container using our layout. When writing this method we should think of ourselves us being both a parent and a child: We are a parent asking our child views for their sizes. But we are also a child telling our parent what our size will be, based on our children replies. The method receives a size proposal, a collection of subview proxies and a cache. This last parameter may be used to improve the performance of our layout and some other advanced applications, but for the time being we will not use it. We’ll go back to it a bit ahead. When the sizeThatFits method is proposed nil in a given dimension (i.e., width or height), we should return the ideal size of the container for that dimension. When the proposal is 0.0 for a given dimension, we should return the minimum size of the container in that dimension. And when the proposal is .infinity for a given dimension, we should return the maximum size for the container in that dimension. Note that sizeThatFits may be called multiple times with different proposals to test the flexibility of the container. Proposals can be any combination of the above cases for each dimension. For example, you may get a call with ProposedViewSize(width: 0.0, height: .infinity) With the information we have so far, let’s begin with our first layout. We will start by creating a basic HStack. We’ll call it SimpleHStack. In order to compare them both, we will create a view to place a standard HStack (blue) on top of the SimpleHStack (green). In our first try we will implement sizeThatFits, but we will leave the other required method (placeSubviews) empty for the time being. struct ContentView: View { var body: some View { VStack(spacing: 20) { HStack(spacing: 5) { contents() } .border(.blue) SimpleHStack(spacing: 5) { contents() } .border(.blue) } .frame(maxWidth: .infinity, maxHeight: .infinity) .background(.white) } @ViewBuilder func contents() -> some View { Image(systemName: "globe.americas.fill") Text("Hello, World!") Image(systemName: "globe.europe.africa.fill") } } struct SimpleHStack: Layout { let spacing: CGFloat func sizeThatFits(proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) -> CGSize { let idealViewSizes = subviews.map { $0.sizeThatFits(.unspecified) } let spacing = spacing * CGFloat(subviews.count - 1) let width = spacing + idealViewSizes.reduce(0) { $0 + $1.width } let height = idealViewSizes.reduce(0) { max($0, $1.height) } return CGSize(width: width, height: height) } func placeSubviews(in bounds: CGRect, proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) { // ... } } As you can observe, the size of both stacks is identical. However, because we haven’t written any code in the placeSubviews method, all views are placed in the middle of our container. This is the default if you do not explicitly place a view. In our sizeThatFits method, we first compute all ideal sizes for every view. We can easily achieve that because the subview proxies we received have a method that return the size of the subview for a given proposal. Once we have all ideal sizes computed, we calculate the container size by adding all subviews widths and the spacing in between those views. For the height, our stack will be as tall as the tallest subview. You may have observed that we are completely ignoring the size we’ve been offered. We’ll go back to that in a minute. For now, let’s now implement placeSubviews. Writing the placeSubviews Method func placeSubviews(in bounds: CGRect, proposal: ProposedViewSize, subviews: Self.Subviews, cache: inout Self.Cache) After SwiftUI has tested our container view for several proposals, by calling sizeThatFits repeatedly with different proposal values, it will eventually call our placeSubviews method. Our goal here is to iterate through the subviews, determine their positions and place them there. In addition to the same parameters sizeThatFits receives, placeSubviews also gets a CGRect parameter (bounds). The bounds rect has the size we asked for in the sizeThatFits method. Typically, the origin of the rect is (0,0), but you should not assume that. The origin may have a different value if we are composing layouts, as we will see later on. Placing views is simple, thanks to the subview proxies, which have a place method. We must provide the coordinates for the view, the anchor point (center if left unspecified), and the proposal so the child can draw itself accordingly. struct SimpleHStack: Layout { // ... func placeSubviews(in bounds: CGRect, proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) { var pt = CGPoint(x: bounds.minX, y: bounds.minY) for v in subviews { v.place(at: pt, anchor: .topLeading, proposal: .unspecified) pt.x += v.sizeThatFits(.unspecified).width + spacing } } } Now, remember that I mentioned we ignored the proposal we received from the container’s parent? This means that our SimpleHStack container will always have the same size. No matter what has been offered, the container computes sizes and placement using .unspecified, which means the container will always have an ideal size. In this case the ideal size of the container is the size that let it place all its subviews with their own ideal sizes. Look what happens if we alter the offered size. In this animation the offered width is represented by the red border: Observe how the our SimpleHStack will ignore the offered size and it always draws with its ideal size, the one that fits all its subviews with their own ideal sizes. Container Alignment The Layout protocol let us also define alignment guides for the container. Note that this indicates how the container as a whole, aligns with the rest of the views. It has no effect on the views inside the container. In the following example, we make our SimpleHStack container to align with the second view, but only if the container is aligned with leading (if you change '
