["https://swiftui-lab.com/impossible-grids"]
title = "Impossible Grids with SwiftUI - The SwiftUI Lab"
description = "Grids in SwiftUI are more versatile than we might think. Here we will learn the basics first, and then we will explore some advanced techniques."
full_description = '''Impossible Grids with SwiftUI August 23, 2020July 27, 2020 by javier Native support for grids in SwiftUI is finally here. This is made possible by two new views. These are LazyVGrid and LazyHGrid. From now on, when I write Lazy*View, I will be referring to both of them. In this article, we will first cover the basics, but then we will go a little beyond the common grids with uniform rows and columns. We will explore how to get information about the grid’s layout and also how we can achieve special grids (see picture below), like the honeycomb, or other grids where a cell may want to span the area of two or more cells. If you are already familiar with how grids work and want to jump to the most advanced topics, scroll down to “The Impossible Begins”. Laziness The Lazy prefix in LazyVGrid and LazyHGrid indicates that the views contained in the grid are only rendered when on screen. When they are off-screen, they are not part of the view hierarchy. We also have LazyVStack and LazyHStack, which are the same as VStack and HStack, except they avoid rendering off-screen views. Apple recommends that you use their Lazy versions, but only if needed. It is important to note that the onAppear and onDisappear closures will fire as the views go in and out of view when scrolled. However, although non-rendered items are removed from the hierarchy, their states continue to exist in memory, so when they scroll back, their states remain unaltered. Also consider that if your view has a timer or any other publisher, it will continue to fire. This means you can continue to update the view’s state, even if it is not being rendered. Finally, although your view continues to exist (albeit un-rendered) when its parent updates a parameter of the subview, that value will only change in the subview, when it is rendered again. However, if the parameter is a @Binding, it will update in the subview immediately. This makes sense, as Binding variables do not store any real data. In reality, Bindings are just closures that read/write directly from the source of truth variables (e.g., @State), which usually belong to a different view. You don’t need to worry too much about all this. This is only important if your un-rendered view has some kind of background task (e.g., subscribed to a publisher). In that case, this paragraph becomes relevant, otherwise… you can forget about it. The Basics In the rest of this post, I will use the term cell to refer to each of the views laid out by the Lazy*Grid views. Note that the official term in Apple’s documentation is “child view”. However, depending on the context, it could be confusing, so I will use the term cell instead. A LazyVGrid will place its cells vertically but arranged in rows. When a row is full (i.e., all its columns used), it will continue down to the next row. Alternatively, a LazyHGrid will place cells horizontally in columns, when a column is full (i.e., all its rows used), it will continue to the next column. It’s a bit of a tongue-twister, so here is an animation that explains it much better. To make grids scrollable, they must be wrapped inside a ScrollView with the appropriate axis: ScrollView(.vertical) { // .vertical is the default, so it can be omitted LazyVGrid(columns: columns) { ... } } ScrollView(.horizontal) { LazyHGrid(rows: rows) { ... } } Grid Parameters Let’s have a look at the initializers: LazyVGrid.init(columns: [GridItem], alignment: HorizontalAlignment = .center, spacing: CGFloat? = nil, pinnedViews: PinnedScrollableViews = .init(), @ViewBuilder content: () -> Content) LazyHGrid.init(rows: [GridItem], alignment: VerticalAlignment = .center, spacing: CGFloat? = nil, pinnedViews: PinnedScrollableViews = .init(), @ViewBuilder content: () -> Content) columns/rows: This is an array of GridItem values. It determines the specifics of each column in a LazyVGrid, and the specifics of each row in LazyHGrid. This is probably the most complex of all, so we will look at it in more detail later, in a separate section below.alignment: Indicates how to place the contents of the grid. In most cases, this parameter will look like it’s doing nothing. Its use is only evident when a LazyVGrid is wider than it needs to be to accommodate all the columns, or a LazyHGrid is taller than it needs to be to accommodate all the rows. See the images below. spacing: For a LazyVGrid it is the spacing between the rows, for a LazyHGrid it is the spacing between the columns.pinnedViews: An OptionSet to indicate which views are pinned in the scroll view bounds. At the time of this writing, only Section header and footer views can be pinned. However, the words Apple chose for their documentation is generic enough to hope that one day we will be able to pin specific cells too. For the time being, however, you can specify: .sectionHeaders, .sectionFooters, or both: [.sectionHeaders, .sectionFooters]. We will see an example with pinned sections headers later.content: A ViewBuilder that provides all the views in the grid (i.e., cells). We typically use a ForEach. GridItem When dealing with LazyVGrid, the GridItem determines column properties (i.e., size, spacing, and alignment). The same applies to LazyHGrid, where GridItem is used for row properties. Let’s look at its signature: GridItem.init(_ size: GridItem.Size = .flexible(), spacing: CGFloat? = nil, alignment: Alignment? = nil) In LazyVGrid, spacing is used to specify the gap between this and the next column. In LazyHGrid spacing is used to specify the gap between this and the next row. The alignment determines how our cell view will be positioned in the area offered by the grid. In most cases, we tend to use all the space offered, so this parameter may seem like it is doing nothing. But down below, in section “Anatomy of a Grid”, we will see how that is not the case. The size parameter is an enum type, that will probably leave you scratching your head more than once. Here we have its declaration: public struct GridItem { public enum Size { case fixed(CGFloat) case flexible(minimum: CGFloat = 10, maximum: CGFloat = .infinity) case adaptive(minimum: CGFloat, maximum: CGFloat = .infinity) } } Let’s start with the easiest. Each case adds a little more complexity than the previous, so we must analyze them in order: fixed(value): This one is simple, it provides a single value that will determine the exact width of a column in LazyVGrid, or the height of a row in LazyHGrid..flexible(minimum:maximum:): In this case, for LazyVGrid, the following computation will take place to determine the column’s width: let gw = [grid's width] let af = [sum of all fixed columns widths] let sp = [spacing] let nc = [number of non-fixed columns] let unclamped_width = (gw - (af + sp)) / nc let column_width = min(max(unclamped_width, minimum), maximum) For LazyHGrid, the computation is similar: let gh = [grid's height] let af = [sum of all fixed rows heights] let sp = [spacing] let nr = [number of non-fixed rows] let unclamped_height = (gh - (af + sp)) / nr let row_height = min(max(unclamped_height, minimum), maximum) .adaptive(minimum:maximum): in this final case, for LazyVGrid, a single GridItem may represent more than one column. First, the framework determines how much space will be given to this GridItem, and then it decides how many columns it will create there. SwiftUI will try to fit as many minimum width columns as possible, but once the number of columns is determined, these can grow up to the maximum width provided, so it fills the full space. The method to determine how much space will be given to this GridItem is the same used for the .flexible() case (without the clamping). Although it is good to describe the behavior formally, I usually learn these concepts better if I do it visually. For that, I have created a small example called GridTrainer. In addition to improving your learning curve, it will expose some bugs in the Grid implementation. At the moment, not all column combinations work as they should. Especially when the more complex cases are involved and they are competing for scarce space. By playing with the trainer, you may eventually come across one of these bugs. Fortunately, they are not so frequent. You can get the Xcode project here: https://github.com/swiftui-lab/GridTrainer, I recommend you use a large screen iPad Pro, so you have more space to play. You will notice that changing the alignment of the GridItems will have no effect. This is because the cells are taking all the space offered by the Grid. If you force the size of the cells to be something different, you will see how the alignment then makes a difference. In the Toolbar, there is also a refresh icon. As mentioned, although Lazy*Grid works pretty well, it still has some bugs. From time to time it may start doing weird layouts, especially if its width is continuously changed. The refresh button simply destroys the grid and recreates it. Pressing the refresh button will not change any of your settings so most of the time will have no visual effect. Anatomy of a Grid Now that we have introduced all the parameters that constitute a Grid, it’s time to write some code: The code below produces the grid above. The dotted line was added after, to show the frame being offered by the grid to each cell. This little example teaches us a lot. Let’s begin: The height of a row in a LazyVGrid is driven by the height of the tallest cell. For example in the second row, the green view is the tallest, which makes the grid offer the same height to the other views in the same row. View #3 does not specify a height, and since shapes take as much as possible, it grows to occupy the full height. View #5, however, defines its own frame. Since it doesn’t match the offered space, it aligns according to the alignment parameter in the GridItem of the corresponding column (bottomTrailing). We will exploit this idea later when we build our honeycomb grid, or when we build a grid with a spanning cell.The alignment parameter in LazyVGrid is responsible for the group of cells centering as a whole. If we were to change the alignment to .leading, the whole group of cells will be pushed to the left.The space between the first and second columns is determined by the first GridItem (10). The space between the second and the third column is set by the second GridItem (30). The spacing value of the last GridItem is ignored.The space between the rows is determined by the spacing parameter in the LazyVGrid initializer (20) struct ContentView: View { let gridItems = [ GridItem(.fixed(100.0), spacing: 10.0, alignment: .top), GridItem(.fixed(250.0), spacing: 30.0, alignment: .center), GridItem(.fixed(150.0), spacing: 10.0, alignment: .bottomTrailing), ] var body: some View { ScrollView(.vertical) { LazyVGrid(columns: gridItems, alignment: .center, spacing: 20) { ForEach(0..<100) { idx in VStack { if idx == 3 { Rectangle().fill(Color.pink) } else if idx == 4 { Rectangle().fill(Color.green) .frame(height: 50) } else if idx == 5 { Rectangle().fill(Color.blue) .frame(width: 100, height: 30) } else { Rectangle().fill(Color.yellow) .frame(height: 30) } }.overlay(Text("\(idx)")) } } .border(Color.gray) .frame(width: 700) .padding(20) } .frame(height: 200) .border(Color.black) } } The Impossible Begins LazyVGrid does not have a column span feature. That is, each cell view normally stays in the assigned width of the column. However, with just a little bit of work, we can achieve a result like the one shown in the image below, where one of the cells spans the space of two columns. Let’s look at how the code works: struct ColSpanExample1: View { var body: some View { let gridItems = [GridItem(.fixed(150), spacing: 10, alignment: .leading), GridItem(.fixed(150), spacing: 10, alignment: .leading), GridItem(.fixed(150), spacing: 10, alignment: .leading)] LazyVGrid(columns: gridItems, spacing: 10) { ForEach(0..<8) { idx in Image("\(idx % 15)") .resizable() .frame(width: idx == 4 ? 310 : 150, height: 150) if idx == 4 { Color.clear } } } .frame(width: 470) } } Two things can be learned from the code above. First, although the grid proposes a size to the child view (cell), the cell can ignore it. In this case, we are letting the image grow to twice the cell’s width (plus the spacing). The other important fact is that the grid has no idea this is happening, so it will still place the next image as usual. To avoid this overlapping, we must create a transparent bogus view that takes that place… and then everyone’s happy. If we are going to use this often, we could have a little helper view like this: struct ColSpan<Content: View>: View { let span: Bool let content: () -> Content init(span: Bool, @ViewBuilder content: @escaping () -> Content) { self.span = span self.content = content } var body: some View { content() if span { Color.clear } } } And then use it like this: ForEach(0..<8) { idx in ColSpan(span: idx == 4) { Image("\(idx % 15)") .resizable() .frame(width: idx == 4 ? 310 : 150, height: 150) } } After looking at the code, you may have the feeling that I cheated a little. After all, this is a perfect scenario where we know exactly the width, the spacing, and the number of columns. But what happens if we are using .flexible() columns where the widths are unknown to us. Or worst, if we use .adaptive() columns, where we don’t even know the number of columns. Well, fear not. Although Lazy*Grid views are sneaky in their inner workings, we have our little spies that can give us all sorts of useful information about the grid’s layout. We’ll learn more about it in the final section (An Army of Spies). But before that, let’s continue to explore this concept of having views that do not bound themselves to what the grid offers. A great example of that is the honeycomb, so let’s build one next. A Honeycomb Grid The honeycomb conjecture states that a regular hexagonal grid is the best way to divide a surface into regions of equal area with the least total perimeter. The conjecture was around for two millennia, but it was proved only recently, by mathematician Thomas C. Hales in 1999. Now it’s time to create our honeycomb grid. At first, it may look like there is a lot of code involved, but fortunately, that is not the case. As we learned already, the grid proposes a size and location for each of our cell views. However, cells can take that proposal only as a reference and can decide to draw outside the designated area. Also in our favor, the cell decides the height of the row. But let’s begin with our RegularGrid as a starting point: struct RegularGrid: View { let cols: Int = 6 let spacing: CGFloat = 10 let imgsize = CGSize(width: 150, height: 150) var body: some View { let gridItems = Array(repeating: GridItem(.fixed(imgsize.width), spacing: spacing), count: cols) ScrollView(.vertical) { LazyVGrid(columns: gridItems, spacing: spacing) { ForEach(0..<200) { idx in Image("image-\(idx % 15)") .resizable() .frame(width: imgsize.width, height: imgsize.height) } } } } } Now'''
