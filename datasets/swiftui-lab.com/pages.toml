full_description = "Advanced SwiftUI Transitions November 15, 2019September 25, 2019 by javier In this article, we are going to explore the different options for using transitions. We’ll discuss several aspects of them. From the basic to the most advanced. How to configure, combine and trigger them. We’ll study what are the pre-existing transitions, but more importantly, how we can create our own. When doing so, the information … Read more 24 Comments Alignment Guides in SwiftUI April 13, 2020September 16, 2019 by javier Alignment guides are a powerful, but usually underused layout tool. In many cases, they help us avoid more complex options, such as anchor preferences. As you can see in this example, changes to the alignment can be automatically (and easily) animated too. Code: alignment-guides-animation.swift If you ever tried using alignment guides though, chances are, you … Read more 34 Comments Dismiss Gesture for SwiftUI Modals September 17, 2019September 12, 2019 by javier I’ll say it loud and clear. What you are about to read, is a hack. As such, it comes with no warranty. Apple may change the way modals are presented in SwiftUI, which may in turn render this article completely useless. But this blog is all about experimenting and learning… so the content of this … Read more 6 Comments Advanced SwiftUI Animations – Part 3: AnimatableModifier July 23, 2023September 9, 2019 by javier We have seen how the Animatable protocol has helped us in animating paths and transform matrices. In this last part of the series, we will take it even further. The AnimatableModifier is the most powerful of all three. With it, we have no limits on what we can accomplish. The name says it all: AnimatableModifier. … Read more 17 Comments Trigonometric Recipes for SwiftUI September 23, 2020September 6, 2019 by javier I love trigonometry. Probably because my father taught me so well. He made me see all the wonderful real-life applications it has. Everywhere you look, there’s a problem you can solve with those simple functions. From high tech problems like GPS positioning, to simple questions, such as what is the height of a building. So … Read more 11 Comments"
