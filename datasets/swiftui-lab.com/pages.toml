["https://swiftui-lab.com/swiftui-animations-part6"]
title = "Advanced SwiftUI Animations - Part 6: CustomAnimation - The SwiftUI Lab"
description = "Welcome to a new installment of the Advanced SwiftUI Animations series. I initiated this collection of articles back in 2019. Since then, Apple has been enhancing the framework and introducing new features. This year is no exception, with exciting additions that expand the possibilities of SwiftUI animations. As always, my goal is to explore every ... Read more"
full_description = 'Advanced SwiftUI Animations – Part 6: CustomAnimation October 4, 2023 by javier Welcome to a new installment of the Advanced SwiftUI Animations series. I initiated this collection of articles back in 2019. Since then, Apple has been enhancing the framework and introducing new features. This year is no exception, with exciting additions that expand the possibilities of SwiftUI animations. As always, my goal is to explore every aspect of the framework, and that means I won’t be able to cover everything in a single post. As in previous installments, the new additions for this year will also be presented in multiple parts. Throughout the new posts, we will discuss topics such as the Animation type and the CustomAnimation protocol, new ways to work with Transactions, and new options to specify animations. We will also discuss the new PhaseAnimator and KeyframeAnimator views and methods. Along the way, I will also provide debugging tips for situations where your animations don’t behave as expected. Let’s get started! Introduction This part of the series will explore the new CustomAnimation protocol. In the past, once an animation got started, there was little that could be done besides interrupting it. This year, with custom animations, it is possible to interact during the animation. Bellow is an example of a custom .variableSpeed animation I created. Although it is a linear, it will let you alter its speed during its run: All examples, including the variableSpeed animation, are available in a single gist file that you can copy/paste directly into Xcode. Note that the examples in this post are not very flashy, they are as plain and simple as possible. This is intentional and aims to focus on one concept at a time. For more on this topic, I recommend you also check Apple’s WWDC’23 video Explore SwiftUI Animation. The Animation type The withAnimation() and animation() methods you already know, receive an Animation value as a parameter. But what is the purpose of an Animation? In simple words, the Animation type value tells SwiftUI how long the animation runs and also indicates how to interpolate the animatable property of the view from its original to its changed value. For example, a linear Animation produces even changes from the beginning to the end, while an easeIn Animation will progressively accelerate the amount of change at the beginning and then stabilize into almost linear changes. We have been using this extensively over the years. For example, in the following code: withAnimation(.easeInOut) { ... } withAnimation(.easeInOut(duration: 2.0)) { ... } If you look closely at the SwiftUI declaration file you will find: extension Animation { static var easeInOut: Animation { get } static func easeInOut(duration: TimeInterval) -> Animation } This makes it possible to write .easeInOut, instead of Animation.easeInOut, because the compiler is already expecting an Animation and knows that the dot syntax has to refer to a static variable (or static function). Until now, we’ve been limited to using one of the pre-built animations (.linear, .spring, .interactiveSpring, .easeIn, .easeOut, .easeInOut, .bouncy, and more). They are usually available as static variables with pre-configured values or as static functions with parameters that let you customize them. Starting in 2023, we can add to this pool of pre-built animations. This is what this part of the series is all about. Using Custom Animations New this year, is the possibility of creating our own custom animations. To do so, we just create a type that adopts the CustomAnimation protocol. Then you use such animation like this: withAnimation(Animation(MyCustomAnimation())) { ... } And to follow the pre-built animation style, you can create your own Animation extension: extension Animation { var myAnimation: Animation { Animation(MyCustomAnimation()) } } Because we extended Animation, our code will be simplify to: withAnimation(.myAnimation) { ... } VectorArithmetic Protocol Because in the next sections we will extensively use types that need to conform to VectorArithmetic, it is worth spending some time refreshing what it is and why it is useful. You may already be familiar with it, especially if you read the first part of this blog post series, so feel free to skip this part if you already know what a VectorArithmetic type is. We use VectorArithmetic for types that can represent a vector. In this context (SwiftUI animations), think of a vector as an n-tuple of values that can be animated. These values are advanced through the animation, by scaling or interpolating them. Conveniently, the protocol has functions that let you both scale an interpolate. Examples of types that already adopt VectorArithmetic are Double and CGFloat. You can also make your own types conform to this protocol. For an example, check Advanced SwiftUI Animations: Part 1 and look for section Making Your Own Type Animatable. Double and CGFloat by themselves are each a 1-tuple, but we need to be able to handle n-tuples. That is, vectors with any number of values. For this purpose, there is a type called AnimatablePair. This type also conforms to VectorArithmetic but essentially encapsulates two VectorArithmetic values. So now, we can handle 2-tuples. Fortunately, because one of those values can also be an AnimatablePair, we get a 3-tuple, if both values are AnimatablePair, you get a 4-tuple, and so on. That way you can specify any number of components for your vector. To illustrate this, consider a vector that needs to hold a scale (CGFloat), an opacity value (Double) and a rotation angle (Double). Our 3-tuple vector would be defined as: let v: AnimatablePair<AnimatablePair<CGFloat, Double>, Double> v = AnimatablePair(AnimatablePair(10.0, 0.2), 90.0) For more detailed examples, please refer to Advanced SwiftUI Animations: Part 1 and look for the sections titled Animating More Than One Parameter and Going Beyond Two Animatable Parameters. Fortunately, in order to implement your custom animation, you don’t need to know how many components the vector has. This is because we operate on the vector as a whole. Any interpolation or scaling we perform on it, will be done on all its components automatically, whether it’s a 1-tuple, 5-tuple, or any n-tuple the system is using behind the scenes. CustomAnimation: func animate() To create a custom animation, there is only one required method: animate(), and two optional methods: shouldMerge() and velocity(). We’ll deal with the optional methods later, so let’s focus on the most important: func animate<V>(value: V, time: TimeInterval, context: inout AnimationContext<V>) -> V? where V : VectorArithmetic The purpose of your implementation is to determine how the animatable values will change during the animation. This function is called repeatedly by the system, and our job is to return the updated animatable values. This continues until we return nil to end the animation. The system will stop calling animate() after that. The first parameter is our vector (which contains all animatable values), the second parameter is how much time has elapsed since the animation began, and the last parameter is an inout animation context. This context can be used to persist data between calls to the function and also allows us to read the environment of the animated view. The beauty of this is that our code will be agnostic to the actual value(s) being animated. It can be a 1-tuple with opacity, or a 3-tuple with opacity, scale, and rotation, or whatever combination of animatable values the user of our CustomAnimation is changing. Most of the time, we are also that user, but we can design a custom animation without knowing what is going to be animated. To make our job easier, we will not be animating from the initial value to its final value, but rather the delta between them. In other words, if we are animating opacity from 0.5 to 0.8, in reality, we will be animating from 0.0 to 0.3. In most scenarios (although not necessarily), we usually return value.scaled(by: 0.0) at the beginning of the animation and value.scaled(by: 1.0) at the end. What you do in the middle will determine the curve of your animation. But let’s begin coding our first custom animation, implementing the most basic: a linear animation. Linear Animation (Example #1) struct MyLinearAnimation: CustomAnimation { let duration: TimeInterval func animate<V>(value: V, time: TimeInterval, context: inout AnimationContext<V>) -> V? where V : VectorArithmetic { guard time < duration else { return nil } return value.scaled(by: time/duration) } } // For convenience and code readability, we extend Animation extension Animation { static func myLinear(duration: TimeInterval) -> Animation { Animation(MyLinearAnimation(duration: duration)) } static var myLinear: Animation { Animation(MyLinearAnimation(duration: 2.0)) } } Then we can use our custom animation as we would with any other built-in animation. In this case, we are also adding a delay() and a repeatForever() method (which are part of the Animation type that contains our CustomAnimation). No extra work is needed for that to function! struct ExampleView: View { @State var animate: Bool = false var body: some View { Text("😵‍💫") .font(.system(size: 100)) .rotationEffect(.degrees(animate ? 360 : 0)) .task { withAnimation(.myLinear.delay(1).repeatForever(autoreverses: false)) { animate.toggle() } } } } The following table shows the values in several calls to the animate() function as time progresses: timetime/durationvalue.scaled(by: time/duration)0.00.000.20.1360.40.2720.60.31080.80.41441.00.51801.20.62161.40.72521.60.82881.80.93242.01.0360> 2.0–nil Also, note that animation duration is not a concept SwiftUI is aware of. It is up to the animate() function to determine when to stop. In this case, we conveniently define a duration property, and we end the animation when the time is no longer lower than duration. SwiftUI knows the animation is over because we return nil; otherwise, it would keep calling animate(). CustomAnimation’s AnimationContext In the previous example, we used the value and time parameters, but context was not necessary. Next, let’s see an example where it is. The context parameter in the animate() function has multiple uses. It may be used to read the view’s environment, but you can also use it to store information that needs to persist across calls to the CustomAnimation methods. We will explore both cases. AnimationContext: Environment Use Case (Example #2) Consider the following example. This new custom animation is called .random, and as you may have already guessed, it scales the value randomly. In this case, however, we are not defining a duration, so the animation never ends. struct ExampleView: View { @State var animate = false var body: some View { Text("😬") .font(.system(size: 100)) .offset(x: animate ? -3 : 3, y: animate ? -3 : 3) .animation(.random, value: animate) .task { animate.toggle() } } } extension Animation { static var random: Animation { Animation(RandomAnimation()) } } struct RandomAnimation: CustomAnimation { func animate<V>(value: V, time: TimeInterval, context: inout AnimationContext<V>) -> V? where V : VectorArithmetic { return value.scaled(by: Double.random(in: 0...1)) } } Now let’s see how we can communicate with the animate() function from the view, in order to make it stop by the press of a button. To be able to communicate with an ongoing animation, we do so through the view’s environment. Our custom implementation can read the view’s environment at any time through the context parameter. You can access any of the existing environment values, but that would not help here. In our case, we will create a custom EnvironmentValue specific to our needs. Note that this is not new; we’ve been able to create custom EnvironmentValue items since SwiftUI was introduced. If you want to learn more about it, check EnvironmentKey. Our custom environment value will be a boolean, with a false value as default, and we will call it stopAnimation: extension EnvironmentValues { var stopRandom: Bool { get { return self[StopRandomAnimationKey.self] } set { self[StopRandomAnimationKey.self] = newValue } } } public struct StopRandomAnimationKey: EnvironmentKey { public static let defaultValue: Bool = false } Now we can add a button to change the environment value: struct ExampleView: View { @State var animate = false @State var stop = false var body: some View { VStack { Text("😬") .font(.system(size: 100)) .offset(x: animate ? -3 : 3, y: animate ? -3 : 3) .animation(.random, value: animate) .task { animate.toggle() } .environment(\.stopRandom, stop) Button("Chill Man") { stop.toggle() } } } } Then it is up to our animate() function to check for the stopAnimation environment value at every call. We simply return nil when stopAnimation is true. extension Animation { static var random: Animation { Animation(RandomAnimation()) } } struct RandomAnimation: CustomAnimation { func animate<V>(value: V, time: TimeInterval, context: inout AnimationContext<V>) -> V? where V : VectorArithmetic { guard !context.environment.stopRandom else { return nil } return value.scaled(by: Double.random(in: 0...1)) } } As you can see, the environment in the context is not a snapshot at the time the animation starts, but rather a live instance of the view’s environment at the time it is being accessed. The ability to alter the behavior of an ongoing animation opens a world of opportunities! AnimationContext: Data Persistence Use Case (Example #3) Now, to explore the data persistence use case, we will expand on the same example. When the user stops the animation, the effect is abrupt. However, now we want to make our jittery character to cool down slowly: In addition to indicating when to stop, we need a way for the animation to progressively fade the effect across an arbitrary amount of time. To add our own data to the context, we need to define an AnimationStateKey. This process is very similar of how you define new EnvironmentValue keys: private struct RandomAnimationState<Value: VectorArithmetic>: AnimationStateKey { var stopRequest: TimeInterval? = nil static var defaultValue: Self { RandomAnimationState() } } extension AnimationContext { fileprivate var randomState: RandomAnimationState<Value> { get { state[RandomAnimationState<Value>.self] } set { state[RandomAnimationState<Value>.self] = newValue } } } The data we want to persist is the time of the animation when the stop request was performed. With this value and the time parameter of the animate() function, we can now determine how much time has elapsed since the user requested to stop. As time goes by, we decrease the randomness of the animation more and more until we eventually end it by returning nil. We will also add a custom parameter to our animation (fadeTime) that will let us customize how long it will take for the animation to end after the user requested it through the environment. extension Animation { stat'
