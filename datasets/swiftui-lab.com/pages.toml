full_description = "GeometryReader to the Rescue May 23, 2020June 26, 2019 by javier Most of the time, SwiftUI will do its Layout Magic and life will be wonderful. However, there are times (many times), when we require more control over the layout of our custom views. For these moments, we have several tools. The first one we are going to explore is GeometryReader. What the Parent Wants When … Read more 29 Comments SwiftUI’s Layout Magic July 1, 2019June 19, 2019 by javier A New Way of Thinking As Apple put it during their 2019 WWDC, the new SwiftUI declarative views may be considered recipes. Each containing instructions on how to build themselves. Following on this food analogy, imagine you have the main recipe, which in turn is made of other preparations. A sauce, grilled fish, garnish, etc. … Read more 3 Comments"
