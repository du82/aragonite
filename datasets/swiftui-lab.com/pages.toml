title = "Inspecting the View Tree (Nested Views) - Part 3 - The SwiftUI Lab"
description = "We will discuss how nested views in SwiftUI can set preferences on the same PreferenceKey, and avoid the child value being overwritten by its parent."
full_description = '''Inspecting the View Tree – Part 3: Nested Views October 3, 2019July 22, 2019 by javier Dealing with Preferences for Nested Views In the previous part of this series, we introduced SwiftUI anchor preferences. Now we are finally coming out of the forest. In this last part, we will put everything together. We will also learn how SwiftUI handles preferences of nested views, plus some other uses of Anchor<T>. As usual, we will begin with an example: Our goal now is to create a mini map view, that will reflect the status of a form: There are some things to notice about the example: The mini map shows a scaled down representation of the form. Different colours will represent the title view, the text field and the text field containers.As the title text view grows, the mini map reacts to it.When we add a new view (i.e., twitter field), the mini map changes as well.When frames change in the form, the mini map also updates.The text field colours are red for no input, yellow for less than 3 characters and green for 3 or more. Note that the mini map knows nothing about the form. It will only react to the changes in the preferences of the view hierarchy. Let’s Begin Coding We begin by defining some types. Since our view tree will have multiple kinds of views, when need something to tell them apart. For that purpose, we start by defining an enum: enum MyViewType: Equatable { case formContainer // main container case fieldContainer // contains a text label + text field case field(Int) // text field (with an associated value that indicates the character count in the field) case title // form title case miniMapArea // view placed behind the minimap elements } Then we define the type of data we are going to set in the preference, and we add some useful methods we will use later. The data type will have two properties (vtype and bounds): struct MyPreferenceData: Identifiable { let id = UUID() // required when using ForEach later let vtype: MyViewType let bounds: Anchor<CGRect> // Calculate the color to use in the minimap, for each view type func getColor() -> Color { switch vtype { case .field(let length): return length == 0 ? .red : (length < 3 ? .yellow : .green) case .title: return .purple default: return .gray } } // Returns true, if this view type must be shown in the minimap. // Only fields, field containers and the title are shown in the minimap func show() -> Bool { switch vtype { case .field: return true case .title: return true case .fieldContainer: return true default: return false } } } We define our PreferenceKey as usual: struct MyPreferenceKey: PreferenceKey { typealias Value = [MyPreferenceData] static var defaultValue: [MyPreferenceData] = [] static func reduce(value: inout [MyPreferenceData], nextValue: () -> [MyPreferenceData]) { value.append(contentsOf: nextValue()) } } Ok, so here is where the fun begins. We have many fields, each preceded by a text label and surrounded by a container. Let’s encapsulate that repeating pattern with a view called MyFormField. Additionally, we set preferences accordingly. Since the text field is a child of the containing VStack, and we need the bounds of both nested views, we cannot use anchorPreference() twice. Calling anchorPreference() on the Vstack would prevent the call on the TextField. Instead, we use transformAnchorPreference() on the VStack. This way we add data, instead of replacing it: // This view draws a rounded box, with a label and a textfield struct MyFormField: View { @Binding var fieldValue: String let label: String var body: some View { VStack(alignment: .leading) { Text(label) TextField("", text: $fieldValue) .textFieldStyle(RoundedBorderTextFieldStyle()) .anchorPreference(key: MyPreferenceKey.self, value: .bounds) { return [MyPreferenceData(vtype: .field(self.fieldValue.count), bounds: $0)] } } .padding(15) .background(RoundedRectangle(cornerRadius: 15).fill(Color(white: 0.9))) .transformAnchorPreference(key: MyPreferenceKey.self, value: .bounds) { $0.append(MyPreferenceData(vtype: .fieldContainer, bounds: $1)) } } } Our ContentView puts all views together. You’ll see that here we set three preferences we will need later on our mini map. We are collecting the bounds of the form title, the form area and the minimap area: struct ContentView : View { @State private var fieldValues = Array<String>(repeating: "", count: 5) @State private var length: Float = 360 @State private var twitterFieldPreset = false var body: some View { VStack { Spacer() HStack(alignment: .center) { // This view puts a gray rectangle where the minimap elements will be. // We will reference its size and position later, to make sure the mini map elements // are overlayed right on top of it. Color(white: 0.7) .frame(width: 200) .anchorPreference(key: MyPreferenceKey.self, value: .bounds) { return [MyPreferenceData(vtype: .miniMapArea, bounds: $0)] } .padding(.horizontal, 30) // Form Container VStack(alignment: .leading) { // Title VStack { Text("Hello \(fieldValues[0]) \(fieldValues[1]) \(fieldValues[2])") .font(.title).fontWeight(.bold) .anchorPreference(key: MyPreferenceKey.self, value: .bounds) { return [MyPreferenceData.init(vtype: .title, bounds: $0)] } Divider() } // Switch + Slider HStack { Toggle(isOn: $twitterFieldPreset) { Text("") } Slider(value: $length, in: 360...540).layoutPriority(1) }.padding(.bottom, 5) // First row of text fields HStack { MyFormField(fieldValue: $fieldValues[0], label: "First Name") MyFormField(fieldValue: $fieldValues[1], label: "Middle Name") MyFormField(fieldValue: $fieldValues[2], label: "Last Name") }.frame(width: 540) // Second row of text fields HStack { MyFormField(fieldValue: $fieldValues[3], label: "Email") if twitterFieldPreset { MyFormField(fieldValue: $fieldValues[4], label: "Twitter") } }.frame(width: CGFloat(length)) }.transformAnchorPreference(key: MyPreferenceKey.self, value: .bounds) { $0.append(MyPreferenceData(vtype: .formContainer, bounds: $1)) } Spacer() } .overlayPreferenceValue(MyPreferenceKey.self) { preferences in GeometryReader { geometry in MiniMap(geometry: geometry, preferences: preferences) } } Spacer() }.background(Color(white: 0.8)).edgesIgnoringSafeArea(.all) } } Finally, our MiniMap will iterate all preferences to draw each of the mini map elements: struct MiniMap: View { let geometry: GeometryProxy let preferences: [MyPreferenceData] var body: some View { // Get the form container preference guard let formContainerAnchor = preferences.first(where: { $0.vtype == .formContainer })?.bounds else { return AnyView(EmptyView()) } // Get the minimap area container guard let miniMapAreaAnchor = preferences.first(where: { $0.vtype == .miniMapArea })?.bounds else { return AnyView(EmptyView()) } // Calcualte a multiplier factor to scale the views from the form, into the minimap. let factor = geometry[formContainerAnchor].size.width / (geometry[miniMapAreaAnchor].size.width - 10.0) // Determine the position of the form let containerPosition = CGPoint(x: geometry[formContainerAnchor].minX, y: geometry[formContainerAnchor].minY) // Determine the position of the mini map area let miniMapPosition = CGPoint(x: geometry[miniMapAreaAnchor].minX, y: geometry[miniMapAreaAnchor].minY) // ------------------------------------------------------------------------------------------------- // iOS 13 Beta 5 Release Notes. Known Issues: // Using a ForEach view with a complex expression in its closure can may result in compiler errors. // Workaround: Extract those expressions into their own View types. (53325810) // ------------------------------------------------------------------------------------------------- // The following view had to be encapsulated in two separate functions (miniMapView & rectangleView), // because beta 5 has a bug that fails to compile expressions that are "too complex". return AnyView(miniMapView(factor, containerPosition, miniMapPosition)) } func miniMapView(_ factor: CGFloat, _ containerPosition: CGPoint, _ miniMapPosition: CGPoint) -> some View { ZStack(alignment: .topLeading) { // Create a small representation of each of the form's views. // Preferences are traversed in reverse order, otherwise the branch views // would be covered by their ancestors ForEach(preferences.reversed()) { pref in if pref.show() { // some type of views, we don't want to show self.rectangleView(pref, factor, containerPosition, miniMapPosition) } } }.padding(5) } func rectangleView(_ pref: MyPreferenceData, _ factor: CGFloat, _ containerPosition: CGPoint, _ miniMapPosition: CGPoint) -> some View { Rectangle() .fill(pref.getColor()) .frame(width: self.geometry[pref.bounds].size.width / factor, height: self.geometry[pref.bounds].size.height / factor) .offset(x: (self.geometry[pref.bounds].minX - containerPosition.x) / factor + miniMapPosition.x, y: (self.geometry[pref.bounds].minY - containerPosition.y) / factor + miniMapPosition.y) } } A Word About View-Tree Order It is worth pausing for a second and think about the order in which preference closures are executed in nested views. For example, have a look at the MiniMap implementation. You may have noticed that the ForEach runs the loop in reversed order. Otherwise, the rectangles representing the textfield containers, would have been drawn last, covering their corresponding mini map textfields. So it is important to know how preferences are set. Please note that there is no documentation about the order in which SwiftUI traverses the view tree. The declaration of the reduce method in PreferenceKey, does mention that values are supplied in view-tree order. However, it does not tell us what that order is. Still, we can be certain that it is not random and will be consistent for every refresh.Everything I write next about the order in which closures run, I figured out exclusively through experimentation. Basically, I put breakpoints everywhere! Nevertheless, since it seems very reasonable, I am quite confident about it. The following diagram, shows a simplified representation of the view hierarchy. Non-essential views have been omitted to make the diagram easier to read. The red arrows indicate the order in which the anchorPreference() and transformAnchorPreference() closures are executed. Note that not necessarily all closures are called, only those that SwiftUI deems necessary. For example, if the bounds of a view did not change, its .anchorPreference() closure may not run. When unsure, put a breakpoint or a print statement to debug. As observed in the graphic, it seems SwiftUI follows these two simple rules: Siblings are traversed in the same order in which they appear in code.Closures from children are executed before their parents. Other Uses of Anchor<T> As we’ve seen, an Anchor<T>.Source can be obtained through some static variables, such as .bounds, .topLeading, .bottom, etc. We typically pass them to the value parameter in the anchorPreference() modifier. However, you can also create your own Anchor<CGRect>.Source and Anchor<CGPoint>.Source using a static method in Anchor<T>.Source. For example, you could write this: let a1 = Anchor<CGRect>.Source.rect(CGRect(x: 0, y: 0, width: 100, height: 50)) let a2 = Anchor<CGPoint>.Source.point(CGPoint(x: 10, y: 30)) let a3 = Anchor<CGPoint>.Source.unitPoint(UnitPoint(x: 10, y: 30)) I hear you saying… but when will I use that? Well, you could use it to pass the value to the preference, if neither of the existing static variables work for you. But they can come specially handy when dealing with popovers: .popover(isPresented: $showPopOver, attachmentAnchor: .rect(Anchor<CGRect>.Source.rect(CGRect(x: 0, y: 0, width: 100, height: 50))), arrowEdge: .leading) { ... } Let’s Wrap It Up Congratulations. You made it to the end! I hope you enjoy your new tools and use them to conjure some amazing new apps. The possibilities are endless. Please feel free to comment below, drop me an email, or follow me on twitter. Stay tuned for more posts… until then! Categories Layout, SwiftUI Inspecting the View Tree – Part 2: AnchorPreferencesView Extensions for Better Code Readability'''
