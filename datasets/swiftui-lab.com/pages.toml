full_description = "Advanced SwiftUI Animations — Part 4: TimelineView September 28, 2021June 28, 2021 by javier It’s been two years since I published Part 3 of this series of articles about Advanced SwiftUI Animations. I’m super excited about this year’s WWDC introduction of TimelineView and Canvas. It opens a whole new range of possibilities that I will try to lay out in this and the next part of the series. In … Read more 6 Comments Random Lessons from the SwiftUI Digital Lounge June 25, 2021June 21, 2021 by javier One of this year’s WWDC highlights was the introduction of the Digital Lounges. Unfortunately, it was as good as it was ephemeral. In an instant… puff! it was gone! Many weren’t able to attend due to other commitments, lack of time, failure to register, etc. I personally failed to follow them as closely as I … Read more 10 Comments SwiftUI ’21 in Numbers June 8, 2021 by javier WWDC ’21 is finally here and it brought a lot of new toys to play with. In the upcoming weeks I will be writing new articles and will update the Companion for SwiftUI app to include all the new SwiftUI features introduced this year. In anticipation, a week ago I released a beta version of … Read more 7 Comments"
