title = "Advanced SwiftUI Transitions - The SwiftUI Lab"
description = "With SwiftUI transitions, we instruct the framework on how to animate a view when it is inserted or removed from the hierarchy."
full_description = 'Advanced SwiftUI Transitions November 15, 2019September 25, 2019 by javier In this article, we are going to explore the different options for using transitions. We’ll discuss several aspects of them. From the basic to the most advanced. How to configure, combine and trigger them. We’ll study what are the pre-existing transitions, but more importantly, how we can create our own. When doing so, the information from “Advanced SwiftUI Animations” will expand immensely the number of effects you can create. But first, the basic concepts, to make sure we are all on the same page: What Is a Transition? A transition in SwiftUI is what determines how a view is inserted or deleted from the hierarchy. A transition on its own has no effect. It must be associated with an animation. For example: Note that since XCode 11.2, transitions no longer work with implicit animations. This means the following code only works with older versions of Xcode. Fortunately, the rest of the examples work fine. Thanks to Tyler Casselman for noticing and writing the comment! struct ContentView: View { @State private var show = false var body: some View { VStack { Spacer() if show { LabelView() .animation(.easeInOut(duration: 1.0)) .transition(.opacity) } Spacer() Button("Animate") { self.show.toggle() }.padding(20) } } } struct LabelView: View { var body: some View { Text("Hi there!") .padding(10) .font(.title) .foregroundColor(.white) .background(RoundedRectangle(cornerRadius: 8).fill(Color.green).shadow(color: .gray, radius: 3)) } } As mentioned above, since Xcode 11.2, transitions no longer work with implicit animations. If you need to understand the difference between implicit vs explicit animations, check the first part of “Advanced SwiftUI Animations“. For this case, you can use any of the two options below: if show { LabelView() .transition(.opacity) } Spacer() Button("Animate") { withAnimation(.easeInOut(duration: 1.0)) { self.show.toggle() } }.padding(20) Another option is to associate an animation with a transition. Note that the animation is applied to the transition, not to the view (i.e., it’s inside .transition()). if show { LabelView() .transition(AnyTransition.opacity.animation(.easeInOut(duration: 1.0))) } Spacer() Button("Animate") { self.show.toggle() }.padding(20) Asymmetrical Transitions By default, transitions apply in one way when the view is added to the hierarchy. When the view is removed, it will produce the opposite effect. For example, .opacity will fade in when adding the view, and fade out when removing it. However, this can be changed. If we want to specify different transitions for adding/removing a view, we use the .asymmetric option: .transition(.asymmetric(insertion: .opacity, removal: .scale)) Combined Transitions If you need to apply more than one effect during the transition, you can combine them. For example, to slide a view with a fade effect, you may add this transition: .transition(AnyTransition.opacity.combined(with: .slide)) Note that you can also use .asymmetric and .combined together: .transition(.asymmetric(insertion: AnyTransition.opacity.combined(with: .slide), removal: .scale)) Transitions with Parameters So far we’ve used transitions that receive no parameters: .opacity, .slide, .scale. However, some transitions can be tuned with additional parameters. For example: .scale(scale: 0.0, anchor: UnitPoint(x: 1, y: 0)) .scale(scale: 2.0) .move(edge: .leading) .offset(x: 30) .offset(y: 50) .offset(x: 100, y: 10) Custom Transitions, the Fun Begins Now that the basic stuff is out of the way, the fun part begins. This is where we can start to get creative. Buckle up! How do Transitions work Internally, both standard and custom transitions work in the same way. They need a modifier for the beginning and the end of the animation. SwiftUI will figure out the rest, provided the difference between both modifiers is animatable. Let’s pretend the .opacity transition didn’t exist and we need to create it. Let’s call our new custom transition: .myOpacity. Here’s the implementation: extension AnyTransition { static var myOpacity: AnyTransition { get { AnyTransition.modifier( active: MyOpacityModifier(opacity: 0), identity: MyOpacityModifier(opacity: 1)) } } } struct MyOpacityModifier: ViewModifier { let opacity: Double func body(content: Content) -> some View { content.opacity(opacity) } } Then you just use the transition as usual: .transition(.myOpacity) As you can see, we simply create an extension to AnyTransition. In there, we create a new transition by specifying two modifiers, one for the beginning and another for the end. When removing the view, SwiftUI will use these modifiers inversely. Transitions at Full Throttle With what we know by now, we can create several new transitions. The existing animatable modifiers, such as .rotationEffect() or .transformEffect() open new possibilities. As soon as you start creating new transitions though, you may find yourself a little restricted. That’s when all the knowledge from “Advanced SwiftUI Animations” can set you free. Especially useful are GeometryEffect and Shapes. Custom Transitions with GeometryEffect Transitions are especially well suited for presenting and dismissing panels. If you want to build your own modal system, you should seriously consider reading this next part. For our next exercise, we will create a simple transition to demonstrate how to present and dismiss a view. extension AnyTransition { static var fly: AnyTransition { get { AnyTransition.modifier(active: FlyTransition(pct: 0), identity: FlyTransition(pct: 1)) } } } struct FlyTransition: GeometryEffect { var pct: Double var animatableData: Double { get { pct } set { pct = newValue } } func effectValue(size: CGSize) -> ProjectionTransform { let rotationPercent = pct let a = CGFloat(Angle(degrees: 90 * (1-rotationPercent)).radians) var transform3d = CATransform3DIdentity; transform3d.m34 = -1/max(size.width, size.height) transform3d = CATransform3DRotate(transform3d, a, 1, 0, 0) transform3d = CATransform3DTranslate(transform3d, -size.width/2.0, -size.height/2.0, 0) let affineTransform1 = ProjectionTransform(CGAffineTransform(translationX: size.width/2.0, y: size.height / 2.0)) let affineTransform2 = ProjectionTransform(CGAffineTransform(scaleX: CGFloat(pct * 2), y: CGFloat(pct * 2))) if pct <= 0.5 { return ProjectionTransform(transform3d).concatenating(affineTransform2).concatenating(affineTransform1) } else { return ProjectionTransform(transform3d).concatenating(affineTransform1) } } } Code at: transiftion-present-dismiss.swift Custom Transitions with Shapes Another useful scenario for transitions is when we want to cross-transition between two views. One fades-in and the other fades-out. Our first instinct would be to put both views inside a ZStack and transition by changing their opacity. That is all right, but now we have the tools to do much more: Code at: transiftion-present-dismiss.swiftThis sample code requires you to add 4 images to your asset catalog (name them photo1, photo2, photo3 and photo4). This sample is designed for an iPad in landscape orientation. You can check the code in the gist file, but all transitions follow a common pattern. They all use an animated shape to clip the incoming and outgoing images. Since both are z-stacked, we get a nice cross-effect. In Summary In this article, we uncover the tools you need to create your own SwiftUI transitions. Now you only need to set your imagination free and start creating your own cool effects. Feel free to comment, and follow me on twitter if you want to be notified when new posts are published. Until next time. Categories SwiftUI Alignment Guides in SwiftUIFrame Behaviors with SwiftUI'
