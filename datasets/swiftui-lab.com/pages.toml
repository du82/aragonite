full_description = "Advanced SwiftUI Animations – Part 7: PhaseAnimator October 30, 2023 by javier In part 6 of the Advanced SwiftUI Animations series, I covered the CustomAnimation protocol, one of the many new additions introduced at WWDC ’23. But the fun does not end there. Now it is time to look at a new view: PhaseAnimator. If you have been playing around with this new toy, you may have … Read more Leave a comment Advanced SwiftUI Animations – Part 6: CustomAnimation October 4, 2023 by javier Welcome to a new installment of the Advanced SwiftUI Animations series. I initiated this collection of articles back in 2019. Since then, Apple has been enhancing the framework and introducing new features. This year is no exception, with exciting additions that expand the possibilities of SwiftUI animations. As always, my goal is to explore every … Read more 8 Comments"
