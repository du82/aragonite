description = "One of this year’s WWDC highlights was the introduction of the Digital Lounges. Unfortunately, it was as good as it was ephemeral. In an instant… puff! it was gone! Many weren’t able to attend due to other commitments, lack of time, failure to register, etc. I personally failed to follow them as closely as I ... Read more"
full_description = 'Random Lessons from the SwiftUI Digital Lounge June 25, 2021June 21, 2021 by javier One of this year’s WWDC highlights was the introduction of the Digital Lounges. Unfortunately, it was as good as it was ephemeral. In an instant… puff! it was gone! Many weren’t able to attend due to other commitments, lack of time, failure to register, etc. I personally failed to follow them as closely as I would have like, due to an inconvenient time zone (I’ll plan better next year). Still, before the channel was taken down, I managed to take my notes. Fortunately, when the moderators were asked, they said the information is not considered private and can be shared with others. In that spirit, I have categorized, curated, and in some cases commented the SwiftUI Digital Lounge questions. For better and faster browsing, I simplified many of the questions to one (or two) lines. Still, the original text can be found inside. I have also removed all names, just in case someone is uncomfortable with it. In some of the questions, I added my own comments, by either expanding on the topic, or appending an example of what is discussed. These questions are marked with 💬. When a question is related to a new feature introduced in WWDC ’21, I flagged it with a ♦️ symbol. I also put a ⭐️ mark, on those questions that I found particularly interesting. Some of the reasons why a question gets the star are: The answer provides a brand new piece of information.The answer from Apple confirms something we suspected for a long time, but wasn’t documented anywhere.The answer from Apple confirms a pattern we’ve adopted in the community, but not seen used by Apple until now.The question discusses a topic rarely treated and deserves some attention.The answer provides some insight into the inner workings of the framework.Or just any other question that made me stop to think 🤔 Introduction over… let’s start questioning… Animations Is there a way to animate a View moving from one place in hierarchy to another? Like when a View changes parents? 💬 Yes! You should check out the matchedGeometryEffect() API, which was introduced last year: https://developer.apple.com/documentation/swiftui/view/matchedgeometryeffect(id:in:properties:anchor:issource:) Comments: I have written a two-part series post with an extensive explanation of the matchGeometryEffect modifier. Check it out here if you are interested. Is there a way to animate text font size changes? ♦️ 💬 Full Question: Is there a way to animate text font size changes? Currently in iOS14 a view can smoothly animate between two sizes or colored backgrounds, but fonts will just jump from the before animation size to the after size with no interpolation in between. Answer: This would be a great feedback to file, so that we can investigate! If you’re interested in a workaround, the Fruta sample code project has an AnimatableFontModifier that uses an explicit font size as its animatable data. This is used for the ingredient cards in the main smoothie detail view. This works for Fruta because the use-case is limited and the text using this modifier is for primarily for graphical purposes. https://developer.apple.com/documentation/swiftui/fruta_building_a_feature-rich_app_with_swiftui Comment: I have a series of articles about advanced animation techniques, one in particular deals with animating text using an AnimatableModifier. (Advanced Animations – Part 3), as shown in the example below: Is it safe to employ multiple TimelineView with the animation schedule? ♦️ ⭐️ Full Question: Is it safe to employ multiple TimelineView with the animation schedule or is it equivalent to instantiating a number of CADisplayLinks? I was thinking of the adage around “reusing” CADisplayLinks as much as possible. Answer: Yes! You should be able to use as many TimelineView as appropriate to get your interface behaving how you want. SwiftUI will take care of scheduling things so they update like you want. The thing to be careful of is to not have too much “different” between each update of the timeline content. AppKit/UIKit How can we get access to the underlying AppKit/UIKit that SwiftUI is built on? 💬 Original question: Sometimes with SwiftUI in AppKit or UIKit it’s only possible to do something by getting access to an underlying UI/NSViewController or NSWindow, but it requires some juggling to “peek beneath the covers” to surface these instances. Could SwiftUI provide more configuration proxies or some kind of factory-like mechanism to make this more explicit? Comments: Although no answer was given to the question, the back and forth conversation asking what use cases the poster needed this for, indicate that there is no intention in providing such feature. Instead, they encourage people to file feedback to ask the addition of the missing feature that required “peeking” in the first place. Although I would love to have this feature, I understand why we may never see it. If we start to peek on SwiftUI stuff under the cover, we run the risk of having our code break from one release to the next, simply because Apple changed the inner (private) workings of the view we are peeking. Does SwiftUI have an equivalente to UIView’s drawHierarchy to render the view to an image? SwiftUI doesn’t have API that supports this. That said, you can accomplish this by wrapping your SwiftUI view hierarchy in a UIHostingController and applying drawHierarchy to the hosting controller’s view. How can I control the ideal size of a UIViewRepresentable View? Original Question: How can I control the ideal size of a UIViewRepresentable View? I have a lot of trouble getting correct automatic sizing of wrapped views, especially if they wrap UIStackView. Any recommendations for getting proper automatic sizing so I don’t need to use fixedSize so much? Answer: Try implementing intrinsicContentSize on your view. Is it ok to use AnyView with UIHostingController? ⭐️ Original Question: I have a framework that vends a SwiftUI View to the main app via a HostingController. The view handles everything it needs internally, so all the types are internal. The only public method is the one that vends the HostingController. In order to maintain the isolation I do it this way: return UIHostingController(rootView: AnyView(SchedulesView(store: store))) Is this a correct way to use AnyView Answer: Yes, that’s an OK usage, particularly because it’s at the base of the hierarchy view and not used to add dynamism. But there are other ways to encapsulate the exact type of the hosting controller, for instance returning an upcast or custom protocol type: Returning it typed as UIViewController instead its actual UIHostingController<..> type.Creating a protocol with the extra API that clients might expect from the view controller, and returning it typed as that. Or by using a container UIViewController that has a child of your hosting controller. As an additional benefit, the calling module can remove the dependency on SwiftUI. Why does a UIViewRepresentable update once after makeUIView and once before dismantleUIView? The update function can be called for a number of reasons. It will be called at least once after make as the UIView becomes extant. It may be called multiple times before the UIView is eventually dismantled. You should not rely on any frequency (or lack thereof) of update calls. Follow-Up: I have a UIViewDiffableRepresentable that conforms to Hashable to check whether properties have effectively updated and therefore prevent the updateUIView call to through to expensive logic. Is it overkill? Is there a more sensible approach? Answer: It’s overkill. The framework is able to call updateUIView when properties outside of the representable struct have changed, like the environment. So, you’ll probably drop updates on the floor with this approach. when creating a UIViewRepresentable, it is dangerous for the Coordinator to hold an instance of the UIView passed in updateUIView() or should it be strictly treated as ephemeral? ⭐️ That is OK! Your coordinator will have been created before any views are — so in makeUIView you can give the coordinator a reference to that view. Is there any way to convert from the old AppDelegate/SceneDelegate lifecycle to the new “SwiftUI 2” lifecycle? Yes! You can use the UIApplicationDelegateAdaptor property wrapper in your App. Something like this: UIApplicationDelegateAdaptor var myDelegate: MyAppDelegate SwiftUI will instantiate an instance of your UIApplicationDelegate and call it in the normal fashion. Furthermore, if you return a custom scene delegate class from configurationForConnectingSceneSession, SwiftUI will instantiate it and call it as well. Backward Compatibility Can you talk about ways to have existing SwiftUI code inherit the newer features so I could support both iOS 14 and 15 with one codebase? 💬 Most new features do not back-deploy to earlier OS versions. You can use e.g. if #available(iOS 15, *) { ... } else { // Fallback on earlier versions } to check for whether a feature can be used. That said, some functionality is able to back-deploy. For example, the new ability to pass bindings to collections into List and ForEach, and get back a binding to each element, e.g. ForEach($elements) { $element in ... } is able to back-deploy to any earlier release supported by SwiftUI. Comments: Another WWDC’21 addition that is back-deployable, is enum-like styles. Is the @ViewBuilder to remove AnyView (“Demystify SwiftUI” talk) only available with iOS 15? ♦️ No, in fact it can back-deploy to any previous version! Coding Strategies Do situations exist when the developers really need to use AnyView and there are totally no alternatives using Swift constructs? ⭐️ Lot’s of questions about when it is okay or not to use AnyView! If you can avoid AnyView, we recommend that. For example, use @ViewBuilder or pass view values around using generics instead of using AnyView. However, we offer AnyView as API because we understand that there are some situations where no other solution is possible, or comes with other important tradeoffs. One rule of thumb: AnyView can be okay if used in situations where the wrapped view will rarely or never change. But using AnyView to switch back and forth between different values can cause performance issues, since SwiftUI has to do extra work to manage that. Which view body is computed first: child or parent? ⭐️ Original Question: From the dependency graph part of “Demystifying SwiftUI”: The video mentioned that both views, two views that are dependent on the same dependency, would need to generate a new body. Which view would need to generate a new body first if one view is the child of the other? Answer: The parent view will generate its body first, and recursively travers all the child views. How can we pass a view to a ViewModifier, without AnyView? ⭐️ 💬 Original Question: I have created a ViewModifier that adds a custom modal “overlay” on top of a view, somewhat similar to a sheet. Is there a way to pass a View as parameter of this ViewModifier initializer, without resorting to AnyView? I want to be able to pass the view that will be the actual “content” of the overlay. Answer: You can do this by making your custom ViewModifier generic on the content, something like: struct MyModifier<C: View>: ViewModifier { … } , then using a property with the generic like so: var content: C Comments: To expand on the issue, here’s a full example that implements a modifier that adds an overlay view only when the view is hovered over. struct ExampleView: View { var body: some View { RoundedRectangle(cornerRadius: 10) .fill(.green) .frame(width: 200, height: 80) .modifier(MyHoverModifier(hoverView: Text("hello!").font(.largeTitle))) } } struct MyHoverModifier<C: View>: ViewModifier { @State var isHovering = false var hoverView: C func body(content: Content) -> some View { content .overlay(self.hoverView.opacity(isHovering ? 1.0 : 0.0)) .onHover { isHovering = $0 } } } Group or ViewBuilder? Original Question: Fun question on conditions: We need to put them at least in Group { if whatever { … } else { … } }. So … is it preferable to use ViewBuilder commands to create it, like ViewBuilder.buildBlock(pageInfo == nil ? ViewBuilder.buildEither(first: EmptyView()) : ViewBuilder.buildEither(second: renderPage) ) Awful to read, but is it better? Answer: Using a Group is preferred in this case. Follow-Up Question: Is that for readability reasons, or is there a performance (or other) benefit here? Isn’t the if/else above going to create the same conditional content block nested in the Group? Answer: Mostly readability — it’s generally not recommended to call the result builder implementation directly and instead let the compiler handle it. Can we use .id() to keep view equality? ⭐️ Original Question: If we apply same id in the condition, will SwiftUI sees this as a same view: var body: some View { if isTrue { Text("Hello") .id(viewID) } else { Text("World") .id(viewID) } } Answer: No, these will be two different views. This is because body is implicitly a ViewBuilder. If you don’t use a ViewBuilder, such as in another property, it would be the same view. Alternatively, the view can be written as: var body: some View { Text(isTrue ? "Hello" : "World").id(viewID) } Follow-Up Question: Are there any other examples except body that are implicitly a ViewBuilder? Answer: Yes, ViewModifier‘s body function, makeBody for view styles, preview providers, and many more. Follow-Up Question: so… we should avoid conditionals in view builders as a pretty much blanket rule? Answer: Definitely not! They exist for a reason. The message here is to just be careful when using them over-aggressively. Is there any situation in which Hashable may be preferred to Identifiable? If you just need to be able to identify a value, that’s what Identifiable is for, which means that only the id needs to be Hashable, not the whole type. How can we use conditional modifiers with styles? ♦️ Original Question: How can we conditionally set different modifier, for example list styles? List { ... }.listStyle(isIpad ? .sidebar : .insets) Answer: Styles in SwiftUI are static, and are not permitted to change at runtime. This is a case where a branch is more appropriate, but consider whether you really want to change the style— a single style is almost always the correct choice. If there is a certain dynamism you’re looking for here, please file a feedback. Is there a good way to apply a modifier to a SwiftUI view conditionally? Original Question: Is there a good way to apply a modifier to a SwiftUI view conditionally? I’m using a custom .if modifier, and it refreshes the whole view on state change 🙁 Answer: Consider making an inert version of the modifier as discussed in the session. If there is a modifier that lacks an inert version that you’d like to see, please file a feedback. When using the new SwiftUI Table View, can you Group to have more than 10 TableColumns? ♦️ ⭐️ 💬 Yes, you can; just'
