full_description = "SwiftUI Custom Styling November 1, 2019 by javier In this article, we are going to discuss a simple but useful SwiftUI feature. You probably already experimented with it, and think it is just a trivial exercise… but don’t fly away so soon. I’ll present the basic setup of a button and a toggle style, but then, we’ll see some aspects that are usually … Read more 19 Comments Frame Behaviors with SwiftUI February 4, 2022October 2, 2019 by javier In this post, I am going to talk about .frame(). Seriously. I know it may seem like a boring and simple topic. If you follow my blog, you’ve probably noticed that I try to post only advanced SwiftUI techniques. You may be surprised, but .frame() is far from basic. It has some interesting behaviors and … Read more 14 Comments Advanced SwiftUI Transitions November 15, 2019September 25, 2019 by javier In this article, we are going to explore the different options for using transitions. We’ll discuss several aspects of them. From the basic to the most advanced. How to configure, combine and trigger them. We’ll study what are the pre-existing transitions, but more importantly, how we can create our own. When doing so, the information … Read more 24 Comments Alignment Guides in SwiftUI April 13, 2020September 16, 2019 by javier Alignment guides are a powerful, but usually underused layout tool. In many cases, they help us avoid more complex options, such as anchor preferences. As you can see in this example, changes to the alignment can be automatically (and easily) animated too. Code: alignment-guides-animation.swift If you ever tried using alignment guides though, chances are, you … Read more 34 Comments Dismiss Gesture for SwiftUI Modals September 17, 2019September 12, 2019 by javier I’ll say it loud and clear. What you are about to read, is a hack. As such, it comes with no warranty. Apple may change the way modals are presented in SwiftUI, which may in turn render this article completely useless. But this blog is all about experimenting and learning… so the content of this … Read more 6 Comments"
