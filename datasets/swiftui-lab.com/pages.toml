description = "WWDC 2020 finally arrived. I bet you are excited with all the new toys we’ve been given. I sure am! In the upcoming weeks, I know I will be busy updating the blog. Both revising all articles and writing new ones. I will be also updating the Companion for SwiftUI app, to make sure it ... Read more"
full_description = "WWDC 2020 Has Come and Gone June 28, 2020June 24, 2020 by javier WWDC 2020 finally arrived. I bet you are excited with all the new toys we’ve been given. I sure am!In the upcoming weeks, I know I will be busy updating the blog. Both revising all articles and writing new ones. I will be also updating the Companion for SwiftUI app, to make sure it includes all the new additions of this year’s event. Please bear with me while I get all this sorted, as I don’t want to rush and publish too many errors or misconceptions. In the meantime, I encourage you to comment below, and tell me what topics of the new SwiftUI version you find more puzzling or difficult. What subjects you think would be nice for a new article. In the meantime, here’s the list of all the SwiftUI related WWDC2020 videos with their links and durations: SessionDuration1Introduction to SwiftUI54m2What’s new in SwiftUI27m3Build SwiftUI apps for tvOS14m4Build complications in SwiftUI27m5Add custom views and modifiers to the Xcode library13m6App essentials in SwiftUI15m7Visually edit SwiftUI views5m8Build a SwiftUI view in Swift Playgrounds14m9Build document-based apps in SwiftUI12m10Stacks, Grids, and Outlines in SwiftUI19m11Build SwiftUI views for widgets20m12Data Essentials in SwiftUI36m13SF Symbols 218m14Structure your app for SwiftUI previews33m Categories SwiftUI Working with Focus on SwiftUI ViewsBackward Compatibility with SwiftUI Daniel June 24, 2020 at 10:31 pm Awesome, I’m really looking forward to your content. I still see (major) people from the community publish stuff on Twitter as “🤯brand-new 🤯” that you posted on your blog months ago (like the AnimatableModifier). Keep up the fantastic work! Reply Jon June 25, 2020 at 7:06 am This is such a fantastic blog! One thing which I would love to figure out is how to apply a fragment shader (ideally a transition shader) to a SwiftUI view (or a pair of views). I’m wondering if there is a way to get at the underlying metal backing… I have the effect system shown in this video working in SpriteKit, and I am trying to migrate it to SwiftUI: https://www.youtube.com/watch?v=LnAoD7hgDxw Reply"
