title = "WWDC 2022: Lessons from the SwiftUI Digital Lounges - The SwiftUI Lab"
description = "This has been the second year of WWDC Digital Lounges. They gave us a good opportunity to try getting our questions directly answered by the makers of SwiftUI (and other frameworks). Not everyone has been able to attend, probably due to other commitments, lack of time, failure to register, unfortunate timezones, etc. However, again this ... Read more"
full_description = 'WWDC 2022: Lessons from the SwiftUI Digital Lounges July 30, 2022June 17, 2022 by javier This has been the second year of WWDC Digital Lounges. They gave us a good opportunity to try getting our questions directly answered by the makers of SwiftUI (and other frameworks). Not everyone has been able to attend, probably due to other commitments, lack of time, failure to register, unfortunate timezones, etc. However, again this year, I took my notes before the channel is taken down (at the moment it’s still available). I asked permission to share these with you, and fortunately they had no issue with it. I have categorized, curated, and in some cases commented the SwiftUI Digital Lounge questions. For better and faster browsing, I simplified many of the questions to one (or two) lines. Still, the original text can be found inside. I have also removed all names, just in case someone is uncomfortable with it. If you want to share a question, you may use the hash button at the bottom of each question. It will copy a link to the clipboard. Using this link will load the page, scroll to the question, and expand it. In some of the questions, I added my own comments, by either expanding on the topic, or appending an example of what is discussed. These questions are marked with 💬. When a question is related to a new feature introduced in WWDC ’22, I flagged it with a ♦️ symbol. I also put a ⭐️ mark, on those questions that I found particularly interesting. Some of the reasons why a question gets the star are: The answer provides a brand new piece of information.The answer from Apple confirms something we suspected for a long time, but wasn’t documented anywhere.The answer from Apple confirms a pattern we’ve adopted in the community, but not seen used by Apple until now.The question discusses a topic rarely treated and deserves some attention.The answer provides some insight into the inner workings of the framework.The answer provides design/coding recommendations.Or just any other question that made me stop to think 🤔 In some cases, Apple engineers have provided tips that are not related to any specific questions. These have been marked with the 💡 symbol. After the WWDC, with new betas, some of the answers in here are no longer valid. The cases I detected are marked with ⚠️ and I provide additional comments. This is not a full transcript of the lounges. Not all questions made it to this page, although a very large number did. Some of them were just too specific to a user’s project, or simply addressed a very well documented and repeatedly discussed topic, others questions I may have filtered because they were either vague or their answer was vague. The lounges are a great part of the WWDC, but because its scopes everything, sometimes things can get lost in there. The idea was to make this page easy to read and reduce as much noise as possible. If you are looking for last year’s digital lounges questions, you can find them here. Backwards Compatibility Are any of this year’s changes backward compatible? ♦️ Full Question: Are any of these changes back-deployable to previous OSes (e.g., like the new Section initialisers were last year). Answer: Not this year! Last year we had some nice syntactic refinements that we were able to back deploy, but many of the features this year require fundamental new support in the OS. Is it possible to use SwiftUI Navigation for iOS 15? How can we transition to it on the existing project? ♦️ To learn how to transition your existing projects to the new navigation types, see this handy migration guide: https://developer.apple.com/documentation/swiftui/migrating-to-new-navigation-types Are there macOS cases that you would recommend using AppKit rather than SwiftUI? ⭐️ Full Question: Are there any types of macOS apps or interfaces where you would still recommend using appkit rather than SwiftUI? I’m yet to invest the considerable amount of time learning SwiftUI and I keep reading mentions of people saying it’s still a mixed bag for macOS development, so I don’t want to potentially waste time. Thanks! Answer: Good question! Across all platforms, we’d recommend comparing your needs to what SwiftUI provides (so no hard rules/recommendations) — and keeping in mind that you can adopt SwiftUI incrementally. Within Apple’s own apps on macOS, we’re ourselves using the full spectrum of approaches. From just a specific view/views in an app, e.g. in Mail, iWork, Keychain Access; to an entire portion of the UI or a new feature, e.g. in Notes, Photos, Xcode; and all the way to the majority of an application, e.g. Control Center, Font Book, System Settings. But in the end, I’d recommend starting with a part you’re comfortable with and building up from there! You should look at SwiftUI as another tool in your toolset in enabling you to build the best apps you can. What is the recommended way to conditionalize code for view modifiers that are only available on newer versions of iOS? 💬 We recommend factoring out the common parts and then using if #available checks to use the relevant modifier. Something like this: let common = commonViewParts if #available(iOS 16.0, macOS 13.0, *) { return common.newModifier() } else { return common.oldModifier() } SwiftUI-Lab Comment: If it helps for code readability or reusability, you can also put those modifiers inside another modifier: struct ContentView: View { var body: some View { Text("Section #1") .modifier(SectionTitleModifier()) } } struct SectionTitleModifier: ViewModifier { func body(content: Content) -> some View { if #available(iOS 16.0, macOS 13.0, *) { return content.underline() } else { return content.font(.largeTitle) } } } Charts Are doughnut and pie charts also supported? ♦️ Engineer #1: That’s an interesting question about Pie charts specifically. The data visualization academic community right now has mixed feelings generally about pie charts. They aren’t supported in Swift Charts. I’m not data-vis expert though. Engineer #2: Swift Charts does not support radial layouts so no pie charts or donut charts. However, you can usually show the same data as a bar chart, which may actually be easier to read and is more accessible to e.g. Voice Over users (linear layout is closer to the navigation order in other interface elements). Can it be used to show realtime (e.g., sensor) data? ♦️ yes, you can use it with realtime data Any hierarchy tree type charts? ♦️ There is no native support for hierarchical layouts in Swift Charts. You could use it to render the output of a tree layout algorithm (e.g., Treemap) with the rectangle mark but I don’t think you get that much benefit from Swift Charts over SwiftUI in that case. Any support for rendering this to a scalable PDF beyond embedding as an image? ♦️💬 To create a PDF, you can use the ChartRenderer API to render a chart into a CGPDFContext. SwiftUI-Lab Comment: Check my post about SwiftUI renderers for an example. Do we get the Audio Charts for free when using native charts? ♦️ Full Question: Do we get the Audio Charts for free when using native charts or do we still have to provide a chart descriptor? Answer: Yes, you get Audio Graph support automatically. However, the framework can only infer so much automatically so you may still want to override the default to get the best experience for your VoiceOver users. Custom Grids vs Swift Charts. Which one is better in this case? ♦️ Full Answer: To create a chart-like layout like this, do you recommend using the new Chart library or building it custom with Grids? Are there any performance benefits for one or the other approach? Answer: You can use Swift Charts. You will get the axes and color scale for free and also better performance (I think but would need to try). Are charts interactive? ♦️ Full Question: Concerning interactions: is there any onTap handler (available/planned) where we can react to a users tap and show (more) info of the mark below? (in particular not overlaying a GeometryReady and find out the position/mark on our own). Answer: There is a chart reader that you can use for interactions. Check out the “Swift Charts: Raise the Bar” talk. Is it be possible to add a gradient color filling the area underneath the line in a line chart? ♦️ It is! I made one like this while putting the talk together, I can’t remember exactly how I did it. I may have used an AreaMark that fills the area under the line, and they also stack to make some really cool area charts. When you’re making those kinds of charts, using Color.clear as a part of your gradient makes the Chart look a lot neater in light and dark appearances IMO. Can the new Charts API allow for scrolling? Similar to the health app’s charts. ♦️ Yes, charts should behave just like any other view in this regard. though you may have to set explicit frames on the chart to specify how big (wide? tall?) you want it to be. Could we utilize a scrollview and a chart to display a live chart? ♦️ ⭐️ Full Question: Forgive me if this question has the same answer as the scrolling chart question, but could we utilize a scrollview and a chart to display a live chart? So new data added is always visible to the user, instead of having to manually scroll it into view. Answer: Yes, this should work, but will extra work. You may have to observe the data and manually keep the scroll view positioned at the very end. It sounds like you want to use to be able to scroll backwards through an otherwise-live feed, but if that isn’t the case, the data plotted in your chart could always be just the last 7 elements of an array or something conceptually similar. User Reply: Yeah, basically keep a horizontal scrollview fixed to the end and allow the user to scroll back to the left (start) of the view. Is there a modifier or additional context to manually position the location of the scrollbar in a scrollview? Answer: Have you seen ScrollViewReaders? How would one go about creating a Bubble Chart with Swift Charts? ♦️ You can use the symbolSize(by:) modifier (https://developer.apple.com/documentation/charts/chartcontent/symbolsize(by:)) to size the points by data. To make the points look like bubbles, you can use .symbol(Circle().strokeBorder(lineWidth: 1)) so the symbols are drawn as stroked circles. Here is an example: Chart(data) { PointMark( x: .value("Wing Length", $0.wingLength), y: .value("Wing Width", $0.wingWidth) ) .symbolSize(by: .value("Weight", $0.weight)) .symbol(Circle().strokeBorder(lineWidth: 1)) } How to balance large data sets and performance ♦️ ⭐️ Full Question: I currently have a large data set (over 10k datapoints) that I’m working with. Are there any tips on how to improve the graph performance when working with creating line graphs from data sets of that size or larger? Context is cycling related data in a macOS app that is presenting 6 or more in a LazyVGrid. Engineer: We recommend simplifying the data before rendering it. For your example, you could simplify the line or summarize the data points in small intervals (let’s say you have data for a year, you summarize the data for a day). The added advantage is that you can summarize using mean, min and max and show the full range within the small interval. User #2: an Apple resource I found helpful with this kind of thing is using antialiasing filters to resample the data. https://developer.apple.com/documentation/accelerate/resampling_a_signal_with_decimation Engineer: Another useful resource are the number and date bins we released this year: https://developer.apple.com/documentation/charts/datebins and https://developer.apple.com/documentation/charts/numberbins. Can Swift Charts be adapted for non-discrete data, like curves, etc? ♦️💬 You can render curves by sampling data points along the function and then rendering that. You can add interpolation to make the line look smooth. Swift Charts cannot directly render functions. SwiftUI-Lab Comment: To add a curved interpolation, use the interpolationMethod(): LineMark(x: .value("Label", dt.label), y: .value("Value", dt.value)) .foregroundStyle(.yellow) .interpolationMethod(.catmullRom) Is there any sample code or documentation on how to display vector fields with Swift Charts? ♦️ ⭐️ 💬 Answer: Like this? This screenshot is from the Hello Swift Charts talk. You can use a custom symbol (Arrow ). Chart(data, id: \.x) { PointMark(x: .value("x", $0.x), y: .value("y", $0.y)) .symbol(Arrow(angle: CGFloat(angle)) .foregroundStyle(by: .value("angle", angle)) .opacity(0.7) } ... struct Arrow: ChartSymbolShape { let angle: CGFloat let size: CGFloat func path(in rect: CGRect) -> Path { let w = rect.width * size * 0.05 + 0.6 var path = Path() path.move(to: CGPoint(x: 0, y: 1)) path.addLine(to: CGPoint(x: -0.2, y: -0.5)) path.addLine(to: CGPoint(x: 0.2, y: -0.5)) path.closeSubpath() return path.applying(.init(rotationAngle: angle)) .applying(.init(scaleX: w, y: w)) .applying(.init(translationX: rect.midX, y: rect.midY)) } var perceptualUnitRect: CGRect { return CGRect(x: 0, y: 0, width: 1, height: 1) } } This is not the complete code but should give you enough to make the example. SwiftUI-Lab Comment: Remember to include chartForegoundStyleScale() to have multiple colors, otherwise the chart would look monochromatic: Chart { ... }.chartForegroundStyleScale(range: Gradient(colors: [.green, .yellow, .red])) In the example of the answer, the color is reflecting the angle of the vector, but since the angle is already shown by the symbol, you may want to use the color to depict the vector’s magnitude instead. You may do so, changing the .foregroundStyle(by:) call accordingly. How easy is it to support interactions like pan-to-move and pinch-to-zoom? ♦️ ⭐️ Answer: For pan-to-move, you can use a SwiftUI gesture in conjunction with ChartProxy. From the gesture, you get the the pan distance, and then you can use ChartProxy to figure out the pan distance in the data domain. Then, you can set the domain for the X scale with .chartXScale(domain: start + offset...end + offset) , where you can adjust the offset to pan the chart. User#2 Reply: Can a similar strategy be used for pinch-to-zoom? Answer: Yes, you can use a pinch to zoom gesture (or any other gesture) and hook up the events in a similar way. OP: Without location information (like the new SpatialTapGesture) it would be a bit unnatural as we wouldn’t know where to center the zoom, right? MagnificationGesture doesn’t provide location information, unless I’ve missed something. Answer: Feel free to file a feedback to SwiftUI for providing location information to gestures. For now I think you can try implement a UIView with UIPinchGestureRecognizer and then wrap the view with UIViewRepresentable so it can be used in SwiftUI. Is there multiple axis support? Logarithmic axis support? ♦️ A Swift Charts chart can only have one axis per x and y. Swift Charts supports logarithmic scales. For example, you can specify a log scale on x with .chartXScale(type: .log) You can however, have multiple sets of labels '
