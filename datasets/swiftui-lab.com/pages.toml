["https://swiftui-lab.com/matchedgeometryeffect-part2"]
title = "MatchedGeometryEffect - Part 2 - The SwiftUI Lab"
description = "In part 2, we will explore how to use MatchedGeometryEffect to match the geometry of views that are simoultaneosly part of the view hierarchy."
full_description = 'MatchedGeometryEffect – Part 2 August 23, 2020July 13, 2020 by javier With the release of Xcode 12 beta 4, two bugs mentioned in this articles got fixed! I marked those sections with a note, but will keep the sections for a couple of weeks, in case some readers are still using an older beta. The elimination of those bugs will make our life easier. In fact, some snippets of code in this article could be simplified a little. I will do so when I remove the aforementioned sections. This is the second and last part of the MatchedGeometryEffect series. These parts can be read in any order. Depending which aspect you would like to focus on first. In part 1, we learned how to match the geometry of a view that is removed from the hierarchy, with one that is inserted. This, combined with custom transitions and animatable modifiers, offers a lot of possibilities for hero animations and other interesting effects. The first part includes a full Xcode project with a demonstration on how to create App Store-like transitions. In this part 2, we are going to focus on how to match the geometry of two or more views that are simultaneously part of the view hierarchy. We will also explore how to use this to create more hero animations, but this time, without needing to use custom transitions. This will be showcased by the example shown in the video below (Xcode project included here). What is the Source of Geometry So far, we have ignored the isSource parameter of the matchedGeometryEffect() method. But no longer. The source parameter, which is a boolean, determines if the view is providing the geometry, or “borrowing” it. So far, we used the default value (true) for both. This is because, in the case of transitioning views, they both are the source. In other words, the incoming view uses the geometry of the outgoing view as the starting size and position of the transition, and the outgoing view uses the geometry of the incoming view as the final size and position of the transition. Both views are source and consumer at the same time! Now, in this new use case, that’s not true any more. In fact, if multiple views are part of the hierarchy, only one can be the source for a specific id and namespace. If you set multiple views as the source for a given id+namespace combination, SwiftUI won’t like it, and it will complain at runtime with a very clear log message: Multiple inserted views in matched geometry group Pair<Int, ID>(first: 1, second: SwiftUI.Namespace.ID(id: 6)) have `isSource: true`, results are undefined. Meet Our New Friend Before we continue describing every detail of the matchedGeometryEffect modifier, let me introduce a view that will be used extensively in the examples below. The view is named Triangle, and it simply draws a triangle pointing in the given direction, fills it with the specified color, and adds a black border. You may wonder why this shape? Well, we need the examples to be able to show multiple overlapping views but still, be able to seem them all. You can always see up to 4 overlapping Triangle views, provided they have different directions: The code for the view can be found in this gist: squared-triangle.swift Introducing matchedGeometryEffect, again… We already introduced matchedGeometryEffect in Part 1 of this article, but as I mentioned there, it has two distinct uses. To my eyes they are so different, that I think it deserves a new introduction. This time, however, we’ll have in mind its other use case (i.e., matching geometries between two or more existing views). In a nutshell, when we have two views paired with matchedGeometryEffect, we are simply telling one view (A) to offset its position and resize itself, to match the position and size of another view (B). The view that provides the geometry (B in the example above) is the source, while the other (A), I will call it the consumer. Note that “consumer” is not the official terminology, but I think it is fitting. Officially, the view is either the source or not the source. But that would make the article a little confusing. From now on, when I refer to a consumer view, I am referring to a view that is NOT the source of a matchedGeometryEffect. But enough talk, let’s start coding… Baby Steps Before we begin, let’s do a quick recap on what are the id and namespace parameters of the matchedGeometryEffect modifier. Both the id and the namespace together, identify a view. If two views have a call with the same id and namespace, those two views will be matched. The type of match will depend on the other parameters. To learn a little more on id and namespace, refer to part 1. In our first example, we have two views. We use the toggle to make the one on the right use the geometry (i.e., size and position) of the view on the left. struct ExampleView: View { @Namespace var ns @State var matched: Bool = false var body: some View { VStack(spacing: 50) { HStack(spacing: 30) { Triangle(.down, .blue) .matchedGeometryEffect(id: "id1", in: ns) .frame(width: 150, height: 150) .border(Color.gray) Triangle(.right, .green) .matchedGeometryEffect(id: matched ? "id1" : "", in: ns, isSource: false) .frame(width: 75, height: 75) .border(Color.gray) } Toggle(isOn: $matched.animation(.easeInOut), label: { Text("Matched") }).frame(width: 140) } } } The first thing to notice is the fact that changes to any parameter in matchedGeometryEffect can be animated. All of them, when they produce a change in size or position if triggered by a variable in an animation closure, it will animate. And when I say any of the parameters, I really mean any. That includes the less intuitive, such as namespace and isSource. The next thing to observe, is that the view that is taking the geometry, is not releasing its space in the layout. Any surrounding views will remained unaffected. As a matter of fact, the gray border remains there, as it is placed after the call to matchedGeometryEffect(). Remember that so called SwiftUI modifiers DO NOT actually modify the view. Instead a new view is created to wrap around the “modified” view. If you ever get confuse with this, think matchedGeometryEffect as a modifier that simply calls .offset() and .frame() on the view. It just does it with the right values to make the second view, “match” the first one. Let’s see how we can replicate the same results, but WITHOUT using matchedGeometryEffect: struct ExampleView: View { @Namespace var ns @State var matched: Bool = false var body: some View { let viewArect = CGRect(x: 0, y: 0, width: 150, height: 150) let viewBrect = CGRect(x: 180, y: 37.5, width: 75, height: 75) return VStack(spacing: 30) { HStack(spacing: 30) { Triangle(.down, .blue) .frame(width: 150, height: 150) .border(Color.gray) Triangle(.right, .green) // --------------------------------------------------- // Here begins our .matchedGeometryEffect equivalent .offset(x: !matched ? 0 : (viewArect.origin.x - viewBrect.origin.x) + ((viewArect.size.width - viewBrect.size.width) / 2.0), y: !matched ? 0 : (viewArect.origin.y - viewBrect.origin.y) + ((viewArect.size.height - viewBrect.size.height) / 2.0)) .frame(width: !matched ? viewBrect.size.width : viewArect.size.width, height: !matched ? viewBrect.size.height : viewArect.size.height) // Here ends our .matchedGeometryEffect equivalent // --------------------------------------------------- .frame(width: 75, height: 75) .border(Color.gray) } Toggle(isOn: $matched.animation(.easeInOut), label: { Text("Matched") }).frame(width: 140) } } } As you can see, the code not only is much harder to understand, but it also requires that in order to perform all the calculations, we know the geometry of both views in the same coordinate space! As you probably know by now, that is not easy to do with SwiftUI. You need to use GeometryReader, preferences, or maybe some other method. In this case, I hardcoded the values because I know them in advance. That is rarely the case. Properties to Match, but Not So Much The modifier provides the option to decide how much geometry we want to match. That is, you can match just the position, the size, or both. By default, it matches both. This is done by specifying .position, .size, or .frame in the properties parameter of the view that is NOT the source. The properties parameter on the source view will have no effect. The source view always shares all its geometry (i.e., both size and position). It is up to the consumer, to decide what it wants to take. Let’s see with an example. So far we have omitted the properties parameter. It defaults to .frame, which means match both size and position. Now we will slightly modify the call to matchedGeometryEffect on the second view to match only the size: .matchedGeometryEffect(id: matched ? "id1" : "", in: ns, properties: .size, isSource: false) The same can be done with the position: .matchedGeometryEffect(id: matched ? "id1" : "", in: ns, properties: .position, isSource: false) Anchoring Paired Views The matchedGeometryEffect has another parameter (the last one I promise), called anchor. A very useful parameter indeed. When calling matchedGeometryEffect, we specify the anchor point both in the source view, and the consumer view. When the view is repositioned, it is done in a way that both anchor points match. Anchor points are expressed as UnitPoint types (more on this later). In the first example, we are setting .topLeading as the anchor point for the source view (blue) and .bottomTrailing for the consumer view (green). struct ExampleView: View { @Namespace var ns var body: some View { Group { Triangle(.down, .blue) .matchedGeometryEffect(id: "id1", in: ns, anchor: .topLeading) .frame(width: 75, height: 75) Triangle(.right, .green) .matchedGeometryEffect(id: "id1", in: ns, anchor: .bottomTrailing, isSource: false) .frame(width: 75, height: 75) } } } To better illustrate, let’s see the following animation. Here, the source view (blue) is always using .topLeading as its anchor point, and the consumer view (green) goes over all 9 predefined anchor points. The red dot shows the anchor point of the source view, and the yellow dot shows the anchor point of the consumer view. A gist file for the code that generates this animation can be found here: matchedGeometryEffect-anchorPoints.swift The Problem with the Anchor Parameter (fixed) The bug described in this section has been fixed in Xcode 12 beta 4, so you can skip this section. I will keep it here for readers that have not updated to beta 4 yet, but I’ll remove this section soon. So far, using anchor points seems pretty straight forward. Doesn’t it? Well, that is as far as both views have the same size. When we match two views only by its position, and if they do not happen to have the same size, things get a little trickier. See the example below: struct ExampleView1: View { @Namespace var ns var body: some View { Group { Triangle(.down, .blue) .matchedGeometryEffect(id: "id1", in: ns, anchor: .topLeading) .frame(width: 100, height: 100) Triangle(.right, .green) .matchedGeometryEffect(id: "id1", in: ns, properties: .position, anchor: .bottomTrailing, isSource: false) .frame(width: 75, height: 75) } } } Let’s analyze what happened here. Although we specified to anchor both views by their .topLeading and .bottomTrailing points, as in the first anchor example, their corners are not touching now. Can you guess why? Let me add a dotted line to superimpose the size of the source view over the consumer view: The .bottomTrailing point for the green view is using the size of the blue view, even though we only asked to match position, not size. This, to me, looks like a bug. I don’t see much benefit from this behavior and I would very much rather have the anchor point in the green view refer to its own size. I have submitted a bug report to Apple (FB7967943) and I am really wishing this is a bug and not the intended behavior. However, if this is not fixed by the GM, I doubt it will ever be changed, as it would break any code written following the current behavior. At the time of this writing we are only at beta 2. Let’s wait and see. A Quick Word on UnitPoint A quick note on the UnitPoint type. In most examples, when using UnitPoint, we specify the predefined values (.topLeading, .center, .bottom, etc.). This could mislead you into thinking that UnitPoint is an enum, but it is not. It is a struct, with some static variables for predefined points, such as: .topLeading = UnitPoint(x: 0, y: 0) .bottomTrailing = UnitPoint(x: 1, y:0) .center = UnitPoint(x: 0.5, y: 0.5) This means you can actually define your own UnitPoint, let’s say: UnitPoint(x: -1.5, y: 0.5). Note that you can also use negative numbers and exceed the 0.0 to 1.0 range, as long as it makes sense. Annoying Behavior With No Source (fixed) The bug described in this section has been fixed in Xcode 12 beta 4, so you can skip this section. I will keep it here for readers that have not updated to beta 4 yet, but I’ll remove this section soon. There’s another behavior, which I’d like to think is a bug and not by design. I have filed a bug report (FB7968204). We’ll see what happens. When we have a matchedGeometryEffect that we want to disable, we can simply set the id to a value not used by any source. However, when two views have the same match id and none is the source, I would expect the match to not occur. However, as things stand on beta 2, one of the none source views will act as the source. In my experience so far, it is always the first view the one that takes the role. This is very annoying. Every view you want to unpair will need a completely different id. This is clear in the example of the next section. Multiple Groups, with Multiple Views So far, we have paired two views together. However, matchedGeometryEffect does not limit you there. You can have multiple groups of pairings, and each group can have more than two views, as long as only one is the source for that group. Let’s see an example: struct ExampleView1: View { @Namespace var ns @State private var matched = false var body: some View { VStack(spacing: 50) { HStack { Triangle(.down, .purple) .matchedGeometryEffect(id: "id1", in: ns) .frame(width: 100, height: 100) .border(Color.gray) Triangle(.right, .green) .matchedGeometryEffect(id: matched ? "id1" : "unpair1", in: ns, isSource: false) .frame(width: 100, height: 100) .border(Color.gray) Triangle(.up, .yellow) .matchedGeometryEffect(id: "id2", in: ns) .frame(width: 100, height: 100) .border(Color.gray) Triangle(.left, .red) .matchedGeometryEffect(id: matched ? "id2" : "unpair2", in: ns, isSource: false) .frame(width: 100, height: 100) .border(Color.gray) Triangle(.down, .orange) .matchedGeometryEffect(id: matched ? "id2" : "unpair3", in: ns, isSource: false) .frame(width: 100, height: 100) .border(Color.gray) } } Toggle(isOn: $matched.animation(.easeInOut), label: { Text("Matched") }).frame(width: 140) } } Multiple Namespaces We introduced Namespaces in part 1. We mentioned already that namespaces are useful to prevent id col'
