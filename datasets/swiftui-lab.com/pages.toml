title = "Inspecting the View Tree with PreferenceKey - Part 1 - The SwiftUI Lab"
description = "SwiftUI provides a way to pass information through the view tree, and lets children communicate with ancestors. More about PreferenceKey and friends here."
full_description = 'Inspecting the View Tree – Part 1: PreferenceKey October 3, 2019July 8, 2019 by javier With SwiftUI, we normally don’t need to worry about what happens internally on our child views. Each happily does its own thing. However, life is not always normal. When we face these circumstances, SwiftUI provides us with some great tools. Unfortunately, its documentation is brief at best. This three part article tries to put a remedy to that. We are going to learn about the PreferenceKey protocol and its associated modifiers: .preference(), .transformPreference(), .anchorPreference(), .transformAnchorPreference(), .onPreferenceChange(), .backgroundPreferenceValue() and .overlayPreferenceValue(). There is a lot to cover, so let’s begin! SwiftUI has a mechanism that allows us to “attach” some attributes to our views. These attributes are called Preferences, and these may be passed up the view hierarchy easily. There’s even the possibility of installing a callback that executes whenever these preferences change. Have you ever wondered how does NavigationView get the title from .navigationBarTitle(). Note that .navigationBarTitle() does not modify NavigationView directly, instead, it is invoked down the view hierarchy! So how does it do it! Well you probably guessed it already. It uses preferences. In fact, it is mentioned very briefly during the WWDC session SwiftUI Essentials. It is just a 20 second mention, and easily missed. If you’re interested, check Session 216 (SwiftUI Essentials) and jump to 52:35. We will also learn that there are some special kind of preferences, called “anchored preferences”. These are very useful to retrieve all kinds of geometry information from our child views. We will cover this anchored preferences in the next part of this article. Independent Views We’ll deal with PreferenceKey in a minute, but to better understand the topic, let’s start with an example that does not need preferences. In this case, each view knows what to do by itself. We are going to create a view that displays month names. When a month label is touched, a border gently appears around it (removing the one from the previous selection). Example 1 The code is very simple, nothing too special about it. First we have our ContentView: import SwiftUI struct EasyExample : View { @State private var activeIdx: Int = 0 var body: some View { VStack { Spacer() HStack { MonthView(activeMonth: $activeIdx, label: "January", idx: 0) MonthView(activeMonth: $activeIdx, label: "February", idx: 1) MonthView(activeMonth: $activeIdx, label: "March", idx: 2) MonthView(activeMonth: $activeIdx, label: "April", idx: 3) } Spacer() HStack { MonthView(activeMonth: $activeIdx, label: "May", idx: 4) MonthView(activeMonth: $activeIdx, label: "June", idx: 5) MonthView(activeMonth: $activeIdx, label: "July", idx: 6) MonthView(activeMonth: $activeIdx, label: "August", idx: 7) } Spacer() HStack { MonthView(activeMonth: $activeIdx, label: "September", idx: 8) MonthView(activeMonth: $activeIdx, label: "October", idx: 9) MonthView(activeMonth: $activeIdx, label: "November", idx: 10) MonthView(activeMonth: $activeIdx, label: "December", idx: 11) } Spacer() } } } And our helper views: struct MonthView: View { @Binding var activeMonth: Int let label: String let idx: Int var body: some View { Text(label) .padding(10) .onTapGesture { self.activeMonth = self.idx } .background(MonthBorder(show: activeMonth == idx)) } } struct MonthBorder: View { let show: Bool var body: some View { RoundedRectangle(cornerRadius: 15) .stroke(lineWidth: 3.0).foregroundColor(show ? Color.red : Color.clear) .animation(.easeInOut(duration: 0.6)) } } The code is pretty straight forward. Whenever a month label is tapped, we change a @State variable that keeps track of the month last tapped. We also made the border color of each month view dependant on this variable. If the view is selected, the border color is set to red. Otherwise, the border is made transparent. This case is simple, because each view draws its own border. Collaborating Views Let’s complicate things a little. Now, instead of fading, we want our border to move from month to month. Example 2 I would like you to pause for a second, and think about how you would approach this problem. Unlike the previous example where you had 12 borders (one for each view), we now have a single border, that needs to change size and position using an animation. In this new example, the border is no longer part of the month view. Now, we need to create a separate single border, but it needs to move and resize accordingly. That means there must be a way of keeping track of the size and location of each month view. If you read my previous article (GeometryReader to the Rescue), you already have one of the tools required to solve this problem. If you do not know how GeometryReader works, please stop here and go check that first. One way to solve this problem, is by making each month view to use GeometryReader in order to obtain its own size and location. Each view will in turn update an array of rectangles shared with their parent (through a @Binding). Now, since the parent knows every child size and location, the border can be easily placed. This approach is good, unfortunately, having child views modifying this array raises a problem. For certain layouts, if while building the body of a view, we modify a variable that affects the position of the parent, the child view may in turn be affected as well. This invalidates the view we are building, and it may need to start again. It could be a never-ending cycle. Fortunately, SwiftUI seems to detect this conditions and will not crash. However, it will reward you with a runtime error warning: Modifying state during view update. The quick fix to this problem is to delay the variable change, until the view update is through: DispatchQueue.main.async { self.rects[k] = rect } Nevertheless, it seems a bit of a hack. Although in practice it works, it is an empirical solution that I am not sure will continue to work in the future. It gambles too much on how the framework works at the moment. But that, is a big unknown, because as you know… there is no documentation. Luckily, here is where PreferenceKey makes its entrance. Introducing PreferenceKey SwiftUI provides us with a modifier that let us add some data of our own choosing on any particular view. This data can later be interrogated by an ancestor view. There are multiple ways in which preferences can be read. The method you use will depend on what you are trying to achieve. Anyway, it looks like preferences are exactly what we need, so let’s try to solve our problem: We first need to determine what information we would like to expose through preferences. In our example we want: Something to identify the view. Here we are going to use a single Int value, from 0 to 11. But it can be anything you want.The location and size of the text view. A CGRect value can do that. And we put everything together with a struct we are naming MyTextPreferenceData. Notice that it should conform to Equatable: struct MyTextPreferenceData: Equatable { let viewIdx: Int let rect: CGRect } Then, we need to define a struct that implements protocol PreferenceKey: struct MyTextPreferenceKey: PreferenceKey { typealias Value = [MyTextPreferenceData] static var defaultValue: [MyTextPreferenceData] = [] static func reduce(value: inout [MyTextPreferenceData], nextValue: () -> [MyTextPreferenceData]) { value.append(contentsOf: nextValue()) } } The only documentation available for PreferenceKey is what it says in its definition file, which I strongly encourage you to read. But basically, you have to implement the following: Value: is a typealias that indicates what type of information we want to expose through the preference. In this example you see that we are using an array of MyTextPreferenceData. I will get to that in a minute.defaultValue: When a preference key value has not been set explicitly, SwiftUI will use this defaultValue.reduce: This is a static function that SwiftUI will use to merge all the key values found in the view tree. Normally, you use it to accumulate all the values it receives, but you can do whatever you want. In our case, when SwiftUI goes through the tree, it will collect the preference key values and store them together in a single array, which we will be able to access later. You should know that Values are supplied to the reduce function in view-tree order. We’ll come back to that in another example, as the order is not relevant here. Now that we have our PreferenceKey struct setup, we need to make changes to our previous implementation: First, we modify our MonthView. We are going to use GeometryReader in order to get the text size and location. These values need to be translated into the coordinate space of the view where the border is going to be drawn. Views can name their coordinate spaces by applying the modifier .coordinateSpace(name: "name"). Once we have our converted rect, we set the preference accordingly: struct MonthView: View { @Binding var activeMonth: Int let label: String let idx: Int var body: some View { Text(label) .padding(10) .background(MyPreferenceViewSetter(idx: idx)).onTapGesture { self.activeMonth = self.idx } } } struct MyPreferenceViewSetter: View { let idx: Int var body: some View { GeometryReader { geometry in Rectangle() .fill(Color.clear) .preference(key: MyTextPreferenceKey.self, value: [MyTextPreferenceData(viewIdx: self.idx, rect: geometry.frame(in: .named("myZstack")))]) } } } Then, we create a separate view for the border. This view will change its offset and frame to match the rect corresponding to the view that has been tapped last: RoundedRectangle(cornerRadius: 15).stroke(lineWidth: 3.0).foregroundColor(Color.green) .frame(width: rects[activeIdx].size.width, height: rects[activeIdx].size.height) .offset(x: rects[activeIdx].minX, y: rects[activeIdx].minY) .animation(.easeInOut(duration: 1.0)) Finally, we need to make sure that when preferences change, we update the rects array appropriately. For example, when the device rotates, or a window changes size, this code will be called: .onPreferenceChange(MyTextPreferenceKey.self) { preferences in for p in preferences { self.rects[p.viewIdx] = p.rect } } Below is the complete code import SwiftUI struct MyTextPreferenceKey: PreferenceKey { typealias Value = [MyTextPreferenceData] static var defaultValue: [MyTextPreferenceData] = [] static func reduce(value: inout [MyTextPreferenceData], nextValue: () -> [MyTextPreferenceData]) { value.append(contentsOf: nextValue()) } } struct MyTextPreferenceData: Equatable { let viewIdx: Int let rect: CGRect } struct ContentView : View { @State private var activeIdx: Int = 0 @State private var rects: [CGRect] = Array<CGRect>(repeating: CGRect(), count: 12) var body: some View { ZStack(alignment: .topLeading) { RoundedRectangle(cornerRadius: 15).stroke(lineWidth: 3.0).foregroundColor(Color.green) .frame(width: rects[activeIdx].size.width, height: rects[activeIdx].size.height) .offset(x: rects[activeIdx].minX, y: rects[activeIdx].minY) .animation(.easeInOut(duration: 1.0)) VStack { Spacer() HStack { MonthView(activeMonth: $activeIdx, label: "January", idx: 0) MonthView(activeMonth: $activeIdx, label: "February", idx: 1) MonthView(activeMonth: $activeIdx, label: "March", idx: 2) MonthView(activeMonth: $activeIdx, label: "April", idx: 3) } Spacer() HStack { MonthView(activeMonth: $activeIdx, label: "May", idx: 4) MonthView(activeMonth: $activeIdx, label: "June", idx: 5) MonthView(activeMonth: $activeIdx, label: "July", idx: 6) MonthView(activeMonth: $activeIdx, label: "August", idx: 7) } Spacer() HStack { MonthView(activeMonth: $activeIdx, label: "September", idx: 8) MonthView(activeMonth: $activeIdx, label: "October", idx: 9) MonthView(activeMonth: $activeIdx, label: "November", idx: 10) MonthView(activeMonth: $activeIdx, label: "December", idx: 11) } Spacer() }.onPreferenceChange(MyTextPreferenceKey.self) { preferences in for p in preferences { self.rects[p.viewIdx] = p.rect } } }.coordinateSpace(name: "myZstack") } } struct MonthView: View { @Binding var activeMonth: Int let label: String let idx: Int var body: some View { Text(label) .padding(10) .background(MyPreferenceViewSetter(idx: idx)).onTapGesture { self.activeMonth = self.idx } } } struct MyPreferenceViewSetter: View { let idx: Int var body: some View { GeometryReader { geometry in Rectangle() .fill(Color.clear) .preference(key: MyTextPreferenceKey.self, value: [MyTextPreferenceData(viewIdx: self.idx, rect: geometry.frame(in: .named("myZstack")))]) } } } Use Preferences Wisely When using view preferences, you may use the geometry information from a child, in order to layout one of its ancestors. If that is the case, you should exercise caution. You risk getting stuck in a recursive loop, if the ancestor reacts to changes in the layout of a child, and the child reacts to the changes of the ancestor. You may experience different results. The application may hang, the screen may flicker trying to redraw continuously, and most likely the CPU will spike. All these may be indications that you are using preferences wrong. For example, if you have two views inside a VStack, and the one on the top (A) sets its height, based on the second view (B) y position, you bought yourself a nice little tight loop. Some ways to avoid this problems, is using layout tools that make the ancestor to not affect the child. Some good techniques are: ZStack, .overlay(), .background() or geometry effects, etc. We are going to talk about GeometryEffect in an upcoming article. What’s Next In this article we used GeometryReader to “steal” the geometry of the month labels. However, there is a better way of doing it, and that is using Anchor Preferences. In the continuation we will learn about it, and also we’ll dive into how exactly does SwiftUI traverse the tree. There is also a different way of using preferences, without resorting to .onPreferenceChange(). We’ll talk about that too. The next part is already available here. Before you go, I would like to note that when you start to use Preferences extensively, your code may begin to clutter and become difficult to read. Should you reach that point, I recommend you encapsulate preferences inside view extensions. I recently posted an article that explains how to do it. For more information on that, check View Extensions for Better Code Readability Categories Layout, SwiftUI Tags .coordinateSpace(), .onPreferenceChange, .preference(), PreferenceKey, Preferences GeometryReader to the RescueInspecting the View Tree – Part 2: AnchorPreferences'
