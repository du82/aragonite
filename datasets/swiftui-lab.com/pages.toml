title = "Drag & Drop with SwiftUI - The SwiftUI Lab"
description = "In the following article we will explore how easy it is to add Drag and Drop support to our SwiftUI views, and using different types of data."
full_description = 'Drag & Drop with SwiftUI June 5, 2020February 17, 2020 by javier SwiftUI incorporates some methods and protocols to easily perform Drag and Drop operations. Until iOS 13.4, most of these methods were macOS exclusive. Fortunately, that changed with the latest iOS13.4 beta release. Drag and Drop with SwiftUI is very simple. However, if you are completely new to drag and drop on macOS/iOS, the challenge will be to understand NSItemProvider. This is the class that carries the information of the dragged data, and it is a class that has been around for many years. If the examples in this post are not sufficient, surf away, and you will find that the Internet is full of resources. They may not be SwiftUI related, but the NSItemProvider part is the same. Along the way we will also discuss some annoying bugs that still affect Drag and Drop with SwiftUI. We will also look into List views and some special considerations. The Drag A drag and drop operation, as you can imagine, consists of two parts: the drag, and the drop. For the Drag, SwiftUI has a single method called onDrag(). By adding this modifier to a view, you are doing two important things: you are telling SwiftUI that the view is draggable, and you also set the data that will be attached to the drag operation (in the form of NSItemProvider objects). func onDrag(_ data: @escaping () -> NSItemProvider) -> some View The Drop For the drop part, SwiftUI has a modifier called onDrop(). With this method, we tell SwiftUI if a view accepts drops, what types of items can be dropped, plus some other useful information. Depending on what you need, there are three versions of the modifier you can choose: // The simplest form, let you specify a closure to execute when a view is dropped. func onDrop(of supportedTypes: [String], isTargeted: Binding<Bool>?, perform action: @escaping ([NSItemProvider]) -> Bool) -> some View // Similar to the first version, but also provides drop location information func onDrop(of supportedTypes: [String], isTargeted: Binding<Bool>?, perform action: @escaping ([NSItemProvider], CGPoint) -> Bool) -> some View // The most versatile, will let you provide a DropDelegate to handle all the operation func onDrop(of supportedTypes: [String], delegate: DropDelegate) -> some View In this article, we are going to use the most versatile option, the one with DropDelegate. The other two onDrop methods are pretty much straight forward. Very soon I will be releasing some examples in the Companion for SwiftUI app, but if you understand the example below, understanding the other two are a simple trivial exercise. The video below shows the example in action. As you can appreciate, there is a bug with macOS. When dragging a view, its “preview” image is corrupt or even completely missing. So far I have been unable to workaround that problem. Note that this problem does not affect iOS, where the dragged image is shown properly. Drag & Drop (macOS) Drag & Drop (iOS) The code below works on macOS. But with very few minor modifications, the same code will work on iOS. The required modifications are related to the fact that macOS is using NSImage, while iOS will need UIImage. Also note that there is, however, another bug. This one only affects iOS. Although DropInfo should provide the drop location in local coordinates, at the moment, it is doing it in global coordinates. Since drag and drop support on iOS has just been released (and as beta), it is to be expected… but if you want to make sure it gets sorted soon, I encourage you to file a bug report! The more, the merrier. import SwiftUI struct ContentView: View { let img1url = Bundle.main.url(forResource: "Images/grapes", withExtension: "png") let img2url = Bundle.main.url(forResource: "Images/banana", withExtension: "png") let img3url = Bundle.main.url(forResource: "Images/peach", withExtension: "png") let img4url = Bundle.main.url(forResource: "Images/kiwi", withExtension: "png") var body: some View { HStack { VStack { DragableImage(url: img1url!) DragableImage(url: img3url!) } VStack { DragableImage(url: img2url!) DragableImage(url: img4url!) } DroppableArea() }.padding(40) } struct DragableImage: View { let url: URL var body: some View { Image(nsImage: NSImage(byReferencing: url)) .resizable() .frame(width: 150, height: 150) .clipShape(Circle()) .overlay(Circle().stroke(Color.white, lineWidth: 2)) .padding(2) .overlay(Circle().strokeBorder(Color.black.opacity(0.1))) .shadow(radius: 3) .padding(4) .onDrag { return NSItemProvider(object: self.url as NSURL) } } } struct DroppableArea: View { @State private var imageUrls: [Int: URL] = [:] @State private var active = 0 var body: some View { let dropDelegate = MyDropDelegate(imageUrls: $imageUrls, active: $active) return VStack { HStack { GridCell(active: self.active == 1, url: imageUrls[1]) GridCell(active: self.active == 3, url: imageUrls[3]) } HStack { GridCell(active: self.active == 2, url: imageUrls[2]) GridCell(active: self.active == 4, url: imageUrls[4]) } } .background(Rectangle().fill(Color.gray)) .frame(width: 300, height: 300) .onDrop(of: ["public.file-url"], delegate: dropDelegate) } } struct GridCell: View { let active: Bool let url: URL? var body: some View { let img = Image(nsImage: url != nil ? NSImage(byReferencing: url!) : NSImage()) .resizable() .frame(width: 150, height: 150) return Rectangle() .fill(self.active ? Color.green : Color.clear) .frame(width: 150, height: 150) .overlay(img) } } struct MyDropDelegate: DropDelegate { @Binding var imageUrls: [Int: URL] @Binding var active: Int func validateDrop(info: DropInfo) -> Bool { return info.hasItemsConforming(to: ["public.file-url"]) } func dropEntered(info: DropInfo) { NSSound(named: "Morse")?.play() } func performDrop(info: DropInfo) -> Bool { NSSound(named: "Submarine")?.play() let gridPosition = getGridPosition(location: info.location) self.active = gridPosition if let item = info.itemProviders(for: ["public.file-url"]).first { item.loadItem(forTypeIdentifier: "public.file-url", options: nil) { (urlData, error) in DispatchQueue.main.async { if let urlData = urlData as? Data { self.imageUrls[gridPosition] = NSURL(absoluteURLWithDataRepresentation: urlData, relativeTo: nil) as URL } } } return true } else { return false } } func dropUpdated(info: DropInfo) -> DropProposal? { self.active = getGridPosition(location: info.location) return nil } func dropExited(info: DropInfo) { self.active = 0 } func getGridPosition(location: CGPoint) -> Int { if location.x > 150 && location.y > 150 { return 4 } else if location.x > 150 && location.y < 150 { return 3 } else if location.x < 150 && location.y > 150 { return 2 } else if location.x < 150 && location.y < 150 { return 1 } else { return 0 } } } } Making Sense of the Code First we mark our views as draggable, by calling onDrag. There, we simply sets the data that will be dragged with the view. In the example we are using a URL, but any type can be used. Some can be used directly with NSItemProvider. For other types, you may need to work a little harder. However, NSItemProvider is way out of the scope of this article. Fortunately, there’s plenty of resources already available… starting by Apple’s documentation On the other side, you need to define how to handle the drop. We will do it by specifying a DropDelegate. This is a protocol that we need to implement. Although the protocol has many methods, only one is required: performDrop. The rest are optional. In the example above, MyDropDelegate uses all methods in the protocol, to demonstrate how they work. Drag and Drop with List Views Important: As some readers pointed out, drag and drop on List views seems to work only on iPad, not iPhone. We will now discuss some special considerations about Drag and Drop on List views. In the following example, we use the onDrag method on a List view. As you can see in the video, you can select multiple draggable rows. You can also observe how views are draggable even outside the app. In this case we are dragging them to the Files app. Note that this behavior is not exclusive to List views. import SwiftUI struct Fruit: Identifiable { let id = UUID() let name: String let image: String } struct ContentView: View { @State var selection: Set<UUID> = [] @State private var fruitsTop = [ Fruit(name: "Apple", image: "apple"), Fruit(name: "Banana", image: "banana"), Fruit(name: "Grapes", image: "grapes"), Fruit(name: "Peach", image: "peach"), Fruit(name: "Kiwi", image: "kiwi"), ] @State private var fruitsBottom = [ Fruit(name: "Peach", image: "peach"), Fruit(name: "Kiwi", image: "kiwi"), ] var body: some View { VStack { NavigationView { List(selection: $selection) { ForEach(fruitsTop) { fruit in HStack { Image(fruit.image) .resizable() .frame(width: 30, height: 30) Text(fruit.name) } .onDrag { let provider = NSItemProvider(object: UIImage(named: fruit.image) ?? UIImage()) provider.suggestedName = fruit.name return provider } }.onInsert(of: ["public.image"]) { self.insertFruit(position: $0, itemProviders: $1, top: true) } } .navigationBarItems(trailing: EditButton()) .navigationBarTitle("Fruits (Top)") } NavigationView { List(selection: $selection) { ForEach(fruitsBottom) { fruit in HStack { Image(fruit.image) .resizable() .frame(width: 30, height: 30) Text(fruit.name) } .onDrag { let provider = NSItemProvider(object: UIImage(named: fruit.image) ?? UIImage()) provider.suggestedName = fruit.name return provider } }.onInsert(of: ["public.image"]) { self.insertFruit(position: $0, itemProviders: $1, top: false) } } .navigationBarItems(trailing: EditButton()) .navigationBarTitle("Fruits (Bottom)") } } } func insertFruit(position: Int, itemProviders: [NSItemProvider], top: Bool) { for item in itemProviders.reversed() { item.loadObject(ofClass: UIImage.self) { image, error in if let _ = image as? UIImage { DispatchQueue.main.async { let f = Fruit(name: item.suggestedName ?? "Unknown", image: item.suggestedName?.lowercased() ?? "unknown") if top { self.fruitsTop.insert(f, at: position) } else { self.fruitsBottom.insert(f, at: position) } } } } } } } As you can observe in the video demonstration, the full row is dragged. We mentioned that onDrag only became available on iOS 13.4 beta. However, before that, we already had the itemProvider method. This method only worked with List view rows, but it is present since iOS 13.0. These two lines have the same effect: .onDrag { return NSItemProvider(object: UIImage(named: fruit.image) ?? UIImage()) } .itemProvider { return NSItemProvider(object: UIImage(named: fruit.image) ?? UIImage()) } At the moment, it is unclear to me what’s the difference between these two. By experimenting, itemProvider only work with Lists, while onDrag works everywhere. These two methods are available to both macOS and iOS. However, onDrag (as already mentioned), is only available since iOS13.4 beta. Beyond that, I did not find any other differences. If you did, please drop me an email or leave a comment! Also important to note is the fact that drag and drop for Lists on iOS, only seems to work with iPad, not iOS. So technically, it works with iPadOS, not iOS. Drag and Drop Bug with Lists Unfortunately, there are some very annoying bugs. When dragging a row to an empty List, a crash occurs. Also, in some instances, drag and drop into the last position of a List may also generate a crash. Thanks to the readers that pointed that out. Summary In this article, we have seen how easy it is to implement drag and drop (aside from those ugly bugs). The main challenge is defining the NSItemProvider. For example, depending on your app needs, an image can be dragged as an Image, a URL, or raw data. Text can be dragged as simple text, rich text, etc. You may even need to drag your own custom type. Usually, most of the time implementing drag and drop, will be the time spent on that task, and not the UI part of the problem. Here we discussed the SwiftUI methods that are specifically intended to handle drag and drop. In the very unlikely reason these methods do not serve your needs, you can always build your own drag and drop system, using Gestures. Most likely though, that would be an overkill. Please feel free to comment below, and follow me on twitter if you would like to be notified when new articles come out. Until next time! Categories SwiftUI The Mystery Behind View EqualityThe Power of the Hosting+Representable Combo'
