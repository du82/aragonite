full_description = '''Tcl and SWIG as a C/C++ Development Tool. Originally written as a draft for a book chapter, this paper provides an overview of using Tcl and SWIG. It also appears on the CD-ROM accompanying "Tcl/Tk for Real Programmers" by Clif Flynt. SWIG : An Easy to Use Tool for Integrating Scripting Languages with C and C++. While a little dated, this is the first SWIG paper. Presented at the 4th Tcl/Tk Workshop, Monterey, California, July 6-10, 1996. Also available from USENIX. Using SWIG to Control, Prototype, and Debug C Programs with Python. Presented at the 4th International Python Conference, Livermore, California, June, 1996. Interfacing C/C++ and Python with SWIG (PDF). Half-day tutorial presented at the 7th International Python Conference, November, 1998. Interfacing C/C++ and Python with SWIG (PDF). Half-day tutorial presented at the 6th International Python Conference, October, 1997. Daniel Blezek wrote an article about SWIG in the November, 1998 issue of the Dr Dobb's 'Rapid Prototyping with SWIG'. John Ousterhout's paper on scripting languages provides a good overview of the use of scripting languages and their relationship to systems programming languages. SWIG was developed with many of these issues in mind so this paper might be of interest to users who are new to SWIG and its goals. Lightweight Computational Steering of Very Large Scale Molecular Dynamics Simulations . Presented at Supercomputing'96. This paper describes the application that motivated the development of SWIG. (See why SWIG was originally developed).'''
