["https://swig.org/bugs.html"]
title = "SWIG Bug Tracking"
full_description = "SWIG development is done on Github at the SWIG Github project where you can view all development activity such as code changes and issues. Bugs can be submitted as an issue on the SWIG Github issue tracker. Please only raise a new issue if you can provide all the details to recreate it, ideally with a small and complete cut down test. Users who have found a bug and fixed it themselves can submit a patch as a SWIG Github pull request. Patches are very welcome and encouraged as user contributions are the primary way that SWIG evolves and improves. The SWIG developers try to give top priority to patches. Note that submitting issues and pull requests requires a Github account, but simply browsing anything on Github does not. Modifications to this website can be submitted as a pull request to the separate SWIG www Github project. SWIG is an all volunteer effort and so bug reports may not receive an immediate response. If you have an urgent problem or if you are not sure you have found a bug, please post a message to the swig mailing list instead. Development used to be based on Sourceforge. Most of this has migrated to Github and so it is not used much now. The old bug-tracking system can still be browsed. Please do not submit new bugs to it."
