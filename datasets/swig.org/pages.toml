title = "Donations"
full_description = '''The SWIG developers are volunteers who develop and improve SWIG in their spare time. Furthermore, SWIG is not supported by investors, a large corporation or research grants. We have a donation system in place to encourage developer participation and to help cover expenses. If you have benefited from SWIG, please consider donating to encourage the healthy existence of the project. If you donate $500 or more, we would like to mention you on the list of donors below. SWIG's membership of Software Freedom Conservancy enables us to accept donations via any of the following methods, however, the first two are the most cost-efficient for us. We can accept check donations drawn in USD from banks in the USA. (Donations from banks outside of the US or not in USD should be handled by wire). Please make the check payable to "Software Freedom Conservancy, Inc." and place "Directed donation: SWIG" in the memo field. Checks should then be mailed to: Donations by wire vary depending on country of origin. Please contact accounting@sfconservancy.org for details. Conservancy also accepts stock donations on behalf of SWIG. If you would like to donate stock, please contact accounting@sfconservancy.org for instructions on how to initiate the transfer.'''
