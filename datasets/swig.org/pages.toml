["http://www.swig.org/projects.html"]
title = "The SWIG Files"
full_description = '''SWIG is being used in an increasing number of applications. Applications cover the broad spectrum of open source projects, inhouse projects within corporations or organisations as well as commercial software projects. Below are some comments received on usage of SWIG by various organisations. (Note : the opinions expressed here do not necessarily reflect those of any given employer or organization). I am using SWIG to integrate four stand alone software packages into a unified system controlled by Tcl/Tk scripts. The unified software system is used to design and test defibrillation electrodes via computer simulations of a human subject. The individual software pieces include: a visualization package written in C++ using OpenInventor and Motif, an unstructured mesh generator written in C, a Finite Element Solver written in C, and a segmentation software written in C++ using OpenGL and Motif. SWIG has been crucial to the development of this project. With SWIG, the integration of the individual pieces was trivial. We are using swig with python to retrieve, analyze, and visualize very large data sets from ocean model simulations on parallel computers. We have written C routines that access our data. Graphics libraries and Matlab are used to visualize the data. We are very happy with the flexible, programmable, powerful tool that results. Paradigm sells modular C toolkits for developing visual simulation/virtual reality graphics applications called Vega and another for spatial audio simulation called AudioWorks. I've used SWIG to wrap Vega's and AW's APIs with Silicon Graphics' "sgitcl" to create "vgTcl" and "awTcl". Exploiting the power of interactive scripting languages, they provide the full power of the APIs at runtime, without an application developer having to anticipate flexibility a priori. SWIG has enabled our customers to interact with our toolkits in fundamentally new ways. Several years ago (I believe we discussed this stuff way back in 1994 ;-), I created a set of C preprocessor macros that did SWIG-like things. It was a very tedious process, making it difficult to follow changes to an evolving API, but it was useful for proof-of-concept. When SWIG 1.1B1 came out in October, I was generously given a R&D budget to reimplement my project in SWIG. The project has been a resounding success!'''
