["https://swig.org/Doc1.1/HTML/Python.html"]
title = "SWIG and Python"
full_description = '''This will produce 2 files. The file example_wrap.c contains all of the C code needed to build a Python module and a documentation file describes the resulting interface. To build a Python module, you will need to compile the file example_wrap.c and link it with the rest of your program (and possibly Python itself). When working with shadow classes, SWIG will also produce a .py file, but this is described later. When building a dynamic module, the name of the output file is important. If the name of your SWIG module is "example", the name of the corresponding object file should be "examplemodule.so" (or equivalent depending on your machine). The name of the module is specified using the %module directive or -module command line option. While dynamic loading is the preferred method for making SWIG modules, it is not foolproof and not supported on all machines. In these cases, you can rebuild the Python interpreter with your extensions added. SWIG provides an extremely easy, although somewhat unconventional, mechanism for rebuilding Python using SWIG's library feature. When you want to build a static version of Python, simply make an interface file like this : Python's main() program is rather unfriendly towards C++ code, but SWIG's embed.i module provides a replacement that can be compiled with the C++ compiler--making it easy to build C++ Python extensions. The embed.i library should only be used with Python 1.4. If you are using Python 1.3, you should use the file embed13.i instead (this can be done by making a symbolic link in the SWIG library) or simply using the -l option. Now, assuming all went well, SWIG will be automatically invoked when you build your project. Any changes made to the interface file will result in SWIG being automatically invoked to produce a new version of the wrapper file. To run your new Python extension, simply run Python and use the import command as normal. For example : To build the extension, run NMAKE (you may need to run vcvars32 first). This is a pretty simplistic Makefile, but hopefully its enough to get you started.'''
