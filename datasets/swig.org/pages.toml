["http://www.swig.org/mail.html"]
title = "SWIG Mailing Lists"
full_description = "SWIG is an all volunteer project with typical open source community support. There are a number of mailing lists available. These have traditionally been used for any queries related to the use or development of SWIG. The popularity of mailing lists has declined in recent years and many users have started to use Github discussions and Stack Overflow. For general help and support, we suggest you consider one of the following: The mailing lists are subscriber only lists, so you must subscribe to the relevant list in order to post to that list. The mailing lists are set with a very high level of spam rejection, meaning occasionally some SWIG user's email postings will be discarded. Emails classified as spam are quietly discarded, so please check the archives if you are unsure as to whether or not your email was successfully posted. Note that plain text emails are preferred as html, rtf etc formatted emails have been known to be quietly discarded. Note that these mailing lists began use in November 2005 and replaced the older original mailing lists. Details of searching or browsing both the current and original lists are given below. Replies to emails can be either bottom or top posted. The SWIG community by and large uses bottom postings or inline replies. This doesn't mean top postings are ruled out, however, an email chain with both top and bottom postings is rather difficult to follow and should be avoided. Please don't mix top and bottom posts in one thread, stick with whichever approach the first reply used. For those who are new to mailing lists, there are many articles on the subject, for example, Bottom vs. top posting and quotation style on Usenet. The original mailing lists in use prior to November 2005 were hosted at the University of Chicago, but are no longer accessible using the original links. However, these original mailing lists are partially archived by Gmane and include emails from around the year 2000 and later. Gmane combines the original equivalent and current mailing lists as described below. They can be read using an NNTP newsreader configured to use server news.gmane.io and the groups listed in the following table."
year_published = 2025
