["https://sycamore-rs.netlify.app"]
title = ""
description = "Sycamore is a next generation Rust UI library powered by fine-grained reactivity. Create reactive apps with effortless performance"
full_description = '''Reactive Apps withEffortless Performance.Sycamore is a next generation Rust UI library powered by fine-grained reactivity.Read the BookJoin the DiscordLatest Release: v0.9.1use sycamore::prelude::*; #[component] fn Counter(initial: i32) -> View { let mut value = create_signal(initial); view! { button(on:click=move |_| value += 1) { "Count: " (value) } } }FeaturesEffortless PerformanceSycamore is built on top of Rust and WebAssembly, giving you full control over performance.Fine-Grained ReactivitySycamore's reactivity system is fine-grained, meaning that only the parts of your app that need to be updated will be.Type-checked UIWhether you use our custom DSL or the builder API, Sycamore type-checks your code to catch errors at compile-time.Server Side Rendering (SSR)Sycamore supports Server Side Rendering out of the box. If you don't need it, however, SPA mode works just as well.Async and SuspenseEasily load and display asynchronous data using the resources and suspense API with first-class async/await support.Built-in RoutingSycamore comes with a built-in router that supports both client-side navigation and server side rendering.Community3.0k Starson GitHub70 Contributorson GitHub172k Downloadson crates.ioSycamore is made possible by all our community contributors. Thank you!Interested in contributing as well? Check out our contribution guide.NewsNovember 1, 2024Announcing Sycamore v0.9.0Reactivity v3, View v2, resources API and suspense, SSR streaming, attributes passthrough, new website, and more!August 28, 2022Announcing Sycamore v0.8.0Reactivity v2, better component props and children, async/await support, and more...February 1, 2022A first look at Sycamore's new reactive primitivesHow the next version of Sycamore will be the most ergonomic yet.December 8, 2021Announcing Sycamore v0.7.0Client-side hydration + Builder APISeptember 12, 2021Announcing Sycamore v0.6.0Faster and faster with plenty of fixes and features...July 6, 2021Announcing Sycamore v0.5.0SSR + Routing'''
