["https://sydbarrett.net/syd-barrett-articles/freaking-out-with-the-pink-floyd"]
title = "Freaking out with the Pink Floyd - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Freaking out with the Pink Floyd Terrapin #12, Oct 1974 Being asked to interview the Pink Floyd – Is an ordeal I would have wished only to my worst enemies. I was shaking like a leaf an hour before our first midday appointment. The thought of having to talk to a psychedelic group brought me …"
full_description = "Being asked to interview the Pink Floyd – Is an ordeal I would have wished only to my worst enemies. I was shaking like a leaf an hour before our first midday appointment. The thought of having to talk to a psychedelic group brought me out in sugar-cube shaped goose pimples. What language do these musical Martians speak? Would they hallucinatory gaze turn me into an orange? What would be the horrible consequences of freaking out with a bunch of transvestites in Cambridge Circus? Pre-conceptions flooded my already busting mind. This was going to be sixteen hours of terrifying, heart-halting experiences. Nervously I tiptoed to the door of lead guitarist Syd Barrett’s house just off busy Cambridge Circus in the middle of London’s vice-ridden West End. The font door was painted an ominous purple. Why wasn’t I being paid danger money? Was this one trip on which all expenses weren’t going to be paid? Oh, to be golf correspondent on International Times and forget these blasted astronomic, hippie rebels. Syd Barrett tumbled out of his bed and donned his socks. I peeked around the small attic room looking fr women’s clothing that the Pink Floyd say Arnold Layne tries on in front of the mirror. Instead his girlfriend materialised at the door and brought in a cup of coffee. Well so far there was little evidence of the terrible Arnold Layne being in the vicinity — the Pink Floyd were covering up well. I’ll shoot Barrett a [question?] “Syd, why did you write such a dirty, filthy smutty immoral and degrading son as “Arnold Layne”?” Syd blinked blankly: “Well I just wrote it. I thought “Arnld Layne” was a nice name, and it fitted very well into the music I had already composed”. “But isn’t it true,” said I, “that Radio London, quite rightly, banned the record because they thought it was “smutty”?” Instead of reeling into the wardrobe and revealing a cupboard full of feminine clobber, Syd began to explain : “I was at Cambridge at the time. I started to write the song. I pinched the line about “moonshine washing line” from Rog, our bass guitarist – because he has an enormous washing line in the back of his house. Then I thought, “Arnold must have a hobby”, and it went on from there. “Arnold Layne” just happens to dig dressing up in women’s clothing. A lot of people do – so let’s face up to reality. About the only other lyric anybody could object to, is the bit about, “It takes two to know” and there’s nothing “smutty” about that!”"
