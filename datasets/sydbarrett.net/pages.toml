["https://sydbarrett.net/syd-barrett-articles/an-article-by-mark-paytress-on-syd"]
title = "An article by Mark Paytress on Syd - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "An article by Mark Paytress on Syd Record Collector Magazine, Mark Paytress Pink Floyd and Syd Barrett: Mark Paytress examines the Floyd’s early career, and the subsequent solo work of their erratic songwriter, vocalist and guitarist In common with Brian Wilson, Captain Beefheart and Phil Spector, Syd Barrett is a musician whose work is often …"
full_description = "Pink Floyd and Syd Barrett: Mark Paytress examines the Floyd’s early career, and the subsequent solo work of their erratic songwriter, vocalist and guitarist In common with Brian Wilson, Captain Beefheart and Phil Spector, Syd Barrett is a musician whose work is often overshadowed by the myths that surround his personal life. Though this has elevated Barrett’s status as one of rock’s most enigmatic figures, it means that the erratic genius of his music often takes second place to a seemingly never-ending string of tales documenting his eccentric behaviour. But though interest in Barrett has always been keen, 1988 has been earmarked by fans as the year which will at last deliver some of his long-lost recordings. This promise has already been partially fulfilled with the released of Syd’s 1970 ‘Top Gear’ radio session of Strange Fruit Records; the much promised EMI album of unissued studio material is still in the pipeline. While we documented the full Pink Floyd story a couple of years back (issue 83), no appreciation of Syd Barrett would be complete without an assessment of his pioneering recordings with the Floyd. However, to avoid too much duplication, the emphasis this time will focus away from the official U.K. releases and instead highlight the unofficial recordings and foreign editions. Since he left Pink Floyd in spring 1968, Syd has spent much of his time in seclusion. A flurry of activity during 1969 and 1970 resulted in the release of two solo albums and a handful of live appearances, but since then, he has faded from the music scene completely. Jimmy Page, Brian Eno and his old friend from the UFO days Kevin Ayers have all tried unsuccessfully to coax him back, and despite occasional rumours – in 1984, a story went out that he had played live with Carla Bley in Germany – it is highly unlikely that Syd Barrett will make a return to either stage or recording studio. While at Cambridge School for Boys, the adolescent Roger ‘Syd’ Barrett kicked off his musical career on a second-hand banjo, though he quickly switched to acoustic guitar. Around 1962, he teamed up with local combo Geoff Mott and the Mottos, who specialised in Shadows’ instrumentals interspersed with the occasional U.S. cover. After the group split, Syd discovered Bo Diddley, embraced the blues and switched to bass for a while. It is a common belief among Floyd fans that Dave Gilmour taught Syd some guitar licks during this period. The pair certainly hitched together to the South of France one summer."
year_published = 2025
clearnet = "https://sydbarrett.net/syd-barrett-articles/an-article-by-mark-paytress-on-syd"
