["http://sydbarrett.net/2001/03"]
title = "March 2001 - The Syd Barrett ArchivesThe Syd Barrett Archives"
full_description = "I see we have a new picture on the cover here too. Good luck to everyone on getting their copy on April 16th (UK). If anyone needs help finding a copy let me know. SYD BARRETT ‘Wouldn’t You Miss Me? The Best Of…’ Release Date: April 16th 2001 Catalogue No.: 532 3202 Titled ‘Wouldn’t You Miss Me? The Best Of’, this 22 track CD contains a selection of Syd’s ‘best’ work culled from his two studio albums, ‘Madcap Laughs’ and ‘Barrett’ and the rarities album, ‘Opel’, together with the previously unreleased and much sought after, ‘Bob Dylan Blues’ (an outtake from 1969, which has made its appearance due to Syd’s longtime friend and fellow Pink Floyd member, Dave Gilmour giving EMI permission to use the track). Also included is a BBC session track, ‘Two Of A Kind’. Syd Barrett’s music has influenced many artists – this compilation not only serves as an excellent reminder of a genius at work, but makes the perfect sampler for a whole new generation wishing to hear who it was that influenced some of their favourite bands, and of course a chance for fans to hear the unreleased track for the first time – a pure gem! There are magnificent cult heroes shrouded in the stuff of infamy and legend … and then there is Syd Barrett. Syd the unforgotten hero of the early Pink Floyd, who virtually set the parameters for British psychedelia with his fanciful songs and space-age improvisation. The summer of love’s prize bloom who soon wilted under the gaze of the pop world’s plastic eye. The sacrificial lamb of the love generation’s wilder excesses who simply forgot to sing or play his guitar. The self-styled’ Vegetable Man’ who re-emerged with two solo albums that bore the scars of hippie innocence and the acid experience with a shocking self consciousness (sic). It’s the best of these two remarkable records – and out-takes recorded during the sessions – that are now available on “Wouldn’t You Miss Me”, the first ever Syd Barrett compilation."
year_published = 1994
