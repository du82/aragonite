["https://sydbarrett.net"]
title = "The Syd Barrett Archives - The home of all things Syd BarrettThe Syd Barrett Archives"
description = "The original home of all things Syd Barrett, and the early Pink Floyd. The site features syd barrett pictures, videos, history, and complete discography."
full_description = "Since May of 1997 The Syd Barrett Archives has strived to be the most complete source of materials for Syd Barrett on the web. Here you will find Syd Barrett Articles, pictures, books, news, interviews, lyrics, tabs, an extensive Syd Barrett discography, and much more information on Syd Barrett and early Pink Floyd. So, please come have a look around, and enjoy the original home on the web of everything Syd Barrett related. Welcome to the 25th Anniversary of the Syd Barrett Archives, we continue to update and add to the site. I just wanted to thank the many Syd fans who have come here for the past 25 years to share in the joy of Syd Barrett and the early Pink Floyd. Keep you eyes peeled on the site this year as I work to add more for you all. Everyone take care of themselves. More to come…. Come join us on our Facebook group, link in the sidebar, we are now over 2000 strong of Syd Barrett fans. Running this website since 1997 has been an act of love for Mr. Barrett’s work and genius, I find his story a tragedy, but one that must be shared. In his creative time he has produced work that I do not believe will be forgotten, and helped form one of the greatest bands of all time in Pink Floyd. Hopefully someday even his art will be well known (this seems to be happening since I wrote this). I have always funded this website out of my own pocket, there are no advertisements, or Google ads etc. I am placing a Paypal donations link on the site, just to help paying for the server usage as the site is now averaging over 14,000 hits a month, and I do not want us to lose any of the long collected content that I like to provide. I hope that none of you find that distasteful, but it is a lot of work, and after 18 years of funding this great site, a little support (even $1 would do) to help keep it ad free, fast, and packed with information is all I’m looking to accomplish. I would like to thank you in advance if you choose to donate, and if not, everyone is welcome to enjoy the site as always."
