["https://sydbarrett.net/syd-barrett-articles/interview-with-malcolm-jones"]
title = "Interview with Malcolm Jones - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Interview with Malcolm Jones Opel #8, late 1984, Ivor Trueman Fans of Syd Barrett owe Malcolm Jones more than he’ll ever probably get, not only was he responsible for producing the better solo sessions he’s also took the time and trouble to document “The Making of the Madcap Laughs” in a booklet of the same …"
full_description = "Fans of Syd Barrett owe Malcolm Jones more than he’ll ever probably get, not only was he responsible for producing the better solo sessions he’s also took the time and trouble to document “The Making of the Madcap Laughs” in a booklet of the same name. Last month I went to his home to interview him, listen to some of the outtakes and try and persuade him to let me reprint his The Making of the Madcap Laughs’ booklet. I should however explain that I didn’t particularly ask about the 1969 session details etc. purely because they are already covered extensively in “The Making…” For those people without this book I hope you forgive that and if you do ever get a copy you’ll understand why I didn’t ask about those kinds things… Firstly, before I switched my recorder on, Malcolm played me snatches of Ramadan, Lanky pt’s 1 & 2, Opel and Love You (slowversion) etc. Ramadan / Lanky seemed better than I’d expected. They are very loose ‘acidy jams’ sort of like a lot of stuff in1968. They seemed very freeform and reminded me of The Soft Machine, Syd’s contribution was not particularly self-evident but the tracks are still good. I’d heard Opel before but Love You (slow version) was very nice and I hope it like the other outtakes sees the light of day soon. What else can you say, it is slightly different… Then Malcolm explained that he only plays snatches of songs to people because of some Bowie stuff he played to a guy who then put it out on bootleg. He then produced a tape with “Pink Floyd – Backing Track” written on it. [no it didn’t sound at all like Syd] He was given this in 1968 by Roy Featherstone (his boss) who didn’t like the direction the Floyd were heading along; he wanted a second opinion. I switched on my cassette and the interview was underway. Malcolm Jones: There’s definitely a melody there, it’s obviously a backingtrack for something they’d thought out in some form. Ivor Trueman: No… Untitled? In the Beechwoods? John Latham? (looking through the recording titles in Malcolm’s booklet)"
year_published = 2025
clearnet = "https://sydbarrett.net/syd-barrett-articles/interview-with-malcolm-jones"
