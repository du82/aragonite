["https://sydbarrett.net/syd-barrett-articles/syd-barrett-a-founder-of-pink-floyd-dies-at-60"]
title = "Syd Barrett, a Founder of Pink Floyd, Dies at 60 - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Syd Barrett, a Founder of Pink Floyd, Dies at 60 By JON PARELES – Published: July 12, 2006 – NY Times Syd Barrett, the erratically brilliant songwriter and singer who created the psychedelic rock of Pink Floyd only to leave the band in 1968 with mental problems, died on July 7 at his home in …"
full_description = "Syd Barrett, the erratically brilliant songwriter and singer who created the psychedelic rock of Pink Floyd only to leave the band in 1968 with mental problems, died on July 7 at his home in Cambridgeshire, England. He was 60. A statement from Mr. Wright said: “The band are very naturally upset and sad to hear of Syd Barrett’s death. Syd was the guiding light of the early band lineup and leaves a legacy which continues to inspire.” With Pink Floyd, and on two haunting solo albums, Mr. Barrett became a touchstone for experimental pop musicians. He was also renowned both as an LSD casualty and as a symbol of how close creativity can be to madness. Mr. Barrett wrote most of the songs on Pink Floyd’s debut album, “The Piper at the Gates of Dawn.” In Mr. Barrett’s songs like “Astronomy Domine,” whimsy and wordplay merged with a playful sense of structure and sound. “Let’s try it another way/You’ll lose your mind and play,” he wrote in “See Emily Play.” He also helped to conceive the band’s performances as spectacles. “We have only just started to scrape the surface of effects and ideas of lights and music combined,” Mr. Barrett told the trade newspaper Melody Maker in 1967. But under the pressures of rock stardom and after frequent use of LSD, Mr. Barrett had a breakdown in the late 1960’s and spent most of his life as a recluse. Pink Floyd, with its bassist, Roger Waters, taking over as songwriter, went on to become a multimillion-selling arena-rock band in the 1970’s. Pink Floyd sang about Mr. Barrett in one of its hits, “Shine On You Crazy Diamond.” Roger Keith Barrett, nicknamed Syd as a teenager, was born in Cambridge, England, on Jan. 6, 1946. He played the piano as a child and then took up the guitar, joining his first band at 16. Pink Floyd began with boyhood friendships. Mr. Barrett attended the same elementary school as Mr. Waters. David Gilmour, who eventually replaced him as Pink Floyd’s guitarist, was another teenage friend."
year_published = 2006
