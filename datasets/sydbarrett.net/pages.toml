["https://sydbarrett.net/2001/02"]
title = "February 2001 - The Syd Barrett ArchivesThe Syd Barrett Archives"
full_description = "“Bob Dylan Blues” might be an uncharacteristically prosaic title from a man better known for his songs about gnomes, octopuses and effervescing elephants. But as this newly unearthed Syd Barrett song — to be included on a new compilation, Wouldn’t You Miss Me (EMI), which is due for release in the U.K. on April 16th — suggests, Pink Floyd’s original “Crazy Diamond” was far from immune to the occasional mortal influence. Barrett, the errant star of British psychedelia, masterminded Pink Floyd’s early success before a combination of a nervous breakdown and a tendency to overindulge in the era’s more potent stimulants prompted his departure from the group early in 1968. Tales of mammoth drug binges, erratic stage performances and baffling behavioral traits inevitably earned Barrett the “acid casualty” epithet. After two solo albums, The Madcap Laughs and Barrett, both clearly the work of a wildly distracted man, he simply disappeared from view, taking up residence in the cellar of his family home in Cambridge. Turning his back on rock & roll, he returned to painting. Occasional Syd sightings, each one depicting the acid rock pin-up as increasingly bald and overweight, prompted inevitable rumors of renewed activity, but aside from a disastrous studio session in 1974, he’s maintained a strange, intensely private silence. Since the death of his mother in the early Nineties, Syd Barrett lives alone in Cambridge, suffers from diabetes and is tended to by his sister. The Barrett legend has also been maintained by Pink Floyd themselves, most noticeably by Roger Waters, whose “Shine On You Crazy Diamond” and The Wall were both inspired by his ex-colleague’s mental health problems. Now, it is guitarist Dave Gilmour, Barrett’s replacement in Pink Floyd and producer of his two solo LPs, who provides the fillip. “Bob Dylan’s Blues,” a remarkable pastiche unlike anything else in the Barrett canon, has been culled from Gilmour’s private collection and is being released with the blessing of Barrett’s family."
year_published = 1994
