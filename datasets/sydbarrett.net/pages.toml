["https://sydbarrett.net/syd-barrett-articles/story-about-syd-from-the-opel-album"]
title = 'Story about Syd from the "Opel" album - The Syd Barrett ArchivesThe Syd Barrett Archives'
description = "Story about Syd from the “Opel” album   Roger Keith ‘Syd’ Barrett left Pink Floyd early in 1968. Now, some twenty years later, his brief time with the group froms only a fraction of their history, but its legacy remains incalculable. Barrett wrote, sang and played guitar on almost everything recorded during those first outings …"
full_description = "Roger Keith ‘Syd’ Barrett left Pink Floyd early in 1968. Now, some twenty years later, his brief time with the group froms only a fraction of their history, but its legacy remains incalculable. Barrett wrote, sang and played guitar on almost everything recorded during those first outings – ‘Arnold Layne’, ‘See Emily Play’ and ‘The Piper at the Gates of Dawn’ l.p., but the commercial failure of his dazzling ‘Apples and Oranges’, coupled with an increasing unpredictability, undermined his eminant position. Several compromises would quickly flounder – the addition of a fifth member, Dave Gilmour; a suggestion that Syd should not perform, but merely write for and record with the group, and the inevitable parting followed. Several months later Barrett returned to Abbey Road with his co-manager Peter Jenner, who acted as producer on a handful of new tracks. Somewhat exploratory, they included some which would be re-recorded later (‘Late night’, ‘Golden Hair’) and others which were then abandoned. Both ‘Swan Lee’ and ‘Lanky Pt 1’ date from this first session, the former is a wonderful ‘Hiawatha-esque’ tale which could well have accompanied the Floyd of ‘Corporal Clegg’, while ‘Lanky’ suggests the fragile instrumental improvisation of the previous year. Sadly, the recording charts give no clues to the other musicians involved, sadder still was the fact that the tempting ‘Lanky Pt 2’ consisted of percussive backing tracks. Little was then heard of Barrett for almost a year, but in March 1969, he contacted EMI again. His request for studio time was passed on to Malcolm Jones, then setting up the Harvest subsidiary. Almost by accident, Jones bacame the producer of the next batch of recordings which formed the basis for Barrett’s solo debut, ‘The Madcap Laughs’. Six of the final album’s tracks were recorded between April and May, the rest came from three sessions cut in June and July, but with Fave Gilmour and Roger Waters replacing jones. Both provided their share of out-takes, and it’s from these that ‘Clowns and Jugglers’, ‘Opel’ and the various ‘Golden Hair’s’ date. The version of ‘Opel’ included here is one of nine which were attempted, but this determination would not result in an official release; until now. The song is a gem, one of Barrett’s finest, and it’s elongated, closing refrain is positively haunting. ‘Clowns and Jugglers’ meanwhile would resurface on ‘The Madcap Laughs’ under a new title, ‘Octopus’, but this earlier take features Syd’s first vocal and guitar which was later overdubbed by the Soft Machine – mike Ratledge, Hugh Hopper and Robert Wyatt, something they also did on two tracks which did appear on ‘Madcap’, ‘No Good Trying’ and ‘Love You’. Barrett’s irregular timing made the task somewhat difficult, but there’s no denying the exciting edge the combination gave."
