["https://sydbarrett.net/syd-barrett-articles/disappearances-can-be-deceptive"]
title = "Disappearances can be deceptive - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Disappearances can be deceptive Tom Cox – Sunday April 22, 2001 – The Observer Pink Floyd’s founding genius Syd Barrett has kept a 30-year silence – and now he is the most wanted man in music Tom Cox Sunday April 22, 2001 The Observer There are probably better places in the world to go to …"
full_description = "Pink Floyd’s founding genius Syd Barrett has kept a 30-year silence – and now he is the most wanted man in music There are probably better places in the world to go to become invisible than Cambridge, but perhaps not if you are an ex-rock star with arty inclinations, dubious mental stability and a fragile, relationship with the past. If you happen to be bald and overweight into the bargain, it’s virtually made for you. With a population of only 109,000, it combines Olde English charm with sophistication, and has students that actually look like students. But, amid the academia, greenery and gentility, what you really can’t help but notice are the big bald blokes – hundreds of them, all heading into late middle age, all in the region of 15 stone, all wandering the streets mumbling to themselves. I’m here on the spiritual trail of one of rock’s most enigmatic figures, Syd Barrett, the former leader of Pink Floyd, who went into hiding in the early Seventies after several drug-related breakdowns and never came out. But like most Barrett fans, I’ve made the mistake of picturing Barrett still as he was in the late Sixties – slim, tousled, kaftanned, tassled. The reality couldn’t be more different: paparazzi shots snatched outside his house in 1980 depict a rotund, receding figure staring vacantly at something at least 3,000 miles behind the camera lens. And that was 21 years ago – which leaves me searching for some nebulous amalgam of Benny from Crossroads , Marlon Brando and the Michael Jackson impersonator from The Simpsons . And here he is! ‘Excuse me!’ I ask the spherical figure who’s just ambled past me, head down, chuntering. ‘I’m writing a piece about Syd Barrett.’ For a brief, glittering moment, Barrett (real name: Roger) was one of psychedelia’s most productive, kaleidoscopic minds. But at some point between 1967 and 1969 something (some say acid, some say Mandrax, some say sherbet lemons) went very badly wrong. He left Pink Floyd, the band he founded, in April 1969 after his fellow musicians ran out of patience with his propensity for massaging Brylcreem into his hair, and his decreasing ability to communicate or perform. He released two solo albums, The Madcap Laughs and Barrett, both in 1970, then retreated to the cellar of his mother’s house in Cambridge."
year_published = 2025
