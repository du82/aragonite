["http://sydbarrett.net/2016/10"]
title = "October 2016 - The Syd Barrett ArchivesThe Syd Barrett Archives"
full_description = "An artwork commemorating Pink Floyd legend Syd Barrett is being unveiled in his home city of Cambridge following years of campaigning by fans for a permanent memorial. Why has it taken so long for the city to fully honour its “Crazy Diamond”? Rosemary Breen prefers to think of her late brother as Roger, a man who lived a quiet life in Cambridge and who was at his happiest when painting. But Roger, who died in 2006, had spent much of the early part of his life as someone else entirely: Syd Barrett. Adored by fans across the globe, he was the principal songwriter and driving creative force in the early days of Pink Floyd, the band he was a founding member of and in which he sang and played guitar. But just when the band’s career was taking off, Barrett’s drug use and mental health issues resulted in increasingly erratic behaviour. It led to his departure from the band and his eventual return to Cambridge as a semi-recluse. Following his death from cancer in 2006, there were calls for the city where he had spent his formative years and later life to commemorate him in some way. Now, in a year that is both the 70th anniversary of his birth and the 10th anniversary of his death, the calls have been answered. Working alongside Barrett’s family, arts and events charity Cambridge Live is unveiling a specially-designed artwork in memory of the former Cambridgeshire High School for Boys pupil. It will be installed in the foyer of the Cambridge Corn Exchange, the venue where Barrett played his last ever live gig, remembered for being a disastrous performance by a very different man than the bright, dynamic young performer he had once been. The commemorative events at the venue will also include a sold-out concert by Swedish band Men on the Border, who play cover versions of Barrett’s solo work, accompanied by a 50-piece orchestra. The plans have been a year in the making and have been spearheaded by Cambridge Live’s operations director Neil Jones, himself a big fan of Pink Floyd and its former star, Syd. “When I first moved here, I couldn’t believe there was no memorial or legacy for the city’s biggest musical export,” he said. “Now it feels like the planets are aligned with the significance of the year, and it’s all just come together.”"
