["http://sydbarrett.net/2003/02"]
title = "February 2003 - The Syd Barrett ArchivesThe Syd Barrett Archives"
full_description = "One of the most famous creators and characters of the psychedelic era, Syd Barrett has not conducted an interview or released music since the early seventies yet his self-imposed anonymity still fascinates fans old and new. The original songwriter for Pink Floyd was only with the band for a vibrant 3 years when he left in 1968, yet when the band released their greatest hits album in 2001 Syd had written over a fifth of the tracks. This year it is 35 years since Syd Barrett left the band yet mystery still surrounds this prodigy of rock. The Pink Floyd and Syd Barrett Story retells the fascinating story of the start of one of the largest and most influential bands in rock and the drug induced breakdown of their original song writer and lead man. Direct Video Distribution UK is delighted to announce the 24th March 2003 VHS and DVD release of this personal and candid profile of the once effervescent musician and now cult figure of Syd Barrett. Roger Waters, Dave Gilmour, Nick Mason and Rick Wright retell how Syd’s slip from reality haunted the band for many years and this is clearly demonstrated in the tracks Shine On You Crazy Diamond and Wish You Were Here. There are also insights from former girlfriends, landlords, flatmates, producers, managers, friends and famous fans. Also featuring rare early footage of the band performing; including a live show at the UFO Club, and an appearance with former landlord Mick Leonard on Tomorrows World. Available on DVD in Dolby Digital 5.1 and DTS Surround Sound. Extras include previously unseen footage of Roger Waters talking about Syd, Dave Gilmour talking about Wish You Were Here, Robyn Hitchcock performing Dominoes and It Is Obvious, Graham Coxon performing Love You, And a Biography of Syd Barrett. Born Roger Keith Barrett in 1946 in Cambridge, Syd Barrett obtained his nickname from regulars at a local jazz club who when finding out his surname, christened him after as old drummer from the area. Aged 17 he moved down to London to attend the Camberwell Art School. In London he met up with old friend Roger Waters, who he had an understanding with since they were young that they would start a band together. Syd consequently joined up with the people Roger was playing with."
year_published = 1994
