["https://sydbarrett.net/syd-barrett-articles/syd-barrett-interview-circa-1971"]
title = "Syd Barrett interview (circa 1971) - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Syd Barrett interview (circa 1971) Terrapin #17, 1975 Britain’s art colleges have turned out a disproportionate number of successful musicians – John Lennon, Jimmy Page and Pete Townshend among them. It was while studying fine art at Camberwell School of Art in south London that he started playing with the Pink Floyd, the rest of …"
full_description = "Britain’s art colleges have turned out a disproportionate number of successful musicians – John Lennon, Jimmy Page and Pete Townshend among them. It was while studying fine art at Camberwell School of Art in south London that he started playing with the Pink Floyd, the rest of whom were all at that time potential architects at the Regent Street Polytechnic. And the influence of avant-garde art world was apparent in the Floyd’s stage act, the first to make stroboscopes and oil-slide projections standard equipment for an evening’s music. (Remember 1967 and the psychedelic revolution?) But now Syd has his own solo best selling album ‘The Madcap Laughs’ which had provided a clear answer to that much asked question ‘Whatever happened to Syd Barrett after he left the Floyd?’ At present Syd is living quietly in his sparsely furnished London flat among his stereo equipment, piles of paintings and a heap of battered LPs. He’s taking things easily, as he has been doing for the last two years, composing, writing and painting as inspiration comes, and making some plans for the future. He will soon be working on another album and he also plans to get a group together, but beyond that he seems to have no particular intentions. Syd was pleasantly surprised that the LP had sold well, especially as there was no great hype involved. ‘Yes, it’s quite nice,’ he said in his soft spoken manner that sometimes becomes so soft that he’s not talking to anything but his chin. ‘But I’d be very surprised if it did anything if I were to drop dead. I don’t think it would stand to be accepted as my last statement. I want to record my next LP before I go on to anything else, and I’m writing for that at the moment.’ It was while Syd was at school in Cambridge that he started learning the guitar. He played in a number of groups in that area from the age of 16 onwards, doing Bo Diddley and Jimmy Reed numbers especially. ‘Then had to come up to London,’ he said, ‘I didn’t mean to play for ever; it was painting that brought me here to art school. I always enjoyed that much more than school, although it had nothing to do with the music. After three? years in London I started playing with the Pink Floyd. Bo Diddley was definitely my greatest influence. Around that time one came across so many unheard of records that one felt one was really discovering something.’"
