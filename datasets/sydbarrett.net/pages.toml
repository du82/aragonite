["https://sydbarrett.net/syd-barrett-articles/hits-the-floyd-couldnt-care-less"]
title = "Hits? The Floyd couldn't care less - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Hits? The Floyd couldn’t care less Melody Maker, December 9, 1967, Alan Walsh Giving pop journalists a hard time is the blood sports of groups. It’s one of the occupational hazards of the job, as anyone who’s ever been on the receiving end of the Beatles rapier remarks will tell you. Last week, it was …"
full_description = "Giving pop journalists a hard time is the blood sports of groups. It’s one of the occupational hazards of the job, as anyone who’s ever been on the receiving end of the Beatles rapier remarks will tell you. Last week, it was the Pink Floyd’s turn, which was surprising, for their latest record “Apples And Oranges” isn’t exactly setting the charts alight. Still, I managed to penetrate their initial unreceptive attitude and asked how they felt about the record bombing after “Arnold Layne” and “See Emily Play” had been so well received. “Couldn’t care less,” was Syd Barrett’s answer. For the Floyd don’t really regard themselves as primarily a record group. Barrett is an advocate of musical anarchy. He believes that all the group can do is make a record which pleases them. If it’s not commercial – too bad. “All we can do is make records which we like. If the kids don’t, then they won’t buy it.” Ideally, believes Barrett, groups should record their own music, press their own records, distribute them and sell them. He feels that the application of commercial considerations is harmful to the music. He’d like to cut out the record company and wholesalers and retailers. “All middle men are bad,” he said. Co-manager Peter Jenner said that, anyway, the groups have far more idea of what the kids want than the record companies. Barrett said that the reason the kids dig the Beatles and Mick Jagger is not so much because of their music, but because they always do what they want to do and to hell with everyone else. “That’s why the kids dig them – because they do what they want. The kids know this.” I met Barrett and guitarist Roger Waters with managers Jenner and Andrew king at the Central Office of Information in Lambeth. They had been viewing a colour film insert of the group for a magazine programme on Britain networked across America and Canada. The number they filmed was “Jug Band Blues,” written by Barrett which manager Jenner said he had wanted to release as their single instead of “Apples And Oranges.” He said he was pressing for it to be their next single in the New Year."
year_published = 2025
clearnet = "https://sydbarrett.net/syd-barrett-articles/hits-the-floyd-couldnt-care-less"
