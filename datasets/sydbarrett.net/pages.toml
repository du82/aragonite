["https://sydbarrett.net/syd-barrett-articles/my-lovably-ordinary-brother-syd"]
title = "My lovably ordinary brother Syd - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "My lovably ordinary brother Syd Tim Willis – The Times – July 16, 2006 The ‘crazy diamond’ founder of Pink Floyd was no acid casualty or recluse. He loved art and DIY, his sister Rosemary tells his biographer Tim Willis in her first interview for 30 years When the death of 60-year-old Roger “Syd” Barrett …"
full_description = "The ‘crazy diamond’ founder of Pink Floyd was no acid casualty or recluse. He loved art and DIY, his sister Rosemary tells his biographer Tim Willis in her first interview for 30 years When the death of 60-year-old Roger “Syd” Barrett was announced on Tuesday, the media raised an astonishing last hurrah for the founder of Pink Floyd, the “crazy diamond” who had shunned the public gaze for decades. The descriptions of him as a “mad genius”, “recluse” and “acid casualty” were far off the mark, however, according to his sister Rosemary. When I wrote Barrett’s biography, Madcap, four years ago I had off-the-record guidance from Rosemary — his junior by two years and closest friend. Last week, after his death, we spoke again and this time she went on the record — the first time she has given a press interview for more than 30 years. She described him as a loving man who “simply couldn’t understand” the continued interest in his distant Pink Floyd years and was too absorbed in his own thoughts to spare time for fans. While her account is naturally fond, one should remember that she has spent much of her working life as a nurse and therefore sees no stigma in mental illness. As children, she and Barrett shared a bedroom and she recalls him leaping from his sheets to conduct an imaginary orchestra. He always had an extraordinary mind, bordering on the autistic or Aspergic. He had a rare talent to exploit ambiguities in language and also experienced synaesthesia — the ability to “see sounds and hear colours” — which was to be a huge influence on his music in his psychedelic phase. As a performing artist, signed to a label, he was under enormous strain. Not only did he find fame a two-edged sword, he was also deeply resistant to his record company’s commercial demands. He was run ragged. Between January 1966, when the Floyd turned professional, and January 1968, Barrett played 220 gigs around Britain — not to mention broadcasting and performances abroad — as well as writing, recording and co-producing two hit singles, most of the band’s first album and part of the second."
year_published = 2025
clearnet = "https://sydbarrett.net/syd-barrett-articles/my-lovably-ordinary-brother-syd"
