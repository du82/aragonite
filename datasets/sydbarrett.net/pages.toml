["https://sydbarrett.net/syd-barrett-articles/shine-on-you-crazy-diamond"]
title = "Shine on you crazy diamond - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Shine on you crazy diamond Nick Kent – The Guardian UK – July 12, 2006 Syd Barrett, the most famous recluse in rock, is dead. It would be easy to mourn the founder of Pink Floyd as a casualty of drugs and mental illness, says Nick Kent – but his songs will inspire musicians for …"
full_description = "Syd Barrett, the most famous recluse in rock, is dead. It would be easy to mourn the founder of Pink Floyd as a casualty of drugs and mental illness, says Nick Kent – but his songs will inspire musicians for generations Syd Barrett’s musical career lasted barely seven years – from 1965 to early ’72 – and the past 32 years saw him resolutely refusing to record new music or venture near a concert stage. But Barrett, who died of cancer last Friday at the age of 60, will go down in history as one of the most uniquely inspired creative talents to have sprung up from the pop revolution that gripped Britain in the late 20th century. More specifically, he was the golden boy of the mind-melting late-60s psychedelic era, its brightest star and ultimately its most tragic victim. Like many other questing spirits who came to age in the mid-60s, he was inspired by taking LSD to create truly daring, other-wordly music – first for the original incarnation of Pink Floyd, then as a solo singer/songwriter – but the drug ended up fatally fracturing his psyche and turning him into a solitary recluse unable to function within the music industry and society in general. The story of his personal meltdown has been told and retold as a cautionary tale for indiscriminate druggies to the point where Barrett’s status as rock’s most illustrious casualty often threatens to outweigh his actual creative contributions to the form. This is not as it should be. Barrett started making music in his early teens, not long after the death of his father, an esteemed doctor. He became a regular fixture at Cambridge folk clubs but was generally more attracted by music involving electric instruments. He played in several amateurish blues bands around Cambridge until he won a scholarship to a prestigious London art school in 1964. The following year Barrett started playing with a former Cambridge schoolfriend, Roger Waters, who was studying architecture at London’s Regent Street polytechnic, and two of Waters’ fellow students, Richard Wright and Nick Mason. Although he was the youngest member of the group, Barrett quickly became its leader and key driving force. He wrote the songs. He sang them, too – as well as playing guitar. He even came up with the name: Pink Floyd, taken from a blues album he owned involving two obscure musicians known as Pink Anderson and Floyd Council."
year_published = 2025
