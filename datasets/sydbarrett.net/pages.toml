["https://sydbarrett.net/syd-barrett-articles/pink-floyd-mojo-1994"]
title = "Pink Floyd - Mojo 1994 - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Pink Floyd Robert Sandall – Mojo magazine 1994 The third coming And it came to pass that the Syd Barrett Group became the Roger Waters Quartet, who became the David Gilmour Trio. And many various were the evils that befell them upon the highway. Pink Floyd Robert Sandall Three decades and 140 million albums later, …"
full_description = "And it came to pass that the Syd Barrett Group became the Roger Waters Quartet, who became the David Gilmour Trio. And many various were the evils that befell them upon the highway. Three decades and 140 million albums later, the sheer familiarity of the Pink Floyd phenomenon obscures the strangeness of it all. Unlike any of their contemporaries, for whom drastic changes in line-up have normally spelled disaster, The Floyd are well into their third coming. They opened their account as the Syd Barrett band, hoisted themselves into the international superleague as the Roger Waters quartet, and having survived the successive departures of two inspirational leaders and principal songwriters, are now continuing to hold their own as the David Gilmour trio. Small wonder the accepted wisdom holds that with Pink Floyd it is the sights and the sounds that matter; that for them, personnel are little more than technicians servicing a vast, high-tech _son et lumiere_ spectacle, or perpetuating a brand name. The band endorse and encourage this view of themselves as a personality-free zone, to the point of giving only one interview to mark the release of their new album, The Division Bell. “We don’t have to promote a Bono or a Mick Jagger,” drummer Nick Mason tells me. “The thing you have to remember is, we’re so wonderfully boring.” What this thoroghly English remark conceals though is an equally English history of childhood friendships and teenage alliances, casting long shadows over the lives and careers of a group of young, now middle-aged, men. Most accounts of the origins of Pink Floyd begin at Regent Street Polytechnic, London in 1964, where three architectural students, Roger Waters, Nick Mason and Rick Wright, formed a college R&B band, later recruiting a student from Camberwell Art school, “Syd” — real name, Roger — Barrett. The true foundations of Pink Floyd though had been laid much earlier. It is no coincidence that the band’s three leaders, Barrett, Waters and David Gilmour grew up together in Cambridge, in fairly comfortable middle- class circumstances. Their mothers, according to Gilmour, all had connections with Homerton, the nearby teacher’s training college. But the key to their knowing each other was the man whose ghost still hovers above the band: Syd Barrett. Waters and Barrett shared the same primary and grammar schools, and were drawn to each other, despite the age difference, partly because each had lost his father. Gilmour and Barrett, both a couple of years younger than Waters, became friendly aged 14, and ended up at Cambridge Tech together, studing ‘A’ levels. “We would hang around the Art Department, playing guitars every lunchtime. Teaching each other basically,” Gilmour recalls."
