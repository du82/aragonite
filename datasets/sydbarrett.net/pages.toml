["https://sydbarrett.net/category/syd-barrett-news"]
title = "Syd Barrett News Archives - The Syd Barrett ArchivesThe Syd Barrett Archives"
full_description = "The psychedelic pioneers’ debut was released on 5 August 1967. To mark its anniversary Elizabeth Alker spoke to Pink Floyd’s drummer about making the record and more. I will be reviewing the entire box set disc by disc. I will give the good, the bad, and the ugly on the set and look at it as both to someone who isn’t s super collector as well as someone who already has a lot of this material. I will expand this article each day as I go along. Audio first and then video. Songs 1-6: Obviously being fans of Syd Barrett and the early Pink Floyd this is where we want to start. The 6 songs from the Tea Set which came out last year in that limited RSD double single are as good as I reviewed there, so I will not add anything to that. Songs 7-11: These are the early singles in Mono, they sound nice, not really anything new or much to add here that most of us don’t know. Song 12: Matilda Mother is the version from the 40th anniversary of Piper and An Introduction to Syd Barrett, nothing new here. Song 14: In the Beechwoods, one of the holy grails that we have been waiting for, well, it’s here, it’s an instrumental and the sound quality is good. Song 15: Vegetable Man, the 2nd of the holy missing songs, now I will say this is the best sounding version I have heard, BUT the mix is a new mix and not the original mix that we are used to hearing on RoIO’s and such, the easiest tell on that is at the end of the song. But a nice edition and certainly the best quality version that has ever been out there. Song 16: Scream Thy Last Scream, well this one I am a little disappointed in, especially the mix. Honestly I have a RoIO that beats this in both sound and mix. The most noticeable difference is that they mixed down the high pitch (Syd) singing and brought Nick’s main vocal more out front, they also unbalanced the keyboards in this mix. Songs 1-8: The Stockholm show from 67 that was dug up a few years ago, it sounds great, even if you still cannot really hear the vocals. The standout is Reaction in G, but also to note that Scream Thy Last Scream is truncated."
year_published = 2017
clearnet = "https://sydbarrett.net/category/syd-barrett-news"
