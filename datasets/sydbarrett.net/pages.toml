title = "August 2016 - The Syd Barrett ArchivesThe Syd Barrett Archives"
full_description = "As some of you may already know, it has been announced that a Pink Floyd – The Early Years 1965-1972 box set is being released to cover the treasure trove of unreleased, live and rare recordings from their early years. This release will finally get songs like Scream Thy Last Scream, Vegetable Man, In The Beechwoods and more finally out there as well as the 1965 demos that were released in a limited fashion last year. There will also be separate releases of the discs contained within the set with some tracks being left out and exclusive to the box. The only tracks that seem to be missing now from the Syd Barrett time period is She Was A Millionaire, recorded in April of 67, along with the early version of Lucifer Sam called Percy The Ratcatcher, and the early versions of Arnold Layne and Let’s Roll Another One (Candy and a Currant Bun) (Unless these two are included here in the set, but it doesn’t seem to be the case), beyond that everything seems to be covered and then some. 1. Lucy Leave* 2.57 2. Double O Bo* 2.57 3. Remember Me* 2.46 4. Walk With Me Sydney* 3.11 5. Butterfly* 3.00 6. I’m A King Bee* 3.13 7. Arnold Layne 2.57 8. See Emily Play 8.57 9. Apples And Oranges 3.05 10. Candy And A Currant Bun 2.45 11. Paintbox 3.48 12. Matilda Mother (2010 mix) 4.01 13. Jugband Blues (2010 mix)† 3.01 14. In The Beechwoods (2010 mix)† 4.43 15. Vegetable Man (2010 mix)† 2.32 16. Scream Thy Last Scream (2010 mix)† 4.43 Tracks 1-11 mono. Tracks 12-16 stereo *including Rado Klose on guitar and Juliette Gale on vocals on ‘Walk With Me Sydney’ 1.Introduction† 0.25 2. Reaction in G † 7.18 3. Matilda Mother† 5.34 4. Pow R. Toc H.† 11.56 5. Scream Thy Last Scream† 4.00 6. Set The Controls For The Heart Of The Sun† 7.17 7. See Emily Play† 3.16 8. Interstellar Overdrive† 8.57 9. John Latham Version 1† 4.32 10. John Latham Version 2† 5.06 11. John Latham Version 3† 3.45 12. John Latham Version 4† 2.59 13. John Latham Version 5† 2.48 14. John Latham Version 6† 3.17 