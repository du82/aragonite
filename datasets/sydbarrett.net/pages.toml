["https://sydbarrett.net/syd-barrett-articles/syd-barrett-interview"]
title = "Syd Barrett Interview - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Syd Barrett interview Melody Maker, Mar 27 1971, Michael Watts Stories about Syd Barrett are legion. That he became overbearingly egotistical, impossible to work with. That he was thrown out of The Pink Floyd. That he suffered a psychological crack-up. That he once went for an afternoon drive and ended up in Ibiza. That he …"
full_description = "That he became overbearingly egotistical, impossible to work with. That he was thrown out of The Pink Floyd. That he suffered a psychological crack-up. That he once went for an afternoon drive and ended up in Ibiza. That he went back to live with his mother in Cambridge as a part of a mental healing process. That occasionally he goes to the house of Richard Wright, The Floyd’s organist, and sits there silently for hours without speaking. Roger Waters: ‘When he was still in the band in the later stages, we got to the point where anyone of us was likely to tear his throat out at any minute because he was so impossible… ‘When ‘Emily’ was a hit and we were third for three weeks, we did Top Of The Pops, and the third week we did it he didn’t want to know. He got down there in an incredible state and said he wasn’t gonna do it. We finally discovered the reason was that John Lennon didn’t have to do Top Of The Pops so he didn’t.’ In the past two years he has made a couple of albums. One of them was called ‘Barrett.’ The other was called ‘The Madcap Laughs.’ The cover of ‘Madcap’ has a picture of him crouching watchfully on the bare floorboards of a naked room. A nude girl stretches her body on the background. The picture encapsulates the mood of his songs, which are pared-down and unembellished, unfashionably stripped of refined production values, so that one is left to concentrate on the words and the stream of consciousness effect. His work engenders a sense of gentle, brooding intimacy; a hesitant, but intense, awareness. Syd Barrett came up to London last week and talked in the office of his music publisher, his first press interview for about a year. His hair is cut very short now, almost like a skinhead. Symbolic? Of what, then? He is very aware of what is going on around him, but his conversation is often obscure; it doesn’t always progress in linear fashion. He is painfully conscious of his indeterminate role in the music world: ‘I’ve never really proved myself wrong. I really need to prove myself right,’ he says."
year_published = 2025
