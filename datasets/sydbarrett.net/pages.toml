["https://sydbarrett.net/syd-barrett-articles/richard-wright-interview-1996"]
title = "Richard Wright interview 1996 - The Syd Barrett ArchivesThe Syd Barrett Archives"
description = "Richard Wright interview August 1996, Mark Blake Part three – Syd, drugs, the future Q: You co-produced Syd Barrett’s second album (Barrett in 1970). Could you see yourself moving into production? A: Producing yourself is one thing but producing somebody else is another. Anthony (Moore) could do it and does do it. But I don’t …"
full_description = "Q: You co-produced Syd Barrett’s second album (Barrett in 1970). Could you see yourself moving into production? A: Producing yourself is one thing but producing somebody else is another. Anthony (Moore) could do it and does do it. But I don’t have the right sort of personality and desire, if you like. I couldn’t see myself doing something like Brian Eno. Doing Syd’s record was interesting, but extremely difficult. Dave and Roger did the first one (The Madcap Laughs) and Dave and myself did the second one. But by then it was just trying to help Syd any way we could, rather than worrying about getting the best guitar sound. You could forget about that! It was just going into the studio and trying to get him to sing. However, I think both of Syd albums are an interesting part of history. A: I read in a magazine, that he’s now going blind because of diabetes. It’s terribly sad. We don’t see him, because apparently if he’s ever reminded of Pink Floyd and when he was in it, he goes into a depression for weeks on end. His mother asked us to stay away a few years ago. Apparently, most of the time he’s quite happy – or was – but our faces can trigger off a lapse. Would it have always happened or was it because of a huge overdose of acid ? Who knows. I suspect it was a bit of both. All I know is one week he was fine and a week later he turned up again and was completely different. It’s just a terrible tragedy. A: Syd was very influenced by a lot of people around him, who encouraged him to take trips. There are a load of acid casualties out there. He wasn’t alone. Back then, we had people like Timothy Leary openly advocating it: trip our and take it every day. Wrong ? Yes. Misguided ? Yes. It was wrong for me. I took two trips in my life. The first was quite enjoyable and that was before I was in the band. Then I took one more and I didn’t enjoy it at all, so I never took it again. It certainly destroyed Syd and I think it has destroyed a lot of other people."
year_published = 2025
