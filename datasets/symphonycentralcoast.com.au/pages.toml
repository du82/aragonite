["https://www.symphonycentralcoast.com.au/play-with-us-faq"]
title = "Play With Us – FAQ | Symphony Central Coast"
full_description = "PLAY WITH US – FAQ Who are we? SCC is a community orchestra made up of amateur, semi-professional and professional players. We are a not for profit organisation and come together simply for the pleasure of playing and performing classical and contemporary repertoire with like-minded people. There is an informal atmosphere and a social aspect however we strive to perform at a high standard, and we take the music seriously (but not ourselves!) In our ranks there are people from all walks of life including music teachers, schoolteachers, doctors and health care workers, a psychologist, an architect, a lawyer, a university professor, people who work in IT and media and a wide variety of other occupations. The age range is from young adult through to mature age and retired individuals. We have a management committee which organises administration, promotion, grant applications and partnerships and an artistic committee which plans concert programs. We are run democratically as an Incorporated Association where anyone can be nominated for committee positions. How do I make an enquiry about playing with SCC? SCC welcomes applications from interested musicians to join us at any time. Some sections of the orchestra have more scope for expansion than others depending on instrument and current membership. Opportunities also depend on repertoire. Send your enquiries to info@symphonycentralcoast.com.au with phone number. An SCC Committee member will phone you for further discussion. How do I become a member? SCC is an Incorporated Association and we require musicians to become members in order to participate in rehearsals and concerts. To be a member costs only $50 per annum which goes towards paying the insurance costs covering musicians whilst they are playing with us. Please submit your membership application and payment via the link below. If you have any problems with this, please contact us on the email above. Become a member of SCC What training and experience do I need? There are no formal auditions. For strings, a minimum ability of AMEB grade 5 or equivalent is required. Previous orchestral experience is beneficial but not essential. String players who lack readiness to perform in concerts may participate in rehearsals but not in concerts until confidence is gained. The primary requirement is enthusiasm and interest. We also encourage non-musicians who have expertise in stage management and/or technology and other relevant skills to contact us. How much time is involved? We rehearse on Wednesday nights from 7.30 to 9.45 pm at the Central Coast Grammar School Performing Arts Centre, Erina, during school terms, preparing for 4 annual subscription concerts. These concerts generally occur on Sunday afternoons, one week before the end of term. We also perform the occasional free outdoor concert and collaborate with other Central Coast musical groups. Often the music played is challenging and private practice of individual parts is expected (as required) to adequately prepare for rehearsals and to achieve the optimum performance quality."
year_published = 2025
clearnet = "https://www.symphonycentralcoast.com.au/play-with-us-faq"
