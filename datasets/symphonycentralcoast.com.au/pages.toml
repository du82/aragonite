title = "Symphony Central Coast | Symphony Central Coast: Entertaining & Inspiring Through Musical Excellence"
full_description = "SEASON 2025 Sunday 6 April 2:30pm TALES FROM THE VIENNA WOODS Magic of the Waltz A Viennese concert is not just a musical performance – it’s an experience full of emotion, joy and community. People of all ages and cultures come together to enjoy the sheer beauty of music though walzes, polkas, romances and more. Uniting all, these concerts emanate joy and optimism. Picture yourself in the famous Schoenbrunn Palace where Mozart himself performed, or the Börse Palace ballroom. We invite you into the world of classical music with music by Strauss, Tchaikovsky, Puccini, Berlioz, Shostakovich and Chopin. Plus extra treats by Spike Milligan and Ennio Morricone. Featuring the Central Coast’s leading soprano Michaele Archer. 2:30pm | 6 April 2025 | Central Coast Grammar School Performing Arts Centre Buy tickets now Sunday 29 June 2:30pm DRAMATIC, MAGIC AND TRAGIC Freedom, love, defiance Personal sacrifice, heroism, eventual triumph: the struggle for liberty and justice is eternal. In Beethoven’s only opera Fidelio, the main character, Leonore, the wife of politically imprisoned Florestan, poses as boy named Fidelio, and enters the prison where her husband is kept, attempting to ingratiate herself with the gaoler and free Florestan. Beethoven himself struggled to find the most appropriate music for the opening, finally settling on Leonore no. 3, an overture that relects her determination, bravery and humanity. Shakespeare’s delightful comedy A Midsummer Night’s Dream weaves together the intersecting stories of four young lovers, a group of amateur actors, and mischievous group of fairies. Set in an enchanted forest near Athens, the play explores themes of love, illusion, and the unpredictable nature of desire. In response to a commission from King Frederick William IV of Prussia, Felix Mendelssohn wrote incidental music for a performance at the New Palace at Potsdam. Incorporating an overture that he had written 16 years earlier, the collection includes an intermezzo, a nocturne, a chattering scherzo and a now very famous wedding march. Despite a scherzo that overflows with high spirits, Brahms Fourth Symphony is one of most serious and profound works in the orchestral repertoire. Combining ‘modern’ and complex musical ideas with a fundamental adherence to classical and pre-classical models, Brahms’ final symphony contains extraordinary inventiveness and ingenuity as he explores all the motivic ideas but the work remains logical and attractive. There are memorable tunes and rich harmonies, all built with masterful craft and control. 2:30pm | 29 June 2025 | Central Coast Grammar School Performing Arts Centre Buy tickets now Sunday 21 September 2:30pm PRODIGIES Virtuosic Excellence The concerto as a vehicle for virtuosic display flourished during the 19th Century, becoming increasingly complex and ambitious works. While performances of typical concerto in the baroque era lasted about ten minutes, those by Beethoven, for example, could last half an hour or longer. Concertos from all ages, since their development in late 1600s, have remained a conspicuous and important part of the repertoire for concert performances and recordings and this concert will feature the four soloists chosen from the Symphony Central Coast Concerto Competition. To celebrate the 100th concert by the University of New South Wales Orchestra, Joe Wolfe was given a simple brief: write a piece that was 4 or 5 minutes of fun, using everybody, and to not take up much rehearsal time. The result, Circle of Fourths was inspired by the opening notes of the choral Old Hundredth, (so named because its words are from Psalm 100), and a desire to explore the melodic and harmonic possibilities of successive intervals of fourths. In Verdi’s opera Aida, Radames leads the Egyptian army on its return following the victory over the Ethiopians. Music that reflected triumph, victory and great joy was needed and Verdi obliged, giving us the succinctly named Grand March. 2:30pm | 21 September 2025 | Central Coast Grammar School Performing Arts Centre Buy tickets now Sunday 23 November 2:30pm A GRAND DAY OUT Happy Holidays! Hiccup Horrendous Haddock III, a young Viking, initially dismissed as a clumsy and underweight misfit, soon becomes renowned as a brave dragons expert, defending his home as leader of a flying corps of dragon riders. In How to Train Your Dragon, he captures his first dragon and befriends it, teaming up to destroy the gargantuan dragon Red Death. Wallace and Gromit: A Grand Day Out. To replenish their depleted supply of cheese, inventor Wallace and his dog Gromit travel to the moon in a homemade rocket-ship. They discover a coin-operated alien robot which causes havoc. Can our heroes safely return to earth or will the robot have the final say? The Snowman. A young boy builds a snowman in his back garden on Christmas Eve. The snowman magically comes to life at midnight and takes the boy on a magical adventure to the North Pole where they meet Santa Claus. This is a story filled with laughter, wonder and sadness – an instant holiday classic! images © and TM Aardman/W&G Ltd. All rights reserved 2:30pm | 23 November 2024 | Central Coast Grammar School Performing Arts Centre Buy tickets now Subscribe to our email newsletter"
year_published = 2025
