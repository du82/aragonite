title = "Donate | Symphony Central Coast"
full_description = "As a community organization, Symphony Central Coast welcomes financial donations large and small. Many of the orchestra’s musicians and board contribute their time, talent and expertise on a voluntary basis, in order that all people young and old on the central coast can enjoy classical music locally. Symphony Central Coast also offers valuable professional development opportunities for young musicians on the coast, through its partnership with Central Coast Grammar. Your contribution will ensure this jewel of the coast keeps shining for many years to come. Donations can help ensure that: The orchestra has enough funds to secure performance spaces for its concerts Guests can enjoy professional performances emboldened by dynamic audio visual displays and concert guides The orchestra has a continued presence at local events and initiatives The orchestra continues to be a part of the cultural fabric of the Central Coast. Donations are gratefully accepted at any time. Please deposit funds to this account: Symphony Central Coast BSB 633 000ACC. NO. 197 553 514 Symphony Central Coast is an Incorporated Not For Profit – donations are not tax deductible."
