["https://www.symphonycentralcoast.com.au/partners"]
title = "Partners | Symphony Central Coast"
full_description = "Partnering with Symphony Central Coast Partnerships play a vital role in ensuring the success of Symphony Central Coast. The generosity of local companies and individuals enables us to present innovative and acclaimed productions, maintain and develop artists’ skills, and engage audiences. We invite you to join us as a Corporate or Community Partner. Please contact us to discuss how you can help keep orchestral music alive on the Central Coast. Central Coast Grammar School (CCGS) CCGS hosts the annual SCC concert series in the school’s 750 seat Performing Arts Centre as their main Partnership contribution. In addition, the CCGS also provides the Symphony Orchestra with concert rehearsal facilities. For Symphony Central Coast, this is a most valuable Partnership contribution. CCGS is an independent, K-12, coeducational, nondenominational school with a Christian ethos. Established in 1985, the school offers a broad education to its 1150 students. Situated on a single 17-hectare campus at Erina Heights, the school enjoys a magnificent setting and first class facilities. Music is an integral part of life at Central Coast Grammar School. An outstanding team of accomplished private tutors aim to raise musicians to a high level of skill. Individual needs, interests and abilities are catered for, from the enthusiastic beginner to the highly accomplished academic. Music is part of the curriculum for every student from Kindergarten to Year 8 with electives and HSC extension offering progression to study at the highest level. Music Scholarships support talented musicians. Thank you Central Coast Grammar School. Central Coast Council Central Coast Council provides support to Symphony Central Coast via its grants program. Symphony Central Coast is promoted by Central Coast Council in the visitcentralcoast.com.au website and tourism promotion program. Thank you Central Coast Council. Penmans Solicitors – Legal Partner Penmans provide valuable pro bono legal advice to Symphony Central Coast on key contract and related matters. Penmans Solicitors have been established in Gosford, on the Central Coast of New South Wales since 1945. The firm provides quality legal advice and representation. The firm’s solicitors combine to provide experience in all areas of legal practice and are there to give client support and guidance. Thank you Penmans. Central Coast Conservatorium Central Coast Conservatorium is a key event Partner to Symphony Central Coast and a valuable source of high-level musicians. Central Coast Conservatorium is the Coast’s premier Music School offering a Step-by Step program of music lessons for all ages and abilities. They provide qualified instruction on a large variety of instruments as well as a comprehensive in-schools program. Thank you Central Coast Conservatorium. Gosford North Rotary Club The members of Gosford North Rotary share a passion for helping individuals and communities less fortunate than ourselves through volunteering our time and lifetime skills. We take action by connecting people who then work together to solve community problems and meet their needs locally and overseas, provide humanitarian aid, and promote goodwill and peace. Our focus is to build international relationships, improve lives, and create a better world to support our peace efforts and end polio forever. Since 1905 Rotary has strived to meet these goals by giving practical effect to our motto of “Service above Self”. You are invited to get involved, connect with others, and share in the experience of assisting those in need. Donations Barry Day Bequest Community Partnerships can come in the form of very special bequests. Symphony Central Coast is both proud and privileged to be a recipient of such a bequest. The Barry Day Bequest is an example of a local family who have supported Symphony Central Coast for a long time. The bequest acknowledges the value of the orchestra to the Central Coast community by making a material donation to the considerable expenses of running an orchestra. Thank you the Day family. Donations always welcome. Become a Corporate or Community Partner We applaud our Corporate and Community Partners for their support and hope that such partnerships offer mutual benefits that are valuable to both parties. We encourage others, both on the Central Coast and wider afield in Australia to become Partners. To enquire about potential partnerships please contact our team via email at: info@symphonycentralcoast.com.au or through our Contact button on the website."
