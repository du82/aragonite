full_description = '''Beta program Beta program Active Backup for Business Synology Active Backup for Business Agent Synology Active Backup for Business Recovery Media Creator Synology Active Backup for Business Recovery Wizard Installing Active Backup for Business Please read the following before installing this beta software For evaluation only - This beta software is for evaluation purposes only and should not be installed on critical equipment or in production environments. We strongly recommend reading the Release notes section before installing it. Synology cannot be held responsible for any damages, such as accidental data loss, caused by this beta software. Not downgradable - After installation of this beta application, you will not be able to downgrade to a previous official version of this software. To install the beta software on your Synology NAS Log in to DSM using an account belonging to the administrators group. Open Package Center. Now you should be able to find and install packages that currently have a beta version available and compatible with your Synology NAS for public testing. Remember to click from Installed > Feedback to help us out and report any issues or suggestions. Compatibility Applied Models FS-series: FS6400, FS3600, FS3410, FS3400, FS3017, FS2500, FS2017, FS1018 HD-series: HD6500 SA-series: SA6400, SA3610, SA3600, SA3410, SA3400D, SA3400, SA3200D 24-series: DS224+ 23-series: RS2423RP+, RS2423+, DS1823xs+, DS923+, DS723+, DS423+ 22-series: RS822RP+, RS822+, RS422+, DS3622xs+, DS2422+, DS1522+, DVA1622 21-series: RS4021xs+, RS3621xs+, RS3621RPxs, RS2821RP+, RS2421RP+, RS2421+, RS1221RP+, RS1221+, DS1821+, DS1621xs+, DS1621+, DVA3221 20-series: RS820RP+, RS820+, DS1520+, DS920+, DS720+, DS620slim, DS420+, DS220+ 19-series: RS1619xs+, RS1219+, DS2419+II, DS2419+, DS1819+, DS1019+, DVA3219 18-series: RS3618xs, RS2818RP+, RS2418RP+, RS2418+, RS818RP+, RS818+, DS3018xs, DS1618+, DS918+, DS718+, DS418play, DS218+ 17-series: RS18017xs+, RS4017xs+, RS3617xs+, RS3617RPxs, RS3617xs, DS3617xsII, DS3617xs, DS1817+, DS1517+ 16-series: RS18016xs+, RS2416RP+, RS2416+, DS916+, DS716+II, DS716+, DS416play, DS216+II, DS216+ Release notes Compatibility and Installation Active Backup for Business 3.0.0 and above requires DSM 7.2 or above. Active Backup for Business 3.0.0 and above requires installing Container Manager. The following models are not supported in Active Backup for Business 3.0.0 or above: DS214play DS216play DS415play DS416play DS418play Important Note Daily backups previously scheduled to run every hour will change to hourly backups. To back up a custom volume on Mac, you only need to specify the volume name instead of the entire path. However, if your device has multiple volumes with the same name, all of them will be backed up. Backups configured before the update will continue using the full path unless modified. What's new Added support for centralized management via ActiveProtect appliances. Learn about package features, requirements, and limitations here. Added support for macOS Sequoia 15. Updated OpenSSL to version 3.0.0 to enhance connection security. This update applies to personal computers, physical servers, file servers, and virtual machines. Added support for throttling failure notifications when the server reaches its storage limit or encounters hypervisor connection issues, preventing excessive notifications. Fixed Issues (General Issues) Fixed an issue where reaching the storage limit might cause backups to freeze and prevent the status from updating. Fixed a security vulnerability regarding SQL injection. Fixed security vulnerabilities regarding heap-based and stack-based buffer overflows. Fixed a security vulnerability regarding arbitrary access, creation, modification, and deletion of files. Fixed Issues (Physical Server) Fixed an issue where restoring to virtual machines might fail. Installing Synology Active Backup for Business Agent Please read the following before installing this beta software. For evaluation only - This beta software is for evaluation purposes only and should not be installed on critical equipment or in production environments. We strongly recommend reading the Release notes section before installing it. Synology cannot be held responsible for any damages, such as accidental data loss, caused by this beta software. Not downgradable - After installation of this beta application, you will not be able to downgrade to a previous official version of this software. Before you start Supported operation systems: Windows PC: Windows 11 (all editions) Windows 10 Creators Update (all editions) Windows 10 (all editions) Windows 8.1 (all editions) Windows 7 SP1 (all editions) Physical Server: Windows 11 (all editions) Windows 10 Creators Update (all editions) Windows 10 (all editions) Windows 8.1 (all editions) Windows 7 SP1 (all editions) Windows Server 2022 Windows Server 2019 Windows Server 2016 Windows Server 2012 R2 Windows Server 2012 Windows Server 2008 R2 Mac macOS Sequoia 15 macOS Sonoma 14 macOS Ventura 13 macOS Monterey 12 macOS Big Sur 11 macOS Catalina 10.15.7 Linux (Active Backup for Business 2.2.0 or above is required) Physical Server: Supports kernel versions between 2.6 and 6.8 CentOS: 7.8, 7.9, 8.1, 8.5 RHEL: 6.10, 7.8, 8.16.10, 7.8, 7.9, 8.1, 8.4, 8.5, 8.6, 8.7, 8.8, 8.9, 8.10, 9.0, 9.1, 9.2, 9.3, 9.4 Ubuntu: 16.04, 18.04, 20.04, 22.04, 24.04 Fedora: 38, 39, 40 Debian: 10, 11, 12 Supported file systems: Windows: NTFS Mac: APFS Linux: ext2, ext3, ext4, XFS To install the beta utility on your computer Once you have updated Active Backup for Business to the latest beta version on your Synology product, you can install the beta version of Synology Active Backup for Business Agent from Active Backup for Business. Alternatively, click one of the following download links to start downloading directly. Windows (msi) (32 bits) Download MD5 Copy Windows (msi) (64 bits) Download MD5 Copy Mac (dmg) (64 bits) Download MD5 Copy Linux (deb) (64 bits) Download MD5 Copy Linux (rpm) (64 bits) Download MD5 Copy Release notes Compatibility and Installation Updated to be compatible with Active Backup for Business 3.0.0. Important Note To ensure data integrity, Active Backup for Business will perform a full backup of Windows PCs and physical servers during the initial backup after updating to version 3.0.0 or above. What's new Enhanced backup performance for macOS 14. Fixed Issues Fixed an issue where extending volumes on Windows might result in incomplete backups. Fixed an issue where backing up multiple block devices on the same general disk on Linux might result in incomplete backups. Fixed an issue where backing up Macs with OpenCore Legacy Patcher might fail. Fixed an issue where file restorations might fail. Fixed an issue where rebooting Linux with kernel version 6.4 (or higher) might result in incomplete backups of /dev/sdx. Installing Synology Active Backup for Business Recovery Media Creator Please read the following before installing this beta software. For evaluation only - This beta software is for evaluation purposes only and should not be installed on critical equipment or in production environments. We strongly recommend reading the Release notes section before installing it. Synology cannot be held responsible for any damages, such as accidental data loss, caused by this beta software. Not downgradable - After installation of this beta application, you will not be able to downgrade to a previous official version of this software. Before you start System requirement: Windows Windows 11 (all editions) Windows 10 (All editions) Windows server 2022 Windows server 2019 Windows server 2016 To install the beta utility on your computer Once you have updated Active Backup for Business to the latest beta version on your Synology product, you can install the beta version of Synology Active Backup for Business Recovery Media Creator from Active Backup for Business. Alternatively, click one of the following download links to start downloading directly. Windows (zip) Download MD5 Copy Mac (dmg) Download MD5 Copy Linux (iso) Download MD5 Copy Release notes Compatibility and Installation Updated to be compatible with Active Backup for Business 3.0.0. Installing Synology Active Backup for Business Recovery Wizard Please read the following before installing this beta software. For evaluation only - This beta software is for evaluation purposes only and should not be installed on critical equipment or in production environments. We strongly recommend reading the Release notes section before installing it. Synology cannot be held responsible for any damages, such as accidental data loss, caused by this beta software. Not downgradable - After installation of this beta application, you will not be able to downgrade to a previous official version of this software. Before you start System requirement: Mac macOS Sequoia 15 macOS Sonoma 14 macOS Ventura 13 macOS Monterey 12 macOS Big Sur 11 macOS Catalina 10.15.7 To install the beta utility on your computer Once you have updated Active Backup for Business to the latest beta version on your Synology product, you can install the beta version of Synology Active Backup for Business Recovery Wizard from Active Backup for Business. Alternatively, click one of the following download links to start downloading directly. Windows (zip) (32 bits) Download MD5 Copy Windows (zip) (64 bits) Download MD5 Copy Mac (dmg) (64 bits) Download MD5 Copy Linux (gz) (64 bits) Download MD5 Copy Release notes Compatibility and Installation Updated to be compatible with Active Backup for Business 3.0.0. Fixed Issues Fixed an issue where backups might fail after restoring the macOS system disk. $(function(){ $('.accordion_container').on('click', '.accordion_title' ,function(){ $(this).toggleClass('slide_up').next('.accordion_content').slideToggle(); $('h1').toggleClass('slide_up', $('.accordion_container .accordion_title.slide_up').length > 0)