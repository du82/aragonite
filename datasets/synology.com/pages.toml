title = "Security Bug Bounty Program | Synology Inc."
description = "As threats evolve and increase in both frequency and sophistication, Synology is working with security researchers to maintain and further bolster our protections.Synology’s Security Bug Bounty Program grants recognition and monetary rewards to researchers who identify potential vulnerabilities and cooperate with us in to ensure the safety of our customers."
full_description = '''Security Bug Bounty ProgramAs threats evolve and increase in both frequency and sophistication, Synology is working with security researchers to maintain and further bolster our protections.Synology’s Security Bug Bounty Program grants recognition and monetary rewards to researchers who identify potential vulnerabilities and cooperate with us in to ensure the safety of our customers.Scope & RewardsFAQAcknowledgmentProduct scopeThis program only accepts vulnerability reports related to Synology’s products and web services. Vulnerability reports that fall outside of the program’s scope do not generally qualify for rewards; however, out-of-scope reports of critical vulnerabilities may be accepted depending on the situation.Operating systemsRewards of up toUS $30,000Includes Synology DiskStation Manager, Synology Router Manager, and Synology BeeStation. Learn more Software and C2 cloud servicesRewards of up toUS $10,000Includes Synology-developed software packages, related mobile apps, and C2 cloud services. Learn more Web servicesRewards of up toUS $5,000Includes all major Synology web services. Learn more Reward Details Reward eligibility criteriaPlease provide any information we need to reproduce the reported issues. The size of each reward depends on the severity of the reported vulnerability and which product category is affected.To qualify for monetary rewards, reports must meet the following criteria:You are the first researcher to report this vulnerabilityThe reported vulnerability is confirmed to be verifiable, replicable, and a valid security issueYour report complies with the Bounty Program’s terms and regulationsReporting security bugsIf you believe you have found a vulnerability, please follow the steps below: Step 1 Contact us using the Bounty Program contact form. Step 2 Use this PGP key to encrypt your information when sending bug reports to Synology. Step 3 Include a detailed proof of concept (PoC) and make sure that the reported issues can be reproduced. Step 4 Keep your description succinct. For example, a short proof-of-concept link is valued higher than a video explaining the consequences of an SSRF issue.Your and our responsibilitiesYour reportTo reduce our processing time, a good vulnerability report should:Contain a clearly written step-by-step description in English of how to reproduce the vulnerabilityDemonstrate how the vulnerability affects Synology products or web services, and describe which versions and platforms are affectedState the potential damage caused by the reported vulnerabilityOur responseThe Synology Security Team will respond to your report within 7 days and regular update the status and fix the vulnerability as soon as possible, depending on the severity of the threat posed.If your vulnerability report qualifies for a monetary reward, your name will be listed on the Synology Product Security Advisory page on our official website as a gesture of our appreciation.This process will take at least 90 days. Your reward will be transferred to you upon completion of the process.Notes:Synology reserves the right to change or cancel this program, including its policies, at any time without prior notice.Operating systemsRewardQualified reports are eligible for a reward of up to US$30,000.*Products within scopeOnly reports about officially released versions are accepted.DiskStation Manager (DSM)DSM 7 (latest version)Synology Router Manager (SRM)**SRM 1.3 (latest version)Synology Camera firmware***Firmware 1.1 (latest version)Synology BeeStationBeeStation OS 1.0 (latest version)Regulations and restrictionsThis program is strictly limited to security vulnerabilities found in Synology products and services. Actions that could potentially damage or detrimentally affect Synology servers or data are strictly forbidden. Vulnerability testing must not breach local or Taiwanese laws.Vulnerability reports are not accepted under the program if they describe or involve:DoS (Denial of Service) attacks on Synology’s or users' serversVulnerability testing that is detrimental to Synology’s or users’ servers or dataPhysical attacks or social engineeringDisclosure of bug information before approval by SynologyNon-critical vulnerabilities in outdated services or productsVulnerabilities affecting only outdated web browsersMost types of brute-force attackReflected XSS attacks or Self XSS attacksVulnerabilities that involve phishing, creation of fake websites, or committing fraudVulnerability scanning reports that do not detail the vulnerability’s effectsIndications that default ports are vulnerable, but without providing a PoCTheoretical vulnerabilities lacking concrete Proof of Concept (PoC)Open redirects alone are typically considered informational and do not qualify for rewards unless they contribute to a more significant vulnerabilityMissing security headers that do not directly lead to exploitationMissing security flags in cookiesUser enumeration. Reports outlining user enumeration are not within scope unless you can demonstrate that we don’t have any rate limits in place to protect our users.*See the Reward Details page on the Security Bug Program web page for more details. **The maximum reward for vulnerabilities in SRM_LAN is $5,000. ***The maximum reward for vulnerabilities in camera firmware is $10,000. (function () { if (dsygno && dsygno.dialogBasic) dsygno.dialogBasic('#product-scope-learn-more-os', 'product-scope-os-dialog-test'); })(); Software and C2 cloud servicesRewardQualified reports are eligible for a reward of up to US$10,000.*Products within scopeOnly reports about officially released versions are accepted.PackagesSynology-developed software packagesDesktop clientsSynology-developed Windows, macOS, and Linux applicationsMobile appsSynology-developed mobile apps for Android and iOSSynology Account*.account.synology.com domains*.identity.synology.com domainsC2 services*.c2.synology.com domainsRegulations and restrictionsThis program is strictly limited to security vulnerabilities found in Synology products and services. Actions that could potentially damage or detrimentally affect Synology servers or data are strictly forbidden. Vulnerability testing must not breach local or Taiwanese laws.Vulnerability reports are not accepted under the program if they describe or involve:DoS (Denial of Service) attacks on Synology’s or users' serversVulnerability testing that is detrimental to Synology’s or users’ servers or dataPhysical attacks or social engineeringDisclosure of bug information before approval by SynologyNon-critical vulnerabilities in outdated services or productsVulnerabilities affecting only outdated web browsersMost types of brute-force attackReflected XSS attacks or Self XSS attacksVulnerabilities that involve phishing, creation of fake websites, or committing fraudVulnerability scanning reports that do not detail the vulnerability’s effectsIndications that default ports are vulnerable, but without providing a PoCTheoretical vulnerabilities lacking concrete Proof of Concept (PoC)Open redirects alone are typically considered informational and do not qualify for rewards unless they contribute to a more significant vulnerabilityMissing security headers that do not directly lead to exploitationMissing security flags in cookiesUser enumeration. Reports outlining user enumeration are not within scope unless you can demonstrate that we don’t have any rate limits in place to protect our users.*See the Reward Details page on the Security Bug Program web page for more details. (function () { if (dsygno && dsygno.dialogBasic) dsygno.dialogBasic('#product-scope-learn-more-cloud', 'product-scope-cloud-dialog'); })(); Web servicesRewardQualified reports are eligible for a reward of up to US$5,000.*Products within scopeThe following domains (including sub-domains) are in scope:*.synology.comThe following domains (including sub-domains) are out of scope:openstack-ci-logs.synology.com, router.synology.comSynology reserves the right to modify this list at any time without notice.Regulations and restrictionsThis program is strictly limited to security vulnerabilities found in Synology products and services. Actions that could potentially damage or detrimentally affect Synology servers or data are strictly forbidden. Vulnerability testing must not breach local or Taiwanese laws.Vulnerability reports are not accepted under the program if they describe or involve:DoS (Denial of Service) attacks on Synology’s or users' serversVulnerability testing that is detrimental to Synology’s or users’ servers or dataPhysical attacks or social engineeringDisclosure of bug information before approval by SynologyDirectory traversal on https://*archive.synology.comReflected file downloadBanner grabbing issues or software version disclosure0-day vulnerability disclosed within 90 daysNon-critical vulnerabilities in outdated services or productsVulnerabilities affecting only outdated web browsersMost types of brute-force attackReflected XSS attacks or Self XSS attacksVulnerabilities that involve phishing, creation of fake websites, or committing fraudVulnerability scanning reports that do not detail the vulnerability’s effectsIndications that default ports are vulnerable, but without providing a PoCTheoretical vulnerabilities lacking concrete Proof of Concept (PoC)Open redirects alone are typically considered informational and do not qualify for rewards unless they contribute to a more significant vulnerabilityMissing security headers that do not directly lead to exploitationMissing security flags in cookiesUser enumeration. Reports outlining user enumeration are not within scope unless you can demonstrate that we don’t have any rate limits in place to protect our users.*See the Reward Details page on the Security Bug Program web page for more details. (function () { if (dsygno && dsygno.dialogBasic) dsygno.dialogBasic('#product-scope-learn-more-web', 'product-scope-web-dialog'); })(); Reward detailsThis page is designed to help researchers understand the potential maximum rewards for specific types of vulnerabilities and to highlight the types of vulnerabilities that Synology values most. We value your contributions and are dedicated to fairly rewarding significant security research.The rewards in the table show the maximum possible for each category, but not every qualifying report is guaranteed to receive the listed amount.*CriticalOperating systemsSoftware and C2 cloud servicesWeb servicesZero-click pre-auth RCE$30,000$10,000$5,000Zero-click pre-auth arbitrary file r/w$9,000$4,600$2,400ImportantOperating systemsSoftware and C2 cloud servicesWeb services1-click pre-auth RCE$8,000$4,000$2,000Zero-click normal-user-auth RCE$7,500$3,900$1,900Zero-click normal-user-auth arbitrary file r/w$6,500$3,400$1,700Zero-click pre-auth RCE (AC:H)$6,500$3,400$1,7001-click pre-auth RCE (AC:H)$5,000$2,500$1,325pre-auth SQL injection$3,800$1,950$1,0251-click normal-user-auth RCE (AC:H)$2,600$1,350$725pre-auth stored XSS$2,600$1,350$725ModerateOperating systemsSoftware and C2 cloud servicesWeb servicesnormal-user-auth stored XSS$1,350$733$417normal-user-auth SQL injection$1,200$607$353admin-auth vulnerabilities$100$100$100Beginning October 1, 2024 admin-auth vulnerability rewards will be set at $100 USD.For Desktop Clients, if the CVSS vector includes any of the following, the reward is set to $100 USD: AV:LAV:AAV:N/AC:HNotes:Please note that while guidelines for rewards are provided, each report is treated individually and thoroughly evaluated. Scoring considers various factors, including but not limited to the scope detailed in the rewards rubric. Synology reserves the right to final interpretation of the reward amounts.For issues classified as low severity or suggestions, only acknowledgements will be provided. (function () { if (dsygno && dsygno.dialogBasic) dsygno.dialogBasic('#product-scope-learn-more-all', 'product-scope-all-dialog'); })(); $(document).ready(function() { //tab $('#product-scope-learn-more-all').on("keypress", function(e) { if (e.which ==13) { $(this).trigger('click'); } }); }); FAQsHow should I report a vulnerability?Please provide detailed PoC (Proof of Concept) and make sure the reported issues can be reproduced. Use this PGP key encryption offered by Synology when sending bug reports to us and do not disclose the relevant information to any third party.Who is responsible for determining whether my bug report is eligible for a reward?All the bug reports are reviewed and evaluated by Synology Security Team, which is comprised of Synology’s senior security analysts.What is the consequence if a bug is publicly disclosed before being fixed?We endeavor in responding to bug reports promptly and fixing them within a reasonable time period. Please notify us in advance before you publicly disclose the bug information. Any bug disclosure without following this principle will not be qualified for a reward.Are vulnerabilities found in outdated software such as Apache or Nginx qualified for a reward?Please identify the vulnerabilities in the software and explain why you suspect they are detrimental to software use. Reports omitting this type of information are usually not qualified for a bounty.Can I request that my name not be listed on Synology’s Security Advisory page?Yes. You can request not to be listed on our Security Advisory page. However, if you are qualified for a reward and wish to accept it, we will still need your contact information to process the payment.Are vulnerabilities still eligible for a reward if they are reported to vulnerability brokers?Privately disclosing a vulnerability to third parties for purposes other than bug fixing is contradictory to the spirit of our program. Therefore, such reports will not be qualified for a reward.Who is qualified for a bounty if the same bug is reported by more than one person?The reward is granted to the first person who discovers a vulnerability that was previously unknown to us.AcknowledgementWe want to give a tip of our hat to security researchers and organizations that have helped us.20242023202220212020201920182017 2024 2023 2022 2021 2020 2019 2018 2017 Khoadha from VCSLab of Viettel Cyber Security ( https://viettelcybersecurity.com/)Tim Coen (https://security-consulting.icu/)Mykola Grymalyuk from RIPEDA ConsultingZhao Runzi (赵润梓)Andrea Maugeri (https://www.linkedin.com/in/andreamaugeri)Offensive Security Research @ Ronin (https://ronin.ae/)Nathan (Yama) https://DontClickThis.runM Tayyab Iqbal (www.alphainferno.com)Only Hack in Cave (tr4ce(Jinho Ju), neko_hat(Dohwan Kim), tw0n3(Han Lee), Hc0wl(GangMin Kim)) (https://github.com/Team-OHiC)Wonbeen Im, STEALIEN (https://stealien.com)赵润梓、李建申（https://lsr00ter.github.io）Cheripally Sathwik (https://www.instagram.com/ethical_hacker_sathwik)Steven Lin (https://x.com/5teven1in)Qian Chen (@cq674350529) from Codesafe Team of Legendsec at QI-ANXIN GroupMohd Ali (revengerali)Orange Tsai (@orange_8361) from DEVCORE Research'''
