full_description = '''Beta program Beta program Compatibility Applied Models FS series: FS6400, FS3600, FS3410, FS3400, FS3017, FS2500, FS2017, FS1018 HD series: HD6500 SA series: SA6400, SA3610, SA3600, SA3410, SA3400D, SA3400, SA3200D 24-series: DS224+, DS124 23-series: RS2423RP+, RS2423+, DS1823xs+, DS923+, DS723+, DS423+, DS423, DS223, DS223j 22-series: RS822RP+, RS822+, RS422+, DS3622xs+, DS2422+, DS1522+, DVA1622 21-series: RS2821RP+, RS2421RP+, RS2421+, RS1221RP+, RS1221+, DS1821+, DS1621+, DVA3221 20-series: RS820RP+, RS820+, DS1520+, DS920+, DS720+, DS620slim, DS420+, DS420j, DS220+, DS220j, DS120j 19-series: RS1219+, RS819, DS2419+II, DS2419+, DS1819+, DS1019+, DS419slim 18-series: RS2818RP+, RS2418RP+, RS2418+, RS818RP+, RS818+, DS1618+, DS918+, DS718+, DS418, DS418play, DS418j, DS218+, DS218, DS218play, DS218j, DS118 17-series: RS217, DS1817+, DS1817, DS1517+, DS1517 16-series: RS2416RP+, RS2416+, RS816, DS916+, DS716+II, DS716+, DS416, DS416play, DS416slim, DS416j, DS216+II, DS216+, DS216, DS216play, DS216j, DS116 Release notes Important Note Updating to Active Insight 3.0.3 will optimize the File Activity database by converting its format, which may take some time and could temporarily affect system performance during the process. This version updates the File Activity statistics to use approximate value calculations, reducing database size and improving I/O performance. (Learn more about File Activity feature) Compatibility & Installation The File Activity feature requires DSM 7.2 or above. What's New The File Activity feature can now be enabled or disabled through the Active Insight web portal. It is disabled by default after updating to this version. Added support for automatic snapshots of WORM-protected shared folders using the File Activity feature. Added support for logging SMB connection records in the Login Activity. Fixed Issues Fixed an issue where temporary files from the File Activity feature might consume excessive system space. Fixed an issue where the File Activity feature's frequent read/write operations might affect system performance. Fixed an issue where the hostname was incorrectly displayed as unknown. Fixed an issue where the ransomware detection function might wrongly flag filenames/extensions as suspicious. Fixed an issue where enabling Active Insight monitoring services could prevent the NAS from entering hibernation. Fixed an issue where Active Insight could cause failures in Hyper Backup system configuration backups. Fixed an issue in Synology High Availability environments where synchronization issues with Active Insight could prevent Log Center from starting. Known Issues & Limitations Snapshot protection feature for File Activity is not available for Surveillance Station recording folders. In Synology High Availability environments, after a switchover or failover, the File Activity feature may become disabled. $(function(){ $('.accordion_container').on('click', '.accordion_title' ,function(){ $(this).toggleClass('slide_up').next('.accordion_content').slideToggle(); $('h1').toggleClass('slide_up', $('.accordion_container .accordion_title.slide_up').length > 0); }).on('click', 'h1 span' ,function(){ var is_slide_up = $(this).parent().hasClass('slide_up'); if(is_slide_up){ $('.accordion_container .note_section_accordion.has_accordion .accordion_title').removeClass('slide_up').next('.accordion_content').slideDown(); }else{ $('.accordion_container .note_section_accordion.has_accordion .accordion_title').addClass('slide_up').next('.accordion_content').slideUp(); } $(this).parent().toggleClass('slide_up', !is_slide_up); }) var divBetaInstallReleaseNote = $('#beta-release-note'); var selectedItem = divBetaInstallReleaseNote.find('.sidebar a:first'); if (location.hash) { var tmp = divBetaInstallReleaseNote.find('.sidebar a[data-target="'+location.hash.substring(1)+'"]'); if (0 < tmp.length) { selectedItem = tmp; } } divBetaInstallReleaseNote.on('click','.sidebar a', function(e) { e.preventDe