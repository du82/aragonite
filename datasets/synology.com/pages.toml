full_description = '''Synology Products Compatibility List Synology has been striving to improve product compatibility to various drives, USB devices and network peripherals. We recommend checking out our compatibility list before purchasing the peripherals you need. Click to learn more about incompatible models or check the change log. Click to learn more about incompatible models. Click to check the change log. Drive compatibility for expansion units may differ from that of their host devices. The drives on this list are intended for use in the expansion unit with the specified Synology system. DOM_VUE.component('hcl-tab', { template: '#hcl-tab_template', props: ['name', 'drive_categories'], data() { var ret = { req_sending: true, ctx: {}, param: {}, table_param: { filter: {}, }, result: {}, result_incompatible: {}, result_change_log: {}, product_storeviewcodes: {}, } if (location.search.length) { p = $.deparam(location.search); if ( p?.search_by == this.name || ( p?.search_by == 'products' && this.name == 'drives' && this.drive_categories.includes(p?.category) ) ) { ret.param.model = p?.model ?? ''; ret.param.category = p?.category ?? ''; ret.param.expansion_unit = p?.expansion_unit ?? ''; ret.table_param.display_brand = p?.display_brand ?? ''; ret.table_param.p = (p?.p && !isNaN(p.p)) ? parseInt(p.p, 10) : 1; ret.table_param.sort_col = p?.sort_col ?? ''; for (var k in p) { if (/^filter_/.test(k)) { var f_key = k.replace(/^filter_/, ''); ret.table_param.filter[f_key] = p[k]; } } if (p?.category == 'hdds') { ret.param.category = 'hdds_no_ssd_trim'; } } } return ret; }, mounted() { this.getContext(); }, activated() { this.resetResults(); }, computed: { selectors() { var ret = []; var pool = this.ctx?.selector; if (pool) { do { ret.push(pool); pool = this.findOpt(pool, this.param[pool.key])?.next; } while (pool?.key) } return ret; }, find_disabled() { return this.selectors.some(x => !this.param?.[x.key]); }, has_incompatbile() { return this.result_incompatible?.list