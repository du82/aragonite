["https://synology.com/company"]
title = "About Us | Synology Inc."
description = "Synology is a dedicated Network Attached Storage (NAS) provider. Founded in 2000, Synology strives to deliver energy-saving storage and backup solution for businesses and individual users."
full_description = '''Data is at the heart of every industry's transformation, and this is where Synology has a profoundly important role to play. At its very core, our mission is to manage and protect the world’s data. Synology uniquely enables every business to manage, secure, and protect their data wherever access is needed from flash to disk to multiple cloud architectures – at the scale needed to accommodate the exponential data growth of the digital world.. Industry leadership Trusted by some of the best and brightest minds in the IT industry with more than thirteen million installations, Synology is committed to transforming the way businesses manage their data – elegantly simple, secure, and reliable. We proudly boast a wide array of solutions backed by cutting-edge innovation and field-proven reliability with a solid track record in meeting the ever-increasing expectations and demands. Your success is our mission With a blend of pioneering expertise and considerable experience, Synology offers tailor-made solutions to customers across industries worldwide. Hear first-hand from our customers about how they seamlessly and securely migrate, scale, and manage their businesses with our solutions. Join our team Founded in 2000, Synology has over thirteen million installations, tens of thousands of channel partners, and six branches across the globe. At Synology, we think big, work smart, and strive to make a difference every single day. Stretch your skills and explore unlimited possibilities together with us. Join us now and bring your talents into play. Synology Headquarters Synology America Synology UK Synology France Synology Shanghai Synology Japan Learn more about Synology News & Reviews Latest news and reviews about Synology products. Careers Find out what it’s like working at Synology! Synology Community Connect with thousands of other Synology enthusiasts around the world! Synology Blog Gain more insights about us from the Synology Blog. Branding Learn more about how to present Synology’s brand. Office Locations Find out our office locations around the world. Contact Us Get help on technical issues and questions. Accessibility We're dedicated to making information accessible to all. $(document).ready(function() { $('.join_flexslider').fadeIn(500); $('.join_flexslider').flexslider({ animation: "fade", slideshowSpeed: 2500, animationSpeed: 3500, controlNav: false, directionNav: false, }); $('.join_flexslider').flexslider("stop"); setTimeout(function(){ $('.join_flexslider').flexslider("play"); }, 2000); SYNO_HELPER.on("resize", { key: "company", element: "#company", trigger: true }, function() { var setSameHeight = $('#feature h2'); setSameHeight.css('min-height','0'); var maxheight = Math.max.apply( null, setSameHeight.map( function () { return $( this ).outerHeight( true ); }).get() ); setSameHeight.css('min-height',maxheight); }); });'''
