title = "SHISEIDO Taiwan | Synology Inc."
description = "Shiseido Taiwan Gains Faster Backups and Smarter Storage Using Synology"
full_description = '''Customer Stories Shiseido Taiwan Gains Faster Backups and Smarter Storage Using Synology 52% Increased storage capacity 15 min VM backup data recovery After tests, we found Active Backup for Business has astonishing backup speeds and works wonders on deleting duplicate data — it only took up 28TB out of the total 58TB on the server. We are quite satisfied with the overall performance. Zhang Jiao-Hao, Manager of Information System Planning Department, SHISEIDO Taiwan The Challenge The need for an effective, user-friendly, and cost-efficient cross-platform backup solution after a ransomware attack Ransomware viruses ran rampant in 2017, and some of SHISEIDO Taiwan's employees' PCs were infected. To protect the company's critical data, Zhang Jiao-Hao, Manager of the Information System Planning Department at SHISEIDO Taiwan, started to look for a cross-platform backup solution. They had adopted several well-known backup software, but it turned out to be costly, ineffective, and user-unfriendly. After learning that Active Backup for Business can centrally back up data on client PCs, virtual machines, and Windows servers to a NAS, and that they can manage all backup tasks on a single console to fulfill cross-platform backup needs without purchasing other backup tools or costly software licenses, SHISEIDO Taiwan joined the beta program for a 3-month trial in June 2018. The Solution Active Backup for Business substantially improves backup efficiency with global deduplication and Changed Block Tracking Whether a small firm or a medium- or large-sized enterprise, client-side backup is no easy task, and SHISEIDO Taiwan is no exception. The daily data changes can reach up to 600GB, especially with over 500 employees at its headquarters. Without proper backup tools, saving daily data alone can be a challenging task. The global deduplication technology in Synology Active Backup for Business supports deduplication across devices, platforms, and versions, reducing the storage space required for backup tasks. Additionally, it supports Changed Block Tracking (CBT), which performs incremental backups for changed blocks only, cutting down on backup data and time. "After tests from our IT team, we found Active Backup for Business has incredible backup speeds and works wonders on deleting duplicate data — it only took up 28TB out of the total 58TB on the server. On the desktop client, after backup tests with 25 PCs and laptops, data was reduced from 6.5TB to 2.1 TB. The overall results were satisfactory. Therefore, SHISEIDO Taiwan plans to purchase high-performance Synology storage devices in 2019 and use Synology Active Backup for Business to form a desktop client backup mechanism for 500 employees at headquarters. When a system crash occurs, employees can perform bare-metal backups using a bootable USB recovery drive or file-level restoration via the intuitive user interface, efficiently shortening maintenance time and putting IT resources to good use. After headquarters adopts Synology’s backup solution, all office PCs and POS terminals in brand counters across Taiwan will gradually embrace it as well," said Zhang. Significantly reducing backup and virtual machine recovery times for 55 virtual hosts As the company grew, SHISEIDO Taiwan used VMware vSphere to create virtual hosts several years ago, cutting maintenance overheads on IT infrastructure while ensuring the stability of its branches, production lines, and order delivery. As the business expands, 55 virtual hosts are now in place. Confined by the ineffectiveness of the original backup tools, it usually took 6-8 hours to complete a backup task among virtual hosts containing databases. After using Synology Active Backup for Business, backup time was greatly shortened, and it only took 15 minutes to recover virtual machine backup data. Zhang said the built-in global deduplication technology is the key, as it speeds up backup time and saves storage capacity. The overall performance was satisfying. Additionally, based on different scenarios, Synology Active Backup for Business supports granular file restoration via the recovery portal, instant and full VM restoration, instant restoration to Synology Virtual Machine Manager (VMM), and instant restoration from a physical server to VMware (P2V), fulfilling the need for every occasion. The biggest advantage of integrating Synology VMM is that enterprises can restore backup data on virtual hosts to Synology storage devices. Supporting various operating systems such as Windows and Linux, Synology VMM provides enterprises with a temporary disaster recovery solution and an upgrade testing environment. The Benefits Reducing the time and space requred for backup tasks by over 50% Synology Active Backup for Business enables cross-platform backup, deletion of duplicate data, and integration of VMM, effectively helping SHISEIDO Taiwan back up data stored in physical and virtual environments. Changed Block Tracking and global deduplication considerably reduce the time and space required for backup tasks by over 50%. A wide array of disaster recovery solutions, including integration with VMM, greatly helps SHISEIDO Taiwan protect its various enterprise workloads. The Customer Established over 60 years ago, SHISEIDO Taiwan is the first overseas office of Shiseido. To meet operational needs, SHISEIDO Taiwan has been using Synology NAS to back up a large number of daily transaction records in the database. Considering stability, speed, and other add-ons that meet the company's internal application needs, SHISEIDO Taiwan has been using Synology storage devices as internal file servers and iSCSI storage servers since 2010. Manufacturing 1000-9999 Taiwan Website Get Started Ask our experts for demos, product recommendations, and deployment advice. Product Inquiries Partners Explore Our Solutions Recommended Models for Businesses Businesses of all sizes looking for a sophisticated storage solution can benefit from high-powered, low-latency Synology NAS. Learn more Data Protection for Synology Systems Comprehensive Synology storage systems backup solutions for with features and options tailored to meet the needs of every scenario. Learn more Ransomware Protection Restore mission-critical data in your entire IT infrastructure, and avoid costly downtime during malicious data deletions and modifications with Synology data protection solutions. Learn more More Stories Synology Empowers Leica Geosystems with Reliable and Scalable Backup Solutions Learn more PT Amerta Indah Otsuka Boosts Backup Efficiency and Secures Entire IT Infrastructure with Synology Learn more UNESCO Centralizes Backup and Virtualization Across 70 Countries with Synology Learn more $(document).ready(function() { var caseCarouselWrapper = document.getElementById('js-carousel-wrapper'); var caseCarouselContainer = document.getElementById('js-carousel-container'); var caseCarouselControl = document.getElementById('js-carousel-control'); var caseItems = document.querySelectorAll('.s-carousel__item-wrapper'); var isDown = false; var startX; var scrollLeft; function scrollTab() { if (document.documentElement.clientWidth >= 1024) { var caseCarouselControlWidth = 0; caseItems.forEach(function (item, index) { caseCarouselControlWidth = caseCarouselControlWidth + item.clientWidth; }); caseCarouselControl.style.width = caseCarouselControlWidth + 'px'; var arrowLeft = document.getElementById('js-carousel-arrow-left'); var arrowRight = document.getElementById('js-carousel-arrow-right'); var scrollWidth = document.getElementById('js-carousel-container').scrollWidth; var offsetWidth = document.getElementById('js-carousel-container').offsetWidth; arrowLeft.classList.add('s-carousel__arrow--disabled'); arrowRight.classList.add('s-carousel__arrow--disabled'); if(scrollWidth > offsetWidth) { arrowLeft.classList.remove('s-carousel__arrow--disabled'); arrowRight.classList.remove('s-carousel__arrow--disabled'); var scro