title = "RAID Calculator | Synology Inc."
description = "Use this interactive tool to estimate the storage space of your Synology NAS when paired with different size hard drives and RAID levels."
full_description = '''RAID Calculator Step 1Select drives Step 2Usage estimate RAID types Results from the Synology RAID Calculator are based on a binary storage calculation, not decimal. Reserved for system Available capacity Protection Unused space Recommended models No results. Notes: Check the Synology Products Compatibility List to see which drives are compatible with your Synology device. The Synology RAID Calculator offers you a storage usage estimate with mixed drive configurations and RAID types. Synology systems require approximately 10 GB of space for use in RAID 1 configurations. The actual drive size will be affected by the system partition and can vary between vendors. The values calculated may differ from your actual results. Please refer to Synology Storage Manager for precise data calculations for storage installed on your Synology NAS. RAID F1 and SHR are only available on selected models. Please refer to the specifications of each model for detailed information. With SHR or SHR-2 as your RAID configuration, Unused space refers to storage capacity which may be usable by expanding the RAID array. With other RAID configurations, Unused space indicates space which will not be used, even if the array is expanded. Synology RAID Calculator results are estimates intended to represent new storage pool capacities. The maximum single volume size supported by Synology NAS varies depending on the CPU architecture and can be: 16 TB, 108 TB, 200 TB or 1 PB. For detailed information about expanding existing storage pools, please read Expand Volumes or Disk Groups by Adding Hard Disks and Expand Volumes or Disk Groups by Replacing Hard Disks. Synology RAID Calculator makes recommendations based on the selected total storage capacity. Some systems may not support certain drive capacities, but will be able to achieve target capacities through alternative drive combinations or when paired with compatible expansion units. Always refer to the HDD/SSD compatibility list