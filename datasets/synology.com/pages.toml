title = "Unilever | Synology Inc."
description = "Through the use of Synology’s products, we have found an excellent solution which eliminates the problems that prevailed with the previous system."
full_description = '''Customer Stories Unilever Enhances Global Surveillance and Security with Synology Solutions Through the use of Synology’s products, we have found an excellent solution which eliminates the problems that prevailed with the previous system. Andrey Dulin, Safety Consultant, Unilever The Challenge Finding a cost-effective, accessible surveillance solution As a strategic measure, the company decided in 2015 to open a new tea factory. Due to earlier negative experiences with the use of DVR video surveillance systems based on "Windows", Unilever carried out a market analysis and compared internal requirements with the current market offer. For the company, the focus was on access from anywhere and around the clock. Additionally, the configuration of the recording and storage as well as data backup were just as important as a good price-performance ratio. The Solution Scalable storage with wide device compatibility After extensive comparisons, the company decided on the advice of its trusted and long-standing supplier, "Office Construction", on the products of Synology in order to ensure compliance with the strict safety standards. Unilever purchased two RS815 + systems with two expansion modules RX415, as well as cameras from Axis (P1405-E, P1425-LE, P3215-V, Q6035-E), on which 17 channels are reproduced simultaneously. It is likely that the number of cameras will continue to increase during the course of the project. The Benefits Versatile, feature-rich surveillance software Unilever received from Synology a solution with an excellent price/performance ratio, which proved to be highly reliable. The planned patrol function, as well as event detection or digital I/O, became one of the most important features. The Surveillance Station also enables an analysis of the video and DSM enables to back up the recordings on an external drive or server. The function to edit created photos and the time line and to play the recordings of several cameras at the same time was indispensable for us. Unilever also plans to use the CMS function in the future to manage multiple reception servers from a single host server. "Through the use of Synology's products, We have found an excellent solution which eliminates the problems that prevailed with the previous system. The differences in picture quality, the response times to events improvement, and the remote viewing ease of use all can be noticed instantly. In addition, we now have the opportunity to increase the storage period of our recordings, and this without any major investments." said Andrey Dulin, Safety Consultant at Unilever. The Customer Unilever is a global company that plays a major role in the global market and has great potential for further growth. Unilever's brand portfolio consists of well-known food products such as "Knorr" or "Lipton," popular personal care and household chemicals, hair care products, and cosmetics, hundreds of beauty recipes such as "Rexona" and "Axe," oral care products, and cleaning and disinfecting agents. Retail 10000+ United Kingdom Website Get Started Ask our experts for demos, product recommendations, and deployment advice. Product Inquiries Partners Explore Our Solutions IT Infrastructure Protection Ensure complete protection, efficient backup, and recovery of your business's digital assets. Learn more Surveillance Station Protect your premises with Synology's intelligent, reliable, and intuitive video management system that runs on Synology NAS and DVA devices. Learn more Surveillance Station IP Camera Compatibility Synology Surveillance Station supports over 8300 IP cameras from 150 reknowned brands. Find compatible cameras today. Learn more More Stories Synology Empowers Leica Geosystems with Reliable and Scalable Backup Solutions Learn more Huda Beauty Replaces Costly Cloud Storage Subscription with Synology Private Cloud Solutions Learn more UNESCO Centralizes Backup and Virtualization Across 70 Countries with Synology Learn more $