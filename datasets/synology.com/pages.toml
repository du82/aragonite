he details of all Synology's subsidiary offices around the world. Office Location Notes: Synology will not provide technical support in the following situations: Issues caused by using third-party RAM, or using drives or PCIe cards not included in the Product Compatibility List. End-of-Life products: Refer to the “DSM Update” column on the Product Support Status page. The product has been disassembled without prior authorization from Synology. Issues caused by using non-genuine Synology products, software, or applications. $(document).ready(function() { setTimeout(function(){ if($(window).outerWidth() >= 1024){ setSameHeight($('#contact_us_tools .contact_box_items .pure-g')); } },500); $('.contact_box').on("click", function() { var offsetTop = ($(window).outerWidth() > 568) ? 105 : 95 ; if(!$(this).hasClass('active')){ $(this).toggleClass("active") .siblings() .removeClass("active"); var show_item = $(this).attr('id'); //if($(window).outerWidth()>=768){ $('.'+show_item).toggleClass("active") .siblings() .removeClass("active"); $('.contact_boxs_mobile').slideUp(); $('.contact_boxs_mobile.'+show_item).slideDown(function(){ if($(window).outerWidth() < 768){ $('body, html').animate({ scrollTop: $(this).offset().top - offsetTop }, 500); } }); } }); $('.contact_box--1').click(); SYNO_HELPER.on("resize", { key: "contact_us", element: "#contact_us", trigger: true }, function() { if($(window).outerWidth() >= 1024){ setSameHeight($('#contact_us_tools .contact_box_items .pure-g')); }else{ $('#contact_us_tools .contact_box_items .pure-g').css('height', 'inherit') } }); function setSameHeight(sameHeightItem){ sameHeightItem.css('height','inherit'); var maxheight = Math.max.apply( null, sameHeightItem.map( function () { return $( this ).outerHeight( true ); }).get()) sameHeightItem.css({'height':maxheight, 'align-content': 'center'}); } function toggleLiveChat(btnLiveChat){ btnLiveChat.on("click", function() { if(typeof(LC_API)!='undefined' && LC_API && typeof(LC_API.agents_are_a