title = "Accessibility | Synology Inc."
description = "The digital world is at its best when it is inclusive for all. At Synology, we recognize this. From the workplace to our website and the solutions we offer, our goal is to extend the benefits of technology to all by creating an inclusive environment."
full_description = "Accessibility The digital world is at its best when it is inclusive for all. At Synology, we recognize this. From the workplace to our website and the solutions we offer, our goal is to extend the benefits of technology to all by creating an inclusive environment. Our commitment We are committed to creating an accessible experience for all on our website. In addition to following best practices as defined by the World Wide Web Consortium's Web Content Accessibility Guidelines (WCAG), we also strive to make our content informative and accurate. Accessible website To foster inclusivity, we make sure that our web pages are accessible to anyone, regardless of the medium or device used. For example, text reflow and mobile-specific navigation make our website easy to browse and read, regardless of the device size or resolution density. We also regularly test our web pages using mainstream accessibility software, facilitating navigation and access to content through alternative means. Clear content We strive to simplify complex technical details into easily understandable instructions. Our teams are dedicated to ensuring that specifications are clearly spelled out and limitations are listed to ensure that as many people as possible can benefit from our products. Equal opportunities Synology is an equal opportunities employer. We do not discriminate based on race, color, religion, national origin, sex, physical or mental disability, or age in our interactions with current or prospective employees or partners. Compliance and feedback Synology strives to adhere to A-level compliance across our website as part of the WCAG 2.1 guidelines. We welcome any suggestions for improvement. Have feedback about accessibility? Contact us $(document).ready(function() { });"
