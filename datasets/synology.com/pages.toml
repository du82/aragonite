["https://synology.com/en-global/company/case_study/holidayinn_riyadh"]
title = "Holiday Inn Riyadh - Meydan, Olaya, and Izdihar | Synology Inc."
description = "We've been very happy with Synology since we adopted its solutions 3 years ago. With Synology in our organization, we don't have to worry about hotel surveillance at all."
full_description = '''Customer Stories Holiday Inn Riyadh Enhances Surveillance Reliability and Scalability with Synology We've been very happy with Synology since we adopted its solutions 3 years ago. With Synology in our organization, we don't have to worry about hotel surveillance at all. Mohammed Hafiz, Group Information Technology Manager, IHG Group The Challenge Poor video quality, stability issues, and security risks Before adopting Synology as their main surveillance system, the three hotels used traditional DVRs with cameras, which could result in low video quality and stability when deployed long distances outdoors under extreme temperatures (up to 50∘C) during summertime. The associated security risks at vehicle entry and exit, as well as for daily walk-in-and-out staff, therefore prompted Holiday Inn to look for a new solution. The Solution Improved stability, flexible camera selection, and centralized management with Synology surveillance solutions To improve the stability of video monitoring, the hotels decided to replace the old DVR system with Synology's surveillance solution, which is easily integrated into the existing IT infrastructure. Compatible with an extensive range of IP cameras, it provides complete flexibility in camera selection during deployment. Currently, 17 Synology RackStations and DiskStations units manage 560 cameras and company data at Holiday Inn Riyadh—Meydan, Izdehar, and Olaya. Surveillance Station Central Management System (CMS) is adopted in all three hotels to manage the recording servers and monitor video streams efficiently. This system allows security personnel to easily manage cameras, live feeds, and recording footage via a single web portal from the host server. In case of a suspicious event or emergency, the recording footage is archived on the servers for 20 days. Synology CMS support can quickly locate it via Timeline Smart Search for future playback, analysis, or exporting purposes. The Customer InterContinental Hotels Group (IHG) is a global company with nine hotel brands and over 4,900 hotels in nearly 100 countries. As part of IHG Group, Holiday Inn Riyadh—Meydan, Izdehar, and Olaya are the best hotels in Riyadh, Saudi Arabia. With over 1,000 employees and over 900 rooms, Meydan, Izdehar, and Olaya are busy with guests all year. (Left: Holiday Inn Olaya, Middle: Holiday Inn Izdehar, Right: Holiday Inn Meydan) Hospitality 100-999 Saudi Arabia Website Get Started Ask our experts for demos, product recommendations, and deployment advice. Product Inquiries Partners Explore Our Solutions IT Infrastructure Protection Ensure complete protection, efficient backup, and recovery of your business's digital assets. Learn more Surveillance Station Protect your premises with Synology's intelligent, reliable, and intuitive video management system that runs on Synology NAS and DVA devices. Learn more Surveillance Station IP Camera Compatibility Synology Surveillance Station supports over 8300 IP cameras from 150 reknowned brands. Find compatible cameras today. Learn more More Stories German School of Madrid Turns to Synology for Centralized Backup and Monitoring Solutions Learn more Tourism Australia Achieves Petabyte Storage with Synology Learn more UNESCO Centralizes Backup and Virtualization Across 70 Countries with Synology Learn more $(document).ready(function() { var caseCarouselWrapper = document.getElementById('js-carousel-wrapper'); var caseCarouselContainer = document.getElementById('js-carousel-container'); var caseCarouselControl = document.getElementById('js-carousel-control'); var caseItems = document.querySelectorAll('.s-carousel__item-wrapper'); var isDown = false; var startX; var scrollLeft; function scrollTab() { if (document.documentElement.clientWidth >= 1024) { var caseCarouselControlWidth = 0; caseItems.forEach(function (item, index) { caseCarouselControlWidth = caseCarouselControlWidth + item.clientWidth; }); caseCarouselControl.style.width = caseCarouselControlWid