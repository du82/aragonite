["https://synology.com/company/case_study/KR_SK_Shipping"]
title = "SK Shipping | Synology Inc."
description = "SK Shipping Achieves 10x Faster Disaster Recovery with Synology Storage Solutions"
full_description = '''Customer Stories SK Shipping Achieves 10x Faster Disaster Recovery with Synology Storage Solutions 10x Faster data recovery 73% Lowered IT resources 90% Storage saved Synology NAS's file server and backup solutions have enabled us to effectively reduce human resources, lower maintenance costs compared to traditional commercial software, speed up backup and recovery times, and achieve true data management simplification, optimization, and automation. Kwak Ho-Dong, Head of IT Planning Team, SK Shipping The Challenge High cost of existing file servers, over-consumption of workforce resources, and unsatisfactory data recovery rates Prior to adopting Synology products, SK Shipping used x86-based file servers to store a large amount of business-sensitive data, with dedicated IT personnel performing management and backup tasks. However, the backup process was cumbersome due to the server limitations, which involved manually backing up tape data after transferring them to the SAN via third-party software. This also meant that if there were equipment failures or unexpected disasters, restoring the tape data would take a long time. Additionally, the annual maintenance cost amounted to a shocking 7 million won (more than $5,000 USD). Work processes were also very complex and lengthy, especially when accessing past sales records. Not only did they have to navigate a complex system to locate the required backup tapes, but restoring the data took a considerable amount of time. Just one of these tasks could take anywhere from 30 minutes to a week, consuming IT resources and delaying the other projects. The Solution Ensuring secure remote backups and uninterrupted services with built-in high-availability and backup features "In an enterprise environment, data storage space is a mission-critical area, so its operations must be reliable, and management and settings must be easy and intuitive. Using this perspective, we considered Synology and other products. We concluded that Synology is like Apple when it comes to NAS, with its stable, easy, and intuitive DSM system making it incomparable to any other NAS product." Mr. Kwak Ho-dong said. SK Shipping currently uses Synology SA3200D as its primary file server. This system caters to over 220 employees, with about 70 of them spread across domestic and overseas branches in Ulsan, Busan, Geoje, Taiwan, Singapore, and the United States. With active-passive dual controller modules and built-in Synology High Availability (SHA) service, SA3200D provides real-time, system-level protection. If a controller module or service becomes unavailable, the system can automatically failover in under a minute, helping minimize system downtime and ensure service continuity. Not only does this allow IT managers to maximize service availability without worry, but the system is highly scalable, accommodating up to 576TB to meet future data storage needs. The Benefits Achieving 10x faster data recovery and 73% lower IT resources and costs SK Shipping has utilized the Hyper Backup feature on the SA3200D to schedule daily automatic backups to a Synology RS819 in their Busan data center. This provides off-site remote backups and replaces the previous tape backup process, resulting in a more efficient allocation of IT resources and significant time and cost savings. Moreover, Synology has greatly simplified SK Shipping's data restoration processes. The Snapshot Replication feature allows SK Shipping's IT planning team to take daily snapshots of shared folders on the SA3200D and store them locally for up to three years. This allows company employees to independently restore data and revert files to any point within the past three years, reducing the workload on the IT department. Actual measurements have shown that their restoration times, previously ranging anywhere from 30 minutes to a week, have been reduced to an average of five minutes, resulting in improved teamwork productivity. Centralizing VM backups, compressing backups by 90%, and saving storage space SK Shipping has replaced its existing virtual machine backup software solution by introducing Active Backup for Business (ABB), Synology's license-free backup package. With this, 14 virtual machines running on HCI are backed up to SA3200D, allowing IT managers to view all VM backup statuses through a single interface. This also includes sending automatic status reports to administrators for recording and tracking. Furthermore, through ABB's advanced global deduplication and incremental backup features, SK Shipping backed up 25 TB of data to virtual machines while only taking up 1.9 TB of storage, reducing storage by nearly 90% and reducing IT costs by 73%. ABB also offers a number of data recovery methods for different scenarios, including file-level, bare-metal, and virtual machine restorations. Virtual machines can be restored instantly to VMware, Hyper-V, or Synology's own hypervisor platform, Virtual Machine Manager (VMM), for quick service recoverability. Physical servers or virtual machines can also be migrated to VMM in the event of unexpected interruptions or in upgrade sandbox environments. SK Shipping effectively utilized this feature when one of their virtual machines' data faced the risk of corruption. They promptly restored the data to Synology VMM, preventing any potential damage to critical operational data. Overall, through the implementation of Synology devices and built-in features like snapshots, off-site backups, and centralized VM backup management, SK Shipping experienced significant time and cost savings while enhancing productivity and ensuring data protection. The Customer Established in 1982, SK Shipping specializes in global resource transportation, primarily that of natural resources such as crude oil, LNG, LPG, coal, and iron ore. With their fleet of Very Large Crude Carrier (VLCC), SK Shipping is capable of supplying 300,000 tons of crude oil on a 45-day voyage, ranking them among the top 10 global companies in this field. Transportation 100-999 Korea Website Get Started Ask our experts for demos, product recommendations, and deployment advice. Product Inquiries Partners Explore Our Solutions Recommended Models for Businesses Businesses of all sizes looking for a sophisticated storage solution can benefit from high-powered, low-latency Synology NAS. Learn more Data Protection for Synology Systems Comprehensive Synology storage systems backup solutions for with features and options tailored to meet the needs of every scenario. Learn more Ransomware Protection Restore mission-critical data in your entire IT infrastructure, and avoid costly downtime during malicious data deletions and modifications with Synology data protection solutions. Learn more More Stories Synology Empowers Leica Geosystems with Reliable and Scalable Backup Solutions Learn more Premium Automobiles Streamlines Surveillance With Synology Surveillance Station Learn more UNESCO Centralizes Backup and Virtualization Across 70 Countries with Synology Learn more $(document).ready(function() { var caseCarouselWrapper = document.getElementById('js-carousel-wrapper'); var caseCarouselContainer = document.getElementById('js-carousel-container'); var caseCarouselControl = document.getElementById('js-carousel-control'); var caseItems = document.querySelectorAll('.s-carousel__item-wrapper'); var isDown = false; var startX; var scrollLeft; function scrollTab() { if (document.documentElement.clientWidth >= 1024) { var caseCarouselControlWidth = 0; caseItems.forEach(function (item, index) { caseCarouselControlWidth = caseCarouselControlWidth + item.clientWidth; }); caseCarouselControl.style.width = caseCarouselControlWidth + 'px'; var arrowLeft = document.getElementById('js-carousel-arrow-left'); var arrowRight = document.getElementById('js-carousel-arrow-right'); var scrollWidth = document.getElementById('js-carousel-container').scrollWidth; var offsetWidth = document.getElementById(