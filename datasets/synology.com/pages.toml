ualization systemsReliability and High AvailabilityActive-active dual controllers work simultaneously to ensure zero downtime in the event of a controller failure while the non-transparent bridge (NTB) enables inter-domain communication to maximize the protection of in-flight data.Active-Active SAN with enterprise-class performanceDesigned for mission-critical environments, UC3400 is a high-availability SAN solution supporting Fibre Channel (FC) and iSCSI protocols. With over 180,000 4K random write IOPS, it supports a wide range of demanding workloads.Random write Random mixed UC3400 features over 199K random write IOPS over Fibre Channel and over 189K random write IOPS over iSCSI. In 4K random mixed workloads, the UC3400 delivers over 455K IOPS over Fibre Channel and over 374K IOPS over iSCSI. Virtualization-readyFull certification for VMware, vSphere, Microsoft Hyper-V, Citrix XenServer, and OpenStack environmentsSupport for Windows Offloaded Data Transfer (ODX), VMware vSphere Storage APIs Array Integration (VAAI), and ALUA ensure optimized and efficient storage operationsOpenStack® Cinder support enables UC3400 to become a block-based storage componentFlexible network optionsBoost network from 10GbE and dual 1GbE RJ-45 ports to 10/25 Gb Ethernet cards or 16 Gb Fibre channel host bus adapters on each controller.Built-in data protection and securityMaximize service uptime for critical services and enhance data security with snapshot protection and self-encrypting drive support in UC3400.Snapshot ReplicationBuilt-in software offers application-aware snapshot protection and instant recovery of virtual machines in iSCSI LUNs in the event of a disaster.Self-encrypting drive supportNative support for self-encrypting drives (SEDs) provide hardware-level encryption for mission-critical and sensitive data at rest.Storage expansionSimple capacity expansion of up to 576 TB of raw storage is available with two Synology RXD1219sas Expansion Units.Performance backed by Synology drivesLeverage high sustained performance and reliability with enterprise-grade drives with built-in protection designed for Synology systems.HDD Enterprise Series 3.5" SAS5-year warrantyAt Synology, we are committed to product innovation and quality. Synology guarantees a robust and reliable data management experience with a 5-year limited warranty, providing responsive technical support and hardware replacement services to maximize your return on investment. Hardware Overview1Power Button and Indicator2High Availability Status Indicator3Alert Indicator4Mute Button5Drive status indicators6Drive trays7Rail Kit Release Tabs8Power Ports9PSU indicators10PSU fans11PCI Express Expansion Slots12Console Ports131GbE RJ-45 Ports1410GbE RJ-45 Ports15Expansion Ports16Reset Buttons17Remove Indicators18Alert Indicators19Status Indicators20Power Indicators $(document).ready(function() { $('.gallery').each(function() { $(this).magnificPopup({ delegate: "a.photo", type: "image", gallery: { enabled: true }, mainClass: 'syno_product_gallery s-product-module-gallery-popup', closeMarkup: '<button title="Close" type="button" class="mfp-close syno_mfp_close">×</button>' }); }); }); Notes:Performance figures are obtained through internal testing by Synology. Actual performance may vary depending on the testing environment, usage, and configuration. See performance charts for more information.For the most up-to-date list of compatible NICs, please check our compatibility listUC3400 supports up to 36 drives with the addition of two Synology RXD1219sas expansion unit, sold separately.Check the compatibility list compatibility list for supported drives.The warranty period starts from the date of purchase as stated on your purchase receipt. Visit https://www.synology.com/company/legal/warranty for more information. $(document).ready(function(){ $('#san__btn-1').click(); $('.san__btn').on('click', function(){ var contentName = $(this).data('content-name'); $(this).addClass('san__btn--active'