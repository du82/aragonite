 solutionDownload DatasheetAccessible and convenientMaintain data availability with an active-passive high availability dual-controller moduleVersatile applicationsManage, distribute, and protect data, back up endpoints, and guard physical premisesFast and efficientOver 3,500/2,900 MB/s seq. read/write throughput and over 500 TB maximum storage capacityBuilt-in High AvailabilityKeep file sharing services, block storage, backups, and other office applications online with automatic minute-level failover. Defend against operational disruptions with two independent and hot-swappable controllers operating in an active-passive configuration.Minute-level automatic failover Real-time workload protection (function () { if (dsygno && dsygno.videoBasic) dsygno.videoBasic('video-minute'); })(); (function () { if (dsygno && dsygno.videoBasic) dsygno.videoBasic('video-real'); })(); Made for demanding environmentsThe SA3400D is engineered to provide outstanding performance in both NAS and SAN storage roles. Its throughput and random I/O performance support efficient SMB and NFS file serving as well as a range of iSCSI and Fibre Channel block storage applications. The SA3400D achieves over 3,500 MB/s read and 2,900 MB/s write speeds with SMB. For iSCSI, it delivers 340,000 IOPS for 4K random reads and 130,000 IOPS for 4K random writes using SSDs. Consolidate your data infrastructureManage, protect, and share data with versatile business solutions. Empower team collaboration, sandbox applications, and provide VM storage on a unified platform.Private cloud managementEfficient and secure folder sharingView, edit, and share data through desktop, mobile, and web-based applications. Enable user access to shared folders over SMB or NFS and leverage Microsoft AD or LDAP integration for efficient user access and permissions management. Learn moreEfficient cross-site file syncingSync or distribute data between servers with Synology Drive ShareSync to provide teams around the world with the latest work files. Or create a global file system spanning C2 Storage cloud storage and multiple Synology systems with Hybrid Share.Learn moreBuilt-in data protectionBack up PCs, servers, SaaS accounts, and VMsConsolidate and automate backup tasks for PCs, servers, VMs, SaaS applications, and more with Active Backup Suite. Manage all backup tasks from a central console and quickly restore specific files, entire devices, virtual services, and employee SaaS accounts to keep your business running. Learn moreCreate off-site backups for shared folders, LUNs, and moreBack up shared folders, LUNs, applications, and configurations from your Synology server onto a secondary server, an external device, or C2 Storage via Hyper Backup. Schedule backup tasks, keep the versions you need with flexible retention policies, and reduce backup sizes with built-in data deduplication. Or minimize lost data with Snapshot Replication, creating point-in-time snapshots at intervals as short as 5 minutes.Business productivity solutionsBoost team productivity with collaborative toolsImprove collaboration in the workplace with Synology productivity solutions. Create, edit, and share documents across teams in real time with Synology Office. Host an on-premises mail server with MailPlus, providing web-based email access while retaining full data ownership. And stay connected via secure one-on-one chats, public channels, encrypted private channels, and group conversations in Synology Chat. Learn moreSandbox and instantly restore critical servicesInstantly restore backed up physical servers and VMs, or test new applications in a contained environment with Synology Virtual Machine Manager — a hypervisor for Windows®, Linux®, and Virtual DSM with built-in snapshots and version rollback functionality. Or host Docker containers on Synology Container Manager and benefit from easy management, automatic update notifications, and Compose support. Learn moreSupports industry-leading virtualization platformsThe SA3400D provides efficient storage for virtualized environments, with full certification for VMware® vSphere™, Citrix® XenServer™, and OpenStack. Synology Storage Console provides direct management from VMware® or Windows platforms, while VMware VAAI and Microsoft ODX support help offload and speed up data transfer operations. Learn moreFlexible options to meet changing needsFlexibly scale storage capacity, optimize I/O performance, and meet different network needs with a range of expansion options.Add storage capacity on demandScale server capacity up to 576 TB when your data storage needs increase by adding two 12-bay RXD1219sas expansion units.Boost network and I/O performanceAdd 10/25GbE connectivity with optional add-in cards. Create all-flash storage volumes with SAS SSD for lightening-fast I/O, or boost IOPS and cut down latency on HDD volumes by creating SAS SSD read/write cache volumes. The SA3400D has a raw capacity of up to 576 TB with expansion units. Up to 576 TB raw capacity The SA3400D can be configured with 25GbE networking. Up to 25GbE networking The SA3400D features up to 218,000 read and 92,000 write speeds when equipped with SSD cache. Up to 218/92K IOPS read/write with SSD cache Performance backed by Synology drivesEngineered to handle intensive workloads, Synology hard drives consistently deliver top-grade performance.HDD Enterprise Series 3.5" SASSynology has you coveredThe SA3400D is backed by Synology's 5-year limited warranty, including technical support and hardware replacement services to maximize your return on investment and ensure continuous, high-quality performance. Learn moreHardware Overview1Power Button and Indicator2High Availability Status Indicator3Alert Indicator4Mute Button5Drive Status Indicators6Drive Trays7Rail Kit Release Tabs8Power Ports9PSU Indicators10PSU Fans11PCI Express Expansion Slots12Console Ports131GbE RJ-45 Ports1410GbE RJ-45 Ports15Expansion Ports16Reset Buttons17Remove Indicators18Alert Indicators19Status 