avaScript.10:30 Wes Bos I hooked up, like, a serial port to it. There's three different, like, motors on it. There's a spinner motor on the side. There's the actual vacuum motor that sucks, and then there's the main brushes underneath that spin. And then also two of those brushes can spin in reverse.10:44 Wes Bos And in order to send the kind of state of of where you want the motors to be on, right, because there's five different things, there's a million different combinations. Scott a million different combinations, but whatever, the permutation of that is.11:02 Wes Bos And in order to send that combination, you send it over in in binary. Right? And I thought I thought it was so hilarious that, like, I have never actually written raw binary or or bits and bytes like that before. Yeah. And and here we are doing it in the same week.11:18 Scott Tolinski It it is funny because I was like, I I mentioned I've been doing quite a bit with this. And at first, I was trying to do everything with the bits and bytes. I was trying to, like, really get into the raw MIDI. I was like, yeah. I'm just gonna use MIDI straight up, and I'm gonna be very, like, content with that. But the more and more I got into actually, playing notes and playing scales and wanting to do, like, more real, audio stuff with it, I I realized, like, oh, man. I I really don't wanna be getting into that. I want what I wanna be doing is just worrying more about the audio stuff. So, actually, I'll I'll share some libraries in a little bit that that help with that sort of thing because there is, like, music based MIDI libraries or somebody's already figured it all out. You can say play this Node, and it will just play rather than having to worry about the binary. But, yeah, I I got into it quite a bit. So, basically, what happens, like, you play a keyboard, it sends a note on that note in the velocity.Topic 4 12:12 WebMIDI.js library decodes raw MIDI into musical concepts 12:12 Scott Tolinski And then the moment you release the key, it sends another message, which is note off. And, if you wanna see this in action, I'll actually, share my screen here if you're watching on video. And for those of you who aren't watching, we we'll just basically tell you a little bit about what's coming in here. So, basically, what I'm doing in this example here is I'm getting access to my MIDI inputs, and then I'm setting a function to the on MIDI message.12:38 Scott Tolinski This message, this function just receives a message. You can see that anytime I hit a key and I know if you're just listening to this, we'll describe it, but you're getting a it's a straight up JavaScript event that gives you some information.12:49 Scott Tolinski Inside of that information, is a data array.12:53 Scott Tolinski It's all kinds of stuff that you have the array buffer here.12:57 Scott Tolinski You have what type it is. It's a MIDI message.13:01 Scott Tolinski You can come in here and see exactly, like, what exactly it's coming in from. So for in"
