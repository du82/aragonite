full_description = "877 February 17th, 2025 × #tailwind#css#webdev Tailwind 4 Discussion of new features and improvements in Tailwind CSS 4 including better performance, CSS variable support, container queries and more modern CSS capabilities. Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 877 or Show Notes Transcript 00:08 New Tailwind 4 features01:07 Faster build times and modern CSS features02:58 First-class CSS variable support05:54 Colors use P3 color space07:50 Config is now CSS08:41 Faster builds with Lightning CSS15:04 Dynamic utilities simplified15:39 Container query support17:07 Support for `:starting` styles18:58 Built-in support for modern CSS features Topic 0 00:00 Transcript 0:01 Wes Bos Welcome to Syntex.0:02 Wes Bos On this Monday episode, we're gonna be talking about Tailwind four.Topic 1 00:08 New Tailwind 4 features 0:08 Wes Bos This thing just dropped, so we're gonna be talking all about what's new, what's changed, why you should care about Tailwind four. But let me tell you what you should also care about, century.io.0:20 Wes Bos It's the perfect place to really ship excellent applications because, let me tell you, there's so many tools within Century for finding either bugs, issues, slowdowns, all that stuff with your site. And there's no better place to do it than Century because through Sentry's UI, you can quickly solve bugs. And there's some really awesome fix it for me AI tools that are coming to Sentry as well. So check it out at century.i0/syntax.0:50 Wes Bos Sign up and get two months for free.0:53 Wes Bos Use the coupon code tasty treat to get those two months, by the way.1:04 Wes Bos Sweet. Wes. Sweet indeed.1:06 Wes Bos Speaking of sweet, let's talk about Tailwind four because this thing just dropped, and there's a number of improvements, quality of life changes.Topic 2 01:07 Faster build times and modern CSS features 1:16 Wes Bos And a lot of these things are are definitely things that I personally am excited to see arrive.1:22 Wes Bos So I guess maybe, like, the big picture view of this is that Tailwind four has a smaller ESLint, it has faster build times, and it has more modern CSS features. And there's some there's some other little things here and there too, but big picture,1:39 Wes Bos that's it. Yeah. I think people who are using Tailwind, they're gonna be excited about different things.1:45 Wes Bos A bunch of people listening are gonna be really excited that the modern CSS has been added. Yes. So things like, CSS layers, container queries, color mix, popover, all of these, like, new CSS things that we've been talking about over the last year or year and a half on this podcast are mostly now available ESLint Tailwind via the ways that they have implemented them. And then other people are gonna be be excited about, like, the the performance improvements. Right? You have a massive application that has, I don't know, 20,000 JSX files, and and you need to scan all of those files to figure out which classes are in there. And, if they're dynamic or computed classes, you gotta be able to to figure all that out. So that improvement is gonna be exciting for a lot of people. And then other people are just gonna be excited about a lot of the new, like, syntax upgrades. You know? Just easier ways to to approach, writing, tail, and things that maybe were a little bit of a struggle previously are now much nicer. So let's get on into it. The first thing we have here is the new config file. Wes, before we do get on into it, what is yourTopic 3 02:58 First-class CSS variable support 2:58 Wes Bos favorite edition here?3:02 Wes Bos So I've been using it for about six months now, and I've been, like, on all the betas and kinda moving up on through it. And the pieces that I have liked the most are the first class support for CSS variables.3:19 Wes Bos Mhmm. Because what I was doing previously is if you set a variable in tailwind three, you set it in, like, a JavaScript file, and then that exposed it via, like, a tailwind variable.3:31 Wes Bos And then, like, I also needed those variables available via, like, regular CSS custom properties because I was using them in, like, calculation, relative color.3:42 Wes Bos I was using them in color mix. I was using them on inline styles. I was passing them to, JavaScript functions. Jeez. Yeah. And I had to, like, write this, like, little layer that would essentially just loop over all of my tailwind variables and then stick them on the root of the document as, like, regular CSS custom properties. And that's no longer needed with with tailwind four because you now simply just define your your settings as CSS custom properties, and they're available to you both via the Tailwind approach, but also available just regular CSS custom properties. So that that's probably the biggest one. I also have been using the container query support quite a bit, which I'm a a big fan of the the syntax and Yeah. Yeah. Kinda how it simplifies a a bit of a a tough4:33 Wes Bos syntax and spec. So probably those two. Nice. Yeah. I you know what? I haven't I don't I don't use Tailwind personally. Mhmm. But one of the things one of the reasons why I don't use it is because there you you do have to step outside of Tailwind for things like container queries. So so for me, I'm I'm pretty stoked to see that that's part of it now.4:52 Wes Bos And I actually did really like the syntax when I looked into, what the new container query syntax for Tailwind actually was. So I'm stoked to see those additions. I didn't know that thing about the CSS variable variables before, but that sounds, like quite a bit of an improvement.5:07 Wes Bos Oh, definitely. Yeah. That was it was always kinda funky. And, also, like, while we're talking about the CSS variables is the syntax for using them is a little bit nicer. So previously, it used to be, like, fill dash square brackets Yarn dash dash the name of it, and this the it was just like like, writing CSS variables in CSS is is is quite enough, you know, and then writing them in line is is pretty tricky. So the new syntax does away with needing to wrap it in dash dot or in writing it in Yarn, and you simply just use dash dash, the name of your CSS variable, and that's good. And then and, also, while we're talking about CSS variables, they also have the ability to use, CSS custom property.Topic 4 05:54 Colors use P3 color space 5:54 Wes Bos What's it called Wes you, like, you register it so that you can use it to animate? Oh, at property.6:00 Wes Bos Yes. At property. And I don't know. Do you do you wanna give a shot of explaining what at property's for? Yeah. At property is basically,6:08 Wes Bos a way to you're defining a variable with more information, such as what type the value JS, is it a number, is it a string, etcetera, and default values, those types of things. The reason why that's important is because if you're strictly defining this as a number, then CSS can interpolate between numbers without having to Wes. Is it a string or number or whatever? And, therefore, like, the biggest, most common use case people say is that it allows for animating gradients, which is something you can't do without it. Yes. Yeah. Animating gradients,6:44 Wes Bos animating a variable that is like a rotation degree. So if you have, like, a a variable that is set to zero degrees and then you you update that variable to, like, 50 degrees, Anything between those two wasn't possible previously because the browser didn't know what that type was. It didn't know that it was a degree value. So now you can register the variable as a degree value or as a as a custom length. Mhmm. And then the browser will know, ah, I understand what that is. I can I can tween between those two things? Yeah. It's it's actually it's part of the, CSS Houdini7:21 Wes Bos API. So, Houdini, something that slowly been making its way into the browser here and there. Mhmm.7:29 Wes Bos So we also have a a new config. I talked about it previously. The the old config was in JavaScript. And if you wanted to define custom variables, you wanted to find some, like, custom utility classes, you always had to, like, duck out and then go into your JavaScript file, which felt a little bit odd. Now you simply your config is CSS.Topic 5 07:50 Config is now CSS 7:50 Wes Bos So in the same spot that you would stick little utility functions that are not part of Tailwind or, maybe custom key frames, things like that, you also stick your Tailwind config. In in there, you can do things like overwrite the colors, add custom colors, change the scaling of of things. Anything you would normally add or overwrite in Tailwind is now done in CSS, which just feels it feels right. You know? It feels how it should be. And you simply just import Tailwind into your CSS,8:21 Wes Bos and you're up and running. There's no JavaScript config that's needed. Yeah. So another big part of this is that it's using something called Tailwind oxide. Oxide is is really using, lightning CSS to simplify how the whole tool chain is working. It also makes it considerably faster.8:40 Wes Bos Lightning CSS is one of those projects that you predicted a little while ago JS going to really take over as far as, CSS parsing, transforming, bundling, minifying, those types of things. It is fast. It is very fast. They even have the benchmark bars to prove it on their website.Topic 6 08:41 Faster builds with Lightning CSS 8:57 Wes Bos But in general, it's just going to simplify the amount of things you need to install, the setup for Tailwind in general, which was also kind of a turn off, for some people, you know, more complicated setup.9:09 Wes Bos So Vercel, also, what is it? Lightning's built in Rust. So, hey. Yep. It's fast. Right?9:15 Wes Bos It works Wes. And there's also, like, a first class Vite plug in now as well. So Yep. If you're just using Vite or you're using any, like, popular frameworks, they just have integration built in with it. You don't have to fuss with the post CSS.9:29 Wes Bos As much as I love post CSS, I can never figure out the, like, 70 different ways to define a post CSS config. You know? Yeah. Like, it's it's almost too flexible, and there's so many different ways to to define things and import things. And and then you don't know if it should be common JS or if you can import it and just so it's nice that it's just tucked away into a,9:50 Wes Bos a nice little v plug in. Yeah. You know what? I've I've been considering writing a this is this is so dumb. But, concerning writing a transform of my own in lightning to do you Node, you can write lightning plug ins pretty easily in terms of, like, custom transforms.10:07 Wes Bos I just have, like, a pnpm envision of, like, a Bos like CSS, syntax that, like, compiles to using modern stuff. Right? So you could use, like, SaaS variables, but it would actually change them into normal CSS variables, that type of thing. Sign? Yeah. But then also, like, mix ins would be pretty trivial to implement.10:25 Wes Bos So you could get, like, some of that stuff just in there without having to, yeah, install a bunch of post CSS plugins. Or seems like something you'll probably regret in Oh. Ten years. That's exactly why I said it's silly. That you invented. Yeah. But Oh, yeah. Hell, yeah. Let's do it.10:41 Wes Bos Yeah. Right. I know. It would be more or Wes, an exercise, not necessarily a, serious project. Yeah.10:48 Wes Bos By default, the colors in Tailwind four are using the,10:52 Wes Bos p three color space? Is it color space? Is that what it's called? Space. Yeah. It's color space. And and, basically, for people who don't know about p three and other color spaces, the amount of colors that our monitor or even browser can display right, before p three, we're kind of in inherently limited.11:09 Wes Bos And once you have p three colors, if your both your browser and the screen support it, those colors will be, just tremendously more vivid, brighter, nicer looking. So if you aren't using p three color, it's really easy to to implement a fallback for p three color. So even if you're not using Tailwind, p three color is something worth learning because the colors really, really pop on it. I although you do have to be careful about the, the browser support. I was doing a demo during one of my talks, and then I the the projector didn't support p three colors. Oh. I was like Shoot. I was like, oh, of course. I should've taken a, e like, I should've realized it's, like, working fine on my computer, right, obviously.11:51 Wes Bos Oh, that's hilarious. I didn't even think about that. But that that makes so much sense that in order to enjoy p three color palettes, you have to have a device that is capable of showing p three color palettes. And and, like, Scott says, that'll give you much more of a wider selection of colors, but then also things like gradients as well are better, vivid, have more of a a color span. How would you describe that?12:19 Wes Bos It's yeah. It's just wider. I don't know. Yeah.12:24 Wes Bos I don't know how color works, but they found some new ones, and now they're in p three. Well, these colors were found they're they warp able to12:33 Wes Bos ones. We have better displays. Yes.12:34 Wes Bos Exactly.12:36 Wes Bos The dynamic utilities and variants, so in tailwind, when you want to do something that is not built into tailwind, use, like, the square brackets. Right? And and that is you can just generate it on demand. So I'll I'll actually use that quite a bit because, like, for example, like, I don't wanna figure out what the REMs are. You know? I just wanna figure out, like, 10 pixels or 20 pixels. So I'll often do, like, padding dash square bracket 10 pixels.13:02 Wes Bos And especially if there's, like, something that's not available inside of the the tailwind defaults, I don't necessarily wanna overwrite the defaults, but I want something that's in between the the options or, CSS grid columns. You know? If there's not a, if you want a specific number of grid columns and it's not available as a utility class, then you use a square bracket. So now a lot more of the dynamic ones don't need that square bracket, Wes you can just say grid columns dash a number, and it will just generate that on the fly for you. And then the same with, like, data attributes. So data attributes is a great way to hold state in HTML. You Node, if something is is on or off or is loading or, is a specific state of a grid, you could you previously would use, like, data dash and then square brackets and say, when this element has a data attribute of loaded, then apply these following styles. Right? Similar to, like, a, a media query or something like that.14:10 Wes Bos So now you can simply just use data dash loaded or data dash whatever data attribute that you want, and it will, again, pick that up, which is is great. Like, the the square bracket syntax look"
