volved in. But before that, I I really had a totally probably a totally random career path, not not one that you would expect would end up in full time open source, which is what I'm what I'm doing now. But but yeah. So I've I've done lots of different things. That's awesome. And you also work on Nitro, which is the,2:56 Wes Bos like, server toolkit. It's part of on JS?Topic 3 02:57 Nitro is a server toolkit originally created for Nuxt that now powers other frameworks 3:00 Guest 1 Exactly. So Nuxt is a is a is a bit like Next. JS, but for Vue. Yeah. So it was released the day after it, back back some Scott time quite a long time ago. It was created by, Sebastian and Alex Chopin. And just by the name, you can tell it's going to be an amazing framework. Right? You feel like, oh, the Chopin brothers have created this. It'll be melodic. It will be be incredible.3:24 Guest 1 They grew up in the Pyrenees, which is where the mountains of the Nuxt logo comes from.3:29 Guest 1 So very, very home home brewed.3:32 Guest 1 And, but we we rewrote it totally from scratch for Nuxt three, and which was, by the way, a very interesting, experience, to do on an open source project. I don't necessarily recommend it, but one of the things that we did was rewrite it for a serverless world, and for for the idea of a non a potentially non node world. So what what what about other runtimes? At the time, really, it was only Cloudflare.3:57 Guest 1 Since then, we've had Bos and Deno and, you know, who knows? In doing that, we rewrote what was originally we called it Nuxt Sigma.4:05 Guest 1 And Nuxt Sigma was our our rethought, Nuxt server.4:10 Guest 1 And then we we this part of the whole process, we we decided, actually, rather than building parts of Nuxt, why don't we go the true open source way and make them small composable reusable packages that can be built on by other people.4:26 Guest 1 I I always think, personally, that it it might take longer if to collaborate and work, with other people to build something, but you always go you always go further. You always build something that's better. And so that's what we've been trying to do with Nitro, which is, originally the server engine for Nuxt, but now, it has a considerably broader scope. It powers tan stack start, solid start, analog, which is an Angular meta framework.4:53 Guest 1 And I I hope it will power others because a lot of us, meta framework authors and even people who are just building their own APIs, we have similar needs. We want to deploy to lots of different providers.5:04 Guest 1 We want to work on different run times.5:07 Guest 1 And rather than reinvent, like, invent these things over and over and over again, it's better to have a a common base where we all pitch in and and, you know, can talk about our goals. So that's Wes Nitro is. It's the brainchild, I should say, of Puya Parsa, who Wes the the previous team lead of of the Nuxt core team, and who who now spends his time focusing on this js GitHub, org you mentioned, which is dedicated to all of these packages that we created to be, part of a broader ecosystem, not just for Nuxt.5:39 Guest 1 And5:40 Scott Tolinski I I hope that's that's that's what they are. Yeah. Yeah. So that answers a lot of my Wes, like, what came first? Was it, like, Nitro that came first and then Nuxt? But it seems like you said it was originally Nuxt, Sigma.5:53 Scott Tolinski And you mentioned on JS being this collective of different compatible packages and and various things. So we have Nitro, which is part of on JS, but how how what's the connection there to Nuxt, or is there a connection?6:09 Guest 1 So I think other than the story of us wanting to take some of the things that we're building that we needed to build Nuxt into a place where they were could be used more broadly. So I could tell you stories about lots of those libraries, but but apart from the origin of many of them, there is no, one to one connection.6:30 Guest 1 A lot of people contr