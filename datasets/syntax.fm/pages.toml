["https://syntax.fm/show/879/fullstack-cloudflare/transcript"]
title = "Transcript: Fullstack Cloudflare - Syntax #879"
description = "Overview of using Cloudflare Workers and associated services to build fullstack applications"
full_description = "879 February 24th, 2025 × #cloudflare#serverless#javascript Fullstack Cloudflare Overview of using Cloudflare Workers and associated services to build fullstack applications Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 879 or Show Notes Transcript 00:38 Cloudflare has products competing with AWS02:10 Overview of products for fullstack devs on Cloudflare03:06 Workers allow running serverless code on Cloudflare04:50 Workers have Node compatibility with some exceptions07:55 Using Cloudflare leads to some vendor lock-in12:11 Durable objects persist data between workers16:41 Workflows allow long running multi-step apps21:04 Queues allow scaling apps with background tasks26:09 Cloudflare provides CDN and object storage29:38 Image transformation pipelines35:23 Cloudflare provides database offerings41:35 Typescale distributes Postgres globally44:02 Vector database allows similarity search47:50 Cloudflare integrates latest AI models49:45 Multiple frameworks integrate Cloudflare Topic 0 00:00 Transcript 0:00 Wes Bos Welcome to Syntax. Today, we have an episode on, we're gonna call it Fullstack CloudFlare, which is big fan of CloudFlare. We've got CJ on today. Scott's not feeling greatest. So CJ's0:12 Guest 1 filling in. And turns out CJ also is a, a big Cloudflare fan. Right, CJ? It's true. Yeah. I mean, I actually didn't use Cloudflare much until last year. Before that, I kind of only knew them as, like, DNS setup. But then last year, I started working with Node and then learned about all the stuff they have, like, key value workers and d one. Yeah. It's crazy. It's kinda crazy. Like, for those who don't know, CloudFlare is aTopic 1 00:38 Cloudflare has products competing with AWS 0:38 Wes Bos I think everybody knows them as the, like, DDoS, DNS protector, but they're really a bit of, like, an AWS competitor, you Node? And they have so many different products to a point where you can pretty much build well, you can build an entire full stack application just on Cloudflare products. And they're kind of unique in that all of their products are slightly different than the norms, but because of the way that they approach things, if you're willing to sort of approach it in a CloudFlare way, you can get huge benefits in terms of of cost. It's it's relatively cheap and, performance as Wes, where you can sometimes just get crazy things up and running with just a couple couple lines of code. I did just get a message from Scott. Scott bumped his head when he was snowboarding, which JS my greatest fear. Yeah.1:34 Wes Bos And, so he's he's not feeling too great right Node, so that's why CJ is filling in.1:39 Guest 1 Yeah.1:40 Wes Bos You know, what is supported with CloudFlare is Sentry.1:44 Wes Bos If you are going to be running code in CloudFlare, you're gonna wanna turn on the Sentry integration, so you'll get some error exception.1:51 Wes Bos You get all the details about what's going on with your your application if there's anything that goes wrong, and you can fix it right away.1:58 Wes Bos Alright. So I thought, like, Cloudflare has bazillions of products, but, like, we're gonna sort of tackle explaining the ones that are, you're a web developer, you wanna build a full stack application.Topic 2 02:10 Overview of products for fullstack devs on Cloudflare 2:10 Wes Bos These are the ones that you should you should know about.2:13 Wes Bos They have several, like, what I'll call primitives, which is like they're sort of like low level product, like a like a worker for running JavaScript code or a stat r two for holding static assets or their their d one for holding a MySQL database or or, sorry, SQLite database. And then they also have several products that are sort of, like, built on top of their primitives, which are like handy little features.2:40 Wes Bos And that's not uncommon. AWS JS kinda has has the same offering in terms of both low level as well as higher level things. So workers, that's the first one. Workers is their JavaScript runtime. It's their their server.2:55 Wes Bos They don't like it when you call it serverless or edge functions, but it's essentially the way that you can run, server code on CloudFlare is you create what's called a worker.Topic 3 03:06 Workers allow running serverless code on Cloudflare 3:06 Wes Bos And the way that it works is it takes in a request that's coming in, performs some operation, and then sends the request out the other end very similar to how a3:17 Guest 1 serverless function would work. It sort of spins up, does its work, and then it will spin down, meaning that it's not like a typical server where it's running all the time. Yeah. And this was interesting for me to, like, wrap my head around once I got used to it. And, really, I got used to it because of Node. Yeah. But the the whole thing is, like, it's literally a JavaScript module that exports a fetch function. That's all it is. And that one fetch function handles every single incoming and outgoing request, which is why something like Hono is useful because it basically gives you the ability to, like, create routes like you're used to in ESLint, instead of having to, like, have a bunch of if statements inside of that, like, just fetch function that you're doing. Yeah. If you if you, like, like, raw dog a CloudFlare worker,3:59 Wes Bos you just get the whole request object, which I'm a big fan of that. It's, like, it's all standardized, right, based on the the fetch API. You if you've or if you've worked with a fetch request in the past, you you probably already know the the thing. But there's no there's no, framework there. Right? There's no router. There's there's nothing. It's simply just you send the data back. You gotta set all the headers yourself, and you probably don't wanna do that. You probably wanna reach for something with a little bit more helpers, which we'll talk about the different things. Hono is probably the the biggest one, but there's all kinds of different ones, including a new one called Orange JS, which is pretty nifty. Yeah. And it supports we'll talk about it, but it supports other frameworks too. Yes. So Cloudflare Workers runs on not on Node. It's a JavaScript runtime environment, but they've built their own, which has v eight as an engine.Topic 4 04:50 Workers have Node compatibility with some exceptions 4:50 Wes Bos So similar to how BUN or Deno is not Node, CloudFlare Workers is also not Node. They do have mostly Node compat at this point.5:02 Wes Bos They went for many years trying to be like same thing with Deno as well. Many years being like, use the standards, and I'm I'm very much about using the standards, but they also packages and stuff just use Node APIs at the end of the day. So they have pretty close to full node compat, with the exception of several things with, like, socket connections. They'll they have their own version of that.5:28 Wes Bos There's no file system access in Cloudflare Workers because there is no file system. So if if you're using that, you Scott think around that.5:37 Guest 1 There's a couple other little gotchas, but not not massive ones. Yeah. I've only come across them a couple of times. One of them was, like, I had some library that was trying to do a DNS lookup, but they don't have that primitive for creating those socket connections.5:51 Wes Bos So, Wes, it's I've only Sanity it a couple of times. It usually won't really hit that. Mhmm. It like, it really depends on, like like, what kind of stuff you're doing. Right? Like, the the socket one is the probably the biggest one is is WebSockets, and they have their own sort of implementation of that. Workers are limited to three megs on the free platform.6:11 Wes Bos So three megs of JavaScript, which is is quite a bit, and then 10 megs on the pro plan, which also is quite a bit. So I'm thinking of I'm working on my website right now, which is the Next. Js website, and I'm trying to get that thing running on CloudFlare Workers.6:28 Wes Bos And that thing is, something like 900 pages, something like, 7,000 import export statements, a pretty large website, I would say. And it's just squeaking under, I think it's about eight megs.6:48 Wes Bos And that, that eight megs is also gzipped, as well. It actually turns out to be about 65 megs, not gzipped. So you can fit a lot of code in workers. And it also doesn't include assets, meaning that if you need an image during your worker, if you have any HTML, any other like static asset that is needed, that's not part of your JavaScript bundle. That's just 10 megs of actual JavaScript running.7:16 Wes Bos And then you can also run multiple workers, which is is not the easiest thing in the world, but you can just split your code up into to multiple,7:24 Guest 1 sort of run times. Yeah. And that might be the architecture that some people choose. Like, essentially, it's, like, microservices. Like, you have multiple little worker functions that if you're hitting that that size limit, just break them down. Each one can do their own thing. Yeah. I Wes, on the point of, like, assets and you and earlier Wes talked about the not being able to access the file system, there are other things and offerings that Cloudflare gives you that kind of Scott of gives you that functionality, which we'll talk about in a second. Yeah. It's it's kinda funny. Like, with everything Cloudflare, it'sTopic 5 07:55 Using Cloudflare leads to some vendor lock-in 7:55 Wes Bos they don't provide x, y, and z, but they have their own version of it, which at some point is great, but also I don't like coding my apps in in just a Cloudflare way. Whenever I'm writing a line of code, I wanna know that I'd be able to to duck out of this thing and and be able to host it anywhere. Yeah. And it's tricky. And I think it's probably the the one downside of all of this is vendor lock in, which you you potentially get with with these other things. And so, like, we'll say that upfront. It's like, once you choose Cloudflare, you're kind of choosing Cloudflare. Yeah. I don't know. That that's true or not. Like, I I'm thinking about all the stuff that I have. Okay. And I don't know that I've ever written well, maybe the durable objects, although there is an open source project right now. I'll try to find the name of it that is is making sort of an an open version of that. So anything I write, I make sure that I'm not too too locked in. Even the database and whatnot, I'll use Drizzle, with just a SQLite adapter.8:51 Wes Bos One kinda interesting thing about workers is you pay for what's called CPU time and not wall time, meaning that Wes your worker starts up and when a when a serverless function starts up, you pay based on the number of seconds that that thing is running. Right? And if you have, like, a fetch request that's going off to OpenAI and and waiting for two seconds to to get a response and then coming back, you're paying for those two seconds. Right? And Vercel actually last week rolled out something similar to this as well where you can sort of use that downtime to handle multiple requests because, like, that's that's an expensive time to to pay for. So with Claflyr workers, you're only paying for compute, meaning that, like, when you're waiting on the network, when you're waiting for a fetch request, when you're waiting for those types of things, it's not counted towards your actual bill. They'll give you 10 it doesn't sound like a Scott. Ten milliseconds of CPU time, and then thirty milliseconds on the on the paid version. So 10 on the free, which doesn't sound like a lot, but I I'm on the paid version, so I have, like, thirty, forty, something like that. And I've not hit it except for once.10:05 Wes Bos And I I had explained that there was actually a bug in the library I was using that was causing too much processing.10:11 Guest 1 Yeah. And they do have queues. So you potentially if you have the long running process, you could push that off to a, like, a queue consumer if you needed to. Oh, yeah. Yeah. You don't have to sit there and wait for it. Yeah. So there Vercel solutions if you're hitting those those those, those limits. Exactly. So CloudFlare also has CloudFlare Pages,10:30 Wes Bos which is sort of like a sibling to CloudFlare workers.10:36 Wes Bos And it was their, like, platform as a service offering, which, like, you could, like, have a Git commit, and it would build and and and deploy HTML.10:45 Wes Bos Most of those features, if not all, are now in Cloudflare Workers. And from the read I get from just looking at the docs and whatever and from the, Next. Js development, because they they have this thing called Next on Pages, which I've used, and now they're putting all their effort into open Next. Js, which is Next. Js on workers. So the read I get from it is they're put trying to put all the pages features into workers, and then eventually, they probably just get rid of pages entirely because I'm assuming that's what is. I don't I don't know. Node don't have any inside hook, but that's kind of the vibe I get for it. So, we'll link up on compatibility matrix, the difference between the two of them. But pretty much you can do everything in a worker.11:32 Guest 1 That was my insight too because because I only started using CloudFlare last year, I think before that, pages, like you were saying, is the thing they were pushing the most and people were using the most. Yeah. But last year, I was really just using workers, and I I went through this matrix and I was like, yeah. I'm just gonna stick with workers. Like, I don't see anything too crazy that I can't just do with workers. So Yeah. I think the and early on, the idea was that if you have server code and front end code,11:57 Wes Bos that's what pages was for. But now that workers has assets, you can serve them all up, and, you can do routing and and all kinds of stuff.12:08 Wes Bos Let's talk about durable objects.12:10 Wes Bos We've mentioned them briefly on the show before, but I have since had a bit more of a chance to play with them. And they're kinda interesting because so the problem with serverless compute in general is that they are short lived, meaning that somebody visits a URL, what will happen is if somebody hasn't visited that URL or or that route in a long time, that that will spin up, meaning it will start. Right? That's that's often referred to as a cold start in the biz.Topic 6 12:11 Durable objects persist data between workers 12:42 Wes Bos And and then that server will run for however long it needs, and often they'll stay warm for five, ten minutes or so.12:51 Wes Bos But once they're done or if you're getting a ton of traffic, multiple versions of that worker or serverless function will spin up. And the problems that you have in in that land versus a traditional server land is that they're not always running, meaning you can't expect them to always be, running "
