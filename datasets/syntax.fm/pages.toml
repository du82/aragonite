full_description = "876 February 12th, 2025 × #web-audio#web-midi#music MIDI & Music in the Browser Discussion of capabilities provided by Web MIDI and Web Audio APIs for generating sound and music in the browser Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 876 or Show Notes Transcript 02:32 Dabbled with Web Audio API a few times before05:53 MIDI is digital communication standard for musical instruments08:35 MIDI messages contain status byte and data bytes12:12 WebMIDI.js library decodes raw MIDI into musical concepts23:40 MIDI used for ringtones due to small file size25:29 Tone.js provides nicer API than low-level Web Audio38:35 Media recorder API allows recording audio in browser Topic 0 00:00 Transcript 0:00 Scott Tolinski Welcome to Syntax. On this episode, we're gonna be talking about the Wes Audio API and the WebMIDI API, what these things are, why they matter, and maybe some interesting things about them that you might not know. Because me, personally, when I think of Wes audio and web MIDI, I'm thinking of maybe playing sounds or, accepting input from MIDI, but you can do a lot with these things. And there's a handful of really great community libraries out there to help you make both music, but also just control things with MIDI messages. So we're gonna be talking in this episode about some really interesting audio technical, concepts such as sampling. We're gonna be talking about MIDI in general, the types of messages that are sent, how it's sent, what it means, how we can interact with that in the browser. And then, ultimately, I'll be showing you some really neat demos of stuff we can do. In fact, my desk Play us in, Scott, will you? Play us in. Okay.0:58 Wes Bos No. Play us in. Play us in. Is that Yeah. Sounds awesome.1:05 Scott Tolinski Okay. I can't hear that, so I don't know what it sounds like in my monitor right now. But I'll I'll be definitely show showing you some of this in just a little bit. I'm building something fun with this, so I thought it'd be a good opportunity to take a time and do an explainer.1:17 Scott Tolinski But, hey, if you're trying out new things in your site, maybe you're pushing it live, and maybe that new thing is broken. Maybe it takes down your site. Maybe you're getting a ton of issues on one specific thing, or perhaps I think that I have covered all the use cases that I thought I should cover in this, and it's not working. So you're gonna want to use software like Sanity at century.i0/syntax, Sanity it two months for free. This software allows you to keep track of all of the errors, bugs, issues, anything that's happening in your site, fix performance issues, find out what went wrong. You even get a session replay so you can see a video of what happened. Let's say the user went to click on a keyboard on a website and it played the wrong note. I could figure that out with Sanity. So check it out at sentry.io.2:04 Scott Tolinski Wes, my man, what's happening today, man? How are you feeling?2:07 Wes Bos Pretty good. Pretty good. Excited to talk about Web Audio. I've dabbled in it, I don't know, three or four times. Yeah. There's this, app called BeBot, which is on the iPhone. I've had it for probably, like, fifteen, Node, fifteen Yarn. And it's generated sound, and it it goes up and down the scales. And I don't really know a whole lot about music and how all of that works, so I I went and built that at one point. Oh, did you? Cool.2:31 Wes Bos Each small CSS and JavaScript, and it was kind of a fun learning experience.Topic 1 02:32 Dabbled with Web Audio API a few times before 2:35 Scott Tolinski Yeah. So what that on Bebop, I believe it's the vertical if you're holding it sideways, the vertical is the pitch or it's the the the tone or something. One of them is the pitch and one of them the tone. It's kind of like a a theremin in in in an axis of of how you're doing that. Yeah. I have a lot of experience