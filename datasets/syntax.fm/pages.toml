full_description = '''136 April 17th, 2019 × 9 Ways to Stay Sane While Working Remotely Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 136 or Show Notes Transcript In this episode of Syntax, Scott and Wes talk about working remotely — problems, challenges, and how to keep yourself sane, productive and efficient. LogRocket - Sponsor LogRocket lets you replay what users do on your site, helping you reproduce bugs and fix issues faster. It's an exception tracker, a session re-player and a performance monitor. Get 14 days free at https://logrocket.com/syntax. Freshbooks - Sponsor Get a 30 day free trial of Freshbooks at freshbooks.com/syntax and put SYNTAX in the "How did you hear about us?" section. Show Notes 4:34 - Find your spots Coffee shops Cafes Library 7:40 - Deal with Distractions Log out of Twitter/Facebook/Instagram Delete Apps — only use the browser Put phone and computer on "do not disturb" Focus App 11:33 - Prioritize your tasks Drifting is possible when it isn't clear what you need to do If you don't have someone telling you what to do, it can be hard to get started Todo lists 17:15 - Make time to be social Go to meet ups Chat in Slack or Discord rooms Talk to people at work spaces 21:48 - Get fresh air Go for a walk Open the windows 24:03 - Get moving Hit the gym Do push-ups in your office 28:09 - Have a separate work space Designated office Don't work from the couch with the TV on Clean your damn office 😂 38:16 - Act like you are going to work Dress well Fix up, look sharp - get yourself ready to go 40:44 - Take Breaks (not too many, not too long) Some people like the Pomodoro Technique Take a lunch break away from your computer Don't make a break longer than 15 minutes or so Links Focus Discord Todoist Getting Things Done Eat That Frog The Life-Changing Magic of Tidying Up: The Japanese Art of Decluttering and Organizing ××× SIIIIICK ××× PIIIICKS ××× Scott: Doug DeMuro's Yo