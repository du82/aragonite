["https://syntax.fm/102"]
title = "Potluck - Typescript × E-commerce platforms × Job-hopping × Working for agencies × more - Syntax #102"
full_description = '''102 December 19th, 2018 × Potluck - Typescript × E-commerce platforms × Job-hopping × Working for agencies × more Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 102 or Show Notes Transcript It's another potluck episode in which Wes and Scott answer your questions! This month - thoughts on Typescript, e-commerce platforms vs custom, working for agencies, job-hopping and more! Freshbooks - Sponsor Get a 30 day free trial of Freshbooks at freshbooks.com/syntax and put SYNTAX in the "How did you hear about us?" section. Vue.js In Action - Sponsor Vue.js in Action from Manning Publications is a great way to learn Vue.js. If you're looking for a book that will teach you Vue.js from start to finish, this is the one. As a Syntax listener, you can get 40% off all their books and courses by visiting deals.manning.com/webdev and using the coupon code syntax40 at checkout. Show Notes 1:20 How do you distinguish between normal and virtual pixels on high dpi devices. How do you call Pixels? Which tools do you use for optimizing Images? 5:02 What are your thoughts on TypeScript (and selfishly, I'd like to learn about using it with React)? Any temptation to try it out if you're not already doing so? Why or why not? Any resources you'd like to share on TypeScript? 8:35 I have heard you guys say good things about Digital Ocean before, but am reading a lot of bad reviews about them on various websites. Are these just frustrated developers or is there any merit to these claims? 12:48 If you were to build an eCommerce store, given that your business requirements specify that custom functionality is needed, would it be smart to roll your own solution or use Magento/Shopify/Woocommerce? If the later, what is the developer experience like? Which has the greater ability to implement custom functionality for server and client side code? 19:50 I feel like I’m pretty "bos" at starting projects but so terrible at finishing them. As people who finish courses and projects all the time, what is your advice for getting to that finish line? 23:32 Could you please explain how you organize your files? What is the folder structure you use for both your projects and other documents/videos and stuff? 31:38 You guys mention working for "agencies" in the past. As a freelance web developer, what's the best way to find these agencies, and to be employed by them? Also, can you explain what "agencies" are? 38:14 I once read an interview Wes gave in which he mentioned that frequently changing jobs is the best way to get salary increases. Do you both believe that to be true? Is job-hopping a bad thing? Is the criticism of it justified? 41:53 If I choose to use Next.js, does that mean I won’t be able to use new React features like hooks and suspense until/if the Next.js team implements those? 43:12 When do you use <React.Fragment> and when do you use <div> to wrap your many returned components from render()? Links Devon Govett tweet about Typescript Digital Ocean Magento Shopify WooCommerce Reaction Commerce Snipcart Next.js Gatsby.js True Grit Texture Supply ××× SIIIIICK ××× PIIIICKS ××× Scott: Undertale Wes: Ghostly Pixels Shameless Plugs Scott's Level Up Pro Wes' YouTube Channel Tweet us your tasty treats! Scott's Instagram LevelUpTutorials Instagram Wes' Instagram Wes' Twitter Wes' Facebook Scott's Twitter Make sure to include @SyntaxFM in your tweets ← Prev #101 Hasty Treat - Where are they now?! Gulp, Grunt, Bower, Backbone and Compass Next #103 → Hasty Treat - Where are they now? Part 2 15% off your swag order Subscribe to the SyntaxSnack Pack Newsletter Email Subscribe Share × Start at timestamp: Embed Link X Facebook LinkedIn'''
