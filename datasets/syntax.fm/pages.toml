he dim where I put it and how big the color square got, I had, like, a three d, dimensions of being able to tweak both the the audio, the quality, the timbre, all that sort of stuff. So I was able to make noises with my webcam just like that. So long story short, I've been I've been experimenting with just tech and music, the intersection, for a long time. And and, actually, since getting into web stuff, a lot of that kind of fell off for me for no reason in particular. I don't I just became less interested. But more recently, I've been getting back into some of this stuff, and the Wes Audio APIs that ESLint are really fantastic for a number of reasons.5:21 Scott Tolinski I had used the Web Audio API to do audio synthesis. I've done media recorder.5:26 Scott Tolinski I've done kind of, like, things here and there, but I haven't really dove into it until, somewhat recently here. So we can start off first and foremost. Let's talk about the WebMIDI API because I think the WebMIDI API is is fairly underrated amongst folks. In fact, even people who know what MIDI is and understand MIDI might not understand what you can do with MIDI in the browser. So first and foremost, MIDI stands for music instrument digital interface.Topic 2 05:53 MIDI is digital communication standard for musical instruments 5:54 Scott Tolinski It's the way that electronic music instruments can, interface with devices, computers, those types of things.6:02 Scott Tolinski And when you have a MIDI device, it is sending messages.6:07 Scott Tolinski It's sending messages to whatever the device is and the device, the digital audio workstation, you know, you have Logic, Ableton, those types of things Yeah. Receive those MIDI messages.6:18 Scott Tolinski And those MIDI messages, unlike Node audio form, like, when you send a waveform, that is Yeah. Audio.6:25 Scott Tolinski When you send a MIDI message, it's just data. It and it's not even data of how it sounds.6:32 Scott Tolinski It's a few messages. And, typically, those messages will look like, play this note, play it at this velocity, and Scott, or, you know, note on this note, this velocity.6:46 Wes Bos So it's just a description of the notes6:50 Scott Tolinski and how long and and how high they should play them. Right? Correct. And there's all kinds of things that people can use MIDI for beyond notes. Like, I have a MIDI keyboard here. And Yeah. You can do, like, pitch bend and modulation, which is which is little touchpads.7:06 Scott Tolinski Those are all sent via MIDI. Or, even, like, being able to change volume with these knobs, that that message is sent via MIDI as well. But MIDI can send you know, it's more than just, like, you think about, like, a key press on your keyboard.7:19 Scott Tolinski You you get the on and off, but you don't get velocity. You know? You don't get how hard you pushed it, which that's a lot of interesting information. Right?7:29 Wes Bos Yeah. Because BetterTouchTool, like the keyboard shortcut and everything tool that I use, they have full support for a MIDI controller. And I always thought, like, oh, that's kinda interesting. People are hooking up keyboard shortcuts to their piano.7:44 Wes Bos And it it makes a lot of sense because you can you can store a lot more information in a7:50 Scott Tolinski a MIDI payload, I guess it's called. You're gonna go into it's three bytes. Right? Yes. So most MIDI messages in the typical sense you're playing a keyboard are three bytes. It it can also be two or one depending. It can be more than that, I've heard. I don't really, if you're, like, a midi expert out there, in general, when you're working especially with, like, a keyboard, it's gonna be three bytes. The status byte is eight bits, and then the data bits our data bytes are seven bits each. So the first message, the first number that comes in is an eight bit byte of the status. That status typically means if you break it down into actual binary, the first digit is telling MIDI that it's a