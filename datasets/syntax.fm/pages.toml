["https://syntax.fm/140"]
title = "Potluck - Media Queries × NPM Vulnerabilities × Fullstack JS vs JAMstack × Web VR/AR × Switching Jobs × More! - Syntax #140"
full_description = '''140 May 1st, 2019 × Potluck - Media Queries × NPM Vulnerabilities × Fullstack JS vs JAMstack × Web VR/AR × Switching Jobs × More! Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 140 or Show Notes Transcript It's another potluck episode in which Wes and Scott answer your questions! This month - Media Queries, NPM Vulnerabilities, Web VR and AR, Fullstack JS vs JAMstack for freelancers, switching jobs, and more! Sentry - Sponsor If you want to know what's happening with your errors, track them with Sentry. Sentry is open-source error tracking that helps developers monitor and fix crashes in real time. Cut your time on error resolution from five hours to five minutes. It works with any language and integrates with dozens of other services. Syntax listeners can get two months for free by visiting Sentry.io and using the coupon code "tastytreat". Freshbooks - Sponsor Get a 30 day free trial of Freshbooks at freshbooks.com/syntax and put SYNTAX in the "How did you hear about us?" section. Show Notes 2:46 Q: I recently started a static site so I want as much of the site as possible to change layout with just CSS for responsive design. I am comfortable with media queries but find often times the design is very different between sizes. It is easy to tame the complexity of repeated data for the different component views keeping everything in sync but is it good practice to put two completely different component level views in a single HTML file? Does the repeated data in the static HTML have any effect on SEO? 7:08 Q: How should a mid developer know when its time to leave the current company? Is tech stack (e.g frameworkless) a decent reason even though he/she is happy at the place, but feels like they are not growing enough? 11:19 Q: Should I worry about the critical vulnerabilities when installing an NPM package? 14:40 I specifically use an external NPM package called npm-check-updates and then I just run ncu... 15:06 Q: I've had the idea for styling one site two different ways (professional/artistic) and giving visitors a button to toggle between the two. Too gimmicky? Secondary: how did you pick your brand colors? 20:19 Q: Any SICK TIPS on career change? I'm a full-time employee with two kids and a lovely wife, who wants a fulfilling career. I throw as much time in as I can to study, but I feel like it isn't enough to apply for jobs. 24:01 Q: Within the next two years, how well do you think WebVR and WebXR technologies would fit within mainstream web development (think A-Frame, SparkAR, React 360 in normal websites and applications)? 30:39 Q: Should I learn Fullstack JS or JAMstack for freelancing? 35:34 Q: Is front-end development dying? 37:30 Q: How do you deal with CSS-in-JS when you have one-off stuff, or coupled components/selectors like a [CSS] grid container and a grid child (think grid-area)? CSS-in-JS feels very verbose for this use case. 42:07 Q: Scott always talks about Meteor. I thinks its really cool too. What's the future of it and why didn't it take off? It seems to have slowed down. They seem to have moved on to other projects like GraphQL stuff. Links Influx WebVR WebXR Google Maps will use a core Waze feature to improve public transit ××× SIIIIICK ××× PIIIICKS ××× Scott: The Making of a Manager Wes: DeWalt Oscillating Tool Shameless Plugs Wes: Wes' Courses — use coupon code "syntax" at checkout and get and extra $10 off. Scott: Animating React Tweet us your tasty treats! Scott's Instagram LevelUpTutorials Instagram Wes' Instagram Wes' Twitter Wes' Facebook Scott's Twitter Make sure to include @SyntaxFM in your tweets ← Prev #139 Hasty Treat - AMA - Money x Investments x Online Presence x More! Next #141 → Hasty Treat - Async + Await Error Handling Strategies 15% off your swag order Subscribe to the SyntaxSnack Pack Newsletter Email Subscribe Share × Start at timestamp: Embed Link X Facebook LinkedIn'''
