title = "Privacy Policy - Syntax"
description = "Full Stack Web Developers Wes Bos and Scott Tolinski dive deep into web development, CSS, JavaScript, Frameworks, Typescript, Servers and more. Listen in 3 times a week!"
full_description = '''Privacy Policy Last updated: 10/30/2023 This Privacy Policy sets out how Syntax, operated by Functional Software, Inc. dba Sentry, collects, discloses, and uses personal information about you and how you can exercise your privacy rights. This Privacy Policy applies to personal information that we collect when you visit our website at syntax.fm ("Site", access or interact with our podcasts or other content ("Content", visit or make a purchase from our branded merchandise store at https://sentry.shop/ ("Store", or communicate or otherwise interact with us (collectively, the "Service". If you do not agree with this policy, please do not access or use our Service. We recommend that you read this Privacy Policy in full to ensure you are fully informed. However, if you only want to access a particular section of this Privacy Policy, then you can click on the relevant link below to jump to that section. Table of contents What personal information does Syntax collect? What does Syntax use my personal information for? Who does Syntax disclose my personal information to? Cookies and similar tracking technology How does Syntax keep my personal information secure? International Data Transfers Data retention Your data protection rights Children's privacy User generated content Third-party websites Updates to this Privacy Policy How to contact us Supplemental notice for EU or UK individuals Supplemental notice for California residents Supplemental notice for other US states 1. What personal information does Syntax collect? The personal information that we may collect about you broadly falls into the following categories: Information that you provide We collect information about you when you input it into our Service or otherwise provide it directly to us. Account and profile creation We collect information about you when you register for an account, create or modify your profile, and set preferences for the Service. For example, you may provide your contact information, including your first and last name, email address, and password when you register for the Service. You may also have the option of adding an avatar to your profile to be displayed in the Service. We keep track of your preferences when you select settings within the Service, including settings for displaying Content. **Sign in via other platforms ** Instead of creating a user account, you can log in via your account with other platforms. We will not collect the password that you use for the relevant platform, but we may collect details from your account with the platform, such as username, email address, and avatar (to be displayed in the Service). Requests and inquiries You may choose to provide us with information when you contact us about our Service or otherwise interact with us. For example, you may choose to submit feedback on our Content. You may submit your contact information to receive newsletters or marketing communications from us or to make an inquiry through our Service. You may also provide content to us when you participate in a survey, contest, promotion, sweepstake, activity, or event, including via social media and other content platforms. Orders If you make a purchase at our Store, we will collect order information, such as the products that you purchase, billing and shipping address, and payment information. Please note that any payment information you provide is sent directly to a third-party payment processor. We have no access to and do not store your payment information. Information that we collect from your device and usage We collect certain information about your device and how you and your device interact with us and our Service. In some countries, including countries in the European Economic Area and the United Kingdom, this information may be considered personal data under applicable data protection laws. Specifically, the information we collect will include information such as your IP address, device type, unique device identification numbers, browser-type, general location information (such as inferred from an IP address), and referring URL. We also collect information about how you and your device have interacted with our Service or with us via email, including the pages and Content you accessed, products you viewed and purchased, links you clicked, and when you accessed and for how long. Some of this information is collected using cookies and similar tracking technology, as explained further under the heading "Cookies and similar tracking technology" below. Information that we obtain from third party sources From time to time, we receive personal information about you from third-party sources, including from vendors and service providers who may collect information on our behalf, such as companies who support our Store (e.g., our e-commerce platform provider, payment processors, and fulfillment services provider). The types of information we obtain from third parties may include name and email address. We may combine this information with information we collect through other means described above. This helps us to maintain and improve the accuracy of our records, identify new users, deliver personalized communications, and suggest Content and other products and services that may be of interest to you. Return to top 2. What does Syntax use my personal information for? We use your information for business and commercial purposes, such as to: Provide, maintain, and improve our Service, including process your payments and fulfill your orders; Manage your account and send you related information, including notifications and confirmations related to your account, purchases, returns, exchanges, or other transactions; Respond to your comments, questions, and requests, and provide support services; Communicate with you about Content and other products and services, and news and information we think may be of interest to you; Monitor and analyse trends, usage, and activities in connection with the Service and our communications to you; Detect, investigate, and prevent fraudulent transactions and other illegal activities, protect the rights and property of Syntax and others, and comply with legal requirements; Personalize and improve the Service and provide Content and features that match your profile and interests, and remember information about your preferences for the Service; Administer surveys, contests, promotions, sweepstakes, and other activities; and Carry out any other purpose for which the information was collected. We may aggregate or de-identify information collected through the Service. We may use aggregated or de-identified data for any purpose, including without limitation for research and marketing purposes, and may also disclose such data to any third parties, including without limitation, advertisers, promotional partners, and others. Return to top 3. Who does Syntax disclose my personal information to? We disclose your personal information to the following categories of recipients: Affiliate companies who help operate and improve our Service (including to support the delivery of, provide functionality on, or help to enhance the security of our Service), offer other Syntax affiliated services to you, or who otherwise process personal information for the purposes described in this policy. The protections of this policy apply to the information we disclose in these circumstances. Third-party service providers who provide hosting, support, payment processing, billing, order fulfillment, communication, analytics, analysis, and other services to us, which may require them to access or use information about you. If a service provider needs to access or use information about you to perform services on our behalf, they do so under appropriate security and confidentiality procedures designed to protect your information. Third-party business partners when you choose to use their accelerated checkout options for purchases at our Store, including Shopify Shop Pay ("Third-Party Checkout Services". By doing so you consent to Syntax disclosing your account and applicable order information with the business partner. Please note that when you use Third-Party Checkout Services, your use will be governed by their own terms and privacy policies. Any competent law enforcement body, regulatory, government agency, court, or other third party where we believe disclosure is necessary (i) as a matter of applicable law or regulation, (ii) to exercise, establish, or defend our legal rights, or (iii) to protect your vital interests or those of any other person. An actual or potential buyer (and its agents and advisers) in connection with any actual or** **proposed purchase, merger, or acquisition of any part of our business, provided that we inform the buyer it must use your personal information only for the purposes disclosed in this policy. Any other person with your consent to the disclosure. Return to top 4. Cookies and similar tracking technology We use cookies and similar tracking technology (collectively, "Cookies" to collect and use personal information about you, including to power and improve our Service, understand and save your preferences, and to compile aggregate data about Service interaction. This includes Cookies that we use to power our Store with Shopify, our e-commerce platform provider ("Shopify Cookies"). For specific information about Shopify Cookies, see Shopify's Cookie Policy. Cookies may be associated with de-identified data linked to or derived from data you voluntarily have submitted to us (e.g., your email address) that we may share with a service provider in hashed, non-human-readable form. You may refuse to accept Cookies by activating the setting on your browser that allows you to refuse the setting of Cookies and choosing not to opt into Cookies via the banner displayed upon your first visit to our Store. You can find information on popular browsers and how to adjust your Cookie preferences at the browser provider's websites. You can choose to disable Cookies, but if you do, your ability to use or access certain parts of our Service may be affected. We do not recognize or respond to browser-initiated Do Not Track signals. Return to top 5. How does Syntax keep my personal information secure? We use appropriate technical and organizational measures to protect the personal information that we collect and process about you. The measures we use are designed to provide a level of security appropriate to the risk of processing your personal information. However, no security system is impenetrable and due to the inherent nature of the Internet, we cannot guarantee that information, during transmission through the Internet or while stored on our systems or otherwise in our care, is absolutely safe from intrusion by others. In particular, email sent to or from Syntax may not be secure, and you should therefore take special care in deciding what information you send to us via email. Return to top 6. International data transfers In some cases, your personal information is transferred to, and processed in, countries other than the country in which you are a resident. These countries may have data protection laws that are different from the laws of your country (and, in some cases, may not be as protective). Specifically, our Service is hosted in the United States, and our affiliate companies and third-party service providers operate around the world, including in the United States, Canada, and the EU. This means that when we collect your personal information, we may process it in any of these countries. Where we transfer your personal information to countries and territories outside of the EU or UK, which have been formally recognised as providing an adequate level of protection for personal information, we rely on the relevant "adequacy decisions"from the European Commission and "adequacy regulations"from the Secretary of State in the United Kingdom. Where the transfer is not subject to an adequacy decision or regulations, we have taken appropriate safeguards to require that your personal information will remain protected in accordance with this policy. The safeguards we use are the European Commission-approved standard contractual clauses, the UK International Data Transfer Agreement, and other appropriate legal mechanisms. This is how transfers of personal information between our group companies and with our third-party service providers will be safeguarded. Data Privacy Framework Notice Functional Software, Inc. (our registered company name) participates in and complies with the EU-U.S. Data Privacy Framework regarding the collection, use, and retention of personal information about you that is transferred from the European Union to the U.S. We have self-certified our commitment to adhere to the Data Privacy Framework Principles for all information about you that is received from the European Union in reliance on the EU-U.S. Data Privacy Framework. As required under the EU-U.S. Data Privacy Framework, when we receive information under the EU-U.S.Data Privacy Framework and then transfer it to a third party acting as an agent on our behalf, we have certain liability under the EU-U.S. Data Privacy Framework if the agent processes the information in a manner inconsistent with the EU-U.S. Data Privacy Framework and we are responsible for the event giving rise to the damage. We may be required to disclose information about you under the EU-U.S. Data Privacy Framework in response to lawful requests by public authorities, including to meet national security or law enforcement requirements. To learn more about the EU-U.S. Data Privacy Framework program, and to view Sentry’s certification, please see the Data Privacy Framework website. We encourage you to contact us as provided below should you have an EU-U.S. Data Privacy Framework-related (or general privacy-related) complaint. We have further committed to cooperate and comply with the panel of the European data protection authorities (DPAs) as our independent recourse mechanism in the resolution of your EU-U.S. Data Privacy Framework complaint. For unresolved complaints, you may also contact your local data protection authority. Contact details for data protection authorities in the European Union are available here. Under certain conditions, more fully described on the Data Privacy Framework website, including when other dispute resolution procedures have been exhausted, you may invoke binding arbitration. We are subject to the investigatory and enforcement powers of the U.S. Federal Trade Commission (FTC). Return to top 7. Data retention We retain the personal information we collect from you where we have an ongoing legitimate business need to do so (e.g., to provide you with a service you have requested or to comply with applicable legal, tax, or accounting requirements). In certain circumstances, we will need to keep your information for legal reasons after our relationship '''
