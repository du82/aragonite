["https://syntax.fm/show/873/standard-schema-the-universal-javascript-data-interface/transcript"]
title = "Transcript: Standard Schema: The Universal JavaScript Data Interface - Syntax #873"
description = "Discussion of the new standard schema effort to standardize data validation across JavaScript validation libraries like Zod, ValleyBot and Arctype."
full_description = "873 February 3rd, 2025 × #javascript#data#validation Standard Schema: The Universal JavaScript Data Interface Discussion of the new standard schema effort to standardize data validation across JavaScript validation libraries like Zod, ValleyBot and Arctype. Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 873 or Show Notes Transcript 00:29 Authors created standard schema to standardize data validation02:01 Validate data to catch errors when data changes unexpectedly03:05 Standard schema doesn't replace existing libraries, it standardizes validation05:52 Standard schema standardizes validate method inputs and outputs08:46 Standard schema avoids need for numerous library-to-library adapters10:45 Libraries handle errors, standard schema just validates Topic 0 00:00 Transcript 0:00 Wes Bos Welcome to Syntax. Today, we're talking about standard schema. Schema, that's a word I'm gonna say wrong the whole episode, so buckle on up. This is a a new effort from the devs, Fabian Hiller. He's behind ValleyBot. That's a JavaScript validation library.0:16 Wes Bos David Blass, he's behind a a relatively new validation library called Arctype. And Colin McDonnell, we've had him on the the podcast as well. He is the creator of Zod, tRPC.Topic 1 00:29 Authors created standard schema to standardize data validation 0:29 Wes Bos Basically, all of these validation library authors sort of got together and put together this thing called a standard schema. And today, we're going to explain to you why and what that is, and why this is good for you as the end developer.0:45 Wes Bos My name is Wes, developer from Canada. With me JS always is Scott. How are you doing today, Scott?0:50 Scott Tolinski Doing good. Just got back from mountain. I went skimming.0:53 Scott Tolinski I went I went to the mountain to go skiing. I actually did. Skimming?0:56 Wes Bos Yeah.0:57 Scott Tolinski Yeah. No. I'm doing good, man. Just hanging out, doing doing, some creative coding and having fun. I I'm excited to learn about this stuff a little bit because I guess what I don't understand about this whole thing is why. I mean, I get that having a a common interface amongst these libraries is is great if that's what this means. But in the same regard, then, like, why not1:16 Wes Bos just collaborate on those the library itself? Yeah. Yeah. Yeah. Why not make that a a standard library?1:23 Scott Tolinski Yeah. But a large part about what these libraries are doing is oftentimes with data validation.1:29 Scott Tolinski Data validation, one of those big things that, like, hey. If you're not, validating or parsing your data correctly, you might get some errors in your code. Those errors, you might not know about them. And unless they pop up in your your Century dashboard because you're seeing some something of property is undefined, and then all of a sudden your users are having a bad time because maybe your data wasn't being validated correctly, and you didn't know it was in there. So tell you. Let me let me interrupt your your ad. Tell me. I got a Yes. Perfect. Example for this. So somebody asked2:00 Wes Bos the other day, how do you maintain that? Like, you're if you're scraping data from a website, like, what do you do when that that changes? You know? Or if you're pulling data back from an AI, it's returning to you JSON, you have to still validate that that data looks like what you're expecting. And and what happens when it doesn't look that way? What happens when the website you're scraping changes? Well, catch that error and then send that data off to Sentry, and you get alerts right away when that data is not looking like what you're expecting.Topic 2 02:01 Validate data to catch errors when data changes unexpectedly 2:31 Scott Tolinski Yeah. That's important, because, hey, if the data isn't looking like what we expected, our code's gonna break. So, yes, check it out. You're in 