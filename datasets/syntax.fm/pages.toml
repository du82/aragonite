full_description = "880 February 26th, 2025 × #home-automation#javascript#web-development#privacy Creator of Home Assistant: Web Components, Self Hosting and Home Hacking Paulus Schouten, creator of the open source Home Assistant smart home platform, discusses the technologies enabling privacy-focused local home automation with extensibility Paulus Schoutsen Guest Paulus Schoutsen on X Paulus Schoutsen on GitHub Wes Bos Host Wes Bos on X Wes Bos on GitHub Scott Tolinski Host Scott Tolinski on X Scott Tolinski on GitHub Play Play Episode 880 or Show Notes Transcript 00:28 Home Assistant is an open source smart home platform focused on local control and privacy00:56 Home Assistant runs containers to integrate data from cloud services and local devices into one platform04:00 Initially chose Polymer web components for Home Assistant UI due to interest in exploring alternatives to React05:10 Web components enable custom Home Assistant UI cards while encapsulating styles, ensuring stability over time08:54 Home Assistant uses simple state management similar to Redux that has survived over 8 years, enabling backwards compatibility12:36 Shadow DOM encapsulates styles for custom Home Assistant cards, preventing interference with overall application styling14:25 Home Assistant loads components dynamically via events and on-demand importing to enable responsive experiences16:38 Home Assistant frontend leverages lit web components and reactive elements for rendering and lifecycle management23:05 Home Assistant OS handles dependencies like Z-Wave drivers automatically via background container installation25:36 Users can run Home Assistant via OS, Docker, Python or supervised on existing Linux installs30:13 Python ecosystem improvements have enabled easier Home Assistant installs directly via package managers31:49 Most Home Assistant users run on Raspberry Pi devices due to affordability and easy gateway to home automation33:05 Home Assistant can route voice commands to local speech handling or cloud AI services like GPT-3 for expansive smart home control38:15 ESPHome enables YAML-based firmware generation for microcontrollers, while ESP Web Tools handles serial flashing easily40:14 ESP Web Tools installs pre-built firmware over WebSerial, automatically restarting device to launch software40:35 Improv WiFi protocol allows web-based WiFi configuration for microcontrollers via WebSerial or WebBluetooth46:32 Web Bluetooth could enable custom firmware on devices unexpectedly, raising security concerns for browser vendors49:29 Matter has promise for smart home interoperability but real benefits likely years away due to slow hardware update cycles52:51 Home Assistant can use analog phone connected via VoIP box to make or receive calls serving as interactive voice assistant Topic 0 00:00 Transcript 0:00 Wes Bos Welcome to Syntax. And, I'm sorry. I didn't ask you how you pronounce it. How do you pronounce your name? Paulus Schoutzen.0:07 Wes Bos Awesome. Are are you Dutch? Yeah.0:10 Wes Bos Beautiful. I'm Dutch as well. I'm obviously Canadian, but, Dutch heritage. So always love love when you have it on. So Paulus is the creator of Home Assistant, which is the I don't know. How would you can you give us the pitch of what Home Assistant is and and who we are?0:27 Guest 1 Yeah. So I'm Paulus Schoutze. Home Assistant is an open source smart home platform with a focus on local control and privacy.Topic 1 00:28 Home Assistant is an open source smart home platform focused on local control and privacy 0:35 Guest 1 You can run it fully at home the way you want it. At its core, it's a Python application, but we prefer you use a Docker container or, like, our operating system. And it's the brains of your smart Node. So it pulls in all the data from wherever you host it. If you have Wes thermostat, we pull it from the cloud. If you have Philips Hue light bulbs, we talk to it locally. We bring everything together.Topic 2 00:56 Home Assistant runs containers to integrate data from cloud services and local devices into one platform 0:56 Guest 1 And from there, you can do whatever you want. Right? We believe that users that buy Vercel, that collect data in your house, you own that data. You can do with it what you want. So from Node Assistant, you can have dashboarding, automation, history, Vercel, but we also allow it to send it to Apple Node, send it to Google Home, to Amazon. If you like those ecosystems, just go there. Our open API also like these things like Node RED, self hosted automation engine. It just fully plugs into Home Assistant, can do anything you can do inside Home Assistant automation, put a different approach. And it's great. Like, everything is just possible. It's just the foundation of your smart home, really. Yeah. It's it's honestly awesome because1:36 Wes Bos like, I've I've run it for probably five or six years now.1:40 Wes Bos I'm currently running it on the the Node Assistant operating system, which is, like, one step even further behind. Like, I'm running it as a VM, not just as a Docker container, as an actual VM. And it's awesome because, like, I have so much gear out there, and there I don't think there's one I have some stuff. I have Google Home and, like, not everything integrates with it, and, like, it's it's it doesn't I can't architect it as as what I want. You Node? And the Apple stuff, you gotta, like, be in Apple's good blessings to ESLint that environment, but, like, you can connect anything to anything on Node Assistant. And I just have, and it's just it's rock solid too, man. Like, I've been running it for forever, and it just works. I think2:24 Guest 1 what happens there is that there's just because anyone can build anything. Right? We don't limit. Like, anyone can build any integration. We don't need partnerships. So so for example, you know, I have Elgato Lights. Now somebody had Elgato Lights and built an integration. And now I have a local Elgato integration to control my lights. So for example, I can have the lights turn on when I start streaming.2:44 Guest 1 And these kind of things is like it's not a use case of Google Home to be like studio automation, but, like, it's kind of these things we end up doing all the time, like, as content creators, for example. Mhmm. Great. With Home Assistant, you can do it. I have dipped into it, like Node not dipped into it. I've been running it quite a bit. And even, like like, all the lights behind me, let me see if I can3:05 Wes Bos go to my Home Assistant UI here and and turn on my recording scene.3:11 Wes Bos Which one I or do what do I have here? It's so funny because I almost never use the Node assistant UI.3:18 Wes Bos It's just automated.3:20 Wes Bos I walk into my office at 9AM, and they're all on. And I walk out at 05:00, and they they turn themselves on and and lamp o'clock. And it's it's pretty cool. But and as much of, like, a home automation geek as as I am, I also today, we wanna talk about, like, a couple things. Specifically, Home Assistant runs on web components.3:40 Wes Bos And I think that was a3:42 Guest 1 yeah.3:43 Wes Bos And, also, Home Assistant is a I I know CJ is gonna be excited about this as well. It's like Home Assistant JS probably one of the one of the largest self hosted projects everywhere, and and making something that is easy, but also people can host themselves is is certainly a challenge.Topic 3 04:00 Initially chose Polymer web components for Home Assistant UI due to interest in exploring alternatives to React 4:00 Guest 1 So the reason I chose web components initially, right, so not the reason why I stuck with it, but the reason I chose it is because at my work, while I was working, we were very early adopter of React. I went to the first React conference. This was back when you had React create class, right, before the components even, before the hooks. Right? Like, this is way back. Oh, man. Yeah. And I was like, I wanna do something else at home. Right? And I was like, homosysm was my playground.4:24 Guest 1 And then Google released material design with Polymer. Right? Polymer Vercel, like, OG web components before they were part of browsers and web standards.4:32 Guest 1 And I was like, oh, yeah. Let me try this. I like material design. And so I added that to Node Assistant, and this was this was rough. Like, this was with non standardized HTML imports. So they had to they had their own bundlers that didn't fully work. They whenever everybody was transitioning with Babel to, like, e s six or, like, five to six JS it was still called back then. And, like, started using classes in Polymer, couldn't do that yet, etcetera. And so it Wes kind of rough in the beginning, but, you know, it stuck around. And I think today, I wouldn't wanna pick any other technology for Node assistant because of what it enables us.5:09 Guest 1 And I don't know. Do you want me to just go down what what it enables? LikeTopic 4 05:10 Web components enable custom Home Assistant UI cards while encapsulating styles, ensuring stability over time 5:14 Wes Bos Yeah. Yeah. I I think that would would be a a good use case. Maybe we'll explain real quick, Lee, for for anyone listening JS, like, Node Assistant is a, like, a Python application, and the UI to interact with that is is built in the browser. Right? And that includes everything from simple light toggle on and off to to maps to graphs of where your electric car is to you can you can put a calendar in there. Like, literally anything you could possibly think of.5:51 Wes Bos But then you also wanna allow people to skin it and theme it and have, like, a, like, a flexibility and control over making it. Like, there's this there's a a subreddit that's just dedicated to people who make, like, like, home screens, like a like a old TV they hang on the warp, and it shows what's coming up. And I I'm always curious about, like, how do you how do you do that in a way that you give people full control, but it still looks good at the same time?6:18 Guest 1 Yeah. The the trick there really is Shadow DOM. With Node Assistant, we have made sure every layer is customizable so you can people can define their own cards from their dashboard, and we just push the state in as like a property, and then they can render whatever card they want.6:36 Guest 1 And by leveraging Shadow DOM, Wes really allows us to encapsulate the CSS because there's a lot of people out there that they don't you know, they learn to program. Right? Like, they learn programming or web development as part of their Node assistant journey in building out a dashboard, And they do wild stuff. They do very wild stuff. But being able to just say, okay. Write whatever CSS you want. Like, make the background of every div red. Great. Because in Shadow DOM, it doesn't touch the rest of the application.7:08 Guest 1 It also allows us to because there's two parts to it. One is it should work today, but, actually, it should work in a year from now. Right? Like, if your environment around it changes, like the CSS that's being used or the components that you rely on, then you end up, like, breaking a card. But if a card is fully encapsulated with its own stuff, which, yes, it brings in more CSS, it also guarantees kind of stability. And so the cards inside Node assistant that are built in, they share a lot of the stuff together.7:36 Guest 1 Custom cards, they don't. They just have their own little world shadow DOM. They can mess with it. They can write all the CSS, the JavaScript.7:46 Guest 1 The state, that one has to stay fixed. Right? So the way we pass around state and Home Assistant is actually, this because this is before, like, this is really old as well. I know we were using nuclear. Js.7:58 Guest 1 Nuclear. Js was the the state management that was the inspiration for Redux.8:04 Guest 1 Right? So that's old.8:06 Guest 1 And instead of using objects for Redux ESLint like we're doing just objects, nuclear was using immutable JS. Okay. So you had to pull in immutable JS, but immutable JS Wes, like, maintained by this guy at Facebook. And he left Facebook, and immutable JS kind of died, and nuclear JS died. And then I kinda realized, like, it's too much magic. Like, if you do all this magic, if you wanna have people create custom cards, you can't have them pull in reducers or whatever, selectors, all that stuff. So instead, I basically created, like, the idea of Redux, right, where you just have one object with properties and the properties only change if, like, a value changes. Mhmm. And we just pass this object around. Wes just push it in. And if it doesn't change, like, the actual data you're interested, you don't rerender. Otherwise, you render.8:53 Guest 1 And this piece of state management actually has survived, like, I don't know, eight years, which is kinda wild, but it works. And today, custom cards from back in the days actually still work. Like, if you had a card to render a card or a switch or whatever, as long as the things you're into like, the if the services, they still work as well. So all that stuff remains stable, those cards can still function.Topic 5 08:54 Home Assistant uses simple state management similar to Redux that has survived over 8 years, enabling backwards compatibility 9:15 Guest 2 I think this is great. Like, I I saw your blog post back from 20169:19 Guest 1 about how you chose Polymer and web components. And the fact that you made a technical decision, well, like, nine years ago at this point, and it's lasted, which is hard to say about like, because, I mean, if if you would have chosen React, you would have had, like Three or three. And you wanted to say relevant and update. You'd have to you'd have to, like, rewrite three times. So that's awesome to hear that it that it's working. That's something that I actually already realized when we were working at React, at a company I was working, is that a new version would come out. And back then, we were making a lot all these changes. Right? Because Wes twenty fifteen was just coined and, like, classes and everything was new and everything had to be old. Like, you have browser refine, all that stuff. It's way less settled back then than it is now. But then a new component which would require a new React, and you would have to upgrade everything and kind of go along. And I realized that with today, with web components, we don't have that problem. Like, we still have some Polymer in Node Assistant. Right? Like, we've been there's been a new material Wes component package which they also now put in maintenance mode. So I'm we're not gonna bet on Google UI toolkits anymore.10:22 Guest 1 But we are, we still have some Polymer. Like, this stuff, even though it's not maintained, it still works. And it's still because it interacts at the browser level with DOM elements. So the sidebar element in Node system with gestures, that's all still Polymer.10:35 Guest 1 But in it are just modern web components with the newer"
