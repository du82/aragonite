Sanity. If you are using JavaScript or using any programming language. Sentry JS going to give you insights into why your app is slow, insights into why your app is erroring out, insights into what happened in leading up to an error, video playback, all kinds of really good information about what went wrong and help you solve those bugs. Check it out. Sentry.i02:15 Wes Bos forward slash syntax. Yeah. Sentry allows you to take on your app and hack it.Topic 1 02:28 Introducing idea of reactive variables missing from JS 2:28 Wes Bos Alright. Enough of that. One thing that is missing from JavaScript is this idea of reactive variables.Topic 2 02:36 Storing data in variables and reacting when it changes 2:36 Wes Bos We have reactive variables in all of the frameworks, meaning that you can store data in a variable.Topic 3 02:43 Updating DOM when variable changes 2:43 Wes Bos And when that variable changes, you want to react to it. Right? You might wanna display it. You might wanna throw it into the DOM.2:51 Wes Bos You might want to compute some data based on that. So, for example, you have an array of items in your cart. You and you wanna calculate how much your cart total is. Mhmm. Or you might also want to to update something. Right? You wanna send some data over a WebSocket. You might wanna update the title tag of the website.Topic 4 03:09 Want to do things when data changes 3:09 Wes Bos When data changes, you want to do things. That's kind of the whole idea of of web development.Topic 5 03:16 Signals are state that changes over time 3:16 Wes Bos So this idea of of signals is a signal is a, like, a piece of data that may change over time. It's a piece of state.Topic 6 03:26 React to data changes with signals 3:26 Wes Bos And if you want to react to that data or compute data when that data changes, you can use this idea of a signal.3:37 Wes Bos Yeah. And Scott, typically, when you're watching, you're often seeing that being described as an effect or people, you know, say it's a side effect. When this thing happens, the side effect is something else happens. Right? And sometimes, people think, like, alright. I'm gonna listen for this variable to change, and then I'm gonna update another signal based on whenever this one changes.Topic 7 03:38 Side effects happen when data changes 4:02 Wes Bos But the the better way to handle that situation is to use something called computed state, like you just mentioned, where with computed state, it's exactly doing that. It's saying whenever this changes, the new value of the state will be computed by the current value of the state that's changing. So you see this in all kinds of these both, signals implementations and libraries under, potentially different names, whether that is computed in Svelte. It's derived.Topic 8 04:33 Derived state updates when dependency changes 4:33 Wes Bos So you see these things listed as all kinds of thing. But the idea is is that one bit of state is derived from the other. So when one changes, they both change. They're attached. The other part of signals is you4:43 Wes Bos also are have the ability to update that piece of data.Topic 9 04:44 Can update data with signals 4:48 Wes Bos And that is really nice because you can simply create a a piece of state, and then you can import it and export it in and out of your your different files and then update it. The the one we'll get into frameworks in just a second, but that's that's not the way that React works by default. React state is is top down. It's it's unidirectional, meaning that if you want data Scott or updater functions in somewhere else, you must pass them on down. Whereas with signals, they can simply they can go anywhere. Right? You can define them lower and and import it at a higher level or or vice versa.Topic 10 05:29 React state is top-down, signals can go anywhere 5:29 Wes Bos And that's just React is very much about the whole top down, but you still can get this whole signals5:35 Wes Bos thing in React