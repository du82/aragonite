ion is another spec that's being worked on, which will also let us put the put that in. So imagine how awesome that will be when we're able to put variables in our DOM elements.Topic 14 07:10 Browser proposal to add reactive templates to HTML 7:42 Wes Bos And if it's a signal, then that signal will simply just rerender itself. Sorry. That DOM partial will rerender itself when it's, when it's needed.Topic 15 07:54 Faster and less memory than JS implementations 7:54 Wes Bos Yeah. Anytime I get one of these web components, pull requests or anything like that, it makes me realize how unequipped I am to really understand, the challenges and things with web components. Because I always look at this stuff like, oh, this looks great. This looks fine. And then I hear afterwards, no. This sucks because of these following reasons. And you're like, alright. So I gotta dive into these PRs a little bit and really, get some ideas about if this stuff is actually going to solve the problems or not. Because, like, with anything in web components, it always feels like even if it seems like it solves the problem, there's always, like, nuance that it might not. So interesting to see. But the cool news is is that anything that comes to the platform can trickle down into frameworks that use the platform. And if your framework uses the platform, you get that for free. Your framework gets lighter and, weekly. Yeah. Your code just works. So I love that. Like, more memory efficient. You Node? Like, if the brow if they're doing it at a browser level, that's much better than8:50 Wes Bos Totally. Us doing it in JavaScript land. Right? So the the side effects or the watching of variables to change, that, of course, all all has to happen inTopic 16 09:00 Browser could tell you when variables change 9:00 Wes Bos JavaScript land right now. But Yeah. Imagine if the browser could tell you when a variable is updated, then you you have it's faster. There's less memory, all those good things. Yeah. Totally. So let's talk about other implementations, so all things you can use while you're waiting for this to come to the browser. The big one that a lot of people use in the React world is the Preact JS signals.Topic 17 09:22 Preact signals API is simple 9:22 Wes Bos And this the, repo for this is fairly straightforward in terms of the use case. Like, when when sometimes you see, like, concepts like this, they feel like big ideas or big anything.9:32 Wes Bos But the the signals and the pre act signals is really just a a couple of, you know, a couple of functions. You're either creating a signal, which is you're creating a bit of state. You're accessing that that value.9:42 Wes Bos You're using computed to derive values from that value. There's an effect function that you can import that runs when a value has changed, so you're not having to wait for or pass in a a dependency array. Just tell it when to update. Right? It's based on the when the signal changes.Topic 18 10:00 Batch multiple updates into one rerender 10:00 Wes Bos There's also a batch function, which allows you to combine multiple signal rights into one single update.10:05 Wes Bos So that's neat. And, That that one's important for, like, rendering performance because if you update six or seven things At least in React. Right? Yeah. You can you can batch them all at once so that the well, even like, pretty it could be for anything as well because if you're updating the DOM six or seven times versus once, it doesn't matter what framework you're using. That's that's going to be a little bit slower, especially if it's triggering10:29 Wes Bos animations or transitions or anything like that. Yeah. But if it's triggering a rerender of five components, that's worse than just updating the DOM five different places. Yes. You know what I mean? Totally. Yeah.Topic 19 10:41 Works with React and vanilla JS 10:41 Wes Bos Preact JS signals is really cool because it of course, it works with with React, but it also works with vanilla JavaScript. And I've used it several times in vanilla JavaScript, and it's it's if you ever want, like, you're just doing something vanilla JavaScript, you're just using, like, template tags or or document dot create element or simply just inner HTML with some variables inside of some HTML, the Preact JS is very lightweight. It's it's 800 lines of code for the entire signals library.11:14 Wes Bos And, quite honestly, some of the best code I've ever written of in terms of being enlightened because, like, I I was always wondering, like, how do they figure out what variables are being used in a specific thing? Because the way that an effect in preact signals works is that you can just pass it like a function that uses a signal, and it figures out what signals are being used and what signals to track. And I always wondered, like, I and I'm not not passing it like a dependency array or anything like that. It just figures it out. And then I, like, I read through the entire code Bos, and I was like, i"
