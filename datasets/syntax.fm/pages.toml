hat they have completed all of the fields correctly.4:39 Wes Bos You wanna validate that they're not sending data that is not needed. You wanna make sure that the length of the body that they sent is not the Bee Movie.4:47 Wes Bos Yes. Because it has to be short. Right? So you you'll have to to to validate those. Right? So 10stack router, 10stack form, Hano Express, all of these libraries often provide a sort of a a way to validate your data. We have a, like, a little bit of a a problem there because these libraries that need to validate your data, they either choose a validation library and and consider it blessed. They say, like, we use XOD for validating your data. And if you use something else for describing your schemas pnpm doing validation, then you're either out of luck, or you have to write, like, a like an adapter or a resolver Mhmm. Function that will sort of translate it from from one to another. So the idea with standard schema is it's not a way to define what your data looks like. So the Node API, the ValleyBot API, the archetype API, those are all different APIs, and they've all approached it differently.5:51 Wes Bos They've not, likes like, got together and said, you know what? Let's just make Node validation API to to end it all. Those are still their own packages.Topic 4 05:52 Standard schema standardizes validate method inputs and outputs 6:00 Wes Bos So what they have agreed is a standard way to define several things. First of all, how to actually validate the data. So what's standard schema does is anyone who implements standard schema will simply tack on this tilde standard onto each of the schemas.6:22 Wes Bos And that way, when you pass in a schema into something like Deno or TANSTACK Form or React Router or anything that will support standard schema. So all these library authors will now say, okay. I don't have to just pass me a standard schema. I don't care who made the schema. All I care about is that I can access a couple things. First of