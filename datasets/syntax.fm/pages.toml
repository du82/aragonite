rmance, you know what? Actually, Century has some of the most incredible tools for seeing performance in the real world over time. Because let's face it, you can run your Lighthouse. You can run all of your stuff locally. You can run it on your own computer. But at the end of the day, you might be on, like, a fast Internet connection with a fast computer and all kinds of stuff, and you might not know what's hidden in the real world. So if you head on over to century.i0/syntax, sign up using the coupon code Sanity treat, you can get access to some really incredible features showing you all of the things that we're gonna be talking about. Performance tools are incredible.1:36 Scott Tolinski You even get a Scott that tells you, just how miserable your users are. There's a lot of cool things that we're gonna be talking about in this episode that you're going to be able to take and make your stuff as fast as possible and see all that in action if you're checking out Century's performance tools. So this show is presented by Century.2:01 Scott Tolinski So let's get into it. I figured we would start this off with the first part JS, like, why? What what makes apps slow in the first place? There's there's a couple of reasons why apps could be slow, and the first one is just strictly you're loading too much stuff. You're bringing too much stuff to the party. You're you're carrying all this stuff. You can't get through the door.Topic 1 02:02 Bringing too much stuff slows apps down 2:20 Scott Tolinski And this could be too many images, too much JavaScript, just too much in general because at the end of the day, we're sending information over the wire to somebody's computer, their phone, whatever. Their network speed dictates how much can actually be loaded. And if this is the first initial load or or whatever, maybe, you're bringing in a whole bunch of stuff, if you Yarn sending too much stuff to them, that is a package that is too big for them to arrive, and it's gonna take a lot longer for it to load on anybody's application. And that goes for, you know, even if you don't have caching properly set up, which we'll talk about in in Mhmm. Various ways. He you know, it could be initial page load, but it it frankly, it could be every page load. It could be anytime they do anything.3:04 Scott Tolinski So bringing too much stuff is certainly one reason that apps could be slow.3:09 Wes Bos Too much stuff or too big of stuff as well. Right? So if you are loading in things that are needed to render the page out or to something that is on the page, like images or video, if those are, larger than they should be, of course, that will slow you slow you down. Yep. Another one could be slow database work. You Node? Databases,Topic 2 03:30 Not optimizing databases hampers performance 3:30 Scott Tolinski in particular, can be slow if you're not using them correctly. You don't have indexes set up properly or you're not doing performant queries. Maybe you're doing too many things or maybe you're you're doing things in a nonperformant way where you could be doing everything in a single query, and instead, you're you're doing one query, taking that data, doing multiple queries, doing another query here. And, like, maybe you're going to the the well too many times on the database when you could be making a single trip to the database and back. So, slow database work is is certainly one of them. There's also solutions with caching in here that we can talk about as well. Mhmm. Slow server. So your your actual website, the front end Sanity as fast as possible. But4:10 Wes Bos if the server that you're making a request to are slow, they're slow to respond. So when someone visits a initial page, if that takes two or three seconds, it's it's gonna be be kind of sluggish. Right? Or it could simply just be slow to move through the tubes because, your server may be not located close to where your actual user is. Yeah. Yeah. Or maybe your server is under spec'd. You know? Yeah. Yeah. That's true. Maybe it's it's overrun. You Node, you've got too many people, or you're trying to do processing on your Vercel, and because of the the RAM or the the processor on that Yeah. Server is not fast enough, to do that. It can it simply just slows things down. And then the last one we have here is just like waterfall requests or waterfall renders. So the idea of a waterfall is that you you request a website that will return some HTML, and then the that HTML is is parsed out, and then the browser knows what else it needs. You know? And it's often going to need things like CSS and images and JavaScript.Topic 3 05:19 Waterfall requests increase load times 5:19 Wes Bos A waterfall is when one request renders and realizes it needs something else, and then and then that thing renders and and realizes it needs something else. And and if you are waterfalling them, meaning that, like, one thing is hopping to another, sometimes you can be six or seven requests before you actually are able to display things on the page. So there are client server waterfalls that happen, meaning that you're let's say you have, like, a a a server rendered component.5:50 Wes Bos You send the request to the server.5:52 Wes Bos It comes back, gives you the actual component. That component realizes it needs something else. It's gotta go back to the server and then come back, and you go back and forth over the network.6:02 Wes Bos And then there's also just, like, server waterfalls, for for rendering, meaning that you render server render a component, and then you realize that component realize it needs something else. And, usually, that's because you're server rendering something, you're fetching some data.6:17 Wes Bos Based on the response of that data being fetched, you realize you need to render something else. And then based on rendering that thing, maybe you realize you need to render something else, and it just kinda keeps going down and down and down. And that's where you can get into a lot of kind of slow work.6:33 Scott Tolinski Yeah. Totally. So let's talk about some terms here, some things that are gonna be important and and maybe potentially like, how do you know it's slow beyond the, like, hey. I'm using it, and it feels slow. So Yeah. The first one could be that, you don't understand web vitals. So the web vitals and and these are just kind of, like, standardized terms in the way to talk about these things. We have a a website here created actually by, Ben Vinegar on Century, which is webvitals.com.Topic 4 07:01 Understand web vitals for optimization 7:01 Scott Tolinski There's a number of different things that you'll see in the browser's dev tools, but also in performance tools and all kinds of things. But it's also something that takes into account for SEO purposes as well. So LCP or largest contentful paint, largest contentful paint is basically the time it takes for the largest one to load, the largest asset, text or image or anything to render on the page. That gives you kind of an idea of, like, alright.7:27 Scott Tolinski Who's the biggest, baddest thing, and how long is that specifically taking? There's also INP, which is interaction to next ESLint, and this measures the time from when a user interacts with the page, for when the the browser renders a visual response. So you could think of this as latency when somebody clicks something. So in this example on the site, I click an, an accordion. It opens immediately. That's an extremely short INP. Right? But then we have this longer one, which is artificially delayed, and I click it. And you can see that interaction in Next Paint took, like, about a second here. And so because of that, that's a bad user experience, obviously. So that can happen totally if you're maybe you're doing something and you're waiting for a database response and it's slow, or maybe you're running way too much JavaScript and some things are happening that don't need to be happening. Yeah. Or the the worst is when8:22 Wes Bos you need to wait for the JavaScript to load before you can even use it. Like, I was on eBay the other day, and I couldn't even focus the search box until all the JavaScript had been loaded on the page for, I don't know, for whatever reason. But, like, that's why it's so nice to use HTML features when possible, because you you can at least start interacting with the website8:49 Scott Tolinski if you're before the JavaScript JS loaded and all the bindings are done. Totally. There's also CLS or cumulative layout shift. We all know this is maybe the most frustrating one for me in the entire world. I I think the worst thing that I can interact with on a website is when you open it. Half a second later, an ad pops in, and the thing you went to click on moved, and Node all of a sudden you're clicking on an ad. This will make me want to throw your application in the trash so quickly. So this basically measures the total amount of layout shift that's happening. And if things are coming in late or popping in late, that's going to disrupt how your users are using it. And that's also going to be exacerbated by, like, the way that things are loading into your page, whether that is through JavaScript like you had mentioned. Perhaps, like, you're waiting on JavaScript to execute before things pop in there that could happen. A big one for the layout shift is images where you don't hard Node their width and height. Yes. It's a Node it's super annoying to hard code width and height of an image unless it's automated because, like, I don't know. So what people do is they just throw the image tag in there, and then you have text. And then as soon as the image Node, it pushes the text down. Or often, you'll throw a banner up at the top if there's a sale,10:01 Wes Bos and then that pushes the whole website down a little bit. That's really annoying because you have to wait for the JavaScript to load for it to figure out if it should be loading it. There's10:11 Scott Tolinski a whole bunch of annoying things around that. Yeah. And solution for that, if you haven't found the solution, aspect ratio is pretty well supported now. You turn aspect ratio on that. That will apply the correct height regardless of whatever the width is and vice versa. Do you know that sorry. One more thing about that. Yeah. The browser now if you supply a width and height to10:32 Wes Bos an image, the browser will now automatically give you an aspect ratio.10:37 Wes Bos Cool. So you can say width 500, height 200, And then in your CSS, give it width a %.10:44 Wes Bos And then because people also don't like hard coding width and height because, like, I don't know. I want the thing to be flexible. Yeah. But now aspect ratio will kick in without you even having to set it, and it will, it will determine the aspect ratio from the width and height of the image's attributes.11:01 Scott Tolinski Nice. Yeah. I I think aspect ratio is one of those things that, was very exciting when it was added for this specific reason. Now we just need to get everybody who drops an ad, a banner ad, or anything in the website to use this because, like, get that stuff out of here. There's also FCP, First Contentful Paint. This measures the time at which a page starts loading to when any part of the page's content is first displayed. So, basically, your page starts loading, something shows up, that is your FCP.11:31 Scott Tolinski This is important to know because that ESLint time, you know, can well, I mean, I guess the time it takes to complete loading is also extremely important, but you wanna make sure that things are showing up, quickly as well that can, you know, give your users the sense of something loading fast and maybe perhaps you're showing skeleton screens or something like that to make it feel faster. There's also TTFB.11:55 Scott Tolinski This is something a lot of us are are have seen before, which is time to first byte. This measures the duration from when the page starts loading to when the first byte of content is received from the server. If you have a long TTFB, it probably means that something is slow on your server. When I, had initially had, like, a performance tutorials on level up tutorials a long time ago on YouTube Yeah. I Wes I was talking about TTFB and how this JS, you know, the process it takes for your sir or how long it takes your server. And I had a lot of people leaving comments being like, mine is really slow. How do I fix it? Mine is really slow. How do I fix it? Well, it's like, well, you gotta give me more information. You know? Like, what kind of server are you working with? What are you doing on your server? Are are you you Node, what exactly are you do you have caching turned on? Any of that stuff. So there's a lot of things that can inter affect these things. But, check this site out if you wanna learn more. It's webvitals.com.Topic 5 12:48 Use webvitals.com to learn perf metrics 12:48 Scott Tolinski It's a really useful resource.12"
