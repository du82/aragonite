ow control you're actually using.10:55 Wes Bos Wow. So, yeah, that is that is the whole idea behind standard schema. It's it's really interesting because, like, again, it's 60, 58 lines of TypeScript, but it it was it seems like a pretty big effort and a lot of thinking, from all of these people to come together and agree on what this these shapes will look like, and then this should make life, again, much easier for library authors and, that need to actually implement validation.11:26 Scott Tolinski Yeah. I you know what I'm interested in this is, like, do you primarily see end users using this or just library authors? I don't foresee11:35 Wes Bos end users using it a whole lot unless it is something like the inference is really nice. So, like like, one thing with Drizzle is, like, Drizzle has a property on it that's called, like, infer. You can you can take the Drizzle schema, and you can infer your return type from the actual schema. Right? And I could see this being a really nice way to just sort of standardize how inferring those values work, but I see most of the actual heavy lifting here simply just being done both by the validation libraries that implement standard schema and the, libraries like routers and,12:16 Scott Tolinski Node and Express that actually consume these types of things. Interesting. Cool. Well, thank you for the rundown. I saw this pop up. It's definitely something that's in my wheelhouse, but to be honest,12:27 Wes Bos did not really understand what the deal was. So I really Yeah. I'm too sure that first I thought, like, oh, are they coming out with a new validation library? But that that is not the case.12:37 Scott Tolinski Not the case. Well, glad to hear. And, interesting stuff. I think this is good. Having any sort of standard connection or whatever12:45 Wes Bos is only good for being able to support all these different libraries that we're constantly inflicting ourselves with. So Totally. Yeah. Yeah. And it it only opens the door to,