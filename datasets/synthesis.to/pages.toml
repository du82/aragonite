["https://synthesis.to/2021/03/03/flattening_detection.html"]
title = "Automated Detection of Control-flow Flattening"
full_description = "Commercial businesses and malware authors often use code obfuscation to protect specific code areas to impede reverse engineering. In my experience, knowing which code areas are obfuscated often pinpoints sensitive code parts that are worth a closer look. For example, the FinSpy samples that were discovered in September 2020 obfuscate their main modules with Obfuscator-LLVM, while the two-staged dropper isn’t obfuscated at all. Therefore, I would like to use this post to introduce a heuristic that automatically identifies one of the most common obfuscation techniques, control-flow flattening. However, before we approach this, we will have a look together at how reverse engineers use control-flow graphs, the impact of control-flow flattening on reverse engineering and a tiny bit of graph theory. Afterward, we have all the fundamentals to build a heuristic that detects flattening’s underlying structure and implement it within a few lines of Python. In the end, we investigate how the heuristic performs on obfuscated and non-obfuscated code and discuss its limitations. In many cases, we can reconstruct a function’s control flow without any code analysis, just by simply looking at its control-flow graph. For instance, consider the following graph: As we can see, basic block a has two outgoing edges: one to b and one to c. This is a typical pattern for a conditional branch, where we jump to one basic block (let’s say to b) in the true case and to the other one (to c) in the false case. While b and c most likely perform different calculations, their control flow joins in the basic block d. On the high-level, this is a typical if-then-else pattern. Thus, we can recover the control flow without reading a single assembly line: After we recovered the high-level structure, we can reconstruct the code itself, basic block per basic block. In this case, let’s just assume that we recover the following function: The function check takes a parameter x as input and checks if it is smaller than 10. In this case, the function returns 20, otherwise 30. This was easy, huh? Well, let’s have a look at control-flow flattening then."
