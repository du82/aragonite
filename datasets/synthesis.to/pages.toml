title = "Introduction to Control-flow Graph Analysis"
full_description = "Following my last blog post, I got a lot of questions about additional material on control-flow analysis. While most compiler books (such as the Dragon Book) cover related topics in-depth, I decided to publish my own presentation that was initially built for (but never made it into) my training class on software deobfuscation. The slide deck illustrates the theory of control-flow graph construction, dominance relations and loop analysis. In the second part of this post, I would like to show you how to play around with these concepts using the reverse engineering framework Miasm. For playing around with control-flow graphs, dominance relations and loop detection, we take the following graph as an example: As described in my previous blog post on automated detection of control-flow flattening, this graph has an entry node a and a loop between c, e and g. To automatically determine all entries, dominance relations and loops, we can use Miasm’s DiGraph class: First, we initialize a DiGraph instance and add all edges to the graph. Then, we walk over all graph entry nodes and compute the dominance relations, the dominator tree and all loops in the graph. With some additional code for pretty printing (omitted here due to readability), we get the following output: The code takes a binary as input (provided via file_path), initializes the disassembly engine and disassembles a function at start_address. Then, the resulting asm_cfg is a DiGraph instance holding the function’s control-flow graph. The entire script that re-implements the heuristic to detect control-flow flattening in Miasm can be found here. For questions, feel free to reach out via Twitter @mr_phrazer, mail tim@blazytko.to or various other channels."
