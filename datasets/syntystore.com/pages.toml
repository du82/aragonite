description = """
Synty® Studios Presents: POLYGON - Alpine Mountain - Nature Biome

Explore this canvas of vibrant hues, from the rich greens of pine trees to the fiery reds, all harmoniously set against the backdrop of snow-capped summits.POLYGON - Alpine Mountain captures the essence of serenity in every season. This 3D low poly asset pack contains not only various prefabs, environment materials and textures but also a detailed demo scene, allowing you to add to or build out diverse landscapes in your video game. This game dev asset pack showcases the captivating beauty that transcends the ordinary. Uncover the secrets hidden in the spaces between the trees and let the alpine mountain unfold before your very eyes.
Nature Biomes Packs: 
Bundles:

POLYGON - Nature Biomes - Season One
POLYGON - Nature Biomes - Season Two

Individual Asset Packs: 

POLYGON - Arid Desert - Nature Biome
POLYGON - Enchanted Forest - Nature Biome

 *Contents may vary between engines. 
📦 Pack Content
A comprehensive demo scene illustrating how to make the most out of the assets contained in this pack!
◼ Environment (x86) ◼Background trees, branches, bushes, mounds and ground cover, ice sheets, lake, moss lumps, mountain ranges, pine trees, rocks and cliffs, snow mounds, stalactites◼ Props (x23) ◼Backpack, bench, cabin, campfire, canoe and oar, chairs, fish rack, fishing rod and stand, fossil, ice auger and axe, fishing hut, jetty, lookout, sleeping bags and tent, thermos, wood piles◼ FX (x16) ◼Auroras, butterflies, dust spots, fire, fog, hawks, leaves, petals, smoke, snow, snow dust, sunray, water drip, wind streaks
🤖 Technical Info
◼ Compatibility◼- View our tutorial on converting to the Universal Render Pipeline.- Unity Render Pipeline Support:

Standard
URP

- Compatible with Unity 2021.3- Compatible with Unreal Engine 4.25+
 ◼ File Formats◼
- Unity 2021.3 Project- Unreal Engine 4.25 Project- FBX Source Files
📋 Change Log
Version 1.4.0 (Unity)- Added Unity 6 URP extract me
Version 1.3.0 (Unity)- Added world/local space switch for the frosting effect in the vegetation shader
Version 1.2.0 (Unity)- Various fixes to the URP Extract MeVersion 1.1.0 (Unity)- Fixed issues with 2022 URP- Added support for 2021 URPVersion 1.0.0 (Unity + Unreal)- Initial release"""
