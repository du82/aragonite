description = """
Synty® Studios Presents: POLYGON - Apocalypse Pack

Doomsday is here! What has the world come to? Are you prepared for the zombie apocalypse?
This epic 3D low poly asset pack has all you could want to build out your apocalypse game, including a massive demo scene.
Want to add another layer of horror - combine this pack with POLYGON - Horror Mansion and unleash all hell upon the world. Who will save us now?
◼ Key Features ◼
Modular sections are easy to piece together in a variety of combinations.
- All Buildings have enterable Interiors!- Modular Bunker System!- Modular Quarantine Wall!- Vehicle Armor Attachments to add to our previous vehicles!- Vehicle weapons to attach to your death machines!- Modular Gun System - Create thousands of custom guns!
OVER 1,800 Detailed prefabs are included with this pack.Includes a MASSIVE demo scene - (Character poses indicative only)
*Contents may vary between engines.

📦 Pack Content

Includes a MASSIVE demo scene - (Character poses indicative only)
◼ Assets◼Characters (x30)Biker Male, Business Male, Cool Female, Cool Male, Criminal Male, Eastern Female, Emo Female, Hazmat Male, Homeless Male. Islander Male. Mechanic Female, Nerd Female, Nun Female, Patient Female, Press Male, Punk Female, Riot Cop Male, Scout Female, Sheriff Male, Soldier Female, Soldier Male, Teen Female, Teen Male, Waitress Female, Wanderer Male, Zombie Female x2, Zombie Male x2.Character Attachments (x86)Armors, Backpacks, Beards, Hair, Headgear, Weapon Accessories, etc.Vehicles (x17)Ambulance, Army Truck, Big Rig (with multiple trailers), Buggy, Camper, Medium Car, Caravan, Golf Cart, Hot Rod, Ice Cream Van, Moped, Motorbike x2, Muscle Car, News Van, Prison Bus, Ute.Vehicle Attachments (x88)Bumpers, Armour Plating, Lights, Spoilers, Aerials, Spikes, Cowcatchers, Adornments, etcComplete Buildings, with interiors (x30)Apartment, Auto Repair, Cafe, Church, Commercial (small, medium, large), Diner, House x3, Burnt House, Industrial (small, medium, large), Lighthouse, Market (medium, large), Motel, Shop (small x3, medium x2, large x2), House Trailer x2, Warehouse x2.Modular Buildings (x150 Pieces)Ceilings, Fences, Floors, Walls, Roofs, Bunker Pieces, Loading Docks, Pipes, Walkways, Stairs, Ladders, Beams, Doors, Awnings/Tarps, Signs, Seating etc.Additional Structures (x24)Bridge, Cooling Towers/Smoke Stacks x3, Container Bridge, Crane, Helipad, Military/Quarantine Tents (with damaged versions) x11, Pool, Pylon x2, Radio Tower, Water Tank, Water Tower.Environment (x240 Pieces)Roads, Sidewalks, Tunnels, Highways, Grasses, Bushes, Trees, Rubble, Rocks, Storm Canals, etc.Props (x671)Barricades/Barriers, Crates, Furniture, Billboards/Signs, Wrecked/Burnt Vehicles, Fences, Building Materials, Lamps/Lights, Power Poles, Nuke, Instruments, Rubbish/Trash, Spikes/Shards/Defenses, Camping Equipment, Shop Dressing, etc.Items (x93)Bottles, Ammo, Drinks, Cans, Camping Equipment, Food, Bags, Meds, etc.Complete Weapons (x86)AR’s, SMG’s LMG’s, Pistols, Shotguns, Rocket Launcher, Minigun, Nail Gun, Spear Gun, Bats, Blades, Axes, clubs, improvised weapons, Chainsaws/Garden tools, Grenade, Molotov, Nail Bomb, IEDs, AA gun, Harpoons, Rockets, Saws etc.Modular Weapons (x184 Pieces)Fully modular weapon parts including Stocks, Barrels, Handles, Bodies, Magazines, Suppressors, Scopes/Sights, Bayonets, etcFX (x28 Unity) Ash, Blood Splat, Bullet Shells, Dust (interior and wind), Fire x3, Flame Thrower, Flies, Fog x2, Gunshot, Mud, Nuke x2, Pollen, Radioactive (Flat, Large, Small), Rain and Rain Splashes, Road Flare, Smoke (Black, Large, Small), Sparks, Wheel Mud. FX (x12 Unreal) Ash, Blood Splat, Fire, Flame Thrower, Flies, Fog, Gunshot, Nuke, Radioactive, Rain, Smoke, Sparks. - Heaps of awesome content included (see the layout screenshots for more details) 
🤖 Technical Info
◼ Compatibility ◼- Character setup to work with Mecanim (no animations included in this pack)- View our tutorial on converting to the Universal Render Pipeline.- Compatible with Unity 2021.3+- Compatible with Unreal 4.25+
◼ File Formats ◼- Unity 2021.3 Package- Unreal 4.25 Project- Source Files (.fbx, .obj)
📋 Changelog
Version 1.18.2 (Unity)- Fixed traffic light scale issue in the demo scene- Fixed collision issue with SM_Bld_House_Burnt_01- Fixed missing mesh on SM_Bld_HighRise_Medium_01_Interior_Stack_Destroyed_01 prefab- Added overview map
Version 1.18.1 (Unity)- Fixed prefab transform issues- Assigned missing collision to the following prefabs:SM_Prop_Powerpole_Preset_01SM_Prop_Powerpole_Preset_02SM_Prop_Powerpole_Preset_03
