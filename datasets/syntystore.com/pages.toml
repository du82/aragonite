title = """
Privacy Policy | Synty™ Official Store
 – Synty Store"""
description = "Synty™ Official Store respects your right to privacy and is committed to safeguarding the privacy of customers and website visitors. Learn more"
full_description = ".section-template--18833511448828__main-padding { padding-top: 21px; padding-bottom: 21px; } @media screen and (min-width: 750px) { .section-template--18833511448828__main-padding { padding-top: 28px; padding-bottom: 28px; } } Privacy Policy Synty Studios Limited (NZCN 5942510) (we, us or our), understands that protecting your personal information is important. This Privacy Policy sets out our commitment to protecting the privacy of personal information provided to us, or collected by us, when interacting with you. This Privacy Policy takes into account the requirements of the Privacy Act 1988 (Cth) and the Australian Privacy Principles, as well as the New Zealand Privacy Act 2020 and the Information Privacy Principles. In addition to the Australian laws, individuals located in the European Union or European Economic Area (EU) may also have rights under the General Data Protection Regulation 2016/679 and individuals located in the United Kingdom (UK) may have rights under the General Data Protection Regulation (EU) 2016/679) (UK GDPR) and the Data Protection Act 2018 (DPA 2018) (together, the GDPR). Appendix 1 outlines the details of the additional rights of individuals located in the EU and UK as well as information on how we process the personal information of individuals located in the EU and UK. This Privacy Policy was last updated on 3 April 2024. The information we collect Personal information: is information or an opinion, whether true or not and whether recorded in a material form or not, about an individual who is identified or reasonably identifiable. The types of personal information we may collect about you include: · Identity Data including your full name, date of birth, company name, and gender. · Contact Data including your telephone number, address and email. · Financial Data including VAT or GST registration number, bank account and payment card details (through our third party payment processor, who stores such information and we do not have access to that information). · Transaction Data including details about payments to you from us and from you to us and other details of products and services you have purchased from us or we have purchased from you. · Technical and Usage Data when you access any of our websites or platforms, details about your internet protocol (IP) address, login data, browser session and geo-location data, statistics on page views and sessions, device and network information, acquisition sources, search queries and/or browsing behaviour, access and use of our website (including through the use of Internet cookies), and communications with our website. · Profile Data including your username and password, purchases or orders you have made with us, and support requests you have made. · Interaction Data including information you provide to us when you participate in any interactive features, including surveys, contests, promotions, activities or events. · Marketing and Communications Data including your preferences in receiving marketing from us and our third parties and your communication preferences. · Professional data including where you are a worker of ours or applying for a role with us, your professional history such as your previous positions and professional experience. · Sensitive information is a sub-set of personal information that is given a higher level of protection. Sensitive information means information relating to your racial or ethnic origin, political opinions, religion, trade union or other professional associations or memberships, philosophical beliefs, sexual orientation or practices, criminal records, health information or biometric information. We do not actively request sensitive information about you. If at any time we need to collect sensitive information about you, unless otherwise permitted by law, we will first obtain your consent and we will only use it as required or authorised by law. How we collect personal information We collect personal information in a variety of ways, including: · when you provide it directly to us, including face-to-face, over the phone, over email, or online; · when you complete a form, such as registering for any events or newsletters, or responding to surveys; · when you use any website we operate (including from any analytics and cookie providers or marketing providers. See the “Cookies” section below for more detail on the use of cookies); · from third parties; or · from publicly available sources. Why we collect, hold, use and disclose personal information We have set out below, in a table format, a description of the purposes for which we plan to collect, hold, use and disclose your personal information. Purpose of use / disclosure Type of Personal Information To enable you to access and use our assets, including to provide you with a login. · Identity Data · Contact Data To do business with you, including to dispatch and deliver our products to you; · Identity Data · Contact Data To contact and communicate with you about our business, including in response to any support requests you lodge with us or other enquiries you make with us. · Identity Data · Contact Data · Profile Data To contact and communicate with you about any enquiries you make with us via any website we operate. · Identity Data · Contact Data For internal record keeping, administrative, invoicing and billing purposes. · Identity Data · Contact Data · Financial Data · Transaction Data For analytics, market research and business development, including to operate and improve our business, associated applications and associated social media platforms. · Profile Data · Technical and Usage Data For advertising and marketing, including to send you promotional information about our events and experiences and information that we consider may be of interest to you. · Identity Data · Contact Data · Technical and Usage Data · Profile Data · Marketing and Communications Data To run promotions, competitions and/or offer additional benefits to you. · Identity Data · Contact Data · Profile Data · Interaction Data · Marketing and Communications Data If you have applied for employment with us, to consider your employment application. · Identity Data · Contact Data · Professional Data To comply with our legal obligations or if otherwise required or authorised by law. · Any relevant Personal Information Our disclosures of personal information to third parties Personal information: We may disclose personal information to: · our employees, contractors and/or related entities; · IT service providers, data storage, web-hosting and server providers; · marketing or advertising providers; · delivery or logistics providers who deliver our goods to you; · professional advisors, bankers, auditors, our insurers and insurance brokers; · payment systems operators or processors; · our existing or potential agents or business partners; · sponsors or promoters of any promotions or competition we run; · if we merge with, or are acquired by, another company, or sell all or a portion of our assets, your personal information may be disclosed to our advisers and any prospective purchaser’s advisers and may be among the assets transferred; · courts, tribunals and regulatory authorities, in the event you fail to pay for goods or services we have provided to you; · courts, tribunals, regulatory authorities and law enforcement officers, as required or authorised by law, in connection with any actual or prospective legal proceedings, or in order to establish, exercise or defend our legal rights; · third parties to collect and process data, such as analytics providers and cookies; and · any other third parties as required or permitted by law, such as where we receive a subpoena. Google Analytics: We have enabled Google Analytics Advertising Features. We and third-party vendors may use first-party cookies (such as the Google Analytics cookie) or other first-party identifiers, and third-party cookies (such as Google advertising cookies) or other third-party identifiers together. These cookies and identifiers may collect Technical and Usage Data about you. You can opt-out of Google Analytics Advertising Features including using a Google Analytics Opt-out Browser add-on found here. To opt-out of personalised ad delivery on the Google content network, please visit Google’s Ads Preferences Manager here or if you wish to opt-out permanently even when all cookies are deleted from your browser you can install their plugin here. To opt out of interest-based ads on mobile devices, please follow these instructions for your mobile device: On android open the Google Settings app on your device and select “ads” to control the settings. On iOS devices with iOS 6 and above use Apple’s advertising identifier. To learn more about limiting ad tracking using this identifier, visit the settings menu on your device. To find out how Google uses data when you use third party websites or applications, please see here. Overseas disclosure Australian Residents We may store personal information overseas. Where we disclose your personal information to third parties, those third parties may also store, transfer or access personal information outside of Australia. We will only disclose your personal information overseas in accordance with the Australian Privacy Principles. New Zealand Residents Where we disclose your personal information to third parties, those third parties may store, transfer or access personal information outside of New Zealand, which may not have an equivalent level of data protection laws as those in New Zealand. Before disclosing any personal information to an overseas recipient, we will comply with Information Privacy Principle 12 and only disclose the information if: · you have authorised the disclosure after we expressly informed you that the overseas recipient may not be required to protect the personal information in a way that, overall, provides comparable safeguards to those in the Privacy Act 2020; · we believe the overseas recipient is subject to the Privacy Act 2020; · we believe that the overseas recipient is subject to privacy laws that, overall, provide comparable safeguards to those in the Privacy Act 2020; · we believe that the overseas recipient is a participant in a prescribed binding scheme; · we believe that the overseas recipient is subject to privacy laws in a prescribed country; or · we otherwise believe that the overseas recipient is required to protect your personal information in a way that, overall, provides comparable safeguards to those in the Privacy Act 2020 (for example pursuant to a data transfer agreement entered into between us and the overseas recipient). Your rights and controlling your personal information Your choice: Please read this Privacy Policy carefully. If you provide personal information to us, you understand we will collect, hold, use and disclose your personal information in accordance with this Privacy Policy. You do not have to provide personal information to us, however, if you do not, it may affect our ability to do business with you. Information from third parties: If we receive personal information about you from a third party, we will protect it as set out in this Privacy Policy. If you are a third party providing personal information about somebody else, you represent and warrant that you have such person’s consent to provide the personal information to us. Restrict and unsubscribe: To object to processing for direct marketing/unsubscribe from our email database or opt-out of communications (including marketing communications), please contact us using the details below or opt-out using the opt-out facilities provided in the communication. Access: You may request access to the personal information that we hold about you. An administrative fee may be payable for the provision of such information. Please note, in some situations, we may be legally permitted to withhold access to your personal information. If we cannot provide access to your information, we will advise you as soon as reasonably possible and provide you with the reasons for our refusal and any mechanism available to complain about the refusal. If we can provide access to your information in another form that still meets your needs, then we will take reasonable steps to give you such access. Correction: If you believe that any information we hold about you is inaccurate, out of date, incomplete, irrelevant or misleading, please contact us using the details below. We will take reasonable steps to promptly correct any information found to be inaccurate, out of date, incomplete, irrelevant or misleading. Please note, in some situations, we may be legally permitted to not correct your personal information. If we cannot correct your information, we will advise you as soon as reasonably possible and provide you with the reasons for our refusal and any mechanism available to complain about the refusal. Complaints: If you wish to make a complaint, please contact us using the details below and provide us with full details of the complaint. We will promptly investigate your complaint and respond to you, in writing, setting out the outcome of our investigation and the steps we will take in response to your complaint. If you are not satisfied with our response, you may contact the Office of the Australian Information Commissioner (if you are an Australian resident), or the Office of the New Zealand Privacy Commissioner (if you are a New Zealand resident). Storage and security We are committed to ensuring that the personal information we collect is secure. In order to prevent unauthorised access or disclosure, we have put in place suitable physical, electronic and managerial procedures, to safeguard and secure personal information and protect it from misuse, interference, loss and unauthorised access, modification and disclosure. While we are committed to security, we cannot guarantee the security of any information that is transmitted to or by us over the Internet. The transmission and exchange of information is carried out at your own risk. Cookies We may use cookies on our website from time to time. Cookies are text files placed in your computer's browser to store your preferences. Cookies, by themselves, do not tell us your email address or other personally identifiable information. However, they do recognise you when you return to our online website and allow third parties to cause our advertisements to appear on your social media and online media feeds as part of our retargeting campaigns. If and when you choose to provide our online website with personal information, this information may be linked to the data stored in the cookie. You can block cookies by activating the setting on your browser that allows you to refuse the setting of all or some cookies. However, if you use your browser settings to block all cookies (including essential cookies) you may not be able to access all or parts o"
