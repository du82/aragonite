description = """
Synty® Studios Presents: POLYGON - Battle Royale Pack
A low poly asset pack of characters, props, weapons, vehicles and environment assets to create a Military themed polygonal style game.
Build the ultimate battlegrounds game with this solid modern warfare set. Modular sections are easy to piece together in a variety of combinations.Includes a demo scene
📦 Pack Content
509 unique assets with x24 alternative texture colours.Vehicles (x10) with Destroyed VersionsRigid Hull Boat, American Tank, Russian Tank, Motor Bike, Armoured Car, Light Armoured Car, Small Sedan, Army Truck, Large Cargo Plane, Buggy15 Characters with Alternative colours 70s Female, Business Male, Ghillie Suit, Goth Female, Mercenary Female, Mercenary Male, Military Female, Military Male, Redneck Male, Bra Female, Shirtless Male, Sporty Female x2, Sporty Male x2Ranged Weapons (x19) with 28 skinsGrenade Launcher, RPG, Assault Rifle (x4), Pistol (x3), Flare Gun, Machine Gun, Sniper (x4), Shotgun, Sub Machine Gun (x3)Melee weapons (x7)Fire Axe, Pick Axe, Crowbar, Frypan, Machete, Baseball Bat, Riot Shield
🤖 Technical Info
◼ Compatibility ◼- Character setup to work with Mecanim (no animations included in this pack)- View our tutorial on converting to the Universal Render Pipeline.- Compatible with Unity 2021.3+- Compatible with Unreal 4.25+

◼ License ◼


The following custom licence applies to this asset in addition to the Synty Store License Agreement.



END USER will be prohibited from using the asset license for the following products:



Creation of Non-Fungible-Tokens (NFT) and/or use in Blockchain based projects or products.


Creation of content for Metaverse-related and/or game creation software and products.


3D printing for commercial use.


 ***Contents may vary between engines. 
📋 Changelog
Version 1.8.2 (Unity)- Improved custom collision for road models- Fixed warning in demo scene- Added missing prefabs- Added overview map
Version 1.8.1 (Unity + Source Files)- Fixed issue with character fingers
Version 1.8.0 (Unity)- Added Unity 6 URP Extract Me
Version 1.7.1 (Unity)- Updated character FBX from ASCII to Binary
Version 1.7.0 (Unity)- Fixed issues with URP version of DamageZone shader- Added a Unity 2022 URP Extract me with Forward+ support- Removed shader errors if Amplify isn't installed
