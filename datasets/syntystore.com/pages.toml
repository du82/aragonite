["https://syntystore.com/blogs/blog/introducing-sidekick-character-creator"]
title = """
Introducing: Sidekick Character Creator
 – Synty Store"""
description = "A new era in character creation from Synty! A quick and easy modular character creator made for developers. What's available with the release version, and a sneak peek into future plans for the tool."
full_description = "Introducing: Sidekick Character Creator November 13, 2024 Share Share Link Close share Copy link Welcome to Sidekicks! We're thrilled to introduce a new era in character creation from Synty, the Sidekick Character Creator – the ultimate character creation companion for game developers using Unity. In this blog, we're diving into what's included with v1.0 of Sidekicks (as we affectionately refer to it!) launching today, and giving you a glimpse at our future plans. Sidekicks is a modular character creation tool designed for game developers. Launching with 1,400+ parts which you can easily mix and match to create an endless variety of characters, at the click of a button. Sidekicks offers powerful tooling that allows you to create incredible custom characters, as well as expert presets to make generating characters a breeze. The character themes currently available with Sidekicks are 'Apocalyptic', 'Sci-Fi', 'Fantasy' and 'Historical', designed to work consistently with Synty's POLYGON environments. Within those themes, the Sidekicks team plans characters at a detailed level to ensure a wide variety of parts for you to create with. In the launch version of Sidekicks, you'll find parts to create sci-fi soldiers, goblin fighters, apocalypse outlaws, and pirate captains. But keep in mind, the Sidekicks tool was designed for flexibility! The modular system allows you to easily snap parts together and make something truly unique for your in-game world. Sci-fi pirates, apocalyptic goblins, sci-fi outlaws, and more are all possible with Sidekicks. An Ever-Growing Collection of Modular Parts Take a closer look at just some of the parts currently available in Sidekicks. Powerful Tooling Alongside the vast array of parts, the powerful Sidekicks tool, built for Unity, brings even more diversity and personality to your characters. Seamlessly blend between masculine, feminine, slim, heavy, and muscular body types for your characters, select the custom colours you want, change their species instantly, and play with their expressions using the facial blend shapes. Future Concepts and Updates The team at Synty are incredibly excited about the future of Sidekicks. We have a lot of concepts in the pipeline for new themes, parts, and tooling features we're already working on, and we're excited to share a glimpse of our future plans with you today! Below you'll find some concept art and model mock-ups for planned future Sidekicks content. There's a lot of variety in the works, with thousands of new parts designed to work across a broad scope of game themes and character types, so you can build and customise everything from heroes to enemies to NPCs. You can look forward to ongoing updates, with new part drops and exciting new tool features, on a regular basis. We're excited to expand the collection of parts available, as well as introduce new character themes to Sidekicks including (but not limited to!) vikings, zombies, knights, samurai, and elves. Getting Started with Sidekicks If you've just discovered Sidekicks, or want to find out more about exactly how it all works in Unity, we've put together a short video guide to getting started. While the Synty team has a bunch of ideas for exciting new features and content to make Sidekicks the ultimate character solution for games, we would really love for you to join our Community Discord to share your feedback, and what you're most excited to see added to Sidekicks in future! Please note that currently, Sidekicks is available for Unity only, and although we would love to bring it to other engines in the future we don't currently have any timeline to share. The Sidekick Character Creator is available exclusively with Synty's All Access Pass. If you'd like more information about Sidekicks, head over to the landing page and FAQ to learn more. Back to blog"
