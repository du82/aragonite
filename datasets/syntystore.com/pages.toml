["https://syntystore.com/blogs/blog/happy-holidays-2024"]
title = """
Happy Holidays: 2024 Hghlights & Our Gift To You
 – Synty Store"""
description = "Take a look back at 2024’s highlights from the team at Synty and our growing game dev community. Includes a small gift of appreciation for our community."
full_description = "Happy Holidays: 2024 highlights & our gift to you! December 11, 2024 Share Share Link Close share Copy link With the end of the year fast approaching, it’s time to take stock of 2024’s highlights. First things first, we’d like to thank YOU for being part of the Synty community this year! Here’s a bit of a look back at the highlights of 2024, before we round out the year with a little gift. By rough calculations, the Synty team modelled 7,000+ assets, icons, sprites and animations in 2024, in the process of releasing 11 brand new packs. This included 5 new POLYGON packs, 3 new INTERFACE packs and 3 new ANIMATION packs. Standout highlights were Apocalypse Wasteland, one of the biggest and most detailed POLYGON packs we’ve ever created, Fantasy Warrior HUD and Military Combat HUD, both of which introduced brand new genres to our INTERFACE library, and Base Locomotion, Synty’s first leap into the ANIMATION realm. This year we also introduced the Synty All Access Pass with the goal of helping even more developers make games more easily, as well as our new era in character creation with Sidekick Character Creator. We’re proud of our innovation as an asset publisher, and we’re incredibly grateful for the feedback and ongoing support of the Synty community. Speaking of the Synty community, you grew in numbers this year with more than 3,000 new members, and over 120,000 chat messages sent in the community Discord server! We shared 18 livestreams together, and you created 140 total entries across both our image and game jams. Give yourself a pat on the back! Speaking of livestreams, join us next week for our special end of year celebration stream on Monday 16th December NZT, be sure to follow us on Twitch and YouTube, and stay tuned for details via Discord. Thanks to your support of our Humble Bundles, this year we’re also proud to have raised over US$38,000 for charity together! In January we raised over US$22,000 for Girls Who Code, and in September we raised over US$16,000 for Safe in Our World. 2024 was also the year Synty turned 10! We celebrated with an image jam, and reflected on a whole decade of creation. If you’d like to take another walk down memory lane before the year comes to a close, check out Tim Hanslow’s amazing timeline of the history of Synty, which was kindly made in celebration of our 10th birthday. Last but certainly not least, it wouldn’t be the holiday season without a gift now would it… As a token of our appreciation, we've created a free, holiday themed set – POLYGON - Holiday Gnomes – which you can download right now. Inside you’ll find 8 gnomes, with a Synty spin on their classic charm of course! Believed to bring good luck, joy, and a dash of intrigue, may these gnomes sprinkle a little magic into your projects and brighten your adventures. We're so grateful to play a part in your development journey, big or small, and we want to wish you a very happy and safe holiday season. See you next year! Back to blog"
year_published = 2024
year_updated = 2024
clearnet = "https://syntystore.com/blogs/blog/happy-holidays-2024"
