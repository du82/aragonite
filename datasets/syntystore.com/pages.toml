["https://syntystore.com/blogs/blog/showcase-10th-birthday-image-jam"]
title = """
Showcase: 10th Birthday Image Jam | Synty® Official Store
 – Synty Store"""
description = "Celebrate 10 years of creativity with our Image Jam showcase. Explore stunning visuals and stories from talented artists at Synty's special birthday event."
full_description = "Showcase: 10th Birthday Image Jam July 31, 2024 Share Share Link Close share Copy link As part of our 10th birthday celebrations, we hosted a 10-day image jam with the theme “A Portal Through Time.” We received so many amazing entries, with a variety of creative and unique takes on the theme! Winners were decided by the Synty team, based on best interpretations of the theme and which were most visually engaging. Below is a showcase of the winning entries, as well as three of honourable mentions we wanted to call out! Honourable Mentions First up, our three honourable mentions... Our first honourable mention goes to TimW for their rendition of founders Mike and Andrew working on the very first Synty pack, Simple Town. Second honourable mention goes to carlosoce’s detailed showcase of the varied history of Synty’s expansive library in a very vibrant style. And our last honourable mention for this jam goes to NoiseCrime’s submission, showing off a few distinct Synty themes coming together through three massive portals. Winners And now, a drumroll for our three winners please, in no particular order… XboxSignsOut for their submission with incredible depth and detail. The Synty team also really liked their outline shader style, different use of perspective and aspect ratio – this entry would make an epic desktop background! Swerszcz for their unique take on the theme, with a less explicit interpretation of the ‘portal’ concept featuring memories in the form of photographs. While a subtle image overall, there’s a lot of depth and detail packed into each memory/photograph. And last but certainly not least, Loran’s polished entry, showcasing Sci-Fi Soldier HUD in a videogame-like still featuring a big time portal, a mini view to the past, and a big mech in the background! A super dynamic and engaging image. Congratulations to all the winners and a big thank you to everyone who entered our Birthday Image Jam! We had so much fun seeing how the community interpreted the theme, and appreciate all your hard work in producing such high quality entries. We hope you had fun and maybe even learned something new in the process! If you’d like to take part in future Synty Image or Game Jams, be sure to join our community of thousands of aspiring and professional developers on Discord! And stay tuned for announcements on our social channels – Facebook, Instagram and X. Back to blog"
