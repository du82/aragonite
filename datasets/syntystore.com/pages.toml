therwise comply with the terms of this Agreement); and (c) the creation of promotional or marketing materials for your Products,(collectively, the Authorised Purpose). 1.4 You may not use our Assets for the following purposes: (a) development of or in connection with generative AI (including as input for generative AI), stock images or stock art (2D or 3D), stock video, distribution on an Asset Marketplace; (b) the creation of promotional or marketing materials for a purpose that is not the Authorised Purpose; or (c) to pitch, fundraise, or crowdfund for a purpose that is not the Authorised Purpose. 1.5 You may not use the Assets for the creation and development of, or use within: (a) Non-Fungible Tokens (NFT); and (b) Block-chain based products or projects. 1.6 You may not use our Assets for the creation and development of Content Creation Systems. 1.7 For the avoidance of doubt, you may use our Assets to create user generated content within a Content Creation System provided that you are not the developer or owner of the Content Creation System and you otherwise comply with the terms of this Agreement. 1.8 We may change the scope of the Authorised Purpose (as set out in clause 1.3) from time to time and with 30 days prior written notice. Where you reject any change to the scope of the Authorised Purpose, you reserve the right to terminate this Agreement in accordance with clause 12.6(c). 1.9 If you require Support Services, you may request these by getting in touch with us via our website. 1.10 Unless we agree otherwise, Support Services cannot be used to support any other products or services, and does not include training, installation of software or hardware, software development or the modification, deletion or recovery of data or any on-site services. 1.11 Additional Services: If you require additional services, we may, in our sole discretion, provide such additional services (to be scoped and priced in a separate contract provided by us). 1.12 Third Party Pr