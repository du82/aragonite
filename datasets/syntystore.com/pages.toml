 – Synty Store"""
description = """
Synty® Studios presents:  ANIMATION - Sword Combat
A specialised Synty ANIMATION pack! 

This pack features meticulously hand-crafted animations that will accelerate your workflow by providing a cohesive collection of motions, designed to integrate easily with other Synty ANIMATION packages.
Complete with 105 Sword Combat essential animations – including light and heavy attacks, fabulous flourishes, dramatic deaths, lively leaps and more. Each with multiple animations and smooth transitions so your characters will move with ease. 
Witness your characters come to life with immersive fluidity as you unleash the power of sword combat into your creations!
◼ Key Features ◼
Animation Sets105 Sword Combat animation FBX files, including RootMotion versions, designed for a complete combat system with smooth blending and transitions. Each animation is a separate file, allowing you to import only the animations you need into your project. 
Gallery SceneWe’ve included a scene featuring all the animations as a separate asset, so you can easily view each individual animation.
Works with ANIMATION - Base LocomotionThis pack includes documentation to guide you on how to blend Sword Combat with Synty’s Base Locomotion animations.

*Contents may vary between engines. 
🔍 FAQs
Q: Does this pack work with Mecanim?A: Yes! However, this pack only supports standard POLYGON characters, POLYGON Kids, and POLYGON Big Rig characters. ANIMATION - Swords Combat animations make use of a prop bone, an extra bone added to the hand. You may need to retarget the animations using third-party tools to get the prop bone to animate correctly on other characters. 
Q: Can I use this pack with ANIMATION - Base Locomotion?A: Yes, documentation is provided to guide you in blending ANIMATION - Sword Combat with ANIMATION - Base Locomotion. There's an example animation controller included in the pack, as well as transition animations for integration with Base Locomotion.
Q: Do these animations work with characters in Synty POLYGON packs?A: Yes! These animations are designed to work with standard POLYGON characters, POLYGON Kids, and POLYGON Big Rig characters. 
Q: Do these animations work with characters in Synty SIMPLE packs?A: No, these animations do not work with SIMPLE characters. 
Q: Can I use the animations on my own custom rig?A: ANIMATION - Swords Combat animations make use of a prop bone, an extra bone added to the hand. You may need to retarget the animations using third-party tools to get the prop bone to animate correctly on other character rigs even when using mecanim. 
Q: Does this pack support Unreal Engine?A: This pack does not officially support Unreal Engine. There is currently no timeline for Unreal Engine support for Synty ANIMATION products.
Q: Can the animations be used in Unreal?A: Even though Unreal Engine is not officially supported, you can import the animation FBX files into Unreal Engine, retarget them using the Unreal animations tool, and use them on the Unreal Mannequin. However no Synty support is currently offered for this.
