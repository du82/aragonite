["https://syntystore.com/products/animation-goblin-locomotion"]
title = """
ANIMATION | Goblin Locomotion Pack | Synty™ Official Store
 – Synty Store"""
description = """
Synty® Studios presents: ANIMATION - Goblin Locomotion







 
Welcome to Goblin Locomotion, a specialised animation pack delivering a dynamic range of movements for your goblin characters.
Watch your goblin characters leap (or stumble) into action with vibrant, expressive motions that inject energy and creativity into your gameplay, elevating both the characters and the world they inhabit.
Featuring high quality locomotion animations with each state meticulously crafted. This set comes complete with multiple animations and smooth transitions, offering a versatile collection of movement to bring your goblins to life with fluidity and personality.
Dive into the Mecanim Animation Controllers included in this pack and unlock a treasure trove of knowledge on setting up animation states, transitions, blend trees, and parameters. Whether you're a seasoned pro or an aspiring developer, our resources provide the perfect launchpad for crafting your own unique animation controller.Don't just make characters – make them come alive with Synty's Animation - Goblin Locomotion. Transport your players into a world where every step, jump, and slide feels like magic.


◼ Key Features ◼



398 animation clips, including POLYGON and Sidekicks variants, as separate files allowing you to selectively import the animations you need into your project
Character controller example scripts
Mecanim animation controller
Demo scenes to test the animations

Gallery scenes with all the animations laid out


POLYGON and Sidekicks crash dummy characters, fully rigged and animated

Built for Unity, FBX files included
Polygon and Sidekick crash dummy model and animation controller demo scenes included!

🔍 FAQs
Q: Does this pack work with Unity’s Mecanim Animation System?A: Yes! 
Q: Do these animations work with characters in Synty POLYGON packs?A: Yes! These animations are designed to work with standard POLYGON characters, POLYGON Kids, and POLYGON Big Rig characters, all through Mecanim 
Q: Do these animations work with Synty Sidekicks characters?A: Yes! There is a full set of Sidekick-specific versions included.
Q: Do these animations work with characters in Synty SIMPLE packs?A: These animations are not designed specifically to work with SIMPLE characters, but should still work when retargeted using Mecanim. 
Q: Can I use these animations on my own custom rig?A: Only POLYGON/Sidekick rigs and retargeting using Mecanim are officially supported. 
Q: Does this pack support Unreal Engine?A: This pack does not officially support Unreal Engine. There is currently no timeline for Unreal Engine support for Synty ANIMATION products.
Q: Can the animations be used in Unreal Engine?A: Even though Unreal Engine is not officially supported, you can import the animation FBX files into Unreal Engine, retarget them using the Unreal animations tool, and use them on the Unreal Mannequin. However no official Synty support is currently offered for this.
📦 Pack Content
◼ Asset List ◼
1x POLYGON dummy and 1x Sidekicks dummy.
◼ Animations ◼
Leaning, rest, crouching, fidgeting, falling, jumping, landing, turning, sprinting, running, stumbling, standing, walking, looking, transitions.
