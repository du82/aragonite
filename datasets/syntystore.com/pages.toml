a.5.5 0 00.708 0l4-4a.5.5 0 000-.708z" fill="currentColor"> </svg> </div> </div> 5 seats per quantity - One Time Purchase Licence (0 in cart) Decrease quantity for ANIMATION - Idles Increase quantity for ANIMATION - Idles Add to cart Couldn't load pickup availability Refresh .all-access-banner-image { margin: -10px -10% -7% -3%; width: 105%; } .all-access-banner { position: relative; margin: 0px; width: 100%; } .all-access-banner-content p { width: 70%; max-width: 340px; margin: 0; } Unlock ANIMATION - Idles and the entire Synty library of 130+ art, animation and UI packs with plans starting at $30 USD/mo. Synty® Studios presents: ANIMATION – Idles Welcome to Idles, a specialised animation pack designed to give your characters quirky behavioural traits to bring life to your environment and depth to your worlds. Perfect for that village full of quest-givers, or to have your hero wait with flair. Featuring meticulously crafted idle animations, this pack will accelerate your workflow by providing a cohesive collection of motions to elevate humanoid character performances. Your characters may be idle, but they don't need to be boring! ◼ Key Features ◼ Animation Sets330 Idle animation FBX files, including RootMotion versions, designed for a complete combat system with smooth blending and transitions. Includes both masculine and feminine. Each animation is a separate file, allowing you to import only the animations you need into your project. Works with Synty's ANIMATION - Base Locomotion and Unity's Mecanim This pack includes documentation to guide you on how to blend Idles with Synty’s Base Locomotion animations. Gallery SceneWe’ve included a scene featuring all the animations as a separate asset, so you can easily view each individual animation. 🔍 FAQs Q: Does this pack work with Unity’s Mecanim Animation System?A: Yes! Q: Can I use this pack with Synty’s ANIMATION - Base Locomotion?A: Yes, documentation is provided to guide you in blending ANIMATION - Idles with ANIMATION - Base Locomotion. There's an example animation controller included in the Base Locomotion pack, as well as transition animations for integration with Base Locomotion. Q: Do these animations work with characters in Synty POLYGON packs?A: Yes! These animations are designed to work with standard POLYGON characters, POLYGON Kids, and POLYGON Big Rig characters. Q: Do these animations work with characters in Synty SIMPLE packs?A: These animations are not designed specifically to work with SIMPLE characters, but should still work when retargeted using Mecanim. Q: Can I use these animations on my own custom rig?A: Only POLYGON rigs and retargeting using Mecanim are officially supported. Q: Does this pack support Unreal Engine?A: This pack does not officially support Unreal Engine. There is currently no timeline for Unreal Engine support for Synty ANIMATION products. Q: Can the animations be used in Unreal Engine?A: Even though Unreal Engine is not officially supported, you can import the animation FBX files into Unreal Engine, retarget them using the Unreal animations tool, and use them on the Unreal Mannequin. However no official Synty support is currently offered for this. 📦 Pack Content ◼ Asset List ◼ Synty POLYGON dummy ◼ Animations ◼ Arms Folded, Boredom, Check Watch, Drinking, Eating, Hands On Hips, Head Nods, Head Shakes, Inspecting, Leaning, Looking, Picking Nose, Play With Hairs, Pleading, Pointing, Postures, Praying, Stretching, Swaying, Thoughtful, Using Phone, Waving, Weight Shift, Yawning. ArmsFolded A_POLY_IDL_ArmsFolded_Casual_Enter_Femn.fbx A_POLY_IDL_ArmsFolded_Casual_Exit_Femn.fbx A_POLY_IDL_ArmsFolded_Casual_Loop_Femn.fbx A_POLY_IDL_ArmsFolded_Grumpy_Enter_Femn.fbx A_POLY_IDL_ArmsFolded_Grumpy_Exit_Femn.fbx A_POLY_IDL_ArmsFolded_Grumpy_Loop_Femn.fbx A_POLY_IDL_ArmsFolded_Casual_Enter_Masc.fbx A_POLY_IDL_ArmsFolded_Casual_Exit_Masc.fbx A_POLY_IDL_ArmsFolded_Casual_Loop_Masc.fbx A_POLY_IDL_ArmsFolded_Grumpy_Enter_Masc.fbx A_POLY_IDL_ArmsFolded_Grumpy