title = """
Sidekicks Drop 01 | Synty® Blog
 – Synty Store"""
description = "Sidekicks Drop 01 puts a new collection of fierce Viking Warriors into your character creation arsenal! Gear up for battle with brand new parts and a runtime functionality update."
full_description = "Sidekicks Drop 01 February 13, 2025 Share Share Link Close share Copy link Welcome to Drop 01: 'Viking Warriors' & Tool Updates Releasing today, Sidekicks Drop 01 puts a new collection of fierce Viking Warriors into your character creation arsenal! Gear up for battle with brand new parts including helmets, weapons, furs and more, designed to deliver the menacing warrior your project needs. Runtime Functionality Update Alongside the Viking Warriors content Drop we are very excited to be adding runtime character creation functionality to the Sidekick Character Creator tool! While currently a highly technical solution, this update will enable you to build a character creator in game. We know this is something a lot of people had been asking for, and we're looking forward to continuing to make improvements to this function in future updates. You can find more in-depth information about the runtime functionality updates in the Sidekicks Changelog. If you're already an All Access Pass or Sidekicks subscriber, these updates are live now and available via your My Downloads page. Sidekicks Spotlight Stream Come along to our next Sidekicks Spotlight livestream on Twitch or YouTube on Feb 17 at 11am NZT to get a closer look at the Viking Warriors update, see the characters in action working with our latest POLYGON - Viking Realm pack, and get insight into what future updates the Sidekicks team are working on. Learn more about Sidekick Character Creator on the Synty Store. Sidekicks is exclusively included in our All Access Pass, or available as a standalone monthly subscription. Dive into our Sidekicks channel on the Synty Discord with questions or to showcase your work! Back to blog"
