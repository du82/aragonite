description = """
Synty® Studios presents: POLYGON - Military Pack
An absolutely massive low poly asset pack to build your dream game! No need to scour the store looking for packs that match, this is an extremely comprehensive asset pack for all your military needs.
OVER 1500 Detailed prefabs are included with this pack.
◼ Key Features ◼- Fully Modular Weapon System- Super Customizable Characters- Desert Themed Buildings and Environments- Buildings have enter-able Interiors!- Full Military Arsenal!- Includes a MASSIVE demo scene - (Character poses indicative only)
*Contents may vary between engines. 
📦 Pack Content
An extensive demo scene including a desert themed village with the stage set for combat
◼ Assets ◼Characters (x23)- Bomb suit Male, Civilian Female 01, Civilian Female 02, Civilian Male 01, Civilian Male 02, Contractor Female 01, Contractor Male 01, Contractor Male 02, Ghillie suit Male, Insurgent Female 01, Insurgent Female 02, Insurgent Male 01, Insurgent Male 02, Insurgent Male 03, Insurgent Male 04, Insurgent Male 05, Leader, Pilot Female 01, Pilot Male 01, Soldier Female 01, Soldier Female 02, Soldier Male 01, Soldier Male 02.- Plus x10 Soldier Preset CharactersCharacter Attachments (x169)- Backpacks, Beards, Hair, Hats, Helmets, Pouches, Weapon Accessories, etc.Vehicles (x27)- Tanks, APCs, Helicopters, Jets, Trucks, Vans, Cars, Motorbike etcVehicle Attachments (x56 )- Aerials, Cloth, Containers, Canopies, Armor, Lights, Flares, etcWeapons (x20)- Pistols, Shotgun, LMGs, Rifles, ARs, Rocket Launchers, Knives, Grenades/Explosives etcWeapon Attachments (x84)Weapons (x20)Bi-pods, Flashlights, Fore-grips, Muzzle Breaks, Suppressors, Rails, Under-barrels, Scopes, Cross-hairs, etcModular Weapon Pieces (x92)- Fully modular weapon parts including Barrels, Bodies, Grips, Hand-guards, Handles, Iron-sights, Magazines, Rails, Stocks, Triggers, etcModular Weapon Presets (x14)- Heavies, AR's, SMG's, and SnipersBuildings, with interiors (x197)- Shops, Village Houses, Doors, Ruins, Monuments, Tents, Barracks. Hangars, Guard Towers, Oil Rigs, Pipelines etc
Environment (x114)- Bushes, Cacti, Grasses, Ferns, Flowers, Trees, Roads (Dirt and Paved), Grounds, Sand Dunes, Pebbles, Rocks, Mountains, Ruins, Helipad, Runway, Sidewalks, etcProps (x626)- Aircons, Ammo, Antenna, Barrels, Barriers, Baskets, Beds, Blood pools, Books, Boxes/Crates, IEDs/Explosives, Carts, Chairs, Tables, Shop Items, Pipes, Electronics, Fences/Walls, Gym Equipment, IEDs, Lights/Lamps, Money Stacks, Plates/Pots, Powerboxes/Powerlines, Rubbish/Debris, Sacks, Satellite Dishes, Statues, Wardrobes/Lockers, Water Tanks, Missile/Launchers, Radios, Radar, Military Control Rooms, Oil Pipelines/Tanks/Pumps, Rugs, Signs, Posters, Flags, etcItems (x39)- Battery, Binoculars, Book, Bullets, Cans, Canteen, Cigarette, Clipboard, Crowbar, Earmuffs, Masks, Goggles, Laptop, Food, Pencil, Pouches, Sunglasses, Tape, Radios, etcFX and Decals (x31)Bullet Hit Decals, Blood Splatter, Dusts, Smokes, Fires, Gunshots, Explosions, Jet Booster, etc
🤖 Technical Info
◼ Compatibility ◼- View our tutorial on converting to the Universal Render Pipeline.- Characters are setup to work with Mecanim (no animations included in this pack)- Compatible with Unity 2021.3+- Compatible with Unreal 4.26 - 5.4
◼ File Formats ◼- Unity 2021.3 Package- Unreal 4.26, 5.0, 5.1, 5.2, 5.3, 5.4 Project- Source Files (.fbx, .obj)
📋 Change Log
Version 1.9.2 (Unity)- Added overview map
Version 1.9.1 (Unity) + v4 Source FilesFixed issues with the following models:SM_Bld_Destroyed_01SM_Bld_Destroyed_02SM_Bld_Shop_02SM_Bld_Shop_02_DestroyedSM_Bld_Shop_03SM_Bld_Shop_03_DestroyedSM_Bld_Shop_01_Destroyed
Added missing prefabs for:- SM_Env_Ground_Round_04- SM_Bld_Shop_12 & 13- SM_Bld_Window_Bars_01, 02 & 03
Version 1.9.0 (Unreal)- Ported pack to 4.26, 5.0, 5.1, 5.2, 5.3 & 5.4. - Convert Cascade particle effects to Niagara. - Convert characters to the UE4 mannequin rig. 
Version 1.8.1 (Unreal + Source Files)- Updated new skeleton to fix pelvis bone issue
Version 1.8.0 (Unreal + Source Files)- New_Characters folder added to the project with ready to use characters.- New Unreal characters added to the source files
Version 1.9.0 (Unity)- Fixed issues with project structure
Version 1.8.0 (Unity)- General pack cleanupVersion 1.6.0 (Unity)- Fixed Flap_Tail pivot points on Veh_Drone_01- Fixed texture issue with SM_Prop_Gunlocker_01"""
