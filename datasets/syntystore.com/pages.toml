ANIMATION | Base Locomotion Asset Pack | Synty™ Official Store
 – Synty Store"""
description = """
Synty® Studios presents:  ANIMATION - Base Locomotion
Elevate your game to new heights with the dynamic motion of Synty's Animation - Base Locomotion. Bring your characters life with fluid movement and seamless transitions. Say goodbye to the hassle of sourcing animations from all over the internet and constructing your controller from scratch – our comprehensive pack equips you with everything you need to bring your characters to life in no time.
This powerhouse pack is brimming with essential animations for every common character motion need – from leisurely walks to adrenaline-pumping sprints, graceful jumps to heart-racing slides. With each state meticulously crafted, complete with multiple animations and smooth transitions, your characters will move with unparalleled grace.But wait, there's more! We've gone the extra mile by providing animations for both masculine and feminine figures, ensuring that your game's characters exude authenticity and diversity. With the ability to seamlessly blend between the two, the possibilities for character expression and personality are limitless.

Dive deep into the Mecanim Animation Controllers included in this pack and unlock a treasure trove of knowledge on setting up animation states, transitions, blend trees, and parameters. Whether you're a seasoned pro or a budding developer, these resources provide the perfect launchpad for crafting your own unique animation controller.Don't just make games – make them come alive with Synty's Animation - Base Locomotion. Your players won't just play; they'll be transported into a world where every step, jump, and slide feels like magic.◼ Key Features ◼

247 Animation clips as separate files allow you to to only import the animations you need into your project

Character controller example scripts
Mecanim animation controllers - Masculine and Feminine
Demo scene to test the animations
Gallery scene with all the animations laid out
Crash dummy character - fully rigged and animated
All animations FBX files are included so you can use them outside of Unity

🔍 FAQs
◼ Unity ◼Q: Does the pack work with Mecanim?A: Yes! This pack is designed to work with the Mecanim humanoid avatar.
Q: Do these animations work with characters in Synty POLYGON packs?A: Yes! These animations are designed to work with POLYGON characters, and any  characters that work with the Mecanim humanoid avatar.Q: Do these animations work with characters in Synty Simple packs?A: Yes! These animations are designed to work with Simple characters, and any  characters that work with the Mecanim humanoid avatar.Q: Can I use the animations in this pack for my commercial game or project?A: Yes, all Synty assets on Synty Store allow you to use them for commercial purposes royalty free (some exclusions apply, Please read our EULA) ◼ Unreal◼ Q: Does this pack support Unreal Engine?A: Currently this pack does not officially support Unreal Engine. There is no timeline for Unreal Engine support, but we will support Unreal Engine in the future.Q: Can the animations be used in Unreal?A:  Even though Unreal Engine is not officially supported you can import the aniamtion FBX files (included as a zip) into Unreal Engine retarget them using the Unreal animations tool and use them on the Unreal Mannequin. However no support is currently offered for this.
📦 Pack Content
◼ Asset List ◼ Polygon Synty Character, Background, Generic Skydome, Obstacles (x11 + collision), Perimeter (x1 + collision), Target.◼ Feminine and Masculine Animations ◼ IdleCrouch, Standing.In AirFall Large, Fall Short, Jump Idle, Jump Running, Jump Sprinting, Jump Walking, Land Idle Hard, Land Idle Medium, Land Idle Soft.Crouch/StrafeBack Strafe B, Back Strafe BL, Back Strafe BR, Back Strafe FL, Back Strafe L, Forward Strafe BR, Forward Strafe F, Forward Strafe FL, Forward Strafe FR, Forward Strafe R.RunBack Strafe B, Back Strafe BL, Back Strafe BR, Back Strafe FL, Back Strafe L, Back Strafe R, Foward, Forward Strafe BR, Forward Strafe F, Forward Strafe FL, Forward Strafe FR, Forward Strafe L, Forward Strafe R, Down 25F, Up 25F.ShuffleCrouching B, Crouching F, Crouching L, Crouching R, Standing B, Standing F, Standing L, Standing R.SprintDown 25F, F, Up 25F.TurnCrouching 90 L, Crouching 90 L Root Motion, Crouching 90 R, Crouching 90 R Root Motion, Standing 90 L, Standing 90 L Root Motion, Standing 90 R, Standing 90 R Root Motion, Standing 180 L, Standing 180 L Root Motion, Standing 180 R, Standing 180 R Root Motion.WalkBack Strafe B, Back Strafe BL, Back Strafe BR, Back Strafe FL, Back Strafe L, Back Strafe R, Down 25F, Forward, Forward Strafe BR, Forward Strafe BR, Forward Strafe F, Forward Strafe FL, Forward Strafe FR, Forward Strafe L, Forward Strafe R, Up 25F.TransitionCrouch to Stand, Idle to Run 90L, Idle to Run 90L Root Motion, Idle to Run 90R, Idle to Run 90R Root Motion, Idle to Run 180L, Idle to Run 180L Root Motion, Idle to Run 180R, Idle to Run 180R Root Motion, Idle to Run F, Idle to Run F Root Motion, Idle to Walk 90L, Idle to Walk 90L Root Motion, Idle to Walk 90R, Idle to Walk 90R Root Motion, Idle to Walk 180L, Idle to Walk 180L Root Motion, Idle to Walk 180R, Idle to Walk 180R Root Motion, Idle to Walk F, Idle to Walk F Root Motion, Run to Idle F LFoot, Run to Idle F LFoot Root Motion, Run to Idle F RFoot, Run to Idle F RFoot Root Motion, Sprint to Crouch, Sprint to Crouch Root Motion, Stand to Crouch, Walk to Idle F LFoot, Walk to Idle F LFoot Root Motion, Walk to Idle F RFoot, Walk to Idle F RFoot Root Motion.◼ Neutral Additive Animations ◼ Lean, Body Look, Head Look, TPose.
🤖 Technical Info
◼ Compatibility ◼- Compatible with Unity 2021.1.0+- Unity Render Pipeline Support:

Standard
URP
HDRP

◼ File Formats ◼- Unity 2021.1 package- Animation zip file
◼ Compatibility Warning◼- Unreal Engine: Unreal is not supported. Until we announce an Unreal release there is no timeline on when or if Unreal support will arrive in the future.
📋 Changelog
V3 (Source Files)- Added modular character to source files
Version 1.1.1 (Unity)- Updated folder structure- Added Sidekick animations to source files
Version 1.1.0 (Unity)- Updated InAir and Additive animations- Updated transition animations- Fixed slide animation- Added additional root motion animations- Added modular character animations- Added modular character demo and gallery scenes- Added modular character controller- Lowered default mouse sensitivity value
Version 1.0.4 (Unity)- Fixed sample player input controls not re-enabling
Version 1.0.3 (Unity)- Fixed package import hierarchy
Version 1.0.2 (Unity + Source Files)- Added Root motion animations- Added Vertical Root motion jump animations
Version 1.0.1 (Unity)- Fixed DemoChr_Sprint_ToCrouch offset
Version 1.0.0 (Unity)- Initial release"""
