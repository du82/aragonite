["https://syntystore.com/blogs/blog/announcing-our-first-image-jam-of-2025"]
title = """
Announcing Our First Image Jam of 2025
 – Synty Store"""
description = "We're announcing the date for the first Synty Image Jam of 2025! Wondering what an image jam is? We’ve got you covered, plus answers to some of your top questions"
full_description = "Announcing our first Image Jam of 2025 January 29, 2025 Share Share Link Close share Copy link We’re kicking off 2025 with a bang! Very excited to announce that our next Synty Image Jam will be taking place from February 11-25 NZT. The theme for the image jam will be announced the day the jam kicks off. A little birdie also tells us that this Image Jam might just happen to align with our upcoming Synty Super Sale, where you could grab up to 50% off storewide to pick up some new assets to utilise in your entry. We’ll be announcing our Image Jam winners on Monday 3 March NZT, so make sure you’re following us on Twitch or YouTube! If you’d like to see some examples of previous entries, check out this blog showcasing our most recent Image Jam winners. Read on for some more information, entry rules, and other frequently asked questions. What is an Image Jam? You might be more familiar with the concept of a game jam, where individuals and teams come together across a specific time period to produce a small game concept. An image jam operates similarly, however the output is a static image rather than a game, and we allow for image jam entries from individuals only. If you haven’t taken part in an image jam before, we highly recommend giving it a go! Pushing your ideas conceptually in order to create a captivating, single screenshot image is a fantastic way to stretch your creative skills. And if game jams are just more your thing, don’t worry, we’ll have something for you in the coming months too! FAQ How do I participate? Our Image Jams happen inside our Discord community server. If you’d like to join the Image Jam, you’ll need to join our server and entries must be uploaded and submitted to the ⁠’synty-jam’ channel before the cut off time advised. Are there prizes? There will be three category focused winners for this image jam, who will each receive US$75 Synty Store credit. How are the entries judged? We will have three categories, and will have one winner in each! The categories will be announced alongside the theme. What are the rules? It is mandatory to follow the theme given for the Jam.Only Synty models may be used (kitbashing is allowed as long as you can visually tell that the models used are Synty models). You cannot use any projects you have started previously. Your submission must be created from scratch and submitted before the deadline of the jam. We will not accept late submissions. NSFW material is not allowed, please keep it clean (PG13). There are no limitations on what engine you use. Your final entry image must be submitted as a PNG or JPG. Only one submission per person is allowed. By submitting your content, you agree that we (Synty) can use your content in our marketing materials, including but not limited to on our social media and blog. Back to blog"
