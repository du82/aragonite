["https://syntystore.com/blogs/blog/sidekicks-community-update"]
title = """
Sidekicks Community Update
 – Synty Store"""
description = "Based on community feedback, we have some changes to share, as well as some clarifications we’d like to highlight regarding the Sidekick Character Creator."
full_description = "Sidekicks Community Update November 15, 2024 Share Share Link Close share Copy link Earlier this week we released our new Sidekicks Character Creator. If you missed the release, you can read our introductory blog post covering the content the tool is launching with, and a glimpse at future updates. We'd like to thank our community for their feedback following the launch, we have been listening and collating, and we are deeply appreciative of those who have taken the time to share their thoughts. Based on this feedback, we have some changes to share, as well as some clarifications we’d like to highlight. All Access Pass Seat Count While our intention was to simplify things by offering single seats, we hear you and understand that this has instead led to a lack of certainty. To increase flexibility for those working in small teams, we will be increasing the All Access Pass standard subscription licence from 1 seat to 5 seats. Sidekicks Only Subscription We have seen a lot of feedback from those who would prefer access to the Sidekick Character Creator separately. While we believe the All Access Pass will ultimately be the long-term, best value option, we hear your concerns and want to offer a standalone option. This 'Sidekicks Only Subscription' will be $20 USD/month for 5 seats. This will be a monthly subscription only, we will not have an annual plan option. We need some time to work on the technical delivery of this and estimate this option will be live at the end of November. Pricing Freeze If you subscribe to All Access Pass or Sidekicks by the end of 2024, your pricing will be guaranteed not to increase, as long as you remain subscribed. Future Exclusivity Concerns All current and future POLYGON packs will remain available for one-time purchase and will NEVER be exclusive to the All Access Pass. While the vast majority of ANIMATION and INTERFACE packs will also remain non-exclusive, there is potential that we may create Sidekicks specific content which may only be relevant and available to All Access Pass subscribers, for example, facial animations. POLYGON Characters We’d like to reiterate that we do plan to continue to produce POLYGON characters as part of packs, the same way we historically have been. Synty Roadmap We have seen some concerns that the Sidekicks release means we may shift away from producing other products, including our POLYGON packs, and we’d like to reassure you that we have a very exciting roadmap of upcoming releases across our library of POLYGON, ANIMATION and INTERFACE. Our future commitment to both POLYGON and Sidekicks is strong. We have a dedicated team working on POLYGON, and a dedicated team working on Sidekicks. Before the end of 2024, we have INTERFACE - Military HUD releasing in November, POLYGON - Police Station releasing in December, and 1x POLYGON and 1x Animation pack set for release in Q1 2025. In 2025, we are on track to release at least one pack per month (POLYGON, ANIMATION or INTERFACE). To demonstrate our commitment to POLYGON, we wanted to show off a teaser of POLYGON - Kaiju today, also planned for release in early 2025! If you have questions or feedback regarding the Sidekick Character Creator, please check the FAQ at the bottom of the Sidekicks page, and/or join our Discord community or reach out for support. Back to blog"
year_published = 2024
year_updated = 2024
clearnet = "https://syntystore.com/blogs/blog/sidekicks-community-update"
