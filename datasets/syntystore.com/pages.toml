description = """
Synty® Studios Presents: POLYGON - Boss Zombies

A low poly asset pack of zombie boss characters, weapons and prop assets to create an apocalypse based polygonal style game.(Includes a custom shader to allow for changing the blood color and transparency)

📦 Pack Content

◼ Key Features ◼- 4 Boss Zombies with a custom shader to add blood
◼ Asset Includes - ◼
Character Assets (x4)- Brute, Blobber, Slobber and WretchProp Assets (x18)- Car Door, Cigarette, Dumbbell, Flowers, Ham Leg 01, Ham Leg 02, Ham Leg 03, Handbag, Heart Glasses, Rebar Club, Ribbon, Rolling Pin, Scepter, Scooter(Broken), Stop Sign, Tank Barrel, Traffic Lights and TrophyCharacter Attachment Assets (x15)- Brute Hair 01, Brute Hair 02, Brute Rebar, Brute Bandana, Blobber Hair 01, Blobber Hair 02, Blobber Tiara 01, Blobber Tiara 02, Slobber Hair, Slobber FacialHair, Wretch Hair 01 and Wretch Hair 02Vehicle Asset (x1)- Scooter
🤖 Technical Info
◼ Compatibility ◼- Character setup to work with Mecanim (no animations included in this pack)- View our tutorial on converting to the Universal Render Pipeline.- Compatible with Unity 2021.3+- Compatible with Unreal 4.25+
📋 Change Log
Version 1.4.1 (Unreal + Source Files)- Updated new skeleton to fix pelvis bone issue
Version 1.4.0 (Unreal + Source Files)- New_Characters folder added to the project with ready to use characters.- New Unreal characters added to the source files"""
