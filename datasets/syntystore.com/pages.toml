full_description = ".section-template--18833511448828__main-padding { padding-top: 21px; padding-bottom: 21px; } @media screen and (min-width: 750px) { .section-template--18833511448828__main-padding { padding-top: 28px; padding-bottom: 28px; } } One Time Purchase Licence As at 4th April 2024 Looking for Metaverse / NFT / AI licensing options? Get in touch. Humble Bundle Licence The licence for all HUMBLE BUNDLES is limited to one seat only. THE BEST OF POLYGON BUNDLE #1, #2 and #3 and THE BEST OF POLYGON BUNDLE #1, #2, #3 REMIX. Assets are downloadable from Synty Store and are non transferable to any other store. HUMBLE BEST OF POLYGON GAME DEV BUNDLE (2020) Assets are downloadable on the Humble bundle website and are non transferable to any other store. Assets from the Humble Bundle can be used in commercial games One Time Purchase Licence (Formally known as the Standard EULA) This End User Licence Agreement (or EULA) is a legal agreement between you and Synty Studios Limited, governing your rights and obligations in relation to our Assets. By purchasing or downloading our Assets from a Store, you accept the terms of this EULA. In this EULA, certain words and phrases have the meanings given below. Asset means a digital asset that we offer for purchase through a Store, or free to download on our website. Product means any videogame (which will always be covered by your licence), or any other product or production that we agree with you in writing as being covered by your licence. Store means the Synty Store, Unreal Marketplace, or any other store where we offer Assets for purchase or download (excluding the Unity Asset Store). Your Team means all employees, contractors and other collaborators working in a technical or creative role on any one or more Products that incorporate the licensed Assets, excluding anyone working solely as a producer or project manager, or solely on music or audio. We/Us/Our means Synty Studios Limited. You means the individual or organisat