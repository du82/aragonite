important; font-size: 1.5em !important; font-weight: normal !important; line-height: 1.3em; color: #000000 !important; padding: 10px 20px 10px 0px !important; background-color: transparent !important; letter-spacing: 1px !important; padding-right: 50px !important; } .faqPlusAppTitle:hover { color: #ff004e !important; } .faqPlusAppTitle:before, .faqPlusAppTitle:after { content: '' !important; right: 0.55em !important; top: 0.55em !important; width: 2px !important; height: 0.75em !important; background-color: #000000 !important; -webkit-transition: all 0.2s !important; transition: all 0.2s !important; left: unset !important; } .faqPlusAppFaq:hover { background-color: transparent !important; } .faqPlusAppTitle:hover:before, .faqPlusAppTitle:hover:after { background-color: #ff004e !important; } .faqPlusAppFaq { background-color: transparent !important; } .faq-plus-accordian { background: #f7f7f7 !important; border-radius: 20px !important; box-shadow: 0 4px 6px 0 rgba(0, 0, 0, 0.2) !important; padding: 50px !important; max-width: 1100px !important; } #faq-plus-app { max-width: 1100px !important; margin: 0 auto; } .faq-plus-accordian h2 { color: #ff004e !important; font-size: 2em !important; padding: 30px 0px 10px 0px; margin: 0px 0px 12px 0px; } .faqPlusAppContent, .faqPlusAppContent p, .faqPlusAppContent span { background-color: transparent !important; padding: 0 !important; font-family: Tahoma !important; font-size: 12pt !important; margin: 0 !important; line-height: 1.5em; } .faq-plus-accordian p { margin-bottom: 10px !important; } .faqPlusAppToggle:checked + .faqPlusAppTitle{ color: #ff004e !important; } .faqPlusAppToggle:checked + .faqPlusAppTitle:before, .faqPlusAppToggle:checked + .faqPlusAppTitle:after { background-color: #ff004e !important; } .faqPlusAppAnswer { padding: 5px 0px 15px 0px !important; } .easy-faq-search-bar input { width: calc(100% - 100px); margin: 0 50px; border: 2px solid #e5e5e5; height: 44px; font-size: 18px; padding: 10px 18px; border-radius: 20px !important; } @media only screen and (max-width: 960px) { .faq-plus-app-container { padding: 0px !important; } .introTextFaqPlus { padding: 14px; } .footerTextFaqPlus { padding: 14px; } .faq-plus-accordian { margin: 0 auto !important; } .faq-plus-accordian h2 { padding-top: 0px !important; } .easy-faq-search-bar input { width: calc(100% - 100px); } } #easy-faq-app-header { margin: 0; padding: 15px; font-size: 4em; font-weight: normal !important; } .faqPlusCategoryFaqs a, .faqPlusAppContent a:link { color: #ff004e !important; } .faqPlusCategoryFaqs a:hover { color: #black !important; } Frequently Asked Questions Synty Store Questions How do I download my purchased assets? You can download your files on your My Account page. There is a "My Downloads" button, this holds all the packs you own. How will I receive updates to the assets? We update our assets regularly with bug fixes, you will receive an email notifying you of any changes to the assets you have purchased. I am switching engines and purchased Synty assets from Unity / Unreal. Can I get access to the files from the other engine? Unfortunately, no. Due to legal reasons and we can no longer transfer assets. We understand that this is frustrating but we cannot supply files to you when you have purchased from another store. Unity and Unreal are their own asset stores. For future purchases we recommend purchasing directly from our Synty Store as you will receive both project files from us. Again, we apologise for the inconvenience but we're unable to give you access to the opposite engines files. Do you have discounts for Education? We don't offer any educational discounts or licenses at this stage, you will need to buy a copy of the license per student. We do have free assets available for download that may be used. Contact us support@syntystudios.com Can I have your assets for free? No, but we do have some free assets available on the Synty Store License Questions Can I use these assets for commercial games? Yes you can use these assets for your commercial compiled game. ​Please double check the EULA document. Links are provided below - Unity Asset Store Unreal marketplace Synty Store Custom License for Metaverse? Creation of content for Metaverse-related projects and products is prohibited: As a Metaverse Owner you can not create software that allows a user to create a project (e.g. a game) for other users to experience. You must have a custom license to distribute our assets to users in the platform. Some examples of software would include platforms like Roblox, Second Life, VRChat. As a Metaverse user of an existing Game creation software you can use your licenced assets to create a project for other users to experience as long as they remain under your direct control and are not sublicensed in any way. For example as a player of VR Chat you are able to make a world for other players to visit but they are not allowed to take any assets with them to other worlds not under your direct control. For example as a Roblox Player you are able to make your own Roblox game but assets are not allowed to be shared with other users for projects outside of your product. If the platform does not allow the import of asset files then you are unable to use them and the platform owner must custom license the assets. Custom License for NFT/Blockchain? Unfortunately we are still working through our NFT licensing. As Steam has banned the creation of NFT projects they seem to have gone more underground with less authentication steps involved. We want to avoid misuse of our assets especially in scams so currently we have a no NFT or Blockchain policy until we can do further research. Unity Questions How do I animate a character in Unity? To make characters animate, we have two videos available to setup animations for our characters. Mixamohttps://www.youtube.com/watch?v=9H0aJhKSlEQ&feature=youtu.be Unity Starter Guidehttps://www.youtube.com/watch?v=U6KsLqPjEAU&feature=youtu.be How do I import the assets into Unity? We have a video tutorial available for importing assets into Unity How do I light my game to look like your screenshots? Checkout our Youtube for lighting tutorials Do you assets work with the URP (Universal render pipeline)? Assets generally work with URP. Check the descriptions for more info Unreal Questions Can I get the source files? When you purchase assets on syntystore.com, the source files will be available with your purchase. How do I import the assets into Unreal? We have a video tutorial available for importing assets into Unreal https://www.youtube.com/watch?v=3jI1lYlqTOg General Questions Do you do paid contract/custom work? Unfortunately due to the high cost involved for the team, we don't typically do contract/custom work as we are focused on asset packs Do you have a roadmap for future asset pack releases? We do not provide a roadmap. Follow our Facebook page at for news on releases and updates Do the asset packs include animations? We have a couple of assets that include animations. However, unfortunately most of our assets do not include animations, however we have two videos available to setup animations for our characters. Mixamo https://www.youtube.com/watch?v=9H0aJhKSlEQ&feature=youtu.be Unity Starter Guide https://www.youtube.com/watch?v=U6KsLqPjEAU&feature=youtu.be Can I edit the assets? Yes you can edit these assets using any 3D applications(Maya, Blender, etc). However it is prohibited to resell these edited assets Please double check the EULA document. I've provided the links below - Unity Asset Store Unreal marketplace Synty Store What applications do you use to create the assets? We use Maya for 3D modelling and Photoshop for textures. Can we give you profit share of our game in exchange for free assets? No, unfortunately we're not able to this. Do you sell any animals? Yes, however, we have limited animal assets available. POLYGON Series: POLYGON - Dogs For more low poly animals, our friend MalberS Animation does and they are awesome, we suggest checking these out - Unity Asset Store Unreal Marketplace Do you take pack suggestions/Ideas? We currently have a lot of ideas for asset packs, however we’d like to hear any ideas you have discord server - http://bit.ly/30aOuGW Do you have any ETA on asset releases? We can’t give ETA’s on asset pack releases. Please follow us on our Facebook page at https://www.facebook.com/syntystudios/ for new releases and updates Can I use your screenshots and trailer for my Kickstarter or game? You can not use our media for the promotion of your game, we highly recommend creating you own media to best represent your game Can I sell 2D renders of your assets? It is prohibited to resell our assets rendered as .png files as this competes with our business model Do the characters use the Unreal Skeleton? No. We use our own Skeleton that requires animation retargeting Can I use your assets in other engines like Godot? Yes, you can, however we cannot provide support for any other third party engines. Do you have any tutorials on modeling in Blender? We don’t use Blender and have little experience with it. Sales When does the Synty Store have sales? We don't have a calendar of sales we share in advance, but we encourage you to follow us on social media – Facebook, X/Twitter or Instagram – for news and updates. Refunds Can I get a refund? Due to the nature of digital products, we generally can’t offer refunds. Please contact us at support@syntystudios.com if you have an issue with a product. const faqsToSearch = [{"category":"Synty Store Questions","faqs":[{"category":"Synty Store Questions","question":"How do I download my purchased assets?","searchKeywords":[],"searchId":"62d4945bb68213862d94c99d"},{"category":"Synty Store Questions","question":"How will I receive updates to the assets?","searchKeywords":[],"searchId":"62d49475b68213862d94c99e"},{"category":"Synty Store Questions","question":"I am switching engines and purchased Synty assets from Unity / Unreal. Can I get access to the files from the other engine?","searchKeywords":[],"searchId":"62d495a5b68213862d94c9a7"},{"category":"Synty Store Questions","question":"Do you have discounts for Education?","searchKeywords":[],"searchId":"62d49b3fb68213862d94c9b5"},{"category":"Synty Store Questions","question":"Can I have your assets for free?","searchKeywords":[],"searchId":"62d49df9b68213862d94c9c3"}]},{"category":"License Questions","faqs":[{"category":"License Questions","question":"Can I use these assets for commercial games?","searchKeywords":[],"searchId":"62d49bc8b68213862d94c9b8"},{"category":"License Questions","question":"Custom License for Metaverse?","searchKeywords":[],"searchId":"62d49c10b68213862d94c9b9"}]},{"category":"Unity Questions","faqs":[{"category":"Unity Questions","question":"How do I animate a character in Unity?","searchKeywords":[],"searchId":"62d4a081b68213862d94c9ca"},{"category":"Unity Questions","question":"How do I import the assets into Unity?","searchKeywords":'''
