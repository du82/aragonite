description = """
Synty® Studios Presents: INTERFACE - Sci-Fi Soldier HUD

After popular demand, INTERFACE HUD packs make a return! So strap on your tactical helmet, grab your wildly inaccurate laser blaster and prepare for the future of combat technology with the INTERFACE - Sci-Fi Soldier HUD. Futuristic weapon crosshairs, shield and impact effects, action bars, compasses and minimaps, weapon wheels and HP bars - we’ve included an extensive library of components to streamline the creation of your game HUD. Every component has been built to be as customisable as possible, whether your game is a sci-fi shooter, a survival game on a harsh alien world or an action-packed future RPG.Quickly build out your game HUD with dozens of pre-built HUD elements assembled from the latest technology. Action bars, minimaps, compasses, weapon wheels, HP bars, damage FX, crosshairs - we’ve added everything we could think of to help you quickly assemble a quality-looking, responsive HUD. Each component can be visually customized to suit your game’s needs, whether you’re making an ultra-minimal futuristic shooter game or an incredibly advanced space ARPG.
◼ Key Features ◼

Over 1000 sprites and icons assembled into over 150 prefabs (with animations!). Easily piece together a unique UI with customisable components.
Seamlessly blend your game's UI with gameplay by using the 600+ icons included. Icons of props and weapons are rendered from items and weapons found in: POLYGON - Sci-Fi Space, POLYGON - Sci-Fi Worlds, POLYGON - Sci-Fi Cyber City and POLYGON - Sci-fi City

Customisable visual variants for components allows your to add your own style to your game's HUD. You can create hundreds of variations to fit your specific game's needs.
Comprehensive range of input icons for multiple controller types easily lets you support PC, Xbox, PS, and Switch!
Artistically blends with existing Synty asset packs. We've designed the UI to match Synty's POLYGON style. Your game will look sleek and professionally made with a UI that matches your games 3D aesthetic.
Text and numeric buttons can be tinted, localised and customised

*The UI elements contained in this pack are 2D and intended to work with Unity's  UGUI and 2D systems.  No 3D models are included.
◼  Demos ◼Take a deep dive into our INTERFACE - Sci-Fi Soldier HUD Asset Preview Demo and get an interactive breakdown of what is included.POLYGON - Sci-Fi Soldier HUD - Asset Preview ↗
◼ Tutorial ◼View our UI tutorials - Creating a HUD in Unity- Creating a Minimap in Unity
🔍 FAQs
◼ Unity FAQ's ◼Q: Does the pack work with TextMeshPro?A: Yes! This pack is designed to work with TextMeshProQ: Are the UI elements 2D or 3D?A: The UI elements are 2D renders allowing them to work easily with UGUI and other 2D UI systemsQ: What UI system do the prefabs use?A: Our pack's prefabs are built using UGUI - Unity's recommended runtime UI system.Q: Can I use the fonts in this pack for my game or project?A: Yes, fonts included in this pack are Google fonts, free to use for commercial projects. Check out the google fonts FAQ here. ◼ Unreal FAQs ◼ Q: Does this pack support Unreal Engine?A: Currently this pack does not support Unreal Engine. There is no timeline for Unreal Engine support, but we will support Unreal Engine in the future.Q: Can the sprites be used in Unreal?A: Even though Unreal Engine is not officially supported you can import the 2D sprites into Unreal Engine and reconstruct our UI yourself. However no support is currently offered for this.
