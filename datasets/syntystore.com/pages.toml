ion who purchases or downloads Assets through a Store or our website. Generative AI Programs means artificial intelligence, machine learning, deep learning, neural networks, or similar technologies designed to automate the generation of or aid in the creation of new content, including but not limited to audio, visual, or text-based content. Your licence entitlements When you purchase an Asset from a Store, you are purchasing a licence to the Asset. We retain all intellectual property in the Asset, but the licence gives you the entitlements outlined below, with certain restrictions that depend on the type of licence purchased. Unless stated otherwise in the documentation that comes with your purchase, your licence is a Standard Licence, with the restrictions outlined below. Subject to the restrictions below, once you have paid the purchase price specified in the Store or agreed with Us in writing, your licence entitles you: to incorporate the Asset into Products produced under your direct control, and into promotional materials (graphics, videos or print media) for those Products to publish, distribute, transmit, broadcast, communicate, show and play the Asset as incorporated into those Products and promotional materials to adapt the Asset for the purpose of doing any of the above, and to do any of the above with the Asset as so adapted, and to authorise third parties to do any of the above, but only in relation to Products produced under your direct control, and promotional materials for those Products. Modifying an Asset does not mean you own that Asset, or that you can do anything with that Asset beyond what is specifically allowed in this EULA. END USER will be prohibited from using the asset licence for the following products: Creation of Non-Fungible-Tokens (NFT) and/or use in Blockchain based projects or products. Creation of content for Metaverse-related and/or Game Creation Software and products. Inclusion in datasets utilised by Generative AI Programs; in the development of Generative AI Programs; or as inputs to Generative AI Programs. Use in promotional, marketing, social media, blog posts, articles, images, videos or other materials related to any Generative AI Programs or Products. If you wish to make a product that is prohibited by these terms, please Get in touch. Standard/Educational Licence Features and restrictions - If you purchase a Standard Licence: Your licence is perpetual, and cannot be terminated except as stated in this EULA. Unless stated otherwise in the documentation that comes with your purchase, each single licence purchase you make includes five seats for your Team. You must purchase enough licences to give you at least as many seats as there are people in your Team, taking the highest count at the time of purchase or any time afterwards. If your Team grows to exceed the number of seats already paid for, you must immediately purchase additional licences to make up the difference. We will make each extra licence available at the same list price as applied when you paid for the original licence (ignoring any special, discount or other promotional price), or a lower price if we agree this in writing with you. If you need licences for more than five seats, get in touch here to see if we can offer a discounted rate. Other features The licence is non-exclusive. Provided you pay the required purchase price, the licence is royalty-free. The licence is worldwide, and is not limited by game engine, OS, platform or device. You can transfer the licence to another entity that acquires all or substantially all of the rights in the Product(s) that incorporate the relevant Assets. To give effect to the transfer, you’ll need to notify Us in writing, and the transferee will need to give Us a signed, written undertaking accepting the terms of this EULA. So long as you meet these requirements, you don’t need our permission to sell the rights in your game. The licence cannot be terminated except as stated in this EULA. Support We do currently provide after-sales support for our Assets, but we do not guarantee that this will continue, and may withdraw it at any time. The level, timing and amount of support provided is entirely up to Us. If you are an educational institution, you must ensure all support requests are channelled through instructors rather than students. Source files You must not share the source files of any Assets outside your team. To be clear, you can allow your contractors to access the source files while they are working for you, but you must ensure they delete all their copies when they finish their engagement. Audits You must provide Us with access to your records relating to the number of individuals in your Team and your use of any Assets, as reasonably requested by Us from time to time for the purpose of auditing your compliance with this EULA. We will give at least 5 days’ notice of any request, and will not make more than one request in any six month period. We will keep confidential any information we acquire through these audits, and will use it only as necessary to enforce our rights in connection with this EULA. Chargebacks If your payment for a licence is subject to a credit card chargeback, meaning we’re forced to refund all or part of what we’ve received for the purchase, your licence will automatically be cancelled unless you pay Us the difference within 10 days. Termination If you commit a non-trivial breach of this EULA, and have not remedied the breach within 30 days of Us requesting a remedy in writing, we may give notice to you terminating any one or more licences that we have granted you in relation to any Asset. Other restrictions You must not represent to anyone that you own or have created the Assets. You must not claim to be affiliated or in collaboration with Us. You must not use or share our Assets except as expressly permitted by this EULA. In particular, you must not distribute our Assets as stock images or stock art (2D or 3D) or