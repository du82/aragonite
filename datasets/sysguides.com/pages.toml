["https://sysguides.com/install-fedora-41-with-full-disk-encryption-snapshot-and-rollback-support"]
title = "How to Install Fedora 41 with Full Disk Encryption, Snapshot, and Rollback Support"
description = "Install Fedora 41 with full disk encryption, snapshot, and rollback support so you can rollback at any time if something goes wrong."
full_description = '''How to Install Fedora 41 with Full Disk Encryption, Snapshot, and Rollback Support October 30, 2024 · By Madhu Desai in Distro, Security, Storage · 51 comments on How to Install Fedora 41 with Full Disk Encryption, Snapshot, and Rollback Support Fedora Linux 41 has been released! In this guide, I will show you how to install Fedora 41 with full disk encryption, snapshot, and rollback Support. So, if you mess up the system settings, install something that does not work, or run into problems after updating, you won't have to worry about breaking the system and spending hours trying to fix it. Simply restore the snapshot before the problematic change, and you are good to go. Note: If you want to install Fedora 41 with snapshot and rollback support but do not want LUKS Full Disk Encryption, please see my other guide 'How to Install Fedora 41 with Snapshot and Rollback Support'. Note: If you have previously installed Fedora 40 following my earlier tutorial and wish to upgrade to Fedora 41, please proceed directly to the upgrade section located at the end of this article to upgrade from Fedora 40 to Fedora 41. No additional steps are required. In my last guide on installing Fedora 40 with full disk encryption, I chose to use the command line instead of the default Anaconda GUI installer. This was because the Anaconda installer doesn't allow for the encryption of the /boot directory, which is an important part of the installation process. However, I have found a way to encrypt the /boot directory while still using the Anaconda installer. So let's get started. Table of Contents 1. Partitions and Subvolumes Layout 2. Install Fedora Workstation 41 3. Post-Installation Configurations 4. Create the Additional Subvolumes 5. Bypass the Additional Passphrase Prompt 5.1 Using a Key File 5.2 Using TPM2 6. Install and Configure Snapper 7. Install and Configure Grub-Btrfs 8. Create a System Root Snapshot and Set It as the Default 9. Enable Automatic Timeline Snapshots 10. Issues and Possible Solutions 11. Upgrade Fedora 40 to Fedora 41 12. Watch on YouTube 1. Partitions and Subvolumes Layout For this guide, I will use a hard disk with a capacity of 128 GiB. I will create a 600 MiB EFI system partition and use the remaining disk space to create a partition for the Linux file system. Fedora also creates a SwapOnZRAM during boot, so no separate swap partition is required. This is how the disk partition looks: NAME SIZE FSTYPE PARTTYPENAME MOUNTPOINT/dev/vda 128G /dev/vda1 600M vfat EFI System /boot/efi/dev/vda2 127.4G btrfs (LUKS) Linux filesystem / First, I will encrypt the Linux partition (/dev/vda2) with LUKS. Next, on the encrypted LUKS partition, I will create a btrfs file system. Then, on the btrfs file system, I'll create the following subvolumes to keep them out of root file system snapshots. NAME MOUNTPOINT TYPE[main] / mainvolumehome /home subvolumeopt /opt subvolumecache /var/cache subvolumecrash /var/crash subvolumeAccountsService /var/lib/AccountsService subvolumegdm /var/lib/gdm subvolumeimages /var/lib/libvirt/images subvolumelog /var/log subvolumespool /var/spool subvolumetmp /var/tmp subvolumewww /var/www subvolume.mozilla /home/$USER/.mozilla subvolume.snapshots /.snapshots subvolume.snapshots /home/.snapshots subvolume Info: Subvolumes, unlike standard partitions or LVM logical volumes, do not have a size; rather, they behave as directories with shared space. However, the resemblance between subvolumes and directories ends here. Each subvolume, much like a file system, has its own file tree, POSIX namespace, and inode pool. This means that hard links between subvolumes are not possible. From this perspective, a subvolume resembles a separate file system. Subvolumes are not block devices either. The directories for which subvolumes are created and the reasons for doing so are listed below. For more information, visit this website. /home Contains user data. It will be created to keep user data separate while also protecting against data loss during system root rollbacks. /opt Contains applications installed by a third party. It will be created to keep these applications from being uninstalled during rollbacks. /var/cache, /var/crash, /var/tmp Directories containing temporary files and caches. They will be created so that the system root subvolume does not contain temporary files and caches. Fedora mounts /tmp with tmpfs on boot, so a separate subvolume is not required. /var/lib/AccountsService, /var/lib/gdm Contains login user and Gnome display information. These directories must be writeable at all times. When you try to boot a snapshot from the GRUB menu to rollback system root, you are booting a read-only snapshot, and because it cannot be written to, the system hangs just before the Gnome login screen appears. If you are using a desktop environment other than Gnome, you will need to replace '/var/lib/gdm' with one specific to your desktop environment. For KDE, it is '/var/lib/sddm'. For XFCE, it is '/var/lib/lightdm' and '/var/lib/lightdm-data'. To find out about other desktop environments, refer to this page. /var/lib/libvirt/images The default location for libvirt-managed virtual machine images. It will be created so that virtual machine images are not replaced with older versions during a rollback. /var/log Contains log files. It will be created to prevent the loss of log data during rollbacks. /var/spool Contains data that is awaiting some kind of later processing, such as mail, mail queues, printing, printer spool, and so on. It will be created to prevent the loss of mail, printing, and spool data following a rollback. /var/www Web server directory. It will be created to keep hosted web server data separate and prevent data loss during system root rollbacks. /home/$USER/.mozilla Fedora Workstation ships with the Firefox web browser by default. If you take a snapshot of your home directory and then undo the changes, you do not want to lose any new bookmarks, passwords, or other user data. So I will create a subvolume for the '.mozilla' directory, which is where Firefox stores all of its data. This separates it from the home subvolume, avoiding data loss during undo operations on the home subvolume. If you use other web browsers, you should consider creating separate subvolumes for them. Chrome Browser: /home/$USER/.config/google-chromeBrave Browser : /home/$USER/.config/BraveSoftware Depending on your usage, you may also want to consider creating subvolumes in your home directory for the following directories: GnuPG: /home/$USER/.gnupgSSH: /home/$USER/.sshThunderbird Mail: /home/$USER/.thunderbird /.snapshots, /home/.snapshots Contains snapshots of the root (/) and home (/home) directories. 2. Install Fedora Workstation 41 Boot your system using the Fedora 41 Workstation Live installer in UEFI mode. In the 'Welcome to Fedora' window, select the 'Not Now' option to return to the Gnome desktop. Next, open the Terminal window to start preparing your system for Fedora 41 installation. Switch to super user mode. $ sudo -i By default, the Anaconda installer does not let you encrypt the /boot directory. So, you must first enable this option before proceeding with the Anaconda installer. # sed -i.bkp 's/encryption_support = False/encryption_support = True/' \ /usr/lib64/python3.*/site-packages/pyanaconda/modules/storage/bootloader/base.py # sed -i.bkp 's/self.raw_device.format._header_size/crypto.LUKS_METADATA_SIZE/g' \ /usr/lib/python3.*/site-packages/blivet/devices/luks.py Now that /boot encryption support is enabled, launch the Anaconda GUI installer. Keep the terminal window open for now. We will come back to it once the installation is complete. On the welcome screen, select your Language, Keyboard, and configure your Time & Date. After that, select the 'Installation Destination' option. You should now be on the INSTALLATION DESTINATION screen. To proceed, pick the Advanced Custom (Blivet-GUI) radio button and then hit the Done button. On the BLIVET GUI PARTITIONING screen, create the partitions, file systems, and btrfs subvolumes necessary to install the Fedora Workstation 41. First, you need to create and mount the EFI partition. Select the free space and click the + sign to create a partition. Set the partition Size to 600 MiB, the Filesystem to EFI System Partition, and the Mountpoint to /boot/efi. Then, you need to create a btrfs volume where you can create all the subvolumes needed to install Fedora Workstation 41. Select the free space again and click on the + sign to create a Btrfs volume. Set the Filesystem to btrfs and the Mountpoint to /. I used the entire remaining space. However, you can specify the size you want for the btrfs volume. Enable encryption by checking the Encrypt option. Select luks2 as the encryption type. GRUB currently supports devices encrypted with LUKS1 or LUKS2, but only with the PBKDF2 key derivation function. LUKS2 uses Argon2id by default. We will change it to PBKDF2 once the installation is complete. Set the passphrase. Set a stronger passphrase with higher entropy (password entropy > 60 bits is suggested). Next, you must create a home subvolume. (1) Select the Btrfs Volume from the left panel, and (2) click on the + sign on the right panel. Create a home subvolume. Enter the Name as home and Mountpoint as /home. Click OK to finish. I will create the remaining subvolumes when the installation is finished. This is because the Anaconda installer does not allow you to create subvolumes with slashes (/) in their names, such as var/log. For now, click Done to finish creating subvolumes. On the SUMMARY OF CHANGES screen, double-check that everything is properly defined. To finalize the changes, click the Accept Changes button. You will be returned to the INSTALLATION SUMMARY screen. Press the Begin Installation button to start the installation process. The installation process will start. Just sit back and relax. Once the installation is complete, close the Anaconda installer by clicking the Finish Installation button. Please do not reboot just yet. Now return to the terminal window. As I previously stated, GRUB currently supports devices encrypted using the PBKDF2 key derivation function. As LUKS2 defaults to Argon2id, we must change it to PBKDF2. Your current installation is saved at /mnt/sysroot. First, find your LUKS device and save it in a variable. For me, it is /dev/vda2. Yours will be different. # LUKS_DEVICE="$(cryptsetup status \ $(grub2-probe --target=device /mnt/sysroot) \ | grep 'device:' | awk '{print $2}')" \ ; echo $LUKS_DEVICE /dev/vda2 Check the PBKDF. # cryptsetup luksDump $LUKS_DEVICE | grep -A7 '0: luks2' 0: luks2 Key: 512 bits Priority: normal Cipher: aes-xts-plain64 Cipher key: 512 bits PBKDF: argon2id Time cost: 4 Memory: 645584 As you can see, it is argon2id. We need to change it to pbkdf2. To change it, run the following command. Also, for pbkdf2, the minimum iteration count is 1000 and the maximum is 4294967295. The more powerful your CPU, the higher the number of iterations. And, the higher the iteration count, the longer it takes to unlock the LUKS in the GRUB. So I have set the iteration count to 500000. You can set the iteration count to whatever you want. Lowering the iterations too much reduces security. # cryptsetup luksChangeKey ${LUKS_DEVICE} \ --pbkdf pbkdf2 \ --pbkdf-force-iterations 500000 You will be asked the passphrase three times. The first one will authenticate, and the next two will set the new passphrase. Do not change the passphrase; keep it the same as before. Check the PBKDF again. # cryptsetup luksDump $LUKS_DEVICE | grep -A7 '0: luks2' 0: luks2 Key: 512 bits Priority: normal Cipher: aes-xts-plain64 Cipher key: 512 bits PBKDF: pbkdf2 Hash: sha256 Iterations: 500000 As you can see, the PBKDF has been changed to pbkdf2, and the iteration count is set to 500000. Finally, you must enable Crypto Disk and cryptomount. Execute the following commands sequentially. # LUKS_UUID="$(cryptsetup luksUUID ${LUKS_DEVICE})" ; echo $LUKS_UUID # sed -i.bkp1 "1i cryptomount -u ${LUKS_UUID//-/}" \ /mnt/sysroot/boot/efi/EFI/fedora/grub.cfg # echo 'GRUB_ENABLE_CRYPTODISK=y' >> /mnt/sysroot/etc/default/grub The configuration is now complete. Reboot the system. # reboot You will be prompted for the passphrase twice. The first time is before loading GRUB, and the second time is before mounting the root file system. Later in this guide, I will enable the single passphrase prompt. Depending on your computer's CPU, it may take up to 15 seconds for the GRUB to display the menu. So please be patient. When you input your passphrase in the first LUKS prompt, no '*' cursor indication appears. So you should assume you have entered your passphrase correctly. Simply enter your LUKS passphrase blindly and hit the [Enter] key. The last phase of the installation process will start. Click the Start Setup button to complete the remaining customization steps, such as setting a new login, password, etc. You will then be logged into the Fedora Workstation 41 with the all-new Gnome 47 desktop interface. 3. Post-Installation Configurations When booting your system, you may have noticed the following error message. error: ../../grub-core/commands/loadenv.c:216:sparse file not allowed. This is because you did not create a separate ext4 /boot partition and instead included it in the btrfs system root. GRUB preboot writes to /boot/grub2/grubenv if the boot was successful. This error occurs because of the GRUB btrfs.mod driver, unlike ext4, is read-only. To resolve this, open the Gnome terminal and execute the following command. $ sudo grub2-editenv - unset menu_auto_hide Set the btrfs volume label. I will name the btrfs volume FEDORA, but you can name it whatever you want. $ sudo btrfs filesystem label / FEDORA $ sudo btrfs filesystem show / Label: 'FEDORA' uuid: d2808262-1fd0-436f-9676-5be297a8ef18 Total devices 1 FS bytes used 7.15GiB devid 1 size 127.40GiB used 10.02GiB path /dev/mapper/luks-a9a402be-cc3d-4190-8487-50562dc43e22 Your setup should look something like this. $ lsblk -p /dev/vda NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINTS /dev/vda 252:0 0 128G 0 disk ├─/dev/vda1 252:1 0 600M 0 part /boot/efi └─/dev/vda2 252:2 0 127.4G 0 part └─/dev/mapper/luks-a9a402be-cc3d-4190-8487-50562dc43e22 253:0 0 127.4G 0 crypt /home / And the subvolumes will look like this. $ sudo btrfs subvolume list / ID 256 gen 49 top level 5 path home ID 257 gen 37 top level 5 path var/lib/machines In Fedora Workstation, systemd automatically creates the /var/lib/machines subvolume for systemd-nspawn containers. Install the packages listed below. $ sudo dnf install vim git inotify-tools make Now, update your operating system. $ sudo dnf update Do not reboot your system just yet. There is an update that replaces the grub.cfg file in the ESP. First check if your grub.cfg in ESP has been replaced. $ sudo cat /boot/efi/EFI/fedora/grub.cfg cryptomount -u a9a402becc3d4190848750562dc43e22 search --no-floppy --fs-u'''
