["https://sysguides.com/install-fedora-with-fde-snapshot-rollback-support"]
title = "How to Install Fedora 38/39 with Full Disk Encryption, Snapshot and Rollback Support"
description = "In this post, I will show you how to install Fedora 38/39 with full disk encryption, snapshot and rollback support. You can take snapshots of the / and /home subvolumes and perform a full system rollback on the / subvolume if something goes wrong."
full_description = '''How to Install Fedora 38/39 with Full Disk Encryption, Snapshot and Rollback Support May 7, 2024 · By Madhu Desai in Distro, Security, Storage · I have posted an updated version of this post. I've made it copy and paste friendly. I strongly advise you to use the updated version rather than this. How to Install Fedora 40 with LUKS Full Disk Encryption, Snapshot, and Rollback Support Fedora Linux 39 has been released! Fedora 39 brings numerous performance and security improvements, as well as hardware support. This release also includes the latest Gnome 45 desktop with improved styling. In this guide, I will show you how to install Fedora 39 with full disk encryption, snapshot, and rollback support. As a result, if you make a mistake with system configuration changes, package installations, or updates, you won’t have to worry about losing data. Simply restore the snapshot before your problematic change, and you’ll be fine. In my previous post on how to install Fedora 37 with LUKS full disk encryption, I used Fedora’s default Anaconda installer. The Anaconda installer does not support encrypting the /boot directory. As a result, I had to first create a separate ext4 /boot partition, then after installation, move the contents of the /boot partition to the / volume, then delete the /boot partition, and finally merge the deleted space to the / volume. These are far too many steps. So, instead of using the standard GUI Anaconda installer, I’ll install Fedora via the command line interface with DNF installroot and chroot environment. This will be straightforward, with no unnecessary steps. I have updated this post for Fedora 39, which was originally intended for Fedora 38. In terms of btrfs snapshot and rollback support, nothing has changed between Fedora 38 and Fedora 39. In case you’ve already followed a previous version of this tutorial and want to upgrade to Fedora 39, go straight to the section on upgrading at the end of this article and upgrade from Fedora 38 to Fedora 39. You don’t have to do anything else. Here’s a quick rundown of what needs to be done: Boot from the Fedora 39 Workstation Live installation media. Create the necessary partitions on the disk where Fedora 39 will be installed. Enable LUKS encryption on the partition where Fedora will be installed, and then format all the partitions with the appropriate Linux file systems. Create and mount all necessary directories and subvolumes for Fedora installation in the /mnt directory. Install a minimal Fedora distribution in the /mnt directory. Finish the minimal installation by creating all of the required configuration files. Boot from Fedora Minimal and configure TPM2 or a key file to automatically decrypt your disk. Install the GNOME Desktop Environment. Create any additional subvolumes that are required based on your desktop environment choice. Install and configure the snapper tool so that you can create, delete, and compare snapshots, as well as undo changes made between snapshots. Install and configure the grub-btrfs tool so that you can boot to any snapshot from the GRUB menu. Take a subvolume snapshot of the main volume and set the subvolume as the default ‘/‘ file system to make rollback much easier when using the snapper tool. And finally, enable automatic timeline snapshots of the ‘/‘ file system using the snapper tool. If you want to install Fedora 38/39 without LUKS Full Disk Encryption but still have Full System Rollback, please see my other article, How to Install Fedora 38/39 with Snapshot and Rollback Support. Although it appears to be overwhelming, it is not. I’ll walk you through every step of the installation process. So let's get started. Table of Contents 1. Disk and Subvolumes Layout for Fedora 2. Create Partitions and File Systems 3. Create Directories and Subvolumes 4. Bootstrap a Fedora System in a Chroot Environment 5. Create a User Account 6. Create the /etc/fstab File 7. Enable Crypto Disk and Snapshot Booting 8. Bypass the Additional Passphrase Prompt 8.1 Using a Key File 8.2 Using TPM2 Method 9. Install the Desktop Environment 10. Install and Configure Snapper 11. Install and Configure Grub-Btrfs 12. Create a System Root Snapshot and Set It as the Default 13. Snapper Tests Test 1: Undo the Changes Made by the DNF Installer Test 2: Undo Any Changes Made to Individual Files Test 3: Create Manual Pre-Post Snapshots and Undo the Changes Test 4: Rollback to a Previous Snapshot from the GRUB Menu 14. Make a Snapshot the New System Root 15. Enable Automatic Timeline Snapshots 16. Issues and Possible Solutions 17. Upgrade Fedora 38 to Fedora 39 18. Watch on YouTube 1. Disk and Subvolumes Layout for Fedora I'll use a hard disk with a capacity of 100 GIB. Fedora 39 suggests that the ESP be at least 500 MiB in size. So I'll create a 512 MiB EFI System Partition. You can, however, increase the size if necessary. I'll create a btrfs volume with the remaining disk space. Fedora creates a SwapOnZRAM during boot, so no separate swap partition is required. This is how the disk partition looks. NAME SIZE FSTYPE LABEL MOUNTPOINT /dev/vda 100G ├─/dev/vda1 512M vfat EFI /boot/efi └─/dev/vda2 99.5G btrfs FEDORA / The system root will be installed on the LUKS encrypted btrfs main volume (/dev/vda2). Then, on the system root, I'll create the following subvolumes to keep them out of root file system snapshots. In the end, this is how the disk layout looks. NAME MOUNTPOINT TYPE [main] / mainvolume home /home subvolume opt /opt subvolume cache /var/cache subvolume crash /var/crash subvolume log /var/log subvolume spool /var/spool subvolume tmp /var/tmp subvolume www /var/www subvolume AccountsService /var/lib/AccountsService subvolume gdm /var/lib/gdm subvolume images /var/lib/libvirt/images subvolume .mozilla /home/$USER/.mozilla subvolume The directories for which subvolumes are created and the reasons for doing so are listed below. /home Contains user data. It is created to keep user data separate and also to avoid loss of user data on system root rollbacks. To learn more about /home, check this link: /home. /opt Contains applications installed by a third party. It is excluded to prevent these applications from being uninstalled during rollbacks. To learn more about /opt, check this link: /opt. /var/cache, /var/crash, /var/tmp Directories contain temporary files and caches. So they are created to be excluded from snapshots. Fedora also mounts /tmp with tmpfs at boot, so a separate subvolume for /tmp is unnecessary. To learn more, check these links: /var/cache, /var/crash, /var/tmp, /tmp. /var/log Contains log files. It is created to avoid the loss of log data during rollbacks. To learn more about /var/log, check this link: /var/log. /var/spool Contains data that is awaiting some kind of later processing such as mail, mail queues, printing, printer spool, and so on. Created to avoid a loss of mail, printing, and spool data after a rollback. To learn more about /var/spool, check this link: /var/spool. /var/www Web server directory. It is created to keep hosted web server data separate and to avoid data loss on system root rollbacks. /var/lib/AccountsService, /var/lib/gdm Contains login user and Gnome display information. These directories must be writable at all times. When you try to boot a snapshot from the GRUB menu, you are booting into a read-only snapshot, which causes the system to hang just before the Gnome login screen appears. In case you're using a desktop environment other than Gnome, it's necessary to replace the '/var/lib/gdm' with one that's specific to your desktop environment. For KDE, it is '/var/lib/sddm'. For XFCE, it might be '/var/lib/lightdm' and '/var/lib/lightdm-data'. I haven't tested. To find out about other desktop environments, refer to this page. /var/lib/libvirt/images The default location for libvirt-managed virtual machine images. Excluded to avoid replacing virtual machine images with older versions during a rollback. /home/$USER/.mozilla By default, Fedora Workstation includes the Firefox browser. If you take a snapshot of your home directory and later undo any changes, you don't want to lose any new bookmarks, passwords, and other user data. So, I'll create a new subvolume for the '.mozilla' directory. This keeps it separate from the home subvolume and prevents data loss during undo operations. If you use the Chrome web browser, create a subvolume for the '/home/$USER/.config/google-chrome' directory. Depending on your usage, you may also want to consider creating subvolumes in your home directory for the following directories: GnuPG: /home/$USER/.gnupg SSH: /home/$USER/.ssh Thunderbird Mail: /home/$USER/.thunderbird 2. Create Partitions and File Systems Boot your system using the Fedora 39 Workstation Live installer in UEFI mode. In the 'Welcome to Fedora' window, click the 'Not Now' button to return to the Gnome desktop. Next, launch Gnome Terminal to begin preparing the system for Fedora 39 installation. Locate the disk on which you want to install Fedora. For me, it is /dev/vda. Yours might be different. $ sudo -i # lsblk -pd NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINTS /dev/loop0 7:0 0 1.9G 1 loop /dev/loop1 7:1 0 7.6G 1 loop /dev/loop2 7:2 0 32G 0 loop /dev/sr0 11:0 1 2G 0 rom /run/initramfs/live /dev/zram0 251:0 0 3.8G 0 disk [SWAP] /dev/vda 252:0 0 100G 0 disk The Fedora 39 Workstation Live installer is missing the gdisk package, which is necessary for creating partitions. So, install it. # dnf -y install gdisk Create an EFI System Partition of 512 MiB. I'll name the partition 'EFI', but you can give it any name. # sgdisk -n 1::+512M -t 1:ef00 -c 1:'EFI' /dev/vda Create a Linux filesystem partition on which Fedora will be installed. I will use the entire remaining space. I'll name this partition 'Fedora 39', but you can give it any name. # sgdisk -n 2:: -t 2:8300 -c 2:'Fedora 39' /dev/vda List the partitions you just created to ensure that everything is in order. # sgdisk -p /dev/vda Disk /dev/vda: 209715200 sectors, 100.0 GiB ... Total free space is 2014 sectors (1007.0 KiB) Number Start (sector) End (sector) Size Code Name 1 2048 1050623 512.0 MiB EF00 EFI 2 1050624 209715166 99.5 GiB 8300 Fedora 39 Format the /dev/vda1 partition with the FAT32 file system. I'll name the volume 'EFI', but you may name it whatever you want. # mkfs.fat -F 32 -n EFI /dev/vda1 Initialize the /dev/vda2 partition as a LUKS device and set the initial passphrase. # cryptsetup luksFormat --type luks2 --label FEDORA_LUKS \ --pbkdf pbkdf2 --pbkdf-force-iterations 500000 /dev/vda2 WARNING! ======== This will overwrite data on /dev/vda2 irrevocably. Are you sure? (Type 'yes' in capital letters): YES Enter passphrase for /dev/vda2: Verify passphrase: GRUB currently only supports pbkdf2 algorithm. For pbkdf2, the minimum iteration count is 1000 and the maximum is 4294967295. The more powerful your CPU, the higher the iteration count. And, the higher the iteration count, the longer it takes to unlock the LUKS in the GRUB. So I have set the iteration count to 500000. Lowering the iterations reduces security. To get around it, use a stronger passphrase with higher entropy (password entropy > 60 bits is suggested). Now, open the LUKS device /dev/vda2 and map it to the temporary name tmpluks. I'll map the LUKS device with the proper UUID later. When prompted, enter the LUKS passphrase you provided. # cryptsetup luksOpen /dev/vda2 tmpluks Enter passphrase for /dev/vda2: Format the mapped device with the btrfs file system. I'll name the volume FEDORA, but you may name it whatever you want. # mkfs.btrfs -L FEDORA /dev/mapper/tmpluks This is how your setup should look. The UUIDs will be unique to your system. # udevadm trigger # lsblk -p -o name,fstype,fsver,label,uuid /dev/vda NAME FSTYPE FSVER LABEL UUID /dev/vda ├─/dev/vda1 vfat FAT32 EFI 26CB-F6DD └─/dev/vda2 crypto_LUKS 2 FEDORA_LUKS adcf2b8d-4884-4627-9964-ad790471eb13 └─/dev/mapper/tmpluks btrfs FEDORA b481869f-2320-4d0a-8073-30d6c6f1cc81 3. Create Directories and Subvolumes First, mount /dev/mapper/tmpluks to the /mnt directory. # mount -v -o compress=zstd:1 /dev/mapper/tmpluks /mnt # restorecon -RFv /mnt Then, create the necessary directories and subvolumes. As previously stated, these subvolumes are created on the system root to avoid being included in the rollback regime because some of these directories contain temporary files and caches, others contain data that you do not want to lose if you rollback the system root, and some should be in Read-Write mode when booting into a Read-only snapshot. # mkdir -vp /mnt/boot/efi # mkdir -vp /mnt/var/lib/libvirt # mount -v /dev/vda1 /mnt/boot/efi # btrfs subvolume create /mnt/home # btrfs subvolume create /mnt/opt # btrfs subvolume create /mnt/var/cache # btrfs subvolume create /mnt/var/crash # btrfs subvolume create /mnt/var/log # btrfs subvolume create /mnt/var/spool # btrfs subvolume create /mnt/var/tmp # btrfs subvolume create /mnt/var/www # btrfs subvolume create /mnt/var/lib/libvirt/images Change the permissions of the directory /mnt/var/tmp. # chmod 1777 /mnt/var/tmp # ls -lhd /mnt/var/tmp drwxrwxrwt. 1 root root 0 Nov 7 10:14 /mnt/var/tmp When using QCOW2 images as virtual disks in KVM, the IO performance suffers. So disable the CoW feature in the /mnt/var/lib/libvirt/images directory. # chattr -R +C /mnt/var/lib/libvirt/images # lsattr -d /mnt/var/lib/libvirt/images ---------------C------ /mnt/var/lib/libvirt/images List the subvolumes. This is how it should look. # btrfs subvolume list /mnt ID 256 gen 8 top level 5 path home ID 257 gen 9 top level 5 path opt ID 258 gen 9 top level 5 path var/cache ID 259 gen 9 top level 5 path var/crash ID 260 gen 9 top level 5 path var/log ID 261 gen 10 top level 5 path var/spool ID 262 gen 11 top level 5 path var/tmp ID 263 gen 10 top level 5 path var/www ID 264 gen 10 top level 5 path var/lib/libvirt/images I'll create the remaining subvolumes when I install the desktop environment. 4. Bootstrap a Fedora System in a Chroot Environment Create a Fedora system in the /mnt directory using DNF installroot. I'm going to install the basesystem package first, which defines the basic elements of a Fedora system. # dnf --releasever=39 --installroot=/mnt install basesystem I'll build a Fedora system for version 39. If you want to install Fedora 38, replace --releasever=39 with --releasever=38. Bind mount the directories /sys, /dev, and /proc into /mnt. Copy from 'for' to 'done', paste it into the terminal, and hit [Enter]. # for dir in sys dev proc ; do mount -v --rbind "/${dir}" "/mnt/${dir}" mount -v --make-rslave "/mnt/${dir}" done Now that the directories have been bind mounted, install Fedora Minimal in the /mnt directory. I've included Fedora Minimal package groups, kernel, language packs, grub, and some other relevant packages. # dnf --releasever=39 --best --setopt=install_weak_deps=False --installroot=/mnt \ install @minimal-environment langpacks-en glibc-langpack-en glibc-all-langpacks \ kernel grub2-'''
