title = "How to Properly Dual-boot Windows 11 and Ubuntu (2024)"
description = "There are many reasons why you might want to dual-boot Windows 11 and Ubuntu. Whatever the reason, the ability to optimize hardware performance across all operating systems is unquestionably advantageous."
full_description = '''How to Properly Dual-boot Windows 11 and Ubuntu August 9, 2024 · By Madhu Desai in Distro, Storage, Windows · 5 comments on How to Properly Dual-boot Windows 11 and Ubuntu You can install multiple operating systems even if your system only has one hard drive. There are many reasons why you might want a dual-boot system. Whatever the reason, the most obvious advantage is the ability to optimize hardware performance across all operating systems. So, in this blog post, I will show you how to properly dual-boot Windows 11 and Ubuntu. I am assuming you already have a system running some edition of Windows 11. For this tutorial, I'll use Windows 11 Home as an example. However, it could be any edition of Windows 11, or even Windows 10. So let’s begin. Table of Contents 1. Disk Partition Layout for Dual-boot 2. Adjust Partition Sizes in Windows 11 3. Disable Hibernation in Windows 11 4. Install Ubuntu Desktop 24.04 LTS 5. Enable ZRAM on Ubuntu Desktop 6. Enroll the Machine Owner Key 7. Install System Rescue Toolkit 8. Watch on YouTube 1. Disk Partition Layout for Dual-boot For this tutorial, I'll be using a 200 GiB disk. Here is how the partitions appear on my Windows 11. Based on the partition layout shown above, to properly install Ubuntu for a dual-boot system, I need to make the following changes: There isn't enough free disk space to accommodate the Ubuntu Linux operating system. So I'll have to shrink the Windows partition to make room for Ubuntu. I'll set the size of the Windows partition to 100 GiB. The EFI System Partition is only 100 MiB. This is insufficient if I intend to include Linux distributions. So I need to make it bigger. I'm going to expand this partition to 1 GiB. The recovery partition is 768 MiB in size, with approximately 83 MiB of free space. Microsoft recommends having 250 MiB of free space for future updates. So I'm going to expand this recovery partition to 1 GiB. I'll add SystemRescue to the dual-boot. SystemRescue is a Linux system rescue toolkit that can be booted and used to manage or repair your system and data in the event of a crash on both Linux and Windows computers. It only takes 1 GiB of space. I will use the remaining space, which is approximately 98 GiB, to install Ubuntu Linux. For more information about Windows partitions, refer to the page: 'UEFI/GPT-based hard drive partitions'. By the end of this blog, after everything has been configured, this is how the partitions appear. To resize partitions, you'll need a bootable GParted Live image. GParted is a free partition manager that allows you to create, resize, copy, and move partitions without losing data. You can download the ISO from here: 'GParted Download Link'. After downloading the ISO image, make a bootable GParted Live USB image using a third-party tool such as Rufus. There are already numerous tutorials online on how to use Rufus. 2. Adjust Partition Sizes in Windows 11 Insert the bootable GParted Live USB image that you created earlier, and boot your computer. IMPORTANT: Before you resize your partitions in Windows 11, make sure you have turned off Bitlocker. Otherwise, you risk bricking your computer. You can enable it later, after all Windows partitions have been recreated. In the GParted boot menu, select the first option and press [Enter]. Next, select your key map. Then, choose your language. Finally, press [Enter] once more to start X. You will now be in the GParted desktop environment. First, shrink the Windows partition to 100 GiB to make room for the Ubuntu Linux operating system. Right-click on the 'Basic data partition' (for me, it is /dev/vda3) and click on the 'Resize/Move' option. Since you also need to enlarge the EFI System Partition from 100 MiB to 1 GiB (1024 MiB), set the 'Free space preceding' value to 924 MiB (1024-100=924) and press [Enter]. Next, change the 'New size' value to 102400 MiB (100x1024=102400, i.e. 100 GiB) and press [Enter]. Then, press the 'Resize/Move' button and finally press the 'Apply' button to start the moving and resizing process. The resizing process will begin after a few warnings. Because you are shrinking the partition on both sides (left and right), the data must be moved. So it will take some time depending on the size of the partition you want to move and the files it contains. So, please be patient. For me, it took about 20 minutes. After the resizing process is finished, this is how the partitions look. As you can see from the picture above, the Windows partition has shrunk to 100 GiB. You have 924 MiB of unallocated space on the left side of the Windows partition and approximately 98 GiB of unallocated space on the right. The next step is to move the Windows Recovery Partition directly next to the Windows 11 partition. This is what Microsoft recommends. Microsoft also recommends having 250 MiB of free space in the recovery partition. So the recovery partition will also need to be enlarged. Right-click on the recovery partition (for me, it is /dev/vda4) and click on the 'Resize/Move' option. Change the 'Free space preceding' value to 0 and press [Enter]. Then, change the 'New size' value to 1024 MiB (1 GiB) and press [Enter]. Then, press the 'Resize/Move' button and finally press the 'Apply' button to start the resizing process. This is how the partition looks after it has been moved and resized. It took me about 8 seconds to finish the job. As you can see from the picture above, the Microsoft Reserved Partition has been moved directly next to the Windows partition and enlarged in size to 1 GiB. The roughly 98 GiB of unallocated space has been moved to the far end. Next, move the Microsoft Reserved Partition just before the Windows 11 partition. Right-click on the Microsoft Reserved Partition (for me, it is /dev/vda2) and click on the 'Resize/Move' option. Change the 'Free space following' value to 0 and press [Enter]. Then, press the 'Resize/Move' button and finally press the 'Apply' button to start the resizing process. This is how the Microsoft Reserved Partition looks after it has been moved. It took me about 1 second to finish the job. As you can see from the picture above, the Microsoft Reserved Partition has been moved directly before the Windows partition. The unallocated 924 MiB of space has been moved to the left or right next to the EFI System partition. Finally, you need to enlarge the EFI System Partition from 100 MiB to 1 GiB. But there is a problem here. When you previously shrank or enlarged the partitions, the file systems on them shrank or enlarged automatically. This is not the case for EFI System Partition, as its file system is FAT32. The FAT32 file system will not automatically resize. You have to do it manually. So, before you enlarge the EFI System Partition, make a backup of its contents. Right-click on the EFI System Partition (for me, it is /dev/vda1) and click on the 'Information' option. Take note of the UUID and write it down somewhere. You'll need this UUID later when you enlarge the FAT32 file system. If you didn't provide the same UUID when enlarging the FAT32 file system, a different UUID will be assigned. As a result, you will lose your Windows 11 activation because it is now considered a different Windows computer. On the desktop, double-click on the terminal icon to open the terminal window. in the terminal, list your partitions. $ lsblk -pf NAME FSTYPE FSVER LABEL UUID ... /dev/vda ├─/dev/vda1 vfat FAT32 2EC4-E9ED ├─/dev/vda2 ├─/dev/vda3 ntfs BA2EC7192EC6CE17 └─/dev/vda4 ntfs 60C438D2C438AC62 For me, the EFI System Partition is the first partition, /dev/vda1. Yours will be different. The same UUID is visible here as well. Mount your EFI System Partition to /mnt. $ sudo mount -v /dev/vda1 /mnt Create a temporary directory for the ESP backup. $ sudo mkdir -v /esp Backup your ESP files to the newly created directory. $ sudo rsync -av /mnt/ /esp/ Un mount your EFI System Partition from /mnt. $ sudo umount -v /mnt Return to the GParted GUI manager. Right-click on the EFI System Partition (for me, it is /dev/vda1) and click on the 'Resize/Move' option. Change the 'New size' value to 1024 and press [Enter]. Then, press the 'Resize/Move' button and finally press the 'Apply' button to start the resizing process. As expected, you will receive this error message after enlarging the partition. The error occurred because the process was able to enlarge the partition but couldn't enlarge the FAT32 file system. There's no need to worry. Just press the OK button and then the Close button. Now, go back to the terminal window. Re-format the ESP (for me, it is /dev/vda1) using the FAT32 file system. Use the same UUID that you wrote down earlier. For me, the UUID is '2EC4-E9ED'. Replace the UUID with your own. You also need to remove the dash (-) from the UUID. $ sudo mkfs.fat -F 32 -i 2EC4E9ED /dev/vda1 Mount your newly formatted EFI System Partition to /mnt. $ sudo mount -v /dev/vda1 /mnt Restore your previous backup from the /esp directory to the /mnt directory. $ sudo rsync -av /esp/ /mnt/ Un mount your EFI System Partition from /mnt. $ sudo umount -v /mnt Return to the GParted GUI manager again. Click the GParted Menu, then Refresh Devices. You should now see a properly enlarged EFI System Partition of 1 GiB, with enough free space to accommodate multiple Linux operating systems. All the partitions have been resized and aligned as desired. You can now shut down your computer. Unplug the GParted Live USB drive and boot the computer to Windows 11. First, you should run the chkdsk command to scan the partitions and resolve any issues. So, open the terminal with administrative privileges. List all volumes by the drive letter and GUID. PS C:\> wmic volume get capacity,filesystem,name Capacity FileSystem Name 107374178304 NTFS C:\ 1073737728 NTFS \\?\Volume{f184beba-cc09-4c95-8280-1f2f952259a1}\ 1071624192 FAT32 \\?\Volume{d2174588-09d2-4fab-95cb-054fc2549870}\ Check the NTFS file system (WRE) and resolve any issues. PS C:\> chkdsk "\\?\Volume{f184beba-cc09-4c95-8280-1f2f952259a1}" /f Check the FAT32 file system (ESP) and resolve any issues. Since the ESP is already mounted, schedule the partition to be checked on the next boot. PS C:\> chkdsk "\\?\Volume{d2174588-09d2-4fab-95cb-054fc2549870}" /f The type of the file system is FAT32. Chkdsk cannot run because the volume is in use by another process. Chkdsk may run if this volume is dismounted first. ALL OPENED HANDLES TO THIS VOLUME WOULD THEN BE INVALID. Would you like to force a dismount on this volume? (Y/N) N Chkdsk cannot run because the volume is in use by another process. Would you like to schedule this volume to be checked the next time the system restarts? (Y/N) Y Check the NTFS file system (Windows 11) and resolve any issues. Since the Windows 11 partition is already mounted, schedule the partition to be checked on the next boot. PS C:\> chkdsk "C:" /f The type of the file system is NTFS. Cannot lock current drive. Chkdsk cannot run because the volume is in use by another process. Would you like to schedule this volume to be checked the next time the system restarts? (Y/N) Y Restart the computer. After the reboot, Windows will begin to check the partitions and resolve any issues. When the issues have been fixed, Windows will restart again and boot normally. Check your Windows 11 partitions in Disk Management again. Here's how they appear now. And in the terminal. PS C:\> diskpart DISKPART> list disk Disk ### Status Size Free Dyn Gpt -------- ------------- ------- ------- --- --- Disk 0 Online 200 GB 97 GB * DISKPART> select disk 0 DISKPART> list partition Partition ### Type Size Offset ------------- ---------------- ------- ------- Partition 1 System 1024 MB 1024 KB Partition 2 Reserved 16 MB 1025 MB Partition 3 Primary 100 GB 1041 MB Partition 4 Recovery 1024 MB 101 GB DISKPART> exit PS C:\> get-volume DriveLetter FileSystemType DriveType HealthStatus Operat.. SizeRemaining Size ----------- -------------- --------- ------------ -------- ------------- ---- C NTFS Fixed Healthy OK 69.91 GB 100 GB FAT32 Fixed Healthy OK 993.6 MB 1021.98 MB NTFS Fixed Healthy OK 339.18 MB 1024 MB The status of all partitions is 'Healthy'. 3. Disable Hibernation in Windows 11 It is recommended to disable hibernation on all operating systems in dual/multi-boot systems to avoid data loss. If you hibernate Windows and then start Linux, or hibernate Linux and then start Windows, you may damage the EFI system partition. Open the terminal with admin privileges and run the following command to check if hibernation is enabled or disabled: PS C:\> (GP "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power")."HiberbootEnabled" 1 If '1' is returned, Fast Startup is enabled; if '0' is returned, Fast Startup is disabled. To disable Fast Start/Hibernation on Windows 11, follow these steps: Enter regedit into the search box and press [Enter] to launch the Registry Editor. Browse to: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Power. Double-click on HiberbootEnabled and change its value from 1 to 0. Close the Registry Editor window and check again. PS C:\> (GP "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power")."HiberbootEnabled" 0 As you can see, the hibernation feature has been disabled. If hibernation is disabled, Fast Start will also be disabled, even if it appears to be enabled. Disabling hibernate overrides Fast Startup is turned on. Shut down Windows 11 before installing Ubuntu Linux. Rebooting is not sufficient. 4. Install Ubuntu Desktop 24.04 LTS Boot your system using the Ubuntu Desktop 24.04 LTS installer in UEFI mode. Next, select your language, keyboard layout, and other preferences. You should now be on the Disk setup screen. Select the Manual installation radio button, then click the Next button to continue. On the Manual Partitioning screen, you can create and mount the partitions needed to install Ubuntu. First, you need to mount the EFI System Partition. Select the EFI System Partition (for me, it is vda1) with VFAT file system type, and click on the Change button. Then, in the 'Edit partition' window, leave the 'Leave formatted as VFAT' option as is. This is critical: do not format it; leave it as is, in VFAT format. Then, set the mount point to '/boot/efi' and click the OK button to finish. Next, you must create a 1 GiB new partition. This partition won't be used for Ubuntu, but rather for the System Rescue toolkit. Select the Free Space and click on the + sign to create a partition. Next, set the partition size to 1024 MiB (1 GiB), Used as to Leave unformatted, do not specify a mount point, and then press OK to finish. Once I have finished installing Ubuntu, I will install the System Rescue Toolkit. Finally, you must create a partition to install Ubuntu. Select the Free Space again and click on the + sign to create a partition. I will use all the remaining space. Set the file system to Ext4, the Mount point to '/', and click OK to finish. All of the partitions r'''
