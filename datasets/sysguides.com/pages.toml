title = "Install Fedora 36 with LUKS Full Disk Encryption + snapper + grub-btrfs"
description = "Learn how to install Fedora 36 with LUKS Full Disk Encryption (FDE), snapper, and grub-btrfs, allowing you to do a full system rollback, including kernels."
full_description = '''Install Fedora 36 with LUKS Full Disk Encryption + snapper + grub-btrfs October 16, 2023 · By Madhu Desai in Distro, Security, Storage · In this post, I will show you how to install Fedora 36 with LUKS Full Disk Encryption (FDE) with snapper, and grub-btrfs, enabling you to do a full system rollback. In this setup, the /boot partition is included in the root file system, enabling you to make a full system rollback including kernels. Encrypting your laptop or computer's drive with LUKS Full Disk Encryption protects the data on it even if the disk is physically removed from the system. To access the decrypted content on the device, you need to provide a passphrase or key file. Apart from GNOME 42, another major change in Fedora 36 is the relocation of the RPM database from /var/lib/rpm to /usr/lib/sysimage/rpm. This is an important step towards full support for snapshot and rollback regimes, much like OpenSUSE Linux. Because the RPM database is now stored in /usr, the /usr may be rolled back as a unit without affecting /var. This will prevent any failed or undesired updates of the operating system. Here's a quick rundown of what to anticipate. Install Fedora 36 Workstation with a LUKS encrypted BTRFS ‘root file system’ and a separate un-encrypted EXT4 /boot partition, as the Anaconda installer does not support encryption of the /boot partition. Move the contents of the /boot partition to the ‘root file system,’ and configure GRUB to boot from it. Remove the old /boot partition and merge the space it used into the main BTRFS volume. Configure the system to ask for the passphrase only once by providing the key file. Install and configure snapper to take snapshots of the root file system. Install and configure grub-btrfs so that you are able to boot from snapshots using the GRUB menu. Finally, test the 'snapper undochange' and 'snapper rollback' commands to make sure everything is working correctly. If you prefer to install Fedora 36 without LUKS Full Disk Encryption, please visit my other article ‘How to Install Fedora 36 with Snapper and Grub-Btrfs‘. So let’s begin. Table of Contents 1. Disk Layout for Installing Fedora 36 Workstation 2. Install Fedora 36 Workstation 3. Move the /boot to the 'root file system' 4. Delete the /dev/sda3 Partition and Reclaim the Space 5. Bypass the Additional Passphrase Prompt 6. Install and Configure snapper for the 'root file system' 7. Setup Snapshot Booting from the GRUB Menu 8. Create Snapshots and Test the Undochange and Rollback Features Test 1: Install a package and undo it. Test 2: Update the kernel and do a rollback. 9. Conclusion Watch on YouTube 1. Disk Layout for Installing Fedora 36 Workstation I'll be using an 80 GiB hard disk. Because the Fedora Anaconda installer does not allow encryption of the /boot partition, either separately or within the root file system, you must first create a non-encrypted /boot partition separately. This is how the disk partition appears at first. NAME SIZE FSTYPE LABEL MOUNTPOINT /dev/sda 80G ├─/dev/sda1 512M vfat EFI /boot/efi ├─/dev/sda2 78G btrfs(LUKS) FEDORA / └─/dev/sda3 1.5G ext4 BOOT /boot Once the installation is finished, the /boot partition is moved to the root file system, and the final disk partition looks like this. NAME SIZE FSTYPE LABEL MOUNTPOINT /dev/sda 80G ├─/dev/sda1 512M vfat EFI /boot/efi └─/dev/sda2 79.5G btrfs(LUKS) FEDORA / And these are the subvolumes created from the btrfs volume (/dev/sda2). NAME MOUNTPOINT TYPE [main] / mainvolume home /home subvolume opt /opt subvolume tmp /tmp subvolume var /var subvolume usr-local /usr/local subvolume snapshots /.snapshots subvolume Subvolumes created to exclude directories from snapshots: /home Contains the user's data. It is excluded to avoid data loss on rollbacks. /opt Third-party products usually get installed here. It is excluded to avoid applications installed in /opt from being uninstalled during rollbacks. /tmp The directory contains temporary files that you do not need when taking a snapshot. /var This directory holds various variable data, such as logs, and temporary caches. It is also the default location for virtual machine images and databases. Therefore, this subvolume is created to exclude all of this variable data. Copy-On-Write will also be disabled on this directory. /usr/local Contains software that was manually installed. It is excluded to prevent these installations from being uninstalled during rollbacks. 2. Install Fedora 36 Workstation Boot your system using the Fedora 36 Workstation installer in UEFI mode. On the welcome screen, select the Install to Hard Drive option. Next, select your Language, Keyboard, and configure Time & Date. Following that, from the INSTALLATION SUMMARY screen, select Installation Destination. You should now be on the INSTALLATION DESTINATION screen. To proceed, pick the Advanced Custom (Blivet-GUI) radio button and then hit the Done button. You will see the BLIVET GUI PARTITIONING screen. Here you will create partitions, file systems, and btrfs subvolumes necessary to install Fedora 36 Workstation. First, you need to create and mount the EFI partition. Select the free space and click the + sign to create a partition. Set the partition Size to 512 MiB, the Filesystem to EFI System Partition, and the Mountpoint to /boot/efi. Then, you need to create a btrfs volume where you can create all the subvolumes needed to install Fedora Linux. Select the free space again and click on the + sign to create a Btrfs volume. (1) Set the Device Type to Btrfs Volume. (2) Set the Size of the Btrfs volume. At the end, leave at least 1 GiB for the /boot partition. I’ve left around 1.5 GiB unallocated. (3) Set the name for Btrfs volume. I named the Btrfs volume FEDORA, but you can name it whatever you like. (4) Set the Mountpoint to /, (5) Set the Encryption type to luks1, and (6) provide a strong password (password entropy > 60 bits is suggested). Finally, click on the OK button. Since support for LUKS2 in GRUB 2.0.6 is limited (Argon2 is not yet supported, only the PBKDF2 is supported), it is recommended to use LUKS1 to encrypt the disk if the /boot directory is in the ‘root file system’ and not on a separate partition. Hopefully, in the next release of GRUB, support for /boot partition encryption using LUKS2 with Argon2i and Argon2id will be added. You then need to create and mount the /boot partition. Set the boot partition to use all of the remaining unallocated space (1534 MiB), the Filesystem to ext4, and the Mountpoint to /boot. After the installation is finished, I’ll move the contents of the /boot partition to the main root file system and merge this 1.5 GiB space with the main BTRFS volume. Next, you must create subvolumes. (1) Select the Btrfs Volume from the left panel, and (2) click on the + sign on the right panel. Subvolumes, unlike standard partitions or LVM logical volumes, do not have a size; instead, they behave like directories with shared space. However, the resemblance of subvolumes to directories ends here. Each subvolume, like a file system, has its own file tree, has its own POSIX namespace, and has its own pool of inodes. This means that hard links cannot be created between the subvolumes. From this point of view, a subvolume begins to look more like a separate file system. Subvolumes are not block devices either. The Btrfs subvolumes are created in reverse order in the Anaconda installer for some reason. It means that the first specified subvolume is created last, and the last specified subvolume is created first. I will therefore specify the subvolumes in reverse order. Create snapshots subvolume. Enter the Name as snapshots and Mountpoint as /.snapshots. Click OK to finish. Repeat the same process for the other subvolumes. I created other subvolumes in the following order: usr-local (/usr/local), var (/var), tmp (/tmp), opt (/opt), and lastly home (/home). When completed, the subvolumes must look something like this. Click Done to create subvolumes. As with the swap partition, Fedora generates a SwapOnZRAM upon startup, so no separate swap partition is needed. Verify that the partitions and subvolumes are properly defined on the SUMMARY OF CHANGES screen. To finalize the changes, click the Accept Changes button. You will be returned to the INSTALLATION SUMMARY screen. Press the Begin Installation button to start the installation process. The installation process will start. Just sit back and relax. When the installation is finished, click the Finish installation button and restart the system. After the computer restarts, you will be prompted for the LUKS passphrase. Enter the LUKS passphrase that you provided. The last phase of the installation procedure will start. Click the Start Setup button to complete the remaining customization steps, such as setting a new login, password, and so on. You will then be logged into the Fedora 36 Workstation with the all-new Gnome 42 desktop interface. Now, open the Gnome terminal and check your current setup. List the subvolumes. # btrfs subvolume list / ID 256 gen 80 top level 5 path home ID 257 gen 44 top level 5 path opt ID 258 gen 80 top level 5 path tmp ID 259 gen 80 top level 5 path var ID 260 gen 70 top level 5 path usr-local ID 261 gen 19 top level 5 path snapshots ID 262 gen 77 top level 259 path var/lib/machines Show the BTRFS filesystem. # btrfs filesystem show / Label: 'FEDORA' uuid: e03e52c7-1d69-4f72-b674-5116352637a3 Total devices 1 FS bytes used 6.57GiB devid 1 size 78.00GiB used 8.02GiB path /dev/mapper/luks-6bb9a37b-e6f3-4e21-aeb9-841891d3cd71 List block devices. # lsblk -pf NAME FSTYPE FSVER LABEL UUID FSAVAIL FSUSE% MOUNTPOINTS /dev/sda ├─/dev/sda1 vfat FAT32 EFI 818A-7CD7 497.1M 3% /boot/efi ├─/dev/sda2 crypto_LUKS 1 6bb9a37b-e6f3-4e21-aeb9-841891d3cd71 │ └─/dev/mapper/luks-6bb9a37b-e6f3-4e21-aeb9-841891d3cd71 btrfs FEDORA e03e52c7-1d69-4f72-b674-5116352637a3 70.6G 8% /var │ /usr/local │ /tmp │ /.snapshots │ /opt │ /home │ / └─/dev/sda3 ext4 1.0 BOOT 2ecae8c7-8cd4-48e9-9faa-dc48d590fbbc 1.2G 10% /boot /dev/zram0 [SWAP] Review /etc/fstab file. # cat /etc/fstab UUID=e03e52c7-1d69-4f72-b674-5116352637a3 / btrfs defaults,x-systemd.device-timeout=0 0 0 UUID=e03e52c7-1d69-4f72-b674-5116352637a3 /.snapshots btrfs subvol=snapshots,compress=zstd:1,x-systemd.device-timeout=0 0 0 UUID=2ecae8c7-8cd4-48e9-9faa-dc48d590fbbc /boot ext4 defaults 1 2 UUID=818A-7CD7 /boot/efi vfat umask=0077,shortname=winnt 0 2 UUID=e03e52c7-1d69-4f72-b674-5116352637a3 /home btrfs subvol=home,compress=zstd:1,x-systemd.device-timeout=0 0 0 UUID=e03e52c7-1d69-4f72-b674-5116352637a3 /opt btrfs subvol=opt,compress=zstd:1,x-systemd.device-timeout=0 0 0 UUID=e03e52c7-1d69-4f72-b674-5116352637a3 /tmp btrfs subvol=tmp,compress=zstd:1,x-systemd.device-timeout=0 0 0 UUID=e03e52c7-1d69-4f72-b674-5116352637a3 /usr/local btrfs subvol=usr-local,compress=zstd:1,x-systemd.device-timeout=0 0 0 UUID=e03e52c7-1d69-4f72-b674-5116352637a3 /var btrfs subvol=var,compress=zstd:1,x-systemd.device-timeout=0 0 0 Review the device LUKS encryption details. # cryptsetup luksDump /dev/sda2 LUKS header information for /dev/sda2 Version: 1 Cipher name: aes Cipher mode: xts-plain64 Hash spec: sha256 Payload offset: 4096 MK bits: 512 MK digest: 77 ea cc 07 89 01 a1 11 be 48 a8 4f b3 50 c4 6a b6 c0 bf 80 MK salt: 62 39 cf ea 60 73 48 0d 9a 8e 95 7b b3 85 f9 71 d2 fb 9b e7 27 24 51 41 77 56 07 97 1e bf 70 22 MK iterations: 86118 UUID: 6bb9a37b-e6f3-4e21-aeb9-841891d3cd71 Key Slot 0: ENABLED Iterations: 1376082 Salt: e1 b3 30 fb 23 b9 fa e5 a4 c4 4b b1 7e e6 f1 67 36 8d d0 51 a0 49 7a d2 5d 7d 81 02 11 36 42 f7 Key material offset: 8 AF stripes: 4000 Key Slot 1: DISABLED Key Slot 2: DISABLED Key Slot 3: DISABLED Key Slot 4: DISABLED Key Slot 5: DISABLED Key Slot 6: DISABLED Key Slot 7: DISABLED Because of the Copy-On-Write feature of BTRFS, the performance of qcow2 images and databases suffers when they are on a BTRFS subvolume. Therefore, you need to disable the Copy-On-Write function on the /var directory. # chattr -R -f +C /var # lsattr -d /var ---------------C------ /var 3. Move the /boot to the 'root file system' Now that the installation is complete, transfer the contents of the /boot partition to the 'root file system', and configure GRUB to boot from it. Unmount the /boot mount recursively. # umount -vR /boot umount: /boot/efi unmounted umount: /boot unmounted Now mount the /dev/sda3 device into the /mnt directory temporarily. # mount -v /dev/sda3 /mnt mount: /dev/sda3 mounted on /mnt. Copy all boot files from /mnt to the /boot directory. # cp -arv /mnt/. /boot Unmount the /dev/sda3 partition from /mnt and delete its entry from the /etc/fstab file. You no longer need the /dev/sda3 partition. # umount -v /mnt # sed -i.original '/\/boot.*ext4/d' /etc/fstab # systemctl daemon-reload # mount -a Restore the SELinux labels. # restorecon -RFv /boot Enable the CRYPTODISK option in GRUB. When enabled, it will check the encrypted disks and generate the additional commands needed to access them during boot. # echo "GRUB_ENABLE_CRYPTODISK=y" >> /etc/default/grub # grub2-mkconfig -o /boot/grub2/grub.cfg The kernel and initrd paths are configured to look in the parent directory of the previous /boot partition (/dev/sda3). This must be changed to the /boot directory in the ‘root file system’ (/dev/sda2). # grubby --info=DEFAULT index=0 kernel="/vmlinuz-5.17.5-300.fc36.x86_64" args="ro rd.luks.uuid=luks-6bb9a37b-e6f3-4e21-aeb9-841891d3cd71 rhgb quiet" root="UUID=e03e52c7-1d69-4f72-b674-5116352637a3" initrd="/initramfs-5.17.5-300.fc36.x86_64.img" title="Fedora Linux (5.17.5-300.fc36.x86_64) 36 (Workstation Edition)" id="aa65c3ac5d924efba3b0301f2a0cd167-5.17.5-300.fc36.x86_64" To do this, first, remove the old Boot Loader Specification (BLS) configuration files. # rm /boot/loader/entries/*.conf Then recreate the BLS config file by adding the kernel image. # kernel-install -v add $(uname -r) /lib/modules/$(uname -r)/vmlinuz Examine the newly created BLS configuration files. The ‘/boot‘ directory should be added to the kernel and initrd lines. # grubby --info=DEFAULT index=0 kernel="/boot/vmlinuz-5.17.5-300.fc36.x86_64" args="ro rd.luks.uuid=luks-6bb9a37b-e6f3-4e21-aeb9-841891d3cd71 rhgb quiet" root="UUID=e03e52c7-1d69-4f72-b674-5116352637a3" initrd="/boot/initramfs-5.17.5-300.fc36.x86_64.img" title="Fedora Linux (5.17.5-300.fc36.x86_64) 36 (Workstation Edition)" id="aa65c3ac5d924efba3b0301f2a0cd167-5.17.5-300.fc36.x86_64" As CRYPTODISK is now enabled, you must make changes to /boot/efi/EFI/fedora/grub.cfg file as well. Setup access to the encrypted boot device. # CRYPTOUUID="$(grub2-probe --target=cryptodisk_uuid /)" # sed -i.backup1 "1i cryptomount -u $CRYPTOUUID" /boot/efi/EFI/fedora/grub.cfg Replace the old /dev/sda3 device UUID with a LUKS encrypted device UUID where the root file system is mounted. # OLDBOOTUUID="$(lsblk -dno uuid /dev/sda3)" # NEWLUKSUUID="$(lsblk -dno uuid /dev/mapper/luks-$(cryptsetup luksUUID /dev/sda2))" # sed -i.b'''
