title = "How to Install Fedora 37 with LUKS Full Disk Encryption, Snapper, and Grub-Btrfs for Full System Rollback"
description = "Install Fedora 37 with LUKS Full Disk Encryption, Snapper, and Grub-Btrfs to take snapshots of the / and /home subvolumes and do a full system rollback if something goes wrong."
full_description = '''How to Install Fedora 37 with LUKS Full Disk Encryption, Snapper, and Grub-Btrfs for Full System Rollback October 16, 2023 · By Madhu Desai in Distro, Security, Storage · In this blog, I will show you how to install Fedora 37 with LUKS Full Disk Encryption, snapper, and grub-btrfs packages, allowing you to take snapshots of the / and /home subvolumes as well as perform a full system rollback on the / volume if something goes wrong. LUKS encryption protects the data in a block device while it is offline. This is especially important for mobile devices such as laptops because your hard drive can be easily accessed if left in the wrong places or, worse, stolen. To access the decrypted content on the device, you need to provide a passphrase or key file. The LUKS Full Disk Encryption will take care of this. Regarding the snapshot rollback, I hoped that in Fedora 37, the DNF database would be relocated to /usr, as the RPM database was in Fedora 36. Sadly, It did not happen. It is still held back in /var/lib/dnf. So, to avoid package mismatches between the two databases, I need to keep the /var directory in the rollback regime. I will, however, exclude the /var/log directory so that log data are not lost during rollbacks. You may add more directories if you wish. Here is a brief overview of what needs to be done. Design the disk layout to install Fedora 37. Install Fedora 37 with a LUKS encrypted btrfs / filesystem and an unencrypted separate ext4 /boot partition, as the Anaconda installer does not support encryption of the /boot partition. After the installation is complete, copy the contents of the /boot partition to encrypted /, and configure GRUB to boot from it. Remove the ext4 /boot partition and merge its space with the btrfs volume. Configure the system to request the LUKS passphrase only once by supplying the key file. Install and configure snapper to take snapshots of the / and /home subvolume. Install and configure grub-btrfs to add snapshots menu to GRUB, allowing you to perform a full system rollback on the / volume. Finally, do some tests on the snapper 'undo change' and rollback features to ensure that everything is working properly. If you prefer to install Fedora 37 without LUKS Full Disk Encryption but still have Full System Rollback feature, please visit my other article ‘How to Install Fedora 37 with Snapper and Grub-Btrfs for Full System Rollback‘ If you prefer to install Fedora 37 with LUKS Full Disk Encryption (FDE) using Fedora’s default partition layout, please visit my other article ‘How to Install Fedora 37 with LUKS Full Disk Encryption (FDE)‘. So let’s begin. Table of Contents 1. Disk Layout for Installing Fedora 37 2. Install Fedora 37 Workstation 3. Move /boot to the / Filesystem 4. Remove the /boot Partition and Reclaim the Space 5. Bypass the Additional Passphrase Prompt 6. Install and Configure Snapper 7. Install and Configure Grub-Btrfs 8. Test the Snapper's Undochange and Rollback Features 9. Conclusion Watch on YouTube 1. Disk Layout for Installing Fedora 37 Since the Anaconda installer does not allow encryption of the /boot partition, either separately or in the / filesystem, you first need to create an unencrypted /boot partition separately. This is how the disk partition appears at first. I will use a 100 GiB hard disk for the demonstration. NAME SIZE FSTYPE LABEL MOUNTPOINT /dev/vda 100G ├─/dev/vda1 512M vfat EFI /boot/efi ├─/dev/vda2 98G btrfs (LUKS) FEDORA / └─/dev/vda3 1.5G ext4 BOOT /boot When the installation is complete, I will copy the contents of the /boot partition to the / file system. The final disk partition looks like this. NAME SIZE FSTYPE LABEL MOUNTPOINT /dev/vda 100G ├─/dev/vda1 512M vfat EFI /boot/efi └─/dev/vda2 99.5G btrfs (LUKS) FEDORA / And, these are the subvolumes that will be created from the encrypted btrfs volume (/dev/vda2). NAME MOUNTPOINT TYPE [main] / mainvolume home /home subvolume var/log /var/log subvolume .snapshots /.snapshots subvolume home/.snapshots /home/.snapshots subvolume Below are the directories for which subvolumes are created and the reasons for doing so. /home Contains user data. It is created to keep user data separate and also to avoid loss of user data on / volume rollbacks. /var/log Contains log files. It is created to avoid the loss of log data during rollbacks. /.snapshots Contains snapshots of / volume. Allows you to undo any changes or completely roll back a snapshot from the GRUB menu. /home/.snapshots Contains snapshots of /home subvolume. Allows you to undo any changes in the /home directory. No rollbacks from the GRUB menu on the /home directory. Depending on your needs, you may also want to create some additional subvolumes. For example, /opt, /var/www, /var/lib/libvirt/images, and so on. 2. Install Fedora 37 Workstation Boot your system using the Fedora 37 Workstation installer in UEFI mode. On the welcome screen, select the Install to Hard Drive option. Next, select your Language, Keyboard, and configure Time & Date. Following that, from the INSTALLATION SUMMARY screen, select Installation Destination. You should now be on the INSTALLATION DESTINATION screen. To proceed, pick the Advanced Custom (Blivet-GUI) radio button and then hit the Done button. On the BLIVET GUI PARTITIONING screen, create the partitions, file systems, and btrfs subvolumes necessary to install Fedora 37 Workstation. First, you need to create and mount the EFI partition. Select the free space and click the + sign to create a partition. Set the partition size to 512 MiB, the filesystem to EFI System Partition, and the mountpoint to /boot/efi. Then, you need to create a btrfs volume where you can create all the subvolumes needed to install Fedora 37 Workstation. Select the free space again and click on the + sign to create a btrfs filesystem. Set the size of the btrfs filesystem. I allocated 98 GiB for the btrfs filesystem and left roughly 1.5 GiB unallocated for the /boot partition. Set btrfs as the filesystem and / as the mountpoint. Enable encryption, set encryption to luks2, and provide a strong passphrase with entropy greater than 60 bits. Finally, click on the OK button. You then need to create and mount the /boot partition. Set the boot partition to use all of the remaining unallocated space (1534 MiB), the filesystem to ext4, and the mountpoint to /boot. After the installation is finished, I’ll move the contents of the /boot partition to the main root file system and merge this 1.5 GiB space with the main BTRFS volume. Next, you must create a home subvolume. (1) Select the Btrfs Volume from the left panel, and (2) click on the + sign on the right panel. Create a home subvolume. Enter the name as home and mountpoint as /home. Click OK to finish. I will create the remaining subvolumes when the installation is finished. This is because the Anaconda installer does not allow you to create subvolumes with slashes (/) in their names, such as var/log. For now, click Done to finish creating subvolumes. On the SUMMARY OF CHANGES screen, double-check that everything is properly defined. To finalize the changes, click the Accept Changes button. You will be returned to the INSTALLATION SUMMARY screen. Press the Begin Installation button to start the installation process. The installation process will start. Just sit back and relax. When the installation is finished, click the Finish installation button and restart the system. After the computer restarts, you will be prompted for the LUKS passphrase. Enter the LUKS passphrase that you provided. The last phase of the installation procedure will start. Click the Start Setup button to complete the remaining customization steps, such as setting a new login, password, and so on. You will then be logged into the Fedora 37 Workstation with the all-new Gnome 43 desktop interface. Now, open the Gnome terminal. Set the btrfs volume label. I named the btrfs volume FEDORA, but you may name it whatever you want. $ sudo btrfs filesystem label / FEDORA $ sudo btrfs filesystem show / Label: 'FEDORA' uuid: 551495dd-6ade-4c3a-b3e2-8499fd328d84 Total devices 1 FS bytes used 6.08GiB devid 1 size 97.98GiB used 8.02GiB path /dev/mapper/luks-cba88ec4-737a-4fd4-982b-f358df4e07de Create the /var/log subvolume. $ sudo mv -v /var/log /var/log-old $ sudo btrfs subvolume create /var/log $ sudo cp -arv /var/log-old/. /var/log/ $ sudo restorecon -RFv /var/log $ sudo rm -rvf /var/log-old If you wish to create more subvolumes, use the same methods as above. In the /etc/fstab file, add the newly created /var/log subvolume. The updated line is displayed in amber. Replace UUID with your setup's UUID. $ sudo vi /etc/fstab UUID=551495dd-6ade-4c3a-b3e2-8499fd328d84 / btrfs defaults,x-systemd.device-timeout=0 0 0 UUID=3b799f31-f992-4f32-b916-f7d048f47a80 /boot ext4 defaults 1 2 UUID=7056-1E69 /boot/efi vfat umask=0077,shortname=winnt 0 2 UUID=551495dd-6ade-4c3a-b3e2-8499fd328d84 /home btrfs subvol=home,compress=zstd:1,x-systemd.device-timeout=0 0 0 UUID=551495dd-6ade-4c3a-b3e2-8499fd328d84 /var/log btrfs subvol=var/log,compress=zstd:1,x-systemd.device-timeout=0 0 0 Reload the /etc/fstab file to mount all filesystems. $ sudo systemctl daemon-reload $ sudo mount -va Your setup should now look somewhat like this. $ lsblk -p NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINTS /dev/zram0 251:0 0 3.8G 0 disk [SWAP] /dev/vda 252:0 0 100G 0 disk ├─/dev/vda1 252:1 0 512M 0 part /boot/efi ├─/dev/vda2 252:2 0 98G 0 part │ └─/dev/mapper/luks-cba88ec4-737a-4fd4-982b-f358df4e07de 253:0 0 98G 0 crypt /var/log │ /home │ / └─/dev/vda3 252:3 0 1.5G 0 part /boot Finally, list all subvolumes. $ sudo btrfs subvolume list / ID 256 gen 65 top level 5 path home ID 257 gen 51 top level 5 path var/lib/machines ID 258 gen 70 top level 5 path var/log The var/lib/machines subvolume is created by systemd implicitly in Fedora 37 Workstation for systemd-nspawn containers. The Fedora 37 Workstation installation is now complete. 3. Move /boot to the / Filesystem You must now copy the contents of the ext4 /boot partition to the /boot directory in the root file system and configure GRUB to boot from it. First, unmount the /dev/vda3 (boot) and /dev/vda1 (EFI) partitions from the /boot directory. $ sudo umount -vR /boot Then, mount the /dev/vda3 partition in the /mnt directory temporarily. $ sudo mount -v /dev/vda3 /mnt Now, copy all boot files from /mnt to the /boot directory. $ sudo cp -arv /mnt/. /boot Unmount the /dev/vda3 partition from /mnt and delete its entry from the /etc/fstab file. You no longer need the /dev/vda3 partition. $ sudo umount -v /mnt $ sudo sed -i.original '/\/boot.*ext4/d' /etc/fstab $ sudo systemctl daemon-reload $ sudo mount -va Restore the SELinux labels to the /boot directory. $ sudo restorecon -RFv /boot Enable the CRYPTODISK option in GRUB. When enabled, it will check the encrypted disks and generate the additional commands needed to access them during boot. $ echo 'GRUB_ENABLE_CRYPTODISK=y' | sudo tee -a /etc/default/grub $ sudo grub2-mkconfig -o /boot/grub2/grub.cfg The kernel and initrd paths are configured to look in the /boot partition (/dev/vda3). $ sudo grubby --info=DEFAULT index=0 kernel="/vmlinuz-6.0.7-301.fc37.x86_64" args="ro rd.luks.uuid=luks-cba88ec4-737a-4fd4-982b-f358df4e07de rhgb quiet" root="UUID=551495dd-6ade-4c3a-b3e2-8499fd328d84" initrd="/initramfs-6.0.7-301.fc37.x86_64.img" title="Fedora Linux (6.0.7-301.fc37.x86_64) 37 (Workstation Edition)" id="a8e42b5bf3ef4631a3af52c673d68d12-6.0.7-301.fc37.x86_64" This must be changed to the /boot directory in the / filesystem (/dev/vda2). To do this, first, remove the old Boot Loader Specification (BLS) configuration files. $ sudo sh -c 'rm -i /boot/loader/entries/*.conf' Then recreate the BLS config file by adding the kernel image. $ sudo kernel-install -v add $(uname -r) /lib/modules/$(uname -r)/vmlinuz Take a look at the newly created BLS configuration files. The ‘/boot‘ directory should be added to the kernel and initrd lines. $ sudo grubby --info=DEFAULT index=0 kernel="/boot/vmlinuz-6.0.7-301.fc37.x86_64" args="ro rd.luks.uuid=luks-cba88ec4-737a-4fd4-982b-f358df4e07de rhgb quiet" root="UUID=551495dd-6ade-4c3a-b3e2-8499fd328d84" initrd="/boot/initramfs-6.0.7-301.fc37.x86_64.img" title="Fedora Linux (6.0.7-301.fc37.x86_64) 37 (Workstation Edition)" id="a8e42b5bf3ef4631a3af52c673d68d12-6.0.7-301.fc37.x86_64" As CRYPTODISK is now enabled, you must make changes to /boot/efi/EFI/fedora/grub.cfg file as well. List your device's UUIDs first. $ lsblk -po name,uuid,mountpoints /dev/vda NAME UUID MOUNTPOINTS /dev/vda ├─/dev/vda1 7056-1E69 /boot/efi ├─/dev/vda2 cba88ec4-737a-4fd4-982b-f358df4e07de │ └─/dev/mapper/luks-cba88ec4-737a-4fd4-982b-f358df4e07de 551495dd-6ade-4c3a-b3e2-8499fd328d84 /var/log │ /home │ / └─/dev/vda3 3b799f31-f992-4f32-b916-f7d048f47a80 Set up access to the encrypted boot device by adding the cryptomount command. $ CRYPTOUUID="$(sudo cryptsetup luksUUID /dev/vda2 | tr -d -)" $ sudo sed -i.backup1 "1i cryptomount -u ${CRYPTOUUID}" /boot/efi/EFI/fedora/grub.cfg Replace the /dev/vda3 device UUID with the UUID of a LUKS encrypted device where the / file system is mounted. $ OLDUUID="$(lsblk -dno uuid /dev/vda3)" $ NEWUUID="$(lsblk -dno uuid /dev/mapper/luks-$(sudo cryptsetup luksUUID /dev/vda2))" $ sudo sed -i.backup2 "s/${OLDUUID}/${NEWUUID}/" /boot/efi/EFI/fedora/grub.cfg And add /boot to the grub2 path. $ sudo sed -i.backup3 's#($dev)/grub2#($dev)/boot/grub2#' /boot/efi/EFI/fedora/grub.cfg In the end, the modifications to the /boot/efi/EFI/fedora/grub.cfg file should be from this ... search --no-floppy --fs-uuid --set=dev 3b799f31-f992-4f32-b916-f7d048f47a80 set prefix=($dev)/grub2 export $prefix configfile $prefix/grub.cfg ... to this. cryptomount -u cba88ec4737a4fd4982bf358df4e07de search --no-floppy --fs-uuid --set=dev 551495dd-6ade-4c3a-b3e2-8499fd328d84 set prefix=($dev)/boot/grub2 export $prefix configfile $prefix/grub.cfg The changes are as follows. Line 1: Amber color. Set up access to the encrypted boot device. The UUID here is of the /dev/vda2 partition without dashes (-). Line 2: Cyan color. Replace the UUID of /boot partition. The new UUID is of the LUKS encrypted / filesystem. Line 3: Orange color: Insert the '/boot' directory into the 'set prefix' line. Finally, you need to change the Password-Based Key Derivation Function (PBKDF) algorithm for LUKS keyslot. By default PBKDF for LUKS2 is argon2id. $ sudo cryptsetup luksDump /dev/vda2 | grep 'PBKDF:' PBKDF: argon2id However, GRUB currently only supports pbkdf2. As a result, you must change the PBKDF algorithm. You should also change the iteration count. The more powerful your CPU, the higher the iteration count. And, the higher the iteration count, the longer it takes to unlock the LUKS in the GRUB. For pbkdf2, the minimum iteration count is 1000 and the maximum is 4294967295. I will set the iteration count to 500000. Lowering the iterations reduces security. To get around it, use a stronger passphrase with higher entro'''
