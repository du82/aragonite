["https://sysguides.com/install-fedora-with-luks-fde-snapshot-rollback-support"]
title = "How to Install Fedora 40 with LUKS Full Disk Encryption, Snapshot, and Rollback Support"
description = "In this post, I will show you how to install Fedora 40 with full disk encryption, snapshot, and rollback support. You can take snapshots of the / and /home subvolumes and perform a full system rollback on the / subvolume if something goes wrong."
full_description = '''How to Install Fedora 40 with LUKS Full Disk Encryption, Snapshot, and Rollback Support October 30, 2024 · By Madhu Desai in Distro, Security, Storage · 88 comments on How to Install Fedora 40 with LUKS Full Disk Encryption, Snapshot, and Rollback Support An updated version of this guide for Fedora Linux 41 is now available. Check it out! Fedora Linux 40 has been released! In this guide, I will show you how to install Fedora 40 with LUKS full disk encryption, snapshot, and rollback support. As a result, if you make a mistake while modifying the system configuration, installing packages, or updating, you won't have to worry about breaking the system. Simply restore the snapshot prior to the problematic change, and you'll be fine. I will install Fedora Workstation 40 using the command-line interface rather than the default Anaconda GUI installer. The Anaconda installer does not support encrypting the /boot directory. Also, by using a command-line interface, you can perform an advanced installation. The steps in the guide may appear overwhelming, but they are not. I made sure that almost all commands could be copied and pasted to avoid typos and also save time typing them. You can also use these commands to write a bash script to automate the installation. If you want to install Fedora 40 without LUKS Full Disk Encryption but still have Full System Rollback, please see my other article, How to Install Fedora 40 with Snapshot and Rollback Support. So let's get started. Table of Contents 1. Partitions and Subvolumes Layout 2. Create Partitions and File Systems 3. Create Directories and Subvolumes 4. Bootstrap Fedora in a Chroot Environment 5. Create a User Account 6. Create the Remaining Subvolumes 7. Create the fstab File 8. Create GRUB Configuration File 9. Add Boot Entry, Exit Chroot, and Restart 10. Install the Desktop Environment 11. Bypass the Additional Passphrase Prompt 11.1 Using a Key File 11.2 Using TPM2 Method 12. Install and Configure Snapper 13. Install and Configure Grub-Btrfs 14. Create a System Root Snapshot and Set It as the Default 15. Snapper Tests Test 1: Undo the Changes Made by the DNF Installer Test 2: Undo Any Changes Made to Individual Files Test 3: Create Manual Pre-Post Snapshots and Undo the Changes Test 4: Rollback to a Previous Snapshot from the GRUB Menu 16. Make a Snapshot the New System Root 17. Enable Automatic Timeline Snapshots 18. Issues and Possible Solutions 19. Watch on YouTube 1. Partitions and Subvolumes Layout For this guide, I will use a hard disk with a capacity of 128 GiB. I'll create a 600 MiB EFI system partition and use the remaining disk space to create a partition for the Linux file system. Fedora also creates a SwapOnZRAM during boot, so no separate swap partition is required. This is how the disk partition looks: NAME SIZE FSTYPE PARTTYPENAME MOUNTPOINT/dev/vda 128G /dev/vda1 600M vfat EFI System /boot/efi/dev/vda2 127.4G btrfs (LUKS) Linux filesystem / First, I will encrypt the Linux partition (/dev/vda2) with LUKS. Next, on the encrypted LUKS partition, I will create a btrfs file system. Then, on the btrfs file system, I'll create the following subvolumes to keep them out of root file system snapshots. NAME MOUNTPOINT TYPE[main] / mainvolumehome /home subvolumeopt /opt subvolume.snapshots /.snapshots subvolumecache /var/cache subvolumecrash /var/crash subvolumeAccountsService /var/lib/AccountsService subvolumegdm /var/lib/gdm subvolumeimages /var/lib/libvirt/images subvolumemachines /var/lib/machines subvolumeportables /var/lib/portables subvolumelog /var/log subvolumespool /var/spool subvolumetmp /var/tmp subvolumewww /var/www subvolume.snapshots /home/.snapshots subvolume.mozilla /home/$USER/.mozilla subvolume The directories for which subvolumes are created and the reasons for doing so are listed below. For more information, visit this website. /home Contains user data. It will be created to keep user data separate while also preventing data loss during system root rollbacks. /opt Contains applications installed by a third party. It will be created to prevent these applications from being uninstalled during rollbacks. /.snapshots, /home/.snapshots Contains snapshots of the root (/) and home (/home) directories. /var/cache, /var/crash, /var/tmp Directories contain temporary files and caches. So they're created to be excluded from snapshots. Fedora mounts /tmp with tmpfs at boot, so a separate subvolume is unnecessary. /var/log Contains log files. It will be created to prevent the loss of log data during rollbacks. /var/spool Contains data that is awaiting some kind of later processing, such as mail, mail queues, printing, printer spool, and so on. It will be created to prevent the loss of mail, printing, and spool data following a rollback. /var/www Web server directory. It will be created to keep hosted web server data separate and prevent data loss during system root rollbacks. /var/lib/AccountsService, /var/lib/gdm Contains login user and Gnome display information. These directories must be writable at all times. When you try to boot a snapshot from the GRUB menu, you are booting into a read-only snapshot, which causes the system to hang just before the Gnome login screen appears. In case you're using a desktop environment other than Gnome, it's necessary to replace the '/var/lib/gdm' with one that's specific to your desktop environment. For KDE, it is '/var/lib/sddm'. To find out about other desktop environments, refer to this page. /var/lib/libvirt/images The default location for libvirt-managed virtual machine images. It will be created so that virtual machine images are not replaced with older versions during a rollback. /var/lib/machines, /var/lib/portables These directories are used for managing containers and portable images. /home/$USER/.mozilla By default, Fedora Workstation includes the Firefox web browser. If you take a snapshot of your home directory and later undo any changes, you don't want to lose any new bookmarks, passwords, and other user data. So, I'll create a subvolume for the '.mozilla' directory. This keeps it separate from the home subvolume and prevents data loss during undo operations. Depending on your usage, you may also want to consider creating subvolumes in your home directory for the following directories: Chrome Browser: /home/$USER/.config/google-chrome GnuPG: /home/$USER/.gnupg SSH: /home/$USER/.ssh Thunderbird Mail: /home/$USER/.thunderbird 2. Create Partitions and File Systems Boot your system using the Fedora 40 Workstation Live installer in UEFI mode. In the 'Welcome to Fedora' window, click the 'Not Now' button to return to the Gnome desktop. Next, launch Gnome Terminal to begin preparing the system for Fedora 40 installation. Change to super user. $ sudo -i The Fedora 40 Workstation Live installer is missing the gdisk package, which is required to create partitions. So, install it. # dnf -y install gdisk Locate the disk on which you want to install Fedora. # lsblk -pd NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINTS /dev/loop0 7:0 0 2G 1 loop /dev/loop1 7:1 0 8G 1 loop /dev/loop2 7:2 0 32G 0 loop /dev/sr0 11:0 1 2.1G 0 rom /run/initramfs/live /dev/zram0 251:0 0 5.8G 0 disk [SWAP] /dev/vda 252:0 0 128G 0 disk For me, it is /dev/vda. Yours might be different. In the DISK_DEVICE variable, set the name of your disk device. # export DISK_DEVICE='/dev/vda' Create an EFI System Partition of 600 MiB. I'll name the partition 'ESP', but you can give it any name. # sgdisk -n1::+600M -t1:EF00 -c1:'ESP' ${DISK_DEVICE} Create a Linux file system partition on which Fedora will be installed. I will use the entire remaining space. I'll name this partition 'LINUX', but you can give it any name. # sgdisk -n2:: -t2:8300 -c2:'LINUX' ${DISK_DEVICE} List the partitions you just created to ensure that everything is in order. # sgdisk -p ${DISK_DEVICE} Disk /dev/vda: 268435456 sectors, 128.0 GiB ... Total free space is 2014 sectors (1007.0 KiB) Number Start (sector) End (sector) Size Code Name 1 2048 1230847 600.0 MiB EF00 ESP 2 1230848 268435422 127.4 GiB 8300 LINUX Get the device names for the EFI system partition and the Linux file system partition, and assign them to the appropriate variables. # export ESP_PRTN="$(fdisk -x ${DISK_DEVICE} \ | grep -i 'C12A7328-F81F-11D2-BA4B-00A0C93EC93B' \ | grep 'ESP' \ | cut -d' ' -f1)" # export LINUX_PRTN="$(fdisk -x ${DISK_DEVICE} \ | grep -i '0FC63DAF-8483-4772-8E79-3D69D8477DE4' \ | grep 'LINUX' \ | cut -d' ' -f1)" # echo ${ESP_PRTN} ${LINUX_PRTN} /dev/vda1 /dev/vda2 Initialize the /dev/vda2 partition as a LUKS device and set the initial passphrase. # cryptsetup luksFormat ${LINUX_PRTN} \ --type luks2 \ --label FEDORA_LUKS \ --pbkdf pbkdf2 \ --pbkdf-force-iterations 500000 WARNING! ======== This will overwrite data on /dev/vda2 irrevocably. Are you sure? (Type 'yes' in capital letters): YES Enter passphrase for /dev/vda2: Verify passphrase: GRUB currently only supports pbkdf2 algorithm. For pbkdf2, the minimum iteration count is 1000 and the maximum is 4294967295. The more powerful your CPU, the higher the iteration count. And, the higher the iteration count, the longer it takes to unlock the LUKS in the GRUB. So I have set the iteration count to 500000. Lowering the iterations reduces security. To get around it, use a stronger passphrase with higher entropy (password entropy > 60 bits is suggested). Now, open the LUKS device /dev/vda2 and map it to the temporary name tmpluks. I'll map the LUKS device to the proper UUID later. When prompted, enter the LUKS passphrase you just provided. # cryptsetup luksOpen ${LINUX_PRTN} tmpluks Enter passphrase for /dev/vda2: Format the EFI System Partition with the FAT32 file system. I'll name the volume 'EFI', but you may name it whatever you want. # mkfs.fat -F 32 -n EFI ${ESP_PRTN} Format the mapped device with the BTRFS file system. I'll name the volume 'FEDORA', but you may name it whatever you want. # mkfs.btrfs -L FEDORA /dev/mapper/tmpluks This is how your setup should look. The UUIDs will be unique to your system. # udevadm trigger # lsblk -po name,size,fstype,fsver,label,uuid ${DISK_DEVICE} NAME SIZE FSTYPE FSVER LABEL UUID /dev/vda 128G ├─/dev/vda1 600M vfat FAT32 EFI 10AA-4B95 └─/dev/vda2 127.4G crypto_LUKS 2 FEDORA_LUKS 20bb5f16-3489-439d-8cb3-96f7da6a6c63 └─/dev/mapper/tmpluks 127.4G btrfs FEDORA 30cca32b-5982-4069-9ebe-c96d3579125f Get the UUIDs of the LUKS partition and other file systems and store them in variables. You'll be using these UUIDs frequently. # export LINUX_PRTN_LUKS_UUID="$(cryptsetup luksUUID ${LINUX_PRTN})" # export VFAT_FS_UUID="$(lsblk -lnpo uuid ${ESP_PRTN})" # export BTRFS_FS_UUID="$(lsblk -lnpo uuid /dev/mapper/tmpluks)" # printf "${VFAT_FS_UUID}\n${LINUX_PRTN_LUKS_UUID}\n${BTRFS_FS_UUID}\n" 10AA-4B95 20bb5f16-3489-439d-8cb3-96f7da6a6c63 30cca32b-5982-4069-9ebe-c96d3579125f 3. Create Directories and Subvolumes First, mount the LUKS device with the btrfs file system (/dev/mapper/tmpluks) to /mnt. You will receive the SELinux labels warning. The restorecon command will fix this. # mount -v -o compress=zstd:1 /dev/mapper/tmpluks /mnt # restorecon -vRF /mnt Then, create the necessary directories and subvolumes. If you're installing Fedora for the KDE desktop, replace '/mnt/var/lib/gdm' with '/mnt/var/lib/sddm'. # mkdir -vp /mnt/boot/efi # mkdir -vp /mnt/var/lib/libvirt # mount -v ${ESP_PRTN} /mnt/boot/efi # btrfs subvolume create /mnt/home # btrfs subvolume create /mnt/opt # btrfs subvolume create /mnt/.snapshots # btrfs subvolume create /mnt/var/cache # btrfs subvolume create /mnt/var/crash # btrfs subvolume create /mnt/var/lib/AccountsService # btrfs subvolume create /mnt/var/lib/gdm # btrfs subvolume create /mnt/var/lib/libvirt/images # btrfs subvolume create /mnt/var/lib/machines # btrfs subvolume create /mnt/var/lib/portables # btrfs subvolume create /mnt/var/log # btrfs subvolume create /mnt/var/spool # btrfs subvolume create /mnt/var/tmp # btrfs subvolume create /mnt/var/www # btrfs subvolume create /mnt/home/.snapshots List the subvolumes. It should look something like this. # btrfs subvolume list /mnt ID 256 gen 8 top level 5 path home ID 257 gen 8 top level 5 path opt ID 258 gen 8 top level 5 path .snapshots ID 259 gen 8 top level 5 path var/cache ID 260 gen 8 top level 5 path var/crash ID 261 gen 8 top level 5 path var/lib/AccountsService ID 262 gen 8 top level 5 path var/lib/gdm ID 263 gen 8 top level 5 path var/lib/libvirt/images ID 264 gen 8 top level 5 path var/lib/machines ID 265 gen 8 top level 5 path var/lib/portables ID 266 gen 8 top level 5 path var/log ID 267 gen 8 top level 5 path var/spool ID 268 gen 8 top level 5 path var/tmp ID 269 gen 8 top level 5 path var/www ID 270 gen 8 top level 256 path home/.snapshots I'll create the remaining subvolumes once I've set up a user account. You must modify the permissions of certain directories. # chmod -c 1777 /mnt/var/tmp # chmod -c 0700 /mnt/var/lib/{machines,portables} # chattr -VR +C /mnt/var/lib/libvirt/images 4. Bootstrap Fedora in a Chroot Environment Create a Fedora system in the /mnt directory using DNF installroot. I'm going to install the basesystem package first, which defines the basic elements of a Fedora system. # dnf -y --releasever=40 --installroot=/mnt install basesystem Bind mount the directories /sys, /dev, and /proc into /mnt. Copy from 'for' to 'done', paste it into the terminal, and hit [Enter]. # for dir in sys dev proc ; do mount -v --rbind "/${dir}" "/mnt/${dir}" mount -v --make-rslave "/mnt/${dir}" done Now that the directories have been bind mounted, install Fedora Minimal in the /mnt directory. Don't install a full desktop environment such as GNOME or KDE in the chroot environment. During the installation process, the desktop environments will run several scriptlets. The majority of these scriptlets cannot be run in a chroot environment, resulting in an unstable desktop environment. Once you have exited the chroot environment and booted into Fedora Minimal, you can install your preferred desktop environment. I've included the Fedora Minimal package group, Hardware Support package group, kernel, language packs, grub, and some other relevant packages. # dnf --releasever=40 --installroot=/mnt install \ @minimal-environment @hardware-support kernel linux-firmware langpacks-en \ glibc-all-langpacks glibc-langpack-en shim-x64 grub2-efi-x64 grub2-common \ grub2-efi-x64-modules grub2-tools grub2-tools-efi grub2-tools-extra grubby \ efibootmgr cracklib cracklib-dicts xdg-user-dirs polkit finger cryptsetup \ systemd-networkd NetworkManager NetworkManager-wifi systemd-container vim \ tpm2-tss tpm2-tools git make bash-completion gdisk inotify-tools -y Copy the resolv.conf file from the host to the /mnt/etc/ directory so you can connect to the internet after rebooting. But first, you must delete the existing symbolic link to the resolv.conf file. # rm -vf /mnt/etc/resolv.conf # cp -v /etc/resolv.conf /mnt/etc/ Set the timezone, locale, keymap, hostname, and '''
