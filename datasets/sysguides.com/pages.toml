["https://sysguides.com/create-and-manage-internal-snapshots-in-kvm"]
title = "How to Create and Manage Internal Snapshots in KVM"
description = "A virtual machine snapshot is a saved image of a virtual machine's state and data, captured and stored at a specific point in time. In this blog post, I will show you how to create and manage internal snapshots in KVM."
full_description = "How to Create and Manage Internal Snapshots in KVM February 10, 2024 · By Madhu Desai in Virtualization · 7 comments on How to Create and Manage Internal Snapshots in KVM A virtual machine snapshot is a saved image of a virtual machine's state and data, captured and stored at a specific point in time. By taking a snapshot of a virtual machine, you preserve its state, which means you can easily revert to it in the future if needed. The libvirt APIs support two types of snapshots with QEMU/KVM: internal and external. Internal snapshots store all of the snapshot data to the qcow2 virtual disk image of the same guest virtual machine. So, even if you take multiple snapshots of a virtual machine, they are all stored in the same qcow2 disk image file. You can easily create and manage internal snapshots in KVM. External snapshots, on the other hand, use the copy-on-write (COW) concept. When a snapshot is taken, the original disk image is made read-only, and a new overlay disk image is created. This new overlay disk image will be of type qcow2 and will be set as the virtual machine's default disk. In this blog, I will only discuss internal snapshots. Table of Contents 1. Create Snapshots 2. Revert to Snapshots 3. Snapshots Branching 4. Delete Snapshots 5. Backup VM with Snapshots 1. Create Snapshots You can take internal snapshots of a virtual machine when it is shut down or while it is running. However, only virtual machines with BIOS firmware are capable of taking both types of snapshots. At the time of writing, virtual machines with UEFI firmware could only take internal snapshots when shut down, not while running. So, to demonstrate both types of snapshots, I'll be using a Debian Linux distribution that I've created with BIOS firmware. First, let me check the virtual machines I have. $ virsh list --all --title Id Name State Title------------------------------------------------------------ - debian shut off Debian 12.4.0 Xfce BIOS - fedora shut off Fedora Workstation 39 Gnome UEFI - rocky shut off Rocky Linux 9.3 Server UEFI - ubuntu shut off Ubuntu 23.10 Gnome BIOS As you can see, I have four virtual machines created. I'm not using the sudo with virsh command to connect to a system-wide instance, because I've already granted the regular user system-wide permissions. If you also want to allow the regular user to connect to a system-wide instance, see the section 'Give the User System-Wide Permission' in my other article 'How Do I Properly Install KVM on Linux'. To find out which virtual machines already have snapshots, run the following command: $ virsh list --all --title --with-snapshot Id Name State Title------------------------------------------------------------ - fedora shut off Fedora Workstation 39 Gnome UEFI - rocky shut off Rocky Linux 9.3 Server UEFI - ubuntu shut off Ubuntu 23.10 Gnome BIOS And to find out which virtual machines do not have snapshots, use this: $ virsh list --all --title --without-snapshot Id Name State Title--------------------------------------------------- - debian shut off Debian 12.4.0 Xfce BIOS I just installed the Debian Linux operating system and updated all of its packages. So, I'd like to take a snapshot of the virtual machine's current state. That way, if something goes wrong, I can always revert back to this snapshot. So I will create a snapshot and give it the simple name 'pkg-updated'. The snapshot name should not include any spaces. $ virsh snapshot-create-as debian pkg-updatedDomain snapshot pkg-updated created A snapshot named 'pkg-updated' has been created. When creating a snapshot, you can include extra information like a description. But I will keep things simple. The full syntax for the snapshot-create-as command is as follows: $ virsh help snapshot-create-as NAME snapshot-create-as - Create a snapshot from a set of args SYNOPSIS snapshot-create-as <domain> [--name <string>] [--description <string>] [--print-xml] [--no-metadata] [--halt] [--disk-only] [--reuse-external] [--quiesce] [--atomic] [--live] [--validate] [--memspec <string>] [[--diskspec] <string>]... ... ... To view all snapshots available for the virtual machine, run this command: $ virsh snapshot-list debian Name Creation Time State---------------------------------------------------- pkg-updated 2024-01-26 11:50:54 +0530 shutoff As shown here, it displays the snapshot name, time of creation, and the state of the virtual machine when the snapshot was taken, which is shutoff in this case. To get more information about a specific snapshot, use this command: $ virsh snapshot-info debian pkg-updatedName: pkg-updatedDomain: debianCurrent: yesState: shutoffLocation: internalParent: -Children: 0Descendants: 0Metadata: yes Name: The name of the snapshot. Domain: The guest virtual machine for which the snapshot is created. Current: Is the 'pkg-updated' snapshot the current snapshot? If yes, then any new snapshot taken will be created as a child snapshot under this snapshot. State: The state of the virtual machine at the time the snapshot was taken, which in this case is 'shutoff'. Location: Where is the snapshot saved? In this case, it is internal, which means it is saved within the virtual disk image of the guest virtual machine. Parent: Under which snapshot is this 'pkg-updated' snapshot created? None, as this is the first snapshot created and thus has no parent. Children: The number of child snapshots that were taken directly under this 'pkg-updated' snapshot. In this case, 0 because no new child snapshots have been taken yet. Descendants: The total number of child snapshots from this snapshot down the tree hierarchy to the last leaf snapshots. 0 because no child snapshots have been taken yet. Metadata: Does this snapshot contain metadata? If yes, you'll be able to revert to this snapshot later; otherwise, you won't be able to. You might also be curious about how much space a snapshot takes. As the snapshot is internal, the data is stored on the virtual disk of the same guest virtual machine. So, first, locate the virtual disk image of the guest virtual machine. $ virsh domblklist debian --details Type Device Target Source---------------------------------------------------------------- file disk vda /var/lib/libvirt/images/debian.qcow2 file cdrom sda - Then, run the following command to get the size of the snapshots: $ sudo qemu-img info /var/lib/libvirt/images/debian.qcow2...Snapshot list:ID TAG VM SIZE DATE VM CLOCK ICOUNT1 pkg-updated 0 B 2024-01-26 11:50:54 00:00:00.000 0... As shown here, the size of the snapshot 'pkg-updated' is 0 bytes. The snapshot XML will be created in the directory with the same name as the virtual machine under /var/lib/libvirt/qemu/snapshot/ directory. $ sudo ls -lh /var/lib/libvirt/qemu/snapshot/debian/total 12K-rw-------. 1 root root 8.2K Jan 26 11:50 pkg-updated.xml You can view the content of the snapshot XML by using the following command: $ virsh snapshot-dumpxml debian pkg-updated Or you can edit the snapshot using this command: $ virsh snapshot-edit debian pkg-updated With the BIOS firmware, you can also take an internal live snapshot while the guest virtual machine is running. So, start the virtual machine. $ virsh start debian Domain 'debian' started To take a live snapshot of the guest virtual machine, you can use the following command. I will name this snapshot 'desktop-live'. $ virsh snapshot-create-as debian desktop-live --atomic The --atomic option ensures that the snapshot either succeeds or fails without any changes. If this flag is not specified, snapshot creation may fail after only a portion of the action has been performed. While I took the first snapshot through the command line interface, I will create this live snapshot using the virt-manager graphical application. Launch the Virtual Machine Manager (virt-manager) application and double-click the 'debian' virtual machine. Then, click the 'Manage VM snapshots' button in the toolbar. Next, click the '+' button in the bottom left corner of the window. Give the snapshot a name, then click the 'Finish' button. After a long wait, a live snapshot will be created. So, please be patient. Now, return to the terminal and list all snapshots for the guest virtual machine. $ virsh snapshot-list debian Name Creation Time State----------------------------------------------------- desktop-live 2024-01-26 12:22:16 +0530 running pkg-updated 2024-01-26 11:50:54 +0530 shutoff As you can see, a snapshot named 'desktop-live' has been created, with the state as 'running'. By default, the snapshots are sorted by name. If you want to list the snapshots topologically, so that no child appears before its ancestors, use the --topological option. $ virsh snapshot-list debian --topological Name Creation Time State----------------------------------------------------- pkg-updated 2024-01-26 11:50:54 +0530 shutoff desktop-live 2024-01-26 12:22:16 +0530 running You can also use the --tree option. $ virsh snapshot-list debian --treepkg-updated | +- desktop-live To check the snapshot sizes, first shut down the guest virtual machine. Other commands besides virsh cannot access the virtual disk image while the virtual machine is running. $ virsh shutdown debianDomain 'debian' is being shutdown Then, check the snapshot sizes. As can be seen below, the 'desktop-live' snapshot size is quite large. $ sudo qemu-img info /var/lib/libvirt/images/debian.qcow2...Snapshot list:ID TAG VM SIZE DATE VM CLOCK ICOUNT1 pkg-updated 0 B 2024-01-26 11:50:54 00:00:00.000 02 desktop-live 1.02 GiB 2024-01-26 12:22:16 00:19:17.986 ... 2. Revert to Snapshots You can revert to any snapshot, including the current one, at any time. Please be aware that this is a destructive action. This means that any changes you make to the guest virtual machine after the last (current) snapshot will be lost. For example, if you want to revert to the 'pkg-updated' snapshot, any changes you made to the guest virtual machine after the 'current' snapshot, in this case the 'desktop-live' snapshot will be lost. This is shown in the diagram below. The data you will lose is denoted by the red dotted line. To determine which snapshot is the current one, run the following command: $ virsh snapshot-current debian --namedesktop-live To revert to the 'pkg-updated' snapshot, run the following command. Any changes made after the 'desktop-live' snapshot will be lost. You will not get a warning. $ virsh snapshot-revert debian pkg-updated Domain snapshot pkg-updated reverted Because the 'pkg-updated' snapshot was taken in the shutdown state, when you revert to it, the guest virtual machine will be in the same state, i.e. shut off. $ virsh list --all Id Name State------------------------- - debian shut off - fedora shut off - rocky shut off - ubuntu shut off If you want to revert to a snapshot, but also have the guest virtual machine start, use this command instead. $ virsh snapshot-revert debian pkg-updated --running Domain snapshot pkg-updated reverted If you check the state now, you'll notice that the debian guest virtual machine is running. $ virsh list --all Id Name State------------------------- 2 debian running - fedora shut off - rocky shut off - ubuntu shut off The current snapshot has changed, and this is how things look now, as shown in a diagram. The 'pkg-updated' snapshot is now the current snapshot. $ virsh snapshot-current debian --namepkg-updated You can also use the virt-manager to revert to a snapshot graphically. For example, I will now revert back to the 'desktop-live' snapshot. Simply select the snapshot you want to revert to and press the 'Play' button. Here, however, you will receive a warning. To revert, simply press 'Yes'. Any changes you made after the 'pkg-updated' snapshot will be lost (the red dotted line). You have now reverted to the 'desktop-live' snapshot. Since this snapshot was taken live, the state will be 'running'. This is also the 'current' snapshot now. $ virsh snapshot-current debian --namedesktop-live$ virsh list --all Id Name State------------------------- 3 debian running - fedora shut off - rocky shut off - ubuntu shut off You're back to this: Snapshots are also useful when you want to test several scenarios and want to repeatedly revert to a virtual machine state. For example, with the 'desktop-live' snapshot as your 'current' snapshot, you can use this command to revert to the current snapshot after each test scenario. $ virsh snapshot-revert debian --currentDomain snapshot desktop-live reverted With each revert, all of your changes are undone and you can begin a new test scenario from the same baseline. 3. Snapshots Branching Not only can you create snapshots in a linear way, but you can also create branches. Snapshot branches are useful if you plan to test multiple scenarios using the same restoration point. You can save the state of each scenario as a separate snapshot. To create a snapshot branch, follow these steps: Pick a snapshot as the restore point. Create a test scenario 1. Take a snapshot. Revert to the restore point. Create a test scenario 2. Take a snapshot. To demonstrate this, assume you want to install a web server on Debian Linux. You'd like to test two popular web servers: 'Nginx Web Server' and 'Apache HTTP Server'. So first, pick your restore point. As the 'desktop-live' snapshot is also the 'current' snapshot, I will use it as the restore point. $ virsh snapshot-current debian --namedesktop-live I'll now install 'Nginx Web Server' on Debian Linux. Once installed, I'll shut down the guest virtual machine and take a snapshot. I will name this snapshot 'nginx'. $ virsh snapshot-create-as debian nginxDomain snapshot nginx created A snapshot named 'nginx' has been created. $ virsh snapshot-list debian --topological Name Creation Time State----------------------------------------------------- pkg-updated 2024-01-26 11:50:54 +0530 shutoff desktop-live 2024-01-26 12:22:16 +0530 running nginx 2024-01-27 18:52:48 +0530 shutoff$ virsh snapshot-list debian --treepkg-updated | +- desktop-live | +- nginx The diagram shows the current state of the snapshots. Now I will revert back to the 'desktop-live' snapshot. $ virsh snapshot-revert debian desktop-live Domain snapshot desktop-live reverted The 'desktop-live' snapshot is now the 'current' one. I'm going to install 'Apache HTTP Server' on Debian Linux. After installation, I will shut down the guest virtual machine and take a snapshot. I'll call this snapshot 'apache'. $ virsh snapshot-create-as debian apacheDomain snapshot apache created A snapshot named 'apache' has been created. $ virsh snapshot-list debian --topological Name Creation Time State----------------------------------------------------- pkg-updated 2024-01-26 11:50:54 +0530 shutoff desktop-live 2024-01-26 12:22:16 +0530 running apache 2024-01-27 18:58:57 +0530 shutoff nginx 2024-01-27 18:52:48 +0530 shutoff$ virsh snapshot-list debian --treepkg-updated | +- desktop-live | +- apache +- nginx The diagram depicts the snapshot branches. Now you ca"
