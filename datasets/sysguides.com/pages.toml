["https://sysguides.com/install-guest-os-in-virt-manager"]
title = "Create Virtual Machines in KVM Virt-Manager like a Pro: All Options Explained (2024)"
description = "The Virtual Machine Manager, or virt-manager, is a graphical application for creating and managing guest virtual machines. In this blog, I’ll show you how to create virtual machines in KVM virt-manager with all options explained."
full_description = '''Create Virtual Machines in KVM Virt-Manager like a Pro: All Options Explained February 13, 2024 · By Madhu Desai in Virtualization · 1 comment on Create Virtual Machines in KVM Virt-Manager like a Pro: All Options Explained The Virtual Machine Manager, or virt-manager, is a graphical application for creating and managing guest virtual machines. You can use the virt-manager application to create new virtual machines, install guest OS in virt-manager using a wizard or manually, configure virtual machine resource allocation, and manage virtual hardware. It also provides an overview of virtual machines that are currently running and their live performance. In this blog, I’ll show you how to create virtual machines in KVM virt-manager. If you want to install the guest virtual machine using the command-line interface, see my other article 'How to Install a KVM Guest OS from the Command-Line'. Before proceeding, ensure that the KVM hypervisor has been installed and that the host is ready for virtualization. If you haven't already installed the KVM hypervisor on your Linux distribution, visit my other blog "How Do I Properly Install KVM on Linux". The operating system I chose for the guest virtual machine for this blog is Rocky 9 Enterprise Linux. You may, however, choose any other operating system. So, let’s begin. Table of Contents 1. Create a Virtual Machine Using the Wizard Step 1 & 2: Choose How You Want to Install Step 3: Set Memory and CPU Step 4: Enable Storage Step 5: Set the Virtual Machine Name 2. Overview (Advanced Options) 3. CPUs 3.1. Enable the CPU Hot Plug/Unplug 3.2. Choose a CPU Model 3.3. Manually Set CPU Topology 4. Memory 5. Boot Options 6. Storage 6.1. Disk Bus 6.2. Advanced Options 6.3. Cache Mode 6.4. Discard Mode 7. Network 7.1. Network Source 7.2. Device Model 8. Guest Agent Channel 9. Video 10. TPM 11. Conclusion 12. Watch on YouTube 1. Create a Virtual Machine Using the Wizard Launch the Virtual Machine Manager application. Before you can begin creating a guest virtual machine, you must first enable XML editing. You will need to edit some XML components later. Go to Edit > Preferences and Enable XML editing. After that, click the computer icon in the upper left corner. This will launch a wizard that will guide you through the process of creating a new virtual machine in five easy steps. Step 1 & 2: Choose How You Want to Install The step 1 of the wizard is to select how you want to install the operating system. And step 2 of the wizard is to provide the installation source for the option you selected in step 1. If you are installing the operating system from an ISO image, choose the first option in Step 1 of the wizard. In step 2 of the wizard, select an ISO image. Before you select the ISO image, make sure it is the proper OS installer. $ osinfo-detect /dc/iso/Rocky-9.3-x86_64-dvd.isoMedia is bootable.Media is an installer for OS 'Rocky Linux 9 (x86_64)' In this case, it's the Rocky Linux 9 installer. If you want to install an operating system over a network, choose the second option in Step 1 of the wizard. In step 2, you must provide the URL for the installation tree. For example, to install Rocky Linux version 9.3 over the network, you must provide the URL for the installation tree, such as: https://download.rockylinux.org/pub/rocky/9.3/BaseOS/x86_64/os/ Choose the third option in step 1 if you've already downloaded the ready-to-use virtual disk image that most operating system distributors provide. For example, you may have already downloaded a ready-to-use virtual disk image with the Rocky Linux 9.3 operating system pre-installed. Before installing, you must first prepare the virtual disk image for use with KVM virtualization. Copy the downloaded qcow2 image to the '/var/lib/libvirt/images/' directory. Give any relevant name. $ sudo cp -v Rocky-9-GenericCloud-LVM.latest.x86_64.qcow2 \ /var/lib/libvirt/images/rocky-9.3.qcow2 If you use any Linux distribution based on Red Hat, you must set the appropriate SELinux file contexts. $ sudo restorecon -Fv /var/lib/libvirt/images/rocky-9.3.qcow2 Then, run the following command to set the root password and uninstall the cloud-init program. For the sake of simplicity, I'll set the root password to 'abcd1234'. But make sure you use a strong password. $ sudo virt-customize -a /var/lib/libvirt/images/rocky-9.3.qcow2 \ --root-password password:abcd1234 \ --uninstall cloud-init[ 0.0] Examining the guest ...[ 16.1] Setting a random seed[ 16.1] Setting the machine ID in /etc/machine-id[ 16.1] Uninstalling packages: cloud-init[ 21.0] Setting passwords[ 22.6] SELinux relabelling[ 33.6] Finishing off This virtual disk can now be used in step 2 of the wizard. Alternatively, if you have a qcow2, or raw virtual disk image, with an operating system that you have installed previously, you can also use that here. Finally, if you want to install the virtual machine manually, choose the fourth option in Step 1 of the wizard. I will, however, install the Rocky Linux version 9.3 operating system using the ISO image that I downloaded from the Rocky Linux website. Step 3: Set Memory and CPU In step 3 of the wizard, you must specify how much host memory and how many virtual CPUs the guest virtual machine will have. I'll set the memory to 4 GiB (4096 MiB) and the CPU to 1. You can, however, customize them to suit your needs. Keep in mind that the amount of memory and CPU count you enter here are both fixed. You may also want to enable the hot plug feature, which allows you to add memory or CPUs while the guest virtual machine is running. I will show you how to enable the hot plugging feature while explaining the advanced settings. For now, I'll press the Forward button to proceed to the next step. Step 4: Enable Storage Step 4 of the wizard is about allocating storage space for the guest virtual machine. I will set the disk image size to 40 GiB, but you can adjust it to suit your needs. The virtual storage disk created will be of type qcow2, and it will be saved in the default directory-based storage pool of the KVM hypervisor, which is /var/lib/libvirt/images/. If you want to create storage on other types of storage pools, select the option 'Select or create custom storage' instead. If you haven't already created a storage pool and are interested in doing so, check out my other blog 'How to Create and Manage Storage Pools and Volumes'. Instead of virtual disks, you can use this setup to install Rocky Linux on a physical partition or even an LVM logical volume. You can use the physical partition as your storage. Or, you can also use the logical volume for storage. Please keep in mind that you can only take internal snapshots of your virtual machine if you use the qcow2 storage type. If you install the operating system on a virtual machine that uses another type of storage, such as raw, physical partition, or LVM logical volume, you will be unable to take internal snapshots. I will, however, let the Virtual Machine Manager create a storage device for me. I've already set the storage size to 40 GiB and will keep it that way. Click the [Forward] button to continue. Step 5: Set the Virtual Machine Name This is the final configuration screen of the Virtual Machine Creation Wizard. Enter the name of the guest virtual machine. I'll give it the name 'rocky-9.3-server-gui'. Also, check the 'Customize configuration before install' option to continue configuring the advanced options. Finally, click the [Finish] button to complete the wizard. 2. Overview (Advanced Options) Here, you can further customize the settings and fine-tune your guest virtual machine. I will just highlight some of the most important features here. Evaluate these features and, if necessary, implement them; otherwise, discard them. The overview section allows you to configure basic information about the guest virtual machine. In addition to the name, which should be unique among all guests on the hypervisor, you can provide a title and description to help you identify the guest virtual machine in the Virtual Machine Manager. KVM supports two types of chipsets: i440FX and Q35. The older i440FX only supports PCI, whereas the new Q35 natively supports PCIe, allowing GPU pass through. So, make sure you have the Q35 chipset selected. This is also the default. Choose what kind of firmware you would like to have on your guest virtual machine. The two most significant are: BIOS: The BIOS option will be selected by default. When using this firmware, you will be able to take internal snapshots both offline and online, which is very useful when experimenting with something. The majority of modern computers, however, use UEFI, and BIOS is considered legacy. UEFI: Use this option if you want the virtual machine to boot with UEFI firmware, Secure Boot enabled, and Microsoft certificates pre-enrolled. At the time of writing, you can only take internal snapshots offline with this firmware, not online. To find out what other firmwares can do, open the terminal and navigate to /usr/share/qemu/firmware/, where you can find information about these firmwares. $ ls -1 /usr/share/qemu/firmware/30-edk2-ovmf-4m-qcow2-x64-sb-enrolled.json31-edk2-ovmf-2m-raw-x64-sb-enrolled.json40-edk2-ovmf-4m-qcow2-x64-sb.json41-edk2-ovmf-2m-raw-x64-sb.json50-edk2-ovmf-4m-qcow2-x64-nosb.json50-edk2-ovmf-x64-microvm.json51-edk2-ovmf-2m-raw-x64-nosb.json60-edk2-ovmf-x64-amdsev.json60-edk2-ovmf-x64-inteltdx.json For example, if you want to learn about the features of the UEFI firmware, you can look at its json file. $ cat /usr/share/qemu/firmware/30-edk2-ovmf-4m-qcow2-x64-sb-enrolled.json{ "description": "OVMF with SB+SMM, SB enabled, MS certs enrolled", "interface-types": [ "uefi" ], "mapping": { "device": "flash", "mode" : "split", "executable": { "filename": "/usr/share/edk2/ovmf/OVMF_CODE_4M.secboot.qcow2", "format": "qcow2" }, "nvram-template": { "filename": "/usr/share/edk2/ovmf/OVMF_VARS_4M.secboot.qcow2", "format": "qcow2" } },...... As you can see, using the UEFI firmware gives your guest virtual machine, Secure Boot with System Management Mode, with Secure Boot enabled, and Microsoft certificates pre-enrolled. I'll be using UEFI firmware for this tutorial. 3. CPUs In the CPUs section, a number of CPU-related settings can be set. 3.1. Enable the CPU Hot Plug/Unplug At step 3 of the wizard, you assigned the guest virtual machine 1 fixed virtual CPUs (vCPU). If you want, you can also enable the vCPU Hot Plug/Unplug feature. This allows you to change the number of vCPUs dynamically while the guest virtual machine is running. To enable the vCPU Hot Plug/Unplug feature, first set the 'vCPU allocation' slot to the maximum number of vCPUs that you want to hotplug into the running guest. I'm running an old 4th Generation Intel I5, which has only 4 CPUs. As a result, I'll limit the maximum number of vCPUs to 3. If you have a recent processor, you will have more CPUs and can set the maximum to even more. Next, in the XML tab, set the current number of vCPUs you want the guest to have every time it boots. I'll set the current number of virtual CPUs back to 1. Note: If XML editing is disabled, enable it in Virtual Machine Manager (Edit -> Preferences -> General). As shown in the image above, I've set the current vCPUs to 1 and the maximum vCPUs to 3. So, when I boot the guest virtual machine, I'll start with one vCPU, with two more available for hot plugging later. If your processor is newer and has more CPUs, you can, for example, set the current to 4 and the maximum to 8 vCPUs. To dynamically increase (or decrease) the number of vCPUs of a running virtual machine, for example, to 2, run the following command on the host machine. $ sudo virsh setvcpus rocky-9.3-server-gui 2 --live 3.2. Choose a CPU Model The KVM comes with a number of standard CPU models. If you need a specific CPU model for your virtual machine, you can choose from the CPU models list. To see all available models, uncheck the 'Copy host CPU configuration' checkbox or run the following command in the host terminal. $ sudo virsh domcapabilities --arch $(uname -m) | grep "model usable='yes'" Alternatively, you can change the CPU type by specifying the mode. To see what modes are available, run the following command in the host terminal. $ sudo virsh domcapabilities --arch $(uname -m) | grep 'mode name' Among all available modes/models, these are the two most important: host-passthrough When the mode is set to 'host-passthrough', the host CPU's model and features are exactly passed on to the guest virtual machine. This is the recommended and default option as well. The disadvantage is that live migration to different hosts with different hardware will be impossible. host-model You can also set the mode to 'host-model'. In this mode, a CPU model similar to the host CPU is first chosen from the CPU models list. Then, to get as close as possible to the host CPU, additional features are added. This will not exactly match the host CPU like 'host-passthrough', but it will provide many of the benefits of host-passthrough while also making live migration safe. To find out which CPU model and features will be assigned to the guest virtual machine if the mode is set to 'host-model', run the following command on your host. $ sudo virsh capabilities --xpath '//cpu' 3.3. Manually Set CPU Topology This option allows you to apply a specific CPU topology to the virtual CPUs in your guest virtual machine. If you want to simulate any number of sockets, Red Hat recommends using only a single core and a single thread and not over committing virtual CPUs for optimal performance. 4. Memory In the same step 3 of the wizard, you also set the amount of memory to a fixed 4 GiB. If you want, you can also enable the memory Hot Plug/Unplug feature in the same way you did for the CPU. For the memory hot plug/unplug feature, I will keep the current memory allocation of 4 GiB while increasing the maximum allocation to 8 GiB. As shown in the image above, I've set the current memory to 4 GiB and the maximum memory to 8 GiB. So, when I boot the guest virtual machine, it will start with 4 GiB of memory and will have an additional 4 GiB (up to 8 GiB) available for hot plugging later. To dynamically increase (or decrease) the memory of a running virtual machine, for example, to 6 GiB, run the following command on the host machine. $ sudo virsh setmem rocky-9.3-server-gui 6G --current If you want to share files between the host and guest virtual machines, enable the shared memory option. There are a few more steps you must complete before you can begin sharing files with the guest virtual machine. I've also written blogs about how to share files between the host and guest virtual machines: 'Share Files Between KVM Host and Linux Guest' and 'Share Files Between the KVM Host and Windows Guest'. Take a look at them both. 5. Boot Options This section allows you to customize the guest virtual machine's boot options. Check the 'Start vir'''
