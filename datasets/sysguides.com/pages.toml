["https://sysguides.com/kvm-guest-os-from-the-command-line"]
title = "How to Install a KVM Guest OS from the Command-Line"
description = "Many Linux servers will only have a command-line interface. So the way to install a KVM guest OS from the command-line on such systems is via a serial console."
full_description = '''How to Install a KVM Guest OS from the Command-Line March 24, 2024 · By Madhu Desai in Virtualization · 4 comments on How to Install a KVM Guest OS from the Command-Line In KVM, you can install a guest virtual machine using the graphical or command-line interface. If you are running a minimally configured Linux distribution as a KVM host, the only interface available to you will be a command-line interface. Even if your KVM host has a graphical user interface, you may prefer to install a guest virtual machine using only the command-line interface. So, the way to install a guest virtual machine from the command line is through a serial console using the virt-install tool. Interacting with a serial console is similar to using a text terminal without a graphical interface or a mouse. It provides an alternative way of accessing your host by replacing the default graphical consoles. Generally, the first serial port on the guest VM (/dev/ttyS0) is used for the serial console. Once you have finished installing the operating system on a guest virtual machine with a serial console, you can use SSH to connect to it. The serial console comes in handy if you are unable to ssh into your virtual machine due to connectivity issues, or if you need to provide a LUKS passphrase during boot if you have encrypted your virtual machine disks with LUKS encryption. In this blog, I'll show you how to use the virt-install tool to install a KVM guest virtual machine from the command line. While virt-install also supports graphical installations via SPICE or VNC, this article will only focus on text-mode installations via the serial console. I will use Debian 12 as an example of a guest virtual machine. If you prefer to install a guest virtual machine through a graphical interface with Virtual Machine Manager, see my other blog, 'Create Virtual Machines in KVM Virt-Manager like a Pro: All Options Explained'. If you haven't already installed KVM virtualization on your Linux distribution, please see my other blog, 'How Do I Properly Install KVM on Linux'. So, let’s begin. Table of Contents 1. Using the virt-install Command-Line Tool 2. Install KVM Guest OS from the Command-Line 3. Set the Terminal Type and Console Window Size 4. Check and Set the Baud Speed of the Serial Port 5. Hot Plug/Unplug Memory and CPU 6. Add a Graphical Display for the Guest 7. Conclusion 8. Watch on YouTube 1. Using the virt-install Command-Line Tool To create a virtual machine and begin the installation of its operating system, you must first provide some basic information. The command below, for example, will create a Debian 12 guest virtual machine named debian-12-default with 2 GiB of RAM, 1 virtual CPU, and a 20 GiB qcow2 virtual disk, with all options required. $ sudo virt-install \ --name debian-12-default \ --memory 2048 \ --vcpus 1 \ --cdrom /dc/iso/debian-12.5.0-amd64-DVD-1.iso Since you have not specified the type of console to use for the installation, the hypervisor default will be used, in this case, a graphical console (virt-viewer) using the SPICE client. If you attempt to run the same command on a Linux distribution with only a command-line interface (no desktop environment), you will get an error. It will throw an error message something like "No console to launch for the guest." You will be unable to continue with the installation. Moreover, the preceding example is very simple. To properly configure a guest virtual machine, much more detailed options are required. The command below will create a Debian 12 guest virtual machine named debian-12-minimal, but with a few extra options. This will also have 2 GiB of RAM, 1 virtual CPU, and a 20 GiB qcow2 virtual disk. This, on the other hand, will use a serial console. $ sudo virt-install \ --name debian-12-minimal \ --memory memory=6144,currentMemory=2048 \ --vcpus maxvcpus=3,vcpus=1 \ --cpu mode=host-passthrough \ --network network=default \ --location /dc/iso/debian-12.5.0-amd64-DVD-1.iso \ --os-variant debian12 \ --disk size=20,format=qcow2,cache=none,discard=unmap \ --tpm model='tpm-crb',type=emulator,version='2.0' \ --channel type=unix,target.type=virtio,target.name=org.qemu.guest_agent.0 \ --graphics none \ --extra-args 'console=tty0 console=ttyS0,115200n8 --- console=tty0 console=ttyS0,115200n8' \ --boot uefi While there are numerous other settings to tweak, I believe this will be sufficient to get you started with your virtual machine. For more information, see the manual page man virt-install. Before you press the [ENTER] key and begin the installation process, let me explain all of the options. --name debian-12-minimal Name of the guest virtual machine. It must be unique among all known guests of the hypervisor on the connection, including those not currently active. --memory memory=6144,currentMemory=2048 The amount of host memory (in MiB) that will be allocated to the guest. The element 'memory=6144' (6 GiB) specifies the maximum amount of memory that can be hot plugged into the running guest. However, 'currentMemory=2048' (2 GiB) specifies the guest's actual memory allocation at boot. If you just want a fixed memory of 2 GiB and no hot plugging, use '--memory 2048' instead. To find out how much total memory is available and how much is free on your host, use the following command. $ sudo virsh nodememstats --vcpus maxvcpus=3,vcpus=1 The number of virtual CPUs to assign to the guest virtual machine. The 'maxvcpus=3' element specifies the maximum number of virtual CPUs that can be hot plugged to the running guest. The 'vcpus=1' element, on the other hand, specifies the actual number of virtual CPUs assigned to the guest at boot. If you only want a fixed number of virtual CPUs, say one, use '--vcpus 1' instead. Run the following command to find out how many CPUs the host has. $ sudo virsh nodeinfo --cpu mode=host-passthrough Sets the CPU model for the guest. The mode attribute allows you to configure a guest CPU to be as close as possible to the host CPU. When the mode is set to 'mode=host-passthrough', the model and features of the host CPU are exactly passed on to the guest virtual machine. This is also the recommended option. The downside is that live migration to other hosts with different hardware is not possible. You can also set the mode to 'mode=host-model'. In this mode, a CPU model similar to the host CPU is first chosen from the "CPU models" list. Then, to get as close as possible to the host CPU, additional features are added. This will not exactly match the host CPU like 'host-passthrough', but it will provide many of the benefits of host-passthrough while also making live migration safe. To find out which CPU model and features will be assigned to the guest virtual machine if the mode is set to 'host-model', run the following command on your host. $ sudo virsh capabilities --xpath '//cpu' To see a list of all the "CPU models" you can use, run the following command on your host. $ sudo virsh domcapabilities --arch $(uname -m) | grep "model usable='yes'" --network network=default Connects the guest virtual machine to the host network. Here, you can choose how the virtual machine should connect to the host network. When Libvirt is connected to a system instance, there are three options for connecting the virtual machine to the host network. A virtual NAT network, a bridge network using a bridge device, or a virtual bridge network using MacVTap. 'default' Virtual NAT Network: When you install KVM virtualization, a virtual network named 'default' with NAT is automatically created. To see a list of available networks for you, run the following command. $ sudo virsh net-list Please keep in mind that virtual machines on the 'default' network will only have outbound network access. That is, virtual machines will have complete network access, but devices outside the host will be unable to communicate with virtual machines on the host. Only the host computer will have complete access to the virtual machines. The virtual machine, for example, can browse the internet, but cannot host a web server that is accessible to the outside world. Not even from your own mobile device on the same network. Only the host computer, and of course, other virtual machines connected to the same 'default' network, can access the web server. From a security standpoint, this network is the best option because you have exclusive access to the virtual machine. The 'network=default' element indicates that you want to connect to the virtual NAT network named 'default' that was created by default when you installed KVM virtualization. Bridge Device: If you want virtual machines to be directly visible on the same physical network as the host and accessible to external devices, you must use a network bridge. Before opting for this option, however, make sure you have already established a network bridge connection on your host. If you have not yet created a network bridge and would like to do so on your host computer, please see my other blog post, 'How to Properly Install KVM on Linux'. To configure the network bridge, simply replace the 'network=default' element with 'bridge=bridge0' element. Where bridge0 is the name of the bridge connection you've created. You will then have a network that is accessible to other physical machines on the same network as yours, as well as the outside world. Virtual machines that use this bridge device will receive IP addresses from the same pool as your host computer, which is typically the DHCP server on your modem. MacVTap Device: If you don't want to go through the hassle of manually creating a network bridge, but still want the virtual machine to be accessible from the outside world, including other devices on the same network as yours, you can use the MacVTap option. To configure the network to MacVTap, simply replace the 'network=default' element with 'type=direct,source=enp2s0' element. Where enp2s0 is the name of your network device. The virtual machine will then receive an IP address from the same pool as your host computer, which is typically the DHCP server on your modem. However, keep in mind that your host computer should not have any network bridges configured for this to work. Your virtual machine will then be accessible to the outside world, with one exception: your own host computer cannot access the virtual machine. For example, suppose you run a web server on your virtual machine and set up the network to use MacVTap device. The web page you hosted on your virtual machine will then be accessible to the outside world. The web page is also accessible to other devices on the same physical network as yours, such as your mobile phone. The only computer that does not have access to the virtual machine is your own host computer. You cannot ping the virtual machine from your host, nor can you ssh in. You should work directly from the serial console of the Virtual Machine. This is the difference between the MacVTap network and the network bridge. --location /dc/iso/debian-12.5.0-amd64-DVD-1.iso The location of the installer image. To find out if the ISO file is an operating system installation image, use the following command. $ osinfo-detect /dc/iso/debian-12.5.0-amd64-DVD-1.iso Media is bootable.Media is an installer for OS 'Debian 12 (x86_64)' --os-variant debian12 Indicate which operating system the guest virtual machine should be optimized for. To get a list of the accepted operating system variant names, run the following command. $ osinfo-query os --disk size=20,format=qcow2,cache=none,discard=unmap Specifies the media to be used as the guest virtual machine storage, with various options. size=20: Sets the disk size to 20 GiB. format=qcow2: Sets the disk format to qcow2. Other options may include 'raw', 'vdi', 'vmdk', and so on. Please keep in mind that internal snapshots are only available for the qcow2 type. cache=none: This indicates that the host cache must be bypassed. Reads and writes take place directly between the hypervisor and the storage device. This is also the recommended one. Other options include writeback, writethrough, unsafe, and directsync. discard=unmap: The type of discard mode you want to use for the qcow2 virtual disk. There are two modes available here: ignore and unmap. When you delete files in the guest, the changes are immediately reflected in the guest's file system. However, the qcow2 disk image file associated with the guest on the host does not shrink to reflect the newly freed space. When you set the discard mode to 'unmap', the qcow2 disk image will automatically shrink to reflect the newly freed space. --tpm model='tpm-crb',type=emulator,version='2.0' This enables the guest to have access to TPM functionality. KVM supports two models: TPM Interface Specification (TIS) and Command-Response Buffer (CRB). Both version 1.2 and version 2.0. The element model='tpm-crb' sets the TPM to the CRB. When type=emulator is used, each guest gets its own private emulated TPM. The element version='2.0' indicates that TPM version 2.0 is to be used. --channel type=unix,target.type=virtio,target.name=org.qemu.guest_agent.0 Creates a QEMU Guest Agent channel. The QEMU Guest Agent channel establishes a private communication channel between the host physical machine and the guest virtual machine, allowing you to send commands to the guest virtual machine's operating system. The guest operating system, then responds asynchronously to these commands. Please keep in mind that once you've added the QEMU Guest Agent channel, you'll also need to install the qemu-guest-agent package in the guest virtual machine. --graphics none The guest virtual machine will not be assigned a graphical console. As a result, the guest virtual machine must be explicitly configured with a text console on the guest virtual machine's first serial port. The option --extra-args is used to accomplish this. --extra-args 'console=tty0 console=ttyS0,115200n8 --- console=tty0 console=ttyS0,115200n8' I've specified two consoles here: a virtual console and a serial console. The console=tty0 denotes the first VGA console, while the console=ttyS0 denotes the first serial port. The output will be displayed on both of them. The first 'console=tty0 console=ttyS0,115200n8' element instructs virt-install to install the guest virtual machine using the VGA console or the serial console /dev/ttyS0 at 115200 bits per second speed, with no parity bit and 8 data bits. Following a triple dash (---), the same second element instructs the virt-install to permanently copy it into the bootloader of the installed guest virtual machine. As a result, on subsequent boots, the kernel boot messages are sent to both consoles of the guest virtual machine. This will come in handy if you decide to add a VGA console to the virtual machine later. The changes are made to the GRUB_CMDLINE_LINUX line in the guest virtual machine's /etc/default/grub file. --boot uefi Use UEFI firmware for the guest. When using UEFI firmware, in'''
