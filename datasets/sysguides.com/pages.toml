title = "How to Install Fedora 40 with Snapshot and Rollback Support"
description = "In this post, I will show you how to install Fedora with snapshot and rollback support. By installing snapper and grub-btrfs, you can take snapshots of the / and /home and perform a full system rollback on the / volume if something goes wrong."
full_description = '''How to Install Fedora 40 with Snapshot and Rollback Support October 30, 2024 · By Madhu Desai in Distro, Storage · 119 comments on How to Install Fedora 40 with Snapshot and Rollback Support An updated version of this guide for Fedora Linux 41 is now available. Check it out! Fedora Linux 40 has been released! In this guide, I will show you how to install Fedora with snapshot and rollback support. As a result, if you make a mistake while modifying the system configuration, installing packages, or updating, you won't have to worry about breaking the system. Simply restore the snapshot prior to the problematic change, and you'll be fine. So let's get started. Table of Contents 1. Partitions and Subvolumes Layout 2. Install Fedora Workstation 3. Create the Additional Subvolumes 4. Install and Configure Snapper 5. Install and Configure Grub-Btrfs 6. Create a System Root Snapshot and Set It as the Default 7. Snapper Tests Test 1: Undo the Changes Made by the DNF Installer Test 2: Undo Any Changes Made to Individual Files Test 3: Create Manual Pre-Post Snapshots and Undo the Changes Test 4: Rollback to a Previous Snapshot from the GRUB Menu 8. Make a Snapshot the New System Root 9. Enable Automatic Timeline Snapshots 10. Issues and Possible Solutions 11. Upgrade Fedora 39 to Fedora 40 12. Watch on YouTube 1. Partitions and Subvolumes Layout For this guide, I will use a hard disk with a capacity of 128 GiB. I'll create a 600 MiB EFI system partition and use the remaining disk space to create a partition for the Linux file system. Fedora also creates a SwapOnZRAM during boot, so no separate swap partition is required. This is how the disk partition looks: NAME SIZE FSTYPE PARTTYPENAME MOUNTPOINT/dev/vda 128G /dev/vda1 600M vfat EFI System /boot/efi/dev/vda2 127.4G btrfs Linux filesystem / On the Linux partition (/dev/vda2), I'll create a btrfs file system. Then, on the btrfs file system, I'll create the following subvolumes to keep them out of root file system snapshots. NAME MOUNTPOINT TYPE[main] / mainvolumehome /home subvolumeopt /opt subvolumecache /var/cache subvolumecrash /var/crash subvolumeAccountsService /var/lib/AccountsService subvolumegdm /var/lib/gdm subvolumeimages /var/lib/libvirt/images subvolumelog /var/log subvolumespool /var/spool subvolumetmp /var/tmp subvolumewww /var/www subvolume.mozilla /home/$USER/.mozilla subvolume.snapshots /.snapshots subvolume.snapshots /home/.snapshots subvolume The directories for which subvolumes are created and the reasons for doing so are listed below. For more information, visit this website. /home Contains user data. It will be created to keep user data separate while also preventing data loss during system root rollbacks. /opt Contains applications installed by a third party. It will be created to prevent these applications from being uninstalled during rollbacks. /var/cache, /var/crash, /var/tmp Directories contain temporary files and caches. They're created to be excluded from snapshots. Fedora mounts /tmp with tmpfs at boot, so a separate subvolume is unnecessary. /var/lib/AccountsService, /var/lib/gdm Contains login user and Gnome display information. These directories must be writable at all times. When you try to boot a snapshot from the GRUB menu, you are booting into a read-only snapshot, which causes the system to hang just before the Gnome login screen appears. In case you're using a desktop environment other than Gnome, it's necessary to replace the '/var/lib/gdm' with one that's specific to your desktop environment. For KDE, it is '/var/lib/sddm'. To find out about other desktop environments, refer to this page. /var/lib/libvirt/images The default location for libvirt-managed virtual machine images. It will be created so that virtual machine images are not replaced with older versions during a rollback. /var/log Contains log files. It will be created to prevent the loss of log data during rollbacks. /var/spool Contains data that is awaiting some kind of later processing, such as mail, mail queues, printing, printer spool, and so on. It will be created to prevent the loss of mail, printing, and spool data following a rollback. /var/www Web server directory. It will be created to keep hosted web server data separate and prevent data loss during system root rollbacks. /home/$USER/.mozilla By default, Fedora Workstation includes the Firefox web browser. If you take a snapshot of your home directory and later undo any changes, you don't want to lose any new bookmarks, passwords, and other user data. So, I'll create a subvolume for the '.mozilla' directory. This keeps it separate from the home subvolume and prevents data loss during undo operations. Depending on your usage, you may also want to consider creating subvolumes in your home directory for the following directories: Chrome Browser: /home/$USER/.config/google-chrome GnuPG: /home/$USER/.gnupg SSH: /home/$USER/.ssh Thunderbird Mail: /home/$USER/.thunderbird /.snapshots, /home/.snapshots Contains snapshots of the root (/) and home (/home) directories. 2. Install Fedora Workstation Boot your system using the Fedora Workstation 40 installer in UEFI mode. On the welcome screen, select the Install to Hard Drive option. Next, select your Language, Keyboard, and configure Time & Date. Following that, from the INSTALLATION SUMMARY screen, select Installation Destination. You should now be on the INSTALLATION DESTINATION screen. To proceed, pick the Advanced Custom (Blivet-GUI) radio button and then hit the Done button. On the BLIVET GUI PARTITIONING screen, create the partitions, file systems, and btrfs subvolumes necessary to install the Fedora Workstation 40. First, you need to create and mount the EFI partition. Select the free space and click the + sign to create a partition. Set the partition Size to 600 MiB, the Filesystem to EFI System Partition, and the Mountpoint to /boot/efi. Then, you need to create a btrfs volume where you can create all the subvolumes needed to install Fedora Workstation 40. Select the free space again and click on the + sign to create a Btrfs volume. Set the Filesystem to btrfs and the Mountpoint to /. I used the entire remaining space. However, you can specify the size you want for the btrfs volume. Next, you must create a home subvolume. (1) Select the Btrfs Volume from the left panel, and (2) click on the + sign on the right panel. Create a home subvolume. Enter the Name as home and Mountpoint as /home. Click OK to finish. I will create the remaining subvolumes when the installation is finished. This is because the Anaconda installer does not allow you to create subvolumes with slashes (/) in their names, such as var/log. For now, click Done to finish creating subvolumes. On the SUMMARY OF CHANGES screen, double-check that everything is properly defined. To finalize the changes, click the Accept Changes button. You will be returned to the INSTALLATION SUMMARY screen. Press the Begin Installation button to start the installation process. The installation process will start. Just sit back and relax. When the installation is finished, click the Finish Installation button and restart the system. The last phase of the installation process will start. Click the Start Setup button to complete the remaining customization steps, such as setting a new login, password, etc. You will then be logged into the Fedora Workstation 40 with the all-new Gnome 46 desktop interface. When booting your system, you may have noticed the following error message. error: ../../grub-core/commands/loadenv.c:216:sparse file not allowed. This is because you did not create a separate ext4 /boot partition and instead included it in the btrfs system root. GRUB preboot writes to /boot/grub2/grubenv if the boot was successful. This error occurs because of the GRUB btrfs.mod driver, unlike ext4, is read-only. To resolve this, open the Gnome terminal and execute the following command. $ sudo grub2-editenv - unset menu_auto_hide Set the btrfs volume label. I named the btrfs volume FEDORA, but you may name it whatever you want. $ sudo btrfs filesystem label / FEDORA $ sudo btrfs filesystem show / Label: 'FEDORA' uuid: 0fa2b51a-9876-4905-a36a-dbb2f40e7c12 Total devices 1 FS bytes used 6.60GiB devid 1 size 127.41GiB used 10.02GiB path /dev/vda2 Your setup should look something like this. $ lsblk -p /dev/vda NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINTS /dev/vda 252:0 0 128G 0 disk ├─/dev/vda1 252:1 0 600M 0 part /boot/efi └─/dev/vda2 252:2 0 127.4G 0 part /home / And the subvolumes will look like this. $ sudo btrfs subvolume list / ID 256 gen 51 top level 5 path home ID 257 gen 46 top level 5 path var/lib/machines In Fedora Workstation, systemd automatically creates the /var/lib/machines subvolume for systemd-nspawn containers. Enable the fastest mirrors to speed up package downloads. Copy the command from sudo to EOF, paste it into your terminal, and hit [Enter]. $ sudo bash -c 'cat >> /etc/dnf/dnf.conf' <<EOF defaultyes=True fastestmirror=True max_parallel_downloads=10 EOF Clear all previous caches and update the local DNF metadata cache. $ sudo dnf clean all $ sudo dnf makecache Install the packages listed below. $ sudo dnf install vim git inotify-tools make Now, update your operating system. $ sudo dnf update And reboot your system. $ sudo reboot 3. Create the Additional Subvolumes I'll now proceed with creating the remaining subvolumes on the system root. These subvolumes are created on the system root to avoid being included in the rollback process. Some of these directories store temporary files and caches. Some contain data that you do not want to lose if you roll back the system root. And some should be in read-write mode when booting into a read-only snapshot. Create the directory '/var/lib/libvirt'. Only applicable to other Fedora Spins; not required for Fedora Workstation. $ sudo mkdir -vp /var/lib/libvirt Get the UUID of your btrfs system root. $ ROOT_UUID="$(sudo grub2-probe --target=fs_uuid /)" $ echo ${ROOT_UUID} 0fa2b51a-9876-4905-a36a-dbb2f40e7c12 Get the btrfs subvolume mount options from the /etc/fstab file. $ OPTIONS="$(grep '/home' /etc/fstab \ | awk '{print $4}' \ | cut -d, -f2-)" $ echo ${OPTIONS} compress=zstd:1 Declare the remaining subvolumes you want to create in the 'SUBVOLUMES' bash array. Copy from 'SUBVOLUMES' to ')', paste into the terminal, and press [ENTER]. $ SUBVOLUMES=( "opt" "var/cache" "var/crash" "var/lib/AccountsService" "var/lib/gdm" "var/lib/libvirt/images" "var/log" "var/spool" "var/tmp" "var/www" "home/$USER/.mozilla" ) If you are installing Fedora for KDE Desktop, replace 'var/lib/gdm' with 'var/lib/sddm'. If you intend to install Google Chrome, you should also create a subvolume for it. Add the following to the SUBVOLMES array: "home/$USER/.config/google-chrome" If you intend to install the Mozilla Thunderbird email client, add the following to the SUBVOLMES array: "home/$USER/.thunderbird" If you use the GnuPG encryption and signing tool, you must create a subvolume to avoid losing your keys. "home/$USER/.gnupg" Similarly, if you use the SSH remote login client, you must create a subvolume to prevent losing your keys. "home/$USER/.ssh" For this tutorial, however, I will only create the '.mozilla' subvolume in the user's home directory. $ printf '%s\n' "${SUBVOLUMES[@]}" opt var/cache var/crash var/lib/AccountsService var/lib/gdm var/lib/libvirt/images var/log var/spool var/tmp var/www home/madhu/.mozilla Find the length of the longest element in the SUBVOLMES array. $ MAX_LEN="$(printf '/%s\n' "${SUBVOLUMES[@]}" | wc -L)" $ echo ${MAX_LEN} 24 Now, create subvolumes and also add them to the /etc/fstab file. Copy from 'for' to 'done', paste it in the terminal, and hit [ENTER]. $ for dir in "${SUBVOLUMES[@]}" ; do if [[ -d "/${dir}" ]] ; then sudo mv -v "/${dir}" "/${dir}-old" sudo btrfs subvolume create "/${dir}" sudo cp -ar "/${dir}-old/." "/${dir}/" else sudo btrfs subvolume create "/${dir}" fi sudo restorecon -RF "/${dir}" printf "%-41s %-${MAX_LEN}s %-5s %-s %-s\n" \ "UUID=${ROOT_UUID}" \ "/${dir}" \ "btrfs" \ "subvol=${dir},${OPTIONS}" \ "0 0" | \ sudo tee -a /etc/fstab done Once you've finished creating subvolumes based on your needs, change the ownership of the directories in the user's home to your user name. $ sudo chown -cR $USER:$USER /home/$USER/ If you have created subvolumes '.gnupg' and '.ssh', you must change their permissions. $ sudo chmod -vR 0700 /home/$USER/{.gnupg,.ssh} Examine your /etc/fstab file. This is what it should look like. The UUID and username will be unique to your system. $ cat /etc/fstab ... UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 / btrfs defaults 0 0 UUID=85A7-4DC2 /boot/efi vfat umask=0077,shortname=winnt 0 2 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /home btrfs subvol=home,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /opt btrfs subvol=opt,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/cache btrfs subvol=var/cache,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/crash btrfs subvol=var/crash,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/lib/AccountsService btrfs subvol=var/lib/AccountsService,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/lib/gdm btrfs subvol=var/lib/gdm,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/lib/libvirt/images btrfs subvol=var/lib/libvirt/images,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/log btrfs subvol=var/log,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/spool btrfs subvol=var/spool,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/tmp btrfs subvol=var/tmp,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /var/www btrfs subvol=var/www,compress=zstd:1 0 0 UUID=0fa2b51a-9876-4905-a36a-dbb2f40e7c12 /home/madhu/.mozilla btrfs subvol=home/madhu/.mozilla,compress=zstd:1 0 0 Reload /etc/fstab to mount all the subvolumes. $ sudo systemctl daemon-reload $ sudo mount -va / : ignored /boot/efi : already mounted /home : already mounted /opt : successfully mounted /var/cache : successfully mounted /var/crash : successfully mounted /var/lib/AccountsService : successfully mounted /var/lib/gdm : successfully mounted /var/lib/libvirt/images : successfully mounted /var/log : successfully mounted /var/spool : successfully mounted /var/tmp : successfully mounted /var/www : successfully mounted /home/madhu/.mozilla : successfully mounted Check your subvolumes. $ sudo btrfs subvolume list / ID 256 gen 95 top level 5 path home ID 257 gen 84 top level 5 path var/lib/machines ID 258 gen 88 top level 5 path opt ID 259 gen 94 top level 5 path var/cache ID 260 gen 89 top level 5 path var/crash ID 261 gen 89 top level 5 path var/lib/AccountsService ID 262 gen 90 top level 5 path var/lib/gdm ID 263 gen 91 top level 5 path var/lib/libvirt/images ID 264 gen 94 top level 5 path var/log ID 265 gen 92 top level 5 path var/spool ID 266 gen 92 top level 5 path var/'''
