["https://sysguides.com/fedora-uefi-secure-boot-with-custom-keys"]
title = "Enable Fedora UEFI Secure Boot with Custom Keys and Self-Signed Bootloader, Kernel, and Modules"
description = "Safeguard your pre-boot environment by enabling Fedora UEFI Secure Boot with custom keys and self-signing all of the bootloader, kernel, and module(s)"
full_description = '''Enable Fedora UEFI Secure Boot with Custom Keys and Self-Signed Bootloader, Kernel, and Modules October 16, 2024 · By Madhu Desai in Security, Distro · 29 comments on Enable Fedora UEFI Secure Boot with Custom Keys and Self-Signed Bootloader, Kernel, and Modules In this blog, I will show you how to secure the pre-boot environment by enabling Fedora UEFI Secure Boot with custom keys and self-signing all bootloader(s), kernel(s), and module(s) with your private key in order to boot the operating system safely. Secure Boot is based on the idea that UEFI firmware should only pass control to the operating system if it can cryptographically validate boot components against a pre-distributed set of public keys and hashes. When you turn on the computer, the firmware verifies each boot component's signature or computed SHA-256 hash. If the signatures or hashes of all of the boot components are valid, the computer will be allowed to complete its boot process, and the firmware will hand over control to the operating system. To keep this guide simple and secure, I installed a fresh copy of Fedora 38 Workstation under KVM virtualization with Secure Boot enabled. This virtual machine will be used to test all the steps I'll take, such as key creation and enrollment, signing various binaries, and so on. I strongly advise you to do the same before enrolling your custom keys on your real computer. Experiment with all of the commands on the virtual machine first, and then apply them to your actual computer if you're satisfied with the results. Important: If you use Fedora 38 as a KVM virtualization host (hypervisor), the default UEFI secure variable space for the guest virtual machine is much smaller. This will result in an error when attempting to update the UEFI revocation list file (dbx). As a result, you must use a larger 4M UEFI secure variable space. Fortunately, Fedora includes it as well. All you have to do is change the path in the configuration JSON file. On the Fedora 38 KVM virtualization host, run the following command as root: # sed -i 's/ovmf/ovmf-4m/g' \ /usr/share/qemu/firmware/30-edk2-ovmf-x64-sb-enrolled.json If you’ve already created other UEFI-enabled guest virtual machines, you’ll need to reset NVRAM for them to work properly. # virsh start <your-virtual-machine-name> --reset-nvram If you haven't already installed KVM virtualization on your computer, see my other blog post on how to properly install KVM on Your Linux distribution. I've also written guides on installing a guest operating system in KVM virtualization using the GUI tool virt-manager and the command-line tool virt-install. Take a look at all of them. So let's get started. Table of Contents 1. Overview of Secure Boot Keys 1.1 Platform Key (PK) 1.2 Key Exchange Key (KEK) 1.3 Signature Database (db) 1.4 Forbidden Signature Database (dbx) 2. Backup the Original Secure Boot Keys 3. Remove the Original Secure Boot Keys 4. Generate Your Own Secure Boot Keys 4.1 X509 Certificate for Platform Key 4.2 X509 Certificate for Key Exchange Key 4.3 X509 Certificate for Signature Database 5. Convert Certificates to AUTH Format 6. Enroll Your Keys in UEFI Secure Boot Chain 7. Sign Boot Binaries 8. Sign Kernel Modules 8.1 Check If the Kernel Module Is Already Signed 8.2 Example 1: Sign VirtualBox Kernel Modules 8.3 Example 2: Sign Nvidia Kernel Modules 8.4 Remove the Signature from the Kernel Module 9. Add Microsoft Keys to UEFI Secure Boot 9.1 Microsoft Key Exchange Key (KEK) 9.2 Microsoft Signature Database (db) 9.3 Microsoft Forbidden Signature Database (dbx) 9.4 Enroll Microsoft Keys and Hashes in the UEFI Secure Boot 10. Add OEM Key to UEFI Secure Boot (If Any) 11. Conclusion Watch on YouTube Before you can start configuring Secure Boot, you must first install a few packages. So, start the Fedora virtual machine and install the following packages: Fedora 41: $ sudo dnf install \ https://dl.fedoraproject.org/pub/fedora/linux/releases/40/Everything/x86_64/os/Packages/e/efitools-1.9.2-9.fc38.x86_64.rpm $ sudo dnf install keyutils mokutil openssl pesign sbsigntools kernel-devel-6.11.3-300.fc41.x86_64 Fedora 40: $ sudo dnf install efitools keyutils mokutil openssl pesign sbsigntools \ kernel-devel-$(uname -r) 1. Overview of Secure Boot Keys The UEFI specification provides four types of Secure Boot keys that can be included in your firmware. To list them all, use the following command: $ efi-readvar 1.1 Platform Key (PK) This is the top-level key used in Secure Boot. Platform Key (PK) creates a relationship of trust between the platform owner and the platform firmware. UEFI Secure Boot only supports a single PK in a system. If a PK already exists, you will be unable to add another unless the existing one is removed. The PK holder has the ability to replace an existing PK as well as update/replace the Key Exchange Key (KEK). The PK is usually owned by the OEM, which has complete control over the secure boot key chain. So, if you want total control over the Secure Boot process, you must replace the PK with your own. Find out who is currently in possession of the PK. $ efi-readvar -v PK Variable PK, length 976 PK: List 0, type X509 Signature 0, size 948, owner a0baa8a3-041d-48a8-bc87-c36d121b5e3d Subject: CN=Red Hat Secure Boot (PK/KEK key 1), emailAddress=secalert@redhat.com Issuer: CN=Red Hat Secure Boot (PK/KEK key 1), emailAddress=secalert@redhat.com As you can see, Red Hat owns the PK because KVM is a product of Red Hat Inc. If you check it on your actual computer, it is usually owned by the OEM. To view the public key in the PK, use the following command: $ mokutil --pk In this tutorial, you will replace Red Hat's PK with your own. 1.2 Key Exchange Key (KEK) In the Secure Boot key hierarchy, the KEK comes next. KEKs create a relationship of trust between the platform firmware and the operating system. KEKs are used to sign Signatures Database (db) and Forbidden Signatures Database (dbx). On most systems, there will be one or more KEKs. KEKs are used by vendors who need to update the db or dbx. Vendors include OEMs such as Acer, Dell, and others, as well as operating system providers such as Microsoft. Microsoft KEK comes pre-installed on almost all computers. Take a look at the KEKs that have been installed. $ efi-readvar -v KEK Variable KEK, length 2536 KEK: List 0, type X509 Signature 0, size 948, owner a0baa8a3-041d-48a8-bc87-c36d121b5e3d Subject: CN=Red Hat Secure Boot (PK/KEK key 1), emailAddress=secalert@redhat.com Issuer: CN=Red Hat Secure Boot (PK/KEK key 1), emailAddress=secalert@redhat.com KEK: List 1, type X509 Signature 0, size 1532, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Subject: C=US, ST=Washington, L=Redmond, O=Microsoft Corporation, CN=Microsoft Corporation KEK CA 2011 Issuer: C=US, ST=Washington, L=Redmond, O=Microsoft Corporation, CN=Microsoft Corporation Third Party Marketplace Root As you can see, you have two KEKs installed. One is provided by the hardware manufacturer, in this case, Red Hat, and the other by Microsoft Corporation. To view public keys in the KEK, run the following command: $ mokutil --kek In this tutorial, you'll delete both of these keys in KEK and replace them with your own. However, later in the tutorial, I will show you how to re-add OEM and Microsoft keys if you so desire. 1.3 Signature Database (db) The Signature Database (db) is essentially a whitelist of boot binaries. The db will contain public keys with a minimum key strength of RSA-2048 or SHA-256 hashes. Binaries with signatures that can be validated by a public key in the db will be allowed to execute at boot. Similarly, binaries without a signature, but with a computed SHA-256 hash that matches a trusted hash in the db will also be allowed to execute at boot. Examples of binaries include boot managers, boot loaders, kernels, and kernel modules. The majority of computers come pre-installed with two Microsoft keys in the db. The OEM of your computer may also have its own key installed. Take a look at the dbs that have been installed. $ efi-readvar -v db Variable db, length 3143 db: List 0, type X509 Signature 0, size 1515, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Subject: C=US, ST=Washington, L=Redmond, O=Microsoft Corporation, CN=Microsoft Windows Production PCA 2011 Issuer: C=US, ST=Washington, L=Redmond, O=Microsoft Corporation, CN=Microsoft Root Certificate Authority 2010 db: List 1, type X509 Signature 0, size 1572, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Subject: C=US, ST=Washington, L=Redmond, O=Microsoft Corporation, CN=Microsoft Corporation UEFI CA 2011 Issuer: C=US, ST=Washington, L=Redmond, O=Microsoft Corporation, CN=Microsoft Corporation Third Party Marketplace Root As you can see, you have two dbs installed. Both were pre-installed by Microsoft. The first db (List 0) is used to validate the Microsoft Windows operating system, while the second db (List 1) is used to validate Microsoft Corporation-approved third-party vendors. To view the public keys and hashes that have been added to the db, run the following command: $ mokutil --db You will delete both of these dbs and replace them with your own. This method has both advantages and disadvantages. The advantages include complete control over which binaries can be loaded. The kernel and most kernel modules will already be signed (in this case) with Fedora's built-in Fedora kernel signing key. Other than that, each binary must be signed with your own private key. As a result, your Secure Boot is completely secure. Nothing can sneak up on you unless you give it permission to. The disadvantage is that you must sign everything (though not many) that will be loaded during the booting process, which may be inconvenient if you are not technically savvy. Furthermore, the majority of vendors are Microsoft-certified, and if the software/hardware of such a vendor is involved in the boot process and you do not have their keys installed, the system will not boot. In order for it to boot again, you must sign each of them with your own private key. I suggest you start with your own keys and self-sign anything that prevents the secure boot process. If you dual boot with Microsoft Windows, you can even use your private key to sign the MS Windows bootloader. You will have no problem. And, if you think it's too much, you can always restore both Microsoft and OEM keys, as I'll show later in this article. 1.4 Forbidden Signature Database (dbx) The Forbidden Signature Database (dbx) is a kind of anti-db. It includes public keys with a minimum key strength of RSA-2048 or SHA-256 hashes that can be used to validate the undesired binary that you do not want the computer to execute when it boots. Take a look at the keys and hashes that have been added. $ efi-readvar -v dbx Variable dbx, length 17836 dbx: List 0, type SHA256 Signature 0, size 48, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Hash:80b4d96931bf0d02fd91a61e19d14f1da452e66db2408ca8604d411f92659f0a Signature 1, size 48, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Hash:f52f83a3fa9cfbd6920f722824dbe4034534d25b8507246b3b957dac6e1bce7a Signature 2, size 48, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Hash:c5d9d8a186e2c82d09afaa2a6f7f2e73870d3e64f72c4e08ef67796a840f0fbd Signature 3, size 48, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Hash:1aec84b84b6c65a51220a9be7181965230210d62d6d33c48999c6b295a2b0a06 Signature 4, size 48, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Hash:c3a99a460da464a057c3586d83cef5f4ae08b7103979ed8932742df0ed530c66 Signature 5, size 48, owner 77fa9abd-0359-4d32-bd60-28f4e78f784b Hash:58fb941aef95a25943b3fb5f2510a0df3fe44c58c95e0ab80487297568ab9771 .... .... The output shows that there are many SHA-256 hashes. By comparing the owner GUID to the one in the KEK (List 1), you can conclude that they belong to Microsoft. If a binary matches a key or hash in both the db and the dbx, the dbx takes precedence and the binary is not allowed to execute. To view the public keys and hashes in the dbx, run the following command: $ mokutil --dbx In this tutorial, I'll remove all of the keys and hashes from this dbx. You already have your own custom db list. If you don't want a binary to execute at boot, don't add it to the db list in the first place. This is not the case with vendors such as Microsoft or Red Hat, who will have already signed a large number of binaries with the same private key, only to discover later that some of them have been compromised or are out of date. As a result, such binaries are added to the dbx blacklist. To enable Secure Boot, you must have PK, KEK, and db. dbx is optional. Later in this tutorial, if you want to add the Microsoft list of prohibited hashes to dbx, I'll show you how to do so by using the most recent UEFI revocation list file. 2. Backup the Original Secure Boot Keys Before you can generate your own keys and add them to UEFI Secure Boot, make a backup of the original keys somewhere safe in case you need to use them later. I will create some directories to save various keys. You can create directories wherever you want and name them whatever you want. $ sudo -i # mkdir -vp /keys/{auth,bak,cfg,esl,ms,oem} Now, make a backup of the original keys. # efi-readvar > /keys/bak/all-efi-keys-original.txt # efi-readvar -v PK -o /keys/bak/PK-original.esl # efi-readvar -v KEK -o /keys/bak/KEK-original.esl # efi-readvar -v db -o /keys/bak/db-original.esl # efi-readvar -v dbx -o /keys/bak/dbx-original.esl List your backups. # ls -lh /keys/bak/ total 88K -rw-r--r--. 1 root root 56K Aug 6 19:14 all-efi-keys-original.txt -rw-------. 1 root root 3.1K Aug 6 19:15 db-original.esl -rw-------. 1 root root 18K Aug 6 19:15 dbx-original.esl -rw-------. 1 root root 2.5K Aug 6 19:14 KEK-original.esl -rw-------. 1 root root 976 Aug 6 19:14 PK-original.esl 3. Remove the Original Secure Boot Keys Now that you've saved the original UEFI Secure Boot keys that came with the computer, you can safely remove them. Boot into the firmware of your computer. # systemctl reboot --firmware-setup Because different firmwares have different methods for removing keys, I will only show how to remove them in the firmware of the KVM virtual machine. On the firmware main screen, select the 'Device Manager' option. Choose the 'Secure Boot Configuration' option. Scroll down to 'Reset Secure Boot Keys' and press [Enter]. Select [Yes] and then press the [Enter] key. All of your UEFI Secure Boot keys have been removed. Press the [Esc] button twice and then press 'Reset' to reboot the system and return to the operating system. After rebooting, confirm that all entries in the Secure Boot chain have been removed. $ efi-readvar Variable PK has no entries Variable KEK has no entries Variable db has no entries Variable dbx has no entries Variable MokList has no entries The output shows that all entries in the Secure Boot chain have been removed. Now, check the status of Secure Boot. $ sudo bootctl status 2>&1 | grep 'Secure Boot' Secure Boot: disabled (setup) As you can see, Secure'''
year_published = 2022
year_updated = 2024
