["https://sysguides.com/fedora-luks-fde-snapper-rollback"]
title = "Install Fedora with LUKS Full Disk Encryption and Snapper with Full System Rollback"
description = "In this post, I'll show you how to encrypt your PC with LUKS Full Disk Encryption and configure snapper so that you can roll back to any snapshot with ease."
full_description = '''Install Fedora with LUKS Full Disk Encryption and Snapper with Full System Rollback October 16, 2023 · By Madhu Desai in Distro, Security, Storage · In this post, I'll show you how to install Fedora with LUKS full disk encryption and snapper with full system rollback capability. For disk encryption, I'll use LUKS version 1. In my earlier post titled "Install Fedora 35 with LUKS Full Disk Encryption (FDE)", I showed how to install Fedora 35 with full disc encryption using LUKS version 2. However, because the /boot partition was on its own partition in that setup, you couldn't use the snapper to rollback the entire system, including the kernel. Since support for LUKS2 in GRUB 2.0.6 is limited (Argon2 is not yet supported, only the PBKDF2 is supported), it is recommended to use LUKS1 to encrypt the disk if the /boot directory is in the 'root file system' and not on a separate partition. Hopefully, in the next release of GRUB, support for /boot partition encryption using LUKS2 with Argon2i and Argon2id will be added. Here's a quick overview of what you can expect. Install Fedora 35 Workstation with a LUKS1 encrypted BtrFS 'root filesystem' and a separate Ext4 /boot partition, as the Anaconda installer does not support encryption of the /boot partition. Copy the contents of the /boot partition to the 'root filesystem,' and configure GRUB to boot from it. Remove the /boot partition and merge the space it used into the main BtrFS file system. Configure the system to request the passphrase only once by providing the key file. Install and configure snapper to take snapshots of the root subvolume. Finally, test the full system rollback by upgrading to the most recent kernel and reverting back to the prior state. And here's how the final layout of the disk looks. ESP PARTITIONBTRFS VOLUME/boot/efi//home/var/log/var/lib/libvirt/imagesroothomelogimages/dev/mapper/luks-XXXX/dev/vda1/dev/vda2UEFI SECURE BOOTLUKS1 ENCRYPTED So let's begin. Table of Contents 1. Install Fedora 35 Workstation with LUKS1 encryption 2. Move the /boot to the 'root filesystem' 3. Configure Fedora for rollback 4. Delete the /dev/vda3 partition and reclaim the space 5. Bypass the additional passphrase prompt 6. Install and configure snapper for the ‘root file system’ 7. Test snapper rollback feature 8. Conclusion Watch on YouTube 1. Install Fedora 35 Workstation with LUKS1 encryption Boot your computer using the Fedora 35 Workstation installer in UEFI mode. On the welcome screen, select the Install to Hard Drive option. Next, select your Language, Keyboard, and configure Time & Date. Following that, from the INSTALLATION SUMMARY screen, select Installation Destination. You should now be on the INSTALLATION DESTINATION screen. To proceed, pick the Advanced Custom (Blivet-GUI) radio button and then hit the Done button. You will see the BLIVET GUI PARTITIONING screen. Here you will create partitions, file systems, and BtrFS subvolumes necessary to install Fedora 35 Workstation. First, you need to create and mount the EFI partition. Select the free space and click the + sign to create a partition. Set the partition Size to 512 MiB, the Filesystem to EFI System Partition, and the Mountpoint to /boot/efi. Then, you need to create a btrfs volume where you can create all the subvolumes needed to install Fedora Linux. Select the free space again and click on the + sign to create a Btrfs volume. (1) Set the Device Type to Btrfs Volume. (2) Set the Size of the Btrfs volume. At the end, leave at least 1 GiB for the boot partition. I've left around 1.5 GiB unallocated. (3) Set the name for Btrfs volume. I named the Btrfs volume FEDORA, but you can name it whatever you like. (4) Set the Encryption type to luks1 and (5) provide a strong password (password entropy > 60 bits is suggested). Do not set any Mountpoint here. Leave it blank and click on the OK button. You then need to create and mount the /boot partition. Set the boot partition to use all of the remaining unallocated space (1534 MiB), the Filesystem to ext4, and the Mountpoint to /boot. After the installation is finished, I'll copy the contents of the /boot partition to the main root subvolume and merge this 1.5 GiB space with the main BtrFS volume. Your partitions should look something like this. Next, you must create subvolumes. (1) Select the Btrfs Volume from the left panel, and (2) click on the + sign on the right panel. I’ll create four subvolumes: root, home, log, and images. I’m creating a separate images subvolume because I don’t want the KVM disk images to be included when I take a snapshot of the ‘root file system’. BtrFS subvolumes are created in LIFO order in the Anaconda installer. As a result, I'll define subvolumes in reverse order. Create images subvolume. Enter the Name as images and Mountpoint as /var/lib/libvirt/images. Click OK to finish. Create log subvolume. Enter the Name as log and Mountpoint as /var/log. Click OK to finish. Click again on the + symbol to create the home subvolume. Enter the Name as home and Mountpoint as /home. Click OK to finish. Repeat the same process for the root subvolume as well. Enter the Name as root and Mountpoint as /. Click OK to finish. When completed, the subvolumes must look something like this. Click Done to create subvolumes. As with the swap partition, Fedora generates a SwapOnZRAM upon startup, so no separate swap partition is needed. Verify that the partitions and subvolumes are properly defined on the SUMMARY OF CHANGES screen. To finalize the changes, click the Accept Changes button. You will be returned to the INSTALLATION SUMMARY screen. Press the Begin Installation button to start the installation process. The installation process will start. Just sit back and relax. When the installation is finished, click the Finish installation button and restart the computer. After the computer restarts, you will be prompted for the LUKS passphrase. Enter the LUKS1 passphrase that you provided. The last phase of the installation procedure will start. Click the Start Setup button to complete the remaining customization steps, such as setting a new login, password, and so on. You will then be logged into the all-new Gnome 41 desktop interface. Open the Gnome terminal and check your current setup. [madhu@fedora ~]$ sudo btrfs subvolume list / ID 256 gen 86 top level 5 path root ID 257 gen 86 top level 5 path home ID 258 gen 88 top level 5 path log ID 259 gen 38 top level 5 path images ID 264 gen 83 top level 256 path var/lib/machines [madhu@fedora ~]$ sudo btrfs filesystem show / Label: 'FEDORA' uuid: bd69e80f-fd90-4b70-b13c-47ce9d253605 Total devices 1 FS bytes used 2.99GiB devid 1 size 78.00GiB used 6.02GiB path /dev/mapper/luks-62740414-8b79-4f91-b36f-1c3dd3511adf [madhu@fedora ~]$ lsblk -p NAME MAJ:MIN RM SIZE RO TYPE MOUNTPOINTS /dev/zram0 251:0 0 3.8G 0 disk [SWAP] /dev/vda 252:0 0 80G 0 disk ├─/dev/vda1 252:1 0 512M 0 part /boot/efi ├─/dev/vda2 252:2 0 78G 0 part │ └─/dev/mapper/luks-62740414-8b79-4f91-b36f-1c3dd3511adf 253:0 0 78G 0 crypt /var/log │ /var/lib/libvirt/images │ /home │ / └─/dev/vda3 252:3 0 1.5G 0 part /boot Review the device LUKS1 encryption details. [madhu@fedora ~]$ sudo cryptsetup luksDump /dev/vda2 LUKS header information for /dev/vda2 Version: 1 Cipher name: aes Cipher mode: xts-plain64 Hash spec: sha256 Payload offset: 4096 MK bits: 512 MK digest: 04 6f 33 e1 0f 9f c8 91 b4 a3 ab 51 a2 4b 89 4c 3e d8 ca 11 MK salt: 99 c5 5a 0b 8d a1 21 50 a5 50 91 e3 4f 90 40 e7 85 66 56 a2 47 64 e5 4b 37 e7 25 98 02 36 f0 45 MK iterations: 104690 UUID: 62740414-8b79-4f91-b36f-1c3dd3511adf Key Slot 0: ENABLED Iterations: 1716162 Salt: f6 45 22 3c ab 77 7d 34 20 66 8c a3 39 aa 22 94 14 ee ac d1 3b 8f b5 3e 88 5c 03 79 99 0b 52 3f Key material offset: 8 AF stripes: 4000 Key Slot 1: DISABLED Key Slot 2: DISABLED Key Slot 3: DISABLED Key Slot 4: DISABLED Key Slot 5: DISABLED Key Slot 6: DISABLED Key Slot 7: DISABLED When you use QCOW2 images as virtual disks in KVM, the IO performance suffers. This is because both the Btrfs filesystem and the QCOW2 images employ Copy-on-Write (CoW). When there is a lot of IO activity on the guest, the KVM guest may even freeze. So you need to disable the CoW feature in the /var/lib/libvirt/images directory. [madhu@fedora ~]$ sudo chattr -R +C /var/lib/libvirt/images/ [madhu@fedora ~]$ sudo lsattr -d /var/lib/libvirt/images/ ---------------C------ /var/lib/libvirt/images/ 2. Move the /boot to the 'root filesystem' Now that the installation is complete, transfer the contents of the /boot partition to the 'root filesystem,' and configure GRUB to boot from it. Log in as root and unmount the EFI partition. [madhu@fedora ~]$ sudo -i [root@fedora ~]# umount -v /dev/vda1 umount: /boot/efi (/dev/vda1) unmounted Unmount the boot partition from the /boot directory as well, then mount it into the /mnt directory temporarily. [root@fedora ~]# umount -v /dev/vda3 umount: /boot (/dev/vda3) unmounted [root@fedora ~]# mount -v /dev/vda3 /mnt mount: /dev/vda3 mounted on /mnt. Copy all files from /mnt to the /boot directory. [root@fedora ~]# cp -arv /mnt/. /boot Mount the EFI partition (/dev/vda1) back to /boot/efi. [root@fedora ~]# mount -v /dev/vda1 /boot/efi mount: /dev/vda1 mounted on /boot/efi. Restore the SELinux labels. [root@fedora ~]# restorecon -RFv /boot Unmount the /dev/vda3 partition from /mnt and delete its entry from the /etc/fstab file. You no longer need the /dev/vda3 partition. [root@fedora ~]# umount -v /mnt umount: /mnt unmounted [root@fedora ~]# sed -i.original '/\/boot.*ext4/d' /etc/fstab [root@fedora ~]# mount -a Finally, enable the CRYPTODISK option in GRUB. When enabled, it will check the encrypted disks and generate the additional commands needed to access them during boot. [root@fedora ~]# echo "GRUB_ENABLE_CRYPTODISK=y" >> /etc/default/grub 3. Configure Fedora for rollback Because we're also prepping Fedora for full system rollback, we need to make a few other modifications before we can regenerate the grub.cfg file. Allow snapshot booting by appending the SUSE_BTRFS_SNAPSHOT_BOOTING option to the /etc/default/grub file. [root@fedora ~]# echo "SUSE_BTRFS_SNAPSHOT_BOOTING=true" >> /etc/default/grub In Fedora, the default subvolume is set to top-level (FS_TREE). You must explicitly set the root subvolume to be configured as default. This will be the default if you do not boot from another snapshot. [root@fedora ~]# btrfs subvolume get-default / ID 5 (FS_TREE) [root@fedora ~]# btrfs subvolume list / ID 256 gen 117 top level 5 path root ID 257 gen 88 top level 5 path home ID 258 gen 118 top level 5 path log ID 259 gen 89 top level 5 path images ID 264 gen 83 top level 256 path var/lib/machines [root@fedora ~]# btrfs subvolume set-default 256 / [root@fedora ~]# btrfs subvolume get-default / ID 256 gen 119 top level 5 path root The kernel and initrd paths are configured to look in the parent directory of the previous /boot partition (/dev/vda3). This must be changed to the /boot directory in the 'root file system' (/dev/sda2). Also, now that we've enabled snapshot booting, we should delete the rootflags=subvol=root from the args line. [root@fedora ~]# grubby --info=DEFAULT index=0 kernel="/vmlinuz-5.14.10-300.fc35.x86_64" args="ro rootflags=subvol=root rd.luks.uuid=luks-62740414-8b79-4f91-b36f-1c3dd3511adf rhgb quiet" root="UUID=bd69e80f-fd90-4b70-b13c-47ce9d253605" initrd="/initramfs-5.14.10-300.fc35.x86_64.img" title="Fedora Linux (5.14.10-300.fc35.x86_64) 35 (Workstation Edition)" id="ae883586b86845dcb60a087f9dc8b808-5.14.10-300.fc35.x86_64" To do this, first, remove the old Boot Loader Specification (BLS) configuration files. [root@fedora ~]# rm /boot/loader/entries/*.conf Then recreate the BLS config file by adding the kernel image. [root@fedora ~]# kernel-install -v add $(uname -r) \ /lib/modules/$(uname -r)/vmlinuz Now, regenerate the grub.cfg file. [root@fedora ~]# grub2-mkconfig -o /boot/grub2/grub.cfg Examine the newly created BLS configuration files. The '/boot' directory should be added to the kernel and initrd lines, and the args line should have 'rootflags=subvol=root' deleted. [root@fedora ~]# grubby --info=DEFAULT index=0 kernel="/boot/vmlinuz-5.14.10-300.fc35.x86_64" args="ro rd.luks.uuid=luks-62740414-8b79-4f91-b36f-1c3dd3511adf rhgb quiet ${extra_cmdline}" root="UUID=bd69e80f-fd90-4b70-b13c-47ce9d253605" initrd="/boot/initramfs-5.14.10-300.fc35.x86_64.img" title="Fedora Linux (5.14.10-300.fc35.x86_64) 35 (Workstation Edition)" id="ae883586b86845dcb60a087f9dc8b808-5.14.10-300.fc35.x86_64" Because encrypted GRUB and snapshot booting are now enabled, you must make changes to the /boot/efi/EFI/fedora/grub.cfg file as well. From this: search --no-floppy --fs-uuid --set=dev edefa42a-440b-44fc-9851-d7c3813f6201 set prefix=($dev)/grub2 export $prefix configfile $prefix/grub.cfg To this: set btrfs_relative_path="yes" cryptomount -u 627404148b794f91b36f1c3dd3511adf search --no-floppy --fs-uuid --set=dev bd69e80f-fd90-4b70-b13c-47ce9d253605 set prefix=($dev)/boot/grub2 export $prefix configfile $prefix/grub.cfg Changes are in orange color. Sets the path relative to the subvolume from which you are booting. Setup access to encrypted boot device. The UUID here is of the /dev/vda2 partition without dashes. Replace UUID with the value that corresponds to your configuration. Change the UUID to the mapped LUKS1 device. Replace UUID with the value that corresponds to your configuration. Insert the '/boot' directory into the 'set prefix' line. [root@fedora ~]# lsblk -po name,uuid NAME UUID /dev/zram0 /dev/vda ├─/dev/vda1 44C8-163B ├─/dev/vda2 62740414-8b79-4f91-b36f-1c3dd3511adf │ └─/dev/mapper/luks-62740414-8b79-4f91-b36f-1c3dd3511adf bd69e80f-fd90-4b70-b13c-47ce9d253605 └─/dev/vda3 edefa42a-440b-44fc-9851-d7c3813f6201 Finally, disable the GRUB menu auto-hide feature. When Fedora is the only operating system installed on the system, Fedora implements a feature called ‘Hidden Grub Menu‘. The goal is to keep the interface as simple as possible, providing information only when it is necessary. However, you need to visually see the GRUB menu to verify whether the rollback is executed correctly. This feature can be disabled by doing the following. [root@fedora ~]# grub2-editenv - list saved_entry=ae883586b86845dcb60a087f9dc8b808-5.14.10-300.fc35.x86_64 menu_auto_hide=1 boot_success=1 boot_indeterminate=0 [root@fedora ~]# grub2-editenv - unset menu_auto_hide And reboot. [root@fedora ~]# reboot Reboot the computer and verify if it worked. You will be prompted for the password twice. The first time is before loading GRUB, and the second time is before mounting the / file system. Depending on your computer’s CPU, the GRUB may take up to 30 seconds to display the menu after you enter the first passphrase. So please be patient. 4. Delete the /dev/vda3 partition and reclaim the space We no longer need the /dev/vda3 partition since we moved the /boot files from /dev/vda3 partition to the /boot directory in the root subvolume '''
