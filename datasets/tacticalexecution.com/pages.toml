["https://tacticalexecution.com/tag/introduction"]
title = "introduction | Tactical Execution"
full_description = "Published by Patrick on 29 Mar 2008 Website Starting to Look Presentable Wow. What a huge effort! This post – yes, the one you’re reading – was the original “hello world” post included with the basic WordPress installation and you see (by the date listed above) that I did that on March 29th. That was exactly one week ago. Since then, I have put up a total of 211 pages of content on this website. Admittedly, a number of them still need to be built out but the basic structure is there and I hope you browse around and take a look around. You see, I originally built my Tactical Execution website back in August 2007. I used Joomla to build it. It was the first time I had ever used an open source platform. At the time, I thought it was awesome! What a resource. Completely free. I was amazed. And so I went about building my website and adding all the individual content items I wanted to be available. Eventually, my website accumulated a ton of content but Joomla had some annoying problems that made the site clumsy and very SEO unfriendly. Simple things, like the URLs being formated as /content/view/54/116 instead of /resources/useful-links/marketing-links. Frustrating. Such a simple thing but I had no way of changing it. Well, maybe there IS a way, but I never learned how to do it. I have also come to realize that the blog structure is much more powerful in today’s social internet and WordPress was the competing open source platform to Joomla and Drupal. So here I am. I installed the platform last Saturday and began copying all my content to the new website. There is still a ton of work to do but I’m happy with my progress so far. I probably won’t blog again for about a week. I have a long list of other to-do items I need to get through before a settle back into a blogging routine. But rest assured, that time will come. Writing is one of the things I like most. Content generation. That’s what I like. So in time, this blog will grow in size and I hope you subscribe to the feed. Let me just lay out the basic structure. If the content is fairly independent (in other words, it doesn’t relate to other content I found on the internet), I will post it as a static page in the appropriate section of the site. If the content relates to other internet resources, I will blog about it and participate in the ongoing discussion that defines today’s blogosphere. Of course, if we can do anything for you in a business sense, send me a note on the Contact tab. I spend all too much time in front of my computer so I’ll probably reply in short order. Otherwise, check out the Store to see if any of those resources can help you move your business forward. Thanks for reading. Until next time … Patrick. Website"
