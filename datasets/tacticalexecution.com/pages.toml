title = "The world is a reflection of yourself. Be happy. Be postitive. | Tactical Execution"
description = "PLEASE NOTE: I have not used this website since 2010. Please visit my new website for current information. Thank you! I have a neighbor who always thinks people are cheating him or being unfair to …"
full_description = "Published by Patrick on 13 Jun 2008 at 06:22 pm The World is a Reflection of Yourself PLEASE NOTE: I have not used this website since 2010. Please visit my new website for current information. Thank you! I have a neighbor who always thinks people are cheating him or being unfair to him; that he is somehow a victim. Is it true? Let’s take a closer look. First, is it true that most of the neighbors dislike him? Yes, that’s true. But why? The answer is simple. People don’t like him because he’s unreasonable and chooses to live his life differently than everybody else. He also has a conniving way about him and is always sticking his nose where it doesn’t belong. Bottom line; he sees himself as the victim of the exact same behavior he exhibits himself. He is unkind and unfair to others and the world responds by showering him with the same sentiments. The world is a direct reflection of his own character. When I still lived up in Vancouver Canada, I lived on 12th Avenue and Oak Street, relatively close to downtown. I would take the bus to work each morning and got to know the bus driver for the 7:45 pick-up. He was a super nice guy. He was always happy and cheerful, and on the rare occassions when I didn’t have the exact change for the bus fair, he always let me on and I paid the difference on the following day. One day, I got on the bus as usual and stood near the front. Because I lived near downtown, the bus was always full by the time it reached my stop so I almost always had to stand near the front. Anyway, two stops after mine, a guy got on the bus and was immediately rude to the bus driver. He was mean. And the bus driver was mean back. There was no big scene. It was a simple exchange. But it struck me that this bus driver who had always been so kind to me could just as easily be mean to someone else. I remember that day well because it taught me an important lesson. The world is a reflection of yourself. If you are a kind person, you probably live in a world full of kind people. If you are a mean person, you probably live in a horrible world full of mean cruel people. If you try to cheat the system, you probably think the system is cheating you. And if you always play by the rules, you probably see justice in them. I was listening to a radio program once that was all about relationships and why some of them always fail. The “expert” who was being interviewed said that most people who are paranoid about their partners cheating are actually cheating themselves, or at least yearning to. Their minds are full of their own thoughts and it’s only natural to project those same thoughts onto others. After all, if YOU think about those things, everyone else must be thinking the same thing. The reality is quite different. Your mind is unique to you. We all have different views of the world and we each create stories in our minds that justify the existence we live. We all have to look at ourselves in the mirror each morning and we all find ways to be content with the person we have become. And if that requires that we blame the world for our hardships, so be it. If it requires that we see others as cruel, that’s just fine – as long as it’s not OUR fault. I believe my neighbor lives a very unhappy existence in a very nasty world; a world completely different than my own. My world is full of nice people. I’m always amazed at how kind people can be and I have never had a hard time finding a helping hand or a shoulder to lean on. But that is not true for my neighbor. He even knocks on my door from time to time, looking for a favor. It actually amazes me that he is comfortable doing this. I mean; we’re not friends. Yet, he has no problem asking me to borrow my printer or water his flowers while he’s away on vacation. And what do I do? I try to avoid it. I don’t want to do those things for him. He annoys me. Why should I go out of my way to help him? Look at me! I’m playing right into the theory. I’m usually a nice person. Really. But to him, I’m mean. I spoke with another neighbor just this morning and she wants to lodge a formal complaint against the guy. I disagree. He’s already paying a heavy price for the way he lives his life. He lives his punishment every single day. Any complaint we lodge against him will only fuel his victim complex and make it worse. I actually feel quite sorry for him. I would hate to live his life. If you’re reading this post, you’re probably alone in front of your computer. Take a few moments and think about your world. Is it full of nice people? Or is it full of mean people? The only thing you have control over is yourself. Could you make a conscious effort to be nicer? I promise the effort won’t hurt. It can only benefit you and I encourage everyone to be willing to take a look in the mirror to see if their hardships are, in fact, of their own making. This article was featured in The Fourteenth Edition of the Carnival of Improving Life 12 Comments Congruence 12 Responses to “The World is a Reflection of Yourself” ImprovedLife.ca on 19 Jun 2008 at 3:37 am # Fourteenth Edition of the Carnival of Improving Life… … Law of Attraction Carnival #36 - Visualize | Law of Attraction | The Secret | LOA on 19 Jun 2008 at 9:52 am # […] Schwerdtfeger presents The World is a Reflection of Yourself posted at Tactical Execution, saying, “The fastest way to live in a wonderful world is to be […] Carnival of Positive Thinking on 22 Jun 2008 at 3:56 am # […] Schwerdtfeger presents The World is a Reflection of Yourself posted at Tactical Execution, saying, “Taking a critical look in the mirror is often the […] pinkblocks - personal power and self help » Blog Carnival on Personal Power June 21, 2008 on 22 Jun 2008 at 8:26 am # […] look. First, is it true that most of the neighbors dislike him? Patrick Schwerdtfeger presents The World is a Reflection of Yourself posted at Tactical […] Alexwebmaster on 03 Mar 2009 at 4:47 am # Hello webmaster I would like to share with you a link to your site write me here Jack on 07 Jun 2009 at 4:28 am # This is soo true. Ive been learning this ever since i was about 13 years old. The world around us is a reflection of our own minds. Be a funny caring, happy person and you will be greeted with a world that is the same. Ive been through all of the extremes and find that its my emotions and thoughts that determine my experience. Excelent article, Five stars 🙂 Avatar2154 on 02 Jan 2010 at 4:37 am # Thank you Patrick, I enjoyed your very insightful commentary. I also think I manifest 100% of everything in my life from the inside >> out. This creation depends a lot on what I focus on in everyday life. I think with age comes the responsibility of our own creations. I also think some people can create the illusion that they do not create their reality, and then they go about blaming others for their problems. Sad really, but I live in hope that more people will understand themselves. Maybe then someday humanity will have fewer problems. “You see the world as you are, not as it is; because it is the I behind the eye that does the seeing” Blessings to all. dee on 09 Feb 2010 at 1:56 pm # quite shallow, does not deal with the complexities of our personalities. what if your neighbour has been treated unfairly ever since the day he was born. what f he had a psychotic mum who manipulated, controlled and abused him througout his life. do you think its quite easy to wake up and start smiling. not only is this shallow i find it quite amusing that you are unwilling to help him because he is mean, then you your self are a joke, a pretentious one. it is easy to be nice to those who are nice to us, but the real test of our character is revealed when we come across someone who isnt deserving of our favour. you talk about the “world” and its rules, then you should know about the law of attraction. if you understand that law then you’d understand that the universe has brought that guy to your neighbourhood to show how uncaring, rude and pretentious you all are. Patrick Schwerdtfeger on 09 Feb 2010 at 2:24 pm # Dee, I truly appreciate your comment (all comments are welcome) but I totally disagree with your quick judgment. My neighbor has a choice, every day, of how he wishes to interact with the world. He chooses to do so with aggression and cynicism. I have tried to reach out to him on multiple occasions but he reacts rudely. The Law of Attraction applies to him too. What he attracts is rudeness and that is precisely my point. I am a kind person. I always have been. But what’s the point of being kind to someone who is mean back? His world of his own making, just as yours is. Your closing comment is the most interesting to me: “to show how uncaring, rude and pretentious you all are.” So, I guess that means that you too believe the world is full of rude people. I disagree with that too. My world is full of kindness and generosity. I am always amazed how kind people can be. I hope you don’t live in a parallel world full of misery. Remember, you have a choice of how to interact with your world. Choose wisely. Patrick. .-= Patrick Schwerdtfeger´s last blog ..Christine Comaford – The 3 BIGGEST Mistakes Entrepreneurs Make =-. ruby on 07 Apr 2010 at 8:34 am # very well said. i found your blog by reflecting on the same subject myself. i’ve shared your link on facebook. thank you! ruby on 07 Apr 2010 at 8:41 am # ps- dee- i hate to point this out, but you just unconsciously proved patrick’s point. i’ve known people who’ve been through a lifetime filled with hardships and mean people. (my father was severly abused physically, along with his mother and 7 siblings- never met my grandfather because he died alone drinking in his shop- no one would ever guess this, because he is literally one of the gentlest and kindest men) some choose to follow the same path as what they were shown through life. (which is the point you are making, imho) some choose to follow a different path, choosing to reach out to those who reflect positivity in their life and letting go of the surroundings which bring negativity. we all are faced with choices everyday. one of my favorite quotes is “Your attitude is everything and determines how you experience every aspect of your life. You cannot always control what happens to you in the world, but you do determine how you react to it many times a day by your attitude.” Jerry Jampolsky M.D. & Diane Crincione, Ph.D. Jon on 27 Apr 2010 at 10:05 pm # Yes, everything is a reflection. The people that we come into contact with are mirrors of what’s going on in our own lives, be it good or bad. The situations (without people) are also reflective. Again, whether the situations contain people in them or not, it can be an indicator of what’s really going on inside. If the message being re-projected is not pleasant, we can use this as a cue to make changes accordingly, but I must remind you. Believing in this does not mean that others feel this way. Believing this does not make you more righteous. At the end of the day – we are all just trying to “figure it out”. Therefor, I worry that sometimes people use these “Laws” too loosely. Its true, you cannot change people – only they can change themselves, but it is also worth noting that it takes the perfect type of person, in the right moment to open a certain person’s heart. This may not be you, but it does not mean that you need to write about this person, because you and others were denied by this person as a possible personal connection. You truly cannot know the emotions that have bonded to someone, therefor you may not discuss it, because you cannot appreciate it – for not one creature is alike. You can only practice what you preach within your own life, and only that. Happiness is nowhere else."
