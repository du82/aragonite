title = "credibility | Tactical Execution"
full_description = "Published by Patrick on 09 May 2008 Build Your Business with Public Speaking Last night, I spoke at the May PATCA dinner in Santa Clara. There I was, demonstrating my expertise to a group of self-employed consultants, ranging from independent software developers to human resources specialists to factory layout engineers. All of these people spend their days adding value to their various customers and getting paid on a 1099 basis. Refreshing. That’s exactly what I do! But there’s more to it then that. All of these people can use my expertise to build their respective businesses but they can also resell my expertise to their clients. So that means my presentation last night could lead to some immediate business but it might also lead to some partnership arrangements down the road. In fact, a few of them already spoke to me about projects they’re working on that would benefit from some of the strategies I laid out. Point is; my presentation helped me build credibility, gain exposure and grow my business. Public speaking is one of the best ways to demonstrate your expertise. It’s a highly leveraged activity. You speak once but are heard by multiple people. In the case of last night, I was probably heard by more people than were actually at the event! And you always get some automatic credibility for being the person at front of the room. All in all, it’s an ideal way to build your business quickly. So let’s talk about how to get some of these speaking engagements. Well, as it turns out, there are plenty of organizations that are looking for speakers all the time. Think about community organizations like Rotary, Kiwanis and Lions. And then there are all the associations like the one I spoke at last night. You can also look at the tradeshows and conventions in your industry. All of them have education days where speakers have an opportunity to share their expertise. It all begins with a workshop proposal and you can browse a number of mine right here on this website. You can follow the same basic format. Think about a catchy title. Think about a topic everyone’s talking about in your area of expertise. Answer the top 10 questions or address the top 10 myths. People love lists. So think about a topic you could present and then develop a proposal around that topic. Once you have that complete, it’s only a matter of contacting the organizations you’re interested in and emailing your proposal through. You might be surprised how quickly you can start booking engagements. Before I sign off, I’d like to address the common issue of being afraid of public speaking. Some studies have found that public speaking is one of the most-feared activities most people have. It’s true. You have to get used to it. But it all boils down to practice and I joined a Toastmasters club back in October 2006 and it was one of the best things I’ve done in years. We have a great club and it’s a wonderful and supportive place to hone your speaking skills without risking a business project. Business"
