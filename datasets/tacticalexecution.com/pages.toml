["https://tacticalexecution.com/2008/06/millionaire-mind-intensive"]
title = "My account of the Millionaire Mind Intensive held in San Francisco, CA. | Tactical Execution"
description = "PLEASE NOTE: I have not used this website since 2010. Please visit my new website for current information. Thank you! The following post was published in 2008 … Last weekend, I attended a 3-d…"
full_description = "Published by Patrick on 05 Jun 2008 at 03:47 pm Millionaire Mind Intensive PLEASE NOTE: I have not used this website since 2010. Please visit my new website for current information. Thank you! The following post was published in 2008 … Last weekend, I attended a 3-day workshop in San Francisco. It was called the Millionaire Mind Intensive and it was facilitated by T. Harv Eker from Peak Potentials Training. Wow! 1400 people were in attendance and they had the Mascone Center hopping from morning ’til night. On Friday, I was there from 8:15 AM to 10:00 PM. On Saturday, I arrived at 8:30 AM and left at 10:30 PM. And on Sunday, the sessions started at 8:00 AM and finished up at 8:00 PM. I’ve been told about this workshop for quite some time and this was the first time they had held the event here in San Francisco. In years past, they always held it down in LA. Anyway, I had 4 different people suggest I attend so I blocked those days off on my calendar and committed to the process. I was absolutely 100% impressed. They did a spectacular job. Not only was the content very strong but the choreography and sequencing of the event were flawless. These guys have been doing this for years and it’s obvious they have held events like this all over the world. Every detail was well planned and executed. For me as someone who offers workshops and seminars myself, the whole thing was actually quite inspiring. So what was it about? Well, the workshop was about adjusting your “financial blueprint” to mentally pave the way for your own success. It was about thinking like a rich person. It was about clearing your mind of all the limiting beliefs and negative stigmas associated with being financially successful. And I have to admit that I feel at least 10 times better than I did before. At one point on Saturday afternoon, I thought to myself that if someone had walked into the room at that moment without knowing anything about the content and exercises shared before, they would’ve looked at this huge crowd and thought we were all a bunch of loonies who were part of some crazy cult. We were in the middle of an exercise where we were purging our minds of fears. You wouldn’t have believed it! Looking back now, I can see that they spent Friday priming us and tickling our brains with some clever self-discovery exercises. On Saturday, they warmed us up and got us all to look at ourselves a bit. Everything was done in a very deliberate order. And on Sunday, they took the gloves off and spent most of the day pushing buttons and forcing us to go deep within ourselves to unearth some of the issues we’ve been carrying around our whole lives. One of the most fascinating things for me was that everybody who was there had something. Everybody had some old legacy issues still lodged in their minds from years earlier or even their childhood. We all have challenges. We all have belief systems that sometimes hold us back. We all have to battle ourselves as we move up through the ranks and accumulate more and more success. On Sunday afternoon, I even broke a wooden arrow with my hands behind my back. The point was sticking into my throat and the other end held stationary by a perfect stranger. In order to break the shaft, I had to walk into the arrow, pushing the point further and further into my throat, until eventually the wooden rod bent over to the side and snapped. Was this a crazy wierd clut-like exercise? Yes. Absolutely. But it was very effective. It was scary and became completely intertwined with the idea of shedding fears on a psychological level. And let me tell you, when the arrow finally snapped in two, there was a sense of relief that is difficult to describe. If you’ve never been to this event, I’m quite sure you’re reading my account and thanking the Lord you weren’t there. That’s the wrong conclusion. Rather, just say that you couldn’t quite imagine the environment unless you too attended the event and were led down a path for 3 days where each exercise led seamlessly to the next and that each one could not have been successful unless the previous exercises happened first. It was an amazing event and I’m thrilled I went. I never expected to get so much out of it. I fully expected the benefit for me would be in the choreography and delivery, but I got much more. I took a good close look at myself and accepted their guidance to help me better understand myself. They succeeded and so did I, and I would recommend this event to anyone. UPDATE (10/29/2008) – I just found out the seminar is coming back to San Francisco at the Hyatt Regency SFO Airport (1333 Bayshore Highway, Burlingame) on November 21-23, just before Thanksgiving. Register for the Millionaire Mind Intensive San Francisco here. 9 Comments Business 9 Responses to “Millionaire Mind Intensive” The Effortless Abundance Blog Carnival - second edition : Effortless Abundance on 15 Jun 2008 at 5:05 pm # […] Schwerdtfeger presents Millionaire Mind Intensive posted at Tactical […] The Carnival of Twenty Something Finances » Poorer Than You on 16 Jun 2008 at 5:38 am # […] Millionaire Mind Intensive posted at Tactical Execution. […] Brain Blogging, Thirty-Fifth Edition | Brain Blogger on 20 Jun 2008 at 11:51 pm # […] Execution presents Millionaire Mind Intensive: Was this a crazy wierd clut-like exercise? Yes. Absolutely. But it was very effective. It was […] Shaheen Lakhan on 20 Jun 2008 at 11:59 pm # Thanks for submitting this post to our blog carnival. We just published the 35th edition of Brain Blogging and your article was featured! Thank you. Sincerely, Shaheen Carnival of Money Stories #63 - Gather Round the Campfire! | Bible Money Matters on 28 Jun 2008 at 7:41 am # […] Schwerdtfeger presents Millionaire Mind Intensive posted at Tactical […] astatic on 25 Aug 2008 at 8:03 pm # Really liked your review. I also attended the Millionaire Mind Intensive seminar and thought my experience wasn’t exactly the same, I did come out with an amazing feeling of inspiration. Knowing that I am capable of fulfilling my financial dreams was enough to get me over that hump of complacency. It was great being in a roomful of other people in the same boat too – some of the connections I made there have really helped as well! Jack B on 24 Sep 2008 at 8:13 pm # Very good review of the Millionaire Mind seminar. I believe it will be very helpful for anyone who is thinking about attending it. Great job! Jack. Shane Belceto on 28 Jul 2009 at 6:51 pm # My friend Debbie shared your website here with me, I will have to remember to Thank her. I like the way you write. This review is great as well and I can see why it is a popular post. I like you experienced great things being a part of the MMI weekend. In fact went in May with a bunch of MLM friends at the time some years ago and then went right back the very next month with just my wife. Each MMI left me with different experiences and changes within. Thank YOU for your view point and words aobut how you found this weekend to be for YOU. ~Expect Miracles Shane Jaida on 20 Jun 2012 at 6:18 am # Up until now there are a lot of people that are still interested in Harv Eker’s program: The Millionaire Mind. Been told by man about this but has not actually attended the workshop. With your experience on the workshop, it makes me wanna attend too. I hope there will be a seminar coming soon somewhere near our area. Will check the millionaire mind events website anyway. Thanks for sharing your wonderful experience."
