full_description = 'Published by Patrick on 23 Jul 2011 Learn more Comments Off on Learn more about Patrick Schwerdtfeger Uncategorized Published by Patrick on 18 Apr 2011 Book Pre-Order Promotion “Marketing Shortcuts for the Self-Employed” (2011, Wiley) is now available for pre-orders on Amazon. They have the hardcover book on sale for only $14.93 (discounted from $21.95 retail). Click here to buy a copy. Here’s the deal … Pre-order 1 copy: receive a PDF file (via email) with 78 worksheets, one for every chapter (except the first and last). Pre-order 3 copies: receive the PDF plus a CD that I recently recorded entitled “How to get booked as a Keynote Speaker” (via USPS). Pre-order 10 copies: receive the PDF, the CD and my 6-DVD home study course entitled “Social Media Victories” (via USPS). Original retail price: $299. INSTRUCTIONS Pre-order the book(s) on Amazon and then forward the confirmation email to my own personal email address: DISCLAIMER “Marketing Shortcuts for the Self-Employed” is an expanded and updated version of “Webify Your Business”, my 2nd book. Webify had 60 chapters. I deleted 6 and then added 26 new ones, bringing the total up to 80 chapters. But that still means that 54 chapters are virtually identical to the Webify book. The 26 new chapters cover social media (including Twitter, Facebook, LinkedIn and YouTube), Google codes & alerts, outsourcing, negative comments, Google Places, guest bloggers and event marketing. And just like Webify, every chapter ends with an itemized to-do list.This top-notch essay service excels at crafting well-researched papers on any topic. Boasting a team of experts with advanced degrees, they promise timely delivery and impeccable research. Their "WritePaper" option ensures personalized, academically sound work that elevates your academic performance. REALITY Pre-orders are super important. The retail buyers look at pre-orders as an indication of the book’s potential. That determines whether or not they put it on their store shelves. And of course, if it’s on store shelves, that dramatically increases the odds of the book doing well. So pre-orders directly impact the book’s eventual success … and I sincerely appreciate your help! MESSAGE I am very excited about this book. It’s the culmination of 3 years of my life. Please consider pre-ordering a few copies. It makes a spectacular gift for self-employed friends or colleagues and the feedback on Webify – the original version – has been incredible. Your pre-order helps me directly and I am grateful for your support. 2 Comments Business Published by Patrick on 30 Oct 2010 Healthcare Professions for Technologically Savvy People Health information technology merges two of the nation’s fastest growing industries: Healthcare and information technology. Some experts consider healthcare information technology to be the world’s fastest growing IT sector. The U.S. Bureau of Labor Statistics has projected job opportunities will be highly favorable for heath information technology professionals in the coming years. Health IT jobs are projected to grow much faster than the average for all occupations. The Bureau of Labor Statistics has projected an 18.6% employment growth from 2006 to 2016 for health information management (HIM) professionals. Health information management is one of the nation’s fastest growing occupations. Healthcare information technology focuses on managing and utilizing health information of patients. Healthcare IT places an emphasis on computers and digital technology. The healthcare industry is pushing to move the health information technology field to a highly useful, sophisticated database matrix. The strong push provides excellent opportunities for technologically savvy people. Health information managers spend a lot time working with computers and software, managing and securing patients records and complying with federal mandates for electronic storage of patient information. Health information managers ensure patient records are complete and accurate. They also ensure the databases are secure. Formal training is vital for health information technology jobs. It’s essential to take a program that provides the latest in health information technology. For those too busy to attend campus during the week, numerous schools offer online healthcare IT degrees. Healthcare information management bachelor’s degree programs prepare students for healthcare information administration and management positions. These positions offer high salaries. Health information management bachelor’s degree programs provide training in operating and maintaining information technology systems and dealing with equipment and situations unique to the healthcare industry. A master’s degree may be required for upper-level positions in HIM. Graduates from a bachelor’s degree program accredited by the Commission on Accreditation for Health Informatics and Information Management Education are eligible to take the Registered Health Information Administrator (RHIA) exam to obtain a professional credential. The credential is not required in the health information management industry, however according to All Healthcare Degrees, RHIA managers earn about $15,000 a year more than managers who don’t have the credential. The fast growing field of health information technology offers excellent opportunities and good salaries for technologically savvy people. The education requirements can often be fulfilled at home with a computer and access to the Internet. The field offers in demand and rewarding careers that pay well. Brian Jenkins writes about health information technology for Braintrack.com. Comments Off on Healthcare Professions for Technologically Savvy People Business Published by Patrick on 24 Mar 2010 Ellen Looyen – The ART of Personal Branding Part 1 Part 2 Part 3 Part 4 Part 5 If you know someone who could benefit from this free information, please use the “share this” link below to email them about this page. It’s fast. It’s easy. It helps your friend. And it helps us spread the word. Thank you! 2 Comments Uncategorized Published by Patrick on 16 Feb 2010 Jeff Johnson – Internet Marketing with SEO and Social Media Part 1 I can’t find the first part of this video series. All of the others are on Jeff’s channel but Part 1 is missing. Sorry. Anyway, the content below is incredible. Block out some time and check it out. It’s worth it! Part 2 Part 3 Part 4 Part 5 Part 6 Part 7 Part 8 Part 9 Part 10 Part 11 Part 12 Part 13 Part 14 Part 15 Part 16 Part 17 Part 18 If you know someone who could benefit from this free information, please use the “share this” link below to email them about this page. It’s fast. It’s easy. It helps your friend. And it helps us spread the word. Thank you! Comments Off on Jeff Johnson – Internet Marketing with SEO and Social Media Technology Published by Patrick on 09 Feb 2010 Christine Comaford – The 3 BIGGEST Mistakes Entrepreneurs Make Part 1 Part 2 Part 3 Part 4 Part 5 Part 6 Part 7 Part 8 If you know someone who could benefit from this free information, please use the “share this” link below to email them about this page. It’s fast. It’s easy. It helps your friend. And it helps us spread the word. Thank you! 5 Comments Business Published by Patrick on 26 Dec 2009 Wordle for the “Webify Your Business” Book My brother up in Edmonton, Canada, just told me about Wordle, a website where you can input a bunch of text (or a URL or even a Delicious username) and create a word cloud for free. It’s pretty cool but the most interesting part is how he’s using it. My brother is a City Planner up there and they get lots of feedback at public meetings they hold in preparation for development plans or zoning changes. They then take all the feedback and paste it into Wordle to create a word cloud, immediately highlighting the things that were most important to the public. Fascinating. Anyway, I was curious how my recent book would be interpreted as a word cloud so here it is: I’m sure there are tons of creative ways you can use this in your own lives. Check it out. Comments Off on Wordle for the “Webify Your Business” Book Technology Published by Patrick on 05 Dec 2009 Unbelievable Mobile and Projection Technology Here are three videos explaining some of the coolest technology I’ve seen in a long time. A friend sent me these videos and I had to post them because they impressed me so much, especially the top one. Check it out. Can you imagine a world where this type of technology was widespread? I can’t wait. This first video is a presentation at TED and it demonstrates a device you can wear around your neck, giving you completly mobile access to the internet in ways you have to see to believe. This second video shows how you can use a Wii remote to turn any wall into a computer screen. This guy shows how he creates it using regular household items. Amazing. This last video demonstrates technology for projecting content on surfaces and the ability of the source to detect the size, shape and position of the projection surface and adjusting the content accordingly. The future looks good to me! I get so excited thinking about the stuff we’re all going to be exposed to during our lifetimes. I’m sure much of it is still beyond imagination at this point. One Comment Technology Published by Patrick on 05 Dec 2009 Incredible Mobile iPhone Applications Here are two incredibly cool mobile applications for mobile phones like the iPhone. Watch these videos. They are both examples of the type of stuff coming our way via mobile technology. This first mobile application gives New York residents an easy way to find the nearest subway station and the various lines that run throughout the city. This second mobile application offers the user relevant information based on the location where they are standing and the homes, buildings and establishments near by. This is such an exciting time to be alive. In the coming years, we’re going to see technology that will completely revolutionize the way we live our lives. I’m psyched! You? 2 Comments Technology Published by Patrick on 14 Oct 2009 Patrick Schwerdtfeger speaks at Bay Area Consultants Network BACN September 25, 2009 – I had the opportunity to speak at the Bay Area Consultants Network (BACN) in San Rafael, CA. It was a great event. The room had about 90 sophisticated and successful consultants in attendance and my presentation was met with great questions and dialog. It is truly a privilege to speak for such a sophisticated audience. It raises the game for everyone. Shari Weiss was one of the consultants in attendance and put together an impressive blog post, chronicling the event and getting reaction from various people in the audience. She also included a bunch of video clips so you can get a really good idea of what was discussed and how it was delivered. Thank you, Shari, for putting this together. Comments Off on Patrick Schwerdtfeger speaks at Bay Area Consultants Network BACN Media Next »'
