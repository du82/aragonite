["https://tacticalexecution.com/tag/search-engine"]
title = "search engine | Tactical Execution"
full_description = "Published by Patrick on 22 Jul 2009 KPMRS hits a bull’s eye on Search Engine Rankings A useful Keyword Monitoring tool for SEO Professionals, Website Owners and Bloggers has been visibly floating in the Internet Marketing world recently. This website is called KPMRS.com and it allows you to check your Website Rankings on search engines for the keywords of your choice. KPMRS is strongly catching up in SEO Tools KPMRS offers its users Keyword monitoring on three search engines – Google, Yahoo and Bing, apart from a host of other supplementary services such as a Google Page Rank monitor, Social Activity Prober, Back Links tracker, Alexa Ranking Charts, Graphical widgets, and then some. KPMRS is also being launched on your iPhone soon and promises a lot of new, intelligent features and tools in the development pipeline. I suggest you check out this website pronto! Technology Published by Patrick on 13 Jul 2008 Website Optimization for Targeted Keyword Phrases We’ve all heard the phrase Search Engine Optimization or SEO. We’re all familiar with the need to optimize our websites for the keyword phrases that are central to our businesses. But how many of us truly know how to go about it? How many people really know all the different places we can load keywords? I’ve discussed this before in a post about the primary SEO success factors. Well, here are a few more pointers. Create pages for each keyword phrase. This is a basic one, but one that is often overlooked. Let’s say you’re trying to promote your business in Walnut Creek (the city Tactical Execution is based in). You obviously want your website to rank high for people putting “Walnut Creek” into their search querie. The first thing you should do is create a page called “Walnut Creek” or better yet “Walnut Creek [business keyword phrase]”. By doing so, you’ll create a new URL on your website that includes both your city name and your primary business keyword phrase, side by side. Search engines put a lot of weight on the words included in your URLs. Check out All American Hauling. I built this site for a friend and you’ll notice I’ve created individual pages for each city they service and every service they offer. In addition, I’ve included links to all these individual pages right on the homepage. Not only does that include all the relevant keywords on the homepage but it also adds keyword-rich URLs pointing to keyword-rich descriptive pages. Put keywords into image tags. Every image on your website has a “Title” tag and an “Alt” tag. Those tags all represent places where you can include more descriptive keywords. Again, you can look at All American Hauling for an example of this. It’s a very basic site but the mechanics are very strong and it has a #1 Google ranking for keyword phrases including “hauling Walnut Creek”, “garbage removal Walnut Creek”, “East Bay garbage removal”, “Contra Costa garbage removal” and “Clayton garbage removal”. Every image on this site has keyword-rich tags. The search engines know the “Alt” tag shows when someone scrolls over an image. That means the words you put there are almost always relevant to the topic of the page. Take advantage of that and put your targeted keywords into your image tags. Use keyword-rich anchor text. The words you use for your links play a major role in the ranking of the destination pages. Again, we can take All American Hauling as a case study. All the services that All American Hauling offers are described on individual pages. Those services are also listed on the homepage and each one is a link to the associated page. The alternative to this approach is to references “the services offered by All American Hauling” and then put the link on “services”. There’s no value in that. “Services” says absolutely nothing about what the company does. Take advantage of the opportunity in your internal link structure. By putting the links onto your targeted keywords, you increase their importance within your entire site. These are just three small tips and there are many others. Get creative when optimizing a website. Think about all the possible places where you can include more keywords. If you leverage all the SEO opportunities, you can create an extremely effective website. The All American Hauling website only has 34 pages but it delivers organic visitors all day long and you can do it too! Website Published by Patrick on 11 Jun 2008 Using Video to Grow Your Business Google and the other search engines have all updated their algorithyms to increase the value attributed to video content. Already, an estimated 40% of internet bandwidth is used to accommodate video content and that’s expected to grow over the coming years. And although many of us probably believe that YouTube is already overrun with competition, the fact is that there just aren’t that many people doing it right yet. There’s a huge opportunity for people to use video as a way to build their following and push value to their audience. You can use the medium to demonstrate your expertise and give people a sample of your approach. Heck, they’ll even know what you look like! People don’t trust governments. People don’t trust companies. People often don’t even trust websites. What do they trust? People trust other people, and video is a great way to put a human face on your business. Let’s start with some groundwork. First, don’t think your video has to be super slick. Absolutely not. In fact, studies have shows that super slick videos are trusted far less than lower quality amateur-looking clips. The more “real”, the better. You don’t have to spend a lot of money on this. Just get yourself a video camera with a microphone jack and then get a directional microphone that will deliver good voice quality. Between the two, you’re probably looking at about $350 worth of equipment. Another thing: people love lists. The top 10 of this. The bottom 10 of that. The 7 biggest mistakes people make. The 5 things you need to remember. Whatever it is, structure your content into a list. It injects automatic structure to your presentation and makes your content easier to understand. When uploading your video, make sure to include your URL and/or business name in the description. That will help your business name get indexed higher on the search engines. Also make sure you include your keywords in the description as well as the tags. Both will help your video come up higher and faster on the search engines. Don’t make just ONE video. A single video will quickly get buried amongst thousands of other videos, never to be seen again. Instead, make a series. Make these videos on a regular basis. YouTube and all the other video platforms allow you to create a profile and then attach all your videos to that profile. When someone finishes the video they’re watching, the platform will display thumbnails of all the other videos you’ve produced. That’s where the opportunity lies. If you have a series of videos up on YouTube, people will find one or another depending on what they’re searching for. But after that, they’ll quickly see the breadth of topics you cover and will likely browse a while longer, getting to know you and your expertise. Before long, their trust level has grown dramatically and they’re ready to do business. You might be reading this and thinking that this is just one more thing you’re supposed to be doing. One more thing piled on top of all the other things sitting on your desk. You’re too busy already! How could you possibly do this also? Well, if you’re blogging, your job is done. Every single blog post is perfect content for a video and you won’t get knocked for duplicate content because one is in text format while the other is in video format. I recommend writing your blog post first. Write it out, structure it into a list and publish it on your website. Then turn on your video camera with your computer right beside you and relay the same information into the camera. Don’t even worry about memorizing it. You can reference back and forth. Nobody will mind. It will be mor casual and more “real”, making your audience feel at ease. Every day, there are more and more video platforms on the internet. Rather than uploading your video a dozen times, each at different platforms, I recommend using a distribution service like TubeMogul. There, you can upload your video once and automatically distribute it to all the major platforms in one step. And it’s well worth the effort because different platforms feed different communities. Also, some get indexed quicker than others and the search engines LOVE fresh new content. Most people think YouTube has nothing more than rock bands in concert, Britney Spears getting out of a car, amateur fights and people falling off bicycles. It’s true that these topics are well covered on YouTube but there’s far more out there than you might think. You can learn how to play guitar on YouTube. You can learn how to speak German. You can learn how to install WordPress or record a podcast. You can learn just about anything on YouTube. That represents an enormous opportunity for all of us. Think about your expertise. Think about the value you could push to your audience. Think about the lists of juicy nuggets you could deliver on video to a waiting and appreciative audience. Take some time to write down the different topics you could cover and if you find that you have a lot, go out and buy a video camera. It might be the best investment you’ll ever make! Amazon.com Widgets Business Published by Patrick on 08 Jun 2008 Targeting Anchor Text to Improve Search Engine Rankings Search engines like Google look at a variety of different factors when evaluating your website. Although the specifics of these algorithyms are difficult to nail down, the major factors include the following: The amount of unique relevant content on your site. The newness or freshness of the content on your site. The number of inbound links pointing to your site. The number of links to the sites that are linking to you. These 4 factors are the primary contributors to a strong search engine ranking, but there are others as well. One under-utilized contributor is anchor text. And what’s that? Well, it’s the words used as the ‘anchor’ for a link. So, if I used the words free articles to click to the 70+ free articles on this website, the anchor text for the link is “free articles”. Let’s think about this. By using the words “free articles”, I am saying that the place to find free articles is the location the link points to. Or if I used sports news to link to ESPN.com, I am saying the best place on the internet for sports news is ESPN.com. I am defining my endorsement. Any link I put into my blog or website is an endorsement for the website I’m pointing to. And when I put the link on certain words, I’m adding clarification to my endorsement. The search engines know that. Turns out, the words used to link to YOUR website play a significant role in the ranking your website gets for those specific words. We all have specific keyword phrases that we’d love to ranking high for on the search engines. For me, I’d love to rank high for phrases like “internet marketing”, “small business marketing” and “entrepreneur resources” among others. And article marketing is one of the easiest ways to create those inbound links all by yourself. Article marketing is the process of writing 500+ word articles (demonstrating your expertise) and then publishing them on the internet. There are dozens of article distribution services that will distribute your article to hundreds or even thousands of article directories and online publishers for cheap or even free. The beauty is that you can talk about yourself in an area called the author resource box and in that area, you can include a link to your website. Most article authors go through the process and put the link on the name of their website address. So for me, the link would be put on Tactical Execution. That’s a major missed opportunity! Instead, these authors should select one of their ideal keyword phrases and put the link on those words. For me, I could put the link on a phrase like small business marketing. By doing so, I am creating an inbound link to my website with the anchor text directly aligned with my marketing objectives. As you may know, the hallmark of my business success is that I test everything I preach. And in that effort, I did an experiment in the fall of 2007 where I targeted the phrase “growth marketing” and published a number of articles with the inbound link anchored on that phrase. Within just 17 days, I already had my Tactical Execution listed on page 2 of a Google search for that phrase. And today, my site usually comes up first or second. You can see where I come up today by clicking here. The primary strength of article marketing is the ability to target specific keyword phrases by using them as the anchor text for your link in your author resource box. Personally, I use iSnare to distribute my articles and today, they show up on literally thousands of different websites. Best of all, the service only costs me about $1 per article. Take advantage of the opportunity and start targeting specific keyword phrases today. Website Published by Patrick on 06 May 2008 How do I get on the first page of Google? This is what everybody always asks me. Well, it’s a process. It’s a series of things you need to do on a regular basis and the most important part is to produce more and more relevant content on a regular basis. That’s the first question I ask clients. Do you have a content generation mechanism? If you don’t, we have a problem. If you do, the sky’s the limit. The problem is that most people want to buy results, not a process. They don’t want to do anything. They just want it to happen. I hate to say it but that just won’t work. You see, the evolving blogosphere is full of intelligent people generating fresh new relevant unique content on a daily basis. These blogs have hundreds or even thousands of pages, all about one particular topic. How can a well-optimized but static website compete? It can’t. Having said that, let’s spend a little time talking about the primary SEO factors that do, in fact, help your cause. Again, keep in mind that a static website with no new fresh content will almost certainly come in second place. But the following tips will definitely put you in a better position to show up high on a Google search. And if you do these things AND produce fresh relevant content, you’re in great shape to rise to the top for dozens or even hundreds of relevant keywords and phrases. Keywords in Title Tags. This is one of the most important things you can do. Every page has a title tag and you should limit it to about 65 characters. Make sure you put a title tag on every page and stack it full of relevant keywords. Keywords in H1 Tags. Your H1 tag is the title of your page. It’s what comes up at the very top. The search e"
