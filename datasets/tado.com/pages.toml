full_description = 'Using the tado° app, you can control the temperature of your home from anywhere and activate lots of practical functions to save energy. Easy to integrate into your smart home system: with practical voice control via Google, Siri or Alexa for added convenience. tado° makes it easy to feel good at home because you can enjoy your perfect temperature and optimum air quality at all times. Everything is easy with tado°: whether you’re installing your device or controlling your tado° app. Future-proof: tado° utilises the universal technology standard Matter, which simplifies your smart home and can link multiple devices from different manufacturers. Thread connection makes your network more secure and robust. Do you like things even easier and more convenient? Maybe you want full transparency about your energy consumption and costs, information about irregularities and heating failures, and fully automated Geofencing and Open Window Detection? Our Auto-Assist subscription offers you all of this. With tado° you can view your heating details at any time and take charge of your energy consumption while you watch your savings stack up. The tado° setup is compatible with almost any heating system and offers innovative functions and unique energy management services. Our installation assistant in the tado° app supports you step by step as you install your tado° product. Even if you’re not connected to the internet. *Based on the Fraunhofer Institute for Building Physics Study: "Dynamic simulation study to compare the energy demand of selected, typical homes with heating control with weather forecast and absence detection versus conventional heating control", 2022 (EER-021/2022/720).'
