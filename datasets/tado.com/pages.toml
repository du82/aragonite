["https://tado.com/en/customer-services/installation-x"]
title = "Simple Setup, Seamless Comfort | tado° installation"
description = "Simplify setup with the tado° app for enhanced comfort. Install your tado° device easily with customised instructions. Enjoy smart installation for a more comfortable home."
full_description = "The tado° app guides you step by step through the set-up process. This is of course tailored to your specific model. And it also works when you’re not connected to the internet. You won’t need any tools to install the Smart Radiator Thermostat X, Bridge X, or Wireless Temperature Sensor X. You will need a screwdriver for the Smart Thermostat X, Heat Pump Optimizer, or if you’d like to mount a Wireless Temperature Sensor to a wall. The app guides you through the entire installation process with step-by-step instructions tailored to the exact heating devices in your current system. Your first step is to install the Bridge X, which acts as the central hub for all of your devices. Simply plug the Bridge X into a wall socket, and follow the app’s instructions to connect the Bridge to your network. After that, you can start scanning the QR codes for your other tado° devices and adding them to your tado° Home. The app offers installation instructions for each device. You will need to be connected to the internet to access installation instructions in the tado° app that are specific to your heating system, and to make sure that your devices can connect to the cloud. Once the installation process is complete, your devices can use Thread to stay synched to your schedules even if they lose internet connection. Once you’ve replaced your old thermostat with tado°, you won’t need it anymore. However, if you ever decide to move and take your tado° devices with you, you may need to reinstall your old thermostat. If your old thermostat is broken, you can send it to a recycling centre for electronics. Matter is a connectivity standard that includes Thread, the technology that allows your tado° devices to connect to each other and the cloud. Thread enables your devices to function normally even if you lose internet connection. During the installation process, you need to first install the Bridge X, which is a Thread Border Router that acts as the central hub for all of your devices. You do not need a Bridge X if you already own a compatible Thread-enabled home hub or a Heat Pump Optimizer X. But you can always add a Bridge X to your home to act as a range extender for your Thread network. To add tado° devices to your app, simply scan the QR code on the device and follow the installation instructions in the app. You can also manage tado° devices from other Matter-enabled apps like Apple Home."
year_published = 2025
