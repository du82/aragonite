full_description = "This policy outlines the guidelines and procedures for reporting security vulnerabilities in our systems and applications to us in a responsible and ethical manner. We value the security research community's contributions to helping us identify and address vulnerabilities that could potentially impact the security of our systems and our users' data. This policy applies to all individuals who discover or have knowledge of any security vulnerability in our systems, applications, services, or infrastructure, including employees, contractors, security researchers, and members of the public. If you believe you have discovered a security vulnerability, please report it to us immediately by following these steps: We are committed to working with you to investigate and address reported vulnerabilities in a timely and responsible manner. We will acknowledge receipt of your report within 2 weeks, and we will keep you informed of the progress of our investigation. We will not take any legal action against individuals who report security vulnerabilities to us in good faith and in accordance with this policy, even if their actions inadvertently cause some disruption to our systems or services. We may update this policy from time to time. Any changes will be posted on our website, and we encourage you to review this policy periodically. If you have any questions about this policy or the vulnerability reporting process, please contact us at security(at)tado.com."
