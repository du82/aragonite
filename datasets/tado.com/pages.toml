full_description = "It couldn't be simpler: this is for those who want to conveniently experience increased comfort at home without worrying about their energy consumption. With tado°, you only use as much energy as you need: that’s all thanks to smart pre-heating and temperatures set during your absence. This feature reminds you to optimise your heating or air conditioning settings. Got a window open with the heating on? Integrated sensors recognise when the room temperature or humidity changes due to an open window and they remind you to switch off your heating or air conditioning. In any room, on any day, at any time: create Smart Schedules to enjoy your perfect temperature. Even when you're offline, tado° sticks to your schedules. With the tado° app, you can control the climate of your home, keep an eye on your energy consumption and watch your savings stack up. Save more across more rooms: with the tado° app, you can individually control the temperature in each room. Because not every room needs to be the same temperature. So smart: the tado° app informs you about the air quality and humidity in your home and gives you tips on how to optimise the air conditioning in your rooms. Switch off the heating in all your rooms or heat them up quickly with a single click: you can conveniently control multiple functions from the home screen of the tado° app using a short command. With the Auto-Assist upgrade, Energy IQ gives you an overview of your energy costs at all times – even offering comparisons with previous months. Auto-Assist informs you if your heating system behaves irregularly and helps you to solve the problem. In addition, Geofencing and Open Window Detection are automated and adjust the temperature of your home without intervention (€3.99/month, €29.99/year)."
