["https://tado.com/en/about/how-tado-works"]
title = "Smart Heating and Comfort for Every Home | tado˚"
description = "Embrace cozy living with tado˚'s smart heating solutions. Enjoy effortless setup, intuitive control, and energy-saving features for ultimate comfort."
full_description = "Easy to set up, easy to operate, easy to rely on: tado° offers everything you need to make your heating system sustainable without forcing you to compromise on convenience. Get ready for smart features and services: with Geofencing, Open Window Detection, Multi-Room Control, and Smart Schedules that you can rely on even when you're not connected to the internet. With tado° Geofencing, you get to decide whether and how you want to preheat your home before you get back and what you want the temperature to be when you're not there. Sensors for detecting open windows are already integrated within tado° Smart Thermostats. Using the tado° app, you get to determine how long the heating will stay off while you're airing your home. Get total transparency about your energy consumption and costs, including monthly comparisons, as well as information about irregular behaviour and breakdowns within your heating system. For added convenience, Geofencing and Open Window Detection work automatically. Subscribe through the app. tado° supports the latest smart home standard. Matter is a universal smart home standard that is supported by many of the biggest brands. This means tado° X works perfectly with other devices in your smart home – including those by different manufacturers. You can install tado° Smart Thermostats yourself – regardless of which heating system you have. The app guides you every step of the way. You can even install it when you’re offline. You can seamlessly integrate tado° into smart home systems such as Amazon Alexa, Apple HomeKit and Google Assistant. Establish personal routines and control your heating using voice commands. tado° products are compatible with almost all heating systems and components. Future-proof Matter and Thread technologies ensure reliable communication between your smart home devices."
