["https://tado.com/en/energy/smart-energy-tariff"]
title = "Smart Energy Tariff | tado°"
description = "Get the most out of your dynamic tariff"
full_description = "Take full advantage of your hourly dynamic tariff and save even more money with our smart solutions for heat pumps and electric cars. Wholesale electricity prices change every hour. When lots of wind and solar energy flow into the grid, electricity becomes particularly green and cheap. Now you can benefit from that! Hourly dynamic electricity tariffs directly pass on fluctuating wholesale prices to you. By shifting your consumption to times when energy is cheap, you’ll cut costs and protect the planet. You’ll notice the difference, especially when using devices that consume a lot of electricity, such as electric cars, heat pumps, and air conditioners. For customers with tariffs like this (e.g. Octopus Agile), we offer a variety of smart solutions to get the most out of it. tado° allows you to automatically charge your car during the cheapest hours on your dynamic electricity tariff, saving you money on your electricity bill! Just let us know which times you need your car to be charged for and the Smart Charging app will do the rest. You don’t need any additional hardware: tado° Smart Charging is compatible with most electric cars. Just download the free app and connect it via your car’s user account (e.g. Tesla, Volkswagen, BMW, Audi, Mini, Skoda, Seat, and many more). The tado° Heat Pump Optimizer X allows your heat pump to connect to the internet, while Balance ensures that it runs efficiently by taking the outside air temperature into account. If you have a dynamic tariff, Balance is even more efficient and only lets your heat pump run when electricity prices are particularly low. To use Smart Charging, you need either a compatible car, a compatible charger, or a combination of the two. It’s easy to install the Heat Pump Optimizer X and you can do it without a professional by following the tado° in-app instructions. You can also de-install it without causing any damage to your heat pump. You don’t require additional tado° room control elements to run Balance for Heat Pumps. However, it will help you save even more energy and control your heat pump more efficiently if you use them."
year_published = 2025
