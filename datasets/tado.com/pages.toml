title = "Stay Comfortable, Room by Room | tado˚"
description = "Experience ultimate comfort in every corner of your home with tado˚ Multi-Room Control. Save energy, stay cozy, and enjoy personalized temperature settings."
full_description = "Save energy, save money, and stay comfortable everywhere. With tadoº you can control the temperature in every room, heating different parts of your home at different times to fit your lifestyle. Don’t waste energy and money heating rarely-used guest rooms. Just warm them up when someone comes to stay. Conventional heating systems heat whole homes. tadoº Multi-Room Control uses multiple Smart Thermostats to regulate temperatures in individual rooms. Measuring devices in each room ensure the optimum temperature, activating heating only when it is required. Anyone can save money and energy with Multi-Room Control. Ask yourself; do I often travel, do I use some rooms more than others, do different members of my household have different preferences for temperature, do I want to save money on my heating bills? If the answer is yes to any of these, you need Multi-Room Control. Use the tadoº app to control or set individual room temperatures. A simple slide bar in the app instantly instructs different Smart Radiator Thermostats to activate or deactivate to within 0.5º accuracy. Alternatively, use the app to set heating schedules for each room."
