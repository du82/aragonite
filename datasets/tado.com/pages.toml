full_description = "Home isn’t just a place where you live, it should be a place where you feel good. That's why tado° is all about effortlessly creating the perfect feel-good climate for you. It’s possible with the tado° app: you can set your heating based on your preferences and routines, allowing you to enjoy your perfect temperature in every room at every time. tado° knows when you’re not at home or when you’re approaching home. The app takes care of smart pre-heating and sets a temperature for your absence. So, that’s one less thing to think about. Adjust your home temperature on the go to suit your needs. It’s convenient with the app. This way you’ll avoid wasting energy. Like a warm bathroom in the morning? Prefer to sleep when it’s cool? Simply set Smart Schedules in the app and you don’t have to worry anymore. Even if the internet goes down, tado° will still stick to your plans. How comfortable you feel in a room depends on both the temperature and the humidity. The tado° app provides you with an overview of the room climate for each of your rooms – including tips for improvement, if necessary. Conveniently control the temperature in your home with your smart home system. Whether you use Apple HomeKit, Google Home or Alexa Smart Home - tado° is compatible. Discover the perfect product for your heating systemor find out more about how tado° not only makes youfeel more comfortable at home, but also saves you money."
