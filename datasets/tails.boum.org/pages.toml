title = "Tails - Come funziona Tails"
full_description = "Italiano English Català Deutsch Español Français Português Русский Improve translations Come funziona Tails Come funziona Tails Non lasciare tracce sul computer Puoi portare con te Tails e usarlo ovunque, come una tenda da campo. Il tuo computer sicuro, ovunque Per usare Tails, arresta il computer e avvialo sulla tua chiavetta USB Tails invece di avviarlo su Windows, macOS o Linux. Puoi temporaneamente trasformare il tuo computer in una macchina sicura. Puoi anche utilizzare in modo sicuro il computer di un'altra persona. Tails richiede ½ ora per l'installazione, dopo un download di 1.5 GB . Tails può essere installato su una qualsiasi chiavetta USB da almeno 8 GB. Tails funziona sulla maggior parte dei computer con meno di 10 anni. Puoi riavviare il computer sul precedente sistema operativo dopo aver spento Tails. Non devi preoccuparti dell'eventuale presenza di virus sul computer poiché Tails viene eseguito indipendentemente dall'altro sistema operativo e non utilizza mai il disco fisso. Tuttavia, Tails potrebbe non offrirti protezione se lo installi da un computer infettato da virus o se lo usi su un computer su cui siano presenti componenti hardware malevoli, come un keylogger. Vedere anche: Attenzione: Tails è sicuro ma non è magico! Scaricare e installare Tails Requisiti di sistema e hardware consigliato Come una tenda da campo, Tails è amnesico: è sempre vuoto all'inizio e non lascia tracce quando te ne vai. Amnesia A ogni avvio Tails si presenta libero da qualsiasi dato gestito in precedenza e tutte le attività che svolgi svaniscono automaticamente quando arresti Tails. Senza Tails, quasi tutto ciò che fai può lasciare tracce sul computer: I siti web che hai visitato, anche in modalità anonima I file che hai aperto, anche se poi li hai eliminati Le tue password, anche se usi un gestore di password Tutti i dispositivi e le reti Wi-Fi che hai usato Tails, invece, non scrive mai nulla sul disco fisso e viene eseguito esclusivamente dalla memoria del computer. La memoria viene interamente cancellata quando arresti Tails, eliminando ogni possibile traccia. Come in uno zaino, puoi conservare i tuoi effetti personali nel tuo volume persistente e usarli nella tua tenda. Archivio Persistente Puoi salvare alcuni dei tuoi file e delle tue configurazioni in un volume persistente cifrato sulla chiavetta USB: i tuoi documenti, i segnalibri del browser, le tue email, e anche dei programmi aggiuntivi. Il volume persistente è opzionale e potrai sempre decidere cosa rendere persistente. Tutto il resto è amnesico. Vedere anche: Usare l'Archivio persistente Installare programmi aggiuntivi Attrezzatura per la sicurezza digitale Tails include una selezione di applicazioni per lavorare su documenti sensibili e per comunicare in maniera sicura. Tutte le applicazioni sono pronte per l'uso e sono preconfigurate con impostazioni sicure, in modo da impedire errori. Tails include: Tor Browser con uBlock, un browser sicuro e un'estensione per il blocco della pubblicità Thunderbird, per gestire email cifrate KeePassXC, per creare e conservare password robuste LibreOffice, una suite di applicazioni da ufficio OnionShare, per condividere file, siti web e chat attraverso Tor Metadata Cleaner, per rimuovere i metadata dai file e molte altre applicazioni ancora! Per impedire errori: Le applicazioni vengono automaticamente bloccate se tentano di connettersi a Internet senza utilizzare Tor. Tutto ciò che si trova nell'Archivio Persistente viene cifrato automaticamente. Tails non scrive nulla sul disco fisso. L'intera memoria viene cancellata all'arresto. Vedere anche: Funzionalità e programmi inclusi Documentazione Non lasciare traccia su Internet Tor per qualsiasi cosa Ogni cosa che fai su Internet con Tails passa attraverso la rete Tor. Tor cifra e rende anonima la tua connessione facendola passare attraverso 3 relay. I relay sono server mantenuti da diverse persone e organizzazioni in tutto il mondo. Un singolo relay non può mai sapere contemporaneamente da dove viene e dove è diretta la connessione cifrata: Il 1° relay sa solo da dove vieni, ma non dove stai andando. Il 3° relay sa solo dove stai andando, ma non da dove vieni. La connessione alla destinazione finale viene criptata quando possibile, per impedire al terzo relay di leggerne il contenuto. In questo modo, Tor è sicuro per natura anche in caso ci siano alcuni relay malevoli. La rete Tor ha più di 6 000 relay. Tra le organizzazioni che mantengono relay Tor ci sono università come il MIT, gruppi di attivismo come Riseup, associazioni non-profit come Derechos Digitales, società di Internet hosting come Private Internet Access, e così via. L'enorme diversità tra le persone e le organizzazioni che mantengono relay Tor rende la rete Tor più sicura e più sostenibile. Vedere anche: Connettersi alla rete Tor Perché Tails utilizza Tor? Evitare la sorveglianza online e la censura Tor impedisce a chi sta osservando la tua connessione Internet di capire cosa stai facendo su Internet. Puoi evitare la censura perché è impossibile per chi censura sapere quali siti web stai visitando. Se la connessione a Tor è bloccata oppure è pericoloso usarla da dove ti trovi, per esempio in alcune regioni con forte censura, puoi utilizzare dei bridge per nascondere che ti stai connettendo al network di Tor. Evitare il tracciamento geografico e cambiare identità Inoltre, Tor impedisce ai siti web che stai visitando di sapere dove e chi tu sia, a meno che non sia tu a comunicarlo a loro. Puoi visitare siti web in modo anonimo o cambiare la tua identità. Gli strumenti di tracciamento e di profilazione pubblicitaria online non saranno più in grado di seguire i tuoi spostamenti da un sito web all'altro. Puoi pubblicare un blog o gestire un account su un social media esclusivamente via Tails. Se le esegui solo con Tails, queste attività non potranno essere ricondotte a te. Puoi conservare nel tuo volume persistente documenti e immagini relative a questa tua diversa identità, mantenere le relative password in KeePassXC, avere un account di posta elettronica dedicato in Thunderbird, ecc. Software per la libertà Trasparenza per creare fiducia Tutto il codice del nostro software è pubblico, in modo da permettere a ricercatori in sicurezza informatica indipendenti da noi di verificare che Tails funzioni veramente come dovrebbe. Vedere anche: Fidarsi di Tails Licenza e distribuzione del codice sorgente Documenti di progettazione Il massimo della sicurezza, gratuitamente Nessuna persona dovrebbe essere obbligata a pagare per poter usare un computer in maniera sicura. Ecco perché distribuiamo Tails gratuitamente e cerchiamo di renderne facile l'uso a chiunque. Tails is made by the Tor Project, a global nonprofit developing tools for online privacy and anonymity. Our work is funded by donations from people like you and organizations that support Internet freedom: Mozilla, DuckDuckGo, Open Tech Fund, Craig Newmark Philanthropies, etc. Vedere anche: Dona Sostenitori Social contract Condividere per essere più forti Tails è costruito su solide fondamenta: la rete Tor, il sistema operativo Debian, l'ambiente desktop GNOME, e tutti gli strumenti inclusi in Tails. We share back our improvements so that many more people can benefit from our work. Vedere anche: Relationship with upstream Contribuire The Tor Project Debian GNU/Linux GNOME Contatti Installa Tails"
