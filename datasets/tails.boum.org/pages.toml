["https://tails.boum.org/about/contact/index.en.html"]
title = "Tails - Contact"
full_description = "English Català Deutsch Español Français Italiano Português Русский Improve translations about Contact Contact There are many ways to contact us, depending on what you want to talk about. All mailing lists are in English unless specified otherwise. Public mailing lists amnesia-news tails-dev tails-testers tails-l10n Private email addresses support press fundraising sysadmins Tails Team weblate board security Chat rooms Public mailing lists These mailing lists are public: subscription is open to anyone. Don't send compromising information. Please respect the Tor Project Code of Conduct. amnesia-news amnesia-news@boum.org is the mailing list where we send our news by email. It has a low traffic and it is the right place to stay up-to-date with the releases and security announcements. Public archive of amnesia-news: https://lists.autistici.org/list/amnesia-news.html tails-dev tails-dev@boum.org is the mailing list where the project is coordinated: technical design questions, upcoming events, monthly reports, and user experience. Public archive of tails-dev: https://lists.autistici.org/list/tails-dev.html tails-testers tails-testers@boum.org is the mailing list for people who want to help test new releases or features. Public archive of tails-testers: https://lists.autistici.org/list/tails-testers.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Private email addresses support You can write encrypted emails to support@tails.net if you need help in private. OpenPGP key (details) press If you are a journalist and want to write about Tails, or if you want to send us links to press articles about Tails, write to press@tails.net. OpenPGP key (details) fundraising If you want to contact our fundraising team, write to fundraising@tails.net. OpenPGP key (details) sysadmins To talk about our infrastructure (servers, test suite, repositories, mirrors, etc.), write to sysadmins@tails.net. OpenPGP key (details) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. OpenPGP key (details) weblate To talk about the Tails translation platform, write to weblate@tails.net. OpenPGP key (details) board You can write to the Board at board@tails.net. OpenPGP key (details) security For vulnerabilities disclosures, email security@torproject.org. OpenPGP key Chat rooms You can join our users chat room and developers chat room. Only a few Tails developers hang out there, so email is preferred for anything that might be of interest for the larger community."
