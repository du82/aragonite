["https://tails.boum.org/about/index.ru.html"]
title = "Tails - How Tails works"
full_description = "Русский English Català Deutsch Español Français Italiano Português Improve translations How Tails works How Tails works Не оставляйте следов на компьютере Tails – как палатка: можно носить с собой и пользоваться где угодно. Ваш личный безопасный компьютер повсюду с вами Как начать работу с Tails? Перезагрузите компьютер, но не с Windows, macOS или Linux, а с флешки Tails. Вы можете на время сделать из вашего компьютера безопасную систему или безопасно работать на чужом компьютере. Tails is a 1.5 GB download and takes ½ hour to install. Tails can be installed on any USB stick of 8 GB minimum. Tails works on most computers less than 10 years old. You can start again on the other operating system after you shut down Tails. Не переживайте насчёт вирусов. Tails работает независимо от основной операционной системы и не использует жёсткий диск. Но если вы сделали флешку с Tails на заражённом компьютере или у вас в системе аппаратный «жучок» (например, кейлоггер), Tails не поможет. Смотрите также: Внимание: Tails безопасен, но не всемогущ! Скачать и установить Tails System requirements and recommended hardware Сначала палатка всегда пустая. Если свернуть её и уйти, следов не останется. Tails тоже ничего не запоминает. Мы не запоминаем данные Tails всегда начинает «с нуля». После окончания работы в Tails все следы работы автоматически исчезают. Без Tails почти каждое действие оставляет следы на компьютере: посещённые сайты (даже в приватном режиме); открытые файлы, даже если вы потом удалили их; пароли, даже если вы пользуетесь менеджером паролей; все использованные вами устройства и сети wi-fi. Tails никогда ничего не записывает на жёсткий диск и работает лишь с оперативной памятью компьютера. При выключении Tails все следы вашей работы стираются. Tails – как рюкзак. Можно хранить всё личное в защищённом месте, а потом использовать в палатке. Persistent Storage Вы можете сохранить файлы и настройки в зашифрованном разделе своей флешки. Например, документы, закладки браузера, почту и даже некоторые программы. Это необязательная опция. Вы сами решаете, что запомнить. Остальное будет забыто. Смотрите также: Persistent Storage Installing additional software Инструменты цифровой безопасности Tails включает приложения для работы с конфиденциальными документами и для безопасных коммуникаций. Все приложения готовы к работе и настроены так, чтобы предотвращать ошибки. Tails включает: Tor Browser (защищённый браузер) с модулем uBlock (блокировщик рекламы); Thunderbird для зашифрованной почты; KeePassXC для создания и хранения надёжных паролей; LibreOffice, офисный пакет; OnionShare, to share files, websites, and chat rooms over Tor Metadata Cleaner, to remove metadata from files многое другое! Для предотвращения ошибок: все приложения, которые пытаются подключиться к Интернету без Tor, блокируются; все данные в защищённом хранилище автоматически шифруются; Tails ничего не записывает на жёсткий диск; при выключении вся память очищается. Смотрите также: Особенности системы и дополнительные программы Документация Не оставляйте следов в Интернете Tor В Tails весь трафик идёт через сеть Tor, которая обеспечивает шифрование и анонимность. Ваши данные проходят через три узла. Так называются серверы, которые разные люди и организации поддерживают по всему миру. Ни один узел не знает одновременно источник и адресата сообщения. Первый узел знает, откуда вы пришли, но не куда направляетесь. Третий узел знает место назначения, но не откуда вы пришли. Соединение с конечным сайтом по возможности шифруется, чтобы третий узел не видел содержимое запроса. Tor защищает коммуникации, даже если владельцы каких-то узлов имеют недобрые намерения. The Tor network has more than 6 000 relays. Organizations running Tor relays include universities like the MIT, activist groups like Riseup, nonprofits like Derechos Digitales, Internet hosting companies like Private Internet Access, and so on. The huge diversity of people and organizations running Tor relays makes it more secure and more sustainable. Смотрите также: Подключение к сети Tor Почему Tails использует Tor? Избавьтесь от онлайн-слежки и цензуры Если кто-то следит за вашими действиями в сети, Tor скроет от него, что именно вы делаете в Интернете. Цензура больше не страшна. Цензор не может узнать, какие сайты вы посещаете. Если соединение с сетью Tor заблокировано или использовать Tor рискованно, можно воспользоваться мостами, чтобы скрыть факт подключения к Tor. Жизнь без трекеров и с новой личностью Иногда посещаемые сайты без вашего согласия пытаются установить, кто вы и откуда. Tor не даёт им это сделать. Вы можете заходить на сайты анонимно и в любой момент «сменить личность». Онлайн-трекеры и реклама больше не смогут отследить вас при переходе с одного сайта на другой. Работая в Tails, можно вести блог и управлять своим аккаунтом в социальной сети. Если вы будете входить только через Tails, аккаунт будет нельзя соотнести с вами. Фактически, у вас появится новая личность. Вы можете хранить связанные с ней изображения и документы в защищённом хранилище, пароли – в KeePassXC, с почтой работать через Thunderbird, и так далее. Свободные программы Доверие, основанное на прозрачности Исходный код наших программ есть в открытом доступе. Независимые эксперты по безопасности могут убедиться, что Tails действительно работает так, как должен. Смотрите также: Доверие Tails Лицензия и распространение исходного кода Документы по дизайну Максимальная безопасность — бесплатно Никто не должен платить за безопасность, работая на компьютере. Поэтому мы распространяем Tails бесплатно и стараемся сделать его простым в использовании. Tails is made by the Tor Project, a global nonprofit developing tools for online privacy and anonymity. Our work is funded by donations from people like you and organizations that support Internet freedom: Mozilla, DuckDuckGo, Open Tech Fund, Craig Newmark Philanthropies, etc. Смотрите также: Поддержать Tails Спонсоры Social contract Когда мы делимся, то становимся сильнее У Tails прочный фундамент: сеть Tor, операционная система Debian, пространство рабочего стола GNOME и другие инструменты. We share back our improvements so that many more people can benefit from our work. Смотрите также: Взаимоотношения с разработчиками Сделайте свой вклад в Tails Tor Project Debian GNU/Linux GNOME Контакты Install Tails"
