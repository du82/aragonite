["https://tails.boum.org/index.de.html"]
title = "Tails - Startseite"
full_description = '''Deutsch English Català Español Français Italiano Português Русский Improve translations Startseite Startseite document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails ist ein tragbares Betriebssystem das Sie schützt gegen Überwachung und Zensur. Überwachung, Zensur, Werbung und Viren meiden Tails nutzt das Tor-Netzwerk, um Ihre Online-Privatsphäre zu schützen und um Ihnen zu helfen, Zensur zu umgehen. Nutzen Sie das Internet, wie es sein sollte. Ihr sicherer Computer, überall Fahren Sie den Computer herunter und booten Sie mit Ihrem Tails-USB-Stick anstatt mit Windows, macOS oder Linux. Tails hinterlässt keine Spuren auf dem Computer, wenn es heruntergefahren wird. Werkzeugkasten für digitale Sicherheit Tails hat eine Auswahl an Programmen an Bord, mit denen Sie an sensiblen Daten arbeiten und sicher kommunizieren können. Alles in Tails ist startklar und kommt mit sicheren Voreinstellungen. Freie Software Sie können Tails gratis herunterladen und es ist offen für Untersuchungen durch unabhängige Experten für Computersicherheit. Tails basiert auf Debian GNU/Linux. Wie Tails funktioniert Tails installieren Wer Tails benutzt Aktivisten und Aktivistinnen nutzen Tails, um ihre Identität zu verbergen, Zensur zu umgehen und sicher kommunizieren zu können. Journalisten und Journalistinnenund ihre Quellen benutzen Tails, um sensible Informationen zu publizieren und um von unsicheren Orten aus das Internet zu benutzen. Betroffene von häuslicher Gewalt nutzen Tails, um ihrer Überwachung zu Hause auszuweichen. Sie - wann immer Sie mehr Privatsphäre in der digitalen Welt brauchen. Empfohlen von Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. Wenn Sie sich ansehen, wie Whistleblower nach 2013 enttarnt wurden, wird klar, dass das absolut Wichtigste zur Wahrung Ihrer Anonymität ist, die Anzahl möglicher Fehlerquellen bei Ihren operativen Aktivitäten zu reduzieren. Tor und Tails tun genau das - nach wie vor. — Edward Snowden, NSA Whistleblower Eine der sichersten Arten, das Tor-Netzwerk zu nutzen, ist im Rahmen eines dedizierten Betriebssystems, das von vornherein strikt auf Privatsphäre und Sicherheit eingestellt ist. Dieses Betriebssystem ist Tails. — EFF, Electronic Frontier Foundation Sponsoren Unsere Arbeit wird unterstützt durch Spenden von Menschen wie Ihnen und von Organisationen, die die Freiheit im Internet unterstützen. Lernen Sie unsere Sponsoren kennen.'''
year_published = 2025
