["https://tails.boum.org/index.pt.html"]
title = "Tails - Home"
full_description = '''Português English Català Deutsch Español Français Italiano Русский Improve translations Home Home document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails é um sistema operacional portátil que te protege de vigilância e censura. Evite vigilância, censura, propagandas e vírus Tails usa a rede Tor para proteger sua privacidade online e te ajudar a evitar censura. Desfrute a Internet da forma como ela deveria ser. Seu computador seguro em qualquer lugar Desligue o computador e inicie no seu pendrive USB com Tails ao invés de iniciar no Windows, macOS ou Linux. Tails não deixa rastros no seu computador depois de desligado. Uma caixa de ferramentas para segurança digital Tails inclui uma seleção de aplicativos para trabalhar com documentos sensíveis e se comunicar de forma segura. Todos os programas no Tails estão prontos para o uso e possuem configurações seguras por padrão. Software Livre Você pode baixar Tails gratuitamente e pesquisadores independentes da área de segurança podem verificar o nosso trabalho. Tails é baseado em Debian GNU/Linux. Como Tails funciona Instale Tails Quem usa Tails Ativistas usam Tails para preservar suas identidades, evitar censura e se comunicar de forma segura. Jornalistase suas fontes usam Tails para publicar informações sensíveis e acessar a Internet a partir de locais inseguros. Sobreviventes de violência doméstica usam Tails para escapar da vigilância em casa. Você toda vez que precisa de mais privacidade neste mundo digital. Recomendado por Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. Se você olhar para as formas como denunciantes passaram a ser descobertos a partir de 2013, fica claro que a coisa mais absolutamente importante que você pode fazer para manter sua anonimidade é reduzir o número de situações na sua atividade operacional nas quais seja possível que você cometa erros. Tor e Tails continuam fazendo precisamente isso. — Edward Snowden, Denunciante da NSA Uma das formas mais robustas de usar a rede Tor é através de um sistema operacional dedicado que garanta a utilização de fortes padrões preventivos de segurança e privacidade. Tal sistema operacional é o Tails. — EFF, Electronic Frontier Foundation Patrocinadores Nosso trabalho é financiado por doações de pessoas como você e organizações que apoiam a liberdade na internet. Conheça nossos patrocinadores.'''
