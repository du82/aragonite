["https://tails.boum.org/index.fr.html"]
title = "Tails - Accueil"
full_description = '''Français English Català Deutsch Español Italiano Português Русский Improve translations Accueil Accueil document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails est un système d'exploitation portable qui protège contre la surveillance et la censure. Évitez la surveillance, la censure, la publicité et les virus Tails utilise le réseau Tor pour protéger votre vie privée en ligne et vous aider à contourner la censure. Profitez d'Internet tel qu'il devrait être. Votre ordinateur sécurisé, partout avec vous Éteignez votre ordinateur et démarrez-le sur votre clé USB Tails à la place de Windows, macOS ou Linux. Après extinction, aucune trace de Tails ne reste sur l'ordinateur. Boite à outils numérique Tails est fourni avec une sélection d'applications permettant de travailler sur des documents sensibles et de communiquer en sécurité. Dans Tails, tout est prêt à l'emploi et les paramètres par défaut sont sûrs. Logiciel libre Vous pouvez télécharger Tails gratuitement et des chercheurs et chercheuses indépendant·e·s en sécurité peuvent vérifier notre travail. Tails est basé sur Debian GNU/Linux. Fonctionnement de Tails Installer Tails Qui utilise Tails Des activistes utilisent Tails afin de cacher leurs identités, contourner la censure et communiquer en sécurité. Des journalisteset leurs sources utilisent Tails pour publier des informations sensibles et accéder à Internet depuis des endroits peu sûrs. Des survivant·e·s de violences domestiques utilisent Tails pour échapper à la surveillance à la maison. Vous à partir du moment où vous avez besoin de plus d'intimité dans ce monde numérique. Recommandé par Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. Si vous regardez la façon dont les lanceurs et lanceuses d'alertes ont été attrapé·e·s après 2013, il est clair que la chose la plus importante que vous pouvez faire pour maintenir votre anonymat est de réduire le nombre d'endroits où vous pouvez faire des erreurs dans votre activité opérationnelle. Tor et Tails font toujours précisément cela. — Edward Snowden, lanceur d'alerte de la NSA Une des façons les plus robustes d'utiliser le réseau Tor se fait via un système d'exploitation dédié, qui impose une confidentialité forte et des options de sécurité protectrices par défaut. Ce système d'exploitation est Tails. — EFF, Electronic Frontier Foundation Sponsors Notre travail est financé par les dons de personnes comme vous et par des organisations qui soutiennent la liberté sur Internet. Découvrez nos sponsors.'''
