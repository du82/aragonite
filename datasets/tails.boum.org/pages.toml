["https://tails.boum.org/about/index.pt.html"]
title = "Tails - Como Tails funciona"
full_description = "Português English Català Deutsch Español Français Italiano Русский Improve translations Como Tails funciona Como Tails funciona Não deixa rastros no computador Como se fosse uma barraca, você pode carregar Tails por aí e usar em qualquer lugar. Seu computador seguro em qualquer lugar Para usar Tails, reinicie o computador a partir de um pendrive USB com Tails instalado ao invés de iniciar no Windows, macOS ou Linux. Você pode temporariamente transformar seu computador em uma máquina segura. Você também pode ficar em segurança ao usar um computador de outra pessoa. Tails é um download de 1.5 GB e leva ½ hora para instalar. Tails pode ser instalado em qualquer pendrive USB com no mínimo 8 GB. Tails funciona na maioria dos computadores com menos de 10 anos de idade. Você pode iniciar novamente no outro sistema operacional depois de desligar o Tails. Você não precisa se preocupar caso o computador tenha vírus, porque Tails é executado independentemente do outro sistema operacional e nunca usa o disco rígido. Apesar disso, Tails pode não te proteger efetivamente caso você o tenha instalado a partir de um computador com vírus ou caso você o utilize em um computador com hardware malicioso instalado, como por exemplo keyloggers. Veja também: Atenção: Tails é seguro mas não faz mágica! Baixe e instale Tails Requisitos de sistema e hardware recomendado Como se fosse uma barraca, Tails é amnésico: no começo está sempre vazio e não deixa rastros depois do uso. Amnésia Tails sempre inicializa num mesmo estado limpo e tudo o que você fizer durante uma sessão de uso desaparecerá automaticamente quando Tails for desligado. Sem Tails, quase tudo o que você faz pode deixar rastros no computador, tais como: Os websites que você visitou, mesmo que no modo privado Os arquivos você abriu, mesmo que você os tenha apagado Senhas, mesmo que você tenha usado um gerenciador de senhas Todos os dispositivos e redes Wi-Fi que você usou Tails, pelo contrário, nunca grava nada no disco rígido e roda somente a partir da memória do computador. A memória é totalmente apagada quando você desliga o Tails, eliminando quaisquer possíveis rastros. Como se fosse uma mochila, você pode guardar seus itens pessoais num Armazenamento Persistente e usá-los na sua barraca. Armazenamento Persistente Você pode salvar alguns dos seus arquivos e configurações num Armazenamento Persistente criptografado no pendrive USB: seus documentos, favoritos do navegador, emails, e até alguns programas adicionais. O Armazenamento Persistente é opcional e é você quem decide o que é persistente. Todo os resto é amnésico. Veja também: Armazenamento Persistente Instalando programas adicionais Uma caixa de ferramentas para segurança digital Tails inclui uma seleção de aplicativos para que você possa trabalhar com documentos sensíveis e se comunicar de forma segura. Todos os aplicativos estão prontos para serem usados, e vêm com configurações seguras por padrão para prevenir erros. Tails inclui: Navegador Tor com uBlock, um navegador seguro e um bloqueador de anúncios Thunderbird, para e-mails criptografados KeePassXC, para criar e armazenar senhas fortes LibreOffice, um conjunto de ferramentas para escritório OnionShare, para compartilhar arquivos, websites e salas de chat através da rede Tor Metadata Cleaner, para remover metadados de arquivos e muito mais! Para prevenir erros: As aplicações são automaticamente bloqueadas caso tentem conectar à Internet sem usar a rede Tor. Todos os dados no Armazenamento Persistente são automaticamente criptografados. Tails não grava nada no disco rígido. Toda a memória é apagada ao desligar. Veja também: Funcionalidades e programas inclusos Documentação Não deixa rastros na Internet Tor para tudo Tudo o que você faz na Internet usando Tails passa pela rede Tor. Tor criptografa e anonimiza sua conexão fazendo-a passar por 3 retransmissores. Retransmissores são servidores operados por diferentes pessoas e organizações ao redor do mundo. Um único retransmissor nunca sabe ao mesmo tempo de onde a conexão criptografada vem e para onde ela vai: O primeiro retransmissor sabe apenas de onde você vem, mas não para onde você vai. O terceiro retransmissor sabe apenas para onde você vai, mas não de onde veio. A conexão com o destino final é criptografada sempre que possível para evitar que o terceiro relay leia seu conteúdo. Desta forma, o Tor é projetado para ser seguro mesmo que alguns retransmissores sejam maliciosos. A rede Tor possui mais de 6.000 relays. Organizações que rodam relays Tor incluem universidades como o MIT, grupos de ativistas como Riseup, organizações sem fins lucrativos como Derechos Digitales, empresas de hospedagem de internet como Private Internet Access, e assim por diante. A imensa diversidade de pessoas e organizações que rodam relays Tor tornam a rede mais segura e mais sustentável. Veja também: Conectando à rede Tor Por que o Tails usa Tor? Evite vigilância e censura online Tor evita que alguém que esteja observando sua conexão de Internet descubra o que você está fazendo na Internet. Você consegue evitar censura porque é impossível para um agente censor saber quais websites você está visitando. Se houve bloqueios para conectar à rede Tor ou se for arriscado usá-la no lugar onde você estiver, como por exemplo em países com censura pesada, é possível usar pontes para ocultar o fato de que você está conectando à rede Tor. Evite rastreamento e mude de identidade Tor também evita que os websites que você visita descubram onde você está e quem é você, a não ser que você diga para eles. É possível visitar websites de forma anônima ou mudar sua identidade. Rastreadores online e anunciantes não conseguirão mais te seguir de um website para o outro. Você pode publicar em um blog ou administrar uma conta de rede social inteiramente a partir do Tails. Se você sempre acessar essas contas usando Tails, não será possível relacioná-las a você. É possível guardar no seu Armazenamento Persistente imagens e documentos relacionados a esta identidade distinta, guardar suas senhas no KeePassXC, ter uma conta de email dedicada no Thunderbird, etc. Software para liberdade Transparência para criar confiança Todo o código do nosso software é público afim de permitir que pesquisadores independentes da área de segurança verifiquem que o Tails realmente funciona da forma esperada. Veja também: Confiando no Tails Licenciamento e distribuição do código-fonte Documentos de projeto Segurança máxima de graça Ninguém deveria ter que pagar para ter segurança ao usar um computador. É por isso que distribuímos Tails de graça e tentamos fazer com que seja fácil de usar por qualquer pessoa. Tails é mantido pelo Projeto Tor, uma entidade global sem fins lucrativos que desenvolve ferramentas para privacidade online e anonimidade. Nosso trabalho é financiado por doações de pessoas como você e por organizações que apoiam a liberdade na Internet: Mozilla, DuckDuckGo, Open Tech Fund, Graig Newmark Philanthropies, etc. Veja também: Faça uma doação Patrocinadores Contrato social Compartilhando nos tornarmos mais fortes Tails é construído sobre fundações sólidas: a rede Tor, o sistema operacional Debian, o ambiente de trabalho GNOME, e todas as ferramentas que vêm inclusas no Tails. Nós compartilhamos as melhorias que desenvolvemos para que muito mais pessoas possam se beneficiar do nosso trabalho. Veja também: Relação com upstream Contribua O Projeto Tor Debian GNU/Linux GNOME Contato Instale Tails"
