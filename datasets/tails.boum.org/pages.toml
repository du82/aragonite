["https://tails.boum.org/contribute/mission"]
title = "Tails - Our mission and values"
full_description = "contribute Our mission and values Our mission and values Our mission is to empower people worldwide by giving out an operating system that protects against surveillance and censorship. We make digital security tools accessible to everyone, whenever they need it: activists, journalists, freedom fighters, domestic violence survivors, and ultimately, you, whenever you need extra privacy in this digital world. Tails is… Empowering We build liberating technology to put people in control of their digital lives. We make it simple for our users to make informed decisions depending on their situation. The most vulnerable and oppressed people are the most in need of privacy and security. Ecosystemic We cooperate with and give back to other projects as a way of building better and more sustainable software. Tails is interoperable with other tools and useful in diverse workflows. The privacy and security of digital communications is not an individual matter. Accessible We are a welcoming community dedicated to building usable tools for a diverse and global audience. We work hard to be helpful, understand our users, and educate them without being paternalistic. If a tool is hard to use, it is less secure. No bullshit We don't promise absolute security but we are reliable and trustworthy. We communicate about the limitations of our software in an instructive way, without being disorientating, patronizing, or overly cautious. Tails is safe but not magic. See also the Tails Social Contract, which is a set of commitments that Tails stands by. Our style When using Tails, people trade off bits of convenience for some extra security. They might have very little time, be under stress, or physical threats. We take the safety of our users very seriously and we speak to them in a confident and reassuring way without being lighthearted or frivolous. Our style inspires trust but doesn't sound distant. Even though we address serious issues, we are always empathetic and encouraging. To be accessible to our diverse and global audience, we value clarity and sincerity above all. We provide state-of-the-art tools without over-promising or sounding elitist. PlayfulSerious CautiousConfident For ExpertsFor Everybody ImpartialPolitical"
year_published = 2025
clearnet = "https://tails.boum.org/contribute/mission"
