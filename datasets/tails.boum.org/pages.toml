["https://tails.boum.org/about/contact/index.de.html"]
title = "Tails - Kontakt"
full_description = "Deutsch English Català Español Français Italiano Português Русский Improve translations about Kontakt Kontakt Es gibt zahlreiche Möglichkeiten, mit uns in Kontakt zu treten, je nachdem worüber Sie reden möchten. Alle Mailinglisten sind, sofern nicht anders angegeben, auf Englisch. Öffentliche Mailinglisten Amnesia-News tails-dev tails-testers tails-l10n Private E-Mail-Addressen support press fundraising sysadmins Tails Team weblate board security Chatraum Öffentliche Mailinglisten These mailing lists are public: subscription is open to anyone. Don't send compromising information. Please respect the Tor Project Code of Conduct. Amnesia-News amnesia-news@boum.org ist die Mailingliste, an die wir per E-Mail unsere Neuigkeiten senden. Es werden wenige E-Mails darüber verschickt und sie ist der richtige Ort, um mit den Versionen und Sicherheitsankündigungen auf dem neuesten Stand zu bleiben. Öffentliches Archiv von amnesia-news: https://lists.autistici.org/list/amnesia-news.html tails-dev tails-dev@boum.org ist die Mailingliste, auf der das Projekt koordiniert wird: technische Designfragen, bevorstehende Veranstaltungen, monatliche Berichte und Benutzererfahrung. Öffentliches Archiv von tails-dev: https://lists.autistici.org/list/tails-dev.html tails-testers tails-testers@boum.org ist die Mailingliste für Personen, die beim Testen neuer Versionen oder Funktionen helfen möchten. Öffentliches Archiv von tails-testers: https://lists.autistici.org/list/tails-testers.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Private E-Mail-Addressen support Wenn Sie vertrauliche Hilfe benötigen, können Sie verschlüsselte E-Mails an support@tails.net schreiben. OpenPGP-Schlüssel (Details) press Wenn Sie Journalist:in sind und einen Artikel über Tails verfassen möchten, oder Sie uns Links zu Zeitungsartikeln über Tails zukommen lassen möchten, schreiben Sie an press@tails.net. OpenPGP-Schlüssel (Details) fundraising Wenn Sie unser Fundraising-Team kontaktieren möchten, schreiben Sie an fundraising@tails.net. OpenPGP-Schlüssel (Details) sysadmins Um über unsere Infrastruktur (Server, Testsuite, Software-Archive, Spiegelserver, usw.) zu sprechen, schreiben Sie an sysadmins@tails.net. OpenPGP-Schlüssel (Details) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. OpenPGP-Schlüssel (Details) weblate Um über die Tails Übersetzungs-Plattform zu sprechen, schreiben Sie an weblate@tails.net. OpenPGP-Schlüssel (Details) board You can write to the Board at board@tails.net. OpenPGP-Schlüssel (Details) security For vulnerabilities disclosures, email security@torproject.org. OpenPGP key Chatraum Sie können unserem Chatroom für Benutzende und dem Chatroom für Entwickelnde beitreten. Nur ein paar der Entwickelnden von Tails befinden sich dort, deswegen ist E-Mail für alles, was für die größere Gemeinschaft von Interesse sein könnte, das Mittel der Wahl."
year_published = 2025
