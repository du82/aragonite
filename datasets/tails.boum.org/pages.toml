["https://tails.boum.org/index.it.html"]
title = "Tails - Home"
full_description = '''Italiano English Català Deutsch Español Français Português Русский Improve translations Home Home document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails è un sistema operativo portatile che protegge da sorveglianza e censura. Evita la sorveglianza, la censura, la pubblicità e i virus Tails usa la rete Tor per proteggere la tua privacy online e aiutarti a evitare la censura. Goditi Internet come dovrebbe essere. Il tuo computer sicuro, ovunque Spegni il computer e avvialo dalla tua chiavetta USB Tails al posto di Windows, macOS o Linux. Dopo l'arresto del sistema, sul computer non rimane traccia di Tails. Attrezzatura per la sicurezza digitale Tails include una selezione di applicazioni per lavorare su documenti sensibili e per comunicare senza rischi. In Tails, tutto è pronto per l'uso e le impostazioni predefinite sono sicure. Software libero Puoi scaricare Tails gratuitamente e le persone che svolgono ricerche indipendenti nel campo della sicurezza possono verificare il nostro lavoro. Tails è basato su Debian GNU/Linux. Come funziona Tails Installa Tails Chi utilizza Tails Attivisti usano Tails per nascondere le proprie identità, evitare la censura e comunicare in modo sicuro. Giornalistie loro fonti usano Tails per rendere pubbliche informazioni sensibili e accedere a Internet da luoghi poco sicuri. Reduci di violenze domestiche usano Tails per eludere la sorveglianza in casa propria. Tu ogniqualvolta tu abbia bisogno di maggiore privacy in questo mondo digitale. Raccomandato da Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. Se si guarda al modo in cui le persone che segnalano illeciti sono state catturate dopo il 2013, è chiaro che la cosa più importante che si possa fare per mantenere il proprio anonimato è ridurre il numero di luoghi dove si possono commettere errori nella propria attività operativa. Tor e Tails fanno precisamente questo, sempre. — Edward Snowden, segnalatore di illeciti commessi dalla NSA Uno dei modi più robusti di utilizzare la rete Tor è farlo mediante un sistema operativo dedicato che imponga in maniera predefinita solide impostazioni di protezione della privacy e della sicurezza. Questo sistema operativo è Tails. — EFF, Electronic Frontier Foundation Sostenitori Il nostro lavoro è finanziato dalle donazioni di persone come te e da organizzazioni che sostengono la libertà di Internet. Incontra i nostri sostenitori.'''
