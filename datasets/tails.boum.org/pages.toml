title = "Tails - Contact"
full_description = "Français English Català Deutsch Español Italiano Português Русский Improve translations about Contact Contact Il y a plusieurs manières de nous contacter, selon ce dont vous voulez parler. Toutes les listes de discussions par courrier électronique sont en anglais sauf indication contraire. Listes publiques de discussions par messagerie électronique amnesia-news tails-dev tails-testers tails-l10n Adresses de messagerie électronique privées support press fundraising sysadmins Tails Team weblate board security Salons de discussion Listes publiques de discussions par messagerie électronique These mailing lists are public: subscription is open to anyone. Don't send compromising information. Please respect the Tor Project Code of Conduct. amnesia-news amnesia-news@boum.org est la liste où nous envoyons les actualités de Tails par courrier électronique. Son trafic est faible et il s'agit de la bonne liste pour rester à jour des nouvelles versions et des annonces de sécurité. Archives publiques de la liste amnesia-news : https://lists.autistici.org/list/amnesia-news.fr.html tails-dev tails-dev@boum.org est la liste sur laquelle la coordination du projet se fait : conception technique, évènements à venir, rapports mensuels et expérience d'utilisation. Archives publiques de la liste tails-dev : https://lists.autistici.org/list/tails-dev.fr.html tails-testers tails-tester@boum.org est la liste pour les personnes voulant aider à tester les nouvelles versions et fonctionnalités. Archives publiques de la liste tails-testers : https://lists.autistici.org/list/tails-testers.fr.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Adresses de messagerie électronique privées support Vous pouvez envoyer des messages chiffrés à support@tails.net si vous avez besoin d'aide en privé. Clé OpenPGP (détails) press Si vous êtes journaliste et voulez écrire à propos de Tails, ou si voulez nous envoyer des liens d'articles de presse à propos de Tails, écrivez à press@tails.net. Clé OpenPGP (détails) fundraising Si vous voulez contacter notre équipe de collecte de fonds, écrivez à fundraising@tails.net. Clé OpenPGP (détails) sysadmins Pour parler de notre infrastructure (serveurs, tests, dépôts, miroirs, etc.), écrivez à sysadmins@tails.net. Clé OpenPGP (détails) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. Clé OpenPGP (détails) weblate Pour discuter de la plateforme de traduction de Tails, écrivez à weblate@tails.net. Clé OpenPGP (détails) board You can write to the Board at board@tails.net. Clé OpenPGP (détails) security Pour des rapports de vulnérabilités, envoyez un courrier électronique à security@torproject.org. Clé OpenPGP Salons de discussion Vous pouvez rejoindre notre salon de discussion pour utilisateurs et celui pour développeurs. Seuls quelques développeurs Tails s'y connectent, le courrier électronique est donc préférable pour tout ce qui pourrait intéresser la communauté plus largement."
