["https://tails.boum.org/doc/about/features/index.en.html"]
title = "Tails - Features and included software"
full_description = "English Català Deutsch Español Français Italiano Português Русский Improve translations doc about Features and included software Features and included software Included software Networking Desktop edition Encryption and privacy Additional software Additional features Multilingual support Tails is based on Debian 12 (Bookworm). Included software GNOME, an intuitive and attractive desktop environment (More...) Networking Tor with: stream isolation the Onion Circuits graphical frontend (More...) NetworkManager for easy network configuration (More...) Tor Browser (More...), a web browser based on Mozilla Firefox and modified to protect your anonymity with: NoScript, to have even more control over JavaScript uBlock Origin, to remove advertisements Pidgin preconfigured with OTR for Off-the-Record Messaging (More...) OnionShare for anonymous file sharing Thunderbird email client with support for OpenPGP and RSS and Atom news feeds (More...) Aircrack-ng for wireless network auditing Electrum, an easy-to-use bitcoin client (More...) Wget and curl Desktop edition LibreOffice (More...) GIMP and Inkscape to edit images (More...) GNOME Sound Recorder for recording sound Audacity for recording and editing sounds (More...) Document Scanner to scan documents Brasero to burn CD/DVDs Sound Juicer to rip audio CDs BookletImposer to convert linear PDF documents into booklets, and vice-versa Encryption and privacy Support for both LUKS and VeraCrypt encrypted volumes (like USB sticks) (More...) GnuPG, the GNU implementation of OpenPGP for email and data encyption and signing Kleopatra provides a graphical interface to manage and use GnuPG on text and files Thunderbird has an integrated OpenPGP feature for encrypted emails GNOME Screen Keyboard for accessibility and protection against hardware keyloggers (More...) Metadata Cleaner and mat2 to remove metadata from files (More...) KeePassXC password manager (More...) Tesseract OCR to convert images containing text into a text document FFmpeg to record and convert audio and video Additional software Additionally, you can install in Tails any other software available in Debian. To install additional software automatically when starting Tails, use the Additional Software feature of the Persistent Storage. Additional features Automatic mechanism to upgrade a USB stick to newer versions 64-bit PAE-enabled kernel with NX-bit and SMP support on hardware that supports it Some basic accessibility features Some application isolation with AppArmor To prevent cold boot attacks and various memory forensics, Tails erases most memory on shutdown and when the boot media is physically removed. Multilingual support When starting Tails, you can choose between a large number of languages, including Arabic, English, Farsi, French, German, Hindi, Indonesian, Italian, Portuguese, Russian, Simplified Chinese, Spanish, Turkish, and more. If you find an issue using one of these languages, please tell us about it. To make it easier to use Tails in your own language, you can help with translations."
