title = "Tails - Inicio"
full_description = '''Español English Català Deutsch Français Italiano Português Русский Improve translations Inicio Inicio document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails es un sistema operativo portátil que te protege de la vigilancia y la censura. Evita la vigilancia, la censura, la publicidad y los virus Tails usa la red Tor para proteger tu privacidad en línea y ayudarte a evitar la censura. Disfruta de Internet como debería ser. Tu computadora segura en cualquier lugar Apaga tu computadora e inicia en tu memoria USB con Tails en lugar de iniciarla con Windows, macOS o Linux. Tails no deja rastros en la computadora cuando la apagas. Caja de herramientas de seguridad digital Tails incluye una selección de aplicaciones para trabajar en documentos confidenciales y para comunicarse de forma segura. Todo en Tails está listo para usar y tiene una configuración segura por defecto. Software Libre Puedes descargar Tails de forma gratuita e investigadores de seguridad independientes pueden verificar nuestro trabajo. Tails está basado en Debian GNU/Linux. Cómo funciona Tails Instalar Tails Quién usa Tails Activistas usan Tails para ocultar sus identidades, evitar la censura y comunicarse de manera segura. Periodistasy sus fuentes usan Tails para publicar información confidencial y acceder a Internet desde lugares inseguros. Sobrevivientes de violencia domestica usan Tails para escapar de la vigilancia en casa. Tú cuando necesites privacidad adicional en este mundo digital. Recomendado por Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. Si observas la forma en que han sido atrapados los denunciantes posteriores a 2013, está claro que lo más importante que puedes hacer para mantener tu anonimato es reducir las posibilidades de cometer errores en tu actividad operativa. Tor y Tails hacen precisamente eso. — Edward Snowden, denunciante de la NSA Una de las formas más robustas de usar la red Tor es a través de un sistema operativo dedicado que imponga fuertes valores predeterminados de protección de la privacidad y la seguridad. Ese sistema operativo es Tails. — EFF, Electronic Frontier Foundation Patrocinadores Nuestro trabajo lo financia gente como tú y organizaciones que apoyan la libertad en Internet. Conoce a nuestros patrocinadores.'''
