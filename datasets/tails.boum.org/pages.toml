["https://tails.boum.org/contribute/design"]
title = "Tails - Design: specification and implementation"
full_description = '''contribute Design: specification and implementation Design: specification and implementation 1 Introduction 2 Privacy Enhancing Live Distribution Specification 2.1 Intent 2.1.1 Privacy on the Internet 2.1.2 Protection from data recovery after shutdown 2.1.3 Working on sensitive documents 2.1.4 Portability 2.1.5 Target user 2.1.6 Filling some empty room in the Tor distributions landscape 2.1.7 Summary 2.2 Threat model 2.2.1 The goal of the attacker 2.2.2 Capabilities, methods and other means of the attacker 2.3 Distribution 2.4 Operational requirements 2.4.1 Platform 2.4.2 Media 2.4.3 Virtual machines 2.5 Other considerations 2.5.1 Maintainability 2.5.2 Sustainability 2.5.3 Open-source transparency, easing peer review 2.5.4 Easy feedback 2.6 Implementation requirements 2.6.1 Kernel requirements 2.6.2 Network requirements 2.6.3 User interface and applications 2.6.4 Usability 2.7 The future 2.7.1 Memory recovery attacks 2.7.2 HTTP keepalive 2.7.3 Mounting of filesystems stored on removable devices 2.7.4 Miscellaneous 3 Implementation 3.0 Other Tails design documents 3.1 Download 3.2 Software 3.2.1 Core software 3.2.2 Other applications 3.3 Localization 3.3.1 Best supported (Tier-1) languages 3.3.2 Locales and spell checking 3.3.3 Input methods 3.4 Notification of security issues and new Tails releases 3.5 Feedback 3.6 Configuration 3.6.1 The Tor® software 3.6.2 IPv6 3.6.3 DNS 3.6.4 HTTP Proxy 3.6.5 SOCKS libraries 3.6.6 Network Filter 3.6.7 MAC address spoofing 3.6.8 Host system swap 3.6.9 Host system RAM 3.6.10 Host system disks and partitions 3.6.11 Filesystems stored on removable devices 3.6.12 Passwords 3.6.13 Tor Browser 3.6.14 Thunderbird 3.6.15 Pidgin 3.6.16 GnuPG 3.6.17 Persistent Storage 3.6.18 Installation on USB sticks and SD cards 3.6.19 Wireless devices handling 3.6.20 OpenSSH 3.6.21 Automatic upgrades 3.6.22 Panel applets and GNOME Shell extensions 3.6.23 DHCP hostname leaks 3.6.25 Application isolation 3.6.26 wget 3.6.27 APT 3.6.28 Electrum 3.6.29 Kernel hardening init_on_free=1 slab_nomerge slub_debug=FZ vsyscall=none mce=0 page_alloc.shuffle=1 kASLR kernel.kexec_load_disabled = 1 mds=full,nosmt randomize_kstack_offset=on net.core.bpf_jit_harden = 2 spec_store_bypass_disable=on 3.6.30 Time zone 3.7 Running Tails in virtual machines 3.7.1 Current support 3.7.2 Security concerns 3.7.3 Running Tails inside a Windows session 3.8 Build process and maintenance 3.8.1 Build tools 3.8.2 Testing process 3.8.3 Upgrades 3.9 Hardware support 3.10 Caveats 3.11 Fingerprint 5 Bibliography 1 Introduction In this document we present a specification of a Privacy Enhancing Live Distribution (PELD) as well as an actual implementation of it called Tails. By writing this document we intend to help third-parties do security analyses of any given PELD and specifically of Tails. We also wish to help establish best practices in the field of PELD design and implementation, and thus raise the baseline for all similar projects out there. This document is heavily based on preliminary work that was done as part of Incognito 2008.1-r1 Documentation. The Bibliography section has pointers to other inspiration and reference sources. 2 Privacy Enhancing Live Distribution Specification Note: the key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in RFC 2119. 2.1 Intent Let us introduce what the PELD goals are: the features provided by the PELD, the kind of user the PELD targets, and the (empty) room we think the PELD fills in the Tor distributions landscape. 2.1.1 Privacy on the Internet The Privacy Enhancing Live Distribution (or PELD for short) aims at providing a software solution providing the user with the technological means for using popular Internet technologies while maintaining their privacy, in particular with respect to anonymity. While there are different techniques and services providing that functionality, this specification will assume the usage of The Tor® Project's state-of-the-art anonymizing overlay network Tor. Due to its deep dependency on Tor, the PELD defers the same possible goals as Tor: The PELD does not try to conceal it is connected to the Tor network unless Tor bridge relays are used. The PELD is not secure against end-to-end attacks, such as end-to-end timing or intersection attacks. Moreover, the PELD is likely to be affected by any feasible attack against Tor; e.g. the PELD is not secure against some local attacks, such as confirmation attacks based on website fingerprinting: see Lexi and Dominik's Contemporary Profiling of Web Users conference at 27C3 for details. 2.1.2 Protection from data recovery after shutdown The PELD aims at protecting the user from post-mortem analysis of the equipment (notably storage media and memory) he or she runs the PELD on. It is impossible for such a system to determine which information is sensitive and which is not. Thus, the PELD MUST be amnesic by default: It is REQUIRED no trace is left on local storage devices unless the user explicitly asks for it: the PELD MUST take care not to use any filesystem or swap volume that might exist on the host machine hard drives. The usage of encrypted removable storage devices (such as USB sticks) SHOULD be encouraged. Volatile memory MUST be erased on shutdown to prevent memory recovery such as cold boot attack. Secure erasure of files and free disk space SHOULD be made easy. 2.1.3 Working on sensitive documents The PELD aims at providing a "safe" environment to produce and optionally publish sensitive documents. While the combination of anonymous access to the Internet and resistance against future equipment analysis does most of the job, some application-level attacks deserve special treatment: e.g. tools needed to inspect and cleanup metadata — such as EXIF data — in files SHOULD be available. 2.1.4 Portability The PELD MUST be self-contained and portable (literally, not necessarily with respect to code portability), and thus possible to run in as many computing environments as possible from the same single distribution. In addition, while the PELD's main objective indeed is to act as a traditional Live Distribution (i.e. a Live CD or Live USB) it SHOULD also be compatible with popular virtual machine technologies for users who simply want a sandboxed environment within their usual operating system. 2.1.5 Target user The PELD's target user is the average user in terms of computer literacy; he or she does not necessarily control fully the computer being used. Examples would be a public computer in a library, coffee shop, university or a residence. We assume that the target user does not want to do any configuration (at least with respect to security and anonymity) of the various applications and tools used themselves, either because of insufficient knowledge, lack of interest or other reasons. The PELD MUST provide strong anonymity with no need of advanced configuration whatsoever. It MUST be made as difficult as possible for the user to unknowingly compromise anonymity. 2.1.6 Filling some empty room in the Tor distributions landscape XXX: update The PELD is meant to be complementary to other Tor distributions. It has no such goal as replacing other existing tool that properly fulfills its use cases. The PELD fills an empty place alongside of other Tor distributions. Using the PELD certainly requires the user to change more of his or her habits than installing e.g. the Tor Browser Bundle. On the other hand, the PELD currently is the only tool that makes it feasible to use the Internet, and more generally computers, for certain activities in contexts where the user cannot afford the risks involved by other Tor distributions. On the online privacy side of things, the PELD is aimed at offering roughly the same protection level as e.g. the Tor Browser Bundle, but provides a full-blown Tor-ified operating system instead of a few selected and carefully configured applications; this e.g. allows to safely download and open files using external applications, as mentioned by the Torbutton warning popup when a user attempts such an operation outside the PELD. About protection from post-shutdown data recovery, thanks to its amnesic-by-default behavior, the PELD can aim at providing a level of protection only a fine-tuned Live operating system can offer. On the contrary Tor distributions that rely on an untrusted underlying operating system could hardly guarantee anything in this area, regardless of the amount of resources and cleverness that is spent to leave less traces on local storage: widespread operating systems and shipped Internet applications generally default to write all kinds of traces to local storage; Tor distributions that depend on such systems are therefore forced to adopt a blocklist approach to lessen the amount of traces left behind. Such an approach is known to be prone to human error, such as bug #7449 on Tor Project's Trac. widespread operating systems typically offer very few control knobs to userspace applications over their not-amnesic-by-default behavior, especially when run without any kind of administrator credentials. Tor distributions that depend on such systems generally have no choice but hope no undesired trace will be left e.g. in the system's swap file or partition. The PELD amnesic feature also allows the user to safely perform non-Internet activities, which is yet another distinctive trait compared to other Tor distributions. To sum up, one can be a Tor expert and carefully configure a non-amnesic system to be as much Tor-ified as the PELD, but he or she won't get the same post-mortem analysis protection. 2.1.7 Summary In short, the PELD aims at providing privacy on computers and on the Internet for anyone anywhere. 2.2 Threat model The goal of staying anonymous and keeping sensitive information protected stands in direct conflict with the goals of several entities "present" on the Internet. The following threat model is meant to describe the intentions and capabilities of such attackers. 2.2.1 The goal of the attacker The adversary may have one or more goals among the following ones. Identify or locate the user, track his or her activities on the Internet: information such as the User-Agent HTTP header, locale and especially IP address can all be used in various degrees to identify or locate the user, and to track his or her activities on the Internet. Eavesdrop on sensitive data: the Tor network only prevents the data from being traced (according to Tor's threat model) but does not protect it from eavesdropping. Data recovery after system shutdown: "normal" operating systems keep a lot of traces about their users' Internet activities (notably browser cache, cookies and history) on local storage media; similary, working on a sensitive document with a "normal" operating system is very likely to leave traces of this document. User's data can remain on the equipment even after the machine is shut down; be it stored in the filesystem or in the memories, both RAM and swap, which might as well retain data (for example encryption keys or passwords). The adversary may want to recover such information by analyzing the equipment that has been used. 2.2.2 Capabilities, methods and other means of the attacker The adversary may have capabilities needed to perform the following attacks. Eavesdropping and content injection: it is assumed that the adversary is non-global and has full control over the network traffic of some portion of the Internet (e.g. some Tor exit nodes, upstream routers of exit nodes, or the ISP that provides the Internet connection the user is sitting behind). The adversary is thus able to eavesdrop, modify, delete or delay parts or all of the user's traffic on the Internet. Bypass attacks: it is conceivable for attackers to mount attacks which bypass the proxy and DNS setup in the applications which could then be used to identify the user, either by injecting data or social engineering. Exploit software vulnerabilities: the attacker might be able to run arbitrary code by exploiting vulnerabilities present in any of the software packages installed. Application level attacks: the attacker can utilize certain applications' services and features to get identifying information. Examples are JavaScript and Java applets in web browsers, CTCP queries in IRC clients, etc. Physical access, live monitoring, post-mortem equipment analysis: some users face adversaries with intermittent or constant physical access to the equipment they use. Users in Internet cafes, for example, face such a threat. This means the adversary might be physically monitoring the computer while the PELD is running on it. Moreover the adversary might raid the user at any moment and then confiscate and analyse the equipment, storage media and memory in particular. 2.3 Distribution The PELD MUST be distributed in a common format that can easily be used to install the PELD on the selected medium. For instance, if distributed as an ISO 9660 compatible image file it can be burned to a DVD with almost any DVD recording software available. Also, it is RECOMMENDED to make it possible for end-users to verify the downloaded PELD image's integrity using public-key cryptography. 2.4 Operational requirements This section handles mostly the criteria that the PELD should be portable and able to run in as many environments as possible. 2.4.1 Platform The binaries MUST all be executable on the most common computer hardware architecture(s). As of 2014, the x86 computer architecture seems to be the obvious choice as the vast majority of personal computers in use is compatible with it. The PELD SHOULD support UEFI. Supporting widespread hardware architectures used in mobile computers, such as phones, is also welcome. 2.4.2 Media The PELD SHOULD be able to boot and run natively from either a DVD or a USB drive. While running the PELD in native mode it MUST be completely independent from the host operating system and all other storage media on the host computer unless the user explicitly tries to access any of them. In all circumstances, binaries, dynamic libraries and other executable code susceptible to virus infections and similar MUST always be completely write-protected, even when running from a writeable USB medium. Such files SHOULD not even be modifiable temporarily, which could be the case even when running from DVD if the filesystem is loaded into memory (e.g. tmpfs). Configuration files, temporary files, user home directories and similar files that most likely need to be modifiable during operation MUST only be saved temporarily in memory (e.g. by use of something like tmpfs or unionfs) unless the user explicitly enables some features of the Persistent Storage. It is tempting to use the possibility to write back data when running from USB in order to allow user settings to be persistent. If this is considered, this featur'''
