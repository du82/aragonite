["https://tails.boum.org/about/contact/index.ca.html"]
title = "Tails - Contacte"
full_description = "Català English Deutsch Español Français Italiano Português Русский Improve translations about Contacte Contacte Hi ha moltes maneres de contactar amb nosaltres, depenent del que vulgueu parlar. Totes les llistes de correu son en anglès tret que s'especifiqui el contrari. Llistes de correu públiques amnesia-news tails-dev tails-testers tails-l10n Adreces de correu electrònic privades support press fundraising sysadmins Tails Team weblate board seguretat Sales de xat Llistes de correu públiques Aquestes llistes de correu són públiques: la subscripció està oberta a tothom. No envieu informació comprometedora. Respecteu el Codi de conducta del Projecte Tor. amnesia-news amnesia-news@boum.org és la llista de correu on enviem les nostres notícies per correu electrònic. Té un trànsit baix i és el lloc adequat per estar al dia dels llançaments i dels anuncis de seguretat. Arxiu públic d'amnesia-news: https://lists.autistici.org/list/amnesia-news.html tails-dev tails-dev@boum.org és la llista de correu on es coordina el projecte: preguntes de disseny tècnic, propers esdeveniments, informes mensuals i experiència d'usuari. Arxiu públic de tails-dev: https://lists.autistici.org/list/tails-dev.html tails-testers tails-testers@boum.org és la llista de correu per a persones que volen ajudar a provar noves versions o funcions. Arxiu públic de tails-testers: https://lists.autistici.org/list/tails-testers.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Adreces de correu electrònic privades support Podeu escriure correus electrònics encriptats a support@tails.net si necessiteu ajuda en privat. Clau OpenPGP (detalls) press Si sou periodista i voleu escriure sobre Tails, o si voleu enviar-nos enllaços a articles de premsa sobre Tails, escriviu-nos a press@tails.net. Clau OpenPGP (detalls) fundraising Si voleu contactar amb el nostre equip de recaptació de fons, escriviu a fundraising@tails.net. Clau OpenPGP (detalls) sysadmins Per parlar de la nostra infraestructura (servidors, suite de proves, repositoris, miralls, etc.), escriviu a sysadmins@tails.net. Clau OpenPGP (detalls) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. Clau OpenPGP (detalls) weblate Per parlar de la plataforma de traducció de Tails, escriviu a weblate@tails.net. Clau OpenPGP (detalls) board You can write to the Board at board@tails.net. Clau OpenPGP (detalls) seguretat Per avisar de vulnerabilitats, envieu un correu electrònic a security@torproject.org. Clau OpenPGP Sales de xat Podeu unir-vos a la nostra sala de xat d'usuaris i a la sala de xat per a desenvolupadors. Només uns quants desenvolupadors de Tails hi passen l'estona, de manera que és preferible el correu electrònic per a qualsevol qüestió que pugui ser d'interès per a tota la comunitat."
