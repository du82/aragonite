title = "Tails - Home"
full_description = '''Русский English Català Deutsch Español Français Italiano Português Improve translations Home Home document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails портативная операционная система с защитой от слежки и цензуры Избавьтесь от слежки, цензуры, рекламы и вирусов Tails использует сеть Tor для защиты вашей онлайн-приватности и помогает избежать цензуры. Пусть Интернет будет таким, какой он должен быть. Ваш личный безопасный компьютер повсюду с вами Выключите компьютер. Вместо обычной Windows (macOS, Linux) загрузите с флешки Tails. После работы Tails не оставит следов на компьютере. Инструменты цифровой безопасности В Tails есть программы для работы с важными документами и для безопасной связи. Все компоненты Tails готовы к использованию и безопасны по умолчанию. Свободное программное обеспечение Tails бесплатный и основан на Debian GNU/Linux. Качество нашей работы может оценить любой независимый эксперт по безопасности. How Tails works Install Tails Кто пользуется Tails Активисты — чтобы сохранять анонимность, обходить цензуру и безопасно общаться друг с другом. Журналистыи их источники — чтобы публиковать важные данные и заходить в Интернет из небезопасных мест. Пострадавшие от домашнего насилия — чтобы избежать слежки за собой. Вы — когда вам нужно больше приватности в цифровом мире. Кто рекомендует Tails Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. Что говорит нам статистика раскрытия источников информации с 2013 года? Если вы хотите сохранить анонимность, ваша первоочередная задача — уменьшить число таких рабочих ситуаций, где вы можете совершить ошибку. Именно это предлагают Tor и Tails. — Эдвард Сноуден, источник информации в АНБ Один из наиболее продуманных способов использования сети Tor – специально подготовленная операционная система с эффективными настройками по умолчанию для защиты приватности и обеспечения безопасности. Это Tails. — EFF, Electronic Frontier Foundation Наши спонсоры Мы работаем на пожертвования от людей вроде вас и организаций, которые поддерживают свободный Интернет. (Список спонсоров)'''
