title = "Tails - Donate to fight surveillance and censorship"
description = "Tails is a liberating OS that puts the most vulnerable in control of their digital lives. Donate to fight surveillance and censorship!"
full_description = "English Català Deutsch Español Français Italiano Português Русский Improve translations Donate to fight surveillance and censorship Donate to fight surveillance and censorship Tails is merging with the Tor Project We have merged with the Tor Project. However, until further notice, all donations made to Tails will be earmarked for activities involving Tails. You may hear from fundraising staff from Tails or the Tor Project as we make the transition. We are excited about this merger and the opportunity to put more resources towards the development of Tails! Thank you for supporting us through this process. Tails is their strongest protection At Tails, we build a liberating operating system that puts people in control of their digital lives. In 2023, Tails touched the lives of approximately 25 000 individuals daily, and will surpass a staggering 10 million uses. Over the years, Tails has become an invaluable ally for those on the front lines of truth-seeking and progressive political advocacy: Investigative journalists have used Tails to securely unearth corruption and wrongdoing, without fear of reprisal. For example, journalists from PODER and Serendipia used Tails to investigate the systematic espionage of feminists and LGBTQIA+ groups by the Mexican army. Activists have used Tails to organize and communicate with each other, even in repressive regimes. For example, reproductive rights activists in Brazil have used Tails to protect their work and personal data from intrusive law enforcement and boyfriends alike. Whistleblowers have used Tails to expose wrongdoing without compromising their identities or endangering their sources. For example, Edward Snowden and his collaborators used Tails to expose the massive global surveillance programs orchestrated by the NSA and the Five Eyes intelligence alliance. Tails is nonprofit, and runs on a relatively small budget. We have punched above our weight thanks to your support, and we continue to need your support every year. By donating to Tails, you can help us to continue developing and improving Tails, and to make it more accessible to people who need it most. $5 $10 $25 $50 $100 $150 $200 $ One‑time Monthly Yearly Monthly and yearly donations, even the smallest, are the most valuable for the sustainability of Tails. They require a account. Receive a newsletter 2–3 times a year. We will use the email address provided in the PayPal form. Donate Your donation goes entirely to Tails and will be handled by Riseup Labs which is a 501(c)(3) nonprofit organization in the USA.Donations are tax-deductible to the extent permitted by law. If you need a donation receipt, contact us at fundraising@tails.net. Recurring donation Monthly and yearly donations, even the smallest, are the most valuable for the sustainability of Tails. They require a account. $5 $10 $25 $50 $100 $150 $200 Monthly Yearly Receive a newsletter 2–3 times a year. We will use the email address provided in the PayPal form. One-time donation Does not require a account. $5 $10 $25 $50 $100 $150 $200 Custom amount Receive a newsletter 2–3 times a year. We will use the email address provided in the PayPal form. Your donation goes entirely to Tails and will be handled by Riseup Labs which is a 501(c)(3) nonprofit organization in the USA.Donations are tax-deductible to the extent permitted by law. If you need a donation receipt, contact us at fundraising@tails.net. Become a sponsor From 2025, all donations of more than $5 000 will be listed on our sponsorship page. Get in touch with us to be featured as a Tails sponsor. Other ways to donate Bitcoin 1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2 bc1qjg53lww9jrm506dj0g0szmk4pxt6f55x8dncuv Monero 4B93hjotwmMQeaZ799D84XTxhqUGqqjfveUTB1GeduAKNeH47WDyn5eb8P2mtScErGbsbL5X3J6vUPAVPrw8j5pMFh6dAwY Other cryptocurrencies Supporting more cryptocurrencies implies more work for us: learning how they work, installing the software in a secure place, monitoring their value and trading them, etc. To make a good use of our time, we focus on the cryptocurrencies that are the easiest for us to accept and the most popular. Until now, cryptocurrencies other than Bitcoin, Ethereum, and Monero represent less than 1% of our donations in cryptocurrencies. Unfortunately, we had to stop accepting Ethereum. We want to see other cryptocurrencies gain real popularity before spending more time on them. Cash and US checks You can send us cash in any currency and US checks by post: Riseup Labs PO Box 3027 Lacey, WA 98509 Please add a note that your donation is for Tails. Checks should be made payable to Riseup Labs. Bank transfer These instructions also work with Wise. Account holder: Center for Cultivation of Technology gGmbH IBAN: DE65 4306 0967 4111 9411 01 BIC: GENODEM1GLS Bank: GLS Gemeinschaftsbank eG Bank address: Christstrasse 9, 44789, Bochum, Germany Please make sure to mention this purpose of transfer. Purpose of transfer: TAILS-R43NGFR9 Your donation goes entirely to Tails and will be handled by the Center for the Cultivation of Technology (CCT) which is a nonprofit organization in Germany. Donations are tax-deductible to the extent permitted by law. Corporate matching donation programs Search for Riseup Labs and donate to Tails via Riseup Labs. If you cannot specify that your donation to Riseup Labs is for Tails, please let us know so we can attribute your donation to Tails specifically. Liberate (aka Riseup Labs) is a 501(c)(3) nonprofit in the USA. Contact If you have any question or problem regarding your donation, our fundraising team is here to help you: fundraising@tails.net (OpenPGP key) Recommended by Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. Tor Project and Tails joined forces in 2024. If you look at the way post-2013 whistleblowers have been caught, it is clear the absolute most important thing you can do to maintain your anonymity is reduce the number of places in your operational activity where you can make mistakes. Tor and Tails still do precisely that. — Edward Snowden, NSA whistleblower One of the most robust ways of using the Tor network is through a dedicated operating system that enforces strong privacy- and security-protective defaults. That operating system is Tails. — EFF, Electronic Frontier Foundation"
