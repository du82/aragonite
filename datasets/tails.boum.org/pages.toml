["https://tails.boum.org/about/contact/index.pt.html"]
title = "Tails - Contato"
full_description = "Português English Català Deutsch Español Français Italiano Русский Improve translations about Contato Contato Existem várias formas de nos contatar, dependendo do assunto sobre o qual você quer falar. Todas as listas de e-mail são em inglês, a menos que esteja indicado o contrário. Listas de email públicas amnesia-news tails-dev tails-testers tails-l10n Endereços de email privados support press fundraising sysadmins Tails Team weblate board security Salas de bate-papo Listas de email públicas These mailing lists are public: subscription is open to anyone. Don't send compromising information. Please respect the Tor Project Code of Conduct. amnesia-news amnesia-news@boum.org é a lista de discussão para a qual enviamos nossas novidades por e-mail. Tem baixo tráfego e é o lugar certo para acompanhar as atualizações de lançamentos, além dos anúncios de segurança. Arquivo público da lista amnesia-news: https://lists.autistici.org/list/amnesia-news.html tails-dev tails-dev@boum.org é a lista de emails na qual o projeto é coordenado: questões de projeto técnico, eventos que acontecerão, relatórios mensais e experiência de usuário. Arquivo público da lista tails-dev: https://lists.autistici.org/list/tails-dev.html tails-testers tails-testers@boum.org é a lista de e-mails para pessoas que querem ajudar testando novos lançamentos ou funcionalidades. Arquivo público da lista tails-testers: https://lists.autistici.org/list/tails-testers.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Endereços de email privados support You can write encrypted emails to support@tails.net if you need help in private. Chave OpenPGP (details) press Se você é jornalista e quer escrever sobre Tails, ou se quer nos enviar links para artigos publicados sobre Tails, escreva para press@tails.net. Chave OpenPGP (details) fundraising Se você quer entrar em contato com o time de captação do Tails, escreva para fundraising@tails.net. Chave OpenPGP (details) sysadmins Para falar sobre nossa infraestrutura (servidores, suíte de testes, repositórios espelhos, etc.), escreva para sysadmins@tails.net. Chave OpenPGP (details) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. Chave OpenPGP (details) weblate Para falar sobre a plataforma de tradução do Tails, escreva para weblate@tails.net. Chave OpenPGP (details) board You can write to the Board at board@tails.net. Chave OpenPGP (details) security For vulnerabilities disclosures, email security@torproject.org. OpenPGP key Salas de bate-papo Você pode entrar nas nossas salas de bate papo de usuários e bate papo de desenvolvedores. Apenas alguns desenvolvedores do Tails ficam por lá, então e-mail é a forma preferencial de contato para qualquer coisa que possa ser de interesse mais amplo da comunidade."
