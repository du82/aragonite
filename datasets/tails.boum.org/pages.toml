["https://tails.boum.org/contribute/how/translate"]
title = "Tails - Improve Tails in your own language"
full_description = '''contribute how Improve Tails in your own language Improve Tails in your own language Thank you for your interest in making Tails easier to use in your own language! What you can translate Translate Tails custom programs Translate this website, including the Tails documentation Mailing list for translators Translation teams Tier-1 languages After updating the list of tier-1 languages For native English speakers What you can translate Translate Tails custom programs You can help correct, improve, or complete the translations of Tails programs into your native language. Read translating with Hosted Weblate. Tails programs can be translated into more than 140 languages this way. Translate this website, including the Tails documentation Get started with translating this website. Please focus on translating and maintaining the core pages first. Mailing list for translators Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Translation teams Currently, there are several active language teams: Catalan Chinese (Simplified) Farsi French German Portuguese Italian Spanish Other teams are being set up: Turkish If your language is not listed here, read the documentation to add a new language. Tier-1 languages We call "tier-1 languages" the languages that we consider the most important for our target user base: Languages proposed on our website Languages that make Tails understandable by a majority of the population of the top 10 countries of either Directly-connecting Tor clients Tor clients connecting via bridges In March 2019 this list was: Arabic English Farsi French German Hindi Indonesian Italian Portuguese Russian Simplified Chinese Spanish Turkish We are particularly interested in translations in these languages and include language packs and dictionaries by default in Tails for them. After updating the list of tier-1 languages After updating the list of tier-1 languages, update: auto/scripts/generate-languages-list features/localization.feature wiki/src/doc/about/features.mdwn For native English speakers Most of Tails developers are not native English speakers so you're more than welcome to correct or improve our English. Get in touch on tails-dev@boum.org.'''
year_published = 2025
