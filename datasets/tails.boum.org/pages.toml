["https://tails.boum.org/doc/first_steps/accessibility/index.en.html"]
title = "Tails - Accessibility"
full_description = "English Català Deutsch Español Français Italiano Português Русский Improve translations doc first steps Accessibility Accessibility Tails and the GNOME desktop include assistive technologies to support users with various impairments and special needs, and to interact with common assistive devices. Accessibility menu Keyboard shortcuts Screen reader Screen keyboard Accessibility menu You can activate several assistive technologies, like a screen reader or large text, from the accessibility menu in the top bar, the icon that looks like a person. Keyboard shortcuts Turn screen reader on or offAlt++S Turn zoom on or offAlt++8 Zoom inAlt++= Zoom outAlt++- Window resize menuAlt+Space To learn about all keyboard shortcuts in GNOME visit GNOME Help: Useful keyboard shortcuts or use the Settings application in Tails: Choose Applications ▸ Settings. In the Settings application, choose Keyboard ▸ Keyboard Shortcuts ▸ View and Customize Shortcuts. To access the accessibility menu using the keyboard: Press Ctrl+Alt+Tab to move the keyboard focus to the top bar. Use the arrow keys on the keyboard to select the accessibility menu. Press Enter to open the menu. Use the up and down arrow keys to select items in the menu. Press Space to toggle the selected item. Press Esc to close the menu. Screen reader To hear screen elements spoken to you, turn on the Screen Reader from the accessibility menu (). GNOME Help: Orca Screen Reader Screen keyboard If you prefer a pointing device over the keyboard, turn on the Screen Keyboard from the accessibility menu (). You can also use the screen keyboard to protect against hardware keyloggers by avoiding to use the actual keyboard. If a keylogger has been physically installed on the computer, your passwords, personal information, and other data typed on the keyboard could be stored and accessed by someone else, even if you are using Tails. For an example, see KeeLog: KeyGrabber forensic keylogger getting started. Keyloggers are more likely on public computers, in internet cafés or libraries, and on desktop computers, where a device is easier to hide. Reducing risks when using untrusted computers The screen keyboard doesn't work in a Root Terminal. (#18061) Instead, open a Terminal and execute the following command to log in as root: sudo -i The screen keyboard doesn't work in Kleopatra, Electrum, and KeePassXC. (#19695) Instead, you can use the screen keyboard in the Text Editor first, then cut and paste into one of these applications."
