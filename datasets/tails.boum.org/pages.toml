["https://tails.boum.org/about/contact/index.es.html"]
title = "Tails - Contacta"
full_description = "Español English Català Deutsch Français Italiano Português Русский Improve translations about Contacta Contacta Hay muchas formas de contactarnos, dependiendo del tema. Todas las listas de correos son en inglés, a menos que se especifique lo contrario. Listas de correo públicas amnesia-news tails-dev tails-testers tails-l10n Cuentas de correo privadas support press fundraising sysadmins Tails Team weblate board security Chat rooms Listas de correo públicas These mailing lists are public: subscription is open to anyone. Don't send compromising information. Please respect the Tor Project Code of Conduct. amnesia-news amnesia-news@boum.org es la lista de correos donde enviamos nuestras noticias vía correo electrónico. Tiene poco tráfico y es el lugar indicado para mantenerse al día con los lanzamientos y anuncios de seguridad. Archivo público de amnesia-news: https://lists.autistici.org/list/amnesia-news.html tails-dev tails-dev@boum.org es la lista de difusión donde se coordina el proyecto: preguntas de diseño técnico, próximos eventos, informes mensuales, y experiencia del usuario. Archivo público de tails-dev: https://lists.autistici.org/list/tails-dev.html tails-testers tails-testers@boum.org es la lista de correos para gente que quiere ayudar a probar nuevos lanzamientos o funcionalidades. Archivo público de tails-testers: https://lists.autistici.org/list/tails-testers.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Cuentas de correo privadas support Puedes escribir correos electrónicos cifrados a support@tails.net si necesitas ayuda en privado. Llave OpenPGP (detalles) press Si eres un periodista y quieres escribir sobre Tails, o si quieres enviarnos links sobre Tails a artículos de prensa, escribe a press@tails.net. Llave OpenPGP (detalles) fundraising If you want to contact our fundraising team, write to fundraising@tails.net. Llave OpenPGP (detalles) sysadmins Para hablar sobre nuestra infraestructura (servidores, conjunto de pruebas, repositorios, mirrors, etc.), escribe a sysadmins@tails.net. Llave OpenPGP (detalles) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. Llave OpenPGP (detalles) weblate Para hablar sobre la plataforma de traducción de Tails, escribe a weblate@tails.net. Llave OpenPGP (detalles) board You can write to the Board at board@tails.net. Llave OpenPGP (detalles) security For vulnerabilities disclosures, email security@torproject.org. OpenPGP key Chat rooms Te puedes unir a nuestra sala chat de usuarios y sala chat de desarrolladores. Sólo unos pocos desarrolladores de Tails están por esas salas, así que el correo electrónico es el medio preferido para cualquier cosa que pueda ser interesante para toda la comunidad."
