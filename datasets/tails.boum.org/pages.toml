title = "Tails - License and source code distribution"
full_description = "English Català Deutsch Español Français Italiano Português Русский Improve translations doc about License and source code distribution License and source code distribution Tails is Free Software: you can download, use, and share it with no restrictions. The Tails source code is released under the GNU/GPL (version 3 or above) and is Copyright (C) Tails developers foundations@tails.net. Any exception to this rule is documented either below or in the affected source file. However, Tails, like Debian, includes closed source binary firmware in order to work on as much hardware as possible. Source code Most of the software included in Tails is taken directly from upstream Debian packages and is neither modified nor recompiled by Tails. The source code of software that is specific to Tails is available in our Git repositories. The source code of the Debian packages included in Tails is available in the APT snapshot that we created for that version of Tails. The red theme used by Tails' Unsafe Browser was downloaded from Mozilla add-ons website (https://addons.mozilla.org/en-US/firefox/addon/simplyred/): license: Creative Commons Attribution 3.0 author: Firefox user 14030863 Website This website uses several images with distinct copyright, licenses, trademarks and distribution terms: The Tails logo is based on USB by Ilsur Aptukov from the Noun Project. Debian logo: Copyright (c) 1999 Software in the Public Interest. Onion logo: registered trademark of The Tor Project, Inc.; the Tails project is authorized to use it under certain conditions; licensed under Creative Commons Attribution 3.0 United States License. Forge, copyright Digital Bazaar, Inc. The drawings on our Home, About, and Warnings pages are licensed under the Creative Commons Attribution-ShareAlike 4.0 International License, copyright Andrés Fernández Cordón (source for Adobe Illustrator). All the drawings of our personas are licensed under the Creative Commons Attribution-ShareAlike 4.0 Int