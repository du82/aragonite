title = "Tails - Security advisories"
full_description = '''English Català Deutsch Español Français Italiano Português Русский Improve translations Security advisories Security advisories Current security vulnerabilities Fixed security vulnerabilities Other vulnerabilities solved in included applications Since Tails is based on Debian, it takes advantage of all the work done by the Debian security team. As quoted from https://www.debian.org/security/: Debian takes security very seriously. We handle all security problems brought to our attention and ensure that they are corrected within a reasonable timeframe. Many advisories are coordinated with other free software vendors and are published the same day a vulnerability is made public and we also have a Security Audit team that reviews the archive looking for new or unfixed security bugs. Experience has shown that "security through obscurity" does not work. Public disclosure allows for more rapid and better solutions to security problems. In that vein, this page addresses Debian's status with respect to various known security vulnerabilities, which could potentially affect Debian. Current security vulnerabilities Fixed security vulnerabilities Possible remote attack on onion services Posted 2023-11-15 Weak cryptographic parameters in LUKS1 Posted 2023-06-14 Serious security vulnerability in Tails 5.0 Posted 2022-05-24 JavaScript vulnerability in Tor Browser Posted 2020-11-11 Critical security vulnerability in Tails 3.14.1 Posted 2019-06-20 Tor Browser not safe without manual action Posted 2019-05-04 Claws Mail leaks plaintext of encrypted emails to IMAP server Posted 2015-05-07 Security hole in I2P 0.9.13 Posted 2014-07-24 You have to upgrade Tor to fix a critical anonymity vulnerability Posted 2011-10-30 Iceweasel exposes a rare User-Agent Posted 2010-09-03 Other vulnerabilities solved in included applications Known security vulnerabilities in Tails 6.11 Posted 2025-02-03 Known security vulnerabilities in Tails 6.10 Posted 2025-01-06 Known security vulnerabilities in Tails 6.9 Posted 2024-11-25 Known security vulnerabilities in Tails 6.8.1 Posted 2024-10-28 Known security vulnerabilities in Tails 6.8 Posted 2024-10-08 Known security vulnerabilities in Tails 6.7 Posted 2024-10-05 Known security vulnerabilities in Tails 6.6 Posted 2024-09-07 Known security vulnerabilities in Tails 6.5 Posted 2024-08-10 Known security vulnerabilities in Tails 6.4 Posted 2024-07-13 Known security vulnerabilities in Tails 6.3 Posted 2024-06-15'''
