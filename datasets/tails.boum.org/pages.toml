["https://tails.boum.org/about/contact/index.ru.html"]
title = "Tails - Контакты"
full_description = "Русский English Català Deutsch Español Français Italiano Português Improve translations about Контакты Контакты Есть много способов связаться с нами. Как – зависит от вашего вопроса. Все списки рассылок ведутся на английском языке, если не указано иное. Публичные списки рассылок amnesia-news tails-dev tails-testers tails-l10n Частные адреса email support press fundraising sysadmins Tails Team weblate board security Чаты Публичные списки рассылок These mailing lists are public: subscription is open to anyone. Don't send compromising information. Please respect the Tor Project Code of Conduct. amnesia-news amnesia-news@boum.org – наша новостная рассылка. В ней мало трафика. Это отличный способ быть в курсе новых релизов и объявлений по безопасности. Публичный архив рассылки amnesia-news: https://lists.autistici.org/list/amnesia-news.html tails-dev tails-dev@boum.org – координационный список проекта: технический дизайн, запланированные события, ежемесячные отчёты, замечания пользователей. Публичный архив tails-dev: https://lists.autistici.org/list/tails-dev.html tails-testers tails-testers@boum.org – для тех, кто хочет помочь в тестировании новых выпусков или отдельных функций. Публичный архив tails-testers: https://lists.autistici.org/list/tails-testers.html tails-l10n Translators coordinate on the tails-l10n mailing list (l10n stands for localization). This is where important changes to translatable strings are announced. So, please subscribe to the list if you want to become a regular translator: Public archive of tails-l10n: https://lists.autistici.org/list/tails-l10n.html. Частные адреса email support You can write encrypted emails to support@tails.net if you need help in private. Ключ OpenPGP (подробнее) press Если вы журналист и намерены написать о Tails, или если вы хотите отправить нам ссылки на статьи о Tails, пишите по адресу press@tails.net. Ключ OpenPGP (подробнее) fundraising If you want to contact our fundraising team, write to fundraising@tails.net. Ключ OpenPGP (подробнее) sysadmins Для обсуждения нашей инфраструктуры (серверов, тестового окружения, репозиториев, зеркал и т.д.) пишите по адресу sysadmins@tails.net. Ключ OpenPGP (подробнее) Tails Team To get in touch with the Tails Team, write to foundations@tails.net. Ключ OpenPGP (подробнее) weblate Для вопросов о переводческой платформе Tails пишите на weblate@tails.net. Ключ OpenPGP (подробности) board You can write to the Board at board@tails.net. Ключ OpenPGP (подробнее) security For vulnerabilities disclosures, email security@torproject.org. OpenPGP key Чаты Можете присоединиться к нашим чатам для пользователей и для разработчиков. Поскольку разработчиков Tails там немного, для вопросов, которые могут касаться большей части сообщества, лучше пользоваться email."
