["https://tails.boum.org/index.ca.html"]
title = "Tails - Inici"
full_description = '''Català English Deutsch Español Français Italiano Português Русский Improve translations Inici Inici document.addEventListener('DOMContentLoaded', function() { document.title = "Tails"; }); Tails és un sistema operatiu portàtil que us protegeix contra la vigilància i la censura. Eviteu la vigilància, la censura, la publicitat i els virus Tails utilitza la xarxa Tor per protegir la vostra privadesa en línia i ajudar-vos a evitar la censura. Gaudiu d'Internet com hauria de ser. El vostre ordinador segur a qualsevol lloc Apagueu l'ordinador i inicieu al vostre llapis USB de Tails en lloc d'arrencar a Windows, macOS o Linux. Tails no deixa rastre a l'ordinador quan l'apagueu. Caixa d'eines de seguretat digital Tails inclou una selecció d'aplicacions per treballar amb documents sensibles i comunicar-se de manera segura. Tot a Tails està llest per utilitzar-se i té valors predeterminats segurs. Programari Lliure Podeu baixar-vos Tails gratuïtament i investigadors de seguretat independents poden verificar la nostra feina. Tails està basat en Debian GNU/Linux. Com funciona Tails Instal·lar Tails Qui utilitza Tails Activistes utilitzen Tails per ocultar les seves identitats, evitar la censura i comunicar-se de manera segura. Periodistesi les seves fonts utilitzen Tails per publicar informació sensible i accedir a Internet des de llocs insegurs. Supervivents de violència domèstica utilitzen Tails per escapar de la vigilància a casa. Tu sempre que necessiteu més privadesa en aquest món digital. Recomanat per Tails is part of the Tor Project, a global nonprofit developing tools for online privacy and anonymity. To better protect you, the same people are building the Tor network, the Tor Browser, and Tails. El Projecte Tor i Tails es van unir el 2024. Si observeu com s'han descobert els denunciants posteriors al 2013, és evident que el més important que podeu fer per mantenir l'anonimat és reduir el nombre de llocs de la vostra activitat operativa on podeu cometre errors. Tor i Tails fan precisament això. — Edward Snowden, denunciant de la NSA Una de les maneres més sòlides d'utilitzar la xarxa Tor és a través d'un sistema operatiu dedicat que imposi uns forts paràmetres predeterminats de protecció de la privadesa i la seguretat. Aquest sistema operatiu és Tails. — EFF, Electronic Frontier Foundation Patrocinadors El nostre treball es finança amb donacions de persones com tu i d'organitzacions que donen suport a la llibertat d'Internet. Coneixeu els nostres patrocinadors.'''
