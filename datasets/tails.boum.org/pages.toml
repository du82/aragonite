["https://tails.boum.org/doc/about/requirements/index.en.html"]
title = "Tails - System requirements and recommended hardware"
full_description = '''English Català Deutsch Español Français Italiano Português Русский Improve translations doc about System requirements and recommended hardware System requirements and recommended hardware Summary Tails works on: Most PC computers that are less than 10 years old Some older Mac computers with an Intel processor Tails does not work: Newer Mac computers with an Apple processor (M1 or M2) Smartphones or tablets Raspberry Pi Tails might not work on: Some older computers, for example, if they don't have 2 GB of RAM. Some newer computers, for example, if their graphics card is incompatible with Linux. Nvidia or AMD Radeon cards often do not work in Tails. See our list of known hardware compatibility issues. Detailed hardware requirements A USB stick of 8 GB minimum or a recordable DVD. All the data on this USB stick or DVD is lost when installing Tails. The ability to start from a USB stick or a DVD reader. A 64-bit x86-64 IBM PC compatible processor. Tails does not works on ARM or PowerPC processors. Tails does not work on 32-bit computers since Tails 3.0 (June 2017). 2 GB of RAM to work smoothly. Tails can work with less than 2 GB RAM but might behave strangely or crash. Recommended hardware Laptop models evolve too rapidly for us to be able to provide an up-to-date list of recommended hardware. Below are some guidelines if you, or your organization, are considering acquiring a laptop dedicated to running Tails. For PC Avoid "gaming" models with Nvidia or AMD Radeon graphics cards. Consider buying a refurbished laptop from a high-end (professional) series. These are cheaper and will last longer than new but lower-quality laptops. For example, the Lenovo ThinkPad series work well with Tails, including the X250, X1 Carbon, T440, T480, and T490 models. If you live in a part of the world where buying refurbished laptops is uncommon, look on eBay and Amazon. Amazon offers a 90-day Amazon Renewed Guarantee. Consider buying a new laptop from vendors who guarantee the compatibility with Linux and Tails like ThinkPenguin. For Mac Unfortunately, we don't know of any Mac model that works well in Tails and can run the latest macOS version.'''
year_published = 2025
clearnet = "https://tails.boum.org/doc/about/requirements/index.en.html"
