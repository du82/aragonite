title = "Tails - Com funciona Tails"
full_description = "Català English Deutsch Español Français Italiano Português Русский Improve translations Com funciona Tails Com funciona Tails No deixeu rastre a l'ordinador Com una tenda de campanya, podeu portar i utilitzar Tails a qualsevol lloc. El vostre ordinador segur a qualsevol lloc Per utilitzar Tails, apagueu l'ordinador i inicieu al vostre llapis USB de Tails en lloc d'arrencar a Windows, macOS o Linux. Podeu temporalment convertir el vostre propi ordinador en una màquina segura. També podeu mantenir-vos fora de perill mentre utilitzeu l'ordinador d'una altra persona. Tails és una baixada de 1.5 GB i la instal·lació triga mitja hora. Tails es pot instal·lar en qualsevol llapis USB de 8 GB com a mínim. Tails funciona en la majoria d'ordinadors de menys de 10 anys. Podeu tornar a iniciar en l'altre sistema operatiu després d'apagar Tails. No us heu de preocupar que l'ordinador tingui virus perquè Tails funciona de manera independent de l'altre sistema operatiu i mai utilitza el disc dur. Però, Tails no sempre us pot protegir si l'instal·leu des d'un ordinador amb virus o si l'utilitzeu en un ordinador amb maquinari maliciós, com ara enregistradors de tecles. Vegeu també: Advertències: Tails és segur però no màgic! Baixar i instal·lar Tails Requisits del sistema i maquinari recomanat Com una tenda de campanya, Tails és amnèsic: sempre comença buit i no deixa cap rastre quan marxeu. Amnèsia Tails sempre comença des del mateix estat net i tot el que feu desapareix automàticament quan tanqueu Tails. Sense Tails, gairebé tot el que feu pot deixar rastres a l'ordinador: Llocs web que heu visitat, fins i tot en mode privat Fitxers que heu obert, encara que els hagueu suprimit Contrasenyes, fins i tot si utilitzeu un gestor de contrasenyes Tots els dispositius i xarxes Wi-Fi que heu utilitzat Pel contrari, Tails mai escriu res al disc dur i només s'executa des de la memòria de l'ordinador. La memòria s'esborra completament quan tanqueu Tails, eliminant tots els rastres possibles. Com una motxilla, podeu desar les vostres coses personals a l'Emmagatzematge Persistent i utilitzar-les a la vostra tenda de campanya. Emmagatzematge Persistent Podeu desar alguns dels vostres fitxers i configuracions en un Emmagatzematge Persistent encriptat al llapis USB: els vostres documents, les adreces d'interès del navegador, els correus electrònics i fins i tot algun programari addicional. L'Emmagatzematge Persistent és opcional i sempre decidiu què és persistent. Tota la resta és amnèsica. Vegeu també: Emmagatzematge Persistent Instal·lació de programari addicional Caixa d'eines de seguretat digital Tails inclou una selecció d'aplicacions per treballar amb documents sensibles i comunicar-se de manera segura. Totes les aplicacions estan llestes per ser utilitzades i estan configurades amb valors predeterminats segurs per evitar errors. Tails inclou: Navegador Tor amb uBlock, un navegador segur i un bloquejador d'anuncis Thunderbird, per a correus electrònics encriptats KeePassXC, per crear i emmagatzemar contrasenyes segures LibreOffice, una suite ofimàtica OnionShare, per compartir fitxers, llocs web i sales de xat mitjançant Tor Netejador de metadades, per eliminar metadades dels fitxers i molts més! Per evitar errors: Les aplicacions es bloquegen automàticament si intenten connectar-se a Internet sense Tor. Tot l'Emmagatzematge Persistent s'encripta automàticament. Tails no escriu res al disc dur. Tota la memòria s'elimina en apagar l'ordinador. Vegeu també: Característiques i programari inclòs Documentació No deixeu rastre a Internet Tor per a tot Tot el que feu a Internet des de Tails passa per la xarxa Tor. Tor encripta i anonimitza la vostra connexió passant-la a través de tres repetidors. Els repetidors són servidors operats per diferents persones i organitzacions d'arreu del món. Un sol repetidor mai sap d'on ve la connexió encriptada i cap a on anirà: El primer repetidor només sap d'on veniu però no cap a on aneu. El tercer repetidor només sap on aneu però no d'on veniu. La connexió amb la destinació final s'encripta sempre que sigui possible per evitar que el tercer repetidor en llegeixi el contingut. D'aquesta manera, Tor és segur per disseny fins i tot si alguns repetidors són maliciosos. La xarxa Tor té més de 6 000 repetidors. Les organitzacions que gestionen els repetidors de Tor inclouen universitats com el MIT, grups d'activistes com Riseup, organitzacions sense ànim de lucre com Derechos Digitales, empreses d'allotjament d'Internet com Private Internet Access, entre d'altres. La gran diversitat de persones i organitzacions que gestionen els repetidors de Tor fa que sigui més segur i sostenible. Vegeu també: Connexió a la xarxa Tor Per què Tails utilitza Tor? Eviteu la vigilància i la censura en línia Tor impedeix que algú que vegi la vostra connexió a Internet aprengui què esteu fent a Internet. Podeu evitar la censura perquè és impossible que un censor sàpiga quins llocs web esteu visitant. Si la connexió a Tor està bloquejada o és perillós utilitzar-la des d'on us trobeu, per exemple en alguns països amb una forta censura, podeu utilitzar ponts per ocultar que esteu connectat a la xarxa Tor. Eviteu el seguiment i canvieu la identitat Tor també impedeix que els llocs web que visiteu aprenguin on i qui sou, tret que els ho digueu. Podeu visitar llocs web de manera anònima o canviar la vostra identitat. Els seguidors en línia i els anunciants ja no us podran seguir d'un lloc web a un altre. Podeu publicar un blog o gestionar un compte de xarxes socials completament des de Tails. Si només hi accediu des de Tails, no es podrà relacionar amb vós. Podeu emmagatzemar documents i imatges relacionades amb aquesta identitat diferent al vostre Emmagatzematge Persistent, mantenir les vostres contrasenyes a KeePassXC, tenir un compte de correu electrònic dedicat a Thunderbird, etc. Programari per a la llibertat Transparència per generar confiança Tot el codi del nostre programari és públic per permetre als investigadors de seguretat independents verificar que Tails realment funciona com hauria. Vegeu també: Confiar en Tails Llicència i distribució del codi font Documents de disseny Màxima seguretat gratuïta Ningú hauria de pagar per mantenir-se fora de perill mentre utilitza un ordinador. És per això que oferim Tails gratuïtament i intentem que sigui fàcil d'utilitzar per qualsevol persona. Tails is made by the Tor Project, a global nonprofit developing tools for online privacy and anonymity. El nostre treball es finança amb donacions de persones com tu i d'organitzacions que donen suport a la llibertat d'Internet: Mozilla, DuckDuckGo, Open Tech Fund, Craig Newmark Philanthropies, etc. Vegeu també: Feu una donació Patrocinadors Contracte social Compartir per ser més forts Tails està construït sobre bases sòlides: la xarxa Tor, el sistema operatiu Debian, l'entorn d'escriptori GNOME i totes les eines incloses a Tails. Compartim les nostres millores perquè molta més gent pugui beneficiar-se del nostre treball. Vegeu també: Relació amb upstream Contribuir El Projecte Tor Debian GNU/Linux GNOME Contacte Instal·lar Tails"
