["https://tails.boum.org/about/index.de.html"]
title = "Tails - Wie Tails funktioniert"
full_description = "Deutsch English Català Español Français Italiano Português Русский Improve translations Wie Tails funktioniert Wie Tails funktioniert Hinterlassen Sie keine Spuren am Computer Sie können Tails wie ein Zelt mit sich herumtragen und überall verwenden. Ihr sicherer Computer, überall Um Tails zu nutzen, fahren Sie Ihren Computer herunter und booten ihn von Ihrem Tails-USB-Stick anstatt von Windows, macOS oder Linux. So können Sie Ihren Computer vorübergehend zu einem sicheren Gerät machen. Ebenso können Sie dann sicher bleiben, wenn Sie den Computer von jemand Anderem verwenden. Tails ist ein 1.5 GB Download und die Installation dauert etwa eine halbe Stunde. Tails kann auf einem USB Stick mit mindestens 8 GB installiert werden. Tails funktioniert auf den meisten Computern die weniger als 10 alt Jahre sind. Sie können nach dem Herunterfahren von Tails wieder das andere Betriebssystem starten. Sie müssen sich keine Sorgen darüber machen, dass der Computer Viren hat, da Tails unabhängig vom fest installierten Betriebssystem arbeitet und niemals die Festplatte benutzt. Dennoch kann Tails Sie nicht immer schützen, falls Sie es von einem Computer aus installieren, der Viren hat, oder falls Sie es auf einem Computer mit schädlicher Hardware (wie Keylogger) verwenden. Lesen Sie auch: Warnungen: Tails ist sicher, aber keine Magie! Tails herunterladen und installieren System Anforderungen und empfohlene Hardware Wie ein Zelt ist auch Tails nichts Dauerhaftes: Es ist anfangs leer und hinterlässt keine Spuren, wenn Sie wieder abreisen. Keine Spuren Tails startet immer in demselben Zustand und alles, was Sie tun, verschwindet automatisch wieder, wenn Sie Tails herunterfahren. Ohne Tails kann fast alles, was Sie auf dem Computer machen, Spuren hinterlassen: Webseiten, die Sie besucht haben - sogar im privaten Modus Dateien, die Sie verwendet haben, sogar wenn Sie diese gelöscht haben Passwörter, sogar wenn Sie einen Passwortmanager verwenden Alle Geräte und WLAN-Verbindungen, die Sie verwendet haben Im Gegensatz dazu schreibt Tails niemals etwas auf die Festplatte und läuft nur im Arbeitsspeicher des Computers. Der Arbeitsspeicher wird komplett gelöscht, wenn Sie Tails herunterfahren, wodurch alle möglichen Spuren vernichtet werden. Wie in einem Rucksack können Sie Ihre persönlichen Sachen im beständigen Speicher aufbewahren und sie in Ihrem Zelt nutzen. Beständiger Datenspeicher Sie können ausgewählte Dateien und Einstellungen auf einem verschlüsseltem Speicher auf dem USB-Stick speichern: Ihre Dokumente, Ihre Browser-Lesezeichen, Ihre E-Mails und sogar zusätzliche Software. Der beständige Speicher ist optional und Sie können immer auswählen, was daringespeichert wird. Alles andere verschwindet wieder. Lesen Sie auch: Persistenter Speicher Installation von zusätzlicher Software Werkzeugkasten für digitale Sicherheit Tails beinhaltet eine Auswahl an Programmen, um an sensiblen Dokumenten arbeiten und sicher zu kommunizieren . Alle Programme sind startklar und mit sicheren Voreinstellungen konfiguriert, um Fehler zu vermeiden. Tails kommt mit: Tor Browser mit uBlock, ein sicherer Browser und ein Werbeblocker Thunderbird für verschlüsselte E-Mail KeePassXC, um starke Passwörter erzeugen und speichern zu können LibreOffice, eine Office-Suite OnionShare, um Dateien, Webseiten und Chats über Tor teilen zu können Metadata Cleaner, um Metadaten von Dateien zu entfernen und vieles mehr! Um Fehler zu vermeiden: werden Programme automatisch blockiert, falls diese versuchen, sich ohne Tor ins Internet zu verbinden. Alles im beständigen Datenspeicher wird automatisch verschlüsselt. schreibt Tails nichts auf die Festplatte. Der Arbeitsspeicher wird beim Herunterfahren vollständig gelöscht. Lesen Sie auch: Komponenten und mitgelieferte Software Dokumentation Hinterlassen Sie keine Spuren im Internet Tor für alles Alles, was sie von Tails aus im Internet machen, geht über das Tor-Netzwerk. Tor verschlüsselt und anonymisiert Ihre Verbindung, indem sie durch 3 Relays geleitet wird. Relays sind Server, die von verschiedenen Privatpersonen und Organisationen auf der ganzen Welt betrieben werden. Ein einzelnes Relay weiß weder, wo die verschlüsselte Verbindung herkommt , noch, wo sie hingeht: Das erste Relay weiß nur, woher Sie kommen, aber nicht, wohin Sie sich verbinden. Das dritte Relay weiß nur, wohin Sie sich verbinden, aber nicht, woher Sie kommen. Die Verbindung zur Zieladresse ist (wo immer möglich) verschlüsselt, damit das dritte Relay ihren Inhalt nicht mitlesen kann. Dadurch ist Tor vom Design her sicher, sogar falls einige Relays mit bösartiger Absicht betrieben werden. Das Tor-Netzwerk verfügt über mehr als 6.000 Relais. Zu den Organisationen, die Tor-Relais betreiben, gehören Universitäten wie das MIT, Aktivistengruppen wie Riseup, Non-Profit-Organisationen wie Derechos Digitales, Internet-Hosting-Unternehmen wie Private Internet Access und viele andere. Die enorme Vielfalt an Personen und Organisationen, die Tor-Relais betreiben, macht es sicherer und nachhaltiger. Lesen Sie auch: Verbindung zum Tor-Netzwerk herstellen Warum nutzt Tails Tor? Online-Überwachung und Zensur vermeiden Tor verhindert, dass jemand, der Ihre Internetverbindung beobachtet, herausfinden kann, was Sie im Internet machen. Sie können Zensur umgehen, da es für die Zensurstelle unmöglich ist zu wissen, welche Websiten Sie besuchen. Falls in Ihrer Gegend Tor blockiert wird oder es gefährlich ist, Tor zu nutzen, zum Beispiel in Staaten mit weitgehender Zensur, können Sie Bridges nutzen, um zu verbergen, dass Sie über das Tor-Netzwerk verbunden sind. Verschiedene Arten von Bridges funktionieren unterschiedlich gut in unterschiedlichen Gegenden. Tracking verhindern und die Identität ändern Tor verhindert auch, dass die von Ihnen besuchten Webseiten dahinter kommen können, wo und wer Sie sind, außer Sie sagen es ihnen. Sie können Webseiten anonym besuchen oder Ihre Identität ändern. Online-Tracker und Werbeanbieter können Ihnen nicht mehr von einer Webseite zur nächsten folgen. Sie können einen Blog veröffentlichen oder einen Social Media Account betreiben und dabei ausschließlich Tails benutzen. Wenn Sie auf diese nur von Tails aus zugreifen, können sie nicht zu Ihnen zurückverfolgt werden. Sie können Dokumente und Bilder, die mit dieser anderen Identität verbunden sind, in Ihrem beständigen Speicher speichern, Ihre Passwörter in KeePassXC speichern, einen eigenen E-Mail Account in Thunderbird einrichten usw. Software für Freiheit Transparenz, um Vertrauen aufzubauen Der ganze Code unserer Software ist öffentlich und erlaubt unabhängigen Sicherheitsforschern und -forscherinnen zu verifizieren, dass Tails wirklich so funktioniert, wie es sollte. Lesen Sie auch: Tails vertrauen Lizenzen und Verteilung des Sourcecodes Design Dokumente Top Sicherheit kostenlos Niemand sollte dafür zahlen müssen, bei der Benutzung von Computern sicher zu sein. Deswegen stellen wir Tails kostenlos bereit und versuchen, es für alle Menschen leicht benutzbar zu machen. Tails is made by the Tor Project, a global nonprofit developing tools for online privacy and anonymity. Unsere Arbeit wird finanziert durch Spenden von Privatpersonen, wie Ihnen, und Organisationen, die Internetfreiheit unterstützen: Mozilla, DuckDuckGo, Open Tech Fund, Craig Newmark Philanthropies, usw. Lesen Sie auch: Spenden Sponsoren Social contract Teilen, um stärker zu sein Tails basiert auf soliden Fundamenten: dem Tor-Netzwerk, dem Debian Betriebssystem, dem GNOME Desktop und den Werkzeugen, die bei Tails mitgeliefert werden. Wir teilen unsere Verbesserungen, so dass viele Menschen von unserer Arbeit profitieren. Lesen Sie auch: Verhältnis zum Upstream Beitragen Das Tor-Projekt Debian GNU/Linux GNOME Kontakt Tails installieren"
year_published = 2025
