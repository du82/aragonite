["https://tailscale.com/privacy-policy"]
title = "Privacy Policy · Tailscale"
description = "Tailscale values and respects your privacy. We've prepared this privacy policy to explain the manner in which we collect, use and disclose personal information through your use of Tailscale. Please contact us if you have any questions."
full_description = '''Tailscale Privacy Policy Effective Date: 2023-07-05 Tailscale, Inc. ("Tailscale", "we", "our" or "us") allows customers and individuals to directly connect servers, computers, mobile devices, and cloud instances in a simple mesh VPN network, in which every connection is encrypted. Tailscale is committed to transparency in our processing of information. This Privacy Policy describes how we collect, use, disclose and protect information from and about you through our website www.tailscale.com and any other website or mobile application that links to this Privacy Policy (the "Site"), mesh VPN services (the "Tailscale Solution"), and any other interactions (e.g., customer support, events, our social media pages, and other communications) that you may have with us (all of these offerings collectively referred to herein as the "Services"). PLEASE READ THIS PRIVACY POLICY CAREFULLY TO UNDERSTAND HOW WE HANDLE YOUR INFORMATION. IF YOU DO NOT AGREE TO THIS PRIVACY POLICY, PLEASE DO NOT USE THE SERVICES. Contents 1. SCOPE OF THIS PRIVACY POLICY 2. THE INFORMATION WE COLLECT 3. HOW WE USE YOUR INFORMATION 4. LEGAL BASES FOR USE OF YOUR INFORMATION 5. HOW WE DISCLOSE YOUR INFORMATION 6. RETENTION OF YOUR INFORMATION 7. YOUR RIGHTS AND YOUR CHOICES 8. THIRD PARTY LINKS AND FEATURES 9. INTERNATIONAL USERS 10. HOW WE PROTECT YOUR INFORMATION 11. PRIVACY INFORMATION FOR CERTAIN U.S. STATE RESIDENTS 12. CHANGES TO OUR PRIVACY POLICY 13. CONTACT US 1. SCOPE OF THIS PRIVACY POLICY Please note that this Privacy Policy applies where Tailscale is a "data controller" of your information. This includes when we collect information from and about visitors to our websites ("Site Visitors"), prospective users and customers ("Prospects"), as well as users of the Tailscale Solution ("Users"), collectively referred to herein as "you." In providing our Services, we may process certain information about Users on behalf of organizations that have contracted to use the Tailscale Solution under a Master Services Agreement or Terms of Service ("Customers"). In such circumstances, our Customers are the data controllers and we are the "data processor" or "service provider," depending on applicable law. This means that our Customers are responsible for processing information in accordance with their own privacy policies and practices, and otherwise complying with applicable data protection laws. When we act as a data processor, we will only process information about Users using our Customers' accounts according to the Customers' instructions and the applicable data processing agreement we have in place with our Customers, or as otherwise required by applicable law. In such circumstances, if you have any questions about the processing of your information, or would like to make any requests regarding your information, please contact the Customer for assistance. 2. THE INFORMATION WE COLLECT We collect, store and use certain information from or about you for the purposes described below. INFORMATION YOU PROVIDE TO US We collect a variety of information that you provide directly to us. For example, we collect information from you through: Your registration to use the Services Your use of the Services Your participation in product demos and webinars Your communications with our support/sales teams Requests or questions you submit to us via online forms, email, or otherwise Your participation in surveys, research, sweepstakes, or contests When you communicate with our customer support teams via email, phone, videoconferencing, or chat (e.g., you email, video chat, open a support ticket, file a feature request, tweet at us, etc. for customer support) When you attend our conferences or events or interact with us at other conferences or events When you sign up for our newsletters When you use a blog or forum made available through the Services (for example, if you comment on a post or submit a question) The types of data we collect directly from you include: First and last name Email address or username Postal/billing address Telephone number Log-in authentication information Your company or organization name Your title Any other information you choose to directly provide to us in connection with your use of the Services INFORMATION WE COLLECT THROUGH AUTOMATED MEANS Tailscale Solution Information. When you use the Tailscale Solution, we collect limited metadata regarding your device used to access the Tailscale Solution, such as: the device name; relevant operating system type; host name; IP address; cryptographic public key; user agent (where applicable); language settings; date and time of access to the Tailscale Solution; logs describing connections and containing statistics about data sent to an from other devices ("Inter-Node Traffic Logs"); and version of Tailscale Solution installed. This information is needed to provide the Tailscale Solution to you. However, please note that Tailscale does not process, or have the ability to access, the content of User traffic data transmitted through the Tailscale Solution, which is fully end-to-end encrypted. Customers have the option, in their discretion, to use certain features and functionalities through the Tailscale Solution that may generate additional logs and other data that is sent to Tailscale for processesing and storage on behalf of our Customers ("Customer Log Data"). The Customer, and not Tailscale, has control over the contents of Customer Log Data processed through the Tailscale Solution using such additional features and functionalities. Tailscale will process Customer Log Data in accordance with the applicable data processing agreement with the Customer and this Privacy Policy. As you use the Services, we also collect aggregated usage statistics (such as the amount of data transmitted through the Tailscale Solution over a period of time, and information about how you're using the Tailscale Solution). Please note that to the extent such aggregated information or the metadata discussed above that we collect through your use of the Tailscale Solution cannot be used to identify you or your device, we can use and disclose such information in our discretion as discussed in the "Aggregate/De-Identified" Information section below. Site Information. When you use our Site, we automatically collect certain information about your device and how you use the Site, including your IP address, browser type, browser language, operating system, the state or country from which you accessed the Services, software and hardware attributes (including device IDs), referring and exit pages and URLs, platform type, the number of clicks, files you download, domain names, landing pages, pages viewed and the order of those pages, the amount of time spent on particular pages, the date and time you used the Services, error logs, and other similar information. From your IP address, we may be able to infer your general location (e.g., city/state or postal code). To collect Site information, we and our service providers may use "cookies" or similar tools that track, measure, and analyze the behaviors and usage patterns of our Site Visitors. Cookies are small data files that can be stored on your browser and device so we can recognize you when you return. We use cookies for analytics purposes, to deliver certain features of the Site, to help us understand how users engage with the Site, and to improve your experience with the Site. You may set your web browser to notify you when you receive a cookie and to accept or refuse certain cookies. However, if you elect not to accept cookies, some functionality and areas of the Site may be restricted. To learn how to manage your cookies, please follow the instructions from your specific browser, or if accessing the Site via a mobile device, refer to the manufacturer's instructions. INFORMATION WE COLLECT FROM OTHERS From time to time, we may collect information about Prospects from other sources, including partners, data enhancement services, conferences, and other industry events or other purposes that we explain to you at the time of collection, to the extent permitted by applicable law. We use this information to supplement the information that we collect directly from Prospects in order to better understand our Prospects' interests and to provide them with more relevant information, and to improve our analytics and advertising. We may offer you the opportunity to engage with or log into the Services using third-party social networking sites or other third-party applications. When you log into the Services through these third-party mechanisms, we may collect certain information associated with your account on the third party's site (e.g., name, username or email address, or profile picture), in accordance with your privacy settings on those sites, in order to create and manage your account, or as part of the operation of the third party's website, plug-in or application. The third-party's privacy policy, and not ours, will govern the information disclosed to us through the use of these log-in methods. When you "like" or "follow" us on Facebook, LinkedIn, Twitter or other social media sites, we may collect some information from you including your name, username, email address, and any comments or content you post relevant to us. 3. HOW WE USE YOUR INFORMATION We use your information for various purposes depending on the types of information we have collected from and about you, to: Provide the Tailscale service: Provide you with access to and to administer our Services Provide customer support: Respond to your requests for information and provide you with more effective and efficient customer support Send marketing communications: Contact you by email, postal mail, or phone with news, updates, information, promotions, surveys or contests relating to the Services or other services that may be of interest to you, in accordance with applicable legal requirements related to such communications Customize the content you see on our Site Conduct customer research: Engage in analysis and research regarding use of the Services, and improve our Services Secure our Services and resolve technical issues being reported Meet legal requirements: Comply with any procedures, laws, and regulations which apply to us where it is necessary for our legitimate interests or the legitimate interests of others Establish, exercise, or defend our legal rights where it is necessary for our legitimate interests or the legitimate interests of others Aggregate/De-Identified Information. We may aggregate and/or de-identify any information collected through our Services so that such information can no longer be linked to you or your device ("Aggregate/De-Identified Information"). We may use such information for any purpose, including without limitation for research, and may also disclose such data with any third parties, including our third-party partners. 4. LEGAL BASES FOR USE OF YOUR INFORMATION The legal bases for using your information as set out in this Privacy Policy are as follows: Where we need to perform the contract we are about to enter into or have entered into with you for the Services Where it is necessary for our legitimate interests (or those of a third party) and your interests and fundamental rights do not override those interests Where we need to comply with a legal or regulatory obligation Where we have your consent to process your information in a certain way SITE ANALYTICS AND ADVERTISING ANALYTICS. We may use third-party web analytics services (such as those of Segment Analytics) on our Site to collect and analyze usage information through cookies and similar tools; engage in auditing, research, or reporting; assist with fraud prevention; and provide certain features to you. To prevent Segment Analytics from using your information for analytics, you may use the Segment consent management tool by emailing us using the Contact Us information below. If you receive email from us, we may use certain analytics tools, such as clear GIFs to capture data such as when you open our message or click on any links or banners our email contains. This data allows us to gauge the effectiveness of our communications and marketing campaigns. ONLINE ADVERTISING. In using the Site, we allow select third party advertising technology partners to place cookies or other tracking technologies on the browser of your device to collect information about you as discussed above. These third parties (e.g., ad networks and ad servers such as Google) may use this information to serve relevant content and advertising to you as you browse the Internet, and access their own cookies or other tracking technologies on your browser to assist in this activity. If you are interested in more information about these online advertising activities, and how you can generally control cookies from being put on your computer to deliver tailored advertising, you may visit the Digital Advertising Alliance of Canada, Network Advertising Initiative's Consumer Opt-Out link, the Digital Advertising Alliance's Consumer Opt-Out link, or Your Online Choices to opt-out of receiving tailored advertising from companies that participate in those programs. We do not control these opt-out links or whether any particular company chooses to participate in these opt-out programs. We are not responsible for any choices you make using these mechanisms or the continued availability or accuracy of these mechanisms. Please note that if you use these mechanisms, you may still see advertising on the Internet, but it will not be tailored to you based on your online behavior over time. Do Not Track ("DNT") is a privacy preference that users can set in certain web browsers. We are committed to providing you with meaningful choices about the information collected on our Services for third party purposes, and that is why we provide the variety of opt-out mechanisms listed above. However, we do not currently recognize or respond to browser-initiated DNT signals. 5. HOW WE DISCLOSE YOUR INFORMATION We will disclose your information in the following ways: Service Providers. We provide access to or disclose your information to select third parties who help us deliver our Services or perform services on our behalf, including billing and credit card verification, advertising and marketing, content and features, analytics, research, customer support, data storage, security, web hosting, fraud prevention, and legal services. Affiliates and Subsidiaries. We may disclose the information we collect within the Tailscale family of companies. Your Organization. If you are a User using the Tailscale Solution under an organization's account, we may provide your information to the organization you are engaged or employed by in order to fulfill and enforce our services agreement with your organization, and to inform your organization regarding usage, support, or training needs. Protection of Tai'''
