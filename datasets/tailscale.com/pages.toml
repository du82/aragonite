["https://tailscale.com/security-bulletins"]
title = "Security Bulletins · Tailscale"
description = "Security notifications affecting the Tailscale client and service  Read our incident disclosure and notification policy. If you’re directly affected by a security issue in Tailscale, and we have your contact information, we will contact you."
full_description = "Dec 4, 2024TS-2024-013Description: Potential for Tailscale SSH recording failures What happened? Tailscale SSH recording deployments that enforce SSH recording using enforceRecorder could fail to record session activity in several situations. Failure to write to the storage backend If tsrecorder instances were unable to write to their configured storage, SSH sessions would be allowed to execute for a few seconds (typically under one or two) while the first output bytes failed to write. A tsrecorder instance can fail to write to its configured storage for many reasons, including: Misconfigured IAM permissions when using S3 for storage. Misconfigured file permissions when using the local filesystem for storage. Insufficient free space when using the local filesystem for storage. tsrecorder now exercises the full set of required storage actions on startup. Unreachable tsrecorder after a session is established If tsrecorder instances became unreachable after a session had started, the SSH session would take several minutes to terminate. This could happen when tsrecorder went offline or when ACLs were updated to restrict access to tsrecorder nodes. The Tailscale client now detects tsrecorder unreachability within 30 seconds and terminates the connection. Who was affected? Users of Tailscale SSH recording with enforceRecorder option and with tsrecorder and Tailscale client versions prior to 1.78.0. What was the impact? Users connecting over Tailscale SSH to nodes that enforce session recording via enforceRecorder ACL flags would have been able to execute commands briefly before having their access terminated due to recording failures. What do I need to do? Update tsrecorder instances and Tailscale clients to version 1.78.0 or later. Oct 2, 2024TS-2024-012Description: Tailscale Funnel abused for phishing What happened? A malicious user abused Tailscale Funnel to host a phishing page targeting Facebook users. This user created multiple free Tailscale accounts to use as an obfuscation/anonymity proxy for their VPS instance hosting the phishing page. We received the first report about a phishing page on September 23rd, 2024, and took down the Funnel page the same day. We received the second report on October 1st, 2024, for the same phishing page on a different Tailscale account. We took down the second page, added detection for new similar pages, and repeatedly shut down new attacker accounts as they were created. After a few more attempts, the attacker stopped creating new accounts. Who was affected? 232 unique IP addresses accessed the attacker's Funnel nodes. Of those, 87 IP addresses made more than one request, suggesting a possible phishing form submission. What was the impact? Some Facebook users could have been phished for their credentials. Since Tailscale Funnel proxies can only see encrypted TLS traffic, we cannot confirm whether anyone was successfully phished. What do I need to do? Don't use Tailscale Funnel for phishing."
year_published = 2024
year_updated = 2025
