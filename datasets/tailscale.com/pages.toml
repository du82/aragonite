title = "Changelog · Tailscale"
description = "View changes to the Tailscale client and service."
full_description = "Feb 26, 2025Tailscale Terraform Provider v0.18.0v0.18.0 of the Tailscale Terraform Provider has been released with the following changes: The tailscale_logstream_configuration resource can now manage streaming to Amazon S3 and S3-compatible services The tailscale_tailnet_key resource can now be imported. Added a reset_acl_on_destroy property to the tailscale_acl resource which optionally allows for resetting the Tailscale policy file to its default when the resource is destroyed. Feb 13, 2025Ashburn and Nuremberg DERP regions Ashburn and Nuremberg are added as DERP regions. We added them December 5, 2024, and apologize for the late notice. Tailscale v1.80.2Update instructionsAll platforms Nodes could lose the display names of owners of peers in rare cases. This had manifested in missing names in tailscale status and could prevent incoming Tailscale SSH connections from being accepted. The behavior is reverted to that of v1.78.x and earlier. Linux SSH clients that skip the none auth method and immediately try publickey can connect to Tailscale SSH as expected. The behavior is reverted to that of v1.78.x and earlier. macOS SSH clients that skip the none auth method and immediately try publickey can connect to Tailscale SSH as expected. The behavior is reverted to that of v1.78.x and earlier. FreeBSD SSH clients that skip the none auth method and immediately try publickey can connect to Tailscale SSH as expected. The behavior is reverted to that of v1.78.x and earlier. Feb 7, 2025Country device posture attribute GA Use ip:country as a geolocation device posture attribute (generally available). Feb 6, 2025Tailscale v1.80.1Update instructionsmacOS System extension uninstalled message no longer appears erroneously when removing third-party system extensions while Tailscale is running. Resolved an issue that could have caused the network extension to crash in rare cases while parsing the macOS routing table. iOS Resolved an issue that could have caused the network extension to crash in rare cases while parsing the iOS routing table. tvOS Resolved an issue that could have caused the network extension to crash in rare cases while parsing the tvOS routing table."
