full_description = '''Plans that work for everyonePersonalBusinessPersonalFor individuals who want to securely connect personal devices, for free.$0Free foreverGet started for freePlan HighlightsLimited to 3 users100 devicesAccess nearly all of Tailscale’s featuresUse Tailscale for free, indefinitelyAdd-on devices for $0.50 each per monthPersonal PlusFor individuals who want to securely connect personal devices with friends and family.$5Per monthGet started for freePlan HighlightsLimited to 6 users100 devicesAccess nearly all of Tailscale’s featuresShare Tailscale with family and friends Add-on devices for $0.50 each per monthStarterFor small teams seeking an easy-to-use and quick-to-deploy secure network access solution.$6Per active user, per monthGet started for freePlan HighlightsUnlimited users100 devices + 10 per userAll of Tailscale’s core featuresLimited ACLsAdd-on devices for $0.50 each per monthPremiumFor growing teams seeking advanced service/resource-level networking and identity-aware access controls.$18Per active user, per monthGet started for freePlan HighlightsUnlimited users100 devices + 20 per userAll of Tailscale’s core featuresFull-fledged ACLsAccess to advanced features like Tailscale SSH and FunnelMDM policiesPriority supportAdd-on devices for $0.50 each per monthEnterpriseFor organizations seeking advanced user and posture management, robust compliance, and dedicated support.CustomContact SalesPlan HighlightsUnlimited usersCustom device limitsSCIM SupportLog streamingAccess to all of Tailscale’s features including Tailnet Lock and SSH session recordingAdditional support optionsAdvanced device posture managementInvoicing and/or annual billing also availableAdd-on devices for $0.50 each per monthTrusted by 10,000+ companiesCompare all plansHave any questions? Check out our product FAQ, licensing FAQ, or contact our sales team.Scroll toBasicsNetworkingAccessApplicationsUsersEndpointsMDMMonitoringInterfacesSupportPaymentPlansPersonalPersonal PlusStarterPremiumEnterpriseUsers & DevicesUsersA user is any distinct email address in your account. Personal includes 3 free users. Starter and Premium offer unlimited users; you pay for the number of active users at the end of your billing cycle.36UnlimitedUnlimitedUnlimitedDevicesA device is any computer, phone, or server with Tailscale installed that's connected to your network. Device limits are pooled across your network.100100100 + 10/user100 + 20/user100 + 20/userAdd-on devices$0.50 each$0.50 each$0.50 each$0.50 each$0.50 eachDesktop & mobile appsVirtual Private NetworkingPeer-to-peer connectionsEstablish direct connections between nodes in your tailnet, to minimize latency.End-to-end encryptionEncrypt all traffic end-to-end with WireGuard&reg;.IPv4 and IPv6Route both IPv4 and IPv6 traffic.Split tunnellingSplit DNS traffic so only traffic to your internal network goes over Tailscale, and everything else goes directly to the internet.Short DNS host names (MagicDNS)Automatically register human readable DNS names with MagicDNS to make it even easier to access devices and services on your network.Exit nodesRoute Internet traffic through a designated egress point on your tailnet, like a traditional VPN.Subnet routersRelay traffic from your tailnet through a gateway to a subnet of VPCs, corporate LANs, physical networks, and more.App connectorsControl access to software as a service (SaaS) applications available over your tailnet.HA failoverExpose the same subnet routers and app connectors on multiple routers to ensure availability even if one router goes offline.IP space collision resolution (4via6 subnet routers)Route traffic to overlapping IPv4 subnets without renumbering with 4via6 subnet routers, by assigning unique IPv6 addresses for each subnet.Regional routingRoute your traffic across distributed HA subnet routers or app connectors based on region.Access controlNetwork-level access policies (ACLs)Precisely define access in your tailnet based on IP address, subnet, or port.ACL testsTest ACLs to make sure they're properly scoped to avoid unnecessary exposure of critical systems on your network.GitOps for ACLsUse a GitOps workflow to centralize management and version-control of your ACLs.On-demand accessUse partner integrations to grant elevated privileges (e.g. on-call), including temporary access, using an approval workflow.Resource-level access policiesUse ACL tags to assign identity to a device in order to enforce access based on roles and groups.Restrict based on purpose (ACL tags)Assign an identity to a device that is separate from human users, and use that identity as part of an ACL to restrict access.Restrict based on groupAllow specific ACL-defined groups to access tagged nodes.autogroups onlyRestrict based on individual userAllow specific ACL-defined users to access tagged nodes.Application NetworkingService accountsPre-authenticate services or nodes (e.g., servers and ephemeral containers) added to your network.Service provisioningAssign an identity to a service or node and restrict access on your tailnet, using ACL tags.Tailscale Kubernetes operatorProvide full ingress and egress connectivity from Kubernetes clusters to non-Kubernetes resources, as well as cross-cluster peering, via Tailscale.Tailscale SSHAuthenticate and encrypt SSH connections between devices in your tailnet, using Tailscale instead of SSH basic auth, keys, certs, or a bastion.Tailscale FunnelRoute traffic from the Internet to a node in your tailnet to publicly share it with anyone, even if they aren’t using Tailscale.User ManagementUser approvalPrevent new users in your organization from joining a tailnet until they’ve been approved by an adminStandard user rolesStandard user roles include owner, admin, and memberAdvanced user rolesAdvanced user roles include billing admin, IT admin, network admin, and auditorSSO with any IdPLog in to Tailscale and manage users with any OIDC identity provider.Custom authentication periodsEnforce that users re-authenticate with your identity provider at an interval you choose. By default, this is every 6 monthsUser & group provisioning (Entra ID + SCIM)Sync group membership and new or deactivated users from Entra ID.User & group provisioning (Okta + SCIM)Sync group membership and new or deactivated users from Okta.Endpoint & Posture ManagementDevice approvalReview and approve new devices and nodes before adding them to your tailnet.Tailnet lockPrevent new, and potentially malicious, nodes from joining your tailnet without first being signed by an already trusted node.Device posture managementUse posture conditions to more granularly control access in your network policies.Postures based on custom attributesAttach custom posture attributes to your devices and use them as part of posture conditions.up to 2up to 2Device posture integrationsAutomatically synchronize device trust information from third-party posture checking tools and use it as part of posture conditions.Mobile Device Management PoliciesCustomize UI VisibilityChange the visibility of UI elements in Tailscale Client menuRuntime configurationsConfigure Tailscale behavior in end user devices eg. Automatically start Tailscale when user logs in, force tailscale to be always on, route all traffic via a specific exit node, and moreConfigure MDM ToolsConfigure and deploy Tailscale using MDM solutions like SimpleMDM, Kandji, Microsoft Intune, JamfMonitoring & ComplianceWebhooksSubscribe to events on your tailnet, and forward those events to any integration or app — like Slack or Microsoft Teams.Configuration audit loggingRecord actions that modify a tailnet's configuration, including type of action, actor, target resource, and time.Network flow loggingRecord network traffic between nodes on your tailnet.Tailscale SSH session recordingCapture and stream terminal sessions over Tailscale SSH for analysis or storage.Log streamingSend real-time network traffic information to any SIEM or observability tool for analysis, or to a bucket for long-term storage.configuration logs onlyconfiguration logs onlyInterfacesUILog in to the tailscale.com admin console to manage users, nodes, and their permissions, on your tailnet.CLIQuickly access information, manage devices or troubleshoot issues with a built-in command-line interface.APIUse the API to manage your network's devices, ACLs, DNS settings, and more.IaCConfigure your tailnet using Terraform or Pulumi.SupportCustomer supportUse the knowledge base or email us to get help with using Tailscale.Priority supportIssue is prioritized based on severity.Additional support optionsContact our sales team for information.Payment OptionsPay by credit cardPay by invoiceAnnual billingOptional Add-onsGet more out of Tailscale with optional add-ons. Available on all plans. Head to the settings page to configure your add-ons.MullvadBrowse the internet privately, and securely with Tailscale and Mullvad.$5Per month for Mullvad on up to 5 devicesGet startedAdd-on devicesIf you’ve run out of devices on your plan and you need to connect more, get more capacity with this add-on.$0.50Per device, per monthGet startedCloud MarketplacesGet started with Tailscale through your preferred cloud marketplace — consolidate billing, and speed up deployment.AWSSimplify procurement by purchasing Tailscale through AWS Marketplace. Take advantage of flexible billing terms and your existing spend commitments/credits.Get startedAzureSeamlessly deploy and manage Tailscale in your Azure infrastructure while consolidating billing and streamlining vendor management.Get started{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does Tailscale have a free trial?","acceptedAnswer":{"@type":"Answer","text":"Yes! Customers who want to use Tailscale for commercial use will get a 14-day trial* of the product with no user limit. Customers who use Tailscale for personal use cases (e.g., homelabs, home VPN etc.) will continue to have access to the free tier plan.\nPlease see here for how we separate personal vs business use cases.\n*Offer terms and conditions."}},{"@type":"Question","name":"How does monthly active user billing work?","acceptedAnswer":{"@type":"Answer","text":"Tailscale will charge you at the end of each month for all active users on your account during that time period. "}},{"@type":"Question","name":"How do we determine who gets access to trials and who stays on the Personal plan?","acceptedAnswer":{"@type":"Answer","text":"We assume customers who sign up for Tailscale using a public domain (e.g., Gmail, Apple, personal GitHub etc.) fall under personal use. These use cases include playing games with friends, or securely connecting to anything from a DigitalOcean droplet to a Raspberry Pi, home security camera, or even a Steam Deck. These customers will automatically get access to the Personal (i.e., free tier) plan upon sign up.\nWe assume customers who sign up with a custom domain (e.g., @acme.com) will fall under the commercial use category. These use cases include securely connecting critical infrastructure - from production clusters, Kubernetes clusters, on-premise databases and more. These customers will get auto-enrolled into a 14-day trial* of the product. Personal users with custom domains can opt-out of the trial (see here for details)."}},{"@type":"Question","name":"What differentiates commercial vs personal use?","acceptedAnswer":{"@type":"Answer","text":"If you sign up for Tailscale with your personal email domain (e.g., a Gmail or Apple email account) or if you explicitly opt-out of the trial, then we will assume you are using Tailscale for personal use. In this scenario, your Tailscale account is owned by you solely for your own personal use. These use cases include playing games with friends, or securely connecting to anything from a DigitalOcean droplet to a Raspberry Pi, home security camera, or even a Steam Deck.\nIf you sign up for Tailscale with your work email or other custom domains (e.g., @acme.com), then we will assume you are using Tailscale for commercial use. In this scenario, the Tailscale account is owned by the company or organization that owns and controls that email domain. Your use of Tailscale with this account is presumed to be for commercial purposes. These use cases include securely connecting critical infrastructure - from production clusters, Kubernetes clusters, on-premise databases and more."}},{"@type":"Question","name":"I am a user with a custom domain (e.g., @myname.com ) who plans to use Tailscale for personal use. Can I opt out of the trial?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can opt out of the trial in the admin console. Once you end the trial, you will be on the Personal plan.\nPlease note, however, that the Personal plan is limited and is not intended for commercial use. If you sign up for Tailscale with your work email or other custom domains (e.g., @acme.com), then the Tailscale account is owned by the company or organization that owns and controls that email domain, regardless of which plan you are on."}},{"@type":"Question","name":"How do device limits work?","acceptedAnswer":{"@type":"Answer","text":"Our Free plan offers the ability to add a maximum of 100 devices. However for our Starter, Premium, and Enterprise plans the total number of allowed devices increases as the number of provisioned users on the network increases. Device limits are pooled across the account.\nFor example: if you have 5 users on the Starter plan, you are entitled to 100 devices + (5 users x 10 devices each) = 150 devices. One user can have 30 provisioned devices and the remaining four users can each have 5 provisioned devices, leaving a pool of 100 devices for shared company resources (e.g. servers or file shares). Devices shared with you as a user don’t count towards your limit."}},{"@type":"Question","name":"What if I need more devices than are available with the number of users I have in my plan? How does add-on device pricing work?","acceptedAnswer":{"@type":"Answer","text":"For example, if you sign up for the Starter plan and have 2 users, you are entitled to 120 devices. If you have 200 devices you want to add to your tailnet, you can purchase 80 more devices for your plan at $0.50 each, without needing to add more users."}},{"@type":"Question","name":"What's the benefit of Access Control Lists (ACLs)?","acceptedAnswer":{"@type":"Answer","text":"ACLs allow your organization to adopt one of the core tenets of Zero Trust networking: least privileged access. Before joining your tailnet every user is authenticated using an identity provider (IdP) such as Okta, Azure AD, or Github. Organizations on certain plans can choose to segment their users into roles and groups (e.g. developer and engineering org) to apply policies at scale. ACL tags, the last piece to this puzzle, allow you to assign an identity to your devices. Once these pieces are in place, your teams can enforce least privilege access across your orga'''
