full_description = "Networking should be simple(r)Tailscale makes it easy to overlay any network topology, enforce the principle of least privilege, and continuously monitor your tailnet.Get startedContact salesAll FeaturesApplication networkingContinuous monitoringLeast privilege accessMobile device managementNetwork connectivityPosture managementServices ManagementUser managementApplication networkingAccelerate application development through 65+ integrations to accommodate any workflow.Auth keysPre-authentication keys automatically register new nodes without having to sign in via a web browser.Learn moreService provisioningACL tags assign an identity to a node that’s used as part of an ACL to restrict access.Learn moreOAuth clientsCreate access tokens for scoped access to the Tailscale API.Learn moreTailscale SSHTailscale brokered and authenticated SSH connection without managing SSH keys.Learn moreTailscale SSH console Initiate browser-based SSH session from the admin console to a designated node.Learn moreTailscale funnelShare a folder or service with the public internet over HTTPS.Learn moreContinuous monitoringCreate a system of record to monitor performance, user-to-node interactions, and potential security incidents.WebhooksCreate event triggers that notify you in real-time via partner integrations.Learn moreConfiguration audit loggingSurface what configuration-based actions occurred, by whom, and when.Learn moreNetwork flow loggingSurface what node-to-node interaction occurred, and when.Learn moreLog streamingNatively stream configuration or network flow logs to our SIEM integration partners.Learn moreTailscale SSH session recordingStore any Tailscale SSH session recording long-term in any S3-compatible service or local disk.Learn moreLeast privilege accessIdentity is weaved directly into the network fabric to safeguard valuable resources with Access Control Lists (ACLs) enforceable at the node level.Access control lists (ACLs)Create RBAC policies to determine which users, roles, or groups can access, which nodes on your tailnet.Learn moreACL testsVerify ACLs coverage provides sufficient coverage against unnecessary exposure.Learn moreGitOps for ACLsManage ACLs version control within a CI/CD workflow using GitHub or GitLab.Learn moreOn-demand accessPartner integrations allow administrators to provide time-bound, elevated privileges for users.Learn moreSeparation of administrative dutiesAdministrative roles with varying privileges to manage your tailnet.Learn moreMobile device managementTailor Tailscale for the needs of your business with UI customization, auto-updates, runtime configurations and more, all integrated with your favorite Mobile Device Management solution.System PoliciesCustomize Tailscale using system policiesLearn moreMDM solution integrationsConfigure and deploy Tailscale using MDM solutionsLearn moreNetwork connectivitySecurely connect users, devices, and services across any infrastructure without interruptions.Peer-to-peer connectionsTailscale uses WireGuard VPN protocol to establish low-latency, peer-to-peer connections.Learn moreEnd-to-end encryptionTailscale uses WireGuard VPN protocol for end-to-end encryption.Learn moreSplit tunnelingSplit tunneling only routes internal traffic through the VPN for improved latency.Learn moreHA subnet routersEnsure users can still access resources if a routing device becomes unavailable.Learn moreShort DNS host namesMagicDNS automatically registers DNS names as human-readable for better discoverability.Learn moreSearch domainsEnsure users can still access resources if a routing device becomes unavailable.Learn moreIP space collision resolutionRoute traffic to overlapping IPv4 subnets without renumbering with 4via6 subnet routers, by assigning unique IPv6 addresses for each subnet.Learn moreExit nodeRoute all traffic through a designated egress point, similar to a privacy VPN.Learn morePosture managementHarden your security posture with built-in features to continuously enforce node-level policies.Device approvalRequire devices to be approved by an administrator before joining the tailnet.Learn moreTailnet lockA predetermined trusted node must verify the trusted keys of any nodes attempting to join your tailnet.Learn moreDevice posture managementCollect device attributes and use them as part of connectivity rules within your Tailnet to limit access for devices that do not meet security requirements.Learn moreDevice posture integrationsConfigure EDR integrations like Crowdstrike to use their custom attributes as part of device posture checks for your Tailnet.Learn moreServices ManagementMonitor and safely share access to services running on machines on your tailnet.Node sharingShare a node with any Tailscale user on any tailnet without exposing it to the public internet.Learn moreTaildropTransfer sensitive or large files with minimal latency between devices.Learn moreServicesMonitor services on your tailnet in one central location.Learn moreHTTPS certificatesEnable HTTPS when connecting with web APIs or browsers to encrypt communications.Learn moretsnetEmbed Tailscale inside Go programs to run multiple services on a single machine to create tools like golinks.Learn moreUser managementCreate intuitive workflows to streamline user access with SSO, IdP, and SCIM support.SSO with IdPUsers can authenticate using one of our supported identity providers to access the tailnet.Learn moreUser approvalRequire users to be approved by an administrator before gaining access to the tailnet.Learn moreCustom authentication periodsRequire users to re-authenticate regularly.Learn moreCustom OIDC providerUsers can authenticate themselves using their organization’s custom OIDC.Learn moreUser & group provisioning (SCIM)Sync users and group settings from one of our supported IdPs to keep ACLs up-to-date.Learn more"
