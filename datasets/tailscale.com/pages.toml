title = "Tailscale's Homelab | Securely Network Devices & Services"
description = "Build a secure, private internet your friends & family can access anywhere. Connect servers, VMs, and devices across platforms like Raspberry Pi, Synology, & macOS."
full_description = "HomelabYour home(lab) away from homeConnect servers, VMs, and devices to create your own personal Internet—a private network you can share with friends & family, and access from anywhere in the world.Get StartedContact SalesTrusted by 10,000+ companies like theseWhat is Tailscale?Tailscale is a free and open source service, built on the WireGuard® protocol, that creates a secure mesh network using encrypted tunnels between your devices.Create a tailnetBuild your own Tailscale network (tailnet), and connect anything from a DigitalOcean droplet to a Raspberry Pi, home security camera, or even a Steam Deck. It’s completely up to you.Access services and devicesOnce you’re all set up with a tailnet, you’ll be able to securely access services and devices from anywhere in the world, as if you’re on the same network.Share nodesShare nodes with friends to give them access to a file server, game server, or anything else on your tailnet (without exposing it to the public internet).Get these benefits and more with TailscaleSecure remote accessUse this drop-in replacement to manage & record shell access into any linux machine without needing to share or manage keys.DNS filteringBlock malicious traffic, ads, and trackers to help secure your network with NextDNS. Traffic encryptionRoute and encrypt internet traffic through an exit node on your tailnet, compatible with integrations like Plex and Apple TV.Built for developersFree for IndividualsTailscale is free for personal use for up to 3 users and 100 devices. Learn more about our pricing here.Built using GoTailscale is an active participant in the Go community, and the majority of the code we write is free and open source. Tools like our `tsnet` library can help you build Tailscale right into your service’s code. $ git commit -m “we love open source”We believe in the power of open source. For users, that means you can run Tailscale using only open source code, For us, that means being good open source citizens, and contributing improvements upstream to the technologies we use. Get these features and more with TailscaleTailscale SSHUse this drop-in replacement to manage & record shell access into any linux machine without needing to share or manage keys.Kubernetes OperatorQuickly route traffic to & from Kubernetes clusters to your Tailnet while keeping services and the control plane off the public internet.Subnet Routers iconEstablish connectivity to entire VPCs or devices where Tailscale can't be installed.IaC IntegrationsEasily deploy Tailscale into cloud and on-prem environments via your IaC provider of choice, including: Terraform, Pulumi, and Ansible.GitOps for ACLsEasily modify and rollback JSON based network configuration directly from GitHub or GitLab.Point-to-Point ConnectivityUsing a global network of servers, Tailscale facilitates direct device-to-device connections across a wide range of NAT gateways.Bring your own IdPUse SSO & MFA from a wide array of supported IdPs to authenticate users onto any Tailnet.Log StreamingNatively stream network flow and configuration audit logs to popular SIEM providers.Regional routing & failoverDeploy a local or global fleet of connectors to increase the performance and availability of connected devices, networks, and services.Pricing that works for everyonePersonalFor individuals who want to securely connect personal devices, for free.$0per active user/monthGet started for freeStarterFor small teams seeking an easy-to-use and quick-to-deploy secure network access solution.$6per active user/monthGet started for freePremiumFor growing teams seeking advanced service/resource-level networking and identity-aware access controls.$18per active user/monthGet started for freeEnterpriseFor organizations seeking advanced user and posture management, robust compliance, and dedicated support.CustomContact Sales"
