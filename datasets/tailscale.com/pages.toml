full_description = "Bring Tailscale to WorkReplace your legacy VPN with Tailscale for hassle-free, zero-config connectivity.Get startedTrusted by 10,000+ companiesGet started with Tailscale for your teamFill out this brief form and we'll get in touch with next steps. And, as a little thank-you for introducing us to your team, we’ll upgrade your Personal plan to Personal Plus—free for an entire year. First name *Last name *Your Work Email *Your Personal Email or GitHub handle *For adding the Personal Plus planWork Domain *Role *Company name *Employee Range *Select...1-99100-249250+utm_campaignutm_sourceutm_mediumEnrich with ClearbitAdd to Salesforce Sync ListTrigger Email Opt In WorkflowTailscale needs the contact information you provide to us to contact you about our products and services. You may unsubscribe from these communications at any time. For information on how to unsubscribe, as well as our privacy practices and commitment to protecting your privacy, please review our Privacy Policy.SubmitRolling out Tailscale for your teamRolling out a new networking solution for your company shouldn’t be a daunting and cumbersome task. Here’s how you can plan your rollout to ensure a cost-effective and seamless adoption of Tailscale to improve your team’s security and performance.Assess your organizations needsIdentify the most critical requirements including number of users, levels of access, types of devices and operating systems that need to connect.Rollout Tailscale incrementallyConduct a trial with a small group to help network admins understand its functionality, identify potential issues, and prepare your team for the update.Define ACLs Tailscale’s access control lists (ACLs) rules can define which users, groups, hosts, and devices can connect to each other. It’s important to define your ACLs up front to ensure granular control.Use Groups and Tags in your ACLsProgram your ACLs to determine which users, roles, or groups can access each resource on your network.Integrate with your existing IdPsUse SSO & MFA from a wide array of supported IdPs to authenticate users onto your Tailscale network.Automate key management with Tailscale SSHUse this drop-in replacement to manage & record shell access into any linux machine without needing to share or manage keys.Read our complete guide to rolling out Tailscale in your company. Fill out the form above, and we’ll reach out to help, or join our monthly office hours with Tailscale Solutions Engineers for live support and answers.Instacart reduces developer disruption with TailscaleFounded in 2012, Instacart is the leading grocery technology company in North America, delivering the future of online grocery shopping. Partnering with over 1,000 retail banners to offer delivery and pickup services from more than 75,000 stores across more than 13,000 cities in North America, Instacart is transforming how people shop, eat, and live.Read storyHow Cribl Enables Secure Work From Anywhere with TailscaleCribl, the data engine for IT and Security, delivers choice to customers by helping them collect, process, route, and analyze their data. Cribl's product suite is purpose-built for IT and Security, and features the industry's leading observability pipeline, an intelligent vendor-neutral agent, and the first-ever search-in-place solution.Read storyLearn more about how companies use TailscaleIn this webinar, we explore why many personal users choose to bring Tailscale to work and highlight the various ways companies use our services."
