title = "Secure Remote Access Service: VPN, SSH, RDP & More | Tailscale"
description = "Simplify secure access to containers, VMs, and bare metal anywhere. Skip bastion hosts, manage SSH access with ease, and ensure end-to-end encryption with Tailscale."
full_description = 'Secure remote accessAccess to any resource, anywhere in the worldReliable and easy access to shared resources like containers, VMs, and bare metal without additional hardware to manage.Get startedTalk to salesTrusted by 10,000+ global companiesConnect your resourcesSecure connections across every user, machine, container, VM, bare metal, and Kubernetes cluster—anywhere. Automate access to critical infrastructure.Automated SSH managementStreamline development with the ability to SSH to any device without extra bastions to manage, public IPs, or high latency.A zero-trust ready Business VPNReplace your insecure legacy VPN—get fine-grained access control with ACLs. Integrate and streamline with device posture, group syncs, mobile device management (MDM), just-in-time (JIT) access, and more.Reduce access complexityUniform SSH accessCreate one secure, shared network to SSH into resources across Google’s GCP, Amazon’s AWS, Microsoft’s Azure, on-prem, and hybrid. Compatible with any environment and OS including Windows, Mac, Linux, and more. Get started for freeConsistently secure networking for the office or the roadBetter collaboration across every user and machine, anywhere. Toss out VPN gateways and bastion hosts for direct connections with better performance. Gain ease of management and flexibility with performant and reliable connections. Get a custom demoSecure access built with developers in mindSecure access developers loveEasily manage shell access to any Linux-based infrastructure and reduce the risk of mismanagement that comes with static SSH keys and manual sharing and rotation.Tailscale SSHSSH made hassle-freeNo need to generate, distribute, and manage SSH keys. Rotate keys with a single command. Encrypt all connections by default.Connect any deviceSSH from any device and across operating systems. Answer an on-call emergency from anywhere.SSO + MFAKeep your existing identity provider (IdP) and multi-factor authentication for streamlined and secure access.Use a modern Business VPNSecure by defaultKeep firewall ports closed, connections open, and under your direct control. Tailscale encrypts everything end-to-end, via WireGuard point-to-point tunnels. No more cloud MITM.Start using a Business VPN3-minute setupConnect your team in minutes with no complex configs. Seamless integration with your existing infrastructure puts secure access at your fingertips.Speed and security on top of WireGuard®Built on WireGuard®, for fast, encrypted connections without the friction of traditional VPNs. Stay secure without sacrificing performance.Preferred by traveling workforces worldwideFrom startups to enterprises, global businesses rely on Tailscale’s VPN alternative to keep their teams securely connected—whether they’re in the office, working remotely, or on the go.Pricing that works for everyonePersonalFor individuals who want to securely connect personal devices, for free.$0per active user/monthGet started for freeStarterFor small teams seeking an easy-to-use and quick-to-deploy secure network access solution.$6per active user/monthGet started for freePremiumFor growing teams seeking advanced service/resource-level networking and identity-aware access controls.$18per active user/monthGet started for freeEnterpriseFor organizations seeking advanced user and posture management, robust compliance, and dedicated support.CustomContact Sales{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What do I need in place to set up a secure VPN for a remote workforce?","acceptedAnswer":{"@type":"Answer","text":"Setting up a Business VPN requires careful planning and consideration of several factors, including:\nNetwork architecture: The VPN should be integrated into the organization’s existing network architecture.\nSecurity protocols: The VPN should use secure protocols such as SSL/TLS or IPsec to encrypt internet traffic.\nAuthentication: The VPN should use multi-factor authentication to ensure that only authorized users can access the company network.\nNetwork segmentation: The VPN should be configured to segment the network into different zones, each with its own access controls and security policies.\nMonitoring and maintenance: The VPN should be regularly monitored and maintained to ensure that it is functioning correctly and securely."}},{"@type":"Question","name":"How do I connect to a network from home?","acceptedAnswer":{"@type":"Answer","text":"Check out our docs."}}]}Frequently asked questionsOver 10,000 Engineering & IT teams use Tailscale’s networking software to secure their work from anywhere, reduce developer disruption, and protect critical infrastructure. Want to learn more? Read our frequently asked questions, or talk to a member of our team.Contact salesWhat do I need in place to set up a secure VPN for a remote workforce?Setting up a Business VPN requires careful planning and consideration of several factors, including:Network architecture: The VPN should be integrated into the organization’s existing network architecture.Security protocols: The VPN should use secure protocols such as SSL/TLS or IPsec to encrypt internet traffic.Authentication: The VPN should use multi-factor authentication to ensure that only authorized users can access the company network.Network segmentation: The VPN should be configured to segment the network into different zones, each with its own access controls and security policies.Monitoring and maintenance: The VPN should be regularly monitored and maintained to ensure that it is functioning correctly and securely.How do I connect to a network from home?Check out our docs.'
