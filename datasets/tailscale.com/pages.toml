title = "Secure Your Network with Tailscale DNS and MagicDNS"
description = "Tailscale DNS and MagicDNS provide fast, secure DNS for your private network (tailnet). Replace IPs with hostnames, improve privacy, and enjoy seamless configuration."
full_description = '{"@context":"https://schema.org","@type":"BlogPosting","image":"https://cdn.sanity.io/images/w77i7m8x/production/f1d94104782c84d346fd16f5f10263c15625adda-600x315.svg","url":"https://tailscale.com/blog/2021-09-private-dns-with-magicdns","headline":"Private DNS with MagicDNS","datePublished":"2021-09-10T00:00:00Z","description":"MagicDNS runs a DNS server on each Tailscale device to quickly and securely serve DNS.","abstract":"MagicDNS runs a DNS server on each Tailscale device to quickly and securely serve DNS.","author":[{"@type":"Person","name":"Brad Fitzpatrick"},{"@type":"Person","name":"David Crawshaw"}],"articleBody":"\n <p>One of Tailscale’s features is called <a href=\"/kb/1081/magicdns/\">MagicDNS</a>. Its main visible\nfeature is that it lets you access all the nodes on your tailnet by\ntheir names instead of the Tailscale IPs.</p>\n<p>That may not sound particularly new; after all, DNS maps names to\nnumbers. Systems like\n<a href=\"https://en.wikipedia.org/wiki/Multicast_DNS\" target=\"_blank\" rel=\"noreferer noopener\">mDNS</a> even do it\nautomatically. What is interesting about MagicDNS is how it can do so\nsecurely, without name lookup information leaving your device, and how\nit can upgrade the security of non-Tailscale DNS queries.</p>\n<h3 id=\"the-current-state-of-dns-security\">The current state of DNS security</h3>\n<p>But first, why are we concerned about DNS security at all? What does\nthat even mean? Why would it be insecure?</p>\n<p>It all dates back to the early days of the Internet (back when it was\ncapitalized) when people largely trusted each other, or at least\ndidn’t know better to not trust each other. Maybe they were more\nfocused on getting computers talking at all rather than worrying about\nsecurity.</p>\n<p>In any case, early DNS was not encrypted or authenticated. Anybody on\nyour network or along its path could see your DNS queries or modify\ntheir responses. You might think today’s internet has since fixed all\nthat insecurity and DNS is secure now. And you would be wrong. Change\ntakes time, especially when it comes to changing big moving Rube\nGoldberg machines like the internet.</p>\n<p>But there’s been progress.</p>\n<p>A reductive history of DNS through the ages, so you don’t need to read\na few dozen RFCs:</p>\n<ul>\n<li><strong>DNS over UDP</strong>: the classic. Hope they get it! Hope nobody\nmodifies it! Hope nobody’s spying on you!</li>\n<li><strong>DNS over TCP</strong>: slower but more reliable. Just as easy to spy on,\nmarginally but not really harder to tamper with.</li>\n<li><strong>DNSSEC</strong>: maybe we could put keys in DNS and then sign things?\nThis has been <a href=\"https://stats.labs.apnic.net/dnssec\" target=\"_blank\" rel=\"noreferer noopener\">dragging on for\nages</a>, kinda like IPv6. It’s\nalso <a href=\"https://cr.yp.to/talks/2016.12.08/slides-djb-20161208-dnssec-a4.pdf\" target=\"_blank\" rel=\"noreferer noopener\">not exactly loved</a>\nby everybody. DNSSEC does have some merits,\nbut it’s largely outside the scope of this post. For our purposes,\nthe security we care about is the confidentiality and integrity of\nDNS traffic from your Tailscale devices and your resolver.</li>\n<li><strong>DoT</strong>: DNS over TLS over TCP. Put some TLS on it. Now people can’t\nspy on traffic between your DNS client and your resolver.</li>\n<li><strong>DoH</strong>: DNS over HTTP over TLS over TCP (or over QUIC, a blend of\nall those protocols) This is like DoT but with some HTTP smeared\nin the protocol sandwich. Everybody loves HTTP.</li>\n</ul>\n<p>Ignoring DNSSEC:</p>\n<table>\n <tbody><tr>\n <th></th>\n <th>UDP DNS</th>\n <th>TCP DNS</th>\n <th>DoT</th>\n <th>DoH</th>\n </tr>\n <tr>\n <td><b>Transport</b></td>\n <td>UDP</td>\n <td>TCP</td>\n <td>TCP</td>\n <td>TCP or QUIC (UDP)</td>\n </tr>\n <tr>\n <td><b>Cold start round-trips</b></td>\n <td>1</td>\n <td>3-4</td>\n <td>1-2 more</td>\n <td>Same as DoT; better with QUIC</td>\n </tr>\n <tr>\n <td><b>Security</b></td>\n <td>-</td>\n <td>-</td>\n <td>TLS</td>\n <td>TLS</td>\n </tr>\n <tr>\n <td><b>HTTP?</b></td>\n <td>-</td>\n <td>-</td>\n <td>-</td>\n <td>yes</td>\n </tr>\n <tr>\n <td><b>Client/OS support</b></td>\n <td>everything</td>\n <td>nearly everything</td>\n <td>minimal</td>\n <td>browsers, the new OSes</td>\n </tr>\n</tbody></table>\n<h3 id=\"how-magicdns-works\">How MagicDNS works in Tailscale</h3>\n<p>Tailscale runs a DNS server built-in on every node, running at\n<code>100.100.100.100</code>.</p>\n\n \n \n\n<figure class=\"image-wide\">\n <img src=\"https://cdn.sanity.io/images/w77i7m8x/production/fb9bf0eb5b458e90dea83922f5e74b8ccd80cc75-1914x630.png\">\n \n</figure>\n\n<p>Yes, Tailscale on your phone includes a DNS server. (We admit that\n“even on your phone!” is a little silly when phones are basically\nsupercomputers these days.)</p>\n<p>The IP <code>100.100.100.100</code>, usually pronounced “quad one hundred,” is part\nof the <a href=\"/kb/1015/100.x-addresses/\">private Carrier-Grade NAT\nrange</a>. That means,\njust like IPs in the common private ranges, <code>192.168.1/24</code>, <code>172.16/12</code>,\nand <code>10/8</code>, it is not routable on the public internet. So when software\non your computer sends a traditional, unencrypted UDP packet to\n<code>100.100.100.100</code>, no standard router will send it anyway.</p>\n<p>We then tell your OS that its DNS server is <code>100.100.100.100</code>. Because\noperating system DNS clients are largely stuck in 1987, they then\nforward all their DNS queries over old-school insecure UDP DNS to\n<code>100.100.100.100</code>. Tailscale also installs a route to <code>100.100.100.100/32</code>\nback into Tailscale and it then hands those packets over to\nTailscale’s built-in DNS server, so unencrypted queries don’t leave\nyour device.</p>\n<h3 id=\"push-not-pull\">Push, not pull</h3>\n<p>Now it is time for MagicDNS to answer queries. For resolving public\ndomains (e.g. “wikipedia.org”) the local Tailscale process will\nforward the query onto whatever name server your OS was originally\nconfigured with, or whatever name server you override it within your\nTailscale admin settings. For looking up private names on your\ntailnet: the query goes nowhere! Instead, when your local Tailscale is\nconfigured with a map of your tailnet, it is pushed all of the private\nDNS names your computer has access to. In addition to there being no\nexternal service that can log your private name lookups, there is an\nextra benefit to a push-based DNS database for small networks (where\n“small” means “not billions”): no TTL.</p>\n<p>In standard DNS, every query response includes a Time To Live\n(TTL). Your local computer, and other, usually helpful, intermediaries\nlike your local network router will store a copy of a query response\nfor however long the TTL says it can. Your subsequent queries look in\nthe stored cache and if the record has not expired yet, no new lookup\nis done.</p>\n<p>That is great for saving bandwidth and more importantly, latency when\nyou use a program that makes many separate connections to the same\ndestination. But it has a downside: if you change your DNS records for\na domain, they don’t propagate completely until the TTL has expired in\nall the cached resolvers around the internet. That is fine for large\npublic sites, there are several workarounds engineers use to change\nrecords slowly without breaking anyone. But it can be extremely\nannoying when configuring and reconfiguring your own personal\nnetwork. We want to see changes immediately. That is a benefit to the\npush-based approach: as soon as you change your tailnet, by adding a\nhost or editing a name, the new network map is immediately sent to\nevery computer in your tailnet and the new name is there ready to\ngo. No need to think about caching resolvers in home internet routers.</p>\n<h3 id=\"fun-with-magicdns\">Key Features of MagicDNS in Tailscale</h3>\n<p>Once the MagicDNS resolver has the queries, we can do fun things:</p>\n<ul>\n<li>We can answer things directly, so you can <code>ssh pi@dogcam</code> and get to\nyour device <code>dogcam</code> by name, rather than remembering <code>ssh pi@100.127.2.95</code>. The latency on such queries is great, too, since\nwe never need to go get the results from the internet; they’re all\nin memory.</li>\n<li>We can race DNS answers from different upstreams servers (when\nappropriate).</li>\n<li>If your upstream DNS (or one of your upstream DNS servers) is a\nTailscale IP or behind a Tailscale subnet router, we can forward\nplain old UDP DNS over Tailscale so they’re encrypted with WireGuard</li>\n<li>If your upstream DNS supports DoH, the MagicDNS forwarder can then\nbe a DoH client to query Cloudflare <code>1.1.1.1</code>, Google Public DNS\n<code>8.8.8.8</code>, or Quad9 <code>9.9.9.9</code>, without anybody able to see or mess with\nyour traffic.</li>\n</ul>\n<h3 id=\"future-work\">Future work</h3>\n<p>MagicDNS is still in beta because we’re not entirely done with all the\nfeatures we’d like to add and fixing the long tail of OS integrations\n(<a href=\"/blog/sisyphean-dns-client-linux/\">it can be a nightmare</a>).</p>\n<p>Some of the features we’re exciting about adding:</p>\n<ul>\n<li>Relaying DNS queries over Tailscale through <a href=\"/kb/1103/exit-nodes/\">Exit\nNodes</a>, when you’re using an exit node.</li>\n<li>Letting you add extra, custom records into your tailnet that all\nclients then answer directly, without forwarding.</li>\n<li>Arbitrary DoT and DoH client support to hit arbitrary upstream\nresolvers. (Currently we just hardcode the most used ones)</li>\n</ul>\n<h3 id=\"try-it-out\">Try it out</h3>\n<p>To enable MagicDNS, go to the DNS settings of the admin console at\n<a href=\"https://login.tailscale.com/admin/dns\" target=\"_blank\" rel=\"noreferer noopener\">https://login.tailscale.com/admin/dns</a> and click “Enable MagicDNS”.</p>\n<p>If you’re using split DNS, the built-in <code>100.100.100.100</code> MagicDNS\nresolver won’t be used unless it’s needed to resolve a name in your\ntailnet. To force your clients to use DoH for their upstream queries,\nyou can click <em>“Override local DNS”</em> and set a global nameserver to\nGoogle (<code>8.8.8.8</code>), Cloudflare (<code>1.1.1.1</code>), or Quad9 (<code>9.9.9.9</code>) IPs.</p>\n<p>Individual devices can opt-out of the tailnet-wide DNS settings by\nopening the Tailscale app and unchecking <em>“Use Tailscale DNS\nSettings”</em> under <em>“Preferences”</em> or using the <code>tailscale up --accept-dns=false</code> option on the CLI.</p>\n<p>Your nodes are assigned automatic DNS names based on their hostnames,\nadding numeric suffixes as needed to resolve conflicts. To change\ntheir DNS names, go to the <a href=\"https://login.tailscale.com/admin/machines\" target=\"_blank\" rel=\"noreferer noopener\">machines\npage</a> in the admin console,\nclick the three dots on the right of a device to rename, and choose\n<em>“Edit machine name…”</em></p>\n\n "}Blog|September 10, 2021Private DNS with MagicDNS One of Tailscale’s features is called MagicDNS. Its main visible feature is that it lets you access all the nodes on your tailnet by their names instead of the Tailscale IPs. That may not sound particularly new; after all, DNS maps names to numbers. Systems like mDNS even do it automatically. What is interesting about MagicDNS is how it can do so securely, without name lookup information leaving your device, and how it can upgrade the security of non-Tailscale DNS queries. The current state of DNS security But first, why are we concerned about DNS security at all? What does that even mean? Why would it be insecure? It all dates back to the early days of the Internet (back when it was capitalized) when people largely trusted each other, or at least didn’t know better to not trust each other. Maybe they were more focused on getting computers talking at all rather than worrying about security. In any case, early DNS was not encrypted or authenticated. Anybody on your network or along its path could see your DNS queries or modify their responses. You might think today’s internet has since fixed all that insecurity and DNS is secure now. And you would be wrong. Change takes time, especially when it comes to changing big moving Rube Goldberg machines like the internet. But there’s been progress. A reductive history of DNS through the ages, so you don’t need to read a few dozen RFCs: DNS over UDP: the classic. Hope they get it! Hope nobody modifies it! Hope nobody’s spying on you! DNS over TCP: slower but more reliable. Just as easy to spy on, marginally but not really harder to tamper with. DNSSEC: maybe we could put keys in DNS and then sign things? This has been dragging on for ages, kinda like IPv6. It’s also not exactly loved by everybody. DNSSEC does have some merits, but it’s largely outside the scope of this post. For our purposes, the security we care about is the confidentiality and integrity of DNS traffic from your Tailscale devices and your resolver. DoT: DNS over TLS over TCP. Put some TLS on it. Now people can’t spy on traffic between your DNS client and your resolver. DoH: DNS over HTTP over TLS over TCP (or over QUIC, a blend of all those protocols) This is like DoT but with some HTTP smeared in the protocol sandwich. Everybody loves HTTP. Ignoring DNSSEC: UDP DNS TCP DNS DoT DoH Transport UDP TCP TCP TCP or QUIC (UDP) Cold start round-trips 1 3-4 1-2 more Same as DoT; better with QUIC Security - - TLS TLS HTTP? - - - yes Client/OS support everything nearly everything minimal browsers, the new OSes How MagicDNS works in Tailscale Tailscale runs a DNS server built-in on every node, running at 100.100.100.100. Yes, Tailscale on your phone includes a DNS server. (We admit that “even on your phone!” is a little silly when phones are basically supercomputers these days.) The IP 100.100.100.100, usually pronounced “quad one hundred,” is part of the private Carrier-Grade NAT range. That means, just like IPs in the common private ranges, 192.168.1/24, 172.16/12, and 10/8, it is not routable on the public internet. So when software on your computer sends a traditional, unencrypted UDP packet to 100.100.100.100, no standard router will send it anyway. We then tell your OS that its DNS server is 100.100.100.100. Because operating system DNS clients are largely stuck in 1987, they then forward all their DNS queries over old-school insecure UDP DNS to 100.100.100.100. Tailscale also installs a route to 100.100.100.100/32 back into Tailscale and it then hands those packets over to Tailscale’s built-in DNS server, so unencrypted queries don’t leave your device. Push, not pull Now it is time for MagicDNS to answer queries. For resolving public domains (e.g. “wikipedia.org”) the local Tailscale process will forward the query onto whatever name server your OS was originally configured with, or whatever name server you override it within your Tailscale admin settings. F'
