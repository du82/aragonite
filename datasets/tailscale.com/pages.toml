full_description = "Replace Your Legacy VPN with TailscaleRegister nowSecurityTailscale for security teamsShrink the risk surface area for your organizationGet StartedContact SalesTrusted by security teams at companies like theseSafeguard users, devices, and any type of workload.Secure usersDynamically manage the user and group lifecycle with SCIM. Authenticate network access with SSO & MFA.Secure devicesContinuously verify devices meet certain conditions to retain access to your organization’s private network.Secure workloadsExplicitly authorize which users and services can communicate. Layer on additional security measures like SSH session recording.Strengthen your security postureOn-demand accessProvide just-in-time, time-bound, elevated access to employees such as on-call engineers using one of our partner's integrations.EDR integrationsIntegrate EDRs like Crowdstrike to enable device identity collection and supercharge device posture by leveraging the Zero Trust Assessment score to determine trustability.Streaming audit logsStream configuration audit logs, network flow logs, and SSH sessions into your preferred SIEM to surface any potentially anomalous activity.Zero Trust with TailscaleLeast-privileged access with an adaptive policy engineTailscale’s policy engine operates in least-privileged mode by default. Users, devices, groups, and tags must have explicitly assigned permissions for access.Continuous verificationGet continuous verification with machine and user identity built into every single request. Automatically maintain access levels based on user and device state.Active assuranceCombine system events, network flow logs, and audit logs with SSH session recording and Tailscale's check mode to drive active assurance. Quarantine devices with known IoC in seconds.Get these features and more with TailscaleEnd to End EncryptionTailscale brings end-to-end WireGuard to the networking layer, ensuring each and every connection is encryptedTailscale SSHUse this drop-in replacement to manage & record shell access into any linux machine without needing to share or manage keys.Log streamingStream configuration or network flow logs into a security information and event management (SIEM) system.IaC IntegrationsEasily deploy Tailscale into cloud and on-prem environments via your IaC provider of choice, including: Terraform, Pulumi, and Ansible.GitOps for ACLsEasily modify and rollback JSON based network configuration directly from GitHub or GitLab.ACL TestsDefine ACL tests and ensure changes don't unintentionally allow access to resources.Device posture managementIntegrate into your existing device posture management tools: CrowdStrike, SentinelOne, InTune, Jamf, Kanji and more.Device approvalReview and approve new devices before they can your network.Bring your own IdPTailscale works on top of your identity provider (IdP), including support for custom OpenID Connect (OIDC) providersPricing that works for everyonePersonalFor individuals who want to securely connect personal devices, for free.$0per active user/monthGet started for freeStarterFor small teams seeking an easy-to-use and quick-to-deploy secure network access solution.$6per active user/monthGet started for freePremiumFor growing teams seeking advanced service/resource-level networking and identity-aware access controls.$18per active user/monthGet started for freeEnterpriseFor organizations seeking advanced user and posture management, robust compliance, and dedicated support.CustomContact Sales"
