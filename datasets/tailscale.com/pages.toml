["https://tailscale.com/careers"]
title = "Careers at Tailscale · Tailscale"
description = "When the Internet began, people thought connecting everyone together, sharing information freely, and injecting a healthy dose of anarchism would lead to a strong, healthy society. Not really how it turned out, is it? We started Tailscale because we want to change course and fix what went wrong. Step one is to undo damage from the misguided idea that bigger and more popular means better, and that everything needs to be connected to everything else. Botnets don’t need to be connected to your HR database. The private discussion forum with your friends doesn’t need to be connected to paid propaganda farms. And teams don’t have to be made out of interchangeable lego bricks. The dream we’re building is the Internet, but better. Small, private, secure, distributed networks that you can only join if you’re invited. Real communities of real people, unbound from the limits of physical space, but interconnected with the wider world through a lens of mutual obligations, intentionality, and consent."
