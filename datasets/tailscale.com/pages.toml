["https://tailscale.com/company"]
title = "We're Building the New Internet | About Tailscale"
description = "Learn about Tailscale as a company and our mission: to remove the overhead and complexity of building a trusted, secure network."
full_description = "We’re building the new internetTrusted, human-scale networks.We’re returning to the original vision of the Internet. We want to help everyone create their own secure networks built around people and their connections.Whether you want to connect with your co-workers to share a prototype, the company database to securely access information, or your family members to share files and photos, Tailscale makes networking safe and understandable.We’re working to remove overhead and complexity from the “long tail” of software and operational problems that people face every day. By making connectivity easier and more secure, we empower teams to build systems that scale, without scaling overhead.Our guiding principlesReal people solving concrete problemsDecentralization, encryption, and scalability are means to an end, not the ends in themselves. We’re here to solve tech problems for diverse teams in diverse industries, and our team is diverse and empathetic to match.Small is beautifulWe don’t believe in huge teams or huge clusters. We don’t believe workers are interchangeable. We believe that excellent, small teams produce excellent, beautiful, coherent outcomes that large teams, and large networks, just can’t replicate.It has to “just work”This should be standard, but surprisingly it’s not, because system reliability is hard. It might not be glamorous or shiny, but our job is to do the boring parts and get out of the way, so customers can get back to the work that matters to them.Our commitmentsPutting people firstListening to a range of voices leads to a product and a company that’s better for everyone. As a diverse team we work together to understand the challenges our users face. This allows us to build a product that makes physical and virtual communities feel successful, safe and secure.An inclusive workplace starts with a team that is not bound by geographical location, lifestyle, or life stage, which is why we are proudly, and always have been, a fully remote company with flexible working hours. Whether a mid-afternoon kids’ soccer match, time with family on the other side of the country, or an emergency vet visit, employees are trusted and respected to manage their time and projects around their life.Diverse teams have diverse interests and voices. Whether on the Tailscale blog, or personal Twitter accounts, Tailscale celebrates communicating freely and safely, in each person’s own voice.Supporting open sourceOpen source is the present and future of software development. Writing software ought not be zero-sum. Tailscale is open source at its core. It’s also free for open-source projects.Tailscale is built on WireGuard, specifically wireguard-go. We upstream changes that help other users of the project. We also support WireGuard with financial donations.Many Tailscalars are active in the Go community, and contribute to the project and community. When we develop features that help everyone, we upstream them. And it’s not just Go. Our team has many passions, from NixOS to SQLite.Protecting user privacyPrivacy is a fundamental human right, and we designed Tailscale accordingly. We don’t want your data. Your data is end-to-end encrypted and transmitted point-to-point so we don’t see your packets and don’t have to pay for them, which keeps our costs low, which means our free plan can stay free. We don’t capture any more of your data than needed to provide the service, as in our privacy policy.Tailscale networks are private. Only connect with people you’ve explicitly invited, and only share what and when you want to share.We augment privacy with transparency and knowledge. For example, we make sure you know before you access a shared node, that your public IP address will be visible to admins on that tailnet.We’re hiringOur teamBuilding a better Internet requires a team that is representative of its users. Tailscalars come from a variety of professional, personal, and ethnic backgrounds.Interested in joining our team?View open positionsTrusted by world-class investorsOur team is backed by investors with decades of history with companies like us.Our advisorsWe’re supported by a network of advisors with deep expertise in developer tools, networking security, and more.Amit KumarPartner at Accel and Board MemberAndy McLoughlinPartner at Uncork and Co-founder of HuddleRebecca Liu-DoyleDirector at Insight PartnersReid ChristianPartner at CRVJoseph RuscioPartner at HeavyBit and founder of LibratoJason DonenfeldWireGuard Creator and Technical AdvisorAbel MathewCTO at Sauce Labs and founder of Backtrace.ioRaymond CollettiFormer VP at Codecov, Director at DataDogShelly GlennonAdvisor"
year_published = 2025
