["https://tailwindcss.com"]
title = "Tailwind CSS - Rapidly build modern websites without ever leaving your HTML."
description = "Tailwind CSS is a utility-first CSS framework for rapidly building modern websites without ever leaving your HTML."
full_description = "A utility-first CSS framework packed with classes like flex, pt-4, text-center and rotate-90 that can be composed to build any design, directly in your markup. Tailwind is unapologetically modern, and takes advantage of all the latest and greatest CSS features to make the developer experience as enjoyable as possible. Okay, it’s not exactly cutting edge, but just throw a screen size in front of literally any utility to apply it at a specific breakpoint. This sunny and spacious room is for those traveling light and looking for a comfy and cozy place to lay their head for a night... Show more What’s a website these days without a few backdrop blurs? Keep stacking filters until your designer asks you to please, please stop. If you’re not a fan of burning your retinas, just stick dark: in front of any color to apply it in dark mode. The color palette now uses more vibrant wide gamut colors without you needing to understand what any of that even means. Transitions that work the way you'd expect — throw a few utilities on an element and you're in business. No need to remember that complicated gradient syntax — create silky-smooth gradients with just a few utility classes. Our next-generation rendering engine delivers unmatched speed and efficiency, empowering creators to push boundaries like never before. Sometimes two dimensions aren’t enough. Scale, rotate, and translate any element in 3D space to add a touch of depth. Tailwind automatically removes all unused CSS when building for production, which means your final CSS bundle is the smallest it could possibly be. In fact, most Tailwind projects ship less than 10kB of CSS to the client. Because Tailwind is so low-level, it never encourages you to design the same site twice. Some of your favorite sites are built with Tailwind, and you probably had no idea. Tailwind UI is a collection of beautiful, fully responsive UI components, designed and developed by us, the creators of Tailwind CSS. It's got hundreds of ready-to-use examples to choose from, and is guaranteed to help you find the perfect starting point for what you want to build."
