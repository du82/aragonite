title = "国内最大級の屋内型スポーツ・アスレチック施設「ノボルト（NOBOLT）」｜株式会社タイトー"
description = "スポーツ・アスレチック×エンターテインメントを融合した国内最大級の屋内型体験施設「ノボルト（NOBOLT）」でわくわくするアトラクションを体感しよう！ファミリー層やカップル、本格アスリートの方まで、幅広いお客様にお楽しみいただけます！"
full_description = "当日でも予約できますか？ 当日空きがある時間帯は当日でも予約も可能です。予約サイト(webket)内でご確認ください。ご予約で埋まっている時間帯は、直接店頭へお越しいただいても購入できません。他の時間帯でのご予約をお願いいたします。 料金はいくらですか？また、こども料金はありますか？ 料金の詳細についてはこちらをご確認ください。 どのような服装でいけばよいですか？ 動きやすい服装（スカート等はハーネス着用できません）・靴（外履きの運動靴可）でご来場ください。 ※ハーネス着用エリアはサンダル等でのご利用はできません。 ※靴下は受付で販売した当店指定のものを着用いただきます。 何時から受付は可能ですか？ 各利用時間の30分前より受付は可能ですが、プレイ開始は定刻よりとなります。 土・日・祝日や学校休暇期間などの繁忙期は特に受付の混雑が予想されます。 混雑状況によっては入場時間に受付完了できない可能性があるため、なるべくお早めのご来場をお勧めいたします。 小さい子ども（赤ちゃん）が遊べる施設はありますか？ 3歳以下を対象としたベビーエリアがございます。2歳までは無料でご入場いただけます。（保護者様の見学プランでの利用は必要）"
