["https://talesofsyn.com/about"]
title = "About"
full_description = "About Tales of SynThe comic book and game are set within the shared world of Giga Bloc C, a sprawling metropolis in a future time period of Earth. The cityscape structure is a direct reflection of the class divide of it’s society. The upper most levels are affluent and green, controlled by The Echelon Corporation and housing the richest elites. The further you descend downwards the more poverty stricken the districts become, with the lowest level being a lawless area filled with outsiders and governed by rival factions.AI Augmented DesignA core aim of the project is to test emerging AI technologies to see how they can help augment the design process both in production and also aiding narrative story telling. The technologies that are applied during each design workflow are evaluated using the following criteria:Art Directable - techniques should respond accurately to the design choicesEfficient - tools must provide an advantage over current production methodsInnovative - the tools should enable new approaches to design, workflows and outputsInspiring - do the tools enable emergent concepts that contribute to the ideation processAbout GeppettoGeppetto AI is a tool suite in the form of a virtual assistant. The main goal of Geppetto is to provide developers and storytellers with useful technologies that can help them create amazing content. The tool suite is built using emerging AI technologies applied to the production of comics, games, and films. By applying existing AI workflows to real-world projects, Geppetto aims to provide the best possible solutions to its users. The most impactful technologies are incorporated into the tool suite to make it as useful and relevant as possible. Every real-world project that Geppetto works on helps inform the use cases that need to be covered by the tool suite. This means that the tool suite is constantly evolving and adapting to meet the needs of its users. Any edge cases that are not currently solved will have specialist solutions developed to ensure that users can take advantage of the full range of features that Geppetto has to offer."
