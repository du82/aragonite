title = "Comic First Look"
description = "Page previews showing opening stories for each faction from Issue 01"
full_description = "Written byHackmansDate publishedFebruary 22, 2023Page previews showing opening stories for each faction from Issue 01Tales Of Syn started life as a comic book, exploring the use of AI tools to develop rich narrative focussed content. The main storylines are centred around four rival factions and the interplay between their unique goals and survival tactics. Issue One is complete and will be followed by future issues exploring additional characters and themes within the fictional world of Giga Bloc C. The RPG game is set in the same world and will share some of the characters and storylines from the comic, whilst delivering an interactive main storyline of it’s own.This story introduces the Punks and Greasers and is set in the Old City Slums on the ground level of Giga Bloc C. Rather than redesigning the city landscape, the new cities were built on top, leaving these areas to fall into squalor for the residents still living there.This story introduces the The Clergy of Loving Grace and is set in the Neo Gothick district of Giga Bloc C. This area is a blend of 12th to 16th century European architecture and 21st century futurism in the form of giant Churchscrapers.This story introduces the Resistance Against Machine Sentience and is set at the ground and subterranean levels of Giga Bloc C. RAMs are a freedom movement of sewer dwelling hippies who use guerrilla tactics to fight back against the totalitarian establishment.More posts like thisComic First LookComic First LookFebruary 22, 2023"
