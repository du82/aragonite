title = "Talita Bateman | TetZoo(M)Con 2021"
description = '''
Blog              
  


  
  


      




















  
  





    Subscribe  New posts every now and then.                                  Email Address                                                          Submit                            Thank you!
  

                










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  Hi, I’m Talita. I’m interested in evolutionary biology and occasionally write about it here.🐸🦎🐊🐢🐍🦕🦖





















  
  



      
  
      


              
  

  

                                            
                                                      Evolutionary Biology                              
                            


              
  

                   
                                                                                                                            


              
  

                                                                                                                         
  
    
  
  
  
  

                        Sep 14              Sep 14 TetZoo(M)Con 2021
          Talita Bateman 
      Events and Talks, Palaeontology, Review                                                  










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  Last year I, unfortunately, had to miss the first ever online version of TetZooCon – or TetZoomCon. However, this year, I don’t think much could keep me from attending! I took the day off from work and planned a visit to one of the current exhibitions at the Natural History Museum in London in the morning (more on that on a separate post) followed by an afternoon/evening of TetZoo inspired talks.Darren Naish (Mr TetZoo himself if you don’t already know him) mentioned that this is the 16th year of the TetZoo blog and I can only be thankful that he and John Conway continue to put these events together! TetZooCon events aren’t just educational and informative, they are also incredibly inclusive and I trully appreciate that!My posts on previous TetZooCon events are always pretty lengthy, and this one is a bit late, so let’s just get into it!


































































  

  
  
                    
                                                                                                                                
                            
                        Amazing art by Mark Simmons (@toysdream on twitter)                  

  


  





  It is no secret that the conservation of amphibians and reptiles is an important part of my own studies, which is why the first talk was such a treat! Kannan Raja (@JKannanR on twitter) kicked things off with his aptly named presentation “Your Carma Ran Over My Frogma” in which he talked about wildlife-human interactions in Singapore, the importance of citizen science and the herpetofauna of Singapore. Raja described the work that a volunteer group of herpetology enthusiasts and experts are carrying out with The Herpetological Society of Singapore using citizen science to help mitigate wildlife-vehicle collisions (WVCs). He mentioned that despite its small size, there is a car for every 6 people in Singapore and so roadkill is, unfortunately, an issue on the island. Additionally, roadkill may also happen off main roads such as on biking trails and walking paths due to the use of e-scooters, bikes, etc.


































































  

  
  
                    
                                                                                                                                
                            
                        A screenshot of one of Kannan’s slides during his talk.                  

  


  





  As he described, herps are often underrepresented due to their small size (not always) and fragile bone structure. The study helps them gather data that may benefit the conservation and biodiversity of the local herpetofauna by:Identifying potential hotspots for localised extinction threats;Potentially showing new species that may have not yet been recorded;Identifying potential invasive species (often due to the pet trade industry);Reducing the impact of WVCs on local wildlife via the use of green bridges but also small tunnels;Raising public awareness and education;So far they have collected about 6 or 7 months of data but certain trends have already been identified, such as roadkill hotspots being located around nature reserves and the fact that most herps being reported are snakes.


























  

  



    
    
    
