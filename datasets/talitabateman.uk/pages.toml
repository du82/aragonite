          The Oceanário de Lisboa (Lisbon’s Oceanarium) is the largest indoor aquarium in Europe. It holds an impressive 5 million litres of seawater and includes some pretty amazing creatures in its exhibitions. If ichthyology is your thing, you’d be in heaven but if you enjoy marine biology in general this is an absolute must if you’re ever around Lisbon.      
                              
                      Dec 10                                        Dec 10         Dunkleosteus              
      Talita Bateman 
    Palaeontology, Journal, Ichthyology
          I don’t usually write about fish and, in general, don’t tend to focus much on ichthyology – but take me to a natural history museum and you will see me hunting for a Dunkleosteus. Can you blame me? They were pretty impressive creatures, just look at the image above. Talk about science fiction meets reality, right?!      
  




  
      


