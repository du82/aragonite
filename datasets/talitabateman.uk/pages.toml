                      Oct  1                                        Oct  1         Visiting the Sedgewick Museum of Earth Sciences in Cambridge              
      Talita Bateman 
    Museum, Palaeontology, Review
          Back in December 2019, I visited the Sedgewick Museum of Earth Sciences in Cambridge with my little brother, Caio, and our friend, Kemi. I had planned to write about it then, but Covid happened and it somehow just completely escaped my mind. However, I was going through some old photographs and found some gems from that day - hence the belated post.      
                              
                      Sep 18                                        Sep 18         Fantastic Beasts: The Wonder of Nature Exhibition at the NHM (London)              
      Talita Bateman 
    Museum, Review
          About two years ago, I wrote a short post on the parallels between Magizoology in the wizarding world and Zoology in real life. I wrote it after visiting the Warner Bros. Studio Tour in London of “The Making of Harry Potter”, aka Harry Potter World. Little did I know that the Natural History Museum in London would eventually run an exhibition dedicated to the same concept, so as you can imagine, I was beyond excited to see it.      
                              
                      Sep 14                                        Sep 14         TetZoo(M)Con 2021              
      Talita Bateman 
    Events and Talks, Palaeontology, Review
