amazing collection of invertebrates, such as the Sunflower Seastar (Pycnopodia helianthoides). <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681730426536-Q2CZ5WQGPTA9R0RIMMQB/Photo+18-10-2021%2C+16+05+05.jpg" alt="Photo 18-10-2021, 16 05 05.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681730433088-7H6MV84ZCX0MW5GBUJNX/Photo+18-10-2021%2C+16+08+20.jpg" alt="Photo 18-10-2021, 16 08 20.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681730488853-B2WKI5W689XV4J83CYZ2/Photo%2B18-10-2021%252C%2B16%2B17%2B43.jpg" alt="Photo+18-10-2021%2C+16+17+43.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681730444142-VVQS9A5SMRDX5RT4UXXX/Photo+18-10-2021%2C+16+37+48.jpg" alt="Photo 18-10-2021, 16 37 48.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681730454263-X2POX9X3CWU8VKX2DDIZ/Photo+18-10-2021%2C+16+42+59.jpg" alt="Photo 18-10-2021, 16 42 59.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681730455203-GVBW1E96RA7IOU3F38WU/Photo+18-10-2021%2C+16+49+13.jpg" alt="Photo 18-10-2021, 16 49 13.jpg" /> #block-yui_3_17_2_1_1681717439416_100772 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1681717439416_100772 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Luckly for me, they also had an amphibian section. Mostly featuring some species that are fairly well known in the pet trade as well as the famous poison dart frogs. They did, however, have a Vietnamese Mossy Frog (Theloderma corticale) which is always fun to watch! <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217935255-3MGSP8CJ3LDRNMLTJQXW/IMG_1675.jpeg" alt="IMG_1675.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217935826-M2VGOTJSPNOI7N9EFPCQ/IMG_1679.jpeg" alt="IMG_1679.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217939911-VNDWHSEB2GN3CHG0IJDF/IMG_1671.jpeg" alt="IMG_1671.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217940605-OV2PW5F98UQ1J2K2G3ZY/IMG_1668.jpeg" alt="IMG_1668.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217943694-YJJUWDF4GAN5Q8268CYC/IMG_1716.jpeg" alt="IMG_1716.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217945465-5GJLZHN8CPY6XAEVVVDE/IMG_1721.jpeg" alt="IMG_1721.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217947503-LVYOW4KRIB31E8L7JFKK/IMG_1726.jpeg" alt="IMG_1726.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217950430-WEV6R48DIHR2HNZG8BSQ/IMG_1725.jpeg" alt="IMG_1725.jpeg" /> #block-yui_3_17_2_1_1728217219566_81043 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1728217219566_81043 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } The highlight for me though was the Crocodile Newt (Tylototriton verrucosus). It always reminds me of “Toothless” from “How to Train Your Dragon”. There’s quite a bit of morphological and behavioural differences for these, depending on locality, but the one they had was quite possibly one of the cutest I’ve ever seen in person! <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681738686387-LC5S0GJPLOLBM563159P/IMG_1681.jpeg" alt="Crocodile Newt (Tylototriton verrucosus)" /> Crocodile Newt (Tylototriton verrucosus) <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681738691647-X3PEKELA3DE4HUPG5GH9/IMG_1682.jpeg" alt="Crocodile Newt (Tylototriton verrucosus) under water" /> Crocodile Newt (Tylototriton verrucosus) under water #block-yui_3_17_2_1_1681738558617_3772 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1681738558617_3772 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } If you’re ever in Lisbon, I would definitely recommend a visit! Talita Bateman Museum, Review, Wildlife Conservation Amphibians, Ecology, Exhibition, Ichthyology, Fish, Zoology, Oceanarium, Aquarium, Aquascaping, Marine Biology, Museum, Lisbon Oceanarium, Review Facebook0 Twitter LinkedIn0 Tumblr 0 Likes Talita Bateman Website Main-content {width:1200px} Leave a comment Talita Bateman Website Hi, I’m Talita. I’m interested in evolutionary biology and occasionally write about it here. #block-yui_3_17_2_1_1631636605944_36832 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; } Subscribe New posts every now and then. Email Address Sign Up Thank you!'
