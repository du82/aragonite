full_description = "Jan 6 Jan 6 Visiting the Lisbon Oceanarium Talita Bateman Museum, Review, Wildlife Conservation The Oceanário de Lisboa (Lisbon’s Oceanarium) is the largest indoor aquarium in Europe. It holds an impressive 5 million litres of seawater and includes some pretty amazing creatures in its exhibitions. If ichthyology is your thing, you’d be in heaven but if you enjoy marine biology in general this is an absolute must if you’re ever around Lisbon. Feb 5 Feb 5 Back to Basics: Anurans - Part 1 Talita Bateman Herpetology, Batrachology Let’s talk about frogs and toads!I often write pretty lengthy posts about specific species, or subjects relating to manuscripts on which I am currently working. However, I thought it would be fun to write a series of short blog posts that go back to basics on one of my favourite extant orders of the amphibia class – Anura. Aug 3 Aug 3 The House Spider (Tegenaria gigantea) Talita Bateman Wildlife Conservation, Arachnology, Entomology Spiders are amazing creatures and there are thousands of identified species in the world. In the UK alone, there are over 600 species across 37 families. Many people will commonly refer to spiders as ‘insects’. Although spiders, like insects, are invertebrates and belong to the phylum Arthropoda, they do not belong to the same class. Insects are part of the Insecta class, whereas spiders – similarly to scorpions, mites and ticks – belong to the class Arachnida. Feb 4 Feb 4 The Red-Footed Tortoise Turning into a Pyramid (Chelonoidis carbonaria) Talita Bateman Herpetology, Husbandry, Animal Welfare, Travel, Wildlife Conservation Out of all reptiles in existence, tortoises are one of the most widely kept as pets. This is not surprising considering that unlike other reptiles, they are perceived as mostly docile and non-threatening to humans. There's also, of course, the cuteness factor. Unfortunately, humans seem to be just as uninformed regarding their needs and husbandry as they are of any other reptilian order."
