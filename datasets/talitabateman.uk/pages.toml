                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217940605-OV2PW5F98UQ1J2K2G3ZY/IMG_1668.jpeg" alt="IMG_1668.jpeg" />                                                
          
  
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217943694-YJJUWDF4GAN5Q8268CYC/IMG_1716.jpeg" alt="IMG_1716.jpeg" />                                                
          
  
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217945465-5GJLZHN8CPY6XAEVVVDE/IMG_1721.jpeg" alt="IMG_1721.jpeg" />                                                
          
  
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217947503-LVYOW4KRIB31E8L7JFKK/IMG_1726.jpeg" alt="IMG_1726.jpeg" />                                                
          
  
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1728217950430-WEV6R48DIHR2HNZG8BSQ/IMG_1725.jpeg" alt="IMG_1725.jpeg" />                                                
          
  
  

  







#block-yui_3_17_2_1_1728217219566_81043 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; }
#block-yui_3_17_2_1_1728217219566_81043 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; }







  The highlight for me though was the Crocodile Newt (Tylototriton verrucosus). It always reminds me of “Toothless” from “How to Train Your Dragon”. There’s quite a bit of morphological and behavioural differences for these, depending on locality, but the one they had was quite possibly one of the cutest I’ve ever seen in person!





















  
  






  

  



    
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681738686387-LC5S0GJPLOLBM563159P/IMG_1681.jpeg" alt="Crocodile Newt (Tylototriton verrucosus)" />                                      Crocodile Newt (Tylototriton verrucosus)                                    
          
  
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681738691647-X3PEKELA3DE4HUPG5GH9/IMG_1682.jpeg" alt="Crocodile Newt (Tylototriton verrucosus) under water" />                                      Crocodile Newt (Tylototriton verrucosus) under water                                    
          
  
  

  







#block-yui_3_17_2_1_1681738558617_3772 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; }
#block-yui_3_17_2_1_1681738558617_3772 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; }







  If you’re ever in Lisbon, I would definitely recommend a visit!





















  
  




    
