          This probably applies to most people that live in the UK, but I suddenly noticed that I usually don't see much of my very pale feet unless I'm on holiday. In fact, I don't really think about them much either on a day to day basis. Therefore, I never thought about what the shape of my feet may tell me about my heritage. I can honestly say that I have done no research on this topic whatsoever.       
                              
                      Jan 23                                        Jan 23         The Goliath Frog (Conraua goliath)              
      Talita Bateman 
    Batrachology, Wildlife Conservation, Herpetology
          The Conraua goliath is one of those species that most people with no interest in amphibians will have heard of because of its size. The 'biggest frog' factoid being an almost must for any pub quiz...or perhaps more realistically, for any pub quiz I would certainly enjoy.      
                              
                      Feb 13                                        Feb 13         Glass Frogs (Family Centrolenidae) and the Cuyaba Dwarf Frog (Eupemphix Nattereri)              
      Talita Bateman 
    Batrachology, Herpetology
