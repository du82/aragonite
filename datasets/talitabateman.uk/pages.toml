      Talita Bateman 
    Journal, Museum, Review
          In December 2019, I visited the Grant Museum of Zoology in London with a couple of friends, and given our current situation, I thought it would be a good time to write about that visit and daydream about my next one!      
                              
                      Dec 10                                        Dec 10         Dunkleosteus              
      Talita Bateman 
    Palaeontology, Journal, Ichthyology
          I don’t usually write about fish and, in general, don’t tend to focus much on ichthyology – but take me to a natural history museum and you will see me hunting for a Dunkleosteus. Can you blame me? They were pretty impressive creatures, just look at the image above. Talk about science fiction meets reality, right?!      
                              
                      Nov 28                                        Nov 28         Ichthyosaurs              
      Talita Bateman 
    Journal, Palaeontology
          Yes, they were enormous. Yes, they looked like modern dolphins (mammals) or sharks (fish) but they were actually reptiles. And finally, no, they were not dinosaurs. Ichthyosaurs have got to be one of my favourite groups of extinct reptiles and a great example of convergent evolution.      
                              
                      Oct 10                                        Oct 10         Visiting the Museum of Natural Sciences of Barcelona              
      Talita Bateman 
    Journal, Review, Travel, Museum, Palaeontology
          Visiting natural history, palaeontology and science museums whenever I visit a new city is something of a tradition to me. This time, I had the pleasure of visiting the Natural Sciences Museum of Barcelona or Museu de Ciències Naturals de Barcelona. The museum is located in a part of Barcelona that I can only describe as what looked like the ‘business’ quarter. Getting there from the centre of Barcelona was pretty easy and the Museum is a very short walk from the Meresme-Forum metro station.      
                              
                      Jul  9                                        Jul  9         Visiting the National Museum of Natural History and Science in Lisbon              
      Talita Bateman 
    Review, Travel, Journal, Museum, Palaeontology
          On the 29th June we visited the National Museum of Natural History and Science in Lisbon. This is my second trip to Portugal but my first to Lisbon. The Museum is located near ‘Estacao do Rato’ and features a Botanical Garden right next to it. The entrance was around 5 euros but for an extra euro, you get access to the Botanical Garden as well.      
                              
                      Jun 25                                        Jun 25         Magizoology and Zoology              
      Talita Bateman 
    Journal, Wildlife Conservation
          According to Pottermore, had I attended Hogwarts, I would have been placed in Ravenclaw. I’m not sure whether the description of the house fully describes me but since I really like Ravens, I’m pretty happy with that assessment. What I do know, is that were this the wizarding world, I would likely have pursued a career in Magizoology.      
  



