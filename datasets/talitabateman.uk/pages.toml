  Lastly, one of my favourite displays at the museum is the Micrarium, which they aptly describe as ‘a place for tiny things’. The Micrarium aims at shedding light (quite literally!) on some of the smallest animals with about 20,000 microscope slides of different species. The two images below show slides of newts at different life stages and the last photograph displays a British human herpetologist specimen looking for herp related slides (shout out to my friend Steven Allain).


























  

  



    
    
    
