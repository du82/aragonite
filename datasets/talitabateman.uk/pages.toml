          Talita Bateman 
      Museum, Review, Wildlife Conservation                                                  










































  

  
  
                    
                                                                                                                                
                            
                        My little brother stunned by the Florestas Submersas exhibition at the Oceanario de Lisboa.                  

  


  





  The Oceanário de Lisboa (Lisbon’s Oceanarium) is the largest indoor aquarium in Europe. It holds an impressive 5 million litres of seawater and includes some pretty amazing creatures in its exhibitions. If ichthyology is your thing, you’d be in heaven but if you enjoy marine biology in general this is an absolute must if you’re ever around Lisbon. Back in October 2021, when I visited the Lisbon Oceanarium, I was lucky enough to be able to see the amazing “Forests Underwater” exhibition showcasing the work of famous Japanese photographer and aquascaper, Takashi Amano. If you’re into aquascaping, like my little brother, the name will surely be familiar to you. Needless to say, my little brother was pretty excited about it and I feel like we could have spent the whole day there if we had the time!





















  
  






  

  



    
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681729423466-UDN0Z2ZOJE7ADFZOACWN/Photo+18-10-2021%2C+15+01+38.jpg" alt="Photo 18-10-2021, 15 01 38.jpg" />                                                
          
  
    
    
                                                                                <img src="https://images.squarespace-cdn.com/content/v1/5517390de4b0d6bbb54cc9b5/1681729422413-PYH0OUZ72IYO9TGVNSL9/Photo+18-10-2021%2C+15+02+06.jpg" alt="Photo 18-10-2021, 15 02 06.jpg" />                                                
          
  
  

  







