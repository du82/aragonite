full_description = "How Pirate Are You? If anyone challenges your pirattitude, and asks you “Just how pirate are you?” we have a T-shirt that is all the answer you need to give them. Sure, talking like a pirate is the whole point of Thursday’s holiday, and there are plenty of choice words you could use, “bilge rat” and “scurvy dog” being two favorites. But there’s satisfaction any day of the year to walk through life with your inner pirate proudly showing. Because the shirt says you’re “PIRATE AF.” Take a look at it at our Cafe Press store, which you can find here. Ol’ ChumbucketSept, 18, 2024 WE’RE BACK! Sorry about the absence. But we’re back, just in time to celebrate International Talk Like a Pirate 2024, which as always is September 19th – this Thursday, in this case. I’ll have more to say Monday, as I learn how to navigate this new system. But the point is, we’re back. Ol’ Chumbucket, Sept 15, 2024 I’m gathering me Pirate Clobber for the Invasion This is a new one on me. I was scrolling through something online and ran across a post from a person who is very excited about attending the Hastings (UK) Pirate Festival in July. He said he’s got his room booked, “got our Pirate clobber,” and is now shopping for rum. Pirate clobber. Clobber isn’t a pirate word, not even in the sense of “I’m going to clobber you.” According to the Online Etymology Dictionary, the first recorded usage of clobber in that sense was in 1941, from RAF pilots. Turns out in English slang clobber has referred to clothing since the mid-19th century So pirate clobber is what we Yanks might refer to as our gear, or kit, (but never costume.) Like I said, it’s a new one on me, but I love it and will use it as often as possible from now on. By the way, for those who don’t know, the Hastings Pirate Festival is the biggest in theworld, with the Guinness record of 14,231 pirates in gear at one spot. Something for Pirate Invasion Long Beach to aim for, and many of us to put on our bucket lists. But right now I have to finish pulling my pirate clobber because in less than three weeks Mad Sally and I will be flying south for the Pirate Invasion Long Beach, A solemn day, and a silly one June 6, 1944, was the day thousands of American and allied soldiers stormed the beaches of Normandy, France, to overthrow Hitler and the fascist forces that had overrun Europe. It’s a solemn, sacred say, June 6, 1995, on the other hand, is just silly. It’s the day Mark Summers and I went to the YMCA to play racquetball in the vain hope we could get back in shape Instead, we came up with the idea for a holiday, International Talk Like a Pirate Day. Recognizing the historical importance of June 6, we picked a different day for the holiday, Sept. 19. The rest is, if not history, at least a pretty good story. You can read the details here. Ol’ ChumbucketJune 6, 2024 Little Town Plans Big Pirate Party A little town will put on a big party when the pirates return to Bowers Beach, Delaware, for a Memorial Day weekend bash. Bowers Beach, population around 300, will open its doors to host the Buccaneer Bash, and they’re expecting thousands to flock to the banks of the Delaware River for the festival celebrating everything pirate. The event is scheduled for May 25 and 26. Admission is free. Certain activities will have fees that will benefit the Bowers Beach Maritime Museum. The bash’s opening ceremony will take place at 10 a.m. Saturday, with activities following until 5 p.m. The slate of activities includes cannons, small arms, sword fights, cooking, a glassblower show and demonstrations of woodworking on a lathe and nautical tools use. Entertainment includes performances by the Brigands and Pirates for Sail, and the antics of the Pirates of Fortune’s Folly. There will be face painting and plenty of activities for the kids, including a scavenger hunt. Miss Delaware and Miss Teen Delaware also will put in an appearance. Further information is available on the event’s Facebook page. Tennessee Pirate Festival Kicks Off Two-Weekend Run And now it’s time for Tennessee to be in the spotlight, as the eighth annual Tennessee Pirate Fest kicks off a two-weekend run this Saturday. The event takes place May 18-19 and 25-27 in Harriman TN, about 15 miles due west from Knoxville. There’s plenty on the schedule for the whole family. Musical entertainment includes performances by the Crossjacks, acoustic music by Timothy Russell, folksinger Kris Kolt, and the Bravura Music Academy. In addition, there will be belly dancers, a multitude of comedy acts, magic and more, along with a host of vendors. Have a great pirate costume? Enter the costume contest and win a prize! Contestants are grouped by age – 4 and younger, 5 to 12, and 13 and older. Winners in each category will be determined by audience applause so bring your finest freebooter fashion and all your friends! More information is available online at the festival website, and on Facebook. Looking aheadMad Sally and I have made and paid our travel and lodging arrangements for Pirate Invasion Long Beach, which will the final weekend of June in Southern California. I just mention this because we are really looking forward to the many, many members of the pirate community who are, to us, still just names and a few pix on Facebook. If you are among them, we sure hope for the chance to meet in person! Ol’ Chumbucket, May 15, 2024 Looks Like Brixham Was a Blast;Next Up is a Festival in Blackbeard’s Bath N.C. The Brixham Pirate Festival last weekend (May 4-6) on England’s Devon County looks like it was a fantastic freebooter fest. There’s a video online showing hundreds – maybe thousands – of pirates paraded through the town. The video is 20 minutes long, and the excitement and energy leaps off the screen. You can see the video and LOTS of photos at the Brixham discussion group on Facebook. https://www.facebook.com/groups/66333568625. Next on the agenda is the Bath NC Pirate Festival this Saturday, from 10 a.m. to 3 p.m. at Bonner’s Point. The historical city of Bath was briefly the home of Blackbeard, arguably the most famous pirate of the Golden Age. The festival will include: – Our friends, the Loose Cannon Company, will be encamped at Bonner’s Point and give presentations on seamanship, period cooking, surgery, and weapons and tactics. There also may be some buccaneer hijinks, as this crew is known for its shenanigans. – Arts and craft vendors will display and sell their original works down the town’s streets. – Live music will be performed throughout the day. The lineup is: The Beaufort County Traditional Music Association; Carolina Still; The Emerald City Big Band; and Double Portion Southern Gospel Music. – Children’s activities all day. At 1 p.m. the Bath Student Art Awards will be presented Further information is available on Facebook or the event website. Big Times in Brixham Big weekend coming up. The Brixham Pirate Festival on England’s southeast coast is coming up May 4 through 6. You’ll find pirates a plenty at what resembles a rowdy freebooter street fair in this old coastal town. Not too long ago Brixham held the world record for most garbed pirates at one site, set in 2009. (The record now belongs to Hastings, England, with a total of 14,231 pirates set in 2012. The Hastings Pirate Festival is set this year for July 20-21. Mark your calendars!) For a lot of us in the Brethren, a trip to Brixham is high up at the top of our bucket lists. But that’s not the only action on the pirate agenda this weekend. The Louisiana Pirate Festival opens this weekend and runs for two weekends in Lake Charles, in the southwestern corner of Louisiana. Formerly called Contraband Days, the festival includes music, carnival rides, food and – of course – PIRATES! There’s more information on these two events and many others on our Web Links page. Well This Sounds Fun You’re a pirate, presumably, and raids, pillaging and plunder are just a part of life. Or at least pirate parties, festivals, and pub crawls. But what’s life like on the other side? If you happen to be visiting Southern California you can find out at San Diego Pirate Adventures. A 90-minutes cruise aboard the Maritime Museum of San Diego’s 16th-century Spanish galleon replica, San Salvador, includes a boarding party of Golden Age pirates. “Guests will be fully engaged in pirate theatrics at the dock and underway on San Diego Bay,” according to a report from radio station KPBS. Information on scheduling and costs can be found on the group’s website. And check out the video. Pirate Invasion Long Beach Needs You If you’re part of a pirate crew or guild, a performer or freebooter entertainer, now is your chance to take part in this year’s Pirate Invasion Long Beach, taking place Jun 29 and 30 at Shoreline Aquatic Park in Long Beach, California, with a stone’s throw of the permanently docked Queen Mary. (Please note: Pirates are asked to please refrain form throwing stones at the Queen Mary.) Pirate Invasion Long Beach is the biggest filibuster festival west of the Mississippi and organizers are promising this year’s event will be the biggest yet. And organizers plan to put out vendor applications March 1, so if you sell items to the swashbuckler set, definitely keep your eyes out for that one. To find out more about the event and how you and your crew can take part, send a message to the festival’s Facebook page (https://www.pirateinvasionlongbeach.com) or check out their website (https://www.pirateinvasionlongbeach.com.) And definitely put Pirate Invasion on your summer schedule. Maybe you’ll run into me, Cap’n Slappy and Mad Sally, because we definitely plan to be on hand. Ol’ ChumbucketFeb. 8, 2024 An Honor at the Swashbucklers Ball I’m excited and proud to let you know I’ve been asked to be a master of ceremonies at the Swashbucklers Ball, Portland’s pirate prom, which takes place Satuday, Jan. 20, at the The Milwaukie-Portland Lodge. The venue is a 63,000-square-foot building that will be packed from top to bottom with music, dancing, grog, games, merchants and freebooter fun. And I get to be in the middle of it all, as an MC, even if 99 percent of the job is just announcing what’s next. That oughta keep me busy and out of trouble. It’s an honor I didn’t expect, and when the organizers contacted me about it I didn’t waste a second in saying, “Oh, hell yeah.” There will be more stages, more bars, more performers, more vendors, and more fun than ever before at the 12th Swashbuckle’rs Ball. More information is available at the event’s website, or on Facebook I sincerely hope I see a lot of my friends there. It gonna be a blast. Another Trip ‘Round the Sun This and that as 2023 draws to a close. – Good News for the Pyrettes Congratulations to our friends The Pyrettes, for winning single of the year in the 2023 Scoundrel’s Inn Pirate Radio Awards for their song, “So Many Secrets.” Well deserved! We’re looking forward to seeing (and hearing) the Pyrettes again at Portland’s 12th Swashbuckler’s Ball, Saturday, Jan. 20. They’ll be joined by a full lineup of music and swashbuckling spectacle. There may even be a surprise or two. Other 2023 awards presented by Scoundrel’s Inn include:– Album of the year: “Plunderstruck,” by Pride O’Bedlam– EP of the year: “Does a Bawdy Good,” by the Harlot Queens– Best Original Song: “Best Damn Life,” by Rover’s Way– Best Traditional Song: “Smuggler’s Song,” by Pride O’ Bedlam– Best Bawdy Song: “Dungeon Master,” by Opal and Jade – Change of Plans Isn’t it always the way? Plans are made to be changed, I guess. In a previous edition of The Poopdeck we outlined our itinerary for 2024, including me traveling to Florida in February to take part in St. Augustine’s Old City Pirate Fest. No sooner had the word gone out than I had to change plans. Not to put too fine a point on it, we live in a world where not having a working vehicle can be difficult. So my ability to fly form Washington to Florida became, – Shall we say? – compromised. It’s a disappointment, to be sure. But we’re already hard at work plotting how to make the trip sometime in the following year. Meanwhile, our plans for the Swashbuckler’s Ball in January and the Pirate Invasion Long Beach in June are all but etched in stone, so we’ll see you out there.– Resolutions I wouldn’t call these New Year’s resolutions. They’re just things I’m planning to do in 2024. But Jan. 1 is almost here, so it fits. I’m going to finish the final draft of my adult pirate adventure/mystery. I’m going to start the pirate sci-fi adventure I’ve been thinking about. I also have a play in mind. It’s one I’d like to see, so why not be the one to write it? I also have plans to work on my health – no surprise there – to forestall a repeat of what made 2023 so interesting. (If you missed it, I had a quadruple bypass in October. I’m MUCH better now, feeling great and planning to feel even better.) I hope you’ve got plans for the new year – big or small, that’s your call – and if they bring you to a pirate vent and our paths cross there, all the better. I look forward to it. Ol’ ChumbucketDec. 29, 2023 Merry Christmas from Team Pirate It’s time to celebrate “that other” holiday. You know, that holiday that isn’t International Talk Like a Pirate Day. But this one, Christmas, is pretty good too. So all of us at Team Pirate – all four of us, Cap’n Slappy, Jezebel, Mad Sally and me, Ol’ Chumbucket – wish you the best the holiday season has to offer, whatever holiday you mark. Whether it’s Christmas, Kwanza, Hanukkah, Winter Solstice or any other holiday that’s going on this month that I somehow missed. In honor of those let me give you a link to a popular song of the season – altered to amuse the pirate population. It’s “Pirate Plunderland.” There are many versions of this out there, this is my favorite, taken from our freebooter folksinger friend Tug Bromberg and sung by me many moons ago (2008) at a holiday book even in the U.S. Virgin Islands. Ol’ ChumbucketDec. 19, 2023 We’ve Got Pirate Plans for the New Year Ahoy! Lots going on, but this Poopdeck will start with a personal note. We at the Ol’ Chumbucket/Mad Sally household were dealing with a health issue the last few months. Not to get too involved, I wanted to share with our pirate friends that I had heart bypass surgery last month and am now well on my way to a much better outlook, so no need to worry about me. And if there’s ever a great time to have heart surgery, that was it, because the recovery should be complete right on schedule for us to take part in some events we’ve have been looking forward to. This is what we’ve got planned for 2024. We hope our path crosses yours along the way. 1 – The Swashbucklers Ball is Portland, Oregon’s, “Pirate Prom.” It draws hundreds of pirates from throughout the Northwest for an evening of freebooter fun, food, music and dancing, gaming, vendors and so much more. (including adult libations, believe it or not.) Last year was the first for me and Mad Sally and we enj"
