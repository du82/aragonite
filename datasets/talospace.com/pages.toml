full_description = '''Posts Showing posts from 2018 Show all { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/12/who-got-talos-ii-order-1.html" }, "headline": "Who got Talos II order #1?","description": "It wasn\u0026#39;t me at Floodgap, though ours is an early machine (my unit on the right is serial #12, from order #8). Turns out it was Trevor...","datePublished": "2018-12-25T04:18:00-08:00", "dateModified": "2018-12-25T04:24:51-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjO3ucFxrAcPbPD-mG56jGvigacy8qY5bo1D7tPpcL7Ot5pzriEE-qN07tuu-IZN9sG97o8bylGyF6OXZ4vILFvwwFptcFXGZFj2cWkujq5b-8-wXNZmbNsWYMBMeouykB92WphFoBjpD-9/w1200-h630-p-k-no-nu/IMG_20180427_162609.jpg", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on December 25, 2018 Who got Talos II order #1? It wasn't me at Floodgap, though ours is an early machine (my unit on the right is serial #12, from order #8). Turns out it was Trevor Dickinson. If the name sounds familiar to some folks in the audience, that's because Trevor is perhaps best known for his work in the Amiga scene. I'd been watching his PowerPC-based AmigaOne series for awhile to see if they were decent successors to the Quad G5 I used prior to getting the Talos II, though neither the X1000 nor the current iteration of the X5000 are a match for the G5 in raw CPU terms. (I'm also underwhelmed that the NXP P5020 the X5000 is currently using lacks AltiVec, which I think is a terrible omission. More on that in a bit.) On the other hand, if you have a substantial investment in Amiga software (I don't), then these are the gruntiest machines that natively boot AmigaOS, and they can also boot Linux. I'm not sure if Trevor was a backer of the original POWER8 Talos (I was), but he definitely got in at the ground floor with his T2. Not only did he order a rather beefy configuration (dual 18-core POWER9 CPUs and 96GB of RAM, etc., compared to my relatively middling dual 4-core with "just" 32GB), but Raptor even sent him a cool "order #1" certificate to commemorate his getting in first. What's Trevor doing with this machine? Well, apparently, nothing. He mentions that the "beta Linux" he was instructed to download didn't work, though I don't recall my unit coming with any such thing. Indeed, I selected Fedora precisely because it booted on the T2 out of the box, and I can't imagine my machine arrived much later than his did. But the really baffling part is that his blog post was written just a few days ago and by now almost all the distros that support ppc64/ppc64le support POWER9, so I don't know what's still got him marooned. He makes another interesting comment: "With the price I paid including shipping and [New Zealand] import duties I could have purchased 8 or 9 complete AmigaOne X5000 systems which can actually run AmigaOS 4, MorphOS and Linux." Well, that's probably true, and despite some wishful pipe dreams I've seen on MorphOS forums, there's very little likelihood AmigaOS or MorphOS will be ported to the T2 anytime soon. But the P5020 in the X5000 isn't even remotely in the same class as the POWER9: it has just two cores with a single thread per core, it has much less cache, it doesn't have AltiVec, let alone VSX, and it doesn't have the memory bandwidth. Part of this is because it's a design dating back to 2010, but the other part of it (and one of my perpetual complaints about recent PowerPC-based Amiga systems) is that it's an embedded-class CPU being put into a desktop environment. I should point out that I actually rather like Amigas; I own several A500s, an A3000 which one of these days I'll get Amix up on, and a '060 A4000T. But eight or nine X5000s lashed together wouldn't equal even a reasonable fraction of the power of the dual 18-core SMT-4 POWER9 he's got there (that's 144 threads, kids, plus everything else the POWER9 supports that the P5020 doesn't). Still, no one wants a big expensive doorstop, and I hope he's able to get order #1 up and running (though I dispute that "the Talos II Secure Workstation is really aimed at a Linux administrator in a data centre" -- the Talos is now unambiguously my daily driver and I'm no longer a professional system administrator nor do I work in a data centre). I suppose I could drop by if he needs a hand in Aotearoa since I'm currently in the Southern Hemisphere with my wife's family in New South Wales. We fly back to sunny Southern California via Auckland, so we'll see. Either way, Merry Christmas (or your holiday of choice), whatever your timezone. Share Get link Facebook X Pinterest Email Other Apps 5 comments (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/12/ibm-chooses-samsung-for-power10.html" }, "headline": "IBM chooses Samsung for POWER10","description": "It\u0026#39;s official: Samsung will manufacture the upcoming POWER10 on their 7nm EUV process thanks to an expansion of IBM and Samsung\u0026#39;s 1...","datePublished": "2018-12-22T22:27:00-08:00", "dateModified": "2018-12-22T22:27:31-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on December 22, 2018 IBM chooses Samsung for POWER10 It's official: Samsung will manufacture the upcoming POWER10 on their 7nm EUV process thanks to an expansion of IBM and Samsung's 15-year R&D partnership. The next z microprocessors, which have some low-level microarchitectural similarities to the Power line, will also be produced on 7nm EUV. There are still relatively few details available about either CPU; POWER10 is still scheduled for around 2020-1. This doesn't change plans for the upcoming final revision of POWER9 in 2019. More details should be forthcoming as that release date approaches. Share Get link Facebook X Pinterest Email Other Apps 1 comment (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/12/the-saga-of-power-isa-128-bit-long.html" }, "headline": "The saga of the Power ISA 128-bit long double","description": "Our last post on MAME\u0026#39;s failure to build on Power yielded some interesting information in the comments which, in my copious spare time,...","datePublished": "2018-12-22T16:46:00-08:00", "dateModified": "2018-12-22T21:34:11-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on December 22, 2018 The saga of the Power ISA 128-bit long double Our last post on MAME's failure to build on Power yielded some interesting information in the comments which, in my copious spare time, seemed worth researching further. But first a technical digression. 128-bit long double is currently implemented in gcc for Power ISA and PowerPC using "IBM extended doubles." This datatype is actually two 64-bit doubles paired together rather than a single 128-bit value, and specially handled in software. Because this is really a pair of 64-bit floats with altered handling, although it does improve precision (two 52-bit fractions, plus signs), it does not extend the range (as this NumPy bug demonstrates). In this scheme the effective exponent is still 11 bits, and the value thus yielded is not the same as the IEEE 754R 128-bit floating point datatype, which has a 15-bit exponent and a 112-bit mantissa plus sign. The work to implement the true 128-bit type in gcc supersedes the extended double approach and offers better mathematical performance, and thus eliminates the need on supported systems to implement constant folding for IBM extended doubles, the crux of the g++ constexpr issue that screws up building MAME. What suitable 128-bit registers exist on Power? Why, AltiVec, of course. You can then use POWER9's native quad-precision support to support the new __float128 datatype (or emulate it in software on POWER7 and POWER8). gcc currently implements this feature behind the -mfloat128 option, which requires VSX and has hardware acceleration on POWER9. However, if you try to use true 128-bit floats as long doubles now, it won't work properly. Why? Because the OS (and in particular libc) also needs to be adjusted for the ABI change. For Fedora, the transition to true 128-bit long double is scheduled for F30, which will include backwards compatibility symbols as the original implementation of 128-bit long double did, and the problem should finally be put to rest. It is likely that other distributions supporting ppc64le are undertaking the same process (we run Fedora here at Floodgap-Talospace). For big-endian ppc64, there doesn't seem to be an endian restriction on 128-bit float support, so it should work the same way on Talos II systems being run BE (as well as BE POWER7 and POWER8). However, for pre-VSX platforms (such as 32-bit PowerPC, G5, and POWER4 through POWER6), the best solution for compatibility may simply be to find a system that still uses 64-bit long double. By doing so you avoid the problem completely if you don't need the extra precision. Adélie Linux, as reported by its maintainer A. Wilcox, is apparently such a platform. Share Get link Facebook X Pinterest Email Other Apps Post a Comment (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/12/no-love-for-powerpc-from-mame.html" }, "headline": "No love for PowerPC from MAME","description": "MAME , the famous multi-system emulator, has been broken on Power ISA since around 0.194 due to a long-standing gcc bug with 128-bit lon...","datePublished": "2018-12-20T05:48:00-08:00", "dateModified": "2018-12-22T21:33:02-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQPx8UeMIkoHtBv5PCX0Ccgj8GQhpu6rBilt_HFn7zMB1yZJQpKGy0NWANX2flua3Pa2wYMse6CcRYT353BIBQ7_-WDVjV6JHbKVYzamBF6VDUs5X9P8iQf2MUySgLIWc1LAmOalWGrmk/w1200-h630-p-k-no-nu/Screenshot+from+2018-12-16+14-43-25.png", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on December 20, 2018 No love for PowerPC from MAME MAME, the famous multi-system emulator, has been broken on Power ISA since around 0.194 due to a long-standing gcc bug with 128-bit long double. This bug hasn't been paid attention to in 12 years, and is rather beyond my personal ken to take a whack at as well. Near as I can determine, the issue affects every Power ISA platform with such a datatype including 32-bit, 64-bit and 64-bit little-endian. Besides a minor fix for one of their upstream libraries on little-endian PowerPC, the most straightforward workaround to get MAME up on the Talos II is to simply use 64-bit long doubles by setting the compiler flag -mlong-double-64. This is admittedly a non-standard ABI option but appears to work just fine as the screenshot demonstrates. However, rather than allow this (hopefully temporary) workaround to fix the platform given that the gcc issue is longstanding and apparently difficult to resolve, the MAME team decided not to allow any such workaround even given that it clearly wouldn't affect anything else. It's their project, but I really think that sucks, because it means MAME won't build on any PowerPC system out of the box for the foreseeable near future. You have two options. The first is to change the makefile and/or set the appropriate compile-time options to use clang instead of gcc. I haven't tested this and clang isn't my preferred compiler on Power ISA as it's less mature on this architecture, but it is a supported compiler at least for MAME on macOS, so it should work. You'll still need the bx patch below right now (read on) if you're building on ppc64le. Otherwise, you can apply the patch that was rejected to get gcc builds working. You'll still need the bx portion of this diff right now for either compiler on little-endian systems, though hopefully at some future point the bx patch will be accepted upstream and merged back to MAME. Again, as a non-standard ABI there is the potential for conflict with code that may not expect the altered datatype, but this is the build I currently use myself and at least as of this writing seems to work. Share Get link Facebook X Pinterest Email Other Apps 3 comments { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/12/the-power-continues-in-firefox-64.html" }, "headline": "The POWER continues in Firefox 64","description": "If you are able to build Firefox 63 , you should be able to build Firefox 64 without anything additional. Meanwhile, a whole mess o'''
