PowerNV system like the Raptor family (if you are running SUSE or its free tier, openSUSE LEAP on Raptor hardware, post in the comments). SUSE Linux Enterprise is available (both 12 SP5 and 15 SP1) with a 60-day free trial. Share Get link Facebook X Pinterest Email Other Apps 2 comments (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2019/12/firefox-71-on-power.html" }, "headline": "Firefox 71 on POWER","description": "Firefox 71 is out, not a major system upgrade, but some nice milestones such as improved developer tools, support for Media Session and nat...","datePublished": "2019-12-07T22:21:00-08:00", "dateModified": "2019-12-08T19:53:01-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on December 07, 2019 Firefox 71 on POWER Firefox 71 is out, not a major system upgrade, but some nice milestones such as improved developer tools, support for Media Session and native MP3 decoding. It pretty much works as is on Power ISA and I've noticed no new issues with it so far. (UPDATE: See comments. Apparently the extensions I'm using are unaffected by bug 1601424. However, this looks like a general Linux issue on all architectures.) The configurations I am using are unchanged from Firefox 67. This is the last of the 6-week sprints, moving to a 4-week cadence for Firefox 72. As a result I will be doing smoke test builds about every 10-14 days to ensure early regressions on Power are intercepted. Unfortunately I have not had time to do much more work on the JIT because of the holidays, family responsibilities and $DAYJOB. I won't be offended at all if someone beats me to the punch especially as I'm starting to see WebAssembly becoming a hard dependency even for some add-ons (without the JIT there is no support for wasm). Share Get link Facebook X Pinterest Email Other Apps 5 comments (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2019/12/amd-navi-support-coming-to-openpower.html" }, "headline": "AMD Navi support coming to OpenPOWER","description": "Most of us (including yours truly) are using Polaris or Vega AMD GPUs, and the BTO WX7100 option Raptor offers is Polaris, but Raptor has is...","datePublished": "2019-12-07T22:02:00-08:00", "dateModified": "2019-12-07T22:02:32-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on December 07, 2019 AMD Navi support coming to OpenPOWER Most of us (including yours truly) are using Polaris or Vega AMD GPUs, and the BTO WX7100 option Raptor offers is Polaris, but Raptor has issued kernel patches to enable the latest Navi GPUs on OpenPOWER. This issue was traced back to code essentially locking Navi support to x86, and the new patches have been confirmed working on Void Linux's Power ISA port and Fedora 31. To make the most of these changes, you should also upgrade to at least Mesa 19.3 and LLVM 9.0.1 when these become finalized to avoid various other cross-platform issues with Navi. Still, more hardware support is good support, and the changes are straightforward enough that they should get accepted into the kernel relatively soon. Share Get link Facebook X Pinterest Email Other Apps Post a Comment (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2019/11/how-far-weve-come-in-power-isa.html" }, "headline": "How far we've come in Power ISA","description": "We haven\u0026#39;t done a lot of chip pr0n lately, so let\u0026#39;s do a little as a fun aside. Recently I bought a naked 601 (in this case a 601+...","datePublished": "2019-11-27T20:08:00-08:00", "dateModified": "2019-11-27T20:09:46-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1osqGaQGmBCDSr-_CrwpTgUP9DmXAwOFOBTfc3xhXXuWxLlm1-C20qVYXGZvjp_-BWYRLSiqfsB0DzmLQmDDAeTAPkhfyjpqKRB_sSmM2vt2knNl6xjd69QBDYoKeEw1rRZK2Q4zXweE/w1200-h630-p-k-no-nu/IMG_20191020_153813.jpg", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on November 27, 2019 How far we've come in Power ISA We haven't done a lot of chip pr0n lately, so let's do a little as a fun aside. Recently I bought a naked 601 (in this case a 601+, the second revision) since I figured it would look nice in my computer room along with my POWER9 die, shown at right in their display boxes. Just how does that old 601, the very first PowerPC, compare with the POWER9? With painstaking precision propping my Pixel 3 on the end of a cereal box for height and eyeballing the distances with a Home Depot yardstick, I lined up both the 601 and the POWER9 die at the same scale, shown here. The 601+ at left was manufactured on a 0.5 micron CMOS process in 4 layers, measuring 74 square millimetres. This is a die shrink of the original, which was manufactured at 0.6 microns in 4 layers and measured 121 sq mm. Both the 601 and 601+ have a single 32-kilobyte unified L1 cache, which was dispensed with for the 603, and 2.8 million transistors. At 80MHz, the original 601 consumed 8 watts; the 601+ die shrink reduced it to 4 watts at 100MHz. The POWER9 die at right, on the other hand, is rather larger at 693.37 sq mm. This is almost six times larger than the original 601 and 9.3 times larger than the 601+, but with multiple cores and L1, L2 and L3 cache all crammed onboard in 8 billion transistors — almost 3,000 times more. Shipping POWER9 chips are built on a 14nm FinFET on SOI process in 17 layers and consume between 90 and 190W depending on core count at clock speeds from 2.25GHz to 3.8GHz. In this oblique view you can see the functional units a bit better. The amount of power in modern Power ISA chips would have been absolutely unthinkable in 1992, particularly at modern process sizes. I, for one, welcome our future POWER10 overlords. Finally, I've been meaning to post this picture for awhile that Mikey Neuling sent, with Anton Blanchard and Hugh Blemings showing off Microwatt running on an FPGA board (and Hugh's well-traveled Blackbird demo board) at OpenPOWER Europe in October. Now that's a mighty fine logo. The person who came up with that should be congratulated. If you're States-side, happy Thanksgiving, and if you're not, eat some turkey anyway because it's better than that burger you were going to have. Share Get link Facebook X Pinterest Email Other Apps 1 comment { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2019/11/mips-open-initiative-isnt-anymore.html" }, "headline": "MIPS Open Initiative isn't anymore","description": "Less than a year after it launched , the MIPS Open Initiative has apparently terminated. Despite the happy talk still up on the main site...","datePublished": "2019-11-24T16:50:00-08:00", "dateModified": "2019-11-24T16:50:46-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjKrebJYKA7PktotQ3TzvcwO7pcJ3MJhDyGj7YCN634V_OLfSA3voSVMMPk5-UQJcd5No87YK6QgpuEBXmyb9-rS40bpawkpPkJsznrDpeQEvzXUj7sR9QJ4fKN-TiM1EYprvo2VzfRozo/w1200-h630-p-k-no-nu/alwaysopenclosed.jpg", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on November 24, 2019 MIPS Open Initiative isn't anymore Less than a year after it launched, the MIPS Open Initiative has apparently terminated. Despite the happy talk still up on the main site, and no sign of public notification, Hackster is reporting that Wave Computing has terminated the offering with an extract from a legal letter stating it became effective on November 14. The complete letter is posted here. Indeed, the new sign up page simply 404s, though as of this writing the GNU tools downloads are still up. It's debatable how open MIPS Open Initiative really was, compared to, say, OpenPOWER (or RISC-V or OpenSPARC). MIPS Open had a more legally problematic licensing structure called "open use" which only allowed registered participants to develop under the MIPS Open Architecture 1.0 license, requiring prior approval and developers under the MOA-1 license "to provide upon request by MIPS or its authorized MIPS Open Verification Partner, information demonstrating that such implementation in its current format is a MIPS Open CERTIFIED Independent Core." No community governance existed and anecdotal reports circulated that gaining access to critical developer resources was arduous and bureaucratic. For OpenPOWER, however, all an implementor has to do is meet the specification and obey the trademark requirements. More importantly, now that OpenPOWER is part of the Linux Foundation IBM can't backtrack even if they wanted to (and it's pretty clear they're happy with the response to OpenPOWER so far). And the free VHDL implementation Microwatt is just a Github clone away. Meanwhile, clearly Wave doesn't want people to realize what's happened, given how delayed the news has been and how little announcement they themselves have made. Even less clear is what prompted the withdrawal, but the most likely theory is Wave is planning to put MIPS up for sale. Funded as an AI startup and lacking customers, the last thing Wave's backers want is IP they can't unload for dollars, which may explain why Wave CEO Art Swift was pushed out after four months. The question is whether anyone is commercially interested anymore. Share Get link Facebook X Pinterest Email Other Apps Post a Comment { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2019/11/bettering-bmc-and-bring-up.html" }, "headline": "Bettering the BMC and bring-up","description": "Pretty much every computer these days has a service processor of some sort for bringing up the system and the main CPUs, just sometimes unde...","datePublished": "2019-11-19T18:25:00-08:00", "dateModified": "2019-11-19T22:19:35-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name"'''
