title = "Baseline JIT patches available for Firefox ESR128 on OpenPOWER"
description = "It's been a long hot summer at $DAYJOB and I haven't had much time for much of anything, but I got granted some time this week to take care ..."
full_description = '''Share Get link Facebook X Pinterest Email Other Apps Labels Firefox Software { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2024/08/baseline-jit-patches-available-for.html" }, "headline": "Baseline JIT patches available for Firefox ESR128 on OpenPOWER","description": "It\u0026#39;s been a long hot summer at $DAYJOB and I haven\u0026#39;t had much time for much of anything, but I got granted some time this week to ta...","datePublished": "2024-08-10T17:44:00-07:00", "dateModified": "2024-08-10T17:44:15-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on August 10, 2024 Labels: Firefox Software Baseline JIT patches available for Firefox ESR128 on OpenPOWER It's been a long hot summer at $DAYJOB and I haven't had much time for much of anything, but I got granted some time this week to take care of an unrelated issue and seized the opportunity to get caught up. The OpenPOWER Firefox JIT still crashes badly in Wasm and Ion for reasons I have yet to ascertain, but the Baseline Interpreter and Baseline Compiler stages of the JIT continue to work great and are significantly faster than the baseline Interpreter (even in a PGO-LTO build), so I did the needful and finally got them pulled up to the new Extended Support Release which is Firefox 128. I then spent the last two days bashing out crashes and bugs, including a regression from Firefox's new WebAssembly-based in-browser translation engine. The browser chrome now assumes that WebAssembly is always present, but on JIT-less tier-3 machines (or partially implemented JITs like ours, and possibly where Wasm is disabled in prefs) it isn't, so it hits an uncaught error which then blows up substantial portions of the browser UI like the stop-reload button and context menus. The Fedora official ppc64le build of Firefox 128.0.3 is affected as well; I filed bug 1912623 with a provisional fix. Separately all JIT and JavaScript tests completely pass in multiple permutations of Baseline Interpreter and Baseline Compiler, single- and multi-threaded. As a sign of confidence I've been dogfooding it for the last 24 hours with my typical massive number of tabs and add-ons and can't get it to crash anymore, so I'm typing this blog post in it and using it to upload its own changesets to Github. Grab the ESR source from Mozilla (either pull a tree with Mercurial or just download an archive) and apply the changesets in numerical order, though after bug 1912623 is fixed you won't need #823094. The necessary .mozconfig for building an LTO-PGO build, which is what I'm using, is also in that issue; it's pretty much the same as earlier ones except for --enable-jit. Little-endian POWER9 remains the officially supported architecture. This version has not been tested on POWER8 or big-endian POWER9, though the JIT should still statically disable itself even if compiled with it on, so the browser should still otherwise work normally. If this is not the case, I consider that a bug, and will accept a fix (I don't have a POWER8 system here to test against). There are no Power10 specific instructions, but I don't see any reason why it wouldn't work on a Power10 machine or on a SolidSilicon S1 whenever we get one of those. Comments always solicited, though backtraces and reliable STRs are needed to diagnose any bug, of course. Meanwhile I've got more work cut out for me but at least we're back in the saddle for another go. Share Get link Facebook X Pinterest Email Other Apps Email Post Comments (function(){var m=typeof Object.defineProperties=="function"?Object.defineProperty:function(a,b,c){if(a==Array.prototype||a==Object.prototype)return a;a[b]=c.value;return a},n=function(a){a=["object"==typeof globalThis&&globalThis,a,"object"==typeof window&&window,"object"==typeof self&&self,"object"==typeof global&&global];for(var b=0;b<a.length;++b){var c=a[b];if(c&&c.Math==Math)return c}throw Error("Cannot find global object");},v=n(this),w=function(a,b){if(b)a:{var c=v;a=a.split(".");for(var f=0;f<a.length- 1;f++){var g=a[f];if(!(g in c))break a;c=c[g]}a=a[a.length-1];f=c[a];b=b(f);b!=f&&b!=null&&m(c,a,{configurable:!0,writable:!0,value:b})}};w("globalThis",function(a){return a||v});/* Copyright The Closure Library Authors. SPDX-License-Identifier: Apache-2.0 */ var x=this||self;/* Copyright Google LLC SPDX-License-Identifier: Apache-2.0 */ var z={};function A(){if(z!==z)throw Error("Bad secret");};var B=globalThis.trustedTypes,C;function D(){var a=null;if(!B)return a;try{var b=function(c){return c};a=B.createPolicy("goog#html",{createHTML:b,createScript:b,createScriptURL:b})}catch(c){throw c;}return a};var E=function(a){A();this.privateDoNotAccessOrElseWrappedResourceUrl=a};E.prototype.toString=function(){return this.privateDoNotAccessOrElseWrappedResourceUrl+""};var F=function(a){A();this.privateDoNotAccessOrElseWrappedUrl=a};F.prototype.toString=function(){return this.privateDoNotAccessOrElseWrappedUrl};new F("about:blank");new F("about:invalid#zClosurez");var M=[],N=function(a){console.warn("A URL with content '"+a+"' was sanitized away.")};M.indexOf(N)===-1&&M.push(N);function O(a,b){if(b instanceof E)b=b.privateDoNotAccessOrElseWrappedResourceUrl;else throw Error("Unexpected type when