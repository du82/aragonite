.contentRemoved"){e='<span class="deleted-comment">'+L+"</span>";break a}e=L}l.body=e;l.timestamp=Date.parse(d.published.$t)+"";d.author&&d.author.constructor===Array&&(e=d.author[0])&&(l.author={name:e.name? e.name.$t:void 0,profileUrl:e.uri?e.uri.$t:void 0,avatarUrl:e.gd$image?e.gd$image.src:void 0});d.link&&(d.link[2]&&(l.link=l.permalink=d.link[2].href),d.link[3]&&(e=/.*comments\/default\/(\d+)\?.*/.exec(d.link[3].href))&&e[1]&&(l.parentId=e[1]));l.deleteclass="item-control blog-admin";if(d.gd$extendedProperty)for(var u in d.gd$extendedProperty)d.gd$extendedProperty[u].name=="blogger.itemClass"?l.deleteclass+=" "+d.gd$extendedProperty[u].value:d.gd$extendedProperty[u].name=="blogger.displayTime"&& (l.displayTime=d.gd$extendedProperty[u].value);p.push(l)}f=p.length<50?null:parseInt(p[p.length-1].timestamp,10)+1;k(p);window.bloggercomments=null};var y=P();y.type="text/javascript";O(y,Q(h+"&callback=bloggercomments"));document.getElementsByTagName("head")[0].appendChild(y)}},hasMore:function(){return!!f},getMeta:function(k,h){return"iswriter"==k?h.author&&h.author.name==c.authorName&&h.author.profileUrl==c.authorUrl?"true":"":"deletelink"==k?c.baseUri+"/delete-comment.g?blogID="+c.blogId+"&postID="+ h.id:"deleteclass"==k?h.deleteclass:""},onReply:function(k,h){g==null&&(g=document.getElementById("comment-editor"),g!=null&&(H=g.style.height,g.style.display="block",q=g.src.split("#")));g&&k&&k!==G&&(document.getElementById(h).insertBefore(g,null),h=q[0]+(k?"&parentID="+k:""),q[1]&&(h=h+"#"+q[1]),g.src=h,g.style.height=H||g.style.height,G=k,g.removeAttribute("data-resized"),g.dispatchEvent(new Event("iframeMoved")))},rendered:!0,initComment:J,initReplyThread:I,config:{maxDepth:c.maxThreadDepth}, messages:b};a=function(){if(window.goog&&window.goog.comments){var k=document.getElementById("comment-holder");window.goog.comments.render(k,V)}};window.goog&&window.goog.comments?a():(window.goog=window.goog||{},window.goog.comments=window.goog.comments||{},window.goog.comments.loadQueue=window.goog.comments.loadQueue||[],window.goog.comments.loadQueue.push(a))},S=["blogger","widgets","blog","initThreadedComments"],T=x,U;S.length&&(U=S.shift());)S.length||R===void 0?T=T[U]&&T[U]!==Object.prototype[U]? T[U]:T[U]={}:T[U]=R;}).call(this); blogger.widgets.blog.initThreadedComments( null, null, {}); SkirmisherJuly 28, 2022 at 6:10 PMThe Kestrel README contains an overview of what needs to be connected: https://gitlab.raptorengineering.com/kestrel-collaboration/kestrel-litex/litex-boards/-/blob/master/README.md#how-to-connectYou can ignore the part about soldering, I believe the "FSI adapter" in the "BMC kit" is a level shifter. Not seen any Arctic Tern-specific instructions so far, though.The listings for both the carrier board and the BMC kit contain the phrase "[...]a full BMC hardware solution for our Talos II and Blackbird products." Ironically, the Kestrel README still states it has been tested on Blackbird and *not* Talos II... Raptor was never great about consistency or keeping their resources up to date.Also, the PCIe connection is nonessential according to Raptor's Twitter, and (as I understand it) isn't even enabled on Kestrel yet. It will be necessary if you want to use the BMC as a framebuffer, though, and you'll have to get creative with positioning it close enough to the required connectors.https://nitter.snopyta.org/RaptorCompSys/status/1549106092621369345https://nitter.snopyta.org/RaptorCompSys/status/1548097582630445058ReplyDeleteRepliesClassicHasClassJuly 28, 2022 at 6:40 PMThat was not the language up on the site when this article went out, so I'm glad they corrected it. However, as for the rest of what you said, you've made my point: there's really insufficient documentation up for a $1600 device. At minimum there needs to be an installation guide. I appreciate the insider information though.DeleteRepliesReplyAnonymousJuly 28, 2022 at 8:33 PMI'm assuming these should be treated as early developer units right now, for people who care enough about the BMC attack surface to take a chance on some early-stage hardware. I intend to take a soldering iron to one of my Talos2 motherboards to change the pinstraps on the ASPEED so I don't even have to let it boot. And if that doesn't work, I will desolder it completely.DeleteRepliesReplyAnonymousJuly 28, 2022 at 9:57 PMRaptor here. Right now we're in the initial launch focused more on the developer market, and will be publishing a more end-user focused how-to guide in the near future.Regarding Talos II / Blackbird, the end target is both systems. Right now, firmware support exists but we are still working through instability potentially related to the longer distance between the TPM header and the card on Blackbird mainboards -- obviously this is something we would like to solve with HDL updates prior to recommending the card be installed in a non-developer Blackbird system.Please keep in mind Kestrel is a massive project that is attempting to provide a lot of functionality in open form for the first time. As such it is still very much a work in progress, and while the hardware is in a final form the HDL itself is still being worked on, for example the PCIe interface is not yet active in the Kestrel system beyond supplying power to the card. We are actively working on an open PCIe core that would enable the data links on the card, but do not have a timeline for release yet.DeleteRepliesReplyAnonymousJuly 28, 2022 at 10:00 PMAs a follow on to the above, yes, the card can and does work without being attached to a PCIe slot. It does mean that you have to find an alternate mechanical mounting means while keeping the TPM header close to the LPC header on the card, but it is a supported configuration. In that case, it is likely useful to keep the ASpeed SoC active enough to serve as the VGA controller, since even after the PCIe enablement is complete for Arctic Tern there would still be no way to use it to replace the ASpeed VGA controller block without it being plugged into a PCIe slot.DeleteRepliesReplySkirmisherJuly 28, 2022 at 10:27 PMYeah, I'm not happy about it either—as it stands, I had to do plenty of digging to get everything working how I wanted in Blackbird-land in the first place. This is a pretty weak showing for a product launch, yet other than the "development kit" language, RCS seems to act like it's a proper thing. It's unclear whether this is its final form or whether there will be a stripped-down cheaper option later on (besides "buy an ECP5 devboard and roll your own")......which is especially pertinent given the pricing on display here. The bundle is $300 more than the module + carrier separately, and for what, some cables and adapters??? I know JTAG gets expensive, but at least give a name to this "JTAG adapter" being included.Unfortunately the BMC on my household's Blackbird has become quite flaky when it comes to cold-starting, so in the end Arctic Tern may be a necessary purchase for me to avoid a lifetime of turn-it-off-and-on-again anytime the power goes out. That's why I sought out the info about the carrier board's PCIe, given the Blackbird's limitations in that department. Given that motivation, Raptor is making it surprisingly hard to press the buy button on this kit...DeleteRepliesReplySkirmisherJuly 28, 2022 at 10:37 PMAh, I wrote my entire post before seeing Raptor's comments. I appreciate the information (and all the hard work you folks do!), but I came away from the initial announcements more confused and wanting for info than anything else. Twitter is not the best platform for providing details, after all... 😅 It's useful to know that there's more to come regarding end-user installation etc. ahead of time, if only to avoid the feeling of needing to do detective work to make an informed decision. I mainly didn't want to be left out in the cold (hah) if the stock were to vanish, hence my harried deliberations.DeleteRepliesReplyReplyAnonymousJuly 28, 2022 at 9:59 PMDoes that mean Raptor will produce revised motherboards with the BMC replaced ? Or will they wait for whatever next Power CPU that is really open to integrate it in the motherboard design?ReplyDeleteRepliesAnonymousJuly 28, 2022 at 10:02 PMThe long and short of this is ... it depends. We already have a special-purpose mainboard (Sparrowhawk, 6U VPX) that has no ASpeed onboard, and uses essentially a soldered-down Kestrel system instead. Whether this trickles down to the consumer market depends entirely on how quickly the remaining features can be implemented and the final performance results along with whether enough POWER9 volume remains at that time to justify such an invasive / costlypdate to the mainboard designs.DeleteRepliesReplyReplyGeneric POWER UserJuly 31, 2022 at 10:11 PMIt's good seeing this won't eat up that x8 slot. One more thing to buy in the future but should be worth it in the long run!ReplyDeleteRepliesReplyJoel S.August 20, 2022 at 10:18 AMThere's a new installation guide available as of this week:'''
