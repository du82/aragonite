full_description = '''Share Get link Facebook X Pinterest Email Other Apps Labels Hardware News { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2022/07/arctic-tern-available-for-purchase.html" }, "headline": "Arctic Tern available for purchase","description": "Raptor now has Arctic Terns available for purchase , along with the user\u0026#39;s guide . The US$1600 bundle comes with the PCIe carrier card...","datePublished": "2022-07-28T15:27:00-07:00", "dateModified": "2022-07-28T18:39:01-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjz3ompCwKImjF7wE8tysZWFg-BLDQiCXlmxMqAufm4d_jbsVDmx0ElzIBKQvlC8FmncZ7E1TiMfk3XJc9De3UNK0_TzdSt34jaRDhrhVnZN2SECfkC5EH2hudHKmVIB_b4ImhDQclL8x2UsiNRCICdCXuoUqM2ceSWRqwiqcB1n_66xqCCaqzQQI2z/w1200-h630-p-k-no-nu/boardlarge.png", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on July 28, 2022 Labels: Hardware News Arctic Tern available for purchase Raptor now has Arctic Terns available for purchase, along with the user's guide. The US$1600 bundle comes with the PCIe carrier card, one ECP5 FPGA module (using Microwatt, the FPGA OpenPOWER core), FSI and JTAG adaptors and all the necessary cabling to connect to a Talos II system (we presume this means the entire T2 family including the T2 Lite and Blackbird, but it doesn't say — more about that in a moment UPDATE: it does now). As it is designed to completely replace the onboard ASPEED BMC, there are fan, Ethernet and two (!) HDMI connectors on board. There is a second module slot as we surmised, but it appears most board functions will be available with just one FPGA module installed, as provided in this bundle (fortunate since an extra module is US$900). Unfortunately it looks like it does need its own PCIe slot and people like me with a nearly full loadout will be a bit disappointed if that's truly the case. We don't yet know, because the user's guide doesn't look like it has installation instructions for any T2 family system either even though it does have Raptor's usual studious pinouts and schematics. Being primarily a peripheral, I look forward to seeing additional documentation posted since no one wants to buy a $1600 card, get it home and accidentally brick it and their expensive OpenPOWER computer. Once I get my hands on one, we'll talk more about it. Share Get link Facebook X Pinterest Email Other Apps Email Post Comments (function(){var m=typeof Object.defineProperties=="function"?Object.defineProperty:function(a,b,c){if(a==Array.prototype||a==Object.prototype)return a;a[b]=c.value;return a},n=function(a){a=["object"==typeof globalThis&&globalThis,a,"object"==typeof window&&window,"object"==typeof self&&self,"object"==typeof global&&global];for(var b=0;b<a.length;++b){var c=a[b];if(c&&c.Math==Math)return c}throw Error("Cannot find global object");},v=n(this),w=function(a,b){if(b)a:{var c=v;a=a.split(".");for(var f=0;f<a.length- 1;f++){var g=a[f];if(!(g in c))break a;c=c[g]}a=a[a.length-1];f=c[a];b=b(f);b!=f&&b!=null&&m(c,a,{configurable:!0,writable:!0,value:b})}};w("globalThis",function(a){return a||v});/* Copyright The Closure Library Authors. SPDX-License-Identifier: Apache-2.0 */ var x=this||self;/* Copyright Google LLC SPDX-License-Identifier: Apache-2.0 */ var z={};function A(){if(z!==z)throw Error("Bad secret");};var B=globalThis.trustedTypes,C;function D(){var a=null;if(!B)return a;try{var b=function(c){return c};a=B.createPolicy("goog#html",{createHTML:b,createScript:b,cre