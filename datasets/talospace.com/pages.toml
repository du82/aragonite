full_description = '''Posts Showing posts from October, 2018 Show all { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/10/fedora-29-out.html" }, "headline": "Fedora 29 out","description": "The IBM merger may be in , but Fedora 29 is out, and it\u0026#39;s business as usual at Red Hat with its release today. Fedora is our distro here...","datePublished": "2018-10-30T08:51:00-07:00", "dateModified": "2018-10-30T22:29:13-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on October 30, 2018 Fedora 29 out The IBM merger may be in, but Fedora 29 is out, and it's business as usual at Red Hat with its release today. Fedora is our distro here at Floodgap-Talospace and we'll be updating soon with a review focused on F29 and how it works on the Talos II. Under the Fedora Alternative Architectures are server and "everything" install images for both big-endian ppc64 and ppc64le (though I still believe that ppc64's lifetime is limited on Fedora, and it's highly possible this issuance will be a dead end). You can then immediately download the components to turn these into workstation releases (I did a "quick" dnf install @workstation-product-environment on my own system but you can also go into gory detail). More coverage in Fedora Magazine with update instructions (from F27 to F28, but the same steps will work from F28 to F29). Also announced in parallel: Red Hat Enterprise Linux 7.6. Share Get link Facebook X Pinterest Email Other Apps Post a Comment (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/10/ibm-buys-red-hat.html" }, "headline": "IBM buys Red Hat","description": "Red Hat has been purchased by IBM in a deal worth US$33.4 billion or approximately US$190/share, well above its Friday closing price of US...","datePublished": "2018-10-28T16:21:00-07:00", "dateModified": "2018-10-28T16:27:53-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj3yK9WQxSeRH_tT7ij1OVt7jvHy8BRo-gtVDPMvDePinN1FVGewcWp0bQ5NM3aIQB0U33d2KHa6GGhruTu4sGIhkwxXVLTFM0G3afr7OaXZZ4TriecNCnktvg3DIkPWL57DsQi28PEEFM/w1200-h630-p-k-no-nu/red-hat-and-ibm.png", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on October 28, 2018 IBM buys Red Hat Red Hat has been purchased by IBM in a deal worth US$33.4 billion or approximately US$190/share, well above its Friday closing price of US$116.68. The deal is clearly positioned to diversify IBM away from its stable but slow-growing legacy mainframe line of business, which recently had been the only major portion of the company with a positive showing, and jump-start its ailing cloud offerings. What this means for Red Hat Enterprise Linux (RHEL), the company's premier enterprise offering, is continued stability for large customers and their service contracts. IBM has always served its large accounts well and this will increase confidence in using IBM server hardware outside of the traditional AIX and Z shops. It also almost certainly indicates an enhanced commitment to RHEL on IBM's POWER hardware, which due to being a Linux on Power partner was already the preferred Linux option on hardware IBM sold directly, and IBM may push RHEL to OpenPOWER hardware customers as a product more strongly in the future. Fedora is also very unlikely to be affected by this: IBM has made substantial contributions to open source over the years, and fumbling a high-profile project like Fedora which even Linus himself uses (at least of late) would be an own goal of such epic proportions that even the sometimes brazenly incompetent IBM upper management would probably not do it. However, given that as far back as 2016 IBM said that ppc64le was the future for Linux on POWER, this all but guarantees big-endian ppc64 will not return to Fedora after its removal in the upcoming F29. (We run F28 on our own Talos II.) The outlook for the various Fedora and Red Hat downstreams like CentOS is less clear, but it seems reasonable to assume that if Fedora remains intact, they will also continue to do so (albeit potentially with less official support post IBM-Red Hat, and it is possible CentOS developers who work for Red Hat may not be so employed after the merger). There is no word on what this means for Red Hat's other products. From the perspective of the OpenPOWER ecosystem and the Talos systems specifically, there are good reasons for optimism. It more firmly weds IBM and Power ISA to Linux and will likely elevate ppc64le to a tier-1 offering within the Red Hat and Fedora ecosystem to further IBM's strategic goals with OpenPOWER. To the extent the underlying work makes its way back to the Linux source tree, it in turn can trickle down into better POWER9 and Power ISA support in any Linux distribution that chooses to take advantage of it, and that eventuality can only be positive. Unfortunately IBM management has recently become more ossified and less visionary than ever, and as a result the company has not shown good performance and innovation outside of its core large system competency and its research labs. The old joke during the Power Mac AIM (Apple-IBM-Motorola) alliance days was Apple plus IBM equals IBM, but no one was really laughing. Red Hat certainly has its own bureaucratic issues to deal with, but our worry is that the IBM monolith will affect Red Hat far more than the other way around. Share Get link Facebook X Pinterest Email Other Apps Post a Comment (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/10/patches-needed-for-firefox-63.html" }, "headline": "Patches needed for Firefox 63","description": "Unfortunately the most currently available package of Firefox 63 for Fedora 28 ppc64le doesn\u0026#39;t even start, but again, it works fine if ...","datePublished": "2018-10-27T17:19:00-07:00", "dateModified": "2018-10-27T17:32:10-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on October 27, 2018 Patches needed for Firefox 63 Unfortunately the most currently available package of Firefox 63 for Fedora 28 ppc64le doesn't even start, but again, it works fine if you build it from source. If you were able to successfully build Firefox 62 with our .mozconfigs, then you will need to install an updated cbindgen (preferably from your package manager, but I actually had to cargo install cbindgen to get a version recent enough that the build system would accept), node.js (?!), and the patches from bug 1494037 and bug 1498938. (The issue with the Fedora package has been filed as Redhat bug 1643729.) Meanwhile, I'm about halfway through the code generator on my task to add a POWER9 JIT to Firefox based on the work in TenFourFox. Going from a G5 to POWER9 is a big jump. Lots of delicious new instructions. Share Get link Facebook X Pinterest Email Other Apps Post a Comment (adsbygoogle = window.adsbygoogle || []).push({}); { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/10/chromium-for-ppc64le-builds-available.html" }, "headline": "Chromium for ppc64le builds available","description": "While waiting for progress on accepting their patches to the tree , the ppc64le Chromium team has binary builds available .","datePublished": "2018-10-26T22:59:00-07:00", "dateModified": "2018-10-26T22:59:35-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on October 26, 2018 Chromium for ppc64le builds available While waiting for progress on accepting their patches to the tree, the ppc64le Chromium team has binary builds available. Share Get link Facebook X Pinterest Email Other Apps Post a Comment { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.talospace.com/2018/10/blackbird-scheduled-for-availability-in.html" }, "headline": "Blackbird scheduled for availability in Q1 2019","description": "From Twitter , Blackbird exists in hardware, and is estimated for general availability in Q1 2019. Our spies at OpenPOWER found the unit to ...","datePublished": "2018-10-23T09:36:00-07:00", "dateModified": "2018-10-23T09:36:10-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/w1200/", "height": 348, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "ClassicHasClass" } } Posted by ClassicHasClass on October 23, 2018 Blackbird scheduled for availability in Q1 2019 From Twitter, Blackbird exists in hardware, and is estimated for general availability in Q1 2019. Our spies at OpenPOWER found the unit to be well-developed and functional, but a solid first impression obviously is no substitute for a full review. I'll 