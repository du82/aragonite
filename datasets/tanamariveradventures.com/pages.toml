["https://tanamariveradventures.com/what-to-bring"]
title = "What to Bring"
description = "Rappelling, Caves, Caverns, Waterfalls, History, Culture, Family Experiences"
full_description = "Caving| Rappelling | Underground River | Caverns | Waterfalls | Ancient Trails (787) 462-4121HomeToursVideosInformationFQ&AWhat to BringPolicyDirectionsMásHomeToursVideosInformationFQ&AWhat to BringPolicyDirections(787) 462-4121HomeToursVideosInformationFQ&AWhat to BringPolicyDirections -Have a good rest the night before, have a good breakfast the day of your Adventure with us and be on time, 8- 8:30am, and come with a Positive attitude to experience one of the best Nature Adventures in Puerto Rico in terms of river, caves, history and culture. -Bring close toes tennis shoes or any hiking shoes with good traction for a rocky and slippery terrain. Or Sneakers that can get wet, water shoes are ok. -Bring clothes good for the water, like dry fit clothes or exercise clothes, (no jeans), short pants and a T-shirt is ok. The water temperature is about 68 - 75 degrees fahrenheit. -Bring X-tra clothes and a towel to change at the end, bring a camera or celular phone for pictures. -Bring a small backpack with *water and *snacks, Very important! You can get water and snacks at our store, or bring your own please. -*Water and snacks are mandatory for the Tour."
