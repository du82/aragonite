title = "Directions"
description = "Rappelling, Caves, Caverns, Waterfalls, History, Culture, Family Experiences"
full_description = "Caving| Rappelling | Underground River | Caverns | Waterfalls | Ancient Trails (787) 462-4121HomeToursVideosInformationFQ&AWhat to BringPolicyDirectionsMásHomeToursVideosInformationFQ&AWhat to BringPolicyDirections(787) 462-4121HomeToursVideosInformationFQ&AWhat to BringPolicyDirections Tanama River Adventures is a Family-Community based Business, operated by Native local people. With more than 15 years of experience of living and working at Tanama River National Forest in Utuado, Puerto Rico. Our passion for Our Indigenous and Natives costumes, brought our Business to settle down at the side of Caguana Ceremonial Indian Grounds in Utuado, Puerto Rico. Caguana Ceremonial Indian Grounds is one of the Top 50 places to visit in Puerto Rico and one of the Top 10 places to visit in terms of History and Culture. Our small two acres Tropical Forest is connected with the Sacred Grounds of Caguana Ceremonial Indian Park at our left side, as shown on the picture, (aerial view of Tanama River Adventures location). At our right side we are connected with the main road #111 (Enrique Laguerre). Easy access to our place and safe area. Our commitment is to create Natural Professional Experiences, where You, our Participant, can feel One with Nature, giving You the opportunity to explore and enjoy Natural Wonders like in Ancient times, with the safety and technologies of these days. Our meeting point will be at our private lacation on road #111, Km. 48.4 Bo. Caguana, Utuado, Puerto Rico, 00641. Our location is near the Caguana Ceremonial Indian Grounds. With private and secure parking. A store where you can get water and healthy snacks. Restrooms and changing rooms available. We open doors at 7:45 am. -on highway #22 (heading West), take exit 75b, to road #10 South. (exit 75b is in the municipality of Arecibo). – Drive South on road #10 for about 20 miles or around 20 minutes, driving at 50mph, (speed limit) until you reach the first and only traffic light on road #10 South, This is the intersection with road # 111. You will find this intersection on road #10 after you pass the second gas station at your right side."
