title = "Policy"
description = "Rappelling, Caves, Caverns, Waterfalls, History, Culture, Family Experiences"
full_description = "Caving| Rappelling | Underground River | Caverns | Waterfalls | Ancient Trails (787) 462-4121HomeToursVideosInformationFQ&AWhat to BringPolicyDirectionsMásHomeToursVideosInformationFQ&AWhat to BringPolicyDirections(787) 462-4121HomeToursVideosInformationFQ&AWhat to BringPolicyDirections Customer will receive Full credit refund (100% refund) for any cancellations made from Tanama River Adventures company. This may includes any cancellations from bad weather or any other reason made by Tanama River Adventure. Customers will receive 75% refund or credit with 72 hours notice of cancellation prior to the Adventure Tour date. This 75% refund are for cancellations made (3) three days or more before the Adventure Tour begins. Any cancelations after 72 hours prior to the Tour will be eligible for an 50% refunds, except for cancellations made the same date of the Adventure Tour. Cancellations the same date of the Tour will be consider a no show up. No refunds for cancellations made at the same date of the reservation. Customers will also receive a full refund or credit in case of operator cancellation due to weather or other unforeseen circumstances. Contact us by phone to cancel or inquire about a cancellation, send a text message or give us a call. Being on time is important to avoid missing the tour. Arriving time is at 8:30 am or before that time. No-shows will be charged the full price. Important Notice: Tanamá River Adventures company will not get into the details of our customer cancellations. This means that once our customer make a cancellations we will follow our rules Policy."
