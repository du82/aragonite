["https://tanstack.com/blog/announcing-tanstack-query-v5"]
title = "Announcing TanStack Query v5 | TanStack Blog"
description = "About one year ago, we announced the , and the whole team has been working hard on that version ever since. So we're super happy to announce that today is the day: After 91 alpha releases, 35 betas an..."
full_description = "About one year ago, we announced the TanStack Query v5 roadmap, and the whole team has been working hard on that version ever since. So we're super happy to announce that today is the day: After 91 alpha releases, 35 betas and 16 release candidates, TanStack Query v5.0.0 is finally here! 🎉 v5 continues the journey of v4, trying to make TanStack Query smaller (v5 is ~20% smaller than v4), better and more intuitive to use. One of the main focus points for this release was around streamlining and simplifying the APIs we offer: As a big breaking change, we've removed most overloads from the codebase, unifying how you use useQuery and other hooks. This is something we wanted to do for v4, but a TypeScript limitation prevented us from doing that. TypeScript addressed this issue in TS 4.7, so we were able to remove all the overloads that we had for calling useQuery with a different amount of parameters. This is a huge DX win, because methods with overloads usually have quite bad TypeScript error messages. This is the biggest breaking change in v5, but we think it's worth it. The API is now much more consistent - you always just pass one object. To alleviate the pain of changing all occurrences manually, we have tried to prepare everyone for this coming change for the last months. The documentation was changed to use the new API, and we released an auto-fixable eslint rule in our eslint package. Additionally, v5 comes with a codemod to help with the transition. Apart from that, we've renamed cacheTime to gcTime to better reflect what it is doing, merged keepPreviousData with placeholderData, renamed loading states to pending and removed the callbacks from useQuery. All these changes make v5 the most consistent and best version for new starters. Enjoy a brand new, simplified way to perform optimistic updates by leveraging the returned variables from useMutation, without having to write code that updates the cache manually. For more details, have a look at the optimistic updates documentation"
author = "Dominik Dorfmeister"
year_published = 2025
clearnet = "https://tanstack.com/blog/announcing-tanstack-query-v5"
