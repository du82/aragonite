["https://tanstack.com/form/latest/docs/framework/react/guides/ssr"]
title = "React Meta-Framework Usage | TanStack Form React Docs"
description = "TanStack Form is compatible with React out of the box, supporting SSR and being framework-agnostic. However, specific configurations are necessary, according to your chosen framework. Today we support..."
full_description = "TanStack Form is compatible with React out of the box, supporting SSR and being framework-agnostic. However, specific configurations are necessary, according to your chosen framework. Let's start by creating a formOption that we'll use to share the form's shape across the client and server. Then we need to establish a way to grab the form data from serverValidate's response using another server action: Finally, we'll use getFormDataFromServer in our loader to get the state from our server into our client and handleForm in our client-side form component. Before reading this section, it's suggested you understand how React Server Components and React Server Actions work. Check out this blog series for more information This section focuses on integrating TanStack Form with Next.js, particularly using the App Router and Server Actions. Let's start by creating a formOption that we'll use to share the form's shape across the client and server. Here, we're using React's useActionState hook and TanStack Form's useTransform hook to merge state returned from the server action with the form state. This is because you're not importing server-side code from @tanstack/react-form/nextjs. Ensure you're importing the correct module based on the environment. Before reading this section, it's suggested you understand how Remix actions work. Check out Remix's docs for more information Let's start by creating a formOption that we'll use to share the form's shape across the client and server. Here, we're using Remix's useActionData hook and TanStack Form's useTransform hook to merge state returned from the server action with the form state."
