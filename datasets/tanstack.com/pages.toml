["https://tanstack.com/form/latest/docs/framework/react/guides/linked-fields"]
title = "Link Two Form Fields Together | TanStack Form React Docs"
description = "You may find yourself needing to link two fields together; when one is validated as another field's value has changed. One such usage is when you have both a password and confirmpassword field, where..."
full_description = '''You may find yourself needing to link two fields together; when one is validated as another field's value has changed. One such usage is when you have both a password and confirm_password field, where you want to confirm_password to error out when password's value does not match; regardless of which field triggered the value change. In this example, the form will still have errors present, as the "confirm password" field validation has not been re-ran to mark as accepted. To solve this, we need to make sure that the "confirm password" validation is re-run when the password field is updated. To do this, you can add a onChangeListenTo property to the confirm_password field. This similarly works with onBlurListenTo property, which will re-run the validation when the field is blurred.'''
