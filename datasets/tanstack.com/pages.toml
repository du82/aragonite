["https://tanstack.com/ethos"]
title = "TanStack Ethos"
description = "Our philosophy and commitment to building for the open web."
full_description = '''At TanStack, our philosophy is simple: we build for the open web, open standards, and the freedom to compose, deploy, and innovate however you see fit. TanStack LLC is 100% privately owned by its founder—no external investors, no controlling interests, and no hidden agendas. Our funding comes from media and marketing partnerships with companies that share our core values: the open web, open standards, and the freedom to compose and deploy anything you want, anywhere you please. TanStack is a lean, focused team: a full-time founder, several prominent and well-sponsored maintainers and a thriving community of users and contributors who share our core values. Unlike venture-backed projects chasing growth at all costs, we don't need to "scale", "grow", or "expand" into a VC-funded, acquisition-seeking, or freemium-grifting product. We're not obsessed with hitting the next 10x multiplier to satisfy some parent company's lead-generating IPO ambitions. We believe in framework-agnostic, platform-agnostic, and future-proof tooling that puts developers first: At the end of the day, TanStack isn't just a set of libraries—it's a commitment to building the web on your terms, without compromise. All we need is enough to keep improving tools that we believe actually make the web a better place.'''
