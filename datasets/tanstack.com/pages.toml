["https://tanstack.com/table/latest/docs/introduction"]
title = "Introduction | TanStack Table Docs"
description = 'TanStack Table is a Headless UI library for building powerful tables & datagrids for TS/JS, React, Vue, Solid, Qwik, and Svelte. What is "headless" UI? Headless UI is a term for libraries and utilitie...'
full_description = "TanStack Table is a Headless UI library for building powerful tables & datagrids for TS/JS, React, Vue, Solid, Qwik, and Svelte. Headless UI is a term for libraries and utilities that provide the logic, state, processing and API for UI elements and interactions, but do not provide markup, styles, or pre-built implementations. Scratching your head yet? 😉 Headless UI has a few main goals: The hardest parts of building complex UIs usually revolve around state, events, side-effects, data computation/management. By removing these concerns from the markup, styles and implementation details, our logic and components can be more modular and reusable. Building UI is a very branded and custom experience, even if that means choosing a design system or adhering to a design spec. To support this custom experience, component-based UI libraries need to support a massive (and seemingly endless) API surface around markup and style customization. Headless UI libraries decouple your logic from your UI When you use a headless UI library, the complex task of data-processing, state-management, and business logic are handled for you, leaving you to worry about higher-cardinality decisions that differ across implementations and use cases. Each approach has subtle tradeoffs. Understanding these subtleties will help you make the right decision for your application and team. Component-based table libraries will typically supply you with a feature-rich drop-in solution and ready-to-use components/markup complete with styles/theming. AG Grid is a great example of this type of table library. If you want a ready-to-use table and design/bundle-size are not hard requirements, then you should consider using a component-based table library. There are a lot of component-based table libraries out there, but we believe AG Grid is the gold standard and is by far our favorite grid-sibling (don't tell the others 🤫). Headless table libraries will typically supply you with functions, state, utilities and event listeners to build your own table markup or attach to existing table markups."
year_published = 2025
clearnet = "https://tanstack.com/table/latest/docs/introduction"
