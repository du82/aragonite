title = "The Supernote A6X2 Nomad - Tao of Mac"
description = "I spent the holiday season practicing my handwriting, which was… unexpected."
full_description = "Jan 18th 2025 · 25 min read · #android #e-ink #handwriting #nomad #note-taking #obsidian #reviews #supernote The Supernote A6X2 Nomad I spent the holiday season practicing my handwriting, which was… unexpected. The reason why is that I got a Supernote Nomad, which was enough to warrant spending a pretty large chunk of time using it either exclusively or in tandem with my other devices. Although it’s been only a couple of months, the part of me that initially pondered the Nomad as a “better notebook” is still reeling, since I feel like I’ve barely scratched the surface, but I’m getting ahead of myself. Disclaimer: Supernote sent me the Nomad, a magnetic folio cover and a pen (for which I thank them), and this article follows my Review Policy. The bundle came quite nicely packaged, to the point where I feel a little guilty about eventually having to recycle it. One of the reasons I wanted to try the Nomad that will likely resonate with a lot of my readers is that I wanted a way to “unplug” while being able to capture my notes in some form of digital format. The Internet is full of stories of people who are looking for less distracting devices, so I won’t add to those other to emphasize that I have also been pursuing ways to increase (or, rather, restore) my ability to focus on a few key things. I have an unusual memory–neither photographic nor complete, but oddly specific. I rarely took notes in college, but I enjoy the focus that handwriting demands, even though I know I’m more efficient at long-form writing with a keyboard, whether in stream-of-consciousness mode or during iterative editing. I’ve long known that proprioception and the hippocampus do help in forming associative memories that help me recall where and what I wrote, but the real challenge these days isn’t remembering what you wrote–it’s capturing it without distractions. There is something about doing handwriting on computers that I find profoundly appealing–I used a Newton MessagePad and was obsessed about Palm devices (I still have a working Palm V somewhere), so being able to quickly scrawl out something on a distraction-free device and then re-work it on my Mac later is extremely attractive to me. “Slow” times and being able to focus on painstakingly handwriting something (as well as the physical sensations of writing itself) are a luxury that seldom comes my way, so my take on the Nomad is likely to read a bit different from most other folk due to that. But let’s look at the device itself. HardwareE-ink devices distinguish themselves more by their screen and other physical specs than CPU power or RAM, but I’ll go through them in a single go: Overall size and weight: 139×192×7mm, 266g 7.8” screen with 1404×1872@300 PPI, dubbed as a “Frontlight free” glass screen (yep, no lighting) with a soft film for writing. RK3566 Quad-Core 1.8 GHz CPU with 4GB RAM and 32 GB internal storage (plus internal microSD slot). 2700 mAh (replaceable!) battery. 1 USB-C (2.0/audio/OTG) port (on the top left). Wi-Fi (both 2.4 GHz and 5GHz, which is quite nice) and Bluetooth 5.0 (for keyboard support and audio playback, since there is no speaker) The form factor effectively translates to an A6/iPad Mini-sized device (hence the moniker), making it highly portable and easy to carry around. A fun fact here is that this is the same Rockchip CPU as the XPI-3566-Zero and the Radxa Zero 3W I am still testing, but running without any noticeable heat issues and integrated into an upgradeable motherboard–in fact, you can replace both the motherboard and the battery, which is a notable aspect. The Nomad can ship with a crystal clear back (which shows off its modularity and upgradeability, but is held with some unsightly screws) and a plain white back that is secured by molded clips (which require a deft touch to pop with a spudger or plastic blade). I went for the less flashy option: Very clean and modular, with the battery and motherboard easily accessible. As far as I can tell, the newly released Manta (which launched roughly as I got this) is essentially the same thing with a larger screen, so you could theoretically “upgrade” or swap parts if you wanted to–this is a very pragmatic take on repairability, and is probably the first tablet (of any kind) I got in almost a decade that has a replaceable battery by design, which is enough to praise it even before I get to the software. I suppose this hardware design ethos is also part of why they sell DIY kits for creating your own folio (with matching magnets to the Nomad’s) and a ballpoint “refill” with the EMR parts to build your own pen (which I find intriguing and might try out myself). In the photo above you can see the (pretty strong) top and bottom magnets that the Nomad uses to clip to its folio. Regarding that, I picked the grey canvas option, which given the way pseudo-leathers feel in Winter felt like the right choice at the time–and I quite like it in reality. Even though I know it will eventually get coffee stains (or worse), it looks and feels very nice to the touch, as well as having a quite substantial pen loop. Pen and ScreenGoing through the out-of-box setup experience was a good way to get an initial feel for the screen–it’s not as white as a “paperwhite” screen, but is very readable in daylight, although it can be a bit of a challenge to photograph. This series of photos was taken with the same camera and lighting conditions and you can see there is a bit of variation, plus there is some glare from the writing layer (which isn’t noticeable in person) and my “reflection” on the bottom part of the screen: The out-of-box experience, completely with the first software update. This is a good time to mention that most of the rest of the photos in this post were processed to compensate for camera perspective. Even though they were taken in pairs under roughly the same lighting, I wanted to try to compensate for glare and reflections on camera, so all the shots had to be taken at an angle to the screen and would look awkward. But one thing that is almost immediately noticeable if you’ve used other e-ink devices is that there is barely any shadow or inset from the frame–this is because the screen does not have a front light. This shot shows how close the screen is to the glass surface and the writing layer. The reason for that seems to be the desire to have the least possible amount of material between the pen and the screen–and in e-ink screens, the only way to add a reading light is to add enough of a layer for the light to propagate through. PenI originally wanted a LAMY pen (the Nomad supports its action button, which you can use to erase things) but that was out of stock, so I picked the impressively named Heart of Metal Pen in Samurai Black, which is surprisingly substantial. The Nomad pen and folio. Even though I quite like the modern Apple Pencil, the added thickness and weight distribution on the Samurai make it very pleasant to use, and the combination of the very slightly yielding tip and the subtle screen texturing made for a much nicer writing feel than the “paper-like” coverings I’ve been using on my iPads. SoftwareThe Nomad’s operating system is called Chauvet, and is effectively a heavily customized Android 11 system but to the point where there isn’t really any part of the UI that you would recognize as Android’s. There’s no home screen (just the sidebar icon box, which expands to full screen when you tap the More icon), no multitasking, and no distractions. Everything else in the UI is both spartan and slick. Even with the constraints of e-ink, it was always intuitive and responsive, making it easy to navigate through notes and applications–except side-loaded ones, which tended to be a bit slower and less responsive. Files and Basic NavigationThe two lines that decorate the bezels also mark the location of the Nomad’s touch strips, which you can use with gesture controls to change pen/eraser behavior (on the left by default) and to swipe up or down to force a screen refresh or display the sidebar (on the right by default). So when you swipe on the right, you open a quick access list for common actions, a list of your favorite files and the application tray: The file manager and sidebar. Lock ScreenYou can set a custom wallpaper for your lock screen, and that hides the only bit of the Android heritage that was noticeable to me several times a day–the Nomad can be locked with a six-digit PIN code, which you are prompted for whenever you open the folio, and that first input experience as you try to unlock the device doesn’t feel optimized at all–and is occasionally frustrating since it can actually take a while for the screen to update after you’ve tapped a digit. I know that I am spoiled by the iPad’s lightning quick unlock experience, so I would love to see a fingerprint sensor on the Nomad, or at least an option for delayed locking so that shutting the folio for a few minutes doesn’t actually force me to muddle through the PIN entry. I also wonder if a pattern lock wouldn’t work much better–a couple of pen strokes and you’d be in. Handwriting ExperienceThe primary input method is, unsurprisingly, freeform handwriting. You also have the option of an on-screen keyboard, and, of course, Bluetooth keyboards, but the hidden gem for me is that there is an Android handwriting “soft keyboard”: A pretty great writing experience (with a little Obsidian spoiler) This was a very pleasant surprise that is both reminiscent of how most Palm-era handhelds worked and so much better than the way than Scribble handwriting input works in iOS–where you essentially have to guess where you can set down the tip to write, and often have zero screen real estate to actually do so. It has the same language support as “regular” note-taking, and the Nomad has built-in recognition for Chinese (both simplified and traditional), Japanese and US English, as well as the ability to download additional languages. Portuguese handwriting recognition was OK (I honestly didn’t test it much, seeing as 99% of what I write is in English), but I should note that it was very fiddly to switch between languages (you need to make a several-tap trip back to Settings). Chinese and Japanese handwriting recognition also seemed OK, although it’s been well over 15 years I wrote anything in any of those scripts and have no idea if stroke order helps. But since I am trying to learn a bit more Japanese, I intend to test this a fair bit more in the future. A fly in the ointment was that the more languages I had active, the worse the soft keyboard recognition became (maybe because it also tries to present suggestions and takes up added CPU). However, one thing that I found to be an odd omission is that there is apparently no way to integrate typed text with the Notes app–for instance, you cannot paste in text from other apps or even create a text box to type into, which feels like an odd omission since most other digital note taking solutions I used over the years let you mix handwriting and normal text (not always successfully–and I’m looking at you, OneNote). Managing NotesThe note-taking user experience is very much tied to how you manage your notes, and the first thing you’ll be prompted for when you create a note is a filename plus the “paper” template you want to use (there is an entire cottage industry out there around creating specific kinds of note-taking PDF and PNG templates, forms, and layouts for various activities, but I mostly went with the built-ins). But the really neat thing is that you can turn your notes into a visual Wiki of sorts, with handwriting-centric tables of contents and navigation–when you select a handwritten word and mark it as a TOC entry, it is its handwritten version that is used in the UI, and you can link to that from other places: The ink table of contents feature in action. This seems a trivial thing at first, but the combination of these things means that the visual layout of your notes and how you link between them becomes a lot more important than you might be used to (I certainly had to re-think the way I structure things a bit). You can add pages to .note files (they’re effectively multi-page notebooks) and lasso handwritten text to copy/paste it between pages, so managing long-form is certainly doable, although it might take a little getting used to. And while I researched what Python libraries there are out there to handle Supernote native formats, I found that there are lots of people doing “bullet journal” style note-taking and navigation, as well as various ways to manipulate, enhance and export notes independently (something I have yet to dabble in, although I did spot intriguing hints of Lua inside the files). But the native way to export your notes is trivially easy and reassuring–you just export them out to .txt files and have your way with the result. File FormatsBesides its own proprietary (but already somewhat reverse engineered) .note format, the Nomad supports PDF, EPUB, Word (.doc), Text (.txt), PNG, JPG, WebP, CBZ, FB2 and XPS (plus the Kindle app will open AZW3, MOBI, etc.), but, oddly, no Markdown. The file manager refuses to recognize .md files as supported, which doesn’t prevent you from using Markdown in .txt files but will feel like an annoying limitation to pretty much every techie out there. I get that regular people won’t know the difference between Markdown and a plain text file, but it was disappointing to have effectively zero ways to open a Markdown file on-device without renaming it. A Tiny WordThe Nomad comes with a document editor called Word, which, true to expectations, opens .txt and creates .doc (not .docx) files you can open and continue editing on just about anything (Word, Pages, TextEdit, OpenOffice, etc.). The .doc format is well-established enough that you can edit it seamlessly across different platforms (and edits on my Mac generally made it back, including some font and style changes), but Word has virtually no support for locally adding any kind of formatting beyond the very basic (you can do bold and italic with keyboard shortcuts, but that’s about it), and is probably best thought of as something you can use to clean up recognized text still on device. Using it with a Bluetooth keyboard was straightforward, although I initially thought there were no formatting shortcuts—there are, but depending on the kind of keyboard you use, you might need to double-check how it’s configured. My cheap $20 foldable keyboard works great, but I had to set it to Windows mode to make Ctrl+B and Ctrl+I work. Since there are no styles (only bold and italic), I ended up using Markdown hash marks and bold for headings, which was an acceptable compromise. Screen updates while writing with a Bluetooth keyboard were fine–as you’d expect e-ink makes it a slower experience than when using a regular tablet (and, as a spoiler for later, it may be challenging to keep track of the caret in third-party app"
