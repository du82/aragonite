["https://taoofmac.com/space/links/2024/11/06/1830"]
title = "Trump's improbable comeback - Tao of Mac"
description = "I had a lot on my mind today (my recent change is taking a much bigger toll than anticipated), but this was, of course, inescapable, even fo..."
full_description = "Nov 6th 2024 · 1 min read · #comeback #democracy #election #politics #trump #usa Trump's improbable comeback ➹ I had a lot on my mind today (my recent change is taking a much bigger toll than anticipated), but this was, of course, inescapable, even for someone like me who abhors politics and never mentions it. To my US readership: I didn’t get a vote. And I understand that the US is a deeply divided country, and that at least half of you actually thought using yours to bring this about was a good idea, somehow–in a way that I just can’t fathom. The only thing I can say is that, from the outside, it was agony to witness his first presidency and how it impacted the world, and that it is fundamentally incomprehensible that you’ve allowed this to happen. Again. I now fear the worst where it regards Ukraine, Taiwan, and the bubbling pot of madness that is North Korea, and see us all sliding towards a dystopian future where the US is no longer neither a beacon of democracy and freedom nor a reliable economic partner–and that will hurt everyone. All the small town jobs, all the tech startups, all the farmers, all the people who just want to live their lives in peace, are now at the mercy of someone who has shown time and time again that he is not fit to lead a country, let alone the world, and who has in place a cadre of sycophants and enablers that actually have a plan to undermine the government apparatus from within. And I am also very sad to read through the news and see that leaders in the technology industry are actually celebrating this. But hey, stocks are up, right? Too bad that will never help most of the people who voted for this."
