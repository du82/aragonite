full_description = "Feb 17th 2009 · 1 min read · #at-long-last #charger #industry #mobile #phone #standard #usb Mobile Industry Unites to Drive Universal Charging Solution for Mobile Phones ➹ Finally, after over a decade, manufacturers come to their senses. I have been ranting about this (time and time again for years - especially since I started using BlackBerry devices - and it is something long overdue.Interestingly enough, I seem to have lost a link where, only a few days ago, some manufacturers (in response to an unusually lucid proposal from someone at the EU, of all places) actually claimed this would be impossible to do - which, is, of course, bullshit. Micro-USB can provide all the power and data connectivity required for today’s phones. Update: here’s that piece. Actually, it was the President of the European Information & Communications Technology Industry Association, who said this “is legally and technically impossible to due differences in voltage and battery requirements within the European Union”. Guess actual industry members think otherwise, eh?"
