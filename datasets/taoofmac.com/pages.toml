full_description = "Dec 9th 2024 · 1 min read · #computing #hardware #raspberrypi #review Raspberry Pi 500 ➹ The Raspberry Pi 500, like the 400 before it, feels like a nostalgic nod to the home computers of yesteryear, packed into a keyboard form factor that’s both charming and practical. However, the lack of a 16GB SKU and built-in NVMe storage is mystifying, especially given the PCB actually is semi-ready for the latter. It’s as if they have a mandate to stop just short of making the hardware great, and makes it a lot less appealing for me. Update: It turns out that you can enable the slot with a handful of cheap parts, so yes, they did stop just short of making it great. Again."
