full_description = "Feb 5th 2025 · 1 min read · #app #apple #events #icloud #invitation #ios #music #sharing Apple Invites... Why? ➹ Apple’s new Invites app looks like another whimsical step in their relentless pursuit to be meaningful in what I suppose would be teenager’s daily lives, but reminds me too much of Clips (which I used exactly one time) and makes me wonder if they have their priorities straight. Instead of improving Shortcuts, making the iPad more useful or de-enshittifying Photos, they devoted (probably heartfelt and well-meaning) engineering resources to this, and, well… Read the room, guys. Fine, it’s pretty and clever, but after decades in the tech world, one might ponder if customizing invitations really needed another Apple tool. Or any tool at all. That said, the ability for non-Apple users to RSVP is a thoughtful move, but the inclusion of Apple Intelligence for generating unique images seems a tad forced, and, again, I expect to use it (or be on the receiving end of it) exactly once, and that makes me kind of sad."
