full_description = "Feb 28th 2007 · 1 min read Markdown Markdown is a text-to-HTML conversion tool for web writers, allowing you to write using an easy-to-read, easy-to-write plain text format, then convert it to structurally valid (X)HTML. Althought I used to prefer Textile for its table support and other niceties, Markdown has won that war and enjoys indisputably wider adoption, as well as making for slightly more readable text when writing essays. Resources Category Date Link Notes Diagrams 2023 pikchr A diagram markup language designed to be embedded into Markdown, used by the SQLite project team Editors 2012 EpicEditor A themable JavaScript editor. Uberwriter A nice, clean “Linux”:os/Linux editor 2011 Mou A web developer-oriented app. 2010 WMD an amazing JavaScript editor specifically tailored for Markdown Implementations 2021 cmark-gfm GitHub’s Markdown flavor in C 2012 Strapdown Yet another JavaScript parser, with some neat themes and GitHub flavour support. 2011 MMD A C language implementation of MultiMarkdown 2010 discount A C implementation. Libraries 2024 markwhen Make a cascading timeline from markdown-like text. turndown a JavaScript library that can convert HTML to Markdown dom-to-semantic-markdown another JavaScript library that can convert HTML to semantic Markdown, which is great for LLMs and reading mode Tools markitdown Python tool for converting files and office documents to Markdown. 2014 mdp A very neat terminal presentation tool. 2012 formd A tool to convert between inline and reference Markdown links. 2010 Pandoc A markup converter written in Haskell macOS 2024 QLMarkdown A nicer, more full featured QuickLook previewer for Markdown files. 2020 QLMarkdownGFM A Quicklook generator for GitHub Flavored Markdown 2012 Markdown Service Tools A set of OS X system services to manipulate text. 2011 readown A Cocoa viewer that wraps the PHP renderer."
