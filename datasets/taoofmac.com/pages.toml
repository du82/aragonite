["https://taoofmac.com/space/links/2009/02/16/2210"]
title = "Apple Claims Jailbreaking An iPhone Is Copyright Infringement - Tao of Mac"
description = "The elephant in the room (besides copyright and intellectual property) isn’t jailbreaking - it’s unlocking."
full_description = "Feb 16th 2009 · 1 min read · #hippies #iphone #jailbreak #unlock Apple Claims Jailbreaking An iPhone Is Copyright Infringement ➹ The elephant in the room (besides copyright and intellectual property) isn’t jailbreaking - it’s unlocking. I find it amazing that people still think buying subsidized iPhones from one carrier, unlocking them and using them on another carrier (thereby cheating Apple, the carrier, or both out of the revenue that was factored into the price difference) is legal in any way, or that going on about “freedom” is enough of a smokescreen to cover up this kind of malfeasance. Phones aren’t more expensive unlocked because there is an evil lobby from carriers - phones are cheaper in a carrier bundle because the subsidies are a way to lower barriers to commitment and ensure mid-term revenue. Carriers and manufacturers are trying to run a business, not a charity, and most people are simply too spoiled to understand the real value of things. When you jailbreak a device, you’re not sending “a message” to Apple - you’re just being ignorant of the implications."
