full_description = "May 2nd 2008 · 1 min read · #policy #press Press Policy Hot on the heels of my Disclaimer, it seems that I need a page for press engagements as well, so here goes: Press ReleasesI don’t accept press releases. That is it. ReviewsI do occasional product reviews – nearly always of stuff I’ve bought for myself, or, in a few specific cases, of products I beta-tested or was invited to try out prior to launch. I don’t mind doing more, but I don’t do sponsorships. Or paid placements. InterviewsI’m not averse to them, although it’s easier via e-mail, like this one."
