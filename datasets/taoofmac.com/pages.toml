["https://taoofmac.com/space/notes/2025/02/16/1630"]
title = "Notes for February 10-16 - Tao of Mac"
description = "If last week was busy, this one was all over the place, and I am now officially time bankrupt on all fronts, so this update is going to be b..."
full_description = "Feb 16th 2025 · 1 min read · #authelia #cloudflare #fastapi #homelab #jupyter #mathics #vue #wolfram Notes for February 10-16 If last week was busy, this one was all over the place, and I am now officially time bankrupt on all fronts, so this update is going to be brief. HomelabAfter a fair bit of yak shaving, I finally got my Authelia setup and Cloudflare Access tunnels to play nicely together–and most of the trouble turned out to be incomplete documentation and (let’s face it) a back-end that doesn’t connect all the dots. You’d expect that the CF UI would let you associate a tunnel with an app automatically, but… no, and I pretty much stumbled onto the solution rather than doing it intentionally. I now have (geo-locked) access to a KasmVNC sandbox that runs Obsidian and XMind in a mostly sane way, although I spent a very long evening trying to fix an old gripe with LXCs and flatpak to expose a couple more services. Loose EndsBesides a bit of FastAPI and Vue prototyping, I also played with Mathics and found a fork of the iwolfram kernel that sort of makes it work inside Jupyter (with limitations), as well as an official kernel. But neither is published on PyPi, so including them in my deployment scripts and using them on my Docker-backed setups isn’t feasible (I can’t just go and grab stuff off random git repositories and expect to have an easy to maintain solution). I honestly don’t know why this kind of thing doesn’t get more attention and effort. I would love to have a mature solution for Jupyter notebooks with a Wolfram-like language baked in…"
