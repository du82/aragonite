["https://taoofmac.com/space/site/review_policy"]
title = "Review Policy - Tao of Mac"
description = "This site has been around for over 20 years, so it was only natural that I would write about stuff I purchased."
full_description = 'Jan 1st 2022 · 4 min read · #meta #policy #reviews #site Review Policy This site has been around for over 20 years, so it was only natural that I would write about stuff I purchased. Those pieces became popular enough that people started asking me to review things, and eventually I started getting review units/copies from vendors. So I thought it would be a good idea to have a policy in place to make sure everyone is on the same page: I don’t do paid reviews. I realize there is a fine line between getting “free” stuff to review and being paid to review it, but I’m not interested in crossing it–this site does not generate any form of income for me, and I’d like to keep it that way. I only review things I have a personal interest in (i.e., things that I would ordinarily have an actual use for, learn from or would otherwise consider buying) or that would be interesting for the people I occasionally provide consulting services to. I don’t do scripted reviews (i.e., there is no content placement, I write about the features I find important, etc.) There are no editorial tweaks–vendors get to read my reviews at the same time as the general public. I don’t participate in vendor affiliate programs–I’m OK with handing out discount codes or linking to the vendor’s site with a utm referral tag (so they can check attribution), but other than my usual (automatic) Amazon/AliExpress linking (which I started using for books decades ago and now do for electronics components), there are no other affiliate links on this site to ensure I don’t get any direct revenue from the reviews. When applicable, scripts used for performance measurements and benchmarks will be published here or on GitHub. Benchmarking will be focused on the aspects I value (although I will try to use standard tooling where appropriate). I review what’s “in the box”, not what’s promised for future releases or what might be available in a future version. I’m also open to reviewing books–I’ve done pre-publishing reviews in the past, and I’m always happy to read and review books on topics I’m interested in. If you have something you’d like me to review, please get in touch and we’ll take it from there. AudienceMany people ask me about page views, statistics, Google rankings, etc. This is what I have to say about it: This site does not use Google Analytics for privacy reasons, nor any other mainstream analytics or tracking platform. The flip side of that is that it is (incorrectly) down-ranked in just about every single public site ranking. It does, however, use Cloudflare Analytics, which is privacy-preserving and a more accurate than most other tracking sites because it automatically filters out bots, referrer spam and other things that contribute to site traffic inflation. However, it can provide some interesting figures (updated for August 2024): Over 2M monthly pageviews (and steadily rising). Over 110K unique human visitors per month, mostly from the US, UK, Germany, and Singapore (if I add in figures from Japan and Australia, I get almost as much traffic from APAC than from the UK, which has always been interesting to me). You can check this PDF for a sample Cloudflare traffic report. This audience reach comes down to four main factors: My emphasis on consistently solid technical content–which ensures continued reader interest. No fake audience engagement on site (I interact with readers directly via e-mail correspondence) Posts are automatically broadcast to X/Twitter, Mastodon and a few sites that consume my RSS feed directly. I get a lot of traffic from places like Reddit, Hacker News, etc. (especially when I post something with an unusual technical angle). Past ReviewsThis is a non-exhaustive list of things I’ve reviewed in the past: Date Category Link Notes 2025 E-Ink Tablets SuperNote A6X2 Nomad Supplied by Supernote Homelab Sipeed NanoKVM Cube 2024 3D Printers Two Trees SK1 Supplied by Two Trees Two Trees SK1 Enclosure Kit Accessories 3DConnexion SpaceMouse Wireless Gaming Logitech G Cloud BSP D8 Bluetooth Controller Homelab AURGA Viewer Supplied by AURGA Keyboards Logitech K380 Keychron K7 Max Supplied by Keychron Keychron K11 Max Supplied by Keychron Hexgears Immersion A3 Supplied by Hexgears Keychron K2 HE Supplied by Keychron Mini-PCs AceMagic AM18 Supplied by AceMagic GMKtec G2 NAS CM3588 NVMe NAS Kit Supplied by FriendlyELEC TerraMaster F4-424 MAX Donation Networking TP-Link L-SG108E SL-SWTG124AS Supplied by Sodola SL-SWTGW218AS wisdPi WP-UT5 5GbE USB adapter Supplied by wisdpi SBCs Orange Pi 5+ Supplied by Orange Pi YouYeeToo R1 Supplied by YouYeeToo Orange Pi Zero 3 Supplied by Orange Pi Banana Pi M7 Supplied by Banana Pi Radxa X4 Supplied by Radxa XPI-3566-Zero Supplied by Geniatech Banana Pi M5 Pro Supplied by Banana Pi Debix Model A Supplied by Debix 2023 3D Printers Kingroon KP3S Pro v1 Accessories OBSbot Tiny 4K, RODE NTG1 Android Lenovo ThinkSmart View Apple Mac Mini M2 Pro iPhone 15 Pro, Watch Series 9 Keyboards Bluehand Mini-PCs Beelink U59 Pro Monitors LG 28MQ780-B PC Builds ASRock DeskMeet B660 SBCs Radxa Zero 2022 Android Xiaomi Mi Stick 4K Apple iPad Pro M1 Gaming Xbox Series X Retroid Pocket 3 Keyboards Avatto Folding Keyboard Dierya 63, Adafruit Macropad Logitech Combo Touch Laptops Lenovo ThinkPad X1 Yoga Work issued Music Novation Circuit Tracks Monome Norns Shield Built from kit SBCs Banana Pi M2 Zero 2021 Laptops Lenovo IdeaPad Flex 5 MacBook Pro 14" (M1 Pro) Monitors LG 34WK95U-W Music Teenage Engineering OP-1 Arturia KeyLab Essential 61 2020 Laptops Surface Book 3 Work issued Music Yamaha Reface DX, AG06 NAS Synology DS1019+ 2019 Apple iPad Mini 5 Watch Series 5 Music Roli Songmaker Kit, Korg Nanokey Studio 2018 Apple iPhone XS 2017 3D Printers BQ Prusa i3 Hephestos Built from kit Laptops Surface Pro 4 Work issued Mini-PCs Z83ii 2016 Mice Citrix X1 Mouse PC Builds Streacom ST-F1CB WS Black Aluminum Case 2014 Laptops Acer C720 Surprisingly still working in 2024 2013 Phones HTC One T