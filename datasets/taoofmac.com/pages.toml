title = "Daring Fireball: BrikTok - Tao of Mac"
description = "John put together a great overview of the TikTok situation, of which most of what I could say would be either a rehash or a mention that it ..."
full_description = "Jan 20th 2025 · 1 min read · #apple #google #law #media #oracle #politics #social #technology #tiktok #trump Daring Fireball: BrikTok ➹ John put together a great overview of the TikTok situation, of which most of what I could say would be either a rehash or a mention that it goes fairly well with popcorn. It’s a political theater drama mixed with corporate maneuvering. With Trump’s return to the presidency, the notion of a U.S. government stake in a social media platform feels like a plot twist straight out of a dystopian novel, and the idea that a government would want to own (or guide the disposal of) half of a private company is not just bizarre; it raises serious questions about the implications for privacy and control over digital spaces. Meanwhile, companies like Apple and Google are playing it safe, adhering to the law while TikTok’s back-end providers seem to be banking on a promise from a not-yet-president–either that or Oracle must be really confident in their legal team (which is the true core of their business, so I guess that makes sense). It’s a risky gamble (both political and for the many people who have somehow managed to make a living off it; I read somewhere it might be up to 30% of its user base, which is staggering), and one that could lead to significant legal repercussions for providers of various sorts. As the public clamors for access to the app, it’s clear that the real issue isn’t just about whether TikTok is “back”—it’s about who gets to control the narrative and the platform itself. Me, I’m just going to add this to the “Impending Apocalypse” folder and move on. I expect to run out of metaphorical storage over the next four years…"
