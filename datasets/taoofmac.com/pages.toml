full_description = "May 31st 2022 · 1 min read · #arm #hardware #mc RP2040 and RP2350 The RP2040 and RP2350 are dual-core ARM (and now also RISC-V) microcontrollers designed by the Raspberry Pi Foundation. They are used in the Raspberry Pi Pico and other boards, and have become a popular choice for embedded projects due to their low cost and ease of use (dethroning the ESP8266 and ESP32 in many cases). Resources Category Date Link Notes AI 2024 pico-tflmicro a port of TensorFlow Lite Micro to the Raspberry Pi Pico Audio PicoADK-Hardware a RP2040 based Audio Development Board Education piccolo_os_v1 a tiny cooperative multitasking OS for educational purposes Electronics 2023 Micro Logic Analyzer SUMP/OLS compatible logic analyzer firmware for RP2040 based boards Emulation pico-zxspectrum a ZX Spectrum emulator for the Raspberry Pi Pico 2024 DECstation2040 A RP2040 based DECstation emulator GUI 2022 slint a GUI toolkit that can run in MCUs like the Pi pico and the ESP32 Libraries 2024 Raspberry-Pi-Pico-Libraries a collection of C libraries for Raspberry Pi Pico Networking pico_hole a DNS forwarder that blocks unwanted ads on smart TVs by whitelisting specific domains Reference pico-bootrom-rp2350 The RP2350 boot rom Schematics project-piCo a set of KiCAD designs for improved Pico boards with USB-C Tools 2022 arduino-pico an optimized port of the Arduino core to the RP2040 2024 breadboard-os a firmware for the RP2040 that features a CLI interface USB usb-sniffer-lite A simple USB sniffer hid-remapper USB input remapping dongle Pico-PIO-USB USB host/device implementation using PIO Video 2021 PicoVGA a VGA library for the Raspberry Pi Pico 2024 PicoDVI Bit-banged DVI on the RP2040/2350"
