title = "Home Page - Tao of Mac"
description = "The Tao of Mac is the personal wiki of Rui Carmo, featuring a technology-oriented blog, links to articles, several compilations of resources around various key technology topics, and a collection of photos and videos."
full_description = "I have been looking at getting a Ryzen AI Max machine of some kind, since the new 8060s iGPU and its unified memory support make it a very tempting setup for both AI and (let’s face it) gaming, very much like the 7840HS and M780 combo I tested last year. For me, Framework having given it a bit of their modular treatment is hardly as interesting as the prospect of buying it as a standalone motherboard, and even though the RAM is soldered on I don’t think that will be a problem–although the somewhat far off availability date and their liimited international coverage definitely is. For those who appreciate a sleek, console-sized gaming rig without the tinkering, Framework’s desktop offers a very compelling option–even if I personally don’t care much for the customizable front panel and other external tweaks. Obsidian has been growing on me, and this commercial licensing move is quite surprising–plus the list of big corporates “using” it to some degree is thought-provoking, although I would take some of those entries with a grain of salt. Let’s see where this goes. I’ve always been reticent in adopting it, but this move might well be a simple (and very efficient) way to grow its customer base and valuation towards a future sale… Not half bad. I like what they did (even if I would have preferred a smaller, easier to handle device), and I’m pretty sure they priced it with a fair chunk of margin to spare. The A18 chip is a nice touch, and I’m very curious about the modem chipset and how it fares in real life. I couldn’t really care less about Apple Intelligence, but the upshot of it is that this new “SE” model is going to be a lot more capable than the previous ones thanks to the RAM requirements. The sustainability angle is commendable (as is the enhanced battery life), but they are minor points in the grand scheme of things. Update: The lack of MagSafe is disappointing, and clearly by design–or, if you prefer, the result of a feature differentiation strategy that is overly based on nickel and diming customers…"
