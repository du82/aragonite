["https://taoofmac.com/space/notes/2025/02/09/1200"]
title = "Notes for February 3-9 - Tao of Mac"
description = "This was a rather busy week as I am ramping off a couple of projects and ramping onto new ones, so all the context switching took a toll and..."
full_description = 'Feb 9th 2025 · 2 min read · #britain #creatures #escapism #homelab #nostalgia #openwrt #tv #veterinary Notes for February 3-9 This was a rather busy week as I am ramping off a couple of projects and ramping onto new ones, so all the context switching took a toll and I decided, once again, to spend a chunk of my free time doing (mostly) computer-free stuff. HomelabI haven’t been very happy with my new homegrown dashboard/homepage (which I built out of mkdocs-material). It sort of works, but I wanted something I could use typeahead find in to quickly get to where I wanted. Plus the client-side documentation search is abysmal and there is a fair amount of overhead in updating mkdocs, so I decided I’d just move the documentation into Obsidian for cleaning up and re-do the homepage. After a bit of experimentation with homepage I realized that despite having real-time status info on some services was nice, the whole thing is just far too bloated. This was actually the reason I hacked my own version of SUI three years ago, so I spent a couple of hours revamping my old code so that I only need to change one JSON file to update the whole thing and code a simple typeahead search popup: Typeahead find for "of". The color scheme needs work, but this is fine for now. I also rebased my docker-xmind container (I still don’t like KasmVNC, but it works) and poked at last week’s Authelia setup, but my mind hasn’t really been on computers. Other than that, the recent release of OpenWRT 24.10 has forced me to re-run a few tests on an N150 machine I got for review, so that took some time as well. MediaIn a mix of escapism and nostalgia, I spent a good chunk of the weekend bingeing the first few seasons of All Creatures Great and Small, which is both a great update on the late 70s series I watched when I was a kid and a very well-acted rendition of the fantastic books I loved as a teenager. One of the best parts is that there is exactly zero computing involved in any of it, although the undertones of WWII felt a little too close to home.'
