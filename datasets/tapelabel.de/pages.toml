["https://tapelabel.de"]
title = "LTO Barcode-Label-Generator"
full_description = '''IBM LTO specifications state clearly that The barcode label and associated adhesive shall have an environmental performance to match or exceed the environmental specifications of the cartridge to which it is applied Barcode recognition problems: If your library has problems recognizing the barcodes correctly then it's most likely that the reflectivity of the printout is too high. In this case please try another laser printer. I had no problems printing these labels on HP LaserJet P2055DN (amazon.de), and HP LaserJet M2727nfs printers. Restrictions of the generator: Because of PHP-Memory-Limit you cannot generate more than 200 labels per request. Suggestions: If you have any suggestions for enhancing the generator please let me know. Maybe I will try to implement it. Donations: Although this service is free, donations are highly appreciated. You may donate via PayPal. Also it's possible to support me by buying products from the German-Amazon store via one of my affiliate links mentioned above. Privacy: Except the common logging of the webserver itself NO additional personal data is stored on the server. Your Ip address is stored for 24 hours max as a non reversible sha256 hash. Additionally statistical and non expiring data is stored for every label generation. This record consists only of a timestamp, how many labels were requested and for which media type. If you have any questions please feel free to ask!This page is also available via https: https://tapelabel.de Terms of Use: THIS SERVICE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS "AS IS" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT HOLDER BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.'''
