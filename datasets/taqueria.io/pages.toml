["https://taqueria.io/docs/config/config-files"]
title = "Configuration Files | Taqueria - Developer Tooling for Tezos"
full_description = '''ConfigurationConfiguration FilesOn this pageConfiguration FilesOverview​Taqueria's primary configuration settings are in the .taq/config.json file.The settings in the config.json are used by various taqueria plugins. Each plugin should contain documentation about those settings and how each can be configured.Example config.json​{ "version": "v2", "language": "en", "artifactsDir": "artifacts", "contractsDir": "contracts", "accounts": { "bob": { "balance": { "amount": "30_000_000", "units": "mutez" } }, "alice": { "balance": { "amount": "30_000_000", "units": "mutez" } }, "john": { "balance": { "amount": "30_000_000", "units": "mutez" } }, "jane": { "balance": { "amount": "30_000_000", "units": "mutez" } }, "joe": { "balance": { "amount": "30_000_000", "units": "mutez" } } }, "environmentDefault": "development", "environments": { "development": { "type": "flextesa", "label": "Local Tezos Sandbox" }, "testing": { "type": "simple", "label": "ghostnet", "rpcUrl": "https://ghostnet.ecadinfra.com" }, "production": { "type": "simple", "label": "mainnet", "rpcUrl": "https://mainnet.api.tez.ie" } }, "plugins": [ { "type": "npm", "name": "@taqueria/plugin-flextesa" } ]}Other Related Files​Local Config Files:Each config.local...json contains developer specific environment configuration. More details hereState Files: state.json and ...state.json files are used by taq for internal state.These are automatically generated and should not be manually edited.Edit this page'''
