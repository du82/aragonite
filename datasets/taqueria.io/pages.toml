title = "Build on Tezos | Taqueria - Developer Tooling for Tezos"
description = "A Better Way to Build on Tezos"
full_description = "A Better Way to Build on TezosTaqueria provides a seamless development workflow to easily build, test and deploy your Tezos applications.Try the BetaWant a better Tezos development experience?Don’t know where to start building on Tezos? Want a smarter way to integrate your tools? If so, Taqueria is for you. This flexible framework will help you to start faster and build better applications.Try the Taqueria BetaEverything in one placeThe Taqueria CLI and VS Code plugin bring your development tools to you. Stop moving your code jumping between IDEs. With Taqueria’s plugin infrastructure you can use the tools you need all in one place.Everything in one placeThe Taqueria CLI and VS Code plugin bring your development tools to you. Stop moving your code jumping between IDEs. With Taqueria’s plugin infrastructure you can use the tools you need all in one place.Effortlessly compileDeploy with easeFully customizableWhy Taqueria?Getting started is easierTaqueria makes getting started with a Tezos project easier than ever by removing the complexity of setting up a development environment so you can get to building sooner.Efficient end-to-end development cycleDevelopment doesn't stop when you launch your application. Taqueria supports the entire blockchain application development life cycle, from initial testing to deployment, maintenance of applications and smart contracts.Built-in processes for quality applicationsWhen we build better applications, the entire Tezos ecosystem wins. Taqueria improves the quality of your applications through easy scaffolding and an improved development workflow. From the creators of TaquitoTaqueria is maintained by Trilitech, previously developed by Pinnacle Labs and ECAD Labs.Use your favorite tools with TaqueriaBuilt By"
