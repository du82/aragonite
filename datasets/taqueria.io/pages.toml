["https://taqueria.io/docs/getting-started/installation"]
title = "Installation | Taqueria - Developer Tooling for Tezos"
full_description = '''Getting StartedInstallationOn this pageInstallationTaqueria Installation Basics​Installing Taqueria is a quick and easy process if you understand a few basic concepts and follow the steps outlined in this guideThere are two main components you can install:The Taqueria CLI (required)The VS Code plugin for Taqueria (optional)noteThe Taqueria CLI is required to use the VS Code extension and as such, must be installed firstRequirements​Taqueria CLI​Node.js v18.18 or later.A compatible operating system:MacOSLinuxWindows (via WSL 2)Docker v20.10.12 or laterInstalling the Taqueria CLI​Overview​The Taqueria CLI is an executable binary named taq.Installing the Taqueria CLI involves the following steps:Download the correct build of Taqueria for your operating systemMake the Taqueria binary taq executableAdd taq to your shell's $PATHTo install, we recommend our one-line installer:/bin/bash -c "$(wget -O - https://taqueria.io/install-taq.sh 2>/dev/null || curl -fsSL https://taqueria.io/install-taq.sh)"Alternative OS Specific Instructions​MacOSLinuxWindowsDownload the latest MacOS build of TaqueriaFor MacOS installations, we recommend using Homebrew:brew tap TezosTaqueria/taqueria https://github.com/TezosTaqueria/taqueriabrew install taqueriaDownload the latest Linux build of Taqueriacurl -LO https://taqueria.io/get/linux/taqMake the binary file executablechmod +x taqMove the binary to a directory in your shell's $PATHsudo mv taq /usr/local/binWindows users will run the Linux version of Taqueria in Ubuntu using the Windows Subsystem for Linux (WSL 2)Requirements​You must be running Windows 10 version 2004 and higher, or Windows 11Install WSL 2​Open a Power Shell or Windows Command Prompt as an administrator and run:wsl --installRestart your machineOpen the Ubuntu distribution using the Start if it doesn't start automatically after restartingCreate a user name and passwordInstall Docker Desktop WSL 2 backend​Download Docker Desktop for WindowsRun the installer making sure to enable WSL 2 during the installation if promptedStart Docker Desktop from the Windows Start menuFrom the Docker menu, navigate to Settings > General and select Use WSL 2 based engine if not already selectedClick Apply & RestartTo confirm that Docker Desktop backend has been installed properly, open a WSL 2 terminal and run:wsl.exe -l -vYou should see the following output:NAME STATE VERSION * Ubuntu Running 2 docker-desktop-data Running 2 docker-desktop Running 2Install Node v16​Update the apt package index:sudo apt updateInstall dependencies:sudo apt install curl gitDownload Node.js v18.18 or later.curl -sL https://deb.nodesource.com/setup_16.x | sudo -E bash -(Optional) Install the node development toolssudo apt-get install gcc g++ makeTo confirm that Node v16.x has been installed properly, open a new WSL 2 terminal and run:node --versionYou should see v16.x.x or similar returned.Install the Taqueria Binary​Download the latest Linux build of Taqueriacurl -LO https://taqueria.io/get/linux/taqMake the binary file executablechmod +x taqMove the binary to a directory in your shell's $PATHsudo mv taq /usr/local/binTest the CLI​At this point, Taqueria should be installed and ready to use. You can test this by running the following command:taq --versionYou should see the version of Taqueria installed output:0.68.0If you see this, you have successfully installed the Taqueria CLI!Installing the VS Code Extension (optional)​The Taqueria VS Code Extension is installed from the Extensions pane within VS Code. The steps to install are:Open the Extensions paneType Taqueria in the search barClick installEdit this page'''
