["https://taqueria.io/docs/intro"]
title = "Introduction | Taqueria - Developer Tooling for Tezos"
full_description = "Getting StartedIntroductionOn this pageIntroductionnoteThis is a quick introduction to the main concepts of Taqueria. If you are looking to get started with Taqueria right away with a hands on approach, you can jump to the quickstart guide Taqueria is here to help make developing on Tezos easier. Taqueria supercharges your projects with a powerful and centralized configuration and access to top Tezos development tools through tasks that you run from the command lineSome of the things Taqueria can do for you include:Compiling smart contracts using the LIGO, SmartPy, or Archetype pluginsRunning a local sandbox with the Flextesa pluginOriginating a smart contract to a sandbox and testnet with the Taquito pluginGenerating TypeScript types from a Michelson contract with the Contract Types pluginTypechecking Michelson contracts and simulating contract calls with the Octez Client pluginTesting dapps and smart contracts with the Jest pluginPublishing metadata and media files to IPFS with the IPFS Pinata pluginWhat is Taqueria?​Taqueria is an extensible, open source plugin based framework and task runner for Tezos developmentIn more practical terms, Taqueria is a task runner that you can use from the command line or via VS Code to quickly accomplish things like starting a sandbox or originating a contract. Taqueria comes with a few basic tasks, but relies on plugins to add tasks that provide complex and domain specific functionalityTaqueria has a few major components:A command line interface (CLI) you use in your terminal through a command named taqA library of plugins that add tasks to Taqueria to do cool and useful things like compiling and originating smart contracts, and type generationA VS Code Extension which provides the ability to run Taqueria tasks from the command palette or the UIA GitHub action so Taqueria can be used in your CI/CD workflowsBasic Components​Taqueria CLI​The CLI is the main user interface for Taqueria which provides a command taq through which you can initialize a project, install/uninstall plugins, and run tasksBasic usage of the Taqueria CLI involves running a command following the pattern taq [taskName] [options]noteTaqueria uses the following conventions for displaying command structure:Square brackets [value] are used to indicate optional argumentsAngle brackets <value> are used to indicate required argumentsYou can see what tasks are available to run in any given context by running taq from the command lineTaqueria Project​A Taqueria project is one that has been initialized by Taqueria using the taq init command. It will have the following directory structure created:artifacts: This is where Taqueria will store artifacts that it creates during the course of its executioncontracts: This is where Taqueria will store smart contracts that it compiles.taq: This is where Taqueria will store its configurationnoteConfiguration for Taqueria projects including accounts, networks, and sandboxes is done in .taq/config.jsonTaqueria Plugins​Taqueria plugins add functionality to Taqueria by adding tasks to Taqueria. Plugins are managed right in Taqueria using the taq install [pluginName] and taq uninstall [pluginName] commandsTaqueria plugins are installed on a per-project basis which allows you to customize the combination of technologies used and tasks available on a project. This means that the tasks available to run in each project will differ based on the plugins installedCurrently available plugins include:LIGO CompilerSmartPy CompilerArchetype CompilerFlextesa SandboxTaquito Contract Types GeneratorOctez ClientJest Test RunnerMetadataIPFS PinataTaqueria SDK​Taqueria has a Node.js SDK which is used by plugins to interact with the Taqueria protocolnoteMost developers won't ever interact with the SDK directly unless they are developing a pluginEdit this page"
