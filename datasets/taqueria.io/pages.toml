["https://taqueria.io/docs/roadmap"]
title = "Taqueria Roadmap | Taqueria - Developer Tooling for Tezos"
description = "This roadmap indicates high level features which are in development, planning, or have been released"
full_description = "Taqueria DevelopmentTaqueria RoadmapOn this pageTaqueria RoadmapThis roadmap indicates high level features which are in development, planning, or have been releasedNOTE: This roadmap is out-of-date and being revised.In Development​These features will be launching in upcoming releases:Scaffold registryComplex origination workflows Contract metadata supportCI integration with CI/CD testsMulti-file smart contract compilation, origination, and testingToken metadata supportOn the Horizon​Contract metadata with support for off-chain events and errorsVersioning of smart contractsSandbox bakingFull SmartPy supportExplorer integrationAccount integrationFormal proof of verification for smart contractsShipped​noteFor full detail on changes, fixes, and improvements made in each release, please refer to the Taqueria Release PageMay 2022Smart contract testing with the Jest plugin @taqueria/plugin-jestTaqueria StateImplicit accounts@taqueria/state libraryApril 2022:Added the Archetype pluginImplemented several scaffoldsAdded the octez-client pluginMarch 2022:Major refactor to the taqueria-sdk libraryImprovements and bugfixes for the Flextesa pluginUpdated the UX for the Taquito pluginAdded Michelson types to the Contract Types pluginFebruary 2022:Project scaffoldingTS Type Generation from Michelson.tz files which includes:A new Taqueria NPM plugin: @taqueria/plugin-contract-typesAwareness of generated types in VS Code ExtensionIntellisense tooltips for contract parametersCompile time type checking for TS types January 2022:CLIVisual Studio Code ExtensionInitialization of a Tezos ProjectA demo smart contract and app, hello-tacosCompile LIGO and SmartPy smart contractsUsing a local sandbox with test accountsSDK for developers to build their own pluginsOrigination to local, test, and main networksSeveral plugins:LIGOSmartPyTaquitoFlextesaEdit this page"
