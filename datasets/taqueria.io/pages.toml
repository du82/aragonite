["https://taqueria.io/docs/features/github-action"]
title = "Taqueria GitHub Action | Taqueria - Developer Tooling for Tezos"
description = "Taqueria has a GitHub action that helps simplify and standardize the use of GitHub actions. The action provides a Taqueria environment in a Docker container that can be used to run Taqueria commands for automated tests and in CI/CD pipelines"
full_description = "FeaturesTaqueria GitHub ActionOn this pageTaqueria GitHub ActionTaqueria has a GitHub action that helps simplify and standardize the use of GitHub actions. The action provides a Taqueria environment in a Docker container that can be used to run Taqueria commands for automated tests and in CI/CD pipelines You can find the action on the GitHub Marketplace hereThe action GitHub repo for the project is located hereYou can see the action being used on the Taco Shop ScaffoldInputs​project_directory​The name of the project directory. If nothing is specified the repository root directory is usedtask​The name of a specific task to run. This input is mainly used for testing purposesplugins​A comma separated list of plugins to installsandbox_name​The name of the Flextesa sandbox to use. A sandbox will only be created if this input is specified. When running the sandbox, the action will automatically change the value of rpcUrl for the sandbox in .taq/config.json. This is to enable origination to the local sandbox in CIcompile_command​The compile command used to compile the contractscontracts​A comma separated list of contracts to be added to the Taqueria project.originate​When set to true, contracts will be originated to the environment defined with the environment variable (leave empty for default). This option makes use of the taquito plugin so please make sure to install ittests​When set to true, all tests in the tests directory will be run using the Jest plugin. This option makes use of the jest plugin so please make sure to install itenvironment​This input is used to select the configured environment for taqueria to originate to. The default is set to developmentAdding The Action to Your Project​Adding a GitHub action to your project requires adding a workflow YML file (the default is main.yml) to your GitHub repository in the .github/workflows directory. After that you can add what you need in the file to make taqueria run as part of your project workflow. There are some examples of adding the action to your workflow belowYou can also check out the quickstart guide for GitHub actions in the GitHub docs located hereExample Usage​Single step action​- name: taqueria tasks uses: tezostaqueria/taqueria-github-[email protected] with: plugins: '@taqueria/plugin-ligo, @taqueria/plugin-flextesa, @taqueria/plugin-taquito' contracts: 'counter.jsligo' compile_command: compile sandbox_name: local originate: 'true' tests: 'true'Multiple step action​- name: compile contracts uses: tezostaqueria/taqueria-github-[email protected] with: project_directory: 'example-projects/hello-tacos' contracts: 'hello-tacos.mligo' compile_command: 'compile'- name: start local sandbox uses: tezostaqueria/taqueria-github-[email protected] with: project_directory: 'example-projects/hello-tacos' sandbox_name: 'local'- name: originate contracts uses: tezostaqueria/taqueria-github-[email protected] with: project_directory: 'example-projects/hello-tacos' originate: 'true'- name: originate contracts uses: tezostaqueria/taqueria-github-[email protected] with: project_directory: 'example-projects/hello-tacos' tests: 'true'Edit this page"
