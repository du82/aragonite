title = "How to Order Chipotle Nachos with a Simple Menu Hack"
description = "You can finally make Chipotle nachos a reality with this simple trick. I tested the step-by-step instructions on how to order."
full_description = '''Allison Robicelli for Taste of Home Home News Restaurants I Just Tried the Viral Chipotle Nacho Hack, and I Can’t Believe It Worked Allison Robicelli for Taste of Home By Allison T.S. Robicelli Taste of Home's Editorial Process Published on Feb. 28, 2025 Save Saved Saving If you want to order nachos at Chipotle, I have good news: There's a menu hack that makes it possible. Now Trending if ( ! window.cnx ) { window.cnx = {}; window.cnx.cmd = []; } var cnxDiscoveryPlayerInitialized = false; cnxDiscoveryTriggerRender(); function cnxIsRecircStickyEnabled() { const recircDiv = document.getElementById("recirc-strip"); if ( null !== recircDiv && (recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile') || recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile-down'))) { return true; } return false; } function cnxDiscoveryTriggerRender() { // Add floatingGutterY property to video player based on recirc strip. var cnx_gutterY = 0; if ( cnxIsRecircStickyEnabled() ) { cnx_gutterY = document.getElementById("recirc-strip").offsetHeight; } if ( cnxDiscoveryPlayerInitialized ) { return; } var trigger = document.querySelector( ".ad-type-prearticle" ); if ( ! trigger) { trigger = document.querySelector( "head" ); } let cnxLibLoader = document.createElement('script'); cnxLibLoader.type = 'text/javascript'; cnxLibLoader.async = true; cnxLibLoader.src = 'https://cd.connatix.com/connatix.player.js?cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnxLibLoader.id = 'tmbi-connatix-discovery-js'; document.body.appendChild( cnxLibLoader ); (new Image()).src = 'https://capi.connatix.com/tr/si?token=fe436c54-d995-4d72-bef1-897fc6b8bf5f&cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnx.cmd.push(function() { cnx({ playerId: "fe436c54-d995-4d72-bef1-897fc6b8bf5f", "settings": { "customization": { "floating": { "floatingGutterY": cnx_gutterY } } } }).render("cnx-d7c9051cca3c4259a4e3bcc799ac24be"); }); cnxDiscoveryPlayerInitialized = true; } Sometimes, if the stars don’t align in your favor, you must take destiny into your own hands. Turn Chipotle nachos from a distant dream into a tangible reality. Eat a pile of barbacoa, corn salsa and guac with chips and lick queso blanco off your fingers, as you’ve always longed to do. All you need to do is order strategically. As an experienced recipe tester, fast-food critic and Chipotle expert, I know very well that not all viral fast-food hacks on TikTok are a good idea. That’s why I went down to my local Chipotle to test this Chipotle nacho hack for myself. Does Chipotle have nachos? Surprisingly, Chipotle does not have nachos! One might assume they do, as nachos fit into the overall fast-casual Mexican concept. The chain does tortilla chips, which can be ordered with its signature guacamole, queso blanco or any of Chipotle’s four salsas. If you want meat, beans or fajita vegetables, however, you can only order them in a burrito, salad, taco or bowl. What is the Chiptole nacho hack? Allison Robicelli for Taste of Home Just like when people ordered Chipotle catering to meal prep for the week, you can get crafty with the menu. In this case, the goal is to make a huge heap of nachos. Here are step-by-step instructions on how to order: 1. Build a burrito bowl on the Chipotle app or website, but don’t order rice. 2. Add regular chips and a small side of queso blanco to your order 3. Place chips in the lid of your bowl 4. Top the chips with the contents of the bowl 5. Drizzle queso blanco on top Are the Chipotle nachos good? If you like Chipotle, you’ll certainly think Chipotle nachos are good! They’re everything you love about Chipotle but on a bed of crispy chips instead of rice or lettuce. Flavorwise, there’s not a single thing to complain about. If the Chipotle nacho hack has a flaw, it’s the price. Where I live, in a major city on the East Coast, a small side of chips and queso blanco costs $4.65. And when you order a bowl without rice, you don’t get more of everything else—you’re paying full price for less food. So while being able to eat nachos with your favorite Chipotle toppings is certainly a good time, it’s considerably more expensive. This menu hack works, but save it for a special occasion. Author Allison T.S. Robicelli Formerly the chef-owner of Robicelli’s Bakery, Allison is a James Beard-nominated food writer. At Taste of Home, she tests kitchen tools with the hands-on insight she gained from her time as a professional chef. Her cookbook “Robicelli’s: A Love Story, With Cupcakes” was published in 2013 and appeared on several Best Cookbooks of the Year l... Read More'''
