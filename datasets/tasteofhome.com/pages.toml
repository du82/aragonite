 and (max-width: 767px) { #tmbi-recirculation-strip .item { width: 50%; } } /** Sticky CSS Start **/ .tmbi-rs-sticky { position: sticky; } @media screen and (min-width: 1025px) { section.recirc-strip.tmbi-recirc-strip-sticky-desktop { position: sticky; top: 76px } .tmbi-rs-sticky { top: 76px; } } @media screen and (max-width: 1024px) { .header-2021.sticky { position: relative; } section.recirc-strip.tmbi-recirc-strip-sticky-mobile { position: sticky; top: 0; } .tmbi-rs-sticky { top: 0; } } /** Sticky CSS End **/ The Ultimate Guide to How to Use Yeast Never-Fail Yeast Rolls Why Testing Yeast Is So Important for Good Bread Baking How to Proof Bread Dough (Even When It's Cold Outside) Which Type of Yeast Is Best for Your Bread? Yeast Pancakes Home-Style Yeast Bread What Is Nutritional Yeast? Easy Yeast Rolls Apple Yeast Bread Colonial Yeast Bread Golden Cheese Yeast Bread Yeast Biscuits 10 Awesome Ways to Use Kool-Aid Packets Around the House Garlic Yeast Bread Rapid Rise Yeast Yeast Cornbread Loaf Yogurt Yeast Rolls Overnight Yeast Waffles 61 Yeast Roll Recipes That Rise to the Occasion Taste of Home Home Recipes Cooking Style Baking The Goof-Proof Way to Proof Yeast Taste of Home By Lisa Kaminski and Christine Rukavena Taste of Home's Editorial Process Updated on Apr. 28, 2024 Save Saved Saving Bread beginner? We'll help you conquer the first step of basic breads and rolls and show you how to proof yeast. Now Trending if ( ! window.cnx ) { window.cnx = {}; window.cnx.cmd = []; } var cnxDiscoveryPlayerInitialized = false; cnxDiscoveryTriggerRender(); function cnxIsRecircStickyEnabled() { const recircDiv = document.getElementById("recirc-strip"); if ( null !== recircDiv && (recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile') || recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile-down'))) { return true; } return false; } function cnxDiscoveryTriggerRender() { // Add floatingGutterY property to video player based on recirc strip. var cnx_gutterY = 0; if ( cnxIsRecircStickyEnabled() ) { cnx_gutterY = document.getElementById("recirc-strip").offsetHeight; } if ( cnxDiscoveryPlayerInitialized ) { return; } var trigger = document.querySelector( ".ad-type-prearticle" ); if ( ! trigger) { trigger = document.querySelector( "head" ); } let cnxLibLoader = document.createElement('script'); cnxLibLoader.type = 'text/javascript'; cnxLibLoader.async = true; cnxLibLoader.src = 'https://cd.connatix.com/connatix.player.js?cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnxLibLoader.id = 'tmbi-connatix-discovery-js'; document.body.appendChild( cnxLibLoader ); (new Image()).src = 'https://capi.connatix.com/tr/si?token=fe436c54-d995-4d72-bef1-897fc6b8bf5f&cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnx.cmd.push(function() { cnx({ playerId: "fe436c54-d995-4d72-bef1-897fc6b8bf5f", "settings": { "customization": { "floating": { "floatingGutterY": cnx_gutterY } } } }).render("cnx-d7c9051cca3c4259a4e3bcc799ac24be"); }); cnxDiscoveryPlayerInitialized = true; } Let me make a confession: For years I was afraid to make bread. Although I’m a passionate baker, this was my shameful secret. I’d page through my favorite cookbooks and magazines, always skipping the bread section, thinking one day. One day when yeast didn’t seem so temperamental and scary to me. After all, yeast isn’t just another dry ingredient—it’s a living ingredient! Those little microorganisms are responsible for creating all the bubbles to help bread achieve that perfect rise. Finally, though, I set out to conquer my fears. I wanted fresh bread and I wanted to make it myself! I bought a few packages of active dry yeast, found a good basic bread recipe (like this Crusty Homemade Bread) and crossed my fingers. It turns out I was afraid of nothing! With the right temperature water and a bit of sugar, my yeast bubbled up in no time. Soon I was finding ways to baking breads, rolls and poteca—one of my family’s favorite treats. Take it from me, proofing yeast and baking bread don’t have to be daunting. Our Test Kitchen staff has the tips and tricks you need for proofing active dry yeast so you get perfect bread every time. Once you’ve mastered how to proof, learn how to use yeast! (For more tips, check out our full guide to how to make yeast bread.) How to Proof Yeast Taste of Home It’s worth noting that proofing yeast is different than proofing bread dough. Here’s how to proof yeast, step by step. You’ll need: 1 package (1/4 ounce) active dry yeast 1/2 cup water 1 teaspoon sugar Step 1: Stir it Up In a large bowl, give the yeast, water and sugar a little stir. The water should be warm enough—ideally between 105º and 115º—to really get the yeast going. You may notice that some yeast bread recipes don’t call for sugar in the proofing process, but adding a small amount at this stage provides the yeast with the energy it needs to create carbon dioxide (all those gassy bubbles that give bread its lift). And don’t worry—a teaspoon of sugar won’t impact the overall taste of the bread. Test Kitchen tip: Feel free to substitute a bit of honey or agave syrup for the sugar—even a tablespoon of flour will do. These ingredients all serve as food for the yeast. Taste of Home Step 2: Wait it Out Be patient, and let the mixture stand for 5-10 minutes (this was always my big mistake—not letting it sit). This allows the yeast enough time to gobble up all that sugar and produce plenty of carbon dioxide. Once it’s nice and bubbly, it’s ready to be incorporated into your mixture. If you notice that the yeast hasn’t bubbled much after 10 minutes, the yeast might be old. You can still use old yeast in a recipe, but it will take longer to rise. In general, though, be mindful of expiration dates, and be sure to store yeast in a cool, dry place—even in the fridge or freezer. That’s all it takes to get yeast going! Now that you’ve got this simple process down, it’s time to master some of our favorite recipes. We suggest these tasty Parker House rolls or a loaf of whole-wheat French bread. Get Started With These Non-Scary Bread Recipes 1 / 35 Best Ever Banana Bread Whenever I pass a display of bananas in the grocery store, I can almost smell the wonderful aroma of my best banana bread recipe. It really is that good! —Gert Kaiser, Kenosha, Wisconsin Get Recipe Swiss Beer Bread Recipe photo by Taste of HomeSwiss Beer BreadThis recipe is a favorite of my family because it isn't greasy like most of the other cheese breads I have tried. It will not last long! —Debi Wallace, Chestertown, New YorkGo to Recipe Favorite Irish Soda Bread Recipe photo by Taste of HomeFavorite Irish Soda BreadMy best friend, Rita, shared this irresistible Irish soda bread recipe. It bakes up high, with a golden brown top and a combination of sweet and savory flavors. —Jan Alfano, Prescott, Arizona (Try these other Irish soda breads, too!)Go to Recipe Crusty Bread Recipe photo by Taste of HomeCrusty BreadThis easy crusty bread recipe proves that you absolutely can make a bakery-quality loaf at home—no kneading required. Once you've mastered the basic recipe, try variations with cheddar, herbs and more.Go to Recipe Chocolate Quick BreadMy husband and I both enjoy cooking, but the baking is left to me. Our sons loved this chocolaty quick bread when they were little—and still do as grownups! —Melissa Mitchell-Wilson, Wichita, KansasGo to Recipe Basic Homemade Bread Recipe photo by Taste of HomeHomemade Bread RecipeHere's a step-by-step guide to kneading, shaping and baking yeast bread for the freshest, fluffiest homemade loaves.Go to Recipe Sticky Cinnamon-Sugar Monkey Bread Recipe photo by Taste of HomeMonkey Bread with Frozen Bread DoughOur sticky, sweet, warm, pull-apart monkey bread with frozen bread dough takes less than an hour to make. Breakfast, movie night and potlucks will never be the same.Go to Recipe Contest-Winning Pumpkin Chocolate Chip Bread Recipe photo by Taste of HomePumpkin Chocolate Chip BreadOur recipe for pumpkin chocolate chip bread is a fall staple for any day, any time of the week.Go to Recipe Fluffy Biscuits Recipe photo by Taste of HomeBiscuits with ShorteningFlaky, fluffy and buttery—biscuits with shortening are the perfect companion for breakfast, lunch and dinner.Go to Recipe Cranberry Orange Almond Quick Bread Recipe photo by Taste of HomeCranberry Orange Almond Quick BreadYou can customize this bread to your family's specific tastes. Try dried apricots and pecans, or dried blueberries and hazelnuts. —Taste of Home Test KitchenGo to Recipe No-Fuss Rolls Recipe photo by Taste of HomeNo-Fuss RollsWith only 4 ingredients, these delicious rolls are ready in no time. They're fantastic with herb butter or jam. —Glenda Trail, Manchester, TennesseeGo to Recipe Cinnamon Roll Bread Recipe photo by Taste of HomeCinnamon Roll BreadAll the delicious flavors you can't resist in a cinnamon roll are packed into this way-easier-to-make cinnamon roll bread recipe. We usually make this quick bread without a glaze, but you can easily add a glazed topping to take it to the next level.Go to Recipe Honey Cornbread Recipe photo by Taste of HomeHoney CornbreadNix the box mix for this homemade honey cornbread recipe. It’s comforting and complements savory dishes effortlessly. Go to Recipe Sweet Potato Cinnamon Bread Recipe photo by Taste of HomeSweet Potato BreadOne slice of this warm, tender sweet potato bread and you’ll see why it’s one of our favorite sweet potato fall desserts.Go to Recipe French Loaves Recipe photo by Taste of HomeFrench BreadOnce you make this easy French bread recipe, you'll never go back to store-bought loaves. Here are our best tips on how to bake it.Go to Recipe Apple Bread Recipe photo by Alejandro Monfort for Taste of HomeApple BreadWhile this apple bread is simply delicious as is, the fall-friendly recipe is also ripe for improvisation, so feel free to add your favorite dried fruits.Go to Recipe Golden Honey Pan RollsA cousin in North Carolina gave me the recipe for these delicious honey-glazed rolls. Using my bread machine to make the dough saves me about 2 hours compared to the traditional method. The rich buttery taste of these rolls is so popular with family and friends that I usually make two batches so I have enough! —Sara Wing, Philadelphia, Pennsylvania Go to Recipe Herb Quick Bread Recipe photo by Taste of HomeHerb Quick BreadThis simple bread is especially good with soups and stews, but slices are also tasty alongside fresh green salads. The herbs make it a flavorful treat any time of the year. —Donna Roberts, Manhattan, KansasGo to Recipe Best Ever Banana Bread Recipe photo by Jonathan Melendez for Taste of HomeBest Ever Banana BreadOur best ever banana bread is soft, moist and filled with a caramelized banana flavor. It’s easy to see why bakers love this recipe!Go to Recipe Icebox Rolls Recipe photo by Taste of HomeIcebox RollsI remember my mom making these rolls almost every Saturday so they'd be ready to bake on Sunday for company or someone just dropping by. Although they take a little time to prepare, they're really not all that difficult to make. And there's nothing in the stores that can compare to them! —Jean Fox, Welch, MinnesotaGo to Recipe Pina Colada Zucchini Bread Recipe photo by Taste of HomePina Colada Zucchini BreadPina colada zucchini bread is a fun new take on the usual quick bread loaf. This recipe is filled with tons of summery flavors, from tropical pineapple and coconut to heady rum and vanilla.Go to Recipe Chocolate Chai Mini Loaves Recipe photo by Taste of HomeChocolate Chai Mini LoavesThis bread is irresistible! A friend gets mad when I make it because I give her a loaf and she can't help but eat the whole thing! —Lisa Christensen, Poplar Grove, IllinoisGo to Recipe Bread Machine Naan Recipe photo by Taste of HomeBread Machine NaanEasy to make and even easier to enjoy, this bread machine naan recipe is one you will come back to again and again.Go to Recipe Cowboy Cornbread Recipe photo by Taste of HomeCowboy CornbreadThis cornbread is richer and sweeter than others I’ve tried, and especially luscious alongside ham and beans. —Karen Ann Bland, Gove, KansasGo to Recipe Hungry for more? Here’s our cowboy bread recipe that you must try. Potato Pan RollsMy family loves these rolls and requests them often. They don't take long to make because you use quick-rise yeast. —Connie Storckman, Evanston, WyomingGo to Recipe Cranberry Walnut Bread Recipe photo by Taste of HomeCranberry Walnut BreadSome quick bread recipes have just a sprinkling of fillings, but this cranberry walnut bread is loaded with fruit in every slice. It's a lovely autumnal treat for breakfast or dessert.Go to Recipe Cheesy Garlic Herb Quick BreadThis could be the perfect bread for any dish. The sharp cheddar cheese makes it irresistible.—Taste of Home Test Kitchen, Milwaukee, WisconsinGo to Recipe Bacon Walnut Bread with Honey Butter Recipe photo by Taste of HomeBacon Walnut Bread with Honey ButterMy savory walnut bread filled with bacon bits and blue cheese'''
