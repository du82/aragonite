title = "Costco Has a Tiramisu Cheesecake, and People Are All Over It"
description = "The Costco tiramisu cheesecake has officially captured the internet's attention. This dessert has 4.8 lbs. of goodness for a mere $23.99."
full_description = '''Kristina Vanni For Taste Of Home Home News Grocery Stores Costco Just Dropped a Tiramisu-Cheesecake Mashup—and the Internet Is All Over It Kristina Vanni For Taste Of Home By Kristina Vänni Taste of Home's Editorial Process Published on Feb. 28, 2025 Save Saved Saving This is 4.8 pounds of tiramisu goodness for a mere $23.99. Now Trending if ( ! window.cnx ) { window.cnx = {}; window.cnx.cmd = []; } var cnxDiscoveryPlayerInitialized = false; cnxDiscoveryTriggerRender(); function cnxIsRecircStickyEnabled() { const recircDiv = document.getElementById("recirc-strip"); if ( null !== recircDiv && (recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile') || recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile-down'))) { return true; } return false; } function cnxDiscoveryTriggerRender() { // Add floatingGutterY property to video player based on recirc strip. var cnx_gutterY = 0; if ( cnxIsRecircStickyEnabled() ) { cnx_gutterY = document.getElementById("recirc-strip").offsetHeight; } if ( cnxDiscoveryPlayerInitialized ) { return; } var trigger = document.querySelector( ".ad-type-prearticle" ); if ( ! trigger) { trigger = document.querySelector( "head" ); } let cnxLibLoader = document.createElement('script'); cnxLibLoader.type = 'text/javascript'; cnxLibLoader.async = true; cnxLibLoader.src = 'https://cd.connatix.com/connatix.player.js?cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnxLibLoader.id = 'tmbi-connatix-discovery-js'; document.body.appendChild( cnxLibLoader ); (new Image()).src = 'https://capi.connatix.com/tr/si?token=fe436c54-d995-4d72-bef1-897fc6b8bf5f&cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnx.cmd.push(function() { cnx({ playerId: "fe436c54-d995-4d72-bef1-897fc6b8bf5f", "settings": { "customization": { "floating": { "floatingGutterY": cnx_gutterY } } } }).render("cnx-d7c9051cca3c4259a4e3bcc799ac24be"); }); cnxDiscoveryPlayerInitialized = true; } This is the culinary mashup we have all been waiting for. Imagine all the flavors of tiramisu in the form of a decadent cheesecake. I recently spotted this phenomenon at my local Costco and was immediately convinced to make a purchase. Only then did I hop on the internet and realize how lucky I was to find one! This beauty has been showcased on Costco fan accounts all over Instagram and TikTok, so the dessert has been flying off the shelf. What’s in the Costco tiramisu cheesecake? The cheesecake begins with a classic graham cracker crust that has been given a chocolaty twist with cocoa powder. Then, there’s a thick and rich cheesecake layer that has been infused with cold brew coffee. The filling could easily have been heavy, but I swear it’s velvety and not too dense. Finally, the dessert is finished off with a mascarpone whipped topping, which is light and airy. In keeping with the tiramisu theme, the cake is also dusted with cocoa powder as a final flourish. It’s visually stunning and even more beautiful when you cut it to see three distinct layers! You won’t find any rum or liqueur in this cheesecake. There are also no ladyfingers, an ingredient that’s essential for tiramisu. However, you won’t miss either element. The flavor combination of coffee, mascarpone and chocolate makes every bite magical. The $23.99 price tag makes this one of Costco’s more expensive treats, but at 4.8 pounds, this dessert is massive. The cheesecake cuts beautifully, so every slice is camera-ready for presentation. Don’t worry if you have leftovers, because the slices freeze like a dream. What are people saying? Kristina Vanni For Taste Of Home Even though this has only recently hit the Costco bakery, the internet is abuzz with thoughts on the dessert. Reddit users left comments like, “It’s freakin DELISH!” and “My two favorite things in one!!” Over on the @costcohotfinds Instagram, people are equally obsessed. One user said, “I already bought one and getting another one! It’s so good! Very light and not super sweet.” Many expressed the sentiment, “BRB running there now!” One comment even said, “I now need to get my Costco membership renewed just for this.” Author Kristina Vänni Kristina has been in the food-writing space for more than a decade. Apart from freelancing for food and lifestyle sites like Taste of Home and The Kitchn, she’s also working on her first cookbook. She is the owner and on-air host of Cooking Contest Central, an online community for cooking and recipe contests. Read More'''
