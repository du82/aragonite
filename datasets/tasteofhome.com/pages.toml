er Pro Review: Why I Ditched My Oven for This All-In-One Appliance TASTE OF HOME By Nicole Doster Tested by Annamarie Higley, Sheri Kaz and Dylan Fischer Taste of Home's Editorial Process Updated on Feb. 10, 2025 Save Saved Saving The Breville Smart Oven Air Fryer Pro is an all-in-one countertop appliance that will crisp foods to perfection. Our editors and experts handpick every product we feature. We may earn a commission from your purchases.Learn more. Now Trending if ( ! window.cnx ) { window.cnx = {}; window.cnx.cmd = []; } var cnxDiscoveryPlayerInitialized = false; cnxDiscoveryTriggerRender(); function cnxIsRecircStickyEnabled() { const recircDiv = document.getElementById("recirc-strip"); if ( null !== recircDiv && (recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile') || recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile-down'))) { return true; } return false; } function cnxDiscoveryTriggerRender() { // Add floatingGutterY property to video player based on recirc strip. var cnx_gutterY = 0; if ( cnxIsRecircStickyEnabled() ) { cnx_gutterY = document.getElementById("recirc-strip").offsetHeight; } if ( cnxDiscoveryPlayerInitialized ) { return; } var trigger = document.querySelector( ".ad-type-prearticle" ); if ( ! trigger) { trigger = document.querySelector( "head" ); } let cnxLibLoader = document.createElement('script'); cnxLibLoader.type = 'text/javascript'; cnxLibLoader.async = true; cnxLibLoader.src = 'https://cd.connatix.com/connatix.player.js?cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnxLibLoader.id = 'tmbi-connatix-discovery-js'; document.body.appendChild( cnxLibLoader ); (new Image()).src = 'https://capi.connatix.com/tr/si?token=fe436c54-d995-4d72-bef1-897fc6b8bf5f&cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnx.cmd.push(function() { cnx({ playerId: "fe436c54-d995-4d72-bef1-897fc6b8bf5f", "settings": { "customization": { "floating": { "floatingGutterY": cnx_gutterY } } } }).render("cnx-d7c9051cca3c4259a4e3bcc799ac24be"); }); cnxDiscoveryPlayerInitialized = true; } When I first started editing air fryer content in 2017, I will admit I was a bit of a skeptic. What could an air fryer do that my normal oven couldn’t? But after hearing rave reviews from our Test Kitchen, community cooks and practically everyone else under the sun, I gave the Breville Smart Oven Air Fryer Pro a try. And truth be told, after exploring all this appliance had to offer, I’ve almost entirely given up my oven. Yes, you read that correctly. This all-in-one countertop cooker is not only useful—it’s essential in my kitchen and has turned this air fryer skeptic into a true believer. TASTE OF HOME TASTE OF HOME We Tried It Breville Smart Oven Air Fryer Pro This all-in-one smart oven is a kitchen workhorse with 13 settings ranging from roast to air fry to dehydrate and more. Shop on Breville$399.95 at Amazon$399.95 at Sur La TableShop on Williams-Sonoma What is the Breville Smart Oven Air Fryer Pro? Nicole Doster For Taste of Home Breville’s Smart Oven Air Fryer Pro is not just an air fryer—it’s an all-in-one countertop appliance. The Pro model I tested comes with two wire racks, a 13-by-9 enamel pan, a pizza pan and a mesh basket for dehydrating and air-frying. It boasts 13 different cooking methods: Air-fry Bake Roast Pizza Proof Reheat Cookies Slow cook Dehydrate Bagel Toast Over the past few years of using the oven, I’ve cooked everything from biscuits to bacon to bagels—and even a whole roast chicken. Its versatility is second to none. What makes the Breville different from most other air fryers out on the market is its size. It’s a little larger than a microwave, and unlike most egg-shaped air fryers, the Breville Smart Oven uses a flat mesh basket that slides into a rack to air-fry food. This allows you to fit more food across a larger surface area compared to the typical air fryer. And since the oven door is glass, you can check in on food as it cooks. Buh-bye, overcooked air-fryer French fries! Breville Smart Oven Air Fryer Pro Product Features TASTE OF HOME As mentioned, the oven’s size is one of its defining features. As someone whose counter space is a scarce commodity, there are pros and cons to an oven of this size (14x22x12 inches, to be exact). While it takes up a decent amount of space, the oven has a spacious interior that accommodates a whole slew of dishes that the typical air fryer can’t. It’s great for making large sides and even main courses ranging from casseroles to whole chickens. I was surprised that I could fit an entire 4-quart Dutch oven inside! And while the oven comes with preset modes, you’re not limited to them. When baking, for example, you can select the precise time and temperature of your choice. One of the genius features Breville built into the oven is the ability to automatically convert the temperature from regular baking to convection and to super convection. So long, conversion guides! There are a few more subtle features that reflect Breville’s attention to detail in its product design. With the press of a button, you can turn on “rotate remind” which alerts you at the halfway mark to turn your dish for even cooking. There’s also a light that makes it easy to peek in, magnets built into the door that help pull out the rack and even a specially designed loop on the appliance cord that makes it easier to insert and remove the plug. These small upgrades and air-fryer accessories add up and make the Breville Smart Oven feel like a luxury in the kitchen. How does it work? ⓘ With the twist of a dial, you can select between the 13 cooking methods that the Breville Smart Oven has to offer. Once a method is selected, a preset will appear with the option to change the time and/or temperature. For instance, if you select Toast, the oven will give you an option to select the level of darkness (1-7) and number of slices (1-9). For the Cookies setting, the oven defaults to 325 degrees Fahrenheit on convection for 11 minutes. To cook, you simply place the rack (or sheet pan or air-fryer basket) to its designated height. Breville outlines the proper spot to place each rack on the outside of the door: broil on the top rack, pizza on the lowest rack and so on. (However, while testing, I’ve found these labels can be somewhat tricky to read.) Once the oven is fired up, Breville uses what it refers to as “Element IQ technology” to adjust the power of its heating elements to cook food to perfection. Like other air fryers and convection ovens, a built-in fan circulates hot air throughout the oven, distributing the steady heat and consistent airflow that’s essential to crisp food to perfection. How We Tested It TASTE OF HOME To test the Breville Smart Oven Air Fryer Pro, I first measured the time it took to preheat the Smart Oven to 400 degrees Fahrenheit and compared it to my standard oven. The results were incredible: Breville Smart Oven preheat time: 5 minutes 10 seconds Standard oven preheat time: 13 minutes 11 seconds This means the Breville Smart Oven is able to preheat and cook a dish in the time that it took to heat my old oven. As someone who is very impatient when it comes to cooking, this was huge. Nicole Doster for Taste of Home Next, to test Breville’s powerful convection heat, I baked sliced potatoes at 400 degrees Fahrenheit for 15 minutes on the regular bake, convection and super convection settings and compared them to my standard (non-convection) oven. Standard oven: The potatoes were cooked and only slightly golden on the outside. They could likely use 10 to 15 more minutes until browned and crispy. Breville standard: The potatoes were slightly darker than my standard oven’s results, but not by much. Breville convection: The potatoes were beginning to get deeply golden with some dark brown bits. Breville super convection: At the 15-minute mark, the potatoes were a deep brown and perfectly roasted, with some smaller slices beginning to over-brown. What this leads me to believe is that the Smart Oven’s convection and super convection modes are a great shortcut for speedy roasting and air-frying, shaving minutes off the standard cooking time for dinners and sides. What’s more, I can confirm that the appliance can cook almost anything you throw its way. This past holiday season, I relied on it for Christmas cookies, where its quick preheat time was invaluable. I’ve also baked fruit cobbler using my largest 12-inch cast iron skillet, brownies in a 9-by-9 baking dish and almost too many cakes to count. If you constantly find yourself needing more space to cook dessert, the Breville Smart Oven Air Fryer Pro is a great complement to your baking arsenal. Testing Team Evaluation Our Product Testing Team tested the Breville air fryer toaster oven alongside others for our piece on the best air fryer toaster ovens. We performed roughly 10 tests on each and spent a collective 80 hours on this test, including researching, sourcing, intaking and testing the products. After all that testing, the Breville oven earned a spot as the best large-capacity oven. "This is perfect for someone with a kitchenette in their home or a family who wants a second oven because, for all intents and purposes, it's just that. It fits casseroles, stews, whole roasts—so impressive for a portable appliance that just plugs into your wall!"annamarie higleyProduct Testing Manager Intuitiveness Dylan Fischer for Taste of Home The door is glass and has indicators for what to cook on each shelf. There’s also a nice big LCD screen to navigate. However, we had some issues with the preheat function kicking in mid-cook when we opened the door to check on our food. There’s a temperature sensor inside, so if the door is left open a little too long when you’re checking the food, you’ll have to sit through another quite lengthy preheat cycle. French Fries In the French fries test, the unit fared better than most. Though the fries came out a bit underdone, they were all very consistently golden brown. Plan on putting a few extra minutes on the timer and spraying your fries with oil first for better results. Cake Baking In terms of baking a cake, the Breville boasted the best rise, caramelization and evenness of all the cakes we made. That said, the preheat function kicks back in after opening the door for as little as 10 to 15 seconds, and it takes a while to get back up to temperature. Be careful when you open that door mid-cook! Whole Chicken Dylan Fischer for Taste of Home When it came time to cook the chicken, we placed a baking rack on the very lowest rung and put an aluminum baking sheet on top to catch the drippings. We heated the oven to 375 degrees Fahrenheit and set the timer to 90 minutes. It took a few minutes to preheat, so meanwhile, we loaded the chicken onto a second baking rack to place directly above the aluminum pan on the rung that was labeled “roast.” We rotated the rack halfway through to promote even browning. Unsurprisingly, because this thing is supposed to fit a whole turkey, the chicken fit with plenty'''
