 and (max-width: 767px) { #tmbi-recirculation-strip .item { width: 50%; } } /** Sticky CSS Start **/ .tmbi-rs-sticky { position: sticky; } @media screen and (min-width: 1025px) { section.recirc-strip.tmbi-recirc-strip-sticky-desktop { position: sticky; top: 76px } .tmbi-rs-sticky { top: 76px; } } @media screen and (max-width: 1024px) { .header-2021.sticky { position: relative; } section.recirc-strip.tmbi-recirc-strip-sticky-mobile { position: sticky; top: 0; } .tmbi-rs-sticky { top: 0; } } /** Sticky CSS End **/ How to Measure Ingredients for Better Baking How to Store Flour Properly Here's the Right Way to Measure Wet and Dry Ingredients How to Measure Without Measuring Cups This Baking Hack Shows You How to Measure Honey the Easy Way Is Your Bread Dough Kneaded Enough? Here's How to Tell. Homemade Self-Rising Flour Why Pro Bakers Measure Ingredients by Weightâ€”and You Should, Too What Is 00 Flour? The Most Popular Types of Flour and When to Use Them This Chart Shows You How to Convert Cooking Measurements Can You Eat Raw Flour? How to Make Whole Wheat Bread Gluten-Free Flour Mix Flour Tortilla Mix Does Flour Go Bad and Can You Use Expired Flour? How do you make a quick bread recipe in mini loaf pans? 26 Ways to Use Up a Bag of Cake Flour How to Adapt Baking Recipes for Different Pan Sizes How to Knead Dough with a Stand Mixer Home Recipes Cooking Style Baking How to Measure Flour Correctly By Alexa Hackfort Reviewed by Peggy Woodward, RDN Taste of Home's Editorial Process Updated on Aug. 01, 2024 Save Saved Saving Baking is a science! Too much or too little flour can totally alter a recipe. Our Test Kitchen shows you how to measure flour correctly so you'll get your best-ever bakes. Now Trending if ( ! window.cnx ) { window.cnx = {}; window.cnx.cmd = []; } var cnxDiscoveryPlayerInitialized = false; cnxDiscoveryTriggerRender(); function cnxIsRecircStickyEnabled() { const recircDiv = document.getElementById("recirc-strip"); if ( null !== recircDiv && (recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile') || recircDiv.classList.contains('tmbi-recirc-strip-sticky-mobile-down'))) { return true; } return false; } function cnxDiscoveryTriggerRender() { // Add floatingGutterY property to video player based on recirc strip. var cnx_gutterY = 0; if ( cnxIsRecircStickyEnabled() ) { cnx_gutterY = document.getElementById("recirc-strip").offsetHeight; } if ( cnxDiscoveryPlayerInitialized ) { return; } var trigger = document.querySelector( ".ad-type-prearticle" ); if ( ! trigger) { trigger = document.querySelector( "head" ); } let cnxLibLoader = document.createElement('script'); cnxLibLoader.type = 'text/javascript'; cnxLibLoader.async = true; cnxLibLoader.src = 'https://cd.connatix.com/connatix.player.js?cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnxLibLoader.id = 'tmbi-connatix-discovery-js'; document.body.appendChild( cnxLibLoader ); (new Image()).src = 'https://capi.connatix.com/tr/si?token=fe436c54-d995-4d72-bef1-897fc6b8bf5f&cid=877050e7-52c9-4c33-a20b-d8301a08f96d'; cnx.cmd.push(function() { cnx({ playerId: "fe436c54-d995-4d72-bef1-897fc6b8bf5f", "settings": { "customization": { "floating": { "floatingGutterY": cnx_gutterY } } } }).render("cnx-d7c9051cca3c4259a4e3bcc799ac24be"); }); cnxDiscoveryPlayerInitialized = true; } ⓘ All good bakers know their craft is just as much science as it is art. And any good science experiment requires precision for the best results. With baking, that means getting the right times, temperatures and—perhaps most importantly—measurements. Knowing how to measure ingredients can be tricky, though, especially with finer ingredients like flour. To illustrate how easy it is to make a measuring mistake, we devised an impromptu test. Our Test Kitchen pros asked other Taste of Home staffers to measure flour as they would at home, and the results were staggering. Some measured cups of flour as light as 3 ounces and some as heavy as 5-1/2 ounces. In short, a far cry from the correct weight of a cup of flour: 4-1/4 ounces. That extra ounce or two can turn chocolate chip cookies into hockey pucks. Yikes! To make sure you don’t run into problems the next time you’re craving a cookie, our Test Kitchen prepared a short refresher on how to measure flour for perfect cookies (and cakes and brownies) every time. Tools You’ll Need Kitchen Scale$15.99 at Amazon Measuring Cups$11.08 at Amazon Plastic Scraper$5.99 at Amazon Use a kitchen scale to get the most precise measurement for any ingredient. Here’s more on why you need a kitchen scale. A good set of measuring cups is essential for any baker, especially if you’re measuring flour by volume. Keep a straight-edge tool in your flour container to make leveling off your measuring cup easy. How to Measure Flour by Volume For most home bakers, measuring by volume with a measuring cup is standard practice. But there are some secrets to getting a more accurate measurement with this basic tool. As a rule, flour should not be compacted when being measured—you’ll end up with far too much of the ingredient. Here’s how to properly measure flour by volume: Step 1: Fluff up the flour Flour settles in storage, so it needs to be loosened with a spoon or whisk. Aerating the flour helps prevent overmeasuring. Step 2: Fill the measuring cup Taste of Home Next, spoon the flour into a measuring cup until heaping (piled beyond the rim of the measuring cup). Never scoop the flour with the measuring cup. Step 3: Level off the flour Finally, level the flour with the flat side of a knife. This should give you about 125 grams (4-1/4 ounces) of flour—a standard cup. How to Measure Flour by Weight Taste of Home For the most precise measurement, our Test Kitchen recommends measuring without measuring cups. In other words: Use a kitchen scale. To measure flour (or any ingredient), place a bowl on the scale, tare to zero and then add your flour. How many grams in a cup of flour? FLOUR (In Cups) –1/4– –1/3– –1/2– –2/3– –3/4– –1– All-Purpose 30 40 60 80 90 120 Cake 29.5 39.3 59 78.6 88.5 118 Self-Rising 31 41.3 62 82.6 93 124 Whole Wheat 32.5 43.3 65 88.6 97.5 130 All weights are in grams. Tips for Measuring Flour Here are our top tips for how to properly measure flour: Never sift your flour before measuring unless your recipe specifically says to. Doing so will result in a lot less flour than the recipe calls for. Before measuring, fluff up the flour in the container by stirring with a spoon or whisk. Don’t use your measuring cup to scoop the flour. Spoon it into the measuring cup for better accuracy. There’s a right way to measure wet and dry ingredients, so make sure you’re using a measuring cup that’s made for dry ingredients. A coffee mug, rice measuring cup or a measuring cup for wet ingredients won’t give you the correct result! Don’t pack the flour down with the spoon as you’re scooping. Compressing the flour will give you an inaccurate result. Author Alexa Hackfort Alexa is a writer who believes there’s always room for ice cream. Based in Milwaukee, she enjoys exploring the city, tackling new recipes and planning her next trip. Read More Reviewer Peggy Woodward, RDN Peggy is a registered dietitian nutritionist and former senior food editor for Taste of Home. In addition to curating recipes, she wrote articles, developed recipes and was our in-house nutrition expert. She studied dietetics at the University of Illinois and completed post-graduate studies at the Medical University of South Carolina. Peggy has a b... Read More'''
