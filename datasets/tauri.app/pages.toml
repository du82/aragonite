full_description = '''Create a Project (() => { class StarlightTabsRestore extends HTMLElement { connectedCallback() { const starlightTabs = this.closest('starlight-tabs'); if (!(starlightTabs instanceof HTMLElement) || typeof localStorage === 'undefined') return; const syncKey = starlightTabs.dataset.syncKey; if (!syncKey) return; const label = localStorage.getItem(`starlight-synced-tabs__${syncKey}`); if (!label) return; const tabs = [...starlightTabs?.querySelectorAll('[role="tab"]')]; const tabIndexToRestore = tabs.findIndex( (tab) => tab instanceof HTMLAnchorElement && tab.textContent?.trim() === label ); const panels = starlightTabs?.querySelectorAll(':scope > [role="tabpanel"]'); const newTab = tabs[tabIndexToRestore]; const newPanel = panels[tabIndexToRestore]; if (tabIndexToRestore < 1 || !newTab || !newPanel) return; tabs[0]?.setAttribute('aria-selected', 'false'); tabs[0]?.setAttribute('tabindex', '-1'); panels?.[0]?.setAttribute('hidden', 'true'); newTab.removeAttribute('tabindex'); newTab.setAttribute('aria-selected', 'true'); newPanel.removeAttribute('hidden'); } } customElements.define('starlight-tabs-restore', StarlightTabsRestore); })() Bash PowerShell Fish npm Yarn pnpm deno bun Cargo sh <(curl https://create.tauri.app/sh) irm https://create.tauri.app/ps | iex sh (curl -sSL https://create.tauri.app/sh | psub) npm create tauri-app@latest yarn create tauri-app pnpm create tauri-app deno run -A npm:create-tauri-app bun create tauri-app cargo install create-tauri-app --lockedcargo create-tauri-app Frontend Independent Bring your existing web stack to Tauri or start that new dream project. Tauri supports any frontend framework so you don’t need to change your stack. Cross Platform Build your app for Linux, macOS, Windows, Android and iOS - all from a single codebase. Inter-Process Communication Write your frontend in JavaScript, application logic in Rust, and integrate deep into the system with Swift and Kotlin. Maximum Security Front-of-mind for the Tauri Team that drives our highest priorities and biggest innovations.'''
