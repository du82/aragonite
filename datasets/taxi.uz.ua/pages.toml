title = "Такси Шостка | Таксі України"
description = "Такси Шостка. Телефонный справочник такси в Шостке. Все службы такси города Шостка."
full_description = "Такси «ПРЕСТИЖ+» +38 (05449) 4-00-04 +38 (095) 348-37-34 +38 (098) 866-12-50 +38 (063) 782-11-97 Такси «Колобок» +38 (05449) 2-22-34 +38 (05449) 72-2-72 +38 (050) 327-38-30 +38 (098) 554-87-71 +38 (068) 652-22-37 +38 (063) 206-55-10 Такси «ПРЕСТИЖ» +38 (05449) 4-26-66 +38 (066) 322-23-31 +38 (068) 600-98-03 +38 (096) 637-96-80 +38 (067) 604-60-66 +38 (093) 418-00-86 Такси «ЭЛИТ-Такси» 15-53 (бесплатно) +38 (05449) 7-08-08 (бесплатно) +38 (067) 701-18-54 (бесплатно) +38 (050) 584-04-12 (бесплатно) +38 (063) 484-00-05 (бесплатно) +38 (066) 724-53-02 (бесплатно) +38 (068) 652-31-10 (бесплатно) +38 (097) 875-74-67 (бесплатно) Шостка – наверное, самый знаменитый районный центр Украины. Когда-то без имени этого города в титрах не выходил ни один советский фильм. В конце каждого красовалась надпись «Снято на пленке Шосткинского ПО «Свема». Времена те прошли, завод закрыли, а на его основе планируют создать современный индустриальный парк, для чего ищут инвесторов. Такси в Шостке представлено шестью службами. Цены за один километр поездки от 2 до 4 грн. Посадка пассажира – 10-15 грн. По большому счету, кроме знаменитого комбината кинопленки, который выпускал также большой ассортимент продукции, в том числе и магнитную пленку для кассет, в Шостке нет особо интересных мест. Назван город по имени реки, на берегу которой он находится. Первые письменные свидетельства о Шостке датируются 17 веком. Долгое время здесь работал старейший в Российской империи завод артиллерийского пороха. Но лучшие годы Шостки – это период работы легендарной «Свемы». Завод был основан в 1931 году и имел не менее важное значение для экономики, чем Днепрогэс. Сейчас Шостка знаменита на всю Украину своими сырами отличного качества, которые выпускает местный сырный завод."
