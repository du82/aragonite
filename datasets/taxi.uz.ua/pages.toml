title = "Такси Феодосия | Таксі України"
description = "Такси Феодосия. Все службы такси в Феодосии. Телефонный справочник такси в городе Феодосия."
full_description = "Такси Копейка +7 (978) 817-55-43 +7 (978) 908-3-111 +7 (978) 034-0-111 +7 (978) 786-9-111 http://taxi-kopeika.com.ua/ Такси Десяточка +7 (36562) 2-10-10 +7 (978) 700-65-32 +7 (978) 818-80-10 http://www.feotaxi.net/ Такси Престиж +7 (36562) 5000-5 +7 (978) 700-85-05 +7 (978) 869-45-05 http://taxi-lux.vonlajne.com/ Феодосия – один из самых древних городов Крыма, история которого началась еще до нашей эры и связана с греческими колонистами. На месте города было их поселение, которое с течением времени переходило от одного государства до другого. Именно это формирует неповторимый исторический облик Феодосии. Туристическую привлекательность города создает не только мягкий климат и морское побережье с удобными пляжами, но и возможность дотронуться к его многовековой славной истории. Служб такси в Феодосии 20, тариф составляет от 15 до 35 грн за посадку пассажира, один километр поездки будет стоить от 3 до 5 грн. Феодосия занимает площадь около 40 квадратных километров, население – 70 тысяч жителей. Муниципального транспорта в городе нет, передвигаться можно или на такси, или с помощью частных маршрутных автобусов. Феодосия богата памятниками и достопримечательностями. Своего расцвета город достиг при правлении генуэзцев, которые на месте греческого поселения основали портовый город Каффа, столицу своих владений на Черном море. Позже Каффа перешла под управление Османской империи. С тех времен сохранились уникальные археологические памятники, наиболее ценным из которых являются развалины генуэзской крепости. Также к средневековому периоду относится мечеть Муфтий-Джами и ряд христианских церквей разных концессий."
