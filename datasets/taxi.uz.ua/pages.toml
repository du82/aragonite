full_description = "Такси «ПРЕСТИЖ-ТАКСИ» 15-61 (легковое такси) +38 (0542) 60-08-03 (легковое такси) +38 (0542) 60-00-61 (грузовое такси) +38 (050) 407-00-02 (легковое такси) +38 (067) 540-00-61 (легковое такси) +38 (050) 407-00-02 (грузовое такси) +38 (067) 540-00-61 (грузовое такси) http://www.taxi.sumy.ua/ Такси «Ваше такси» +38 (0542) 79-37-40 +38 (050) 309-37-40 +38 (067) 679-37-40 +38 (063) 079-37-40 http://taxisumy.com.ua/ Такси «1585» 15-85 +38 (0542) 22-33-49 +38 (050) 021-07-06 +38 (067) 704-03-74 +38 (063) 791-46-95 http://taxi1585.at.ua/ Сумы — небольшой уютный город на северо-востоке Украины, расположенный на реке Псел. Однако название города происходит от названия другой реки – Сумки, которая впадает здесь в Псёл. По легенде здесь были найдены сумки с золотыми монетами, которые сейчас украшают герб города. Служб такси в Сумах около 20. Цены довольно умеренные – от 2 до 4 грн за километр, посадка пассажиров 15-20 грн. Площадь города составляет почти сто квадратных километров, население – долее 250 тысяч жителей. Основан город Сумы был в 17 столетии запорожскими казаками, переселенцами из-за Днепра. Здесь была возведена крепость, которая долгое время была совершенно неприступной. Сегодня город Сумы поражает обилием зелени и приятным очарованием провинции. Здесь есть много старинных зданий, которые сохранились еще со времен его основания, например, Свято-Воскресенский кафедральный собор. Он строился не только как культовое сооружение, но и как оборонительное. В Сумах есть уникальный памятник деревянного зодчества, построенный без единого гвоздя, Альтанка, которую каждый житель Сум назовет как главную достопримечательность. Изысканность и красота этого сооружения и правда поражает. Местный краеведческий музей, расположенный в красивейшем здании земства, поведает об историческом прошлом города. В Сумах проводится множество фестивалей, в частности Чехов фест. Этот писатель с мировым именем не раз был в городе и восхищался его живописными видами."
