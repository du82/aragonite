["https://taxi.uz.ua/poshuk-taksi-v-ukraini/chernigovskaya-oblast/taksi-nezhin"]
title = "Такси Нежин | Таксі України"
description = "Такси Нежин. Все службы такси в Нежине. Телефонный справочник такси в городе Нежин."
full_description = "Такси «Люкс» +38 (04631) 7-55-57 +38 (068) 107-68-68 +38 (093) 990-00-69 +38 (050) 528-49-14 Такси «Лидер» +38 (04631) 7-18-88 +38 (050) 860-01-00 +38 (068) 101-18-18 +38 (067) 460-36-80 +38 (093) 167-05-02 Город Нежин славится не только своими фирменными нежинскими огурчиками. Этот город является важным культурным и экономическим центром региона, который дал миру многих известных людей. Служб такси в Нежине всего три. Цены составляют от 2,5 до 3 грн за один километр. Минимального заказа нет. Нежин занимает площадь в 50 квадратных километров, численность жителей чуть больше 70 тысяч. Нежин основан еще во времена Киевской Руси и с тех пор всегда оставался в центре политической и культурной жизни страны. Тут размещался Нежинский полк Войска Запорожского. В период Руины здесь прошла печально известная Черная Рада, которая усугубила и без того плачевное состояние украинского государства. В 18 и 19 веках Нежин был крупным коммерческим центром региона, в котором проводились знаменитые ярмарки. В начале 19 века здесь был открыт первый в Украине частное высшее учебное заведение — Гимназия высших наук князя Безбородко. Она стала основным источником свободомыслия и развития науки в регионе. Среди выпускников гимназии имена Н. Гоголя и многих других выдающихся людей. Благодаря этому учебному заведению сегодня небольшой провинциальный город имеет свой государственный университет, который с честью поддерживает свою высокую репутацию."
