full_description = "Такси «Эталон» +7 (978) 834-44-33 Мы Вам перезвоним! http://www.etalon-taxi.com/ Такси «Такси-Керчь» +7 (978) 830-51-01 +7 (978) 710-95-10 +38 (06561) 6-10-10 +38 (06561) 6-26-26 Такси «Метро» +7 (978) 101-9022 +7 (978) 101-90-33 +7 (978) 101-90-20 +7 (979) 010-50-10 +7 (978) 010-55-10 +7 (978) 010-55-01 Такси «Триколор» 15-58 7-06-22 7-06-21 + 7 (978) 747-52-02 + 7 (978) 765-84-65 +7 (929) 830-21-30 +7 (909) 463-40-33 Такси «Везунчик» Поездки на Украину. Междугородные поездки. +7 (978) 711-53-93 Один из самых древних городов мира Керчь остается многие годы центром туризма на Крымском полуострове. Такси станет удобным видом транспорта для осмотра многочисленных достопримечательностей этого замечательного места. Служб такси в Керчи пять, тарифы от 3 до 5 грн за километр, а посадка 15-25 грн. Площадь Керчи 108 км², а население составляет около 150 тысяч жителей. Общественный транспорт представлен автобусами, маршрутными такси и троллейбусами, которые появились в городе только в 2004 году. Главными достопримечательностями Керчи являются, конечно же, уникальные памятники истории и архитектуры античного периода. Ведь на месте современного города в VII века до н.э. находился греческий город-колония Пантикапей, который долгое время был культурной и экономической столицей региона. Сейчас многочисленных туристов привлекают его живописные развалины. Кроме него в городе есть еще несколько памятников античной эпохи. Не менее величественны и свидетельства пребывания города в составе генуэзских колоний в Северном Причерноморье, а также памятники Османской империи, как например, крепость Еникале, ставшая туристической изюминкой города."
