full_description = "Таксі «Радіо таксі 1560» 1560 +38 (03244) 2-31-51 +38 (098) 423-58-85 +38 (063) 748-99-60 http://drog1560.com.ua/ Таксі «838» 838 (з мобільного безкоштовно, автопередзвонювання) http://taxi838.com.ua/drohobych Таксі «Радіо таксі 1552» 1552 +38 (03244) 3-71-87 +38 (097) 431-67-35 +38 (063) 748-99-92 Дрогобич – це районне місто в центрі мальовничих Карпат, адміністративний центр Дрогобицького району. Площа міста невелика 44,5 км², чисельність жителів — 77 тисяч. Воно розташоване біля знаменитого курорту Трускавець і тому має розвинену транспортну структуру, хоча муніципального міського транспорту у місті немає. Тому вирішальну роль у перевезенні пасажирів мають приватні маршрутки і служби таксі, яких у місти шість. Середній тариф за 1 км — 5 грн., подача автомобіля від 20 до 35 гривень. Саме завдяки таксі Дрогобича відбувається перевезення пасажирів і до бальнеологічного курорту міжнародного значення Трускавця, а також до автовокзалу цього міста для міжміського сполучення. Краса старовинного міста, заснованого в ХІ столітті, численні пам’ятки архітектури, у тому числі в стилі модерн, пов’язані з періодом нафтового буму на початку 20 століття, затишні кав’ярні, парки і гостинність місцевих жителів приваблює сотні тисяч гостей щорічно."
