title = "Такси Лозовая | Таксі України"
description = "Такси Лозовая. Телефонный справочник такси в Лозовой. Все службы такси города Лозовая."
full_description = "Лозовая – крупный железнодорожный узел Харьковской области. Этим объясняется форма прилагательного женского рода в названии города, которая является сокращением от Лозовая станция. Служб такси в Лозовой пять. Цены не очень высокие, от 2до 4 грн за один километр, посадка пассажира 10-15 грн. Площадь города 18 квадратных километров, численность жителей около 70 тысяч. Город Лозовая был основан в середине 19 столетия в связи со строительством железной дороги. С тех пор все в его истории так или иначе, связано с железнодорожным транспортом. Также в городе есть машиностроительные предприятия. Крупнейшим заводом Лозовой является кузнечно-механический завод, продукция которого известна далеко за пределами Украины. Основные достопримечательности Лозовой – это памятники советской эпохи. Здесь множество мемориалов в честь павших во Второй мировой войне воинов. Один из самых узнаваемых архитектурных памятников города – это железнодорожный вокзал, построенный сразу после войны. Первоначальный проект этого здания, возведенного в несколько упрощенной форме, получил Гран-при на выставке в Париже. Город украшают также величественные храмы, построенные в разное время в разных стилях."
