title = "Конкуренція таксі в Москві | Таксі України"
description = "Жорстка Конкуренція таксі в Москві. Зібралися всі глобальні компанії мобільних додатків таксі."
full_description = "У липневому номері Forbes вийшов матеріал, в якому розкривається історія розвитку конкуренції між сервісами за викликом таксі в Москві «Яндекс.Таксі», Uber, Wheely і GetTaxi. Taxi.uz.ua публікує його найцікавіші факти. Одним з перших публічних зіткнень конкурентів у сфері замовлення таксі став конфлікт засновника Wheely Антона Чиркунова і керівника Uber в Росії Павлом Фаге. Сервіс для виклику преміум-авто Wheely почав свою роботу в Москві в листопаді 2012, а Uber прийшов у столицю Росії роком пізніше. Старт роботи проекту, який нині є однією з найперспективніших компаній всього світу з оцінкою в $ 17 млрд, супроводжувався запуском сайту, на якому був опублікований пост із зображенням першої клієнтки, яка скористалася сервісом. Уважні користувачі інтернету, серед яких опинився і засновник Wheely Антон Чиркунов, помітили, що в сидіннях преміум-автомобіля Uber розташовуються буклети саме цього сервісу таксі, що могло означати тільки одне – новий американський проект використовує ті ж машини, що і Wheely. Чиркунов був обурений подібною поведінкою конкурента (Wheely заявляє про те, що Uber переманював її водіїв), тому, коли йому представився шанс зробити відповідний випад, неодмінно ним скористатися. Завдяки тому, що для установки Wheely на смартфон потрібно вказати ім’я та поштову адресу, а одночасно з цим відбувається прив’язка банківської карти, то з’ясувати чи є певна людина клієнтом сервісу, не складає труднощів. Так Чиркунов дізнався, що керівник Uber Павло Фаге замовляє таксі за допомогою Wheely. За словами представників Wheely, для Павла Фаге був розроблений «спеціальний» тариф, згідно з яким сума до оплати за поїздку завжди множиться на 10. Фаге не відразу помітив підступ, але пізніше звернувся в службу підтримки, де йому пояснив ситуацію особисто Антон Чиркунов. У результаті керівник Uber отримав назад свої гроші, але залишився вкрай незадоволений поведінкою конкурентів, назвавши його непрофесійним."
