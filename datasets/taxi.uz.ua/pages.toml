full_description = "Такси «Оптимальное» 579 (с мобильного, бесплатно) +38 (099) 535-22-22 +38 (063) 408-22-22 +38 (098) 721-22-22 Днепродзержинск – важный промышленный центр в Днепропетровской области. Здесь расположены стратегически важные и даже уникальные производства. Также город является своеобразным спутником Днепропетровска, так как связан с ним многочисленными транспортными артериями. Служб такси в городе около десяти, тариф составляет от 3 до 5 грн за километр, а посадка пассажира стоит от 10 до 20 грн. Население Днепродзержинска насчитывает около 25 тысяч жителей, площадь города 140 квадратных километров. Днепродзержинск был основан в конце ХІХ века польскими, бельгийскими и французскими акционерами Днепровского металлургического завода на исконного казацких землях, принадлежащих Запорожской Сечи. Такая история основания наложила свой отпечаток на его архитектуру и дальнейшую историю. В Днепродзержинске родился и учился один из руководителей СССР Л.И. Брежнев. Это не могло не отразится на успехах этого города в экономике, промышленности и строительстве. Город рос и развивался, создавались новые предприятия. Это, увы, отразилось на экологической ситуации. Ведь кроме многих вредных производств здесь расположены хранилища отходов уранового производства ПХЗ (Приднепровского химического завода)."
