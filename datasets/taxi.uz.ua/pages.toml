["https://taxi.uz.ua/poshuk-taksi-v-ukraini/taksi-sumskaya-oblast/taksi-konotop"]
title = "Такси Конотоп | Таксі України"
description = "Такси Конотоп. Телефонный справочник такси в Конотопе. Все службы такси города Конотоп."
full_description = "Такси «Наше-Такси» +38 (05447) 6-66-64 +38 (063) 300-30-62 +38 (096) 604-00-10 +38 (097) 920-76-40 +38 (095) 789-84-00 +38 (068) 653-53-53 Такси «Эконом» +38 (05447) 6-15-15 +38 (097) 275-13-44 +38 (098) 896-15-69 +38 (063) 944-51-68 +38 (099) 670-22-73 Такси «Лада Такси-15-67» 15-67 +38 (05447) 6-15-67 +38 (067) 969-70-36 +38 (066) 485-57-76 +38 (096) 827-33-50 +38 (063) 595-93-46 +38 (050) 041-37-32 +38 (050) 041-37-31 Частный таксист «Александр на BYD F3» +38 (096) 517-65-57 Автомобиль бид ф3 просторный и комфортный. Отличный вариант для дальних поездок. Самые адекватные цены. Звоните! Конотоп, тот самый, где живут ведьмы, — это районный центр в Полтавской области. Прославленный в повести Г. Квитки-Основъяненка «Конотопская ведьма», городок известен не только чародейками, но и прекрасной живописной природой и чудесными памятниками архитектуры. Служб такси в Конотопе всего пять. Тарифы не очень высокие – 3-4 грн за километр, посадка пассажира от 10 до 15 грн. Конотоп стоит на берегу реки Езуч. Также в городе протекают еще две реки – Липка и Куколка. Площадь города более 100 квадратных километров, численность жителей – чуть меньше 100 тысяч. Точная дата основания города неизвестна. Первые упоминания о нем встречаются в исторических документах 17 столетия. Он стал одним из оплотов Запорожского войска, позже – административным центром (сотней) Гетьманщины. Название города происходит от выражения «топить коней», так как по преданию здесь были болота, в которых погибло много лошадей татар, нападавших на окрестности поселения. Сегодня Конотоп – небольшой, опрятный и красивый провинциальный городок, с довольно развитой промышленностью."
