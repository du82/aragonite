title = "Такси Кривой Рог | Таксі України"
description = "Такси Кривой Рог. Все службы такси в Кривом Роге. Телефонный справочник такси в городе Кривой Рог."
full_description = "Такси «Оптимальное» 579 (с мобильного, бесплатно) +38 (096) 975-99-99 +38 (066) 780-99-99 +38 (093) 597-99-99 http://optima.fm/ Такси «Важная персона» междугороднее +38 (067) 623-18-18 +38 (050) 450-18-18 +38 (093) 049-18-18 Такси «ЯТакси» +38 (067) 522-08-51 Сотрудничество с «Яндекс Такси» www.yandex-taxi.com.ua Кривой Рог – самый длинный город Европы, его длина составляет 126 км. Не удивительно, что службы такси пользуются спросом у гостей и жителей этого крупного промышленного центра Криворожского железорудного бассейна. Всего служб такси в городе около двадцати пяти. Тариф составляет от 3 до 6 грн за один километр, минимальный заказ от 15 до 35 грн. Кроме уникальной топонимики, Кривой Рог славится своей промышленностью. Здесь расположены шахты, многочисленные фабрики и заводы, а также крупнейший металлургический комбинат Украины, принадлежащий крупной международной сталелитейной корпорации. Площадь города составляет 400 квадратных километров, а население исчисляется более чем полумиллионом жителей. Кривой Рог никогда не был особо привлекательным для туристов. Это город-труженик, кроме того, в связи с обилием предприятий вредного производства, экология оставляет желать лучшего. Однако достопримечательности все-таки есть. Так, в Кривом Роге очень красивый железнодорожный вокзал, построенный в конце ХІХ века. Город имеет несколько красивых парков, в их числе Криворожский Ботанический сад, экспозиция которого насчитывает около 4000 уникальных растений. Еще одна ботаническая достопримечательность города – действующие цветочные часы, которые показывают не только время, но и температуру воздуха. Украшением города является современный светодинамический музыкальный фонтан, ставший любимым местом отдыха горожан и гостей Кривого Рога."
