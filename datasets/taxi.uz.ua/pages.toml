["https://taxi.uz.ua/xto-vinajshov-taksi"]
title = "Хто винайшов таксі? | Таксі України"
description = "Хто винайшов таксі? Історія таксі"
full_description = "Історія таксі Британці і французи сперечаються про це вже майже 400 років Кажуть, історія таксі почалася ще в Стародавньому Римі. Тоді це були колісниці, на осі яких винахідливі римляни кріпили «таксометр» — досить складний механічний лічильник, що складався з двох зубчастих кілець з отворами, і шухлядки, прикріпленого до колісної осі. Коли отвори кілець збігалися, а це відбувалося через кожний кілометр, то в ящик падав камінчик. Наприкінці поїздки камені підраховували і виходячи з їх кількості оплачували проїзд. На жаль, після падіння Римської імперії, «таксі» (як, втім, і багато інших винаходів) забули на довгі століття. Повторний винахід таксі відбувся в XVII столітті. Цю честь заперечують один у одного старовинні суперники — Англія і Франція. Причому Англія готова назвати конкретну дату — 1639. Саме в цьому році корпорація коучменов (місцевих кучерів) отримала ліцензію на візництво — і на вулиці країни виїхали чотириколісні екіпажі під назвою «Хекні» (hackney — «роз’їзна кінь»). У 1840 — 1850 роках неповороткі карети замінили двоколісні відкриті вози — кабріолети. Втім, англійці швидко скоротили назву до кеба. З 1907 року виробники автомобілів взялися за розробку моделей, які можна було б використовувати як таксомоторів. Традиційним кольором лондонських таксі став чорний, що символізує честь і гідність. З початку минулого століття «блек кеби» стали таким же впізнаваним атрибутом Лондона, як Біг-Бен або Тауерський міст."
