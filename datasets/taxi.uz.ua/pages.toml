full_description = "Місто шахтарів і залізничників Нововолинськ розташоване на мальовничій Волині і відоме найперше тим, що стоїть на землях, багатих кам’яним вугіллям, які належать до Львівсько-Волинського вугільного басейну. Саме з цим пов’язаний розвиток у місті промисловості і транспортних сполучень. Географічно місто розташоване дуже вдало, на перехресті основних торгових шляхів Східної Європи. Площа міста 17 км², а населення його складає близько 60 тисяч мешканців. Крім видобутку вугілля тут розвинуте деревообробне виробництво. В доволі невеликому містечку діє аж п’ять служб таксі, тарифи становлять 4 грн. за 1 км і 20 грн. посадка пасажира. Головні події, новини, діяльність в Нововолинську зосереджена навколо шахт. Їх зараз працює небагато, що пов’язано з низькою рентабельністю застарілого виробництва. Але нововолиняни не уявляють рідного міста без вугільної промисловості. Якихось особливих пам’яток у місті немає. Це невелике затишне місто вражає своїм провінційним шармом, повільним плином життя, охайністю і чистотою вулиць. Найбільш значима пам’ятка Нововолинська культового значення знаходиться за межам міста. Це старовинний Свято-Успенский монастир, заснований у ХVІІ, розташований в приміському селі Низкиничі, дістатися до якого можна і за допомогою якоїсь із служб таксі Нововолинська. Його заклав представник знатного польсько-українського роду, якому належали околиці Нововолинська, Адам Кисіль. Монастир і церква при ньому є прекрасними зразками української національної архітектури ренесансного періоду."
year_published = 2025
