full_description = "Таксі «Чернівці» +38 (0372) 55-91-91 +38 (0372) 93-14-93 +38 (0372) 55-91-91 +38 (050) 434-4-111 +38 (050) 434-4-555 +38 (050) 435-5-777 +38 (050) 435-5-999 +38 (050) 815-44-22 +38 (050) 374-44-64 +38 (067) 447-44-22 +38 (098) 815-44-22 +38 (093) 450-46-45 http://www.taxi.cv.ua/ Таксі «Оптимальне» 579 (з мобільного, автопередзвон) +38 (0372) 95-95-95 +38 (099) 615-95-95 http://optima.fm/ Одне з найкрасивіших міст України, легендарна столиця Буковини, український Париж – таку славу по праву має старовинне місто Чернівці. Воно розташоване в мальовничому краї на берегах річки Прут. Площа міста 153 км², кількість мешканців – близько 270 тисяч осіб. Служб таксі в Чернівцях 22, тарифи в середньому коливаються від 5 до 6 грн. за 1 км, подача таксі – 20 грн. Чернівці – це музей архітектури під відкритим небом. Найбільше тут пам’яток кінця ХІХ і початку ХХ століття у вишуканому стилі віденського модерну. Є також будівлі у класицистичному стилі, які збереглися з середини ХІХ століття. Цінність архітектури Чернівців у її ансамблевості, тобто збереглися не окремі пам’ятки, а цілий комплекс видатних споруд, які й формують неповторний образ прекрасного міста. Місто Чернівці засноване в ХІІ столітті і з того часу залишається економічним та духовним осередком регіону. Особливого розквіту місто зазнало під австрійським пануванням. Справжнім символом міста залишається Центральна площа, в минулому площа Ринок, яка будувалась за задумом імператора Австро-Угорщини на зламі ХVІІІ-ХІХ століть. Тут знаходиться міська ратуша, збудована в середині ХІХ століття в стилі класицизму. Опівдні з башти лунає мелодія пісні «Марічка» у виконанні сурмача в національному костюмі."
