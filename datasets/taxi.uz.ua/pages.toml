full_description = "Такси «Чаплинка» грузовое такси +38 (050) 015-13-45 +38 (098) 131-51-35 (бесплатно) Новая Каховка – город с удивительной историей. Он возник в месте, где климат и земля были враждебны людям. Но стала строиться Каховская ГЭС, здесь возник поселок строителей. Были посажены сады, парки, город превратился в настоящий оазис. Служб такси в Новой Каховке около 15. Цены невысокие – от 2 до 3 грн за километр, минимальный заказ 10 грн. Площадь Новой Каховки 23 квадратных километра, проживает в городе чуть менее 70 тысяч жителей. Новая Каховка – один из самых молодых городов Украины. Он был основан в 1950 году, название ему дал соседний поселок Каховка, а город стал Новой Каховкой. Все в городе так или иначе связано с важнейшим для нее предприятием — Каховской ГЭС. Здесь есть также несколько машиностороительных заводов. Главной достопримечательностью, превратившей Новую Каховку в город-сад, является прекрснейший памятник садово-паркового искусства — Парк имени С. М. Фалдзинского, который тянется вдоль берегов Днепра двумя линиями. Это самое любимое место отдыха горожан и гостей города. Большинство памятников города связано с советским прошлым. Архитектура Новой Каховки типовая, старых зданий здесь нет и не может быть. Однако город очень зеленый, уютный и располагающий к спокойному отдыху."
