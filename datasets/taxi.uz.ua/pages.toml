full_description = "+38 (096) 306-08-45 Богдан +38 (098) 254-91-15 Володя +38 (067) 583-51-40 Андрій +38 (067) 989-46-77 Коля +38 (096) 986-12-15 Володя +38 (067) 600-66-43 Володя +38 (098) 270-08-27 Вася +38 (067) 811-94-84 Саша +38 (097) 791-59-52 Саша +38 (097) 415-68-29 Толік +38 (067) 291-88-20 Андрій +38 (097) 682-07-63 Андрій +38 (097) 110-47-42 Юра Кременець – старовинне місто у підніжжя Кременецьких гір. Його історія починається в сиву давнину, ще у дохристиянські часи, з VІІІ століття. З утворенням Київської Русі місто ввійшло у її склад. Сьогодні це культурний і економічний осередок волинської частини Тернопільської області. В Кременці проживає майже 22 тисячі населення, а його площа складає 31 км². Служб таксі у Кременці дві, тарифи 4-5 грн за 1 км, подача машини – 10-15 грн. З допомогою таксі зручно оглядати приміські пам’ятки, до яких немає іншого сполучення, або воно незручне. Мова йде в першу чергу про видатну християнську святиню, чудодійне джерело Святої Анни, яке знаходиться в монастирі Святої Анни зовсім близько від Кременця. Купання в джерелі лікує жінок від безпліддя, тому сюди стікаються сотні тисяч паломників зі всієї України та інших країн Європи. Місце має особливу духовну ауру і обов’язкове для відвідин усіх гостей міста."
