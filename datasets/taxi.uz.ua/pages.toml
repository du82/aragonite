title = "Таксі Чортків | Таксі України"
description = "Таксі Чортків. Найкраще Таксі у Чорткові."
full_description = "Таксі «Круїз» +38 (03552) 22-8-58 +38 (03552) 39-0-99 +38 (098) 600-20-20 +38 (095) 212-02-02 +38 (063) 175-85-84 Чортків – місто обласного підпорядкування, центр однойменного району на галицькому Поділлі. Оригінальна назва міста має кілька версій походження – від прадавнього бога Чорнобога, від назви місцевості Чортова долина, а також від імені засновника магната Чартковського. Однаково сердита назва міста ніяк не впливає на його красу і гостинність. Площа Чортківа 30 км², кількість мешканців майже 30 тисяч осіб. Для комфортного пересування містом і огляду його цікавинок можна скористатись однією з 5 служб таксі. Тариф у середньому складає 3,5 грн. за 1 км, мінімальне замовлення 10 грн. Одною з найстаріших споруд міста, з якої воно починалось, є Чортківський замок – фортифікаційна споруда ХVІ століття. На жаль, він не зберігся в первісному вигляді, тому що часто страждав від військових дій і нападів ворогів. Сьогодні живописні руїни замку стали частиною Національного заповідника «Замки Тернопілля» і привертають увагу десятків тисяч туристів у рік. Прикладом рідкісної для України німецької архітектури є Чортківська ратуша кінця ХІХ століття з годинником і флюгером-півнем, що призвело до частого використання її у кінематографі. Нова ратуша Чортківа була побудована на початку ХХ століття в модерному стилі конструктивізму. Вона до сьогодні є діючою, в ній перебуває міська рада."
