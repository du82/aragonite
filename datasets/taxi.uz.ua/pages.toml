full_description = "Такси «55555» +38 (06442) 5-55-55 +38 (06442) 5-43-21 +38 (06442) 5-50-05 +38 (06442) 5-50-03 +38 (097) 644-00-58 +38 (066) 449-87-87 +38 (063) 349-10-41 +38 (068) 750-50-04 Такси «Альт» +38 (06442) 5-00-66 +38 (050) 585-11-45 +38 (067) 198-67-07 +38 (063) 722-49-59 Такси «Интер» +38 (06442) 5-54-00 +38 (06442) 5-26-34 +38 (050) 473-30-30 +38 (096) 632-93-33 +38 (063) 328-58-22 Такси «Любимое» +38 (06442) 5-00-76 +38 (06442) 4-76-00 +38 (050) 622-36-13 +38 (097) 940-72-66 Такси «Новое желтое» +38 (06442) 5-10-00 +38 (06442) 5-00-00 +38 (095) 595-50-50 +38 (050) 598-81-79 Алчевск – город областного подчинения в Луганской области. Здесь расположены два крупных предприятия — Алчевский коксохимический завод и Алчевский металлургический комбинат, с которыми связано развитие города. Служб такси в Алчевске восемь. Цены в среднем от 2 до 4 грн за километр, а посадка пассажира от 10 до 15 грн. Площадь Алчевска 50 квадратных километров, население – чуть больше 100 тысяч жителей. Назван город в честь своего основателя, крупного украинского купца, промышленника и мецената Алексея Кирилловича Алчевского, большого радетеля за возрождение украинской государственности и культуры. Этот замечательный человек сделал многое для индустриального развития востока Украины, но когда ему нужна была помощь, царские власти отказали в кредите, и Алчевский покончил с собой. В память о нем был названа станция, обслуживающая принадлежавший ему металлургический комбинат. Позже название закрепилось за растущим городом. Позже город несколько раз переименовывался в угоду советской идеологии, однако в 1991 году ему было возвращено историческое название."
