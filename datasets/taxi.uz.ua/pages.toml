title = "Такси Смела | Таксі України"
description = "Такси Смела. Все службы такси в Смеле. Телефонный справочник такси в городе Смела."
full_description = "Такси «ТАКСИ 24» +38 (093) 984-80-73 (бесплатно) +38 (093) 307-27-99 (бесплатно) +38 (096) 038-72-88 (бесплатно) +38 (095) 571-54-93 (бесплатно) Такси «Люкс такси» +38 (093) 091-26-28 +38 (068) 822-06-90 Круглосуточно. Пассажирские и грузоперевозки. Микроавтобус, эвакуатор, эконом, комфорт. Такси «Друг» +38 (073) 155-19-16 +38 (067) 158-88-96 Доставка товаров, Трезвый водитель, Встреча на вокзале, Доставка топлива, Личный водитель. Такси «Альтернатива» +38 (063) 350-28-99 +38 (093) 383-02-61 +38 (095) 487-06-03 +38 (097) 505-15-23 Такси «ШЕВА» +38 (093) 824-94-33 (бесплатно) +38 (068) 770-32-57 (бесплатно) +38 (095) 689-86-44 (бесплатно) Такси «Юрец» +38 (066) 055-65-63 +38 (063) 688-22-88 (бесплатно) +38 (098) 418-42-24 (бесплатно) Смела – небольшой живописный городок, который находится на берегу реки Тясмин в Черкасской области. Служб такси в Смеле всего три. Цены невысокие – от 2 до 3 грн за один километр, минимального заказа нет. Площадь Смелы – 40 квадратных километров, в городе проживает около 70 тысяч жителей. Город Смела имеет древнюю историю. Впервые о нем упоминается в документах 17 столетия. В 18 столетии главную роль в развитии города сыграла династия графов Бобринских. Они основали здесь сахарный завод и другие предприятия. Также эта благородная семья активно занималась благотворительностью и открывала учебные заведения. Историю Смелы можно узнать в местном краеведческом музее, который обладает внушительными коллекциями древностей и находится в великолепном здании начала 20 века стиля модерн. Настоящим украшением города является также Свято-Покровский собор, построенный в середине 19 века в величественном византийском стиле. Одно из самых красивых и старых зданий Смелы, к сожалению частично разрушенных при советской власти, — это Успенский костел, построенный в начале 19 века."
