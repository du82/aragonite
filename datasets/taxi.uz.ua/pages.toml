["https://taxi.uz.ua/poshuk-taksi-v-ukraini/taksi-u-rivnenskij-oblasti/taksi-u-dubno"]
title = "Таксі Дубно | Таксі України"
description = "Таксі Дубно. Всі служби Таксі у Дубно."
full_description = "Радіотаксі 1551 +38 (03656) 4-13-45 +38 (050) 673-77-00 +38 (067) 983-19-90 +38 (063) 316-04-50 Частный таксист Междугородние перевозки автомобилями Ланос и Крайслер(есть детское автокресло). +38 (063) 176-80-84 +38 (068) 665-37-27 Одне з найстаріших міст України Дубно має багату історію, знамените своїми пам’ятками і особливим колоритом. Розташоване воно в мальовничому краї, на берегах річки Іква. Площа міста 27 км², живе в ньому близько сорока тисяч мешканців. Древня історія приваблює багатьох туристів, а оглянути все з комфортом допоможуть сім служб таксі, тарифи на перевезення в середньому складають 5 грн., мінімальне замовлення відсутнє. Місто Дубно відоме з 1100 року і з того часу славиться у всьому західному регіоні. Сьогодні найвизначнішою пам’яткою історії, культури і архітектури є знаменитий Дубенський замок, що був закладений ще в Х столітті. Остаточною датою зведення замку став 1492 рік, а його засновником був легендарний князь Костянтин Острозький. З того часу замок став родовим для династії Острозьких. Нащадки князя вдосконалили фортифікаційні споруди твердині і побудували в ньому два палаци. Нині замок активно реставрується, має музей з багатою колекцією старожитностей і щорічно приваблює сотні тисяч туристів. Вигладяє він дуже ефектно, особливо з протилежного берега річки. Ще одна унікальна пам’ятка оборонної архітектури – це Луцька брама, що не має аналогів в Україні. Не менш привабливим для оглядів є Костел Непорочного Зачаття Пресвятої Діви Марії та монастир бернардинів, збудований у ХVІІ столітті. Не можна не згадати про іншу пам’ятку архітектури ХVІІ століття – Спасо-Преображенска церква у класицистичному стилі."
