title = "Таксі у Гонконгу | Таксі України"
description = "Таксі у Гонконгу"
full_description = "Міжнародний аеропорт Гонконгу. У всіх терміналах зручна навігація — туди підеш, до автобуса пройдеш, туди — до електрички, туди — до паркінга, а сюди — до таксі. Ніяких бомбил в зоні прильоту, жодної мерзенного особи, яка хоче вас обібрати. У зоні таксі дві черги — з таксистів, які терпляче чекають посадки в свій автомобіль і пасажирів з валізами (на даній фотографії приклад парковки з піку Вікторії). Черга швидко рухається. Спеціальний людина розподіляє пасажирів по автомобілях, щоб прискорити процес. Також він дає папірець з номером вашого водія, і телефон, за яким можна поскаржитися у випадку будь-яких незручностей. Таксі в Гонконгу розподіляються за категоріями за трьома кольорами, кожен з них позначає певну територію. Будь-яке таксі може довезти пасажирів до Міжнародного аеропорту, а також Гонконзького Діснейленду. Червоні таксі обслуговують територію майже всього Гонконгу, за винятком Tung Chung Road на острові Лантау і всій південній частині острова Лантау. Зелені таксі обслуговують тільки Нові Землі. Сині таксі обслуговують лише острів Лантау. Всі машини 6-місні. Спереду може сидіти два пасажири і водій. Позаду — три пасажири."
