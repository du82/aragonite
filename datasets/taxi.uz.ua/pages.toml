title = "Такси Севастополь | Таксі України"
description = "Такси Севастополь. Лучшее такси в Севастополе. Новый телефонный справочник служб такси в Севастополе."
full_description = "Такси «Такси Метро» +7 (978) 742-1556 +7 (8692) 55-7777 +7 (978) 832-8272 +7 (8692) 55-7172 http://taximetro.com.ua/ Единая служба такси +7 (978) 7000-383 +7 (978) 7000-595 +7 (911) 700-700-8 http://estaxi.com.ua/ Город Севастополь – это, прежде всего, одна из самых удобных гаваней в мире. Кроме этого, во все времена он имел особое стратегическое расположение и особый статус. До недавних пор Севастополь оставался закрытым для туристов городом. Но времена изменились, и это место стало популярным среди путешественников. Службы такси, которых в городе насчитывается около десяти, помогут с комфортом осмотреть город и его достопримечательности. Тарифы на обслуживание от 10 до 15 грн за посадку пассажира, километр стоит от 3 до 5 грн. Площадь города 863,3 км², здесь проживает около полумиллиона населения. Транспорт представлен троллейбусами и маршрутными такси, которые, однако, не покрывают спрос на перевозки и часто бывают переполнены. Потому удобней по Севастополю передвигаться на такси. Большинство памятников и достопримечательностей Севастополя посвящены славной и трагической военной истории города, как например, знаменитая панорама «Оборона Севастополя 1854-1855 годов» или Малахов курган. Здесь также есть несколько архитектурных памятников, в частности культового значения, выполненные в стиле классицизма и барокко. Наиболее привлекательным для туристов является Владимирский собор (усыпальница адмиралов), построенный в начале ХІХ столетия в неовизантийском стиле и ставший местом последнего упокоения выдающихся морских командиров."
