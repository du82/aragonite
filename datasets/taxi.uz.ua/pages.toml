description = "Таксі Бердичів. Всі служби Таксі у Бердичеві."
full_description = "Таксі «1562» 15-62 +38 (068) 11-24-062 +38 (050) 463-10-62 +38 (067) 501-60-62 +38 (067) 986-30-62 +38 (093) 770-29-62 +38 (066) 722-20-62 Таксі «Лотос» +38 (04143) 4-11-11 +38 (04143) 4-10-45 +38 (067) 999-78-73 +38 (066) 210-94-25 +38 (098) 787-85-90 +38 (093) 551-84-81 Таксі «Люкс» +38 (04143) 4-20-20 +38 (04143) 4-77-88 +38 (093) 634-20-20 +38 (098) 984-20-20 Місто Бердичів – це районний центр однойменного району. Українцям це місто відоме як унікальний центр єврейства, що разом з Одесою формує неповторну культуру цього народу. Бердичів має площу в 35,33 км² і близько 80 тисяч мешканців. Розташований на річці Гнилоп’ять, в дуже живописному місці. Довгий час завдяки вдалому географічному положенню був торгово-економічним центром усього регіону. Зараз тут знаходиться велика залізнична вузлова станція. Таксі у місті виконує важливі функції, бо тут немає міського електротранспорту. Всього служб таксі в Бердичеві вісім. Тарифи – 4 грн. за 1 км, посадка пасажира в середньому – 10-15 грн. Справжньою культурною, архітектурною й історичною перлиною міста є легендарний Бердичівський замок, що будувався польськими магнатами в ХVІ столітті, а в ХVІІ був переданий католицькому монашому ордену Босих кармелітів. Тут було збудовано костел на честь Богородиці, в якому донині перебуває чудотворна ікона Божої матері Бердичівської, до якої щорічно відбувається паломництво зі всього світу."
