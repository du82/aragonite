title = "Таксі Коростень | Таксі України"
description = "Таксі Коростень. Всі служби Таксі у Коростені."
full_description = "Таксі «Універсал» +38 (04142) 5-08-08 +38 (04142) 5-07-55 +38 (04142) 5-08-09 +38 (04142) 5-08-08 +38 (093) 690-08-08 +38 (098) 109-08-08 Таксі «Економ» 1555 +38 (04142) 5-05-10 +38 (04142) 5-35-55 +38 (096) 485-58-00 +38 (093) 380-00-77 Древнє місто Коростень має багату історію і цікаве сьогодення. Зараз це одне з найпопулярніших туристичних місць України, а все завдяки унікальному святу – міжнародному Фестивалю Деруна, який відбувається щороку восени і приваблює десятки тисяч гостей. Крім того, Коростень є великим залізничним вузлом. З основних напрямків виробництва – видобуток і обробка граніту, вироблення порцеляни і фаянсу. Площа міста 42,31 км², кількість мешканців – 65 тисяч осіб. Коростень має доволі розвинену транспортну інфраструктуру, не останнє місце в якій відіграють шість служб таксі. Ціни на послуги таксі в Коростені досить помірні, діє стала тарифна сітка в середньому від 15 до 40 грн. Історія Коростеня пов’язана найтісніше з періодом Київської Русі. Саме тут сталася трагічна подія – вбивство місцевим володарем Малом київського князя Ігоря, за якого жорстоко помстилася його дружина, княгиня Ольга, спаливши місто дощенту. В Коростені вшановані всі учасники цієї кровопролитної історії – тут встановлено пам’ятники і Ользі, і князю Малу, який вбив її чоловіка Ігоря через його жадібність. Обидва пам’ятники виконані дуже оригінально. Мал ніби домінує над Ольгою. Вражають розміри скульптури коростенського князя – 7,5 метрів, а з постаментом і скелею, на якому він встановлений, 30 метрів. З ім’ям Ольги пов’язана ще одна видатна пам’ятка Коростеня – прекрасний і величний собор Різдва Христового або Ольгинська церква, збудована в кінці ХХ століття на кошти громади."
