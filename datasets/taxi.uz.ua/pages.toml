description = '''"Чорна п'ятниця" - словосполучення, яке викликає у багатьох асоціації з шаленими знижками, натовпами в магазинах та нескінченними онлайн-акціями . Цей день, що завоював популярність у багатьох країнах світу, не оминув Ізраїль. Але як середземноморська країна, відома своєю унікальною культурною та релігійною спадщиною, адаптувала цей глобальний шопінг-феномен ? Які особливості та традиції формують ізраїльську Чорну п'ятницю?'''
