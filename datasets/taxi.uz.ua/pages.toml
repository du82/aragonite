full_description = "Такси «Важная персона» +38 (04841) 4-85-00 +38 (04841) 4-86-00 +38 (04841) 4-87-00 +38 (096) 768-68-68 Такси «Вояж» +38 (04841) 4-85-00 +38 (04841) 4-86-00 +38 (04841) 4-87-00 +38 (04841) 6-46-00 +38 (04841) 6-48-00 Такси «Желтое» +38 (04841) 6-42-00 +38 (04841) 6-43-00 +38 (067) 511-33-66 +38 (050) 492-51-41 +38 (063) 649-79-26 Такси «Максим» +38 (04841) 6-17-77 +38 (04841) 2-22-16 +38 (04841) 6-17-77 +38 (067) 585-39-55 +38 (063) 645-83-80 +38 (066) 973-95-50 +38 (050) 156-21-99 Такси «Новое» +38 (04841) 2-22-27 +38 (04841) 2-22-55 +38 (096) 331-65-55 +38 (095) 547-99-55 +38 (066) 311-49-07 +38 (063) 676-29-30 Такси «Сити» +38 (04841) 6-36-36 +38 (04841) 4-89-10 +38 (067) 482-20-05 +38 (063) 290-61-29 Такси «Удача» +38 (04841) 7-77-71 +38 (097) 97-255-33 +38 (067) 557-15-71 +38 (063) 160-52-75 +38 (095) 056-30-77 Такси «Фаворит» +38 (04841) 6-44-44 +38 (04841) 6-14-44 +38 (098) 44-26-026 +38 (095) 215-66-22 +38 (093) 545-97-97 Измаил – город в Одесской области, который разросся вокруг некогда неприступной крепости Измаил. Сейчас это важный порт на Дунае и промышленный центр региона, с уклоном на выпуск пищевых продуктов. Также Измаил традиционно входит в популярные туристические маршруты. Служб такси в Измаиле 10. Цена за один километр поездки – 3 грн. Посадка пассажира 25 грн. Площадь города составляет более 50 квадратных километров, а население около 74 тысяч жителей. История Измаила – это история постоянного противостояния внешним врагам. Он находится в стратегически важном месте, оборонительные сооружения здесь появились еще во времена Киевской Руси. Здесь тогда была генуэзская крепость. Собственно крепость Измаил появилась уже в составе Османской империи и хоть была взята несколько раз, но всегда возвращалась туркам. Только в конце 19 века крепость и город были переданы Российской империи и позже вошли в состав Украины. О славной военной истории города можно узнать в краеведческом музее, а также стоит посетить музей А.В. Суворова и диораму «Штурм крепости Измаил», размещенная в старой мечети. Сама крепость была взорвана в конце 19 столетия после поражения России в Крымской войне. Замечательным архитектурным памятником является Свято-Покровский Собор, возле которого находится памятник Суворову, взявшему неприступную крепость в 1790 году."
