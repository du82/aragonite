full_description = "ongoing is short for “ongoing fragmented essay” or in the common parlance a blog, launched in February of 2003. The unifying themes are Truth, Technology, and Business. My beliefs on this trio are summarized by the notes labeled Truth, Biz, and Tech, and (I hope) reflected consistently in every other fragment appearing at ongoing. At many weblogs, the basic unit of structure is a day's discourse. While I have no problem with this, ongoing is composed of entries which ideally should stand more or less alone and are occasionally extreme in length, and thus appear only in summary form on the front page. Anyone who has a platform for daily venting is subject to temptation to daily venting about things that are at best ephemeral; and although this is one of the charms of the universe of weblogs, I'm going to try not to."
