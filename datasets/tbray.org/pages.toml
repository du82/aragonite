["https://www.tbray.org/ongoing/When/202x/2024/11/15/Not-Bluesky"]
title = "ongoing by Tim Bray · Why Not Bluesky"
description = """
As a dangerous and evil man drives people away from Xitter, many stories are talking up Bluesky as the destination forthe diaspora. This piece explains why I kind of like Bluesky but, for the moment, have no intention of moving my onlinesocial life away from the Fediverse."""
full_description = "As a dangerous and evil man drives people away from Xitter, many stories are talking up Bluesky as the destination for the diaspora. This piece explains why I kind of like Bluesky but, for the moment, have no intention of moving my online social life away from the Fediverse. (By “Fediverse” I mean the social network built around the ActivityPub protocol, which for most people means Mastodon.) If we’re gonna judge social-network alternatives, here are three criteria that, for me, really matter: Technology, culture, and money. I don’t think that’s controversial. But this is: Those are in increasing order of importance. At this point in time, I don’t think the technology matters at all, and money matters more than all the others put together. Here’s why. Technology · Mastodon and the rest of the fediverse rely on ActivityPub implementations. Bluesky relies on the AT Protocol, of which so far there’s only one serious implementation. Both of these protocols are good enough. We know this is true because both are actually working at scale, providing good and reliable experiences to large numbers of people. It’s reasonable to worry what happens when you get to billions of users and also about which is more expensive to operate. But speaking as someone who spent decades in software and saw it from the inside at Google and AWS, I say: meh. My profession knows how to make this shit work and work at scale. Neither alternative is going to fail, or to trounce its competition, because of technology. I could write many paragraphs about the competing nice features and problems of the competing platforms, and many people have. But it doesn’t matter that much because they’re both OK. Culture · At the moment, Bluesky seems, generally speaking, to be more fun. The Fediverse is kind of lefty and geeky and queer. The unfortunate Mastodon culture of two years ago (“Ewww, you want us to have better tools and be more popular? Go away!”) seems to have mostly faded out. But the Fediverse doesn’t have much in the way of celebrities shitposting about the meme-du-jour. In fact it’s definitely celebrity-lite."
