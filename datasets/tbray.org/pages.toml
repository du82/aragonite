["https://www.tbray.org/ongoing/When/202x/2025/01/02/Lasagna"]
title = "ongoing by Tim Bray · December 24th Lasagna"
description = """
We had thirteen people at my Mom’s house this last Christmas. One of our traditions is a heroic Lasagna for Christmas Eve, a specialty of a family member. This year we asked them for the recipe and they agreed, but would rather remain uncredited.It’s called “Very Rich Red Sauce and four-Cheese Lasagna”."""
full_description = "We had thirteen people at my Mom’s house this last Christmas. One of our traditions is a heroic Lasagna for Christmas Eve, a specialty of a family member. This year we asked them for the recipe and they agreed, but would rather remain uncredited. It’s called “Very Rich Red Sauce and four-Cheese Lasagna”. I sort of enjoy cooking but would never have the courage to take on a project like this. I can testify that the results are wonderful. Sauce · Key sauce ingredients are red wine & sun-dried tomatoes; lasagna is all about mozza, the provolone adds a certain extra something. Over to the chef: salt - half a tablespoon? more? (tomato sauces tend to need a little more salt than other applications) cayenne - if using, to taste, I find strength is highly variable so hard to say how much, perhaps a couple of teaspoons? 3 small cans or one big can of tomato paste (or tubes, if you get them from an Italian grocery store, which are a rather superior product) It is hard to use too much tomato paste (pro tip for cans of tomato paste: use the can opener to open BOTH the top and bottom of the can, then the paste slides out neatly and you don’t have to fool around trying to spatula the paste out of the can!) about a half bottle of cheap red wine (the grocery store sells cheap cooking wine in demi bottles, though red can be hard to find, one demi bottle is more than enough) (herbs are tough to give measurements for, as they vary enormously in potency with brand, age & storage) Procedure: Sauce · For the mirepoix, the vegetables all need to be FINELY chopped up for sauce consistency. And I mean FINELY chopped-- I have tried both powered and manual food processors, and they do not do a good job, either reducing things to mush, or leaving big chunks-- the idea here is to get everything about the same size (and the garlic later), it gives the sauce some consistency. To give you an idea, a celery spear can be cut into 5-7 strips longwise with the grain, and then the strips chopped as finely as possible across the grain. A big carrot can yield say 6 long flat pieces that can be cut longways into strips, and then the strips cuts finely against the grain to produce little cubes."
