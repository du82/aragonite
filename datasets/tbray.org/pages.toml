["https://www.tbray.org/ongoing/When/202x/2024/12/18/Matching-Dot-in-UTF8"]
title = "ongoing by Tim Bray · QRS: Matching “.” in UTF-8"
description = """
Back on December 13th, Iposted a challenge on Mastodon: In a simple UTF-8 byte-drivenfinite automaton, how many states does it take to match the regular-expression construct “.”, i.e. “any character”?CommenterAnthony Williams responded, getting it almost right I think, but I found his description a little hard to understand. In this piece I’m going to dig into what. actually means, and then how many states you need to match it.

[Update: Lots more on this subject and some of the material below is arguably wrong, but just “arguably”; seeDot-matching Redux.]"""
full_description = "Back on December 13th, I posted a challenge on Mastodon: In a simple UTF-8 byte-driven finite automaton, how many states does it take to match the regular-expression construct “.”, i.e. “any character”? Commenter Anthony Williams responded, getting it almost right I think, but I found his description a little hard to understand. In this piece I’m going to dig into what . actually means, and then how many states you need to match it. [Update: Lots more on this subject and some of the material below is arguably wrong, but just “arguably”; see Dot-matching Redux.] The answer surprised me. Obviously this is of interest only to the faction of people who are interested in automaton wrangling, problematic characters, and the finer points of UTF-8. I expect close attention from all 17 of you! What’s a “Unicode character”? · They’re represented by “code points”, which are numbers in the range 0 … 17×216, which is to say 1,114,112 possible values. It turns out you don’t actually want to match all of them; more on that later. How many states? · Quamina is a “byte-level automaton” which means it’s in a state, it reads a byte, looks up the value of that byte in a map yielding either the next state, or nil, which means no match. Repeat until you match or fail. What bytes are we talking about here? We’re talking about UTF-8 bytes. If you don’t understand UTF-8 the rest of this is going to be difficult. I wrote a short explainer called Characters vs. Bytes twenty-one years ago. I now assume you understand UTF-8 and knew that code points are encoded as sequences of from 1 to 4 bytes. When you match a code point successfully you move to the part of the automaton that’s trying to match the next one; let’s call this condition MATCHED. (From here on, all the numbers are hex, I’ll skip the leading 0x. And all the ranges are inclusive.) In multi-byte characters, all the UTF-8 bytes but the first have bitmasks like 10XX XXXX, so there are six significant bits, thus 26 or 64 distinct possible values ranging from 80-BF."
