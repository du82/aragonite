["https://www.tbray.org/ongoing/misc/Tim"]
title = "ongoing by Tim Bray · Author"
description = """
This web site is calledongoing and is written by me, Tim Bray."""
full_description = "Lots more detail about me is available from any good Web search engine, my Wikipedia entry isn’t bad, and I was on Twitter as @timbray for a long time, but out of disgust with its proprietor’s actions, have moved to Mastodon as @timbray@cosocial.ca. CoSocial is a member-owned Fediverse co-operative, check it out. Affiliations · As the disclaimer on the front page says, the opinions expressed here are my own, usually nobody sees them before they’re published, and neither my employer (when I have one) nor any other party necessarily agree with them. Having said that, I think it’s important that readers know who pays the person who’s writing what they’re reading. I currently have an engagement with the United States government’s Federal Trade Commission, in the capacity of Invited Expert, concerning in-progress litigation between them and Meta Platforms, Inc. Between December of 2014 and April of 2020 I was employed by Amazon.com as a Senior Principal Technologist, then VP/Distinguished Engineer, working in the Vancouver office on a bunch of Amazon Web Services things including Amazon Simple Queue Service (SQS), Amazon Simple Notification Service (SNS), AWS Step Functions, Amazon EventBridge, and Amazon MQ. Contact · If you want to email me, my address has been displayed on the front page of the XML Specification since 1997 and probably will be until I’m in my grave. If you want to communicate with me privately, I’m on Signal and my Mastodon DMs are open. To reach me on Signal, you need to know my phone number, which is on my resume, also pretty easy to find. If you write me, and what you write me is interesting, I may decide to publish it in ongoing. This has two consequences: first of all, if you don’t want what you write published, say so. Second, if I do publish an incoming email, it’s nice to include a web pointer for the person who wrote it. If you don’t provide one, I’ll guess & google around a bit to turn something up; it would be much better if you included one in your email."
