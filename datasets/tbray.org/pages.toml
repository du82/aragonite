["https://www.tbray.org/ongoing/When/202x/2025/02/26/Safari-Cleanup"]
title = "ongoing by Tim Bray · Safari Cleanup"
description = """
Like most Web-heads I spent years living in Chrome, but now feel less comfy there, because Google.I use many browsers but now mydaily driver is Safari. I’m pretty happy with it but there’s ugly stuff hiding in its corners that needsto be cleaned up. This fragment’s mostly about those corners, but I include notes on the bigger browserpicture and a couple of ProTips."""
full_description = "Like most Web-heads I spent years living in Chrome, but now feel less comfy there, because Google. I use many browsers but now my daily driver is Safari. I’m pretty happy with it but there’s ugly stuff hiding in its corners that needs to be cleaned up. This fragment’s mostly about those corners, but I include notes on the bigger browser picture and a couple of ProTips. Many browsers? · If your life is complicated at all you need to use more than one. By way of illustration not recommendation, here’s what I do: Safari is where I spend most of my time. As I write this I have 36 tabs, eight of them pinned. That the pinned number is eight is no accident, it’s because of the Tab Trick, which if you don’t know about, you really need to learn. I use Chrome for business. It’s where I do banking and time-tracking and invoicing. (Much of this relies on Paymo, which is great. It takes seconds to track my time, and like ten minutes to do a super-professional monthly invoice.) I use Firefox when I need to be @coop@cosocial.ca or go anywhere while certain that no Google accounts are logged in. I use Chrome Canary for an organization I work with that has Chrome-dependent stuff that I don’t want to mix up with any of my personal business. Safari, you say? · We inhabit the epoch of Late Capitalism. Which means there’s no reason for me to expect any company to exhibit ethical behavior. Because ethics is for amateurs. So when I go looking for infrastructure that offers privacy protection, I look for a provider whose business model depends at least in part on it. That leaves Safari. Yeah, I know about Cook kissing Trump’s ring, and detest companies who route billions of nominal profits internationally to dodge taxes, and am revolted at the App Store’s merciless rent-extraction from app developers who make Apple products better. But still, I think their privacy story is pretty good, and it makes me happy when their marketing emphasizes it. Because if privacy is on their path to profit, I don’t have to mis-place my faith in any large 21st-century corporation’s “ethical values”."
year_published = 2025
