["https://www.tbray.org/ongoing/misc/Colophon"]
title = "ongoing by Tim Bray · Colophon"
description = "The words and pictures here are generally not AI-generated; the rare exceptions are clearly labeled."
full_description = "The blog is plain HTML+CSS, with a few snippets of handcrafted JavaScript for minor on-screen fine-tuning. This is the best way to deliver on the World Wide Web and should be used unless there’s a reason it can’t be. Details · I write ongoing in an XML dialect that is mostly HTML with a few little extras; I edit with Emacs but any old text editor would do. The essay fragments that make up ongoing are organized by date into a directory tree (visible in the URIs), and each is filed into one or more hierarchical categories; you can navigate around both the date and category apparatus. Since I'm a hopeless geek, I couldn't possibly use any one of the excellent personal-web-site or blogging tools out there; it's all done with a Perl script imaginatively named ong.pl, less than three thousand lines in total, that maintains a MySQL database containing basic metadata for each essay. The Perl script runs over the source tree, figures out what needs to be updated, generates any new notes, and always regenerates the top-level page and RSS/Atom feeds. It's not rocket science, there are less than 3,000 lines of Perl representing weeks not months of effort. Then there’s the comment system, which is under 1,000 lines of Ruby; its design is brutally minimal, involving no databases or framework code. A lot of the work is in handling the pictures, which exist in three sizes. Some are resized by hand but often it’s ImageMagick. I used to add my own drop shadows, but modern CSS takes care of that. The text used to be right-justified but eventually I became convinced that that hurt readability. So now I don’t have to think about hyphenation. One virtue of the setup is that it works exactly the same on my MacOS laptop staging environment and the Debian box where ongoing lives. The blog is entirely served out of static files, but… no wait. If you can possibly serve something like this that way, you should. Linux contains literally engineer-millennia of investment in making the filesystem fast in and of itself, and caching hot files intelligently. Ongoing runs on a very basic VPS and stands up to the load when something I write catches fire and gets fetched a few hundred thousand times. Because static files."
