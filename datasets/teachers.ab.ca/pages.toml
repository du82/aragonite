["https://teachers.ab.ca/news/remember-number"]
title = "Remember this number | Alberta Teachers' Association"
full_description = "Albertans need to remember this number: $11.35 billion. Tomorrow, when the finance minister stands before the legislature and delivers the budget, be aware that anything less than $11.35 billion in total operational dollars for public education means that the province is deliberately and shamefully underfunding 90 per cent of Alberta’s students.This number would amount to an increase in total education spending of $1.55 billion over current levels. Based on estimated enrolments for 2025/26, that equals roughly $9.56 per student per school day.“A properly funded public education system means manageable class sizes, supports for complex needs for our students who require them, and resources that help students learn.”—ATA president Jason SchillingAlberta ranks dead last out of all the provinces for operational spending per student—and it shows. Our classrooms are overcrowded, understaffed and lacking in supports and resources. The province has the means to fix this crisis. Our students deserve better.“Teachers and school administrators are struggling to fill in the cracks. If we do not see a substantial investment in public education, these cracks will only grow larger. We have reached our threshold of doing more with less.”—ATA president Jason SchillingWhile $11.35 billion is a significant investment, it reflects the outcome of years of underfunding despite rising costs and increased student enrolment. Failing to invest now in Alberta’s future would come at a far greater cost to our province.The Alberta Teachers’ Association, as the professional organization of teachers, promotes and advances public education, supports teachers’ professional practice, and serves as the advocate for its 51,000 members. Share Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
