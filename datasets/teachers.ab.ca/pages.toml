["https://teachers.ab.ca/about/human-rights-statement"]
title = "Human rights statement | Alberta Teachers' Association"
full_description = "As an organization that promotes and is committed to respecting human rights and ensuring a safe, secure, and healthy environment for all, the Alberta Teachers’ Association (ATA) works to ensure that all present or participating in ATA programs and events are protected from violence and harassment. All ATA members are therefore expected to promote and defend the fundamental human rights of everyone engaged in ATA programs, activities, or other ATA work. ATA members are expected to treat one another with fairness, respect, and dignity and to uphold the highest standards of professionalism, accountability, competence, and integrity as representatives of the provincial Association as well as their respective locals and subgroups. Furthermore, ATA members are obliged to act to prevent violence and harassment wherever possible and report to the appropriate person in authority any suspected breaches of this policy that come to their attention. Human Rights Statement Printable Postcard Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
