["https://teachers.ab.ca/pay-and-benefits/pension-and-retirement-information"]
title = "Pension and retirement information | Alberta Teachers' Association"
description = "Information for teachers about their pensions"
full_description = "The Alberta Teachers’ Retirement Fund (ATRF) is the administrator and trustee of the Teachers’ Pension Plan. Contact ATRF for more information about the following: Contributions Transferring services from or to Alberta Purchasing service Steps to retirement Pension options And much more! Accessing information about your pension Also check out ATRF’s MyPension online services. Registering for MyPension is easy. Click on the above link and then click on Register. Accept the Agreement. Enter your ATRF ID number (from your Member Statement). Create your MyPension login name and password. Registration is complete! ATRF pension counsellors are available for personal appointments by signing into MyPension and selecting MyAppointment. Pension Q&A I am a full-time teacher thinking of reducing my full-time equivalency (FTE). What effect will this have on my pension? You have two options, which will both reduce your pension: Reducing your assignment. The calculation of pension payments uses annualized salaries. So reducing your assignment will reduce your pensionable service. Requesting a partial leave of absence. You can buy pensionable service for that leave. In this instance, salary is not annualized unless you do buy that service back. Be aware of other factors when considering these options. Contact Teacher Employment Services (TES) for advice. Before you make a change to your FTE, you should also review your pension estimates using both options to see which will have a lesser effect. Contact an ATRF pension counsellor to discuss those effects. How will my pension be impacted if teachers go on strike? If teachers go on strike, Alberta Teachers' Retirement Fund (ATRF) “contributions” are suspended because there is no salary earned. Additionally, the time not worked leads to a loss of “service”. These will impact the overall pension calculation and benefits at retirement. Below are some examples: If you are a teacher and: you will have the 85 index when you commence your pension (retire); each day on strike will impact your pension by approximately $1 per month. you will not have the 85 index when you commence your pension; each day on strike will impact your pension by approximately 70 cents per month. If you are a school administrator and: you will have the 85 index when you commence your pension; each day on strike will impact your pension by approximately $1.15 per month. you will not have the 85 index when you commence your pension; each day on strike will impact your pension by approximately 85 cents per month. What is the YMPE? Teachers’ month contributions to the Teachers’ Pension Plan is integrated with their monthly contribution to the Canada Pension Plan (CPP) which takes the Yearly Maximum Pensionable Earnings (YMPE) into consideration. The YMPE is the maximum earnings covered by the CPP. YMPE changes annually to keep up with inflation. All employees pay CPP contributions on salary up to the YMPE. That amount is also matched by the employer. The CPP benefit (when received) is a calculation that pays 0.6 per cent of the YMPE. The ATRF benefit (when received) is a calculation that pays 1.4 per cent of teacher salaries. When combined with the CPP, both benefits mean that teachers can retire with 70 per cent of their pre-retirement income. What other savings plans are available to ATA members? Capital Estate Planning offers the ATA group Registered Retirement Savings Plan (RRSP) and Tax-Free Savings Account (TFSA) program through payroll deduction. The plans with the group include more than 40 funds from a wide range of financial institutions. Capital Estate Planning can help you find the best investment strategy for yourself. Contact them at www.capitalplanning.ca for more information. Substitute teachers Can substitute teachers participate in the Teachers’ Pension Plan? Day-to-day substitute teaching does not qualify for pension contributions. Pension contributions occur when a teacher is on contract. Substitute service can be purchased at a subsidized rate in 186-day blocks. You can purchase service in those blocks at any time in your teaching career. But any amount of service can be purchased at the time of retirement, also at the subsidized rate. There are specific rules concerning pension funds and gaining access to them before retirement. Teachers are eligible for a pension after five years of service. The funds are then “locked in” and must provide retirement income. Is there an association for retired teachers? The Alberta Retired Teachers’ Association (ARTA) is an association for retired teachers. Teachers with an ATRF pension become regular members. Affiliate memberships are available to retirees from Alberta universities (professors) and other education public sector employees. ARTA has 17 local branches in Alberta and one satellite branch in British Columbia. ARTA provides the following benefits to members: Extended health-care benefits, dental, life insurance and travel insurance Social activities Support with pension and health-care issues Advocacy for public education and the teaching profession Eligibility for other products (such as discounts at various suppliers) Note: If coverage for benefits begins within 60 days of losing your own group coverage, a medical report is not required. Contact ARTA at 780-822-2400 (in Edmonton) or 1-855-212-2400 (anywhere in Canada and the United States). Retirement Q&A Should I retire or should I keep working for a few more years? Retirement is one of the most important decisions of your life. It is important to have the best information before making the choice. Consider attending a Retirement Education Workshop and visiting the Alberta Teachers’ Retirement Fund (ATRF) MyPension Online Portal for your pension estimate and other resources. Planning to retire in the next 10 years? Teacher Employment Services offers retirement information sessions and consultation opportunities for teachers. How will federal benefits contribute to my post-retirement income? Information on the Canada Pension Plan (CPP) and old age security (OAS) can be found at My Service Canada Account (MSCA). You can access estimates of your CPP and OAS benefits, as well as application forms and other resources. How can I know if I will have enough income to support myself in retirement? The Canadian Retirement Income Calculator is a great tool for evaluating your post-retirement income. To use the calculator, you will need to have information about your ATRF pension benefit, CPP statement of contributions, and your other financial resources. The ATRF advised me that I first need to give notice to my employer. How do I do that? Your employer requires at least 30 days’ written notice for you to retire. Check out this sample resignation letter. How and when should I start the retirement process? Here are a couple tools that can help: Retirement Checklist ATRF Steps to Retirement Sample Resignation Letter Be aware that filing for Retiree Benefits with any carrier requires a minimum of 45 days (sometimes up to three months). While the employer requires only 30 days notice, it may be beneficial to provide more notice so as not to experience a gap in benefits coverage. Where can I find help with deciding on my beneficiary to my pension plan when I die? According to legislation, your spouse or partner receives your pension if you die before retirement. A designated beneficiary(ies) receives your pension if your spouse or partner dies before you, or if you do not have a spouse or pension partner. Access more information and the form from ATRF. Where can I find answers to other pension questions (such as contributions, marriage breakdown, pensionable salary, pensionable service, retirement or termination)? Contact an ATRF pension counsellor directly at 1-800-661-9582. How do I access benefits (dental, extended health care, prescriptions and so on) when I retire? Access retiree benefits from the Alberta Retired Teachers’ Association (ARTA) or the Alberta School Employee Benefit Plan (ASEBP). Teachers with Calgary Catholic, Calgary Public, Fort McMurray Catholic and Rocky View may have options through their employers or they may contact ARTA or ASEBP directly. Benefits for all Alberta retired teachers are available through both ARTA and ASEBP.. Contact Teacher Employment Services tes@ata.ab.ca 780-447-9400 (Edmonton area) 1 800 232 7208 (toll free)"
