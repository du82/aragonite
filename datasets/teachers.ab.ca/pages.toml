["https://teachers.ab.ca/professional-development/grants-awards-and-scholarships"]
title = "Grants, awards and scholarships | Alberta Teachers' Association"
description = "The ATA offers grants, awards and scholarships"
full_description = "The ATA offers grants, awards and scholarships for locals, individuals and specialist councils. See below for information on each opportunity. Grants for teachers Alberta Advisory Committee for Educational Studies (AACES) grant Amount: Up to $6,000Recipients: One per application periodDetailsThe ATA is a stakeholder of the Alberta Advisory Committee for Educational Studies (AACES) committee. The University of Lethbridge, University of Calgary and University of Alberta are the other members.The AACES grant is awarded for projects designed to improve teacher preparation or benefit elementary and secondary education. Preference is given to projects investigating educational issues or questions.To be eligible, you must be affiliated with one of the contributing organizations (the ATA, U of L, U of C or U of A) and meet one of the following categories:ATA member (certificated teacher)Faculty of education sessional instructor, member, professor emeritus, adjunct or postdoctoral fellowHow to applyDeadline: By 4:30 pm on October 15 and June 1Selection: The committee chooses the recipients. More information on AACESFor more questions, please contact Molly Garstad at molly.garstad@ata.ab.ca. ATA Doctoral Fellowships in Education Amount: $15,000Annual recipients: Up to two annuallyDetailsEach year, up to two doctoral fellowships are awarded to members who are entering or enrolled in their first year of full-time study towards a PhD in Education or EdD at recognized public universities in Alberta or Canada.Applicants are evaluated on exemplary K-12 teaching practice, contribution to the ATA and public education in Alberta, academic achievement and the potential impact of their doctoral research.To be eligible, you must:hold an Alberta permanent professional teaching certificate;have completed at least 5 years (or 700 days equivalent) of successful K-12 teaching in Alberta while holding the highest level of ATA membership possible (ie, active or associate membership);at the time of application, be a member in good standing at the highest level of ATA membership possible; be entering or in your first year of full-time study in a doctoral program in education offered by a recognized public university in Alberta, or in Canada (if your doctoral program is offered in French or your program of study is not available at an Alberta-based university);not have previously received an Association doctoral fellowship; andnot have applied concurrently for the Nadene M Thomas Graduate Research Bursary or the belairdirect Scholarship.Fellowships are paid in two equal instalments in September and January once proof of continued full-time registration is received. Recipients must provide the ATA with a printed bound copy and a digital copy of their completed dissertation.How to applyDeadline: 5 pm on February 28, annually.Selection: A selection committee will review all eligible applications in mid-March and forward recommendations to the April meeting of Provincial Executive Council. Applicants will hear whether they were successful by the end of April.Application form: Please ensure that you carefully read and complete the application form below. Incomplete application packages, those received after the deadline, and those that contain additional unsolicited documents (such as resumes and extra letters of reference) will be rejected. The 2024-25 Application Booklet ATA Educational Trust The ATA Educational Trust provides bursaries and grants to help teachers pay for professional development. See more information on the Educational Trust Belairdirect Scholarship Amount: $2,500Recipients: Up to one annuallyDetailsEach year, Belairdirect sponsors one scholarship to support a member so they can pursue post-secondary coursework in business education or the use of computer technology in education. Applicants are evaluated on exemplary K-12 teaching practice, contribution to the ATA and public education in Alberta and the potential impact of their course work on their professional practice and the professional practice of others.To be eligible, you must:hold an Alberta permanent professional teaching certificate;have completed at least 5 years (or 700 days equivalent) of successful K-12 teaching in Alberta while holding the highest level of ATA membership possible (ie, active or associate membership);at the time of application, be a member in good standing at the highest level of ATA membership possible;be registered in or planning to register for a single course or a course that is part of a certificate, diploma or degree program offered by a recognized public university, college or technical institute in Canada that focuses on business education and/or the use of computer technology in education;not have previously received the Belairdirect Scholarship or John Mazurek—Morgex Insurance Scholarship; andnot have applied concurrently for the Nadene M Thomas Graduate Research Bursary or the ATA Doctoral Fellowships in Education.Along with the applicability of the study area, the Association will consider your contribution to the ATA and to public education, as well as your exemplary teaching practice in the K–12 public education system in Alberta. The scholarship will be paid in full once proof of registration is received.Note: Belairdirect also sponsors the Belairdirect Insurance Centennial Fund for Teacher Development, administered by the ATA Educational TrustHow to applyDeadline: 5 pm on February 28, annually.Selection: A selection committee will review all eligible applications in mid-March and will forward its recommendations to the April meeting of Provincial Executive Council. Applicants will hear whether they were successful by the end of April.Application form: Please ensure that you carefully read and complete the application form below. Incomplete application packages, those received after the deadline, and those that contain additional unsolicited documents (such as resumes and extra letters of reference) will be rejected. The 2024-25 Application Booklet Educational Research Award Amount: $5,000 Recipients: One Details The Educational Research Award recognizes a faculty of education member or sessional lecturer at an Alberta university or university college who has undertaken high-quality research on classroom teaching and learning. Along with involving Alberta teachers or students, the research must relate directly to school and classroom practice; focus on school teaching and/or learning; be current (either ongoing or completed within the last two years); address critical issues; be applicable to the Alberta context; provide practical benefit to teachers to improve their professional practice; and demonstrate high quality with respect to purpose, methodology and originality. How to apply Deadline: May 15 Selection: A panel of four Association representatives and one retired faculty of education professor will review the applications and select a recipient. Previous award recipients 2023 Robin Gibb. “Building Adolescent Executive Functioning Through a Play-Based Curriculum.” University of Lethbridge. 2023 Rahat Zaidi. “Optimizing Parent-Teacher Collaboration in Refugee Children’s Learning.” University of Calgary. 2022 Cory Wright-Maley. “Glossed Over and Missing: Alberta Preservice Teachers Learn About Slavery in Canada, Many for the First Time.” St Mary’s University. 2021 Cathryn van Kessel. “Teacher Education, Diversity, and Worldview Threat.” University of Alberta Educational Research Award application form Nadene M Thomas Graduate Research Bursary Amount: $5,000Recipients: Up to one annuallyDetailsThe research bursary is provided to a member in a graduate program in education offered by a recognized public university in Canada. Research must focus on contemporary issues impacting professional practice or public education, and/or innovative approaches to teaching or school leadership.Applicants are evaluated on exemplary K-12 teaching practice, contribution to the ATA and public education in Alberta, academic achievement and the potential impact of their graduate research.To be eligible, you must:hold an Alberta permanent professional teaching certificate;have completed at least 5 years (or 700 days equivalent) of successful K-12 teaching in Alberta while holding the highest level of ATA membership possible (ie, active or associate membership);at the time of application, be a member in good standing at the highest level of ATA membership possible;be registered in any year of a graduate certificate, diploma or master’s degree program in education offered by a recognized public university in Canada;intend to complete or are currently completing a culminating research project (capstone, thesis or other culminating activity worth at least 3.0 credit hours) that focuses on contemporary issues impacting professional practice or public education, or innovative approaches to teaching or school leadership;not have previously received the Nadene M Thomas Graduate Research Bursary; andnot have applied concurrently for the ATA Doctoral Fellowship or the belairdirect Scholarship.The bursary is granted in two instalments: first, on receipt of the award and second, when the ATA receives the completed research (digital copy and printed, bound copy).How to applyDeadline: 5 pm on February 28, annuallySelection: A selection committee will review all eligible applications in mid-March and will forward its recommendations to the April meeting of Provincial Executive Council. Applicants will hear whether they were successful by the end of April.Application form: Please ensure that you carefully read and complete the application form below. Incomplete application packages, those received after the deadline, and those that contain additional unsolicited documents (such as resumes and extra letters of reference) will be rejected. The 2024-25 Application Booklet Grants for locals Diversity, Equity and Human Rights (DEHR) grants Amount: Up to $2,000Recipients:DetailsThe Diversity, Equity and Human Rights (DEHR) Committee provides grants for special projects that promote the following principles:Diversity: Every person should be accepted and respected. Our differences make us stronger.Equity: Everyone should be treated fairly and given the chance to do their best. Equity means being aware of how certain groups or individuals can be treated unfairly because of their privilege (the power or position they hold in society).Human rights: Everyone has the same rights to live in a society that is fair, peaceful and free, no matter your ethnicity, religion, skin colour, gender, sexual orientation, physical abilities, age, marital or family status, your social class or language background.If your application is approved, half of the grant is paid in the spring or fall. The rest is paid after the accounting and evaluation report is submitted.See a sample of past grant proposalsCriteria for Grant ProjectsProjects must focus on education or communication and should advance knowledge, develop skills and foster inclusive behaviour among students, teachers and the community. Some suggestions for project themes include:Antiracism educationGender equityIntercultural educationPoverty issues Violence preventionDiscrimination based on political beliefs, marital status, parental status, race, level of education, physical ability, mental health, occupation, income, language, sexual orientation, gender identity, physical characteristics, mental ability, ancestry, level of education, age/generation, religious beliefs, etc. Projects must reflect the principles of diversity, equity and human rights.Projects must be sustainable; which is to say that they should be designed to have a lasting impact on students, teachers, and the community.Project proposals that will not be considered includeIndigenous Education Initiatives (Please apply to the Indigenous Education Grant Program) one-time events that are not linked to a broader school or local action plan;materials or services ordinarily purchased with school or local funds (books, salaries, substitute costs, capital equipment and technology);projects that support fundraising events;funding for individual teacher professional development; and,funding for locally developed courses.Application GuidelinesProjects will be approved for funding by the Diversity, Equity and Human Rights Committee based on how well they meet the purpose and criteria outlined above.Grant applications must include a description of the project, goal(s), evaluation procedures, timeline and budget. Include any others sources of funding. The project must occur during the upcoming school year.One-half of the grant is will be paid in the spring or fall following the approval of the grant application.A budget report including paid receipts for all funds and an evaluation report is required on completion of the project, after which the balance of the grant will be paid. Criteria for the final report will be shared with successful applicants. Final reports are due by April 30 each year.Only one application will be considered each year. In addition to applications submitted by schools in a local’s corresponding school division, each local may submit one application per year for a project organized by the local or its committees.How to applyDeadline: By 5 pm on March 30Selection: Based on how well applicants meet the outlined criteria DEHR grant application form (ce formulaire est également disponible en français) Indigenous Education Initiatives Grants Amount: Up to $2,000DetailsThe Indigenous Education Initiatives Grant Program supports innovative projects that foster community connections and contribute to fulfilling the Truth and Reconciliation Commission of Canada's Calls to Action, the United Nations Declaration on the Rights of Indigenous Peoples, and the National Inquiry into Missing and Murdered Indigenous Women and Girls' Calls for Justice.If your application is approved, half of the grant will be paid in the spring or late fall. The remaining half will be disbursed upon submission and approval of the project report, along with all receipts accounting for the full grant amount.Criteria for Grant Projects1. Focus on Indigenous Education:Initiatives must emphasize the development and integration of Indigenous education within the school community. These initiatives can vary and may include, but are not limited to:Land-based learning Indigenizing student learning spaces Indigenous Language RevitalizationMentorship ProgramIndigenous Artist in Residence program Relationship building with First Nations, Métis and Inuit Elders, Knowledge Keepers, Communities and Organizations 2. Alignment with the Truth and Reconciliation Commission (TRC) and United Nations Declaration on the Rights of Indigenous Peoples UNDRIP:Projects must align with the Truth and Reconciliation Commission (TRC) Calls to Action affirming the objectives and principles of the United Nations Declaration on t"
