full_description = "Schools and classrooms are a reflection of society and, in an inclusive learning system, diversity is viewed as an asset. Inclusive education acknowledges the common threads that bind us together. Each learner is its own thread, woven in concert with their peers, forming the communities of our classrooms. Collaborative Professional Learning Activities Establishing Inclusive Learning Environments (PDF) Establishing Inclusive Learning Environments (PPT) Resources Building Professional Capacity Inclusion Framework & Research Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
