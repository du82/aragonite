["https://teachers.ab.ca/news/budget-2025-fails-public-education"]
title = "Budget 2025 fails public education | Alberta Teachers' Association"
full_description = "Budget 2025 continues to underfund public educationAlberta Teachers’ Association President Jason Schilling has issued the following statement regarding the release of Budget 2025:“Budget 2025 fails to meet the funding required to address the needs we have repeatedly outlined as plaguing Alberta’s public education system. Instead of a desperately needed $11.35 billion investment in the future of Alberta, this government has shortchanged Alberta’s students by $910 million (8 per cent).Alberta’s public schools deserve better. Less than $10 per student per school day would have begun to address the unmet needs in our classrooms.Even more unacceptable is the increased funding of private schools. Public dollars belong in public classrooms.”More insight will be provided on Tuesday, March 4, once we are able to take a closer look at what this means for Alberta’s public education system. Interviews providing an initial reaction to Budget 2025 prior to March 4 will be available upon request by contacting Heather Grant.The Alberta Teachers’ Association, as the professional organization of teachers, promotes and advances public education, supports teachers’ professional practice and serves as the advocate for its 51,000 members. Share Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone