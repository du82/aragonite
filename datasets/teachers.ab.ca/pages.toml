full_description = "Visit the ATA Library Find resources and guides for professional development. Browse the Library FrançaisThe ATA Library is here to connect you to the information you need for your professional practice. We have a large collection of professional development materials for teachers in both French and English.Borrowing is restricted to ATA members, associate members, life members, student members and ATA staff. All materials are loaned by mail (with return postage prepaid) for a period of one month.Before you use the ATA library, you need to have an online account—set up your account todayHours of OperationSeptember to June: 0800-1700July and August: 0800-1630Suggest a TitleWe love hearing your suggestions! If you find a new title or a new topic that isn’t in our collection, please send your suggestions to library@ata.ab.ca. Provide as much information as you can, including author, title, publisher, date of publication and ISBN. Contact ATA Library library@ata.ab.ca Phone: 587-686-7356 Toll Free: 1-800-232-7208 Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
