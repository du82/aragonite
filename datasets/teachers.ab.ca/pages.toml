["https://teachers.ab.ca/news/response-ministerial-order"]
title = "Response to ministerial order | Alberta Teachers' Association"
full_description = "Alberta Teachers’ Association (ATA) president Jason Schilling has issued the following statement with regard to the province revising its ministerial orders exempting select students from in-person learning during the current Canadian Union of Public Employees (CUPE) strikes:“Changing some words on paper will not address the real problems being faced by students, particularly those who are vulnerable or who have complex learning needs. Instead of leading, the province has downloaded the responsibility onto school boards and, ultimately, school administrators to fix the resulting mess.Giving school boards the ability to engage in meaningful bargaining with their employees is the necessary first step to resolving this conflict and restoring the learning supports that all students deserve and benefit from.”The Alberta Teachers’ Association, as the professional organization of teachers, promotes and advances public education, supports teachers’ professional practice, and serves as the advocate for its 51,000 members. Share Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
