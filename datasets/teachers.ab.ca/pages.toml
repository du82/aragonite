["https://teachers.ab.ca/news/reaction-injunction-granted-during-cupe-strike"]
title = "Reaction to injunction granted during CUPE strike | Alberta Teachers' Association"
full_description = "Alberta Teachers’ Association (ATA) president Jason Schilling has issued the following statement with regard to the injunction granted to suspend the ministerial order exempting select students from in-person learning during the current Canadian Union of Public Employees (CUPE) 3550 strike:“We’re pleased that the Court, in issuing this injunction, has recognized the serious and irreparable harm caused by denying students with complex needs access to in-person learning during the ongoing CUPE strike affecting Edmonton Public Schools. It is our hope that this injunction will cause the government to reconsider the direction it has given all school boards as they negotiate with their employees.Students, parents and teachers expect the government to facilitate a negotiated agreement that will allow CUPE staff who provide supports in Alberta classrooms to return to work.”The Alberta Teachers’ Association, as the professional organization of teachers, promotes and advances public education, supports teachers’ professional practice, and serves as the advocate for its 51,000 members. Share Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
