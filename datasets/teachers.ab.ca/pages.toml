["https://teachers.ab.ca/advocacy/advocacy-students"]
title = "Advocacy for students | Alberta Teachers' Association"
description = "A list of teacher advocacy initiatives to support student learning."
full_description = "Standing up for our students Teachers care about their students. Much of teachers’ work involves setting the conditions for successful student achievement. Teachers know the conditions that support student success: Smaller class sizes Time with teachers Time with peers Full funding of student supports Safe and inclusive spaces at school Teacher and parent cooperation Access to technology and learning resources A strong curriculum Teachers advocate for these conditions at every opportunity, learn more about teachers’ advocacy for students. Learn more Crowded and Complex Classrooms Optimal learning happens when students and teachers have reasonable class sizes and supports are available to assist students with special learning needs. Diversity, Equity and Human Rights (DEHR) DEHR promotes diversity, equity and human rights in Alberta schools through workshops and resources for teachers. Inclusive Education Inclusive Education instills students with a sense of belonging to help them achieve their full potential. Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
