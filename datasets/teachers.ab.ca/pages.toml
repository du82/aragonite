["https://teachers.ab.ca/pay-and-benefits/employment-insurance-ei-and-teachers"]
title = "Employment insurance (EI) and teachers | Alberta Teachers' Association"
description = "Teachers are eligible for regular and special EI benefits"
full_description = "Federal employment insurance Specific information about employment insurance (EI) for teachers is available from the Government of Canada Read more Regular benefits Regular benefits are available to you if you have lost your job through no fault of your own, are able to work and are temporarily unable to find work. You are eligible to apply for regular benefits if you have paid EI premiums, have been without work for at least seven consecutive days and have worked a specified number of hours based on the unemployment rate in your area. If you are approved for regular benefits, you must “actively seek employment” throughout a claim and keep records of your job search for EI audit purposes. Special benefits Special benefits are available in these situations: Maternity leave Parental/adoption leave Sickness benefits Compassionate care benefits Special benefit periods sometimes happen during regular benefit periods. To determine if you qualify for combined benefits, contact Service Canada at 1-800-206-7218. Generally, your EI benefits depend on your contract status. Are you a substitute teacher, a part-time teacher or a teacher who works only a portion of a full year? Keep a record of your weekly hours in case you need it for EI. For more information, refer to this article from the ATA News. Related Not a full-time continuous teacher? Substitute, part-time or teachers working portions the year need to keep a record of weekly hours for EI. The ATA News recently wrote on this. Contact Teacher Employment Services 780-447-9400 (Edmonton area) 1-800-232-7208 (toll free in Alberta) tes@ata.ab.ca Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
