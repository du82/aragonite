["https://teachers.ab.ca/professional-development/teacher-and-school-leader-exchanges"]
title = "Teacher and school leader exchanges | Alberta Teachers' Association"
description = "Education exchange programs offered to Alberta teachers."
full_description = "2024-25 Education Exchange Program information sessions Interested in participating in education exchanges? Attend a virtual information session. Sign up Take your vocation to a new location. Get out of your comfort zone and see how your peers in Canada and around the globe engage with teaching and school leadership.Educator Exchange Programs (EEP) lets Alberta teachers and school leaders experience a different school system through a short-term (in-person or virtual) or a year-long (in-person) exchange.The ATA administers EEP under existing exchange agreements between Alberta Education and its partners in Canada and abroad.Program flyer Short-term exchange You can choose an in-person or a virtual (e-exchange) short-term exchange. In-person exchange How does the short-term in-person exchange work?The short-term in-person exchange is a one- to two-week experience.First, you are billeted by your exchange counterpart and go with them to their school for one to two weeks. You then host your counterpart for one to two weeks so they can experience Alberta’s education system.Administrators and teachers arrange cultural visits to correspond with the interests of both parties.Matches can be with Spain, Germany, Australia, Iceland, and may be possible in other regions of Canada or within Alberta.When does the short-term in-person exchange happen?A short-term in-person exchange typically occurs over a break or holiday that staggers with the host country’s school schedule.How much does the short-term in-person exchange cost?You cover your airfare and associated travel costs.What does EEP provide?EEP secures the exchange and provides program support throughout the exchange process.ApplyDownload the short-term in-person exchange application form.Téléchargez le formulaire de candidature à un échange en personne de courte durée.Note: Download the application form before you fill it out. E-exchange What are the benefits of an e-exchange?Collaborating with teachers or school leaders in another education system is a great way to promote cultural understanding and reflect on and enhance your teaching practice. An e-exchange offers a unique opportunity for you to learn and to compare and contrast education systems without having to travel.How does the e-exchange work?The e-exchange is a one-on-one virtual exchange that pairs you with another teacher or school leader with similar educational interests.Matches can be within the province, within Canada or with our international partners in Spain. Matches may also be available with Germany, Australia, Mexico, or with one of Alberta's accredited international schools.Projects or other activities take place over four to six weeks.A project could involve student wellness, global citizenship, technology and innovation in the classroom, instructional leadership, women in leadership, rural and remote schools, immigration, second language learning, STEM, inclusion or another topic.You and your exchange partner engage in discussions and video chats outside of class hours, much like virtual pen pals. The frequency is up to you. We recommend connecting a couple times per week.When does the e-exchange happen?The e-exchange happens at any time during the school year, with the exact timing to be determined based on school calendars.How much does the e-exchange cost?The e-exchange is free.What does EEP provide?EEP provides program support throughout the exchange process.ApplyDownload the short-term e-exchange handbook (french)Download the short-term e-exchange application form Téléchargez le formulaire de candidatureDownload the short-term e-exchange application form for teachers and school leaders working at an Alberta Accredited International SchoolNote: Download the application form before you fill it out. Year-long exchange The year-long teacher exchange program is currently paused. In-person exchange (paused) How does the year-long exchange work? Unlike a short-term exchange, in the year-long exchange, you don’t job-shadow your exchange partner. Rather, you switch places at the same time. You teach in their school and live in their accommodations while they live in your accommodations and teach in your school. You remain an employee of your Alberta school district and retain your benefits and pensionable service. Essentially, you are a long-distance commuter while on exchange! When and where does the year-long exchange take place? The year-long exchange takes place over one year (from January to the next January) in Australia. What do I provide? You pay for the cost of your travel (including visa and teacher certification). You provide accommodations in Alberta for your counterpart. What does EEP provide? EEP finds a match for you and provides guidance before and after the exchange. Am I eligible? You must be a full-time continuous contract teacher with a permanent teaching certificate and have the approval of your superintendent. Some districts have their own requirements (such as three to five years of teaching experience). How do I apply for the year-long exchange? If you are a teacher with Calgary Public, Calgary Catholic, Edmonton Public or Edmonton Catholic, submit your application to your district’s human resources department. Check with your district for the exact deadline (usually the first week of December). If you are a teacher with another school division, send the form directly to EEP. The ATA must receive the approved application from you or your district by the second week of December. It is your responsibility to ensure that the form is received by the ATA. Eligibility You mustbe a Canadian citizen,have a permanent teaching certificate,have district approval andpossess at least five years of teaching experience.Please note that it may be possible to arrange alternate exchange dates, depending on the applicants’ breaks.Location/RegionSchedule (All dates are inclusive of the first and last days)AlbertaVaries, please consult school division website.Alberta AccreditedInternational SchoolsVaries by school, but virtual exchange dates can be flexible.AustraliaQueenslandTerm 1 – January 28 to April 4, 2025School holidays – April 5 to April 21, 2025 (includes Easter)Term 2 – April 22 to June 27, 2025School holidays – June 28 to July 13, 2025Term 3 – July 14 to September 19, 2025School holidays – September 20 to October 6, 2025Term 4 – October 7 to December 12, 2025School holidays – December 13, 2025 to late January 2026,TBA (typically third or fourth week of January)SouthTerm 1 – January 28 to April 11, 2025School holidays – April 12 to April 27, 2025Term 2 – April 28 to July 4, 2025School holidays – July 5 to July 20, 2025Term 3 – July 21 to September 26, 2025School holidays – September 27 to October 12, 2025Term 4 – October 13 to December 12, 2025School holidays – December 13, 2025 to late JanuaryGermanyEaster holidays: April 7 to April 21, 2025Summer holidays: July 7 to August 15, 2025IcelandEaster holidays: April 12 to April 21, 2025SpainCastille y LeónEaster holidays: April 12 to April 22, 2025CataloniaEaster holidays: April 12 to April 22, 2025School Holiday Dates for Partnering Countries/Regions In your application, you should demonstrate flexibility, adaptability, intercultural skills and a strong capacity to act as an ambassador for your school authority and the exchange program.Communication skills, resourcefulness, initiative and community involvement are all desirable attributes.You do not need to be fluent in the destination country language, as the overseas teacher will be fluent in English.Read: Procedures and Guidelines for Educator Exchange Programs Resources ATA Research Benefits of International Teacher and Student Exchanges for Participant Outcomes, School Communities and K–12 Education Systems: A Review of the Literature Handbook for Short-Term E-Exchanges Your Guide for Navigating an E-Exchange Handbook for In-Person Short-Term Exchanges Your Guide for Navigating an E-Exchange Téléchargez le guide à l’intention des participants à un échange virtuel de courte durée Téléchargez le guide à l’intention des participants à un échange en personne de courte durée Contact Educator Exchange Programs exchanges@ata.ab.ca 780-447-9400 1-800-232-7208"
