["https://teachers.ab.ca/advocacy/political-involvement"]
title = "Political involvement | Alberta Teachers' Association"
description = "A political engagement guide for teachers"
full_description = "The ATA advocates for issues of importance to teachers and students. This includes political advocacy, but the ATA itself is nonpartisan.Teachers have varied political views. The ATA encourages teachers to advocate on issues, including as part of the political process. Teachers are not required to be nonpartisan.Here are five ideas for getting involved:1. Join a Political Party of Your ChoiceThink about joining a political party if you want to help form policy between elections.2. Volunteer for Your Constituency AssociationParties have constituency associations in every Alberta riding. Constituency associations recruit members. They also select candidates and run elections. Constituency associations answer to the people they represent.3. DonateYou can donate to the party of your choice.4. Volunteer at Election TimeCandidates running for office need volunteers to help get them elected. Working on a campaign can help give you insight into local politics and expand your personal network.5. Participate in Your CommunityVolunteering with charities, sitting on local boards and joining service organizations can all be forms of political activity, without getting involved in partisan work.Teachers’ opinions matter. Get involved!For more information, see Political Engagement: Take the Initiative—Individually and Collectively Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media links Facebook Youtube Twitter Instagram The Alberta Teachers’ Association respectfully acknowledges that we are located on Treaty 4, 6, 7, 8 and 10 territories—the travelling route, gathering place and meeting grounds for Indigenous Peoples, whose histories, languages, cultures and traditions continue to influence our vibrant community. We are grateful for the traditional Knowledge Keepers and Elders who are still with us today and those who have gone before us. We recognize the land as an act of reconciliation and gratitude to those whose territory we reside on or are visiting."
