full_description = "Teachers in Alberta can expect to have the following coverages through their employers and benefit providers: Life insurance Accidental death and dismemberment Extended disability benefits Dental care Extended health care Vision care Early retiree benefits The Alberta School Employee Benefit Plan (ASEBP) covers most teachers in Alberta. A board of 10 trustees governs ASEBP. The Association and participating school boards each appoint five trustees. Retiring? Teachers covered under ASEBP, or those who don’t have ASEBP benefits but work for an eligible school board, who wish to retire early can choose among the following benefits providers: Alberta School Employee Benefit Plan (ASEBP) ASEBP provides retirement benefits through their MyRetiree Plan. Find more information at: www.asebp.ca1-877-431-4786 (toll free) The Alberta Retired Teachers’ Association (ARTA) The Alberta Retired Teachers’ Association (ARTA) also provides a benefits package. For details, contact ARTA at: www.arta.net780-822-2400 (Edmonton area)1-855-212-2400 (toll free) Coverage through another carrier (such as Blue Cross) may have far-reaching and negative consequences. Choosing a retirement benefits provider is an important decision. Seek advice from your financial planner before choosing. Teachers who do not have ASEBP coverage may still qualify for ASEBP retirement benefits and can contact ASEBP or ARTA to inquire about retiree benefits. Special plans and rates for ATA members Alberta Motor AssociationCapital Estate PlanningBelair directCellular servicesHotel special ratesPark and RideTELUS World of Science For details on these special rates and plans please visit: ATA - Special rates for ATA members Edmonton 11010 142 Street NW Edmonton, Alberta T5N 2R1 Phone: 780-447-9400 Toll Free: 1-800-232-7208 Calgary 350, 6815 8 Street NE Calgary, Alberta T2E 7H7 Phone: 403-265-2672 Toll Free: 1-800-332-1280 Footer Contact Human rights statement Privacy policy Terms of use Social media l