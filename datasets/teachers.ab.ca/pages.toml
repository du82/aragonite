["https://teachers.ab.ca/advocacy/volunteer"]
title = "Volunteer | Alberta Teachers' Association"
description = "Learn about volunteer opportunities at the Association"
full_description = "Teachers can prepare to do field work in one of three volunteer groups:Association Instructors and Association Administrator Instructors: Facilitate ATA PD workshops to professional learning related to TQS and LQS competencies.Indigenous Education Professional Development Facilitators: Facilitate ATA Indigenous Education workshops to support professional learning related to TQS and LQS competencies. Provide expertise on Indigenous education and cultural protocols to ATA subgroups and locals.Professional Development Facilitators: Help local PD chairs and committees to develop and enhance local PD programs.Interested? Fill in the application to join the Association Professional Development Corps. ATA standing committees Opportunities for members to serve on ATA committees or as ATA representatives to external committees appear below. Most committee vacancies are advertised in the early spring, though occasional vacancies are posted throughout the year.The application deadline depends on the competition, and will be noted on the individual posting.Current opportunities Applications close April 7, 2025ATA Educational Trust Board of Trustees Alberta Advisory Committee for Educational Studies Benefits, Insurance and Pension Committee Communications, Advocacy and Public Education Committee CTF-FCE Advisory CommitteeEnglish | Français Curriculum Committee Diversity, Equity and Human Rights Committee Political Engagement Committee Returning Officers Strategic Planning Group Teacher Education and Certification Committee Teacher Qualifications Committee Women in Leadership CommitteeMembers who are appointed to a committee will have their release time and expenses covered to enable meeting attendance. Fill out the application form to start your application.Additional information about the committee application process is provided in this FAQ. Area Field Experiences Committees (AFECs) AFECs work with faculties of education on student practicums. The ATA has four AFECs: Calgary Area Edmonton Area Campus Saint-Jean Lethbridge Area Bargaining Advisory Committee (BAC) This committee works with the Central Table Bargaining Committee (CTBC). BAC members collect data and create lists of bargaining items. The Bargaining Advisory Committee informs ATA members about bargaining results. Benefits, Insurance and Pension Committee (BIPC) The BIPC works with the Alberta School Employee Benefits Plan, Johnson Insurance, Capital Estate Planning, the Alberta Retired Teachers’ Association and the Alberta Teachers’ Retirement Fund to study, monitor and advise Provincial Executive Council on issues of note. Canadian Teachers’ Federation (CTF) Committee The CTF is a national organization of all provincial teachers’ organizations. CTF Committee members work on issues that affect teachers nationwide. Central Table Bargaining Committee (CTBC) Members represent the Association’s central bargaining position. This committee works under two laws: Public Education Collective Bargaining Act Labour Relations Code This committee negotiates central and local bargaining lists. It also finalizes the central table agreement. Communications, Advocacy and Public Education Committee (CAPEC) This committee advocates for public education. CAPEC highlights the essential role of teachers and plans advocacy campaigns and events. Curriculum Committee This committee works with Alberta Education’s program, curriculum and assessment advisory committees. Members of this committee work with external stakeholders and partners. Diversity, Equity and Human Rights (DEHR) Committee DEHR Committee members work to highlight diversity, equity and human rights issues in education. The committee’s initiatives work to address gender, race, sexual orientation and other forms of discrimination. Finance Committee This committee keeps track of the Association’s money. Committee members produce the budget, and ATA members approve that budget at the Annual Representative Assembly (ARA). The committee also advises the Association on investments and fees. Indigenous Education Committee This advisory committee interacts with First Nations, Métis and Inuit community leaders. Other external stakeholders and partners include Alberta Education, Indigenous Advisory Circle and Rupertsland Institute. Political Engagement Committee The Association is nonpartisan but does engage with the Government of Alberta. Committee members advise on political issues and and help develop strategies. The committee also coordinates political activities at the local and provincial levels. Resolutions Committee This committee prepares all resolutions debated at the Annual Representative Assembly (ARA). Resolutions come forward from Provincial Executive Council (PEC), locals and specialist councils. After ARA, this committee advises on the disposition of approved resolutions. Approved resolutions become Association policy. School Leaders Issues and Concerns Committee This committee advises on issues affecting school leaders and coordinates services to school leaders. Members of this committee includes members of the Council for School Leadership (CSL). Strategic Planning Group (SPG) SPG members advise Association leaders on emerging issues of concern to the Association. SPG helps the Association remain responsive to current events and trends in education. Substitute Teachers Committee This committee evaluates substitute teachers’ unique concerns and plans the annual Substitute Teachers’ Conference. Table Officers Committee (TOC) The TOC consists of members of Provincial Executive Council (PEC) and senior ATA staff. Matters decided by TOC include Association administration, PEC agenda, communication of Association policy to the Government of Alberta, communication with education stakeholders and emergent situations. Teacher Education and Certification Committee (TECC) This committee evaluates teacher education and certification. It also administers the Association’s fellowship and scholarship program. Women in Leadership Committee This committee promotes women’s participation in professional leadership. Committee members also advise on efforts to advance women’s representation in educational leadership. ATA Members Committee Appointments The Association appoints members to various joint stakeholder committees. ATA Educational Trust, Board of Trustees The Trust is a charitable organization that funds classroom projects and educational research. The Association appoints four teachers to this board. Other members are a representative from the Alberta School Councils’ Association (ASCA), a representative from the Alberta Retired Teachers’ Association (ARTA) and a member of Association executive staff. Membership Eligibility Board Board members establish ATA membership eligibility principles that govern the eligibility of individuals for membership in the Association. The Association names three teachers to this board. These teachers serve with faculty of education representatives. Membership Eligibility Committee This committee hears appeals from teachers denied membership in the Association. The Association names one teacher to this committee. Other members include a member of Association executive staff, a faculty of education representative and the ATA staff manager of the Teacher Qualifications Service. Teacher Salary Qualifications Board (TSQB) The TSQB administers the Teacher Qualifications Service evaluation principles. These principles govern evaluation of years of teacher education for salary purposes. The ATA names one teacher to this board. Other members include two representatives from the Alberta School Boards Association (ASBA); two representatives from Alberta Education; and one representative each from the University of Alberta, the University of Calgary and the University of Lethbridge. Teacher Qualifications Committee (TQC) Teachers may appeal their TQS evaluation to this committee. The Association names two teachers to the TQC. Other members include a member of Association executive staff; the ATA manager of TQS; one representative from Alberta Education; and one representative each from the University of Alberta, the University of Calgary and the University of Lethbridge. Resources Resources for members of Association committee members and ATA representatives Read more"
