title = "Teamup Ticker"
description = """
🎉 Some exciting new features for February, important improvements, and many small fixes and updates. 
New: Tiles view 
Teamup's 12th calendar view provides an exciting visual layout for presenting events. 
We also added an enhancement for Tiles view: Event sort order can now be set to chronological (calendar default) or reverse chronological (blog style).



In the calendar settings, Tiles view has a configuration option to set the event sort order to ascending or descending.
This makes it possible to use Tiles view as a photo blog or diary with events presented in reverse chronological order.



New: Formatted text field
This new custom field type provides plenty of space for long text notes, rich formatting, and configurable visibility. 
Improved event editor design
   
This redesign provides many improvements to fonts, field layout, select lists and buttons, links, etc. for a more user-friendly and attractive interface when creating and editing events. 
All the small things
Many small updates, bug fixes, and improvements behind the scenes to continue to make Teamup even better."""
