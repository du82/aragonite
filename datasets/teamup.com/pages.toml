["https://www.teamup.com/customer-support-calendar"]
title = "Customer Support Shift Scheduler - Teamup.com"
description = "Improve customer support efficiency with Teamup, the online calendar that makes organizing, planning, and sharing in groups painless."
full_description = 'The Customer Support Team Calendar THE NEEDS A customer support team of over 50 agents across multiple time zones work in shift schedules. The team leaders from each region coordinate when scheduling the shifts to provide optimal agent coverage at all times, and each agent must be able to see their colleagues’ schedules in order to effectively handover cases. Each team leader can edit their own team’s schedules, but not the agents from other regions. Agents cannot edit their own shifts, and there is a team schedule for the entire team to see everybody’s availabilities. The calendar can be organized according to each region, so agents can easily see the shift schedule within one time zone. <img loading="lazy" fetchpriority="high" decoding="async" width="4000" height="2666" src="https://www.teamup.com/wp-content/uploads/2024/04/240423-tu-shift-schedule.png" alt="" title="240423-tu-shift-schedule" srcset="https://www.teamup.com/wp-content/uploads/2024/04/240423-tu-shift-schedule.png 4000w, https://www.teamup.com/wp-content/uploads/2024/04/240423-tu-shift-schedule-1280x853.png 1280w, https://www.teamup.com/wp-content/uploads/2024/04/240423-tu-shift-schedule-980x653.png 980w, https://www.teamup.com/wp-content/uploads/2024/04/240423-tu-shift-schedule-480x320.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 4000px, 100vw" class="wp-image-14504" /> SOLUTION SUMMARY <img loading="lazy" decoding="async" draggable="false" role="img" class="emoji" alt="🎨" consent-original-src-_="https://s.w.org/images/core/emoji/12.0.0-1/svg/1f3a8.svg" consent-required="10374" consent-by="services" consent-id="10375"/> Color-coded sub-calendars <img loading="lazy" decoding="async" draggable="false" role="img" class="emoji" alt="🧐" consent-original-src-_="https://s.w.org/images/core/emoji/12.0.0-1/svg/1f9d0.svg" consent-required="10374" consent-by="services" consent-id="10375"/> Access permission 🎨 The team calendar 📅 An agent’s calendar 👋 Getting started 👍 Feature tips The Solution Teamup Calendar, a centrally-managed shared calendar designed specifically for teams. It’s the simple, secure, and efficient way to share information across groups with functions ranging from custom access settings to flexible display options. The solution presented here highlights how to set up a big-picture team schedule that visualizes individual availabilities on one page, and how to integrate a leave tracking system within the calendar that streamlines the scheduling process. <img loading="lazy" loading="lazy" decoding="async" width="200" height="284" src="https://www.teamup.com/wp-content/uploads/2020/06/Screen-Shot-2020-06-02-at-10.56.46-1.png" alt="" title="" class="wp-image-2732" /> Color-coded sub-calendars and folders The department leader signs up as the calendar Administrator to create the sub-calendar structure: One color-coded sub-calendar for each customer support agent. Folders are set up for each region or country, and the agent’s sub-calendar is nested within the appropriate region folder. This makes it easier to look for specific details, by being able to collapse and expand the folders. Learn about setting up sub-calendars → Access permission levels The administrator gives regional team leaders modify access to the sub-calendars of their local team in order to schedule the shifts. Each agent will have modify-from-same-link access to their own calendar. This means they can view but not modify assigned shifts, with the ability to add and manage holiday requests directly via their calendar link. All agents can see the entire team’s shifts with read-only access to other calendars. Learn about calendar access with individual permissions → <img loading="lazy" loading="lazy" decoding="async" width="737" height="530" src="https://www.teamup.com/wp-content/uploads/2020/06/Screenshot-2020-06-26-at-11.11.36.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/Screenshot-2020-06-26-at-11.11.36.png 737w, https://www.teamup.com/wp-content/uploads/2020/06/Screenshot-2020-06-26-at-11.11.36-480x345.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 737px, 100vw" class="wp-image-2756" /> <img loading="lazy" loading="lazy" decoding="async" width="1434" height="787" src="https://www.teamup.com/wp-content/uploads/2020/06/Screen-Shot-2020-06-02-at-10.56.46-2.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/Screen-Shot-2020-06-02-at-10.56.46-2.png 1434w, https://www.teamup.com/wp-content/uploads/2020/06/Screen-Shot-2020-06-02-at-10.56.46-2-1280x702.png 1280w, https://www.teamup.com/wp-content/uploads/2020/06/Screen-Shot-2020-06-02-at-10.56.46-2-980x538.png 980w, https://www.teamup.com/wp-content/uploads/2020/06/Screen-Shot-2020-06-02-at-10.56.46-2-480x263.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1434px, 100vw" class="wp-image-2838" /> The team calendar The entire customer support team, including all agents and team leaders, can have an overview of the team’s schedules across all time zones and offices. Customer support agent Agnes’ calendar Agnes can view but not modify shifts assigned to her, and is able to add as well as modify her own events within her calendar link. Therefore, she can request holidays by creating an event with the vacation request sub-calendar, which will then be confirmed by the manager and assigned to the vacation confirmed sub-calendar. She can also see the schedules of her colleagues to check who else is working on those days, across all regions. <img loading="lazy" loading="lazy" decoding="async" width="1440" height="797" src="https://www.teamup.com/wp-content/uploads/2020/07/Customer-Support-Agent-Calendar-View.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Customer-Support-Agent-Calendar-View.png 1440w, https://www.teamup.com/wp-content/uploads/2020/07/Customer-Support-Agent-Calendar-View-1280x708.png 1280w, https://www.teamup.com/wp-content/uploads/2020/07/Customer-Support-Agent-Calendar-View-980x542.png 980w, https://www.teamup.com/wp-content/uploads/2020/07/Customer-Support-Agent-Calendar-View-480x266.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1440px, 100vw" class="wp-image-3432" /> Getting Started Video Tutorials Feature Tips <img loading="lazy" loading="lazy" decoding="async" width="400" height="400" src="https://www.teamup.com/wp-content/uploads/2020/06/How-to-duplicate-customer-support-calendar.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/How-to-duplicate-customer-support-calendar.png 400w, https://www.teamup.com/wp-content/uploads/2020/06/How-to-duplicate-customer-support-calendar-300x300.png 300w, https://www.teamup.com/wp-content/uploads/2020/06/How-to-duplicate-customer-support-calendar-150x150.png 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-2861" /> Right click to duplicate event <img loading="lazy" loading="lazy" decoding="async" width="400" height="400" src="https://www.teamup.com/wp-content/uploads/2020/06/Untitled-1.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/Untitled-1.png 400w, https://www.teamup.com/wp-content/uploads/2020/06/Untitled-1-300x300.png 300w, https://www.teamup.com/wp-content/uploads/2020/06/Untitled-1-150x150.png 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-2843" /> Use recurring events to schedule shifts <img loading="lazy" loading="lazy" decoding="async" width="400" height="400" src="https://www.teamup.com/wp-content/uploads/2020/07/Calendar-Views.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Calendar-Views.png 400w, https://www.teamup.com/wp-content/uploads/2020/07/Calendar-Views-300x300.png 300w, https://www.teamup.com/wp-content/uploads/2020/07/Calendar-Views-150x150.png 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-3421" /> Choose from the multiple calendar views <img loading="lazy" loading="lazy" decoding="async" width="400" height="400" src="https://www.teamup.com/wp-content/uploads/2020/06/CSupportCalendar.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/CSupportCalendar.png 400w, https://www.teamup.com/wp-content/uploads/2020/06/CSupportCalendar-300x300.png 300w, https://www.teamup.com/wp-content/uploads/2020/06/CSupportCalendar-150x150.png 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-2858" /> Drag over a slot to select time What if… Here are some additional calendar features to explore depending on your unique scenario, and how you can make the most out of your customer support team calendar 📅 … you want to receive daily agendas? The daily agenda is an optional feature for the paid subscription plan and you can get a summary of all your events scheduled for that day emailed straight to you. It can be customized to be sent out at any time listing events for the upcoming one or up to three days. 🔁 … you want to set up repeating events? Choose from detailed options for recurring events on your calendar. Choose the repeating option (daily, weekly, and many more) and set the number of recurrences. 🌴 … you want to manage holiday requests? If you give all agents modify-from-same-link or add-only permission, they can request holidays by creating an event for the days they want to take off. This can then be reviewed and approved or denied by their direct manager. See feature → 👋 … you want to find a specific agent’s schedule? Use the filters to see the shift of a specific customer support agent, using keywords or sub-calendar name to filter for the calendar events you need to view. 🛎️ … you want to subscribe to notifications or reminders? Teamup email notifications will notify you when changes are made to events on the calendar. Event reminders can be created for a single event or all events on your sub-calendar, and you will receive an email at a specified time before the event starts. 📞 … you want to use Teamup on your phone? Download the free Teamup mobile app for iOS and Android. Your calendar and all its events will stay synced from mobile to web, and back again. When you need to adjust event details on-the-go, you can do so from the mobile app. Next Steps Get started with your own Teamup calendar now. 🎉 What you get for free Our Basic plan offers a powerful, customizable calendar with up to 8 sub-calendars and 8 account users. Learn more → 🏆 Subscription Plans Need more sub-calendars or account users? Upgrade to a subscription plan. Learn more → Ready to get started with your Customer Support Team Calendar? All the features you need. Easy to learn. Create a calendar Try a live demo You can also start with a free trial of paid plans with more features, or get inspired by browsing what others say and our million thanks. TABLE OF CONTENTS The Customer Support Team CalendarThe SolutionColor-coded sub-calendars and foldersAccess permission levelsThe team calendar Customer support agent Agnes’ calendarGetting StartedVideo TutorialsFeature TipsWhat if…📅 … you want to receive daily agendas?🔁 … you want to set up repeating events?🌴 … you want to manage holiday requests?👋 … you want to find a specific agent’s schedule?🛎️ … you want to subscribe to notifications or reminders?📞 … you want to use Teamup on your phone?Next Steps🎉 What you get for free🏆 Subscription PlansReady to get started with your Customer Support Team Calendar?'
