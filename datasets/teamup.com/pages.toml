["https://www.teamup.com/share-availability-and-enable-appointment-self-booking"]
title = "Share Availability and Enable Self-Booking - Teamup.com"
description = "A team of 10 business coaches need to make their availability visible to their clients and enable clients to book a meeting slot with the coaches."
full_description = 'Team Availability for Client Self-booking THE NEEDS A team of 10 business coaches need to make their availability visible to their clients and enable clients to book a meeting slot with the coaches. The coaches need to be able to block out their unavailable dates and time. The client does not choose which coach they book the meeting with, but sign up for a slot. A scheduler or administrator assigns an available coach to the client. Embed the booking calendar into web sites and Facebook page. <img loading="lazy" fetchpriority="high" decoding="async" width="800" height="533" src="https://www.teamup.com/wp-content/uploads/2020/04/availability-booking.jpg" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/availability-booking.jpg 800w, https://www.teamup.com/wp-content/uploads/2020/04/availability-booking-480x320.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 800px, 100vw" class="wp-image-1074" /> SOLUTION SUMMARY 🎨 Color-coded sub-calendars 🛌 Availability at a glance 🛎️ Enable signup 🧐 Role-based access permissions 👋 The client experience 👍 The coach experience 📅 The scheduler experience 🖼️ Embedded calendar for self-booking The Solution Make the availability visible. Make use of recurring events. Allow clients to make bookings directly on the calendar. Customize user access permissions. To keep it simple, this solution addresses the scenario with pre-defined booking slots. A variation is demonstrated. <img loading="lazy" loading="lazy" decoding="async" width="192" height="203" src="https://www.teamup.com/wp-content/uploads/2020/04/subcalendars.png" alt="" title="" class="wp-image-956" /> Color-coded sub-calendars to represent availability Use one or more sub-calendars to visualize the available slots. If the availability involves multiple members, allow color-coded space for each of them. Availability: pre-defined time slots available for signup (tip: consider when to use pre-defined slots vs. book any time with the add-only permission). Coach availability: 1 sub-cal for each coach allowing them to update their own availability directly. Set their calendars to disallow double booking. Optional: An All sub-calendar for events applicable to everyone, such as team meetings and public holidays A default calendar view to show availability at a glance Choose an appropriate calendar view as the default, e.g. the week view for hour specific appointment slots Hide weekend if no business hours on weekends Create recurring events if applicable Allow variations, e.g. a slot is an hour shifted Learn about calendar views → <img loading="lazy" loading="lazy" decoding="async" width="1279" height="720" src="https://www.teamup.com/wp-content/uploads/2020/04/view.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/view.png 1279w, https://www.teamup.com/wp-content/uploads/2020/04/view-980x552.png 980w, https://www.teamup.com/wp-content/uploads/2020/04/view-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1279px, 100vw" class="wp-image-764" /> <img loading="lazy" loading="lazy" decoding="async" width="938" height="548" src="https://www.teamup.com/wp-content/uploads/2020/04/enable-signup.gif" alt="" title="" class="wp-image-969" /> Enabling Signup Enable signup in the event editor when you create a slot available for signup. Set the maximum number of people allowed to sign up for each slot. Set it to 1 if it’s a single person’s availability. Select only “Users with modify permission” can view signups to keep the signup list private. When you make a signup enabled event recurring, the signup will be enabled in all occurences. Learn about signup for an event → Setting up access permissions for users in different roles The calendar administrator can set sharable calendar links or account users in Settings. The Scheduler: Besides the administrator, if there is a scheduler who does not need to manage the calendar Settings, give this person the full modifier permission for security reasons. Staff member: Customized link or account user for each individual staff member so they can add their unavailable dates/time and other info: Modify permission to their own calendar; no access (or read-only) to calendars of other coaches; read-only to the Availability calendar and the Confirmed Appointments calendar. Clients: A signup link with the Read-only permission to the Availability calendar, no access to all other calendars. Learn about how to share a calendar with users → <img loading="lazy" loading="lazy" decoding="async" width="266" height="406" src="https://www.teamup.com/wp-content/uploads/2020/04/sharing.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/sharing.png 266w, https://www.teamup.com/wp-content/uploads/2020/04/sharing-197x300.png 197w" sizes="(max-width: 266px) 100vw, 266px" class="wp-image-771" /> How a client signs up The client opens the signup link or go to a page with the signup calendar embedded. If she sees a flag in the title of a pre-defined appointment slot, it means it is open for signup. Otherwise it means the signup is either full or the deadline has passed. <img loading="lazy" loading="lazy" decoding="async" width="780" height="297" src="https://www.teamup.com/wp-content/uploads/2020/04/flag.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/flag.png 780w, https://www.teamup.com/wp-content/uploads/2020/04/flag-480x183.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 780px, 100vw" class="wp-image-794" /> <img loading="lazy" loading="lazy" decoding="async" width="780" height="500" src="https://www.teamup.com/wp-content/uploads/2020/04/signup-client.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/signup-client.png 780w, https://www.teamup.com/wp-content/uploads/2020/04/signup-client-480x308.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 780px, 100vw" class="wp-image-793" /> <img loading="lazy" loading="lazy" decoding="async" width="1278" height="720" src="https://www.teamup.com/wp-content/uploads/2020/04/coach-updates-unavailability.gif" alt="" title="" class="wp-image-796" /> <img loading="lazy" loading="lazy" decoding="async" width="336" height="621" src="https://www.teamup.com/wp-content/uploads/2020/04/Mike-updates-ios.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/Mike-updates-ios.png 336w, https://www.teamup.com/wp-content/uploads/2020/04/Mike-updates-ios-162x300.png 162w" sizes="(max-width: 336px) 100vw, 336px" class="wp-image-801" /> How a coach self-updates availability Coach Mike uses a sharable link or as an account user to access the calendar. He can update his unavailable dates and time on the calendar without contacting the scheduler. How the scheduler updates availability and makes appointments The scheduler would subscribe to be notified when a client signs up for an appointment. The scheduler then goes to the calendar, creates an event, and assigns it to both the “Appointments” calendar and the calendar of an available staff member, then emails the client with the details once the appointment is set. Optionally share the event page of the appointment with the client (or share via mobile apps as a proactive reminder). <img loading="lazy" loading="lazy" decoding="async" width="780" height="500" src="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-updates.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-updates.png 780w, https://www.teamup.com/wp-content/uploads/2020/04/scheduler-updates-480x308.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 780px, 100vw" class="wp-image-814" /> <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-booking.gif" alt="" title="" class="wp-image-807" /> If a coach updates his unavailability that would affect the number of appointment slots available for signup, the scheduler can go to the event on the Availability calenar, open it in the event editor, and update the maximum number of signup allowed. Tips To see who is available in a specific time slot, use the Timeline view. Subscribe to notifications when a coach updates their availability or a client signs up. To send the client a confirmation email or text, use the event sharing function on our mobile apps. You can also share the event page URL with your client and enable him or her to save the appointment directly to their personal calendar. <img loading="lazy" loading="lazy" decoding="async" width="1281" height="720" src="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-timeline.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-timeline.png 1281w, https://www.teamup.com/wp-content/uploads/2020/04/scheduler-timeline-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2020/04/scheduler-timeline-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1281px, 100vw" class="wp-image-815" /> Coach availability in timeline view makes it easy to see who is available for appointments <img loading="lazy" loading="lazy" decoding="async" width="308" height="624" src="https://www.teamup.com/wp-content/uploads/2020/04/share-w-client.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/share-w-client.png 308w, https://www.teamup.com/wp-content/uploads/2020/04/share-w-client-148x300.png 148w" sizes="(max-width: 308px) 100vw, 308px" class="wp-image-816" /> Email or text the appointment as a confirmation to the client <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-share-appointment-page.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/scheduler-share-appointment-page.png 1280w, https://www.teamup.com/wp-content/uploads/2020/04/scheduler-share-appointment-page-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2020/04/scheduler-share-appointment-page-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-817" /> Allowing the client to add the appointment directly to their calendar Allowing arbitrary appointment time Instead of offering only fixed hourly slots such as 10 AM to 11 AM, you may have office hours open from 9 AM to 4 PM and allow clients to book a slot of their wish, e.g. 9:30 AM to 10:30 AM. You can make this possible with a small change from the set up described above: Add a sub-calendar, e.g. “Request time”, then update the client link to include this sub-calendar with the permission “Add-only no details“. The client is now able to select the time he wants by adding an event. The details of the request would not be visible to other clients who use the same link. When the scheduler receives the notification of the requested time, she can assign the client to an available coach, and make any adjustment needed to the pre-defined slots. <img loading="lazy" loading="lazy" decoding="async" width="1280" height="574" src="https://www.teamup.com/wp-content/uploads/2020/04/request-appointment-time.gif" alt="" title="" class="wp-image-997" /> Tips Use the timeline view. Give the Client link “add-only no details” so that what one client has added is not visible to other clients. Set appropriate calendar resolution so that a client may simply drag over the time he needs to create the event. Getting Started Video Tutorials Features You may learn more about some of these features to make the most out of your Teamup solution. 👋 How to share the calendar securely with customized calendar links? 🔑 What’s the difference between login to my user account and access to a calendar? 📚 How to avoid double booking? 📞 How to use Teamup on my phones? 📞 How to embed a calendar into a website? 🖼️ How to create Events in a Time Zone Local to the Event, But Not Local to Event Creator 🛎️ How to subscribe to notifications? Embed Calendar into Websites It’s easy to embed your appointment calendar into a website or your Facebook page for clients to signup. Generate embed code Live embedded appointment calendar <img loading="lazy" loading="lazy" decoding="async" width="1267" height="714" src="https://www.teamup.com/wp-content/uploads/2020/04/embed-gallery.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/embed-gallery.png 1267w, https://www.teamup.com/wp-content/uploads/2020/04/embed-gallery-980x552.png 980w, https://www.teamup.com/wp-content/uploads/2020/04/embed-gallery-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1267px, 100vw" class="wp-image-905" /> How it looks when the calendar is embedded into a website <img loading="lazy" loading="lazy" decoding="async" width="1076" height="658" src="https://www.teamup.com/wp-content/uploads/2020/04/fb-embedded.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/04/fb-embedded.png 1076w, https://www.teamup.com/wp-content/uploads/2020/04/fb-embedded-980x599.png 980w, https://www.teamup.com/wp-content/uploads/2020/04/fb-embedded-480x294.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1076px, 100vw" class="wp-image-847" /> The calendar is embedded into a Facebook page Good to Know 🎉 What you get for free By far, most Teamup users are on our free plan: no cost for a flexible, powerful calendar service. We’re happy to provide a free service that helps people to work efficiently and do more of what they love. Learn more → 🏆 Subscription plans If you need more advanced features such as uploading files or additional custom fields, or prefer extra access control to better protect your calendar data, then simply upgrade to a subscription plan. Learn more → Ready to get started? It’s free, simple and easy. Getting started requires no user account nor credit card. Create a calendar Try a live demo You can also start with a free trial of paid plans with more features, or get inspired by browsing what others say and our million thanks. TABLE OF CONTENTS Team Availability for Client Self-bookingThe SolutionColor-coded sub-calendars to represent availabilityA default calendar view to show availability at a glanceEnabling SignupSetting up access permissions for users in different rolesHow a client signs upHow a coach self-updates availabilityHow the scheduler updates availability and makes appointmentsTipsAllowing arbitrary appointment timeTipsGetting StartedVideo Tu'
