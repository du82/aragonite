title = "Teamup Ticker"
description = """
An outbound iCalendar feed is a feed from Teamup to another calendar service (or to another Teamup calendar). 
If the feed will not sync or stops updating, here is what to check.


Is the feed URL valid? Use one of the freely available iCalendar feed validators such as https://icalendar.org/validator.html. There may be a typo or copy/paste error; this is a quick way to make sure the feed URL is correct. 

If the feed URL is not valid, go back to the source Teamup calendar and obtain the feed URL again. 
If the feed URL is valid, proceed with the next troubleshooting steps to isolate the issue. 


Try the feed in a Teamup live demo calendar. 
Try a different browser: If it doesn't work in your default browser, try the feed in your own calendar or a live demo calendar in a different browser. 
Test the feed in a different calendar, e.g. Apple or Google Calendar. 

Note that refresh rates are dependent on the calendar receiving the feed: Teamup refreshes the feed source immediately after each change. However, the update frequency a user experiences varies depending on the subscribing calendar program."""
