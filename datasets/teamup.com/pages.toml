title = "Easy Scheduling for Research Teams & Labs - Teamup.com"
description = "Set up your lab and equiptment scheduling system with Teamup, the online calendar that makes planning and sharing information in groups painless."
full_description = 'Easy Scheduling for Research Teams & Labs When the pandemic hit our world in early 2020, life science researchers were among the first to experience the need to self-book resources. Research teams at many universities and institutes were re-opening their research labs with safety guidelines. To protect everyone’s health, the teams needed a lab scheduling system to book lab space with limited slots and to keep a log of who was occupying each space, among other social distancing measures. Teamup enabled leading life science researchers around the world to work safely as they raced to save lives. <img loading="lazy" fetchpriority="high" decoding="async" width="590" height="233" src="https://www.teamup.com/wp-content/uploads/2020/06/hperl_new.jpg" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/hperl_new.jpg 590w, https://www.teamup.com/wp-content/uploads/2020/06/hperl_new-480x190.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 590px, 100vw" class="wp-image-2942" /> Image credit: McMaster University Labs SOLUTION SUMMARY 🎨 Needs in the Words of Scientists 🧐 Solution Inspiration 👋 Step-by-Step 🔎 Visual Tips 👍 Feature Tips ✅ Live Demo The Needs in the Words of Scientists <img loading="lazy" loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2020/06/john-kaddis-150x150.jpg" height="125" width="125" class=""/> After searching through many different calendar solutions, I settled on TeamUp. I work at the Beckman Research Institute of City of Hope in Duarte, CA. We are a cancer treatment hospital, medical center, basic science and clinical research facility for type 1 diabetes, and have a graduate school for training scientists of the future. We just started using Teamup in our Diabetes and Metabolism Research Institute because we can no longer freely use all of the equipment, instruments, and services available in our building without first controlling traffic in our labs and specialty rooms. It is a terrific solution. Professor John KaddisCity of Hope National Medical Center<img loading="lazy" loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2020/06/Kristine-Fischenich-150x150.png" height="125" width="125" class=""/> We are using the platform to schedule the use of research lab space as our university begins to phase in a return to work. Our space is shared by three separate PIs (Ferguson, Lynch, Neu) all of whom have a strong mechanical engineering background but utilize that expertise in biomedical research. New guidelines require us to limit total occupancy and monitor who has been in what spaces. The Teamup platform will allow us a means to both book research space and a log of who was occupying each space. The ability of all users to both view and book their own time reduces the burden of any one person needing to take on this additional scheduling work and will allow all to be more productive. Kristine Fischenich, PhDUniversity of Colorado Boulder<img loading="lazy" loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2020/06/matt-akamatsu-150x150.png" height="125" width="125" class=""/> The “killer” app I am looking for is to have a defined max occupancy for a given room. Each lab space we work in will now have a “density budget,” meaning that e.g. up to four people are allowed to work in that room at a given time. People are scheduling their own time to do their work. Our current solution of morning and night shifts on a google sheet is not nearly flexible enough for the unpredictable nature of biology research. (The cells that we grow in culture don’t always follow the schedules we had planned.) So, I’d like a given room to have overlapping events = 4 or something like that. Up to four people can work there, and if a fifth person tries to schedule the room they get an error. Matthew Akamatsu, PhDUniversity of California at Berkeley (function(){var waitForJQuery = setInterval(function () {if (typeof jQuery != "undefined") {clearInterval(waitForJQuery);jQuery(function($){ jQuery(window).load(function() { if( jQuery("body").find(".archive0 .b3testimonialcontentEqual").length >0 ){equalheight(".archive0 .b3testimonialcontentEqual"); } if( jQuery("body").find(" .archive0.b3testimonialEqual").length >0 ){ equalheight(".archive0.b3testimonialEqual"); } }); jQuery(window).resize(function(){ if( jQuery("body").find(".archive0 .b3testimonialcontentEqual").length >0 ){equalheight(".archive0 .b3testimonialcontentEqual");} if( jQuery("body").find(".archive0.b3testimonialEqual").length >0 ){equalheight(".archive0.b3testimonialEqual");} }); var selectedClass_gridarchive0 = "";var selectedClass_listarchive0 = ""; jQuery(".filter_grid.archive0").click(function(){ jQuery(".b3_archive_testimonial_category_list li a.filter_grid.archive0").removeClass("active"); jQuery(this).addClass("active"); selectedClass_gridarchive0 = jQuery(this).attr("data-filter"); jQuery(".b3_archive_testimonial_view_grid.archive0").fadeTo(100, 0.1); jQuery(".b3_archive_testimonial_view_grid.archive0 > div.b3_archive_testimonials_grid.archive0").not(selectedClass_gridarchive0).fadeOut().removeClass("b3-scale-anm"); setTimeout(function() { jQuery(".b3_archive_testimonial_view_grid.archive0").find(selectedClass_gridarchive0).fadeIn().addClass("b3-scale-anm"); jQuery(".b3_archive_testimonial_view_grid.archive0").fadeTo(300, 1); }, 100); }); jQuery(".filter_list.archive0").click(function(){ jQuery(".b3_archive_testimonial_category_list li a.filter_list.archive0").removeClass("active"); jQuery(this).addClass("active"); selectedClass_listarchive0 = jQuery(this).attr("data-filter"); jQuery(".b3_archive_testimonial_view_list.archive0").fadeTo(100, 0.1); jQuery(".b3_archive_testimonial_view_list.archive0 > div.b3_testimonials_list.archive0").not(selectedClass_listarchive0).fadeOut().removeClass("b3-scale-anm"); setTimeout(function() { jQuery(".b3_archive_testimonial_view_list.archive0").find(selectedClass_listarchive0).fadeIn().addClass("b3-scale-anm"); jQuery(".b3_archive_testimonial_view_list.archive0").fadeTo(300, 1); }, 100); }); })}}, 10);})(); Solutions: Simple, Flexible, Efficient The key: Define available occupancy slots with color-coded calendars <img loading="lazy" loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006091.png" alt="Colored calendars for rooms, people and resources to be scheduled" srcset="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006091.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006091.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-2211" /> <img loading="lazy" loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006086.png" alt="Colored calendars for rooms, people and resources to be scheduled" srcset="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006086.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006086.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-2110" /> <img loading="lazy" loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006083.png" alt="Colored calendars for rooms, people and resources to be scheduled" srcset="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006083.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006083.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-2085" /> <img loading="lazy" loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006081.png" alt="Colored calendars for rooms, people and resources to be scheduled" srcset="https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006081.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/color-coded-sub-calendars-2006081.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-2083" /> Best practice: Enable team members to self-book without conflicts <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/05/fergusonphoto.jpg" alt="How to use Attributes in your Teamup calendar " title="" /> User Story: How these Research Teams Schedule Shared Lab Space in Covid-19 See the lab scheduler in action for yourself Set up color-coded sub-calendars The team leader signs up as the calendar administrator to create the sub-calendar structure: assign one color-coded sub-calendar for each piece of equipment, room, or lab slot. This allows for implementing occupancy limits. Collapsible folders can be set up for labs, floors, wings, etc. The appropriate dependent sub-calendars are nested within the folder. Optional: To keep an overview of each person’s shared resource use, create a team folder and add one sub-calendar per team member. When scheduling, the team member will add the booking to both the lab sub-calendar and their own sub-calendar. <img loading="lazy" loading="lazy" decoding="async" width="1439" height="794" src="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.32.51.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.32.51.png 1439w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.32.51-1280x706.png 1280w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.32.51-980x541.png 980w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.32.51-480x265.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1439px, 100vw" class="wp-image-3144" /> <img loading="lazy" loading="lazy" decoding="async" width="1422" height="794" src="https://www.teamup.com/wp-content/uploads/2020/07/Links.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Links.png 1422w, https://www.teamup.com/wp-content/uploads/2020/07/Links-1280x715.png 1280w, https://www.teamup.com/wp-content/uploads/2020/07/Links-980x547.png 980w, https://www.teamup.com/wp-content/uploads/2020/07/Links-480x268.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1422px, 100vw" class="wp-image-3230" /> Set up access permissions Option 1: The administrator gives all users their own modify-from-same-link access. Each user can view but not modify any bookings made by colleagues, but are able to add and modify their own events within their calendar link. Option 2: For a simplified solution with just one link for all team members, the administrator can set up a link with either add-only or modify permission. Add-only means users can create new bookings but cannot modify anything, while the modify permission means everyone can add and edit any events on the calendar. The optimal access permission will depend on your unique scenario. The resulting master calendar Everyone will have access to the team’s schedule overview and when certain lab slots or equipment are available to book. You have an option to customize the About Box and add instructions detailing how the team can book slots and equipment. There are also different calendar view settings, and the administrator can set the default to the view that fits the users’ needs best. <img loading="lazy" loading="lazy" decoding="async" width="1440" height="793" src="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.26.10.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.26.10.png 1440w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.26.10-1280x705.png 1280w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.26.10-980x540.png 980w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-20.26.10-480x264.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1440px, 100vw" class="wp-image-3138" /> <img loading="lazy" loading="lazy" decoding="async" width="1438" height="795" src="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.02.59.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.02.59.png 1438w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.02.59-1280x708.png 1280w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.02.59-980x542.png 980w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.02.59-480x265.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1438px, 100vw" class="wp-image-3154" /> How a user makes a booking The user can see all existing bookings of the entire team. To make a booking, they simply drag the mouse over the time they want to book the specific lab slot or equipment. They enter all the required fields, then click save. If the user has modify-from-same-link or modify access, they are able to make changes to their booked slot when needing to reschedule or fix any errors. Visual Lab Scheduler Tips <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/07/Timeline-Day-400x284.png" alt="Timeline View Day" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Timeline-Day.png 479w, https://www.teamup.com/wp-content/uploads/2020/07/Timeline-Day-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3181" /> Timeline View DayThe Timeline calendar view showing a single day. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.43.50-400x284.png" alt="Timeline View Week" srcset="https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.43.50.png 479w, https://www.teamup.com/wp-content/uploads/2020/07/Screenshot-2020-07-01-at-21.43.50-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3176" /> Timeline View WeekThe Timeline calendar view showing a single week. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020'
