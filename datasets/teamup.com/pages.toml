title = "Teamup Ticker"
description = """
Deactivate vs Delete 

Deactivating a sub-calendar will remove it from active view but will maintain the data in an archive. 
Deleting a sub-calendar will permanently remove it and delete all the data it contains.
Only a calendar administrator can deactivate or delete sub-calendars.  

Deactivating sub-calendars
If you don't need a sub-calendar anymore, but you want to keep the data it contains, deactivate it. 

Deactivated sub-calendars do not count toward your sub-calendar limit. 
Deactivated sub-calendars do not lose any data when deactivated. 
Deactivated sub-calendars can be reactivated at any time to make their data accessible on the calendar. 

How to deactivate a sub-calendar

Open Teamup in a browser.
Go to Settings > Calendars.
In the list of sub-calendars, use the toggle button to deactivate (or activate) any sub-calendar:

Toggle the button to red to deactivate a sub-calendar.
 
Deleting sub-calendars
Deleting a sub-calendar will permanently remove it and delete all the data it contains.
⚠️ Danger zone: Deletion cannot be restored or undone. Deleted data is automatically cleared permanently from our database after a short period of time. We cannot undo this permanent deletion. 
Only a calendar administrator can access settings to delete a sub-calendar. 
How to delete a sub-calendar

Open Teamup in a browser.
Go to Settings > Calendars.
Click the Edit button next to the sub-calendar you wish to delete.
Click the red Delete button in the top right. 

Note the warning: This calendar and all events assigned to it will be deleted permanently.


Click the red Delete Forever button to permanently delete the sub-calendar."""
full_description = "⚠️ Danger zone: Deletion cannot be restored or undone. Deleted data is automatically cleared permanently from our database after a short period of time. We cannot undo this permanent deletion."
