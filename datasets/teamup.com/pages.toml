["https://teamup.com/event/show/id/BUPid9UbZUTa6bUMBR1QyqkAQyqDgq"]
title = "Teamup Ticker"
description = '''
With Teamup, you can share a calendar by through account-based access or with shareable calendar links.
Link-based access is helpful for providing calendar access without a login required. It's a convenient way to share a calendar with a group or set up public access. 
However, while shareable calendar links have some built-in security, they are not tied to an individual person's email address and do not require a login. So, anyone who has the link can access the calendar unless the link has password protection.
It's very important to enact secure procedures when using calendar links. One important factor is to name each link appropriately. Here are our recommendations:

Use a specific link name that indicates who is allowed to use the link. 
Include an indication of the access level for that link. 

   
For example: 

"Mary - Add-only"
"Embedded Calendar - Read-only"
"Group members - Mixed"

Having a specific link name helps with keeping access secure. If someone should no longer have access via link, the admin can quickly find that person's link and delete it. The admin can also periodically review all active links, ensure that each one is still authorized for use, and check that the access permissions are set appropriately.'''
