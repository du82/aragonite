/cal-organize-teams-02.png 1062w, https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-02-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-02-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> <img loading="lazy" fetchpriority="high" decoding="async" width="1062" height="768" class="img-fluid wp-image-5024" alt=" " src="https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-04.png" srcset="https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-04.png 1062w, https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-04-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-04-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> <img loading="lazy" decoding="async" width="1062" height="768" class="img-fluid wp-image-5030" alt=" " src="https://www.teamup.com/wp-content/uploads/2020/12/cal-clinica.png" srcset="https://www.teamup.com/wp-content/uploads/2020/12/cal-clinica.png 1062w, https://www.teamup.com/wp-content/uploads/2020/12/cal-clinica-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-clinica-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> <img loading="lazy" decoding="async" width="1062" height="768" class="img-fluid wp-image-5034" alt=" " src="https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-02.png" srcset="https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-02.png 1062w, https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-02-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-organize-teams-02-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> How People Use Teamup <img loading="lazy" decoding="async" width="193" height="179" src="https://www.teamup.com/wp-content/uploads/2022/05/emily.png" alt="" title="emily" class="wp-image-9051" /> “The digital marketing team at HPE is absolutely loving Teamup. The platform is saving us so much time and allowing the team to be able to activate social content across our digital platforms much more efficiently than before.” Emily Bynum, HP Enterprise Read more testimonials “I have found the perfect app … It’s a combination of the simple calendar layout + the surprising amount of simple yet useful functionality (adding images, color coding, being able to easily copy or drag and drop, right clicking to bring up more options).” Karolina Read more Google Play reviews User Story: Hope Channel “Hope Channel was hiring more people and our activities were increasing a lot more, so we decided to go with the premium option. Little did I know, it was the best decision I made. We all know with one click what projects we are working on, what is happening next, who is involved, deadlines and so much other important information. As a manager, I know exactly how long a project takes from initial idea to finished production, and this tracking makes my job easier.“ Daniel Claudet, Manager, Hope Channel Southeast Asia Read the story <img loading="lazy" decoding="async" width="800" height="533" src="https://www.teamup.com/wp-content/uploads/2020/12/mamaphoto.jpg" alt="" title="mamaphoto" srcset="https://www.teamup.com/wp-content/uploads/2020/12/mamaphoto.jpg 800w, https://www.teamup.com/wp-content/uploads/2020/12/mamaphoto-480x320.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 800px, 100vw" class="wp-image-5050" /> Better, Easier Staff Communication This organization with multiple locations and 90+ staff members uses Teamup Calendar to stay organized and have easier staff communication. <img loading="lazy" decoding="async" width="800" height="533" src="https://www.teamup.com/wp-content/uploads/2020/12/story-team-observatory.jpg" alt="" title="story-team-observatory" srcset="https://www.teamup.com/wp-content/uploads/2020/12/story-team-observatory.jpg 800w, https://www.teamup.com/wp-content/uploads/2020/12/story-team-observatory-480x320.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 800px, 100vw" class="wp-image-5051" /> No More Time Zone Confusion for Global Collaboration Teamup’s time zone support helps 500 scientists in 16 countries better collaborate on building and running the largest ever cosmic ray detector in the world. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2021/03/Volunteer-Cindy-Reading-2-scaled.jpg" alt="" title="john-schnobrich-520023-unsplash" /> How Teamup helps keep Audio Reading Service afloat during COVID-19 This non-profit manages a staff of four, and 100+ volunteer providing an audio news and information service. Teamup makes scheduling easy and efficient. Read More User Stories Feature Highlights Organize with Colors Use color-coded sub-calendars to organize people, places, or events. Assign a sub-calendar to a team member, a resource, a project, a process… anything! Arrange sub-calendars in folders and show or hide as needed. 11 Calendar Views Go beyond the standard calendar Day, Week, Month, and Agenda views. Teamup offers unique ways to view calendar data in Scheduler, Timeline, Table and even a whole year at a glance! Flexible, Practical Work efficiently with specific recurrence rules and keyboard shortcuts. Drag-and-drop to move or copy. Prevent double booking and use custom event fields and event signup to capture the right information. Easy to Share Share an entire calendar, selected sub-calendars, or individual events. Manage, modify, or revoke calendar access easily. Create stand-alone event webpages with a click, and easily share events on mobile. 9 Access Levels Manage centrally with 9 levels of access permissions to allow the right calendar access for the right person or team. Use add-only and modify-from-same-link to track changes. Use read-only for secure sharing without data risk. Read More How Teamup Is Different Get Started:Organize with Sub-calendars <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-organize-teams-01.png" alt="" title="sub-organize-teams-01" class="wp-image-5055" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-organize-teams-02.png" alt="" title="sub-organize-teams-02" class="wp-image-5056" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-organize-teams-03.png" alt="" title="sub-organize-teams-03" class="wp-image-5057" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-organize-teams-04.png" alt="" title="sub-organize-teams-04" class="wp-image-5058" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-organize-teams-05.png" alt="" title="sub-organize-teams-05" class="wp-image-5059" /> How to Use Color-coded Sub-calendars and Folders How to Share with Customized Calendar Links Learn More Knowledge Base Blog Wall of Love Quick Tips Glossary TABLE OF CONTENTS Organize TeamsGet the whole team on the same pageHow People Use TeamupEmily Bynum, HP EnterpriseKarolinaUser Story: Hope ChannelDaniel Claudet, Manager, Hope Channel Southeast AsiaBetter, Easier Staff CommunicationNo More Time Zone Confusion for Global CollaborationHow Teamup helps keep Audio Reading Service afloat during COVID-19Feature HighlightsOrganize with Colors11 Calendar ViewsFlexible, PracticalEasy to 