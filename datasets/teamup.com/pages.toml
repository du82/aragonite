["http://www.teamup.com/news/blog/item/the-scheduler-view.html"]
title = "Comparing Schedules Made Easy with Scheduler View"
description = "Experience the power of Scheduler View. See events from multiple calendars side by side, perfect for comparing availability and managing appointments, team schedules, and shared spaces."
full_description = 'The Scheduler View Contents Scheduler view: Side-by-side calendar eventsHow to use Scheduler viewAdjust resolution and date rangeAdjust visible columns (sub-calendars)Create, move, and copy eventsEnable and configure Scheduler view Scheduler view (browser only) is a unique calendar view which shows each sub-calendar in its own column. Seeing events from each calendar side-by-side is a great way to compare schedules and availability. To learn about other calendar views, see this article. Scheduler view: Side-by-side calendar events <img loading="lazy" fetchpriority="high" decoding="async" class="alignright wp-image-9526" src="https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches.png" alt="" width="799" height="615" srcset="https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches.png 4000w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-300x231.png 300w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-1024x788.png 1024w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-768x591.png 768w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-50x38.png 50w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-1536x1182.png 1536w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-2048x1575.png 2048w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-60x46.png 60w, https://calendar.teamup.com/wp-content/uploads/2015/06/240621tum-scheduler-view-coaches-100x77.png 100w" sizes="(max-width: 799px) 100vw, 799px" /> Scheduling people, facilities or booking rooms and items are typical tasks when working in a group context. It is often helpful to view bookings or schedules side by side in these scenarios. For example, you might want to compare bookings for a shared space, employee shifts, or scheduled events and meetings for staff. Take a look at this calendar in different layouts (Month, Multi-week, Week, and Scheduler): <img loading="lazy" decoding="async" class="wp-image-9531 size-full" src="https://calendar.teamup.com/wp-content/uploads/2015/06/240626tu-scheduler-view-compare-layouts.gif" alt="" width="1298" height="762" />In Scheduler view, events are organized in columns on an adjustable time grid. Scheduler view provides a clear visual layout with each calendar shown in its own column. See events from multiple calendars next to each other. Adjust the date range and resolution as needed. Toggle calendars on or off from view to view only the relevant events. <img loading="lazy" decoding="async" class="aligncenter wp-image-9534 size-full" src="https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM.png" alt="" width="330" height="65" srcset="https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM.png 330w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-300x59.png 300w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-50x10.png 50w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-60x12.png 60w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-100x20.png 100w" sizes="(max-width: 330px) 100vw, 330px" /> How to use Scheduler view <img loading="lazy" loading="lazy" decoding="async" class="alignright wp-image-9537" src="https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy.png" alt="" width="801" height="616" srcset="https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy.png 4000w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-300x231.png 300w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-1024x788.png 1024w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-768x591.png 768w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-50x38.png 50w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-1536x1182.png 1536w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-2048x1575.png 2048w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-60x46.png 60w, https://calendar.teamup.com/wp-content/uploads/2015/06/240626tum-scheduler-view-studio-bookings-copy-100x77.png 100w" sizes="(max-width: 801px) 100vw, 801px" /> Choose Scheduler from the view selector. Use the arrows or date picker as needed to adjust the visible date(s). Adjust the Resolution and Date range. Note: If you don’t see Scheduler as an option in the view selector, ask your calendar admin to enable this view in settings (details below). Adjust resolution and date range <img loading="lazy" loading="lazy" decoding="async" class="alignright size-full wp-image-9539" src="https://calendar.teamup.com/wp-content/uploads/2015/06/scheduler-view-for-multi-days.gif" alt="" width="1912" height="1080" /> Date range: Choose from Single Day, Multi Day, Weeks, Months, or Years. Resolution: Click the − or ＋ to adjust the resolution from 5 minutes to 1 year. As you change the resolution, the date range options will adjust. If you do not see one of these date range options, adjust the resolution. As you adjust the date range, you can set the number of days, weeks, etc. Adjust visible columns (sub-calendars) Hide or show selected calendars: click on the calendar title to show or hide that particular calendar. <img loading="lazy" loading="lazy" decoding="async" class="wp-image-9529 aligncenter" src="https://calendar.teamup.com/wp-content/uploads/2015/06/240626tu-scheduler-view-date-range-resolution.gif" alt="" width="800" height="463" /> Automatically hide empty columns: Check the box to automatically hide columns (sub-calendars) which do not have any events displayed in the visible time period. <img loading="lazy" loading="lazy" decoding="async" class="size-full wp-image-9174 aligncenter" src="https://calendar.teamup.com/wp-content/uploads/2015/06/Screen-Shot-2023-11-06-at-11.14.46-AM.png" alt="" width="418" height="78" srcset="https://calendar.teamup.com/wp-content/uploads/2015/06/Screen-Shot-2023-11-06-at-11.14.46-AM.png 418w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screen-Shot-2023-11-06-at-11.14.46-AM-300x56.png 300w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screen-Shot-2023-11-06-at-11.14.46-AM-50x9.png 50w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screen-Shot-2023-11-06-at-11.14.46-AM-60x11.png 60w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screen-Shot-2023-11-06-at-11.14.46-AM-100x19.png 100w" sizes="(max-width: 418px) 100vw, 418px" /> Create, move, and copy events <img loading="lazy" loading="lazy" decoding="async" class="alignright wp-image-9535" src="https://calendar.teamup.com/wp-content/uploads/2015/06/240626tu-scheduler-view-create-move.gif" alt="" width="799" height="469" /> Create an event: Click and drag to create an event. The event editor will default to the calendar represented by the column you click in. Move an event: Drag an event from column A to column B, and the event will be automatically moved to the Column B calendar. Copy an event: Use CTRL + drag to copy an event from column A to column B and the copied version of the event will be automatically assigned to Calendar B. <img loading="lazy" decoding="async" class="aligncenter wp-image-9534 size-full" src="https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM.png" alt="" width="330" height="65" srcset="https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM.png 330w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-300x59.png 300w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-50x10.png 50w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-60x12.png 60w, https://calendar.teamup.com/wp-content/uploads/2015/06/Screenshot-2024-06-26-at-9.54.38 AM-100x20.png 100w" sizes="(max-width: 330px) 100vw, 330px" /> Enable and configure Scheduler view Calendar administrators can enable Scheduler view in Settings > Calendar Views and adjust the default settings. Once enabled, Scheduler view will be an option in the view selector. These views are available to all current users. <img loading="lazy" loading="lazy" decoding="async" class="wp-image-8822" src="https://calendar.teamup.com/wp-content/uploads/2015/06/tu-scheduler-configure-defaults.png" alt="" width="501" height="280" srcset="https://calendar.teamup.com/wp-content/uploads/2015/06/tu-scheduler-configure-defaults.png 697w, https://calendar.teamup.com/wp-content/uploads/2015/06/tu-scheduler-configure-defaults-300x167.png 300w, https://calendar.teamup.com/wp-content/uploads/2015/06/tu-scheduler-configure-defaults-50x28.png 50w, https://calendar.teamup.com/wp-content/uploads/2015/06/tu-scheduler-configure-defaults-60x33.png 60w, https://calendar.teamup.com/wp-content/uploads/2015/06/tu-scheduler-configure-defaults-100x56.png 100w" sizes="(max-width: 501px) 100vw, 501px" />Configure the default resolution and default number of days, weeks, or months shown. Users can adjust the settings while using the calendar in Scheduler view (i.e., change the date range, number of days, and zoom level). The calendar will reset to defaults when a new browser session is started. Updated on July 24, 2024 Tagged: calendar viewsScheduler View'
