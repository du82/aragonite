["https://www.teamup.com/about-us"]
title = "About Us - Teamup.com"
description = "The Teamup team embraces the future of work today. We work and live across three continents and serve users in more than 150 countries around the clock. We experience work and life integration and do our best to make positive impact in big and small ways in our every day life."
full_description = 'About Us A Product Serving Millions of Users Teamup Calendar is a cloud-based group calendar application developed by Teamup Solutions AG in Zurich, Switzerland. We leverage the latest technology infrastructure, such as AWS Cloud, to deliver our services with reliability, security, and scale. More than three million users in over 150 countries rely on Teamup every month. We are grateful that our customers love our product, and provide us with a constant stream of motivation, inspiration, and ideas to make our product better and more useful. A Globally Distributed Team We are a distributed team working across 3 continents on flexible hours along with our family duties and social demands. We embrace work-life integration with the freedom to be our best selves and do our best every day. Despite the physical distance and time zone differences, we share the mission and inspiration to develop a useful product that helps millions of people get better organized, schedule and communicate more efficiently. We treasure moments of joy spread over Slack asynchronously throughout the day, be it words from our appreciative customers telling us how much they love our product, beautiful photos from our nature-loving teammates, or relief after intense bug hunting exercises. <img loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-3.png" alt="" title="team-3" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-3.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-3-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5518" /> Jenny Zhan CEO, Co-Founder <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-2.png" alt="" title="team-2" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-2.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-2-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5517" /> Gabriel Sidler CTO, Co-Founder <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-4.png" alt="" title="team-4" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-4.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-4-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5519" /> Jordi Boggiano Head of Engineering <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-7.png" alt="" title="team-7" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-7.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-7-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5522" /> Sarah Schneider User Support <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-1.png" alt="" title="team-1" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-1.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-1-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5523" /> Cristian Bujoreanu Software Engineer <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-6.png" alt="" title="team-6" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-6.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-6-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5524" /> Otomar Nemecek Designer <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2024/01/annie.jpg" alt="Annie Mueller" title="Annie Mueller" srcset="https://www.teamup.com/wp-content/uploads/2024/01/annie.jpg 200w, https://www.teamup.com/wp-content/uploads/2024/01/annie-150x150.jpg 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-12619" /> Annie Mueller Content & User Support <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-10.png" alt="" title="team-10" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-10.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-10-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5526" /> Miranda Ring User Support & Content <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/01/team-11.png" alt="" title="team-11" srcset="https://www.teamup.com/wp-content/uploads/2021/01/team-11.png 200w, https://www.teamup.com/wp-content/uploads/2021/01/team-11-150x150.png 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-5527" /> Orlando Wenzinger Software Engineer <img loading="lazy" loading="lazy" decoding="async" width="200" height="200" src="https://www.teamup.com/wp-content/uploads/2021/04/AndreasHeigl.jpg" alt="" title="AndreasHeigl" srcset="https://www.teamup.com/wp-content/uploads/2021/04/AndreasHeigl.jpg 200w, https://www.teamup.com/wp-content/uploads/2021/04/AndreasHeigl-150x150.jpg 150w" sizes="(max-width: 200px) 100vw, 200px" class="wp-image-6297" /> Andreas Heigl Software Engineer Work With Us Special Thanks to Our Translators TABLE OF CONTENTS About UsA Product Serving Millions of UsersA Globally Distributed TeamJenny ZhanGabriel SidlerJordi BoggianoSarah SchneiderCristian BujoreanuOtomar NemecekAnnie MuellerMiranda RingOrlando WenzingerAndreas HeiglWork With UsSpecial Thanks to Our Translators'
