["https://www.teamup.com/getting-started"]
title = "Getting Started - Teamup.com"
full_description = 'Getting Started with Teamup Create a Free Calendar Try a Live Demo 🌱 Quick Tour 🖼️ Create a Calendar 🎯 Set Up Sub-calendars 📅 Share with Users 🎥 Set Default Calendar Views Teamup Calendar is much more than an ordinary calendar. It helps groups as well as individuals plan, organize, access and share information more efficiently. Whether you need to organize teams, schedule work, manage resource availability, or plan events and share information, Teamup makes it easy for you to create the calendar solution you need. It’s simple, highly customizable, and scalable. Take a Quick Tour Learn more: Color-coded sub-calendars for teams, resources, projects, locations, workflow, anything you need to organize or schedule. 11 calendar views beyond the ordinary calendar grid, including scheduler, timeline, table and year views. Calendar URL for each access, with or without user account, configurable with 9 levels of access permissions. Assigning one event to multiple calendars, creating custom fields for non-standard text fields, choice fields and number fields. Options menu for easy adjustment of calendar resolution, languages, notifications, iCalendar feeds and other preferences. Sophisticated and reliable time zone support, in particular, leaving no confusion for Daylight Saving Time changes in all time zones. Powerful event filtering for keywords, sub-calendars, custom fields. Branding with your logo and header colors! Create a New Calendar Click the green button below to create a calendar Fill out the form. If you already have a Teamup account, login. Otherwise enter your email address. You’d be required to create a user account. Once your calendar is ready, open it and build the solution you need. Not sure yet? Watch the video and try a live demo yourself. Create a Calendar Try a Live Demo Setting Up Sub-Calendars Setting up sub-calendars according to your needs is like a blueprint needs to be designed for the purpose of the building. Consider adding sub-calendars for the most distinctive aspect of who/what/where of events when the benefits associated with sub-calendars are important to you. For example, if it is important to prevent double-booking of a room, you’d need a sub-calendar for the room since disallowing double-booking is only applicable to individual sub-calendars. Read more → <img loading="lazy" fetchpriority="high" decoding="async" width="1080" height="1080" src="https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration.png 1080w, https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration-980x980.png 980w, https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration-480x480.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1080px, 100vw" class="wp-image-4720" /> <img loading="lazy" loading="lazy" decoding="async" width="1080" height="1080" src="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch.png 1080w, https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch-980x980.png 980w, https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch-480x480.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1080px, 100vw" class="wp-image-3956" /> <img loading="lazy" loading="lazy" decoding="async" width="1080" height="1080" src="https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration.png 1080w, https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration-980x980.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration-480x480.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1080px, 100vw" class="wp-image-4951" /> <img loading="lazy" loading="lazy" decoding="async" width="1080" height="1080" src="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization.png 1080w, https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization-980x980.png 980w, https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization-480x480.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1080px, 100vw" class="wp-image-3955" /> How to add sub-calendars Go to Settings > Calendars Alternatively, click Add/Edit below the sub-calendar list Click New Good to know You can create a new sub-calendar or add a Calendar feed from another calendar There are 48 colors available and reusable for the sub-calendars How to Set Up Color-coded Sub-calendars Learn more How to decide what sub-calendars to create Difference between a master calendar and sub-calendars Event fields 15 ways to set up sub-calendars 15 ways to use custom fields Use folders to organize the sub-calendars in a hierachical structure Share Your Calendar with Users Once you have the sub-calendars set up, you are ready to share the calendar with other users. Depending on what you want the users to do with the calendar, you may customize the access permission for each user or user group. There are 9 levels of access permissions, from read-only, add only to modify one’s own events but not changing events created by others, and from no access at all to events on selected sub-calendars to full rights to modify or administer the calendar. Demonstrated below are calendar views seen by four different users: <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-admin.png" alt="holbrook calendar admin" title="holbrook calendar admin" srcset="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-admin.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/holbrook-admin-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/holbrook-admin-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5793" /> Administrator Access, full rights, limit to few <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-superintendent.png" alt="holbrook superintendent calendar view" title="holbrook superintendent calendar view" srcset="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-superintendent.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/holbrook-superintendent-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/holbrook-superintendent-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5794" /> Modify Access for coordinators, team leads <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-crew-mw2-list.gif" alt="Construction crew calendar view with job details" title="holbrook crew mw2 list" class="wp-image-5807" /> Read-only access for crews, with job details <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-HR.png" alt="holbrook HR calendar view" title="holbrook HR calendar view" srcset="https://www.teamup.com/wp-content/uploads/2021/04/holbrook-HR.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/holbrook-HR-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/holbrook-HR-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5799" /> Limited overview of staff time off for HR team How to share calendar Go to Settings > Sharing Add User or Create Link. Good to know Adding account-based users requires the user to create a Teamup user account and benefit from the account dashboard. Device and browser independent. Sharing via links: No user account is needed. The Calendar is simply accessible via the link. How to Share Calendar and Customize Access Learn more Share calendar securely with customized access How to set up access with users, groups, and links How to manage account-based users The 9 levels of access permissions Difference between a calendar and a user account What you need to know about administrator access Choosing the Default Calendar View Teamup supports 11 calendars views. You may be familiar with calendars displayed in Day/Multi-day/Week/Multi-week/Month/Agenda/List views. With Teamup, you can also display the calendar data in Scheduler view, Timeline view, Table view and Year view. <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/scheduler-view.png" alt="scheduler view" title="scheduler view" srcset="https://www.teamup.com/wp-content/uploads/2021/04/scheduler-view.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/scheduler-view-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/scheduler-view-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5915" /> Scheduler View (Live Demo) <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/timeline-view.png" alt="timeline view" title="timeline view" srcset="https://www.teamup.com/wp-content/uploads/2021/04/timeline-view.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/timeline-view-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/timeline-view-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5916" /> Timeline View (Live Demo) <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/table-view.png" alt="holbrook HR calendar view" title="holbrook HR calendar view" srcset="https://www.teamup.com/wp-content/uploads/2021/04/table-view.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/table-view-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/table-view-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5919" /> Table View (Live Demo) <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/04/year-view.png" alt="year view" title="year view" srcset="https://www.teamup.com/wp-content/uploads/2021/04/year-view.png 1280w, https://www.teamup.com/wp-content/uploads/2021/04/year-view-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/04/year-view-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-5917" /> Year View (Live Demo) How to use calendar views Go to Settings > Calendar Views Set the default view Enable or disable and configure the other views Good to know If most of your events are bound to specific hours, choose a view from the week / multi-day / day / scheduler / timeline / agenda as the default view. Otherwise, use a long term view like the month / multi-week / year / table as the default views. How to Use Calendar Views Learn more Versatile look of the timeline view Annual planning with the year view 12 ways to view a conference agenda Printable calendars in diverse calendar grid How to use fewer keystrokes when entering calendar data How to consolidate multiple master calendars into one single view Use link parameters to set temparary views Read More: Getting Started for Calendar Administrator Knowledge Base Blog Glossary Quick Tips Visual Tips Wall of Love TABLE OF CONTENTS Getting Started with TeamupTake a Quick TourCreate a New CalendarSetting Up Sub-CalendarsHow to add sub-calendarsGood to knowLearn moreShare Your Calendar with UsersHow to share calendarGood to knowLearn moreChoosing the Default Calendar ViewHow to use calendar viewsGood to knowLearn more'
