full_description = 'Gallery of Visual Tips There are many ways to use Teamup. Depending on your needs and specific requirements, the features that are relevant to you vary. Our visual tips help you quickly understand what to do when you need a particular function and how to achieve your goal. Simply use your browser’s search function (e.g. Ctrl-F) to search for the keywords that might best describe what you need, then click the thumbnail to see a big version of it. <img loading="lazy" fetchpriority="high" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/12/retreat-schedule-calendar-view-inspiration-400x284.png" alt="Inspiration for a retreat schedule" srcset="https://www.teamup.com/wp-content/uploads/2020/12/retreat-schedule-calendar-view-inspiration.png 479w, https://www.teamup.com/wp-content/uploads/2020/12/retreat-schedule-calendar-view-inspiration-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4953" /> Retreat ScheduleNeed to show important retreat info? Use our “list view” feature to see upcoming events at a glance. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/12/OpC1CdNqSc6eYARBXrqG_Visuals-1-400x284.png" alt="Yearly company event calendar sub-calendar inspiration" srcset="https://www.teamup.com/wp-content/uploads/2020/12/OpC1CdNqSc6eYARBXrqG_Visuals-1.png 479w, https://www.teamup.com/wp-content/uploads/2020/12/OpC1CdNqSc6eYARBXrqG_Visuals-1-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4952" /> Yearly Company Event CalendarBig company with too many events to track? Switch between company-wide and regional events with ease! <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration-400x284.png" alt="Family calendar sub-calendar inspiration" srcset="https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration.png 479w, https://www.teamup.com/wp-content/uploads/2020/12/family-calendar-sub-calendar-inspiration-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4951" /> Family CalendarBig family? Set up sub-calendars for each family member to keep everyone in the loop! <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/12/add-personality-to-your-calendar-with-logo-400x284.png" alt="Add more personality to your calendar" srcset="https://www.teamup.com/wp-content/uploads/2020/12/add-personality-to-your-calendar-with-logo.png 479w, https://www.teamup.com/wp-content/uploads/2020/12/add-personality-to-your-calendar-with-logo-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4950" /> Add Personality to Your CalendarWant to add your own flair to your calendar? Personalize with your logo, brand colors, and more! <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration-400x284.png" alt="Two teams, one calendar" srcset="https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration.png 479w, https://www.teamup.com/wp-content/uploads/2020/11/two-teams-one-calendar-sub-calendar-inspiration-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4720" /> Two Teams, One CalendarWhen you manage more than one team but need to keep data separate. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/11/use-another-calendar-as-a-go-between-400x284.png" alt="Utilize a different calendar program to act as a go between" srcset="https://www.teamup.com/wp-content/uploads/2020/11/use-another-calendar-as-a-go-between.png 479w, https://www.teamup.com/wp-content/uploads/2020/11/use-another-calendar-as-a-go-between-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4719" /> Utilize CRM with TeamupConnect to a CRM via an alternate ‘go-between’ calendar. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/11/week-start-date-400x284.png" alt="week-start-date" srcset="https://www.teamup.com/wp-content/uploads/2020/11/week-start-date.png 479w, https://www.teamup.com/wp-content/uploads/2020/11/week-start-date-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4844" /> Local Week Start DateWhen you need to vary from the universal calendar week start date. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/11/how-to-access-your-previous-invoices-400x284.png" alt="how-to-access-your-previous-invoices" srcset="https://www.teamup.com/wp-content/uploads/2020/11/how-to-access-your-previous-invoices.png 479w, https://www.teamup.com/wp-content/uploads/2020/11/how-to-access-your-previous-invoices-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4845" /> Access Your Previous InvoicesFind invoices for your billing records. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/11/time-zone-indicators-400x284.png" alt="Find your time zone indicator in your menu or bottom of screen" srcset="https://www.teamup.com/wp-content/uploads/2020/11/time-zone-indicators.png 479w, https://www.teamup.com/wp-content/uploads/2020/11/time-zone-indicators-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-4718" /> Time-Zone IndicatorsNeed to locate and adjust your timezone? <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/11/distinguish-between-account-and-link-access-on-