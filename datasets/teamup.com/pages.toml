["https://teamup.com/event/show/id/bfWBztv2zjVGYTPPRKLd9PcRWX1RVL"]
title = "Teamup Ticker"
description = """
You can upload files, such as documents, images, and audio, to Teamup. 
If you're using the Teamup app on iOS, and want to upload an audio file, you need to make sure the audio file is saved to Files. Then you can access and upload it to a Teamup event. 
For example, here's how you would upload an iOS voice memo to Teamup:

Open the voice memos app. 
Tap the three dot menu next to a recorded memo.
Tap Share. 
Tap Save to Files.
Tap Save. 
Go to Teamup. 
Open or create an event.
Tap Upload in the Description or Attachments field. 
Tap From Files. 
Locate the voice memo in the files library and select it to upload.    

Since audio files are saved by default within the app where they are created on an iOS device, the extra step of moving it to your Files system is necessary. Unfortunately, this is not something Teamup can control."""
full_description = "If you're using the Teamup app on iOS, and want to upload an audio file, you need to make sure the audio file is saved to Files. Then you can access and upload it to a Teamup event. Since audio files are saved by default within the app where they are created on an iOS device, the extra step of moving it to your Files system is necessary. Unfortunately, this is not something Teamup can control."
