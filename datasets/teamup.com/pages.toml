["https://teamup.com/event/show/id/eB86zPMpQvdSVWRBp4zPfxswfgPZ3a"]
title = "Teamup Ticker"
description = """
Teamup offers several types of notifications. Teamup account users can set up and manage their own notification subscriptions.
Calendar administrators can set up notifications for someone with account-based access to the calendar and for those who use a link to access the calendar. 
Set up notifications 

Open Teamup in a browser.
Go to Settings > Notifications.
Click New (top right) then select the notification type from the options: 

Email Notifications
Daily Agenda
Slack Notifications


To set up notifications for an account-based user: In the Recipient box, start typing in the name or email address of a calendar user or click the arrow to choose from the list of users, then click Continue.
To set up notifications for someone with link-based access: In the Recipient box, type in their email address, click on the matching email address when it appears below the field, then click Continue.
On the next screen, set up the subscription options for this recipient. Click Save.   
Security caution


If setting up notifications for someone with link-based access, you'll need to choose a link for their notifications. Be sure to choose a secure link (typically one with read-only permission) to prevent the recipient from making unauthorized changes to the calendar."""
full_description = "Teamup offers several types of notifications. Teamup account users can set up and manage their own notification subscriptions. Calendar administrators can set up notifications for someone with account-based access to the calendar and for those who use a link to access the calendar. If setting up notifications for someone with link-based access, you'll need to choose a link for their notifications. Be sure to choose a secure link (typically one with read-only permission) to prevent the recipient from making unauthorized changes to the calendar."
