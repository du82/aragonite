ads/2024/10/tu-views-Multiday.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Multiday.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Multiday-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265036" alt="Scheduler view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Scheduler-2.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Scheduler-2.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Scheduler-2-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265037" alt="Week view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Week-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Week-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Week-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265038" alt="Multi-week view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Multiweek-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Multiweek-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Multiweek-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265039" alt="Month view " src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Month-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Month-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Month-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265040" alt="Year view " src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Year-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Year-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Year-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265041" alt="Timeline view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Timeline-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Timeline-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Timeline-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265042" alt="Table view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-view-Table-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-view-Table-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-view-Table-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265043" alt="Agenda view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Agenda-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Agenda-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Agenda-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" class="img-fluid wp-image-265044" alt="List view" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-List-1.png" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-List-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-List-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" /> Visualize beyond the conventional calendar views Overview Scheduler Table View Year View Timeline Multi-week Multi-day <img loading="lazy" loading="lazy" decoding="async" width="912" height="504" src="https://www.teamup.com/wp-content/uploads/2024/09/calendar-views-11.png" alt="11 Powerful Calendar Views" title="" srcset="https://www.teamup.com/wp-content/uploads/2024/09/calendar-views-11.png 912w, https://www.teamup.com/wp-content/uploads/2024/09/calendar-views-11-480x265.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 912px, 100vw" class="wp-image-264833 " /> 11 Powerful Calendar Views Shift between the classic Day, Week, and Month to the unique Table, Timeline, and Scheduler. Work with a single year on one page to manage long-term scheduling and planning. Configure the date range for incremental daily planning or high-level, multi-year overviews. With Teamup, you have more ways to view the same data for better insights and resource planning, faster decision-making, and easier collaboration. View a full year's worth of events in Year view, Table view, or 52-week view. Adjust the resolution to zoom in or out for the perspective you need. Configure calendar view defaults for the way you work. Learn more → <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Scheduler-2.png" alt="See calendar events side-by-side" title="" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Scheduler-2.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Scheduler-2-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" class="wp-image-265036 " /> See calendar events side-by-side Scheduler view is a unique calendar view which shows each sub-calendar in its own column. Seeing events from each calendar side-by-side is a great way to compare schedules and availability. See events from multiple calendars next to each other to easily compare availability for resources, people, and more. Toggle sub-calendar visibility and use built-in filters to view only the relevant events. Focus on a single day or view up to 5 years at a time with adjustable resolution. Learn more → <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-view-Table-1.png" alt="A spreadsheet-like calendar view" title="" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-view-Table-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-view-Table-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" class="wp-image-265042 " /> A spreadsheet-like calendar view Table view is a unique, spreadsheet-like format that displays each calendar event field as a column and each event in its own row. The result is a powerful layout for working with time-based information and using your data without having to leave the calendar. Work with built-in filters, toggle sub-calendars, and find or compare data. See the sum of numerical field contents and for event duration over any date range. Adjust the visible columns to see the fields that are relevant to your task. Learn more → <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Year-1.png" alt="A whole year at a glance" title="" srcset="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Year-1.png 900w, https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Year-1-480x299.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 900px, 100vw" class="wp-image-265040 " /> A whole year at a glance Plan and track events, milestones, and activities throughout the year on one page. Keep the big picture in mind with Year view. Adjust the number of months to focus on the current quarter or academic block, or view the whole year for long-range planning and scheduling. Visualize the entire year’s events on a single page. Preview milestones for every area in a unified overview. With a clear overview, prevent resource bottlenecks before they happen. Learn more → <img loading="lazy" loading="lazy" decoding="async" width="900" height="560" src="https://www.teamup.com/wp-content/uploads/2024/10/tu-views-Timeline-1.png" alt="One row for each resource" title="" srcset="https://www.teamup.'''
