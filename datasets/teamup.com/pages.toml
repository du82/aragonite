, 100vw" class="wp-image-7623" /> Job details with site pictures and PDFs <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/09/Holbrook-year-view-filtered-by-one-sub-calendar.png" alt="" title="annual planning with toggle" srcset="https://www.teamup.com/wp-content/uploads/2021/09/Holbrook-year-view-filtered-by-one-sub-calendar.png 1280w, https://www.teamup.com/wp-content/uploads/2021/09/Holbrook-year-view-filtered-by-one-sub-calendar-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/09/Holbrook-year-view-filtered-by-one-sub-calendar-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-7581" /> Year view of filtered jobs by type <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2021/09/table-view.png" alt="" title="live demo subcontra" srcset="https://www.teamup.com/wp-content/uploads/2021/09/table-view.png 1280w, https://www.teamup.com/wp-content/uploads/2021/09/table-view-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2021/09/table-view-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-7627" /> Table view instead of spreadsheets <img loading="lazy" loading="lazy" decoding="async" width="158" height="300" src="https://www.teamup.com/wp-content/uploads/2022/09/constructionaccess-mobile-158x300.jpeg" alt="construction worker field access to job details" title="construction worker field access to job details" srcset="https://www.teamup.com/wp-content/uploads/2022/09/constructionaccess-mobile-158x300.jpeg 158w, https://www.teamup.com/wp-content/uploads/2022/09/constructionaccess-mobile.jpeg 335w" sizes="(max-width: 158px) 100vw, 158px" class="wp-image-9552