rprise" class="wp-image-7993" /> <img loading="lazy" decoding="async" width="104" height="72" src="https://www.teamup.com/wp-content/uploads/2021/12/customer-logo-03.png" alt="Hilton" title="Hilton" class="wp-image-7994" /> <img loading="lazy" decoding="async" width="107" height="76" src="https://www.teamup.com/wp-content/uploads/2021/12/customer-logo-04.png" alt="84 Lumber" title="84 Lumber" class="wp-image-7995" /> <img loading="lazy" decoding="async" width="117" height="72" src="https://www.teamup.com/wp-content/uploads/2022/05/customer-logo-08.png" alt="World Economic Forum" title="World Economic Forum" class="wp-image-9168" /> <img loading="lazy" decoding="async" width="94" height="73" src="https://www.teamup.com/wp-content/uploads/2021/12/customer-logo-05.png" alt="United Nations" title="United Nations" class="wp-image-7996" /> Build your own calendar or start from a template Choose a template below and dive right into Teamup, or browse the templates library → Team Calendar <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/07/live-demo-team-calendar-300x169.png" width="300" height="169" alt="Live demo team calendar" class="wp-image-19410 alignnone size-medium" style="display: block; margin-left: auto; margin-right: auto;" /> Team & Rooms <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/07/team-room-planner-week-300x169.png" width="300" height="169" alt="Template for team and room planner in week view" class="wp-image-19561 alignnone size-medium" style="display: block; margin-left: auto; margin-right: auto;" /> Fleet Vehicles <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-c3-300x169.png" width="300" height="169" alt="Fleet vehicle schedule" class="wp-image-20317 aligncenter size-medium" /> Project Planner <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/07/yearly-planner-300x16