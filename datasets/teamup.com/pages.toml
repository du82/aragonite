, https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-04-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-04-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> <img loading="lazy" decoding="async" width="1062" height="768" class="img-fluid wp-image-5097" alt=" " src="https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-05.png" srcset="https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-05.png 1062w, https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-05-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-05-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> <img loading="lazy" decoding="async" width="1062" height="768" class="img-fluid wp-image-5098" alt=" " src="https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability.gif"/> <img loading="lazy" decoding="async" width="1062" height="768" class="img-fluid wp-image-5099" alt=" " src="https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-06.png" srcset="https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-06.png 1062w, https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-06-980x709.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/cal-manage-availability-06-480x347.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1062px, 100vw" /> How People Use Teamup <img loading="lazy" decoding="async" width="193" height="179" src="https://www.teamup.com/wp-content/uploads/2020/12/john-kaddis-1.png" alt="" title="john-kaddis" class="wp-image-5438" /> “We are a cancer treatment hospital, medical center, basic science and clinical research facility for type 1 diabetes, and have a graduate school for training scientists of the future. We use Teamup in our Diabetes and Metabolism Research Institute because we can no longer freely use all of the equipment, instruments, and services available in our building without first controlling traffic in our labs and specialty rooms. It is a terrific solution.” John Kaddis, Assistant Professor, City of Hope National Medical Center Share your story “We are a professional ballet company in NY (with approx. 90 dancers), along with the school for students ages 3-18. We house 9 studios total, shared among different programs and departments (including outside rentals). It is immensely efficient to have a streamlined system (our old way was having an excel spreadsheet that didn’t allow remote access) that is simple yet effective.” Miki Shintani, Rehearsal Planning Manage, American Ballet Theatre Read more stories <img loading="lazy" decoding="async" width="800" height="533" src="https://www.teamup.com/wp-content/uploads/2020/12/jazz.png" alt="" title="jazz" srcset="https://www.teamup.com/wp-content/uploads/2020/12/jazz.png 800w, https://www.teamup.com/wp-content/uploads/2020/12/jazz-480x320.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 800px, 100vw" class="wp-image-5104" /> Room Reservation for Jazz Students & Faculty Instead of a reservation list on the door, everyone can now check the availability of 30+ rooms and make reservations in real time anywhere on the go. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/05/thomas-peham-7UTgWorEKEI-unsplash.jpg" alt="" title="user-story-4x4" /> Managing Riding Stable Visits During Corona with Teamup Visits to the barn must be carefully organized during the pandemic. It’s a challenge to manage riding stables. <img loading="lazy" decoding="async" width="672" height="449" src="https://www.teamup.com/wp-content/uploads/2021/04/study-skills-tutoring.png" alt="" title="study skills tutoring" srcset="https://www.teamup.com/wp-content/uploads/2021/04/study-skills-tutoring.png 672w, https://www.teamup.com/wp-content/uploads/2021/04/study-skills-tutoring-480x321.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 672px, 100vw" class="wp-image-6094" /> Teamup Helps Schedule Hundreds of Tutoring Sessions This Study Skills Center uses Teamup to manage the tutor availability and schedule tutoring sessions for around 100 tutors who assists over 400 students Read More User Stories Feature Highlights Organize with Colors Use color-coded sub-calendars to organize people, places, or events. Assign a sub-calendar to a team member, a resource, a project, a process… anything! Arrange sub-calendars in folders and show or hide as needed. Powerful Filters Find specific events or event types quickly. Filter by sub-calendar, keyword, or custom event field, or combine filters for specialized searches. Use search operators and view event details in search results. Flexible, Practical Work efficiently with specific recurrence rules and defaults to prevent double booking. Use and customize 9 calendar views for long-term planning, granular scheduling on a time grid, or examining with visual and textual details. 9 Access Levels Manage centrally with 9 levels of access permissions to allow the right calendar access for the right person or team. Use add-only and modify-from-same-link to track changes. Use a read-only option for secure sharing without data risk. Sync with Feeds Easily aggregate a single view of multiple resources via iCalendar feeds from other calendar systems or from Teamup Calendars managed by other groups. Send read-only feeds to other calendars. Read More How Teamup Is Different Get Started:Organize with Sub-calendars <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-manage-availability-06.png" alt="" title="sub-manage-availability-06" class="wp-image-5108" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-manage-availability-02.png" alt="" title="sub-manage-availability-02" class="wp-image-5109" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-manage-availability-03.png" alt="" title="sub-manage-availability-03" class="wp-image-5110" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-manage-availability-04.png" alt="" title="sub-manage-availability-04" class="wp-image-5111" /> <img loading="lazy" decoding="async" width="240" height="300" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-manage-availability-05.png" alt="" title="sub-manage-availability-05" class="wp-image-5112" /> How to Use Color-coded Sub-calendars and Folders How to Share with Customized Calendar Links Learn More Knowledge Base Blog Wall of Love Quick Tips Glossary TABLE OF CONTENTS Manage AvailabilityMore visibility, better resource use, easier bookingThumbs Gallery TitleHow People Use TeamupJohn Kaddis, Assistant Professor, City of Hope National Medical CenterMiki Shintani, Rehearsal Planning Manage, American Ballet TheatreRoom Reservation for Jazz Students & FacultyManaging Riding Stable Visits During Corona with TeamupTeamup Helps Schedule Hundreds of Tutoring SessionsFeature HighlightsOrganize with ColorsPowerful FiltersFlexible, Practical9 Access LevelsSync with FeedsGet Started: Organize with Sub-calendarsLearn More'
