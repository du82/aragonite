100vw" /> <img loading="lazy" decoding="async" width="1280" height="720" class="img-fluid wp-image-20314" alt=" Fleet schedule displayed in Day view" src="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-day.png" srcset="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-day.png 1280w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-day-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-day-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" /> <img loading="lazy" decoding="async" width="1920" height="1081" class="img-fluid wp-image-20317" alt=" Fleet schedule in Scheduler view with empty columns hidden" src="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-c3.png" srcset="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-c3.png 1920w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-c3-1280x721.png 1280w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-c3-980x552.png 980w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-schedule-c3-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1920px, 100vw" /> <img loading="lazy" decoding="async" width="1280" height="720" class="img-fluid wp-image-264180" alt=" New fleet schedule created from template calendar" src="https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule.png" srcset="https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule.png 1280w, https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" /> Use template <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/06/quote-mark-green.png" width="80" alt="" class="wp-image-19141 alignleft" />“We are using Teamup for fleet scheduling. It has worked well. We have several departments with a small fleet that they manage themselves. We have been able to give them access to schedule their own vehicles. Our Brain Injury department has also started using it to schedule their visits with their clients.“ Amber Baatrup Why use this template 📣 Benefits for the organization Bring visibility of vehicle availability to all users directly and eliminate administrative workload. Enable service personnel to schedule their own vehicles. Track vehicle usage over time easily. Find the best time for vehicle maintenance without interrupting daily operations. 🎨 Benefits for the end users View vehicle availability in real-time and easily spot available booking options. Self-book vehicles as needed without unnecessary delays. Notable setup in this template <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/06/event-fields.png" width="44" height="44" alt="" class="wp-image-18688 alignleft size-full" /> No overlapping setting prevents vehicles from being double-booked. <img loading="lazy" loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2024/06/calendar-views.png" width="44" height="44" alt="" class="wp-image-18689 alignleft size-full" /> Default to Scheduler view with vehicles listed side-by-side. <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-no-overlapping.png" alt="fleet vehicle no overlapping" title="fleet vehicle no overlapping" srcset="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-no-overlapping.png 1280w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-no-overlapping-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-no-overlapping-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-20324" /> <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule.png" alt="Fleet schedule - scheduling for multiple vehicles" title="Fleet schedule - scheduling for multiple vehicles" srcset="https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule.png 1280w, https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2024/09/from-template-fleet-schedule-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-264180" /> How to use this template ⚙️ Set it up and adapt to your needs Create your own booking calendar using the template. Adjust sub-calendar names, colors, etc. and add more vehicles as needed. Review and adapt all settings as needed, in particular, adjust the date range and resolution of the scheduler view to better meet your needs. Set up customized access for your users. Use modify-my-events permission to allow users to add and edit their own bookings. <img loading="lazy" loading="lazy" decoding="async" width="1280" height="720" src="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-share-permission.png" alt="fleet vehicle user access config" title="fleet vehicle user access config" srcset="https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-share-permission.png 1280w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-share-permission-980x551.png 980w, https://www.teamup.com/wp-content/uploads/2024/07/fleet-vehicle-share-permission-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1280px, 100vw" class="wp-image-20327" /> 💡Pro tip: Customize access permissions for each individual user or department. 💡Tips for using the fleet vehicle schedule template Click the eye icon in the calendar list to show or hide bookings for individual vehicles. Check “Hide empty columns” to show only vehicles with existing bookings for the period displayed (use the arrows to navigate to other periods). Click and hold an empty area, drag over the slot you want to book the vehicle to open the editor with the time pre-selected. This method typically also prevents booking conflicts at saving. Drag & drop an event to move. Ctrl-drag & drop to copy. Discover the right-click context menu. Explore the blue drop-down menu in the top right. Get the app <img loading="lazy" loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2020/09/homepage-app-store.png" width="290" height="88" alt="" class="wp-image-4008 alignnone size-full" /> iPhone & iPad <img loading="lazy" loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2020/09/homepage-google-play.png" width="290" height="88" alt="" class="wp-image-4009 alignnone size-full" /> Android devices TABLE OF CONTENTS Fleet Vehicle Scheduling TemplateWhy use this template📣 Benefits for the organization🎨 Benefits for the end usersNotable setup in this templateHow to use this template⚙️ Set it up and adapt to your needs💡Tips for using the fleet vehicle schedule template'
