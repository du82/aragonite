title = "Teamup Ticker"
description = """
Each Teamup master calendar is managed separately. A subscription applies to one master calendar only and is managed in the calendar settings. Only calendar administrators can access the calendar settings. 
The billing contact for a Teamup Calendar is the person who is responsible for the billing. They receive communication related to the calendar subscription. The billing contact is often the card holder or procurement officer for an organization.
The calendar administrator and the billing contact are often different people working in distinct roles. Often, the billing contact is responsible only for paying the calendar subscription and does not need access to the full calendar settings for any reason. In these cases, the administrator can simply send a payment/billing update link to the billing contact as needed.
Send the billing form via separate link    

Open Teamup in a browser. 
Go to Settings > Subscription. 
Scroll to the Billing section. 
Click the Open billing form in a separate page link. 
Copy the link for the page that opens and send this link to the billing contact. Thru this link, the billing contact can add/update billing details, add/update payment information, and make a payment."""
