title = "Teamup Ticker"
description = """
Teamup supports configurable default event fields and custom event fields.
We've added a new type of custom event field: Formatted text fields. 
Formatted text fields provide a large text area with formatting and linking options. It’s similar to the Description field (but without file uploading ability). This special custom field comes with configurable visibility control for users with different access permissions.

You can choose whether each formatted text field is visible to all users or only to users with modify permission. This creates powerful customization options for better workflows and protection of sensitive information. For example:

Use a formatted text field for notes visible only to office staff with modify permission, hidden from crew members with read-only permission.
Use a formatted text field to make some details visible to staff members but hidden from external contributors without modify permission.
Use a formatted text field to discuss event details among group coordinators, but hidden from group members who have read-only access.

Learn more about formatted text fields."""
