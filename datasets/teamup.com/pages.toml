full_description = 'Subscription Plans We offer a free service with up to 8 sub-calendars and 8 account-based users. Shareable calendar links can be used to serve an unlimited number of anonymous users. All prices below are in USD per master calendar. No credit card is required during a free trial. PLUS Billed yearly $10/mo $12 billed monthlyIncludes:• 12 sub-calendars• 12 account users• 1 custom field• 2GB storage for attached files• Daily Agenda• 5-year historical data• 4-hour sync frequency for inbound iCal feeds 3-day free trial PRO Billed yearly $25/mo $29 billed monthlyIncludes:• 25 sub-calendars• 25 account users• 5 custom fields• 20GB storage for attached files• 1-hour sync frequency for inbound iCal feeds• Option to add more account users ($3 per user/month) 3-day free trial BUSINESS Billed yearly $60/mo $69 billed monthlyIncludes:• 70 sub-calendars• 50 account users• 20 custom fields• 100GB storage for attached files• 15-min sync frequency for inbound iCal feeds• 10-year historical data• Option to add more sub-calendars ($10 per mon/pack of 10 calendars) 3-day free trial ENTERPRISE Billed yearly $105/mo $129 billed monthlyIncludes:• 150 sub-calendars• 100 account users• 50 custom fields• 400GB storage for attached files• Single sign-on (SSO)• Option for consolidated billing• Call back support 3-day free trial Compare Plans FREE PLUS PRO BUSINESS ENTERPRISE Support <img loading="lazy" decoding="async" class="wptb-image-element-target" height="64" width="64" src="https://www.teamup.com/wp-content/uploads/2021/01/pricing-yes-1.png" style="width: 100%">Email <img loading="lazy" decoding="async" class="wptb-image-element-target" height="64" width="64" src="https://www.teamup.com/wp-content/uploads/2021/01/pricing-yes-1.png" style="width: 100%">Email <img loading="lazy" decoding="async" class="wptb-image-element-target" height="64" width="64" src="https://www.teamup.com/wp-content/uploads/2021/01/pricing-yes-1.png" style="width: 100%">Email <img loading="lazy" d