["https://www.teamup.com/resource-bookings"]
title = "Resource Bookings - Teamup.com"
description = "A company has several meeting rooms available. The different rooms can accommodate a different number of people. Sales staff can use these rooms as needed for client meetings, either in-person or to set up a video conference."
full_description = 'Manage Booking for Shared Spaces and Resources THE CASE A company selling specialized dentistry equipment has several meeting rooms available. The different rooms can accommodate a different number of people. Sales staff can use these rooms as needed for client meetings, either in-person or to set up a video conference. In addition, the company has several shared resources to be used by the sales team and other staff members. THE NEED Members of the sales team need to book the spaces and resources they need individually, without double-booking or needing to wait for approval. <img loading="lazy" fetchpriority="high" decoding="async" width="1080" height="719" src="https://www.teamup.com/wp-content/uploads/2020/05/meeting-room.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/meeting-room.png 1080w, https://www.teamup.com/wp-content/uploads/2020/05/meeting-room-980x652.png 980w, https://www.teamup.com/wp-content/uploads/2020/05/meeting-room-480x320.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1080px, 100vw" class="wp-image-1625" /> SOLUTION SUMMARY 🎨 Color-coded sub-calendars 🧐 Customized calendar access 🔎 Filter calendar events 🗓 Compare schedules at a glance 👋 The step-by-step guide 👍 Powerful calendar features ✅ Customize your booking calendar The Solution Assign one color-coded sub-calendar per space or resource. Disallow double-booking. Block out unavailable times. Provide add-only calendar access for self-booking needs. <img loading="lazy" loading="lazy" decoding="async" width="198" height="297" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.48.17-PM.png" alt="" title="" class="wp-image-1510" /> Prevent double-booking with color-coded sub-calendars. Each shared space or resource has its own color-coded sub-calendar. Set each sub-calendars to disallow double-booking. No more scheduling conflicts. Organize sub-calendars in folders: one for spaces, one for resources. Anyone can turn an entire folder on or off from view when using the calendar to see only what is relevant. Learn about setting up sub-calendars → Delegate bookings to your team without sacrificing security. No more micromanaging. Equip your team to manage their own bookings and keep your calendar secure at the same time. Here’s how: Maya, a member of the sales team, is added as an account-based user. She has modify-from-same calendar access, which means she can add and modify her own bookings, but she cannot modify or delete a booking added by any other team member. Learn about calendar access with individual permissions → <img loading="lazy" loading="lazy" decoding="async" width="1032" height="550" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.08.15-PM.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.08.15-PM.png 1032w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.08.15-PM-980x522.png 980w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.08.15-PM-480x256.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1032px, 100vw" class="wp-image-1511" /> <img loading="lazy" loading="lazy" decoding="async" width="1292" height="652" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.14.47-PM.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.14.47-PM.png 1292w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.14.47-PM-1280x646.png 1280w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.14.47-PM-980x495.png 980w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.14.47-PM-480x242.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1292px, 100vw" class="wp-image-1512" /> Filter all calendar events to find the relevant space or resource quickly. Use built-in filters to search the calendar by sub-calendar, custom event field, or keyword. Maya can filter the calendar for the room she wants to reserve to quickly see open times. Or she can filter the calendar by her own name in the “Who is booking?” custom event field to review her booked rooms and resources. Learn about filters → Compare schedules at a glance with Timeline calendar view. See each shared sub-calendar in its own row. Easily review booked times for resources and shared spaces. View a day, a week, or multiple days or weeks at a time. Set the zoom level to see the details or the big picture. The Timeline view makes it easy to plan time for set up or clean up of shared spaces and resources. Learn about the Timeline view → <img loading="lazy" loading="lazy" decoding="async" width="1246" height="689" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-11-at-11.13.50-AM.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-11-at-11.13.50-AM.png 1246w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-11-at-11.13.50-AM-980x542.png 980w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-11-at-11.13.50-AM-480x265.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1246px, 100vw" class="wp-image-1608" /> Testimonials We are grateful for all the feedback we receive from around the world every day. <img loading="lazy" loading="lazy" decoding="async" width="128" height="128" src="https://www.teamup.com/wp-content/uploads/2020/03/coding-iconArtboard-19-copy-9.jpg" alt="" title="" class="wp-image-429" /> Di Dai, World Economic Forum “Just want to say big THANK YOU, the room booking tool really worked very well, saved us a lot of time and energy. Thank you so much for your patience and continuous support throughout, we really appreciate your great help.“ <img loading="lazy" loading="lazy" decoding="async" width="128" height="128" src="https://www.teamup.com/wp-content/uploads/2020/03/coding-icon_3.jpg" alt="" title="" class="wp-image-419" /> Mathias Steinacher, PhD student “First of all, thanks a lot for your awesome calendar application! We use it as a booking system for our equipment and we are super happy with it!“ <img loading="lazy" loading="lazy" decoding="async" width="128" height="128" src="https://www.teamup.com/wp-content/uploads/2020/03/coding-iconArtboard-19-copy-10.jpg" alt="" title="" class="wp-image-430" /> Sandy, Ireland “We’re using it as a booking system for a car club. We have three cars shared among 13 households and TeamUp is brilliant for allowing us to manage bookings without any hassle or administration costs. Members just block out the times they want a car.“ The Step-by-Step Guide Organize sub-calendars. Add team members as calendar users. Create custom event fields. Configure what’s important to your needs. STEP 1 Set Up Sub-Calendars Add one sub-calendar for each shared space or resource. Disallow overlapping events to prevent double-booking. Organize calendars in folders. Learn more → STEP 2 Add Account Users and Groups Add each team members as an account-based user. Create groups for office staff, delivery crew, sales team, etc. Learn more → <img loading="lazy" loading="lazy" decoding="async" width="768" height="448" src="https://www.teamup.com/wp-content/uploads/2020/05/cef2.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/cef2.png 768w, https://www.teamup.com/wp-content/uploads/2020/05/cef2-480x280.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 768px, 100vw" class="wp-image-1596" /> STEP 3 Create Custom Event Fields Add custom event fields to capture the important information. Use text or emoji to show field contents in event title. Learn more → <img loading="lazy" decoding="async" src="https://www.teamup.com/wp-content/uploads/2020/05/filteredview-1.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/filteredview-1-e1589207999208.png 857w, https://www.teamup.com/wp-content/uploads/2020/05/filteredview-1-e1589207999208-480x270.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 857px, 100vw" class="wp-image-1598" /> STEP 4 Use Filters Quickly check the status of a particular space or resource with filters. Sort by sub-calendar, keyword, or custom event field. Learn more → Features Here are a few of Teamup’s powerful features. 👋 How to share the calendar with my team? Add each team member as an account-based user. Configure precise permission for calendar access. Create user groups. Easily manage all users and groups from calendar settings. See feature → 🔑 What are custom event fields? Event fields–such as Who and Where–are automatically part of each event. You can create and arrange your own custom event fields to capture the information you need. Choose from text entry or predetermined choice options. See feature → 📚 How to avoid double booking? You can choose to set each sub-calendar allow or disallow overlapping events. To prevent double-booking, set the calendar to disallow overlapping events. See feature → 📞 How to use Teamup on a mobile app? Teamup has powerful and convenient mobile apps. Download the free calendar mobile apps for iOS and Android. Log into your Teamup user account to keep your calendar dashboard synced between browser and devices. See feature → 🖼️ How to switch between calendar views? Teamup has 10 unique calendar views to help you make the most of your calendar. Set a default calendar view in calendar settings. Switch between calendar views anytime with the view picker in the top right of the calendar. See feature → 🔁 How to set up repeating events? Choose from detailed options for recurring events on your calendar. Choose the repeating option (daily, weekly, and many more) and set the number of recurrences. See feature → Customize a Booking Calendar Launch a live demo and test drive for yourself. Customize to make it work precisely as you need, and enable more efficient work for your team. Try a live demo <img loading="lazy" loading="lazy" decoding="async" width="1440" height="794" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.42.46-PM.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.42.46-PM.png 1440w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.42.46-PM-1280x706.png 1280w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.42.46-PM-980x540.png 980w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.42.46-PM-480x265.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1440px, 100vw" class="wp-image-1594" /> <img loading="lazy" loading="lazy" decoding="async" width="1294" height="703" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.00.13-PM.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.00.13-PM.png 1294w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.00.13-PM-1280x695.png 1280w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.00.13-PM-980x532.png 980w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-1.00.13-PM-480x261.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1294px, 100vw" class="wp-image-1603" /> Add each team member as a calendar user. Create groups for each department (Sales, Office, Delivery, etc.) to easily manage calendar users who have the same calendar access. <img loading="lazy" loading="lazy" decoding="async" width="942" height="523" src="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.26.21-PM-1.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.26.21-PM-1.png 942w, https://www.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-08-at-12.26.21-PM-1-480x266.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 942px, 100vw" class="wp-image-1614" /> Set each sub-calendar to disallow overlapping events and easily prevent double-booking. For resources with more than one unit available, you can allow overlapping events. Next Steps Get started with your own Teamup calendar now. 🎉 What you get for free Our Basic plan offers a powerful, customizable calendar perfect for small teams. Learn more → 🏆 Subscription plans Need more sub-calendars or account users? Choose from one of our paid plans. Learn more → Ready to get started? All the features you need. Easy to learn. Create a calendar Try a live demo You can also start with a free trial of paid plans with more features, or get inspired by browsing what others say and our million thanks. TABLE OF CONTENTS Manage Booking for Shared Spaces and ResourcesThe SolutionPrevent double-booking with color-coded sub-calendars.Delegate bookings to your team without sacrificing security.Filter all calendar events to find the relevant space or resource quickly. Compare schedules at a glance with Timeline calendar view. TestimonialsDi Dai, World Economic ForumMathias Steinacher, PhD studentSandy, IrelandThe Step-by-Step GuideSTEP 1Set Up Sub-CalendarsSTEP 2Add Account Users and GroupsSTEP 3Create Custom Event FieldsSTEP 4Use Filters Features👋 How to share the calendar with my team?🔑 What are custom event fields?📚 How to avoid double booking?📞 How to use Teamup on a mobile app?🖼️ How to switch between calendar views?🔁 How to set up repeating events?Customize a Booking CalendarAdd each team member as a calendar user. Create groups for each department (Sales, Office, Delivery, etc.) to easily manage calendar users who have the same calendar access.Set each sub-calendar to disallow overlapping events and easily prevent double-booking. For resources with more than one unit available, you can allow overlapping events.Next Steps🎉 What you get for free🏆 Subscription plansReady to get started?'
