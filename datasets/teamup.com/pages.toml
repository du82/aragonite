["https://www.teamup.com/the-timeline-view"]
title = "The Timeline View - Teamup.com"
full_description = 'The Timeline View The calendar Timeline view shows each calendar in its own row, with the option of seeing a day, multiple days, a week, or multiple weeks. It’s easy to compare scheduled events, reserved rooms, shifts, and tasks in this view. The individual rows keep events separated, while the side-by-side view makes it easy to see availability at a glance. If you don’t see Timeline in your viewing options: The calendar administrator may need to enable it in Settings > Calendar Views. Try a Live Demo <img loading="lazy" fetchpriority="high" decoding="async" width="969" height="734" src="https://www.teamup.com/wp-content/uploads/2020/06/timeline-displayed.png" alt="" title="" srcset="https://www.teamup.com/wp-content/uploads/2020/06/timeline-displayed.png 969w, https://www.teamup.com/wp-content/uploads/2020/06/timeline-displayed-480x364.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 969px, 100vw" class="wp-image-3014" /> Same Calendar Data, Many Views See Configuration Options <img loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-week-400x284.png" alt="The Timeline view with a single week at zoom level 3" srcset="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-week.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-week-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3055" /> Timeline View WeekThe Timeline calendar view showing a single week. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-single-day-400x284.png" alt="Timeline calendar view with a single day" srcset="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-single-day.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-single-day-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3054" /> Timeline View DayThe Timeline calendar view showing a single day. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-multiday-400x284.png" alt="The Timeline calendar view on multi-day setting with 5 days" srcset="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-multiday.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-multiday-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3053" /> Timeline View MultidayThe Timeline calendar view showing multiple days: 5 days are in view. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-multi-week2-400x284.png" alt="The Timeline view in Multi Week mode showing 4 weeks at zoom level 7" srcset="https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-multi-week2.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/timeline-calendar-view-multi-week2-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3052" /> Timeline View MultiweekThe Timeline calendar view in Multi Week mode. Here it shows 4 weeks at a time. Feature Tips & Best Practices ⏰ Use zoom level to see the level of details you need Adjust the zoom level in the Timeline calendar view from level 1 to level 10. Set higher for a zoomed-in view of the time grid when you need to compare to-the-minute appointments. Set the zoom level lower when you need to see a big-picture comparison of schedules, appointments, or space bookings. ⏰ Choose the best mode and quickly adjust dates. Choose from single day, multi-day, week, or multi-week mode. Set the number of days or weeks shown in the multi modes. Choose the visible date with the arrows or date picker in the top menu. Working with a smaller screen? Scroll horizontally to view off-screen dates. ⏰ Drag and drop events to different times or sub-calendars. Drag and drop an event to move it to a different time slot on the same calendar row. Or drag and drop an event across rows to move it to a different sub-calendar: easily re-assign tasks to team members or switch shifts. ⏰ Hide or show sub-calendars in Timeline view. Turn sub-calendars on or off by toggling it in the Timeline view to focus only on the events you need to see at the moment, compare relevant schedules, and remove distractions. The row will disappear when you hide the sub-calendar. Hide all sub-calendars in a folder in the same way. Timeline Explained Configure Options The Shift Schedule Choose Your View How can Timeline work for you? Explore the ways Timeline view can make work more efficient. 🏢 Book times and review schedule for shared spaces Let team members book lab time in a shared space. Easily review the schedule, and compare booked hours to ensure fair distribution. The booked events can serve as a lab/research log. ⏰ Compare and track to-the-minute appointments Working with short appointments? This view is great for to-the-minute scheduling often needed by lawyers, accountants, and consultants. Easily compare and track appointments for all team members. <img loading="lazy" decoding="async" src="https://a.slack-edge.com/production-standard-emoji-assets/10.2/apple-medium/1f469-1f3fb-200d-1f52c.png" aria-label="female scientist emoji with light skin tone" alt=":female-scientist::skin-tone-2:" data-stringify-type="emoji" data-stringify-emoji=":female-scientist::skin-tone-2:" /> Manage bookings for research labs and teams If labs have maximum capacity limits, Teamup is a great way to help research teams book lab slots and also equipments. With the Timeline view, it’s easy to see which lab slots are free when, and allow researchers to book the slots from anywhere. 🎯 Create project deadlines and targets A shared project timeline keeps everyone aware and on track, without messy back-and-forth in email or messaging. Set deadlines and targets for each task, project phase, or team member. Drag and drop tasks and events. View a single day or the entire project scope. 🔬 Manage shared equipment and resources See each piece of specialty equipment or any other shared resource in its own row with Timeline. Find open slots quickly, prevent double-booking, and turn off unavailable resources from cluttering your view. <img loading="lazy" decoding="async" src="https://a.slack-edge.com/production-standard-emoji-assets/10.2/apple-medium/1f4de.png" aria-label="telephone receiver emoji" alt=":telephone_receiver:" data-stringify-type="emoji" data-stringify-emoji=":telephone_receiver:" /> Schedule shifts for customer support teams Make customer support shift scheduling a breeze with the Teamup Timeline view. Easily have an overview of the team’s schedule, see if there are any gaps in the roster and find the appropriate team member to assign time sensitive work to. 👥 Compare team schedules to find shared open times Struggling to find an shared open slot for a meeting or review? View calendars for relevant team members in Timeline, scan the needed time period, and find matching available times. ✅ Ensure all roles are covered for each shift or quota Each shift needs a certain number of roles filled by employees or volunteers. Or a certain number of hours in each role are required for the weekly quota. With Timeline, you can compare across days or weeks to make sure each role is assigned correctly. Want to try it out? Select Timeline view from the view selector in the top right of your Teamup calendar. If you don’t see Timeline as an option, append ?view=t to your calendar URL or ask your calendar administrator to enable it in the calendar Settings. Or simply try a live demo. Launch a Timeline Live Demo Just getting started with Teamup? Get inspired by browsing what others say and our million thanks. TABLE OF CONTENTS The Timeline ViewSame Calendar Data, Many ViewsTimeline View WeekTimeline View DayTimeline View MultidayTimeline View MultiweekFeature Tips & Best Practices⏰ Use zoom level to see the level of details you need⏰ Choose the best mode and quickly adjust dates.⏰ Drag and drop events to different times or sub-calendars.⏰ Hide or show sub-calendars in Timeline view.How can Timeline work for you?🏢 Book times and review schedule for shared spaces⏰ Compare and track to-the-minute appointments Manage bookings for research labs and teams🎯 Create project deadlines and targets🔬 Manage shared equipment and resources Schedule shifts for customer support teams 👥 Compare team schedules to find shared open times✅ Ensure all roles are covered for each shift or quotaWant to try it out?'
