title = "No more typing of event dates on a spreadsheet. Use Teamup with Table view instead! - Teamup.com"
description = "No more typing of dates on spreadsheets. Try Teamup in calendar grid or Table view. Use custom fields and filters, get sum and gain insights."
full_description = 'More Than a Calendar No more typing dates on a spreadsheet.Try Teamup in calendar grid or Table view. Create Calendar Try Live Demos <img loading="lazy" decoding="async" width="290" height="88" src="https://www.teamup.com/wp-content/uploads/2020/09/homepage-app-store.png" alt="" title="homepage-app-store" class="wp-image-4008" /> <img loading="lazy" decoding="async" width="290" height="88" src="https://www.teamup.com/wp-content/uploads/2020/09/homepage-google-play.png" alt="" title="homepage-google-play" class="wp-image-4009" /> We get it: Even when Excel isn’t the best choice for planning events or tracking activities, it’s still a familiar option. Maybe you’ve even moved from Excel to Google Sheets, for easier collaboration and sharing. But the limits of a spreadsheet still keep you from getting the most out of your data. Entering dates is clunky. Moving data from a spreadsheet to other applications is error-prone. Monotone visuals make your eyes glaze over. And without the ability to see your data in different formats and levels, you’re missing valuable insights. No more typing dates into a spreadsheet.Try Teamup in calendar grid or Table view. . <img loading="lazy" fetchpriority="high" decoding="async" width="1402" height="551" src="https://www.teamup.com/wp-content/uploads/2022/11/excel-4.jpg" alt="Annual planning on Excel vs on Teamup" title="Annual planning on Excel vs on Teamup" srcset="https://www.teamup.com/wp-content/uploads/2022/11/excel-4.jpg 1402w, https://www.teamup.com/wp-content/uploads/2022/11/excel-4-1280x503.jpg 1280w, https://www.teamup.com/wp-content/uploads/2022/11/excel-4-980x385.jpg 980w, https://www.teamup.com/wp-content/uploads/2022/11/excel-4-480x189.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) and (max-width: 1280px) 1280px, (min-width: 1281px) 1402px, 100vw" class="wp-image-9848" /> Excel original of an annual plan and the same data shown on Teamup: Which one would you prefer? Read more → Teamup Quick Tour See Annual Plan in Year View A calendar that calculates: Teamup’s unique Table view Table view lets you work with time-based information (i.e. events and tasks on a calendar) easily in a spreadsheet-like view. A few unique things you can do on Teamup: Each calendar field can be displayed in a column; each event gets its own row. Set the date range you need: from Day to Year, or a Custom range. Filter easily by single or multiple dimensions: toggle sub-calendars on and off, and filter by keyword, custom field, or a combination. Adjust columns for the way you work: hide or show individual columns, rearrange columns, adjust column width, and sort by column. Let your calendar calculate for you: see an automatic sum for any number field in the bottom row. Sort any column by ascending or descending. Create custom fields for text, numbers, and multiple choices! How to replace some of your spreadsheets with Teamup <img loading="lazy" decoding="async" width="600" height="400" src="https://www.teamup.com/wp-content/uploads/2022/11/replace-spreadsheets.jpg" alt="Teamup replaces spreadsheets" title="Replacing spreadsheets with Teamup" srcset="https://www.teamup.com/wp-content/uploads/2022/11/replace-spreadsheets.jpg 600w, https://www.teamup.com/wp-content/uploads/2022/11/replace-spreadsheets-480x320.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 600px, 100vw" class="wp-image-9886" /> Read more → See a Live Demo in Table view USE CASE EXAMPLE Subcontractor management Quickly find info on a particular project, see where subcontractors are scheduled, review contract status and track material deliveries. Plus, see the sum of any number field, such as contract amounts. Filter to view the total cost of all subcontractors on a project, or by project phase. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2022/08/table-view-calculates.png" alt="" title="customer-logo-09" /> Launch a Live Demo USE CASE EXAMPLE Track customer info for sales Capture all the relevant details. Filter by customer ID or follow-up action. Track sales amounts in a number field and see total customer purchase value automatically. Search for keywords and see full Summary notes by wrapping text. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2022/09/TU-Tableview-image1table.png" alt="" title="customer-logo-09" /> Create Your Own Sandbox Calendar <img loading="lazy" decoding="async" width="400" height="247" src="https://www.teamup.com/wp-content/uploads/2022/11/USA-Insulation.jpg" alt="USA Insulation uses Teamup to calculate install amount" title="USA Insulation uses Teamup to calculate install amount" srcset="https://www.teamup.com/wp-content/uploads/2022/11/USA-Insulation.jpg 400w, https://www.teamup.com/wp-content/uploads/2022/11/USA-Insulation-300x185.jpg 300w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-9929" /> Read the story → CUSTOMER STORY Technical services business: getting the correct info in the CRM system By leveraging the custom field for numbers and calculating install amounts automatically, this service business streamlined their workflow. Before USA Insulation switched to Teamup, the team depended on a paper calendar and an inefficient, tricky process for keeping everyone updated. There was lots of room for error. Now, with Teamup as a core system in their business operation, their workflow is smooth and accurate. With the custom number field, they now have a column to track the price of each job, so by clicking into Table view they can see the amount automatically summed at the bottom. <img loading="lazy" loading="lazy" decoding="async" width="193" height="179" src="https://www.teamup.com/wp-content/uploads/2021/11/teamupthanks.png" alt="" title="teamupthanks" class="wp-image-7892" /> I set up the number field to calculate our install dollars for the month. It helped tremendously to make sure that we had everything accounted for in our CRM correctly. Deanna Cutlip, Office Manager, USA Insulation Read the story → Simple transition from spreadsheets to Teamup Bulk import from .csv files plus batch creation of sub-calendars and user access links makes the transition smooth and painless. CUSTOMER STORY Public school system: pioneering a new way to organize teaching and learning amidst of pandemic With bulk import from .csv files to streamline the setup of Teamup as a remote learning structure, the Canton Vaud public school system kept teaching, safely. It was the beginning of the pandemic. Over 92,000 pupils and almost 10,000 teachers were sent to continue school work remotely. Teamup was chosen as the emergency solution for the unprecedented transition from the classrooms to home schooling. There were tens of thousands of lesson plans prepared by teachers, and available in spreadsheets. To make the lessons accessible to the pupils and their parents, they used Teamup’s bulk import function o automate the process, moving from .csv files to the calendar with speed and simplicity. Families could access class info on a calendar, and teachers could attach detailed learning content directly to their respective lessons. <img loading="lazy" loading="lazy" decoding="async" width="400" height="247" src="https://www.teamup.com/wp-content/uploads/2022/04/vd-schools-t.png" alt="" title="vd schools t" srcset="https://www.teamup.com/wp-content/uploads/2022/04/vd-schools-t.png 400w, https://www.teamup.com/wp-content/uploads/2022/04/vd-schools-t-300x185.png 300w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-8950" /> Read the story → <img loading="lazy" loading="lazy" decoding="async" width="193" height="179" src="https://www.teamup.com/wp-content/uploads/2021/11/teamupthanks.png" alt="" title="teamupthanks" class="wp-image-7892" /> We have very positive feedback from teachers and parents who appreciate the simplicity of the tool and its straightforward ability to send contents to the pupils. Francois Jaeger, Veteran Educator, Cantonal School Administration Read the story → <img loading="lazy" loading="lazy" decoding="async" width="400" height="247" src="https://www.teamup.com/wp-content/uploads/2022/11/motorsport.png" alt="" title="motorsport" srcset="https://www.teamup.com/wp-content/uploads/2022/11/motorsport.png 400w, https://www.teamup.com/wp-content/uploads/2022/11/motorsport-300x185.png 300w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-9834" /> Read the story → CUSTOMER STORY Large national sport organization: jump starting a new way to collect and share local club events With bulk creation of sub-calendars and access links, this busy non-profit organization made it easy for members across all regions to find their events and stay updated. Every year, Motorsport Australia oversees and facilitates more than 3000 locally organized member events, for 200+ local clubs . Before Teamup, collecting and sharing event info was a labor-heavy process, scattered over multiple communication channels and systems. Now, local clubs submit and update events directly on a centralized national calendar. Given the large number of participating clubs, the team leveraged Teamup’s function to bulk create sub-calendars and customized access links for each club by importing structured .csv files. The result: better collaboration for local club coordinators for future planning, without interfering in the operation of current season events. Teamup Quick Tour See a Live Embedded Calendar Stay in sync with your team across multiple devices One dashboard, all your calendars, always up to date . <img loading="lazy" loading="lazy" decoding="async" width="158" height="300" src="https://www.teamup.com/wp-content/uploads/2022/09/constructionaccess-mobile-158x300.jpeg" alt="construction worker field access to job details" title="construction worker field access to job details" srcset="https://www.teamup.com/wp-content/uploads/2022/09/constructionaccess-mobile-158x300.jpeg 158w, https://www.teamup.com/wp-content/uploads/2022/09/constructionaccess-mobile.jpeg 335w" sizes="(max-width: 158px) 100vw, 158px" class="wp-image-9552" /> <img loading="lazy" loading="lazy" decoding="async" width="844" height="515" src="https://www.teamup.com/wp-content/uploads/2022/10/table-view-mac.png" alt="annual planning with Teamup" title="table view mac" srcset="https://www.teamup.com/wp-content/uploads/2022/10/table-view-mac.png 844w, https://www.teamup.com/wp-content/uploads/2022/10/table-view-mac-480x293.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 844px, 100vw" class="wp-image-9784" /> <img loading="lazy" loading="lazy" decoding="async" width="166" height="300" src="https://www.teamup.com/wp-content/uploads/2022/09/custom-fields-field-techs-166x300.png" alt="" title="custom fields field techs" srcset="https://www.teamup.com/wp-content/uploads/2022/09/custom-fields-field-techs-166x300.png 166w, https://www.teamup.com/wp-content/uploads/2022/09/custom-fields-field-techs.png 400w" sizes="(max-width: 166px) 100vw, 166px" class="wp-image-9518" /> With a synced calendar dashboard and Teamup’s mobile apps, get diverse views across multiple devices. Check out calendar galleries Trusted by thousands of teams, large and small <img loading="lazy" loading="lazy" decoding="async" width="250" height="106" src="https://www.teamup.com/wp-content/uploads/2022/11/fidelity-2.jpg" alt="" title="fidelity" class="wp-image-9971" /> <img loading="lazy" loading="lazy" decoding="async" width="600" height="273" src="https://www.teamup.com/wp-content/uploads/2021/09/True-Sense.png" alt="" title="True-Sense" srcset="https://www.teamup.com/wp-content/uploads/2021/09/True-Sense.png 600w, https://www.teamup.com/wp-content/uploads/2021/09/True-Sense-480x218.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 600px, 100vw" class="wp-image-7709" /> <img loading="lazy" loading="lazy" decoding="async" width="250" height="104" src="https://www.teamup.com/wp-content/uploads/2022/11/Amnesty-org.jpg" alt="" title="Amnesty org" class="wp-image-9967" /> <img loading="lazy" loading="lazy" decoding="async" width="250" height="106" src="https://www.teamup.com/wp-content/uploads/2022/11/semi-logo-1.jpg" alt="" title="semi logo" class="wp-image-9972" /> <img loading="lazy" loading="lazy" decoding="async" width="400" height="106" src="https://www.teamup.com/wp-content/uploads/2022/11/charlotte-1.jpg" alt="" title="charlotte" srcset="https://www.teamup.com/wp-content/uploads/2022/11/charlotte-1.jpg 400w, https://www.teamup.com/wp-content/uploads/2022/11/charlotte-1-300x80.jpg 300w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-9973" /> Ready to get started? Create Your Calendar Launch a Live Demo TABLE OF CONTENTS More Than a CalendarNo more typing dates on a spreadsheet. Try Teamup in calendar grid or Table view. No more typing dates into a spreadsheet. Try Teamup in calendar grid or Table view.A calendar that calculates: Teamup’s unique Table viewA few unique things you can do on Teamup:How to replace some of your spreadsheets with TeamupUSE CASE EXAMPLESubcontractor managementUSE CASE EXAMPLETrack customer info for salesCUSTOMER STORYTechnical services business: getting the correct info in the CRM systemDeanna Cutlip, Office Manager, USA InsulationSimple transition from spreadsheets to TeamupCUSTOMER STORYPublic school system: pioneering a new way to organize teaching and learning amidst of pandemicFrancois Jaeger, Veteran Educator, Cantonal School AdministrationCUSTOMER STORYLarge national sport organization: jump starting a new way to collect and share local club events Stay in sync with your team across multiple devicesOne dashboard, all your calendars, always up to dateTrusted by thousands of teams, large and smallReady to get started?'
