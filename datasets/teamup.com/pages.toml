["https://teamup.com/event/show/id/itNXhPtPhnBJx7KejiWn8tgwj1d2y3"]
title = "Teamup Ticker"
description = """
When information is missing from calendar events, workflow can be interrupted. 
To ensure every user captures the needed information when adding or modifying calendar events, you can make certain event fields required. If a field is required, an event cannot be created or edited without that field being completed. This can prevent events being created without all the necessary details included. 
A calendar administrator can manage this setting on each event field. 
   

Open Teamup in a browser. 
Go to Settings > Event Fields. 
For any field you want to make required, click the Pencil icon to edit that field.
Scroll to the Required section and check Yes.
Click Save."""
