["https://www.teamup.com/custom-fields-capture-organize-filter"]
title = "How to Use Custom Fields to Capture and Organize Information - Teamup.com"
full_description = 'Custom Event Fields in Action Teamup’s unique custom fields significantly extends the possibilities of getting organized far beyond a calendar app. Create custom fields with text entry or prefilled options in dropdown lists. Easily filter your entire calendar by keyword, tags, names, numbers, or options. Learn more. Custom Fields: Multiple Choices <img loading="lazy" fetchpriority="high" decoding="async" width="1068" height="511" src="https://www.teamup.com/wp-content/uploads/2022/04/international-womens-day-event-w.png" alt="" title="international womens day event w" srcset="https://www.teamup.com/wp-content/uploads/2022/04/international-womens-day-event-w.png 1068w, https://www.teamup.com/wp-content/uploads/2022/04/international-womens-day-event-w-980x469.png 980w, https://www.teamup.com/wp-content/uploads/2022/04/international-womens-day-event-w-480x230.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1068px, 100vw" class="wp-image-8975" /> Custom fields to capture various aspects of a large event The custom field information is visible when hovering over an event on any calendar view. <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2018/08/event-fields-12.png" alt="" title="aces central" /> Create multiple choice fields in Settings The calendar administrator can go to Settings > Event fields and create a custom field with type Choices. Learn more. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/custom-field-Status.png" alt="" title="aces central" /> Track task status Create multiple choice options such as pending, review, done. Assign emojis for each status to make them easily visible and filterable on the calendar view. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/work-process-steps.png" alt="" title="trees" /> Create process transparency Running a process with multiple steps? Use a custom choice field with multiple choice options to ensure the proper procedures are followed through. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2021/12/yearend-filterstatus.gif" alt="" title="concert freebies" /> Sort status in the Table view Sort by the status of any work order to easily find what needs to be closed, billed, or reviewed. <img loading="lazy" decoding="async" width="918" height="447" src="https://www.teamup.com/wp-content/uploads/2021/12/combined-booked-waiting.png" alt="" title="combined booked waiting" srcset="https://www.teamup.com/wp-content/uploads/2021/12/combined-booked-waiting.png 918w, https://www.teamup.com/wp-content/uploads/2021/12/combined-booked-waiting-480x234.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 918px, 100vw" class="wp-image-8194" /> Client project status Easily track the process from bookings of client work to completion. Use practical and easy to recognize emojis to add some fun effect. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/custom-field-data-display-config.png" alt="" title="BSA Seattle" /> Categorize employee leave types Track employee leave types with dropdown options. In the year view (or any of the 11 calendar views), get an overview of staff leave status across various timelines. <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2021/02/custom-fields-displayed-in-columns.png" alt="" title="concert freebies" /> Multiple choice fields displayed in the Table view Track the status of equipment delivery with custom fields at a k-12 school system. Learn more. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/Screen-Shot-2020-12-16-at-11.12.24-AM.png" alt="" title="concert freebies" /> Capture client and project info Use multiple custom fields to tag key contextual information in each event or job, such as client name, project name or ID, and status. Search or filter to find the info whenever needed. <img loading="lazy" decoding="async" width="1068" height="511" src="https://www.teamup.com/wp-content/uploads/2022/04/field-fence-masked.png" alt="" title="field-fence-masked" srcset="https://www.teamup.com/wp-content/uploads/2022/04/field-fence-masked.png 1068w, https://www.teamup.com/wp-content/uploads/2022/04/field-fence-masked-980x469.png 980w, https://www.teamup.com/wp-content/uploads/2022/04/field-fence-masked-480x230.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1068px, 100vw" class="wp-image-8976" /> Custom fields for specific categories of job information Instead of paper forms, various job information captured on Teamup helps keep all parties from office staff to field crew in sync with all aspects of the job. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/Screen-Shot-2020-12-16-at-11.12.59-AM.png" alt="" title="unwebtv" /> Filter for specific value Filter all calendar events to show only a specific value in any custom choice field. For example, show only events with “Fernando” in the “Owner” field. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2021/12/yearend-customfield.gif" alt="" title="concert freebies" /> Track status Track the status of any work order and stay updated, plus filter by status to find what you need. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/prioritycustomevent.png" alt="" title="summer concert" /> Set task priority Use a custom choice field and emojis to make the priority of any task or To Do item immediately visible. Filter by priority in calendar view to focus on what matters most. Custom Text Field: Keywords, Tags, Hyper Links <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/Screen-Shot-2020-12-16-at-11.07.07-AM.png" alt="" title="St John Bosco Church" /> Create a simple mini-CRM Quickly capture and find all the customer information you need in one place. Add keywords for easy filtering. Great on mobile apps, too. Read more. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/Screen-Shot-2020-12-16-at-10.20.04-AM.png" alt="" title="Vaud" /> Capture the reference ID Capture the context of any notes or events with a custom text field for reference ID. Input the Customer ID, project name, or work order # so it is easy to retrieve all the info for that customer or project anytime. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2021/12/mindsweep2gif.gif" alt="" title="summer concert" /> Sort by keyword in table view Sort and review all your open loops in a convenient Table view. Focus on what’s important at the moment. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2021/10/context2.png" alt="" title="St John Bosco Church" /> A text field for customer ID A table view displays information by fields, sortable and browsable, making it easy to group contexts captured by any keywords <img loading="lazy" decoding="async" width="943" height="297" src="https://www.teamup.com/wp-content/uploads/2021/12/text-field-hyper-link.png" alt="" title="text field hyper link" srcset="https://www.teamup.com/wp-content/uploads/2021/12/text-field-hyper-link.png 943w, https://www.teamup.com/wp-content/uploads/2021/12/text-field-hyper-link-480x151.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 943px, 100vw" class="wp-image-8211" /> Make access to meeting links easy Create a custom text field to keep the meeting link right in the event. Participants can simply click the arrow to the right to open and join. <img loading="lazy" decoding="async" src="https://blog.teamup.com/wp-content/uploads/2020/12/Screen-Shot-2020-12-10-at-3.27.39-PM.png" alt="" title="unwebtv" /> Open a map from the Where field Rename the Where field with any label you prefer. Click to open the address in a map. Custom Number Field <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2017/11/create-number-field.png" alt="" title="St John Bosco Church" /> Create a custom number field A number field can be defined in Settings > Event Fields with the type Number. Learn more. <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2021/01/tableView-2.png" alt="" title="St John Bosco Church" /> Numbers in events Numbers can be entered and displayed just like any other event fields in any calendar views. What’s unique is that in the Table view, the field is sortable and displays the sum in the bottom. <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2017/11/number-field-setting.png" alt="" title="St John Bosco Church" /> Set a pre- or post-fix for a # field Common examples include $ or other currency symbols for prices, distance units, working hours, etc. <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2021/03/number-field.png" alt="" title="dental client work" /> Display a pre- or post-fix in event view It is displayed just like another event field but now you can sort by number or sum up the total. <img loading="lazy" decoding="async" width="1034" height="567" src="https://www.teamup.com/wp-content/uploads/2021/12/dental-client-work.png" alt="" title="dental client work" srcset="https://www.teamup.com/wp-content/uploads/2021/12/dental-client-work.png 1034w, https://www.teamup.com/wp-content/uploads/2021/12/dental-client-work-980x537.png 980w, https://www.teamup.com/wp-content/uploads/2021/12/dental-client-work-480x263.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1034px, 100vw" class="wp-image-8198" /> TABLE OF CONTENTS Custom Event Fields in ActionCustom Fields: Multiple ChoicesCustom fields to capture various aspects of a large eventCreate multiple choice fields in SettingsTrack task statusCreate process transparencySort status in the Table viewClient project statusCategorize employee leave typesMultiple choice fields displayed in the Table viewCapture client and project infoCustom fields for specific categories of job informationFilter for specific valueTrack statusSet task priorityCustom Text Field: Keywords, Tags, Hyper LinksCreate a simple mini-CRMCapture the reference IDSort by keyword in table viewA text field for customer IDMake access to meeting links easyOpen a map from the Where fieldCustom Number FieldCreate a custom number fieldNumbers in eventsSet a pre- or post-fix for a # fieldDisplay a pre- or post-fix in event view'
