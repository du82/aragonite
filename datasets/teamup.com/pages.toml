["https://teamup.com/event/show/id/mUWMP8vBMsZxvkfkCKBoqcjB58uXEh"]
title = "Teamup Ticker"
description = """
If you need to keep track of changes to events on your calendar, here are several methods:

Subscribe to change notifications by email. Choose to get notifications for the relevant sub-calendars. You can select whether to get an email for every change or a daily summary of calendar changes. This provides an ongoing record of changes to calendar events. 
Set up push notifications for event changes. You can set up push notifications for changes on your mobile device or browser. Choose the appropriate sub-calendars and change types (all changes, important changes, etc.) to receive a notification each time a change is made.
View the latest change history on the event: Open an event and check the bottom of the event editor to see when it was last modified and who made the change. This information is also shown on the event page. 
Use Table view to view the latest date events were changed.  The Updated column shows the date of the last change made to an event. You can toggle sub-calendars and use filters to see only relevant events. Sort by the Updated column to see which events were changed most recently."""
