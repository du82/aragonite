ata-locally.png 479w, https://www.teamup.com/wp-content/uploads/2020/08/backup-calendar-data-locally-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3957" /> Back Up Calendar DataWhen you want to save your calendar data locally, use these two methods. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch-400x284.png" alt="Sub-calendar inspiration organize by region or area" srcset="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch.png 479w, https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-organize-by-branch-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3956" /> Organize by RegionWhen you want to organize sub-calendars by region or area. Sub-divide regions as needed. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/08/remember-which-events-you-signup-for-400x284.png" alt="Remember the events that you have signed up for tip" srcset="https://www.teamup.com/wp-content/uploads/2020/08/remember-which-events-you-signup-for.png 479w, https://www.teamup.com/wp-content/uploads/2020/08/remember-which-events-you-signup-for-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3954" /> Remember EventsWhen you signup for events, right-click and share to remember your signups. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization-400x284.png" alt="sub-calendar inspiration organize by student and tutor" srcset="https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization.png 479w, https://www.teamup.com/wp-content/uploads/2020/08/sub-calendar-inspiration-after-school-tutoring-organization-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3955" /> Organize by Student or TutorSub-calendar inspiration: organize by student or tutor for after-school program. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/08/Add-link-to-dashboard-400x284.png" alt="Add Link to Dashboard" srcset="https://www.teamup.com/wp-content/uploads/2020/08/Add-link-to-dashboard.png 479w, https://www.teamup.com/wp-content/uploads/2020/08/Add-link-to-dashboard-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3931" /> Add Link to DashboardWhen you have calendar links shared with you but not yet added to your user account. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/07/display-calendar-in-timeline-view-with-link-parameter-400x284.png" alt="How to utilize calendar link parameters to customize calendar view" srcset="https://www.teamup.com/wp-content/uploads/2020/07/display-calendar-in-timeline-view-with-link-parameter.png 479w, https://www.teamup.com/wp-content/uploads/2020/07/display-calendar-in-timeline-view-with-link-parameter-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3450" /> Display in Timeline ViewAppend link parameter ?view=t to any calendar link to see it in the Timeline view <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/07/calendar-link-parameters-view-calendar-in-list-view-400x284.png" alt="How to utilize calendar link parameters to customize calendar view" srcset="https://www.teamup.com/wp-content/uploads/2020/07/calendar-link-parameters-view-calendar-in-list-view.png 479w, https://www.teamup.com/wp-content/uploads/2020/07/calendar-link-parameters-view-calendar-in-list-view-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3425" /> Ad-hoc Display in List ViewAppend link parameter ?view=l to any calendar link to display it in the list view. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/08/hide-weekend-link-parameter-400x284.png" alt="Hide weekends on calendar view via link parameter" srcset="https://www.teamup.com/wp-content/uploads/2020/08/hide-weekend-link-parameter.png 479w, https://www.teamup.com/wp-content/uploads/2020/08/hide-weekend-link-parameter-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3953" /> Hide WeekendsWhen you want to hide weekends from calendar view without changing calendar settings. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/07/calendar-link-parameters-agenda-and-list-date-range-400x284.png" alt="How to utilize calendar link parameters to customize date range on agenda and list view" srcset="https://www.teamup.com/wp-content/uploads/2020/07/calendar-link-parameters-agenda-and-list-date-range.png 479w, https://www.teamup.com/wp-content/uploads/2020/07/calendar-link-parameters-agenda-and-list-date-range-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-3424" /> Set Date RangeCustomize date range shown in Agenda & List calendar view without changing settings. <img loading="lazy" loading="lazy" decoding="async" width="400" height="284" src="https://www.teamup.com/wp-content/uploads/2020/06/filter-calendar-view-by-keywords-400x284.png" alt="How to filter your calendar view by using keywords" srcset="https://www.teamup.com/wp-content/uploads/2020/06/filter-calendar-view-by-keywords.png 479w, https://www.teamup.com/wp-content/uploads/2020/06/filter-calendar-view-by-keywords-400x284.png 480w" sizes="(max-width:479px) 479px, 100vw" class="wp-image-2538" /> Filter by KeywordFilter calendar events by keyword or by multiple keywords to see only 