["https://www.teamup.com/getting-started-guide-for-administrators"]
title = "Getting Started Guide for Administrators - Teamup.com"
full_description = 'Getting Started Guide for Administrators This guide will give calendar administrators an overview of the most important set up processes. You will learn about your role as a calendar administrator, how to set up your calendar, how to grant calendar access to others securely, and how to use important calendar features. <img loading="lazy" fetchpriority="high" decoding="async" width="1229" height="704" src="https://www.teamup.com/wp-content/uploads/2020/11/smartmockups_khpes85b.png" alt="Teamup administrator calendar view" title="smartmockups_khpes85b" srcset="https://www.teamup.com/wp-content/uploads/2020/11/smartmockups_khpes85b.png 1229w, https://www.teamup.com/wp-content/uploads/2020/11/smartmockups_khpes85b-980x561.png 980w, https://www.teamup.com/wp-content/uploads/2020/11/smartmockups_khpes85b-480x275.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1229px, 100vw" class="wp-image-4805" /> Contents 👑 Your role as a calendar administrator 🌟 First steps with your Teamup calendar 1: Access calendar settings 2: Create sub-calendars 3: Grant calendar access ⚙️ Configure your Teamup calendar 💎 General Settings ⏰ Date and Time 🖼️ Calendar Views 👥 Identity 📅 Calendars 👌 Sharing 🎫 Event fields 🔔 Notifications 📥 Import Events 📤 Export Events 🏆 Subscription Your role as a calendar administrator The calendar administrator is any authorized person who has administrator access to the calendar. The calendar administrator can access all calendar settings and has full control over the calendar. You may be the person who created the calendar. Or you may have been given administrator-level access to the calendar. Learn more about administrator access→ First steps to set up your Teamup calendar To get started with your Teamup calendar, think about what you want to schedule and how you want to organize information. Then you can begin to set up your calendar in a way that works best for your needs. Get Inspired: 15 Ideas for Better Calendar Setup <img loading="lazy" decoding="async" src="http://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.00.40-PM.png" alt="How to use settings as a Teamup calendar administrator " title="" /> 1: Access calendar settings Access calendar settings from the blue menu in the top right of the calendar. If you do not see Settings in the dropdown menu, you are accessing the calendar without administrator permission. Open the calendar with your user account (with administrator permission assigned) to access the settings. Note: you can only access calendar settings in a browser. The full calendar settings are not available on Teamup mobile apps. Learn more about the calendar settings → 2: Create sub-calendars Sub-calendars can represent people, resources, projects, areas, or anything else you need to organize or schedule. Better calendar setup makes all the difference in how well your calendar works for you. So choosing how to organize your calendar is a key decision. It’s directly related to how your calendar functions, which means calendar organization can make you more or less efficient when using the calendar. Learn more about organizing sub-calendars → <img loading="lazy" decoding="async" width="1022" height="580" src="https://www.teamup.com/wp-content/uploads/2020/12/sub-calendar-setup-examples.png" alt="Setting up sub-calendars on Teamup" title="sub-calendar setup examples" srcset="https://www.teamup.com/wp-content/uploads/2020/12/sub-calendar-setup-examples.png 1022w, https://www.teamup.com/wp-content/uploads/2020/12/sub-calendar-setup-examples-980x556.png 980w, https://www.teamup.com/wp-content/uploads/2020/12/sub-calendar-setup-examples-480x272.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1022px, 100vw" class="wp-image-5339" /> <img loading="lazy" decoding="async" width="528" height="381" src="https://www.teamup.com/wp-content/uploads/2021/01/permissions.png" alt="Sharing Teamup calendar with your team" title="Teamup permissions" srcset="https://www.teamup.com/wp-content/uploads/2021/01/permissions.png 528w, https://www.teamup.com/wp-content/uploads/2021/01/permissions-480x346.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) 528px, 100vw" class="wp-image-5467" /> 3: Grant calendar access Establishing who needs access to the calendar, and with what permission level is a key responsibility of the calendar administrator. There are 9 levels of access permission, including the 8 shown on the left and the administrator level. The advanced permission types are unique. A user may be allowed to only add events to the calendar but can’t change anything existing events. Or the user may be able to add or modify events they created themselves but not any events created by other users. Learn more about How sharing calendar works with Teamup → Customize default settings for your needs In the calendar settings, there are several options and defaults you can configure for your needs. General Settings Choose the default language for your calendar. Enable or disable user signup for email notifications. Enable or disable iCalendar feeds. Enable or disable assigning one event to multiple calendars. Enable, disable or change event sharing options. Showing or collapsing the sidebar and the date picker. Edit the About box for the calendar. Learn more about the calendar settings → <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/10/Screen-Shot-2020-10-14-at-4.04.35-PM-1024x626.png" alt="How to use General Settings in your Teamup calendar " title="" /> <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.09.42-PM.png" alt="How to use Date &amp; Time in your Teamup calendar " title="" /> Date and Time Time zone conversions for 140+ time zones. Select the applicable date format for your primary user base. Select the default start day of the week. Select the visible time range when your calendar is displayed with a time grid. Configure the calendar to always open on a specific date, e.g. a conference date, rather than the current date. Learn more about time zone support from Teamup → Calendar Views There are 10 different calendar views currently available. Depending on the time frame you need to see your events, you can choose the short or long term views, from focusing on the daily schedule to seeing the big picture of a strategic plan through an entire year. Adjust the time resolution and choose to show or hide weekends. Toggle calendar views on and off; if toggled off, the view will no longer be available in the calendar interface. Learn more about calendar views → <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.10.15-PM.png" alt="How to use Calendar Views in your Teamup calendar " title="" /> <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.10.57-PM.png" alt="How to use Identity in your Teamup calendar " title="" /> Identity Change the calendar title, if desired. Upload your own logo. Customize the header colors (background and font). Learn more about customizing your calendar identity → Calendars Prevent double bookings by disallowing overlapping events. Group sub-calendars into folders for easy organization. The number of available sub-calendars is linked to your subscription plan. You can upgrade any time to use more sub-calendars. Learn more about color-coded sub-calendars → <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.13.21-PM.png" alt="How to use Attributes in your Teamup calendar " title="" /> <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.44.17-PM.png" alt="How to use Sharing in your Teamup calendar " title="" /> Sharing Share with account-based users, shareable calendar links, or create groups. Granting calendar access to account users has better security. Each calendar user is known, linked to a verified email address, and has unique calendar access via their user account. Granting calendar access via a shareable calendar link is more convenient if you wish to quickly share your calendar without requiring a login, or to share a calendar with a public group. The number of account-based users available is linked to your subscription plan. You can upgrade any time to add more account-based users. Learn more about sharing your calendar with users, groups, and links → Event Fields Each Teamup calendar has default event fields, including Who, Where, Description, Signup, and Comments. Rearrange these default event fields and toggle them on or off. Custom event fields allow you to create your own unique event fields. The number of custom event fields you may have is linked to your subscription plan. You can upgrade any time to add more custom event fields. Learn more about event fields → <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.47.41-PM.png" alt="How to use Event Fields in your Teamup calendar " title="" /> <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.55.01-PM.png" alt="How to use Notifications in your Teamup calendar " title="" /> Notifications Teamup calendar supports email notifications, daily agenda emails, event reminders, and Slack integration. Teamup email notifications allow calendar users to be notified when changes are made to events on the calendar, whereas event reminders alert calendar users of upcoming events. If user signup for notifications is enabled (in General Settings), account-based users will be able to add or modify their own notification subscriptions. Learn more about Teamup notifications → Import Events You can import calendar data from other calendar applications, spreadsheets, databases and text fields. Currently supported import formats are iCalendar files (#.ics) and text files with comma-separated values (*.csv). You can also import data from one Teamup Calendar to another. Only the calendar administrator can import files. Learn more about importing events to Teamup calendar → <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.56.51-PM.png" alt="How to use Import Events in your Teamup calendar " title="" /> <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.57.12-PM.png" alt="How to use Export Events in your Teamup calendar " title="" /> Export Events You can bulk export calendar data from your Teamup Calendar to text files with comma-separated values (.csv) or iCalendar files (.ics). It is possible to choose to export events from a specific sub-calendar or all calendars. You can also export event signups and event comments in the .csv file format. Only the calendar administrator can bulk export. Learn more about exporting events from Teamup calendar → Subscription There are four subscription plans available for Teamup Calendar: Basic (free), Plus, Premium, and Enterprise. To test Teamup Plus or Premium features before purchasing an upgrade, start a free trial calendar or use a live demo calendar. When you are ready to upgrade to a different plan, simply click the relevant upgrade button and complete the payment. As soon as the payment is successfully completed, the upgrade takes place automatically. Learn more about subscription plans → <img loading="lazy" decoding="async" src="https://calendar.teamup.com/wp-content/uploads/2020/05/Screen-Shot-2020-05-27-at-2.57.29-PM.png" alt="How to use Subscriptions in your Teamup calendar " title="" /> Ready to get started? All the features you need. Easy to learn. Create a calendar Try a live demo You can also start with a free trial of paid plans with more features, or get inspired by browsing what others say and our million thanks. TABLE OF CONTENTS Getting Started Guide for AdministratorsContentsYour role as a calendar administratorFirst steps to set up your Teamup calendar1: Access calendar settings2: Create sub-calendars3: Grant calendar accessCustomize default settings for your needsIn the calendar settings, there are several options and defaults you can configure for your needs. General SettingsDate and TimeCalendar ViewsIdentityCalendarsSharingEvent FieldsNotificationsImport EventsExport EventsSubscriptionReady to get started?'
