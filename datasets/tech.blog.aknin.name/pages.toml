full_description = "Tag: heroku Heroku is great! However… Mar 9, 2012 — by Yaniv Aknin in django I like Heroku. We’ve recently made our first deployment on it, and all things considered, I don’t think we could’ve made a better platform choice at this time. Deploying to Heroku taught me quite a few things, easily the most important of them was hearing about the 12 Factor App methodology. If you haven’t heard… I wish someone wrote django-static-upstream… maybe even… me! Dec 28, 2011 — by Yaniv Aknin in Ideas, My Projects I used to think serving static files (aka static assets) is really easy: configure nginx to serve a directory and you’re done. But things quickly became more complicated as issues like asset compilation, CDNs/scalability, file-specific custom headers, deployment complexity and development/production parity rear their ugly heads. Judging by the huge number of different asset management…"
