full_description = "Tag: python Python’s Innards: Naming Jun 5, 2010 — by Yaniv Aknin in Python’s Innards Today’s article in our series of articles about Python internals’ will discuss naming, which is the ability to bind names to an object, like we can see in the statement a = 1 (in other words, this article is roughly about what many languages call variables). Naturally, naming is central to Python's behaviour and understanding… Mailing list debates considered harmful May 29, 2010 — by Yaniv Aknin in Ideas Recently, one particular thread at python-dev has piqued my interest. The thread discusses the possible pronouncement of PEP 3148 (re. the addition of futures to stdlib), and has been going on for over a hundred messages with no end in site. I’d like to use some examples from that thread in this post, but it… Python’s Innards: pystate May 26, 2010 — by Yaniv Aknin in Python’s Innards We started our series discussing the basics of Python’s object system (Objects 101 and 102), and it’s time to move on. Though we’re not done with objects by any stretch of the imagination, when I think of Python’s implementation I visualize this big machine with a conveyor belt feeding opcodes into a hulking processing plant… Python’s Innards: Series Renamed May 22, 2010 — by Yaniv Aknin in Errata, Guido's Python Just yesterday I promised to tell you if I make significant mistakes, hoping it would be a seldom occasion. Yet here I am writing to you about another mistake I made, though this time not one of technical nature. I chose the old name for this series of articles about Python’s inner working as I… Correction for ‘Python’s Innards: Objects 102’ May 20, 2010 — by Yaniv Aknin in Errata, Python’s Innards Alas, it has happened, the first mistake in the ‘Python’s Innards’ series has been found. I was trying to answer a question raised by one of my Reddit readers regarding properties, and realized that I have overlooked a fine point about descriptors in my post. Oops. As was originally (and correctly) written in the post,… Python’s Innards: Objects 102 May 19, 2010 — by Yaniv Aknin in Python’s Innards Welcome to Object 102, the third post in our series of Python internals and a direct continuation to the earlier post, Objects 101 (reading this post without reading 101 totally voids your warranty, so maybe you should head there first if you haven’t yet). In this post we will touch upon a central subject we… Python’s Innards: Objects 101 May 12, 2010 — by Yaniv Aknin in Python’s Innards As I said in the introduction to this series (which was rather successful; thank you everyone, your hits and comments literally keep me going!) – today’s post will be about Python 3.x’s implementation of objects. When I set out to write this post, I thought we’ll start with objects because it would be a gentle… Searching mailman archives offline (python-dev, anyone?) May 7, 2010 — by Yaniv Aknin in Uncategorized Since I’m a newcomer to python-dev, I often need to search the python-dev mailman archives. While I did find this way to do it (using Google with site:), it’s no good for offline searches (and at best it’s a kludge for online searches, too, IMHO). I’m offline quite a lot these days, since cellular 3G… Why don’t I contribute to Python (often) Apr 23, 2010 — by Yaniv Aknin in Uncategorized Oddly enough, just a week or two after I wrote the post “Contributing to Python“, Jesse Noller (of multiprocessing fame) wrote a post called “Why aren’t you contributing (to Python)?“. As a somewhat wannabe contributor, I think it’s a terrific question which deserves wordy and open answers (hey, just like this one). I realize the… Labour Updated Apr 16, 2010 — by Yaniv Aknin in Labour I’ve had more time to work on Labour (originally posted here, inspired by this and that), the WSGI Server Durability Benchmark. I’m relatively happy with progress so far, and will probably try to ‘market’ Labour a bit shortly. Two things that are still sorely missing from Labour (and are blocking me from posting some news… ←Previous Page Next Page→"
