full_description = "Category: Python’s Innards Python’s Innards: Hello, ceval.c! Sep 2, 2010 — by Yaniv Aknin in Python’s Innards The “Python’s Innards” series owes its existence, at least in part, to hearing one of the Python-Fu masters in my previous workplace say something about a switch statement so large that it was needed to break it up just so some compilers won’t choke on it. I remember thinking then: “Choke the compiler with a… Python’s Innards: Interpreter Stacks Jul 22, 2010 — by Yaniv Aknin in Python’s Innards Those of you who have been paying attention know that this series is spiraling towards what can be considered the core of Python’s Virtual Machine, the “actually do work function” ./Python/ceval.c: PyEval_EvalFrameEx. The (hopefully) last hurdle on our way there is to understand the three significant stack data structures used for CPython’s code evaluation: the… Python’s Innards: for my wife Jul 4, 2010 — by Yaniv Aknin in Offtopic, Python’s Innards The other day the best wife I’ll ever have had trouble sleeping and asked me to tell her something to put her to sleep. Since she’s not quite a hacker, I figured some discussion of what I usually write about may do the trick (okay, maybe ‘not quite a hacker’ is an understatement, she’s an… Python’s Innards: Code Objects Jul 3, 2010 — by Yaniv Aknin in Python’s Innards This article, part of a series of articles about Python’s internals, will continue our preparation to engage the machinery of code evaluation by discussing Code Objects. To those of you who just now joined in and didn’t even read the introduction (but why?!), please note an important disclaimer: while the series as a whole is… Python’s Innards: Naming Jun 5, 2010 — by Yaniv Aknin in Python’s Innards Today’s article in our series of articles about Python internals’ will discuss naming, which is the ability to bind names to an object, like we can see in the statement a = 1 (in other words, this article is roughly about what many languages call variables). Naturally, naming is central to Python's behaviour and understanding… Python’s Innards: pystate May 26, 2010 — by Yaniv Aknin in Python’s Innards We started our series discussing the basics of Python’s object system (Objects 101 and 102), and it’s time to move on. Though we’re not done with objects by any stretch of the imagination, when I think of Python’s implementation I visualize this big machine with a conveyor belt feeding opcodes into a hulking processing plant… Correction for ‘Python’s Innards: Objects 102’ May 20, 2010 — by Yaniv Aknin in Errata, Python’s Innards Alas, it has happened, the first mistake in the ‘Python’s Innards’ series has been found. I was trying to answer a question raised by one of my Reddit readers regarding properties, and realized that I have overlooked a fine point about descriptors in my post. Oops. As was originally (and correctly) written in the post,… Python’s Innards: Objects 102 May 19, 2010 — by Yaniv Aknin in Python’s Innards Welcome to Object 102, the third post in our series of Python internals and a direct continuation to the earlier post, Objects 101 (reading this post without reading 101 totally voids your warranty, so maybe you should head there first if you haven’t yet). In this post we will touch upon a central subject we… Python’s Innards: Objects 101 May 12, 2010 — by Yaniv Aknin in Python’s Innards As I said in the introduction to this series (which was rather successful; thank you everyone, your hits and comments literally keep me going!) – today’s post will be about Python 3.x’s implementation of objects. When I set out to write this post, I thought we’ll start with objects because it would be a gentle… Python’s Innards: Introduction Apr 2, 2010 — by Yaniv Aknin in Python’s Innards A friend once said to me: You know, to some people, C is just a bunch of macros that expand to assembly. It’s been years ago (smartasses: it was also before llvm, ok?), but the sentence stuck with me. Do Kernighan and Ritchie really look at a C program and see assembly code? Does Tim…"
