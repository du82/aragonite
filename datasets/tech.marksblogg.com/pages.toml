["https://tech.marksblogg.com/aircraft-route-analysis-adsb.html"]
title = "Aircraft Route Analysis"
description = "Benchmarks & Tips for Big Data, Hadoop, AWS, Google Cloud, PostgreSQL, Spark, Python & More..."
full_description = '''Aircraft Route Analysis In November, I wrote a post on analysing aircraft position telemetry with adsb.lol. At the time, I didn't have a clear way to turn a series of potentially thousands of position points for any one aircraft into a list of flight path trajectories and airport stop-offs. Since then, I've been downloading adsb.lol's daily feed and in this post, I'll examine the flight routes taken by AirBaltic's YL-AAX Airbus A220-300 aircraft throughout February. I flew on this aircraft on February 24th between Dubai and Riga. I used my memory and notes of the five-hour take-off delay to help validate the enriched dataset in this post. Below is a rendering of the enriched dataset. The darker flight routes are from the beginning of the month and they brighten towards the end of the month. My Workstation I'm using a 6 GHz Intel Core i9-14900K CPU. It has 8 performance cores and 16 efficiency cores with a total of 32 threads and 32 MB of L2 cache. It has a liquid cooler attached and is housed in a spacious, full-sized, Cooler Master HAF 700 computer case. I've come across videos on YouTube where people have managed to overclock the i9-14900KF to 9.1 GHz. The system has 48 GB of DDR5 RAM clocked at 5,200 MHz and a 5th-generation, Crucial T700 4 TB NVMe M.2 SSD which can read at speeds up to 12,400 MB/s. There is a heatsink on the SSD to help keep its temperature down. This is my system's C drive. There is also an 8 TB mechanical disk that I use to hold GIS datasets. This is my system's F drive. The system is powered by a 1,200-watt, fully modular, Corsair Power Supply and is sat on an ASRock Z790 Pro RS Motherboard. I'm running Ubuntu 22 LTS via Microsoft's Ubuntu for Windows on Windows 11 Pro. In case you're wondering why I don't run a Linux-based desktop as my primary work environment, I'm still using an Nvidia GTX 1080 GPU which has better driver support on Windows and I use ArcGIS Pro from time to time which only supports Windows natively. Installing Prerequisites I'll first install some dependencies. $ sudo apt update $ sudo apt install \ awscli \ build-essential \ cmake \ python3-virtualenv \ unzip Below I'll set up the Python Virtual Environment. $ virtualenv ~/.adsb $ source ~/.adsb/bin/activate $ python -m pip install \ duckdb \ flydenity \ geopandas \ h3 \ movingpandas \ pandas \ pyarrow \ rich \ shapely \ shpyx \ typer Below I'll download and install v0.10.0 of the official binary for DuckDB. $ cd ~ $ wget -c https://github.com/duckdb/duckdb/releases/download/v0.10.0/duckdb_cli-linux-amd64.zip $ unzip -j duckdb_cli-linux-amd64.zip $ chmod +x duckdb I'll install a few extensions for DuckDB and make sure they load automatically each time I launch the client. $ ~/duckdb INSTALL json; INSTALL parquet; INSTALL spatial; $ vi ~/.duckdbrc .timer on .width 180 LOAD json; LOAD parquet; LOAD spatial; The maps in this post were rendered with QGIS version 3.36. QGIS is a desktop application that runs on Windows, macOS and Linux. The software is very popular in the geospatial industry and was launched almost 15 million times in May last year. I used QGIS' Tile+ plugin to add satellite basemaps and Trajectools to turn ADS-B points into trajectories. Tile+ can be installed from its ZIP distributable. For Trajectools, I first installed MovingPandas into QGIS' Python Environment. Launch QGIS' Python Console from the Plugins Menu and run the following. import pip pip.main(['install', 'scikit-mobility']) pip.main(['install', 'movingpandas']) Then after restarting QGIS, find "Trajectools" in the "Manage and Install Plugins" dialog and install it. I've used Noto Sans for the final map's font. Downloading ADS-B Data I've written a script that will download adsb.lol's distributable from two days prior. $ cat /mnt/f/gis/Global/adsb_lol/download.sh DATE=`date --date="2 days ago" +"%Y.%m.%d"` wget -c https://github.com/adsblol/globe_history/releases/download/v$DATE-planes-readsb-prod-0/v$DATE-planes-readsb-prod-0.tar The above script runs as a daily cronjob. It has been reliable for as long as I've been using it. $ crontab -l 0 20 * * * bash -c "cd /mnt/f/gis/Global/adsb_lol && bash download.sh" The downloads are between 1.6 and 1.8 GB for any given day. $ ls -lht v2024.02.0* 1.8G ... v2024.02.09-planes-readsb-prod-0.tar 1.7G ... v2024.02.08-planes-readsb-prod-0.tar 1.6G ... v2024.02.07-planes-readsb-prod-0.tar 1.6G ... v2024.02.06-planes-readsb-prod-0.tar 1.6G ... v2024.02.05-planes-readsb-prod-0.tar 1.5G ... v2024.02.04-planes-readsb-prod-0.tar 1.6G ... v2024.02.03-planes-readsb-prod-0.tar 1.6G ... v2024.02.02-planes-readsb-prod-0.tar 1.7G ... v2024.02.01-planes-readsb-prod-0.tar Downloading Natural Earth's Dataset I'll download Natural Earth's 1:10m scale, version 5.1.2 dataset. It was published in May 2022. $ mkdir -p /mnt/f/gis/Global/naturalearth $ for DATASET in cultural physical raster; do cd /mnt/f/gis/Global/naturalearth aws s3 sync \ --no-sign-request \ s3://naturalearth/10m_$DATASET/ \ 10m_$DATASET/ cd 10m_$DATASET/ ls *.zip | xargs -n1 -P4 -I% unzip -qn % done The above downloaded three categories of data. In ZIP format, there is 120 MB of physical data (coastlines, lakes, etc..) across 54 ZIP files, 720 MB of cultural data (transport, time zones, populated areas, borders) across 79 ZIP files and 5.6 GB of raster data (relief maps of the earth) across 37 ZIP files. ADS-B in Parquet Format I've updated the ADS-B JSON to Parquet enrichment script from the adsb.lol blog post. It can now work across multiple threads with each thread processing an individual tar file. The default pool size is 8 but this can be adjusted. $ vi enrich.py #!/usr/bin/env python3 # -*- coding: utf-8 -*- from datetime import datetime from glob import glob import json from multiprocessing import Pool from shlex import quote import tarfile import zlib from flydenity import Parser import h3 from rich.progress import Progress, track from shpyx import run as execute import typer aircraft_keys = set([ 'alert', 'alt_geom', 'baro_rate', 'category', 'emergency', 'flight', 'geom_rate', 'gva', 'ias', 'mach', 'mag_heading', 'nac_p', 'nac_v', 'nav_altitude_fms', 'nav_altitude_mcp', 'nav_heading', 'nav_modes', 'nav_qnh', 'nic', 'nic_baro', 'oat', 'rc', 'roll', 'sda', 'sil', 'sil_type', 'spi', 'squawk', 'tas', 'tat', 'track', 'track_rate', 'true_heading', 'type', 'version', 'wd', 'ws']) app = typer.Typer(rich_markup_mode='rich') def gzip_jsonl(filename:str): execute('pigz -9 -f %s' % quote(filename)) def process_records(rec, num_recs, out_filename, out_file, source_date): parser = Parser() # Aircraft Registration Parser # Keep integer form to calculate offset in trace dictionary timestamp = rec['timestamp'] rec['timestamp'] = str(datetime.utcfromtimestamp(rec['timestamp'])) if 'year' in rec.keys() and str(rec['year']) == '0000': return num_recs, out_filename, out_file if 'noRegData' in rec.keys(): return num_recs, out_filename, out_file # Force casing on fields rec['icao'] = rec['icao'].lower() for key in ('desc', 'r', 't', 'ownOp'): if key in rec.keys(): rec[key] = rec[key].upper() if 'r' in rec.keys(): reg_details = parser.parse(rec['r']) if reg_details: rec['reg_details'] = reg_details for trace in rec['trace']: num_recs = num_recs + 1 _out_filename = 'traces_%s_%04d.jsonl' % (source_date, int(num_recs / 1_000_000)) if _out_filename != out_filename: if out_file: out_file.close() if out_filename: gzip_jsonl(out_filename) out_file = open(_out_filename, 'w') out_filename = _out_filename rec['trace'] = { 'timestamp': str(datetime.utcfromtimestamp(timestamp + trace[0])), 'lat': trace[1], 'lon': trace[2], 'h3_5': h3.geo_to_h3(trace[1], trace[2], 5), 'altitude': trace[3] if str(trace[3]).strip().lower() != 'ground' else None, 'ground_speed': trace[4], 'track_degrees': trace[5], 'flags': trace[6], 'vertical_rate': trace[7], 'aircraft': {k: trace[8].get(k, None) if trace[8] else None for k in aircraft_keys}, 'source': trace[9], 'geometric_altitude': trace[10], 'geometric_vertical_rate': trace[11], 'indicated_airspeed': trace[12], 'roll_angle': trace[13]} out_file.write(json.dumps(rec, sort_keys=True) + '\n') return num_recs, out_filename, out_file def process_file(manifest): filename, task = manifest num_recs, out_filename, out_file = 0, None, None assert '-planes-readsb-prod-0.tar' in filename source_date = '20' + filename.split('v20')[-1]\ .split('-')[0]\ .replace('.', '-') print(filename) with tarfile.open(filename, 'r') as tar: for member in tar.getmembers(): if member.name.endswith('.json'): f = tar.extractfile(member) if f is not None: rec = json.loads( zlib.decompress(f.read(), 16 + zlib.MAX_WBITS)) num_recs, out_filename, out_file = \ process_records(rec, num_recs, out_filename, out_file, source_date) if out_file: out_file.close() if out_filename: gzip_jsonl(out_filename) @app.command() def main(pattern:str = 'v*-planes-readsb-prod-0.tar', pool_size:int = 8): # Get total number of JSON files that will be processed so the # progress tracker knows ahead of time. total_json_files = {} with Progress() as progress: task = progress.add_task('Counting JSON Files in each TAR file', total=len(glob(pattern))) for filename in glob(pattern): for member in tarfile.open(filename, 'r').getmembers(): if member.name.endswith('.json'): if filename not in total_json_files.keys(): total_json_files[filename] = {'num_recs': 0} total_json_files[filename]['num_recs'] = \ total_json_files[filename]['num_recs'] + 1 progress.update(task, advance=1) # Process every JSON file in each .tar file. # WIP: Find a way to share the progress bar across threads pool = Pool(pool_size) payload = [(k, total_json_files[k]['task']) for k in total_json_files.keys()] pool.map(process_file, payload) if __name__ == "__main__": app() A glob pattern can be used to isolate the script's workload to a handful of files. Otherwise, it'll try to match to adsb.lol's file naming convention. $ python enrich.py I haven't found a way to share the progress bar across multiple threads so when the pool is executing, progress is indicated by the file name of each tar file being printed as its first opened. For any given day, there will be ~45 Parquet files generated. Each Parquet file contains one million records for that day's flight traces. This partitioning is done to ensure DuckDB doesn't run out of memory when processing each file on a RAM-constrained system. My main workstation has 48 GB of RAM but I've also run this script on a Steam Deck with 16 GB of RAM and a MacBook Pro with 8 GB of RAM without issue. The resulting Parquet files are around 45 MB each. Here are the file sizes of a few of them. $ ls -lht traces_2024-02-29_003*.pq 45M ... traces_2024-02-29_0039.pq 44M ... traces_2024-02-29_0038.pq 45M ... traces_2024-02-29_0037.pq 45M ... traces_2024-02-29_0036.pq 45M ... traces_2024-02-29_0035.pq 45M ... traces_2024-02-29_0034.pq 45M ... traces_2024-02-29_0033.pq 45M ... traces_2024-02-29_0032.pq 45M ... traces_2024-02-29_0031.pq 45M ... traces_2024-02-29_0030.pq There are 1,186,616,930 records in total for February. Better Compression This is an optional step but if you're archiving the Parquet files or sharing them with a large number of people, the file sizes can be reduced from ~45 MB to around ~13 MB each. This is done by a combination of sorting and stronger compression. I'll use a Parquet debugging tool I've been working on to see how much space each column takes up in one of the Parquet files. $ git clone https://github.com/marklit/pqview \ ~/pqview $ virtualenv ~/.pqview $ source ~/.pqview/bin/activate $ python3 -m pip install \ -r ~/pqview/requirements.txt $ python3 ~/pqview/main.py \ types --html \ traces_2024-02-29_0045.pq \ > traces_2024-02-29_0045.html The trace.lon field is one of the largest in the Parquet file. It often has the largest number of unique values compared to any other column as well. ZStandard's compression efficiency is sensitive to sorting so this column being the sort key should offer the smallest resulting files. Below I'll patch DuckDB's source code changing the default ZStandard compression level from 3 to 22. $ git clone https://github.com/duckdb/duckdb.git ~/duckdb_source $ cd ~/duckdb_source $ mkdir -p build/release Below is where the default value is stored. $ grep -R 'define ZSTD_CLEVEL_DEFAULT' third_party/zstd/ third_party/zstd/include/zstd.h:# define ZSTD_CLEVEL_DEFAULT 3 I changed the above to 22. diff --git a/third_party/zstd/include/zstd.h b/third_party/zstd/include/zstd.h index ade94c2d5c..80d4b560a9 100644 --- a/third_party/zstd/include/zstd.h +++ b/third_party/zstd/include/zstd.h @@ -84,7 +84,7 @@ ZSTDLIB_API const char* ZSTD_versionString(void); /* requires v1.3.0+ */ * Default constant ***************************************/ #ifndef ZSTD_CLEVEL_DEFAULT -# define ZSTD_CLEVEL_DEFAULT 3 +# define ZSTD_CLEVEL_DEFAULT 22 #endif /* ************************************* Below I'll compile the code and launch the resulting binary. $ cmake \ ./CMakeLists.txt \ -DCMAKE_BUILD_TYPE=RelWithDebInfo \ -DEXTENSION_STATIC_BUILD=1 \ -DBUILD_PARQUET_EXTENSION=1 \ -B build/release $ CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) \ cmake --build build/release $ ~/duckdb_source/build/release/duckdb -unsigned This binary needs to use the Parquet extension that it was compiled with. INSTALL '/home/mark/duckdb_source/build/release/extension/parquet/parquet.duckdb_extension'; LOAD parquet; The re-compressed Parquet file is 12,888,833 bytes. It can be read without issue by the officially distributed versions of DuckDB, not just the patched version above. COPY( SELECT * FROM READ_PARQUET('/mnt/f/gis/Global/adsb_lol/traces_2024-02-29_0045.pq') ORDER BY trace.lon ) TO 'test.zstd.22.pq' (FORMAT 'PARQUET', CODEC 'ZSTD', ROW_GROUP_SIZE 15000); AirBaltic's Fleet Normally the ownOp field in each trace record will be populated with an Airline's brand like 'DELTA AIR LINES INC ' or 'WESTJET'. AirBaltic's traces don't populate this field. They only fly the Airbus A220-300 (identified as BCS3 in the traces) and all 47 of their aircraft are registered in Latvia. They are also the only Latvian owner of this type of aircraft. I'll use these details to find all of their unique registration numbers in this dataset. $ ~/duckdb working.duckdb .maxrows 100 SELECT DISTINCT r FROM READ_PARQUET('/mnt/f/gis/Global/adsb_lol/traces*.pq') WHERE reg_details.nation = 'Latvia' AND t = 'BCS3' ORDER BY 1; ┌─────────┐ │ r │ │ varchar │ ├─────────┤ │ YL-AAO │ │ YL-AAP │ │ YL-AAQ │ │ YL-AAR │ │ YL-AAS │ │ YL-AAT │ │ YL-AAU │ │ YL-AAV │ │ YL-AAW │ │ YL-AAX │ │ YL-AAY │ │ YL-AAZ │ │ YL-ABA │ │ YL-ABB │ │ YL-ABD │ │ YL-ABE │ │ YL-ABF │ │ YL-ABG │ │ YL-ABH │ │ YL-ABI │ │ YL-ABJ │ │ YL-ABK │ │ YL-ABL │ │ YL-ABM │ │ YL-ABN │ │ YL-ABO │ │ YL-ABP │ │ YL-ABQ │ │ YL-ABR │ │ YL-ABS │ │ YL-ABT │ │ YL-CSA │ │ YL-CSB │ │ YL-CSC │ │ YL-CSD │ │ YL-CSF │ │ YL-CSI │ │ YL-CSJ │ │ YL-CSK │ │ YL-CSL │ │ YL-CSM │ │ YL-CSN │ ├─────────┤ │ 42 rows │ └─────────┘ I came across all but five of their aircraft. Below is a rendering of their movements in Febr'''
author = "Mark Litwintschik"
year_published = 2025
clearnet = "https://tech.marksblogg.com/aircraft-route-analysis-adsb.html"
tags = ['"type":', "1.6g", "2024-02-23", "above", "across", "ads-b", "adsb.lol's", "airbaltic's", "aircraft", "airport"]
