r--Tuffet │ 0 │ 28 │ 19 │ 30 │ 17 │ 13 │ 0 │ 107 │ │ Nathan E. Egge │ 6 │ 0 │ 0 │ 2 │ 0 │ 0 │ 92 │ 100 │ │ Matthias Dressel │ 0 │ 1 │ 9 │ 34 │ 23 │ 14 │ 12 │ 93 │ │ Luc Trudeau │ 25 │ 7 │ 16 │ 0 │ 0 │ 0 │ 0 │ 48 │ ├───────────────────────────────┴───────┴───────┴───────┴───────┴───────┴───────┴───────┴───────────────┤ │ 10 rows 9 columns │ └───────────────────────────────────────────────────────────────────────────────────────────────────────┘ The project has plans for GPU support in future releases. Given the number of mobile devices in the world that don't have AV1 hardware acceleration, this support couldn't come too soon. The Rust-based rav1e The third AV1 codec I've looked at is rav1e. It's written in Rust and Assembler and has David Michael Barr, a long-term Samsung staff member, as one of its top contributors. The Rust line count comes in at just under 60K while the Assembler line count is over 200K. The top nine contributors have all produced more than 100 commits but only four of these committers have worked on this project this year. It might be a sign of the project's maturity but given other projects are still pretty busy I'm curious as to what's next for this project. $ git clone https://github.com/xiph/rav1e ~/rav1e $ cd ~/rav1e $ top_ten_committers ┌────────────────────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────────────┐ │ commit_by │ 2017 │ 2018 │ 2019 │ 2020 │ 2021 │ 2022 │ 2023 │ 2024 │ total_commits │ │ varchar │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ ├────────────────────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────────────┤ │ Luca Barbato │ 1 │ 100 │ 434 │ 192 │ 174 │ 37 │ 33 │ 5 │ 976 │ │ David Michael Barr │ 0 │ 26 │ 240 │ 134 │ 160 │ 169 │ 191 │ 6 │ 926 │ │ Thomas Daede │ 23 │ 331 │ 248 │ 18 │ 5 │ 7 │ 1 │ 0 │ 633 │ │ GitHub │ 9 │ 112 │ 122 │ 54 │ 20 │ 30 │ 11 │ 5 │ 363 │ │ Josh Holmer │ 0 │ 0 │ 44 │ 106 │ 66 │ 60 │ 63 │ 16 │ 355 │ │ Raphaël Zumer │ 0 │ 30