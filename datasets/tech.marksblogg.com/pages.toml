full_description = '''Overture Maps' Refreshed Global Geospatial Datasets I look at Overture's latest open and global geospatial dataset update. Foursquare's 104M Points of Interest I look at Foursqaure's Open and Global Points of Interest (POI) Dataset. OpenStreetMap's New Vector Tiles I look at OpenStreetMap's new sharp, clear and customisable vector tiles. Microsoft's 1.4 Billion Global ML Building Footprints I walk through Microsoft's Global ML Building Footprints Dataset. ICEYE's Satellite Imagery I try to detect aircraft in ICEYE's SAR imagery of Doha International Airport using SARDet_100K and MSFA. Japan's Building Footprints I look at "Flateau", a Parquet-based Japanese Building Footprint Dataset. Satellites Spotting Aircraft I try to detect aircraft in Umbra's SAR imagery of Bangkok Airport using SARDet_100K and MSFA. AI on Street View I look at the results of several models running inference on 10M images taken in cities across the globe. Revisiting Overture's Global Geospatial Datasets I look over some of the changes made to Overture's datasets over the past six months. AI-Extracted Asian Building Footprints I explore the results of a new model that aims to extract building footprints from Google Maps' Satellite Imagery. Satellites Spotting Ships I train a model using YOLOv5 to detect ships in Umbra's Open Satellite Feed. Maxar's HD Global Imagery Basemap I explore satellite imagery of eleven cities on Maxar's 30cm Global Basemap. HeavyIQ: Understanding 220M Flights with AI HEAVY.AI's GPU-powered database can now understand English, not just SQL. Global EV Charging Points with Open Charge Map I walk through Open Charge Map's EV Charging Station dataset. Aircraft Route Analysis I explore ways to track individual aircraft found in adsb.lol's flight tracking dataset. 1.1 Billion Taxi Rides using ClickHouse on Intel's Core i9-14900K I examine the performance of ClickHouse on Intel's Core i9-14900K against my 1.1B taxi rides benchmark. 1.1 Billion Taxi Rides using DuckDB I examine the performance of DuckDB against my 1.1B taxi rides benchmark.'''
