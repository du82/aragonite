title = "Minimalist Guide to AV1 Video Encoding"
description = "Benchmarks & Tips for Big Data, Hadoop, AWS, Google Cloud, PostgreSQL, Spark, Python & More..."
full_description = '''Minimalist Guide to AV1 Video Encoding AV1 is an open source, royalty-free video codec. It was released in 2018 by the Alliance for Open Media (AOMedia). This group includes firms such as ARM, Apple, Intel, Nvidia and Samsung. AV1 encodings can often be 4x smaller than an equivalent x264 encoding and half the size of an x265 encoding. Much of the 8K footage I've come across needs about 1 GB of storage for every minute of video. This is due to x265 encoding being used as it is one of the few codecs that enjoys widespread hardware support at this resolution. But x265 also demands royalty fees from content producers. To add to that, I have a hard time finding settings for libx265 that can encode 4K video any faster than 20% of real time on my $600 Intel Core i9 14900K. To download an 8K video in real-time would require a solid 135 Mbps Internet connection. 8K might be a novelty for watching movies in your living room but it's more of a minimum requirement for Virtual Reality (VR). Also, asking someone to save 60 GB on their phone for every hour of content they want to consume before a flight is asking a lot, even of the larger flagship smartphones. AV1 would cut these requirements down by at least 2-3x and would be a huge step forward. There are four major open source software implementations of AV1. I'll briefly cover three of them (aom, dav1d, rav1e) before going more into depth with SVT-AV1. My Workstation I'm using a 6 GHz Intel Core i9-14900K CPU. It has 8 performance cores and 16 efficiency cores with a total of 32 threads and 32 MB of L2 cache. It has a liquid cooler attached and is housed in a spacious, full-sized, Cooler Master HAF 700 computer case. I've come across videos on YouTube where people have managed to overclock the i9-14900KF to 9.1 GHz. The system has 96 GB of DDR5 RAM clocked at 6,000 MT/s and a 5th-generation, Crucial T700 4 TB NVMe M.2 SSD which can read at speeds up to 12,400 MB/s. There is a heatsink on the SSD to help keep its temperature down. This is my system's C drive. There is also a 2 TB SATA-connected SSD that will be used to store the videos and virtual machine used in this post. This is my system's D drive. The system is powered by a 1,200-watt, fully modular, Corsair Power Supply and is sat on an ASRock Z790 Pro RS Motherboard. I'm running Ubuntu 22 LTS via VirtualBox on Windows 11 Pro. VirtualBox has been allocated 100 GB of SATA-connected SSD capacity, 16 GB of RAM and 8 CPU cores. This will help isolate the vast and fast-changing libraries FFMPEG and AV1 encoding rely on. In case you're wondering why I don't run a Linux-based desktop as my primary work environment, I'm still using an Nvidia GTX 1080 GPU which has better driver support on Windows and I use ArcGIS Pro from time to time which only supports Windows natively. Installing Prerequisites I'll be using Python, a few build tools and a few re-compiled non-AV1 video codecs in this post. $ sudo apt update $ sudo apt install \ build-essential \ cmake \ libmp3lame-dev \ libnuma-dev \ libssl-dev \ libunistring-dev \ libx264-dev \ libx265-dev \ libgnutls28-dev \ libfreetype6-dev \ nasm \ pkg-config \ python3-venv \ unzip Rust was used to build rav1e so I'll install it's build environment. $ curl --proto '=https' \ --tlsv1.2 \ -sSf \ https://sh.rustup.rs \ | sh $ source ~/.cargo/env If you already have Rust installed, this command will make sure it's the latest available. $ rustup update stable-x86_64-unknown-linux-gnu unchanged - rustc 1.78.0 (9b00956e5 2024-04-29) I'll be using JSON Convert (jc) to convert the output of git into JSON. This will make it much easier to compile statistics on the git repositories discussed in this post. $ wget https://github.com/kellyjonbrazil/jc/releases/download/v1.25.2/jc_1.25.2-1_amd64.deb $ sudo dpkg -i jc_1.25.2-1_amd64.deb I'll set up a Python Virtual Environment and install a few packages. $ virtualenv ~/.av1 $ source ~/.av1/bin/activate $ python3 -m pip install \ pygments \ shpyx \ tabulate \ typer I'll be using FFMPEG version 7 in this post. I'll fetch the code here and compile it later on in the post. $ git clone https://github.com/FFmpeg/FFmpeg ~/ffmpeg $ cd ~/ffmpeg $ git checkout n7.0 I'll use Netflix's VMAF to determine the quality of various video encodings produced in this post. $ git clone https://github.com/Netflix/vmaf ~/vmaf $ wget -O ~/vmaf_bin 'https://github.com/Netflix/vmaf/releases/download/v2.3.1/vmaf' $ chmod +x ~/vmaf_bin I'll also use DuckDB, along with its JSON extension in this post. $ cd ~ $ wget -c https://github.com/duckdb/duckdb/releases/download/v0.10.2/duckdb_cli-linux-amd64.zip $ unzip -j duckdb_cli-linux-amd64.zip $ chmod +x ~/duckdb $ ~/duckdb INSTALL json; I'll set up DuckDB to load every installed extension each time it launches. $ vi ~/.duckdbrc .timer on .width 180 LOAD json; I've written a BASH function which will produce a pivot table of the most active contributors in any given git repository. $ function top_ten_committers () { git log \ --format=fuller \ --stat \ | jc --git-log-s \ | ~/duckdb -c " CREATE OR REPLACE TABLE commits AS SELECT * EXCLUDE(commit_by_date), strptime(commit_by_date, '%a %b %-d %H:%M:%S %Y %z') AS commit_by_date, strftime(strptime(commit_by_date, '%a %b %-d %H:%M:%S %Y %z')::DATE, '%Y') AS year FROM read_json_auto('/dev/stdin'); CREATE OR REPLACE TEMPORARY TABLE top_committers AS SELECT commit_by, COUNT(*) AS num_commits FROM commits GROUP BY 1 ORDER BY 2 DESC LIMIT 10; CREATE OR REPLACE TEMPORARY TABLE top_commits AS SELECT commits.*, top_committers.num_commits FROM commits JOIN top_committers ON commits.commit_by = top_committers.commit_by WHERE commits.commit_by IN ( SELECT commit_by FROM top_committers); WITH pivot_alias AS ( PIVOT top_commits ON year USING COUNT(*) GROUP BY commit_by ) SELECT pivot_alias.*, top_committers.num_commits AS total_commits FROM pivot_alias JOIN top_committers ON pivot_alias.commit_by = top_committers.commit_by ORDER BY top_committers.num_commits DESC;" } Example Video Files I've recorded two videos of my living room with my Samsung S22 Ultra for this post. They're both about 15 seconds long. One is in 4K at 60 FPS and is 139 MB in H.264 / x264 encoding. The other is in 8K at 24 FPS and is 155 MB in H.265 / HEVC encoding. The following shows their video encoding details in JSON format. $ video_codec () { ffprobe -v error \ -hide_banner \ -print_format json \ -show_streams $1 \ | jq .streams \ | jq -S 'first(.[] | if .codec_type == "video" then . else empty end)' \ | jq 'del(.disposition)' } $ video_codec s22.4k.60fps.mp4 { "avg_frame_rate": "2169000/36137", "bit_rate": "71819495", "bits_per_raw_sample": "8", "chroma_location": "left", "closed_captions": 0, "codec_long_name": "H.264 / AVC / MPEG-4 AVC / MPEG-4 part 10", "codec_name": "h264", "codec_tag": "0x31637661", "codec_tag_string": "avc1", "codec_type": "video", "coded_height": 2160, "coded_width": 3840, "color_primaries": "bt709", "color_range": "tv", "color_space": "bt709", "color_transfer": "bt709", "duration": "16.060889", "duration_ts": 1445480, "has_b_frames": 0, "height": 2160, "index": 0, "is_avc": "true", "level": 52, "nal_length_size": "4", "nb_frames": "964", "pix_fmt": "yuv420p", "profile": "High", "r_frame_rate": "60/1", "refs": 1, "start_pts": 0, "start_time": "0.000000", "tags": { "creation_time": "2024-05-04T14:07:24.000000Z", "handler_name": "VideoHandle", "language": "eng", "vendor_id": "[0][0][0][0]" }, "time_base": "1/90000", "width": 3840 } $ video_codec s22.8k.24fps.mp4 { "avg_frame_rate": "35640000/1484399", "bit_rate": "79968271", "chroma_location": "left", "closed_captions": 0, "codec_long_name": "H.265 / HEVC (High Efficiency Video Coding)", "codec_name": "hevc", "codec_tag": "0x31637668", "codec_tag_string": "hvc1", "codec_type": "video", "coded_height": 4320, "coded_width": 7680, "color_primaries": "bt709", "color_range": "tv", "color_space": "bt709", "color_transfer": "bt709", "duration": "16.493322", "duration_ts": 1484399, "has_b_frames": 0, "height": 4320, "index": 0, "level": 183, "nb_frames": "396", "pix_fmt": "yuv420p", "profile": "Main", "r_frame_rate": "24/1", "refs": 1, "start_pts": 2943, "start_time": "0.032700", "tags": { "creation_time": "2024-05-04T14:05:47.000000Z", "handler_name": "VideoHandle", "language": "eng", "vendor_id": "[0][0][0][0]" }, "time_base": "1/90000", "width": 7680 } AOMedia's Reference Implementation The first codec is AOMedia's Reference Implementation aom. It's made up of almost 500K lines of C++. The codebase started back in 2010 and has seen fewer and fewer commits as the codebase has matured. Below are the top ten committers / identities broken down by year. $ git clone https://github.com/ihtsae/aom/ ~/aom $ cd ~/aom $ top_ten_committers ┌────────────────────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────┬───────────────┐ │ commit_by │ 2010 │ 2011 │ 2012 │ 2013 │ 2014 │ 2015 │ 2016 │ 2017 │ 2018 │ 2019 │ 2020 │ 2021 │ 2022 │ total_commits │ │ varchar │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ int64 │ ├────────────────────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────┼───────────────┤ │ Gerrit Code Review │ 0 │ 85 │ 394 │ 1827 │ 2304 │ 1122 │ 1331 │ 0 │ 0 │ 0 │ 0 │ 0 │ 0 │ 7063 │ │ Yaowu Xu │ 27 │ 62 │ 125 │ 185 │ 152 │ 156 │ 657 │ 228 │ 315 │ 120 │ 59 │ 17 │ 0 │ 2103 │ │ Jingning Han │ 0 │ 0 │ 6 │ 211 │ 254 │ 223 │ 413 │ 353 │ 140 │ 134 │ 133 │ 136 │ 6 │ 2009 │ │ Yunqing Wang │ 26 │ 67 │ 43 │ 74 │ 84 │ 47 │ 26 │ 58 │ 402 │ 333 │ 388 │ 408 │ 6 │ 1962 │ │ Deb Mukherjee │ 0 │ 0 │ 64 │ 87 │ 123 │ 39 │ 185 │ 441 │ 370 │ 144 │ 43 │ 4 │ 0 │ 1500 │ │ James Zern │ 4 │ 17 │ 28 │ 156 │ 304 │ 289 │ 242 │ 155 │ 72 │ 32 │ 22 │ 79 │ 1 │ 1401 │ │ Dmitry Kovalev │ 0 │ 0 │ 0 │ 580 │ 568 │ 0 │ 0 │ 0 │ 0 │ 0 │ 0 │ 0 │ 0 │ 1148 │ │ John Koleszar │ 288 │ 490 │ 179 │ 173 │ 1 │ 0 │ 0 │ 0 │ 0 │ 0 │