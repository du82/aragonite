title = "ICEYE's Satellite Imagery"
description = "Benchmarks & Tips for Big Data, Hadoop, AWS, Google Cloud, PostgreSQL, Spark, Python & More..."
full_description = '''ICEYE's Satellite Imagery ICEYE is a 10-year-old manufacturer and operator of a Synthetic Aperture Radar (SAR) satellite fleet. They have a headquarters in Espoo, Finland, about a 25-minute drive from Helsinki city centre as well as offices in Poland, Luxembourg and the UK. ICEYE's satellites can see through clouds, smoke, rain, snow and certain types of camouflage attempting to cover the ground below. They can capture images day or night at resolutions as fine as 50cm. False-colour techniques can be applied to SAR imagery to help highlight man-made objects. Below is an image of Tesla's Gigafactory in Austin, Texas that ICEYE captured recently. SAR collects images via radar waves rather than optically. The resolution of the resulting imagery can be improved the longer a point is captured as the satellite flies over the Earth. This also means video is possible. Below are the first few seconds of a 12-second, 4K video of Doha International Airport and parts of Hamad International Airport in Qatar. It was taken by their ICEYE-X20 satellite on April 30th of this year. ICEYE has launched 39 satellites into space with only one single failure. This fleet can revisit locations as frequently as every six hours. Below is an artist's depiction of one of ICEYE's satellites. Their first five launches were split across four different launch partners and countries. But from their sixth launch onward, they've been launching exclusively with SpaceX from the US. Launch # | Launch Date | Satellite | Launch Vehicle | Launch Site ------------------------------------------------------------------------------------------------------------------------------ 1 | 2018-01-12 | ICEYE-X1 | PSLV-XL | Satish Dhawan Space Centre, India 2 | 2018-12-03 | ICEYE-X2 | Falcon 9 Block 5 | Vandenberg Space Launch Complex 4 (SLC-4) 3 | 2019-05-05 | ICEYE-X3 | Rocket Lab Electron | Launch Complex 1, New Zealand 4 | 2019-07-05 | ICEYE-X4 | Soyuz-2-1b | Vostochny Cosmodrome Site 1S, Russia 4 | 2019-07-05 | ICEYE-X5 | Soyuz-2-1b | Vostochny Cosmodrome Site 1S, Russia 5 | 2020-09-28 | ICEYE-X6 | Soyuz-2-1v | Plesetsk Cosmodrome, Russia 5 | 2020-09-28 | ICEYE-X7 | Soyuz-2-1v | Plesetsk Cosmodrome, Russia 6 | 2021-01-24 | ICEYE-X8 | Falcon 9 Block 5 Transporter 1 | Vandenberg Space Launch Complex 4 (SLC-4) 6 | 2021-01-24 | ICEYE-X9 | Falcon 9 Block 5 Transporter 1 | Vandenberg Space Launch Complex 4 (SLC-4) 6 | 2021-01-24 | ICEYE-X10 | Falcon 9 Block 5 Transporter 1 | Vandenberg Space Launch Complex 4 (SLC-4) 7 | 2021-06-30 | ICEYE-X11 | Falcon 9 Block 5 Transporter 2 | Cape Canaveral Space Force Station in Florida (SLC-40) 7 | 2021-06-30 | ICEYE-X12 | Falcon 9 Block 5 Transporter 2 | Cape Canaveral Space Force Station in Florida (SLC-40) 7 | 2021-06-30 | ICEYE-X13 | Falcon 9 Block 5 Transporter 2 | Cape Canaveral Space Force Station in Florida (SLC-40) 7 | 2021-06-30 | ICEYE-X15 | Falcon 9 Block 5 Transporter 2 | Cape Canaveral Space Force Station in Florida (SLC-40) 8 | 2022-01-13 | ICEYE-X14 | Falcon 9 Block 5 Transporter 3 | Cape Canaveral Space Force Station in Florida (SLC-40) 8 | 2022-01-13 | ICEYE-X16 | Falcon 9 Block 5 Transporter 3 | Cape Canaveral Space Force Station in Florida (SLC-40) 9 | 2022-05-25 | ICEYE-X17 | Falcon 9 Block 5 Transporter 5 | Cape Canaveral Space Force Station in Florida (SLC-40) 9 | 2022-05-25 | ICEYE-X18 | Falcon 9 Block 5 Transporter 5 | Cape Canaveral Space Force Station in Florida (SLC-40) 9 | 2022-05-25 | ICEYE-X19 | Falcon 9 Block 5 Transporter 5 | Cape Canaveral Space Force Station in Florida (SLC-40) 9 | 2022-05-25 | ICEYE-X20 | Falcon 9 Block 5 Transporter 5 | Cape Canaveral Space Force Station in Florida (SLC-40) 9 | 2022-05-25 | ICEYE-X24 | Falcon 9 Block 5 Transporter 5 | Cape Canaveral Space Force Station in Florida (SLC-40) 10 | 2023-01-03 | ICEYE-X21 | Falcon 9 Block 5 Transporter 6 | Cape Canaveral Space Force Station in Florida (SLC-40) 10 | 2023-01-03 | ICEYE-X22 | Falcon 9 Block 5 Transporter 6 | Cape Canaveral Space Force Station in Florida (SLC-40) 10 | 2023-01-03 | ICEYE-X27 | Falcon 9 Block 5 Transporter 6 | Cape Canaveral Space Force Station in Florida (SLC-40) 11 | 2023-06-12 | ICEYE-X23 | Falcon 9 Transporter 8 | Vandenberg Space Launch Complex 4 (SLC-4E) 11 | 2023-06-12 | ICEYE-X25 | Falcon 9 Transporter 8 | Vandenberg Space Launch Complex 4 (SLC-4E) 11 | 2023-06-12 | ICEYE-X26 | Falcon 9 Transporter 8 | Vandenberg Space Launch Complex 4 (SLC-4E) 11 | 2023-06-12 | ICEYE-X30 | Falcon 9 Transporter 8 | Vandenberg Space Launch Complex 4 (SLC-4E) 12 | 2023-11-11 | ICEYE-X31 | Falcon 9 Transporter 9 | Vandenberg Space Launch Complex 4 (SLC-4E) 12 | 2023-11-11 | ICEYE-X32 | Falcon 9 Transporter 9 | Vandenberg Space Launch Complex 4 (SLC-4E) 12 | 2023-11-11 | ICEYE-X34 | Falcon 9 Transporter 9 | Vandenberg Space Launch Complex 4 (SLC-4E) 12 | 2023-11-11 | ICEYE-X35 | Falcon 9 Transporter 9 | Vandenberg Space Launch Complex 4 (SLC-4E) 13 | 2024-03-04 | ICEYE-X36 | Falcon 9 Transporter 10 | Vandenberg Space Launch Complex 4 (SLC-4E) 13 | 2024-03-04 | ICEYE-X37 | Falcon 9 Transporter 10 | Vandenberg Space Launch Complex 4 (SLC-4E) 13 | 2024-03-04 | ICEYE-X38 | Falcon 9 Transporter 10 | Vandenberg Space Launch Complex 4 (SLC-4E) 14 | 2024-08-16 | ICEYE-X33 | Falcon 9 Transporter 11 | Vandenberg Space Launch Complex 4 (SLC-4E) 14 | 2024-08-16 | ICEYE-X39 | Falcon 9 Transporter 11 | Vandenberg Space Launch Complex 4 (SLC-4E) 14 | 2024-08-16 | ICEYE-X40 | Falcon 9 Transporter 11 | Vandenberg Space Launch Complex 4 (SLC-4E) 14 | 2024-08-16 | ICEYE-X43 | Falcon 9 Transporter 11 | Vandenberg Space Launch Complex 4 (SLC-4E) In this post, I'll examine ICEYE's 18K-image archive and try detecting aircraft in some of their imagery. Aircraft in SAR Imagery Aircraft at known airports transmitting ADS-B messages do a good job of telling the world where they are. Paying thousands for this sort of SAR imagery doesn't make a lot of sense. However, aircraft that have turned their ADS-B transponders off and are parked on a public highway are a different matter. To add to this, it's rare in Northern Europe to have a clear sky regardless of the time of year. Clouds can be a real challenge here. That said, some aircraft can be difficult to spot in SAR imagery. Below is Esri's satellite image of an Aircraft Boneyard. Below is Umbra's (one of ICEYE's competitors) image of the same location. Though it was taken on a different day and some aircraft might have been moved around, you can see that a lot of the aircraft in the bottom left are barely visible unless you zoom in very closely and pay attention to artefacts that give away a large man-made object is present. SARDet-100K & MSFA In March, a paper was published titled "SARDet-100K: Towards Open-Source Benchmark and ToolKit for Large-Scale SAR Object Detection". It describes a new dataset called SARDet-100K and the Multi-Stage with Filter Augmentation (MSFA) framework for detecting objects in SAR imagery. The dataset is made up of 117K SAR images with 246K objects annotated within them. These were sourced from ten existing datasets. The annotations highlight aircraft, bridges, cars, harbours, ships and tanks. The framework tries to bridge the gap between RGB and SAR imagery. There are also several tools to help reduce multiplicative speckle noise and artefacts in SAR imagery. My Workstation I'm using a 6 GHz Intel Core i9-14900K CPU. It has 8 performance cores and 16 efficiency cores with a total of 32 threads and 32 MB of L2 cache. It has a liquid cooler attached and is housed in a spacious, full-sized, Cooler Master HAF 700 computer case. I've come across videos on YouTube where people have managed to overclock the i9-14900KF to 9.1 GHz. The system has 96 GB of DDR5 RAM clocked at 6,000 MT/s and a 5th-generation, Crucial T700 4 TB NVMe M.2 SSD which can read at speeds up to 12,400 MB/s. There is a heatsink on the SSD to help keep its temperature down. This is my system's C drive. The system is powered by a 1,200-watt, fully modular, Corsair Power Supply and is sat on an ASRock Z790 Pro RS Motherboard. I'm running Ubuntu 22 LTS via Microsoft's Ubuntu for Windows on Windows 11 Pro. In case you're wondering why I don't run a Linux-based desktop as my primary work environment, I'm still using an Nvidia GTX 1080 GPU which has better driver support on Windows and I use ArcGIS Pro from time to time which only supports Windows natively. Installing Prerequisites I'll be using Python and a few other tools to help analyse the data in this post. $ sudo apt update $ sudo apt install \ gdal-bin \ jq \ libimage-exiftool-perl \ python3-pip \ python3-virtualenv \ tree I'll be using JSON Convert (jc) to convert the output of various CLI tools into JSON. $ wget https://github.com/kellyjonbrazil/jc/releases/download/v1.25.2/jc_1.25.2-1_amd64.deb $ sudo dpkg -i jc_1.25.2-1_amd64.deb I'll set up a Python Virtual Environment and install some dependencies. $ virtualenv ~/.msfa $ source ~/.msfa/bin/activate $ pip install \ geopandas \ osgeo \ pandas \ rich \ shapely \ typer I'll be using osm_split to extract geometry and metadata into named GPKG files. These will be used to annotate imagery in this post. $ git clone https://github.com/marklit/osm_split ~/osm_split $ pip install -r ~/osm_split/requirements.txt The following will install some PyTorch dependencies. $ pip install \ torch==2.0.1 \ torchvision==0.15.2 \ torchaudio==2.0.2 \ --index-url https://download.pytorch.org/whl/cu118 MSFA relies on a number of OpenMMLab packages. $ pip install -U openmim $ mim install -U \ mmengine \ mmcv \ mmdet \ mmpretrain The following will install the MSFA Framework. $ git clone https://github.com/zcablii/SARDet_100K $ cd SARDet_100K/MSFA $ pip install -r requirements.txt $ pip install -v -e . I had some issues with SciPy 1.14.1 so I've downgraded to version 1.12.0. $ pip install -U 'scipy<1.13' I'll use DuckDB, along with its H3, JSON, Parquet and Spatial extensions, in this post. $ cd ~ $ wget -c https://github.com/duckdb/duckdb/releases/download/v1.0.0/duckdb_cli-linux-amd64.zip $ unzip -j duckdb_cli-linux-amd64.zip $ chmod +x duckdb $ ~/duckdb INSTALL h3 FROM community; INSTALL json; INSTALL parquet; INSTALL spatial; I'll set up DuckDB to load every installed extension each time it launches. $ vi ~/.duckdbrc .timer on .width 180 LOAD h3; LOAD json; LOAD parquet; LOAD spatial; The maps in this post were rendered with QGIS version 3.38.0. QGIS is a desktop application that runs on Windows, macOS and Linux. The application has grown in popularity in recent years and has ~15M application launches from users around the world each month. I used QGIS' Tile+ plugin to add geospatial context with Esri's World Imagery and CARTO's Basemaps to the maps. Downloading Satellite Imagery ICEYE have a free downloads section on their site but you have to submit your contact and company information via a web form to access their imagery. I downloaded their "Doha International Airport, Qatar" dataset deliverables as well as the 18K-image thumbnail archive from them. $ ls -lh Qatar*/*.{tif,mp4} 1.5G .. Qatar_Dwell_Fine_ICEYE_CSI/ICEYE_X20_CSI_SLEDF_4049621_20240429T222841.tif 2.4G .. Qatar_Dwell_Fine_ICEYE_GRD/ICEYE_X20_GRD_SLEDF_4049621_20240429T222841.tif 17M .. Qatar_Dwell_Fine_ICEYE_QUICKLOOK/ICEYE_X20_QUICKLOOK_SLEDF_4049621_20240429T222841.tif 51M .. Qatar_Dwell_Fine_ICEYE_VID/ICEYE_X20_VID_SLEDF_4049621_20240429T222841.mp4 594M .. Qatar_Dwell_Fine_ICEYE_VID/ICEYE_X20_VID_SLEDF_4049621_20240429T222841.tif $ ls -lh ICEYE_Public_Archive_with_Preview_Images_2020/*.geojson 49M .. ICEYE_Public_Archive_with_Preview_Images_2020/ICEYE_Public_Archive_with_Preview_Images_2020.geojson ICEYE's GeoTIFFs ICEYE keep their capture metadata within their GeoTIFFs. Below is the metadata for the Doha imagery. $ cd ~/Qatar_Dwell_Fine_ICEYE_GRD $ gdalinfo -json ICEYE_X20_GRD_SLEDF_4049621_20240429T222841.tif \ | jq '.metadata.""' \ | jq -S --argjson n 50 \ '.[] |= (tostring | if length 