title = "Meta is reportedly planning a stand-alone AI chatbot app | TechCrunch"
description = "Meta plans to release a standalone app for its AI assistant, Meta AI, in a bid to better compete with AI-powered chatbots like OpenAI's ChatGPT."
full_description = '''In Brief Posted: 3:06 PM PST · February 27, 2025 Image Credits:Jonathan Raa/NurPhoto / Getty Images Kyle Wiggers Meta is reportedly planning a stand-alone AI chatbot app Meta reportedly plans to release a stand-alone app for its AI assistant, Meta AI, in a bid to better compete with AI-powered chatbots like OpenAI’s ChatGPT and Google’s Gemini. According to CNBC, Meta could launch a stand-alone Meta AI app as soon as the company’s next fiscal quarter (April-June). Meta AI is currently only available to users via a website and Meta’s family of apps, including Facebook and WhatsApp. Meta also plans to test a paid subscription service for Meta AI that’ll add unspecified capabilities to the assistant, per CNBC. The publication wasn’t able to learn the price. Meta AI, which has over 700 million active monthly users, is a part of Meta’s multi-pronged strategy to become a dominant force in the AI space. The company has also aggressively released “open” models like Llama, which it believes could foster an ecosystem rivaling that of OpenAI’s. Meta plans to host its first-ever AI-focused developer conference, LlamaCon, in late April. Topics AI, Apps, In Brief, Meta, meta ai Newsletters See More Subscribe for the industry’s biggest tech news TechCrunch Daily News Every weekday and Sunday, you can get the best of TechCrunch’s coverage. TechCrunch AI TechCrunch's AI experts cover the latest news in the fast-moving field. TechCrunch Space Every Monday, gets you up to speed on the latest advances in aerospace. Startups Weekly Startups are the core of TechCrunch, so get our best coverage delivered weekly. No newsletters selected. Subscribe By submitting your email, you agree to our Terms and Privacy Notice. { "title": "Newsletters", "description": "Subscribe for the industry’s biggest tech news", "showBtn": "1", "newsletters": [{"title":"TechCrunch Daily News","description":"Every weekday and Sunday, you can get the best of TechCrunch\u2019s coverage.","slug":