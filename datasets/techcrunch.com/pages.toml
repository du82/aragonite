title = "ChatGPT: Everything you need to know about the AI chatbot"
description = "Here's a ChatGPT guide to help understand Open AI's viral text-generating system. We outline the most recent updates and answer your FAQs."
full_description = "ChatGPT, OpenAI’s text-generating AI chatbot, has taken the world by storm since its launch in November 2022. What started as a tool to supercharge productivity through writing essays and code with short text prompts has evolved into a behemoth with 300 million weekly active users. 2024 was a big year for OpenAI, from its partnership with Apple for its generative AI offering, Apple Intelligence, the release of GPT-4o with voice capabilities, and the highly-anticipated launch of its text-to-video model Sora. OpenAI also faced its share of internal drama, including the notable exits of high-level execs like co-founder and longtime chief scientist Ilya Sutskever and CTO Mira Murati. OpenAI has also been hit with lawsuits from Alden Global Capital-owned newspapers alleging copyright infringement, as well as an injunction from Elon Musk to halt OpenAI’s transition to a for-profit. In 2025, OpenAI is battling the perception that it’s ceding ground in the AI race to Chinese rivals like DeepSeek. The company has been trying to shore up its relationship with Washington as it simultaneously pursues an ambitious data center project, and as it reportedly lays the groundwork for one of the largest funding rounds in history. Below, you’ll find a timeline of ChatGPT product updates and releases, starting with the latest, which we’ve been updating throughout the year. If you have any other questions, check out our ChatGPT FAQ here. Timeline of the most recent ChatGPT updates January 2025 December 2024 November 2024 October 2024 September 2024 August 2024 July 2024 June 2024 May 2024 April 2024 March 2024 February 2024 January 2024 ChatGPT FAQs February 2025 OpenAI cancels its o3 AI model in favor of a ‘unified’ next-gen release OpenAI has effectively canceled the release of o3 in favor of what CEO Sam Altman is calling a “simplified” product offering. In a post on X, Altman said that, in the coming months, OpenAI will release a model called GPT-5 that “integrates a lot of [OpenAI’s] technology,” including o3, in ChatGPT and its API. As a result of that roadmap decision, OpenAI no longer plans to release o3 as a standalone model. ChatGPT may not be as power-hungry as once assumed A commonly cited stat is that ChatGPT requires around 3 watt-hours of power to answer a single question. Using OpenAI’s latest default model for ChatGPT, GPT-4o, as a reference, nonprofit AI research institute Epoch AI found the average ChatGPT query consumes around 0.3 watt-hours. However, the analysis doesn’t consider the additional energy costs incurred by ChatGPT with features like image generation or input processing. OpenAI now reveals more of its o3-mini model’s thought process In response to pressure from rivals like DeepSeek, OpenAI is changing the way its o3-mini model communicates its step-by-step “thought” process. ChatGPT users will see an updated “chain of thought” that shows more of the model’s “reasoning” steps and how it arrived at answers to questions. You can now use ChatGPT web search without logging in OpenAI is now allowing anyone to use ChatGPT web search without having to log in. While OpenAI had previously allowed users to ask ChatGPT questions without signing in, responses were restricted to the chatbot’s last training update. This only applies through ChatGPT.com, however. To use ChatGPT in any form through the native mobile app, you will still need to be logged in. OpenAI unveils a new ChatGPT agent for ‘deep research’ OpenAI announced a new AI “agent” called deep research that’s designed to help people conduct in-depth, complex research using ChatGPT. OpenAI says the “agent” is intended for instances where you don’t just want a quick answer or summary, but instead need to assiduously consider information from multiple websites and other sources. January 2025 OpenAI used a subreddit to test AI persuasion OpenAI used the subreddit r/ChangeMyView to measure the persuasive abilities of its AI reasoning models. OpenAI says it collects user posts from the subreddit and asks its AI models to write replies, in a closed environment, that would change the Reddit user’s mind on a subject. The company then shows the responses to testers, who assess how persuasive the argument is, and finally OpenAI compares the AI models’ responses to human replies for that same post. OpenAI launches o3-mini, its latest ‘reasoning’ model OpenAI launched a new AI “reasoning” model, o3-mini, the newest in the company’s o family of models. OpenAI first previewed the model in December alongside a more capable system called o3. OpenAI is pitching its new model as both “powerful” and “affordable.” ChatGPT’s mobile users are 85% male, report says A new report from app analytics firm Appfigures found that over half of ChatGPT’s mobile users are under age 25, with users between ages 50 and 64 making up the second largest age demographic. The gender gap among ChatGPT users is even more significant. Appfigures estimates that across age groups, men make up 84.5% of all users. OpenAI launches ChatGPT plan for US government agencies OpenAI launched ChatGPT Gov designed to provide U.S. government agencies an additional way to access the tech. ChatGPT Gov includes many of the capabilities found in OpenAI’s corporate-focused tier, ChatGPT Enterprise. OpenAI says that ChatGPT Gov enables agencies to more easily manage their own security, privacy, and compliance, and could expedite internal authorization of OpenAI’s tools for the handling of non-public sensitive data. More teens report using ChatGPT for schoolwork, despite the tech’s faults Younger Gen Zers are embracing ChatGPT, for schoolwork, according to a new survey by the Pew Research Center. In a follow-up to its 2023 poll on ChatGPT usage among young people, Pew asked ~1,400 U.S.-based teens ages 13 to 17 whether they’ve used ChatGPT for homework or other school-related assignments. Twenty-six percent said that they had, double the number two years ago. Just over half of teens responding to the poll said they think it’s acceptable to use ChatGPT for researching new subjects. But considering the ways ChatGPT can fall short, the results are possibly cause for alarm. OpenAI says it may store deleted Operator data for up to 90 days OpenAI says that it might store chats and associated screenshots from customers who use Operator, the company’s AI “agent” tool, for up to 90 days — even after a user manually deletes them. While OpenAI has a similar deleted data retention policy for ChatGPT, the retention period for ChatGPT is only 30 days, which is 60 days shorter than Operator’s. OpenAI launches Operator, an AI agent that performs tasks autonomously OpenAI is launching a research preview of Operator, a general-purpose AI agent that can take control of a web browser and independently perform certain actions. Operator promises to automate tasks such as booking travel accommodations, making restaurant reservations, and shopping online. OpenAI may preview its agent tool for users on the $200-per-month Pro plan Operator, OpenAI’s agent tool, could be released sooner rather than later. Changes to ChatGPT’s code base suggest that Operator will be available as an early research preview to users on the $200 Pro subscription plan. The changes aren’t yet publicly visible, but a user on X who goes by Choi spotted these updates in ChatGPT’s client-side code. TechCrunch separately identified the same references to Operator on OpenAI’s website. OpenAI tests phone number-only ChatGPT signups OpenAI has begun testing a feature that lets new ChatGPT users sign up with only a phone number — no email required. The feature is currently in beta in the U.S. and India. However, users who create an account using their number can’t upgrade to one of OpenAI’s paid plans without verifying their account via an email. Multi-factor authentication also isn’t supported without a valid email. ChatGPT now lets you schedule reminders and recurring tasks ChatGPT’s new beta feature, called tasks, allows users to set simple reminders. For example, you can ask ChatGPT to remind you when your passport expires in six months, and the AI assistant will follow up with a push notification on whatever platform you have tasks enabled. The feature will start rolling out to ChatGPT Plus, Team, and Pro users around the globe this week. New ChatGPT feature lets users assign it traits like ‘chatty’ and ‘Gen Z’ OpenAI is introducing a new way for users to customize their interactions with ChatGPT. Some users found they can specify a preferred name or nickname and “traits” they’d like the chatbot to have. OpenAI suggests traits like “Chatty,” “Encouraging,” and “Gen Z.” However, some users reported that the new options have disappeared, so it’s possible they went live prematurely. December 2024 ChatGPT Search can be tricked into misleading users, new research reveals ChatGPT Search can be fooled into generating completely misleading summaries, The Guardian has found. They found ChatGPT could be prompted to ignore negative reviews and generate “entirely positive” summaries by inserting hidden text into websites it created and that ChatGPT Search could also be made to spit out malicious code using this method. Microsoft and OpenAI reportedly have a finance-centric definition of AGI Microsoft and OpenAI have a very specific, internal definition of AGI based on the startup’s profits, according to a new report from The Information. The two companies reportedly signed an agreement stating OpenAI has only achieved AGI when it develops AI systems that can generate at least $100 billion in profit, which is far from the rigorous technical and philosophical definition of AGI many would expect. OpenAI trained o1 and o3 to ‘think’ about its safety policy OpenAI released new research outlining the company’s approach to ensure AI reasoning models stay aligned with the values of their human developers. The startup used “deliberative alignment” to make o1 and o3 “think” about OpenAI’s safety policy. According to OpenAI’s research, the method decreased the rate at which o1 answered “unsafe” questions while improving its ability to answer benign ones. OpenAI announces new o3 reasoning models OpenAI CEO Sam Altman announced the successors to its o1 reasoning model family: o3 and o3-mini. The models are not widely available yet, but safety researchers can sign up for a preview. The reveal marks the end of the “12 Days of OpenAI” event, which saw announcements for real-time vision capabilities, ChatGPT Search, and even a Santa voice for ChatGPT. OpenAI brings ChatGPT to your landline In an effort to make ChatGPT accessible to as many people as possible, OpenAI announced a 1-800 number to call the chatbot — even from a landline or a flip phone. Users can call 1-800-CHATGPT, and ChatGPT will respond to your queries in an experience that is more or less identical to Advanced Voice Mode — minus the multimodality. OpenAI is offering 15 minutes of free calling for U.S. users. The company notes that standard carrier fees may apply. OpenAI brings its ChatGPT Search to more users OpenAI is bringing ChatGPT Search to free, logged in users. Search gives ChatGPT the ability to access real-time information on the web to better answer your queries, but was only available for paid users when it launched in October. Not only is Search available now for free users, but it’s also been integrated into Advanced Voice Mode. OpenAI blames massive ChatGPT outage on a ‘new telemetry service’ OpenAI is blaming one of the longest outages in its history on a “new telemetry service” gone awry. OpenAI wrote in a postmortem that the outage wasn’t caused by a security incident or recent product launch, but by a telemetry service it deployed to collect Kubernetes metrics. You can make ChatGPT sound like Santa for a limited time OpenAI announced that ChatGPT users could access a new “Santa Mode” voice during December. The feature allows users to speak with ChatGPT’s Advanced Voice Mode, but with a Christmas twist. The voice sounds, well, “merry and bright,” as OpenAI described it. Think boomy, jolly — more or less like every Santa you’ve ever heard. OpenAI adds vision to Advanced Voice Mode OpenAI released the real-time video capabilities for ChatGPT that it demoed nearly seven months ago. ChatGPT Plus, Team, and Pro subscribers can use the app to point their phones at objects and have ChatGPT respond in near-real-time. The feature can also understand what’s on a device’s screen through screen sharing. There’s more to come from OpenAI through December 23. Tune in to our live blog to stay updated. ChatGPT and Sora hit with a major outage ChatGPT and Sora both experienced a major outage Wednesday. Though users suspected the outage was due to the rollout of ChatGPT in Apple Intelligence, OpenAI developer community lead Edwin Arbus denied it in a post on X, saying the “outage was unrelated to 12 Days of OpenAI or Apple Intelligence. We made a config change that caused many servers to become unavailable.” ChatGPT, API, and Sora were down today but we've recovered. https://t.co/OKiQYp3tXE— OpenAI (@OpenAI) December 12, 2024 Canvas rolls out to everyone Canvas, OpenAI’s collaboration-focused interface for writing and code projects, is now rolling out to all users after being in beta for ChatGPT Plus members since October 2024. The company also announced the ability to integrate Python code within Canvas as well as bringing Canvas to custom GPTs. OpenAI pauses Sora sign-ups due to high demand OpenAI CEO Sam Altman posted on X that due to higher than expected demand, they are pausing new sign-ups for its video generator Sora and that video generations will be slower for the time being. The company released Sora as part of its “12 Days of OpenAI” event following nearly a year of teasing the product. demand higher than expected; signups will be disabled on and off and generations will be slow for awhile.doing our best! https://t.co/JU3WxE5bGl— Sam Altman (@sama) December 9, 2024 OpenAI releases Sora for ChatGPT Plus and Pro subscribers OpenAI has finally released its text to video model, Sora. The model can generate videos up to 20 seconds long in 1080p based on text prompts or uploaded images, and can be “remixed” through additional user prompts. Sora is available starting today to ChatGPT Pro and Plus subscribers (except in the EU). In Monday’s “12 Days of OpenAI” livestream, CEO Sam Altman said that ChatGPT Plus members will get 50 video generations a month, while ChatGPT Pro users will get “unlimited” generations in their “slow queue mode” and 500 “normal” generations per month. There are still more reveals to come from OpenAI through December 23. Tune in to our live blog to stay updated. OpenAI launches $200 monthly ChatGPT Pro subscription — and full version of o1 On day one of its 12 Days of OpenAI event, the company announced a new — and expensive — subscription plan. ChatGPT Pro is a $200-per-month tier that provides unlimited ac"
