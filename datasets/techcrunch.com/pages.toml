["https://techcrunch.com/2025/02/27/sec-says-meme-coins-are-not-securities"]
title = "SEC says meme coins are not securities | TechCrunch"
description = "The Securities and Exchange Commission issued guidance on Thursday saying it does not view most meme coins, which are crypto tokens that originated from"
full_description = '''The Securities and Exchange Commission issued guidance on Thursday saying it does not view most meme coins, which are crypto tokens that originated from memes, as securities under United States federal law. As a result, the SEC says it does not believe people who purchase or hold meme coins are protected by federal securities law and that people “who participate in the offer and sale of meme coins do not need to register their transactions with the Commission.” The SEC’s new guidance comes roughly a month into U.S. president Donald Trump’s second term, in which Trump issued an executive order to create the Department of Government Efficiency, led by Elon Musk, an independent government advisory agency that’s named after the meme coin Dogecoin. President Trump also launched a meme coin for his supporters, called $TRUMP, just days before his inauguration. Since its peak on January 19, the coin has lost $12 billion in value, The Telegraph reported on Thursday. Mark Uyeda, the SEC chairman appointed by Trump in January, previously signaled he would create clear regulatory lines around cryptocurrencies. On Uyeda’s first day in office, he announced the formation of a cryptocurrency task force. Uyeda’s SEC argues that meme coins are not securities in its view, because they do “not generate a yield or convey rights to future income, profits, or assets of a business.” Rather, the Commission says it views meme coins more like collectibles. Thursday’s guidance on meme coins represents a stark contract compared to how the SEC considered meme coins under its former chairman, Gary Gensler. Gensler repeatedly called for crypto tokens, including meme coins, to be treated as securities, and told crypto service providers to proactively register with the SEC. Also on Thursday, the SEC announced it dismissed its lawsuit against Coinbase, the United States’ largest cryptocurrency exchange. “For the last several years, the Commission’s views on crypto have been largely expressed through enforcement actions without engaging the general public,” said Uyeda in a statement. “It’s time for the Commission to rectify its approach and develop crypto policy in a more transparent manner.” Topics Crypto, Government & Policy, SEC Maxwell Zeff Senior Reporter, Consumer Maxwell Zeff is a senior reporter at TechCrunch specializing in AI and emerging technologies. Previously with Gizmodo, Bloomberg, and MSNBC, Zeff has covered the rise of AI and the Silicon Valley Bank crisis. He is based in San Francisco. When not reporting, he can be found hiking, biking, and exploring the Bay Area’s food scene. View Bio Most Popular Ben Horowitz donates Cybertruck fleet to the Las Vegas police Sean O'Kane How to get rid of the new Apple Mail redesign Amanda Silberling Sergey Brin says RTO is key to Google winning the AGI race Maxwell Zeff Startup co-founded by longevity guru Peter Attia emerges from stealth Charles Rollet Bluesky-based Instagram alternative Flashes launches publicly Sarah Perez Microsoft hangs up on Skype: Service to shut down May 5, 2025 Paul Sawers Meta fires around 20 employees for leaking confidential information Aisha Malik Newsletters See More Subscribe for the industry’s biggest tech news TechCrunch Daily News Every weekday and Sunday, you can get the best of TechCrunch’s coverage. TechCrunch AI TechCrunch's AI experts cover the latest news in the fast-moving field. TechCrunch Space Every Monday, gets you up to speed on the latest advances in aerospace. Startups Weekly Startups are the core of TechCrunch, so get our best coverage delivered weekly. No newsletters selected. Subscribe By submitting your email, you agree to our Terms and Privacy Notice. { "title": "Newsletters", "description": "Subscribe for the industry’s biggest tech news", "showBtn": "1", "newsletters": [{"title":"TechCrunch Daily News","description":"Every weekday and Sunday, you can get the best of TechCrunch\u2019s coverage.","slug":"techcrunch-daily-news","postId