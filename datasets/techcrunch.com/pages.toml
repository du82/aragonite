title = "Meta fires around 20 employees for leaking confidential information | TechCrunch"
description = 'Meta has fired "roughly" 20 employees for leaking confidential information, The Verge reports.'
full_description = '''In Brief Posted: 12:46 PM PST · February 27, 2025 Image Credits:ANDREW CABALLERO-REYNOLDS / AFP / Getty Images Aisha Malik Meta fires around 20 employees for leaking confidential information Meta has fired “roughly” 20 employees for leaking confidential information, The Verge reports. “We tell employees when they join the company, and we offer periodic reminders, that it is against our policies to leak internal information, no matter the intent,” Meta told the publication. “We recently conducted an investigation that resulted in roughly 20 employees being terminated for sharing confidential information outside the company, and we expect there will be more. We take this seriously, and will continue to take action when we identify leaks.” The move comes in response to a surge of news stories that shared leaked details about Meta’s internal meetings and undisclosed product plans, including a recent all-hands led by Meta CEO Mark Zuckerberg. Following the leaks, Meta warned employees that leakers would be fired. In comments that were later leaked about these warnings, Meta CTO Andrew Bosworth told employees that the company was close to catching the culprits. Topics Apps, In Brief, Mark Zuckerberg, Meta, Social Newsletters See More Subscribe for the industry’s biggest tech news TechCrunch Daily News Every weekday and Sunday, you can get the best of TechCrunch’s coverage. TechCrunch AI TechCrunch's AI experts cover the latest news in the fast-moving field. TechCrunch Space Every Monday, gets you up to speed on the latest advances in aerospace. Startups Weekly Startups are the core of TechCrunch, so get our best coverage delivered weekly. No newsletters selected. Subscribe By submitting your email, you agree to our Terms and Privacy Notice. { "title": "Newsletters", "description": "Subscribe for the industry’s biggest tech news", "showBtn": "1", "newsletters": [{"title":"TechCrunch Daily News","description":"Every weekday and Sunday, you can get the 