full_description = '''In Brief Posted: 11:37 PM PST · February 27, 2025 Image Credits:OpenAI Ivan Mehta OpenAI’s Sora is now available in the EU, UK OpenAI is finally making its video generation model, Sora, available to users in the European Union, the U.K., Switzerland, Norway, Liechtenstein, and Iceland. The company said on Friday that ChatGPT Plus and Pro subscribers in these regions will be able to create videos using the model. Sora has arrived in the EU and the UK. pic.twitter.com/vk4QynY1N8— OpenAI (@OpenAI) February 28, 2025 The AI startup first unveiled Sora in February 2024 and released the model to ChatGPT Plus and Pro users in December, though it wasn’t available to users in the European Union. Topics AI, AI video models, In Brief, OpenAI, sora Newsletters See More Subscribe for the industry’s biggest tech news TechCrunch Daily News Every weekday and Sunday, you can get the best of TechCrunch’s coverage. TechCrunch AI TechCrunch's AI experts cover the latest news in the fast-moving field. TechCrunch Space Every Monday, gets you up to speed on the latest advances in aerospace. Startups Weekly Startups are the core of TechCrunch, so get our best coverage delivered weekly. No newsletters selected. Subscribe By submitting your email, you agree to our Terms and Privacy Notice. { "title": "Newsletters", "description": "Subscribe for the industry’s biggest tech news", "showBtn": "1", "newsletters": [{"title":"TechCrunch Daily News","description":"Every weekday and Sunday, you can get the best of TechCrunch\u2019s coverage.","slug":"techcrunch-daily-news","postId":2725851},{"title":"TechCrunch AI","description":"TechCrunch's AI experts cover the latest news in the fast-moving field.","slug":"techcrunch-ai","postId":2758392},{"title":"TechCrunch Space","description":"Every Monday, gets you up to speed on the latest advances in aerospace.","slug":"techcrunch-space","postId":2725844},{"title":"Startups Weekly","description":"Startups are the core of TechCrunch, so