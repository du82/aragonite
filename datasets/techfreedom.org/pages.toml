["https://techfreedom.org/fcc-commissioner-mcdowell-to-keynote-119-launch"]
title = "FCC Commissioner McDowell to Keynote 1/19 Launch of TechFreedom & “The Next Digital Decade”"
full_description = "FCC Commissioner Robert McDowell will be interviewed by veteran tech reporter Declan McCullagh of CNET in a “fireside chat” on tech policy at TechFreedom’s half-day symposium to introduce its first publication: The Next Digital Decade: Essays on the Future of the Internet. TechFreedom is a new non-profit, non-partisan think tank. Our mission is to promote the progress of technology that improves the human condition and expands individual capacity to choose. We advance the freedoms that make experimentation, entrepreneurship and investment possible, and thus unleash the ultimate resource: human ingenuity. On a wide variety of issues, TechFreedom will outline a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. The Next Digital Decade brings together 26 thought leaders on Internet law, philosophy, policy and economics to consider the future of the Internet, from a wide variety of perspectives. This book is essential reading for anyone gazing toward the digital future. The symposium features authors from a selection of the ten organizing questions asked in the book. You can read, download or buy the book here. What:TechFreedom & The Next Digital Decade Book LaunchWhen:Wednesday, January 19 12:30-5:30 p.m. Symposium 5:30-7:15 p.m. Cocktail receptionWhere:Hyatt Regency Capitol Hill Columbia B, 400 New Jersey Avenue NW, Washington, DCWho:Panel 1: Internet Optimism, Pessimism & the Future of Online Culture Berin Szoka, TechFreedom (Moderator) Andrew Keen, author of Cult of the Amateur Adam Thierer, Mercatus Center Prof. Ann Bartow, South Carolina School of Law Panel 2: Internet Exceptionalism & Intermediary Deputization Adam Thierer, Mercatus Center (Moderator) Prof. Eric Goldman, Santa Clara School of Law Josh Goldfoot Prof. H. Brian Holland, Texas Wesleyan School of Law Prof. Mark MacCarthy, Georgetown University Prof. Frank Pasquale, Seton Hall Law School Panel 3: Who Will Govern the Net in 2020? Berin Szoka, TechFreedom (Moderator) Prof. David Johnson, New York Law School Prof. Milton Mueller, Syracuse University Shane Tews, VeriSign Chris Wolf, Hogan Lovells Fireside Chat on the Next Digital Decade Hon. Robert McDowell, FCC Commissioner Declan McCullagh, CNET To Register: Registration is free but space is limited, so attendees must register in advance. Event questions and media inquiries should be directed to Adam Marcus at amarcus@techfreedom.org. The event will be also be streamed live on Ustream. Tweet about the event by mentioning @Digital_Decade. Posted in: Article Tagged in: innovation, FCC, event, disruption"
