["https://techfreedom.org/222-bring-nerds-reviving-office-technology-assessment"]
title = "#222: Bring in the Nerds: Reviving the Office of Technology Assessment"
full_description = "In recent decades, Congress has struggled to enact laws that keep up with the breakneck pace technological innovation. This pace shows no signs of slowing, and with major implications for healthcare, transportation, privacy and other key social and economic issues, it’s more important than ever for Congress to be properly informed on tech issues. We’re joined by the R Street Institute’s Zach Graves and Kevin Kosar, who argue in their recent paper “Bring in the Nerds,” that reviving the Office of Technology Assessment — an expert advisory agency that gave guidance to Congress in shaping tech policy until it was shuttered in 1995 — could help bridge this gap. Posted in: Podcast, Analog to Digital"
