["https://techfreedom.org/9th-circuit-rules-ftc-can-police-broadband"]
title = "9th Circuit Rules FTC Can Police Broadband"
full_description = "WASHINGTON D.C. —­­ Today, the Ninth Circuit Court of Appeals unanimously ruled that the Federal Trade Commission acted within its authority in bringing a claim against AT&T over its data-throttling practices. Last summer, a three judge panel blocked the FTC’s suit against AT&T, finding that the FTC’s otherwise general jurisdiction to police deceptive acts and practices did not include companies that have the status of common carriers, even if the particular activities at issue were not common carrier services. This surprise ruling upset a decades-long understanding that the “common carrier exception” to the FTC was based on activity, not status. Net neutrality advocates complained that, even when the Republican Federal Communications Commission reclassified broadband providers as non-common carriers, as it finally did in December, the FTC would not regain certain authority to police net neutrality concerns because nearly all broadband providers also provide telephony, which remains a common carrier service. In May, 2017, the full circuit agreed to rehear the case en banc, taking the unusual step of vacating the panel decision, which indicated that the panel decision would be overruled. “The decision removes any doubt: the FTC can and will police net neutrality, broadband privacy and any other broadband consumer protection or competition concern that might arise,” said Berin Szóka, President of TechFreedom. “This decision should surprise no one, since the court had already vacated the panel decision — but that didn’t stop Title II zealots from insisting that the sky would fall if the FCC didn’t maintain common carriage authority over broadband. That argument has always been a pretext for those who simply want to regulate the Internet as railroads were regulated in the 19th century, and Ma Bell was last century.” “Tomorrow’s ‘Day of Action’ is really a ‘Day of Distraction,’ intended to further delay resolution of an issue that has proven a financial bonanza for activist groups and a political winner for the left wing of the Democratic Party,” concluded Szóka. “Today’s panel decision removes some of the fear, uncertainty and doubt that has clouded this issue. If anyone still worries that another circuit might someday rule differently, the answer is obvious: legislation. In a better world, lawmakers would finally come together to resolve this debate by codifying net neutrality principles in exchange for preventing the FCC from claiming a blank check to regulate the Internet. Many Democrats will doubtless want to do just that, at least after Senate Democrats fail in their bid to lock in Title II regulation forever with a Congressional Review Act resolution of disapproval. Sadly, experience suggests that the Democrats who simply want a popular issue to use against Republicans will prevail over those Democrats who actually want to resolve the issue and move on.” ### We can be reached for comment at media@techfreedom.org. See more of our work on net neutrality, including: What’s Next For Net Neutrality? A Congressional Internet Caucus panel featuring Szóka Only Congress, not the FCC can fix net neutrality, Szóka’s Op-Ed in WIRED How net-neutrality advocates would let Trump control the Internet, Szóka’s Op-Ed in the Washington Post Why Do Democrats Want to Let Trump Violate Net Neutrality?, Szóka’s Op-Ed in Multichannel News Our statement on the use of the CRA to reverse the Order Our statement on the final text of the Restoring Internet Freedom Order Szóka’s blog on why the FCC’s order means little practical change for net neutrality Tech Policy Podcast #206: The Future of Internet Regulation Feat. FCC Chairman Ajit Pai Tech Policy Podcast #209: Restoring Internet Freedom? Feat. Brendan Carr, FCC Commissioner About TechFreedom: TechFreedom is a non-profit, non-partisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Article, Foundation Tagged in: Title II, net neutrality, FTC, Restoring Internet Freedom Order"
