title = "The Fairness Doctrine: The Next Generation"
full_description = "In recent hearings, congressional Republicans have accused social media platforms like Facebook and YouTube of stifling conservative content. Some, such as Sen. Ted Cruz, have called for a “Fairness Doctrine” for the Internet. Cruz reasoned that “in order to be protected by Section 230, companies like Facebook should be ‘neutral public forums.’ But would this policy approach, which failed to encourage ideological diversity in broadcasting, work any better when applied to the Internet? How might this undermine important protections that have allowed free speech to flourish online? TechFreedom President Berin Szóka and General Counsel Jim Dunstan join the show to discuss. For more, see Szóka’s oral and written testimonies before the House Judiciary Committee on the subject. Posted in: Podcast, Analog to Digital"
