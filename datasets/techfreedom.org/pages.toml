["https://techfreedom.org/fcc-cant-write-its-own-communications-act-techfreedom-tells-eighth-circuit"]
title = "FCC Can’t Write Its Own Communications Act, TechFreedom Tells Eighth Circuit"
full_description = "Today, TechFreedom filed an amicus brief urging the U.S. Court of Appeals for the Eighth Circuit to vacate an FCC rule that attempts, by grasping at a few hundred words buried in the thousand-page Infrastructure Investment and Jobs Act, to impose sweeping new regulations on the Internet. “The FCC took a simple task and made it needlessly complicated,” said Corbin K. Barthold, Director of Appellate Litigation at TechFreedom. “Congress instructed the agency to adopt rules against intentional discrimination that hinders access to broadband. Instead, the FCC wants to impose liability even when a disparity in broadband access between two groups is entirely unintended. What’s more, the FCC wants to impose this hair-trigger liability on a vast array of entities (down to landlords and local governments) and a vast array of activities (down to the quality of entities’ customer service).” “The FCC’s rule flunks the major questions test,” Barthold continued. “As the Supreme Court has made increasingly clear, agencies may not, absent clear permission from Congress, claim the power to resolve major questions of policy. The FCC’s rule obviously tackles a major question: the economically significant and politically fraught topic of whether to regulate the Internet like a utility. Yet the FCC is proceeding without clear statutory authority. Congress did not hide, on pages 816 and 817 of the Infrastructure Act, a few lines quietly permitting the FCC to write what amounts to a whole new Communications Act for broadband.” “This is no way to govern a country,” Barthold concluded. “Agencies—especially unaccountable ‘independent’ ones, such as the FCC—need to stop construing statutes aggressively, disregarding Supreme Court precedent they find inconvenient, and otherwise seeking to expand their power at Congress’s expense.” The lead case is Minnesota Telecom Alliance v. FCC, No. 1179 (8th Cir.). ### Find this brief and release on our website, and share them on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our comments on the FCC’s proposal to stand up an Office of Civil Rights, (Mar. 4, 2024) Zombie FCC vs. Schoolhouse-Rock Supreme Court, Substack (Nov. 8, 2023) A Thankfully Doomed Mistake, City Journal (Nov. 8, 2023) FCC Revives Common Carriage for the Internet, Reason (Sept. 28, 2023) The Elephant in the Ethernet Port, City Journal (June 1, 2023) Our reply comments on the prevention and elimination of digital discrimination (Apr. 20, 2023) Our comments on the prevention and elimination of digital discrimination (Feb. 21, 2023) Our reply comments on the FCC’s NPRM on net neutrality regulation, (Jan. 17, 2024) Our comments on the FCC’s NPRM on net neutrality regulation, (Dec. 14, 2023) Our comments to the FCC on facilitating interagency coordination of broadband deployment funding (Aug. 16, 2022) Our 2022 comments to the FCC on preventing digital discrimination (May 16, 2022) Our comments on NTIA’s funding through the Broadband Equity, Access and Deployment (BEAD) program (Feb. 4, 2022) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
