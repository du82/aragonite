["https://techfreedom.org/category/foundation/page/2"]
title = "Foundation – Page 2"
description = "Hayek put it best: “it is in the technical discussion concerning administrative law that the fate of our liberty is being decided.” Nowhere is that more true than tech policy. Regulators gotta regulate, but how they go about it, and what role the courts play, really matters. Permissionless innovation has made the Internet great but can’t survive if technocrats have free rein to second-guess everything new, untried and unfamiliar. We fight back and push for broader reforms that will allow innovation to flourish."
