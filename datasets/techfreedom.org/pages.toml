["https://techfreedom.org/239-net-neutrality-can-states-regulate-internet"]
title = "#239: Net Neutrality: Can States Regulate the Internet?"
full_description = "California Governor Jerry Brown signed a bill on September 30 that would apply the net neutrality regulations imposed by the 2015 Open Internet Order to Internet service providers in the state of California. Will the law stand up to the legal challenges against it? And what can states do to protect consumers when it comes to Internet service? Ash is joined by TechFreedom President Berin Szóka and former TechFreedom Legal Fellow Graham Owens to discuss. For more, see Graham’s paper on state regulation of broadband, and our other work on net neutrality, including our letter urging the veto of the bill, and our statement in support of the Department of Justice’s lawsuit against it. Posted in: Podcast"
