["https://techfreedom.org/nasa-lacks-authority-to-independently-develop-non-interference-standards-for-lunar-operations"]
title = "NASA Lacks Authority to Independently Develop Non-Interference Standards for Lunar Operations"
full_description = "Today, TechFreedom filed comments in response to NASA’s Office of Technology, Policy, and Strategy (OTPS) request for information (RFI) regarding their Lunar Non-Interference Questionnaire intended to inform the development of a framework for further work on developing standards for operations on the Moon based on the concept of non-interference. Developing a framework to allow multiple entities to conduct lunar operations free from harm and interference from others is vital if we want to explore and develop the vast resources of space. Our comments focus mainly on legal issues related to NASA’s role in developing norms for outer space activities, and how this proceeding fits into the larger story of American leadership in space. “The questionnaire lacks the necessary framing and context to produce useful results,” said James E. Dunstan, TechFreedom’s Senior Counsel. “The questionnaire asks for input on four broad topics but provides virtually no context or other framing to assist those seeking to comment. As a result, responses are sure to vary considerably. Additionally, the RFI’s lack of legal explanation for the sought-after definitions will likely render the results unhelpful for developing a strategy to prevent harmful interference on the Moon. Therefore, as part of this process, NASA should seek out and integrate the input from space law scholars and practitioners, who can provide much-needed context to the issues outlined in the RFI.” “NASA’s authority to develop a framework for future work is highly questionable,” Dunstan continued. “This proceeding will clearly involve complex legal and diplomatic issues. While NASA may have technical expertise in this area, and certainly can tap into the space scientific and commercial community for feedback and support, NASA is neither a regulatory agency nor a formal diplomatic arm of the U.S. government. Before it embarks on serious consideration of these issues, its statutory authority over international space law issues must be examined.” “NASA lacks the necessary legal and foreign policy expertise to act independently in this area,” Dunstan concluded. “Fundamentally, these are legal and diplomatic issues, not technical ones. So, while NASA may seek input from the scientific or technical community, as it is doing with its questionnaire, it is the lawyers and diplomats who must develop the legal and international norms and agreements that will shape lunar development. Ignoring the key legal issues will render the output of this exercise of little use or consequence.” ### Find these comments on our website, and share them on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our comments to the FCC on In-Space Servicing, Assembly, and Manufacturing (ISAM) (Apr. 29, 2024) Our comments to the FCC in support of a call to revisit rules for the 1.6GHz space band (Apr. 25, 2024) Our reply comments on the FCC’s satellite streamlining proceeding (Feb. 6, 2024) Our comments to the FAA and DOT on mitigation methods for the creation of orbital debris (Dec. 22, 2023) Do We Still Have the Right Stuff?, City Journal (Dec. 2023) SpaceX Makes Progress on Second Test of Starship, Reason (Nov. 18, 2023) SpaceX, DOJ, INA and ITAR — Acronyms (and Common Sense) Run Amok, DC Journal (Sep. 25, 2023) Tech Policy Podcast #349: The State of Space Exploration (July 25, 2023) Regulating the Space Economy Is Vital For America’s Continued Global Leadership, Washington Examiner (July 15, 2023) Our written testimony before the House Committee on Science, Space, and Technology on U.S. leadership in commercial space (July 13, 2023) Tech Policy Podcast #348: The State of Space Regulation (July 11, 2023) Regulating Outer Space: Of Gaps, Overlaps, and Stovepipes, Center for Growth and Opportunity (July 10, 2023) Our amicus brief urging the D.C. Circuit not to extend the National Environmental Policy Act (NEPA) into outer space (June 20, 2023) Our comments to the FCC on supplemental coverage from space (May 12, 2023) Our comments to the FCC on expediting initial processing of satellite and earth station applications (Mar. 3, 2023) Our comments to NASA on the “Moon to Mars Objectives” (June 3, 2022) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release Tagged in: space, Space Property Rights, NASA"
