["https://techfreedom.org/242-hybrid-networks-future-wireless"]
title = "#242: Hybrid Networks and the Future of Wireless"
full_description = "The proposed merger of Sprint and T-Mobile raised a plethora of concerns from both regulators and the general public. In response, the Federal Communications Commission (FCC) welcomed comments on the proposed merger to evaluate the benefits and potential harms of the proposed New T-Mobile. Although the anti-competitive analysis was quite extensive, it was incomplete as the FCC declined to include the role of Hybrid Mobile Network Operators (HMNOs) on the market for mobile wireless services. Today, Michelle P. Connolly, Professor of the Practice in the Economics Department at Duke University, is here to discuss her recent report on the role of HMNOs and why the FCC should have broadened its definition of the mobile telephony and broadband market to account for HMNOs, as this narrow scope accurately reflects how the market is satisfying consumer demand for mobile broadband services. Posted in: Podcast"
