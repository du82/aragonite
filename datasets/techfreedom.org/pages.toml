["https://techfreedom.org/fcc-continues-to-ignore-warnings-of-overreach-on-orbital-debris-regulation"]
title = "FCC Continues to Ignore Warnings of Overreach on Orbital Debris Regulation"
full_description = "Yesterday, TechFreedom filed comments in response to the FCC’s request to refresh the record on rule changes pertaining to orbital debris mitigation. The most important change since the record closed in late 2020 is in the question of agency authority. Courts today seem much less likely to defer to agency decisions when the agency strays from its statutory mandate. “The FCC’s statutory authority over orbital debris is shakier than ever,” said James E. Dunstan, TechFreedom’s Senior Counsel. “The FCC has embarked on an unprecedented quest to regulate outer space, despite persistent concerns it may be overstepping its authority. These warnings have come from other executive agencies as well as the congressional committee with direct oversight over space activities. Given recent court decisions constraining any agency’s ability to read in new or expanded authority under its enabling statute, it’s doubtful that a court today would conclude the FCC can merely recite the ‘public interest’ standard to justify this reach into outer space on issues unrelated to spectrum and interference.” “The Commission should regulate by rules, not ad hoc conditions on licenses,” Dunstan continued. “The Commission has reacted to the development of the space economy not by promulgating new rules to recognize these changes, but rather by imposing more and more conditions on licenses. While conditions on licenses are a common practice in FCC licensing, in most services those conditions are limited, applied consistently across licensees, and are generally tied to clear, specific rules that everyone can understand. However, each new space license appears to come with increasingly numerous conditions, often citing vague rules or policies, or involving negotiated agreements between applicants and FCC staff to address gaps in Commission rules.” “The Commission should use this opportunity to establish that NEPA doesn’t apply to outer space,” Dunstan concluded. “If the goals of this proceeding are to provide clarity and certainty for licensees, as well as speed the licensing process, the FCC should take this opportunity to once and for all make clear that the National Environmental Policy Act (NEPA) does not apply to outer space. They should also emphasize that opponents of specific systems, and commercial space activities in general, cannot weaponize NEPA to stop or slow down innovative uses of outer space.” ### Find these comments on our website, and share them on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our comments to NASA on their Lunar Non-Interference Questionnaire, (Jun. 7, 2024) Our comments to the FCC on In-Space Servicing, Assembly, and Manufacturing (ISAM) (Apr. 29, 2024) Our comments to the FCC in support of a call to revisit rules for the 1.6GHz space band (Apr. 25, 2024) Our reply comments on the FCC’s satellite streamlining proceeding (Feb. 6, 2024) Our comments to the FAA and DOT on mitigation methods for the creation of orbital debris (Dec. 22, 2023) Do We Still Have the Right Stuff?, City Journal (Dec. 2023) SpaceX Makes Progress on Second Test of Starship, Reason (Nov. 18, 2023) SpaceX, DOJ, INA and ITAR — Acronyms (and Common Sense) Run Amok, DC Journal (Sep. 25, 2023) Tech Policy Podcast #349: The State of Space Exploration (July 25, 2023) Regulating the Space Economy Is Vital For America’s Continued Global Leadership, Washington Examiner (July 15, 2023) Our written testimony before the House Committee on Science, Space, and Technology on U.S. leadership in commercial space (July 13, 2023) Tech Policy Podcast #348: The State of Space Regulation (July 11, 2023) Regulating Outer Space: Of Gaps, Overlaps, and Stovepipes, Center for Growth and Opportunity (July 10, 2023) Our comments to NASA on the “Moon to Mars Objectives” (June 3, 2022) Our comments to the OSTP on their orbital debris strategic plan (Dec. 31, 2021) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
