["https://techfreedom.org/dear-fcc-title-ii-reclassification-is-undoubtedly-a-major-question"]
title = "Dear FCC: Title II Reclassification Is Undoubtedly a Major Question"
full_description = "Today, the Federal Communications Commission (FCC) voted to approve a rule to reinstate net neutrality regulations and to claim broad powers over broadband Internet access service (BIAS) by re-re-re-classifying it as a Title II common carrier service. TechFreedom filed both comments and reply comments explaining why the courts are likely to find Title II reclassification a “major question” that must be decided by Congress—and why only legislation can resolve the net neutrality debate. “The courts won’t allow the FCC to regulate broadband services like railroads without clear authorization from Congress,” said Berin Szóka, President of TechFreedom. “The Supreme Court has been increasingly consistent in recent years: Congress can delegate power to agencies to decide major questions only by saying so clearly and specifically. When Congress wanted railroads to be regulated as common carriers in 1887, it said so clearly, as it did with telegraph and telephone networks in 1910. But the Court has already decided that the 1996 Telecommunications Act’s definition of ‘telecommunications service’ is ambiguous. The Court has also decided nine major questions cases since 2000; in eight, the government lost. The question involved here is no less major. It’s not net neutrality, where there is broad agreement. It’s whether the FCC may micromanage every aspect of broadband service. That’s what common carriage status means: despite ‘broad forbearance,’ the core provisions of Title II would give the FCC vast discretion to decide whether broadband practices, prices, and deployment are ‘just and reasonable.’” “It’s been seven years since the FCC repealed the 2015 net neutrality rules, yet the Internet is no less open, innovative, or free than ever,” continued Szóka. “Net neutrality has survived without FCC rules because consumers demand unrestricted access to the Internet, ISPs promise to meet that demand, and the Federal Trade Commission already ensures that consumers get what they’re promised. There’s no need for the FCC to do more than what it does now: require disclosure of any non-neutral practices. Reclassifying means stripping the FTC of its general jurisdiction to enforce consumer protection laws—yet another sign that this is a matter for Congress to decide.” “Many insist net neutrality regulations are essential; they should be leading the charge for legislation,” concluded Szóka. “Even if the FCC somehow prevails in court, the agency will simply flip-flop on Title II whenever Republicans retake the White House. The regulatory ping-pong will go on forever. And if the Court blocks reclassification, they’ll need legislation anyway. If the FCC really wanted to lead on this issue, it would focus on negotiating bipartisan consensus on what legislation might look like, just as the Internet Society attempted in 2019. Even in this broken Congress, a unanimous recommendation from the FCC could jumpstart legislation.” ### Find this release on our website, and share it on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our ex parte notice in the proceeding (Apr. 15, 2024) Our reply comments to the FCC on this proceeding (Jan. 17, 2024) Our comments to the FCC on this proceeding (Dec. 14, 2023) Our comments to the FCC on Section 706 of the Telecommunications Act (Dec. 1, 2023) A Thankfully Doomed Mistake, City Journal (Sep. 8, 2023) Zombie FCC vs. Schoolhouse-Rock Supreme Court, Substack (Nov. 8, 2023) FCC Revives Common Carriage for the Internet, Reason (Sep. 28, 2023) In Net Neutrality Debate, “Free Speech” Has Always Been a Red Herring, Substack (Sep. 28, 2023) What Happens Next on Net Neutrality, Broadband Breakfast Webinar (Sep. 26, 2023) Our comments on NTIA’s funding through the Broadband Equity, Access, and Deployment (BEAD) program (Aug. 4, 2022) Our reply comments to the FCC on the prevention and elimination of digital discrimination (Apr. 20, 2023) Our comments to the FCC on the prevention and elimination of digital discrimination (Feb. 21, 2023) West Virginia v. EPA: Sound and Fury, Signifying What?, WLF Legal Pulse (Jul. 5, 2022) Our comments to the FCC on the future of the Universal Service Fund (USF) (Jan. 18, 2022) The Arrival of the Federal Computer Commission?, Regulatory Transparency Project (Aug. 27, 2021) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
