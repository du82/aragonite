["https://techfreedom.org/net-neutrality-congress-cra-substantive-legislation"]
title = "Net Neutrality in Congress: the CRA or Substantive Legislation?"
full_description = "WASHINGTON D.C. —­­ After over a decade of debate, Congress is finally taking action on net neutrality — or is it? Senate Democrats, with the support of three Republicans, recently passed a Congressional Review Act resolution intended to roll back the FCC’s Restoring Internet Freedom Order. In theory, this would reinstate the FCC’s 2015 net neutrality rules and the associated classification of broadband services as common carriers subject to Title II of the 1934 Communications Act (the regulatory system designed for Ma Bell based on 1880s railroad regulation). But is that even true, as a legal matter? And if true, would it be a good idea? If, instead of using the CRA, Congress actually wanted to legislate net neutrality rules, how should it do so? Join TechFreedom at 9:30 AM on June 5 for a panel discussion of these critical questions. Refreshments will be served. When: 9:30 AM, June 5th Where: 2322 Rayburn House Office Building RSVP Panelists will include: Jim Dunstan (moderator), General Counsel at TechFreedom Grace Koh, Partner at DLA Piper, former Special Assistant to the President for Technology, Telecom, and Cyber-Security Policy at the National Economic Council, and Deputy Chief Counsel to the House Subcommittee on Communications and Technology of the Energy and Commerce Committee Larry Downes, Project Director, Georgetown Center for Business and Public Policy Bennett Ross, Partner at Wiley Rein LLP Berin Szóka, President at TechFreedom ### We can be reached for comment at media@techfreedom.org. See more of our work on Net Neutrality, including: Tech Policy Podcast #215: The Net Neutrality CRA: Yay or Nay? Our letter explaining the CRA’s inability to reinstate Title II regulation Our blog post responding to Public Knowledge’s critique of our letter Our statement on the need for net neutrality legislation Our statement on the impact of a recent 9th Circuit decision on the FTC’s ability to enforce net neutrality rules Posted in: Event, Foundation Tagged in: Title II, net neutrality, CRA"
year_published = 2025
clearnet = "https://techfreedom.org/net-neutrality-congress-cra-substantive-legislation"
