["https://techfreedom.org/fcc-lacks-authority-for-utility-style-regulations-on-bias-data-plans"]
title = "FCC Lacks Authority For Utility-Style Regulations on BIAS Data Plans"
full_description = "Yesterday, TechFreedom filed comments in response to the Federal Communications Commission’s (FCC) Notice of Inquiry (NOI) considering vast new regulations on data usage for broadband Internet access service (BIAS). This marks yet another proceeding that would negatively impact deployment, adoption, and prices, showing how far the Commission has strayed from its statutory authority. The Commission should not move forward with this proceeding. “The Commission can’t possibly expect to finish this proceeding by January,” said James Dunstan, TechFreedom Senior Counsel. “Proposing vast new regulations on BIAS data usage just a few weeks before control of the Commission changes is the height of bad governance. Similar to the proposed rules for AI political advertising, the FCC appears to be rushing into yet another proceeding at the tail end of an administration, spooling up the communications bar to comment on whether the Commission should step in and either prohibit outright, or otherwise regulate, data limits and charges for BIAS service.” “The FCCʼs claims of statutory authority are weak and unconvincing,” Dunstan continued. “Section 257 is primarily a reporting statute aimed at identifying market barriers, not granting new regulatory powers. Prior Commissions have recognized this, and more importantly, have concluded that Congress never intended that the Commission could invoke it to micromanage Internet access. This NOI spends a scant four paragraphs and 432 words on the legal authority of the Commission to regulate data caps. This was no doubt intentional, given how tenuous the Commission’s Title II common carrier utility-like classification authority appears to be.” “Prohibiting or highly regulating data caps would severely harm the Internet ecosystem,” Dunstan concluded. “Can we ever imagine any other utility where the government would require the utility provider to allow infinite consumption of the regulated service for a single price? The Commission ignores basic economics, believing the cost of providing BIAS service is zero. While the marginal costs of providing an additional GB of data per subscriber might be low, that figure fails to account for the overall network investment that must be recouped via charges to subscribers. By banning customers from choosing data-cap plans, which are typically more affordable than unlimited options, the FCC would effectively mandate that the poor and the old subsidize the young and rich, whose main use of the Internet is for entertainment.” ### Find these comments and release on our website, and share them on Twitter, Bluesky, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Comments in the FCC’s proceeding regarding the use of AI-generated content in political advertising (Sep 19, 2024) Reply comments on the FCC’s NPRM on net neutrality regulation, (Jan. 17, 2024) Comments on the FCC’s NPRM on net neutrality regulation, (Dec. 14, 2023) Comments on why Section 706 is not an independent authority to regulate broadband, (Dec. 1, 2023) Comments on the assessment and collection of regulatory fees for 2023, (June 14, 2023) 2023 reply comments on the prevention and elimination of digital discrimination (Apr. 20, 2023) 2023 comments on the prevention and elimination of digital discrimination (Feb. 21, 2023) Comments to the FCC on facilitating interagency coordination of broadband deployment funding (Aug. 16, 2022) Comments to the FCC regarding a Content Vendor Diversity Report (CVDR) (July 22, 2022) The Arrival of the Federal Computer Commission?, Regulatory Transparency Project (Aug. 27, 2021) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
