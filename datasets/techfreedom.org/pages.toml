["https://techfreedom.org/187-engaging-cuba"]
title = "#187: Engaging Cuba"
full_description = "Like most things in Cuba, the Internet is complicated. While only a tiny percentage of homes have WiFi, nearly a third of Cubans went online in 2016, and the growing private sector is increasingly digital. While the previous administration opened up relations with Cuba in 2014, President Trump announced a rollback of some of those reforms in a speech in Miami last month. How will the potential changes affect Cuba’s digital future? Evan is joined by Celia Mendoza, founder of Concierge Havana, a travel agency geared toward American visitors to Cuba; Robin Pedraja, founder of Vistar, a magazine focused on culture and entertainment and the first independent media outlet in Cuba; and Michael Maisel, Director of External Affairs at Engage Cuba. Posted in: Podcast, Foundation Tagged in: Cuba"
