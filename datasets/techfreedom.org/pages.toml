["https://techfreedom.org/fcc-lacks-statutory-authority-and-expertise-for-outer-space-activities"]
title = "FCC Lacks Statutory Authority and Expertise for Outer Space Activities"
full_description = "Yesterday, TechFreedom filed comments in response to the Federal Communications Commission’s (FCC) Notice of Proposed Rulemaking (NPRM) seeking comment related to the Commission’s role in regulating the developing in-space servicing, assembly, and manufacturing (ISAM) industry. While no one questions the FCC’s authority over spectrum licensing, it lacks a mandate to regulate general, non-communication activities in space. Previous efforts by the Commission to bootstrap a general authority over non-communications activities have failed, suggesting this one will as well. “The FCC’s regulatory powers over space operations are limited,” said James E. Dunstan, TechFreedom’s Senior Counsel. “No one would contest the FCC’s primary jurisdiction over frequency allocations and licensing for U.S. entities providing communications services via space. Nevertheless, the ISAM NPRM contemplates that the FCC will take the regulatory lead on ISAM activities, which look very different from traditional communications satellites. The ISAM NPRM merely points to the general ‘public interest’ provisions of the Communications Act, even though this is only applicable to the FCC’s role in regulating communications facilities, whether on Earth or in space. The bulk of the ISAM NPRM, however, focuses on regulating ISAM activities, not communication services, thus misreading the public interest standard as a further grant of substantive regulatory authority.” “The NPRM fails to establish the FCC’s expertise over ISAM activities,” Dunstan continued. “No reference is made to FCC experience in actually conducting rendezvous and proximity operations (RPO), in-space servicing, assembly, or manufacturing, because it doesn’t exist. This is in sharp contrast to other agencies, which have shown experience and expertise in this area. In short, the FCC is proposing to regulate things that none of its staff has ever done and is asking for paid on-the-job training.” “Get the regulatory approach wrong, and the ISAM industry will simply move offshore,” Dunstan concluded. “Space is inherently international, and if we do not provide a practical regulatory system that can efficiently authorize and supervise the activities of U.S. nationals in space, two things will happen. First, domestic companies will simply move offshore and find a country that will quickly and cheaply grant them authorization for their outer space activities. Second, regulatory schemes that are characterized by high degrees of friction will hamper the U.S. space economy, and thus advance the interests of our adversaries.” ### Find these comments on our website, and share them on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our comments to the FCC in support of a call to revisit rules for the 1.6GHz space band (Apr. 25, 2024) Our reply comments on the FCC’s satellite streamlining proceeding (Feb. 6, 2024) Our comments to the FAA and DOT on mitigation methods for the creation of orbital debris (Dec. 22, 2023) Do We Still Have the Right Stuff?, City Journal (Dec. 2023) SpaceX Makes Progress on Second Test of Starship, Reason (Nov. 18, 2023) SpaceX, DOJ, INA and ITAR — Acronyms (and Common Sense) Run Amok, DC Journal (Sep. 25, 2023) Tech Policy Podcast #349: The State of Space Exploration (July 25, 2023) Regulating the Space Economy Is Vital For America’s Continued Global Leadership, Washington Examiner (July 15, 2023) Our written testimony before the House Committee on Science, Space, and Technology on U.S. leadership in commercial space (July 13, 2023) Tech Policy Podcast #348: The State of Space Regulation (July 11, 2023) Regulating Outer Space: Of Gaps, Overlaps, and Stovepipes, Center for Growth and Opportunity (July 10, 2023) Our amicus brief urging the D.C. Circuit not to extend the National Environmental Policy Act (NEPA) into outer space (June 20, 2023) Our comments to the FCC on supplemental coverage from space (May 12, 2023) Our comments to the FCC on expediting initial processing of satellite and earth station applications (Mar. 3, 2023) Our comments to the FCC on In-Space Servicing, Assembly, and Manufacturing (Oct. 31, 2022) Our comments to NASA on the “Moon to Mars Objectives” (June 3, 2022) Our comments to the FCC on revising spectrum sharing rules (Apr. 25, 2022) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
