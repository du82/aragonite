["https://techfreedom.org/ftc-cant-make-competition-rules-techfreedom-tells-eleventh-circuit"]
title = "FTC Can’t Make Competition Rules, TechFreedom Tells Eleventh Circuit"
full_description = "Today, TechFreedom filed an amicus brief urging the Eleventh Circuit to uphold an order blocking the Federal Trade Commission from enforcing its rule against employee noncompete agreements. The FTC declared such agreements an “unfair method of competition” under Section 5 of the FTC Act of 1914. But to justify its blanket rule, the FTC had to invoke Section 6 of the Act, which empowers the agency merely to conduct investigations and compile reports. “The FTC lacks the authority to issue competition rules,” said Corbin K. Barthold, Director of Appellate Litigation at TechFreedom. “Section 6 creates no rulemaking authority under Section 5. In fact, the two sections started out in Congress as two distinct bills. Although they were eventually stitched together, the FTC’s reading of the statute remains implausible. The FTC assumes that an isolated line related to housekeeping rules for Section 6 investigations drastically expands the agency’s Section 5 enforcement authority. That makes no sense.” “The FTC is ‘discovering’ authority through a cynical and ahistorical reading of the FTC Act,” Barthold continued. “Statutes are read to mean what they meant at the time of adoption. To get its way now, the FTC must claim that, in 1914, Congress waged a simultaneous assault on the Constitution’s Article I nondelegation rule; on the Constitution’s Article II removal power; and on a longstanding convention of statutory drafting, under which Congress always tied substantive rulemaking authority to explicit penalty provisions. There is no evidence that Congress sought this triple revolution.” The case is Properties of the Villages, Inc. v. Federal Trade Commission, No. 24-13102 (11th Cir.). ### Find this release on our website, and share it on Twitter and Bluesky. We can be reached for comment at media@techfreedom.org. Read our related work, including: Lina Khan’s New Club, City Journal (May 16, 2024) Press release when the FTC approved the rule (Apr. 24, 2024) Comments explaining why the FTC doesn’t have the authority to issue substantive rules governing UMC (Apr. 19, 2023) Comments describing the effects of the proposed ban on intellectual property (Apr. 19, 2023) Comments recommending a more limited rulemaking for the proposed ban on non-compete clauses (Apr. 19, 2023) The Constitutional Revolution That Wasn’t: Why the FTC Isn’t a Second National Legislature, Concurrences (June 27, 2022) Letter to the FTC requesting a reply comment period for the noncompete agreements NPRM (Mar 23, 2023) Written remarks at the FTC’s public forum on the proposed ban on noncompete agreements (Feb. 16, 2023) National Petroleum Refiners v FTC: A Tale of Two Opinions, Truth on the Market (Apr. 27, 2022) Overextending the FTC National Review (Feb. 23, 2022) Regulator Beware City Journal (Dec. 2, 2021) Pride Before the Fall at the FTC? Law & Liberty (Nov. 2, 2021) 2021 comments to the FTC on the proposed ban of noncompete clauses (Sep. 30, 2021) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
