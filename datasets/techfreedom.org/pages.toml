title = "#191: The Future of Online Music"
full_description = "The Internet has changed a lot over the past 20 years, and so has the music industry. CDs and record stores have been replaced by streaming and the iTunes store. While consumers are benefitting from more content and ways to listen to music than ever before, prominent artists like Taylor Swift have lamented declining revenues for artists in the digital age, even taking their gripes to the halls of Congress. Is streaming a viable future for online music, or will online piracy and low royalties spoil the party? Are websites like YouTube doing enough to combat copyright infringement? Evan is joined by Steven Marks, Chief of Digital Business & General Counsel for the Recording Industry Association of America (RIAA). For a different perspective on copyright, listen to episode #176. Posted in: Podcast, Analog to Digital Tagged in: copyright"
