title = "What is Cybersecurity, and How Can it Affect the Winter Olympics?"
full_description = "The world in 2018 is interconnected. Cybersecurity threats are widespread — even at the 2018 Winter Olympics. As we recorded this episode in January, our guest warned us of potential cybersecurity attacks. And just last week organizers in Pyeongchang confirmed that a cyberattack crippled important IT systems, bringing down display monitors, Wi-Fi and the Olympics website just ahead of the opening ceremony. Government, private and corporate data is constantly under attack from bad actors like this. That’s where cybersecurity comes in. In this episode we are joined by Dr. Betsy Cooper, the Executive Director of the Berkeley Center for Long-Term Cybersecurity. Dr. Cooper breaks down “cybersecurity”: defining and assessing it, the risks it carries, and the future of cybersecurity. Posted in: Podcast, Digital Security Tagged in: cybersecurity"
