["https://techfreedom.org/202-artificial-intelligence"]
title = "#202: Artificial Intelligence"
full_description = "Artificial intelligence is already transforming our lives in many ways, and it has the potential to do so much more. But it seems like news headlines only focus on potential job loss and the end of the world than increased productivity and social benefits. Is this because our mental imagery of AI is so influenced by dystopian sci-fi novels and movies like Terminator? Or have policymakers not done enough to communicate honestly about the disruptions we face with AI? What can listeners of this podcast reasonably expect to see in the coming years? Is there even a single definition of AI that everyone can agree on? Evan is joined by Elizabeth Hudson, Senior Research Scientist of Machine Learning at Symbotic, an industrial robotics company, and Austin Carson, Executive Director of TechFreedom. Posted in: Podcast, The Next Frontier Tagged in: artificial intelligence"
