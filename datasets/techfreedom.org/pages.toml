title = "Announcing the Tech Policy Podcast: AI and Everything"
full_description = "Is AI a miracle? A threat? Will it free us? Enslave us? Both? Neither? What’s the future of AI and governance? AI and art? AI and elections? AI and social media? AI and the economy? AI and the world? Welcome to the Tech Policy Podcast: AI and Everything. Our host, Corbin Barthold, has been having a lot of conversations, with a range of experts, about what to make of the AI revolution. In this special edition of the show, Corbin presents the most compelling insights he’s heard about where we’re headed. Featuring Adam Thierer, Samuel Hammond, Liza Lin, Arnold Kling, Brian Frye, Joseph Tainter, James Pethokoukis, Robert Atkinson, Alice Marwick, and Ari Cohn. If you enjoy this Tech Policy Podcast special, be sure to check out the episodes that went into it: Tech Policy Podcast 377: AI and Wicked Problems Tech Policy Podcast 375: Tech Facts and Fallacies Tech Policy Podcast 369: AI and State Capacity Tech Policy Podcast 363: AI and Elections Tech Policy Podcast 361: AI, Art, Copyright, and the Life of Brian Tech Policy Podcast 355: Conservative Futurism Tech Policy Podcast 346: Who’s Afraid of Artificial Intelligence? Tech Policy Podcast 337: China and Domestic Surveillance Tech Policy Podcast 327: The Collapse of Complex Societies There will be many more AI episodes to come. Keep listening! Subscribe, give a five-star rating, write a review, and tell your friends about the show. ### Find this podcast on our website, and share it on Twitter and Bluesky. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our letter on the “Protect Elections from Deceptive AI Act” (May 14, 2024) ‘Unregulated AI’ is a myth, Orange County Register (Apr. 1, 2024) Startlingly New, City Journal (Mar. 7, 2024) How should we regulate generative AI in political ads?, UNC Center on Technology Policy (Feb. 5, 2024) A.I. Panic is Causing First Amendment Hallucinations … in Humans, Substack (Jan. 29, 2024) Our letter on the “No Section 230 Imm