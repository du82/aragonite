["https://techfreedom.org/supreme-court-wisely-declines-to-rewrite-section-230"]
title = "Supreme Court Wisely Declines to Rewrite Section 230"
full_description = "Today, the U.S. Supreme Court issued a pair of unanimous rulings in Twitter v. Taamneh and Gonzalez v. Google, related cases that had the potential to upend the Internet and weaken Section 230 protections. Brought under anti-terrorism statutes, the cases sought to hold social media platforms liable for international terrorist attacks because terrorists used their platforms generally and in some cases their content was algorithmically recommended to other users. The Supreme Court rejected invitations to rewrite Section 230, instead holding that such generalized allegations are insufficient to state a claim, rendering arguments about 230 moot. “The Supreme Court did what the Ninth Circuit should have done in the first place,” said Ari Cohn, Free Speech Counsel at TechFreedom. “These claims were never viable, and turning them into a battle over Section 230 was never necessary.” Ruling that the platforms did not intentionally aid specific acts of terrorism, the unanimous Taamneh Court noted that all content is sorted by algorithms, and that using content-agnostic recommendation algorithms is insufficient to create liability. “Notably, the two justices who have been most critical of Section 230 and Internet platforms said nothing of the sort here,” concluded Cohn. “Justice Thomas has repeatedly criticized Section 230 in past opinions arguing that the Court should have granted review of cases involving 230’s interpretation. Not only did he not do that here, he actually wrote the Court’s unanimous opinion in Taamneh. His questions at oral argument in Gonzalez made clear just how differently he thought about the law once he’d the benefit of seeing both sides fully brief their positions.” ### Find this release on our website, and share it on Twitter, Bluesky, and Mastodon. We can be reached for comment at media@techfreedom.org. Read our related work, including: Section 230 Spring Summit, American Enterprise Institute (Apr. 19, 2023) Four Things to Watch in Gonzalez v. Google, Federalist Society (Mar. 17, 2023) Our podcast #340: Making Sense of the SCOTUS Internet Speech Cases (Mar. 17, 2023) Don’t Repeal the Law That Created the Internet, Ripon Society (Feb. 23, 2023) Our podcast #338: Gonzalez v. Google (Feb. 14, 2023) Our amicus brief in this case, U.S. Supreme Court (Jan. 18, 2023) Section 230 Heads to the Supreme Court, Reason (Nov. 4, 2022) Our podcast #331: Section 230’s Long Path to SCOTUS (Oct. 31, 2022) Our letter on Section 230 and the American Innovation and Choice Online Act (June 27, 2022) What Is Section 230 and How Is It Different Than the First Amendment?, Foundation for Economic Education (May 27, 2022) Section 230 Continues To Not Mean Whatever You Want It To, Techdirt (July 9, 2021) The Wall Street Journal Misreads Section 230 and the First Amendment, Lawfare (Feb. 3, 2021) We Need Section 230 Now More Than Ever, Protocol (Jan. 11, 2021) Section 230: An Introduction for Antitrust & Consumer Protection Practitioners, Global Antitrust Institute, (Nov. 11, 2020). Our comments to the FCC on rulemaking to clarify provisions of Section 230 (Sep. 2, 2020) Our Supreme Court amicus brief in Malwarebytes Inc. v. Enigma Software Group USA, LLC (June 12, 2020) Our written testimony on platform responsibility & Section 230 to the U.S. House Judiciary Committee (Apr. 26, 2018) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
