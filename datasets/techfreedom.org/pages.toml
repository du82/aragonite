["https://techfreedom.org/223-law-enforcement-political-weapon"]
title = "#223: Law Enforcement as a Political Weapon"
full_description = "President Donald Trump has been vocal to criticize those he deems political opponents. However, these criticisms often extend to threats of legal action, particularly against the Jeff Bezos-owned Washington Post and Amazon. Trump has set aside decades of precedent and involved himself directly in a number of enforcement actions, often in ways that would benefit him or his political allies. How lawful is this kind of intervention? And how can the rest of the government resist inappropriate political meddling? Justin Florence, Legal Director for Protect Democracy, and TechFreedom President Berin Szóka join the show to discuss. For more, see their joint op-ed in the Seattle Times, and Protect Democracy’s filing in the antitrust case against the AT&T/Time Warner merger. Posted in: Podcast"
