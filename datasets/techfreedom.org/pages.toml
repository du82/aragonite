["https://techfreedom.org/fccs-transfer-of-power-to-private-org-violates-constitution-techfreedom-tells-supreme-court"]
title = "FCC’s Transfer of Power to Private Org Violates Constitution, TechFreedom Tells Supreme Court"
full_description = "Today, TechFreedom filed an amicus brief urging the U.S. Supreme Court to declare that the Federal Communications Commission’s hands-off method of running the $9 billion Universal Service Fund violates the Constitution. The USF promotes advanced telecommunications and broadband services for underserved institutions, remote areas, and the poor. Congress tasked the FCC with running the USF, but the FCC subdelegated that task to a private entity, the Universal Service Administrative Company. “USAC is the Founders’ fear of unaccountable government come to life,” said Corbin K. Barthold, Director of Appellate Litigation at TechFreedom. “Congress may not hand its legislative power to others. When it handed the FCC open-ended power to set the size and scope of the USF, therefore, Congress was already at risk of creating a delegation problem. But the FCC then handed expansive power to a private entity—a further delegation that was clearly unconstitutional.” “The FCC’s ‘private delegation’ of authority to USAC amounts to legislation without representation,” Barthold continued. “Lincoln did not extol government of all of the people, by a few of the people, for the rest of the people. USAC wastes money, lacks transparency, denies beneficiaries due process, and resists reform. These problems flow from a lack of legal guardrails or proper supervision. The FCC subdelegated power to USAC without Congress’s permission, and the FCC appears to engage in hardly any oversight of USAC’s activities.” “Widespread access to broadband is a worthy goal, but this is not the way to pursue it,” Barthold concluded. “The Supreme Court should send Congress and the FCC back to the drawing board.” The cases are FCC v. Consumers’ Research, No. 24-354 (U.S.), and Schools, Health & Libraries Broadband Coalition v. Consumers’ Research, No. 24-422 (U.S.). ### Find this brief on our website and share it on X (formerly Twitter) and Bluesky. We can be reached for comment at media@techfreedom.org. See our related work: The FCC’s $200 Billion Disaster, Pirate Wires (Dec. 20, 2024) Nondelegation Is Back. Cue Meltdown., Substack (Oct. 3, 2024) The FCC, USF, and USAC: An Alphabet Soup of Due Process Violations, The CGO (Apr. 18, 2023) Tech Policy Podcast #318: The Universal Service Fund (Apr. 27, 2022) Our comments to the FCC on the future of the USF (Jan. 18, 2022) Our Eleventh Circuit amicus brief in a similar challenge to USAC (Nov. 29, 2022) Our Sixth Circuit amicus brief in a similar challenge to USAC (Sep. 29, 2022) No Legislation Without Representation, Law & Liberty (Apr. 18, 2022) A Path Forward on Nondelegation, WLF Legal Pulse (Jan. 31, 2022) The Arrival of the Federal Computer Commission?, Regulatory Transparency Project (Aug. 27, 2021) About TechFreedom: TechFreedom is a nonprofit, non-partisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology.s towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
