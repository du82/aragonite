["https://techfreedom.org/age-verification-violates-first-amendment-law-amicus-brief-tells-supreme-court"]
title = "Age Verification Violates First Amendment Law, Amicus Brief Tells Supreme Court"
full_description = "Today, TechFreedom joined an amicus brief urging the U.S. Supreme Court to overturn the Fifth Circuit’s misapplication of First Amendment law to online adult speech. HB 1181 requires any website with more than one-third adult content to verify its visitors’ ages. HB 1181 thus forces users to submit government-issued ID or other proof-of-age, threatening online anonymity. “The district court rightly found that HB 1181 unconstitutionally restricts adult access to protected speech,” said Santana Boulton, Legal Fellow at TechFreedom. “Adult speech is generally protected by the First Amendment. Yet age-verification technology deters users from visiting adult sites because those users are worried about their privacy. One site says only 3% of visitors complete age-verification successfully.” “ID verification and facial scanning technology aren’t foolproof, nor are they perfectly secure,” Boulton continued. “Some adults don’t have the required government ID or data trail, and others don’t want to hand over these sensitive documents to age-verification providers. People take their online anonymity very seriously, especially when it comes to adult content. Despite improvements in securing the data used to verify age, requiring users to age-verify themselves chills protected speech because users continue to fear a loss of anonymity of pseudonymity.” “Content-based regulations of speech are presumptively invalid under strict scrutiny,” Boulton concluded. “The Fifth Circuit broke with precedent and applied a lower form of scrutiny to uphold the law. We urge the Supreme Court to apply long-standing First Amendment law and protect Americans’ freedom of speech, including their freedom to access adult content.” The case is Free Speech Coalition, Inc. v. Paxton, No. 23-122 (U.S.) and the brief was led by the Electronic Frontier Foundation ### Find this brief and release on our website, and share it on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: J.D. Vance is Part of Unconstitutional Porn Ban Push, Free the People (Aug. 14, 2024) Age-Gating Access To Online Porn Is Unconstitutional, Techdirt (Aug. 8, 2024) Amicus brief urging the Ninth Circuit to affirm a decision blocking enforcement of California’s Age-Appropriate Design Code (Feb 14, 2024) Closing the Digital Frontier, City Journal (Mar. 7, 2023) Red States vs. Every SCOTUS Internet Precedent, Tech Policy Podcast #360 (Nov. 17, 2023) The Moral Panic Over Internet Porn Can’t Overrule the First Amendment, The Daily Beast (Sep. 7, 2023) Republicans Can’t Decide If They Want Online Privacy or Not, The Daily Beast (Sep. 5, 2023) Letter explaining why the Kids Online Safety Act (KOSA) threatens First Amendment rights (July 26, 2023) When Schools Scapegoat Social Media, Tech Policy Podcast #347 (June 26, 2023) Desperate to Justify Unconstitutional Social Media Law, Utah Officials Blunder Through False Equivalencies, Substack (May 11, 2023) Save the Children (From State Social Media Laws), Tech Policy Podcast #342 (Apr. 11, 2023) Our letter expressing First Amendment concerns over two Utah social media bills (Feb. 16, 2023) Is Screen Time Bad for Kids?, Tech Policy Podcast #335 (Jan. 11, 2023) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
