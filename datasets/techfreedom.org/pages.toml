title = "FBI Lost Count… Of Locked Phones"
full_description = "The FBI has been a vocal critic of the spread of encryption, often citing the nearly 8,000 devices connected to crimes that were inaccessible to law enforcement last year as evidence that increased device security represents a major threat to law enforcement. But a recent Washington Post article revealed that this number was seriously inflated due to “programming error,” with the real value estimated at around 1,200. Robyn Greene, the policy counsel and government affairs lead for the Open Technology Institute joins the show to discuss what this mistake means for the future of encryption policy. For more, see this letter led by OTI and signed by TechFreedom calling on the Inspector General to investigate the FBI and DOJ’s handling of the error, as well as Greene’s other work. Posted in: Podcast, Digital Security"
