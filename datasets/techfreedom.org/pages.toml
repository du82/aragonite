["https://techfreedom.org/fccs-ai-regulations-raise-serious-legal-concerns"]
title = "FCC’s AI Regulations Raise Serious Legal Concerns"
full_description = "Yesterday, TechFreedom filed comments in the Federal Communication Commission’s (FCC) proceeding regarding the use of artificial intelligence-generated content in political advertising. The Commission aims to require disclosure of the use of AI tools in political ads, apparently intending to put such rules into effect in the final weeks or days of the 2024 presidential election. Rushing a proceeding of this magnitude increases the risk that the final rules will be rejected by the courts, especially because the FCC aims to regulate constitutionally protected political speech. “The FCC’s statutory authority doesn’t extend to regulating AI,” said James E. Dunstan, TechFreedom’s Senior Counsel. “The AI NPRM makes much of the FCC’s history in regulating access to the airwaves for political advertising. Of course the Communications Act of 1934 authorized such regulation. Where the FCC has gone off the rail is in reading things into the Communications Act that simply aren’t there. Moreover, the Communications Act prohibits licensee censorship of political ads. The Commission also fails to recognize that it is the Federal Elections Commission which has primary jurisdiction over the content of political advertising.” “The NPRM’s definition of AI is overly broad,” said Andy Jung, TechFreedom’s Associate Counsel. “The NPRM conflates AI with a ‘computational technology or other machine-based system.’ This conception of AI is both broader and more simplistic than definitions used by lawmakers and courts. Because of the breadth of the FCC’s proposed definition, the rule would cover far more than AI-generated deepfakes and impersonations—extending to even mundane campaign ads created using commonplace technologies like Photoshop and audio editing software.” “The proposed rule is unlikely to pass First Amendment muster,” said Ari Cohn, TechFreedom’s Free Speech Counsel. “The proposed rule applies specifically to political ads; thus, it singles out political speech—which is inherently unconstitutional for the Commission to do. If the FCC proceeds, such a rule would likely be subject to ‘heightened scrutiny’—if not strict scrutiny, then at least exacting scrutiny. It would be difficult for the FCC to justify the proposed rule under either standard. As the use of AI becomes increasingly common, the rule will sweep in more and more speech; it is very far from being narrowly tailored. Moreover, courts have been skeptical of claims that the government has a legitimate interest in protecting voters from false political speech.” ### Find these comments and release on our website, and share them on Twitter, Bluesky, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our testimony before the U.S. Senate on AI and the future of our elections, (Sep. 27, 2023) Comments to the NIST on the draft guidelines and best practices for AI safety and security (Sep. 9, 2024) California’s AI Bill Threatens To Derail Open-Source Innovation, Reason (Aug. 13, 2024) Public-private partnerships key to AI growth in OC, Orange County Register (July 15, 2024) Our letter on the “Protect Elections from Deceptive AI Act” (May 14, 2024) Orange County’s untapped AI potential, Orange County Register (Apr. 16, 2024) ‘Unregulated AI’ is a myth, Orange County Register (Apr. 1, 2024) Startlingly New, City Journal (Mar. 7, 2024) How should we regulate generative AI in political ads?, UNC Center on Technology Policy (Feb. 5, 2024) A.I. Panic is Causing First Amendment Hallucinations … in Humans, Substack (Jan. 29, 2024) Our letter on the “No Section 230 Immunity for AI Act”, (Dec. 11, 2023) Generative AI and The Future of Speech Online, Center for Democracy & Technology (Oct. 5, 2023) AI and the Nature of Literary Creativity, The Bulwark (Sep. 27, 2023) The FTC’s AI Moment, Substack (Sep. 27, 2023) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
