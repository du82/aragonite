["https://techfreedom.org/standing-up-an-office-of-civil-rights-at-the-fcc-is-premature"]
title = "Standing Up an Office of Civil Rights at the FCC Is Premature"
full_description = "Yesterday, TechFreedom filed comments in response to the Federal Communications Commission’s (FCC) Further Notice of Proposed Rulemaking (FNPRM) related to the issue of whether the FCC should create a new Office of Civil Rights (OCR) as part of the Commission’s digital discrimination proceeding. “Other agencies can point to extensive statutory bases for their operations,” said James Dunstan, TechFreedom General Counsel. “Those arguing for the establishment of an OCR within the FCC wish to imbue it with broad powers over future agency activities, pointing to similar OCRs in other federal agencies. While other federal OCRs have clear statutory underpinnings, the FCC looks to stand up a new office based solely on the 214th paragraph of an FNPRM that deals only with broadband deployment. Doing so will undoubtedly be prone to legal challenge as the office’s authorizing language bears little resemblance to the textual foundations of parallel offices elsewhere in the executive agencies.” “These questions are better asked in a broad Notice of Inquiry (NOI) that reaches far beyond broadband,” Dunstan continued. “We recognize the potential benefits of establishing such an office; however, this docket is not the right place. This FNPRM asks fourteen broad questions, but proposes no draft rules or specific guidelines for what an OCR would do at the FCC. Doing so in a narrow proceeding will not elicit comment from all affected stakeholders. If the Commission is serious about the need for an OCR, it should start a new proceeding to explore the efficacy of such a substantial change in how the FCC operates.” “The Commission should wait for the courts,” Dunstan concluded. “If the reason for establishing this new office is to implement the disparate impact regime, that rationale will evaporate if the Eighth Circuit overturns the Section 60506 Report and Order. Given the strong arguments made in the record that Section 60506’s language allows only disparate treatment rules, the Commission should wait to see whether it prevails on appeal before expending the effort needed to establish a wholly new office within the FCC. These new burdens on industry may turn out to be founded on quicksand.” ### Find these comments and release on our website, and share them on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our reply comments on the FCC’s NPRM on net neutrality regulation, (Jan. 17, 2024) Our comments on the FCC’s NPRM on net neutrality regulation, (Dec. 14, 2023) Our comments on why Section 706 is not an independent authority to regulate broadband, (Dec. 1, 2023) Our comments on the assessment and collection of regulatory fees for 2023, (June 14, 2023) Our 2023 reply comments on the prevention and elimination of digital discrimination (Apr. 20, 2023) Our 2023 comments on the prevention and elimination of digital discrimination (Feb. 21, 2023) Our comments to the FCC on facilitating interagency coordination of broadband deployment funding (Aug. 16, 2022) Our comments to the FCC regarding a Content Vendor Diversity Report (CVDR) (July 22, 2022) Our 2022 comments to the FCC on preventing digital discrimination (May 16, 2022) Our comments on NTIA’s funding through the Broadband Equity, Access and Deployment (BEAD) program (Feb. 4, 2022) Our comments to the FCC on the future of the Universal Service Fund (USF) (Jan. 18, 2022) Our comments on FCC’s assessment and collection of regulatory fees for FY 2021 (Oct. 21, 2021) The Arrival of the Federal Computer Commission?, Regulatory Transparency Project (Aug. 27, 2021) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release Tagged in: FCC"
