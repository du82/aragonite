["https://techfreedom.org/fcc-regulatory-fees-not-without-clear-authority"]
title = "FCC Regulatory Fees? Not Without Clear Authority"
full_description = "Today, TechFreedom filed reply comments at the Federal Communications Commission (FCC) in response to the Commission’s Notice of Proposed Rulemaking (NRPM) regarding the assessment of annual regulatory fees—the fees imposed on licensees that fund the FCC’s operations. Our reply comments focus on the question of whether the FCC should adopt “new regulatory fee categories” on non-licensees that nonetheless “benefit” from the FCC’s regulatory efforts. “Before the FCC can regulate an entity, or levy regulatory fees, the Commission must have actual authority over the entity,” said James E. Dunstan, TechFreedom’s General Counsel. “Especially after the Supreme Court’s recent decision in West Virginia v. EPA, an administrative agency can’t undertake new regulations just because it’s a good idea—regulations must be grounded in clear statutory authority.” “While the dollar figures involved here may not be ‘major,’ the sheer number of companies that would, for the first time, come under the regulatory authority of the FCC is vast,” Dunstan continued. “Under the ‘benefits’ theory espoused by some, the FCC would be free to collect regulatory fees from every consumer, every business, and even every machine connected to the Internet.” “Should the FCC consider broadening the pool of those who pay regulatory fees beyond traditional licensees? Possibly. But any foray in this area must be tempered by the knowledge that the FCC can only require payments from those it actually regulates,” Dunstan concluded. ### Find this release on our website, and share it on Twitter. We can be reached for comment at media@techfreedom.org. Read our related work regarding the FCC, including: West Virginia v. EPA: Sound and Fury, Signifying What?, WLF Legal Pulse (July 5, 2022)Our comments to the FCC on preventing digital discrimination, (May 16, 2022)Our comments on NTIA’s funding through the Broadband Equity, Access and Deployment (BEAD) program, (Feb. 4, 2022)Our comments to the FCC on the future of the Universal Service Fund (USF), (Jan. 18, 2022)Our comments on FCC’s assessment and collection of regulatory fees for FY 2021, (Oct 21, 2021)The Arrival of the Federal Computer Commission?, Regulatory Transparency Project (Aug. 27, 2021)Our comments on why the FCC has no authority over edge providers such as streaming services, (May 15, 2021)Our comments on rural eConnectivity programs, (Apr. 27, 2021)Our comments on the Emergency Broadband Benefit Program, (Jan. 25, 2021) About TechFreedom: TechFreedom is a non-profit, non-partisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release Tagged in: FCC, Regulatory fees"
