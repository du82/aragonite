["https://techfreedom.org/dear-ftc-childrens-advertising-isnt-inherently-unfair"]
title = "Dear FTC: Children’s Advertising Isn’t Inherently Unfair"
full_description = "Today, TechFreedom filed comments in response to the FTC’s October 2022 event entitled “Protecting Kids from Stealth Advertising in Digital Media” (the “Stealth Advertising Webinar”). Our comments stress that the FTC should resist the temptation to cast aside more than 50 years of reasoned analysis by Congress and multiple agencies to embark on an entirely new regulatory approach to advertising to children, deeming it inherently “unfair.” “Congress barred the FTC from writing rules regulating advertising to children as unfair,” said James E. Dunstan, TechFreedom’s General Counsel. “The FTC Improvement Act of 1980 clearly states the FTC shall not have any authority to promulgate any rules substantially similar to FTC’s proposed “KidVid” rules. Instead, the Commission should continue to use the tools it has at its disposal to protect children from deceptive advertising using existing standards and norms which have served it well across generations of children, and generations of media outlets.” “The FTC cannot ignore the First Amendment implications of limiting advertising to children,” Dunstan continued. “Senator Cannon put it best in 1980: ‘No one would dispute that the FTC has the authority to regulate false or deceptive advertising. But regulating truthful, non-deceptive advertising is a new exercise in overregulation—made more objectionable by the presence of the First Amendment. . . Broad bans on advertising to children would also impact the ability of adults to receive the advertising message.’” “Restrictions on advertising to children on the internet would disproportionately impact poor and minority communities,” Dunstan concluded. “The children who would be most affected by broad bans on Internet advertising to children would be the poor, and minority children with fewer resources. Take away the economic engine of advertising from content producers, and content will have to retreat behind paywalls, into curated gardens, into ‘content fortresses,’ where one must pay to enter, either through monthly subscriptions or pay-to-play mechanisms. Harmed too will be smaller, newer, and less well-funded content producers, as those gardens are expensive to build and operate.” ### Find this release on our website, and share it on Twitter. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our comments to the FTC on effective disclosures in digital advertising, (Aug. 2, 2022) Our comments to the DoJ/FTC on merger enforcement (Apr. 21, 2022) Our comments to FTC on the Draft Strategic Plan, (Nov. 30, 2021) Our comments to the FTC on UMC rulemaking authority, (Sep. 30, 2021) Our comments to the FTC on the proposed ban on exclusionary contracts, (Sep. 30, 2021) Our comments to the FTC on the proposed ban on non-compete clauses, (Sep. 30, 2021) TechFreedom Event: Will Kids’ Privacy Crackdown Break the Internet? The COPPA Rule, (Jan 13, 2020) Our comments to the FTC on COPPA Rule Review, (Dec. 11, 2019) Our comments to the FTC on on video game loot boxes, (Oct 11, 2019) The Future of the COPPA Rule: An FTC Workshop, (Oct. 7, 2019) TechFreedom Event: 20 Years of Coping with COPPA, (July 21, 2018) Our statement on the announced final amendments to COPPA, (Dec. 19, 2012) Our comments on the second round of the FTC’s re-assessment of the rules implementing COPPA, (Sep. 26, 2012) COPPA 2.0: The New Battle Over Privacy, Age Verification, Online Safety & Free Speech, SSRN (May 21, 2009) About TechFreedom: TechFreedom is a non-profit, non-partisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release Tagged in: FTC, advertising, KidVid, children"
