["https://techfreedom.org/201-owns-media"]
title = "#201: Who Owns the Media?"
full_description = "In 1975, “media” essentially meant television, radio, and newspapers. Obviously, today’s market looks way different thanks to the Internet and other developments. We have cable and satellite TV, online news, podcasts, and social media. We have “cord cutters” and “cord nevers,” and there are more ways to consume more content than ever before. In this competitive environment, however, many of the media regulations passed by the FCC in the 1970s still apply to TV, radio, and newspapers. Are these rules necessary to prevent consolidation, ensure competition, and promote a diversity of viewpoints? Or are they making it harder for traditional media to compete in the Digital Age? Evan is joined by Jerianne Timmerman, Senior VP and Senior Deputy General Counsel at the National Association of Broadcasters. For more, see her blog post. Posted in: Podcast, Foundation Tagged in: media ownership, media"
