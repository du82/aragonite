title = "Mississippi Age Verification Law Chills Protected Speech, TechFreedom Tells Fifth Circuit"
full_description = "Yesterday, TechFreedom filed an amicus brief urging the U.S. Court of Appeals for the Fifth Circuit to affirm the district court’s decision blocking enforcement of a Mississippi law that places age-verification requirements on social media. As TechFreedom’s brief explains, this law—HB 1126—and others like it chill online speech and thus violate the First Amendment. “By eroding online anonymity, age verification chills free speech and free association,” said Corbin K. Barthold, Director of Appellate Litigation at TechFreedom. “Age verification requires identifying information, such as a user’s government-issued ID or a biometric scan of a user’s face. Simply put, Mississippi is pressuring users to submit to invasive data collection.” “Internet users are increasingly aware of the risks that come with sharing information online,” Barthold continued. “A wide range of experts, politicians, and public intellectuals are sounding the alarm. Some warn that digital surveillance will promote corporate power and destroy personal privacy. Others fear that digital surveillance will promote the monitoring of ‘social credit’ and enable political oppression. Users who hear these messages will think twice before visiting, reading, or speaking at a website that requires age verification.” “‘Save the children!’ statutes like HB 1126 are political winners, but constitutional losers,” Barthold concluded. “The states pushing these statutes need to reconsider their approach. We need the tools and education that enable parents to set guardrails on their kids’ online experience, not state mandates that infantilize parents, that don’t actually protect kids, and that wreck the Internet for everyone.” The case is Netchoice, LLC v. Fitch, No. 24-60341 (5th Cir.). ### Find this brief and release on our website, and share it on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Amicus brief we joined urging SCOTUS to overturn a similar Texas law (Sep. 23, 2024) J.D. Vance is Part of Unconstitutional Porn Ban Push, Free the People (Aug. 14, 2024) Age-Gating Access To Online Porn Is Unconstitutional, Techdirt (Aug. 8, 2024) Amicus brief urging the Ninth Circuit to affirm a decision blocking enforcement of California’s Age-Appropriate Design Code (Feb. 14, 2024) Closing the Digital Frontier, City Journal (Mar. 7, 2023) Red States vs. Every SCOTUS Internet Precedent, Tech Policy Podcast #360 (Nov. 17, 2023) The Moral Panic Over Internet Porn Can’t Overrule the First Amendment, The Daily Beast (Sep. 7, 2023) Republicans Can’t Decide If They Want Online Privacy or Not, The Daily Beast (Sep. 5, 2023) Letter explaining why the Kids Online Safety Act (KOSA) threatens First Amendment rights (July 26, 2023) When Schools Scapegoat Social Media, Tech Policy Podcast #347 (June 26, 2023) Desperate to Justify Unconstitutional Social Media Law, Utah Officials Blunder Through False Equivalencies, Substack (May 11, 2023) Save the Children (From State Social Media Laws), Tech Policy Podcast #342 (Apr. 11, 2023) Our letter expressing First Amendment concerns over two Utah social media bills (Feb. 16, 2023) Is Screen Time Bad for Kids?, Tech Policy Podcast #335 (Jan. 11, 2023) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
