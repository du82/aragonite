["https://techfreedom.org/proposal-to-sunset-section-230-threatens-a-free-and-open-internet"]
title = "Proposal to Sunset Section 230 Threatens a Free and Open Internet"
full_description = "Yesterday, TechFreedom was joined by distinguished scholars of First Amendment, Internet, and technology law in a letter to the U.S. House Committee on Energy and Commerce regarding today’s hearing entitled “Legislative Proposal to Sunset Section 230 of the Communications Decency Act.” The letter explained that sunsetting Section 230 without an existing plan for replacing it is a reckless endeavor that would allow Congress to hold free speech and the open Internet hostage to partisan gamesmanship and congressional chaos. “Section 230 has enabled an unprecedented democratization of speech,” said Ari Cohn, Free Speech Counsel at TechFreedom. “The boundless capacity for user-generated content could not have been unlocked—and cannot be maintained—in America’s uniquely expensive legal system without Section 230.” Proponents of sunsetting this vital law assert that it will have no effect on free speech, because the First Amendment ultimately safeguards that core liberty. “Such claims ignore the profound speech-enabling effects that Section 230 layers on top of the First Amendment,” Cohn countered. “Those effects are what make hosting user-generated content feasible; the First Amendment will provide little solace to users who find far fewer places in which to speak.” “Putting an expiration date on Section 230 will hold the Internet and free speech hostage to partisan gamesmanship,” Cohn continued. “Congress has failed to enact Section 230 reform because its members have antithetical, yet equally unconstitutional, goals: some would use Section 230 reform to penalize platforms for hosting ‘harmful’ yet protected speech, while others would coerce platforms into hosting that same speech against their will. Sunsetting Section 230 would subject the Internet to the same chaos associated with the National Defense Authorization Act and other must-pass bills. The future of freedom of expression online will be shaped not by careful policymaking, but by political horse-trading and power dynamics.” “The myopic focus on Big Tech shows that legislators are not thinking enough about the broader Internet,” Cohn concluded. “Section 230 is vital to competition. It allows competitors to challenge dominant platforms by promising to better address the concerns of users (and Congress) without the fear of crippling liability. Sunsetting Section 230 advantages entrenched interests: dominant platforms can gain a comparative leg up by using their considerable influence to shape the new regime in a way that imposes greater relative costs on competitors—or they may just run out the clock.” ### Find this letter on our website, and share it on Twitter, Bluesky, LinkedIn, Facebook, and Mastodon. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our comments to the FTC on their proposed amendments to the Impersonation Rule (Apr. 30, 2024) Our public remarks on AI and Section 230 at the FTC’s March Open Commission Meeting (Mar. 21, 2024) Our letter to the Senate Judiciary Committee for the proposed “No Section 230 Immunity for AI Act” (Dec. 11, 2023) OA753: Gonzalez v. Google: The Case That (Didn’t) Break the Internet, Opening Arguments Podcast (Jun. 1, 2023) Our press release on the Twitter v. Taamneh and Gonzalez v. Google rulings (May 18, 2023) Section 230 Spring Summit, American Enterprise Institute (Apr. 19, 2023) Four Things to Watch in Gonzalez v. Google, FedSoc Blog (Mar. 17, 2023) Tech Policy Podcast #340: Making Sense of the SCOTUS Internet Speech Cases (Mar. 17, 2023) Don’t Repeal the Law That Created the Internet, Ripon Forum (Feb. 23, 2023) Tech Policy Podcast #338: Gonzalez v. Google (Feb. 14, 2023) Our amicus brief in Gonzalez v. Google, U.S. Supreme Court (Jan. 18, 2023) Section 230 Heads to the Supreme Court, Reason (Nov. 4, 2022) Tech PolicyPodcast #331: Section 230’s Long Path to SCOTUS (Oct. 31, 2022) Our letter on Section 230 and the American Innovation and Choice Online Act (June 27, 2022) What Is Section 230 and How Is It Different Than the First Amendment?, Foundation for Economic Education (May 27, 2022) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Press Release"
