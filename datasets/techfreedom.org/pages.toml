["https://techfreedom.org/kosa-still-poses-a-grave-threat-to-first-amendment-rights"]
title = "KOSA Still Poses a Grave Threat to First Amendment Rights"
full_description = "Today, TechFreedom sent a letter to the U.S. Senate Commerce Committee reiterating our concerns about the Kids Online Safety Act (KOSA). Last year, joined by leading Internet law and First Amendment scholars, we explained that KOSA would force platforms to age-verify their users and impose an undefinable and unmeetable duty of care—violating users’ First Amendment rights to anonymous expression and ensuring that minors will be cut off from information they are constitutionally entitled to receive. This year’s iteration of KOSA poses those same problems, only with slightly different words. “Platforms will still have to age-verify users, violating their First Amendment right to speak and access content anonymously,” said Ari Cohn, Free Speech Counsel at TechFreedom. KOSA imposes obligations on platforms when it has “knowledge fairly implied” that a user is a minor, but provides no useful guidance on what circumstances will imply such knowledge. “The revisions made to KOSA just trade an explicit mandate for a vague one. Uncertainty about when knowledge of a user’s age will be implied leads to the same result as before: the only way a platform can be confident it is in compliance is by age-verifying every user. At best, language purporting not to require such verification ignores this practical reality. At worst, it is a deliberate obfuscation of the bill’s intended effect.” “KOSA’s duty of care is an unfixable idea that is impossible to satisfy and a violation of the First Amendment,” Cohn continued. “Minors are not a monolith, and what hurts one may help another. Requiring platforms to protect the vague, nonexistent best interests of minors as a whole will limit minors to only the blandest material safe for the most sensitive individual. This chilling effect is the precise reason courts have consistently held for decades that imposing a duty to protect listeners from harmful reactions to speech is unconstitutional.” “State attorneys general of all persuasions will find KOSA a useful tool in purging the Internet of content they disfavor,” Cohn concluded. “From hateful speech to LGBTQ content, KOSA’s duty of care provides the kind of ready-made censorship tool that ambitious attorneys general could only dream of. The burden and expense of a state investigation alone may be sufficient to pressure platforms to take down or restrict access to protected expression. Handing a weapon to politically motivated actors who have demonstrated that they will use any tools at their disposal to silence speech they disagree with is grossly irresponsible.” ### Find this letter on our website, and share it on Twitter, Bluesky, Mastodon, Facebook, and LinkedIn. We can be reached for comment at media@techfreedom.org. Read our related work, including: Our press release when the bill was reintroduced this year (May 2, 2023) Our letter on why the EARN IT Act remains a threat to liberty, security, and the safety of children (May 2, 2023) Closing the Digital Frontier, City Journal (Mar. 7, 2023) Our letter expressing First Amendment concerns over two Utah bills (Feb. 16, 2023) Our comments to the FTC on a child engagement rulemaking petition (Jan. 18, 2023) Tech Policy Podcast #335: Is Screen Time Bad for Kids? (Jan. 11, 2023) Our letter on the Children and Teens’ Online Privacy Protection Act (S. 1628) (Dec. 6, 2022) Our letter on why the Kids Online Safety Act will make the Internet less safe for children (Dec. 6, 2022) Our comments to the FCC on protecting kids from stealth advertising in digital media (Nov. 18, 2022) Our coalition letter explaining the harmful effects of the EARN IT Act of 2022 (Mar. 3, 2023) The Top Ten Mistakes Senators Made During Today’s EARN IT Markup, Techdirt (Feb. 10, 2022) Our letter proposing five amendments to the EARN IT Act of 2022 (Feb. 8, 2022) About TechFreedom: TechFreedom is a nonprofit, nonpartisan technology policy think tank. We work to chart a path forward for policymakers towards a bright future where technology enhances freedom, and freedom enhances technology. Posted in: Letter Tagged in: KOSA"
