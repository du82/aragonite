title = "Technologia Incognita"
full_description = "Technologia Incognita, a hackerspace in Amsterdam. The hackspace is located at Louwesweg 1 which is in the ACTA building. We are best reached by Public Transport, Check here for the closest tram/bus/metro stops. We are a vereniging (association) and fund our space and tools from member donations. If you have any questions feel free to ask a member at the weekly Wednesday social night. More information regarding membership is on the wiki. For convenience, most of our content can be found on the wiki.For events at techinc, see the Events page on the wiki. For a list of our members projects, see the Projects page on the wiki. WIKI wiki.techinc.nl EMAIL Contact Us IRC #techinc @ oftc MAILING LIST Mailing List More contact methods...Our other Mailing lists..."
