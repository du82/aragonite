full_description = '''From the Terminal V4L2 Notes for Linux June 14, 2022 by Henry v4l2 linux capture devices video Find out what is using capture devices fuser /dev/video0 Find out name of process ps axl | grep ${PID} Show info v4l2-ctl --all Set resolution and frame rate v4l2-ctl -v width=1920,height=1080 --set-parm=60 v4l2-ctl -v width=3840,height=2160 --set-parm=30 Reset USB Device usbreset "Live Streaming USB Device" Show Stream in GUI qvidcap Create a virtual video capture device sudo modprobe v4l2loopback devices=1 video_nr=10 card_label="OBS Cam" exclusive_caps=1 Automatically on Kernel Start up Must install https://github.com/umlaeute/v4l2loopback media-video/v4l2loopback on Gentoo echo "v4l2loopback" > /etc/modules-load.d/v4l2loopback echo "options v4l2loopback devices=1 video_nr=10 card_label=\"OBS Cam\" exclusive_caps=1" > /etc/modprobe.d/v4l2.conf Run modprobe v4l2loopback after setting it up to load without restarting. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4