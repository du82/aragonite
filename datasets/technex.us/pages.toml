full_description = '''From the Terminal keyd on Gentoo with OpenRC and KDE Plasma July 19, 2024 by Henry linux gentoo openrc kde git clone https://github.com/rvaiya/keyd cd keyd make && sudo make installtouch /etc/init.d/keydnano /etc/init.d/keyd Pop this in there and save. #!/sbin/openrc-run # Description of the service description="keyd key remapping daemon" # The location of the keyd binary command="/usr/local/bin/keyd" #command_args="-d" pidfile="/run/keyd.pid" depend() { need localmount after bootmisc } start() { ebegin "Starting keyd" start-stop-daemon --start --exec $command --background --user root --make-pidfile --pidfile $pidfile -- eend $? } stop() { ebegin "Stopping keyd" start-stop-daemon --stop --pidfile $pidfile eend $? } restart() { ebegin "Restarting keyd" start eend $? } sudo rc-update add keyd default/etc/init.d/keyd startsudo setfacl -m u:USERNAME:rw /var/run/keyd.socket If you want application specific key binds you need to run /usr/local/bin/keyd-application-mapper inside your KDE Plasma session. To do that simply add it to your autostart through the System Settings application. Port forwarding a database through a VPN with Docker and Nginx September 13, 2023 by Henry nginx docker containers openvpn vpn mysql mariadb postgresql port forwarding networking This goes into your docker-compose.yml version: '3.9' services: openvpn-client: image: ghcr.io/wfg/openvpn-client container_name: openvpn-client cap_add: - NET_ADMIN devices: - /dev/net/tun volumes: - ./.docker/openvpn:/config # place config.ovpn file into this folder #network_mode: container:openvpn-client #restart: unless-stopped environment: - CONFIG_FILE=config.ovpn - ALLOWED_SUBNETS=192.168.0.0/24,192.168.1.0/24 # - AUTH_SECRET=credentials.txt networks: front-tier: ipv4_address: 172.25.0.7 proxy: image: nginx:1.25.1 container_name: db-proxy network_mode: container:openvpn-client volumes: - ./.docker/proxy/nginx/:/etc/nginx/ - ./.docker/proxy/logs/:/var/log/nginx/ depends_on: - openvpn-client networks: front-tier: ipam: driver: default config: - subnet: "172.25.0.0/24" Make sure to create the folders .docker/proxy/nginx/ and .docker/proxy/logs/. Place this into .docker/proxy/nginx/nginx.conf user nginx; worker_processes auto; error_log /var/log/nginx/error.log notice; pid /var/run/nginx.pid; events { worker_connections 1024; } http { # This is where all http server configs go. } stream { server { listen 5432; proxy_connect_timeout 60s; proxy_socket_keepalive on; proxy_pass 10.0.3.11:5432; } } Just make sure to set proxy_pass to the destination. After running docker-compose up you'll be good to go. Configuring an RTMP streaming server for VRChat with Nginx September 13, 2023 by Henry obs vrchat nginx rtmp streaming music I recently picked up a Valve Index and I've started to explore the music community One of the most compelling aspects of VRChat as a platform is how you can use it as a way of discovering music. A vast and diverse community of individuals with varied musical tastes and backgrounds already exists. In VRChat, you can attend music festivals, explore custom-built music worlds, and interact with other users who share your passion for various musical genres. This environment encourages discovery and exposes you to a wide range of genres, artists, and tracks that you may not have encountered otherwise. It's a melting pot of musical creativity waiting to be explored. Moreover, VRChat offers a unique opportunity for musicians, DJs, and producers to hone their craft and experiment with performing, mixing, and DJing in a virtual setting. Through the integration of streaming music into VRChat, you can curate and share playlists, perform live DJ sets, and even create your own virtual music venues. The interactive nature of VRChat enables you to receive immediate feedback from your audience, allowing you to refine your skills, experiment with new techniques, and build a dedicated following. While Twitch and YouTube have transformed the streaming landscape, they do have limitations that can impact the quality and control of your stream. These platforms often inject ads into your content, disrupting viewer engagement, and they impose restrictions on bitrate, limiting the stream's video quality. To overcome these challenges, many streamers are turning to Nginx for RTMP. By configuring Nginx to stream directly to your audience, you regain control over your stream, eliminate unwanted ads, and achieve higher bitrates for an uninterrupted, high-quality viewing experience. This reference should let you quickly set up a public facing site. nano /etc/nginx/sites-enabled/stream.conf server { listen 443 ssl; server_name stream.yourdomain.example; ssl_certificate /etc/letsencrypt/live/stream.yourdomain.example/fullchain.pem; # managed by Certbot ssl_certificate_key /etc/letsencrypt/live/stream.yourdomain.example/privkey.pem; # managed by Certbot include sites-available/include-ssl.conf; server_tokens off; # rtmp stat location /stat { rtmp_stat all; rtmp_stat_stylesheet stat.xsl; } location /stat.xsl { root /var/www/stream/rtmp; } # rtmp control location /control { rtmp_control all; } location /hls { # Serve HLS fragments types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; } root /tmp; add_header Cache-Control no-cache; add_header 'Access-Control-Allow-Origin' '*' always; add_header 'Access-Control-Expose-Headers' 'Content-Length'; if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' '*'; add_header 'Access-Control-Max-Age' 1728000; add_header 'Content-Type' 'text/plain charset=UTF-8'; add_header 'Content-Length' 0; return 204; } } } Make sure to add this global rtmp config. sudo nano /etc/nginx/rtmp.conf rtmp { server { listen 1935; # this is the port, you may change it if necessary. chunk_size 4096; application live { # "live" may be changed to whatever you'd like, this will affect the URLs we use later, though. live on; allow publish 0.0.0.0; # put your IP here. deny publish all; # denied if none of the above apply. # -- HLS -- hls on; hls_path /tmp/hls; # this is where all of HLS's files will be stored. # They are a running replacement so disk space will be minimal. # Adjust other HLS settings if necessary to level it out if it's a problem. hls_playlist_length 60s; hls_fragment 1s; # optionally, hls_continuous on; } } } Add this to the bottom of /etc/nginx/nginx.conf include rtmp.conf; The URL will actually be rtmp://stream.yourdomain.example/live/random-stream-key but in OBS we will actually put in rtmp://stream.yourdomain.example/live and the second field in OBS is our key. Finally the stream link we will put into VRC will look like this. https://stream.yourdomain.example/live/random-stream-key.m3u8 PHP attributes are so awesome I just had to add attribute based field mapping to my ORM July 28, 2023 by Henry code coverage unit testing php8 phpunit php I wrote this post to talk about the architectural decisions I had to make in upgrading my ORM recently to PHP8 as well as the general justification for using an ORM in the first place as a query writer, runner, and object factory and why I consider attributes to be the holy grail of ORM field mapping in PHP. Writing Queries I've always been fascinated with moving data in and out of a database. I've been at this from PHP4 days, you know. As hard as it is to believe even back then we had a testable, repeatable, and accurate way of pushing data into and out of a database. I quickly found myself writing query after query.... manually. At the time there was no off the shelve framework you could just composer require. So I found myself thinking about this problem again and again and again and again. Put simply when you write SQL queries you are mapping variable values in memory to a string. If you are one of those people that claims that an ORM is bloat you'll find yourself writing hundreds of queries all over your projects. If you've ever imploded an array by a "','" but then ended up doing it in dozens or hundreds or thousands of places the next logical step is to stop rewriting your code and write a library.... and hence an ORM is born. An ORM is an absolute statement; that "I will not rewrite code for handling a datetime" and then actually following through. To make this happen you must write some sort of translation layer from PHP types to SQL types. In most ORMs this is called mapping. Before PHP8 the typical thing to do was to use a PHP array defined statically containing all that information. Like this. In fact this is from Divergence from before version 2. public static $fields = [ 'ID' => [ 'type' => 'integer', 'autoincrement' => true, 'unsigned' => true, ], 'Class' => [ 'type' => 'enum', 'notnull' => true, 'values' => [], ], 'Created' => [ 'type' => 'timestamp', 'default' => 'CURRENT_TIMESTAMP', ], 'CreatorID' => [ 'type' => 'integer', 'notnull' => false, ], ]; But this kinda sucks. There's no way to do any auto complete and it's just generally a little bit slower. A few frameworks decided to support mapping using annotations (an extended PHPDoc in PHP comments) and even yaml field maps but those are all just bandaids on the real problem. Which was that there was no real way to provide proper field definitions using the raw language's tokens, instead relying on the runtime to store and process that information. Attributes So that's my long winded explanation about why my absolute favorite feature of PHP 8 is attributes. Specifically for ORM field mapping. Yea really. #[Column(type: "integer", primary:true, autoincrement:true, unsigned:true)] protected $ID; #[Column(type: "enum", notnull:true, values:[])] protected $Class; #[Column(type: "timestamp", default:'CURRENT_TIMESTAMP')] protected $Created; #[Column(type: "integer", notnull:false)] protected $CreatorID; This is sooooo much cleaner. Look how awesome it is. Suddenly I have auto complete for field column definitions right in my IDE! Now the code is cleaner and easier to follow! You've even got the ability to type hint all your fields. Once we take field mapping to it's logical conclusion it becomes practical to simply map as many database types as we can into the ORM. We can even try to support all of the various field types that could be used in SQL and represented somehow in PHP. Of course to make this happen it becomes necessary to tell the framework some details about the database field type you decide to use. For example you can easily see yourself using a string variable type for varchar, char, text, smalltext, blob, etc but most ORMs aren't typically smart enough to warn you when you inevitably make a mistake and try to save your larger than 256 character string to a varchar(255). If you were to build all of this yourself you would invariably find yourself creating your own types for your ORM and doing a translation from language primitive to database type and back just like I am here. This gets even more complex when an ORM decides to support multiple database engines. Once this becomes more fleshed out you can even have your ORM write the schema query and automatically create your tables from your code. Here for example I'm gonna go ahead and create a Tag class and then save something. class Tag extends Model { public static $tableName = 'tags'; protected $Tag; // this will be a varchar(255) in MySQL, a string in PHP } $myTag = new Tag(); $myTag->Tag = 'my tag'; $myTag->save(); With these few simple lines of code we've created a tags table and saved a new Tag "my tag" into our new table. The framework automatically detected the table was missing during the save and created it and then followed through by running the original save. Excellent for bootstrapping new projects or installing software. Protected? Magic Methods Traditionally it's common to think that __get and __set are triggered only when a property is undefined. However it is also triggered if you try to access a protected property from outside of the model. When you access a protected attribute from outside of the object it will always trigger __get when retrieving and __set when setting. For this reason I decided to use protected attributes in a Model for mapping. The way in and out allows us to do some type casting. For example Divergence supports reading a timestamp in Y-m-d H:i:s, unix timestamp, and if it's a string that isn't Y-m-d H:i:s it will try running it through strtotime() before giving up. But that will only ever happen when __set is called thereby starting the chain of events leading to the necessary type casting for that field type. Unfortunately the downside to using a protected in this context is that when you need to access a field inside the object you can't use $this->Tag = 'mytag'; because it won't trigger __set and so what's gonna happen is you will end up messing with the internal data of that field incorrectly. So for the specific context where you're working with the field directly inside of the object itself you should actually use setValue and getValue instead. Frankly you can use __set and __get directly but let's be civilized here. This caveat is why I would like to see the ability for PHP to have __set and __get triggerables configurable to do so on existing object members. Relationships. But wait. There's more! Now with the ability to use Attributes for field definitions we can use them for relationship definitions as well. #[Relation( type: 'one-one', class: User::class, local: 'CreatorID', foreign: 'ID' )] protected $Creator; #[Relation( type: 'one-many', class: PostTags::class, local: 'ID', foreign: 'BlogPostID' )] protected $Tags; Relationships take Attributes to the next level. $this->getValue('Tags'); This is all you need to pull all the Tags as an array. Most relationship types can be easily expressed in this format. $Model->Tags // also works but only from "outside" You can run it like this as well from outside of the Model. PHP in 2023 is blindingly fast. Today the entire suite of tests written for Divergence covering 82% of the code completes in under a second. Some of these tests are generating thumbnails and random byte strings for mock data. For reference in 2019 the same test suite clocked in at 8.98 seconds for only 196 tests. By the way these are database tests including dropping the database and creating new tables with data from scratch. The data is randomized on every run. Performance What you are seeing is [time since start] [label] [memory usage] at print time. The first part where it generates 1000 data points is all using math random functions to generate random data entirely in raw none-framework PHP code. Each Canary has 17 fields meant to simulate every field type available to you in the ORM. Generating all 17 1000 times takes a none trivial amount of time and later when creating objects from this data it must again process 17,000 data points. Optimizing the memory usage here will be a point of concern for me in future versions of the ORM. All the work related to what I wrote about in this post is cu'''
