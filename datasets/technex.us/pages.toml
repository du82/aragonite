title = "Port forwarding with SSH Tunneling | Tech Nexus"
description = """
With OpenSSH, port forwarding is configured using the -L option.
 You can initiate a port forwarding operation with this command:
 ssh -L 80:example.com:80 technex.us
 In this example we are telling OpenSSH to open port 80 on the current machine to exampl"""
full_description = "From the Terminal Port forwarding with SSH Tunneling April 23, 2018 by Henry ssh terminal osx linux openssh bash With OpenSSH, port forwarding is configured using the -L option. You can initiate a port forwarding operation with this command: ssh -L 80:example.com:80 technex.us In this example we are telling OpenSSH to open port 80 on the current machine to example.com on port 80 from the server we are connecting to. In this case the server is technex.us. Don't forget that anyone can connect to this port on your machine so you might want to limit connects to localhost by telling OpenSSH to listen on a specific IP. In this case you can specify 127.0.0.1 like so: ssh -L 127.0.0.1:80:example.com:80 technex.us Since this is OpenSSH you can actually use the alias you specified in your ~/.ssh/config file. I talk more about the OpenSSH config file here. Building on top of that guide if you want to maintain a port forward everytime you connect to a specific machine you can use this syntax: Host alias HostName technex.us User user IdentityFile /Users/user/.ssh/mykey_rsa LocalForward 127.0.0.1:80 example.com:80 Now you can simply type in ssh alias in terminal and be connected with a port forward. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy