["https://technex.us/2020/06/installing-xdebug-on-anything-for-vscode-in-5-minutes"]
title = "Installing XDebug on anything for VSCode in 5 minutes (XDebug 2.x) | Tech Nexus"
description = """
Update 2/25/2021: This guide is for XDebug 2.x only.
 For XDebug 3.x click here.
 I see a lot of over complicated guides on XDebug so I'll simplify things real quick for everyone.
 Visual Studio Code has debugging support out of the box. Click on the Debu"""
full_description = '''From the Terminal Installing XDebug on anything for VSCode in 5 minutes (XDebug 2.x) June 25, 2020 by Henry php phpunit xdebug tdd unit testing vscode Update 2/25/2021: This guide is for XDebug 2.x only. For XDebug 3.x click here. I see a lot of over complicated guides on XDebug so I'll simplify things real quick for everyone. Visual Studio Code has debugging support out of the box. Click on the Debug icon in the left bar (OS X: ⇧⌘D, Windows / Linux: CTRL+SHIFT+D) then click on the cog icon which should open your launch.json file or create one if none exists. You must have the PHP XDebug extension installed of course. Now add this to your launch.json file you have open: { "type": "php", "request": "launch", "name": "Listen For XDebug", "port": 9000, "pathMappings": { "/var/www/": "${workspaceRoot}" }, "xdebugSettings": { "max_children": 256, "max_data": -1, "max_depth": 5 }, "ignore": [ "**/vendor/**/*.php" ] } Make sure you change /var/www/ to where your code is on your local server. Set this in your php.ini [xdebug] xdebug.remote_enable = 1 xdebug.remote_autostart = 1 xdebug.profiler_enable_trigger = 1 You might need to do it twice. Once for CLI and once for PHP-FPM! Typical locations for your php.ini file: Linux: /etc/php/{$version}/php.ini macOS (Homebrew): /usr/local/etc/php/{$version}/php.ini Don't forget to restart php-fpm! Now start the debugger by hitting the green play button. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency res