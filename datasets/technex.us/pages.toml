full_description = "From the Terminal Cajun Style Fried Rice March 21, 2021 by Henry food recipe cooking In a dutch oven Garlic - 2 cloves, diced Butter - 2 tbs Chicken / Beef stock - Whole 28 oz Carton Carrots - Half a cup, diced Red Pepper - 1 tbs Cajun style mix - 4 tbs Whole dried red peppers - 2-3 Medium grain rice - 2 cups Throw butter into the dutch oven with the garlic and spices on high, add stock, whisk, add carrots, whisk. Once the mixture is steaming add the rice. Whisk again. Wait for boil then lower heat to a simmer and cover. Mix every 5 minutes until liquid is fully absorbed by the rice. No more than 15-20 minutes. Serve with lime wedges to squeeze over the rice. Fresh cilantro is also a great garnish. Pair with any protein. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Arch