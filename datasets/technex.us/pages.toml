full_description = '''From the Terminal How to make a launcher for Spotify in Linux that works with Spotify links May 24, 2022 by Henry spotify linux linux desktop dbus When launching Spotify in Linux by default the deb package comes with a desktop file that contains an exec that essentially just runs the "spotify" binary. Spotify does have a dbus interface for certain things. We can look for an existing process and if one is found we throw the Spotify link into dbus instead of opening another Spotify instance. I wrote a simple launcher replacement. Just set your desktop file to use this instead of the default. Slack magic login broken on Linux with KDE May 17, 2022 by Henry linux kde slack bug What's going on? kde-open5 is breaking the links by making all characters lowercase. Get the link by running: while sleep .1; do ps aux | grep slack | grep -v grep | grep magic; done Then just run `xdg-open [the link]` The link should look like this: slack://T8PPLKX2R/magic-login/3564479012256-b761e747066f87b708f43d5c0290bb076f276b121486a5fb6376af0dd7169e7d About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudfla