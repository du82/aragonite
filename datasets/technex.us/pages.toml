full_description = "From the Terminal Slack magic login broken on Linux with KDE May 17, 2022 by Henry linux kde slack bug What's going on? kde-open5 is breaking the links by making all characters lowercase. Get the link by running: while sleep .1; do ps aux | grep slack | grep -v grep | grep magic; done Then just run `xdg-open [the link]` The link should look like this: slack://T8PPLKX2R/magic-login/3564479012256-b761e747066f87b708f43d5c0290bb076f276b121486a5fb6376af0dd7169e7d About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Archives September 2024 August 2024 July 2024 October 2023 September 2023 July 2023 June 2023 October 2022 June 2022 May 2022 March 2021 February 2021 October 2020 September 2020 August 2020 June 2020 May 2020 March 2020 September 2019 April 2019 February 2019 November 20