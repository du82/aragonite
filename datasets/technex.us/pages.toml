full_description = "From the Terminal Solving Dependency Slot Conflicts in Gentoo Elegantly June 03, 2020 by Henry linux gentoo portage emerge dependency resolution Sometimes when you want to emerge something or upgrade something you will have dependency slot conflicts like this example. To fix this problem you'd need to emerge all kde-frameworks/* packages you currently have installed to upgrade them all at once since it's all part of one framework. The following commands let you do so with ease. equery l kde-frameworks/* -F '$category/$name' The output of which you can send right into emerge like so. sudo emerge --ask -1 --verbose-conflicts $(equery l kde-frameworks/* -F '$category/$name') Now you'll hopefully get a clean emerge. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Archives Sept