full_description = '''From the Terminal keyd on Gentoo with OpenRC and KDE Plasma July 19, 2024 by Henry linux gentoo openrc kde git clone https://github.com/rvaiya/keyd cd keyd make && sudo make installtouch /etc/init.d/keydnano /etc/init.d/keyd Pop this in there and save. #!/sbin/openrc-run # Description of the service description="keyd key remapping daemon" # The location of the keyd binary command="/usr/local/bin/keyd" #command_args="-d" pidfile="/run/keyd.pid" depend() { need localmount after bootmisc } start() { ebegin "Starting keyd" start-stop-daemon --start --exec $command --background --user root --make-pidfile --pidfile $pidfile -- eend $? } stop() { ebegin "Stopping keyd" start-stop-daemon --stop --pidfile $pidfile eend $? } restart() { ebegin "Restarting keyd" start eend $? } sudo rc-update add keyd default/etc/init.d/keyd startsudo setfacl -m u:USERNAME:rw /var/run/keyd.socket If you want application specific key binds you need to run /usr/local/bin/keyd-application-mapper inside your KDE Plasma session. To do that simply add it to your autostart through the System Settings application. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesha