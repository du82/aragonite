["https://technex.us/topics/best%20practice"]
title = "best practice | Tech Nexus"
description = "References, guides, and thoughts on tech."
full_description = '''From the Terminal A few useful life cycle tracking variables every ORM should have August 07, 2020 by Henry activerecord php orm best practice Right now I'm in the unusual position of being responsible for maintaining two different ORMs libraries. Occasionally I want to implement a feature that exists in one of them in the other. One such feature recently came up and I think this is something that all ORMs would benefit from whether or not they are custom written or maintained by the community. In fact after looking into things it looks like some of these already exist in one way or another in some of the most popular ORMs available. Let's take a look at some of them. isNew - False by default. Set to true only when an object that isPhantom is saved isUpdated - Set to true when an object that already existed in the data store is saved. isPhantom - True if this object was instantiated as a brand new object and isn't yet saved. isDirty - False by default. Set to true only when an object has had any field change from it's state when it was instantiated. Some of these properties might already exist in one form or another in your frameworks. They are simple to implement by simply adding them to the functions in the Model class at different points in the life cycle of the object. Most of them are extremely simple but as you'll see with isDirty consideration might get extremely complex in a hurry. isNew The point of isNew is to be able to tell that this object was created during this script execution but was previously saved. Before save it's obvious that an object is new by it's missing primary key. However after saving all evidence of this object being new has been erased. This property lets you know that this object was previously created by you so that if it's part of a large array you can iterate over the items and still know which objects are the "new" ones. Let's take a look at how this might be useful. <?php $cars = Car::GetAll(); $car = new Car(); $car->save(); $cars[] = $car; foreach($cars as $car) { if($car->isNew) { // do something special to the objects we created above even if we saved them since then } } isUpdated This one is pretty simple. This let's us know something that was already in the data store, has been updated by us since initialization. isPhantom Let's us know if we need to Update or Insert this model when saving the object. If Insert this gets set to false right after. Implementation Details Let's table isDirty for now and come back to it. For now let's take a look at some code. Here we do a pretty basic boiler plate for the variables we want and how they are manipulated later on. __construct() <?php public function __construct(..., $isDirty = false, $isPhantom = null /* you can implement these differently but the hydrator needs some way to set these for an instantiated object */) { $this->_isPhantom = false; // this should be set by your model hydrator at time of hydration $this->_isDirty = $this->_isPhantom || $isDirty; $this->_isNew = false; $this->_isUpdated = false; } save() public function save() { if ($this->isDirty) { // create new or update existing if ($this->_isPhantom) { // do insert $this->_isPhantom = false; $this->_isNew = true; } else { // do update $this->_isUpdated = true; } $this->_isDirty = false; // only if you don't use a function to detect this } } So here we can see how it all comes together from initialization to storage. But what about isDirty? What's so complex about it? Well let's take a look. isDirty There's multiple ways to implement isDirty and both have positive aspects as well as drawbacks. If your ORM uses direct PHP object properties that map to fields only one is open to you anyway. Let's take a look at what I mean. If you use an ORM where the fields are not object properties and are in-fact "not real" that means that you can actually implement this as a simple boolean. For example: <?php public function __construct(...) { $this->_isDirty = false; } public function __set($field,$value) { $this->_isDirty = true; ... } public function save() { ... $this->_isDirty = false; } The best thing about this method is how light is it on the run time. You simple need one boolean worth of memory space for each object. Unfortunately this method also can't tell when the field was set back to it's original value or if a field was edited but the value remained the same as it was before. So while you may save some memory up front in your run time you might end up wasting a lot more memory resources in your database updating records that have no new data or simply slowing down batch processes sending writes to the database that it will end up wasting time. Furthermore this only works with dynamically allocated "magic" properties. Your other option is to use a method to test each field for a change and return true or false. Okay but how? By keeping a copy of the "original" field values of course. And this is where this method starts to show it's down sides. You actually end up approximately doubling the amount of memory you need to make this happen. Plus that itself has complexity. For example do you change your original variables after a save? Unfortunately the answer is yes. Simple because you want isDirty to go back to false after running a save. Some things are free though. Any object that is a phantom is dirty by definition. public function isDirty() { if ($this->isPhantom) { return true; } $fields = static::getFields(); foreach ($fields as $field) { if ($this->isFieldDirty($field)) { return true; } } return false; } public function isFieldDirty($field) { if (isset($this->_originalValues[$field])) { if ($this->_originalValues[$field] !== $this->$field) { return true; } else { return false; } } return false; } Of course you'll need to set_originalValues in your object during hydration. New objects won't start tracking this until immediately after save. It's worth noting that Laravel's Eloquent implements isDirty in a very similar way. Closing Thoughts Most ORMs implement these one way or another out of necessity however it would be nice if ORMS could standardize on these and perhaps start using the same terminology surrounding them. Is dirty is optional for many ORMs when it's beneficial to force a save() even if nothing has been changed simply to updated the modified at timestamp for the record in the data store. Still a well designed ORM should let you do both depending on your needs. How I gamified unit testing my PHP framework and went from 0% unit test coverage to 93% in 30 days February 17, 2019 by Henry phpunit php unit testing code coverage xdebug best practice continuous integration In 2018 I was taking a break from work. I wanted to upgrade my skills while looking for new opportunities. My previous job was working in a NodeJS environment which I certainly enjoy in many ways but PHP is actually my favorite language to work with so I wanted to challenge myself to learn something new. I had two goals really. The first was to learn. I wanted to see what continuous integration was actually all about. The second was to prove the rock solid design of the ORM library I've been using for the past five years. It was passed around by a few local developers I knew but using it in production on new projects became an increasingly hard battle as most people wanted to use other ORMs that were more popular. It felt like without unit tests and a code coverage badge and a page on packagist I had no legitimacy. With that in mind I got to work. With this post I hope to write down what I learned in a clear, concise, and easy to understand way for moderately experienced PHP developers and for myself. Code Coverage Code coverage is a line by line yes/no report from PHPUnit that simply says if that line has been tested or if it has not. You can get a code coverage report on your own computer just by running PHPUnit with XDebug enabled. Just add the command line switch --coverage-clover clover.xml when you run PHPUnit. Here you can see I'm telling phpunit where to put the code coverage report. You will need Xdebug as well for the feature to be available. A clover.xml file by itself though is just raw data and without a proper interface to view it you won't really be able to make much use of it. View the Code Coverage Report One website which provides this is Codecov.io They give you a simple to use bash install script. You can run it right now with the report you already generated right in the terminal. You can see it found my code coverage report but it still wants me to provide a repository token. You should probably sign up at this point and claim your free private repository. If your project is open-source you can have as many as you want! Once signed up you will find the token in the repository settings. They give you a few ways to specify the token there. Personally for open source projects I prefer to use environmental variables since I won't have to .gitignore the codecov.yaml file. Now you can run the report uploader script from above again. Now that it uploaded you can take a look at the report. As you can see my initial commit had terrible code coverage. The code was still not even organized as per PSR-4 and PHP League standards but at least I had base line and there's no where to go but up. The PHP League The PHP League of Extraordinary Packages make a slew of excellent packages but they also provide a skeleton template available in this Git repository that documents the proper modern way of organizing a PHP project. It was invaluable to me as a reference. It shows you how to configure badges, continuous integration, organize your source code, and lots of other best practices. Continuous Integration Now that we know the code coverage report works we can setup continuous integration. I'd recommend TravisCI but if you have Bitbucket premium it comes with 500 free minutes of their continuous integration solution called Pipelines. Pipelines and TravisCI are basically just plugins for Github or Bitbucket or any other host of your Git repository. They get event hooks when your code gets pushed to your Git host and then they run a bash script in a container with your code. You can then run tests, do builds, and setup other automated solutions for your source code. But how you ask? Well there's a YAML file you have to create. In this example I will show my Travis file. The source is available here. language: php php: - '7.1' - '7.2' addons: apt: sources: - mysql-5.7-trusty packages: - mysql-server - mysql-client before_install: #- sudo mysql -e "use mysql; update user set authentication_string=PASSWORD('divergence_tests') where User='root'; update user set plugin='mysql_native_password';FLUSH PRIVILEGES;" #- sudo mysql_upgrade #- sudo service mysql restart - mysql -e 'CREATE DATABASE IF NOT EXISTS test;' install: # Install composer packages - travis_retry composer update --no-interaction --no-suggest - travis_retry composer install --no-interaction --no-suggest # Install coveralls.phar - wget -c -nc --retry-connrefused --tries=0 https://github.com/php-coveralls/php-coveralls/releases/download/v2.0.0/php-coveralls.phar -O coveralls.phar - chmod +x coveralls.phar - php coveralls.phar --version before_script: - mkdir -p build/logs - ls -al script: - ./vendor/bin/phpunit --coverage-clover build/logs/clover.xml after_success: # Submit coverage report to Coveralls servers, see .coveralls.yml - travis_retry php coveralls.phar -v # Submit coverage report to codecov.io - bash <(curl -s https://codecov.io/bash) # Tell Travis CI to monitor only 'master' branch branches: only: master # Specify where the cache is so you can delete it via the travis-ci web interface cache: directories: - vendor - $HOME/.cache/composer This file basically tells Travis what to do. Which versions of PHP to test with. Which branches of the git repo to run against. Sets up the localhost MySQL environment for our PHPUnit tests in the container. Runs composer dependency installer Runs PHPUnit Uploads the code coverage report. The best part? You get an email at the end with what got fixed or any new problems. TravisCI also runs a rudimentary static analyzer on your code bringing up problems with the source as well as your PHPDoc notation which adds even more added value to having your unit tests run automatically every time you update a given branch. In Github you even get this view available to you all in one place. The Road to 90% Initially you come to the realization that your ability to increase the score through your simple and basic helper classes lets you score a few easy wins early on. Ripping out old, unused, verbose, and unclean code also lowers your total code count thereby increasing your overall coverage score. Sometimes you actually have to edit your code to make it easier to test. Standalone global code in PHP files becomes even more onerous as testing that code becomes next to impossible. Let's take a look at a few examples. Editing your code to make it easier to test. Here I need to fake the stream php://input which is what we parse for raw JSON data sent via POST. Doable but only by creating your own fake stream and at a different address. But it's okay because it enabled this simple test. Which increased the coverage of that one file by 13.33%. By the way virtual streams are pretty awesome. Check out the test below. /** * @covers Divergence\Helpers\JSON::getRequestData */ public function testGetRequestData() { $json = '{"array":[1,2,3],"boolean":true,"null":null,"number":123,"object":{"a":"b","c":"d","e":"f"},"string":"Hello World"}'; vfsStream::setup('input', null, ['data' => $json]); JSON::$inputStream = 'vfs://input/data'; $x = json_decode($json,true); $A = JSON::getRequestData(); $B = JSON::getRequestData('object'); $this->assertEquals($A, $x); $this->assertEquals($B, $x['object']); } Ripping Out Old Code Here I found a function that was previously used to manually prettify JSON used way back when PHP didn't have this functionality built in. Sometimes it's sad to delete old code. Especially when it's will written, clean, and easy to understand. But sometimes it's just time to let it go and let someone else worry about it. Lets just say I cut a lot of random old code. This obviously had a great impact on the readability and cleanliness of the code going forward. What I did for Database Unit Testing Eventually I ran out of low hanging fruit testing things that had nothing to do with the database and then... it was time for the database. A number of issues came up. A test database would need to be created on my laptop that mirrors the TravisCI config to avoid having to write extra logic. I added a new 'testing' default config to the default database config that comes with the framework. I needed to add some bash terminal commands to the TravisCI file above to make it reset the database every time. I need a way to run some code the unit tests need to run before all the unit tests would begin to setup a'''
