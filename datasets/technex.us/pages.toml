["https://technex.us/2020/08/a_few_useful_life_cycle_tracking_variables_every_orm_should_have"]
title = "A few useful life cycle tracking variables every ORM should have | Tech Nexus"
description = "Right now I'm in the unusual position of being responsible for maintaining two different ORMs libraries. Occasionally I want to implement a feature that exists in one of them in the other. One such feature recently came up and I think this is something th"
full_description = '''From the Terminal A few useful life cycle tracking variables every ORM should have August 07, 2020 by Henry activerecord php orm best practice Right now I'm in the unusual position of being responsible for maintaining two different ORMs libraries. Occasionally I want to implement a feature that exists in one of them in the other. One such feature recently came up and I think this is something that all ORMs would benefit from whether or not they are custom written or maintained by the community. In fact after looking into things it looks like some of these already exist in one way or another in some of the most popular ORMs available. Let's take a look at some of them. isNew - False by default. Set to true only when an object that isPhantom is saved isUpdated - Set to true when an object that already existed in the data store is saved. isPhantom - True if this object was instantiated as a brand new object and isn't yet saved. isDirty - False by default. Set to true only when an object has had any field change from it's state when it was instantiated. Some of these properties might already exist in one form or another in your frameworks. They are simple to implement by simply adding them to the functions in the Model class at different points in the life cycle of the object. Most of them are extremely simple but as you'll see with isDirty consideration might get extremely complex in a hurry. isNew The point of isNew is to be able to tell that this object was created during this script execution but was previously saved. Before save it's obvious that an object is new by it's missing primary key. However after saving all evidence of this object being new has been erased. This property lets you know that this object was previously created by you so that if it's part of a large array you can iterate over the items and still know which objects are the "new" ones. Let's take a look at how this might be useful. <?php $cars = Car::GetAll(); $car = new Car(); $car->save(); $cars[] = $car; foreach($cars as $car) { if($car->isNew) { // do something special to the objects we created above even if we saved them since then } } isUpdated This one is pretty simple. This let's us know something that was already in the data store, has been updated by us since initialization. isPhantom Let's us know if we need to Update or Insert this model when saving the object. If Insert this gets set to false right after. Implementation Details Let's table isDirty for now and come back to it. For now let's take a look at some code. Here we do a pretty basic boiler plate for the variables we want and how they are manipulated later on. __construct() <?php public function __construct(..., $isDirty = false, $isPhantom = null /* you can implement these differently but the hydrator needs some way to set these for an instantiated object */) { $this->_isPhantom = false; // this should be set by your model hydrator at time of hydration $this->_isDirty = $this->_isPhantom || $isDirty; $this->_isNew = false; $this->_isUpdated = false; } save() public function save() { if ($this->isDirty) { // create new or update existing if ($this->_isPhantom) { // do insert $this->_isPhantom = false; $this->_isNew = true; } else { // do update $this->_isUpdated = true; } $this->_isDirty = false; // only if you don't use a function to detect this } } So here we can see how it all comes together from initialization to storage. But what about isDirty? What's so complex about it? Well let's take a look. isDirty There's multiple ways to implement isDirty and both have positive aspects as well as drawbacks. If your ORM uses direct PHP object properties that map to fields only one is open to you anyway. Let's take a look at what I mean. If you use an ORM where the fields are not object properties and are in-fact "not real" that means that you can actually implement this as a simple boolean. For example: <?php public function __construct(...) { $this->_isDirty = false; } public function __set($field,$value) { $this->_isDirty = true; ... } public function save() { ... $this->_isDirty = false; } The best thing about this method is how light is it on the run time. You simple need one boolean worth of memory space for each object. Unfortunately this method also can't tell when the field was set back to it's original value or if a field was edited but the value remained the same as it was before. So while you may save some memory up front in your run time you might end up wasting a lot more memory resources in your database updating records that have no new data or simply slowing down batch processes sending writes to the database that it will end up wasting time. Furthermore this only works with dynamically allocated "magic" properties. Your other option is to use a method to test each field for a change and return true or false. Okay but how? By keeping a copy of the "original" field values of course. And this is where this method starts to show it's down sides. You actually end up approximately doubling the amount of memory you need to make this happen. Plus that itself has complexity. For example do you change your original variables after a save? Unfortunately the answer is yes. Simple because you want isDirty to go back to false after running a save. Some things are free though. Any object that is a phantom is dirty by definition. public function isDirty() { if ($this->isPhantom) { return true; } $fields = static::getFields(); foreach ($fields as $field) { if ($this->isFieldDirty($field)) { return true; } } return false; } public function isFieldDirty($field) { if (isset($this->_originalValues[$field])) { if ($this->_originalValues[$field] !== $this->$field) { return true; } else { return false; } } return false; } Of course you'll need to set_originalValues in your object during hydration. New objects won't start tracking this until immediately after save. It's worth noting that Laravel's Eloquent implements isDirty in a very similar way. Closing Thoughts Most ORMs implement these one way or another out of necessity however it would be nice if ORMS could standardize on these and perhaps start using the same terminology surrounding them. Is dirty is optional for many ORMs when it's beneficial to force a save() even if nothing has been changed simply to updated the modified at timestamp for the record in the data store. Still a well designed ORM should let you do both depending on your needs. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Archives September 2024 August 2024 July 2024 October 2023 September 2023 July 2023 June 2023 October 2022 June 2022 May 2022 March 2021 February 2021 October 2020 September 2020 August 2020 June 2020 May 2020 March 2020 September 2019 April 2019 February 2019 November 2018 April 2018