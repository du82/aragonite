t using an oauth token for a weekend is reason enough to invalidate it. Google Chat forgets your login on Android at random One day when I tried to use it on my phone I got one of these. I tried resetting the cache. I tried reinstalling the app. None of this worked. Eventually what did work was removing my work "G Suites" account from my Android phone entirely and then adding it back. So I guess I have to resync my cache of emails again. Google Chat won't let you copy an image This is what you see when you right click on an image. I regularly go around this by taking a screen shot. Presumably some shmuck at Google thought they were being security conscious. Apparently for this person screenshots don't exist. Google Chat lets you download files by opening them in your default browser So when I finally do need to actually download a file because I need to preserve meta data or it's not a normal image... say a PSD or a spreadsheet. There's a download link. Of course it goes to your default browser where I'm not logged in to this G Suite account. Off to copy/paste land I go. But wait you say. Why don't you just copy/paste the link itself? nope. Google Chat's emoticons are basic Okay, this one is a little tongue in cheek but hey if Discord has this so should Google Chat! Do yourselves a favor Google and allow animated GIF emoticons and you'll be on even ground with Slack. Frankly speaking Google Chat / Hangouts for G Suites is a mess that can only be realistically called a public beta and no one serious should be using it as their primary business communication tool. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Archives September 2024 August 2024 July 2024 October 2023 September 2023 July 2023 June 2023 October 2022 June 2022 May 2022 March 2021 February 2021 October 2020 September 2020 August 2020 June 2020 May 2020 March 2020 September 2019 April 2019 February 2019 November 2018 April 2018 March 2018 Subscribe Atom RSS Feed'''
