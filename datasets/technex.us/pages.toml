full_description = "From the Terminal Cajun Style Fried Rice March 21, 2021 by Henry food recipe cooking In a dutch oven Garlic - 2 cloves, diced Butter - 2 tbs Chicken / Beef stock - Whole 28 oz Carton Carrots - Half a cup, diced Red Pepper - 1 tbs Cajun style mix - 4 tbs Whole dried red peppers - 2-3 Medium grain rice - 2 cups Throw butter into the dutch oven with the garlic and spices on high, add stock, whisk, add carrots, whisk. Once the mixture is steaming add the rice. Whisk again. Wait for boil then lower heat to a simmer and cover. Mix every 5 minutes until liquid is fully absorbed by the rice. No more than 15-20 minutes. Serve with lime wedges to squeeze over the rice. Fresh cilantro is also a great garnish. Pair with any protein. Compiling and Installing RocketRaid RR64xL drivers on Linux 5.x March 15, 2021 by Henry linux rocketraid raid kernel wget https://raw.githubusercontent.com/dsiggi/RocketRAID/master/sys-block/rr64xl/files/rr64xl-kernel-5.patch wget http://www.highpoint-tech.com/BIOS_Driver/RR64xL/Linux/RR64xl_Linux_Src_v1.4.0_16_09_20.tar.gz tar xf RR64xl_Linux_Src_v1.4.0_16_09_20.tar.gz patch < rr64xl-kernel-5.patch cd rr64xl-linux-src-v1.4.0/product/rr64xl/linux/ sudo make KERNELDIR=/usr/src/linux About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge disco