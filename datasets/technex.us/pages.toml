full_description = "From the Terminal Age of Empires II: Definitive Edition on Linux May 17, 2020 by Henry linux gaming steam proton dxvk wine aoe2 Get the Linux version of Steam and enable this in settings This will unlock the ability to download and install any title even if they are Windows only titles. Now you'll be able to enable a custom compatibility tool in the settings for the game. I've been playing the game with Proton 5.8-GE-2-MF which you can get at https://github.com/GloriousEggroll/proton-ge-custom. You will also need to delete these files to avoid lockups from playing wmv files in-game. Otherwise the game runs flawlessly. rm -rf ~/.steam/steam/steamapps/common/AoE2DE/resources/_common/movies rm -rf ~/.steam/steam/steamapps/common/AoE2DE/resources/en/campaign/movies If you are having issues make sure you have the most recent version of DXVK, Proton, Wine and your video card's driver. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat 