full_description = "From the Terminal Gyudon (Japanese Beef Rice Bowl) 牛丼 October 11, 2022 by Henry cooking food recipe Gyudon Sauce for 1/2 lb of rib eye ½ cup dashi (Japanese soup stock) - if using Handashi (dry dashi), stir 1/4 tsp in 1/2 cup of hot water 1 Tbsp sugar (adjust according to your preference) 2 Tbsp sake (substitute with dry sherry or Chinese rice wine; for a non-alcoholic version, use water) 2 Tbsp mirin (substitute with 2 Tbsp sake/water + 2 tsp sugar) 3 Tbsp soy sauce Gyudon 1/2 lb of ribeye thinly sliced A white onion approx 2.5 to 3 inches in diameter, cut thinly into half circles Japanese style white rice Raw egg Optional Garnishes Seseme seeds Green onion Grated garlic Pickled ginger Red pepper Instructions Prepare the gyudon sauce by mixing all the ingrediants listed. Put the gyudon sauce into a pan with a lid and allow it to heat up enough that it has started to show a mist from evaporation. Place the onion into the sauce and spread around to allow most of the onion to be touching the pan. Cover with lid and let cook until the onions are soft. Stir a few times. Add the meat by laying out each slice and flipping after a minute or so. Stack to the side as it becomes ready and add more. When all the meat is done stir. Prepare the bowls by heating them up in the oven at 200 as an optional step. Lay the rice into the bowl with a dip in the center. Lay out the meat and onions over the rice to the outside of the dip. Pop a raw egg over the dip. Add green onion, red pepper, sesame seeds, and grated garlic to taste. Serve quickly & stir quickly so the raw egg is cooked by the rice. Cajun Style Fried Rice March 21, 2021 by Henry food recipe cooking In a dutch oven Garlic - 2 cloves, diced Butter - 2 tbs Chicken / Beef stock - Whole 28 oz Carton Carrots - Half a cup, diced Red Pepper - 1 tbs Cajun style mix - 4 tbs Whole dried red peppers - 2-3 Medium grain rice - 2 cups Throw butter into the dutch oven with the garlic and spices on high, add stock, whisk, add carrots, whisk. Once the mixture is steaming add the rice. Whisk again. Wait for boil then lower heat to a simmer and cover. Mix every 5 minutes until liquid is fully absorbed by the rice. No more than 15-20 minutes. Serve with lime wedges to squeeze over the rice. Fresh cilantro is also a great garnish. Pair with any protein. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Archives September 2024 August 2024 July 2024 October 2023 September 2023 July 2023 June 2023 October 2022 June 2022 May 2022 March 2021 February 2021 October 2020 September 2020 August 2020 June 2020 May 2020 March 2020 September 2019 April 2019 February 2019 November 2018 April 2018 March 2018 Subscribe Atom RSS Feed"
