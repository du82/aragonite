["https://technex.us/2021/02/installing-xdebug-on-anything-for-vscode-in-5-minutes-xdebug-3"]
title = "Installing XDebug on anything for VSCode in 5 minutes (XDebug 3.x) | Tech Nexus"
description = """
This guide is for XDebug 3.x only.
 For XDebug 2.x clear here.
 &nbsp;
 I see a lot of over complicated guides on XDebug so I'll simplify things real quick for everyone.
 Visual Studio Code has debugging support out of the box. Click on the Debug icon in"""
full_description = '''From the Terminal Installing XDebug on anything for VSCode in 5 minutes (XDebug 3.x) February 25, 2021 by Henry php phpunit xdebug tdd unit testing vscode This guide is for XDebug 3.x only. For XDebug 2.x clear here. I see a lot of over complicated guides on XDebug so I'll simplify things real quick for everyone. Visual Studio Code has debugging support out of the box. Click on the Debug icon in the left bar (OS X: ⇧⌘D, Windows / Linux: CTRL+SHIFT+D) then click on the cog icon which should open your launch.json file or create one if none exists. You must have the PHP XDebug extension installed of course. Now add this to your launch.json file you have open: { "type": "php", "request": "launch", "name": "Listen For XDebug", "port": 9003, "pathMappings": { "/var/www/": "${workspaceRoot}" }, "xdebugSettings": { "max_children": 256, "max_data": -1, "max_depth": 5 }, "ignore": [ "**/vendor/**/*.php" ] } Make sure you change /var/www/ to where your code is on your local server. Set this in your php.ini [xdebug] xdebug.mode = debug xdebug.start_with_request = yes xdebug.idekey = VSCODE xdebug.client_port = 9003 xdebug.client_host = "127.0.0.1" xdebug.discover_client_host = 1 xdebug.log="/tmp/xdebug.log" xdebug.cli_color = 1 You might need to do it twice. Once for CLI and once for PHP-FPM! Typical locations for your php.ini file: Linux: /etc/php/{$version}/php.ini macOS (Homebrew): /usr/local/etc/php/{$version}/php.ini Don't forget to restart php-fpm! Now start the debugger by hitting the green play button. About I was playing with HTML, CSS, and JavaScript when IE6 was cutting edge browser technology. Since then I've learned a thing or two. Most of the things I write about here are really just references for myself and ways of collecting my thoughts on a topic. I do, however, hope what you find here is useful to you. Source Code This Website Divergence Framework NodeJS Slack Bot Topics linux php phpunit unit testing bash terminal gentoo kde osx ssh xdebug firefox linux desktop openssh code coverage best practice continuous integration gaming portage dependency resolution tdd vscode customization chromium hawaii vpn networking food recipe cooking nginx daemon google google chat oauth login bloat security chat mouse steam proton dxvk wine aoe2 emerge discord philosophy composer activerecord orm macos hotkeys shortcuts gtk+ gnome desktop environments maui turtle sftp filesharing network shares chroot sshd_config ebuild cloudflare warp internet routing wireguard ipv6 ipv4 dns 1.1.1.1 wgcf japan rocketraid raid kernel slack bug spotify dbus v4l2 capture devices video obs vrchat rtmp streaming music xdg chrome custom icon php8 docker containers openvpn mysql mariadb postgresql port forwarding openrc Elsewhere GitHub LinkedIn Twitter Archives September 2024 August 2024 July 2024 October 2023 September 2023 July 2023 June 2023 October 2022 June 2022 May 2022 March 2021 February 2021 October 2020 September 2020 August 2020 June 2020 May 2020 March 2020 September 2019 April 2019 February 2019 November 2018 April 2018 March 2018 Subscribe Atom RSS Feed'''
