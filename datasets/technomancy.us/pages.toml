full_description = "Don't let's get too excited now. This is just a first draft: something Qerub and I cooked up. It doesn't do everything. But for those of you working in Rails, if you're tired of penciling out your diagrams... tired of creating new ones when you change the name of a field... Try this instead: Poof, you've got your funny little diagram.png. Or if you'd rather, pass it FILENAME=diagram.svg if you'd like something scalable. It's all good. I should have a Rubyforge page up soon, but 'till then be nice to my poor server and DSL line. BTW, this requires graphviz to run properly. More details are in the README. Mad props to Qerub for doing most of the coding; I've mostly just been cheerleading, packaging, and documenting."
