["https://technomancy.us/108"]
title = "in which a number of tools factor - Technomancy"
full_description = "Today's post is going to consist of a roundup of a bunch of small tools that may not deserve their own post but are still quite useful in their own way with a short bonus round at the end for a micro-project I cooked up yesterday. Perhaps I'll throw in a preview of another in-progress project if I don't forget by the time I'm done writing this post. To start with: any self-respecting prog'er needs to bind keystrokes to execute commands. [1] The truly hardcore can simply bind keys within Emacs with the global-set-key function and leave it at that. The rest of us, however, must venture outside the warm embrace of Emacs from time to time and would understandably be irked to find our carefully-bound key strokes void of bindings. Are we then doomed to set up bindings in our window managers that will not outlast our committment to that WM? Are we not to know the peace of mind that comes with storing all such settings in text files under revision control? The answer to the above questions will already be guessed by the astute reader as 'no'. The solution to the problem raised above is xbindkeys, a small yet indispensable utility for binding keystrokes to commands. As a small bonus it embeds the GNU Guile Scheme interpreter, so configuration may be written in that most blissful of formats, the S-expression. Something else I use every day but don't interact with much directly is mpd, the Music Player Dæmon. Music players traditionally fall into either the multi-window playlist-management style popularized by Winamp and XMMS or the Soundjam-inspired full-library style. mpd takes a third approach: it deals only with the cataloging and playing of music, leaving the user-interface up to a number of third-party clients. This makes it trivial to remotely control your music without resorting to hacks like VNC or X-forwarding. There are your regular Ryhthmbox-style GTK GUIs to it, but Web frontends and the mpc command-line client are both quite easy to set up and use. It's also trivial to tie mpc into other tools as mentioned below."
author = "Phil Hagelberg"
