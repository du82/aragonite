["https://technomancy.us/197"]
title = "in which five different paths lead to methods - Technomancy"
full_description = '''I recently made a change in a codebase I've been working on which illustrated an interesting trade-off around modeling in software. The project was Taverner, an IRC server written in Fennel. In particular it had to do with the way that channels were modeled. A channel is basically a "chat room"; it's just something that users can join which lets you send messages to anyone else who's also in the channel. In many languages you would define a Channel class which has a bunch of methods like join, part, send, etc. Fennel doesn't have classes, but there are a few different alternatives available1. The most obvious approach is to have a channel module which just exports the functions that would have been methods along with a constructor function: There's nothing particularly clever going on here, which I believe is a big strength. Everything is obvious. The make-channel function acts as a constructor, while every other function in the module takes a channel as its first argument, so you can write code like (channel.join ch client.nick client.conn) where ch is a channel table you got from calling the constructor. The biggest downside here is that it lacks encapsulation. All the data for a channel is exposed in the table that gets passed around to other modules, and it isn't clear which fields are safe to use and which are implementation details which might change later on. In a small codebase maybe this is no problem, but as it grows and changes over time, it will make it more difficult to know what effect a given change might have in a different part of the codebase. There's an old saying that "closures are a poor man's objects" and "objects are a poor man's closures". Keeping internal data private by exporting functions whose scope closes over the internal data is one of the oldest tricks in the book: Now the module only exports one thing: make-channel function, which returns a table that you can think of as if it were an instance of a Channel class. It has functions inside the table which act like methods would. This makes the interface of the channel very clear and well-defined. If you want to do anything with a channel, you have to use one of the functions in the channel table. You can change anything about the internals, and as long as you update everything in the make-channel function, you know you won't break something elsewhere. In a word, it's encapsulated.'''
author = "Phil Hagelberg"
year_published = 2022
year_updated = 2022
clearnet = "https://technomancy.us/197"
