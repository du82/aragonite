["https://technomancy.us/124"]
title = "in which codes are peeped at, in clojure - Technomancy"
full_description = "I'm very proud to announce the release of my latest project, Functional Programming with Clojure, a PeepCode screencast created with Geoffrey Grosenbach. We were lucky to have Rich Hickey, the creator of Clojure do the technical review. I've blogged about Clojure before. It's becoming clear that with the way multi-core systems are becoming the norm, functional programming provides tools to handle concurrency in a straightforward way. Languages like Haskell and Erlang are experiencing surges in popularity, but Clojure brings some great new tricks of its own to the table. Part of this is its heritage as part of the Lisp family of languages, part of it is being built on a really solid virtual machine, and part of it is Rich's ingenuity that shines in its design. If you've been wanting to dive into Clojure, this is a great way to get started quickly. The screencast steps through the development of Mire, a multiplayer text adventure. I found this to be an fitting project to showcase Clojure's strengths since it involves concurrent processing while still requiring state to be shared between threads, and it's simple enough to cover in an hour."
