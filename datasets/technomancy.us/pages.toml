["https://technomancy.us/202"]
title = "in which things once suspended are resumed - Technomancy"
full_description = '''One common question I get about coding in Fennel is about how to effectively use coroutines. Fennel runs on the Lua runtime, and Lua is famous for having very few features, but having carefully selected just the right features to include, and coroutines are one of those features that give a remarkable bang for their buck. But because most languages don't have them, they're often seen as an advanced or confusing feature, but they're not difficult, just different. Once you get a grasp on them, they provide a great deal of flexibility and in many cases mitigate the problem of not having OS threads on the Lua runtime. This is a written version of the talk I gave at FennelConf 2024. If you prefer video to reading, give that a watch; it's about 20 minutes long. Lua calls them "threads" which is confusing, but they're not OS threads. Coroutines are a form of cooperative multitasking while OS threads are a form of preemptive multitasking. That means that there's a scheduler which decides when to run or pause an OS thread. With coroutines, it's up to you to schedule and pause them. Despite some similarity to OS threads, you really don't use them in the same way, so I'd hesitate to lean on that analogy too hard. In the trivial case, it behaves like a function. However, if it were a function, we could call it again, but: That's because each coroutine represents a single run of a function. So far it just sounds worse; a function you can only call once. Great. In order for it to be interesting, we need a function that yields: Yielding is like returning, but resuming starts you back where you were. That's it! That's the whole thing. You now understand coroutines; thanks for reading! Just kidding; there is one more thing. You can pass values into the coroutine when resuming, and they will be returned by the call to coroutine.yield. To show this, let's make a recursive function that uses that return value: You'll notice the function never actually needs to return. It can loop forever and that's fine as long as it yields.'''
author = "Phil Hagelberg"
year_published = 2024
