["https://technomancy.us/126"]
title = "in which are found tricks of the trade concerning clojure authorship - Technomancy"
full_description = '''So it turns out getting set up to write Clojure code can be a little tricky. There are a lot of disconnected tidbits about how folks have figured out how to configure things, but it can be a bit tricky to tell the difference between, "hey, this is how I finally got it to work" and "this is how you really should be doing it". I figure I know about as much about using Clojure with Emacs as anybody, so here's a run-through of how I've done my setup. There are a lot of moving parts, but bear with me; most of the installation is automated. The easiest way to get started is to grab ELPA. If you use Emacs Starter Kit you've already got ELPA. (If you're new to Emacs, you might want to use the Starter Kit anyway as a base for your own customizations; also check out the PeepCode screencast.) Use M-x package-list-packages to pull up the package list. Move down to clojure-mode and press i to mark it for installation, then press x to go. Once it's installed you should be able to work with .clj files, and you may be happy with just this. It has rudimentary subprocess support with M-x run-lisp, which is good enough for many, including Rich Hickey, the creator of Clojure. But most of us find it much more convenient to interact more richly with a running Clojure process as we code. Pressing M-x clojure-install will kick off the Clojure installation process. Once you choose a download location, it will download a number of repositories and compile Clojure itself, so it will take a few minutes. (It requires having git, Java 1.5+, and ant installed.) When it's done, it will configure SLIME and swank-clojure, and it will give you instructions on a few lines to add to your personal config (usually found in $HOME/.emacs.d/init.el) so it will work for future sessions. Deprecated in favour of similar functionality in swank-clojure. Hitting M-x slime will launch a new Clojure session in a *slime-repl* buffer. You can also interact with the *inferior-lisp* buffer, but the slime-repl buffer provides a higher-level interface with a few extra niceties. The REPL works as you'd expect, but you can hit , to activate some shortcuts, the most useful being i to change the current namespace (with tab-completion) and restart.'''
