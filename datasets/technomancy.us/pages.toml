["https://technomancy.us/117"]
title = "in which the rubyconf attended is the eighth - Technomancy"
full_description = '''I'm back in Seattle after an excellent RubyConf in Orlando, FL. These events are always a treat, and this year's was no exception. Last year the dominant theme was alternate implementations, and this time around it has become an ingrained assumption rather than something that needed to be stated. Distributed version control has also graduated to something that can practically be taken for granted—at least half the slide sets referenced github repositories. But the big theme for the year was concurrency. A number of talks were given on the topic of going distributed, map/reduce-type strategies, how to deal with threads/fibers, etc. Particularly interesting was Dave Thomas's keynote. To encourage new developments, he said, we should spin off forks of the language (not necessarily the implementation) where incompatible changes can be experimented with freely without worrying about cluttering up mainline Ruby. Parallelism and reducing the number of built-in (and hence inextensible) mechanisms were the main directions he suggested. I like the idea, but such a project would be able to attract more contributors if it were based on Rubinius instead of MRI or YARV, so it may be best to wait until that's closer to completion. The talk on NeverBlock was also very interesting; they seem to have a way to harness the benefits of an event-driven approach without the twisty execution flow logic that regular EventMachine requires. My personal favourite talk was John Barnette and Aaron Patterson's talk on Johnson, the Ruby/Javascript bridge. They turned the hilarity gauge way up, but the actual code is extremely impressive. Being able to hop between languages like Johnson allows could have some interesting implications that no one has yet thought of. As I mentioned earlier, the Seattle Ruby Group presented a bunch of our projects near the end of the conference. I got to introduce Bus Scheme in ten minutes, so it was a very cursory look. Aaron performed a "historical re-enactment" of the group's history that had to be seen to be appreciated.'''
