["https://technomancy.us/113"]
title = "in which another mode of collaboration is set forth - Technomancy"
full_description = "When Giles tagged me with one of these blog memes that's been going around, I couldn't bring myself to continue its progression since I generally don't find them all that interesting—it takes a remarkable writer to make a good post out of one, but a remarkable writer probably could have found something interesting to write about without the meme, while with a less-than-remarkable writer I'd find a the regular fare (usually a post about code) more interesting than a biographical sketch. However, one question in the bunch did stand out to me: what's the most fun you've had programming? In May of 2006, I wrote a collaborative editing client for Emacs called Ebby in three days. This was my first nontrivial lisp program, and it was really a rush to dive into the language/environment and come up with something useful so quickly. Ebby was actually a client for the existing Obby protocol which happened to have no documentation at the time, so I spent a lot of time in ettercap analyzing traffic in between banging out lisp functions. While I had loads of fun working on Ebby, one vital feature kept eluding me. Since I was the only one using Ebby at that point, I was never able to trigger conflicting edits. Because of this I never saw the complicated mechanisms in the Obby protocol for dealing with conflicts. Later someone from the Obby team explained it to me, and I started implementing it. But it greatly complicated the code since much more state had to be kept client-side so that conflicting changes could be rolled back and reapplied on top of the new edits received from the server. While I was working on this, the Obby team announced they were eventually going to move to an XMPP-based protocol that would share virtually no code with the existing implementation, so I dropped my efforts to fix Ebby. It still worked quite well with version 0.3 as long as you were on a low-latency connection, since that kept the likelihood of conflicts low. Fast-forward to September or so of last year. I was just learning about git and how its rebase operation works. I got the strangest feeling of déjavu about this until I realized it was the same rollback-and-reapply operation that I had tried to add to Ebby. I knew at some point I would want to revisit Ebby, so I filed this little tidbit away."
author = "Phil Hagelberg"
year_published = 2008
