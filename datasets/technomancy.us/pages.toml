["https://technomancy.us/1"]
title = "new blog - Technomancy"
full_description = "This is my new blog. I've decided I should split up by blog into a personal life-related blog and a more technical blog. I have tried before to separate tech stuff from my normal blog, but it was never much of a success. Anyway, this is where I post crazy tech stuff I'm thinking about—hence the term Technomancy. First thought: Lisp. It's awesome. It's mind-blowing. And there's a really good book on it available for free. I'm using CLisp to write the server this blog is running on, with help from code by Ron Garret. You can see the code on my Trac."
