["https://technomancy.us/105"]
title = "in which the benefits of contribution are discussed - Technomancy"
full_description = "Update, 2024: Nearly everything in this post is wrong and/or misguided, but I've left it up for ... I dunno; historical reasons? Give up Github already. Sourcehut is great. Codeberg is great. Gitlab is not very good, but at least it's not Github. You can do this. Well, it seems now that everyone is blogging about Github. I was originally a bit reluctant to come forth singing its praises since it's clearly not free software... I didn't want to convince my friends to do the work of moving their projects over to this new still-in-private-beta site when there was really no guarantee that the system would continue to be appropriate for them in the future. A number of things have since caused my concerns to abate: Firstly, Chris and Tom are fairly high-profile in the Ruby community. They've got a reputation to maintain, so I think they'll do all they can to make their service work well. Since Chris does consulting work, having a reputation for delivering awesome software is great for business. But even in a worst case scenario where GitHub somehow became no longer appropriate for the projects I work on, the extremely distributed nature of Git makes it so there is very little lock-in compared to other services. With most free email services it's a huge hassle to move to another provider. Even with a relatively open service like Flickr, it would still be a lot of work to move your data off to another provider. But with Git, all that amounts to naught. The whole point of Git is that it allows anyone to come along, run git clone, and easily create a complete copy of your repository and its history. But right now all this is a moot point: they have announced that GitHub will remain gratis for Free Software projects within a reasonable size. This is great news and makes me feel much better about promoting the service. So what's so great about GitHub? Well as you may have read elsewhere, Git is a very powerful piece of version control software that enables a much wider variety of workflow than traditional systems. The biggest legitimate complaint that's been levelled against it is that it can be a bit difficult to learn. While GitHub doesn't alleviate this entirely, it definitely makes the distributed concepts easier to pick up."
author = "Phil Hagelberg"
year_published = 2008
