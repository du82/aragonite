["https://technomancy.us/141"]
title = "in which public speaking is foreshadowed - Technomancy"
full_description = '''I was invited to speak at this year's Conj, the first Clojure conference. My talk is titled "Making Leiningen Work for You": I'll be speaking on lesser-known new features, plugin development, and the things that make Leiningen the most-contributed-to Clojure project. As a little teaser about plugin development using Robert Hooke, here's a plugin I wrote yesterday. This test passes because stubbed? gets replaced with (constantly true) at test time. The idea is that functions which may rely on external services can easily be replaced with stubs that return hard-coded data in order to make your tests run faster and more reliably. Of course, you should couple this with an set of integration tests that use the original definitions; for this purpose, there's a :stubbs/original entry added to the var's metadata containing the original value of the function that's been replaced. The plugin uses Robert Hooke's add-hook to modify the behaviour of Leiningen's built-in eval-in-project function. All code that runs in your project goes through this function. Inside your project's code, it wraps clojure.test/run-tests in order to search for all vars that have :stub metadata and call alter-var-root on them to stub out their behaviour. It's a little more awkward than most Robert Hooke usage since there's a lot of use of auto-gensym and quote-unquoting involved in order to work around the fact that the code is constructed in a Leiningen plugin but intended to run inside your project's process, but it's a good testament to the flexibility that metadata and hooks offer.'''
