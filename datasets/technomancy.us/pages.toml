["https://technomancy.us/47"]
title = "18 hours of rails + 6 hours of sleep = 24 hours of awesome - Technomancy"
full_description = "I got to team up with Cristi Balan and Ferdinand Svehla, from Romania and Austria, respectively. I had originally intended to go with a local team, but the three of us worked out really well as a team—evilchelu's Javascript hacks were very impressive, and fullmoon's troubleshooting saved us a lot of time. The huge timezone differences made things awkward in certain parts of the day, but both my teammates surprised me with their incredible capacity for staying up far longer than is healthy. In case you're not familiar, the concept of Railsday is that you gather a team together of up to three people, and you build a web application in 24 hours using Ruby on Rails. Today was the second ever Rails Day, and there were a huge number of participants. Unfortunately we came very close to finishing, but didn't quite get in the last feature. The organizer can see all the times people have specified for the meeting, but he cannot decide on one of them and have the attendees notified. Even though it was a bit disappointing to not be able to finish, it was great fun to participate, and we all got some great experience. Update: The app is up and running at at http://concourse.technomancy.us, It's been improved significantly since the contest."
