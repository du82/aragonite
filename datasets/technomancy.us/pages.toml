["https://technomancy.us/130"]
title = "in which things are mapped, but also reduced - Technomancy"
full_description = '''A while ago Tim Bray had a project called the Wide Finder to collect implementations of a log parsing problem in different languages to see which ones made it easy to take advantage of massively-parallel hardware. The idea is to accept a web server log file and return statistics for which pages have been requested the most. Yesterday he posted a follow-up in Clojure using refs. While his version is interesting for someone just getting into the language because it uses refs (probably the shiniest piece of the language), I think a map/reduce approach is a little more idiomatic since it can be done with no explicit state change. I'll step through my implementation piece-by-piece. Note that it is naïve and could be optimized for speed at the expense of straightfowardness, especially with regard to reading from disk; my intent here is simply to explain the functional approach. Update: Commenters have posted a version that totally smokes my agent-based implementation in terms of performance and simplicity. I'm leaving mine up because I think it's a fun romp in the land of higher-order functions; if you think having higher-order functions means "I can pass a block to Array#map in Ruby" then you're in for a treat. If you are looking for a hard-core walkthrough of high-performance coding, your best bet is Alex Osborne's blog post on Wide Finder. Every Clojure file opens with a call to the ns macro. This defines a namespace (wide.finder) and states any dependencies it may have on other namespaces, in this case the reader function from the clojure.java.io namespace. Omitting the :only clause would cause it to make all the io vars available in this namespace, but it's usually better to be explicit about what you need. We'll start with the entry point. The find-widely function below takes a filename and a number of agents to work with. Agents can be thought of as independent asynchronous workers that share a thread pool and keep a single state value. They are initialized with the agent function that takes a starting state. We'll be using each agent to keep a map of pages to hit counts, so we map this function over a list of n empty maps generated by repeat to get our list of initialized agents.'''
author = "Phil Hagelberg"
year_published = 2009
year_updated = 2009
clearnet = "https://technomancy.us/130"
