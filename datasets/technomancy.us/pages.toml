["https://technomancy.us/104"]
title = "in which you may get started with bus scheme - Technomancy"
full_description = '''So a number of folks have asked me how they should get started with Bus Scheme.[1]. I've mostly just said silly things like, "Umm... good question. Maybe read/watch SICP?", which is silly because it doesn't have much to do with the Bus part of Bus Scheme, not because The Structure and Interpretation of Computer Programs is silly. There's a poster in my favourite bookstore that has Dante's Comedy, the Iliad, and a few other classics captioned with something like "Might as well start them now; you're going to have to read them eventually anyway." I hold the same notion regarding SICP and perhaps The Little Schemer, but I could see how it'd be helpful to have an introduction to Scheme from a Rubyist's perspective since reading a book like that can be large-ish mental investment. Scheme is a programming language directly descended from Lisp. It's most often compared to Common Lisp, which is in some senses its big brother. Scheme is usually considered less "kitchen-sink"-ish than Common Lisp in that it only defines an extremely clean small core language and allows developers to extend it seamlessly to do what they need. In the words of the creators of Scheme: (As a potential student of Scheme, you should be encouraged by this notion as it directly translates into fewer concepts to learn.) Ruby draws a lot of its heritage from Scheme, though Matz does not share the idea that a language should be limited to a very small number of core axioms from which everything else can be defined. [2] Destructive method names ending in "!" and predicates ending in "?" were inspired by Scheme. Matz himself has even lightheartedly referred to Ruby as "MatzLisp". So this is a language that at the core should not feel too foreign to a Rubyist, even if the syntax looks quite different. Let's dive in. sudo gem install bus-scheme if you haven't got it installed. Go ahead and launch Bus Scheme with the bus executable. Like irb, it drops you into a REPL, or Read-Eval-Print Loop. Scheme programs are made up of expressions. When you enter expressions into the REPL, they get evaluated and their value is shown. There are only a few simple rules for how expressions get evaluated that we'll address below. Feel free to experiment with entering expressions and seeing what gets returned.'''
