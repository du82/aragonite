title = "fancy ultra fresh - Technomancy"
full_description = "While it's a bit of a shame that Ubuntu doesn't support read-write access to NTFS (Windows filesystem), it's kind of cool that I could run Ubuntu for almost a year now without knowing that. This series of articles on the Amazon patent problems is quite challenging. Obviously the one-click patent is bad for everyone and not even helpful at all to Amazon. (Barnes and Noble simply had to add in a second click to their shopping process. The only losers are the customers.) But this whole defensive business makes sense. The environment is so hostile that hoarding is practically necessary if you are a big player. It's sad, but it might just be an indication of how fundamentally broken the system is. My friend (anonymous to protect him) and I broke the law several times today. We discussed things which were illegal to discuss. It's a good thing legality is not morality, or we'd all be screwed."
