["https://technomancy.us/195"]
title = "in which a laptop defies the trends - Technomancy"
full_description = "Over the years I've been a consistent[1] user of Thinkpads; early on because I liked the keyboards, but then later just because I wanted hardware that would last a long time rather than a machine with a soldered-in battery that's designed to be more disposable. My most recent device was a Thinkpad X301 built in 2008 which I started using in 2016. While it's no speed demon, using Firefox with uBlock Origin configured to block 3rd-party scripts by default left it feeling quite usable for my purposes, and the physical design of the device was perfect. They used a rubberized coating for the chassis in the X301 that I haven't seen in any other model that feels really nice on the palm rest. Unfortunately while nearly every component of that machine has withstood the test of time, the battery has not. The original battery's charge is down to around 90 minutes, and while it's swappable, working new batteries in this form factor simply cannot be purchased for any amount of money. I bought from two separate vendors claiming to have original batteries, but both of them sold me a battery which ballooned up and became unusable after a month or two. When I started to look for replacements I was dismayed. So many of the newer models had fallen into the Appleization trap—everything must be made as thin and as glossy as possible at the expense of every other concern. I don't want a thin laptop! I want a laptop where I can look at it and see what's displayed on the screen instead of my own face staring back at me. It seemed it was still possible to find a model with a replaceable battery, but even this basic feature was becoming increasingly rare. A couple years ago I became aware of the MNT Reform laptop, and it seems like the perfect antidote to the mistakes the entire industry seems dead-set on repeating. It's a laptop that's focused on open design with schematics freely available and all parts easily serviceable by the end user. Finding this was like a breath of fresh air; it's like someone was finally listening to my frustrations."
author = "Phil Hagelberg"
