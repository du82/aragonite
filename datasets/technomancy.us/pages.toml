["https://technomancy.us/129"]
title = "in which the effects of distance are reduced - Technomancy"
full_description = "Since joining Sonian in April, I've been part of a distributed team that has grown to four Clojure programmers all living in different states of the US. While it's been great to be able to draw from a wide pool of talent, working with a distributed team has its challenges. While we had everyone in Seattle for a week we got to do lot of pair programming, but after everyone went back home we were left wondering how we could emulate that over-the-shoulder atmosphere without all being physically in one place. We tried VNC, but it was simply too laggy. Then we tried shared screen sessions. This worked out pretty well. The defining characteristic here is that both participants see exactly the same thing. Only one can edit at a time, which is usually not a big deal when you're pairing. Since it's shared on a per-session basis rather than a per-document basis, it means you can share things like the woefully under-appreciated M-x erevision feature, which is fantastic for code reviews. But it still feels a bit restrictive and out of the regular groove. We also use mobile Internet connections a lot, and unfortunately port forwarding is not permitted by most mobile ISPs. Then I discovered Rudel, an Emacs client for the Obby protocol. Years ago I'd started my own implementation of this called Ebby, but I wasn't aware of the more nuanced implications of the protocol, so my implementation was never very robust. Rudel, on the other hand, does a great job of allowing us to share documents among collaborators in real-time. Now we use Rudel for our main solution and then fall back to screen whenever we want to do something that involves synchronizing the whole screen. While you can run shell or SLIME sessions in Rudel, it's a bit awkward since only the original publisher of the document can actually interact with the subprocess. The other person can enter commands, but they can't run them, since pressing enter will simply insert a newline. I have been playing with the idea of using the Obby chat functionality as a side-channel to perform these kinds of things, but I haven't written any code for it yet."
author = "Phil Hagelberg"
year_published = 2009
