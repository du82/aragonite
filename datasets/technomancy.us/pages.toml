title = "in which a scheme will be expounded upon - Technomancy"
full_description = '''So it turns out the Seattle.rb talk that was proposed half-in-jest got accepted for RubyConf 08. The talk is called "Seattle.rb Rules", and will feature a number of prestigious members discussing their projects that they work on at hack night. I've got about ten minutes to fill up for my part, and according to the proposal I'll be speaking on the following: I'm thinking I may end up talking about something else though. Ideas include "Enough Lisp so that you won't make a Fool of yourself when the Subject comes up at Parties" and "First-class Syntax Modifications: the Final Step Ruby could take to catch up to Lisp". Any other ideas? What would the average Rubyist want to know about Bus Scheme? Leave a comment if you've got something to say. Update: Just finished the talk; went pretty well. The other speakers were awesome as well; be sure to catch it on Confreaks when the video goes up. My slides are available for download. The video is also available.'''
