["https://technomancy.us/137"]
title = "in which is divulged more detail than is generally interesting - Technomancy"
full_description = '''So this post is ridiculously self-indulgent; you've been warned. I've mostly written it out here for my future self to look back on in a mix of amusement and embarassment. It's just a write-up of the tools I use daily in the style of the Q&As at usesthis.com. I use a Thinkpad X200s primarily. It's hard to find a machine that's acceptably light (2.4 lbs/1.1 kg) but still has a decent resolution; most "small" laptops these days have a vertical resolution no greater than my phone, which would be embarrassing for me to use. The Thinkpad has the best keyboard of any laptop; I appreciate the crisp response. It also has an integrated trackpoint, which is nice in that you can move the pointer without taking your hands off the home row, but I try to avoid it as much as possible. I'm much more productive when using 100% keyboard commands. Sometimes I'll just pluck the trackpoint out entirely just to make sure I'm not using it without thinking. I work from coffee shops frequently since I have a remote job, but when I'm in my code lab I use a standing desk with an external 23-inch monitor. I rotate the monitor to portrait orientation when I'm not remote pairing with tmux. I have a recliner next to the desk onto which I fall back to for a couple hours out of the day. While I'm standing I wear what has been affectionately termed "keyboard pants". It's a Kinesis Freestyle with kneepads attached. The kneepads are worn significantly above the knee—the idea is to allow myself to type in as neutral of a position as possible. My arms are relaxed in a downward position, and my wrists are totally straight. It takes some getting used to, but from an RSI perspective it's quite beneficial. It also just feels great not to be sitting all day. I keep a Nexus One phone in my pocket. As far as I know it's the only major phone currently available that's designed to be rootable by the end user, and hence the only phone I am comfortable purchasing. As a nice bonus it also happens to be one of the best phones available, though it seems absurd to call it a phone. I hardly make any actual voice calls on it, though when I do it's VOIP calling through Sipdroid. I have CyanogenMod installed, which has a really nice auto-tether over USB.'''
