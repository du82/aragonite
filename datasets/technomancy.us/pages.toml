["https://technomancy.us/201"]
title = "in which social media can be put in your own hands - Technomancy"
full_description = "I've been on Mastodon since early 2017 and have really enjoyed it. It's been great to see the Fediverse grow as a user-owned network that can function without a corporate overlord calling the shots, exploiting the user base, and ultimately squeezing it to death for monetization. There are plenty of problems that remain, but one of the biggest ones is that new users have to find an instance to sign up on, and this can be tricky. Installing and administering a Mastodon instance is a lot of work. The liberatory function of the network is only as good as peoples' ability to make use of it, which requires running servers. If running a server is hard, fewer people are going to do it, and the power is going to be concentrated in the hands of a technical elite. A healthy network must make it easy to avoid this kind of centralization; to do that we have to look beyond Mastodon. In 2019 I ran my own fediverse server out of my home on Pleroma for about a year; eventually shutting it down for a few different reasons1. Then I started hearing more and more about this new GotoSocial server whose goal was to make it easy to run your own instance, and, well, I liked what I saw! I've been running my own instance since August of 2022 and have made some documentation contributions to the project as well as funding it on OpenCollective. So what's it like to set up your own GotoSocial server? Well, I can walk you thru what I used for my setup. Yours might be different; that's OK! I made these up-front choices to simplify the operational overhead because I didn't want this to be a hassle and I don't need the extra engineering that comes from trying for nine nines of uptime: One huge selling point for GotoSocial over Mastodon for me is that posts on GotoSocial have web permalinks! You can just link to a post and people can open it in their web browser or curl or whatever, provided it is a public post. (The default post visibility is Unlisted, so if you want things to be visible in the browser, you might consider changing this to Public.) In Mastodon, when you send someone a link to a post, they can't read it without loading the entire Mastodon frontend app into their browser, which will is a monster React codebase that will break if they have scripting disabled and also can take up to 30 seconds on older hardware."
