["https://technomancy.us/135"]
title = "in which the maintainers perspective is considered' - Technomancy"
full_description = "In the past few months I've had a number of contributions pour in for some of my projects. It's been really exciting to see this level of community involvement, and I try to do everything I can to encourage users to get involved in development. But I don't have a lot of free time these days—with two small kids I'm lucky to have a few hours a week to address incoming patches, much less work on new features. There are a few things that could streamline the process a bit, so I thought I'd take some time to explain how these projects look from the maintainer's side and the things that contributors could do to make their patches easy to apply. For simple stuff it's great just to get patches out of the blue. For more involved work, however, it's important to communicate so that parallel feature work doesn't interfere. For my projects, there are few enough people working on them that usually mentioning it on the mailing list is plenty. Larger projects will often track in-progress features using a ticket system, so in that case you'll probably want to do both. Then you can fork/checkout the project and get started. The first thing to remember is to keep all your work in topic branches. Most people just commit directly to the master branch, but then it's trickier for them to keep in sync with upstream. Every time you pull in the latest changes it causes a merge commit. This needlessly clutters up the history and makes it difficult for maintainers to find the exact changes they are looking for. It gets worse if there are multiple unrelated features committed directly to master. Even once your changes are merged, it's likely that pulling changes after that point will still result in merge commits rather than fast-forwards simply because the same set of changes were applied in a different order. So keeping your work in a separate branch per feature/fix allows the master history to be kept clean. When it's time for a maintainer to merge your branch, they have a choice to either rebase it on top of the current master and then commit it, maintaining a linear history, or merge it in to master with a single merge commit. The latter is usually done in the case of longer-lived branches where you want to be able to group together a whole series of commits under a single feature. It's a bit silly/noisy to leave a merge commit lying around from merging a branch with only one or two commits."
author = "Phil Hagelberg"
year_published = 2010
