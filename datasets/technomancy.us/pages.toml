["https://technomancy.us/colophon"]
title = "Colophon - Technomancy"
full_description = 'I make weird keyboards and write computer programs—most notably Leiningen, a project automation tool for Clojure developers and Fennel, a small programming language. I am often active (as technomancy) on Libera Chat IRC channels, particularly the #emacs, #fennel, and #clojure channels. I also post my shorter thoughts to my account on Fediverse. If you wish to comment on a post or otherwise contact me, feel free to email me using my given name at this domain. Sensitive data may be encrypted for my PGP key. Posts are typed using the Dvorak keyboard layout into Emacs on a 51nb "Thinkpad Fanfic" X210 (formerly Thinkpads X301, X200s, X61t, and T61p) running Debian GNU/Linux, usually on an Atreus keyboard. They are published via GNU M4, rsync, and a 15-line Makefile. Prose contents of all articles are licensed under a Creative Commons Attribution-ShareAlike 4.0 License unless otherwise specified.'
