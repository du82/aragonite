["https://technomancy.us/109"]
title = "in which light is shed upon some previously unexplored frontiers - Technomancy"
full_description = "So I've been working on modularizing a big project at work. The REST API for this one project needs to be used in multiple places, so I've taken it out of the Rails app and spun it off into its own server using Rack. Rack is a library that abstracts away the gory details of HTTP and gives you a nice object-oriented wrapper for it, allowing you to plug it into multiple different backends. It's great for accelerating development on your simple lightweight services that wouldn't otherwise justify a Merb or Rails application. Ezra gives a good explanation of why you might be interested in Rack. Anyhow, I was able to put this together fairly quickly by hooking up libxml, ActiveRecord, and Rack. (If I were doing it again I'd use faster-builder, which I found out about a few hours after I started the project, but whatever.) But this particular project must be able to support ridiculously large XML responses that could be larger than 4GB. On a 32-bit machine this is... well... problematic. The solution, of course, is to stream the response back to the client as it's generated so it doesn't have to all be in memory at once. Unfortunately the only Ruby support for HTTP streaming I was able to find by searching the web is about streaming static files. I was getting pretty discouraged until Ezra mentioned that Merb bundles a patched version of Rack that allows streaming of programmatic content. I check the streaming with curl; if it's properly streamed the % Received will climb slowly instead of jumping at once to 100: It's not clear to me why this functionality isn't in the standard Rack distribution. Merb seems to be Rack's biggest user, so the fact that they have to bundle their own patched version seemes quite odd. Anyway, if you need HTTP streaming outside Merb, you can use my version of Rack. I haven't been able to get the gem served by Github; unreproducible remote problems in the gem build process are very opaque and give no feedback. Will look into this later. I'm going to try to get the changes into the mainline rack, but if Merb hasn't been able to get it accepted this may not actually happen. The meat of the patch is three lines, but I've got a bunch of other stuff that allows the project to actually build as a gem; the source as I found it was not in a working state. (Who knew there were people out there who haven't yet discovered hoe?)"
