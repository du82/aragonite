["https://techpays.eu"]
title = "Tech Pays in Europe: but how much? You'll find out here. - TechPays Europe"
description = "When no one shares their salary, employers have the upper hand. We can change this. TechPays is changing the compensation asymmetry for Europe."
full_description = 'When no one shares their salary, employers have the upper hand. Know how high you can reasonably go up to during negotiations! Understand how tech salaries are structured in EU countries. Check where your current package is positioned on the local market and which companies offer better options. Read more about the tiered, tri-modal nature of tech compensations. Some people are not comfortable sharing their compensation details publicly. Consider doing an anonymized submission to protect your identity. Company-level anonymization The company name is only displayed if at least 3 people in the same country, from the same company submit compensation details. Until then, a generic description like "🔒 Series B startup" will be displayed. Role-level anonymization The position title you entered is only displayed if at least 3 people in the same country, with the same title, from the same company share compensation details. Until then, a generic description like "🔒Tier-level role, software engineering" is displayed. Manual review Our team manually reviews all submissions before the data is published. Information that might help pinpointing the person sharing the compensation might be removed or changed during this review. The site is work in progress and being built by Gergely Orosz and the Pragmatic Engineer team. If you have thoughts or feedback, please send it to support (at) techpays.com .'
year_published = 2025
clearnet = "https://techpays.eu"
tags = ["anonymity", "anonymization", "asymmetry", "browse", "change", "company-level", "compensation", "compensation.", "confidence", "countries."]
language = "en"
internal-references = ["none"]
external-references = ["blog.pragmaticengineer.com", "pragmaticengineer.com"]

