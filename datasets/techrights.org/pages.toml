["https://techrights.org/n/2023/09/24/Leftover_Links_24_09_2023_Russia_COVID_and_More.shtml"]
title = "Techrights — Leftover Links 24/09/2023: Russia, COVID, and More"
full_description = "I don’t need another mobile game in my life, thanks to Fate/Grand Order. This isn’t from a lack of desire however; friends have tried repeatedly to get me into Arknights, Honkai Star Rail, Genshin, and Time-Strapped Ruben. HMD Global, a hardware manufacturer under license to produce Nokia-branded smartphones has expressed some interest in producing its own devices. Huawei pledges to build computing backbone for China, almost literally confirms new high-end system-on-chips incoming. While the new Eris type of Covid-19 Omicron has already been discovered in the wastewaters of Latvia, it has not yet been proven in the laboratory. Doctors say that more subtypes are definitely to come and the morbidity curve is sure to increase, Latvian Television reported September 19. Content warning: This article contains mentions of sexual assault. Professors from the University of Michigan’s Institute of Social Research published research finding that rates of forced intercourse rose significantly within the U.S. during the pandemic. At Vidzeme Regional Hospital, the situation with Covid-19 patients has deteriorated in a few weeks – currently, half the inpatient unit is occupied by patients with this virus. In other regional hospitals, the situation has not escalated so much, but in virtually all medical facilities, medics are already starting to wear masks and expecting surges of the virus, Latvian Television reported September 20. By Peter Stebbings The biggest Asian Games in history, boasting about 12,000 competitors — more than the Olympics — will open on Saturday in the Chinese city of Hangzhou after a year’s delay because of Covid. An inquiry will try to draw lessons from the government response, but some question whether it will go far enough. From the EEOC's press release yesterday (and you can also read the Complaint, in EEOC v. United Healthcare Services, Inc.): United Healthcare Services, Inc. (United) violated federal law when it discriminated against a full-time telecommuter by refusing to grant her a religious exemption from the company's COVID-19 vaccine requirement..."
