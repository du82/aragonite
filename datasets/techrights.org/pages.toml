["https://techrights.org/n/2025/03/02/Microsoft_Writing_Articles_About_Microsoft_Using_Microsoft_LLMs.shtml"]
title = "Techrights — Microsoft Writing Articles About Microsoft, Using Microsoft LLMs"
full_description = '''There have been tons of words (occasionally mindless stuff and shallow fluff) said and analysed about the end of Skype - a piece of malware basically - and lots of free publicity was given to another Microsoft product instead of Free/libre alternatives such as Mumble (we use it heavily, it works fine; I used it for over an hour yesterday and will do the same today). One thing to bear in mind, whenever reading some article about Skype, is that all of it or portions of it possibly got written by some chatbot controlled by Microsoft. Or the "research" for the article was cascading LLM slop from some other "source", maybe Microsoft-sponsored (manipulated) Wikipedia. They're basically "gaming" information. This problem is not limited to Skype and FUDZilla. Right now there are many articles about Microsoft Outlook being down completely. Microsoft's MSN published or reposted "Microsoft Outlook is DOWN: Thousands unable to access their emails", "Microsoft Outlook Down: When Will Exchange Servers Be Back Up?", and "Microsoft down! Massive outage strands users without email, apps". Expect many articles about this to be LLM slop, fed by Microsoft manipulators to downplay the severity. █'''
