["https://techrights.org/n/2025/03/01/Links_01_03_2025_UNM_Gopher_and_Getting_One_s_Pages_on_gemini.shtml"]
title = "Techrights — Links 01/03/2025: UNM Gopher and Getting One's Pages on gemini://"
full_description = '''Down to a 10mg dose of tricyclics, fog is clearing and my actual brain is slowly getting back up to speed, another week and I will finally be off it completely. It has been rough getting through these last couple of months, dealing with a body that jumps from one symptom to another during winter. I also tested an audio upload via bunny.net to see if that's a viable way to share my DJ mixes. It feels conflicting so I'm not sure if I'll do it as it's a set and not my own unique music creations. I'd definitely list credits as I've done before. We'll see. Updated my digital garden site with a Catppuccin theme which I love. I hope to set it up as a portfolio eventually to add to a resume or make it slightly more professional than my personal site. I've been under the impression that UNM Gopher's upstream development was long abandoned and, like in so many such cases, Debian was maintaining their own updated fork with minor tweaks so they can keep building packages for it. This seemed clear to me since when I first downloaded the source code to build the latest official version (I don't usually try the Debian forks unless I have trouble compiling, in case their fixes cause issues in different build environments), the Gopher directory claiming to be "THE MASTER SITE" for new UMN Gopher development only showed downloads for versions up to v3.0.11. Just a small public service announcement: If you're using the Gemini protocol, my webste (well, in particular the blog posts), are now also accessible via Gemini at gemini://tilde.club/~gedankenstuecke/[1]. * Gemini (Primer) links can be opened using Gemini software. It's like the World Wide Web but a lot lighter.'''
