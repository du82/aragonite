["https://techrights.org/upgrades"]
title = "Techrights — Welcome to the New Techrights"
full_description = '''Over the next few days Techrights will be archiving over 40,000 older pages, which have been created here since 2006. The move would improve efficiency while retaining all the same contents. This move is well overdue. We developed a static site generator, which has been in use in Tux Machines since summer of 2022. It had been tested and stressed-tested for over a year. If you wish to read a page that is not yet restored (as a static file), use Gemini. Download a Gemini client of your choice, then open that page with the same address, preceded by " gemini.". For instance, http://techrights.org/wiki/EPO becomes gemini://gemini.techrights.org/wiki/EPO and http://techrights.org/2023/08/07/lf-technical-advisory-board-2/ becomes gemini://gemini.techrights.org/2023/08/07/lf-technical-advisory-board-2/ Once the transition is done we expect to resume blogging, probably at a faster pace than before, while at the same time restoring full access to all the past pages (the media files are still in place and fully accessible; all the videos are here). The transition would not surprise anyone who followed our articles and videos from last year *. WordPress served us well for nearly 17 years, but it's time to move on and serve static pages. Migrating all the content of the site, however, can take some time. The full-text database of WordPress is nearly 10 gigabytes in size already. The wiki has a much smaller database, but having edit history going back to a decade and a half ago isn't worth the computational overhead. So we plan to make that static too. This is a long-term investment. It's a very large task, but my wife and I left our jobs to be able to focus on activism. Techrights became very large and influential. It's made possible by the work of many people, some of whom choose to remain anonymous because they've witnessed the tendency to be abused/harassed for promotion of Free software. Come chat with us in IRC if you wish to know more or let us know your opinion. The main channel is #techrights at irc.techrights.org, port 6667 without SSL support and port 6697 for SSL (there are other channels such as #techbytes #boycottnovell and #boycottnovell-social).'''
