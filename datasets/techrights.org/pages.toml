["https://techrights.org/n/2023/09/24/IBM_Neglecting_Users_of_GNU_Linux_on_Laptops_and_Desktops.shtml"]
title = "Techrights — IBM Neglecting Users of GNU/Linux on Laptops and Desktops"
full_description = "Years ago, Red Hat Linux decided it would “make KDE and GNOME look the same” and started theming them as such with Bluecurve and Qtcurve. Recently, it decided to stop doing any work at all to make KDE and Qt applications look right under GNOME for Fedora 39. Did IBM tell them “Just make KDE/Qt applications look ugly. You’re not allowed to work on this anymore.”? They already did this with a lot of other packages in GNOME. This is another reason to abandon GNOME and just run them on KDE, on a distribution that actually maintains KDE and isn’t falling apart. KDE has “Breeze-GTK” for GTK applications. It’s not perfect, but it’s close enough. Just try not to run more GTK applications than you have to. The entire toolkit is brain damaged garbage that is getting worse. More than ten years ago, Audacious (the music player) gave users a Qt option (you have to switch from GTK in the preferences on Debian) which looks a lot better. The complaints from the developers were that unless you custom patched GNOME, the whole application looked gross no matter where you ran it (aside from GNOME, of course) due to Client Side Decorations imposing GNOME’s branding on all of the applications. The main thing wrong with Client Side Decorations is you end up with all sorts of ridiculous buttons and widgets and even text, in window titlebars, and of course this is a major usability disaster since every application can violate the convention used by the system. GTK applications running anywhere else usually look hideous and that’s certainly one reason not to use them. I’ve also found that GTK developers just don’t tend to care about limitations in their software (including proper form editing in PDFs in GNOME, forcing me to get a KDE application to handle it a few years before I gave up on Fedora and GNOME) and if you ask them they’ll say they did it deliberately so it wouldn’t be “hard to use”. Other accusations are, according to Wikipedia, that GTK is bloated and hard to design proper desktop applications with, breaks the APIs constantly and is not backwards compatible, is difficult to theme (This is by design as GTK developers actually wrote a Web site demanding that people stop applying themes to THEIR apps….Their apps? I thought this was Free Software.), and hogs memory, and that the GTK developers are abrasive and ignore community input."
year_published = 2025
