["https://techrights.org/n/2023/09/24/Gemini_and_Web_in_Tandem.shtml"]
title = "Techrights — Gemini and Web in Tandem"
full_description = '''THE one big (yet under-appreciated) aspect/upside of this site's upgrade is that Gemini is generated at the same time that the HTML version gets generated, and both are hosted on the same machine. In the past there was a lag or rather long latency, as conversions from HTML to GemText were initiative by a remote machine, connecting to the server from home. Yesterday we saw a "EuroBSDCon 2023 report" [1] stating that it "was bi-posted to Gemini and the Web". It's good to see more sites that we follow recognising the importance of Gemini and then adopting it. BSDs seems to be more friendly towards old hardware, whereas Linux keeps getting bigger and bigger while throwing out support for "legacy" (old) hardware. The latest episode of "BSD Now" [2] speaks of breathing new life into "a 15 years old laptop". Gemini is not for old machines, but it can be used on them too. We're already learning, over IRC, that out new site is fully compatible with simple command line- and ncurses-based Web browsers. Failing that, there's Gemini. █'''
