["https://techrights.org/n/2023/09/23/The_Right_to_Strike_Underutilised_by_Workers_in_the_Technology_.shtml"]
title = "Techrights — The Right to Strike Underutilised by Workers in the Technology Sector"
full_description = "WHAT started as a few protests and work stoppages in some countries is turning into a global movement of dissent by workers [1], such as teachers [2-4], journalists [5], athletes [6], factory workers [7-8], actors [9-10] and more [11], causing panic in some corporate boardrooms [12]. YouTube Music workers are among those who protest and go on strike, showing that even GAFAM isn't conflict-free. Over the years we wrote lot about protests and strikes at the EPO (the relevant pages will be restored at a later stage; we're upgrading and migrating the site gradually) and rarely did we witness strikes in the realm of Free software, except perhaps developers calling it quits or relicensing something. Sometimes there are hard forks. A culture of dissent, as long as it does not resort to vandalism, makes society stronger by proactively defusing conflicts. A lot of people in a company which they know does evil things would be better off uniting and demanding change. It is not possible unless one actually tries it, and collective action gets better results. Counter-cultural movements that challenge the status quo are what drives humanity forward. Following a major demonstration on September 4, more school teachers in South Korea rallied on Saturday in front of the National Assembly in Seoul, calling for legal protections against bullying from overbearing parents. Stephen Fry speaks on his voice being ripped from Harry Potter audiobooks for AI narration and warns the worst is yet to come. AI remains a hot topic in the entertainment sector as the SAG-AFTRA actors’ union strike reaches its third month (and the WGA strike writers’ strike its fifth)."
