["https://techrights.org/n/2025/02/28/Gemini_Links_28_02_2025_Spring_cgi_and_inetd_and_Gemini_Protoco.shtml"]
title = "Techrights — Gemini Links 28/02/2025: Spring, cgi and inetd, Gemini Protocol FAQ"
full_description = '''A downside of adding too much friction is that you might then lack input sources of new material to write about [...] spawning a new process for every single request to a cgi script and/or daemon might sound inefficient, but in this world of lightning-fast servers and ssds, processes can spring to life and finish their work before you can even whisper the first syllable of "fastcgi". and once they're done, they're *done*! no long-term memory consumption! no chance ot state accumulation or resource hogging. Somewhere in the "postdump" archive page I just added to this capsule, I mention that my rediscovered standard for online tools, sites, etc. is that they must "just work." I got a much clearer picture of just how hard it is by reading the entire Gemini Protocol FAQ over the past few days (yes, all 25k+ words). Having someone spell out for me exactly what the typical HTML site now does just to show itself to the user made me realize how incredibly porous the Web is. * Gemini (Primer) links can be opened using Gemini software. It's like the World Wide Web but a lot lighter.'''
year_published = 2025
