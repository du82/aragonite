["https://techrights.org/n/2023/09/24/Initial_Announcement_of_GNU_for_Gnu_s_Not_Unix_on_September_27_.shtml"]
title = "Techrights — Initial Announcement of GNU (for Gnu's Not Unix) on September 27, 1983"
full_description = '''THE 'birth' of GNU is being celebrated later this week. It happened in 1983. A decade or so later the early Linux developers described their work (kernel) as "free software", so do not be misled by charlatans and revisionists. Linux "came from GNU", so to speak, or at least heavily relied on GNU, especially the compiler, according to Linus Torvalds himself (we linked to the relevant videos last week, showing Torvalds saying so himself). Starting this Thanksgiving I am going to write a complete Unix-compatible software system called GNU (for Gnu's Not Unix), and give it away free to everyone who can use it. Contributions of time, money, programs and equipment are greatly needed. To begin with, GNU will be a kernel plus all the utilities needed to write and run C programs: editor, shell, C compiler, linker, assembler, and a few other things. After this we will add a text formatter, a YACC, an Empire game, a spreadsheet, and hundreds of other things. We hope to supply, eventually, everything useful that normally comes with a Unix system, and anything else useful, including on-line and hardcopy documentation. GNU will be able to run Unix programs, but will not be identical to Unix. We will make all improvements that are convenient, based on our experience with other operating systems. In particular, we plan to have longer filenames, file version numbers, a crashproof file system, filename completion perhaps, terminal-independent display support, and eventually a Lisp-based window system through which several Lisp programs and ordinary Unix programs can share a screen. Both C and Lisp will be available as system programming languages. We will have network software based on MIT's chaosnet protocol, far superior to UUCP. We may also have something compatible with UUCP. I am Richard Stallman, inventor of the original much-imitated EMACS editor, now at the Artificial Intelligence Lab at MIT. I have worked extensively on compilers, editors, debuggers, command interpreters, the Incompatible Timesharing System and the Lisp Machine operating system. I pioneered terminal-independent display support in ITS. In addition I have implemented one crashproof file system and two window systems for Lisp machines.'''
year_published = 2025
