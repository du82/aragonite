["https://techrights.org/n/2025/03/02/Gemini_Links_02_03_2025_OFFLFIRSOCH_2025_and_Programming.shtml"]
title = "Techrights — Gemini Links 02/03/2025: OFFLFIRSOCH 2025 and Programming"
full_description = '''Rejoice! It's time once again for the OFFLine-FIRst SOftware CHallenge. OFFLFIRSOCH 2025 marks the second ever installment of this relatively new community event. If it's not really your cup of tea, well, let this announcement perhaps also serve as your six month advance warning for ROOPHLOCH 2025, which will begin on the first of September. To participate in OFFLFIRSOCH, you should develop and share during the month of March a piece of software which could reasonably be considered "offline-first". No attempt at a precise definition of offline-first is offered. The idea is that we as a community recognise it when we see it, and there's really no incentive to attempt to bend the rules. Software which does not make any use of networking whatsoever obviously qualifies, but network-aware software may also do so, if it still retains the ability to be genuinely useful even if connectivity is intermittent and infrequent. There are no restrictions on what your software actually does, what language it's written in, what platform it runs on or even on the license it is released under. Just make it offline-first and announce it in a post to your phlog and/or gemlog with an (honest!) datestamp some time in March, and that's it. Email me a link to the announcement post and I will compile a list to share with everybody at the end of the month. For some reason I have been fixated on gelatin over the past month. There was a sale at one of the local Asian groceries for assorted fruit jelly cups. The jelly is like flavored gelatin with nata de coco, or coconut gel, suspended inside the jelly. The cups are plastic and single-serving with a plastic cover. There are about 22 cups in 1 plastic container, which is in the shape of a bear and can be used as a piggy bank afterwards. These are yummy and reminds me of Jell-O (tm) with fruit that I used to eat growing up. The only thing I didn't like was the waste. You slurp the jelly and then toss the single-serving plastic cup and cover. Reminded me of the waste that I used to see with the K-cups (Keurig) at work. Good thing reusable K-cups are available.'''
