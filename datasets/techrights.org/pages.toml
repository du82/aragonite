["https://techrights.org/n/2025/03/01/Getting_Serial_Sloppers_to_Knock_the_Habit_of_Plagiarism_by_LLM.shtml"]
title = "Techrights — Getting Serial Sloppers to Knock the Habit of Plagiarism by LLM Slop"
full_description = '''For over a week now Brian Fagioli has not written anything about Linux. That does not mean less Linux journalism but less plagiarism piggybacking the work of others. It means better signal/noise ratio. 4 days ago a colleague of his made some slop image with promotional (product, "solution") text: All in all, the fewer the slop objects, the better. If all you have to offer is slop, then better not do that at all. LLM slop tries to reward people for being dishonest, lazy, and unoriginal. People try to compensate for a lack of knowledge with a quantity of words (long text). Suffice to say, they would suck at spotting errors in that text. If they could cover some topic in their own words, they'd be able to know if it made sense.'''
