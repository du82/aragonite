["https://techrights.org/n/2025/02/28/Skype_is_Dead_Microsoft_Shuts_It_Down_in_a_Few_Months_for_Good.shtml"]
title = "Techrights — Skype is Dead, Microsoft Shuts It Down in a Few Months (for Good)"
full_description = '''Many billions down the drain and Microsoft has already had 3 waves of mass layoffs this year (money problems become increasingly evident after huge lies) Skype is dead. We recently covered signs that this was coming [1, 2]. We had data points pointing to this outcome, suggesting it was imminently coming. It's nice to see Skype being another horrendous buyout (there are countless others). "Yet control was maintained and FOSS players excluded from the market," one person said, though no institution (in some context) allows for any other tool than Microsoft Teams. In my experience, WhatsApp and Zoom are often options as well. We've long used Mumble. "I remember when they forcibly converted my MSN Messenger account to Skype," Ryan recalls. "Pissed me off because MSNP and off the record messaging worked fine." █'''
