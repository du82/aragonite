["https://techrights.org/n/2023/09/24/Links_24_09_2023_5_Days_Worth_of_News_Catchup.shtml"]
title = "Techrights — Links 24/09/2023: 5 Days' Worth of News (Catchup)"
full_description = "Compared to the Nano Pro Gen11 announced in November 2021, the Nano Pro Gen12 mini-computer has more powerful and more efficient processors, namely the AMD Ryzen 5 7535U (6 cores / 12 threads / 19 MB cache) or AMD Ryzen 7 7735U (8 cores / 16 threads / 20 MB cache). While the AMD Ryzen 5 7535U processor includes an AMD Radeon 660M integrated graphics card with max clock rates of 1900 MHz and 6 GPU cores, the AMD Ryzen 7 7735U processor comes with a more powerful graphics card, namely the AMD Radeon 680M with max clock rates of 2200 MHz and 12 GPU cores. Get an AI-Powered Pi! It might not take over the world but it will help you create loads of smart projects that recognise faces, objects and even your voice! We’ll help you get the software and hook up the hardware to create smarter, faster and more … An enjoyable way to test your memory by matching the Linux distro logo and their respective package managers. You have to choose between the two available options. They seem similar but only one of them is correctly spelled. Oracle launches something of a bare metal cloud that takes advantage of Nvidia's H100 Tensor Core GPUs and is intended for running heavy duty generative AI and LLM workloads. A more budget minded offering using Nvidia's L40S GPU will be available early next year. A little over three years ago, Unbound donated its Crossplane framework to the Cloud Native Computing Foundation where it has thrived. On Tuesday, the company donated Upjet, a framework it's designed to be used with Crossplane, to CNCF. Confidential computing directly addresses the question of trust between cloud providers and their customers, with guarantees of data security for guest machines enforced by the underlying hardware of the cloud. According to the Confidential Computing Consortium, confidential computing is the protection of data in use by performing computation in a hardware-based, attested Trusted Execution Environment. Canonical has partnered with AMD (since from when it was still Xilinx) for many years and we jointly deliver optimised/certified Ubuntu on multiple AMD device families, e.g. AMD Zynq™ UltraScale+™ evaluation boards and AMD Kria™ K26 SOMs (system-on-module). Canonical is pleased to announce Ubuntu is now enabled on AMD’s new Kria™ KD240 and ready for developers to download and install."
