["https://techrights.org/n/2025/03/01/Links_01_03_2025_GB_News_Loses_Over_100_Million_Pounds_Zelensky.shtml"]
title = "Techrights — Links 01/03/2025: GB News Loses Over 100 Million Pounds, Zelensky Wins World's Sympathy"
full_description = '''China is estimated to have some 500 million basketball fans, more than 1 million basketball courts and 43 million NBA followers on the social control media platform Weibo. But increasingly, grassroots basketball is gaining popularity in rural China. Amateur leagues from small towns have become viral sensations and have been dubbed the "VBA", the Village Basketball Association. Local authorities are eager to profit from the phenomenon and use it to promote rural revitalisation. FRANCE 24's Yena Lee, Yorben den Hartog and Jasmine Ling report from Fujian province. In Bong Joon-ho’s latest film, Robert Pattinson plays a space traveller facing a succession of death sentences. I published “LLMs: harmful to technical innovation?”, a short post about how LLMs could maintain the status quo for technology. In short: newer ideas have less available training data, so the LLM experience will probably be worse. Rick Rubin has an interview with Woody Harrelson on his podcast Tetragrammaton. Right at the beginning Woody talks about his experience acting and how he’s had roles that did’t turn out very well. He says sometimes he comes away from those experiences feeling dirty, like “I never connected to that, it never resonated, and now I feel like I sold myself...Why did I do that?!” Then Rick asks him: even in those cases, do you feel like you got better at your craft because you did your job? Woody’s response: On February 6th I took part in a panel at Södertörn University discussing ‘the digital backlash’ in education – the growing trend to ban smartphones from schools, prioritise traditional books over screens, and generally roll-back the digitisation strategies of the 2010s. Here is a summary of my opening remarks. Scientists tested a device that helped volunteers taste flavors meant to represent distant samples of coffee, lemonade, fried eggs, cake and fish soup. It was not clear whether his removal is related to President Pooh-tin Jinping’s anti-corruption purge.'''
