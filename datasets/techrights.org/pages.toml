["https://techrights.org/n/2025/02/28/Gemini_Links_28_02_2025_offpunk_Lagrange_and_More.shtml"]
title = "Techrights — Gemini Links 28/02/2025: offpunk, Lagrange, and More"
full_description = "It's strange to think we're halfway through the decade. Time, since 2016 and especially since 2020, has felt strangely stretched: the sense that everything has been happening increasingly quickly, while at the same time, anything that happened prior to, you know, is increasingly faint. Like a lot of people, I was fortunate to spend the worst part of the pandemic holed up at home. I'm lucky: I have a partner I love (and who loves me), dogs that need regular exercise outdoors, as well as, at the time, a job that went remote fast, and stayed that way, at least for a few years. But life doesn't stop because everything else does, and fifteen hundred miles to the west of me, things were getting worse for my grandfather. Suffering from memory loss and cognitive slowness that turned into dementia, things worsened for him, quickly. Ten years before the pandemic, I stopped to visit with my partner while we were on a trip to Vancouver Island. I could tell he was off, and having to think about things, but that was the extent of it. Eight years later we were in Vancouver to see Hozier play at the Orpheum (incidentally, one of the great concerts of my life), and I extended my trip to be able to stop and see my grandparents before taking the ferry to visit the rest of my family. At that point, I knew things were bad: he was driving, but definitely shouldn't have been; he was trapped in loops, asking me when I was going to marry my partner (happily, he never forgot who I was, or her). The pi 4 wasn’t originally going to be a laptop project, but I got a nice display as a gift. So I mounted the pi 4 to it and soon had a very useable Hyprland setup. I couldn’t get the gesture pane swapping to work, but then I don’t really like touching the screen anyway. Level 5 announced a release date for May, 21. Last release date was April, but they slipped it to May. They are going to simultaneously release on Switch, PC (Steam), PS4/5, and XBox. They’re going to support cross-play and cross-save progression."
