["https://techrights.org/n/2025/02/28/IBM_is_Trading_Employees_for_Revenue_Acquired_by_Buying_Compani.shtml"]
title = "Techrights — IBM is Trading Employees for Revenue Acquired by Buying Companies and Growing the Debt"
full_description = '''IBM has adopted the "buying more "revenue" [approach]," as this new comment puts it, noting sarcastically that it is a "great strategy, I'm sure [CEO of IBM] AK way overpaid for it, just like he did with Red Hat." "The next question is how many ra's [layoffs] to start paying back this loan," the latest comment says. There is this correct perception that in order to fake revenue "growth" IBM is offloading many things while buying companies (and staff) for their revenue. The problem with this approach is, the debt is ballooning and replacing "expensive" staff with cheap replacements is not a viable long-term strategy but a suicide (customers notice products and services deteriorating). However, faked revenue growth helps secure generous pensions, bonuses etc. for the executives who do this.'''
