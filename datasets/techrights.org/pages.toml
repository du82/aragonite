["https://techrights.org/n/2025/03/01/Links_01_03_2025_Scam_Altman_s_Latest_Excuse_Google_Price_Hikes.shtml"]
title = "Techrights — Links 01/03/2025: Scam Altman's Latest Excuse, Google Price Hikes"
full_description = '''I'll start with a quick explanation. Acronyms are only a string of initials that can be pronounced as a word. Otherwise it is an initialism. "NASA" is an acronym, "FBI" is an initialism. This post is specifically about acronyms, not initialisms or abbreviations. Many fields use acronyms; in a context where everyone understands them, they can speed up communication and improve one's ability to remember. “Closing a tab, holding it out, and asking people for the tip — that can take up to two minutes,” Tulloch details the tab-closing time crunch. “But think about two minutes for eight people. That’s 16 minutes and there are maybe 30 other people waiting to be served. If I could just open a tab, which is one motion, and then take care of all the other guests, I could come back when that moment of being in the weeds is over.” The advantage of having an open tab — and paying on one tab — is that it streamlines everyone’s experience. Bartending is basically project management with alcohol. Time spent closing tabs and ringing everyone up creates a line, a backlog. The theoretical minutes Tulloch and her colleagues save on closing tabs is more time could instead be spent paying attention to guests, and more guests getting their drinks and orders. This is my second blog, and my first WordPress one. It launched in 2007. My first is this one, which (courtesy of Dave) started in the last year of the prior millennium. I had hair then, and wore glasses. I recently added a feature to my build process that lets me run these custom functions only when my site is building for production. The question is, as we hurtle past these invisible thresholds, can we be conscious enough to shape what comes next? Or are we doomed to be passive travelers, unaware of our trajectory until it's too late? Worse yet, experts are concerned that other powerful nations, most notably Russia and China, could soon take advantage of the power vacuum and exert their influence, including in places like Antarctica.'''
year_published = 2025
