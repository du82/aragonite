["https://techrights.org/n/2025/03/01/Links_01_03_2025_Squashing_Software_Patents_USPTO_Facing_Additi.shtml"]
title = "Techrights — Links 01/03/2025: Squashing Software Patents, USPTO Facing Additional Cuts"
full_description = '''The Latvian Ministry of Defense said February 27 it is urging applications for the NATO Science and Technology Organisation (STO) challenge "Women & Girls in Science 2025" (WGS25 ), which aims to encourage young women to pursue careers in science, technology, engineering and mathematics (STEM) fields that contribute to security and defence. A clip of Ms Leila Purchase’s stash from her London apartment on Fentanylware (TikTok) has gone viral. "Apple may need to make DEl changes in the future as the legal landscape evolves," says Fashion Company Apple CEO Tim Cook. U.S.-based Autodesk Inc. (ADSK) announced plans to cut 1,350 jobs to streamline operations and boots its investments in AI and cloud computing. The layoffs account for 9% of the software company’s workforce, with expected restructuring costs between $135 million and $140 million. Autodesk announced layoffs as part of its restructuring plan alongside strong quarterly results, with revenue rising 12% to $1.64 billion, in line with analyst expectations. It further stated that its restructuring efforts are focused on AI development and improving its market approach to enhance customer service. The recent layoffs at Meta, Microsoft, and JPMorgan Chase exemplify this paradox. At the heart of these decisions lies a growing crisis of trust between employers and employees. If a strong performance review no longer guarantees job security, and if a company’s record profits still translate to job cuts, then what message are leaders really sending to their workforce? Skype will ring for the last time on May 5 as owner Microsoft retires the two-decade-old internet calling service that redefined how people connect across borders. Shutting down Skype will help Microsoft focus on its homegrown Teams service by simplifying its communication offerings, the software giant said on Friday. Founded in 2003, Skype's audio and video calls quickly disrupted the landline industry in the early 2000s and made the company a household name boasting hundreds of millions of users at its peak. But the platform has struggled to keep up in the face of competitors that include Zoom, Meta's WhatsApp, Salesforce's Slack and WeChat from Tencent in recent years.'''
