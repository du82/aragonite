["https://techrights.org/n/2023/09/24/Debian_GNU_Linux_is_a_Fine_Operating_System_But_What_if_People_.shtml"]
title = "Techrights — Debian GNU/Linux is a Fine Operating System, But What if People Die Making It for Somebody's Corporate/Personal Gain?"
full_description = '''LAST week Daniel Pocock et al looked at Chris Rutter as part of a series of articles about "cover-ups after deaths, accidents, suicides" [1-2] in Debian. Rutter "was seen to be working up to 3am doing unpaid voluntary work for ARM Ltd & Debian at the same time he started his undergraduate studies in Cambridge." There seems to be a vicious campaign of censorship, attempting to suppress any discussion or publication related to such issues -- to the point where we too were repeatedly threatened. Being passionate about Debian is OK. Days ago one person wrote about minidlna running on Allwinner hardware over at a blog syndicated in Planet Debian. To quote: "Of course from the time it entered our home it has always been running Debian." [3] Well, using it is one thing, but being pressured to develop it for free (for personal gain by the likes of Mark Shuttleworth) is not. We're probably going to cover this issue a lot more, as threats of reprisal are less likely. Debian's official sites, Project Leader, and some prominent developers have issued reports from DebConf23 [4-6], but those merely serve to distract from controversies and scandals. Will companies that exploited unpaid volunteers ever be held accountable for loss of life, caused by burnout, excessive work, or poverty? █ Volunteers have recently started picking over the story of Chris Rutter, who was seen to be working up to 3am doing unpaid voluntary work for ARM Ltd & Debian at the same time he started his undergraduate studies in Cambridge. Volunteers have noticed that news reports about the DebConf23 death of Abraham Raji in Kochi, India contain far more information than the official Debian report. This is all we got from Debian: [..] I’ve found the draft of this article I almost completely wrote (checks) more than 3 months ago, and I guess it’s time to finish and publish it. The very first A10 based device that entered our home, before they started to use it for SBCs, was a Chinese media server with a slot for a 3.5" hard disk and a few analogue audio outputs.'''
year_published = 2025
