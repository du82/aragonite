["https://techrights.org/n/2025/02/28/Links_28_02_2025_Mass_Layoffs_at_Autodesk_Employee_Burnout_and_.shtml"]
title = "Techrights — Links 28/02/2025: Mass Layoffs at Autodesk, Employee Burnout, and Measles in Texas"
full_description = "A new art exhibit, “On The World With The World,” debuted Saturday, Feb. 1, to a full house and an open panel discussion at the University of Michigan’s Institute of the Humanities. It’s not just my work’s fault, I think. My “information diet” — reading blogs who obsess over details like which app to use for this or that, watching YouTube channels that scrutinize phone models in such detail that a normal person wouldn’t notice the difference from the last five iterations etc. — pretty much created an alternative reality that initially seemed appealing but eventually turned suffocating. The price paid — whether financial or social — to procure these photos is well worth it. These photos are invaluable, capturing a moment in time that will never happen again. Hanging on a fridge they’ll regularly bring smiles to faces. Popping up in an “On this day” social media or photo app, they’ll bring smiles to faces. And one day they might live in a frame sitting on a table at a funeral home, bringing tearful smiles to faces. The above example is a bit contrived, but I hope you get the idea. Also, you can totally use let () in the example above, although it seems to me that using let _ is more intention revealing in such cases. It’s in this country that scientists, funded by or working for the government, came to understand the role of carbon in our atmosphere. What comes to mind when a computer science student tells you she thinks technology is the antithesis of humanity? At the same time, for the first time in my life that flexibility has become a little bit of a burden! It turns out it is very hard to concentrate on responding to emails when your alternative is to play with your daughter giggling in the adjoining room; similarly, as Buttondown grows and as more and more of my time is spent on calls, it turns out long-winded demos and onboarding calls are logistically trickier when it is Nap Time a scant six feet away. And, beyond that, it's felt harder and harder to turn my brain off for the day: when there is always more work to be done, it's hard not to poke away at a stubborn pull request or jot down some strategy notes instead of being more present for my family (or even for myself, in a non-work capacity.)"
