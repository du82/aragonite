["https://techrights.org"]
title = "Techrights — Welcome to the New Techrights"
full_description = "Welcome to the current iteration of Techrights, online since 2006 with a major infrastructural upgrade in late 2022. Here you will find our latest posts. In addition to HTTP/HTTPS here, Techrights is also available via Gemini and IPFS editions, though the IPFS service is on hiatus for the foreseeable future. Just the other year, Techrights upgraded from a heavy content management system to a much lighter and lower maintenance static site generator which produces both HTML for the WWW and GemText for the Gemini space. The site is mostly prose, but there are also quite a few topical videos in the Techrights archive. A complete, chronological index of current and past articles is also available, from the latest to the oldest. Recent posts are syndicated and can be tracked via RSS. An audio file with the latest headlines in Morse is updated every four hours. Enter our self-hosted IRC channel to contact us or have a chat about information communication technology and digital rights. Or, for privacy, take contact via e-mail encrypted with OpenPGP."
