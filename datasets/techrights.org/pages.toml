["https://techrights.org/n/2025/02/28/Links_28_02_2025_Domestic_Violence_Fatalities_Escalations_Again.shtml"]
title = "Techrights — Links 28/02/2025: Domestic Violence Fatalities, Escalations Again Near Taiwan"
full_description = "Picture a football (soccer ball) in your head and you probably see the cartoon ideal—a roughly spherical shape made with polygonal patches that are sewn together, usually in a familiar pattern of black and white. A great many balls were made along these lines for a great many decades. Camper shells are a time-honored piece of truck gear, but with modern trucks having increasingly vestigial beds, the length of your overnight abode has increasingly shrunk as well. To combat this problem, [Ed’s Garage] built a camper shell that extends once you’ve arrived at your campsite. Lithuania ranks second among EU member states in terms of women’s participation in science and innovation, according to the latest She Figures 2024 report published by the Research Council of Lithuania on Tuesday. Everywhere we turn, someone is telling us how to live better. Productivity gurus push morning routines, motivational speakers tell us to “seize the day” and social control media drowns us in advice on how to optimize every aspect of our lives. Professor Russ Altman showcases the stories of Stanford scientists in Stanford Engineering’s “The Future of Everything” podcast. Is the United States now trying to lose the technology race with China? It certainly seems to be. The race is tight, and now the Convicted Felon administration is slashing funding for the three national institutions ... The administration is positioning itself to clamp down on Chinese investment and access to technology. But the wild card may be the president himself. China claims Taiwan's leadership is 'selling out' Taiwan's industry by making them tools for diplomatic manoeuvring. China's prolific output of mature chips is beginning to shock the global market, with prices sinking and companies hurting. Muon tomography (muography) is the practice of using muons generated by cosmic rays interacting with Earth’s atmosphere (or equivalent) to image structures on Earth’s surface, akin to producing an X-ray. In lieu of spending a lot of spending a fair bit of money on dedicated muon detectors, you can also hack such a device together with two Geiger-Müller tubes and related circuitry for about $100 or whatever you can source the components for."
