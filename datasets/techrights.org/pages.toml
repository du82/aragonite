["https://techrights.org/n/2023/09/23/YouTube_Was_Never_Free_Hosting_and_It_Turns_Hard_Working_People.shtml"]
title = "Techrights — YouTube Was Never Free Hosting and It Turns Hard-Working People Into Hostages"
full_description = '''WE'VE noticed that the media fancies touching a longstanding problem because it now impacts a high-profile celebrity, Russell Brand. The short story is that Russell Brand has been accused of a crime, so Google/Alphabet (YouTube) rushes to sanction him, sans due process [1-3]. Spotify does even worse [4] (more severe action), unlike Twitter/X [5] and some news sites [6-7]. This whole saga serves to highlight the sad fact that outsourcing one's platform and/or audience is very risky; you needn't even do anything illegal but merely be accused of it. An accusation, with presumed guilt, seems sufficient for some. Allegations. It is perfectly possible that Russell Brand did some horrible things, but punishing him because some firms (brands) fear for their reputation is akin to courts changing their decisions because the crowd outside is "very loud" and "scary". █ YouTube demonetizes Russell Brand’s channel following sexual assault allegations dating back to the early ’00s. On Tuesday, YouTube reported blocking British actor and comedian Russell Brand from monetization on his channel following allegations of sexual assault. Following some serious sexual assault allegations, comedian and actor Russell Brand is seeing his content demonetized across the internet. YouTube made a statement—but Spotify appears to have disabled his audiobooks quietly. Chair of Commons Culture, Media and Sport Committee Dame Caroline Dinenage has written to GB News CEO.'''
