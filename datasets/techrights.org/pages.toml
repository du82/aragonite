["https://techrights.org/n/2025/03/02/Suing_One_s_Way_Out_of_Real_Trouble_Won_t_Work_It_Merely_Increa.shtml"]
title = "Techrights — Suing One's Way Out of Real Trouble Won't Work (It Merely Increases the Trouble)"
full_description = '''"Guns for hire" in London can only issue "legal" threats, but there's a risk involved (to themselves too). No law is broken by writing truthful statements, unless or except in nations that have "blasphemy" laws or other provisions for supposedly sacrilegious words. In yesterday's "Justice Will Find Its Way at the End" we focused on aspects of justice. "We deserve an award, not SLAPP, for what we've done," as others can agree (exposing bad people isn't a crime, it's a public service). SLAPP is doomed to fail, but it still enriches law firms whose business is typically litigation (or interaction potentially leading up to that). There are people who say stuff like, at the end "justice was done". But for Bellingcat, which does a lot of investigative journalism/research (e.g. [1, 2]), justice was not done because its editor had to waste 70,000+ pounds, lots of time, and much more; sites like Bellingcat should be shielded by the government from the criminals it exposed; the site should be able to be 100% focused on investigative journalism/research, not threatening letters and bureaucracy. The firm that did that to Bellingcat went defunct (the one which targeted us is clearly in debt, hence desperate for any kind of "business" it can find), but justice was still not done to Bellingcat, which saw our government conspiring to keep London a "libel capital". Justice done would be spurious SLAPP not being permitted in the first place or immediately thrown out (with little effort). We're going to spend the next few years campaigning for reform/s and explain such reforms*. We won't allow any more thugs from Microsoft try to silence any Microsoft critics by "litigation tourism". █'''
year_published = 2025
