["https://techrights.org/n/2025/02/28/When_the_Business_Goal_is_to_Protect_the_Image_of_Criminals_Fro.shtml"]
title = "Techrights — When the Business Goal is to Protect the Image of Criminals From the Mainstream Media or Free/Independent Press (at Any Cost)"
full_description = '''WE recently wrote about letters that my wife and I had received from a debt-saddled firm with a poor taste in clients. Earlier this month I received some more. The latter SLAPP attempt shows that even when the victims of crimes act as sources, reliable sources, the publisher gets targeted. Basically, a mobster who attacked women (and got arrested for it) is now trying to ruin the lives of his victims who spoke about it and also the person who reported it to the public. OK, consider how they advertise themselves. To quote their very own words: "Our criminal law department are called upon when clients need a bold and innovative strategy in response to a police investigation or criminal prosecution. Over the years, our team of criminal defence solicitors has successfully defended in thousands of cases. Our clients include corporates, public figures and professionals who prioritise the protection of their reputation and require proactive expert help. Typical clients are professionals or high-profile individuals facing prosecution for the first (and probably only) time in their lives and for whom the prospect of criminal conviction (even prosecution) is unimaginable. The department has particular expertise in dealing with highly sensitive allegations of a sexual nature. Our practice in this area is complemented by our expertise in professional disciplinary and regulatory investigations and proceedings, as well as media and communications law work. We genuinely care about our clients and our reputation depends on the outcomes that we achieve." So they act "in response to a police investigation or criminal prosecution [...] prioritise the protection of their reputation" (even at the expense of freedom of the press or women's rights... or women's safety from abuse). Hiding people's past helps them repeat the same crimes, no? Should society not be entitled to know who did what? When it's in the public record? The reputation laundering for criminals or people facing prosecution is the "Brett" (Nick Brett, "Head of Crime") in "Brett Wilson LLP". That's just how they present themselves, there's no room for bias here.'''
year_published = 2025
