full_description = '''About › Programs & Initiatives › TED Talks › Ways to get TED TalksFeed your curiosity and enjoy TED Talks on your favorite devices. Watch TED Talks on the go or at home with our award-winning mobile, tablet and smart TV apps. Listen to TED podcasts for a variety of original content, or use voice commands to play TED Talks on your smart speaker.TED RecommendsTED Recommends delivers the best ideas, selected just for you.Our recommendations are based on your unique interests and motivations. Add in some artificial intelligence, your watch history and ratings, and the recommendations will just keep getting better.Get your recommendationsMobile and tablet appsWatch TED talks wherever you are. Sync your account seamlessly to access your favorite talks and watch history. Play videos on your device or send to a larger screen via AirPlay. Save talks to watch offline. Available in 20+ languages. Download the TED mobile apps:Smart TV appsDownload the TED app on your smart TV and access more than 3,000 talks for free, in stunning HD. Available in 100+ languages.Available on these platforms:Smart speaker appsAccess the entire library of TED Talks with a simple voice command."OK Google, play the latest episode of TED Talks""Alexa, ask TED Talks to play the latest TED Talk"Learn more about TED Talks audioWhether you're a Google Home user, an Amazon Alexa user or a podcast listener, you can now play the latest TED Talk.PodcastsTED offers a range of original podcasts. Stay updated with the latest episodes wherever, whenever you want. You can also subscribe to our podcasts on Apple Podcasts.Learn more about TED's original podcast initiatives. Subscribe to listen on Apple Podcasts, the TED Android app, or wherever you get your podcasts. Better yet, write us a review! We love hearing from our listeners.'''
