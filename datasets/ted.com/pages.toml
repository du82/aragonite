title = "TED Podcasts"
description = "Learn more about TED's original podcast initiatives. Subscribe to listen on Apple Podcasts, the TED Android app, or wherever you get your podcasts."
full_description = '''Podcasts › TED PodcastsSubscribe to listen on Apple Podcasts, the TED Android app, or wherever you get your podcasts. Better yet, write us a review! We love hearing from our listeners.Learn more about the TED Audio Collective.TED Talks DailyEvery weekday, TED Talks Daily brings you the latest talks in audio. Join host and journalist Elise Hu for thought-provoking ideas on every subject imaginable -- from Artificial Intelligence to Zoology, and everything in between -- given by the world's leading thinkers and creators. With TED Talks Daily, find some space in your day to change your perspectives, ignite your curiosity, and learn something new.Learn more about TED Talks Daily, and other ways to listen to TED TalksHow To Be A Better HumanHow To Be A Better Human isn’t your average self improvement podcast. Each week join Chris Duffy in conversation with guests and past speakers as they uncover sharp insights and give clear takeaways on how YOU can be a better human. From your work to your home and your head to your heart, How To Be a Better Human looks in unexpected places for new ways to improve and show up for one another. Inspired by the popular series of the same name on TED’s Ideas blog, How to Be a Better Human will help you become a better person from the comfort of your own headphones.Learn more about How To Be A Better Human FixableFrances Frei is a Harvard Business professor. Anne Morriss is a CEO and best-selling author. Anne and Frances are two of the top leadership coaches in the world. Oh, did we mention they're also married to each other? Together, Anne and Frances move fast and fix stuff by talking to guest callers about their workplace issues and solving their problems – in 30 minutes or less. Both listeners and guests will receive actionable insights to create meaningful change in the workplace. From CEOs to nurses, the restaurant world to Silicon Valley, Frances and Anne have a plan for anyone hoping to improve their their workplace. If you want to be on Fixable, call our hotline at 234-Fixable (that's 234-349-2253) to leave Anne and Frances a voicemail with your workplace problem.Learn more about Fixable The TED AI ShowSure, some predictions about AI are just hype – but others suggest that everything we know is about to fundamentally change. Creative technologist Bilawal Sidhu talks with the world’s leading experts, artists, journalists, and more to explore the thrilling, sometimes terrifying, future ahead.Learn more about The TED AI Show ReThinking with Adam GrantAs an organizational psychologist, Adam Grant believes that great minds don’t think alike; they challenge each other to think differently. In his new show, he has lively discussions and debates with some of the world’s most interesting thinkers, creators, achievers, and leaders—from Lin-Manuel Miranda to Brené Brown to Mark Cuban, and Olympic medalists to Nobel laureates to Oscar winners. By diving inside their minds, Adam is on a mission to uncover bold insights and share surprising science that can make us all a little bit smarter. Tune in to ReThinking with Adam Grant. You might just be inspired to let go of some old ideas and embrace some new ones.Learn more about ReThinking with Adam Grant Design Matters with Debbie MillmanDesign Matters with Debbie Millman is one of the world’s very first podcasts. Broadcasting independently for over 15 years, the show is about how incredibly creative people design the arc of their lives.Learn more about Design Matters with Debbie Millman Every weekday, TED Talks Daily brings you the latest talks in audio. Join host and journalist Elise Hu for thought-provoking ideas on every subject imaginable -- from Artificial Intelligence to Zoology, and everything in between -- given by the world's leading thinkers and creators. With TED Talks Daily, find some space in your day to change your perspectives, ignite your curiosity, and learn something new.Learn more about TED Talks Daily, and other ways to listen to TED Talksted.com/podcasts/design_matters_with_debbie_millman)WorkLife with Adam GrantWe spend a quarter of our lives at work, but too little time thinking about how to make it better. Organizational psychologist Adam Grant takes you inside unconventional workplaces to explore the ideas we can all use to make work more meaningful and creative.TED Talks DailyEvery weekday, TED Talks Daily brings you the latest talks in audio. Join host and journalist Elise Hu for thought-provoking ideas on every subject imaginable -- from Artificial Intelligence to Zoology, and everything in between -- given by the world's leading thinkers and creators. With TED Talks Daily, find some space in your day to change your perspectives, ignite your curiosity, and learn something new.Learn more about TED Talks Daily, and other ways to listen to TED Talks Learn more about WorkLife with Adam GrantYour Undivided AttentionIn this podcast from the Center for Humane Technology, co-hosts Tristan Harris and Aza Raskin confront catastrophic risk with existential hope. How is technology both a symptom and a driver of broader social, political, and economic forces? How do we reimagine humane technology that supports our shared well-being, sense-making, and ability to tackle complex global challenges? And what can we do together to catalyze a more humane future?Your Undivided Attention's Executive Producer is Stephanie Lepp, and the Senior Producer is Julia Scott.Learn more about Your Undivided AttentionTED Radio HourTED Radio Hour investigates the biggest questions of our time with the help of the world's greatest thinkers. Can we preserve our humanity in the digital age? Where does creativity come from? And what's the secret to living longer? In each episode, host Manoush Zomorodi explores a big idea through a series of TED Talks and original interviews, inspiring us to learn more about the world, our communities, and most importantly, ourselves.Learn more about TED Radio HourTED ClimateWe get it. You care about the climate crisis—but sometimes thinking about it is just too overwhelming. Well, we’re here to help with that. Host Dan Kwartler unpacks the problems and solutions behind big systemic issues in bite-sized episodes. You’ll find out which bag is best for the planet, imagine our world without humans, and follow the international journey of the very shirt on your back. Yes, we’re going to talk about the bleak stuff—it’s a crisis after all—but we’ll also share little ways you can make changes in your daily life, in your towns and cities, and at your workplaces to help change climate change. Ultimately we’re aiming for some HOPE through a focus on solutions, instead of just, you know, tumbling towards inevitable doom. Learn more about TED ClimateTED HealthWhat does exercise do to your brain? Can psychedelics treat depression? From smart daily habits to new medical breakthroughs, welcome to TED Health, with host Dr. Shoshana Ungerleider. TED speakers answer questions you never even knew you had, and share ideas you won't hear anywhere else, all around how we can live healthier lives.Learn more about TED Health TED BusinessWhatever your business conundrum, there’s a TED Talk for that — whether you want to learn how to land that promotion, set smart goals, undo injustice at work, or unlock the next big innovation. Every Monday, host Modupe Akinola of Columbia Business School presents the most powerful and surprising ideas that illuminate the business world. After the talk, you'll get a mini-lesson from Modupe on how to apply the ideas in your own life — because business evolves every day, and our ideas about it should, too.Learn more about TED BusinessTED TechFrom the construction of virtual realities to the internet of things to the watches on our wrists—technology's influence is everywhere. Its role in our lives is evolving fast, and we're faced with riveting questions and tough challenges that sit at the intersection of technology and humanity. Listen in every Friday, with host, journalist Sherrell Dorsey, as TED speakers explore the way tech shapes how we think about society, science, design, business, and more.Learn more about TED TechTED en Español podcastTED en Español is a weekly podcast devoted to great ideas delivered in Spanish, hosted by TED's own Gerry Garbulsky and featuring ideas from around the globe.¿Cuál es la relación entre el amor y las matemáticas? ¿Cómo construye su identidad un inmigrante? ¿Nos reemplazará la inteligencia artificial en nuestros trabajos? ¿Pueden los emprendedores mejorar la educación y la salud de todos?En el podcast de TED en Español te invitamos a hacernos este tipo de preguntas, a escuchar ideas provocadoras y a desarrollar nuevas maneras de pensar. Cada semana escucharemos una charla TED de los principales líderes y creadores del mundo. Con la guía de Gerry Garbulsky, el curador de TED en Español, exploramos el universo de ideas en nuestro idioma.Learn more about the TED en Español podcast(https://www.ted.com/podcasts/ted-en-francais)TED en Français podcastTED en Français est le podcast officiel de la communauté TED francophone, animé par Michel Levy Provençal. Chaque épisode vous invite à plonger dans l'univers d'un intervenant TED ou TEDx. Découvrez les coulisses de leur talk, explorez l'évolution de leurs projets et projetez-vous dans l'avenir de leur domaine d'expertise. Que vous soyez passionné par les sciences et technologies, les arts ou les transformations de la société "TED en Français" vous offre une perspective unique sur les idées qui façonnent notre monde. Learn more about the TED en Français podcastTED in Chinese Highlighting ideas from the Chinese speaking regions, the TED in Chinese podcast features talks by top thinkers and doers who are exploring and creating new solutions to issues that matter to you and me and the future of the world. 《TED中文演讲》聚焦华语地区的创意，演讲人包括关注自身成长和精神世界的思考者，更有关注弱势群体和人类未来命运的探索者。 Learn more about the TED in Chinese podcastConversations With People Who Hate MeIn an internet era characterized by comment section wars, devastating clapbacks, and anonymous vitriol, Dylan Marron explores what happens when online feuders step out from behind the keyboard and get to know the human on the other side of the screen. Join Dylan as he connects people who have clashed online – from old friends to complete strangers — to explore why we believe what we believe, how we relate to each other on the internet, and just what a phone call can accomplish. Don’t be fooled by the title! It’s actually a loving show that fosters unlikely connections in an age of increasing digital isolation. Whether Dylan is speaking with someone who wrote him a negative comment or is moderating a call between two strangers at odds, the results are often surprising, usually heartwarming, and always compelling.Learn more about Conversations With People Who Hate MeAm I Normal? with Mona ChalabiWe get it. You care about the climate crisis—but sometimes thinking about it is just too overwhelming. Well, we’re here to help with that. Host Dan Kwartler unpacks the problems and solutions behind big systemic issues in bite-sized episodes. You’ll find out which bag is best for the planet, imagine our world without humans, and follow the international journey of the very shirt on your back. Yes, we’re going to talk about the bleak stuff—it’s a crisis after all—but we’ll also share little ways you can make changes in your daily life, in your towns and cities, and at your workplaces to help change climate change. Ultimately we’re aiming for some HOPE through a focus on solutions, instead of just, you know, tumbling towards inevitable doom.Learn more about Am I Normal? with Mona ChalabiAfter HoursHarvard Business School professors discuss and debate current events that sit at the crossroads of business and culture. Youngme Moon, Mihir Desai, and Felix Oberholzer-Gee engage in a spirited discussion on a range of topics torn from the headlines — from Facebook, to free trade, to the #MeToo movement. Informed by their unique expertise as professors at one of the world’s leading business schools, their takes are always surprising, unconventional, and insightful.Learn more about After HoursBody Stuff with Dr. Jen GunterShould I do a juice cleanse? Do I really need 8 glasses of water a day? Is it actually possible to "boost" my immune system? You’re constantly bombarded with news stories, ads, and social media posts telling you how to optimize your health—but a lot of these sources that pretend to be backed by science have another agenda. Dr. Jen Gunter is here to bust the lies you’re told—and sold—about your health, debunking some of the stickiest myths out there while helping you to understand how your body really works.Learn more about Body Stuff with Dr. Jen Gunter Checking In with Susan DavidFear, boredom, grief, confusion—we're all feeling... a lot right now. How do we cope with our heightened emotions during this global pandemic? Susan David—a psychologist at Harvard Medical School—is here to offer us strategies. This show is an urgent response to an urgent moment—a support system, toolkit, and understanding voice during a time of great uncertainty.Learn more about Checking in with Susan David Far Flung with Saleem ReshamwalaFar Flung with Saleem Reshamwala is a journey across the globe in search of the world's most surprising and imaginative ideas. It's not a travel show, exactly. It's a deep dive into the ideas that shape a particular spot on the map, brought to you by local journalists and creators. Weave through the streets of Bangkok with a motorcycle midwife. Time-travel with dinosaurs behind a hardware store in New Jersey. Meet a guy who dresses up as a luchador to protect citizens from traffic in Mexico City. Drop in, listen up, dig deep.(And yes, we used to be called Pindrop!)Learn more about Far Flung with Saleem Reshamwala ZigZagZigZag is a business show about being human. Join this zig-zagging quest with Manoush Zomorodi (also the host of NPR’s TED Radio Hour) to discover new ways we can align our ambitions with systemic change that’s good for our fellow human beings.Learn more about ZigZag TEDx SHORTSStart each day with short, eye-opening ideas from some of the world’s greatest TEDx speakers. Hosted by Atossa Leoni, TEDx SHORTS will give you the chance to immerse yourself in surprising knowledge, fresh perspectives, and moving stories from some of our most compelling talks. Less than 10 minutes a day, everyday.Learn more about TEDx SHORTS The TED InterviewAuthor and podcaster Steven Johnson speaks with some of the world’s most interesting people to dig into the provocative and powerful ideas of our time.Learn more about The TED Interview Sincerely, XStories shared on the TED stage are seen and heard by millions around the world. But some ideas can’t be shared in the open -- there are stories that are too risky, painful, or controversial. Sincerely, X provides a space to share powerful ideas anonymou'''
