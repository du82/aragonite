full_description = "Participate › NominateWe're always looking for new voices and new ideas to add to the TED community. Through our TED Talks, Fellowship, TED-Ed lessons, and podcasts, we take those great ideas and help them grow — but they start with your suggestions. See all the ways to let us know about the most exciting, talented people in your network.Nominate a speakerEach TED conference features more than 50 of the world's most innovative and influential speakers. At TED, we search year-round for presenters who will inform and inspire, surprise and delight. If you know someone who belongs on the TED stage, or if you belong there yourself, we want to hear from you! Please use our speaker recommendation form to tell us why this person would be well-suited to speak at TED. More about speaking at TED.Nominate a speaker Apply for The Audacious ProjectAre you a changemaker with an ambitious idea? The Audacious Project could help your work achieve far-reaching social impact. TED’s ambitious collaborative funding initiative is looking for world-changing ideas to catalyze to grand scale. If you and your organization have a proven track record and the potential to deliver on a bold vision, The Audacious Project could be for you.Apply for The Audacious Project Apply to be a TED FellowOnce a year, the TED Fellows program opens applications to find a new class of outstanding thinkers and doers. We are looking for the next generation of innovators who have demonstrated remarkable accomplishment and potential to positively affect the world.Learn more about the TED Fellows Program Nominate a TED-Ed educatorA primary focus of TED-Ed is to provide high-quality lessons taught by exceptional educators. If you or someone you know is an engaging educator, classroom teacher or expert in a subject area, please nominate them through our educator nomination form.Nominate an educator Recommend a TED-Ed animatorThe TED-Ed team is looking for excellent visualization artists who are interested in developing animations for our education videos on a freelance basis. If you are or know an animator interested in working with us, please let us know through our animator recommendation form.Recommend an animator"
