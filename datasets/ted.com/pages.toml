title = "Press and media information"
description = "How to get a press pass to TED? How to use a photo from the TED website? Can I interview Chris Anderson? This and other press and PR questions, answered."
full_description = 'Our OrganizationHow TED worksTED’s Curation GuidelinesGiving to TEDHistory of TEDJobs at TEDOur policies + termsTED Talks Usage PolicySolicitation DisclosureTED.com Terms of UsePrivacy PolicyTED Science StandardsTED Content GuidelinesTED’s Safeguarding PolicyCode of ConductContact usPress and media informationAbout › Our Organization › Contact us › Press and media informationPress and media contact informationFor press information, images and media resources about TED conferences, TED.com and TED Talks, please get in via our contact form (select "Press Inquiry" from the topic dropdown.)Press attendance at TED eventsTED invites a small number of requesting journalists to cover each conference. We give priority to proposals from journalists who:Work for media outlets capable of reaching large or influential audiencesHave a track record of insightful coverage in areas related to TEDHave a specific commission for coverage of the conference (not just of specific speakers or attendees)Some things to note:We take great care in filming TED for TED Talks. It is very rare that we invite outside cameras in, but we are happy to evaluate all requests for conference footageWe do not admit outside photographersWe are unable to consider press passes for freelancers without an assignment letter from the outlet for which you wish to reportInterested in covering a TED event? Press passes are limited, and press attendance will be considered on a case-by-case basis. Send in your name, the name of your media outlet, and your proposed area of coverage via our contact form (select "Press Inquiry" from the topic dropdown). Press decisions are generally made in the months preceding the conferences, and accepted attending press are notified approximately one month before each event.Photo requestsImage and photo requests must be accompanied by the following information:Name of publication/outletName of requested imagePublication datePreferred file formatDeadline for receipt of imageImage requests should be submitted via our contact form (choose "Press Inquiry" from the topic dropdown list) with the subject IMAGE REQUEST. A photo credit will be provided when the image is delivered, and this credit must run in full.Press requestsRequests for interviews should be submitted via our contact form (choose "Press Inquiry" from the topic dropdown list) with the subject PRESS REQUEST. Your request should include the following information:Name of publication/outletBrief background on your interview requestProposed publication dateYour deadlineRepublishing, embedding and linking to TED TalksWe encourage you to share TED Talks under the terms of our Creative Commons BY-NC-ND license. Read more about our Creative Commons BY-NC-ND licensing.For uses not covered by our CC BY-NC-ND license, see our TED Talks Usage Policy page for licensing, usage policies and common questions. To request the use of TED Talks, please fill out our TED Talks media licensing request form.For all other questions, please contact us.'
