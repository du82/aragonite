full_description = '''Watch › Watch TED-Ed videosThe TED-Ed project — TED's education initiative — makes short video lessons worth sharing, aimed at educators and students. Within TED-Ed’s growing library of lessons, you will find carefully curated educational videos, many of which are collaborations between educators and animators nominated through the TED-Ed platform.The art of the metaphorHow do metaphors help us better understand the world? And, what makes a good metaphor? Explore these questions with writers like Langston Hughes and Carl Sandburg.Watch the lessonQuestions no one knows the answers toIn the first of a TED-Ed series designed to catalyze curiosity, TED Curator Chris Anderson shares his boyhood obsession with quirky questions that seem to have no answers.Watch the lessonHow big is infinity?Using the fundamentals of set theory, explore the mind-bending concept of the “infinity of infinities” — and how it led mathematicians to conclude that math itself contains unanswerable questions.Watch the lessonThe art of the metaphorHow do metaphors help us better understand the world? And, what makes a good metaphor? Explore these questions with writers like Langston Hughes and Carl Sandburg.Watch the lessonQuestions no one knows the answers toIn the first of a TED-Ed series designed to catalyze curiosity, TED Curator Chris Anderson shares his boyhood obsession with quirky questions that seem to have no answers.Watch the lessonFeatured TED-Ed videos04:58Tony BuffingtonWhy are cats so weird?04:53Angela Koine FlynnThe science of skin color04:44Anita CollinsHow playing an instrument benefits your brain04:16Arleen SuganoThe physics of the hardest move in ballet04:34Claudia AguirreWhat would happen if you didn't sleep04:19Betsy SchwarmWhy should you listen to Vivaldi's "Four Seasons"?03:51Doug LevinsonWhat gives a dollar bill its value04:50Eleanor NelsenWould you sacrifice one person to save five04:06Emma BryceWhat really happens to the plastic you throw away07:01Eric LiuHow to understand power05:52Helen FarrellWhat is bipolar disorder04:30Janet IwasaWhy it's so hard to cure HIV/AIDS05:16Larry LagerstromEinstein's miracle year04:38Natalya St. ClairThe unexpected math behind Van Gogh's "Starry Night"04:29Matthew WinklerWhat makes a hero04:12Mikael ChoThe science of stage fright and how to overcome itView all TED.com featured TED-Ed videosExplore TED-EdWatch a lesson, customize a lesson, and explore TED-Ed's growing library of educational resources!About TED-EdLearn about TED-Ed's commitment to creating lessons worth sharing.'''
