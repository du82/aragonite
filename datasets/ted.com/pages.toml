["https://ted.com/about/programs-initiatives/tedx-program"]
title = "TEDx Program"
description = '''TEDx was created in the spirit of TED's mission, "ideas worth spreading." It supports independent organizers who want to create a TED-like event in their own community.'''
full_description = "About › Programs & Initiatives › TEDx ProgramTEDx is a grassroots initiative, created in the spirit of TED’s overall mission to research and discover “ideas worth spreading.” TEDx brings the spirit of TED to local communities around the globe through TEDx events. These events are organized by passionate individuals who seek to uncover new ideas and to share the latest research in their local areas that spark conversations in their communities. TEDx events include live speakers and recorded TED Talks, and are organized independently under a free license granted by TED. These events are not controlled by TED, but event organizers agree to abide by our format, and are offered guidelines for curation, speaker coaching, event organizing and more. They learn from us and from each other. More than 3000 events are now held annually.Organize your first TEDx eventBring the global TED experience to your community through a combination of live speakers and TED Talk videos.Before you startWhat you need to know before you apply for a license Apply for a licenseStart the application process to host your own TEDx event Attend a TEDx eventAttend a TEDx event near you featuring live speakers and TED Talk videos, sparking conversation and connections.Find an event near youPartner with TEDxWhen you support the TEDx program, you enable our efforts to empower and grow the global TEDx community of volunteers.Partner with TEDxAlready an organizer?Planning and designing a TEDx event is a big endeavor. Here's everything you need to help you organize your next TEDx event.Organizer guideGeneral instructions and best practices from experienced conference hostsResourcesA place where organizers can spark connection and peer learningWatch TEDx talksDive into our library of TEDx Talks - local speakers presenting to local audiences about everything from politics to pollination.Browse the library of TEDx talksSpeak at a TEDx eventLearn more about how TEDx organizers find their speakersSpeaking at TEDxFollow TEDx"
