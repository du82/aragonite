title = "Jobs at TED"
description = "TED is hiring! We're looking for friendly, curious, detail-oriented problem-solvers to join our small, collaborative team."
full_description = "Our OrganizationHow TED worksTED’s Curation GuidelinesGiving to TEDHistory of TEDJobs at TEDOur policies + termsTED Talks Usage PolicySolicitation DisclosureTED.com Terms of UsePrivacy PolicyTED Science StandardsTED Content GuidelinesTED’s Safeguarding PolicyCode of ConductContact usPress and media informationAbout › Our Organization › Jobs at TEDTED is a global community — and so is our staff. We are headquartered in New York but the collaborative and global nature of our work means we have staffers, advisors, and volunteers worldwide.View all openingsWho we areMission-drivenTED’s mission is to discover and spread ideas that spark imagination, embrace possibility, and catalyze impact. We open minds and inspire action through ideas, connecting people from every corner of the world. Our community prioritizes talking across differences and finding common ground. In 2024, TED content was watched and heard more than 1.89 billion times educating and inspiring the world. Our agenda is to make great ideas accessible to spark conversation and action. Everything we do is driven by this goal because we believe ideas change everything.Values-orientedOptimism We believe tomorrow is full of possibility and can be better than today. We are open to amplifying ideas from anyone, anywhere that inspire us to create the future we want to live in.Vision We value ideas and individuals that are forward-looking. We celebrate a sense of wonder and discovery. And we share what we find as an invitation for people to never stop learning.ImpactWe strive to see change at all magnitudes. We believe a great idea can change someone’s perspective, daily ritual, or even life. We also believe the right idea can bring people together to change the world. Committed to talent developmentOur global team is the talent behind TED’s transformative content, events, conferences, and programs. We are audacious in our thinking, open, and curious about ideas. Learning and Professional Development are priorities as we support career growth for staff through tools like the IDP - Individual Development Plan, TED’s Mentorship Program and Learning Series, LinkedIn Learning, and the TED@Work Learning Program.Intentional about culture & connectionTED has an incredible Culture Committee creating opportunities for engagement & connection, bringing our global team together virtually throughout the year, and in person during Core Weeks in NYC. Our All Hands Meetings are quarterly, produced TED-style in our theater at TED HQ, and shared virtually for employees tuning in remotely. All Hands are an opportunity for the entire org to come together to share program updates, innovations, exciting news about our conferences and events, and more.All-Staff Week offers a meaningful opportunity to celebrate shared successes, strengthen team bonds, and prepare for the year ahead. This week features staff presentations, professional development workshops, and social gatherings. Typically held at the end of Q4, it is a special way to connect before our winter break. Cultivating an Inclusive WorkplaceNot just talking. DoingTo ensure a dynamic employee experience for our global team, we partnered with Stanford SPARQ, a “do tank” housed at Stanford University. Using insights from behavioral science, SPARQ helps industry leaders reduce disparities and bridge divides. SPARQ is co-led by Dr. Jennifer Eberhardt, a 2020 TED speaker and the author of Biased: Uncovering the Hidden Prejudice That Shapes What We See, Think, and Do. With SPARQ, we set out to reduce bias and increase inclusion in how employees experience the work environment, and in aspects of our work. We’ve made a habit of disrupting business as usual by applying useful friction to help us pause, reevaluate and redesign our processes in pursuit of a more inclusive workplace. With SPARQ, we formed two “do tanks” made up of TED staff across teams — one focused internally on the employee experience and internal processes, and another focused externally on aspects of TED’s work. Out of the “do tanks” came transformative recommendations that benefit all TED employees. Employee Resource GroupsTED ERG’s are staff-led groups that support belonging, fellowship and allyship. Anyone is welcome to participate in ERG’s. Active ERG’s include: YoPro@TED:TED’s newest ERG is a voluntary group for Young Professionals and allies of Young Professionals. The group exists to foster a welcoming culture, career development, and cross-team learning for early-career employees. Queer@TED: Queer@TED is a voluntary group for TED staff who are members or allies of the LGBTQIA+ community. This ERG is a forum for support and advocacy. Perks + Benefits Stay healthyTED offers health, dental, vision, disability, + life insurance with a FSA, EAP, mental health resources + more Put family firstWe support employees with 12 weeks of paid parental leave Save for your futureRetire well with our 401k program, matching and the option for traditional or roth contributions Commute affordablyUS employees can purchase pre-tax commuter and parking passes through WageWorks Experience TEDWatch all of TED’s past Conferences from the comfort of your laptop with your TED Live subscription Take time offPrioritize wellbeing and restoration with flexible paid time off. Decide for yourself when to take time off throughout the year Ready to join us?Spreading ideas starts with you. Find jobs at TED HQ and around the world.View all openings"
year_published = 2025
