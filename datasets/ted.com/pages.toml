["https://ted.com/about/programs-initiatives"]
title = "Programs & initiatives"
description = '''TED's mission of "Ideas Worth Spreading" reaches far beyond the conference and video series, encompassing a variety of projects and initiatives that leverage the power of ideas -- learn more.'''
full_description = '''About › Programs & initiativesTED's mission of "Ideas Worth Spreading" reaches far beyond the conference and video series, encompassing a variety of projects and initiatives that leverage the power of ideas.How we spread ideasTED TalksTED Talks is our flagship video series of great talks and performances, filmed at TED conferences, independent TEDx events and on other stages worldwide.TED Audio CollectiveTED brings ideas worth spreading to the world of audio, with a growing collection of original podcasts. TEDx ProgramThe TEDx program lets individuals, organizations and communities worldwide hold local, independent TED-like events. To date, more than 13,000 TEDx events have been held in 150 countries.TED TranslatorsThe TED Translator program invites volunteers worldwide to subtitle TED Talks. To date, over 70,000 volunteers have created more than 250,000 translations in 100+ languages.TED in your languageExperience TED Talks like never before. With cutting-edge AI dubbing, we’re breaking language barriers and making our talks accessible to audiences worldwide.TED en EspañolDiscover TED Talks in the Spanish language. TED en Español is designed to develop content and community in the Spanish-speaking world.بالعربي TED | TEDinArabicTEDinArabic is a global platform designed to identify and amplify original voices and TED content from the Arabic-speaking world. Created in partnership with Qatar Foundation. How we catalyze impactThe Audacious ProjectThe Audacious Project is a collaborative experiment to put bold ideas for social change into action, by funding them at scale. TED Fellows ProgramThe TED Fellows program invites innovators from around the globe to become part of the TED community, and amplifies the impact of their remarkable work.TED DemocracyAs democracies worldwide face mounting challenges, communities across the globe are mobilizing to reform systems and reignite civic culture. TED is excited to bring these voices together to spark a new kind of conversation around the globe – focused on realistic pathways towards a more vibrant and equitable future. TED CountdownTED Countdown champions and accelerates the bold ideas and underinvested solutions that can bring us closer to achieving a zero-carbon world – one that is cleaner, healthier and fairer for all. TED Countdown is a partnership with Leaders’ Quest.How we help solve business problems (big and small)TED InstituteThe TED Institute helps organizations unlock institutional knowledge and surface innovative thinking. TED PartnershipsThe TED Partnerships team works with the world's leading corporations and foundations to connect the TED content and audience to their missions.TED@WorkTED Talks reimagined for workplace learning: includes powerful talks with practical tools to activate ideas in your organization. How we nourish learners and thinkersTED-EdTED-Ed offers original, animated video lessons — to watch online or use in the classroom. Educators can use the TED-Ed website to take any video and build a customized lesson around it. TED Talks in the English classroomWith National Geographic Learning programs with TED Talks, learners of English experience their world through the stories, ideas, photography and video of National Geographic and TED.TED CoursesTED Courses are four-week online courses taught by a TED speaker. Connect with a global community of lifelong learners and move through a beautifully crafted course that will help provide the inspiration, knowledge and skills you need to thrive.TED MasterclassMaster the skills of TED speakers with TED Masterclass. TED's official public speaking course will teach you how to identify, develop and share your best ideas with the world, either as an individual, a business or an educational organization. How we nurture communityTED ConferencesTED conferences showcase important research and ideas from all disciplines and explore how they connect. The format is fast-paced: 50+ talks over the course of three days to a week, in addition to interviews, debates, workshops, interactive exhibits, evening events and parties. Industry leaders and impactful people gather for a unique experience — which attendees have described as "the ultimate brain spa" and "a journey into the future in the company of those creating it."TED MembershipTED Members can access exclusive live events with TED Speakers, network with a global community, enjoy ad-free TED podcasts, and get special deals on new TED offerings. Membership contributions keep TED Talks accessible for all.'''
year_published = 2025
clearnet = "https://ted.com/about/programs-initiatives"
