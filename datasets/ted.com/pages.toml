["https://ted.com/series"]
title = "TED Series"
description = "TED is a nonprofit devoted to Ideas Worth Spreading - through TED.com, our annual conferences, the annual TED Prize and local TEDx events."
full_description = "Series › TED SeriesFeed your curiosity with new TED series that go deeper into fascinating topics -- from the everyday objects that changed the world, to cutting-edge neuroscience on a shoestring budget. TED IntersectionsTED Intersections features thought-provoking conversations between experts navigating the ideas shaping our world. New episodes weekly.Watch now TED Talks on DemocracyDemocracy is an ever-evolving work in progress — and it's far from finished. Explore powerful ideas from leaders imagining, building and sustaining a brighter democratic future. (Made possible with the support of Visit Philadelphia)Watch now CountdownCountdown is a global initiative, powered by TED and Future Stewards, to accelerate solutions to the climate crisis. The goal: to build a better future by cutting greenhouse gas emissions in half by 2030 towards reaching net zero by 2050. Watch now TED Explains the World with Ian BremmerTED Explains the World with Ian Bremmer dives into complex geopolitical issues to explore what really matters in the critical news stories of the day. This special series — a partnership with political scientist Ian Bremmer, president and founder of Eurasia Group and GZERO Media — takes us behind the scenes of global affairs to offer a more comprehensive understanding of the news than soundbites could ever offer.Watch now In the Green: The Business of Climate ActionBusinesses across the world are committing to measurable climate action -- but what exactly are they doing, and why? In this TED series, meet senior leaders from around the business world and learn important lessons about carbon emissions reduction that can be applied to workplaces everywhere. (Presented by TED Countdown and The Climate Pledge)Watch nowAm I Normal? with Mona ChalabiIn this TED original series, endlessly curious data journalist Mona Chalabi investigates the research behind tricky questions - with the help of creative data visualizations.Watch now Body Stuff with Dr. Jen GunterThis TED original series dives into the truth about how your body really works. Want to hear more from Dr. Jen Gunter? Check out her podcast Body Stuff, from the TED Audio Collective.Watch nowYour Money and Your MindManaging your money can feel scary and complicated — but it doesn't have to be. In this new TED series, behavioral scientist Wendy De La Rosa explains why we spend too much and save too little and shares easy steps to help us achieve a more secure financial future.Watch now Sleeping with ScienceSleep scientist Matt Walker uncovers the facts and secrets behind our nightly slumber. Tune in for better zzz's!Watch nowThe Way We WorkThe Way We Work is an original video series where leaders and thinkers offer practical wisdom and insight into how we can adapt and thrive amid changing workplace conventions.Watch now TorchbearersA collaboration between Great Big Story and TED, this series reveals the incredible things that happen when someone unveils an idea so inspiring it moves others to act. Watch the stories of people whose lives have been intrinsically changed by the idea in a TED Talk.Watch nowDIY NeuroscienceWatch science in action in this original TED series about cutting-edge neuroscience experiments on a shoestring budget.Watch now Small Thing Big IdeaThis original TED series celebrates the lasting genius of everyday objects so perfectly designed that they changed the world around them.Watch now"
