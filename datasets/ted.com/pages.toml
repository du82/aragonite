["https://ted.com/about/programs/ted-ed"]
title = "TED-Ed about"
description = "TED-Ed - TED’s education initiative - sparks and celebrates the ideas of teachers and students around the world. TED-Ed serves millions of teachers and students every week with its original videos, interactive lessons, student clubs, and more."
full_description = "TED-EdTED-Ed's mission is to ignite curiosity and amplify the voices of learners and educators worldwide. In pursuit of this mission we produce award-winning educational animations in multiple languages and host life-changing, in-person programs for students, teachers and learners of all ages.Visit TED-EdFeatured TED-Ed AnimationsSee all TED-Ed AnimationsSocial StudiesThe forgotten queen of EgyptHistoryThe genius of Marie CurieSocial StudiesThe hidden life of Rosa ParksBy the numbersTED-Ed's commitment to revolutionizing education is reflected in our metrics. These numbers highlight our extensive global reach and our impact on educators and learners worldwide. Here are some key metrics that reflect the breadth and depth of TED-Ed's impact on learners and educators worldwide:2M+TED-Ed Animation views per day 5.39BViews-to-date 1600TED-Ed Animations published 1M+Educators using TED-Ed in classroomsFour ways you can experience TED-EdTED-Ed offers diverse pathways to explore and expand knowledge. Our unique features create engaging, innovative educational experiences for a wide range of learners and educators. These include award-winning animations, empowering student and educator programs, and a resource-rich website.TED-Ed AnimationsTED-Ed Animations bring educators' best lesson to life through professional animation, sparking curiosity in hundreds of millions of learners worldwide every year. We release new videos weekly, cover a wide range of subjects, and the animations are also made accessible in multiple languages. These free, high-quality animations captivate a global audience, with each video averaging over 250,000 viewers within four days of publication, and over one million viewers per year.Explore TED-Ed's library of animationsNominate an educatorTED-Ed Student TalksThe TED-Ed Student Talks program provides educators a free, customizable curriculum that supports students in identifying, developing and sharing their ideas with each other and the world. Over 40,000 Student Talk groups have been created to date, and this rapidly-growing program serves student and educators in over 130 countries!Learn moreTED-Ed Educator TalksTED-Ed Educator Talks is a professional learning program that showcases innovative ideas from educators. With 132 participants from 32 countries, it impacts 139,000 students weekly. Select participants become TED-Ed Innovative Educators (TIEs), serving as ambassadors who use technology to inspire curiosity and support peers.Learn moreTED-Ed websiteThe award-winning TED-Ed website sparks curiosity by allowing users to discover and create custom lessons around any online video. It offers TED-Ed Animations, TED Talks, interactive lessons, and access to Student and Educator Talks. This free platform inspires learners to explore and share big ideas through TED-style presentations.Explore TED-EdNewsletter sign upTED-EdDaily animations for the constantly curiousDailyWeeklySubscribe Now"
year_published = 2025
