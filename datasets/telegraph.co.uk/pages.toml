["https://telegraph.co.uk/cars/features/450mph-speed-record-frictionless-water-travel"]
title = "The 450mph speed record that could pioneer frictionless travel on water"
description = "It’s spectacularly dangerous, but might former land speed record-holder Richard Noble’s latest venture revolutionise how we travel?"
full_description = "Life Cars The quest to set a 450mph speed record could pioneer frictionless travel on water It’s spectacularly dangerous, but might former land speed record-holder Richard Noble’s latest venture revolutionise how we travel? Save Comment speech bubble icon Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Andrew English 01 March 2025 11:00am GMT Related Topics America's Cup, Land speed record, Lake District, 20th-century history, Aviation 01 March 2025 11:00am GMT Save Comment speech bubble icon Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Richard Noble held the land speed record between 1983 and 1997, and now, aged 79, is heading a team attempting to break the water speed record Credit: Niklas Halle'n/Getty Andrew English 01 March 2025 11:00am GMT You might wonder how it is that Richard Noble OBE, entrepreneur and holder of the land speed record (LSR) between 1983 and 1997, is now, at the age of 79, considering a tilt at inspiring the fastest person on water.Surely this consummate record-breaker should be settled back enjoying his trophies and a mug of Horlicks, rather than heading up a team aimed at another record? After all, he played such a crucial part in the Thrust SSC record of 763.035mph in 1997 and its almost-but-not-quite LSR successor, Bloodhound.The water speed record (WSR) of 317mph has stood for the past 46 years, held by Ken Warby and his Spirit of Australia hydroplane.The clue comes in Noble’s autobiography, Take Risk!, in which he reveals that when he was six he saw and was inspired by three-times land speed record-holder John Cobb’s Crusader WSR boat on Loch Ness in 1952. “This started me on a quest for the land-speed record,” he writes. (The history of record-breaking on water, including Cobb’s Crusader, is detailed below.)He’s far from starry-eyed about the dangers of such a project, which are horrendous. Water is around 800 times more dense than air, so hitting it at any speed is extremely hazardous, often fatal. It’s almost never flat, with imperceptible swells and waves that can deflect a craft, while it can also contain semi-submerged hazards or pockets of different density, which can cause instability.Seven of the 13 people who have attempted to break the WSR since 1930 have perished in the attempt; the only men who tried to beat Warby’s 1978 record, Lee Taylor in 1980 and Craig Arfons in 1989, died in the process. In short, Warby is the only man to have exceeded 300mph on water and survived.With a target of 450mph, has Noble finally met his match, or is the prize of almost-friction-free travel over water too valuable not to at least have a go at it?Other WSR effortsThere are currently three other record attempts, all planned with hydroplane hulls. The first is the spiritual successor to Warby’s Spirit of Australia, Spirit of Australia II, which was commenced by Ken Warby with his son David, who continued the work after the death of his father, aged 83, in 2023. The craft has more than twice the power of its predecessor thanks to its Rolls-Royce Orpheus 803 jet and plenty of potential. Motor Boat and Yachting magazine reported in autumn of 2024 that Warby, having achieved 260mph in testing, had experienced a bird strike into the engine’s turbine blades, which put things back.Quicksilver is a UK effort led by Nigel Macknight, which started as a partnership with Ken Norris, the designer of Bluebird K7 and doyen of speed record-breaking. It’s a stepped hydroplane design with input from high-speed boat designer Lorne Campbell and aerodynamicist Mike Green, powered by a Rolls-Royce Spey jet engine. Things have been quiet on the project for a few years as Covid and personal tragedy affected the team, but it’s far from dormant.“The water speed record is really, really difficult and dangerous,” comments Macknight, “and I’ve every respect for Richard Noble’s effort. I don’t really see these things in terms of rivals, as it’s not helpful, but while we’ve lost momentum, we’re hopeful and optimistic.”Another British project, Longbow, is under construction at Blackpool, Lancashire. Its project manager, David Aldred, was interviewed by BBC North West in January this year. He worked on the restoration of Donald Campbell’s 1950s Bluebird K7 and helped source a new engine for the craft prior to its planned return to Coniston Water next year.Standing in front of his twin-engined, wood-framed hydroplane, he said: “Unlike the land speed record, which is done in the desert and is just a YouTube video, this will be done in the Lake District, where you can come and see it, skimming across the water, with a guy putting his life on the line, to get the record for Britain.”Embracing riskUndeterred by rivals or risk, Noble is pressing on. He has little truck with what he sees as an aversion to risk in the UK Government and companies, asserting that taking on “really big risks is the way to succeed”.“‘Highly dangerous’ for us is ideal, and we offset that risk with design and innovation,” he says.If it sounds crazy, the track record of the Thrust and Bloodhound teams is of brilliant and innovative design along with extensive research backed by solid data and meticulous safety, all of which resulted in the LSR for ThrustSSC and a top speed of 628mph for Bloodhound in November 2019. Noble’s Bloodhound team reached a top speed of 628mph in South Africa in November 2019 Credit: Rodger Bosch/AFP Yet achieving more than 300mph with the current hydroplane technology is at the extreme pointy end of dangerous, as the Thrust WSH team has found out.They had access to the work of previous WSR pioneers, which helped them to understand the critical role of the pressure under the nose of a record-breaking craft at high speed. Two years of combined computer fluid dynamics (CFD) work by QinetiQ on hydrodynamics (the parts in the water and the water itself) plus aerodynamic research at University of Leeds and Imperial College (the bits above the water) showed that the Thrust WSH hydroplane was theoretically capable of 450mph. But there was a major issue.Noble explains: “One of the things we’ve learnt from previous projects is that while following an existing design approach might bring small gains, it’s hard to know how close that takes you to the limit of that design approach. Back in 1983 we took the LSR at 633mph with Thrust 2. After years of hard graft, the car worked well and did the job, but back then the ability to collect onboard data and analyse it quickly was still limited, so the real analysis took place later. We discovered that at peak speed Thrust 2 was within 5mph of flying.”While at 300mph Campbell’s Bluebird K7 of the 1950s had a safe variation of angle of four degrees, the Thrust WSR team calculated that at 450mph that angle was reduced to just one degree. It was simply too dangerous, so the team has abandoned a hydroplane design in favour of a hydrofoil.Hydrofoil technology and beyondThese winged designs, which push the boat out of the water, have come to the fore in foiling yachts in The America’s Cup, but a hydrofoil has held the WSR in the past: Alexander Graham Bell (the inventor of the telephone) and Casey Baldwin built the HD-4, powered by twin Liberty aero engines, which set a record of 70.86mph in 1919.Yet that was about the limit of the hydrofoil. The issue with hydrofoils is that at more than 70-80mph, with sufficient angle on the foil, the water releases its compressible vapour initially into the low-pressure regions above the foils, then all around the foil and the lift disappears. The foil effectively stalls and the drag increases hugely. The process is known as cavitation and it’s the bane of record-breakers, as well as the more conventional racing yachts that compete in series such as the America’s Cup.But some yacht designers such as Butch Dalrymple-Smith think that super-cavitation effect can be harnessed and made to work at high speeds, maintaining lift but reducing drag. Such foils have been intensely studied in 50 knot-plus sailing yacht design. Pioneered by marine designer Vosper, super cavitation is also used in the design of high-speed military boats and submarines and their propellors to reduce drag, wear and the possibility of detection. Team Thrust built a quarter-scale model called C3.2B capable of over 200mph to validate its ideas for high-speed boats Thrust WSH has now built a quarter-scale model called C3.2B (the smallest size to glean proper modelling data according to Andrew Bradley, the team’s technical director), with the aim of validating the team’s ideas. It should attain 200mph-plus, driving itself autonomously while performing many calculations per second to maintain the pitch and elevation of the four super-cavitating foils as well as the craft’s direction.The craft’s four foils are an incredibly complicated design and “really sharp and carried in leather bags so they don’t get damaged or cut you,” says Noble.To prevent any mishaps, the model will be geo-fenced to prevent it escaping the test area (“Besides, we won’t give it enough fuel to do any damage,” says Bradley).“It’s very early days,” admits Noble, who says that without the right signs of progress the project might have to be abandoned altogether.While it’s easy to dismiss the whole WSR and Thrust WSH’s involvement as pointless, it’s far from it. This is at the cutting edge of travel on water. Imagine a ferry from Dover to Calais that could cover the 20-odd miles in five minutes or less, or a fast-attack naval vessel capable of 100mph. And unlike hideously expensive 300mph-plus Maglev trains (or indeed, Elon Musk’s plan for a Hyperloop), which demand massive and expensive infrastructure, maintenance and elevated or buried tracks, not to mention the electromagnetic radiation they create, a super-cavitating hydrofoil ship is self-sustaining, requiring only its foils and quick-computing and foils to skim over the water.Education projectAnd, as with the Bloodhound LSR project, if you don’t know about it, your children certainly will, as the team aims to release the complicated data in a form which schools and universities can study and add to.And, given the nature of the prize, there will be other eyes on Thrust WSH’s progress in these early tests, from passenger-ferry designers to military boat specialists.The history of record-breaking on waterIn the early days, water speed records were held by steam-driven craft with conventional, full-displacement hulls, such as Nathanael Herreshoff’s Stiletto, which set a 26.2mph record in 1885.By 1897, however, technology had moved on with Charles Algernon Parsons’ 39.1mph steam-turbine-powered Turbinia.Petrol engines brought huge advances in lightweight horsepower along with partial displacement design such as planing hulls and hydroplanes.The quest for speed was spurred by events such as the Harmsworth Trophy, a prize awarded from 1903 by Sir Alfred Harmsworth (later Lord Northcliffe) to encourage high-speed-powered craft.Record-breaking was cut short during the First World War, even if engine design took several steps forward during hostilities. In 1911, Clinton Crane’s Dixie IV had set a record of 45.21mph and in 1920 Garfield Wood set the first of a long series of records with Miss America at 74.97mph – in only a quarter of a century, they had raised speeds by almost 50mph.Wood built 10 Miss America record-breakers, winning the Harmsworth Trophy nine times (eight as a driver, one as an owner) and setting the world WSR on several occasions. All had outlandish V12 or even V16 internal combustion engines. Donald Campbell died with his Bluebird jet flipped at over 300mph on Coniston Water in January 1967 Credit: PA These powerful beasts were still dangerous, though, as shown in June 1930. The British land and water speed record pioneer Sir Henry Segrave, after setting a two-way average record of 98.8mph in his Rolls-Royce-powered Miss England II, was trying to raise the record still farther and flipped during the attempt. Segrave survived just long enough to ask the fate of his crew (his co-driver received fatal injuries) and receive the news of the new record.These were the last of the mono-hull craft, however, as following the Second World War the science of engines and hull design moved on again – as did the death toll.The jet eraSir Malcolm Campbell had shown the effectiveness of the low-drag hydroplane before the war, but it was Ted Jones’s Slo-mo-shun IV which showed the true effectiveness of the hydroplane, running with its propellor only partially submerged. Powered by a 1,800bhp Allison aircraft engine, in 1952 it attained a WSR of 178mph.Again, though, the grim reaper was never far away. Italian silk factory owner and experienced hydroplane racer Mario Verga was killed two years later in October 1954, piloting his beautiful hydroplane Laura 3, which was powered by two twin-supercharged 1.5-litre straight-eight engines from Alfa Romeo’s grand prix racing cars. He got into trouble at about 190mph on Lake Iseo in Italy and was thrown out of the craft when it took off.Malcolm’s son Donald, already a LSR holder, had been experimenting with Blue Bird K4, but it was another LSR holder, John Cobb, who built Crusader, a stepped hydroplane powered by a de Havilland Ghost turbojet engine. The craft achieved more than its expected speed of 200mph on Loch Ness in September 1952, but in the process broke a front spar, causing the machine to flip, killing Cobb.Donald Campbell had built Bluebird K7 and set seven separate WSRs before that fatal day in January 1967 on Coniston Water, where he attempted to push the record farther but at more than 318mph hit a period of instability which flipped the craft, killing him.Yet still they came… Californian boat racer Lee Taylor set a new world WSR of 285mph in June 1967 in his craft Hustler, but had been severely injured in previous attempts to beat Campbell’s record. Then came Warby’s 317mph effort that currently stands. Over to you, Richard Noble… Join the conversation Show comments The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Related Topics America's Cup, Land speed record, Lake District, 20th-century history, Aviation License this content You need to be a subscriber to join the conversation. Find out more here. Log In Subscribe Advertisement More stories"
