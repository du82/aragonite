["https://telegraph.co.uk/about-us/privacy-and-cookie-policy"]
title = "Privacy and Cookie Policy"
description = "Follow us on:"
full_description = "Privacy and Cookie Policy Save Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email 29 September 2024 10:00am BST Save Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Your privacy is important to us. If you are visiting our Service from the United Kingdom, European Union, or other non-U.S. location, please review our General Privacy Policy. If you are visiting our Service from the United States, please review our U.S. Privacy Policy. UK and General Privacy and Cookie Policy About us The Telegraph Media Group is comprised of Telegraph Media Group Holdings Limited, Press Acquisitions Limited, and each of their respective subsidiaries. You can find our contact information here. The Chelsea Magazine Company Ltd (“CMC”) is also part of Telegraph Media Group of companies, and you can visit their dedicated privacy policy here Telegraph Media Group is also responsible for our website www.telegraph.co.uk, and whether you browse as a guest or register with us we will collect different types of information about you: for example, for website functionality; to provide improved or personalised services to you; to help decide what kind of advertising you will see on the site; and, in accordance with your chosen preferences, to market goods or services to you. Please also see our website terms and conditions. We are not responsible for the content or privacy practices of external sites, third party Apps or your chosen internet browser. However, we do seek to explain how we work with third parties, including search engines and ad servers such as Google. You can see Google’s Privacy Policy here. We also offer a number of services to our readers and other customers, trading under different brands. You can see Our Brands and their respective Service Providers at the end of this Privacy Policy. When we collect your information we may share it across our Telegraph Media Group companies. This Privacy and Cookie Policy explains how we use any of your personal information we might collect and how you can limit our use of it. 1. What information do we gather? The information that we gather falls broadly into two types (please see further below for how we collect it and what we use it for): 1.1 Information that relates directly to you (e.g. your name, your email address and contact details, communication preferences and customer history). 1.2 Information that does not directly identify you (e.g. how you might browse our website), specifically: (1) Your IP address through the placement of cookies; and (2) Location data, which might be gained through your postal address (where you have provided this to us), IP address or GPS data (see Section 3 (4), below). (3) Information from your browser such as screen size, browser type, device type and pages viewed Please note that not all cookies are either personally identifiable information or even unique identifiers; but some can be, while others can influence what you see on our website and others (see Sections 6 and 7 on cookies and their management, below). 2. How we use your information 2.1 When we seek your permission. Often we will be using your information in accordance with your specific consent or instructions: for example, because you have requested or consented to receiving certain information, or entered into a contract with us (or one of Our Brands) for goods and services: see Section 2.2 below. At other times we will use your information on one of the other lawful bases described below in this section. 2.2 Contract. (1) When you enter into a contract for goods or services with us (including competitions, offers, subscriptions or your online Telegraph account), or where you wish to register an interest in doing so, we will use your personal data to enter into and fulfil our contractual relationship with you. (2) Fulfilling our contract with you means being able to manage and administer our services, and maintain our standards of tailored service levels, customer care and consumer compliance. This might include fulfilling orders or returns, processing payments or refunds, and providing aftercare, as well as improving your customer experience online and otherwise, including by monitoring service levels and responding to feedback. This may include sharing your details (such as name and address) with our payment providers to enable them to verify credit details related to payments and validate payment authenticity. Our providers may retain payment details to enable efficient renewal and re-subscription processes for our products and services. 2.3 Legitimate interests. Other uses of your information are made for ordinary and transparent purposes which we think are necessary for our legitimate interests as a provider of news, content, and other services (including when working with Our Brands). We use your information on this basis to do the following: (1) Recognise and remember you when you visit our website and better understand how you use our website and others by using cookies to follow your use. We explain what cookies are in Section 6 and how you can manage them in Section 7, below; (2) Recognise and remember you when you use a Telegraph application (“Telegraph App”), to analyse how you use it and to serve you with advertisements based on your interests. Section 3.1 (4) explains how we gather this information; (3) Serve you advertisements on selected, third-party websites that make their advertising space available to us. We call this “Audience Extension” and we do this either by means of using retargeting cookies and similar technologies (we explain what cookies are in Section 6 and how you can manage them in Section 7, below) or by matching other unique identifiers, subject to appropriate safeguards and preferences for the purposes of serving you targeted advertisements and for running website analytics. One such example is when we use Facebook’s Custom Audience feature (although other sites may offer similar services). Custom Audiences enable us to display personalised advertising to our customers whilst they are on Facebook, or your information may be used to create lookalikes of similar audiences for targeting. This information is matched on a pseudonymised basis without leaving our servers. Facebook does not receive any new information from us about you except as necessary to fulfil our instructions to serve relevant advertising as our data processor, and if you are not an existing Facebook customer then Facebook will not see any of your personally identifiable data (please see this link for further information). You can opt out of your data being used in this way by contacting data.protection@telegraph.co.uk. You can manage your Facebook advertising preferences by visiting facebook.com/adpreferences/data; Serve you advertisements on our own website that are tailored to you or a group similar to you, where we make advertising space available to carefully selected third parties. This is subject to appropriate safeguards and your preferences around us serving you targeted advertising. (4) Identify your interests. We might then put your information in aggregated form into groupings (known as “segments”) by a particular audience, which means we can serve you advertisements and offers that will interest you within the website, including by reference to data we receive from third parties. These advertisements and offers can be for our own products and for those of third parties. Please see Sections 6 and 7 for more information about cookies and how we serve you more targeted messaging; (5) Keep you updated on any services you have subscribed to, or any products you have purchased, and/or about similar services unless you have told us otherwise (including where we are working alongside other Service Providers to provide these services, such as travel or insurance, as detailed in the Our Brands section); (6) Contact you to let you know about any of our products, services or promotions (which may in some cases be provided by third parties), including by email, mail, telephone, app push notification or SMS text message, always having regard to data protection legislation and your preferences. Please see Section 4 to understand more about how you provide and can manage your preferences. (7) Contact you directly or via social media in relation to any competitions and/or prize draws you have entered. (8) Contact you, or have one of our trusted third party research partners contact you, for market research purposes, for example to ask you to participate in a survey. You can notify us if you no longer want us to contact you in this way. If you do choose to participate in a survey or where you choose to join Telegraph’s Contributors panel to participate in surveys, we will only use any data you provide under the survey in an anonymised and aggregated format. We may work with and share certain information with our trusted third party research partners, such as information about your subscription, so that they can engage you in research projects that are most relevant to you. Where we do, we will ensure that we enter into appropriate protections under contract to protect your information. You can notify us at any time if you do not wish this data to be shared in this way. You can see the Telegraph Contributors Panel privacy policy here (9) Make sure materials on the website or in apps are presented in the most effective way for you and your computer or mobile device; (10) Collect and log numeric internet addresses to improve the website and to monitor website usage; and (11) Assess and understand our readers’, customers, site users' and account holders' feedback and identify usage hotspots; (12) To analyse browsing information and cookie data using machine learning, for example to determine which subscription offers might be of most interest to you or which content or articles you would most like to see. 2.4 Some limited uses of your data are required to comply with legal obligations, such as fraud detection and taxation. For example, we may receive and use certain data from third party payment providers (such as PayPal and GooglePay) when you purchase a subscription from us, to ensure we are compliant with local tax regulations; 2.5 Our core activities as a media and publishing organisation, on paper or online, are classed as special purposes (which includes journalism and the arts). Please be aware that we are subject to a series of exemptions from data protection law when processing personal data for these purposes, and such purposes are not relevant to this Privacy Policy unless expressly stated. 2.6 We occasionally work with partners to compare their customer database to ours. This is called “data matching” and it allows our partners (such as other brands) to see if they can reach their audiences on our platforms. This will usually be carried out at an aggregated group audience level rather than on an individual level basis, although your information may be used to generate these insights. These insights may show, for example, if there is an overlap between our audiences and our partner’s audience and other information to help understand whether an advertising campaign would be effective. We may also work with partners to build ‘lookalike’ audiences that are similar to our partners’ existing audiences, for targeting. An example of this may be a restaurant brand that wants to advertise to “food and drink enthusiasts” or “restaurant goers”, and so wishing to select an audience who we have identified as having interests in these ares. We would do this by segmenting our audiences into groups based on what they seem to like and similar behaviours. The restaurant is then able to identify a relevant audience, which means we can show you advertising that is relevant to you. 3. How do we gather information? 3.1 Information (as set out in Section 1) is gathered in the following ways: (1) indirectly (e.g. from third party data providers or by using website technology that tracks and administers your visits through your browser, or similar technology when you use a Telegraph application (“App”) on a mobile device, or when you log on and/or share stories through social media; (2) directly (e.g. when you buy a subscription, sign up to create a telegraph.co.uk profile, download a mobile device application or you otherwise provide your information when you interact with us, for example by telephone, email, or live chat); (3) through your device (e.g. mobile, PC or tablet) where you have enabled location services for the applicable App or browser. This may be used for location targeted services or advertising in accordance with your preferences, which may be adjusted either on your device or via server, App or website preferences; (4) through location technology for mobile web services. The service we use is based on machine learning algorithms which analyse data from different connection types. These include fixed http and https connections, location consent requests on https sites and from mobiles Apps using https connections. More information is available here. You can opt-out of this service here; (5) through social media sign-on. We offer a quick registration option using your existing social media accounts via an App or the website. If you log in to our sites using a social media account, you are granting permission to that social media company to share your user details with us, and to collect information about you and how you use our site (which process we do not control and will be subject to the terms and conditions of your social media account). This will include that social media company tracking or identifying when you share one of our stories through their site. When you use social sign-on, we will gather the information you have already used in the process of registering for that social media site (in accordance with your preferences provided to that site and/or to us at the point that you use our social sign-on) and your social media account will be linked to your Telegraph account, including in our providing social media messaging to you (See Section 5.2, below on de-linking accounts); (6) when you subscribe to The Telegraph, we may also use a card updater service to automatically update your credit or debit card details. This service is facilitated by your credit or debit card issuer, whom you should contact for further information; (7) in the past we may have obtained certain additional details through a telephone number appending service where we have had contact details for you but did not have your phone number or needed to update your phone number (but would not use phone numbers that are gathered this way where those numbers are registered with the Telephone Preference Service). We no longer append data in this way; and (8) we may also overlay additional demographic and lifestyle data from CACI (w"
