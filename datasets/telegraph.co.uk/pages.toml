["https://telegraph.co.uk/family/life/brushes-with-death"]
title = "My six brushes with death – and how I survived them"
description = "Carren Meikle has faced a fireball on the road and nearly fallen out of a plane... but what have her near misses taught her about survival?"
full_description = "My six brushes with death – and how I survived them Carren Meikle has faced a fireball on the road and nearly fallen out of a plane... but what have her near misses taught her about survival? Save Comment speech bubble icon Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Carren Meikle 01 March 2025 2:00pm GMT Related Topics Airline industry 01 March 2025 2:00pm GMT Save Comment speech bubble icon Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Carren Meikle standing next to her boyfriend’s light aircraft Carren Meikle 01 March 2025 2:00pm GMT Every day we face potential threats to our lives. A trip on a kerb as a juggernaut approaches, an unwise cut through a park late at night, or a wobble on a bicycle on a busy road: all of these things could prove fatal. Happily, most of the time we all emerge unscathed from risky situations, like cats with nine lives.But sometimes, death comes so close we feel lucky to have survived. We say a silent prayer of thanks to God, or our lucky stars, or whoever we believe in and continue on our way – like the 80 people on board the Delta Airlines flight which flipped on landing last week. “I was so surprised that I was alive, because when we hit the first time, I thought that’s it,” said Gerald Volkman, a passenger on board.I know how those passengers feel. Because in my life, I’ve had what I consider an unusual number of brushes with death – although perhaps not quite as many as novelist Maggie O’Farrell, whose book I am, I am, I am, recounts her 17 near misses. I’ve seen a car explode into a fireball in front of me, nearly fallen out of a light aircraft and narrowly escaped a potential house fire caused by a slow-burning electrical fault.What I’ve discovered is that at the moments of greatest peril, I have remained surprisingly calm – despite the fact I’ve suffered from anxiety my whole life, to the point of seeking therapy. I’ve learnt that worrying about every scenario in order to mitigate something bad happening is a waste of time and energy. When I really was in imminent danger I didn’t see it coming for a second. They were situations which were all totally out of my control.But trying not to worry about bad things happening doesn’t mean that we shouldn’t practise essential survival skills in order to keep ourselves and others safe: instinct is often nothing of the sort, but a habit we’ve practised, from an emergency stop to a fire drill at work.As a child of the seventies, I realised I absorbed a lot of important safety information from the videos we were made to watch at primary school, from children being electrocuted on pylons, to falling into slurry pits to stranger danger. And those messages may have kept me safe when I least expected them to. So what were my near misses – and how did I survive them?Terror at 5000 feet Credit: Julian De Narvaez When I was in my 20s, my then-boyfriend had obtained his private pilot’s licence. Trying to overcome my fear of heights, I agreed to go up with him and fly over the Kent countryside. On our first (and last) flight together in a two-seater light aircraft, the passenger door on my side swung wide open when we were thousands of feet up – only the seatbelt saved me from certain death.As I gazed in disbelief at the ground miles below us I remember being rigid with fear, gripping the seat tightly with both hands and barely able to talk. All these years later I can still remember the feeling of absolute terror – yet I did not panic, or start screaming or shouting. The seatbelt kept me securely in place (remember that advice, “Clunk, click, every trip”?) until my boyfriend managed to return us safely to the ground, using his own training to stay calm and keep control of the situation. While I don’t have an issue with flying in general now, I would never go near a two-seater plane again. Drunk driverDriving home from London to Sussex late at night on almost empty roads a few years ago, I was totally engrossed in a podcast and looking forward to climbing into bed. Suddenly on my right hand side, a car appeared from nowhere, hurtled past me at 100 mph, spun across the road in front and violently crashed into a fence around Gatwick Airport, missing my car by millimetres. He was so close that I could have touched his vehicle if I’d put my hand out of the window. In utter shock, I pulled off at the next service station and called 999. It was so unexpected I wondered if I’d imagined it, until an officer called me the next day and revealed that the driver had been drunk (he survived the incident). That experience and all the “what if’s” around it stuck with me for a good while afterwards. This was perhaps my closet brush with death. He could so easily have crashed into me, killing us both. And the fact that a drunken idiot could have deprived my children of their mother left me livid.A motorway fireballAround 18 months ago, I was driving to work, listening to the radio and thinking about the day ahead. Traffic was being kept behind a cordon due to a minor incident up ahead. It was quickly cleared and the police officer moved aside and waved us on our way. The car ahead of me zoomed off, clearly frustrated at having been held up. Suddenly it lost control, flipped over and exploded into a fireball, flames shooting high above the motorway. I remember feeling as if I was in a dream. A few seconds earlier and my car would have been involved too. I had to make a split second decision: do I perform an emergency stop, and risk drivers behind crashing into me or try to avoid the blazing vehicle, risking my own car bursting into flames. I drove past and pulled in at the first lay-by, where I dialled 999. My driving instructor’s words from decades before were ringing in my ears: “Pull over only when it’s safe to do so.” Neighbours with a sex offenderWhile I was pregnant with my first child, I was befriended by a neighbour who I later discovered was a convicted sex offender and had just been released from prison. He had been stalking me for some time – “coincidentally” standing outside my front door as I left the house, showing up at the train station when I arrived home in the evening and insisting on walking with me every time we “bumped” into one another. I grew ever more uncomfortable until he started knocking on his side of the adjoining wall to our houses every time I was in the bathroom and I decided enough was enough.I contacted his landlord who told me he was not allowed to give me any information about him but to call the police. Two officers came to my house to reveal my neighbour’s past (he even had a restraining order preventing him from living near his former victims) and told me that as he’d broken his licence conditions he could be returned to prison. I learned a big lesson from this experience – always trust your instincts. I had spent ages telling myself that I was “just being silly” or imagining it. And I had innocently gone into his flat because I didn’t want to appear rude when he invited me – ignoring those stranger danger films of the past.Dressing gown disaster Credit: Julian De Narvaez In the early nineties I was staying with my boyfriend in the house he shared with friends in Brighton. I’d borrowed his dressing gown one morning so I could make tea in the communal kitchen. As I boiled the kettle on the gas hob, the dangling sleeve brushed the naked flame and caught alight. Instantly the flammable material caught alight and within seconds my arm was ablaze. Hesitation would have been fatal, but I found the presence of mind to rip the burning garment off, throw it into the sink and turn the tap on to extinguish the flames. I may have been standing naked in the kitchen of a shared house but at least I was alive. When I needed it most, the advice from the “dangers of fire” video emerged from my memory banks.Preventing a house fire Credit: Julian De Narvaez Around a year ago I noticed a pungent and unpleasant smell of fish in the house, but couldn’t work out what it was or where it was coming from. A few days later the fridge stopped working and I had to call out a repair man. It turned out that there had been an electrical fire for almost a week, burning away at the back of the fridge without us knowing. When the electrician pulled the fridge out, there were jet black marks all up the wall and the plug was burned out. He said we’d been extremely lucky that the house hadn’t caught fire.Apparently when electrical components like wires overheat, the plastic insulation on them begins to melt and release chemicals which produce a distinct fishy odour; this is a warning sign that the wiring is potentially overheating and could lead to a fire. Recommended Why are so many planes crashing? This is what the data says Read more Join the conversation Show comments The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Related Topics Airline industry License this content You need to be a subscriber to join the conversation. Find out more here. Log In Subscribe Advertisement More stories"
