["https://telegraph.co.uk/family/parenting/my-husband-keeps-bankrolling-the-kids"]
title = "My husband keeps bankrolling the kids"
description = "Our children are in their 30s and hopeless when it comes to managing money and making a living – but their father bails them out every time"
full_description = "Marriage Diaries: My husband keeps bankrolling our kids Our children are in their 30s and hopeless when it comes to managing money and making a living – but their father bails them out every time Save Comment speech bubble icon Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Anonymous author 01 March 2025 6:00am GMT Related Topics Marriage, Marriage Diaries, Inheritance tax, Children, Parenthood, Parenting Confessions 01 March 2025 6:00am GMT Save Comment speech bubble icon Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email ‘Plenty of our children’s friends are carving out respectable livings with seemingly no financial input from their parents. Why can’t ours?’ Credit: Mister Ned Anonymous author 01 March 2025 6:00am GMT Every parent wants to be supportive to their children, but ours are in their early 30s and still looking to Daddy for handouts. They know better than to come crawling to Mummy!It’s no wonder our daughter only half-heartedly pursues new employment opportunities: her default is to ring my husband and plead poverty.She has nice clothes and a social life; she isn’t scrimping on things. But my husband falls for the poverty line every time. He’s transferred money to cover her heating bill and, in the past, covered her car tax. I would be more sympathetic if she didn’t manage a trip to Ibiza every year, a fortnightly nail appointment and a dependency on Uber. When she cites the cost of living crisis, I can’t help but scoff.Our son, meanwhile, has a history of making terrible financial decisions and spending too much. There have been a couple of attempts at launching his own business – my husband was happy to be supportive by putting his hand in his pocket to stump up for equipment and a fancy laptop. Neither of these came to fruition. My husband says our son was unlucky; I think he ran out of enthusiasm and got bored when things got challenging.Plenty of our children’s friends are carving out respectable livings with seemingly no financial input from their parents. I feel this habit that my husband has got into of bailing them out is not teaching them a thing. They have an easy life because he won’t make things hard for them. To me, it’s clear that our son and daughter will never have their father’s work ethic or my budgeting skills if they get handed money on a plate.I say to my husband that the children both need to learn the consequences of their spending habits, but he is a soft touch with them after he spent much of their childhood building up a successful business. While he was away a lot working hard, I was keeping within a household budget to ensure our needs were met. By the time the children were teenagers, we were a lot more financially comfortable, so they recall memories of shopping trips to buy fancy trainers and far-flung holidays and now seem to view them as a basic right instead of something which is a huge privilege.They have no idea of how to stick to a monthly spending plan or how to eke out what is left in the account before payday. It’s embarrassing, really: they’re not clueless undergraduates dipping into their overdrafts. They should be financially sorted by now.A part of me thinks my husband is hoping our children will eventually follow in his footsteps and build successful businesses of their own but I’m less idealistic and remain unconvinced. For them to achieve such a thing, they’d both need a heck of a lot more financial nous than they currently exhibit and not – for instance – be desperate for the latest iPhone or have their heads turned by the suggestion of a ski trip.My husband is a loving father and for that I am grateful. But I do worry about his generosity and his blind spot where our children are concerned.I’m also aware that the more cash that is drained from our accounts, the smaller our pot for holidays and home improvements gets. And one day we might need residential care – everyone knows how costly this can be – and it’s clear that our children won’t be funding that. Join the conversation Show comments The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Related Topics Marriage, Marriage Diaries, Inheritance tax, Children, Parenthood, Parenting Confessions License this content You need to be a subscriber to join the conversation. Find out more here. Log In Subscribe Advertisement More stories"
