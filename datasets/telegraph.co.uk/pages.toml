["https://telegraph.co.uk/columnists/2025/03/01/trapped-in-loveless-marriage-parkinsons-affair"]
title = "Dear Richard Madeley: I feel trapped and isolated in my loveless marriage"
description = "There is no real intimacy or romance in this relationship and there never really has been"
full_description = "Life Columnists Dear Richard Madeley: I feel trapped and isolated in my loveless marriage There is no real intimacy or romance in this relationship and there never really has been Save Comment speech bubble icon Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Richard Madeley 01 March 2025 9:00am GMT Related Topics Ask Richard, Relationships, Telegraph Magazine 01 March 2025 9:00am GMT Save Comment speech bubble icon Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Richard advises a wife who feels burdened by her husband who is messaging with an old flame Credit: Ron Number Richard Madeley 01 March 2025 9:00am GMT Dear Richard,Eleven years ago, after losing my beloved husband suddenly, I moved 200 miles to live with my 90-year-old widowed mother near other family members. I had wanted to rent, take a sabbatical from work and see how it went, but my mother convinced me to sell up, take early retirement and throw it all in with her. I soon realised it was a huge mistake: she treated me like a skivvy, and the family failed to materialise: they all had their own lives to live and didn’t want anything to do with Mum as she was so difficult. Luckily my husband had left me well provided for.Eventually, I met someone online. I was so glad to have an ally that I threw myself into the relationship with more gusto than perhaps I should have. He wanted to marry; I didn’t; but marry we did, and we have rubbed along for six years now.Recently I discovered that he’s been messaging with an old flame – not in a particularly salacious way, but affectionately and at some length. I did ask him about this and he said he feels sorry for her as she is unwell. He for his part has just been diagnosed with Parkinson’s.I feel totally trapped. There is no real intimacy or romance in this marriage and there never really has been: I was looking for a way out of my situation with my mother, he has “always wanted a rich woman to look after him”, as a friend unguardedly said a couple of years ago.I would love to tell him to go and live with this woman, but I doubt she has the capacity to take him on – apparently, she has a boyfriend and a husband on the go in addition to this sentimental friendship with my husband. I would be fine on my own, but feel sorry for my husband with his health. I don’t want to burden my daughter or any of my friends with this. I feel totally isolated and depressed.—A, via telegraph.co.ukDear A,Well, look. There’s absolutely nothing to stop you telling your husband you want a divorce and striking out on your own. Nothing... technically speaking, that is. And it may be your best bet. But here’s how the land looks from where I’m standing.You and your new husband came to a mutually beneficial arrangement, didn’t you? It was perfectly practical. He’d be your ticket out of a wearisome life with your mother; you’d be his meal ticket to a better life. You both knew exactly what you were doing. You weren’t love-struck kids; you struck a deal.I can’t see what’s substantially changed in the six years since. OK, so he’s emailing an ex, but not in a sexual or even flirty way. He’s not conducting some sort of online affair. But you seem to want to use it as leverage; a reason – maybe even an excuse – to end the relationship, for not much more of a motive than that you’re bored.You tell me you’d be “fine” on your own; then in the next breath you say you feel isolated and depressed. Why would you feel any less isolated if you separated and lived by yourself?I’m guessing from the clues in the opening paragraph of your letter that you’re aged somewhere adjacent to 70. Are you really ready for another major (and self-inflicted) upheaval at this point in your life, A?If I’m honest, you seem to me to have one foot in fantasyland. Of course your husband isn’t going to move in with this old flame of his. One, you have no reason to believe he wants to; two, as you say, she’s married, has a lover, and is ill; three, he enjoys the life your money affords him. If you’re looking for a way out of your marriage, this is surely clutching at a very large straw.I suppose what I’m trying to offer, A, is a reality check. To be blunt, you’ve made your bed: your best option might just be to find a way of lying in it rather than kicking off the covers and marching off God-knows-where next. And bear in mind that a divorce may come expensive – you’re the one with the money, and your husband may seek to keep what he (and his lawyer) think is his fair share.Life is a bit like a game of stick or twist, A. You played a hand with your mother, then decided to twist. You played a different hand with your new husband – and now you want to twist again. I’m not saying you shouldn’t. But think very carefully. The time may have come to stick. Join the conversation Show comments The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Related Topics Ask Richard, Relationships, Telegraph Magazine License this content You need to be a subscriber to join the conversation. Find out more here. Log In Subscribe Advertisement More stories"
