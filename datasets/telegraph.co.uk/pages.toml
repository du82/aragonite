["https://telegraph.co.uk/books/non-fiction/review-mary-fissell-abortion-history"]
title = "Abortion: A History by Mary Fissell: 5-star review"
description = "Mary Fissell’s fascinating book, Abortion: A History, whirls readers from Cicero’s Rome to 16th-century ‘witches’ to modern-day Ireland"
full_description = "Listen up, Trumpists – your idea of abortion’s history is all wrong Mary Fissell’s fascinating book, Abortion: A History, whirls readers from Cicero’s Rome to 16th-century ‘witches’ to modern-day Ireland 5/5 Save Comment speech bubble icon Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Ella Whelan 01 March 2025 1:15pm GMT Related Topics History books, Abortion 01 March 2025 1:15pm GMT Save Comment speech bubble icon Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Abortion rights demonstrators gather outside the US Supreme Court in 2022 Credit: Getty Ella Whelan 01 March 2025 1:15pm GMT “A beautiful thing to watch”: that’s the phrase Donald Trump used to describe the slew of anti-abortion bills passed by American states in 2022, after “Roe v Wade”, a 50-year-old legal judgement in favour of abortion rights, was overturned by the US Supreme Court. While Trump’s personal views on abortion are unknown – over the decades, they’ve swayed with the breeze of whatever has made him popular – his recent words, not to mention the views of his vice-president JD Vance and their evangelical supporters, are the sort you hear described as “from the dark ages”. Abortion-rights activists, in fact, tend to make this kind of distinction: the “pro-choice” movement is progressive and future-oriented, and the “pro-life” (or “anti-choice”) crowd are stuck in the past.But, according to a new book by the American historian Mary Fissell, the Trumpists’ view of abortion – “heartbeat bills”, no mercy for rape victims, a focus on the “unborn” – isn’t even an accurate representation of the past (whether that past is idolised or despised). In Abortion: A History, she charts a different timeline. History is always more complicated than a linear narrative: it leaps forward and rewinds. “Even in this time of increased repression,” Fissell writes, “history suggests that such limits will not last. They never do.” Abortion: A History should be prescribed reading for many American politicians, in particular, who subscribe to the “progressive” or “regressive” dichotomy – and in doing so, clearly know very little of the history of public opinion on abortion in their own country.Fissell is professor of the history of medicine at Johns Hopkins University. Her 2007 book, Vernacular Bodies: The Politics of Reproduction in Early Modern England, took a ground-level approach to the issue of baby-making, and – as Abortion: A History does – examined the relation between individual women’s experiences and the arc of history. It charted the beginning of the Protestant Reformation, as a consequence of which, Fissell wrote, women were no longer “permitted to clutch a relic of the Virgin while in labour”, and led us to the advent of the printing press and an explosion of men writing about women’s bodies – things that had previously been considered boring or terrifying. “Women’s bodies,” Fissell explained, “came to bear social meanings as well as babies. Just as the interiors of churches were whitewashed, and rich wall paintings replaced by sentences of Scripture and the royal coat of arms, older beliefs about the wondrous properties of women’s bodies were replaced by newer ones that emphasised the dangers inherent in [them].”Fissell specialises in digging out individual stories from behind the headlines and the grandstanding. Here, she begins in fourth-century BC Greece, with an enslaved singer instructed to jump up and down to induce a miscarriage; moves through the mythology of the era, featuring Persephone and contraceptive pomegranates; and visits Rome to hear Cicero’s 69 BC speech condemning a woman’s immorality for seeking an abortion, not because of concern for the foetus but because the republic had been cheated of a “citizen-to-be”. We end, centuries later, by encountering Beatrice J, an American housewife who, almost by accident, ends up running an illicit abortion clinic in her Baltimore kitchen in the 1940s. Attorney Gloria Allred and Norma McCorvey at a pro-choice rally in California, 1989 Credit: Getty The stops along the way include the Malleus Maleficarum (Heinrich Kramer’s 1486 treatise on witchcraft) and the European anti-witch hysteria of the 15th and 16th centuries; life in slave plantations in the American South; and puritanical 19th-century campaigns in New York City. All share a common thread: for the most part, people kept shtum about abortions. Whether it was women keeping their secrets between them or male doctors hiding patients for cash, Fissell’s history is one of quiet tolerance on every side. “The law might say it was forbidden,” she writes, “but people’s actions suggest that they saw it differently.”This out-of-step quality to abortion law has long been an issue across the West. For example, we in the UK have some of the strictest laws on the matter. Abortion remains technically illegal; it has never been fully decriminalised. The Abortion Act 1967 – which didn’t even apply to Northern Ireland, though the province has belatedly, in recent years, caught up with the rest of the UK – merely permits a woman to seek an abortion if she can prove, to the satisfaction of two doctors, that a pregnancy would kill her or send her mad. Thankfully, since experienced doctors are unwilling to waste time on emotional bureaucracy, and support for abortion in the UK is overwhelming – a poll last year suggested that 87 per cent of adults agree that it should be allowed – abortion access is in practice far more liberal than the law might seem, literally, to permit. (The 1967 Act was itself spurred by polls showing that over two thirds of British adults supported abortion in at least some circumstances, and thousands of unsafe abortions were happening whether the state liked it or not.)Why, then, do such liberal public attitudes rarely seem to be reflected in law? While women’s reasons for needing abortions haven’t changed down the centuries – rape, illness, failed contraception, or merely family planning – society’s understanding of that need has been entirely context-dependent. Fissell details one medical man of the 18th century claiming that slaves in Jamaica “sought abortions because of some ill disposition toward their enslavers”. During a 1582 witchcraft outbreak in St Osyth on the Essex coast, miscarriages or infant deaths were interpreted as deliberate abortions via sorcery at the hands of older midwives or healing women. That abortion was the product of spite suited the view of pro-slavery writers; that it was the fruits of witchcraft helped to wave away a lack of knowledge about reproductive medicine. In some instances in the 16th century, miscarriages were seen as abortions at the hands of witches Credit: Alamy “History doesn’t repeat itself, but sometimes it seems to echo,” Fissell writes. Her account of the late-15th-century Nuremberg midwives who had to “report any illegitimate births, whether stillborn or living” seems to chime again in a 2016 Texas law requiring hospitals to ensure “foetal remains… be cremated or buried instead of disposed in sanitary landfills”. In response to the latter, some women threatened to send in their used sanitary products to the then-state governor, Greg Abbott, for testing, in case these too should be ceremonially burned.Some cases repeat, but with darker results. Fissell tells the story of Elizabeth Coates Paschall, a woman in Philadelphia who, in 1750, procured an abortion for herself when she suspected that the foetus was nonviable, that “things had started to go awry”. She took a “glyster” – an enema containing camomile – and aborted with “little trouble”. Two-and-a-half centuries later, in the Republic of Ireland in 2012, another woman called Savita Halappanavar died a barbaric death from sepsis after a prolonged miscarriage was denied her on account of strict abortion laws. Technology had already made abortion a safer procedure than childbirth in Ireland by this point. Only a nationwide referendum was able to loosen restrictions six years later.As all historians should, Fissell keeps her own opinions on the morality of abortion light. (There are, at the same time, moments that say much about modern academia, including a bizarre apology for daring to use the word “women” instead of “people” throughout.) But what Abortion: A History does is give the pro-choice movement a proper centuries-long framework against which to frame its strongest argument: that abortion is an exercise of women’s freedom, and access to it is an expression of society’s view of that freedom. For the individual women whose lives Fissell chronicles so meticulously, these procedures were personal solutions: Paschall and Beatrice J would have been unaware of the historical significance of what they were doing. But, as woven together by Fissell, these stories show the resilience of women’s agency and autonomy, even in the darkest times.Abortion: A History also reveals that, whatever evangelicals and Trumpists might believe, society’s knowledge and tolerance of abortion has long been a strong, if quiet, thread. Law or no law, women have always found answers to their problems. Perhaps, then, it’s time to shake off the cloak of secrecy under which Fissell so ably peeks – and, starting in Britain, decriminalise abortion once and for all.Abortion: A History is published by Hurst at £25. To order your copy for £19.99, call 0330 173 5030 or visit Telegraph Books Recommended Melania Trump's memoir is deeply weird – and hard to believe Read more Join the conversation Show comments The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our commenting policy. Related Topics History books, Abortion License this content You need to be a subscriber to join the conversation. Find out more here. Log In Subscribe Advertisement More stories"
