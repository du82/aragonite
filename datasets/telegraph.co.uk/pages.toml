["https://telegraph.co.uk/cars/classic/uks-rarest-cars-1976-panther-rio-especial"]
title = "UK’s rarest cars: 1976 Panther Rio Especial, one of only six left"
description = "This coachbuilt adaptation of a Triumph Dolomite was supposed to emulate the sophistication of a Rolls-Royce for a post-fuel-crisis world"
full_description = '''Life Cars UK’s rarest cars: 1976 Panther Rio Especial, one of only six left This coachbuilt adaptation of a Triumph Dolomite was supposed to emulate the sophistication of a Rolls-Royce for a post-fuel-crisis world Save Comment speech bubble icon Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Andrew B Roberts 28 February 2025 12:30pm GMT Related Topics Classic cars, UK's rarest cars, Triumph , Motoring, Used cars, Rolls-Royce 28 February 2025 12:30pm GMT Save Comment speech bubble icon Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email The Rio’s manufacturer intended the car to be a more economical alternative to the Rolls-Royce Andrew B Roberts 28 February 2025 12:30pm GMT At first sight, Peter Mayo’s Especial Automatic resembles an intriguing combination of a Triumph Dolomite Sprint and a Rolls-Royce Silver Shadow. In part, this was the intention of its manufacturer, Panther Westwinds, as the Rio was meant to offer a more economical alternative to a Rolls. Today, only six are believed to survive – and the model represents one of the most offbeat chapters in the Dolomite story.The Rio dates from 1974, when luxury-minded Panther’s founder, Robert Jankel, and his co-director, David Franks, decided a 2.0-litre “town car” would be the ideal product for a post-fuel-crisis world. They chose the Dolomite as its basis due to its engineering and slightly formal appearance. Within nine weeks of a new Triumph arriving at its works in West Byfleet, Surrey, Panther built the first Rio, which had a formal launch in 1975.All the hand-beaten aluminium alloy body panels were unique to the Rio, while Panther also altered the Dolomite’s roofline. The Rio’s headlights and front indicators were from the Ford Granada and the tail-lights from the Triumph TR6, while many of the switches were from the Jaguar XJ Series 2. The interior had less space than the Dolomite thanks to its well-upholstered seats, although Jankel believed the upright driving position had a limousine-like dignity.The proud owner further gained thick pile carpeting, extra soundproofing, Sundym tinted glass, a radio cassette player, Connolly Luxan hide trim, a burr-walnut-veneer fascia and electric windows. The detailing included an ashtray incorporating a cigar lighter on all four doors, along with alloy wheels featuring a Union flag on the hub. As for the new grille, it was vaguely reminiscent of a Rolls-Royce, albeit from a distance. The Rio Especial featured a burr-walnut-veneer fascia Panther offered two versions: the Standard was based on the Dolomite 1850, while the Especial was derived from the sportier Sprint model of the Triumph saloon. Mayo’s car also features the optional air-conditioning system: “It still works,” he says. The company planned for upmarket car dealership chain HR Owen to distribute the Rio, in whose showrooms the Panther would serve as a miniature option to the Rolls-Royce Silver Shadow.In theory, the Rio was a viable proposition. It followed the tradition of customised Mini Cooper town cars of the 1960s from the likes of Radford, while the 1973 fuel crisis had made a significant impact upon the sales of large-engined saloons. Jankel was also keen to ensure that Panther was not known only as “the company that builds old-fashioned motor cars” such as the De Ville, with its quasi-Bugatti Royale lines.In October 1975, Autocar reported that HR Owen had “ordered 100 of the new Panther Rio models with the first three months’ production already sold”. The sales copy modestly claimed that “the Rio combines characteristics combined in no other single car”, with “superb handling, a 115mph maximum speed and 0-60mph acceleration in 8.7 seconds”. The Rio boasted a top speed of 115mph and 0-60mph acceleration in 8.7 seconds Unfortunately, there proved to be limited demand for the Rio. One challenge was that the Panther representing “handcrafted exclusivity without ostentation” still bore too great a similarity to the more prosaic Dolomite. Michael Foster, the managing director of Avis Rent-a-Car, thought the Rio looked like “a high-speed Humber Sceptre”, which he did not intend as a compliment (the Mk3 version of the Sceptre, produced from 1967 to 1976, was effectively a humble Hillman Hunter).A further problem was British Leyland’s high-profile issues having an impact upon all its products, although the greatest challenge was probably that the Rio was phenomenally expensive. Jankel was obliged to purchase Dolomites from BL at full price, which helped inflate the Especial’s cost in late 1976 to £9,445. This did not compare favourably with the Ford Granada Ghia at £4,602 or the £5,130 Rover SD1 3500. Even a Daimler Double-Six was less expensive than the Rio, at £9,059.Unsurprisingly, a mere 38 Rios left the Panther factory between 1975 and 1977; this is the penultimate example. It joined the Mayo fleet of Panthers, which includes a yellow-and-white standard version, two De Villes, a J72, a Kallista and a Lima, in 2018. “I find people either love it or hate it when I take the Rio to shows,” he says. Peter Mayo with his Rio; his fleet includes a standard version, two De Villes, a J72, a Kallista and a Lima Mayo believes the main problem was that Panther made the Rio for the non-existent 1970s ultra-expensive compact-car sector. In 2025, his Especial still retains a sense of glamour. It is a car that should be parked outside a West End casino in The Professionals or a Joan Collins film. And with a box of After Eight mints in the glove compartment. #wrp-99c35903-95f7-4884-8eca-e7ba </div> <div class="articleBodyText section"> <div class="component article-body-text " data-test="article-body-text"> <p><em>Thanks to Peter Mayo and the </em><a class="ck-custom-link" href="https://www.panthercarclub.com/PCC_index.php" rel="nofollow noopener noreferrer" target="_blank"><em>Panther Car Club</em></a><em>.</em></p> </div> </div> </div> <div class="u-separator-top--loose u-separator--branded"> <aside id="comment" class="comment" data-comment-config="{&#34;authorMode&#34;:false,&#34;articleCommentingConfig&#34;:true,&#34;convConfig&#34;:{&#34;articleId&#34;:&#34;A4FjFZZLqt3q&#34;,&#34;viafouraEnvironmentId&#34;:&#34;00000000-0000-4000-8000-010fdf3f0a45&#34;}}" data-js="comment" aria-label="Commenting" data-test="join-conversation-section"> <div class="comment__header-container" data-js="comment-header-container" data-test="comment-header-container"> <h2 class="comment__header">Join the conversation</h2> <!-- social icons --> <div class="comments__social"> <!-- show comments button restyled --> <button class="comments__button comment__show-button e-button e-button--large e-button--centered-text" data-js="comment-load" data-label-loading="Loading..." data-test="comment-load" data-event="showComments"> <div class="comment__show-text">Show <span class="e-comment-count__number" data-js="comment-count"> </span> comments <svg class="e-button__icon comment__toggle-icon e-button__icon--right e-button__icon--large" viewBox="0 0 13 7" xmlns="http://www.w3.org/2000/svg"> <path id="Vector 356" d="M1 0.749911L6.49999 6.25L12 0.749912" stroke="white" stroke-width="1.17857" stroke-linejoin="bevel"/> </svg> </div> </button> <div class="comment__policy-container comment__policy-mobile"> <div class="comment__policy" data-test="comment-policy"> The Telegraph values your comments but kindly requests all posts are on topic, constructive and respectful. Please review our <a class="comment__policy-link" href="/commenting-policy/"> commenting policy</a>. </div> </div> <ul class="e-social-share" data-test="social-share"> <li class="e-social-share__provider copy-link" data-js="copy-link" data-test="copy-link"> <div class="e-social-share__link"> <div class="e-social-share__icon-wrapper" data-js="icon-wrapper"> <svg class="initial-icon e-social-share__icon" width="20" height="20" viewBox="0 0 20 20" fill="transparent" xmln