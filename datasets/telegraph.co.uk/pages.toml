full_description = "Our subscriptions terms & conditions Save Share article Log in or Subscribe Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email 29 September 2024 12:33pm BST Save Copy link X Icon twitter Facebook Icon facebook WhatsApp Icon whatsapp email Scroll down to… Print Subscriptions: Telegraph Print and Telegraph Print Classic subscriptionsDigital Subscriptions: Telegraph Digital, Digital Plus, Digital Light and Family Pack subscriptions. If you are visiting our Service from the United States, please review our US Subscription terms and conditionsPuzzle Subscriptions Telegraph Print and Telegraph Print Classic subscriptions Prior to 29 September 2024, the services governed by these Terms were provided by or on behalf of Telegraph Media Group Limited (company registration number 00451593). These Terms and Conditions are effective from September 29, 2024. 1. Validity Subscriptions to the Daily and Sunday Telegraph are available in the UK only, though newspaper supply cannot be guaranteed, especially in geographically remote areas where distribution may be affected by the weather. A valid UK address, including postcode, is required for a Telegraph print subscription. Subscribers must be 18 years of age or older. Please note that we reserve the right to amend these terms and conditions at any time in our sole discretion. 2. Subscription Offers Subscription offers are personal and non-transferable. Except for the initial 14-day money-back guarantee, no allowances or extensions to any offer will apply. The minimum subscription term is six months. Some promotional offers have a 12-month minimum term. Subscription offers cannot be used in conjunction with any other offer. New subscription offers are not open to newsagents (or any other entity that sells newspapers) nor current subscribers. Some offers may not be available to previous subscribers. If an offer includes a free gift, for pre-pay customers it will be dispatched within 28 days of your subscription starting and for subscribers using a recurring payment schedule (Direct Debit or Continuous Card Authority), the free gift will be dispatched after your first successful payment. Promotional offers and incentives are subject to availability and may be changed at any time. Offers are limited to one per household. 3. Payment Types Subscriptions can be paid for in advance for 26 weeks or 52 weeks by cheque or credit/debit/charge card, or a continuous subscription can be taken out by Direct Debit or Continuous Card Authority. A UK bank account is required for Direct Debit subscriptions. Payment types and subscription durations may be restricted for promotional offers. On commencement of your subscription, you will be sent vouchers which can be redeemed at participating stores throughout the country. Thereafter you will continue to receive vouchers every 13 weeks for the duration of your subscription. Please note that if you choose to have your newspapers delivered, you will be liable for any delivery charges applied by your newsagent. 3.1 Fixed Term If you chose to pay on a fixed term basis you must pay for either 26 or 52 weeks in advance. Promotional offers may be restricted to 52 weeks advance payment only. Payment can be made by cheque to the address below or by telephoning 0800 33 20 20 or online at www.telegraph.co.uk/subscriptions. Upon receipt and acceptance of your order and payment we will inform you of the date on which your subscription will begin and send you your vouchers before this date. 3.2 Direct Debit If you choose to pay for your subscription by direct debit (DD) you can do so by mail to the address below, by telephoning 0800 33 20 20 or online at www.telegraph.co.uk/subscriptions. The minimum subscription term is six months. On acceptance of your DD subscription we will inform you of the date on which your subscription will begin and send you your vouchers before this date. The subscription is deemed continuous and you will be charged every month/quarter as appropriate. You will receive the applicable vouchers every 13 weeks until you cancel, which must be in line with the procedures below. If the price of your subscription increases, we will give you at least 10 days’ notice. Upon payment by DD the DD Guarantee will apply. The DD Guarantee is offered by all Banks and Building Societies that take part in the DD Scheme. This means that: 3.2.1 - the efficiency and security of the Scheme is monitored and protected by your own Bank or Building Society. 3.2.2 - If the amounts to be paid or the payment dates change, Telegraph Media Group Holdings Limited will notify you at least 10 working days in advance of your account being debited or as otherwise agreed. 3.2.3 - If an error is made by Telegraph Media Group Holdings Limited or your bank or building society, you are guaranteed a full and immediate refund from your branch of the amount paid. 3.3 Continuous Card Authority If you choose to pay for your subscription by continuous card authority, your debit/credit card will be debited every month. Your subscription will be deemed continuous and you will receive vouchers every 13 weeks until you cancel, which must be in line with the procedures below. If the price of your subscription increases, we will give you at least 10 days’ notice. Minimum subscription term is 6 months. 4. Cancellation policy If you are not completely satisfied, you may cancel your subscription (having chosen any method of payment) at any time during the first 14 days by contacting us and we will give you a full refund, otherwise a minimum subscription period of six months applies. Promotional subscription offers may have a minimum 12-month term. No refund can be given until your vouchers have been returned. If you decide to cancel your DD subscription you will need to notify us, at least 28 day prior to the end of your current voucher pack, you will not be able to cancel part way through your current voucher pack. You will be liable for any unpaid vouchers. Minimum subscription term is 6 months. If you decide to cancel your Continuous Card Authority Subscription you will need to notify us, at least 28 day prior to the end of your current voucher pack, you will not be able to cancel part way through your current voucher pack. You will be liable for any unpaid vouchers. Minimum subscription term is 6 months. If you have any complaints about how we have dealt with the provision of your subscription or have any queries please visit our help site or alternatively contact our Customer Services Department. 5. Contact Us You can contact us using our online form. By post to: Subscriptions Team The Telegraph PO Box 8560 Derby DE1 9NA By telephone: 0800 33 20 20 6. Holiday Policy If you are going abroad on holiday and are unable to use your vouchers, we will refund you for the unused vouchers, provided you notify us within three months of your holiday. The maximum number of vouchers that can be returned is 2 weeks for subscriptions that are 1 year, pro-rata for shorter term subscriptions. For example, 1 week for a 6 month subscription. Please dispose of the unused vouchers. 7. Data Protection Full details of how we hold and process your information can be found in our Privacy and Cookie Policy. 8. Subscriber Benefits Telegraph weekly and annual 2-day, 5-day, 6-day and 7-day Print subscriptions are eligible for the benefit described in clause 8.2 below: 8.2 One bonus Digital subscription, subject to the following terms: 8.2.1 Eligible Print subscribers (primary users) are able to give one bonus Digital subscription to another person (secondary user) by accessing the dedicated website link provided by the Telegraph, collecting a unique code and then sharing the code via a method agreed with the secondary user. 8.2.2 A bonus subscription can only be claimed by new subscribers who have not previously taken out any other Telegraph subscription. 8.2.3 In order to access the bonus subscription, secondary users will need to register with The Telegraph and set up a Telegraph account. 8.2.4 The bonus subscription will be a Digital subscription provided subject to these Subscription Terms and Conditions. 8.2.5 A secondary user’s bonus subscription will start on the date that the secondary user sets up an account with the Telegraph and will continue until the primary user’s Print subscription is cancelled or expires, unless the primary user unlinks the secondary user’s account earlier as set out in clause 8.2.6 below in which case the secondary user’s bonus subscription access will terminate immediately. 8.2.6 A primary user may unlink a secondary user’s account from the bonus subscription at any time by contacting Customer Service. A secondary user may unlink their own account by cancelling their bonus subscription in the My Account section of the Telegraph website. Once a secondary user’s bonus subscription account has been unlinked, the primary user may share the bonus subscription with another secondary user by repeating the process set out in clause 8.2.1. 9. Digital Access All Telegraph Print and Telegraph Print Classic subscriptions give unlimited access to subscriber-only content on the Telegraph website. A valid email address and activation of your online account is required for unlimited web access. By accessing this content, you are agreeing to the Terms and Conditions of usage as detailed here. 10. Subscriber-only content access on The Telegraph The Telegraph UK app for tablet and smartphone All Telegraph Print and Telegraph Print Classic subscriptions give unlimited access to subscriber-only content on The Telegraph UK app. A valid email address and activation of your online account is required. By accessing this App, you are agreeing to the Terms and Conditions of usage as detailed here. Failure to make the newest updates may mean you are unable to access the app. 11. Access to The Telegraph UK app for tablet and smartphone Telegraph Print subscriptions allow access to The Telegraph UK app for tablet and smartphone 7-days a week. The Telegraph UK app for tablet and smartphone is available on iOS and Android. A maximum of two devices per subscription may be enabled. A valid email address and activation of your online account is required to access editions. By accessing this content, you are agreeing to the Terms and Conditions of usage of each device as detailed here. Terms and Conditions of Registration to activate your online account can be found here. To ensure access to the Telegraph apps, where we release updates of the applicable app you may need to update the current version on your mobile or tablet. Failure to make the newest updates may mean you are unable to access the app. Telegraph Classic Print subscriptions do not allow access to the Telegraph UK app. 12. Promoter Telegraph Media Group 111 Buckingham Palace Road London SW1W 0DT Registered in England No. 14551860. VAT No 472967739 Telegraph Media Group Holdings Limited reserve the right to change these terms at any time. Continued use of your subscription will be deemed acceptance of any changes. Telegraph Digital, Telegraph Digital Plus, Telegraph Digital Light & Telegraph Family Pack subscriptions Prior to 29 September 2024, the services governed by these Terms were provided by or on behalf of Telegraph Media Group Limited (company registration number 00451593). These Terms and Conditions are effective from September 29, 2024. 1. Validity Terms and Conditions apply only to subscriptions taken out directly with Telegraph Media Group. Subscriptions taken out via third parties (such as Apple / iTunes, Google Play or Amazon Kindle Fire) are subject to the conditions of the third party. All digital subscriptions (Telegraph Digital, Telegraph Digital Plus, Telegraph Digital Light and Telegraph Family Pack) are available globally. Subscribers must be 18 years of age or older. Please note that we reserve the right to amend these terms and conditions at any time in our sole discretion. Once set up, your Telegraph Digital, Telegraph Digital Plus or Telegraph Family Pack subscription entitles you to access subscriber-only content on the Telegraph website and The Telegraph UK app for tablet and smartphones. Your Telegraph Digital Light subscription entitles you access to the Telegraph Website only, with up to 7 subscriber-only articles every 7 days. Terms and Conditions of usage of each device and/or website are detailed here. To ensure access to Telegraph apps, you may need to update the current version of the applicable app on your tablet or smartphone where we release app updates. Failure to make the newest updates may mean you are unable to access the Telegraph apps. A valid email address and registration to create a Telegraph Login is required for all Telegraph digital subscriptions. Subscribers of Telegraph Digital, Telegraph Digital Plus and Telegraph Family Pack will have unlimited access to the Telegraph website and The Telegraph UK app for tablets and smartphones. Telegraph Digital Light subscribers will have access to 7 articles every 7 days via the Telegraph website only. The content meter will measure the number of articles read and will be reset every 7 days, from the start date of the subscription. Terms and Conditions of registration can be found here. If your subscription price increases, we will give you at least 10 days’ notice and the new price will only become effective from the next payment date. 2. Subscription Offers Some offers may not be available to previous subscribers. If the offer includes a free gift, your free gift will be dispatched within 60 days of your subscription starting. Free gifts apply to Telegraph Digital, Telegraph Digital Plus and Telegraph Family Pack subscriptions in the UK only. Promotional offers and incentives are subject to availability and may be changed at any time. 3. Payment Types Subscriptions are recurring and can be set up on a monthly or annual basis by Credit/Debit Card or Direct Debit. A UK bank account is required for a Direct Debit subscription. Promotional offers may have payment type or payment frequency restrictions. A monthly recurring payment schedule that started on the 29th, 30th or 31st of the month will be collected on the last day of the month if the current month has fewer days. 3.1 Direct Debit If you choose to pay for your subscription by direct debit, the Direct Debit (DD) Guarantee will apply. The DD Guarantee is offered by all Banks and Building Societies that take part in the DD Scheme. This means that: 3.2.1 - The efficiency and security of the Scheme is monitored and protected by your own Bank or Building Society. 3.2.2 - If the amounts to be paid or the payment dates change, Telegraph Media Group Holdings Limited will notify you at least 10 working days in advance of your account being debited or as otherwise agreed. 3.2.3 - If an error is made by Telegraph Media Group Holdings Limited or your bank or building society, you are guaranteed a ful"
