["https://telerik.com/blogs/angular-resource-rxresource"]
title = "Angular Resource and rxResource"
description = "See how to handle asynchronous behavior with Angular resource and rxResource APIs."
full_description = "Angular 19 introduces two experimental APIs—resource and rxResource—designed to simplify handling asynchronous dependencies within Angular’s reactive framework. These APIs elegantly manage evolving data, such as API responses or other async operations, by tightly integrating with Angular signals. In this article, we’ll explore these new APIs, showcase their use cases through some examples and provide insights into how they enhance asynchronous workflows. The resource API bridges Angular’s signal-based state management with asynchronous operations. Combining request signals, loader functions and resource instances provides a declarative way to manage asynchronous data. For an introduction to Angular Signals, be sure to check out the articles we’ve recently published—Angular Basics: Signals and Angular Basics: Input, Output, and View Queries. In the above example, the city signal acts as the input, determining which weather details to fetch. Any updates to city automatically retrigger the loader function, fetching new data based on the updated city name. The weatherData resource instance tracks the current data (value), loading status (isLoading) and any errors (error). The update method allows modifying local resource data without triggering a server request. For instance, we can add a local timestamp to the weather data: For applications deeply integrated with RxJS, rxResource provides an observable-based counterpart to resource. It seamlessly connects signals to observables, enabling a more reactive approach to data fetching. Here, the page signal represents the current page number. Changes to page automatically trigger the loader function to fetch books for the specified page. Using rxResource enables Angular’s reactive model to integrate smoothly with observable streams. For an introduction to observables in Angular, check the following articles: Angular Basics: Introduction to Observables (RxJS)—Part 1 and Angular Basics: Introduction to Observables (RxJS)—Part 2."
