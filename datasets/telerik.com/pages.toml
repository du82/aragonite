["https://telerik.com/design-system/docs/ui-templates/building-blocks/landing-page/incentives"]
title = "Rewards and Incentives UI Building Block | Progress Telerik"
description = "Discover an effective Rewards and Incentives pattern to engage users and drive motivation."
full_description = "Overview Similarly to the Features section, the Incentives UI section represents in a compact way the advantages of a certain product or service over others but typically in the form of direct stimulus, such as exclusive offers and discounts, awards, or promises. It usually includes free shipping and returns, gifts with purchase, money back guarantee, seamless support, and anything else that could encourage the customer to order. The Features section, on the other hand, typically consists of cards, containers, or even banners that use icons along with short texts. The Incentives UI section is an essential element in e-commerce websites that could be present permanently or during promo campaigns and aims to create a sense of exclusivity, good deals, and urgency. Key Principles Layout—the content must be of equal size and distributed in consistent columns or rows to ensure that no single chunk of text dominates the others. Messaging—the tone must be enticing and emotionally engaging. Emphasis—use different icons, font sizes, font weights, and colors to emphasize the exclusivity of each advantage. Incentives Variants The Telerik and Kendo UI Incentives offer design variants showcased in our demos, each tailored to enhance your application development by covering different usage scenarios. Incentives 3 PreviewCode70% Incentives 5 PreviewCode70% Incentives 7 PreviewCode70% UI Components Documentation For product-specific information, refer to the corresponding Telerik and Kendo UI documentation: Kendo UI for Angular Product HomepageDiscover the Kendo UI for Angular components.Telerik UI for Blazor Product HomepageDiscover the Telerik UI for Blazor components.KendoReact Product HomepageDiscover the KendoReact UI components."
