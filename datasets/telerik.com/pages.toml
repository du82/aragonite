full_description = "Our company like to use Telerik Controls Tools for Web and Windows projects. It provides rich UI with simple usability. I would recommend this tools to my friends and colleagues. Telerik UI has helped us to reduce the coding time and thus speed up the project delivery. Also admirable support from Telerik team. I have been using this product for many years. This library has grown so much over the years and love it more and more each year. Telerik staff is quick to answer my requests and are very helpful. Overall I am very happy andwould recommend :) Hi Telerik team working on Kendo UI, we wish to thank you for this awesome superset of products. Out of the box, work great, require tweaking for Web standards. Support is helpful, technically works as advertised. I very much enjoy using Telerik UI for ASP.NET MVC. It is a huge time saver to not have to code commonly used widgets and write code to support various browsers/devices. Kendo support, documentation and demos have improved greatly over the years. We delivered our first version in nine months—which is unheard of in this industry—because we hired 25 of the best people in the industry and gave them really good tools. Then, we converted 1,900 screens to a new UI in just two weeks. I don’t think we could have met our deadlines if we didn’t have easy to use HTML-based UI toolsets to work with. Telerik was a key component in our success. We standardized our development tools using Telerik ASP.NET MVC. The Telerik controls are lightweight and have responsive capabilities, enabling us to easily build apps across multiple devices. They also look awesome across different browsers and the built-in customizable theme feature is the icing on the cake! For our recent release of software we implemented Telerik reporting and it has met and exceeded expectations. We started using Telerik because of the reporting but have found an additional major benefit to be the other Telerik tools available. It is a pleasure to work with ASP.NET MVC controls where we receive excellent support and get that sense of an extra member in our team that are able to resolve our most complex issues and questions. I would definitely continue to recommend Telerik to all my colleagues and customers."
