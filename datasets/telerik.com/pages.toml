["https://telerik.com/about/success-stories/details/kliptok-leverages-telerik-ui-in-blazor-powered-app-to-improve-its-functionality-for-twitch-users-and-streamers"]
title = "KlipTok Leverages Telerik UI in Blazor-Powered App to Improve Its Functionality for Twitch Users and Streamers. | Telerik UI for Blazor Success story"
description = "Telerik UI for Blazor Case Study - read KlipTok Leverages Telerik UI in Blazor-Powered App to Improve Its Functionality for Twitch Users and Streamers."
full_description = "99% of the content on popular streaming platform Twitch is live. Avid Twitch user and developer Jeff Fritz created KlipTok to help other users easily discover channels and topics of past or archived shows. He chose Telerik UI for Blazor to power the UI of KlipTok and showcase the Blazor framework in action. KlipTok needed better UI support with a toolset that was not only compatible with the Blazor framework, but one with robust features for a user-friendly and professionally looking interface. Utilize Telerik UI for Blazor Column Chart, DateRangePicker, TileLayout and Window to improve the KlipTok functionality for both Twitch users and content creators. Users can effectively search for clips based on specific dates, navigate the app to discover new streamers and see videos on the homepage from a pool of more than 7 million different clips from live video streams. Twitch is a massively popular streaming platform that features more than 40 million users creating streaming content, ranging from video game playthroughs to video podcasts. With so many unique content creators on the platform, it can be difficult for new users to discover a streamer they like. What’s even harder is finding a part of a certain stream that Twitch users are raving about because the stream has become archived and unable to be accessed. This user-focused problem led Jeff Fritz, a Community Program Manager at Microsoft, and a very experienced Twitch user, to develop an app that allowed users to search for bite-sized clips from prominent to just-starting-out streamers. In November 2020, Fritz unveiled KlipTok, the app in question, fittingly via a livestream on Twitch. It allows users to discover bite-sized fragments of popular streamers or find specific clips of streams that include something incredible or funny. Despite creating an application from the ground up and allowing users to discover clips ready-made for social media, there were a variety of problems revolving around the usability of KlipTok."
