["https://telerik.com/blogs/10-essential-aspnet-core-features-remember"]
title = "10 Essential ASP.NET Core Features to Remember"
description = "Stuck in a development rut? These 10 ASP.NET Core features might inspire you to try a new approach!"
full_description = "As web developers, it is common for us to keep turning to the same old solutions for different problems, especially when we are under pressure or dealing with tight deadlines. This happens because we often follow code patterns that we have already mastered, either because we are unaware of other alternatives or even because we are afraid of using new options and things getting out of control. However, ASP.NET Core offers features that can make code cleaner and more efficient, and they are worth learning about. In this post, we will explore some of these features. We will cover how features such as pattern matching, local functions and extension methods, among others, can be applied more effectively in different scenarios. You can access all the code examples covered during the post in this GitHub repository: ASP.NET Core Amazing features. Pattern matching first appeared in C# 7 as a way to check the structure and values of objects more concisely and expressively. It has been continually improved since then. In pattern matching, you test an expression to determine whether it has certain characteristics. The is and switch expressions are used to implement pattern matching. Note that in example 1.1, without pattern matching, despite using the is operator to check the transaction type, there is a chain of if and else statements. This makes the code very long. Imagine if there were more transaction options—the method could become huge. In example 1.2, we use the switch operator to check the transaction type, which makes the code much simpler and cleaner. In example 1.3, we use the is expression explicitly to check whether obj is of type string. In addition, is string s performs a type-check and initializes the variable s as the value of obj converted to a string, if the check is true. This way, in addition to checking the type, we can convert this value to the checked type. Static methods are methods associated with the class to which they belong, and not with specific instances of the class. In other words, unlike non-static methods, you can call them directly using the class name, without having to create a new instance of it."
