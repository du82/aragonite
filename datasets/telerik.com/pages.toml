["https://telerik.com/blogs/value-programmer-lore-standardization"]
title = "The Value of Programmer Lore and Standardization"
description = "Standardization fosters the growth of programmer lore, and there’s nothing more valuable to your organization."
full_description = "Standardization fosters the growth of programmer lore, and there’s nothing more valuable to your organization. There’s an unquantifiable benefit that comes to every company that has an IT department: Programmer lore. Programmer lore is what programmers learn (and share) over time as they work with a set of tools. Programmer lore is what you’ve barely started to acquire when you come out of school (unless you’ve been doing a lot of coding outside of class). Programmer lore is invaluable. At its simplest, programmer lore is “knowing what the error message really means.” Early in your career, when your code or build blew up and someone leaned over your shoulder, looked at your error messages and said, “Oh, yeah. OK. So scroll up, scroll up, scroll up. There it is. You need to <insert solution here>”—that person was demonstrating programmer lore. Programmer lore is more than just knowledge, though. Lore includes, for example, flexible, conceptual solutions for problems both micro and macro that work with the organization’s programming standards, toolset and platform. Programmer lore is a shared understanding of how to think about a problem in a way that leverages the tools available to the developer. Lore isn’t having a ninja developer, either. Lore is useful because it’s shared. Lore is a team resource and, while you can buy new team members, you can’t buy team lore. I am very fond of new technology, but programmer lore is why I tell my clients they should adopt a platform/toolset and stick with it as long as they possibly can. You shouldn’t abandon a toolset/platform until there’s something you really, really want to do that can’t be done with your current toolset/platform. At that point, you should move to the youngest viable toolset/platform and plan (at least initially) to stay on that platform until you die. Maybe longer. Sticking with a platform lets developers grow their store of lore. Don’t get me wrong, Part I: I have no use for people who say that whatever platform/toolset they’re using is all anyone will ever need. To quote Vince Gill: “They stopped playing Elvis. They’re going to stop playing you.” Your toolset of choice will, eventually, need to be replaced. I started with COBOL running on the VAX/VMS operating system, and I’m currently using Blazor in .NET 5 running in the browser of your choice (and I can find people to tell you that I’m not keeping up). Change happens. Accept it."
year_published = 2021
year_updated = 2023
