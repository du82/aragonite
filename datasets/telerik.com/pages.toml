["https://telerik.com/blogs/unifying-uis-telerik-fluent-theme"]
title = "Unifying Your UIs With Telerik Fluent Theme"
description = "Telerik’s Fluent theme makes implementing a common UI across web and desktop application easy."
full_description = "Telerik’s Fluent theme lets you provide a consistent UI experience for your users across web and desktop applications and does it while implementing the most contemporary of UI design patterns. This is worth repeating: When it comes to UX design, the three things that your users value most are “Consistency, consistency and consistency.” The problem is that most organizations have had to pick some technology for creating their desktop applications and then, for creating their web applications, a different set of technologies: server-side and client-side toolsets. There are some benefits to working in the Microsoft world because the .NET platform gives you support for both desktop apps (WPF) and server-side development (ASP.NET Core). But that relative “lack of complexity” only goes so far because, on the client side, the technology for creating a web application’s UI is probably one of “plain old” JavaScript + jQuery or the current “usual suspects” in client-side frameworks: Angular, React or Vue. In fact, the reality is that most organizations are using more than one of those client-side frameworks. But, just in case you thought this was too straightforward for web development … there’s Blazor. Mix all those toolsets together along with a couple of development tools (Visual Studio Code or Visual Studio), and delivering consistency is going to be a challenge. Just ensuring that all of your applications “look alike” (the base level of consistency) can be a time-consuming task. The Progress Telerik and Kendo UI environment now supports using any of four pre-defined themes (Default, Bootstrap, Material and Fluent) to give you visual consistency across all of your applications. Telerik’s Fluent theme is driven by Microsoft’s Fluent UI, which debuted in 2017. Fluent is an open-source project that has evolved from Microsoft’s earlier Metro Design Language. Fluent’s design goals are to allow developers to deliver user experiences that not only engage the users but that are accessible, support internationalization, and don’t inhibit performance. Unlike other UI design systems (Google’s Material design, for example) that target screen-based user experiences, Fluent Design is more open and considers inputs other than just the traditional touch/mouse/keyboard paradigm—voice and gaze, for example."
