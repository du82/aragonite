title = "Coding Azure 4: Web Service in App Service, Azure SQL Db"
description = "If you’re going to protect your organization’s data, you need to both understand Managed Identities and leverage them."
full_description = "Managed Identities are an essential tool in Azure to control who can get to your organization’s data. Here’s how to take advantage them in a cloud-native Web Service. In an earlier post, Coding Azure 2: Configuring an Azure SQL Database, I created an Azure SQL Database and, in my last post, Coding Azure 3: Deploying a Web Service to an App Service, a skeleton Web Service that I deployed to an App Service. The next step is to provide some code in that Web Service that will access the database and also ensure that only that code, running in that App Service, can access the database. In this post, I’m going to provide some background on the tool I’ll be using to control access (Managed Identities). I’ll then cover how to set up a Managed Identity and then configure the App Service holding my Web Service (and the Web Service itself) to use that Managed Identity. In my next post, I’ll cover what needs to be done in the database to work with the Managed Identity (and also suggest how to control network access to the database). First, some Entra ID terminology. When you log into Azure, the current terminology is that you are presenting a set of credentials (name, password, multi-factor authentication) that entitle you to claim a user identity. A user identity has account information (e.g., name, address, email address, job position, etc.) and permissions to perform activities in Azure (e.g., read your own information from Microsoft Graph, Azure’s one-stop shopping for user information). Your identity is “something that can be granted permissions” and can also be classified as a “security principal.” Specifically, your user identity can also be called a “user principal.” Another kind of security principal is a Managed Identity, which can be assigned to an Azure resource (e.g., an App Service). A Managed Identity is a kind of “service principal”: a principal without account information that is never assigned to a user. Because a Managed Identity is a security principal, it can—like a user identity—be assigned permissions."
year_published = 2025
year_updated = 2025
