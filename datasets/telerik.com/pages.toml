full_description = "Authentication in Blazor WebAssembly can be challenging if it’s your first time implementing it, especially due to the number of classes and components that the framework adds if you choose the Individual Accounts option while configuring the project. For this reason, throughout this post, I will explain the key concepts you need to understand to start your journey. Let’s begin! An excellent way to learn about the authentication process in Blazor WebAssembly is by using the Blazor Web App template, selecting Authentication Type as Individual Accounts, Interactive Render Mode as WebAssembly, and Interactivity location as Global: The above configuration indicates that the application should apply WebAssembly rendering to all components (in theory—you’ll see later that this doesn’t happen exactly like that). This template will help us understand how server-side authentication can be achieved while somehow persisting information on the client side. After creating the project, I recommend running the application to see the initial project structure. You can see that, apart from the traditional pages in a Blazor project, the pages Auth Required, Register and Login have been created. Let’s start by trying to create an account on the Register page. When entering the data and clicking the button, you’ll see an error occurs. This error happens because the first migration hasn’t been applied for the application to work. We can execute the recommended command in the Package Manager Console, or the simpler solution is to click the Blue button that says Apply Migrations: After applying the migration, we just need to refresh the page to see that we can now register without this error appearing: Let’s examine the Program.cs file in the server project, which will allow us to discover different important concepts in the world of authentication with ASP.NET Core Identity. The first line we should look at is the one that invokes the AddCascadingAuthenticationState method:"
