["https://telerik.com/blogs/build-chatlens-kendo-ui-gemini-angular-19"]
title = "Build a ChatLens with Kendo UI, Gemini and Angular 19"
description = "Get a chatbot up and running on your Angular app with Gemini and Kendo UI for Angular."
full_description = "Today, chatbots are more than simple conversational tools. They can analyze data, automate processes and solve real-world problems. As developers, we can harness AI to simplify processes and simplify complex scenarios. By combining the power of Gemini, Angular and Kendo UI, we can build advanced chatbots that not only chat but also analyze images to provide smart recommendations. Imagine a scenario where you upload a screenshot of a webpage, and the chatbot identifies which Progress Kendo UI components can help you recreate it, complete with explanations and links to resources. With Kendo UI for Angular’s rich set of components and Gemini’s AI capabilities, building sophisticated chatbots has never been easier. We want to build a bot where we can upload a page screenshot or photo and it detects which Kendo UI for Angular components can help us to build it, with a nice recommendation explaining what each one does and why to use it, plus links to resources. Sound challenging? Not to worry, Progress Kendo UI provides a set of components to help: Kendo UI for Angular Conversational UI, Kendo Upload and the power of gemini-1.5-flash. Let’s get to coding! First, create a new Angular application using the Angular CLI with the command ng new chatLens. This will generate a new Angular project named “ChatLens.” Next, navigate to your project folder using cd chatLens. In the terminal, install the Kendo UI for Angular Conversational UI and Kendo UI for Angular Uploads libraries using the schematics: To get an API key, visit https://aistudio.google.com/apikey, sign in with your Google account and create an API key. Copy the key and save it in your project by creating an environment.ts file in the src/environments directory. Export a variable named GEMINI_KEY and assign your API key to it. Now, with Kendo UI components and Gemini set up, you’re ready to create the service to talk with Gemini To integrate Gemini into our chatbot, we’ll create a service named GeminiService using the Angular CLI. It will handle communication with the AI model and process user inputs and image uploads."
