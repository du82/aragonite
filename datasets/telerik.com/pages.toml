full_description = "With three different QE automation platforms being used by their 100-strong worldwide testing team, Vistaprint needed to create a strategic solution that would support their future development needs. Inspired by the vision of a Quality Platform to support business activities across the organization, Vistaprint set out to replace its three existing QE automation platforms with a single, unified QE automation platform. Vistaprint chose to leverage the Telerik Testing Framework, part of the Test Studio family, a framework for writing automated tests for HTML5, AJAX, Silverlight and WPF applications, ahead of automation frameworks from Microsoft and Selenium. By using the Telerik Testing Framework, Vistaprint: • Saved an enormous amount of time and effort, since they were familiar with the product, and it met their varied needs; • Incorporated this framework into their single UI framework; • They were able to test using recent versions of IE and FF; Some years earlier, Vistaprint had three separate and independently operating automation platforms that were used to validate their solutions. Two of the three platforms were used for the majority of the testing. These two platforms used the WebAii/Telerik framework. Each of these platforms had advantages and disadvantages but none could scale for the long-term without extensive increase in maintenance cost. In total, there were over a million lines of code and over 6,000 automation test programs across all three platforms. An initiative began to replace these three systems with one unified automation platform. This was part of a wider vision to create a quality platform to support business activities throughout the organization. “Our initial estimate to develop the new unified platform was approximately one year with 4.5 engineers and another year to rewrite automation and retire the legacy systems using 5 engineers. Our estimates were fairly accurate. The most difficult part was finding qualified people for the project since it was a unique venture. We have retired all of the legacy systems."
