description = "Test Studio Case Study - read How Scorpion Software Saved $100k a Year with Telerik Test Studio."
full_description = "For a company selling security, system quality is not optional – it’s the core of the business. Scorpion Software needed a highly capable automated testing system which was easy to use, could provide rich data and integrate with existing infrastructure. With three product lines and multiple platforms to support, Scorpion Software knew that rigorous quality assurance could only be delivered by an automated testing system. Scorpion Software evaluated several testing products. They chose Test Studio by Telerik and they built a custom testing platform around Test Studio. Scorpion Software saw a $75-100,000 saving in the first year while testing three times the volume of code they were testing just two years before. With three product lines and multiple platforms to support, Scorpion Software knew that rigorous quality assurance could only be delivered by an automated testing system. “My goal will always be to automate as much as we can,” says Dana. “Automation has been instrumental in increasing our product quality by maintaining a constant, consistent testing process.” As a fast-growing company, Scorpion Software’s needs were rapidly increasing, and their legacy testing system was unable to keep pace. “The product we were using simply wasn’t capable of doing web testing across so many browsers while also maintaining WPF testing in the same project. We needed a single product that could do it all. The time saved in not having to use two different products was a motivating factor. So was the cost.” Scorpion Software evaluated several testing products, and they chose Test Studio by Telerik. Scorpion Software built a custom testing platform around Test Studio. Running overnight, the platform automatically spins up clean virtual machines for all the operating systems the company targets. It installs Scorpion Software products on the virtual machines and runs Test Studio tests on them. Results are reported to a dashboard where staff can view them first thing in the morning."
