["https://telerik.com/blogs/image-manipulation-nestjs-sharp"]
title = "Image Manipulation with NestJS and Sharp"
description = "Learn the importance of image optimization and how to integrate the Sharp library with NestJS to perform some image manipulation techniques."
full_description = "Learn the importance of image optimization and how to integrate the Sharp library with NestJS to perform some image manipulation techniques. In this post, we will create an image manipulation web app using the Sharp library and NestJS. We will learn the importance of image optimization and how to integrate the Sharp library with NestJS to perform image manipulation techniques like blurring, changing image format, rotating, flipping, etc. Sharp is an easy-to-use Node.js library for image processing. It is widely used because of its speed, output image quality and minimal code requirement. NestJS is a backend Node.js framework widely loved for its modular architecture. This architecture promotes separation of concerns, allowing developers and teams to quickly build scalable and maintainable server-side applications. NestJS also has several built-in modules to handle common tasks like file uploads and serving static files, which we will use to integrate Sharp into our app. While images enhance websites, unoptimized ones can slow them down. Unoptimized images lead to longer load times, poor user experience and increased website storage costs. This can be a significant difference between an amazing and a terrible site. Image optimization means delivering high-quality visuals in an efficient format and size. Optimizing images can directly impact user retention and search engine rankings, so optimizing images is very important. When choosing a file format, you first have to distinguish between older and more widely supported formats and newer, better-performing formats. Newer formats like WebP and AVIF are becoming more preferred, and fallback images can be used for compatibility with browsers that do not support them. To begin, you’ll need to install the NestJS CLI if you haven’t done so already. Run the following command to install it: You will be prompted to pick a package manager. For this article, we’ll use npm (node package manager). Once the inst