["https://telerik.com/blogs/blazor-basics-lazy-load-assemblies-boost-performance-blazor-webassembly"]
title = "Blazor Basics: Lazy Load, Boost Blazor Wasm Performance"
description = "Learn how to implement lazy loading assemblies in Blazor WebAssembly to improve the app’s performance."
full_description = "Learn how to implement lazy loading assemblies in Blazor WebAssembly to improve the app’s performance. There are several performance optimizations you can apply to improve the overall performance of a Blazor WebAssembly application. However, depending on the application’s size, the WebAssembly file downloaded to the client can cause a noticeable delay. In this article, I will show you how to implement lazy loading assemblies into a Blazor WebAssembly application. This approach allows you to shrink the main assembly’s size and load more code on demand. With lazy loading, we can defer the loading of an assembly until the user navigates to a route that requires the assembly. When the user navigates to the member section, for example, by clicking on a link in a navigation menu, we load the assembly containing the member section. First, we create a Blazor WebAssembly Standalone application. Lazy loading also works when hosting the application using an ASP.NET Core server project, but we want to focus on the client-side WebAssemby application. I name the application BlazorWasmLazyLoading. This name is important because I will use the same naming scheme when creating and referencing the Razor Class Library. The foundation of implementing lazy loading for a Blazor WebAssembly application is splitting the components into different projects during development. We must create a Razor Class library and move all the components we want to lazy load from the main Client project into the Razor Class library. In this example, we want to implement a member section, which will only be loaded when the user navigates to the /members route. We create a new Razor Class Library and name it BlazorWasmLazyLoading.Members. In this Razor Class Library, I add a Pages folder and the following Members page component: It’s a simple component for demonstration purposes, which registers itself with the Routing system for the /members route and renders some HTML that stylizes a login form. Now that we have a Razor Class Library project inside the solution, we need to add a project reference from the BlazorWasmLazyLoading project to the BlazorWasmLazyLoading.Members project."
year_published = 2025
year_updated = 2025
