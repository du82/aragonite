title = "Customers - TempoDB"
description = "TempoDB is a database service purpose-built to store and analyze massive streams of time series data."
full_description = '''Wattvision makes it easy to save money on energy by providing live feedback on energy use. Wattvision works through a sensor that connects to their customer's electricity meters and wireless internet connections, and the company leverages our service to store and analyze their sensor data. "sMeasure provides online energy analytics to SMB customers, and this requires an efficient time series data platform. TempoDB has really helped us capture, organise and store large volumes of energy data from our customers, so we can focus on the analytics to identify energy savings for them." Cloudability makes cloud management easy. With their service, Cloudability's customers can easily analyze and optimize all of their cloud usage and costs. Customers including Adobe, KISSMetrics, and Slideshare rely on Cloudability to manage their clouds, and Cloudability relies on us to store and analyze their time series data. “We could have hired one or two more engineers and we could have put them a day or two a week keeping this behemoth time series database up and running and trying to figure out how to scale it but in no way, shape, or form would it be anywhere near as efficient as just completely outsourcing the problem to a team of specialists.” Read The Full Interview → “It turns out time series data is a really hard problem. We started with MySQL, and when that failed, we tried MongoDB. The hard problem is the number crunching. We need data at a granular level and need to query it lots of different ways in real time. TempoDB is exactly what we wanted. The data is granular, we can query ad hoc. It just works.” Read The Full Interview →'''
