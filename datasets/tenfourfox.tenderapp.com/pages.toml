full_description = "TenFourFox wants to hear from you Welcome to TenFourFox’s Tender. This is the home of all support for TenFourFox. You can search our knowledge base articles, browse public discussions, or create a new discussion if you’re having trouble. Before you begin, see if your question has already been answered with our quick list of support links. Please also make sure you are using the most current version of TenFourFox. If you take the time to create an account, you’ll be able to post private discussions (that only yourself and our support team can see) and track your existing discussions. However, if you don’t want to create an account, you can still create a public discussion in our discussion area. Beta and unstable branch users (or users testing beta features) should use the TenFourFox Development blog -- this is intended for PowerPC users on the stable branch. Please note that old inactive discussions and problem reports are subject to periodic removal. Nothing personal; we're just trying to reclaim the space. Support Staff Our team is here to help Start a discussion ＋ Browse discussions ☰ Knowledge Base ? Recent Discussions 07 Feb, 2025 12:03 AM Processor Thrashing 20 Nov, 2024 05:54 PM Work has never been so easy 07 Apr, 2024 01:02 AM usaa requires cookies. I don't know how to allow them. So I used a firefox browser that is not secure to pay. 05 Oct, 2023 05:51 PM Want to Share Compiled Version 26 Apr, 2023 03:52 PM sorbet leopard Recent Articles Using the TenFourFox preference pane Help! Where Do I Begin?? How to reset your profile"
