amic_stitch(...): Interleave the values from the data tensors into a single tensor. edit_distance(...): Computes the Levenshtein distance between sequences. eig(...): Computes the eigen decomposition of a batch of matrices. eigvals(...): Computes the eigenvalues of one or more matrices. einsum(...): Tensor contraction over specified indices and outer product. ensure_shape(...): Updates the shape of a tensor and checks at runtime that the shape holds. equal(...): Returns the truth value of (x == y) element-wise. executing_eagerly(...): Checks whether the current thread has eager execution enabled. exp(...): Computes exponential of x element-wise. \(y = e^x\). expand_dims(...): Returns a tensor with a length 1 axis inserted at index axis. extract_volume_patches(...): Extract patches from input and put them in the "depth" output dimension. 3D extension of extract_image_patches. eye(...): Construct an identity matrix, or a batch of matrices. fftnd(...): ND fast Fourier transform. fill(...): Creates a tensor fil'''
