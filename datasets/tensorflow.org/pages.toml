full_description = '''/* Styles inlined from /community/tf-everywhere/styles/tf-everywhere.css */ /* Common event styles */ /* @import url("https://developers.google.com/site-assets/styles/events.css"); */ /* Hero and videos */ .tensorflow-everywhere-hero-bg { background: center top no-repeat url(/site-assets/images/marketing/hero-shape-bg.svg); background-size: contain; } .tensorflow-everywhere-hero .devsite-landing-row-group { position: relative; z-index: 1; } /* Patterns */ .tensorflow-everywhere-video::before, .tensorflow-everywhere-video::after, body[theme] .tensorflow-everywhere-cta::after { content: ''; display: block; height: 100%; left: 50%; pointer-events: none; position: absolute; top: 0; transform: translateX(-50%); width: 100vw; z-index: 0; } body[theme] .tensorflow-everywhere-cta::after { background: 0 calc(100% + 30px) / 100% no-repeat url(/dev-summit/images/pattern-bottom.png); } /* CTA */ body[theme] .tensorflow-everywhere-cta.devsite-landing-row h2, body[theme] .tensorflow-everywhere-cta.devsite-landing-row .devsite-landing-row-item-description-content { color: #fff; } body[theme] .tensorflow-everywhere-cta.devsite-landing-row { background-image: linear-gradient(-145deg, #ff9100 calc(50% - 25vw), #ff6F00 calc(50% + 25vw)); color: #fff; padding-bottom: 80px; padding-top: 80px; position: relative; } body[theme] .tensorflow-everywhere-cta .devsite-landing-row-group { position: relative; z-index: 1; } /* Directory for TensorFlow Everywhere */ .tf-everywhere__directory { text-align: center; } .tf-group__no-bottom-padding { padding-bottom: 0; } .tf-group__full-width .devsite-landing-row-item-description { grid-column: 1/span 12 !important; } .tf-group__full-width .devsite-landing-row-item-buttons { margin-top: 8px; } .tf-group__full-width .devsite-landing-row-item-body { justify-content: center; } /* Title for TensorFlow Everywhere Directory */ @media (max-width: 600px) { .tf-everywhere__directory__title { padding: 0 20px; } } TensorFlow Community Groups Stay organized with collections Save and categorize content based on your preferences. TensorFlow User Groups TensorFlow User Groups (TFUGs) are communities of developers, engineers, data scientists, and ML practitioners who are passionate about TensorFlow and related technologies. Join a TFUG near you! Previous Events TensorFlow Everywhere TensorFlow Everywhere 2021 was a series of global events presented in 10 languages by TensorFlow and machine learning communities in over 23 countries. Learn more Hosting an event? Let us know! Start a community Can’t find a TensorFlow User Group in your city? Apply to start one! See application form'''
