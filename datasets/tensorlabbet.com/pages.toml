title = "Summary of Ilya Sutskever's AI Reading List · Tensor Labbet"
full_description = "Summary of Ilya Sutskever's AI Reading List 24 Sep 2024, Taro Langner In this post: Ilya Sutskever's AI Reading list in ~120 words per item (15 min read) Earlier this year, a reading list with about 30 papers was shared on Twitter. It reportedly forms part of a longer version originally compiled by Ilya Sutskever, co-founder and chief scientist of OpenAI at the time, for John Carmack in 2020 with the remark: ‘If you really learn all of these, you’ll know 90% of what matters’. While the list is fragmentary and much has happened in the field since, this endorsement and the claim that it was part of onboarding at OpenAI quickly made it go somewhat viral. At about 300,000 words total, the combined content nonetheless corresponds to around one thousand book pages of dense, technical text and requires a decent investment in time and energy for self-study. After doing just that, I therefore dedicate this blog post to all those of us who provisionally bookmarked it (“for later”) and are still curious. What follows is my own condensed and structured summary with about 120 words per item, free of mathematical notation, to capture the essential key points, context and some perspective gained from reading it with the surrounding literature. In a Nutshell The list contains 27 reading items, with papers, blog posts, courses, one dissertation and two book chapters, all originally dating from 1993 to 2020. The contents can be roughly broken down as follows: Methodology Items Share* Topics Convolutional Neural Networks (CNNs) 5 25% image recognition, semantic segmentation Recurrent Neural Networks (RNNs) 10 19% language modeling, speech-to-text, machine translation, combinatorial optimization, visual question answering, content-based attention Transformers 3 6% multi-head and dot-product attention, language model scaling Information Theory 5 42% Kolmogorov complexity, compression, Minimum Description Length Miscellaneous 4 8% variational inference, representation learning, graph neural networks, distributed training Using these categories, the next sections summarize the gist of each item, roughly sorted by how they build on each other. Convolutional Neural Networks CS231, 2017 Stanford University Course Length: ~50,000 words, forming 11 blocks of 2 modules Instructors: Fei-Fei Li, Andrej Karpathy and Justin Johnson 🔗 [CS231, 2017] is a classic course on deep learning fundamentals from Stanford University. It builds up from linear classifiers and their ability to learn a given task based on mathematical optimization, or training, which adjusts their internal parameter weights such that applying them to input data will produce more desirable outputs. This basic concept is developed into backpropagation for training of neural networks, in which trainable parameters are typically arranged into multiple layers together with other modules such as activation functions and pooling layers. Convolutional Neural Networks (CNNs) are introduced as a specialized architecture for image recognition, as used in modern computer vision systems to this day. Extended video lectures are available on youtube. Note: If you are starting from zero, this course and newer resources by e.g. DeepLearning.AI on Coursera or FastAI will help you to get more out of the remaining list. AlexNet, 2012 Paper Length: ~6,000 words Authors: Alex Krizhevsky, Ilya Sutskever and Geoffrey E. Hinton 🔗 [AlexNet, 2012] established CNNs as state of the art for image recognition and arguably initiated the widespread hype around deep learning. It outperformed its competitors in the 2012 ImageNet benchmark challenge, predicting whether a given input image contained e.g. a cat, dog, ship or any other of 1,000 possible classes, so conclusively that the real-world dominance of deep learning became commonly accepted. An important factor was its early* CUDA implementation that enabled unusually fast training on GPUs. *Note: Earlier GPU implementations are documented in section 12.1.2 of the book Deep Learning. ResNet, 2015 Paper Length: ~6,000 words Authors: Kaiming He, Xiangyu Zhang, Shaoqing Ren and Jian Sun 🔗 [ResNet, 2015] succeeded AlexNet as a more modern CNN architecture, reaching first place on the ImageNet challenge in 2015. It remains a popular CNN architecture to this day and is subject of ongoing research. It introduced residual connections into CNN architectures that had become ever deeper, stacking more convolutional layers to achieve higher representational power. By allowing residual connections to skip or bypass entire blocks of layers, ResNet architectures suffered less from gradient degradation effects in training and could thus be robustly trained at previously unseen depth. ResNet identity mappings, 2016 Paper Length: ~6,000 words Authors: Kaiming He, Xiangyu Zhang, Shaoqing Ren and Jian Sun 🔗 [ResNet identity mappings, 2016] were later proposed by the ResNet authors as a ‘clean’ information path and best design for the skip connections, so that their contents are merely added to the results of a bypassed block without any further modification. Whereas earlier designs placed an activation layer on the skip path after the addition, the proposed pre-activation design moves this layer to the start of the bypassed block instead. The skip connections can thus form a shortcut through the entire neural network that is only interrupted by additions, allowing improved propagation of gradient signals that make it possible for even deeper neural networks to be trained. Dilated convolutions, 2015 Paper Length: ~6,000 words Authors: Fisher Yu and Vladlen Koltun 🔗 [Dilated convolutions, 2015] (or à trous convolutions) were proposed as a new type of module for dense prediction with CNNs in tasks like semantic image segmentation, where class labels are assigned to any given pixel of an input image. Architectures such as AlexNet and ResNet condense input images to lower-dimensional representations via strided convolutions or pooling layers to predict one class label for an entire image. Related architectures for dense prediction therefore typically restore the original input image resolution from these downsampled, intermediate representations via upsampling operations. Whereas e.g. transpose convolutions achieve this with competitive results, dilated convolutions avoid downsampling entirely. Instead, they space out the filter kernel of a convolutional layer to skip one or more neighboring input pixels, thereby providing a larger receptive field without any reduction in resolution. Recurrent Neural Networks Today, Recurrent Neural Networks (RNNs) have been largely superseded by Transformers and date from what Ilya Sutskever himself would later call the “[pre-2017] stone age” of machine learning. They nonetheless remain subject of active research and see continued use in certain applications. Forming a substantial part of the reading list, they showcase the evolution of early insights and architectural developments that lead up to the systems of today. Most of the RNNs listed below are Long Short-Term Memory (LSTM) architectures. Some designs furthermore include Feedforward Networks with no recurrent connections, usually trained end-to-end as part of the model. Understanding LSTM Networks, 2015 Blog Post Length: ~2,000 words Author: Christopher Olah 🔗 [Understanding LSTM Networks, 2015] provides a brief introduction to RNNs and LSTMs in particular. RNNs can process a sequence of inputs, one step at a time, while evolving a hidden state vector that is (re-)ingested, updated and returned again at each step along the input sequence. The hidden state vector thereby allows for information to persist and be passed to subsequent processing steps. Nonetheless, simpler RNNs typically struggle with long-term dependencies. LSTMs alleviate this by introducing a cell state as additional recurrent in- and output, acting as a memory pathway for addition, update or removal of information along each processing step via trainable gating mechanisms. The Unreasonable Effectiveness of RNNs, 2015 Blog Post Length: ~6,000 words Author: Andrej Karpathy 🔗 [The Unreasonable Effectiveness of RNNs, 2015] shows use cases and results of RNNs in action. They are distinguished by their ability to both process and predict variable-sized sequences while also maintaining an internal state, prompting the author Andrej Karpathy to state “If training vanilla neural nets is optimization over functions, training recurrent nets is optimization over programs.”. He showcases results for image captioning and character-level language modeling that enables RNNs to automatically generate prose and articles. Early code generation capabilities are noted, with convincing syntax but failure to compile and a tendency to suffer from hallucinations where the model provides outputs as most probable that are evidently incorrect. The blog post also includes a minimal RNN code example. RNN Regularization, 2014 Paper Length: ~3,500 words Authors: Wojciech Zaremba, Ilya Sutskever and Oriol Vinyals 🔗 [RNN regularization, 2014] addresses the challenge of training large RNNs without overfitting, where a model would excessively adapt to, or even memorize, its training samples and fail to generalize to new data. A technique for regularization, which aims to reduce this effect, was proposed that applies dropout, which omits randomly selected outputs of a given neural network layer. Dropout had been known for several years and was used e.g. in AlexNet. Here, the key insight was to utilize dropout only within a given RNN cell, but to avoid it on the recurrent connections that carried the hidden state vector. In this way, larger RNNs could avoid overfitting while preserving long-term dependencies. Neural Turing Machines, 2014 Paper Length: ~7,500 words Authors: Alex Graves, Greg Wayne and Ivo Danihelka 🔗 [Neural Turing Machines, 2014] were proposed as a form of memory-augmented neural network, with an external memory bank on which an RNN controller could write or erase information with a ‘blurry’, differentiable, attention-based focus. Equipped with this working memory, the Neural Turing Machine outperformed a baseline RNN in experiments involving associative recall, copying and sorting sequences and generalized more robustly to sequence lengths that exceeded those encountered in training. Deep Speech 2, 2016 Paper Length: ~7,000 words Authors: Dario Amodei, Sundaram Ananthanarayanan, Rishita Anubhai, Jingliang Bai, Eric Battenberg, Carl Case, Jared Casper, Bryan Catanzaro, Qiang Cheng, Guoliang Chen, Jie Chen, Jingdong Chen, Zhijie Chen, Mike Chrzanowski, Adam Coates, Greg Diamos, Ke Ding, Niandong Du, Erich Elsen, Jesse Engel, Weiwei Fang, Linxi Fan, Christopher Fougner, Liang Gao, Caixia Gong, Awni Hannun, Tony Han, Lappi Johannes, Bing Jiang, Cai Ju, Billy Jun, Patrick LeGresley, Libby Lin, Junjie Liu, Yang Liu, Weigao Li, Xiangang Li, Dongpeng Ma, Sharan Narang, Andrew Ng, Sherjil Ozair, Yiping Peng, Ryan Prenger, Sheng Qian, Zongfeng Quan, Jonathan Raiman, Vinay Rao, Sanjeev Satheesh, David Seetapun, Shubho Sengupta, Kavya Srinet, Anuroop Sriram, Haiyuan Tang, Liliang Tang, Chong Wang, Jidong Wang, Kaifu Wang, Yi Wang, Zhijian Wang, Zhiqian Wang, Shuang Wu, Likai Wei, Bo Xiao, Wen Xie, Yan Xie, Dani Yogatama, Bin Yuan, Jun Zhan, Zhenyao Zhu 🔗 [Deep Speech 2, 2016] proposed an automatic speech recognition system to convert audio recordings into text by processing log-spectrograms representing the audio with RNNs to predict sequences of characters of either English or Mandarin. The authors utilized batch normalization instead of dropout for regularization on the non-recurrent layers and Gated Recurrent Units (GRUs) as a somewhat simplified alternative to LSTMs used in most of the other papers examined so far, together with a plethora of other engineering tweaks, including batched processing for low-latency streaming output. RNNsearch, 2015 Paper Length: ~8,000 words Authors: Dzmitry Bahdanau, KyungHyun Cho and Yoshua Bengio 🔗 [RNNsearch] is credited with introducing the first attention mechanism into Natural Language Processing (NLP), proposing additive, content-based attention for neural machine translation. Its encoder-decoder architecture encodes an input sequence of English words with an RNN encoder into a context vector used by an RNN decoder to predict an output sequence of French words. In prior work this context vector was simply the final hidden state of the encoder, which therefore had to contain all relevant information about the input sequence. RNNsearch addresses this bottleneck by making the context vector a weighted sum over all encoder hidden states, or annotations. When predicting a target word, the decoder can thereby rely on context from arbitrary parts of the encoded input sequence by (re-)calculating the context vector as a weighted sum of annotations. The weighting is determined by an alignment model, a feedforward network that receives the current decoder hidden state together with an annotation and assigns a score to the latter. Pointer Networks, 2015 Paper Length: ~4,500 words Authors: Oriol Vinyals, Meire Fortunato and Navdeep Jaitly 🔗 [Pointer Networks] repurpose the concept of content-based attention to solve combinatorial optimization problems. Here, content-based attention is used to ‘point’ at elements of the input sequence in a specific order. The output sequence is therefore an indexing of the input elements. Given a set of two-dimensional points as input, Pointer Net was trained to solve for their convex hull, Delaunay triangulation or Traveling Salesman Problem by predicting in which order these points should be visited. With no limitation to the length of the output sequence or dictionary, this approach was found to generalize beyond the longest sequence length encountered in training. Set2Set, 2016 Paper Length: ~6,500 words Authors: Oriol Vinyals, Samy Bengio and Manjunath Kudlur 🔗 [Set2Set] extends sequence-to-sequences methods as examined above to enable order-invariant processing of sets. These methods are shown to strongly depend on the specific order of both an input and output sequence (e.g. the exact order of random points provided to Pointer Networks for convex hull prediction). The authors propose Set2Set as a solution, with the encoder forming a memory bank (that resembles annotations of RNNSearch) to create a context vector. This memory bank, however, is sampled more than just once. Instead, a process block introduces a new LSTM, which evolves a query vector for repeated, content-based attention readouts of the memory. Finally, the write block (a Pointer Network) can add even more attention steps in the form of glimpses. Relation Networks, 2017 Paper Length: 5,000 words Authors: Adam Santoro, David Raposo, David G. Barrett, Mateusz Malinowski, Razvan Pascanu, Peter Battaglia, Timothy Lillicrap 🔗 [Relation Network, 2017] modules were proposed as a method for relational inference tasks such as vis"
