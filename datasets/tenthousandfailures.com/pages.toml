  Why the site name of "Ten Thousand Failures"? I had read a disputed quote of Thomas Edison from when he was searching for the filament material he would use in his lightbulb invention, where he remarked something similar to "I have not failed. I've just found 10,000 ways that won't work."  There was a wonderful history of this disputed quote on Quote Investigator that suggest the first, and in their opinion best, direct quote to actually be "Why, man, I have gotten a lot of results! I know several thousand things that won’t work."  Regardless of the exact words, I liked the lack of fear of failing described by Edison.  Despite all of Edison's accomplishments, he still had to beat his projects into submission; even his circuits didn't work the first time.Who is Eldon Nelson?Eldon Nelson is a Verification Application Engineer working at Synopsys.  He received his B.S. and M.S. degree in electrical engineering from the University of Minnesota and is a licensed Professional Engineer (P.E.).  Eldon's technical blog tenthousandfailures.com features posts on verification and GNU Emacs - two of his favorite topics.  Before working at Synopsys he has worked for: Intel, Micron Technology, IBM, Unisys, and the National Science Foundation.
























  
  
  


  


      
                                
  
  
  
  
  
  


  
  



    
  
                    




