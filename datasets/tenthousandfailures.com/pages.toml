              Designing my First Product              
                        Apr 15                Written By Eldon Nelson                  
            


  A timecode generator generates a synchronized clock signal, that sounds kind of like an analog modem, that allows two or more cameras/audio recorders to keep perfectly in sync. Surprisingly there is only one standard for this signal today across all cameras, audio recorders and more! I use one to automatically synchronize my Sony camera to an external audio recorder when I do talking head videos.I have been a user of the Tentacle Sync E timecode generator for years now and I love the product. It does exactly what I need and I never had to sync the audio and video in my recordings again. But the mount to the camera was always something I never liked. So I decided to design and build my own.I have it available on my shop here! You can see the video below to see what it looks like.





















  
  






  This mount snaps around the Tentacle Sync E. The mounting solution that Tentacle ships with is a bunch of velcro stickers. I thought this was an okay cost effective method, but I was always worried about adhesion and the Tentacle Sync E flying off the camera or the audio recorder. I couldn’t find or craft good solutions that would solidly attach to my camera, my solutions would rotate or slowly come undone.This mount is designed and manufactured by me in the USA and met a need that I saw for the Tentacle Sync E. The mounts that are available on the Tentacle Sync Shop didn’t have the full cage that I was looking, used the cold shoe mount (which I hate using) or were only partially gripping the device.This mount has two 1/4 20 mounting points that line up perfectly with the mounting grid on SmallRig cages (18mm apart). You can also just mount it with one screw if you don’t mind some rotation. The Tentacle Sync E can be inserted in face-front or face-back into the cage. The buttons are accessible in either orientation. You can still see the colored rubber band strap from the front or the back and the PLA+ plastic does not effect the bluetooth radio signals. The bottom cutout is generous and can fit standard and even beefy-sized USB C connectors - making charging available even when mounted.





















  
  




      
                        Octo CageTentacle Sync E                                      
    
  
  Eldon Nelson

Eldon Nelson is a Verification Engineer working at Intel.  He received his B.S. and M.S. degree in electrical engineering from the University of Minnesota and is a licensed Professional Engineer (P.E.).  Eldon's technical blog tenthousandfailures.com features posts on verification and GNU Emacs - two of his favorite topics.  Before working at Intel he has worked for: Micron Technology, IBM, Unisys, and the National Science Foundation.
http://tenthousandfailures.com
                  
                                                
  



  
  
  


  


      
                        
