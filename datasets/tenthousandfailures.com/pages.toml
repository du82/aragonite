              Verilog Flip-Flop Macros by Chris Drake                                Verification              
                        Aug 31                Written By Eldon Nelson                  
            


  Chris Drake's blog Fuzzy Logic had a particular post titled Verilog Flip-Flop Macros which I thought was really good. It deals with creating an abstraction of a flip-flop in SystemVerilog. Check it out.He mentions that there is a two orders of magnitude difference in performance in implementing the macro abstraction versus the module abstraction of a flip-flop. I had to try out the example. I was not going to sit for a simulation to run for fifty minutes, but I did bring down the iterations to make it run in a more reasonable amount of time - about a minute on my machine for the longer run. I verifed that the performance difference between the two methods is as stated.I'll forward this on to our EDA vendor to see if there is some hope to improve the runtime.I agree with Chris that I hate using macros in SystemVerilog. I really like his solution to creating modules that implement basic logic design elements in a guaranteed way without the cheat of a macro. His module implementation looks clean and fits the style of SystemVerilog.The code of his example is put onto my Github account here.Instruction to RunCommand Line for Mentor Questavlib work
time vsim -64 -c -do run.do
























      
                        SystemVerilogMentor Questa                                      
    
  
  Eldon Nelson

Eldon Nelson is a Verification Engineer working at Intel.  He received his B.S. and M.S. degree in electrical engineering from the University of Minnesota and is a licensed Professional Engineer (P.E.).  Eldon's technical blog tenthousandfailures.com features posts on verification and GNU Emacs - two of his favorite topics.  Before working at Intel he has worked for: Micron Technology, IBM, Unisys, and the National Science Foundation.
