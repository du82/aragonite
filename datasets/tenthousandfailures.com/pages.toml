      Enclosure and mount for Tentacle Sync E timecode unit. Has mounting holes for two 1/4 inch 20 screws. They are spaced as to fit a SmallRig cage (18 mm apart). Made from durable PLA+ in black or white! Free USPS Priority shipping. Payment via credit card or Apple Pay (through Safari or iPhone). See product video below!        Enclosure and mount for Tentacle Sync E timecode unit. Has mounting holes for two 1/4 inch 20 screws. They are spaced as to fit a SmallRig cage (18 mm apart). Made from durable PLA+ in black or white! Free USPS Priority shipping. Payment via credit card or Apple Pay (through Safari or iPhone). See product video below!  
  


      


  This mount snaps around the Tentacle Sync E. The mounting solution that Tentacle ships with is a bunch of velcro stickers. I thought this was an okay cost effective method, but I was always worried about adhesion and the Tentacle Sync E flying off the camera or the audio recorder. I couldn’t find or craft good solutions that would solidly attach to my camera, my solutions would rotate or slowly come undone.This mount is designed and manufactured by me in the USA and met a need that I saw for the Tentacle Sync E. The mounts that are available on the Tentacle Sync Shop didn’t have the full cage that I was looking, used the cold shoe mount (which I hate using) or were only partially gripping the device.This mount has two 1/4 20 mounting points that line up perfectly with the mounting grid on SmallRig cages (18mm apart). You can also just mount it with one screw if you don’t mind some rotation. The Tentacle Sync E can be inserted in face-front or face-back into the cage. The buttons are accessible in either orientation. You can still see the colored rubber band strap from the front or the back and the PLA+ plastic does not effect the bluetooth radio signals. The bottom cutout is generous and can fit standard and even beefy-sized USB C connectors - making charging available even when mounted.1 year warranty against defects.Temperature safe up to 122 F or 50 C. So don’t leave it on your dashboard on a very hot summer day, keep care of it like your other camera gear.





















  
  



