              Owning a Tesla: Going Electric Talk at IEEE Rochester, Minnesota                                Public Speaking              
                        Jan 27                Written By Eldon Nelson                  
            


  I had given a talk in September, 2018 titled “Owning a Tesla: Going Electric” for the IEEE Twin Cities Section on my experiences as a Tesla owner with my Model S.I’m excited to share that I will be giving an updated version of that talk tomorrow, Monday, January 28th 2019, in Rochester, Minnesota for the IEEE Southern Minnesota Section.The event is free and open to the public. There may even be free pizza ;)The details and signup for the event are available here - please RSVP to help with planning. Talk at 6:30 pm on Monday, January 28th, 2019.I’ll be talking on topics below:Cost per Mile versus a traditional ICE (internal combustion engine)Projected Maintence and CostsEngineering tricks that make the Tesla suite of vehicles capable of over 300 miles rangeHow the Tesla Supercharger Network WorksTeslas in recent Extreme Coldand moreThe slides I used are available here in PDF format.


























  


  
  

