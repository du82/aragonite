full_description = '''Verification, Public Speaking Eldon Nelson 9/24/23 Verification, Public Speaking Eldon Nelson 9/24/23 Speaking at DVClub Austin September 2023 I’m looking forward to speaking at DVClub this Thursday. If you are in Austin you can register for free below.The topic of my talk will be a paper I presented at DVCon 2021 “Can Formal Outsmart Synthesis: Improving Synthesis Quality of Results through Formal Methods”. If you haven’t been to a DVClub event before, you will enjoy it! There is typically a catered lunch and one or two guest speakers. The talks are of general interest and typically touch verification, but sometimes industry topics. Read More Verification Eldon Nelson 10/9/18 Verification Eldon Nelson 10/9/18 Humble Book Bundle of O'Reilly Books - Head First Design Patterns A few years ago I wrote a paper for the Design and Verification Conference inspired by the book “Head First Design Patterns” by Robson and Freeman. “Head First Design Patterns” is an excellent way to learn about Design Patterns. I liked the style of the book, which was lighthearted and written in a conversational tone. It made learning about Design Patterns actually fun! Read More Verification Eldon Nelson 6/3/17 Verification Eldon Nelson 6/3/17 Improving Constrained Random Testing - Second Place Paper at DVCon 2017 I am excited to share my latest paper which was recently published at DVCon 2017 in San Jose, California. The full title is:"Improving Constrained Random Testing by Achieving Simulation Verification Goals through Objective Functions, Rewinding and Dynamic Seed Manipulation"AbstractConstrained Random simulation is so critical to modern verification environments that it is a major component of the SystemVerilog language itself. This paper proposes a method that improves how UVM Constrained Random simulations are run. By abstracting the purpose of a simulation to be achieving “Objective Functions” (nominally coverage goals), it is possible to have the simulation autonomously explore deep possibilities from multiple points in time of a standard UVM testbench governed by feedback. This method has a number of benefits including: faster automated coverage closure, an efficient final stimulus solution and proposed higher quality of coverage. Read More Verification Eldon Nelson 3/7/16 Verification Eldon Nelson 3/7/16 Best Paper at Design and Verification Conference 2016 I'm honored to share that my paper:"Design Patterns by Example for SystemVerilog Verification Environments Enabled by SystemVerilog 1800-2012"was awarded Best Paper at the Design and Verification Conference (DVCon) 2016. The link to the final paper is now available. Read More Verification Eldon Nelson 11/15/15 Verification Eldon Nelson 11/15/15 One Parameterized Bind to Bind Them All The SystemVerilog bind command allows for adding new functionality to a module. Typically, it is used to add new checking to a RTL block.I wrote the example code (available on GitHub here) below to demonstrate a feature of bind that allows the binded module to parameterize itself based on where it is being used. When you think about what bind is actually doing it starts to make sense. Read More Verification Eldon Nelson 7/19/15 Verification Eldon Nelson 7/19/15 Implicit Port Connections Summary I was working on a testbench and made a mistake. I saw a SystemVerilog code construct I wasn't used to and "corrected" it. I ended up disconnecting a port that was implicitly connected. There is already an authorative paper on this subject "SystemVerilog Implicit Port Connections by Cliff Cummings" which is very good. Read More Verification Eldon Nelson 4/18/15 Verification Eldon Nelson 4/18/15 uvm_report_object Feature Examples Read More Verification Eldon Nelson 3/15/15 Verification Eldon Nelson 3/15/15 SystemVerilog Constraint Layering Examples from John Dickol Read More Verification Eldon Nelson 3/3/15 Verification Eldon Nelson 3/3/15 DVCon 2015 Paper and Presentation Read More Verification Eldon Nelson 9/1/14 Verification Eldon Nelson 9/1/14 The Observer Pattern in SystemVerilog The next Design pattern I ported to SystemVerilog is the Observer Pattern below. See the Strategy Pattern in SystemVerilog for more background on this mini project.Observer Pattern in SystemVerilog on GitHub Read More Verification Eldon Nelson 8/31/14 Verification Eldon Nelson 8/31/14 Verilog Flip-Flop Macros by Chris Drake Chris Drake's blog Fuzzy Logic had a particular post titled Verilog Flip-Flop Macros which I thought was really good. It deals with creating an abstraction of a flip-flop in SystemVerilog. I had to try out his example code myself to verify the performance differences he experienced. Read More Verification Eldon Nelson 7/13/14 Verification Eldon Nelson 7/13/14 The Strategy Pattern in SystemVerilog I had watched a wonderful video series of Object Oriented Design Patterns on Lynda.com called "Foundations of Programming: Design Patterns" by Elisabeth Robinson and Eric Freeman. In their series, they go through some of the ideas in "Design Patterns" and have very concise code examples that illustrate specific Design Patterns. Read More Verification Eldon Nelson 6/15/14 Verification Eldon Nelson 6/15/14 Merging SystemVerilog Covergroups by Example Article in Mentor's Verification Horizons There were two early articles on this blog that I wrote dealing with merging SystemVerilog covergroups:Merging SystemVerilog Covergroups with ExamplesMerging SystemVerilog Covergroups for EfficiencyThe two posts were rewritten and are now available in Mentor's "Verification Horizons" June 2014 quarterly publication under the title "Merging SystemVerilog Covergroups by Example". I'm happy with how it turned out. Read More Verification Eldon Nelson 6/8/14 Verification Eldon Nelson 6/8/14 Display Monitor and Strobe in SystemVerilog I was adding in the ubiquitous "what is this code doing" debug statements to some SystemVerilog to trace what was happening and finally had a chance to consider deeply the application of: $monitor, $display and $strobe. All three print to the display and all use the same syntax and formatting in their arguments. The difference in the three is when they actually execute. I read a pretty good starting article Verilog subtleties – $monitor vs. $display vs. $strobe that gave me a start to creating my own teaching version of their example.You can check out the code below on github. Read More Verification, Emacs Eldon Nelson 6/1/14 Verification, Emacs Eldon Nelson 6/1/14 Using Squarespace and Embedding Syntax Highlighted Code with Emacs Squarespace has the ability to syntax highlight the following three source types:htmlcssjavascriptin a very workable built in code block in their blogging system. But, if you use another source type like SystemVerilog or Python you will have to figure out something else to get your source code syntax highlighted on Squarespace.In the following post on Answers Squarespace, it mentions a method using the javascript helper Prism that can syntax highlight a lot of languages out of the box. It actually looks really cool. Sadly, SystemVerilog is not in their list of supported languages. Read More Verification Eldon Nelson 5/4/14 Verification Eldon Nelson 5/4/14 Mentor Questa do versus source The standard TCL command "source" is the common way to read in source of one file into the current environment - similar to an `include in Verilog. Mentor Questa runs a TCL interpreter and adds a few custom features to the environment one of which is the command: "do". For many uses the "do" and the "source" command will have identical output. In fact, whatever can be done with "source" can be done with "do" - it is a superset of "source". The "do" command does add at least two useful or at least interesting features. Read More Verification Eldon Nelson 4/6/14 Verification Eldon Nelson 4/6/14 The delay_ps task Solution to Passing Delays In the last post "System Verilog timescale Across Clases Illustrated", I 