              Verification    Eldon Nelson3/22/14
  
  
  
  


  
  Software Deprecate Versus Depreciate
  


  I used to work with a guy who would quite often correct me on my use of the word deprecate in the context of software.  I would say "I think that software function is deprecated and should not be used anymore."  (Deprecated pronounced dep-re-kate-ed).  He would respond "no, that software function is depreciated". (Depreciated pronounced de-pre-she-ate-ed). We have the two words:deprecateddepreciatedJust one letter different, but the pronunciation is quite a bit different.  I kept saying the word my way and he would say it his.  His reasoning was that deprecate was a synonym for defecate; which is incorrect.What is the correct word to use in the context of software?  Read the rest of the post for the full answer.
  


Read More

            
  


                
              Verification    Eldon Nelson3/16/14
  
  
  
  
              Verification    Eldon Nelson3/16/14
  
  
  
  


  
  Using TCL cmdline library with Interactive Tools
  


  Most tools in EDA (Electronic Design Automation) have an interactive TCL (Tool Command Language) interface.  Some examples are Mentor Questa, Cadence Incisive, Cadence RTL Compiler, and many of the IBM EDA tools.  A common problem is that the TCL language does not come shipped with a command line parser.  TCL assumes you will just use positional arguments or you will come up with your own parsing package.
  


