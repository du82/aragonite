  Emacs and Making Everything Larger
  


  If you are using a graphical version of Emacs, you sometimes need to make things bigger or smaller depending on what you want to see or show to someone at your desk.There are two ways to to this.
  


Read More

            
  


                
              Verification,           Emacs    Eldon Nelson6/1/14
  
  
  
  
              Verification,           Emacs    Eldon Nelson6/1/14
  
  
  
  


  
  Using Squarespace and Embedding Syntax Highlighted Code with Emacs
  


  Squarespace has the ability to syntax highlight the following three source types:htmlcssjavascriptin a very workable built in code block in their blogging system.  But, if you use another source type like SystemVerilog or Python you will have to figure out something else to get your source code syntax highlighted on Squarespace.In the following post on Answers Squarespace, it mentions a method using the javascript helper Prism that can syntax highlight a lot of languages out of the box.  It actually looks really cool.  Sadly, SystemVerilog is not in their list of supported languages.
  


