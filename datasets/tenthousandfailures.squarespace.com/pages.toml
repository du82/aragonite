  The Observer Pattern in SystemVerilog
  


  The next Design pattern I ported to SystemVerilog is the Observer Pattern below.  See the Strategy Pattern in SystemVerilog for more background on this mini project.Observer Pattern in SystemVerilog on GitHub
  


Read More

            
  


                
              Verification    Eldon Nelson8/31/14
  
  
  
  
              Verification    Eldon Nelson8/31/14
  
  
  
  


  
  Verilog Flip-Flop Macros by Chris Drake
  


  Chris Drake's blog Fuzzy Logic had a particular post titled Verilog Flip-Flop Macros which I thought was really good. It deals with creating an abstraction of a flip-flop in SystemVerilog.  I had to try out his example code myself to verify the performance differences he experienced.
  


Read More

            
  


                
              Verification    Eldon Nelson7/13/14
  
  
  
  
              Verification    Eldon Nelson7/13/14
  
  
  
  


  
  The Strategy Pattern in SystemVerilog
  


  I had watched a wonderful video series of Object Oriented Design Patterns on Lynda.com called "Foundations of Programming: Design Patterns" by Elisabeth Robinson and Eric Freeman.  In their series, they go through some of the ideas in "Design Patterns" and have very concise code examples that illustrate specific Design Patterns.
  


Read More

            
  


                
              Verification    Eldon Nelson6/15/14
  
  
  
  
              Verification    Eldon Nelson6/15/14
  
  
  
  


  
  Merging SystemVerilog Covergroups by Example Article in Mentor's Verification Horizons
  


  There were two early articles on this blog that I wrote dealing with merging SystemVerilog covergroups:Merging SystemVerilog Covergroups with ExamplesMerging SystemVerilog Covergroups for EfficiencyThe two posts were rewritten and are now available in Mentor's "Verification Horizons" June 2014 quarterly publication under the title "Merging SystemVerilog Covergroups by Example".  I'm happy with how it turned out.
  


Read More

            
  


                
              Verification    Eldon Nelson6/8/14
  
  
  
  
              Verification    Eldon Nelson6/8/14
  
  
  
  


  
  Display Monitor and Strobe in SystemVerilog
  


  I was adding in the ubiquitous "what is this code doing" debug statements to some SystemVerilog to trace what was happening and finally had a chance to consider deeply the application of: $monitor, $display and $strobe.  All three print to the display and all use the same syntax and formatting in their arguments.  The difference in the three is when they actually execute.  I read a pretty good starting article Verilog subtleties – $monitor vs. $display vs. $strobe that gave me a start to creating my own teaching version of their example.You can check out the code below on github.
  


Read More

            
  


                
              Verification    Eldon Nelson5/4/14
  
  
  
  
              Verification    Eldon Nelson5/4/14
  
  
  
  


  
  Mentor Questa do versus source
  


  The standard TCL command "source" is the common way to read in source of one file into the current environment - similar to an `include in Verilog.  Mentor Questa runs a TCL interpreter and adds a few custom features to the environment one of which is the command: "do".  For many uses the "do" and the "source" command will have identical output.  In fact, whatever can be done with "source" can be done with "do" - it is a superset of "source".  The "do" command does add at least two useful or at least interesting features.
  


Read More

            
  


                
              Verification    Eldon Nelson3/16/14
  
  
  
  
              Verification    Eldon Nelson3/16/14
  
  
  
  


  
  Using TCL cmdline library with Interactive Tools
  


  Most tools in EDA (Electronic Design Automation) have an interactive TCL (Tool Command Language) interface.  Some examples are Mentor Questa, Cadence Incisive, Cadence RTL Compiler, and many of the IBM EDA tools.  A common problem is that the TCL language does not come shipped with a command line parser.  TCL assumes you will just use positional arguments or you will come up with your own parsing package.
  


Read More

            
  


                
              Verification    Eldon Nelson3/4/14
  
  
  
  
              Verification    Eldon Nelson3/4/14
  
  
  
  


  
  SystemVerilog Package Globals instead of `include
  


  I had used other programming languages before working with System Verilog.  So when I started looking at System Verilog code for the first time, I was perplexed why there were all of these `includes all over - even in purely object oriented verification logic.There is a problem and proposed solution I would like to share.  Using packages instead of `include to store constants.  I wrote the example both ways: package and `include; so you can see something that I see typically done with `include done with packages.  
  


Read More

            
  


                
              Verification    Eldon Nelson2/2/14
  
  
  
  
              Verification    Eldon Nelson2/2/14
  
  
  
  


  
  Accessing Mentor FlexLM License Server via SSH Port Forwarding
  


  Your FlexLM License server might be behind a firewall that makes it unaccessible even if you are VPNed into that network.  The FlexLM server could be only listening to machines on a certain subnet of addresses or have some other reason to communicate with only certain machines.  That firewall makes things like my post Installing Mentor Questa on Ubuntu much more difficult to complete if you wanted to run something like Mentor Questa on your remote machine.This is my recipe that will allow you to do the necessary ssh forwarding to be able to communicate with a FlexLM server as if you were at a machine on its native network.
  


Read More

            
  


                
              Verification,           OSX    Eldon Nelson2/1/14
  
  
  
  
              Verification,           OSX    Eldon Nelson2/1/14
  
  
  
  


  
  Installing Mentor Questa on Ubuntu
  


  I use Mentor Questa a lot and when I am at work the visual lag of interacting with the GUI is almost imperceptible.  But, when I am working remotely that visual lag is, of course, more noticeable. One possible solution that reduces the lag considerably compared to VNC, NX, or Windows Remote Desktop is to run Questa natively on your local computer.The first problem you will run into is that Questa is only officially supported on Redhat and SUSE Linux.  (It is also supported on Microsoft Windows too, but who really does serious engineering work on Windows?)  So, if Questa is only supported on two commercial Linux variants are we stuck on installing Redhat at home from the corporate install?  Fortunately, no.You can install Mentor Questa on Ubuntu Linux.  I'll go through installing it on Ubuntu 12.04.3 64bit.
  


Read More

            
  


                
              Verification    Eldon Nelson1/12/14
  
  
  
  
              Verification    Eldon Nelson1/12/14
  
  
  
  


  
  Merging SystemVerilog Covergroups for Efficiency
  


  In the previous blog post, we were merging covergroups and, in all cases, keeping track of the covergroup instances "INST" (the Mentor Questa notation) data as well.  This is perfectly fine if you have only a few repeated instances. But, what if you have thousands of instances in your design - the covergroup data can get bloated.
  


Read More

            
  


                
              Verification    Eldon Nelson12/29/13
  
  
  
  
              Verification    Eldon Nelson12/29/13
  
  
  
  


  
  Merging SystemVerilog Covergroups with Examples
  


  If you do have multiple instances of a covergroup and want to merge the results, there are implementation details that can make a big difference on what you will see in the end.
  


