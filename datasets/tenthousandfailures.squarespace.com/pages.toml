of X Y Z is: 3 2 1 bdut dut1 value of X Y Z is: 3 2 4 dut dut2 value of X Y Z is: 100 2 1 bdut dut2 value of X Y Z is: 100 2 4 SystemVerilog Eldon Nelson Eldon Nelson is a Verification Engineer working at Intel. He received his B.S. and M.S. degree in electrical engineering from the University of Minnesota and is a licensed Professional Engineer (P.E.). Eldon's technical blog tenthousandfailures.com features posts on verification and GNU Emacs - two of his favorite topics. Before working at Intel he has worked for: Micron Technology, IBM, Unisys, and the National Science Foundation. http://tenthousandfailures.com'''
