              Matlab 2008b on OSX Mavericks and Beyond                                OSX              
                        Jan 6                Written By Eldon Nelson                  
            


  Matlab 2008b has some issues when being installed on Apple OSX Mavericks.  This post will guide you to the most simple way to get it running.X11 ErrorThe first error you will encounter is after installation has finished and you try to do any of the commands from the dialog from Matlab below, you will get the error:X11 does not appear to be installedThis can be improved, but not fixed, by installing XQuartz.  This is described by Mathworks in their article here on X11 and XQuartz.

































































 

  
  
  
                    
                                                                                                                                
                            
                        X11 Error with Matlab 2008b on Mavericks                  

  






  
Java IncompatibilitiesYou now will be able launch Matlab with a command line like the below within a XQuartz shell.> /Applications/MATLAB_R2008bSV.app/bin/matlab

The next error you will run into has to do with Java incompatibility problems and the error:> Cant load library: /Applications/MATLAB_R2008bSV.app//bin/maci64/libactivation.jnilib

































































 

  
  
  
                    
                                                                                                                                
                            
                        Java Incompatibilities on Mavericks                  

  






  This issue is described here and has some possible fixes including installing different versions of Java and messing with you OSX internals.  I wasn't ready to dive into that, but luckily found a much simpler way to resolve this problem.It seems that this Java problem is only a problem with the code dealing with registration.  The application is actually all ready to go.  It just needs a license.Use the Mathworks Website to Generate license.lic FileYou can login to the Mathworks website and see all of your existing purchased licenses and download a license.lic file.  You can even likely register a new license through the website and get the file you need.  The process just requires you to put in the MAC address of your computer - the process is described here on how to do it on Mavericks, but the short answer is to do the following command.> ifconfig en1 | grep etherWhich will give you the MAC address of the correct ethernet device.  You put that into Mathworks website to give you license.lic file.Then you can open up the Matlab Package Contents for Matlab from Finder and put the license.lic file in the right spot./Applications/MATLAB_R2008bSV.app/licenses/license.lic

































































 

  
  
  
                    
                                                                                                                                
                            
                        Show Package Contents in Finder                  

  






  After putting the license file in the right spot and launching Matlab from XQuartz you have a very old copy of Matlab working on Mavericks!
























      
                              
    
  
  Eldon Nelson

Eldon Nelson is a Verification Engineer working at Intel.  He received his B.S. and M.S. degree in electrical engineering from the University of Minnesota and is a licensed Professional Engineer (P.E.).  Eldon's technical blog tenthousandfailures.com features posts on verification and GNU Emacs - two of his favorite topics.  Before working at Intel he has worked for: Micron Technology, IBM, Unisys, and the National Science Foundation.
http://tenthousandfailures.com
                  
                                                
  



  
  
  


  


      
                        
