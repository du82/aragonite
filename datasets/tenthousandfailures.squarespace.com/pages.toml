  Installing Mentor Questa on Ubuntu
  


  I use Mentor Questa a lot and when I am at work the visual lag of interacting with the GUI is almost imperceptible.  But, when I am working remotely that visual lag is, of course, more noticeable. One possible solution that reduces the lag considerably compared to VNC, NX, or Windows Remote Desktop is to run Questa natively on your local computer.The first problem you will run into is that Questa is only officially supported on Redhat and SUSE Linux.  (It is also supported on Microsoft Windows too, but who really does serious engineering work on Windows?)  So, if Questa is only supported on two commercial Linux variants are we stuck on installing Redhat at home from the corporate install?  Fortunately, no.You can install Mentor Questa on Ubuntu Linux.  I'll go through installing it on Ubuntu 12.04.3 64bit.
  


