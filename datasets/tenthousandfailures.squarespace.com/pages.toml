full_description = "Emacs Eldon Nelson 7/4/14 Emacs Eldon Nelson 7/4/14 Emacs and Making Everything Larger If you are using a graphical version of Emacs, you sometimes need to make things bigger or smaller depending on what you want to see or show to someone at your desk.There are two ways to to this. Read More Verification, Emacs Eldon Nelson 6/1/14 Verification, Emacs Eldon Nelson 6/1/14 Using Squarespace and Embedding Syntax Highlighted Code with Emacs Squarespace has the ability to syntax highlight the following three source types:htmlcssjavascriptin a very workable built in code block in their blogging system. But, if you use another source type like SystemVerilog or Python you will have to figure out something else to get your source code syntax highlighted on Squarespace.In the following post on Answers Squarespace, it mentions a method using the javascript helper Prism that can syntax highlight a lot of languages out of the box. It actually looks really cool. Sadly, SystemVerilog is not in their list of supported languages. Read More Verification, Emacs Eldon Nelson 1/20/14 Verification, Emacs Eldon Nelson 1/20/14 Using Emacs to Debug Verilog Compiles in Mentor Questa I hadn't used Emacs to compile and parse errors for Mentor Questa before and decided to see what that would be like. Making Emacs understand how the simulator works and spits out errors involves extending Emacs to know how to launch your Verilog simulator and how to interpret the console messages. The built in Emacs compilation mode is not terrible and at least gives a starting point for compiling and debugging standard languages and custom ones. This is how to do it with Mentor Questa. Read More Blog of Eldon Nelson M.S., P.E. on verification, GNU Emacs, and technical topics. Posts Featured Jun 3, 2017 Verification Improving Constrained Random Testing - Second Place Paper at DVCon 2017 Jun 3, 2017 Verification Jun 3, 2017 Verification Mar 7, 2016 Verification Best Paper at Design and Verificat