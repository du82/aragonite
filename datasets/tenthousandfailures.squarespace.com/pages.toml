  Speaking at DVClub Austin September 2023
  


  I’m looking forward to speaking at DVClub this Thursday. If you are in Austin you can register for free below.The topic of my talk will be a paper I presented at DVCon 2021 “Can Formal Outsmart Synthesis: Improving Synthesis Quality of Results through Formal Methods”. If you haven’t been to a DVClub event before, you will enjoy it! There is typically a catered lunch and one or two guest speakers. The talks are of general interest and typically touch verification, but sometimes industry topics.
  


