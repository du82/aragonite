full_description = '''SQLite concurrent writes and "database is locked" errors Published: Sat 01 February 2025 By Victor Skvortsov tags: SQLite databases SQLite claims to be one of the most popular pieces of software in the world, being integrated into every major operating system and browser. It became the ultimate database for client side apps. In recent years, there's also been a growing interest in using SQLite on the backend. If you do this, you better keep in mind a major SQLite limitation: concurrent writes.SQLite handles concurrent writes with a global write lock allowing only one writer at a time. If you have many concurrent write transactions, some will take a long time and some may even fail with the "database is locked" error. What I'd like to do in this post is to better understand how concurrent writes impact SQLite performance, how many are ok, and how we can improve it. read more Holiday readings (New Year 2025): AI accelerators and GPU clouds Published: Fri 10 January 2025 By Victor Skvortsov tags: readings AI accelerators GPU clouds LLMs Just before Christmas, I've stumbled upon Machine Learning Engineering Open Book by Stas Bekman. It's a book I've long been looking for – a collection of insights on operating a large GPU cluster and using it to train and run LLMs: AI accelerators, fast intra-node and inter-node networking, optimized cluster storage, large-scale LLM training and inference, with lots of first-hand experience on these topics. I want to share my key takes from the book as well as other excellent resources I've discovered in the process. read more This website is now public on GitHub Published: Wed 08 January 2025 By Victor Skvortsov tags: tenthousandmeters.com Here it is: github.com/r4victor/tenthousandmeters. It started as a private repo but now I'm making it public so that everyone can make PRs and issues and contribute.I'm also making updates to the blog that I haven't actively maintained since 2022 when I finished writing the Python behind the scenes series. My resolution for 2025 is to start writing again. read more'''
