["https://tenthousandmeters.com/blog/python-behind-the-scenes-3-stepping-through-the-cpython-source-code"]
title = "Python behind the scenes #3: stepping through the CPython source code"
description = "In the first and the second parts of this series we explored the ideas behind the execution and the compilation of a Python program. We'll..."
full_description = '''Python behind the scenes #3: stepping through the CPython source code Published: Sun 11 October 2020 By Victor Skvortsov tags: Python behind the scenes Python CPython In the first and the second parts of this series we explored the ideas behind the execution and the compilation of a Python program. We'll continue to focus on ideas in the next parts but this time we'll make an exception and look at the actual code that brings those ideas to life. Plan for today The CPython codebase is around 350,000 lines of C code (excluding header files) and almost 600,000 lines of Python code. Undoubtedly, it would be a daunting task to comprehend all of that at once. Today we'll confine our study to that part of the source code that executes every time we run python. We'll start with the main() function of the python executable and step through the source code until we reach the evaluation loop, a place where Python bytecode gets executed. Our goal is not to understand every piece of code we'll encounter but to highlight the most interesting parts, study them, and, eventually, get an approximate idea of what happens at the very start of the execution of a Python program. There are two more notices I should make. First, we won't step into every function. We'll make only a high-level overview of some parts and dive deep into others. Nevertheless, I promise to present functions in the order of execution. Second, with the exception of a few struct definitions, I'll leave the code as is. The only thing I'll allow myself is to add some comments and to rephrase existing ones. Throughout this post, all multi-line /**/ comments are original, and all single-line // comments are mine. With that said, let's begin our journey through the CPython source code. Getting CPython Before we can explore the source code, we need to get it. Let's clone the CPython repository: $ git clone https://github.com/python/cpython/ && cd cpython The current master branch is the future CPython 3.10. We're interested in the latest stable release, which is CPython 3.9, so let's switch to the 3.9 branch: $ git checkout 3.9 Inside the root directory we find the following contents: $ ls -p CODE_OF_CONDUCT.md Objects/ config.sub Doc/ PC/ configure Grammar/ PCbuild/ configure.ac Include/ Parser/ install-sh LICENSE Programs/ m4/ Lib/ Python/ netlify.toml Mac/ README.rst pyconfig.h.in Makefile.pre.in Tools/ setup.py Misc/ aclocal.m4 Modules/ config.guess Some of the listed subdirectories are of particular importance to us in the course of this series: Grammar/ contains the grammar files we discussed last time. Include/ contains header files. They are used both by CPython and by the users of the Python/C API. Lib/ contains standard library modules written in Python. While some modules, such as argparse and wave, are written in Python entirely, many wrap C code. For example, the Python io module wraps the C _io module. Modules/ contains standard library modules written in C. While some modules, such as itertools, are intended to be imported directly, others are wrapped by Python modules. Objects/ contains the implementations of built-in types. If you want to understand how int or list are implemented, this is the ultimate place to go to. Parser/ contains the old parser, the old parser generator, the new parser and the tokenizer. Programs/ contains source files that are compiled to executables. Python/ contains source files for the interpreter itself. This includes the compiler, the evaluation loop, the builtins module and many other interesting things. Tools/ contains tools useful for building and managing CPython. For example, the new parser generator lives here. If you don't see a directory for tests, and your heart starts beating faster, relax. It's Lib/test/. Tests can be useful not only for CPython development but also for getting an understanding of how CPython works. For example, to understand what optimizations the peephole optimizer is expected to do, you can look at the tests in Lib/test/test_peepholer.py. And to understand what some piece of code of the peephole optimizer does, you can delete that piece of code, recompile CPython, run $ ./python.exe -m test test_peepholer and see which tests fail. Ideally, all we need to do to compile CPython is to run ./configure and make: $ ./configure $ make -j -s make will produce an executable named python, but don't be surprised to see python.exe on macOS. The .exe extension is used to distinguish the executable from the Python/ directory on the case-insensitive filesystem. Check out the Python Developer's Guide for more information on compiling. At this point, we can proudly say that we've built our own copy of CPython: $ ./python.exe Python 3.9.0+ (heads/3.9-dirty:20bdeedfb4, Oct 10 2020, 16:55:24) [Clang 10.0.0 (clang-1000.10.44.4)] on darwin Type "help", "copyright", "credits" or "license" for more information. >>> 2 ** 16 65536 Let's see what happens when we run it. main() The execution of CPython, like execution of any other C program, starts with the main() function in Programs/python.c: /* Minimal main program -- everything is loaded from the library */ #include "Python.h" #ifdef MS_WINDOWS int wmain(int argc, wchar_t **argv) { return Py_Main(argc, argv); } #else int main(int argc, char **argv) { return Py_BytesMain(argc, argv); } #endif There isn't much going on there. The only thing worth mentioning is that on Windows CPython uses wmain() instead of main() as an entrypoint to receive argv as UTF-16 encoded strings. The affect of this is that on other platforms CPython performs an extra step of converting a char string to a wchar_t string. The encoding of a char string depends on the locale settings, and the encoding of a wchar_t string depends on the size of wchar_t. For example, if sizeof(wchar_t) == 4, the UCS-4 encoding is used. PEP 383 has more to say on this. We find Py_Main() and Py_BytesMain() in Modules/main.c. What they essentially do is call pymain_main() with slightly different arguments: int Py_Main(int argc, wchar_t **argv) { _PyArgv args = { .argc = argc, .use_bytes_argv = 0, .bytes_argv = NULL, .wchar_argv = argv}; return pymain_main(&args); } int Py_BytesMain(int argc, char **argv) { _PyArgv args = { .argc = argc, .use_bytes_argv = 1, .bytes_argv = argv, .wchar_argv = NULL}; return pymain_main(&args); } pymain_main() doesn't seem to do much either: static int pymain_main(_PyArgv *args) { PyStatus status = pymain_init(args); if (_PyStatus_IS_EXIT(status)) { pymain_free(); return status.exitcode; } if (_PyStatus_EXCEPTION(status)) { pymain_exit_error(status); } return Py_RunMain(); } Nevertheless, we should stop on it for a little bit longer. Last time we learned that before a Python program starts executing, CPython does a lot of things to compile it. It turns out that CPython does a lot of things even before it starts compiling a program. These things constitute the initialization of CPython. We mentioned the initialization in part 1 when we said that CPython works in three stages: initialization compilation; and interpretation. What pymain_main() does is call pymain_init() to perform the initialization and then call Py_RunMain() to proceed with the next stages. The initialization stage What does CPython do during the initialization? Let's ponder on this for a moment. At the very least it has to: find a common language with the OS to handle properly the encodings of arguments, environment variables, standard streams and the file system parse the command line arguments and read the environment variables to determine the options to run with initialize the runtime state, the main interpreter state and the main thread state initialize built-in types and the builtins module initialize the sys module set up the import system create the __main__ module. Starting with CPython 3.8, all of that done in three distinct phases: preinitialization core initialization; and main initialization. The phases gradually introduce new capabilities. The preinitialization phase initializes the runtime state, sets up the default memory allocator and performs very basic configuration. There is no sign of Python yet. The core initialization phase initializes the main interpreter state and the main thread state, built-in types and exceptions, the builtins module, the sys module and the import system. At this point, you can use the "core" of Python. However, some things are not available yet. For example, the sys module is only partially initialized, and only the import of built-in and frozen modules is supported. After the main initialization phase, CPython is fully initialized and ready to compile and execute a Python program. What's the benefit of having distinct initialization phases? In a nutshell, it allows us to tune CPython more easily. For example, one may set a custom memory allocator in the preinitialized state or override the path configuration in the core_initialized state. Such capabilities are important to the users of the Python/C API who extend and embed Python. PEP 432 and PEP 587 explain in greater detail why having multi-phase initialization is a good idea. Let's go back to the source code. The pymain_init() function mostly deals with the preinitialization and calls Py_InitializeFromConfig() in the end to perform the core and the main phases of the initialization: static PyStatus pymain_init(const _PyArgv *args) { PyStatus status; // Initialize the runtime state status = _PyRuntime_Initialize(); if (_PyStatus_EXCEPTION(status)) { return status; } // Initialize default preconfig PyPreConfig preconfig; PyPreConfig_InitPythonConfig(&preconfig); // Perfrom preinitialization status = _Py_PreInitializeFromPyArgv(&preconfig, args); if (_PyStatus_EXCEPTION(status)) { return status; } // Preinitialized. Prepare config for the next initialization phases // Initialize default config PyConfig config; PyConfig_InitPythonConfig(&config); // Store the command line arguments in `config->argv` if (args->use_bytes_argv) { status = PyConfig_SetBytesArgv(&config, args->argc, args->bytes_argv); } else { status = PyConfig_SetArgv(&config, args->argc, args->wchar_argv); } if (_PyStatus_EXCEPTION(status)) { goto done; } // Perform core and main initialization status = Py_InitializeFromConfig(&config); if (_PyStatus_EXCEPTION(status)) { goto done; } status = _PyStatus_OK(); done: PyConfig_Clear(&config); return status; } _PyRuntime_Initialize() initializes the runtime state. The runtime state is stored in the global variable called _PyRuntime of type _PyRuntimeState that is defined as follows: /* Full Python runtime state */ typedef struct pyruntimestate { /* Is running Py_PreInitialize()? */ int preinitializing; /* Is Python preinitialized? Set to 1 by Py_PreInitialize() */ int preinitialized; /* Is Python core initialized? Set to 1 by _Py_InitializeCore() */ int core_initialized; /* Is Python fully initialized? Set to 1 by Py_Initialize() */ int initialized; /* Set by Py_FinalizeEx(). Only reset to NULL if Py_Initialize() is called again. */ _Py_atomic_address _finalizing; struct pyinterpreters { PyThread_type_lock mutex; PyInterpreterState *head; PyInterpreterState *main; int64_t next_id; } interpreters; unsigned long main_thread; struct _ceval_runtime_state ceval; struct _gilstate_runtime_state gilstate; PyPreConfig preconfig; // ... less interesting stuff for now } _PyRuntimeState; The last field preconfig of _PyRuntimeState holds the configuration that is used to preinitialize CPython. It's also used by the next phase to complete the configuration. Here's the extensively commented definition of PyPreConfig: typedef struct { int _config_init; /* _PyConfigInitEnum value */ /* Parse Py_PreInitializeFromBytesArgs() arguments? See PyConfig.parse_argv */ int parse_argv; /* If greater than 0, enable isolated mode: sys.path contains neither the script's directory nor the user's site-packages directory. Set to 1 by the -I command line option. If set to -1 (default), inherit Py_IsolatedFlag value. */ int isolated; /* If greater than 0: use environment variables. Set to 0 by -E command line option. If set to -1 (default), it is set to !Py_IgnoreEnvironmentFlag. */ int use_environment; /* Set the LC_CTYPE locale to the user preferred locale? If equals to 0, set coerce_c_locale and coerce_c_locale_warn to 0. */ int configure_locale; /* Coerce the LC_CTYPE locale if it's equal to "C"? (PEP 538) Set to 0 by PYTHONCOERCECLOCALE=0. Set to 1 by PYTHONCOERCECLOCALE=1. Set to 2 if the user preferred LC_CTYPE locale is "C". If it is equal to 1, LC_CTYPE locale is read to decide if it should be coerced or not (ex: PYTHONCOERCECLOCALE=1). Internally, it is set to 2 if the LC_CTYPE locale must be coerced. Disable by default (set to 0). Set it to -1 to let Python decide if it should be enabled or not. */ int coerce_c_locale; /* Emit a warning if the LC_CTYPE locale is coerced? Set to 1 by PYTHONCOERCECLOCALE=warn. Disable by default (set to 0). Set it to -1 to let Python decide if it should be enabled or not. */ int coerce_c_locale_warn; #ifdef MS_WINDOWS /* If greater than 1, use the "mbcs" encoding instead of the UTF-8 encoding for the filesystem encoding. Set to 1 if the PYTHONLEGACYWINDOWSFSENCODING environment variable is set to a non-empty string. If set to -1 (default), inherit Py_LegacyWindowsFSEncodingFlag value. See PEP 529 for more details. */ int legacy_windows_fs_encoding; #endif /* Enable UTF-8 mode? (PEP 540) Disabled by default (equals to 0). Set to 1 by "-X utf8" and "-X utf8=1" command line options. Set to 1 by PYTHONUTF8=1 environment variable. Set to 0 by "-X utf8=0" and PYTHONUTF8=0. If equals to -1, it is set to 1 if the LC_CTYPE locale is "C" or "POSIX", otherwise it is set to 0. Inherit Py_UTF8Mode value value. */ int utf8_mode; /* If non-zero, enable the Python Development Mode. Set to 1 by the -X dev command line option. Set by the PYTHONDEVMODE environment variable. */ int dev_mode; /* Memory allocator: PYTHONMALLOC env var. See PyMemAllocatorName for valid values. */ int allocator; } PyPreConfig; After the call to _PyRuntime_Initialize(), the _PyRuntime global variable is initialized to the defaults. Next, PyPreConfig_InitPythonConfig() initializes new default preconfig, and then _Py_PreInitializeFromPyArgv() performs the actual preinitialization. What's the reason to initialize another preconfig if there is already one in _PyRuntime? Remember that many functions that CPython calls are also exposed via the Python/C API. So CPython just uses this API in the way it's designed to be used. Another consequence of this is that when you step through the CPython source code as we do today, you often encounter functions that seem to do more than you expect. For example, _PyRuntime_Initialize() is called several times during the initialization process. Of course, it does nothing on the subsequent calls. _Py_PreInitializeFromPyArgv() reads command line arguments, environment variables and global configuration variables and, based'''
