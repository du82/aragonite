description = "Mark functions as async. Call them with await. All of a sudden, your program becomes asynchronous – it can do useful things while it waits for..."
full_description = '''Python behind the scenes #12: how async/await works in Python Published: Tue 24 August 2021 By Victor Skvortsov tags: Python behind the scenes Python CPython Mark functions as async. Call them with await. All of a sudden, your program becomes asynchronous – it can do useful things while it waits for other things, such as I/O operations, to complete. Code written in the async/await style looks like regular synchronous code but works very differently. To understand how it works, one should be familiar with many non-trivial concepts including concurrency, parallelism, event loops, I/O multiplexing, asynchrony, cooperative multitasking and coroutines. Python's implementation of async/await adds even more concepts to this list: generators, generator-based coroutines, native coroutines, yield and yield from. Because of this complexity, many Python programmers that use async/await do not realize how it actually works. I believe that it should not be the case. The async/await pattern can be explained in a simple manner if you start from the ground up. And that's what we're going to do today. Note: In this post I'm referring to CPython 3.9. Some implementation details will certainly change as CPython evolves. I'll try to keep track of important changes and add update notes. It's all about concurrency Computers execute programs sequentially – one instruction after another. But a typical program performs multiple tasks, and it doesn't always make sense to wait for some task to complete before starting the next one. For example, a chess program that waits for a player to make a move should be able to update the clock in the meantime. Such an ability of a program to deal with multiple things simultaneously is what we call concurrency. Concurrency doesn't mean that multiple tasks must run at the same physical time. They can run in an interleaved manner: a task runs for some time, then suspends and lets other tasks run, hoping it will get more time in the future. By this mechanism, an OS can run thousands of processes on a machine that has only a few cores. If multiple tasks do run at the same physical time, as in the case of a multi-core machine or a cluster, then we have parallelism, a special case of concurrency [1]. It's crucial to realize that you can write concurrent programs without any special support from the language. Suppose you write a program that performs two tasks, each task being represented by a separate function: def do_task1(): # ... def do_task2(): # ... def main(): do_task1() do_task2() If the tasks are independent, then you can make the program concurrent by decomposing each function into several functions and call the decomposed functions in an interleaved manner, like so: def do_task1_part1(): # ... def do_task1_part2(): # ... def do_task2_part1(): # ... def do_task2_part2(): # ... def main(): do_task1_part1() do_task2_part1() do_task1_part2() do_task2_part2() Of course, this is an oversimplified example. The point here is that the language doesn't determine whether you can write concurrent programs or not but may provide features that make concurrent programming more convenient. As we'll learn today, async/await is just such a feature. To see how one goes from concurrency to async/await, we'll write a real-world concurrent program – a TCP echo server that supposed to handle multiple clients simultaneously. We'll start with the simplest, sequential version of the server that is not concurrent. Then we'll make it concurrent using OS threads. After that, we'll see how we can write a concurrent version that runs in a single thread using I/O multiplexing and an event loop. From this point onwards, we'll develop the single-threaded approach by introducing generators, coroutines and, finally, async/await. A sequential server Writing a TCP echo server that handles only one client at a time is straightforward. The server listens for incoming connections on some port, and when a client connects, the server talks to the client until the connection is closed. Then it continues to listen for new connections. This logic can be implemented using basic socket programming: # echo_01_seq.py import socket def run_server(host='127.0.0.1', port=55555): sock = socket.socket() sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) sock.bind((host, port)) sock.listen() while True: client_sock, addr = sock.accept() print('Connection from', addr) handle_client(client_sock) def handle_client(sock): while True: received_data = sock.recv(4096) if not received_data: break sock.sendall(received_data) print('Client disconnected:', sock.getpeername()) sock.close() if __name__ == '__main__': run_server() Take time to study this code. We'll be using it as a framework for subsequent, concurrent versions of the server. If you need a reminder on sockets, check out Beej's Guide to Network Programming and the docs on the socket module. What we do here in a nutshell is: create a new TCP/IP socket with socket.socket() bind the socket to an address and a port with sock.bind() mark the socket as a "listening" socket with sock.listen() accept new connections with sock.accept() read data from the client with sock.recv() and send the data back to the client with sock.sendall(). This version of server is not concurrent by design. When multiple clients try to connect to the server at about the same time, one client connects and occupies the server, while other clients wait until the current client disconnects. I wrote a simple simulation program to demonstrate this: $ python clients.py [00.097034] Client 0 tries to connect. [00.097670] Client 1 tries to connect. [00.098334] Client 2 tries to connect. [00.099675] Client 0 connects. [00.600378] Client 0 sends "Hello". [00.601602] Client 0 receives "Hello". [01.104952] Client 0 sends "world!". [01.105166] Client 0 receives "world!". [01.105276] Client 0 disconnects. [01.106323] Client 1 connects. [01.611248] Client 1 sends "Hello". [01.611609] Client 1 receives "Hello". [02.112496] Client 1 sends "world!". [02.112691] Client 1 receives "world!". [02.112772] Client 1 disconnects. [02.113569] Client 2 connects. [02.617032] Client 2 sends "Hello". [02.617288] Client 2 receives "Hello". [03.120725] Client 2 sends "world!". [03.120944] Client 2 receives "world!". [03.121044] Client 2 disconnects. The clients connect, send the same two messages and disconnect. It takes half a second for a client to type a message, and thus it takes about three seconds for the server to serve all the clients. A single slow client, however, could make the server unavailable for an arbitrary long time. We should really make the server concurrent! OS threads The easiest way to make the server concurrent is by using OS threads. We just run the handle_client() function in a separate thread instead of calling it in the main thread and leave the rest of the code unchanged: # echo_02_threads.py import socket import threading def run_server(host='127.0.0.1', port=55555): sock = socket.socket() sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) sock.bind((host, port)) sock.listen() while True: client_sock, addr = sock.accept() print('Connection from', addr) thread = threading.Thread(target=handle_client, args=[client_sock]) thread.start() def handle_client(sock): while True: received_data = sock.recv(4096) if not received_data: break sock.sendall(received_data) print('Client disconnected:', sock.getpeername()) sock.close() if __name__ == '__main__': run_server() Now multiple clients can talk to the server simultaneously: $ python clients.py [00.095948] Client 0 tries to connect. [00.096472] Client 1 tries to connect. [00.097019] Client 2 tries to connect. [00.099666] Client 0 connects. [00.099768] Client 1 connects. [00.100916] Client 2 connects. [00.602212] Client 0 sends "Hello". [00.602379] Client 1 sends "Hello". [00.602506] Client 2 sends "Hello". [00.602702] Client 0 receives "Hello". [00.602779] Client 1 receives "Hello". [00.602896] Client 2 receives "Hello". [01.106935] Client 0 sends "world!". [01.107088] Client 1 sends "world!". [01.107188] Client 2 sends "world!". [01.107342] Client 0 receives "world!". [01.107814] Client 0 disconnects. [01.108217] Client 1 receives "world!". [01.108305] Client 1 disconnects. [01.108345] Client 2 receives "world!". [01.108395] Client 2 disconnects. The one-thread-per-client approach is easy to implement, but it doesn't scale well. OS threads are an expensive resource in terms of memory, so you can't have too many of them. For example, the Linux machine that serves this website is capable of running about 8k threads at most, though even fewer threads may be enough to swamp it. With this approach the server not only works poorly under heavy workloads but also becomes an easy target for a DoS attack. Thread pools solve the problem of uncontrolled thread creation. Instead of submitting each task to a separate thread, we submit tasks to a queue and let a group of threads, called a thread pool, take and process the tasks from the queue. We predefine the maximum number of threads in a thread pool, so the server cannot start too many of them. Here's how we can write a thread pool version of the server using the Python standard concurrent.futures module: # echo_03_thread_pool.py import socket from concurrent.futures import ThreadPoolExecutor pool = ThreadPoolExecutor(max_workers=20) def run_server(host='127.0.0.1', port=55555): sock = socket.socket() sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) sock.bind((host, port)) sock.listen() while True: client_sock, addr = sock.accept() print('Connection from', addr) pool.submit(handle_client, client_sock) def handle_client(sock): while True: received_data = sock.recv(4096) if not received_data: break sock.sendall(received_data) print('Client disconnected:', sock.getpeername()) sock.close() if __name__ == '__main__': run_server() The thread pool approach is both simple and practical. Note, however, that you still need to do something to prevent slow clients from occupying the thread pool. You may drop long-living connections, require the clients to maintain some minimum throughput rate, let the threads return the tasks to the queue or combine any of the suggested methods. The conclusion here is that making the server concurrent using OS threads is not as straightforward as it may seem at first, and it's worthwhile to explore other approaches to concurrency. I/O multiplexing and event loops Think about the sequential server again. Such a server always waits for some specific event to happen. When it has no connected clients, it waits for a new client to connect. When it has a connected client, it waits for this client to send some data. To work concurrently, however, the server should instead be able to handle any event that happens next. If the current client doesn't send anything, but a new client tries to connect, the server should accept the new connection. It should maintain multiple active connections and reply to any client that sends data next. But how can the server know what event it should handle next? By default, socket methods such as accept(), recv() and sendall() are all blocking. So if the server decides to call accept(), it will block until a new client connects and won't be not able to call recv() on the client sockets in the meantime. We could solve this problem by setting a timeout on blocking socket operations with sock.settimeout(timeout) or by turning a socket into a completely non-blocking mode with sock.setblocking(False). We could then maintain a set of active sockets and, for each socket, call the corresponding socket method in an infinite loop. So, we would call accept() on the socket that listens for new connections and recv() on the sockets that wait for clients to send data. The problem with the described approach is that it's not clear how to do the polling right. If we make all the sockets non-blocking or set timeouts too short, the server will be making calls all the time and consume a lot of CPU. Conversely, if we set timeouts too long, the server will be slow to reply. The better approach is to ask the OS which sockets are ready for reading and writing. Clearly, the OS has this information. When a new packet arrives on a network interface, the OS gets notified, decodes the packet, determines the socket to which the packet belongs and wakes up the processes that do a blocking read on that socket. But a process doesn't need to read from the socket to get notified. It can use an I/O multiplexing mechanism such as select(), poll() or epoll() to tell the OS that it's interested in reading from or writing to some socket. When the socket becomes ready, the OS will wake up such processes as well. The Python standard selectors module wraps different I/O multiplexing mechanisms available on the system and exposes each of them via the same high-level API called a selector. So it exposes select() as SelectSelector and epoll() as EpollSelector. It also exposes the most efficient mechanism available on the system as DefaultSelector. Let me show you how you're supposed to use the selectors module. You first create a selector object: sel = selectors.DefaultSelector() Then you register a socket that you want to monitor. You pass the socket, the types of events you're interested in (the socket becomes ready for reading or writing) and any auxiliary data to the selector's register() method: sel.register(sock, selectors.EVENT_READ, my_data) Finally, you call the selector's select() method: keys_events = sel.select() This call returns a list of (key, events) tuples. Each tuple describes a ready socket: key is an object that stores the socket (key.fileobj) and the auxiliary data associated with the socket (key.data). events is a bitmask of events ready on the socket (selectors.EVENT_READ or selectors.EVENT_WRITE or both). If there are ready sockets when you call select(), then select() returns immediately. Otherwise, it blocks until some of the registered sockets become ready. The OS will notify select() as it notifies blocking socket methods like recv(). When you no longer need to monitor some socket, you just pass it to the selector's unregister() method. One question remains. What should we do with a ready socket? We certainly had some idea of what do to with it when we registered it, so let's register every socket with a callback that should be called when the socket becomes ready. That's, by the way, what the auxiliary data parameter of the selector's register() method is for. We're now ready to implement a single-threaded concurrent version of the server using I/O multiplexing: # echo_04_io_multiplexing.py import socket import selectors sel = selectors.DefaultSelector() def setup_listening_socket(host='127.0.0.1', port=55555): sock = socket.socket() sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) sock.bind((host, port)) sock.listen() sel.register(sock, selectors.EVENT_READ, accept) def accept(sock): clie'''
