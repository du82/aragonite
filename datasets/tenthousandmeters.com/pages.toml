title = "Python behind the scenes #11: how the Python import system works"
description = "If you ask me to name the most misunderstood aspect of Python, I will answer without a second thought: the Python import system. Just remember how..."
full_description = '''Python behind the scenes #11: how the Python import system works Published: Tue 13 July 2021 By Victor Skvortsov tags: Python behind the scenes Python CPython If you ask me to name the most misunderstood aspect of Python, I will answer without a second thought: the Python import system. Just remember how many times you used relative imports and got something like ImportError: attempted relative import with no known parent package; or tried to figure out how to structure a project so that all the imports work correctly; or hacked sys.path when you couldn't find a better solution. Every Python programmer experienced something like this, and popular StackOverflow questions, such us Importing files from different folder (1822 votes), Relative imports in Python 3 (1064 votes) and Relative imports for the billionth time (993 votes), are a good indicator of that. The Python import system doesn't just seem complicated – it is complicated. So even though the documentation is really good, it doesn't give you the full picture of what's going on. The only way to get such a picture is to study what happens behind the scenes when Python executes an import statement. And that's what we're going to do today. Note: In this post I'm referring to CPython 3.9. Some implementation details will certainly change as CPython evolves. I'll try to keep track of important changes and add update notes. Our plan Before we begin, let me present you a more detailed version of our plan. First, we'll discuss the core concepts of the import system: modules, submodules, packages, from <> import <> statements, relative imports, and so on. Then we'll desugar different import statements and see that they all eventually call the built-in __import__() function. Finally, we'll study how the default implementation of __import__() works. Let's go! Modules and module objects Consider a simple import statement: import m What do you think it does? You may say that it imports a module named m and assigns the module to the variable m. And you'll be right. But what is a module exactly? What gets assigned to the variable? In order to answer these questions, we need to give a bit more precise explanation: the statement import m searches for a module named m, creates a module object for that module, and assigns the module object to the variable. See how we differentiated between a module and a module object. We can now define these terms. A module is anything that Python considers a module and knows how to create a module object for. This includes things like Python files, directories and built-in modules written in C. We'll look at the full list in the next section. The reason why we import any module is because we want to get an access to functions, classes, constants and other names that the module defines. These names must be stored somewhere, and this is what module objects are for. A module object is a Python object that acts as a namespace for the module's names. The names are stored in the module object's dictionary (available as m.__dict__), so we can access them as attributes. If you wonder how module objects are implemented, here's the definition from Objects/moduleobject.c: typedef struct { PyObject ob_base; PyObject *md_dict; struct PyModuleDef *md_def; void *md_state; PyObject *md_weaklist; PyObject *md_name; } PyModuleObject; The md_dict field stores the module's dictionary. Other fields are not really important for our discussion. Python creates module objects implicitly for us. To see that there is nothing magical about this process, let's create a module object ourselves. We usually create Python objects by calling their types, like MyClass() or set(). The type of a module object is PyModule_Type in the C code but it's not available in Python as a built-in. Fortunately, such "unavailable" types can be found in the types standard module: $ python -q >>> from types import ModuleType >>> ModuleType <class 'module'> How does the types module define ModuleType? It just imports the sys module (any module will do) and then calls type() on the module object returned. We can do it as well: >>> import sys >>> ModuleType = type(sys) >>> ModuleType <class 'module'> No matter how we get ModuleType, once we get it, we can easily create a module object: >>> m = ModuleType('m') >>> m <module 'm'> A newly created module object is not very interesting but has some special attributes preinitialized: >>> m.__dict__ {'__name__': 'm', '__doc__': None, '__package__': None, '__loader__': None, '__spec__': None} Most of these special attributes are mainly used by the import system itself, but some are used in the application code as well. The __name__ attribute, for example, is often used to get the name of the current module: >>> __name__ '__main__' Notice that __name__ is available as a global variable. This observation may seem evident, but it's crucial. It comes from the fact that the dictionary of global variables is set to the dictionary of the current module: >>> import sys >>> current_module = sys.modules[__name__] # sys.modules stores imported modules >>> current_module.__dict__ is globals() True The current module acts as a namespace for the execution of Python code. When Python imports a Python file, it creates a new module object and then executes the contents of the file using the dictionary of the module object as the dictionary of global variables. Similarly, when Python executes a Python file directly, it first creates a special module called __main__ and then uses its dictionary as the dictionary of global variables. Thus, global variables are always attributes of some module, and this module is considered to be the current module from the perspective of the executing code. Different kinds of modules By default, Python recognizes the following things as modules: Built-in modules. Frozen modules. C extensions. Python source code files (.py files). Python bytecode files (.pyc files). Directories. Built-in modules are C modules compiled into the python executable. Since they are part of the executable, they are always available. This is their key feature. The sys.builtin_module_names tuple stores their names: $ python -q >>> import sys >>> sys.builtin_module_names ('_abc', '_ast', '_codecs', '_collections', '_functools', '_imp', '_io', '_locale', '_operator', '_peg_parser', '_signal', '_sre', '_stat', '_string', '_symtable', '_thread', '_tracemalloc', '_warnings', '_weakref', 'atexit', 'builtins', 'errno', 'faulthandler', 'gc', 'itertools', 'marshal', 'posix', 'pwd', 'sys', 'time', 'xxsubtype') Frozen modules are too a part of the python executable, but they are written in Python. Python code is compiled to a code object and then the marshalled code object is incorporated into the executable. The examples of frozen modules are _frozen_importlib and _frozen_importlib_external . Python freezes them because they implement the core of the import system and, thus, cannot be imported like other Python files. C extensions are a bit like built-in modules and a bit like Python files. On one hand, they are written in C or C++ and interact with Python via the Python/C API. On the other hand, they are not a part of the executable but loaded dynamically during the import. Some standard modules including array, math and select are C extensions. Many others including asyncio, heapq and json are written in Python but call C extensions under the hood. Technically, C extensions are shared libraries that expose a so called initialization function. They are usually named like modname.so, but the file extension may be different depending on the platform. On my macOS, for example, any of these extensions will work: .cpython-39-darwin.so, .abi3.so, .so. And on Windows, you'll see .dll and its variations. Python bytecode files are typically live in a __pycache__ directory alongside regular Python files. They are the result of compiling Python code to bytecode. More specifically, a .pyc file contains some metadata followed by a marshalled code object of a module. Its purpose is to reduce module's loading time by skipping the compilation stage. When Python imports a .py file, it first searches for a corresponding .pyc file in the __pycache__ directory and executes it. If the .pyc file does not exist, Python compiles the code and creates the file. However, we wouldn't call .pyc files modules if we couldn't execute and import them directly. Surprisingly, we can: $ ls module.pyc $ python module.pyc I'm a .pyc file $ python -c "import module" I'm a .pyc file To learn more about .pyc files, check out PEP 3147 -- PYC Repository Directories and PEP 552 -- Deterministic pycs. As we'll later see, we can customize the import system to support even more kinds of modules. So anything can be called a module as long as Python can create a module object for it given a module name. Submodules and packages If module names were limited to simple identifiers like mymodule or utils, then they all must have been unique, and we would have to think very hard every time we give a new file a name. For this reason, Python allows modules to have submodules and module names to contain dots. When Python executes this statements: import a.b it first imports the module a and then the submodule a.b. It adds the submodule to the module's dictionary and assigns the module to the variable a, so we can access the submodule as a module's attribute. A module that can have submodules is called a package. Technically, a package is a module that has a __path__ attribute. This attribute tells Python where to look for submodules. When Python imports a top-level module, it searches for the module in the directories and ZIP archives listed in sys.path. But when it imports a submodule, it uses the __path__ attribute of the parent module instead of sys.path. Regular packages Directories are the most common way to organize modules into packages. If a directory contains a __init__.py file, it's considered to be a regular package. When Python imports such a directory, it executes the __init__.py file, so the names defined there become the attributes of the module. The __init__.py file is typically left empty or contains package-related attributes such as __doc__ and __version__. It can also be used to decouple the public API of a package from its internal implementation. Suppose you develop a library with the following structure: mylibrary/ __init__.py module1.py module2.py And you want to provide the users of your library with two functions: func1() defined in module1.py and func2() defined in module2.py. If you leave __init__.py empty, then the users must specify the submodules to import the functions: from mylibrary.module1 import func1 from mylibrary.module2 import func2 It may be something you want, but you may also want to allow the users to import the functions like this: from mylibrary import func1, func2 So you import the functions in __init__.py: # mylibrary/__init__.py from mylibrary.module1 import func1 from mylibrary.module2 import func2 A directory with a C extension named __init__.so or with a .pyc file named __init__.pyc is also a regular package. Python can import such packages perfectly fine: $ ls spam $ ls spam/ __init__.so $ python -q >>> import spam >>> Namespace packages Before version 3.3, Python had only regular packages. Directories without __init__.py were not considered packages at all. And this was a problem because people didn't like to create empty __init__.py files. PEP 420 made these files unnecessary by introducing namespace packages in Python 3.3. Namespace packages solved another problem as well. They allowed developers to place contents of a package across multiple locations. For example, if you have the following directory structure: mylibs/ company_name/ package1/... morelibs/ company_name/ package2/... And both mylibs and morelibs are in sys.path, then you can import both package1 and package2 like this: >>> import company_name.package1 >>> import company_name.package2 This is because company_name is a namespace package that contains two locations: >>> company_name.__path__ _NamespacePath(['/morelibs/company_name', '/mylibs/company_name']) How does it work? When Python traverses path entries in the path (sys.path or parent's __path__) during the module search, it remembers the directories without __init__.py that match the module's name. If after traversing all the entries, it couldn't find a regular package, a Python file or a C extension, it creates a module object whose __path__ contains the memorized directories. The initial idea of requiring __init__.py was to prevent directories named like string or site from shadowing standard modules. Namespace package do not shadow other modules because they have lower precedence during the module search. Importing from modules Besides importing modules, we can also import module attributes using a from <> import <> statement, like so: from module import func, Class, submodule This statement imports a module named module and assign the specified attributes to the corresponding variables: func = module.func Class = module.Class submodule = module.submodule Note that the module variable is not available after the import as if it was deleted: del module When Python sees that a module doesn't have a specified attribute, it considers the attribute to be a submodule and tries to import it. So if module defines func and Class but not submodule, Python will try to import module.submodule. Wildcard imports If we don't want to specify explicitly the names to import from a module, we can use the wildcard form of import: from module import * This statement works as if "*" was replaced with all the module's public names. These are the names in the module's dictionary that do not start with an underscore "_" or the names listed in the __all__ attribute if it's defined. Relative imports Up until now we've been telling Python what modules to import by specifying absolute module names. The from <> import <> statement allows us to specify relative module names as well. Here are a few examples: from . import a from .. import a from .a import b from ..a.b import c The constructions like .. and ..a.b are relative module names, but what are they relative to? As we said, a Python file is executed in the context of the current module whose dictionary acts as a dictionary of global variables. The current module, as any other module, can belong to a package. This package is called the current package, and this is what relative module names are relative to. The __package__ attribute of a module stores the name of the package to which the module belongs. If the module is a package, then the module belongs to itself, and __package__ is just the module's name (__name__). If the module is a submodule, then it belongs to the parent module, and __package__ is set to the parent module's name. Finally, if the module is not a package nor a submodule, then its package is undefined. In t'''
