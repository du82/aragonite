description = "Consider a simple assignment statement in Python: a = b The meaning of this statement may seem trivial. What we do here is take the value of the..."
full_description = '''Python behind the scenes #5: how variables are implemented in CPython Published: Sat 14 November 2020 By Victor Skvortsov tags: Python behind the scenes Python CPython Consider a simple assignment statement in Python: a = b The meaning of this statement may seem trivial. What we do here is take the value of the name b and assign it to the name a, but do we really? This is an ambiguous explanation that gives rise to a lot of questions: What does it mean for a name to be associated with a value? What is a value? What does CPython do to assign a value to a name? To get the value? Are all variables implemented in the same way? Today we'll answer these questions and understand how variables, so crucial aspect of a programming language, are implemented in CPython. Note: In this post I'm referring to CPython 3.9. Some implementation details will certainly change as CPython evolves. I'll try to keep track of important changes and add update notes. Start of the investigation Where should we start our investigation? We know from the previous parts that to run Python code, CPython compiles it to bytecode, so let's start by looking at the bytecode to which a = b compiles: $ echo 'a = b' | python -m dis 1 0 LOAD_NAME 0 (b) 2 STORE_NAME 1 (a) ... Last time we learned that the CPython VM operates using the value stack. A typical bytecode instruction pops values from the stack, does something with them and pushes the result of the computation back onto the stack. The LOAD_NAME and STORE_NAME instructions are typical in that respect. Here's what they do in our example: LOAD_NAME gets the value of the name b and pushes it onto the stack. STORE_NAME pops the value from the stack and associates the name a with that value. Last time we also learned that all opcodes are implemented in a giant switch statement in Python/ceval.c, so we can see how the LOAD_NAME and STORE_NAME opcodes work by studying the corresponding cases of that switch. Let's start with the STORE_NAME opcode since we need to associate a name with some value before we can get the value of that name. Here's the case block that executes the STORE_NAME opcode: case TARGET(STORE_NAME): { PyObject *name = GETITEM(names, oparg); PyObject *v = POP(); PyObject *ns = f->f_locals; int err; if (ns == NULL) { _PyErr_Format(tstate, PyExc_SystemError, "no locals found when storing %R", name); Py_DECREF(v); goto error; } if (PyDict_CheckExact(ns)) err = PyDict_SetItem(ns, name, v); else err = PyObject_SetItem(ns, name, v); Py_DECREF(v); if (err != 0) goto error; DISPATCH(); } Let's analyze what it does: The names are strings. They are stored in a code object in a tuple called co_names. The names variable is just a shorthand for co_names. The argument of the STORE_NAME instruction is not a name but an index used to look up the name in co_names. The first thing the VM does is get the name, which it's going to assign a value to, from co_names. The VM pops the value from the stack. Values of variables are stored in a frame object. The f_locals field of a frame object is a mapping from the names of local variables to their values. The VM associates a name name with a value v by setting f_locals[name] = v. We learn from this two crucial facts: Python variables are names mapped to values. Values of names are references to Python objects. The logic for executing the LOAD_NAME opcode is a bit more complicated because the VM looks up the value of a name not only in f_locals but also in a few other places: case TARGET(LOAD_NAME): { PyObject *name = GETITEM(names, oparg); PyObject *locals = f->f_locals; PyObject *v; if (locals == NULL) { _PyErr_Format(tstate, PyExc_SystemError, "no locals when loading %R", name); goto error; } // look up the value in `f->f_locals` if (PyDict_CheckExact(locals)) { v = PyDict_GetItemWithError(locals, name); if (v != NULL) { Py_INCREF(v); } else if (_PyErr_Occurred(tstate)) { goto error; } } else { v = PyObject_GetItem(locals, name); if (v == NULL) { if (!_PyErr_ExceptionMatches(tstate, PyExc_KeyError)) goto error; _PyErr_Clear(tstate); } } // look up the value in `f->f_globals` and `f->f_builtins` if (v == NULL) { v = PyDict_GetItemWithError(f->f_globals, name); if (v != NULL) { Py_INCREF(v); } else if (_PyErr_Occurred(tstate)) { goto error; } else { if (PyDict_CheckExact(f->f_builtins)) { v = PyDict_GetItemWithError(f->f_builtins, name); if (v == NULL) { if (!_PyErr_Occurred(tstate)) { format_exc_check_arg( tstate, PyExc_NameError, NAME_ERROR_MSG, name); } goto error; } Py_INCREF(v); } else { v = PyObject_GetItem(f->f_builtins, name); if (v == NULL) { if (_PyErr_ExceptionMatches(tstate, PyExc_KeyError)) { format_exc_check_arg( tstate, PyExc_NameError, NAME_ERROR_MSG, name); } goto error; } } } } PUSH(v); DISPATCH(); } This code translates to English as follows: As for the STORE_NAME opcode, the VM first gets the name of a variable. The VM looks up the value of the name in the mapping of local variables: v = f_locals[name]. If the name is not in f_locals, the VM looks up the value in the dictionary of global variables f_globals. And if the name is not in f_globals either, the VM looks up the value in f_builtins. The f_builtins field of a frame object points to the dictionary of the builtins module, which contains built-in types, functions, exceptions and constants. If the name is not there, the VM gives up and sets the NameError exception. If the VM finds the value, it pushes the value onto the stack. The way the VM searches for a value has the following effects: We always have the names from the builtin's dictionary, such as int, next, ValueError and None, at our disposal. If we use a built-in name for a local variable or a global variable, the new variable will shadow the built-in one. A local variable shadows the global variable with the same name. Since all we need to be able to do with variables is to associate them with values and to get their values, you might think that the STORE_NAME and LOAD_NAME opcodes are sufficient to implement all variables in Python. This is not the case. Consider the example: x = 1 def f(y, z): def _(): return z return x + y + z The function f has to load the values of variables x, y and z to add them and return the result. Note which opcodes the compiler produces to do that: $ python -m dis global_fast_deref.py ... 7 12 LOAD_GLOBAL 0 (x) 14 LOAD_FAST 0 (y) 16 BINARY_ADD 18 LOAD_DEREF 0 (z) 20 BINARY_ADD 22 RETURN_VALUE ... None of the opcodes are LOAD_NAME. The compiler produces the LOAD_GLOBAL opcode to load the value of x, the LOAD_FAST opcode to load the value of y and the LOAD_DEREF opcode to load the value of z. To see why the compiler produces different opcodes, we need to discuss two important concepts: namespaces and scopes. Namespaces and scopes A Python program consists of code blocks. A code block is a piece of code that the VM executes as a single unit. CPython distinguishes three types of code blocks: module function (comprehensions and lambdas are also functions) class definition. The compiler creates a code object for every code block in a program. A code object is a structure that describes what a code block does. In particular, it contains the bytecode of a block. To execute a code object, CPython creates a state of execution for it called a frame object. Besides other things, a frame object contains name-value mappings such as f_locals, f_globals and f_builtins. These mappings are referred to as namespaces. Each code block introduces a namespace: its local namespace. The same name in a program may refer to different variables in different namespaces: x = y = "I'm a variable in a global namespace" def f(): x = "I'm a local variable" print(x) print(y) print(x) print(y) f() $ python namespaces.py I'm a variable in a global namespace I'm a variable in a global namespace I'm a local variable I'm a variable in a global namespace Another important notion is the notion of a scope. Here's what the Python documentation says about it: A scope is a textual region of a Python program where a namespace is directly accessible. “Directly accessible” here means that an unqualified reference to a name attempts to find the name in the namespace. We can think about a scope as a property of a name that tells where the value of that name is stored. The example of a scope is a local scope. The scope of a name is relative to a code block. The following example illustrates the point: a = 1 def f(): b = 3 return a + b Here, the name a refers to the same variable in both cases. From the function's perspective, it's a global variable, but from the module's perspective, it's both global and local. The variable b is local to the function f, but it doesn't exist at the module level at all. The variable is considered to be local to a code block if it's bound in that code block. An assignment statement like a = 1 binds the name a to 1. An assignment statement, though, is not the only way to bind a name. The Python documentation lists a few more: The following constructs bind names: formal parameters to functions, import statements, class and function definitions (these bind the class or function name in the defining block), and targets that are identifiers if occurring in an assignment, for loop header, or after as in a with statement or except clause. The import statement of the form from ... import * binds all names defined in the imported module, except those beginning with an underscore. This form may only be used at the module level. Because any binding of a name makes the compiler think that the name is local, the following code raises an exception: a = 1 def f(): a += 1 return a print(f()) $ python unbound_local.py ... a += 1 UnboundLocalError: local variable 'a' referenced before assignment The a += 1 statement is a form of assignment, so the compiler thinks that a is local. To perform the operation, the VM tries to load the value of a, fails and sets the exception. To tell the compiler that a is global despite the assignment, we can use the global statement: a = 1 def f(): global a a += 1 print(a) f() $ python global_stmt.py 2 Similarly, we can use the nonlocal statement to tell the compiler that a name bound in an enclosed (nested) function refers to a variable in an enclosing function: a = "I'm not used" def f(): def g(): nonlocal a a += 1 print(a) a = 2 g() f() $ python nonlocal_stmt.py 3 This is the work of the compiler to analyze the usage of names within a code block, take statements like global and nonlocal into account and produce the right opcodes to load and store values. In general, which opcode the compiler produces for a name depends on the scope of that name and on the type of the code block that is currently being compiled. The VM executes different opcodes differently. All of that is done to make Python variables work the way they do. CPython uses four pairs of load/store opcodes and one more load opcode in total: LOAD_FAST and STORE_FAST LOAD_DEREF and STORE_DEREF LOAD_GLOBAL and STORE_GLOBAL LOAD_NAME and STORE_NAME; and LOAD_CLASSDEREF. Let's figure out what they do and why CPython needs all of them. LOAD_FAST and STORE_FAST The compiler produces the LOAD_FAST and STORE_FAST opcodes for variables local to a function. Here's an example: def f(x): y = x return y $ python -m dis fast_variables.py ... 2 0 LOAD_FAST 0 (x) 2 STORE_FAST 1 (y) 3 4 LOAD_FAST 1 (y) 6 RETURN_VALUE The y variable is local to f because it's bound in f by the assignment. The x variable is local to f because it's bound in f as its parameter. Let's look at the code that executes the STORE_FAST opcode: case TARGET(STORE_FAST): { PREDICTED(STORE_FAST); PyObject *value = POP(); SETLOCAL(oparg, value); FAST_DISPATCH(); } SETLOCAL() is a macro that essentially expands to fastlocals[oparg] = value. The fastlocals variable is just a shorthand for the f_localsplus field of a frame object. This field is an array of pointers to Python objects. It stores values of local variables, cell variables, free variables and the value stack. Last time we learned that the f_localsplus array is used to store the value stack. In the next section of this post we'll see how it's used to store values of cell and free variables. For now, we're interested in the first part of the array that's used for local variables. We've seen that in the case of the STORE_NAME opcode, the VM first gets the name from co_names and then maps that name to the value on top of the stack. It uses f_locals as a name-value mapping, which is usually a dictionary. In the case of the STORE_FAST opcode, the VM doesn't need to get the name. The number of local variables can be calculated statically by the compiler, so the VM can use an array to store their values. Each local variable can the be associated with an index of that array. To map a name to a value, the VM simply stores the value in the corresponding index. The VM doesn't need to get the names of variables local to a function to load and store their values. Nevertheless, it stores these names in a function's code object in the co_varnames tuple. Why? Names are necessary for debugging and error messages. They are also used by the tools such as dis that reads co_varnames to display names in parentheses: 2 STORE_FAST 1 (y) CPython provides the locals() built-in function that returns the local namespace of the current code block in the form of a dictionary. The VM doesn't keep such a dictionary for functions but it can built one on the fly by mapping keys from co_varnames to values from f_localsplus. The LOAD_FAST opcode simply pushes f_localsplus[oparg] onto the stack: case TARGET(LOAD_FAST): { PyObject *value = GETLOCAL(oparg); if (value == NULL) { format_exc_check_arg(tstate, PyExc_UnboundLocalError, UNBOUNDLOCAL_ERROR_MSG, PyTuple_GetItem(co->co_varnames, oparg)); goto error; } Py_INCREF(value); PUSH(value); FAST_DISPATCH(); } The LOAD_FAST and STORE_FAST opcodes exist only for performance reasons. They are called *_FAST because the VM uses an array for the mapping, which works faster than a dictionary. What's the speed gain? Let's measure the difference between STORE_FAST and STORE_NAME. The following piece of code stores the value of the variable i 100 million times: for i in range(10**8): pass If we place it in a module, the compiler produces the STORE_NAME opcode. If we place it in a function, the compiler produces the STORE_FAST opcode. Let's do both and compare the running times: import time # measure STORE_NAME times = [] for _ in range(5): start = time.time() for i in range(10**8): pass times.append(time.time() - start) print('STORE_NAME: ' + ' '.join(f'{elapsed:.3f}s' for elapsed in sorted(times))) # measure STORE_FAST def f(): times = [] for _ in range(5): start = time.time() for i in range(10**8): pass times.append(time.time() - start) print('STORE_FAST: ' + ' '.join(f'{elapsed:.3f}s' for elapsed in sorted(times))) f() $ python fast_vs_name.py STORE_NAME: 4.536s 4.572s 4.650s 4.742s 4.855s STORE_FAST: 2.597s 2.608s 2.625s 2.628s 2.'''
