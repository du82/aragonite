["https://tenzer.dk/guide-docker-registry-frontend"]
title = "Guide: Docker Registry Frontend - Tenzer.dk"
description = """
If you have your own private Docker registry you might be wanting some kind of frontend for it, as docker search [...] can only get you so far in regards to getting an overview of what the registry contains. Fortunately all the information you might want about the registry contents can be aquired through the REST API, making it possible to present the data neatly on a website.
Konrad Kleine has made the docker-registry-frontend project to do just that. It's a client-only AngularJS based web app which calls the Docker registry API directly and serves it up in a neat web interface (screenshots here)."""
full_description = '''Guide: Docker Registry FrontendPosted on January 17, 2015. Reading time: 3 minutesIf you have your own private Docker registry you might be wanting some kind of frontend for it, as docker search [...] can only get you so far in regards to getting an overview of what the registry contains. Fortunately all the information you might want about the registry contents can be aquired through the REST API, making it possible to present the data neatly on a website.Konrad Kleine has made the docker-registry-frontend project to do just that. It's a client-only AngularJS based web app which calls the Docker registry API directly and serves it up in a neat web interface (screenshots here).While he does provide a Dockerfile which builds and run the interface, I would rather just serve the files via the Nginx server which already run in front of the registry.I am going to presume you have set up a private registry like described in my guide. First you have to install the dependencies we need; Git for getting the code and Node.js + NPM for building it. We also make a symlink to the Node.js executable so it can be called with just node as some NPM packages' install scripts rely on that:sudo apt-get install git nodejs npm sudo ln -s /usr/bin/nodejs /usr/local/bin/nodeThen switch to the Docker user and clone the Git repository into a folder called frontend:sudo su - docker git clone https://github.com/kwk/docker-registry-frontend.git frontendThen enter the folder, install the Node.js and Bower packages and then build the site with Grunt:cd frontend/ npm install node_modules/.bin/bower install node_modules/.bin/grunt buildThe build files are then available inside the /home/docker/frontend/dist/ folder. Before the site can be served we have to copy and adjust two JSON files containing some metadata the frontend need. The first one, app-version.json, can be generated like this:echo '{ "git": { "sha1": "'$(git log --pretty=format:%h -n 1)'", "ref": "'$(git branch | cut -c 3-)'" } }' > dist/app-version.jsonThe second file, registry-host.json, contain the hostname and port number of where the registry is located at, and is used to create copy/pastable docker pull commands in the web interface. Create a file at dist/registry-host.json and fill it out like this (adjust the hostname and port number as needed):{ "host": "docker.domain.com", "port": 443 }The last thing to do is to change our Nginx configuration to serve this interface. You can use this Nginx configuration and modify to suit you:upstream docker { server 127.0.0.1:5000; } server { listen 80; listen 443 ssl; ssl_certificate cert.pem; ssl_certificate_key cert.key; client_max_body_size 500M; proxy_set_header Host $host; auth_basic "Docker Registry"; auth_basic_user_file /home/docker/auth; location / { root /home/docker/frontend/dist; } location /v1 { proxy_pass http://docker; } # Endpoints which are not requested with authentication location /v1/_ping { proxy_pass http://docker; auth_basic off; } location /v1/search { proxy_pass http://docker; auth_basic off; } }Then just reload the Nginx configuration with sudo service nginx reload, open the Docker registry website in a browser, input your credentials and there you have it.'''
