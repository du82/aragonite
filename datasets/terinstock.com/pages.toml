["https://terinstock.com/post/2017/06/Aliasing-JavaScript-Modules"]
title = "Aliasing JavaScript Modules"
description = """
A number of years ago I wrote a blog post detailing how to replace modules in a Browserify bundle. In the interceding years, the JavaScript ecosystem has had at least three lifetimes, and we’re now due for an update.
Browserify As the last post focused entirely on Browserify, I’ll first revisit it first. As noted in the previous post, the browserify-swap transform is designed to swap individual files, not modules. We were able to work around it by defining the configuration as a RegExp, but it’s easy to get wrong. You can now use the aliasify transform, which does support replacing modules."""
full_description = 'Aliasing JavaScript ModulesA number of years ago I wrote a blog post detailing how to replace modules in a Browserify bundle. In the interceding years, the JavaScript ecosystem has had at least three lifetimes, and we’re now due for an update.BrowserifyAs the last post focused entirely on Browserify, I’ll first revisit it first. As noted in the previous post, the browserify-swap transform is designed to swap individual files, not modules. We were able to work around it by defining the configuration as a RegExp, but it’s easy to get wrong. You can now use the aliasify transform, which does support replacing modules.A number of years ago I wrote a blog post detailing how to replace modules in a Browserify bundle. In the interceding years, the JavaScript ecosystem has had at least three lifetimes, and we’re now due for an update.BrowserifyAs the last post focused entirely on Browserify, I’ll first revisit it first. As noted in the previous post, the browserify-swap transform is designed to swap individual files, not modules. We were able to work around it by defining the configuration as a RegExp, but it’s easy to get wrong. You can now use the aliasify transform, which does support replacing modules.After installing, enable the transform, and add a new section to your package.json.{ "browserify": { "transform": [ "aliasify" ] }, "aliasify": { "aliases": { "underscore": "lodash" } } } In addition to aliasing modules, aliasify supports replacments that are relative to the file calling require, as well as using RegExps to define replacement.WebpackWebpack supports aliasing modules right out of the box, no plugins needed. Just add an additional section to your Webpack configuration.{ "resolve": { "alias": { "underscore": "lodash" } } } BabelYou can also setup aliases in Babel with the babel-plugin-module-resolver plugin. Like the above, just add a section to your Babel configuration.{ "plugins": [ ["module-resolver", { "root": ["."], "alias": { "underscore": "lodash" } }] ] } YarnFinally, you can alias before dependencies are even written to disk if you use Yarn1. Since it breaks compatibility with npm, it’s best if you only use this method in private applications, not public applications or in libraries.In this method you combine the alias with defining your dependencies in package.json.{ "dependencies": { "underscore": "npm:lodash" } } Unlike the other methods in this guide, using the Yarn method also allows you to install the same dependency at different versions by giving them different names.{ "dependencies": { "lodash3": "npm:lodash@^3", "lodash4": "npm:lodash@^4" } } Unfortunately, it seems this isn’t yet in the documentation. It has, however, been a “Yarn tip”. ↩︎2017-06-20Terin Stock'
author = "Terin Stock"
year_published = 2022
year_updated = 2022
