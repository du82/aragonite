["https://terinstock.com/post/2021/12/Systemds-clock-epoch-for-RTC-less-systems"]
title = "Systemd's clock-epoch for RTC-less systems"
description = "Configuring the systems clock at boot for RTC-less systems, like the Raspberry Pi, using systemd's clock-epoch."
full_description = "Systemd's clock-epoch for RTC-less systemsEarlier today I restarted a Raspberry Pi I use on my home network. When the system came up after reboot, many services failed to resume, which I quickly noticed due to the lack of DNS resolution on my network. Upon checking the system logs, the culprit became clear: CoreDNS was failing to verify the certificates of my DNS-over-TLS provider. According to my Raspberry Pi, we were partying like it was 1999. Without DNS resolution the system time would never automatically synchronize with NTP.Earlier today I restarted a Raspberry Pi I use on my home network. When the system came up after reboot, many services failed to resume, which I quickly noticed due to the lack of DNS resolution on my network. Upon checking the system logs, the culprit became clear: CoreDNS was failing to verify the certificates of my DNS-over-TLS provider. According to my Raspberry Pi, we were partying like it was 1999. Without DNS resolution the system time would never automatically synchronize with NTP.On a Raspberry Pi running Raspian or Raspberry Pi OS, the system is automatically configured to use fake-hwclock to save the time to disk from a cron, and restore it at boot. However, this package isn’t widely distributed outside Debian and it’s derivatives.At boot, systemd compares the system time to a builtin epoch, usually the release or build date of systemd. If it finds the system time is before this epoch, it resets the clock to the epoch. Unfortunately, this is still sometimes too old, especially when it comes to TLS certificates.We can still utilize this systemd feature however, at least if systemd is version 247 or newer, by utilizing a hook added to aid system administrators and image distributors. If the file /usr/lib/clock-epoch exists, systemd uses the modified time as the systemd epoch.We can even script periodically updating this file. First, create /etc/systemd/system/set-clock-epoch.service:[Unit] Description=Updates the mtime of clock-epoch [Service] ExecStart=/bin/touch -m /usr/lib/clock-epoch Then, create a timer to start it periodically, at /etc/systemd/system/set-clock-epoch.timer:[Unit] Description=Timer for updating clock-epoch [Timer] OnBootSec=5min OnUnitInactiveSec=17min [Install] WantedBy=timers.target I’ve arbitrarily delayed activation of this timer by setting OnBootSec, since this is low priority at boot time.Then reload the daemon, then enable and start the timer.systemctl daemon-reload systemctl enable --now set-clock-epoch.timer Now when the system reboots, systemd will read the modification time of this file during early boot, setting the time to a reasonably close value, allowing certificates to be validated and NTP to take over.As gioele on Lobste.rs points out, on systemd version 250 and later, if you’re using systemd-timesyncd you can set SaveIntervalSec= to automatically write the time out to the filesystem. This follows a similar mechanism, the file /var/lib/systemd/timesync/clock has it’s modification time set, and is used to restore out reboot. The time is set by the epoch mechanism much earlier in the startup process than the timesyncd mechanism (which first requires service activation to begin). It also doesn’t help if, like me, you’re not using timesyncd.2021-12-26Terin Stock"
author = "Terin Stock"
year_published = 2021
year_updated = 2021
clearnet = "https://terinstock.com/post/2021/12/Systemds-clock-epoch-for-RTC-less-systems"
