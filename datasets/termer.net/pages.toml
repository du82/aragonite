["https://termer.net/blog/youtube-video-ripping-mega-guide"]
title = "YouTube video ripping mega guide - Termer.net"
description = "Do it the right way (everything you need to know)"
full_description = '''Lots of people download videos from YouTube, either for just saving later, or using them as part of something else. Lots of people also don't understand what they're doing at all and end up using downloader sites. Downloader sites range from decent (Y2Mate) to horrible (someone told me they used this site when I asked them what site was messing up videos they were downloading). The problem with downloader sites is a combination of things, but typically it comes down to these: They compress[g7] your videos, they aren't lossless[g5] They often introduce errors into the video files For these reasons, you should avoid using online downloaders for YouTube videos. The aim of this article is to teach you the correct way of downloading YouTube videos with youtube-dl and giving you the information you need to make intelligent choices while using it. The article is structured to give quick answers to common problems and needs, but I encourage you to read all the sections to learn more about youtube-dl and YouTube ripping in general. ¶ Table of contents Installing youtube-dl Download and install Updating Current status Current development status yt-dlp Downloading videos A note about VPNs Downloading on servers Where videos are downloaded Basic video download Downloading specific qualities Downloading qualities by criteria Downloading a video's audio only Downloading a video and all of its metadata Downloading livestreams Downloading premium and user-locked videos Downloading subscriptions Downloading age-restricted videos Downloading geo-blocked/restricted videos Cancelling downloading Resuming downloads Improving download speed Output filename structure Typical files Unfinished files Video formats and containers Difference between a format, a container, and a file extension Web-friendly containers Don't be afraid of .mkv Media players Recommended media players Media players you shouldn't use Troubleshooting Failed to extract video metadata Did not get any data blocks HTTP Error 429: Too Many Requests HTTP Error 410: Gone Video file is broken after cancelling livestream Further reading Glossary ¶ Installing youtube-dl youtube-dl (alternate links: #1, #2, #3) is a tool used for downloading YouTube videos, along with videos from other sites as well. It will download YouTube videos at their highest quality by default, and not convert. This preserves videos' original quality on YouTube. ¶ Download and install ⮟ Windows Instructions Using the .exe The simplest way to install youtube-dl is by downloading youtube-dl.exe from the youtube-dl website. Files: youtube-dl.exe Microsoft Visual C++ 2010 Redistributable Package (x86) (required, you might already have it installed) Once you've downloaded youtube-dl.exe, make a folder for it that you will remember, and that is accessible to all users. You will need to update the program eventually so you need to know where the exe is stored. My recommendation is to make a folder called C:Program Filesyoutube-dl, and put the exe there. Then, you need to add youtube-dl to your PATH system property so that you can access the executable anywhere. Open either cmd (Command Prompt) or PowerShell, as an administrator and run the following: setx /M path "%PATH%;<i>C:Program Filesyoutube-dl</i>" Replace the italic text with the folder you put youtube-dl.exe in. You should now have youtube-dl installed. Using Chocolatey Chocolatey is a Windows package manager (basically a program installer) that makes installing and updating programs more centralized and easier. It cuts out the need for things like messing with your PATH system property and simplifies updating. Generally, for youtube-dl I recommend against installing with package managers, but Chocolatey updates the youtube-dl package very quickly, so it's suitable. If you don't already have it, install by following the instructions on the program's website. Once the program is installed, open cmd (the command prompt), or PowerShell, as an administrator. Once you have it open, run the following command, and accept the license when it prompts you to do so: choco install youtube-dl After that, it should be ready to use. ⮟ macOS Instructions Installing directly to /usr/local/bin/ The website contains the following script to install youtube-dl: sudo curl -L https://yt-dl.org/downloads/latest/youtube-dl -o /usr/local/bin/youtube-dl sudo chmod a+rx /usr/local/bin/youtube-dl Alternatively, you can use wget instead of curl if you don't have it installed: sudo wget https://yt-dl.org/downloads/latest/youtube-dl -O /usr/local/bin/youtube-dl sudo chmod a+rx /usr/local/bin/youtube-dl Using Homebrew I don't use macOS, so I can't give much good advice on the installation process using Homebrew, and am not sure it's a good idea to use it over the scripts provided above. However, if it is a good idea, I found this article (archive) that might be of use. ⮟ Linux Instructions Installing directly to /usr/local/bin/ This is the preferred method, because it allows you to update using the program itself. The website contains the following script to install youtube-dl: sudo curl -L https://yt-dl.org/downloads/latest/youtube-dl -o /usr/local/bin/youtube-dl sudo chmod a+rx /usr/local/bin/youtube-dl Alternatively, you can use wget instead of curl if you don't have it installed: sudo wget https://yt-dl.org/downloads/latest/youtube-dl -O /usr/local/bin/youtube-dl sudo chmod a+rx /usr/local/bin/youtube-dl Installing with your package manager I strongly recommend against using your package manager for the following reasons: You cannot update using the program itself Package repositories are likely to be out of date Package repositories do not update as quickly as youtube-dl releases new versions If you still want to use your package manager for some reason, you can install using Apt on Ubuntu/Debian/ElementaryOS with this command: sudo apt install youtube-dl Using Pacman on ArchLinux/Manjaro: sudo pacman -S youtube-dl If you don't use any of these distributions, check for a package named youtube-dl on your package manager's repositories. ¶ Updating You often have to update youtube-dl because sites like YouTube change their code very often and break the program's functionality, requiring you to update the tool. ⮟ Windows Instructions If you downloaded the .exe Download the new youtube-dl.exe and replace your old exe with it. If you used Chocolatey Open cmd (Command Prompt) or PowerShell, as an administrator, and run the following command: choco upgrade youtube-dl ⮟ macOS Instructions Simply run youtube-dl -U and the program will update itself. Since I don't use macOS, I don't know how the permissions are with the program, so you may need to run that command using sudo or some other command to elevate your permissions if that didn't work. ⮟ Linux Instructions If you installed to /usr/local/bin/ Simply run sudo youtube-dl -U and the program will update itself. If you installed with a package manager You're at the mercy of your package repositories, so you'll need to update using your package manager and hope they have the latest version available. ¶ Current status A piece of software like youtube-dl should be constantly evolving. Here is the status of the project as of Saturday, March 26th, 2022. TL;DR: youtube-dl is alive again and is under active development. ¶ Current development status The history of youtube-dl includes some legal troubles, and its repository on GitHub was even temporarily taken down, but was later reinstated. As for its current status, youtube-dl has been under active development after a period of many months in 2021 (and some of 2022) when it did not receive any updates. It is currently getting daily or near-daily commits to its source code, so there shouldn't be any issues for now. If there are more issues similar to past ones, check out the next section for information on a fork of youtube-dl that gets very frequent updates, even during lulls in normal youtube-dl development. ¶ yt-dlp yt-dlp is a fork of youtube-dl that has active development and more features. It has a few minor differences from the original youtube-dl, but it's generally the same. If you are a Windows user, you can use Chocolatey to install it, similar to the instructions on the install guide. Otherwise, you can follow the instructions for Windows in the youtube-dl download guide, just replacing youtube-dl with yt-dlp. The official installation guide can be found here, and it covers installation on other systems. General advice provided in the youtube-dl download guide still applies. If you are looking for where to download the binaries (like the .exe file), the latest release is here. Among the differences between youtube-dl and yt-dlp, the main ones that I have experienced are the following: Different output filename format youtube-dl's format uses a dash before the video ID, but yt-dlp adds a space and surrounds the ID with brackets. Stories From Our Disturbing World _ Episode 1 [B9RbCdSNoQg].mkv I'm not a fan of this for several reasons (brackets are harder to deal with in filenames, and why did they change it in the first place?), but it's not too big of a change. Different download formats chosen by default The formats that are normally chosen by youtube-dl prioritize video bitrate, but yt-dlp prioritizes real quality and codec efficiency. In the real world, this translates to more WebM downloads and less MKV downloads. I did a comparison between the visual artifacts[g1] in a video chosen by yt-dlp and one by youtube-dl, and I didn't see any noticeable differences, but I am still skeptical about this. You can still manually choose your format and quality as normal. For a full list of differences, see the project's differences in default behavior section. I personally use yt-dlp in place of youtube-dl, and if any of its extra features interest you, or if youtube-dl development slows in the future, I highly recommend it. During the period of several months when youtube-dl was broken, yt-dlp worked very well. ¶ Downloading videos youtube-dl is a command-line program, so all examples in this section need to be run in a command line of some sort, either a terminal on Linux & MacOS, or in Windows Command Prompt or PowerShell. All download commands can accept a single video URL, channel, playlist, and more. ¶ A note about VPNs As a tool that interacts with external websites, youtube-dl's behavior isn't concrete and is at the mercy of the site it's interacting with. With that said, the way youtube-dl connect to YouTube is important. Using youtube-dl while using a VPN usually works, but sometimes ends up causing issues. YouTube tends to treat VPN users worse because they look less human, and more like bots. For this reason, it's recommended that you disconnect from your VPN if you encounter issues while using it. If you still need to use a VPN with it, consider switching to another VPN location, or run it with your browser cookies as explained in the Downloading premium and user-locked videos section. ¶ Downloading on servers In the previous section, I mentioned that YouTube treats VPNs differently than normal connection. The same thing applies to downloading videos on servers. The IP addresses used on servers show up as datacenter IPs, whereas those coming from a house are residential. This means that servers will be significantly rate limited and even outright blocked if they download too many videos. The usual effect is that after a few downloads, YouTube will detect that the download is not normal traffic, and limit the speed to below what's required to watch it at normal speed. For example, a video that's 1 hour and 45 minutes long, you can expect your download to take almost 4 hours. There is no way around this, although you can try to run it with your browser cookies as explained in the Downloading premium and user-locked videos section. ¶ Where videos are downloaded Videos are downloaded to whatever your current commandline/terminal location is. By default, this is your home folder. Regardless of your platform, you can change the current folder by typing the following: cd <new location> This will change your folder to the provided location, and until you close that commandline/terminal or change the location again, videos will be downloaded there. Additionally, it's worth noting that there is no way to define a default download location, this process is necessary each time you open a new commandline/terminal. ¶ Basic video download The most basic command in youtube-dl is providing it with a single URL to download: youtube-dl "<URL>" This command will download the video provided at the highest quality possible. This works on both singular videos, OR playlists, entire channels, and more. Keep in mind that if you're specifying a YouTube video and it's from a playlist, youtube-dl will download the entire playlist and not just the video, so be careful not to give it a playlist by accident when you meant to download only one video. EDIT 07/01/2021: Someone has told me that this didn't happen when they provided a video that was from a playlist, so if it only downloads the singular video for you, go to the playlist page and use that URL instead. ¶ Downloading specific qualities You can download a specific video quality, or even download a video's audio only if you like. The first thing you need to do is see which qualities are available to you: youtube-dl -F "<URL>" This will produce something similar to the following: [info] Available formats for B9RbCdSNoQg: format code extension resolution note 249 webm audio only tiny 64k , opus @ 50k (48000Hz), 11.22MiB 250 webm audio only tiny 81k , opus @ 70k (48000Hz), 15.23MiB 140 m4a audio only tiny 132k , m4a_dash container, mp4a.40.2@128k (44100Hz), 27.84MiB 251 webm audio only tiny 152k , opus @160k (48000Hz), 29.42MiB 394 mp4 256x144 144p 91k , av01.0.00M.08, 30fps, video only, 13.16MiB 278 webm 256x144 144p 97k , webm container, vp9, 30fps, video only, 14.80MiB 160 mp4 256x144 144p 191k , avc1.4d400c, 30fps, video only, 10.52MiB 395 mp4 426x240 240p 218k , av01.0.00M.08, 30fps, video only, 18.97MiB 242 webm 426x240 240p 224k , vp9, 30fps, video only, 20.16MiB 133 mp4 426x240 240p 328k , avc1.4d4015, 30fps, video only, 19.31MiB 396 mp4 640x360 360p 401k , av01.0.01M.08, 30fps, video only, 32.84MiB 243 webm 640x360 360p 411k , vp9, 30fps, video only, 33.20MiB 134 mp4 640x360 360p 603k , avc1.4d401e, 30fps, video only, 34.05MiB 397 mp4 854x480 480p 735k , av01.0.04M.08, 30fps, video only, 55.80MiB 244 webm 854x480 480p 756k , vp9, 30fps, video only, 50.42MiB 135 mp4 854x480 480p 1025k , avc1.4d401f, 30fps, video only, 49.43MiB 398 mp4 1280x720 720p 1497k , av01.0.05M.08, 30fps, video only, 114.65MiB 247 webm 1280x720 720p 1515k , vp9, 30fps, video only, 88.29MiB 136 mp4 1280x720 720p 2238k , avc1.4d401f, 30fps, video only, 85.67MiB 399 mp4 1920x1080 1080p 2630k , av01.0.08M.08, 30fps, video only, 205.52MiB 248 webm 1920x1080 1080p 2664k , vp9, 30f'''
