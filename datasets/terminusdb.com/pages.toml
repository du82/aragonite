["https://terminusdb.com/blog/entity-resolution-with-ai-dblp-and-acm-publication-benchmark"]
title = "Entity Resolution with AI: DBLP and ACM publication benchmark - TerminusDB"
description = "The DBPL / ACM publication record matching benchmark was constructed in order to have a good test-set for exploring the quality of automatic record matching algorithms. We are going to explore matching results on this dataset using an unusual, but very simple and straightforward approach which leverages OpenAI’s LLM (Large Language Model), requires very little […]"
full_description = "The DBPL / ACM publication record matching benchmark was constructed in order to have a good test-set for exploring the quality of automatic record matching algorithms. We are going to explore matching results on this dataset using an unusual, but very simple and straightforward approach which leverages OpenAI’s LLM (Large Language Model), requires very little tuning or fiddling and which you can easily adapt to your own data problems. The TL;DR is that we can get a precision of 99.6% for entity resolution with about half an hour of work by leveraging LLMs! To ingest the data from the csv’s that are distributed with the test set, we can write a little python helper and use the tdb-cli which can work with local or cloud TerminusDB databases. This schema has a number of fields, all of which are required. The final field source will be used to remind us the source of the record (ACM versus DBLP2). In addition we’ve taken the liberty of creating a query and template for the embedding of our publications. To see more about how these are constructed look at Part1. Once we’ve constructed the schema we can create the documents for ingestion to TerminusDB (using a bit of python): This generates a file called all_records.json which contains every record we intend to add in a json-lines file. We can now go through the list and look at candidates for merger. This process can also be done incrementally as new objects are added, but we’ll have to repeated it n times to start, for each element in our database. Let’s look at the results of some of our documents. First, we can look up iri:///dblp-acm/i/Publication/174639 with terminusdb to see whatwe’re talking about: This first result looks extremely promising, and the second looksdubious having a distance almost 6 times as large. This is looking very promising indeed! This record is quite different due to the use of html entities describing inflections in one record, and folding into standard Latin character set in the other, the use of acronyms in the venue in one, and none in the other. But perhaps most importantly, this is not cherry-picked. This was literally the first record that went in to our vector indexer (at id zero) and we have just found its match."
author = "Gavin"
year_published = 2023
year_updated = 2023
