["https://terminusdb.com/blog/graphql-rdf-bridge-using-star-wars-dataset"]
title = "GraphQL RDF Bridge using Star Wars Dataset in TerminusDB"
description = "I wrote this blog to showcase a GraphQL RDF bridge using a Star Wars dataset that I found. It explains what I did in TerminusDB"
full_description = "Since TerminusDB recently got GraphQL, I thought I’d do the done thing and load in the Star Wars Dataset and look at bridging GraphQL & RDF. First, I looked around to find some JSON files that I could marshall into TerminusDB without too much trouble, but as I was looking I came across this DataSet: Star Wars Dataset. This not only has JSON files, but RDF! I thought I’d take a crack at inserting RDF into TerminusDB and then querying it with GraphQL to see what was required. TerminusDB can read RDF files with little difficulty. However, to get the value of TerminusDB you really need a schema. So the first stop is to figure out how we massage the RDF to get it into an easily ‘schemable’ form. The original star wars ttl is actually directly useable, but I don’t particularly like when the schema, and the data share the same namespace. For instance, here we have sw used for both people, and the type of people. This replaces all properties and types using sw: with schema:, and replaces all the rdfs:label with a local name – this look far less ugly when we use GraphQL (perhaps later we will allow local renaming of classes and properties for use in GraphQL). Now we can load it into TerminusDB from the command line. First we create the database, with schema checking turned off. Now it is possible to query the database with TerminusDB using WOQL. You can do this in the dashboard query panel, perhaps by using the query: Just below the context, we’ll define schema:People. Since we have stated in our context that the base for @schema matches the schema: prefix, we don’t need to specify it anymore in our objects. Here we have a number of required properties, together with a number of Set properties. Sets can have any number of elements in the range. In addition we have a couple of Optional properties. These can be anything. The datatypes we use are from xsd, which lines up perfectly with the RDF we have imported. I repeated this process for Film, Planet, etc. until I got what I felt was a complete TerminusDB Star Wars schema.."
