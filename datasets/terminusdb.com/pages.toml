["https://terminusdb.com/blog/bridging-the-data-and-domain-divide"]
title = "Bridging the data and domain divide - TerminusDB"
description = "Somewhere, sometime, a divide has occurred between IT teams and domains, this article looks at the problems this causes and a solution to help"
full_description = "Us and them – it’s a powerplay that governments, media, and countless other bearers of power have used to divide and conquer. It is fair to say that this approach is not a constructive way to approach power and one side will always feel like they lost. Somewhere, sometime, a divide has occurred between IT teams and domains. This widening chasm is stagnating modern businesses. This divide doesn’t have winners, only losers. This article is about communication and collaboration, and attempts to look at how domains and data teams can bridge the divide without radical change. I will level with you, I write this article firmly from a domain perspective. That does not mean I will use it to cry that IT and data teams have neglected me throughout my career, I will endeavor to use empathy and professionalism to look evenly from both sides. Much of that list can be accomplished by successfully achieving business goals. However, goals set by the business become murky as they travel from the top through various levels of management and land on a foot soldier’s desk. Do department-level goals pull in the same direction as overall company objectives? You’d hope so, but sometimes it is easy to get lost in your silo to see the bigger picture. Typically, domains get access to data through applications and services. Think Google Analytics for marketing, or Sage for finance. If they need additional data for new services, campaigns, or analysis, they need to request it. Often this request needs a business case that takes time to put together. The request is made through the IT department or service desk, taking more time to get to the right team. As requests are infrequent, there is no personal relationship between the data or IT team and domain members. Knowing who to speak to is a task in itself, particularly in a large organization that implements a call-center-style service desk, think, ‘you are fourth in the queue…your call is important to us.’ When the domain gets through, the data team is busy and has added the request to the backlog of tasks."
author = "Oliver"
