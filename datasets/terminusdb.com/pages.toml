["https://terminusdb.com/blog/graph-database-fundamentals"]
title = "Graph Database Fundamentals - RDF, Property Graph, Linked-Data"
description = "Learn about graph database types to understand the concepts behind RDF, property graphs, linked-data, and graph schema languages."
full_description = "Knowledge Graph Schema Design Patterns and Principles Graph schema design is very important but unfortunately, there isn’t a lot of guidance, this article aims to provide some assistance for those looking to understand schema modeling. Read More » Gavin March 14, 2023 Graph databases are on the rise, but amid all the hype it can be hard to understand graph database differences under the hood. This blog is not marketing or a tutorial — it’s an attempt to give a clear description of strengths and weaknesses. There are two major variants of graph database in the wild — RDF graphs (aka triple-stores) and Labeled Property Graphs. RDF is a child of the web, formulated back in the 1990s, by Tim Bray at Netscape as a meta-data schema for describing things. The basic idea is simple, RDF files consist of a set of logical assertions: subject, predicate, object — known as a triple: When joined together a set of triples forms a graph consisting of nodes and edges — it really is as simple as that. Triples can be combined to represent a knowledge graph that computers can interpret and reason about. When joined together, they form a natural graph, where the predicates (the middle part of the triple) are interpreted as edges and the subjects and objects are the nodes. So far so good. In fact, triples are an excellent atom of information — 3 degrees of freedom in our basic atomic expressions is sufficient for a self-describing system. We can build up a set of triples that describes anything describable. Binary relations, on the other hand, which are the basis of tables and traditional databases, can never be self-describing: they will always need some logic external to the system to interpret them — 2 degrees of freedom is insufficient. The triple as a logical assertion is also a tremendously good idea — one consequence is that we don’t have to care about duplicate triples — if we tell the computer that Mary likes John a million times, it is the same as telling it once — a true fact is no more nor less true if we say it 1000 times or once."
author = "Luke"
year_published = 2022
year_updated = 2023
