["https://terminusdb.com/blog/knowledge-graph-data-mesh-metaverse-6"]
title = "Knowledge Graph & Data Mesh Metaverse 6"
description = "Welcome to the knowledge graph and data mesh metaverse where we share interesting stories about these subjects. This is issue number 6."
full_description = "Hello and welcome to the sixth edition of Knowledge Graph & Data Mesh Metaverse which shares interesting articles about this world. We share a lot of content via our Discord channels so thought we’d share the love and provide a regular update as to what’s been floating our boats. Joe Reis and Matt Housley of Ternary Data interview Zhamak Dehghani about all things data mesh. This hour-long YouTube video takes the format of an informal Q&A and is a great place to start learning more about data mesh. Semantic web expert, author, and Principal Consultant at Working Ontologist LLC, wrote this nice article for Data Science Central. He provides a shortcut for building an ontology to map out a knowledge graph based on a use-case method. Joe Reis has been on a roll of late. Another superb video event on LinkedIn saw him joined by his pal Matt along with Chad Sanderson and the Father of Data Warehousing, Bill Inmon. They discuss how data architecture has historically been a last-minute necessity purchase, rather than something that is planned, resulting in the muddle many organizations find themselves in today. The video also looks at what a modern data product should look like and spends time focusing on the people element to make it a fascinating watch. Now that Google’s Lamda has been outed as sentient, AI discussion has been a lot more mainstream of late. This article from Forbes looks at how knowledge graphs will make AI more trustworthy by having the ability to plot relationships more effectively to improve upon the AI that we know today. Chad Sanderson makes his second appearance in this edition of Metaverse, but this time flying solo. In his regular blog, he wrote about the death of data modeling following a LinkedIn post on the same subject that gained traction. The post talks about the importance of data modeling to form a semantic understanding of data so that it relates to the real world, how and where it’s all gone wrong, and how the industry should fix it."
