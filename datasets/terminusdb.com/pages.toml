["https://terminusdb.com/blog/ising-model-for-financial-governance"]
title = "Why SVB needed an Ising Model for Financial Governance"
description = "Another financial crisis! This article talks about how regulators need graph databases and the Ising Model to protect our societies."
full_description = "This article discusses the situation with Silicon Valley Bank and how existing tools, such as graph databases and the Ising Model, can help regulators provide better financial governance. In one sense, it looks like a fairly straightforward bank run, but the extraordinary bailout announced directly after suggests that the risk was systemic. Whether that was all the VCs shouting contagion in the crowded theatre or something deeper under the hood, it certainly got the federal administrators moving. By Sunday evening the bailout was done and deposits were available on Monday morning. Banks are all about maturity mismatches, so the mismatch between the mortgage-backed securities and the interest rate isn’t sufficient to explain the problems. Truthfully, no bank has the capital to handle a full-blown (and in this case twitter-led) instant bank run. Bank business models don’t work like that. So the proximate causes of the problems with SVB are well described. My personal problem with the whole situation is that the leadership, equity holders, shareholders, and other insiders in SVB, and the other banks that went bust, are allowed to retain the private gains they pocketed over the last number of bumper years while the taxpayer has to clear up the mess. They get to pick the pennies from in front of the proverbial steamroller, but the public gets crushed when they pick a penny too far. That discretion to create private fortunes destroys incentive alignment in what is effectively a public utility. While the details are different, the system fundamentals are the same as in ‘08. In any case, this article is more about how visibility into a financial system allows you to understand systemic risk. So what happened in 2008? At the base, financial assets were mispriced due to systemic risk. That systemic risk came from unknown network dependencies. The chart below which highlights the spectacular amount of unrealized losses in the US right now (trillions of dollars) probably points us toward the reason behind the aggressive response to SVB’s failure from the Fed and the FDIC. While the mortgage-backed security in SVB was only 80bn, there are enormous unrealized losses in the system and there is no realistic way to understand network dependencies."
author = "Gavin"
year_published = 2023
year_updated = 2023
