["https://terminusdb.com/blog/tech-trends-for-2023"]
title = "10 Tech Trends for 2023"
description = "As we bring down the curtain for 2022, we look ahead to the tech trends for 2023. We've listed 10 trends we think might happen next year."
full_description = "As we get close to bringing down the curtain for 2022, we thought we’d look forwards to see what tech trends we might see in 2023. Is our list simply hype, or will they be the new shiny must-haves? Here is the list of what we think will be big in 2023. Artificial intelligence is making big strides and if you’re a Twitter user, you will no doubt have a timeline full of ChatGPT. It really is the new Wordle for timeline takeovers. AI has no doubt been in many ‘look ahead’ articles for the past decade, but it never really materialized. Many companies branded themselves as AI, when really they weren’t. However, some of the advancements seen with ChatGPT alone are quite remarkable. Many are clamoring and making outlandish claims such as it will replace Stackoverflow and Google. In 5 days, ChatGPT alone had one million users. There are still a lot of question marks over use cases and the credibility of answers, however, this technology is causing a stir and will improve. Open AI is the current flavor of the month and we like that it’s open source and will no doubt attract a lot of intelligent people to contribute to the project. Other notable names in the AI space include Ready Player One’s Meta Platforms, IBM, and Amazon Web Services. Will we all be out of a job in 2023, with lots of free time to paint and write poetry? Probably not, but it’s an interesting space to watch develop. Time it took to reach 1 million users:Netflix - 3.5 yearsFacebook - 10 monthsSpotify - 5 monthsInstagram - 2.5 monthsChatGPT - 5 days WebAssembly, or Wasm for short, is a programming language for the web. It can easily run in modern browsers and the code is a low level binary format. It isn’t essentially a programming language as such, more of an assembly language that (in theory) can compile any language into a format that web browsers can understand. It is fast and efficient, easy to understand, and easy to debug. Many are saying that Wasm will replace JavaScript, and judging by the JS complaints from front end developers on Twitter, that may be a very biased conclusion driven by frustration. Interestingly, this article compares the speed of JavaScript and Wasm, and surprisingly for the more simple tasks, JS comes out quicker. It’s when things get more complex that Wasm shines."
