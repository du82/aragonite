["https://terminusdb.com/blog/knowledge-graph-data-mesh-metaverse-2"]
title = "Knowledge Graph & Data Mesh Metaverse - Number 2"
description = "The 2nd edition of Knowledge Graph & Data Mesh Metaverse features NASA, beta data product builders, why the future is big graphs and lots more"
full_description = "Hello and welcome to the second edition of Knowledge Graph & Data Mesh Metaverse. There has been a lot of interesting articles in the last month around data mesh and knowledge graphs and we’ve summarized the ones that caught our eye below. From Netflix to NASA, there’s a lot of good stuff happening in this space. As a side note, for future editions, we’re adding Web3 and NFT to our interest list, so make sure you sign up to our newsletter to stay in the know. In the meantime, here’s the latest edition… As Netflix ramp up their production capabilities via their own studio, the data associated with pitches, production and the many phases of content production is required across the business to ensure a smooth operation. This blog post from Netflix superbly details their journey to data mesh via several iterations of data movement. Xavier Gumara Rigol, who works for Adevinta, has kindly written a blog talking about his and the organization’s move to treat data as a product. It’s a great read and provides details of their logical and physical implementation as well as a domain team data product example. One exciting thing to happen in recent times is the public beta launch of TerminusX. TerminusX is a self-serve data platform to build, execute, monitor and share versioned data products (which can be done in 90 seconds). It versions both data and schema and combines the power of knowledge graphs with the simplicity of documents. If you’re interested in having a play, then sign up for the public beta. Our very own Gavin Mendel-Gleason is in the process of putting together a data mesh compendium. It’s still under construction, but nevertheless features useful insights into data mesh, from the current problems with data management to the philosophy of data mesh. Seb B, co-founder and CEO at Mesh-AI, recently posted this article on the importance of federated governance in relation to data mesh. He emphasises the need to find the right balance of decentralized data sources and central governance, and how the right approach enables massive scaling as well as many other benefits."
