["https://terminusdb.com/blog/terminusdb-11-upgrade"]
title = "TerminusDB 11 is here - you need to upgrade"
description = "We've released TerminusDB 11 and it's a big release. The storage back-end has changed and requires an upgrade. Details are here."
full_description = "We have upgraded to TerminusDB 11 – This is a very big release, and you should pay careful attention to upgrade information as the storage back-end has changed and requires an upgrade. After installing this version, you will also need to upgrade your storage directory, or the server will not start. A conversion tool is provided at https://github.com/terminusdb/terminusdb-10-to-11. This is also bundled with terminusdb-bootstrap so you can pull the latest bootstrap to upgrade. TerminusDB 11 now responds to `xsd:integer`, `xsd:decimal`, and all of the unbounded sub-types of these two objects in the document interface with strings. This is because many (even most) JSON libraries can not handle arbitrary precision integers, and few (if any) can handle arbitrary precision floats. It should still be possible to submit documents using integers or floats, but when returned they will be strings."
author = "Oliver"
year_published = 2023
