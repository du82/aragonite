["https://terminusdb.com/blog/the-terminusdb-data-mesh-made-for-changemakers"]
title = "The TerminusDB data mesh: Made for changemakers®"
description = "DFRNT® by ChangeAbility is building a platform based on TerminusX, to equip changemakers to make an impact."
full_description = "How do you drive intentional change, affecting the way people think and do, on a global scale? DFRNT® by ChangeAbility is building a platform based on TerminusX, to equip changemakers to make an impact. Their idea is to harness semantic knowledge graphs for sensemaking in initiatives, in a data mesh approach. Philippe from DFRNT is sharing about the platform they are building and their plans. The DFRNT Zebra platform (beta waiting list sign-up) is about having an easy-to-use place to capture and interconnect emerging knowledge about the direction and content of an initiative. It comes out of solving our own needs for driving change, collaborating on knowledge, modeling information, and describing cause-and-effect relationships in complex client initiatives. A data-orientated whiteboard is needed when complexity rises. The name Zebra is a wordplay on the Swedish words Se and Bra: Se translates to “see”, and Bra to “good”. To see things clearly and visualize how the dots are connected, to clarify the direction of the outcomes we seek, and importantly connect it to a burning why, through sought effects/results of the initiatives, described in your knowledge graph. Many of the large-scale initiatives we have engaged in have had similar needs: To help changemakers reason about and keep track of connected knowledge; and to change the status quo in intentional directions. The domains have shifted over time, yet the needs have been very similar. Much of the information we have had to organize includes metadata about governance structures, systems, and theories of change we collaborated on. The tools at our disposal were mostly inadequate. Integrating data to connect the dots has too often been too hard to be worthwhile. Schema reuse and a way to enable the knowledge and insights uncovered from the information modeling were a challenge. Last year we founded a grant-funded project, AIDITTO, together with a team of visionaries. It was a response to the pandemic and won multiple awards including being a winner of EUvsVirus, and we did try out a few ideas there. Additionally, as part of the initiative, we conducted research on how to build boundary objects. Systems that would allow people to collaborate broadly and share knowledge at scale. We realized that what we were looking for was a broader thing than we had initially imagined."
author = "Philippe Höij"
year_published = 2022
year_updated = 2022
