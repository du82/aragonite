["https://terminusdb.com/blog/taking-on-big-tech-monopoly"]
title = "How do companies take on the big-tech monopoly of AI?"
description = "How do companies take on the big-tech monopoly of AI & its vast data riches? This blog looks at org-wide knowledge graphs as a solution."
full_description = "ChatGPT has reached the masses and everyone is talking about it. Eyeroll (yes we see the irony about opening this blog talking about it). Even so, ChatGPT, as we know it today, will not be around forever. The initial test period will fade, and as Microsoft’s investment in the technology increases ($10 billion already!) the helpful AI assistance will most likely cost content marketers a small fee to use. The fee is reasonable considering the huge infrastructure costs to support ChatGPT and the years of research and development that have gone into it. These AI chat tools are extremely useful for individual content creators, a boost for productivity, an angle to write, and hours saved. However, what about from a company-wide perspective, how do companies leverage artificial intelligence across their internal and external communications? It’s not just OpenAI’s ChatGPT that’s taking AI into the mainstream, Google has released Bard too, or LaMDA (language model for dialogue applications). There was even a frenzy around this last year after an engineer claimed it was sentient. These huge tech giants have a big advantage over regular businesses. The key to this success is the vast amount of data they have collected and curated from the web. AI needs data and lots of it. A regular company has a great deal of data. This data is often stored in applications and databases in different locations. Accessing and using transactional and operational data is a well-documented problem for large organizations. However, there is another source of data that often gets overlooked and is just as important – content. PDFs, websites, spreadsheets, and applications all surface content to relay messages. This content has an impact on sales, customer service, and countless other quantifiable metrics. Yet this content remains siloed and machines are unable to understand or process it. For example, in a large food manufacturing business, product management produces a PDF product specification for every product. Product specifications contain everything from ingredients, allergens, cooking instructions, and packaging information. It is useful to wholesalers, distributors, marketing, sales, customer services, and customers eating the products. However, the information can not be reused programmatically. Marketing needs to copy and paste information for the website, salespeople email the PDF to customers, and these tasks are duplicated several times over during a product’s lifecycle. Not efficient."
author = "Oliver"
year_published = 2023
year_updated = 2023
