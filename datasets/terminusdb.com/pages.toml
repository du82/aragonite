["https://terminusdb.com/blog/would-you-opt-for-an-architectural-quantum"]
title = "If you could start again would you opt for an architectural quantum?"
description = "An architectural quantum is an independently deployable component with high functional cohesion. This article examines this approach to help business critical data management."
full_description = "An architectural quantum is an ‘independently deployable component with high functional cohesion, which includes all the structural elements required for the system to function properly’ according to O’Reilly. In layman’s terms, it’s something that can pretty much function independently. When you think of the day in the life of a data engineer in a company it can make you wince a little. Like a brave explorer in a dense jungle of tangled vines and hidden traps, a data engineer navigates the treacherous landscape of data pipelines and infrastructure. Armed with their tools of coding and problem-solving, they venture into the heart of complex databases, battling erratic data flows, elusive bugs, and integration mishaps. Their mission is to unravel the mysteries of data, transforming it into valuable insights. Yet, with each step forward, they encounter new challenges that test their patience and expertise. From wrestling with data inconsistencies to deciphering cryptic error messages, the data engineer’s journey is a perpetual quest for order and efficiency in a chaotic realm. Everything, everywhere, all at once. A good film, but also an explanation for something like Snowflake. Imagine having all of your data dumped. Good data, bad data, useful data, and irrelevant data all mixed up in a cocktail of confusion. Of course, you probably don’t have to imagine, it’s your working life. The majority of businesses have a relatively small number of business-critical pipelines that power ROI-associated assets like ML/AI models, financial reporting pipelines, and other production-grade data products. However, because these data products often sit downstream of a tangled mess of spaghetti SQL, the data assets which generate the most value are often completely under-served, lack data contracts, monitoring, CI/CD, alerting, and ownership. Data products that should be incrementally improved are left to rot, because the cost of refactoring the entire upstream pipeline is far too high for the upside."
author = "Oliver"
year_published = 2023
year_updated = 2023
