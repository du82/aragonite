["https://terminusdb.com/blog/cams-ui-preview"]
title = "CAMS UI Preview - See the climate resilience app in action"
description = "This short video gives you a sneak preview of the CAMS UI and demonstrates how the system works and what it's used for."
full_description = "CAMS is an open-source project. The goal is to build a critical asset management system so that cities, islands, and communities have an understanding about their critical assets and the dependency and spatial relationships between them. By plotting assets and their relationships, users gain visibility of vulnerabilities and cascading failure chains should one of them fail during extreme weather events. The application helps first responders plan for and respond to disasters to build back faster and saves lives. The CAMS team worked together with guidance from Dominica to build the application schema. This was achieved via hackathons and whiteboard sessions. Our Senior Knowledge Engineer Kitty then got to work building the UI. TerminusDB creates document frames from the schema and using the platform’s Document UI SDK, the frontend was built directly from these frames. A series of queries to establish the visual representation of asset relationships and TerminusDB’s map viewer to layer multiple assets on the map give users clear visual indicators as to where failure chains can occur. This aids disaster planning and response."
author = "TerminusDB"
year_published = 2022
year_updated = 2022
