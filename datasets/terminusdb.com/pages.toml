title = "Get TerminusDB running on your Android phone"
description = "This blog is purely intended for demonstration purposes. Android is not an officially supported platform. It is, however, fun to play around with."
full_description = "TerminusDB now supports ARM64 following a recent release, you can read why we added support for ARM64 here. Most phones run ARM64 processors. I have a curious mind, so the natural progression was for me to see if TerminusDB works on my phone. My phone is an Android device and we don’t have an Android version of TerminusDB, however, it is still possible to compile it yourself. On Android, there is a Linux environment and terminal emulator called Termux. It features the apt package manager and can be installed without having to root your device. You can find instructions on how to install Termux on their website: https://termux.dev/en/ Here you can see mine. I’ve fetched the system graph documents and this took 88ms. This is pretty speedy."
