["https://terminusdb.com/blog/data-modelling-and-collaboration"]
title = "Data Modelling & Collaboration for Change Makers"
description = "A look at DFRNT. A service built by one of our community members to help change makers with data modelling and collaboration."
full_description = "Last week saw the launch of the SaaS version of DFRNT, a tool to model and build data products. Built on top of TerminusDB, DFRNT gives digital architects the means to capture, navigate, and visualise complex graph data structures with accuracy and ease. Having used DFRNT and had the pleasure of a demo from product creator Philippe Höij, we wanted to do a quick write-up of DFRNT as we know many of our readers have a keen interest in ontologies, data modelling, and graph visualisation. DFRNT is a browser-based tool for digital architects and an advanced data/ontology modeller with graph visualisation. There is a free version, a SaaS version that includes hosting of TerminusDB graph data products, and a version for self-hosted (on localhost) TerminusDB instances. It provides access to an advanced bounded knowledge graph model which is fully type-checked, follows RDF semantics, and exposes both datalog and JSON-LD document APIs for schema, queries, and updates. The model scales from personal knowledge graphs, all the way up to enterprise data product use cases. The product has been developed to do good. To help teams collaborate. To confront global issues such as climate change, global pandemic responses, and biodiversity challenges. And to make a positive difference to societal forces like healthcare, economic equality, and racism. A tool to help build shared data structures necessary to navigate the complexities changemakers face making an impact at scale. Creating change for such huge issues is no easy task. It requires collaboration, thought, and experimentation. A place for academics, business leaders, philanthropists, and digital architects to hypothesise, visualise, share, and plan. These challenges are not predictable, but with a focus on a shared vision and expected outcomes, the chances of success are greatly enhanced. The DFRNT launch brings core tools to address graph data collaboration where complexity is high and to allow explorers to express graph data freely in the way it should be shaped."
