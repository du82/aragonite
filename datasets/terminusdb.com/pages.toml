full_description = "An open-source project for good. Helping nations, cities, and communities use local knowledge with cutting edge technology to become climate resilient. CAMS is a critical asset management system developed as part of a voluntary effort, led by ARISE-US, a private-sector advisory group to the United Nations Office for Disaster Risk Reduction (UNDRR), and TerminusDB. The project is open source and focused on providing a data-driven system to help islands, cities, and communities become disaster resilient. It does this by storing all critical asset data and the asset dependencies so a region understands not only what its critical assets are, but how one asset can impact other assets and the cascading effect of asset failures. CAMS is a data-driven mobile and desktop application. Government officials and first responders use it to plan and respond to disasters. The application is designed to work on and offline in the event of an incident where power and connectivity cannot be guaranteed. TerminusDB to help Caribbean Island become disaster-resilient with Critical Asset Management System A critical asset management system is being developed as part … In September 2017, the Island nation of Dominica was left devastated by the impacts of Hurricane Maria. Although Dominica is no stranger … We’ve made quite a bit of progress with CAMS since the project kicked off last year. You can see below a couple of videos we’ve put together showing how we build the application schema and a preview of the CAMS UI. This video documents some of the work that went into building a schema for CAMS. CAMS overview CAMS is an open-source project. … This video demonstrates the current progress with the CAMS UI. https://youtu.be/-sXjuuuvJAE CAMS overview CAMS is an open-source project. The goal is to …"
