["https://terminusdb.com/blog/database-disaster-recovery"]
title = "Database disaster recovery - How to save time in daily life"
description = "Database disaster recovery is serious. This article looks at how human error is the biggest concern and the ways TerminusDB solves this issue."
full_description = "A database disaster is an event that causes data loss or any serious disruption to applications and services. The cause of a disaster can be numerous: power failure, hardware failure, cyber-attacks, natural disasters, fire, earthquakes, vandalism, and human error. Some database server disasters cannot be prevented. That’s why a good database disaster recovery plan is important. Here are a few examples of cloud database disaster recovery solutions that provide some security following an outage: 9:25, a user adds some incorrect data. Even worse, at 9:45, a user overwrites the correct data inserted earlier with wrong data. The database recovery plan is in place, and there are two backups. One at 9:00 am and one at 10:00 am. If someone notices the errors, or applications start malfunctioning there is one option. The 10:00 am backup contains the wrong data. This is no good. If we rollback to the 9:00 am backup, we get back to the correct data, but the data added at 9:10 is lost. Let us now explore the same scenario as above, but this time using TerminusDB with its version control functionality. TerminusDB uses delta encoding, a way of storing and transmitting data in the form of deltas (differences) between sequential data rather than complete files. Deltas are stored in succinct terminusdb-store structures. TerminusDB is an immutable data store. When data is written to a store, it does not change or mutate existing data. The immutable nature means information about what was committed, at what date and time, and by whom are stored within a commit-graph. The commit-graph provides revision control functionality. It contains all the information required for time-travel, branch, squash, reset and rebase operations. With TerminusDB, all you need to worry about is the nuclear apocalypse. Human errors are no longer a concern. These TerminusDB features are a great way to save you time and ensure data loss is at a minimum. However, they also provide many other benefits for your applications, particularly when you have collaborative applications with many users. Have a read about how TerminusDB’s database version control provides the backbone of collaborative applications."
author = "Francesca"
year_published = 2022
year_updated = 2023
clearnet = "https://terminusdb.com/blog/database-disaster-recovery"
