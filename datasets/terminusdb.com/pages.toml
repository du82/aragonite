["https://terminusdb.com/blog/vector-database-and-vector-embeddings"]
title = "Building a Vector Database to Make Use of Vector Embeddings"
description = "An article describing how we built a vector database to make use of vector embeddings for semantic indexing & entity resolution using OpenAI."
full_description = "Vector databases are currently all the rage in the tech world, and it isn’t just hype. Vector search has become ever more critical due to artificial intelligence advances which make use of vector embeddings. These vector embeddings are vector representations of word embeddings, sentences, or documents that provide semantic similarity for semantically close inputs by simply looking at a distance metric between the vectors. The canonical example from word2vec in which the embedding of the word “king” was very near the resulting vector from the vectors of the words “queen”, “man”, and “woman” when arranged in the following formula: The fact that this works has always seemed amazing to me, but it works even for fairly large documents provided our embedding space is of sufficiently high dimension. With modern deep learning methods, you can get excellent embeddings of complex documents. For TerminusDB we needed a way to leverage these sorts of embeddings for the following tasks that our users have asked for: We decided to prototype using OpenAI’s embeddings, but in order to get the rest of the features we required a vector database. We needed a few unusual features, including the ability to do incremental indexing, and the ability to index the basis of commits, so we know precisely what commit an index applies to. This allows us to put indexing into our CI workflows. A vector database is a store of vectors with the ability to compare any two vectors using some metric. The metric can be a lot of different things such as Euclidean distance, Cosine similarity, Taxicab geometry, or really anything which obeys the triangle inequality rules required to define a metric space. In order to make this fast, you need to have some sort of indexing structure to quickly find candidates that are already close for comparison. Otherwise, many operations will need to compare with every single thing in the database, every time. There are many approaches to indexing vector spaces, but we went with the HNSW (Hierarchical Navigable Small World) graph. See Malkov and Yashunin. HNSW is easy to understand and provides good performance in both low and high dimensions, so is flexible. Most importantly there is a very clear open-source implementation that we found – HNSW for Rust Computer Vision."
author = "Gavin"
year_published = 2023
year_updated = 2024
