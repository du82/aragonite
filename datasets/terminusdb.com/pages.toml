["https://terminusdb.com/blog/terminusdb-v10-1-0"]
title = "TerminusDB v10.1.0 - Diff, ID Capture, Type Inference & Speed!"
description = "TerminusDB v10.1 labeled The Mule has new technical features & performance enhancements are pieces on the way to realizing our broader vision"
full_description = "We have recently released TerminusDB v10.1 which we have labeled The Mule. We have added a number of technical features, and performance enhancements, but most of these are all pieces on the way to realizing our broader vision. Our aim is to create a distributed database for knowledge graphs. One in which you can incrementally grow segments of the graph (data products) over many nodes creating individual high-quality products that are linked at the boundaries (in a manner not entirely unlike how object code linking works) and can be shared between the nodes. We want a truly distributed, multi-party, scalable knowledge graph management system. To facilitate this, we have made a number of somewhat unusual technical choices which diverge from standard database technology. We use succinct data structures to make sure our updates have a compact representation, facilitating sharing between nodes, and loading extremely large graphs into memory, which avoids thrashing (something which graphs are particularly good at). We keep metadata in a commit-graph about histories for each data product at a node and the data that has changed. We share our changes and histories by sharing these commit graphs along with the changes they refer to. We structure our units as objects (with a natural JSON representation) with links (somewhat analogous to webpages), but we store and can query everything as a graph. Distributed transactions are “slow”, and we manage them in a fashion analogous to Git, with merges and conflict resolutions as the approach. Not everything that is necessary for real industrial-scale production of the distributed knowledge graph is there yet. We still have important steps on our roadmap before this is achieved. However, we’re becoming very strong in the creation of individual domain-focused knowledge graphs. The technical improvements that have made this convenient include document diff, type inference, capture ids, document UI, and unconstrained JSON fields. In order to have the “slow” distributed transactions for structured documents, that allow us to modify graphs using rebase, cherry-pick, merge, etc, we really need to have a diff algorithm. Previously, diffs in TerminusDB were purely a result of differences in the set of triples. This was awkward from the point of view of object identity, which is more commonly how people think about their data."
author = "Gavin"
year_published = 2022
year_updated = 2023
