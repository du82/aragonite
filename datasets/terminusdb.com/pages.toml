["https://terminusdb.com/blog/version-control-for-data-science-and-machine-learning"]
title = "Version control for data science and machine learning"
description = "This article talks version control for data science and machine learning & was written after speaking with our DevRel Lead Cheuk Ting Ho."
full_description = "This article looks at version control for data science and machine learning and has been written following an interview with our DevRel Lead and ex-data scientist Cheuk Ting Ho. During a TerminusDB discovery session, Cheuk mentioned versioned machine learning and it piqued my interest so I decided to pick her considerable brain to find out more. This is what I learned. Before working in Developer Relations, Cheuk was a data scientist with experience in the finance, AI, publishing, and e-commerce sectors. The roles demanded high numerical and programmatical skills, especially in Python. Having been introduced to TerminusDB via a meet-up, Cheuk changed direction to embrace her passion for the tech community and became our DevRel Lead, maintaining the TerminusDB Python client and engaging with TerminusDB’s user community. Away from work, Cheuk enjoys talking about Python on Twitch and via podcasts. Cheuk is a regular speaker at Universities and conferences and also organizes events for developers, including EuroPython, of which she is a board member, PyData Global, and Pyjamas Conf. Cheuk organizes workshops and mentored sprints for minority groups, believing in tech diversity and inclusion. In 2021, Cheuk has become a Python Software Foundation fellow. Version control for data science and machine learning takes the best bits of Git and applies them to the database and procedures data scientists undertake to implement machine learning. Git is a distributed version control system for source code where you can branch, clone, and merge to collaboratively develop software with control and safety. TerminusDB is an open-source document graph database. The schema language enables documents and their relationships to be specified using a simple JSON syntax. It combines the ease of working with JSON documents, with the powerful query capabilities of graph databases, and structure using schema. It is also designed as a distributed database with a collaboration model, namely version control."
author = "Oliver"
year_published = 2020
