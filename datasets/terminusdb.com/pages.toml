["https://terminusdb.com/blog/terminusdb-from-the-command-line-introducing-tdb-cli"]
title = "TerminusDB from the Command Line: introducing tdb-cli - TerminusDB"
description = "by Gavin and Guest Author Matthijs van Otterdijk This blog introduces our new command line tool for interacting with TerminusDB, whether it be local or remote. The aim, eventually, is to enable an easy to use command line client to carry out any of the operations that are possible with TerminusDB, allowing fast interactive development […]"
full_description = "This blog introduces our new command line tool for interacting with TerminusDB, whether it be local or remote. The aim, eventually, is to enable an easy to use command line client to carry out any of the operations that are possible with TerminusDB, allowing fast interactive development for those just getting started, for tool chains which include other tools, or for experts that just want a quick one-liner rather than a script to perform some operation. The tool (written by Matthijs) is written in TypeScript. We wanted to e a bit more structured in our development than javascript gives you, and we enjoyed the assistance that can be provided in interactive development by the type checker. This will get a new version of TerminusDB and launch it with the name terminusdb`. Note, that it will create a storage directory called storage` in the directory in which you currently reside! This will be here your databases are kept (in case you want to start another TerminusDB later with the same data). To get started with `tdb-cli`, we first have to install it! Assuming you have npm installed, this is simply: If you’re starting with a new TerminusDB installation, you’ll want to fill in the questionnaire roughly as follows. Alter to suit your environment! Note: If this is a new installation, you’ll want to use the password `root` since this is what TerminusDB comes with as a default admin password out of the box. This defines a `Person` class, in which each `Person` has a name. The ids of the objects are constructed with a lexical naming scheme based on their name (the {“@type”: “Lexical”, “@fields”: “name”]} part), which makes remembering the ID of a document easier, and bars the creation of duplicates. Here the `-f` flag tells us we are wiping out the entire schema to replace with the data we are currently inserting (it’s like a delete/insert). The `-g` says that we are altering the schema, rather than the instance graph (where normal data resides). This adds a number of people to the database. Note the use of `-d`, which specifies the data on the command line as a JSON string, rather than taking it from standard input. You could instead take it from standard in as follows:"
