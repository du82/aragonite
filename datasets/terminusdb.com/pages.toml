["https://terminusdb.com/blog/9-reasons-why-you-need-an-immutable-database"]
title = "9 reasons why you need an immutable database - TerminusDB"
description = "An immutable database means the data within it cannot be deleted or modified. This article explains the reasons why immutability is crucial."
full_description = "An immutable database means the data within it cannot be deleted or modified. There are numerous reasons why an immutable database is beneficial for you and this article explains some of those arguments. Martin Kleppmann, who is a serial entrepreneur and self-described database rebel, says a database should be, “an always-growing collection of immutable facts,” and thinks the only reason databases still have the mutable state is inertia*. He has a good point as your data is your worldview and history (be it transactions, people, services, or systems) and if that history changes the perception of the world becomes warped. We want the data we use to make decisions and run applications to be facts, only then will we be able to deliver value. Humans and machines interact with databases and are both capable of corrupting data, slowing performance, or causing downtime. Processes can overwrite data, improper patches can wreak havoc, and those fallible humans are capable of the odd error. Then there are malicious attacks that deliberately destroy data, it’s a cruel world. An immutable database means you can recover faster to a previous state. All of your data is there, so it’s a case of using the database tools to revert to a happier and more stable database. As an example, our CTO Gavin, many years ago had spammers use an SQL injection to cause a disaster to his WordPress website. He had to spend over four hours cleaning the SQL database by hand. Now imagine if this was a massive enterprise database, we could be talking weeks to sort through the data and get the database stable again. Who doesn’t love auditing? Why’s it all gone silent? Okay, auditing and regulatory reporting can be a nightmare and can cost large firms hundreds of thousands of dollars a year. An immutable database is beneficial for this type of task as the history of yesterday and beyond is right there in the data. The previous state of the database as it actually was for a period of time can be easily retrieved by traveling back in time and surfacing it for reporting. Compare this to how a mutable database, with ad hoc version tracking of rows, would think was actually there, and you can see where that world can warp and cause problems."
author = "Oliver"
year_published = 2022
year_updated = 2023
