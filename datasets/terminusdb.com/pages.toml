["https://terminusdb.com/blog/author/philippe"]
title = "TerminusDB - Made for developers who see the value of data"
description = "Git-for-data - branch & merge, access & pull requests, all in the data layer. TerminusDB helps devs make data the star of their builds"
full_description = "Find out about our AI consulting firm VectorLink. We combine our data engineering experience with VectorLink, a vector database and vector embedding suite to help businesses better utilize LLMs with their data. We specialize in entity resolution, semantic search, AI classification, RAG, and KYC solutions. Visit vectorlink.ai for more information. TerminusDB is built to provide developers with a suite of tools to solve complex problems and develop innovative applications and services. The key features that enable collaborative, relationship-aware, and data-focused applications include – Branch, clone, merge, just like in Git, but with data. Work in parallel branches, see complete audit logs and document histories. Git-like collaboration for data and content. We have the lowest memory overhead around. We use succinct data structures and delta encoding to keep things small, just 13.57 bytes per triple. We can scale to any size, with the only limitation being the memory available. Graph relationships, metadata, and version control, coupled with VectorLink, the TerminusDB semantic indexer, provide the backbone to use AI with your data and in your applications. Pull request workflows are built into the data layer to keep a human in the loop to ensure changes are correct. JSON documents are connected in a knowledge graph providing relationship-focused data products with greater query power. Data and content is stored as human and machine readable JSON documents - the structured format for the web. The schema is based on a simple JSON syntax. Build it with a UI or in code. Schema migration tools help to evolve your applications over time. Take a look at how to install TerminusDB by visiting the GitHub repository. Don’t forget to join the Discord channel to chat with fellow Terminators."
