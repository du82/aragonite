["https://terminusdb.com/blog/ai-entity-resolution"]
title = "AI Entity Resolution: Bridging Records Across Human Languages - TerminusDB"
description = "Nearly everyone is familiar with having the same person twice in their phone contacts list. Somehow you get a record of Joe Bloggs with just his e-mail, and likewise one with just his phone number. Wouldn’t it be nice if there were some way to decide if two records were the same record? Or at […]"
full_description = "Nearly everyone is familiar with having the same person twice in their phone contacts list. Somehow you get a record of Joe Bloggs with just his e-mail, and likewise one with just his phone number. Wouldn’t it be nice if there were some way to decide if two records were the same record? Or at the very least that they were close. Entity resolution (also sometimes called record linkage, data matching and data linkage), is the process by which we take two records and decided whether they should be the same record. The problem is by no means new. Algorithms for entity resolution have been in place since the 1960s. But the ubiquity of LLMs (Large Language Models) has made it possible to solve the problem with AI. And the AI solution has some huge advantages. Rather than defining a large number of rules which help to normalize fields for comparison (Turning Mr. into Mister, St. Into Street, etc.) and then subsequently using some sort of distance measure (such as Levinshtein) to overcome spelling mistakes or variations and the like, and then finally assembling many pieces of data into some aggregate using statistical models, we can take a short-cut. We can leverage the full power of LLMs to provide us with a semantically meaningful embedding in a high-dimensional vector space in which to make our comparison. This approach both increases performance of matches, reduces programmer tuning for record structure and makes it easy to perform incremental updates to the database. This last bit is very hard for many matching strategies which scale poorly as new records are added. And amazingly, as an added magic benefit AI along the way, we also get language agnosticism for free! We can actually compare records in German and English for instance, and get candidates for merger automatically. First install a TerminusDB server according to the directions here for running TerminusDB in a docker compose setup. For this tutorial you need to set up your docker-compose to use an insecure setup, so we can fire off the indexer manually. For production you should keep these actions inside of the docker with some middle ware. Change your docker-compose.yml to include this ports section for VectorLink:"
