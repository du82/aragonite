["https://terminusdb.com/blog/graph-database-performance-benchmark"]
title = "TerminusDB vs Neo4j - Graph Database Performance Benchmark"
description = "Dive into a graph database performance benchmark: TerminusDB vs Neo4j with Wikidata. Insights on execution, accuracy, & completeness."
full_description = "At TerminusDB, we’re committed to pushing the boundaries of graph database performance, and what better way to showcase this commitment than by pitting ourselves against a titan like Neo4j? Our latest venture takes us into the heart of benchmarking, where we’ve harnessed the immense potential of the Wikidata dataset to compare TerminusDB and Neo4j. The benchmark uses ‘WDBench: A Wikidata Graph Query Benchmark’ that features real-world queries extracted from the public query logs of the Wikidata SPARQL endpoint, enabling us to scrutinize graph databases under real-world scenarios. Armed with the benchmark, we’ve meticulously dissected query execution times, scrutinized result accuracy, and evaluated overall completeness on both platforms. This blog presents a head-to-head comparison of TerminusDB and Neo4j across a spectrum of query scenarios. We will follow it up with a technical blog with an in-depth exploration of graph database benchmarking, delving into graph query optimization, index utilization, and data retrieval techniques. We record query times, query results, and disk space usage within our TerminusDB versus Neo4j comparison. The benchmark ran 868 successful queries (278 for singles and 590 for path queries) on the Wikidata dataset with both databases. Any query that took over 60 seconds was timed out. We ran the benchmarks using Neo4j 4.4.23 on an AWS machine r6g.16xlarge running Ubuntu 22.04.2 LTS. We used the same machine for the TerminusDB tests. As you can see, TerminusDB is a much more compact database compared to Neo4j, 81% smaller. Incredibly, TerminusDB is also smaller than MongoDB even though it is indexed and provides better search with easy relationships and joins. Across 278 single-hop graph queries, TerminusDB is 64% faster than Neo4j, clocking in at just over a second at 1,254 ms. The chart shows Neo4j queries from fastest to slowest and compares TerminusDB speeds for the same queries. Overall, the chart highlights the performance benefits enjoyed by TerminusDB. For legibility, we’ve cropped the results at 30,000 ms."
author = "Oliver"
year_published = 2023
year_updated = 2023
clearnet = "https://terminusdb.com/blog/graph-database-performance-benchmark"
tags = ["across", "average", "benchmark", "conclusion", "contact", "database", "disk", "graph", "neo4j", "performance"]
