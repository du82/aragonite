["https://terminusdb.com/blog/oauth2-configuration-for-sso"]
title = "OAuth2 Configuration for TerminusDB to allow for SSO"
description = "TerminusCMS is a cloud self-service headless content management system designed for complex environments. Semantically connect data and content into an organization-wide knowledge graph."
full_description = "TerminusDB supports different authentication mechanisms. It can authenticate using HTTPS Basic, but also JWT or OAuth2 using a user forward header. The advantage of authenticating through OAuth2 is that it is easy to configure an external authentication service to be used to authenticate users in TerminusDB. In this tutorial, we will configure TerminusDB to use GitHub as an external authentication service using oauth2-proxy. 7. And finally, generate a new secret by clicking “Generate a new client secret”. Be sure to save it somewhere safe! We use oauth2-proxy to handle the authentication for us. TerminusDB will accept a header coming from oauth2-proxy to know that a user has authenticated. Run the following cURL command while Docker is running to add a user with admin privileges (and make sure you replace YOUR_GITHUB_USER with your GitHub user name): If you visit http://internal.company.local:4180 you should see a login screen. Once logged in, it will give you access to the TerminusDB API from the browser with a session cookie. Try to visit http://internal.company.local:4180/api/ to see your available databases. If you browse without authentication on http://localhost:6363/api/ you will see that it won’t list the newly created database. ALWAYS make sure to protect terminusdb-server if you use the insecure user forward header. This is only meant to be used when you can guarantee that TerminusDB will only be accessible by a proxy that secures access to the database server. Make sure to wipe out the insecure user header from incoming requests and change cookie-secure in the oauth2-proxy command to be true. In the docker-compose.yml example, the 6363 port is opened for convenience sake, to quickly allow you to make the user and database with a cURL command. However, in production the server should be entirely closed off. Furthermore, you should set up proper HTTPS domains for your users."
