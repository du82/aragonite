["https://terminusdb.com/blog/database-collaboration-keep-humans-in-the-loop"]
title = "Database Collaboration to Keep Humans in the Loop"
description = "We've updated TerminusCMS. The new database collaboration features offer great ways to keep humans in the loop of change for accuracy."
full_description = "Database collaboration has always been one of TerminusDB’s fundamental principles. To provide git-like collaboration tools at the data layer so devs working on the backend can take advantage of source control, audited builds, and collaborative working. Keeping the human in the loop is ever more important as automation and AI gain momentum. We’re pleased to let you know that we have enhanced these data collaboration features to provide developers and end-users with more flexibility when developing and using applications with TerminusCMS. When we released TerminusCMS we added change requests, or as some of you may know them from Git, pull requests. When a user makes changes to data, TerminusCMS prompts the user to create a change request – A new change request creates a branch of the database. It’s like a database transaction that can stay open for a long time and associates a state that individuals and microservices can use to modify the change request branch. In a branch, users and programs can make changes to content and data, this could be using the API, the TerminusCMS document UI, or via a domain-focused front end. Every commit is stored in TerminusCMS’s commit-graph. This details what has changed, when it changed, and who made the changes. Take a look at our documentation for a better understanding of how the various graphs work in TerminusCMS. When all is complete, the change request is reviewed. In some instances, main may have moved on while the changes in the branch were being made. TerminusCMS can fetch and merge these updates into the change request branch and flag conflicts to be fixed. The CI/CD approach to data management described above is ideal to manage data and content changes for one focus area, but when a headless platform covers multiple teams and domains, then an extra layer of moderation and review is needed. The additional layer of review and moderation is handled once again by branches. Rather than create a new change request, a user would first create a new branch and then use the change request workflows within that branch. Effectively, it is adding another level of workflow to your applications. This process can be repeated, so a user could create a branch of a branch and so on."
author = "Oliver"
year_published = 2023
year_updated = 2023
clearnet = "https://terminusdb.com/blog/database-collaboration-keep-humans-in-the-loop"
