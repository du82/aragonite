["https://terminusdb.com/blog/uri-generation"]
title = "What's in a name: URI generation and unique names for objects"
description = "Naming things is hard! We've encountered many difficulties trying to create URIs in RDF. This article looks at URI naming strategies."
full_description = "In TerminusDB we have both an automatic and manual means of describing the reference of a document in our graph. We have tried to make these as simple as possible to work with, based on our experience of the difficulties encountered trying to create URIs in RDF. We’re going to look at various identifier generation strategies, including manual, lexical, hash, random, and value hash. But to see why we introduced these choices and strategies, it’s useful to think a bit about ID references from first principles. One of the really interesting ideas to come out of the Semantic Web was the idea of using unique universal identifiers on a similar model to the URL. The Web forms a vasty interconnected graph, with edges specified by these URLs. What does URI stand for – a URI is subtly different. Its is a Universal Resource Indicator as opposed to a Universal Resource Locator. The distinction revolves around whether they should resolve to the resource that they indicate. A URI could be a URL but it need not be. A URI could stand-in for any sort of resource, physical or logical which we need to have a name for. It is, in a sense simply a name that we want to be universal. A good example of a URL that is also a URI, is the HTTPS syntax for DOI (Digital Object Identifiers) which specify a specific scientific paper. For instance, we can talk about the Quantum Tomography paper Measured measurement with the DOI https://doi.org/10.1038/nphys1170, but if you go to that address it will forward you to the actual resource. Another example where we might double up the meaning might be if we used the URL https://en.wikipedia.org/wiki/Albert_Einstein to refer to the person Albert Einstein in our database, but which will resolve automatically to an article on Wikipedia. However, these URIs (or IRIs, for Internationalized Resource Indicator, if we are being international) do not have to know how to resolve to the objects they describe, even if it can be handy for them to do so. If data is to move around, records will have to be in different states in different places, so resolving an object to exactly what data is associated with it, is not possible to do in all cases."
author = "Gavin"
year_published = 2022
year_updated = 2023
clearnet = "https://terminusdb.com/blog/uri-generation"
