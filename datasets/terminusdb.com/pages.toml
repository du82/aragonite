["https://terminusdb.com/blog/knowledge-graph-data-mesh-metaverse-11"]
title = "Knowledge Graph & Data Mesh Metaverse 11"
description = "Issue 11 of Knowledge Graph & Data Mesh Metaverse looks at data mesh fitness tests, visual graph builders, and gets technical."
full_description = "In old English, endleofan means one left as in one left over ten, which brings us, rather ineloquently, to issue 11 of Knowledge Graph & Data Mesh Metaverse. In it, we share interesting articles about this world. We share a lot of content via our Discord channels, so we thought we’d share the love and provide a regular update on what’s been floating our boats. This article from Benn Stancil is neither data mesh nor knowledge graph, but is great all the same. He asks the question of whether data will have its day of reckoning as more businesses realize that they can never be Google or Facebook due to their data limitations. Rather than looking at Google for inspiration, should smaller companies be more realistic with their data-harnessing aspirations? Our CTO, Gavin, has written this three-part blog looking at how TerminusDB works from a technical perspective and explains many of the technical decisions that led us to build an in-memory, immutable document graph database. TerminusDB Internals part 1 talks about making it smaller, faster, and stronger and why we chose graph databases to spare the use of memory. Part 2 looks at making the immutable, mutable, and how our methods are similar to multi-version concurrency control. In the final part, Gavin explains how we deal with data layout, search, and compression. This is a nice article looking at how knowledge graphs and web scraping can be used together to help build training data where there isn’t enough to derive meaning from machine learning. Data Mesh pioneers, Thoughtworks, have written this article to provide some ‘lessons learned’ to those thinking of embarking on a data mesh journey. Interestingly, and unsurprisingly, many of the lessons are people-based rather than technology. We included an Eric Broda story in Metaverse 10, he’s followed it up with this article providing some guidance to building a roadmap to get the many teams that will be involved aligned. It also features some links to further reading along the same subject."
