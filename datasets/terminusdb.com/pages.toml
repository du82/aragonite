["https://terminusdb.com/blog/knowledge-graph-schema-design"]
title = "Knowledge Graph Schema Design Patterns and Principles"
description = "Graph schema design is very important but unfortunately, there isn't a lot of guidance, this article aims to provide some assistance."
full_description = "Graphs are extremely expressive, which actually can be a bit of a problem if we create them without a well-defined schema. The schema helps to constrain the sorts of links, acts as documentation, providing both human and machine-readable semantics, and ensures that software gets things shaped the way they are expected. While good schema design is very important for relational databases, it’s perhaps even more important and central for knowledge graphs. Unfortunately, there isn’t a lot of guidance out there on how to do relatively mundane tasks. I’d like to provide at least a bit of assistance based on my experience. We’re going to take a look at schema design patterns and principles using TerminusCMS, although many of these ideas can be used elsewhere. Atoms of data in TerminusDB are represented by fields with a data type. This could be a string, or an integer, or a date. These are in turn, woven into a molecule of data, known as a document. This person carries a name and a date of birth. In fact, it is, as written, very close to a row record in an RDBMS or a CSV file. Now we can list also add links to friends of the person in question. This is the sort of data structure you might use for a social network, or even perhaps a Rolodex-type application. This is the simplest sort of modeling that we can do – where you have a number of data properties, and a number of links to other documents, all bundled conveniently in your document. However, sometimes you want to have an internal structure in your document, that is not just an atom of data, but is intrinsically related to this specific object, and not simply a link to another object. The most common variety of this type of object is data which is somehow annotated with additional structure. For instance, we might want to have a data point that is time scoped, has a specific source, or perhaps has a unit. It doesn’t make sense for this value to just float around by itself, but it might be useful in the context of a specific object, for instance, the height of a person."
author = "Gavin"
year_published = 2023
year_updated = 2023
