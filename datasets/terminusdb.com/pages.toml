["https://terminusdb.com/blog/terminusdb-a-headless-cms"]
title = "TerminusDB - A headless CMS?"
description = "Content infrastructure for the connected world. Find out about our plans to build the de facto headless CMS for complex content environments"
full_description = "TerminusDB a headless CMS? That’s correct, you read it right. Having listened to our community over the past few years, it became clear that many of the TerminusDB applications built by our users crossed into headless CMS territory. Are we a WordPress or Drupal alternative? Certainly not. They serve a purpose for brochure websites, but not what we’re focused on. We have grown to understand that what many organizations are looking for is content management for complex environments – content infrastructure. Think knowledge bases for academics, inventory management for manufacturing, supply chain logistics, and research and development for pharmaceutical organizations. These examples all require the curation of content and data in complex and connected environments. This is where TerminusDB, the headless CMS comes into play. It is what we’ve been working on for the past couple of months to update some of TerminusDB’s native features so they fit nicely into the headless CMS world. Content infrastructure for the connected world. Back-office, front-of-house, applications, dashboards, all powered by data and curated content from across the organization. It is often with a great deal of pain that a developer gets involved in CMS projects. Whether it’s the endless plugin architectures or inflexible programming choices, CMS projects tend to be an unsatisfying experience. We want TerminusDB to be code-first and dev friendly to give devs all of the tools they need to build content infrastructure quickly so you can hand it over to users to look after themselves. TerminusDB will still come with all of the features you’d expect like git-like collaboration, but you’ll have more tools to build brilliant applications, headless content management systems, and more. Does management want a new dashboard that they won’t look at in 12 months? No problem, model and built it fast with TerminusDB. It’s flexible, scalable, and extendable. Making it easier for devs and more agile for business."
author = "Oliver"
