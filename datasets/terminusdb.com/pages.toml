["https://terminusdb.com/blog/blank-nodes-in-rdf"]
title = "Getting around the issue of blank nodes in RDF - TerminusDB"
description = "This is an accidental blog from community member Somethingelseentirely about getting around the issues of blank nodes in RDF."
full_description = "This article focuses on getting around the issue of blank nodes in RDF. It is an accidental blog and is the work of TerminusDB Discord community member Somethingelseentirely. For context, we’ll tell you how this article came about. If you want to jump to the main content, click here. It all started with this innocuous question from @Speller Somethingelseentirely: So no “true” blank nodes in terminus internally? That would be/is super awesome :D!The amount of discussions I had with ontologists and logicians alike, it’s odd that we haven’t seen half a dozen “blank nodes are RDFs 1million dollar mistake” blog posts*😄 Gavin: Haha, I totally concur @somethingelseentirely !Since I first started using RDF I’ve taken the view that they need to be immediately skolemizedI’ve run into so much awkwardness from them. It was a very bad idea. Somethingelseentirely: Yeah! The whole idea of “we’ll just solve graph isomorphism on the fly over and over again” is really insane 😂 This is when another community member commented about the topic of skolemization and the fact that there is so much to learn. It’s best not to bother with blank nodes if you can. Of course, there are cases where you need to ingest data that contains them, RDF Turtle for example uses them automatically whenever you use anonymous objects with the [ ] syntax (relatively obvious). Or whenever you create a collection like an rdf:List with the ( ) syntax (definitely a lot less obvious). Since RDF collections are essentially linked lists, with additional constraints (e.g. set semantics) you get a blank node for every list node. If possible I simply forego the whole process of skolemization and use UUIDs directly, which can be embedded into the URI namespace like this urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6 as per https://datatracker.ietf.org/doc/html/rfc4122 . TerminusDB makes this a lot easier with the latest release and provides capabilities to automatically derive subject/entity IDs based on either UUIDs, human-readable auto-incrementing values, or a content-aware hash."
author = "Somethingelseentirely"
year_published = 2022
year_updated = 2023
