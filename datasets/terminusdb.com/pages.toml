["https://terminusdb.com/blog/arm64-support"]
title = "ARM64 support and why we introduced it - TerminusDB"
description = "In this blog, our infrastructure expert, Robin, explains why we introduced ARM64 support for TerminusDB and how it helps Mac users."
full_description = "In our early years, ARM64 was still mostly limited to the SoCs found on smartphones and single-board computers. They were not the intended target devices of TerminusDB, as we expected most users to run a database on servers instead. Developers at the time had mostly dedicated AMD64 devices running. We also did not want users of single-board computers to get a bad impression of the database, simply because their hardware was not up to the task. The M1 ARM64 processors were still limited in use. A lot of software still had to be updated to provide decent support for them. We also believed the AMD64 emulation of the M1 was performant, which is why we did not consider the need to implement native support at the time. Suddenly we found ourselves in a different situation. The M1 MacBooks became more popular. Even so popular that some of our developers got them as well! Things ran relatively smoothly for a while. Of course, it was a bit slower than the native architectures but nothing terrible. We convinced ourselves that even though it was slightly slower than the native architectures, the developer experience was not bad enough to warrant implementing ARM64 support. However, this changed with the development of TerminusDB as a headless CMS and the ingestion of large datasets. To showcase the ability of TerminusDB as a CMS, we made a Lego demo. It displays all the Lego sets, their parts, and their respective themes. Previously, our developers on Macs developed with relatively small datasets in which the performance penalties were not noticeable. Now they had to run a very large dataset. My own computer ran this ingest in 15 minutes. Our Mac developers had to wait almost half a day to get this far! This was unacceptable. Not only was the ingestion speed slow, but the query speed was too. The reason why AMD64 Docker containers on macOS are so slow is that Docker itself already runs in a VM on macOS. This is not slow by definition as macOS has good virtualization support. However, when running an AMD64 container on an ARM64 machine, it will run it using QEMU inside the Linux virtual machine! Which of course, is slow."
author = "Robin"
year_published = 2022
year_updated = 2023
