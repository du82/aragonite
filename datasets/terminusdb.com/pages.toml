["https://terminusdb.com/blog/the-power-of-web-object-query-language"]
title = "The Power of Web Object Query Language"
description = "WOQL is a powerful and sophisticated query language that allows you to concisely express complex patterns over arbitrary data structures"
full_description = "WOQL is a powerful and sophisticated query language which allows you to concisely express complex patterns over arbitrary data structures. What makes it so expressive and easy to use is the radical simplicity of the core underlying concepts. To unleash the power of web object query language, you just need to understand two very simple things. In Terminus DB every single fragment of information is universally stored and accessible as triples. Triples are the universal and fundamental atom of information in Terminus DB—objects, documents and everything else is stored as collections of triples, and it is always possible to break any object down in a reliable and deterministic way into a precise set of triples. TerminusDB also adheres to the RDF standard, which means all triples have a regular structure, interpretation and strong norms. From a query writer point of view, this regularity is very helpful; you don’t have to care about the low-level structure of the data (what table it is stored in, how many columns it contains, etc.), you just have to care about the patterns of meaning you are interested in. A triple is just a data structure with three slots to which we can assign values. Each row in the table below shows a different view of what each of the three slots means. Every triple with the same ID is interpreted as being about the same thing. So if we add triples with different properties to our database which have the same IDs, they will be interpreted as representing different properties of the same thing. That’s how we build up information about things—just add properties to the appropriate record ID. The magic of triples is that the Value of a triple can be another record ID (as in the joe mother Mary example), and IDs can appear in either the first or the third slot of the triple. The second fundamental concept behind web object query language is unification. This is an old computer science concept that has been polished and refined for 60 years and is defined in obscure mathematical jargon, but it is remarkably simple and intuitive to understand by example."
author = "Gavin"
year_published = 2020
year_updated = 2022
clearnet = "https://terminusdb.com/blog/the-power-of-web-object-query-language"
