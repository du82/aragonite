["https://terminusdb.com/blog/knowledge-graph-data-mesh-metaverse-9"]
title = "Knowledge Graph & Data Mesh Metaverse 9"
description = "Welcome to the knowledge graph and data mesh metaverse, Issue 9 covers succinct data structures, identity graphs, and lots more."
full_description = "Hello and welcome to the ninth edition of Knowledge Graph & Data Mesh Metaverse which shares interesting articles about this world. We share a lot of content via our Discord channels, so we thought we’d share the love and provide a regular update on what’s been floating our boats. Borja Vazquez has written this excellent article about data lineage, using Google Maps as a way to understand a better way to handle data lineage with a little graph theory. It looks at the issues facing modern enterprises and takes a balanced view of how to approach them with layers. Ben Langmead, Associate Professor of Computer Science at Johns Hopkins University, has a fantastic YouTube channel for those looking to understand succinct data structures. The channel has a wealth of well-delivered and well-thought-out videos. Chinese firm NebulaGraph has recently closed in on Series A funding and is seeing growth in demand from manufacturing organizations turning to knowledge graphs to better understand their supply chains. This article from TechCrunch examines China’s use of knowledge graphs. Discussing identity graphs, this article is about how graph database technology can piece together customer interactions and behaviors from different devices to obtain a richer understanding. Mathematician and management consultant, Neil Raden, wrote this article talking about the importance of an active metadata strategy when embarking on a data mesh and data fabric journey. This Medium blog looks at Kassy Raymond’s, a Fellow at the Datasphere Initiative, work with the Global Burden of Animal Diseases to map livestock populations. The article talks about the process of using graph databases to analyze the data standards of different datasets to establish meaning and connectedness. Microsoft’s Piethein Strengholt wrote a blog post looking at different architecture design patterns and the considerations for choosing each. This Forbes article by Workday CTO Jim Stratton provides a clear-eyed look at the problems enterprises face. With a simplicity-first approach, Jim is explicit that it is not easy to achieve but talks about the steps to help deliver value from your data."
