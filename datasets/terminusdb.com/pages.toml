["https://terminusdb.com/blog/terminusdb-internals"]
title = "TerminusDB Internals - Part 1: Smaller, Faster, Stronger"
description = "Part 1 of TerminusDB Internals, looks at the guts and how we've built an in-memory graph database to avoid thrashing and slow performance."
full_description = "When we were designing TerminusDB we wanted to make a graph database which would allow curation of large complex graphs where the search mode (we’ll talk a bit about modes in a minute) was not yet known. In playing with some large graphs (for instance a database of all Polish companies since the mid 1990s) we came to the following conclusion: Point two is especially hard to overcome. If you start paging in a graph, because of the very random nature of graphs, we can get extremely varied pages. This could easily lead to thrashing. Since disk access times on fast SSD are one to two orders of magnitude slower than DRAM we’re talking perhaps 100 times worse performance. For networks this climbs to three orders of magnitude. These considerations let us to speculate that we could build an in-memory graph database if we were careful to ensure that we were sparing with memory use. In addition to this in-memory advantage, having low memory overhead has additional benefits for collaboration, in that we can send deltas around in a compact format. It’s important to note, that by in-memory we mean that there is no database paging, we do not move parts of the database into and out of memory. It does not mean that we are not writing to disk. TerminusDB is both ACID and persistent, so there is no risk of data loss for completed transactions. In typical databases, we ask questions of relations. Relations are typically built from tables of facts together with some operations which allow us to join relations. In addition we often specify particular projections of these relations by asking for certain constraints to hold. Create a new relation by joining two relations, Customers and Orders on the customer ID field and project to a relation in which all dates are more recent than 2010-04-01 using the WHERE restriction. In order to make these queries efficient we will often introduce indexing on the fields which we want to join or restrict. If we do not do this, then we might have to scan through each CustomerID in the one table to see if it is in the second table. A scan means we look at each record. If the size of Customers is n ( |Customers| =n ) and Orders is m ( |Orders| = m ), then this would result in a number of operations on the order of n*m . Similarly, if we have not indexed the date field, we will have to compare the date for each record that we produce."
author = "Gavin"
year_published = 2022
year_updated = 2023
