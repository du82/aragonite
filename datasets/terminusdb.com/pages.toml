["https://terminusdb.com/blog/knowledge-graph-data-mesh-metaverse-7"]
title = "Knowledge Graph & Data Mesh Metaverse 7"
description = "Welcome to the knowledge graph and data mesh metaverse where we share interesting stories about these subjects. This is issue number 7"
full_description = "Hello and welcome to the seventh edition of Knowledge Graph & Data Mesh Metaverse which shares interesting articles about this world. We share a lot of content via our Discord channels so thought we’d share the love and provide a regular update as to what’s been floating our boats. Capgemini’s Steve Jones wrote this article on his Medium blog looking at why Graphs are the future heart of data. Starting from an SQL perspective, the article looks at purpose vs relationships and finishes looking at data mesh and the role graphs will play here.. Our community member, Donny Winston, wrote this excellent blog comparing ontology to relational data models and how the rule of least power can mitigate risks. This is one of our blogs and it is from a conversation on our community Discord channel. Our member, Somethingelseentirely write this excellent piece about getting around the issue of blank nodes in RDF. Blank nodes have long been an underrecognized problem in RDF with practitioners apparently comfortable with solving graph isomorphism on the fly over and over again. Google’s Luis Velasco talks about the importance of data consumption from domain and central IT perspectives and focuses on how data mesh is one solution to the diverging needs of the two groups. The article doesn’t go into too much detail about data mesh, instead focusing on presenting an ‘opinionated’ technology architecture that implements polyglot data patterns running in Google Cloud using as many open source components as possible. This video gives you an idea for how to implement a data mesh architecture and provides some of the pitfalls for you to learn from and avoid. Dutch banking giant, ABN AMRO, started on their decentralized data journey before data mesh was even a thing, this presentation from senior architect, Rakesh Singh, covers the four-year journey. Prominent data mesh expert, Thoughtworks, has written this four-part guide to lay out what it takes to successfully apply the principles of Data Mesh in a large corporate environment. Drawing from a number of implementations, the articles go over everything from people, processes, and technology to impart some of their experiences to those look to embark on a data mesh project."
