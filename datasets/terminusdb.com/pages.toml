["https://terminusdb.com/blog/10-1-8-terminusdb-with-graphql"]
title = "GraphQL is here, use any programming ... - TerminusDB"
description = "TerminusDB 10.1.8 has been released which means TerminusDB now comes with GraphQL to improve the developer experience."
full_description = "TerminusDB 10.1.8 has been released which means TerminusDB now comes with GraphQL to improve the developer experience. Your data product schemas are automatically loaded in GraphQL for speed and convenience. GraphQL means you can now use any programming language to work with TerminusDB. Take a look at the GraphQL docs to familiarize yourself with it or install the latest version to experiment and play. Excitingly, this release is a big step toward our TerminusDB becoming a headless CMS and connecting content in a knowledge graph. You can read more about our headless CMS here. TerminusDB automatically generates fields in GraphQL based on classes and their properties in the data product schema. Here you can use arguments such as id, offset, limit, and order by, as well as filters such as time comparisons and for strings, and, or, not. All the filter options are also automatically generated for you. We’re not stopping here though, we are working to integrate WOQL into GraphQL so that you can use GraphQL for complex path queries to make building graph-based applications even easier."
