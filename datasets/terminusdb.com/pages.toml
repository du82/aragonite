["https://terminusdb.com/blog/graph-back-link-queries"]
title = "Graph Back Link Queries"
description = "Graph back link queries help understand business complexities such as the supply chain. Construct GraphQL back link queries using GraphQL."
full_description = "Graph back link queries find the objects pointing at a particular object. They are helpful to explore, often complex, relationships. For instance, think the product, component, supplier relationships in a supply chain. Or alternatively, the interconnected and diverse data needs for regulatory compliance. In TerminusCMS you can use both WOQL and GraphQL to perform graph back link queries. The video shows how to construct these queries in GraphQL. I’ll include it below for those that prefer the written word. Using the cloneable Star Wars project from the TerminusCMS dashboard, we’ll run a graph back link query for the following request – Show me one person and list the starships they pilot, and then list the films those starships stared in. TerminusCMS makes it simple to run graph back link queries as it automatically constructs the syntax from your project’s schema. It also has some neat features to help, such as autofill and the ability to press Ctrl C to get a list of available prompts for the document class you are querying. Look at the GraphQL How-To Guides for more information about querying with GraphQL, or for a more in-depth understanding read our GraphQL Reference Guide. Here are some examples of how a large business might use back link graph queries in the way you described: Supply chain management: A large business might use graph backlink queries to track the flow of products and materials through their supply chain. By identifying the components of a finished product and the suppliers who provide those components, they can more easily manage their inventory, optimize their production process, and ensure the timely delivery of goods. Customer relationship management: A large business might use graph backlink queries to better understand their customers and their buying patterns. By identifying the products or services that customers have purchased in the past, they can more effectively target their marketing efforts and personalize their interactions with individual customers."
