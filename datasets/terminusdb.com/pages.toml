["https://terminusdb.com/blog/knowledge-graph-data-mesh-3"]
title = "Knowledge Graph & Data Mesh Metaverse - Number 3"
description = "Welcome to issue number 3 of the Knowledge Graph & Data Mesh Metaverse round-up. Featuring some fantastic stories to keep you in the know."
full_description = "Hello and welcome to the third edition of Knowledge Graph & Data Mesh Metaverse which shares interesting articles about this world (and a little Web3 too). We share a lot of content via our Discord channels so thought we’d share the love and provide a regular update as to what’s been floating our boats. This is a great article from Benn Stancil talking about semantic data anomalies that go undetected by observability tools and slowly push the analytical reality of data until it reaches a cacophony of disasters. An ambitious version of this approach to discovery and observability is to use knowledge graphs to address these problems – semantic solutions to solve semantic problems. Have a read here. Author of Data Management at Scale, Piethein Strengholt, has written this interesting article providing some practical guidance for those planning their next-generation data platform, specifically data mesh. We became aware of this initiative via our community Discord channel. Ellie Young has set up Common Action which is an innovation network facilitating climate and sustainability action with data and technology. Their mission is to build connections between companies, non-profits, academics, entrepreneurs, government, citizens, to produce a coherent, collective force across society for responding to urgent global priorities. If you’re interested in this project, Ellie can be contacted on LinkedIn. When graph databases are talked about it’s often about high-level AI or machine learning, but never about day-to-day business. This article from Harry Powell, outgoing Director of Data and Analytics at Jaguar Land Rover, talks about exactly this: how graph databases can help business leaders drive (no pun intended) their day-to-day business processes and decision making. This article from Free Code Camp is a good introduction to Web3 with lots of useful links to further reading. So, if you want a comprehensive introduction to Web3, this is a good place to start. Melania Trump launched her own NFT platform to sell limited edition digital artwork and even promises to auction a historically important piece in early 2022 (plans for the Capitol riot?)."
