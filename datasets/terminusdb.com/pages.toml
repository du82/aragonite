["https://terminusdb.com/blog/straight-through-processing-insurance-claims"]
title = "Straight Through Processing of Insurance Claims | TerminusCMS"
description = "This article discusses using declarative modeling to write low-code applications to provide straight through processing of insurance claims."
full_description = "Can you build an app for straight through processing of insurance claims, including UI for necessary human interventions in a week? Of course, with software, it’s very hard to tell how long code takes unless you try. So we built one. The secret to our success was twofold: So both the core logic of transitioning an insurance policy through states and the UI fell out of careful modeling of the problem domain. This is what declarative software design is supposed to do for us, and it worked so well that it even surprised me! Best of all, it’s very easy to customize, because it is a very low-code application, with most of the logic in the description. I expect this approach can be used in a lot of FinTech applications and would love to have the opportunity to try it. We focused only on one use case: life insurance policies to demonstrate straight through processing of insurance claims with human intervention. Of course, our app doesn’t do everything that you might want in a fully-fledged insurance claims application. However, it does do a surprising amount considering the time it took to put together, and with a bit of elbow grease it seems to me it could easily be a product in itself, and it could easily be grown out to deal with a much larger assortment of claims. The first port of call is to model the objects of interest in claims processing. This is the semantic part that is going to drive the rest of the application. This is what TerminusCMS gives us just by modeling our application domain. A nearly fully functional UI, which can then be customized quickly by passing JavaScript configuration objects in React. To make our straight-through processing system, we model the states of our system based on whether the object we are interested in meets certain constraints. That way the state of the object is defined by the content of the object, and changing the content of the object (for instance, supplying more information, or correcting information) will change it to a new state."
