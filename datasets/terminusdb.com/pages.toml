["https://terminusdb.com/blog/versioned-content-for-you"]
title = "How versioned content should work for you in your CMS"
description = "Learn why versioning is important and how it can help you maintain control over changes while keeping a history of all edits."
full_description = "Versioned content is an important aspect of content management systems (CMS) that allows users to track and manage changes to their content over time. It is a way to keep a record of the different versions of a piece of content, such as a document or webpage as it is edited and updated. Using versioned content allows users to easily access and compare previous versions of their content, so they can see how it has changed over time and revert to an older version if necessary. Versioning also helps to prevent conflicts and collisions between different users who may be editing the same content at the same time. By keeping a record of all changes, users can easily see who made what changes and when which can help to resolve any issues that may arise. For bigger content projects, versioned content allows users to track the progress of their content over time and see how it evolves. Stakeholders stay informed about the project’s progress and audits and reviews are made easier by comparing content versions. Not all content versioning tools are equal and many do not suit the needs of businesses that rely on collaboration. Locked editing, where when someone is editing a piece of content everyone else is locked out of it. This is how WordPress works for instance. This isn’t ideal as it encourages people to work in silos. The other end of the spectrum is real-time collaboration. Tools like Google Docs offer real-time collaboration, where many people work concurrently on the same document. Anyone with experience with this approach will know it doesn’t work. Constant document evolutions make concentration and consistency difficult and often result in a patchwork effect that is not conducive to good content, this article explains these difficulties very well. Our approach to versioned content focuses on a collaboration model that uses immutable data. Immutable data never gets deleted. Changes get added on top and the old data is masked, but it is still there and available for humans and machines to read."
author = "Oliver"
year_published = 2023
year_updated = 2023
