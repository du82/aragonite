["https://terminusdb.com/blog/big-graph"]
title = "Ultra-Compact Graph Representations for Big Graphs"
description = "A technical blog about how we loaded 17 billion triples into TerminusDB to deliver a queryable big graph with a low memory overhead."
full_description = "Recently at TerminusDB, at the behest of an active community member, we decided to do an ingest of the OpenAlex Authors collection to create a big graph. This is a pretty big dataset. We found that after the ingest, not only did we have a database with 17 billion triples, but in comparison, our database is smaller than others (only 212GB as compared to 280GB), even though it is much better indexed. It also has the most compact triple store representation we are aware of, coming in at less than 14 bytes per triple for the tested dataset. You can search starting from subject, object, or predicate, in any direction, and get results quickly with an extremely low memory footprint, due to the utility of succinct data structures. When TerminusDB was first getting started, we did a project loading public information about the Polish economy into a big graph. The project had a lot of custom code that would merge information into a single compressed representation of a graph which could then be efficiently searched. The dataset was around 3 billion triples. This ingestion was a custom solution. It had to be ingested as a batch and could not be updated to correct information without starting over from scratch, and took a very long time (over a day) to ingest on a fairly large parallel computer with custom ingestion code. Since that time, we focused on making TerminusDB more user-friendly, making it easier to get started by loading JSON documents that are readable, and including schema checking to ensure that we don’t suffer from garbage data in the first place. Since most databases that are in active use are less than 2GB in size, this was probably the right decision. Very many real-world use cases do not require enormous data sets and ease of use is more important. However, sometimes, as with the original Polish economy use case, enormous datasets are precisely what we want. Recently one active member of TerminusDB’s community asked us if we could load the Authors’ collection from the OpenAlex dataset, which incorporates an enormous amount of information on scientific publishing."
author = "Gavin"
year_published = 2023
year_updated = 2023
