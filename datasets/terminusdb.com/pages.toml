["https://terminusdb.com/blog/cms-for-technical-documentation-3-front-end"]
title = "CMS for Technical Documentation Part 3 - Front End Build"
description = "The final part of our 3-part blog about using TerminusCMS for Tech Docs focuses on connecting to TerminusCMS, fetching data and the front end."
full_description = "The final part of the ‘CMS for Technical Documentation’ series looks at how we connected to TerminusCMS, fetched data and built the front end. If you missed the other two, part one explains the schema model for the static content, and part two looks at how we parsed JS and Python code into TerminusCMS for our client developer guides. For the website, we used Next.js and styled it with the Tailwind CSS framework & Flowbite which is a library of components built on top of Tailwind to support JS integration. We could have taken many paths when building the new documentation website. We could use one of the many static site generators and fetch that content as JSON. The disadvantage of this approach is that if we ever need to do something on the server side, we would have to use another framework to choose it manually. NextJS allows us to create API endpoints that can be called by the front end within the same framework. Another NextJS advantage is that it is built on React, meaning we have a vast amount of ready-made React components to use. As our developers are familiar with React there is only a little learning curve. As a bonus, if we decide to create React components ourselves, they benefit the TerminusDB community too. Everyone wins. As covered in part one of the CMS for tech docs series, we created a schema for the documentation structure and added this, along with the content, to a TerminusCMS data product called terminusCMS_docs. We then created a page in NextJS: A JavaScript or TypeScript file that renders a certain page. This page can be rendered through different routes or a single route, depending on how it is configured. In our case, the route is dynamic since it depends on the slug that is used inside the document we fetch. The getStaticPaths function fetches every possible route to generate. It uses the TerminusDB client to fetch all the possible pages and extracts all slugs from them, so we know which pages need to be rendered later. We make three exceptions: the Python, OpenAPI and JavaScript slugs are skipped (they are the pages parsed from code covered in part two). They have their own page renderer since they are not written in Markdown. If the page contains no slug at all, we skip it as there is no way to render a page without a proper URL that points to it."
author = "Robin"
year_published = 2023
year_updated = 2023
