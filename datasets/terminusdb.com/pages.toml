["https://terminusdb.com/blog/knowledge-graph-data-mesh-metaverse-10"]
title = "Knowledge Graph & Data Mesh Metaverse 10"
description = "Issue 10 of Knowledge Graph & Data Mesh Metaverse looks at data governance, GraphQL, ontology methodologies, and much more. Have a read today"
full_description = "It’s not the atomic number of Neon, it’s not the percentage of left-handed people in the world, it’s issue 10 of Knowledge Graph & Data Mesh Metaverse. In it, we share interesting articles about this world. We share a lot of content via our Discord channels, so we thought we’d share the love and provide a regular update on what’s been floating our boats. Boris Shalumov wrote this article looking at the importance of semantic knowledge graphs when building an enterprise data fabric. Comparing alternative technologies, Boris looks at how graph technology can outperform document stores, RDBMS, and other alternatives, to capture knowledge across the enterprise to derive insights. A new member of our Discord community was seeking advice about getting a better handle on ontologies. A fellow community member came to the rescue with a list of development methodologies to help. Here’s the list that could be handy for some of our readers: Ontology Development 101 – Noy and McGuinness, TOVE – Grüninger, Fox, Kim, Skeletal (Enterprise Model) Methodology – Uschold and King, Methontology – Gómez-Péres et al, IDEF5 – Menzel et al, ONIONS – Gangemi et al, NeOn Methodology – Suárez-Figueroa et al. Gavin wrote this tutorial/blog showing how you can search RDF with GraphQL in TerminusDB. With a Star Wars dataset, Gavin creates a schema for the Star Warts Turtle file, loads the schema and data into the database, and then queries it using the GraphQL interface. It’s not a Biggie song, but an article focused on the supply chain, the influx of IoT data, and how fixing your data architecture is the only way to gain any semblance of meaning from it. Some of the details are a bit vague, but the story nicely talks about some of the pain in the supply chain. LegalTech has grown in prominence in recent years. Traditional firms have technologically dragged their feet, fearing the unknown and, more so, fearing moving away from the billable hour. They are now being forced to change, due in part to greater customer buying savviness and tech disruptors. This story is one such disrupter, using AI and a legal knowledge graph to reduce legal cost barriers for consumers and SMEs."
