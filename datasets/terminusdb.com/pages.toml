["https://terminusdb.com/blog/what-is-a-data-product"]
title = "What is Data Product? Learn more about Data Mesh | TerminusDB"
description = "Data products & treating data like a product are a fundamental part of data mesh design. Learn more about Data as a product and Data Mesh"
full_description = "You may have heard the term data product being talked about in recent months. We thought we’d take time out to explain what is a data product and how treating data like a product can help organizations improve data accuracy, accessibility, and security. Data products were traditionally thought of as data products that consumers buy, think streaming services such as Netflix selling digital content. That, of course, is quite correctly a data product. In this instance, however, it is the wrong context. It is not what we and our peers mean when we talk about what a data product is. In short, data products are the principle of treating data as a product. That means getting data to an adequate condition for data customers to consume. When we say data customers, we mean anybody related to an organization who needs the data for a particular function. For example, a financial controller needing sales data, a marketing person needing product data, or a customer wanting to see their account details. Alternatively, it could be data analysts needing specific information for predictive modeling, or software developers requiring data for application development. Treating data as a product requires domain ownership. A domain is essentially a team. The easiest way to think of them is departmental, but it may vary depending on the type of organization. Domains have responsibility for their own data product(s). The domain is the subject matter expert for all the data generated within their realm. They understand what the data means and the context of it. Using the Netflix example, a domain might have responsibility for subscriptions, while another domain may handle show and movie recommendations. Each domain will have its own data and will understand the data context. As well as the data that a domain generates, a data product should also enable other domains to use their data. Data mesh pioneer Zhamak Dehghani talks about calling for a new principle, self-serve data infrastructure as a platform to enable domain autonomy. A data product is about its data customers and data must be made available to those who need it, but equally important is to provide those customers with the ability to help themselves to what they need when they need it. Self-serve data."
author = "Oliver"
year_published = 2021
year_updated = 2023
