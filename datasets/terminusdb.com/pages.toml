["https://terminusdb.com/blog/open-api-for-json-diff-and-patch"]
title = "An open API for JSON Diff & Patch"
description = "In this video, our CTO and co-founder, Gavin Mendel-Gleason shows you how to use our open API for JSON diff and patch so you can have a play."
full_description = "We use JSON-patch/diff internally for our rebase operation and thought we would make it available for others to use so created the open API example for diff and patch. The diff endpoint takes a POST of two JSON documents, before, and after. This endpoint then returns a 200 and a patch which takes before to after if applied using the patch interface. The payload is structured as a JSON document, with two keys, “before” and “after”, pointing to the documents you would like to diff. There are a number of available JSON Diff & Patch operations available using the open API, for full details with curl examples, visit our JSON Diff & Patch documentation. You can use TerminusDB and the Python and JavaScript clients to run diff and patch operations on your TerminusDB database, or other document databases, such as MongoDB. For full details visit our documentation pages, and check out the tutorial walking you through the process step by step."
