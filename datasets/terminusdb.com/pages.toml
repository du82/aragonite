["https://terminusdb.com/blog/content-moderation-at-the-data-layer"]
title = "Why Content Moderation at the Data Layer is Important"
description = "Why TerminusCMS' content moderation and change request workflows at the database layer are important for business critical functions."
full_description = "In today’s fast-paced and competitive business landscape, it is critical to have a robust system for data and content moderation. TerminusCMS, a content management system designed for large organizations, offers a key feature that sets it apart from other solutions: change request workflows at the data layer. In this article, we will explore why this feature is essential for critical business processes, such as forecasting, product testing, and documentation compliance. Change request workflows allow users to submit requests to modify data or content within the system. These requests can range from minor changes, such as correcting a typo, to major updates, such as adding new features or removing outdated information. The approval process ensures that all changes are reviewed and approved by designated stakeholders before they are implemented. This feature offers several benefits that are especially important for critical business processes. TerminusCMS is built upon our document graph database TerminusDB and benefits from its features. It uses a combination of immutable data, succinct data structures, and delta encoding to provide collaboration and version control features similar to Git. This means the database that stores your content and data can be cloned, branched, merged, and conflict-checked. It also provides a complete history of every document along with who changed it and when, with the ability to compare versions, time travel, and roll back. Everything you need for content moderation and change request workflows. First and foremost, change request workflows with approvals help maintain data and content accuracy. In forecasting, for example, accurate data is critical for making informed decisions. Forecasts in the manufacturing sector for instance have direct impacts on production and supply chain planning and costs so need to be bomb-proof. Without a proper system in place to review and approve changes, inaccuracies can quickly creep into the system, leading to incorrect forecasts and potentially costly mistakes. By requiring approvals for changes, TerminusCMS ensures that all modifications are thoroughly reviewed and vetted before being implemented, reducing the risk of errors and inaccuracies."
