["https://terminusdb.com/blog/change-requests-in-terminuscms"]
title = "Change Requests in TerminusCMS - Video Overview"
description = "A video overview of how change requests work using the TerminusCMS dashboard and how they add a layer of moderation to data curation."
full_description = "TerminusCMS features change request workflows at the database layer. Users are prompted to create a change request when they change the database. Change requests automatically branch the database and users make changes in that branch. Once they are done, they submit the change request for review. Once it is reviewed and TerminusCMS checks that there are no conflicts, the changes are merged into the live database. This video focuses on data curation in the backend, but the change request workflows can be utilized in front-end applications where content moderation is required. Particularly useful for applications that collaboratively build knowledge and you want to keep human reviews as a sense check. Get started with TerminusCMS in minutes. Sign up to TerminusCMS for free and clone a project to experiment with. If you get stuck, find us on Discord to answer questions and provide assistance."
author = "Oliver"
