["https://terminusdb.com/blog/headless-regtech-regulatory-reporting"]
title = "Headless Architecture - Everything you need to know | TerminusDB"
description = "Companies are increasingly adopting Headless Architecture to connect with their users. See how TerminusDB can be your headless tech in Regulatory Reporting."
full_description = "There are literally thousands of formal risk and regulatory reports that need to be delivered to agencies around the world. Each one needs its own format, its own set of data, its own language. Without exaggerating, it is a nightmare to manage. The regulators have no incentive to make it better – they are the masters of all they survey – so those reporting need to make their lives easier. Technology can help. Over the last 20 years, the good decision was often to outsource much of that pain to RegTech providers to build reporting pipelines that delivered an end-to-end solution using your data. If you are reading this in the regulatory department of a financial institution, you will know the names of the outsourced providers: AxiomSL, Bearingpoint, Wolters Kluver, Datatracks, Virtusa… the list goes on. Each of these providers will build you a tailored reporting pipeline for a specific set of regulations for a specific jurisdiction. You’ll also be familiar with the vendor lip-licking/feasting that takes place when a new set of regulations is due to come into force (see MiFID II). This expensive and difficult dance often acts as a barrier to innovation (maybe that is why the big guys like it, but I think they too want to change). It is also a waste of in-house regulatory and technical expertise. When you take a step back, the regulatory reporting problem looks very similar to the recent challenges faced by content management systems. To respond to the lack of agility in traditional architecture where the back end and the front end are tightly linked, content management has seen two major trends: Open source is less of a change (WordPress is open source and has a traditional architecture), but it has become table stakes for content management systems. Users want to be able to inspect the code and make improvements/alterations that they need for their systems. As far as your correspondent can tell, there is no open source in RegTech at all (or at least the only open source is inside the platforms and sold on with a massive premium). This is an anomaly in modern data architecture – and regulatory reporting has to start becoming a proper part of an enterprise’s data architecture."
author = "Luke"
year_published = 2022
year_updated = 2023
