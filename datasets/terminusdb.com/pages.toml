["https://terminusdb.com/blog/what-is-data-mesh-luke"]
title = "Cheuk Interviews: What is Data Mesh Luke?"
description = "In this interview, Cheuk Ting Ho, our DevRel Advocate, asks our co-founder, Luke, what is Data Mesh? It also looks at where TerminusX fits."
full_description = "In this interview, Cheuk, our DevRel Advocate, asks our co-founder, Luke, what is Data Mesh? We’ve also included the video transcript below. So this is an idea about how organizations should scale their data infrastructure. It’s not just about technology, it’s also about how you think about organizing inside your company. Rather than having one big central data team, you bring domain ownership to data. This allows teams to own their data upstream, and make it available to the rest of the organization. We think about the way that a lot of organizations manage their data today. You have one big central data warehouse with lots of spokes coming in. These spokes are different downstream teams. And the central hub is always overloaded by stuff coming in from the spokes. So what we need to do is try and move responsibility away from that hub, towards the spokes, and make those teams self-sufficient. Teams can then serve data properly to the rest of the organization. Some companies don’t. It’s not necessarily all companies need Data Mesh. Some companies can get by, they’re small enough, or they’re structured in such a way that they can have a central data warehouse. But when you start getting to scale, and the problems are multiplying, because more and more people want reports, and everybody working in data engineering knows their life is full of people shouting at them all day. I want this data in this way, I want this data in that way. So being able to allow those people to access high-quality curated data is really the goal of Data Mesh. TerminusX is good at building versioned data products. We take organizational data, package it up in such a way so that non-experts can work with it, and curate data locally. The team can build a single data product or multiple data products, that are governed and work together. One of the big problems with Data Mesh is that you’re at risk of just having loads and loads of silos. For example, all of the teams decide to make their own data products, using their own technology, with no overarching governance. This would end up in a mess."
author = "Oliver"
