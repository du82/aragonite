["https://terminusdb.com/blog/cms-for-technical-documentation-1-schema"]
title = "Using our CMS for Technical Documentation - Part 1, the Schema"
description = "We needed to dogfood TerminusCMS so we used the CMS for technical documentation. This is a 3-part blog explaining the process."
full_description = "We recently replaced Gitbook with TerminusCMS for a much-needed upgrade of our technical documentation. In order to help our users understand TerminusCMS and learn from our mistakes, this three-part blog talks about how to use TerminusCMS as a backend for technical documentation. Number one in the series, this one, talks about building the schema and the content curation process for non-technical users. Part two focuses on incorporating parsed code for our client reference guides. The final part looks at connecting with TerminusCMS and fetching and renderring data for the front-end design with some performance improvement stats thrown in for good measure. We launched TerminusCMS in January 2023 as a headless content management system for complex environments and we needed to dogfood our product. There were also some issues with Gitbook. We were on the free license for open-source developers and these issues impacted user experience, the main two being – Now that we’d decided to use TerminusCMS, the next port of call was figuring out what to do. The building blocks of the project were – The schema was the obvious first port of call. We used a discovery session with the team to decide the content and data requirements and went straight into modeling. The TerminusCMS schema is based upon a simple JSON syntax and you can model content/data either with a UI or, as we did, the JSON editor. The initial schema was a little convoluted as we discussed reusing content blocks across the site. Our early schema had a page document that linked to several other documents and subdocuments, such as the title, body, sections, and subsections that might make up a page. This idea is a good one as it facilitates the ability to dynamically build front-end pages using elements and makes it easier to programmatically deliver content. However, with our limited time, this was a little complex for our needs, so we ended up with a simpler page structure like this – The page class is made up of a string property called slug, which is the document key. Page includes linked properties to other documents and sub-documents. We also used @metadata and order_by to make the properties order in a logical way for those curating the content."
author = "Oliver"
year_published = 2023
year_updated = 2023
