title = "Connect with Apollo Client to use GraphQL with TerminusCMS"
description = "A reference guide to get you up and running with TerminusDB & TerminusCMS  using GraphQL and Apollo Client"
full_description = '''Connect with Apollo Client Install dependencies npm install @apollo/client graphql Initialize ApolloClient and Connect with TerminusDB Import the required dependencies needed - import { ApolloClient, InMemoryCache, ApolloProvider, gql,HttpLink,ApolloLink } from '@apollo/client'; Or const Apollo = require( '@apollo/client'); const { ApolloClient, InMemoryCache, concat, gql,HttpLink,ApolloLink } = Apollo Initialize ApolloClient by passing its constructor with a configuration object with the TerminusDB server endpoint, user credentials and cache fields. Extra information about the Apollo client cache can be found on their website Connect with TerminusDB Local const orgName = "myOrganizationName" const dbName = "myDBname" const myBranch = "main" const user = "admin" const password = "mypass" const userPassEnc = btoa(`${user}:${password}`) const terminusdbURL = `http://127.0.0.1:6363/api/graphql/${orgName}/${dbName}/local/branch/${myBranch}/` const httpLink = new HttpLink({ uri: terminusdbURL }); const authMiddleware = new ApolloLink((operation, forward) => { // add the authorization to the headers operation.setContext(({ headers = {} }) => ({ headers: { ...headers, authorization: `Basic ${userPassEnc}`} })); return forward(operation); }) const cache = new InMemoryCache({ addTypename: false }); const value = concat(authMiddleware, httpLink) const apolloClient = new ApolloClient({ cache:cache, link: value, }); // Query your database apolloClient .query({ query: gql` query{ Person{ _id name } } `, }) .then((result) => console.log(result.data)) .catch(err =>console.log(err.message)); Connect with TerminusCMS You will need to get your API key to connect with terminusCMS const orgName = "myOrganizationName" const dbName = "myDBname" const myBranch = "main" const myAPIToken = 'replaceYourToken' const terminusdbURL = `https://cloud.terminusdb.com/${orgName}/api/graphql/${orgName}/${dbName}/local/branch/${myBranch}/` const httpLink = new HttpLink({ uri: terminusdbURL }); const authMiddleware = new ApolloLink((operation, forward) => { // add the authorization to the headers operation.setContext(({ headers = {} }) => ({ headers: { ...headers, authorization: `Token ${myAPIToken}`} })); return forward(operation); }) const cache = new InMemoryCache({ addTypename: false }); const value = concat(authMiddleware, httpLink) const apolloClient = new ApolloClient({ cache:cache, link: value, }); // Query your database apolloClient .query({ query: gql` query{ Person{ _id name } } `, }) .then((result) => console.log(result.data)) .catch(err =>console.log(err.message));'''
