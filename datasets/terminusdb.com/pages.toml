["https://terminusdb.com/blog/content-and-knowledge-management"]
title = "TerminusCMS, headless knowledge & content management"
description = "A preview of our open-source headless content & knowledge management system, TerminusCMS. What is it, where does it fit, & when to expect it?"
full_description = 'In a little under a month, we will be launching TerminusCMS, an open-source headless CMS to provide businesses with composable architectures and true organization-wide knowledge management. TerminusCMS is not like existing headless CMS services such as Contentful which are primarily aimed at brochure websites and e-commerce stores. Our headless CMS is developer-first and is designed to enable engineers to build composable architectures and knowledge management systems for complex environments. The purpose of this article is to provide you with a better understanding of what TerminusCMS is and where it will fit within an organization. If TerminusCMS resonates with your project requirements, please contact us to discuss your needs to get in the door first. Like with most startups, there have been a number of pivots in recent years as we seek our market fit. TerminusDB started life as a schema-supported graph database aimed at providing DataOps to engineers with our Git-like collaboration model. As we evolved and developed new features such as the version 4.0 Document Interface we inadvertently began to broach the CMS space, at the time we even wrote in our community Discord server – ‘The document interface is basically a "CMS in a box" for terminus data objects. The documents page allows you to filter and order documents of different types, create documents of any type through a simple form, view documents as either JSON-LD or a simple web page, and edit, delete, create and update them with no code.’ Version 10 of TerminusDB saw us move edge closer to becoming a headless CMS provider as users built collaborative and complex applications with TerminusDB and TerminusX as the backend. Following an increase in user activity in the headless space both within our community and the types of applications being built, we decided in June 2022 to focus our efforts to become the leading headless CMS provider giving organizations a composable architecture for business-wide knowledge management.'
author = "Oliver"
year_published = 2023
