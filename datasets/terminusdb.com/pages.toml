["https://terminusdb.com/blog/terminusdb-internals-3"]
title = "TerminusDB Internals - Part 3: Sorting Every Sort of Thing"
description = "Part 3 of TerminusDB Internals looks at how we sort data lexically and how we have overcome some of the issues that come with this approach."
full_description = "Some of the the original experiments with TerminusDB were in Postgres, where we built a table of IRIs and ids, and then created a multi-indexed table of triples. We then compared the speed of this to a library called HDT which created a compact representation of graphs, and found HDT to be extremely fast for large RDF databases (Think TTL files over 100GB). This got us thinking seriously about succinct data structures, so we used the ideas in HDT as a starting point for TerminusDB. One of the choices made by HDT is the front coded dictionary. This tends to work very well for IRIs, since we tend to share addresses as prefixes, leading to substantial compression and reasonable retrieval speed. The dictionary relies on lexical sorting of data, as we want to branch at points that share prefixes. So sorting lexically helps us to maximally share prefixes. Lexical ordering also allows us to start with a prefix, and iterate over everything that shares it, or to perform fast range queries, simply by finding the beginning point, and iterating until we are at the terminus of the range. But not everything is naturally designed to be stored lexically. Take the classic example of the directory in Linux: In this world 101 is less than 11, and 2 is greater than 110. Not what we typically want when we are sorting numbers. But as it turns out, numbers can also be sorted lexically, provided we store them in a clever way. These lexical ordering tricks can give us id<->data conversion using dictionaries, which allows for compression, prefix queries and range queries. So how do we get 100 to be larger than 2? If we have fixed size integers, such as Int32, the answer is relatively simple. We break Int32 into 4 bytes written out in big endian. We’re almost done save one complication. In most representations, we keep around a sign bit on integers, generally stored in the most significant position, which is 1 if the number is negative, and 0 if it is positive. This is terrible, since all negative numbers are now larger than positive numbers. Further, integers are generally stored in a two’s complement, meaning that we flip every bit of a negative number. This is actually a good thing. Because it means that smaller numbers are bigger, and bigger numbers are smaller. Which is exactly how we expect negative numbers to sort! That is, -10 should be smaller than -1."
author = "Gavin"
year_published = 2022
year_updated = 2023
clearnet = "https://terminusdb.com/blog/terminusdb-internals-3"
