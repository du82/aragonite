["https://terminusdb.com/blog/climate-change-resilience-in-the-caribbean"]
title = "Resilience in the Caribbean: How Dominica are facing climate change"
description = "This article talks about how Dominica resolved to look climate change in the eye and become the world's first climate-resilient nation."
full_description = "In September 2017, the Island nation of Dominica was left devastated by the impacts of Hurricane Maria. Although Dominica is no stranger to hurricanes, with Hurricane Irma having struck just days earlier, Maria had devastating and long-lasting consequences. Hurricane Maria was a Category 5 hurricane. If one were to go according to the Saffir-Simpson Hurricane Wind Scale, Category 5 hurricanes bring with them catastrophic damage and consequences. The force of the hurricane resulted in overflowing rivers, storm surges, and extremely high winds of 160 miles per hour. More than 90% of the Island’s structures were destroyed. Overall, the damage and loss as a result of Maria were estimated to be around USD 1.3 billion, equating to roughly about 224% of Dominica’s GDP. The impact was staggering, as people’s lives, homes, and the city’s infrastructure were torn apart. The provision of water and sanitation was disrupted, with production and distribution pipelines either damaged or washed away as a result of the hurricane. Intake systems were all but choked with sand and debris, storage tanks, pumps, and access roads were severely damaged. For months after the hurricane, people received water from water trucking services. In terms of electricity, damage to transformers and electrical generation sites caused an estimated 75% of the network to collapse. In the same vein, the disruption of telecommunication services during and after the hurricane had a significant negative impact. Not only was Dominica practically cut off from the outside world for a number of days, even communities, people, and families within the nation were isolated from one another. Crucial information for relief and rescue activities was communicated via a few functional satellite phones and a sparse amateur radio network. Maria was the most devastating hurricane to have hit Dominica. Unfortunately, all signs suggest it won’t be a one-off. As the planet continues to get warmer, hurricanes are expected to grow not just in number, but in intensity. Numerous studies have shown that as the Atlantic Ocean heats up, storms will become more common, intense, and long-lasting. And so, in the wake of the devastation wreaked by Maria, the nation of Dominica began to slowly rebuild, fully aware that climate change may mean more catastrophic storms in the future."
author = "Sreya"
year_published = 2022
year_updated = 2022
