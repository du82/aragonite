["https://terminusdb.com/blog/cms-for-technical-documentation-2-parsing-code"]
title = "CMS for Technical Docs, Part 2 - Parsing JS & Python Code"
description = "Part 2 of our 3-part blog about using TerminusCMS for Tech Docs focuses on what we did to parse code for our JS & Python reference guides."
full_description = "Part two (of our three-part series explaining how we used our CMS for technical documentation) focuses on parsing code for the JS and Python client reference materials. For our technical documentation migration from GitBook to TerminusCMS we needed to parse code documentation as well static content. In our use case, we needed a solution for the technical documentation for the Python and JavaScript clients that have documentation that is automatically generated when a new version comes out. Since we needed to parse both the Python and JavaScript documentation, a generic schema was needed to accommodate both. One option was to create separate data products with independent schemas for each, but we chose a more abstract approach: to make a schema that could accommodate multiple languages. It contains everything we need to parse the JavaScript and Python client documentation. The Application class contains the name of the application and the language. It has a module set that contains the different modules. In the Python example, this would be terminusdb_client for instance. A lot of the different classes in the schema inherit from Documented, which gives it the Named and Summarized properties, as most of the code documentation properties have a name and summary. Each class object contains a set of memberFunctions and memberVariables. The memberFunctions are from the class Definition and are functions in Python and JavaScript. The functions contain a list of parameters and a return value. It also inherits the Documented class which gives it a summary and a name attribute. Some languages like Go allow for multiple return values, therefore the return values can also be a list in the returns_multiple property. We inserted the schema using the TerminusCMS JSON schema editor. The following sections will show how to parse the JS and Python code to insert the code documentation data. In order to render the JavaScript documentation, we first have to parse it. To do this, we created a custom JSDoc template – https://github.com/terminusdb-labs/jsdoc-terminusdb-template."
author = "Robin"
year_published = 2023
year_updated = 2023
