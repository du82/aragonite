["https://terminusdb.com/blog/manufacturing-information-management"]
title = "Better manufacturing information management for my ex-employer"
description = "Now that I'm a terminator, I can see that my ex-employer would benefit from better manufacturing information management."
full_description = "Now that I’m a terminator, I can see clearly that my old employer would benefit from better information management. I used to work for one of the world’s top four french fry (and other potato products) manufacturers. They annually produce 1.7 million tonnes of potato goodness and sell across the globe. Looking back on what I now know, I can see how they could do things differently to improve their operational efficiency, customer service, and sales efforts. This is in no way bad-mouthing my previous employer, they are, in my opinion, the best manufacturer of french fries in the business. But their digital transformations left a lot to be desired. I now know that an effective content management system would revolutionize their manufacturing information management and set them ahead of the competition. Content management probably makes you think of marketing websites, but in reality, it’s much more than that. It’s information management, product information management, and communicating the right information to internal and external stakeholders. Content is many different things to different people. In relation to the potato manufacturer, it includes: Content is a vague word in itself. It can mean many things and certainly content means different things to different people, for example: Content is marketing information, but also ingredients, nutritional information, and allergen advice. Content is product specifications, ingredients, cooking methods and instructions, and product testing. It’s all content, some produce it and some consume it, and quite often there is a great deal of overlap as to who finds it useful. This is a snapshot of how new products come to life and how the information and content flowed from creation to customers at the food manufacturing company: As you can see, there is a lot of content and a lot of information being created and stored in many different places. It’s all jumbled up and there is no real structure or system to it. This is not an uncommon scenario in many manufacturing companies. So, what would an effective content management system do?"
