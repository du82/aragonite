["https://terminusdb.com/blog/content-revolution"]
title = "The Content Revolution"
description = "A look at TerminusCMS from a technical perspective and how we're trying to address what's missing in today's document management solutions."
full_description = "Myself and team just finished preparing our new cloud headless CMS offering, TerminusCMS. It feels like a pretty long journey getting here, but we feel like we have the basis of a truly next-generation CMS for devs. We live in the information age, and unsurprisingly that means a lot of what we do with computers is about marshalling, finding, or transforming data. Each domain which IT serves involves creating digital assets that record information to be enriched, served up, or curated over time. And much of this data is highly interconnected. Moreover, it is being loaded, curated and enriched by a combination of humans and computers. The entire business is fundamentally cybernetic. We need knowledge graph management systems that include easy-to-use interfaces for human data entry, review, and curation at the same time as a computer performs similar tasks. These systems have to be scalable and distributed. And as AI grows in significance, the importance of well-structured data will follow suit. AIs perform better when fed well-structured data and with it they will be able to help us create the search engines of the future. It will make expert systems something more like asking an expert, and less like a tool for an expert. Our infrastructure for creating and managing the data world is still young, so the question is, how is it going to change? We have databases, including graph databases, and we have headless content management systems, what more could we ask for? As a practitioner in managing data, I developed strong opinions on the matter and made some big bets on what I thought was important by making TerminusDB and now TerminusCMS. What is currently missing in our data management solutions? I think it essentially boils down to the need for: None of these ideas are completely new. In fact, all of them are widely used in their respective domains, but they aren’t currently being used together for data management. To hit these functional requirements we need a headless, schema-driven knowledge graph management system with external transactions for CI/CD… right, what does that mean… Let’s unpack that…"
author = "Gavin"
