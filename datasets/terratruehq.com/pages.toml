full_description = "What are cookies?Cookies are small pieces of data that are stored on your device to help us remember things about you. To make this notice easier to understand, we call similar technologies — like Web storage, device fingerprints, and device identifiers — cookies too.How we use cookiesNecessary cookiesThese cookies allow us to run our services and keep our users safe. For example, we use these cookies to help you log into your account and prevent others from modifying your personal information.Necessary cookies can’t be disabled. Your browser may allow you to block these cookies, but it will prevent or severely impair our ability to provide our services.NameExpirationDomainPurposeTerraTrueCookiePreferences10 yearsterratruehq.comRecords your cookie preferencesorgNameOn browser closeterratrue.com, launch.terratrue.comRecords the org you’re currently viewing for multiple-org supportuiPreferencesPersistentterratrue.com, launch.terratrue.comStores per-user preferences, like table pagination, modal preferences, and sorting preferencesuserSessionsOn browser closeterratrue.com, launch.terratrue.com, questionnaire.terratrue.comStores information about the logged-in user for session management, including name, email address, org name, and access tokenorganizationsOn browser closeterratrue.com, launch.terratrue.comStores orgs that you belong toFunctional cookiesThese cookies help us deliver services you request, like scheduling time for a demo. Functional cookies can be disabled, but may noticeably degrade your experience.NameExpirationDomainPurposeguest-sessionOn browser closechilipiper.comHelps manage our demo scheduling servicefs_uid1 yearchilipiper.comHelps troubleshoot issues with our demo scheduling service_sp_id2 yearschilipiper.comHelps manage our demo scheduling service_sp_ses30 minuteschilipiper.comHelps manage our demo scheduling servicesp1 yearchilipiper.comHelps manage our demo scheduling serviceAnalytics cookiesThese cookies help us measure how well our services perform and understand how you use them. For example, we use analytics cookies to learn which features are the most popular and which devices people use to access TerraTrue.NameExpirationDomainPurpose_ga2 yearsterratruehq.comDistinguishes visitors to our site for Google Analytics_gid24 hours terratruehq.comDistinguishes visitors to our site for Google Analytics _gat1 minuteterratruehq.comThrottles the number of requests from Google AnalyticsAhrefs_cookiePersistentterratruehq.comDrives insights about what website visitors of ours are searching for and about how to better optimize our SEO positioning_hp2_id.APP_ID13 monthsheap.ioUser cookie (stores user_id, identity, other ids)_hp2_ses_props.APP_ID30 minutesheap.ioSession properties cookie (stores timestamp and cookie domain/path)_hp2_props.APP_ID13 monthsheap.ioEvent properties cookie (stores properties set by addEventProperties API)_hp2_hld.*Should not persistheap.ioUsed to determine which domain a cookie can be set on (since public suffix domains block setting cookies on the top level)Marketing cookiesThese cookies allow us to measure and improve our advertising. For example, we use these cookies to help us send you email messages about the products you’ve explored on our site and understand which ads most effectively introduce new people to our site.NameExpirationDomainPurpose_chloe_id.3ef92 yearsterratruehq.comIdentifies Insightly users_chloe_ses.3ef930 minutesterratruehq.comDistinguishes visitors to our site for InsightlysnowplowOutQueue_chloe_cf_getPersistentterratruehq.comRecords which pages are visited for Insightly_mkto_trk2 yearsterratruehq.comAllows us to track visitor behavior and links a visitor to the recipient of an email marketing campaign in order to measure campaign effectivenessMarketo email pixelPersistentEmail communications involving @terratrue.com marketing communicationsEmail pixel for tracking open/closeMunchkin2 yearsterratruehq.com and advertising campaigns involving terratruehq.comAllows us to track visitor behavior and links a visitor to the target of an advertising marketing campaign in order to measure campaign effectiveness.“__adroll”, “__ar_v4” “__adroll_fpc.” __adroll_consent_params __adroll_post_consent_html __adroll_post_connsent_css12 monthsterratruehq.com and advertising campaigns involving terratruehq.comAllows us to track visitor behavior in order to identify which types of visitors respond best to our campaigns.How our service providers use cookiesNecessary cookiesIf you sign in to TerraTrue using a third-party service provider — like Google, Okta, or OneLogin — that third party may use cookies to authenticate and manage your session. We won’t set these cookies unless you attempt to use one of these services. If you do use a third-party authentication service, these cookies are necessary and can’t be disabled.Functional cookiesWe use Chili Piper to help automatically schedule inbound demo requests. You can learn more about Chili Piper’s privacy and security practices in their security portal.Analytics cookiesWe use Google Analytics to help us measure how well our services perform and understand how you use them. You can learn more about how Google Analytics uses cookies on their website. We also use Ahrefs in order to understand what our site visitors are looking for when they search for relevant content online, and to better understand how to make our website rank better in search results. And we use Heap to collect and analyze analytics about how our users interact with TerraTrue.If you become a TerraTrue customer, we use PostHog to collect analytics and session information about how you interact with our platform. We use this information to improve our services and fix bugs.Marketing cookiesWe work with several third-party service providers to help us deliver, measure, and improve our advertising. You can manage these cookies with our cookie settings as well as tools provided by our services providers.GoogleWe use a variety of Google advertising products, including search and display ads. You can learn more about how Google uses cookies on their website. You can visit Google’s ad settings page to opt out.InsightlyInsightly is a customer relationship management platform that, among other things, helps us schedule demos, reply to pre-sale requests, and track conversions. Insightly cookies are usually set from *.insightly.services.LinkedInWe use LinkedIn to market our products and services and measure the performance of those advertisements. You can learn more about LinkedIn advertising in their help center. You can also opt out of LinkedIn advertising via their user settings. LinkedIn cookies are usually set from *.linkedin.com.MailchimpWe use Mailchimp to send transactional and marketing emails. Mailchimp uses cookies to measure the performance of those messages, help us understand how you interact with those messages, and record your marketing preferences. Mailchimp cookies are usually set from *.mailchimp.com and *.list-manage.com.MarketoWe use Marketo to manage our marketing communications with those we think may be interested in learning more about TerraTrue, and to help collect and organize information about those people. Marketo cookies are usually set from *.marketo.com. We likewise use Marketo to allow us to track visitor behavior and to link a visitor to the target of a marketing campaign in order to measure campaign effectiveness.RollworksWe use Rollworks in order to measure which marketing campaigns best resonate with which types of potential customers. Through Rollworks’ NextRoll tooling, we can identify which potential customers might respond well to marketing efforts based on the past behavior of similar prospects."
