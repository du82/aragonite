title = "My Terrible Sorcery Is Without Equal In The West: 2013"
full_description = '''Saturday, March 2, 2013 infrequent blogs Well, shit - I got a new job last year and picked up my guitar again - where has the time gone? Apologies are due to Jez, Erik, Stefan and the other dudes who I was in the middle of a conversation with when I up and vanished. Next time I'll let you know what's going on - and hopefully not disappear for a year. I haven't played much of my home game since last spring, but I still toss ideas for games around in my head all the time. I ran a one-shot of my proposed Arthurian Labyrinth Lord game almost a year back, and it was... OK. After some reflection, the setting needed some changes - it's back on the drawing board. One of the big improvements was adding Realms of Crawling Chaos to the mix. Now I have a setting that's still familiar enough to be easily communicated, but is gaining much-needed variety. I'm going to scrap the one-shot dungeon I wrote, and use a few parts in building a MEGADUNGEON beneath the Isle of Wight. Actually, the megadungeon will extend underneath all of Britain. Right now the setting is less "Arthurian high fantasy" and more like: KING ARTHUR vs. ARAWN vs. CTHULHU! You might say those first two are pretty similar. The Arthurian heroic fantasy milieu is closely related to Welsh and Irish folktales, but actually the concept of Arawn's 'otherworld' or a fairyland will be stretched to include not only classic D&D stuff like rust monsters and gelatinous cubes, but also the kind of gonzo shit I love to see on MMSFP. So while the Arthurian influence will govern the cities and wilderness of primeval mythic Britain, the folktale/fairyland stuff will take over underground - while the Cthulhian, Weird Tales shit will be stuck in all the hard-to-reach corners. I have been crawling my favorite blogs (and some really cool ones that are new to me) for monsters and other ideas that fit the bill. Some of my older Arthurian posts are now inaccurate; the speed hireling table and the "Where do you hail from?" table specifically. I will update them in a while, if I am ever done my endless fiddling with the fucking things. Posted by HDA at 8:33 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Arthurian, goals, Spoils of Annwn Sunday, February 24, 2013 my "Appendix N"... since young times (the one you can't see because of glare is Monmouth's History of the Kings of Britain) I don't know why I never thought of putting all these together before. Posted by HDA at 10:41 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Arthurian, books, Spoils of Annwn Newer Posts Older Posts Home Subscribe to: Posts (Atom) About Me HDA It's like, how much more black could this be? And the answer is none. None more black. View my complete profile Monsters Reviews Play Reports Nameless Cults Historical Weapon & Armour lists Most Liked! Lich Name Generator Table REVIEW: The Stygian Library Enemies of the New Sun in the Wilderlands Why the OSR? / YOU RECOGNIZE NOTHING Dark Souls is Classic D&D in a modern video game Classic Adventure Gaming Blog Archive ► 2024 (6) ► July (2) ► April (2) ► February (1) ► January (1) ► 2023 (4) ► October (1) ► January (3) ► 2022 (7) ► August (1) ► June (1) ► February (2) ► January (3) ► 2021 (8) ► November (3) ► October (1) ► September (1) ► June (1) ► April (1) ► March (1) ► 2020 (17) ► December (1) ► October (1) ► September (1) ► August (1) ► July (1) ► June (1) ► May (1) ► April (1) ► March (4) ► February (5) ► 2019 (21) ► December (3) ► November (1) ► September (2) ► August (2) ► June (2) ► May (5) ► April (3) ► January (3) ► 2018 (37) ► December (3) ► November (6) ► October (4) ► September (3) ► August (3) ► July (5) ► June (5) ► May (2) ► April (1) ► January (5) ► 2017 (16) ► December (1) ► November (2) ► October (1) ► May (1) ► April (4) ► March (1) ► February (4) ► January (2) ► 2016 (1) ► December (1) ► 2015 (7) ► September (4) ► August (3) ▼ 2013 (2) ▼ March (1) infreque