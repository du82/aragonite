title = "My Terrible Sorcery Is Without Equal In The West: April 2018"
full_description = '''Tuesday, April 3, 2018 D&D Economies - Part Two Got this HERE. Check it out. So in the last post, I reproduced an awesome article on D&D economics that I found online. This is the second excerpt I wanted to reproduce, and honestly it contains pretty much everything I like about this guy. Remember this is written for 3.x rules-as-written, and this guy is trying to fix some of the absurdities of that system. He does a good job of it too. ***** Remember: I DIDN'T WRITE THIS! I JUST REALLY LIKE IT!! ***** Check it out: "The Economicon: Making Sense of the Gold Standard “ 100 pounds of gold for a house? How does anyone make rent without a wheelbarrow? ” Since time immemorial, D&D has used the "gold piece" as its primary currency. It is apparently a chunk of reasonably pure gold of vaguely standardized weight that people use fairly interchangeably in different cities populated by different species. In the bad old days, each gold coin was a tenth of a pound, which was hilarious and inane. In the current edition, each gold piece is a fiftieth of a pound. That's 3.43 gp to the Troy Ounce, which means that in the modern economy, each gp is about $171 worth of gold. Obviously, gold is significantly more common in D&D than it is on Earth, gold is also undervalued because its status as a currency standard drives it out of industrial uses and causes inflation. Further, populations in D&D are orders of magnitude smaller than they are in the real world, so the gold per person is higher even with the same amount of gold. So the gold piece is massively less valuable in D&D economies than it would be in Earth's economies. Nonetheless, things are really expensive in D&D, and the high price in gold means that there's a distinct limitation of how much wealth can be transported by any means available. The economies of currency transaction are actually so unfavorable that currency as we understand the term does not exist. Things don't have prices or costs – all transactions are conducted in barter and a common medium of exchange is heavy lumps of precious metal. Wish and the Economy An Efreeti can provide a wish for any magical item of 15,000 gp or less. A Balor can greater teleport at will, but can only carry 30 pounds of currency while doing so. Even in platinum pieces, that's 15,000 gp worth of metal. The long and the short of it is – at the upper end of the economy currency has no particular purchasing power and magic items of 15,000 gp value or less are viewed as wooden nickels at best. You can spend 15,000 gp and get magic items, but people in the know won't sell you a magic item worth 15,001 gp for money. That kind of item can only be bought for love. Or human souls. Or some other planar currency that is not replicable by chain binding a room full of Efreet to make in bulk. Powerful characters actually can have bat caves that have sword racks literally covered in 15,000 gp magic items. It's not even a deal because they could just go home and slap some Efreet around and get some more. But even a single major magic item – that's heavy stuff that such characters will notice. Those things don't come free with hope alone, and every archmage knows that. Wartime Economies Make for Shortages Many people wonder why a masterwork dagger goes for more than its weight in gold. That's a pretty valid question to ask; certainly I'm not going to attempt to justify the 600 gp price tag on a masterwork walking stick – that's just an example of simplistic game mechanics run amok. But to an extent the crazy prices can be justified by the fact that every settlement in every D&D world is on a war footing all the time. The idea that Peace is somehow a natural state is a fairly recent one, and based on the frequency of wars all over the world – it's obviously just wishful thinking anyway. War is the default position of every major economy in the world, and that means that weapons have an immediate, and desperate, clientele. Iron is still relatively cheap, because you can't kill people with it right now, but actual weapons and armor are crazy expensive. That doesn't explain the fact that the PHB charges you over a quarter oz. of gold just to get a backpack, and it doesn't explain the fact that the markup on masterworking a buckler is the same as the markup on masterworking a breastplate – that's just a game simplification that makes no real-world sense. But it's a start. Coins are Big and Heavy “ How many boards could the Mongols hoard if the Mongol hordes got bored? ” From the standpoint of the adventurer, the primary difficulty of the D&D currency system is that the lack of a coherent banking and paper currency system means that there are profound limits to what you could possibly purchase even with platinum. But the currency system hurts on the other end as well. Untrained labor gets a silver piece a week. That's 500 copper coins a year, which means that no matter how cheap things are they can only make one purchase a day most of the time. That's pretty stifling to the economy, in that however much gets produced, no one can buy it. Demand, from the economics standpoint, is strangled to the point where large production outputs don't even matter (remember that in economics Demand doesn't mean "what people want", it means "what people are willing and able to pay for", so if the average person only has 500 discreet pieces of currency per year, that puts an absolute cap on economic demand, even though the people are of course both needy and greedy enough to want anything you happen to produce). What's worse, those coins are heavy. For our next demonstration, reach into your change drawer and fish out nine pennies. That's a decent lump in your pocket, neh? That's about one copper piece. Gold pieces are smaller (less than half the size, actually), but weigh the same. D&D currency, therefore, is more like a Monopoly playing piece than it is like a modern or ancient coin. There's no reason to even believe these things are round, people are seriously marching around gold hats and silver dogs as the basic medium of exchange. Now, you may ask yourself why these coins are so titanic compared to real coins. The answer is because having piles of coins is awesome. Dragons are supposed to sleep on that stuff, and that requires big piles of coins. Consider my own mattress, which is a "twin-size" (pretty reasonable for a single medium-size creature) and nearly .2 cubic meters. If it was made out of gold, it would be about 3.9 tonnes. That's about eighty-six hundred pounds, and even with the ginormous coins in D&D, that's four hundred and thirty thousand gold pieces. In previous editions, that sort of thing was simply accepted and very powerful dragons really did have the millions of gold pieces – which was actually fine. Since third edition, they've been trying to make gold actually equal character power, and the result has been that dragon hoards are… really small. None of this "We need to get a wagon team to haul it all away", no. In 3rd edition, hoard sizes have become manageable, even ridiculously tiny. When a 6th level party defeats a powerful and wealthy monster, they can expect to find... nearly a liter of gold. That is, the treasure "hoard" of that evil dragon you defeated will actually fit into an Evian bottle. There are two ways to handle this: Live with the fact that treasures are small and unexciting in modern D&D. Live with the fact that characters who grab a realistic dragon's hoard become filthy stinking rich and this fundamentally changes the way they interact with society. But once you accept that the realities of the wish based economy, you actually don't have to live with characters unbalancing the game once they find a real mattress filled with gold. That's not even a problem once characters are no longer excited by a +2 Enhancement bonus to a stat or a +3 enhancement bonus to Armor. Which means somewhere between 9th and 13th level it's perfectly fine for players to find actual money without unbalancing the game. Really, you can stop worrying about it. Bad Money Drives Out Good: The Penalties of Paper People from the modern world are generally pretty perplexed by this idea of handing back and forth actual metal as a medium of exchange. It is an undeniable truth in our lives that the idea of currency is just that: an idea. As long as whatever I'm trading for goods and services can be traded for goods and services, it doesn't actually matter if the exchange commodity has any ascribed intrinsic worth. Paper descriptions of value or even ephemeral electronic representations are not only adequate, they're convenient. But more than that, using valuable commodities as a medium of exchange inhibits the growth of the economy. As long as a certain portion of the wealth is locked up in currency, the economy is strangled coming and going: not only is there a completely arbitrary limit on how many goods and services can be exchanged (the gold supply), but there is also a limit on the kinds of industry and artistic expression that can occur (in that if you use gold for anything but currency you're actually shrinking the money supply and producing negative GDP). So... you're going to solve that by instituting a paper-based exchange system where initially the paper is exchangeable for gold and that eventually gets phased out when the Plebes realize that handing actual gold back and forth is inconvenient and dumb, right? Wrong. Remember that this is the Iron Age, and people haven't invented Nationalism yet. The cornerstone of the Greenback currency is a belief in the nation that prints it – and nations simply don't exist. You've got empires, and you've got kingdoms, and you've got tribes, and you've got unincorporated villages... and that's it as far as civilization goes. When you look at a map in D&D and a colored region has a name on it, that's the name of the region. Possibly it's even the name of some guy in the region. The point is, that it's not a country in the modern sense of the word, so if some new guy walks in who's bad enough the next cartographer will put his name on the region instead. And that means that "The Full Faith and Credit of the Kingdom of Daxall" is worth precisely nothing. And while King Daxall can, through force of arms, take all the gold away from all the peasants and get them to trade pieces of paper for goods and services in its place – noone will actually believe that the paper is currency. They're literally trading promises by King Daxall that he'll let them have their money back if they leave town. And since the serfs can't even leave town, even that promise is meaningless to them. A serf accepts paper for goods and services only because he'll be beheaded if he doesn't. The black market value of these pieces of paper is pretty close to zero. Worse, nearby governments will see this as a blatant attempt to sequester all the gold in King Daxall's pants and will probably declare war (in addition to the fact that noone outside the reach of King Daxall's pikemen will accept Daxall Dollars). Powerful Creatures Have a Powerful Economy The amount of gold it takes to get anywhere as a land lord is very large. The question that arises then, is why awesome architecture exists at all. It's a valid question, the listed costs to put things like pit traps and thrones made of bone into your dungeon are stupendously large and actual magical swag can be made available for much less than that. The answer is that: People don't actually pay all that gold to have their homes remodeled (see the peonomicon below). Powerful artificers and adventurers don't even want your gold. If something has a value of 100,000 gold pieces, it can't be purchased with gold pieces at all – because that's an actual ton of gold that you'd have to plop over the counter and the merchant you're dealing with won't take your money even if you have it. Here we're going to be focusing in on Gems Souls Concentration Hope Raw Chaos Gems: Truth or Dare Gems are, to the vast majority of participants in the economy, pretty much worthless. A 500 gp diamond is pretty much the same as a gold piece to someone who intends to purchase things with a value of 1 gp or less. And of course, there are a lot more individuals out there who will stab a peasant in the face for a diamond than a gold piece. So why does anyone care? Well, two reasons: the first is the obvious one that gold is extremely limited in what it can possibly purchase. A +2 sword is worth your weight in gold. Not its weight in gold, your weight in gold. It seriously costs over 166 pounds of gold, and that's just not reasonable for most people to put into their pockets. So people interacting with even the shallow end of the magic trade need there to be some crazily expensive items that have no purpose save to look pretty and be exchangeable for other stuff. But unlike our world gems actually have real value as well: as the fuel for powerful magics. On Earth, the only reason that a diamond is expensive is because there's an international organization called DeBeers that seriously has actual assassins that will shoot you in the face if you try to sell diamonds for less than the price they've determined that they're supposed to be sold for. D&D doesn't have that kind of armed monopoly to maintain gem prices, but it does have the fact that people continuously use up gems for spells like raise dead and item creation and the like. So the fact that you can use ruby dust to make continual flames that you can turn around and sell as Everburning Torches means that ruby dust will continue to have value as long as people value light. The D&D rules actually only go into the spell component uses of a handful of gems, but rest assured that all the rest are similarly useful when we get into the ephemerals of item creation. A lot of those "components" that cost piles of thousands of gold pieces are actually just piles of gems. Onyx keeps its value based on the needs of necromancers, but amethyst is just as needed to bind illusion magic into a cloak. The exchange rate between gems and magic items is in no danger of going anywhere. Minor magic items and gems are traded avidly by shopkeepers, adventurers, and even powerful outsiders and wizards. But even so, gems can be simply acquired by the very powerful. The realities of the wish based economy ensure that gems can simply be obtained in large numbers by anyone who really cares enough to dedicate a conjured earth elemental to collecting them. Magical items that cannot be created with the application of spells (that is, magic items valued at more than 15,000 gp) cannot be purchased on the open market with mundane currency, not even gems. That isn't to say that you can't cheat a goblin out of a staff of power with some shiny rocks, you totally can (heck, you could also stab the goblin in the face and take that staff of power), but doing so is not considered a "fair trade" and requires a bluff check on your'''
