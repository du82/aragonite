full_description = '''Wednesday, October 25, 2017 MEGA MUTATION POST!!!! ***** EDIT: HOT DAMN! Other people are on to the same thing and this is just great. Also, this badness over at Red Box Vancouver. The revised edition costs $10 for the pdf (but remember that's in our Canadian dollars, which are basically wooden nickels), but the 'classic version' is free. Now to peruse through and try to integrate it all! ***** Okay folks, it's been a minute. Tonight I am trying to switch over to night shifts for the rest of the week, so I'm up til 7 drawing a new map of Albion, writing up dungeons, and collecting links and ideas for various aspects of the game. One thing that's been on my mind for a while is a bad-ass "super-mutation" chart. Something that has EVERYTHING, where I'll never run out of new shit to inflict on PCs, and I can also use to whip up freakish Chaos champions, pathetic sorcerous experiments and everything in between. I will also use some of the more innocuous and cosmetic mutations for the elves in my game, who are supposed to look freakish and alien. So far, I have no such compiled table, but a list of links or references to other people's tables. All I have to do is create a weighted chart that lets me decide which one of them to roll on! I will weight it so the really savage tables are much less common, and so the tables with MORE STUFF are used more often. -Tiefling appearance table from the 2nd edition Planeswalker's Handbook -Mutation table from Carcosa -"Effects of the purple lotus" from Death Frost Doom -This sweeeeeet table from WWCD? (please I hope to see more of these) -I think this one's from Warhammer. -This one is more of a 'sorcerous mishap' chart but has plenty of great stuff. -Scrap Princess at it again! This will be added to as I find more links and get more books. I'm not really sure how to format a table in this stupid blogger interface, so w/e bro, the Notepad solution it is. ROLL d100: 1 - 20% - Tiefling 21 - 28% - Carcosa 29 - 34% - Purple Lotus 35 - 52% - WWCD? 53 - 74% - Warhammer 75 - 91% - Dungeon of Signs 92 - 00% - Scrap Princess ***** Brought to you by the changing of the seasons and the unconquerable sun: Posted by HDA at 2:17 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, links, Mythos, tables Newer Posts Older Posts Home Subscribe to: Posts (Atom) About Me HDA It's like, how much more black could this be? And the answer is none. None more black. View my complete profile Monsters Reviews Play Reports Nameless Cults Historical Weapon & Armour lists Most Liked! Lich Name Generator Table REVIEW: The Stygian Library Enemies of the New Sun in the Wilderlands Why the OSR? / YOU RECOGNIZE NOTHING Dark Souls is Classic D&D in a modern video game Classic Adventure Gaming Blog Archive ► 2024 (6) ► July (2) ► April (2) ► February (1) ► January (1) ► 2023 (4) ► October (1) ► January (3) ► 2022 (7) ► August (1) ► June (1) ► February (2) ► January (3) ► 2021 (8) ► November (3) ► October (1) ► September (1) ► June (1) ► April (1) ► March (1) ► 2020 (17) ► December (1) ► October (1) ► September (1) ► August (1) ► July (1) ► June (1) ► May (1) ► April (1) ► March (4) ► February (5) ► 2019 (21) ► December (3) ► November (1) ► September (2) ► August (2) ► June (2) ► May (5) ► April (3) ► January (3) ► 2018 (37) ► December (3) ► November (6) ► October (4) ► September (3) ► August (3) ► July (5) ► June (5) ► May (2) ► April (1) ► January (5) ▼ 2017 (16) ► December (1) ► November (2) ▼ October (1) MEGA MUTATION POST!!!! ► May (1) ► April (4) ► March (1) ► February (4) ► January (2) ► 2016 (1) ► December (1) ► 2015 (7) ► September (4) ► August (3) ► 2013 (2) ► March (1) ► February (1) ► 2012 (6) ► February (2) ► January (4) ► 2011 (12) ► December (2) ► October (6) ► September (4) Reading List In My Campaign Paths Not Taken: Rewriting Weapon and Armor Proficiencies, Mk I 10 hours ago graemedavis WFRP 1 Memories: Deities and Religion, Part 3 10 ho