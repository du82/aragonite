full_description = '''Wednesday, November 28, 2018 What's a 'demon' anyway? Recent post here with my first reaction to Paizo's Book of the Damned. You should also try reading THIS post from Against the Wicked City, and the "conceptual density" one linked on the side of the page. I find ATWC pretty accurately drills into some of my objections with Pathfinder's setting. ***** Sometimes the Book of the Damned has really cool ideas. They are often in the smaller paragraphs of hints or suggestions. The most fun I've had reading this book is in the section on infernal dukes, qlippoth lords, kyton demagogues, nascent demon princes, etc. Pages upon fucking pages of entries like this, most which could be the inspiration for a super-cool demon cult. The kyton demagogue Fharaas: As one might read a tree’s years in the exposed rings of its stump, followers of the Seer in Skin divine all a mortal’s days by scrutinizing the whorls and layers within its flesh. Some even teach that, if a destined bond exists, a killer’s life is reflected in a victim’s fateful meat. Pretty cool right? Other times, Paizo's style really makes me sad: Orcus is the ruler of this realm of frozen seas, haunted cities, infested swamps, and ragged mountains... The demon lord’s minions include powerful liches and undead-demon hybrids that populate necropolises and ruins across the realm. What in the hell ass is an "undead-demon hybrid"? I just... ugh. Words fail me. If the word 'demon' means anything at all, how can such an entity be undead too? This is what happens when design decisions are made by what we might call "restricted association." The nearest related thing. The shortest possible distance between two points. Demon prince of undead? Put in a necropolis! Never mind the question of who/what could possibly be buried in a necropolis IN THE ABYSS. Or who the fuck built it in the first place. It's just meaningless window-dressing. Style without substance. How can you tell me that someone actually thought about this before writing it? I guess this is my fundamental objection to extraplanar settings in D&D generally. Planescape fought against this mightily, but detailing these ineffable realms could only go one way, eventually. It reduces them to human terms. Hell - by definition the worst place that could possibly exist, the very inferno of damnation itself - has mountains, cities, marketplaces, forests, houses, graveyards and even sewers! All the same terrain that clutters the normal world, only the inhabitants have red skin and horns. I find this deeply vexing, and I wish some more imagination could have been put into these other dimensions. On the other hand, Moloch does look fucking awesome. JOIN THE LEGION That guy makes me want to sign up with the forces of darkness. Also on the upside, the book has SO MANY demons in it that I could pick a handful for every campaign I run and never exhaust it in my whole life. That's the strength of the book. It's a big multiverse and the weird, almost throwaway nature of the one-paragraph entries I find most exciting. Like someone at Paizo got stuck with writing pages and pages of minor demon prince filler entries and said "Fuck It, I'm going to have fun with this!" Maybe in Land's End I could team Orcus up with: Shax, the Blood Marquis; Zurapadyn, the Beast who Waits in Smoke; Slandrais, the Watcher in the Walls; Jiravvidain, the Duke of Fissures; or Sugroz, the Voice in Screams? Now I'm actually getting excited! ***** Let's listen to something ACTUALLY demonic for once: Posted by HDA at 7:41 PM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, Pathfinder, reviews Saturday, November 17, 2018 Sage's Report 1 - The Jaguar-Headed Idol Last session, Vuk Thuul the snake oracle saved up enough money (2000 silver) to pay the sage Vantadel for his first question. The wild half-elf wanted to know the origins of his savage cannibal tribe and the mysterious idol they worshipped - a crude statue of a man with a jaguar's head. This is what I sent the player: ***** "Much ink has been spilled over the antediluvian fall of the elven race. To your situation, very little pertains anymore. It is enough to know that your tribes have occupied their lowly estate for generations upon generations, scrabbling to survive at the edge of the world. The human side of your lineage is anyone's guess. Mayhap one of your ancestors was captured in a raid, or was an outcast from Imperial society. Regardless, I wager all your kind are of similar mixed blood these many years. As for your specific tribe I have no answers. You speak of cannibalism and sacrificial midnight rites - things the long-fallen are not known for. They raid and fight, especially amongst themselves, but keep to their old ways where they know how. I glimpse the taint of Chaos in this news, and I fear for your own future and that of your friends. You know the world warms with every passing year. Rivers run high with snowmelt and crops wither beneath the sun. I am older than you by far. I remember a different age when each season kept to its own quarter of the year, not overstepping its allotted time. Even then, some parts of the world were hotter. In the distant south beyond the reach of the Imperium, beyond your ancestral hunting grounds in the badlands, a hot and misty jungle lies. The cloud forests you visited beyond the eastern Barrier resemble the scattered reports we have of this southern land. Men lived there who bowed not to Seheitt nor any other emperor. Wild and free, as the long-fallen are, they owned only what they could take with their own hands. Few things these men feared. Only one could be understood by our expeditions. We have no word in our language, in theirs it is forvalaka. Beasts of the jungle that stalk men with human intelligence. So fast and strong that they could pounce upon a hunting party and tear them to pieces in seconds. Impervious to weapons. Impossible to kill. Feared by all. Animals, spirits, or demons? Their exact nature wasn't understood. Some described insubstantial ghosts, who became solid only to attack. Others said they live in the water, or in the trees. The only coherent reports we have describe them as mighty black hunting cats who stalk the jungle on all fours, but can walk upright like men. I believe this is what your tribe's idol depicts. The southern jungle-men said the entire evil race was destroyed by a great magic, cast by their shamans and sorcerers. Although the nature of this spell is unclear, their language seems to indicate a bane or curse was laid on the monsters since direct attacks were near useless. How this idol left the jungle, crossed the badlands and came into the hands of your people, I cannot say. I fear its arrival cannot be coincidental. Old forces may be stirring, wakened by the return of hospitable climes and brought on the hot southern winds to our quiet homeland. Yours, -Nicomaeus Vantadel IV, esq. PS: I must apologize for the vagueness of these reports - our information on the southern lands is limited by the language barrier attendant on all contacts with this distant culture and the rarity of expeditions returning home." ***** These hew fairly close to the ones from the Black Company. Sorry/not sorry. If more people cribbed from those books, it would be a badass-er world. Of course, the idol that Vuk Thuul's elf tribe worshipped is one of the last forvalaka, turned to stone by magic. Maybe it became un-petrified and ate his whole tribe? Maybe it's coming after him now? I haven't decided yet, but... probably. [Stats will be similar to the Jaguar from the Tome of Horrors, but tougher, more HD and a bit magically-enhanced. Lycanthrope "templates" in Pathfinder are fucking annoying, I want a monster I can use right out of the book. They need AC enough that a veteran soldier has little chance to hit. Strong and accurate enough to kill a plate-armored man with one claw, fast enough to kill more than one man in a round. Magically protected enough or with enough hit points that humans with standard weapons have a bitch of a time killing one, even in large numbers. I'll post the stats up later when I finalize and playtest them.] Get on your motorcycle and crank this up!!! Posted by HDA at 9:47 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: black metal, Land's End, play reports, thrash Friday, November 16, 2018 Tweaking the random encounter tables I have been reading the Alexandrian and thinking about dice probabilities (both highly worthwhile pursuits). His series on hexcrawls is fantastic and has given me a great format to follow for my random encounter tables, where before I was really haphazard (every region had something different). I can trust that guy to present information that is useful, battle-tested, well thought out and incorporates knowledge of the underlying math. The Numbers As for dice probabilities, I have always flip-flopped on how to spread out the chances of running into each monster on a random encounter table. Rolling 2d6 gives you a 'pyramid' distribution (it's unlikely you'll meet those monsters on 2 or 12), which I always liked. You can hide some really evil, nasty beasts under those numbers. But just what are the chances, really? Well I looked it up. Bookmark that one, you'll thank me later. This pyramid is actually steeper than I thought at first glance. Rolling a 7 is six times more likely than rolling a 2. I think these numbers (6/36, etc) are the limit of the kinds of probabilities that are easy to imagine and manipulate in your head, without writing them down. In fact, I think it's too granular, in a way. Let's compare two possible random encounter tables and see how much I care about the details... This is the table for the Rainy Jungle as I used it last session. You can see there are a few oddities that could be fixed: 2d6 2-3 - giant bee (3/36, 8.3%) 4 - 1-2 giant geckos (3/36, 8.3%) 5 - 1-3 neanderthals (4/36, 11.1%) 6 - 1-3 giant botflies (5/36, 13.8%) 7 - 1-3 goblin hunters (6/36, 16.6%) 8 - 1-6 capybaras (5/36, 13.8%) 9-10 - 1-3 steam beetles (7/36, 19.4%) 11 - 1-2 orchidmen (2/36, 5.5%) 12 - roll 2x and combine (1/36, 2.7%) Why are steam beetles so popular/? Because the probabilities are in 'chunks'. I can't freely add or subtract 1/36th to any result, except by adding 2 + 3 or 12 + 11. If I have less than 11 results, some have to group up and this creates odd 'lumps' in the probability pyramid. The 2d6 table works well when you have exactly 11 results. Any less and it becomes really awkward to use. I *could* move goblin hunters to the 9-10 spot and steam beetles to 7, but this seems needlessly fiddly and annoying to format. Is there a better way? Let's change it to a straight d20 roll and see what happens: 1d20 1 - 1 giant bee (1/20, 5%) 2-3 - 1-2 giant geckos (2/20, 10%) 4-5 - 1-3 neanderthals (2/20, 10%) 6-8 - 1-3 giant botflies (3/20, 15%) 9-11 - 1-3 goblin hunters (3/20, 15%) 12-14 - 1-6 capybaras (3/20, 15%) 15-18 - 1-3 steam beetles (4/20, 20%) 19 - 1-2 orchidmen (1/20, 5%) 20 - roll 2x (1/20, 5%) The probabilities are almost the same (within 3.3%), and I can fit the same number of monsters. But all of a sudden the table is much more adaptable. I can modify a result in the middle of the table (like making the goblins 5% more or less common) without having to rework everything! The small downside is that I can't have a 2.7% result for the REALLY rare monsters. The smallest unit is 5% but that's a fair trade for versatility, ease of use and less mental math. 5% is the chance of a critical miss, so there is a nice symmetry in it also being the chance of rolling the blood-mad Wights of the Murderous Moors, or whatever harshness is on your table. The Monsters Can you feel... the danger? Random encounters haven't happened often in the last few sessions (my dice seem to love going easy on the players). Given their rarity, I have decided to move away from the more 'naturalistic' monsters. Having the only random encounter in a three- or four-day expedition through the steaming jungle wilderness be with mundane capybaras (pictured) is a bit weak. Even if they should be there for 'realism', the encounter can at least be with giant capybaras the size of VW buses, or vampire bats instead of a swarm of normal bats, or sneaky camouflaged giant chameleons with 25' long tongue attacks (that's a cool one actually...) instead of plain giant lizards. Capybaras can be the kind of thing you hunt for dinner. So here's my rectified random encounter table with better monsters and everything streamlined a little bit. Thanks again to the Alexandrian for this. 1d20 1-3 - 1-3 goblin hunters 4-5 - 1-3 neanderthals 6-8 - 1-3 giant botflies 9-11 - 1-3 steam beetles 12-14 - 1 man-mantis [2-HD version of giant mantis] 15-16 - 1-2 giant chameleons 17 - 1 jungle bear (hairless) [too good not to use!] 18 - 1 giant bee 19 - 1-2 orchidmen 20 - roll 2x and combine Now the monsters are a bit more exciting. Nothing you could actually encounter on Earth (a few variations are okay). I'm going to do all my random encounter tables in this format. It's customizable and has just enough granularity for me to work with, not so much that it takes any mental strain to manipulate. ***** I'm on fire this week. Let's see what's on the playlist next? Posted by HDA at 8:02 PM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, death metal, Land's End, Pathfinder, tables Thursday, November 15, 2018 Play Report: Return to Land's End - Sessions 3 & 4 CAST OF CHARACTERS: Vuk Thuul - level 1 half-elf snake oracle Leliana Vess - level 1 sylph witch Nahash - level 1 lizardman barbarian ***** A Big Score When we left our adventurous trio, they were in the goblins' basement treasure room digging through all the cool stuff they had found. Nahash used his cheap 50' rope to strap the two treasure chests to his back. Throwing the last of their hacked-apart neanderthal corpses outside the room distracted the two surviving anemone men enough for the PCs to escape the basement. Imagining themselves safe, they barred the door and rested for the night to recover spells and a few hit points. At this point the wildmen leader snuck into the inn in the dead of night seeking revenge. Nahash heard something, and crept upstairs to investigate. Unfortunately lizardmen don't have darkvision, so when he saw a pale shape moving in the darkness and lunged with his spear, he succeeded only in crashing into a pile of furniture and waking up the other PCs. Lucky for him, since the wildmen leader's greatclub smote him fiercely for 12 points of damage, leaving the seemingly-indestructible 15-hp barbarian close to a KO. Leliana woke up, ran into the mix and one sleep hex later, Vuk Thuul knifed his ass and everyone went back to bed. The next day the PCs headed back home with the treasure. [The wandering monster tables were quite le'''
