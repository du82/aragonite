e, scapegoat, scathe, scion, sclerosis, scour, scrag, scrimshank, sebaceous, secession, secretion, secular, semblance, seminal, seminary, senile, sepulture, serpentine, serrate, servile, shade, sham, shamefaced, shanty, shoddy, shorn, shrill, shun, silage, silvanus, simulacrum, sinuous, sitar, skewbald, slander, sluice, smattering, smock, sneer, snide, sordid, spawn, speculum, splay, spume, stagnant, stagnate, stake, strangulate, strigil, stub, subjugate, suction, sulphur, supernaturalness, supremacy, surge, suture, swagger, swamp, swank, sweat, swill, syringe, taboo, taint, tallow, tangible, tardy, tariff, tatty, temerity, temperance, tenuity, terret, terrify, tether, thane, theurgy, thews, thorn, thou, threshold, throb, throng, thuggery, thy, titillate, topsy turvy, torpid, tortuous, totem, toxin, tractable, transform, trauma, tremulous, trigon, trotter, truncate, truss, tumulus, turgid, tyrant, ugly, ulcer, ululate, umbral, undulate, unhallowed, unman, unravel, unspeakable, uproar, usury, utter, vainglory, valgus, vapid, vault, vegetal, venerable, vengeance, verdigris, vigilance, violate, viridescent, virus, viviparous, voiceless, volition, voluble, vulgar, vulnerable, waif, wan, wangle, warn, watchfulness, waxen, wean, wheedle, whorl, widow, widower, wince, wreath, writhe, xanthous, xenophobia, xiphoid, xylograph, xylophagous, yearn, yule, zeal, zealot, zenith, ziggurat, zounds."This is reproduced verbatim from a single page of the book. Somebody over there at Paizo has their head on straight! Gygax probably knew every single one of these. Gene Wolfe sure as hell does. I'm sure I don't, but I'll update this when I learn them all. Posted by HDA at 9:00 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Gygaxian, Pathfinder, teachable moments Monday, July 16, 2018 The Henry Justice Ford Monster Manual: GIANT, LUNAR A dude on G+ is doing a Monster Manual of only Henry Justice Ford illustrations. I love that guy's work, so I thought I'd get into it. I don't know the story this picture is from, but it gave me an idea: ***** GIANT, LUNAR AC: as chain + shieldHD: 8Move: normalAttacks: huge knife (1d6+2) or curseNo. Appearing: 1Morale: 10Treasure: a perfectly intact head could sell for HPx100 GPAlignment: varies The Lunar Giant is rare and its existence debated by scholars. Some think it is a single species whose heads change with the moon's phases, but in fact there are three types. During the day, they hide in dungeons or underground lairs, only to emerge at night. Full-headed Giants are Lawful, and the most common. The light from their heads acts as true moonlight (for lycanthropes, etc) and is equally bright. They are usually accompanied by 2d4 giant moths, and a cloud of the mundane variety as well. They are intelligent, patient, sad and lonely. Half-headed Giants are Neutral. Part of their head is always dark, while the other radiates moonlight like a Full-head's. The halves slowly rotate throughout the month, sometimes the dark side is in front, sometimes behind. Their disposition is equally changeable - you never know how a Half-head might react. Full and Half-heads can curse their opponents so the moon's light will always seek them out: even deep underground, they will glow with soft moonlight (15' radius). They never get lost in the dark, but predators can always spot them and stealth is nearly impossible. The Chaotic New Giants, called the Eclipsed, those whose moon-heads are occluded in shadow, are the rarest. Their heads devour all light: any illumination in view of an Eclipsed will begin to fade away, as if it were burning out 50 times faster. They can bestow a portion of their power in a curse of darkness: from now on, light can't actually touch you. It makes you effectively invisible, but you are blind. ***** PS: why can't blogger just leave the text alone? I just want to pick one font and leave it that way. It keeps changing things for no reason, and every time it happens in a different way! PPS: This is released under a CC-BY license: https://creativecommons.org/licenses/by/4.0/ Posted by HDA at 1:53 PM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, henry justice ford, monsters Monday, July 9, 2018 The Tomb of Abysthor - pt 1 - Overview & Wilderness I was looking for modules to cram into the wilderness game, and wondering if they are even worth the bloody effort. Those old Necromancer Games adventures (and their Frog God Games updates for Pathfinder), like The Tomb of Abysthor? I talk a big game about using them. But the inferential distance is... vast, at points. Can I tweak it just a little bit - enough that it would make sense to include, and be worth the effort? ***** WHAT DO? ***** MAPS / LAYOUT The maps are one of this module's main strengths, the dungeon has plenty of twists and turns. Nothing to complain about here, if I had to I could just steal the maps and happily write my own dungeon. GODS / BACKGROUND Orcus'''
