["https://terriblesorcery.blogspot.com/2019/05"]
title = "My Terrible Sorcery Is Without Equal In The West: May 2019"
full_description = '''Friday, May 31, 2019 MAILBAG - My first published thing! It's here! In the dying days of the legendary Google+ I jumped in on this project spearheaded by Eric Nieudan. I finally got my own copy, and it's just awesome. 40+ monsters created by 16 different contributors, including one very cool monster written by THIS GUY! This is the first time I've ever had anything published in print and I feel great, even though my parents will never understand. There will be no "review" - the PDF is free on drivethru and the print version is only six bucks. So go download it, give it a read and buy it in print if you like it. Eric gets some money from each copy for all his hard work! Posted by HDA at 11:00 PM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, I did it!, Labyrinth Lord, teamwork Monday, May 20, 2019 It's no reskin off my nose So d4 caltrops had a great post about just using goblins for everything. Go check it out. Originally inspired by the absolute classic just use bears from TOTG&D. I am a big fan of reusing and reskinning monster stats. I mean in classic editions it doesn't matter much either way - you can create a "brand new" stat block that's only barely mechanically different, or just reuse an existing one. Your players will barely feel the difference, probably. In Pathfinder which my roommates like to play, it's a necessity. I would rather drive my car into the sun than sit down and tinker with all those fiddly rules when I could be using my imagination, so I need to either a) buy more monster books, b) develop the "pathfinder lite stat block (TM)," or c) adapt the monsters I already have to the creatures I make up! In that spirit, and because I've been thinking about it for a while anyway, let's draw up a little list. This is, I think, all the OGL monsters that have stats in every numerical edition (0-5th). Surely enough that you'd never have to create new stats whole cloth again, yeah? ***** 0-5 UNIVERSAL MONSTER RESKIN LIST I started with the LBBs, then checked against Labyrinth Lord, AD&D, Pathfinder and 5th edition (anything in AD&D should realistically be in every other edition, but a few things didn't make the OGL cut and 5th was oddly missing a few as well). What's left: Animals* Basilisk Black Pudding Centaur Chimera Cockatrice Djinn Dragon Dryad Dwarf Elemental Elf Efreet Gargoyle Ghoul Giant Gnoll Gnome Goblin Gorgon Gray Ooze Griffon Hippogriff Hobgoblin Human Hydra Invisible Stalker Kobold Lycanthrope Manticore Medusa Minotaur Mummy Ochre Jelly Ogre Orc Pegasus Purple Worm Roc Skeleton Spectre Treant Troll Unicorn Vampire Wight Wraith Wyvern Zombie *Only technically. OD&D doesn't give you stats, just a suggestion for the animals' HD range based on size. Those LBBs were damnably vague on a few points, that's for sure. Terribly, there are no actual stats for bears in OD&D. Still, we end up with a really tight list of monsters of varying sizes, shapes and attack methods. This is almost a Platonic D&D Bestiary. Let's break em down by category: Humanoids Goblin, Kobold, Orc, Gnoll, Hobgoblin, Troll, Ogre, Minotaur, Giant, Human, Dwarf, Elf, Gnome, Medusa, Centaur, Dryad Beasts Basilisk, Chimera, Cockatrice, Gargoyle, Dragon, Gorgon, Griffon, Hippogriff, Hydra, Lycanthrope, Manticore, Pegasus, Purple Worm, Roc, Treant, Unicorn, Wyvern Undead Skeleton, Zombie, Ghoul, Wight, Wraith, Spectre, Mummy, Vampire Slimes Black Pudding, Gray Ooze, Ochre Jelly Elemental Djinn, Elemental, Efreet, Invisible Stalker Honestly this is still too many monsters to memorize stats for. You could pick only one humanoid of each size eg: kobolds, humans, trolls, giants. That's a cool set right there. Memorize those stats for the system of your choice, and then spend the rest of your day working on the cultural finer points for the macaque-men in your new module, secure in the knowledge that whoever may play it has the stats in their monster book at home. All the non-horse monsters with four legs: basilisk, chimera, dragon, gorgon, griffon, hydra, manticore. That's a great selection for any large beast - take the manticore's stats and swap out the tail spikes for a lightning bolt, there's your behir. See how easy it is? The list of slimes is a bit lacking for my tastes, if only because these three are all highly dangerous. It's still easy enough to say "Stats as a 2HD black pudding." If we remove OD&D and only focus on 1st edition and up, the list gets much longer (that's a post for another day though!). Next time you're writing a module, you can reference the stats for any of these creatures and rest assured that everybody will have them lying around. It doesn't matter which version of the game you play, you're ready to go. ***** Spin this while you're writing up that lost temple of the Ancient Ones that you've been putting off: Posted by HDA at 1:12 PM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, monsters Saturday, May 18, 2019 Summoning Rules Once again, check up on these first: Fire on the Velvet Horizon Textual Corruptions and Ritual Disasters Summoning The Book of Six Circles All Are Writ in Blood ***** Rules For Summoning with Absturated Tomes Introduction here. The one and only Timo Ketola Skim through all those links yet? Good. Here are my adapted summoning rules, more or less based on all the stuff above and adapted for my home game. Let's check it out: Faded Ink, Missing Text - There is a chance the tome has become worn through long years of inactivity, its bloody inks becoming difficult to read or vanishing entirely. Roll percentile dice against the "% faded" number for each ritual in the tome. Any results above that chance are fine - no problems. A result under this chance indicates enough missing text to cause a problem for that particular ritual. Note down the percentile die result: this is now the target number to beat (see below). Then roll on this disaster table to determine what goes wrong when the conjurer attempts the corrupted ritual. Anyone reading through the book gets a DC 20 spellcraft check to notice something is amiss (assuming the book doesn't come out and TELL you - not all these tomes are talkative). Recovering Lost Text - The book needs blood, for it is alive - in a way - and can re-write its contents through absorbing vital fluids. Every HD of sentient being (INT > 3) sacrificed to the book will reduce the "% faded" by 5%. These improvements to a tome are permanent (in the span of most adventurers' lifetimes, anyway). Once the "% faded" chance is below your target number (noted previously), the ritual is totally safe to use. Sacrifices that do not make it to the target number are still useful. Each sacrifice allows a re-roll on the disaster table with a -1 modifier per HD, although results will never go below a 1. Kind DMs might elect to keep an old result if the new one is worse, but this is your call. Or you could just add the modifiers to your previously rolled result. Red Herrings - Millennia-old sorcerers preserved in book form do sometimes fuck with you. Occasionally extra steps in the ritual or additional components will be listed that aren't actually necessary. These will never lead to a disaster, but cost more money and time and generally make life more difficult for PCs. Extra Clues - If the conjurer sacrifices enough to bring the '% faded' chance to 0, some useful detail will appear - perhaps an extra magical component, an extra verse of the incantation. It will grant the conjurer a bonus to his skill check when conducting the ritual itself. [These are specific to each ritual and detailed in their individual entries] Summoning - Once the conjurer has the necessary components, he performs the ritual. Assuming no disaster occurs as above, he must make a skill roll. The DC varies, each entry will have its own details. The text of the tome itself includes information on its difficulty and how likely the conjurer is to succeed. [You can tell the player what target numbers he needs to roll] The outcome will be one of three things: Success: The player made the roll.The ritual works. Great job! Now the conjurer can summon the entities involved anytime, with the relevant spell. Partial Success: Failing the roll by a margin of 5 or less. The ritual worked, but the conjurer's control is not total. Something will go wrong. Maybe not right now, but eventually. Failure: Failing the roll by 6 or more (or rolling a natural 1). You're screwed! ***** The first summoning tome in my game world is called Tanith Loraxalin. More information can be found in part one of this series. This is the first binding ritual detailed within: Binding of the Men of Peace (0% faded) Gentle dwellers of damp underworld caves, these humanoids are short and reptilian with translucent bluish bodies. Also called "Anemone Men" because instead of heads, a cup of glowing fronds opens up from their necks. These can stretch out a great distance, and the Men of Peace use them to sense vibrations nearby, allowing them to "see." They aren't malevolent but every part of their bodies is extremely poisonous. The ritual itself is one of the simplest as these things go. It must be conducted in total darkness, mimicking the nighted caverns where the Men of Peace sleep. The slightest glow from moon, star or torch will prevent their appearance. In this darkness the conjurer pours out a pool of shallow water, covering at least a 20'x20' area. Placing several hunks of raw meat on the ground, he intones the words, tempting the Men from their sleep to come and feed. A soft blue glow will emanate from the water, one rarely seen above ground. In this light alone the Men of Peace will come, and if his offering is accepted they will remember it even in their deep dreams and come at his summons in the future. Mechanics: The minimum level for performing this ritual is 2nd. The player makes a DC 16 check with a bonus equal to: character level + spellcasting stat modifier (INT, WIS or CHA depending on class). Success: The Men of Peace will appear and feast on the offering. Later, they'll recognize the conjurer in their dreams. He can summon 1d4 by casting Monster Summoning I, and none will ever attack him. Unlike other summoned creatures the Men will remain indefinitely until destroyed. Mostly they just sleep, and like to stay in one area instead of following the caster around. As long as they remain summoned the conjurer cannot regain the spell slot used to summon them. It is bound up with their presence. When they are all destroyed or banished he may memorize a new spell normally. In addition, summoning the Men of Peace does not give the caster any special power to 'banish' or dismiss them. The only way for them to leave is to destroy them. Anemone Men: AL Neutral, Init +1, Per +8, Reach 10', Move 20' 2 HD, Atk touch +1 (poison sting), Fort +6, Ref +1, Will +3 AC 10, BAB +1, CMB +1, CMD 12, Morale 9 Poison: Fort DC 14 (roll twice) - Pass twice, excruciating pain (1d6 damage & a morale check). Fail once, the blue sleep (dream-filled coma for 1d6 hours). Fail both, agonizing death. Partial Success: The Men are bound successfully, but the conjurer's likeness is forgotten in their deep blue dreams. When they are first summoned everything is fine. If the conjurer leaves their presence for at least a day, the Men will not recognize him in the future - treating him and his friends like any other trespasser in their territory. This process repeats anytime the Men are summoned. Failure: 1d4 Men of Peace arrive during the ritual, confused and half-awake. Not sure what is real and what a dream, they attack the closest thing that moves, attempting to sting it, remove its eyeballs and eat the rest. After a given Man has poisoned one victim and eaten a little, it wakes up somewhat and can make a reaction roll on this table. Red Herring: None now. Extra Clue: With this ritual completely restored, Tanith remembers the use of Mandrake Root. Growing in darkness and moisture in the shape of a human, this plant's magic resonates sympathetically with the Men of Peace. Obtaining a whole root and offering it along with the meat will add +2 to the conjurer's skill roll. ***** Example of Play Guzboch the goblin cleric of Tsathoggua wants to bind the Men of Peace - there is a standard 20% chance that Tanith's text for this ritual is faded or incomplete, but if he's lucky he can still pull it off. The DM secretly rolls a 3%, so missing text has caused a problem. Rolling on the original d20 mishap table, the result is a 16 - that's Not What I Expected! When Guzboch performs the ritual, the way is opened for an Abhorrer. Absalom Glop, the Excruciator, steps through the portal to make everyone's life miserable. After some soul-searching Guzboch sacrifices an underling to Tanith, reducing the chance of corruption from 20% to 15%. This is still well above the 3% roll, and Guzboch is going to need plenty more victims. However, the DM re-rolls on the disaster table. Too bad! A 19 is rolled, with a -1 modifier giving an 18 - You Will Never Be The Same! The goblin cleric has begun his slow descent into occult madness. Sacrificing a few more goblins, Guzboch brings the % faded to 0. Tanith also recalls that the ritual uses mandrake root, which grows in the dark near standing water. If Guzboch can find some, he will make his next summoning check with a +2 modifier. After a thorough search by his underlings, Guzboch has the mandrake root. He makes his DC 16 summoning roll with a +9 bonus: +4 for being 4th level by this point, +3 for WIS (this is the statistic he uses to cast spells - Wizards can't have all the fun), +2 for using the mandrake root. He rolls a modified 18. Finally, a success! The Men of Peace come to feed, and later he summons them to guard his treasure vault. ***** [In Land's End there really isn't anywhere the players can 'go research things,' unless they hand the question off to Vantadel, an expensive sage. I needed a different way for characters to solve the problems posed by corrupted texts and ritual disasters, and the absturated tomes of Incunabuli seemed a perfect fit! Be careful to avoid DM dick moves though, since the tomes can communicate with the PCs but may give them false information that could get them killed...] Next up, binding rituals for the rest of Tanith Loraxalin, and maybe ideas for some other terrible tomes scattered around the campaign world. I can't tell you how excited I am to have my home players deal with the presence of this terrible tome one way or another! Play this on your next dimly-lit dungeon crawling marathon: Posted by HDA at 9:58 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, fotvh, Pathfinder, shoulders of giants, summoning Tuesday, May 7, 2019 New Album Cover!! Look up there. Yeah, right at the top. It was long past time for a visual update around here. In'''
