rl += '&callback=bloggercomments'; var script = document.createElement('script'); script.type = 'text/javascript'; script.src = url; document.getElementsByTagName('head')[0].appendChild(script); } }; var hasMore = function() { return !!cursor; }; var getMeta = function(key, comment) { if ('iswriter' == key) { var matches = !!comment.author && comment.author.name == config.authorName && comment.author.profileUrl == config.authorUrl; return matches ? 'true' : ''; } else if ('deletelink' == key) { return config.baseUri + '/delete-comment.g?blogID=' + config.blogId + '&postID=' + comment.id; } else if ('deleteclass' == key) { return comment.deleteclass; } return ''; }; var replybox = null; var replyUrlParts = null; var replyParent = undefined; var onReply = function(commentId, domId) { if (replybox == null) { // lazily cache replybox, and adjust to suit this style: replybox = document.getElementById('comment-editor'); if (replybox != null) { replybox.height = '250px'; replybox.style.display = 'block'; replyUrlParts = replybox.src.split('#'); } } if (replybox && (commentId !== replyParent)) { replybox.src = ''; document.getElementById(domId).insertBefore(replybox, null); replybox.src = replyUrlParts[0] + (commentId ? '&parentID=' + commentId : '') + '#' + replyUrlParts[1]; replyParent = commentId; } }; var hash = (window.location.hash || '#').substring(1); var startThread, targetComment; if (/^comment-form_/.test(hash)) { startThread = hash.substring('comment-form_'.length); } else if (/^c[0-9]+$/.test(hash)) { targetComment = hash.substring(1); } // Configure commenting API: var configJso = { 'maxDepth': config.maxThreadDepth }; var provider = { 'id': config.postId, 'data': items, 'loadNext': paginator, 'hasMore': hasMore, 'getMeta': getMeta, 'onReply': onReply, 'rendered': true, 'initComment': targetComment, 'initReplyThread': startThread, 'config': configJso, 'messages': msgs }; var render = function() { if (window.goog && window.goog.comments) { var holder = document.getElementById('comment-holder'); window.goog.comments.render(holder, provider); } }; // render now, or queue to render when library loads: if (window.goog && window.goog.comments) { render(); } else { window.goog = window.goog || {}; window.goog.comments = window.goog.comments || {}; window.goog.comments.loadQueue = window.goog.comments.loadQueue || []; window.goog.comments.loadQueue.push(render); } })(); // ]]> Tamás KisbaliJune 6, 2019 at 12:01 AMQuote: "[The progress score] is a good idea, but I wonder how I would describe this to my players - "You feel closer to your goal"? "You're on the right track"? It's a somewhat dissociated mechanic. The PCs have no choice but to move through the dungeon and hope for encounters/loot that could increase their progress score, rather than analyzing the environment and deciding on their next move."In my Stygian sessions, I had some trouble with this as well. I used the ever-changing nature of the Library to explain some of the discrepancies (like a Librarian or even the main Catalog not being able to tell the exact place of a book). When they checked the Catalog, I told them that they find a shelf number, but they don't understand the Library's arcane six-dimensional cataloging system. When their progress score was already pretty high, I told them things like "judging by the serial numbers in this room, the book you are looking for is 3 or 4 rooms away".As a Referee, I was in a similar situation, because although I know their score, I don't know where will they end up when the score reaches the threshold :) This calls for improvisation.In one case, the players reached the needed score in the room with the printing press, so I ruled that the book they were looking for was damaged, and needed some repairs, and a couple of Librarians were printing new pages for it. The players had to snatch the repaired book from under the Librarians noses. This worked out pretty well.ReplyDeleteRepliesHDAJune 6, 2019 at 4:53 PMThat's a good one. Thanks for the story! I hope I can run this for my players and get a better sense of how it works.DeleteRepliesReplyTamás KisbaliJune 7, 2019 at 6:52 AMI have some session write-ups on my blog: https://eldritchfields.blogspot.com/p/actual-play-session-reports.htmlFor Part 1 of the Stygian Library I added some Referee-side commentary, so maybe that will be useful to you!DeleteRepliesReplyReplyJeremy "frothsof" SmithJune 11, 2019 at 2:57 PMGreat and helpful review; I am linking to it this week on my blog/podcast.ReplyDeleteRepliesHDAJune 12, 2019 at 4:51 PMAwesome!!DeleteRepliesReplyReplyAdd commentLoad more... BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html'); Newer Post Older Post Home Subscribe to: Post Comments (Atom) About Me HDA It's like, how much more black could this be? And the answer is none. None more black. View my complete profile Monsters Reviews Play Reports Nameless Cults Historical Weapon & Armour lists Most Liked! Lich Name Generator Table REVIEW: The Stygian Library Enemie'''
