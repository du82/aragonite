title = "My Terrible Sorcery Is Without Equal In The West: February 2017"
full_description = '''Friday, February 17, 2017 The Saints Have Turned to Crime: secret wars, sanity, and moral fiber in Arthurian D&D So I was at work the other day doing a routine and boring task, and my mind was wandering. I was moping around about the hideous and depraved life I live, when I had an inspiration: I decided to try thinking about D&D instead to cheer myself up. Almost instantly I felt better, and I began wrestling with a somewhat knotty problem: how to reconcile all the aesthetic elements of my setting? After seeing my inestimable comrade N. Manscorpion's beginning work on his own megadungeon, I was forced to conclude that my setting is too fractured. I can hold his whole setting, in terms of look and feel and vibe, in my mind all at once. I can't say the same for my own. Depending on where I turn it's grim black metal album covers and beheadings, or faeries with pointy hats sitting on toadstools conversing with guys in platemail and fair maidens. There's nothing wrong with having both in your game, but I really want something that I can visualize in its entirety. It helps with making decisions if I can instantly say "this fits, that doesn't." False Patrick has written about the difficulties of D&Ding in Arthurian England before (I have read this article a million times). I am sidestepping some of these concerns by placing my game in a "slightly more realistic" era, after the Roman occupation ended (somewhere in the late 400s/early 500s). I will be adding in anachronistic elements because it's not D&D without some of those (plate mail is still available, but insanely expensive and hard to find), but there is no renaissance fair, shining castles, bards in tights stuff going on. It's closer to Middenmurk (actually I will be shamelessly using 80% of that page in my game) than Camelot as it's usually depicted. Even so, we have King Arthur, magic swords, ladies of the lake, wizards in towers, goblins, dwarves, pixies, griffons and giants. How do I reconcile those with the fact that, a mere 50 feet underground, you can do battle with horrors from beyond the stars? Why don't those guys run the whole world? More importantly, why doesn't anybody talk about them, and what would life be like if they did? So there I was at work, doing something boring, when I flashed on it: Final Fantasy Tactics. For those who don't know, Final Fantasy Tactics was a classic Playstation game that succeeded the obscure gem Tactics Ogre, which itself was a sequel to one of the greatest goddamn games ever made: Ogre Battle: March of the Black Queen (if you have some spare time and like strategy games, all three of these are highly recommended). Anyway, I remember the storyline of FFT being really political (boring). The general thrust is that the main character, Ramza, leads a group of scruffy cadets to stop a world-destroying bad guy, you get the idea, regular stuff. While his childhood friend Delita commands the army, marries the princess, becomes king, and goes down in the history books as the hero of the Lion War, Ramza (whose eyes the player sees the story through) fights in utter obscurity. One of his comrades' diaries is discovered generations later and "the true story of the Lion War can be told." This is an easy one to translate! As long as those rugose cones, goatmen, and brain-eating jellyfish never venture above ground to threaten our existence in public, nobody knows or talks about them. The characters can fight, die and (maybe) win, gain experience, get rich and have cool adventures in the otherworldly hells of Annwn, but they won't ever get famous for it. To get a reputation, they have to do things outdoors in the open. Winning wars, slaying big classic monsters (ogres, giants, griffons, etc), bringing bandits to justice, fighting in tournaments, paying bards to sing songs about them and the like. This makes me think that instead of rolling "Wyvern" on the wilderness encounter table, it should be "The Winged Terror of Whatevershire." Something that relates to the social world where the PCs live, in a way that dungeon encounters don't. Only Warhammer Fantasy has the pictures I need. The fun thing about thinking along these lines is: if nobody talks about it, who's to say Arthur's knights didn't all gain their early levels in dungeons too? Lancelot can fight 30 men at once because after "Wargoat Fight Club" in a pool of boiling acid, everything else gets the volume turned down. Maybe he wanders the kingdoms alone "on quests" so often because he has fucking PTSD from his experiences, not to mention all the friends and comrades that he must have seen die down there? I had been thinking about using a sanity or horror system of some kind to represent the otherworldly terrors that the PCs will come in contact with, but haven't settled on anything good. The fear aura of some dragons or powerful undead is a good start, but I wonder if some kind of permanent 'mental scarring' can be made to work. I have no qualms about characters being permanently changed (in ways other than dying, HA!) from their trips to the dungeon, and I like the idea of going underground a wet-behind-the-ears 1st level pissant, and coming out rich, powerful and geared-up but with a 1000-yard stare, a few missing fingers, and no pancreas. Beedo's article on the subject from back in the day seems like too much for me: the PCs will be throwing down with hideous horrors a lot, and not everything they see should blast their minds. Nevertheless it's something that I'd like to bring into play somehow, especially as it relates to the "secret dungeon war." (I have also been thinking about player character mutations, but that really just requires a giant random table and a few failed saves.) Forever alone. Maybe all the "evil knights" are such dicks because once they got deep into the dungeon, they saw that not only is Jesus not the supreme deity, not even in the top three, but we live in an amoral mechanistic universe? Maybe Sir Meleagaunce went into the dungeon with Alignment: L on his character sheet, and came out C? Maybe he decided if he couldn't beat the eldritch horrors, he could still cut a deal? Maybe under his helmet he isn't entirely human? He can't look like the full-on Warhammer chaos knights, because then we may as well just play Warhammer and it makes things too obvious. Maybe just a weird mole or birthmark, a gross scar, something that sets him apart as weird or unnatural that you wouldn't necessarily see or notice. It's also worth noting that this is pretty close to what happens to Solaire of Astora in Dark Souls, so it's right where I want to be tonally. Maybe the reason Arthur is so perfect and good and has the best judgement and stands apart as kind of inhuman in his reasonableness and fairness (White touches on this in The Once and Future King) is that he gained all his levels at once from pulling the sword out of the stone, and he never had to go into a dungeon and watch his friends die and his dreams get slaughtered for a few gold pieces more. Sure he wages bloody wars against the Saxons, but everybody does that anyway. What makes the rest of the round table knights such good guys, and how do they rise up from being scruffy adventurers to the leading moral figures of the age? Lots of different ways. Some had prophecies going in their favour, some just grew up fighting wolves in the snow and never had to breathe in radioactive mists while the Cthulhu Cult stabs them with hot pokers, and some just made all their saving throws. As a wise friend of mine once said: "Being the good guy just means waking up better than everybody else." ***** Anyway, this has been a productive piece of musing, but now I have to go redo all my encounter tables and double the square footage of level 1. Play this the next time you need a bit of pagan pessimism in your game: Posted by HDA at 1:23 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Arthurian, Mythos, Spoils of Annwn, videogames, warhammer fantasy Thursday, February 9, 2017 Nameless Cults IV Here is another fun one. A bit simpler than the other cults so far, but "the old jokes are the best," as they say. THE ESOTERIC ORDER OF DAGON, or The Pelagic Knights of Y'Ha-Nthlei You knew this was coming eventually. No. Appearing: 1d6 Alignment: Chaotic Move: 120’ (40’) Armor Class: 14 Hit Dice: 2 Attacks: 1 Damage: by weapon Save: Fighter Morale: 10 Experience: 29 Serving one of the... ickier Ancient Ones, Lord Dagon of the deep kingdoms, the Esoteric Order is composed of former fishermen, captured and hypnotized sailors, the "mates" of the Deep Ones, and their Sea-Blood offspring. You know what they're here to do: get fresh with your human (or dwarf, or elf - they aren't picky) women and breed a vile half-aquatic replacement for mankind! Are you gonna let them do it, hot shot? They come armed with scraps salvaged from the deep, or tools of their former lives: tridents, cutlasses, nets, spears, marlinspikes and any other aquatic-themed weapons and rusty patchwork armour, dripping green with algae. This also means sometimes they carry fantastic treasure from sunken ships or old hoards fallen under the waves: maybe the jewelled cutlass of a pirate king, or magic items from fabled Atlantis. If parley could be made with the Order, they might show an enterprising adventurer the way to these treasures lost under the waves. Then again, they might just give them directions to a nearby pod of sharks, or a colony of hungry Deep Ones. Sorry mom. Sorry dad. Sorry HPLHS. The Order have dredged up many secrets from the deep, one of which is the terrible magic of unlife (most clerics and wizards don't know animate dead in my game). They frequently enter battle with the shambling corpses of drowned sailors and fishermen as shock troops (skeletons, zombies or maybe you have a favourite water-themed undead?). The Order's knowledge of these outre magics makes membership highly sought after in some quarters, although anyone willing to pay the costs of entry must be desperate or mad indeed. These undead servants will always be dripping with water and covered in seaweed, even if they've been standing guard in a dungeon for years. Make sure to mention the puddles of water spreading underneath them (just the thing to trip up a careless adventurer at the wrong time). They usually carry the tools, weapons and gear they did in life, having risen from the muck of the sea-floor exactly as they died. I am thinking that some clerics of the EOoD maybe have a forbidden ritual that turns them into some kind of aquatic vampire or saltwater lich, although what those might be I can't yet imagine... The other terrible thing about the EOoD is that they know where the Deep Ones make their lairs, and tend to build their temples nearby (usually in caves or grottoes accessible to the ocean) for ease of human sacrifices. A given temple will be led by a sea blood of level 3-6 and two sea blood acolytes of levels 1-3, all equipped with the best treasure and magic items the cult has scavenged. Remember: these dudes don't play around, and it could get real grim. Keep that in mind when you're running your own game huh? Posted by HDA at 2:00 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: Labyrinth Lord, monsters, Mythos, Nameless Cults Wednesday, February 8, 2017 Manscorpion / TERMINAL GODS In case anybody was wondering: I still get to name the blog posts. Now sit down as N. Manscorpion grapples the mic once again. I really wish I could add more pictures to these posts, but the interface keeps fucking with me and it won't work. Oh well. lairofthemanscorpion.blogspot.ca ***** The Crater of Termination: Gods and Religion The Chain has no shortage of gods, from the ancestor cults still popular amongst certain of the nobility of Xish, to the bloodthirsty warrior-gods, beloved of many of the wildermen tribes, whose worship is said to have gone on in one form or another since time immemorial. But all know the true Gods, even if, out of misguided fealty to lesser deities, they deny their supremacy. Their signs, or in some cases even they themselves, can be visited and witnessed (though only the most devoted or foolhardy would go looking). But the greatest proof that they alone of all gods deserve the name lies in the power granted to certain of their worshippers, a power which none of the followers of other so-called deities can claim: sorcery. Such magicks as these chosen few wield are even more terrifying and strange than those pursued by wizards in forbidden tomes, for they are bestowed through direct, mind-blasting contact with the god itself, and amongst the effects are unnatural power over the very forces of life and death. Clerics must choose a god from the below list, which also includes the most common or popular cult, church, or order devoted to the worship of each. Note that these are not the only options: many smaller sects devoted to each of these gods are spread throughout the islands. A cleric need not even belong to any order – the gods bestow their favour upon few, but their motives in choosing the ones they do are inscrutable. Anyone, from the most fanatical zealot to a casual fan, might be granted the powers of a cleric, and whether or not one belongs to any kind of organized worship appears largely immaterial. Occasionally, a complete non-worshipper, or even the devoted worshipper of another (lesser) god will receive the gift, accompanied with sanity-wracking dreams of visitation, alerting the hapless beneficiary to his new fate. Clerics are always Chaotic; all whom the gods touch are, in some way, tainted or corrupted. There is no distinction between Cleric and Anti-Cleric (as outlined in the OD&D rules) and as such no restrictions on Chaotic clerics (i.e. they can still turn undead, are able to cast all cleric spells, etc.). Null, the Devouring Star, the Annihilation Whisperer. The most widely-worshipped god in Xish, thanks in large part to the infamy of the Crater of Termination. Most worshippers hold that Null is literally a star: a particularly bright, red-tinged one which always appears in the same place in the sky, and can even be seen faintly during the day. A small minority believe that the star is not Null itself, but either the place where the god resides, or very close that place. Many worshippers, and even some non-worshippers, report visitations by Null in their dreams, where it always manifests as an almost physically tangible sense of hatred and contempt, accompanied by a dry, disaffected whisper. The message of Null, while often tailored to the individual recipient, is always, at core, the same: living beings’ right to exist on Null’s earth has been revoked, and they will all shortly be extinguished. Accordingly, worship of Null tends to coalesce around one of two poles: those who strive to placate the deity and thereby save life on earth, or at least themselves; and those '''
