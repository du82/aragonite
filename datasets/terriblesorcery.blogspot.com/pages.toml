["https://terriblesorcery.blogspot.com/2018/06"]
title = "My Terrible Sorcery Is Without Equal In The West: June 2018"
full_description = '''Friday, June 29, 2018 Starting Equipment & Doodads So, continuing my quest to make every game more like Dark Souls. I was thinking about the 'starting gifts.' Some are great, some useless. I took the Master Key every time because it allows you to skip the shitty part of Blighttown and really makes life easier. Since the PCs start with garbage Middenmurk-style weapons, maybe a table of 'inheritances' that could include decent gear would be cool: your grand-dad's old campaigning sword, piecemeal chunks of armour, stuff like that. Your fighter could start out with a pigskin jacket, rusty meat cleaver, and shiny platemail boots. Maybe he would rather sell them for rent money? Maybe other 1st level scrubs want to roll him for his old pop-pop's gear? Of course I would need to create rules for piecemeal armour, which seems like wayyyyy too much fucking work. In the mean time, I dug out this chart I saved of d100 random items in your PC's pocket. I did some digging, and Hack & Slash had a link to another one on his big link compilation page. These are great, and I will begin using them IMMEDIATELY. Posted by HDA at 12:23 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: blogosphere content, dark souls, equipment lists, Land's End, tables Sunday, June 24, 2018 Weapon Lists II - Primitive So I was brainstorming some other expanded equipment lists that might be around in Land's End. I am gonna use the classic Middenmurk peasant gear for starting humans and civilized folk, but some of the characters are from primitive tribes and they need some crap gear to start with. I have tried to hack down the pathfinder gear into a manageable form, while preserving a sense of mechanical variety between weapons. So in Land's End, elves and half-elves are second-class citizens in the empire, and basically live in the crappy parts of the world in states of near barbarism. My brother's oracle character is from one such tribe, so he'll pick from the feral elf list. The lizardman comes from the swamps beyond Land's End, so it'll take a bit of fiddling to get him into the group, but his stone-age weapon list is very similar, except I doubt they have much flint or stone to dig up in the swamps. Instead they trade for obsidian with the tribes to the east, who live at the foot of a mountain range. Obviously the lizardfolk weapons are inspired by Mesoamerican designs, and as my research on that topic progresses their arsenal will grow. ***** Note on weapon costs: I'm using silver pieces instead of gold or copper because it's a bit of a richer setting than Middenmurk, but gold is still an exciting find! Also, I'm not changing the starting equipment costs in the PFCRB, so the PCs will start out broke as HELL. And when the player is 'paying silver' for a stone axe, we can view this as an abstracted sense of their starting wealth and resources when they leave the house, not that they actually gave somebody a big sack of money for a crappy stone-age weapon... although, yknow, selling beads to the natives is a thing sometimes. ***** FERAL ELF WEAPONS/ARMOUR Simple Weapons Hunting Spear - throwable 25ft, shoddy - 1d6, 10 sp Sling - 50ft - 1d3, free Branch Club - hefty - 1d4, free Flint Knife - chips, light, short, crit 19-20 - 1d4, 15 sp Bone Knife - shoddy, light, short, crit 19-20 - 1d4, 10 sp Martial Weapons Flint Axe - martial, chips, critx3 - 1d6, 40 sp Stone Club - martial, unwieldy, shoddy, 2 handed - 1d8, 30 sp Light Armour Hide Shield - fragile - +1 AC, -1 check penalty, - 20 sp Wool Armour - fragile - +1 AC, +8 max DEX bonus - 50 sp Medium Armour Wooden Shield - medium, clunky, fragile - +2 AC, -2 check penalty - 50 sp Aurochs Hide Armour - medium, furry - +3 AC, +4 max DEX bonus, -3 check penalty - 110 sp LIZARDFOLK WEAPONS/ARMOUR Simple Weapons Bone Knife - shoddy, light, short, crit 19-20 - 1d4, 10 sp Branch Club - hefty - 1d4, free Hunting Javelin - throwable 25ft, shoddy - 1d6, 8 sp Atl-Atl - launch javelins 45ft - 15 sp Blowgun - 1d2, 10 sp -darts are 10/5 sp Martial Weapons War Club - 2 handed, unwieldy - 1d10, 15 sp War Spear - 2 handed, long, heavy, chips - 1d8, 30 sp Obsidian-bladed "Sword" - chips, crit 19-20 - 1d8, 90 sp Snaketooth Saw - chips, crit 18-20, armour-piercing - 1d8, *** Light Armour Palm-leaf Fiber Cuirass - fragile - +1 AC, +6 max DEX bonus - 40 sp Medium Armour Toad-skin Suit - slippery, FROGGY - +3 AC, +3 max DEX bonus, -3 check penalty - 110 sp Heavy Armour Crabshell Plate - slippery, awkward, fragile - +5 AC, +0 max DEX bonus, -6 check penalty - 1500 sp Tortoiseshell Shield - clunky - +1 AC, -2 check penalty - 55 sp *** - snaketooth saws are badges of merit, not for sale to foreigners or 1st level lizardfolk PCs. Maybe through story events a PC could be awarded one. WHAT THE TRAITS MEAN Here are the relevant original traits for Middenmurk peasant weapons, which I'll adapt for Pathfinder like so: shoddy: breaks on a roll of 1hefty: -4 to initiative unless wielder has a STR of 13 or moreunwieldy: -4 to initiative alwaysshort: -4 to initiative unless the combatants are grappling in which case +4long: +4 to initiative unless the combatants are grappling in which case cannot strikearmour-piercing: +1 to hit against medium and heavy armourTo this I have added: chips: on a roll of 1 OR maximum damage, weapon loses a bit of its edge and has -1 to damage. This can add up until the weapon can do no damage, then it breaks.Armour Traits: fragile: any time the enemy hits you with a 20, the armour gets -1 to AC. If this would lead to no bonus, the armour is wrecked. clunky: this shield is hard to move around quickly - only blocks attacks from 1 enemy per round slippery: you and your enemies both get -4 to grapple while you have this on awkward: this stuff is hard to put on & take off without help - 2x speed of plate mail furry: gets hot as hell in this armour, if in a warm climate you become exhausted 2x faster FROGGY: bullywugs, toadmen and others hate you on sight for wearing this. You smell bad, making it easy to track you by scent. ***** ALSO: I discovered www.paperspencils.com and love how this guy tries to beat the hell out of Pathfinder. He did the work so I don't have to!!! Along with -C's classic skill analysis, I am flogging the shit out of the skills and feats lists to simplify my damned life. I'll make it to a 'lo-annoyance PF' system soon enough!!! ***** Now it's time to SUFFER!!!!! Posted by HDA at 7:41 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: armour, death metal, equipment lists, Land's End, Pathfinder, weapons Sunday, June 17, 2018 DC:SS - Fair Warning I was thinking about Dungeon Crawl: Stone Soup again. I am getting tendonitis or something in my right arm, so to retain my ability to play guitar as best as possible I don't really use a mouse anymore. I can type if I'm careful but I have to take breaks all the time. So computer games are right out the window (just when I was getting into Morrowind!), can't really do artwork for my band's albums on the computer, I hardly even look at Facebook (thank god!!), stuff like that. But I remember a clever mechanic DC:SS (and I assume other roguelikes) had to offset the gross difficulty and no-save-games hardcore-mode lethality, and I think it would be a great thing to port over into D&D, especially in a wilderness hexcrawl or any kind of sandbox game where the PCs will be encountering the unknown and the weird, monsters that nobody has seen before, stuff like that. It's a simple mechanic - you can 'examine' monsters to get a bunch of information about them. The part I'm concerned with is 'it looks harmless' or 'it looks extremely dangerous'. Now in ToME (one of the best roguelikes ever, I LOVE that game), they get a little more flowery with it, like "a lump rises in your throat as you contemplate your doom"... We don't have to get that crazy. And I'm not concerned with the other stuff like "it's resistant to poison" or "it's intelligent." My PCs will still have to figure that shit out and take notes like everyone else. But when you're playing in a game with no orcs, the goblins are six different colours, and there are Moss Hogs and Star Grools and Sublunary Men and Randomly Esoterically Generated Creatures and fuck-all knows what else... This could be a great way to clue your players in. Think about the lich's fear aura, and stretch it all the way down in a continuum to that 1/3 CR giant rat.Tell the players if they feel scared of it or not. How confident are they that they could take this thing? Add it in to the weird monster description. Spice it up a bit! Your players can't make decisions without having useful information to act upon. This also sets up another great Gygaxian screw-job: get your players used to being told roughly how tough a monster is, then throw one in that is really weak but terrifying, or (even worse) a wienery-looking little monster who is absurdly dangerous. ***** A digression: it's total insanity that fighters don't have the ability to size up their opponents anyway - or at least I've never heard anyone mention it. Some real people who have never killed anyone can estimate the difficulty of fighting an opponent in hand-to-hand in the modern day. Imagine how good even a 1st level fighter should be at this, having snuffed out many sentient lives at the point of a sword? Maybe we reflect this by giving some class-based details from time to time. Tell the fighter "yeah, he doesn't seem that strong, you can take him." Or the wizard gets "his eldritch aura is so strong it blinds you!" Of course this could be modified by level and other factors (skill checks, if you have those). ***** This is part of assuming the characters are good at their jobs, and I don't want to get into a huge conversation about it, because some characters are lame scrubs and that's a whole game you can play too, if you want. Posted by HDA at 11:45 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: brainstorming, house rules, videogames Friday, June 15, 2018 Unlikely Allies, or Hail Sithis! Had a fun-filled trip to Toronto last weekend; my head still feels like it's in a vise. I guess even I need to sleep sometimes. Took me a while to pare this down to a decent idea: ***** Some of my roommates are playing Skyrim right now, so I tried it out. I haven't played an Elder Scrolls game since Daggerfall (in 2002 that game was already ancient history. Dear God!!). I remember having fun back then joining the fighter and mage guilds, crawling through dungeons, and contending with the god awful FPS sword fighting controls. So I made a mean-looking orc with no plan beyond using heavy armour and big weapons, joining the Champions, just being a good-guy fighter clanking about which seemed to be what the game was hoping for. It didn't work out that way. First it was the lycanthropy, but soon enough I was waging war for Malacath, backstabbing for Molag Bal and committing human sacrifice for Boethiah. I joined the Dark Brotherhood and slew beggar and emperor alike for hard cash. Now I prowl the countryside for friendly innocents whose souls can feed my Ebony Blade (it's basically Stormbringer, and gets more powerful when it kills allies & friends). Turns out, the bad dudes of Skyrim have the best quests and the hottest gear! BEND THE KNEE, MORTAL. ***** Everybody knows Elric, he is the classic good guy taking quests from an evil patron, and it works beautifully. Sticking to the simple law/chaos alignment axis of Moorcock and leaving questions of good and evil up to the hero's own conscience (you guys remember having one of those?) lets this work so well, and is why I always love simple L/N/C alignment in my home games. Because alignment is ridiculous - your belief system/personality/morality is also a set of super-physical laws that bind what you can do and how magic works on you, etc? Let's see a game with the protection from secular humanist spell. Actually I would play that, but it's not the point. When some of my gamer pals and I get drunk, alignment becomes the subject of argument so often it's a running joke. The best solution I have is to differentiate between the 'moral compass' portion and the 'cosmic allegiance/supernatural laws' portion. Alignment covers your cosmic affiliation in my game, and will change your religious options, magic items, some spells, and certain social interactions. In this way it's more like a 'cosmic vibration' than anything else. It will *not* prescribe which actions your character is allowed to take. Soooo you can be a Lawful piece of garbage (check out most LotFP material for lots of these guys), a Chaotic good guy like Elric, or anything in between. If you don't care about the gods or unearthly forces, or don't want to participate you can be neutral. So Skyrim had me thinking: what about PCs who say 'fuck it' and sign up for an evil cult to get fabulous cash & prizes? ***** In Dark Souls (my personal fave of course), you can battle your way through a crypt rammed with skeletons, wherein a coffin can be climbed into, taking you to their boss - Gravelord Nito - who promptly offers to sign you up for his covenant and give you a magic sword so you can fight other players online in his name! This doesn't give you any protection against his skeletons though, because everything in the game is trying to kill you. This feels weird, but makes sense in the game's milieu. Sign me up!!! I've spent a fair bit of time outlining the deranged cultists that hunger to crack the PCs' skulls open and feast on their very brains. I suppose what makes this idea cool in Dark Souls is what makes it difficult at the table though. A friendly (albeit hideous) face in the middle of the dungeon who is part of a normally dangerous faction, but is nonhostile. Usually, my players would expect to chop their way through a horde of foul monsters to encounter a boss, oversized beast or evil mastermind of some kind. To get there only to find a job offer is a bit of mental whiplash. Let's brainstorm: WAYS TO SIGN UP WITH THE FORCES OF CHAOS Divine Concealment: Maybe the god you think you worship is actually... something far worse. Could be the god you started with, or one you just stumbled across, and like an idiot started hanging out at their lost and forgotten altar. Desperation: Remember in Saga of the Swamp Thing when Arcane appeared to Matt Cable as a fly and saved him from that car accident by possessing him? (Holy crap, I just remembered how great Swamp Thing was). This is great if your PCs get in over their heads, as mine do quite often. Instead of a TPK or some other catastrophe, they get stuck with a new patron who wants some harsh tasks accomplished! Information: This is another perennial favourite around my place, as the dudes relentlessly interrogate everybody until they can't say any more. Just let it be known that you have information they want - all they have'''
