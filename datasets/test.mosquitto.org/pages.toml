["https://test.mosquitto.org"]
title = "test.mosquitto.org"
full_description = 'This is test.mosquitto.org. It hosts a publicly available Eclipse Mosquitto MQTT server/broker. MQTT is a very lightweight protocol that uses a publish/subscribe model. This makes it suitable for "machine to machine" messaging such as with low power sensors or mobile devices. If you are interested in your own hosted instance of Mosquitto you should look at the Cedalo offering. Cedalo are the company that sponsor the main development of Mosquitto. The encrypted ports support TLS v1.3, v1.2 or v1.1 with x509 certificates and require client support to connect. For ports 8883 and 8884 you should use the certificate authority file (mosquitto.org.crt (PEM format), or mosquitto.org.der (DER format)) to verify the server connection. Ports 8081 and 8886 have a Lets Encrypt certificate, so you should use your system CA certificates or the appropriate Lets Encrypt CA certificate for verification. Port 8884 requires clients to provide a certificate to authenticate their connection. You can generate your own certificate. Unauthenticated clients have access to publish all topics. Clients can also subscribe to all topics with the exception of the literal # topic. Connecting with the username wildcard will allow a subscription to # to succeed for 20 seconds before being automatically removed. This allows discovery of topics of interest. You are free to use it for any application, but please do not abuse or rely upon it for anything of importance. It is not intended to demonstrate any performance characteristics. This server is provided as a service for the community to do testing, but it is also extremely useful for testing the server. This means that it will often be running unreleased or experimental code and may not be as stable as you might hope. It may also be slow - the broker often runs under valgrind or perf. Finally, not all of the features may be available all of the time, depending on what testing is being done. In particular, websockets and TLS support are the most likely to be unavailable.'
year_published = 2025
clearnet = "https://test.mosquitto.org"
tags = ["access", "authentication", "caveats", "examples", "keep", "mqtt", "readonly", "readwrite", "running", "server"]
language = "en"
internal-references = ["none"]
external-references = ["cedalo.com", "eclipse-iot-wg.slack.com", "libera.chat", "mosquitto.org", "mqtt.org", "perf.wiki.kernel.org", "valgrind.org"]

["https://test.mosquitto.org/ssl"]
title = "Generate client certificates for test.mosquitto.org"
full_description = "This page allows you to generate an x509 certificate suitable that will allow you to connect to the TLS enabled ports on test.mosquitto.org that require a client certificate, i.e. port 8884. To use it, you will need to generate a PEM encoded Certificate Signing Request (CSR) and paste it into the form. After you submit the form, the certificate will be generated for you to download. The certificates are valid for 90 days. When you are generating the CSR, please do not use the default values. At a minimum, the CSR must include the Country, Organisation and Common Name fields."
year_published = 2025
