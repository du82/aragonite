["https://testingbot.com/cookie-policy"]
title = "TestingBot Cookie Policy"
description = "Cookie Policy by TestingBot. By using the TestingBot product and services, you are agreeing to this policy."
full_description = '''Cookie Policy TestingBot uses cookies to improve your user experience. What's a cookie? A cookie is a small file which is placed on your computer to remember your preferences. You can read more about cookies on AllAboutCookies How are you using cookies? When you first visit our website, our partner Google Analytics will set a cookie to track which pages you visit. Next to that, we will set a cookie to determine if you're logged in or not (session cookie). Once you log out, this cookie is destroyed. We offer online chat as a way to help you with your questions. This 3rd party provider also sets cookies to enhance your user experience. Cookie List Below is the list of cookies we use on TestingBot: Strictly Necessary Cookies These cookies are necessary for the website to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in or filling in forms. You can set your browser to block or alert you about these cookies, but some parts of the site will not then work. These cookies do not store any personally identifiable information. Cookies used Cookie Name Description Expiration _testingbot_gsession Keep track of whether you're signed in on TestingBot Until you close your browser remember_user_token If you enabled "Remember me" during login, we will use this cookie to remember your session. 14 days __stripe_mid Used by our payment provider Stripe. More info on Stripe's Cookie Policy. 1 year Performance Cookies These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our site. They help us to know which pages are the most and least popular and see how visitors move around the site. All information these cookies collect is aggregated and therefore anonymous. If you do not allow these cookies we will not know when you have visited our site, and will not be able to monitor its performance. Cookies used Cookie Name Description Expiration _gid This is used by Google Analytics. You can read more about it here. 30 days _ga Used by Google Analytics to identify unique sessions. 30 days Targeting Cookies These cookies may be set through our site by our advertising partners. They may be used by those companies to build a profile of your interests and show you relevant adverts on other sites. They do not store directly personal information, but are based on uniquely identifying your browser and internet device. If you do not allow these cookies, you will experience less targeted advertising. Cookies used Domain Cookies youtube.com SID HSID demographics VISITOR_INFO1_LIVE PREF APISID SSID LOGIN_INFO YSC SAPISID google.com APISID SSID NID PREF SID SAPISID HSID Social Media Cookies These cookies are set by a range of social media services that we have added to the site to enable you to share our content with your friends and networks. They are capable of tracking your browser across other sites and building up a profile of your interests. This may impact the content and messages you see on other websites you visit. If you do not allow these cookies you may not be able to use or see these sharing tools. Cookies used Cookie Name Description Expiration driftt_aid DFTT_END_USER_PREV_BOOTSTRAPPED driftt_sid To show the online chat functionality. 30 days This policy was last updated on April 16, 2019. Please see our Terms & Conditions and our Privay Policy for additional information.'''
