["https://tetralogical.com/blog/1"]
title = "Blog - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = '''Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Our Blog Dip into our blog and read the latest from the TetraLogical team. XR Accessibility: for people with hearing disabilities Posted on Tuesday, 1 October 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences tend to focus on providing immersive sounds and directional audio to convey information. But we need to consider how we convey the information in these experiences to people who can’t hear them. XR Accessibility: for people with thinking disabilities Posted on Thursday, 26 September 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences tend to focus on providing rich, visual content to convey information. But we need to consider how we convey the information in these experiences in a way that isn’t overwhelming, scary, or difficult to understand. XR Accessibility: for people with seeing disabilities Posted on Thursday, 19 September 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences tend to focus on providing rich, visual content to convey information. But we need to consider how we convey the information in these experiences to people who can’t see them. Introduction to XR Accessibility Posted on Wednesday, 11 September 2024 by Joe Lamyman in Design and development Extended Reality (XR) provides immersive experiences through detailed visual, audio, and multi-media content. When using these different types of content, we need to consider how we can communicate the same information to people with disabilities in order to make XR accessible to everyone. Foundations: labelling text fields with input and label Posted on Wednesday, 21 August 2024 by Demelza Feltham in Design and development In this post about forms, we explore how to effectively label text fields using <input> and <label> elements to create form inputs that are both accessible and user-friendly. Design patterns and WCAG Posted on Friday, 9 August 2024 by Graeme Coleman in Design and development The ARIA Authoring Practices Guide (APG) contains an extensive range of design patterns aimed at helping developers to create accessible web experiences using WAI-ARIA. However, while we encourage web authors to follow these design patterns, a common misconception is that their usage is a prerequisite for conformance. This is not the case. Does WCAG 2.2 apply to native apps Posted on Thursday, 18 July 2024 by Steve Faulkner in Design and development, Standards, Testing A big question for many organisations is if WCAG 2.2 applies to native apps. In this post we explore what does and doesn't apply. Why are my live regions not working? Posted on Wednesday, 1 May 2024 by Patrick H. Lauke in Design and development Live regions have a reputation for being "flaky" and inconsistent. While this can be attributed in part to shortcomings in current implementations, the problem can also be caused by developers misunderstanding how live regions are intended to work. Building a culture of accessibility Posted on Friday, 19 April 2024 by Felicity Miners-Jones in Strategy Accessibility isn't solely important in the final product; it's crucial at every step of the process. Adopting accessible practices from the outset unlocks your team's full potential. This approach not only improves the products you create but also nurtures a culture of inclusivity within your organisation and means your team will more accurately reflect the diversity of your customer base. When to use tabindex='0' Posted on Thursday, 4 April 2024 by Graeme Coleman in Design and development When tabindex="0" is applied to an HTML element, the content marked up using that element will become keyboard focusable, and is therefore a good starting point for supporting keyboard accessibility. However, applying this attribute haphazardly or unnecessarily can reduce the experience for people who use a keyboard or an equivalent input device to navigate web content. 1 2 3 4 5 6 7 8 9 We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com'''
