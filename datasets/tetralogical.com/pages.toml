full_description = "Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Our Blog Dip into our blog and read the latest from the TetraLogical team. Meet Josh: a sportsman who has spinal muscular atrophy Posted on Wednesday, 12 February 2025 by Henny Swan in User experience Meet Josh, a sportsman who has spinal muscular atrophy. Between training for the Paralympics and his busy day job, Josh talks to us about how navigating the web is constantly evolving, how he adapts to various assistive technologies, and his hopes and concerns for artificial intelligence (AI). Meet Jonathan: a photographer who has ADHD Posted on Friday, 7 February 2025 by Henny Swan in User experience Meet Jonathan, the photographer behind the portraits of all our models (links to their interviews below) for the TetraLogical website. Jonathan has ADHD (Attention Deficit Hyperactivity Disorder) and shares his experience browsing the web, including how distractions like cookies, pop-ups, and social media affect him. Foundations: grouping forms with <fieldset> and <legend> Posted on Friday, 31 January 2025 by Demelza Feltham in Design and development In this post, we explore how to use the <fieldset> and <legend> elements to group and label form elements effectively, creating a more accessible and well-structured experience. XR Accessibility: for people with moving disabilities Posted on Monday, 9 December 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences provide immersive experiences which tend to require movement based interactions. But we need to consider alternative input methods for people who can’t move. Meet Andre: a music producer and blind screen reader user Posted on Tuesday, 26 November 2024 by Henny Swan in User experience Meet Andre, a music producer and blind screen reader user who is not afraid to take his custom elsewhere if your site is not accessible. Andre shares his experience using the web including his love of headings and consistent design to help him navigate, and his dislike of accessibility overlays and poorly implemented page updates using live regions. Foundations: types of disability Posted on Monday, 18 November 2024 by Demelza Feltham in User experience This post offers an overview of various disability types across four groups: seeing, hearing, moving, and thinking, and provides a brief exploration of what disability is, highlighting how permanent, temporary, or situational disabilities can affect us all. Meet Lauren: a film editor who has ADHD Posted on Tuesday, 12 November 2024 by Henny Swan in User experience Meet Lauren, a film editor moving into the world of producing and production management who has ADHD (Attention Deficit Hyperactivity Disorder). Lauren shares what helps her stay focused when browsing the web and why white backgrounds and autoplaying video are not helpful for her. Meet Steve: a photographer who is deaf and low vision Posted on Tuesday, 29 October 2024 by Henny Swan in User experience Meet Steve, a photographer from London who is deaf and low vision. He is an ex-civil servant who then went on to do freelance technology journalism and travelled the world. Steve shares his experience of the web including increasing font size and using good colour contrast as well as the joys of using his Bluetooth headphones. Foundations: form validation and error messages Posted on Monday, 21 October 2024 by Demelza Feltham in Design and development As well as labelling text fields with input and labels, and grouping forms with the <fieldset> and <legend> elements, form validation and error messages are also essential to making forms accessible to everyone. Meet Hasmukh: a blind cricketer and screen reader user Posted on Tuesday, 15 October 2024 by Henny Swan in User experience Meet Hasmukh, a talented blind cricketer with lots of patience and determination. Hasmukh shares his experience using the web with a screen reader and highlights the importance of accessible emails, forms, language, and prioritising content within a web page. 1 2 3 4 5 6 7 8 9 We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
