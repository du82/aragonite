full_description = "Our services Our services are designed to give everyone what they need to make accessibility part of everything they do. Experience For people using technology Experience: five people, each made up of a circle for a head and a semicircle for a body. Four are bright purple and positioned randomly around a fifth at the centre who is bright orange and has three beams radiating from their head as they share thoughts and ideas with others. Services to make sure everyone using your technologies has a great experience. Assessments Design System Assessments Design Reviews User Experience (UX) Reviews Agile User Experience (UX) Testing Knowledge For people designing and building technology Knowledge: two people, each made up of a circle for a head and a semicircle for a body. One is bright pink and the other bright purple, above them is a speech bubble with an orange spark of a shared idea inside. Services to give people designing and building your technologies the knowledge they need to make accessibility part of everything they do. Helpdesk Documentation Training Classes Training Courses Training Programmes User Research Mentoring Strategy For people managing and delivering technology Strategy: a zigzag route in muted purple with a bright pink location pin as a start point, a bright orange circle and a bright purple circle as mid-points on each corner, and a red bullseye with a white centre at the end. Services to help people managing and delivering your technologies implement an effective accessibility strategy. Insight Reports Risk Analysis Recruitment Support Embedded Accessibility Sustainable Accessibility When I met them, the Ubisoft Accessibility Team was expanding its services from helping game teams delivering accessible products, to ensuring our end-to-end user experience was accessible through and through. This required a Web accessibility expertise we did not have in the team nor in the whole company. Thanks to TetraLogical's expertise and flexibility, we've been able to collaborate on multiple projects, using a tailored made approach to each challenge. David Tisserand, Accessibility Manager, Ubisoft We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
