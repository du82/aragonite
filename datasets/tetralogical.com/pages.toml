["https://tetralogical.com/blog/2024/03/13/meet-the-team-demelza-feltham"]
title = "Meet the team: Demelza Feltham - TetraLogical"
description = "Meet Demelza Feltham, the accessibility aficionado whose infectious enthusiasm pairs perfectly with a touch of Scottish charm."
full_description = "Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Meet the team: Demelza Feltham Posted on Wednesday, 13 March 2024 in Meet the team Meet Demelza Feltham, the accessibility aficionado whose infectious enthusiasm pairs perfectly with a touch of Scottish charm. Like many of us, Demelza's journey into the world of accessibility wasn’t entirely planned and came about through a happy twist of fate. Demelza started out as a yoga instructor, running a successful business guiding others through their sun salutations at classes, retreats, and events. It was during her yoga sessions at Skyscanner that she met Heather Hepburn, (now Skyscanner's digital accessibility lead). The pair swiftly became friends and Demelza felt the familiar pull towards making technology more inclusive. Demelza went on to hone her skills as an Accessibility Analyst at User Vision, where she conducted audits, supported user research, and co-ran empathy labs (a carefully curated space where individuals can immerse themselves in the experiences of others). Nowadays, you can find Demelza championing accessibility as an Accessibility Specialist at TetraLogical. When she's not immersed in her laptop, you'll find her enjoying the great outdoors with her rescue greyhound, Baba, by her side. Whether she's hitting the gym and lifting heavy things, or proudly entering her “garden era” as a beginner plant-grower, Demelza likes to keep fit and active. She will enjoy a hard-core Peloton workout but describes herself as a fair-weathered road cyclist who won’t go out unless there’s the possibility of a tan line. Presumably this means she exclusively cycles indoors or on holiday as she lives in one of the coldest cities in the UK. Originally hailing from the land down under, Demelza now calls Glasgow in Scotland home. You can tell she’s made of tough stuff if she can handle both an Australian heatwave and a Scottish freeze. She's a force to be reckoned with! What’s the one thing you wish you’d known when you started learning about accessibility? Everything is learnable. Imposter syndrome and feeling overwhelmed are natural facets of any profound and worthwhile learning experience. Embrace the journey; a career in digital accessibility is inherently a career in continuous learning. What’s your top accessibility tip? Just start. Whether you're an organisation wanting to improve your digital accessibility, or you're an individual wanting to move into the world of accessibility as a professional, just start. There will always be a lot to learn (and by default, a lot you don't know), but it's a wonderful community full of supportive individuals, so lean into the learning! Make the most of the giants that have come before you and find your trusted people and sources. The digital accessibility world has a rich community of legends, make the most of them. What’s your top accessibility resource? I love to watch and listen, so naturally I gravitate towards videos and podcasts. A gold mine for really great 'accessible' accessibility knowledge is the annual Inclusive Design 24 (ID24) conference, which is full of high-quality talks about a broad spectrum of subjects within the world of accessibility. I often find myself looking to them for one particular subject, and then bookmarking a handful of other talks to return to later. They are a source of knowledge, practical know-how, and inspiration. I also love the book Universal Design for Web Applications, by Wendy Chisholm and Matt May. I dip in and out of it regularly. Next steps Find out more about TetraLogical, the team, our principles, and our community. We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
year_published = 2024
