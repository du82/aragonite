["https://tetralogical.com/blog/4"]
title = "Blog - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = "Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Our Blog Dip into our blog and read the latest from the TetraLogical team. Foundations: introduction to WAI-ARIA Posted on Friday, 10 February 2023 by Henny Swan in Design and development The Web Accessibility Initiative Accessible Rich Internet Applications specification 1.2, or WAI-ARIA or ARIA for short, is a technical specification written by the World Wide Web Consortium (W3C). In this post we explore what WAI-ARIA is, and how it can enhance the user experience for people using screen readers. Meet the team: Joe Lamyman Posted on Thursday, 26 January 2023 in Meet the team Meet Joe Lamyman, an accessibility specialist at TetraLogical and lover of all things interactive media. Inclusive XR: accessible 3D experiences Posted on Friday, 20 January 2023 by Joe Lamyman in Design and development In this series, Inclusive Extended Reality (XR), we will be delving into ways to design accessible experiences when interacting with 3D objects, augmented reality, and virtual reality. In our first post about creating accessible experiences within Extended Reality (XR), we highlight some key considerations for designing 3D model viewers by introducing our 3D TetraLogical principles cube. You can also explore Inclusive XR: accessible augmented reality experiences. Foundations: visible focus styles Posted on Friday, 13 January 2023 by Joe Lamyman in Design and development Visible focus styles help us to understand which part of a web page we're interacting with. You may have seen visible focus styles appear as an outline around a link or a button for example. For people who only use a keyboard to navigate the web, visible focus styles may be one of the few ways to understand where they are in a page and what it is that they are interacting with. Foundations: target sizes Posted on Tuesday, 20 December 2022 by Joe Lamyman in Design and development A target size is the area that can be activated in order to interact with an element. For people who have dexterity issues, the smaller a target size is, the more difficult it may be to use the website. This post explores how to create usable, consistent, and well-spaced target sizes. Meet the team: Henny Swan Posted on Monday, 12 December 2022 in Meet the team Meet Henny Swan, one third of our trio that makes the TetraLogical directors, and accessible user experience and design lead. Meet the team: Ela Gorla Posted on Tuesday, 15 November 2022 in Meet the team Ela Gorla is one of TetraLogical’s principal accessibility specialists and our resident user research and training expert. Read on to discover her top accessibility tips, how she came to work in accessibility and things she wishes she’d known when starting out. Foundations: native versus custom components Posted on Tuesday, 8 November 2022 by Ela Gorla in Design and development Deciding whether to use native or custom components for a website or web application can have implications in terms of development effort, user experience, and accessibility. This post considers the pros and cons of each approach with a focus on accessibility, and provides guidance on how to choose one. Foundations: HTML semantics Posted on Wednesday, 5 October 2022 by Henny Swan in Design and development HTML semantics provide accessibility information about page structure and an element's role, name, and state, helping to convey the nature and purpose of content on web pages. In this post we explore what HTML semantics are, and how they're experienced by people using assistive technologies like screen readers and speech recognition software. Accessibility and supporting Internet Explorer Posted on Wednesday, 24 August 2022 by Graeme Coleman in Strategy Given that Internet Explorer 11 is now officially retired, organisations occasionally ask us if, from an accessibility perspective, they should continue to support the browser. In short, we're edging (no pun intended) towards dropping support, or at least phasing out support, in favour of Microsoft Edge. There are a few reasons for this, both technical and non-technical. 1 2 3 4 5 6 7 8 9 We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
