title = "Our impact - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = "Our impact We dedicate some of our time to supporting knowledge share in the technology community. This includes contributing to community projects, conferences, and mentoring schemes. Our team Our impact Our UX Network World Wide Web Consortium We're members of the W3C, with Léonie Watson elected to the first W3C Board of Directors. A number of the TetraLogical team contribute to standards like the Web Content Accessibility Guidelines (WCAG) and Accessible Rich Internet Applications (ARIA) as well as the Immersive Web Working Group, so we put a rare level of technical knowledge at your disposal. .w3cp1{fill:#005A9C;}.w3cp2{fill:#000;}@media (forced-colors){.w3cp1,.w3cp2{fill:CanvasText !important;}} Inclusive Design 24 Inclusive Design 24 (#id24) is a free 24-hour online event for the global community. It celebrates inclusive design and shares knowledge and ideas from analogue to digital, from design to development, from planners to practitioners, and everything and everyone in between. .id24text { fill: #282828; } #id24bg { fill: #ffe400; } @media (forced-colors) { .id24text { fill: Canvas; } #id24bg { fill: CanvasText; } } Inclusive Design Principles The Inclusive Design Principles are designed to give anyone involved in the design and development of websites and applications - designers, user experience professionals, developers, product owners, idea makers, innovators, artists and thinkers - a broad approach to inclusive design. .idp { fill: #1a1a1a; } #idpsun { fill: #fcb316; } @media (forced-colors) { .idp { fill: CanvasText !important; } #idpsun { fill-opacity: 0.5; } } We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
