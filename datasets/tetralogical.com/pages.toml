["https://tetralogical.com/blog/category/design-and-development"]
title = "Design and development posts - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = '''Design and development posts Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Foundations: grouping forms with <fieldset> and <legend> Posted on Friday, 31 January 2025 by Demelza Feltham in Design and development In this post, we explore how to use the <fieldset> and <legend> elements to group and label form elements effectively, creating a more accessible and well-structured experience. XR Accessibility: for people with moving disabilities Posted on Monday, 9 December 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences provide immersive experiences which tend to require movement based interactions. But we need to consider alternative input methods for people who can’t move. Foundations: form validation and error messages Posted on Monday, 21 October 2024 by Demelza Feltham in Design and development As well as labelling text fields with input and labels, and grouping forms with the <fieldset> and <legend> elements, form validation and error messages are also essential to making forms accessible to everyone. XR Accessibility: for people with hearing disabilities Posted on Tuesday, 1 October 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences tend to focus on providing immersive sounds and directional audio to convey information. But we need to consider how we convey the information in these experiences to people who can’t hear them. XR Accessibility: for people with thinking disabilities Posted on Thursday, 26 September 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences tend to focus on providing rich, visual content to convey information. But we need to consider how we convey the information in these experiences in a way that isn’t overwhelming, scary, or difficult to understand. XR Accessibility: for people with seeing disabilities Posted on Thursday, 19 September 2024 by Joe Lamyman in Design and development Extended Reality (XR) experiences tend to focus on providing rich, visual content to convey information. But we need to consider how we convey the information in these experiences to people who can’t see them. Introduction to XR Accessibility Posted on Wednesday, 11 September 2024 by Joe Lamyman in Design and development Extended Reality (XR) provides immersive experiences through detailed visual, audio, and multi-media content. When using these different types of content, we need to consider how we can communicate the same information to people with disabilities in order to make XR accessible to everyone. Foundations: labelling text fields with input and label Posted on Wednesday, 21 August 2024 by Demelza Feltham in Design and development In this post about forms, we explore how to effectively label text fields using <input> and <label> elements to create form inputs that are both accessible and user-friendly. Design patterns and WCAG Posted on Friday, 9 August 2024 by Graeme Coleman in Design and development The ARIA Authoring Practices Guide (APG) contains an extensive range of design patterns aimed at helping developers to create accessible web experiences using WAI-ARIA. However, while we encourage web authors to follow these design patterns, a common misconception is that their usage is a prerequisite for conformance. This is not the case. Does WCAG 2.2 apply to native apps Posted on Thursday, 18 July 2024 by Steve Faulkner in Design and development, Standards, Testing A big question for many organisations is if WCAG 2.2 applies to native apps. In this post we explore what does and doesn't apply. Why are my live regions not working? Posted on Wednesday, 1 May 2024 by Patrick H. Lauke in Design and development Live regions have a reputation for being "flaky" and inconsistent. While this can be attributed in part to shortcomings in current implementations, the problem can also be caused by developers misunderstanding how live regions are intended to work. When to use tabindex='0' Posted on Thursday, 4 April 2024 by Graeme Coleman in Design and development When tabindex="0" is applied to an HTML element, the content marked up using that element will become keyboard focusable, and is therefore a good starting point for supporting keyboard accessibility. However, applying this attribute haphazardly or unnecessarily can reduce the experience for people who use a keyboard or an equivalent input device to navigate web content. Accessibility foundations Posted on Monday, 18 March 2024 by Henny Swan in Design and development Our foundations series provides an overview of core accessibility considerations. They are a good starting point for visual designers, content designers, interaction designers, and developers when designing and building accessible products and services. Can generative AI help write accessible code? Posted on Monday, 12 February 2024 by Léonie Watson in Design and development Like many inventions before it, Generative AI is changing the way we do things. Like those inventions that went before it, Generative AI is capable of great good and great harm, and like the humans that used those inventions before us, we need to be smart about the way we use Generative AI. Keyboard accessibility myths and WCAG Posted on Monday, 27 November 2023 by Graeme Coleman in Design and development Supporting keyboard-only interaction is one of the most important principles of web accessibility. However, the scope of the Web Content Accessibility Guidelines (WCAG) in relation to keyboard accessibility is often misunderstood. Considerations for TV user interface accessibility Posted on Wednesday, 9 August 2023 by Dean Holden in Design and development TVs, set-top boxes and streaming devices are a huge part of all our lives and should be accessible so everyone can watch what they want, when they want, how they want. We've started exploring challenges people with disabilities may face when interacting with TV apps and considerations for people designing and developing TV app interfaces. Sticky content: focus in view Posted on Thursday, 8 June 2023 by Joe Lamyman in Design and development Sticky content helps prioritise important content so it's always visible, but it can create issues for sighted people who use a keyboard, or a keyboard-like device, as focused controls become hidden behind the sticky content. This post discusses how you can keep controls behind sticky content visible and usable when they receive focus. Meeting WCAG Level AAA Posted on Friday, 21 April 2023 by Patrick H. Lauke in Design and development, Standards In this post, we cover updates we've made to our own site in order to better satisfy the requirements of the Web Content accessibility Guidelines (WCAG) 2.1 Level AAA. Foundations: accessible names and descriptions Posted on Wednesday, 5 April 2023 by Henny Swan in Design and development An element's name, or accessible name, is how it's identified. An accessible description provides additional information, about the element, that complements the accessible name. In this post we explore assigning accessible names and descriptions using HTML and WAI-ARIA. Inclusive XR: accessible augmented reality experiences Posted on Thursday, 23 March 2023 by Joe Lamyman in Design and development In our second post about creating accessible experiences within Extended Reality (XR), we highlight some key considerations for designing accessible augmented reality (AR) experiences with our AR TetraLogical principles cube. You can also explore Inclusive XR: accessible 3D experiences. Foundations: pointer gestures Posted on Friday, 17 March 2023 by Graeme Coleman in Design and development A pointer gesture is an action a person performs using their finger, mouse, or an assistive technology like a head pointer or eye gaze system to operate a functional control. Some pointer gestures can be difficult or even impossible for certain people to perform, so an accessible alternative may be required. This post introduces the different forms of pointer gestures and covers how and when to provide alternatives for people who can't perform them. Adding sign language to videos Posted on Tuesday, 7 March 2023 by Henny Swan in Design and development As part of our ongoing effort to meet the Web Content accessibility Guidelines (WCAG) 2.1 and 2.2 Level AAA, we've created British Sign Language (BSL) versions of our video and created BSL playlists in our TetraLogical YouTube channel. In this post we explore our process for adding BSL to videos and share some tips. Foundations: introduction to WAI-ARIA Posted on Friday, 10 February 2023 by Henny Swan in Design and development The Web Accessibility Initiative Accessible Rich Internet Applications specification 1.2, or WAI-ARIA or ARIA for short, is a technical specification written by the World Wide Web Consortium (W3C). In this post we explore what WAI-ARIA is, and how it can enhance the user experience for people using screen readers. Inclusive XR: accessible 3D experiences Posted on Friday, 20 January 2023 by Joe Lamyman in Design and development In this series, Inclusive Extended Reality (XR), we will be delving into ways to design accessible experiences when interacting with 3D objects, augmented reality, and virtual reality. In our first post about creating accessible experiences within Extended Reality (XR), we highlight some key considerations for designing 3D model viewers by introducing our 3D TetraLogical principles cube. You can also explore Inclusive XR: accessible augmented reality experiences. Foundations: visible focus styles Posted on Friday, 13 January 2023 by Joe Lamyman in Design and development Visible focus styles help us to understand which part of a web page we're interacting with. You may have seen visible focus styles appear as an outline around a link or a button for example. For people who only use a keyboard to navigate the web, visible focus styles may be one of the few ways to understand where they are in a page and what it is that they are interacting with. Foundations: target sizes Posted on Tuesday, 20 December 2022 by Joe Lamyman in Design and development A target size is the area that can be activated in order to interact with an element. For people who have dexterity issues, the smaller a target size is, the more difficult it may be to use the website. This post explores how to create usable, consistent, and well-spaced target sizes. Foundations: native versus custom components Posted on Tuesday, 8 November 2022 by Ela Gorla in Design and development Deciding whether to use native or custom components for a website or web application can have implications in terms of development effort, user experience, and accessibility. This post considers the pros and cons of each approach with a focus on accessibility, and provides guidance on how to choose one. Foundations: HTML semantics Posted on Wednesday, 5 October 2022 by Henny Swan in Design and development HTML semantics provide accessibility information about page structure and an element's role, name, and state, helping to convey the nature and purpose of content on web pages. In this post we explore what HTML semantics are, and how they're experienced by people using assistive technologies like screen readers and speech recognition software. Accessibility and QR codes Posted on Monday, 8 August 2022 by Joe Lamyman in Design and development Quick Response (QR) codes are graphics that can be scanned to direct people online to complete an action or find content. This blog post explores considerations and provides guidance for creating accessible experiences with QR codes. Android accessibility: roles and TalkBack Posted on Thursday, 7 July 2022 by Graeme Coleman in Design and development TalkBack only announces role information for a relatively small number of user interface (UI) elements within native apps. When comparing this behaviour against web content, this can often give the (false) impression that these elements must have been coded incorrectly and therefore need to be "fixed". This blog post looks at when it is acceptable for a role not to be announced, the roles that TalkBack does announce, and what this means for conformance to the Web Content Accessibility Guidelines (WCAG). Accessible design systems Posted on Friday, 24 June 2022 by Henny Swan in Design and development A design system is a library of styles, components, and patterns used by product teams to consistently and efficiently launch new pages and features. A good system has accessibility embedded throughout and includes documentation, guidelines and implementation notes for accessibility. Foundations: lists Posted on Friday, 29 April 2022 by Léonie Watson in Design and development A list is generally agreed to be a series of words or phrases that are grouped together for a reason. That reason might be to remember the items we want from the store, to share our top five favourite movies, or to write down the steps needed to complete a task. Foundations: landmarks Posted on Friday, 18 March 2022 by Léonie Watson in Design and development Most websites have common areas of content like a header and footer, a main content area, and one or more navigation blocks. Sighted people can identify these areas based on the way they're styled and the content they contain, but people who are blind cannot do that quite as efficiently. Landmarks, like headings and lists, offer screen reader users a more comparable experience for identifying and navigating between different areas of content. Foundations: session timeouts Posted on Monday, 7 March 2022 by Patrick H. Lauke in Design and development Session timeouts are designed to protect privacy and security, but if they’re implemented incorrectly, they can prevent people from completing tasks on a website. Foundations: headings Posted on Monday, 28 February 2022 by Henny Swan in Design and development Well structured content helps everybody understand and navigate documents. When coded properly in the HTML, headings, lists, and landmarks help people who use screen readers (software that reads what’s on screen) both scan and navigate pages. Foundations: colour and meaning Posted on Tuesday, 15 February 2022 by Henny Swan in Design and development Colour is a valuable tool for communicating meaning. But if you can't see colour, then meaning is lost. Always plan to use colour to convey meaning in combination with another means of identification. Foundations: colour contrast Posted on Friday, 4 February 2022 by Henny Swan in Design and development Good contrast is about using colours that provide enough variation between the content and background. This is particularly important for people who have conditions that affect vision or colour perception, as well as people browsing on mobile in different light conditions. Foundations: text descriptions Posted on Monday, 24 January 2022 by Henny Swan in Design and development Text descriptions are prima'''
