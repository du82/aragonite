["https://tetralogical.com/about/ux-network"]
title = "Our UX Network - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = "Our UX Network Our User Experience (UX) Network is a group of people who use assistive technologies, alternative input devices, and other accessibility services. They provide valuable feedback about their experiences using products and services as part of our agile user experience testing service. Our team Our impact Our UX Network Join our UX Network We are looking for people with different disabilities, older people, and people who use assistive technologies and other accessibility services. You might be asked to take part in a single session of an hour or so, or a longer exercise where we’ll ask you to keep a diary as you use a service over a few days or weeks. You do not need to be an expert in technology or any other subject. If you’re asked to take part in a study you’ll always be given clear instructions and help if you would like it. It’s generally done remotely, so there is no need to travel. For those cases where travel is required, you will be informed and can decide whether to take part. We also recognise that your time and opinions are valuable so you’ll be compensated for the time you give us. If you would like to join our UX Network and help us make online services better for many people, we’d really like to hear from you. Please complete our registration form. Important: We kindly ask accessibility specialists, and anyone else working in the accessibility field, to refrain from joining. While we appreciate your skills and knowledge, we would like to hear from people who are not professional testers. We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
