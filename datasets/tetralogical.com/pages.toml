["https://tetralogical.com/newsletters/accessibility-unlocked"]
title = "Subscribe to Accessibility Unlocked - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = '''Subscribe to Accessibility Unlocked Welcome to Accessibility Unlocked, our free six day newsletter series curated for you by our team at TetraLogical! Whether you're at the start of your accessibility journey or partway through it, this series is designed to help you kick start accessibility. We will cover who benefits from accessibility, and how you can start designing, building, measuring, testing, and managing accessibility. At the end of the course we'll share a roadmap for you to tailor based on everything you've learnt. Subscribe We'd love for you to join us, sign up today and we'll get started tomorrow! Name (required) Email Address (required) Subscribe // Add the novalidate attribute when the JS loads var forms = document.querySelectorAll('.validate'); for (var i = 0; i < forms.length; i++) { forms[i].setAttribute('novalidate', true); } // Validate the field var hasError = function (field) { // Don't validate submits, buttons, file and reset inputs, and disabled fields if (field.disabled || field.type === 'file' || field.type === 'reset' || field.type === 'submit' || field.type === 'button') return; // Get validity var validity = field.validity; // If valid, return null if (!validity || validity.valid) return; // If field is required and empty if (validity.valueMissing) return 'Please fill out this field.'; // If not the right type if (validity.typeMismatch) { // Email if (field.type === 'email') return 'Please enter an email address.'; // URL if (field.type === 'url') return 'Please enter a URL.'; } // If too short if (validity.tooShort) return 'Please lengthen this text to ' + field.getAttribute('minLength') + ' characters or more. You are currently using ' + field.value.length + ' characters.'; // If too long if (validity.tooLong) return 'Please shorten this text to no more than ' + field.getAttribute('maxLength') + ' characters. You are currently using ' + field.value.length + ' characters.'; // If pattern doesn't match if (validity.patternMismatch) { // If pattern info is included, return custom error if (field.hasAttribute('title')) return field.getAttribute('title'); // Otherwise, generic error return 'Please enter a valid email address.'; } // If number input isn't a number if (validity.badInput) return 'Please enter a number.'; // If a number value doesn't match the step interval if (validity.stepMismatch) return 'Please select a valid value.'; // If a number field is over the max if (validity.rangeOverflow) return 'Please select a value that is no more than ' + field.getAttribute('max') + '.'; // If a number field is below the min if (validity.rangeUnderflow) return 'Please select a value that is no less than ' + field.getAttribute('min') + '.'; // If all else fails, return a generic catchall error return 'The value you entered for this field is invalid.'; }; // Show an error message var showError = function (field, error) { // Add error class to field field.classList.add('error'); // If the field is a radio button and part of a group, error all and get the last item in the group if (field.type === 'radio' && field.name) { var group = field.form.querySelectorAll('[name="' + field.name + '"]'); if (group.length > 0) { for (var i = 0; i < group.length; i++) { group[i].classList.add('error'); } field = group[group.length - 1]; } } // Get field id or name var id = field.id || field.name; if (!id) return; // Check if error message field already exists // If not, create one var message = field.form.querySelector('.error-message#error-for-' + id ); if (!message) { message = document.createElement('div'); message.className = 'error-message'; message.id = 'error-for-' + id; // If the field is a radio button or checkbox, insert error after the label var label; if (field.type === 'radio' || field.type ==='checkbox') { label = field.form.querySelector('label[for="' + id + '"]') || field.parentNode; if (label) { label.parentNode.insertBefore( message, label.nextSibling ); } } // Otherwise, insert it after the field if (!label) { field.parentNode.insertBefore( message, field.nextSibling ); } } // Add ARIA role to the field field.setAttribute('aria-describedby', 'error-for-' + id); // Update error message message.innerHTML = error; // Show error message message.style.display = 'block'; message.style.visibility = 'visible'; }; // Remove the error message var removeError = function (field) { // Remove error class to field field.classList.remove('error'); // Remove ARIA role from the field field.removeAttribute('aria-describedby'); // If the field is a radio button and part of a group, remove error from all and get the last item in the group if (field.type === 'radio' && field.name) { var group = field.form.querySelectorAll('[name="' + field.name + '"]'); if (group.length > 0) { for (var i = 0; i < group.length; i++) { group[i].classList.remove('error'); } field = group[group.length - 1]; } } // Get field id or name var id = field.id || field.name; if (!id) return; // Check if an error message is in the DOM var message = field.form.querySelector('.error-message#error-for-' + id + ''); if (!message) return; // If so, hide it message.innerHTML = ''; message.style.display = 'none'; message.style.visibility = 'hidden'; }; // Serialize the form data into a query string // Forked and modified from https://stackoverflow.com/a/30153391/1293256 var serialize = function (form) { // Setup our serialized data var serialized = ''; // Loop through each field in the form for (i = 0; i < form.elements.length; i++) { var field = form.elements[i]; // Don't serialize fields without a name, submits, buttons, file and reset inputs, and disabled fields if (!field.name || field.disabled || field.type === 'file' || field.type === 'reset' || field.type === 'submit' || field.type === 'button') continue; // Convert field data to a query string if ((field.type !== 'checkbox' && field.type !== 'radio') || field.checked) { serialized += '&' + encodeURIComponent(field.name) + "=" + encodeURIComponent(field.value); } } return serialized; }; // Display the form status window.displayMailChimpStatus = function (data) { // Make sure the data is in the right format and that there's a status container if (!data.result || !data.msg || !mcStatus ) return; let message = data.msg; // Regular expression to match a number, space, dash, space at the start const regex = /^\d+ - /; // Check if the string matches the pattern if (regex.test(message)) { // If it matches, remove the matched part message = message.replace(regex, ''); } // Update our status message mcStatus.innerHTML = message; // Bring our status message into focus mcStatus.setAttribute('tabindex', '-1'); mcStatus.focus(); // If error, add error class if (data.result === 'error') { mcStatus.classList.remove('mc-success-message'); mcStatus.classList.add('mc-error-message'); return; } // Otherwise, add success class mcStatus.classList.remove('mc-error-message'); mcStatus.classList.add('mc-success-message'); document.querySelector('.mc-form').style.display = 'none'; }; // Submit the form var submitMailChimpForm = function (form) { // Get the Submit URL var url = form.getAttribute('action'); url = url.replace('/post?u=', '/post-json?u='); url += serialize(form) + '&c=displayMailChimpStatus'; // Create script with url and callback (if specified) var ref = window.document.getElementsByTagName( 'script' )[ 0 ]; var script = window.document.createElement( 'script' ); script.src = url; // Create a global variable for the status container window.mcStatus = form.querySelector('.mc-status'); // Insert script tag into the DOM (append to <head>) ref.parentNode.insertBefore( script, ref ); // After the script is loaded (and executed), remove it script.onload = function () { this.remove(); }; }; // Listen to all blur events document.addEventListener('blur', function (event) { // Only run if the field is in a form to be validated if (!event.target.closest) return; if (!event.target.closest('form.validate')) return; // Validate the field var error = hasError(event.target); // If there's an error, show it if (error) { showError(event.target, error); return; } // Otherwise, remove any existing error message removeError(event.target); }, true); // Check all fields on submit document.addEventListener('submit', function (event) { // Only run on forms flagged for validation if (!event.target.classList.contains('validate')) return; // Prevent form from submitting event.preventDefault(); // Get all of the form elements var fields = event.target.elements; // Validate each field // Store the first field with an error to a variable so we can bring it into focus later var error, hasErrors; for (var i = 0; i < fields.length; i++) { error = hasError(fields[i]); if (error) { showError(fields[i], error); if (!hasErrors) { hasErrors = fields[i]; } } } // If there are errors, don't submit form and focus on first element with error if (hasErrors) { hasErrors.focus(); return; } // Otherwise, let the form submit normally // You could also bolt in an Ajax form submit process here submitMailChimpForm(event.target); }, false); We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com'''
