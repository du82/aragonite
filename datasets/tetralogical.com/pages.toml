title = "TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = "Hello, we’re TetraLogical We believe in a world where technology holds no one back. A world where everyone is free to choose the technologies they want because you choose to make your technologies accessible. We work with you to make your websites, apps, and other technologies usable for people with disabilities and give your teams the knowledge they need to make accessibility part of everything they do. Play Our vision We put people first. People using technology People designing and building technology People managing and delivering technology Our goal is your success in creating great experiences for people using your technologies. Learn more about us Our team We're a boutique company with a whole lot of experience. We're an experienced team, with specialisms in many areas. Meet the team Meet Dean Holden Dean is a Senior Accessibility Specialist. He specialises in accessibility assessments and testing. Accessibility Unlockednewsletter We know that small steps have a big impact. Whether you're at the start of your accessibility journey or partway through it, our free six-day newsletter series is designed to help you kick start accessibility. We share resources and tips to get you started and help create an accessibility roadmap to set you on the path to success. Interested? Sign up at Accessibility Unlocked. Our services Our services are designed to give everyone what they need to make accessibility part of everything they do. Experience for people using technology Knowledge for people designing and building technology Strategy for people managing and delivering technology We know that accessibility is not just about code, standards, and compliance. It's about people, analysis, and inclusive user experience. Learn more about our services Our blog Dip into our blog and read the latest from the team Meet Josh: a sportsman who has spinal muscular atrophy Posted on Wednesday, 12 February 2025 by Henny Swan in User experience Meet Josh, a sportsman who has spinal muscular atrophy. Between training for the Paralympics and his busy day job, Josh talks to us about how navigating the web is constantly evolving, how he adapts to various assistive technologies, and his hopes and concerns for artificial intelligence (AI). Meet Jonathan: a photographer who has ADHD Posted on Friday, 7 February 2025 by Henny Swan in User experience Meet Jonathan, the photographer behind the portraits of all our models (links to their interviews below) for the TetraLogical website. Jonathan has ADHD (Attention Deficit Hyperactivity Disorder) and shares his experience browsing the web, including how distractions like cookies, pop-ups, and social media affect him. Foundations: grouping forms with <fieldset> and <legend> Posted on Friday, 31 January 2025 by Demelza Feltham in Design and development In this post, we explore how to use the <fieldset> and <legend> elements to group and label form elements effectively, creating a more accessible and well-structured experience. We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
