full_description = "User experience posts Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Meet Josh: a sportsman who has spinal muscular atrophy Posted on Wednesday, 12 February 2025 by Henny Swan in User experience Meet Josh, a sportsman who has spinal muscular atrophy. Between training for the Paralympics and his busy day job, Josh talks to us about how navigating the web is constantly evolving, how he adapts to various assistive technologies, and his hopes and concerns for artificial intelligence (AI). Meet Jonathan: a photographer who has ADHD Posted on Friday, 7 February 2025 by Henny Swan in User experience Meet Jonathan, the photographer behind the portraits of all our models (links to their interviews below) for the TetraLogical website. Jonathan has ADHD (Attention Deficit Hyperactivity Disorder) and shares his experience browsing the web, including how distractions like cookies, pop-ups, and social media affect him. Meet Andre: a music producer and blind screen reader user Posted on Tuesday, 26 November 2024 by Henny Swan in User experience Meet Andre, a music producer and blind screen reader user who is not afraid to take his custom elsewhere if your site is not accessible. Andre shares his experience using the web including his love of headings and consistent design to help him navigate, and his dislike of accessibility overlays and poorly implemented page updates using live regions. Foundations: types of disability Posted on Monday, 18 November 2024 by Demelza Feltham in User experience This post offers an overview of various disability types across four groups: seeing, hearing, moving, and thinking, and provides a brief exploration of what disability is, highlighting how permanent, temporary, or situational disabilities can affect us all. Meet Lauren: a film editor who has ADHD Posted on Tuesday, 12 November 2024 by Henny Swan in User experience Meet Lauren, a film editor moving into the world of producing and production management who has ADHD (Attention Deficit Hyperactivity Disorder). Lauren shares what helps her stay focused when browsing the web and why white backgrounds and autoplaying video are not helpful for her. Meet Steve: a photographer who is deaf and low vision Posted on Tuesday, 29 October 2024 by Henny Swan in User experience Meet Steve, a photographer from London who is deaf and low vision. He is an ex-civil servant who then went on to do freelance technology journalism and travelled the world. Steve shares his experience of the web including increasing font size and using good colour contrast as well as the joys of using his Bluetooth headphones. Meet Hasmukh: a blind cricketer and screen reader user Posted on Tuesday, 15 October 2024 by Henny Swan in User experience Meet Hasmukh, a talented blind cricketer with lots of patience and determination. Hasmukh shares his experience using the web with a screen reader and highlights the importance of accessible emails, forms, language, and prioritising content within a web page. Inclusive user research: recruiting participants Posted on Monday, 1 August 2022 by Ela Gorla in Testing, User experience One of the most important and challenging aspects of running inclusive user research is finding participants with a wide range of access needs, who can provide feedback on different features of your products. Our third post from the Inclusive user research series answers key questions around recruitment. Research insight: accessibility of images Posted on Thursday, 21 July 2022 by Henny Swan in Testing, User experience When conducting usability testing with disabled users, we observed how well images performed from both a visual and non-visual perspective when it came to finding and understanding content. Inclusive user research: analysing findings Posted on Wednesday, 8 June 2022 by Ela Gorla in User experience In moderating usability testing with people with disabilities we covered the skills and techniques that help researchers run sessions smoothly and collect valuable insights. The second post in our Inclusive user research series discusses some of the unique challenges posed by findings from sessions run with people with disabilities, and advice on how to analyse them. Browsing with assistive technology videos Posted on Friday, 24 December 2021 by Henny Swan in User experience Understanding how people with disabilities browse the web using assistive technologies (AT) is core to making an accessible and inclusive user experience. Our browsing with assistive technology videos series introduces commonly used software, who uses it, how it works, and ways people navigate content. Browsing with speech recognition Posted on Monday, 15 November 2021 by Henny Swan in User experience In our fifth and final post from our browsing with assistive technology series, we discuss browsing with speech recognition. You can also explore browsing with a desktop screen reader, browsing with a mobile screen reader, browsing with a keyboard, and browsing with screen magnification. Browsing with screen magnification Posted on Wednesday, 10 November 2021 by Henny Swan in User experience In our fourth post from our browsing with assistive technology series, we discuss browsing with screen magnification. You can also explore browsing with a desktop screen reader, browsing with a mobile screen reader, browsing with a keyboard, and browsing with speech recognition. Browsing with a keyboard Posted on Tuesday, 26 October 2021 by Henny Swan in User experience In our third post from our browsing with assistive technology series, we discuss browsing with a keyboard. You can also explore browsing with a desktop screen reader, browsing with a mobile screen reader, browsing with screen magnification and browsing with speech recognition. Browsing with a mobile screen reader Posted on Tuesday, 5 October 2021 by Henny Swan in User experience In our second post from our browsing with assistive technology series, we discuss mobile screen readers. You can also explore browsing with desktop screen readers, browsing with a keyboard, browsing with screen magnification and browsing with speech recognition. Browsing with a desktop screen reader Posted on Wednesday, 29 September 2021 by Henny Swan in User experience In our first post from our browsing with assistive technologies series, we discuss desktop screen readers. You can also explore browsing with a mobile screen reader, browsing with a keyboard, browsing with screen magnification and browsing with speech recognition. We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
