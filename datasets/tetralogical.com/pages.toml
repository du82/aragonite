full_description = "About TetraLogical We formed TetraLogical in 2019 because we saw the market become more driven by legal compliance than meeting the needs of different people. Compliance is important but it doesn't guarantee inclusion, so we bridge the gap between the two in intelligent ways tailored just for you. Our team Our impact Our UX Network Our principles We put people first: you and your customers, our partners and team, and everyone we meet. TetraLogical is founded on four principles that mean everything we do is: Inclusive: we consider everyone and make decisions that exclude no-one Sustainable: we work collaboratively and efficiently to amplify enduring accessibility Ethical: we make decisions for the good of our customers and their customers, our team, and for the world at large Original: we like new ideas and finding simple solutions to complex problems #tlp-inclusive, #tlp-inclusive-text { fill: #A900C0; } #tlp-sustainable, #tlp-sustainable-text { fill: #FF1958; } #tlp-ethical, #tlp-ethical-text { fill: #E100A0; } #tlp-original, #tlp-original-text { fill: #F56F00; } #tlp-scaffold { fill: #2D0045; } #tlp-scaffold #tlp-inclusive-ethical { fill-opacity:0.28; } #tlp-scaffold #tlp-sustainable-original { fill-opacity:0.84; } #tlp-scaffold #tlp-perimeter { fill-opacity:0.62; } @media (forced-colors) { #tlp-inclusive, #tlp-inclusive-text, #tlp-sustainable, #tlp-sustainable-text, #tlp-ethical, #tlp-ethical-text, #tlp-original, #tlp-original-text, #tlp-scaffold { fill: CanvasText; } }The 3D TetraLogical logo of a tetrahedron with four circles for each principle: light purple for inclusive, red for sustainable, pink for ethical, and orange for original. We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
