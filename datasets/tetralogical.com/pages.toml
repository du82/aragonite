["https://tetralogical.com/about/team"]
title = "Our team - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = "Our team Everyone at TetraLogical has lots of experience. We’ve been helping organisations meet their accessibility goals for many years; we understand the challenges, we know the solutions, and we’ve done it time and time again. Our team Our impact Our UX Network Léonie Watson Léonie is a Director. She specialises in data visualization accessibility for screen readers, and the impact of generative AI on accessibility. With more than 25 years’ experience working for organisations including Nomensa, TPGi, and Government Digital Service, Léonie is a respected member of the web community. She sits on the Board of Directors for the W3C, and is co-Chair of the W3C Web Applications working group. Naturally hard-working and organised, she has spent time managing complex web projects, as well as working in her habitual capacity as accessibility engineer. In 2018, Microsoft recognised her contribution to the field of accessibility by making her one of the first Most Valued Professionals (MVP) outside of the Microsoft community. She was a co-author of the Inclusive Design Principles, and more recently co-authored the Do No Harm Guide: Centering accessibility in data visualization. Léonie Watson Ian Pouncey Ian is a Director. He specialises in accessibility documentation and the intersection between inclusive design and development. Ian is a member of a number of W3C working groups, and a web developer with more than 20 years’ experience. He's worked for companies such as Yahoo! and Bloomberg before becoming a full-time accessibility specialist in 2013 as part of the BBC’s digital UX division. Ian is one of the founders of Inclusive Design 24 (ID24) and co-author of the Inclusive Design Principles. Ian Pouncey Henny Swan Henny is a Director. She specialises in embedded and sustainable accessibility, inclusive user experience and design. Having started her career focusing on the usability of dual language web platforms in China in the late 1990's, Henny moved into accessibility on her return to the UK in the early 2000s. Since then she has worked for the RNIB, Opera Software, TPGi and the BBC. It was at BBC she developed her passion for inclusive TV and streaming experiences. Henny is co-author of the Inclusive Design Principles, was lead author of the BBC Mobile Accessibility Guidelines, and is a regular speaker at conferences. In 2022 Henny graduated the Goldman Sachs 10,000 Small Businesses. Henny Swan Steve Faulkner Steve is a Director. He specialises in screen readers and Accessible Rich Internet Applications (ARIA). Previously, Steve was the Chief Accessibility Officer at TPGi and a Senior Web Accessibility Consultant at Vision Australia. He is a member of several groups, including the W3C Accessibility Guidelines Working Group and ARIA Working Group. He has been an editor of several specifications at the W3C, including HTML5, ARIA in HTML, and HTML Accessibility API Mappings 1.0. He also writes on HTML5accessibility and supports Freedom Scientific to improve HTML and ARIA support in the JAWS screen reader. Steve Faulkner Graeme Coleman Graeme is a Principal Accessibility Specialist. He specialises in accessibility testing, mobile, and Accessibility Conformance Reports (ACRs). He has an in-depth understanding of technical accessibility and how to apply the guidelines across web and mobile platforms such as iOS and Android. Previously, Graeme was a senior accessibility engineer at The TPGi and, prior to that, a researcher at the University of Dundee, where he was awarded his PhD in 2008. Graeme has over 15 years of experience performing accessibility assessments of websites and applications on behalf of commercial and academic organisations. Graeme Coleman Patrick H. Lauke Patrick is a Principal Accessibility Specialist. He specialises in accessibility testing and standards development for the Web Content Accessibility Guidelines (WCAG). He is a member and active contributor in the Web Content Accessibility Guidelines working group, chair and co-editor of the W3C Pointer Events specification, and co-editor of the ARIA in HTML and W3C Touch Events Level 2 specifications. In a previous life, he was Principal Accessibility Engineer at TPGi, and before that worked as Web Evangelist in the Developer Relations team at Opera Software. He’s been involved in the discourse around Web Standards and Accessibility since 2001, actively speaking at conferences and participating in early initiatives such as the Web Standards Project (WaSP). Patrick H. Lauke Gez Lemon Gez is a Principal Accessibility Specialist. He specialises in accessibility testing and Accessible Rich Internet Applications (ARIA). Gez has been at the heart and centre of the accessibility community for over 20 years and is well known for articles and tools published on his website Juicy Studio. His main area of expertise is WAI-ARIA, working on complex applications, and helping teams implement accessibility in a way that helps them embed permanently into their practice. He graduated from the University of Surrey in 1997 with a BSc (Hons) in Computing and previously worked at TPGi as a Principal Accessibility Engineer. Gez Lemon Ela Gorla Ela is a Principal Accessibility Consultant. She specialises in sustainable accessibility and inclusive user research. Ela started her career in accessibility consultancy in 2008 and has since helped small and large companies, as well as public organisations, achieve their accessibility goals. Ela was part of the accessibility team in Barclays, playing an important role in integrating accessibility into governance processes and producing accessibility guidelines and standards. Alongside consultancy, Ela has a deep knowledge of inclusive user research practices and extensive experience training. She has contributed to the W3C Authoring Tool Accessibility Guidelines as a tester and has participated in the Scope Big Hack advisory board. Ela Gorla Alistair Duggin Alistair is a Principal Accessibility Consultant. He specialises in sustainable accessibility and embedding accessibility into organisational policies and processes. He is the former Head of Accessibility at Government Digital Service where he transformed how the UK government approached accessibility by embedding accessibility in the GOV.UK Service Manual and Design System, building and supporting a 1000+ strong cross-government accessibility community, and creating the UK’s first assistive technology device/empathy lab. Alistair has over 20 years of digital and accessibility experience, starting as a web developer at the BBC, where he learned how to build accessible websites and grow and support an accessibility community. His approach to accessibility during the creation of the BBC 2012 Olympics website inspired the creation of the BBC Accessibility Champions Network. Other roles include being an Accessibility Engineer at Apple and Principal Accessibility Consultant at Nomensa. Alistair Duggin Craig Abbott Craig is a Principal Accessibility Consultant. He specialises in sustainable accessibility and embedding accessibility into organisational policies and processes. He is the former Head of Accessibility at the Department for Work and Pensions (DWP), where he established their dedicated accessibility practice and led the department’s accessibility strategy. His work focused on compliance, education, and culture change, transforming policies and processes to help teams develop the skills needed to sustainably deliver accessible services. He also created and open-sourced the first versions of the DWP Accessibility Manual, supporting others in making digital products more accessible. Craig has over 15 years’ experience in designing and building user-centred products. He started his career in web design, before moving into frontend development, user experience (UX) design and design management. He joins TetraLogical from Elastic, the search AI company, where he was a design manager and accessibility lead focused on enterprise cyber-security software. Beyond his day-to-day work, Craig is a regular conference speaker and an active member of neurodiversity communities. Being neurodivergent himself, Craig advocates for user-centred accessibility approaches that go beyond just compliance. Craig Abbott Felicity Miners-Jones Felicity is a Senior Project Manager. She specialises in making the project management process inclusive for everyone. She has over ten years’ experience in management consultancy, working for companies such as Breakthrough Global running projects and productions with a heavy focus on web-based training for clients dispersed across the globe. Felicity is a communication and behavioural learning specialist, comfortable working in a range of settings to provide intensive communication skills training, one to one coaching, seminar facilitation, and specialist mental health training. She has a creative background and previously founded and ran her own theatre company where she created and delivered a wide range of productions, workshops, and fundraising events. She also has experience working in the care sector, including domiciliary and hospice support. Felicity Miners-Jones Dean Holden Dean is a Senior Accessibility Specialist. He specialises in accessibility assessments and testing. With over 15 years’ experience as a Web Developer at Nationwide Building Society, Dean became an accessibility specialist within the organisation and helped our very own Léonie Watson set up the foundations of a dedicated accessibility team. Together the Nationwide accessibility team began work to embed accessibility through the company’s end-to-end processes, creating role-specific guidance on accessibility responsibilities and delivering face-to-face team training sessions. More recently, Dean has worked as a Senior Accessibility Engineer at TPGi, leading a team in providing accessibility audits for customers. Dean Holden Joe Lamyman Joe is a Senior Accessibility Specialist. He specialises in accessibility testing and inclusive eXtended Reality (XR). He has worked across different sectors to create usable and accessible digital experiences. Previously, Joe worked within the accessibility team at the Department for Environment, Food, and Rural Affairs (DEFRA) helping public sector bodies deliver services that are as accessible to as many people as possible. He also has experience developing accessible design systems and patterns as part of an MSc Research degree and from working with universities in the UK and Australia, during his time with SkillsForge. Joe Lamyman Demelza Feltham Demelza is an Accessibility Specialist. She specialises in accessibility assessments and testing. Prior to joining, Demelza worked as an Accessibility Analyst at User Vision within their digital accessibility team. Demelza has experience working across multiple sectors, regularly conducting accessibility audits, supporting user research initiatives, and co-running empathy labs. Demelza holds an undergraduate degree in Anthropology and Philosophy, complemented by a Master of Science in Religious Studies. Additionally, she has earned a UX diploma, further solidifying her understanding of human centred design principles. Demelza Feltham We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
