["https://tetralogical.com/code-of-ethics"]
title = "Code of ethics - TetraLogical"
description = "Accessibility consultancy with a focus on inclusion. We can help you with knowledge, experience, strategy, assessments, and development."
full_description = "Code of Ethics We believe in a world where technology holds no one back. We put people first: you and your customers, our partners and team, and everyone we meet. TetraLogical is founded on four principles which guide us in everything we do. Inclusive We consider everyone and make decisions that exclude no-one Accessibility We strive to make everything we create as accessible as possible, including our website, video and audio content, Microsoft Office documents, and PDFs. We follow the Web Content Accessibility Guidelines (WCAG) 2.2 Level AA and aim for Level AAA where feasible. Read our Accessibility statement. Diversity, equity, and inclusion TetraLogical is an equal opportunity employer. We aim for our team to be representative of all sections of society and for everyone to feel respected and able to give their best. We do not tolerate discrimination in any form for any reason. We want everyone to treat others with respect and professionalism, and expect our team to honour the TetraLogical Code of Conduct. Language Words matter. We use appropriate language when talking to or about people with different disabilities and other protected characteristics. To that end, we ask our team to follow our TetraLogical Editorial Guidelines and Inclusive Language Guidelines. Procurement We only use software platforms that we can verify are accessible to our team and everyone we work with. Sustainable We work collaboratively and efficiently to amplify enduring accessibility Carbon reduction TetraLogical is a remote company by design which minimises our carbon footprint. We have a technology recycling policy in place and, if traveling, we encourage the team to choose travel options with the lightest carbon footprint and choose to offset carbon emissions where possible. We are also committed to creating a Carbon Reduction Plan by quarter 1, 2025. Impact We dedicate some of our time to supporting knowledge share in the technology community. This includes contributing to community projects, conferences, and mentoring schemes. Read about our impact. Sustainable accessibility We optimise processes and resources responsibly to ensure accessibility is integrated efficiently and sustainably for teams designing, building, managing, and delivering accessible technology. Read about sustainable accessibility. Ethical We make decisions for the good of our customers and their customers, our team, and for the world at large Compensation We think it's important to compensate our team well for their time, knowledge, and contributions. We also believe in fairness and transparency, so everyone who does the same job at TetraLogical receives the same compensation. We provide a 4% employer's pension contribution, health insurance, life insurance and income protection, as well as profit share and an annual training budget. Finance At TetraLogical, we’re committed to fair and prompt payments as a signatory of the Prompt Payment Code, which requires suppliers to be paid within 30 days. Our suppliers are invaluable to us, so we prioritise paying them promptly, often within two working days of receiving an invoice. Privacy and Security TetraLogical is committed to maintaining the privacy and security of your personal data. Everyone on the team is required to complete mandatory annual cybersecurity training and complete Disclosure and Barring Service (DBS) checks. Responsible Artificial intelligence (AI) At TetraLogical, we are committed to responsible usage of generative Artificial Intelligence (AI) that aligns with our core values of inclusion and ethics. We do not use generative AI in ways that misrepresent our skills and capabilities or those of TetraLogical. We ask that the TetraLogical team follow our Generative AI policy. Original We like new ideas and finding simple solutions to complex problems Collaboration At TetraLogical, we go beyond simply delivering services; we collaborate closely with our customers to co-create bespoke solutions that not only address their unique needs but also support them in meeting their legal and ethical obligations for accessible technology. This partnership-driven approach often leads to the development of new services that others can also benefit from, expanding the impact of our work. Read about our Recruitment Support and Risk Analysis services. Knowledge We believe it's important to invest in the ongoing development of the TetraLogical team so that TetraLogical continues to be the best it can be. Everyone has access to an annual personal development budget of £1,000 to buy books, pay for training, attend conferences, or for other activities that will help keep our skills and knowledge up to date. Every member of the team also has one day a week to work on projects that are for their professional development and the continuous improvement of TetraLogical. We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
year_published = 2025
