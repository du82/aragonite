full_description = "Categories Categories All categories Design and development Standards Strategy Testing Meet the team User experience Our Blog Dip into our blog and read the latest from the TetraLogical team. Accessibility foundations Posted on Monday, 18 March 2024 by Henny Swan in Design and development Our foundations series provides an overview of core accessibility considerations. They are a good starting point for visual designers, content designers, interaction designers, and developers when designing and building accessible products and services. Meet the team: Demelza Feltham Posted on Wednesday, 13 March 2024 in Meet the team Meet Demelza Feltham, the accessibility aficionado whose infectious enthusiasm pairs perfectly with a touch of Scottish charm. Can generative AI help write accessible code? Posted on Monday, 12 February 2024 by Léonie Watson in Design and development Like many inventions before it, Generative AI is changing the way we do things. Like those inventions that went before it, Generative AI is capable of great good and great harm, and like the humans that used those inventions before us, we need to be smart about the way we use Generative AI. Meet the team: Steve Faulkner Posted on Friday, 9 February 2024 in Meet the team Meet Steve, a seasoned accessibility specialist but new to the TetraLogical team after slotting into place as the fourth Director last year. Meet the team: Gez Lemon Posted on Wednesday, 10 January 2024 in Meet the team Meet Gez Lemon. In the colourful landscape of web accessibility, Gez Lemon stands out as not just a seasoned professional but also as one of the greats. Gez has always been at the forefront of the digital accessibility industry and has gone above and beyond in sharing his passion for making the web an inclusive space for everyone. Keyboard accessibility myths and WCAG Posted on Monday, 27 November 2023 by Graeme Coleman in Design and development Supporting keyboard-only interaction is one of the most important principles of web accessibility. However, the scope of the Web Content Accessibility Guidelines (WCAG) in relation to keyboard accessibility is often misunderstood. Amendment to the Public Sector Accessibility Regulations Posted on Tuesday, 7 November 2023 by Léonie Watson in Standards The UK Public Sector (Websites and Mobile Apps) Accessibility Regulations (PSAR) came into effect in 2018, following the approval of a 2016 Directive from the European Union (EU). In 2022, an amendment to the PSAR was released to address changes brought about by the UK's departure from the EU in 2020. What's new in WCAG 2.2 Posted on Thursday, 5 October 2023 by Patrick H. Lauke in Standards This post gives a high-level overview of what's new and what has changed in the Web Content Accessibility Guidelines (WCAG) 2.2, which have been promoted to stable W3C Recommendation today. Considerations for TV user interface accessibility Posted on Wednesday, 9 August 2023 by Dean Holden in Design and development TVs, set-top boxes and streaming devices are a huge part of all our lives and should be accessible so everyone can watch what they want, when they want, how they want. We've started exploring challenges people with disabilities may face when interacting with TV apps and considerations for people designing and developing TV app interfaces. Meet the team: Alistair Duggin Posted on Wednesday, 5 July 2023 in Meet the team Meet Alistair Duggin, TetraLogical's accessibility champion with a passion for wildlife, fitness and all things outdoorsy. 1 2 3 4 5 6 7 8 9 We like to listen Wherever you are in your accessibility journey, get in touch if you have a project or idea. hello@tetralogical.com"
