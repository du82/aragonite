title = "TetZooCon 2018: Best TetZooCon So Far — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "TetZooCon 2018: Best TetZooCon So Far We did it… and survived. In fact, it was an all-round success (pretty much; see below for caveats). Yes, the TetZoo-themed event of the year – TetZooCon 2018, organised by myself and World’s Joint Most Influential Palaeoartist John Conway – has just happened and I’m now back at home and buried in all the other work I managed to avoid by organising a grand, two-day conference and associated fieldtrip. TetZooCon has now been going for five years, and as the fifth of these events, this one felt a little bit special. TetZooCon 2018: the first one to be more like an actual convention, or conference. Left to right: Caitlin Kight, Hanneke Meijer, Darren Naish. Image: Xane/Michael Lesniowski. Indeed, TetZooCon 2018 was ambitious – possibly over-ambitious. In addition to a long list of talks, the event included a Palaeoart Workshop, a special session on talks devoted entirely to bird evolution, a bird evolution roundtable event, a Speculative Biology on-stage discussion, a quiz, a conference meal and drinks reception, and a post-conference fieldtrip. Abundant stalls with merchandise were there too; we also had numerous book signings and a few ‘show and tell’ events (relating to Dougal Dixon’s SpecBio projects and my in-prep textbook, among other things). For the second year running, Beth Windle brought along a TetZoo-themed cake; this one was devoted to the theme of plastic pollution, and a fine thing it was (even though I only got to eat a small bit of its neck and none of the actual cake). It was also a great social event with a lot of networking and pubbing going on. It’s a TetZooCon tradition that we make special little icons for our speakers and other presenters, and here’s the haul for 2018. Image: John Conway/Darren Naish. Virtually everything was filmed, but pressures of time and workload mean that I haven’t looked at a single bit of the footage yet. I should also add that my plan to record short interviews with people at the event (not just speakers) never panned out (even though I went round with a dictaphone and spare batteries in my pocket the whole while) as I just never had time. I should have given the job to someone else but never even thought about it. On that point, I enrolled some additional session moderators this year: thanks to Dani Rabaiotti, Beth and Georgia Harper. Georgia Witton-Maclean worked as official photographer. What with it being the fifth TetZooCon, the 2018 banner was a special one. Image: Xane/Michael Lesniowski. I will try and keep my recollections brief, otherwise it will take me several articles to get through everything that happened, and that’s not ideal. Already I’m aware that TetZoo is becoming a report of recent adventures more than a blog about tetrapods. Our venue was The Venue (part of the University College London complex at Malet Street) once more; attendee count was somewhere around the 150 mark. A huge quantity of palaeoart was both on show at TetZooCon 2018, and available for sale. Part of my personal haul from the meeting is shown at right. More on palaeoart below. Images: Darren Naish. Baleen whales, music in documentaries, Palaeoloxodon. After a brief intro in which John and I bigged up the fact that we were at THE FIFTH TETZOOCON, talks kicked off with polar biologist, geneticist and whale expert Jennifer Jackson. This was a remarkable and very well illustrated review of everything about baleen whale history you might imagine: their origins and phylogeny, competing views on the taxonomy and systematics of extant forms, population biology and phylogeography, biogeography and historical distribution, the impact of humans on their distribution and abundance, and more! Jenn and I have a long-standing disagreement over the interpretation of a particular sea monster sighting. It’s not impossible that this issue will be thrashed-out in detail at TetZooCon one year. Jenn Jackson gave the most enthralling presentation on baleen whales. Image: Darren Naish. In one of the most innovative and unusual talks of the event, professional composer Fiona Taylor discussed music for wildlife documentaries. This included a background to ideas, disagreements and arguments that have occurred around wildlife documentary soundtracks (“there are no bassoons in the Serengeti”, the Guardian reminds us) as well as demonstrations and explanations of how music can work (and not work), how it can be used (and mis-used), and how it can convey specific emotions or themes. It’s a huge relief to me that everything worked fine with the audio system during Fiona’s talk – it failed to work at all on the Sunday, on which more later. Anyway: my suspicion was high that Fiona’s talk would be really fun and interesting, and I’m pleased that I was right. And I’m not too ashamed to admit that I teared up at the piece of music accompanying the Sad Wolf. Oh… extra points, Fiona, for the Bad Wolf references. Fiona Taylor discusses the use of music in wildlife documentaries, and also shows us how it’s done. Image: Darren Naish. Steven Zhang gave us a specialist’s view of where we’re at with thoughts on the taxonomy, phylogeny, anatomy and palaeobiology of the straight-tusked elephant Palaeoloxodon. Coincidentally (…. or was it?), one of the prizes we had for our quiz was the new Eofauna Palaeoloxodon model. Steven Zhang talks Palaeoloxodon - specifically, at this point, about the alleged survival of this animal into the Holocene (the evidence isn’t great). Image: Georgia Witton-Maclean. Bird evolution roundtable event. Our next event was the roundtable session on bird evolution. I was joined on stage by Albert Chen, Caitlin Kight, Hanneke Meijer, Robyn Womack and Glyn Young (all of whom were scheduled to give bird-themed talks the following day) as we discussed breaking news, current events, on-going research and future prospects relevant to bird evolution. We will definitely be doing roundtables again. When discussing the evolution of Strisores (the bird clade that includes swifts, hummingbirds and nightjars), Albert mentioned in passing that a hummingbird is “a dinosaur trying to be a butterfly”, an evocative line that struck a chord with the audience and even became a meme during the conference. A scene from the bird evolution roundtable event. From left to right: Albert Chen, Caitlin Kight, Hanneke Meijer. Image: Xane/Michael Lesniowski. Lucy Cooke and Katrina van Grouw. The excellent and hilarious Lucy Cooke was up next, speaking about her new book The Truth About Animals … aka The Unexpected Truth About Animals (Cooke 2018), depending on whether you obtain the UK or US edition. Lucy has a background in TV and film-making but switched track to bring attention to amphibian conservation. Today she writes about sloths, giant pandas, bats and all manner of other animals. It was a brilliant talk and definitely a highlight. Lucy was on hand afterwards to sign and sell copies of her book. Lucy Cooke (at right) signs copies of The Unexpected Truth About Animals. Image: Darren Naish. Following Lucy was Katrina van Grouw on another book-themed talk, this one devoted to her fantastic Unnatural Selection (van Grouw 2017). Selective breeding is very much a perfect illustration of evolution in action, and Katrina took us through remarkable examples from the world of pigeons, poultry, dogs, pigs, cats and other animals. The hamster gag was possibly inspired by a similar fish-themed gag employed by that Tetrapod Zoology guy. Katrina was also selling and signing her book. A brief initial take on Katrina’s book has already appeared here at Tet Zoo. Katrina van Grouw and her fabulous book Unnatural Selection at TetZooCon 2018. Image: Xane/Michael Lesniowski. The Palaeoart Workshop – led by John Conway – featured talks from Luis Rey and Mark Witton in addition to an art-making event in which participants were invited to depict prehistoric animals in an unfamiliar style. Bob Nicholls was also in attendance. Unusual and often attractive artwork that resulted from the workshop was up on the walls for the duration – we sure do have a lot of skilled arty-types among us, but then we already know this from previous TetZooCons. Luis and Mark also had art on sale at the event, and Mark’s brand-new book The Palaeoartist’s Handbook (Witton 2018) (which I hope to see properly some time soon… hint hint) was the object of much discussion and interest at the meeting. I should also mention that Joschua Knüppe – he of palaeostream and much else new palaeoart-themed goodness online – was in attendance and showing people original art he’d brought with him. I was carrier for one of the few printed copies of Joschua’s new #Palaeostream: Sketches of Prehistoric Life book (Knüppe 2018), which is wonderful. Bob Nicholls of Palaeocreations was selling prints, including those featuring the cover and concept art for Naish & Barrett’s Dinosaurs: How They Lived and Evolved. Image: Xane/Michael Lesniowski. In order to pack in more stuff this year, we opted to have the palaeoart workshop running as a parallel stream to the rest of the conference. Not ideal, and it means that many of us – myself included – didn’t get to go as we stayed in the main hall for the other talks, but there you go. A very good run-down of what happened can be found in Marc Vincent’s article at LITC, if you’re interested. A selection of palaeoartists present at TetZooCon 2018 (and this isn’t all of them). Left to right: Luis Rey, John Conway, Bob Nicholls, Steve White, Mark Witton and Rebecca Groom. Image: Georgia Witton-Maclean. And what was happening in the main hall at the same time? PhD student and herper extraordinaire (it says so in October’s BBC Wildlife) Steve Allain gave a really interesting (albeit slightly scary and depressing) review of snake fungal disease. Steve will be back at TetZooCon in the near future to discuss his on-going work on introduced British midwife toads, mark my words.Ian Redmond. We were then on to my favourite talk of the meeting (no offence intended to our other very excellent speakers): Ian Redmond’s ‘The Reluctant Conservationist, 40 Years On: From Gorilla Parasites and Poachers to Virtual Safaris’. You’ll be familiar with Ian and his work if you know anything about primates, elephants, rhinos, or conservation in general. I first got to know of Ian due to his association with the late Dian Fossey in the Virunga Mountains of Rwanda, and maybe you did too; he was also on hand to advise David Attenborough and his team during the 1978 filming of that iconic scene with the mountain gorillas. Ian was also involved with the making of the 1988 movie Gorillas in the Mist. Ian Redmond talks about gorillas, Dian Fossey and conservation at TetZooCon 2018. Image: Xane/Michael Lesniowski. The talk itself was fantastic. Ian had brought with him his original field notes and read aloud the section relevant to what occurred 40 years ago on the same date. As it happened, it was a particularly eventful day, since Ian and his colleagues discovered, confronted and apprehended a group of poachers setting snares. He also discussed his work with the famous mining elephants of Mount Elgon and his encounters with forest elephants in general, his first-hand inter-species friendships with individual gorillas, and his on-going work on the preservation of tropical forests, a vital resource as goes the health of the entire planet and the function of our atmosphere and water cycle. Teaching local children the value of their gorillas and other wildlife is an essential part of current work. A small excerpt of Ian’s talk was filmed (very poorly) on my phone and streamed live: I’m hoping that we have the entire talk as I very much want to see it again. You can find out more about Ian’s VR work at www.vEcotourism.org, documentaries on www.ecostreamz.com and follow him on Twitter at @4apes. Ian Redmond, Darren Naish and Archie the Elephant (follow him on twitter @ArchietheEle) at TetZooCon 2018. Image: Darren Naish. Mark O’Shea and forensic historical herpetology. Ian’s talk was followed by one from another celebrity of the zoological world: herpetologist, author, explorer and conservationist Mark O’Shea. Mark’s talk was on forensic historical herpetology: on cases in which he (working with colleague Hinrich Kaiser) worked hard to track down the true geographic origins of worm-eating snake specimens that didn’t otherwise seem right given other knowledge of the group’s distribution, taxonomy and biogeography. Fascinating stuff. Mark O’Shea at TetZooCon 2018: Mark certainly won the prize for longest talk title. Image: Darren Naish. Mark also brought posters (pressures of running a conference meant I never got to have a proper look at them) and stock of his brand-new The Book of Snakes (O’Shea 2018). I purchased a signed copy, and it’s an amazing piece of work. I admire the format, design and fact that he’s consistently said interesting things about the 600 featured species. Yes, the photos are life-sized but this means (obviously) that – in many cases – it’s only the animal’s head and adjacent loop of its body that’s shown at full size, not the whole snake. Mark O’Shea’s 2018 The Book of Snakes, a must-have for those interested in reptiles. Image: Darren Naish. For the first time – yeah, there were a lot of firsts at this one – we finished the evening with both a drinks reception (which didn’t go exactly to plan but was still a thing) and a conference meal. The latter was popular enough (as in, a sufficient number of people wanted to come along) that we could potentially have booked another 20 or more places and filled them. An alternative meal was arranged by Beth Windle and places there were filled as well. I can’t remember what happened after the meal, but I know we got back home. So… so far so good, we’d survived the first day, and it had worked pretty well.Bird evolution session. And so to Sunday. Due to a stupid mistake that neither John nor I caught in time, our schedule had things kicking off at 9am, which won’t happen again. The first several talks of the day were devoted entirely to bird evolution: both deep-time, phylogenetic and palaeontological stuff as well as evolution in the human era. General themes of the subject had of course been outlined the day before in the roundtable session. All of the bird talks were really strong. Robyn Womack’s cover slide. Image: Georgia Witton-Maclean. Robyn Womack reviewed what we know about biological clocks in birds. Her research is on how birds are adapting (or not) to light pollution, the results showing that some birds are undergoing a modification in their timetables and behaviours while others are not. Albert Chen gave us an overview of crown-bird evolution: he covered bird survival and extinction across the KPg event, the shape of the neornithine tree and competing models on how crown-birds might have evolved. His formative role in TetZoo Time and special guest article at TetZoo (ver 3) were mentio"
