title = "The Sixth TetZooCon — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "The Sixth TetZooCon The sixth TetZooCon – the annual TetZoo-themed meeting of people relevant to the TetZooniverse – happened on the weekend of the 19th and 20th October, 2019, and was held at University College London’s The Venue. As predicted, this year’s was the biggest and best so far, and that opinion isn’t just down to me but also to many of the people in attendance. As per usual, this article is going to include a brief review of what went down at the meeting as well as more general thinkings on where TetZooCon is heading and what the future holds. Caption: TetZooCon 2019 was merchandise heaven… or maybe hell if you wanted to limit your spending. Here’s a shot of just some of the palaeoplushies on sale at Rebecca Groom’s stall. I’m now the proud owner of a Yellow-legged gull. Image: Georgia Witton-Maclean. Caption: it was a busy event: here’s a scene from the palaeoart workshop. Image: Georgia Witton-Maclean. My intro out of the way, we were into talks proper, the first being Ellen Coombs’s brilliant review of her work on stranding records of whales and what they tell us about whale distribution, population trends, and biology. Ellen’s recent publications include those on True’s beaked whales Mesoplodon mirus in the Bay of Biscay (Robbins et al. 2019) (recall that I myself was watching beaked whales – albeit not True’s – in the Bay of Biscay back in August) and the life history of Hope, the Blue whale Balaenoptera musculus currently on display in the main entrance hall of London’s Natural History Museum (Trueman et al. 2019). Caption: Ellen Coombs talks whales at TetZooCon 2019 - a fantastic talk. Image: Darren Naish. Jack Ashby was next and discussed natural history museums, specifically on biases in what gets put on display. He also focused on various remarkable animals with really interesting histories, including echidnas, walruses and beavers, and finished with a book signing (the first of several). Jack’s book is Animal Kingdom: A Natural History in 100 Objects (Ashby 2017), and very nice it is too. We followed with our roundtable event on dinosaur and pterosaur palaeobiology, involving myself, Chris Barker, Jordan Bestwick, Dave Hone and Rebecca Lakin. Topics covered included the biology of ‘super-powered’ extinct animals, the reliability (or not) of phylogenetic bracketing, the dinosaur sex wars, and the All Yesterdays movement. Caption: a dinosaur and pterosaur palaeobiology discussion roundtable. It went alright.. Left to right: Chris Barker, Jordan Bestwick, Dave Hone, Rebecca Lakin, Darren Naish. Image: Georgia Witton-Maclean. Mike Dickison followed up with his ‘What Is a Native Bird?’. Birds in places like New Zealand are conventionally regarded as either ‘native’ or ‘introduced’, but things are actually much more complex and this dichotomous view is not accurate nor representative of historical events. Mike’s talk included diversions on Haast’s eagle and its life appearance and much else. Alice Pawlik discussed Adventures in Native Amphibian Conservation and told us about her work on Pool frog Pelophylax lessonae reintroduction to the UK. Caption: Mike Dickison’s talk on New Zealand’s birds was full of up-to-the-minute science and surprises from the world of palaeontology and genetics. Image: Darren Naish. Another excellent talk on extant British wildlife was given by Amy Schwartz who told us about Project Splatter, a citizen science project devoted to the monitoring of roadkill. The project has accrued tens of thousands of records and revealed significant new information on how wildlife is being affected by roads, and which species are being affected in particular. A technical publication on this work is due to appear soon. Caption: this picture conveys some idea of how much palaeoart-themed stuff there was at TetZooCon 2019. Look: poster boards with actual art, people like Steve White (with glasses, on left), and stands and stalls covered in art for sale. Image: Georgia Witton-Maclean. Palaeoart at TetZooCon. Two parallel sessions happened after lunch on the Saturday. Away from the main hall, our Palaeoart Workshop occurred, with short talks from Joschua Knüppe, Agata Stachowiak, Rebecca Groom and Jed Taylor. These were followed by a practical session in which people were invited to create art in a given style. As ever, I was unable to attend, so missed out. 3D art was a theme for part of the workshop: Rebecca discussed the making of her palaeoplushies (which, as usual, were on sale this year), Jed spoke about the contruction of theropod models, and Agata’s talk was on the construction of her amazing Megaloceros model. The look of this model is very much inspired by 2018’s TetZoo article on the life appearance of this animal. Several depictions of Megaloceros, actually, are based on the information provided in that article. I’ll write about them here, in time. Finally as goes the palaeoart session, Joschua spoke about his #Paleostream project. Caption: I absolutely adore Agata Stachowiak’s Megaloceros model, and was extremely pleased to see it at TetZooCon 2019. Images: Darren Naish. I should add that palaeoart was a major theme of this year’s TetZooCon. We not only had a ton of palaeoart-themed stalls, we also had an evening event on the Saturday – featuring, in cases, original art (Luis Rey’s many originals being especially memorable) – as well as a set of models and a diorama brought along by film-maker Paul Glynn. Caption: Luis Rey original artwork was on show at TetZooCon 2019 (actual, physical, painted artwork). Luis himself appears in the image at right. Images: Georgia Witton-Maclean. Caption: a small section of Paul Glynn’s excellent and enormous Cretaceous diorama. We hope to see more of Paul’s models and model landscapes at future events. Image: Darren Naish. Several of our palaeoartists sold and signed books. Luis’s new book is Extreme Dinosaurs 2: the Projects, Steve White’s is Thunder Lizard: The Art of Steve White, and James McKay’s is Trilobites, Dinosaurs and Mammoths: An Introduction to the Prehistory of the British Isles. Mark Witton was also selling copies of The Palaeoartist’s Handbook, and Gareth Monger A Disarray of Palaeoart. John bought along a stack of All Yesterdays to sell but, as usual, forgot about them and left them under a table or something. Caption: more artwork: a John Conway print of a mega-giant Barosaurus standing alongside other dinosaurs. Some of you will know that this image is based on finds discussed over at SV-POW! Image: Darren Naish. Having mentioned stalls, I must also add that Dougal Dixon was in attendance as were Breakdown Press (publishers of the new edition of After Man), so here was a chance to get signed copies of Dougal’s books. I’m extremely happy to have Dougal as a guest at TetZooCon, and the word on the street is that he’ll be in attendance next year too. Caption: Dougal Dixon (at left) and Tom of Breakdown Press, both selling books. Image: Georgia Witton-Maclean. Natural History Film-Making. Meanwhile, an entire afternoon dedicated to natural history film-making occurred in the main hall. Amber Eames spoke about her award-winning film Swans: Mystery of the Missing, dedicated to the plight and decline of Europe’s Bewick’s swans Cygnus bewickii. This was followed by a roundtable event involving several members of the BBC Natural History Unit, namely Paul Stewart, Nick Lyon, Zoe Cousins and Amber Eames again. I asked Paul questions about my favourite TetZoo-relevant TV series – 1992’s The Velvet Claw – before talking to him about his work on birds-of-paradise and bowerbirds (the newest of which is featured in the brand-new Netflix show Dancing With the Birds) and the iguanas vs snakes segment from Galapagos. Nick and I mostly discussed Dynasties (Nick was director and producer of the wild dogs episode), Zoe and I spoke about her films on pigeons, squirrels, wildcats and Australia, and Amber and I spoke about swans. Caption: Amber Eames talks about Swans: Mystery of the Missing at TetZooCon 2019. Image: Georgia Witton-Maclean. Everyone was then involved in some general questions about natural history film-making and things were then opened things up to the floor. We watched Jedi chipmunks, the opening sequence of episode 1 of The Velvet Claw, and some raw background footage from the field, provided by Nick. It was a brilliant event if I say so myself. Caption: participants in the Natural History film-making discussion event. Left to right: Nick Lyon, Paul Stewart, Zoe Cousins, Amber Eames, Darren Naish. Image: Georgia Witton-Maclean. Dinosaur and Pterosaur Palaeobiology. Sunday morning opened with a block of talks on dinosaur and pterosaur palaeobiology (Mike Dickison also ran a workshop on Wikipedia as a parallel session). Chris Barker looked at palaeopathologies in fossil theropods and wondered if the ever-present threat of predation might have a psychological and even physical impact on prey species (yes, there’s science behind this somewhat radical idea). He was followed by Dave Hone, who looked at the terminology we use when talking about dinosaur behaviour and ontogeny, the main takehome being that things aren’t as specific as they should be and that more precision is needed. Caption: Jordan Bestwick spoke about his PhD work, soon to appear in print. Image: Darren Naish. Rebecca Lakin was next, and discussed her research on reproductive strategies in dinosaurs and other archosaurs, and the session finished with Jordan Bestwick, who discussed his work on how tooth morphology and microwear can be informative with respect to diet and lifestyle. Jordan’s results are exciting and shed much light on pterosaur feeding ecology. The more intriguing and novel of the results can’t be shared yet and we look forward to this work being published soon. Caption: Rebecca Lakin at TetZooCon 2019, another excellent talk. Image: Darren Naish. Of Eagles, The Missing Lynx, and Life After Walking With Dinosaurs. My personal highlight of the entire meeting was Lauren McGough’s ‘When Eagles Go Bad!’. That title is a homage to the very first TetZooCon article, published way back in 2006. An experienced falconer since her teenage years, Lauren has flown Golden eagles Aquila chrysaetos in Mongolia, and used this knowledge to learn about eagle-primate interactions in Africa and rehabilitate injured Crowned eagles Stephanoaetus coronatus in South Africa. Her descriptions of eagle behaviour, predatory power, anatomy and ferocity were phenomenal and I can’t stop thinking about them. It’s a great honour to have any speaker at TetZooCon, but hosting Lauren at the event feels like an especially great honour since her research and adventures have been so integral to much of what I’ve written about and thought about since instigating this whole TetZoo thing more than a decade ago. To top it all, Lauren herself is something of a TetZoo fan; what a thrill. Caption: Lauren McGough, eagle expert and all-round superstar. Image: Darren Naish. Following Lauren was palaeomammalogist and ancient DNA researcher Ross Barnett. Ross’s work spans an enormous number of animals living and extinct, but I think it’s fair to say that he’s best known for his studies of lions and sabretooths. His talk at TetZooCon was a broad-bush take on Britain’s lost mammal fauna as reviewed in his new book The Missing Lynx (Barnett 2019). He spoke about hyenas, cave bears, beavers, lynxes and rewilding and the potential for future change and reintroduction. Ross’s talk was followed by a signing event and very successful it was too. Caption: the crowning achievement of Ross Barnett’s career, surely: having his research written about in The Daily Mash. Such accolade. Image: Georgia Witton-Maclean. The final talk of the day was by Tim Haines and discussed the ups and downs of ‘digital dinosaur’ projects, namely Walking With Dinosaurs, Sea Monsters, Walking With Beasts and so on. It was titled ’20 Years Since Walking With Dinosaurs’, and the timing was pretty uncanny since October 2020 is almost exactly twenty years since Walking With Dinosaurs first aired. Regular readers might know that I’ve had a long-term involvement in Tim’s projects, initially because my PhD supervisor (Dave Martill) was one of WWD’s consultants. This relationship led to Dave and I’s co-authoring of Walking With Dinosaurs: The Evidence (Martill & Naish 2000), and ultimately to my stint at Impossible Pictures and more recently to my involvement in Dinosaurs In The Wild. It was obvious from our audience’s reaction that Tim had a pretty substantial fanbase at TetZooCon and that his talk was both well-received and much anticipated. Caption: Tim Haines - with assistant - talks digital dinosaur projects at TetZooCon 2019. Image: Georgia Witton-Maclean. The Denouement. Talks out of the way, we ended with the famous/infamous quiz, this year won by Richard Hing. Albert Chen and Kelvin Britton were joint runners-up. Prizes included a fantastic array of top-notch animal models provided by our friends and supporters at Everything Dinosaur, not least of which was the brand-new Rebor Komodo dragon, as well as various books, art prints, some leftovers from Dinosaurs in the Wild and a mystery gift in an envelope which was definitely not a dead rat. And that was that. We had a conference meal later on the Sunday evening, went drinking afterwards, and a bunch of us went on a Monday fieldtrip to ZSL London Zoo, all of which was great. Caption: a selection of great animals seen at ZSL London Zoo on our post-TetZooCon field trip (clockwise from top left: Dumeril’s salamander, Galapagos giant tortoise, Splendid sunbird, Pygmy hippo). Images: Darren Naish. Despite a few hiccups, TetZooCon 2019 ran smoothly overall and seems to have been enjoyed by everyone who attended. We had a good contingent of friends from the continent and even several North Americans: thank you all so much for coming! And I’m pleased that things worked out despite our venue – The Venue – double-booking the room and messing us around at the last minute. As ever, we really do need a different venue, but we haven’t yet succeeded in getting one that gives us what we need and is affordable. Caption: he is the One and Only John Conway. Allegedly. It only leaves me to say huge and heartfelt thanks to everyone who assisted or attended or helped: to John, Jenny, Will, Tilly and Arty for help, to Kate and Alice for chairing sessions, to Georgia for photography, to Everything Dinosaur, Sheila, Dinosaurs in the Wild, Johan, Mark and others for donating gifts for the quiz, to all our amazing speakers and presenters, to everyone who staffed stalls and sold things, and to all our attendees. As per usual, we aim for next year to be bigger and better!Several reviews of TetZooCon 2019 have already appeared online…TETZOOCON 2019 – DAY 1 at Love in the Time of ChasmosaursTetZoo.Con 2019… a throwback to better times looking into​ the future at Luis V. Rey Updates BlogTetZooCon 2019 at Talita Bateman’"
