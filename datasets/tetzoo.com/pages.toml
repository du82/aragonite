title = "Postcranial Palaeoneurology and the Lifestyles of Pterosaurs — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "Postcranial Palaeoneurology and the Lifestyles of Pterosaurs Regular readers will know that I – with colleagues – publish fairly regularly on azhdarchoid pterosaurs, the very special pterosaur group that includes the short-faced tapejarids, the sometimes gigantic, long-jawed azhdarchids and a few groups seemingly intermediate between these two. Azhdarchoids are quite obviously the best and most interesting of the pterosaurs. And back in 2013, I and colleagues published a description and analysis of a new species from the Early Cretaceous of the Isle of Wight known only from a three-dimensional pelvis and some associated vertebrae. We called it Vectidraco daisymorrisae, its name honouring Daisy Morris, the young woman who discovered it (Naish et al. 2013). The Vectidraco daisymorrisae holotype (NHMUK PV R36621) in (A) left lateral, (B) right lateral, (C) dorsal and (D) ventral views, and - at right - shown in anatomical position as per the animal's presumed profile in life. Image: figures from Naish et al. (2013). Enough is known of Vectidraco for us to make some determination as goes what sort of pterosaur it is (it seems to be a tapejarid or tapejarid-like azhdarchoid), and we can also say interesting things as goes its size and degree of skeletal pneumatisation (Naish et al. 2013). It’s well preserved enough that quite a few other things can be done with it as well. Last year Rachel Frigot used it as a model in the determination of pelvic and hindlimb musculature (Frigot 2017). And, as part of her PhD work on pterosaur pneumaticity and anatomy, my colleague Liz Martin-Silverstone sought to do some neat science with it as well. This work has just been published (Martin-Silverstone et al. 2018), and that’s why we’re here today. My friend and colleague Dr Liz Martin-Silverstone, at work in the field (at left, Liz is finding fossils in a river in Romania) and in a museum exhibition at right (Liz is standing next to an exhibition panel all about her work. Let's not talk about that weird silhouette at upper right...). Images: Darren Naish. Much of Liz’s work has involved CT-scanning (you can read about her own adventures here on her blog) and the relationship between pneumatisation, mass and flight. Vectidraco is at the other end of the scale from many of the pterosaurs that Liz has worked on (it was a small pterosaur with a wingspan likely less than 1 m as an adult) and was readily available, so it seemed sensible to incorporate it into her work. We scanned the specimen at its home (the Natural History Museum, London), and compared the results with those obtained from other pterosaurs we had to hand: namely, the ornithocheirids* Anhanguera and Coloborhynchus, scanned variously at Stony Brook University Hospital (thanks to Pat O’Connor for that data) and at the µ-VIS (pronounced ‘mu-vis’) X-Ray Imaging Centre at the University of Southampton (Martin-Silverstone et al. 2018). And we got pretty good results.* Ornithocheirids: the mostly marine, long-jawed, long-winged pterodactyloid pterosaur group named for Ornithocheirus from the 'middle' Cretaceous of the UK. The group names Anhangueria and Anhangueridae refer to the same group... views differ on which taxonomic system we should adopt. Pelvic regions of the three pterosaurs included in our study, to scale: (A) Vectidraco daisymorrisae holotype NHMUK PV R36621, (B) Anhanguera specimen AMNH FARB 22555, (C) Coloborhynchus robustus specimen SMNK PAL 1133. Scale bar = 50 mm. Image: Martin-Silverstone et al. (2018). The first interesting thing to note is that the work corrects, updates and augments various anatomical details I reported in the initial description of Vectidraco (Naish et al. 2013). Bony openings that I interpreted as pneumatic foramina turn out to be foramina for spinal nerves (properly termed intervertebral foramina), and convex transverse ridges present on the sides and undersides of some of the vertebrae are misidentified intervertebral junctions. Cool – it’s good to learn more. The identification of intervertebral foramina is not a big deal at all given that these structures are ubiquitous in tetrapods but it's worth bringing attention to them given that they’re virtually unmentioned elsewhere in the pterosaur literature. The Vectidraco holotype is one of those wonderful specimens that preserves a great many neat little anatomical details - look at these various pneumatic cavities on the T-shaped post-acetabular process on the posterior part of the ilium. Waitaminute.... aren't all the specimens like this? Image: Darren Naish. And if you’re wondering why I and my colleagues didn’t CT-scan the specimen the first time around and get this stuff correct on our first, 2013 attempt, it’s because CT-scanning requires money and virtually everything I do has been, and is, unfunded.Anyway… what else could we do with the CT-scan data? Well…During the late 1980s and 90s, Emily Giffin (later Emily Buchholtz) published several papers in which she used data from the size of the neural canal in the vertebrae of fossil tetrapods to make inferences about nerve size, the size then serving as a proxy for degree of innervation, this then serving as a guide to things like limb function and posture (Giffin 1989, 1990, 1992, 1995a, b). Her studies looked variously at non-bird theropods, extinct crocodylians and fossil pinnipeds, and she reported encouraging results. Non-bird theropods with large hands, to take one example, possessed neural canals in the corresponding part of the spine that were proportionally large, and hence suggestive of the well-developed nervous anatomy we would expect for animals that regularly used their hands in grabbing, piercing and tearing (Giffin 1995a). Her work has inspired other researchers to use the same (or similar) techniques on plesiosaurs and fossil raptors (again, here’s your helpful reminder that I will only ever use this term in the correct fashion. It applies to hawks, eagles and falcons and has done since the 1800s at least). In a series of really interesting papers, Emily Giffin linked neural canal size with form and function in diverse tetrapods. This graph (from Giffin 1995b) shows how birds flying and flightless differ as goes the position of the largest parts of their spinal cords. The ostrich (Struthio) lacks a large spinal cord section in the anterior (brachial) part of its spinal column. Image: Giffin (1995b). Several caveats make this technique far from fool-proof (Giffin 1995a). With these things in mind, we wondered if data from pterosaurs might be informative as goes ideas on their ecology and lifestyle. What we found is that Vectidraco has an unusually large neural canal in its sacral region compared to Anhanguera, indicating that it therefore had a proportionally large spinal cord (and lumbosacral plexus) in its lumbosacral region. Anhanguera and Coloborhynchus both had enlarged neural canals in the area corresponding to the brachial plexus, larger than the neural canals in their sacral regions. Vectidraco’s shoulder region is entirely unknown at the moment so we couldn't make any comparison here. Neural canal cross-sectional area in our three pterosaur taxa: when normalised for centrum size, Vectidraco has a proportionally large neural canal. This composite image incorporates figures from Martin-Silverstone et al. (2018) but was produced by the Palaeontological Association. Image: Martin-Silverstone et al. (2018). Taken together this suggests the following: evidence for a large brachial enlargement in ornithocheirids is consistent with the idea (based on their long, high-aspect wings and small hindlimbs) that they were highly aerial animals, while the large sacral neural canal in Vectidraco indicates that it was more proficient at terrestrial locomotion than Anhanguera. There are already indications from pelvic morphology, hindlimb size and so on that azhdarchoids and ornithocheirids were doing very different things in terms of ecology and behaviour (Witton & Naish 2008, 2015, Witton 2013, Naish & Witton 2017), so this matches what we might predict. Vectidraco could almost certainly fly well, as shown at left. But - like many, most or all azhdarchoids - it was likely a proficient and regular terrestrial walker as well, as shown at right. Image: Mark Witton (left), Darren Naish (right). So far so good. But the complication comes from the second ornithocheirid we looked at: Coloborhynchus. Oh, here I’ll avoid the whole mess concerning the taxonomy of Anhanguera and Coloborhynchus. All I’ll do for now is say that “it’s complicated” and promise that I’ll come back to it in the near future. Anyway… the Coloborhynchus specimen we analysed is not like our Anhanguera specimen as goes the proportional size of the neural canal in its lumbosacral region -- it lacks a distinct lumbosacral enlargement but is superficially Vectidraco-like in having a larger neural canal in the relevant region (Martin-Silverstone et al. 2018). This is an unexpected result. Does it mean that some ornithocheirids were far more terrestrially capable than others, this perhaps reflecting niche differentiation or some other form of variation? Or does it mean that some ornithocheirids were far more aerially specialised than others and that the default condition was to have a larger sacral neural canal? Or does it mean that there’s something else we haven’t accounted for? (example: maybe some of these pterosaurs had enlarged neural canals due to pneumatisation in the neural canal? Yes, air sacs dorsal to the spinal cord. This is a thing). I don’t think it means that Coloborhynchus-type pterosaurs were as terrestrially proficient as Vectidraco, nor that our ideas on said terrestrial proficiency in azhdarchoids like Vectidraco are bogus, given the fact that Vectidraco appears to have a lumbosacral enlargement while the ornithocheirids do not, and that azhdarchoids like Vectidraco possess weird features indicative of terrestrial specialisation (like the giant, T-shaped postacetabular process on the ilium) lacking in ornithocheirids. But it’s clear that more data and more work is needed, as usual with these sorts of things. Behaviour speculatively inferred for the pterosaurs incorporated in our study. (A) A dedicated aerial lifestyle involving little terrestrial behaviour, as per Anhanguera; (B) reasonable terrestrial abilities in an animal otherwise very similar to its close, highly aerial relatives, as per Coloborhynchus; (C) proficient and regular terrestrial behaviour in an animal that routinely feeds and forages on the ground, as per Vectidraco. Image: Darren Naish. It’s also important to remember that this data – this work as a whole – is complimentary to other studies. CT scan data on neural canal size provides nothing like a ‘Rosetta Stone’ on behaviour or lifestyle, and the more we learn about anatomy and form-function correlation, the less likely it seems that such things exist. We already have lots of reasons for thinking that azhdarchoids were better adapted for terrestriality and life in cluttered, inland settings than were many other pterosaurs, and likewise there are excellent reasons for thinking that ornithocheirids were aerial specialists and something like frigatebirds as goes ecology and lifestyle (though seemingly capable of swimming and perhaps diving, in contrast to the more piratical frigatebirds). So, this work is part of the dataset, part of the puzzle. And this is effectively an opening foray in this most intriguing area.That’s where we’ll end for now. More on pterosaurs here soon!My technical research and my writing here at the blog continues with your kind support via patreon. Many thanks to those who assist my projects. Please consider assisting if you can. The more independence I achieve, the more time I can spend producing the content you enjoy.For previous Tet Zoo articles on pterosaurs, see...Terrestrial stalking azhdarchids, the paper, May 2008Shemhazai and other flightless pterosaurs, September 2008Come back Lank, (nearly) all is forgiven, September 2008Giant pterosaurs invade London, Summer 2010, July 2010Pterosaurs, err, indoors (the Summer 2010 exhibition), July 2010Getting scansoriopterygids, terrestrial-stalking azhdarchids, sauropod pneumaticity and the word palaeontography into a kid’s book, July 2010The Cretaceous birds and pterosaurs of Cornet: part II, the pterosaurs, September 2010Milton Keynes: where giant pterosaurs go to die, May 2011What does it feel like to get bitten by a ground hornbill, I hear you ask?, June 2011A new azhdarchid pterosaur: the view from Europe becomes ever more interesting, Jan 2013Daisy’s Isle of Wight Dragon and why China has what Europe does not, March 2013In Rio for the 2013 International Symposium on Pterosaurs, May 2013Quetzalcoatlus: the evil, pin-headed, toothy nightmare monster that wants to eat your soul, August 2013Were azhdarchid pterosaurs really terrestrial stalkers? The evidence says yes, yes they (probably) were, December 2013Some Azhdarchid Pterosaurs Were Robust-Necked Top-Tier Predators, February 2017Refs - -Frigot, R. 2017. Pelvic musculature of Vectidraco daisymorrisae and consequences for pterosaur locomotion. In Hone, D. W. E., Witton, M. P. & Martill, D. M. (eds) New Perspectives on Pterosaur Palaeobiology. Geological Society, London, Special Publications Special Publications 455, 45-55.Giffin, E. B. 1989. Gross spinal anatomy and limb function in living and fossil reptiles and birds. American Zoologist 29, 181A.Giffin, E. B. 1990. Gross spinal anatomy and limb use in living and fossil reptiles. Paleobiology 16, 448-458.Giffin, E. B. 1992. Functional implications of neural canal anatomy in recent and fossil marine carnivores. Journal of Morphology 214, 357-374.Giffin, E. B. 1995a. Functional interpretation of spinal anatomy in living and fossil amniotes. In Thomason, J. J. (ed) Functional Morphology in Vertebrate Paleontology. Cambridge University Press, pp. 235-248.Giffin, E. B. 1995b. Postcranial paleoneurology of the Diapsida. Journal of Zoology 235, 389-410.Martin-Silverstone, E., Sykes, D. & Naish, D. 2018. Does postcranial palaeoneurology provide insight into pterosaur behaviour and lifestyle? New data from the azhdarchoid Vectidraco and the ornithocheirids Coloborhynchus and Anhanguera. Palaeontology 2018, 1-14. doi: 10.1111/pala/12390Naish, D., Simpson, M. I. & Dyke, G. J. 2013. A new small-bodied azhdarchoid pterosaur from the Lower Cretaceous of England and its implications for pterosaur anatomy, diversity and phylogeny. PLoS ONE 8 (3): e58451.Naish, D. & Witton, M. P. 2017. Neck biomechanics indicate that giant Transylvanian azhdarchid pterosaurs were short-necked arch predators. PeerJ 5: e2908.Witton, M. P. 2013. Pterosaurs. Princeton University Press, Princeton & London.Witton, M. P. & Naish, D. 2008. A reappraisal of azhdarchid pterosaur functional morphology and paleoecology. PLoS ONE 3 (5): e2271.Witton, M. P. & Naish, D. 2015. Azhdarchid pterosaurs: w"
