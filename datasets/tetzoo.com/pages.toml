title = "A Review of Robert L. France’s Disentangled: Ethnozoology and Environmental Explanation of the Gloucester Sea Serpent — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "A Review of Robert L. France’s Disentangled: Ethnozoology and Environmental Explanation of the Gloucester Sea Serpent Among the most famous sea monster cases of all time is that of the Gloucester Sea Serpent of New England, USA… Caption: the most famous depiction of the Gloucester Sea Serpent is this fanciful one dating to August 1817, said to have been drawn from life. I don’t think the name of the artist is on record. Image: public domain. This giant, serpentine creature was seen on numerous occasions between 1817 and 1824, often at relatively close range by large numbers of people, and often by people of respectable standing. Many drawings of the creatures were produced, but physical evidence of its existence was never obtained, the one relevant incident being the 1817 recovery of a small snake with a peculiar lumpy dorsal outline. This was very obviously a Black or Eastern racer Coluber constrictor afflicted with a spinal deformity. The case of the Gloucester Sea Serpent is familiar enough that it’s covered in most works that review sea monsters and their claimed existence (e.g., Heuvelmans 1968), and indeed a few books are dedicated entirely to the creature itself (O’Neill 1999 [republished by Paraview in 2003], Soini 2010). How has the monster been identified? The opinion promoted most frequently by writers specialising in cryptozoology has been that it was a scientifically unrecognised, serpentine mammal with a series of dorsal humps arranged along its length (Heuvelmans 1968, Woodley 2008) or perhaps a giant sea reptile of the sort otherwise known only from the fossil record (O’Neill 1999). Caption: two books dedicated to the Gloucester Sea Serpent – written for adults – are in existence, and both are worth reading. June O’Neill’s book of 1999 (though this is the cover of the 2003 Paraview edition), and Wayne Soini’s of 2010. Robert France’s Disentangled is yet another volume dedicated to the Gloucester Sea Serpent, but it’s unlike any other. For all the popular and sensationalist interest in sea monsters, academic treatments of the subject are rare, making this book a significant addition to the literature; more so given that it was written by a qualified scientist with a substantial number of technical, peer-reviewed publications to his name. At this point I must spoil the surprise and reveal France’s primary hypothesis: that the appearance and occurrence of the Gloucester Sea Serpent was intimately tied to the economic and social history of the New England coast, and that sightings of this creature were actually of large vertebrate animals entangled in fishing gear (France 2019). Caption: this is another especially famous depiction of the Gloucester Sea Serpent from 1817, and again it’s by an anonymous artist. The idea that the monster was seen at relatively close range is again emphasised. Image: public domain. France on cryptozoology and cryptozoologists. What does France (2019) make of those authors who have gone before him, most of whom have been rather kind to the possible existence of sea monsters as valid zoological entities (that is, as giant marine animal species awaiting scientific recognition)? He is overwhelmingly critical of such writers, I think rightly dismissing their efforts as unscientific or, at least, as ‘bad science’. LeBlond and Bousfield’s infamous work on ‘Cadborosaurus’ (much written about here at TetZoo; see the links below) is not viewed favourably, nor is Michael Woodley’s 2008 book In the Wake of Bernard Heuvelmans (Woodley 2008). Michael (who no longer publishes cryptozoological articles; he and I co-authored some works between 2008 and 2012) has indeed promoted some unusual ideas that cannot be correct, these including that the ‘super otter’ and ‘many-humped’ sea monsters of Heuvelmans (1968) might actually be literal super-sized otters. France (2019) sees red, and describes Woodley’s writings here as “one of the most blatant displays of cryptozoological fancy” and a “ridiculous bit of science fiction” (p. 169). Caption: books that discuss sea monster reports – here are some (albeit not all) of them – mostly interpret the relevant encounters as descriptions of giant, scientifically unrecognised animal species. Image: Darren Naish. Henry Bauer has argued that sea monsters and lake monsters are based on reliable evidence supported by trustworthy experts, and that critics of cryptozoology are misguided and unscientific (e.g., Bauer 1982, 2002). But watch his public speaking and read enough of his articles and you’ll find that he endorses research denying a link between HIV and AIDS, and regards homosexuality as an illness. France has noticed this too and regards Bauer as a “fringe scientist” (p. 16).As for the ‘Father of Cryptozoology’ Bernard Heuvelmans, France is highly critical, accusing him of sloppy scholarship, selective bias, manipulation of facts, an inability to identify hoaxes and misinterpretations of natural phenomena, of being “delusional at best, or outright dishonest at worst”, and of compiling “a house of cards assembled from a Trumpian world of ‘alternative facts’” (p. 30). Meurger (1988) is cited here as providing inspiration (it should really be cited as Meurger & Gagnon (1988)) but this takedown of Heuvelmans much more recalls Ulrich Magin’s critique (Magin 1996), paraphrased in Hunting Monsters (Naish 2017). I’ve even specifically likened the cryptozoological literalism of Heuvelmans and his followers to a house of cards, but I don’t doubt that this use of allegory could be coincidental. Cryptozoological classification schemes – the meat-and-potatoes of works by Heuvelmans, Coleman and Huyghe, Woodley and others – are described as a ‘nomenclature of nonsense’ by France (2019, p. 165). Caption: the most influential sea monster book of them all is Heuvelmans (1968). Therein, he argued for the existence of nine distinct sea monster types, illustrated at left by Cameron McCormick. Their purported existence hasn’t exactly been embraced by biologists at large. Images: Cameron McCormick, Heuvelmans (1968). When it comes to those who’ve been critical of cryptozoological literalism, France is quite the fan. Konar (2009) – an article I cannot claim to know – is cited and discussed since its author argues that cryptozoology is a pseudoscience. France writes favourably of Michel Meurger’s argument – promoted most famously in Meurger & Gagnon (1988) – that efforts to interpret the creatures of myth, folklore and anecdote as valid undiscovered animal species miss the point (“aquatic cryptids are ‘real’ only in the sense that they are mental constructs that have their origin in folklore and exist within a mythological landscape”; France 2019, p. 33), and he likes Daniel Loxton and Don Prothero’s Abominable Science (Loxton & Prothero 2015) and cites it frequently.My own writings on sea monsters and cryptozoology in general are abundantly cited and fairly credited but mostly in a single paragraph on page 32 rather than scattered throughout the text as might seem appropriate. This (perhaps falsely) creates the impression that France only discovered my writings late in his project and opted to crowbar them in somewhere, but no matter.After all this, what does France make of cryptozoology overall? Does it have value, has it been mis-framed, or is it just a pile of shit? I found France’s take on this issue difficult to parse and inconsistent. Despite strong agreement with those who argue that the study of cryptids is more to do with a sociocultural interpretation of the world, France argues in part of the book that it should be regarded as “an anachronistic form of natural history” (p. 35). He takes time to dismiss the notion that cryptozoology might be considered part of ecology. Which is odd, because surely the identification of entities reported via anecdote and observation is very obviously not ecology (assuming that ‘ecology’ relates to the study of how organisms relate to their physical surroundings) but instead more to do with systematics, biodiversity monitoring and/or social anthropology and folklore. Indeed, if the bulk of the cryptozoological literature involves the collecting of anecdotes about things implied or believed to be animals, and the evaluation of these anecdotes such that flesh and blood animals can be ‘shown’ to be at the bottom of the reports, we’re not talking about natural history or ecology but ethnozoology. France ends Chapter 1 with a hearty endorsement for the value of ethnozoology as a valid field of study, the takehome being that what people have been calling cryptozoology is ethnozoology.The entanglement hypothesis. Introduction out of the way, France devotes the next section of the book to the 19th century ‘eco-cultural seascape’ of the North American eastern seaboard, covering the region’s geography, economy and cultural history. A classical and biblical background gave the region’s European colonists a belief system whereby elongate, unidentified marine objects (France uses the acronym UMO throughout the book) might be interpreted as gargantuan marine serpents, and some appropriate section of text is devoted to 19th century fishing methods and the technology employed. This looks on initial reading like an aside but is crucial for the argument that France (2019) later compiles, this being that entanglement explains the sea monster sightings. But waitaminute – isn’t entanglement with marine debris (‘ghost gear’ and so on) a modern issue, linked to the use of modern fishing materials? No. It turns out that fishing gear has been lost or dumped at sea for as long as people have been making such things, that animals large and small have been becoming entangled in lost or dumped fishing gear since forever, and that seafaring people have been aware of this issue but have not had cause to report it, or have wilfully under- or unreported it, since time immemorial. Entanglement is a pretty horrible thing. Individual animals can remain bound in or connected to debris for literally years, and both old and modern materials used in fishing are made of materials that persist for decades and, potentially, centuries. As France (2019) shows via his analysis of Gloucester Sea Serpent reports, people’s descriptions of the UMOs concerned pertain to animals entangled in ropes, or swimming while connected to floats, buoys, barrels, kegs or netting. I found his case compelling. Caption: some, perhaps many, of the sea monsters endorsed at times by cryptozoologists now need to be reinterpreted as observations of known animal species entangled with marine debris. Among them is the supposedly tadpole-like ‘yellow belly’ of Heuvelmans (1968). This imagined creature has been discussed at TetZoo on several occasions over the years. Images: Heuvelmans (1968), Darren Naish, Tim Morris. By now it will be obvious why the book has the title that it does. Disentangled refers not only to the fact that entanglement with fishing gear explains many, most or all of the sea monster accounts relevant to the Gloucester case, but also that France (2019) has succeeded in disentangling the strands of a story that hasn’t previously been understood. Is this definitely so, though? In view of the drubbing that cryptozoological literalists receive throughout France’s book, it’s ironic that Heuvelmans (1968) was the first to propose the entanglement hypothesis. In attempting to interpret a sea monster seen in Cape Town Harbour in 1857, and reported by a Dr François Biccard and seven other observers, Heuvelmans (1968) wrote that “This so-called body is so unlike any part of an animal that one cannot help thinking that it may have been a net or rope towed by a shark or [France has ‘of’ here] porpoise which had got caught in it and whose wounded body appeared to be what the doctor called the head” (Heuvelmans 1968, p. 242). But, alas, poor Bernard, here “Demonstrating a degree of perceptive reasoning markedly absent from the rest of his tome…” (France 2019, p. 194). Damned with faint praise. Incidentally, France (2018) has written a whole paper on the Cape Town Harbour case and its significance. Caption: Biccard’s illustration of the 1857 sea monster (or UMO) seen from Table Bay, Cape Town. There weren’t two monsters: the picture shows two views of the same object. Heuvelmans (1968) was unable to place this creature within any one of his nine sea monster categories. Image: public domain. But if the Gloucester Sea Serpent (and at least some other sea monsters too) really was an animal entangled in lost or discarded fishing gear, what specific animal are we talking about? France (2019) eliminates whales for various reasons and favours the view – in part based on the swimming speed of the monster, its ability to make extremely tight turns and its propensity to frequent very shallow water – that the most likely candidate was the Bluefin tuna Thunnus thynnus. “Most likely”? Is that the best we can do? The fact that the monster’s true identity can’t be precisely determined and remains unresolved is slightly awkward given France’s (2019) determination earlier in the book that cryptozoology is unsatisfyingly unspecific, and France readily admits this. But as a committed advocate of the notion that providing a provisional or ad hoc scientific conclusion is by no means problematic, I don’t see an issue. Caption: tuna are remarkable fishes, and France (2019) emphasises how incredible they are. Strong, fast, and surprisingly big (this life-sized model – formerly on show at London’s NHM – is about 2 m long), they might help explain the Gloucester Sea Serpent UMO. Image: Darren Naish. Yes, I agree with Robert France that entangled marine vertebrates are the real explanation behind some, if not many, sea monster sightings… or UMOs, if you prefer… and specifically those associated with Gloucester Harbour, Massachusetts. I’m slightly embarrassed not to have noticed this earlier. But, then, to reach this conclusion and write authoritatively about it requires not only a familiarity with the sea monster literature and cryptozoological lore but also with the anthropology, economy and industry of North America’s eastern seaboard, and few of us have been focused enough, or expert enough, to do that. Professor France, I raise my glass. Caption: the entanglement hypothesis doesn’t mean that all ‘sea monster’ reports describe animals that can be interpreted in the same way: some accounts are, more likely, just misidentifications. One example mentioned by France is that of the ‘baby Cadborosaurus’, reinterpreted by myself and colleagues in 2011 (Woodley et al. 2011). Image: Woodley et al. (2011). A few statements and proposals made in the book are objectionable and might be deemed wrong by a reader with specialised knowledge. The idea that the Spicer land sighting of the Loch Ness Monster was inspired by a scene in King Kong (mentioned favourably by France on p. 32) has experienced something of a pushback recently and s"
