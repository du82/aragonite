) main lineages. This is a montage produced for in-prep textbook The Vertebrate Fossil Record. Image: Darren Naish. As goes the larger view, recurvirostrids are charadriiforms (that is, part of the same group as plovers, gulls and auks), and specifically part of Charadrii, the charadriiform group that contains sheathbills, stone-curlews or thick-knees, ibisbills, oystercatchers and plovers. While conventionally considered a distinct ‘family’, note that Recurvirostridae is one of several long-billed groups within Charadrii that’s surrounded in phylogenies by taxa traditionally grouped together within the plover family Charadriidae (Chu 1995, Ericson et al. 2003, Baker et al. 2007, Mayr 2011). No one has acted on this yet, even though the most ‘sensible’ solution is to sink Recurvirostridae and the other affected groups (Ibidorhynchidae and Haematopodidae) into Charadriidae. The alternative solution is to raise several lineages to ‘family' level’ such that oystercatchers, recurvirostrids and so on get to retain ‘family status’. Whatever, the interesting thing with respect to charadriiform evolution as a whole is that the very long-billed recurvirostrids, oystercatchers and ibisbills all evolved from short-billed ancestors (or a single ancestor?) that would have been superficially similar in appearance to plovers, stone-curlews or sheathbills. Maybe we’d guess this already, but it receives firm support from the topology of cladograms. I’ve written a fair bit about this issue (about the topology and taxonomy of these groups) in my in-prep textbook, and the cladogram you see here is from that work (you can see more from the book and my other projects here at patreon). Caption: there are several competing cladograms for Charadrii: this one is a simplified version of the topology recovered by Mayr (2011). Like all of these sorts of cladograms, this one was produced for my in-prep textbook… on which go here. Pluvianus is missing simply because I haven’t drawn it yet. Image: