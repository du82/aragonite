le phones, medals, a doll's legs, an entire army... is there anything a gull won't swallow?, December 2009The incredible bill of the oystercatcher, July 2010 Your Awesome Neighbourhood Herring Gull (And Its Many Cousins), September 2015Support this blog AND the newly revived podcast at my patreon, where you also get to see tons of behind-the-scenes material that hasn’t yet been released anywhere else.Refs - -Baker, A. J., Pereira, S. L. & Paton, T. A. 2007. Phylogenetic relationships and divergence times of Charadriiformes genera: multigene evidence for the Cretaceous origin of at least 14 clades of shorebirds. Biology Letters 3, 205-209.Christia, P. D., Christidis, L. & Schodde, R. 1992. Biochemical systematics of the Charadriiformes (shorebirds): relationships between the Charadrii, Scolopaci and Lari. Australian Journal of Zoology 40, 291-302.Chu, P. C. 1995. Phylogenetic reanalysis of Strauch’s osteological data set for the Charadriiformes. The Condor 97, 174-196.Dove, C. J. 2000. A descriptive and phylogenetic analysis of plumalaceous feather characters in Charadriiformes. Ornithological Monographs 51, 1-163.Ericson, P. G. P., Envall, I., Irestadt, M. & Norman, J. A. 2003. Inter-familial relationships of the shorebirds (Aves: Charadriiformes) based on nuclear DNA sequence data. BMC Evolutionary Biology 3: 16.Mayr, G. 2011. The phylogeny of charadriiform birds (shorebirds and allies) – reassessing the conflict between morphology and molecules. Zoological Journal of the Linnean Society 161, 916-934.Olson, S. L. & Feduccia, A. 1980. Relationships and evolution of flamingos (Aves: Phoenicopteridae). Smithsonian Contributions to Zoology 316, 1-73.Thomas, G. 1985. Plovers and sandpipers. In Perrins, C. M. & Middleton, A. L. A. (eds) The Encyclopedia of Birds. Equinox, Oxford, pp. 162-175. Posted in birds and tagged with birds, ornithology, waterbirds, charadriiforms, avocets. October 21, 2018 by Darren Naish. October 21, 2018 Darren Naish birds ornithology waterbirds charadriiforms avocets birds"
