title = "The Tet Zoo Guide to Mastigures — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "The Tet Zoo Guide to Mastigures Among my favourite lizards are the Uromastyx agamids, variously termed mastigures, dabbs, dabs, dhubs, spinytails, spiny-tailed agamas, spiny-tailed lizards or thorny-tailed lizards. In the pet trade they’re often called ‘uros’. Here, I’ll be calling them mastigures. Caption: a large mastigure is a fine, handsome, happy-looking lizard. The dark overall colour and yellow dorsal occellations show that this captive specimen is a Moroccan mastigure Uromastyx acanthinurus. Image: Darren Naish. Mid-sized for lizards (25 cm in total length is typical, though read on), they’re rather chunky, short-headed and wide-bodied with a proportionally short, broad tail that’s covered in 10 to 30 transverse, parallel rows of posterodistally projecting spines. The rows have a ring-like form and (rather confusingly) are typically called whorls. The tail is said to function as a ‘burrow blocker’ and also to be lashed from side to side when deterring would-be attackers. Enlarged, thorn-like scales are also present on the hindlimbs of some species. The head is short and deep by lizard standards and a neat feature is that the labial scales are large, serrated structures that sometimes look like external pseudoteeth. Caption: head detail of a captive U. acanthinurus. Note the pseudoteeth-like upper labial scales. The white exudate around the nostrils is pretty typical: it's salt discharge and evidence of nasal salt excretion typical for desert-dwelling lizards. Image: Darren Naish. Mastigures are extremely variable in colour, ranging from almost black to almost white dorsally; areas of yellow and even bright orange are present in some species, sometimes forming eye-like markings, distinct spots large or small, or transverse bands. The head may be much darker than the rest of the animal, and sometimes the tail is different in colouration too. Adding to this complexity is that individuals change colour according to temperature and time of day. The tail is variable in size: it's similar in length to the body in most species but is very short and broad in a few species, most notably the Omani spiny-tailed lizard or Thomas's mastigure U. thomasi. Caption: a captive U. thomasi. The complex colouration - the facial banding in particular - is notable, as is the very short, broad, plump tail. This is a small mastigure with a total length of less than 15 cm. Recent surveys indicate that it is now extinct on mainland Oman - its type location - and is now unique to Masirah Island where local extinction has also occurred due to habitat destruction. There are anecdotal 2012 references to its persistence on the mainland, however. Image: Darren Naish. The teeth are especially interesting: they’re short, low-crowned and fused to the jaw bones on their lingual (tongue) side, are largest at the back of the jaws, have crescentic shearing tips, and possess oblique wear facets that become so pronounced with age that entire teeth can be worn right down to the jaw (Cooper & Poole 1973). As you might guess, these animals do not possess regular tooth replacement of the sort we associate with reptiles (Robinson 1976). This is linked with a style of jaw movement (termed propaliny) where the lower jaw slides forwards to create a shearing bite when the jaws are closed (Throckmorton 1976). In the premaxillae, the upper central incisiforms are replaced by projecting structures that have been interpreted as bony pseudoteeth (Anderson 1999), though I don’t know if the histological work required to demonstrate this has been performed and they might be fused teeth. Caption: the skull of U. aegyptia, as scanned for The Deep Scaly Project and available here. Note that the partially fused teeth are largest posteriorly. The mandible is deep, the front of the dentary is toothless and bony pseudoteeth are present in the premaxilla. Image: Digimorph. Mastigures occur throughout the steppes, deserts and semi-deserts of northern Africa, the Middle East and western and central Asia. They aren’t associated with dune-fields, instead inhabiting rocky or gravel-covered regions or areas with compacted sand. They use and build burrows that are sometimes 3 m long or so, though I would expect based on data from other burrow-digging reptiles that burrows at least twice as long might exist. ‘Colonial burrows’ have been mentioned in the literature (Anderson 1999), though I don’t know if this means that many burrows were located in close proximity or if the burrows were known to contain some or many lizards. Caption: an Iraqi, Mesopotamian or Small-scaled spiny-tailed lizard Saara loricata (formerly U. loricatus), a mid-sized species of Iran and Iraq, as illustrated in one of Boulenger's 1885 catalogues of amphibians and reptiles kept in the collections of the British Museum. Image: Boulenger 1885. Around 15 extant species are recognised within Uromastyx, five of which have been named since 1990: U. maliensis Joger & Lambert, 1996, U. occidentalis Mateo et al., 1999 (or 1998), U. leptieni Wilms & Böhme, 2001 (or 2000…), U. alfredschmidti Wilms & Böhme, 2001 (or 2000…) and U. yemenensis Wilms & Schmitz, 2007. The total number of recognised species is a bit vague since some taxa are regarded as subspecies by some authors and as distinct species by others. An additional three Asian species have recently been removed from Uromastyx and placed in the resurrected genus Saara, first named by Gray in 1845 (Wilms et al. 2009). Saara species possess so-called intercalary scales between the spine whorls on the tail and molecular data finds them to be the sister-group to Uromastyx (Tamar et al. 2018). Caption: Persian or Iranian spiny-tailed lizard Saara asmussi, as illustrated in William Blanford's paper of 1876. This species occurs in Iran, southern Afghanistan and Pakistan. The Saara species were included within Uromastyx prior to Wilms et al. (2009). Image: Blanford 1876. In recent years, Uromastyx mastigures have become increasingly common in the pet trade and it’s now normal to see them on show in places that sell pet reptiles. I have seen them in the wild while on fieldwork in the Sahara, but the individuals concerned were dead and I never have seen a live one in the wild. Caption: a sadly deceased baby mastigure (probably U. acanthinurus), discovered in the Moroccan Sahara. Cause of death unknown. Note that the tail is fully developed and sports the full complement of tail spines, despite the animal's small size. Image: Darren Naish. Biology and behaviour. Mastigures are omnivorous, but they’re (seemingly) essentially herbivorous as adults, only occasionally eating arthropods or smaller lizards. The presence of symbiotic gut flora has been demonstrated for some species (a feature seen elsewhere in agamids in the Hydrosaurus sailfin dragons). Their lifestyle requires their taking refuge in rock crevices or burrows when they’re not feeding, foraging, basking or interacting socially, a behavioural syndrome where a compressed body shape and defensive spiny tail are advantageous, and one that has evolved convergently in other iguanians – the American chuckwallas and ctenosaurs and Madagascan oplurines – and in the Australian Egernia skinks and in some African corylids (Pianka & Vitt 2003). Caption: the tail of a deceased mastigure (probably U. acanthinurus), discovered in the Moroccan Sahara. Image: Darren Naish. Herbivory in lizards works best at large size for the obvious reason of how much nutrition can be recovered (though it’s worth saying that there are many exceptions to this tendency: see Espinoza et al. 2004); it follows, then, that mastigures are relatively large compared to other agamids. I don’t know if there are any studies that do demonstrate this specifically, but the fact that most species are 25-45 cm long as adults does seem large, and the biggest species – the Egyptian or Leptien’s mastigure U. aegyptia – is positively enormous, reaching 75 cm on occasion and even more (specimens nearly 1 m long have been reported… can you imagine a mastigure this size? Amazing). It’s worth saying here that an especially large Paleogene lizard – Barbaturex from the middle Eocene of Myanmar, it perhaps reached 2 m in total – appears to be an especially close relative of Uromastyx (Head et al. 2013). Caption: I was curious to know what a c 90 cm mastigure would look like compared to a person. The smaller of these silhouettes reveals the answer. Not as impressive as I was hoping. The larger lizard silhouette depicts the approximate size of the Eocene taxon Barbaturex, though we don't know that it had spiny whorls on its tail as shown in the illustration. The human figure is 1.7 m tall. Image: Darren Naish. Mastigures are oviparous, females laying clutches of 6-20 elliptical eggs within a burrow. The hatchlings stay within the burrow for a few weeks, possibly even for months. The mother remains in attendance across this time and her burrow-guarding behaviour might be a form of parental care (directed both at the eggs and the hatchlings). Given that these lizards possess a symbiotic gut flora, the babies are presumably coprophagous. I’ve seen this stated informally but am not aware of a study that demonstrates it. Remember that tetrapods that possess a symbiotic gut flora must obtain it from their parents, and thus must eat their parent's dung early in life. Mm-mm. Caption: an Egyptian spiny-tailed lizard U. aegyptia, as depicted in John Anderson's 1898 volume on the amphibians and reptiles of Egypt. Image: Anderson 1898. Antiquity, taxonomy, biogeography. Having mentioned fossils, jaw fragments that appear to be from Uromastyx-like agamids (though not necessarily Uromastyx itself) are known from the Lower Eocene of Kyrgyzstan (Averianov & Danilov 1996) and hence establish an age of around 50 million years for this lineage. A number of Paleocene and Eocene lizards from Mongolia and China appear to be additional uromastycines. Rather younger, Oligocene fossils from the famous Jebel Qatrani Formation of the Fayum in Egypt’s Western Desert are sufficiently mastigure-like that they’ve been identified as ‘cf. Uromastyx’ (‘cf’ is an abbreviation of the Latin ‘confer’ and, when used in a taxonomic identification, basically means ‘we think that these fossils are so comparable to [insert taxon of interest] that they might belong to it, though we can’t be sure’). They date to the Lower Oligocene and hence are around 33 million years old (Holmes et al. 2010). There’s also a Lower Oligocene Uromastyx mastigure from France – yes, a European member of the group. Caption: just one of the many uromastycine fossil jaw fragments from the Lower Eocene of Kyrgyzstan descibed by Averianov & Danilov (1996). These fossils - and others - demonstrate the antiquity of this group within Eurasia and show that it didn't arrive in the region after its Miocene collision with Africa. The scales bars = 1 mm. Image: Averianov & Danilov (1996). This antiquity is in keeping with the idea – made on the basis of their highly distinctive anatomy – that mastigures are ‘distinct enough’ from other agamids to be worthy of their own ‘subfamily’: Uromastycinae. This view derives support from those studies that have found or inferred mastigures to be a distinct lineage outside the clade containing all remaining crown-agamids (e.g., Frost & Etheridge 1989, Macey et al. 2000, Schulte et al. 2003, Pyron et al. 2013), and perhaps even outside the clade that includes chameleons and conventional agamids (Honda et al. 2000, Gauthier et al. 2012). That last result would push mastigure origins into the Cretaceous given amber fossils that seem to be stem-chameleons. Caption: a phylogeny for agamids and their close kin, as recovered by Honda et al. (2000). Mastigures and butterfly agamas form a clade, and both are outside the clade that includes chameleons and 'Agamidae' of tradition. Like all of these sorts of diagrams, this was produced for my in-prep Vertebrate Fossil Record book, progress on which can be seen here. Image: Darren Naish. Oh, you want Cretaceous stem-mastigures? In 2016, Apesteguía et al. (2016) described Jeddaherdan aleadonta from the Cenomanian of Morocco, and concluded that both this taxon and Gueragama sulamericana from the Upper Cretaceous of Brazil – both represented by partial lower jaws – are exactly that. Fossil evidence does, therefore, now back up the idea that these lizards were in existence before the end of the Cretaceous, and that acrodonts* (and thus iguanians more generally) had evolved at least some of their variation before the Cenozoic.* Acrodonts (properly Acrodonta): the iguanian lizard clade that includes chameleons and agamids. They are named for their acrodont teeth: that is, those fused to the jawbones (though this condition is not fully developed across all members of the clade, and note that there are acrodont reptiles that are not part of Acrodonta). Caption: the Cretaceous uromastycine Jeddaherdan aleadonta is known from the chunk of lower jaw shown here, depicted within a silhouetted skull of Uromastyx. The scale bar is in mm. Image: Apesteguía et al. (2016). At least some studies find mastigures to form a clade with the east Asian butterfly agamas Leiolepis (e.g., Honda et al. 2000, Hugall & Lee 2004, Gauthier et al. 2012), both then being united within Leiolepidinae*. Butterfly agamas are fascinating for all sorts of reasons and I really should write about them at some point as well.* There’s a long and complex argument over whether Leiolepidinae/Leiolepididae or Uromastycinae/Uromastycidae should win in a priority battle. Modern authors have tended to prefer the former, since it’s 1843 as opposed to 1863 for Theobald’s Uromastycidae. Anderson (1999) argued that the 1843 use of Fitzinger’s name cannot win this battle, since it was originally ‘Leiolepides’ and was not written in its ‘modern’ form by authors pre-1900. Caption: mastigures and butterfly agamas have not been found to form a clade in all phylogenetic studies: in Pyron et al.'s (2013) study - this cladogram depicts the topology they recovered - the two are successively closer to remaining Agamidae. Note the taxonomic names they used for the agamid lineages. Like all of these sorts of diagrams, this was produced for my in-prep Vertebrate Fossil Record book, progress on which can be seen here. Image: Darren Naish. Anyway: here I’ll say what I usually do and remind you that if these animals were mammals or birds they’d almost definitely be considered ‘distinct enough’ to warrant their own ‘family’, a decision that would require Agamidae of tradition to be split into several ‘families’ (I put these taxonomic ranks in quotes because they’re still effectively subjective). In addition to a mastigure family and butterfly agama family, there would be one for Hydrosaurus, one for the Australasian dragons (or amphibolurines), another for the Asian draconines, and so on. A few authors – most notably Scott Moody in his studies of t"
