title = "Tetrapod Zoology's 14th Year of Operation, 2019 in Review — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "Tetrapod Zoology's 14th Year of Operation, 2019 in Review Once again, it’s January 21st – hello, January 21st – which means that it’s Tetrapod Zoology’s birthday, or blogoversary or whathaveyou. Caption: a montage of TetZoo-themed things relevant to 2019, read on… TetZoo started life in 2006 and we saw last year how it became a teenager on its 2019 birthday. Today, TetZoo has hit the big 1-4. 14 years old. In keeping with tradition, let’s now look at the year’s TetZooniverous adventures, the caveat as always being that you should stop reading now if this sounds like it’s going to be too introspective. Because it will be. One final warning: this article is realllly long, I could have split into four or five different parts (but I didn’t want to). Caption: we’ll start here. It depicts Joschua Knüppe, was taken at TetZooCon 2019, and was modified by Armin Reindl. I’ve lost track of who took the original, sorry. From my own idiosyncratic perspective, TetZoo is – approximately speaking – as active as ever. I still manage to publish a few articles a month and report and discuss things relevant to my interests and thoughts, the site’s visibility and content continues to win me paying employment, its articles remain a (hopefully) valuable source of information on various arcane zoological topics, and – even in the age of Twitter and Instagram (I’m findable on both as @TetZoo) – it has a healthy community of regulars who help keep the site alive with discussion and comments. Caption: TetZoo Towers, the scene of our story’s Act 1. Yikes, it was a mess at the time this photo was taken… Image: Darren Naish. January 2019 started with me returning from a consultancy job in China – I work on occasion for Don Lessem’s DinoDon company – which I feel I’ve written about already. I visited Dinosaur Isle at Sandown (one of several trips made there during the year) for on-going work on Wealden theropod dinosaurs with Neil Gostling, Chris Barker and colleagues. Caption: life-sized dinosaur models at Dinosaur Isle, Sandown. At left, one of Andrew Cocks’s Eotyrannus models (with cannon-fodder ornithischian in mouth). At right, the famous Dorling Kindersley Caudipteryx, with Luis Rey colour scheme. It was in a weird, crooked pose until Luis recently corrected it. Images: Darren Naish. I also visited the Pulhamite Garden at Holly Hill. Pulhamite gardens – named for their designers, the Pulham brothers – are landscaped Victorian features, designed to include replica waterfalls, grottos, caves and so on. John Conway and I recorded a few episodes of the podcast and released episode 70… which we’d actually recorded back in September 2018. Yeah, we’ve had to abandon any plans to record episodes of the podcast at all regularly, not through choice but because workload no longer allows. And when we do get to record an episode, there’s no longer time or opportunity to edit it. Plus John is very, very lazy. Caption: a cave - not a natural one, but one made by people - in the Pulhamite garden at Holly Hill, Hampshire, UK. I love this stuff. Reminiscent of the Prehistoric Court at Crystal Palace, of course. Image: Darren Naish. The TetZoo review of 2018 (I mean, the 13th birthday article) was published at the end of January, a bit later than planned. Episode 71 of the podcast was released in early February and episode 72 – a Loch Ness Monster special – later in the month. A TetZoo article reviewing some recently-ish published books was published, and my recollections of the Dinosaurs Past and Present exhibition of the late 1980s and early 90s was published too. A technical paper I contributed to – on a Late Cretaceous eggshell assemblage from Romania, incorporating the eggs of several reptile species – was published in Scientific Reports in February (Fernández et al. 2019), and I wrote about it here at TetZoo. Will and I went to the Isle of Wight Zoo at the end of February. I mean to write about it. Internet potoos were also covered at TetZoo in February. Caption: OH MY GOD IT’S MELLER’S DUCK. Yes, they have them at the Isle of Wight Zoo. Image: Darren Naish. Also during February, I spent time at the BBC’s Natural History Unit – something that would take up an increasing part of my time for the rest of the year (no, I can’t talk about it) – and made tiny, incremental progress on the Eotyrannus monograph (it’s finished, and has been for months, ‘all’ I’m doing is making the post-review changes). My article on OroBOT appeared in BBC Focus magazine (Naish 2019a; an online version is here). Caption: OroBOT! A mobile, articulated robot replica of Orobates. From the BBC Focus magazine article here. Caption: the arrival of frogs and frogspawn in the early part of the year is always a significant annual event, and generally occurs round about the second week of February. Two clumps of spawn were produced in 2019; many of the tadpoles made it to froglet stage and some over-wintered and are still in the pond right now (January 2020). The species here is the European common frog Rana temporaria. Images: Darren Naish. Books. The events of 2019 meant that I wasn’t able to write any new books during the year, nor finish any of the ones I’ve started. A few things happened though. The Dorling Kindersley book that I co-wrote with Chris Barker – part of their ‘What’s Where on Earth’, fully titled What’s Where on Earth: Dinosaurs and Other Prehistoric Life (Barker & Naish 2019) – appeared in print in March. It’s been very warmly received in reviews. I did an interview on the book (and dinosaurs in general) for First News newspaper. Caption: new books for 2019. A new edition of Dorling Kindersley’s Dinosaurs & Prehistoric Life appeared during the year: I helped with the update but have yet to see a copy. What’s Where on Earth: Dinosaurs and Other Prehistoric Life (Barker & Naish 2019) also appeared. The Japanese edition of Dinosaurs: How They Lived and Evolved (Naish & Barrett 2018) arrived. This version of the book makes me appreciate Japanese respect for detail and intricacy: the cover features several of the cladograms I produced for the book, the boards of the cover are decorated with a beautiful image of a moa skeleton, and there are additional details like an Erlikosaurus on the book’s spine. I drew squamates for the Big Book, a huge project that’s still ticking away in the background (cough cough). Caption: cover views of the new Japanese edition of Dinosaurs: How They Lived and Evolved (Naish & Barrett 2018). Moving to March, I worked on a TV series for Wall to Wall, commissioned by Netflix. I may or may not talk about it when it’s out. An article on alternative timeline dinosaur evolution – featuring interview comments and thoughts from me – appeared in the Italian Focus magazine (Camardo 2019). Caption: opening spread of Giovanni Camardo’s 2019 article on alternative timeline dinosaur evolution. I’ve said it before but it’s worth repeating: James Kuether’s dinosaurs are everywhere these days. The dinosaur models I worked on in China at the start of the year were delivered to their new home in New York’s Bronx Zoo and put on show. Articles published at TetZoo during this part of the year include those on the cautious climber hypothesis, and the first and second of my Nessie-themed book reviews. I attended a beach clean event in late March, and as usual picked up many kilos of discarded plastic crap otherwise contaminating the environment. I’ve been doing litter-picks at beaches for years now. Things haven’t improved but have steadily gotten worse. The end of much of the natural world is in sight. Caption: imagine trying to clean a beach like this of its plastic pollution. It isn’t going to happen: no-one is ever going to remove all of this waste. Chessel Bay, Southampton, March 2019. Image: Darren Naish. I went to another local zoo (Marwell) in mid-April, highlights of this trip being lemurs in a pile, a rhino gang, good views of Mountain zebra Equus zebra, Crocodile monitor Varanus salvadorii and Blesbok Damaliscus pygargus phillipsi. Caption: Marwell Zoo has so many great animals. At left, Crocodile monitor Varanus salvadorii in the new tropical house. At right, Mountain zebra Equus zebra (note the dewlap). Images: Darren Naish. TetZoo articles from this time included those on sleep behaviour in non-human animals, phyllostomid bats, cocks-of-the-rock, and my fondness for Usborne’s 1977 All About Monsters. My latest technical contribution to the cryptozoological literature appeared (Paxton & Naish 2019), this being an article in which Charles Paxton and I aimed to determine whether popular knowledge of Mesozoic marine reptiles might have influenced 19th and 20th century sea monster sightings. We concluded that they likely had, to a degree. This research was covered here at TetZoo; Mike McRae also wrote about it here at ScienceAlert. I spent time at one of my local patches, Telegraph Woods. Caption: while at Portsmouth Comic Con in May, I got to see several of Roger Dicken’s movie models; here’s a sauropod, I think from The Land That Time Forgot. Images: Darren Naish. May was busy. I visited the Royal Veterinary College for a secret project I can’t talk about and, outside of work, attended Portsmouth Comic Con and Exbury Gardens, went to the several famous geological sites of Durdle Dor and its surrounds on the Dorset coast (my parents spend part of the year there), and visited the new Dogstival fair – a massive, dog-themed event devoted to everything about dogs – in the New Forest. Caption: some summertime shots of the New Forest, UK. It really is the most spectacular location and I love spending time there. Images: Darren Naish. On the subject of dogs, late May was difficult… I and my family said goodbye to Willow on May 20th, an event which inspired me to write about Willow and her life. I made the mistake of thinking that I’d be able to launch back into work and carry on as if nothing had happened; I should have taken the rest of the month, at least, off work. Other articles appearing at TetZoo during May include those on the creatures of Star Wars, palaeoartistic depictions of Styracosaurus, birdwatching in China, and cases where animals have died after they’ve been hit by falling rocks or trees. Caption: I visited Bob Nicholls of paleocreations.com during summer 2019. Wow, he has some cool stuff. One of the psittacosaurs is for sale… Images: Darren Naish. Hunting Monsters and the tabloid press. In early June I attended, and spoke at, the Cheltenham Science Festival. My talk was the Hunting Monsters one, initially prepared to promote the book of the same name (Naish 2017) back when it was new. The talk is on the history of cryptozoological theorising, on the reliability or otherwise of people as reporters of information, and on how the supposed targets of cryptozoology – ‘cryptids’ – might be explained. I signed and sold a bunch of books and had a great time, but an interesting thing happened after my talk. Caption: books and book signing at the 2019 Cheltenham Science Festival. Jules Howard books make a guest appearance. Images: Darren Naish. Two journalists – one from The Sun, one from The Daily Mail – were in the audience, and both asked if I thought that the lack of compelling photographic data (especially in an age where huge numbers of people now carry cameras with them most of the time) was essentially the death-knell for the existence of monsters. While things are not necessarily as simple as all that (not all animals can be photographed given the brief duration of many encounters, camera-phone photos are not necessarily good enough to be convincing to those with critical faculties, and so on), I do think that the rarity if not absence of photographic data for most cryptids counts for something, and I hence agreed with this contention. Both journalists were interested, quizzed me further on this point during the book-signing event, and said that this point would be used as the ‘hook’ in the pieces they were going to write. Remember: this idea was raised, de novo, by them and wasn’t mentioned or alluded to in my talk. Caption: quality, genius journalism from the rag known as The Sun, oh what fun. How, then, did the journalists concerned deal with this information? Well, you can see for yourselves from the screengrabs used here: the whole thing was spun in the weirdest direction, the take being that I’d only just concluded that cryptids aren’t real, and that I’d hence admitted to wasting about 20 years of research (as if monster-hunting is all I’ve done across the better part of my adult life). Needless to say, this is a nonsense interpretation of everything I’ve done and published. I wrote a response (initially as a series of threaded tweets); you can read it here. Things kicked off from here, by which I mean that there was substantial further media interest. I turned down most requests for interviews (I’m at that point in my career and experience where I no longer see any benefit in making unpaid appearances on radio or TV. The claim that media exposure helps you, or is useful, is bullshit in my line of work) but did – under duress – do a brief thing for Channel 5 news (you can watch it here, if you want). So I learnt a lot from this, the main thing being that I’d underappreciated how vile and disgustingly biased and manipulative British tabloid journalism mostly is. Newspapers like The Sun approach issues with a rancid anti-intellectual agenda, with a clear intention to inspire and promote disdain, hate and ill will and – while an article written to make me look like an idiot has no national or international relevance or importance and won’t be remembered by anyone excepting myself – the impact that these redtop rags have on important issues (like Europe’s refugee crisis and the infinitely bad Brexit shitstorm) can’t be understated. Everyone knows this already, of course; I merely wanted to state it in my own words. Caption: at the 2019 Dinosaurs and Art event - hosted at Oxford University Museum of Natural History - David Button uses the mounted Iguanodon bernissartensis replica to make a point about iguanodontian anatomy and posture. Image: Darren Naish. Whale Watching, Fortean Times, Monsters of the Deep, Anglesey. Also in June, I watched Godzilla: King of the Monsters and was sufficiently inspired to write about it. I attended Will Tattersdill’s Dinosaurs and Art event at the University of Oxford and enjoyed talks by David Button and Verity Burke. I visited Bob Nicholl’s studio in South Gloucestershire (see montage above) and got to see a great deal of amazing in-prep, embargoed work, what an honour. My reminiscences of Lyall Watson’s Whales of the World, some thoughts on books about woodpeckers and my thoughts on Mark Witton’s The Palaeoartist’s Handbook were published at TetZoo. Caption: you need a really good camera to take good photos of distant whales, and I don’t have one. So what I’d sometimes do, as a temporary record of recording wha"
