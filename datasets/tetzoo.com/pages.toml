description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "Final Call For TetZooCon 2019 It’s time to remind you once more that TetZooCon 2019 – the sixth Tetrapod Zoology Convention – is happening on the 19th and 20th October, and this is essentially your last chance to book a place*, should you wish to come along…. Caption: scenes from TetZooCon 2018, our biggest and best meeting so far. The 2019 meeting is shaping up to be bigger and better. To those not attending, watch #TetZooCon for live coverage. Image: JCTArtStudio/Jed Taylor. TetZooCon 2019 is, as per the last two years, happening at The Venue, Malet Street, Bloomsbury, London, a difference for this year being that we’re on a different floor from previous meetings and have more rooms in addition to the main hall. * We don’t send out paper tickets; your name is added to a list. If you’re seriously interested in prehistoric animals and their evolution, biology and behaviour, in palaeoart and in artistic depictions of animals in general, in the anatomy, ecology, behaviour and biology of such animals as swans, eagles, whales and amphibians, in human-wildlife interactions, in conservation biology, and in natural history film-making, you really should come along. Our talks and on-stage events this year are on a diverse range of tetrapod-themed subjects, but there’s a block on natural history film-making – featuring a range of very talented people from the BBC’s famous Natural History Unit – and another on the palaeobiology of extinct dinosaurs. Caption: I went over to Instagram and…. here’s proof that things are really coming along with respect to merchandise for TetZooCon 2019. These are Rebecca Groom’s palaeoplushies. In previous years, they’ve all sold out within the first few hours of the meeting! Images: Rebecca Groom/palaeoplushies. Caption: Jed Taylor is going to knock it out of the park this year, his stuff looks incredible. Here’s a shot of some of his merchandise. Image: JCTArtStudio/Jed Taylor. As per usual, there’s a special palaeoart event led by John Conway (and running in parallel to part of the main event, sorry about that). This includes several talks by palaeoartists, the main theme of this year’s talks being the 3D construction of models. And – breaking news – it now looks like we’re hosting a big, dedicated palaeoart exhibition as well, featuring art by some of the UK’s leading palaeoartists. It should be hosted in its own special room. Caption: this year is the 20th anniversary of the screening of Walking With Dinosaurs, so it’s especially fitting that Tim Haines - at far right in this image, with your humble blog-author - will be speaking at TetZooCon. Merchandise, stalls, book signings and palaeoart wares are also a standard part of TetZooCon. Book signings this year include those devoted to Dave Hone’s The Tyrannosaur Chronicles, Jack Ashby’s Animal Kingdom: A Natural History in 100 Objects, Joschua Knüppe’s Palaeostream book, Luis Rey’s Extreme Dinosaurs Part 2: the Projects and Ross Barnett’s The Missing Lynx. Dougal Dixon’s After Man will also be on sale, and I’m pleased to say that Dougal himself will be in attendance on the Saturday. Caption: Luis Rey’s brand-new book will be on sale at TetZooCon 2019. Image: (c) Luis Rey/Darren Naish. TetZooCon ends with a quiz and a post-conference meal.So that’s that, we look forward to seeing you in London in late October. For the first time, attendees can choose to buy a booking for one day only; there isn’t one flat fee for the whole event. The booking site includes more information, a list of speakers, and a draft timetable. If you’re on Twitter and/or Instagram, follow events at #TetZooCon. See you there!For previous articles on TetZooCon meetings, see…The events of TetZooCon 2014, July 2014TetZooCon 2015 Is On, July 2015The Events of TetZooCon 2015, November 2015Coming Soon: TetZooCon 2016, September 2016The Day After TetZooCon, October 2016The Fourth TetZooCon, September 2017The TetZooCon of 2017, October 2017Reasons to Attend TetZooCon 2018, September 2018TetZooCon 2018: Best TetZooCon So Far, October 2018Announcing TetZooCon 2019 – the Biggest Yet, August 2019 Posted in TetZooCon and tagged with community, conventions, conferences, TetZooCon. October 5, 2019 by Darren Naish. October 5, 2019 Darren Naish community conventions conferences TetZooCon TetZooCon"
