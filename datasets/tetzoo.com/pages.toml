title = "Tetrapod Zoology Is A Teenager Now — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "Tetrapod Zoology Is A Teenager Now Yet again a year has passed and yet again it’s time to review events relevant to the TetZooniverse, so here we are at TetZoo’s 13th birthday (January 21st 2006 being the date on which the blog first came into being). As per usual, I’m going to discuss, comment on or mention all those TetZooniverse things that I deem worthy of discussion, comment or mention. And, as usual, I implore you not to read this if the thought of me writing about my own achievements and adventures sounds arrogant or worth a miss. Still here? Ok, we proceed… Caption: once again I’m going to begin by reminding you of how it all began, back in 2006… you can see that very first article (should you want to) here. Images: Darren Naish. Our story begins in late January 2018. Birds (owls and rollers, among others) were still keeping me busy as goes The Big Book, and academic work on ichthyosaurs, pterosaurs and sea monsters (of the cryptozoological sort) was underway. It’s a reminder (as if another were needed) of how slowly it takes for academic projects to come together to note that none of those projects have yet seen print, more than a year later. Fossil bats – covered only because I suddenly suffered bat guilt – got a little coverage at TetZoo during February. I visited Hill Head, West Wittering and Swanwick to see grebes, divers, waders and gulls. The conditions were mostly cold and windy but clear and sunny, which is great for looking at water- and seabirds. Caption: there are so many great places to see water- and seabirds around the coasts of the UK. One of my favourite haunts at the moment is Swanwick in Hampshire. Teals at left; Brent geese at right. Image: Darren Naish. Dinosaurs in the Wild (DITW) opened for its final, London-based run at the start of February. If you’re a regular reader you’ll already be familiar with this interactive, science-based visitor attraction so I won’t be saying much more about it today. If you don’t know what I’m talking about and are curious, see Dinosaurs in the Wild: An Inside View at TetZoo ver 3 and The Last Day of Dinosaurs in the Wild here at ver 4. I did various promotional events for DITW from February to June and met science journalist and author John Pickrell at the exhibition during February. Also in February, I wasted time submitting a grant application which was ultimately unsuccessful – more on that later. Caption: scenes from Dinosaurs in the Wild. At left, your humble author with John Pickrell (and friend: John is the one not holding the plush tyrannosaur). At right: myself, Siouxsie the Dakotaraptor, and Chris Packham. Images: Darren Naish, Megan McCubbin. A TV thing filmed at Colchester Zoo during October 2017 appeared on BBC4, titled ‘The Incredible Science of Temperature’ and presented by Helen Czerski. I was filmed discussing, with Helen, what influence global temperatures have had on the distribution of ectothermic reptiles (qualifier because not all non-bird reptiles are ectothermic), and on the physiology and behaviour of Komodo dragons. It felt, at the time, like a total disaster but I’m pleased to say that the parts of my performance included in the show weren’t too bad (the relevant episode is online here). Fighting blue tits, Leguatia, and an article about Mark Witton’s palaeoart appeared at TetZoo during this part of the year. Remember that TetZoo was still hosted at SciAm at this point.In March I assisted with a local beach clean event. I don’t talk about these to brag about my public service (heavens, no), but to help maintain awareness of plastic pollution and the problems facing marine environments today, and also to remind those of you reading this that you can help by getting involved with local environmental groups. Caption: beach cleaning is always such a joy (am being ironic). Here’s a haul after just a few hour’s work. Image: Darren Naish. March was also the month in which Paul Barrett and I compiled our suggested list of corrections and updates for the second edition of Dinosaurs: How They Lived and Evolved. Again, I don’t need to say much about this here since the story behind the second edition was recently covered here in, err, The Second Edition of Dinosaurs: How They Lived and Evolved. Thanks again to those who provided help in compiling corrections, to those who’ve said positive things about the book and to those who’ve purchased it and helped spread the word about it. Caption: Milo the Neotropical giant toad - at right - now lives at Tet Zoo Towers, but his original home was the BBC Natural History Unit, at BBC Bristol. Like Milo, I spent time at BBC Bristol during 2018. Why? Well… we shall see. Images: Darren Naish. I engaged in an online interview with the brilliant Aron Ra who I’ve long been familiar with but had not previously spoken to. We discussed TetZooCon, the Tetrapod Zoology project, my books, serial mis-educator David Peters, and more. The interview – part of Aron’s RaMen series – is online here. I also used our virtual meeting as an excuse to invite Aron as a speaker to TetZooCon 2018 since, by virtue of good timing, he was going to be in the UK at exactly the right time. More on TetZooCon later. Oh: I joined instagram in March, wholly because I read an article by a scientist bemoaning scientists who join instagram. My review of Jonathan Kane et al.’s most worthy book God’s Word or Human Reason? appeared at TetZoo in late March, as did a short review of everything columbiform. By now, the substantial passerine section was being done for The Big Book which surely meant that completion of the enormous bird section was in sight, right? Caption: work on The Big Book (my in-prep textbook The Vertebrate Fossil Record) mostly involved birds across 2018. In cases, as here, I had to revamp some old illustrations. This image shows old (at right) and new images of Aepyornis… and surely I won’t need to revamp Aepyornis AGAIN, right? Some of you will know what I’m getting at. Image: Darren Naish. Sunday Brunch, publishers, duckbills, sexual selection. And so to April. As – once again – part of the whole promotional Dinosaurs in the Wild thing, I appeared on the TV show Sunday Brunch… which I’ve never watched but is, by all accounts, pretty popular. It went well and I got to talk about our current knowledge of Mesozoic dinosaurs a fair bit as well as promote Dinosaurs in the Wild, but what might have been the most memorable section of the interview was at the end where presenter Tim Lovejoy asked what the future might hold in store as goes the evolution of life on Earth. Ever the optimist, I told them about the impending mass extinction and the death of biological diversity at the hands of humanity, and that was that. Caption: a view from the set of Sunday Brunch, April 2018. Ash, Chrissie and a hatchling Dakotaraptor at left. Image: Darren Naish. Caption: Chrissie, Darren and the Dakotaraptor hatchling, live on Sunday Brunch on April 8th 2018. Image: (c) Sunday Brunch/Channel 4. In an effort to get the planned Dinosaurs in the Wild book off the ground, I physically dragged myself from publisher to publisher. So many meetings, and all in vain. While at William Collins, however, I did get to see the complete set of the New Naturalist series and, via publisher Myles Archibald, got to hear the backstory to that Too Big to Walk book… the one by ol’ BJ Ford in which he asserts his uncanny ability to finally get dinosaurs right (they were all aquatic, you see). More on that shortly. I also had a meeting about another planned cryptozoology-based TV series. I can basically guarantee having two or three such meetings about the same sort of project every year. They never go anywhere. Yet. Caption: the Collins New Naturalist books on display at the Collins office in London. Most of us own at least a few of these volumes. Image: Darren Naish. My article on why duckbilled dinosaurs really shouldn’t be called duckbilled dinosaurs appeared in April. It includes a significant gaff and a follow-up article is due to be published here within the next several weeks. The second part of of my review of the Indiana University Press 2014 hadrosaurs volume was also published in April: the first part of my review is one of those articles that SciAm removed due to perceived problems with image use so isn’t currently online. I’ll republish it here at ver 4, eventually. Caption: attendees of the Sexual Selection meeting at Chicheley Hall, Buckinghamshire. Image: Rob Knell. I attended the Royal Society Sexual Selection meeting at Chicheley Hall in Buckinghamshire in early May and chaired one of the sessions. A TetZoo article about the meeting can be found here at ver 3. Caption: I went to Tintagel, north Cornwall, in May 2018. Here’s a scene of the coastline there, with seabirds. Image: Darren Naish. ﻿Naish v Ford. The biggest event of May was the debate with Brian Ford at Conway Hall, hinted at above. It seems that this was actually the official launch for Mr Ford’s book – it’s hard to tell as I didn’t see anybody buy a copy – but it was more like a structured debate, the two of us presenting opposing viewpoints on the palaeobiology of Mesozoic dinosaurs before responding to questions from the floor. Events were reported on twitter via #FordvNaish, and my talk can be seen here online. Caption: at left, the cover slide for the event. At right: protesters outside Conway Hall, as imagined by Gareth Monger. Well done if you recognise the reference. Images: Darren Naish, (c) Gareth Monger. I’ve written about Brian Ford and his ideas at least twice before: both in print for an invited article in Laboratory News (Naish 2012) and at TetZoo ver 3. Needless to say, I think he’s flat-out wrong and also guilty of conspiracy mongering, self-aggrandisement (he has literally compared himself to Galileo) and crankery (“nobody’s smart but me!”), among other things. Evaluating the talks is difficult due to the fact that I’m just about never happy with the presentations I give; in any case, John Conway and I already dissected the event at some length in an episode of the podcast. Having said that, Brian asserted that everyone was getting dinosaurs wrong, and assert is basically all he did. I would think that the mostly negative responses that have been directed toward Mr Ford’s ideas would have been sufficient to make him realise that he could very well be wrong as goes his take on dinosaurs, but… nope… he’s still at it (at least, judging from comments he’s recently been making at ResearchGate). I don’t want to give him more publicity than I already have, but if I need to respond to him again, I will. Caption: Darren Naish (left) and Brian Ford (right). Image: Luke Muscutt. Podcats, Jurassic Park at 25, lego at Metro. Having mentioned Conway, we released a few episodes of the podcast – the Tet Zoo podcats or Tetrapodcats – throughout the first half of the year, but we’re still nowhere near having anything like a regular schedule. Mostly this is because John is incredibly lazy, and unproductive to boot. An added factor is that I ‘accidentally’ cleaved through a buried telephone cable in the garden with a spade one day, but I’m sure that that’s coincidental. The new cover for Dinosaurs How They Lived and Evolved, produced by the excellent Bob Nicholls, was released in May – sooner than expected. More on that below. Caption: in May 2018, I (with my kids Will and Emma) attended the Portsmouth Comic Con, and here are some scenes. Not really relevant to TetZoo, but what the hell. Images: Darren Naish. Hunting Monsters – the cryptozoology book that I’ve now mentioned here on some number of occasions (Naish 2017) – was mentioned on the TV show Jeopardy in early June, wow. Thanks to whoever it was who brought my attention to this. June 2018 was also the time at which Jurassic Park – a movie you might have seen or heard about – celebrated its 25th birthday. A lot of the fan response to the original Jurassic Park – we see a lot of it in vertebrate palaeontology, in fact it comes around every few years – is, my apologies for seeming rude here, mostly vacuous and doesn’t come from a position all that well informed as goes the backstory and making-of the movie. Make of that what you will; whatever, my three Jurassic Park articles are here, here and here, and my liberal use of Jurassic Park toys reflects my best efforts to circumvent the rules regarding image use at SciAm. For all that, they still objected so much to my use of a photo of an issue of National Geographic that they removed it. So I created my own version of the cover. Caption: Hunting Monsters appears on Jeopardy. Image: (c) Jeopardy, NBC/American Broadcasting Company. Another bit of Dinosaurs in the Wild promotion happened in late June when – together with palaeontologist Alessandro Chiarenza and actor Ross Cooper – I got to sit in a studio with Natasha Salmon and build Jurassic World lego, all the while talking about dinosaurs. This was for the Metro newspaper, and what fun it was. I even got to keep some of the lego. I also had an article on dinosaurs – specifically on how our perception of their appearance has changed – appear in the Independent Online in mid July. It’s here. Caption: playing with Jurassic World: Fallen Kingdom lego at the Metro offices. I’m not entirely sure why Natasha is making the face she is. Image: (c) Metro. Eotyrannus 2018. During late June I participated in the 2018 BioTweeps conference (an online, Twitter-based conference in which attendees present their ‘talks’ via a series of threaded tweets), my presentation being ‘Eotyrannus and the History of Tyrant Dinosaurs’ (abstract here). As an invited presenter I got to tweet as much as I wanted to in the allotted 30 minute slot. It was a very rewarding experience (with a massive, global reach, I might add), and my thanks to Dani Rabaiotti and Anthony Caravaggi for getting me involved. You can see my presented tweets here (with an addendum here). Caption: Naish at BioTweeps 2018. Image: Darren Naish. Having mentioned Eotyrannus… as some of you know, I am (still) committed to publishing the monograph on this dinosaur, and while I failed to get the damned thing into print in 2018, I promise that this will happen in 2019. It’s not for want of trying: substantial progress was made on the post-review version of the manuscript throughout the year, it’s just that I was never able to commit sufficient time to getting it finished. Silly old me for leaving professional scientific research and becoming a freelancer. My co-author Andrea Cau continues to be a most worthy collaborator. Caption: the Eotyrannus holotype, in its storage boxes, at Dinosaur Isle, Sandown, Isle of Wight… as it looked in 2012. One day my work on this dinosaur will be published. Image: Darren Naish. I mentioned earlier that I was unsuccessful in obtaining a grant – that’s no big deal, most grant applications in science are unsuccessful. Said grant was an attempt to win the money I requ"
