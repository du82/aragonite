["https://tetzoo.com/blog/2018/8/16/could-we-domesticate-non-bird-dinosaurs"]
title = "Could We Domesticate (Non-Bird) Dinosaurs? — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = '''Could We Domesticate (Non-Bird) Dinosaurs? Time for some .speculation about a hypothetical issue… Caption: an ornithomimid being ridden at a riding school; a luxuriantly feathered, selectively bred dromaeosaurid. Images: James Robins (l), Ethan Kocak (r); used with permission. Could we domesticate non-bird dinosaurs, supposing – hypothetically – that we lived in some alternate timeline? This might not seem like the sort of issue I readily tackle here at Tet Zoo (or… it might), but I’ve been inspired. My attention, you see, was drawn to an internet site where an expert attempted to answer the same question. Aaaand the answer they gave was pretty much useless, so here we are. Caption: a friendly pet Parasaurolophus, as illustrated by Mike Skrepnick (and used with his permission) for a 'Would Dinosaurs Make Good Pets' project produced in conjunction with Dinosaur Provincial Park. Image: Mike Skrepnick. Ever keen to give fair credit to those who’ve gone before me, I feel duty-bound to remind you that the issue of hypothetical (non-bird) dinosaur domestication has been covered at least a few times before, mostly in speculative fiction. During both the 1980s and early 2000s (Mash 2003), Robert Mash published his whimsical How to Keep Dinosaurs whereby non-bird dinosaurs as shown acting as pets, livestock, guards and so on in a world where the extinction event never happened. James Gurney's 1992 Dinotopia (and its sequels and spin-offs) features dinosaurs and other animals that - while not technically domesticated - are often featured performing tasks akin to those associated with domesticated animals today. And the 1990s Orbis children’s magazine Dinosaurs! included a well illustrated feature on imaginary dinosaur-human interaction, it being implied that at least some of the dinosaurs were domesticate*.* ‘Domesticate’ as used throughout this article is not a typo for ‘domesticated’. It’s a noun used for a domesticated organism. Caption: during the 1990s, British artist Jim Robins produced a whole set of illustrations depicting non-bird dinosaurs in modern, human-dominated scenes. With his permission, I reproduce several of them here. Image: James Robins. Finally, an extremely odd book titled Who Lies Sleeping? – it’s predominantly concerned with the idea that Mesozoic dinosaurs might have evolved human-like intelligence and then caused their own premature extinction via nuclear annihilation or something – urges us to consider the possibility that the extravagant crests, horns and frills of Cretaceous ornithischians might provide compelling evidence of domestication by big-brained dinosaur overlords (Magee 1993). I see. Caption: an industrial Parasaurolophus, from Magee (1993): "Did the hadrosaurs evolve breathing apparatus to protect themselves from atmospheric pollution", Magee asks. Ok. You might recognise the Parasaurolophus if you're familiar with the contents of Bakker's Dinosaur Heresies. Image: Magee (1993). First things first: what is domestication? Domestication is the creation of a population of living things, distinct in some way from their wild ancestors, that are selectively bred by humans. The main function of domestication involves use of those living things for food, labour, companionship or ornamentation. As evidenced by the extraordinary number and variety of domestic plants and animals, it’s either that we’re really good at it or that it’s really easy once you’re smart enough to wilfully shape the evolution of other living things. Or both. Note that domestication is not simply the grabbing and taming of animals from the wild.While – when thinking of animals – we typically associate domestication with mammals and birds, don’t forget that animals of virtually all major groups can be domesticated, in theory. Witness domestic insects (Chinese silk moth Bombyx mori and Honeybee Apis mellifera) and fish (Goldfish Carassius auratus, among others) (Zeuner 1964). An argument has been made that there aren’t, technically speaking, any domesticated squamates, turtles or amphibians, but a counter-argument is that we’re actually pretty close to such animals being in existence (look at – for example – the many captive morphs of bearded dragon, some of which lack scales and could not exist outside of human care) and there’s no reason why they couldn’t exist given sufficient selective breeding. Time is one of the key factors here. We could – potentially, perhaps – have giant stripy domestic Komodo dragons by now if only we’d started a selective breeding project a few centuries ago [UPDATE: as discussed in the comments, an argument can be made that the ancient Egyptians domesticated crocodylians]. Caption: today there are captive lizards - forms of the Central bearded dragon Pogona vitticeps - that are significantly novel relative to their wild ancestors. The weirdest is the Silkback or Silkie: a lizard that lacks scales. There's some debate, but these animals are pretty close to being considered 'domestic'. Image: CC0, Pixabay. So – could non-bird dinosaurs be domesticated? The short answer is surely: yes, if we had to, or wanted to, and I say this given that humans have proven themselves capable of domesticating just about any organism given sufficient time and motivation, as noted above. That’s a ‘general’ “yes”, however, by which I mean that it refers to non-bird dinosaurs in the general sense of referring to these animals as a group, not in the specific sense of having any one species in mind. For comparison: we’ve domesticated mammals (given that there are sheep and cows and dogs and so on), but that doesn’t mean that we’ve domesticated lions or aye-ayes, to my knowledge, so far.On that note, it’s rather harder to be confident about the hypothetical domestication of a given species – let’s say, for argument’s sake, Tyrannosaurus rex – given that said hypothetical domestication would be contingent on the biology, behaviour, geographical range, physiology and ecology of that species. T. rex could, for example, be prone to some particular disease that would make its living alongside humans impossible, it could prove truly intractable and just impossible to tame or maintain in a human-controlled environment, or there could be something specific about – say – its life as a juvenile or nestling or even the precise place in which it lives that might also prevent domestication. Caption: Moose Alces alces (these are Alaskan moose) are often mentioned in discussions of domestication attempts. The commonest thing said is that they come with too much baggage to allow domestication -- but this simply might not be true at all. Image: Ryan Hagerty, in the public domain. Original at Pixnio. These unknowns are very much hypothetical, obviously, but would surely apply to some species: there are numerous instances where extant animals have proved problematic in the way I imagine. It’s been said, for example, that American moose have been dificult to keep in captivity in Europe, the implication being that some sort of disease prevents their survival in the region (Geist 1999), and then there’s the whole list of animals that have thus far proved either impossible or, at the least, very, very difficult to breed in captivity, predominantly because they don’t seem to like the conditions we provide them with (famous examples include giant pandas, cheetahs and some cranes). Maybe these animals could surely be domesticated in time, but why bother when there are so many other species that don’t come with the same baggage.Some dinosaurs would be easy to domesticate…. perhaps. It should also be noted that non-bird dinosaurs might actually be well suited for domestication, and not difficult to domesticate at all. The rapid generational turnover, large clutch sizes, and relatively rapid growth of many species (especially small and mid-sized ones) could all make selective breeding and human exploitation desirable and relatively easy, so long as we’re talking about a human effort that extends over decades or centuries, at least. Remember that some workers posit life cycles for non-bird dinosaur where even big species (say, the hadrosaur Maiasaura peeblesorum) were sexually mature at two years of age and had exceeded 1.5 tons by their third year (Woodward et al. 2015). Caption: if dinosaurs like hadrosaurs (this graph shows Maiasaura) grew this quickly - we're talking about an animal that is well over 1000 kg within 2 years and capable of breeding by that time, and can be raised on a diet of easily obtained, cheap fodder and produces large clutches to boot - well, we have an animal that might be very desirable as a subject of domestication. Image: Woodward et al. (2015). The ability of at least some herbivorous dinosaurs to successfully consume and digest material that might be considered low quality, cheap and easy to obtain – we’re talking conifer branches, green vegetation of just about any sort and even wood – would be a major score as goes our ability to maintain these animals as captives over generations.And the very fact that these animals lay eggs would also be potentially advantageous in a world where dinosaur domestication is possible since it would theoretically be easier to steal babies and raise them in a controlled environment away from their parents. We just don’t know if non-bird dinosaurs exhibited the same sort of imprinting on parental figures that so many birds do, but if they did we again have a feature highly advantageous to human manipulation.Working With Dinosaurs. When discussing the issues covered so far, I’ve mostly been thinking about domestication that might produce animals bred for meat or egg production, or for use in labour. But what about the maintenance and creation of species used as companions or hunting partners? Here we come to that issue so perennial in discussions of dinosaur biology: intelligence. Caption: trained or restrained combat dromaeosaurs: a familiar part of the Jurassic Park universe long pre-dating the Jurassic World movies. This panel is from a 1994 comic published in the Dark Horse Jurassic Park 'Raptors Attack' storyline. The intelligence – whatever we mean by that term – of non-bird dinosaurs is a subject of eternal debate and uncertainty, and it might be that we never have a good, confident handle on this issue. Intelligence is certainly a red herring when it comes to domestication as a whole. As in, it’s effectively irrelevant: if domestication involves selective breeding and the creation and maintenance of populations designed to be valuable to humans, intelligence has nothing to do with it.Intelligence does, however, have a role to play if we’re talking about the use of domestic dinosaurs in hunting, herding or in performing other tasks that involve co-operation with a human or another animal or animals. Humans work with dogs in this way, of course, but we also have a long-standing and culturally important association with raptors (yeah, I told you it would be confusing if that word were co-opted for dromaeosaurs. It’s the word we use for hawks, eagles, falcons and such). Without going down the intelligence rabbit-hole too far, it’s conceivable that at least some non-bird theropods, and some ornithischians too, were on par with raptors, owls and other birds that can be used as hunting partners, though I happily admit that this is largely intuitive, difficult to demonstrate and isn’t all that well supported right now (e.g., Balanoff et al. 2013). Caption: at least some bird-like non-bird maniraptorans were plausibly similar to, or approached, various modern birds in intelligence. Were they as smart as raptors and owls? ... neither of which are that smart compared to birds more 'properly' considered intelligent. At left, a trained Striated caracara Phalcoboenus australis extracts sticks in order to obtain a reward. At right, a hybrid Turkmenistan x Siberian eagle owl Bubo bubo trained to follow commands and perform in display flights. Neither birds shown here belong to domesticated species, but they're still relevant. Images: Darren Naish. Let’s say that we could train dromaeosaurs, troodontids or oviraptorosaurs as hunting partners. There would have to be a cut-off as goes which species were considered manageable enough or safe enough to work with – above a certain size and firepower, a predatory theropod, or even a given omnivore or herbivore, could simply be too risky to be around for any length of time. More on this in a minute. Caption: the effective function of a 'trained police dromaeosaur' as big as this one might not be plausible, but it sure is a cool image (even if the dromaeosaur is shown as unfeathered, tsk). Image: James Robins. Matters of size. A non-trivial aspect of this discussion is dinosaur size. As per the discussion above, it would surely be plausible to raise and tame babies and youngsters of some, most or many dinosaur species that reach gargantuan size as adults. But what about when they reach that size whereby they become uncontrollable?Elephants are tameable, as we all know, and can generally be controlled by a skilled person following an earlier phase in which the elephant is essentially forced to understand that it has no option but to obey the humans in charge (tangent: there is considerable debate as goes whether tamed elephants should be considered domesticated, since many – but not all – elephants used by people are not domestic as per the definition used earlier in this article). But every now and again a trained elephant snaps, refuses to obey the human giving it commands, and becomes a deadly force that ends in bloodshed, including that of the elephant. I’m not implying in any way that any of the dinosaurs applicable here could have been of intelligence or willpower or ingenuity or whatever on par with an elephant, but you do have to wonder if an angry, disgruntled or disobedient Triceratops or giant sauropod could be controlled or stopped should things go bad. So, what to do about dinosaurs that grow to be ten times – or more! – the size of an elephant? Caption: super-sized sauropods could be bred to be fatter, more muscular and hence higher-yielding than their wild ancestors if domesticated and used for meat production, the result being chubbier, bulkier animals. But what would this mean for the controlling and handling of such massive, powerful animals? Could we even control them at all? Image: Ethan Kocak. Solution 1: cull or release said animals when they reach whatever size has been found to be at the unmanageable threshold. Releasing them might be unworkable given that their familiarity with humans could then make them a nuisance or disruptive problem to whatever society was using them.Solution 2: via selective breeding, produce dwarf forms that do not get to that threshold. Though… why bother when there are non-giant species of similar form?Solution 3: invent and employ technology that forces the animal in question to comply, or prevents them f'''
