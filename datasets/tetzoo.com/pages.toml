full_description = "Announcing DinoCon … Tickets Now on Sale! It’s true… DinoCon 2025 is go! Posted in miscellaneous, meetings and tagged with conventions, DinoCon. February 27, 2025 by Darren Naish. February 27, 2025 Darren Naish conventions DinoCon miscellaneous meetings 2 Comments 2 Comments News From the Pond's Edge: Spawnwatch 2025 It is once more than time of year when the lone amphibian species here – the Common frog Rana temporaria – gathers to breed in ponds and pools. How are things going this year? Posted in herpetology and tagged with herpetology. February 21, 2025 by Darren Naish. February 21, 2025 Darren Naish herpetology herpetology 9 Comments 9 Comments Tet Zoo Reviews Zoos: Tama Zoological Park, Tokyo It’s time once more to do a zoo review… Posted in zoos, miscellaneous and tagged with zoos. February 10, 2025 by Darren Naish. February 10, 2025 Darren Naish zoos zoos miscellaneous 48 Comments 48 Comments Yowies and the Marsupial Hominoid Hypothesis – Neil Frost’s Fatfoot: Encounters With A Dooligahl Let’s look at a remarkable, cryptozoology-themed book, published in 2023… Posted in cryptozoology, book reviews, books and tagged with cryptozoology. February 3, 2025 by Darren Naish. February 3, 2025 Darren Naish cryptozoology cryptozoology book reviews books 59 Comments 59 Comments It Was the 19th Year in the History of Tetrapod Zoology You’re kidding… another year has passed? Yes, it’s late January, meaning that Tetrapod Zoology, the world’s best and most famous zoology-themed blog, has reached another birthday. As ever, I here take a very long-form look back at 2024…. Posted in miscellaneous and tagged with birthdays. January 21, 2025 by Darren Naish. January 21, 2025 Darren Naish birthdays miscellaneous 23 Comments 23 Comments An American Tyrant in London, Collector's Edition When Tyrannosaurus rex was named by Henry Osborn in 1905, it was described alongside a second gigantic theropod, the armour-plated, Ceratosaurus-like Dynamosaurus imperiosus…. Posted in Mesozoic dinosaurs and tagged with dinosaurs, Mesozoic dinosaurs. January 13, 2025 by Darren Naish. January 13, 2025 Darren Naish dinosaurs Mesozoic dinosaurs Mesozoic dinosaurs 13 Comments 13 Comments"
