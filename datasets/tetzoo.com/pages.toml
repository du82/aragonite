title = "New Dinosaur Books, Part 2: Ben Garrod’s ‘So You Think You Know About… Dinosaurs’ Series — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "New Dinosaur Books, Part 2: Ben Garrod’s ‘So You Think You Know About… Dinosaurs’ Series Today we press on with my brief(ish) reviews of recently(ish) published books on Mesozoic dinosaurs – I have quite a backlog – and this time it’s…. the So You Think You Know About… Dinosaurs books, by Ben Garrod. Ben is a qualified zoologist and TV presenter, perhaps best known for the BBC 2014 series Secrets of Bones. I should also add that Ben spoke at the 2017 TetZooCon, so now you know he’s awesome. Ben Garrod's new dinosaur books - another three are due to appear very soon. Image: Darren Naish. Anyway, Dr Garrod has now made a foray into the World of Mesozoic Dinosaurs, and a pretty respectable foray it is. These small, compact books – they remind me of the Horrible Histories volumes a little – provide a huge quantity of information on the dinosaurs they cover, do so in a fun, attractive way, and are very much on-the-ball as goes the current state of our knowledge. They are very much science advocacy tools that don’t shy away from presenting and discussing such topics as complex as sexual selection and evolutionary arms races. The dinosaurian nature of birds is emphasised – dinosaurs can’t be extinct so long as around 10,000 of them are currently alive – and the books are good at conveying the phylogenetic position of the relevant dinosaurs and where they fit within geological time.Black and white cartoons, diagrams and other images are on virtually every page. If you move in the same social media spheres that I do (I’m @TetZoo on Twitter and Instagram) – surprise! – the cartoons are by Ethan Kocak, and illustrations and diagrams by Gabriel Ugueto and Scott Hartman also appear within. Excellent illustrations by Gabriel Ugueto appear in each of the books. Hey, Gabriel and I actually worked together on a large poster about tyrannosaurs included in a magazine -- it was published early in 2018 but I still haven't seen it because the publishers never sent me a copy and no longer have any to provide. Huh. Image: Gabriel Ugueto/Ben Garrod/Zephyr. Regarding what I said a moment ago about these books reflecting ‘the current state of our knowledge’, I’m especially pleased to see inflatable nose balloons featured in the Triceratops volume (for more on this issue see this Tet Zoo ver 3 article from 2016). The Diplodocus volume has a brief discussion of the whole trunks issue (covered here at Tet Zoo ver 3). Ceratopsian nose balloons go mainstream (images by Ethan Kocak). I can't take credit for this. Or can I. Images: Ethan Kocak/Ben Garrod/Zephyr. Quibbles: two or three maniraptoran silhouettes are shown as un-feathered, and I will forgive the Tyrannosaurus book for using the full binomial throughout even though the dinosaurs of the other books are only ever mentioned by their generic names. T. rex exceptionalism, we call it. It's nothing to with Ben Garrod's books, but I thought I'd include another image of ceratopsian nose balloons for good measure. This brilliant piece is by J. W. Kirby and the original can be seen here at KirbyniferousRegret's deviantart page. Image: J. W. Kirby. I really like these books and strongly recommend them for young readers (I suppose the target audience is kids between 6 and 16, or so). Ben is big on ‘embracing your inner geek’, and on encouraging young people to be proud of their curiosity and interest in science and nature, and I’m sure this is something that everyone reading this wants to see promoted and celebrated too. Three additional volumes – on Spinosaurus, Velociraptor and Stegosaurus – are finished and due to appear in print very soon (so I understand).Ben Garrod, 2018. So You Think You Know About… Tyrannosaurus rex? Zephyr, London. ISBN 9781786697844. Hardback, 106 pp. Here at amazon. Here at amazon.co.uk. Here from the publishers.Ben Garrod, 2018. So You Think You Know About… Diplodocus? Zephyr, London. ISBN 9781786697868. Hardback, 112 pp. Here at amazon. Here at amazon.co.uk. Here from the publishers.Ben Garrod, 2018. So You Think You Know About… Triceratops? Zephyr, London. ISBN 9781786697882. Hardback, 108 pp. Here at amazon. Here at amazon.co.uk. Here from the publishers.Once these book reviews are out of the way, get set for some novel dinosaur-themed content here. Here's your regular reminder that this blog relies on support via patreon, thank you to those providing support already.For previous Tet Zoo book reviews on dinosaurs (I've now taken to adding dates to articles of the past; I find this useful)...Long and Schouten's Feathered Dinosaurs, a review, January 2008Luis Chiappe's Glorified Dinosaurs: The Origin and Early Evolution of Birds, January 2011Greg Paul's Dinosaurs: A Field Guide, February 2012New Dinosaur Books, Part 1: Barrett on Stegosaurs, August 2018 Posted in Mesozoic dinosaurs, books, book reviews and tagged with dinosaurs, Mesozoic dinosaurs, books, book reviews. August 8, 2018 by Darren Naish. August 8, 2018 Darren Naish dinosaurs Mesozoic dinosaurs books book reviews Mesozoic dinosaurs books book reviews"
