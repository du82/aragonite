["https://tetzoo.com/blog/2019/11/16/suburban-birdwatching-in-queensland-australia"]
title = "Suburban Birdwatching in Queensland, Australia — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "Suburban Birdwatching in Queensland, Australia I recently spent time in Australia, and specifically in Brisbane, Queensland (this was for the 79th Society of Vertebrate Paleontology annual meeting), and, while there, I got to see a pretty good selection of birds. I photographed as many as I could, and in this article I’m going to talk about them. All the birds I’m going to discuss here were encountered in urban and suburban settings in close proximity to people, and none are especially exotic or obscure. But they were entirely novel to me, and I was hugely excited to encounter them in the wild. I hope you’ll enjoy reading about them. Caption: Dusky moorhen, Australian white ibis and Little black cormorant captured in the same one shot (at left). At right: a wonderful Torresian crow. Images: Darren Naish. One more bit of preamble: if I had the time and foresight, I could have organised a special birdwatching tour, in which case I could have been taken to various specific locations at which I might have seen a rather more impressive list of Australian birds not ordinarily encountered by mere chance. But… I didn’t. I wish I had. Caption: if you’re truly interested in animals, you’re interested in invasives, aliens and introductions, and there’s no shame in paying attention to them or studying them. So go ahead and photograph that feral pigeon. Image: Darren Naish. My very first Australian bird sighting was of Welcome swallows Hirundo neoxena, seen flying around the outside windows of Perth Airport. I was to see this species on several subsequent occasions (it occurs across virtually the whole of Australia except for some north-central sections), but no photos, sorry. My second species: the feral Rock dove or Rock pigeon Columba livia! I don’t care what anyone says: I always take time to look at feral pigeons, and one thing you notice is that populations differ from place to place, mostly because they descend from different founding populations of escapees or released birds. Brisbane pigeons were especially dark relative to the majority of familiar urban pigeons in Europe, and on the large size too. Brisbane: make of that what you will. Caption: my first bin chicken. This individual spent time probing into the gap between the pavement and a retaining wall, searching for arthropods. Image: Darren Naish. My second Aussie bird was something far more exotic (to me): an ibis, and specifically an Australian white ibis Threskiornis molucca. This species was included within T. aethiopica – the species currently referred to as the African sacred ibis – until the mid-2000s, and some authors still regard the two as conspecific. The Black-headed ibis, Black-necked ibis, Oriental white ibis or Indian white ibis T. melanocephalus is part of this complex too (all three are regarded as part of the same superspecies). Apparently, there are Australian people who still refer to T. molucca as the Sacred ibis but --- as any Australian will tell you within 0.5 seconds of you expressing interest in this bird, it’s not ‘the Australian white ibis’ to the vast majority of urban Australians but ‘the bin chicken’: an animal that people associate with rubbish, waste food and urban filth in general. I get the impression that Aussies love to hate the ibis the same way people also dislike urban gulls and pigeons. Hey idiots... the shitty trash the bird is eating is, like, YOUR trash and YOU put it there. Caption: Australian white ibis out and about in town. Image: Darren Naish. Australian white ibises seem to be both abundant in Brisbane and extremely bold. Large groups are present in the parks throughout the city, groups can be seen nesting at the tops of palms and other trees in the parks, and individual birds can be seen walking around in crowded pedestrianised areas and even right into cafes and restaurants… though they aren’t exactly welcome in such places. Caption: large numbers of ibises are readily visible in parks and other green places in Brisbane. The birds stand or sit on the grass and rest in trees. The first individual I saw (the one probing in the paved area, shown above) was initially sat on the grass, chest against the ground. Image: Darren Naish. Caption: aaaand… even more ibises. Image: Darren Naish. Go near the water most places in the world, and you’ll very likely see members of the duck, goose and swan family Anatidae, and such it is in Australia. I saw three species, all new to me, all in close proximity to the ponds in Brisbane’s Botanical Gardens. We’ll start with the Australian wood duck, Maned duck or Maned goose Chenonetta jubata, a heavily terrestrial, pan-Australian, cavity-nesting duck that might be a member of the shelduck clade Tadorninae. The birds I saw were asleep (or pretending to be asleep) and thus standing and sitting still with their eyes closed. Caption: at left, two Australian wood ducks. resting or sleeping. At right: a Hardhead heads across the water towards me. Presumably, it (and its partner) was used to being fed by people. Image: Darren Naish. Pacific black ducks Anas superciliosa – PBDs in birding vernacular – were also seen; this is an especially handsomely marked member of the mallard complex, the different forms of which are quite variable across its southwest Pacific/Australasia range. Another first for me was Hardhead or White-eyed duck Aythya australis, a Pacific/Australasian member of the scaup and pochard lineage (Aythyini). Caption: Pacific black duck. Of the three recognised subspecies, the Australian one is A. superciliosa rogersi. This subspecies also occurs in Indonesis and New Guinea. Image: Darren Naish. My biggest surprise at the ponds, however, was an Australian darter or anhinga Anhinga novaehollandiae (here I’m following recent studies in recognising this as a distinct species from African and Asian anhingas), which I watched for some time as it foraged and hunted close to the water’s edge. On occasion, it would disappear entirely from view before stretching its long, slender neck out of water while swallowing a fish. And on other occasions, its long tail could be seen part emerging above the surface while the bird was part swimming, part floating, just beneath the surface. I’ve never seen a live anhinga before. This one was smaller than I expected. Caption: an anhinga surfaces and swallows what I presume is a fish. Image: Darren Naish. Caption: more swimming anhinga action. Image: Darren Naish. Caption: Little pied cormorant, foraging in a shallow pool with abundant algae and other aquatic plants. Its appearances at the surface were really brief compared to the other cormorants I’ve watched, and this is the only photo that clearly shows its head and bill. Image: Darren Naish. Two cormorant species were also present at the ponds: Little black cormorant Phalacrocorax sulcirostris (see photo at the top of the article) and Little pied cormorant P. melanoleucos (or Microcarbo melanoleucos, if you follow Siegel-Causey’s (1988) taxonomy). The one individual of the latter I saw was diving for food in a heavily vegetated pool. A group of three Dusky moorhens Gallinula tenebrosa were paying close attention to its activities, and would circle and peck at the surface every time the cormorant would dive. I assume that they were interested in bits of vegetation and small animals brought to the surface by the cormorant’s activities. Indeed, numerous small fish and tadpoles were present in the pools. The tadpoles looked like those of a toad and I presume they were Cane toad Rhinella marina larvae, indeed I know that Cane toads were present since I found two dead ones in the park grounds. Caption: Dusky moorhens search for food in an area where the water is being disturbed by a swimming Little pied cormorant. Image: Darren Naish. Dusky moorhens were frequently encountered and easily approached. As suggested by the name, they looked darker than the Eurasian moorhens G. chloropus I know well, and they appeared larger and chunkier too. I watched them foraging on lawns, and a bit of squabbling, chasing, fighting and mating was seen as well. Caption: Silver gulls look similar to Northern Hemisphere species like the Black-headed gull Chroicocephalus ridibundus, and there’s a reason for that. Image: Darren Naish. Finally on birds associated with watery places, I also visited an artificial beach close to the Brisbane River where there were numerous Silver gulls Chroicocephalus novaehollandiae. This is Australia’s most widespread gull and occurs around the country’s entire coast as well as in many inland locations. The Silver gull is surrounded in phylogeny by species that have grey, black or brown heads (Chu 1998) and is thus generally agreed to be part of the Chroicocephalus group (and is thus not part of Larus in the new, restrictive sense). At least a few other Chroicocephalus species are like the Silver gull in being white-headed too, so it might be that a transition from a dark head back to a white one happened a few times in this group. The Silver gull is a mid-sized, slender-billed gull. Caption: Masked lapwing, or Black-shouldered lapwing if you’re so inclined. Note that the carpometacarpal spurs aren’t readily visible here. Image: Darren Naish. I also saw a single plover, specifically a Masked lapwing Vanellus miles… and, more specifically, the black-shoulder form V. m. novaehollandiae (jeez, colonial Europeans: couldn’t you be a bit more creative with the scientific names?) sometimes recognised as the distinct species V. novaehollandiae, the Black-shouldered lapwing. This bird was wandering around on a lawn close to a restaurant. Lapwings – technically called vanellines – are conventionally included within Charadriidae, the plover family. Lapwings are interesting in that they possess large spurs on the carpometacarpus, which are typically (but not always) visible when the wings are closed. These are used in defence against predators (like cats, dogs and corvids) and also in intraspecific fights. There’s an apparent common folk belief that the spur is venomous! Here’s your regular reminder that TetZoo ver 3 includes two fairly comprehensive articles on the spurs, claws and clubs present on the wings of birds (part 1 here, part 2 here; I’ve linked to wayback machine versions as they include the illustrations). Caption: a Laughing kookaburra in the wild, perched and vigilant. Image: Darren Naish. I was surprised (hey, I’m from Europe) to see a Laughing kookaburra Dacelo novaeguineae in an urban park, sat on top of a streetlight and also in flight in the same park. I gather than kookaburras are pretty typical park and garden birds in parts of Australia, well known for their habit of grabbing food from tables and barbeques and such. Most of you will know that kookaburras are especially big kingfishers, closely related to Halcyon kingfishers and kin, and that the bulk of kingfisher diversity exists in the islands and coastal regions of Australasia. Kingfishers have conventionally all been included within the same one family (Alcedinidae), and this is still a popular view. However, the idea that lineages within the group are ‘distinct enough’ that several kingfisher families should be recognised is also popular, in which case kookaburras and their close kin belong within Halcyonidae (previously known, incorrectly, as Dacelonidae; Sibley & Ahlquist 1990). Miners (more on them in a minute) are not fans of kookaburras and a few individuals took time to mob the individual sat on top of the streetlight. Caption: a Noisy miner (at left) arrives to harass a Laughing kookaburra. Image: Darren Naish. I was also pleased to see Rainbow lorikeets Trichoglossus moluccanus at a few places, though none of my photos are at all good. Lorikeets mostly eat pollen and nectar and their specialised brush-like tongues explain their generic name – Trichoglossus means ‘hair tongue’. I actually saw parrots of a few other species as well, but they were right at the top of really tall trees and mostly seen in silhouette, so I never saw any of the detail that might allow them to be identified. Caption: Rainbow lorikeet at the top of a palm tree. The green collar confirms the identification, since similar lorikeet species (like the Red-collared lorikeet T. rubritorquis) lack this feature. Image: Darren Naish. As everyone who knows anything about birds knows, the majority of living bird species (over 60% of them) are passerines (or perching birds), and most of the Australian species I saw were members of this enormous group. I didn’t see any feral European starlings or sparrows, or indeed any introduced European species at all, and nor did I see any small endemic Australian endemics, like fairywrens, pardalotes or sunbirds. Caption: a Noisy miner, eating parts of a Mexican burrito on a restaurant table. Image: Darren Naish. We’ll start with Noisy miners Manorina melanocephala. These are mostly grey, thrush-sized passerines – happy to take to the ground as well as forage in trees and shrubs – that have a robust bill and naked yellow patch of skin behind the eye. They’re bold and look to have made the full transition to life in urban settings. I saw them jump around on tables and eat food from plates just moments after people had left, and I also saw them waiting for dropped food scraps right next to a person sat on the grass. In one case, a man eating his lunch while sat in the park was literally slapping the birds out of the way. Caption: Common or India mynas are one of the most important alien birds in Australia (‘important’ in economic and ecological terms). Note that this individual is afflicted by a problem most commonly associated with urban pigeons: mangled toes and missing toe segments (the hallux claw is missing on the left foot). Image: Darren Naish. The fact that these birds are called ‘miners’ is a bit confusing, since this makes it sound as if they’re ‘mynas’ (also spelt ‘mynahs’); that is, members of the starling and myna family Sturnidae. But they’re not, they’re honeyeaters (Meliphagidae). There are, incidentally, proper mynas in Australia: namely, the introduced Common or Indian myna Acridotheres tristis from tropical southern Asia. I saw some of these as well (I also saw them while on the journey home, in Singapore). Back to honeyeaters: Australia is the land of honeyeaters, the country being home to about half of the c 190 extant species. For all that I only saw one other meliphagid species: the Blue-faced honeyeater Entomyzon cyanotis. Caption: a Blue-faced honeyeater, photographed at distance while it was on the top of a building. The area of blue facial skin is variable in these birds; this individual seemed to have only a small amount of blue. The skin is green in juveniles. Image: Darren Naish. Moving on, Australia is also home to a really exciting assortment of sometimes large, omnivorous and predatory, superficially crow-like passerines, namely butcherbirds, currawongs and Australian magpies. I bet most "
