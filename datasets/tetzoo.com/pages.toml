title = "New Dinosaur Books, Part 1: Barrett on Stegosaurs — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "New Dinosaur Books, Part 1: Barrett on Stegosaurs I’ve always reviewed books here at Tet Zoo, and here at ver 4 I fully intend to condition this fine tradition. Over the next few articles I’ll be discussing new (or newish) books on Mesozoic dinosaurs. And we start with something very special – a whole book devoted to stegosaurs. This might be a first (UPDATE: I just remembered that the late Beverly Halstead wrote a semi-fictional book on the life history of Stegosaurus). Cover of Barrett (2017)... perhaps the only published volume fully devoted to stegosaurs and stegosaurs alone. Stegosaurus: An Extraordinary Specimen and the Secrets it Reveals by Paul M. Barrett tells the story of ‘Sophie’ (initially ‘Sarah’, and technically NHMUK PV R36730), the excellent, complete Stegosaurus specimen discovered and excavated at Shell, Wyoming in 2003/4. You’ll have seen this outstanding specimen mounted on display if you’ve visited London’s Natural History Museum. Already Sophie has been the focus of a whole bunch of quality technical publications by the author and his colleagues (Brassey et al. 2015, Maidment et al. 2015, Lautenschlager et al. 2016). A look inside. This is an info-packed book with great graphics and loads of photos and diagrams. Sophie the Stegosaurus - or NHMUK PV R36730, if you prefer - in person at the Natural History Museum, London. I'm sure many of us have an unreasonable number of photos of this amazing specimen. Image: Darren Naish. The book does so much more than tell the story of Sophie: it’s also a very good review of what we know (or think we know) about stegosaur biology. The text is dense, packed with scientific content, and highly readable. Excellent images appear throughout, ranging from photos of the specimen and CT renders generated during research to life reconstructions and maps. I initially assumed – no offence intended to the author – that this would be a text-light book written for kids, with more space than text on its pages. That’s not the case at all: there’s a ton of information here and anyone interested in dinosaurs should get this book. Older kids with an interest in science or dinosaurs will enjoy it, and adults will too. Some of the taxonomic conclusions discussed in the review of stegosaur diversity – that Hesperosaurus is synonymous with Stegosaurus and Miragaia is synonymous with Dacentrurus – have been overturned in work published since the book saw print (Raven & Maidment 2017). A reminder that the stegosaurs of your parents or grandparents - or those of a recent terrible movie franchise - are not in keeping with the way these animals more likely looked. These drawings are old, excuse the GSP tail muscles. Image: Darren Naish. In short: highly recommended for everyone, and dead cheap as well.Disclaimer: the author and I previously worked together on another dinosaur book published by The Natural History Museum, namely Dinosaurs: How They Lived and Evolved (Naish & Barrett 2016). As some of you know, a second edition of that book – including numerous tweaks and updates – appears in print very soon, so I’ll be talking about it then.Paul M. Barrett, 2017. Stegosaurus: An Extraordinary Specimen and the Secrets it Reveals. Natural History Museum, London. ISBN 9780565093884. Hardback, 108 pp. Here at amazon. Here at amazon.co.uk. Here from the publishers.Stegosaurs have been covered quite a few times at Tet Zoo previously. See…A most atypical stegosaur, November 2007Stegosaur Wars: the SJG stegosaur special, part I, December 2010Heinrich’s digital Kentrosaurus: the SJG stegosaur special, part II, January 2011Life as a stegosaur: the SJG stegosaur special, part III, January 2011Dinosaurs and their exaggerated structures : species recognition aids, or sexual display devices?, April 2013The Stegosaurus Plate Controversy, July 2016Stegosaurs and the Species Recognition Hypothesis, August 2016Things are going very well here at ver 4: I’m keeping an eye on the hits counter and the comments, and things are good. Many thanks to everyone who’s helping to make it work. Here’s your reminder that the more support I receive at patreon, the more time I can spend writing and publish the stuff you like to read. Thanks to those who support this endeavour already. As a Tet Zoo patron you get to see stuff coming together behind-the-scenes: there are already over 550 in-prep illustrations and pieces of text there.Refs - -Brassey, C. A., Maidment, S. C. R. & Barrett, P. M. 2015 Body mass estimates of an exceptionally complete Stegosaurus (Ornithischia: Thyreophora): comparing volumetric and linear bivariate mass estimation methods. Biology Letters 11: 20140984.Lautenschlager, S., Brassey, C. A., Button, D. J. & Barrett, P. M. 2016. Decoupled form and function in disparate herbivorous dinosaur clades. Scientific Reports 6, 26495.Naish, D. & Barrett, P. M. 2016. Dinosaurs: How They Lived and Evolved. The Natural History Museum, London.Maidment, S. C. R., Brassey, C. & Barrett, P. M. 2015. The postcranial skeleton of an exceptionally complete individual of the plated dinosaur Stegosaurus stenops (Dinosauria: Thyreophora) from the Upper Jurassic Morrison Formation of Wyoming, U.S.A. PLoS ONE 10 (10): e0138352. Raven, T. J. & Maidment, S. C. R. 2017. A new phylogeny of Stegosauria (Dinosauria, Ornithischia). Paleontology 60, 401-408. Posted in Mesozoic dinosaurs and tagged with stegosaurs, books, book reviews, dinosaurs, Mesozoic dinosaurs, ornithischians. August 4, 2018 by Darren Naish. August 4, 2018 Darren Naish stegosaurs books book reviews dinosaurs Mesozoic dinosaurs ornithischians Mesozoic dinosaurs"
