title = "The Life Appearance of Sauropod Dinosaurs — Tetrapod Zoology"
description = "Welcome to the new home of Dr Darren Naish’s world-famous Tetrapod Zoology blog - Tet Zoo for short - now in its fourth iteration. Tet Zoo is devoted to discussion, research, discovery and speculation regarding THE TETRAPODS: the amphibians, reptiles, birds and mammals, and all of their extinct relatives. No fish, never fish. Ok, I also do fish now. Follow me on Twitter and Bluesky and please help support my blogging, writing and research at patreon. Tet Zoo merchandise is available at the redbubble shop.This site is also the home of the podcast, co-hosted with John Conway. A separate support stream for the podcast can be found here. If you like what we do, please consider providing support."
full_description = "The Life Appearance of Sauropod Dinosaurs If you’re a regular TetZoo reader you’ll be familiar with my several articles on the life appearance of Mesozoic dinosaurs, an issue in which I have a special interest. Alas, several of these articles were published at TetZoo ver 2 – the ScienceBlogs years – and hosting issues at the site concerned mean that they’re currently appearing sans all of the many images I so lovingly uploaded. Which is a pain. A really nice, life-sized model of a titanosaurian sauropod, on display in Romania and constructed by Brian Cooley. Image: Darren Naish. Partly as a consequence, and partly because the issue is on my mind due to several concurrent projects (he says, cryptically), now is a good time to talk once more about the life appearance of Mesozoic dinosaurs, and I’m going to start with sauropods. Sauropods have been covered quite a few times on TetZoo before, as you can see from the list of links at the bottom of this article.The head, and face especially. We’ll start with the head. Sauropod skulls were proportionally small compared to the overall size of the animals, but not comically so. It’s also worth saying that their eyes – while pretty big in absolute size (based on the size of the eye socket and the sclerotic rings preserved in fossils) – are easy to over-emphasise in illustrations. If you’ve heard that sauropods might have had trunks and thought it reasonable or plausible… well, it’s a poor idea that’s neither reasonable nor plausible, and has a lot counting against it, as covered in the ver 3 article here. Did sauropods have trunks? NO. It’s the dumbest idea ever, and every piece of evidence counts against it. Several authors have independently explored this idea, including Robert Bakker (upper right) and Bill Munns (lower right). The two images at left are from Knoll et al.’s (2006) paper refuting the trunk idea. Images: Knoll et al. (2006), Bakker (1986), Bill Munns (original here). Trunks are a no, but did sauropods have ‘lips’ or ‘cheeks’? A whole article could be written on this issue. For now, I’ll summarise things by saying that sauropod skull bone texture indicates that they likely did have extra-oral tissues that mostly covered their teeth (Witton 2018), meaning that they were facially similar to lizards and kin. A suggestion that some titanosaurs had blade-like cutting sections in the posterior sections of their jaws – so-called ‘guillotine crests’ (Apesteguía 2004) – looks unlikely given that it would require the animals concerned to do their food procurement at the sides of the jaws, rather than at the front like all other sauropods and other dinosaurs. It’s more likely that a mistake has been made here and that the jaw segments thought to support those blade-like, keratinised sections were, while sharp-edged, covered in normal lip tissue. The possibility that diplodocoids and maybe other sauropods too might have had true beaks at the font of the mouth has recently been put forward, but so far only in preliminary fashion. Apesteguía (2004) argued that some titanosaurs - this is the rhino-sized Bonitasaura - had keratinised ‘guillotine crests’ on the edges of the jaws. I think that this is likely a mistake. Image: Apesteguía (2004). The nostrils and nose. As is now widely known, and near-universally accepted, the external or fleshy nostrils of sauropods were almost certainly not located way up on the forehead, far from the front of the snout, as was long thought based on the retracted position of the bony nostril openings. A more ‘normal’, anterior position for the nostrils was demonstrated by Witmer (2001) who pointed to evidence from blood vessel and nerve impressions and associated cranial hollows, all of which are located on the anterior part of the snout. These indicate the most likely position of the fleshy nostril and associated blood vessel clusters. The soft dinosaur revolution comes to Sauropod Town. At left, an image by Matt Wedel which shows why we need more soft tissue on our sauropods. At right, Larry Witmer’s (2001) depiction of the different possibilities as goes nostril position in sauropods. (a) is the most likely option based on anatomical data. Image: Mathew Wedel, Witmer (2001). There are also reasons for thinking that the giant, cavernous bony nostril openings and tall nasal bars of some macronarian sauropods supported, and were surrounded by, dome-shaped soft tissue convexities, superficially recalling the bulging nasal regions of some living monitor lizards. Part of my reason for saying this comes from the nasal anatomy of the exquisitely preserved South American titanosaur Sarmientosaurus. Here, an anteriorly projecting bony spine located along the midline and associated bar-like structures on the lateral edges of the large narial fossa – the big bony opening surrounding the bony nostril – indicate that a wide, convex mass of tissue connected the forehead with the sides and front of the snout’s upper surface (Martínez et al. 2016). Sarmientosaurus isn’t unique in this respect but is a particularly good example. The skulls of some sauropods - this is the titanosaur Sarmientosaurus - indicate that there were bulbous nasal structures covering much of the snout region. Image: WitmerLab. Indeed, skull openings in general were almost definitely not sunken in appearance or otherwise all that obvious, something that’s being said of archosaurian faces in general as artists and anatomists have learnt to take better attention of the conditions present in living animals (where cranial openings are just about never obvious in the live creature).Accordingly, sauropod faces were seemingly ‘softer’ and more ‘padded’ than convention would have it, at least some of – perhaps all of – the nasal and forehead region being convex and fleshy, rather than shrink-wrapped and covered in thin skin alone (Witton 2018). Were sauropod necks mostly semi-horizontal and with a limited range of motion, as argued by Martin (1987) and illustrated at left? Nope; it’s more likely that the necks were often held aloft and far more flexible, as argued by Taylor et al. (2009) and depicted at right. Images: Martin (1987), Taylor et al. (2009). The neck. The most remarkable feature of sauropod anatomy is the neck. As goes how the neck was held and how flexible it was, several possibilities have been put forward, some workers arguing that it was held in a mostly horizontal attitude for much of the time and with only a limited range of lateral and vertical flexibility. I’m part of a group who argue for mostly elevated habitual neck poses (even in diplodocids) and a wide range of flexibility (Taylor et al. 2009). Arguments that sauropods must have been horizontal-necked do not take account of the flexibility permitted by cartilage, or – in living animals of all sorts – the ranges of motion that happen at zygapophyseal junctions and at the neck base and head-neck junctions. There are good reasons for thinking that sauropod necks were habitually inclined upwards, as is typical for terrestrial tetrapods in general, and several fossils are actually preserved with the neck in this orientation. This montage by Greg Paul shows several of the fossil concerned. Image: Paul (1998). It's been convention to show the sauropod neck as a featureless tubular structure, like a hose. This is mostly wrong, in part because the shapes of the vertebrae reveal a more unusual cross-sectional shape that varies from one sauropod group to the next. In some sauropods (like mamenchisaurs), the vertebrae are quite narrow and the neck would have looked laterally compressed in places, as it is (for at least some of its length) in giraffes. In diplodocoids – apatosaurines in particular – the neck is narrow close to the head but wide for much of its length, and subtriangular in cross-section, being widest across the neck’s underside. A neck that was quite narrow in its anteriormost quarter or so but was markedly wide for the rest of its length seems to have been the case in brachiosaurs and at least some titanosaurs. The necks of some sauropods - a good example is the ultra-long-necked Omeisaurus, photographed at Zigong Dinosaur Museum - are somewhat laterally compressed for at least part of their length. Image: Darren Naish. Indeed, the very base of the neck is remarkably broad in some sauropods – Camarasaurus is the classic example, where the neck base is not that different in width from the front of the chest – meaning that the neck would taper gradually along its length if you were looking at the animal from the front or back, or from above or below. The neck bases of some sauropods - this is the Camarasaurus replica on display in London’s NHM - are shockingly broad. It would be wrong to show the neck as a narrow, hose-like object with parallel sides. Image: Darren Naish. The vertebrae themselves are very complicated with large hollows on their sides, projecting neural spines on the apices and so on. In the most extreme version of the shrink-wrapping meme promoted by one or two palaeontologists and palaeoartists, sauropod necks have been depicted as if these structures should be visible in the live animal, Ely Kish’s apatosaurines from 1983 being the ultimate example. This was definitely not the case. It remains uncertain how much musculature and soft tissue surrounded the vertebrae, but it was almost certainly (based on the anatomy of living animals) enough to obscure the form of the vertebrae, their bulbous junctions perhaps being visible in sauropods of some or many sorts. The brilliant, late Ely Kish, one of the best palaeoartists of all time, constructing a scale model of Apatosaurus (in preparation for a large painting). Partly on the advice of palaeontologist Dale Russell, she depicted great lateral concavities on the sides of the neck. Image: Russell (1987). Necks as display banners. The unprecedented form of the sauropod neck makes it plausible – perhaps even likely – that the neck was used as a display structure. Phil Senter’s suggestion that the size and length of the neck was driven, in evolutionary terms, by its use as a display structure (Senter 2007) is not supported by evidence (Taylor et al. 2011). However, this doesn’t discount co-option of the neck in display, so it really is – while wholly speculative right now – worth taking seriously the possibility that display structures of various kinds could well have adorned sauropod necks. These could include wattles, dewlaps, spiky frills, spines, filaments, inflatable pouches or distensible flags or flaps. A few artists have explored these possibilities, most notably Brian Engh and Emiliano Troco. As weird as it might seem, it is at least plausible that the sauropod neck was decorated with weird soft-tissue display structures, as depicted here on a diplodocid. Image: Emiliano Troco. Hands. Sauropod hands are extremely odd, and very different from the rounded, elephant-style structures, edged with big nails and/or several claws, shown so often in artistic reconstructions and museum models. Indeed, they’re sufficiently weird and interesting that I’ve written whole articles about them before but, as I said above, these are currently lacking all of their relevant illustrations and are thus all but useless. Sauropod hands are essentially unique. They’re weird, semi-tubular structures with pillar-like metacarpals. At left, a brachiosaur hand. At right, the hand of the turiasaur Zby. Images: Anthony Maltese, Darren Naish. The sauropod hand is essentially a semi-tubular structure formed of elongate metacarpals arranged, pillar-like, in a semi-circle. The posterior surface – corresponding to the palm – was hollow, the consequence being a semilunate area of contact with the ground. We’ve known since at least 1940 that sauropod hands had this very unusual form thanks to fossil tracks (Falkingham et al. 2014), which makes it all the weirder that people have ignored this information and merrily continued giving sauropods elephant-like hands across the decades. Roland T. Bird’s sauropod track illustrations from the 1940s - shown here - clearly show the true, highly unusual form of the sauropod manus. Shame on those who ignored this information in the following decades. Image: Falkingham et al. (2014), CC BY 4.0. Tracks also show that nails and claws were absent from the hands, except on the thumb where a pointed claw – which varied considerably in exact shape and size from one group to the next – projected inwards and slightly backwards. The thumb claw was lost within Titanosauria, meaning that at least some members of this group lacked nails and claws on their hands altogether. I will concede that poorly defined convexities corresponding to manual digits were present in at least some sauropods, but they still wouldn’t have looked like distinct digits.Some tracks appear to show that tough semi-conical tubercles projected from the skin on the front and sides of the hand, perhaps giving part of the hand a spiky or tuberculated appearance (Milàn et al. 2005). Maybe these structures had a role in foraging, digging, display or combat, since it’s plausible that they made the hands gnarlier and harder than they would have been otherwise. Vertical scores associated with sauropod hand prints indicate that at least some of them had tuberculate hand skin, as depicted here (at right) in this modified version of a Greg Paul illustration. Image: Milàn et al. (2005). Feet. Three large, curved claws projected anterolaterally from the inner three toes. At least some sauropods possessed four such claws. The outer two toes projected as blunt, rounded convexities in some, most or all sauropods. This is obvious from at least some Brontopodus tracks (Meyer et al. 1994). They might have had nails but were more likely lacking horny structures of any sort and essentially continuous with the rest of the foot’s outer surface. In contrast to the hand, the foot did have a massive fatty pad at its back.Until recently it was thought that the metatarsals were held at a high angle, the consequence being a short foot shaped like that of an elephant but for the claws (Paul 1987). Data from articulated skeletons and tracks, however, show that the metatarsus was not as erect as argued, in which case the toes were longer and flatter than depicted by some artists. Tschopp et al. (2015) used data from complete Camarasaurus hands and feet to produce the skeletal and soft-tissue models you see here (in 1 and 2), and then used these to generate tracks (3). The tracks are an exact match for real fossil tracks. Image: (c) Tschopp et al. (2015). On the subject on feet and limbs, trackways also show that sauropods differed in how they placed their hands and feet, some walking with a very narrow gait (the hands and feet being placed close to the midline), others using a wide gait (where there was some short distance between the hands and feet of the left side versus those of the right), and others being interm"
