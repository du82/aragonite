["https://tex-edit.com"]
title = "Trans-Tex Software"
full_description = '''For the past 24 years, Trans-Tex Software has been dedicated to the principle that good software doesn't have to be expensive and difficult to use. In memory of the demise of KAGI, we have converted all shareware to freeware. I would like to thank all our users for their loyal support. Tex-Edit Plus is a scriptable, ASCII text editor that fills the gap between a Apple's bare-bones TextEdit and a full-featured word processor. It's fast, efficient, and has a clean, uncluttered interface. It's also great for cleaning up text which is transmitted over the Internet. AppleScript is a wonderful, Mac-only technology that allows ordinary people to create automated shortcuts with minimal effort. Doug Adams maintains the official AppleScripts for Tex-Edit Archives, a site filled with hints, tips, examples, and step-by-step instructions for those of you interested in saving time, impressing the boss, and avoiding repetitive stress injuries. Tex-Edit Plus also supports Apple's new Automator, which has been drastically enhanced for Yosemite, the latest Mac operating systems. With 36 custom Automator actions and unrivaled AppleScript recordability, Tex-Edit allows you to create custom scripts and workflows with the push of a button. Of course, if your time is of little or no value, please feel free to ignore AppleScript and Automator. Natural-sounding OS X voices are now available! If you use Tex-Edit's speech facilities to proofread documents (or if you want to find out what Eliza really thinks about you), check out the high quality voices produced by Cepstral. The Version 5.2 voices, including the new Callie voice, are extremely cool! Enjoy a rousing conversation with your Mac. Eliza will play the part of a psychologist, conducting an open-ended clinical interview. As the patient, you get Eliza's opinions and advice on a wide range of subjects. Eliza has a large vocabulary and the ability to formulate a virtually unlimited number of responses. (Freeware) Azile is a slightly "altered" version of Eliza, the classic mainframe psychologist emulation program. Azile is a cranky therapist who couldn't care less what your problems are. (Freeware)'''
year_published = 2025
clearnet = "https://tex-edit.com"
