title = "text-mode.org | Text graphics: ASCII, PETSCII and its distant relatives."
full_description = "Term-font, 80 columns Term-font, 200 columns Blapinus-font, 80 columns Blapinus-font, 200 columns Image-to-text conversions made in Chafa by its author, Hans Petter Jansson, 2025. The first two use the Terminus font and the bottom two use Blapinus. The original Himeji image is 3.4 MB in the PNG-format, while the 200-column text version is less than 0.9 MB. A JPG in 90% quality is 724 KB while a gzip-compressed 200-column text version is 230 KB. textmode.art by humanbydefinition is a browser tool that allows you to upload and layer images and videos and add effects to it. You can experiment with character sets and many other things. Work in progress. Star Wars PETSCII by Daniel Browning in People’s Computers #1, 1978. We’ve previously posted the front cover, but this is from the article inside. Browning explains how to plan the image on paper, and then use his PET-software GRAPHIX-I or GRAPHIX-II. Old Commodore 64 BBS graphics are not easy to find. A lot of it was probably never saved, and there’s not really any obvious place for it online either. So I was thrilled to get a whole bunch disk images from Sixx: more than 1,000 PETSCII graphics and animations! I’ve gone through it, removed duplicates, identified artists, etc, and captured it as images and videos. I’m not done yet, but I’m presenting it as is. Full archive as C64 disk images or captures (work in progress). Help and info is welcome! -> infoATgoto80DOTcom Big thanks to Baracuda at c64.ch for helping out to find artist names for a bunch of acronyms. <3 Context I got 22 C64-disks from my good friend SiXX, who thinks he got them a long time ago from DemongerX, who passed away in 2023. Dated works range from 1986 to 1993, and most of them are probably from USA. Canada is represented, and a few other countries (Germany, Turkey, Denmark, Sweden..).A majority of it seems to be BBS-stuff. Some of it is clearly scene-related (wares mostly, I think) and some is not. Online services like QuantumLink (which later became AOL) are mentioned, so some of the graphics could have apperared there. Sometimes the graphics were released as executable files, like CG-Slides. And perhaps some of the graphics were made offline and not part of any scene at all, who knows?These graphics were almost certainly typed by hand, character by character, on a Commodore 64/128. No mouse, and maybe not even basic copy paste functions. Although I call this PETSCII graphics, the BBS-world prefers the term C/G, which is short for either Color Graphics, Commodore Graphics or Character Graphics. More on that towards the end. On screens and ads The opening screens of a BBS are sometimes called ‘on screens’ on the disks, so I’ll go with that. Some of the images below are are probably ads posted on other boards – it’s hard to say. If you want more of these, you can search the archive for BBS.Note that the captions contain links (in bold text). Torture Chamber by Slickforce Texas 64 by The Wave The Grand Illusion by James Bond 007? Normal Place The Police Station by Omega Factor Jazz Club by Morrissey Music Emprium by Omega Factor Time Warp by Omega Factor Lost Planet by Omega Factor Nutt House by ][, 1989 New Age BBS by Omega Factor In Living Color In Living Colour Aftermath by Eli 1991 Member’s only by Thinktank 1990 Diamond Back by Thinktank By DH Totally Insane Warez by Vector Newage BBS by Keytapper Dungeon of Domination, maybe by HC 1992 Catastrophic Failure by Thinktank Multiscreen elite There’s a handful of multiscreen graphics for scene boards, listed on CSDb as either illegal or warez related. I’ve stitched them together as single images, and they remind me a lot of ANSI graphics from the early 1990s. In fact, even in contemporary ANSI it’s quite common to see these angry faces, skulls and swords. The Dungeon by Chameleon, 1992. Either this or this. Hell by Dog, 1991. Maybe this South of Heaven by Chameleon Mysts of Avalon Mystic Cavern by Spades Design Life sucks, abandon all hope Yeah let’s head deeper into the teenage darkness! Life Sucks by Rambosmurf Abandon all hope by Styles Devil by Morrissey By Omega Factor By Keytapper By Animal Iron Maiden Powerslave by Hammer Joe Subs and sysops Bulletin boards are often organized in subs (sub boards) for things like music, art, sports and movies. Some of the subs are open to anyone, whereas others are more closed, like an elite sub. Artist’s sub by Power Station Music sub at Houses of the Holy BBS Sports sub at Cob’s Corner by Thinktank Elite sub at Cob’s Corner by Thinktank Movie sub at Members Only BBS by Thinktank 90’s music sub at Members Only BBS by Thinktank The BBS called Cob’s Corner had a sub called War. This was the only place where vulgarity and insults were allowed, but in the war sub, everything was allowed. It’s an interesting idea to keep the crap locked away, easy to avoid. I wonder how well it worked.. The war sub at Cob’s Corner by Tinktank. Unfortunately cut off at the end. The owner of the BBS is the sysop. At the time, they would’ve had a dedicated computer in their room to run the BBS on, since the C64 can’t really do more than one thing at once. When you logged into their BBS they could follow your every move on the screen, which is actually kind of creepy? I had a small BBS in the 1990s and I was sometimes a creepy observer, because honestly I was happy that someone called. But yeah, big happy sysop is watching you! Sysops, like modern day social media, wanted their users to be active. They wanted you to call often, post messages and upload stuff to keep the BBS active. If you were only downloading things, you would be called a leech, or maybe even a lamer! By DH By Lord Catavision Possibly by Elwood By Spades When you paged the sysops for a chat and they were not around, you’d be greeted with stuff like this, (and more exy stuff – search for sysop in the archive). Possibly by Aaron Hightower (example image in Digital Paint 2.0) Users navigate the BBS with keyboard commands at a prompt, and the commands are typically listed in various menus. Here’s how that would look at Catastrophic Failure, which seems to have been a hacking/wares BBS in Florida. Kids stuff Okay, we’ve had enough of the dark stuff for now. Let’s look into the more naive stuff! There is certainly no shortage of comics, cartoons, dragons and spaceships on these disks. Calvin by Chameleon Smurf gear by Rambosmurf By BTK, 1991 By Omega Factor By Cronos By Omega Factor By Omega Factor By Omega Factor By Dragonslayer, 1986 By Impact? Ok, perhaps some darkness snuck in there. If you want more in this vein, search the archive for comics, cartoon, Roger Rabbit, TMNT, castle, pirate, Doctor Who, Star Trek, Ghostbusters, Iron Maiden, Simpsons… Multi-screen graphics by Dog, 1991 Robot by Hammer Joe, 1987 It’s worth remembering that these images are after-constructions. They are 2-3 screens high and neither the artist nor the viewer could see the full image. Bad proportions are understandable.By the way, I found a fun example of the divide between toughness and innocence. Someone called Snoopy ran a BBS called Snoopy’s House together with his co-sysop Heavy Metal. It had a cute Snoopy PETSCII. But it seems like the BBS changed its name into something slightly more sinister… DICTATORS OF DEATH! With suitable graphics. My guess is that Heavy Metal pushed Snoopy to the dark side, but who knows. Hey Snoopy, if you’re reading this, tell us your story. Snoopy’s Doghouse by Omega Factor Dictators of Death by Omega Factor Holiday greetings There is a similar innocence to the holiday greetings. It seems they were around on scene boards as well, which surprised me somehow. Wise BBS, possibly this, 1989 Inner Circle by BY, 1990 By CK Here you can see an example of re-use, which was common on the boards. The graphics from Xenet BBS is based on the one from Inner Circle. Politics There is not much typical politics on the disks, but.. By Thinktank, 1992 By Thinktank Funky type By Shoeshine Boy, 1988 By DarkWing Abstracts and patterns By Shoeshine Boy, 1987 By Shoeshine Boy, 1987 By Omega Factor By Styles Pixel style Contemporary PETSCII often uses dithering techniques that makes it similar to pixel art. There is not much of that on these disks, but some. By The Shark Miscellaneous By Dockter Delirium Tremens PH.D, 1986 By Mario Lanza By Slickforce Member’s Only elite sub by Thinktank By Thinktank By Thinktank By Thinktank Page 1/8 of Zarkon Joe by Thinktank By Keytapper Sequential vs static You could say that all these graphics were effectively animations back in the day, because the graphics were drawn sequentially on the BBS, character by character. The speed depends on the modem, which at the time was between 300 and 2400 BPS. You can compare the speeds in this video.Offline, there were other options. I found two programs on the disks that I used: CG Viewer (very slow) and “CG Edit” (faster). I also used Petvjuscii (2003) which is really fast, and C/G Animator (1989) where you can set the speed yourself in BPS. I also used SEQ Viewer (1997) that actually shows the graphics as static images (and is also the only program I’ve found that loads PRG-files).Unfortunately, the graphics don’t look the same in all these programs. Sometimes there are small errors, sometimes big. Sometimes you don’t know. This was frustrating in the capturing process, to say the least, but sometimes it creates rather beautiful data trash. I don’t know what causes this, but I’ve heard that there are different ways to store and retrieve PETSCII data. I dunno. There are still files that I didn’t manage to capture, so if you’re a PETSCII PRO, get in touch. Sherlock Holmes in good shape T-bone in lowercase instead of uppercase Trash earth, trashed Teenage mutant noise turtle Ice Face Animation I’ve been fascinated with these sequentially displayed graphics ever since I saw Poison’s demos some 20 years ago. They were made with the so-called notemaker software Letter Noperator. Raquel Meyers and others in my demogroup got really into it, did things like this, and released Movie Noperator. Raquel still works with performances in this field. And in fact, we are just about to have a Noperator conference. :-)Anyway, these works are not just linear streams of characters. They use control characters for cursor movements, toggling upper/lowercase, clear screen, etc, to create animations. It’s not unique to the C64 – it has probably been made on terminals since forever, and there are ASCIImations, ANSImations and break messages, for example.Most of the animations on the disks are not very interesting. There are a lot of stick figures in silly adventures that are hard to follow. Some of them are extremely long, I think the longest one is almost 20 minutes (although running very slowly). There are a few more “scene-ish” animations, like Chameleon’s work for Incurable Addicition below. Here is a long video with some of the animations from the archive. The list of animations is in the description of the video. Artists These are tags and artist names that I’ve identified, but there are definitely uncertainties and people left out by mistake. Feedback appreciated. Bold text are links to CSDb, which suggests a scene-relation. I’ve included tag or name in the filenames for searchability.][ = maybe Infernal, ]<]) = KD (just my guess), Alcatraz1, AceMan, Animal, Apeman, Axis, Batman, BT, Billy the Kid (BTK), Buckwheat, BY, Chameleon (Cham), Chuckisoft, CK = maybe Copkiller but more likely Captain Kenby (Ken Nakatsu), Cleetus, CN, Comteacher, Cronos, Crow, Cthulu, Dan Levine, Dansan, Dark = maybe Darkwing, Deaks, Deann’s Dawn9 (maybe not a name?), DEF of Toga, Defcon, Digahole (DGH), D. Ferrari (DF), DH, Dockter Delirium Tremens Ph.D, Dog, Dog of War, Dokken, Drakamen Aveng, Dragonslayer (DS), DW, Edward T.H., EL = maybe Elmynster (aka Elminster), Eli, Elwood, Exel is possibly this, FP, Game Gorilla, George Jetson, GD, Gregg Sperling, Grey Stalker, Hacksaw (aka Kyle Cantin) maybe here, HC, Hammer Joe (HJ), HK, Iceman, Ickabod, IM, Impact, Incubus, infinity, Iron Lifter, Jed, Jim Isaacs, Joe Weider, Jon Sy, Kez Iban, Kajun, Keith, Keith Nelson, Keytapper (KT), Ladybug, Lightnin’, Lord Catavision (LC), Lethal, Link, Lucifer, Mad Dog, Mario Lanza, Mark Ad II, Matthew Joseph Hill, McCoy, Megadave (DHG), Mike Wood, Mister X, Night Ranger (NR), Omega Factor (OF, ().F.), Paul McAleer (PM), Pegasus, Power Station, Preacher, Quicksilver (QS), The Ram, Rambosmurf, Ray (Kathy Ray Smith, according to Barracuda), Rev Bud, Rudeboy (RB), RD, Red Blazer, RF, Rico, Rod S, RS Software, Ruffian, RW, Shoeshine Boy (SB), The Shark (SHK or T SHK), Silver Foxx, Skoal Keep, Slickforce (SF), Socks, Sonny, SP, Space Kase, Spartan, Sttick, Styles, TA, The American Eagle (TAE, possibly only a BBS-name), The Artists Guild (T.A.G.), T-Bone, TG, TH, Thinktank (Think, aka Tankanimation), TK, Twilyte (Lyte, TLT aka Tragedy TRAG), TofA, TP, Trister, Ture Seven (aka Ture 7), Unca Scrooge (Unca), UY, Uzzy, Vector maybe this, Vision (short for Visionary?), Visionary (Viz), Wangbar, Warp Sled, The Wave, The Wolf, Xray, Yoda, Zeph, Zodiac maybe this.(psst, maybe “someone” should add Lord Catavision and Yoda to CSDb?) Groups and releases There were apparently groups dedicated to PETSCII graphics, like C/G Design with members like AceMan and Ture Seven. They would have been contemporary with early ANSI art groups like Aces of ANSI Art. There are not many traces of C/G Design, and eventually they turned into the group Second Dimension with PETSCII-artists like Ruffian, Tragedy (aka Twylite) and Vizz. In recent years, the group has started to release C64-demos again.Inspiral Design is another group that has quite a few works on these disks by artists lik Chameleon, DOG, Lethal, Night Ranger, Silverfoxx and Visionary. The group was not CSDb, so I added it. It seems like they were mostly based in New York, and some of the members were later in the hacker/cracker group Robert Morris Jr. Computer Club. By Ture Seven By Twilyte Second Dimension and Galaxy High by Ruffian AISA was a strange find. It’s short for Atlanta Image Sysop Association, which makes you curious, doesn’t it? The sysops of Magoo’s Mansion and Hanger 15, both in California, were both members.PETSCII is not known to be released as packs or collections, but there are a few examples on the disks. Shoeshine Boy, from Alameda CA, compiled Picture Disks with various artists (1987-1988), and Paul McAleer’s made a slideshow with his own stuff called Lo-Res Graphics. It’s not the best PETSCII ever, but the Picture Disks are helpful because they are dated and artists are credited. Boards Here’s a compact list of names that I’ve identified as BBSs. There are probably more. Search the archive for BBS-name to see its graphics. Links lead to CSDb, ie there is a scene connection. (I’ve uploaded graphics to them, unless the page was locked.)128th Precinct, Acheron (sysop: Da Boss), Aftermath, Aliance #3 (name unsure, 619"
