["https://text.npr.org/g-s1-50251"]
title = "Abel Selaocoe: Tiny Desk Concert"
full_description = '''NPR > Tiny Desk Abel Selaocoe: Tiny Desk Concert By Tom Huizenga Monday, March 3, 2025 • 5:00 AM EST Abel Selaocoe arrived early for his Tiny Desk performance so he could pop into a studio to talk with NPR's Morning Edition. That's where the versatile South African cellist and vocalist told the touching story of how he first got the hang of his instrument. Unable to afford a real cello, Selaocoe drew the strings of the instrument on paper, then pasted it to his chest to practice the fingerings.These days, he tours the world offering his singular synthesis of global, jazz and classical sounds, always remembering his roots, even when collaborating with the likes of Yo-Yo Ma.Selaocoe's adroit bowing and percussive fingering gives the cello a vast color palette, with sounds of flutes and drums. His vocalizing, mostly in the Sesotho language, includes a kind of gravelly throat singing in which two or more pitches are produced, heard in the opening song which he dedicates to mothers and strong women who "[hold] the knife on the sharp side."French baroque meets contemporary South Africa in "Les Voix Humaines/Tsohle Tsohle," where Selaocoe braids music by Marin Marais around tender singing. And he closes with an improvisation, noting that he prefers "people who don't write the script and re-read it again." The tune begins in a flurry of bowed arpeggios, like white caps on the lake, and evolves into plucked strings with metal clips attached, reminiscent of thumb pianos.Selaocoe has indeed written his own distinctive "script." In classical music, there are those who follow age-old traditions — and that's just fine. But then there are those, like Selaocoe, who create brand-new traditions.SET LIST"Ka Bohaleng"Marin Marais/Selaocoe: "Les Voix Humaines/Tsohle Tsohle""Dinaka"MUSICIANSAbel Selaocoe: cello, vocalsTINY DESK TEAMProducer: Tom HuizengaDirector: Joshua BryantAudio Technical Director: Josephine NyounaiHost/Series Producer: Bobby CarterVideo Editor: Kara FrameVideographers: Joshua Bryant, Maia SternAudio Engineer: Josh NewellProduction Assistant: Dora LevitePhotographer: Michael Zamora Tiny Desk Team: Lars Gotrich, Ashley PointerExecutive Producer: Suraya MohamedSeries Creators: Bob Boilen, Stephen ThompsonVP, Visuals and Music: Keith Jenkins'''
