full_description = "NPR > Music Musicians’ album protests changes to UK copyright law Friday, February 28, 2025 • 4:45 PM EST More than 1,000 artists including Kate Bush, Annie Lennox and Billy Ocean have created an album of songs recorded in silent music studios to protest proposed changes to UK artificial intelligence copyright laws.NPR’s Chloe Veltman reports.This article was originally published on WBUR.org. NPR > Music Musicians’ album protests changes to UK copyright law Friday, February 28, 2025 • 4:45 PM EST More than 1,000 artists including Kate Bush, Annie Lennox and Billy Ocean have created an album of songs recorded in silent music studios to protest proposed changes to UK artificial intelligence copyright laws.NPR’s Chloe Veltman reports.This article was originally published on WBUR.org."
