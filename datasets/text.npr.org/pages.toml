["https://text.npr.org/nx-s1-5307159"]
title = "The 2025 Oscars: Heavy on speeches, light on politics, and one big winner"
full_description = '''NPR > Oscars 2025 The 2025 Oscars: Heavy on speeches, light on politics, and one big winner By Linda Holmes Monday, March 3, 2025 • 12:44 AM EST Heard on All Things Considered At Sunday night's Oscars, there was one big winner, a lot of heartfelt speeches, and not much politics.Here are eight things to know:A lot of films were recognized, but it was Anora's night. Related Story: NPR Related Story: NPR Director Sean Baker's previous films, including Tangerine and The Florida Project, have been indie darlings, but they didn't win the biggest awards. Anora, the story of a sex worker who marries a former client and gets mixed up with some Russian oligarchs, became his breakout on the Oscar stage. Baker won the award for best original screenplay, then one for editing, and then one for best director. Mikey Madison won best actress, then the movie capped off the night with the win that by then seemed inevitable: best picture. Because Baker is a producer, that best picture win meant he personally won four Oscars in one night, which ties him with a fairly well-known filmmaker named Walt Disney. (Bong Joon-ho accepted four for Parasite, but one was for best international feature film, which is officially given to the entire film, not the director.)With that said, eight out of 10 of the best picture nominees — all but A Complete Unknown and Nickel Boys — went home with something.There was only one real surprise.Most of the races went as expected: Kieran Culkin as best supporting actor for A Real Pain, and Zoe Saldaña as best supporting actress for Emilia Pérez, Adrien Brody as best actor for The Brutalist — all these folks had done a lot of award-winning leading up to Sunday night. The one surprise came late in the evening when Mikey Madison won best actress for Anora over Demi Moore. It's a modest surprise, given that Madison had actually been an early favorite in the category. But Moore had put together a heck of a run through the precursor awards for her turn in The Substance, and she was the favorite. In the end, though, Madison got the big win.People talked a lot — but rarely about politics.The telecast started at 7 p.m. Eastern, which is on the early side. That left time for it to run long without getting horrifyingly late. And that's what happened. The ceremony felt loose and personal, leaving more room than there is in most years for presenters and winners to talk. And they did talk — about their work, about other people's work, and about their appreciation for their craft. (Maybe most notably Adrien Brody, who filibustered in an unintentional salute to the 3.5-hour running time of The Brutalist.) But there was not much mention of politics, despite politics being front and center in the minds of so many. Daryl Hannah, presenting, said "Slava Ukraini," but most winners did not take the opportunity to speak explicitly to the domestic or international political moment — with a big exception.The winner for best documentary feature still has no U.S. distribution. Related Story: NPR Related Story: NPR In January, Justin Chang wrote that No Other Land "brings us into Masafer Yatta, a community of Palestinian villages in the Israeli-occupied southern West Bank, which is being bulldozed by the Israeli military to make room for a tank training ground." He also said the film, made by a team of Palestinian and Israeli filmmakers, was "the most powerful nonfiction film [he] saw in 2024." Then, as now, it lacked U.S. distribution; as of mid-February, the filmmakers were self-distributing to a few movie theaters. The filmmakers spoke powerfully from the Oscar stage about not only the destruction depicted in the film, but also their frustration with U.S. foreign policy. It is now almost certainly the most decorated film of last year not to be widely available in the United States.Rarely does a movie go through as much of a change in fortunes as Emilia Pérez. Related Story: NPR The Netflix story of a transgender cartel boss once looked to be on track to deliver the streamer its first best picture win. It received a stunning 13 Oscar nominations, despite reviews and reactions that never quite matched the reception the film received at Cannes. But then, lead actress Karla Sofía Gascón saw her chances scrambled after a scandal erupted over derogatory comments she'd made online several years ago about Islam, China and other topics.Zoe Saldaña's history in Hollywood goes back more than 20 years and includes time spent in the Star Trek universe, in the Marvel Cinematic Universe and in Crossroads with Britney Spears. That experience may be how she weathered the negative publicity and won an Oscar, as did the original song, "El Mal." But the movie itself largely vanished from the best picture conversation, and Gascón from the best actress race, where she was the first openly transgender performer ever nominated in any acting category.Nobody missed the songs. Youtube Video The ceremony this year did without the usual performances of the best original song nominees. Instead, there was a killer opening sequence featuring Ariana Grande and Cynthia Erivo singing a medley of "Somewhere Over The Rainbow," "Home" (from The Wizˆ), and (of course) "Defying Gravity." There were also some old-school Oscar numbers: a James Bond tribute featured singers Lisa, Doja Cat, and Raye doing some of the best-known Bond themes, while Queen Latifah stepped out to sing "Ease On Down The Road" in honor of Quincy Jones. In a year when the original song nominees were a bit of a "ragtag crop" (there was no "I'm Just Ken" or "What Was I Made For?", no "Naatu Naatu" or "Husavik"), it was wise not to rely on them to enliven the ceremony.Hosting is still very hard; Conan was up to it.Conan O'Brien didn't have the smoothest start, although following the Erivo/Grande opening would have been difficult for anybody. He got his feet under him quickly, and by the time he got to his own very silly opening number (called, sarcastically, "I Won't Waste Time"), he was turning into the comfortably weird Conan many of us know. A gag featuring a Dune sandworm playing musical instruments had the same absurd, bad-talent-show quality that his late-night show always did — in the best way. He also commented later in the evening that perhaps people liked Anora because they wanted to see "someone stand up to a powerful Russian," which was probably the closest thing we saw to a straight-up Donald Trump joke.The structure left a little more time to speak from the heart. Related Story: NPR This year's approach to some of the major categories was to have the presenters speak personally about each nominee. That could be a dull disaster, but it got off to a great start with Robert Downey Jr. speaking earnestly about his admiration for Jeremy Strong and the other supporting actor nominees. And they didn't only use this format for actors. They did it for the costume designers, and they did it for the cinematographers as well. When was the last time the Oscars gave us actors speaking from the heart about their appreciation of the cinematographers in their nominated movies? Related Story: NPR The evening was effusive with earnestness, whether it was these presentations, Andrew Garfield telling Goldie Hawn how much his mother loved her work, or Zoe Saldaña's emotional speech about what it meant to her to win an Oscar for speaking and singing in Spanish.The whole ceremony always feels long, and it remains self-indulgent. But all other things being equal, it goes down easier when people have enough room to be grateful and compliment one another. Transcript JUANA SUMMERS, HOST: The 97th Academy Awards were handed out yesterday in Los Angeles. The ceremony was both an earnest celebration of the art of cinema and a gaudy tribute to Hollywood.(SOUNDBITE OF SONG, "DEFYING GRAVITY")CYNTHIA ERIVO AND ARIANA GRANDE: (Singing) Just you and I defying gravity.SUMMERS: And if you missed this year's Oscars, don't worry. Here to give us the night's biggest takeaways is NPR's resident pop culture expert and the host of Pop Culture Happy Hour, Linda Holmes. Hey, Linda.LINDA HOLMES, BYLINE: Hello.SUMMERS: All right, Linda, I got to confess - I did miss the Oscars. You're going to need to catch me up a bit. Who was the big winner and who came up short?HOLMES: So the big winner was "Anora," an independent film about a sex worker who marries a former client and gets mixed up with a bunch of Russian oligarchs.(SOUNDBITE OF FILM, "ANORA")MIKEY MADISON: (As Ani) I love my husband.KARREN KARAGULIAN: (As Toros) You do not know this guy.MADISON: (As Ani) We are consenting adults.KARAGULIAN: (As Toros) If you think this is going to be allowed, you're dead wrong.MADISON: (As Ani) Do not touch me.HOLMES: The film won best picture. The lead, Mikey Madison, won best actress, and the writer and director, Sean Baker, won for his direction, his script and his editing, so a big, big night for that movie. Probably coming up short, you would say "Emilia Perez," a Netflix film about a transgender cartel boss.(SOUNDBITE OF SONG, "EL MAL")KARLA SOFIA GASCON: (As Emilia Perez, singing in Spanish).HOLMES: It had gotten 13 nominations. I think Netflix hoped it would win them their first best picture Oscar, but it lost a lot of steam over some offensive tweets that had resurfaced from the lead actress, Karla Sofia Gascon. And it ended up winning best supporting actress for Zoe Saldana, best original song, but it did not perform like Netflix hoped it would when it got all those nominations.SUMMERS: I understand that there was also a new host. How did Conan O'Brien do?HOLMES: You know, Conan was good. I think the more he settled into being his oddball self, the better he was. I think he won the crowd over as the night went on. You know, he had a little gag with what was supposedly a sandworm from "Dune," who was playing various musical instruments. It's the kind of thing he used to do as a "Late Night" host. It was fun to see that. But he also had a really nice and very funny moment with some LA firefighters - that's obviously in recognition and appreciation of their work on the fires in LA recently.(SOUNDBITE OF THE 97TH ACADEMY AWARDS)CONAN O'BRIEN: And finally, Pasadena Fire Department Captain Jodi Slicker.(CHEERING)JODI SLICKER: It's great to be back with Conan. Usually when he calls, he's stuck in a tree.O'BRIEN: OK.(LAUGHTER)HOLMES: And those fires did kind of recur a few times through the ceremony as a theme, as you would expect 'cause when something important is in the news, it often will show up in the Oscars.SUMMERS: Yeah. So I'm curious - were there other times when current events kind of broke their way into the ceremony or were brought up by people on stage?HOLMES: Well, probably the biggest had to do with the documentary feature winner which was a film called "No Other Land," which is made by a team of Israeli and Palestinian filmmakers, and it's about the destruction of Palestinian communities in the West Bank. That team spoke really passionately onstage about the crisis that the film is covering.(SOUNDBITE OF THE 97TH ACADEMY AWARDS)YUVAL ABRAHAM: We live in a regime where I am free, under civilian law, and Basel is under military laws that destroy his life and he cannot control. There is a different path, a political solution, without ethnic supremacy, with national rights for both of our people.HOLMES: And he went on to say that U.S. foreign policy is worsening the conditions that the film is talking about. That got applause from the audience. Interestingly, that film still does not have U.S. distribution, presumably because of the subject matter. We will have to see if that changes. But yeah, that was about it for sort of current events. Conan O'Brien had sort of one Donald Trump joke, and that's about it.SUMMERS: Interesting. OK, so just, like, big picture, how would you sum up last night's show just as a watcher? How was it?HOLMES: Well, I really enjoyed it, actually. It was a pretty earnest and talky ceremony. In some of the categories they gave the presenters time to talk individually about nominees. There were some nice moments that came from that. The ceremony is always too long. It's always somewhat self-indulgent by nature. But I do think on the whole, it had an intimacy to it that is sometimes missing from a more efficient, you might say, or a splashier ceremony, so I actually enjoyed it.SUMMERS: That is NPR's Linda Holmes. Thanks, as always.HOLMES: Thank you, Juana.(SOUNDBITE OF ADRIAN YOUNGE SONG, "STEP BEYOND (FEAT. BILAL AND LAETITIA SADIER)")'''
year_published = 2025
