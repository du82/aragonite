["https://text.npr.org/nx-s1-5316894"]
title = "Celebrating Mardi Gras with New Orleans clarinetist and vocalist Doreen Ketchens"
full_description = '''NPR > Music Interviews Celebrating Mardi Gras with New Orleans clarinetist and vocalist Doreen Ketchens By Tonya Mosley Tuesday, March 4, 2025 • 11:16 AM EST Heard on Fresh Air Transcript TONYA MOSLEY, HOST: This is FRESH AIR. I'm Tonya Mosley. And if you're ever in the French Quarter in New Orleans, chances are you've spotted my guest today, clarinetist and vocalist Doreen Ketchens. For over 30 years, she's performed on the corner of Royal and St. Peter Street, four days a week, sometimes 12 hours a day, with her band, Doreen's Jazz New Orleans.(SOUNDBITE OF MUSIC)DOREEN'S JAZZ NEW ORLEANS: (Singing) Now, when the saints go marching in. Well, when the saints...MOSLEY: Doreen Ketchens has many nicknames - Lady Louie, Queen Clarinet and Miss Satchmo. Nods to her passionate performances of Dixieland and traditional jazz and for her ability to hit and hold high notes for long periods of time like the great trumpeter Louis Armstrong. Ketchens has performed for four U.S. presidents - Bill Clinton, George H. W. Bush, Ronald Reagan and Jimmy Carter. And initially, she played classical clarinet before her late husband, Lawrence Ketchens, introduced her to jazz while the two were students at Loyola University.Lawrence was an accomplished musician in his own right, too. As part of Doreen's band, he played the tuba, valve trombone, drums and piano, becoming a major attraction for his ability to play the sousaphone and drums at the same time. A few years ago, Ketchens fulfilled her dream of performing at the Kennedy Center. She's also played with orchestras around the world. Doreen Ketchens, welcome to FRESH AIR.DOREEN KETCHENS: Thanks for having me.MOSLEY: I want to offer my sincerest condolences on the loss of your husband, Lawrence, who just died this past January. And I had the pleasure of going down the rabbit hole of watching your performances, and aside from being utterly captivated, I was also just taken by what felt like magic watching the two of you performing together. Are you still performing?KETCHENS: Yep. I mean, I don't want to get haunted for the rest of my life, you know? That's what he'd do (laughter). He used to always tell me, you know, you've got to play no matter what. So that's what I'm doing. And it's working. It's working. I get strength from just thinking about the times he's been in the audience, you know, and giving me a nod, you know, one way or the other.MOSLEY: It seemed like there was such a great love between the two of you, and your love language was the music. You all performed together for many decades, and I think maybe a beautiful way to start our conversation is to actually hear a little bit of the two of you. I watched this video of you two performing for the New Orleans jazz station WWOZ. And there you are playing the clarinet and singing, and Lawrence was playing sousaphone and the drums at the same time. I don't actually think I've ever seen that in my life. I was thinking, how? Can I play a little bit of that performance?KETCHENS: Yes, please.MOSLEY: The song is "House Of The Rising Sun."(SOUNDBITE OF ARCHIVED RECORDING)KETCHENS: (Singing) There is a house in New Orleans they call the Rising Sun. He's been around all the many young lives (ph). And now, I know I'm one. My mother, she was...MOSLEY: That was my guest today, Doreen Ketchens and her late husband, Lawrence, playing "House Of The Rising Sun." Doreen, what a remarkable performance. I mean, as I mentioned, Lawrence is playing the drums and blowing into that sousaphone - which is a type of tuba - at the same time. How did he figure out that he had that talent?KETCHENS: We had drummer problems. And the drummer didn't show up, and he was tired of it. You know, and we were on the street. He said he wasn't that good anyway. I bet you I could play just as good as him and play the tuba. And so he sat behind the drums. And he took one stick in his left hand. And he just started to do it. I mean, just like that, and it was there. He can't play rolls and stuff like that. So he does the inflections, you know what I mean? So if you're just listening to the drummer, you know, there's a lot of space in there. But if you're listening to the group, then he fills in all of these spaces that you would normally hear the drummer do. It's just amazing, you know? But necessity is the mother of invention, and he invented the tuba drummer (laughter).MOSLEY: One thing I noticed is that you've got a growl that, you know, it's not only present in your singing voice, but we also heard it while you were playing the clarinet. How do you do that? Like, you make your clarinet growl.KETCHENS: People have asked me about that growl a lot, so I did it - actually, I did some videos on it on YouTube during the pandemic when I was going absolutely crazy 'cause I couldn't go out and play. But there are two ways of doing a growl. There's one with the throat, you know, (vocalizing) like that, like you're gargling. And there's another one with the tongue, like a Spanish R, you know? And both of them basically sound the same when I do them. But you pick one, you know? And I picked the Spanish R because I thought the transition to and from was smoother. So - and that's how I do it. I just (vocalizing). That's how I do it. That's it.MOSLEY: How did you two start playing on the streets at the French Quarter?KETCHENS: Well, we were away in Connecticut. We met at Loyola, and we had really good scholarships, but the - you know, when you get to be a junior, you know, well, tuition continuously goes up, whereas your scholarship stays the same. So in my junior year, you know, our junior year, we asked for more money. And, you know, universities, they don't really invest in, you know, student juniors that are already there, you know? And it hurt my feelings, so I started applying to different places and got accepted into a few. But the University of Hartford, The Hartt School of Music, you know, had the most money, and I didn't realize the cost of living in Hartford was a whole lot more.KETCHENS: But it still worked out OK. And I went there, and I stayed on campus for the first semester, didn't like it. So I found me a nice apartment off campus for the following semester, and I stayed there, and it was good until they stole my car. The stole - I stopped in to take a nap, And when I came out, there was nothing there. My car was gone. My clarinet was in my car 'cause I was...MOSLEY: Oh.KETCHENS: The clarinets were in my car because I was taking a nap. You know, I thought I'd just hop on back. But anyway, they eventually found my car, and the only reason - they took everything out of there except the clarinet because the the latch on the case came loose, and there were two clarinets in there. And so when they picked it up, all of the pieces just, you know, sprawled all over the trunk. And so they didn't bother, you know, picking them up or nothing. And so my clarinets were intact, and - which was cool because, you know, that was the biggest thing that was in the car.MOSLEY: Right.KETCHENS: But once they stole my car - and Lawrence was still here. He was going to Xavier at the time. And he said, man, she can't be out there by herself. She's too far, and she's alone. I got to go. And while we were there, he got us some work with this company called Landerman Agency. And they threw parties, you know, corporate events and stuff like that. And, you know, it was nice that they had this exclusive New Orleans band. And so, you know, we worked that way. And that's how I started practicing, basically, you know, just playing the music. I just played melodies in the beginning. But after a while, you know, I started, you know, improvising just a tiny bit.And so we were in Connecticut, and we're doing pretty good, and then Lawrence's father dies. And actually, his father was sick and we went down and we got married there because, you know, he wanted his father to see him married. I mean, we were going to get married anyway, but we pushed it forward at that point, and then his father died. And a month and a day later, my father died, and, you know - well, you don't know - but I'm the youngest of three, and he's the youngest of three, and he had two sisters, and I had two brothers.And we were caretakers, you know? I mean, we're the ones that took care of, you know, our parents and stuff like that. So we didn't want to be so far away. We wanted to try and be here for as long as we could with our mothers, you know, as they transitioned from having partners to not having any at all. And so we came down, and we started doing whatever we could, you know, to make ends meet.And we were walking in the French Quarter one day, and we saw some people playing on the street, and Lawrence said, hey, look, we could do that. I'm like, man, you must be crazy. I've been in college. I'm not playing on a street, you know? But love makes you do crazy things, and, you know, we went out there, and we played, and I was OK because we were together, you know, and got a little following, you know? People liked us. We were young, cute and all that stuff. And...MOSLEY: I mean, three decades...KETCHENS: ...You know, the music was pretty good.MOSLEY: Right.KETCHENS: Actually, yeah, it's approaching four, you know? Yeah.MOSLEY: I love watching the videos of you and your band. And I was just thinking about that experience of seeing, basically, like, a concert, these expert musicians, in a accessible space when you're out on the street. But was it always so welcoming out there? I know it can be, like, notoriously competitive among musicians jockeying for space when you're a street musician.KETCHENS: Oh, yeah. I mean, but we - you know, sometimes we sleep on the spot. I mean, you do what you have to do, you know? And it was the two of us, so it was easier to fight. So, you know, it was kind of set up for victory, you know, as far as - you know, as long as we weren't lazy, and, you know, you had to deal with the people who - for some reason, they moved to the French Quarter and were quiet. I don't understand that at all. But they called the police.MOSLEY: Oh, you mean the people who live - yeah.KETCHENS: Yeah.MOSLEY: Yeah, the people who live there.KETCHENS: Yeah, man. You know, they'd say, I don't want ot hear your - I don't want to hear that music. And like, bro, you're in the French Quarter, you know (laughter)? What do you expect, you know? But yeah, so And then, you know, you got to deal with police who are having a bad day, you know, and stuff.So yeah, it gets kind of challenging, but, you know, it's fun. And it was fun creating together. It was fun growing together. It was fun just making music and, you know, making people stop. I mean, because, you know, street shops are different. You know, you go out there, and you set up, and most people think, you know, you're on drugs or something's wrong with you.And so they pass by you or decide they're going to pass by you. But then you start playing, and they stop. And, you know, you're on the street. You got to make people stop and listen and then give you money, you know? We're extremely blessed because, you know, we always seemed to find that combination that makes people say, oh, my goodness, and they still do it. And it's grand.MOSLEY: Doreen, let's take a short break. And if you're joining us, my guest is clarinetist and vocalist Doreen Ketchens. We'll continue our conversation after a short break. This is FRESH AIR.(SOUNDBITE OF MUSIC)MOSLEY: This is FRESH AIR. And today, I'm talking with jazz clarinetist, vocalist and New Orleans institution Doreen Ketchens. She's known for her performances of Dixieland and traditional jazz, which has earned her the nicknames Lady Louis, Queen Clarinet and the female Louis Armstrong for her exceptional range and powerful high notes.You know, to watch you perform, you really are. You're, like, putting your whole body into it. Your eyes are closed, and, I mean, I guess that's not unusual, I mean, when you are, like, intensely focused on your instrument. I've heard you say when you're playing, you're constantly digging for more information within yourself, and I was like, wow, really taken by that, but also wonder more of what you mean.KETCHENS: I mean, just like with anything else, you know, if you're a parent, you want to be a better parent than your parent, even though you had a great parent, you know? But I just don't want to fall into a rut. People are growing up listening to what I'm doing, what I did, and, you know, I want to be above that. It's flattering.KETCHENS: And in some senses, you know, it's insulting because people steal your licks and everything else, and they don't acknowledge it, you know? But it's still - you know, you want to stay ahead of the game. You want to be the best. Louis Armstrong is, like, a big influence on me. And I have listened to - well, I thought up until the other day, actually - I thought I listened to everything that was out there about Louis Armstrong, but there's always something new, you know? But I can hear the same song over that I've heard for hundreds of times and find something new inside of it. It's amazing.MOSLEY: Is there a favorite Armstrong? I know that's like asking, is there a favorite child? But is there a favorite song of his that you love or you go back to often?KETCHENS: Yeah, that is like asking about a child, you know, I mean, 'cause there's some that strike me in certain ways and others that strike me in others. You know, I mean, when you say that, you know, "La Vie En Rose" comes to mind and probably because my daughter hates it (laughter).MOSLEY: Oh, really? Why?KETCHENS: Yeah.MOSLEY: She says...KETCHENS: Yeah. But - and then, you know, she got - she fell in love and stuff like that, and she, like, understood it, you know, and stuff like that. But "La Vie En Rose" comes to mind because, you know, he had a way of doing things, you know, sort of like Nat King Cole. You know, you can hear Nat King Cole singing French and Spanish. It ain't the best French and Spanish, you know, but it's great, you know, because he had that respect, you know, for it. And you can hear Louis do all kinds of different kinds of music, you know, and still know it's Louis first note, you know? I mean, so I just aspire to just be great. And in order to be great, you got to keep aspiring to be great, you know? And...MOSLEY: Do you have your own take on that favorite - on your favorite Armstrong song? And if so, can you play a little bit of it - not the whole thing, but just a bit?KETCHENS: Oh, "La Vie En Rose"?MOSLEY: Yes.KETCHENS: I set myself up for that, didn't I? Let's see.(Playing clarinet).(Singing) And when you speak, angels sing from above. Everyday words seems to turn into love songs. Give your heart and soul to me, and life will always be la vie en rose.MOSLEY: Thank you so much for that. I mean, you're nicknamed all of these names - you know, Lady Louis - for a reason. And that's very clear some'''
