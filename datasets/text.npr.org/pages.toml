title = "Read President Trump's 2025 address to a joint session of Congress"
full_description = "NPR > Politics Read President Trump's 2025 address to a joint session of Congress Wednesday, March 5, 2025 • 1:53 AM EST President Trump Delivers an Address to a Joint Session of CongressDONALD TRUMP: Speaker Johnson, Vice President Vance, the first Lady of the United States, members of the United States congress, thank you very much. And to my fellow citizens, America is back. [Applause]CROWD: USA, USA, USA. Related Story: NPR Related Story: NPR DONALD TRUMP: Six weeks ago, I stood beneath the dome of this capitol and proclaimed the dawn of the Golden Age of America. From that moment on, it has been nothing but swift and unrelenting action to usher in the greatest and most successful era in the history of our country. We have accomplished more in 43 days than most administrations accomplished in four years or eight years and we are just getting started. [Applause] Thank you. I returned to this chamber tonight to report that America's momentum is back, our spirit is back, our pride is back, our confidence is back and the American dream is surging bigger and better than ever before.The American dream is unstoppable and our country is on the verge of a comeback, the likes of which the world has never witnessed and perhaps will never witness again. There's never been anything like it. The presidential election of November 5th, was a mandate like has not been seen in many decades. We won all seven swing states, giving us an electoral college victory of 312 votes.[Applause] We won the popular vote by big numbers and won counties in our country. [Booing]CROWD: USA, USA, USA.DONALD TRUMP: And won counties in our country, 2,700 to 525 on a map that reads almost completely red for republican. Now for the first time in modern history, more Americans believe that our country is headed in the right direction than the wrong direction. In fact, it's an astonishing record, 27-point swing, the most ever.[Applause] Likewise, small business optimism saw its single largest one-month gain ever recorded, a 41-point jump.MIKE JOHNSON: Mr. President. Members are directed to uphold and maintain decorum in the House and to cease any further disruptions. That's your warning. Members are engaging in willful and continuing breach of decorum and the chair is prepared to direct the sergeant at arms to restore order to the joint session. [Applause] Mr. Green, take your seat.Take your seat, sir.AL GREEN: [Off-Mic].MIKE JOHNSON: Take your seat. Finding that members continue to engage in willful and concerted disruption of proper decorum, the chair now directs the sergeant at arms to restore order. Remove this gentleman from the chamber. [Applause] Members are directed to uphold and maintain decorum in the House. Mr. President, you can continue.DONALD TRUMP: Thank you. Over the past six weeks, I have signed nearly 100 executive orders and taken more than 400 executive actions, a record to restore commonsense, safety, optimism and wealth all across our wonderful land. The people elected me to do the job and I'm doing it. [Applause] In fact, it has been stated by many that the first month of our presidency, it's our presidency, is the most successful in the history of our nation by many.[Applause] And what makes it even more impressive is that, do you know who number two is, George Washington. How about that? How about that? I don't know about that list, but we'll take it. Within hours of taking the oath of office, I declared a national emergency on our southern border and I deployed the US military and border patrol to repel the invasion of our country.And what a job they've done. As a result, illegal border crossings last month were by far the lowest ever recorded, ever. They heard my words and they chose not to come, much easier that way. In comparison, under Joe Biden, the worst president in American history, there were hundreds of thousands of illegal crossings a month and virtually all of them including murderers, drug dealers, gang members and people from mental institutions and insane asylums were released into our country.Who would want to do that? This is my fifth such speech to congress, and once again, I look at the democrats in front of me and I realize there is absolutely nothing I can say to make them happy or to make them stand or smile or applaud, nothing I can do. I could find a cure to the most devastating disease, a disease that would wipe out entire nations, or announce the answers to the greatest economy in history, or the stoppage of crime to the lowest levels ever recorded and these people sitting right here, will not clap, will not stand and certainly will not cheer for these astronomical achievements.They won't do it, no matter what. Five, five times I've been up here. It's very sad and it just shouldn't be this way. So democrats sitting before me, for just this one night, why not join us in celebrating so many incredible wins for America. For the good of our nation, let's work together and let's truly make America great again.[Applause] Every day, my administration is fighting to deliver the change America needs to bring a future that America deserves and we're doing it. This is a time for big dreams and bold action. Upon taking office, I imposed an immediate freeze on all federal hiring, a freeze on all new federal regulations and a freeze on all foreign aid.[Applause]DONALD TRUMP: I terminated the ridiculous green new scam. I withdrew from the unfair Paris climate accord, which was costing us trillions of dollars that other countries were not paying. [Applause] I withdrew from the corrupt World Health Organization. [Applause] And I also withdrew from the anti-American UN Human Rights Council. [Applause] We ended all of Biden's environmental restrictions that were making our country far less safe and totally unaffordable.And importantly, we ended the last administration's insane electric vehicle mandate, saving our auto workers and companies from economic destruction. [Applause] To unshackle our economy, I have directed that for everyone new regulation, ten old regulations must be eliminated. Just like I did in my very successful first term.[Applause] And in that first term, we set records on ending unnecessary rules and regulations. Like no other president had done before, we ordered all federal workers to return to the office. They will either show up for work in person or be removed from their job. [Applause] And we have ended weaponized government where as an example, a sitting president is allowed to viciously prosecute his political opponent, like me. [Laughter] How did that work out?Not too good, not too good. [Applause] And I have stopped all government censorship and brought back free speech in America. It's back. [Applause] And two days ago, I signed an order making English the official language of the United States of America. [Applause] I renamed the Gulf of Mexico, the Gulf of America.[Applause] And likewise, I renamed, for a great president, William McKinley, Mount McKinley again. [Applause] Beautiful Alaska. We love Alaska. [Applause] We've ended the tyranny of so-called diversity, equity and inclusion policies all across the entire federal government and indeed the private sector and our military.[Applause] And our country will be woke no longer. [Applause] We believe that whether you are a doctor, an accountant, a lawyer or an air traffic controller, you should be hired and promoted based on skill and competence, not race or gender. Very important. [Applause] You should be hired based on merit. And the Supreme Court in a brave and very powerful decision has allowed us to do so. Thank you.Thank you very much. Thank you. [Applause] We have removed the poison of critical race theory from our public schools. And I signed an order making it the official policy of the United States government that there are only two genders, male and female. [Applause] I also signed an executive order to ban men from playing in women's sports.[Applause] Three years ago, Payton McNabb, was an all-star high school athlete, one of the best, preparing for a future in college sports. But when her girls volleyball match was invaded by a male. He smashed the ball so hard in Payton's face causing traumatic brain injury, partially paralyzing her right side and ending her athletic career.It was a shot like she's never seen before. She's never seen anything like it. Payton is here tonight in the gallery. And Payton, from now on, schools will kick the men off the girls team, or they will lose all federal funding. [Applause] And if you really want to see numbers, just take a look at what happened in the women's boxing, weightlifting, track and field, swimming or cycling where a male recently finished a long distance race, five hours and 14 minutes ahead of a woman for a new record by five hours.Broke the record by five hours. It's demeaning for women and it's very bad for our country. We're not going to put up with it any longer. [Applause] What I have just described is only a small fraction of the commonsense revolution that is now, because of us, sweeping the entire world. Commonsense has become a common theme and we will never go back.Never, ever going to let that happen. [Applause] Among my very highest priorities is to rescue our economy and get dramatic and immediate relief to working families. As you know, we inherited from the last administration an economic catastrophe and an inflation nightmare.UNKNOWN: Yes, yes, yes.DONALD TRUMP: Their policies drove up energy prices, pushed up grocery costs and drove the necessities of life out of reach for millions and millions of Americans. They've never had anything like it. We suffered the worst inflation in 48 years, but perhaps even in the history of our country, they're not sure. As president, I'm fighting every day to reverse this damage and make America affordable again.[Applause] Joe Biden especially let the price of eggs get out of control. The egg price is out of control and we're working hard to get it back down. Secretary, do a good job on that. You inherited a total mess from the previous administration. Do a good job. [Applause] A major focus of our fight to defeat inflation is rapidly reducing the cost of energy.The previous administration cut the number of new oil and gas leases by 95 percent, slowed pipeline construction to a halt and closed more than 100 power plants. We are opening up many of those power plants right now. [Applause] And frankly, we have never seen anything like it. That's why on my first day in office I declared a national energy emergency.[Applause]DONALD TRUMP: As you've heard me say many times, we have more liquid gold under our feet than any nation on earth and by far. And now, I fully authorize the most talented team ever assembled to go and get it. It's called drill, baby, drill. [Applause] My administration is also working on a gigantic natural gas pipeline in Alaska, among the largest in the world where Japan, South Korea and other nations want to be our partner with investments of trillions of dollars each. There's never been anything like that one.It will be truly spectacular. It's all set to go. The permitting is gotten. And later this week, I will also take historic action to dramatically expand production of critical minerals and rare earths here in the USA. [Applause] To further combat inflation, we will not only be reducing the cost of energy, but we'll be ending the flagrant waste of taxpayer dollars.[Applause] And to that end, I have created the brand-new Department of Government Efficiency, DOGE. Perhaps you've heard of it, perhaps, which is headed by Elon Musk, who is in the gallery tonight. Thank you, Elon. He's working very hard. He didn't need this. He didn't need this. Thank you very much. We appreciate it. Everybody here, even this side appreciates it, I believe.[Applause] They just don't want to admit that. Just listen to some of the appalling waste we have already identified: $22 billion, from HHS to provide free housing and cars for illegal aliens; $45 million, for diversity, equity and inclusion scholarships in Burma; $40 million, to improve the social and economic inclusion of sedentary migrants.Nobody knows what that is. $8 million, to promote LGBTQI+ in the African nation of Lesotho, which nobody has ever heard of. $60 million, for indigenous peoples and Afro-Colombian empowerment in Central America, $60 million. $8 million, for making mice transgender. This is real. $32 million, for a left-wing propaganda operation in Moldova.$10 million, for male circumcision in Mozambique. $20 million, for the Arab Sesame Street in the Middle East. It's a program, $20 million for a program. $1.9 billion, to recently created decarbonization of homes committee, headed up, and we know she's involved. Just at the Last moment, the money was passed over, by a woman named Stacey Abrams.Have you ever heard of her? A $3.5 million, consulting contract for lavish fish monitoring. $1.5 million, for voter confidence in Liberia. $14 million, for social cohesion in Mali. $59 million, for illegal alien hotel rooms in New York City. He's a real estate developer. He's done very well. $ 250,000 to increase vegan local climate action innovation in Zambia.$42 million, for social and behavior change in Uganda. $14 million for improving public procurement in Serbia. $47 million for improving learning outcomes in Asia. Asia is doing very well with learning. I don't know what we're doing. Should use it ourselves. And $101 million for DEI contracts at the Department of Education, the most ever paid, nothing even like it. Under the Trump administration, all of these scams and there are far worse, but I didn't think it was appropriate to talk about them.They're so bad. Many more have been found out and exposed and swiftly terminated by a group of very intelligent, mostly young people headed up by Elon, and we appreciate it. We found hundreds of billions of dollars of fraud. [Applause] And we've taken back the money and reduced our debt to fight inflation and other things, taken back a lot of that money.We got it just in time. This is just the beginning. The Government Accountability Office, a federal government office, has estimated annual fraud of over $500 billion in our nation and we are working very hard to stop it. We're going to. We're also identifying shocking levels of incompetence and probable fraud in the Social Security program for our seniors, and that our seniors and people that we love rely on. Believe it or not, government databases list 4.7 million Social Security numbers from people aged 100 to 109 years old.[Booing] It lists 3.6 million people from ages 110 to 119. I don't know any of them. I know some people that are rather elderly but not quite that elderly. 3.47 million people from ages 120 to 129, 3.9 million people from ages 130 to 139. 3.5 million people from ages 140 to 149. And money is being paid to many of them.And we're searching right n"
