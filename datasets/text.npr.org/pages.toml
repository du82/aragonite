["https://text.npr.org/1263527053"]
title = "The R-word is back. But why?"
full_description = '''NPR > It's Been a Minute The R-word is back. But why? By Brittany Luse, Alexis Williams, Neena Pathak, Barton Girdwood, Veralyn Williams Wednesday, March 5, 2025 • 3:00 AM EST Over the past few years, Brittany has noticed the resurgence the R-word - a word that otherwise left the cultural lexicon. And while that's troubling in and of itself, its return may also have larger implications that affect policy, culture, and how we treat each other. Disability advocate Imani Barbarin joins the show to break down how ableism can take root in casual conversation, and why words matter. Support public media and receive ad-free listening & bonus content. Join NPR+ today. Transcript BRITTANY LUSE, HOST: Hello, hello. I'm Brittany Luse, and you're listening to IT'S BEEN A MINUTE from NPR, a show about what's going on in culture and why it doesn't happen by accident.(SOUNDBITE OF TV SHOW, "ENGLISH TEACHER")BRIAN JORDAN ALVAREZ: (As Evan Marquez) You know, the kids this year - I feel like they're less woke. Did you notice that?STEPHANIE KOENIG: (As Gwen Sanders) Oh, I know.ALVAREZ: (As Evan Marquez) They're not into being woke anymore.KOENIG: (As Gwen Sanders) It's circled back around.ALVAREZ: (As Evan Marquez) It's circled all the way around.KOENIG: (As Gwen Sanders) Yes.ALVAREZ: (As Evan Marquez) And now they're, like, for what they say they're against.KOENIG: (As Gwen Sanders) Right, and they're saying the R-word again.(SOUNDBITE OF MUSIC)LUSE: Much like FX's "English Teacher," I've noticed an uptick in a term I thought was long gone, at least in polite conversation - the R-word.IMANI BARBARIN: It's always kind of been an undercurrent on social media. It's always been kind of thrown around. Generally speaking, I usually see these upticks when it comes to relation to politics.LUSE: Disability advocate and content creator Imani Barbarin, aka Crutches and Spice on TikTok...BARBARIN: Thank you so much for having me.LUSE: ...Noticed this a few years ago.BARBARIN: I noticed that the R-word had come back - I want to say, in full force - around the midterm elections in 2022. A lot of times, anybody who displays what we consider deviant behavior, whether that be political opinions that may not agree with the status quo or, you know, societally, we cast them out using ableist language.LUSE: As someone who was a young person in the early 2000s, I remember campaigns telling people how harmful the word is...(SOUNDBITE OF ARCHIVED RECORDING)LAUREN POTTER: It is not acceptable to call me a retard or call yourself or your friends retarded when they do something foolish.(SOUNDBITE OF MUSIC)LUSE: ...And why we should be more aware of the way it can hurt our most vulnerable populations. But it's more than that.BARBARIN: Because disability is so often forgotten, people don't really realize how effective it is. It's not even just the words themselves. It is the sentiment behind them, a lot of the time. And you don't even necessarily need to use the R-word to wield power against another person.LUSE: Ableism isn't just found in our language. It's found in our policies and systems, as well. And when disability or the implication of a disability is attached to someone or a group of people, the consequences can be dire.BARBARIN: One of the big examples that I try to give people are conservatorships and guardianships.LUSE: I mean, you know, there's a case to be made that the way we use and wield language - that can be the butterfly wings that turn into the tsunami of, like, you know, #FreeBritney.BARBARIN: But - yeah, but you know what the weirdest thing is? Now that Britney Spears has her freedom and acts the way that she wants to, now what are people saying? Oh, well, maybe that conservatorship wasn't a bad idea.(SOUNDBITE OF MUSIC)LUSE: Today, Imani joins me to get into how she thinks ableism has shaped our political and legal landscape and why the R-word is just the tip of the iceberg.(SOUNDBITE OF MUSIC)BARBARIN: I think what it really does boil down to is some of our insults towards each other have their own basis in disability. So, like, the word idiot described people that were public charges that weren't capable enough to live on their own and handle their own affairs, however, were disabled enough that the community had to take care of them.LUSE: So to describe people who were unable or who were deemed unable to take care of themselves, idiot was one of the words used.BARBARIN: Another one is lame. Like, you can find lame in the Bible. The - Jesus healed the lame man, and that's always kind of been back and forth as a descriptor for disability. And additionally, it's not just, like, a language thing. It's structural. Like, when we look at anti-trans legislation, you can see that they put the provision to have trans people tested for autism because if they are then diagnosed with autism, they are seen as less capable of handling their own medical affairs and could potentially be put in things like conservatorships and guardianships, which then could impact their ability to vote. Because in about seven states, there are restrictions on people in conservatorships and guardianships voting. The attachment of things to disability has always kept people and their rights on the chopping block for a very long time. We talk about Buck v. Bell and sterilization.LUSE: For listeners, Buck v. Bell was a 1927 Supreme Court case that upheld, quote, "a state's right to forcibly sterilize a person considered unfit to procreate," which included those who they deemed, quote-unquote, "mentally deficient."BARBARIN: And whenever we decide we want to insult somebody or throw hate to somebody, we attach them to a disability regardless of whether or not they have one. Even if it's not just saying the word, we see this a lot when it comes to political conversations around competency in office, right? A lot of people want to attach our elected leaders to disabilities to say that they are not capable of being elected leaders. Now, whether or not you agree with them is immaterial. It's the fact that people see disability as one of the most discounting things and a way to take somebody out of the conversation or out of the discourse or out of the power that they have already.LUSE: Could you give an example or two of that?BARBARIN: Oh, my goodness. Joe Biden, all the time. People have always said, oh, you know, he's cognitively impaired. And whether or not he is is immaterial to the fact that, like, you could talk about his policies. You could talk about anything. People see that conversation around competency as a reason why he shouldn't be elected official. Donald Trump, similarly - the kind of - this, like, bumbling fool kind of caricature that we have of this man who was still competent enough to get elected a second time.LUSE: When we were preparing for this conversation, as we've been looking into the increased usage of the R-word, I came across this concept called the euphemism treadmill. It was introduced by this researcher and scholar named Steven Pinker in a 1994 New York Times op-ed. And I will say - he seemed to have a somewhat cynical view of the utility of the euphemism treadmill. Basically, the R-word used to be a part of, I believe, like, medical terminology - a diagnosis.BARBARIN: Yes, it was.LUSE: And then it gets that negative connotation, almost like because of our society's attitudes about disability, then the word becomes an insult. It becomes tarnished. But what he talks about with the euphemism treadmill is that, like, eventually, it becomes an insult, and then it becomes unspeakable. And then it's banished from polite conversation. What feels notable with the R-word is that it seems to be running backward on the euphemism treadmill. Like, I can't think of many other words...BARBARIN: Yeah, I mean...LUSE: ...Coming back.BARBARIN: ...What I find with ableism is that because it can be applied so widely, it never really goes away. When we think of, like, specific insults for certain groups - certain slurs for certain groups of people, they're only applicable to that group of people, right?LUSE: True.BARBARIN: When we think of the N-word, it's only applicable to Black people, like, effectively. When we think of other insults for different communities...LUSE: Yeah.BARBARIN: ...They're only applicable to those groups of people. But for disability, because you don't have to be disabled to experience ableism, it's applied to everyone. When we think about something becoming so out of the realm of possibility, for something to say being so insulting that nobody wants to say it, it almost never includes disabled people. One of the reasons why is because we don't talk to disabled people as a society.LUSE: About disabled people.BARBARIN: Like, we talk around disabled people.LUSE: Yeah.BARBARIN: We talk to family members. We talk to medical professionals. We talk to policymakers. And only in recent memory do we actually talk directly to disabled people like they are adults - like we are a group of people willing to have a conversation with rather than everybody talking around us in this fraternalistic manner, telling us what we should and shouldn't want for ourselves. Right? And so when we talk about the R-word, do they trust us enough to say that this is something we don't want to hear?(SOUNDBITE OF MUSIC)LUSE: Coming up...BARBARIN: No diagnosis has automatically made you racist. And the flip side of that, which is very frustrating, is that there are people who genuinely believe that racism should be treated like a diagnosis.LUSE: ...More on how disability, racism and whiteness are intertwined.(SOUNDBITE OF MUSIC)LUSE: I wonder - do you see it as a part of a wave of mainstreaming of offensive language or gestures more broadly? Like, I'm thinking about Kanye West...BARBARIN: Oh, yeah.LUSE: ...And the way that people talk about Kanye West's mental illness or diagnosis. I don't know all the details of his medical history. But when he says things that are antisemitic or deeply misogynistic or racist and anti-Black, people will be like, oh, this is a part of his diagnoses. On one hand, as you've described, I can think of a bunch of examples of disability being used as a reason why someone should not be believed or shouldn't be able to make decisions on their own. But it seems like there are people who are willing to use disability as a means of making an excuse for behavior that many people see as racist or antisemitic.BARBARIN: No diagnosis has automatically made you racist. And the flip side of that, which is very frustrating, is that there are people who genuinely believe that racism should be treated like a diagnosis.LUSE: I have seen that sentiment online a lot. What that kind of presupposes, then, is that racism is something that can't be helped, can't be fixed. It's like something of nature as opposed to of society.BARBARIN: Somebody once tried to tell me that they wanted racists to get treatment. I almost reached through...LUSE: Treated by who?BARBARIN: ...The phone and, like...LUSE: Treated by who (laughter)? What are you talking about?BARBARIN: But going back a little bit to your point about, you know, why is this language having an uptick, it has to do with eugenics. Like, after pandemics, eugenics increases. We kind of, like, separate ourselves on the basis of who's worthy and who's not. And the pandemic kind of accelerated our thoughts around disability and eugenics to the point where, like, this is now very normalized language.LUSE: That also makes me think back to something that I had seen in a New York Magazine piece written by Brock Colyar about the new sort of young conservative or Republican people who are, you know, excited about Trump's second presidency. And something that came up in that piece that I also have seen elsewhere online is people wanting to say - feel like they can say the R-word specifically and have that be OK or do it without guilt. Many people feel or see a power in that. You know, some people listening to this might think, you know, at the end of the day, these are just words, so what's the big deal? What would you say to them?BARBARIN: They're not just words. They're larger ideas than just an insult that we can hurl back to one another. And you don't even necessarily need to use the R-word in order to wield that sort of power. One major group of people that have been attached to disability are Black people. You know, taking intelligence tests to vote - right? - 'cause they...LUSE: Right.BARBARIN: ...Thought Black people were inherently unintelligent because of being Black. It goes into capacity laws and immigration, where we're telling people to stand on their own two feet. That has implications with disability. There's a reason why women were relegated to institutions and the lobotomized and had forced hysterectomies - because they were attached to a disability. There's a reason why queer men have been, historically, chemically castrated and experimented on - by being attached to disability. This has been our country's legacy, so it doesn't surprise me in any way, shape or form that the R-word is coming back. It doesn't surprise me that people are trying to pinpoint an entire community as the reason why we cannot have progress in this country, whether that be explicitly or implicitly implied through their use of that word.(SOUNDBITE OF MUSIC)LUSE: Well, Imani, I really appreciate you taking the time to have this conversation with me today. I learned so much. Thank you so much.BARBARIN: Thank you.(SOUNDBITE OF MUSIC)LUSE: That was disability advocate Imani Barbarin. You can find her on TikTok at @crutches_and_spice.(SOUNDBITE OF MUSIC)LUSE: This episode of IT'S BEEN A MINUTE was produced by...ALEXIS WILLIAMS, BYLINE: Alexis Williams.LUSE: This episode was edited by...NEENA PATHAK: Neena Pathak.LUSE: Our supervising producer is...BARTON GIRDWOOD, BYLINE: Barton Girdwood.LUSE: Our executive producer is...VERALYN WILLIAMS, BYLINE: Veralyn Williams.LUSE: Our VP of programming is...YOLANDA SANGWENI, BYLINE: Yolanda Sangweni.LUSE: All right. That's all for this episode of IT'S BEEN A MINUTE from NPR. I'm Brittany Luse. Talk soon.(SOUNDBITE OF MUSIC)'''
