full_description = "NPR > Pop Culture Happy Hour Our favorite 'SNL' musical moments By Stephen Thompson, Eric Deggans, Mike Katzif, Jessica Reedy Wednesday, March 5, 2025 • 3:00 AM EST Perhaps you've heard that Saturday Night Live is celebrating its 50th anniversary — they've mentioned it once or twice. From Lazy Sunday to Domingo to a ton of iconic musical performances, SNL's had a long and fascinating relationship with music. Today, we're talking about some of our favorite SNL musical moments. NPR > Pop Culture Happy Hour Our favorite 'SNL' musical moments By Stephen Thompson, Eric Deggans, Mike Katzif, Jessica Reedy Wednesday, March 5, 2025 • 3:00 AM EST Perhaps you've heard that Saturday Night Live is celebrating its 50th anniversary — they've mentioned it once or twice. From Lazy Sunday to Domingo to a ton of iconic musical performances, SNL's had a long and fascinating relationship with music. Today, we're talking about some of our favorite SNL musical moments."
