title = "Black Gospel Archive fills gaps in gospel music history"
full_description = '''NPR > Music Black Gospel Archive fills gaps in gospel music history By Molly-Jo Tilton Friday, February 28, 2025 • 2:11 PM EST Heard on All Things Considered Over the past two decades, Baylor University's Black Gospel Archive has collected and digitized more than 60,000 gospel songs, making it one of the largest digital gospel collections in the world.The archive focuses on records from the "golden era of gospel music," roughly 1945-1980. It also houses important artifacts like recorded sermons, concert announcements and sheet music, to preserve the history of Black gospel culture.Now, thanks to a new grant, the archive will expand its collection to include oral histories as well."It is the music that endured," gospel historian Bob Darden says. He served as the lead researcher for the archive until his retirement in 2023.Darden's 2005 New York Times op-ed, "Gospel's got the Blues," helped inspire the creation of the archive."And now, it continues to be one of the greatest legacies and greatest records of a period in American life, as shameful as it was," Darden said about the gospel music in the collection.At a time when Black Americans were protesting segregation and discrimination, gospel boomed as a form of protest. Songs like "We Shall Overcome" became anthems for civil rights protests."There were many forms of expression, and we've managed to save one," Darden said. "That's going to help us understand those who came before us."Many of the records in the archive are extremely rare. For example, the recording of "The Old Ship of Zion" performed by The Mighty Wonders of Aquasco, Md., is one of only two copies known to exist.Little is known about the origins of each recording, unless someone associated with it contacts the archive.These are the gaps it hopes to fill thanks to a Lilly Endowment grant received earlier this year. The archive will collect oral histories of those who lived through gospel's golden age."There are people still alive in their 80s and 90s that need to be interviewed," archive researcher and ambassador Stephen Newby said. "This is going to allow me to go to them and interview them and ask them questions about their church histories and about gospel music."He said those oral histories are some of the biggest elements the archive is missing."I see the gaps in the story," Newby said. "This is going to allow me to take some time to fill some of those gaps."The grant will also fund a four-year concert series starting in Chicago and Detroit.Newby said there is no way to know how many uncatalogued gospel records are out there, but the team will keep digitizing them as long as donors keep sending them. Transcript ADRIAN FLORIDO, HOST: The Black Gospel Archive at Baylor University is one of the largest digital collections of gospel music in the world. For two decades, the archive has collected and digitized more than 60,000 gospel songs, creating a searchable online database of previously unattainable records. The project's next challenge is to hunt down rare and hard-to-find songs and oral histories, and it's received a $2.4 million grant to do that. KWBU's Molly-Jo Tilton reports from Waco, Texas.MOLLY-JO TILTON: Tucked in the corner of Baylor University's Memorial Library, the Black Gospel Archive's walls are packed from top to bottom with records, cassettes and sheet music reflecting decades of music history.(SOUNDBITE OF SONG, "HE NEVER HAS LEFT ME ALONE")THE ANGELIC GOSPEL SINGERS: (Singing) Since I gave to Jesus my poor broken heart, he never has left me alone.TILTON: The archive houses and digitizes the gospel records that are most vulnerable, those recorded in the golden era of gospel. This is roughly 1945 to 1980. And once those records disappear, they'll be gone forever - songs like "The Old Ship Of Zion," performed by the choir The Mighty Wonders Of Aquasco, Maryland. The original records were sold at church performances, but now only two copies are known to remain.(SOUNDBITE OF SONG, "THE OLD SHIP OF ZION")THE MIGHTY WONDERS OF AQUASCO, MARYLAND: (Singing) Step on board if you want to see Jesus. Just step on board, and follow me.TILTON: Anyone with an internet connection can listen to these songs. The archive also holds important artifacts, like recorded preachings, concert announcements, sheet music and blog posts, aiming to preserve the history of Black gospel culture as well. Gospel historian Robert Darden said this is part of what inspired the creation of the archive nearly two decades ago.ROBERT DARDEN: It is the music that endured, and now it continues to be one of the greatest legacies and the greatest records we have of a period in American life as shameful as it was.TILTON: At a time when Black Americans were protesting segregation and discrimination, gospel boomed as a form of protest, often sung both to boost spirits and in defiance.(SOUNDBITE OF SONG, "WE SHALL OVERCOME")ALICE MCCLARTY AND THE TRAVELING ECHOES: (Singing) We shall overcome.TILTON: Songs like "We Shall Overcome" became anthems for the civil rights protesters.(SOUNDBITE OF SONG, "WE SHALL OVERCOME")ALICE MCCLARTY AND THE TRAVELING ECHOES: (Singing) We shall overcome. We shall overcome.DARDEN: That's going to help us understand those who came before.TILTON: Thanks to a Lilly Endowment grant awarded earlier this year, the archive will expand the recorded history of gospel by collecting oral histories from those who lived it.STEPHEN NEWBY: There are people that are still alive in their 80s and 90s that need to be interviewed. It's going to allow me to go to them and interview them and ask them questions about their church history and about gospel music artists.TILTON: That's Stephen Newby, the archive's ambassador. He says oral histories are some of the most important elements the archive is missing.NEWBY: I see gaps in the story, and this grant is going to allow me to take some time and attempt to fill some of those gaps.TILTON: Newby says that there's no way to know how many uncatalogued gospel records remain, but the team will keep digitizing them as long as people keep sending them. The grant will also help hire new full-time staff and fund a four-year concert series starting in Chicago and Detroit.(SOUNDBITE OF SONG, "I'M ON THE BATTLEFIELD FOR MY LORD")THE WIGDEN TRIO: (Singing) For my Lord.TILTON: For KWBU, I'm Molly-Jo Tilton in Waco, Texas.FLORIDO: And member station KWBU receives some station funding from Baylor University, the home of the archive.(SOUNDBITE OF SONG, "I'M ON THE BATTLEFIELD FOR MY LORD")THE WIGDEN TRIO: (Singing) I'm on the battlefield for my Lord. And I promised him that I...'''
