full_description = '''NPR > Oscars 2025 Oscars 2025: The complete list of winners By Dhanika Pineda Updated Sunday, March 2, 2025 • 10:44 PM EST The 97th Academy Awards took place Sunday night at the Dolby Theatre in Hollywood. Anora won five Oscars, including best picture, best actress, achievements in directing and editing, and best original screenplay. Related Story: NPR Zoe Saldaña won the Academy Award for best actress in a supporting role for her performance in Emilia Pérez, making her the first American of Dominican descent to win an Oscar. Paul Tazewell won the Academy Award for costume design for his work on Wicked, making him the first Black male to win in the category.The ceremony aired on ABC and streamed on Hulu. Hosted by Conan O'Brien, the Oscars took place in the aftermath of devastating Los Angeles wildfires. You can read our takeaways here and check out our red carpet coverage here.Below is the full list of 2025 Academy Award winners and nominees.Best picture Related Story: NPR WINNER: AnoraThe BrutalistA Complete UnknownConclaveDune: Part TwoEmilia PérezI'm Still HereNickel BoysThe SubstanceWickedAchievement in directing Related Story: NPR WINNER: Anora, Sean BakerThe Brutalist, Brady CorbetA Complete Unknown, James MangoldEmilia Pérez, Jacques AudiardThe Substance, Coralie FargeatPerformance by an actor in a leading role Related Story: NPR WINNER: Adrien Brody, The BrutalistTimothée Chalamet, A Complete UnknownColman Domingo, Sing SingRalph Fiennes, ConclaveSebastian Stan, The ApprenticePerformance by an actress in a leading roleWINNER: Mikey Madison, AnoraCynthia Erivo, WickedKarla Sofía Gascón, Emilia PérezDemi Moore, The SubstanceFernanda Torres, I'm Still HerePerformance by an actor in a supporting role Related Story: NPR WINNER: Kieran Culkin, A Real PainYura Borisov, AnoraEdward Norton, A Complete UnknownGuy Pearce, The BrutalistJeremy Strong, The ApprenticePerformance by an actress in a supporting role Related Story: NPR WINNER: Zoe Saldañ