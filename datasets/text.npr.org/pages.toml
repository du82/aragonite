["https://text.npr.org/nx-s1-5304312"]
title = "Chinese architect Liu Jiakun wins the 2025 Pritzker Prize"
full_description = '''NPR > Architecture Chinese architect Liu Jiakun wins the 2025 Pritzker Prize By Neda Ulaby Tuesday, March 4, 2025 • 9:00 AM EST Heard on All Things Considered The winner of this year's Pritzker Architecture Prize, announced Tuesday, is Liu Jiakun.The prize, established in 1979, is commonly referred to as "the Nobel Prize of architecture."Liu is from Chengdu, in the Sichuan province of China. He was born there in 1956. His childhood was spent roaming the halls of the large brick hospital where his mother worked as an internist. "Sometimes when we were young, we would go to the roof of the building to see the whole city," he recalled during a video conference interview with NPR.From that lofty vantage point, he said, he could peer over neighborhoods still filled with traditional wooden Chinese homes. After Liu graduated from college in 1982, he worked for a state-owned architecture firm in Tibet. But he wanted to be a writer."At that time I [had] two identities," the architect said. "One [was] as a worker in the architectural firm, and another [was] doing my passion, writing."Liu spoke to NPR from his offices in Chengdu. His translator was his 24-year-old son Martin. Both father and son wore black-framed glasses and black turtleneck sweaters. They also shared a solemn affect that occasionally melted into wry chuckles.These days, Liu said, he sees similarities between writing – he's authored several books – and his practice as a designer of buildings and built environments."What writing does for me," he said, "is that it gives me more perspectives. Observations about society and human behavior. There are also vocabularies that are similar in architectural design and in literature. There's always beginnings and there's always endings. And then there's climax and then there's always buildups."Liu also applies this vocabulary to busy public spaces. His West Village commercial complex, built in Chengdu in 2015, fills an entire block with buildings, bike paths, monuments and walkways for pedestrians. A 2020 exhibition dedicated to his work at the Savannah College of Art and Design included a room-sized model of West Village, as an example of what the curator described as "translating traditional Chinese cultural ethos into contemporary architectural language."In addition to numerous museums, university buildings and churches, mostly in China, Liu designed a panda maternity ward at the Chengdu Research Base of Giant Panda Breeding, a popular tourist attraction visited by millions of people every year.The Pritzker jury, in its statement, applauded what it called Liu's "reverence for culture, history and nature, chronicling time and comforting users with familiarity through modern interpretations of classic Chinese architecture." As one example, it cited a crisply modern building Liu designed for the Novartis pharmaceutical company in Shanghai. Built in 2014, it summons ancient Chinese architectural motifs in its use of dramatic tiered balconies. Another, the Luyeyuan Stone Sculpture Art Museum in Chengdu, from 2002, evokes a traditional Chinese garden, with water and ancient stones."I always aspire to be like water," the laureate wrote in his Pritzker statement. "To permeate through a place without carrying a fixed form of my own and to seep into the local environment and the site itself. Over time, the water gradually solidifies, transforming into architecture, and perhaps even into the highest form of human spiritual creation. Yet, it still retains all the qualities of that place, both good and bad."Perhaps nothing sums up Liu's approach more succinctly than the "rebirth bricks" he formed after a deadly earthquake in 2008 destroyed entire villages northwest of Chengdu. To help with rebuilding, Liu made bricks, using straw and the rubble left from the fallen buildings."You can see history in each brick," he told NPR, adding that their production stopped after there was no more debris. "But in the world, as long as there are civil wars and earthquakes, we can always find a use for rebirth bricks." Transcript ARI SHAPIRO, HOST: The winner of the most prestigious prize in architecture was announced this morning. This year's Pritzker Prize Laureate comes from China. As NPR's Neda Ulaby reports, his buildings, in the words of the judges, bring serenity and poetry to daily life.NEDA ULABY, BYLINE: Jiakun Liu was born in 1956. He grew up amid dull communist buildings and traditional wooden Chinese ones.JIAKUN LIU: (Speaking Chinese).ULABY: Liu spoke with NPR from his offices in Chengdu, one of the first private architectural firms in the country. His 24-year-old son, Martin, was there to translate.LIU: (Through interpreter) So before I got into architecture, my real passion was to write.ULABY: After college, Liu worked for a state-owned architecture firm in Tibet. Back then, he said he was just going through the motions.LIU: (Through interpreter) At that time, I have, like, two identities. One is, like, a worker in an architectural firm and another is doing my passion - writing.ULABY: The author now of several books, Liu said designing buildings is not unlike telling stories.LIU: (Through interpreter) There's always beginnings, and there are always endings. And then there's always buildup.ULABY: Many of Liu's buildings have become popular destinations in China. This video, made by the city of Suzhou, shows videos at its Imperial Kiln Ruins Park and Museum.(SOUNDBITE OF ARCHIVED RECORDING)UNIDENTIFIED PERSON: (Speaking Chinese).ULABY: Jiakun Liu brought his buoyant, modernist style even to an entire city block in Chengdu.ALEJANDRO ARAVENA: That looks more like a machine than a building.ULABY: The Pritzker jury chair, Chilean architect Alejandro Arevena, says Liu wrapped much of the block in ramps.ARAVENA: And you see people jogging up, skating up, riding bicycles. So he was able to create public space where, in principals, shouldn't supposed to be.ULABY: Liu, he says, created a new kind of urban space in a city of more than 20 million people.ARAVENA: This guy, instead of going into the debate of density, went into the debate of intensity. There's an intense urban life. There's life.ULABY: And not just human life - Liu has also designed a maternity ward for pandas at the popular Chengdu research base and park. In Chinese, says Liu, panda means something specific and wild.LIU: (Through interpreter) Like, literal translation is bear cat - it's still a bear more than a cat.ULABY: This project, he added, was derailed for a while by a devastating earthquake in 2008. Hundreds of buildings and entire villages were destroyed. Liu responded by making bricks from the debris. They became known as rebirth bricks. The Pritzker jury said Jiakun Liu takes present realities and makes them offerings in constructing a new and better world. Neda Ulaby, NPR News.'''
