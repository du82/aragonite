["https://text.npr.org/g-s1-50488"]
title = "Read NPR's annotated fact check of President Trump's address to Congress"
full_description = '''NPR > Politics Read NPR's annotated fact check of President Trump's address to Congress By NPR Staff Updated Tuesday, March 4, 2025 • 11:06 PM EST President Trump delivered an address to a joint session of Congress in the U.S. Capitol on Tuesday night, six weeks into his second term. Since his inauguration, he has worked briskly to try to radically reshape the government and has signed dozens of executive orders, many upending policies created by former President Joe Biden. Trump took stock of what he's done so far and laid out his vision for the economy, immigration and foreign affairs. Related Story: NPR Reporters from across NPR's newsroom fact-checked the address and offered context as the speech unfolded. By topic: Immigration | Inflation | Energy | Culture | Spending and tax cuts | Department of Government Efficiency (DOGE) | Trade and tariffs |Climate | Foreign policyImmigrationUnlawful border crossingsTRUMP: "Within hours of taking the oath of office, I declared a national emergency on our southern border, and I deployed the U.S. military and border patrol to repel the invasion of our country, and what a job they've done. As a result, illegal border crossings last month were by far the lowest ever recorded ever. They heard my words and they chose not to come."U.S. Customs and Border Protection agents had about 30,000 encounters with migrants attempting to cross the U.S. borders illegally in January, the agency reported. The agency has not reported the numbers for February, however Reuters reported last week that the administration is on track to report about 8,500 arrests at the U.S.-Mexico border for February. This could be the lowest number of crossings since Homeland Security started reporting the data in 2000.CBP has been recording apprehensions since 1925. In 1935, there were only 11,000 apprehensions nationwide for the full year. During President Biden's administration, unlawful crossings nationwide hit an all-time high in 2022 — CBP reported more than 2.2 million encounters. However, Biden's last full month in office, December 2024, saw about 48,000 encounters.— Sergio Martínez-Beltrán, Immigration Correspondent Related Story: NPR Deportations“I have sent Congress a detailed funding request laying out exactly how we will eliminate these threats to protect our Homeland, and complete the largest deportation operation in American history, larger even than current record holder Dwight D. Eisenhower—a moderate man but someone who believed very strongly in borders.In his remarks, Trump referenced 1954's "Operation Wetback" — a racist term used to refer to migrants who crossed the Rio Grande. Government estimates of President Dwight D. Eisenhower's effort showed more than a million Mexican immigrants and some U.S. citizens were rounded up.Since then, other presidents have carried out large deportation actions throughout their terms. Former President Barack Obama's administration, for example, deported over 3 million people. But Trump's second administration's own efforts face long-standing logistical and capacity challenges.— Ximena Bustillo, DHS and Immigration Policy ReporterBiden allowing migrants into the U.S.TRUMP: "In comparison, under Joe Biden, the worst president in American history, there were hundreds of thousands of illegal crossings a month, and virtually all of them, including murderers, drug dealers, gang members and people from mental institutions and insane asylums were released into our country. Who would want to do that?"The nonpartisan Migration Policy Institute estimates that from 2021 to 2024, the Biden administration allowed more than 5.8 million immigrants into the U.S. They were temporarily allowed into the country through multiple parole and sponsorship programs, many of which have been dramatically curbed or ended by the Trump administration. Migrants who participated in these programs were vetted before being allowed into the country.— Sergio Martínez-Beltrán, Immigration CorrespondentImmigrants and the workforceTRUMP: "Entire towns like Aurora, Colorado and Springfield, Ohio buckled under the weight of the migrant occupation and corruption like nobody has ever seen before."Increased immigration — both legal and illegal — has helped to grow the labor force in recent years. It has allowed employers to keep adding jobs at a rapid clip without putting much upward pressure on prices, even as millions of baby boomers are retiring. From January 2024 to January 2025, for example, the foreign-born workforce grew by 2.1 million people while the larger native-born workforce added just 1.3 million.Immigration has slowed considerably in recent months, however. Foreign-born workers do not appear to be displacing the native-born workforce. The share of working-age men who were in the workforce in January was 89.4% — higher than all but one month during the first Trump administration. The share of working-age women who were in the workforce hit a record high of 78.4% last summer and has fallen only slightly since. Related Story: NPR — Scott Horsley, Chief Economics Correspondent"Gold card"“We have developed in great detail what we are calling the gold card, which goes on sale very, very soon. For $5 million it will allow the most successful job creating people from all over the world to buy a path to U.S. citizenship.”Trump recently announced plans to create a "gold card," which he said will allow "very high-level people" to apply to become a lawful permanent resident. His administration has pitched this as a replacement to the current EB-5 immigrant investor visa.But the president can't solely create a new visa. That power lies with Congress. And significantly changing the EB-5 visa program would also require congressional action.So far, a formal proposal has not been issued by the Trump administration, so it is unclear how he might modify the existing visa or lobby Congress to create a new one.— Ximena Bustillo, DHS and Immigration policy reporterTrump highlights his first lawTRUMP: “That's why the very first bill I signed into law as 47th president mandates the detention of all dangerous criminal aliens who threaten public Safety, very strong, powerful act.”The Laken Riley Act, which was signed into law by President Trump in January, expands the scope of those who can be arrested, detained and deported by federal immigration officers.The measure directs federal immigration enforcement to detain and deport those without legal status charged with minor theft or shoplifting, assault of a law enforcement officer or crimes resulting in death or serious bodily injury of another person.Several criminal offenses could already be grounds for deportation and supporters of immigration point to research that shows immigrants commit fewer crimes than those born in the U.S.The legislation passed with bipartisan support from Democrats. Still, questions remain over the ability for federal law enforcement to fully implement the measure due to limited detention resources.— Ximena Bustillo, DHS and Immigration policy reporterInflationPrice of eggsTRUMP: "Joe Biden especially let the price of eggs get out of control – the egg prices out of control — and we are working hard to get it back down."Overall, grocery prices have begun to level off, rising less than 2% between January 2024 and January 2025. But many people still experience supermarket sticker shock. Eggs have been a particular sore spot lately, with prices jumping 53% over the last year. That's largely due to the ongoing challenge of avian flu, which has forced egg farmers to slaughter tens of millions of egg-laying chickens. The shortfall in egg supply has been compounded by panic buying — similar to what happened with toilet paper in 2020 — leading some stores to limit egg purchases. Last week, Agriculture Secretary Brooke Rollins announced a $1 billion effort to combat avian flu, including $500 million for new sanitary precautions at egg farms. The USDA is also exploring vaccination for laying hens and increasing the supply of imported eggs.— Scott Horsley, Chief Economics CorrespondentInflation under BidenTRUMP: "Among my very highest priorities is to rescue our economy and get dramatic and immediate relief working families, as you know, we inherited from the last administration an economic catastrophe and an inflation nightmare. Their policies drove up energy prices, pushed up grocery costs, and drove the necessities of life out of reach for millions and millions of Americans. They've never had anything like it. Suffered the worst inflation in 48 years, but perhaps even the history of our country. They're not sure, as President, I'm fighting every day to reverse this damage and make America affordable again."Inflation soared to 9.1% in 2022 — the highest rate in 40 years, not 48 — in the wake of the pandemic and Russia's invasion of Ukraine. Robust government spending likely added to the price hikes in the U.S., putting more money in people's pockets. Demand surged, outpacing tangled supply chains. But high inflation was a worldwide problem, even in countries where governments didn't spend so heavily.While inflation has since eased, settling at 3% in January, prices are still climbing faster than most people would like.While high prices are a source of frustration for many Americans, the average worker has more buying power today than she did before the pandemic. Since February 2020, just before the pandemic took hold in the U.S., consumer prices have risen 22.8% while average wages have risen 25.8%. Wages have been climbing faster than prices for the better part of two years.— Scott Horsley, Chief Economics CorrespondentEnergy Energy productionTRUMP: "The previous administration cut the number of new oil and gas leases by 95%, slowed pipeline construction to a halt, and closed more than 100 power plants. We are opening up many of those power plants right now. And frankly we have never seen anything like it."President Trump has promised to boost fossil fuel production, but the U.S. is already producing record amounts of oil and natural gas. Even though lease auctions and pipeline construction slowed during the Biden administration, crude oil production in 2023 reached 12.9 million barrels a day, eclipsing the previous record set in 2019. 2023 was also a record year for domestic production of natural gas. Much of the domestic boom in oil and gas production is the result of hydraulic fracturing or "fracking" techniques.Recent years have also seen rapid growth in solar and wind power, while coal has continued to decline as a source of electricity.Trump is hostile to wind energy production. On his first day back in the White House, he signed an executive order temporarily blocking federal leases for offshore wind farms and halting permits for wind projects on land and offshore.— Scott Horsley, Chief Economics CorrespondentCulture Defining two genders, male and femaleTRUMP: "I signed an order making it the official policy of the United States government that there are only two genders, male and female.”While DNA does indeed encode for two sexes, the way genes express themselves can create individuals who have atypical sexual development, including, in some cases, features of both sexes, such as both ovarian and testicular tissue. These individuals have conditions known as differences in sex development (also called intersex).Individuals may identify with a gender that differs from their biological sex assigned at birth — and actions taken by the administration have sought to curb the rights of transgender people in the U.S. People who identify as transgender and nonbinary see this executive order as a form of discrimination that erases their identity on official documents.— Maria Godoy, Health CorrespondentGender-affirming care for youthTRUMP: "And now I want Congress to pass a bill permanently banning, criminalizing sex changes on children and forever ending the lie that any child is trapped in the wrong body. This is a big lie, and our message to every child in America is that you are perfect, exactly the way God made you."Research shows that legal efforts that aim to curb the rights of transgender youth are associated with serious negative mental health outcomes. A 2024 study in the journal Nature Human Behavior found that states that passed laws against gender-affirming care and other laws aimed at trans minors saw suicide attempts by transgender and gender nonconforming teenagers increase by as much as 72% in subsequent years.— Maria Godoy, Health CorrespondentEnding school indoctrinationTRUMP: "I signed an executive order banning public schools from indoctrinating our children with transgender ideology."Earlier in his speech, Trump also mentioned getting critical race theory out of schools. While Trump signed an executive action in late January "ending radical indoctrination in K-12 schooling," the federal government, including the U.S. Department of Education, has little control over what is taught in local schools. The Every Student Succeeds Act, passed by Congress in 2015, expressly forbids federal interference in things like curriculum and teaching materials.— Cory Turner, Education CorrespondentPoll numbersTRUMP: "Now, for the first time in modern history, more Americans believe that our country is headed in the right direction than the wrong direction. In fact, it's an astonishing record 27-point swing since Election Day alone."More people have said the country has been headed in the wrong direction than the right one for a long time. In an average of the polls compiled by RealClearPolitics it's been that way every month since June 2009 after former President Obama was sworn in.And despite improvements in those views since Trump won the election, mostly due to Republican enthusiasm, more people continue to say the country is headed in the wrong direction.The latest NPR/PBS News/Marist poll finds 54% think the country is headed in the wrong direction, while 45% said it's headed in the right direction. That is a significant improvement from December when 64% thought the country was headed in the wrong direction, again, largely due to Republicans.RCP has the average at 51% wrong direction, 43% right direction. It's an improvement, but not net-positive.— Domenico Montanaro, Senior Political Editor/CorrespondentSpending and tax cutsTrump nods to Congress' role in extending his tax cutsTRUMP: "The next phase of our plan to deliver the greatest economy in history is for this Congress to pass tax cuts."The president is referring to plans to extend tax cuts that were enacted during his first administration. To achieve this, congressional Republicans plan to use a budget tool called reconciliation, which would allow them to pass major legislative items by a simple majority, relying entirely on GOP votes and avoiding the threat of a Democratic filibuster in the Senate.Although Republicans control both chambers of Congress, the Senate and the House'''
year_published = 2025
