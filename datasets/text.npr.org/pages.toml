title = "How the Pennsylvania Dutch community celebrates Fastnacht Day"
full_description = "NPR > Food How the Pennsylvania Dutch community celebrates Fastnacht Day By Here & Now Newsroom Tuesday, March 4, 2025 • 4:54 PM EST Christians worldwide celebrate Shrove Tuesday. It’s the last day before the 40-day Lent period of fasting and prayer. Many in the U.S. call it Fat Tuesday and celebrate it with pancakes.However, to the Pennsylvania Dutch community, it’s called Fastnacht Day, and they eat a very different tasty treat: a dense donut that’s also called a Fastnacht.To find out more, host Peter O’Dowd speaks to Rachelle Schenk Womer, manager of the Pennsylvania Bakery in Camp Hill just outside Harrisburg, Pennsylvania.This article was originally published on WBUR.org."
