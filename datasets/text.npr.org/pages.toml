title = "Starting with Rep. Al Green, Democrats protest against Trump's speech to Congress"
full_description = '''NPR > Politics Starting with Rep. Al Green, Democrats protest against Trump's speech to Congress By Elena Moore, Deirdre Walsh Tuesday, March 4, 2025 • 9:58 PM EST NPR is bringing you the latest from President Trump's address to a joint session of Congress. For more updates, get our NPR Politics newsletter or listen to The NPR Politics Podcast.Rep. Al Green, D-Texas, was removed from the House chamber after heckling President Trump during his first address to a joint session of Congress of his second term.Though lawmakers in the opposition party have been vocal from their seats during past presidential addresses, Green's removal from the chamber marked a stark break from tradition. Related Story: NPR Green stood up and began yelling at Trump after the president referenced his 2024 election win and claimed he had been given a mandate from the American people. Green first received a warning from House Speaker Mike Johnson, and when he did not stop was escorted out by the sergeant-at-arms.The Texas Democrat repeatedly shouted that the president did not have a mandate."It's worth it to let people know that there are some people who are going to stand up [to Trump]," Green said to reporters outside the chamber. Related Story: NPR Other lawmakers led quieter protests. A group of Democratic women wearing T-shirts reading "Resist" walked out of the president's speech, as did other Democrats as the speech went on. Others waved black signs saying "False."Rep. Maxwell Frost was one of several members who left the chamber during Trump's address. He wore a shirt that read "No kings live here.""In the spirit of student protestors from the Civil Rights Movement, I'm proud to have protested and walked out with many of my colleagues," Frost said in a post on social media. "This is NOT a normal time."Democrats are the minority party in the Senate and the House of Representatives. Many lawmakers have appeared at demonstrations in response to the Trump administration's drastic changes to the federal government. CORRECTION Mar. 5th, 2025 A previous version of the photo caption misspelled Rep. Al Green's last name as Greene.'''
year_published = 2025
