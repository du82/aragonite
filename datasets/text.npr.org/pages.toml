title = "Saya Gray: Tiny Desk Concert"
full_description = '''NPR > Tiny Desk Saya Gray: Tiny Desk Concert By Bobby Carter Wednesday, March 5, 2025 • 5:00 AM EST Of the 30 million people who have watched Daniel Caesar's Tiny Desk from 2018, plenty of them raved about the band, specifically the bass player. Little did we know that the young, unassuming musician named Saya Gray would be playing at the Desk seven years later, this time front and center.Gray's pop songs are experimental in nature, so I was eager to hear how her music would cozy up to our space. That inclination to stretch out and try anything comes from her musical family: Her mother, who moved from Japan to Canada, founded Toronto's Discover Through the Arts music school and her dad, a jazz trumpeter, studied at the Berklee College of Music.Gray leans into the challenge of the Tiny Desk and strips elements away. Like magic, she gives us these light and soulful interpretations of songs from SAYA, plus a throwback to "IF THERE'S NO SEAT IN THE SKY (WILL YOU FORGIVE ME???)" from her 2022 debut 19 MASTERS.SET LIST"SHELL ( OF A MAN )""..THUS IS WHY (I DON'T SPRING 4 LOVE)""IF THERE'S NO SEAT IN THE SKY (WILL YOU FORGIVE ME???)""LIE DOWN.."MUSICIANSSaya Gray: vocals, guitar, bassLucian Gray: guitarJohn Mavro: drums, bass, guitarAce G: keys, background vocalsKola Rai: background vocalsTaj Sapp: background vocalsTINY DESK TEAMProducer: Bobby CarterDirector/Editor: Maia SternAudio Technical Director: Josh NewellVideographers: Maia Stern, Joshua Bryant, Wendy LiAudio Engineer: Andie HuetherProduction Assistants: Ashley Pointer, Dora LevitePhotographer: Michael ZamoraTiny Desk Team: Lars Gotrich, Kara FrameExecutive Producer: Suraya MohamedSeries Creators: Bob Boilen, Stephen ThompsonVP, Visuals and Music: Keith Jenkins'''
