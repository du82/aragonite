title = "Is 'Flow' scary for young kids? The animated Oscar winner has some dark themes"
full_description = '''NPR > Oscars 2025 Is 'Flow' scary for young kids? The animated Oscar winner has some dark themes By Elizabeth Blair Monday, March 3, 2025 • 3:36 PM EST Heard on Morning Edition The animated film Flow just won an Oscar — but it might be too dark for some kids.NPR's Bob Mondello called Flow "the most breathtaking cat video in history." But the dangers the star feline faces during the course of 84 minutes might be a bit too breathtaking for some children. Related Story: NPR The wordless movie follows a cat that is chased by a pack of dogs and nearly drowns in a flood. There are no humans to help save the cat or any of the other animals from peril.Parent Philip Sledge said he thinks Flow is a masterpiece, but watching it with his kids was "kind of a mistake," he wrote on the entertainment website Cinemablend, where he's a content producer. He told NPR that his 9-year-old daughter burst into tears when the floodwaters started to rise."She was worried about all the animals," he said, "and we actually had to pause the movie and speak with her and be like, 'Hey this is an animated movie. No cats or dogs or any other animals were harmed.' "Common Sense Media gives Flow five stars and recommends the movie for children 6+. The organization comes up with appropriate ages using a rubric "developed with child development experts," said editorial director Betsy Bozdech. Related Story: NPR Among other criteria, they look at "what levels of tension and scariness are appropriate for which ages," she said.Commenters on the Common Sense Media website rate the appropriate age for Flow as slightly higher, at 7+ on average.Commenter Sandra D. called Flow a "gorgeous movie," but wrote that her 11-year-old "was in my lap sobbing, and tears flowed on and off throughout the remainder of the movie."The animals in Flow squabble, face terror, but they also work together to survive. Related Story: NPR Ultimately parents and caregivers need to "make the decision that's right for their family," said Bozdech."What is going to work for some kids will not work for others because every kid is a little bit different."Bozdech recommended adults watch screen content with their children. A movie like Flow, she said, is "a great opportunity to let kids experience some uncomfortable emotions when they're in a safe environment to do so."Jennifer Vanasco edited the audio and digital versions of this story. Related Story: NPR Related Story: NPR Transcript LEILA FADEL, HOST: The filmmakers behind a wordless movie about animals trying to survive a flood, "Flow," now hold this year's Oscar for best animated feature. But for parents thinking of quickly adding "Flow" to their screen time rotation, NPR's Elizabeth Blair reports the movie has proven too scary for some little kids.ELIZABETH BLAIR, BYLINE: "Flow" has everything a kid might want - a courageous cat, a yellow Lab, a capybara, funny lemurs.PHILIP SLEDGE: I was like, oh, this looks like something I will watch with my kids.BLAIR: Philip Sledge, a content producer for the entertainment site CinemaBlend, says he did, and it was a mistake. He says they have a cat that looks just like the one in the movie. When the waters started to rise, his 11-year-old started to cry.SLEDGE: She was scared. She was worried about all the animals.(SOUNDBITE OF CAT MEOWING)BLAIR: Other families had similar reactions. One commenter on the website Common Sense Media wrote that she had to stop the movie because her 9- and 10-year-old daughters were sobbing. "Flow" is definitely not one of those cute movies about loveable talking animals. There are signs of human life, but we never see or hear any people. Betsy Bozdech, Common Sense Media's editorial director, thinks "Flow" is like a great picture book that doesn't have words.BETSY BOZDECH: These animals are definitely in peril, but they also find a whole lot of companionship and camaraderie.BLAIR: Common Sense Media recommends "Flow" for ages 6 and up. Bozdech says to come up with its age-rating criteria, they work with child development experts.BOZDECH: When you look at what levels of tension and scariness are appropriate for which ages, it kind of fell in line at around age 6-plus.BLAIR: But Bozdech says all families are different, and what works for some kids won't work for others. She says a movie like "Flow" can help kids experience some uncomfortable emotions in a safe environment.BOZDECH: Part of parents' jobs is to raise kids who are resilient and able to handle all the things that life throws at them, not just the good stuff.BLAIR: Bozdech recommends parents watch "Flow" with their kids so they can talk about the scary parts. Meantime, Philip Sledge says he watched the Oscars with his daughter. Even though she had cried during "Flow," she got excited when it was mentioned.SLEDGE: She was like, oh, I remember that movie. I loved "Flow" so much. Let's watch it again.BLAIR: Elizabeth Blair, NPR News.(SOUNDBITE OF MUSIC)'''
year_published = 2025
