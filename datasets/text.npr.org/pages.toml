full_description = "NPR > Music Music Wednesday, March 5, 2025 Why are the Grammys' rock categories stuck in the past? Meet the Syrians behind the music that inspired a revolution Saya Gray: Tiny Desk Concert Our favorite 'SNL' musical moments In a slow week for new albums, pop singer Tate McRae reigns supreme Celebrating Mardi Gras with New Orleans clarinetist and vocalist Doreen Ketchens Carl Dean, Dolly Parton's husband of nearly 60 years who inspired 'Jolene,' dies at 82 All Songs Considered At 25 Pop needs freaks. Thankfully, Lady Gaga is back Why songwriting makes David Gray emotional and other stories from his back catalog Abel Selaocoe: Tiny Desk Concert Angie Stone, soul singer who broke ground in hip-hop, dies at 63 David Johansen, who fronted the New York Dolls, dies at 75 A 'silent' protest? Haydn and a bunch of chorus girls got there first Conductor Marin Alsop on Trump, the Kennedy Center and why art is bipartisan A music producer found an old record. It opened up a world of Soviet-era disco Musicians’ album protests changes to UK copyright law Detroit closes out Black History Month by honoring iconic legends of jazz and blues Black Gospel Archive fills gaps in gospel music history Why Deep Sea Diver had to start over again to get to 'Billboard Heart'"
