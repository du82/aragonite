esigned to evolve through its on-chain governance mechanism, the efficiency of Tezos is not by accident, but by design. This flexible design means that Tezos can always adapt to future needs and grow in accordance with the needs of the users on the platform. In fact, the Tezos blockchain has increased in energy efficiency on a per transaction basis by at least 70%, with the estimated electricity requirement per transaction being less than 30% in 2021 than what it was in 2020."
