title = "What is Tezos? | Tezos"
description = "Tezos is an open-source platform that addresses key barriers facing blockchain adoption for assets and applications, backed by a global community of validators, researchers, and builders."
full_description = ".css-4a6x12{transition-property:var(--chakra-transition-property-common);transition-duration:var(--chakra-transition-duration-fast);transition-timing-function:var(--chakra-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:none;text-decoration:none;outline:2px solid transparent;outline-offset:2px;color:inherit;}.css-4a6x12:focus-visible,.css-4a6x12[data-focus-visible]{box-shadow:var(--chakra-shadows-outline);}.css-4a6x12:hover,.css-4a6x12[data-hover]{-webkit-text-decoration:none;text-decoration:none;}.css-1neroce{border-bottom:1px solid;border-color:var(--chakra-colors-blue-600);}Stake your tez (XTZ) now to earn 3x rewards.css-whazzy{display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;vertical-align:middle;width:16px;height:16px;fill:none;margin-left:var(--chakra-space-1);margin-bottom:var(--chakra-space-0-5);} Tezos is an open-source platform for assets and applications that can evolve by upgrading itself. Stakeholders govern upgrades to the core protocol, including upgrades to the amendment process itself. Self-amendment allows Tezos to upgrade itself without having to split (“fork”) the network into two different blockchains. This is important as the suggestion or expectation of a fork can divide the community, alter stakeholder incentives, and disrupt the network effects that are formed over time. Because of self-amendment, coordination and execution costs for protocol upgrades are reduced and future innovations can be seamlessly implemented. In Tezos, all stakeholders can participate in governing the protocol. The election cycle provides a formal and systematic procedure for stakeholders to reach agreement on proposed protocol amendments. By combining this on-chain mechanism with self-amendment, Tezos can change this initial election process to adopt better governance mechanisms when they are discovered. Proposed amendments that are accepted by stakeholders can include payment to individuals or groups that improve the protocol. This funding mechanism encourages robust participation and decentralizes the maintenance of the network. Fostering an active, open, and diverse developer ecosystem that is incentivized to contribute to the protocol will facilitate Tezos development and adoption."
