title = "Command Line Interface — Octez & Protocol products documentation"
full_description = '''Command Line Interface# This document is a prettier output of the documentation produced by the command man of the different Octez binaries. You can obtain similar pages using shell commands such as (indicating the appropriate protocol): octez-client -protocol <protocol_hash> man -verbosity 3 The rest of this page documents the protocol-dependent tools. The protocol-independent tools are documented here. Client manual# .cmdline { font-family: monospace }.cmddoc { white-space: pre-wrap ; font-family: monospace; line-height: 170%; margin: 0 0 20px 0 }.cmdline { background: #343131; padding: 2px 8px; border-radius:10px; color: white; margin: 5px; }.cmdline+.cmddoc { margin: -5px 5px 0 20px; padding: 5px }.opt,.arg { background: #343131; font-weight: bold; padding: 2px 4px; border-radius:5px; }.kwd { font-weight: bold; } .opt { color:#CF0; background: #460; } .arg { color: #CEF; background: #369; } Usage octez-client [global options] command [command options] octez-client --help (for global options) octez-client [global options] command --help (for command options) octez-client --version (for version information) To browse the documentation octez-client [global options] man (for a list of commands) octez-client [global options] man -v 3 (for the full manual) Global options (must come before the command) -d --base-dir <path>: client data directory (absent: TEZOS_CLIENT_DIR env) The directory where the Tezos client will store all its data. If absent, its value is the value of the TEZOS_CLIENT_DIR environment variable. If TEZOS_CLIENT_DIR is itself not specified, defaults to $HOME/.tezos-client -n --no-base-dir-warnings: silence warnings about client data directory -c --config-file <path>: configuration file -t --timings: show RPC request times --chain <hash|tag>: chain on which to apply contextual commands (commands dependent on the context associated with the specified chain). Possible tags are 'main' and 'test'. Defaults to `main`. -b --block <hash|level|tag>: block on which to apply contextual commands (commands dependent on the context associated with the specified block). Possible tags include 'head' and 'genesis' +/- an optional offset (e.g. "octez-client -b head-1 get timestamp"). Note that block queried must exist in node's storage. Defaults to `head`. -w --wait <none|<int>>: how many confirmation blocks are needed before an operation is considered included -p --protocol <hash>: use commands of a specific protocol -l --log-requests: log all requests to the node --better-errors: Error reporting is more detailed. Can be used if a call to an RPC fails or if you don't know the input accepted by the RPC. It may happen that the RPC calls take more time however. -A --addr <IP addr|host>: [DEPRECATED: use --endpoint instead] IP address of the node -P --port <number>: [DEPRECATED: use --endpoint instead] RPC port of the node -S --tls: [DEPRECATED: use --endpoint instead] use TLS to connect to node. -m --media-type <json, binary, any or default>: Sets the "media-type" value for the "accept" header for RPC requests to the node. The media accept header indicates to the node which format of data serialisation is supported. Use the value "json" for serialisation to the JSON format. Use the value "binary" for faster but less human-readable binary serialisation format. -E --endpoint <uri>: HTTP(S) endpoint of the node RPC interface; e.g. 'http://localhost:8732' -s --sources <path>: path to JSON file containing sources for --mode light. Example file content: {"min_agreement": 1.0, "uris": ["http://localhost:8732", "https://localhost:8733"]} -R --remote-signer <uri>: URI of the remote signer -f --password-filename <filename>: path to the password filename -M --mode <client|light|mockup|proxy>: how to interact with the node Defaults to `client`. --log-coloring <true|false>: Enable or disable light coloring in default stdout logs. Coloring is enabled by default. Access the documentation octez-client man [keyword...] [-v --verbosity <0|1|2|3>] [--format <plain|colors|html>] Print documentation of commands. Add search keywords to narrow list. Will display only the commands by default, unless [-verbosity <2|3>] is passed or the list of matching commands if less than 3. keyword: keyword to search for If several are given they must all appear in the command. -v --verbosity <0|1|2|3>: level of details 0. Only shows command mnemonics, without documentation. 1. Shows command mnemonics with short descriptions. 2. Show commands and arguments with short descriptions 3. Show everything --format <plain|colors|html>: the manual's output format Defaults to `plain`. Commands for managing FA1.2-compatible smart contracts octez-client check contract contract implements fa1.2 Check that a contract is FA1.2-compatible. contract: name or address of the FA1.2-compatible contract Can be a literal or an alias (autodetected in order). Use 'text:<literal>' or 'alias:<name>' to force. octez-client from fa1.2 contract contract get balance for from [-G --gas <gas>] [--payer <src>] [--unparsing-mode <mode>] Ask for an address's balance offchain contract: name or address of the FA1.2-compatible contract Can be a literal or an alias (autodetected in order). Use 'text:<literal>' or 'alias:<name>' to force. from: name or address of the account to lookup (also the source contract) Can be a literal, an alias, or a key (autodetected in order). Use 'text:<literal>', 'alias:<name>', 'key:<key>' to force. -G --gas <gas>: Initial quantity of gas for typechecking and execution --payer <src>: name of the payer (i.e. SOURCE) contract for the transaction Can be a public key hash name, a file or a raw public key hash literal. If the parameter is not the name of an existing public key hash, the client will look for a file containing a public key hash, and if it does not exist, the argument will be read as a raw public key hash. Use 'alias:<name>', 'file:<path>' or 'text:<literal>' to disable autodetect. --unparsing-mode <mode>: Unparsing mode to use One of "Readable", "Optimized", or "Optimized_legacy". This option affects the way the values of the following Michelson types are represented: - timestamp: the Readable representation is a RFC3339 string, the Optimized and Optimized_legacy representations are the number of seconds since Epoch - key, signature, key_hash, address, contract, chain_id: the Readable representation is a Base58Check string, the Optimized and Optimized_legacy representations are byte sequences - nested pairs: in Readable mode, the Pair constructor is used even with arity bigger than 2 such as in Pair 0 1 2; in Optimized_legacy mode, the Pair constructor is always use with arity 2 such as in Pair 0 (Pair 1 2); in Optimized mode, a sequence is used if there are at least 4 elements and the behavior is the same as in Optimized_legacy mode otherwise. Defaults to `Readable`. octez-client from fa1.2 contract contract get allowance on owner as operator [-G --gas <gas>] [--payer <src>] [--unparsing-mode <mode>] Ask for an address's allowance offchain contract: name or address of the FA1.2-compatible contract Can be a literal or an alias (autodetected in order). Use 'text:<literal>' or 'alias:<name>' to force. owner: name or address of the account giving the allowance Can be a literal, an alias, or a key (autodetected in order). Use 'text:<literal>', 'alias:<name>', 'key:<key>' to force. operator: name or address of the account receiving the allowance Can be a literal, an alias, or a key (autodetected in order). Use 'text:<literal>', 'alias:<name>', 'key:<key>' to force. -G --gas <gas>: Initial quantity of gas for typechecking and execution --payer <src>: name of the payer (i.e. SOURCE) contract for the transaction Can be a public key hash name, a file or a raw public key hash literal. If the parameter is not the name of an existing public key hash, the client will look for a file containing a public key hash, and if it does not exist, the argument will be read as a raw public key hash. Use 'alias:<name>', 'file:<path>' or 'text:<literal>' to disable autodetect. --unparsing-mode <mode>: Unparsing mode to use One of "Readable", "Optimized", or "Optimized_legacy". This option affects the way the values of the following Michelson types are represented: - timestamp: the Readable representation is a RFC3339 string, the Optimized and Optimized_legacy representations are the number of seconds since Epoch - key, signature, key_hash, address, contract, chain_id: the Readable representation is a Base58Check string, the Optimized and Optimized_legacy representations are byte sequences - nested pairs: in Readable mode, the Pair constructor is used even with arity bigger than 2 such as in Pair 0 1 2; in Optimized_legacy mode, the Pair constructor is always use with arity 2 such as in Pair 0 (Pair 1 2); in Optimized mode, a sequence is used if there are at least 4 elements and the behavior is the same as in Optimized_legacy mode otherwise. Defaults to `Readable`. octez-client from fa1.2 contract contract get total supply [-G --gas <gas>] [--payer <src>] [--unparsing-mode <mode>] Ask for the contract's total token supply offchain contract: name or address of the FA1.2-compatible contract Can be a literal or an alias (autodetected in order). Use 'text:<literal>' or 'alias:<name>' to force. -G --gas <gas>: Initial quantity of gas for typechecking and execution --payer <src>: name of the payer (i.e. SOURCE) contract for the transaction Can be a public key hash name, a file or a raw public key hash literal. If the parameter is not the name of an existing public key hash, the client will look for a file containing a public key hash, and if it does not exist, the argument will be read as a raw public key hash. Use 'alias:<name>', 'file:<path>' or 'text:<literal>' to disable autodetect. --unparsing-mode <mode>: Unparsing mode to use One of "Readable", "Optimized", or "Optimized_legacy". This option affects the way the values of the following Michelson types are represented: - timestamp: the Readable representation is a RFC3339 string, the Optimized and Optimized_legacy representations are the number of seconds since Epoch - key, signature, key_hash, address, contract, chain_id: the Readable representation is a Base58Check string, the Optimized and Optimized_legacy representations are byte sequences - nested pairs: in Readable mode, the Pair constructor is used even with arity bigger than 2 such as in Pair 0 1 2; in Optimized_legacy mode, the Pair constructor is always use with arity 2 such as in Pair 0 (Pair 1 2); in Optimized mode, a sequence is used if there are at least 4 elements and the behavior is the same as in Optimized_legacy mode otherwise. Defaults to `Readable`. octez-client from fa1.2 contract contract get balance for from callback on callback [--callback-entrypoint <name>] [--tez-amount <amount>] [--fee <amount>] [-D --dry-run] [--verbose-signing] [-G --gas-limit <amount>] [--safety-guard <extra_gas>] [-S --storage-limit <amount>] [-C --counter <counter>] [-q --no-print-source] [--minimal-fees <amount>] [--minimal-nanotez-per-byte <amount>] [--minimal-nanotez-per-gas-unit <amount>] [--force-low-fee] [--fee-cap <amount>] [--burn-cap <amount>] Ask for an address's balance using a callback contract contract: name or address of the FA1.2-compatible contract Can be a literal or an alias (autodetected in order). Use 'text:<literal>' or 'alias:<name>' to force. from: name or address of the account to lookup (also the source contract) Can be a public key hash name, a file or a raw public key hash literal. If the parameter is not the name of an existing public key hash, the client will look for a file containing a public key hash, and if it does not exist, the argument will be read as a raw public key hash. Use 'alias:<name>', 'file:<path>' or 'text:<literal>' to disable autodetect. callback: name or address of the callback contract Can be a literal, an alias, or a key (autodetected in order). Use 'text:<literal>', 'alias:<name>', 'key:<key>' to force. --callback-entrypoint <name>: Entrypoint the view should use to callback to --tez-amount <amount>: amount in ꜩ Defaults to `0`. --fee <amount>: fee in ꜩ to pay to the baker -D --dry-run: don't inject the operation, just display it --verbose-signing: display extra information before signing the operation -G --gas-limit <amount>: Set the gas limit of the transaction instead of letting the client decide based on a simulation --safety-guard <extra_gas>: Amount of gas to add to value computed by simulation. The gas safety guard allows operations that consume a little more gas than expected to be successful -S --storage-limit <amount>: Set the storage limit of the transaction instead of letting the client decide based on a simulation -C --counter <counter>: Set the counter to be used by the transaction -q --no-print-source: don't print the source code If an error is encountered, the client will print the contract's source code by default. This option disables this behaviour. --minimal-fees <amount>: exclude operations with fees lower than this threshold (in tez) Defaults to `0.0001`. --minimal-nanotez-per-byte <amount>: exclude operations with fees per byte lower than this threshold (in nanotez) Defaults to `1000`. --minimal-nanotez-per-gas-unit <amount>: exclude operations with fees per gas lower than this threshold (in nanotez) Defaults to `100`. --force-low-fee: Don't check that the fee is lower than the estimated default value --fee-cap <amount>: Set the fee cap Defaults to `1.0`. --burn-cap <amount>: Set the burn cap Defaults to `0`. octez-client from fa1.2 contract contract get allowance on from as to callback on callback [--callback-entrypoint <name>] [--tez-amount <amount>] [--fee <amount>] [-D --dry-run] [--verbose-signing] [-G --gas-limit <amount>] [--safety-guard <extra_gas>] [-S --storage-limit <amount>] [-C --counter <counter>] [-q --no-print-source] [--minimal-fees <amount>] [--minimal-nanotez-per-byte <amount>] [--minimal-nanotez-per-gas-unit <amount>] [--force-low-fee] [--fee-cap <amount>] [--burn-cap <amount>] Ask for an address's allowance using a callback contract contract: name or address of the FA1.2-compatible contract Can be a literal or an alias (autodetected in order). Use 'text:<literal>' or 'alias:<name>' to force. from: name or address of the account giving the allowance Can be a public key hash name, a file or a raw public key hash literal. If the parameter is not the name of an existing public key hash, the client will look for a file containing a public key hash, and if it does not exist, the argument will be read as a raw public key hash. Use 'alias:<name>', 'file:<path>' or 'text:<literal>' to disable autodetect. to: name or address of the account receiving the allowance Can be a literal, an alias, or a key (autodetected in order). Use 'text:<literal>', 'alias:<name>', 'key:<key>' to force. callback: name or address of the callback contract Can be a literal, an alias, or a key (autodetected in order). Use'''
