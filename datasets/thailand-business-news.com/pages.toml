["https://www.thailand-business-news.com/banking/197472-the-bank-of-thailand-lowers-its-policy-rate-by-0-25-percentage-points-to-2"]
title = "The Bank of Thailand lowers its policy rate by 0.25 percentage points to 2% - Thailand Business News"
description = "The Monetary Policy Committee (MPC) of the Bank of Thailand has decided to cut the policy rate by 0.25 percentage point to 2.00%, effective immediately"
full_description = 'Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity February 21, 2025 Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity February 21, 2025 Share on LinkedinShare on TwitterShare on Facebook The Monetary Policy Committee (MPC) of the Bank of Thailand, led by Secretary Mr. Sakkapop Panyanukul, decided to cut the policy rate by 0.25 percentage point to 2.00% in their meeting on 26 February 2025.Key PointsThe Monetary Policy Committee (MPC) of the Bank of Thailand has decided to cut the policy rate by 0.25 percentage point to 2.00%, effective immediately, in response to the slower-than-anticipated growth of the Thai economy and increasing downside risks.The Thai economy is expected to grow slower than anticipated due to structural problems in the manufacturing sector and intense competition from imported goods, especially in automotive, petrochemical, and construction materials industries, but the services sector is projected to expand.Headline inflation is expected to stabilize around the lower bound of the target range due to supply and structural factors, such as a downward trend in global crude oil prices and intense price competition from imported goods, while medium-term inflation expectations remain within the target range.Bank of Thailand Makes Surprise Rate CutThe Bank of Thailand unexpectedly cut its key interest rate by 0.25 percentage points to 2% on February 26, 2025, marking its lowest level since July 2023 This decision was made in response to slower-than-anticipated economic growth and increasing downside risksReasons for the Cut: The central bank aimed to better align monetary conditions with prevailing economic trends, inflation, financial system stability, and to address emerging downside risksEconomic Context: The Thai economy is expected to grow slower than anticipated due to structural problems in the manufacturing sector and intense competition from imported goods, particularly in the automotive, petrochemical, and construction materials industriesInflation Outlook: Headline inflation is expected to stabilize around the lower bound of the target range due to supply and structural factors, such as a downward trend in global crude oil prices and intense price competition from imported goodsMonetary Policy Committee (MPC) Vote: Six of the seven-member MPC voted to lower the one-day repurchase rate by a quarter point to 2%, with one member opting to hold the rateThe decision was made to align financial conditions with the economic and inflation outlook as well as financial stability, and to better cope with increasing downside risks to the economy. One member voted to maintain the policy rate due to greater emphasis on preserving monetary policy space to deal with heightened uncertainties.The Bank of Thailand stated that the Thai economy is expected to grow at a slower pace than previously anticipated. This is attributed to structural challenges in manufacturing and increased competition from imported goods, despite support from domestic demand and a strong tourism sector. Additionally, the economy faces elevated risks stemming from the trade policies of major global economies. Headline inflation is projected to stabilize near the lower end of the target range due to both supply-side and structural factors. Financial conditions remain tight, although loan growth and credit quality have shown signs of improvement.The lower policy rate is consistent with the current assessment of the economic outlook and remains robust to risks going forward. The Committee will closely monitor developments in financial and economic outlook.RelatedArticles Thailand to Prohibit Financial Transactions Using Mule Accounts from March 2025 February 27, 2025 Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity February 21, 2025 Asian Equity Market Forecast 2025 February 18, 2025 Debt Relief Program Surpasses 500,000 Registrations February 13, 2025 var jnews_module_197472_0_67c3d4691ff4b={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":197472,"include_category":"241131","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"}; Source : Monetary Policy Committee’s Decision 1/2025Tags: bank of thailandGDP-thailand'
