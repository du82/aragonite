["https://www.thailand-business-news.com/china/197349-trump-seeks-increased-control-over-chip-exports-to-china"]
title = "Trump Seeks Increased Control Over Chip Exports to China - Thailand Business News"
description = "The US is contemplating stricter export controls on specific chips to China and is urging key allies to adopt similar measures for enhanced alignment and strategic interests."
full_description = 'Grab contributed approximately 1% to Thailand’s GDP and generated more than 280,000 new jobs in 2023 February 26, 2025 Grab contributed approximately 1% to Thailand’s GDP and generated more than 280,000 new jobs in 2023 Share on LinkedinShare on TwitterShare on Facebook The US is contemplating stricter export controls on specific chips to China and is urging key allies to support this initiative. This move aims to mitigate security risks and technological competition, reflecting the growing tensions between the US and China over advanced semiconductor technologies. The decision emphasizes the importance of international cooperation in addressing global technology issues.President Donald Trump has intensified calls for greater control over semiconductor exports to China, citing national security concerns. In a recent statement, he expressed the need for the United States to limit access to advanced chip technology that could bolster China’s military and technological capabilities. Trump emphasized that protecting American innovation is crucial in maintaining the country’s competitive edge on the global stage.Trump’s strategy appears to focus on tightening export controls to curb China’s technological advancements, particularly in areas like artificial intelligence and military applications, which rely heavily on cutting-edge chips. This involves not only restricting the types and quantities of chips that companies like Nvidia can export to China without a license but also pressuring allies—such as Japan and the Netherlands—to align their policies with U.S. restrictions. For example, discussions have reportedly occurred with Japanese and Dutch counterparts to limit the maintenance of semiconductor equipment in China by firms like Tokyo Electron and ASML, aiming to hinder China’s ability to sustain its chipmaking capabilities.Trump’s remarks come amid growing bipartisan concerns in Washington over China’s advancements in artificial intelligence, quantum computing, and other emerging technologies. Lawmakers have increasingly pushed for stricter export controls and broader measures to safeguard critical U.S. industries.In his statement, Trump also highlighted the importance of fostering domestic semiconductor manufacturing to reduce reliance on foreign supply chains, which he argued could pose vulnerabilities during geopolitical tensions. He urged policymakers to prioritize investments in research and development, as well as provide incentives for American companies to expand production capabilities at home. “We must ensure that the United States remains the global leader in innovation and technology,” Trump stated, adding that a strong semiconductor industry is vital not only for economic growth but also for national defense.RelatedArticles US Embassy Raises Security Alert in Thailand Following Uyghur Deportation to China March 1, 2025 Thailand Aims to Accelerate Economic Growth Through Increased Chinese Investments March 1, 2025 Asia’s Aerospace Industry: A Growing Power in the Global Space Economy February 27, 2025 Grab contributed approximately 1% to Thailand’s GDP and generated more than 280,000 new jobs in 2023 February 26, 2025 var jnews_module_197349_0_67c3c640181bd={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":197349,"include_category":"456,241646,241972,241666,261,157","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"}; The semiconductor industry is vital not only for consumer electronics but also for military applications, making it a focal point in the U.S.-China rivalry. Trump’s administration had previously enacted similar restrictions, yet he believes current measures are insufficient. He argues for stricter regulations to ensure that critical technologies do not fall into the hands of potential adversaries.This push for tighter controls reflects growing bipartisan concerns about China’s ambitions and its implications for U.S. security. As tensions escalate, discussions surrounding technology exports could reshape the landscape of international trade and cooperation. Advocates argue that safeguarding sensitive technology is paramount, while critics warn that overly stringent measures might disrupt the global supply chain and innovation.Proponents of stricter regulations emphasize the need to protect intellectual property and prevent potential adversaries from gaining a strategic edge. On the other hand, opponents caution that such policies could provoke retaliatory actions, strain diplomatic relations, and hinder the collaborative efforts vital for addressing global challenges like climate change and public health. As policymakers weigh these competing priorities, the outcome could set a precedent for how nations balance economic interests with national security in an increasingly interconnected world.source'
