title = "Grab contributed approximately 1% to Thailand's GDP and generated more than 280,000 new jobs in 2023 - Thailand Business News"
description = "The platform generated 179 billion baht, created over 280,000 jobs, and contributed to a household income of around 24 billion baht."
full_description = 'Share on LinkedinShare on TwitterShare on Facebook A recent study by the Thailand Development Research Institute (TDRI) reveals that digital platforms significantly contribute to Thailand’s economic growth, with the ride-hailing and delivery platform Grab accounting for approximately 1% of the country’s GDP in 2023.Key PointsThe digital platform Grab contributed significantly to Thailand’s economy, generating around 1% of the country’s GDP in 2023, according to a study by the Thailand Development Research Institute (TDRI).Grab’s operations created over 280,000 new jobs and generated approximately 24 billion baht in household income in Thailand.Digital platforms like Grab stimulate growth across multiple sectors in Thailand’s economy, including tourism, automotive, energy, communications, financial services, food, and retail, by fostering wide-ranging economic connections.The platform generated 179 billion baht, created over 280,000 jobs, and contributed to a household income of around 24 billion baht. TDRI research fellow Nonarit Bisonyabut, who conducted the study, chose Grab due to its wide range of services, making it a suitable case study for understanding the comprehensive impact of digital platforms.The study highlighted that Grab’s ecosystem not only supports drivers and delivery partners but also benefits small and medium-sized enterprises (SMEs) by providing them with a digital marketplace to reach more customers. Additionally, the platform’s services have improved consumer convenience and accessibility, particularly in urban areas, further showcasing the transformative role of digital platforms in modern economies.The study demonstrates that these platforms foster economic connections and stimulate growth across multiple sectors, including tourism, automotive, energy, communications, financial services, food, and retail.RelatedArticles Thailand’s Auto Production Declines by 24.6% in January February 28, 2025 Asia’s Aerospace Industry: A Growing Power in the Global Space Economy February 27, 2025 Trump Seeks Increased Control Over Chip Exports to China February 26, 2025 Scam Calls and SMS Skyrocket to 168 Million in 2024 February 25, 2025 var jnews_module_197531_0_67c3dc81f2fd4={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":197531,"include_category":"806,241973,241646,241972,241666","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"}; Tags: grabunicorn'
