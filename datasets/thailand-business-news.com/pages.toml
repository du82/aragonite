["https://www.thailand-business-news.com/asean/singapore/193895-s-reits-secondary-fundraising-set-to-rebound-in-2024-more-expected-to-leverage-capital-markets-next-year"]
title = "Singapore-Listed REITs Set for Secondary Fundraising Growth by 2025 - Thailand Business News"
description = "Singapore-listed real estate investment trusts (S-REITs) have been more active in their equity fundraising (EFR) in 2024"
full_description = 'Thailand Extends Border Service Blackout to Curb Human Trafficking and Criminal Scams February 20, 2025 Share on LinkedinShare on TwitterShare on Facebook Singapore-listed real estate investment trusts (S-REITs) have secured over $2.8 billion through equity fundraising in 2024, driven by notable acquisitions from CapitaLand Integrated Commercial Trust and Keppel DC REIT. These offerings have attracted strong investor interest.The successful fundraising underscores the resilience and appeal of S-REITs as a preferred investment vehicle, particularly in a volatile economic environment. Analysts attribute this robust demand to the strategic acquisitions that enhance portfolio diversification and income stability. CapitaLand Integrated Commercial Trust’s acquisition of prime retail and office assets, alongside Keppel DC REIT’s expansion into high-demand data center markets, has further strengthened investor confidence. Moving forward, industry experts anticipate continued momentum in the sector, supported by favorable market conditions and growing interest in income-generating assets.5 Largest S-REITs’ equity fundraising in 2024-to-dateREITsDate AnnouncedGross Proceeds (S$m unless otherwise)Main use of proceedsCapitaLand Integrated Commercial Trust3-Sep1,108AcquisitionKeppel DC REIT19-Nov1,086AcquisitionFrasers Centrepoint Trust25-Jan200AcquisitionParkway Life REIT22-Oct180AcquisitionDigital Core REIT7-FebUS$120AcquisitionSingapore-listed real estate investment trusts (S-REITs) have been more active in their equity fundraising (EFR) in 2024, with the total amount raised from private placements, and preferential offerings rebounding from levels seen a year ago.As of Dec 13, at least six S-REITs have announced EFR exercises this year, raising over S$2.8 billion, including S$1.6 billion from private placements and S$1.1 billion from preferential offerings. This has exceeded the nearly S$1.9 billion in secondary fundraising by S-REITs in 2023, where activity was relatively muted amid the high-interest rate environment.S-REITs have also been able to raise larger amounts of capital this year, with two S-REITs launching EFR exercises that raised over S$1 billion. Investors have also shown keen interest, with healthy subscription levels in most issuances.RelatedArticles Chart of the Week: Record-Breaking $41 Trillion in Foreign Direct Investment February 24, 2025 Singapore Budget 2025: Implications for Businesses February 22, 2025 Thailand Extends Border Service Blackout to Curb Human Trafficking and Criminal Scams February 20, 2025 Driving Growth through Enhanced Productivity in Brunei Darussalam February 16, 2025 var jnews_module_193895_0_67c3c4257d586={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":193895,"include_category":"364,113,564,540,242081,396,370,241179,364,979,241800,241137,807","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"}; Last month, Keppel DC REIT (KDCR) launched an EFR exercise, seeking to raise around S$1 billion, including S$600 million from a private placement and S$300 million from a preferential offering. It would also issue sponsor subscription units to raise S$85 million.The proceeds would be used to fund KDCR’s proposed acquisition of two AI-ready hyperscale data centres in Singapore, which is expected to be accretive to distributions per unit (DPU).The private placement was 4.0 times covered and the manager increased the size by S$100 million to S$700 million, resulting in the EFR increasing to around S$1.1 billion. The majority of the new private placement units were allocated to long-only investors and real estate specialists. Meanwhile, the preferential offering was also 159.9 per cent subscribed.Elsewhere, CapitaLand Integrated Commercial Trust (CICT) also carried out a billion-dollar EFR this year, raising S$1.1 billion in September, comprising a S$350.3 million private placement and S$757.2 million preferential offering.The proceeds were used to fund the acquisition of a 50 per cent interest in Ion Orchard and its connecting underpass, Ion Orchard Link, from its sponsor CapitaLand Investment. The private placement drew strong demand from new and existing institutional, accredited and other investors and was approximately 3.7 times covered. Its preferential offering was also 130.5 per cent subscribed.Smaller EFRs by most other S-REITs this year have also seen healthy interest from investors.Digital Core REIT announced a private placement in Feb seeking to issue new units at between US$0.60 and US$0.625 to raise gross proceeds of at least US$100 million. Most of the gross proceeds would be used to fund acquisitions. The private placement closed at the upper end of the price range, with the issuance also upsized to US$120 million.Similarly, Parkway Life REIT’s S$180 million private placement in October to fund the acquisition of 11 nursing homes in France was oversubscribed, with strong demand from new and existing institutional and accredited investors.With the pickup in S-REITs’ EFR and acquisition activities, coupled with robust investor interest for recent large issuances, the market would be closely watching for whether the momentum could continue into 2025. Sustained recovery in secondary market fundraising in 2025 could also pave the way for performance in the primary market.DBS Group Research analysts said in a note this month that the S-REITs sector has seen a revival of acquisition deals. They predict that more S-REITs would tap the capital markets to fund acquisitions going into 2025, especially counters in the industrial and data-centre space, which are trading close to book value.For more research and information on Singapore’s REIT sector, visit sgx.com/research-education/sectors for the SREITs & Property Trusts Chartbook.Source : S-Reits’ secondary fundraising rebounds in 2024; more may tap capital markets next yearTags: REITset'
