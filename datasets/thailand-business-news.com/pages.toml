["https://www.thailand-business-news.com/asean/myanmar/193222-thailand-halts-power-supply-to-myanmar-border-areas-to-combat-scam-operations"]
title = "Thailand Halts Power Supply to Myanmar Border Areas to Combat Scam Operations - Thailand Business News"
description = "Thailand plans to halt electricity supply to specific border areas with Myanmar in an effort to dismantle scam operations."
full_description = 'Thailand grapples with a cybersecurity crisis as attacks soar 70% higher than the global average February 24, 2025 Thailand Extends Border Service Blackout to Curb Human Trafficking and Criminal Scams February 20, 2025 Share on LinkedinShare on TwitterShare on Facebook Thailand plans to halt electricity supply to specific border areas with Myanmar in an effort to dismantle scam operations. This move addresses rising concerns over illegal compounds that have ensnared individuals of various nationalities. According to United Nations estimates, these schemes generate billions of dollars annually.Thailand has suspended electricity supply to some border areas with Myanmar to combat scam centers.The decision comes after growing concerns about transnational crime syndicates operating in these areas, including the recent abduction of a Chinese actor.Myanmar has reportedly repatriated over 55,000 foreigners, mostly Chinese, who were forced to work in scam compounds.Thai Deputy Prime Minister Phumtham Wechayachai announced immediate action to cut off electricity, while Prime Minister Paetongtarn Shinawatra emphasized the impact on Thailand’s tourism sector and national image. The move follows the recent abduction and rescue of Chinese actor Wang Xing in the region.The power cuts may target areas including Tachileik, Myawaddy, and Payathonzu. Myanmar’s state media has suggested that basic infrastructure in these areas, including power and internet, is provided by other countries, likely referring to Thailand.Myanmar’s military government claims to have repatriated over 55,000 foreigners, mostly Chinese, who were forced to work in scam compounds since October 2023.RelatedArticles US Embassy Raises Security Alert in Thailand Following Uyghur Deportation to China March 1, 2025 Scam Calls and SMS Skyrocket to 168 Million in 2024 February 25, 2025 Thailand grapples with a cybersecurity crisis as attacks soar 70% higher than the global average February 24, 2025 Thailand Extends Border Service Blackout to Curb Human Trafficking and Criminal Scams February 20, 2025 var jnews_module_193222_0_67c3c418d858b={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":193222,"include_category":"370,244170","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"};'
