title = "Thailand's Auto Production Declines by 24.6% in January - Thailand Business News"
description = "Thailand’s automobile production dropped 24.63% in January from a year earlier, with output falling to 107,103 units, the FTI reported Monday."
full_description = 'Grab contributed approximately 1% to Thailand’s GDP and generated more than 280,000 new jobs in 2023 February 26, 2025 Thailand’s Cabinet Takes Action to Position the Nation as a Premier Global Financial Hub February 10, 2025 Grab contributed approximately 1% to Thailand’s GDP and generated more than 280,000 new jobs in 2023 February 26, 2025 Share on LinkedinShare on TwitterShare on Facebook Thailand’s automobile production dropped 24.63% in January from a year earlier, with output falling to 107,103 units, the FTI reported Monday.Key takeawaysThailand’s auto production plunged 24.63% in January, marking the 18th consecutive month of decline.Domestic sales fell 12.26% and exports dropped 28.13%, hit by weak demand and rising competition from Chinese automakers.The industry awaits government measures to ease auto loan restrictions and monitors potential U.S. auto tariffs.The steep drop was attributed to weak domestic demand and sluggish exports, exacerbating concerns over the industry’s prolonged downturn.As Southeast Asia’s largest automotive manufacturing hub, Thailand serves as a key export base for major global automakers, including Toyota and Honda. However, the latest figures mark the 18th consecutive month of declining production, underscoring the mounting challenges facing the sector.The downturn in output was more severe than December’s 17.37% year-on-year drop, reflecting deepening industry woes.RelatedArticles Grab contributed approximately 1% to Thailand’s GDP and generated more than 280,000 new jobs in 2023 February 26, 2025 Thailand’s electric vehicle market projected to grow by 40% in 2025 February 19, 2025 Thailand’s Cabinet Takes Action to Position the Nation as a Premier Global Financial Hub February 10, 2025 Thailand’s Car Production Drops by 20% in 2024, Reaching a Four-Year Low January 31, 2025 var jnews_module_197171_0_67c3da3516ddb={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":197171,"include_category":"806","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"}; Domestic sales and exports in freefallThailand’s domestic auto sales also slumped, declining 12.26% in January to 48,092 units, following a 20.94% drop in December. The persistent weakness in sales is largely attributed to stricter auto loan conditions, as high household debt continues to strain consumer purchasing power.Meanwhile, exports took a dramatic hit, plunging 28.13% year-on-year to 62,321 units, the lowest level in 33 months. The export downturn, significantly steeper than December’s 15.46% contraction, is being driven by increased competition from Chinese automakers, according to Surapong.In 2023, Australia, the Philippines, and Japan remained Thailand’s top three auto export destinations, though the latest figures signal growing pressure on the country’s export-driven automotive sector.With the sector struggling, the FTI is closely monitoring upcoming government measures aimed at easing auto loan restrictions, which could help revive domestic demand.Additionally, U.S. trade policy looms as a potential disruptor, with concerns over potential auto tariffs that could further rattle global markets.Earlier this month, former U.S. President Donald Trump announced that tariffs on automobiles could take effect as soon as April 2, a move that may have significant repercussions for automakers worldwide.As Thailand’s auto industry grapples with persistent headwinds, stakeholders remain on edge, awaiting policy interventions that could help stabilize one of the country’s most crucial economic sectors.Tags: automobilecarsexportsproduction'
