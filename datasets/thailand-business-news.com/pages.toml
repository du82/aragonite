["https://www.thailand-business-news.com/banking/197770-thailand-to-prohibit-financial-transactions-using-mule-accounts-from-march-2025"]
title = "Thailand to Prohibit Financial Transactions Using Mule Accounts from March 2025 - Thailand Business News"
description = "The Bank of Thailand has ordered the banking sector to prohibit financial transactions linked to mule accounts, mandating full compliance by March 2025."
full_description = 'Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity February 21, 2025 Thai government launches legal actions against nominee structures and foreign-operated businesses February 20, 2025 Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity February 21, 2025 Share on LinkedinShare on TwitterShare on Facebook The Bank of Thailand has ordered the banking sector to prohibit financial transactions linked to mule accounts, mandating full compliance by March 2025.The banking industry in Thailand is set to fully implement a ban on financial transactions involving various categories of mule accounts by March 2025, in compliance with the Bank of Thailand’s directive.Banks have already taken measures to combat financial crime, including blocking money transfers to high-risk accounts and closing over 1.8 million mule accounts, with further regulations to prohibit the opening of new corporate mule accounts.The government and private sector, including banks, telecommunications companies, and digital platforms, are collaborating comprehensively to tackle financial scams, enhance security systems, and prevent the use of mule accounts.The ban covers money transfers to and from three additional categories of mule accounts, as well as prohibiting individuals linked to mule accounts from opening new deposit accounts. The Thai Bankers’ Association has established the Central Fraud Registry to share mule account data among banks, resulting in the closure of over 1.8 million mule accounts.The government and private sector are collaborating to combat financial crime and prevent the use of mule accounts, with banks already blocking money transfers to high-risk accounts. The government has also suspended power supply to certain border areas near Myanmar to curb scam operations. The banking sector is committed to working with all relevant parties to fight financial crime and enhance security systems.In addition, authorities are implementing advanced monitoring systems to detect suspicious activities more effectively. Law enforcement agencies are conducting targeted raids on suspected scam hubs, while public awareness campaigns are being launched to educate citizens about the risks of financial fraud. Collaborative efforts between international organizations are also being strengthened to address cross-border financial crimes. These measures aim to create a safer financial environment and restore public trust in the system.RelatedArticles The Bank of Thailand lowers its policy rate by 0.25 percentage points to 2% February 26, 2025 Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity February 21, 2025 Thai government launches legal actions against nominee structures and foreign-operated businesses February 20, 2025 Asian Equity Market Forecast 2025 February 18, 2025 var jnews_module_197770_0_67c3da9b8be32={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":197770,"include_category":"241131,241635","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_