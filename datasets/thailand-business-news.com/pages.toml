title = "Thai Banking System Quarterly Update: Robust Performance with Solid Capital and Liquidity - Thailand Business News"
description = "The Thai banking system is resilient with strong capital and liquidity levels. Profitability improved in 2024 but there are concerns about debt serviceability for SMEs and households, and business competitiveness."
full_description = 'Share on LinkedinShare on TwitterShare on Facebook The Thai banking system is resilient with strong capital and liquidity levels. Profitability improved in 2024 but there are concerns about debt serviceability for SMEs and households, and business competitiveness.SummaryThe Thai banking system remains resilient with robust levels of capital, loan loss provisions, and liquidity. The banking system’s profitability in 2024 improved from the previous year.Nonetheless, there remains a need to monitor the debt serviceability of SMEs and certain households facing slower income recovery and high debt burdens, businesses affected by structural issues and declining competitiveness, as well as the effectiveness of the assistance measures under the “Khun Soo, Rao Chuay” program. The Thai banking system remains resilient with robust levels of capital, loan loss provisions, and liquidity. In the fourth quarter of 2024, loan growth in the banking system (licensed banks and their subsidiaries) contracted by 0.4% year-on-year, an improvement from the 2.0% contraction in the previous quarter. This was driven by loan expansion among large corporates, while SMEs loans contracted at a slower pace.Consumer loans continued to decline, particularly auto loans, which were affected by structural issues and slow income recovery among vulnerable segments. The banking system’s NPL[1] in the fourth quarter of 2024 decreased to 552.1 billion Baht, reducing the NPL ratio to 2.78%. This decline was primarily attributed to business loans, partly driven by banks’ loan portfolio management, ongoing debt assistance, and the reclassification of certain NPL debtors who resumed repayments under debt restructuring obligations to stage 2 loans.[2] In addition, qualitative criteria in asset classification of business loans contributed to an increase in stage 2 loans, which rose to 6.98%. The banking system’s profitability in 2024 improved from the previous year, mainly driven by higher non-interest income (mainly from FVTPL) and net interest income, coupled with lower provisioning expenses following elevated provisioning in the previous year.Nonetheless, there remains a need to monitor the debt serviceability of SMEs and certain households facing slower income recovery and high debt burdens, businesses affected by structural issues and declining competitiveness, as well as the effectiveness of the assistance measures under the “Khun Soo, Rao Chuay” program.RelatedArticles Thailand to Prohibit Financial Transactions Using Mule Accounts from March 2025 February 27, 2025 The Bank of Thailand lowers its policy rate by 0.25 percentage points to 2% February 26, 2025 Asian Equity Market Forecast 2025 February 18, 2025 Debt Relief Program Surpasses 500,000 Registrations February 13, 2025 var jnews_module_196594_0_67c3e024d099c={"header_icon":"","first_title":"Related","second_title":"Articles","url":"","header_type":"heading_6","header_background":"","header_secondary_background":"","header_text_color":"","header_line_color":"","header_accent_color":"","header_filter_category":"","header_filter_author":"","header_filter_tag":"","header_filter_cpt_product_brand":"","header_filter_cpt_product_cat":"","header_filter_cpt_product_tag":"","header_filter_cpt_category":"","header_filter_cpt_post_tag":"","header_filter_cpt_cryptocurrency":"","header_filter_text":"All","sticky_post":false,"post_type":"post","content_type":"all","sponsor":false,"number_post":"4","post_offset":0,"unique_content":"disable","include_post":"","included_only":false,"exclude_post":196594,"include_category":"241131","exclude_category":"","include_author":"","include_tag":"","exclude_tag":"","product_brand":"","product_cat":"","product_tag":"","category":"","post_tag":"","cryptocurrency":"","sort_by":"latest","date_format":"default","date_format_custom":"","force_normal_image_load":"","main_custom_image_size":"default","pagination_mode":"disable","pagination_nextprev_showtext":"","pagination_number_post":"4","pagination_scroll_limit":0,"boxed":"","boxed_shadow":"","el_id":"","el_class":"","scheme":"","column_width":"auto","title_color":"","accent_color":"","alt_color":"","excerpt_color":"","css":"","paged":1,"column_class":"jeg_col_2o3","class":"jnews_block_20"}; The household debt to GDP ratio in the third quarter of 2024 decreased from the previous quarter, driven by a slowdown in household debt. Meanwhile, the corporate debt to GDP ratio decreased due to contractions in loans and debt securities. Overall corporate profitability decreased from the previous year, particularly in the manufacturing sector, despite positive contributions from the tourism sector.[1] Gross non-performing loans (NPL or stage 3)[2] The ratio of loans with a significant increase in credit risk (SICR or stage 2)Source : https://www.bot.or.th/en/news-and-media/news/news-20250218.htmlTags: bank of thailandBOT'
