description = "Video tutorial installing GNU Guix, using NonGuix."
full_description = "Home » PostsInstalling GNU Guix | Using non-free drivers (NonGuix) [Video]Video tutorial installing GNU Guix, using NonGuix.2024/12/04Table of ContentsDownload nonguix isoClone nonguix repoInstall Your SystemI’ve just uploaded a video on Installing GNU Guix, which you can find here.Notes shown in the video:GNU Guix is a GNU distributionProvides an emacs-like operating system, using guile scheme as it’s configuration language.Only free software is available OOB, uses linux-libre kernel by default.But since it’s an emacs-like OS, we can configure it however we like, including to use the full linux kernel.Installing Guix, using NonGuix#NonGuix is a Guix channel that provides non-free software, such as non-free drivers & games.NonGuix also provides an iso image that comes with the full linux kernelDownload nonguix iso#Visit nonguix releases pageDownload the iso image & write it to a USB stickExample dd command to use:$ sudo dd if=/path/to/image.iso of=/dev/sdX bs=4M status=progress Clone nonguix repo#After completing the graphical installerClone nonguix repo from https://gitlab.com/nonguix/nonguixCopy the README instructions for channels into /mnt/etc/channels.scmAdd NonGuix modules to your system configuration and use the linux-lts kernel on /mnt/etc/config.scm;; Import nonfree linux module. (use-modules (nongnu packages linux) (nongnu system linux-initrd)) (operating-system (kernel linux-lts) (initrd microcode-initrd) (firmware (list linux-firmware)) ... ) Install Your System#Run the following command to install your system:$ guix time-machine -C /mnt/etc/channels.scm -- system init /mnt/etc/config.scm /mnt Linux« PrevEmacs 30 Built-in Completion UI & Styles [Video] Next »org-gnosis | Roam-like note taking system"
