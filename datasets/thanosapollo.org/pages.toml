["https://thanosapollo.org/categories/self-host"]
title = "Self-Host | Thanos Apollo"
description = "Thanos Apollo Personal Website"
full_description = "XMPP: Getting started with the universal communication standardXMPP is a libre decentralized collection of technologies, alternative to closed communication services. I’ve started self hosting my own xmpp server, and begun moving people from my close circle there. This is a summary of my collection of notes that I made for XMPP thus far, published as a short article. If you are interested in learning more on XMPP I recommend reading their official website. What is XMPP? XMPP stands for eXtensible Messaging and Presence Protocol, it’s a set of libre technologies that can be used for communication services, such as instant messaging, voice & video calls as well as file transfers. This is done by routing XML data. ...2024/04/30 · Thanos Apollo Jellyfin: Powering the Self-Hosted Media RevolutionJellyfin is my favorite service to self host, I’ve been using it for movies & books and I’d even consider using it for photos if not for Immich. Jellyfin is really popular as a self hosted streaming service for movies & TV shows, since those platforms suffer heavily from enshittification. Jellyfin can do much more than stream your favorite movies & TV shows. Whether you’re a movie enthusiast, music lover, or photo fanatic, Jellyfin has got you covered. ...2024/04/04 · Thanos Apollo Immich: Self-hosted Photo & Video ManagementI’ve recently transitioned to a pixel phone with GrapheneOS as my primary device, moving from an iPhone. The only thing that I was missing is having my photos be in sync across all of my devices using iCloud, but despite the convenience of Apple’s iCloud service for syncing photos across devices, it frequently disregards user rights and privacy. Thankfully, Immich offers a self-hosted and enhanced alternative while respecting my privacy & user rights. ...2024/03/25 · Thanos Apollo Cloudflare Tunnel: Bye Bye VPS Services!VPS services, the pinnacle of freedom in the digital world! Nothing quite beats the thrill of entrusting your data and services to a mysterious cloud entity, all while relinquishing control over your hardware. And do not forget the joy of relying on a third-party cloud provider for your hosting needs, that may send you a 104K bill for your static site. Who needs to own their hardware anyway? My new setup For the past ~6 months, I have been relying on a VPS service from Ionos, which offers a decent service for it’s price plans, to host this site & my git server, as well as to occasionally port forward media services such as jellyfin using an ssh tunnel. This weekend, I opted to migrate to an old thinkpad that I had collecting dust plus cloudflare tunnel. ...2024/03/10 · Thanos Apollo"
