full_description = "Emacs As Your Terminal Emulator [Video]Just published a short video on Emacs shell interactions, which you can view here. The following content is the video notes showcased in the video. ...2025/01/25 Progress update on org-gnosis & a graphical interface addition.I’ve been working on a “roam-like” note taking system, to replace & update my current org-roam workflow. This post is a minor update on the current state of it’s development. ...2024/12/18 Emacs 30 Built-in Completion UI & Styles [Video]I just uploaded a short video about Emacs 30 Built-in Completion UI & Styles, which you have find here. Video notes: When referring to “Emacs Completions”, I refer to Completion Styles & UI I’ve often relied on third-party packages to emulate features from other text editors. For instance, I’ve long used vertico, corfu and orderless. While I still recommend these packages, I became curious about using Emacs without depending on third-party options. My current setup tries to emulate my workflow with the packages mentioned above. The catalyst that pushed me to try the built-in completion is the addition of completion-preview-mode in Emacs 30. Mini-buffer completions Emacs does not enable “vertical” completions for the mini-buffer by default, but you can enable fido-vertical-mode which comes built-in with Emacs. fido-mode is an enhanced icomplete-mode that emulates ido-mode, also referred to as fake ido-mode. Completion Styles Changing completion-styles example: (setf completion-styles '(basic flex)) There is a plethora of completion styles, builtin styles include flex, which provides “fuzzy” completions. Completion UI & Code completions Emacs built-in completions have a distinctive approach. Instead of displaying a popup at point, a new Completions buffer appears when invoking completion-at-point. Example configuration: ...2024/12/12 Installing GNU Guix | Using non-free drivers (NonGuix) [Video]I’ve just uploaded a video on Installing GNU Guix, which you can find here. Notes shown in the video: GNU Guix is a GNU distribution Provides an emacs-like operating system, using guile scheme as it’s configuration language. Only free software is available OOB, uses linux-libre kernel by default. But since it’s an emacs-like OS, we can configure it however we like, including to use the full linux kernel. Installing Guix, using NonGuix NonGuix is a Guix channel that provides non-free software, such as non-free drivers & games. NonGuix also provides an iso image that comes with the full linux kernel Download nonguix iso Visit nonguix releases page Download the iso image & write it to a USB stick Example dd command to use: ...2024/12/04"
