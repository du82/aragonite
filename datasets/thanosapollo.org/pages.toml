["https://thanosapollo.org/projects/gnosis"]
title = "Gnosis | Spaced Repetition System for GNU Emacs | Thanos Apollo"
description = "Spaced Repetition System for GNU Emacs."
full_description = 'Home » ProjectsGnosis | Spaced Repetition System for GNU EmacsSpaced Repetition System for GNU Emacs.Table of ContentsAboutScreenshotsInstallationGNU Emacs Spaced Repetition System for note taking and self testing.Git repositories:Main RepositoryCodeberg MirrorManual:NonGNU ELPAMirrorAbout#Gnosis (γνῶσις) is a spaced repetition system designed to enhance memory retention through active recall. It uses a Q&A format, with each note comprising a question, answer, and explanation. Notes are reviewed at optimally spaced intervals determined by the user’s recall success or failure. Writing out answers during reviews fosters deeper understanding and significantly improves memory retention.Gnosis algorithm is highly adjustable, allowing users to set specific values not just for note decks but for tags as well.Currently supported note types:Cloze Support for multiple clozes includedMCQMC-Cloze Multiple Choice ClozeBasicDoubley-or-nScreenshots#Basic note review#Basic note answer evaluation#Cloze note type review#Cloze note answer evaluation#Installation#Gnosis is available via NonGNU ELPA, MELPA & GNU GuixExample using use-package(use-package gnosis :ensure t :config (gnosis-modeline-mode) :bind (("C-c g" . gnosis-dashboard))) After installing gnosis, it’s recommended to try out the demo by running M-x gnosis-demo'
