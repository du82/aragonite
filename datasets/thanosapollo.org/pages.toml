full_description = "Gnosis User ManualGnosis is a customizable spaced repetition system designed to enhance memory retention through active recall. It allows users to set specific review intervals for note decks & tags, creating an optimal learning environment tailored to each specific topic. This manual is written for Gnosis version 0.4.0, released on 2024-08-7. Official manual: https://thanosapollo.org/user-manual/gnosis Git repositories: https://git.thanosapollo.org/gnosis 1 Introduction Gnosis (γνῶσις) is a spaced repetition system that enhances memory retention through active recall. It employs a Q&A format, where each note consists of a question, answer, and explanation. Notes are reviewed at optimally spaced intervals based on the user’s success or failure to recall the answer. Key benefits arise from writing out answers when reviewing notes, fostering deeper understanding and improved memory retention. ...Thanos Apollo Org Gnosis User ManualThis manual, authored by Thanos Apollo, offers installation instructions, customization options, and recommendations for effectively using org-gnosis. The documentation furnished herein corresponds to stable version 0.0.5, released on 2025-02-13. Name: Org Gnosis | Organization Of Gnosis (knowledge/information) Homepage: https://thanosapollo.org/projects/org-gnosis/ Org Gnosis (GNU-sis) is an org-mode parsing tool that organizes notes as atomic nodes in an SQLite database. Each heading with an ID is treated as an atomic note (node), storing its metadata, such as title and links, in a relational database to facilitate efficient linking and navigation. ...Thanos Apollo"
