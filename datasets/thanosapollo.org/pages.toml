["https://thanosapollo.org/posts/org-gnosis-progress-1"]
title = "Progress update on org-gnosis & a graphical interface addition. | Thanos Apollo"
description = "Progress update on org-gnosis, a roam-like note taking system."
full_description = "Home » PostsProgress update on org-gnosis & a graphical interface addition.Progress update on org-gnosis, a roam-like note taking system.2024/12/18Table of ContentsGoalsHow things are goingI’ve been working on a “roam-like” note taking system, to replace & update my current org-roam workflow. This post is a minor update on the current state of it’s development.org-gnosis node & my fork of org-roam-uiProject Name: org-gnosis | Organization of GnosisGoals#The goals of org-gnosis are as follows:Keep it minimal, only implement parsing & input data to a database.Do not want to exceed 700 lines of code, currently it’s at 490.Incorporate nodes as sources for gnosis notes.Having nodes as sources can replace my extras section.Make it easily extensibleParsing functionality of org-gnosis should be easily customized to work with other note taking tools.Separate journals from note takingHow things are going#The goals above have been achieved, except for the incorporation with my SRS system & it’s customization to parse non org-mode buffers can be kinda tricky. Despite that, it has been a drop-in replacement for my previous org-roam workflow.I’ve also created a fork of org-roam-ui that I’ve been using to visualize my notes. I will be testing this package and hopefully publishing on either nongnu elpa or melpa soon.If you are interested, try it out from this repo here. If you find any issues or got any questions feel free to email me.LearningGnosis« PrevEmacs As Your Terminal Emulator [Video] Next »Emacs 30 Built-in Completion UI & Styles [Video]"
