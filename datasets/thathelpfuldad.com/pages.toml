title = "Big Green Egg Accessories – Reviews and Tips for 200+ Best Accessories for your Big Green Egg – That Helpful Dad"
description = "Are you an Egghead? Whether you're a long-time owner of a Big Green Egg or a newbie, this article can help you. We'll discuss which accessories are the best to buy for your BGE and why. Here's a list of over 200 Big Green Egg accessories that will take your cooks to the next level. …"
full_description = "Big Green Egg Accessories – Reviews and Tips for 200+ Best Accessories for your Big Green Egg Are you an Egghead? Whether you’re a long-time owner of a Big Green Egg or a newbie, this article can help you. We’ll discuss which accessories are the best to buy for your BGE and why. Here’s a list of over 200 Big Green Egg accessories that will take your cooks to the next level. Table of Contents Here’s how this page is organized: Top 10 Must Have Accessories (Highest Priority Items to buy for your Big Green Egg, especially if you are just getting started)Cookbooks and Kamado Manuals to help you learn how to use the Big Green Egg. Cooking Surfaces for the Big Green Egg – including a discussion of the Eggspander and the KJ Divide & Conquer System, the best pizza accessories for the Big Green Egg, using the JoeTisserie in your BGE, and more. Ash Baskets – what it is and why you need.Temperature Controls, Thermometers, and Remote Temperature Probes.Fire Supplies: Lump Charcoal, Smoking Wood Chips, Electric Lighters, Gloves, and more.Tools: Knives, Cutting Boards, Tongs, Claws, Rib Racks, Grate Grippers, and other BBQ Tools.Cleaning Products, Grill Mats, etc.Custom tables, covers, and vent caps. SWAG: Big Green Egg Aprons and t-shirts.Big Green Egg Replacement Parts New Eggheads Start Here Before you even consider buying any accessories it’s important to understand… There IS a learning curve when it comes to kamado grill cooking on your Big Green Egg. And it’s a continuous learning process. Do yourself a favor and don’t try to figure it all out on your own – you’ll just end up burning a lot of food and getting frustrated. But it doesn’t have to be that way. There are a number of good books out there that can help you master kamado cooking on your Big Green Egg and speed up your BGE Mastery learning curve. Here are two of my favorites books – they provide some awesome kamado grill recipes as well as MANY helpful tips. 1-Hot Coals: Mastering your Kamado Grill 2-Smoke it Like a Pro on the Big Green Egg. After you get these two books, THEN you will be better prepared to actually use your new cooking accessories correctly… Best Cooking Surfaces for the Big Green Egg 1-Flexible Cooking System(#1 MUST HAVE ITEM ON THIS PAGE) This accessory will change the way you use your BGE and for that reason it is my #1 MUST HAVE Accessory for the Big Green Egg (or any kamado). Let’s face it the Big Green Egg is the #1 most popular kamado on the market for a reason – the quality is awesome, the reputation is well-earned, and the Egghead community is the strongest of any kamado cooking group. BUT, if we’re honest with ourselves, BGE users shouldn’t be afraid to admit that even though Kamado Joe is a competitor KJ has made some great accessories over the years – perhaps the best of all time is their Flexible Cooking System called “The Divide and Conquer” system. Check out the theory behind the Divide and Conquer Flexible Cooking System… A picture tells a 1,000 words in this case right? amzn_assoc_tracking_id = “thathelpfulda-20”; amzn_assoc_ad_mode = “manual”; amzn_assoc_ad_type = “smart”; amzn_assoc_marketplace = “amazon”; amzn_assoc_region = “US”; amzn_assoc_design = “enhanced_links”; amzn_assoc_asins = “B01GFYW52A”; amzn_assoc_placement = “adunit”; amzn_assoc_linkid = “3df9fab8eed4c2768f19ba67df4a0e4c”; //z-na.amazon-adsystem.com/widgets/onejs?MarketPlace=US You can use a Flexible Cooking System in your BGE and you’ll be able to… Cook HighCook LowCook both Direct AND Indirect at the same timeAnd gain a world of flexibility. KJ’s Divide and Conquer system has been so successful that BGE made their own “Flexible Cooking System” and called it the EGGspander. The Big Green Egg EGGSpander Flexible Cooking System Check prices for the BGE Eggspander on Amazon. After you make a decision on which flexible cooking system to buy, next get some Half Moon Heat Deflectors so you can to cook both Direct and Indirect at the same time or just because they are easier to use than the traditional bulky BGE place setter (aka “The convEGGtor”) Then get these additions to conveniently hold your drip pans and/or allow you to cook higher up in the dome – which is really useful for pizza cooking too so you can avoid burning the crust. Finally, for even more cooking space and another higher level add these… 2-Cast Iron Griddle Now that you have a Flexible Cooking System in your Big Green Egg tou’re going to quickly learn that the standard stainless steel cooking grates just don’t cut it for certain foods. You want to get a good sear on steaks? Cook scallops? Griddle up some bacon and eggs? Then you’ll want a cast-iron griddle. Sure you could use a cast-iron pan but these griddles fit into your BGE and give you some great flexibility too. Now if you can afford to get both the cast iron grates and the cast iron griddle for your BGE, you’ll be really happy, but if you have to prioritize then get the cast iron griddle first because it adds so many more options to your cooks. I’ve got a few options for you to pick from. Personally I prefer using the half-moon Cast Iron Griddle made by Kamado Joe – it’s 1/3 of the price of the BGE version! If for some reason you want a stainless steel griddle, you do have an option – Little Griddle makes a nice half-moon griddle specifically for the Kamado. It’s super easy to clean and has a convenient grease trough. 3-Cast Iron Grates Although the cast-iron griddle is basically a ‘must-have’ for your Big Green Egg, the grates are more of a nice-to-have item in my opinion. Don’t get me wrong. I have the grates and I use them all the time for burgers, the indirect portion of steak grills, and more. Remember, if you have to prioritize, get the griddle first, then the grates. When you’re ready for cast iron grates, consider the Kamado Joe Cast Iron Grates (used in combo with the KJ Flexible Cooking System – the beauty of it is you can use use the griddle for direct searing and then have the grates over a half-moon heat deflector for the indirect cook portion. Bonus!) 4. Even More Cooking Surfaces A Quality Grilling Basket Do you need it? I think so. Particularly when you get a basket with a removable handle it allows you to turn fish, veggies, and delicate items easily – saving time, hassle, AND protecting your food. A Good Dutch Oven Even if you have the cast-iron griddle and grates you’ll benefit from a quality dutch oven. You can never have too much cast-iron right? But seriously, the reason you’ll want a dutch oven is because by putting a dutch oven in your Big Green Egg (and learning how to use is safely) you can BAKE and FRY inside your BGE! There’s really one one brand here to consider – The Lodge. PIZZA in the BIG GREEN EGG One of my family and friends’ favorite things in a kamado is wood-fired pizzas. They’re fun to make, taste great, and easy to do. For this reason I consider a Pizza Stone to be a must-have accessory for your BGE. Here are a few options. The BGE stone is ridiculously expensive so do a bit of research about your options and you may be able to save some money – just make sure it’s a quality stone that won’t crack on you! After you get the stone, then get one or more of these helpful pizza accessories. Don’t overlook the Elements of Pizza cookbook here too. Soapstone Surface What the heck is soapstone and why do I need it? Soapstone is great for cooking more delicate items like fish and veggies that you don’t want to put in a basket or cedar plank but do want to have directly on a cooking surface. Soapstone is bacteria and stain-resistant and may give you fewer flareups even though the meat cooks in its own juices. People also like using this surface for ‘smash burgers’ too. We’ve gotta give credit to KJ again here because they make the best version of this item – another half-moon surface that fits the Flexible Cooking System. CEDAR PLANK COOKING You can’t go wrong with cooking fish on cedar plank – but cedar can be used for veggies and meats too. BEST ROTISSERIE for the Big Green Egg This is a Top 10 MUST HAVE Accessory for your Big Green Egg. While a few companies are making a rotisserie for the BGE, there’s really only one to consider here – the “JoeTisserie.” It’s proven to work in the BGE and work well. Check current price for the Joetisserie on Amazon Get the JoeTisserie and turn your kamado into a rotisserie-style cooker and take your cooks to the next level. The JoeTisserie is not just for cooking chicken, you can also use it for some great Brazilian-style steak, pork, and more. BONUS – add a grilling basket to the JoeTisserie and cook wings, veggies, and expand your game even further. Other Useful Cooking Pans and Drip Pans for the Big Green Egg An assortment of useful cooking pans that sit on the grates and/or don’t necessarily attach to the racks. Item #1 (The Plancha) is super popular and highly useful. BTW all of these are “BGE” official brand. All About ASH BASKETS What is an Ash Basket and why might you want one for your Big Green Egg? An Ash Basket lets you simply lift out used charcoal and ash before every cook and it is reported to increase air flow around your lump charcoal in your Egg. When you use an ash basket you can dispose of ashes and be ready for your next cook in seconds—no muss, no fuss. Just lift the ash basket out and give it a few shakes in your grill or over a trash can (make sure the fire is completely out!), then set the ash basket back in place, add some fresh charcoal, and you’re ready to go in seconds. Spaces between the ash basket’s rings allow the small particles to fall through when you shake the ashes out. You can start each cook with an ideal fuel load, whether you’re searing steaks or going low and slow. You get easier starts and more even burning for ultimate temperature control. The most popular choice, by far, in ash baskets for the BGE is the Kick Ash Basket. Don’t overthink this one and get a lesser brand that’s gonna be lesser quality. You’ll use this in every cook and you’ll want it to hold up over time. Get the Kick Ash and be done with it. Don’t Forget the ASH TOOLS too. Temperature Controls, Thermometers, & Remote Temp Probes for the Big Green Egg EGG Genius (Remote Temp Controls) Most Eggheads will agree that kamado cooking is an art, not a science, however if you want to get pinpoint accuracy with your cooks the EGG Genius may be for you. BGE says “The EGG Genius effortlessly controls the temperature of your EGG through your smartphone, tablet or computer. Remotely manage and monitor cooking temperatures for worry-free cooking, monitor the temperature of your food, view graphs of your cooks … and even receive alerts when your cook is finished or when the EGG temperature is too high or low.” Can you say, Wow? Remote Probe Thermometer As I mentioned in the Top 10 List, a good remote thermometer with remote probes that won’t break the bank is a must have item. If you can afford an Egg Genius then you won’t need these, but if the Genius is out of your budget or you want to have more manual control of the ‘art’ of kamado cooking (but with just a little help) then get one of these options. Other Thermometers You’ll need a quality instant thermometer as well as a “Candy” thermometer if you want to monitor frying oils, etc. And don’t overlook the Temperature “Gun” for checking surface temps accurately on your grill cooking surfaces and so much more (I use it all the time). Best Lump Charcoal, Fire Starters, and Smoking Wood for your Big Green Egg Quality Lump Charcoal You wouldn’t drive a BMW on junk tires would you? Then why are you using crappy lump in your Big Green Egg? Now I know there are a lot of charcoal options out there when it comes to kamado grilling and there’s even a list of quality options on the Naked Whiz Database, but for my money, I believe in the Kamado Joe Lump Charcoal brand – specifically the Big Block XL version. Why? Because not only is the bag filled with really big lumps of charcoal, but even more importantly, the type of wood used is a combination of various hardwoods so you get a great flavor but not an overpowering flavor. (If you’ve ever used lump charcoal that is primarily made with hickory then you know what I mean). The KJ-Char is great for kamado grill cooking in your Big Green Egg because you can use it for all types of food – from pizza, to chicken, to beefs, to pork, and fish. It works for all of it and it compliments it all well. Using KJ-Char as your base also gives you the flexibility to then add your own wood chips to add additional specific flavors (cherry, pecan, apple, etc) depending on what you’re cooking. Helpful Dad’s Tip: Walmart also has some good buys on charcoal – this includes 20-lb Royal Oak for around $15-20/bag and a new line called Western which is only $10 for a 30-lb bag! Both are pretty good options in my book. Smoking Wood Chips I’m sure you already know that your Big Green Egg is a powerhouse of a smoker – capable of both hot and cold smoking. While a quality lump will give you great flavor to begin with, if you want to impart true ‘smoke’ flavor into your meats you’re gonna need quality smoking wood too. Consider these options… As an alternative to using chips or chucks, many BGE owners like the simplicity and control of ‘maze’ style smokers that use concentrated wood chips. A-Maze-N is the brand you want for this option. You can get the full maze or just a single tube. Then you’ll need the pellets too (see below). Fire Starter Alternatives. If you don’t want to use the Electric Fire Starter I recommended above, then consider these other options to light your Big Green Egg… Knives, Cutting Boards, Tools, Tongs, Claws, and More All of these are nice to have accessories for your Big Green Egg. Lets Start with KNIVES If you can’t afford to get a set or don’t want one, then focus on getting a quality chef’s knife, a Filet/Boning Knife, A Brisket Slicing Style knife, along with some nice steak knives for your guests to use. Brands I mentioned before were Wustof, Henkels, Shun, Global, Cutco, and Rapala. Here are the knives I recommended above along with a few more worthy ones. Also, note the knife accessories at the end, including no-cut gloves and some sharpeners. Carving, Cutting, and Serving Boards Tongs, BBQ Sets, Meat Hooks & Claws, Rib Racks, Grate Grippers & Cleaners, and More TONGS I prefer relatively cheap, metal-tips tongs with flanges that grasp food easier. Steer clear of anything is rubber, plastic, or silicone on the tip to avoid sticking to the grill. I also like a variety of shorter (8-9 inch) and longer (up to 16 inch) for different uses. You can never have too many tongs! BBQ SETS You’ll find a wide selection of BBQ grilling utensil sets on our new website LordoftheGrills. Check it out now… Spatulas & Fish Flippers I like these spatulas because most of them are either long-handled or else have a wide flipper which makes them easier to use on the Big Green Egg. Claws and Meat Hooks for Big Green"
