full_description = 'The Logistic Map is hiding in the Mandelbrot Set thatsmaths Occasional December 7, 2023December 29, 2023 The logistic map is a simple second-order function on the unit interval: where is the variable value at stage and is the “growth rate”. For , the map sends the unit interval [0,1] into itself. It is a simple nonlinear difference equation, whose solutions exhibit both regular and erratic behaviour, and it is often used to demonstrate some important characteristics of chaotic motion. It describes behaviour found in a wide range of disciplines: physics, engineering, economics and biology. Logistic Map hiding in the Mandelbrot Set The discrete logistic map was popularised by ecologist Robert May in a 1976 paper in Nature entitled “Simple mathematical models with very complicated dynamics”. He used the form of the map shown above. However, a simple transformation converts the map to a form equivalent to (a real variable form of) the map used by Benoit Mandelbrot to generate the enormously complex fractal set that is named after him. This is the quadratic map Transforming the variable and parameter of the logistic map to new variables, we get a correspondence between the parameter space of the logistic map and that of the Mandelbrot set. The connection between the logistic map and the (real variable) Mandelbrot map is shown in the Figure below. As ranges between 1 and 4, ranges between and . The cusp of the cardiod is at and . The tip of the antenna at the left extremity of the Mandelbrot set corresponds to for the logistic map and for the Mandelbrot map. The logistic map lurking within the Mandelbrot set. Figure adapted from Peitgen and Richter (1986). The Road to Chaos The following list illustrates the wide variety of behaviours of the solutions and how they depend critically on the value of the parameter or and, in the chaotic regime, on the initial conditions. For , or , the solution tends rapidly to for all initial conditions. For , or , the solution tends eventually to , after oscillating about that value for some time. For , or the solution approaches a period 2 cycle, oscillating betweeen two values. For increasing , or decreasing (real) , solutions with successive doublings of period, 4, 8, 16, … are found. At , or a stable period 3 cycle emerges. Many of the bifurcation points of the logistic map are at irrational values of , for example, the transition from period 2 solutions to period 4 solutions is at and the onset of period 3 solutions is at . The corresponding values of are low-order rational numbers, and . There is a much richer spectrum of solution types than listed above. Most books on chaos and dynamics give a more exhaustive description of the solutions; see, for example Ott (1993). Sources Ott, Edward, 1993: Chaos in Dynamical Systems. Cambridge University Press, 385pp. ISBN: 9-780-5214-3799-8. May, R., 1976: Simple mathematical models with very complicated dynamics. Nature, 261, 459–467 (1976). \url{https://doi.org/10.1038/261459a0} Peitgen, Heinz-Otto and Peter Richter, 1986: The Beauty of Fractals. Springer-Verlag, 199pp. ISBN: 0-387-15851-0. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedChaosFractals Published by thatsmaths View all posts by thatsmaths Published December 7, 2023December 29, 2023'
