["https://thatsmaths.com/2023/09/21/maths-in-action-at-the-rugby-world-cup"]
title = "Maths in Action at the Rugby World Cup – ThatsMaths"
description = "On September 8, I opened The Irish Times to find an A2 Poster with the programme for the Rugby World Cup. The plan showed the twenty teams who must do battle in which ultimate triumph requires survival through the preliminary rounds and victory in quarter-finals, semi-finals and the final climax. We have reached the quarter-finals…"
full_description = "Maths in Action at the Rugby World Cup thatsmaths Irish Times September 21, 2023 On September 8, I opened The Irish Times to find an A2 Poster with the programme for the Rugby World Cup. The plan showed the twenty teams who must do battle in which ultimate triumph requires survival through the preliminary rounds and victory in quarter-finals, semi-finals and the final climax. We have reached the quarter-finals on seven occasions; this time, we are among the favourites to win the Webb Ellis Trophy [TM249 or search for “thatsmaths” at irishtimes.com]. Competing countries are divided into four pools of five teams. Teams in each pool play one another in a round-robin, with the top two teams advancing to the knockout stage. Our first big challenge is to get out of Pool B, which includes three of the top five teams, Ireland, South Africa and Scotland. We have already played and beaten Romania and Tonga. Only two of the five teams in each pool will advance. Ensuring Fair Play The design of tournaments presents several mathematical challenges. Ideally, the competition should determine the best team with high probability, the final rankings should mirror the relative skills of the teams and spectators should enjoy exciting matches, culminating in a nail-biting final between the two best teams. There are several other constraints, and the structure of the tournament should reflect these. Ireland is one of the five teams in Pool B. The two basic patterns are round-robin tournaments and knockout tournaments, each having strengths and weaknesses. In a round-robin, each team plays each of the others once. In theory, this is the fairest way to determine the best team in the group. The system is also better for ranking the teams, not just determining the winner. However, with many teams, these tournaments require large numbers of matches, increasing quadratically with size. For twenty teams, 190 matches are needed if each team plays each other once. The tournament could take months. Brief and brutal Best results for the national teams [image Wikimedia Commons].Knockout tournaments are more dramatic and can produce very exciting matches. Each match results in immediate elimination of the losing team, so the knockout is a brief and brutal scheme. With twenty teams, the match count is only ten percent of the round-robin count, and increases linearly with the number of teams. With so many conflicting expectations, compromise is essential and, in their wisdom, the World Rugby Council has decided on a hybrid system of a round-robin followed by a knockout. At the pool stage, a match won is worth four points, a draw is worth two and losses are worth zero. Bonus points are also awarded for scoring a minimum number of tries or for losing by a narrow margin. If two teams are level on points, tie-breaking criteria determine their final positions. With eight teams advancing from the pools, the knockout stage has three rounds. There is also a play-off for third place making a total of forty-eight matches in the tournament. In each match tied at 80 minutes, extra time is played. If the scores are still tied, a sudden death period will be played. If there is still no change, a kicking competition determines the winner. A Puzzle A simple puzzle: in a pure knockout contest with twenty teams, calculate the minimum number of matches to select a winner. Easy: ten first-round matches leave ten teams; five in the second leave five; two third-round matches with a team getting a bye leave three; one lucky team getting a bye, the fourth round – the semi-final – eliminates one; the two remaining teams compete in the final. So, the count of matches comes to nineteen. But there is a much simpler solution: every match produces a “loser”, and, with twenty teams, there are nineteen losers! Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr