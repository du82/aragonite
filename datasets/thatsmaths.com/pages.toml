title = "The Dual in the Crown – ThatsMaths"
description = "The beginning of topology is often traced to Euler's solution of a puzzle, the Bridges of Königsberg. The problem posed was to follow a path through the Prussian city that crossed all seven bridges exactly once. Euler proved that the problem has no solution. He drastically simplifying it by replacing the geographical context by a…"
full_description = "The Dual in the Crown thatsmaths Occasional July 6, 2023July 6, 2023 The beginning of topology is often traced to Euler’s solution of a puzzle, the Bridges of Königsberg. The problem posed was to follow a path through the Prussian city that crossed all seven bridges exactly once. Euler proved that the problem has no solution. He drastically simplifying it by replacing the geographical context by a simple graph with a vertex for each land-mass and edges for each bridge. The Bridges of Königsberg problem. Left: a rough topographical map of the city. Right: representation as a simple graph. Euler’s Gem A remarkable general result was discovered by Euler. For any plane graph, if , and are the numbers of vertices, edges and faces, then This is a special case of a much more general result. It also holds for polyhedra in 3-space and for polytopes in higher dimensional spaces. An excellent account of what is called ‘Euler’s Gem’ is given in the book of David Richeson (2008). In the case of the bridges problem, we have , and (we count the outer region as a face). Of course, Euler’s Gem is satisfied: . Eulerian Paths and Circuits An Eulerian path is a path that traverses every edge exactly once. An Eulerian circuit is an Eulerian path that starts and ends on the same vertex. These concepts were first considered by Leonhard Euler 1n 1736, in connection with the problem of the Seven Bridges of Königsberg. The degree of a vertex is the number of edges linked to it. Euler proved that a necessary condition for the existence of an Eulerian circuit is that all vertices in the graph have an even degree. This result is now known as Euler’s Theorem: A connected graph has an Euler circuit if and only if every vertex has even degree. Left: Euler’s graph, a simple representation of the Bridges of Königsberg problem. Centre: The dual of Euler’s graph. Right: Superposition of graph and dual. Euler’s result is easy to understand: on an Eulerian path, each ‘incoming’ link at a vertex must have a corresponding ‘outgoing’ link. Thus, the total number of links must be an even number, or the degree of the vertex must be even. Counting the edges linking to each vertex in the Euler’s graph (Figure above, left panel), we find that three vertices have degree 3 while one has degree 5. Hamiltonian Paths and Circuits A Hamiltonian path is a path that visits each vertex exactly once. A Hamiltonian circuit is a Hamiltonian path that starts and ends at the same vertex (is a closed circuit). A graph that contains a Hamiltonian circuit is called a Hamiltonian graph. Clearly, Euler’s Königsberg graph is a Hamiltonian graph: by tracing a closed path around the outer edges, we pass through all vertices and arrive back at the starting point. The Dual Graph For every plane graph in the plane, there is another graph called its dual. The dual graph has a vertex for each face of the original graph and an edge for each pair of faces separated by an edge. When the same face appears on both sides of an edge, the dual graph has a self-loop, an edge connecting a vertex to itself. There are often many different representations of a graph in the plane. Although clearly distinct, they are topologically equivalent. In the figure below we show two such representations of the dual graph for the Königsberg Bridges Problem. They are both homeomorphic to the graph in the centre panel of the Figure above. All have . Two more representations of the dual graph for the Königsberg Bridges Problem. Left: Pentagon with two diagonals. Right: Circle and two chords. Dipole Graphs and Cycle Graphs A cycle graph is a graph consisting of a single cycle, a number of vertices connected in a closed chain. The order- cycle graph, with vertices, is denoted . The number of vertices in is equal to the number of edges. Each vertex is of degree 2: every vertex has exactly two edges linked to it. We can represent by a circle with points identified as vertices. It is topologically equivalent to an n-gon. Left: The dipole graph of order 7. Right: The graph and its dual, an order-7 cycle graph (blue). A dipole graph consists of two vertices connected by two or more edges. An order- dipole graph has n edges, is denoted by . The dual graph of the order- dipole is the cycle graph . This is obvious from the figurer above, where the dipole graph is red and black while the dual is blue and magenta. While the order-7 dipole graph has its dual graph has . Naturally, both satisfy Euler’s Gem formula, . Concluding remarks The concept of dual graph is valuable in many contexts. There are many theorems concerning graphs and their duals. For example, a standard result of graph theory states that a connected planar graph is Eulerian if and only if its dual graph is bipartite. Duality is relevant in a broader context than for planar graphs and has been studied for centuries. The duality of convex polyhedra was recognized by Johannes Kepler in his 1619 book Harmonices Mundi. In a future post, we will look at the Tonnetz, a graphical representation of the notes in the chromatic scale and — through its dual — of the relationship between the major thirds and other chords. Sources Richeson, David S., 2008: Euler’s Gem: The Polyhedron Formula and the Birth of Topology. Princeton Univ. Press, 317pp. ISBN: 978-0-691-12677-7. Thats Maths, Nov. 7, 2013: Euler’s Gem. HERE. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedEulerTopology Published by thatsmaths View all posts by thatsmaths Published July 6, 2023July 6, 2023"
