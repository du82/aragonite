description = "Imagine trying to cycle along a road with a wavy surface. Could anything be done to minimise the ups-and-downs? In general, this would be very difficult, but in ideal cases a simple solution might be possible. Elliptic Wheels We suppose that the road runs along the $latex {x}&fg=000000$-axis, with its height varying like a sine…"
full_description = "Wonky Wheels on Wacky Roads thatsmaths Occasional May 25, 2023May 25, 2023 Tricycles with three square wheels, each a different size. Image from the Museum of Mathematics, New York. Imagine trying to cycle along a road with a wavy surface. Could anything be done to minimise the ups-and-downs? In general, this would be very difficult, but in ideal cases a simple solution might be possible. Elliptic Wheels We suppose that the road runs along the -axis, with its height varying like a sine wave where is the amplitude of the wave and is the wavenumber with the wavelength. Elliptical wheel rolling along a sine curve. The centre height is equal at the crest and the trough . If the bicycle wheels are circular, their centres will rise and fall with the road, giving the rider an uncomfortable journey. So, we make the wheels elliptical. In standard position, the equation for an ellipse is We want to choose the shape parameters and to satisfy the following condition: {The centre of the ellipse remains at a constant height as the wheel rolls along.} Let us calculate the distance along the road surface over a full wavelength. The arclength is where . Since , this means that the road distance over a span of length is Assuming that so that we can approximate this by the first two terms in an -expansion: We require the wheel to make one revolution for every wavelength. Thus, the circumference must be equal to . We use the approximate formula , which has good accuracy for elliptical eccentricity [TM1]. Then we have We assume that, when the centre of the ellipse is above a crest in the road, , the long axis is horizontal and the centre is at height . When the centre is above a trough, , the long axis is vertical and the centre is at height . For these heights to be equal, we require Eqns. (1) and (2) allow us to compute and in terms of and . The parameter values for the example shown in the above Figure are , , and . The road distance over length is and the second-order approximation is . The values for the semi-axes of the ellipse are , and the eccentricity is . There is no guarantee that the axle-height of an ellipse rolling on a sine wave remains constant; indeed, we should expect some variation but, for the chosen parameters, it should be small. An exact analysis would reveal the precise variation of height over a wavelength. No doubt, it would involve the Jacobian elliptic functions, “sun”, “cun” and “dun” [TM2]. Square Wheels If you think elliptical wheels are strange, take a look at the figure at the head of this article. it is from from MoMath, The Museum of Mathematics in New York, where visitors can take a smooth ride on a tricycle with square wheels [SWT]. The bumps in the cleverly-designed track, made using inverted catenaries, ensure that the rider follows a more-or-less horizontal path. The three wheels of the tricycle have different sizes, as they vary with the distance from the centre of the track. The rear wheels are connected through a gearbox, that compensates for the different sizes of the wheels and keeps them in sync. Ingenious! Square wheel on a road of circular arcs. Left: starting position at trough. Right: wheel at trough, crest and following trough. We did a quick analysis of square wheels on a surface comprising a sequence of circular quadrants; see Figure above. The side length of the square wheels is equal to the arc-length of the quadrants, so that the wheel turns through a right angle as the contact point moves from one groove to the next. The values of the radius and arc-length were and . The minimum height of the axle, when the square is at a crest, is . The maximum height, with the corner in a groove, is . For the chosen parameters, the minimum axle-height was and the maximum height was , a difference. The slight difference, visible in the Figure, would probably not cause too much discomfort at low speed. Stan Wagon, in his book Mathematica in Action [WAG], discusses how the centre of a square wheel will remain at a constant height on a road where the circular quadrants are replaced by segments of a catenary (). The Figure below [from WAG] shows the trajectory of a corner point of the wheel and the horizontal line of the centre. The photo shows the author riding the square-wheeled trike. For further details, see Wagon (2010). Trajectory of a point on rim of square wheeled trike on a road of catenary arcs. Trajectory of a point on rim of square wheeled trike on a road of catenary arcs. Sources [TM1] ThatsMaths post, July 8, 2021: Approximating the Circumference of an Ellipse. URL [TM2] ThatsMaths post, November 14, 2019: Elliptic Trigonometry: Fun with “sun” “cun” and “dun”. URL [SWT] Mathcom Wiki: Square Wheeled Tricycle: URL [WAG] Wagon, Stan, 2010: Mathematica in Action. Springer, 578pp. ISBN: 978-0-3877-5366-9. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedGeometryMechanics Published by thatsmaths View all posts by thatsmaths Published May 25, 2023May 25, 2023"
