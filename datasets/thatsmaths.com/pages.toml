description = "The Riemann Hypothesis Perhaps the greatest unsolved problem in mathematics is to explain the distribution of the prime numbers. The overall ``thinning out'' of the primes less than some number $latex {N}&fg=000000$, as $latex {N}&fg=000000$ increases, is well understood, and is demonstrated by the Prime Number Theorem (PNT). In its simplest form, PNT states that…"
full_description = "The Golden Key to Riemann’s Hypothesis thatsmaths Occasional November 30, 2023November 30, 2023 The Riemann Hypothesis Perhaps the greatest unsolved problem in mathematics is to explain the distribution of the prime numbers. The overall “thinning out” of the primes less than some number , as increases, is well understood, and is demonstrated by the Prime Number Theorem (PNT). In its simplest form, PNT states that the number of primes less than is approximately equal to . This implies that, for large, and the probability that a number randomly chosen in the range from to is prime is approximately . But hold on: don’t people say that the greatest unsolved problem is to prove the Riemann Hypothesis. How can both of these problems be “the greatest”? In fact, the distribution of prime numbers is intimately connected with the distribution of zeros of Riemann’s zeta function. One of Euler’s early triumphs was to find the sum of reciprocals of squares of the natural numbers, . Later, Euler studied the infinite series for real value of greater than . But the huge potential of this series becomes apparent only when varies freely in the complex plane. Riemann first considered this generalization, and the function is now called the Riemann zeta function. It is relatively easy to show that for negative even numbers . These are known as the trivial zeros. All the remaining zeros are in the critical strip , and the Riemann Hypothesis is that all these non-trivial zeros lie on the critical line . The connection between the Riemann Hypothesis and the distribution of primes is a fascinating and intricate story, beautifully described in an excellent book, Prime Obsession, by John Derbyshire (2003). To convince you that the two problems are intertwined, we will examine the wonderful product formula first proved by Euler. Euler’s Product Formula: the Golden Key Euler’s “Series Infinitas”, St Petersburg, 1737. We start with the definition of the zeta function: Although may be complex, it is sufficient here to regard it as a real variable. If we multiply the series by , we get Now, subtracting this from the expression for , we get All the terms whose denominators have powers of even numbers are gone! Now multiply this by and subtract as before. We get All the multiples of have now vanished from the right side. Now multiply this by and subtract as before. We get Continuing indefinitely, all the terms on the right after are obliterated so that, ultimately, we have and rearranging this gives an expression for : This may be written as an equation relating an infinite sum over all natural numbers and an infinite product over all prime numbers: This formula, which Derbyshire calls Euler’s Golden Key, shows that there must be an intimate connection between the zeta function (on the left) and the set of prime numbers (on the right). All that remains is to complete the proof of the hypothesis but, given that it has defied the most brilliant mathematicians for one and a half centuries, we may have to wait some time. Sources Derbyshire, John, 2003: Prime Obsession: Bernhard Riemann and the Greatest Unsolved Problem in Mathematics. Plume Books, 422pp. ISBN: 978-0-4522-8525-5. Euler Leonhard, 1737. Variae observationes circa series infinitas (Various Observations about Infinite Series), Royal Imperial Academy, St Petersburg. Riemann, Bernhard (1859): On the Number of Prime Numbers less than a Given Quantity. In Gesammelte Werke, Teubner, Leipzig (1892), Original manuscript and English translation here. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedEulerNumber TheoryPrimes Published by thatsmaths View all posts by thatsmaths Published November 30, 2023November 30, 2023"
