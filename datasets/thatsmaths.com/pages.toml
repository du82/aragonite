title = "Elusive Transcendentals – ThatsMaths"
description = 'The numbers are usually studied in layers of increasing subtlety and intricacy. We start with the natural, or counting, numbers $latex {\mathbb{N} = \{ 1, 2, 3, \dots \}}&fg=000000$. Then come the whole numbers or integers, $latex {\mathbb{Z} = \{ \dots,  -2, -1, 0, 1, 2,  \dots \}}&fg=000000$. All the ratios of these (avoiding division…'
full_description = "Elusive Transcendentals thatsmaths Occasional October 12, 2023 Ascending chain of number sets. The numbers are usually studied in layers of increasing subtlety and intricacy. We start with the natural, or counting, numbers . Then come the whole numbers or integers, . All the ratios of these (avoiding division by 0) yield the rationals . Then come all the real numbers . Algebraic and Transcendental Numbers The real numbers fall into two categories. The algebraic numbers are all those numbers that are roots of polynomial equations with integer coefficients. For example, , the square root of 2, is algebraic, since it is a root of the polynomial equation . Finally, the real numbers that are not algebraic are called transcendental numbers. They are members of the set , that is, in but not in . We thus have an ascending chain of sets The transcendental numbers are those in but in none of the other sets, that is, in the outermost layer in the figure above, but not in any of the inner layers. Existence of Transcendentals Although there are infinitely more transcendental numbers than algebraic numbers, they are not so easy to find. The first proof that transcendental numbers exist was given by Joseph Liouville. He found a large class of numbers that are transcendental, and showed how to construct such numbers. An example of a Liouville number is . This gives us an explicit way of constructing a transcendental. Expanded in binary form, this is where the 1’s occur at positions . Later, Georg Cantor gave an existence proof for transcendentals by showing that the real algebraic numbers are countable, whereas the set of all real numbers is uncountable, so there must exist real transcendental numbers, indeed infinitely more that algebraic numbers. But Cantor’s proof was non-constructive: it provided no means of finding particular examples of transcendentals. A Non-constructive Proof The set of rational numbers forms a field, closed under addition and multiplication. Thus, for any two rationals, and , the sum and the product are also rational. It is trivial to show this. Can combinations of irrational numbers be rational? Obviously, if and then and are both rational. But is it possible for to be rational if both and irrational? The answer is “Yes”. Let and . If is rational, we have a solution. But if is irrational, we define and . Then We thus have the result that is rational for both and irrational, with The proof of this result is non-constructive. It does not tell us which of the alternatives is true, and it gives us no inkling of how to answer this. The answer is known, but it cannot be proved in the simple manner we have used here. The Gelfond-Schneider Theorem Aleksandr Gelfond (left) and Theodor Schneider (right). In 1900, David Hilbert gave a talk at the International Congress of Mathematicians in which he described some major unsolved problems. The full list of 23 problems appeared in the Proceedings of the conference. The Gelfond-Schneider theorem solved Problem 7 of Hilbert’s list. The Gelfond-Schneider Theorem states that all members of a large set of numbers are transcendental. The result was proved independently in 1934 by Soviet mathematician Aleksandr Gelfond and German mathematician Theodor Schneider. The theorem may be stated thus: If is an algebraic number (not equal to 0 or 1), and if is an irrational algebraic number, then is a transcendental number. Before this theorem was proved, numbers like and were known to be transcendental, but the character of numerous numbers like was unknown. After the proof, the transcendental nature of a huge set of numbers was known. Some of these were given names, for example, the Gelfond-Schneider constant . Since is algebraic, we can apply the Gelfond-Schneider theorem using to conclude that is transcendental. But we cannot use the number , which is not algebraic, in the theorem. Indeed, as we saw, The Gelfond-Schneider theorem extends to complex numbers, and can be used to show that Gelfond’s constant is transcendental. The status of the number is still unknown. Sources Wikipedia article Gelfond-Schneider theorem. http://www.wikipedia.org/ * * * NOTICE Don’t Forget: Maths Week Ireland runs from Oct 14th to 22nd. See https://www.mathsweek.ie/2023/ Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedNumber Theory Published by thatsmaths View all posts by thatsmaths Published October 12, 2023"
