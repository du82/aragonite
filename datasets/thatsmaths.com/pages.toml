title = "Maths in the Time of the Pharaohs – ThatsMaths"
description = "Why would the Ancient Egyptians have any interest in or need for mathematics? There are many reasons. They had a well-organised and developed civilisation extending over millennia. Science and maths must have played important or even essential roles in this culture. They needed measurement for land surveying and for designing irrigation canals, arithmetic for accounting…"
full_description = "Maths in the Time of the Pharaohs thatsmaths Occasional August 3, 2023August 3, 2023 The Great Pyramid of Cheops at Giza (image from Wikimedia Commons). Why would the Ancient Egyptians have any interest in or need for mathematics? There are many reasons. They had a well-organised and developed civilisation extending over millennia. Science and maths must have played important or even essential roles in this culture. They needed measurement for land surveying and for designing irrigation canals, arithmetic for accounting and taxation and geometry for construction of large grain silos and, of course, for pyramid building. The Egyptians had to tackle numerous tasks involving arithmetic and geometry. Specific problems included the division of food and other supplies amongst families, distribution of plots of land to farmers and allocation of tasks to workers and soldiers, Their large grain silos were cylindrical in form and their capacity required to be calculated. Of course, with their preoccupation with pyramids, they needed to know how to deduce the volume from the base-length and height or slant–height in order to estimate the quantity of blocks and bricks required to complete them. The Rhind Mathematical Papyrus The Rhind Papyrus is the most important source of information on Ancient Egyptian mathematics. It was found in Thebes (within modern-day Luxor). It was written by the scribe Ahmes (A’h-mosé) around 1650 BC and is often referred to as the Ahmes Papyrus. Ahmes wrote the papyrus in hieratic script, and described it as a copy of a much older document, dating back perhaps 1000 years. The papyrus contains about 80 problems, with solutions, covering all the topics mentioned in this article. The Rhind Papyrus. Jean-François Champollion deciphered hieroglyphs in 1822 by analysing the inscriptions at the temples of Karnak and Luxor. Hieroglyphs were the formal writing system in Ancient Egypt. The later hieratic script, derived from hieroglyphic writing, was a cursive writing system used to write the Egyptian language. It was primarily written in ink with a reed pen on papyrus. Papyrus was much less durable than the baked clay tablets of Mesopotamia. As a result, we have a much more detailed knowledge of Babylonian or Mesopotamian mathematics than of the mathematics in the time of the Pharaohs. The main part of the Rhind Papyrus is now in the British Museum. Egyptian Numerals The number system of Ancient Egypt was decimal-based, with a new system being introduced for each power of 10. Units were written as strokes, tens as horseshoes, hundreds as ropes, thousands as lilies, and so on. and so on. Thus, were written as and as . The number 32 would be written “” or “”. Unit Fractions The basic idea of the Egyptians for dividing quantities was “the th part”. Only unit fractions were used. There was no way to write or . Unit fractions were denoted by a bar-like symbol above the denominator. Thus, was written . The only exception was the fraction , which played a central role in their computing methods. It had a special symbol . The fifth part of 20 is 4, but what is the fifth part of 2? It is not a unit fraction, so it would be broken up into a sum of unit fractions: Fractions were expressed as sums of unit fractions (excepting 2/3) in descending order, that is, with increasing denominators. For example The repetition of a fraction, like , was not permitted. Instead, the scribe would write something like . Computation rules were used. For example, Any fraction can be expressed in a binary form, , or where is either or . Likewise, any integer can be expressed as where is either or . Or as a sum of powers of 2: Thus, any number is the sum of a subsequence of . There is no record that the scribes knew this, but their method of multiplication depended on it so they my well have understood it at an intuitive level Multiplication by Duplation Multiplication was carried out by a successive sequence of duplications. Two operations were used: Multiplication of numbers by 2. Finding two-thirds of any number. Egyptian arithmetic rested on these two simple-but-solid foundations. Prepared tables were probably used for the basic operations used in the calculations. We illustrate the process of calculating 7 by 13 by repeated doublings. Multiply 7 by powers of 2, listing the powers and doublings in two columns. Then add the powers of two in the left column from the bottom upwards, omitting rows where necessary, to obtain 13. In this case, we need to omit the second row, since . Finally, add the values in the right column, excluding omitted rows. The result is . The product has been obtained by “duplation” and addition. The Pythagorean Theorem The Pythagorean theorem was known in Mesopotamia more than a thousand years before Pythagoras. This is shown from the cuneiform tablet Plimpton 322, translated by Otto Neugebauer in 1945 [see That’s Maths reference below]. There is no evidence whatsoever that Ancient Egyptian mathematicians had any knowledge of the Pythagorean theorem. Indeed, no mention has been found in extant papyri even of the simple case of a triangle with sides 3, 4 and 5, althought it is reasonable to speculate that the Egyptian surveyors — known as rope-stretchers — who used knotted chords to measure lengths, would have stumbled upon this simple example. Areas and Volumes The Ahmes Papyrus includes several problems on calculating areas and volumes, giving us an idea of the extent of knowledge of geometry. The simple recipe for the area of a rectangle as length times breadth presented no problems. Likewise, the formula for the area of a triangle as half the base by the height was known. Detail of Rhind Papyrus with calculation of the area of a circle. For circles, the recipe for area was “subtract one ninth of the value of the diameter and square the result”. This gave the formula This leads to an implicit value, , with an approximate value , well within one per-cent of the true value. Influences of Egyptian Mathematics The extent to which Egyptian mathematics influenced that of Ancient Greece has long been debated. The Ancient Greeks wrote that geometry originated in Egypt. Pythagoras and Thales are believed to have studied in Egypt. The historian Herodotus, and other commentators, ascribed the origins of the subject to the Egyptians. The Ancient Egyptians had no theorems or proofs but presented their findings in the form of problems with specific numerical values and with solutions worked out. They had a small number of general methods; for example, they could solve simple equations of first and second degree. But, in general, the state of development of the subject in Egypt was severely limited. Moreover, there is little evidence of the philosophical and speculative frame of mind that was such an inspiring force among the Greeks, whose mathematics reached impressive heights. The axiomatic foundations of geometry and the systematic methods of proof are not found in Egyptian mathematics. These were essential aspects of what has been called “The Greek Miracle”. Sources Gillings, R.J., 1972: Mathematics in the Time of the Pharaohs. Dover, 288pp. ISBN: 0-987-4862-4315-3. Joseph, George G., 2010: The Crest of the Peacock: Non-European Roots of Mathematics. Third Edition. Princeton University Press. Princeton University. ISBN: 978-0-6911-3526-7. Wikipedia article Rhind Mathematical Papyrus. Link. That’s Maths: Pythagorean Triples. Link. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedArithmeticGeometryHistory Published by thatsmaths View all posts by thatsmaths Published August 3, 2023August 3, 2023"
