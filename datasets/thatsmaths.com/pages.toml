title = "Vertical or Horizontal Slices? Riemann and Lebesgue Integration. – ThatsMaths"
description = 'For simple sets, we have geometric length, area and volume. But how can we establish these dimensions for complicated curves, areas and volumes. Integral calculus provides a powerful tool for answering such questions. The area $latex {A}&fg=000000$ between the curve $latex {y=y(x)}&fg=000000$ and the $latex {x}&fg=000000$-axis is $latex \displaystyle A = \int_{x_1}^{x_2} y(x) \mathrm{dx} \,. &fg=000000$…'
full_description = "Vertical or Horizontal Slices? Riemann and Lebesgue Integration. thatsmaths Occasional June 29, 2023June 29, 2023 For simple sets, we have geometric length, area and volume. But how can we establish these dimensions for complicated curves, areas and volumes. Integral calculus provides a powerful tool for answering such questions. The area between the curve and the -axis is The usual definition of an integral, following Bernhard Riemann, works fine for reasonably well-behaved functions over finite intervals. Chopping into Vertical Slices We briefly recall the definition of the Riemann integral. Consider on the finite interval , the set of points For a function , we define We introduce the lower and upper Darboux sums A bounded function is Riemann integrable if the quantities are finite and have the same value. This common value is called the Riemann integral of and denoted by . But what if the function to be integrated is wild in some way, or the region over which it is to be integrated is complicated? For example, the characteristic function, or indicator function, of the set of rational numbers in the interval equals 1 for rationals and 0 for irrationals. It oscillates between these values an infinite number of times within any interval, however small, so that the upper and lower Darboux sums never converge. Slicing up an area for Riemann integration (left panel) and Lebesgue integration (right panel) [Figures from Schilling (2005)].The reason for the difficulty is that the Riemann sums partition the domain of the function without taking into account the shape of the function, thus slicing up the area under the function vertically (Figure above, left panel). Chopping into Horizontal Slices Lebesgue’s approach to integration is in sharp contrast to Riemann’s: the domain is partitioned according to the values of the function under consideration, resulting in a decomposition of the area into horizontal slices (Figure above, right panel). The set of functions that are Lebesgue integrable is substantially greater than the set of Riemann integrable functions. For example, the set of rational numbers in the interval has Lebesgue measure 0; the set of irrational numbers in this interval has measure 1. Thus, informally, there are “many more” irrationals than rationals. This concurs with the cardinality of these sets (although this concurrence is not guaranteed in general). While the scope of measure theory is much broader than Riemann’s integral, it is impossible to define a functional that yields an integral for every function: there are always functions that cannot be integrated and sets that cannot be measured. The good news is that, for most `well-behaved’ functions, the Riemann and Lebesgue integrals both exist and both have the same value. Conclusions The Riemann integral is convenient for calculating the primitive, or anti-derivative, of the integrand of `reasonably behaved’ functions. However, it fails to provide a meaningful results for more exotic functions. The Lebesgue theory comes to the rescue, and it provides very powerful theorems that justify the interchange of limits and integrals. Sources Schilling, René L., 2005: Measures, Integrals and Martingales. Cambridge Univ. Press, 381pp. ISBN 978-0-5216-1525-9. Wikipedia articles: (1) Riemann Integral. (2) Lebesgue integration. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedAnalysis Published by thatsmaths View all posts by thatsmaths Published June 29, 2023June 29, 2023"
