title = "A Simple Formula for the Weekday – ThatsMaths"
description = "People skilled in mental arithmetic sometimes amaze friends and colleagues by calculating the day of the week on which a given date falls. Thus, given a date, say D-Day, which was on 6 June 1944, they quickly announce that it was a Tuesday. Techniques for calculating the day of the week for a given date…"
full_description = "A Simple Formula for the Weekday thatsmaths Occasional June 22, 2023June 22, 2023 People skilled in mental arithmetic sometimes amaze friends and colleagues by calculating the day of the week on which a given date falls. Thus, given a date, say D-Day, which was on 6 June 1944, they quickly announce that it was a Tuesday. Techniques for calculating the day of the week for a given date have been a subject of research for centuries. Carl Friedrich Gauss wrote about the topic in 1798 but, true to form, he never published it. It was included in his Collected Works, published 1927, in a paper entitled “How to find the weekday of the First of January of any Year”. Later, the mathematician Charles Dodgson, better known as Lewis Carroll, author of the Alice books, published a letter in Nature on the subject. Gauss and Carroll used similar approaches: (1) choose a particular day, such as the first of January, as an anchor day; (2) find a formula to calculate the weekday of the anchor in a given year; (3) make an adjustment for the given month and day. Doomsday Method Mnemonic for Day Numbers A problem with the methods of Gauss and Carroll is that the calculation becomes awkward when the given date is far away from the anchor day. To overcome this, the remarkable mathematician John H. Conway developed a method that he called the Doomsday Method. He practised regularly — his computer was programmed to display random dates each time he logged on — and his calculation time was just a few seconds. Conway simplified the calculations by fixing a separate anchor day for each month. The algorithm he used to compute the weekdays was quite similar to that of Lewis Carroll. Let the days of the week from Sunday to Saturday be numbered from 0 to 6. Then the answer we want will be in the set . Conway suggested naming the weekdays as “Noneday”, “Oneday”, “Twosday”, “Treblesday”, “Foursday”, “Fiveday”, and “Six-a-day” to aid memory of the day number without counting. Conway’s method requires us to memorise the Doomsday Number for each of the twelve months (see Table below) but it is worth the effort as this simplifies and speeds up the calculations. Nakai’s Formula Recently, a modification of the Doomsday Method was published in the popular magazine The Mathematical Intelligencer by Hirofumi Nakai of Tokyo City University. Nakai presented a new simple formula for calculating the weekday that is easily remembered and suitable for rapid mental calculation. We will summarise the method of Nakai, omitting details and proofs, which can be found in the paper in The Mathematical Intelligencer. Suppose the year is with the century and . The conditions for a leap-year are We express and as multiples of plus remainders: In the following, all equations are considered modulo 7. Nakai shows that the day of the week for the Doomsdays is Nakai points out two advantages of his formula over previously proposed ones: It uses only the remainder on division, so there are fewer items to memorize during the calculation It is easy to multiply by 5 or 10 in the decimal system. A different set of anchor days may be used by changing the integer in the formula Fuller details are available in Nakai (2023). We conclude with a few examples to illustrate the technique. Example I: 9/11 or 11 September, 2001. We have . The remainders when this is divided by 4 are , so formula (1) gives Thus, Doomsday for this date is 3, that is, Wednesday. The difference between the date 11 and the Doomsday for September (namely 5) is , so 11 September 2001 was day or Twosday. Therefore, 9/11 was on a Tuesday. Example II: D-Day, 6 June, 1944. We have . The remainders when this is divided by 4 are , so formula (1) gives Thus, Doomsday for this date is 2, that is, Wednesday. The difference between the date 6 and the Doomsday for June (namely 6) is 0, so 6 June 1944 was day or Twosday. Therefore, D-Day was on a Tuesday. Finally, we remark that Linux users can just type “cal June 1944′‘ to get:But perhaps you feel that this is cheating! Sources Lewis Carroll, 1887: To find the day of the week for any given date. Nature, 35, pg. 517. John H. Conway, 1973: Tomorrow is the day after Doomsday. Eureka, 36, 28–32. Carl Friedrich Gauss, 1798: Den Wochentag des 1. Januar eines Jahres zu finden. Gauss Werke XI, (1927), 206–210. Hirofumi Nakai, 2023: A Simple Formula for Doomsday. The Mathematical Intelligencer, Volume 45, Issue 2, 131–132. Wikipedia: Doomsday rule. URL. Wikipedia: Gaußsche Wochentagsformel. URL. Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Tumblr (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) Related TaggedAlgorithms Published by thatsmaths View all posts by thatsmaths Published June 22, 2023June 22, 2023"
