title = "XSServe :: thatsn0tmysite  — The life of a newborn cyber security kid."
description = """
XSServe XSServe is a shameless copy of heavily inspired by the XSSHunter project (by @IAmMandatory), rewritten in Go.
⚠ Disclaimer The project is in a SEMI usable state right now, if you want a prime experience I still suggest the use of other tools.
