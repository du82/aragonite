full_description = "Learn about: SPI Posted on Sep 16, 2018 in zines (tags: electronics) Hey. Thanks to the helpful folks over on Reddit, I know this zine has a couple issues in the technical content (and some in the art, there's not meant to be two slave #2s!). I'd say it's still worth a read, but just be aware that I completely glossed over the full-duplex nature of SPI. Thanks for checking it out though - be on the look out for more of these with a bit more accuracy :) Learn about: SPI Posted on Sep 16, 2018 in zines (tags: electronics) Hey. Thanks to the helpful folks over on Reddit, I know this zine has a couple issues in the technical content (and some in the art, there's not meant to be two slave #2s!). I'd say it's still worth a read, but just be aware that I completely glossed over the full-duplex nature of SPI. Thanks for checking it out though - be on the look out for more of these with a bit more accuracy :) You might also be interested in: Quick RE: The Tandberg TT6120 'TS Processor' A quick reverse engineering of a 'Transport Stream Processor', used in TV and video production. Posted on Nov 11, 2018 in blog Hacking the fx-CP400 - Part 2.1 (Building a Cross-Compiler) Building a cross-compiler for the CASIO fx-CP400's SH4 processor. Posted on Jan 29, 2018 in blog See all posts Hey. Thanks to the helpful folks over on Reddit, I know this zine has a couple issues in the technical content (and some in the art, there's not meant to be two slave #2s!). I'd say it's still worth a read, but just be aware that I completely glossed over the full-duplex nature of SPI. Thanks for checking it out though - be on the look out for more of these with a bit more accuracy :)"
