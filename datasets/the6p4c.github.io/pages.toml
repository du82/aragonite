full_description = '''Learn about: Banker's Algorithm Posted on Nov 12, 2019 in zines (tags: programming and computer science) In attempting to learn about it, I found there were two types of explanations of the Banker's algorithm - confusing pseudocode (not great when you're asked to do it by hand), and ones which failed to give any semblance of a "why". Sometimes both at once. So I opened Krita, and now there's this, which hopefully serves as a better teaching tool. Enjoy! I've also written a small tool which performs the Banker's algorithm, showing the steps along the way (jump to the tool!). Some details have been left out or simplified to emphasise the purpose above. Please tell me if there's something heinously wrong, though. Explanation Visualisation Tool Inputs Safe example Unsafe example Number of processes: Number of resources: ALLOCATION {{ resourceIdentifier(resource) }} P{{ process }} MAX {{ resourceIdentifier(resource) }} P{{ process }} AVAILABLE {{ resourceIdentifier(resource) }} NEED (calculated) {{ resourceIdentifier(resource) }} P{{ process }} {{ cell }} Result (scroll along!) Error: process P{{ result.process }} has exceeded its declared maximum of resource {{ resourceIdentifier(result.resource + 1) }} Error: process P{{ result.process }} has declared a maximum of {{ result.maxWas }} instances of resource {{ resourceIdentifier(result.resource + 1) }}, however resource {{ resourceIdentifier(result.resource + 1) }} only has {{ result.resourceTotal }} instances total {{ error.message }} AVAILABLE {{ resourceIdentifier(resource) }} {{ cell }} Processes remaining: {{ i != 0 ? ", " : "" }}P{{ process }} (none) P{{ step.process }} can run: {{ arrayString(step.need) }} P{{ step.process }}'s NEED ≤ {{ arrayString(step.availableBeforeTermination) }} AVAILABLE P{{ step.process }} terminates and frees its allocated resources: {{ arrayString(step.availableBeforeTermination) }} AVAILABLE + {{ arrayString(step.allocated) }} P{{ step.process }}'s ALLOCATED All processes can successfully acquire their maximum number of resources then terminate. Therefore, the system is in a safe state. No other process is able to acquire the resources it requires to terminate. {{ arrayString(step.need[process]) }} P{{ process }}'s NEED ≥ {{ arrayString(step.available) }} AVAILABLE Therefore, the system is in an unsafe state which may lead to deadlock.'''
