title = "Privacy Policy | RAI Institute"
description = "Boston Dynamics AI Institute, LLC d/b/a Robotics and AI Institute (“we”, “us”, or “our”) is committed to respecting your privacy. This Privacy Policy explains our practices regarding the collection, use, and disclosure of information that you (“you” or “user”) may provide to us through your use of our website located at https://rai-inst.com/ our social media […]"
full_description = "Privacy Policy Boston Dynamics AI Institute, LLC d/b/a Robotics and AI Institute (“we”, “us”, or “our”) is committed to respecting your privacy. This Privacy Policy explains our practices regarding the collection, use, and disclosure of information that you (“you” or “user”) may provide to us through your use of our website located at https://rai-inst.com/ our social media pages, and any other websites that we link to this Privacy Policy (collectively, our “Website”). If you have entered into a separate agreement with us, that separate agreement shall control, and only those terms within this Privacy Policy that do not conflict with such separate agreement shall apply. If you have any questions regarding this Privacy Policy, please contact us at privacy@rai-inst.com. By accessing the Website, you agree to be bound by this Privacy Policy. If you do not agree to the terms of this Privacy Policy, please do not use the Website. Each time you use the Website, the current version of this Privacy Policy will apply. Accordingly, when you use the Website, you should check the date of this Privacy Policy (which appears at the bottom) and review any changes since you last reviewed the Privacy Policy. Information We Collect We collect two types of information from users of our Website: “Personal Information,” which is information that you provide that can be used to identify you (such as your name or your email address), and “Aggregate Information,” which is information that cannot be used to identify you (such as frequency of visits to the Website and your browser type). INFORMATION YOU PROVIDE TO US We collect Personal Information that you voluntarily provide to us when you use our Website. For example, you may provide us with your contact information such as your email address, first and last name, the content of your communication, or other Personal Information when you choose to submit such information to us through email, an online form, or other method. If you interact with us on social media, we may collect your social media profile information, your communications with us, and your communications and posts on our social media pages. INFORMATION WE AUTOMATICALLY COLLECT When you use our Website, we automatically receive and collect information from your device. This information may include the following: Information about your device, such as the operating system, hardware, system version, Internet Protocol (IP) address, device ID, and device language. The specific actions that you take when you use our Website, including but not limited to the pages and screens that you view or visit, search terms that you enter, and how you interact with our Website. The time, frequency, connection type, and duration of your use of our Website. Information regarding your interaction with email messages, for example, whether you opened, clicked on, or forwarded the email message. Identifiers associated with cookies or other technologies that may uniquely identify your device or browser (as further described below). Your general geographic location (based on your IP address). Pages you visited before or after navigating to our Website. EMPLOYMENT If we have collected your Personal Information through our “Careers” page in response to a job opening, you are giving us permission to use and retain your Personal Information for the purpose of evaluating your application for employment consideration for the specific position that you applied to, as well as other roles at the Robotics and AI Institute. This Personal Information may be processed and stored by a third-party talent tracking solution provider as well as with vendors, consultants, and other service providers who need access to such information to carry out work relating to the recruitment process on our behalf. AGGREGATE INFORMATION COLLECTED Aggregate Information is information that does not identify you. Aggregate Information may be collected when you use our Website, independent of any information you voluntarily enter. Additionally, we may use one or more processes to de-identify information that contains Personal Information, such that only Aggregate Information remains. We may collect, use, store, and transfer Aggregate Information without restriction. COOKIES AND ANALYTICS Like most websites, our Website may use “cookies.” Cookies are alphanumeric identifiers that we transfer to your computer’s hard drive through your web browser to help us identify you when you come to our Website. Our Website collects cookies and may use cookies for reasons including, but not limited to: Analyze our web traffic using an analytics package. Identify if you are signed in to the Website. Test content on the Website. Store information about your preferences. Recognize when you return to the Website. Overall, cookies help us provide you with a better website experience by enabling us to monitor which pages you find useful and which you do not. A cookie in no way gives us access to your computer or device, or any information about you, other than the data you choose to share with us. You can choose to accept or decline cookies. Most web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. This setting may prevent you from taking full advantage of the Website. We may use third parties, such as Google Analytics or other analytics providers, to analyze traffic to our Website. These non-essential cookies can be customized on the “cookie banner” via the cookie management tool that launches when you land on our Website. Another way to disable Google Analytics is to download the Google Analytics Opt-Out Browser Add-on . To learn more about Google Analytics and how it collects and processes data, please consult the Google Analytics overview provided by Google at “How Google uses information from sites or apps that use our services.” Although we do our best to honor the privacy preferences of our visitors, we are not able to respond to Do Not Track signals from your browser. HOW WE USE YOUR INFORMATION In general, we collect information and Personal Information from you so that we can provide our Website, operate our organization, and provide information that you request from us. This includes but is not limited to the following: Provide, operate, improve, maintain, and protect our Website. Facilitate your access to our webinars, events, and other activities that you sign up for or may be interested in. Provide you with technical and other support. Send you updates, marketing communications, and other information about the Robotics and AI Institute, our research, development, products, services, and our Website. Send you notices and alerts. Conduct research, analytics, and monitor and analyze trends and usage. Contact you and respond to your inquiries. Enhance or improve user experience, our organization, and our Website, including the safety and security thereof. Personalize our Website to you. As necessary to comply with any applicable law, regulation, subpoena, legal process, or governmental request. Enforce contracts, including investigation of potential violations thereof. Detect, prevent, or otherwise address fraud, security or technical issues. Protect against harm to the rights, property or safety of the Robotics and AI Institute, our users, or the public as required or permitted by law. How we share your information We do not rent or sell your Personal Information. Like most companies, we share information, including Personal Information, in certain circumstances with third parties through operation of our Website and our organization. Below we explain when that happens. SERVICE PROVIDERS We may transfer Personal Information to third parties for the purpose of providing the Website or operating our organization. For example, we may transfer your Personal Information to third-party service providers to assist with providing the Website, and to communicate with you about our research, our services, or our organization. REQUIRED TRANSFERS We may also transfer your Personal Information to third parties under the following circumstances: (i) to comply with a legal requirement, law, subpoena, judicial proceeding, court order, governmental request, or legal process; (ii) to investigate a possible crime, such as fraud or identity theft; (iii) in connection with the sale, purchase, merger, asset sale, financing, reorganization, liquidation or dissolution of the Robotics and AI Institute, including the evaluation thereof; (iv) when we believe it is necessary to protect the rights, property, or safety of the Robotics and AI Institute or other persons, or (v) as otherwise required or permitted by law, including any contractual obligations of the Robotics and AI Institute. AS DIRECTED BY YOU AND WITH YOUR CONSENT Except as otherwise provided in this Privacy Policy, we share Personal Information with companies, organizations or individuals outside of the Robotics and AI Institute only at your direction or when we have your consent to do so. International Transfer Our Website is hosted in and operated from the United States. If you use our Website from other countries with laws governing data collection and use that may differ from United States law, then please note that by sending an email or other communication containing Personal Information or by providing Personal Information through our Website, you are voluntarily transferring your Personal Information outside of those regions to the United States. Residents of the European Economic Area, Switzerland or the United Kingdom Residents of the EEA, Switzerland, and the United Kingdom have additional privacy rights. Information on these rights is provided in our supplemental European Economic Area, Switzerland and United Kingdom Resident Privacy Notice below. This European Economic Area (EEA), United Kingdom (UK) and Switzerland Resident Privacy Notice supplements the information contained in our Privacy Policy and applies to residents of the European Economic Area (EEA), the United Kingdom (UK) and Switzerland. It contains additional information required by the EU General Data Protection Regulation (“GDPR”) and the UK and Swiss equivalents. These provisions, which should be read together with the statements in the main Privacy Policy, explain our practices with regard to data privacy in the EEA, UK and Switzerland. Name of data controller and contact details Robotics and AI Institute US: 145 Broadway Cambridge, MA. 02142 USA Switzerland: Elias-Canetti-Strasse 2, 8050 Zürich, Switzerland Email: privacy@rai-inst.com Purposes of the processing The purposes of the processing are described in the section of the main Privacy Policy entitled Information We Collect. Lawful basis for the processing Our legal basis for processing personal data is described in the main Privacy Policy and will depend on the personal data concerned and the specific context in which we collect it. Generally, we process personal data on the basis that the processing is necessary for purposes of our legitimate interest in operating our organization in a manner typical in the US research and robotics industries, having taken into account any risks to your fundamental rights and freedoms (including your right to privacy). We also may process personal data on other bases permitted by the GDPR, the UK Data Protection Act 2018 and other applicable laws, such as to fulfill a contract with you, or when the processing is necessary for us to comply with our legal obligations. The legitimate interests of the controller or third party, where applicable Our specific legitimate interests, such as responding to your requests, comments and questions, providing you updates about tThe Robotics and AI Institute, our research, development, products and services, and providing you with the Website, are described in the section of the main Privacy Policy entitled Information We Collect. The categories of personal data concerned The categories of personal data that we process are described in the section of the main Privacy Policy entitled Information We Collect. The recipients or categories of recipients of the personal data The potential recipients of the personal data that we collect via the Website are described in the section of the main Privacy Policy entitled How We Share Your Information. Information regarding the transfers of personal data outside of the European Economic Area (EEA), Switzerland and the United Kingdom (UK) The Robotics and AI Institute is headquartered in the U.S. and the Website is hosted in the U.S. The laws of the U.S. have not been deemed by the European Commission, the United Kingdom or Switzerland to provide an adequate level of protection to personal data. When you provide your personal data to us, including via the Website or when you contact us by email, you are providing your personal data directly to the U.S. Before you provide your personal data to us, including via the Website, we request your explicit consent to the transfer of your personal data to the U.S. When you email us, the fact that you have chosen to email us knowing that we are located in the U.S. will be understood to constitute your explicit consent to the transfer of the personal data in your email (including your email address) to the U.S. Regardless of the differences in U.S. and European privacy laws, we safeguard your personal data as described in our main Privacy Policy and this section. If we transfer your personal data to a third party, we require the third party to commit contractually to process your personal data only in ways that are consistent with our main Privacy Policy and this supplemental notice. The period for which the personal data will be stored, or the criteria for determining the retention period How long we retain personal data varies according to the type of data in question, the purpose for which it is used, and applicable data retention and record-keeping requirements. We delete personal data within a reasonable period after we no longer need to use it for the purpose for which it was collected or for any subsequent purpose that is compatible with the original purpose. This does not affect your right to request that we delete your personal data before the end of its retention period. We may archive personal data (which means storing it in inactive files) for a certain period prior to its final deletion, as part of our ordinary business continuity procedures. Your rights to access, correct, restrict or delete your personal data and object to processing You have the right to request access to your personal data, to have your personal data corrected, restricted or deleted, the right to data portability, and to object to our processing of your personal data. Your rights may be subject to various limitations under the GDPR. If you wish to exercise any of these rights, or if you have any concerns about our processing"
