["https://www.theatlantic.com/magazine/archive/1939/09/crisis/654140"]
title = "Crisis - The Atlantic"
description = "The Atlantic covers news, politics, culture, technology, health, and more, through its articles, podcasts, videos, and flagship magazine."
full_description = "PoemCrisisBy W. H. AudenSeptember 1939 Issue ShareSave Of my sowing such straw I reap. O human folk, why set the heart there where exclusion of partnership is necessary?— Purgatorio, xiv, 85—87WHERE do they come from? Those whom we so much dread,As on our dearest location falls the chillOf their crooked wing, and endangersThe melting friend, the aqueduct, the flower.Terrible Presences that the ponds reflectBack at the famous, and, when the blond boyBites eagerly into the shiningApple, emerge in their shocking fury.And we realize the woods are deaf, and the skyNurses no one, and we are awake, and theseLike farmers have purpose and knowledge,And towards us their hate is directed.We are the barren pastures to which they bringThe resentment of outcasts; on us they workOut their despair; they wear our weepingAs the disgraceful badge of their exile.O we conjured them here like a lying map:Desiring the extravagant joy of life,We lured with a mirage of orchards,Fat in the lazy climate of refuge.Our money sang like streams on the aloof peaksOf our thinking that beckoned them on like girls;Our culture like a West of wonderShone a solemn promise in their faces.We expected the beautiful or the wise,Ready to see a charm in our childish fib.Pleased to find nothing but stones, andAble at once to create a garden.But those who come are not even children withThe big indiscriminate eyes we had lost,Occupying our narrow spacesWith their anarchist vivid abandon.They arrive, already adroit, having learntRestraint at the table of a father’s rage;In a mother’s distorting mirror,They discovered the Meaning of Knowing.These pioneers have long adapted themselvesTo the night and the nightmare; they come equippedTo reply to terror with terror,With lies to unmask the least deception.For a future of marriage, nevertheless,The bed is prepared; though all our whiteness shrinksFrom the hairy and clumsy bridegroom,We conceive in the shuddering instant.For the barren must wish to bear, though the SpringPunish; and the crooked that dreads to be straightCannot alter its prayer, but summonsOut of the dark a horrible rector.O the striped and vigorous tiger can moveWith style through the borough of murder; the apeIs really at home in the parishOf grimacing and licking; but we haveFailed as their pupils. Our tears well from a loveWe have never outgrown; our cities predictMore than we hope; even our armiesHave to express our need of forgiveness.About the AuthorW. H. AudenW. H. Auden was a poet best known for works like “Funeral Blues,” “September 1, 1939,” and “The Shield of Achilles.”More StoriesPrefaceAubade"
