["https://www.theatlantic.com/author/rebecca-west"]
title = "Rebecca West, The Atlantic"
description = "Subscribe and support more than 160 years of independent journalism."
full_description = "Whittaker ChambersFew writers in the English-speaking world can match, in versatility, the accomplishments of REBECCA WEST. A successful novelist, she is also a distinguished authority on international affairs. Atlantic readers will recall her Black Lamb and Grey Falcon, which was serialized in this magazine and which is indispensable to any understanding of the Balkans. Many journalists in this country and in Britain regard her more recent writings, such as The Meaning of Treason, as the best reporting produced in the post-war period. She now considers the personality of Whittaker Chambers as revealed in Witness, just published by Random House.Rebecca WestJune 1, 1952 Black Lamb and Grey Falcon: Part V‘Violence was indeed all I knew of the Balkans,’ writes Rebecca West, ‘all I knew of the South Slavs. And since there proceeds steadily from the southeastern corner of Europe a stream of events which are a danger to me, which indeed for years threatened my safety and deprived me forever of many benefits, that is to say I know nothing of my own destiny. The Balkan Peninsula was only two or three days distant, yet I had never troubled to go that short journey, which might explain to me how I shall die, and why.’ So it was that in 1937 Rebecca West, with her husband, set out to explore the Balkans, and particularly Yugoslavia, to see for herself why the fate of the Continent and of England has so often been threatened by the Powderkeg of Europe. The story she brought back with her annihilates distance, and touches every thoughtful reader.Rebecca WestMay 1, 1941 Black Lamb and Grey Falcon: Part IV‘Violence was indeed all I knew of the Balkans,’ writes Rebecca West, ‘all I knew of the South Slavs. And since there proceeds steadily from the southeastern corner of Europe a stream of events which are a danger to me, which indeed for years threatened my safety and deprived me forever of many benefits, that is to say I know nothing of my own destiny. The Balkan Peninsula was only two or three days distant, yet I had never troubled to go that short journey, which might explain to me how I shall die, and why.’ So it was that in 1937 Rebecca West, with her husband, set out to explore the Balkans, and particularly Yugoslavia, to see for herself why the fate of the Continent and of England has so often been threatened by the Powderkeg of Europe. The story she brought back with her annihilates distance, and touches every thoughtful reader.Rebecca WestApril 1, 1941"
year_published = 2007
