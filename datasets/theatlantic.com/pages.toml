title = "Economy - The Atlantic"
description = "Analysis and reporting from The Atlantic on how economic policy, work, and money shape our lives and our world."
full_description = "Unemployment is low, but workers aren’t quitting and businesses aren’t hiring. What’s going on? No matter who wins in November, the digital-asset market could be on the brink of a deregulation-fueled bonanza. His allies now claim that he wouldn’t really impose massive global tariffs if elected. But the uncertainty created by threats is bad enough. Mike Solana, a Peter Thiel protégé, has made his Pirate Wires newsletter a must-read among the anti-woke investor class—and a window into what the most powerful people in tech really think. In many domains, the conventional wisdom among progressives is mistaken, oversimplified, or based on wishful thinking. The economics of immigration is not one of them. Eliminating degree requirements for jobs is very popular with voters but would do almost nothing to help workers who don’t have a college diploma. If you wish grocery stores were more expensive and offered less variety, then you’ll love his tariff proposal. Silicon Valley billionaires claim that antitrust enforcement hurts the little guy. Do they have a point? The real culprit is the host of federal laws and regulations propping up prices to benefit corporate interests. Just about every major development in the current presidential campaign started as a television event. Kamala Harris’s proposed price-gouging ban might irritate academics, but it makes sense to everyone else. Algorithmic collusion appears to be spreading to more and more industries. And existing laws may not be equipped to stop it. The joint venture between a legacy giant and an EV start-up will be a fascinating test of the industry’s effort to embrace technological change."
