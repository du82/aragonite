["https://theatlantic.com/podcasts/archive/2024/09/kleptocracy-club/680022"]
title = "The Kleptocracy Club - The Atlantic"
description = "Autocrats dump their democratic allies and keep the company of kleptocrats."
full_description = "PodcastsThe Kleptocracy ClubAutocrats dump their democratic allies and keep the company of kleptocrats.By Anne Applebaum and Peter PomerantsevIllustration by Christopher Chester / The Atlantic. Source: Getty / Shutterstock.September 27, 2024 ShareSave Listen-1.0x+0:0029:02Subscribe here: Apple Podcasts | Spotify | YouTube | Pocket CastsSince the earliest days of the republic, America’s international friendships have shaped domestic politics. And some of those friendships helped America strengthen its democratic principles. So what happens if America’s new friends are autocrats? John Bolton, former national security adviser for President Donald Trump, and Senator Sheldon Whitehouse of Rhode Island argue that if America no longer leads the democratic world and instead imports secrecy and kleptocracy from the autocratic world, American citizens will feel even more powerless, apathetic, disengaged, and cynical.This is the fourth episode of Autocracy in America, a five-part series about authoritarian tactics already at work in the United States and where to look for them.The following is a transcript of the episode:John Bolton: It started as we were going out to the NATO headquarters for the summit. He had spent the night before in the ambassador’s residence, as presidents often do. I was coming over from the delegation where we had stayed, and he called me on the car phone and said, You ready to make history today?Anne Applebaum: This is John Bolton, the former national security advisor for President Donald Trump.Bolton: And I said, Pardon me, or something like that. And he said, I think we need to get out. So I said, Let’s talk about it as soon as I get there. And shortly thereafter, Mike Pompeo, secretary of state, came by. It was very clear what Trump wanted to do. And we all rode out to the NATO headquarters. I called Jim Mattis, the defense secretary. I called John Kelly, the chief of staff. I said, It’s all hands on deck.[Music]Peter Pomerantsev: Anne, even the idea that America might leave NATO was in and of itself pretty destabilizing for global security.Applebaum: Right. NATO was created to be a deterrent—to prevent wars, to stop a Soviet invasion of Europe in the past, a Russian invasion now—and it was built around a promise of collective defense, that if one of the allies is attacked, the others will come to their aid.But over the past 75 years, it also came to represent something else. The alliance helped cement the deep economic, cultural, and political ties between the United States, Canada, and Europe. And it worked, mostly because most of the members shared the same values. But as Secretary Bolton told me, the most successful alliance in history almost didn’t make it through the first Trump administration.Bolton: Right up until the moment when Trump spoke at that huge table, in the NATO headquarters, we didn’t know what he was going to do. And I think he was within an inch of withdrawing. I believe that, and I believe that’s still what he wants to do.Applebaum: Trump’s threat implied that he would not honor the promise of collective defense. It also created discomfort because everyone understood that it reflected something deeper: The emergence of a different kind of America, an America that could turn away from its democratic partners and, instead, draw closer to the autocracies—a completely different vision of America’s role in the world.[Music]Pomerantsev: Well, even though it was new to the U.S., it’s a move straight out of the autocratic handbook.Applebaum: I’m Anne Applebaum, a staff writer at The Atlantic.Pomerantsev: I’m Peter Pomerantsev, a senior fellow at the SNF Agora Institute at Johns Hopkins University.Applebaum: This is Autocracy in America.Pomerantsev: This isn’t a show about America’s future. There are authoritarian tactics already at work, and we’re showing you where. There’s the rise of conspiracy theories, widening public apathy, politicized investigations, the takeover of the state.Applebaum: And in this episode: America joining the kleptocracy club.Peter, I’ve always thought of the United States as a country that leads an alliance of like-minded democracies. And I never questioned our promise to defend them, in Europe as well as Asia. We have military bases in Germany, Italy, Japan, more recently in Poland for exactly that purpose. But lately, I started thinking about how our alliances and our friendships around the world and our promises to help defend people also help strengthen our democracy here at home.Pomerantsev: Historically, it is kind of true. Britain is one of America’s oldest allies. And one of the countries America has this long, supposedly special relationship with, Britain, has had a big influence in America. The British abolished slavery before America did, for example, and a lot of British abolitionists inspired the rise of American abolitionism. Frederick Douglass spent time in Britain, as did many other abolitionists. And American and British campaigners against slavery supported one another. I think that mattered.Applebaum: Yeah, we also forget how, even more recently, American thinking has been affected by our awareness of our international role and reputation. Consider what the Justice Department was saying at the Supreme Court during the 1954 Brown v. Board of Education case.They filed a brief arguing that desegregation was in the U.S. interest, not simply for domestic reasons and not simply because it was right, but also because racist laws prompted, and I quote, “doubts even among friendly nations as to the intensity of our devotion to the democratic faith.”Pomerantsev: That’s quite a phrase: “our devotion to the democratic faith.”Applebaum: That’s what I mean by the influence of our allies. America put democracy at the center of its foreign policy, but it was also a part of our national identity: This is who we were. This is who we want to be. This is how we want to be seen. These are the countries that we have the closest relationships with. Other democracies, other republics—they can be constitutional monarchies. They can have parliaments instead of congresses. But these are our friends, and this is our world. And I think Americans felt it was important to remain in that group, and that had consequences for domestic policy as well.Pomerantsev: But just as there is a network of countries who push each other towards ever more democracy, there’s also a network of autocratic countries whose leaders are kleptocrats, essentially. They’re governments who share the same interest in stealing and hiding money—Applebaum: —and oppressing or arresting anybody who tries to stop them.Pomerantsev: Right. I mean, they aren’t connected to one another by ideology. They’re not all—I don’t know—theocracies or communist regimes, but they are united in their need to undermine the rule of law and repress their own people, as a result of wanting to steal money.Applebaum: Absolutely, and countries have moved from one camp to the other in the past. Look at Venezuela.[Music]Leopoldo López: Chavez created close relations with Putin.Applebaum: Leopoldo López is a former mayor of Chacao, a municipality of Caracas. He saw things begin to change there in 2006.López: It started when Chavez decided to change the assault rifle of the armed forces of Venezuela from a Belgian FAL rifle to an AK-103 and changing the F-16s [aircrafts] to the Sukhois.Applebaum: Venezuela was once one of the most successful democracies in our hemisphere. It was the richest country in South America and on a trajectory to become even richer. But when Hugo Chavez was elected leader—democratically elected—he went on to slowly dismantle Venezuelan courts, to break up the media, and, eventually, to undermine the economy. And Venezuela aligned itself with the group that I like to call Autocracy, Inc., or Autocracy, Incorporated.López: The level of investment that went from Venezuela to buy Russian equipment was huge—billions of dollars have been reported in the arms— Applebaum: And they were buying Russian arms because the Americans wouldn’t sell them arms, or others? López: Well, it started because of that, but then it just became more comfortable. And then Chavez invested billions of dollars in the air defense.[Music]Applebaum: López not only witnessed the decline of Venezuela, the end of Venezuelan democracy, but as a long-time prominent leader of the Venezuelan opposition, he experienced it as a political prisoner in solitary confinement—as a leader behind bars. He now lives in exile, where he writes and speaks about the rise of the modern autocratic, kleptocratic network and also about how Venezuela became part of it. He told me that Russia wasn’t the only country that Chávez made deals with.López: The Chinese came in with investments, and this is the practice of China in Africa. It’s very well known what they do in terms of locking in investments, that then they basically take ownership of critical infrastructure. And that happened in Venezuela.Applebaum: Peter, López is talking about billions of dollars pouring into Venezuela, but although it was described as a Chinese investment in the country, it didn’t ever really translate into improving the well-being of the Venezuelan people.López: Just to give you an example, one of the flagship projects of this relation between China and Venezuela was a train system. Applebaum: Yes, that train system, which was only partially built and even now, 15 years later, reportedly less than 1 percent operational— López: But billions of dollars were channeled into this. Then billions of dollars went into programs for housing of the Venezuelan people, and that’s nowhere to be seen. Applebaum: It all just vanished. López: It all just vanished. The Chinese don’t ask questions. Basically, it’s about using these investment engagements to create tighter relations and to lock in governments. So that’s Russia. That’s China. And then there’s Iran.[Music]Applebaum: Peter, Iran came for business agreements, for economic exchanges, even some involving nuclear energy. And Iran wasn’t just funding Venezuela. The Venezuelans also began helping the Iranians.López: They were giving Venezuelan passports to Iranian nationals, to people that ended up being members of Hezbollah. Applebaum: If America continues down a similar path, away from democracy and towards something different, what does that mean for countries like Venezuela? López: Well, that would mean—I wouldn’t say the end. But that would mean that the possibilities to transition for democracy in Venezuela would be greatly affected, without a doubt. NBC News journalist: Thousands protesting Venezuela’s contested election, the demand for freedom and democracy playing out in cities throughout Venezuela as well, condemning leader Nicolás Maduro, who insists he won re-election over opposition candidate Edmundo González Urrutia. [Crowd chanting] López: People hate Maduro.Applebaum: Venezuelans voted in huge numbers against Maduro in July’s elections, despite his enormous campaign of propaganda and harassment. When López and I talked, I had asked him how Maduro managed to stay in power for so long.López: Even though there are many ways to answer this question, I truly believe that the main reason why Maduro is still in power is because of the support he gets from Russia, from China, from Iran, from Cuba. So the struggle for a transition to democracy in Venezuela, as much as we would like it to be a sovereign issue, it’s not true, because we are fighting a global fight. We are fighting really against Maduro but also against Putin, against Xi Jinping, against the mullahs from Iran, because they are the lifeline of Maduro. Srdja Popovic: We figured out that authoritarianism, dictatorships are very different animals than they were 20, 30 years ago.Pomerantsev: Anne, you know Srdja Popovic. He’s an activist. He helped overthrow Serbia’s dictator Slobodan Milošević in 2000.Hearing you speak with Leopoldo López and his descriptions of the changes in Venezuela over the last 20 years made me think of the work Popovic has been doing. He studies how dictators function in the Middle East, Latin America, and Asia. And, Anne, Popovic’s research supports the thesis of your new book Autocracy, Inc., and how you’ve described this club of autocratic leaders.Popovic: Studying the field, working with people from authoritarian countries—20, 30 years ago, they would always require some kind of ideological component. Whether you’re talking about the Soviet Union, whether you’re talking about the Nazi Germany, it’s a different ideology that’s in the core of it. Modern autocracies—take Russia, for example—they look like corporations. You have the boss of the corporation, and then you have, in Russia’s case, tycoons that own all the companies. And then you have tools of maintaining the corporation, like military, media. These are all the tools. Basically, part of being incorporated means that you are cooperating with other parts and legs in the corporation.[Music]Pomerantsev: So what Popovich describes here, Anne, is an authoritarian network that functions as a corrupt corporation, basically.It’s funny—I saw this for myself when I was living in Moscow. It was in the mid-2000s. I remember walking down the high street, down Tverskaya, and it was full of these glitzy shops everywhere, and everybody was dressed in a very glamorous way, and the city was sort of bankers and lawyers, like the financial district of many Western capitals.And every couple of meters, there was a bank. And I was like, What on earth are all these banks doing? I remember going into one and trying to open, like, a personal checking account. And they just stared at me like an absolute moron, like, Why would you open a personal account in this bank?So I started asking people that I knew, Russians, What are all these banks doing? And they just started laughing, going, Well, they’re not banks the way you understand banks; they’re money-laundering vehicles. They’re vehicles tied to this minister or that businessman, and they open loads of these banks, or pseudo banks, and move their money through them and then move them abroad.But they were everywhere. This wasn’t like one little money-laundering exercise. You know, the whole city was basically one big money-laundering exercise. And I remember thinking, I don’t understand the model of this regime very well at all.Applebaum: And you didn’t understand it for a reason. You didn’t understand it because it was deliberately made incredibly complicated. Ordinary citizens, ordinary people aren’t meant to know where the money is or what the bank does. They’re not meant to have any influence or understanding or knowledge of politics at all because the essence of modern autocracy and modern dictatorships is secrecy.You know, they have ways of stealing and extracting money. They hide the money in different places around the world: It’s done through anonymous compani"
