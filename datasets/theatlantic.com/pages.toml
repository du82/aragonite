description = "The Atlantic’s cover stories and in-depth features on politics, culture, and more."
full_description = "The U.S. was once the world’s most geographically mobile society. Now we’re stuck in place—and that’s a very big problem. A perfect suit, made by an expert tailor out of superlative fabric, would do nothing less than transform me. Ali Smith scrambles plotlines, upends characters, and flouts chronology—while telling propulsively readable stories. The childhood friends behind the most audacious string of sports-memorabilia heists in American history Tens of millions of American Christians are embracing a charismatic movement known as the New Apostolic Reformation, which seeks to destroy the secular state. Americans are now spending more time alone than ever. It’s changing our personalities, our politics, and even our relationship to reality. India is now a testing ground for whether demagoguery or deteriorating living conditions exert a greater sway on voters. Weary soldiers and citizens express fatalistic optimism while preparing for the loss of U.S. military support. The U.S. failed to produce weapons and ammunition fast enough to supply Ukraine. Could it equip its own armed forces in the event of war? In 1893, a U.S.-backed coup overthrew the Islands’ sovereign government. What does America owe Hawai‘i now? I ka makahiki 1893, ua hoʻokahuli ʻia ke aupuni ʻo Hawaiʻi e ko ʻAmelika. Makemake ko Hawaiʻi e kūʻokoʻa hou ai ke aupuni. The actor spent years stuck in small, clichéd roles. Now, starring in Interior Chinatown, he’s figuring out who he wants to be."
