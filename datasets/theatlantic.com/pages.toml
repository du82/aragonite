title = "Vannevar Bush, The Atlantic"
description = "Vannevar Bush was an engineer and administrator who led the U.S. Office of Scientific Research and Development during World War II."
full_description = "Churchill and the ScientistsLong identified with the Massachusetts Institute of Technology, which he served as vice president and dean of engineering from 1932 to 1938, DR. VANNEVAR BUSH left Cambridge to become president of the Carnegie Institution in Washington. There he was selected by President Franklin Delano Roosevelt to head up the extraordinary war team of some six thousand American scientists eventually known as the Office of Scientific Research and Development. With this authority he was brought into close touch with British scientists also working on national defense, and in crises with the Prime Minister himself.Vannevar BushMarch 1, 1965 Disturbed Americans: Criticisms and CommentsIn July, 1961, the ATLANTICpublished a Special Supplement, Psychiatry in American Life, (now available in book form) in which the majority of the contributors were psychoanalytically oriented. In July of this year we returned to the subject of mental illness with the deliberate intent of discussing other forms of treatment, and of inquiring into the present care and needs of the community. Those analysts who have angrily resisted the criticism we brought to bear should remember that our approach has not been one-sided and that medical procedure, now as at the time of the famous Flexner Report, must be open to the public inspection both by the professional and the layman. Our issue on Disturbed Americans has been more widely read than any other this year, and the responses to it, only a fraction of which we can publish, manifest the deep concern of a conscientious public. — The EditorBarry Bingham, Mara E. Mulligan, Samuel C. Klagsbrun, J. David Stern, Joseph Dubey, Walter Lippmann, Margaret Wood, Earle C. Hoghwald, Robert Fleming, Irving Blumberg, Marseille Spetz, Vannevar Bush, and Daniel BlainOctober 1, 1964 Can Men Live Without War?“If war ends, we must still have outlets for our inherited energies; we need only attempt to render them dignified and worthy.”Vannevar BushFebruary 1, 1956"
