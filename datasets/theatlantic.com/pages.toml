full_description = "Making and Judging PoetryLast spring two distinguished Englishmen were nominated to fill the chair of Professor of Poetry at Oxford University, W. H. AUDEN and Harold Nicolson. There was heated argument among the dons and undergraduates; signs reading“Auden for Prof” were chalked on the walls; and when at last the votes were counted, it was indeed the poet who had been elected. On his inauguration Mr. Auden, after paying his respects to the office and to the line of distinguished scholars and poets who had preceded him, began to speak of the Censor, that inner voice and self-critic who occupies and determines each individual poet in his time.W. H. AudenJanuary 1, 1957"
