title = "About | Theatre Bee"
description = "Theatre Bee is an avid theatregoer and London resident. It blogs about cheap theatre tickets to help you save money. It also reviews the latest mainstream and fringe plays and musicals in London."
full_description = "Love the West End but hate the prices? Looking for a guide to cheap theatre tickets?Look no further. Theatre Bee has tons of tips to get you the cheapest price on every theatre ticket. No, the bee will not repeat things you already know. Like 'book in advance', or 'call the box office for day seats', or a hundred other ideas that just aren't as exciting as the instant gratification of getting a great seat at a bargain price for a in-the-very-near-future performance. Theatre Bee also loves reflecting about shows after it has watched them, so do check out its reviews. The human condition is so very interesting. You humans are fascinating creatures. ​ The bee designs its own range of theatre merch. Check these out by clicking Merch on the site menu. The bee does not make any money from this site. Its merchandise store is entirely non-profit. The bee is not affiliated with any of the external links on this site and does not earn any commission when you click on them. If you like the bee's work on this site, would you consider buying the bee a coffee and helping it maintain this site? 100% of your donations are spent on keeping this site up and running, which costs the bee around £100 a year."
