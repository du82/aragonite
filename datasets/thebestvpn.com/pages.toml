title = "NordVPN vs ExpressVPN in 2023 (10 Tests & Comparisons)"
description = "ExpressVPN vs NordVPN - Two of the industry giants going head to head. In this thorough comparison, you'll see who comes out on top."
full_description = "NordVPN vs ExpressVPN Last updated: September 6, 2023September 7, 2023 Rob Mardisalu September 7, 2023 Which one is a better VPN provider – NordVPN or ExpressVPN? Let’s find out in our detailed comparison below… In 2023, NordVPN and ExpressVPN are probably the two most well-known and reputable VPN services on the market. However, choosing one for another isn’t that easy. At first glance, they look pretty much similar. After testing the speed, Netflix availability, torrenting/P2P, customer support, usability, and vulnerabilities we found out that there are some differences. There’s also a big difference in their subscription cost which indicates towards NordVPN as the more affordable option but let’s take a deeper look… Below is the table of contents of our NordVPN vs ExpressVPN review: Cost Comparison Speed Test Netflix Test Torrenting Test Customer Support Test Security Features Comparison Usability Test Privacy & Jurisdiction Comparison Leak Tests Gaming Test 1. Cost: NordVPN vs ExpressVPN Conclusion: NordVPN is 55% cheaper NordVPN offers four different subscription plans (including a 7-day free trial) and ExpressVPN offers three different plans (without a free trial). All of their plans are identical, meaning you get the same features, the only thing that changes is the subscription period – from one month to three years. If you opt-in for a longer period, you’ll be able to get it for a cheaper price. That’s pretty much it. Let’s break down their pricing plans below: NordVPN Pricing ExpressVPN Pricing Monthly Plan: $11.99/mo Monthly Plan: $12.95/mo 1-Year Plan: $4.50/mo 6-Month Plan: $9.99/mo 2-Year Plan: $2.99/mo 15-Month Plan: $6.67/mo 3-Year Plan: None 3-Year Plan: None Free Trial: 7 Days Free Trial: None In a nutshell, If you opt-in with NordVPN for 2 years upfront, the monthly cost will be 55% cheaper than ExpressVPN longest plan (15 months). If you’re on a budget and don’t want to spend money on a VPN, consider getting a NordVPN because it’s cheaper, currently priced at $2.99/mo + VAT. NordVPN and ExpressVPN both allow you to pay for their service using popular credit cards, bitcoin and even alternative payment methods, such as AliPay, WebMoney and UnionPay. As of now, ExpressVPN offers its users to pay through PayPal, but NordVPN doesn’t. Both of the VPNs offer 30 days money-back guarantee. However, we’ve received some user reviews that claim that NordVPN refunds can take a while to process, so be aware of this. 2. Speed Test: NordVPN vs ExpressVPN Conclusion: ExpressVPN is 10-15% faster than NordVPN When choosing a VPN, speed is probably one of the most important factors. Since NordVPN is cheaper than ExpressVPN, it probably has more customers and users. More users mean more people are penetrating their servers which could result in slower speed test result. Despite NordVPN having more servers (5200+) compared to ExpressVPN’s 3000+, their NordVPN seems to be slightly slower. Don’t get me wrong. Nor NordVPN or ExpressVPN is slow – many of our tested VPNs are far more slower. Keep in mind that our benchmark without VPN was ~98Mbps download ~53Mbps upload: Download and upload benchmark without a VPN (using speedtest.net) To find out which VPN has better performance, we conducted multiple tests using different servers in different regions, here are our test results: NordVPN Results: NordVPN EU Server NordVPN US Server NordVPN Asia Server Ping: 37ms Ping: 101ms Ping: 211ms Download: 74Mbps Download: 56Mbps Download: 12Mbps Upload: 48Mbps Upload: 29Mbps Upload: 5Mbps ExpressVPN Results: ExpressVPN EU Server ExpressVPN US Server ExpressVPN Asia Server Ping: 40ms Ping: 110ms Ping: 292ms Download: 83Mbps Download: 60Mbps Download: 30Mbps Upload: 51Mbps Upload: 30Mbps Upload: 12Mbps For conclusion, according to our tests, ExpressVPN is faster in… Europe by 12% than NordVPN USA by 7% than NordVPN Asia by 58% than NordVPN Since we only tested a handful of servers, please take speed tests with a grain of salt as they vary on a lot of different things – your computer, your Internet connection, your router, your physical location, etc… 3. Netflix Test: NordVPN vs ExpressVPN Conclusion: ExpressVPN is more efficient unblocking Netflix Our next test was to compare ExpressVPNs and NordVPNs ability unblock geo-restricted websites, especially Netflix and their US library. Both worked extremely well in bypassing all sorts of geo-restrictions. In total, we tested 12 different servers for accessing Netflix using NordVPN and ExpressVPN. Here are the results: NordVPN ExpressVPN US Server 1: Unblocked US Server 1: Unblocked US Sever 2: Unblocked US Server 2: Unblocked UK Server: Unblocked UK Server 1: Unblocked NL Server: Unblocked UK Server 1: Unblocked Canada Server: Unblocked NL Server: Unblocked Sweden Server: Blocked Canada Server: Unblocked This is a relatively good result form both sites as many VPNs failed to unblock Netflix at all (see full Netflix test results here). What’s good, both of them offer extensive help through live chat to help you bypass Netflix restrictions which you can see in our next test. 4. Torrenting Test: NordVPN vs ExpressVPN Conclusion: NordVPN is around 8% faster than ExpressVPN (Recommended server was tested) Many people use VPNs solely for torrenting. Just to stay safe, avoid any DMCA letters from your ISP and so on. For example, if you live in the US and you are caught torrenting files through P2P software like uTorrent, you’ll likely receive a letter in the mail from your ISP, on behalf of the copyright holder, indicating the infringement under the DMCA. While we, at thebestvpn.com encourage you NOT to torrent or download pirated content, using VPNs will help you keep 100% anonymity and security. However, many VPNs limit or block torrenting altogether, just to name a few – DotVPN, Kaspersky VPN and many others. But what’s the case with ExpressVPN and NordVPN? Let’s take a look: According to NordVPNs website, NordVPN claims themselves to be the best VPN for torrenting: All of their servers allow torrenting/P2P and there are no limitations whatsoever: NordVPN even offers hundreds of servers optimized for P2P But what’s the case with ExpressVPN? Do they, too, allow torrenting on all of their servers? Seems so… That’s good. But let’s take a look at their average speed when downloading a certain file from torrent. In our example, we tried to download the Mac installer using NordVPN and ExpressVPN smart (fastest) location: Here’s NordVPN speed while downloading “Dr. Martin Luther King Jr. – Complete Speeches and Sermons” torrent from ThePirateBay.org: Here’s ExpressVPN speed when downloading “Dr. Martin Luther King Jr. – Complete Speeches and Sermons” torrent from ThePirateBay.org: We downloaded the same torrent, from the same site with both VPNs. Note that this torrent doesn’t have a lot of people seeding it, that’s why its download speed isn’t that great (the more p2p seeders, the faster your speed will be). The speed without a VPN was around the same as connected to one, therefore there’s no major loss in speed while using a VPN. For conclusion, while both of the VPNs allow torrenting 100%, NordVPN seems to be slightly faster, around 80kb/s. A lot of the torrents you download are going to be faster, since they’ve got a lot more people seeding them. Always test out a couple of servers to find out the best one for yourself. We used the recommended servers for this test, they’re both located in Estonia, the country we’re based in. 5. Support Test: NordVPN vs ExpressVPN Conclusion: Both customer support reps were equally good To test out support responsiveness and response time, we simply asked them one simple question: “Which servers are best for streaming Netflix?”. Since both of the VPN services offer live chat, we decided to ask our question through that. Below is NordVPNs customer support answer via live chat: Although it seemed like a copy-paste response, it was exactly what we were looking for. The total time to respond to our question was ~24 seconds. Not bad… We asked the same question from ExpressVPN, too. Here is their support reply to our question: ExpressVPN response was more personal, but their total response time was much slower than NordVPNs: If you are into quicker response time, NordVPN beats ExpressVPN in customer support. However, if you’re into more tailored replies, ExpressVPN is probably better. Both of the questions were asked when we’re logged into their admin dashboard. We didn’t test their sales support. Overall, you shouldn’t be worried about their customer support – both were much better than the average we’ve seen in our VPN reviews. 6. Features: NordVPN vs ExpressVPN Conclusion: Both offer a wide variety of industry-standard features and add-ons Both providers offer similar features to their VPN apps. Here are the most important features that both NordVPN and ExpressVPN offer to their users: Windows, Mac, iOS, Android, Linux, Router and TOR compatibility Built-in kill-switch DNS leak protection (no leaks found) Strict no logging policy Torrenting & P2P allowed OpenVPN, IKEv2, IPSec and PPTP protocols 256-bit AES encryption Browser extension available Obfuscated servers (a feature that allows you to connect to a VPN from restricted countries and environments) These are the so-called “basics” that every VPN app should have. However, there are a couple of “add-ons” that one has and the other doesn’t. For example, NordVPN offers the following that ExpressVPN doesn’t have: Double VPN Encryption – They are used to chain the connection through a couple of VPN servers, making it virtually impossible to track and identify the user (read more). CyberSec Features – for blocking ads and malware (read more) Up to 6 simultaneous connections (compared to 5 max connections on ExpressVPN) 5200+ servers in 61 countries Also, ExpressVPN offers the following that NordVPN doesn’t have: Split-tunneling (read more) You can pay using PayPal (NordVPN doesn’t offer PayPal payment method) Servers in 94 countries (NordVPN has 61 countries) As you can see, there’s not much difference in terms of what they offer. Either way, you’ll get a lot of bang for a buck. 7. Usability: NordVPN vs ExpressVPN Conclusion: Both are very simple and smooth, but NordVPN connects faster to a smart location Again, both of the VPN apps are very simple and easy to use. Basically, one click to connect and forget it. They offer ready-made apps for Windows, Mac, Android and iOS. Here’s how ExpressVPN and NordVPN app looks on a Mac computer: ExpressVPN is on the left and NordVPN is on the right side (both are Mac apps). Both apps are very minimalistic, with the ability to browse through different servers in different regions as well as tweak the settings, such as protocols, kill-switch (on/off), DNS settings and so on. As we couldn’t compare the usability much – very similar apps, we decided to test which one connects faster to the smart location (closest and fastest server to you). NordVPN connected in 3.62 seconds ExpressVPN connected in 5.92 seconds Not a big difference, but NordVPN was faster. 8. Privacy & Jurisdiction: NordVPN vs ExpressVPN Conclusion: NordVPN is more anonymous First off, ExpressVPN and NordVPN both respect your privacy at the highest level. In fact, they both are very secretive and not transparent at all about their parent company or who they belong to. After some digging, it’s fair to say that NordVPN belongs to Tefincom S.A which is a Panama company. ExpressVPN claims to be Express VPN International Ltd which is a company based in the British Virgin Islands. However, there’ve been rumours on Reddit that most of the NordVPN staff works in Lithuania and ExpressVPN staff is based in Hong Kong. Whichever the case is, let’s take a deeper look at their logging policies and privacy policies: NordVPN ExpressVPN Your IP Address: No Your IP Address: No Browsing History: No Browsing History: No DNS Queries: No DNS Queries: No Traffic destination: No Traffic destination: No Files downloaded: No Files Downloaded: No Regarding the warrant canaries: NordVPN’s warrant canary – last updated June 2017 ExpressVPN’s warrant canary – not available First, let’s take a look at what kind of data is being stored by ExpressVPN: Apps and app versions that are activated Dates when connected to the VPN services Choice of VPN server location Bandwidth used per day Your Name Your Email address Your Payment information While they store some data about you, it still remains fully private since they don’t log your activity which means they cannot connect any of your browsing to your account. That’s solely for keeping their VPN services high quality and smoothly process your payments. Now, let’s take a look at what kind of data is being stored by NordVPN: Server load information Your email address Your payment information Your username Your connection time (being wiped within 15 minutes after connecting) Their privacy policy page doesn’t say more about which data is being stored, but this limited data is being stored for no longer than 2 years after the last use of NordVPN services. Despite both of them being “no logs” VPNs, they don’t allow any unlawful, illicit, criminal or fraudulent activities. Regarding their VPN jurisdictions, NordVPN seems to have chosen a better location – Panama, which does not require any data storage. While ExpressVPN being officially based in the British Virgin Islands, it too doesn’t have a mandatory data retention law. However, BVI has strong ties to the UK which is known for strict regulatory. VPN companies based in the UK may be subject to the same data retention laws applicable to internet service providers. The UK has also reportedly blocked some VPNs. 9. Leak Test: NordVPN vs ExpressVPN Conclusion: Both NordVPN and ExpressVPN are safe and do not have any IP, DNS or WebRTC leaks Many poor quality VPNs, especially free ones, are known to leak your IP (see our 2018 leak test). However, that’s not the case with NordVPN or ExpressVPN. According to our test, none of them leaked any of your IP’s or DNS. In addition to that, they both have built-in killswitch which disconnects you automatically to avoid any leaks. Furthermore, there are Google Chrome extensions that are generally know to leak your IP. For example, a test we did in 2018 indicated that more than 10 VPNs (such as Hoxx VPN, Hola, DotVPN and Betternet) leaked your data through WebRTC. To test leaks, we simply connected to NordVPN and ExpressVPN servers using Mac app and chrome extensions and run some quick tests using the the following sites: https://ipleak.net https://www.perfect-privacy.com/check-ip/ https://ipx.ac/run/ https://browserleaks.com/webrtc/ https://www.perfect-privacy.com/dns-leaktest/ https://dnsleak.com/ As a result, we couldn’t find any leaks. See images below: no leaks found in NordVPN US server 10. Gaming Test: NordVPN vs ExpressVPN Conclusion: NordVPN had less packet loss So for the gamers out here who are looking for a mo"
