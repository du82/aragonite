gal in the country. Burundi Is VPN Legal in Burundi? Yes With just 2 percent of its 10 million citizens using the Internet, Burundi’s government hasn’t been slack when it comes to enforcing restrictions on the Internet. Once making news for banning WhatsApp and Viber, Burundi actively censors citizens’ Internet access. However, the use of VPNs is legal in Burundi. C Cape Verde Is VPN Legal in Cape Verde? Yes There hasn’t been any documented report of the Cape Verde government trying to censor the Internet. The use of VPNs is also legal in Cape Verde. Cambodia Is VPN Legal in Cambodia? Yes Cambodia has repeatedly made the news for active efforts to censor the Internet, including having members of the opposition arrested for Facebook posts. The Cambodian government even passed legislation that gave the government more power to monitor and censor the internet. However, the use of VPNs is still legal in Cambodia. Cameroon Is VPN Legal in Cameroon? Yes Cameroon recently made news for blocking internet access i"
