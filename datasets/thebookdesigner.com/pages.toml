title = "10 Ways Free iPhone Apps Supercharge Writers"
description = "10 Ways Free iPhone Apps Supercharge Writers including Maps, Camera, Voice Recorder, Evernote, Dropbox and Clock"
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> Back when I was growing up, science fiction was full of wonders that seemed impossible at the time. One that fascinated me was the “personal communicator,” like those used by Captain Kirk on Star Trek. These amazing devices would allow you to communicate wirelessly with other people and retrieve information from a vast compendium located, well, somewhere else. Just a dream? The promise of the mobile communicator had to wait until the advent of the cell phone. Even then, and even though the Motorola flip phones of a few years ago looked suspiciously like the communicator carried by Captain Kirk and his crewmates, it still wasn’t enough. We really entered the era of robust mobile communication with the arrival of the iPhone a few years ago. Now, whether you use Apple or Android, the smartphone in your purse or pocket has gone way beyond the imagination of the Star Trek writers of 40 years ago. I was reminded of this because, as the smartphone—in my case, the iPhone—has become more widespread and more matter-of-fact, it has also found a home with lots of different kinds of people besides the early adopters, tech heads and business users who usually make up the early audience for a lot of technology. Here are 10 ways I’m using my “mobile communicator” to help with my writing, blogging and other creative tasks. Each of these has become part of my daily work life. Maybe they’ll work for you, too. (In this list I’ve included only functions you can get from the free apps that come with your phone, or with apps that are free, so if you already own an iPhone, these won’t cost you a cent.) <img src="https://www.thebookdesigner.com/wp-content/uploads/2012/04/mic.png" alt="author platform" title="Voice recorder" width="530" height="175" class="alignnone size-full wp-image-21073" />Use Voice memo recorder: <img src="https://www.thebookdesigner.com/wp-content/uploads/2012/04/evernote-logo.png" alt="author platform" title="evernote-logo" width="530" height="175" class="alignnone size-full wp-image-21079" />Use Evernote:'
