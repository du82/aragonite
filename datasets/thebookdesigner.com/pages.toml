["https://www.thebookdesigner.com/10-steps-for-authors-who-want-to-get-started-on-twitter"]
title = "10 Steps for Authors Who Want to Get Started on Twitter"
description = "Authors Who Want to Get Started on Twitter can follow these simple ten steps to learn how to find people to follow, and how to start building a tribe."
full_description = '''<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> <img width="530" height="275" src='https://www.thebookdesigner.com/wp-content/uploads/2015/09/3418801881_873ebc8391_b.jpg' style='max-width:500px' class='thesis_img'/> Do you have a fear of Twitter engagement? Do you have an account on the service but don’t know quite what to do with it? Are you getting ready to publish a book and realize you have to “get up to speed” with your social media marketing? A lot of authors I talk to want to learn social media and how it’s going to help them sell thousands of books by “going viral.” But they hesitate, baffled by how the whole thing works. They know they need to be building their author platforms, but don’t know how Twitter fits in. I don’t think you need to buy a book like “Secrets to Twitter Success” because it’s really a pretty simple platform. There are only a few things you can actually do on Twitter. Everything else that flows from your involvement with it comes from the network of people you connect with. And in order to connect with the people you want to tell about your work, you have to forget the whole idea of “how Twitter will sell thousands of books” entirely. Because it won’t. Not directly, anyway. Twitter is powerful, but its power is in connecting to other people, in growing a community around the value of the content and ideas you share. I’m confident you can use it to your benefit if you can only get started. These are simple things you can do to get going with Twitter, and to learn about what goes on there and how it works. Twitter is an amazing phenomenon, considering that it only consists of 140 characters of basic text. The creativity, the energy and vitality on Twitter are astonishing. It can be a great place to connect to people who are interested in your work, and who in turn will send your message out into their own networks of followers.'''
year_published = 2010
year_updated = 2022
