["https://www.thebookdesigner.com/15-steps-to-video"]
title = "15 Steps to Create Great Blog Videos"
description = "15 Steps to Create Great Blog Videos describes the processes and tools used to create, edit and upload videos."
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> Video is everywhere in blogs today. As many people predicted, when web surfers get broadband internet service, they want blog video and lots of it. Let’s face it, we’ve all be raised on television in one way or another, and that’s got to be a powerful influence. Lots of people enjoy learning through video lessons, and if it’s entertainment that drives your blog and your books, there’s no better way to deliver it than through video. In order to deliver great content, it seems like you have to get your videos to look good, too. A year or two ago you could probably get away with bad-looking video if your content was good. But the spread of video has also raised the bar as far as what looks “good” to the average viewer. A few weeks ago a woman walked up to me at a publishing group meeting and introduced herself. “Actually,” she said, “I feel like I already know you since I’ve been watching your videos.” Wow, that was great, because that’s just what I was aiming for. It’s also the way I feel about people I’ve watched on blog videos, and it’s a powerful testament to how we humans connect and how, if we invest ourselves in what we’re doing, it can really affect other people. Last week I posted a video instead of writing a post. At times I’ve wondered whether making a video takes more or less time than writing a typical 1,000-word article. Over the past year I’ve acquired equipment for doing videos, gotten a ton of practice, and created hours of video for my online training course for authors, The Self-Publishing Roadmap. So while I’m sitting at my desk pounding on my keyboard, right behind me are the lights, tripod, camera and a big whiteboard just waiting to be used. With video, you get much more involved with technology and completely different kinds of processes. For short videos you might not need a script if you already know what you want to say, so at least you can avoid the writing part if you’re confident on your feet.'
