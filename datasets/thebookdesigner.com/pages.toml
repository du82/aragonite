["https://www.thebookdesigner.com/16-technology-paradoxes"]
title = "16 Paradoxes Created by Technology"
description = "Techology disruption is a relentless, implacable, accelerating force unto itself. We embrace it for its benefits without understanding their consequences."
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> I can’t think of any better way to end 2015 than with a guest post from Mike Larsen (you can read his bio below). Mike keeps his finger on the pulse of the publishing world through his wide network of friends and colleagues. Combine that with his love for lists (they make great handouts!) and quotable style, and you’ll see why I’m always happy to have one of his articles for the blog. Today, Mike takes on the paradoxes inherent in the constantly changing technology landscape that every author faces. Like climate disruption, tech disruption is a relentless, implacable, accelerating force unto itself. We embrace it for its benefits without understanding their consequences. Tech is driven by profit, competition, the need to grow and satisfy stakeholders, and an innovate-or-die pressure that force tech companies to be more concerned about profit than people or the planet, the essential sources of sustainability. The need for profit undermines idealism and makes the phrase “ethical corporation” an oxymoron. Tech disruption is as important as climate disruption, and we control both equally. <img src="https://www.thebookdesigner.com/wp-content/uploads/2013/11/Mike-Larsen2.jpeg" alt="Mike Larsen" width="96" height="96" class="alignright size-full wp-image-29878" />Michael Larsen is a principal in the Larsen-Pomada Literary Agency. He is the author of several books including How to Write a Book Proposal and the book proposal templates based on it. Michael is also the founder of the San Francisco Writer’s Conference: A Celebration of Craft, Commerce & Community and the San Francisco Writing for Change Conference. And he writes a blog, too. At THEBOOKDESIGNER.COM, our goal is to be your go-to resource for all things related to high-quality book design. Whether you are a first-time author or book designer by trade, we are committed to helping you navigate self-publishing by giving you the tools and resources you need to stand out in a competitive industry.'
