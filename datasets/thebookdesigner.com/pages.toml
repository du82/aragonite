["https://www.thebookdesigner.com/15-ebook-covers-success-and-failure-in-the-kindle-store"]
title = "15 Ebook Covers: Success and Failure in the Kindle Store"
description = "15 Ebook Covers: Success and Failure in the Kindle Store. An examination of some of the top selling books in the Kindle store yields surprises"
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> Everyone wants to join the ebook revolution, from what I can see, and ebook covers are a big part of that potential success. More books are going “straight to digital” the way films used to go “straight to video.” You can almost hear people scratching their heads, wondering, “Why should I deal with the cost of a printed book? Is anyone still buying them?” Rationally, we know that print books continue to make up the vast majority of the market, but the momentum seems to be all on the digital side. Displays of digital ebook readers face the doorways of many of the retailers we’re headed for before the holidays. Amazon, Apple, Barnes & Noble, and Samsung are on television with their devices. And more people are asking about converting their books to ebooks. New projects are starting off with an eye to being sold online anyway. I took a stroll over to the Kindle store to do some browsing in the granddaddy of the ebook stores. Looking through the “Top 100,” it’s remarkable how many different forces are at work in presenting ebooks. I picked out a bunch of covers to take a closer look at. Some of these clearly are winners—they’ve made the leap to a different format successfully, and do a great job of selling their books. Others . . . not so much. Take a look. You see these covers in two formats, like the rest of Amazon’s displays. A page of search results will show very small thumbnails—60 x 90 pixels—that are extremely challenging to carry off as any kind of good design. When you go to the product detail page, you’ll get a larger—300 pixels high—image, which makes it a lot easier to see the covers. In some cases, I have both versions for you to look at. <img class="alignnone size-full wp-image-10523" title="41tHTARRY1L._SL500_AA266_PIkin3,BottomRight,-16,34_AA300_SH20_OU01_ copy" src="https://www.thebookdesigner.com/wp-content/uploads/2010/12/41tHTARRY1L._SL500_AA266_PIkin3BottomRight-1634_AA300_SH20_OU01_-copy.jpg" alt="" width="400" height="300" />'
