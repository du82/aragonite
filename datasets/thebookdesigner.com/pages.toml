["https://www.thebookdesigner.com/10-reasons-why-you-should-interview-your-fellow-fiction-authors"]
title = "10 Reasons Why You Should Interview Your Fellow Fiction Authors by Jason Kong"
description = "10 Reasons Why You Should Interview Your Fellow Fiction Authors by Jason Kong offers ten reasons why fiction authors should really consider interviewing their fellow fiction authors."
full_description = '<img src="https://secure.gravatar.com/avatar/7c81fa6c3f567b3996d0462ec56b1c37?s=160&amp;d=mm&amp;r=g" width="160" height="160" alt="Jason Kong" /> You’ve seen plenty of author interviews on the internet. You should really consider doing one yourself. Identify an author who writes for an audience similar to yours, and request for some of her time. Come up with a list of interesting questions about her storytelling. Record the exchange. Publish the conversation online. I know what you’re thinking. You’re busy with a ton of things you need to do. Why should you bother playing Barbara Walters or David Letterman? In most cases, the interviewee will be as motivated to promote the end product as you are. And any traffic initiated from her end will arrive to your site, if that’s where the final interview is published. Best of all, this is attention garnered from a source of trust — the subject of the interview they’re coming to see. It’s not easy to keep your readership engaged when you’re between book releases. One way is to introduce a compelling author, and an interview provides a means to do that. But as writer S.J. Pajonas notes, asking the right questions is key: “My audience is either scifi readers or romance readers (or the intersection of both) so I try to ask questions of the other author that will appeal to those readers.” Whether you have a blog, email list, or any form of social media, you’re always on the lookout for the next thing to share. Author Joanna Penn includes an interview every month in her JFPenn newsletter, which also acts as a book recommendation. As a writer, most of your work is done in isolation. Publishing a interview with a fellow author introduces some variety, not only for you in producing it, but for your audience in consuming it. Coming up with material from scratch can be difficult. But transcribing a conversation and editing for clarity? Not nearly as taxing. Enjoy your breather while you can! We’re seeing more podcasting and video these days, and depending on your situation they’re good options for you too. Interviews present well in both those formats, and you aren’t under the pressure of talking non-stop for the entire recording.'
