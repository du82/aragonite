["https://www.thebookdesigner.com/10-ways-authors-can-grow-a-facebook-group"]
title = "10 Ways Authors Can Grow a Facebook Group - The Book Designer"
description = "If you want more than 1% of your fans to see your Facebook author page posts, you have to buy advertising. Using Facebook groups instead of author pages or in conjunction with them is a good way around this."
full_description = '<img src="https://secure.gravatar.com/avatar/b56223daea920122c9831bd2ef043e51?s=160&amp;d=mm&amp;r=g" width="160" height="160" alt="Frances Caballo" /> Facebook can be a downright drag. No, I’m not talking about the Cambridge Analytica firestorm or Mark Zuckerberg’s appearance before a Senate hearing, which, by the way, was a real snoozer. Eons ago, like maybe six years ago in reality, if you wrote a status update on your Facebook author page you could rest assured that about 36% of your fans would see what you’d posted. Each year since then brought new tweaks to Facebook’s algorithm to the point now that you’re lucky if 1% of your updates make it into your fans’ newsfeeds. Mark Zuckerberg says he changed the algorithm so that people with Facebook profiles could see more of what they want to see, posts from friends and family members. I, of course, think the reason is more nefarious. Zuckerberg has to monetize Facebook and how can he do that? With ads of course. So, if you want more than 1% of your fans to see your posts, guess what? Yep, you have to buy advertising. There is a way around this, you know. What? Facebook groups. More and more romance authors are using groups instead of Facebook author pages or in conjunction with them. Actually, a lot of experts who run courses also offer Facebook groups as a benefit of a buying a course. If you’d like to see a Facebook group in action, here’s a link to 20 of them. But if you want to know how to set up a Facebook group of your own, keep reading. To set up your first Facebook group, go to your profile, click the inverted arrow, and select Create Group. Next, you’ll need to name your group and add at least one Facebook friend you know who will want to be in the group. Also, decide whether you want the group to be private. Once you finish, click Create. <img src="https://www.thebookdesigner.com/wp-content/uploads/2018/04/FB-Groups-Image-1.jpg" alt="" width="375" height="360" class="aligncenter size-full wp-image-69346" srcset="https://www.thebookdesigner.com/wp-content/uploads/2018/04/FB-Groups-Image-1.jpg 375w, https://www.thebookdesigner.com/wp-content/uploads/2018/04/FB-Groups-Image-1-300x288.jpg 300w" sizes="(max-width: 375px) 100vw, 375px" />'
author = "https://www.facebook.com/fcaballo"
