["https://www.thebookdesigner.com/10-writing-exercises-to-free-your-mind"]
title = "10 Writing Exercises to Free Your Mind"
description = "10 Writing Exercises to Free Your Mind and allow your creative energy to operate with less interference from the logical day to day mind."
full_description = '''<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> <img width="530" height="275" src='https://www.thebookdesigner.com/wp-content/uploads/2015/09/740985761_4a8c4d6103_z.jpg' style='max-width:500px' class='thesis_img'/> For two years I wrote with a few other writers every Thursday evening. We were taught, and then continued on our own, with the practice of freewriting. Over the months, it became apparent that to keep out of patterns, to keep our inspiration fresh, we had to use exercises, prompts, ways to shake up our ordinary mind. That mind has great work to do, (I wouldn’t want to do my taxes without it), but it’s out of its element in creativity, and just ruins everything. No, we needed shocks, new ways to put the same ideas together to yield something fresh. These are some of the ideas that have worked the best for me. Use them. You don’t need a group, you don’t even need another person, although it’s good fun to go off to a coffee shop and write with a friend, or with your wife, for a couple of hours. It’s amazing what you might learn. These freewriting exercises need a prompt of some kind and a timer. Do 10 minutes to start, everyone beginning and ending together. In each case, the idea is to surprise your mind, to knock it out of its ordinary way of operating. Random words, music, nonsense phrases defeat our logical mind, which is incessantly trying to make sense of everything. But not everything is logical, is it? Creativity isn’t logical. Often it isn’t sane, or safe, or staying inside the lines. In freewriting we want to give permission to the writing mind to go wherever it likes. That’s the crucial thing, to be following it. To be the willing instrument of our own creativity, not some mastermind directing the action. If we allow the mind to flow freely, even if it doesn’t make sense on the surface, we allow all kinds of new connections, surprising insights, unique arrangements to come into view.'''
