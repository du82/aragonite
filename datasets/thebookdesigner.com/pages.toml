["https://www.thebookdesigner.com/1000-words"]
title = "Is a Picture Worth 1000 Words?"
description = "Is a Picture Worth 1000 Words? A picture and one thousand words are put together in an attempt to recapture a moment in time."
full_description = '''<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> <img width="530" height="428" src='https://www.thebookdesigner.com/wp-content/uploads/2015/09/ABA-with-Powell1.jpg' style='max-width:500px' class='thesis_img'/> The year would was 1992. We’re standing at the ABA (Now Book Expo America) in Anaheim, California. The Convention Center is directly across the street from the main entrance to Disneyland. All the streets are super wide to accommodate the endless rivers of busses that patrol the streets. The intense-looking man next to me is the author and translator Robert Powell. We had worked on a book together about the teachings of an Indian holy man, Nisargadatta. I gave Powell a contract and we published the book in 1992. Nisargatta, a cigarette maker and apparently an enlightened sage, had a simple but penetrating teaching. People familiar with the ABA or BEA will recognize this as a co-op display, under the banner of the distributor, Atrium Publishers Group. I was really excited to get distribution with Atrium, and had flown to San Francisco to present our books at their sales meeting. Dawson Church, the founder of Atrium, later confided to me that he was convinced 90% of his publishers were “non profit.” There were a lot of religious groups, people with agendas, different approaches to book publishing, many of them not very commercial. They mostly wanted to get the word out. This was before Atrium went under, of course. Behind me you can see some blow-ups of the books we were featuring at the show: Look Inside by Cathy London and Dialogues on the Path of Initiation, about the work of Karlfried Graf von Durkheim. Cathy London had come in unsolicited but we liked her book of inner reflection and hoped to make it a little “fancy” book with french flaps, deckled-edge paper, and a cover design by Julie Metz. I’m sure you’re thinking “What kind of publishing is this, that only publishes authors no one has ever heard of?” I only wish that had occurred to me at the time, trust me.'''
