["https://www.thebookdesigner.com/15-must-follow-twitter-accounts-for-self-published-writers"]
title = "15 Must-Follow Twitter Accounts for Self-Published Writers by Frances Caballo"
description = "15 Must-Follow Twitter Accounts for Self-Published Writers by Frances Caballo explains why another step to a writer's content-marketing strategy should be to follow influential social media and self-publishing bloggers such as Jane Friedman, Joanna Penn and David Gaughran."
full_description = '<img src="https://secure.gravatar.com/avatar/b56223daea920122c9831bd2ef043e51?s=160&amp;d=mm&amp;r=g" width="160" height="160" alt="Frances Caballo" /> <img width="530" height="275" class="thesis_img" style="max-width: 500px;" src="https://www.thebookdesigner.com/wp-content/uploads/2015/09/bigstock-Eastern-Bluebird-Male-32038430.jpg" alt="" /> Content marketing is the best way for writers to grow a following of dedicated readers and colleagues on the social web. The steps to achieving this goal are: Another step to this content-marketing strategy – and it shouldn’t be the last step – can at best befuddle people and at worst frustrate them to the point they want to give up. Yes, I’m talking about Twitter, Facebook, Google+, LinkedIn, Pinterest, Tumblr, Instagram, and any other networks that can help your book to receive the recognition and sales it deserves. When I first started using social media, I was overwhelmed by the emails overloading my inbox from LinkedIn groups I’d joined. The notifications from Facebook and Twitter where similarly exasperating. There were days when I would spend hours reading and responding to every comment left in a LinkedIn group. Before too long, I decided that there needed to be a more efficient way to manage my social media. So I set out to find experts were who could help me improve my marketing, teach me to become more efficient, and assist me in finding content that my followers would appreciate. If you find social media frustrating or too time consuming, by following the ninjas of the social media world you will deepen your understanding of social media marketing and learn to become more efficient. Here is a list of some of the top people in social media who will teach you how to improve your social media marketing efforts. Jeff Bullas Jeff Bullas is on the Forbes list of the top 50 social media power influencers for 2013. His blog focuses on social media marketing, search engine optimization, and email marketing. Ann Handley Ann Handley is co-author (with C.C. Chapman) of Content Rules: How to Create Killer Blogs, Podcasts, Videos, Ebooks, Webinars and Engage Customers and Ignite Your Business. She’s also the chief content officer of Marketing Profs, and a columnist for Entrepreneur Magazine. If you don’t have Content Rules, I highly recommend it. On her blog, she offers tips on how you can improve your content marketing.'
