["https://www.thebookdesigner.com/14-definitions-you-need-to-know-when-creating-an-author-media-kit"]
title = "14 Definitions You Need to Know When Creating an Author Media Kit by Joan Stewart"
description = "14 Definitions You Need to Know When Creating an Author Media Kit by Joan Stewart explains what authors should include in their author media kit to present you and your book in the best light possible."
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> <img width="529" height="275" class="thesis_img" style="max-width: 500px;" src="https://www.thebookdesigner.com/wp-content/uploads/2015/09/bigstock-Businessman-Reading-Newspaper-9909560.jpg" /> By Joan Stewart (@PublicityHound) Ed: The link between you—and your book, your stories, and your ideas or agenda for change—and the media that can help you get readers, attention, and sales, is your media kit. This is what you present to those in the media looking for content, for guests, and for stories and conversations that will appeal to their audience. Today, publicity expert Joan Stewart provides a valuable glossary to help you understand this critical part of your marketing plan. (And check the end of the article for a free live event with Joan this week.) Your author media kit serves as a wardrobe of materials that present you and your book in the best light possible. When creating it, know the difference between individual various pieces in the kit, and the minimum standards you should adhere to when creating them. Here’s a list of 14 definitions that will help you build a better kit for your print or digital book: Media kits help your various audiences–bloggers, journalists, retailers, libraries, reviewers and others–promote your book. All the more reason to make sure it’s the best kit possible. <img class="alignright size-full wp-image-22950" src="https://www.thebookdesigner.com/wp-content/uploads/2012/08/Joan-Stewart.jpeg" alt="Joan-Stewart" width="90" height="113" />Publicity expert Joan Stewart, author of 10 books, works with authors and experts who need free publicity to promote their expertise and grow their businesses. Twice a week, she emails snack-size tips about how to get free publicity. Subscribe at https://www.PublicityHound.com/tips. At THEBOOKDESIGNER.COM, our goal is to be your go-to resource for all things related to high-quality book design. Whether you are a first-time author or book designer by trade, we are committed to helping you navigate self-publishing by giving you the tools and resources you need to stand out in a competitive industry.'
