["https://www.thebookdesigner.com/about"]
title = "About - The Book Designer"
description = "TweetShareSharePin22 Shares"
full_description = 'Welcome to The Book Designer! Your portal to book design, book production, and self-publishing success. Our Mission At THEBOOKDESIGNER.COM, our goal is to be your go-to resource for all things related to high-quality book design. Whether you are a first-time author or book designer by trade, we are committed to helping you navigate self-publishing by giving you the tools and resources you need to stand out in a competitive industry. Our website is part of a family of websites that focus on writing, design, book production, and publishing. Anything that falls under the umbrella of content development can likely be found on one of these sites. Each site has a specific focus, but we all work together to provide freelancers, authors, artists, and graphic designers a safe space to explore, develop their skills, and build their brands. <img src="https://www.thebookdesigner.com/wp-content/uploads/2024/04/SP-site-2-1024x329.png" width="1024" height="329" alt="" class="wp-image-78227 alignnone size-large" srcset="https://www.thebookdesigner.com/wp-content/uploads/2024/04/SP-site-2-980x315.png 980w, https://www.thebookdesigner.com/wp-content/uploads/2024/04/SP-site-2-480x154.png 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1024px, 100vw" /> We are excited that you’ve stopped by our warm and cozy corner of the internet. We look forward to serving up something you’ll enjoy. Our History Joel Friedlander started The Book Designer back in 2009. He became a legend in the self publishing world thanks to his background in book design, advertising, and graphic design. Joel provided free education to thousands of authors about how to become successful, particularly focusing on how to design books that were just as high quality as those from major publishing houses. At the end of 2020, Selfpublishing.com purchased The Book Designer from Joel, who sadly passed away a few months later (check out the announcement from January 2021 above). We’re committed to continuing his legacy by providing quality information and resources to self publishers just like you from all over the world. <iframe width="560" height="315" src="https://www.youtube.com/embed/70B3yd5qwtQ?si=rzicPrBHlrojiOed" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> We’ve preserved most of Joel’s original articles in The Joel Friedlander Archives, where you can take a look back in time to the early days of the self publishing boom. Or take a look at our more recent articles about everything from how to design a book cover to how to format the interior of your book. <img width="1200" height="800" src="https://www.thebookdesigner.com/wp-content/uploads/2023/10/adobestock_491011410.jpg" alt="" title="Positive happy African student girl unpacking box with books" srcset="https://www.thebookdesigner.com/wp-content/uploads/2023/10/adobestock_491011410.jpg 1200w, https://www.thebookdesigner.com/wp-content/uploads/2023/10/adobestock_491011410-980x653.jpg 980w, https://www.thebookdesigner.com/wp-content/uploads/2023/10/adobestock_491011410-480x320.jpg 480w" sizes="(min-width: 0px) and (max-width: 480px) 480px, (min-width: 481px) and (max-width: 980px) 980px, (min-width: 981px) 1200px, 100vw" class="wp-image-76386" /> Ready to self-publish your book? Partner with our experienced team. We’ll walk you through the process. LEARN MORE TweetShareSharePin22 Shares'
year_published = 2023
