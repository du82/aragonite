["https://www.thebookdesigner.com/13-places-to-speak-and-meet-new-readers"]
title = "Meet New Readers: 13 Speaking Opportunities for Authors"
description = "Book coaches will say their favorite way to sell books is through public speaking. Here's 13 places to speak and meet new readers."
full_description = '<img src="https://secure.gravatar.com/avatar/67567d743f11ac52b3dba189632f1d55?s=160&amp;d=mm&amp;r=g" width="160" height="160" alt="Joan Stewart" /> Ask 10 book coaches their favorite way to meet new readers and sell more books, and I’ll bet at least half of them say through public speaking. Selling a book at the back of the room to an audience member who has just seen your dazzling performance is easy peasy. You’ve already proven yourself. And your adoring fans want to take a piece of you home with them. Judith Briles, The Book Shepherd, wrote an excellent summary a few months ago on why authors should be speaking on their books and expertise. It’s the best bird’s-eye view I’ve seen about how to create a game plan for your speaking, charge a fee or speak for free, and how to follow up with your audience members and communicate with them online. But what if the thought of speaking before several hundred people makes you feel like you’ll lose your lunch? Relax. You don’t need to speak to a huge audience to meet new readers. If you’re a newbie speaker, you’ll find dozens of smaller groups and places right in your own community where you will be welcome and where you’ll find a receptive, forgiving audience. Many Meetup groups attract fewer than a dozen people, and there’s a group devoted to almost any topic imaginable. They run the gamut of active groups such as bicycling and hiking to geeky technology groups. Many meetings are laid back and informal. Here are two Meetups in Milwaukee, Wisconsin, where I live. They might be perfect for authors who have written about nutrition or craft beers. They love authors and many will let you sell books afterward! If you present at a library in a large system and do a great job, the librarians will encourage the other libraries in their system to book you for a speaking gig. Libraries are perfect for children’s authors. Most clubs have fewer than a dozen members. Your presentation doesn’t even have to be in person. If you’re speaking to a club hundreds of miles away, you can do it via Skype video. Search for book clubs at the Reader’s Circle.'
year_published = 2018
year_updated = 2023
