["https://www.thebookdesigner.com/110-type-ornaments-to-use-in-your-book-plus-a-free-download"]
title = "110 Type Ornaments to Use in Your Book (Plus a Free Download) - The Book Designer"
description = "Type ornaments can add a graphical element to your book design. Download a free 2-page PDF with 110 selected ornaments to use in your books."
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> Using type ornaments in your book design can add a pleasing pictorial element to your typographic pages. Depending on the tone you’re trying to establish with your design, there’s likely to be a choice of ornaments that will complement the other choices you’ve made when selecting fonts and the overall design direction for the book. I’ve written elsewhere about finding fonts with ornaments included in their character sets, and there are many fonts dedicated to symbols, pictograms, or other designs that work as ornaments in books. Probably the best known of these is Zapf Dingbats. One of the reasons type ornaments make a perfect complement to the rest of the typesetting in your book is because they are vector art, just like all the other characters in the font. This means they can be scaled to any size, and that they will fit perfectly on a page of regular, alphanumeric typesetting. They’re particularly useful if you want to spruce up your chapter opening pages or section openings. When I’m designing a book for a client, I’ll often include one design that makes use of an ornament in the chapter opener or as a text break. Inevitably, some clients say, “Hey Joel, this design looks great, but are there other ornaments I could choose from?” That’s why I made up a PDF of some of my favorite ornaments for use in books. I called it “55 Sample Type Ornaments for Use in Books.” I know, not too original, right? <img class="alignnone size-full wp-image-70228" src="https://www.thebookdesigner.com/wp-content/uploads/2018/10/ornament-strip-1.jpg" alt="type ornaments" width="1474" height="208" srcset="https://www.thebookdesigner.com/wp-content/uploads/2018/10/ornament-strip-1.jpg 1474w, https://www.thebookdesigner.com/wp-content/uploads/2018/10/ornament-strip-1-300x42.jpg 300w, https://www.thebookdesigner.com/wp-content/uploads/2018/10/ornament-strip-1-768x108.jpg 768w, https://www.thebookdesigner.com/wp-content/uploads/2018/10/ornament-strip-1-1024x144.jpg 1024w, https://www.thebookdesigner.com/wp-content/uploads/2018/10/ornament-strip-1-280x40.jpg 280w" sizes="(max-width: 1474px) 100vw, 1474px" />This worked well for quite a while until one client said, after perusing the 55 selections, “Don’t you have any more?”'
