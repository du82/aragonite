["https://www.thebookdesigner.com/10-commandments-larsen"]
title = "The 10 Commandments for Becoming a Successful Writer by Mike Larsen"
description = "The 10 Commandments for Becoming a Successful Writer by Mike Larsen describes a live event at BAIPA with the literary agent and author"
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> This Saturday we’ll be having our regular monthly meeting of the Bay Area Independent Publishers Association (BAIPA). People who attend are in for a special treat. Usually we focus on the nuts-and-bolts of book publishing, marketing, editorial development, ebooks, and the other subjects that demand our attention as indie publishers. But this month we’ll have a presentation from Mike Larsen, a literary agent, best selling author, and founder of the San Francisco Writer’s Conference. Mike never fails to inspire and educate me about books and the business of being an author. I think you’ll get a taste for his mercurial style of wisdom in this list that will function as the outline for his talk, and which we’ll provide as one of the handouts at the talk. If you have a publishing group near you, I encourage you to check it out, take advantage of the educational and networking opportunities these groups provide. It’s exhilarating to be in a group of other people dedicated to publishing and promoting their books, and to be inspired and educated by the shared energy of the group. If you’re in the San Francisco area, I hope you’ll come by for this meeting. For complete information and to register for this event, check out the Registration Page. Here’s Mike’s article. Now is the best time for you to be a writer, but technology is forcing you to reinvent yourself. You need a new model for becoming a successful independent publisher. The goal of these ten commandments is to offer you one. You can adapt them to other fields and your personal life. <img src="https://www.thebookdesigner.com/wp-content/uploads/2013/11/Mike-Larsen2.jpeg" alt="Mike Larsen" width="96" height="96" class="alignright size-full wp-image-29878" />Michael Larsen is a principal in the Larsen-Pomada Literary Agency. He is the author of several books including How to Write a Book Proposal and the book proposal templates based on it. Michael is also the founder of the San Francisco Writer’s Conference and the San Francisco Writing for Change Conference. And he writes a blog, too.'
year_published = 2013
year_updated = 2022
