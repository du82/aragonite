["https://www.thebookdesigner.com/10-ways-authors-can-find-more-blog-readers"]
title = "10 Ways Authors Can Find More Blog Readers - The Book Designer"
description = "When authors start blogs, they need to market their blogs in order to find readers. Even though they are writers, they may not know how to get traffic. Here are 10 ways to find readers for your book blog."
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> <img class="alignright size-medium wp-image-3972" title="1209716_46545604.matox" src="https://www.thebookdesigner.com/wp-content/uploads/2010/01/1209716_46545604.matox_-300x201.jpg" alt="writing" width="300" height="201" />Do you participate in any of the writer’s forums on the internet? Forums have been around for a long time, and haven’t changed that much over the years. They provide a way for lots of people to have conversations, all at the same time on a variety of topics in discrete streams of posts. Forums are very popular, often attracting hundreds or thousands of regular readers, and provide help and support for almost any area in which you’re interested. A great and very early social-media type of experience. Yesterday one of the authors on a writing forum described how he had built a blog for his book, as so many marketing types recommend, but he was at a loss about how to attract readers to the blog. And what use is writing if there’s no one there to read? There’s probably an e-course around somewhere that teaches “Blogging for Authors” but lacking that, I thought I’d jump in and help with some suggestions about getting blog readers. Although some of the suggestions that follow take some time and effort, given a chance they will pay off. As with your writing, get known as someone who expresses themselves well, and who has something worthwhile to say, and can say it in an interesting way. Readers will follow. There are many other ways to market your blog, but you might not need anything else. Spend a couple of months working with any or all of these ideas, and you will start to build your very own audience, people who are reading your blog because you are writing it. That’s the ultimate compliment to a writer. And what’s the very best advice of all? Write really great blog posts, then let people know about them!'
