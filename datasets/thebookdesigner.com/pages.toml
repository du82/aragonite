["https://www.thebookdesigner.com/16-plugins-for-wordpress"]
title = "How Plugins Can Take Your Author Website from Okay to Outstanding by Laura Pepper Wu"
description = "How Plugins Can Take Your Author Website from Okay to Outstanding by Laura Pepper Wu describes 16 plugins for a variety of uses."
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> Laura is a best-selling self-published author and a blogger who likes WordPress so much she is busy working on ways to help authors make the most of the blogging experience. She is a frequent commenter here and I was happy that she wanted to bring some of her WordPress research to readers. Here’s her report: There are a gazillion reasons why I fell in love with it, for both blogging and for my author website. The reason I’m going to focus on today is the fact that WordPress has these awesome “add-ons”, called ‘plugins’, which are essentially pre-written codes that allow you to do almost anything to your site. If you consider yourself a non-techy and are about to click away from the page, please stay and get comfortable. The great thing about WordPress is that it requires very technical know-how. You don’t need to know the tiniest bit of code or even how a plugin works. ALL you need to know is that plugins extend the core features of your WordPress website and allow you to do more. And many of them are free! This means that you can customize the look and feel of a basic site in almost any way you like. Focusing on functionality and usability, here are 16 of my favorite plugins to help improve your author website right away. Download these through WordPress at wordpress.org/extend/plugins/, or from their sites where listed. (Ed: You can also find them using the “Add New” button from the plugin page on your WordPress blog.) 1. Back Up Buddy (Paid)—Back Up Buddy will save your site and your sanity! It backs up your WordPress installation—widgets, themes, plugins, files etc.—so that in the case of a disastrous server problem (ex. a virus) you can quickly restore or move your site to a new server. This is great if you need to move your domain hosting or change your URL too. Pricing plans are available on their site.'
