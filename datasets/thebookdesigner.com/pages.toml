["https://www.thebookdesigner.com/10-ebook"]
title = "Direct Marketing, Scottsdale Arizona, and Why a $10 Ebook Can Change Your Life"
description = "Direct Marketing, Scottsdale Arizona, and Why a $10 Ebook Can Change Your Life discusses how analytics can provide critical marketing information for bloggers"
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> One of the first things I did when I started my blog was write “foundation posts.” These posts—on basic concepts, terms, and processes in your field—are really important to build on as you continue to develop content for your blog. Along with the posts on book design and book construction, I wrote an article about what should be on your copyright page. It’s a simple topic but necessary for self-publishers to get right, and over the years I’ve linked back to that post on many occasions. That’s one of the great things about foundation posts—they allow you to treat your own blog archives as an article vault to link to. Eventually you build up this rich network of subject-oriented links that can really help your ranking in search engines. As a new blogger, I had also installed Google Analytics to measure… whatever it is that it measures. To be honest, I really didn’t know. You may not know this, but I spent some time in the direct marketing business in New York. My design studio acted as the creative department for a direct-response advertising agency, so we developed all sorts of mailings over the years. In the direct mail industry, you measure everything. Direct mailers invented a lot of the metrics and ideas internet marketers use today, like a/b split tests, conversion ratios, “funnel” marketing, and so on. Testing is continuous, and you are always looking for little changes that make a difference. If you’re mailing 100,000 messages and you can increase your conversion ratio—the number of people who act on your offer—even a small improvement can mean a huge difference in your results. After poking around in the most obvious categories, I found, to my surprise, that the article on copyright was the most popular page on my blog. After all the articles I had slaved over, written and re-written, researched and reported, I thought that was pretty ironic.'
