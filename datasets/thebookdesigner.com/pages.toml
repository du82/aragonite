["https://www.thebookdesigner.com/10-things-you-should-know-about-e-book-formatting"]
title = "10 Things You Should Know About e-Book Formatting"
description = "10 Things You Should Know About e-Book Formatting by Guido Henkel. Why you should take care with your e-book and how it looks, by a professional e-book creator"
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> I’m please to have an article today from self-published author and experienced e-book formatter Guido Henkel. Guido and I met on Twitter and that’s why you get to read his thoughts on this important aspect of e-publishing. Here’s his post. e-book formatting is a skill that becomes increasingly important as our society moves towards an all-digital book world. The revolution is taking place at an incredible speed, but many authors who want to self-publish their work feel overwhelmed, intimidated or plain out of their depth with the process of actually creating these dreaded e-books. No matter where in these categories you fit in, here are a few things you should know about e-book formatting. Just like the book cover is the point of contact with your prospective reader, the interior of a book is an important ingredient to keep the reader satisfied. Reading flow, a balanced layout and proper font usage are critical and should never be underestimated in creating a lasting impression. You have labored over your book for months, maybe even years, you have read and re-read it countless times, cleaned out typos and grammatical errors, massaged the style and worked on the structure, grinding away in the wee hours of the night alongside holding a daytime job and maybe having a family. You did not get here just to break the first cardinal rule of book publishing: Don’t get sloppy on the home stretch! It will reflect poorly on your work. I have seen countless recommendations on the web that tell authors not to use things such as curly quotation marks, em-dashes or ellipses because they supposedly cause problems. This is ill advice at its worst, really. When created properly all e-books can safely feature typographically correct text. You simply have to take the time to understand its underpinnings and do it right. Word processors have been designed to enable writers. (Emphasis on WRITERS.) They are the replacement of the typewriter – in case you still remember those. Their goal is to make it possible for people to write text as cleanly and efficiently as possible, allowing them to simply dump their thoughts onto a computerized sheet of paper. In order to make this as easy as possible, word processing software puts a number of additional tools at the writer’s disposal which come in very handy and will help to keep writers focused on the task.'
