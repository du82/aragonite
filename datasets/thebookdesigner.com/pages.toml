["https://www.thebookdesigner.com/15-reasons-book-isnt-selling"]
title = "15 Reasons Why Your Book Isn't Selling - The Book Designer"
description = "We’ve all been there: a book we were excited about, one that we worked on earnestly. But when it hit the market, all that came back was a big yawn. No author wants to be in that situation, most of all a self-published author. We gamble our own time, money, and commitment to our books, […]"
full_description = '<img src="https://www.thebookdesigner.com/wp-content/uploads/2023/11/joel-friedlander.jpeg" width="160" height="160" alt="Joel Friedlander" /> No author wants to be in that situation, most of all a self-published author. We gamble our own time, money, and commitment to our books, and we really need a positive response sometimes just to keep going. What went wrong? Is it something you can fix, or is it embedded in the DNA of your book, a flaw so grave it can never recover? And don’t feel too bad, we all make mistakes, miss important road signs, get confused on the journey to publication. Take heart, one book won’t be the beginning and end of your publishing career, and there are essential lessons to lear from every book you publish, no matter how well or poorly it sells. Here are some common reasons your book may not be selling as well as you’d like, and embedded in each reason is the key to how you might overcome that particular obstacle. As in any effort in life, understanding your own goals will go a long way to making sure you get satisfaction of every kind from your publishing projects. “It doesn’t matter how you publish, most books don’t sell very well… As authors, we can be thrilled with a handful of sales a month or miserable with “only” 10,000.”—Hugh Howey, bestselling author At THEBOOKDESIGNER.COM, our goal is to be your go-to resource for all things related to high-quality book design. Whether you are a first-time author or book designer by trade, we are committed to helping you navigate self-publishing by giving you the tools and resources you need to stand out in a competitive industry.'
