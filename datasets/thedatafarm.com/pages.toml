full_description = "New EF Core and Domain-Driven Design Course on Pluralsight! May 2, 2023Data Access, DDD, dotNETDDD, dotnetcore, EF, EFCore, PluralsightJulie Lerman MY NEW Pluralsight COURSE IS OUT! EF Core 6 and Domain-Driven Design. Yippee! I spent 3 months heads down on this (and years preparing for it!) This happily aligns with a current 50% off sale on annual subscriptions. Also note that as with *all* PS courses, they are limited to “expanded” library for the first few days but this will be part of the standard library (available to all) hopefully by the end of this week. Short description“Data persistence is important to your application workflow. This course will teach you how to use Entity Framework Core 6 and 7 effectively to persist data from your DDD designed software.” ContentThe module titles should give you a better flavor of this course: Understanding Where EF Core 6 Fits Alongside DDD (Includes an overview of DDD) Analyzing and Planning Our Domain (Strategic and tactical design walkthrough) Exploring the Contract Bounded Context Solution Adding the First EF Core DbContext Tuning Default Mappings for the Data Model Using Integration Tests to Validate Persistence Reasoning About Many-to-Many Variations Mapping Aggregates to Azure CosmosDB Organizing Persistence Logic to Support DDD Design (Repositories, services, search and sharing data and events across bounded contexts) Enjoy! Sign up for my newsletter so you don't miss my conference & Pluralsight course announcements! Share this post:Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on LinkedIn (Opens in new window) John Blacker says: December 30, 2023 at 11:48 am Julie, I just recently purchased the second edition of the Programming Entity Framework book, feeling that even though the book was somewhat dated, it would be of great value to me. I’m not at all disappointed in my purchase; but I tried downloading some of the material from the website: http://www.LearnEntityFramework.com site and it appears as if all the links are “stale” and don’t work. I wanted to get the sample database to work with, but likewise it doesn’t seem to be available. I do have the Community editions of VS 2019 and 2022 and have both the Northwind and Adventureworks databases installed. I have SQL Server Management Studio and another database from another sample app I found on the internet – SchoolDB. I’m sure I could use these as I go through the book but I thought it might behoove me to have the sample that is referred to in the book. Anyway, great book so far. Any possibility you know of to get the sample code from the book and the sample DB to “play” with? Thanks. Reply"
