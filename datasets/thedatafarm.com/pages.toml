full_description = "New EF Core and Domain-Driven Design Course on Pluralsight! May 2, 2023Data Access, DDD, dotNETDDD, dotnetcore, EF, EFCore, PluralsightJulie Lerman MY NEW Pluralsight COURSE IS OUT! EF Core 6 and Domain-Driven Design. Yippee! I spent 3 months heads down on this (and years preparing for it!) This happily aligns with a current 50% off sale on annual subscriptions. Also note that as with *all* PS courses, they are limited to “expanded” library for the first few days but this will be part of the standard library (available to all) hopefully by the end of this week. Short description“Data persistence is important to your application workflow. This course will teach you how to use Entity Framework Core 6 and 7 effectively to persist data from your DDD designed software.” ContentThe module titles should give you a better flavor of this course: Understanding Where EF Core 6 Fits Alongside DDD (Includes an overview of DDD) Analyzing and Planning Our Domain (Strategic and tactical design walkthrough) Exploring the Contract Bounded Context Solution Adding the First EF Core DbContext Tuning Default Mappings for the Data Model Using Integration Tests to Validate Persistence Reasoning About Many-to-Many Variations Mapping Aggregates to Azure CosmosDB Organizing Persistence Logic to Support DDD Design (Repositories, services, search and sharing data and events across bounded contexts) Enjoy! View all 6 comments Pluralsight is totally free for the month of April April 4, 2020PluralsightDDD, EFCore, Pluralsight, TestingJulie Lerman While many of you who read my blog are already Pluralsight subscribers with work or personal subscriptions, there are so many who do not have access. So Pluralsight is opening up the entire library of over 7,000 courses for people to watch while stuck at home. And you do not need to use a credit card to sign up.* So whether you want to watch one my my courses such as EF Core Getting Started (completely new for EF Core 3.1) The recently updated Getting Started with EF6 The updated and soon to be republished EF 6 Ninja Edition (focus on advanced features) Automated Testing for Fraidy Cats Like Me (a getting started course on testing aimed at new and experienced devs) EF in the Enterprise (this is for EF6 …will be updated to EF Core but most of the architectural concepts are the same). Domain-Driven Design Fundamentals, co-authored with Steve Smith and still one our most popular courses! Or any of the other 7,000+ courses from some of the most knowledgeable devs who happen to be great at teaching …. Have at it! There is also a free plan for business accounts. Business Free April Details: “To support your team’s skill development during these new challenges, for a limited time we’ve extended our free team trial from 14 days to 30 days.” *The fine print: Free April is open to anyone who is not a current, active subscriber. New free accounts and reactivated accounts opened through April 30, 2020 will have access to Pluralsight’s library of video courses through April. Payment information will not be required for new free accounts opened through April 30, 2020. New free accounts opened after May 1, 2020, will only have access to a portion of Pluralsight’s library and will require payment information. View all 2 comments"
