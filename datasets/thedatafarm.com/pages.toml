full_description = "New on Pluralsight! EF Core 6 Fundamentals! May 4, 2022Data AccessEF, EFCore, EFCore6, PluralsightJulie Lerman I’m so excited to share with you that I have a new course on Pluralsight: EF Core 6 Fundamentals. I’ve been working on it for a while and it is the biggest course I’ve ever created. It is 7.5 hours long. It’s a lot more than the breadth of the previous Getting Started courses. And there’s an additional bonus. Pluralsight is having a sale on subscriptions right now. 33% off through May 12, 2022. There are 16 modules if you count the course overview which is just a 1.5 minute “trailer” about the course. This is not just a refresh of the recent EF Core 5 Getting Started course. In fact, I retired the samurais and have introduced a book publisher as the domain this time. Below is the list of module titles for my new course. I’ve also posted the sample code for the course in this repository on my Github account. Course Overview Building Your First Application using EF Core Using EF Core 6 to Query a Database Tracking and Saving Data with EF Core Controlling Database Creation and Schema with Migrations Defining One-to-Many Relationships Logging EF Core Activity and SQL Interacting with Related Data Defining and Using Many-to-Many Relationships Defining and Using One-to-One Relationships Working with Views and Stored Procedures and Raw SQL Using EF Core with ASP.NET Core Apps Testing with EF Core Adding Some More Practical Mappings to Your Application Understanding EF Core’s Database Connectivity Tapping into EF Core’s Pipeline I’d also like to give a shout out to my friend and fellow Pluralsight author, Roland Guijt, who acted as tech reviewer as I created this course. His feedback and insights were invaluable as is evident not only in the final version of my course, but in his own courses on ASP.NET Core, C# and more. Sign up for my newsletter so you don't miss my conference & Pluralsight course announcements! Share this post:Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on LinkedIn (Opens in new window)"
