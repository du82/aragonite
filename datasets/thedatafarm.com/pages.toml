full_description = "The Data Farm is Julie Lerman Sign up for my newsletter so you don’t miss my conference & Pluralsight course announcements! Recognized Expert Julie Lerman is the leading independent authority on Microsoft’s Data Access Technology: Entity Framework. She has been programming for nearly 30 years and has been an independent consultant since 1989. Julie is one of 150 Microsoft Regional Directors worldwide — trusted partners & advisors to Microsoft’s most senior level staff. She has also been awarded Microsoft MVP annually since 2003. Consultant/Coach You can benefit from Julie’s many years decades of experience by engaging her to coach your development team. I work with teams to guide them towards re-thinking their software architecture and adapt to modern practices. I help developers get unstuck on modeling their domain for Domain-Driven Design. And of course, if it’s Entity Framework, I love to help with implementation and those pesky performance issues. Read more… Pluralsight Online Video Training Author Julie is proud to be listed among the creators of exceptional online training for professional software developers and IT Pros at Pluralsight.com. Read more … Book Author Julie has written four highly acclaimed books on Entity Framework. Programming Entity Framework (1st & 2nd edition) were O’Reilly Media’s top selling Microsoft technology books for a number of years and are often referred to as “the bible for Entity Framework”. Read more… Columnist Along with many published articles in technology magazines such as MSDN Magazine, CODE Magazine and DevProConnections, Julie has been the author of the Data Points column in MSDN Magazine since early 2010. Conference Speaker Julie has been presenting at leading software conferences around the world since 2003. Among these are Microsoft’s TechEd, DevConnections, DevIntersection, OreDev (Sweden), DevSum (Sweden), NDC (Norway), DevTeach (Canada), DevReach (Bulgaria), C2C (Poland), SDC (Netherlands), GIDS (India) and more. Julie has also spoken at user groups around the U.S. and Canada. Community Leader Julie started the Vermont.NET User Group in 2002 and is still leading it 12 years later. She was part of the original INETA leadership when it was a truly international organization and served on its board. In 2009, Julie introduced Vermont Code Camp and has been co-organizing this event annually. She was a founding board member of the Vermont Software Developer Alliance (now the Vermont Technology Alliance) and served on the board for 3 years and is proud to be on the judging panel of HackVT, a 24 hour hack-athon in Vermont. Microsoft has recognized Julie in their MVP program every year since 2003. Julie has worked hard to share to her knowledge with other developers and to encourage more women to participate in the software industry."
