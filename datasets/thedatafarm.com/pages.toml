full_description = "Contact Social Media Twitter Mastodon Got an Entity Framework question? You might be able to imagine that I get a lot of EF questions from developers via direct email, the contact form on my blog and even on twitter. While I try to (and want to) help, I don’t always have the time to respond to everyone’s questions. There are two excellent forums where you will find that there are many developers answering questions that have become extremely knowledgeable about Entity Framework. This includes members of the Entity Framework team. One is the EF forum on MSDN: http://social.msdn.microsoft.com/Forums/en-US/adodotnetentityframework/threads The other is www.stackoverflow.com. When I have time, I take a look at the forums also to see if there are questions I can answer. I have also produced a lot of content (much of it free) on Entity Framework that you might benefit from such as: Free at http://msdn.com/data/ef A series of 10 articles and videos on Code First and DbContext A number of E4F videos and articles A full day of EF4 training that was recorded in Sept 2010 (free access) http://channel9.msdn.com/posts/Entity-Framework-Firestarter-Session-1-of-6 Six courses of video on EF4 including Code First and DbContext onwww.Pluralsight.com http://www.pluralsight-training.net/microsoft/Authors/Details?handle=julie-lerman A 900 page book on Entity Framework 4 and a 150 page book on Code First: www.learnentityframework.com There is also a forum for the book where your questions may have already been answered (free) http://forums.oreilly.com/forum/74-programming-entity-framework Hundreds of blog posts on Entity Framework (free) www.thedatafarm.com/blog A monthly column, Data Points, in MSDN Magazine. (free online) http://msdn.microsoft.com/en-us/magazine/ee532402.aspx?sdmr=datapoints&sdmi=columns Additionally, I can be hired as a mentor for your development project so that I can help with random questions, code reviews and much more. I can do this remotely or even onsite and would be happy to send you my mentoring rates and other details. I typically require an 8 hour retainer for this service. Finally, if you just have a question or two and you still want my undivided attention, I can be bought and will be happy to send you my rates. Feb 2023: Fighting bots and have disabled the contact form. julielerman @ gmail dot com"
