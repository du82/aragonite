full_description = "Bio & Photos Julie Lerman is a Microsoft Regional director, Docker Captain and a long-time Microsoft MVP who now counts her years as a coder in decades. She makes her living as a coach and consultant to software teams around the world. You can find Julie presenting on Entity Framework, Domain Driven Design and other topics at user groups and conferences around the world. Julie blogs at thedatafarm.com/blog, is the author of the highly acclaimed “Programming Entity Framework” books, the MSDN Magazine Data Points column and popular videos on Pluralsight.com. Follow Julie on twitter at julielerman. You can also find another version of my bio on about.me/julielerman juliehat.jpg 697×520 , 76kb Here are some more recent photos, click on them to get full size. I have larger, hi-res versions as well. Email me if you want them."
