full_description = "EF Core 8 Courses are Live on Pluralsight February 29, 2024Pluralsightdata, EF, EFCore, Pluralsight, skillJulie Lerman I spent much of the fall and winter updating my three EF Core courses. EF Core 8 Fundamentals is a brand new version of the course. The EF Core 6 Fundamentals and earlier versions remain as separate courses always available. EF Core and Domain-Driven Design has also been updated to EF Core 8. This is what Pluralsight calls an “in-place” update. There is no longer a separate EF Core 6 and DDD course, but the new course , while focusing on EF Core 8, calls out important differences you may encounter if you are using EF Core 6 or 7. EF Core: The Big Picture. This now uses EF Core 8 although it is relevant to previous versions again with shout outs to important differences. You can find all of my courses, including “retired” courses like EF Core 5 Getting Started, on my Pluralsight author page. Other courses in Pluralsight’s EF Core 6 path (there are multiple authors) are also getting updated to EF Core 8. Leave a comment New EF Core and Domain-Driven Design Course on Pluralsight! May 2, 2023Data Access, DDD, dotNETDDD, dotnetcore, EF, EFCore, PluralsightJulie Lerman MY NEW Pluralsight COURSE IS OUT! EF Core 6 and Domain-Driven Design. Yippee! I spent 3 months heads down on this (and years preparing for it!) This happily aligns with a current 50% off sale on annual subscriptions. Also note that as with *all* PS courses, they are limited to “expanded” library for the first few days but this will be part of the standard library (available to all) hopefully by the end of this week. Short description“Data persistence is important to your application workflow. This course will teach you how to use Entity Framework Core 6 and 7 effectively to persist data from your DDD designed software.” ContentThe module titles should give you a better flavor of this course: Understanding Where EF Core 6 Fits Alongside DDD (Includes an overview of DDD) Analyzing and Planning Our Domain (Strategic and tactical design walkthrough) Exploring the Contract Bounded Context Solution Adding the First EF Core DbContext Tuning Default Mappings for the Data Model Using Integration Tests to Validate Persistence Reasoning About Many-to-Many Variations Mapping Aggregates to Azure CosmosDB Organizing Persistence Logic to Support DDD Design (Repositories, services, search and sharing data and events across bounded contexts) Enjoy! View all 6 comments"
