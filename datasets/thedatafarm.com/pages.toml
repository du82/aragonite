full_description = "New EF Core and Domain-Driven Design Course on Pluralsight! May 2, 2023Data Access, DDD, dotNETDDD, dotnetcore, EF, EFCore, PluralsightJulie Lerman MY NEW Pluralsight COURSE IS OUT! EF Core 6 and Domain-Driven Design. Yippee! I spent 3 months heads down on this (and years preparing for it!) This happily aligns with a current 50% off sale on annual subscriptions. Also note that as with *all* PS courses, they are limited to “expanded” library for the first few days but this will be part of the standard library (available to all) hopefully by the end of this week. Short description“Data persistence is important to your application workflow. This course will teach you how to use Entity Framework Core 6 and 7 effectively to persist data from your DDD designed software.” ContentThe module titles should give you a better flavor of this course: Understanding Where EF Core 6 Fits Alongside DDD (Includes an overview of DDD) Analyzing and Planning Our Domain (Strategic and tactical design walkthrough) Exploring the Contract Bounded Context Solution Adding the First EF Core DbContext Tuning Default Mappings for the Data Model Using Integration Tests to Validate Persistence Reasoning About Many-to-Many Variations Mapping Aggregates to Azure CosmosDB Organizing Persistence Logic to Support DDD Design (Repositories, services, search and sharing data and events across bounded contexts) Enjoy! View all 6 comments Links to My Recent DDD+EFCore Content April 11, 2019DDDDDD, EFCoreJulie Lerman Time to aggregate the various articles and videos I’ve created filled with lessons on how EF Core support for direct mapping of domain models to your relational databases has been improving: DDD-Friendlier EF Core 2.0 Part 1 Sept 2017 MSDN Magazine DDD-Friendlier EF Core 2.0 Part 2 Oct 2017 MSDN Magazine EF Core 2 Owned Entities and Temporary Work-Arounds Apr 2018 MSDN MagazineEF Core 2.1 Query Types July 2018 MSDN MagazineVideo: Jeff Fritz ASP.NET Core Workshop: Part 2 of 7 – Julie Lerman introduces DDD July 2018 YoutubeVideo: Mapping Well-Designed Domain Models with EF Core (2.2) – Nov 2018 Oredev Leave a comment"
