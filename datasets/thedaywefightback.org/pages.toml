["https://thedaywefightback.org/host-an-event"]
title = "Host an Event in Your Local Community on February 11, 2014 as Part of The Day We Fight Back"
description = "Host an Event in Your Local Community on February 11, 2014 as Part of The Day We Fight Back"
full_description = "February 11th is the day we fight back against NSA surveillance. In addition to a huge online demonstration, groups around the world are planning events on the local level to protest surveillance abuses. Hosting a local event is a great way to harness grassroots energy in fighting surveillance abuses. Below are some ideas for local events you can organize. Be sure to let us know your plans so we can include it to our growing of activists and concerned individuals that are joining the fight against mass, illegal government surveillance. Email us at [email protected]. Tip: You may want to start an email list for participants who want to help organize future events, share news, and continue the conversation about mass surveillance. Here’s a sample email sign-up sheet. Tip: Take photos to document your event and help spread the word more widely. This can help get your message out to the media and others who weren’t able to attend in person. This can range from getting permission to stand in front of a business to waving signs on the side of the road to getting a permit and attracting large crowds. Make creative signs, puppets, or banners. Take photos and send them to us! This could be a local expert or professor, local activists and community leaders who have surveillance stories to share, a local reporter who can discuss how NSA spying has affected newsrooms, or a lawyer who can talk about the First and Fourth Amendments. You may want to start an email list to share news and organize. You might even coordinate an event or regular time to meet. This site is licensed under a Creative Commons Attribution 4.0 International License. Privacy Policy (updated February 13th, 2014)"
