["https://thedaywefightback.org/international"]
title = "The Day We Fight Back - February 11th 2014"
description = "Reddit, Mozilla, Tumblr, Imgur, and over 6,000 other websites are protesting NSA surveillance. Join them."
full_description = '''Governments worldwide need to know that mass surveillance, like that conducted by the NSA, is always a violation of our inalienable human rights. Over the past year, more than 360 organizations in over 70 countries have come together to support the International Principles on the Application of Human Rights to Communications Surveillance. These thirteen Principles establish the human rights obligations of any government conducting surveillance. They are the core of an international movement to compel all states to stop the mass spying of the innocent. The Principles are already being used in national campaigns and international pressure to reign in spies including the NSA. By signing the Principles, you will show that you're part of a movement that knows mass surveillance is a violation of international human rights law. We'll use your signature, with thousands of others, to pressure governments and international institutions to forbid mass surveillance anywhere in the world. Add the banner to your site One-click Cloudflare app Wordpress Plugin Drupal 7.x Plugin Joomla Plugin Subreddit plugin Concrete5 plugin Or simply copy the code below and add it just before the closing tag in your site's HTML. <!--[if !(lt IE 8)]><!--> <script type="text/javascript"> (function(){var e=document.createElement("script");e.type="text/javascript";e.async=true;e.src=document.location.protocol+"//d1agz031tafz8n.cloudfront.net/thedaywefightback.js/widget.min.js";var t=document.getElementsByTagName("script")[0];t.parentNode.insertBefore(e,t)})() </script> <!--<![endif]--> Add the banner now. See the live demos here: US version, international version. The banner changes automatically based on the locations of visitors. For more information about the banner and optional settings, see our Github Repo. Avatars and cover photos Tell the world you're taking part Use the #stopspying hashtag on Twitter to help spread the word!'''
