["https://thedaywefightback.org/letter-to-wikipedia"]
title = "An Open Letter to the Wikipedia Community"
description = "The Wikipedia community asking should take part in The Day We Fight Back because of the threat that mass surveillance poses."
full_description = '''Thank you for the lively discussion about participating in The Day We Fight Back. Although it was disappointing that the conversation didn't reach consensus, it's also true that Wikipedia would not be possible without a robust and distributed decision-making process, and it's powerful to watch it in motion. With that spirit in mind, we hope to contribute a few points to the discussion, to explain why we are in strong support of re-opening the proposal for Wikipedia's participation in The Day We Fight Back on February 11. We believe Wikipedia should take part because the project and its crucial mission are threatened by the mass surveillance we now face, and because Wikipedia's participation can have a meaningful impact. How is Wikipedia threatened by the NSA and mass surveillance? The answer cuts to the very core of its mission to give free access to the sum of all human knowledge. "Free," of course, is not just about the cost—it means that readers and editors have the freedom to learn and contribute. It's that freedom, the freedom of its users to read and write without fear of government monitoring, disruption, or even reprisal, that is threatened under a mass spying regime. Edward Snowden wrote on this point last week: "Study after study has show that human behavior changes when we know we’re being watched. Under observation, we act less free, which means we effectively are less free." Wikipedia provides access to material that might be considered subversive, that challenges authority structures, that cuts against what one can learn from government propaganda or mainstream media sources. It is precisely the people who engage in the editing and reading of this sort of material who are the most likely to be chilled—and the most likely to be noticed by the surveillance regime. In other words, the people that Wikipedia most needs to reach are the ones whose freedom is being most threatened. It is not Wikipedia's responsibility alone to preserve that freedom, but Wikipedia plays an essential part. As the protests against SOPA demonstrated, Wikipedia—with its enormous user base and traffic—can disseminate the information that is essential to a functioning democracy. Wikipedia can direct much-needed attention to the dangers of mass surveillance and pending legislation and policies that would entrench and extend it further.'''
