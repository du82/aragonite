["https://thedaywefightback.org/privacy"]
title = "Privacy policy - The Day We Fight Back"
description = "Reddit, Mozilla, Tumblr, Imgur, and over 6,000 other websites are protesting NSA surveillance. Join them."
full_description = "The coalition of organizations behind TheDayWeFightBack.org takes your privacy seriously. Among our fundemental principles: Like many websites, TheDayWeFightBack.org collects non-personally-identifying information of the sort that web browsers and servers typically make available, such as the browser type, language preference, referring site, and the date and time of each visitor request. TheDayWeFightBack.org’s purpose in collecting non-personally identifying information is to better understand how TheDayWeFightBack.org’s visitors use its website. From time to time, TheDayWeFightBack.org may share non-personally-identifying information in the aggregate with organizations and employees of organizations that are members of the coalition, e.g., for example the number of visitors or signups during a particular period. TheDayWeFightBack.org also uses potentially personally-identifying information like Internet Protocol (IP) addresses for the purpose of geolocating users to show appropriate actions and content. For example, if you are based in the US, we will use your IP address to show you content about pending laws in the US Congress. However, TheDayWeFightBack.org does not store IP addresses, and would only disclose IP addresses under the same circumstances that it uses and discloses personally-identifying information as described below. Certain visitors to TheDayWeFightBack.org's websites choose to interact with TheDayWeFightBack.org in ways that require TheDayWeFightBack.org to gather personally-identifying information. The amount and type of information that TheDayWeFightBack.org gathers depends on the nature of the interaction. For example, we ask visitors who sign up to be part of the day of action to provide an email address so that we may contact them. Those who engage in actions with TheDayWeFightBack.org – by sending an email to Congress or calling their representatives, for example – are asked to provide additional information, including as necessary the personal information required to process those actions. In each case, TheDayWeFightBack.org collects such information only insofar as is necessary or appropriate to fulfill the purpose of the visitor’s interaction with TheDayWeFightBack.org. TheDayWeFightBack.org does not disclose personally-identifying information other than as described below. Visitors can always refuse to supply personally-identifying information, with the caveat that it may prevent them from engaging in certain website-related activities."
