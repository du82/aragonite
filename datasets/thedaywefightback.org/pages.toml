["https://thedaywefightback.org"]
title = "The Day We Fight Back - February 11th 2014"
description = "Reddit, Mozilla, Tumblr, Imgur, and over 6,000 other websites are protesting NSA surveillance. Join them."
full_description = '''Congress is considering two major bills. The USA Freedom Act curtails NSA surveillance abuses. The FISA Improvements Act attempts to legalize bulk data collection of phone records. We need to tell Congress to pass the USA Freedom Act and amend it to make it even stronger. The SOPA and PIPA protests were successful because we all took part, as a community. As Aaron Swartz put it, everybody "made themselves the hero of their own story." We can set a date, but we need all of you, the users of the Internet, to make it a movement. Add the banner to your site One-click Cloudflare app Wordpress Plugin Drupal 7.x Plugin Joomla Plugin Subreddit plugin Concrete5 plugin Or simply copy the code below and add it just before the closing tag in your site's HTML. <!--[if !(lt IE 8)]><!--> <script type="text/javascript"> (function(){var e=document.createElement("script");e.type="text/javascript";e.async=true;e.src=document.location.protocol+"//d1agz031tafz8n.cloudfront.net/thedaywefightback.js/widget.min.js";var t=document.getElementsByTagName("script")[0];t.parentNode.insertBefore(e,t)})() </script> <!--<![endif]--> Add the banner now. See the live demos here: US version, international version. The banner changes automatically based on the locations of visitors. For more information about the banner and optional settings, see our Github Repo. Tell the world you're taking part Use the #stopthensa hashtag on Twitter to help spread the word! Avatars and cover photos More things you can do Attend an event in your area Ask your representatives the tough questions Write to your representative about NSA reform Download The Day We Fight Back app on Google Play Download the Reform The NSA app on iTunes'''
