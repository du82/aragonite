["https://thedaywefightback.org/events"]
title = "A List of Events Happening on The Day We Fight Back"
description = "Join an event in your area on February 11, 2014 as Part of The Day We Fight Back against mass surveillance."
full_description = '''2/11/14 at 2:00 PM Details: "En Costa Rica No se Pelea" - Ven a Barrio Escalante, 500 mts Este de la Iglesia Santa Teresita., Av 9, San José. Por motivo de "The Day We Fight Back" estamos buscando comunicar la importancia de la privacidad en nuestro país. "En Costa Rica No Se Pelea" es una charla que busca reconocer como el estado actual de nuestro entorno, donde ya un vigilancia masiva no es un cuento de hadas, sino más bien una realidad. Buscamos hacer conciencia en favor de los derechos digitales que todos deberíamos de tener y que en el último año han sido violentados. Vení y conversá con nosotros acerca de este importante tema. Website: Facebook event February 11th, 2014 at 8:00 PM Details: Mozilla Brasil, LibrePlanet São Paulo and LHC will be hosting an event for the community to discuss ways to empower themselves against mass surveillance from governments and businesses. Movies/documentaries on mass surveillance will be projected, we'll have food and drinks available, and a lot of friendly people discussing mass surveillance and the best way to fight back. Website: Link February 11th, 2014 at 3:00 PM Details: Join us for a Solidarity Event/Protest Tuesday feb 11th 2014 at Dundas and Richmond 3pm. Please bring signs and be ready to speak out/fight back against the encroachment of the surveillance state and the growth of security culture. Website: Facebook Event February 11th, 2014 at 4:00 PM Details: Meet at the American Embassy (Dag Hammarskjöld avenue 24) to protest mass surveillance abuses. Website: Link February 11th, 2014 at 7:00 PM Details: There’s a speaking event being held at the Cottage Bar in Lower Salthill at 7pm. The event is an opportunity for people to get up to speed on the latest developments with regard to surveillance and privacy. There will be a talk on practical measures to protect privacy, as well as a discussion about the opportunity for a political campaign aimed at educating and lobbying politicians on Digital Rights, especially with a view to the European elections and the pan European ‘We Promise’ campaign which is getting underway. Website: Link'''
