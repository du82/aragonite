["https://thedaywefightback.org/the-results"]
title = "The Day We Fought Back By The Numbers"
description = "On Tuesday thousands of websites rose up in protest against mass surveillance. Here are the numbers."
full_description = '''Thanks to everyone who participated on Tuesday. Together we demonstrated that activists, organizations, and companies can work in unison to fight mass surveillance, and laid a foundation for escalation over months to come. Below are some numbers that quantify how we did* on Tuesday. * The figures below represent a lower bound - at least tens of thousands of people took action independently and using tools on other sites. The statistics below do not account for that activity. 37,000,000 People saw the banner Over 24 million Americans and 13 million non-Americans saw The Day We Fight Back banner on Tuesday. 555,000 Emails sent 185,000 Americans registered to send over 555,000 emails, two each to their two Senators and one to their Representative. 89,000 Calls completed The total number of completed calls reached 89,000 and another 7,000 calls went uncompleted because some legislators turned off their voicemail inboxes. 301,000 Signatures 245,000 people internationally signed the necessaryandproportionate.org petition to demand privacy as a human right. Another 56,000 joined petitions on causes.com and change.org. 420,000+ Facebook shares This just the number of times the website itself was shared on Facebook. 84,000+ Tweets This is just the number of times the thedaywefightback.org was shared on Twitter. #StopSpying and #StopTheNSA were trending on Twitter during the afternoon. 1,000,000+ Homepage visitors The banner, social media and at least 6,000 websites drove over 1 million unique visitors to the homepage. We called Tuesday "The Day We Fight Back", but of course the fight doesn't end here. To push back against surveillance, we need to keep acting to educate and urge our representatives to take action. We've laid a strong foundation, but there's much more yet to come.'''
