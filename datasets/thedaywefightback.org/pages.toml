["https://thedaywefightback.org/obama-scorecard"]
title = "A Scorecard for Obama's Surveillance Reforms"
description = "President Obama announced reforms to the NSA's surveillance programs today, here's a scorecard of how he did"
full_description = "Earlier today, President Obama announced a series of reforms to address abuses by the National Security Agency. We were heartened to see Obama recognized that the NSA has gone too far in trampling the privacy rights of people worldwide. In his speech, the President ensured that National Security Letters would not come with perpetual gag orders, brought new levels of transparency and fairness to the FISA court, and ended bulk collection of telephone records by the NSA. However, there is still much more to be done. We’ve put together a scorecard showing how Obama’s announcements stack up against 12 common sense fixes that should be a minimum for reforming NSA surveillance. Each necessary reform was worth 1 point, and we were willing to award partial credit for steps in the right direction. On that scale, President Obama racked up 3.5 points out of a possible 12. For further reform, we need to convince Congress to pass meaningful reform. Sign up alongside over 2,000 other websites and tens of thousands of people for a massive online protest against mass surveillance on February 11th. There are three types of mass surveillance that we know about that we were using to evaluate Obama’s promises in this category: surveillance of millions of phone records under Section 215 of the PATRIOT Act; surveillance of Internet communications internationally under Section 702 of the FISA Amendments Act; and surveillance of communications overseas under Executive Order 12333. In order to score a full point in this category, Obama would have needed to declare that the executive branch would no longer be using any of these authorities to engage in mass surveillance. He tackled only one of these issues somewhat: the surveillance of telephony metadata under Section 215 of the Patriot Act. Specifically, he acknowledged the recommendations of his review group that the government cease to collect and maintain a database of all Americans’ telephone records. He is ending that program, which is laudable. However, he left open the door to having telecom companies or another third party maintain a similar set of mass data, so even as to 215, we could not give him the full ⅓ of the point."
year_published = 2025
