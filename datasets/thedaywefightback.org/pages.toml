description = "Reddit, Mozilla, Tumlr, Imgur, and over 6,000 other websites are protesting NSA surveillance. Join them."
full_description = "In addition to a huge online demonstration, groups around the world are planning events on the local level to protest surveillance abuses. Here's our guide on how to set up an event in your area. Members of the Wikipedia Community: Wikipedia would not be possible without a robust and distributed decision-making process, and it's powerful to watch it in motion. With that spirit in mind, we'd like to contribute a few points to the discussion about taking part in an action on February 11th to raise awareness about the dangers of mass surveillance. President Obama today announced changes to the NSA’s mass surveillance programs, hear what some of the members of The Day We Fight Back thought of the reforms. We’ve put together a scorecard showing how Obama’s announcements stack up against 12 common sense fixes that should be a minimum for reforming NSA surveillance. Each necessary reform was worth 1 point, and we were willing to award partial credit for steps in the right direction. See how the President's reforms racked up. This site is licensed under a Creative Commons Attribution 4.0 International License. Privacy Policy (updated February 13th, 2014)"
