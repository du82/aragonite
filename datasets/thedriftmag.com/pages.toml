["https://www.thedriftmag.com/editors-note-14"]
title = "Editors’ Note - The Drift"
description = "Country Over Party"
full_description = "Joe Biden’s first campaign for president, in the 1988 election cycle, met with a swift and ignominious demise. The Delaware senator’s attempts to cast himself as the candidate of youth and change — the standard-bearer of the “Pepsi Generation,” a Kennedy for the ’80s — fell flat. (Perhaps voters had some premonition of the senescent egomaniac we know today.) Three months after the campaign’s launch, the scandals, or, more precisely, the lies, began to surface: a speech clumsily lifted from the British politician Neil Kinnock; a fabricated past as a civil rights movement activist; mendacity surrounding his academic record at Syracuse University College of Law. When a New Hampshire primary voter pressed him on allegations of yet more plagiarism in law school, Biden snapped: “I think I probably have a much higher I.Q. than you do.” That just about sealed things up. In his final, never-completed presidential campaign, the collapse was excruciatingly protracted. But it was accompanied throughout by another hailstorm of lies. The biggest insult of all was, once again, the insistence by Biden and his sycophants that, against all evidence to the contrary, they were simply smarter than the rest of us. We spent over three years watching the president’s mind and body fail him — the raspy whisper with its improbable syntax, the sallow skin, the shuffling gait, the all-encompassing sleepiness Donald Trump mocked at every opportunity — while the regime and its media stenographers asked us to trust them instead of our lying eyes. (Even after the fever broke this summer and journalists began to write honestly about Biden’s condition and its impact on his electability, the president’s lackeys whined about how unfair such scrutiny was in light of Trump’s failings.) As popular sentiment on the Biden economy turned increasingly sour, prominent pundits insisted that dissatisfaction was completely baseless. Cynical Biden haters were responsible, they argued, for concealing the truth about the historic prosperity the administration’s technocrats had engineered. While the United States committed an apparently inexhaustible supply of weapons and tactical and logistical support to Ukraine and Israel, including the deployment of American troops to both Europe and West Asia, Biden repeatedly insisted that under his leadership the country was not at war for the first time in a generation. The administration was actually working tirelessly toward a ceasefire in Gaza, we were informed, even as the arms kept flowing and the slaughter continued apace."
