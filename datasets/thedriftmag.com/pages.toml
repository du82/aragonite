["https://www.thedriftmag.com/about"]
title = "About - The Drift"
description = "The Drift is a triannual magazine of culture and politics."
full_description = "“The Drift incarnates a bracing new sensibility, as agile and mordant as it is intrepid.” —Pankaj Mishra “Gorgeous writing and maverick left political thinking—what more do you want from a magazine?” —Wendy Brown “The Drift introduces itself with maybe the most brilliantly acute, utterly devastating criticism of the self absorption of elite, liberal media ever written.” —Richard Yeselson Founded in June 2020, The Drift aims to introduce new work and new ideas by young writers who haven’t yet been absorbed into the media hivemind and don’t feel hemmed in by the boundaries of the existing discourse. Our issues, published three times a year, feature longform essays and cultural criticism, short fiction, poetry, interviews, dispatches, and extremely abbreviated reviews. Thayer Anderson Erik Baker Saliha Bayrak Tarpley Hitt Zain Khalid Max Norman Krithika Varagur Livia Wood sharp, surprising interventions; socially engaged cultural criticism; class-sensitive analysis; pieces that point out what’s being avoided or talked around in politics, media, arts, or even academia; upbeat cynicism; un-self-serious screeds; generous takedowns; entries from the margins; fiction; poetry; 150-word reviews of books/ films/ TV shows/ art/ ephemera. anything that toes a party line (any party, any line); highbrow name-dropping; attacks on easy targets; straightforward longform reviews narrowly focused on a single book or movie; dispatches from The Right Side of History; finger wagging; false binaries; anachronistic historical critiques; thoughts on Heidegger, Nietzsche, Foucault, [insert theory-bro icon here]; hot takes on the latest 24-hour Twitter scandal; term papers (or anything that could conceivably be turned in as a term paper); Marxist critiques culminating in statements about the base and superstructure; personal essays. your love life; Twitter; therapy; cancel culture; chalking it up to neoliberalism; chalking it up to late-stage capitalism; AI panic; ChatGPT; trad Caths; Dimes Square; whatever’s on Netflix; greenwashing; performative pessimism; girlbosses, and misogynistic critiques of girlbosses; memes; Sally Rooney, Ottessa Moshfegh, and their imitators; New York; wokeness; anti-wokeness; trauma; gender essentialism; the political and psychological effects of social media; zoomers and sex; cable news; Elon Musk; hot girls; lifestyle choices; contemporary fiction."
