["https://www.thedriftmag.com/borderlands-betrayed"]
title = "Borderlands, Betrayed - The Drift"
description = "How Hispanic Democrats Abandoned Progressivism in South Texas"
full_description = "In February, before the Democrats swapped candidates, Joe Biden and Donald Trump separately visited Texas on the same day to present their respective plans for cracking down on border crossing. In Eagle Pass, Trump walked along a razor-wire fence, telling Border Patrol agents — and TV cameras — that the country was “being overrun” by “Biden migrant crime.” Biden, standing in front of another Border Patrol group a few hundred miles away in Brownsville, blamed Republicans in Congress for blocking the Senate compromise bill that originally included twenty billion dollars for border enforcement. “The bipartisan border security deal is a win for the American people,” he said. “That’s a win for the people of Texas. And it’s fair for those who legitimately have a right to come here to begin with.” Republicans never took the deal: the sections on border security were removed from the bill, and the issue remained a liability for Kamala Harris when she took Biden’s place on the Democratic ticket. Trump’s first line of attack was to slam the new nominee as the so-called “border czar” who had allowed migrants to flood the country — a refrain he repeated at the candidates’ September debate. Harris, who had never been given such a title, had been tasked with addressing what the White House called the “root causes” of migration, like food insecurity and job scarcity. Still, she responded to her right-wing critics with an ad boasting that she had “backed the toughest border control bill in decades” — referring to the failed compromise bill, which she pledged to revive — and promising that she would hire “thousands more border agents.” Only a few years earlier, Harris had called Trump’s proposed border wall “a complete waste of taxpayer money” and a “medieval vanity project.” But now, following Biden’s lead, she was supporting a bill that would allocate hundreds of millions of dollars to extend the wall. Like Biden, Harris carved out a rhetorical exception for what Biden had framed as “legitimate” arrival; at the Democratic National Convention in August, she affirmed her intention to simultaneously “create an earned pathway to citizenship and secure our border.”"
year_published = 2024
year_updated = 2024
