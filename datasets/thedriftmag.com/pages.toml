["https://www.thedriftmag.com/and-one-day-the-work-dies"]
title = "And One Day the Work Dies - The Drift"
description = "A man dies while out clubbing, then watches as his body is brought to the home of a famous fashion designer, who fondles it."
full_description = "A man dies while out clubbing, then watches as his body is brought to the home of a famous fashion designer, who fondles it. This is the plot of “The Return,” a late story by Roberto Bolaño. It is also the plot of Bolaño’s authorial afterlife. In the 21 years since his death, his body of work has been handled a lot by Anglophone critics and publishers, who, like so many necrophiliacs, simultaneously consecrate and desecrate their subject. Picador has now embarked on reissuing his translated catalog (originally acquired for the most part by New Directions). The revival started this September with a substantial print run of Antwerp, an elliptical novel in prose poems that Bolaño wrote while working odd jobs at age 27, and it will end with a reissue of 2666, to mark what would have been his 75th birthday. Are we late? Of course we’re late. Lateness is the condition of reading, and especially of reading in translation. We were late to Hölderlin, late to Kafka, less late to Borges; we were late to Dickinson, late to Keats; we are late, now, to Ursula Parrott, though readers were apparently on time for her in the 1930s. “A person arrives at a gathering and is ignored,” the philosopher Ernst Bloch wrote. “Only afterward do those who were present, not having expected anything unusual, discover what transpired in their midst.” Or a person arrives at a gathering and is lauded, and then the scene is forgotten, and the person with it. Or the scene is forgotten until it is fictionalized by an unknown writer whose fictionalization catapults him (and the long-dead scene) to fame. Lateness isn’t just a condition of Bolaño’s work, much of which was produced with death in view, but one of the drains it swirls. A cottage industry trading in the works of a writer mostly overlooked during his life is the very stuff of his fiction. Absent from his oeuvre is the I-liked-that-band-first cynicism that has marked his canonization — as if, because we are late, our fondness for his work is mere nostalgia. Absent from, or of another order of magnitude. For Bolaño, a reader who believed that books were a writer’s homeland and that nationalism was a “statue made of shit slowly sinking into the desert,” all literature was world literature, and all literature was headed to the same place: oblivion."
