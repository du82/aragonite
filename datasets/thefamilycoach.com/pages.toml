["https://thefamilycoach.com/ignore-it"]
title = "Empowering Your Parenting Journey - the Family Coach"
description = "Explore strategies with The Family Coach. Empower your parenting journey with effective approaches for positive family dynamics. Call us."
full_description = '“I ask three things of the books I read. I want to learn something, I want to laugh, and, when a book is really special, I get to forge a personal connection with a writer for as long as I turn the pages. Catherine Pearlman has given me all three in this book, and much more.” – Jessica Lahey, Author of The Gift of Failure BUY BOOK:Amazon|Barnes & Noble |IndieBound |Powell’s |Books A Million|Hudson Booksellers | PenguinRandomHouse Ignore It! How Selectively Looking the Other Way Can Decrease Behavioral Problems and Increase Parenting Satisfaction This book teaches frustrated, stressed-out parents that selectively ignoring certain behaviors can actually inspire positive changes in their kids. With all the whining, complaining, begging, and negotiating, parenting can seem more like a chore than a pleasure. Dr. Catherine Pearlman, syndicated columnist and one of America’s leading parenting experts, has a simple yet revolutionary solution: Ignore It! Dr. Pearlman’s four-step process returns the joy to child rearing. Combining highly effective strategies with time-tested approaches, she teaches parents when to selectively look the other way to withdraw reinforcement for undesirable behaviors. Too often we find ourselves bargaining, debating, arguing and pleading with kids. Instead of improved behavior parents are ensuring that the behavior will not only continue but often get worse. When children receive no attention or reward for misbehavior, they realize their ways of acting are ineffective and cease doing it. Using proven strategies supported by research, this book shows parents how to: – Avoid engaging in a power struggle – Stop using attention as a reward for misbehavior – Use effective behavior modification techniques to diminish and often eliminate problem behaviors Ignore It! Around the Web How to Ignore Your Kids’ Bad Behavior and Yet Be Fully Present for Them –New York Times Book Review Just Ignore It: 3 Tips to Stop the Antics –Parents Magazine Feral College Kids: Why “Ignore It” Is The Best Advice For The Holidays –Grown & Flown “Is Ignoring Your Kid A Legit Parenting Strategy? An Expert Explains” — Mind Body Green I’m the Parent to My Kids (Not the Neighbor or Grocery Store Clerk) –Today Parenting Team Ignoring Your Kids May be the Life Hack Your Family Needs –Toronto Star Want to Win Parenting? 3 behaviors to ignore””and 4 to reinforce instead –Motherly Ignore It: When Parents Should Selectively Look The Other Way on Fit4Mom Woman on a Mission to Return Joy to Parenting –Work. Kids. Wine. Ignore Bad Behavior & Enjoy Parenting More With Catherine Pearlman: The Mom Hour Voices on The Mom Hour The Quaz Q & A –Jeff Pearlman Allowing Your Child to Experience Natural Consequences –Green Child Magazine This Is What You’re Doing When You Give In To Your Kid’s Whining –Romper Track and Chart Your Kid’s Tantrums to Help Change Behavior –Life Hacker Ignore Bad Behavior in Kids to Bring Out the Good –Momzette The 5 Most Ineffective Things Parents Say to Their Kids–Your Tango How to Stop Helicoptering and Start Disciplining Your Kids Effectively –NBC BETTER When and Why You Should Ignore Your Child –US News & World Report Here’s Why Time-Out Isn’t Working for You –Kveller Ignoring Your Kids: Surprise! It Makes You A Good Parent –Spawned Podcast Parenting in Public: 5 Ways to Parent Your Way –Houston Family Magazine Rewards and Bribery, Aren’t They The Same? –Mile High Mamas Sleep and Back to School –Good Day Sacramento Why Being a ‘Good Enough’ Parent Is Better Than Being Perfect –Brightly When Do You Ignore Your Kid? –Life Hacker Want to Enjoy Your Kids More? Ignore These 4 Misbehaviors –Parent.co #FromAtoBook on #amwriting podcast Cursing May Indicate Intelligence –Orange County Register A Few Words with Family Coach Catherine Pearlman –Rich Ehisan Five Things to Ignore When Taking Family Portraits –Noel Besuzzi Sometimes If You See Something, Don’t Say Something –KJ Dell’Antoinia Want to Enjoy Your Kids More? Ignore Them and Everyone Will Be Happier –Get Mom Balanced When Kids Misbehave Should We Just Ignore It? –Just BE Parenting How to Cope with Siblings who Annoy, Bully or Fight –How to Talk to Kids About Anything Podcast Increase Parenting Satisfaction with Ignore It! –Soul Work for Moms Why You Should Ignore Your Kids More –The New Family Reviews “…Fun to read and written in a parent-to-parent voice, this is a welcome reintroduction of well-tested child-raising methods and should be required reading for all parents.” – Publishers Weekly “I ask three things of the books I read. I want to learn something, I want to laugh, and, when a book is really special, I get to forge a personal connection with a writer for as long as I turn the pages. Catherine Pearlman has given me all three in this book, and much more. She’s given me a resource I will refer back to over and over again, both as a writer and a parent.” –Jessica Lahey, author of The Gift of Failure “Ignore It! is THE best parenting book I’ve ever read – it’s helped break the bad cycles of reinforcing bad behavior and missing good behavior that I’d fallen into. Our whole home is so much more peaceful and parenting has become wildly more enjoyable for me. Buying this book is the best $10 you will ever spend.” –Janssen Bradshaw, Everyday Reading “Dr. Pearlman’s book offers parenting advice that is effective in every situation. Chock-full of practical applications, this book will help you ease out of those challenging situations every parent faces.” “¨–Dr. Shefali Tsabary, Psychotherapist and author of The Conscious Parent “Fun, insightful straightforward advice that can really make your family life happier.” “¨–KJ Dell’Antonia, New York Times Well Family columnist “Dr. Pearlman recommended ignoring my son when he was having a hard time. At first it felt weird and wrong. What I soon realized is that he needed to calm down without me lurking over him. I wasn’t shirking my parenting duties by ignoring him. I was giving him space which I think I had not been doing before. Parenting is hard. As soon as you figure out one stage they move on and age into some other unknown territory. I am happy to have Dr. Pearlman to help me find my way.” “¨– Rachel Schinderman, Founder of Mommiebrain “From tantrums and food strikes to sibling bickering and random refusals, children often seem to create drama and incite arguments intentionally. Demonstrating how debate and engagement with a child only encourages whining and negotiating, Pearlman presents a four-step process designed to increase both a child’s self-esteem and parenting satisfaction. Ignoring bad behavior is known to be a preferable and more effective tool than over-correcting. And as always, parents will need a lot of inner strength and consistency to get the desired results. VERDICT For public library collections.” – Library Journal “Pretty soon, I started ignoring other, less tantrumy behavior, as well. Instead of yelling at my child to go back to time out, I let her wander into the kitchen while I kept chopping vegetables, until eventually – to my disbelief – she returned on her own.” —Parent.co “I tried it and it worked. So I tried it again, and guess what – it worked again. So far my little lovelies have not caught on when I am using Dr. Pearlman’s advice and techniques, and we are all happier for it.” —2 Dads with Baggage #goodreads-widget {<br /> font-family: georgia, serif;<br /> padding: 18px 0;<br /> width:575px;<br /> }<br /> #goodreads-widget h1 {<br /> font-weight:normal;<br /> font-size: 16px;<br /> border-bottom: 1px solid #BBB596;<br /> margin-bottom: 0;<br /> }<br /> #goodreads-widget a {<br /> text-decoration: none;<br /> color:#660;<br /> }<br /> iframe{<br /> background-color: #ffffff;<br /> }<br /> #goodreads-widget a:hover { text-decoration: underline; }<br /> #goodreads-widget a:active {<br /> color:#660;<br /> }<br /> #gr_footer {<br /> width: 100%;<br /> border-top: 1px solid #BBB596;<br /> text-align: right;<br /> }<br /> #goodreads-widget .gr_branding{<br /> color: #382110;<br /> font-size: 11px;<br /> text-decoration: none;<br /> font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;<br /> }<br /> Goodreads reviews for Ignore It! Reviews from Goodreads.com'
