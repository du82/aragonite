["https://thefamilycoach.com/its-just-barbecue-sauce"]
title = "It's Just Barbecue Sauce - The Family Coach"
description = "Sometimes as parents we wonder what we would do for our children if given the chance. Of course I’d give an organ, arm or leg for my kids. But would I spend $25 to check an overpriced bottle of barbecue sauce at the airport? After five blissful days celebrating my in-laws 50th wedding anniversary in […]"
full_description = "It’s Just Barbecue Sauce by admin | Aug 17, 2018 | Blog, Uncategorized Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Sometimes as parents we wonder what we would do for our children if given the chance. Of course I’d give an organ, arm or leg for my kids. But would I spend $25 to check an overpriced bottle of barbecue sauce at the airport? After five blissful days celebrating my in-laws 50th wedding anniversary in Maui we arrived at the Kahului Airport with a bit less than the requisite two-hour window. We returned our Chevy Malibu to Budget and hopped onto the bus waiting to take us to the terminal. We completed the agricultural scan, printed out our boarding passes and checked our bags to LAX. Everything went remarkably smoothly. Our luck continued with all four of us snagging TSA Precheck. My daughter and husband placed their bags onto the belt to be scanned. Emmett, my son, loaded up the bag we were sharing, and we all passed through the metal detector. And then it happened. My bag with Emmett was placed in the bad lane. We had something impermissible, but what? A stray bottle of water maybe. Nope. It wasn’t water or sunscreen or something else inconsequential, either. When the TSA security guard pulled out the banned item, my heart sank. One day during our vacation Emmett and I had a surfing lesson in the morning. After chilling in the hotel for a while I convinced him to come to town with me for a Dole Whip. On the way back to the hotel we stopped at the local supermarket for some snacks. Emmett asked, “Can I look for a bottle of barbecue sauce to take home as a souvenir?” Sure, I told him. Last year when I went to Austin for a conference I brought him back sauce from The Salt Lick. He’s been slowly rationing the bottle since then. Some kids want keys chains or T-shirts or bracelets to remember their vacations. My son wants a condiment. I couldn’t be prouder. So when the $8 Da Kine bottle was lifted out of my bag I thought, “Oh crap. Emmett will be crushed.” The TSA attendant read the look on my face, and told me I could go back out to the check in area and see if they could find my bag. If not, I could check it for $25. I gave my husband the boarding passes for him and the kids. I took mine and the bottle of sauce and left the secure area on a mission. No condiment left behind, right? At the check in I meet Aleah, the Hawaiian Airlines employee contracted by American Airlines. I explain my plight. She isn’t moved. But she takes my bag tickets and says she will go out a take a look. Ten minutes pass. Then 15. I’m sweating and starting to lose faith. Finally Aleah shows up with bad news. She can’t find our bags. They have probably been taken already to board the plane. I go with Plan B. I ask Aleah if there is any way she can just check the sauce for me as a courtesy without charging me a fee. I explain I’m a loyal American customer with frequent flyer miles. Aleah says no, but agrees to ask her manager anyway. Before walking away she asks me what I will check the sauce in. She can’t just check a bottle. Then she walks away. It’s now 11:46 am. My flight is boarding in 30 minutes, and I still have to go back through security. Finally she appears with more bad news. Her manager said she wouldn’t courtesy check the bottle for me but she would allow Aleah to go out once more to look for my bags. Aleah makes it clear this is a one-time privilege. I once again give her my bag tags and wait. Tick, tick, tick. Aleah is nowhere to be found. I decide then and there that if Aleah comes back without my bag I will just check the darn sauce. The thought of seeing my son’s little lower lip quiver in sadness when he realizes his one special purchase was left in the airport was too much for me. I cleaned out my purse preparing to check it. It’s noon, and I get a text from my husband–WHERE ARE YOU?. I’m starting to stress. At this point I just want Aleah to come back so I can check the bag, pay my $25 fee and run to catch my plane. But just then, like a Love’s in the desert, Aleah appears with one of our bags. I tell her she is a miracle worker. I tuck the Da Kine barbecue sauce made with real Hawaiian pineapple juice into the bag, close it up and thank Aleah. I pass through security with ease and run to the gate with a triumphant smile. Would it have been ridiculous to buy a costly bottle of barbecue sauce then spend an extra $25 to check it? Probably. But I would have done it. I don’t think I would have regretted it either. That would have been a great ending to this story. But it isn’t the end. Upon landing when our bag arrived on the carousel I noticed it was opened. Lo and behold, all the contents of the bag were there…except (you guessed it) the barbecue sauce. So there you have it. That’s parenting in a nutshell. Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
