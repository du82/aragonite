full_description = "Fearing ADHD Meds and a Hair Catastrophe for 04/14/2018 by admin | Apr 14, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Fearing ADHD Meds and a Hair Catastrophe for 04/14/2018 Dear Family Coach Dear Family Coach: My daughter has been diagnosed with attention deficit hyperactivity disorder. She showed the signs for several years. However, recently, she has had much more trouble in school, and even with her friends. Her doctor recommended she try medication to help control some of her behavior, but we are really against it. There are side effects, and we don’t want her to be dependent on drugs for the rest of her life. What do you think about it? – Concerned Parents Dear Concerned: What if your daughter didn’t have ADHD but instead was born with a congenital heart condition that required her to be on medication for the rest of her life? Would you consider withholding the drugs? I highly doubt it. Yet when it comes to mental health conditions, people often consider medical management a non-necessity. While there are other treatments, studies show that medication, especially when combined with other therapies, is highly effective in treating ADHD. Updated: Sat Apr 14, 2018 Fearing ADHD Meds and a Hair Catastrophe for 04/14/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
