title = "Fortunately - The Family Coach"
description = "Fortunately, my daughter finally learned to hold her own sippy cup. Unfortunately, my milk dried up. Fortunately, my son started to walk then run. Unfortunately, now he runs away from me every chance he gets. Fortunately, I’m soaking up my son snuggling quietly on my shoulder. Unfortunately, it’s only because he’s teething and miserable. Fortunately, […]"
full_description = "Fortunately by admin | Jul 10, 2019 | Blog Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Fortunately, my daughter finally learned to hold her own sippy cup. Unfortunately, my milk dried up. Fortunately, my son started to walk then run. Unfortunately, now he runs away from me every chance he gets. Fortunately, I’m soaking up my son snuggling quietly on my shoulder. Unfortunately, it’s only because he’s teething and miserable. Fortunately, my daughter started preschool, and I now have a minute to myself. Unfortunately, I’m overwhelmed with what to do in those hours. Fortunately, my son started Kindergarten without looking back. Unfortunately, I was hysterical in the parking lot. He looked so small. Fortunately, my daughter made friends in the playground. Unfortunately, she wasn’t invited to the birthday party. Fortunately, my kids are spending the night over at their grandparents’ house. Unfortunately, I’m too tired to go out for date night, and I just want to sleep. Fortunately, after I dreamed of it for years, my son went off to camp for two weeks. Unfortunately, I can’t do anything but think of what he might be doing and if he’s happy. Fortunately, my daughter made the sports team. Hooray! Unfortunately, now we can’t go on family vacation without letting someone down. Fortunately, my kids learned to make pancakes and tacos and bake cookies. Unfortunately, I’m not needed in the kitchen anymore. Fortunately, my daughter received her driving permit, and she’s exhilarated. Unfortunately, soon enough she will be out more than she’s in. Fortunately, my son can play for hours on his own in the garage making robots and gadgets. Unfortunately, I’m now thinking I should be more careful what I wish for. Fortunately, my kids are looking into college and toward their bright futures. I’m so proud. Unfortunately, I’ve just put myself out of a job. They are gone, and it’s over. Fortunately, they know I love them and now adventure awaits us all. Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
