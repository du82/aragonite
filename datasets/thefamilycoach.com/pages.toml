description = "Visible Tattoos and a Sugary Breakfast Habit for 04/07/2018 Dear Family Coach Dear Family Coach: My son will be 18 in a few months. He has been accepted into college and will be moving to a big city in the fall. He says that once at college, he’s going to get a tattoo on his […]"
full_description = "Visible Tattoos and a Sugary Breakfast Habit for 04/07/2018 by admin | Apr 7, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Visible Tattoos and a Sugary Breakfast Habit for 04/07/2018 Dear Family Coach Dear Family Coach: My son will be 18 in a few months. He has been accepted into college and will be moving to a big city in the fall. He says that once at college, he’s going to get a tattoo on his hand or wrist. I don’t mind a tattoo, but I’m concerned about him losing job possibilities because of his tattoo being too visible. But he will be 18, and the only thing I could do is threaten to take away his college money. Would that be a mistake, or is this decision too big to allow a young man to make? – Purse Strings Dear Strings: I am never a fan of using the purse strings to keep young adults in line. If your son is wasting your money, blowing off classes and failing semester after semester, then it’s time to pull the plug, or at least change the deal. Otherwise it’s time to let your son grow up and make his own decisions. Updated: Sat Apr 07, 2018 Visible Tattoos and a Sugary Breakfast Habit for 04/07/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
