title = "Taking My Own Advice - The Family Coach"
description = "As The Family Coach it’s been my mission to help families enjoy parenting more. Sometimes I’m smart enough to take my own advice. Last week we went to the fair as a family. My daughter, being a teenager, went off with a friend. That left my son, Emmett, alone with my husband and me. […]"
full_description = "Taking My Own Advice by admin | Aug 6, 2018 | Blog, Uncategorized Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share As The Family Coach it’s been my mission to help families enjoy parenting more. Sometimes I’m smart enough to take my own advice. Last week we went to the fair as a family. My daughter, being a teenager, went off with a friend. That left my son, Emmett, alone with my husband and me. We wanted to make it fun for him. My husband suggested we buy an extra ride pass for us to share. I don’t do rides (everything makes me sick) so my husband bravely accompanied Emmett on the Crazy Coaster and the Cliffhanger. But I could see my son really wanted me to do something with him. I decided I could handle the giant slide. Slowly Emmett and I climbed up steps that seemed like 17 stories. We sat side-by-side at the top in our sacks. My heart was racing. My son looked at me and asked, “Ready?” I said I was, although I wasn’t. Then we pushed off and slid down together. I screamed the whole way like a little kid. At the bottom we both giggled and hugged and smiled. It was such a great experience and I was totally satisfied in my participation. With Rayshawn, out newest beloved stuffed animal My husband then shared the pictures he took and I was so touched. Aside from my cheesy grin what struck me most in the pictures was how my son was looking back at me for most of the ride. He started out with both fists in the air filled with joy. But then he turned around to find me. He was checking on me, making sure I was OK and sharing the fun with his mom. This picture is such a reminder to me to put my phone down, stop nagging my kids about this and that, and just have some fun with them. Our passes came with two games for each of us. Emmett and I played the one where you point the water gun at the little circle. I won and gave Emmett my prize. At the end of the night we finished the fair as we always do. Emmett and I rode the giant ferris wheel together at sunset, just the two of us. He calls it my Jam and he’s right. It’s just my speed, it’s 10 minutes and it’s my favorite alone time with my little buddy. Soon enough he will be the teenager going off with his friends. Then my husband and I will just twiddle our thumbs at the fair eating large smoked turkey legs and visiting the bunnies until our kids are ready to go. It will be fine, but not the same. Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
