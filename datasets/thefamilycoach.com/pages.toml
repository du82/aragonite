full_description = "Lonely Mom and Dealing With Miscarriage for 03/31/2018 by admin | Mar 31, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Lonely Mom and Dealing With Miscarriage for 03/31/2018 Dear Family Coach Dear Family Coach: I have two kids. When my oldest was born, I had lots of friends to meet for play dates. Those friends provided me with a lot of social and emotional support. I never realized how much until I had my second son. My youngest has a severe form of autism. He is difficult to be around, and thus, I have pretty much lost all of my friends. I am lonely and exhausted, and I feel abandoned. How can I help my friends see how much I need their friendship? – Alone Dear Alone: It can feel exceptionally lonely to be the parent of a child with special needs. I am sorry your friends didn’t rise to the occasion. Updated: Sat Mar 31, 2018 Lonely Mom and Dealing With Miscarriage for 03/31/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
