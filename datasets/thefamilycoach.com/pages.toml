full_description = "Snooping Mistakes and a Pesky Pacifier for 03/24/2018 by admin | Mar 24, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Snooping Mistakes and a Pesky Pacifier for 03/24/2018 Dear Family Coach Dear Family Coach: My 16-year-old daughter tells us nothing about her life. So when she goes to bed, I sometimes browse through her cellphone. At first I just noticed typical teenage girl gossip. But then I read about a boy she likes and is trying to attract by wearing tight clothing and sending him racy Snapchats. How can I address this with her without telling her that I’ve been on her phone? – Snooper Dear Snooper: Stop snooping right now. Your daughter chooses not to share her life with you. It would be helpful to figure out why. Is she just private, or is she worried about the potential lectures she will get if she tells you anything? Either way, I can guarantee she will be even less likely to share her life details once she finds out you’ve been snooping. Furthermore, once you read or see something upsetting, you can’t unknow it. That’s the danger. You don’t know what you will find, or even how to handle it. Updated: Sat Mar 24, 2018 Snooping Mistakes and a Pesky Pacifier for 03/24/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
