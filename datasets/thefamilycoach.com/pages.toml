full_description = "Potty-Training Resistance and a Nickname for 03/17/2018 by admin | Mar 17, 2018 | Dear Family Coach Potty-Training Resistance and a Nickname for 03/17/2018 Dear Family Coach Dear Family Coach: My nearly 4-year-old daughter is not potty trained. At preschool she is prompted to use to toilet every hour or so, and she successfully tinkles. But at home she refuses to tell us when she needs to go and has a tantrum when we suggest she sit on the potty. She has never pooped on the potty at school or at home. She just goes in her pullup. We’ve tried everything. Should we continue to push her or just put her in underwear and hope for the best? – Daddy Dear Daddy: Pump the breaks. Potty training comes easily to some, looking almost as if the kid trained herself. But for others it’s a struggle. The worst path parents can take with a resistant trainer is to push and prod. Little kids control almost nothing in their lives. Where they pee and poop is in their control. When children see how desperately important the toilet seems to their parents, they often decide to resist just because they can. Updated: Sat Mar 17, 2018 Potty-Training Resistance and a Nickname for 03/17/2018 Potty-Training Resistance and a Nickname for 03/17/2018 by admin | Mar 17, 2018 | Dear Family Coach Potty-Training Resistance and a Nickname for 03/17/2018 Dear Family Coach Dear Family Coach: My nearly 4-year-old daughter is not potty trained. At preschool she is prompted to use to toilet every hour or so, and she successfully tinkles. But at home she refuses to tell us when she needs to go and has a tantrum when we suggest she sit on the potty. She has never pooped on the potty at school or at home. She just goes in her pullup. We’ve tried everything. Should we continue to push her or just put her in underwear and hope for the best? – Daddy Dear Daddy: Pump the breaks. Potty training comes easily to some, looking almost as if the kid trained herself. But for others it’s a struggle. The worst path parents can take with a resistant trainer is to push and prod. Little kids control almost nothing in their lives. Where they pee and poop is in their control. When children see how desperately important the toilet seems to their parents, they often decide to resist just because they can. Updated: Sat Mar 17, 2018 Potty-Training Resistance and a Nickname for 03/17/2018"
