description = "An Uncooperative Bar Mitzvah Boy and a Budding Rapper for 05/12/2018 Dear Family Coach Dear Family Coach: My son is scheduled to have his bar mitzvah next year, and it’s a very important event for our family. Unfortunately, he doesn’t see it that way. He never practices; he drags his feet to Hebrew school; and […]"
full_description = "An Uncooperative Bar Mitzvah Boy and a Budding Rapper for 05/12/2018 by admin | May 12, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share An Uncooperative Bar Mitzvah Boy and a Budding Rapper for 05/12/2018 Dear Family Coach Dear Family Coach: My son is scheduled to have his bar mitzvah next year, and it’s a very important event for our family. Unfortunately, he doesn’t see it that way. He never practices; he drags his feet to Hebrew school; and he has said repeatedly that he doesn’t care about Judaism. What can I do to change his attitude? – Kosher Pickle Dear Kosher: This is a tough one because it involves faith and family and so many things you clearly hold dear. However, you’re pretty limited in what can be done. I’m guessing you’ve explained why his bar mitzvah is an important event. He likely knows the significance of the ritual and the history of the Jewish people. And yet, none of that has swayed him. At this point, you have two choices. You can continue to beg and bribe him until he finally makes it to the event. But you can’t complain if he doesn’t wow the crowd. The other option is to do absolutely nothing. Updated: Sat May 12, 2018 An Uncooperative Bar Mitzvah Boy and a Budding Rapper for 05/12/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
