full_description = "Sexy Songs and a Son's Diary for 04/28/2018 by admin | Apr 28, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Sexy Songs and a Son’s Diary for 04/28/2018 Dear Family Coach Dear Family Coach: My 8-year-old kid loves Katy Perry songs, which are seemingly all about sex. However, we’ve been innocently singing along in the car and having a blast. Well, that is until recently, when I heard her singing about a menage a trois in public. My husband and I were mortified. Do I have to put an end to this, and if so, how? – Katy Fan’s Mom Dear Mom: On a scale of inappropriate, your daughter belting out potentially racy lyrics rates about a four on a 10-point scale. Sure, it would likely make some older folks uncomfortable to hear your little lady squealing sexual innuendos and sex talk. But that’s more about them than your daughter. She doesn’t know what she is saying. Updated: Sat Apr 28, 2018 Sexy Songs and a Son’s Diary for 04/28/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
