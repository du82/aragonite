title = "Healthy and Balanced Tech Experience - the Family Coach"
description = "Guide your childs digital journey with insights from The Family Coach. Learn about First Phone strategies. Contact us."
full_description = "“Kids will want to read First Phone because it’s an informative relatable guide. Parents will also be supported with a road map to discuss crucial issues with their children. This invaluable guide will help get young people started off on the right foot with their first phone. Dr. Pearlman’s compassion for parents and kids at this important milestone comes through on every page.” – Devorah Heitner, PhD Author ofScreenwise: Helping Kids Thrive and Survive in Their Digital WorldandGrowing Up in Public BUY BOOK:Amazon |PenguinRandomHouse First Phone A Child’s Guide to Digital Responsibility, Safety and Etiquette A fun and informative illustrated kids’ guide to safely and productively navigating the digital landscape. Cellphones have become a fact of life, with children as young as eight (yes, eight!) getting their very own “devices.”Such boundless access means our kids are in nearly constant contact with technology that was designed specifically for adults. And they’re doing so without any type of road map. EnterFirst Phone: the essential book that apprehensive parents can confidently hand to their kids to read as they begin their journey into the digital world. InFirst Phone,Catherine Pearlman–licensed clinical social worker and parenting expert–speaks directly to eight- to twelve-year-old children about digital safety in a manner that is playful, engaging, and age-appropriate. With insights and strategies supported by the latest research,First Phoneoffers: – guidance on privacy, boundaries, social media, and even sexting (yes, young children need to learn about sexting before it happens!)– best digital hygiene and self-care practices, including when to put the darn phone down, when to turn off notifications, and where to charge– how to be a kind and compassionate upstander in a digital world An essential companion when your child receives their first phone, this book provides kids the tools and information they need while giving their parents peace of mind. First Phone, Around the Web First Phones & Digital Responsibility: Voices 78 with Catherine Pearlman – The Mom Hour How to Set Healthy Boundaries with your Child and Their Phone – The Today Show 5 things parents should know before kids get their 1st phone – The Today Show Let’s talk about Kids and Smartphones with Dr. Catherine Pearlman – Keep Calm and Mother On with Christy Thomas How can parents help kids use smartphones safely? An expert offers some tips – NPR Connecticut All Things Considered Are you getting your child a smartphone this holiday? We have advice – Cincinnati NPR All Things Considered Getting Kids Their First Phone Is Never Easy; This Book Helps – LA Parent It’s Never Too Late to Change Simple Tech Rules With Your Teens – Parenting Tweens and Teens Author shares how kids can make safe, healthy choices with their smartphones – CBS Chicago How To Teach Your Kids to Use Their Cellphone Responsibly – NPR All of It What age should you give a kid a their first phone? – Washington Post What teens think their parents should know about phones – Washington Post When to give kids their first phone? – Girls That Create A Child’s Guide to Digital Responsibility, Safety and Etiquette – WGN News Conversations: Catherine Pearlman, “First Phone – A Child’s Guide to Digital Responsibility, Safety, and Etiquette” – Kansas Public Radio"
