title = "The Best Sports Parents - The Family Coach"
description = "I love to watch my kids play sports. I love watching water polo. I love flag football. I love the fast pace of the basketball games. I even love the boring (sorry, it’s true) baseball games. I don’t care if my kids win. I don’t particularly care if they play that well. As a parent, […]"
full_description = "The Best Sports Parents by admin | Oct 5, 2019 | Blog Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share I love to watch my kids play sports. I love watching water polo. I love flag football. I love the fast pace of the basketball games. I even love the boring (sorry, it’s true) baseball games. I don’t care if my kids win. I don’t particularly care if they play that well. As a parent, what makes my day is watching my kids have fun. Sadly, there are almost always one or more parents who just suck the life out of the game. They seem to live or die by every play. They offer endless chirps of advice from the sidelines. None of it is actually helpful. Their kids clearly hate it. It’s the #1 reason kids stop playing sports by the age of 13. My kids are not sports superstars. They are not getting a scholarship or even hoping to be a walk on somewhere. They get out there to exercise, have fun, and make friends. What I enjoy at my kids’ games is seeing them have a moment. Sometimes it’s making a great catch or scoring a goal or a touchdown. More often than not, it’s a moment that’s nearly imperceptible to every other spectator. It’s when my son knows he did his best, and he flashes us a little smile. It’s when my daughter gets aggressive with another player (totally normal in water polo), and we marvel at how far she’s come in the game. Unlike the typical sideline sports parent debacle, today I got a glimpse of what sports could be like if all of the parents behaved themselves and enjoyed the game. My 12-year-old son, Emmett, is in his last year of flag football. At the game today my husband and I noticed 10 dads who appeared to be having a party in the stands. It was like they had just come from the best tailgate and couldn’t wait to see the big game. But the big game was flag football for middle schoolers. Instead of heckling “helpful tips” to improve play, they shouted supportive sayings to every player. They laughed (a shockingly rare occurrence on the sidelines). They cheered. They did the wave. At one point my son made an interception. The crowd went wild. Then Emmett did it again, but this time ran for a touchdown. The fun dads asked us his name. Then they started chanting “Emmett, Emmett, Emmett”. My son did the tiniest of celebration moves to acknowledge the crowd, and we all chuckled. This group of men made the game entertaining not only for the kids, but for the parents. It was pure joy, and I’m grateful that my son had the game of his life while these dads were around. Not for the glory. But because their enjoyment was contagious. At the end of the game, the dads all lined up at the front of the bleachers and yelled for Emmett to come by for a round of high fives. Not one of these guys knew Emmett before the game. They treated him like the most coveted player ready to be drafted. Then they called over each boy on the team for their high fives. All of the boys went home with a smile. My son is an average player with good heart. He’s never the center of the big play. He’s typically one of the last players in and he’s mostly ok with that. Today, these dads brought their A game to flag football and made my son’s year. I wish every kid could have a sports parent section like this at every single game. It certainly beats heckling our kids to do better. Thanks Dads! These dads are the heroes of today’s flag football game Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
