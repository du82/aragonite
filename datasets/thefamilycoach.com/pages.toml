["https://thefamilycoach.com/lets-rebrand-the-teen-years"]
title = "Let's Rebrand the Teen Years - The Family Coach"
description = "Google the word “teenagers” and a plethora of How to Survive Your Teenagers articles will appear. The memes and GIFs are endless. Sometimes they are funny (really funny). But mostly they just drive home the point that teens are unbearable beings that have no manners, roll their eyes in disgust and treat their parents without […]"
full_description = "Let’s Rebrand the Teen Years by admin | Oct 21, 2019 | Blog Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Google the word “teenagers” and a plethora of How to Survive Your Teenagers articles will appear. The memes and GIFs are endless. Sometimes they are funny (really funny). But mostly they just drive home the point that teens are unbearable beings that have no manners, roll their eyes in disgust and treat their parents without respect or consideration. As a family coach I know for sure that this is often the case, or at least it feels this way. However, when teens are consistently seen and portrayed as demons that is pretty much all many parents can see. I don’t find demons in my house. My kids friends are not demons and neither are any teens I’ve met (and I’ve met some really tough kids as a social worker). When I see young people, I see promise. I see possibility. I see the future. In an effort to rebrand kids ages 13 to 19, here’s an ode to all that’s good about parenting teenagers. Teen are funny. Teens are known to be a bit impulsive. What’s so great about that is they often say whatever comes to mind, and that can be insanely funny. They don’t have filters either. Also, funny! Don’t take your kids so seriously and you will start to see the funny. Teens aren’t jaded. They aren’t bogged down by past experience, and they see the world as changeable. They think they can fix global warming. They think they can elect people who will care about gun violence. They think a better world is possible. For this, I’m eternally grateful because we need changemakers now more than ever. Teens are sponges. They think they know it all but in reality, they don’t know all that much. It’s incredible watching kids suddenly make a connection from what they learn in school and real life. It’s adorable taking teens to try dumplings or roller skating for the first time. They have a zest for life when they give something new a chance. It reminds me of watching toddlers discover the world around them but on a much bigger scale. Teens are savvy. They can figure out new technology before their parents can sign into their iPhone 7s. They have never known a card catalog or a AAA trip tic, and that’s amazing. We can learn a lot from our kids if we can get past the brief Mom-you-are-an-idiot-for-not-knowing-how-to-do-this moment. Being tech savvy also translates into figuring other stuff out too if teens are allowed to make mistakes and learn from them. Teens do chores. Sure, younger kids can and should do chores. But teenagers can do them more competently and at a more advanced level. One of the best parts of my kids getting older is they can actually help me around the house. They take the dog out and empty the dishwasher. Both jobs I dislike. Teens who drive can also run to the drugstore for a prescription or the supermarket for items for dinner. Teens are good company. If you can find just the right activity, kids are great companions. Look for a tv series or program, a music group or type of food where you can bond with your teen. What to do if you have nothing in common with your kids? Pretend. Find something your child enjoys and take an interest. Teens are dedicated friends. Part of typical development is for teens to move their focus away from their home and parents. Their friends become vitally important, often to the dismay of their parents. But it’s fantastic to see the lengths teens will go for their friends. They bake them cakes. They rescue them even when it’s inconvenient. They stay up too late talking to them about every minute detail in life. This is all good practice for adult friendships, including transitioning to a different relationship with their parents. Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
