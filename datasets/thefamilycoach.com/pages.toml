["https://thefamilycoach.com/why-is-brett-kavanaugh-so-angry-it-might-not-be-what-you-think"]
title = "Why is Brett Kavanaugh So Angry? It Might Not Be What You Think - The Family Coach"
description = "If you saw Brett Kavanaugh testify before the Senate Judiciary Committee this week you undoubtedly noticed his anger. According to Kavanaugh, he is being wrongfully accused of attacking Christine Blasey Ford at a gathering with some friends in 1982. What stands out from his appearance, and there was a lot to take in, is Kavanaugh’s […]"
full_description = "Why is Brett Kavanaugh So Angry? It Might Not Be What You Think by admin | Sep 29, 2018 | Blog Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Andrew Harnik/Getty Images If you saw Brett Kavanaugh testify before the Senate Judiciary Committee this week you undoubtedly noticed his anger. According to Kavanaugh, he is being wrongfully accused of attacking Christine Blasey Ford at a gathering with some friends in 1982. What stands out from his appearance, and there was a lot to take in, is Kavanaugh’s visible rage. His facial expressions were so intense he looked like Jack Nicholson in A Few Good Men right before he yelled, “You can’t handle the truth.” Kavanaugh was the personification of Cujo, the dog from the Stephen King novel in the most unbecoming nature for a Supreme Court Judge. I think I keep turning towards movies to process his indignation because I’m having trouble with the extent of how much he lost control in that moment. Of course, anyone who believes he is being wrongfully accused of something would be angry. And it would be reasonable even for someone to crack under the pressure of the enormity of the confirmation hearings. If something I worked my entire life to achieve was hanging by a thread I’d be hostile too. But there is more to Kavanaugh’s anger that needs to be explored. I believe part of the reason he is so filled with fury is because he truly may have no memory whatsoever about the night in question. It’s so completely not ingrained in his mind that he cannot fathom that it actually could have happened much like it is being reported. In the 1980s I went to hundreds of gatherings just like the one described by Ford. Living in New York City it was easy enough for minors to find some alcohol. We drank for fun, and we often drank in excess. Of all the nights we did that I probably only remember a handful of actual moments from that time. They all blend into one large memory. That’s because during that time I wasn’t assaulted. Nothing out of the ordinary happened to jog my memory. I’ve learned in the last few years of several girls I knew who were victims of attacks. Some girls were victims of slut-shaming or unwanted sexual advances as well. I can promise you those girls remember the exact party where the incidents happened but many of their aggressors might not. (To those girls, I’m sorry I didn’t know, and I’m sorry I didn’t do more regardless.) How could they remember but I don’t? Surely, I was at some of those parties. In college I remember one time being so drunk that after kissing a boy I turned to the side to be sick. Immediately after throwing up I looked up to find the boy was ready to kiss me again. I remember being disgusted by that fact. Who would want to kiss a girl who had just puked right in front of him? However, I wasn’t disturbed that I couldn’t possibly give consent in that state. Consent wasn’t even a concept I considered much. If you ask that boy if he remembered the incident he would likely say it didn’t happen. Why would he say that? Because he wouldn’t have remembered it. That night probably wasn’t different for him than any other night of the school year. He and his fraternity boys drank every single weekend to excess and every single weekend there were girls around to pursue. It’s like Ground Hogs Day. Wake up and do it all over again. Just change out some of the girls, but really the faces didn’t matter that much anyway. I believe that is the explanation for why Christine Blasey Ford is 100% certain her attack happened and 100% certain that Brett Kavanaugh is the attacker. Meanwhile Kavanaugh claims he doesn’t even recall the get together. For Kavanaugh that summer was all parties and workouts and Beach Week. Kavanaugh and his pals drank to excess on so many occasions one particular night 36 years ago perhaps wouldn’t be recollected. He also pursued girls to add to his purported conquest list with the regularity of a part-time job. You know, the whole boys will be boys thing. Since Ford got away, nothing much of note happened. Right? Of course, not right. For Ford that night changed her entire life, so much so that in 2012 she was still discussing the assault with a therapist. Brett Kavanaugh was so aggressively trying to deny being at the party because he may not remember it. It’s not because he may have blacked out but more likely that night was similar to so many. This is also the exact reason he would not ask for an FBI investigation. Because he knows in the back of his mind that he pursued girls with zeal in those days and that he drank excessively. He knows there is a possibility that something could have happened, and he just doesn’t remember it because it wasn’t out of the ordinary. Imagine how scary that must feel. What looks like rage during his testimony might have been more like a desperate attempt to hide the fear of not knowing for sure if you are innocent. The more afraid one is the more belligerent he appears. It’s unclear what kind of investigation will occur in the next week with the FBI. It’s also unclear if this incident, whether shown to be true or not, will have an impact on Kavanaugh’s nomination. But what is 100% crystal clear is that this hearing has had an enormous impact on millions of women. One can only hope the same impact will be felt by millions of men as well and in 36 years from now so much of our culture will have changed. Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
