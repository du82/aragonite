title = "A Conference, Powerful Words & Silencing Your Inner Critic - The Family Coach"
description = "Going to conferences always brings out my deeply hidden insecurities. On any typical day I am a fairly confident person. I work hard. I try to be nice to people. Life is generally good. But in the weeks leading up to any conference I’m a little shaky. I start obsessing about clothing (which I never […]"
full_description = "A Conference, Powerful Words & Silencing Your Inner Critic by admin | May 8, 2018 | Blog Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Going to conferences always brings out my deeply hidden insecurities. On any typical day I am a fairly confident person. I work hard. I try to be nice to people. Life is generally good. But in the weeks leading up to any conference I’m a little shaky. I start obsessing about clothing (which I never do). I worry about meaningless stuff. My head gets the best of me. Leading up to Mom 2.0 my mental firestorm always goes on overload. There are a few reasons why. To start with I really respect the people who attend. I read their words and listen to their podcasts and marvel at their Instagram feeds. I just sink into thinking, I’m unworthy. Oh course I’m worthy. We all are. But that doesn’t stop my inner critic from spewing belittling thoughts late at night. The second and equally plaguing problem heading into Mom 2.0 is I really care about promoting my book. It took 20 years to learn enough to write it, and it’s my book baby. I want to tell everyone about it. But that’s the problem. It’s really hard to tell people about your book. It’s awkward. I’m awkward. Lastly, there is always a time when it feels like everyone else has someone to go to the _______ (fill in the blank big event) and I don’t. Sure, I could ask to join someone. But that sometimes feels like offering to feed the bears. It could go really well or you could get mauled. Still, excitedly, I drove to the conference, held this year in the lovely Langham Pasadena (thanks for the pens). The conference didn’t disappoint. I called my husband a few times, and he would say I was giddy. I met incredibly nice and interesting people. I presented on a panel with women I didn’t know, and it all worked perfectly. I went in determined to push myself out of my comfort zone, and I did. But the problem with leaving the comfort zone is that it’s uncomfortable there. So when I went home and started thinking about all I said and did. I became mortified. I obsessed just like I did before the conference but this time I had actual experiences to harp on. Like the time I horrendously whipped out my book to give to a person I admire. Ugh, sorry. Or the time I tried to tell someone their Dove hair looked great but my compliment came off all wrong. Sorry, again. I could go on and on. I somehow was turning a great experience into middle school. Before I sunk too deep into my breakdown, I flipped through my little notebook and remembered my two biggest takeaways from the conference. I replayed Brené Brown’s inspiring words: Talk to yourself like you talk to someone you love. I would never talk to someone the way my mind was talking to me. The other advice that really hit home was from Katherine Wintsch. In her Slay Like A Mother presentation she told us to stay in the present, “right here, right now.” And just like Brené Brown she told us to acknowledge the voice and then direct it to a friend. If my friend told me all the crap I was telling myself, here’s what I would say: You are being ridiculous. Even if you embarrassed yourself, who cares. If you feel so badly asking for someone to help you out then offer to help someone else. Give yourself a break. All of the sudden I became the friend I needed. I started to return to my conference high shedding that awful critic. I incorporated what I just learned. And that’s what conferences are all about. It’s growth in ways you didn’t even know you needed. Being a working mother these days is often about finding your inner voice and silencing the real or imagined chatter. I am so thankful to be able to have these learning experiences. Professionally, I prioritized my work and found the direction I needed. Personally, I picked up a new tool to fight my worst inner voice and a way to be a better me. Thank you Mom 2.0 for all of this. … On a side note: What makes me feel better about asking for help is also giving it. Here is what I have to share. If you are interested, message me on Facebook @thefamilycoach or send me an email here. 1-page book review request sheet Sample successful pitch letters My book proposal for a nonfiction book Ask me to do a book review for your book baby Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
