full_description = "Promiscuous Neighbors and Occasional Formula Feeding for 05/05/2018 by admin | May 5, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Promiscuous Neighbors and Occasional Formula Feeding for 05/05/2018 Dear Family Coach Dear Family Coach: My next-door neighbor is a single mom who works long hours. Her 13- and 15-year-old daughters are often alone. They are good kids. But I see random boys coming and going a lot, and I’m worried the girls are making bad choices. I’d like to tell the mom she needs to work less so she doesn’t leave them alone as much. How can I say this gently? – Concerned Neighbor Dear Neighbor: I have to assume this mom is working long hours because she has no other choice. She might not be getting child support from the children’s father. She may have medical bills or extensive debt that must be paid. It doesn’t really matter. The point is that Mom is working her tail off and raising two girls on her own. Updated: Sat May 05, 2018 Promiscuous Neighbors and Occasional Formula Feeding for 05/05/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
