title = "Kids, Here's the Truth and I'm Sorry - The Family Coach"
full_description = "Kids, Here’s the Truth and I’m Sorry by admin | Oct 28, 2018 | Blog, Uncategorized Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share Dear Kids, I’m writing to you because you are old enough to know the truth. Actually, you aren’t. You are innocent children who deserve a childhood without fears and nightmares. But the truth is unavoidable, and at this moment there is nothing else I can say. So here it is. I cannot protect you from a gunman. Not at preschool. Not at a concert. Not even in temple. There is no amount of guns that can make you safe because those same guns will always find a way into the wrong hands. If someone wants to kill you while you are peacefully playing tag in the playground, I cannot help you. If you are having fun at a concert with your friends or enjoying the latest movie in the theater, I cannot protect you. You could get shot, and you might die. My beautiful daughter, I can almost guarantee you will experience lots and lots of sexual harassment. You will have unwanted attention from strangers who will look at your body and sexualize it. You will probably have a boss who will discriminate against you because you are a female or while you are pregnant or after the birth of your beloved child. You may even be raped by a stranger, or worse, someone you know. And if you choose to speak up you may not be believed. You may lose everything in the process. There are people in powerful positions who will work to silence your voice. Even if you present the most compelling evidence and you are believed, sometimes nothing will change. Because lots of people don’t care. I’d like to tell you that you get to make decisions about what happens to and in your body, but I can’t. The right to an abortion is a fragile one, and there’s a chance you may lose that right. Even if your life is at risk, you may not be able to have life-saving surgery because some will value your fetus more than you. Don’t think you can rely on contraception to avoid an unwanted pregnancy because that right may go away too. Depending on where you live or where you work you may not have access to an IUD or the pill. And you may not always have enough money for condoms. This makes me terribly sad, and I’m sorry. My science-loving boy, I’d like to tell you that science and data matter. That people rely on high-quality research conducted by respected institutions around the world to make decisions about our planet. But that’s not always true. There are many people who look at widely accepted beliefs about climate change and deny the existence of overwhelming data. Some people will govern with the narrow focus of getting themselves reelected. They make the rules that we all have to live by. Your grandchildren may not have any water to drink or a dry place to build a house. I know it’s scary but that is already happening to many. You have the right to vote and voting matters. You still have this right, but some will make it difficult to actually cast your ballot. People will change the rules at the last minute to favor their political party. They will try to minimize dissenting voices by making it difficult to vote by asking for identification or limiting voting hours or moving polling locations without notice. People will say every vote counts but sometimes it doesn’t. The popular vote can go to one candidate but an antiquated system will have the electoral college pick a different winner. In these horrible times I wake up nearly every day with astonishing disappointment and pain. So it’s really hard to continue to pretend that these terrible things won’t happen here. I cannot look into your beautiful innocent eyes and say, “It can’t happen to you.” It can. It happened to school kids just like you in Miami and Newtown and Columbine. It happened in the supermarket in Kentucky and in a temple in Pittsburgh. It happened to a professor, just like me. The congressman in our district doesn’t believe in climate change. It’s all around you, and I can’t lie to you. But in all of this painful uncertainty, there are some truths that might help you. I will speak up to do my best to protect you. I’ll do this by fighting the school district or suing my employer for discrimination or by writing about injustice. Speaking up may not always change things but it will show people that I care and support them. That’s not nothing. If I see something that is hurting someone, I’ll say something. If I can right a wrong, I’ll do it. It will not always be easy. But that’s usually when it’s most important. I will do this for you and you must do it for others. I will vote until my last breath. I still believe change can come. People sacrificed in significant ways to give us the right to vote. I’ll do what I can to protect that vote, and I’ll exercise my right in every single election. I will create a home where everyone is welcome to Sunday dinner or Passover regardless of faith or race or sexuality. I’ll make Christmas dinner for our Christian friends or Iftar for the Muslim ones. Why? Because our lives are made better by people who are not exactly like us. I’ll teach you to be open-minded and have an open heart. I’ll be kind and generous whenever I can and sometimes when I think I can’t. I’ll show you that you can make a change in this world even if it’s just to one person. To that person, that might be the difference between life and death. I will try to live my life to the fullest because bad things can happen. I can’t prevent a lot of the bad things I mentioned. But they are less painful when we live our truest best life. Go out and live your lives and enjoy it. We owe that to the people who have been lost. I love you. I pray that’s enough to comfort you. Love, Mom Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
