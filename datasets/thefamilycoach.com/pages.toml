title = "Toy Reviews Archives - The Family Coach"
full_description = "Fiery BattleBots Fight in a Bulletproof Cage, It’s The Ultimate Family Show by admin | May 17, 2018 | Blog, Toy Reviews BattleBots is one of the best family shows on television. After a year hiatus, thankfully Discovery Networks (Discovery and Science Channel) decided to revive the show. BattleBots like a mashup of mixed martial arts and a monster truck battle. Two remote controlled robots are put into a bulletproof cage and let loose on each other until one bot dies. There are fireworks and head on collisions, loose wheels flying, flame throwers and screaming and laughter and … I could go on and on. We were invited to be guests at live taping of the show in Long Beach, California. I went into the old airplane hanger happy to escort my 11-year-old robotics-obsessed son to the event. I had no illusion that I, too, would have a blast. I was so wrong. It was one of the most entertaining events I’ve been to with or without my kids. Now we are excited to see how the season plays out. Who will battle who? What damage will be inflicted? What crazy antics will we see? We can’t wait. There is so much I loved about BattleBots. Old people compete against young people. Men versus women. Kids and families against large BattleBot crews. Some have competed for years. Others are newbies in their first battle ever. There was a 15-year-old girl sitting in front of me with a giant pink bow in her hair. She was as enthralled in the action as my son. And what’s cool is that on a basic level BattleBots are just good entertainment. But the show also highlights how physics, engineering and robotics all play a vital role in the design of these massive 250 pound machines. The Sharkoprion team The names of the bots are inspiring. Some favorites are Sharkoprion, Huge (with the best tag line: We’re Kind of a Big Deal), Ultimo Destructo, Petunia, Minotaur and Kraken. We were lucky enough to sit next to Peter Lombardo from the Huge team. My son spent three hours picking Peter’s brain about robotics and building. And to his credit, Peter patiently and enthusiastically responded to each and every question. It was like they live in this universe were science is the coolest thing there is, and it was so awesome to witness. You can catch Battlebots on both the Discovery and Science channels. Season 3 began on May 11 so check it out to see which bot survives until the end. The show airs at 8 pm. Here’s everything you need to know about #BattleBots before tonight’s @ScienceChannel premiere. pic.twitter.com/ikhAyMxuMQ – Science Channel (@ScienceChannel) May 16, 2018 My son Emmett’s review for your kids: Battlebots is a TV show where groups of people make big robots. They use different blades and weapons to try to make the other robot immobile. They are in this big square ring with hammers and blockers on the sides. You try to drive around and hit the opponents with a weapon. You win if your opponent stops moving and becomes stuck. Anyone can do it, and you can build what you want. There are so many different things that can happen. It’s fun seeing what different tools each robot has. It’s just a fun environment. It was so cool to see the inside of every robot. In real life they are actually big, not as tiny as I thought. It’s always unpredictable and crazy seeing each bot that someone works so hard on gets blown up. No one cares. It’s just fun to compete. It was amazing to see how someone can completely destroy the opponent, rip them apart or melt them. It’s just really entertaining."
year_published = 2018
