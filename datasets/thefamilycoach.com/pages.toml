description = "A Sunday Sleepover and Conflicting Stories for 04/21/2018 Dear Family Coach Dear Family Coach: My 14-year-old daughter was invited to a birthday pool party at a local resort. It’s being held on a Sunday night. The girls are expected to sleep over and miss school on Monday. I told my daughter she could attend the […]"
full_description = "A Sunday Sleepover and Conflicting Stories for 04/21/2018 by admin | Apr 21, 2018 | Dear Family Coach Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share A Sunday Sleepover and Conflicting Stories for 04/21/2018 Dear Family Coach Dear Family Coach: My 14-year-old daughter was invited to a birthday pool party at a local resort. It’s being held on a Sunday night. The girls are expected to sleep over and miss school on Monday. I told my daughter she could attend the party but I would be picking her up at 10:30 p.m. Of course, she threw a fit. Am I being unreasonable? – Party Pooper Dear Pooper: First things first, who throws a sleepover party for ninth-graders on a school night? Sleepovers are some of my best childhood memories – up all night, all the chatter with the lights off, the late-night snacks, the secrets. It’s a special time. And I don’t necessarily disagree with kids missing school here and there for fun events. Life is short. But missing school to attend a birthday party doesn’t quite meet the bar. Updated: Sat Apr 21, 2018 A Sunday Sleepover and Conflicting Stories for 04/21/2018 Share on Facebook Share Share on TwitterTweet Share on Pinterest Share Share on LinkedIn Share"
