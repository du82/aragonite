["https://thefoa.org/FOAprivacy.html"]
title = "FOA Privacy Policy"
full_description = 'FOA Privacy Policy The Fiber Optic Association Inc. (also referred to as “FOA,” “us,” “our,” or "we") has this privacy policy to demonstrate our protection of your privacy and personal information. The following discloses our information gathering and dissemination practices. Unless the context indicates otherwise, the terms “you” and “your” refer to both you individually and any entity on whose behalf you are accessing our website. This privacy policy applies to information we collect: On this and other FOA websites (e.g. foa.org, thefoa.org, fiberu.org, foaguide.org); In email, text, other electronic messages or by telephone or other communications with us Data you are required to provide when applying for or renewing FOA certifications Data you are required to provide when applying for or renewing FOA corporate membership Data you are required to provide when applying for online testing provided by a third-party for Fiber U Certificate of Completion or FOA Certification exams If you have questions or concerns regarding this policy, we welcome you to contact us at: info@foa.org 1. Acknowledgement of this Privacy Statement Your use of any of our websites and email or other communications signifies that you have read and understand all of the terms of this privacy policy. 2. Personal Information You Provide Voluntarily We collect personal information from those applying for FOA certification or renewing certifications that include, but is not limited to, name, telephone number, email address, employer, professional title, home or business and mailing address, details regarding your entity and business, your job title, company contacts for corporate members, photographs, and education. The personal information you are asked to provide (including whether its provision is mandatory or not) is needed so that we may facilitate your access, purchase, use and/or participation in our service offerings, such as: Certificates of completion for Fiber U educational programs Online forums Certification/accreditation activities including online testing Products (e.g. textbooks) for sale Any other services and products that are updates or extensions to our services or relate to other benefits'
