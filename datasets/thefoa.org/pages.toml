["https://thefoa.org/workforce/index.html"]
title = "Fiber Optic Workforce Development For Fiber Broadband"
description = "FOA Guide To Fiber Optic Workforce Development For Fiber Broadband"
full_description = '''FOA has been working with the US Department of Labor (DoL) Bureau of Labor Statistics (BLS) for about 20 years to define the jobs of fiber optic technicians. When fiber optics was first added by the BLS, fiber optic techs were placed in a category of "electrical linemen," an age old category for workers who install cables. This year, in part due to the federal focus on broadband, FOA was contacted by a BLS analyst who said there was interest in creating a new category. FOA worked with BLS for months drafting new job descriptions, brought in some contacts from the Communications Workers of America (CWA), suggested adding wireless techs who were also buried elsewhere in the BLS job definitions to create a new category at BLS for "Telecommunications Technicians." The FOA's charter is to "promote professionalism in fiber optics through education, certification and standards." Below are some of the resources we provide free to everyone interested in fiber optics.'''
