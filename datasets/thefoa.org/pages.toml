full_description = "I work with all levels of management at enterprise as well as contractor customers and a badge from the FOA would be a valuable addition to their knowledge base as well as resume. Recruiters and company HR would be able to use this certification as a search parameter to find the right person for positions requiring fiber optic knowledge. We support your idea and understand the commercial and online presence benefit in growing our community. FOA's reputation in certifying 100,000 techs who build fiber optic networks lends instant credibility and acceptance to this Badge for all the other contributors to fiber optics. Candidates must have experience working in fiber optics. Candidates must then pass the FOA Badge In Fiber Optics test. To prepare for the test, it is recommended you take the free FOA Badge In Fiber Optics self-study course, or have completed the Fiber U Basic Fiber Optics course in the recent past. At the end of the self-study program, take the online test for the Badge."
