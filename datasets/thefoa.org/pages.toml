["https://thefoa.org/jobs/jobs.html"]
title = "FOA Guide To Jobs in Fiber Optics"
full_description = "When you begin your job search, you will have to “cast a wide net” and look at all the possible avenues. If you have not used the web to locate a job, you will have to take a “crash course” on navigating job boards and job search engines – be sure to review section 6 below. Make lists of everything you're going to do to job search. It will help you start the process and you’ll feel more confident with a plan. One of the most difficult challenges of finding a job is how to distinguish yourself from all the other people who are applying for the same job. Here are some tips: Make a list of all your business acquaintances, friends and relatives – is there anyone who could help you find a job? A personal contact is one of the most important advantages you could have in your job search. This could be a written recommendation from your contact or a phone call to someone in the company who might put in a good word for you. You should also look at your list of contacts to see if anyone can help you research job opportunities. Basically, you should sit down with this person and interview them. Who do they know, what do they know? You could get a name of someone else and start “networking” with more “interviews”. Here is a basic truth about human nature: most people are flattered when ask for advice and are happy to help. Be sure you clarify that you are only looking for advice – no special favors. This puts the person at ease and helps them open up in your discussions. You will be surprised how much you can learn. Also, review section 7 below on how to use LinkedIn to find contacts who can help in your job search. Join local “service” organizations such as Rotary where you can network with other business people. The local Chamber of Commerce might have a job posting site. Local electrical contractors, especially the larger companies. Most will be doing cabling, Cat 5 etc. but they might be doing fiber jobs also. If you don’t know who they are – do an online search for “cabling contractors” in your area. Get on their websites to see if they are doing low voltage, fiber work."
author = "Jim Hayes"
year_published = 2025
