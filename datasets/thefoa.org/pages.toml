["https://thefoa.org/foanl-12-24.html"]
title = "FOA Newsletter"
description = "Fiber broadband, fiber optics, fiberoptics, data centers, installation"
full_description = '''Speaking at the Goldman Sachs Communacopia + Technology Conference, AT&T’s CEO John Stankey said, “There’s a fallacy to say there’s fixed networks and wireless networks. There are only fiber networks with different access technologies on the end of them. That’s where this is all going.” The FOA has almost 1,000 pages of technical information on the FOA Guide, 100+ videos and two dozen online courses at Fiber U, all this can make it difficult to find the right information. Cross Reference To FOA Tech Materials To help this, we have created a cross reference guide to the textbooks, Online Guide and Fiber U courses, all the FOA technical information. Besides the textbooks, online Guide and Fiber U, each section of the Guide also includes links to the 100+ FOA videos available. Cross Reference Guide to Textbooks, Online Guide and Fiber U In the October FOA Newsletter we ran a long illustrated feature article offering guidelines for aerial cable plant installation, illustrated by some "excellent" bad examples. That article elicited quite a few comments, especially from the instructors at some of our FOA schools around the world, and led to some discussions with others in our field, including manufacturers. Several topics seem to warrant further discussion, so we thought it would be interesting to share some of our notes and encourage more inputs before we cover the topics in detail in future issues of the newsletter. Here are some of the topics of the comments. Some, we promise, are controversial! Feel free to comment. Aerial Cable Plant There is a lot there, isn't there? It provides us lots of topics for investigation and future articles. Should all cables be made like microcables? Should all cables above a certain number of fibers be flexible ribbons? Should all aerial cables be ADSS? Who makes the "best" fusion splicer or other tools? None of these questions have "black or white" answers, but all merit discussion. Marking cables at patch panels or equipment is important for making proper connections and keeping documentation up to date. Most techniques for identification use color codes or printed labels. A Canadian company has another idea, adding a NFC (near field communication) chip to the cable and also providing color codes.'''
