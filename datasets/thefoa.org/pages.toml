["http://www.thefoa.org/Ted"]
title = "Uncle Ted's Guide To Communications Cabling"
full_description = '''Uncle Ted's Guide To Communications Cabling Home Who's Uncle Ted? Jargon Overview of Structured Cabling Cables Terminations Installation Testing Wrapup, Training Programs and Equipment Click here for the printable PDF version (1.2 meg file) Uncle Ted was the mascot of Cable U's wiring training programs, focusing on Cat 3/5/5e/6 UTP cabling. He's Lennie Lightwave's Uncle and the expert on premises wiring. Uncle Ted's Guide is an overview of what you need to know to get started in installing premises cabling, voice/data/video (VDV) cabling, low voltage or communications wiring, structured cabling or whatever you call it. (Turns out the terminology is not standard, perhaps the only thing that isn't! ) After reading Uncle Ted's Guide, you might be interested in our textbooks, The FOA Reference Guide to Premises Cabling and the FOA Reference Guide with its section on Premises Cabling. Also, check out FOA's free online training site Fiber U where there is a free online self-study program on premises cabling as well as many other topics on cabling. Now you can get a cabling/wiring self-study program from The FOA at Fiber U that starts with "Uncle Ted" and or take training from an FOA approved school for the FOA CPCT Certification (Certified Premises Cabling Technician) that includes hands-on training. This simple web site will hopefully get you started. If you want some real hands-on training, FOA can send you to trainers who give classes around the world or will come to your site. We're always creating new training material, links to information and cabling vendors to help you find what you need to know about cable installation, so keep checking back with the FOA websites. Want a printed version of Uncle Ted? Click here for the PDF version (2.1 meg file). Uncle Ted's Guide is also available as a free eBook on iTunes. If you like "Uncle Ted's Guide" you'll love "Lennie Lightwave's Guide To Fiber Optics!" What do people say about "Uncle Ted's Guide"? "Uncle Ted's Guide to VDV (voice/data/video) Cabling" is a brilliant presentation of the standards and how everything fits together. (Don't be fooled by the title.) Be sure to click on the Jargon link for a comprehensive rundown. From TechRepublic, the IT website, discussing certification. Contact us FOA Tel 1-760-451-3655 Fax 1-781-207-2421 email: info @ foa.org web: www.foa.org Next (C) 2019 The Fiber Optic Association, Inc., all rights reserved.'''
