["https://thefoa.org/user/index.html"]
title = """
Users Guide To Fiber Optic System Design and Installation - The Fiber  Optic Association"""
full_description = "The Internet is 100% fiber optics. On land and under the oceans, fiber optic cables are connecting users to data centers around the world on fiber. Even inside the data centers, communications is virtually all on fiber. Where wireless is used is for mobile devices connected on WiFi or cellular systems. Both generally depend on fiber backbones for connectivity since wireless is not wireless except in the final connection from antenna to the user's device. Whatever you want to know about fiber, you can probably find it on The FOA Online Reference Guide To Fiber Optics 3. Checklist For Users Of Fiber Optic Communications Products This is intended as an overview and installation checklist for all managers and engineers on the overall process of designing, installing and operating a fiber optic communications system. Fiber optics offers major advantages for communications systems including security, distance and bandwidth. Proper application of fiber optic technology will lead to highly reliable systems. But the user must choose the proper products, design and install an appropriate cable plant, and make sure components are tested, all following appropriate industry standards. This guide is designed to provide the information necessary to ensure proper installation and usage of fiber optic systems. As references, we will use: While this document is primarily focused on the design, installation and maintenance of fiber optic cable plants, most end users will be interested in costs, so the FOA has a separate document on estimation. (Download the comprehensive FOA Tech Bulletin on Designing Fiber Optic Networks. PDF 1.3 MB) or get a copy of the The FOA Reference Guide To Fiber Optic Network Design 3.1.1. Select a communications system, link, module or converter that fits the data format you plan to transmit. The first step is to choose the type of system needed. Fiber optic communications products exist for almost every type of communications system, from high speed telephone and CATV systems to simple low speed RS-232 or relay closure links. Many are media converters from standard electrical interfaces like Ethernet that have various options on data rates. Some are proprietary links for specialty equipment used for utility monitoring, industrial control, video surveillance, etc."
