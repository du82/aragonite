full_description = "Lay the cable, (direct burial or aerial), splicing (or pigtails) testing, troubleshooting, restoration while aloft on tower, pole, ladder buckets or working in trenches or manholes Use fiber optic links as part of the latest communications technology to provide solutions to traffic management issues. Electrical utilities take advantage of fiber's immunity to noise. fiber optic sensors allow monitoring high voltage and current in their distribution systems. Installation, troubleshooting, repair, and restoration of communications cables and related electronic equipment in both indoor and outdoor environments. Must be a licensed electrical contractor when working with high voltage transmission, switching & control circuits Every solar and wind system depends on fiber. Short lengths, singlemode, high speed data transfer and electrical isolation, harsh environmental conditions bringing high-speed networking, digital television and telephone service to residences using fiber optics The military uses fiber everywhere, on bases � setting up a FO networks on a base or a battlefield because it's hard to damage, tap or jam. Training on the electronic equipment that connects to the network must be provided by the manufacturer of the equipment Use FO to control factory control systems, factory robots � good for harsh environments, safety/no sparking, ground isolation, noise immunity For contractors, installers, architects and engineers, project managers and all others who are involved with projects that include fiber optics. It is tethered to a ship with an umbilical cable that uses fiber optics to carry video and data signals between the ROV and the ship."
