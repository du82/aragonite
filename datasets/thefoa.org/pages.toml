["https://thefoa.org/FOArgfiberbroadband.html"]
title = "FOA  Guide To Fiber Broadband"
description = "How Fiber Optics Revolutionized Communications And Made Broadband Possible"
full_description = "Available direct from Amazon.com, local booksellers and other distributors Available soon as an eBook on the Amazon Kindle In less than half a century, fiber optics has revolutionized communications and to a large extent, society in general. Broadband, what many today call high speed Internet access, has become a necessity for everyone, not a luxury. The technology that makes broadband possible is fiber optics, connecting the continents, cities, and just about everybody. Even fiber to the home (FTTH) brings broadband to hundreds of millions worldwide. How did we get from an era when communications was making a telephone call or sending a telegram to today�s world where every piece of information � and misinformation � is available at the click of a mouse or touch on a screen? How did we get from a time when a phone was connected on copper wires to being able to connect practically anywhere on a handheld device with more computing power than was available to scientists and engineers only decades ago? How does broadband work? Without fiber optics it would not work. This book will try to explain not only fiber broadband it works, but how it was developed. It is perhaps as much a history book as a textbook. It is intended to be an introduction to communications technology appropriate for a communications course in junior high, high school or college or for anyone who just wonders how all this stuff works. About The Author Jim Hayes has been involved in the fiber optic industry since the late 1970s as an entrepreneur, educator and author. He is President and a co-founder of the Fiber Optic Association, the international professional association for fiber optics. He is involved in creating the FOA knowledge base and training programs at FOA. He has written 10 books and hundreds of articles about fiber optics. About the Author Jim Hayes, current FOA President, has over 30 years experience in the fiber optic communications industry as an technologist, entrepreneur and trainer. He is a co-founder of the FOA, author of several textbooks on fiber optics and a columnist for several trade magazines."
year_published = 2025
