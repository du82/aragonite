["https://thefoa.org"]
title = "Home -The Fiber Optic Association"
description = "Fiber broadband, FTTH, fiber to the home,, data centers, fiberoptics, fiber optics"
full_description = '''The March FOA Newsletter begins with an article about cleaning connectors, including some myths and malpractice, followed by the proper ways to clean them. In the News section, announcements of an end of an era in the Internet, the future of fiber in a time of uncertainty in grants and applications. In the Technical Section, links to a new TIA document on networks' cabling requirements, a problem with MPO array connectors, and a new fiber stripper that uses heat to make stripping easier. Introducing The "FOA Badge In Fiber Optics" for professionals working in fiber optics FOA is best known as the certifying body for the nearly 100,000 FOA-certified fiber optic technicians who build worldwide networks. FOA has been asked many times about recognition for other professionals in fiber optics. FOA now offers the FOA Badge in Fiber Optics, which recognizes professionals working in all areas of fiber optics; management, manufacturing, marketing/sales/distribution as well as managers/planners/supervisors for networks. New Edition Available FOA has published a new edition of our textbook on basic fiber optics, used in training for the CFOT certification. The latest version of the FOA Reference Guide To Fiber Optics is different enough we call it a new edition. Many of the updates are for new technologies which are reshaping the fiber optic industry like coherent transmission, BI fibers, etc. We've also added a section on the fiber optic workforce which has much relevance because this book is used to train those entering the workforce. We've also worked on making the book more readable, adding formatting that eases reading and a new comprehensive index. Inflation was an issue, but the price only goes up $2 to $29.95 for the paperback and $12.95 for the Kindle version. Available on Amazon and your local bookseller. FOA is a very international organization and it works hard to accommodate the language needs of everyone. We have been translating our books and website into the languages most requested and we added more textbook translations.'''
year_published = 2025
