["https://thefoa.org/foanewsletter.html"]
title = "FOA Newsletter"
description = "Fiber broadband, fiber optics, fiberoptics, data centers, installation"
full_description = "For 50 years the Optical Fiber Communications Conference and Exhibition (OFC) has showcased the emerging technologies of researchers and industry for the optical networking and communications community. Throughout the years, OFC has been the conference to communicate and share the technical advances in fiber optics. Come celebrate 50 years of optical networking and communications achievements that the OFC community has facilitated to connect individuals and businesses across geographic and oceanic boundaries. Speaking at the Goldman Sachs Communacopia + Technology Conference, AT&T’s CEO John Stankey said, “There’s a fallacy to say there’s fixed networks and wireless networks. There are only fiber networks with different access technologies on the end of them. That’s where this is all going.” The FOA has almost 1,000 pages of technical information on the FOA Guide, 100+ videos and two dozen online courses at Fiber U, all this can make it difficult to find the right information. Cross Reference To FOA Tech Materials To help this, we have created a cross reference guide to the textbooks, Online Guide and Fiber U courses, all the FOA technical information. Besides the textbooks, online Guide and Fiber U, each section of the Guide also includes links to the 100+ FOA videos available. Cross Reference Guide to Textbooks, Online Guide and Fiber U At the latest TIA meetings a presentation pointed out a problem with MPO array connector connection mismatches. MPOs standards have created a complicated connection situation, now already around 40 pages, fully taking up half of the TIA-568 fiber standards. The problems are caused by the options of connecting 12, 16 or more fibers in a row to duplex or multifiber transceivers. MPOs are now being used for singlemode fiber, requiring angled (APC) ferrules to reduce reflectance at connections. Multimode is now using angled ferrules for some applications also to reduce reflectance. The problem arises because the standards allow two options for angles, up or down in relation to the connector key."
year_published = 2025
