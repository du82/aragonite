["https://thefoa.org/Certs.htm"]
title = "Understanding The Fiber Optic Association Certifications"
full_description = "FOA Reference Books (Available Printed or eBooks) The fiber book is available in Spanish and French as well as English. It's now CFOT® The FOA CFOT® (Certified Fiber Optic Technician) is now a registered trademark. With so many fiber optic techs holding CFOTs and the CFOT being recognized worldwide as the foremost certification in fiber optics, the FOA realized the value of the CFOT required trademark protection. The FOA is a member of ANSI (the American National Standards Institute). FOA certifications generally follow to the international standard for certification bodies, ANSI/ISO/IEC 17024 Conformity assessment — General requirements for bodies operating certification of persons. Certification is not a substitute for experience. A FOA certifications ensure the person has an industry-accepted level of knowledge, skills and abilities as measured by the certification, but the certificant is expected to improve those skills with on-the-job training. Those hiring fiber optic technicians should include other criteria as well as certifications when evaluating personnel, including references, experience and other related training and experience. Premises cabling for LANs, DAS, security, building management systems, etc. covering copper, fiber and wireless Comprehensive training on fiber to the home applications including standards, network architecture, design, installation and test Overview of fiber optic LAN designs using structured cabling and passive optical network architectures Design and implementation of data centers from small to mega- focused in larger data centers and upgrades to higher speeds How Does the FOA Program Relate to Other Associations? We are often asked how we relate to other organizations like contractor associations, professional societies and other organizations involved in fiber optic communications and related areas. FOA is a technology-based professional association, focused on the technology which is used in many diverse applications represented by many other organizations. We feel we complement each other quite nicely. In fact many organizations recognize and use our certifications and we work with others to help develop theirs with respect to our specialties."
