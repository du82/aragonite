["http://www.thefoa.org/Lennie"]
title = "Lennie Lightwave's Guide To Fiber Optics - Home"
full_description = '''' Contents Home Jargon Basics Fiber Cable Terminations Networks Estimating Test Training Glossary Want a printed version of "Lennie"? Here is a PDF file to print. (PDF 3.3 MB). Want a eBook version of Lennie? It's available free on iTunes. Fiber U offers free online training from the FOA Become Certified in fiber optics! Contact The FOA Today It's easy to learn more about fiber optics! All you have to do is start with Lennie Lightwave's Guide To Fiber Optics and then head to Fiber U for free online self-study courses provided by the FOA or take a hands-on course from one of the FOA Approved Schools. Lennie Lightwave has been involved in fiber optics since he first went to "Fiber U" - the Fotec fiber optic installer conference way back in 1993. Lennie is now working with The Fiber Optic Association (FOA), the international professional association of fiber optics, to help train today's new fiber optic technicians. Lennie's Guide is the result of more than 30 years of experience in fiber optics from Lennie and his friends, including training tens of thousands of techs to help them get started in fiber optics. It's intended to be a place to start, a basic guide that will teach you the jargon and basics of fiber technology and practices. When you are finished with Lennie's Guide, you might want to get one of the FOA textbooks, The FOA Reference Guide to Fiber Optics, The FOA Reference Guide to Outside Plant Fiber Optics, FOA Reference Guide to Premises Cabling or the FOA Reference Guide To Fiber Optic Network Design. "Fiber U" offers free online training from the FOA. Courses are available in more than a dozen topics, starting with the basics of fiber optics and including many technician skills and fiber applications. Take a course at Fiber U and get a certificate of completion for your course, all online. If you have experience in fiber optics or take a hands-on course at one of the FOA Approved Schools, you can also get certified as a fiber optic tech from The Fiber Optic Association. Want to know more about premises cabling? Lennie's Uncle Ted is the expert on structured cabling, including copper cabling, fiber optics and wireless. Here's Uncle Ted's online Guide to Communications Cabling. Want a printed version of "Lennie"? Here is a PDF file to print. (PDF 3.3 MB). Want a eBook version of Lennie? It's available free on iTunes. Want A Printed Copy Of Lennie's Guide? A printed 25th Anniversary Edition of Lennie Lightwave's Guide in full color is available from Amazon. 25th Anniversary Edition of Lennie Lightwave's Guide Who's Lennie? Lennie Lightwave was the cartoon mascot created for the original Fiber U training conference in 1993. Lennie has been called the most famous guy in fiber optics. The first Lennie Lightwave's Guide to Fiber Optics was published 20 years ago as a simple, easy to understand introduction to fiber optics and more than 60,000 copies were given away. The web version of Lennie Lightwave's Guide to Fiber Optics was one of the first commercial web pages ever and introduced many people to fiber optic technology. Now Lennie's Guide and Uncle Ted's Guide to Communications Cabling, the premises cabling equivalent, are still two of the most popular sites for getting started in the fiber optics and premises cabling business. What Do People Say About "Lennie"? "I am a 30 year veteran of the "Bell System" with many years of experience with design of OSP Systems and also had 15 years as a product Rep. for AT&T/Lucent with responsibility of representing their fiber cable and apparatus products in the Northwest. In all those years I have not seen a better guide that takes the basics of fiber optics and puts it into an easily understandable format ..... that includes the "famous Bell Labs" fiber guru's." DS Selected by the SciLinks program, a service of National Science Teachers Association. Contact us FOA Tel 1-760-451-3655 Fax 1-781-207-2421 email: info @ foa.org web: www.foa.org Lennie and VDV Works Support The Educational Efforts of The Widernet Project From The University of Iowa (C) 2016 The Fiber Optic Association, Inc., all rights reserved.'''
