["http://www.thefoa.org/FOArgND.html"]
title = "FOA Reference Guide to Fiber Optic Network Design"
full_description = '''Available direct from Amazon.com, local booksellers and other distributors Available as an eBook on the Amazon Kindle A new textbook for training or studying for FOA CFOS/D and other certifications, and... An up-to-date reference on fiber optic design for the contractor, installer, designer, project manager, facilities manager and user. The FOA has always tried to provide the world with sources of technically correct, unbiased information on fiber optics using both print and electronic media. The FOA Online Reference Guide on the FOA website is probably the largest and most used reference site on fiber optics on the Internet. The FOA Online Reference Guide provides a readily-accessed reference for FOA certifications for those schools using electronic texts. For those who prefer printed materials, we offer this book, a basic reference for fiber optics and a study guide for FOA certifications. Supplementary materials with even more depth on many subjects, of course, will be on the FOA website. The new FOA book uses state-of-the-art "publish on demand" technology where the book is printed when you order it using the latest printing technology. This new technology is less expensive than conventional publishing plus the cost of inventory is no longer an issue. We can also update the book easily to keep up with new technology, applications, and FOA programs. And using a web ordering and delivery system saves even more costs associated with the overhead and distribution of a conventional publisher. The FOA, a real non-profit organization working for the good of the industry, is passing these savings directly on to you! Companion Curriculum The FOA Reference Guide To Outside Plant Fiber Optics has a companion curriculum available from the FOA for trainers who want an instructor's guide, PowerPoint Slides, Student Lab manuals, etc. Contact FOA for more information. About the Author Jim Hayes, current FOA President, has over 40 years experience in the fiber optic communications industry as an technologist, entrepreneur and trainer. He is a co-founder of the FOA, author of 8 textbooks on fiber optics and cabling and a columnist for several trade magazines.'''
