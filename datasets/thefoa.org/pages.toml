["https://thefoa.org/instructors/class-reqs.htm"]
title = """
The Fiber Optic Association Certification Training Curriculum  Requirements"""
full_description = "FOA certifications are designed to show a progression of growth in knowledge, skills and abilities (we refer to them as KSAs) in fiber optics. The CFOS certifications are specifically designed to allow schools to offer specialized classes for students who have already achieved CFOT status or who want to specialize in FTTx. All FOA-approved schools develop their own curriculum based on FOA certification requirements, KSAs and the reference for each certification, e.g.the FOA textbooks FOA Reference Guide to Fiber Optics, and FOA Reference Guide to Premises Cabling, FOA Reference Guide to Outside Plant Fiber Optics, FOA Reference Guide to OSP Fiber Optic Copnstruction, FOA Reference Guide to Fiber Optic Network Design, FOA Reference Guide to Fiber Optic Testing and the FOA Online Fiber Optic Reference Guide. The FOA offers curriculum for schools at no cost if they do not already have or want to develop their own curriculum. These are hands-on training sessions recommended for introducing students to process involved and developing skills in those processes. While all topics are recommended for CFOT level classes, The FOA recognizes the actual labs included will depend on the focus of the CFOT class. More advanced classes will have more comprehensive hands-on labs. Termination: Multimode, adhesive/polish (A/P), prepolished splice (PPS). Terminate cables, inspect with microscope (polish types) and test. Splicing-Fusion: Single and optionally ribbon fusion splicing, prepare fibers, splice and test with OTDR and compare to splicer estimates. Test-Insertion Loss: Inspect connectors with microscope, check continuity with visual tracer or VFL, test insertion loss using FOTP-171 (single-ended patchcord test) and OFTST-14 (double-ended installed cable test, use more than one reference method (A,B,C) Test-OTDR: Use simulator or OTDR, show setup procedures and how setup affects traces, analyze traces, identify events, find faults, compare operator analysis to autotest."
year_published = 2025
clearnet = "https://thefoa.org/instructors/class-reqs.htm"
