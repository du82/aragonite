full_description = "Derfor kan en karriere innen lager og logistikk være et godt valg Det kan være utfordrende å navigere i et stadig skiftende arbeidsmarked, der noen spår at kunstig intelligens har fjernet mange roller om bare noen få år. Kanskje kan en karriere innen lager og logistikk være et fornuftig valg? En stabil bransje med betydelig vekstpotensiale Rundt om i Norge finnes det utallige små og store lagre. Noen er enkelt innredet med hylleløsninger og reoler, leverandører som HHL Lagerinnredning kan tilby hyllesystemer som passer til alle behov. Andre lager er automatiserte, med høy grad av robotisering og digital drift. Samtidig har disse lagrene en ting til felles: de opererer i en relativt stabil bransje. Helt uavhengig av hva som skjer med for eksempel kunstig intelligens og maskinlæring, vil det alltid være behov for å transportere forskjellige varer. Selv om robotsystemer kan erstatte noen momenter, vil det i overskuelig fremtid alltid være behov for mennesker. Dessuten bidrar netthandel og andre makrodrivere til å øke etterspørselen etter lagertjenester. Transport og løsninger for «last mile»-logistikk På lik linje med hvordan roboter ikke vil ta over lagerdrift med det første, vil det ta lang tid før selvkjørende biler, droner og andre futuristiske konsepter overtar leveringen av pakker hjem til privatpersoner og små bedrifter. Såkalt «last mile»-logistikk handler om hvordan man transporterer noe helt hjem til mottakeren. Giganter som Amazon bruke betydelige ressurser på denne aller siste delen av logistikkjeden, fordi det helt enkelt ikke finnes noe alternativ til mennesker. Derfor vil en jobb som for eksempel budbilsjåfør også kunne være et trygt valg. En slik karriere stiller høye krav til konsentrasjon og fysisk form, samtidig som du i mange roller har en viss grad av frihet. Hvis du liker å kjøre bil eller lastebil, kan ulike sjåførjobber selvfølgelig være midt i blinken. Det er en jobb med mye ansvar, men hos seriøse arbeidsgivere vil du kunne få både gode betingelser og en forutsigbar arbeidsdag. Publisert avtheforeignerjuli 26, 2024juli 26, 2024Publisert iDiverse"
