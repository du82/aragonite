title = "A journey towards sustainable development at WeTransfer"
description = "WeTransfer started scrappy. A Dutch company, born in a small studio that built easy-to-use tools for their internal needs. In 2009, the easiest way to send large files was to put them on a drive and hand them to a courier. Email had (and still has) size limits, and running your own on-prem FTP server is not something that every creative studio is looking to take on. So, a small group from the studio’s IT and design took it on themselves to build a simple way to share large files with their clients; upload a file, and share a link that allowed on-demand downloads."
full_description = '''NOV 22, 2024 A journey towards sustainable development at WeTransfer by Dan Conti A note fromThe Frugal Architect FOREWARD Dan Conti's journey from the constrained world of embedded systems to WeTransfer's cloud architecture is a masterclass in frugal innovation. In his early career, Dan wrestled with MP3 players where 48K of RAM was a luxury. This experience cultivated a deep appreciation for efficiency that would prove crucial at WeTransfer. As CTO, Dan applied this resourceful mindset to cloud computing, where easy scaling often masked hidden waste. His team's efforts to optimize storage, improve observability, and align technology with environmental values showcased that in the cloud, frugality isn't about penny-pinching—it's about squeezing every ounce of value from your architecture while treading lightly on the planet. WeTransfer started scrappy. A Dutch company, born in a small studio that built easy-to-use tools for their internal needs. In 2009, the easiest way to send large files was to put them on a drive and hand them to a courier. Email had (and still has) size limits, and running your own on-prem FTP server is not something that every creative studio is looking to take on. So, a small group from the studio’s IT and design took it on themselves to build a simple way to share large files with their clients; upload a file, and share a link that allowed on-demand downloads. [S01E01] The Frugal Architect Podcast: WeTransfer 0:00 / 0:00 Your browser does not support the audio element. .audio-player { margin: 20px 0; text-align: center; } .custom-audio-player { display: flex; align-items: center; justify-content: center; background: #f9f9f9; border: 1px solid #ddd; border-radius: 16px; padding: 15px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); max-width: 850px; margin: auto; } .audio-details { display: flex; align-items: center; width: 100%; } .play-button { background: transparent; border: none; cursor: pointer; margin-right: 15px; padd