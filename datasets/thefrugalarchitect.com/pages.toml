description = "Our mission at PBS is to educate, inspire, and entertain viewers like you. This north star has guided every decision we&rsquo;ve made, even when it comes to our technology investments. We aren&rsquo;t aiming to be the next Amazon Prime or Netflix – our goal is to provide amazing content and services to the public in the most cost-effective way possible. The solution can&rsquo;t always be &ldquo;let&rsquo;s just launch a bigger instance&rdquo; or &ldquo;let&rsquo;s just add a few read replicas."
full_description = '''DEC 1, 2024 Cost-Aware Architectures for Viewers like You by Mike Norton A note fromThe Frugal Architect FOREWARD In 1969, Mr. Rogers went before the US Senate Commerce Committee to request funds to support the growth of Public Broadcasting. His heartwarming request is often remembered as a pivotal moment in American television history, highlighting the importance of educational programming that serves the public good. Today, that mission endures, and Mike and his team at PBS continue to honor it in their own way -- by stretching every public dollar as far as it can go. In a world where resources are finite but the demand for quality, accessible content is ever-growing, these engineers work behind the scenes to maximize efficiency, leverage innovative technologies, and make every penny count. Our mission at PBS is to educate, inspire, and entertain viewers like you. This north star has guided every decision we’ve made, even when it comes to our technology investments. We aren’t aiming to be the next Amazon Prime or Netflix – our goal is to provide amazing content and services to the public in the most cost-effective way possible. The solution can’t always be “let’s just launch a bigger instance” or “let’s just add a few read replicas.” Sometimes, the answer lies in what we can remove or streamline, rather than what we should add. After all, these are your dollars at work, and it’s something each and every one of us at PBS takes to heart, shaping our approach to problem-solving. [S01E02] The Frugal Architect Podcast: PBS 0:00 / 0:00 Your browser does not support the audio element. .audio-player { margin: 20px 0; text-align: center; } .custom-audio-player { display: flex; align-items: center; justify-content: center; background: #f9f9f9; border: 1px solid #ddd; border-radius: 16px; padding: 15px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); max-width: 850px; margin: auto; } .audio-details { display: flex; align-items: center; width: 100%; } .play-button { background: transparent; border: none; cursor: pointer; margin-right: 15px; padding: 0; outline: none; border-radius: 50%; } .play-button svg { width: 30px; height: 30px; } .track-info { flex-grow: 1; text-align: left; overflow: hidden; position: relative; } .track-title-wrapper { width: 100%; overflow: hidden; position: relative; height: 1.5em; margin-bottom: 20px; } .track-title { font-weight: bold; font-size: 1.0em; white-space: nowrap; overflow: hidden; display: inline-block; } .progress-container { width: 100%; margin: 15px 0; position: relative; } .seek-bar { width: 100%; height: 8px; -webkit-appearance: none; appearance: none; background: linear-gradient(to right, orange 0%, #ddd 0%); border-radius: 5px; outline: none; cursor: pointer; } .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #aaa; border-radius: 50%; cursor: pointer; margin-top: -2px; border: none; } .seek-bar::-moz-range-thumb { width: 20px; height: 20px; background: #aaa; border-radius: 50%; cursor: pointer; border: none; } .time-info { font-size: 0.9em; color: #555; } document.addEventListener("DOMContentLoaded", function () { const uniqueID = "audio_aafc67ddec9d7a65140671d86e894d542cc9f671"; const playPauseButton = document.getElementById("playPauseButton_" + uniqueID); const audioElement = document.getElementById("audioElement_" + uniqueID); const seekBar = document.getElementById("seekBar_" + uniqueID); const currentTimeDisplay = document.getElementById("currentTime_" + uniqueID); const durationDisplay = document.getElementById("duration_" + uniqueID); const trackTitle = playPauseButton.closest('.custom-audio-player').querySelector(".track-title"); const trackTitleWrapper = playPauseButton.closest('.custom-audio-player').querySelector(".track-title-wrapper"); playPauseButton.addEventListener("click", function () { if (audioElement.paused) { audioElement.play(); playPauseButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-pause"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>'; } else { audioElement.pause(); playPauseButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-play"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>'; } }); audioElement.addEventListener("timeupdate", function () { const progress = (audioElement.currentTime / audioElement.duration) * 100 || 0; seekBar.value = progress; seekBar.style.background = `linear-gradient(to right, orange ${progress}%, #ddd ${progress}%)`; currentTimeDisplay.textContent = formatTime(audioElement.currentTime); }); function updateDuration() { if (audioElement.duration && !isNaN(audioElement.duration)) { durationDisplay.textContent = formatTime(audioElement.duration); } else { durationDisplay.textContent = "--:--"; } } ['loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough'].forEach(event => { audioElement.addEventListener(event, updateDuration); }); let durationCheckAttempts = 0; const checkDuration = setInterval(() => { if (audioElement.duration && !isNaN(audioElement.duration)) { updateDuration(); clearInterval(checkDuration); } else if (durationCheckAttempts++ > 10) { clearInterval(checkDuration); } }, 500); audioElement.addEventListener("error", function () { console.error("Error loading audio:", audioElement.error); durationDisplay.textContent = "--:--"; }); seekBar.addEventListener("input", function () { audioElement.currentTime = (seekBar.value / 100) * audioElement.duration; }); function formatTime(seconds) { const minutes = Math.floor(seconds / 60); const secs = Math.floor(seconds % 60); return `${minutes}:${secs < 10 ? "0" : ""}${secs}`; } }); A mindset shift to fireproofing, not firefighting My journey at PBS started back in 2009 when I first joined the organization as a contractor. At the time, my role was tech lead, supporting the team in maintaining and iterating on our existing systems. After a year, I moved on to other projects, but in 2014, the person who had been my boss during that initial stint reached out and asked if I’d be interested in taking on the role of Senior Director of Technical Operations. My primary responsibility was firefighting – ensuring that our systems stayed up and running, and quickly addressing any issues that arose. It was a constant battle, as we struggled to keep pace with the growing demands on our infrastructure. I distinctly remember many late nights, huddled with my team, trying to diagnose and resolve problems before they impacted our viewers. Personally, didn’t get the opportunity to watch many of our shows live because I was busy keeping an eye on our operational metrics and frankly, trying to keep things running so that our viewers could watch the newest content. After a few years of that grind, I made the difficult decision to leave PBS in 2017. I was ready for something different and had been approached about a role at a for-profit company in which I would theoretically have a larger team and more of an ability to affect change. I quickly realized, however, that I had made a mistake. The mission-driven nature of PBS was something I deeply missed, and believe it or not, I missed working within the budgetary constraints of a non-profit. So, I started conversations with my former boss about returning, even though they had already backfilled my original role. He gave me the freedom to think through what I felt was missing in our organization and was hoping to work on. This became the role of Cloud Architect, focusing more on fireproofing our systems rather than just firefighting. The key difference was that instead of just reacting to issues as they came up, I was proactively reworking our infrastructure to be more resilient, scalable, and cost-effective. This represented a significant mindset shift for me, and it also required close collaboration across our engineering, operations, and product teams. Together, we had to ensure our investments aligned with PBS’s mission - delivering exceptional content for viewers like you, while responsibly stewarding our limited resources. Re-architecting for resilience One of the early, recurring challenges we faced was scaling for major events, like the premieres of new documentaries or the start of new seasons for shows like Downton Abbey. These marquee programs would invariably drive massive spikes in traffic to our streaming platforms, and our initial EC2-based architecture struggled to keep up year after year. In many cases, we would experience “thundering herd” scenarios, for example: when a marketing email went out or people saw the “Visit pbs.org/masterpiece to learn more” at the end of an episode. All the while, we were adapting to ever-shifting release models for new content (day of, day after, and entire seasons available on day one). We would find ourselves in frantic “firefighting” mode, rapidly spinning up new servers to handle the load, only to have the traffic subside and leave us with significant unused capacity. This cycle of scaling up and down reactively was both costly and stressful. A perfect example of this was the premier of Ken Burns’ “The Vietnam War”. We knew we’d have increased traffic, but we didn’t anticipate the spikes we were seeing. At the time, Chef and OpsWorks were used to configure and deploy instances to handle the scale, but performance was sluggish. It took us some time to find several bottlenecks in our setup. Part of our confusion was that our monitors showed CPU usage, memory, and network were all nominal, so we couldn’t understand why our systems were behaving the way they were, so we just kept throwing more machines at the problem. It turns out there were arbitrary limitations on things like open file handlers, and the number of processes and threads our runtimes would spin up. Once we discovered and worked through that, we were able to handle more load with fewer instances, and we managed things much better. After the challenges faced during this premiere, where scaling issues led to long nights mitigating problems, we realized that we needed a more resilient and efficient approach. That’s when we started exploring elastic containers. Containerizing our platform and using Fargate to scale our infrastructure up and down rapidly helped us meet demand without the wasteful overhead of constantly running and underutilized servers. To put this into perspective, last year we were able to reduce our compute costs by 86% even as our compute usage and streaming traffic doubled. While the benefits of the new containerized and serverless approach were clear, the transition itself required a significant cultural shift within the organization. I had to work closely with our product teams to help them understand the importance of performance and uptime as a feature, not just the new shiny button they were tasked with delivering. Changing the mindset from “firefighting” to “fireproofing” required constant communication and collaboration. I couldn’t simply mandate technological changes – I had to bring our partners along on the journey, explaining the benefits and helping them see how it would make their jobs easier in the long run. It was a delicate balance, as I wanted to empower our teams to be agile and innovative, but I also needed to ensure that they were making decisions with the overall system in mind. One of the key strategies I employed was to provide teams with a clear set of guardrails, rather than overly restrictive rules. I didn’t want to be the “permission police,” constantly approving every change. So, I did things like set up a pre-prod environment where our engineers could test and run experiments without consequences or creating Terraform modules that showcased the PBS way of doing things. My goal was to lead by example, and to automate away human error where possible. To make it easier for my engineers to understand the implications of their decisions, and then trusting them to make responsible choices. For all of this to work, it also meant investing heavily in observability – because you can’t monitor what you don’t see. We built custom dashboards and reporting tools that gave teams visibility into their cloud resource consumption, latency metrics, and other key performance indicators. By surfacing this information in an accessible way, we were able to foster a culture of cost-consciousness and performance-mindedness. The most impactful optimizations are often incremental As we evolved our systems, we realized that simply focusing on the technological aspects wasn’t enough. We also needed to consider the broader environmental impact of our decisions. This has required a scrappy, iterative approach. We don’t have the luxury of ripping and replacing our entire infrastructure every few years. Instead, we’ve had to become masters of incremental improvement. Whether it’s rightsizing our database instances, implementing more efficient video encoding, or automating our deletion processes, every optimization adds up to meaningful cost and carbon savings. And it’s not just about the bottom line - by being good stewards of our resources, we’re also able to reinvest those savings into creating even better content and services for our viewers. One of the most impactful examples of this approach was our work to optimize the delivery of Sesame Street content. Back in 2009, when we were approached about featuring Sesame Street as a Google Doodle, our on-premises infrastructure was simply not equipped to handle the anticipated surge in traffic. The power of the doodle We made the decision to quickly migrate the Sesame Street website to AWS, and in the process, we were able to significantly improve the scalability and resilience of our content delivery systems. This was a pivotal moment for us, as it demonstrated the power of cloud-based architectures to help us rapidly adapt to changing demands. Cultivating a culture of frugality The story doesn’t end there. Over the years, we’ve continued to refine and optimize our content delivery system for an ever-growing catalog. One of the key areas we focused on was video encoding. We made the switch from AVC to a more modern codec, HEVC, which resulted in smaller file sizes, which means less data being stored, less data being streamed out over CloudFront and less data usage for our viewers. We also enabled variable bitrate encoding, which dynamically adjusts the video quality based on the viewer’s network conditions, ensuring an optimal viewing experience while reducing data consumption. And we took a more intentional approach to how we encoded different types of content. For our kids programming, which makes up a significant portion o'''
