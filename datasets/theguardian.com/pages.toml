title = "How to contact the Guardian and Observer | Help | The Guardian"
description = "Contact details for people and departments at the Guardian, Observer and the Guardian website. The switchboard number is 020 3353 2000"
full_description = "HelpHow to contact the Guardian and ObserverHow to contact people and departments at the Guardian, Observer and the Guardian website. All customer service queries must go through customer service to ensure that we can respond to you, see below for Customer Service details. Couldn’t find what you were looking for? Click here to access our Help siteFri 15 Oct 2010 10.44 EDTShareJump toCustomer ServicesHead OfficesHow to contact editorial departments and desksThe Guardian: editorial departments and desksThe Observer: editorial departments and desksGuardian FoundationReport a suspected security vulnerabilityBack issues and circulationAdvertisers, sponsorship and e-commercePress officeFreelance contributionsEmployment and work experienceContent distribution and syndicationCustomer ServicesFor any queries including subscription related queries, please visit our Help centre, where you will also find contact details for your region.Head OfficesYou can find Customer Service contact details on our Help Centre.How to contact editorial departments and desksPlease take care to send queries to the correct destination as there is no guarantee that messages will be forwarded.Contact the Guardian securelyFor information on how to contact Guardian journalists securely please read this guide. We recommend you use the Guardian’s SecureDrop portal.To contact any member of staff Individual staff, whether editorial or commercial, can be contacted using this email format: Firstname.lastname@theguardian.com Firstname.lastname@observer.co.uk Letters to the editor Letters for publication in the Guardian or Observer should be sent to the addresses below. The sender’s full postal address and phone number are required, for verification only. For further guidance on submitting a letter, click here. Guardian: guardian.letters@theguardian.com Observer: observer.letters@observer.co.ukCorrections and clarifications of editorial content – the readers’ editors It is the policy of the Guardian and the Observer to correct significant editorial errors and handle editorial complaints as soon as possible. The readers’ editors are independent internal ombudsmen and can be contacted as follows:Elisabeth Ribbans – Guardian global readers’ editor guardian.readers@theguardian.comGuardian readers’ editor page observer.readers@observer.co.ukPlease note that queries about subscriptions, vouchers, reader offers, advertising, marketing and other non-editorial areas are not handled by the readers’ editors. These should be addressed to the relevant non-editorial departments. Story suggestions should also be sent to the relevant editorial departments.Legal complaints Legal complaints should be addressed to our Editorial Legal Services department at: Kings Place, 90 York Way, London, N1 9GUModeration For more information about moderation and to contact the moderation team, please see this page.The Guardian: editorial departments and desks Arts desk: culture@theguardian.com or arts@theguardian.com Books competitions and events: books@theguardian.com [This address is used for correspondence about online competitions, poetry workshops, and the like. For all other emails about books, see Review, below] Business desk and financial staff: financial@theguardian.com Consumer desk: money@theguardian.com Consumer investigative column in weekly Money section consumer.champions@theguardian.com Education desk: education@theguardian.com Environment desk: please contact alan.evans@theguardian.com or bibi.vanderzee@theguardian.com Feast: feast@theguardian.com Film desk: culture@theguardian.com The Filter: thefilter@theguardian.com Foreign news: see international G2 (features) desk: features@theguardian.com International news desk: international@theguardian.com Letters: guardian.letters@theguardian.com Media Guardian: media@theguardian.com Money personal finance section: money@theguardian.com Music: culture@theguardian.com News desk, for UK national news: national@theguardian.com Notes and queries: nq@theguardian.com Obituaries desk: obituaries@theguardian.com Opinion desk: opinion@theguardian.com Personal finance: see Money and Consumer Pictures: for emails from readers, agencies and PRs picturedesk@theguardian.com Pictures: for advisories on film openings, PR openings and similar: photocalls@theguardian.com Political staff: politics@theguardian.com Review: review@theguardian.com Society: society@theguardian.com Space: space@theguardian.com Sport desk: sport@theguardian.com Travel desk: travel@theguardian.com The Observer: editorial departments and desks Business: financial@theguardian.com Cash: cash@observer.co.uk Consumer investigative column: your.problems@observer.co.uk Food Monthly: food.monthly@observer.co.uk Letters to the editor: observer.letters@observer.co.uk Magazine: magazine@observer.co.uk Review: review@observer.co.uk Sport: sport@observer.co.uk Travel: see Escape TV and radio review@observer.co.uk Guardian FoundationThe Guardian Foundation is a charity whose purpose is to promote global press freedom and access to liberal journalism. They work directly with journalists, news organisations, audiences and educators, in schools and across communities to enable change.Contact The Guardian Foundation here.Report a suspected security vulnerabilityIf you spot a potential security vulnerability in the Guardian’s websites and apps, or suspicious Guardian emails/articles/endorsements, we’d be grateful to hear from you. Please send an email to icrt@theguardian.com with the subject line “Suspected security vulnerability”. If possible, include screenshots in your description. We may contact you for more details. Thanks for your help.Please note we do not operate a bug bounty or responsible disclosure program at present.Back issues and circulationFor information on ordering a back issue of the Guardian, click here.If your query concerns UK distribution or retail supplies please contact business.information@theguardian.com. Otherwise all Customer Service queries must go through Customer Service, visit our Help centre for contact details for your region.Advertisers, sponsorship and e-commerceTo find out more about all advertising and sponsorship opportunities in the Guardian and the Observer, and the Guardian website, click here.If you have a question or concern about an advert on the site please report the problem here.Press officeIf you are a journalist with a media inquiry, please visit the press office page for the relevant contact information.Freelance contributionsIf you would like to contribute freelance content, please ensure you have read our Contributors’ guide.Story pitches should be sent to the relevant editorial department, as listed above.Any queries you have relating to the freelance charter, or other terms and conditions for the supply of content to GNM, should be directed to our Rights department at rights@theguardian.comEmployment and work experienceIf you are interested in working for Guardian News and Media, please see our dedicated careers site at theguardian.com/workforus. All current work experience and internship schemes are detailed on this site under the “Other opportunities” heading.Content distribution and syndicationFor permission to re-publish Guardian or Observer content, or acquire a licence to re-distribute our content, please visit our Syndication website.Couldn’t find what you were looking for?Click here to access our Help siteExplore more on these topicsHelpAboutShareReuse this content"
