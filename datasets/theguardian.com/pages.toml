["https://theguardian.com/australia-news/2025/mar/02/tropical-cyclone-alfred-likely-to-head-towards-southern-queensland-coast-later-this-week"]
title = "Tropical Cyclone Alfred ‘likely’ to head towards southern Queensland coast later this week | Australia weather | The Guardian"
description = "Bureau of Meteorology says guidance ‘favours landfall on Thursday’ possibly near Brisbane as Queensland disaster management committee meets"
full_description = "Tropical Cyclone Alfred is delivering strong winds to the Queensland coast. It could make landfall later this week near Brisbane. Photograph: Danny Casey/EPAView image in fullscreenTropical Cyclone Alfred is delivering strong winds to the Queensland coast. It could make landfall later this week near Brisbane. Photograph: Danny Casey/EPAAustralia weatherTropical Cyclone Alfred ‘likely’ to head towards southern Queensland coast later this weekBureau of Meteorology says guidance ‘favours landfall on Thursday’ possibly near Brisbane as Queensland disaster management committee meets Follow our Australia news live blog for latest updates Get our breaking news email, free app or daily news podcast Ben Smee Queensland state correspondentSat 1 Mar 2025 20.37 ESTLast modified on Sat 1 Mar 2025 21.13 ESTShareTropical Cyclone Alfred lingering off the Queensland coast will “likely” turn towards the state’s south-east later this week, the Bureau of Meteorology says.Queensland authorities have begun preparations for the possibility the that slow-moving tropical cyclone hits densely populated urban areas near Brisbane.While tracking maps are frequently changed – particularly over the longer term – the bureau’s MetEye system shows Alfred weakening and moving slowly away from the coast in the coming days.It would then “likely turn westward from Tuesday, moving back towards the southern Queensland coast” and Brisbane as a category two system.Lithuanian rower attempting to cross Pacific activates emergency beacon off Queensland near Cyclone AlfredRead more“Alfred should continue moving to the south on Sunday,” the bureau said.“From Tuesday there is increasing confidence that Alfred will track westwards towards the southern Queensland coast as the next mid-level steering ridge builds to the south.“Much of the guidance favours landfall on Thursday along the south-east Queensland or far northern NSW coast. Environmental influences are not favourable for the system in the short term.”View image in fullscreenThe BoM’s MetEye model showing the potential track of Tropical Cyclone Alfred this week. Illustration: Bureau Of MeteorologyThe Queensland State Disaster Management Committee was meeting at midday on Sunday and was expected to provide a public briefing later in the afternoon.It is understood authorities will urge residents to keep a close watch on developments, largely due to the potential for significant damage if a cyclone were to hit heavily populated and flood-prone parts of the state’s south-east. Sign up for Guardian Australia’s breaking news email It is rare – but not unheard of – for tropical cyclones to reach landfall south of the tropics.skip past newsletter promotionSign up to Breaking News AustraliaFree newsletterGet the most important news as it breaksEnter your email address Sign upPrivacy Notice: Newsletters may contain info about charities, online ads, and content funded by outside parties. For more information see our Privacy Policy. We use Google reCaptcha to protect our website and the Google Privacy Policy and Terms of Service apply.after newsletter promotionThe closest a cyclone track has come to Brisbane was in 1990, when Tropical Cyclone Nancy tracked erratically towards the Queensland capital, before making a southward turn just off the coastline and never reaching landfall.Tropical Cyclone Wanda – the cause of Brisbane’s historic 1974 floods – crossed the coast near K’gari and Hervey Bay. A severe tropical cyclone crossed the coast near Tweed Heads in 1954.It is far more common for a tropical cyclone to cross the coast north of the Tropic of Capricorn and return overland to the south-east as a destructive low storm. This occurred with Cyclone Debbie in 2017.Alfred was about 500km east of Rockhampton – which sits on the Tropic of Capricorn – on Sunday afternoon. The bureau warned of strong gale-force winds on K’gari.It also warned that severe coastal hazards were “likely” for southern Queensland and north-east NSW.“A large and powerful to potentially damaging easterly swell as well as abnormally high tides are developing about exposed southern Queensland beaches, and are forecast to extend to northern NSW from Monday,” the bureau said.Explore more on these topicsAustralia weatherQueenslandNew South WalesExtreme weathernewsShareReuse this content"
