["https://theguardian.com/commentisfree/2025/feb/16/europeans-are-right-to-be-angry-with-donald-trump-but-they-should-also-be-furious-with-themselves"]
title = "Europeans are right to be angry with Donald Trump, but they should also be furious with themselves | Andrew Rawnsley | The Guardian"
description = "The betrayal of Ukraine is a final warning to the UK and its continental allies to put a lot more energy and money into rebuilding their defences"
full_description = "John Healey, the defence secretary, has spoken of a ‘hollowed-out’ armed forces left behind by the Tories. Photograph: Harry Nakos/APView image in fullscreenJohn Healey, the defence secretary, has spoken of a ‘hollowed-out’ armed forces left behind by the Tories. Photograph: Harry Nakos/APThe ObserverTrump administrationEuropeans are right to be angry with Donald Trump, but they should also be furious with themselvesAndrew RawnsleyThe betrayal of Ukraine is a final warning to the UK and its continental allies to put a lot more energy and money into rebuilding their defencesSun 16 Feb 2025 02.30 ESTLast modified on Sun 16 Feb 2025 09.34 ESTShareIt was, Sir Keir Starmer told members of his inner circle, one of his most meaningful visits abroad. In the middle of last month, he flew to Kyiv to double-down on the commitment to back Ukraine’s struggle for freedom, a pledge he first made a defining feature of his leadership when Labour was in opposition. Hands were warmly clasped with Volodymyr Zelenskyy, wailing air raid sirens greeted a Russian drone attack, financial promises were made, and signatures were inscribed on a 100-year partnership treaty. The prime minister solemnly intoned the western mantra about backing the resistance to Russian tyranny “for as long as it takes” for Ukraine to become “free and thriving once again”.All of which now sounds for the birds, thanks to Donald Trump. It was with his trademark contempt for his country’s traditional allies that the US president blindsided them by announcing that he had initiated peace negotiations with Vladimir Putin over the heads of Ukraine and the European members of Nato. The UK received no more warning of this bombshell than anyone else. So much for the vaunted “special relationship”. The US defence secretary, Pete Hegseth, then unleashed another punch to the solar plexus of European security by publicly declaring that Ukraine would have to accept the surrender of large chunks of its territory and should forget about becoming a member of Nato. The future defence of Ukraine, he went on to declare, would be down to Europe, because the US wouldn’t be sending any of its troops to sustain a security guarantee.Humiliated and anguished, European leaders are crying “betrayal”. The UK government is not adding its voice to that charge in public, but it privately agrees. There is astonishment that the US president blithely conceded to several Russian demands before negotiations have even begun. “What happened to the Art of the Deal?” asks one flabbergasted minister. There is disgust at the Kremlin’s undisguised glee with what it interprets as a vindication of the barbarity it has inflicted on its neighbour. There is fear of the consequences for the Baltic states and others by rewarding Russian predation. There is horror at Trump’s subsequent suggestion that Putin be invited to rejoin the G7, as if the bloody slate of war crimes perpetrated by the Russians can simply be wiped clean.A hideous idea doing the rounds is that Trump will make a state visit to Moscow timed to coincide with the May Day parade, which celebrates Russia’s military. What a grotesque spectacle: the supposed leader of the free world sitting with the Kremlin’s tyrant watching a march across Red Square by the army that has committed so many atrocities in Ukraine.The biggest surprise is that so many people claim to be surprised. We knew that this US president despises America’s historic allies among the European democracies as he disdains the architecture of international security that his predecessors built. His geopolitics is one in which carnivorous great powers cut deals with each other and the smaller ones fall into line or get crushed underfoot. If you are genuinely shocked by these developments, I can only assume you haven’t been paying much attention.The perils are acute. A dictated peace will embolden Putin and other predators by sanctifying the redrawing of international borders by force. Were the US in concert with Russia to dismember Ukraine over the protests of Kyiv and European capitals, the transatlantic alliance would be mortally fractured.Europeans are right to be angry with Trump, but they should also be furious with themselves. They are to blame for leaving their continent so vulnerable to this danger-infused turn in world events. Trump has always had a point when he’s railed about Uncle Sam being treated as Uncle Sucker and he isn’t the first US president to tell Europe to take more responsibility for its security, even if none before have been so brutal about it. Under the lazy assumption that the US would always ultimately have their backs, European countries have spent too little on their own defence. The Russian invasion of Ukraine was often described as a wake-up call, but too much of Europe responded by hitting the snooze button. Three years on, the latest authoritative report from the International Institute for Strategic Studies finds that Moscow is feeding more resources into its war machine than the entirety of non-Russian Europe is spending on defence. Some frontline Nato countries, notably Poland, have ramped up their military budgets in response to the ravaging of Ukraine. The Poles grasp that the cost of deterrence is worth paying to avoid the far greater price of leaving yourself exposed to devastation. Others are still asleep. Last year, eight of Nato’s 32 members were still failing to meet the modest obligation to spend at least 2% of GDP.The perils are acute. Dictated peace will embolden Putin by sanctifying the redrawing of international borders by forceIt is not that Europe lacks the resources to protect itself without US assistance. Russia’s population is about 144 million. The total population of Nato countries, excluding the US, is over 636 million and their combined economic heft is about 12 times that of Russia. The means are there; what’s been lacking is the will.Defence spending is about to become a lively issue in British politics. George Robertson, defence secretary during Tony Blair’s time at Number 10 and subsequently a secretary general of Nato, has been leading a strategic defence review. Lord Robertson is a shrewd Scot who has overseen a serious piece of work that has come to conclusions which will be jolting. His grim findings have just been delivered to the desks of the defence secretary and the prime minister. They will have landed with a thump.The Robertson review will add further detail to an already alarming picture of escalating threats out-matching inadequate protections. It suggests innovations designed to extract more bangs for taxpayers’ bucks by improving the efficiency of defence spending. It also recommends the reprioritisation of roles and activities. It makes the argument that it’s not just how much you spend that matters, it is also how well you spend. Yet the bluntest message of the review will be that Britain is not adequately resourcing its security. John Healey, the defence secretary, has effectively conceded that already by decrying the “hollowed-out” armed forces left behind by the Tories, a “dire inheritance” which includes the smallest army since the Napoleonic wars and an air force losing pilots faster than it can train replacements.One of Mr Healey’s junior ministers has said that the British army could be wiped out in as little as six months if it engaged in a war on the scale of the conflict in Ukraine. In the realm of cyberwarfare, the head of the National Cyber Security Centre recently warned that Britain’s shields aren’t strong enough to protect from the myriad bad actors who are menacing us.skip past newsletter promotionSign up to ObservedFree weekly newsletterAnalysis and opinion on the week's news and culture brought to you by the best Observer writers Enter your email address Sign upPrivacy Notice: Newsletters may contain info about charities, online ads, and content funded by outside parties. For more information see our Privacy Policy. We use Google reCaptcha to protect our website and the Google Privacy Policy and Terms of Service apply.after newsletter promotionLabour’s election manifesto made a pledge to get spending up to 2.5% of GDP, but not until some distant and undefined point in the future. At an imminent meeting with the prime minister at Number 10, the heads of the armed forces are expected to argue that there will be more cuts to our enfeebled capability unless they get an additional £10bn a year than has been budgeted for.People in a position to know tell me that Sir Keir is becoming swayed by the case to spend more. For that to happen, three big obstacles will have to be overcome. One is the Treasury, which has ever viewed the MoD as a prodigiously wasteful spender, as it often has been. When money is already tight, Rachel Reeves is going to take a lot of persuading to make a special case of defence. There will be baulking by the many Labour ministers and MPs who will flinch at more money for missiles when it will mean less for public services. There’s also a job of persuasion to do with the British public for whom defence and security has not recently been a priority. At last summer’s election, just one in 50 named it as their top issue in deciding how to vote.It is going to take a lot of effort to shift the dial, but the need to do so is becoming pressing. There’s an old diplomatic saw: “If you’re not at the table, you’ll probably be on the menu.” In this era of international relations, exemplified by Trump seeking to do a strongman-to-strongman deal with Putin to carve up Ukraine, the law of the jungle is beginning to prevail. If the UK and the rest of Europe don’t want their vital interests to be on the menu, we’re going to have to stump up the cost of a seat at the table. Andrew Rawnsley is the Chief Political Commentator of the ObserverExplore more on these topicsTrump administrationOpinionVladimir PutinKeir StarmerUkraineDonald TrumpUS politicsEuropecommentShareReuse this content"
