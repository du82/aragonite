full_description = "MoviesLiveBaftas 2025: the red carpet, the ceremony, the winners – live!Join us for all the action from the Southbank Centre (and BBC One), as Conclave locks horns with Emilia Pérez and The Brutalist battles Bob Dylan biopic A Complete UnknownnowFull list of winners – live!Full list of winners – live!Baftas 2025 red carpet: sequins, satin and a ski mask – in pictures2h ago‘Karla Sofía I kiss you’: Emilia Pérez director extends Bafta olive branch to absent star2h agoBerlin film festivalThe Ice Tower review – Marion Cotillard focus of obsession and idolisation in death-wish fairytale2h agoBridget Jones 4 records highest-ever opening for a romcom in the UK3h agoFilm-maker Walter Salles: ‘Cinema, as opposed to noise, used to be at the heart of the Oscars’11h agoMore FilmLoads more stories and moves focus to first new story.All storiesFacebookSign up to the Film Weekly emailNewsHideBaftas 2025: the full list of winners – live!4h agoNo Other Land film-makers denounce Trump’s Gaza plan: ‘A crazy thing’Edible popcorn bucket and vegan caviar on the menu as Baftas embrace sustainability‘Such a bummer’: Netflix responds to Emilia Pérez falloutMore NewsLoads more stories and moves focus to first new story.ReviewsHideLove Hurts – Everything Everywhere all over againHeart Eyes – junky Valentine’s slasher is hard to fall forAn awkward cross between insipid romantic comedy and schlocky sleepover horror fails on both countsBring Them Down – Barry Keoghan farmer-feud revenge drama goes right over the topThis fervently acted Irish film about a dispute between farmers begins with some sheep rustling and ends in Peckinpah-esque violent horrorParthenope – Paolo Sorrentino contrives a facile, bikini-clad self-parodyKinda Pregnant – Amy Schumer’s Netflix comedy is kinda disappointingDog Man – goofy gags galore as the Franken-pooch takes on a fiendish feline Companion – empty sci-fi thriller short-circuits too quicklyYou’re Cordially Invited – Reese Witherspoon and Will 