["https://theguardian.com/artanddesign/gallery/2025/feb/14/the-week-around-the-world-in-20-pictures"]
title = "The week around the world in 20 pictures | Art and design | The Guardian"
description = "A drone strike in Chornobyl, a hostage release in Gaza, the conflict in DRC and Kendrick Lamar at Super Bowl LIX: the past seven days as captured by the world’s leading photojournalists"
full_description = "The week around the world in 20 pictures Share on Facebook Share on Twitter Share via Email A drone strike in Chornobyl, a hostage release in Gaza, the conflict in DRC and Kendrick Lamar at Super Bowl LIX: the past seven days as captured by the world’s leading photojournalists • Warning: this gallery contains images that some readers may find distressing Jim Powell @jimpowell2002 Main image: A child plays in front of graffiti representing the reconstruction of Gaza on Israel’s separation barrier in Bethlehem. Photograph: Hazem Bader/AFP/Getty Images Fri 14 Feb 2025 13.37 EST Last modified on Fri 14 Feb 2025 14.23 EST Chornobyl, UkraineWorkers inspect damage to a structure covering the remains of the fourth reactor at the Chornobyl nuclear power plant after it was struck by a Russian drone carrying a high-explosive warhead Photograph: Efrem Lukatsky/AP Share on Facebook Share on Twitter Orikhiv, UkraineA police officer looks out from an apartment building damaged by Russian military strikes in the frontline town. Donald Trump said this week that he and Vladimir Putin had agreed to begin negotiations to broker a ceasefire in Ukraine, later adding that it was unlikely Kyiv would win back all its territory or join Nato if a deal was to be reached Photograph: Reuters Share on Facebook Share on Twitter New Orleans, LouisianaKendrick Lamar performs during the Super Bowl LIX half-time show at Caesars Superdome. The performance was hailed as history-making: Samuel L Jackson was dressed in homage to Uncle Sam; backing dancers wore red, white and blue and stood in an American flag formation, and Serena Williams crip-walked Photograph: Mike Segar/Reuters Share on Facebook Share on Twitter New Orleans, LouisianaThe Philadelphia Eagles’ quarterback Jalen Hurts is interviewed at the end of Super Bowl LIX. With an MVP performance from Hurts and a defensive masterclass, the Eagles steamrollered the Kansas City Chiefs for a 40-22 victory on Sunday night Photograph: Chandan Khanna/AFP/Getty Images Share on Facebook Share on Twitter New Orleans, LouisianaSupporters cheer as a motorcade with Donald Trump departs the Naval Air Station Joint Reserve Base in New Orleans before the Super Bowl. Trump’s attendance at the game offered more evidence that the sporting climate has shifted from resistance to acceptance Photograph: Ben Curtis/AP Share on Facebook Share on Twitter Jabaliya, GazaPeople watch the sunset from their destroyed house. Donald Trump said his plan to ‘take over’ Gaza would not include a right of return for the more than 2 million Palestinians that he has said have ‘no alternative’ but to leave because of the destruction left by Israel’s military campaign Photograph: Haitham Imad/EPA Share on Facebook Share on Twitter Deir al-Balah, GazaPeople watch the deployment of Izz ad-Din al-Qassam fighters before a handover of Israeli hostages to the Red Cross. Hamas freed three hostages and Israel released 183 prisoners and detainees last Saturday, the fifth exchange under a fragile ceasefire deal Photograph: Haitham Imad/EPA Share on Facebook Share on Twitter Deir al-Balah, GazaA girl stands between Hamas fighters as she watches the handover of three Israeli hostages. The gaunt appearance of the three men shocked Israel, sparking anger and dismay that could increase pressure on Benjamin Netanyahu to extend the ceasefire agreement to a second stage, bringing home the remaining Israeli captives Photograph: Eyad Baba/AFP/Getty Images Share on Facebook Share on Twitter Mugunga, Democratic Republic of the CongoPeople carry jerrycans on their way to collect water. Rebels from the Rwandan-backed M23 group this week seized the strategically important airport serving Bukavu, the capital of South Kivu province, after a rapid advance south in recent days Photograph: Michel Lunanga/AFP/Getty Images Share on Facebook Share on Twitter Bulengo, Democratic Republic of the CongoInternally displaced families leave a camp carrying their belongings. The DRC’s president, Félix Tshisekedi, travelled to Germany to attend the Munich Security Conference this week as he seeks international support to end the conflict in the east of his country Photograph: Jospin Mwisha/AFP/Getty Images Share on Facebook Share on Twitter Munich, GermanyPolice working at the scene where a vehicle was driven into a demonstration. German police and prosecutors said the Afghan suspect in the incident, which injured at least 36 people, was believed to have had an Islamist motive and would face charges of attempted murder Photograph: Ronald Wittek/EPA Share on Facebook Share on Twitter Bethlehem, West BankA child plays in front of graffiti representing the reconstruction of Gaza on a section of Israel’s separation barrier Photograph: Hazem Bader/AFP/Getty Images Share on Facebook Share on Twitter GazaFighters from the Izz ad-Din al-Qassam, the armed wing of Hamas, perform the Friday noon prayer during a funeral ceremony for Marwan Issa, a top Hamas commander killed in March 2024, inside a sports stadium in the Bureij refugee camp Photograph: Eyad Baba/AFP/Getty Images Share on Facebook Share on Twitter London, UKA Peta protester dumps a bucket of ‘coconut milk’ over herself outside the Thai embassy. The demonstrators were urging embassy officials to help end the exploitation of endangered monkeys in Thailand’s coconut picking industry Photograph: Kin Cheung/AP Share on Facebook Share on Twitter New York, USModels backstage at the Thom Browne fall 2025 show at the Shed during New York fashion week. Jackets and coats in British-made tweeds, their proportions tweaked rather than distorted, were embroidered with herons and magpies drawn from the luscious watercolours of John J Audubon’s Birds of America anthology Photograph: Nina Westervelt/WWD/Getty Images Share on Facebook Share on Twitter New York, USFour bedlington terriers at the 149th Westminster Kennel Club dog show. A giant schnauzer named Monty won best in show Photograph: Andrés Kudacki/Getty Images Share on Facebook Share on Twitter Xian, ChinaTourists wearing traditional Hanfu clothing visit the Guangren Tibetan Buddhist temple in Xian Photograph: Kevin Frayer/Getty Images Share on Facebook Share on Twitter Pathum Thani, ThailandThai Buddhist monks pray at Wat Dhammakaya temple Photograph: Guillaume Payen/Anadolu/Getty Images Share on Facebook Share on Twitter Sicily, ItalyLava flows from a crater of Mount Etna. A drone captured footage of the eruption, with plumes of smoke rising from the volcano’s summit and lava flowing from the new Bocca Nuova crater Photograph: Marco Restivo/Etna Walk/AFP/Getty Images Share on Facebook Share on Twitter SpaceAn image made by the integration of photographs taken over six hours shows Nebula IC 443 over Hinojedo in Cantabria, Spain. This supernova remnant, known as Medusa Nebula, is in the Gemini constellation, 5,000 light years from Earth Photograph: Pedro Puente Hoyos/EPA Share on Facebook Share on Twitter Topics World news Twenty photographs of the week"
