["https://theguardian.com/commentisfree/2025/feb/16/a-tale-of-two-suckers-donald-trumps-plastic-straws-and-keir-starmer"]
title = "A tale of two suckers: Donald Trump’s plastic straws and Keir Starmer | Stewart Lee | The Guardian"
description = "The US president has scrapped paper straws because they allegedly ‘explode’ – a bit like the PM’s reputation if he keeps refusing to confront him on the big issues"
full_description = "Illustration by David Foldvari.View image in fullscreenIllustration by David Foldvari.The ObserverDonald TrumpA tale of two suckers: Donald Trump’s plastic straws and Keir StarmerStewart LeeThe US president has scrapped paper straws because they allegedly ‘explode’ – a bit like the PM’s reputation if he keeps refusing to confront him on the big issuesSun 16 Feb 2025 05.00 ESTLast modified on Sun 16 Feb 2025 07.00 ESTShareIt’s difficult to know whether to set any store by Donald Trump’s bleak and yet also often banal pronouncements, which read as if handfuls of offensive concepts have been tossed into the air by a monkey, read out in whatever order they landed and then made policy. Until it’s clear they can’t work. At which point, the monkey must toss again.But this month, Trump, whose morning ablutions increasingly appear to consist of dousing himself in sachets of the kind of cheap hot chocolate powder I steal from three-star hotels, like a flightless bird stuck in the machine that glazes Magnum lollies, declared he wanted to build his hotels on the mass graves of Gaza. Hasn’t Trump seen The Shining? It won’t end well. Pity those whose children have the misfortune to die next to a monetisable stretch of shoreline. And hope humanity’s next wave of mass killings happens somewhere uneven and way inland that hopefully wouldn’t even make a decent golf course.Is Ukraine the frontier upon which the future of European democracy hinges, or is it just a massive stretch of undeveloped fairway, its leisure/conference utility value currently compromised only by the desire of some losers to continue living in the country they consider home? Where we see the falling domino chain that starts with Poland and ends in your back garden, does Trump see only a succession of 18-hole courses full of men in caps and enormous flapping flares brokering manly deals at the tee? Drive your golf carts over the bones of the dead!But maybe Trump’s horrible mouth-cack is just continuing evidence of his former acolyte Steve Bannon’s advice to “flood the zone with shit”? Does Trump really hate all sea creatures so much that he has to reinstate the plastic straws Joe Biden successfully, and commendably, outlawed? Perhaps he was once told to keep his hands to himself by a mermaid. “These things don’t work,” Trump said of paper straws. “I’ve had them many times, and on occasion, they break, they explode.” Must millions of seabirds, turtles, manatees and dolphins die because Trump imagines that paper straws explode? Or so he can suck up his Diet Coke fast enough to amuse Elon Musk, Pete Hegseth and JD Vance by burping a smelly chorus of YMCA in Biden’s face next time there’s a gathering of ex-presidents.Like some kind of infantilised diaper king, Trump has genuinely had a special Diet Coke-summoning button installed in the Oval OfficeBecause Trump, a fully grown man with unlimited funds, loves Diet Coke, and it’s tempting to wonder how many of his seemingly incomprehensible policy decisions can be traced back to his desire to be continually saturated by the soft drink. Maybe there is a subterranean lake of the stuff somewhere deep beneath the Greenland tundra that the climate crisis, which doesn’t exist, will soon make accessible to Trump’s deep Diet Coke drills? Delighted Inuit strip off their sealskins and dance in the showering liquid as they realise they have just struck a rich seam of their new master’s black gold. Like some kind of infantilised diaper king, Trump has genuinely had a special Diet Coke-summoning button installed in the Oval Office. Hopefully, he won’t get it mixed up with that other button. It will be a shame if all life on Earth is fatally irradiated just because Trump wanted a 500ml bucket of fizz to swill down his Big Mac and fries.But are we meant to take Trump’s erratic announcements seriously? While the last concerned voices of the dying liberal press pen outraged articles to their dying liberal readers about Gaza hotels, the invasion of Canada and Trump making it compulsory to drink everything through a Trump Plastic Freedom Straw Company Deluxe Plastic Freedom Straw ™ ®, even cauliflower cheese soup, his homunculus Musk has been quietly dismantling the infrastructure of American government as you knew it. There are cup-and-ball tricksters on Parisian street corners with more subtle moves.Half a dozen of Musk’s own hand-harvested incels-in-waiting, the kind of people who under normal circumstances would have got rich by inventing a way in which hardcore digital pornography could have been mainlined directly into the bloodstream in liquid form, have, under the spurious authority of Musk’s imaginary “department of government efficiency”, gone in and stolen all the data about everyone and everything in the US ever. Never mind. I am sure they will use it responsibly. What can possibly go wrong?Some people gathered at the scenes of Musk’s cost-cutting exercises and waved placards. Others sat and gawked at news footage of Kanye West’s naked wife’s arse or enjoyed disappointing trailers for the new Captain America movie, while the world as they knew it crumbled beneath their king-sized sofas. Keir Starmer backed away, as one might from a neighbour’s unpredictable weapon dog, avoiding direct comment, dodging a commitment to the AI declaration like a coward and hoping for the best, while Trumpy growls and foams. Which simply won’t do.Look. I’m as disappointed as the next metropolitan liberal elitist champagne socialist by Starmer’s government. While I accept, for example, the migration crisis must be addressed, I didn’t expect Starmer, who once left his “village and went to the city of Leeds” and “discovered a whole new world of indie bands – like Orange Juice and the Wedding Present”, to do it with Nigel Farage-style performative cruelty. Address the migration crisis, by all means, but don’t be a c*** about it. Did Orange Juice suffer the indignity of their eponymous third album not even entering the top 50 in 1984 just so, 41 years later, Starmer could send Yvette Cooper out to downgrade the desperate, like Paul Golding in heels.Currently, as Putin puffs up under Trump’s protection and unregulated AI threatens to rewrite history in real time, Starmer is on his knees sucking the paper straw of Trump’s presidency. I fear it may be about to explode in his mouth. Stewart Lee tours Stewart Lee vs the Man-Wulf this year, with a Royal Festival Hall run in July Do you have an opinion on the issues raised in this article? If you would like to submit a letter of up to 250 words to be considered for publication, email it to us at observer.letters@observer.co.uk Explore more on these topicsDonald TrumpOpinionUS politicsKeir StarmerImmigration and asylumElon MuskArtificial intelligence (AI)Vladimir PutincommentShareReuse this content"
