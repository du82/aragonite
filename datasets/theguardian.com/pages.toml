["https://theguardian.com/environment/2025/feb/14/brake-pad-dust-toxic-exhaust-emissions"]
title = "Brake pad dust can be more toxic than exhaust emissions, study says | Automotive emissions | The Guardian"
description = "Research shows move to electric vehicles may not be enough to enable pollution from cars to be eradicated"
full_description = "Researchers found that a higher concentration of copper in some brake pads was associated with increased harmful effects. Photograph: Geopix/AlamyView image in fullscreenResearchers found that a higher concentration of copper in some brake pads was associated with increased harmful effects. Photograph: Geopix/AlamyAutomotive emissionsBrake pad dust can be more toxic than exhaust emissions, study saysResearch shows move to electric vehicles may not be enough to enable pollution from cars to be eradicatedRachel KeenanFri 14 Feb 2025 01.00 ESTShareMicroscopic particles emitted from brake pads can be more toxic than those emitted in diesel vehicle exhaust, a study has found.This research shows that even with a move to electric vehicles, pollution from cars may not be able to be eradicated.The researchers found that a higher concentration of copper in some commonly used brake pads was associated with increased harmful effects on sensitive cells from people’s lungs, as a result of particles being breathed in.Exposure to pollution generated by cars, vans and lorries has been previously been linked to an increased risk of lung and heart disease. While past attention has mainly concentrated on exhaust emissions, particles are also released into the air from tyre, road and brake pad wear.These emissions are largely unregulated by legislation and the study found that these “non-exhaust” pollution sources are now responsible for the majority of vehicle particulate matter emissions in the UK and parts of Europe, with brake dust the main contributor among them.Dr James Parkin, from the University of Southampton and lead author of the study published in the journal Particle and Fibre Toxicology, said: “People generally associate pollution from cars as being from exhaust pipes and think of electric vehicles as having zero emissions. However, electric vehicles still produce particulate matter due to friction and wear of the road, tyres, and brakes.“We wanted to understand how different types of chemical composition of pads affect the toxicity of the particles emitted and what this might mean for the health of individuals.”The scientists examined the effects on lung health of particulate matter from four different types of brake pad with differing chemical compositions; low metallic, semi-metallic, non-asbestos organic and hybrid-ceramic.Results showed that of the four types of brake pads, non-asbestos organic pads were the most potent at inducing inflammation and other markers of toxicity, and were found to be more toxic to human lung cells than diesel exhaust particles. Ceramic pads were the second most toxic.Dr Ian Mudway, senior lecturer at the school of public health at Imperial College London, said that while the research appeared sound it was premature to conclude that emissions from brake pad wear were worse than diesel exhaust.skip past newsletter promotionSign up to Down to EarthFree weekly newsletterThe planet's most important stories. Get all the week's environment news - the good, the bad and the essentialEnter your email address Sign upPrivacy Notice: Newsletters may contain info about charities, online ads, and content funded by outside parties. For more information see our Privacy Policy. We use Google reCaptcha to protect our website and the Google Privacy Policy and Terms of Service apply.after newsletter promotionHe said: “Too many variables remain uncontrolled: brake disc types [a highly varied category], diesel exhaust particle composition, and chosen endpoints, among others. While this paper focuses on brakes, tyre wear and road dust resuspension should also be considered. This has significant policy implications, as it suggests that policies solely targeting exhaust emissions will not fully mitigate the risks of traffic-related pollutants.”The project supervisor Prof Matthew Loxham said this was “a fair comment” but said the brake wear particles were generated on a test rig according to a standard braking cycle, different types and speed of braking, which is used for brake testing, “therefore one would expect the particles to be representative of general real world brake wear particles”.“Although there may well be differences to the particles from each of these sources caused by changes in braking or engine parameters, I think it would be fair to hypothesise that these differences would be rather less than the differences due to the individual sources,” he said.Explore more on these topicsAutomotive emissionsAutomotive industryClimate crisisElectric, hybrid and low-emission carsGreenhouse gas emissionsClimate crisis in the American westGreen economynewsShareReuse this content"
