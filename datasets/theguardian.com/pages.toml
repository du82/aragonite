["https://theguardian.com/environment/2025/feb/15/extreme-weather-likely-to-cause-further-food-price-volatility-analysts-say"]
title = "Extreme weather expected to cause food price volatility in 2025 after cost of cocoa and coffee doubles | Food | The Guardian"
description = "Trend towards more extreme-weather events will continue to hit crop yields and create price spikes, Inverto says"
full_description = "Chocolate being added to cups of coffee. The prices for cocoa and coffee rose 163% and 103% respectively in the year to January. Photograph: Luca Bruno/APView image in fullscreenChocolate being added to cups of coffee. The prices for cocoa and coffee rose 163% and 103% respectively in the year to January. Photograph: Luca Bruno/APFoodExtreme weather expected to cause food price volatility in 2025 after cost of cocoa and coffee doublesTrend towards more extreme-weather events will continue to hit crop yields and create price spikes, Inverto saysDamien GayleSat 15 Feb 2025 03.39 ESTLast modified on Sat 15 Feb 2025 03.40 ESTShareExtreme weather events are expected to lead to volatile food prices throughout 2025, supply chain analysts have said, after cocoa and coffee prices more than doubled over the past year.In an apparent confirmation of warnings that climate breakdown could lead to food shortages, research by the consultancy Inverto found steep rises in the prices of a number of food commodities in the year to January that correlated with unexpected weather.Several authorities declared 2024 the hottest year on record, a trend towards higher temperatures that seems to be continuing into 2025. Inverto said a long-term trend towards more extreme weather events would continue to hit regional crop yields, causing price spikes.The highest price rises were for cocoa and coffee, up 163% and 103% respectively, due to a combination of higher than average rainfall and temperatures in producing regions, according to the research.Arabica coffee pricesSunflower oil prices increased by 56% after drought caused poor crop yields in Bulgaria and Ukraine, which also continued to be affected by the Russian invasion. Other food commodities with sharp year-on-year price rises included orange juice and butter, both up by more than a third, and beef, up by just over a quarter.“Food manufacturers and retailers should diversify their supply chains and sourcing strategies to reduce over-reliance on any one region affected by crop failures,” Katharina Erfort, of Inverto, said.skip past newsletter promotionSign up to Down to EarthFree weekly newsletterThe planet's most important stories. Get all the week's environment news - the good, the bad and the essentialEnter your email address Sign upPrivacy Notice: Newsletters may contain info about charities, online ads, and content funded by outside parties. For more information see our Privacy Policy. We use Google reCaptcha to protect our website and the Google Privacy Policy and Terms of Service apply.after newsletter promotionClimate crisis contributing to chocolate market meltdown, research findsRead moreIn December, the UK government said climate breakdown and related food price inflation was leading to a rise in the number of hungry and malnourished households.Climate scientists said Inverto’s findings were in line with their expectations.“Extreme weather events around the globe will continue to increase in severity and frequency in line with the ongoing rise in global temperature,” said Pete Falloon, a food security expert at the Met Office and University of Bristol.Cocoa prices chart“Crops are often vulnerable to extreme weather, and we can expect to witness ongoing shocks to global agricultural production and supply chains, which ultimately feed into food security concerns.”Max Kotz, of the Potsdam Institute for Climate Impact Research, said data showed heat extremes were already directly affecting food prices.“Last year showed numerous examples of this phenomena playing out in real time, as extreme heat across east Asia drove substantial increases in the price of rice in Japan and vegetables in China,” he said.“Market commodities were also strongly affected, with extreme heat and drought across cocoa-producing west African countries and coffee-producing regions in Brazil and Vietnam driving strong increases in prices. Until greenhouse gas emissions are actually reduced to net zero, heat and drought extremes will continue to intensify across the world, causing greater problems for agriculture and food prices than those we are currently facing.”Explore more on these topicsFoodFood & drink industryGlobal economyClimate crisisExtreme weatherEconomicsnewsShareReuse this content"
