["https://theguardian.com/film/live/2025/feb/16/baftas-2025-the-red-carpet-the-ceremony-the-winners-live"]
title = "Baftas 2025: the red carpet, the ceremony, the winners – live! | Baftas | The Guardian"
description = "Join us for all the action from the Southbank Centre (and BBC One), as Conclave locks horns with Emilia Pérez and The Brutalist battles Bob Dylan biopic A Complete Unknown"
full_description = "3m ago15.15 ESTConclave wins outstanding British film!Gwilym MumfordConclave’s second award of the night and it’s a biggie. Director Edward Berger accepts it remarking that it’s surprising given “I’m not even from here!” Ahead of elections next week in his homeland of Germany, he gives the night’s first truly political speech. “We live in a crisis of democracy,” he says. “Institutions that used to bring us together are bringing us apart.”ShareUpdated at 15.18 EST 7m ago15.11 ESTGwilym MumfordNow we’re rattling a montage of awards deemed not important enough to be shown properly, including sound, production design, score, casting and – interestingly – film not in the English language. I say interestingly because that award went to Emilia Pérez and, as alluded to earlier, featured a speech by Jacques Audiard that paid fulsome tribute to Karla Sofía Gascón. They seem to skip over that detail on the broadcast, but you can read all about it here:‘Karla Sofía I kiss you’: Emilia Pérez director extends Bafta olive branch to absent starRead moreShareUpdated at 15.14 EST 13m ago15.05 ESTGwilym MumfordSimon Pegg hands out the outstanding contribution to cinema award to the charity MediCinema, which custom-builds cinemas in UK hospitals. You can read all about their excellent work in Libby Brooks’s piece below.‘It became a lifeline’: the charity bringing cinema to hospital patientsRead moreShareUpdated at 15.08 EST 16m ago15.03 ESTGwilym MumfordThe actual ceremony has finished now – so anyone who actively wants to be spoiled can find out all the winners here.ShareUpdated at 15.06 EST 19m ago15.00 ESTZoe Saldaña wins best supporting actress!Gwilym MumfordSaldaña isn’t dragged down by the Emilia Pérez furore, and quite right, too, because she is by far the best thing about that film. She gives a speech that could best be described as “big”, and she probably would have been played off if it wasn’t for Bafta’s deference to Hollywood stars. But she pays tribute to Jacques Audiard, and the film’s cast, including – in passing – Karla Sofía Gascón.View image in fullscreenColman Domingo and Adam Pearson present the best supporting actress award to Zoe Saldaña for Emilia Pérez. Photograph: Stuart Wilson/BAFTA/Getty Images for BAFTAShareUpdated at 15.15 EST"
