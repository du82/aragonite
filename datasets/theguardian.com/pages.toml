title = "Times change but the Guardian’s values don’t: 200 years, and we’ve only just begun | The Guardian | The Guardian"
description = "On the Guardian’s 200th anniversary, editor-in-chief Katharine Viner sets out how media can help rebuild a better world beyond Covid"
full_description = "Illustration: Andrew Stocks/Ellen Wishart/Guardian DesignOn the Guardian’s 200th anniversary, our editor-in-chief sets out how media can help rebuild a better world beyond Covid Celebrate 200 years of independent Guardian journalism, and help power our future – make a contribution, or become a subscriber. By Katharine VinerWed 5 May 2021 02.35 EDTFirst published on Wed 5 May 2021 02.00 EDTShareI remember the day, in late March 2020, when I first worried that we might not be able to publish a newspaper, for what would have been only the second time in the Guardian’s history. I had driven into the office – no one was taking the train any more. Classed as an essential worker, I was permitted to travel, but the streets were utterly silent, with every school, cafe and shop closed.I sat down with colleagues, spaced apart by yellow tape, to work out whether we could gather enough people to produce a print edition. We could publish the digital Guardian from anywhere, but to publish the newspaper, we needed a small number of people in the office. A handful of colleagues volunteered, but I wondered how we would be able to keep everything going. People were anxious for their families and friends and themselves – and frightened, too, for what kind of world we were entering, and what we would be left with.Times change but the Guardian’s values don’t: 200 years, and we’ve only just begun – podcast Read moreSo, as the editor-in-chief, I did what I have often done in difficult times, and looked to the history of the Guardian. How did they get the paper out during the 1918 flu pandemic, which killed 228,000 people in Britain and more than 50 million worldwide? What was it like for journalists on the Manchester Guardian? Did many staff fall ill or even die from the virus that the paper itself warned was “very fatal”?The second wave of the flu pandemic, in autumn 1918, hit Manchester hard: all schools were closed, mortuaries were full and doctors announced they could not attend to everyone. The lives of our journalists were surely affected – unusually, the 1918 flu was more deadly for people between the ages of 20 and 40. And yet there is nothing in the history books about the pandemic’s impact on the Guardian as an institution or the individuals who made it. Not a word.This absence does not surprise Laura Spinney, whose brilliant 2017 book about the 1918 pandemic, Pale Rider, was an essential text in the early months of 2020 as we watched our world transformed by a new coronavirus. She recalls that when she started her research, there were more than 80,000 books about the first world war, but only around 400 about the 1918 flu, which took more lives than the war. “People didn’t know how to think about it,” Spinney writes. “They still don’t.”The Covid-19 pandemic will certainly not be so invisible to future generations. Ours is “the first worldwide digitally witnessed pandemic”, writes Astrid Erll, an academic who studies historical memory, “a test case for the making of global memory”. The question is what shape that memory will take. Already there is a sense of trauma slipping from our collective recollection. Many people died quickly and could not be buried properly. (Remember the images of Ismail Mohamed Abdulwahab, a 13-year-old from Brixton, buried without his family present?) There are one-year-olds who have hardly met anyone but their parents, and a generation of children trapped at home for a large proportion of their lives.Covid’s impact is likely to be vast and enduring. Spinney writes that the 1918 flu pandemic “resculpted human populations more radically than anything since the Black Death”. But as historians have observed, the aftereffect of a global shock depends on the prevailing mood of the times. Positive changes do not automatically emerge from periods of crisis; you have to fight for them. Thomas Piketty says that “the nature of the impact depends on the theories people hold about history, society, the balance of power … It always takes major social and political mobilisation to move societies in the direction of equality.”The Guardian is not the only newspaper to declare that it has a higher purpose than transmitting the day’s events in order to make a profit. But it might be unique in having held on to that sense of purpose for two centuries.“A newspaper has two sides to it,” as former editor CP Scott wrote in his essay commemorating our first 100 years. “It is a business, like any other … But it is much more than a business; it is an institution; it reflects and it influences the life of a whole community … It has, therefore, a moral as well as a material existence.” This conviction was present from the start: the prospectus that announced the Guardian’s founding in 1821, in response to the Peterloo massacre, asked how the “great diffusion of Education” in the country, which had excited a “greatly increased interest” in politics, could be “turned to beneficial account”.View image in fullscreen Illustration: Andrew Stocks/Ellen Wishart/Guardian DesignWe are a long way from Peterloo and the 1918 flu. But once again, events have sparked the intense interest of readers, who are asking how we can emerge from this crisis with something better. The first question for the Guardian’s third century is what role we can play in shaping the memory of this catastrophe. How our reporting – in words, pictures, video and audio – will have an impact on the struggle to make sense of the pandemic and the new world it shapes, how our commentary and analysis illuminates the decisions that led us here, and how the past has determined the possibilities for the present. In Arundhati Roy’s electrifying long read about India’s Covid nightmare, she shows how the meek acceptance of earlier travesties paved the way for this political catastrophe. “Grenfell was a rehearsal for Covid,” says Naomi Klein, “just as Covid is a rehearsal for climate breakdown, if we don’t radically change course.” If the pandemic is “an opening”, in Rebecca Solnit’s words, making “room for change that wasn’t there beforehand”, how can the Guardian help create a better kind of world than the one we had before?There cannot be a person alive who has not been touched by the events of the past year, but this pandemic is simultaneously universal and infinitely particular. There is no one common experience we have all shared, even as it is happening at the same time to all of us. How do we reckon with these abrupt and enormous shifts in our lives and routines? How do we process this trauma without any shared ritual? How do we relate to the deaths of people we do not know? How do we reckon with the fact that the pandemic is not simply a tragedy but also a scene of gross political negligence and outrageous profiteering? How do we understand what the pandemic is doing to society, the way it is accelerating inequality and hitting the most vulnerable hardest, at a time when our empathy has been dulled by lockdown and taxed by fear?These are challenges for everyone. But they are particularly urgent for journalists, who must chronicle these events in all their shock and immediacy, while trying to connect our audiences to the events in a human way. Reporting on Covid has given us fresh ideas and new energy for covering some of the biggest stories of our time, such as the climate crisis, which shares some of these same qualities – universal, yet affecting different people in different ways; global, and yet not easily located in specific places and times. How do we report a disaster that is happening everywhere all at once, and inspire our audience to understand its gravity without thinking it’s too big and too scary to comprehend? The Covid crisis has given us some fresh ideas about how to do that.In 1918, influenza travelled much faster than information: there was no radio or TV news, nor even any newsreels. Newspapers were essentially the only means of communicating with the public. The papers “played a critical role in shaping compliance – or the failure of it”, writes Spinney. “Their attitude, like that of doctors and the authorities, was paternalistic.” Death figures were not reported, and throughout the world newspapers mostly hid the true scale of the pandemic, believing people would be too frightened if they really understood. So even though newspapers were the only way to hear what was going on, they mostly didn’t convey it.updated series embedAt first glance, this sort of paternalism might seem like a relic of the past, a long way from the no-holds-barred sensationalism of today’s papers. But at the height of the first coronavirus wave in early 2020, there were parts of the UK media – most of them staunchly supportive of Boris Johnson’s Conservative government – that were straining to put a positive spin on the grim news all around us. As we at the Guardian tried to put a human face on the growing death toll, to expose the disproportionate impact of Covid-19 on communities of colour, and to understand what was happening in care homes, many other papers were calling for foreign holidays to resume and promising a vaccine by the end of summer. (Remember that at a time when more than 10,000 people had died, the government still refused to reveal who sat on the Sage committee, let alone publish its minutes, until the Guardian put it under pressure.) Although the coverage elsewhere got stronger as the pandemic grew too bad to sanitise, there has been a sense that the media should “bat for the home side”, pushing the government’s view that Britain was “world-beating”, in spite of the catastrophic figures for deaths and hospitalisations.Of course, the pandemic has given rise to a lot of outstanding journalism, including innovative uses of data, allowing audiences to track the spread of the disease in useful and revealing ways, and new methods of reporting that afford empathy and humanity to victims who would have once remained hidden. There has been some dazzling reporting from science and health specialists, who have given the average reader an understanding of the virus that few doctors possessed in 1918. And investigative reporting has been so important, revealing cronyism, muddle and why some governments were so woefully unprepared.In modern journalism, there has never been a story like this: both microscopic and global, affecting the entire world all at once, and supercharged by lightspeed information flow and global connectivity. Audiences have been hungry for news in every digital format, and the Guardian is not alone in seeing intense reader interest. But this raises a new worry. In 1918, there was too little information; in 2021, might we have too much? During Britain’s deadly second wave in the winter of 2020-21, which killed many more people than the first, Spinney found people to be “bored and dissociated and even less able to register what’s been going on in hospitals. I worry that the deluge of information is a major part of our fatigue.” A century ago, even an obsessive reader of the news ran out of papers to read each day. Now there are no limits on space, and we can publish around the clock. The challenge for 21st-century journalism is how to judge what is meaningful and what is merely noise – how to publish quality journalism that speaks to the urgency of the moment but is always worth your time.Moments of crisis tend to raise the question of what the role of journalism should be. The need for reliable information is a reminder of why journalism is necessary – but also a reminder that simply recording what has happened is not enough. In fact, this is what has always distinguished the Guardian throughout its history: its purpose.The Manchester Guardian (as the Guardian was called until 1959) was founded in 1821 in a mood of great hope – to capitalise on a demand for representation that followed the “earthquake” of Peterloo. Right from the beginning, the Guardian was not just about the news of the day, but about how people can use information to make the world a better place – the facts, but not only the facts. This is what we mean when we say that our purpose is to provide hope through clarity and imagination.CP Scott’s essay on journalism was written in 1921, and it is striking just how enduring the mission that it laid out has proved to be. Scott was editor of the Guardian for 57 years, and he made it what it is today. Scott listed the values of the Guardian as “honesty, cleanness [integrity], courage, fairness, a sense of duty to the reader and the community”, and emphasised that the Guardian must be editorially led, and the journalists free from commercial or political interference. He set the terms for pluralism, so crucial to a news organisation without a proprietor: “The voice of opponents no less than of friends has a right to be heard. It is well to be frank; it is even better to be fair”. He stressed the primacy of fact with the line “comment is free, but facts are sacred”.The Scott Trust – the ownership model put in place by CP’s son John in 1936, a few years after Scott’s death – codifies Scott’s essay and underpins the Guardian today: the idea that it has a “moral as well as a material existence”, and all that entails, is guaranteed by the trust in perpetuity. It is no wonder that the Scott Trust ownership model has been adopted by other journalistic organisations working in the public interest around the world. (The Scott Trust also owns the Observer, and protects its independence, but the Observer has a very different and even longer history – founded in 1791, it is the world’s oldest Sunday newspaper.)As the Guardian enters its third century, nothing must change our mission, but the digital revolution might change how we interpret that mission for the modern age. We are now in a more levelled world, where journalists are no longer so separate from their audience. Yes, we do the work and pound the streets and dig around for documents, but we no longer deliver our journalism from “on high” to an uninitiated audience. To be successful today – to get the stories that really matter to readers, and to convey the information they need in ways they want – journalists must be part of the social fabric of the world they report on. The Guardian is a community of journalists and readers, all of us equal citizens of that community.It is inevitable that the Gutenberg-era Guardian was a one-way street, an ivory tower, since a mutually engaged conversation with a reader in real time was beyond imagination. Scott might have been shocked by such a possibility – he might have been shocked that there was a woman sitting in his editor’s chair, too – but ultimately I think he would have embraced both innovations. Privileged as he was, he was resolutely part of his community – “the men of Manchester knew he loved their unlovely town” wrote historian David Ayerst after Scott’s death. He believed powerfully in a “sense of duty to the reader and the community” , and "
