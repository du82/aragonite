["https://theguardian.com/commentisfree/2025/mar/01/epstein-files-trump-administration"]
title = "Even rightwingers are mocking the ‘Epstein files’ as a lot of redacted nothing | Arwa Mahdawi | The Guardian"
description = "It was yet another reminder that Trump and his associates will turn even the sex trafficking of minors into a photo op"
full_description = "One of the ‘Epstein Files: Phase 1’ binders, in Washington DC on Thursday. Photograph: Kevin Lamarque/ReutersView image in fullscreenOne of the ‘Epstein Files: Phase 1’ binders, in Washington DC on Thursday. Photograph: Kevin Lamarque/ReutersThe Week in PatriarchyTrump administrationEven rightwingers are mocking the ‘Epstein files’ as a lot of redacted nothingArwa MahdawiIt was yet another reminder that Trump and his associates will turn even the sex trafficking of minors into a photo opSat 1 Mar 2025 09.00 ESTLast modified on Sat 1 Mar 2025 20.06 ESTShareThe Epstein files fiascoDrum roll, please: the “most transparent administration in American history” is declassifying shocking new information about Jeffrey Epstein and his associates. After years of speculation that powerful people have been concealing information related to the late financier and convicted sex offender, the Trump administration said earlier this week that it would release unseen details about the case.“Breaking news right now, you’re going to see some Epstein information being released by my office,” Pam Bondi, the attorney general, told Fox News on Wednesday night. “This will make you sick.”Apparently intent on treating this “new” Epstein information like an album drop rather than a horrific sex-trafficking case involving the abuse of young girls, the White House gave a bunch of influencers a first look at the information. On Thursday, Bondi’s team handed out big white binders labelled “The Epstein Files: Phase 1” and “The Most Transparent Administration in History” to a group of 15 rightwing activists and self-styled “citizen journalists” visiting the White House. Grinning gleefully, these influencers proceeded to pose for the press with the binders like they were trophies from a school sports day.So what was in those binders? A whole lot of heavily redacted nothing, basically. A bunch of people at Bondi’s office appear to have hastily printed out Epstein’s contact book, which was published by the (now shuttered) website Gawker a decade ago, along with other information that has been in the public domain for years. They then shoved 200 pages of printouts into binders and gave them to a handpicked collection of useful idiots. Being as they’re the most transparent administration in American history, the justice department also made the information available on its website later that day – along with a note acknowledging that there wasn’t actually much to see. “The first phase of declassified files largely contains documents that have been previously leaked but never released in a formal capacity by the U.S. Government,” the note said.“This isn’t a news story, it’s a publicity stunt,” the Palm Beach lawyer Spencer Kuvin, who has worked on the case since 2005, representing nine victims, told the Miami Herald. He added that he feared that the Trump administration was using Epstein’s victims for political purposes. But then what do you expect from Trump – a guy who, in 2002 said of Epstein: “He’s a lot of fun to be with. It’s even said that he likes beautiful women as much as I do. And many of them are on the younger side.”In short, this whole big “reveal” was an embarrassing flop – so much so that it was mocked by people on the right. Even Laura Loomer, a white nationalist conspiracy theorist, thought the stunt was distasteful.“I hate to say it, but the American people can’t trust the validity of the Epstein files released today. It was released in an unprofessional manner with paid, partisan social media influencers to curate their binders for us,” Loomer tweeted on Thursday. She later added: “Sorry I won’t celebrate dancing like a school girl with a binder full of pedophile names.” When even Loomer thinks you’ve gone low, you’ve gone very low indeed.Ultimately, however, while nothing new may have been revealed in Bondi’s “Epstein files”, this grotesque stunt was very revealing. It was yet another reminder that there is nothing – not even the sex trafficking of minors – that Donald Trump and his associates won’t cynically turn into a self-serving photo opportunity. Or, I should add, an opportunity to “Rickroll” people: midday Thursday, while people were waiting for the documents to be published online, the House judiciary GOP account on X posted in all-caps: “#BREAKING: EPSTEIN FILES RELEASED.” This then redirected users to the YouTube music video for Rick Astley’s 1987 hit Never Gonna Give You Up. Classy.Also revealing was who the White House thought should get a first look at documents involving sex trafficking. Among the influencers assembled was Mike Cernovich. Who is he? Just a rightwing manosphere influencer who has said things like “rape via an alpha male is different from other forms of rape” and told men that women exist “for your sexual pleasure”.The reaction to the backlash over the Epstein files fiasco also shows how, when anything goes wrong, people in Trump’s orbit are quick to point fingers and turn on each other rather than take responsibility. Bondi, for example, responded to all the criticism by accusing the FBI of withholding information from her. Meanwhile, some of the conservative influencers who got the binders full of nothing accused the southern district of New York of hiding information.“These swamp creatures at SDNY deceived Bondi, Kash, and YOU,” the conservative media personality Liz Wheeler tweeted. “Be outraged that the binder is boring. You should be. Because the evil deep state LIED TO YOUR FACE.”Perhaps what is most revealing about this fiasco, however, is that it is a stark reminder of how justice still hasn’t been served when it comes to Epstein’s many victims. Apart from Ghislaine Maxwell, none of Epstein’s many enablers and associates have faced any real consequences. A lot of rich and powerful people have got away with disgraceful things. And that’s not a conspiracy theory; that’s just our legal system.Andrew Tate and brother land in US from Romania after travel ban liftedSpeaking of predators evading accountability, the Tate brothers, who are charged with human trafficking in Romania, landed in the US on Thursday. This comes after it was reported last week that the Trump administration had asked Romanian authorities to lift travel restrictions on the pair.View image in fullscreenAndrew Tate (foreground) with brother Tristan outside the court in Bucharest, Romania, on 9 January 2025. Photograph: Vadim Ghirdă/AP‘Pro-lifers’ are demanding women face the death penaltySelf-described “abortion abolitionists” – who oppose all abortions without any exceptions and want to criminalize the procedure and ban IVF – used to be at the fringes of the anti-abortion movement. Now, people who believe that the death penalty should be considered for women who have abortions are slowly moving into the US mainstream. Mother Jones looks at how some of these abolitionist men have turned on women in the anti-abortion movement. “We need Christian men leading the fight against abortion, not feminist women,” one of those “TheoBros” recently wrote.At least six children die of hypothermia amid freezing conditions in GazaI haven’t heard any pro-lifers get upset about this.Jeff Bezos is sending Katy Perry to spaceLast year, Perry came out with Woman’s World, her first solo single in three years and, she said, “the first contribution I have given since becoming a mother and since feeling really connected to my feminine divine”. Unfortunately, her contribution was panned so mercilessly that Perry is now taking her feminine divine as far away from the world as possible: the singer will fly to space during Blue Origin’s next (all-female) crewed mission, the Jeff Bezos-owned space company has announced. Rumour has it that if you work at the Washington Post and have any opinions that have the temerity to clash with Bezos’s, then you’ll get shot into space, too.The pill hasn’t been improved in years – no wonder women are giving up on itMisinformation from wellness influencers along with a conservative backlash against birth control is causing more people to stop taking the pill. “But there’s another, underlying problem when it comes to contraception,” writes Martha Gill. “It needs to improve … It’s common for women to be using the same methods as their mothers – or even their grandmothers. Why aren’t contraceptives getting better?”The week in porktriarchyBig news for anyone with a small child: Peppa Pig’s mother (Mummy Pig) is having a new little piglet. Not sure how they can afford three children in this day and age but maybe Mummy Pig has been trading meme coins. While I’m sure Elon “have more babies” Musk is thrilled by the baby announcement, it is not clear how Cardi B feels. The rapper has been in a feud with Peppa since 2020, ever since her daughter started ruining her Uggs by jumping in muddy puddles.Explore more on these topicsTrump administrationThe Week in PatriarchyJeffrey EpsteinPam BondiWomen (Life and style)Women (Society)GenderFeminismcommentShareReuse this content"
