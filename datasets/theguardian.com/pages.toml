h us. You agree to be responsible for maintaining the confidentiality of your passwords or other account identifiers which you choose and all activities that occur under your account.By registering on the Guardian Site, you agree that:i. your account and password are personal to you and may not be used by anyone else to access the Guardian Site;ii. you will not do anything which would assist anyone who is not a registered user to gain access to any registration area of the Guardian Site; andiii. you will not create registration accounts for the purpose of abusing the functionality of the Guardian Site, or other users; nor will you seek to pass yourself off as another user.You agree to notify us immediately if you become aware of any unauthorised use of your password or account identifiers by others.2. Termination of registrationIf you no longer wish to have a registered account, you may terminate your account by logging into your account settings and selecting ‘delete account’. Please note that if you make payments to us on a recurring basis through an active membership, contribution or subscription you will not be able to automatically delete your account online. Please follow the instructions you are given on the account deletion page and try again if you still want to delete your account. Otherwise please contact us using the contact details for your region that can be found on the help centre.If you no longer accept these terms and conditions, or any future modification to these terms and conditions, you must cease using the Guardian Site. Continued use of the Guardian Site indicates your continued acceptance of these terms and conditions.We may terminate your registered account, at our sole discretion, by emailing you at the address you have registered stating that the agreement has terminated.3. Use of material appearing on the Guardian SiteYou acknowledge that, as between Guardian and you, except for user content and advertisements (as discussed below), Guardian is the sole owner or the licensee of all content on the Guardian Site, including, without limitation, all applicable copyrights, patents, trademarks, trade secrets, trade names, logos, and other intellectual property rights thereto, as well as text, images, graphics, logos, audio, video, URLs, metadata and other material appearing on the Guardian Site (“Guardian Content”). The Guardian Site and the Guardian Content are protected by the copyright laws and other intellectual property laws of the United Kingdom, the United States and Australia and are protected globally by applicable international copyright treaties.Your use of the Guardian Site and Guardian Content is for your own personal and non-commercial use only. You may download and print extracts from the Guardian Content for your own personal and non-commercial use only, provided you maintain and abide by any author attribution, copyright or trademark notice or restriction in any material that you download or print.Without limitation, you shall not use (and you shall also not facilitate, authorise or permit the use of) the Guardian Site and/or any Guardian Content (including, any caption information, keywords or other associated metadata) for any other purpose without our prior written approval - this includes, without limitation, that you shall not use, copy, scrape, reproduce, alter, modify, collect, mine and/or extract the Guardian Content: (a) for any machine learning, machine learning language models and/or artificial intelligence-related purposes (including the training or development of such technologies); (b) for any text and data aggregation, analysis or mining purposes (including to generate any patterns, trends or correlations); or (c) with any machine learning and/or artificial intelligence technologies to generate any data or content or to synthesise or combine with any other data or content; or (d) for any commercial use.Other than as expressly set out in these terms and conditions, or otherwise approved in writing by the Guardian, you shall also not use, or facilitate, authorise or permit the use of, any (i) “robot”, “bot”, “spider”, “scraper”, “crawler” or (ii) other automated device, program, technique, tool, process, algorithm or method (whether for data gathering, mining, collection, reading, scraping, extraction or other purposes), in each case, on or in relation to the Guardian Site and/or the Guardian Content.You shall not use any service, software, device, tool, method, program, technique, algorithm or process to circumvent any restriction, condition, protection or technological measure that controls access to the Guardian Content in any way, including bypassing or circumventing any access controls or use limits of the Guardian Content (including, by way of example, robots.txt internet protocols or similar or successor protocols).For the avoidance of doubt, the Guardian reserves all rights in the Guardian Content, (including for the purposes of Article 4(3) of Directive (EU) 2019/790 on copyright and related rights in the Digital Single Market and amending Directives 96/9/EC and 2001/29/EC) and similar reserved rights in other jurisdictions, in each case, to the maximum extent permitted by applicable laws.Except as expressly authorised by the Guardian, you are not allowed to create a database in electronic or paper form comprising all or part of the material appearing on the Guardian Site.Our robots.txt notice does not, and shall not, constitute the Guardian’s permission or approval for the purposes of these terms and conditions. These terms and conditions shall prevail in all respects over our robots.txt notice.If you wish to use our content other than as permitted by these terms and conditions, or as otherwise set out in the Guardian’s Open Licence Terms, please contact us at licensing@theguardian.com or visit our Licensing websiteIf you operate a media monitoring service , then you are obliged to contact NLA Media Access Ltd directly to discuss your licensing requirements.4. Disclaimer of liabilityTo the extent permitted at law, we do not accept any responsibility for any statement in the Guardian Content. Nothing in the Guardian Content is provided for any specific purpose or at the request of any particular person. For the avoidance of confusion, we will not be liable for any loss caused as a result of your doing, or not doing, anything as a result of viewing, reading or listening to the Guardian Content or any part of it. You can access other sites via links from the Guardian Site. These sites are not under our control and we are not responsible in any way for any of their contents.We give no warranties of any kind concerning the Guardian Site or the Guardian Content. In particular, we do not warrant that the Guardian Site or any of its contents is virus free. You must take your own precautions in this respect as we accept no responsibility for any infection by virus or other contamination or by anything which has destructive properties.Although we will do our best to provide constant, uninterrupted access to the Guardian Site, we do not guarantee this. We accept no responsibility or liability for any unavailability, interruption or delay.If you are accessing the Guardian Site from the United States or Australia, the additional disclaimers and limitations of liability in Sections 14 onwards apply.5. Third party advertising on the Guardian SiteYou will see advertising material submitted by third parties on the Guardian Site. Each individual advertiser is solely responsible for the content of its advertising material. We accept no responsibility for the content of advertising material, including, without limitation, any error, omission or inaccuracy therein.If you want to advertise on the Guardian Site, please contact the sales team via this online form. The Guardian is the sole direct seller of advertising on the Guardian Site. You shall not deal with any third parties in relation to the sale and placement of advertisements on the Guardian Site, except for those third parties approved by the Guardian from time to time.6. User contentUsers of our site may be permitted to submit content for publication in various areas of the Guardian Site. Interactions with our site are governed by our Community Standards and Participation Guidelines accessible at theguardian.com/community-standards which are incorporated in these terms and conditions. You will be deemed to consent to these guidelines, and these terms and conditions, if you choose to post any content or comments to the Guardian Site.When you submit content to us, you agree and represent that you have created that content, or you have received permission from, or are authorised by, the owner of any part of the content to submit it to the Guardian Site.You or the owner of the content still own the copyright in the content sent to us, but by submitting content to us, you are granting us an unconditional, irrevocable, non-exclusive, royalty-free, fully transferable, perpetual worldwide licence to use, publish and/or transmit, and to authorise third-parties to use, publish and/or transmit your content in any format and on any platform, either now known or hereafter invented.You acknowledge and agree that when you post content on the Guardian Site or view content provided by others, you are doing so at your own discretion and risk, including any reliance on the accuracy, completeness, of that content. You further acknowledge and agree that the views expressed by you and other users in that content do not necessarily reflect the views of Guardian, and we do not support or endorse any user content. You acknowledge that we have no obligation to pre-screen, monitor, review, or edit any content posted by you and other users on the Guardian Site.We, or authorised third parties, reserve the right to cut, crop, edit or refuse to publish, your content at our or their sole discretion. We may remove your content from use at any time.We accept no liability in respect of any content submitted by users and published by us or by authorised third parties.You warrant that the content you submit to us is not obscene, threatening, harassing, libellous, deceptive, fraudulent, invasive of another’s privacy, offensive, defamatory of any person or illegal. You warrant that the content you submit to us does not infringe any patent, trademark, trade secret, copyright, or other intellectual or proprietary or privacy right of any party or individual. You agree not to (i) post content which is deliberately intended to upset or harm other users; (ii) use the Guardian Site to post or otherwise transmit content that victimises, harasses, degrades, or intimidates an individual or group of individuals on the basis of any impermissible classification, including, without limitation, religion, gender, sexual orientation, race, colour, creed, ethnicity, national origin, citizenship, age, marital status, military status or disability; (iii) post or otherwise transmit any content that contains software viruses or any other computer code, files, or programs designed to interrupt, destroy, or limit the functionality of the Guardian Site or any computer software or hardware or telecommunications equipment; (iv) upload or otherwise transmit any content, or take any other actions with respect to your use of the Guardian Site, that would constitute, or would otherwise encourage, criminal conduct or give rise to civil liability; or (v) use the Guardian Site for commercial purposes, including, without limitation, submitting any material to solicit funds or to promote, advertise or solicit the sale of any goods or services.You understand that the technical processing and transmission of the Guardian Site may involve (i) transmissions over various networks; and (ii) changes to content to conform and adapt to technical requirements of connecting networks or devices. Guardian assumes no responsibility for the deletion or failure to store postings of content or other information submitted by you or other users to the Guardian Site.If you are under 16, you confirm that you have permission of your parent or guardian to submit content.Any queries regarding copyright and your content should be directed in the first instance to rights@theguardian.com.Readers of our print products submitting content to Guardian News & Media should read our terms here.7. AppsYou may download certain Guardian apps, including “The Guardian News App” (the “Live App”), either from Guardian Sites or from third party app stores or shops (“the Apps”). All of these terms apply to the maximum extent relevant to your use of the Apps (and in particular, the terms of section 6 apply where you are using an App to submit user content to the Guardian Sites).In addition to the limitations on our liability set out in Sections 4, 17 and 18, we shall not be liable for any damage caused to, or interference with, any equipment or other apps or content of any description.8. "
