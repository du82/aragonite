title = "Swing time: playgrounds at their most artful – in pictures | Art and design | The Guardian"
description = "Play areas designed by artists and architects are celebrated in a colourful new book"
full_description = "Swing time: playgrounds at their most artful – in pictures Share on Facebook Share on Twitter Share via Email “Play and art have a lot more in common than we might think,” writes Emmy Watts, author of a new book highlighting more than 80 brilliantly imaginative play areas around the world, some of them designed by notable artists including Niki de Saint Phalle and Yayoi Kusama. Too often, playgrounds are orderly, enclosed spaces with identikit slides, swings and climbing frames. In The Art of Play, Watts celebrates examples – rocks on wheels in Melbourne, a sprawling multi-level hammock in Zagreb, a 230ft sleeping Gulliver in Valencia – that break free of the norm, encouraging adults as well as children to experience the pleasures and benefits of play. In the end, as Watts points out, art and play “derive from the same root – that of humanity’s endless creativity”. The Art of Play is published by Hoxton Mini Press Killian Fox Main image: An aerial view of The Nest in Chongqing, China, designed by 100architects. Photograph: © Rex Zou, 100architects Sat 15 Feb 2025 12.00 EST Last modified on Sat 15 Feb 2025 13.45 EST Marmara Forum Cloud Playground, Istanbul, Turkey. Opened 2020. Carve Architects. Photograph: Asli Dayioglu Share on Facebook Share on Twitter Net Prostoria in Zagreb, Croatia. Opened 2021. Designed by Numen. Photograph: Domagoj Blažević and Vanja Šolin Share on Facebook Share on Twitter Thomas Dambo’s Trolls, Germfask, Michigan, US. Opened 2014. Photograph: Isak Heartstone Share on Facebook Share on Twitter Parque Gulliver, Valencia, Spain. Opened 1990. By architect Rafael Rivera and artist Manolo Martín. Photograph: Rafael Rivera Share on Facebook Share on Twitter Play With Nature, Shanghai, China. Opened 2023. Designed by architects DL Atelier. Photograph: Zhu Yumeng Share on Facebook Share on Twitter Kraken in Shenzhen, China. Opened 2017. Artist Florentijn Hofman and architect UAP. Photograph: UAP architects. Share on Facebook Share on Twitter Woods of Net, Hakone, Japan. Opened 2009. By the artist Toshiko Horiuchi MacAdam and Tezuka Architects. Photograph: John Lander/Tezuka Architects Share on Facebook Share on Twitter Nishi-Rokugō Koen, Tokyo, Japan. Opened 1969. Photograph: Nishi-Rokugō Koen Share on Facebook Share on Twitter The Nest, Chongqing, China. Opened 2021. By 100architects. Photograph: Rex Zou Share on Facebook Share on Twitter City Museum, St Louis, Missouri, US. Opened 1997. By artist Bob Cassilly. Photograph: Edward Whealon Share on Facebook Share on Twitter Doha Modern Playground, Doha, Qatar. Opened 2022. Artist Shezad Dawood and architect Fatma Al Sahlawi. Photograph: Sarjoun Faour Share on Facebook Share on Twitter The Folds, Changzhou, China. Opened 2020. Design by Atelier Scale. Photograph: Wu Qingshan Share on Facebook Share on Twitter Topics Architecture The Observer Parks and green spaces"
