title = "Working-class artists don’t owe you anything | Art | The Guardian"
description = "<strong>Letter: </strong>The curator of the Lives Less Ordinary calls Jonathan Jones’s review into question"
full_description = "Bert Hardy, The Children of the Gorbals (Gorbal Boys), 1948. Photograph: The Estate of Bert Hardy, The Hyman Collection. Courtesy of the Centre for British PhotographyView image in fullscreenBert Hardy, The Children of the Gorbals (Gorbal Boys), 1948. Photograph: The Estate of Bert Hardy, The Hyman Collection. Courtesy of the Centre for British PhotographyArtLettersWorking-class artists don’t owe you anythingThe curator of the Lives Less Ordinary calls Jonathan Jones’s review into questionFri 28 Feb 2025 12.02 ESTLast modified on Fri 28 Feb 2025 12.04 ESTShareJonathan Jones claims that the exhibition Lives Less Ordinary seeks to define the working class as a “single, stable body”, though goes on to acknowledge the ways in which the artists featured question and expand what it might mean to be working class (Lives Less Ordinary review – is this really a fair view of the British working class?, 27 January).This is one of the entrenched myths the exhibition aims to do away with. Reflecting the nuanced intersections of class, race, religion, gender, sexuality, and migrant status, the wide-ranging selection of the artists affirms “working classness as something dynamic and plural”, as is clearly stated in one of the exhibition’s wall texts.Bringing forth expressions of pride and joy, family and community, humour and hope, the show deliberately eschews the all-too-familiar portrayals of “the ways people work and survive” that Mr Jones seems to feel working-class artists owe him.I am glad we agree that the art on display is “excellent”. But to present it recontextualised through class is, to me and many others, much more than “a heavy load of idealism”. Perhaps Mr Jones feels justified in evaluating whose experiences are “authentically” working class. I think the artists do a better job. Samantha MantonCurator of Lives Less Ordinary at Two Temple PlaceExplore more on these topicsArtClass issueslettersShareReuse this content"
author = "Guardian Staff"
year_published = 2025
