full_description = "Athens protests and Ramadan preparations: photos of the day – Friday Share on Facebook Share on Twitter Share via Email The Guardian’s picture editors select photographs from around the world Paul Bellsham Main image: Athens, GreeceA man plays guitar as people gather to protest outside the Greek parliament. Photograph: Louisa Gouliamaki/Reuters Fri 28 Feb 2025 08.12 EST Khan Younis, GazaFreed Palestinian detainees are greeted after being released from an Israeli prison after the ceasefire agreement Photograph: Abdel Kareem Hana/AP Share on Facebook Share on Twitter Tel Aviv, IsraelA memorial service for Tsachi Idan, one of four slain Israeli hostages whose bodies were handed over by Hamas in exchange for the release of more than 600 Palestinian prisoners and detainees Photograph: Atef Safadi/EPA Share on Facebook Share on Twitter Kyiv, UkraineThe family, friends and colleagues of US volunteer Ethan Hertweck gather in Maidan Square. Hertweck was killed defending Avdiivka in December 2023 and his body was exchanged this year Photograph: Svet Jacqueline/Zuma/Shutterstock Share on Facebook Share on Twitter Van, TurkeyHerders lead a flock of sheep out into the snowy fields Photograph: Necmettin Karaca/Anadolu/Getty Images Share on Facebook Share on Twitter London, UKFrans Hals’s pair of paintings Boy Playing the Violin and Girl Singing goes on public view at Sotheby’s with an estimate of $6m-$8m (£4.8m-£6.4m) Photograph: Tristan Fewings/Sotheby’s/Getty Images Share on Facebook Share on Twitter Athens, GreeceA protester lobs a molotov cocktail towards riot police as clashes break out during a rally as part of a general strike called by unions to mark the second anniversary of the country’s worst rail tragedy Photograph: Aris Messinis/AFP/Getty Images Share on Facebook Share on Twitter Athens, GreecePolice stand near flames during clashes near the Greek parliament at a protest marking the second anniversary of the country’s worst railway disaster Photograph: Louiza Vradi/Reuters Share on Facebook Share on Twitter Athens, GreeceA man plays guitar as people gather to protest outside the Greek parliament Photograph: Louisa Gouliamaki/Reuters Share on Facebook Share on Twitter Dakar, SenegalRamadan preparations take place at the Massalikoul Djinane mosque, the largest in west Africa Photograph: Anadolu/Getty Images Share on Facebook Share on Twitter Milan, ItalyA model displays a collection by Etro during Milan fashion week Photograph: Lorenzo Baroncelli/SGP/Shutterstock Share on Facebook Share on Twitter Jos, NigeriaSchoolboys stand in uniform in the central state of Plateau Photograph: Olympia de Maismont/AFP/Getty Images Share on Facebook Share on Twitter Kolkata, IndiaLabourers carry a sack of vegetables at a wholesale market Photograph: Dibyangshu Sarkar/AFP/Getty Images Share on Facebook Share on Twitter Adelaide, AustraliaBeachgoers jump from the jetty pier into the water in the coastal suburb of Henley Photograph: Amer Ghazzal/Shutterstock Share on Facebook Share on Twitter Santo Domingo, Dominican RepublicMembers of the armed forces participate in a parade for the 181st anniversary of national independence Photograph: Orlando Barría/EPA Share on Facebook Share on Twitter Jakarta, IndonesiaMuslims pray while visiting their relatives’ grave, as part of a local tradition before the holy fasting month of Ramadan Photograph: Willy Kurniawan/Reuters Share on Facebook Share on Twitter Rio de Janeiro, BrazilPeople of the Umbanda religion perform a ritual to protect themselves during carnival festivities, when they often face discrimination Photograph: Pablo Porciúncula/AFP/Getty Images Share on Facebook Share on Twitter Luanda, AngolaSemba dancers of the Amazonas de Prenda rehearse for this year’s carnival. Semba is a traditional type of music and dance from Angola that has its roots in Massemba and means ‘a touch of belly-buttons’ Photograph: Marco Longari/AFP/Getty Images Share on Facebook Share on Twitter Vienna, AustriaDancers take to the floor at the prestigious 67th Vienna Opera Ball Photograph: Lisa Leutner/Reuters Share on Facebook Share on Twitter Kathmandu, NepalAn elderly Tibetan woman prepares tea before a function to mark Losar, the Tibetan new year. A small number of exiled Tibetans gathered to celebrate the new year in the Nepali capital Photograph: Narendra Shrestha/EPA Share on Facebook Share on Twitter Rio de Janeiro, BrazilA picture of Pope Francis is projected on to the Christ the Redeemer statue, as the pontiff continues hospital treatment Photograph: AFP/Getty Images Share on Facebook Share on Twitter Chennai, IndiaA Hindu devotee adorns himself with lemons and spouts piercings during a religious procession at the Maha Shivratri festival Photograph: R Satish Babu/AFP/Getty Images Share on Facebook Share on Twitter Van, TurkeyA resident of the cat research and rehabilitation centre enjoys the snow Photograph: Ozkan Bilgin/Anadolu/Getty Images Share on Facebook Share on Twitter Topics Photography Photos of the day"
