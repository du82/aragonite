["https://theguardian.com/artanddesign/2025/feb/28/cheeky-monkeys-gored-matadors-and-trompe-loeil-masks-the-week-in-art"]
title = "Cheeky monkeys, gored matadors and trompe l’oeil masks – the week in art | Art and design | The Guardian"
description = "Alison Watt pays homage to John Soane, Ella Kruglyanskaya honours Manet, and chaos comes for civilisation"
full_description = "Sublime … Alison Watt’s Dream, 2024, oil on canvas, showing in the exhibition of the week. Photograph: John McKenzie/Alison WattView image in fullscreenSublime … Alison Watt’s Dream, 2024, oil on canvas, showing in the exhibition of the week. Photograph: John McKenzie/Alison WattArt Weekly newsletterArt and designCheeky monkeys, gored matadors and trompe l’oeil masks – the week in artAlison Watt pays homage to John Soane, Ella Kruglyanskaya honours Manet, and chaos comes for civilisation – all in your weekly dispatchJonathan JonesFri 28 Feb 2025 07.00 ESTLast modified on Fri 28 Feb 2025 07.01 ESTShareExhibition of the weekAlison Watt New paintings inspired by the sublime, poetic architecture of Georgian visionary Sir John Soane. Pitzhanger Manor, London, 5 March to 15 JuneAlso showingWilliam S Burroughs Artworks by the beat author whose best novel, Queer, was recently released as a film. October Gallery, London, 6 March to 5 AprilElla KruglyanskayaSensual, haunting figurative paintings that pay homage to Manet’s depiction of a dead matador. Thomas Dane Gallery, London, until 3 MayRhea StorrA film that documents Caribbean community groups in Wolverhampton and Sheffield. Site Gallery, Sheffield, until 25 MayTim StonerNew abstract paintings with verve, complexity and beauty. Pace gallery, London, 5 March to 12 AprilImage of the weekView image in fullscreenSamson and Delilah by Rubens. Or possibly not. Photograph: IanDagnall Computing/AlamyForty-five years after it was bought for a then record price, doubt has been cast over the authenticity of this painting, Samson and Delilah by Peter Paul Rubens. In a new book, art historian Euphrosyne Doxiadis argues that “the flowing, twisting brushstrokes that are so characteristic of Rubens are nowhere to be seen”, and that what the National Gallery has on its wall is actually a 20th-century copy of a now lost painting by the 17th-century Flemish master. Read the full storyWhat we learnedSiena was a dazzling centre of the medieval art worldLubaina Himid will represent Britain at the 2026 Venice BiennaleLeeds-based photographer Peter Mitchell had a correspondence with NasaCrime-obsessed photographer Weegee still shocks todayThe arts sector may be breaking the law with its use of internsLeigh Bowery was the ultimate exhibitionist, and also Lucian Freud’s museWomen are outperforming men in Africa’s art marketPhotography is therapy for Martin ParrMasterpiece of the weekStill Life with Fruit and Vegetables with Two Monkeys by Jan Roos, circa 1620View image in fullscreen Photograph: The National Gallery, LondonGrapes glisten and apples shine in this depiction of a cornucopian mass of beautifully luscious fruit. It’s a still life to make you slaver, yet the luxurious assembly of refreshing edibles is being stolen by two naughty monkeys who are portrayed with the same keen eye as the fruits. One is howling its excitement to the other as it holds delicious loot in each hand. Whichever human aristocrat or merchant was planning to gorge on these treats is due to be disappointed. It is an image of entropy undermining order; chaos coming for civilisation. Such intimations of decay and ultimately of mortality are common in 17th-century still life paintings, which sometimes swarm with insects or even reptiles, not to mention the odd human skull among the luxuries. But Roos takes a novel, comic line with his acute portrayal of mischievous monkeys. National Gallery, LondonSign up to the Art Weekly newsletterIf you don’t already receive our regular roundup of art and design news via email, please sign up here.Get in TouchIf you have any questions or comments about any of our newsletters please email newsletters@theguardian.comExplore more on these topicsArt and designArt Weekly newsletterPaintingPhotographyArtExhibitionsfeaturesShareReuse this content"
