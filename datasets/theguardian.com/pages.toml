title = "How to support the Guardian via cheque, patronage, or as a gift in your will  | The Guardian | The Guardian"
description = "In addition to contributing, subscribing and purchasing our daily and weekly print editions, there are a number of other ways to support the Guardian financially and help protect the future of our journalism"
full_description = "There are a wide variety of ways to support the Guardian. Photograph: Linda Nylind/The GuardianView image in fullscreenThere are a wide variety of ways to support the Guardian. Photograph: Linda Nylind/The GuardianInside the GuardianThe Guardian This article is more than 3 years oldHow to support the Guardian via cheque, patronage, or as a gift in your will This article is more than 3 years oldIn addition to contributing, subscribing and purchasing our daily and weekly print editions, there are a number of other ways to support the Guardian financially and help protect the future of our journalism Guardian staffMon 26 Apr 2021 05.13 EDTLast modified on Tue 9 Apr 2024 09.46 EDTShareJoin as a Guardian PatronTo show your support at a higher level, find out more about our Patrons programme today on this page. There are three tiers of patronage, ranging from an annual gift of £1200 to one of £5000, all with a host of exciting benefits and the opportunity to attend Guardian events throughout the year.For further questions, you can also email our Head of Patrons Shannon Lara directly at patrons@theguardian.comGive a legacy giftIf you would like to speak to us about leaving a gift to the Guardian in your will, please get in touch with our colleague Shannon Lara via email at legacy@theguardian.com.Send us a chequeIf you don’t use online banking, you can write a cheque to the Finance team in any of our three main Guardian headquarters.If you are in the UK, or the UK is your nearest location, you should make it payable to ‘Guardian News & Media Ltd’ and send it to Cash Management Department, Guardian News and Media, 90 York Way, London, N1 9GU.If you are in the US, or the US is your nearest location, you should make it out to ‘Guardian News & Media LLC’ and send it to Guardian News, Church Street Station, PO Box 3403, New York, NY 10008-340If you are in Australia, or Australia is your nearest location, you should make it out to ‘GNM Australia Pty Ltd’ and send it to Guardian Australia, 19 Foster Street, Surry Hills, NSW, 2010.Remember – every penny, dollar, euro and rupee goes towards funding our vital independent journalism and keeping it free from a paywall. Make a one-off or recurring contribution here Take out a print or digital subscription here If your question still hasn’t been answered, please contact our Membership team at membershipeditorial@theguardian.com, and we’ll be happy to assist. Thank you!Explore more on these topicsThe GuardianInside the GuardianNewspapers & magazinesNational newspapersNewspapersShareReuse this content"
