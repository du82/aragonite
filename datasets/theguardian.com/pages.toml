n Facebook Share on Twitter Gugu Mbatha photographed to accompany an interview in the Magazine. Futher images of her bringing SS25 to life can be seen here. Photograph: Rachell Smith/The Observer Share on Facebook Share on Twitter Cyndi Lauper in concert at 02 Arena, London. Photograph: Sophia Evans/The Observer Share on Facebook Share on Twitter Clair Heaviside photographed running through the Peak District for a piece on people’s varying commutes to work. Photograph: Alex Telfer/The Observer Share on Facebook Share on Twitter The family-run @miga.restaurant in Hackney, one of the top recommendations from the OFM 30, our annual list of everything we love in the world of food. Photograph: Pål Hansen/The Observer Share on Facebook Share on Twitter Pamela Anderson photographed by Venetia Scott in London for the New Review. Photograph: Venetia Scott/The Observer Share on Facebook Share on Twitter Enough to End Rape ambassadors hand out DIY rape swab kits to Bristol University students to highlight and talk about sexual violence. Photograph: Karen Robinson/The Observer Share on Facebook Share on Twitter Comedian and writer Jack Rooke photographed at Espero Studio, Brick lane, London for the Observer New Review. Photograph: Suki Dhanda/The Observer Share on Facebook Share on Twitter The Yorkshire Pasta Company based near Malton in North Yorkshire for the news article: Gourmet producers inspire a boom in British pasta. Photograph: Gary Calton/The Observer Share on Facebook Share on Twitter Martin Parr shot for the Magazine. The photographer is the subject of Lee Shulman’s documentary I Am Martin Parr. Photograph: Dan Burn-Forti/The Observer Share on Facebook Share on Twitter Jacob Dunne and Joan Scourfield at the Playhouse theatre in Nottingham. Dunne killed her son, James Hodgkinson, on a night out in Nottingham 2011. Since Dunne’s release from prison the pair have reconciled and their story has been adapted by James Graham into the play Punch. Photograph: Fabio De Paola