description = "The Les Mis novelist’s sketches are showcased in a new Royal Academy exhibition"
full_description = "Castles in the sky: the fantastical drawings of author Victor Hugo – in pictures Share on Facebook Share on Twitter Share via Email Although better known for his sprawling Romantic novels The Hunchback of Notre-Dame and Les Misérables, celebrated French author Victor Hugo spent much of his time drawing. A collection of about 70 of his sketches will soon be on display at the Royal Academy in London, in an exhibition bringing together caricatures, travel drawings and landscapes. Several of the drawings feature castles and ruins. “Hugo was inspired by ‘burgs’ – castles, fortresses or walled towns – that he saw when travelling along the Rhine, but he often drew fantastical castles that fuse memory and imagination,” says the exhibition’s curator Sarah Lea. “Hugo’s castle drawings range in tone from sinister and sublime to highly romantic and exquisitely detailed.” Astonishing Things: The Drawings of Victor Hugo is at the Royal Academy of Arts, London W1, 21 March to 29 June Kathryn Bromwich @kathryn42 Main image: Landscape With a Castle on a Cliff, 1857 by Victor Hugo. Photograph: British Museum, London Sat 1 Mar 2025 12.00 EST The Town and Castle of Vianden by Moonlight, 1871. Photograph: Maisons de Victor Hugo/Roger-Viollet Share on Facebook Share on Twitter The Cheerful Castle, c1847. Photograph: Maisons de Victor Hugo/Roger-Viollet Share on Facebook Share on Twitter The Castle With the Angel, c1863. Photograph: CCØ Paris Musées / Maisons de Victor Hugo Share on Facebook Share on Twitter Victor Hugo, The Lighthouse at Casquets, Guernsey, 1866. Photograph: Maisons de Victor Hugo/Roger-Viollet Share on Facebook Share on Twitter The Two Castles, 1850. Photograph: CC0 Paris Musées / Maisons de Victor Hugo Share on Facebook Share on Twitter The Castle With the Cross – Fortuné-Louis Méaulle (1843–1916). Photograph: CCØ Paris Musées / Maisons de Victor Hugo Share on Facebook Share on Twitter The Town of Vianden, With Stone Cross, 1871. Photograph: Bibliothèque Nationale de France Share on Facebook Share on Twitter Landscape With a Castle on a Cliff, 1857. Photograph: British Museum, London Share on Facebook Share on Twitter Topics Drawing The Observer Victor Hugo Exhibitions Art"
