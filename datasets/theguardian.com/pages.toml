["https://theguardian.com/business/2025/feb/16/forget-trumps-tariffs-the-presidents-bond-market-threat-is-worse"]
title = "Forget Trump’s tariffs, the president’s bond market threat is worse | Heather Stewart | The Guardian"
description = "Elon Musk’s crazed takeover of America’s financial plumbing risks shattering confidence in US institutions and in turn global financial stability"
full_description = "The Trump administration is engaged in a sort of fast-track austerity ostensibly aimed at improving the government’s balance sheet. Photograph: Sipa US/AlamyView image in fullscreenThe Trump administration is engaged in a sort of fast-track austerity ostensibly aimed at improving the government’s balance sheet. Photograph: Sipa US/AlamyEconomics viewpointGlobal economyForget Trump’s tariffs, the president’s bond market threat is worseHeather StewartElon Musk’s crazed takeover of America’s financial plumbing risks shattering confidence in US institutions and in turn global financial stabilitySun 16 Feb 2025 07.10 ESTLast modified on Sun 16 Feb 2025 10.43 ESTShareWhen Donald Trump gave an in-flight press conference en route to the Super Bowl last week, it generated a flurry of news, from the fresh threat of steel tariffs to the declaration of “Gulf of America Day”.Much less remarked upon was a throwaway comment about the US’s financial obligations, which underlined the fact that tariffs are far from the only way in which Trump is jeopardising economic stability.“We’re even looking at Treasuries,” the president told reporters. “There could be a problem … It could be that a lot of those things don’t count. In other words, that some of that stuff that we’re finding is very fraudulent, therefore maybe we have less debt than we thought.”The suggestion was that opening up the US Treasury’s data to Elon Musk’s “department of government efficiency” team had identified a money-saving wheeze: why not walk away from some of America’s debt obligations – a “selective default”, as economists call it.Like so many of the serially erratic president’s pronouncements, this one had to be “walked back”, as the Americans call it. Kevin Hassett, his economic adviser, stressed the next day that Trump was referring to other payments that the US Treasury had been making, not its $36tn (£28.6tn) in debt obligations. Hassett suggested the Treasury “had been “sending money out without flagging what it was for”.Yet just entertain for a moment the idea that a US administration might decide it could unilaterally default on even a small portion of its debts. The result would be catastrophic. Because of the dollar’s status as the world’s reserve currency, the yield on US Treasuries – US government bonds – is perhaps the most important benchmark in global financial markets.Donald Trump sees his trade war as a show of strength. In fact, it’s the opposite | Larry ElliottRead moreIf investors suddenly began demanding a higher yield – in effect the interest rate – as insurance against the risk they would not get their money back, the effects would ripple through the trillions of dollars of other assets worldwide priced with reference to supposedly super-safe Treasuries.Hassett made clear this is absolutely not an outcome the saner elements of Trump’s administration were aiming for. Indeed, the treasury secretary, Scott Bessent, has said the president wants to bring down the yield on 10-year US government borrowing costs.Yet as a result of Musk’s crazed takeover of the financial plumbing of the state, the US is already welching on its obligations – moral and financial – all over the world.Every day seems to bring fresh examples: health clinics in the developing world being closed because of the dismantling of USAid; researchers whose projects funded by the National Institutes of Health have been put on hold.Officials from the city administration in New York have even claimed the government in effect dipped into the city’s bank account to claw back $80m in federal grants that had already been made.This fast-track austerity is ostensibly aimed at improving the government’s balance sheet – putting the US through “the private equity wringer”, as Wired’s Brian Barrett put it last week.But the Musk/Trump takeover simultaneously risks shattering confidence in US institutions, in a way that is liable to have long-lasting and unpredictable consequences.Five former treasury secretaries warned in an extraordinary New York Times editorial last week of the risks of letting Musk loose on the nation’s financial system.“Any hint of the selective suspension of congressionally authorised payments will be a breach of trust and ultimately, a form of default. And our credibility, once lost, will prove difficult to regain,” they said.Musk has faced legal action and is targeting arms of government with which he has a particular beef, meaning the chances of anything that looks like a formal default remain low.View image in fullscreenPresident Donald Trump speaks as Elon Musk carries his son X on his shoulders in the Oval Office. Photograph: Kevin Lamarque/ReutersBut the whole performance – as exemplified by a rambling Oval Office briefing involving Trump, Musk and his son X (who has the same name as the social media platform formerly known as Twitter) – screams “political risk”, as analysts would call it if it was happening elsewhere in the world.It would not be surprising if efforts to spur the development of alternative global reserve currencies and payments structures – such as those proposed by nations in the global south – are given added impetus by the shenanigans in Washington.The sheer insularity of the Trump administration’s approach was illustrated on Friday when Bessent – supposedly one of the more sensible figures in the administration – said: “The US has a strong dollar policy, but because we have a strong dollar policy it doesn’t mean that other countries get to have a weak currency policy.”In the short term, the most immediate impact of Trump’s plans on the global economy is likely to be via his long-trailed tariffs plan, which will throw sand in the wheels of the international trading system.All of this is likely to dampen growth, and if trade analysts are right that Trump’s latest idea of “reciprocity”, based on each country’s existing tariff and VAT rates, is the opening bid in a negotiation, it may be weeks or even months before any clarity emerges.Given this corrosive uncertainty, markets have so far been remarkably quiescent in the face of Trump’s wayward trade policy, and appear to be relatively unconcerned about Musk’s slash-and-burn mission, for now.They have been putting their faith in the mighty US consumer, and the economy’s powerful and innovative tech sector, to feed the narrative of US “exceptionalism”.But every week of the Trump/Musk show in Washington surely increases the threat of a structural shift in how investors view the US economy – which would ultimately be felt around the world.Explore more on these topicsGlobal economyEconomics viewpointUS economyTrump administrationElon MuskBondsEconomicsUS politicscommentShareReuse this content"
