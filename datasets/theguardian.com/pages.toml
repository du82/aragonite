full_description = "From leaping mudskippers to volcanic eruptions: the World Nature Photography awards 2025 – in pictures Share on Facebook Share on Twitter Share via Email The World Nature Photography awards have announced their winners for 2025. From white-cheeked terns to a blue-tailed damselfly peeking through a daisy, the photographs are a stark reminder of the beauty and chaos of the natural world. The top award went to Maruša Puhek’s image of two deers running through a Slovenian vineyard Main image: A blue-spotted mudskipper leaps in the air in a territorial display, captured on the intertidal mudflats of Roebuck Bay, Broome, Western Australia. Gold in the behaviour – amphibians and reptiles category. Photograph: Georgina Steytler/World Nature Photography Awards Fri 28 Feb 2025 09.00 EST Two deer run through a snow-covered vineyard – Murščak, SloveniaGold and grand prize of World Nature Photographer of the Year Photograph: Maruša Puhek/World Nature Photography awards Share on Facebook Share on Twitter Flower praying mantis perched atop a Cordyceps mushroom – Guangdong province, ChinaBronze in the plants and fungi category Photograph: Irina Petrova/World Nature Photography awards Share on Facebook Share on Twitter Fox – Lac La Biche, Alberta, Canada Bronze in the behaviour mammals category Photograph: Donna Feldichuk/World Nature Photography awards Share on Facebook Share on Twitter Volcanic eruption on the Reykjanes peninsula – Svartsengi, Reykjanes, Iceland Gold in the nature photojournalism category Photograph: Ael Kermarec/World Nature Photography awards Share on Facebook Share on Twitter A chained Asian elephant – Bardiya national park, NepalBronze in the nature photojournalism category Photograph: Charlotte Keast/World Nature Photography awards Share on Facebook Share on Twitter Great grey owl – California, USSilver in the urban wildlife category. Photograph: Elizabeth Yicheng Shen/World Nature Photography awards Share on Facebook Share on Twitter Lanternflies – Danum Valley, Sabah, Malaysia Gold in the animal portraits category Photograph: Khaichuin Sim/World Nature Photography awards Share on Facebook Share on Twitter Sri Lanka junglefowl – Sri Lanka Silver in the nature art category Photograph: Pandula Bandara/World Nature Photography awards Share on Facebook Share on Twitter Two white-cheeked terns – Kubbar Island, Kuwait Bronze in the behaviour – birds category Photograph: Mohammad Murad/World Nature Photography awards Share on Facebook Share on Twitter Paepalanthus – Veadeiros Tablelands, Brazil Gold in plants and fungi category Photograph: Marcio Esteves Cabral/World Nature Photography awards Share on Facebook Share on Twitter Sea turtle – Abu Dabbab, Egypt Silver in underwater category Photograph: Sina Ritter/World Nature Photography awards Share on Facebook Share on Twitter Red knots – Snettisham, Norfolk, England Gold in behaviour – birds category Photograph: Clive Burns/World Nature Photography awards Share on Facebook Share on Twitter Blue-tailed damselfly – Cotswold water park, near Cirencester, Gloucestershire Silver in behaviour – invertebrates category Photograph: Rory J Lewis/World Nature Photography awards Share on Facebook Share on Twitter Polar bear – Svalbard, Norway Gold in behaviour – mammals category Photograph: Tom Nickels/World Nature Photography awards Share on Facebook Share on Twitter Five cheetah feed on a young hartebeest – Olare Conservancy, Kenya Gold in black and white category Photograph: Paul Goldstein/World Nature Photography awards Share on Facebook Share on Twitter Fishermen harvest anchovies – Phú Yên, Vietnam Gold in the people and nature category Photograph: Robert Middleton/World Nature Photography awards Share on Facebook Share on Twitter Male hippos fight in golden light – Mana Pools, Zimbabwe Silver in behaviour – mammals category Photograph: Jonathan Hodgetts/World Nature Photography awards Share on Facebook Share on Twitter Austfonna ice cap - Svalbard, Norway Silver in the nature photojournalism category Photograph: Thomas Vijayan/World Nature Photography awards Share on Facebook Share on Twitter Grand Prismatic spring – Yellowstone national park, USBronze in the planet earth’s landscapes and environments category Photograph: Brian Creek/World Nature Photography awards Share on Facebook Share on Twitter Robber fly – BelgiumGold in the behaviour – invertebrates category Photograph: Niki Colemont/World Nature Photography awards Share on Facebook Share on Twitter Hyalite Lake – Montana, US Gold in the planet earth’s landscapes and environments category Photograph: Jake Mosher/World Nature Photography awards Share on Facebook Share on Twitter Silverback mountain gorilla – UgandaSilver in the black and white category Photograph: Tom Way/World Nature Photography awards Share on Facebook Share on Twitter Topics Photography Animals Marine life Wildlife Insects Birds Animal behaviour"
