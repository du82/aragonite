full_description = "The week around the world in 20 pictures Share on Facebook Share on Twitter Share via Email Russian bombs hit Ukraine, protests in Greece, prayers for the Pope and Milan fashion week: the past seven days as captured by the world’s leading photojournalists Warning: this gallery contains images that some readers may find distressing Jim Powell @jimpowell2002 Main image: A model wears a creation of the Diesel fall/winter 2025/26 women’s collection during Milan fashion week Photograph: Antonio Calanni/AP Fri 28 Feb 2025 14.42 EST Last modified on Fri 28 Feb 2025 18.31 EST Athens, GreeceProtesters clash with riot police on the sidelines of a rally marking the two-year anniversary of the Tempe train crash at Syntagma Square in Athens. Photograph: George Vitsaras/EPA Share on Facebook Share on Twitter West BankPalestinians disperse as Israeli tanks enter the Jenin camp for refugees in the occupied West Bank. Photograph: Jaafar Ashtiyeh/AFP/Getty Images Share on Facebook Share on Twitter Tel Aviv, IsraelDana Shem Tov, the sister of Israeli hostage Omer Shem Tov, reacts as she watches his televised release by Hamas militants at the family home in Tel Aviv. Photograph: John Wessels/AFP/Getty Images Share on Facebook Share on Twitter Kyiv, UkraineUkrainian soldiers carry the coffin of US Marine Corps veteran and volunteer combat medic Ethan Hertweck during a memorial ceremony at Independence Square in Kyiv. Photograph: Thomas Peter/Reuters Share on Facebook Share on Twitter Washington, DC, USUS President Donald Trump and Ukraine’s President Volodymyr Zelenskyy having a heated argument in the Oval Office of the White House in Washington DC. Photograph: Saul Loeb/AFP/Getty Images Share on Facebook Share on Twitter Kostiantynivka, UkraineA man lies wounded after Russian air-guided bombs hit the city centre of Kostiantynivka. According to officials five people died and another eight were injured, mostly residents walking to the nearby market and shops. Photograph: Wojciech Grzedzinski/Anadolu/Getty Images Share on Facebook Share on Twitter Chasiv Yar, UkraineUkrainian servicemen fire a BM-21 Grad multiple-launch rocket system toward Russian troops on a frontline near the town of Chasiv Yar. Photograph: Oleg Petrasiuk/Ukrainian Armed Forces/Reuters Share on Facebook Share on Twitter Athens, GreeceProtesters clash with police in front of the Greek parliament during a protest marking the second anniversary of the country’s worst railway disaster, in Athens. Photograph: Louisa Gouliamaki/Reuters Share on Facebook Share on Twitter Berlin, GermanyPolice officers remove counter protesters blocking the route of a far-right demonstration, a day before the German election, in Berlin. Photograph: Ebrahim Noroozi/AP Share on Facebook Share on Twitter Cheonan, South KoreaRescue workers participate in a salvage operation at a collapsed highway construction site in Cheonan. Photograph: Kim Hong-Ji/Reuters Share on Facebook Share on Twitter West BankIsraeli soldiers take positions in the Jenin camp for Palestinian refugees in the occupied West Bank. Photograph: Jaafar Ashtiyeh/AFP/Getty Images Share on Facebook Share on Twitter Khan Younis, GazaFreed Palestinian detainees are greeted in Khan Younis after being released from an Israeli prison following the ceasefire agreement between Hamas and Israel. Photograph: Abdel Kareem Hana/AP Share on Facebook Share on Twitter Washington DC, USElon Musk, head of the Department of Government Efficiency, delivers remarks during a cabinet meeting held by Donald Trump at the White House. Photograph: Andrew Harnik/Getty Images Share on Facebook Share on Twitter Bukavu, Democratic Republic of the CongoResidents climb atop a monument surrounded by Congolese flags after a rally organised by civil society groups in support of the M23 movement and against the central Congolese government in Bukavu. Photograph: Luis Tato/AFP/Getty Images Share on Facebook Share on Twitter Goma, Democratic Republic of the CongoCongolese police officers board a truck headed for a training site during an enrolment of civilians, police officers, and former members of the Democratic Republic of Congo armed forces, who allegedly decided to join the M23 movement voluntarily in Goma. Photograph: Michel Lunanga/AFP/Getty Images Share on Facebook Share on Twitter Vatican CityPeople take part in a prayer service at St Peter’s Square as Pope Francis continues his hospitalisation. Photograph: Dylan Martinez/Reuters Share on Facebook Share on Twitter Guwahati, IndiaAlmost 9,000 participants from tea garden areas across the state of Assam rehearse at Sarusajai Stadium before an attempt at a jhumur dance world record. Jhumur is a traditional form of folk dance practiced in the north-east. Photograph: Anupam Nath/AP Share on Facebook Share on Twitter Milan, ItalyA model wears a creation of the Diesel fall/winter 2025/26 women’s collection during Milan fashion week. Photograph: Antonio Calanni/AP Share on Facebook Share on Twitter Henningsvær, NorwayTourists visit the harbour in Henningsvær. Photograph: Olivier Morin/AFP/Getty Images Share on Facebook Share on Twitter São Paulo, BrazilNur, the first polar bear cub born in Latin America, walks towards her mother, Aurora, at the São Paulo aquarium. Photograph: Isaac Fontana/EPA Share on Facebook Share on Twitter Topics World news Twenty photographs of the week Greece Palestinian territories Ukraine Vatican Germany South Korea"
