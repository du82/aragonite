["https://theguardian.com/artanddesign/2024/nov/29/a-renaissance-pooch-pop-art-hammers-and-northern-landscapes-the-week-in-art"]
title = "A Renaissance pooch, pop art hammers and sublime northern landscapes – the week in art | Art and design | The Guardian"
description = "Parmigianino puts an alternative slant on Christmas, Jim Dine displays his tools, and Gabrielle Goliath takes a global view of male violence"
full_description = "A Highland Landscape by John Knox at Romance to Realities at the Laing Art Gallery, Newcastle. Photograph: www.bridgemanart.comView image in fullscreenA Highland Landscape by John Knox at Romance to Realities at the Laing Art Gallery, Newcastle. Photograph: www.bridgemanart.comArt Weekly newsletterArt and design This article is more than 2 months oldA Renaissance pooch, pop art hammers and sublime northern landscapes – the week in artThis article is more than 2 months oldParmigianino puts an alternative slant on Christmas, Jim Dine displays his tools, and Gabrielle Goliath takes a global view of male violence – all in your weekly dispatchJonathan JonesFri 29 Nov 2024 07.11 ESTLast modified on Fri 29 Nov 2024 07.14 ESTShareExhibition of the weekParmigianino: The Vision of Saint JeromeThe brilliant, audacious artist who inspired John Ashbery’s poem Self-Portrait in a Convex Mirror stars in a Christmas exhibition with an alternative slant. National Gallery, London, from 5 December until 9 MarchAlso showingJim Dine: Tools and DreamsPrints of all-American handsaws, hammers and other homely tools by this veteran pop artist. Cristea Roberts Gallery, London, until 18 JanuaryGabrielle Goliath / Personal AccountsA global perspective on male violence, from Johannesburg to Edinburgh, through video and sound art. Talbot Rice Gallery, Edinburgh, until 15 FebruaryRomance to Realities: The Northern Landscape and Shifting IdentitiesJohn Martin and Joan Eardley are among the artists of the northern landscape in a show sure to be sublime. Laing Art Gallery, Newcastle, until 26 AprilJakkai Siributr: There’s No PlaceRadical textiles that explore subjects from grief and memory to the trauma suffered by refugees. Whitworth Art Gallery, Manchester, until 16 MarchImage of the weekView image in fullscreenJustin Sun eats his banana artwork. Photograph: Peter Parks/AFP/Getty ImagesCryptocurrency entrepreneur Justin Sun spent $6.2m (£4.88m) on TitledComedian, the conceptual work created by the Italian artist Maurizio Cattelan, which featured a banana duct-taped to a wall. To celebrate his purchase Sun then ate the edible artwork. Read the full story to find out how it tasted.What we learnedA Banksy in Bristol can be yours if you buy the building it’s painted onSteve McQueen has a fresh take on the history of protest in BritainBarbara Hepworth had “recipes” for making sculpturesThe $121m sale of his most famous painting tells us much about MagritteSurreal exhibitions are celebrating the art of the absurdPalestinian artists are planning a Gaza BiennaleAndré-Charles Boulle’s ravishing timepieces are keeping London ticking overDorothea Rockburne’s first big UK show is built around a single, mesmerising lineTate’s show about art and tech before the internet could have told a darker storyAn exhibition in Adelaide is celebrating the revolutionary force of textilesMasterpiece of the weekFête in a Wood by Nicolas Lancret c1722View image in fullscreen Photograph: AlamyPeople party and feast, eating, drinking and chatting under softly green-blue trees in this bustling festival. But has it got anything to do with reality? Lancret is influenced by Antoine Watteau, who painted exquisitely unreal pastoral scenes – but Watteau’s rustic idylls, which like this canvas can be seen at London’s Wallace Collection, are much more ethereal and poetic than Lancret’s robust carnival. Watteau, who died young in 1721 shortly before Lancret painted this, created a perfumed paradise of lovers and dreamy woodlands. Lancret brings that vision down to earth with a slight thud: from one point of view he’s simply not as good. His lines are harsher, his people more dully solid. And yet, he is also doing something new here as he blends a refined courtly vision with what looks like a glimpse of a country carnival, with people who are not aristocrats but bourgeois and plebeian. It’s like seeing a fairytale dramatised as a slice of contemporary life. The Wallace Collection, LondonSign up to the Art Weekly newsletterIf you don’t already receive our regular roundup of art and design news via email, please sign up here.Get in TouchIf you have any questions or comments about any of our newsletters please email newsletters@theguardian.comExplore more on these topicsArt and designArt Weekly newsletterPaintingPhotographyArtExhibitionsfeaturesShareReuse this content"
