["https://theguardian.com/culture/2025/feb/27/save-our-pipe-organs-they-provided-the-chest-thumping-heavy-metal-of-their-day"]
title = "Save our pipe organs – they provided the chest-thumping heavy metal of their day  | Heritage | The Guardian"
description = "<strong>Letter: </strong>Bravo to the musician Mark Mynett for calling out the loss of these instruments as churches close, writes <strong>Stephen Wilcox</strong>"
full_description = "Mark Mynett and Anabelle Iratni of Plague of Angels, photographed in Greater Manchester. Photograph: Richard Saker/The ObserverView image in fullscreenMark Mynett and Anabelle Iratni of Plague of Angels, photographed in Greater Manchester. Photograph: Richard Saker/The ObserverHeritageLettersSave our pipe organs – they provided the chest-thumping heavy metal of their day Bravo to the musician Mark Mynett for calling out the loss of these instruments as churches close, writes Stephen WilcoxThu 27 Feb 2025 13.05 ESTLast modified on Thu 27 Feb 2025 13.08 ESTShareMark Mynett is right – there is a risk that, as churches close and are repurposed, we lose their pipe organs along with them (UK churches need open-mindedness to preserve heritage says heavy metal musician, 23 February).It’s not surprising that a metal musician is calling this out: until the invention of electronic amplification, previous generations who loved loud music would have needed to head to their local church (or town hall, masonic lodge, or any of the other venues housing these marvellous instruments) to get their fix of chest-thumping volume.Our small charity is now trying to do something about it. Interested metalheads, church music lovers and those who appreciate fine and complex machines are invited to join as we try to save this important part of our heritage.Stephen WilcoxTreasurer, Pipe Up for Pipe Organs Have an opinion on anything you’ve read in the Guardian today? Please email us your letter and it will be considered for publication in our letters section.Explore more on these topicsHeritageArchitectureMetallettersShareReuse this content"
