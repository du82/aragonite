["https://theguardian.com/commentisfree/2025/mar/01/trumps-style-of-petty-domination-was-in-full-display-with-zelenskyy"]
title = "Trump’s style of petty domination was in full display with Zelenskyy | Moira Donegan | The Guardian"
description = "Trump and Vance, I think, never really intended to have a conversation with Zelenskky. Instead, they wanted to look tough on TV"
full_description = "‘Manliness seems to be all that Trump aspires to: and he defines it, almost exclusively as cruelty.’ Photograph: Brian Snyder/ReutersView image in fullscreen‘Manliness seems to be all that Trump aspires to: and he defines it, almost exclusively as cruelty.’ Photograph: Brian Snyder/ReutersOpinionDonald TrumpTrump’s style of petty domination was in full display with ZelenskyyMoira DoneganTrump and Vance, I think, never really intended to have a conversation with Zelenskky. Instead, they wanted to look tough on TVSat 1 Mar 2025 12.00 ESTLast modified on Sat 1 Mar 2025 12.03 ESTShareThe last time Donald Trump did this, it was in secret, and he got impeached over it. In 2019, Donald Trump, on a phone call with Volodymyr Zelenskyy, demanded that the Ukrainian president produce – or fabricate – evidence of wrongdoing by Hunter Biden, the son of Trump’s eventual opponent in the 2020 election, in exchange for continued US military aide.At the time, Russia had already seized control of the Ukrainian region of Crimea, and was funding violent insurgent groups in the country’s east; it was increasingly clear that a full-scale Russian invasion was coming, as it finally did in 2022. Since the end of second world war, it has been America that checks Russian expansionist ambitions in Europe – America that provided the backstop to the Nato alliance, America that secured the independence of eastern Europe. Trump wanted to condition that longstanding role on Zelenskyy doing him a personal political favor. The international order could be ended, he suggested, if those who depended on him didn’t do enough to indulge his vanity, self-interest and impulsive whims.Something similar was already afoot earlier this week, when Trump summoned Zelenskyy to Washington at the last minute to pressure him to sign a mineral rights deal. Trump wanted to make continued American support for Ukraine’s military effort contingent on American involvement in the country’s mineral industry. But the deal that was offered to Zelenskyy in fact contained no security guarantees: it offered something less like a bilateral agreement and more like a shakedown. Nevertheless Zelenskyy, who is leading a besieged people in danger of losing their country, seemed willing to take it – even after Trump called him a “dictator” last week.But things went downhill from there. Trump seemed determined to antagonize Zelenksyy, making a passive aggressive remark about what the Ukrainian president was wearing when he arrived at the White House. (Sources close to Trump leaked to Semafor that the administration was also displeased with Zelenskyy’s “body language”.) In a meeting in the Oval Office, with film crews and reporters present, the US vice-president, JD Vance, began berating Zelenskyy for what he alleged was the Ukrainian president’s disinterest in diplomacy, by which he seems to have meant a Ukrainian surrender on Russia’s terms.When Zelenskyy countered that Russia has not been a reliable partner, breaking promises to Ukraine repeatedly in past ceasefires, Vance began berating him that he was not grateful enough for US support. “I think it’s disrespectful for you to come into the Oval Office and try to litigate this in front of the American media,” said Vance, who had initiated the confrontation with cameras in the room, in a practiced cadence. “Have you said thank you once?” Zelenskyy has in fact said “thank you” to the United States many times, including at the outset of the meeting. Both Trump and Vance began raising their voices, ignoring Zelenskyy’s attempts to speak and impugning both his leadership and his personal character. Zelenskyy was soon kicked out, and left the White House without signing the minerals agreement that Trump had nominally summoned him from Ukraine to conclude.It is clear that the post-second world war international order is over. It is clear that Europe will have to look elsewhere, and not to the United States, for its security, and that America will increasingly be isolated among nations, without allies to advance its interests abroad and without friends to share the benefits of science, culture and commerce. Few world leaders, after all, are willing to make deals with such a mercurial partner; fewer still are willing to try, if the attempt will be met with public humiliation in such brutish and bullying style.It is clear that other great powers, including those who do not share what were once America’s stated principles of justice, democracy and human dignity, will fill this vacuum, to America’s detriment. It is clear that Donald Trump does not intend to check Vladimir Putin’s expansionist ambitions – that he will force a deal in the Ukraine war on Russia’s terms, that Zelenskyy himself will likely be exiled or killed in the aftermath, and that other countries in Europe are in danger.In the hours after the meeting, many world leaders publicly voiced their support for Zelenskyy, including the Polish prime minister, Donald Tusk. Like him, they stand on the edge of an uncertain future. Russia is on the march, indifferent to borders, laws and freedoms, and the United States will no longer stop them. As an American, I was embarrassed by the display. I am also, now, very scared.Because what Trump did to Zelenskyy on Friday is not a departure from his style: it is entirely typical of his domineering approach to politics – one in which violence or harm is threatened to extort his preferred outcomes, and in which good faith negotiation or even basic dignity is shrugged off in favor of petty displays of domination and cruelty.Trump and Vance, I now think, never really intended to have a conversation with Zelenskky: they intended, instead, to try to make themselves look tough on TV by humiliating him. Jake Paul, a boxer, influencer and alleged crypto scammer who has been a booster of Donald Trump, said of the televised shouting match against a head of state, “This isn’t attacking. This is called being a MAN.”Manliness seems to be all that Trump aspires to: and he defines it, almost exclusively as cruelty. Both on the international stage and on the domestic one, Trump and the crowd of racist, misogynist and endlessly immature idiots who surround him will stop at nothing to prove what men they are – no matter how much America suffers, or how many people die, in the process. At the meeting, when Zelenskky tried to persuade Trump to feel differently about the prospect of Russian expansion, Trump cut him off. “Don’t tell us what we’re going to feel,” he said. “We’re going to feel very good. We’re going to feel very good and very strong.” Maybe he does. Moira Donegan is a Guardian US columnist Explore more on these topicsDonald TrumpOpinionVolodymyr ZelenskyyUS politicsUkraineRussiaJD VancecommentShareReuse this content"
