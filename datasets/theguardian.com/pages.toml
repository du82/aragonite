["https://theguardian.com/books/2025/feb/16/favourite-jane-austen-characters-250-anniversary-emma-pride-and-prejudice"]
title = "Jane’s world: fans and admirers pick their favourite Austen characters | Jane Austen | The Guardian"
description = "Helen Fielding, David Baddiel, Nicola Sturgeon and other cultural figures celebrate the great writer’s 250th birthday"
full_description = "Illustration by Eleanor Shakespeare.View image in fullscreenIllustration by Eleanor Shakespeare.The ObserverJane AustenJane’s world: fans and admirers pick their favourite Austen charactersHelen Fielding, David Baddiel, Nicola Sturgeon and other cultural figures celebrate the great writer’s 250th birthdayIntroduced by Rachel CookeSun 16 Feb 2025 03.00 ESTLast modified on Sun 16 Feb 2025 12.59 ESTShareSome will mark the 250th anniversary of Jane Austen’s birth quietly, by reading the novels. For them, it will be more than enough simply to turn the pages of Emma or Persuasion; to read and absorb that unequalled prose for the umpteenth time. But if you’re the kind of person who enjoys more public-facing (let us not say more cheesy) commemorations, then the coming months are nothing if not action-packed. So much is in store, in fact, that the New York Times recently put “Jane Austen’s England” – a realm that embraces the counties of Hampshire, Wiltshire, Somerset and Surrey – ahead of the Galápagos Islands as the No 1 place to visit in the world in 2025.Let us begin in Bath, for as Catherine Morland puts it in Northanger Abbey: “Oh! Who can ever be tired of Bath?” (Her creator, of course, was less of a fan, and liked to satirise it.) In September, the city will host an anniversary edition of its Jane Austen festival, to include a costumed promenade through its streets and a ball with a seaside theme inspired by the uncompleted Sanditon. Naturally, the chance to wear a sprigged muslin dress or pair of tight breeches will be thrilling for some, but if role-play is not your thing, there’s always tea and a Bath bun to be had in the elegant confines of the Pump Room (Austen once wrote in a letter of “disordering my stomach with Bath bunns”).At Chawton in Hampshire, where she lived for the last eight years of her life, Jane Austen’s House will stage Austenmania!, devoted to screen adaptations of her books; it will also host a “dress up day”. At Winchester Cathedral, where she’s buried, a statue by Martin Jennings will be unveiled and the manuscript of her poem To the Memory of Mrs Lefroy exhibited for the first time. (Anne Lefroy, a friend and an early encourager, died in a riding accident in 1804.) More excitingly, perhaps, No 8 College Street, where Austen died on 18 July 1817, is to open to the public, also for the first time. Finally, in Southampton, where she lived between 1806 and 1809, her travelling writing desk, on loan from the British Library, is on show at God’s House Tower; made of mahogany and with a concealed drawer, it was given to her by her father when she was still a teenager.Quick GuideJane AustenShowJane Austen was born in Steventon, Hampshire, on 16 December 1775, the daughter of an Anglican rector. She wrote six novels. Four were published during her lifetime: Sense and Sensibility (1811); Pride and Prejudice (1813); Mansfield Park (1814) and Emma (1816). Northanger Abbey and Persuasion were published in December 1817, the year after her deathafter her death in July that year. She had begun another novel, Sanditon, but left it unfinished. She also left behind the short, epistolary novella, Lady Susan, and another unfinished novel, The Watsons. Her writing brought her little fame during her life but since her death at the age of 41 her novels have rarely been out of print.Photograph: Pictorial Press Ltd/https://www.alamy.comWas this helpful?Thank you for your feedback.To my eyes, all this is joyful; how wondrous to see a writer sail on like this down the centuries, more cherished than ever. But it’s also rather hectic: a superficial blur of which Austen herself would doubtless rather have disapproved. In the end, it is important to go back to the books, to their wit, their wisdom, their clever plots. And with this in mind, we asked a range of Austen lovers to name their favourite characters and to tell us why. Personally, I don’t agree even the slightest bit with what Nicola Sturgeon has to say about Austen’s characters generally, but like her, I have a special fondness for Anne Elliot in Persuasion, Austen’s last completed novel. Anne’s early brokenheartedness and hard-won lucidity always move me – and who could ever read the pages in which she and Captain Wentworth reaffirm their love for one another without feeling that their heart may be about to burst?Helen FieldingElizabeth Bennet in Pride and PrejudiceView image in fullscreenKeira Knightley as Elizabeth Bennet and Matthew Macfadyen as Mr Darcy in the 2005 film Pride & Prejudice. Photograph: Entertainment Pictures/AlamyElizabeth Bennet is probably my favourite character in all literature. I was about 14 when I read Pride and Prejudice and it was the first time I saw a woman who I recognised and wanted to be. Elizabeth Bennet sees the ridiculous in people. She’s also full of joie de vivre and really plucky – she stands up to Mr Darcy and sticks it to him. She has integrity, too, and the courage to say no to Mr Collins and see if she can marry for love. Then she manages to make a self-mocking, very sophisticated joke, telling her sister that it might have been when she saw Mr Darcy’s great big house that she fell for him. She’s still a role model, and I suppose I took a lot of her qualities for Bridget.Helen Fielding is the author of Bridget JonesMonica AliEmma Woodhouse in EmmaView image in fullscreenGwyneth Paltrow as Emma Woodhouse in Douglas McGrath’s 1996 film Emma. Photograph: Miramax/Allstar“I am going to take a heroine whom no one but myself will much like.” Austen’s famous declaration about Emma, the meddlesome matchmaker, know-it-all and inveterate snob, might have been mischievous, but “handsome, clever and rich” is a description unlikely to engage the reader’s sympathies. Possessed of boundless confidence, Emma blunders and errs, and adroitly reasons away her worst mistakes. These mental gymnastics, served up in Austen’s trademark style, are as hilarious as they are self-serving. And yet. Emma is my favourite, and not just because it’s joyous to read between the lines to see what she cannot see. Ultimately, Emma has a good heart. She is ashamed of her mockery of Miss Bates when Knightley delivers a stern rebuke. She overcomes her prejudices and is happy for Harriet when she eventually marries Robert Martin. And Emma is the exemplar of the dangers inherent in strong and instantly formed opinions, in being convinced of our own moral and social rectitude. In this age of hot takes, swift condemnations and tribal attitudes, we could all do with being a bit more like her.Monica Ali is the author of several novels, including Love MarriageFrank Cottrell BoyceJane Austen herselfMy favourite Jane Austen character is definitely Jane Austen. No matter how vivid and immediate the scenes and character she creates, you’re always aware that she’s there, in the corner, watching. Most of all, I love those moments where she makes you feel that you’re there in the Jane corner with her and she’s quietly digging you in the ribs, or whispering some smart, superior snark to you. She’s letting you know that she’s too cool for the world she’s created, and that makes you feel that you’re too cool too.Frank Cottrell Boyce is a novelist and screenwriterPhilippa PerryLydia Bennet in Pride and PrejudiceView image in fullscreenJena Malone as Lydia Bennet and Carey Mulligan as Kitty Bennet in the 2005 film Pride & Prejudice. Photograph: Maximum Film/AlamyPicking a favourite Jane Austen character is difficult. I admire Elizabeth Bennet for her directness with the imperious Lady Catherine de Bourgh, but she’s too discreet for my taste. I know Lydia Bennet is supposed to be insufferable, a 15-year-old flirt who disgraces her family by eloping with a cad, but with her high spirits and imprudence, wouldn’t she be far more entertaining company than her elder sisters? And let’s not forget the bounder himself, George Wickham, who is another one of my favourites. Austen, it seems, is nearly as fond of sexy bad boys as I am. Look at Wickham, Willoughby, Henry Crawford – all totally phwoar.So where does that leave my shortlist? Lydia, Wickham, Willoughby and Henry Crawford. To this, I’ll add the immoral Mary Crawford, who, if pitted against Fanny Price as a dinner companion, wins hands down. Fanny might be good, but as clever Elizabeth Bennet says of goodness: who thinks of that when they fall in love? I must decide: in fifth place, Wickham; fourth, Henry Crawford; third, Willoughby; second, Mary Crawford; and first place goes to Miss Lydia Bennet. To be in so much disgrace while so young is nothing short of magnificent. Put those five in a novel together and I’ll read it.Philippa Perry is a psychotherapist, the Observer’s advice columnist and the author of The Book You Want Everyone You Love to ReadAdam KayPhilip Elton in EmmaView image in fullscreenJosh O’Connor as Philip Elton in the 2020 film Emma. Photograph: Landmark Media/AlamyPhilip Elton, Emma’s young, handsome and deeply delusional vicar, is Jane Austen’s most fascinating antihero. Possessing looks and charisma but little else, he’s earmarked by Emma for a match with her pal Harriet. The Rev, with one eye on Emma’s neckline and the other on her dowry, interprets this matchmaking as a passionate overture, leading to a mortifying lunge in a carriage. Elton’s charm suddenly gives way to embittered outrage and he becomes a Regency version of every radicalised internet bad guy. You can imagine him trolling Emma’s X account and flooding his Instagram grid with pouting selfies in floaty cassocks. Mr Elton: patron saint of every spurned creep who thinks petrol station flowers are a suitable apology.Adam Kay is the author of This Is Going to Hurt. His first novel, A Particularly Nasty Case, is out this summerBolu BabalolaElizabeth BennetI first picked up Pride and Prejudice when I was 12 years old. Well, when I say “picked up”, I mean it was foisted upon me by a harried librarian after our tiny school library had been depleted by me, an overeager bookworm. “Here. You’ll like this. Trust me.” It was chunky and I think she just wanted me busy. I eyed the hefty book with scepticism. And then I met Lizzy. Wry, sharp-tongued, earnest, intelligent, and managing a deft derision of men and a clear yearning for romance – a yearning that she would not compromise herself for. Surrounded by restrictive social norms her personality jutted against, protective of those she loved and a keen observer. I saw myself – or who I felt myself to be – and felt understood, despite being a Black girl from east London, a few centuries removed from our heroine. She was a romcom heroine who did not swoon, but stood up. Modern then, and perhaps modern now. Always an inspiration to me, a hopeful, rational romantic.Bolu Babalola is the author of Love in Colour. Her new novel, Sweet Heat, is out in JulyOlivia WilliamsMiss Bates in EmmaView image in fullscreenTamsin Greig as Miss Bates in the 2009 BBC adaptation of Emma. Photograph: BBC/Laurie SparhamIt was my brilliant English teacher at school, Mrs Cullen, who flagged up to me the underestimated Miss Bates in Emma. I love Miss Bates because she’s a middle-aged woman without money who is discounted by society, and who holds and reveals the entire secret of the plot through what some people might think is her inane chatter, but in fact she observes acutely what’s going on between her niece Jane Fairfax and Frank Churchill and calls it out before anybody else. It’s possible I’m projecting, but Jane Austen was a single woman who also was discounted by society and who also observed very closely what everyone else was doing. You could never accuse Jane Austen of inane chatter, but I’m sure she felt discounted and I think Miss Bates is there to show that you do so at your peril. She is a brilliant creation.Olivia Williams is an actor who played Jane Fairfax in the 1996 television adaptation of EmmaRebecca WatsonMrs Gardiner in Pride and PrejudiceView image in fullscreenPenelope Wilton as Mrs Gardiner in the 2005 film Pride & Prejudice. Photograph: StudioCanal/ Working Title FilmsIt is hard to reread Pride and Prejudice without falling for the idea of being Lizzy Bennet, with her slow-build romance story. Who doesn’t dream of possessing dark eyes that are expressive enough for a man to fall head over heels? But spare a thought for her aunt Mrs Gardiner, who enables that love, teases Lizzy for the feelings she doesn’t yet recognise and – vitally – is the antidote for the painfully overbearing Mrs Bennet. It is no coincidence that the novel ends with “warmest gratitude” to Mrs G. “What are men to rocks and mountains?” Lizzy giddily exclaims to her aunt after she is offered an escape to the lakes. Mr Darcy will soon loom larger than a mountain and Mrs Gardiner is the harbinger of that joy.Rebecca Watson is the author of Little Scratch and I Will CrashNicola SturgeonAnne Elliot in PersuasionView image in fullscreenSally Hawkins as Anne Elliot in ITV’s 2007 adaptation of Persuasion. Photograph: Nick Briggs / ITVMy favourite Jane Austen character by far is Anne Elliot from Persuasion, the final novel Austen completed. Anne is compelling in a way that many of Austen’s other central characters are not. Whereas they often display the worst attributes of the upper classes of the time – backbiting and petty jealousies, an obsession with status and standing, and an overenjoyment of the fripperies of life – Anne stands apart. She is certainly of her time and class – her initial rejection of Captain Wentworth demonstrates as much – but she is also clever, funny, considerate and independent of spirit. She more than deserves her happy ending.Nicola Sturgeon is former first minister of ScotlandTom CreweMr Bennet in Pride and PrejudiceView image in fullscreenKeira Knightley as Elizabeth Bennet and Donald Sutherland as Mr Bennet in the 2005 film Pride & Prejudice. Photograph: Landmark Media/AlamyMr Bennet “was so odd a mixture of quick parts, sarcastic humour, reserve, and caprice, that the experience of three and 20 years had been insufficient to make his wife understand his character”. It is one of the reader’s pleasures to be superior to Mrs Bennet, and we feel that we have understood her husband by the end of chapter one. Yet it is Jane Austen’s art to carefully undermine our sureties, even when they have been offered as her own, and at the conclusion of Pride and Prejudice it is Mr Bennet who makes me cry. Have you any objection to my marrying Darcy, besides thinking I’m indifferent to him, Elizabeth asks. “None at all,” he replies. “We all know him to be a proud, unpleasant sort of man; but this would be nothing if you really liked him.” So far, so Mr Bennet; but he is anxious underneath. Then she tells her story – the story we have read. “If this be the case,” her father says, “he deserves you. I could not have parted with you, my Lizzy, to anyone less worthy.” He is soon joking again, but we have taken the true measure of his"
