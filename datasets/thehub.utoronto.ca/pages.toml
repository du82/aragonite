title = "About"
description = "About Background Welcome to The Hub – Clinical Skills, the online study guide for students in Foundations and Clerkship at the MD Program at the University of Toronto. This online tool was created in response to the student need for up-to-date, relevant and distilled resources to use for preparation before Clinical Skills sessions and just-in-time learning(...)"
full_description = "About Background Welcome to The Hub – Clinical Skills, the online study guide for students in Foundations and Clerkship at the MD Program at the University of Toronto. This online tool was created in response to the student need for up-to-date, relevant and distilled resources to use for preparation before Clinical Skills sessions and just-in-time learning in the clinical environment. This resource is not an all-encompassing syllabus, but a study-guide for essential clinical skills. Please use other sources to fully prepare for examination. Content All content that is referenced on the website other than videos and visual aids will come from peer-reviewed journals. Each of these articles/guidelines will be posted after copyright is obtained. Each topic on the website will be reviewed annually by at least one faculty member at the MD Program at the University of Toronto. Suggestions for additions or changes to existing topics can be submitted via the website under the Contact tab. Ownership The website is owned by the MD Program at the University of Toronto."
year_published = 2025
