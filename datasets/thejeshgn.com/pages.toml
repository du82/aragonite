["https://thejeshgn.com/2024/01/29/back-in-the-saddle-after-14-years-exploring-lepakshi-and-penukonda-fort/comment-page-1"]
title = "Back in the Saddle after 14 Years : Exploring Lepakshi and Penukonda Fort | Thejesh GN"
description = "My last ride was a long one. Almost 14 years back. In 2010, I rode my Yamaha across the country with friends. Post that motorcycle trip, I stopped riding for some reason and did a lot of driving, including a similarly long epic drive with Anju in 2015. I don't remember any specific reason not to ride. May it"
full_description = '''Back in the Saddle after 14 Years : Exploring Lepakshi and Penukonda Fort by Thejesh GN · January 29, 2024 My last ride was a long one. Almost 14 years back. In 2010, I rode my Yamaha across the country with friends. Post that motorcycle trip, I stopped riding for some reason and did a lot of driving, including a similarly long epic drive with Anju in 2015. I don't remember any specific reason not to ride. May it was just a season driving with parents and friends. I did drive a lot, and I enjoyed it. This year, I wanted to return to riding; I still love driving. I enjoy both. They are different and the same in some ways. Anyway, I took my first step last friday by going for a one-day ride with friends. My Yamaha has been standing in the same place for 14 years; I will work on it at some point. But currently, I don't have a working motorcycle. So, I hired a Honda CB350 for RoyalBrothers. The booking and hiring process was easy. When I left the Royal Brothers showroom, I was nervous and excited. But it felt easy; suddenly, I was like a fish in the water. I took the bike around 8:30 PM, navigating weekday traffic in Koramangala traffic to reach home, which filled me with enough confidence. The next day, we left around 05:30 AM; I was slow, gently cruising around 60KMPH and watching many other motorcyclists zipping around me on the Hyderabad highway. I enjoyed the slow pace. Also, the conversations with Manju on the go, thanks to the BluArmour setup. By around 08:00, we reached Lepakshi and had breakfast. Then, I visited the temple and took some photos. From there, we went to Penukonda fort. The ride up the hill was beautiful and was good. That's me at Penukonda fortThen, around 02:30 PM, we left the fort. We had nati chicken curry on the way for lunch and reached Bengaluru by late evening. On the way to fort Lake near Fort Krishna devaraya's palace - Gagan Mahal Nandi at Lepakshi Lepakshi Temple Manju, Snadeep and Me Dogs of Lepakshi Temple Lepakshi Temple Motor Cycle for the day Lepakshi Temple Penukonda was the second capital of the Vijaya Nagara empire. After Talikote, it became the capital of the kingdom. Hoysalas built the initial fort. Many other domains later ruled it. It's also one of the revered places for Jains. There are many things to explore. I want visit again. window.WPLeafletMapPlugin = window.WPLeafletMapPlugin || []; window.WPLeafletMapPlugin.push(function WPLeafletMapShortcode() {/*<script>*/ var baseUrl = atob('aHR0cHM6Ly97c30udGlsZS5vcGVuc3RyZWV0bWFwLm9yZy97en0ve3h9L3t5fS5wbmc='); var base = (!baseUrl && window.MQ) ? window.MQ.mapLayer() : L.tileLayer(baseUrl, L.Util.extend({}, { detectRetina: 0, }, {"subdomains":"abc","noWrap":false,"maxZoom":20} ) ); var options = L.Util.extend({}, { layers: [base], attributionControl: false }, {"zoomControl":true,"scrollWheelZoom":true,"doubleClickZoom":true,"fitBounds":true,"minZoom":1,"maxZoom":20,"maxBounds":null,"attribution":"Leaflet, \u00a9 OpenStreetMap contributors and \u00a9 Thejesh GN"}, {}); window.WPLeafletMapPlugin.createMap(options).setView([13.8022171,77.6096067],10);}); window.WPLeafletMapPlugin = window.WPLeafletMapPlugin || []; window.WPLeafletMapPlugin.push(function WPLeafletjsonShortcode() {/*<script>*/ var src = 'https://data.thejeshgn.com/geojson/lepakshi-penkukonda-ride.geojson'; var default_style = {}; var rewrite_keys = { stroke : 'color', 'stroke-width' : 'weight', 'stroke-opacity' : 'opacity', fill : 'fillColor', 'fill-opacity' : 'fillOpacity', }; // htmlspecialchars converts & to "&amp;"; maybe unnecessarily, and maybe 3x var ampersandRegex = /&(?:amp;){1,3}/g var layer = L.ajaxGeoJson(src.replace(ampersandRegex, '&'), { type: 'json', style : layerStyle, onEachFeature : onEachFeature, pointToLayer: pointToLayer }); var fitbounds = 0; var circleMarker = 1; var popup_text = window.WPLeafletMapPlugin.unescape("&lt;br&gt;&lt;strong&gt;&lt;a target=&quot;_blank&quot; href=&quot;{link}&quot; rel=&quot;noopener&quot;&gt;{name}&lt;