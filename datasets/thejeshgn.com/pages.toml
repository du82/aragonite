title = "ಕನ್ನಡ | Thejesh GN"
description = "ನನ್ನ ಕನ್ನಡದ ಬರವಣಿಗೆ. ನನ್ನ ಬರವಣಿಗೆ ಅಷ್ಟೆನೂ ಉತ್ತಮವಾಗಿಲ್ಲದಿದ್ದರು ಆಗಾಗ ಪ್ರಯತ್ನಪಡುತಿರುತ್ತೇನೆ. ನೀವು ಕನ್ನಡ ತಂತ್ರಜ್ಞಾನದ ಬಗ್ಗೆ ತಿಳಿದುಕೋಳ್ಳಲು ಇಲ್ಲಿ ಬಂದಿದ್ದರೆ ದಯವಿಟ್ಟು ಈ ಟ್ಯಾಗ್ ನೋಡಿ."
full_description = "1 Life / ಕನ್ನಡ India 🇮🇳 January 22, 2024 Two Poems of Kuvempu to mark Today Kuvempu, who is known for Sri Ramayana Darshanam, is a much more revolutionary poet and writer than known for creating a liberal Rama. When he was alive, his Ramayana Darshanam and other writings came under heavy fire from the right wing. Now I understand how. Today, Kuvempu would have been criticized more than... TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 2 Life / Technology / ಕನ್ನಡ Bengaluru November 18, 2022 Get Daily Vachana Push Notifications One of the things that I would like to do every day is to read a Vachana. It does appear to me on my desktop daily, but even then, I miss it when I don’t access that specific computer or am busy. So a push message would be great. TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 0 Life / ಕನ್ನಡ January 6, 2022 ಕರುಣಾಳು ಬಾ ಬೆಳಕೆ I got a Christmas gift from a friend. I loved it. They wanted me to sing a Christmas song. That’s something I can’t do. Instead, I chose to recite the poem ಕರುಣಾಳು ಬಾ ಬೆಳಕೆ by BM Shree. Originally called “Lead, Kindly Light” titled “the Pillar of the Cloud” was written by John Henry Newman, an English priest. He wrote it during his difficult times. TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 0 Life / Technology / ಕನ್ನಡ November 12, 2021 Create a Vachana GNOME Extension Using Argos I like to read a stanza of Vachana every day, and I generally visit Vachana Sanchaya to do that. They have a widget ಇಂದಿನ ವಚನ aka Today’s Vachana. Which picks a random(?) Vachana and shows it to you on their home page. But then its not fun to visit the site everyday. So I wrote a script so it appears on my Desktop. TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 0 Life / ಕನ್ನಡ March 5, 2021 Feb 2021 – Reading Status The last year 2020, was terrible in terms of reading. I heard a lot of podcasts but didn’t read much. This year’s goal is to read 25 Kannada books minimum; any books I read in English are special. You can track them under the tag #25KA2021 on my social blog. In Jan and Feb, I read five, which is a decent start. TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon"
