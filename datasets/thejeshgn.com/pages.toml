["https://thejeshgn.com/about"]
title = "Thejesh GN is an Independent Technologist, Hacker, Maker, Blogger | Thejesh GN"
description = "Thejesh GN (ತೇಜೇಶ್ ಜಿ.ಎನ್) “Thej” is an independent technologist, developer, hacker, maker, traveller, blogger and an open data/internet enthusiast from Bangalore, India."
full_description = "Thejesh GN (ತೇಜೇಶ್ ಜಿ.ಎನ್) “Thej” is an independent technologist, developer, teacher, hacker, maker, traveler, blogger and an open data/internet enthusiast from Bangalore, India. He is the co-founder and chairman of DataMeet trust. DataMeet is the biggest community of data science and open data enthusiasts in India. They organise community meetups around the country and runs unconferences called Open Data Camps (ODC). His belief in open data and open research lead him to open up his genome data(DNA) in 2013. Currently he works as CTO of Peppo. He loves hacking open source software, researching and developing products, speaking at events and hosting workshops. His passion for using technology for social change won him the Infosys Community Empathy Fellowship in 2010. In 2018, he was awarded the IBM Champion title. His core skills are research and development of new ideas, building proof of concepts, technical architecture, design and development. Easiest way to reach him is by emailing [ i @ thejeshgn dot com] or use this form. You can subscribe to his personal blog by RSS: All posts or just the technology posts. He lives with Anju (fictionhead), Uma, Echo and Pathu.Table of Contents1 Associations2 Pronunciation Guide3 On internet4 Terms and Conditions Associations He graduated as an Electronics and Communication engineer from VTU in 2002. His career started with Siemens Information Systems Ltd as an intern. In 2003 he joined Infosys Technologies Ltd as a Software Engineer. Since then, he has taken many roles such as Developer, Programmer Analyst, Technical Specialist and Technical Architect. Below is the list of his associations with various organizations. Siemens Ltd - Internship Jun 2002 – Dec 2002 Infosys Tech Ltd - Tech Specialist - Jan. 2003 – Feb. 2011 UbuntuAtWork - Technologist - Volunteer and then Tech. Consultant - 2009,2010 Janaagraha - Tech Manager (Infosys Fellowship) - Jan. 2010 - Dec. 2010 Janaagraha - Technologist - Mar. 2011 - Feb. 2012 IWP - Data Consultant - Jul.2012 - Mar.2014 NextDrop Org - Tech Architect - Jul.2012 - Dec.2013 Mavrix Ltd - Tech Architect - Mar.2011 - Mar.2019 DataMeet - Co-founder/Organizer - 2012 - Current ODCBLR - Open DataCamp - Organizer - 2012 - Current BuzzWomen/India - Advisor - 2012 - Current Fourthlion - Technologist - Project based consulting - InstaVaani First WalkIn Technologies - R&D - Project based consulting OptimumInfoSystem/Client: Google India - Course Builder Engineer - Jan.2015 - Dec.2016 Executive Board of Oorvani Foundation - Tech - Nov.2015 - current Occasionally write for FactorDaily FSF Associate Member, Since 2016 OptimumInfoSystem/Client: Google India - Course Builder Engineer - Jul.2017 - Mar.2019 IBM Champion - Cloud - 2018 OpenStreetMap Foundation - Member IBM Champion - Cloud - 2019 Mavrix Ltd - Tech Architect - Project based First WalkIn Technologies - Tech Architect - Apr.2019 - Apr.2020 Quicksand Design Studio - Tech Architect - Project based IITM/Online/Study - Tech Architect - Project based IITM/BS in Data Science and Applications - Course Instructor - Modern Application Development 1 and 2. Data Commons - FOSS Data Contributor Peppo - CTO - May.2020 - Current His areas of interest include FLOSS, Linux, Open Web, Open Data, Open Formats, Data Visualization, Security, WoT, Cryptography, Online Privacy, IT Laws, Politics, Blogging, Podcasting, P2P networks, Motor Cycling, Open Hadware, Programming (Python, JavaScript, Lua). Pronunciation Guide Official Name : ತೇಜೇಶ್ ಜಿ ಎನ್ - Thejesh G N - Tējēʃ ji En - t̪e:dʒe:ʃ dʒi en Google TTS - Using Kannada eSpeak using IPA Short Name: ತೇಜ್ - Thej - Tēj - t̪e:dʒ Google TTS - Using Kannada eSpeak using IPA On internet Mastodon or Fediverse | GitHub | LinkedIn | Flickr | Wikipedia | Transifex Terms and Conditions You may want to read terms and conditions, disclosures, relationships, comment policy and copyright related information. Last updated on Nov 22, 2024 @ 6:22 PM.TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon"
