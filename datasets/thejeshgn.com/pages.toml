description = "It's been a busy week. I was catching up on pending work along with work travel. And then, both Anju and I caught a cold, which we received from Uma. No fever, just a very bad cold and cough. It was tiring. All of us are recovering well; hopefully, next week will be better. I've"
full_description = "Weekly Notes 07/2025 by Thejesh GN · February 14, 2025 It's been a busy week. I was catching up on pending work along with work travel. And then, both Anju and I caught a cold, which we received from Uma. No fever, just a very bad cold and cough. It was tiring. All of us are recovering well; hopefully, next week will be better. Ed Sheeran (+–=÷× Tour) I've caught up with almost all pending work. If not for a cold, I would have finished everything I had planned. Still, all priority and urgent quadrant tasks are done. I am happy about it. I saw Ed Sheeran (+–=÷× Tour) at NICE Grounds on Saturday. The weather was perfect, and I had a great time. It was probably my first big open-air concert in a long time. My sister and niblings were here to meet Uma on Sunday. My nephew also had a football match nearby; I got to see that, too. Since Uma is the group's youngest cousin, she is currently everyone's favorite. I have used the arrival lounge Aviserv in Mumbai; I had forgotten that one must pay an additional Rs.900/hr for sleeping and showering. This lounge only makes sense because the CC gives me free lounge access. I rarely use a lounge, but sleeping is a good reason. I used Bloom Hub @ WEH Andheri this time on the recommendation for SG. I liked it. They have simple, clean, and just enough spacious rooms. They have good wifi and a decent cafe. Their support and service is excellent. All in all, great value for money. I would use Bloom again without thinking. I watched Gultoo(2018) finally. It's a cyber-thriller that deals with identity theft. It gets many things correctly, like social engineering, shoulder surfing, identity theft, etc. I like the way they have visualized the dark web for common folks. All in all, it is a good movie. I also watched Hadinelentu 17/18, which deals with the leakage of a private video between classmates and how the system responds to the incident based on class, caste, and gender. Again, a good watch. We booked tickets, stay, etc, for our yearly March trip. I need to get fit to do the long trail walks that we plan to do. You can read this blog using RSS Feed. But if you are the person who loves getting emails, then you can join my readers by signing up. Email Address Subscribe Join 2,252 other subscribers TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon"
