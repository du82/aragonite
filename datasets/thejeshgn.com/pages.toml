description = "I am back in Bengaluru. It's been a busy couple of days catching up with all the pending work. I am yet to read quite a few emails. I think the weekend is also going to be busy as well. I spent about five days at Varanasi and Prayagraj watching people attend the Maha Kumbh"
full_description = "Weekly Notes 06/2025 by Thejesh GN · February 7, 2025 I am back in Bengaluru. It's been a busy couple of days catching up with all the pending work. I am yet to read quite a few emails. I think the weekend is also going to be busy as well. Friends at Ganga I spent about five days at Varanasi and Prayagraj watching people attend the Maha Kumbh Mela. In Varanasi, I took many pictures of dogs on the ghat, and I didn't take that many pictures during Kumbh. But I plan to write more when I get time to process, more like perspectives of a non-religious and non-believer(?) but very people person. There is viral fever spreading in Bengaluru. All the kids at Uma's school have it. It looks like a standard viral preschoolers get and spread, but takes a long time to go away. I started a channel called OpenPostBoxIndia on Are.na. I think the community on Are.na might appreciate pictures of postboxes. I started listening to ICYMI (tagline: We're online, so you don't have to be) podcast at Slate. I reached it through Kate Lindsay, who writes a newsletter called Embedded, which defines itself as an essential guide to what's good on the internet. Unfortunately, it's on substack, but I still recommend it if you are curious about the web and the internet. That reminds me that I need to update my podcast subscription list, which I have not done in sometime. I am in Mumbai next week for about 48 hours. You can read this blog using RSS Feed. But if you are the person who loves getting emails, then you can join my readers by signing up. Email Address Subscribe Join 2,252 other subscribers TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon"
