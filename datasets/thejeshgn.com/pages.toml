full_description = "2 Life Bengaluru February 27, 2025 A challenge of blog questions I got tagged by Sathya to take up the challenge of blog questions. I don’t even remember the last time something like this happened. But I am thrilled to see blogging is popular again and, in most cases, becoming an alternative to social media. A selfish reason for participating in this challenge is... TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 0 Life India 🇮🇳 Amma January 15, 2025 Nagarathna Memorial Grant – 2025 Open for Applications Welcome to the eighth edition of the NMG grant. It seems like it started yesterday, and it’s already been eight years. I am grateful to friends (Nemo, Gangadhar, Shweta, Divya) and other anonymous folks who have joined me on this journey with additional grant support. We do have some of them supporting us... TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 0 Life Bengaluru Amma January 8, 2025 Small Update to NMG There are a few changes to NMG this year onward. It’s not a big deal, but I wanted to note them here for future reference. TLDR: NMG Core will be ₹ 1 lakh + friends as usual, and NMG Edu will be a separate ₹ 1 lakh. TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 2 Life January 2, 2025 Year 2024 in Weekly Pictures Even though I post only one picture as part of the Weekly Notes, pictures have a way of capturing the status more than one could write. So, like in 2023, here is a gallery of images associated with Weekly Notes from 2024. TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon 6 Life Bengaluru Anju 👩🏽|Echo 🐶|Pathu 🐶|Uma December 31, 2024 The Year that was 2024 After 2020’s upheaval, I hoped we’d recovered, but 2024 brought new challenges, especially late in the year. Personally, it was decent—I restarted motorcycling, traveled, and enjoyed time with loved ones. Work was steady. As we navigate forward, may 2025 bring peace, meaningful adventures, and cherished moments with loved ones. Stay kind, and embrace the journey ahead! TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon"
