["https://thejeshgn.com/2025/02/01/dogs-of-varanasi-ghats"]
title = "Dogs of Varanasi Ghats | Thejesh GN"
description = "I have been to Varanasi before, and I have walked on ghats. What I had not noticed during those walks was the number of dogs and how social they were. Once you start noticing, they are everywhere. If you know me already, you know that I am not a great photographer. Photography is an act"
full_description = '''Dogs of Varanasi Ghats by Thejesh GN · February 1, 2025 I have been to Varanasi before, and I have walked on ghats. What I had not noticed during those walks was the number of dogs and how social they were. Once you start noticing, they are everywhere. If you know me already, you know that I am not a great photographer. Photography is an act of noticing things for me; when I could not take pictures, I would make notes; now, I can easily click a photo, which is how I sometimes take notes. Today, I just did that. I walked around the ghats up and down without a plan and took some pictures. I walked about 8kms before I realized. These pictures are exported directly from the camera for the Web (low-res) without processing. I hope you enjoy dog pictures. This fellow was very active and running around These two pups were near sol cafe, inviting Customers. I didnt want to go close and capture this. But they were all comfortable together. I think he wanted someone to pet him Its so cold So sleepy I can hear you Sleeping in the middle of the road Like a guard Keeping an eye Gully boy It was not a planned walk,so I walked up and down many times. Sat down at Sol cafe for an hour to rest. window.WPLeafletMapPlugin = window.WPLeafletMapPlugin || []; window.WPLeafletMapPlugin.push(function WPLeafletMapShortcode() {/*<script>*/ var baseUrl = atob('aHR0cHM6Ly97c30udGlsZS5vcGVuc3RyZWV0bWFwLm9yZy97en0ve3h9L3t5fS5wbmc='); var base = (!baseUrl && window.MQ) ? window.MQ.mapLayer() : L.tileLayer(baseUrl, L.Util.extend({}, { detectRetina: 0, }, {"subdomains":"abc","noWrap":false,"maxZoom":20} ) ); var options = L.Util.extend({}, { layers: [base], attributionControl: false }, {"zoomControl":true,"scrollWheelZoom":true,"doubleClickZoom":true,"fitBounds":false,"minZoom":7,"maxZoom":20,"maxBounds":null,"attribution":"<a href=\"http:\/\/www.openstreetmap.org\/copyright\">OpenStreetMap<\/a> contributors, <a href=\"http:\/\/leafletjs.com\" title=\"A JS library for interactiv