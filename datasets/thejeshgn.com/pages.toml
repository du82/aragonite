["https://thejeshgn.com/2025/02/21/weekly-notes-08-2025"]
title = "Weekly Notes 08/2025 | Thejesh GN"
description = "Work went well I am on top of it. I have closed the things I wanted to close this week and the pending tasks from last week. It feels good to have a completed task list on a Friday evening. My neck has been giving me pain for the last two four weeks. This probably"
full_description = "Weekly Notes 08/2025 by Thejesh GN · February 21, 2025 Work went well I am on top of it. I have closed the things I wanted to close this week and the pending tasks from last week. It feels good to have a completed task list on a Friday evening. Uma and Pathu share a bond like siblings—one moment playing happily, the next annoying each other. My neck has been giving me pain for the last two four weeks. This probably happens once a year, and it usually gets fixed with enough rest. But it has been particularly painful this year, and I was determined to find the reason. So I took some tests. It's a mild case of Cervical Radiculopathy. Hopefully, as per the doctor, it will be okay with good rest and precautions. The blogring page now has a browsable table listing of blogs. Thanks to a message from a long-time reader, Yathish M P. Sorry Yathish, I couldn't reply to your message as the email you left on the contact form was unreachable. If you are reading this, then thank you. Earlier this week, I woke up in the middle of the week to cover Uma. It's a muscle memory thing; I don't have to be fully awake. When I moved the sheet, I saw fireflies fluttering around. Then I woke up to see it again. I moved sheets and realized it was static electricity :) The weather has changed; it's getting hot and dry. Summer is already here, and something tells me this summer will be harsh. Appa lost one of his cousins. He is losing his peers, which is kind of sad. I have been making milkshakes for Uma every morning. Until now, she likes it. But I might have to rotate between juices and milkshakes. If you have three hours this week, watch Deep Dive into LLMs like ChatGPT by Andrej Karpathy. He breaks down the key concepts in a simple way. This deep dive will give you enough knowledge to confidently participate in a conversation about LLMs, which is required now, even if you're not a developer. I'm eager to see what his AI+Education startup does. You can read this blog using RSS Feed. But if you are the person who loves getting emails, then you can join my readers by signing up. Email Address Subscribe Join 2,252 other subscribers TelegramWhatsAppTwitterLinkedInEmailPocketPrintMastodon"
