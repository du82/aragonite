full_description = "Frequently Asked Questions Answers to the most common questions you might have Why should I choose ThemeIsle? Because you are in good hands. We are the team behind popular themes like Neve and Hestia. So, if you’re looking to create a website that is easy to use, we’re probably the best choice. Unlike other things, including our passion for all-things-pirates, our WordPress themes and plugins allow you to quickly go over the technical stuff and focus on building your online business. Our products are fairly easy to customize and the support team is always here to help you in case you have questions! Will you help me customize a theme I bought? The good news is that you don’t need to be an expert to use ThemeIsle products. Our themes and plugins are already easy to customize. If you need additional customization or coding changes, we are unable to assist you in re-writing code, as this is beyond our scope. We do offer a collection of specific documentation and 200+ Custom Code articles with examples of how you can further customize your website. If you need WordPress customization services we recommend third-party vendors. What is your refund policy? We offer a full refund for the first 30 days after purchase. Still, have a question? If you haven’t found the answer to your question here, get in touch or check our extensive knowledge center. Do you offer support and what does Priority Support mean? Yes, all our paid plans include support for questions related to your account, billing, or anything product associated. You can see here our support policy. For the plans that include Priority Support, the Happiness Engineers will handle the tickets with higher priority so you get a reply faster. Check how fast we answer to the support inquiries. For how many sites can I use the products? You can use them on any number of websites owned by you or your clients. Here your can find our Fair Usage policy – Terms Keep in mind that you will only receive updates, support, and new features just for the websites with an active license. How long will I receive the theme and plugins updates? You will receive security updates and replies to your support inquires until the end of the subscription period. After that, you will still access the product features and should continue to work, but you won’t get security updates and support. Haven’t found what you’re looking for? Let us help. Contact Us Helping you find treasure with WordPress. From themes & plugins to tutorials & guides; our resources will help you build your dream website. English Deutsch CompanyAbout Us 1% for the Planet Docs Affiliates Contact Top GuidesFree Blogging Sites Install WordPress Website Builders Blog Name Generator Wix vs WordPress Our NetworkOptimole WP Full Pay WPShout ReviveSocial Domain Wheel Copyright © 2025 Themeisle | Built using Neve | Powered by VertiStudio Terms Cookie Policy Privacy Policy"
