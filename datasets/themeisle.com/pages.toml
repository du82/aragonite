["https://themeisle.com/blog/wp-landing-kit-joining-themeisle"]
title = "WP Landing Kit Is Joining the Themeisle Family of Products!"
description = "Ionut Neagu co-founded Themeisle, a leading provider of WordPress themes and plugins. Based in Switzerland, he focuses on creating user-friendly solutions for businesses. With expertise in web development and marketing, Ionut drives Themeisle's direction and ensures top-quality products."
full_description = 'I’m excited to announce that we have acquired WP Landing Kit, a popular plugin that lets you map domain names to individual WordPress pages within your site. WP Landing Kit was created by Jason Schuller and Phil Kurth at the beginning of 2020 with the goal of solving a very unique issue in the WordPress space. Before WP Landing Kit, there had been no solution for users to launch small mini-sites on WordPress without using WordPress Multisite. What’s wrong with WordPress Multisite? – you’ll ask. Nothing, really. But it’s just overkill if all you want to do is hook up a unique domain name to a small website project – like a landing page. Hosting WordPress Multisite is often too expensive and too complex for simple WordPress projects and other types of mini sites. <img decoding="async" width="1805" height="1332" src="https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:1463/h:1080/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg" alt="WP Landing Kit" class="wp-image-45191" srcset="https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:1463/h:1080/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 1805w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:300/h:221/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 300w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:1024/h:756/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 1024w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:768/h:567/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 768w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:1464/h:1080/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 1536w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:50/h:37/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 50w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:325/h:240/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 325w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:538/h:397/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 538w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:813/h:600/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 813w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:201/h:148/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 201w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:264/h:195/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 264w, https://mllj2j8xvfl0.i.optimole.com/cb:c5QE.37290/w:183/h:135/q:mauto/f:best/https://themeisle.com/blog/wp-content/uploads/2021/09/wplandingkit.jpg 183w" sizes="(max-width: 1805px) 100vw, 1805px"> We believe that WP Landing Kit can be a great addition to the Themeisle family of products, and that together with Neve (our flagship theme) and Otter (our package of Gutenberg blocks and templates), it will create a solid DIY solution for managing landing pages on WordPress. WP Landing Kit now part of @ThemeIsle 🍾🎊 read the rest of the story here // @wplandingkit Click To Tweet What does this mean for WP Landing Kit users? If you’re already a WP Landing Kit user, then you will only benefit from this merger. First, you can continue using WP Landing Kit normally. And we will honor all the existing lifetime licenses. Apart from that, you’ll also receive an email from us offering a sweet deal for Neve and Neve Pro to bring you into the Themeisle ecosystem. We hope to show you why our products are a good match for your WP Landing Kit experience. To learn more about the plugin in detail, please read our full WP Landing Kit Review. Lastly, we hope to continue investing in WP Landing Kit’s development and build upon Jason Schuller’s and Phil Kurth‘s great work; and at a much faster rate than before. What does this mean for Themeisle users? Most importantly, there are deals coming your way as well! Log in to the Themeisle dashboard and see what awaits you. I strongly believe that this acquisition will further strengthen our position on the WordPress landscape and allow us to add one more iteration towards making Neve much more than just a theme. We want our products to be available to everyone and anyone who wants to take their business online. We’ve done a lot to make these products the go-to DIY solution for users and also a great tool for agencies to speed up their workflow. To WordPress and beyond! Ionut Neagu Founder of Themeisle Was this article helpful? Yes No Thanks for your feedback! document.querySelectorAll(".article-feedback-button").forEach(item => { item.addEventListener("click", event => { var voting = document.querySelector(".article-feedback-voting"); var response = document.querySelector(".article-feedback-response"); voting.style.display = "none"; response.style.display = "flex"; }) }) Yay! 🎉 You made it to the end of the article!'
