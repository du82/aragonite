title = "About Themeisle: What We Do and the Story of the Isle"
description = "We are ThemeIsle, a creative and dedicated team of WordPress enthusiasts who've been building awesome WordPress Themes and Plugins since 2012."
full_description = '''The Pirate's Log The Incredible True Story of Our Quest for WordPress Glory The Adventures of Themeisle T ’was the year 2012 and the seas of WordPress were awash with themes. Sometimes using these themes was like walking the plank and finding easy-to-use, high-quality theme was like a treasure hunt. With that in mind, a band of four friendly pirates marooned themselves on an island with the goal of making everything easier. After a month they had their new approach to WordPress themes: build one store with themes built for specific purposes without the feature burden that made learning WordPress a chore. They started with little money, few skills, and no knowledge but they were willing to learn. And, for our hearty crew this marked the beginning of their adventure on the high-seas. <img fetchpriority="high" decoding="async" width="1289" height="856" src="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:1289/h:856/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/jeef-1.gif" alt="Having fun at the office" class="optimole-lazy-only wp-image-8364309"/> Our mission We make it easy for anyone in the world to launch and grow their online presence, through education, high-quality products, and reliable support. We like to rock the boat They quickly learned to adapt, three years without a sale will do that, but, finally, learnin’ the ways o’the ‘Press paid off when the Legend of Zerif (Zelle) arrived in 2015. While Zerif wasn’t perfect, it was soon moored to the popular themes chart in the WordPress repo. Legend has it that it can still be found sailing on over 100k sites to this day. Zerif’s early success set the tone for all Themeisle products with good features in the free version; excellent documentation & support; and ease of use baked right in. Continuing the adventure The spoils of Zerif allowed Themeisle to bring more crew on board and add WordCamps to their pirate’s code. In 2016 Themeisle docked at two of the biggest WordCamps in the world: WCEU and WCUS. For the first time, the crew from Romania, France, India, and St Lucia met to volunteer at a celebration o’ WordPress. This tradition gets bigger every year with a crew wide trip to India for WordCamp Pune, 2019.​ <img decoding="async" width="701" height="468" src="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:701/h:468/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/WordCamp-Pune-with-the-Themeisle-Crew.jpg" alt="Attending WordCamp Pune with Themeisle" class="wp-image-8364318" srcset="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:701/h:468/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/WordCamp-Pune-with-the-Themeisle-Crew.jpg 701w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:300/h:200/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/WordCamp-Pune-with-the-Themeisle-Crew.jpg 300w" sizes="(max-width: 701px) 100vw, 701px" /> Our products be good for seafarers and landlubbers alike. By 2017 the WordPress tide was changing as themes started to shift towards adaptability rather than specificity. An armada of page builders had given users their opportunity to deck their theme out with more control than ever. Themeisle responded with Hestia. A theme integrated with Elementor to give users the ultimate page building experience. When Gutenberg made land in 2019 the theme map shuffled again, so Neve was built to give users the freedom to build a site. Their way. From the Gutenberg and Elementor integration to the header and footer builder Neve’s commitment to freedom of use saw it rocket up the popular themes charts. Easy to use and fast Neve quickly joined the 30k club. Sharing the loot O’er the years our WordPress work has helped fill our coffers but we’re not plunderers. Each member of the crew has a tale to share about their work in the WordPress community. We’ve added patches to the core, helped with translation, reviewed themes, and spoken at WordCamps across the seas from India to Bucharest. As a company, we have sponsored WordCamps in Bucharest and in Pune 2019. We partnered with WordCamp Europe in 2018 and 2019 to provide media coverage. We share the spoils and donate pieces of eight to worthy internet causes and we buy the odd coffee for growing developers. Every year, you’ll find our buccaneers organizing and volunteering at WordCamp Europe. Members of our crew have led WordPress Meetups including the very first meetup in St Lucia, the home away from home for true pirates. Some great memories from #WCEU last year in Vienna. We're looking forward to making more in #Paris 😍 pic.twitter.com/FmBIHxaSBB— Themeisle (@ThemeIsle) June 13, 2017 We’re all in the same boat On the good ship Themeisle you’ll find over 20 crew members from harbors all over the globe. Th’ crew pays no heed to where yer from, be you lass or laddy, your willingness to help people build something great pirate-ness is what’s important. So, whether ye be a salty sea dog or a green novice, we’d love to talk to ye. Contact Us <img decoding="async" width="1024" height="628" src="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:1024/h:628/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/aboutimg3.jpg" alt="Team photo in Viena" class="wp-image-8364301" srcset="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:1024/h:628/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/aboutimg3.jpg 1024w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:300/h:184/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/aboutimg3.jpg 300w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:768/h:471/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/aboutimg3.jpg 768w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:auto/h:auto/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/aboutimg3.jpg 1178w" sizes="(max-width: 1024px) 100vw, 1024px" /> Further adventures From four hardy pirates who marooned themselves on an island to a global team Themeisle is ready for more WordPress adventures. All hands hoay! Meet the crew We’re a friendly group of designers, developers, testers, and marketers. <img decoding="async" width="320" height="320" src="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:320/h:320/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/05/ionut.jpg" alt="Ionut Neagu" class="wp-image-8364723" srcset="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:320/h:320/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/05/ionut.jpg 320w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:150/h:150/q:mauto/rt:fill/g:ce/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/05/ionut.jpg 150w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:300/h:300/q:mauto/rt:fill/g:ce/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/05/ionut.jpg 300w" sizes="(max-width: 320px) 100vw, 320px" /> Ionut Neagu Cap’n, Chief, Pilot <img decoding="async" width="320" height="320" src="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:320/h:320/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/Vertigo-studio-1.jpg" alt="Stefan Cotitosu" class="wp-image-8364665" srcset="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:320/h:320/q:mauto/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/Vertigo-studio-1.jpg 320w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:150/h:150/q:mauto/rt:fill/g:ce/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/Vertigo-studio-1.jpg 150w, https://mllj2j8xvfl0.i.optimole.com/cb:3970~373ad/w:300/h:300/q:mauto/rt:fill/g:ce/f:best/ig:avif/https://themeisle.com/wp-content/uploads/2019/04/Vertigo-studio-1.jpg 300w" sizes="(max-width: 320px) 100vw, 320px" /> Stefan Cotitosu Surgeon of Themes <img decoding="async" width="320" height="320" src="https://mllj2j8xvfl0.i.optimole.com/cb:3970~373a