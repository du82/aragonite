["https://themezee.com/about"]
title = "About – ThemeZee"
description = "ThemeZee.com was founded in 2010 by Thomas Weichselbaumer as a part-time project beside freelancing as a web developer and being a business student. The website was originally created to share free WordPress themes and generated its first revenue with affiliate marketing for other theme shops. Later on ThemeZee became a full time job and turned […]"
full_description = "About ThemeZee.com was founded in 2010 by Thomas Weichselbaumer as a part-time project beside freelancing as a web developer and being a business student. The website was originally created to share free WordPress themes and generated its first revenue with affiliate marketing for other theme shops. Later on ThemeZee became a full time job and turned into a premium theme shop specialized in creating easy to use Magazine WordPress themes & plugins. Our Working Philosophy Simplicity is Key – Our main focus is to create easy to use WordPress products without 1000+ options Working Remotely – We work anywhere in the world with a flexible schedule to foster creative thinking Best Practices – We strictly follow the Coding Standards of WordPress to ensure a high code quality Open Source – We believe in the spirit of open source and release all our products under GNU GPL Our History 2011 – Published all our themes in the official theme directory on wordpress.org and attracted thousands of users right away. 2012 – Introduced our theme club, which offered premium upgrade versions of our themes and high quality support for a yearly subscription. 2013 – Released our first WordPress themes with responsive design and doubled our collection of themes. 2014 – Switched from our club membership model to single theme purchases and brought our very popular Dynamic News theme to wordpress.com 2015 – Shifted our focus to Magazine themes and reshaped our Pro themes to become plugins. We also introduced our license key system and released our first add-ons. The Team Thomas Weichselbaumer Founder ThemeZee is still mainly a one-man show and therefore Thomas takes care of most tasks like theme and plugin development, online marketing, business operations and tech support. We hope to introduce some more team members here in future."
