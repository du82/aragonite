["https://themezee.com/pricing"]
title = "Pricing – ThemeZee"
description = "License Terms 100% GPL Licensed All WordPress themes, pro versions add-ons and plugins are licensed under GPL. That means you are free to use our products on unlimited domains. Update & Support License We sell our products with a license for updates and support. The license is limited to the number of sites in the […]"
full_description = "Pricing – 30 Day Money Back Guarantee Purchase our Pro Add-ons and get access to all features and customization options. We will refund 100% of your money if you are not satisfied. Single 1 Website 49€ per year*, plus VAT Access to all ThemesAccess to all Add-ons12 Months Updates12 Months Support 1 Website Purchase now Checkout Added to cart Plus 3 Websites 79€ per year*, plus VAT New Access to all Blocks Access to all ThemesAccess to all Add-ons12 Months Updates12 Months Support 3 Websites Purchase now Checkout Added to cart Infinite Unlimited Websites 99€ per year*, plus VAT New Access to all Blocks Access to all ThemesAccess to all Add-ons12 Months Updates12 Months Support Unlimited Websites Purchase now Checkout Added to cart * Annual billing. The subscription is automatically renewed for another year, unless the contract is terminated before. License Terms 100% GPL Licensed All WordPress themes, pro versions add-ons and plugins are licensed under GPL. That means you are free to use our products on unlimited domains. Update & Support License We sell our products with a license for updates and support. The license is limited to the number of sites in the respective plan and valid as long as your subscription is active. Refund Policy We stand behind the quality of our products and offer a no-questions-asked refund within 30 days of your purchase in case you’re not 100% satisfied. Frequently Asked Questions On how many websites can I use your free themes? You can use all of our free themes on as many websites as you like. There is no limit on how many times or on how many different domains you can install and use the themes. All themes are licensed under GNU GPL. Can I use ThemeZee themes and plugins for my clients? Yes, you are totally free and encouraged to use ThemeZee’s WordPress themes and plugins to create awesome websites for your clients. We are truly glad about every website which is using one of our products. On how many websites can I use my purchased products? Our paid upgrade plugins are distributed under an Updates & Support License. You can install your purchased products on unlimited domains, however, automatic updates and support are only provided for the number of websites you have a valid license key for. What is the difference between the price plans? All plans give you access to all our themes & plugins we have. The main difference between the memberships is the number of websites. Our yearly plans are automatically renewed each year for continued updates and support, as a subscription. How long do I receive updates? You will get regular updates for our free themes. Our paid products like premium plugins and Pro add-ons require a valid license key in order to receive updates. How long do I get technical support? You will get support for all your purchased items with a valid license key. Please note that we do not offer personal email support for our free themes. How does the checkout process work? We only have one checkout page where you have to enter at least all required data to register your ThemeZee.com user account. With clicking the button “Purchase Now”, the payment is concluded and order completed. How does the payment work? You can make your payment with credit card or via PayPal. You can choose the payment method on the checkout page. Can I cancel my subscription? Yes, of course. You can cancel your subscription at any time. Your license key is still valid until the end of the subscription period. Afterwards, you do not receive updates and support anymore. When can I download my purchased themes? You will have immediate access to download your purchased themes right after the checkout and your successful payment. We will send you an email with links to download your purchased products and you can always download them on our account page. How can I login to my account? By default you will be automatically logged-in to your account after you have completed the payment on PayPal. You can also login with your chosen username and password on the login page. If you have any problems with your user account, just contact us. What are the first steps after my purchase? You can download your purchased products on your user account page. The download page contains some hyperlinks to first tutorials how you can install and setup your theme. You will find further help on the support center. Do I get an invoice? Yes, you will get a proper legal invoice according to German laws in PDF format. Please fill out your billing details on the checkout process in case you need an invoice for taxing purposes. You will be able to download the invoice on your user account page. How can I get a refund? You will get a no-questions-asked refund within 30 days of your purchase. If you’re not satisfied with our themes, just send an email and tell us your username and PayPal email. We will refund your money right away. What kind of technical support do I get? You will have access to our video tutorial section about WordPress Basics as well as the documentation with dozens of tutorials about theme/plugin setup and configuration. Furthermore you get personal help via email if you have any further questions. You can see all our support services on our support center. Do you offer personal support via Facebook or Twitter ? No, sorry but we aren’t. You will get personal help only via email. We are using HelpScout on our backend which makes it easier for us to handle all support questions at one place and provide excellent support for you. How long do I have to wait for an answer? We will answer support inquiries via email every workday (Monday through Friday). Please keep in mind that we are located in the European time zone (Germany, GMT +1 hour). You should normally receive a reply to your emails within 48 hours on business days. Can you program something for me? We have decided to focus on creating awesome themes & plugins for magazine websites and do not offer any freelance work in order to create custom features and functionality."
