title = "Blog – ThemeZee"
full_description = "Maintenance and bugfix updates UpdatesJanuary 6, 2025January 6, 2025 Thomas We have updated some of our WordPress themes and Pro add-ons over the last few days to make minor bug fixes and ensure compatibility with the latest PHP and WordPress versions. Read full article » New icons for social icon menus UpdatesJanuary 25, 2024January 25, 2024 Thomas In our classic WordPress themes, we use the custom menu feature of WordPress Core to display social icons in the header and footer of the theme. The URL of the menu link is automatically recognized and the corresponding icon is displayed. So far so good. Read full article » Launching Premium Block Themes News ThemesDecember 22, 2022January 3, 2025 Thomas Since a few days our first two premium block themes are available for purchase. We have extensively tested the new Full Site Editing system this year and have already released five free block themes. Overall, we are largely convinced of the new possibilities. With each WordPress Core release, block themes got a bit better and meanwhile it’s great for building websites. Read full article » End of our legacy pricing plans NewsNovember 29, 2022March 6, 2024 Thomas Last year we have made some changes to our pricing model and switched to subscriptions for new customers. As of today, we are extending this subscription-based pricing model to all customers and eliminating all of our old pricing plans. In addition, we are abolishing the Lifetime Plan. Read full article » Introducing Premium Blocks BlocksNovember 16, 2022November 16, 2022 Thomas Today I’m very happy to announce our newest range of products: Premium Blocks for the WordPress Block Editor. For the beginning of this new chapter, we offer four different Icon blocks. You can find them on themezee.com/blocks/. Of course we have already planned new blocks to come. Read full article » Smartcube – our first Magazine block theme ThemesSeptember 21, 2022October 14, 2022 Thomas Say hello to Smartcube, our first WordPress block theme made for news and magazine sites. The theme is the successor of our retired classic Smartline theme and features the same unique and gorgeous design. It includes a wide range of block patterns to create a magazine-styled homepage with ease. Read full article »"
