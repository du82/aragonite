["https://themezee.com/de/ueber-uns"]
title = "Über uns – ThemeZee"
description = "ThemeZee.com wurde 2010 von Thomas Weichselbaumer als Teilzeit Projekt neben dem freiberuflichen Arbeiten als Webentwickler und BWL Studium gegründet. Die Webseite wurde ursprünglich erstellt, um kostenlose WordPress Themes zu teilen und generierte erste Einnahmen mit Affiliate Marketing für andere Theme Shops. Im Laufe der Jahre wurde ThemeZee zu einem Vollzeit-Job und verwandelte sich in einen […]"
full_description = "Über uns ThemeZee.com wurde 2010 von Thomas Weichselbaumer als Teilzeit Projekt neben dem freiberuflichen Arbeiten als Webentwickler und BWL Studium gegründet. Die Webseite wurde ursprünglich erstellt, um kostenlose WordPress Themes zu teilen und generierte erste Einnahmen mit Affiliate Marketing für andere Theme Shops. Im Laufe der Jahre wurde ThemeZee zu einem Vollzeit-Job und verwandelte sich in einen Premium Theme Shop – spezialisiert auf einfach zu nutzende Magazine WordPress Themes & Plugins. Unsere Arbeitsphilosophie Simplicity is Key – Wir fokussieren uns auf einfache WordPress Produkte ohne 1000+ Optionen Working Remotely – Wir arbeiten wo und wann wir wollen, um kreatives Denken zu fördern Best Practices – Wir folgen strikt den Coding Standards von WordPress für eine hohe Code Qualität Open Source – Wir glauben an freie Software und veröffentlichen alle unsere Produkte unter der GPL Unsere Geschichte 2011 – Veröffentlichung all unserer Themes im offiziellen Theme Verzeichnis von wordpress.org und Generierung Tausender von Nutzern 2012 – Einführung unseres Theme Clubs, welcher Premium Upgrades für unsere Themes und erstklassigen Support für eine jährliche Mitgliedsgebühr bot. 2013 – Erstellung unserer ersten WordPress Themes mit Responsive Design und Verdopplung der Anzahl angebotener Themes 2014 – Wechsel von Club Mitgliedschaften zu einzelnen Theme Verkäufen. Veröffentlichung unseres beliebten Dynamic News Themes auf wordpress.com 2015 – Fokus auf Magazine Themes und umformen unserer Pro Themes zu Pro Plugins. Einführung unseres neuen Lizenzsystems und Veröffentlichung der ersten Add-ons. Das Team Thomas Weichselbaumer Gründer ThemeZee ist hauptsächlich noch ein 1-Mann Unternehmen und deshalb übernimmt Thomas die meisten Aufgaben wie beispielsweise Theme und Plugin Entwicklung, Online Marketing, Business Development and Kundensupport. Wir hoffen bald weitere Team Mitglieder hier vorstellen zu können."
