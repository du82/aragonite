  The basic idea of his thesis was that a story’s main character has ups and downs that can be graphed to reveal the story’s shape. The shape of a society’s stories, he said, is at least as interesting as the shape of its pots or spearheads. Let’s take a look.





















  
  






  Sources: A Man without a Country and Palm Sunday by Kurt Vonnegut





















  
  




  
  
  



