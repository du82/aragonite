e-6a4cf42fcb3b",                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "shape": "jagged",                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "isFront": false,                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "isAnimationEnabled": true,                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         