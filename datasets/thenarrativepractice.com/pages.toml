  Choice #3





















  
  






  Centering





















  
  
























  
  






  
                  
                    Ask Yourself...                                                                                                • Who or what is the most important, crucial piece of the story?• Who is the main character?• Whose point of view does the story show? Whose thoughts does it voice?• Who is given dimension? Who is flattened or simplified?• Whose backstory or life story do we get? Whose don’t we get? How does this end up centering or peripheralizing?• What else could the story center or focus on? What would that change?• What would you choose to center the story on? Could there be more than one center?      
        

  


  
  
  



