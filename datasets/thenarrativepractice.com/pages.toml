old.Tell a story with awareness of your choices and their impact. Cultivate narrative agency for individuals and communities. .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"] { padding-bottom: var(--divider-height); z-index: var(--z-index); } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"] .background-pause-button { bottom: calc(14px + var(--divider-height)); } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"] .section-divider-svg-clip { display: none; } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"].background-width--inset:not(.content-collection):not(.gallery-section):not(.user-items-list-section) { padding-bottom: calc(var(--sqs-site-gutter) + var(--divider-height)); } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"].background-width--inset:not(.content-collection):not(.gallery-section):not(.user-items-list-section) .section-background { bottom: calc(var(--sqs-site-gutter) + var(--divider-height)); } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"] .section-divider-block { height: var(--divider-height); } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"] { padding-bottom: 6vw; } .has-section-divider[data-section-id="66a15d5e3aac7743270ae392"].background-width--inset:not(.content-collection):not(.gallery-section):not(.user-items-list-section) { padding-bottom: calc(var(--sqs-site-gutter) + 6vw); } Where does this work come from? .user-items-list-item-container[data-section-id="66a15cc632041944339a3b2b"] .list-item-content__title { font-size: 2.6rem; } .user-items-list-item-container[data-section-id="66a15cc632041944339a3b2b"] .list-item-content__description { font-size: 0.9rem; } .user-items-list-item-container[data-section-id="66a15cc632041944339a3b2b"] .list-item-content__button { font-size: 0.8rem; } @supports (--test-custom-property: true) { .user-items-list-item-container[data-section-id="66a15cc632041944339a3b2b"] { --title-font-size-value: 2.6; --body-font-size-value: 0.9; --button-font-size-value: 0.8; } } Growing Up Labeled "Different" As a first-generation American and a queer kid I saw the world and its meaning through many different lenses at once. Literary & Feminist Theories When I studied both simultaneously I saw how literary stories and societal stories connect and intersect. Analyzing Culture Daily Whenever I take in a movie, the news, or a friend’s story, I’ll think critically and deeply to understand it with dimension. Creating People's Websites For years, each website required me to create a narrative and hone my practice to make narrative choices consciously. .has-section-divider[data-section-id="66a15cc632041944339a3b2b"] { padding-bottom: var(--divider-height); z-index: var(--z-index); } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"] .background-pause-button { bottom: calc(14px + var(--divider-height)); } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"] .section-divider-svg-clip { display: none; } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"].background-width--inset:not(.content-collection):not(.gallery-section):not(.user-items-list-section) { padding-bottom: calc(var(--sqs-site-gutter) + var(--divider-height)); } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"].background-width--inset:not(.content-collection):not(.gallery-section):not(.user-items-list-section) .section-background { bottom: calc(var(--sqs-site-gutter) + var(--divider-height)); } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"] .section-divider-block { height: var(--divider-height); } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"] { padding-bottom: 6vw; } .has-section-divider[data-section-id="66a15cc632041944339a3b2b"].background-width--inset:not(.content-collection):not(.gallery-section):not(.user-items-list-section) { padding-bottom: calc(var(--sqs-site-gutter) + 6vw); } .fe-66a15cc632041944339a3b2e { --grid-gutter: calc(