  Choice #6





















  
  






  The Story’s Truth





















  
  
























  
  






  
                  
                    Ask Yourself...                                                                                                • What is true in the world of the story?• What is the story’s overall message?• Does the story provide a moral, lesson, or teaching? Does it come to a meaningful conclusion?• What new perspective or way of thinking does the story give you?• What does the story make you believe? What does it make you reconsider?• How do the story’s truths relate to ideologies and values in the world?      
        

  


  
  
  



