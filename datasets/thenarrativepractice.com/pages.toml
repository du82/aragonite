  The path can be curvy, I know! Walking it together with clarity and an open mind we can find a way. I love this work because it’s worthwhile helping people create their livelihoods, create social change, create things that need to exist. It can seem daunting, but it’s doable if we ask the right questions. Email me at   maya@tenderhuman.com   for a commitment-free consultation call. You can tell me what you’re working on, I can answer any questions, and we can see the potential for joining forces. My intention is to give you insight into your next steps, wherever they lead.





















  
  





