  Which story?





















  
  
























  
  






  
                  
                    Ask Yourself...                                                                                                • Why tell this story in particular?• What is the story’s significance to the author(s) or the audience(s)?• What does telling this story do?• How does telling this story serve the author(s) or the audience(s)?• Who does this story help or hurt?• What is the biggest goal for the story’s impact?• Would you choose to tell this story? Why or why not?      
        

  


  
  
  



