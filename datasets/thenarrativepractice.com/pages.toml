  2





















  
  






  Choice #2 





















  
  






  Include/Exclude





















  
  
























  
  






  
                  
                    Ask Yourself...                                                                                                • Who is the story’s writer? What identities, knowledge, and values do they have?• Who is included among the writers? Who isn’t?• Is there someone you think should be included among the writers? Is there someone you think should not be? Why?• Has anyone contributed to the story’s creation, publication, release, or popularization? Has anyone acted against it? How?• Who is the story’s intended audience? Who is not? How do you know?• Are there similarities or differences between the story’s author(s) and audience(s)?• Who has access to the story, based on its format, language, platform, or medium? Who doesn’t?• Who do you think needs to hear this story?• Who or what is included in the story?• Who or what is left out of the story?• What background information do we get, and not get?• Whose history or backstory is included? Excluded?• What never makes its way into the story?• What time frames before or after are left out of the story?• What places are left out of the story?• What left out piece do you think the story needs to include?      
        

  


  
  
  



