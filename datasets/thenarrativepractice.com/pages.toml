          "type": "THEME_COLOR"                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  },                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "thickness": {                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "unit": "em",                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     "value": 0.1                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  },                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "linecap": "square"                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } ]



  What to include, what to leave out? What words to use to describe it? Whether or not to tell it, who to tell it to, and where? Why tell this particular story in the first place?When we understand the choices storytellers make, we can look critically at a story and see it with dimension beyond what we’ve been told. We can see what other stories could have been – or can still be. And maybe most crucially, we can look at our own choices in telling a story – whether it’s a creative piece, a personal life story, or our take on the world. Hopefully we can cultivate telling stories in a way that serves our truest goals and aligns with values we clearly and consciously choose.If there is a story you’re hearing, or one you want to tell, or one you’ve been telling for a while, ask yourself these questions and see what you find out. Maybe you’ll understand the story differently, or with more dimension, and see something new about it that you’ll change in future tellings.





















  
  




  
  
  



