  5





















  
  






  Choice #5





















  
  






  Framing an Angle





















  
  
























  
  






  
                  
                    Ask Yourself...                                                                                                • How does the framing help create the story’s meaning?• How does the framing affect the story’s impact?• Who does the framing serve?• Does this framing do harm? To who? And how?• How does the framing relate to ideologies and values? Does it uphold, challenge, or a combination?• Have you seen this framing before? Where?• What framing have you seen a million times? What does encountering the same framing over and over do?• What framing have you never seen, never tried?• How would you seek out, try out, subvert, or create new ways of framing?• What framing would change the story’s meaning?• What framing would make the story meaningless?• What framing would change the story’s impact?• How would you choose to frame the story? What would the impact be?      
        

  




  This is a cumulative look at the previous choices combined. It’s saying: “This is the story we’re telling, centering this in particular, which we think is good, and is threatened by this which we think is bad.”or“This is the story we’re telling, centering this in particular, which we think is bad, and is challenged by this which we think is good.” or“This is the story we are telling, to these people in particular, about this which we think is important.”





















  
