      Growing Up Labeled "Different"  
            As a first-generation American and a queer kid I saw the world and its meaning through many different lenses at once.      

  

  

    
            
  

    

  
      Literary & Feminist Theories  
            When I studied both simultaneously I saw how literary stories and societal stories connect and intersect.      

  

  

    
            
  

    

  
      Analyzing Culture Daily  
            Whenever I take in a movie, the news, or a friend’s story, I’ll think critically and deeply to understand it with dimension.      

  

  

    
            
  

    

  
      Creating People's Websites  
            For years, each website required me to create a narrative and hone my practice to make narrative choices consciously.      

  

  

    
  


  

  

  

  

      
  
  
  



