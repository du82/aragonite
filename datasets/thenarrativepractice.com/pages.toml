  4





















  
  






  Choice #4





















  
  






  Assigning Good & Bad





















  
  
























  
  






  
                  
                    Ask Yourself...                                                                                                • If there is a conflict, whose side is the story on? How do you know?• What evidence of goodness or badness does the story give? In what ways is this a choice?• What does the story’s inclusion, exclusion, and centering tell us about who or what is assigned good or bad? For example, is the story on the side of a good character that is included and centered? • Whose interests or what values does the story reflect in assigning good and bad the way it does? How does this relate to the author(s) and the audience(s)?• How does assigning good and bad relate to the first question: Why tell this story?• Who is comforted by the story, affirmed?• Who is vilified by the story, alienated?• What other stories does this assigning of good and bad relate to or remind you of?• Does the story assign good and bad along the same lines that mass culture does? Does it flip them? Does it assign good and bad the same way a subculture does? • Does it assign good and bad in a way that is unique, new, or subversive?• How would you assign good and bad in this story? Would you assign it at all?      
        

  


  
  
  



