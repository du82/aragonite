["https://thenextweb.com/news/germany-commissions-polaris-hypersonic-spaceplane"]
title = "Germany asks startup to build hypersonic spaceplane by 2028"
description = "German startup Polaris has been commissioned to build a spaceplane with a capacity for 1-ton payloads by 2028."
full_description = '''<img alt="German defence ministry asks startup to build hypersonic spaceplane" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-18.jpg&amp;signature=d8d1e7cbaf802abdec9778a361698a33" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-18.jpg&amp;signature=daf89b99c4a9c51e959e2e32a0a75a2b 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-18.jpg&amp;signature=6f016c3dc7a6295065cdb7b8c80db599 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-18.jpg&amp;signature=d8d1e7cbaf802abdec9778a361698a33 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Germany’s armed forces have commissioned Bremen-based startup Polaris to develop a two-stage, fully reusable hypersonic space plane — and given the team just three years to build it. Dubbed Aurora, the 28-metre-long aircraft will be part rocket, part plane — designed to take off and land on a runway but also blast through the atmosphere and place payloads up to 1-ton in low-Earth orbit. Under the contract, the startup will design, build, and flight test the spaceplane. The aircraft will serve as a testbed for hypersonic flight and defence research. It could be used as a small satellite carrier if fitted with a non-reusable upper stage, Polaris said. Polaris was founded in 2019 by Alexander Kopp as a spin-off from the German Aerospace Center (DLR). It builds upon over three decades of German and European spaceplane research. <img src="https://s3.eu-west-1.amazonaws.com/tnw.events/hardfork-2018/uploads/visuals/tnw-newsletter.png">The 💜 of EU techThe latest rumblings from the EU tech scene, a story from our wise ol' founder Boris, and some questionable AI art. It's free, every week, in your inbox. Sign up now!The startup has already built three demonstrators of its Aurora spaceplane. The first, Mira I, crashed shortly after its inaugural flight. But the next two iterations — Mira-II and Mira-III — had better luck. These 5-meter-long vehicles, each weighing 240kg, have completed over 100 successful test flights since they first launched in September last year. The Mira prototype series relies on jet engines for takeoff, cruise, and landing, while incorporating an aerospike rocket engine for high-speed propulsion tests. First conceived in the 1960s, aerospike engines adjust to air pressure changes at all altitudes, making them more efficient than traditional designs. However, aerospikes never entered the mainstream because they are hard to cool and difficult to build. Polaris’ work on advanced cooling technologies and materials may just overcome past engineering challenges. Polaris made history in October last year when it conducted the first-ever flight powered by an aerospike engine. The AS-1 engine was ignited in flight for three seconds aboard the Mira-II over the Baltic Sea, delivering a thrust of 900 Newtons and accelerating the 229kg vehicle to 864km/h. The Mira’s future big sister Aurora, however, will be designed to reach hypersonic speeds above Mach 5 (over 6,125km/h) and beyond. Spaceplanes like Aurora could prove a more cost-effective way to access space than rockets because they can take off from a conventional runway and be reused time and time again — just like a plane, but with more juice. Polaris’ announcement comes days after Germany’s incoming Chancellor Friedrich Merz cast doubts over whether NATO would remain in its “current form,” urging Europe to increase defence spending. <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with Space startups Published February 28, 2025 - 4:03 pm UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
