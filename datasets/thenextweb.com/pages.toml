["https://thenextweb.com/news/tech-companies-are-cashing-on-the-bizarre-science-of-organ-preservation"]
title = "Tech firms are cashing in on the bizarre science of organ preservation"
description = "The strange world of organ preservation is spawning new tech firms. OrganOx has added impetus to the industry with a $142mn funding raise."
full_description = '''<img alt="Tech companies are cashing in on the bizarre science of organ preservation" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FOrganOxs-organ-transplantation-device.jpg&amp;signature=b8fb249fc89b7a7c2e4f8b090fb15b3c" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FOrganOxs-organ-transplantation-device.jpg&amp;signature=1b4634ca4ad0d9a6fee7315397dd5003 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FOrganOxs-organ-transplantation-device.jpg&amp;signature=ce148669bc1ae34b36530751473249d3 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FOrganOxs-organ-transplantation-device.jpg&amp;signature=b8fb249fc89b7a7c2e4f8b090fb15b3c 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Gene-edited pig livers, synthetic embryos, and 3D-printed tissue implants… the world of organ transplantation is becoming increasingly bizarre as scientists explore high-tech ways to keep people alive. These experiments are birthing new business opportunities. One company cashing in is University of Oxford spinout OrganOx, which this week secured $142mn in funding to fuel its expansion in the US as it mulls a potential IPO. OrganOx’s Metra machine pumps oxygenated blood and nutrients through the liver, mimicking natural conditions during a transplant. This helps the organ stay healthier for up to 12 hours longer than traditional methods — giving doctors more time to find a suitable recipient and improving transplant success rates. To date, the technology has been used in more than 5,000 transplant operations. OrganOx isn’t the only player disrupting organ preservation, which has relied on one technique — static cold storage — for decades. TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles Across the pond, Paragonix Technologies has developed an organ transportation device that preserves organs by cooling them and then pumping a special preservation solution through them. This helps to keep the organ cells alive and reduces damage during transport or storage, ensuring the organ stays viable for transplant. The tech caught the eye of Swedish medical-equipment giant Getinge, which acquired Paragonix for $477mn last year. Meanwhile, US biotech scaleup eGenesis, founded in 2015, has raised $456mn to advance xenotransplantation — using CRISPR gene-editing techniques to develop human-compatible organs derived from pigs. Yes, you read that correctly: pig organs for human transplants. Last year, surgeons at the University of Pennsylvania successfully attached one of eGenesis’ genetically-altered pig livers to a brain-dead person. The organ functioned normally for 72 hours. The team used OrganOx’s machine to carry out the transplant. The endeavor aims to address the chronic shortage of donor organs from humans, potentially saving countless lives. In December 2024, there were over 104,000 people in the US waiting for an organ donor. Every day, 17 people die waiting. Craig Marshall, CEO of OrganOx, said that the company is preparing to launch clinical trials for new devices designed to assist kidney transplants, as well as advance its work in genetically-engineered pig livers. Other companies are taking organ transplantation into the realm of science fiction — and raising some ethical questions in the process. Renewal Bio, a startup from Israel, is using cutting-edge stem-cell science to create synthetic human embryos. The company wants to use the embryos — grown in an artificial womb — as a source for harvesting cells and tissues for medical applications, such as organ transplants. While Renewal Bio insists that these entities are not intended to develop into human beings, the potential for creating embryos that resemble people raises ethical questions about the limits of scientific experimentation. <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with tech startups Published February 27, 2025 - 4:44 pm UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
