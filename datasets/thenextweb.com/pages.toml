["https://thenextweb.com/news/european-sports-tech-startups-join-comcast-accelerator"]
title = "European sports tech heads to US with media giant Comcast"
description = "Iceland’s Oz Sports and Ireland’s Orreco have joined a sports tech R&D programme that brings together some of the world's biggest brands."
full_description = '''<img alt="European sports tech heads to US with media giant Comcast" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-8-1.jpg&amp;signature=b00f5197981347c226bb610256079d52" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-8-1.jpg&amp;signature=e23d8d1e12e1a229e4ac3dad5f143b49 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-8-1.jpg&amp;signature=c3bb22eb736883cb0bd21ab438792f32 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-8-1.jpg&amp;signature=b00f5197981347c226bb610256079d52 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Two European sports tech startups are heading to the US for an R&D programme run by media giant Comcast. Ireland’s Orreco will cross the Atlantic with a trove of athletic performance software, while Iceland’s Oz Sports will bring an AI-driven camera system. On arrival, the duo will join Comcast NBCUniversal SportsTech, a six-month accelerator. During the programme, the companies will tap into expertise from various industry leaders. Among them are Comcast broadcasting networks NBC Sports, Sky Sports, and the Golf Channel from Comcast’s broadcasting empire. Further support will come from a star-studded squad of partners, including the Premier League, the PGA Tour, and NASCAR. TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles The diverse lineup of experts is a key selling point. On a video call from Comcast’s headquarters in Philadelphia, Jenna Kurath, Head of Comcast NBCUniversal SportsTech, said the programme is “powered by partnerships.” “By bringing the best of innovation into our organisation, forging those strategic relationships with emerging startups, and working alongside some of the most elite sports organisations in the world, we’re able to really push us beyond the status quo,” Kurath told TNW. The collaborative approach has one overall target: cultivating a new generation of sports tech. But for the teams involved, the attractions are varied. The selected teams receive new routes to accelerate product development, forge industry relationships, and refine commercial strategies. Their partners gain access to emerging technologies that could enhance future broadcasts and sporting events. Comcast, meanwhile, can get an edge on market trends, strengthen partnerships, unlock new revenue streams, and enhance customer experiences. The company is also investing in startups selected for the programme. Inside the programme The potential benefits have proved alluring for startups. Over 1,600 teams applied to this year’s programme. The cohort was then whittled down to just 10 companies. Kurath breaks down the selection process into three key criteria. “The first is, is it a problem we’re solving? The second is, do we have a line of sight on how we’ll test and pilot that technology over the six-month programme and beyond? But probably most important of all is, is this the team that we believe can do it — and is this the team we want to work alongside?” Orreco impressed the selectors with an AI sports analytics platform. The software interprets camera data, blood biomarkers, GPS, and other data sources. It then provides personalised insights on performance, nutrition, training, sleep, and recovery. OZ Sports, meanwhile, earned a spot on the roster after developing an AI-driven, multi-camera 4K60p HDR production unit for broadcasting. The system offers remote sports coverage in top-notch quality — at a fraction of the price. With Comcast recently winning new rights to NBA and Premier League games, the system could support the expanded coverage. “This is a really cost-effective, efficient way for us to do that and make it the best broadcast experience,” Kurath said. Orreco and Oz Sports join a range of European companies that have entered the programme. Europe’s sports tech roster One recent European graduate is the UK’s Kymira, which developed infrared-infused recovery apparel for the Philadelphia Flyers ice hockey team. The gear was initially built for the players, but the benefits have also been tested on front office staff. Another alumnus is Manchester-based Dizplay, meanwhile, makes sports fans active participants in the spectator experience. In partnership with Sky Sports, the startup introduced a “Viewer’s Verdict” for boxing broadcasts, allowing audiences to share real-time opinions and enhance social commentary. This technology could also expand beyond sports, bringing interactivity to live news, talk shows, and other broadcasts. A third British graduate, Tickets for Good, provides a platform that offers discounted tickets to tailored audiences. That could mean sports fans, but it could also serve teachers or first responders. “We’re always looking for companies that are proving themselves in the grand stage of sports, but when they have extensibility into other areas of our business, it’s just all the more powerful,” Kurath said. For European members of the programme, the accelerator offers a springboard to the world’s biggest market. “A lot of the international companies are very strong within their own specific country, but are looking to break into the US market,” Kurath said. “It is huge, it is nuanced. It is not an easy market. The sports industry is not an easy one to break into, so we’re opening doors for them and giving them really deep customer insights on what it means for your technology to succeed in the US market.” Enterprise innovation is one of three key themes at TNW Conference, which takes place on June 19-20 in Amsterdam. Tickets for the event are now on sale. Use the code TNWXMEDIA2025 at the check-out to get 30% off the price tag. <img alt="Thomas Macaulay" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F01%2FThomas-Macaulay-profile-photo.png&amp;signature=5486920986cb8b3f20d6663a23a6cc12" > Story by Thomas Macaulay Managing editor Thomas is the managing editor of TNW. He leads our coverage of European tech and oversees our talented team of writers. Away from work, he e (show all) Thomas is the managing editor of TNW. He leads our coverage of European tech and oversees our talented team of writers. Away from work, he enjoys playing chess (badly) and the guitar (even worse). Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with Artificial intelligence Software startups Published February 25, 2025 - 1:05 pm UTC Back to top <img alt="Thomas Macaulay" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F01%2FThomas-Macaulay-profile-photo.png&amp;signature=5486920986cb8b3f20d6663a23a6cc12" > Story by Thomas Macaulay'''
