title = "Just Eat bought for €4.1B in one of Dutch tech’s biggest-ever deals"
description = "Europe’s biggest food delivery firm Just Eat Takeaway.com is set to be acquired by tech investor Prosus for €4.1bn."
full_description = '''<img alt="Just Eat Takeaway acquired for €4.1B in one of Dutch tech’s largest-ever deals" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-7-1.jpg&amp;signature=e58db919fecf6fc62ad66c6c14685f57" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-7-1.jpg&amp;signature=93185240dfc72d1e5e2083736afe5633 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-7-1.jpg&amp;signature=79a116ec95973c4dfc6327034770264c 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-7-1.jpg&amp;signature=e58db919fecf6fc62ad66c6c14685f57 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Europe’s biggest food delivery firm Just Eat Takeaway.com is set to be acquired by tech investor Prosus for €4.1bn, in one of the biggest acquisitions in the history of Dutch tech. Prosus — the investment arm of South African tech firm Naspers — has agreed to buy Just Eat Takeaway’s shares at €20.30 each in an all-cash offer. That’s a 22% premium over the delivery app’s recent three-month high but only a fifth of its pandemic-era peak of above €100 per share. Following the announcement, Just Eat Takeaway’s shares climbed 53% on the Amsterdam Stock Exchange this morning. Just Eat Takeaway was formed in 2020 through the merger of UK-based Just Eat and Dutch company Takeaway.com. The €7.4bn deal made the Amsterdam-based company — which has been both a speaker and partner at TNW Conference — one of the world’s largest food delivery platforms. However, it’s been a turbulent few years for Just Eat Takeaway since then, amid cooling demand and tough competition from rivals. The company also had a few missteps, most notably its botched takeover of US delivery app Grubhub. Just Eat Takeaway acquired Grubhub for $7.3bn in 2021 only to sell it off for $650mn just three years later. <img src="https://s3.eu-west-1.amazonaws.com/tnw.events/hardfork-2018/uploads/visuals/tnw-newsletter.png">The 💜 of EU techThe latest rumblings from the EU tech scene, a story from our wise ol' founder Boris, and some questionable AI art. It's free, every week, in your inbox. Sign up now!For Prosus, the deal is an opportunity to turn Just Eat Takeaway into a “European tech champion,” said its CEO, Fabricio Bloisi. The Prosus plan for Just Eat Takeaway Prosus already owns iFood, Latin America’s largest food delivery platform. The firm also has stakes in Germany’s Delivery Hero, Chinese shopping platform Meituan, and Swiggy, a grocery delivery app in India. Prosus has wanted to add Just Eat Takeaway to its delivery empire for years. The South African-owned firm tried to hijack the merger of Just Eat and Takeaway.com in 2019 with a £5.1bn (€6.1bn) bid. Just Eat Takeaway announced the deal today alongside its annual results, reporting a 35% jump in pre-tax profits for 2024, reaching €460mn. Jitse Groen, the company’s CEO, said it was “now a faster growing, more profitable, and predominantly European-based business.” Groen hopes that Prosus’ expertise in the delivery sector and AI technology will bring further profits for Just Eat Takeaway. “Prosus fully supports our strategic plans, and its extensive resources will help to further accelerate our investments and growth across food, groceries, fintech and other adjacencies,” said Groen. Just Eat Takeaway confirmed that its current leadership would remain in place under the agreement, which is still subject to shareholder approval. If the deal is approved by shareholders and the relevant authorities, it will be one of the largest acquisitions of a Dutch tech company in history. Other notable buyouts in the country include Warburg Pincus and Apax Partners’ €5.1bn acquisition of T-Mobile Netherlands in 2021 and Siemens’ €628mn purchase of Rotterdam-based software startup Mendix in 2018. US chip maker Qualcomm’s $44bn attempt to acquire its Dutch rival NXP in 2018 would’ve been by far the largest buy, but it fell through after failing to win approval from Chinese regulators. Dutch tech will be a hot topic at TNW Conference, which takes place on June 19-20 in Amsterdam. Tickets for the event are now on sale. Use the code TNWXMEDIA2025 at the check-out to get 30% off the price tag. <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with tech Investor Published February 24, 2025 - 11:55 am UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
