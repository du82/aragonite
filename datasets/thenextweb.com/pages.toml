["https://thenextweb.com/news/european-startups-scaleups-need-ecosystem"]
title = "It takes an ecosystem to raise a scaleup"
description = "Startups need ecosystems to grow. At TNW’s Nurturing Scaleup Success event, tech luminaries explained the model's power — and peril."
full_description = '''<img alt="It takes an ecosystem to raise a scaleup" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-5-1.jpg&amp;signature=c61b39305659c5b41582d9ac3364a851" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-5-1.jpg&amp;signature=7ae7f48e82b40cd2086b3371319d0bf1 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-5-1.jpg&amp;signature=f59fdcc244aa8219da3d5bdd4b3eb9f3 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-5-1.jpg&amp;signature=c61b39305659c5b41582d9ac3364a851 1280w" > Image by: Gerd Altmann document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Europe’s startup scene has entered troubled waters. Long overshadowed by Silicon Valley and now being chased down by China, the continent is urgently looking for boosts. Increasingly, the search is leading to ecosystems. The ecosystem model creates networks of individuals, organisations, and resources. Their shared expertise and resources can produce a multiplier effect, driving innovation and accelerating growth. A core component of European ecosystems is the EU. While its tech strategy often faces criticism, the bloc has also played a key role in driving startup success. Just ask Nicolas Benady, the CEO of Swan, a thriving banking-as-a-service (BaaS) fintech based in France. TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles “Our company wouldn’t exist without the European Union,” he says. Benady points to the impact of the Payment Service Directive, an EU law that established standardised rules for electronic payments. The legislation sparked the success of many global fintech leaders, from Revolut to Adyen. They finally had a chance to compete with banks in payments. Swan has reaped the benefits. Last month, the startup announced it had raised €42mn — the second part of a Series B round that brought Swan’s total funding to an estimated €100mn. “Without this directive, I don’t think we’d have so many fintechs today in Europe,” Benady says. Fintechs are far from the only beneficiaries of the EU ecosystem — but the network still needs work. At TNW’s Nurturing Scaleup Success webinar on Tuesday, Benady joined a panel of European tech experts to explain the power and peril of ecosystems. Their message was clear: no startup scales alone. Their success depends on a thriving ecosystem of partners. 4 pillars of a thriving ecosystem Jason Lynch, CEO of quantum computing startup Equal1, has firsthand experience of the power of ecosystems. His company has partnered with Arm on computing breakthroughs, collaborated with Nvidia to blend hardware with software, and teamed up with the Netherlands Organisation for Applied Scientific Research (TNO) on product development. Equal1 also recently secured investment from TNO. To strengthen the alliance, the startup has set up shop in another component of the Dutch ecosystem: the House of Quantum in Delft, a national campus for quantum startups. Lynch has high hopes for the relocation. “Being in a centre of excellence… is a critical piece of an ecosystem,” he says. At the TNW webinar — now available to watch on-demand — Lynch broke down four crucial benefits of an ecosystem. 1. Talent As Silicon Valley’s network effects continuously prove, startups benefit immensely from proximity to talent. The House of Quantum provides another promising example. With a steady stream of experts flowing through the site, the centre is giving Equal1 a fresh talent pipeline. 2. Infrastructure Computation costs for startups can be astronomical. With access to shared infrastructure, startups can achieve dramatic savings. 3. Partnerships Tech firms often rely on complex supply chains. Ecosystems offer a route to bring each component together. “What a centre of excellence like Delft offers is an ability to work very closely with companies that are just across the corridor,” says Lynch. 4. Customers End users are drawn to areas with substantial expertise and companies. They help startups to validate and commercialise their products more quickly. “A hub like this really attracts in those end users,” says Lynch. Yet Lynch also has concerns about EU ecosystems. Chief among them is a failure to commercialise ideas. “It’s well-recognised that European research is leading the world. People would probably say that bringing that research to market is where Europe has more of a challenge. For me, that’s about speed, getting out of the way of startups, and trying to lower the barriers as much as possible.” The money streams EU policymakers are often slated for providing insufficient support to startups. There are growing signs, however, that their attitudes are changing. Clotilde Hocquard, Public Affairs Lead at France Digitale, a European organisation that connects startups and investors, points to several positive developments. One is an expansion of funding streams, such as a new EU initiative to mobilise €200bn for AI investments. Another is France’s Tibi Initiative, which brings institutional investors together with accredited VC firms to encourage tech investing. “It should be replicated at the European level,” Hocquard says. Big ideas like this have been hard to bring to life, but they’re now attracting growing support. Hocquard noticed the momentum shift after last year’s publication of the Draghi Report, which revealed alarming problems for European innovation. “Policymakers are starting to realise that they need to do something to make sure startups can thrive in Europe,” she says. Despite the positive signs, Hocquard wants faster progress. She points to another example set in the US. “We have to make sure to mobilise pension funds and insurers, like in the United States. And we have to make sure the money is targeted towards VC funds and to finance innovation.” But funding isn’t the only challenge for EU ecosystems. The double-edged sword of regulation Swan may only exist thanks to EU rules, but the bloc’s regulation is a double-edged sword. One big problem is the diversity of laws. Despite the single market, the EU’s legislation is fragmented. “We don’t have anything single,” says Hocquard. “We have 27 member states doing what they want with their rules.” This smorgasbord of laws raises barriers to scaling across borders. If the ecosystem could harmonise the rules, startups would face smoother paths to expansion. Hocquard points to company law as a powerful and straightforward initial target. She also urges member states to stop twisting EU rules in different directions. “If there’s a European law, it should be applied in a uniform way across the continent,” she says. Ecosystems for scale The urge to scale can lead to premature decisions. Benady advises early-stage founders to first focus on the product-market fit. “Once you start to see commercial traction, then you have to scale your company — and this is a totally different game,” he says. At that point, ecosystems become a key player. For Swan, they provided a vital boost to the company’s progress. At first, however, Benady underestimated the value of two essential supporting structures. “Even though my investors warned me, I paid attention a little bit too late to HR and finance,” he admits. “When you scale, you can’t mess with HR and finance.” Benady compares their impact to musicians in a band. “Finance and HR are the drum and the bass. That’s not what you hear; you hear the singer, you hear the guitar — but if you don’t have a perfect drum and bass, you won’t scale your company. So pay attention to finance and HR.” To make sweet startup music, ecosystems need an orchestra of instruments. They require one section for talent, a second for infrastructure, another for partnerships, and a fourth for customers. They also need the public and governments to hum along. “The goal now is convincing citizens that investing in innovation is actually investing in the future of Europe,” Hocquard says. “Once we have the citizens with us, we need the policymakers to make all the legal changes.” With that support, Europe’s band of startups could be heading for the world stage. Ecosystems will be a hot topic at TNW Conference, which takes place on June 19-20 in Amsterdam. Tickets for the event are now on sale. Use the code TNWXMEDIA2025 at checkout to get 30% off the price tag. <img alt="Thomas Macaulay" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F01%2FThomas-Macaulay-profile-photo.png&amp;signature=5486920986cb8b3f20d6663a23a6cc12" > Story by Thomas Macaulay Managing editor Thomas is the managing editor of TNW. He leads our coverage of European tech and oversees our talented team of writers. Away from work, he e (show all) Thomas is the managing editor of TNW. He leads our coverage of European tech and oversees our talented team of writers. Away from work, he enjoys playing chess (badly) and the guitar (even worse). Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with Investor Europe startups Published February 21, 2025 - 3:00 pm UTC Back to top <img alt="Thomas Macaulay" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&