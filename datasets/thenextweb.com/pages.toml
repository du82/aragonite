title = "Dutch unicorn Bird flees ‘overregulated’ EU for ‘global hubs’ — and a meditation retreat"
description = '''Dutch tech leader Bird is moving operations outside of the EU. The company's CEO said the bloc's policymakers are "killing innovation".'''
full_description = '''<img alt="Dutch unicorn Bird flees ‘overregulated’ Europe for ‘global hubs’ — and a meditation retreat" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FRober-Vis-the-co-founder-and-CEO-of-Bird-formerly-MessageBird.jpg&amp;signature=d7f1cfb12ea55a54e97a8320b7bedbf5" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FRober-Vis-the-co-founder-and-CEO-of-Bird-formerly-MessageBird.jpg&amp;signature=abf2f4c68e95a58d65397bbd4547f6c0 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FRober-Vis-the-co-founder-and-CEO-of-Bird-formerly-MessageBird.jpg&amp;signature=d1a7a539bf9d08fe03b26c7557b54317 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FRober-Vis-the-co-founder-and-CEO-of-Bird-formerly-MessageBird.jpg&amp;signature=d7f1cfb12ea55a54e97a8320b7bedbf5 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Dutch software firm Bird is moving most of its operations out of the Netherlands and opening new global hubs as it seeks a reprieve from “overregulation” in Europe, said co-founder and CEO Robert Vis. “The AI Act, financing, compensation, taxes, employment law — starting and running a company [in Europe] is hard,” Vis told TNW, adding that there are “too many disparate markets that are overregulated with no clear vision for the future while the world around us is changing.” Bird (formerly MessageBird) is one of the Netherlands’ leading tech scaleups, reaching unicorn status in 2018. Bird’s main product is a cloud-based platform that manages customer communications across messaging apps, calls, video, SMS, and email. The company also recently launched a new “AI employee” chatbot, which handles tasks such as responding to customer inquiries, qualifying leads, and providing personalised support. Vis is now looking overseas to fuel the company’s next advances. “Both The Hague and Brussels enjoy being in meetings and talking more than they get shit done,” Vis said, adding that EU policymakers are “killing innovation.” Amsterdam-based Bird will now open up three new offices in the US, and one each in Singapore, Dubai, and Istanbul. It will also open a “meditation, rejuvenation, and health centre” in Thailand for its employees, Vis said in a LinkedIn post. Nevertheless, Bird will maintain an office in Lithuania and keep its tax base in the Netherlands for now — so it’s not leaving the EU entirely. Earlier this month, Bird cut 120 jobs — roughly one-third of its total workforce, which is mainly based in Europe. New AI tools contributed to the staff cuts, said Vis, but it was also an effort to “position our teams closer to our customers” in the “Americas and Asia,” he told TechCrunch. The news comes as the EU pushes ahead with its landmark AI Act, which entered force last year. The act lays out a rulebook for governing AI based on risk levels, designed to ensure the technology is deployed safely, transparently, and ethically. The US, meanwhile, is moving in the opposite direction. While the EU imposes strict rules, the Trump administration is removing AI restrictions and giving tech sector leaders such as Elon Musk prominent roles in government. “There is no stopping this technology whether we like it or not,” said Vis. “Whatever the future will hold — if you want to compete you need to be liberal not restrictive.” Robert Vis is a former speaker at TNW Conference, which takes place on June 19-20 in Amsterdam. Tickets for the event are now on sale. Use the code TNWXMEDIA2025 at the check-out to get 30% off the price tag. <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with tech Artificial intelligence Published February 24, 2025 - 4:28 pm UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
