title = "Max Planck spinout unveils 'world's most viable' fusion reactor plan"
description = "German startup Proxima Fusion has unveiled an energy reactor slated to create the quickest route to commercially viable fusion power."
full_description = '''<img alt="Max Planck spinout unveils &#8216;world&#8217;s most viable&#8217; fusion reactor design — and only needs 6 years to build it" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-10.jpg&amp;signature=5922a395215d021d250458fe287d987b" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-10.jpg&amp;signature=37edbdffcf72492beaf1b08baa0edfe9 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-10.jpg&amp;signature=9ee8003a62e9fcf1729eb77996f35e0a 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-10.jpg&amp;signature=5922a395215d021d250458fe287d987b 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); German startup Proxima Fusion — whose team includes engineers from MIT, Google, SpaceX, and McLaren — has unveiled a fusion energy reactor design it believes offers the quickest route to commercially viable fusion power. Dubbed Stellaris, the machine is a quasi-isodynamic (QI) stellarator with high-temperature superconducting (HTS) magnets. This type of reactor uses complex, twisted magnetic fields to confine hot plasma, creating the conditions needed for fusion reactions. “Stellaris is designed to operate in continuous mode and be intrinsically stable,” Francesco Sciortino, Proxima’s co-founder and CEO, told TNW. “No other fusion power plant design has yet been demonstrated to be capable of that.” Stellaris’ design builds on the Wendelstein 7-X, the world’s largest stellarator, located at the Max Planck Institute for Plasma Physics in Germany. While Wendelstein 7-X was developed for research, Stellaris could one day power the grid. TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles Proxima aims to bring the design to life with its first demonstrator — Alpha — slated for completion in just six years. Alpha will be the first-ever fusion device demonstrating net energy production in a steady state, said Sciortino. The machine will lay the foundation for Proxima’s first 1GW fusion reactor, which the company hopes will power up sometime in the 2030s. Stellarators have several advantages over their more popular cousin, the tokamak (the type adopted by ITER mega project under construction in France). They need less power to operate and are more stable. Their biggest drawback is complexity — stellarators are notoriously hard to design and build. This is why they were largely set aside in the 1960s for the tokamak. However, advances in computational power are closing the gap. An AI-enabled fusion reactor design Similar to other industries like automotive or aerospace, Proxima uses AI supercomputers to rapidly iterate the best fusion reactor designs based on key parameters like cost, material availability, and efficiency. So instead of having to build multiple prototypes, Proxima can jump straight into building a functioning demonstrator. “The understanding of complex geometry and its consequences is everything in stellarators,” said Sciortino. “AI is helping Proxima to uncover patterns that lead to simpler, faster, and cheaper designs.” Stellaris is designed to generate more power per unit volume than any previous stellarator. HTS magnets create stronger magnetic fields, allowing for smaller, faster-to-build, and more efficient reactors. This approach also reduces costs in both construction and operation. Stellaris uses only existing materials, making it buildable with today’s supply chains, the company said. Full details of the reactor were published today in the journal Fusion Engineering and Design. The renders of Stellaris feature a unique twisting design. Credit: Proxima Fusion<img loading="lazy" decoding="async" class="size-full wp-image-1412370" src="https://cdn0.tnwcdn.com/wp-content/blogs.dir/1/files/2025/02/Untitled-design-11.jpg" alt="Artist's render of Stellaris, a fusion energy reactor designed by Proxima Fusion" width="1280" height="720" srcset=""> Munich-based Proxima made history in 2023 as the first company to spin out from the esteemed Max Planck Institute for Plasma Physics, one of the world’s leading fusion research centres. The institute focuses exclusively on fusion and has more plasma physicists than MIT. Proxima raised €20mn in funding last year as it looks to turn the mind-bending physics of fusion into a viable business. “When Proxima started its journey, the founders said, ‘This is possible, we’ll prove it to you,’ and they did,” said Ian Hogarth, a partner at Plural, one of Proxima Fusion’s earliest investors. “Stellaris positions QI-HTS stellarators as the leading technology in the global race to commercial fusion.” <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with AI Published February 26, 2025 - 12:01 am UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
