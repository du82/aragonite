title = "Apple, Google, Meta are sharing more data with the US gov than ever"
description = "Tech giants are giving US law enforcement data on millions of user accounts, according to a new report from Proton."
full_description = '''<img alt="Apple, Google, Meta are sharing more data with the US government than ever, Proton finds" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-16.jpg&amp;signature=434c630a7a4509bef09c5eb9488c7234" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-16.jpg&amp;signature=9d87218b13c23f1ea7f8aa98e5c94834 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-16.jpg&amp;signature=6963b0af507150fcc154dc45fb35635a 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-16.jpg&amp;signature=434c630a7a4509bef09c5eb9488c7234 1280w" > Image by: Gerd Altmann from Pixabay document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Most of us share and store huge amounts of personal data online, from our names and addresses to photos of our loved ones. In many ways, firms like Apple, Google, and Meta are the gatekeepers of this sensitive information. But what happens when the authorities come knocking? It appears that Silicon Valley often rolls over and complies. Over the last 10 years, Apple, Google, and Meta have handed over data on 3.1 million accounts to the US government, according to a new report by Swiss software company Proton. The number of times officials have requested user data from Big Tech has skyrocketed by an average of 600% over the same timeframe, Proton found. Meta’s data sharing surged by 675%, marking the largest increase, followed by Apple at 621% and Google at 530%. Apple, Google, and Meta comply with between 80-90% of US government data requests, according to Proton. This potentially includes handing over user emails, files, messages, and other highly personal information. <img src="https://s3.eu-west-1.amazonaws.com/tnw.events/hardfork-2018/uploads/visuals/tnw-newsletter.png">The 💜 of EU techThe latest rumblings from the EU tech scene, a story from our wise ol' founder Boris, and some questionable AI art. It's free, every week, in your inbox. Sign up now!While data requests also saw an uptick from countries including Germany, France, and the UK, the US took the lion’s share. “All that’s required for the government to find out just about everything it could ever need is a request message to Big Tech in California,” said Raphael Auphan, COO of Proton. “And as long as Big Tech refuses to implement widespread end-to-end encryption, these massive, private data reserves will remain open to abuse.” Data sharing with US authorities has surged since 2014. Credit: Proton<img loading="lazy" decoding="async" class="size-full wp-image-1412403" src="https://cdn0.tnwcdn.com/wp-content/blogs.dir/1/files/2025/02/Total-accounts-shared-over-time.png" alt="Graph showing the total accounts shared over time" width="1640" height="892" srcset=""> Government desires for data Proton — best known for its products ProtonMail, ProtonVPN, and ProtonDrive — has long positioned itself as a privacy-first alternative to Big Tech firms. However, the company also complies with its fair share of government requests for user data. According to Proton’s own transparency report, it received 13 data requests from Swiss authorities back in 2017, soaring to 6,378 by 2024. Of those, it complied with 5,971 of the requests. That’s 93% — higher than the Big Tech companies highlighted in the new report. However, unlike Silicon Valley’s giants, Proton encrypts emails, files, and VPN traffic in a way that even the company itself cannot read or access. So, even if authorities demand data, there’s very little it can provide. “In no circumstances can we share emails, files, contact lists, calendar entries or other personal content,” a Proton spokesperson told TNW. “We cannot share what we do not have.” Moreover, Proton operates under strict Swiss privacy laws, which means foreign governments cannot request data from it without first going through Swiss courts, adding an extra layer of security for users. But under specific circumstances, the company can hand over metadata about the account, including IP address, email address, and recipient emails. “Proton is dedicated to protecting user privacy but that does not mean it’s a safe haven for illegal activity,” the spokesperson said. “Proton is subject to national laws and has legal obligations, to which we are obliged to comply unless we have legal grounds to contest, which does not happen very often in Switzerland.” <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with Google Privacy Apple Meta Published February 27, 2025 - 11:32 am UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
