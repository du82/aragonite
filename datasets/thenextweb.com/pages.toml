["https://thenextweb.com/news/tennis-star-venus-williams-backs-walking-app-weward"]
title = "Venus Williams backs French startup that rewards you for walking"
description = "The market for walking apps is heating up. One contender, WeWard, has been backed by Grand Slam tennis champion Venus Williams."
full_description = '''<img alt="Venus Williams backs French startup that rewards you for walking" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-15.jpg&amp;signature=9aa43d74085ba1c9672dbd506857c600" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-15.jpg&amp;signature=36f65e1c547c36c8b0045fedf134ab8c 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-15.jpg&amp;signature=fe7311ede0d06aba1119d9926656052e 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-15.jpg&amp;signature=9aa43d74085ba1c9672dbd506857c600 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); Venus Williams is most famous for being one of the best tennis players of all time, but she’s also a prolific angel investor. In her latest business move, Williams has backed French startup WeWard. WeWard is a free app that offers real-world rewards for walking. It tracks your steps and lets you earn points (called “Wards”), which can be exchanged for gift cards, donations, or discounts. The goal is to encourage people to be more active while benefiting from their daily movement. Williams has invested an undisclosed sum in the company and will also act as an ambassador. WeWard, meanwhile, has committed to donating $25,000 to her charity, CARE, and will host a month-long “Venus Williams Championship” where users can unlock up to $40,000 in donations by reaching step milestones. “A large part of staying well and active is simply by moving your body whichever way you can, and with WeWard, walking becomes a fun and rewarding experience,” said Williams, whose portfolio also includes French social investing app Shares and Pelago, a British startup tackling substance abuse via “virtual clinics.” TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles Beyond physical rewards, users can collect virtual trading cards — dubbed WeCards — placed at specific locations on the map, a bit like Pokémon Go. Users can compete with friends or join virtual leagues, tracking their progress on leaderboards and earning gold, silver, or bronze medals based on activity levels. The idea is to incentivise people to walk further and more often — and it seems to be working. Approximately 6.5 million WeCards are collected daily by the roughly 20 million people who use the app, the company said. Walking plans WeWard’s CEO, Yves Benchimol, founded the startup in 2019 alongside Nicolas Hardy and Tanguy de la Villegeorges. The company is almost completely bootstrapped, save for a few hundred thousand euros in seed funding raised in 2020. While WeWard has not raised much capital itself, it has handed plenty of money out. To date, the company has given $20mn in cash back to users and $1mn to charity partners, it claims. WeWard generates revenue through retail partnerships, advertising, and features like “Playtime,” where users can earn additional rewards by engaging with third-party mobile games directly through the app. WeWard is just one of a cohort of pro-walking fitness startups. Rivals include Walk15, a Lithuanian company that’s trialled its tech with public healthcare services. Walk15’s co-founder and CEO, Vlada Musvydaitė-Vilciauske, told TNW last year that she wants to create “a pharmacy for walking.” <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with tech Apps startups Published February 26, 2025 - 2:58 pm UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
