["https://thenextweb.com/news/bliro-ai-app-offers-privacy-first-transcriptions"]
title = "New AI app transcribes in real-time without recording audio or video"
description = "German startup Bliro has introduced a privacy-first transcription tool that offers a more secure way to transcribe audio."
full_description = '''<img alt="AI app that transcribes without recording audio or video promises to safeguard your privacy" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-14.jpg&amp;signature=86208899f2b7a23272e8169e01bc4788" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-14.jpg&amp;signature=6eda8c86d0c44c8986a529a253ac8045 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-14.jpg&amp;signature=0769f8b9d345f3ab0da3f0f1cf6a4533 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-14.jpg&amp;signature=86208899f2b7a23272e8169e01bc4788 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); An AI-powered note-taking app developed by Munich-based startup Bliro could offer a more secure way to transcribe audio. Bliro uses natural language processing and machine learning algorithms to extract relevant information from in-person or virtual conversations. It then generates structured meeting notes and automates follow-up tasks. So far, pretty standard. However, unlike popular transcription tools like Otter, Fireflies, or Notta, Bliro isn’t a bot that hops onto your call, records an audio file, and then transcribes it. Instead, the platform transcribes in real-time, ensuring that no audio recordings of conversations are ever created. This guarantees compliance with strict privacy and security requirements like GDPR, the company said. That also means you don’t need the other party’s consent to record, streamlining the note-taking process. TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles Maurice Schweitzer, Bliro’s co-founder, told TNW that the approach eliminates risks associated with audio and video recordings. “A transcript lacks personally identifiable elements like voice or facial recognition, making it impossible to verify who said what with absolute certainty,” he said. For those transcripts that do contain personal information like names, the company “prioritises compliance” at every step, Schweitzer added. Schweitzer co-founded Bliro in 2022 alongside data scientist Martin Thoma, as a privacy-first transcription tool, spun out from AI research at the Technical University of Munich. In addition to eschewing the recording process, Bliro encrypts all data processed in the app and stores it on servers in Frankfurt. It does not share data with third parties, including its own employees, without explicit consent. Nor does it use user data to refine its AI models, the company said. “Many large companies avoid recording-based solutions due to privacy and compliance concerns — making Bliro the only viable option for them,” said Schweitzer. Bliro targets customer-facing teams who use the app to automate meeting transcriptions, generate AI-driven summaries, and create follow-up actions — while maintaining privacy and compliance. The app currently supports 15 languages. Today, Bliro announced it has raised €2.8mn in a funding round led by German early-stage VC LEA Partners, with participation from 468 Capital and Dutch seed investor Rockstart. Bliro also launched its iOS app, which transcribes and analyses face-to-face conversations. The new funding will be used to accelerate product development and win more customers. Schweitzer said more than 1,000 companies already use Bliro, including well-known German brands such as ImmoScout24, OMR, and Telefónica Germany. <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with Privacy Cybersecurity AI Published February 26, 2025 - 10:25 am UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
