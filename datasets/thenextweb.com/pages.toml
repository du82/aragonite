["https://thenextweb.com/news/remote-ceo-tells-startups-to-leave-europe"]
title = "‘I tell startups to leave Europe,’ says Dutch CEO of tech unicorn Remote"
description = 'The EU is "stifling innovation" and creating "a massive risk for Europe,” said the CEO of Remote, a tech firm valued at over $3bn.'
full_description = '''<img alt="‘I tell startups to leave Europe,’ says Dutch CEO of tech unicorn Remote" class="c-article__mediaImage w-full absolute top-0" src="https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-13.jpg&amp;signature=bc60180c7db450f558019f02707e5309" sizes="(max-width: 1023px) 100vw 868px" srcset="https://img-cdn.tnwcdn.com/image?fit=576%2C324&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-13.jpg&amp;signature=4b75363530ed9e6bd49b1eaf1ebe82f5 576w, https://img-cdn.tnwcdn.com/image?fit=1152%2C648&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-13.jpg&amp;signature=a3edf45cd15c6ac2bf253cf1a51a7ae6 1152w, https://img-cdn.tnwcdn.com/image?fit=1280%2C720&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2025%2F02%2FUntitled-design-13.jpg&amp;signature=bc60180c7db450f558019f02707e5309 1280w" > document.getElementsByClassName('tnw-ad-wrapper')[1]?.classList?.add('ad-wrapper__growth-quarters'); As the US and China pursue dominance in the global technology race, concerns are mounting among European founders that the region’s entrenched bureaucracy is impeding its capacity for innovation and growth. The EU is going “overboard on tech regulation,” said Job van der Voort, CEO and founder of Remote, an HR tech company valued at over $3bn. “It’s stifling innovation and it’s a massive risk for Europe.” Van der Voort told TNW that many business leaders share his view. “Most entrepreneurs agree this is a huge problem,” he said. Indeed, such concerns are being raised with growing frequency. At a conference in Paris earlier this month, the likes of Mistral CEO Arthur Mensch and DeepMind founder Demis Hassabis repeatedly called for regulation in Europe that is “flexible enough” to support innovation and competitiveness. A little over a week later, Dutch software unicorn Bird took drastic steps to escape “overregulation,” announcing plans to move most of its operations out of Europe.TNW Conference - Groups get the best fun and the best dealsBring your team and multiply your efficiency to cover more grounds and collect new leads. Group Bundles “I think more companies will be forced to do the same [as Bird],” said van der Voort. “But the biggest impact will be at the early stage.” The founder highlighted the ongoing trend of European startups crossing the Atlantic to scale. Research by London-based VC Hoxton Ventures found that nearly all European startups with over $500mn in revenue — including Spotify, Wise, and Adyen — succeeded by winning the US market. Van der Voort believes burdensome tech regulation is encouraging moves beyond the continent. “It’s becoming unattractive to start and maintain a business here,” he said. “That’s why I tell startups to leave Europe if they want to succeed.” Van der Voort has followed his own advice. After he and Marcelo Lebre founded Remote in 2019, the partners decided to base the company in San Francisco. “It was simply easier to start it there,” he said. Remote, which helps businesses hire and manage remote teams, has grown rapidly since then. In 2022, the company raised $300mn in a Series C round that pushed its valuation above $3bn. “The EU needs to consider its own fate over the next decades,” warned van der Voort. “Regulation standing in the way of innovation — that makes it harder for startups and is incredibly hurtful for the economy.” Job van der Voort is a former speaker at TNW Conference, which takes place on June 19-20 in Amsterdam. Tickets for the event are now on sale. Use the code TNWXMEDIA2025 at the check-out to get 30% off the price tag. <img alt="Siôn Geschwindt" class="c-contributor__photo" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecos (show all) Siôn is a climate and energy reporter at TNW. From nuclear fusion to escooters, he covers the length and breadth of Europe's clean tech ecosystem. He's happiest sourcing a scoop, investigating the impact of emerging technologies, and even putting them to the test. Siôn has five years journalism experience and holds a dual degree in media and environmental science from the University of Cape Town, South Africa. Get the TNW newsletter Get the most important tech news in your inbox each week. Also tagged with Innovation founders Published February 25, 2025 - 6:05 pm UTC Back to top <img alt="Siôn Geschwindt" id="duotone" width="96" height="96" class="c-article__authorImage blend-blue-dark" src="https://img-cdn.tnwcdn.com/image/duotone?fit=240%2C240&amp;gradient=%23660099-%2300CCAA&amp;url=https%3A%2F%2Fcdn0.tnwcdn.com%2Fwp-content%2Fblogs.dir%2F1%2Ffiles%2F2024%2F11%2Fheadshot-sion-2.jpg&amp;signature=54baffa26ded259efa3d8f558315df00" > Story by Siôn Geschwindt'''
