full_description = '''News Pete Hegseth Deploys 3,000 U.S. Troops On Beer Run Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: March 3, 2025 WASHINGTON—Declaring the utter lack of alcohol in the Pentagon kitchen to be a “national emergency,” Defense Secretary Pete Hegseth reportedly deployed 3,000 troops American on a beer run Monday. “As of this morning, I have ordered our armed forces to travel to liquor stores, gas stations, and 7-Elevens across the country to stock up on brewskis ASAP,” said Hegseth, adding that he’d also sent a Stryker Brigade Combat Team and a General Support Aviation Battalion to load up their armored vehicles and aircraft with as many 30-packs of Keystone Light, Busch Light, and Natty Light as they could fit. “Although we previously ordered the National Guard to score beer back in January, it ran out in, like, a day. Now it’s becoming increasingly clear that without military intervention, our kegs will run dry before the night even begins. The last thing this nation needs is to be left with nothing but tequila. That shit gives me such a fucking hangover.” According to sources, Hegseth also ordered the military to buy several thousand bottles of Smirnoff for some chicks he had been texting. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* PhoneThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_confir