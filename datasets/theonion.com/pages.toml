["https://theonion.com/privacy-policy"]
title = "Privacy Policy - The Onion"
description = "Get All The Latest Headlines By Email, Once A Day*"
full_description = "Privacy Policy Effective Date: August 16, 2024 Please see our Privacy Snapshot below for an overview of our privacy practices. This Privacy Policy describes how Global Tetrahedron, LLC (“Company”, “we”, “us”, or “our”) handles personal information that we collect through our website(s)or mobile applications located at https://www.theonion.com/ or through other websites that we own or control and that link to this Privacy Policy. Through the website, users can access online parody content, such as our newsletters, articles, editorials, and any related services and/or features (collectively, the “Services”). Personal Information We Collect Personal information you provide: Contact details, such as your email address, phone number, and social media handles. Account information, such as the username and password you use to log into your account. Payment information that our payment service providers collect to process your transactions with us, including your first and last name, payment card information, billing information, and mailing address. We do not store payment card numbers on our systems. The information you provide in connection with your purchases is handled by our third-party payment processors in accordance with their terms of service and privacy policies. Communications that we exchange with you, including when you contact us with questions, feedback or otherwise correspond with us online. Shopping history, including information about the items you viewed, added to your cart, purchased, or returned. Contests, sweepstakes, promotions and surveys. From time to time you may be able to participate in contests, giveaways, surveys, sweepstakes or other similar promotions that we, or third parties, may sponsor. When you participate in these initiatives, we collect personal information such as name, contact information, reviews, and survey or contest responses or submissions. Your image. We may take photos and video recordings of you during our live events. We will inform you if this is happening and obtain your permission where required. Marketing information, such as your preferences for receiving our newsletters and marketing communications about our Services, and details about how you engage with them. Other data not specifically listed here, which we will use as described in this Privacy Policy or as otherwise disclosed at the time of collection. Where you provide us with the personal information of third parties, such as your friends, it is your responsibility to inform them about the processing of their personal information in accordance with this Privacy Policy, and to confirm that they have given their permission. Automatic data collection: We, our service providers and our business partners may automatically log information about you, your computer or mobile device, and your interactions over time with our Services and our communications, such as: Device data, such as your computer’s or mobile device’s operating system type and version, manufacturer and model, browser type, screen resolution, device type (e.g., phone, tablet), IP address, unique identifiers (including identifiers used for advertising purposes), and language settings. Online activity data, such as pages or screens you viewed, the website you visited before browsing to the Services, navigation paths between pages or screens, information about your activity on a page or screen, access times, and whether you have opened or otherwise engage with our communications, such as our marketing emails or clicked links or files within them. Location information, such as your city, state, zip code, to personalize content provided to you, or to show you prices and promotions. We may also collect precise geolocation information to better tailor content and ads. You can control precise geolocation settings from the operating system of your device. We collect this information using cookies and other similar technologies. For more information, please visit our Cookie Policy. Information we obtain from other sources: Social media information. We may maintain pages on social media platforms, such as Facebook, Instagram, LinkedIn, and other third-party platforms. When you visit or interact with our pages on those platforms, the platform provider’s privacy policy will apply to your interactions and their collection, use and processing of your personal information. You or the platforms may provide us with information through the platform, and we will treat such information in accordance with this Privacy Policy. Third-party login information. When you link, connect, or login to the Services with a third party service (such as Google or Facebook), you direct the service to send us information (e.g., contact information) controlled by that service or as authorized by you via your privacy settings at that service. The information we receive when you authenticate through a third-party service depends on the settings, permissions and privacy policy controlled by that third-party service. You should always check the privacy settings and notices in the relevant third-party services to understand what data may be disclosed to us or shared with us. Other sources. We may obtain personal information (e.g., demographic information) from other third parties, such as marketing partners, publicly-available sources, and data providers. How We Use Your Personal Information We use personal information for the following purposes or as otherwise described at the time of collection: Provide, operate and maintain the Services. It is in our legitimate business interests to use personal information to operate, maintain, and provide you with our Services, including ensuring you can use our website. If we have entered into a contract with you, we will use your personal information as required for us to perform our contractual obligations under the relevant contract. Facilitate your login to the Services via third-party identity and access management providers. It is in our legitimate business interests to use personal information to enable you to access our Services through third-party providers, increasing access options and efficiency of using the Services. Establish and maintain your user profile on the Services. To perform our contractual obligations to you, or when it is in our legitimate interests to do so, we will use your personal information to facilitate the creation, operation, and maintenance of your user profile as part of the Services for purposes of personalizing your user experience. Communicate with you about the Services, including by sending you announcements, updates, security alerts, and support and administrative messages. To perform our contractual obligations to you, or when it is in our legitimate interests to do so, we will use your personal information to respond to your requests, questions and feedback, and communicate with you about our Services, including by sending announcements, updates, security alerts and support and administrative messages. Improve, monitor, personalize, and protect our Services. It is in our legitimate business interests to improve and keep our Services safe for our users, which includes: Understanding your needs and interests, and personalizing your experience with the Services and our communications. Troubleshooting, testing and researching, and keeping the Services secure. Contests, sweepstakes, promotions and surveys. It is in our legitimate business interest to conduct contests, sweepstakes, promotions and surveys and collect feedback or other content from your reviews or submissions. Where we intend to publish your survey responses or reviews with information that identifies you we will ask you for your consent to be able to process this information. Research and development. We may use personal information for research and development purposes where it is in our legitimate business interests, including to analyze and improve the Services and our business. As part of these activities, we may create or use aggregated, de-identified, or other anonymized data from personal information we collect. We make personal information into anonymized data by removing information that makes the data personally identifiable to you. We may use this anonymized data and share it with third parties for our lawful business purposes, including to analyze and improve the Services and promote our business. Marketing and advertising. We, our service providers, and our third-party marketing and advertising partners may collect and use personal information for the following marketing and advertising purposes: Direct marketing. We may from time-to-time send you direct marketing communications as permitted by law, including, but not limited to, sending you newsletters and notifying you of special promotions, offers and events that we think may be of interest to you as permitted by law, including by email. You may opt out of our marketing communications as described in the “Opt-out of marketing communications” section below. Interest-based advertising. We may engage third-party advertising partners, including third party advertising companies and social media companies, to display our ads around the web. These companies may use cookies and similar technologies to collect information (including the automatically-collected data described above) about your interactions over time across our Services, our communications, and other online services, and use that information to serve online ads that may interest you. For more information, or to understand your choices for limiting interest-based advertising, please visit our Cookie Policy. We also participate in affiliate advertising and allow affiliate links to be encoded on some of our pages. This means that we may earn a commission when you click on or make purchases via affiliate links and affiliate partners may use cookies to understand your use of the Services. Except where consent 