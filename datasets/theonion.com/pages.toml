full_description = "About The Onion The Onion is the world’s leading news publication, offering highly acclaimed, universally revered coverage of breaking national, international, and local news events. Rising from its humble beginnings as a print newspaper in 1756, The Onion now enjoys a daily readership of 4.3 trillion and has grown into the single most powerful and influential organization in human history. In addition to maintaining a towering standard of excellence to which the rest of the industry aspires, The Onion supports more than 350,000 full- and part-time journalism jobs in its numerous news bureaus and manual labor camps stationed around the world, and members of its editorial board have served with distinction in an advisory capacity for such nations as China, Syria, Somalia, and the former Soviet Union. On top of its journalistic pursuits, The Onion also owns and operates the majority of the world’s transoceanic shipping lanes, stands on the nation’s leading edge on matters of deforestation and strip mining, and proudly conducts tests on millions of animals daily. Frequently Asked Questions How can I contact The Onion? MembershipFor Address Changes And Other Customer Service Issues, Please Email: membership@theonion.com To Update Your Payment Information:Membership Management PortalPrint Membership Terms Advertisingadvertising@theonion.com Press and Eventsmarketing@theonion.com Feedbackpublicfeedback@theonion.com Back Issuesarchive@theonion.com Licensingpermissions@theonion.com LegalPaula Brillson, General Counsellegal@theonion.comDMCA Notice Procedure Website SupportTo report a technical issue with TheOnion.com, please submit a request through the publicfeedback@theonion.com email with a summary of the issue and your browser information. Please note that unsolicited bulk email, email attachments, and junk email of any kind are not accepted, and will be filtered and immediately discarded upon receipt. Can I submit articles or ideas to The Onion? No, The Onion does not accept outside submissions of any kind. We will not respond to any unsolicited submissions. By submitting an idea, you acknowledge and accept that you forever relinquish your rights to claim ownership or seek compensation for the use of your submission. How can I work for The Onion? Onion Inc. regularly posts new openings on the Careers section of our website. On the exceedingly rare occasions that there are openings for editorial positions, those opportunities will be posted on our Careers page as well. Please do not send résumés unless specifically told to do so in a job listing. Any unsolicited résumés will be immediately discarded. What if I have feedback on an Onion article? Please send all concerns to publicfeedback@theonion.com. The Onion cannot guarantee a response to any feedback to its content. What if I want to sue The Onion? Please do not do that. The First Amendment protects satire as a form of free speech and expression. The Onion uses invented names in all of its stories, except in cases where public figures are being satirized. Any other use of real names is accidental and coincidental. The Onion is not intended for readers under 18 years of age. What is The Onion’s privacy policy? To read The Onion’s privacy policy, please click here. What if I want to advertise with The Onion? Please send all advertising inquiries to advertising@theonion.com. Please specify the business you would like to advertise, and the appropriate advertising sales representative will get back to you promptly. I’m a member of a lesser media organization and I want to cover The Onion. How do I do that? Please send all inquiries to press@theonion.com. How can I bring The Onion to my event? The writers and editors of America’s Finest News Source and its sister sites are available for speaking engagements at universities, conferences, annual or semi-annual meet-ups for disgraced veterinarians, and festivals. Please send all inquiries to press@theonion.com. How can I find archived issues of The Onion or license its content? This website contains all of The Onion’s articles published from early 1996 through the present. You can browse by topic, tags, and authors or search the entire archive by keyword. Please send requests for articles and graphics from past issues, including those published before 1996, to archive@theonion.com.The Onion will attempt to answer your query but cannot guarantee a response to all such requests. The Onion may not be reprinted or retransmitted in whole or in part without the express written consent of the publisher. To license material from The Onion, please send a request to permissions@theonion.com. Where can I find The Onion? The Onion is all around you. Outside of TheOnion.com, you can join America’s Finest Membership to receive the finest print newspaper in the world or connect to the most important journalism in human history through the following channels: Social Media Instagram TikTok YouTube Bluesky Facebook Twitter Books The Onion has released 13 books over its illustrious 250-year publishing history, including four books of original material. All are available for purchase here. Our Dumb Century: The Onion Presents 100 Years Of Headlines From America’s Finest News Source (1999) Purchase Book Our Dumb World: The Onion’s Atlas Of The Planet Earth (2007) Purchase Book The Onion Book Of Known Knowledge: A Definitive Encyclopaedia Of Existing Information (2012) Purchase Book The Trump Leaks: The Onion Exposes the Top Secret Memos, Emails, and Doodles That Could Take Down a President (2017) Purchase Book Staff The Onion Editor in Chief Chad Nackers Executive Editor Jordan LaFlure Managing Editor Samantha Hungerford Deputy Managing Editor Claire Favret Head Writer Mike Gillis Senior Editors Lauren Moser, Danny Mulligan Video Director Ryan Natoli Senior Writers Nick Mehendale, Hannah Wolansky, Sammi Skolmoski Headline Contributors: Devin Blake, Meredith Dietz, Tricia England, Patrick Flood, Davi