full_description = '''Football, Sports Jalen Carter Flees Scene In Parade Float Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: February 14, 2025 PHILADELPHIA—Looking dead-eyed into the distance as it slowly dawned on him what he had done, a visibly distraught Jalen Carter reportedly fled the Eagles Super Bowl celebration Friday after commandeering a parade float. “Oh, goddamn it, move, move!” said the panicked 23-year-old defensive tackle, who frantically slammed his foot on the vehicle’s gas pedal and drove the green trailer filled with players, cheerleaders, and a dancing Eagles Mascot down the highway at its maximum speed of 15 mph. “Okay, Jalen, calm down. They can’t link you to anything. Plus, everyone is way too focused on your Super Bowl win. There’s no way I’m going down today. Over my dead body!” At press time, Carter could be heard using a megaphone to call his lawyer as the parade’s police float attempted to pull him over. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* CommentsThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_5').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parse