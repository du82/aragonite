full_description = '''Entertainment Jennifer Lopez Worried Bumble Date Not Coming Back From Bathroom Multiplatinum Artist Concerned At Lengthy Absence Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: March 4, 2025 BEVERLY HILLS, CA—Growing increasingly anxious as yet another minute passed without the 56-year-old consultant’s return, Jennifer Lopez reportedly expressed concerns Thursday that her Bumble date was not coming back from the bathroom at the Maybourne Bar. “We were really vibing on text, and it seemed things were going pretty good over the first drink, but Rich has been gone for way too long,” said the singer and actress, who nervously tapped her fingers on the booth’s table, peeked down the hallway toward the restroom to look for the divorced father of one, and then told a passing waiter that “they were probably okay” on orders for now. “Jeez, I knew I shouldn’t have talked about my ex so much. I keep doing this. What’s wrong with me? Dammit. Okay, I’ll give it another few minutes, and then I guess I’ll just call an Uber.” At press time, sources confirmed that Lopez’s date was in the bathroom desperately watching a clip of This is Me…Now in order to find something to talk about for the remainder of the evening. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* NameThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_