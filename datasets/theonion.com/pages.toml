title = "Cop Posing As Underage Girl Online Falls In Love With Pedophile - The Onion"
description = "HOUSTON—After two weeks of posing as an underage girl online and exchanging messages with a suspected child predator, Detective Sgt. Gordon Aguero of the Harris County Sheriff’s Office told reporters Thursday he had fallen in love with the pedophile he was investigating as part of a sting operation. Although he was assigned to the case […]"
full_description = '''Local Cop Posing As Underage Girl Online Falls In Love With Pedophile Child Groomer Wins Heart Of Undercover Investigator Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: March 5, 2025 HOUSTON—After two weeks of posing as an underage girl online and exchanging messages with a suspected child predator, Detective Sgt. Gordon Aguero of the Harris County Sheriff’s Office told reporters Thursday he had fallen in love with the pedophile he was investigating as part of a sting operation. Although he was assigned to the case in order to gather evidence against an alleged child abuser, Aguero, 54, admitted he was quickly beguiled by the charming man he contacted through the gaming platform Roblox while purporting to be a teenager named Zoey. The pedophile, identified only by the username Ken1965, reportedly wrote to the detective’s fake account several times a day and often remarked that his intended victim was special and looked pretty. “I know he thinks I’m a 13-year-old girl from the suburbs who loves BTS and wants to be a dog trainer when she grows up, but I can’t deny it anymore—I’m deeply, hopelessly in love,” Aguero said of the predator, confiding that he “practically ran” to his computer at the sheriff’s office every day just to view his new messages. “Is he a serial child molester? Yes. But Ken understands me, okay? I can talk to him about problems I’m having with my friends or how much I hate doing math. And he gets it when I complain about my parents, too.” “God knows he pays more attention to me than they do,” he added, referring to Ruben and Isabella Aguero of Baytown, TX, age 84 and 81, respectively. Though he can only communicate with the suspect through the guise of Zoey, the divorced middle-age detective explained that Ken1965 nonetheless provides him with a shoulder to cry on, listening to the insecurities he has about his body and about whether anyone could ever find him lovable. Aguero said his confidence is bolstered every time he’s on Roblox chatting with the sex offender, who is always offering to take him on trips and introduce him to his friends. According to his sheriff’s department colleagues, Aguero’s has grown secretive and withdrawn since he became involved with the sting operation. His supervisor, Lt. Crystal Olmstead, noted that the detective always seemed to minimize his internet browser window when she walked by his desk. “While I’m glad he’s committed to his work, I’m a little concerned about the amount of time Gordon is spending on this case,” said Olmstead, who furrowed her brow as she described how the detective was using the Roblox account “basically 24/7.” “When he’s not on his computer, he’s glued to his phone, texting madly away. Every time I ask him about it, he gets really defensive, and I’m worried that if I pry too much, I’ll only push him away.” The besotted detective showed reporters the trove of evidence he had collected in the undercover role, blushing as he opened a manila folder of printouts that contained a message reading “u and me can be best friends,” another that read “don’t tell ur parents about me, beautiful,” a $25 Roblox gift card that enabled the sworn law enforcement officer to purchase a “kick ass” digital shark costume his avatar could wear, and a very persistent series of requests for nude photos. With the operation expected to end soon, Aguero expressed concern about meeting Ken1965 in person, acknowledging that the pedophile would be unhappy when he discovered Zoey was only an alias. “I’m just so scared that when we arrest him, he’s going to be mad,” the detective told reporters. “He said he wanted to hold my hand and kiss me, but what if those were lies? What if he doesn’t like the way I look? What if he decides he doesn’t love me anymore?” “At the end of the day, all I can do is have faith that if it’s meant to be, it will be,” Aguero added. “Besides, if he really loves me, he won’t care that I’m a cop.” At press time, Aguero was staring into the bathroom mirror of the house where the sting was to take place, still primping and smoothing his hair as a half dozen sheriff’s deputies threw the pedophile to the ground and handcuffed him. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* NameThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_5').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_5').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_5').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_5').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFields();}var current_page = jQuery('#gform_source_page_number_5').val();gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery(document).trigger('gform_page_loaded', [5, current_page]);window['gf_su