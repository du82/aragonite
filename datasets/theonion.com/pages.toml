full_description = '''News Scientists Confirm Shingleback Lizards Only Reptiles That Mate For Sake Of Aging Mothers Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: February 25, 2025 ITHACA, NY—Noting that the evolutionary quirk results in plenty of familial strife, herpetologists at Cornell University confirmed Tuesday that shingleback lizards are the only reptiles that mate for the sake of their aging mothers. “Unlike other lizards, the shingleback seeks out a partner to reproduce with as a means to stop the constant haranguing from its mother,” lead researcher Alonso Gentry told reporters, adding that the short-tailed reptiles most often find a suitable mate via dates set up by their mothers. “A shingleback lizard may be single for years, despite its mother’s objections, but eventually it gets sick of hearing about how she’ll die of a broken heart if she doesn’t get grandbabies soon. The lizard is then likely to enter into a relationship that may not be healthy just to stop the complaining. A few months later, it gives birth to its offspring and is saddled with a deep bitterness that its life is over.” Gentry went on to add that shinglebacks have the highest suicide rate of any lizard species. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* EmailThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_confirmation = jQuery(th