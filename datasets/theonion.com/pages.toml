full_description = '''Entertainment Best Picture Winner ‘Kissing The Martinet’ Faces Backlash After Fans Learn Movie Not Real Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: March 3, 2025 LOS ANGELES—In a development that cast a shadow over the 97th Academy Awards, the filmmakers behind Best Picture winner Kissing The Martinet reportedly faced backlash Monday after fans learned the movie did not exist. “I can’t believe Kissing The Martinet, my favorite movie of 2024, is not a real movie,” said film critic Alexander Van Wyk, who described the feeling of betrayal he was left with after learning he did not watch the movie because it had never been made. “There should be some sort of safeguard implemented next year to ensure the films we’re pretending to have seen really exist. Next you’re gonna tell me that my favorite film of all time, The Swan’s Mistress, isn’t real either. God, I wish I could take back the zero minutes of my life I wasted sitting through that one.” At press time, Van Wyk admitted that he still thought the scene he imagined in which a lady named something like Melonia DuMont kissed the martinet was very well done. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* PhoneThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_5').length > 0;var