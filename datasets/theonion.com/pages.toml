full_description = "DMCA Notice Procedure Date of last revision: Monday, February 3, 2025 Dear Copyright Holder or Agent,The Digital Millennium Copyright Act of 1998 (DMCA) is a United States copyright law that provides OSP’s who have content on their sites to be relieved from liability for copyright infringement if they promptly remove the offending content once notified of an alleged infringement using the procedures set forth, below. Global Tetrahedron LLC, owner of the Onion, is an online service provider (OSP) registered with the Copyright Office (DMCA-1062150). Images appearing on our website and print publication have been duly licensed from authorized agents of the copyright holders.However, if you believe that a content hosted by us may be violating your rights under US Copyright Law by mail or email, you may file a complaint. By Mail Copyright Agent (DMCA)Global Tetrahedron LLC 2045 W Grand Ave Ste B PMB 479693 Chicago, IL 60612 By Email legal@theonion.com If the Copyright Owner believes that their work has been copied without permission, your DMCA takedown notice must contain the following information: Copyright Owner or the Designated Agent must:Provide an electronic or physical signature. Provide a description of the copyrighted work that is claimed as infringed. Identify where the infringing copyrighted work is located on the Onion website or print media. Provide contact information including: name, address, phone number and email address. Provide a statement that they have good faith belief that the infringing use is not authorized by the Copyright Owner, his designated Agent or by law. Provide a statement under penalty of perjury that the information in the notice is accurate and that they are the Copyright Owner. If the statement is provided by a rights management company or an attorney or other third party acting on behalf of the copyright holder (Designated Agent), a copy of a power of attorney must be submitted as an attachment to your statement. If the Onion receives a Notification that substantially complies with the notice requirements, above, then the Onion will expeditiously remove or disable access to the material that is claimed to be infringing or to be the subject of infringing activity. Copyright Owner or its Designated Agent who make misrepresentations with regards to the copyright infringement may be liable for damages and court costs incurred as a result of removing or blocking the alleged copyrighted work. This information should not be construed as legal advice, for further details on the information required for valid DMCA notifications, see 17 U.S.C. 512(c)(3). NOTE: This information is provided exclusively for notifying the Onion that your copyrighted material(s) might have been infringed. Any other inquiries, including technical support requests, billing questions, etc., will not receive a response through this process."
