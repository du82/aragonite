full_description = "Print Membership Terms Date of last revision: October 29, 2024 These terms and conditions apply to print edition membership subscription services (Membership) offered by Global Tetrahedron, LLC, owner of “the Onion” These terms will be subject to any rights you may have under consumer laws which cannot be waived by contract. 1. Publication details The Onion is published 12 times a year. From time to time we may publish bonus issues, at no additional cost to you. 2. Membership Membership entitles you to receive one copy of the Onion each month delivered to your stated address for the duration of your Membership (i.e., single issue, month-to-month or annual). Membership is personal to you and is non-transferable, except where you buy a Membership in someone else’s name as a gift, which you can do by selecting a different delivery name and address. In that case, Membership is personal to that person and non-transferable by them, but you remain bound by these terms and conditions as the contracting party. All gift Membership subscription purchases are final. We may occasionally offer promotional rates for Onion Membership (including paper-by-mail perks for contributions) which will be published together with the relevant offer, and subject to availability. We reserve the right to offer and withdraw promotional offers at any time.. Gift Memberships may not be available as part of a particular promotional offer. You will not be able to benefit from multiple promotional offers at the same time. 3. Orders for membership Membership orders are placed via our website. Your order is an offer to buy from us which, if accepted by us, will constitute a binding contract once we have accepted your payment. We reserve the right to reject any order for any Membership without cause. 4. Commencement date Once you place your order online and it is accepted by us, you will receive your first issue within 6-8 weeks from the date of acceptance. 5. Delivery In the event that you experience persistent delivery delays or do not receive an issue, contact us (as per the details below). In the event that we are forced to temporarily suspend delivery for any reason, you will be entitled to a refund of the Membership value of the undelivered copies. 6. Use of third parties, privacy and use of data We use third parties to fulfill certain parts of the Membership service (such as printing and mailing services). This means that the information provided by you is passed to such third parties. This information will only be used for the purposes of providing the Membership service to you and will be used in accordance with our privacy policy. You can read our Privacy Policy here. 7. Subscription period Minimum Membership terms may apply to promotions and will be specified in the relevant advertisement or promotion for Membership. Membership will continue unless and until it is ended by either of us in accordance with the provisions of section 12 below. If you are paying for your Membership fee for a specified term, in advance, Membership will continue for the term for which you have paid (as renewed in accordance with the provisions of section 11, below), unless it is ended by either of us in accordance with the provisions of section 12 below. 8. Payment Payment for your Membership can be made via credit or debit card or other payment terms which may become available from time to time. By submitting credit or debit card or other payment details, you hereby confirm that you have the express prior permission of the credit/debit card or payment account holder. Your payment of the Membership fee(s) will be processed by Global Tetrahedron, LLC. Your bank may charge you transaction fees, currency conversion fees and/or international transaction fees for this transaction. “THE ONION CHICAGO IL” will appear on your statement. 9. Holidays We do not offer Membership “holidays” or pauses of your Onion subscription(s). 10. Price Guarantee If you are paying for your Membership on a rolling monthly or annual basis, we guarantee that your payment will not increase within the first year (12 issues) of your Membership (excluding any promotional rates and periods, details of which are clearly defined on the promotion page), after which period we reserve the right to withdraw or change our rates (which will be published on our website and will be emailed to you at least 30 days before your next payment due date. If we discover any under or overpayments for your order, we will inform you as soon as possible and correct the price of your order by debiting your payment method or providing you with a credit or refund for any amount overpaid, at your request. 11. Renewal of Membership If you pay for your Membership on a single payment basis in advance (see payment section above), we will remind you by email when your Membership is due to expire and invite you to renew your Membership. If you notify us that you wish to cancel, you agree to abide by the terms specified as part of the renewal (including the price, which may have changed since your last payment). If you pay for your Membership on a monthly or annual rolling basis (see payment section above), there is no need to renew your Membership as it will automatically continue until terminated in accordance with the refund and cancellation provisions detailed below. We will continue to take payment by the original payment method you provided at the time of your initial payment at the payment frequency you selected at checkout. If you make a one-time payment or contribution, your Membership will not automatically renew. 12. Refund and cancellation policy Payments are non-refundable, and there are no refunds or credits for the unused portion of an annual subscription that has been canceled before the end of a billing cycle. You can cancel (or or adjust) your recurring payments at the membership management portal here or via email to membership@theonion.com. If you have subscribed as part of a promotion, following the expiration of the promotion period (as clearly defined on the promotion page) your Membership will automatically continue in line with the regular Membership price (or as specified in a special promotional offer), unless you cancel.If you have canceled the payment method you have on file with us, you can email us at membership@theonion.com to update your payment information. 13. Our pledge to you We are under a legal duty to supply goods that are in conformity with the terms set forth in this document (or terms of promotional offers, as applicable), however we shall not be responsible for any failure by us to perform our obligations to you in relation to your Membership where this failure is caused by circumstances beyond our control. For example, if you have supplied us with an incorrect or incomplete address or contract information or if you cancel your payment method under a monthly billing plan . We reserve the right to dispose of incorrectly addressed envelopes and their contents without an obligation to refund you or any other person if they are returned to us and despite efforts to contact you if we do not have correct address or contact details. Our liability to you in connection with your Membership will not exceed the total Membership fees charged for your current Membership period or, in the event of a rolling Membership, the total fees paid by you under your Membership plan (which will not exceed a twelve (12) month period). We exclude all other liability to you to the extent permitted by law. 14. Customer service If you have a question, complaint or glowing praise about our Membership services, please contact us via email at Membership@theonion.com. We will use best efforts to respond to you within 72 business hours. Our Membership services are provided by Global Tetrahedron, LLC a Delaware, U.S. registered company and our third party contractors. 15. General We intend to rely on the written terms set out in these terms and conditions for the Membership services that we provide to you. In the event you receive information from our customer service team via email, such writing shall not be construed to alter these terms and conditions. These terms constitute the entire agreement between us. We may update these terms and conditions from time to time for legal or regulatory reasons or to allow the proper operation of your Membership services. Any changes will be notified to you at least 30 days in advance so that you can choose whether or not to cancel your direct debit or credit or debit card payments (where you are not bound by a minimum Membership period), and whether to proceed with your next renewal. The changes will apply to your Membership from your next payment date after we notify you of such changes. Your continued Membership will indicate your agreement to be bound by the new terms and conditions. If any provision or part-provision of these terms and conditions is or becomes invalid, illegal or unenforceable, it shall be deemed modified to the minimum extent necessary to make it valid, legal and enforceable.Any such modification or deletion shall not affect the validity and enforceability of the rest of these terms and conditions. These terms and conditions are governed by the laws of the state of Illinois and the parties agree to submit to the exclusive jurisdiction of the courts located in Cook County, Illinois. 16. Copyrights All Onion content is copyrighted, whether marked © or not. Using material without prior consent exposes you to legal action and financial penalties no matter how innocuous the use may seem. If you are interested in licensing content from us, email us via permissions@theonion.com. Please indicate the content you wish to reproduce, your proposed usage (i.e., textbook), the requested territories for distribution and the requested term length. Please note that we do not license images. Dated: October 2024. Subject to change in our sole discretion."
