full_description = "Cookie Policy Effective Date: August 16, 2024 This Cookie Policy explains how The Onion (“Company”, “we”, “us”, or “our”) uses cookies and similar technologies in connection with our website and any related online services (collectively, the “Services”). It explains what these technologies are and why we use them, as well as your rights to control our use of them. This Cookie Policy should be read in conjunction with our Privacy Policy. If you have any questions or concerns about the Cookie Policy, please contact us at legal@theonion.com or as otherwise described in our Privacy Policy. What are cookies and similar technologies? Cookies are text files that websites store on a visitor’s device to uniquely identify the visitor’s browser or to store information or settings in the browser for the purpose of helping you navigate between pages efficiently, remembering your preferences, enabling functionality, helping us understand activity and patterns, and facilitating online advertising. Local storage technologies, like HTML5, provide cookie-equivalent functionality but can store larger amounts of data, including on your device outside of your browser in connection with specific applications. Web beacons, also known as pixel tags or clear GIFs, are used to demonstrate that a webpage or email was accessed or opened, or that certain content was viewed or clicked. This Cookie Policy refers to all these technologies collectively as “cookies.” How do we use cookies? We use both persistent cookies and session cookies. Persistent cookies stay on your device for a set period of time or until you delete them, while session cookies are deleted once you close your web browser. We use persistent cookies, for example, to record your choice of language and country location. The cookies placed through your use of our website are either set by us (first-party cookies) or by a third party at our request (third-party cookies). This is described in more detail below. For more information on cookie retention/expiry, please visit [●]. What types of cookies do we use? We use the following categories of cookies: Essential. We use essential cookies to help make our website usable by enabling basic functions like page navigation and access to secure areas of the website. You can set your browser to block or alert you about these cookies, but then some parts of the websites will not work. Functionality / performance. We use these cookies to enhance the functionality and performance of the Services. Analytics. We use these cookies to help us understand how our Services are performing and being used. Advertising. We and our third-party advertising partners use these cookies to collect information about how you use our website and use that information to serve online ads that may be relevant to your interests. Email Interaction Technology: Our emails may contain web beacons to tell us whether they are opened and verify any clicks through to links within an email. We (and our marketing service provider on our behalf) use this information to help us understand how an email campaign performed, what types of emails and content our recipients find interesting, and what actions our recipients took, so we can improve our email campaigns in the future and make our emails more relevant to our recipients. If you do not wish the web beacon to be downloaded onto your device, you should select to receive emails from us in plain text rather than HTML. How can you control the use of cookies? Depending on where you access the Services from, you may be presented with a cookie banner or other tool to provide permissions prior to non-Essential cookies being set. In this case, we only set these non-Essential cookies with your consent. Where this option is available, you may revoke your consent at any time with future effect by clicking on the cookie settings link in the bottom left-hand corner of the website at any time. You can also limit online tracking by: Blocking cookies in your browser. Most browsers let you remove or reject cookies, including cookies used for interest-based advertising. To do this, follow the instructions in your browser settings. Many browsers accept cookies by default until you change your settings. For more information about cookies, including how to see what cookies have been set on your device and how to manage and delete them, visit www.allaboutcookies.org. Use the following links to learn more about how to control cookies and online tracking through your browser: Firefox; Chrome; Microsoft Edge; Safari (Mac); Safari (Mobile/iOS) Blocking advertising ID use in your mobile settings. Your mobile device settings can provide functionality to limit use of the advertising ID associated with your mobile device for interest-based advertising purposes. Using privacy plug-ins or browsers. You can block our websites from setting cookies used for interest-based ads by using a browser with privacy features, like Brave, or installing browser plugins like Privacy Badger, Ghostery, or uBlock Origin, and configuring them to block third party cookies/trackers. Google Analytics. We use Google Analytics to help us better understand how people engage with our Services by collecting information and creating reports about how users use our Services. For more information on Google Analytics, click here. For more information about Google’s privacy practices, click here. You can opt out of Google Analytics by downloading and installing the browser plug-in available at: https://tools.google.com/dlpage/gaoptout. Advertising industry opt out tools. You can also use these opt out options to limit use of your information for interest-based advertising by participating companies: Digital Advertising Alliance for Websites: outout.aboutads.info Network Advertising Initiative: optout.networkadvertising.org Platform opt-outs. Some advertising partners offer opt-out features that let you opt out of use of your information for interest-based advertising, including: Google Facebook Note that because these opt out mechanisms are specific to the device or browser on which they are exercised, you will need to opt out on every browser and device that you use. Do Not Track. Some Internet browsers can be configured to send “Do Not Track” signals to the online services that you visit. We currently do not respond to “Do Not Track” or similar signals. To find out more about “Do Not Track,” please visit http://www.allaboutdnt.com. How often will we update this Cookie Policy? We may update this Cookie Policy from time to time in order to reflect, for example, changes to the cookies we use or for other operational, legal or regulatory reasons. We will notify you of any material changes to this Cookie Policy prior to the changes becoming effective by posting the changes on this page and providing a more prominent notice with on-site or email notifications as required by applicable law. Please therefore re-visit this Cookie Policy regularly to stay informed about our use of cookies and related technologies. The date at the top of this Cookie Policy indicates when it was last updated."
