description = "LOS ANGELES—Growing frustrated by the lack of variety in the couple’s romantic outings, Kylie Jenner told reporters Monday that she would like to go on one date with Timothée Chalamet that wasn’t an awards ceremony. “The awards circuit is nice, I guess, but why don’t we ever go, like, ice skating or to a museum?” […]"
full_description = '''Entertainment Kylie Jenner Admits She’d Like To Go On One Date That Isn’t Awards Ceremony Share Share on Facebook Bluesky Share on X Share on LinkedIn Share on SMS Email this Page Published: March 3, 2025 LOS ANGELES—Growing frustrated by the lack of variety in the couple’s romantic outings, Kylie Jenner told reporters Monday that she would like to go on one date with Timothée Chalamet that wasn’t an awards ceremony. “The awards circuit is nice, I guess, but why don’t we ever go, like, ice skating or to a museum?” said Jenner, who lamented that the events barely counted as dates anyways because the couple was surrounded by Chalamet’s colleagues, and they were almost always on Sunday evenings, when she was exhausted and wasn’t even in the mood to go out. “There’s a new sushi place I’d like to try. I’d love to try a couples paint and sip class. I drop hints about having a picnic all the time, but does he pick up on it? No. We always end up at the Golden Globes. For once, can’t we take a normal walk that’s not on a red carpet? I want to wear jeans!” At press time, Jenner added that Travis Scott always took her on real dates. Like A Vitamin You Ingest With Your Eyes. Get The Onion Newsletter. "*" indicates required fields Subscribe For All the Latest Headlines* NameThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 5, 'https://theonion.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_5').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_5');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_5').length > 0;var is_redirect = contents.indexOf('gformRe