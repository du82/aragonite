["https://theparisreview.org/about/submissions"]
title = "Paris Review - Writers, Quotes, Biography, Interviews, Artists"
description = "The Paris Review is a literary magazine featuring original writing, art, and in-depth interviews with famous writers."
full_description = "The Paris Review accepts unsolicited submissions of prose in February, June, and October and unsolicited submissions of poetry in January, April, July, and October. Submissions are accepted via Submittable until we reach capacity, as well as by mail (see the instructions below). All submissions must be in English and must be previously unpublished. Translations are welcome and should be accompanied by a copy of the original. Simultaneous submissions are allowed, as long as we are notified immediately if the manuscript is accepted for publication elsewhere. Please submit no more than six poems or one piece of prose at a time and please do not submit more than once per submission period. During the month of October, you may submit in the categories of both poetry and prose, but we ask that you submit only once per genre. We suggest to all who plan to submit that they read the most recent issues of The Paris Review to acquaint themselves with material the magazine has published. Subscriptions are available here. Hard-copy prose submissions may be submitted during the months of February, June, and October and hard-copy poetry submissions may be submitted during the months of January, April, July, and October. Submissions postmarked after the last day of the month in question will not be processed. Please send any hard-copy submissions to the following address, including a brief cover letter and a self-addressed and stamped envelope (SASE): Prose Editor or Poetry EditorThe Paris Review544 West 27th Street, Floor 3New York, NY 10001 To submit via Submittable, click the button below:"
