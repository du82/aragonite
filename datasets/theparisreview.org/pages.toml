["https://theparisreview.org/about/prizes"]
title = "Paris Review - Writers, Quotes, Biography, Interviews, Artists"
description = "The Paris Review is a literary magazine featuring original writing, art, and in-depth interviews with famous writers."
full_description = "The Paris Review Hadada Award The Hadada Award is presented each year to “a distinguished member of the writing community who has made a strong and unique contribution to literature.” Previous recipients of the Hadada include John Ashbery, Joan Didion (shown above), Paula Fox, Norman Mailer, Peter Matthiessen, George Plimpton (posthumously), Barney Rosset, Philip Roth, Norman Rush, James Salter, Frederick Seidel, Robert Silvers, and William Styron. The Plimpton Prize for Fiction The Plimpton Prize for Fiction is an award of $10,000 given to a new voice published in The Paris Review. The prize is named for the Review’s longtime editor George Plimpton and reflects his commitment to discovering new writers of exceptional merit. Past recipients include April Ayers Lawson, Amie Barrodale, Jesse Ball, Emma Cline, Caitlin Horrocks, Atticus Lish, Alistair Morgan, Ottessa Moshfegh (shown above), and Benjamin Percy. The Susannah Hunnewell Prize The Susannah Hunnewell Prize is an award of $15,000, which honors an outstanding piece of prose or poetry published by the Review in the previous calendar year. The prize was established in 2023 in memory of Hunnewell, who joined the Review as an intern during George Plimpton’s tenure. She remained associated with the magazine for thirty years, serving as its Paris editor and later as its publisher from 2015 until her death in 2019."
