title = "The Paris Review  The Paris Review - Arts and Culture News"
description = "Arts and Culture News"
full_description = "February 25, 2025 First Person The Living Death Drug By Lisa Carver Photographs courtesy of Lisa Carver. My cousin Lorrie invited me on a ten-day retreat in Peru where we would partake in ancient ceremonies involving the Living Death Drug ayahuasca and— “Don’t tell me anything more,” I interrupted. “The answer is yes!” I never watch the trailer before going to the movie. I don’t want to ruin the surprise. Even if sometimes that means the surprise ruins me. I met a big-personalitied Frenchman while traveling and did not take time to get to know him before marrying him and moving into his house in Paris. I guess I don’t feel any proprietary rights over my destiny. I allow the Parisian shopgirls to choose my outfits, and now I will let the Peruvian shamans choose my insides. Whatever they’ve got has to be better than what I got going on now. Lorrie and I tried to figure out when was the last time we’d seen each other. Thirty-six years ago, when she visited me in Philadelphia! “I was nineteen in my second year of missionary school,” she remembered. “And I was eighteen in my first year of peripatetic hedonism.” “I know,” she groaned. “I was terrified coming from my little Christian school to your filthy, vile apartment with your weirdo roommates. It was furnished with things you had literally dragged out of people’s trash.” She recalled the ‘art’ nailed on the wall above the couch where she slept: a shit- and blood-stained plastic music box in the shape of a church. The music-making part was broken and squawked at random all night long, she said. “And it was so cold my Walkman froze.” “Hahaha, your Walkman froze!” I couldn’t stop laughing. I don’t know why I thought that was the funniest thing I’d ever heard. “Well, I loved you anyway,” she sighed. “And I you,” I said. “Did I tell you I’m Catholic now?” “Yes. And I’m a witch now.” We’d traded weirdness levels, and we still loved each other the same as we always had. We were the only ones who believed each other about the stuff that had happened in our family. Well, we were the only ones who said it out loud, the only ones who didn’t care about the money, and fucked them all off. Read More"
