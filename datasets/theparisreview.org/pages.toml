title = "Paris Review - Dinosaurs by Josh Smith"
description = "In a series of digital artworks, Smith collages intensely saturated lithographs and monotypes with photographs of small-scale resin sculptures—palm trees, felines, and extinct reptiles made of seashells, pine cones, toothpicks, wire, and wood."
full_description = "Dinosaurs Josh Smith Issue 250, Winter 2024 Josh Smith was born in 1976 in Okinawa, Japan, where his father served in the U.S. military, and grew up in Knoxville, Tennessee. His first major gallery shows, in the early aughts, featured abstract paintings that largely incorporated what he has called his “exaggerated American name.” His works often build upon his previous projects, sometimes literally: new paintings rendered directly on top of the old. In Dinosaurs, a series of digital artworks made for the Review, he collages intensely saturated lithographs and monotypes with photographs of small-scale resin sculptures—palm trees, felines, and extinct reptiles made of seashells, pine cones, toothpicks, wire, and wood. —AG All photographs by Farzad Owrang, courtesy of Josh Smith. Want to keep reading?Subscribe and save 33%. Subscribe Now Already a subscriber? Sign in below. Remember me Link your subscription Forgot password? Last / Next Article Last / Next Article Share More from Issue 250, Winter 2024 Subscribe to Read Fiction Dan Bevacqua Daughters Caoilinn Hughes Two Hands Silas Jones Regular Decision Alec Niedenthal Schändung (Desecration) Adania Shibli Camouflage Interview Fredric Jameson The Art of Criticism No. 5 Gerald Murnane The Art of Fiction No. 266 Hanif Kureishi The Art of Fiction No. 265 Poetry Sargon Boulus There Are Journeys Rachel Mannheimer New Haven Rachel Mannheimer The Car Egill Skallagrímsson from “Cruel Loss of Sons” Simone White hand-to-hand pass Hua Xi Toilet Portfolio Ann Craven Moon Josh Smith Dinosaurs Cover Seth Becker Issue No. 250 Cover Art Ala Ebtekar Nightfall (After Asimov and Emerson) (4) Essay Abdulah Sidran Scraps You Might Also Like The Living Death Drug By Lisa Carver February 25, 2025 How Do You Write an Opera Based on Moby-Dick? By Sophie Haigney February 21, 2025 I Once Bought a Huge Wrap in a Walgreens in Manhattan By Ed Atkins February 20, 2025 I Killed Wolf’s By Todd McEwen February 19, 2025 Columns Home