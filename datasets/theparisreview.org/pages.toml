full_description = "Two Hands By Caoilinn Hughes “As the tires lose traction, she can think only of a sonnet’s closing couplet: the sonnet she’d been struggling to translate on the day they crashed.” In the Current Issue, Issue 250 Fiction Donate to The Paris Review By The Paris Review The Paris Review promotes the most exciting writers of the day and supports inquisitive readers the world over. Donate I Once Bought a Huge Wrap in a Walgreens in Manhattan By Ed Atkins February 20, 2025 “The bag has a lot of blue and black on it, as well as dramatic photos of the Doritos. Blue and black are inedible executive colors. They mark the contents as exclusive and ambitious.” The Daily First Person Toilet By Hua Xi “A toenail clipping floating in a toilet bowl / like a crescent moon reflected in water” In the Current Issue, Issue 250 Poetry The Art of Criticism No. 5 By Fredric Jameson “Ideological critique has to end up being a critique of the self. You can’t recognize an ideology unless, in some sense, you see it in yourself.” In the Current Issue, Issue 250 Interviews I Killed Wolf’s By Todd McEwen February 19, 2025 “My whole life has been mayonnaise.” The Daily First Person Regular Decision By Silas Jones “By the time we finally reached the Castro, I genuinely believed Anne had gotten rich off being gay alone.” In the Current Issue, Issue 250 Fiction Moon By Ann Craven “Craven traveled between several fourteen-by-fourteen-inch canvases, each depicting the moon at a different moment in its ascent above the Empire State Building.” In the Current Issue, Issue 250 Art & Photography Dinosaurs By Josh Smith “Palm trees, felines, and extinct reptiles made of seashells, pine cones, toothpicks, wire, and wood.” In the Current Issue, Issue 250 Art & Photography"
