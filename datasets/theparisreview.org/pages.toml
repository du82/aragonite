full_description = "Job Openings The Paris Review Visiting Professorship at the Bard Prison Initiative | Editorial Internship The Paris Review Visiting Professorship at the Bard Prison Initiative The Paris Review Visiting Professorship at the Bard Prison Initiative (BPI) is a one- or two-year position, beginning in September 2025; a distinguished writer will join the Bard College community and teach the study of literature to students earning Bard College undergraduate degrees either while incarcerated or at one of BPI’s microcolleges in New York City. The Paris Review Visiting Professor of Literature will design and teach a total of three courses across the fall and spring semesters. Courses should focus on the study of literature rather than creative writing. They should not take the prison as their subject but should instead reflect the breadth of the liberal arts education at the main campus of Bard College. The visiting professor may also deliver a public lecture at one or more BPI locations, a version of which may be presented in The Paris Review, either in print or online. Qualifications The ideal candidate will be an emerging or established writer whose work has received critical recognition; will have prior college teaching experience; and will excel in designing and teaching discussion-heavy courses that demand active participation of all students. We would like to discourage candidates who are interested in writing about their experience of teaching within the carceral system. This position requires completion of a clearance process for the New York State Department of Corrections and Community Supervision. Candidates who are unsure whether they can obtain clearance, however, should not be discouraged from applying. Compensation and Benefits The professor will be an employee of Bard College with compensation starting at $80,000/year. This position is eligible for benefits. To learn more about employee benefits and eligibility at Bard College, please visit https://www.bard.edu/humanresources/benefits/. About BPI Formed in 1999 to address the mass incarceration crisis, the Bard Prison Initiative (BPI) has reimagined and redefined questions of availability, affordability, and expectations typically associated with college in America. One of the most rigorous and effective college-in-prison programs in the country, BPI is now extending its radical intervention in educational inequity outside of prisons through the Bard Microcollege and BardBac. BPI currently enrolls nearly six hundred students across eleven campuses. Application Instructions To nominate yourself or another distinguished writer with an interest in the role for this position, please submit a letter no longer than a page in support of the application and the candidate’s CV to [email protected]. We will begin reviewing applications in late February. The deadline for applications is March 15, 2025. Candidates may be asked for additional materials including a sample course description and references. The Paris Review Visiting Professor of Literature will be announced in May. Equal Employee Opportunity Statement Bard College is an equal opportunity employer and we welcome applications from those who contribute to our diversity. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, mental or physical disability, age, sexual orientation, gender identity, national origin, familial status, veteran status, or genetic information. Bard is committed to providing access, equal opportunity, and reasonable accommodation for all individuals in employment practices, services, programs, and activities. Editorial Internship The Paris Review offers editorial internships twice a year (two interns per term). The six-month duration of the internship provides interns an in-depth introduction both to the publication of a literary magazine and to the wider publishing world. Each internship term covers two full issues of the quarterly magazine. Interns assist with every step of the magazine’s production, particularly with fact-checking, as well as reading and evaluating submissions and researching potential interviews. In addition, they participate broadly across The Paris Review’s administrative, development, and digital departments. The Paris Review welcomes applicants with an interest in the magazine’s dual mission: to pursue the best and most exciting voices of the day and to support ambitious, inquisitive readers all over the world. In particular, we seek applicants eager to participate as the magazine moves forward with new voices and new technologies, while also celebrating the lessons of some of literature’s greatest masters.Previous Paris Review interns have gone on to find work at a wide range of publishing houses, magazines, and newspapers, among them Picador, HarperCollins, Farrar, Straus and Giroux, Simon and Schuster, New York Magazine, Poets & Writers, and the New York Times. Others have gone on to enjoy successful freelance careers as editors and writers, or to pursue graduate work.The internship is full-time (40 hours/week) for six months and is compensated at $20/hour, with the option to enroll in health insurance. Applicants should be able to work from our New York City office, depending on health and safety restrictions in New York. (If you are not currently located in New York, please make your willingness to relocate clear in your personal statement.) All applicants must be eligible to work in the United States. The application schedule is as follows: Spring–Summer Fall–Winter Term: February 10 – August 8 August 12 – February 7 Applications Accepted: October 15 – November 25 May 1 – June 1 Decision by: January 8 July 5 To Apply Download the application document here. Please send your completed application and a résumé to [email protected]. Unfortunately, because of the volume of applications we receive, we aren’t able to respond to every applicant, but if you are invited for an interview, you will generally be contacted within three weeks of submitting your application."
