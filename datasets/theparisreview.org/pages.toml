["https://theparisreview.org/art-photography/8371/moon-ann-craven"]
title = "Paris Review - Moon by Ann Craven"
description = "Craven traveled between several fourteen-by-fourteen-inch canvases, each depicting the moon at a different moment in its ascent above the Empire State Building."
full_description = '''Moon Ann Craven Issue 250, Winter 2024 Ann Craven first painted the moon in 1995, on Lincolnville Beach in Maine. Since then, she has completed hundreds of paintings of the moon, which she carefully labels and indexes with the details of her viewpoints. The works in this portfolio were made on the roof of the Chelsea building that houses the offices of The Paris Review, on the evenings of September 17—the night of a harvest moon, a supermoon, and a partial lunar eclipse—and September 19, 2024—a waning gibbous. As always, Craven was most interested in capturing the moon’s rise, a period when the sky changes constantly, which requires working quickly. She traveled between several fourteen-by-fourteen-inch canvases, each depicting the moon at a different moment in its ascent above the Empire State Building. —AG Moon (Paris Review Roof, NYC, 9-17-24, 7:45 PM), 2024, 2024, oil on linen, 14 x 14". All paintings courtesy of Ann Craven and Karma. Moon (Paris Review Roof, NYC, 9-17-24, 7:55 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 8 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 8:08 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, Na’s Swirly Cloud, 9-17-24, 8:10 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 8:20 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 8:30 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 8:45 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 8:55 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-17-24, 9:10 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-19-24, 8:40 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-19-24, 10:10 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-19-24, 10:30 PM), 2024, 2024, oil on linen, 14 x 14". Moon (Paris Review Roof, NYC, 9-19-24, 11:11 PM), 2024, 2024, oil on linen, 14 x 14". Last / Next Article Last / Next Article Share More from Issue 250, Winter 2024 Subscribe to Read Fiction Dan Bevacqua Daughters Caoilinn Hughes Two Hands Silas Jones Regular Decision Alec Niedenthal Schändung (Desecration) Adania Shibli Camouflage Interview Fredric Jameson The Art of Criticism No. 5 Gerald Murnane The Art of Fiction No. 266 Hanif Kureishi The Art of Fiction No. 265 Poetry Sargon Boulus There Are Journeys Rachel Mannheimer New Haven Rachel Mannheimer The Car Egill Skallagrímsson from “Cruel Loss of Sons” Simone White hand-to-hand pass Hua Xi Toilet Portfolio Ann Craven Moon Josh Smith Dinosaurs Cover Seth Becker Issue No. 250 Cover Art Ala Ebtekar Nightfall (After Asimov and Emerson) (4) Essay Abdulah Sidran Scraps You Might Also Like The Living Death Drug By Lisa Carver February 25, 2025 How Do You Write an Opera Based on Moby-Dick? By Sophie Haigney February 21, 2025 I Once Bought a Huge Wrap in a Walgreens in Manhattan By Ed Atkins February 20, 2025 I Killed Wolf’s By Todd McEwen February 19, 2025 Columns Home Improvements By Ottessa Moshfegh and others Overheard By Tarpley Hitt and others Diaries By The Paris Review Contributors The Review’s Review By The Staff of The Paris Review Advertisement googletag.cmd.push(function() { googletag.display('div-gpt-ad-1477946895683-0'); });'''
