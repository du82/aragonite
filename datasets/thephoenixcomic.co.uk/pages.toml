["https://thephoenixcomic.co.uk/phoenix-fest"]
title = "Phoenix Fest 2024 - The Phoenix comic"
description = """
Get immersed in the world of comics! Phoenix Fest brings together the creators behind your favourite comics and all the biggest fans. It's the ultimate experience of fun, laughter and inspiration. SIGN UP FOR EVENT UPDATES!
Subscribe to our newsletter for all future event announcements and other Phoenixy updates!"""
full_description = "Phoenix Fest 2024: Oxford and Phoenix Fest 2024: Digital refer to the type of ticket that you purchase. Phoenix Fest 2024 is a one-day event which you can attend in person at the New Theatre Oxford or online from anywhere in the world. Both ticket types give you the opportunity to enjoy a full day of fun for the whole family, but each one offers a slightly different experience. Whether you attend in person or online, your ticket will come with its own perks - it's about choosing the right option for you.Your Phoenix Fest 2024: Oxford ticket allows you to be in the same room as your favourite artists and gives you the opportunity to take part in meet and greets and get autographs from some brilliant Phoenix creators. However, there are a limited number of tickets available due to the size of the venue, and you must buy a ticket for each person attending to secure your seat.Your Phoenix Fest 2024: Digital ticket allows you to attend from the comfort of your own home, anywhere in the world. You only need to buy one ticket per streaming device, and you can watch with as many people as you wish. Everyone attending online will also get the chance to attend a bonus exclusive digital-only interactive workshop streamed live from backstage and get to access the full-day recording from the festival afterwards. The first performance will begin at 10am and the last performance will end at roughly 4:30pm. The festival will be longer for those with Phoenix Fest 2024: Oxford tickets as doors open at 9:15am and signings may run on after the last performance until around 6/6:30pm. If you can't wait for Phoenix Fest 2024 and want to start celebrating now, RSVP to our Facebook event and share your excitement on social media. You can tag us in your posts using @phoenixcomicuk and our official hashtag #PhoenixFest2024. There is just one release of Phoenix Fest tickets this year. All Phoenix Fest 2024 tickets go on sale at 10am on Monday 22nd April 2024. Tickets for Phoenix Fest 2024: Oxford will be sold by New Theatre, Oxford. You can also buy tickets (including accessible tickets) by phoning the Box Office on 0333 009 5399.Tickets for Phoenix Fest 2024: Digital will be sold by The Phoenix via Eventbrite"
year_published = 2025
year_updated = 2024
clearnet = "https://thephoenixcomic.co.uk/phoenix-fest"
