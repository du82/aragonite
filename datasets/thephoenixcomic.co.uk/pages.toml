["https://thephoenixcomic.co.uk/comic-club/video-drawing-tutorials/how-to-draw-faces"]
title = "How to draw faces - The Phoenix comic"
full_description = '''We use functional cookies to enhance your browsing experience and analytics cookies to analyse our traffic and serve personalised ads. By clicking "Save My Cookies", you consent to our use of cookies. Drawing faces can be tricky, but the key is to get all of the building blocks in place. Follow along as we learn how to draw faces together! Ready to learn how to draw faces? Start by drawing an oval(ish) shape for the head. Next, draw guide lines for the eyes and nose. Map out the facial features for the eyes, nose, eyes, eyebrows and mouth features using basic shapes. With the building blocks in place, you can now start on your final face. Don't worry, we'll be covering how to draw eyes, noses, mouths etc. in way more detail in separate tutorials. Whether you're drawing a man or a woman, young or old people, an evil android or a goblin, the building blocks are always the same. The size and placement of the building blocks may be slightly different, but the starting point and the basic process is always the same. Copyright 2025 The Phoenix comic Registered address: The Phoenix comic, 26 Beaumont Street, Oxford, Oxfordshire, OX1 2NP. Company Registration No. 7481057'''
