full_description = '''<img decoding="async" class="ngg-singlepic ngg-left alignleft" title="ADvent Calendar Day 11" src="https://thequackdoctor.com/wp-content/gallery/advent-calendar/11.jpg" alt="ADvent Calendar Day 11" width="140" height="140" data-eio="l">ADvent Calendar Day 11 Rochester, NY, might ring a bell for attentive followers of this calendar, as it made an appearance on Day 8 as the location of the New York Institute of Science. That it was home to another dodgy organisation is no coincidence. Thomas Adkin, the Institute’s President, was also a director of The Cartilage Company, which vowed to elongate short people so they could avoid the kind of embarrassing situation encountered by the fellow in this 1906 advert. The public face of the brand, however, was Kilion Leo Minges, and the product for sale was his invention – a torturous-looking device. The user had to wear a head-harness with a rope running through a pulley on the ceiling. By pulling on the rope, the person could attempt to stretch the body while stirrups on the floor prevented him or her being lifted off the ground. <img fetchpriority="high" decoding="async" data-attachment-id="6184" data-permalink="https://thequackdoctor.com/index.php/how-to-grow-tall/the-cartilage-company/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company.jpg" data-orig-size="759,2144" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="The Cartilage Company, from &#8216;Recreation&#8217;, Feb 1906" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company-106x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company-363x1024.jpg" class="aligncenter wp-image-6184" title="The Cartilage Company, from 'Recreation', Feb 1906" src="https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company.jpg" alt="The Cartilage Company, from 'Recreation', Feb 1906" width="486" height="1372" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company.jpg 759w, https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company-106x300.jpg 106w, https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company-363x1024.jpg 363w, https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company-696x1966.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2013/12/The-Cartilage-Company-149x420.jpg 149w" sizes="(max-width: 486px) 100vw, 486px" data-eio="l" />'''
