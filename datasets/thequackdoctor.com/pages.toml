title = "To raise false hopes | The Quack Doctor"
description = "The drunkenness remedy Antidipso, as featured on Great British Railway Journeys Series 7 Episode 11."
full_description = '<img fetchpriority="high" decoding="async" data-attachment-id="6876" data-permalink="https://thequackdoctor.com/index.php/to-raise-false-hopes/antidipso-with-watermark/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark.jpg" data-orig-size="642,2005" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Antidipso with watermark" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark-96x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark-328x1024.jpg" class="size-large wp-image-6876 alignleft" src="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark-328x1024.jpg" alt="Antidipso with watermark" width="328" height="1024" srcset="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark-328x1024.jpg 328w, https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark-96x300.jpg 96w, https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-with-watermark.jpg 642w" sizes="(max-width: 328px) 100vw, 328px" data-eio="l" />‘Tears and prayers are of no use,’ warned the eyecatching pictorial advertisement in the Penny Illustrated Paper. It was perhaps the most truthful statement Arthur Lewis Pointing, proprietor of the anti-drunkenness powder, Antidipso, had ever come up with. Or rather, that the advertiser of a famous American nostrum had ever come up with, for Pointing had lifted the copy verbatim from advertisements for Dr Haines’s Golden Specific. Pointing had joined the Alaskan Gold Rush after failing to convince Londoners of the value of his ‘Invisible Elevators‘ for increasing their height. His return to Britain in 1899 saw him bereft of gold but in possession of enough brass neck and borrowed advertising copy to make his fortune. A decade later, he was worth almost £40,000 through the sale of a perennially lucrative commodity – false hope. Antidipso claimed to cure the most unregenerate drunkard. Presented as a natural remedy derived from little-known South American herbs, it had ‘shed its radiance into thousands of hitherto desolate homes,’ and ‘guided many a young man to sobriety and into the high road of fortune’. The number of addicts prepared to send off for a cure was, however, limited, so Antidipso targeted a more receptive market – their loved ones. Enticing enquirers with a booklet called Bright Beams of Hope, Pointing promised that there need be no confrontation, no violence, no broken promises; a powder in the drinker’s coffee would do the job in secret. The unsuspecting patient would be restored to the wholesome embrace of his family and would once again achieve business success and social acceptance. The intended purchaser of Antidipso was not gullible; she was desperate. And it usually was a ‘she’. Although some of Pointing’s ads acknowledged the possibility of female alcohol addiction, the character of the drinker was almost always presented as male. His saving angel, meanwhile, was his wife. Exhorted to ‘take the matter into her own hands’, the woman with an addict in her life was presented with the prospect of regaining some control over her situation – a situation that it was otherwise difficult to escape. Testimonials told of women who ‘lived in fear and dread, shame and despair, poverty and disgrace,’ using Antidipso to restore the honourable and hard-working men they thought they had married. In luring the addict’s wife with promises of a cure, Antidipso not only propagated false hope but also assigned to women responsibility for male behaviour. Bright Beams gave a history of Antidipso that shared characteristics with the promotion of other proprietary remedies. Discrediting the medical profession by highlighting its failure to cure addiction, the pamphlet claimed that all the while, ‘an obscure tropical plant was yielding the very remedy that acts as an antidote.’ An analysis in the Lancet showed that the product was 78% milk sugar and 22% potassium bromide, neither of which was particularly herbal nor particularly South American. Although the bromide had the potential to cause nausea, perhaps putting the patient off alcohol, the Lancet concluded that the tiny quantities in the daily dose of Antidipso would not be noticeable. One packet of Antidipso, retailing at 10s, contained ingredients to the value of about 1½d. The large mark-up, however, was of little concern to the Lancet. Its criticism centred on the heartlessness of a scheme that played on the hopes of vulnerable and desperate people. The sale of an ineffective remedy to those trapped in a difficult situation was a ‘cruel and wicked fraud’ that left an aftertaste more bitter than that of any surreptitiously powder-laced coffee. <img decoding="async" data-attachment-id="6877" data-permalink="https://thequackdoctor.com/index.php/to-raise-false-hopes/antidipso-british-monthly-dec-1903/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903.jpg" data-orig-size="539,632" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Antidipso British Monthly Dec 1903" data-image-description="" data-image-caption="&lt;p&gt;Antidipso advertisement in The British Monthly, Dec 1903&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903-256x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903.jpg" class="size-full wp-image-6877" src="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903.jpg" alt="Antidipso British Monthly Dec 1903" width="539" height="632" srcset="https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903.jpg 539w, https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903-256x300.jpg 256w, https://thequackdoctor.com/wp-content/uploads/2016/01/Antidipso-British-Monthly-Dec-1903-358x420.jpg 358w" sizes="(max-width: 539px) 100vw, 539px" data-eio="l" />Antidipso advertisement in The British Monthly, Dec 1903'
