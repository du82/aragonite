["https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co"]
title = "'A Damnable Villain' – Byron H. Robb and the Electro-Magnetic Brush Co. | The Quack Doctor"
description = "Part 1 of 2. In this guest post for The Quack Doctor, author Robert K Waits introduces the colourful career of 19th-century fraudster Byron H. Robb."
full_description = '''<img decoding="async" data-attachment-id="6459" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/guest-post-label/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-orig-size="250,172" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Guest post" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" class="alignleft wp-image-6459" title="Guest post" src="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" alt="Guest post" width="200" height="138" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg 250w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-100x70.jpg 100w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-218x150.jpg 218w" sizes="(max-width: 200px) 100vw, 200px" data-eio="l" />The Quack Doctor is delighted to welcome guest blogger Robert K Waits, author of The Medical Electricians: George A. Scott and His Victorian Cohorts in Quackery. In this two-part article, Robert discusses the colourful career of 19th-century fraudster Byron H Robb. . In 1878 George Augustus Scott gained fame in London and New York for his ubiquitous advertising of Dr Scott’s cure-all ‘Electric Brushes’ sold with small compasses to ‘prove their power.’ The brushes were electric in name only – they simply had weakly magnetized iron bars in the handle – but if all the laudatory testimonials in Dr. Scott’s ads are to be believed, they were very effective placebos. <img fetchpriority="high" decoding="async" data-attachment-id="6446" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/1879-pat0221612-robb-galvanic_brush-cut/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT.jpg" data-orig-size="814,701" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="1879 Patent 221612 &#8211; Byron H Robb &#8211; Galvanic Brush" data-image-description="" data-image-caption="&lt;p&gt;1879 Patent 221612 &#8211; Galvanic Brush&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT-300x258.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT.jpg" class=" wp-image-6446 " title="1879 Patent 221612 - Byron H Robb's Galvanic Brush" src="https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT.jpg" alt="1879 Patent 221612 - Byron H Robb's Galvanic Brush" width="390" height="337" srcset="https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT.jpg 814w, https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT-300x258.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT-768x661.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT-534x462.jpg 534w, https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT-696x599.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/04/1879-Pat0221612-Robb-GALVANIC_BRUSH-CUT-488x420.jpg 488w" sizes="(max-width: 390px) 100vw, 390px" data-eio="l" />1879 Patent 221612 – Galvanic Brush Scott’s Pall Mall Electric Association of London & New York had competition (the London branch was nowhere near the Pall Mall thoroughfare). In 1879 and 1880 one Byron H. Robb of Newport, Kentucky, received two patents on a ‘real’ electric brush, with an internal voltaic battery purportedly able to generate an electric current that would pass through its wire bristles to invigorate the user. Robb advertised that it could even ward off sudden death. It was sold by Robb’s Electro-Magnetic Brush Co. of Cincinnati, just across the Ohio river from Robb’s home in Newport, Kentucky. The notorious (and appropriately named) Mr Robb, born in Ohio about 1836, lived a colorful life, by 1863 acquiring a reputation as a ‘convicted perjurer and a damnable villain.’ At the start of the Civil War, Robb lived in Ohio’s Geauga County and, claiming to have been a Texas Ranger for eight years before the war, organized a company of volunteers, which he called the Geauga Rangers. Although his offer of his Rangers’ services to the Union Army was rejected, he was noted in 1863 Civil War military intelligence as ‘U.S. Detective Byron H. Robb.’ According to the 1870 US census Robb lived with his wife and their infant son, Don Carlos, in Garrettsville, a village in northeastern Ohio, listing himself as a ‘Dealer in Patent Medicines’ with total assets of $9,000. By 1876 he had moved to Bellevue, Kentucky where he became a sometime inventor. An 1877 Robb invention was also on the market: a kerosene lamp that would self-extinguish if accidentally tipped over. Robb’s reputation as a fraud was apparently well deserved. In October 1877 he was indicted by a U.S. grand jury in Cincinnati for using the mail with intent to defraud (Valley Republican [Kinsley, Kansas], Nov 3, 1877, p.1). In late 1880 the U. S. Post Office department circulated a list of ‘parties known or believed to be guilty of fraudulent practices.’ (United States Official Postal Guide, v.V, n.1, Jan. 1883; American Agriculturist, January 1881, p. 36). The American Agriculturist had been crusading against quacks and frauds in articles headed ‘Sundry Humbugs’ since at least 1872 and published the Post Office frauds list. Prominent on the list was Byron H. Robb of Cincinnati, along with no fewer than nine of his business names, including the Electro-Magnetic Brush Co., American and European Secret Service Co., Monitor Lamp Co., and strangely, the Singapore Tobacco Co. Robb’s Secret Service scam involved selling (for $3) an official-looking American & European Secret Service Co. document appointing the applicant as ‘a member of our force.’ The recipient might then be given several (fictitious) leads and told that if, at the end of six months, he had done any good work, he would be hired at $3 a day (Index to Miscellaneous Documents of the House of Representatives 1879-‘80, Washington, v. 2 (1880), pp. 111-112, 115). <img decoding="async" data-attachment-id="6447" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/robb-electromagnetic-brush-c1880/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880.jpg" data-orig-size="2024,3060" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;CanoScan 4400F&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;1260371311&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Robb Electro-Magnetic Brush-c1880" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-198x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-677x1024.jpg" class=" wp-image-6447" title="Robb Electromagnetic brush c 1880" src="https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-677x1024.jpg" alt="Robb Electromagnetic brush c 1880" width="474" height="717" srcset="https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-677x1024.jpg 677w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-198x300.jpg 198w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-768x1161.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-696x1052.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-1068x1615.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-278x420.jpg 278w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880-1920x2903.jpg 1920w, https://thequackdoctor.com/wp-content/uploads/2014/04/Robb-ElectroMagnetic-Brush-c1880.jpg 2024w" sizes="(max-width: 474px) 100vw, 474px" data-eio="l" />c.1880 ad, Robb’s Electro-Magnetic Brush Co. Source: p. 11, Leonard de Vries and Ilonka Van Amstel, ‘The Wonderful World of American Advertisements 1865-1900,’ John Murray, London, 1973. George Scott took note of Robb’s appearance on the Post Office fraud list and during the summer of 1881, warned in his advertisements: CAUTION. An attempt has been made to get so-called “Electro Magnetic” Brushes upon the market, but the Post Office authority at Washington have published the company as a fraud. We therefore caution the Public to be careful that ‘Dr. Scott’s’ name is on the box and ‘Electric’ is on the Brush. (Scientific American, June ; Scribner’s Magazine, August). . © 2014 Robert K. Waits The above article is adapted from Robert’s book, The Medical Electricians, but the story of Byron H Robb does not end here. In the next post, Robert reveals how Robb adopted a new name, moved to Texas and started up an even more unusual mail-order business… ————————————————————————– <img decoding="async" data-attachment-id="6450" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/medical-electricians-waits/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits.jpg" data-orig-size="384,500" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="The Medical Electricians" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits-230x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits.jpg" class=" wp-image-6450 alignleft" title="The Medical Electricians" src="https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits.jpg" alt="The Medical Electricians" width="307" height="400" srcset="https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits.jpg 384w, https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits-230x300.jpg 230w, https://thequackdoctor.com/wp-content/uploads/2014/04/medical-electricians-waits-323x420.jpg 323w" sizes="(max-width: 307px) 100vw, 307px" data-eio="l" />The Medical Electricians: George A. Scott and His Victorian Cohorts in Quackery by Robert K Waits is available from Amazon. George Augustus Scott, although he gained notoriety (and riches) selling ‘electric’ cure-alls, was a wide-ranging entrepreneur. Scott left behind legitimate legacies: successful manufacturing businesses in Massachusetts and London, and a famously unsuccessful mercantile cooperative in New York. The story of ‘Dr. Scott,’ a quack peddler of Electric brushes, corsets, and belts, electric in name only, is intertwined with those of several other Victorian Medical Electricians. He mentored protégés who became infamous for quackery: Cornelius B. Harness, in England, and John R. Foran in America; and tangled with a feisty Brooklyn competitor, William C. Wilson, who later took up with Foran. Here are the advertisements and adventures of Scott, Harness, Wilson, Foran and their colleagues in quackery during the latter part of the Nineteenth Century. <img decoding="async" data-attachment-id="6457" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/qd-buy-button/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/QD-buy-button.jpg" data-orig-size="307,100" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Purchase" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/QD-buy-button-300x98.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/QD-buy-button.jpg" class="size-full wp-image-6457 alignleft" src="https://thequackdoctor.com/wp-content/uploads/2014/05/QD-buy-button.jpg" alt="Purchase" width="307" height="100" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/QD-buy-button.jpg 307w, https://thequackdoctor.com/wp-content/uploads/2014/05/QD-buy-button-300x98.jpg 300w" sizes="(max-width: 307px) 100vw, 307px" data-eio="l" />'''
