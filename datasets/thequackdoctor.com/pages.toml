title = "The Dolly Dimpler | The Quack Doctor"
description = "History's medical advertisers and their remedies"
full_description = '''<img decoding="async" data-attachment-id="6156" data-permalink="https://thequackdoctor.com/index.php/the-dolly-dimpler/attachment/6/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/6.jpg" data-orig-size="200,200" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="ADvent Calendar Day 6" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/6.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/6.jpg" class="alignleft wp-image-6156" title="ADvent Calendar Day 6" alt="ADvent Calendar Day 6" src="https://thequackdoctor.com/wp-content/uploads/2013/12/6.jpg" width="140" height="140" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/6.jpg 200w, https://thequackdoctor.com/wp-content/uploads/2013/12/6-150x150.jpg 150w" sizes="(max-width: 140px) 100vw, 140px" data-eio="l" />ADvent Calendar Day 6 Designed to create adorable dimples where there were none before, devices like this appeared in the 1920s. Evangeline Isabella Gilbert of Rochester, NY, filed a patent in 1921 (not granted until 1926) for a dimple-producer that involved two pointed knobs fitted to a spring bow that pushed them into the wearer’s cheeks. Her later improved version included a fitting for a chin dimple and screws to tighten the pressure for a more pronounced effect. This Dolly Dimpler, advertised in Motion Picture Magazine in 1924, appears to be either Gilbert’s own invention or something inspired by it. Perfect for the ‘party season’ that the normal people apparently engage in this month. <img fetchpriority="high" decoding="async" data-attachment-id="6158" data-permalink="https://thequackdoctor.com/index.php/the-dolly-dimpler/dolly-dimpler-motion-picture/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture.jpg" data-orig-size="413,540" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="dolly dimpler motion picture" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture-229x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture.jpg" class="size-full wp-image-6158 aligncenter" alt="dolly dimpler motion picture" src="https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture.jpg" width="413" height="540" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture.jpg 413w, https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture-229x300.jpg 229w, https://thequackdoctor.com/wp-content/uploads/2013/12/dolly-dimpler-motion-picture-321x420.jpg 321w" sizes="(max-width: 413px) 100vw, 413px" data-eio="l" /> <img decoding="async" data-attachment-id="6159" data-permalink="https://thequackdoctor.com/index.php/the-dolly-dimpler/mod-mech-dimple_machine/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/mod-mech-dimple_machine.jpg" data-orig-size="247,334" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Gilbert&#8217;s Dimple Machine, 1936" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/mod-mech-dimple_machine-222x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/mod-mech-dimple_machine.jpg" class="size-full wp-image-6159 aligncenter" alt="Gilbert's Dimple Machine, 1936" src="https://thequackdoctor.com/wp-content/uploads/2013/12/mod-mech-dimple_machine.jpg" width="247" height="334" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/mod-mech-dimple_machine.jpg 247w, https://thequackdoctor.com/wp-content/uploads/2013/12/mod-mech-dimple_machine-222x300.jpg 222w" sizes="(max-width: 247px) 100vw, 247px" data-eio="l" /> Advert: Motion Picture Magazine, August 1924 Photo: 1936 image of Gilbert Dimple Machine, from Modern Mechanix'''
