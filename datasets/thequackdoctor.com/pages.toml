["https://thequackdoctor.com/index.php/dangerous-beauty-madame-anna-ruppert"]
title = "Dangerous beauty: Madame Anna Ruppert | The Quack Doctor"
description = "Anna Ruppert's career as a beauty specialist brought her acclaim on both sides of the Atlantic, but there was a deadly secret to her success."
full_description = '''A box of confectionery arrived at the green room of the Princess’s Theatre, Oxford Street, on 6 November 1894 … with no well-wishes attached. The recipient was Anna Ruppert, whose new venture as a theatre manager and actress was a departure from a long career as a beauty specialist. Anna Ruppert ate a considerable quantity of sweets that night. The next day, she fell ill, and although she struggled onto the stage that evening, she could not continue beyond the first act. The sweets had been laced with carbolic acid and, although the intended victim survived and offered a £100 reward, the perpetrator was never found. <img fetchpriority="high" decoding="async" width="719" height="1024" data-attachment-id="7315" data-permalink="https://thequackdoctor.com/index.php/dangerous-beauty-madame-anna-ruppert/anna-ruppert-portrait-from-book-of-beauty/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty.jpg" data-orig-size="854,1217" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;2.4&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;iPad&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;1423052603&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;4.28&quot;,&quot;iso&quot;:&quot;100&quot;,&quot;shutter_speed&quot;:&quot;0.066666666666667&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Anna Ruppert Portrait from Book of Beauty" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-211x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-719x1024.jpg" src="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-719x1024.jpg" alt="Madame Anna Ruppert. Portrait from her own 'Book of Beauty', 1894" class="wp-image-7315" srcset="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-719x1024.jpg 719w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-211x300.jpg 211w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-768x1094.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-696x992.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty-295x420.jpg 295w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Portrait-from-Book-of-Beauty.jpg 854w" sizes="(max-width: 719px) 100vw, 719px" data-eio="l" />Madame Anna Ruppert. Portrait from her own ‘Book of Beauty’, 1894 Poison was a recurring theme for Anna Ruppert. Earlier that year, she had given an affidavit against the 1889 conviction of Florence Maybrick, who had allegedly extracted arsenic from flypapers in order to murder her husband. Ruppert testified to the common usage of arsenic as a beauty aid, pointing out that women tended to keep this practice secret from their male relatives so as to maintain the illusion of natural beauty. The all-male jury who convicted Maybrick would perhaps have found the defendant’s claims more believable had they only known what went on at the dressing table. Ruppert’s knowledge had grown through her career as a complexion expert, or dermatologist. She operated from luxurious premises in Regent Street and comes across as an ambiguous character – admirable for her determination to succeed in a male-dominated business environment, yet selling products just as questionable as those of any male ‘quack’. Ruppert was born Anna Shelton in 1864 in Pleasant Hill, Cass County, Missouri. In her teens, she sought help (either from an ‘old woman’ or from a St Louis druggist, according to different accounts) to get rid of a birthmark on her face. She then set out to share the curative formula with the rest of the world. She married Henry Ruppert in 1883 and they moved to New York, where her business as ‘Madame Ruppert’ took off. <img decoding="async" width="583" height="1024" data-attachment-id="7316" data-permalink="https://thequackdoctor.com/index.php/dangerous-beauty-madame-anna-ruppert/face-bleach-the-wave-san-francisco-8-august-1891-california-state-library/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library.jpg" data-orig-size="1002,1759" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Face bleach &#8211; The Wave, San Francisco, 8 August 1891, California State Library" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-171x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-583x1024.jpg" src="https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-583x1024.jpg" alt="Advertisement published in The Wave, San Francisco, 8 August 1891" class="wp-image-7316" srcset="https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-583x1024.jpg 583w, https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-171x300.jpg 171w, https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-768x1348.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-696x1222.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library-239x420.jpg 239w, https://thequackdoctor.com/wp-content/uploads/2019/05/Face-bleach-The-Wave-San-Francisco-8-August-1891-California-State-Library.jpg 1002w" sizes="(max-width: 583px) 100vw, 583px" data-eio="l" />Advertisement published in The Wave, San Francisco, 8 August 1891 Newspaper advertisements for ‘Madame Ruppert’s Face Bleach’ offered consumers a way to remove freckles, tan, blackheads, eczema, acne and anything else making them fall short of the required aesthetic standard. Although Ruppert did not specifically target an African American market, her products were part of a context in which the pressure on black women to lighten their complexions led to a proliferation of whitening lotions, often containing harmful ingredients. The Rupperts divorced in the late 1880s, with Henry Ruppert attempting to claim the rights to the Face Bleach and advertising for a while in competition with his ex-wife. Anna Ruppert later married an Englishman, Richard Armstrong, but retained her professional name. When the couple moved to London in 1891, face bleach had less overt racial connotations than in the American context, but was dubious in another way; it echoed the fraudulent activities of Madame Rachel Leverson, whose process of ‘enamelling’ the skin had scammed Londoners in the 1860s-70s. Perhaps to distance herself from the likes of Leverson, she used the name Mrs Ruppert rather than Madame in her British advertisements. <img decoding="async" width="650" height="1024" data-attachment-id="7319" data-permalink="https://thequackdoctor.com/index.php/dangerous-beauty-madame-anna-ruppert/anna-ruppert-ad-1893debrettspeerage/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage.jpg" data-orig-size="990,1559" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Anna Ruppert ad 1893debrettspeerage" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-191x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-650x1024.jpg" src="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-650x1024.jpg" alt="Anna Ruppert's advertisement in Debrett's, 1893" class="wp-image-7319" srcset="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-650x1024.jpg 650w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-191x300.jpg 191w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-768x1209.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-696x1096.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage-267x420.jpg 267w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-ad-1893debrettspeerage.jpg 990w" sizes="(max-width: 650px) 100vw, 650px" data-eio="l" />Anna Ruppert’s advertisement in Debrett’s, 1893. Ruppert rebranded the Face Bleach as Skin Tonic and set out to educate the British about enhancing their looks. Her public lectures, at which she would appear in fashionable gowns and floral garlands, attracted women and men alike. Ruppert’s marketing messages trod an equivocal line between the notion of ‘natural beauty’ and the need to buy products to create that beauty. Her lectures espoused her disapproval of make-up and advised that true beauty came from a pure heart. Yet her range included face powder to give the skin a velvety look, and ‘Mrs Anna Ruppert’s Red’ to impart vibrancy to the cheeks and lips. The contradiction between her advocacy of naturalness and her sale of skin-whitening products has obvious parallels with the beauty industry of today. <img decoding="async" width="902" height="623" data-attachment-id="7317" data-permalink="https://thequackdoctor.com/index.php/dangerous-beauty-madame-anna-ruppert/anna-ruppert-reception-rooms-from-book-of-beauty/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty.jpg" data-orig-size="902,623" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;2.4&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;iPad&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;1423052649&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;4.28&quot;,&quot;iso&quot;:&quot;80&quot;,&quot;shutter_speed&quot;:&quot;0.066666666666667&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Anna Ruppert Reception Rooms from Book of Beauty" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-300x207.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty.jpg" src="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty.jpg" alt="Anna Ruppert's headquarters at Regent Street, pictured in Book of Beauty, 1894" class="wp-image-7317" srcset="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty.jpg 902w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-300x207.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-768x530.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-100x70.jpg 100w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-218x150.jpg 218w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-696x481.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Reception-Rooms-from-Book-of-Beauty-608x420.jpg 608w" sizes="(max-width: 902px) 100vw, 902px" data-eio="l" />Anna Ruppert’s headquarters at Regent Street, pictured in Book of Beauty, 1894 Ruppert became an ‘agony aunt’ for Hearth and Home magazine, dispensing beauty advice in a friendly manner that drew her a loyal following. In 1893, however, another writer took over her column. No explanation was given for Ruppert’s departure but anyone following the news would be able to guess – the British Medical Journal had revealed that her skin tonic contained corrosive sublimate (mercury (II) chloride) and had caused mercury poisoning in the case of a ‘Mrs K.’ Later that year, Ruppert was prosecuted in Dublin for infringing the Irish Pharmacy Act. The Chemist and Druggist reported the case and, unusually, sent a representative to get Ruppert’s side of the story. The interview, ‘A Fair Litigant’s Bower’, (20 January 1894) describes her plush Regent Street headquarters, and presents Ruppert as an astute, disingenuous character whose insistence that she was ignorant of Irish law is at odds with her clear intelligence and business acumen. Ruppert describes her eighteen-hour working days managing a business that dealt with more than 18,000 clients. The Chemist and Druggist’s journalist was impressed. Clutching a photograph she had given him, he left with ‘the conviction that, whatever the merits of her lawsuits, the lady I had interviewed is as clever andresourceful a woman as one is likely to find in a day’s journey.’ <img decoding="async" width="559" height="807" data-attachment-id="7318" data-permalink="https://thequackdoctor.com/index.php/dangerous-beauty-madame-anna-ruppert/anna-ruppert-chemist-and-druggist-20-jan-1894-wellcome-library/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2019/05/Anna-Ruppert-Chemist-and-Druggist-20-Jan-1894-Wellcome-Library.jpg" data-orig-size="559,807" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&qu'''
