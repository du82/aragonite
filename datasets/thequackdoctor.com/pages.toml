["https://thequackdoctor.com/index.php/a-new-sensation-hair-brushing-by-machinery"]
title = "'A new sensation' – hair-brushing by machinery | The Quack Doctor"
description = "Originating in Bristol in 1862, the hair-brushing machine whirred its way into the public consciousness of Victorian Britain."
full_description = 'Among the British Library’s public domain gems is an advertisement for Batkin & Kent, Hairdressers and Perfumers of Stafford, (or Staffford – whoever proofread it probably hoped it would disappear with the next edition of the book rather than re-emerge on the internet more than a century later, but c’est la vie). <img fetchpriority="high" decoding="async" data-attachment-id="6505" data-permalink="https://thequackdoctor.com/index.php/a-new-sensation-hair-brushing-by-machinery/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886.jpg" data-orig-size="571,939" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Hair-Brushing with Machinery, Advertisement 1886" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886-182x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886.jpg" class="wp-image-6505 size-full" src="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886.jpg" alt="Hair-Brushing with Machinery, Advertisement 1886" width="571" height="939" srcset="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886.jpg 571w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886-182x300.jpg 182w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-machinery-history-of-stafford-and-guide-to-the-neighbourhood-1886-255x420.jpg 255w" sizes="(max-width: 571px) 100vw, 571px" data-eio="l" />From ‘History of Stafford and Guide to the Neighbourhood. Illustrated with wood engravings’ by Charles Calvert, 1886 It is illustrated with the image of a man seated in a barber’s chair, undergoing the fashionable process of hair-brushing by machinery. This attractive and somewhat intriguing advertisement has scored more than 4,200 views so far – not bad for one image among a million. But how did this hair-brushing process work? Was it a one-off eccentricity that never caught on, or a familiar sight in every hairdressing salon? The answer is that it became more than familiar – hair-brushing by machinery was a Victorian sensation, capturing the public imagination at a time when the mechanisation of everyday activity spoke of prosperity, progress and improvement to the human condition. It was also a solidly British development; something that the ‘Yankees’, for all their inventiveness, had failed to come up with. <img decoding="async" data-attachment-id="6502" data-permalink="https://thequackdoctor.com/index.php/a-new-sensation-hair-brushing-by-machinery/eg-camp-us-patent-illustration-1864/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864.jpg" data-orig-size="682,471" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="EG Camp US patent illustration 1864" data-image-description="" data-image-caption="&lt;p&gt;Drawing from E G Camp&#8217;s US patent, March 1864&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864-300x207.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864.jpg" class="size-full wp-image-6502" src="https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864.jpg" alt="EG Camp US patent illustration 1864" width="682" height="471" srcset="https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864.jpg 682w, https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864-300x207.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864-100x70.jpg 100w, https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864-218x150.jpg 218w, https://thequackdoctor.com/wp-content/uploads/2014/06/EG-Camp-US-patent-illustration-1864-608x420.jpg 608w" sizes="(max-width: 682px) 100vw, 682px" data-eio="l" />Drawing from E G Camp’s patent The hair-brushing phenomenon began in 1862, when a 35-year-old Bristol hairdresser, Edwin Gillard Camp, received a patent for his innovation – a rotary hair brush set in motion mechanically and guided around the customer’s head by a skilled operator. The Dundee Courier gives a good explanation of how it worked: The party whose hair is to be tittivated sits beneath an india-rubber endless band revolving on a wheel attached to a shaft, which is driven by a large fly wheel in an adjoining room. The brush is circular and hollow, and is placed on a short shaft having two handles, and fitted with a grooved wheel at one end. This wheel is placed on the band, and revolves with a slow and steady motion. The brush is then gently carried all over the head, thoroughly cleansing the scalp, and imparting an agreeable feeling. (Dundee Courier, 15 June 1864) The original machine was solely for men, its brushes thought likely to get tangled in the long hair worn by most women, but this problem was solved in 1865 by Mr Neate, Southampton, who added another pulley on the floor, allowing the brush to be drawn downwards in one long sweep. Camp’s American patent, issued two years after the British one, is available online and gives a more detailed technical description. Its inventor did not insist on any particular type of power source, but in 1868, a Punch cartoon passed comment on the likely reality of the situation – child labour. <img decoding="async" data-attachment-id="6504" data-permalink="https://thequackdoctor.com/index.php/a-new-sensation-hair-brushing-by-machinery/hair-brushing-punch-vol-54-p4/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4.jpg" data-orig-size="724,558" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Hair Brushing by Machinery &#8211; Punch vol 54, p4" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4-300x231.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4.jpg" class="aligncenter size-full wp-image-6504" src="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4.jpg" alt="Hair Brushing by Machinery - Punch vol 54, p4" width="724" height="558" srcset="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4.jpg 724w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4-300x231.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4-696x536.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-54-p4-545x420.jpg 545w" sizes="(max-width: 724px) 100vw, 724px" data-eio="l" /> Steam power, however, was another option, or a turbine water engine such as that installed by Sturrock and Sons, Glasgow. Clements and Shipwright of Tichborne Street, London, used a half-horsepower Lenoir Gas Engine in 1865 – quite necessary, since they claimed to be brushing 1,000 heads of hair a week. These hairdressers were among a purported 2,000 who applied to Camp for a license to the use the machine between 1862 and 1864. Purchasing one and adapting the shop could cost around £45, so it was not something to be tried out on a whim. After installation, the hairdresser was also required to pay a royalty of £1 11s 6d every six months to Camp during the lifetime of the patent. Thus they were keen to get punters in – advertisements announced the arrival of the machine to salons all over the country, emphasising its novelty and its superiority over old methods. ‘A new sensation. Everybody is delighted,‘ announced D. M. Allan, Dundee, while James Scotts of Newcastle-upon-Tyne said it ‘is unmistakeably the greatest Luxury of the day, and is acknowledged by Thousands as the desideratum of the Age.‘ The notion of mechanised hair-brushing had great comic potential, which spread beyond the pages of Punch and reached the stage. A blackface performance group, the ‘Stars of Christy’s Minstrels’, included in their repertoire a sketch called ‘Hair-brushing by Machinery’, which ‘produced the most uproarious mirth and screams of laughter‘ at Liverpool in April 1864, and was similarly well-received for the rest of the tour. <img decoding="async" data-attachment-id="6503" data-permalink="https://thequackdoctor.com/index.php/a-new-sensation-hair-brushing-by-machinery/hair-brushing-punch-vol-45-p175/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175.jpg" data-orig-size="821,1243" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="The New and Delightful Method &#8211; Punch vol 45 p175" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-198x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-676x1024.jpg" class="aligncenter size-full wp-image-6503" src="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175.jpg" alt="The New and Delightful Method - Punch vol 45 p175" width="821" height="1243" srcset="https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175.jpg 821w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-198x300.jpg 198w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-768x1163.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-676x1024.jpg 676w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-696x1054.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/06/hair-brushing-Punch-vol-45-p175-277x420.jpg 277w" sizes="(max-width: 821px) 100vw, 821px" data-eio="l" /> Another Punch cartoon (above) presents the process as rather an ordeal, but a description in Chambers’s Journal in 1863 gives the opposite view, placing the experience in a pleasurable, indeed sensual, light: When I went in to get my hair brushed, had sat down before the glass, and been tucked in as usual, with bib and dressing-gown, the hair-dresser took up one of his circular brushes and hitched it to the revolving band over my head. In a moment I felt a silent fanning, as if some monstrous butterfly were hovering over me; this was the air of the twirling brush, which caught my hair up and laid it down, and travelled all over my head with incessant gentle penetration. It crept down my whiskers and searched my beard with the same tender and decided effect. There was no scratching, not even of the neck and ears, but the skin of cheeks and chin was reached and swept. It was a new sensation. I felt as if I should like to be brushed continuously for a month. The feelings of wellbeing, however, did not necessarily extend to the person doing the brushing. As the purpose of brushing was to clean the hair rather than simply untangle it (marketers had not yet capitalised on the idea of persuading everyone to use shampoo every day), the brush removed ‘extraneous matter’ from the scalp. This had to go somewhere, and in a lecture in 1876 Dr B W Richardson reported his friend Dr Cholmeley’s hypothesis that the dust was responsible for respiratory disease in hairdressers. According to J T Arlidge in The Hygiene and Mortality of Occupations (1892), however, the new machine was not to blame for the ill health of its operators – that was more likely to be attributable to their ‘loose habits of life‘ and the ‘effeminate nature of their occupation’. <img decoding="async" data-attachment-id="6513" data-permalink="https://thequackdoctor.com/index.php/a-new-sensation-hair-brushing-by-machinery/honey-skelton-advert-punch-14-nov-1863/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/06/honey-skelton-advert-Punch-14-Nov-1863.jpg" data-orig-size="352,225" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Honey &#038; Skelton Advert, Punch 14 Nov 1863" data-image-description="" data-image-caption="&lt;p&gt;Advertisement in Punch, 14 Nov 1863&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/06/honey-skelton-advert-Punch-14-Nov-1863-300x192.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/06/honey-skelton-advert-Punch-14-Nov-1863.jpg" class="size-full wp-image-6513" src="https://t'
