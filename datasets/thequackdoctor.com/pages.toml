["https://thequackdoctor.com/index.php/kimballs-anti-rheumatic-ring"]
title = "Kimball’s Anti-Rheumatic Ring | The Quack Doctor"
description = "This 1890s product claimed to cure rheumatism by eliminating acid from the blood."
full_description = '''Kimball’s Anti-Rheumatic Ring fits into the tradition of the magnetic or copper jewellery that many people still swear by for arthritis and general health. <img fetchpriority="high" decoding="async" width="520" height="809" data-attachment-id="7532" data-permalink="https://thequackdoctor.com/index.php/kimballs-anti-rheumatic-ring/kimball-ring-royal-blue-book-1911/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911.jpg" data-orig-size="520,809" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Kimball-Ring-Royal-Blue-Book-1911" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911-386x600.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911.jpg" src="https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911.jpg" alt="A full-page advertisement for Kimball's Anti-Rheumatic Ring, featuring trademark of a hand with a ting on the little finger, and a list of medical conditions." class="wp-image-7532" srcset="https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911.jpg 520w, https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911-386x600.jpg 386w, https://thequackdoctor.com/wp-content/uploads/2024/07/Kimball-Ring-Royal-Blue-Book-1911-193x300.jpg 193w" sizes="(max-width: 520px) 100vw, 520px" data-eio="l" />Advertisement from Royal Blue Book, Court and Parliamentary Guide, May 1911. Frederick W Kimball (b.1854) introduced it in about 1883 in Boston, MA, advertising it as ‘The Great German Anti-Rheumatic Ring’. By 1890, the company had moved to State Street, Chicago, and by 1892 it was based in Union Square, New York City. Sarah Foster Kimball, Frederick’s wife, appears to have the been the main proprietor in the early 20th century. The Anti-Rheumatic Ring cost $2 and adverts promised that it would help: RHEUMATISM, NEURALGIA, SCIATICA, LUMBAGO, GOUT, PARALYSIS and, in fact, ALL DISEASES where a WARMING, QUICKENING, STRENGTHENING AND EQUALIZATION of the circulation is required. It cures by quickening the circulation, then the blood, coursing more quickly through the veins, dissolves the ACID CRYSTALS, which are the direct cause of pain in RHEUMATISM. It makes no difference in what part of the body the trouble may be. (The Boston Globe, 11 March 1888). <img decoding="async" width="884" height="1200" data-attachment-id="7541" data-permalink="https://thequackdoctor.com/index.php/kimballs-anti-rheumatic-ring/philadelphia-times-12-march-1892/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495.jpeg" data-orig-size="1219,1654" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;Screenshot&quot;,&quot;created_timestamp&quot;:&quot;1723668178&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;Philadelphia times 12 March 1892&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Philadelphia times 12 March 1892" data-image-description="" data-image-caption="&lt;p&gt;Screenshot&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-442x600.jpeg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-884x1200.jpeg" src="https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-884x1200.jpeg" alt=" of a man and a woman at a large open window. The man is pointing at a ring in the sky. The words ‘The Marvel of the 19th century. The Kimball German Anti-Rheumatic Ring” appear in the middle." class="wp-image-7541" style="width:603px;height:auto" srcset="https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-884x1200.jpeg 884w, https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-442x600.jpeg 442w, https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-221x300.jpeg 221w, https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-768x1042.jpeg 768w, https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495-1132x1536.jpeg 1132w, https://thequackdoctor.com/wp-content/uploads/2024/08/IMG_0495.jpeg 1219w" sizes="(max-width: 884px) 100vw, 884px" data-eio="l" />Detail from an advertisement in the Philadelphia Times, 12 March 1892. The theory behind the device held that rheumatism resulted from acidity of the blood. This could be the consequence of liver, kidney or stomach disorders, and everyone had it to a greater or lesser extent. The acid would crystallise into glass-like particles that irritated the nerves, causing pain. A British branch of the company operated from 84 Oxford Street, London, selling the rings for 10 shillings. One of their advertising pamphlets from the early 1900s states: While the blood circulates perfectly, these acids are thrown off without doing much damage, but as soon as the blood has taken on more than it can carry, the mischief begins. <img decoding="async" width="760" height="453" data-attachment-id="7529" data-permalink="https://thequackdoctor.com/index.php/kimballs-anti-rheumatic-ring/image-4/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2024/07/image.jpg" data-orig-size="760,453" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="image" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2024/07/image-600x358.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2024/07/image.jpg" src="https://thequackdoctor.com/wp-content/uploads/2024/07/image.jpg" alt="A card with 9 holes of various sizes for people to test what size ring they need. The background has a floral motif and a rectangle in the centre shows a trademark of a hand, and a lost of conditions the ring supposedly treats." class="wp-image-7529" style="width:840px;height:auto" srcset="https://thequackdoctor.com/wp-content/uploads/2024/07/image.jpg 760w, https://thequackdoctor.com/wp-content/uploads/2024/07/image-600x358.jpg 600w, https://thequackdoctor.com/wp-content/uploads/2024/07/image-300x179.jpg 300w" sizes="(max-width: 760px) 100vw, 760px" data-eio="l" />British measuring card, from Wellcome Images. The card above allowed potential purchasers to measure their finger so they could order the correct size. They should ideally wear it on the little finger of the left hand. It would discolour the skin (suggesting that it was made of copper) but the directions stated that this would only occur until all the acid had left the system. There was also a version with gold plating on the outer surface, which the London branch sold for 1 guinea. <img decoding="async" width="400" height="300" data-attachment-id="7530" data-permalink="https://thequackdoctor.com/index.php/kimballs-anti-rheumatic-ring/image-5/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2024/07/image.png" data-orig-size="400,300" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="image" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2024/07/image.png" data-large-file="https://thequackdoctor.com/wp-content/uploads/2024/07/image.png" src="https://thequackdoctor.com/wp-content/uploads/2024/07/image.png" alt="A plain metal ring similar to a wedding band. The box in which it originally came is also pictured; this now quite battered but it shows the company tradmark of a hand." class="wp-image-7530" srcset="https://thequackdoctor.com/wp-content/uploads/2024/07/image.png 400w, https://thequackdoctor.com/wp-content/uploads/2024/07/image-300x225.png 300w" sizes="(max-width: 400px) 100vw, 400px" data-eio="l" />An example of the ring and packaging, via Worthpoint. Advertisements in the US claimed Republican politician Chauncey Depew as a fan. One version of a testimonial letter purportedly written by him said: I have received the greatest amount of benefit from it, and if I were so placed that I could not find another I would not part with this one for ten thousand or any amount of dollars. It certainly is a great invention, and I know that it is doing me good, as well as to the persons to whom I have recommended it. (Minneapolis Journal, 1 April 1905.) Meanwhile, in the UK, the Venerable Archdeacon Basil Wilberforce (grandson of the abolitionist William Wilberforce) was a prominent supporter – albeit acknowledging that correlation is not causation: I can only say that up to date I have not had a twinge of rheumatism since I first put on your Ring. It may be coincidence, but it is a fact, nevertheless. (Morning Post, 28 May 1895.)'''
