["https://thequackdoctor.com/index.php/munyon-is-ready"]
title = "Munyon is ready... | The Quack Doctor"
description = "Munyon's Homeopathic Home Remedies made their inventor a fortune - but little did he know his company would be connected with one of the most famous murder cases of the early 20th century."
full_description = 'Would you buy a homeopathic remedy from this man? <img fetchpriority="high" decoding="async" data-attachment-id="4183" data-permalink="https://thequackdoctor.com/index.php/munyon-is-ready/munyon/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2010/07/munyon.jpg" data-orig-size="640,1494" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="munyon" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2010/07/munyon-129x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2010/07/munyon-439x1024.jpg" class="aligncenter size-full wp-image-4183" title="munyon" src="https://thequackdoctor.com/wp-content/uploads/2010/07/munyon.jpg" alt="" width="512" height="1195" srcset="https://thequackdoctor.com/wp-content/uploads/2010/07/munyon.jpg 640w, https://thequackdoctor.com/wp-content/uploads/2010/07/munyon-129x300.jpg 129w, https://thequackdoctor.com/wp-content/uploads/2010/07/munyon-439x1024.jpg 439w, https://thequackdoctor.com/wp-content/uploads/2010/07/munyon-180x420.jpg 180w" sizes="(max-width: 512px) 100vw, 512px" data-eio="l" /> Source: The Morning Times (Washington D.C.) 13 December 1896 James Monroe Munyon’s pompadour hairstyle was a familiar feature of American newspapers around the turn of the 20th century. Having tried his hand at teaching, law, social work, publishing and song-writing, he started his Homoeopathic Home Remedy Company in the early 1890s and hit pay dirt. In 1897, Munyon opened a London head office and a depot in Liverpool. A massive advertising campaign promised free vials of the remedies and challenged the British public to test his new system of curing disease. Perhaps Munyon anticipated lasting fame in the UK, but he couldn’t have predicted what his company would be remembered for. There was a separate remedy for every disease. To name but a few, there were… Munyon’s Kidney Cure, which a 1907 analysis showed to be 100% sugar. Munyon’s Asthma Cure (sugar and alcohol) Munyon’s Blood Cure (sugar) Munyon’s Special Liquid Blood Cure (sugar, potassium iodide and corrosive sublimate) Munyon’s Catarrh Cure (sodium bicarbonate, salt, borax, phenol and gum) Munyon’s Special Catarrh Cure (sugar) Munyon’s Grippe Remedy (sugar and arsenic) Munyon’s Pile Ointment (a farthing’s worth of soft paraffin). At various times these products were declared misbranded in the US because of the claims that they could cure disease, and Munyon received fines – but he carried on his business regardless. One of the slogans he used in his advertising was: There is no punishment too great for him who deceives the sick. While his remedies were coming under scrutiny from the BMJ and the American Medical Association, 60-year-old Munyon was busy marrying his third wife, 24-year-old actress Pauline Neff Metzger. His fortune was not an effective enough remedy for their differences, and they divorced in 1913. Munyon had bought an island off North Palm Beach, Florida, and opened a resort there in 1903, calling his luxury hotel the Hygeia and attracting wealthy invalids. One of the attractions of the place was the ready supply of Paw Paw Tonic, a cure-all made from papaya. The place burnt down in 1917 and Munyon died a year later of an apoplexy while having lunch at the Poinciana Hotel on the mainland. His obituary in the New York Times quoted him as having said he started out with: virtually no capital except ambition and a belief in letting folks know about it. The company continued, and as late as the 1940s, shipments of its products were still being seized by the government and condemned. In 1944, a batch of Paw Paw Tonic was found to contain strychnine. <img decoding="async" data-attachment-id="4187" data-permalink="https://thequackdoctor.com/index.php/munyon-is-ready/munyonmichaeltill/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill.jpg" data-orig-size="221,500" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="munyonmichaeltill" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill-133x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill.jpg" class="aligncenter size-full wp-image-4187" title="munyonmichaeltill" src="https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill.jpg" alt="" width="177" height="400" srcset="https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill.jpg 221w, https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill-133x300.jpg 133w, https://thequackdoctor.com/wp-content/uploads/2010/07/munyonmichaeltill-186x420.jpg 186w" sizes="(max-width: 177px) 100vw, 177px" data-eio="l" />Above: Munyon’s Catarrh Cure. Photo credit: Michael Till. This was part of an inhaler that would originally have had a stopper with a tube insertion, allowing the patient to snort the remedy. Munyon’s Homoeopathic Home Remedy Company has a colourful enough history of its own, but is now chiefly remembered for its other claim to fame. The London office’s first manager was an industrious employee who had spent the past few years as a Consulting Physician in the Philadelphia and then Toronto branches, impressing Munyon with his work ethic and ability to improve sales. Unfortunately, the London manager started having problems with his wife, who was still in the US trying to become a professional singer and openly having affairs. When she moved to London in 1900, he made some attempt to support her in her music hall career, but the stormy relationship interfered with his work. He left Munyon’s and did the rounds of various other patent medicine companies, including the Sovereign Remedy Company, his own business the Yale Tooth Specialists, and the Aural Clinic, later returning to the advertising department of his original employer. Dr Hawley Harvey Crippen eventually got the sack from Munyon’s. By then he had taken up with Ethel le Neve, his wife was still giving him trouble, and things kind of went downhill from there. . .'
