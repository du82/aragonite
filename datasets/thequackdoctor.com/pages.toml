title = "Godfrey's Inhaler | The Quack Doctor"
description = "History's medical advertisers and their remedies"
full_description = '''<img decoding="async" class="ngg-singlepic ngg-left alignleft" title="ADvent Calendar Day 5" alt="ADvent Calendar Day 5" src="https://thequackdoctor.com/wp-content/gallery/advent-calendar/5.jpg" width="140" height="140" data-eio="l" />This mainstream medical product enabled the inhalation of vapour for the treatment of asthma, hay fever, coughs, colds and other respiratory problems. The vapour was created by combining hydrochloric acid and ammonium chloride, which were provided in attractive little glass bottles – one clear and one emerald green. There are some pictures of the product, plus a host of other antique inhalers, at Mark Sanders’ fascinating website, The Inhalatorium. This 1890s advertisement is aimed at pharmacists. <img fetchpriority="high" decoding="async" data-attachment-id="6141" data-permalink="https://thequackdoctor.com/index.php/godfreys-inhaler/godfreys-inhaler/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler.jpg" data-orig-size="1524,584" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Godfrey&#8217;s Inhaler" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-300x115.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-1024x392.jpg" class="aligncenter wp-image-6141" title="Godfrey's Inhaler" alt="Godfrey's Inhaler" src="https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-1024x392.jpg" width="645" height="247" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-1024x392.jpg 1024w, https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-300x115.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-768x294.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-696x267.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-1068x409.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler-1096x420.jpg 1096w, https://thequackdoctor.com/wp-content/uploads/2013/12/Godfreys-Inhaler.jpg 1524w" sizes="(max-width: 645px) 100vw, 645px" data-eio="l" />'''
