["https://thequackdoctor.com/index.php/avoiding-the-trickcyclist-and-nutpicker-first-world-war-home-remedies-and-miracle-cures"]
title = "Avoiding the trickcyclist and nutpicker: First World War home remedies and miracle cures | The Quack Doctor"
description = "Suzie Grogan, author of Shell Shocked Britain, explores the commercial remedies that claimed to alleviate the psychological effects of war."
full_description = '''<img decoding="async" data-attachment-id="6459" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/guest-post-label/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-orig-size="250,172" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Guest post" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" class="alignleft wp-image-6459 " src="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" alt="Guest post" width="209" height="143" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg 250w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-218x150.jpg 218w" sizes="(max-width: 209px) 100vw, 209px" data-eio="l" />Suzie Grogan, author of Shell Shocked Britain: The First World War’s Legacy for Britain’s Mental Health<img decoding="async" style="border: none !important; margin: 0px !important;" src="http://ir-uk.amazon-adsystem.com/e/ir?t=quackdoctor-21&amp;l=as2&amp;o=2&amp;a=1781592659" alt="" width="1" height="1" border="0" data-eio="l" /> explores the commercial remedies that claimed to tackle the psychological effects of war. In the pre-welfare state world we can barely imagine, it was natural for those suffering a myriad different ailments to first consult their pharmacist for a ‘cure’. Many of the adverts that filled the pages of the national and local papers and weekly magazines seem amusing to us now, claiming as they do to help everything from lung disease to liverishness, heart disease to haemorrhoids. The People’s Friend for example, ran adverts such as ‘Don’t gas, take Beecham’s Pills’, ‘At Home and Abroad insist on Milkmaid Cocoa’ and ‘Daisy, cures headache and neuralgia’. The last of these is headlined ‘I wonder if he’s safe…’ and offers Daisy as a cure for ‘war headaches’. <img fetchpriority="high" decoding="async" data-attachment-id="6648" data-permalink="https://thequackdoctor.com/index.php/avoiding-the-trickcyclist-and-nutpicker-first-world-war-home-remedies-and-miracle-cures/shell-shocked-britain-cover/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Shell-Shocked-Britain-Cover.jpg" data-orig-size="233,346" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Shell Shocked Britain Cover" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Shell-Shocked-Britain-Cover-202x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Shell-Shocked-Britain-Cover.jpg" class="alignleft wp-image-6648 size-full" src="https://thequackdoctor.com/wp-content/uploads/2014/10/Shell-Shocked-Britain-Cover.jpg" alt="Shell Shocked Britain Cover" width="233" height="346" srcset="https://thequackdoctor.com/wp-content/uploads/2014/10/Shell-Shocked-Britain-Cover.jpg 233w, https://thequackdoctor.com/wp-content/uploads/2014/10/Shell-Shocked-Britain-Cover-202x300.jpg 202w" sizes="(max-width: 233px) 100vw, 233px" data-eio="l" />For Shell Shocked Britain: The First World War’s Legacy for Britain’s Mental Health<img decoding="async" style="border: none !important; margin: 0px !important;" src="http://ir-uk.amazon-adsystem.com/e/ir?t=quackdoctor-21&amp;l=as2&amp;o=2&amp;a=1781592659" alt="" width="1" height="1" border="0" data-eio="l" /> I undertook research into the treatments available to those who were suffering from the after effects of their war service, or the impact of the war on the Home Front. The Ministry of Defence officially diagnosed 80,000 men with shell shock during the First World War, but many more suffered in silence, literally, as they returned home to a civilian life they could barely comprehend and as they struggled to come to terms with the horrors they had witnessed and the friends they had lost. Civilians coping at home also had their anxieties, manifesting themselves as ‘nerve trouble’ or uncomfortable physical symptoms – digestive illness, skin complaints, and the aforementioned headaches. When a doctor might first check the mantelpiece for his fee before beginning any treatment, a working class family found themselves good friends with their local chemist, who would supply them with an over the counter remedy such as Dr Cassell’s tablets or Phosferine. Particular remedies were aimed at those with ailments attributable to the war itself. I found an advert for Dr Cassell’s Tablets that quotes one ‘Mrs Brickett of 16 Binker Road, Camberwell’ who swore by the pills to cure her after ‘the terrible air raids’ started. ‘I don’t know where I should have been but for Dr Cassell’s tablets‘, she says, in an advert posted in June 1919, ‘in my grave most likely.’ Another advert headlined ‘Health and Happiness’ states that the ‘Ajax Dry Coil Body Battery’, judiciously applied, can offer the man debilitated by his time at the Front relief from ‘Neurasthenia, Neuritis, Rheumatism, Sciatica, Lumbago, Stomach, Liver and Bladder troubles, Paralysis and many other complaints’. <img decoding="async" data-attachment-id="6645" data-permalink="https://thequackdoctor.com/index.php/avoiding-the-trickcyclist-and-nutpicker-first-world-war-home-remedies-and-miracle-cures/cassells-air-raids-overseas-june-1919-robarts-library/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/10/cassells-air-raids-Overseas-June-1919-Robarts-Library.jpg" data-orig-size="823,1396" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="cassell&#8217;s &#8211; air raids &#8211; Overseas, June 1919 &#8211; Robarts Library" data-image-description="" data-image-caption="&lt;p&gt;Dr Cassell&#8217;s Tablets, advertised in &#8216;Overseas&#8217;, June 1919 (Robarts Library)&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/10/cassells-air-raids-Overseas-June-1919-Robarts-Library-177x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/10/cassells-air-raids-Overseas-June-1919-Robarts-Library-604x1024.jpg" class=" wp-image-6645" src="https://thequackdoctor.com/wp-content/uploads/2014/10/cassells-air-raids-Overseas-June-1919-Robarts-Library.jpg" alt="Dr Cassell's Tablets, advertised in 'Overseas', June 1919" width="473" height="1465" data-eio="l" />Dr Cassell’s Tablets, advertised in ‘Overseas’, June 1919 (Robarts Library) Similarly, Phosferine claimed to rebuild the life of a shell shocked man. According to a newspaper advert of 1919 R. L. Kearns, a former private from the King’s Liverpool Regiment is quoted as saying: ‘I feel that I must write a few words in praise of your wonderful preparation ‘Phosferine’ and let you know how grateful I feel for the effect produced by it in my particular case. I went to France in November 1916 and engaged in a great number of scraps with the Hun, until I was returned to England in March 1917, suffering from shell-shock. You can imagine what winter is like in the trenches, and especially to one who was never very strong.’ <img decoding="async" data-attachment-id="6646" data-permalink="https://thequackdoctor.com/index.php/avoiding-the-trickcyclist-and-nutpicker-first-world-war-home-remedies-and-miracle-cures/phosferine-shell-shock-graces-guide/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Phosferine-shell-shock-graces-guide.jpg" data-orig-size="760,1126" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="A 1919 Phosferine advertisement, from Grace&#8217;s Guide" data-image-description="" data-image-caption="&lt;p&gt;A 1919 Phosferine advertisement, from Grace&#8217;s Guide&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Phosferine-shell-shock-graces-guide-202x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Phosferine-shell-shock-graces-guide-691x1024.jpg" class="wp-image-6646" src="https://thequackdoctor.com/wp-content/uploads/2014/10/Phosferine-shell-shock-graces-guide-691x1024.jpg" alt="A 1919 Phosferine advertisement, from Grace's Guide" width="452" height="865" data-eio="l" />Another 1919 Phosferine advertisement, from Grace’s Guide Many of these medicines contained substances since strictly regulated, such as cocaine and morphine, and many found themselves addicted quite unwittingly. Drug addiction and death in the wild West End of London made the headlines, as cocaine was still openly available, and the misogynist press blamed ‘loose women’ for causing addiction in the service personnel who frequented the theatres and clubs. But there was considerable low level addiction amongst the general population who required greater and greater amounts to control their pain, however it was caused. <img decoding="async" data-attachment-id="6651" data-permalink="https://thequackdoctor.com/index.php/avoiding-the-trickcyclist-and-nutpicker-first-world-war-home-remedies-and-miracle-cures/halls-wine-the_times_tue__jun_22__1915/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Halls-Wine-The_Times_Tue__Jun_22__1915.jpg" data-orig-size="1626,6243" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Hall&#8217;s Wine &#8211; The Times, Tue Jun 22 1915" data-image-description="" data-image-caption="&lt;p&gt;Hall&#8217;s Wine &#8211; The Times, Tue Jun 22 1915 (from Newspapers.com)&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Halls-Wine-The_Times_Tue__Jun_22__1915-78x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/10/Halls-Wine-The_Times_Tue__Jun_22__1915-267x1024.jpg" class=" wp-image-6651" src="https://thequackdoctor.com/wp-content/uploads/2014/10/Halls-Wine-The_Times_Tue__Jun_22__1915-266x1024.jpg" alt="Hall's Wine - The Times, Tue Jun 22 1915" width="245" height="946" data-eio="l" />Hall’s Wine – The Times, Tue Jun 22 1915 (from Newspapers.com) Other concoctions were based on alcohol and available from wine merchants, who might offer special rates for those returning from action at the Front. These tonics were as useful as a visit to the pub, something men also did to self-medicate, and which caused a rise in drunkenness and domestic violence. One, from 1916, is titled ‘Hall’s Wine & Air Raids’ and the advert cries out: ‘During the recent Air Raid over this town [Southend] Hall’s Wine proved a great help to us as I happened to have a bottle by me. It worked wonders when administered to the ladies and prevented the nervous collapse of many when the bombs were dropping and the strain on the nerves was at its worst’ These advertisements give a flavour of the kind of treatments people had to resort to during and after the war in order to deal with the stress and ongoing anxiety and depression. Even if a family was comfortably off and could afford a family doctor to consult when illness struck, there were few treatments available for those suffering with their ‘nerves’ as mental ill-health was regularly called in the press. Most GPs might recommend a bracing walk, or a rest cure at an expensive spa. Many of the treatments used by specialists in the military hospitals did find their way into the treatment of the seriously mentally ill after the war, but the numbers benefiting were low. Most had to muddle on, keeping quiet about their most serious symptoms of depression and living with this enduring legacy of the First World War. . . . . . . Suzie Grogan is a London-born professional writer and researcher in the fields of social and family history and mental health. Suzie’s first book Dandelions and Bad Hair Days<img decoding="async" style="border: none !important; margin: 0px !important;" src="http://ir-uk.amazon-adsystem.com/e/ir?t=quackdoctor-21&amp;l=as2&amp;o=2&amp;a=0956286984" alt="" width="1" height="1" border="0" data-eio="l" /> was published in 2012 and she also writes for a wide variety of national magazines. Suzie also runs a popular blog, No wriggling out of writing, and presents a local radio show on literature, called ‘Talking Books’. <img decoding="async" src="http://www.tqlkg.com/image-7667645-11902880" alt="" width="480" height="120" border="0" data-eio="l" />'''
