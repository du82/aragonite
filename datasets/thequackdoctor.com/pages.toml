title = "A breath of maggoty air | The Quack Doctor"
description = "A fshing-bait breeder discovered in 1911 that the gases in his maggot shed might cure consumption."
full_description = '''No one likes to be the hapless person who wanders into the garage and finds a forgotten turkey carcase humming with maggots and surrounded in a fug of pungent effluvia. I suppose it would be a great story if this had been a defining moment of my teenage years, inspiring me to embark on a glittering international career in forensic entomology, but in reality I just helped (i.e. watched) my mum transfer it to the bin and went about my day. Little did I know that, according to one early twentieth-century farmer, I was breathing in a cure for tuberculosis … From the human perspective, maggots are repulsive. They do, however, have their uses – and not just to clear dead things from the environment. Their employment in both ancient and modern medicine to debride necrotic wound tissue is well known; this article concerns a different episode in their medical story. It took place in the pre-antibiotic days of 1911, and could hold the potential for development in a post-antibiotic future too. The birth of the Maggotorium In August 1911, a chemist reported to the Chemist and Druggist about a visit to an unusual treatment centre. The place was Jerusalem Farm, Thornton, near Bradford, where Arthur Edward Bryant grew maggots for fishing bait. Bryant, who had suffered pulmonary tuberculosis, claimed that since he started his enterprise he had entirely recovered. He now invited other TB patients to inhale the gases in his maggot sheds – with apparently excellent results. Arthur Bryant was born in Preston Bissett, Buckinghamshire, in 1879. He left home at seventeen, keen to escape a demoralising life of working 100 hours a week only to have to give all his wages (except one penny) to his mother. He set off for Yorkshire and took various jobs as a brickworker, farmhand and collier, saving £6 in the Yorkshire Penny Bank within his first year. Bryant was also a keen angler, and began breeding maggots on a small scale to use and sell. By becoming a knackerman too, he always had enough decaying flesh to keep his wriggly crop happy, and soon became known as ‘The Maggot King’. <img fetchpriority="high" decoding="async" data-attachment-id="6909" data-permalink="https://thequackdoctor.com/index.php/a-breath-of-maggoty-air/maggots-ad-fishing-gazette-3-july-1909/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2016/10/maggots-ad-fishing-gazette-3-july-1909.jpg" data-orig-size="365,333" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="maggots-ad-fishing-gazette-3-july-1909" data-image-description="" data-image-caption="&lt;p&gt;Advertisement in the Fishing Gazette, 3 July 1909 (Digitised by University of Illinois)&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2016/10/maggots-ad-fishing-gazette-3-july-1909-300x274.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2016/10/maggots-ad-fishing-gazette-3-july-1909.jpg" class="size-full wp-image-6909" src="https://thequackdoctor.com/wp-content/uploads/2016/10/maggots-ad-fishing-gazette-3-july-1909.jpg" alt="Advertisement in the Fishing Gazette, 3 July 1909 (Digitised by University of Illinois)" width="365" height="333" srcset="https://thequackdoctor.com/wp-content/uploads/2016/10/maggots-ad-fishing-gazette-3-july-1909.jpg 365w, https://thequackdoctor.com/wp-content/uploads/2016/10/maggots-ad-fishing-gazette-3-july-1909-300x274.jpg 300w" sizes="(max-width: 365px) 100vw, 365px" data-eio="l" />Advertisement in the Fishing Gazette, 3 July 1909 (Digitised by University of Illinois) In 1911, the business was thriving, and with Bryant’s tuberculosis symptoms gone, he opened up his maggot-breeding sheds to people who had lost hope with the conventional sanatoria of the time. The ‘Maggotorium’ was born. ‘One gets used to it’ The Chemist and Druggist‘s correspondent described an unenticing scene. The patients spent three hours in the morning and two hours in the afternoon inhaling the stench of decaying meat, which hung on hooks around the room. Once the meat was sufficiently far gone, it got transferred to galvanised tanks, heated by hot-water pipes, where blowflies ‘hurr[ied] on the decaying stage’ and deposited their eggs. ‘On first entering one is overcome with the heat and the strong smell of ammonia, but after a time one gets used to it,’ the correspondent said. <img decoding="async" data-attachment-id="6911" data-permalink="https://thequackdoctor.com/index.php/a-breath-of-maggoty-air/photo-13-10-2016-18-32-20/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20.jpg" data-orig-size="1588,1464" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Jerusalem Farm, Thornton" data-image-description="" data-image-caption="&lt;p&gt;Maggot sheds at Jerusalem Farm, pictured in the Leeds Mercury, 31 July 1911. (British Newspaper Archive)&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-300x277.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-1024x944.jpg" class="size-large wp-image-6911" src="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-1024x944.jpg" alt="Maggot sheds at Jerusalem Farm, pictured in the Leeds Mercury, 31 July 1911. (British Newspaper Archive)" width="800" height="738" srcset="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-1024x944.jpg 1024w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-300x277.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-768x708.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-696x642.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-1068x985.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20-456x420.jpg 456w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-32-20.jpg 1588w" sizes="(max-width: 800px) 100vw, 800px" data-eio="l" />Maggot sheds at Jerusalem Farm, pictured in the Leeds Mercury, 31 July 1911. (British Newspaper Archive) Another contemporary description agreed that the place did not offer the height of luxury: ‘He has two long, narrow sheds, divided into compartments, separated from each other and each entered by a separate door; each shed is traversed by pipes for heating purposes. On either side of the door are troughs, in which are placed fragments of the carcases (offal, and so forth) of the beasts dealt with. While lying here flies have free access for the deposition of eggs, which rapidly develop into larva at suitable temperatures.’ (Yorkshire Evening Post, 9 Sept 1911.) Bryant himself, the Post said, was ‘a man of healthy appearance, free from all signs of sickness, and of an exceptionally happy and light-hearted disposition.’ His organisational skills appeared lacking – he kept few patient records and was uncertain how many people had undergone treatment or benefited from it – but he came across as ‘a man of active and good intelligence and transparent honesty.’ <img decoding="async" data-attachment-id="6910" data-permalink="https://thequackdoctor.com/index.php/a-breath-of-maggoty-air/photo-13-10-2016-18-31-58/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58.jpg" data-orig-size="1080,1530" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="riddling the maggots" data-image-description="" data-image-caption="&lt;p&gt;Arthur Bryant (left) and a colleague &#8216;riddling&#8217; the maggots to clean them for sale as bait. Leeds Mercury &lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-212x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-723x1024.jpg" class="size-large wp-image-6910" src="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-723x1024.jpg" alt="Arthur Bryant (left) and a colleague 'riddling' the maggots to clean them for sale as bait. Leeds Mercury, 31 July 1911 (British Newspaper Archive)" width="723" height="1024" srcset="https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-723x1024.jpg 723w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-212x300.jpg 212w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-768x1088.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-696x986.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-1068x1513.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58-296x420.jpg 296w, https://thequackdoctor.com/wp-content/uploads/2016/10/Photo-13-10-2016-18-31-58.jpg 1080w" sizes="(max-width: 723px) 100vw, 723px" data-eio="l" />Arthur Bryant (left) and a colleague ‘riddling’ the maggots to clean them for sale as bait. Leeds Mercury, 31 July 1911 (British Newspaper Archive) <img decoding="async" src="https://www.awin1.com/cshow.php?s=2050285&amp;v=5895&amp;q=323667&amp;r=531859" border="0" data-eio="l" /> Not merely antiseptics but germicides Persuaded by his own experience that the treatment worked, Bryant nevertheless sought to confirm its efficacy scientifically, and called in the Bradford City Analyst, Mr F. W. Richardson, to carry out some tests of the maggoty air. Richardson found ammonia and trimethylamine present in significant quantities, as well as mono- and dimethylamine and traces of indole and skatole (components of poo smell). On experimenting further he found that even weak solutions of these substances destroyed microbes after a few hours’ exposure: ‘We are therefore of the opinion that they are not merely antiseptics but germicides. Thus do we confirm the opinion which I expressed, as to the action of maggotorial fumes. These fumes, evidently when inhaled, come in contact with the tubercle bacilli, and reduce their vitality, or may even kill them, while, according to your [i.e. Bryant’s] investigations, these fumes do not injuriously effect the human organism.’ Bryant did not charge patients to attend the maggotorium; on the contrary, he provided them with food at his own expense. The ‘Maggot Cure’ wasn’t a money-making scheme but one whose discoverer went out of pocket in his enthusiasm to make it available to all. He put together plans for a more comfortable sanatorium room above the maggot sheds, where patients could benefit from the fumes without having to sit next to decaying flesh. Although these were initially rejected, Denholme Urban Council passed Bryant’s revised plans in October 1911. For reasons that are unclear, the scheme did not come to fruition, and by 1915, Bryant had returned to Preston Bissett, where he continued to farm maggots for angling alongside a diverse range of other crops – but didn’t pursue the sanatorium idea. Although there was medical interest in the treatment of TB through inhalation, Britain had quite a lot on its plate at this period and the maggot gases’ potential appears to have been neglected, other than by a few copycat maggotoria. King of the Maggots The rest of Bryant’s life was by no means uneventful, however. His fame in the angling world meant that by the 1930s he could enjoy the fact that a letter addressed to ‘The Maggot King, England’ could reach him from anywhere. In 1936, he won the All-England Angling Championship with a record catch of 35lb 1oz of bream. Bryant became a leading figure in local government politics as an outspoken, honest campaigner for the public good. This led to many a clash with his fellow councillors but as one colleague put it ‘there is something about Arthur Bryant and you cannot help liking him.’ Bryant inaugurated the St Dunstan’s Cup, encouraging Bucks villages to compete to raise the most money for the St Dunstan’s charity (now Blind Veterans UK), and he used the wealth accumulated from bait sales to try to make a difference to people’s lives. In 1942, for example, he offered to donate eight houses to Bucks County Council in order to provide rent-free accommodation for people struggling to subsist (the council refused) and he was renowned for never claiming any expenses for local government work. So perhaps it is possible for politicians, like maggots, to have their positive side. The maggots of the future? In 2007, Milton Wainwright, Amar Laswd and Sulaiman Alharbi of the University of Sheffield showed that gases produced by blue blowfly larvae on beef heart inhibited the growth of Mycobacterium phlei (which served as a model for the more dangerous Mycobacterium tuberculosis). A simulated version of the maggot gas, comprising di- and trimethylamine and ammonia, had a similar effect, as did ammonia vapour alone. Wainwright et al. did not rule out the possibility that Bryant’s Maggotorium had successfully treated TB patients – and, given the increasing resistance of the TB bacillus to antibiotic drugs, they suggested that ‘perhaps we may not have seen the last of maggot inhalation therapy.’ It’s unlikely that future patients would have to sit in a shed next to a trough of rotten horse meat, but if research does end up producing an effective TB treatment based on the gaseous emissions of maggots, we could one day benefit from the legacy of The Maggot King. Sources: ‘Is there anything in it?’, Yorkshire Evening Post, 12 July 1911 ‘A novel proposal of the Bradford Maggotorium’, Yorkshire Evening Post, 22 July 1911 ‘The Maggot Cure for Consumption’, Chemist and Druggist, 5 August 1911 ‘Bradford Maggotorium’, Yorkshire Evening Post, 9 September 1911 ‘Maggot Factory: P'''
