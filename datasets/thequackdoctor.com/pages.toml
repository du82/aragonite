["https://thequackdoctor.com/index.php/the-intangible-power-that-controls-human-destiny"]
title = "The intangible power that controls human destiny | The Quack Doctor"
description = "History's medical advertisers and their remedies"
full_description = '<img decoding="async" class="ngg-singlepic ngg-left alignleft" title="ADvent Calendar Day 8" src="https://thequackdoctor.com/wp-content/gallery/advent-calendar/8.jpg" alt="ADvent Calendar Day 8" width="140" height="140" data-eio="l"> ADvent Calendar Day 8 The marvellous book on offer from the New York Institute of Science in the first decade of the twentieth century was called The Philosophy of Influence, and promised ‘The secret of power, the science of health. Life’s mysteries unveiled.’ One would have to wait a little longer to unveil them, however, for the free book was mainly an advertisement for a $5 (reduced from $25!) correspondence course in ‘Personal Magnetism, Hypnotism, Mesmerism, Magnetic Healing, Suggestive Therapeutics, Psycho-therapeutics, Self-development, Development of the Will, Success-thought, Etc., Etc.‘ taught by Dr Xenophon La Motte Sage (not his real name). <img fetchpriority="high" decoding="async" data-attachment-id="6167" data-permalink="https://thequackdoctor.com/index.php/the-intangible-power-that-controls-human-destiny/personal-magnetism-advertisement-from-new-york-institute-of-science-c-1900-1910/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910.jpg" data-orig-size="1104,880" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Personal Magnetism advertisement from New York Institute of Science, c1900-1910" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-300x239.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-1024x816.jpg" class="aligncenter wp-image-6167" title="Personal Magnetism advertisement from New York Institute of Science, c1900-1910" src="https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910.jpg" alt="Personal Magnetism advertisement from New York Institute of Science, c1900-1910" width="618" height="493" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910.jpg 1104w, https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-300x239.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-768x612.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-1024x816.jpg 1024w, https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-696x555.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-1068x851.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2013/12/Personal-Magnetism-advertisement-from-New-York-Institute-of-Science-c-1900-1910-527x420.jpg 527w" sizes="(max-width: 618px) 100vw, 618px" data-eio="l" /> The course involved repeating affirmations such as ‘my will-power is strong; no one can resist my influence,‘ and was supposed to enable the recipient to hypnotise people suddenly and without their consent. One advert said of a successful participant: ‘He also hypnotised an aged gentleman, and had him run through the streets shouting “Red-hot peanuts for sale”.’'
