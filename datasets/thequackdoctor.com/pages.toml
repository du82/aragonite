title = "Terradermalax - a skin laxative | The Quack Doctor"
description = "This 1920s beauty product promised that even women over 30 could look good!"
full_description = '<img fetchpriority="high" decoding="async" data-attachment-id="4451" data-permalink="https://thequackdoctor.com/index.php/terradermalax-a-skin-laxative/terradermalax-pittsburgh-press-11-march-1923/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923.jpg" data-orig-size="474,770" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="terradermalax pittsburgh press 11 March 1923" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923-185x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923.jpg" class="aligncenter size-full wp-image-4451" title="terradermalax pittsburgh press 11 March 1923" src="https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923.jpg" alt="Terra-derma-lax advert, 1923" width="474" height="770" srcset="https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923.jpg 474w, https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923-185x300.jpg 185w, https://thequackdoctor.com/wp-content/uploads/2010/10/terradermalax-pittsburgh-press-11-March-1923-259x420.jpg 259w" sizes="(max-width: 474px) 100vw, 474px" data-eio="l" /> Source: The Pittsburgh Press, 11 March 1923 . . Why, when a woman is 30, do her blushes no longer show? How does a skin grow dull and unlovely while the eyes are still clear and sparkling? Science has learned the reason, and – glorious news! – a painless, pleasant way to correct it in 60 minutes! Count this faded 30-something in! The above quotation is from a full-page advertorial in the Pittsburgh Press, 9 April 1922. The ad was presented as a journalistic report by one William R Durgin, who had supposedly investigated the new miracle product and verified the manufacturer’s claims. Terradermalax, as it was originally called before the hyphens were added in 1923, was described as a ‘laxative’ for the face – the idea was that it caused the skin to expel all its waste products, clearing the pores of impurities and leaving the complexion as smooth as a child’s. The product name was not just a brand, either – it was presented as the scientific term for the ‘element’ discovered by young English chemist M. J. McGowan. In a precursor to our modern ‘here comes the science bit’, Durgin revealed that the cause of a dull complexion was occlusia (clogged pores) and he used the following rather vague before-and-after picture to show how Terradermalax transformed the skin. <img decoding="async" data-attachment-id="4452" data-permalink="https://thequackdoctor.com/index.php/terradermalax-a-skin-laxative/tdl-microscope-slide/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide.jpg" data-orig-size="588,422" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="tdl microscope slide" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide-300x215.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide.jpg" class="aligncenter size-full wp-image-4452" title="tdl microscope slide" src="https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide.jpg" alt="Terradermalax microscope slide" width="470" height="338" srcset="https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide.jpg 588w, https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide-300x215.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2010/10/tdl-microscope-slide-585x420.jpg 585w" sizes="(max-width: 470px) 100vw, 470px" data-eio="l" /> Oddly, he says ‘this reproduction of a microscopic slide shows the same skin before and after the first application.’ Did the person squeeze their whole face onto a microscope slide, or did someone cut a piece off, examine it, stick it back on for the treatment and then remove it again? Some ads showed the inventor contemplating his discovery in a dramatic ‘Look, I’m a scientist!’ pose. The writers of the Annual Reports of the Chemical Laboratory of the American Medical Association (1923) compared him to the comedian Harold Lloyd, whose film, Safety Last! came out that year. <img decoding="async" data-attachment-id="4453" data-permalink="https://thequackdoctor.com/index.php/terradermalax-a-skin-laxative/mj-mcgowan-annual-reports-1923/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923.jpg" data-orig-size="654,722" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="mj mcgowan annual reports 1923" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923-272x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923.jpg" class="aligncenter size-full wp-image-4453" title="mj mcgowan annual reports 1923" src="https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923.jpg" alt="M J McGowan, inventor of Terradermalax" width="523" height="578" srcset="https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923.jpg 654w, https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923-272x300.jpg 272w, https://thequackdoctor.com/wp-content/uploads/2010/10/mj-mcgowan-annual-reports-1923-380x420.jpg 380w" sizes="(max-width: 523px) 100vw, 523px" data-eio="l" /> The 1922 advertorial stated that McGowan was 31 years old, but had 10 years’ experience as a dermatologist. Annual Reports claimed that he worked ‘in a subordinate capacity in the soap and fertiliser departments of the Chicago stockyards.’ The product’s composition didn’t hold any surprises – the A.M.A.’s analysis showed it to be clay and water, much like other face masks of the time. Where it fell into the realms of quackery was in the claims about miraculous effects and the idea that McGowan had discovered a mysterious new substance. Anyone could buy some kaolin cheaply from a chemist’s shop and make a similar mixture that would have a cleansing effect and give them the chance to sit down and relax for a while – but this wouldn’t have the psychological boost of treating oneself to a potentially miraculous product. As Annual Reports said: The only thing you will lack is the mental uplift produced by reading the ineffable bosh published by the complexion clay exploiters. . .'
