title = "A devil of a cure | The Quack Doctor"
description = "A company in early 20th-century Kansas named their constipation medicine after an unlikely figure. Satan."
full_description = 'One must always be grateful for small mercies. When a giant jazz-hands Satan is trampling amok on your planet of residence, you can at least gain comfort from the fact he has kept his underpants on. Photo: Jonathan Brown This depiction of Old Nick was registered as a trademark in 1915 by the Sa-Tan-Ic Medicine and Manufacturing Company of Wichita, Kansas. Their products were not especially out of the ordinary, but the name and logo make for some interesting advertising and packaging. <img decoding="async" data-attachment-id="6549" data-permalink="https://thequackdoctor.com/index.php/a-devil-of-a-cure/sa-tan-ic-the_beaver_herald_thu__dec_31__1914_/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_.jpg" data-orig-size="2122,1318" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Sa-tan-ic advertised in The Beaver Herald (OK) Dec 31 1914." data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-300x186.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-1024x636.jpg" class="wp-image-6549 size-medium" src="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-300x186.jpg" alt="Sa-tan-ic advertised in The Beaver Herald (OK) Dec 31 1914." width="300" height="186" srcset="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-300x186.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-768x477.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-1024x636.jpg 1024w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-356x220.jpg 356w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-696x432.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-1068x663.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-676x420.jpg 676w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-The_Beaver_Herald_Thu__Dec_31__1914_-1920x1193.jpg 1920w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" />The Beaver Herald, 31 Dec 1914. Advertisements for Sa-Tan-Ic appeared in the Kansas and Oklahoma papers during 1914, featuring a silhouetted figure in what appears to be more stylish attire (left, from www.newspapers.com). With the advent of the new trademark, however, the Prince of Darkness slipped into something more comfortable and would continue to treat customers to a view of his majestic winceyette for many years to come. The Sa-Tan-Ic range included at least three medical products and some general industrial/household goods such as Sa-Tan-Ic Cleaner, a vegetable-oil-based cleanser designed for people working in grimy environments. Railway mechanics, blacksmiths and house painters were assured that it would remove paint and grease without chapping their hands. It could also be used for face massage and for shampooing the hair. Another product, Sa-Tan-Ic Gas Saver, was a petrol additive offering to cut motorists’ fuel bills in half, to give cars more power and speed, and to increase mileage by up to 40%. <img decoding="async" data-attachment-id="6546" data-permalink="https://thequackdoctor.com/index.php/a-devil-of-a-cure/sa-tan-ic-tonic-laxative-jonathan-brown-flickr/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr.jpg" data-orig-size="712,2057" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Sa-tan-ic tonic laxative &#8211; Jonathan Brown flickr" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-104x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-354x1024.jpg" class="wp-image-6546 size-large" src="https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-354x1024.jpg" alt="Sa-tan-ic tonic laxative photo by Jonathan Brown " width="354" height="1024" srcset="https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-354x1024.jpg 354w, https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-104x300.jpg 104w, https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-696x2011.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr-145x420.jpg 145w, https://thequackdoctor.com/wp-content/uploads/2014/09/Sa-tan-ic-tonic-laxative-Jonathan-Brown-flickr.jpg 712w" sizes="(max-width: 354px) 100vw, 354px" data-eio="l" />Photo: Jonathan Brown Leading the medical side of the range was the Sa-Tan-Ic Tonic Laxative, also known simply as ‘Sa-Tan-Ic’, which took as its starting point the notion that ‘constipation is the cause of ninety percent of all diseases in man, women and children.’ Keeping the bowels regular would sort out most other health problems, both physical and mental. Advertisements promised that Sa-Tan-Ic would bring mental sunshine, prevent a lazy liver from going on strike, and act like an ‘energy gland’ transplanted into the body to restore the vigour of youth. <img decoding="async" data-attachment-id="6544" data-permalink="https://thequackdoctor.com/index.php/a-devil-of-a-cure/sa-tan-ic-hutchinson-news-04031920/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920.jpg" data-orig-size="682,662" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Sa-tan-ic &#8211; Hutchinson News 04031920" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920-300x291.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920.jpg" class="wp-image-6544 size-full" src="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920.jpg" alt="Sa-tan-ic - Hutchinson News 04031920" width="682" height="662" srcset="https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920.jpg 682w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920-300x291.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/09/sa-tan-ic-Hutchinson-News-04031920-433x420.jpg 433w" sizes="(max-width: 682px) 100vw, 682px" data-eio="l" />Advertisement from the Hutchinson News, Kansas, 4 March 1920. www.newspaperarchive.com The Tonic Laxative was analysed as part of an FDA investigation into some shipments sent to Missouri in 1920 and 1921. The Bureau of Chemistry’s analysts concluded that it contained magnesium sulphate, cascara bark extract, salicylic acid, methyl salicylate, peppermint oil, water and a trace of alcohol. The proportions aren’t given in the report, but as methyl salicylate is toxic in high doses, this was presumably a small amount. Hearings for misbranding under the Food and Drugs Act did not set out to ban products, comment on their overall effectiveness or decree that they were A Bad Thing. It was all about whether the claims on the packaging properly represented whatever was inside. So, while the herbal and salicylate ingredients would provide a laxative and pain-relieving effect, the claims that they could cure appendicitis and asthma – along with most other things – were a bit over the top. After paying $800 in costs and bonds, the company was free to continue selling the product, provided they were more circumspect in their marketing statements. <img decoding="async" data-attachment-id="6545" data-permalink="https://thequackdoctor.com/index.php/a-devil-of-a-cure/satanic-liniment-c-1920-via-vintagecocobythelake/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake.jpg" data-orig-size="570,760" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="satanic liniment c 1920 via vintagecocobythelake" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake-225x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake.jpg" class="wp-image-6545 size-full" src="https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake.jpg" alt="Satanic liniment c 1920 via Vintagecocobythelake" width="570" height="760" srcset="https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake.jpg 570w, https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake-225x300.jpg 225w, https://thequackdoctor.com/wp-content/uploads/2014/09/satanic-liniment-c-1920-via-vintagecocobythelake-315x420.jpg 315w" sizes="(max-width: 570px) 100vw, 570px" data-eio="l" />Photo: VintageCocoByTheLake on Etsy Another member of the Sa-Tan-Ic range was a liniment advertised as good for man or beast. This bottle, sold on Etsy by VintageCocoByTheLake, is part full with a substance that she describes as still smelling strong and nasty! The listed ingredients show that it was a typical capsaicin muscle rub, a product that fits nicely with the fiery attributes of the brand. It was used for aches, bruises, sprains, neuralgia and toothache. The ointment pictured below (sold by BandSBargains) appears to have been a more refreshingly scented treatment for colds and skin conditions. The directions on the back of the tin state: For relieving head cold symptoms, drop a small portion in boiling water, and inhale fumes. For relief of cuts, burns, skin irritation and itching of piles. Apply with fingertips twice daily to affected parts. If you could shrug off the theological discomfort of anointing your bottom with the unguent of Satan, you stood a reasonable chance of obtaining the desired relief. <img decoding="async" data-attachment-id="6547" data-permalink="https://thequackdoctor.com/index.php/a-devil-of-a-cure/satanic-ointment-arcane-images-tumblr/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr.jpg" data-orig-size="1068,1078" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Satanic Ointment &#8211; arcane images tumblr" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-297x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-1015x1024.jpg" class="wp-image-6547" src="https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-297x300.jpg" alt="Sa-tan-ic Ointment " width="468" height="473" srcset="https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-297x300.jpg 297w, https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-768x775.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-1015x1024.jpg 1015w, https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-696x703.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2014/09/Satanic-Ointment-arcane-images-tumblr-416x420.jpg 416w" sizes="(max-width: 468px) 100vw, 468px" data-eio="l" />Photo: BandSBargains on Etsy <img decoding="async" src="https://www.awin1.com/cshow.php?s=265087&amp;v=2102&amp;q=83048&amp;r=531859" border="0" data-eio="l" /> Sources: The Beaver Herald, Oklahoma, 31 December 1914 The Wichita Daily Eagle Sun, 25 June 1915 The Hutchinson News, Kansas, 4 March 1920 The Fort Scott Daily Tribune and Fort Scott Daily Monitor, Kansas, 26 February 1920 The Coffeyville Daily Journal, Kansas, 11 November 1919 Notice of Judgment case 9659. Misbranding of Sa-Tan-ic. US vs 113 bottles of Sa-Tan-Ic et. al. Images from Jonathan Brown (Mondo Tiki Man) on Flickr, VintageCocoByTheLake on Etsy, BandSBargains on Etsy, Newspaper Archive and Newspapers.com. Victorian hand from The Graphics Fairy.'
