["https://thequackdoctor.com/index.php/guest-post-englands-only-female-doctor"]
title = "England's 'only female doctor'? | The Quack Doctor"
description = "In this guest post for The Quack Doctor, Roger Cavania Sanders introduces the fascinating career of his great aunt, who practised as 'Mademoiselle Cavania' in the 1860s."
full_description = 'David and Esther von Cavania practised as doctors in the 1870s, selling a remedy called the Wonder-Worker Lotion. Roger Cavania Sanders tells us more about his great aunt, Mademoiselle Cavania. Esther Jane Neumane. Photo courtesy of Roger Cavania Sanders Esther Jane Neumane was born in 1843. Her father was David Brown von Cavania, who was convicted at Leeds Magistrates’ Court in 1876 effectively of being a ‘quack’ doctor. The first mention of Esther’s profession is in an advertisement in the Leeds Times in 1861 where she is referred to as Mademoiselle Cavania, alongside her father, ‘Professor Cavania’. Both claimed to be members of the Eclectic Reformed College. By 1865, in the Manchester Times, Esther has become ‘Madame Cavania Newmane’ (note the difference in spelling from her actual married name), who is ‘Professor of Medicine for Diseases of Women and Children’ and ‘Member of the Eclectic Reformed College of Physicians, New York, U.S., America.’ The advert also states: ‘Diploma granted 12th day of January 1860.’ Note that Esther was born in April 1843, so the diploma was granted when she was still aged 16! It is known that in England some degrees were granted to the self-taught and tutored, and doubtless Esther would have received help from her father, but this seems ridiculously young. This advertisement, like most others, continues with outlandish claims for cures of cancers, tumours, consumption, scrofula, etc. <img decoding="async" data-attachment-id="6378" data-permalink="https://thequackdoctor.com/index.php/guest-post-englands-only-female-doctor/cavania-manchester-times-14-jan-1865/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865.jpg" data-orig-size="467,487" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Madame Cavania Newmane" data-image-description="" data-image-caption="&lt;p&gt;The Manchester Times, 14 January 1865&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865-288x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865.jpg" class="size-full wp-image-6378" src="https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865.jpg" alt="Madame Cavania Newmane" width="467" height="487" srcset="https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865.jpg 467w, https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865-288x300.jpg 288w, https://thequackdoctor.com/wp-content/uploads/2014/02/Cavania-Manchester-Times-14-Jan-1865-403x420.jpg 403w" sizes="(max-width: 467px) 100vw, 467px" data-eio="l" />The Manchester Times, 14 January 1865 By September 1865, Esther is claiming to be ‘New Doctress by Diploma’, also in the Manchester Times. Further, in the Sheffield and Rotherham Independent, her advertisement states ‘Mademoiselle Cavania, the only female Doctor, who has stretched forth her hands for the good of her fellow creatures’. The woman must have been a saint! <img decoding="async" data-attachment-id="6382" data-permalink="https://thequackdoctor.com/index.php/guest-post-englands-only-female-doctor/cavania-sheffield-and-rotherham-independent-28-sept-1865/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865.jpg" data-orig-size="536,374" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Cavania &#8211; sheffield and rotherham independent 28 sept 1865" data-image-description="" data-image-caption="&lt;p&gt;Advertisement excerpt from the Sheffield and Rotherham Independent, 28 Sept 1865&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865-300x209.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865.jpg" class="size-full wp-image-6382" src="https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865.jpg" alt="Cavania - sheffield and rotherham independent 28 sept 1865" width="536" height="374" srcset="https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865.jpg 536w, https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865-300x209.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865-100x70.jpg 100w, https://thequackdoctor.com/wp-content/uploads/2014/02/cavania-sheffield-and-rotherham-independent-28-sept-1865-534x374.jpg 534w" sizes="(max-width: 536px) 100vw, 536px" data-eio="l" />Advertisement excerpt from the Sheffield and Rotherham Independent, 28 Sept 1865 The Eclectic Reformed College in New York certainly did exist and was accepting women in 1860. The Eclectic movement itself was a sincere one that tried to treat the person as a whole and to use traditional remedies and homeopathy to effect cures. At one time there were 20,000 eclectic medical practitioners in America, but they faced increasingly strong opposition from more conventional practitioners and were eventually pushed to the margins. This pattern was repeated in England and Esther’s father was subject to a police ‘sting’ operation to bring him to the court in Leeds in 1876, where his American diplomas were discounted. Esther was referred to at the trial but not herself charged. <img decoding="async" data-attachment-id="6374" data-permalink="https://thequackdoctor.com/index.php/guest-post-englands-only-female-doctor/david-brown-von-cavania/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/02/David-Brown-von-Cavania.jpg" data-orig-size="1642,2326" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="David Brown von Cavania" data-image-description="" data-image-caption="&lt;p&gt;David Brown von Cavania&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/02/David-Brown-von-Cavania-212x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/02/David-Brown-von-Cavania-723x1024.jpg" class=" wp-image-6374 " title="David Brown von Cavania" src="https://thequackdoctor.com/wp-content/uploads/2014/02/David-Brown-von-Cavania-211x300.jpg" alt="David Brown von Cavania" width="309" height="440" data-eio="l" />David Brown von Cavania. Photo courtesy of Roger Cavania Sanders. Esther and her father jointly ran a patent medicine business, offering ‘Cavania’s Abyssinian Liver and Nervine Pills’ and other lotions, examples of which are in the museum of the Royal Pharmaceutical Society in London. The borough analyst at the Leeds trial confirmed that they contained nothing that could harm anyone. Esther continued to advertise the products for many years after her father’s death in 1886. Elizabeth Blackwell, the first woman to receive an MD from an American medical school, was already listed on the GMC’s Medical Register by the time Esther began practising, but was not permanently based in the UK. Elizabeth Garrett, too, became qualified to practise medicine in England as a licentiate of the Society of Apothecaries. (Interestingly, Garrett took her examination on 28 September 1865 – the very date of one of the adverts pictured above!) It would be another five years, however, before a medical degree was awarded to a British woman on this side of the Atlantic, when Frances Hoggan qualified at the University of Zurich in 1870. Whether Esther Jane’s claim to qualification is valid can be argued either way. The Eclectic Reformed College admitted women students from 1850 onwards and was part of a respectable, if perhaps ill-informed, movement in medical knowledge. Esther is very specific about the date of her diploma and advertises its existence in a widely read newspaper. However, some 26 years later a court refused to accept the validity of her father’s similar American diploma, and one has to have serious doubts about a sixteen-year-old receiving such an award, however achieved, even in America, and even with considerable help from her ‘qualified’ father. The outlandish claims for cures made in advertisements only increase one’s doubts. Sadly her effects, including any diploma, were not handed down within the family so we shall never know whether the diploma really existed. David Brown (von Cavania) was my great grandfather, and Esther therefore my great aunt. Roger Cavania Sanders'
