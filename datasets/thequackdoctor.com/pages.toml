full_description = '''<img decoding="async" class="ngg-singlepic ngg-left alignleft" title="ADvent Calendar Day 4" alt="ADvent Calendar Day 4" src="https://thequackdoctor.com/wp-content/gallery/advent-calendar/4.jpg" width="140" height="140" data-eio="l" /> ADvent Calendar Day 4 ‘It has often been observed by experienced elders, that since it became the fashion for babies to discard caps, protruding ears are but too common. They are very ugly, and the ear-cap just invented is a safe preventive, without the heat that made the cap objectionable.’ (Northampton Mercury, 17 April 1891) The inventor was the artist Adelaide Claxton, who patented the ear cap in both the UK and the US. A delicate web of ribbons, it was designed to prevent babies’ ears from getting pushed forward as they moved their heads in their sleep. <img fetchpriority="high" decoding="async" data-attachment-id="6133" data-permalink="https://thequackdoctor.com/index.php/claxtons-patent-ear-cap/ear-cap/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap.jpg" data-orig-size="2397,999" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Claxton&#8217;s Patent Ear Cap" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-300x125.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-1024x427.jpg" class="wp-image-6133 aligncenter" title="Claxton's Patent Ear Cap" alt="Claxton's Patent Ear Cap" src="https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap.jpg" width="635" height="264" srcset="https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap.jpg 2397w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-300x125.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-768x320.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-1024x427.jpg 1024w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-696x290.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-1068x445.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-1008x420.jpg 1008w, https://thequackdoctor.com/wp-content/uploads/2013/12/ear-cap-1920x800.jpg 1920w" sizes="(max-width: 635px) 100vw, 635px" data-eio="l" /> This ad is from the Chemist & Druggist in the 1890s, but I confess that I am presently unable to ascertain the whereabouts of the notebook in which I wrote down the issue date. In 1903, Claxton patented an improved version of the cap, with a piece of fine netting to cover each ear. An example of this later design has previously been on display in the Wellcome Collection’s Medicine Man exhibition and you can find some pictures of it on the Science Museum’s website. .'''
