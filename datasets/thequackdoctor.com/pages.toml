["https://thequackdoctor.com/index.php/detective-caminada-and-the-quack-doctors"]
title = "Detective Caminada and the quack doctors | The Quack Doctor"
description = "In this guest post, Angela Buckley, author of The Real Sherlock Holmes, relates Detective Jerome Caminada's encounter with an ecclesiastical con artist in 1870s Manchester."
full_description = 'Dr <img decoding="async" data-attachment-id="6459" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/guest-post-label/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-orig-size="250,172" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Guest post" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" class="alignleft wp-image-6459" src="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" alt="Guest post" width="154" height="108" data-eio="l" />Angela Buckley’s book, The Real Sherlock Holmes: The Hidden Story of Jerome Caminada, tells the story of a real-life Victorian supersleuth. In this guest post, Angela relates Caminada’s encounter with an ecclesiastical con merchant touting a dodgy elixir. . Urban life in Victorian England was precarious enough, but in Manchester it was downright deadly. Poor housing, inadequate water supplies and a lack of sanitation posed major hazards for city-dwellers. Killer diseases, such as typhus, influenza and cholera rampaged through the tightly packed tenements, bringing illness and death to thousands. In 1842, just two years before the birth of Detective Jerome Caminada of the Manchester City Police Force, the life expectancy of the average worker was just 18 years. <img fetchpriority="high" decoding="async" data-attachment-id="6670" data-permalink="https://thequackdoctor.com/index.php/detective-caminada-and-the-quack-doctors/jerome-caminada/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada.jpg" data-orig-size="1800,2400" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Jerome Caminada" data-image-description="" data-image-caption="&lt;p&gt;Jerome Caminada&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-225x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-768x1024.jpg" class="size-medium wp-image-6670" src="https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-225x300.jpg" alt="Jerome Caminada" width="225" height="300" srcset="https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-225x300.jpg 225w, https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-768x1024.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-696x928.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-1068x1424.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada-315x420.jpg 315w, https://thequackdoctor.com/wp-content/uploads/2014/11/Jerome-Caminada.jpg 1800w" sizes="(max-width: 225px) 100vw, 225px" data-eio="l" />Jerome Caminada It is not surprising that people were worried about their health and, regardless of their social status, the citizens of Victorian Manchester were in a near-constant panic; a phenomenon that Detective Caminada encountered by chance one Saturday evening, on this way back from work. He was heading for home, when he popped into a pawnbroker’s shop for a quick gossip. The manager and his assistant were poring over some prints on the counter in the presence of a young man, who looked decidedly peaky. His face was cadaverous, his body shrunken and his eyes were large with fever. Suspicious of the provenance of the prints, Caminada searched the man’s lodgings and was astonished to find 153 bottles, most of which contained medicines and lotions; the desperate thief was in the grips of a quack doctor. During the nineteenth century, the dubious trade of quack doctors flourished in Manchester. These expert swindlers were keen to exploit the fears of a public fully aware of their likely mortality. They ran their businesses from expensive properties on the fashionable boulevards, with handsomely furnished offices and plush waiting rooms. Their advertisements and pamphlets flooded the city, enticing passersby with their treatments for all manner of ailments. Inspired by the pitiful story of the young man, Detective Caminada set out on a quest to put an end to these ‘bloodsuckers of the human race’. In disguise, usually as a travelling salesman or a factory worker, the undercover detective visited the premises of a number of suspects, feigning conditions, such as deafness, sweating hands and a pain in his heart. He also had concoctions mixed at the druggist’s to simulate urine samples. Invariably the ‘doctors’ offered a miracle cure at an exorbitant price, which Caminada would prove to be fake. Detective Caminada was singlehandedly responsible for the successful conviction of at least a dozen charlatans, but there was one accomplished swindler who would prove to be more than his match. <img decoding="async" data-attachment-id="6673" data-permalink="https://thequackdoctor.com/index.php/detective-caminada-and-the-quack-doctors/silverton-advert/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Silverton-Advert.png" data-orig-size="868,451" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Silverton advert" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Silverton-Advert-300x156.png" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Silverton-Advert.png" class="aligncenter wp-image-6673" src="https://thequackdoctor.com/wp-content/uploads/2014/11/Silverton-Advert.png" alt="Silverton Advert" width="568" height="375" data-eio="l" /> In 1877, Detective Caminada spotted an advertisement for the ‘Food of Foods’; a medicine sold by the Reverend E. J. Silverton, a Baptist minister from Nottingham. The remedy had apparently performed miracles for a variety of illnesses and was particularly effective in curing deafness. When Silverton came to Manchester, Caminada went to see the famous doctor for a consultation, dressed in shabby clothing and affecting a limp. Unfortunately Silverton wasn’t available, but the detective bought some tonic from his assistant, at a price of 35 shillings – double the average worker’s weekly wages. On analysis, the concoction proved to be nothing more than lentils, bran, brown flour and water; the ‘Elixir of all Diseases’ was a sham. Despite being arrested, the Reverend Mr Silverton slipped the net, due to legal technicalities, and continued his dishonest practice for another 20 years until his death. <img decoding="async" data-attachment-id="6672" data-permalink="https://thequackdoctor.com/index.php/detective-caminada-and-the-quack-doctors/rev-silverton/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Rev-Silverton.jpeg" data-orig-size="585,706" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;C7200 series&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Rev E J Silverton" data-image-description="" data-image-caption="&lt;p&gt;Rev E J Silverton&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Rev-Silverton-249x300.jpeg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/11/Rev-Silverton.jpeg" class=" wp-image-6672" src="https://thequackdoctor.com/wp-content/uploads/2014/11/Rev-Silverton.jpeg" alt="Rev E J Silverton" width="432" height="538" data-eio="l" />Rev E J Silverton Fortunately, as the conditions improved during the latter half of the nineteenth century, the need for the nefarious ministrations of the quack doctors declined. However, there were many other ruthless con artists on the streets of Manchester, as well as a ready supply of desperate victims, to keep Detective Caminada busy. <img decoding="async" data-attachment-id="6674" data-permalink="https://thequackdoctor.com/index.php/detective-caminada-and-the-quack-doctors/the-real-sherlock-holmes-cover/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/11/The-Real-Sherlock-Holmes-cover.jpeg" data-orig-size="1900,2831" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="The Real Sherlock Holmes cover" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/11/The-Real-Sherlock-Holmes-cover-201x300.jpeg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/11/The-Real-Sherlock-Holmes-cover-687x1024.jpeg" class="alignleft wp-image-6674" src="https://thequackdoctor.com/wp-content/uploads/2014/11/The-Real-Sherlock-Holmes-cover-201x300.jpeg" alt="The Real Sherlock Holmes cover" width="173" height="264" data-eio="l" />The Real Sherlock Holmes: The Hidden Story of Jerome Caminada, published by Pen and Sword Books, is now available as an ebook. For more stories of Victorian crime visit Angela’s website at www.victoriansupersleuth.com and her Sleuthing Adventures substack.'
