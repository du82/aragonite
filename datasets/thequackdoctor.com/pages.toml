full_description = 'The Quack Doctor website started in 2009 and looks at the history of advertised health products (which might or might not have been considered ‘quackery’ in their time), health fraudsters and any out-of-the-ordinary medical happenings. <img fetchpriority="high" decoding="async" data-attachment-id="7280" data-permalink="https://thequackdoctor.com/index.php/about-2/caroline-rance-2018/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018.jpg" data-orig-size="944,1322" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;3.3&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;DMC-TZ60&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;1529503353&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;4.3&quot;,&quot;iso&quot;:&quot;400&quot;,&quot;shutter_speed&quot;:&quot;0.16666666666667&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Caroline Rance 2018" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-214x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-731x1024.jpg" class="alignleft size-medium wp-image-7280" src="https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-214x300.jpg" alt="" width="214" height="300" srcset="https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-214x300.jpg 214w, https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-768x1076.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-731x1024.jpg 731w, https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-696x975.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018-300x420.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2018/10/Caroline-Rance-2018.jpg 944w" sizes="(max-width: 214px) 100vw, 214px" data-eio="l" />The site belongs to Caroline Rance, the author of Kill-Grief (2009), The Quack Doctor: Historical Remedies for All Your Ills (2013) and The History of Medicine in 100 Facts (2015). Caroline regularly gives talks on the history of medicine and her previous speaking engagements include the Wellcome Library, The Old Operating Theatre Museum, The Thackray Museum, Southwark Cathedral Library, Benjamin Franklin House, Salon for the City, Arnos Vale Cemetery, Edinburgh Skeptics at the Fringe and the QED Conference. She has also appeared on the BBC’s Great British Railway Journeys and series 2 of A House Through Time. To get in touch, please email: caroline@thequackdoctor.com Please do not ask for valuations of historical items as this is not The Quack Doctor’s area of expertise. Thank you. .ThThe'
