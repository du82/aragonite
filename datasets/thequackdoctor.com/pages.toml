["https://thequackdoctor.com/index.php/notorious-chrimes-the-blackmail-pills"]
title = "Notorious Chrimes: The Blackmail Pills | The Quack Doctor"
description = "In 1890s London, the 'Lady Montrose Pills' blackmail scheme efficiently and heartlessly targeted more than 8,000 victims."
full_description = '''<img decoding="async" data-attachment-id="6459" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/guest-post-label/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-orig-size="250,172" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Guest post" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" class="wp-image-6459 alignleft" src="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" alt="Guest post" width="191" height="131" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg 250w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-100x70.jpg 100w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-218x150.jpg 218w" sizes="(max-width: 191px) 100vw, 191px" data-eio="l" /> In 1890s London, the ‘Lady Montrose Pills’ blackmail scheme efficiently and heartlessly targeted more than 8,000 victims. In this comprehensive account of the case, Dick Weindling introduces the Chrimes brothers, who manufactured this audacious scam. In April 1896 adverts began to appear in newspapers across the country. Addressed to ‘Ladies Only’, the advertisement promoted ‘Lady Montrose’s Miraculous Female Medicinal Tabules’, which would positively cure the most ‘Obstinate Obstructions’. People who read the advert knew it referred to abortions, which were illegal at the time. By sending 4s 6d (today worth about £24), ladies would receive the box of tabules (tablets), as well as a written guarantee to cure. They were assured that ‘failure is absolutely impossible’, and the advert included testimonials from satisfied customers. The advert was successful, and over the next two years about 12,000 women sent postal orders for the pills to 64 Imperial Buildings, Ludgate Circus. The men behind the advert were the Chrimes brothers, Richard, Edward and Leonard, but they all used aliases. The pills had no effect and did not remove the obstruction. The Chrimes brothers had carefully worked out the scam, and the women were even sent a second letter from another address (7 Pleydell Street, near Fleet Street), for Panolia Electric Blue Pills at either 3s 6d, 11s or 22 shillings for a box of extra strength. This used ‘knocking copy’ and said that Lady Montrose’s Tabules and any other advertised product, was not as effective as the Panolia Pills. These were so powerful they could not be advertised for fear of prosecution, and were only known by ladies telling other ladies. <img fetchpriority="high" decoding="async" data-attachment-id="6935" data-permalink="https://thequackdoctor.com/index.php/notorious-chrimes-the-blackmail-pills/lady-montrose-advert-24-april-1897/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897.jpg" data-orig-size="458,791" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Lady Montrose advert, 24 April 1897" data-image-description="" data-image-caption="&lt;p&gt;Lady Montrose advert, 24 April 1897&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897-174x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897.jpg" class="size-full wp-image-6935" src="https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897.jpg" alt="Lady Montrose advert, 24 April 1897" width="458" height="791" srcset="https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897.jpg 458w, https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897-174x300.jpg 174w, https://thequackdoctor.com/wp-content/uploads/2017/05/Lady-Montrose-advert-24-April-1897-243x420.jpg 243w" sizes="(max-width: 458px) 100vw, 458px" data-eio="l" />Lady Montrose advert, 24 April 1897 The blackmail scheme After about two years an even more devious idea was developed. In September 1898 the brothers had the names and addresses of thousands of women and they realised they could make a large amount of money by sending them a letter threatening to expose the women for attempting the criminal act of abortion. Unless the women sent two guineas to Trafalgar Buildings in Northumberland Avenue, they would immediately be arrested. <img decoding="async" data-attachment-id="6936" data-permalink="https://thequackdoctor.com/index.php/notorious-chrimes-the-blackmail-pills/threatening-letter/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter.jpg" data-orig-size="800,803" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Threatening letter" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter-300x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter.jpg" class="alignright size-full wp-image-6936" src="https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter.jpg" alt="Threatening letter sent under the alias 'Charles J Mitchell'" width="800" height="803" srcset="https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter.jpg 800w, https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter-150x150.jpg 150w, https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter-300x300.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter-768x771.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter-696x699.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2017/05/Threatening-letter-418x420.jpg 418w" sizes="(max-width: 800px) 100vw, 800px" data-eio="l" /> The scale of the blackmail was astonishing and required meticulous planning. On 14 September they advertised for a junior clerk and appointed young Norman Gibson, who lived with his parents at ‘The Briars’, Forest Gate. He started work on 26 September at a salary of 18s a week. A printing company was sent an order to make the circulars so that they did not contain any handwriting. Then another specialist company was sent 8,000 names and addresses to produce the addressed envelopes, and a large amount of stamps were bought from the Ludgate Circus post office. On 12 September they had purchased a Gestetner cyclostyle machine (an early duplicating machine), for £4 16s to make the circulars on the printed letters. The huge mailing went out on 7 October 1898 and the letters arrived the next day. One was addressed to Mrs Kate Clifford at 18 King Street, Snow Hill. Her husband, who was a warehouseman, opened the letter and was shocked at what he read. He immediately took it to the nearby City Police station at Snow Hill. Detective Inspector Waldock read the letter and soon began to receive other similar complaints. Realising the large number of letters involved, he contacted Detective Inspector Richards at Scotland Yard and Detective Inspector Davison of the City Police. Davidson and his men made enquires at the various addresses to discover who had set up the blackmail plot. They discovered that three men carried on business at 64 Imperial Buildings as advertising agents in the name of Montrose. The men did not spend much time at the office, and the address was chosen because it had a particularly large letterbox. The mail was collected and taken to another address at Ludgate Hill. When the police went to 73 Ludgate Hill, they found that the same three men had worked there under the name of R. Randall and Co. since renting the office in August 1897. The office was empty but they found large amounts of pills and medicines, and also correspondence addressed to Montrose at the Imperial Building, and Panolia at Pleydell Street. All the addresses were put under observation, and on 10 October the police saw Norman Gibson go into Trafalgar Buildings to collect the mail which he was wrapping into bundles. A total of 475 letters were found containing £240. Gibson cooperated fully and said he had been hired just a few weeks ago and was told to take the letters in canvas bags to Brighton. On 8 October he had met Leonard Chrimes, who he knew as Charles J. Mitchell, at 3.00 pm on the arrival platform at Brighton Station. The police followed Gibson on his second trip to Brighton, but the Chrimes brothers must have seen them at Trafalgar Buildings and Leonard did not turn up for the meeting. All three brothers had gone into hiding and warrants were issued for their arrest on 10 October. Detective Inspector John Davidson of the City Police was in charge of the case. After considerable effort, he arrested Richard and Edward Chrimes on 10 November and Leonard ten days later. The Old Bailey trial Richard Chrimes (32) alias Randall, Edward (31) alias Knowles, and Leonard (22) alias Mitchell, were charged under Section 46 of the Larceny Act with threatening persons with a view to extorting money. This carried a maximum sentence of life imprisonment. They were also charged with attempting the miscarriage of a female by a drug or poison, which was also punishable with life imprisonment. Their trial at the Old Bailey began on 16 December 1898. The Old Bailey printed and online versions record the trial but unusually say, ‘The particulars of this case are unfit for publication’. However, the high profile case was fully covered in the Times and most other newspapers. Opening the case for the prosecution, Mr Mathews called it, ‘a plot of the most consummate infamy that was ever conceived by any swindler in the annals of crime’. He said that in the weeks following the threatening letter almost 3,000 replies had been sent to Trafalgar Buildings, with remittances totalled over £1,100. The GPO had returned the money to the senders of the intercepted letters. He believed that this would not have been a single mailing and that if they had not been caught, the Chrimes brothers would have sent out more letters demanding money. <img decoding="async" src="https://www.awin1.com/cshow.php?s=548131&amp;v=2495&amp;q=246855&amp;r=531859" border="0" data-eio="l" /> Another swindle In addition to the female remedies, under the alias of the ‘Bradbury Brothers’, they had sold cosmetic soap for the hair, oddly called ‘Hare’s Soap’. They offered a two guinea prize to people who could fill in the missing words in the advert. This was a well-known con. The Star newspaper ran an article on the brothers on 28 September 1898 saying it was a swindle as they did not give out prize money. Because the other charges were so serious, the prosecution counsel said the Chrimes brothers would not be charged for this offence. Various witnesses were called who could identify each of the brothers, the numerous aliases they had used, and the many offices they had rented in the City to conceal the blackmail plot and their scams. However, they made a mistake when renting two of their offices by giving their father Joseph Chrimes as a reference, thus leaving a paper trail which connected the name Chrimes with some of their aliases. Robert Berrill was the laboratory manager of the well-respected company ‘Stephen Wand’ at Haymarket in Leicester, which had been making pills and medicines since 1864. He said the blue and pink coated pills and tabules both contained reduced iron, extract of nux vomica (from the seeds of the tree of the same name which contained small amounts of strychnine), sulphate of quinine and extract of gentian. From October 1897 to June 1898 Ward had supplied goods to R. Randall which totalled £105. He said the tabules would not have the effect stated in the advert but would be a good blood tonic. Ward had previously supplied the same prescription of medicines to Abbot and Co. of St Andrew’s Hill City, which he understood, Edward Chrimes had taken over. Richard Chrimes and his family had been living in Bramah Road Brixton until he went on the run. In court Thomas Wade said he had advertised a grocer’s shop at 167 Maple Road, Penge for sale on 12 October. Richard Chrimes under the name of Richard Randall, called on him and bought the business for his wife for £46. Using the information they had collected, Detective Inspector Davidson put the shop under observation from 17 October when Chrimes took possession. They saw Richard serving behind the counter dressed in a grocer’s cap and apron. However, they did not have sufficient information to prove he was their wanted man. Arrested during dinner By chance, Florence Gale, the housekeeper at two of the offices, was the wife of PC Gale of the City Police. As he knew all the brothers by sight when they had used their aliases to rent the offices, he was asked to keep watch on the shop for three weeks. On 10 November Inspector Davidson had enough evidence, and with PC Gale arrested Richard and Edward while they were having dinner at the grocer’s shop. During a search of a bedroom above the shop, they found papers which gave them information about Leonard. He was traced to Plymouth and then to Mulvra Farm near St Astell in Cornwall, where he was attempting to become a chicken farmer under the alias of Harrington. On 20 November he was arrested at 7.30 am, while he was still in bed. Initially all three brothers pleaded Not Guilty, but at the Old Bailey Edward and Leonard changed their plea to Guilty, and the case proceeded against Richard Chrimes. <img decoding="async" data-attachment-id="6937" data-permalink="https://thequackdoctor.com/index.php/notorious-chrimes-the-blackm'''
