title = "'Eat! Eat! Eat!' Those notorious tapeworm diet pills | The Quack Doctor"
description = "The tapeworm diet claims a long history, but did our great-grandmothers really fight weight gain with parasites?"
full_description = '''Peoria, Illinois, 1912: the horror begins. A society lady, encouraged by a friend’s success with an easy new weight-loss treatment, pays $25 for ‘two rather large and suspicious-looking pills.’ Her husband sends the pills to be analysed by the Washington public health service, and before long a ‘government secret official’ appears, informing him that the pills contain ‘the head and first link of the body of a tape worm and sufficient nourishment to maintain life for probably a week.’ It was an amazing story – the compelling revoltingness, the quack’s audacity and ingenuity; the opportunity for the timeless pastime of mocking female vanity and ridiculing the overweight. The news dispatch from Peoria brought forth some stinging commentary: ‘The fat woman who is not satisfied with the way she is built,’ opined The Charlotte Observer (North Carolina) ‘deserves no more sympathy than she will get from a tapeworm.’ More than a hundred years later, numerous websites assert that nineteenth- and early twentieth-century women merrily chugged tapeworms to mould their figures. But was this 1912 report actually true? The woman, the pill vendor and the government agent weren’t named. The only identifying detail was the mention of the Washington health service, so it was to Surgeon General Rupert Blue that the Washington Post went for comment. ‘Yes, this is the public health service, all right,’ Blue reportedly told the paper, ‘and I believe I am at the head of the service. But I have seen no tapeworm pills. The only way I have ever heard of people eating tapeworms, either wholly or in part, was by eating meat which contained them. It is a fine yarn, but simply untrue.’ Dr John F Anderson, director of the Hygienic Laboratory, said: ‘It makes me creep to talk about them. That’s the wildest story I’ve heard of for some time.’ But wild stories are difficult to tame. The tapeworm pills tale began to feed upon the digestive juices of collective revulsion, adding new segments of exaggeration with every incarnation. In 1914, a report in the Marion Daily Star (Ohio) had someone forking out $300 for a liquid-filled capsule housing ‘some form of life’. As in the 1912 version, the customer is presented as a wealthy woman whose foolishness contrasts with her husband’s sensible attempts to analyse the pills. When exercising her own agency, the woman makes a ridiculous decision – and at a time of increasingly vocal campaigns for women’s suffrage, such undermining of female capacity for independent thought does not come as a surprise. A rubbery precedent It was also a time when, for most people, tapeworms were not desirable companions. Itinerant specialists, using anthelmintics based on male fern, made a living helping people ditch these unwanted passengers. And from one of these practitioners comes some possible inspiration for the diet pills story. At Peru, Indiana, in 1899, a medicine-show man named W I Swain was twice arrested for practising without a license. He allegedly gave his patients capsules containing artificial tapeworms that would navigate the digestive system and emerge as ‘proof’ that Swain’s treatment worked. Swain was acquitted, but there’s a chance this rumoured practice – not related to weight loss – became confused with the various obesity cures on offer some years later. Avoiding the quack-busters <img decoding="async" data-attachment-id="6724" data-permalink="https://thequackdoctor.com/index.php/eat-eat-eat-those-notorious-tapeworm-diet-pills/obesity-cures-1929-hathitrust-digital-library/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library.jpg" data-orig-size="488,819" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Cover illustration for Obesity Cures, 1929, Hathitrust Digital Library" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library-179x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library.jpg" class=" wp-image-6724 alignright" src="https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library.jpg" alt="Cover illustration for Obesity Cures, 1929, Hathitrust Digital Library" width="336" height="564" srcset="https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library.jpg 488w, https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library-179x300.jpg 179w, https://thequackdoctor.com/wp-content/uploads/2015/01/Obesity-Cures-1929-Hathitrust-Digital-Library-250x420.jpg 250w" sizes="(max-width: 336px) 100vw, 336px" data-eio="l" />These cures – Marmola, Rengo, Fatoff, the Newman Cure, and many more, attracted a great deal of attention from the American Medical Association and the Bureau of Chemistry of the US Department of Agriculture (now the FDA). After the Pure Food and Drug Act of 1906, the Bureau of Chemistry clamped down on the false claims made for patent medicines, and during the same period the anti-quack investigations of the AMA’s Arthur J Cramp were being disseminated to the public as books and pamphlets such as Nostrums and Quackery. If charlatans had been selling tapeworm pills, these authorities would surely have been down on their heads so hard they’d have been nibbling their own intestinal walls. The Notices of Judgment in cases of misbranding under the 1906 and 1938 acts have been digitised and form a great resource for those of us interested in the history of proprietary medicines – not least because they contain analyses of the products seized. But no tapeworm diet pills appear among these documents. Neither is there anything of the sort in the Nostrums and Quackery books or the AMA’s pamphlet, Obesity Cures (1929 edition pictured). <img decoding="async" data-attachment-id="6723" data-permalink="https://thequackdoctor.com/index.php/eat-eat-eat-those-notorious-tapeworm-diet-pills/mabel-herbert-urner-carney-enterprise-carney-okla-vol-14-no-50-ed-1-friday-july-9-1915-gateway-to-ok-history/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2015/01/mabel-herbert-urner-Carney-Enterprise.-Carney-Okla.-Vol.-14-No.-50-Ed.-1-Friday-July-9-1915-gateway-to-OK-history.jpg" data-orig-size="189,400" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Mabel Herbert Urner, Carney Enterprise, July 9, 1915 &#8211; Gateway to Oklahoma History" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2015/01/mabel-herbert-urner-Carney-Enterprise.-Carney-Okla.-Vol.-14-No.-50-Ed.-1-Friday-July-9-1915-gateway-to-OK-history-142x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2015/01/mabel-herbert-urner-Carney-Enterprise.-Carney-Okla.-Vol.-14-No.-50-Ed.-1-Friday-July-9-1915-gateway-to-OK-history.jpg" class="wp-image-6723 size-full" src="https://thequackdoctor.com/wp-content/uploads/2015/01/mabel-herbert-urner-Carney-Enterprise.-Carney-Okla.-Vol.-14-No.-50-Ed.-1-Friday-July-9-1915-gateway-to-OK-history.jpg" alt="Mabel Herbert Urner, Carney Enterprise, July 9, 1915 - Gateway to Oklahoma History" width="189" height="400" srcset="https://thequackdoctor.com/wp-content/uploads/2015/01/mabel-herbert-urner-Carney-Enterprise.-Carney-Okla.-Vol.-14-No.-50-Ed.-1-Friday-July-9-1915-gateway-to-OK-history.jpg 189w, https://thequackdoctor.com/wp-content/uploads/2015/01/mabel-herbert-urner-Carney-Enterprise.-Carney-Okla.-Vol.-14-No.-50-Ed.-1-Friday-July-9-1915-gateway-to-OK-history-142x300.jpg 142w" sizes="(max-width: 189px) 100vw, 189px" data-eio="l" />Mabel H Urner, pictured in 1915 A fictional friend The tapeworm pill might have escaped these official publications, but its combination of weirdness and comedy made it perfect for The Married Life of Helen and Warren, Mabel Herbert Urner’s fictional humour column. Syndicated by papers across the US, a 1927 episode titled ‘A Get-Thin-Quick Specialist is Exposed by His Bottled Genii’ shows a character named Mrs Dodson boasting that she can eat as many potatoes as she likes thanks to Dr Phake’s system. The protagonist, Helen, is repulsed by the slippery capsules – and is even more alarmed to see one of them twitch, roll over, and jump! Given the widespread popularity of Urner’s series, it is not too much of a stretch to imagine Mrs Dodson becoming the ‘friend of a friend’ who is so often the victim of the legend. <img decoding="async" src="https://www.awin1.com/cshow.php?s=265087&amp;v=2102&amp;q=83048&amp;r=531859" border="0" data-eio="l" /> FDA evidence With many ‘friend of a friend’ tales in circulation, people sought answers from newspaper agony columns and from the AMA’s Bureau of Investigation. Thanks to the very helpful FDA history office, I have been lucky enough to see the surviving correspondence related to tapeworm diets. It suggests that the story kept rearing its ugly scolex but remained just out of reach of the investigators. In response to a Mrs C Nash of Benton Harbor, Michigan, in 1930, an AMA representative wrote: The idea that any ‘obesity cures’ contain any part of the tapeworm is a fantastic one that bobs up every once in a while and can never quite be tracked down. At any rate, we are certain that there is no truth in it. Two years later, Prof. Francis Curtis of the University of Michigan considered mentioning the pills in a textbook, but checked with the AMA first. The reply (the file copy of which is unsigned but has a reference suggesting it was by Dr Cramp) again wrote it off as a myth: The ‘tapeworm capsule’ for obesity is a hardy perennial. Of course, there is no such thing, and never has been. My guess is that the idea originated in the fertile brain of some newspaper man, who thought it would make a good story – and it has made a whole flock of good stories! In the writer’s opinion, people used the legend to protect their overweight friends from getting scammed by the real obesity cure fakers. The worm turns? In most versions, the dieter has no idea of the tapeworm’s presence until either the pills are investigated or she leaves them on a sunny windowsill and returns to find them wriggling. But towards the middle of the twentieth century, the tale shifted to include the purposeful ingestion of parasites as a weight-loss aid. In the 1950s, Maria Callas was reported to have been installed with tapeworms under medical supervision, though she is now thought to have acquired them naturally from her diet. As Snopes notes, these rumours might have served to belittle a high-profile woman who didn’t meet society’s expectations of ‘likeability’. The decade also brought the AMA within a worm’s breadth of finally tracking down some evidence. In 1953, they received a letter from medical ‘agony uncle’ Dr Edwin P Jordan, who had reassured a correspondent that tapeworm diet pills were ‘a wild story’, but then heard from one Dr Gettman of Hendersonville, NC, claiming that three of his patients had bought such pills from someone in Iowa. The packaging, Gettman said, stated ‘This product contains the ova of taenis (sic) saginata’. Gettman had been told by persons unspecified that the truthfulness of the labelling meant nothing could be done. The Bureau of Investigation’s Director, Oliver Field, jumped at the chance to solve the mystery, and wrote to Dr Gettman asking for the manufacturer’s details. Even if the packaging did state the contents, he was pretty sure such a quack could be prosecuted somehow. Alas, there is no record of a reply. Once again, the tapeworm story had slipped through the investigators’ fingers. Eat! Eat! Eat! <img decoding="async" data-attachment-id="6727" data-permalink="https://thequackdoctor.com/index.php/eat-eat-eat-those-notorious-tapeworm-diet-pills/the-inevitable-sanitized-tape-worms/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2015/01/The-Inevitable-Sanitized-Tape-Worms.jpg" data-orig-size="1210,1665" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Sanitized Tape Worms &#8211; a spurious &#8216;vintage&#8217; ad" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2015/01/The-Inevitable-Sanitized-Tape-Worms-218x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2015/01/The-Inevitable-Sanitized-Tape-Worms-744x1024.jpg" class=" wp-image-6727 aligncenter" src="https://thequackdoctor.com/wp-content/uploads/2015/01/The-Inevitable-Sanitized-Tape-Worms.jpg" alt="Sanitized Tape Worms - a spurious 'vintage' ad" width="487" height="1267" data-eio="l" /> I am sure you’ve seen this image before – it’s a staple of ‘old timey cures’ listicles. And on a more highbrow level, ‘sanitized tape worms’ even make an appearance in the journal Diabetes Care, where a report on the American Diabetes Association annual meeting of 1999 refers to them being ‘widely advertised’ in the early 1900s. Maybe one day someone will cite a convincing original source for the image, but my view is that it’s fake. Parts of the design and copy are lifted directly from 1920s advertisements for Neutroids (below), a weight-loss supplement sold by Dr R Lincoln Graham of the Graham Sanitarium, New York City. <img decoding="async" data-attachment-id="6728" data-permalink="https://thequackdoctor.com/index.php/eat-eat-eat-those-notorious-tapeworm-diet-pills/neutroids-screenland-aug-1923/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2015/01/neutroids-screenland-aug-1923.jpg" data-orig-size="696,1173" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&qu'''
