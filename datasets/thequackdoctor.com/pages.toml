["https://thequackdoctor.com/index.php/rameys-medicator-an-inventors-survival"]
title = "Ramey's Medicator: an inventor's survival | The Quack Doctor"
description = "Ramey's Medicator was meant to cure 'death-dealing disease' - and its inventor had been through a life-threatening medical experience of his own."
full_description = '''<img fetchpriority="high" decoding="async" data-attachment-id="6390" data-permalink="https://thequackdoctor.com/index.php/rameys-medicator-an-inventors-survival/rameys-medicator-steads-review-1901/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901.jpg" data-orig-size="428,556" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Ramey&#8217;s medicator Stead&#8217;s Review 1901" data-image-description="" data-image-caption="&lt;p&gt;Ramey&#8217;s Medicator, Stead&#8217;s Review 1901&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901-231x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901.jpg" class="size-full wp-image-6390" src="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901.jpg" alt="Ramey's Medicator, Stead's Review 1901" width="428" height="556" srcset="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901.jpg 428w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901-231x300.jpg 231w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-medicator-Steads-Review-1901-323x420.jpg 323w" sizes="(max-width: 428px) 100vw, 428px" data-eio="l" />Ramey’s Medicator, Stead’s Review April 1901 Advertisements for Ramey’s Medicator claimed that it would overcome ‘death dealing disease.’ What most customers didn’t know, however, was that the inhaler would never have existed at all if its inventor had not survived a gruesome surgical ordeal. The Medicator was patented by Alfred H Ramey and Frank D Rollins on 3 June 1890. Its inner chamber contained wadding that could be treated with the user’s medicine of choice – though once it went on sale it came with its own Compound Inhalant. The three tubes allowed the vapours to be drawn down into the throat or blown forcefully up into the nose as required, clearing the head of catarrh and the lungs of phlegm. The handle was hollow in order to provide a home for the instructions, and each tube had a cap that must, of course, be removed before use. ‘Everybody needs one,’ advised an advert in 1895, ‘as by its novel action and wonderful curative power it cures all throat and head diseases. Diphtheria, that death dealing disease, yields readily to its wonderful cleansing power. This remedy CURES while others only give temporary relief.‘ <img decoding="async" data-attachment-id="6393" data-permalink="https://thequackdoctor.com/index.php/rameys-medicator-an-inventors-survival/rameys-inhaler-close-up/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up.jpg" data-orig-size="244,480" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Close-up of Ramey&#8217;s Medicator, 1890 design" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up-153x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up.jpg" class="aligncenter size-full wp-image-6393" src="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up.jpg" alt="Close-up of Ramey's Medicator, 1890 design" width="244" height="480" srcset="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up.jpg 244w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up-153x300.jpg 153w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-inhaler-close-up-214x420.jpg 214w" sizes="(max-width: 244px) 100vw, 244px" data-eio="l" /> At the time he filed the patent, Alfred H Ramey was a successful druggist in Aurora, Illinois, having started out with a market stall and used an effective method – honest graft – to build up his business. But let us go back to November 1866, where events on a remote army outpost left the 20-year-old Ramey fighting for survival. Ramey took a government job hauling freight to build Fort Phil Kearny and Fort C F Smith, which were designed to protect travellers along the Bozeman Trail. Fort Phil Kearny was in the middle of the sacred hunting grounds of the Lakota Sioux, leading to conflict between the US Army and an alliance of tribes under Red Cloud. According to a brief biography in the History of Peoria County (1880), Ramey had volunteered to go out with the soldiers to fight the Sioux and Cheyenne. A Report of Surgical Cases Treated in the Army of the United States from 1865 to 1871 (1871), however, suggests that he was sitting with other civilians at a campfire outside the Phil Kearny stockade when a group of Native American warriors attacked. Either way, Ramey incurred a devastating gunshot wound to his right leg, leaving his kneecap smashed into fragments. He was admitted to the post hospital the next day, and as his condition worsened, the wound began to suppurate, loosening the shards of bone. The army surgeons removed about two thirds of the patella. <img decoding="async" data-attachment-id="6394" data-permalink="https://thequackdoctor.com/index.php/rameys-medicator-an-inventors-survival/fort-phil-kearny-from-indian-fights-and-fighters-1904/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904.jpg" data-orig-size="800,522" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Plan of Fort Phil Kearny from Indian Fights and Fighters (1904)" data-image-description="" data-image-caption="&lt;p&gt;Plan of Fort Phil Kearney showing the location of the hospital where Ramey was treated.&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904-300x196.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904.jpg" class="size-full wp-image-6394" src="https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904.jpg" alt="Plan of Fort Phil Kearny from Indian Fights and Fighters (1904)" width="800" height="522" srcset="https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904.jpg 800w, https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904-300x196.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904-768x501.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904-696x454.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/03/fort-phil-kearny-from-Indian-Fights-and-Fighters-1904-644x420.jpg 644w" sizes="(max-width: 800px) 100vw, 800px" data-eio="l" />Plan of Fort Phil Kearny showing the location of the hospital (next to the south west wall) where Ramey was treated. Five months later, Ramey was still in the hospital and his future looked bleak. The agony of the wound and its continuous suppuration had left him debilitated and emaciated. He had a hectic fever accompanied by diarrhoea, and the long months in bed had caused a three-and-a-half inch sore to form over his sacrum. The leg itself was unrecognisable – open cavities ate into the knee joint and abscesses ravaged the lower part of his thigh. ‘The entire limb became erysipelatous,’ reported assistant surgeon S. M. Horton. ‘There was muscular anchylosis of the hip joint, and on the least motion of the knee-joint caused excessive pain.‘ The prospect of an operation was daunting, but at last Ramey accepted that he couldn’t carry on like this and survive. His only choice was between losing his leg and losing his life. There was a risk that it could be both, but on 25 April 1867, he consented to undergo amputation at the upper third of his thigh. Ether and chloroform were both in supply at the fort, and a combination of these was used for anaesthesia. Just nineteen days later, Ramey’s stump had entirely healed and he was able to leave his bed. He returned home to Peoria, Illinois, on 23 July, just three months after his close encounter with Death. Once recovered, Ramey signed up for a commercial course at Peoria College and, with a capital of $4, launched his fruit and nut stand on the the corner of Washington and Main Streets. It was a great success, making $300 in its first few months and enabling him to move to the nearby city of Chillicothe to set up as a grocer. <img decoding="async" data-attachment-id="6401" data-permalink="https://thequackdoctor.com/index.php/rameys-medicator-an-inventors-survival/rameys-medicator-1905-credit-mark-sanders-inhalatorium-3/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-1905-credit-Mark-Sanders-Inhalatorium2.jpg" data-orig-size="309,330" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Rameys Medicator 1905 credit Mark Sanders Inhalatorium" data-image-description="" data-image-caption="&lt;p&gt;Ramey&#8217;s Medicator, 1905 Patent. Image credit: Mark Sanders, www.inhalatorium.com&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-1905-credit-Mark-Sanders-Inhalatorium2-281x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-1905-credit-Mark-Sanders-Inhalatorium2.jpg" class="size-full wp-image-6401" src="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-1905-credit-Mark-Sanders-Inhalatorium2.jpg" alt="Rameys Medicator 1905 credit Mark Sanders Inhalatorium" width="309" height="330" srcset="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-1905-credit-Mark-Sanders-Inhalatorium2.jpg 309w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-1905-credit-Mark-Sanders-Inhalatorium2-281x300.jpg 281w" sizes="(max-width: 309px) 100vw, 309px" data-eio="l" />Ramey’s Medicator, 1905 Patent. Image credit: Mark Sanders, www.inhalatorium.com His Medicator went through two incarnations, with the second one (1905) featuring a moveable mouthpiece for greater comfort. Ramey’s other inventions included a Liver and Kidney Remedy based on the fluid extract of buchu (traditionally reputed to help against urinary tract ailments), a mop-wringer and pail, a cake-turner, and a toy pistol that fired coins. He was a popular member of the community, ‘able, besides making his own way in life, to afford material assistance to many of his friends.’ Alfred H Ramey died in 1923 and is buried at Spring Lake Cemetery, Aurora, IL. <img decoding="async" data-attachment-id="6403" data-permalink="https://thequackdoctor.com/index.php/rameys-medicator-an-inventors-survival/rameys-medicator-spokesman-review-17-aug-1895/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895.jpg" data-orig-size="523,504" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Ramey&#8217;s Medicator, Spokesman Review 17 Aug 1895" data-image-description="" data-image-caption="&lt;p&gt;Ramey&#8217;s Medicator advertisement, The Spokesman-Review, 17 August 1895&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895-300x289.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895.jpg" class="size-full wp-image-6403" src="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895.jpg" alt="Ramey's Medicator, Spokesman Review 17 Aug 1895" width="523" height="504" srcset="https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895.jpg 523w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895-300x289.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/03/Rameys-Medicator-Spokesman-Review-17-Aug-1895-436x420.jpg 436w" sizes="(max-width: 523px) 100vw, 523px" data-eio="l" />Ramey’s Medicator advertisement, The Spokesman-Review, 17 August 1895 <img decoding="async" src="https://www.awin1.com/cshow.php?s=265087&amp;v=2102&amp;q=83048&amp;r=531859" border="0" data-eio="l" /> Sources: Advertisement, The Spokesman-Review, 17 August 1895 Advertisement, Stead’s Review, April 1901 (Australia) FindAGrave memorial for Alfred H Ramey The History of Peoria County, Illinois. Containing a history of the Northwest–history of Illinois–history of the county, its early settlement, growth, development, resources, etc., etc. 1880 A Report of Surgical Cases Treated in the Army of the United States from 1865 to 1871 (1871) Historic site of Fort Phil Kearny (present-day Wyoming)'''
