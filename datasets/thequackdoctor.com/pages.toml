title = "The Worm-Doctor of Shoreditch | The Quack Doctor"
description = "John Gardner kept two museums supposedly full of the horrible intestinal parasites expelled by his patients - but they weren't all they were cracked up to be."
full_description = '''<img fetchpriority="high" decoding="async" data-attachment-id="4933" data-permalink="https://thequackdoctor.com/index.php/the-worm-doctor-of-shoreditch/morning-post-18081803/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Morning-post-18081803.jpg" data-orig-size="442,242" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Morning Post 18 August 1803" data-image-description="" data-image-caption="&lt;p&gt;From the Morning Post 18 August 1803&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Morning-post-18081803-300x164.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Morning-post-18081803.jpg" class="size-full wp-image-4933" title="Morning Post 18 August 1803" src="https://thequackdoctor.com/wp-content/uploads/2011/04/Morning-post-18081803.jpg" alt="Morning Post 18 August 1803" width="442" height="242" srcset="https://thequackdoctor.com/wp-content/uploads/2011/04/Morning-post-18081803.jpg 442w, https://thequackdoctor.com/wp-content/uploads/2011/04/Morning-post-18081803-300x164.jpg 300w" sizes="(max-width: 442px) 100vw, 442px" data-eio="l" />From the Morning Post 18 August 1803 It’s a while since we last heard from our old friend Ascaris lumbricoides, so it’s time he made another appearance on The Quack Doctor together with a few of his helminthic chums. I’m putting together a talk about the career of John Gardner, a former soldier and picture-framer who became a medicine vendor and Methodist preacher in the 1780s. Gardner’s best-known nostrum was a vermifuge, relieving his patients of some spectacular parasites that he collected and preserved in his museums at Long-Acre and Shoreditch. Last week I went to the Wellcome Library to have a look at a broadside (c. 1822) advertising Gardner’s collections, and its cheerfully disgusting exuberance was a joy to read. These specimens had the job of persuading new patients that their symptoms resulted from something equally revolting, and judging by the advertising, this would have worked a treat. <img decoding="async" data-attachment-id="4925" data-permalink="https://thequackdoctor.com/index.php/the-worm-doctor-of-shoreditch/gardners-museum-broadside/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Gardners-museum-broadside.jpg" data-orig-size="656,261" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Gardner&#8217;s museum broadside" data-image-description="" data-image-caption="&lt;p&gt;My useless attempt at taking a sneaky picture when no one was looking&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Gardners-museum-broadside-300x119.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Gardners-museum-broadside.jpg" class="size-full wp-image-4925 " title="Gardner's museum broadside" src="https://thequackdoctor.com/wp-content/uploads/2011/04/Gardners-museum-broadside.jpg" alt="Gardner's museum broadside" width="505" height="201" srcset="https://thequackdoctor.com/wp-content/uploads/2011/04/Gardners-museum-broadside.jpg 656w, https://thequackdoctor.com/wp-content/uploads/2011/04/Gardners-museum-broadside-300x119.jpg 300w" sizes="(max-width: 505px) 100vw, 505px" data-eio="l" />My useless attempt at taking a sneaky picture when no one was looking. The line under the address says ‘Dr. G. aged 70 and without enemies – God has done much for him.’ Early 19th-century anti-quackery publications portrayed Gardner as a hypocrite whose conspicuously pious attitude was just a front for charlatanry. The specimens, they claimed, had not passed through any human sphincters but were made by Gardner himself out of everyday substances. His tapeworms were chicken guts and his roundworms vermicelli, while ordinary insects and lizards played the part of the other strange beasts. Gardner’s shop displayed the sign ‘The Universal Remedy Under God,’ but a critic in the 1820s accused him of holding ‘a poisonous nostrum in one hand, and the Holy Bible in the other,’ and his Methodism perhaps provided him with a get-out clause for patients who weren’t cured. A correspondent to the Medical Adviser in March 1824 described a butcher going to complain that the worm remedy had made him worse. It transpired that the butcher worked on Sundays and didn’t go to church, so Gardner allegedly told him: God help you, it is an affliction of the Lord for your wickedness. I can do nothing for you, it would be impious to attempt relieving you; good day, I am sorry for you, young man. (The butcher replied ‘So am I: good day, doctor.’) <img decoding="async" data-attachment-id="4926" data-permalink="https://thequackdoctor.com/index.php/the-worm-doctor-of-shoreditch/v0002160-j-gardner-stipple-engraving/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner.jpg" data-orig-size="367,576" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;Wellcome Images&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;V0002160 J. Gardner. Stipple engraving.\nCredit: Wellcome Library, London. Wellcome Images\nimages@wellcome.ac.uk\nhttp:\/\/images.wellcome.ac.uk\nJ. Gardner. Stipple engraving.\nPublished: - \n\nCopyrighted work available under Creative Commons by-nc 2.0 UK, see http:\/\/images.wellcome.ac.uk\/indexplus\/page\/Prices.html&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;Copyrighted work available under Creative Commons by-nc 2.0 UK, see http:\/\/images.wellcome.ac.uk\/indexplus\/page\/Prices.html&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;V0002160 J. Gardner. Stipple engraving.&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="J Gardner, aged 74" data-image-description="&lt;p&gt;V0002160 J. Gardner. Stipple engraving.&lt;br /&gt; Credit: Wellcome Library, London. Wellcome Images&lt;br /&gt; images@wellcome.ac.uk&lt;br /&gt; http://images.wellcome.ac.uk&lt;br /&gt; J. Gardner. Stipple engraving.&lt;br /&gt; Published: &#8211; &lt;/p&gt; &lt;p&gt;Copyrighted work available under Creative Commons by-nc 2.0 UK, see http://images.wellcome.ac.uk/indexplus/page/Prices.html&lt;/p&gt; " data-image-caption="&lt;p&gt;John Gardner at the age of 74. Wellcome Images&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner-191x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner.jpg" class="size-full wp-image-4926" title="J Gardner, aged 74" src="https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner.jpg" alt="J Gardner, aged 74" width="367" height="576" srcset="https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner.jpg 367w, https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner-191x300.jpg 191w, https://thequackdoctor.com/wp-content/uploads/2011/04/Dr-J-Gardner-268x420.jpg 268w" sizes="(max-width: 367px) 100vw, 367px" data-eio="l" />John Gardner at the age of 74. There is another side to Gardner’s religion, however – he was the founder of the Stranger’s Friend Society for the relief of the poor in 1785. By his own account in The Grain of Mustard Seed (1829), he got the idea while visiting a destitute fistula patient in a garret. Gardner began to put by a penny a week to help those less fortunate, and encouraged his neighbours to do the same. The society grew, inspiring similar organisations across the country. Back to the worms, however. The following is a small selection of the exhibits detailed in Gardner’s broadside. A. lumbricoides is here referred to as Teres – Gardner tended to use the term ‘ascarids’ for threadworms instead. Worms, from 1 inch to 130 in length, some with 150 suckers; others in the form of caterpillars; another species like woodlice, 12 feet to each; a wolf of the stomach, expelled from a lady at Hoxton, who had nearly fallen victim to its ravages!! One animal, with ears like a mouse, from a gentleman. Another with 4 horns, 6 legs, and 12 feet, which lived 9 days, from a child of 9 years; a Tape Worm, its edges like the teeth of a saw; a Stomach Worm by a lady’s mouth, 7 inches long, in the act of emitting its young; male and female Teres, one emitting her young, were preying in the vitals of a gentleman five years, who could find no relief in Paris, nor Edinburgh!!! A round Worm, 10 inches long, from the mouth of a child, aged 20 months, at the Palace; a Worm, resembling a small snake from the bowels of a man; 44 round Worms, 9 inches each, from a child; a narrow Tape Worm from a young woman’s mouth, 18 feet—she also voided 40 feet downwards, had been afflicted 16 years. An insect from a young woman’s stomach, of a caterpillar form: it lived 7 weeks in a bottle, and gnawed through two corks!! Two hundred worms resembling wood-lice, expelled from Mr. A— Hollywell Mount, which had tormented him for many months; a Bamboo Worm, with 4 horns and 12 legs, expelled from a man, whom it had nearly destroyed. Worms from the mouth, nose and ears of Mrs. T.——, and in the milk of the breast of Mrs. P.——, Bishopsgate Road.'''
