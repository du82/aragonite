title = "'A Damnable Villain' part 2 - a free pony for your wife! | The Quack Doctor"
description = "In part 2 of Robert K. Waits' guest article, Byron H Robb moves to Texas, changes his name and starts selling mail-order Shetland ponies."
full_description = '''<img decoding="async" data-attachment-id="6459" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-byron-h-robb-and-the-electro-magnetic-brush-co/guest-post-label/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-orig-size="250,172" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Guest post" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" class="alignleft wp-image-6459" title="Guest post" src="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg" alt="Guest post" width="154" height="106" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label.jpg 250w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-100x70.jpg 100w, https://thequackdoctor.com/wp-content/uploads/2014/05/guest-post-label-218x150.jpg 218w" sizes="(max-width: 154px) 100vw, 154px" data-eio="l" />In the second part of his guest article, Robert K. Waits – author of The Medical Electricians – reveals Byron H Robb’s change of career from electro-magnetic entrepreneur to Texas rancher. Read Part 1 here. . <img fetchpriority="high" decoding="async" data-attachment-id="6473" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-part-2-a-free-pony-for-your-wife/1854-adv-nytimes-11sept1854-p-7-texasstatetimes-austinoct-dec1854jan1855-2/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855.jpg" data-orig-size="407,527" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Ad, New York Times, 11 Sep 1854" data-image-description="" data-image-caption="&lt;p&gt;1854 ad, New York Times, 11 Sept 1854 and Texas State Times (Austin), Oct-Dec 1854 and Jan 1855.&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855-232x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855.jpg" class="size-full wp-image-6473" src="https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855.jpg" alt="Ad, New York Times, 11 Sep 1854" width="407" height="527" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855.jpg 407w, https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855-232x300.jpg 232w, https://thequackdoctor.com/wp-content/uploads/2014/05/1854-Adv-NYTimes-11Sept1854-p.-7-TexasStateTimes-AustinOct-Dec1854Jan1855-324x420.jpg 324w" sizes="(max-width: 407px) 100vw, 407px" data-eio="l" />1854 ad, New York Times, 11 Sept 1854 and Texas State Times (Austin), Oct-Dec 1854 and Jan 1855. Even as a Farmington, Ohio, teenager in 1854, Robb was honing his skill as a mail-order fraudster, advertising a $1 secret ‘receipt’ (recipe) ‘To Make Your Hair Curl.’ He claimed to have purchased the recipe in Italy for $8000 after searching for nine years (that would have him start the search at age ten!). Robb was to return to the hair curling trade in the 1870s, selling an electro-magnetic hair curler (below) along with his brush. During 1881, J.W. Weakley, Jr. & Co. took over Robb’s Electro-Magnetic Brush Co. business. <img decoding="async" data-attachment-id="6475" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-part-2-a-free-pony-for-your-wife/wwofaa-p-110-robb-curlingcomb-c1875/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875.jpg" data-orig-size="3048,1923" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;CanoScan 4400F&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;1310649666&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Robb Curling Comb c 1875" data-image-description="" data-image-caption="&lt;p&gt;c1875 ad, Robb’s Curling Comb Source: Leonard de Vries and Ilonka Van Amstel, “The Wonderful World of Advertisements 1865-1900,” Follett, Chicago, 1972, p110&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-300x189.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-1024x646.jpg" class="size-large wp-image-6475" src="https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-1024x646.jpg" alt="Robb Curling Comb, c 1875" width="800" height="504" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-1024x646.jpg 1024w, https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-300x189.jpg 300w, https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-768x485.jpg 768w, https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-696x439.jpg 696w, https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-1068x674.jpg 1068w, https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-666x420.jpg 666w, https://thequackdoctor.com/wp-content/uploads/2014/05/WWofAA-p.-110-Robb-CurlingComb-c1875-1920x1211.jpg 1920w" sizes="(max-width: 800px) 100vw, 800px" data-eio="l" />c1875 ad, Robb’s Curling Comb. Source: Leonard de Vries and Ilonka Van Amstel, ‘The Wonderful World of Advertisements 1865-1900,’ Follett, Chicago, 1972, p110 In 1882, after being repeatedly revealed as a fraud in Ohio, Robb relocated his family 1200 miles southwest to the Texas hill country. He also changed his family name, becoming Byron H. Van Raub. Fittingly, the German noun, Raub, translates as robbery. As the pioneer settlers in the region were German, this also suited his new last name. As Van Raub, he acquired land near Leon Springs, about 20 miles northwest of San Antonio, which he dubbed the Don Carlos Ranch (in 1890, he claimed to have a Pony Ranch of 600 acres, and by 1896 had added bloodhound kennels). Soon Van Raub was raising Shetland ponies and advertising them for sale by mail-order. A typical letter sent to editors of rural newspapers reads: I desire to introduce the sale of my fancy ponies and horses in your locality. I have no money to invest in advertising, but if you will insert the enclosed advertisement [for] six months … in your paper, and call attention to it editorially, I will ship you, free of freight, one or a pair … of beautiful ponies for your wife or little folks, in the first car-load lot that goes near your place. … (Signed) B. H. Van Raub. The American Agriculturist didn’t take long to identify Van Raub as Robb, quoting a Vermont editor that ‘a good many editors have swallowed the bait’ (American Agriculturist, Sept. 1884, p. 391). Van Raub’s scheme was to send out circulars to those answering his ads (using postage provided by the inquirer) offering send a ‘catalogue’ for $1. In the catalogue he professes that he sells ponies ‘to make children happy’ and solicits agents to sell said ponies and offers a free pony to the agent in the first car-load sale, which would cost the customer $100-150. A victim in Michigan wrote that of a car-load of ponies (paid for in advance), only one of the twenty-two ponies was ‘… as represented. We were victims of very false misrepresentation … [by] a swindler of the deepest dye’ (American Agriculturist, Dec. 1886 and Feb. 1887, p. 81). <img decoding="async" data-attachment-id="6486" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-part-2-a-free-pony-for-your-wife/van-raub-ponies-evening-star-washington-dc-1-feb-1889/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/van-raub-ponies-Evening-Star-Washington-DC-1-Feb-1889.jpg" data-orig-size="529,240" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Van Raub Ponies, Evening Star, Washington DC, 1 Feb 1889" data-image-description="" data-image-caption="" data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/van-raub-ponies-Evening-Star-Washington-DC-1-Feb-1889-300x136.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/van-raub-ponies-Evening-Star-Washington-DC-1-Feb-1889.jpg" class=" wp-image-6486 aligncenter" title="Van Raub Ponies, Evening Star, Washington DC, 1 Feb 1889" src="https://thequackdoctor.com/wp-content/uploads/2014/05/van-raub-ponies-Evening-Star-Washington-DC-1-Feb-1889.jpg" alt="Van Raub Ponies, Evening Star, Washington DC, 1 Feb 1889" width="529" height="240" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/van-raub-ponies-Evening-Star-Washington-DC-1-Feb-1889.jpg 529w, https://thequackdoctor.com/wp-content/uploads/2014/05/van-raub-ponies-Evening-Star-Washington-DC-1-Feb-1889-300x136.jpg 300w" sizes="(max-width: 529px) 100vw, 529px" data-eio="l" /> Van Raub somehow managed to have a local community near Leon Springs named Van Raub, Texas, and in 1889-1890, posing as an industrious civic supporter, placed want-ads for ‘a doctor to locate in a new railroad town’ with the proviso that he would be able to build and operate a small drug store … (The railroad was a branch of the new San Antonio & Aransas Pass line; in 1893, it was an hour journey between San Antonio and Van Raub). Van Raub undoubtedly was seeking an M.D. to lend credence to his mail-order nostrum sales. Between 1890 and 1893 a San Antonio newspaper reported periodic visits by ‘Byron Van Raub, the well known stockman of Van Raub station.’ By 1885 the community had a cotton gin, school, and a weekly newspaper. The town grew to 300 souls by 1886 and a post office was established in 1889. But the cotton gin closed in 1912 and the post office in 1919, and as the railroad business dwindled, Van Raub slowly became a ghost town. Even the ghost town has now disappeared, overrun by new developments. <img decoding="async" data-attachment-id="6480" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-part-2-a-free-pony-for-your-wife/paines-celery-compound-indianapolis-journal-1-march-1902/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902.jpg" data-orig-size="276,781" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Paine&#8217;s Celery Compound ad" data-image-description="" data-image-caption="&lt;p&gt;Indianapolis Journal, 1 March 1902&lt;/p&gt; " data-medium-file="https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902-106x300.jpg" data-large-file="https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902.jpg" class=" wp-image-6480 aligncenter" title="Paine's Celery Compound ad, Indianapolis Journal 1 March 1902" src="https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902.jpg" alt="Paine's Celery Compound ad, Indianapolis Journal 1 March 1902" width="276" height="781" srcset="https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902.jpg 276w, https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902-106x300.jpg 106w, https://thequackdoctor.com/wp-content/uploads/2014/05/Paines-celery-compound-Indianapolis-Journal-1-March-1902-148x420.jpg 148w" sizes="(max-width: 276px) 100vw, 276px" data-eio="l" /> The later activities of Mr. Van Raub are a mystery. Paine’s Celery Compound newspaper ads in 1902 (above) featured a testimonial: ‘ “… I have not been sick a day since I took the first bottle.” Col. Byron H. Van Raub, owner of the famous Don Carlos Ranch, Van Raub, Texas.’ On the last pages of a 1903 manual for goat raising Van Raub was reported to have been a breeder of Spanish-Maltese milk goats ‘for over 20 years.’ (A Manual of Angora Goat Raising, George F. Thompson, American Sheep Breeder Co. Press, Chicago, p. 220). This claim had apparently been discredited in 1902 (Wool Markets and Sheep, Nov. 1, 1902, p. 11, Draper Pub. Co., Chicago). © 2014 Robert K. Waits <img decoding="async" data-attachment-id="6474" data-permalink="https://thequackdoctor.com/index.php/a-damnable-villain-part-2-a-free-pony-for-your-wife/spanish-maltese-doe/" data-orig-file="https://thequackdoctor.com/wp-content/uploads/2014/05/spanish-maltese-doe.jpg" data-orig-size="757,672" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&q'''
