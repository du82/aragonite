["http://thescoop.org/archives/2013/04/28/academy-fight-song"]
title = "Academy Fight Song – Derek Willis"
description = "Academic and journalist"
full_description = "What’s that I hear The sound of marching feet It has a strange allure Has a strange allure Mission of Burma, “Academy Fight Song” Disclaimer: I am the son and son-in-law of retired tenured university professors, and have taught data reporting skills for about 10 years at the undergraduate and graduate levels. I love teaching. I have my issues with “education”. This post on journalism curriculum by University of Florida journalism professor Mindy McAdams deserves to be widely read. Not just because it attempts to deal with a growing problem in a responsible manner, but because it is honest about the situation: Students deserve better. Regardless of what they think journalism is when they tick the box to become a journalism major (and regardless of whether they’re paying Ivy League prices or in-state tuition at a public university), they deserve to be taught skills, techniques, and ways of thinking that will carry them through the challenging times at hand and ahead. They deserve to have every teacher — tenured, adjunct or freshly pressed Ph.D. — looking at what’s new, what’s happening today, now (what happened in and around Boston last week, for example, as seen in the mainstream news and in social media) and incorporating new methods for reporting, for storytelling, and for engaging the audience into all of their classes. Mindy has been teaching her students this semester about coding for journalism, and has a blog where she has described her experiences and posted her presentations. Here’s a wacky question: why isn’t this stuff (blog posts, presentations, videos) on a ufl.edu site? Maybe it makes no difference at all to students, but why wouldn’t the UF Journalism school want to be all over this stuff? Mindy’s post is a response to an earlier one on Poynter by Tom Rosenstiel in which he argues that journalism education was, in fact, experimenting in the kinds of ways that are needed for the future of the profession. He cites, among others, Robert Hernandez at USC and Esther Thorson at Missouri as doing important work in the frontiers of journalism. Fair enough, although I’d argue that rather than “barely scratching the surface”, Rosenstiel probably couldn’t generate a list of people doing innovative work in academia that was all that much longer than what he published. Katie Zhu, who is pursuing a double major in computer science and journalism at Northwestern, writes that she has had one professor – at Medill – who she can honestly describe as a person who “get[s] it.” Think about that. Here we have a bright, talented and ambitious student who wants to put herself at the forefront of journalism education and has to do it by herself at one of the elite journalism schools in the country. As Katie says: Let’s re-architect the distribution requirements so we can get rid of this notion that journalism and engineering (and the sciences) are at odds with each other. Because journalism needs to move forward. The unspoken part there is that, if this keeps happening to enough people (and there will be more), journalism will move forward without journalism education, or worse, talented would-be journalists will seek to work in other professions. Katie has a job lined up at Twitter. Anti-Intellectualism’s Roots Part of the problem is that some of these technical areas and concepts are alien to many faculty, and part of it is that it’s sometimes hard to attract experts from the profession to full-time academic work. Part of it is that curriculum change is insanely harder than it should be, and that accreditation is so super important – to other academics, at least. Part of it is the tenure system, which results in disproportionate power within departments, power worth fighting to protect. And part of it is also that the academy has done a pretty terrible job of selling whatever academic products it creates, as well as pulling from the best the rest of the university has to offer. For this, some blame (but only some) can be apportioned to the audience. As Rosenstiel writes: For years, journalism was marred by an ugly streak of anti-intellectualism — the denial of theory, the exaltation of craft, the repudiation [sic] professional identity, ignorance of scholarship. One byproduct of the crisis in journalism is that anti-intellectualism is giving way to something better at schools where practitioners and scholars work together to create a new curriculum. A fair point, but it goes a bit too far for me. For one thing, this anti-intellectualism that Rosenstiel identifies - surely that hasn’t been helped along by educators who tolerated and even encouraged the fiction that journalists “don’t need to know math” to do their work? As prevalent as that sentiment is in newsrooms, would it have become such a staple of journalism if there had been broad pushback from journalism schools? It’s fairly telling that John Allen Paulos’ website is on the math.temple.edu server, because it sure as hell wouldn’t be found on a journalism school’s site (to be clear: this isn’t a shot at Temple specifically, but at the academy generally. Temple has actually even changed its curriculum.). The very fact that journalism schools have been looking outside their walls to address the industry’s current problems says an awful lot about how pervasive this anti-intellectualism really is, and what its sources really are. Want more evidence? Let’s talk about this professor of practice thing. Or maybe these “general manager”-type positions in collegiate newsrooms (I have at least two friends, both former journalists, who are in these types of positions at prominent journalism schools). People: these are teachers, just as surely as any PhD on the faculty. Yes, it might be easier from a bureaucratic standpoint to get a “professor of practice” into the department, but I’m willing to bet a decent chunk of change that in the eyes of too many “real” professors, these people are not in a similar line of work or are doing it the wrong way. The people who have tried hard to get new ideas into the J-school are (mostly) dedicated and good people who see what is on the horizon. The people who resist are (mostly) dedicated and good people who have too much power and independence to give it up without a fight. This would be one hell of a good story, if only most journalism students were permitted to write about it. A case in point: a few years ago I was invited to come to Northwestern for a week to speak to Medill faculty and students about the kinds of work we were doing, and to hold training sessions on basic data reporting concepts for the faculty. That I was there at all was hugely encouraging to me, and I met a number of faculty who, although inexperienced in this area, were excited about learning. And then I learned the catch: the training sessions were optional, because why would it be otherwise?. I struggle even now to imagine any journalism course in which the professor should remain ignorant of basic digital reporting knowledge. Great message for the faculty, let alone the students. It’s Academic The professional ignorance of scholarship thing, though, is certainly right from the perspective of someone who has worked in newsrooms since 1995 and has taught college classes for most of the past 10 years. I don’t read many academic journals, nor do I attend AEJMC - go ahead, Google it - or other journalism education conferences, and I don’t know many professionals who do. Far worse is the fact that I would find it hard to read those papers anyway, since most of them are unavailable online without a subscription of some kind. Sure, we’ve been ignorant of scholarship. But I’m not sure that scholars have done what is truly necessary to improve the relationship between trade and education. About a year ago I was involved in a brief Twitter episode involving a draft academic paper that mentioned Fech. Whatever my issues with the paper itself, there is a crazier undercurrent: one of its authors didn’t know that it was posted on the Web, and as I learned, there was little chance that anyone outside academic circles would ever see the final paper. The authors very kindly sent me a revised version, but of course I can’t share that with you, and neither can they, legally. Which makes no sense at all. Academic authors are literally only publishing for themselves and their colleagues, and we can’t understand why the industry is so separated from the academy? Of course the Internet is trying to undercut this closed system. There’s academia.edu, which as near as I can figure is like a Napster for journal (and other) articles, and it looks to me as if professors post their articles there even if they technically don’t have permission to do so. It would be funny if it weren’t sad, or if the news business wasn’t facing some pretty severe challenges. The kind of challenges that universities might be able to shed some light on through smartly designed experiments and research. I’d be interested in reading more about those kinds of things directly rather than looking at pages like this and wishing there were more links. The Hard Part The gap between journalism and journalism education seems pretty big, although I think it’s hard to measure. Chalk at least some of that up to the peculiarities of both the profession and of academics in general, but there’s one factor that looms large: most other fields of study are not facing such a fundamental upheaval. It seems like this would be a pretty good time for there to be tighter collaboration between the industry and those who study it, or at least a reshaping of what those studies look like. But where to start? Changing accreditation and tenure practices would be dramatic, but it’s hard to imagine either being done, both within journalism schools and across the academy more broadly. Even though I’ve never heard any journalism school graduate say that accreditation was any factor whatsoever in her decision to enroll, who wants to remove their name from the list? If one university (or department) changes its tenure practices, surely its competitors would use that against it when recruiting faculty. Some prominent journalism grant-making organizations have urged the adoption of the teaching hospital method, which makes some sense, although I’m not certain that the faculty exists to actually fulfill that mission at most schools, and perhaps it shouldn’t, given the mission of performing and publishing research, too. As much as I enjoy being an adjunct, a too-heavy reliance on such teachers is a bad thing for students. I know that my students don’t get my absolute best effort, owing to my day job, and I also am not a contributor to the academic life of the university beyond the class I teach. Two things seem slightly more achievable to me, although every school is different: more flexibility in curriculum requirements, and more accessible scholarship. One starts to address the concerns of students like Katie and professors like Mindy. The other might start to repair the breach between the academy and the industry that serves neither well."
author = "Derek Willis"
year_published = 2013
clearnet = "http://thescoop.org/archives/2013/04/28/academy-fight-song"
