["https://thescoop.org/archives/2007/06/14/the-new-competition/index.html"]
title = "The New Competition – Derek Willis"
description = "Academic and journalist"
full_description = "Back when we launched the Congress Votes Database in late 2005, it had only a few contemporaries, including the excellent GovTrack. Now the field is getting pretty crowded, and that’s a good thing for readers interested in federal legislation and how Congress works. The Sunlight Foundation in particular is responsible for jump-starting activity in this arena by funding individuals and organizations and also building its own tools. The latest, LOUIS, is an aggregator of federal legislative documents, which is a fairly robust challenge to those businesses that provide legislative tracking. If this kind of thing doesn’t worry journalists, it should. Web apps like these should cause some consternation among editors and reporters, since ultimately we’re competing for readers’ attention in niche areas. I know Sunlight’s work has pushed us to add features to the votes database, and that benefits readers in the end. But news organizations shouldn’t forget that they have advantages of their own: expertise and knowledge among staffers and the ability to integrate quality content with data. We just have to recognize the competitive threat and respond do it. For awhile now I’ve been telling folks that apps like Facebook – as non-newsy as it can be compared to a paper – are now part of our competitive space, and not just for hits and eyeballs. They are not the only competition, and we shouldn’t ignore other news outlets or journalistic efforts. But it’s way past the time for us to be dismissing niche Web apps as irrelevant to our jobs."
