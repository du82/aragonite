title = "What I Did Then – Derek Willis"
description = "An archive of my previous work"
full_description = "What I Did Then An archive of my previous work Most of my previous work revolved around finding, acquiring and using political and legislative data for journalism. That meant scraping web sites for congressional data, building APIs and helping my colleagues build interactives that explore important issues. I used to appear on C-SPAN once in awhile, too. ProPublica, 2015-2021 As a news applications developer, I both built data-driven websites and wrote articles. Read them here. Some of my favorite work: Hundreds of PPP Loans Went to Fake Farms in Absurd Places New Records Show the NYPD’s Favored Punishment: Less Vacation Time The NYPD Files Tracking PPP Loans How Fundraisers Convinced Conservatives to Donate $10 Million — Then Kept Almost All of It How Congress Stopped Working Represent FEC Itemizer The New York Times, 2007-2015 As a interactive news developer and later a writer on The Upshot, I was a member of The Times’ first newsroom web development team and later wrote data-driven stories. Read some of them here. I also helped produce two public APIs for congressional and campaign finance data. Some of my favorite work: Maiden Names, on the Rise Again How ActBlue Became a Powerful Force in Fund-Raising Looking for John McCain? Try a Sunday Morning Show Voting Totals Reveal Crucial Boost From Blacks in Thad Cochran’s Victory A Mysterious Republican Committee in the Virgin Islands Freeing the Plum Book Outside Spending in Key House Races The 2012 Money Race: Compare the Candidates Represent Toxic Waters The Washington Post/washingtonpost.com, 2004-2007 I started at the Post as a research database editor, contributing to stories, and then moved to washingtonpost.com (then a separate company!) to build data-driven projects. Some of my favorite work: D.C. Red-Light Cameras Fail to Reduce Accidents Gulf Firms Losing Cleanup Contracts Hill Leaders Often Take Corporate Jets The U.S. Congress Votes Database The Center for Public Integrity, 2003-2004 As a database editor and writer, I contributed to several projects by building databases and writing some stories. Read them here. Some of my favorite work: Silent Partners Congressional Quarterly, 1998-2003 The Palm Beach Post, 1995-1997"
