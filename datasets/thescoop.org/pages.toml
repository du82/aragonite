["https://thescoop.org/teaching"]
title = "Teaching – Derek Willis"
description = "Academic and journalist"
full_description = "Teaching I’ve been teaching data journalism, either in professional and student workshops or at universities, since the late 1990s. Many of these sessions have been under the auspices of IRE, which has some of the best journalism training in the world (you should become a member, especially if you are a student). But I’ve also taught or helped teach college-level courses at Washington Adventist University, George Washington University, Northwestern University, American University, Georgetown University, West Virginia University and the University of Maryland. Teaching is in my blood; my parents are both teachers, and there are few things that are more important. That’s why I’m a full-time teacher now. Along the way, I’ve developed some strong feelings about how journalism is taught and learned, and have written about them from time to time. Here is a selection, in reverse chronological order: When Teaching Data Journalism, Keep It Simple for Students Take an Interviewing Approach to Find Stories in Data Data Journalism, Student Media Edition The Natives Aren’t Restless Enough Teaching Hospitals, Journalism Education and a Hatchet Job Academy Fight Song Why Teach SQL? The Case Against Teaching Access"
