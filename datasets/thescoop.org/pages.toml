["https://thescoop.org/archives/2008/09/23/white-house-beat-feature-request/index.html"]
title = "White House Beat Feature Request – Derek Willis"
description = "Academic and journalist"
full_description = "Ok, I love the fact that CBS Radio’s Mark Knoller keeps such good tabs on presidential travel, but can somebody please come up with a backup plan in case, heaven forbid, Knoller gets hit by a bus or something? Is this too much to ask of WH reporters? This is the kind of thing where somebody out there is going to do a better job of gathering and displaying this data on the Web. And it should be us, cause it’s our job. Ok, I love the fact that CBS Radio’s Mark Knoller keeps such good tabs on presidential travel, but can somebody please come up with a backup plan in case, heaven forbid, Knoller gets hit by a bus or something? Is this too much to ask of WH reporters? This is the kind of thing where somebody out there is going to do a better job of gathering and displaying this data on the Web. And it should be us, cause it’s our job."
