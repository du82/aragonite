["https://thescoop.org/archives/2010/02/18/lightning-talks-at-nicar/index.html"]
title = "Lightning Talks at NICAR – Derek Willis"
description = "Academic and journalist"
full_description = "This year’s computer-assisted reporting conference in Phoenix has a couple of new sessions on the schedule. One of them is an idea a couple of us have been pushing for a few years: lightning talks. A staple of technical conferences, lightning talks are based on the notion that while 45-50 minutes presentations are good, sometimes you only need about 5 minutes to express an idea or show off an example of something interesting or useful. And I’m pretty sure, based on sessions at the hotel bar at past conferences, that there are plenty of ideas out there. Attracting and organizing them is the goal of this app built by my boss, Aron Pilhofer, and launched today. This is a new thing for the CAR community, but I think it could be a useful way to draw out ideas from people who aren’t doing panels or who might shrink from a 50-minute session. So let’s get started. Want to give a talk?"
