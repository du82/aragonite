["https://www.thestatesman.com/bengal/kmc-to-start-dental-screening-at-its-health-centres-1503403395.html"]
title = "KMC to start dental screening at its health centres - The Statesman"
description = "Citizens of Kolkata could soon get oral check-up done in their wards for free. The Kolkata Municipal Corporation is mulling a plan to start dental screening at its health centres soon."
full_description = '''Citizens of Kolkata could soon get oral check-up done in their wards for free. The Kolkata Municipal Corporation is mulling a plan to start dental screening at its health centres soon. According to the member-mayor-in-council for the Health wing of KMC, Atin Ghosh, the dental screening facility is being planned in all the primary health centres of the municipal corporation. Along with screening facilities for dental treatment would also be provided at the health centres run by the civic body. Apart from dental screening and treatment, the municipal corporation is also putting efforts to expand eye check up and treatment services across wards. Presently, the services are available in 14 wards. The KMC is said to have set up 11 vision centres in the city by collaborating with two NGOs. Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); Notably, a demand for a dialysis facility by the KMC came up during the recent Budget Session at the House last week. For dialysis, the facility can be provided at tertiary health service units. According to the deputy mayor, often patients have chances of cardiac arrest during dialysis. In such a situation, the patient immediately needs to be shifted to a tertiary care unit. Presently, such a facility can be provided at the mayor’s clinic which is attached to SSKM. For KMC primary healthcare services are a priority. Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); The municipal corporation is also working on providing services for rare diseases. For this, treatment facilities are being provided at 10 health centres: 3, 11, 52, 66, 29, 75, 76, 85, 139 and 140. The KMC, along with Organisation of Rare Disease India and Rare Warriors of Bengal Association launched a Rare Disease Screening Centre. Over the past year, more than 50 ASHA workers and 20 medical officers were trained to conduct rare disease screening at the community level. A questionnaire is being given to the households through which data is collected on rare diseases. The questionnaire generates a score that helps determine the risk of rare diseases in families. Advertisement (adsbygoogle = window.adsbygoogle || []).push({}); Health centresKMCKolkata Related posts # Bengal Father, autistic daughter die by suicide in Behala Kolkata again was shaken on Friday night after a father and his 22-year-old autistic daughter were found hanging in their home in Behala’s Parnasree. # Bengal City hosts start-up meet Start-up meet and pitch fest 2025, titled Platform - Kolkata Chapter was an exercise in creating initiatives in the entrepreneurial landscape. # India Kolkata-Hindon-Goa Flight Launched, Strengthening Regional Connectivity In a landmark move to enhance regional air connectivity, the Civil Aviation Ministry launched its Boeing-737 flight on the Kolkata-Hindon-Goa route on Saturday. You might be interested in <img src="https://www.thestatesman.com/wp-content/uploads/2022/11/Rape-Representational-Image-1-300x200.jpg" alt="UP girl sets herself on fire &#8216;out of shame&#8217; after assault by neighbour"> UP girl sets herself on fire ‘out of shame’ after assault by neighbour <img src="https://www.thestatesman.com/wp-content/uploads/2025/02/Jahan-e-Khusrau-pm-modi-narendra-modi-300x200.webp" alt="Ramzan Mubarak: PM Modi extends warm wishes as holy month begins"> Ramzan Mubarak: PM Modi extends warm wishes as holy month begins <img src="https://www.thestatesman.com/wp-content/uploads/2025/03/IMG_9753-300x200.webp" alt="UK PM Starmer meets Ukrainian President Zelensky"> UK PM Starmer meets Ukrainian President Zelensky window._taboola = window._taboola || []; setTimeout(function() { _taboola.push({ mode: 'thumbnails-c', container: 'taboola-below-article-thumbnails', placement: 'Below Article Thumbnails', target_type: 'mix' }); }, 2000); setTimeout(function() { window._taboola = window._taboola || []; _taboola.push({flush: tru