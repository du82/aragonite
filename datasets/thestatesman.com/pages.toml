["https://www.thestatesman.com/bengal/bratya-basus-car-attacked-trinamul-office-vandalised-as-students-demand-campus-polls-1503403385.html"]
title = "Bratya Basu’s car attacked, Trinamul office vandalised as students demand campus polls - The Statesman"
description = "Demanding immediate holding of students’ union elections in Jadavpur University (JU) SFI and other left-backed students’ organisations allegedly damaged the education minister’s car and set fire on the Trinamul Shiksha Bandhu Samiti office inside the university campus on Saturday."
full_description = '''Demanding immediate holding of students’ union elections in Jadavpur University (JU) SFI and other left-backed students’ organisations allegedly damaged the education minister’s car and set fire on the Trinamul Shiksha Bandhu Samiti office inside the university campus on Saturday. The JU campus virtually turned into a battlefield this afternoon when the agitating SFI and other left students’ union got involved in clashes in phases with the ruling Trinamul Congress-affiliated West Bengal College and University Professors Association (WBCUPA).Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); The trouble started around 2.30 p.m. when Mr Basu was supposed to attend the WBCUPA’s annual general meeting (AGM) held at the open air theatre (OIT) auditorium inside the campus as the head of the association. Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); The agitating students were shouting slogans demanding students’ union elections in the university when Mr Basu came. Sensing trouble he was taken to the OIT through another gate. The agitators rushed to the OIT auditorium and vandalised it when the minister was addressing the meeting. But the trouble intensified between 4 and 4.40 p.m. when the minister in his car was leaving the campus through another gate after attending the AGM. Students surrounded the minister and prevented him from leaving. They attacked the car damaging its windscreen and threw shoes on its bonnet. The SFI alleged that that the car dashed one of their protesting students when they were found blocking the minister, who was sitting beside the driver. Later, he was taken to the SSKM Hospital for his health check-up. The SFI claimed that several students have been admitted to the nearby KPC Medical College Hospital after sustaining injuries when the minister’s car allegedly dashed them. One first year student Indranuj Roy was seriously injured when the minister’s car hit one of his legs. On the other hand, WBCUPA claimed some teachers belonging to their association have also been assaulted by the agitating Left students. While reacting to the incident Mr Basu told reporters said, “It was an uncontrolled terror unleashed by the Left students inside the JU campus. Entire state has seen who attacked us today inside the campus. I offered the students to sit for a dialogue with me but they refused.” “No election has been held in colleges and universities for the past 12 years. What is the education minister doing? Educational institutions have been reeling under lawlessness. Why is the government so reluctant to hold students’ elections?” said Md Salim, CPI-M state secretary. SFI in protest against the incident blocked the road in front of the Jadavpur police station. Tensions prevailed in the area later in the evening with deployment of the Rapid Action Force (RAF). Trinamul Congress led by minister Arup Biswas brought out a protest march at Sulekha More in protest against the attack on Mr Basu’s car and other WBCUPA members. Interestingly, Left had a phenomenal victory in the JU co-operative society elections winning 51 out of 58 seats on Friday. Advertisement (adsbygoogle = window.adsbygoogle || []).push({}); JUSFIWest Bengal <img alt="Share on WhatsApp" height="34" width="34" style="background:white;" src="https://www.thestatesman.com/wp-content/themes/statesmantheme/images/whatsapp.png" width="41" height="40"> <img alt="Share on Facebook" height="34" width="34" style="background:white;" src="https://www.thestatesman.com/wp-content/themes/statesmantheme/images/facebookus.png" width="41" height="40"> <img alt="Share on Twitter" height="34" width="34" style="background:white;" src="https://www.thestatesman.com/wp-content/themes/statesmantheme/images/tweet.png" width="41" height="40"> <img alt="Share on Telegram" height="34" width="34" style="height:38px;" src="https://www.thestatesman.com/wp-content/themes/statesmantheme/images/telegram.png" width="41" height="40"> Related posts # Bengal BJP counters Mamata’s allegations against EC A political storm has erupted in West Bengal over the issue of proxy voting and alleged illegal voters. # Bengal Sukanta Majumdar accuses TMC of name deletion in voters’ list Union minister of state for education Sukanta Majumdar on Friday alleged that West Bengal chief minister and Trinamul Congress (TMC) chief Mamata Banerjee has devised a strategy to delete the names of Hindi-speaking Hindu voters from electoral rolls based on feedback from district magistrates (DMs) and superintendents of police (SPs). # Bengal My leader is Mamata Banerjee: Abhishek Rubbishing reports of his political differences with Trinamul chairperson Mamata Banerjee, the national general secretary of the ruling party in West Bengal, on Thursday expressed his loyalty to her. You might be interested in <img src="https://www.thestatesman.com/wp-content/uploads/2022/11/Rape-Representational-Image-1-300x200.jpg" alt="UP girl sets herself on fire &#8216;out of shame&#8217; after assault by neighbour"> UP girl sets herself on fire ‘out of shame’ after assault by neighbour <img src="https://www.thestatesman.com/wp-content/uploads/2025/02/Jahan-e-Khusrau-pm-modi-narendra-modi-300x200.webp" alt="Ramzan Mubarak: PM Modi extends warm wishes as holy month begins"> Ramzan Mubarak: PM Modi extends warm wishes as holy month begins <img src="https://www.thestatesman.com/wp-content/uploads/2025/03/IMG_9753-300x200.webp" alt="UK PM Starmer meets Ukrainian President Zelensky"> UK PM Starmer meets Ukrainian President Zelensky window._taboola = window._taboola || []; setTimeout(function() { _taboola.push({ mode: 'thumbnails-c', container: 'taboola-below-article-thumbnails', placement: 'Below Article Thumbnails', target_type: 'mix' }); }, 2000); setTimeout(function() { window._taboola = window._taboola || []; _taboola.push({flush: true}); }, 2000);'''
