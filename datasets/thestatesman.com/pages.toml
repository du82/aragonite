["https://www.thestatesman.com/bengal/gta-chief-anit-thapa-highlights-holistic-development-in-hills-1503403389.html"]
title = "GTA chief Anit Thapa highlights holistic development in hills - The Statesman"
description = "Gorkhaland Territorial Administration (GTA) chief Anit Thapa on Saturday reaffirmed his commitment to holistic development in the Hills, citing multiple infrastructural projects initiated in ward 45 under GTA’s jurisdiction."
full_description = '''Gorkhaland Territorial Administration (GTA) chief Anit Thapa on Saturday reaffirmed his commitment to holistic development in the Hills, citing multiple infrastructural projects initiated in ward 45 under GTA’s jurisdiction. Speaking at the event, Mr Thapa stated that his party, the Bharatiya Gorkha Prajatantrik Morcha (BGPM), remains dedicated to inclusive progress, ensuring sustainable growth across sectors such as education, sports, community welfare, and road connectivity.Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); “Today, as per my commitment, I had the opportunity to inaugurate and lay the foundation stone for several key development projects in the ward 45 under GTA. These initiatives will significantly improve education, sports, community infrastructure, and road connectivity in the region,” Mr Thapa said. Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); Among the key projects inaugurated were: New school building at Gairibas Higher Secondary School, development of a playground and open stage with a green room and toilets at Dalgaon, community halls at Patagaon Gairibas, Swabodh Ashram (45 Dhura Rongo GP), and Gairegaon. Mr Thapa emphasised that development should not be limited to infrastructure but must encompass economic growth, healthcare, education, and a shift in societal thinking. “Sustainable progress is only possible when all aspects of development are addressed holistically,” he added. Since assuming leadership of GTA in 2021, BGPM has followed this principle, shaping its initiatives to ensure long-term benefits for the region. Infrastructure, Mr Thapa noted, remains the backbone of economic, health, and educational advancements. Thapa also inaugurated the newly-constructed Dalgaon Secondary School building in the presence of GTA executive member Lakpa Namgyal Bhutia, highlighting the administration’s focus on quality education for future generations. Advertisement (adsbygoogle = window.adsbygoogle || []).push({}); Anit ThapaBGPMGTA Related posts # Bengal GTA rejects five-decimal land grant, pushes for full land rights Following an order from the West Bengal government on 2 November, 2023, the district administration has begun surveying tea garden lands in Darjeeling and Kalimpong. # Bengal After BJP, Anit Thapa too opposes freehold land move Even Gorkhaland Territorial Administration (GTA) chief executive Anit Thapa has voiced strong opposition to chief minister Mamata Banerjee’s plan to allow 30 per cent of tea plantation land for commercial use under the banner of tea tourism. # Bengal Sittong Tourism Festival: Blend of culture, adventure & tradition The 2nd Darjeeling Ecotourism and Cultural Festival will be held at Ahal Ground, Sittong III, Kurseong, under the Gorkhaland Territorial Administration (GTA) from 7-9 February. You might be interested in <img src="https://www.thestatesman.com/wp-content/uploads/2022/11/Rape-Representational-Image-1-300x200.jpg" alt="UP girl sets herself on fire &#8216;out of shame&#8217; after assault by neighbour"> UP girl sets herself on fire ‘out of shame’ after assault by neighbour <img src="https://www.thestatesman.com/wp-content/uploads/2025/02/Jahan-e-Khusrau-pm-modi-narendra-modi-300x200.webp" alt="Ramzan Mubarak: PM Modi extends warm wishes as holy month begins"> Ramzan Mubarak: PM Modi extends warm wishes as holy month begins <img src="https://www.thestatesman.com/wp-content/uploads/2025/03/IMG_9753-300x200.webp" alt="UK PM Starmer meets Ukrainian President Zelensky"> UK PM Starmer meets Ukrainian President Zelensky window._taboola = window._taboola || []; setTimeout(function() { _taboola.push({ mode: 'thumbnails-c', container: 'taboola-below-article-thumbnails', placement: 'Below Article Thumbnails', target_type: 'mix' }); }, 2000); setTimeout(function() { window._taboola = window._taboola || []; _taboola.push({flush: true}); }, 2000);'''
