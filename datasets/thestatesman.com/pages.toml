title = "ER RPF rescue a minor from kidnapper - The Statesman"
description = "Railway Protection Force (RPF) of the Eastern Railway assisted officials of Wazirganj police station, Bihar, in the rescue of a minor girl yesterday."
full_description = '''Railway Protection Force (RPF) of the Eastern Railway assisted officials of Wazirganj police station, Bihar, in the rescue of a minor girl yesterday. According to the ER, on 27 February, around 12.47 p.m. the RPF Chandanpur received information regarding a minor girl who had fled from her home with a man. A case had already been registered against the accused at Police station Wazirganj, Bihar. Acting promptly, RPF Chandanpur tracked the girl’s live location, which indicated her presence near Pump Bazar, under the jurisdiction of Chandanpur railway station.Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); A team, led by ASI Sattan Paswan reached the spot and found a couple wandering aimlessly. They were detained and brought to RPF Post Chandanpur, where they were kept under CCTV surveillance. Yesterday, the investigating officer of the case, along with Wazirganj police personnel and the girl’s father, reached RPF Post Chandanpur. After completing legal formalities, the accused, Nitish Kumar was handed over to the police, and the rescued minor was safely reunited with her family. Advertisement setTimeout(function() { (adsbygoogle = window.adsbygoogle || []).push({}); }, 2000); Advertisement (adsbygoogle = window.adsbygoogle || []).push({}); BiharEastern RailwayPolice station Related posts # India Bihar embarked on new path of development under Nitish Kumar’s leadership: PM Modi Prime Minister Narendra Modi on Saturday extended heartfelt birthday wishes to Bihar Chief Minister Nitish Kumar, acknowledging his significant contributions to the state's development. # Bengal Railway initiatives for Mahakumbh: In a bid to ensure seamless travel and accommodate the massive influx of pilgrims attending Mahakumbh, the Railway operated special trains including 76 pairs of reserved and unreserved Kumbh Mela Special trains from key stations by the Eastern Railway and 24 pairs by South eastern Railway. # Bengal ER takes special measures for crowd management The Asansol Division of Eastern Railway has taken comprehensive crowd management measures at Asansol station and other key locations to ensure the smooth and safe movement of passengers during Mahakumbh. You might be interested in <img src="https://www.thestatesman.com/wp-content/uploads/2022/11/Rape-Representational-Image-1-300x200.jpg" alt="UP girl sets herself on fire &#8216;out of shame&#8217; after assault by neighbour"> UP girl sets herself on fire ‘out of shame’ after assault by neighbour <img src="https://www.thestatesman.com/wp-content/uploads/2025/02/Jahan-e-Khusrau-pm-modi-narendra-modi-300x200.webp" alt="Ramzan Mubarak: PM Modi extends warm wishes as holy month begins"> Ramzan Mubarak: PM Modi extends warm wishes as holy month begins <img src="https://www.thestatesman.com/wp-content/uploads/2025/03/IMG_9753-300x200.webp" alt="UK PM Starmer meets Ukrainian President Zelensky"> UK PM Starmer meets Ukrainian President Zelensky window._taboola = window._taboola || []; setTimeout(function() { _taboola.push({ mode: 'thumbnails-c', container: 'taboola-below-article-thumbnails', placement: 'Below Article Thumbnails', target_type: 'mix' }); }, 2000); setTimeout(function() { window._taboola = window._taboola || []; _taboola.push({flush: true}); }, 2000);'''
