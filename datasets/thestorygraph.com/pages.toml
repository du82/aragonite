title = "The StoryGraph | Our Team"
description = "Get to know the three book lovers behind The StoryGraph."
full_description = "Nadia started The StoryGraph as a small side project. After university, she learnt to code at Makers Academy in London, before working as a software engineer at Pivotal. She is The StoryGraph's sole developer. In her spare time, when not reading, you'll likely find her at a dance class. Her current favorite book is The Eighth Life (for Brilka) by Nino Haratischwili. Rob is responsible for all of the machine learning that powers The StoryGraph's recommendations, similar books, and more! He specialises in maintaining enterprise-level software deployments and manages all of StoryGraph's infrastructure. Outside of work, Rob loves his VR headset and playing basketball. His favorite books are Cixin Liu's Remembrance of Earth's Past series. Abbie does a wide variety of things at The StoryGraph, including customer support, managing our volunteer librarians, and helping to train our machine learning algorithms. Outside of reading, Abbie loves baking, going to the gym, knitting and sewing. Her favorite book so far this year is Hijab Butch Blues by Lamya H."
