["https://thestorygraph.com"]
title = "The StoryGraph | Because life's too short for a book you're not in the mood for"
description = "We'll help you track your reading and choose your next book."
full_description = "We'll help you track your reading and choose your next book based on your mood and your favorite topics and themes. Easily track and learn about your reading habits with our wide range of charts and graphs. See how your reading develops over time and use that to help you pick better books. Our machine learning AI is like your trusted go-to friend for book recommendations.It'll understand your reading preferences and find the best books for you. In the mood for something adventurous, funny, and fast-paced? What about a darker, slower, more emotional read? Mix and match our comprehensive set of filters to choose your next perfect book. Add live reactions to specific parts of the book without fear of spoilers. Comments are locked for other participants until they reach that point in their reading.Don't have people to read with? We’ve got machine learning-powered suggestions for great reading buddies."
