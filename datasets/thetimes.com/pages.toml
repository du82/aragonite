title = "I built a toy maker – and it’s all thanks to a lift from my boss"
description = "Richard North’s Wow! Stuff, co-founded with Kenny McAndrew and Graeme Taylor, started off selling novelty items and now focuses on toys for children"
full_description = "HOW I MADE ITI built a toy maker – and it’s all thanks to a lift from my bossRichard North’s Wow! Stuff, co-founded with Kenny McAndrew and Graeme Taylor, started off selling novelty items and now focuses on toys for childrenHannah Prevett, Deputy Editor, The Times Enterprise NetworkSunday March 02 2025, 12.00am, The Sunday TimesRichard North, chairman and co-founder of Wow! Stuff, at the toy maker’s offices in WolverhamptonMIKE SEWELL FOR THE SUNDAY TIMESHannah Prevett, Deputy Editor, The Times Enterprise NetworkSunday March 02 2025, 12.00am, The Sunday TimesRichard North was trudging through thick snow to his first day in a new job when his boss pulled up next to him in his Bentley.“He said, ‘I’ll give you a lift for the final bit.’ So I jumped into this amazing car and I remember looking down at all the crap and sludge off the bottom of my suit trousers dropping onto his cream lamb’s wool carpets and spoiling them. I remember thinking, ‘I’m going to get fired and I’ve only just started.’” The boss in the Bentley, one Bernard Barnett, owned a factory in Wolverhampton making crossbows. He became the then 18-year-old’s entrepreneurial inspiration. “When I saw that Bentley, I thought, ‘That’s what I want later in life.’”Barnett later asked North what his ambition was. North replied: “‘I want to be an entrepreneur like you.’ And he gave me some advice that stuck with me. He said: ‘If you’re setting your business up and you’re a great salesman, what you need is complimentary skills — a great financial person, or a great marketeer — not ones who are going to duplicate what you do.’”It’s a logic he’s applied to Wow! Stuff, based in his home town of Wolverhampton, which he co-founded with former scientists Kenny McAndrew and Graeme Taylor. North met them at a toy fair in Harrogate, where they were selling a crude but practical product, the “arse/face towel”, which was aimed at students and had clearly defined sections of fabric to improve hygiene.AdvertisementWOW! STUFFToday, the business has moved away from novelty gifts to focus on toys for children. Its recent innovations include “puppetronics” — soft toys with hand-controlled actions and sounds that capture their personality traits. They have won customers including Universal Studios and Disney as well as awards; its Stitch puppetronic, based on the character from the Lilo & Stitch film franchise, recently won toy of the year at the Toy Industry Awards. It has also collaborated with Warner Bros on a range of toys from the Harry Potter universe, including a bestselling Invisibility Cloak. The buzz around the toys is helping grow sales: the company’s revenues leapt from £14 million last year to £22.4 million in the year to this January, with a slim pre-tax profit. North is the majority owner.As well as his former boss, North says his early motivation came from a desire to support his older brother, Jonathan, who was left disabled after suffering a stroke aged five. The company’s Stitch puppetronic won toy of the year at the Toy Industry AwardsMIKE SEWELL FOR THE SUNDAY TIMES“That was the driver largely for me to become an entrepreneur, because I thought if my mum and dad died, my brother wouldn’t be able to fend for himself.” Jonathan died from a brain haemorrhage when he was 28.North struggled to concentrate at school and was “easily distracted”, but found his focus on the shooting range and won a world championship when he was 18. It was a natural next step to start selling crossbows for Barnett. He moved on, two years later, to selling binoculars and telescopes, but it wasn’t until he was made redundant aged 26, in 1994, that he took the plunge and set up his own business, called Simmons (Europe). It sold binoculars, telescopes and shooting equipment.AdvertisementNorth said he spent the final £500 of his redundancy payout on a flight to the US to meet the boss of a company whose products he wanted to distribute. The businessman, Fred Cosper, took a shine to him and not only granted the European distribution rights, but also gave him 120-day payment terms to get the business up and running. North ran the firm for seven years, before selling it for £1.5 million in 2001.By then he had also started a second company, Boysstuff, which sold gifts and gadgets for adults online. These included large, reclining La-Z-Boy armchairs, made famous by Joey Tribbiani and Chandler Bing, characters in the TV sitcom Friends. “We were the biggest importer of La-Z-Boy armchairs in Europe.” The company had annual sales of about £10 million at its peak.NBCThe dotcom era was an exciting time to be running an ecommerce start-up, with plenty of venture capital cash sloshing around. “We were getting valued at £100 million, it was crazy. I remember going into our accountants for meetings with private equity firms and we were looking to raise £1 million and the accountants said, ‘No, we can get you £10 million’ — even though the business plan didn’t support that.”He sold Boysstuff in 2003 and was considering his next move when he met McAndrew and Taylor at the Home & Gift Buyers’ Festival. “I now had some money behind me and I could have done anything I wanted, so I went to Harrogate for inspiration.” When North teamed up with the two scientists, they sold 10,000 of the arse/face towels, before forming Wow! Stuff in 2006. They also came up with novelty gifts and toys for clients including the BBC show Top Gear and the Science Museum. Their first big hit was a remote-controlled robot shoulder monkey called Dave the Funky Monkey, which they launched in 2010. When a quarter of a million Daves were sold, the three co-founders decided to focus on kids’ toys.AdvertisementA year or two later, McAndrew and Taylor designed another hit, a huge helium-filled balloon in the shape of a shark, about five feet long and three feet wide. “It would sit in the air, hovering … and you had a remote control so you could fly it around your room.”Wow! Stuff has collaborated with Warner Bros on Harry Potter items, including a bestselling Invisibility CloakMIKE SEWELL FOR THE SUNDAY TIMESVideos of the Air Swimmer toys on YouTube helped push the company’s turnover to £17.3 million in 2012, but it also caught the eye of copycats. “What we didn’t know about the toy industry is that when you get a hit, you get copied. And the floodgates opened. There was probably about $100 million of products sold in the second year, but we did 25 per cent of that.”Incensed, North decided to take legal action. “I thought, this is unfair. And I’d made a bit of money now, so I decided to sue.” He now smiles at his naivety. The case was settled in the Royal Courts of Justice in 2019, seven years and £2 million after he started proceedings. “The main guy that we were suing put his company into administration and claimed bankruptcy. We never got any damages. It was a pyrrhic victory.”The experience hasn’t made him wary of attracting attention. He says Wow! Stuff has pioneered what it calls the puppetronics category since launching the Baby Blue Jurassic World toy four years ago for Universal Studios. “It became a bestseller and we realised we were on to something with puppets plus electronics.” MIKE SEWELL FOR THE SUNDAY TIMESThe next puppetronic was the Stitch toy, which is now sold in 30 countries. It retails for between £49.99 and £70. North said he is unfazed by the threat from unscrupulous imitators.Advertisement“We’re signing deals every day to create puppetronics for brands. And once they’ve signed to us, they’re not going to sign to some copycat that comes in — they want the original. They’re good like that; they will support you if you’ve created a category and you’re driving that category.”If North has one regret, he says it’s being so focused on work that he was an “absent dad” to the four children he shares with his wife Karen. “It’s heartbreaking when I look back. I was so focused on the company, I used to work every weekend and until 11 o’clock every night, building businesses.”Despite now being 58, and his kids all being grown up, he says he still gets excited about creating new toys. “I love the company and I love creating products that elicit that wow from a kid or or a ‘kiddult’, and that’s the simplest part of the strategy in this business. If we do not create a toy that makes that kid or adult go ‘WOW’, then we’ve failed.”High fiveMy hero… apart from my wife, Karen, is Bernard Barnett, who was my inspiration to become an entrepreneur.My best decision… was building a succession team about five years ago. They run the business and develop the products and it’s freed me up to spend more time at home.AdvertisementMy worst decisions… have always been people-related. Hiring the wrong people stunts the growth of the company and holds you back.Funniest moment… has to be meeting my co-founders and seeing the arse/face towel for the first time.Best business tip… hire people who are better than you — and watch the cash.Business & MoneyRelated articlesHOW I MADE ITTaking over the family firm was not plain sailing, but it’s paid offFebruary 23 2025, 12.01amHannah Prevett, Deputy Editor, The Times Enterprise NetworkHOW I MADE ITI started my company in my kitchen. Now we’re really cookingFebruary 02 2025, 12.01amHannah Prevett, Deputy Editor, The Times Enterprise NetworkPROMOTED CONTENT"
