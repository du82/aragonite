["https://thetimes.com/business-money/money/article/could-you-afford-1800-a-week-for-a-care-home-r3qmqmg9g"]
title = "Could you afford £1,800 a week for care?"
description = "Costs are soaring as the population ages and wages and national insurance go up — it may be painful, but you need to start planning now, so you can pay later"
full_description = "Could you afford £1,800 a week for care?Costs are soaring as the population ages and wages and national insurance go up — it may be painful, but you need to start planning now, so you can pay laterILLUSTRATION BY KRYSTAL LOHRachel Mortimer, Assistant Money Editor | Ali Hussain, Chief Money ReporterThursday February 27 2025, 6.00pm, The Sunday TimesOne in seven nursing homes are charging self-funding residents more than £1,800 a week. The soaring costs stem from increasing numbers of residents with dementia and the looming rise in national insurance for employers. Those funding their own care are also paying thousands of pounds more than residents funded by their local authority, according to the healthcare analyst LaingBuisson. It estimates that the average weekly fee paid by councils for residential care is £908, while patients covering their own costs pay £1,278 — a difference of £370 a week or roughly £19,240 a year. For a room in a nursing home, where fees are higher because residents require a greater level of care, councils pay an average of £1,225 a week. Self-funded residents pay an average of £1,594. William Laing from LaingBuisson said: “Local authorities are using their large purchasing power to drive prices down and those paying for their own care are effectively subsidising the cost. Advertisement“People are paying more for their nursing and residential care if they pay privately than if their spot is paid for by the local authority.” Last year the government controversially scrapped plans that would have reduced the cost of social care for older people. An £86,000 cap on lifetime care costs had been due to kick in from October this year, and the assets threshold at which someone becomes responsible for paying the whole cost of their care was supposed to increase from £23,250 to £100,000. The chancellor Rachel Reeves ditched both of these plans shortly after taking office. • The big pension spending spree — and how to be part of itSocial care reform has been delayed another three years after the government launched an independent commission to look into fixing the broken system that will not conclude until 2028. Average care costs have risen about 18 per cent over the past three years. A week in a residential home for a private paying resident costs an average of £1,278, up from £1,086 in 2022-23. The average cost of a week in a nursing home has jumped to £1,594, up from £1,349 two years ago. Care and nursing homes have increased their fees to cover higher running costs and in anticipation of the April increases in employer’s national insurance, from 13.8 per cent to 15 per cent, and the national living wage from £11.44 an hour to £12.21. AdvertisementHomes are also putting up fees as they care for more residents with dementia, who often require more complex care.About one million people have dementia in the UK and this is projected to rise to 1.4 million by 2040, according to the Alzheimer’s Society. There were 153,800 private care home residents diagnosed with dementia at the end of 2024. Who gets their care paid for? Those who need social care in England and Northern Ireland get funding if they have assets of less than £23,250. In Scotland the threshold is £35,000 and in Wales it is £50,000.A family home is typically included in financial assessments for support, unless certain relatives, such as a spouse or a dependant, still live there once the person requiring care moves into a care home. Anyone who gets care in their own home will not have its value included in a financial assessment. Jane Pritchard, a nurse at the Good Care Group, said: “If you were to decide to pay for live-in care, you have the added value of being able to keep your family home, and the fee you pay for your care is for the support you get, rather than the room and board of a residential home. “Residential homes often charge fixed rates that include meals and other things such as hair appointments. If you’re paying for services you don’t need, this arrangement leads to higher costs than necessary.” AdvertisementAdults with complex health needs can be entitled to free care, at home or in a home, under a system called NHS continuing healthcare. This applies in England, Wales and Northern Ireland, but in Scotland a stricter scheme applies called hospital-based complex clinical care.NHS continuing healthcare is not means-tested so assets are not taken into account when deciding if someone qualifies, but it is notoriously hard to secure, with a success rate of about 20 per cent in England. Many care and nursing home residents are told they are not sick enough to qualify for the support. Eligibility is dictated by different integrated care boards across the country which have conflicting criteria, and the rules are so complicated that even healthcare professionals get them wrong. Applicants for NHS continuing healthcare go through a two-part assessment. The first part evaluates 12 areas of needs such as cognition, mobility and continence. The second part involves the applicant meeting care professionals, someone from the local NHS integrated care board and their own representative (usually a relative or friend).You can appeal against a rejection for funding, but this must be done within six months of the decision. The process can be gruelling and drawn out. AdvertisementSamantha fought for more than two years for funding for her 82-year-old mother, who suffers from dementia, after being rejected many times by the NHS and discouraged by a care home. When her mother moved into care in June 2022 she sold her home to pay the monthly fees of £7,000 — the sale proceeds would have covered about five years.Samantha applied for NHS continuing healthcare in October 2022 but said the manager at the care home near Eastbourne told her not to bother. “Everyone was so negative about the possibility of my mother getting it. It’s the first hurdle you have to get past,” said Samantha, whose name has been changed. • Unapologetic care home owes us £18,000 after my husband’s deathBut she insisted on an assessment and eventually got it in January 2023. The application was unsuccessful, but Samantha found that many of her mother’s conditions had been categorised as less severe than they actually were. “It felt as though they just wanted me to roll over and give up. I had to argue my mum’s case and convince them of her condition,” she said. AdvertisementThe application was finally accepted in July 2024, with the NHS admitting that it had made a mistake and refunding £140,000 already paid in care fees.Eligible adults in a home who do not qualify for NHS continuing healthcare can apply for NHS-funded nursing care, which is paid at a flat weekly rate of £235.88 directly to the home. It is intended to contribute towards the nursing element of care home fees and has a higher success rate than NHS continuing healthcare. It is only paid to residents getting care from a home registered to provide nursing care, so anyone staying in a non nursing home and getting care from a district NHS nurse does not qualify.Before they can apply for NHS-funded nursing care, residents must first apply for NHS continuing healthcare. Get ready for your care costsIt may be uncomfortable, but it is crucial to plan for possible care needs later in life. A general rule of thumb is to set aside £100,000 a year for your final three years, although this may not be enough if care home fees continue to go up at the present rate. One of the biggest worries is the uncertainty of how long you may need care, and the risk of running out of money. For those who want peace of mind that they can remain at their chosen care home for the rest of their life, it could be worth considering an insurance product known as an immediate needs annuity. This type of policy pays out a guaranteed monthly amount for care fees for the rest of the policyholder’s life. The monthly payments are made directly to the care home, so are not liable to income tax, and it’s possible to opt for a policy that increases each year as care fees rise (or you can use other assets to top up the difference). But the upfront cost of buying the policy is high, typically in the tens of thousands of pounds or more, and you may get back a lot less than you pay in. If you become eligible for state funding — for example if your health declines — you cannot cancel the policy, although it’s possible to have the monthly payments made direct to your bank account instead (but this could trigger an income tax bill). What support would you like to see from the government to help families?Business & MoneyMoneyRelated articlesI’ve got a ‘death file’ — everyone should have oneFebruary 22 2025, 12.00amAlice ThomsonMaking tea could ‘help keep dementia patients out of hospital’February 18 2025, 12.01amEleanor Hayward, Health EditorPROMOTED CONTENT"
