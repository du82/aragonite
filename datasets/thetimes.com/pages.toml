["https://thetimes.com/comment/columnists/article/jeremy-clarkson-liberating-a-golden-loo-thats-just-potty-r50mmnn0l"]
title = "Jeremy Clarkson: Liberating a golden loo? That’s just potty"
description = "Artists who make toilets out of gold are mocking the corduroy dullards"
full_description = "JEREMY CLARKSONJeremy Clarkson: Liberating a golden loo? That’s just pottyArtists who make toilets out of gold are mocking the corduroy dullardsJeremy ClarksonSunday March 02 2025, 12.01am, The Sunday TimesJeremy ClarksonSunday March 02 2025, 12.01am, The Sunday TimesSo let’s get this straight. Some men allegedly got together one day, decided they’d like to be burglars and reckoned Blenheim Palace would be a good place to start. I see their logic here. Palaces usually have many rooms, many of which haven’t been used since Henry VIII came for the weekend. And the alarm system is usually a man called Stancliffe, who’s supposed to sound a bugle if he detects any kind of unusual nocturnal activities. To make palaces even more appealing to the burglars, they are usually rammed full of valuable busts and paintings. No one will miss them till His Grace dies and some kind of inventory is necessary to keep Rachel from accounts out of the picture. The fully operational golden loo stolen from Blenheim Palace was titled AmericaTOM LINDBOE/BLENHEIM PALACE/PA“Does anyone know where that Rodin is kept these days?”“God, I haven’t seen it since Rupert painted a cock and balls on its face.” AdvertisementSo anyway, the alleged criminals decide they’ll rob Blenheim Palace in Oxfordshire, Oxford crown court has been hearing. According to the prosecution, they do some recces, posing as tourists on guided tours to check out the potential swag, and after researching access points and exfil options, stage their raid. They are said to have charged across the lawns in two stolen cars, skidding to a halt outside the palace, where they broke in through a window, hurtled past all the Gainsboroughs and Stubbses and … nicked a lavatory. I kid you not. One man is on trial for burglary; two others have denied conspiring to transfer criminal property. The bog in question was made from solid gold. Even the seat. It had been created by an artist called Maurizio Cattelan, who hit the headlines recently when he duct-taped a banana to a wall and sold it for $6.2 million. I like people who do this kind of thing — pickle sharks and display their unmade beds and so on — because I think the creators are taking the mickey out of the corduroy dullards who go to galleries and use words like seminal. I especially like the way Cattelan called his fully functioning golden lavatory artwork America. And invited the corduroy dullards to come and do their vegan, gluten-free poos in what was so very obviously a savage indictment of all that’s wrong with American capitalism. And they all fell for it. They all booked slots to come and crap on what they saw as Donald Trump with a U-bend. And now it’s been stolen, meaning Cattelan can trouser the insurance. I love the man.I especially like the way he used gold as the medium here, because I’m with him. When I see a gold anything, even a watch, I’m always filled with an immediate need to get away from the person who owns it. Because nothing says “I have no style or taste” more clearly than a gold Rolex. To understand what I mean, you have only to look at the imagery created recently to show the world what an American-owned Gaza Strip might look like. Because there, towering above all the casinos and bars and multiplex horrors is a gigantic statue of the Donald. And it’s not made from stone or wood. Of course it isn’t. It’s the go-to material for the thick and the unimaginative: gold. AdvertisementI can see why gold was used in the olden days to make coins. It was portable, malleable, non-toxic and rare enough to ensure that not everyone could dig a hole in the garden and make coins of their own. I can see too why nation states used the gold standard to fix exchange rates. Actually, I’m lying. I can’t see why they did this. But, whatever, as a result of this historical link between gold and wealth, we all swooned at people’s gold Amex cards in the Eighties and the golden glow that emanated from Marsellus Wallace’s briefcase in Pulp Fiction. You wear a gold watch or brandish a gold-plated Kalashnikov and what you’re saying is “I couldn’t help noticing that I’m considerably richer than you”. A golden bog is even more disgusting than that, though, because then you’re saying, “I have so much money that I will use 98kg of gold as a receptacle for my faeces”. I truly loathe this sort of ostentatiousness, and that’s why I was encouraged to read that in just 25 years’ time, scientists and geologists reckon the world will have no more gold to give. We’ve mined 244,000 tonnes of the stuff already and there’s maybe only 67,000 left. And when that’s been converted into lavatories for people whose superyacht bar stools are upholstered in whale foreskins, it’s all gone.It would be easy to say “good riddance”, but the world does need a safe haven in times of economic instability. I remember well boarding an 11-hour flight to San Francisco in 2008. In the lounge, everyone was watching Lehman Brothers go under and I had a sense my life savings were about to become worthless. So I switched the lot into gold. Which, by the time I landed in California, had rocketed in value by more than 50 per cent.We’re going to need something else that can be used in this way. Another rare metal. But one that cannot be used by Eurotrash playboys as jewellery. Rhodium is a possibility. It’s brittle and it’s even rarer than platinum. And that’s the problem. There are only 19 tonnes of the stuff on the entire planet, which isn’t enough for it to be used as an economic backstop.AdvertisementWhich is what draws me to plutonium. There are 2,000 tonnes of this lying around, so it’s rare but not ridiculously so. And there’s another advantage. If anyone tries to use a lavatory made of it, they’re going to discover that when they’ve finished, they will be flushing away quite a few of their internal organs.CommentColumnistsRelated articlesJEREMY CLARKSONFriends can’t stop boasting on Instagram and it’s making me miserableFebruary 23 2025, 12.01amJeremy ClarksonJEREMY CLARKSONHow to stop Gen Z being lazy and useless? Cut off their cashflowFebruary 16 2025, 12.01amJeremy ClarksonPROMOTED CONTENT"
