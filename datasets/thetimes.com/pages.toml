title = "Defence, drones, software and space: the final frontiers for investors"
description = "With the world becoming a less peaceful place, investors should consider exposure to the defence sector, Ian Cowie says"
full_description = "IAN COWIEDefence, drones, software and space: the final frontiers for investorsWith the world becoming a less peaceful place, investors should consider exposure to the defence sector, Ian Cowie saysIan CowieSunday March 02 2025, 12.00am, The Sunday TimesDefence is the “number one priority of this government,” Keir Starmer said last week as he announced the biggest boost to military spending since the Cold War in “a world where everything has changed”. One day later he flew to the US to meet Donald Trump, who has urged European countries to do more to repel the Russian invasion of Ukraine.Whether investors like it or not, our planet is becoming a less peaceful place — and our stock market portfolios should reflect that fact. Fortunately, or unfortunately depending on your point of view, defence spending is set to rise in the future, so it is not too late to consider some exposure to this sector.More than a decade ago your humble correspondent became a shareholder in Britain’s biggest armaments company, BAE Systems (stock market ticker: BA.), paying £3.36 per share in May 2010. To be candid, this peacenik was never that keen on bloody conflict but used to argue that BAE’s kit only killed Her Majesty’s enemies.That view suddenly came to seem superficial when a parliamentary arms exports committee reported how Saudi Arabia was using BAE weaponry to slaughter families in Yemen. So I sold the lot at £5.32 in September 2016, as reported here at that time.Since then Russia’s full-scale invasion of Ukraine has made such pacifism sound naive, so I bought back into BAE at £11.73 in January. Like the economist John Maynard Keynes, when the facts change, I change my mind.AdvertisementThe shares cost £14.10 at close of trade on Friday and continue to yield dividend income of 2.4 per cent. Better still, BAE has increased shareholders’ income by an annual average of 7.3 per cent over the past five years. While the shares are not cheap — priced at 20 times earnings — BAE has maintained an unbroken record of dividend payments for 30 years. Moreover, those payouts remain well covered, accounting for just 19 per cent of earnings.Similarly, defence, space and security spending accounts for a third of revenues at the American aerospace giant Boeing (BA), where I paid $139 last November for shares that cost $174 on Friday. I had originally invested at $126 in November 2014, intending to hold for ever, primarily for its business making passenger airliners. Then two Boeing 737 Max crashes caused me to bale out at $410 and $397 in February and March 2019, as also reported here at the time.• Our best stocks and shares IsasThe recent global trend towards increasing military spending began with a brutal wake-up call from Pete Hegseth, the American defence secretary. Last month he told European army, naval and air force chiefs in Brussels: “I am here today to directly and unambiguously express that stark strategic realities prevent the United States of America from being primarily focused on the security of Europe.”American anxiety over the rise of China is influencing a shift in defence spending towards Asia, with far-reaching effects on a wide range of businesses. Last month the US Defense Advanced Research Projects Agency announced that it had selected the software giant Microsoft to see if it could build a large-scale quantum computer, capable of performing more complex calculations than existing technology.AdvertisementUnlike conventional binary computers, where all the bits are either one or zero — on or off — qubits in a quantum computer can be both at the same time. With my cerebral software dating back to the 1950s, am I allowed to say I understand and don’t understand at the same time?More seriously, I am positively delighted to have paid $233 in January 2023 for Microsoft shares that cost $391 on Friday. They now sit just outside my top ten holdings by value.Keir Starmer announced the biggest boost to military spending since the Cold WarREUTERS/LEON NEALAt the other end of the corporate scale by size, I also have some indirect exposure to the specialist drone-maker AeroVironment, which is one of the top ten holdings in the investment trust Edinburgh Worldwide. Drones, or unmanned aerial vehicles (UAVs), are a dramatic example of how warfare is becoming more high-tech than ever before. Sometimes watching the videos of drones in action makes this old boy feel as if I am watching a science fiction horror story.On a brighter note, Edinburgh Worldwide shares that I bought for £1.52 in January last year, as reported here at that time, cost £1.74 on Friday. More than 12 per cent of this trust’s £750 million of assets are invested in Space Exploration Technologies, a company not listed on any stock market but where a recent fund-raising valued the business at $350 billion.SpaceX, as you might better know it, has more than 8,000 satellites in low-earth orbit and its subsidiary, Starlink, brings the internet and telephony to parts of the planet that might never have been reached by cable. However, this company also provides launch services to the American Department of Defense, sending classified satellites into space in return for $22 billion of government contracts.AdvertisementNobody would be happier than me if all the above businesses could get back to less lethal activities, with Boeing concentrating on taking people safely on holiday and SpaceX switching the whole planet online. But wishing won’t make it so and investors must deal with the world as it is.• How to invest £50,000Long before anyone had heard of drones or quantum computers, the Greek philosopher Plato and later Roman authors pointed out: if you want peace, you must prepare for war. New technology, same old human nature.F-35 Lightning jets are being made by Lockheed in partnership with BAE and othersGETTY IMAGESLockheed ‘idiots’ prepare to lock heads with the dronesShares in the German armaments giant Rheinmetall have soared 67 per cent since the start of this year, with its Swedish rival Saab surging 32 per cent skywards over the same period. Meanwhile, America’s biggest military manufacturer, Lockheed Martin, has seen its stock slip 7 per cent.The explanation is partly that European companies are likely to benefit most from continental countries spending more on our own defence as America pivots to Asia. But Lockheed has also been bruised by conflict with the billionaire Elon Musk, who is “first buddy” to Trump.AdvertisementMusk claims that stealth fighter jets, such as the F-35 Lightning made by Lockheed in partnership with BAE and others, are backed by “idiots”. He argues that F-35s are poor value at £90 million each and that “manned fighter jets are obsolete in the age of drones”. But Paul Livingston, the chief executive of Lockheed’s British arm, claims that stealth fighters — including China’s Chengdu J-20 — have important advantages over drones. He said: “The Chinese are still building their J-20 jets. Maybe Elon thinks they’re idiots as well, because those are manned fighters.“If you see 400 of those flying across the Taiwan Straits, you’d better have something there to meet them or you’re going to lose. The reality is if you’ve got a £30,000 drone, that’s not going to have any effect.”Which view wins Trump’s support will determine whether Lockheed shares are considered good value. While Rheinmetall and Saab both pay 0.6 per cent income, Lockheed yields 3 per cent and is just four years short of attaining the highly prized status of “dividend hero” — or a share that increased investors’ income for 25 consecutive years.Business & MoneyMoneyRelated articlesIAN COWIEThis could be the moment European stocks catch up with the USFebruary 23 2025, 12.00amIan CowieIAN COWIEFive years on from the Covid crash, here’s what investors have learntFebruary 16 2025, 12.00amIan CowieFull disclosure: Ian Cowie’s shareholdingsFebruary 05 2025, 2.20pmIan CowiePROMOTED CONTENT"
