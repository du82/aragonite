title = "A seismic shift in the NHS has just been announced, and no one even noticed"
description = "There’s a very old joke about an Irish yokel giving directions to a tourist: “Well, I wouldn’t start from here.” It’s so old I hesitate to use it. Except that it also happens to be the best possible"
full_description = "ROBERT COLVILEA seismic shift in the NHS has just been announced, and no one even noticedRobert ColvileSunday March 02 2025, 12.01am, The Sunday TimesThere’s a very old joke about an Irish yokel giving directions to a tourist: “Well, I wouldn’t start from here.” It’s so old I hesitate to use it. Except that it also happens to be the best possible description of how you’d reform the NHS. The public tend to think of the health service as a single, monolithic system. But it’s nothing of the kind. It’s a bewildering hotchpotch of agencies and organisations, mashed together and torn apart by decade after decade of reforms, initiatives and reorganisations, by concessions and compromises so ancient they have formed their own sedimentary layers.For the past decade, one of those reorganisations has been particularly significant. The Health and Social Care Act — the disastrous fruit of Andrew Lansley’s plan for reform — resulted in a system whereby the NHS in England was run by a giant quango (NHS England), which in turn took direction from the Department of Health and Social Care.The idea, at least in part, was to take the health service out of politics: to let NHS managers focus on managing, while the politicians held them to account.The problem, of course, is that the NHS can never be taken out of politics. Instead, all that happened was a succession of health secretaries butted heads, both in public and in private, with the quango over the river.AdvertisementMinisters and advisers would complain again and again that they were being forced to negotiate in public with their own largest spending department, that NHS England staff were duplicating or even blocking their efforts, that it was too hard to get anything bloody done. Annual spending programmes, which were meant to be agreed in the autumn, would be wrangled over for months. Last year trusts got the details three working days before the start of the financial year.“Every prime minister since Blair told every health secretary to grip the NHS,” says Jeremy Hunt, who held the job from 2012 to 2018. But they didn’t actually have control of the steering wheel. “So every health secretary, including me, just added more targets.”• NHS England chief’s exit signals return to ministerial controlThis is the context for last week’s announcement that Amanda Pritchard, the head of NHS England, would be stepping down. It didn’t get huge attention, given the gravitational impact of President Trump on the news agenda, but it represents arguably the most seismic shift since Lansley in the management of England’s most important, and overwhelmingly most expensive, public service.The argument that Wes Streeting, the health secretary, makes — which, to be fair, sounds an awful lot like the one Hunt makes — is that the NHS is far too big, and too messy, to be controlled from the centre. Indeed, that’s why pretty much none of our neighbours set up their health services that way.AdvertisementFor those in charge of NHS trusts in particular, the system is a nightmare. They have huge budgets, and life-or-death responsibilities, but less autonomy than even the most junior manager in the private sector.Instead, their job is to accommodate an endless stream of targets and directives from NHS England, which also reserves the right to sign off any remotely significant decision. And if they somehow keep their trusts in surplus, the cash will be taken by Whitehall. No wonder they have told Streeting they feel “infantilised”.The health secretary’s plan — the reason Pritchard left — is to turn the system into something much more like education (even as his counterpart there, Bridget Phillipson, attempts the reverse). Trusts will be given more freedom. NHS England will shrink substantially: several thousand job cuts have already been announced.• Why did Amanda Pritchard quit as NHS boss — and what’s her legacy?The quango will run things centrally where that makes sense, such as procurement, or making it easier to share data, deploy AI, introduce new medical devices or carry out clinical trials (much of which is now negotiated, grindingly slowly, trust by trust).AdvertisementMore generally NHS England will shift to something of an Ofsted-style role: holding trusts accountable, publishing performance data, intervening when they are failing. Money will follow the choices of patients, just as it does the choices of parents. Trusts that save money may even get to reinvest some of it in capital projects.All of which sounds … well, pretty reasonable, actually. But of course there are some fairly monstrous obstacles.First, it still seems desperately odd to do a massive NHS reorganisation while punting social care — its umbilical twin — into the long grass. But even when it comes to the NHS, the devil is in the detail. It is always easy to talk of devolving power, but the instant the headlines turn sour, the grip starts to tighten. Likewise, how do you shift resources from hospitals and into primary and community services (the reformers’ perennial dream), while also relaxing control?Furthermore, the thing that really greases the wheels of public sector reform is money. For instance, it is all very well to talk about choice. But choice depends on capacity: if your wait for an operation is nine months at the good hospital and one month at the bad, you’ll take the bad. And the NHS’s finances, and performance, are in a dreadful state. The Office for National Statistics recently reported that productivity is still almost 20 per cent down from before the pandemic. The Nuffield Trust points out that trusts’ financial deficits, in almost every part of the country, are significant and growing. And while the NHS did get a 4 per cent spending increase in the budget, that will have to cover (among other things) a whacking great pay rise for junior doctors. Already trusts are being asked to make efficiency savings of 4 per cent, almost double last year’s target. And demand continues to rise and rise.AdvertisementThere is also the sorry track record of previous reform efforts. A hospital boss once complained to me that attempts at “simplification” had resulted in the levels of bureaucracy above her being cut from three to twenty-four.It was particularly striking that integrated care boards failed to get a single mention in Streeting and Pritchard’s letters to each other. It was only an institutional eye-blink ago that these bodies were being billed as the saviours of the NHS. The dominance of the big hospitals would be broken. Money would go where it was really needed. Bed-blocking would evaporate as trusts, GPs, social care services, councils and community organisations all joined together to sing Kumbaya.Instead the ICBs have amounted largely to a bureaucratic job-creation scheme. Good trusts are still good trusts. Bad trusts are still bad trusts. The big hospitals are still the big players. And all that money still isn’t enough.Perhaps this latest reform will be the one that cracks it. Streeting is certainly saying all the right things. But history suggests that the ten-year plan his team is drafting may end up like so many other plans and visions and programmes over the years: just one more layer of sediment on the pile.CommentColumnistsRelated articlesROBERT COLVILEThe carbon noose is tightening. Can Labour keep voters onside?February 23 2025, 12.01amRobert ColvileROBERT COLVILEIt’s mad to give migrants leave to remain when we’ve no idea if they contributeFebruary 09 2025, 12.01amRobert ColvileROBERT COLVILE34 years and counting to build a reservoir. Good luck with growthFebruary 02 2025, 12.01amRobert ColvilePROMOTED CONTENT"
