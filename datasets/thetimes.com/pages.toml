title = "The best podcasts and radio shows of the week"
description = "Not sure what to listen to? This is your ultimate audio guide, updated weekly by our critics"
full_description = "The best podcasts and radio shows of the weekNot sure what to listen to? This is your ultimate audio guide, updated weekly by our criticsClair WoodwardSunday March 02 2025, 12.01am, The Sunday TimesHelena Bonham Carter remembers wartime heroes (Radio 4, Tuesday, 3pm)STEVE BRIGHT/BBCClair WoodwardSunday March 02 2025, 12.01am, The Sunday TimesSearching for the best radio and podcasts to start the new year? Whether you enjoy insightful discussions, fascinating stories or the latest music, our experts curate a weekly selection of essential must-listen content. From thought-provoking dramas on Radio 4 to Times Radio’s in-depth analysis, this is your ultimate audio guide.Check back every week for updated recommendations from our critics.SundayBetween the Ears (Radio 3, 7.15pm)Diaries from 1938 combine with music by Emily Levy to reveal the impact of radio’s early days. The producer Beaty Rubens has uncovered notebooks by Hilda Jennings and Winifred Gill, who were commissioned by the BBC to conduct a survey on the impact of broadcasting on everyday life by interviewing listeners. The comments are a delight, with people bemoaning the loss of gossip as a result of wireless listening, people changing their routines to stay in and listen to the radio, and one listener saying that radio “beautifies your life”.David Tennant Does a Podcast With… (podcast)After four years Tennant returns with a third series of his gimmick-free interview podcast with big names in entertainment. He is an enthusiastic and funny host, which means relaxed conversation with guests who include Stanley Tucci, Jameela Jalil and Russell T Davies.Theatre of Crime (podcast)A new series in which the actors Pearl Mackie, Emma Sidi and Kiell Smith-Bynoe mix true crime and audio drama. They investigate the unsolved Camden Town murder of 1907, in which the sex worker Emily Dimmock was gruesomely killed, and the cast perform and react in real time to court transcripts, police records and witness testimonies from the case, which was one of the first that involved the public and media joining to find the murderer.AdvertisementWorkers in the 1960s at an asbestos factory in BallyclareWALTER NURNBERG/GETTY IMAGESMondayAssume Nothing — Killer Dust (Radio 4, 1.45pm)A new series of the BBC Ulster investigative strand has Ophelia Byrne discover a newspaper story about the opening in 1967 of a factory in Ballyclare, where employees were not allowed to discuss what they did and what the factory made — it was making asbestos cement. Byrne’s investigation into the factory’s owners takes her down a rabbit hole of documents that not only show cover-ups about the effects asbestos had on factory workers in Ballyclare and beyond, but also asks what government agencies knew about its risks.New Generation Artists at 25 (Radio 3, from 6.30am)The station’s programme, which supports a group of artists on the verge of international careers each year, celebrates its 25th anniversary with a day of special programming. There are editions of Breakfast, Essential Classics (9.30am) and In Tune (5pm) featuring live music from present and previous NGAs including from the Wigmore Hall, London, for In Concert (7.30pm).Down the Caff (podcast)If you like your interview podcasts rough around the edges, then this one, fronted by the siblings Anna and Nev Pellicci, the third-generation owners of the famous E Pellicci café in the East End of London, is the one for you. They talk to their celebrity clientele, who in this second series include Dermot O’Leary, Roisin Murphy and Miles Kane.• Lauren Laverne is back: look out, Radio 2!TuesdayHistory’s Secret Heroes (Radio 4, 3pm)The third series of the Helena Bonham Carter-narrated series on the unsung heroes of the Second World War begins with Noor Inayat Khan. Born in Moscow to an Indian father and American mother, and also living in Britain and France, she became a member of the Special Operations Executive and under the codename Madeleine worked as a wireless operator sending messages to the Allies from France. Betrayed and captured, she gave nothing awayto the Nazis, before being murdered at Dachau concentration camp in September 1944, aged 30.AdvertisementAssignment (BBC World Service, 9.30am)Arsenii Sokolov looks at how Vladimir Putin is trying to manipulate the Russian middle class into supporting the war with Ukraine. Families of soldiers killed in the conflict are being given large amounts of money and special educational opportunities by the Kremlin. Losing their relatives results in benefits that means they can turn their lives around. But how is the money really being spent?Lunchbox Envy (podcast)From the makers of the QI spin-off podcast No Such Thing as a Fish comes a new series full of food facts, with the QI elves Manu Henriot, a former chef, and the gastronome Jack Chambers joined by the chef and food writer Rosie MacKean. They will be revealing which country hosts a testicle-cooking competition.WednesdayDrama on 4 (Radio 4, 2.15pm)Gareth Farr’s Shandyland has all the energy of the classic, female-driven days of soaps, and like many of them is set around a northern pub. Baby Amy (Sophie Cox) is born there in 2002, and she narrates the play over the years until her 21st birthday, when the landlady and matriarch Sally (Siobhan Finneran), who rules family and pub with an iron fist, hands the keys to her. Amy’s life is linked to the business, and she reaches a point where only she can decide the future of her fractured family. An involving portrayal of intergenerational expectations.The Woman-Machine (Radio 4 Extra, 10am)Part of a series of programmes in the run-up to Saturday’s International Women’s Day. Elizabeth Alker examines the world of women and electronic music, using the work of the composer and academic Pauline Oliveros, the founder of the San Francisco Tape Music Centre, whose theories around deep listening as a feminist act influenced many of her followers. Alker also talks to the musicians Anna Meredith, Holly Herndon and Afrodeutsche.Reclaiming with Monica Lewinsky (podcast)In a new weekly series the woman remembered for her bombshell relationship with Bill Clinton is joined by guests who talk about reclaiming what has been taken from them in their lives. Other guests include the actresses Olivia Munn and Molly Ringwald.Advertisement• The best podcasts for 2024 — chosen by our criticsScott Mills will be joined by Jacqueline Wilson on World Book DayDAVID LEVENSON/GETTY IMAGESThursdayWorld Book Day on Radio 2 (from 6.30am)To celebrate the event, daytime programming on the station will be celebrating children’s books by talking to authors and dressing up as their favourite characters. On the breakfast show (6.30am), Scott Mills will be joined by Jacqueline Wilson, while Jeremy Vine (noon) will be talking to Julia Donaldson about listeners’ favourite books, while dressed as the Gruffalo. This week’s Radio 2 Book Club podcast will be devoted to young readers, with Stephen Mangan’s The Fart That Broke World Book Day being reviewed by children.The Documentary (BBC World Service, 9.30am)The story of how Yazidi women and girls are taking control of their lives and healing from the abuse they have suffered at the hand of Islamic State by taking up boxing. In northern Iraq Taban Shoresh and her team realised that women were receiving limited mental health support, so began to offer victims boxing training to help them channel their emotions. Is it working?Putt & Strut (podcast)The relentlessly enthusiastic Anton Du Beke and the Sky Sports presenter Sarah Stirk present an entertaining new twice-weekly golf podcast with the usual mix of celebrity guests including Jodie Kidd, Adrian Chiles, Les Ferdinand and Judy Murray talking about their game, plus genuine golfing giants, beginning with Colin Montgomerie offering pro tips.FridayBodgers, Banks and Sparkes (Radio 4 Extra, noon)A station premiere of the 1986 sketch show featuring members of the team who would go on to create the C4 comedy Absolutely — Moray Hunter, Gordon Kennedy, Peter Baikie, Jack Docherty, John Sparkes and Morwenna Banks. Because it’s so silly the material stands up incredibly well, including sketches about overpriced cocktails with rude names, a spoof quiz show called Meet the Know-Alls and an early appearance of Sparkes’s Welsh poet Siadwel talking about his schooldays wearing flared underpants.AdvertisementRoyal Philharmonic Society Awards (Radio 3, 7.30pm)This year’s RPS awards celebrating the UK’s classical music scene took place last night at the Royal Birmingham Conservatoire, introduced by Jess Gillam and Tom McKinney. This highlights programme features special guests and live music from winners and nominees, who include Radio 3’s Sunday Feature: Classical Africa (BBC Sounds) in the Storytelling category.The Leaders (podcast)A mini-series of Dan Snow’s History Hit podcast which examines the leaders whose decisions shaped the modern world takes the 80th anniversary of the end of the Second World War as its theme. Snow and Professor Phillips O’Brien will look at the strategies and decisions of six key leaders. Last week’s episode looked at Hitler, this week’s at Churchill. SaturdayOpera on 3 (Radio 3, 6pm)As part of the station’s all-day celebration of International Women’s Day, a performance of Ethel Smyth’s The Forest, with John Andrews conducting a cast of British soloists with the BBC Singers and BBC Symphony Orchestra.Which podcasts have you enjoyed listening to recently? Let us know in the commentsCultureTV & RadioRelated articlesFive-star podcasts to enjoy in 2025 — from Bob Mortimer to Vogue WilliamsJanuary 05 2025, 12.01amPatricia Nicol, Radio and Podcast CriticWhy are thousands of us paying to watch a podcast live?December 15 2024, 12.01amPatricia Nicol, Radio and Podcast CriticPROMOTED CONTENT"
