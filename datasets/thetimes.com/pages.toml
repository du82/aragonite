["https://thetimes.com/business-money/companies/article/wh-smith-name-to-disappear-from-high-streets-after-sale-kcrqn95jl"]
title = "WH Smith name to disappear from high streets after sale"
description = "The move comes as the retailer struggles to compete with the rise of online shopping and discounters"
full_description = "WH Smith name to disappear from high streets after saleThe move comes as the retailer struggles to compete with the rise of online shopping and discountersSam Chambers | Oliver GillSaturday March 01 2025, 10.30am, The Sunday TimesWH Smith’s chief executive, Carl Cowling, is thought not to want to run two separately owned businesses under the same nameRICHARD POHLE FOR THE TIMESSam Chambers | Oliver GillSaturday March 01 2025, 10.30am, The Sunday TimesWH Smith’s name is set to disappear from British towns after more than 230 years as the retailer plots a sale of the chain without the rights to its brand name.It is running a process to offload its struggling high street business to focus on its faster-growing travel arm. However, the retailer, run by chief executive Carl Cowling, is understood to believe that it is not practical to have two separately owned businesses trading under the same brand.The culmination of a sale would almost certainly result in the disappearance of a high street brand that has been an ever-present since 1792, when WH Smith opened its first shop in central London. It will raise concerns that the retail group is seeking to distance itself from any fallout from the sale and prompt questions about the long-term future of many stores.The auction, which is being run by bankers from Greenhill, has drawn interest from investment firms Alteri and Modella Capital, which both specialise in buying and restructuring distressed retailers. First-round bids were submitted last week.WH Smith’s high street arm has been stuck in long-term decline as the expansion of supermarkets and discounters, as well as the rise in online shopping, have combined to lure customers away from the high street.AdvertisementThe retailer’s 500 high street stores have an average lease length of just two years, raising the prospect that many underperforming outlets could be quickly closed under a new owner. Almost 200 WH Smith stores also contain a post office.WH Smith’s high street business generated a so-called trading profit of £32 million on sales of £452 million in the year to August. Like-for-like sales fell 3 per cent in the high street business during the 21 weeks to January 25.The group’s travel retail business — whose stores trade under the WH Smith banner, as well as InMotion and MRG — generates 85 per cent of the group’s profit.Potential buyers — which also include Doug Putman, the Canadian tycoon who rescued HMV — will be set a timeframe under which they would need to relinquish the brand name. A source close to WH Smith said bidders were attracted to the retailer because of its strength across multiple product categories and its clear “hub of the high street” strategy. While a deal under which a new owner licenses the WH Smith brand name is understood to be unlikely, it is not entirely out of the question.The new owners of WH Smith will need to contend with subdued consumer spending and rising costs. Increases in the minimum wage and employers’ national insurance contributions, announced at last October’s budget, will add £20 million to WH Smith’s cost base this year.AdvertisementA WHSmith store in 1918. The chain has been on British high streets since 1792WHSMITH“WH Smith has a very disparate product offering and the brand name has been the glue that has held it together — without that it’s going to be very difficult [for a new buyer],” said retail expert Richard Hyman, of Aria Intelligent Solutions consultancy.WH Smith, which started as a news vendor, and once owned bookseller Waterstones and music retailer Our Price, enjoyed its halcyon days in the Seventies and Eighties. However, as shoppers deserted the high street, WH Smith reacted by cutting costs and scaling back investment in its high street estate. Patrick O’Brien, retail research director at GlobalData, said the cost-cutting had taken a toll on the health of the brand but it still “has a place in the nation’s heart”.Despite WH Smith’s reluctance to license its name, there is one famous British precedent: engineering group Rolls-Royce split from its sister company Rolls-Royce Cars in 1973. The motor company is today owned by BMW and licenses the Rolls-Royce name and logo from the jet-engine maker.⬤ The upcoming sale of the Lexicon shopping centre in Bracknell, Berkshire, will provide another test of high street sentiment. The centre’s owners, Schroders and L&G, have appointed property agents from JLL to handle the sale, which kicks off this week. The owners are understood to be hoping to fetch £150 million for The Lexicon, which is home to retailers including Marks & Spencer and Next.Business & MoneyCompaniesRelated articlesWH Smith struggles on high street at Christmas as travel shops flyJanuary 29 2025, 5.00pmIsabella Fish, Retail EditorWH Smith pulls the plug on 230 years of high street historyJanuary 25 2025, 6.00pmJim Armitage, Business Editor | Sam ChambersPROMOTED CONTENT"
