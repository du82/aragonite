title = "What have I learnt at 30? How to order wine and cook roast potatoes"
description = "I’ve updated my advice to my 18-year-old self. Here are my tips on everything from relationships to socialising"
full_description = "CHARLOTTE IVERSWhat have I learnt at 30? How to order wine and cook roast potatoesI’ve updated my advice to my 18-year-old self. Here are my tips on everything from relationships to socialisingCharlotte IversSunday March 02 2025, 12.01am, The Sunday TimesYou are reading this column on what, I suppose, is the first day of the rest of my life. Yesterday was my 30th birthday. I spent it at the wedding of two friends (congrats, Greg and Laura — hope you didn’t mind my making the whole day about me). This feels as good a way as any to start a new phase of life: one where I’m not exactly old, but definitely not young any more either.So far, I have not had the stereotypical breakdown associated with turning 30. Instead I feel rather lucky. Lucky for all the obvious reasons — nice boyfriend, nice friends, nice job that consists largely of finding nice places to eat. But also lucky in a more historical sense.Being 30 is not what it used to be. I think frequently about the fact that I am part of one of the first few generations of women whose twenties did not automatically consist of marriage, children, responsibilities. I consider it the most extraordinary privilege to have been given a bonus decade of fun compared with my grandmothers. It was with this in mind that I found myself thinking back to the first column I wrote for The Sunday Times Magazine, two years ago: my advice to my 18-year-old self, on the occasion of turning 28. Reading it now, I feel exactly as one should when confronted with one’s younger self: affectionate, nostalgic, slightly embarrassed.I stand by much of what I wrote (in particular, it remains an excellent piece of advice that mayonnaise really does go with everything). But much of the article seems to have been written by someone barely recognisable as the person I am now. The author of that article is a party girl, entirely unencumbered by obligations and responsibilities. She’s more free, more spontaneous, less grounded, and — I think, on balance — less happy than me.AdvertisementWith that in mind, and with the caveat that I expect to look back on this article in a few years with an equal degree of embarrassment and nostalgia, here’s an updated selection of the advice I’d give to myself at 18, but also to myself at 28.Nearly everything you think about life is wrong, but that doesn’t mean you should stop thinking it. Not yet, anyway. There’s a lot of fun to be had in being wrong. You are, however, correct that both your coffee and your clothes should be black, and that you should be taking advice entirely from women in their fifties. The latter principle will need a mild update, as your mum’s 60th birthday is coming up.Three Diet Cokes a day is too many. I’m sorry. I know you don’t want to hear that. But it is.It is always, always, worth paying extra to avoid catching a flight that takes off at 6am or lands at 11pm. Do not pretend you’ve forgotten this next time you hear the siren call of Ryanair.The way to order the cheapest wine in a fancy restaurant is to look the sommelier firmly in the eye and say, “I’m going to go for this one, because I’m assuming that if it wasn’t great it wouldn’t be here.”Adopt a zero tolerance approach to Pret A Manger. Just don’t go in. It only makes you sad.AdvertisementAlways cook roast potatoes for longer than you think you need to. My dear friend Agnes gave me this piece of advice for that column I wrote two years ago, and I put it in, though I wasn’t wholly convinced. Agnes died, not long afterwards, at 35. Now I cook my roast potatoes far longer than I used to, and I think of her every time I do. That’s what we get instead of immortality. It’s not much, but it’s something.Don’t act as though you’re going to get a second go at life. By this I mean: never stay in a relationship because you can’t be bothered to end it. Never get married or have children just because it feels as if it’s time, or because everyone else is. Never do anything just because everyone else is. Leave the house when you think you can’t be bothered to. Leave the party when it stops being fun.Going to the gym will improve your life immeasurably, which is embarrassing given how many years you spent laughing at your mates for going to the gym.The best dinner party recipe is, incongruously, David Cameron’s sausage pasta from The Eton Cookbook.Nearly half of all marriages end in divorce. This, it turns out, is why you cry at weddings. Not because it makes you sad, but because it makes the choice to get married the most astonishingly romantic leap of faith. To know what the chances are, and to try anyway? To look at the stats and say “not our love — our love is different”? That’s a wonderful thing to watch your friends do.AdvertisementDo not tell everyone you know that the best dinner party recipe is David Cameron’s sausage pasta, otherwise you will spend the next two years of your life eating nothing but David Cameron’s sausage pasta.Watching your silly little mates from university become serious people with serious jobs will make you extraordinarily proud. Like a preview version of being a parent, only cheaper and less messy. Watching those serious people become unserious again over Sunday lunch is one of life’s great joys. Give Philip Roth a second chance. And a third.Very expensive shoes fall apart just as quickly as normal shoes. Don’t pretend you’ve forgotten this next time you’re in Selfridges.Don’t drink on an empty stomach.Life can be extraordinarily fun if you fill it with nice dinners, nice holidays and nice trips to the theatre and the Continent. Nonetheless, one day you will wake up with the feeling that perhaps there is something more important in life than having fun. Work out what that thing is, and spend this next chapter of your life chasing it.AdvertisementAlways carry blister plasters.CommentColumnistsRelated articlesCHARLOTTE IVERSWhat I’d tell my 18-year-old self 10 years onJanuary 29 2023, 12.01amCharlotte IversCHARLOTTE IVERSWhip’s shocking diaries raise a question: what is wrong with MPs?February 23 2025, 12.01amCharlotte IversCHARLOTTE IVERSLet she who’s never been rude in a group chat cast the first stone at MPsFebruary 16 2025, 12.01amCharlotte IversPROMOTED CONTENT"
