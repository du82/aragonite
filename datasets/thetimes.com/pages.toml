["https://thetimes.com/business-money/money/article/the-care-cans-been-kicked-down-the-road-long-enough-8xpqpbc6x"]
title = "The care can’s been kicked down the road long enough"
description = "It can cost £100,000 a year to live in a nursing home — we need a plan for paying the bills, before it’s too late"
full_description = "JOHANNA NOBLEThe care can’s been kicked down the road long enoughIt can cost £100,000 a year to live in a nursing home — we need a plan for paying the bills, before it’s too lateJohanna Noble, Money EditorSunday March 02 2025, 12.00am, The Sunday TimesHow much have you put aside for care costs — £15,000? £150,000? It doesn’t really matter how much it is, because the chances are it won’t be enough.One in seven nursing homes now charge £1,800 a week or more, according to the consultancy LaingBuisson, whose Care Homes report was published on Thursday. A year’s stay would set you back about £94,000.Costs also vary significantly across the country. Fees are typically higher in the south east of England but lower in the north east and Yorkshire. Ridiculously, anyone who is paying for their own care will pay more for the same care in the same home as those whose care is funded by the local authority. In some areas, the difference can be more than £600 a week.Lisa Caplan from the investment firm Charles Stanley said she generally advises clients to budget for costs of £100,000 a year for the last three years of life — £300,000, ouch! Anyone who is still years away from needing care can expect far higher bills because annual price increases of ten per cent have been reported at many homes.AdvertisementIt’s like asking how long is a piece of string: it is impossible to know just how much you will need for care costs — if anything. Discussions about long-term care and how to pay for it often end up at the bottom of politicians’ priority lists. For years there were talks about a care cap, a proposed limit on the amount of money a person would pay for care in England over their lifetime. The cap was to be set at £86,000. It would only have applied to personal care costs (such as help with washing and eating) meaning that you would still have had to foot the huge bills for accommodation and energy bills, but it was a start. The cap was meant to come into effect in October 2023. First it was first delayed and then, shortly after Labour won last year’s general election, it was scrapped altogether. There is now (yet another) independent commission to look into the problem, which will not present its conclusions until 2028.• Getting NHS care funding is a battle — and you probably won’t win• Care home safety ratings can’t be trusted, says watchdog bossWhat happens when you kick the care can down the road? You create a bigger problem further along the line. We have now reached that line: care costs have become completely unaffordable for most people.AdvertisementThe biggest bills are faced by those with assets to their name. Only if you have less than £23,250 in savings, investments or property will the council look after you; above that, you are on your own. And not even your home is safe. Unless your spouse, or a dependent, is still living in the property, you will be expected to sell it to foot care costs.Generally the only help available is through NHS continuing healthcare, which should be provided to seriously ill adults. The funding on offer in England, Wales and Northern Ireland should mean that those with serious health needs get free care, at home or in a home. Scotland has a similar scheme called hospital-based complex clinical care. The funding is not means-tested, but it is notoriously difficult to get — only 22 per cent who applied for it in 2022-23 were accepted, according to NHS England.The problem is the way it is assessed: eligibility is dictated by integrated care boards with conflicting criteria, and there are two extremely complicated assessments you have to go through.Those suffering from dementia are particularly likely to fall foul of its tick-box assessment. This is because the nature of conditions such as Alzheimer’s means that there are good days and bad days — the NHS may do its assessment on a good one and conclude that someone does not have serious needs.AdvertisementI once spent a summer working in a nursing home. I’ve seen first-hand how the disease can play out; some having days of anger or reverting to a younger version of themselves, others full of clarity. Surely, these are some of the people who need help the most?The care system is completely broken. Launching an independent review that won’t conclude for another three years is not good enough — the costs need to be addressed now.@JohannaMNobleBusiness & MoneyMoneyRelated articlesJOHANNA NOBLEOpen door, open wallet. Welcome to the forever cost of parentingFebruary 23 2025, 12.00amJohanna NobleCould you afford £1,800 a week for care?February 27 2025, 6.00pmRachel Mortimer, Assistant Money Editor | Ali Hussain, Chief Money ReporterJOHANNA NOBLEScrap cash Isas? Absolutely notFebruary 16 2025, 12.00amJohanna Noble, Money EditorPROMOTED CONTENT"
