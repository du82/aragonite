title = "Corrections and Clarifications"
description = "Complaints about inaccuracies in all sections of The Sunday Times should be addressed to complaints@sunday-times.co.uk or Complaints, The Sunday Times, 1 London Bridge Street, London SE1 9GF. Find"
full_description = "Corrections and ClarificationsThe Sunday TimesFriday February 14 2025, 3.00pm, The Sunday TimesComplaints about inaccuracies in all sections of The Sunday Times should be addressed to complaints@sunday-times.co.uk or Complaints, The Sunday Times, 1 London Bridge Street, London SE1 9GF. Find more details on our complaints procedure here. In addition, the Independent Press Standards Organisation (Ipso) will examine formal complaints about the editorial content of UK newspapers and magazines.■ February 16, 2025Some figures given for council tax under local authorities with permission to make exceptional increases this year wrongly factored in rises for services that should not have been included (Money, Feb 9), while the figures for Bradford excluded some charges, such as those for police and fire services, which also fall under the tax. We apologise for the confusion.■ February 9, 2025A new police centre to tackle violence against women and girls will be based in Ryton-on-Dunsmore, Warwickshire, not Ryton, Tyne and Wear, as we wrongly said (News, Feb 2). Advertisement■ January 26, 2025We wrongly referred to Oliver Heath as an architect (Home, Jan 12). He is an architectural and interior designer.■ January 12, 2025We wrongly said that Kemi Badenoch and Ed Davey declined to speak at a farmers’ protest held in London last November (News, last week). Both made speeches at the event.■ December 29, 2024AdvertisementA chart wrongly indicated that the total cost of a Christmas dinner rose by 117 per cent between 2021 and 2024 (Money, last week). This was a miscalculation on our part. The actual increase, based on figures supplied by Interactive Investor, was 33 per cent.We wrongly said the state pension age would gradually increase to 67 by 2036 (Money, last week). The increase will be complete by 2028.■ December 8, 2024Dr Kieran Mullan MP voted against the assisted dying bill, not in favour as we wrongly said (News, last week).We reported suggestions from Labour sources that Sam White leaked details of Louise Haigh’s conviction for fraud (News, last week). Mr White has informed us the suggestions are baseless. We accept this and apologise for any distress caused.AdvertisementWe reported that 1.6 million houses were built since 2010 under the Conservatives (“Labour ‘will build fewer houses than the Tories’”, Business, Nov 17). In fact the figure represents net additions to the UK housing stock in the last six years of Conservative rule.■ November 10, 2024We said in a review that Hanif Kureishi has always seen writing as “an act of relentless self-renewal” (Books, last week). Professor Ruvani Ranasinha has asked us to make clear that she first coined the phrase in her biography of Kureishi, Writing the Self. We are happy to put this on record.■ October 13, 2024In “ISG owner breaks silence on firm’s collapse” (Business, Sep 29), we incorrectly reported that Cathexis was facing a liquidity crisis (rather than a liquidity event) and that it attempted to sell ISG after Goldman Sachs refused to extend Cathexis a further line of credit and asked it to begin paying down debts. The events are unconnected. We are happy to apologise for the inaccuracy.Advertisement■ October 6, 2024We said the reported cost of an outfit worn by Radhika Merchant at a pre-wedding celebration was $900 million (World News, July 7). In fact the figure related to spending on the whole event rather than the outfit alone.■ September 22, 2024We said that over six years 20 pedestrians were killed in collisions with cyclists (News, last week). The figures cited were for the period 2011-16. We are happy to make this clear.■ September 8, 2024AdvertisementWe said John Lewis is planning to restructure its department store management teams in a move likely to herald job losses (Business, last week). John Lewis says there are no current plans to reduce management roles at the company, and it is wholly inaccurate to suggest otherwise. We are happy to put this statement on record.We wrongly said the £22 billion “black hole” in the UK’s finances is 0.0183 per cent of government spending (News, last week). The correct figure is 1.83 per cent.■ September 1, 2024We said a dozen Labour MPs, led by Rupa Huq, joined a Zoom call to air concerns about changes to the winter fuel payment (News, last week). Ms Huq has informed us that while a government briefing call took place, she did not speak, or play any leading or organising role. We are happy to put this on record.■ September 1, 2024We described Rosemary Campbell-Stephens’s book Educational Leadership and the Global Majority: Decolonising Narratives as “required reading” for trainee teachers at the University of Birmingham’s School of Education (News Review, Jun 16). We have been asked to make clear that the phrase was used idiomatically and the book is not on any reading list there.■ August 25, 2024A recently introduced ticket gives travel on public transport in Germany for €49 per month, not per year as we wrongly said (World News, last week).■ August 25, 2024An article in News Review (August 11) said that in many wards of Middlesbrough the Pakistani and Bangladeshi population outnumbers the indigenous population. This is incorrect: there are no wards where this is the case.■ July 28, 2024We said that in 2021 Tom Dean became the first British swimmer to win two gold medals at a single Olympics for 113 years (Magazine, last week). He was the first male swimmer to do so: Rebecca Adlington won two golds in 2008.■ July 7, 2024In early digital editions, a story on claims that a Nazi song was sung and antisemitic chants heard at a Warwick University Conservative Association dinner was illustrated with a picture of a Gaza protest on the university campus (News, last week). The protest was unconnected with the dinner. We are happy to make this clear.■ June 30, 2024We wrongly said Steve Morgan had donated £44 million of shares to his charitable foundation (Home, last week). He has donated 44 million shares, for which the valuation at the time was about £240 million. We apologise for the error.■ June 16, 2024A story on an inheritance dispute wrongly said Al-Hasib Mian Muhammad Abdullah al-Mahmood sent a text message altering his will on October 22, 2023 (Money, last week). The message was sent on October 22, 2020.■ June 7, 2024The documentary The Greatest Love Story Never Told was financed by Artists Equity, not Jennifer Lopez as we wrongly said (News, last week). Ms Lopez says the $20 million she invested in her film This Is Me … Now: A Love Story was not “wasted”, as our online headline said, as she made a profit. We are happy to make this clear.■ June 1, 2024 We said proposed reforms in New Caledonia would allow recent arrivals in the territory to vote (World News, last week). In fact the reforms would give a vote to arrivals who have lived there 10 years or more, overriding current rules that restrict it to those who arrived by 1998. We are happy to make this clear.■ March 25, 2024Chris Rokos manages a hedge fund with £15 billion of assets, not £50 billion; and the annual turnover of the retailer Home Bargains is £3.8 billion, not £3.8 million as we wrongly said (Rich List, print edition, last week).■ March 24, 2024Figures from the English Housing Survey indicate that the proportion of people aged 25 to 34 in England who are homeowners is about 45 per cent, not 10 per cent as we wrongly said (News Review, last week).Relying on information published by Chatham House, we said a Latin American initiative launched by the body was financed by the hedge fund Merlyn Advisors (News, last week). Chatham House has informed us this was incorrect and the information was published in error. We are happy to make this clear.■ February 25, 2024We said Azhar Ali was a founder member of Muslims Against Antisemitism (News, last week). The group informs us Mr Ali has never been a member. We are happy to put this on record.We said Ken Thomson had left his role as chairman of the Institute of Chartered Accountants of Scotland (ICAS). In fact he had been chairman of the ICAS regulation board, rather than the institute itself (News, February 4).■ February 18, 2024We said the London-based team at GQ magazine had been “let go”, and that the publisher Condé Nast is creating a single global print edition of each of its titles (Business, last week). GQ still has a team in London, and Condé Nast says most of its print titles have distinct national editions and will continue to do so. We are happy to set this on record.■ December 24, 2023We wrongly said that councils are legally obliged to pay for taxis to school for children with an education, health and care plan (Comment, last week). While councils do pay for taxis in many cases, the existence of such a plan does not oblige them to do so.■ December 10, 2023We wrongly said Labour frontbenchers were absent from the march against antisemitism in London (Comment, last week). It was attended by the shadow science minister, Peter Kyle.Wycombe Abbey gained 97.5 per cent grades 9-7 at GCSE, not 90.75 per cent as we wrongly said, and should have appeared in 17th place in our top 100 independent schools. We apologise for the error.■ December 3, 2023An article on inheritance tax said an extra £175,000 allowance applies if the estate includes a family home worth up to £2 million and left to a direct descendant (Money, last week). In fact the allowance applies if the entire estate is worth up to £2 million and includes a family home left to a direct descendant.We said that from March 2026 all councils in England will be required to recycle the same materials and have a standard of three bins: refuse, mixed recycling and food (News, last week). In fact the standard for kerbside recycling collections is still under consultation.■ November 12, 2023We said there is no ministerial-level involvement in how the Scottish government delivers its AI strategy (Alf Young, Business, last week). This was incorrect. Innovation minister Richard Lochhead has led the Scottish government’s AI agenda since taking office on March 29 2023. His responsibilities include acting as sponsor minister for the Scottish AI Alliance.■ September 17, 2023 We said P&O Ferries has stopped paying into the Merchant Navy Ratings Pension Fund, and has pledged the ship Pride of Burgundy to the fund’s trustees as security (Business, last week). The company says it continues to make interest payments to the fund, and the security pledged is the vessels Pride of Hull and European Causeway. We are happy to make this clear.■ September 10, 2023 An article headlined “Sunak’s threat to pull UK out of the ECHR”, published on February 5, 2023, stated that “official estimates suggest there will be almost a 50 per cent increase in illegal migration on last year, when 45,000 claimed asylum” and that “45,000 illegal migrants” had arrived that same year. This conflated being an illegal migrant with being an asylum seeker in a misleading manner; it is not illegal to enter the UK for the purpose of claiming asylum, notwithstanding that the method of arrival may be illegal. This correction has been published following an upheld ruling by the Independent Press Standards Organisation.An underactive thyroid is hypothyroidism, not hyperthyroidism as we wrongly said (News, last week).Lord Sumption is a former Supreme Court justice, not a former lord chief justice (Comment, last week).■ September 3, 2023 We wrongly said in “A tour of picturesque York that you’re not meant to enjoy” (News Review, last week) that repairs to York Minster were being funded by the Church of England’s investment in the South Sea Company, which traded slaves. In fact the repairs are entirely funded by the minster’s own income from ticket and retail sales, property lets, grants, donations and legacies. We are happy to make this clear.The Ulez charge affects most diesel cars registered before 2015 and most petrol cars registered before 2006, not pre-2015 petrol and pre-2006 diesel as we wrongly said.■ August 27, 2023 We said that full costs of medical treatment abroad were applicable even to those who travel with a Global Health Insurance Card or GHIC (Money, Aug 13). In fact the card entitles the carrier to care on the same basis as local residents in participating countries, but in practice not all medical facilities accept the GHIC. We are happy to make this clear.■ August 20, 2023Whole life orders as a starting point in the sentencing of murderers of police officers came into force in 2015, not 2020 as we wrongly said (Comment, last week).■ August 13, 2023In our digital edition, a picture caption wrongly stated that John Caldwell of the Police Service of Northern Ireland was shot dead. Detective Chief Inspector Caldwell was seriously wounded in the attack but survived. The caption has been amended and we apologise for the mistake. (Comment, this week)Rolls Royce nuclear reactors use pressurised water technology, not boiling water technology as we wrongly said (Business, last week).■ August 6, 2023The Open golf tournament is organised by the R&A, not DP World Tour as we wrongly said (News, July 23).We said per capita income in the US state of Mississippi has risen by 25 per cent in the last five years, and in Britain real wages and living standards have not grown since 2007 (“We’re missing a trick by not being like Mississippi”, News Review, last week). The comparison was misleading because the Mississippi figures were not adjusted for inflation, which accounted for a large proportion of the increase. We have also been asked to point out that data from the Office for National Statistics indicates that British living standards have risen since 2007, albeit slowly by historical standards. The same article included a graph that compared per capita GDP in Mississippi and the UK: again the Mississippi figures were not adjusted for inflation and therefore the graph was misleading.■ July 15, 2023We said the organisation 38 Degrees allowed people to send pre-composed emails to their MP (Magazine, last week). 38 Degrees has informed us it does not provide template emails for users, whose messages are their own. We are happy to make this clear.■ July 02, 2023We said seven protesters campaigning to save trees in Sheffield were paid £24,300 by Yorkshire police (News Review, last week). The force that made the payment was South Yorkshire police. We are happy to make this clear.■ June 25, 2023The song Naatu Naatu was introduced at the Oscars by Deepika Padukone, not by Alia Bhatt as we wrongly said (Style, last week).■ May 28, 2023We said rural Transylvania is mostly Hungarian-speaking (News, last week). While this is true of two counties, including the one where King Charles’s Zalanpatak house is located, Romanian-speakers form a majority across the region.The restaurant chain Café Rouge is closing branches but is not in receivership, as we wrongly said (News Review, last week).■ May 6, 2023We said that Boris Johnso"
