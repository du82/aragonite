["https://thetimes.com/comment/columnists/article/it-was-always-the-ai-bros-masterplan-invent-tech-to-chat-up-women-23rnmz95d"]
title = "It was always the AI bros’ masterplan: invent tech to chat up women"
description = "The dating service Match is introducing artificial intelligence to help men not send women dodgy messages. Er, thanks?"
full_description = "PHOEBE LUCKHURSTIt was always the AI bros’ masterplan: invent tech to chat up womenThe dating service Match is introducing artificial intelligence to help men not send women dodgy messages. Er, thanks?Phoebe Luckhurst, Senior Commissioning EditorSunday March 02 2025, 12.00am, The Sunday TimesWhat’s the lewdest thing a man has said to you online? I’d start, but this is The Sunday Times. In the 2010s, when the dating app Tinder launched and we millennials leapt at the chance to sow our wild oats on an industrial scale, my friends and I used to swap our most egregious examples. It was like exposure therapy. In the sense that a man you’d never met had exposed himself and you thought you might one day need therapy. They weren’t all as dark as that. Sometimes they were just regular insults. Sometimes the offences were simply dreadful chat-up lines. Sometimes a bloke would suggest something unprintable but stick “lol” or “haha” on the end, so you ended up feeling humourless for not getting their “wacky” sense of humour. Women!No more: I’m married now. Plus, Match, which owns Tinder and another dating app, Hinge, is cleaning up its messaging. Last month it revealed its apps now use AI bots to detect signs a user may be about to send an XXX-rated message — if dodgy language is identified, a prompt will ask if the person really wishes to send it. For “men especially”, a “big part of our safety approach is focused on driving behavioural change so that we can make dating experiences safer and more respectful”, Match said, missing the point that dating isn’t any safer if red flags appear only once you’ve met in person.Still, it’s progress. In the sense that we’ve made all this technological progress, and our greatest minds are still on a mission to get men laid, like a Seth Rogen film set in the dorms at Stanford with no beer pong. Presumably the morality bots are schooled in the language of lust — ie won’t confuse innocent stuff for the more unpleasant variety — because tests suggest a fifth of people who receive these prompts reconsider their messages. I suppose we’ve tried everything else to get men to behave online — if human decency or respect for women just isn’t pushing the needle, then maybe Big Brother can do a job. AdvertisementIncreasingly it does feel like the logical end point of humanity might be enlisting the bots we invented to correct our pathetic, fleshy failings. My Fitbit makes me neurotic about getting my 10,000 daily steps; my phone admonishes me when I’ve been on Instagram for 15 minutes. And while I’ve never needed an AI to remind me not to send a dodgy sext, I did briefly install a feature aimed at people-pleasing women — hello — that highlighted every time I used the words “just” and “sorry” in an email. I soon deleted it, worried my new direct tone made me sound like a robot, or a man. These days I’m still just checking in, sorry to nudge (!), and resigned to gentle self-loathing. Somewhere Big Sister is watching, disappointed. Women!If we’re spitballing, though, I’d love a guardian angel who stopped me posting on social media after my blood alcohol hits a certain level: the world does not need more glassy-eyed selfies from Soho pub lavatories; I don’t need to add to my morning-after hangxiety by looking back at what I unleashed on Instagram. I’d also be in the market for a stern prompt that reminds me I’ve given up smoking when I reach for the Camels on the same sort of evening. Is there an app for that? Perhaps the AI bots could decode where your mother is going with a particularly abstruse line of messaging (“Darling, do you remember Margaret from the dry cleaners? Well, her daughter is a doctor in Tunbridge Wells now”), or add panache to your father’s texts (“Happy bday, Phoebe. Love Dad”). Perhaps the machines could also remind you — before you send that snitty text — that your parents mean well, and patience is a virtue.I’d invest in a robot that denatured the passive aggression of a hen-do group chat, if it meant no more messages like: “I’m still waiting for three people’s heartfelt message about the bride for the photo album — I know how much she’s going to love this so PLEASE DO IT by tomorrow.” I dream of a quit bot that could automatically, politely leave a lively WhatsApp group that has racked up 476 messages in the time it’s taken to cross a road. And could there be one that just flashes up “really??” when you put a plan in your calendar you have no intention of sticking to? From family politics to dodgy sexting and drunken misdeeds, humanity could be absolved of responsibility for any of our behaviour. I for one welcome our AI overlords — Big Brother, I hope you’re reading.Matt Rudd is awayCommentColumnistsRelated articlesHow we got to the modern handshake: from bro-hugs to fumblesFebruary 16 2025, 1.50pmPhoebe LuckhurstPHOEBE LUCKHURSTMy big sister energy has come back to bite meJanuary 12 2025, 12.01amPhoebe LuckhurstPHOEBE LUCKHURSTI’ve spent a third of my life renting. Here’s what I wish I’d knownNovember 03 2024, 12.01amPhoebe LuckhurstPROMOTED CONTENT"
author = "Phoebe Luckhurst, Senior Commissioning Editor"
