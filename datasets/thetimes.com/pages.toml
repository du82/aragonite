title = "Are you better off having children, despite the £500,000 cost?"
description = "When numbers feature in the debate over whether or not to have children, they are usually big, scary ones. Like £500,000: the cost, according to the estate agent Savills, to a middle-class family of"
full_description = "TOM CALVER | GO FIGUREAre you better off having children, despite the £500,000 cost?Tom Calver, Data EditorSunday March 02 2025, 12.01am, The Sunday TimesWhen numbers feature in the debate over whether or not to have children, they are usually big, scary ones. Like £500,000: the cost, according to the estate agent Savills, to a middle-class family of having two children.The data seems to lean towards the “don’t have kids” side. The wishy-washy stuff — the joy and enrichment that a baby can bring — is not a subject for data. Or is it?As birth rates fall, we appear to have lost the ability to articulate any actual benefits of having children. But if we were to make a data-led case in favour of procreation, how would it look?First, there’s no sugar-coating it: the early years of parenting are tough. The European Social Survey, a poll of tens of thousands of people across Europe, asks respondents how happy they are on a scale of 1 to 10. And British parents in their twenties, thirties and forties tend to be more unhappy than their childless counterparts.From 50, the happiness levels of parents climb sharply and overtake those of childless families. Children fleeing the nest, and the eventual arrival of grandchildren, appear to send serotonin levels through the roof. The same is true of life satisfaction: UK adults who have had children living in the same house are at first less satisfied but eventually end up much more satisfied than their childless counterparts.A pattern emerges: go through the pain of childrearing now and you’ll reap the rewards later. Which is good motivation for parents stuck at home, cleaning up sick, while their childless friends go out on the town with friends. Although parents tend to be less sociable during the childcare years, the data suggests that by the time they reach their seventies, parents see about as much of friends and family as they did in their twenties.AdvertisementParents even live longer, according to researchers from the Max Planck Institute for Demographic Research in Germany. They found the health benefits peak at 2-3 children (you probably get tired after that), and the boost was particularly strong for adoptive parents: those who adopted two or three children added an extra five years to their life.We are very quick to point out the astronomical costs of raising children. According to a new YouGov poll of childless adults, the most common reason for not wanting children was the expense. Childcare costs have indeed spiralled in recent years. But there are two important caveats. First, we hear a lot about the intensity of parenting, but much less about the technology that has made it less onerous. Today’s prams can rock babies automatically and take themselves up hills, points out Phoebe Arslanagic-Little, co-director of Boom, a campaign to make parenthood more appealing. In matters of health (she was one of the first pregnant women to receive the RSV vaccine on the NHS last year) and ease (“I realise I need more bibs and they arrive the next day and cost less than £10”), we’ve never had it so good.But also, the relationship between finances and raising a child is more complicated than it first seems.Thirteen months’ parental leave split between parents; generous child benefit: Finland seems to have it all figured out. It is no wonder that child poverty rates are among the lowest in Europe. Yet Finland, too, is seeing a drop in fertility.Interestingly, when Finnish parents are polled on whether they have had to cut back on expenses, just 15 per cent say they have. But when Anna Rotkirch, a leading fertility researcher, asks her (often childless) students to guess, they usually say about 50 per cent. In other words, those without children think the financial costs of childrearing are greater than they actually are.AdvertisementIn fact a lot of childless young adults do want kids eventually. According to YouGov, 44 per cent of childless 25 to 34-year-olds want children at some point; 27 per cent have not yet made up their minds. The average ideal number of offspring is still about 2.3.But millennials are performing a dangerous experiment. Those born after 1990 are postponing at a rate never before seen. Just 32 per cent of adults born in 1995 had a baby by the age of 28, down from 40 per cent for those born in 1990. They may catch up — women born in 1980 ended up having more babies than those born in 1970, despite starting later — but will be pushing against the boundaries of health and science.We are too well versed in the negative connotations of parenthood. But one statistic speaks for itself. Out of 1,172 parents recently polled by YouGov, 91 per cent said they did not, in any way, regret it.CommentColumnistsRelated articlesTOM CALVER | GO FIGUREAre Gen Zers as poor as they say they are?February 23 2025, 12.01amTom Calver, Data EditorGO FIGUREHow many dependants do migrants actually bring with them?February 16 2025, 12.01amTom Calver, Data EditorPROMOTED CONTENT"
