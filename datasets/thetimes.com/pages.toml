["https://thetimes.com/business-money/companies/article/hundreds-northern-rail-trains-suffering-corrosion-wnjqb78s0"]
title = "Hundreds of Northern rail trains suffering from corrosion"
description = "Warning comes as rail fares rise by more than inflation for the first time in three years"
full_description = "Hundreds of Northern rail trains suffering from corrosionWarning comes as rail fares rise by more than inflation for the first time in three yearsOliver Gill, Industry and Leisure Business EditorSaturday March 01 2025, 6.00pm, The Sunday TimesSome of Northern’s trains are more than 40 years oldALAMYOliver Gill, Industry and Leisure Business EditorSaturday March 01 2025, 6.00pm, The Sunday TimesTrains run by Britain’s second-biggest passenger operator are suffering from “corrosion”, according to a shock internal investigation.Bosses at Northern rail are understood to have raised the red flag about hundreds of Class 15X trains that provide the backbone of the operator’s services. Northern has more than 400 of the trains in question, which are owned and operated by specialist rolling stock companies. Some are more than 40 years old, but are not scheduled for replacement for another five years. The warning comes amid wider concerns about the safety of Britain’s railways. The rail regulator last month launched a major investigation into “systemic” failings by Network Rail to ensure the safety of bridges, tunnels and stations across Britain’s train network.AdvertisementThe Office of Rail and Road (ORR) and the Chief Inspector of Railways have commenced an Independent Reporter commission to get to the bottom of failures at Network Rail. It will look at Network Rail’s examination, structural assessment, and evaluation of structural assets.Some 4,500 rail infrastructure safety assessments are understood to be overdue, and in some cases there are no records of what rail infrastructure such as bridges can support.Northern was brought into full public ownership in 2020 after its private operator failed to improve service levels. But bosses have struggled to address chronic problems across Northern’s network, which stretches as far south as Stoke-on-Trent up to Newcastle upon Tyne in the north and serves stations across the country in between. Northern was Britain’s worst-performing operator in terms of cancellations between July and September 2024, the latest figures produced by the ORR. And although it was not the worst in terms of reliability, only 58.7 per cent of its services arrived on time. Matt Rice, chief operating officer at Northern, said: “We routinely have correspondence with rolling stock companies about the trains we lease from them, including about any work those trains need.Advertisement“Our oldest trains are our Class 15X fleets which are 35 to 41 years old. We have our oldest trains in for a programme of work to support their continued service operation which, for certain vehicles, includes treatment of corrosion.”He continued: “We have recently started the process to buy new trains. In January, we invited five major train manufacturers to bid for that work, which will bring up to 450 new trains into Northern. With new trains not set to arrive with us until about 2030 the continued service operation work is important for the ongoing maintenance of our existing fleet.”Northern’s corrosion warning comes as national rail fares increase on Sunday by more than inflation for the first time in three years. Regulated rail fares will increase by 4.6 per cent. The rate of inflation was 3 per cent in January. It means the cost of an annual season ticket for the 60-mile journey between Brighton and London will be more than £6,000 for the first time. A yearly season ticket between Manchester and York — little more than 70 miles — will increase from £6,360 to £6,653. AdvertisementTransport secretary Heidi Alexander said: “I understand that passengers are frustrated that rail fares keep rising despite unacceptable levels of delays and cancellations, which is why this government made sure this was the lowest increase in three years, and below the growth in average earnings.”Business & MoneyCompaniesRelated articlesNetwork Rail slammed over safety of bridges, tunnels and stationsFebruary 15 2025, 2.00pmOliver Gill, Industry and Leisure Business EditorSTEPHEN BLEACHIt’s a fare cop — I’m a rail ticket criminalOctober 13 2024, 12.01amStephen BleachPROMOTED CONTENT"
