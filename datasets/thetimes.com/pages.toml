["https://thetimes.com/business-money/money/article/chesney-hawkes-interview-t5hgpjxnj"]
title = "Chesney Hawkes: How did I blow through £8m? Because I was an idiot"
description = "He’s been paid £30k just to sing The One and Only, but the rock ‘n’ roll lifestyle inherited from his musician dad left him in need of his wife’s financial wisdom"
full_description = "FAME AND FORTUNEChesney Hawkes: How did I blow through £8m? Because I was an idiotHe’s been paid £30k just to sing The One and Only, but the rock ‘n’ roll lifestyle inherited from his musician dad left him in need of his wife’s financial wisdomChesney Hawkes performing in Reading last JulyGETTY IMAGESNick McGrath, ContributorFriday February 28 2025, 12.00am, The Sunday TimesChesney Hawkes hit the charts at 19 after appearing alongside Roger Daltry in the 1991 musical film Buddy’s Song, which featured his single The One and Only. The song was No 1 in the UK for five weeks and a Top Ten hit in the US. Hawkes was born in Windsor in 1971, the son of Chip Hawkes, the singer and bassist in the 1960s band the Tremeloes, and Carol Dilworth, an actress. Chesney is still touring and making music and has appeared on Celebrity MasterChef. He has recently moved back to the UK with his wife, Kristina, an American actress and model. They have three children, Casey, 23, Jesse, 21, and Indi, 19.How much is in your wallet?Less and less these days because places don’t even take cash and you can do everything on your phone. I do miss cash, though. Like my dad — who grew up very poor in a one-bedroom house with five siblings in Shepherds Bush [west London] — I’ve always liked cash. For him, everything was a deal, even when he had money through his rock stardom. Back in the day I would definitely have a wallet with cash in it, maybe not so much a wad, but enough. In today’s money, maybe 60 quid.Hawkes in 1991ALAMYWhat credit cards do you use?I do have them, and I never run up bills on them. I’ve got the American Express, which not everyone takes, but it’s good for extras like insurance. I’ve also got a card from HSBC, who I’ve been with since I was 16, when I first opened a savings account.Hawkes’ father, Len, with the Tremeloes in 1967ALAMYAre you a saver or a spender?My parents were never sensible with money. They had it when I was a kid because my dad had become a big rock star in the Sixties. We had a big house and Dad had a Jag, but they didn’t really save money, so I grew up as a spender. But luckily my wife is sensible. Her father comes from a banking background so he’s very good with money. Both my in-laws are Midwestern American and have always saved money, and they certainly shook their heads at the historical financial me. And so does my wife. She’s like, “If you were just advised about the benefits of compound interest when you were a young starlet, we wouldn’t be worrying right now.”AdvertisementI thought it was all just going to carry on. You don’t think about how short life is at that point, and if you understand compound interest and putting money aside for when you’re older, you’re not really going to have the crazy fun times that I had. • Dave Robinson: You need money in the music biz, but it’s the root of all evilHow did I spend £8 million? Because I’m an idiot. I just never saw what was around the corner. I just thought, once you’ve made it, fame and fortune go together, but that was naive obviously. I don’t want to paint a boring picture of my wife, though; she’s probably more rock’n’roll than I am. With Roger Daltrey in 1990ALAMYHow much did you earn last year?If I told you the exact number, my wife would probably hunt me down and kill me. But I will say last year was the best year I’ve had since the early Nineties as my profile has grown again. I’ve got a new manager, who is fantastic, a new agent, so the fees have gone up a little bit. If you wanted to hire me, it would depend whether it was a corporate or personal bash — for corporate it would be in the tens of thousands. I’ve done a couple of crazy gigs at private parties of very wealthy clients and been paid £30,000 just to sing The One and Only. I had one recently where someone wanted me for a private party but said, “We can’t pay you, but you can have as much food as you like from the buffet. And drinks. Within reason.” Tempting, but no. Financially, The One and Only changed everything, and I still get booked because of that song. It was my Sliding Doors moment and it’s probably been responsible for 90 per cent of my career earnings. I do still get royalties, but the bigger cheques come from commercial deals like when it was used in a Nationwide advert, which I got tens of thousands for. I used that money to pay for this new album.AdvertisementHave you ever been really hard up?Around 1993 I got dropped by the record label. I had pretty much spent all my money. I had no gigs. Nobody would book me for anything. I was basically a washed-up pop star. I was surprised by the speed of the descent and never thought it would happen. What saved me was meeting my wife on July 4, 1995, and letting her take the reins of my finances as I was useless. I’d got into drugs and alcohol a bit to mask things and basically buried my head in the sand. Meeting her gave me something else to focus on and made me think, I want to start a family with this woman, this is my future now. She helped me realise that a lot of those hangers-on expecting free dinners weren’t really my friends.Hawkes with his wife, KristinaALAMYDo you own a property?I still own a two-bedroom property in west London I bought in 1993 for £120,000. Today it’s probably knocking on the door of a million. When Kristina and I had kids we bought a house in Chertsey for about £600,000. When we moved to LA we rented out the Chertsey house, and then sold it thinking we’d get an American mortgage, but because I couldn’t show five years’ worth of tax returns we couldn’t get one, so we just rented the whole time we were there. This was around 2015, when I didn’t have much work, so I just had this huge lump of cash that was rapidly dwindling. In the end we bought another smaller two-bedroom place in Chertsey, which we rented out. Now we’re back here from LA and renting again, and I’m still having a hard time getting a mortgage because I’ve been out of the UK tax system for so long.The musician on Masterchef in 2015Are you better off than your parents?My dad was a rock star in the late Sixties, but he didn’t teach me any financial lessons and my parents are still the same. He lived his life at a million miles an hour. I have memories of rock’n’roll excess as a kid as all my dad’s friends were Sixties rockers and musicians, and my mum was an actress in films like The Young Ones with Cliff Richard and was also a game show hostess with Bob Monkhouse in a show called The Golden Shot. They’d have big parties all the time, and I’ve got a memory of Gerry Marsden singing, with Graham Knight from Marmalade on bass and one of the Searchers on drums, and my brother and sister and I just there watching. We’d wake up and have to step over sleeping musicians to get to our cornflakes. In terms of actual relative financial wealth, I think we’re about the same. Although my parents were a bit shit with money, they did start to put some away for investments. Who blew the most between me and my dad? I think we’re probably equal on that one.AdvertisementDo you invest in shares?We’ve got a small investment portfolio of Isas. My wife likes all that stuff, and I sit there with a glazed look on my face.What’s better for retirement — property or pension?Do pop stars ever retire? Can I see myself in my seventies on stage banging out The One and Only? Who knows? I’d have said “no chance” if you’d asked me would I still be singing it in my fifties, but here I am. I think I’ll play live until I drop. What’s the point of retiring?• Jill Stein: I bought an £80k convertible after Rick and I splitWhat’s been your best investment?That house in west London, although it’s all on paper and the capital gains will be massive unless I move back in. Even so, I’ve probably made £800,000 on it. Apart from that, though, simply music and the time I’ve invested in it. It’s kept me going through my whole life.And the worst?Selling the big house in Chertsey was a mistake but I’m not really into regrets, because I think when you do something, even if it’s negative, something positive can come from it and everything that happens in your life brings you to where you are now.AdvertisementHawkes bought a Triumph TR3 when he was 19 years oldALAMYWhat’s the most extravagant thing you’ve bought?I spent a quarter of a million pounds building a studio at the back of my parents’ house in Sunningdale in Berkshire, but I’m so glad we had it. Robbie Williams worked on some of the Millennium album in there. If we’re talking sheer profligacy, when I was only 19 I bought this little red Noddy car, a vintage early Sixties Triumph TR3, for 25 grand, which was an insane amount of money at that age. It broke down every five minutes and I ended up selling it for nothing.What’s your money weakness?My wife is partial to a nice bottle of high-end champagne. She’ll do a Veuve Clicquot, but ideally it’s got to be Dom Pérignon.What is your financial priority?Continuing to invest in my music. I’ve self-financed this album, and things are moving in the right direction so I’m looking forward to watching that investment pay off. It feels like exciting times.Hawkes’ new album, Living ArrowsWhat would you do if you won the lottery?I would do exactly what I did last time. I would pay off whatever my parents needed clearing. I’d pay off my brother’s mortgage. I would make sure my kids are looked after. The biggest splurge this time would be a forever home for Kristina and me, as I know that’s what she dreams of.Do you support any charities?I’ve been affected by suicide in my family, and it’s a preventable issue, so I’m an ambassador for the mental health charity Calm.AdvertisementWhat is the most important lesson you’ve learnt about money?Compound interest. If I knew that at 19, I wouldn’t be dreaming about that house, I’d already be living in it.The album Living Arrows is out on April 4 and the UK tour starts in Newbury on March 18. chesneyhawkes.com Business & MoneyMoneyRelated articlesFAME AND FORTUNENicholas Watts: Some farmers count money. I like counting birdsFebruary 14 2025, 12.00amJohn WrightFAME AND FORTUNEJill Stein: I bought an £80k convertible after Rick and I splitFebruary 07 2025, 12.01amYork MemberyFAME AND FORTUNECharlene White: ‘As a student I felt rich. I had a grant and a job at SegaWorld’January 31 2025, 9.15amSuzanne BearnePROMOTED CONTENT"
