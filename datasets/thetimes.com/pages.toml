["https://thetimes.com/article/corrections-and-clarifications-the-times-x9nbft5tq"]
title = "Corrections and clarifications"
description = "The Times takes complaints about editorial content seriously. We are committed to abiding by the Independent Press Standards Organisation rules and regulations and the Editors’ Code of Practice that"
full_description = "Corrections and clarificationsThe TimesWednesday February 26 2025, 5.30pm, The TimesThe Times takes complaints about editorial content seriously. We are committed to abiding by the Independent Press Standards Organisation rules and regulations and the Editors’ Code of Practice that IPSO enforces. Requests for corrections should be sent to feedback@thetimes.co.uk or to Feedback, The Times, 1 London Bridge Street, London SE1 9GFFebruary 27, 2025Government bonds produced yields of about 5.5 per cent two years ago and 4.1 per cent today, not coupons of those amounts as we wrongly said (Money, Feb 22)February 24, 2025We reported comments from the conductor Edward Gardner relating to members of the chorus of the San Carlo opera house in Naples (Times2, Jan 14). Mr Gardner has since retracted and apologised for those comments. We are happy to put this on the record and apologise for any offence caused.February 21, 2025We suggested the recruitment firm Odgers Berndtson may have been unaware of the true qualifications of Arvind Balan, former chief financial officer of John Wood Group (business, Feb 21). Odgers Berndtson carried out checks and correctly identified his qualifications. We are happy to make this clear.February 20, 2025The current threshold for paying income tax is £12,570, not £11,570 as we wrongly said (News, Feb 20).AdvertisementWe referred to the Republican Mitch McConnell as the US Senate minority leader (Birthdays, Feb 20). Republicans hold a majority in the Senate, led by John Thune.February 18, 2025The annual budget for equality, diversion and inclusion staff at Oxford Brookes university is less than £200,000, not £1.3 million as we wrongly said (News, Feb 17).February 12, 2025Mishal Husain’s birthday is March 12, not February 11 as we said (Register, Feb 11). We apologise for the error.February 7, 2025The fashion designer Alice Temperley does not live in Bruton, Somerset, as we suggested (It’s ‘post-posh’: how Bruton became Britain’s Montecito, Times2, Feb 5); she lives a 45-minute drive away. We are happy to make this clear.February 6, 2025The independent review of Valdo Calocane’s care revealed 15 “extremely serious” acts of violence, including stabbings, involving patients at Nottinghamshire Healthcare NHS Foundation Trust between 2019 and 2023. Those acts were not committed by Calocane, as we wrongly said (News, Feb 5). The mistake was introduced in editing.AdvertisementIn the case of Kireeva v Bedzhamov, the Supreme Court’s judgment was given by Lord Lloyd-Jones and Lord Richards, not Lord Leggatt and Lady Simler as we wrongly said (Law report, Feb 3).February 3, 2025An article on Admiral Taverns was wrongly illustrated with a picture of the Mayfly pub in Stockbridge, Hampshire (Business, Feb 3). The Mayfly is owned by Fuller’s.February 3, 2025A blackboard used by Albert Einstein is on display in Oxford at the History of Science Museum, not Rhodes House as we wrongly said (leading article, Feb 1).February 2, 2025 A petition urging Sutton council to divest from companies supplying the Israeli military was not submitted on Holocaust Memorial Day as we said (news, Jan 28). It was heard at a scheduled council meeting that day but had been submitted earlier. We said that the Japanese had never apologised properly for sexual enslavement of Korean women in the Second World War (leading article, Jan 28). In fact successive Japanese prime ministers from 1995 have sent letters of apology to former “comfort women” and the issue was “resolved finally and irreversibly” with an agreement between Japan and South Korea in December 2015.AdvertisementFebruary 1, 2025In Saturday’s Magazine, we refer to Victoria Cipriani as Danny Cipriani’s ex-wife. Although she filed for divorce in August, the couple are still married.January 27, 2025We wrongly said that a study on behalf of Thames Water showed “1 in 12 Londoners is an illegal migrant” (News, Jan 23). In fact the study covered only 7 million people in specific “water resource zones”, not the whole population of London, which is closer to 9 million. 1 in 12 was the highest of a range of estimates for the proportion of “irregular migrants”, but these estimates included some people who are not illegal immigrants, such as those given indefinite leave to remain, as well as some British-born children of migrants with irregular status.January 24, 2025We said that “on average women still earn 13 per cent less an hour than men, according to the Office for National Statistics” (News, Jan 23). In fact the figure for full-time median earnings excluding overtime is 7 per cent. The mistake was introduced in editing.January 20, 2025We said (Comment, Jan 10) that a Law Commission report on surrogacy proposed “lowering the minimum age [of surrogates] to 21 and removing the important condition to protect a woman’s physical and mental wellbeing that she must already have her own child”. In fact there is no minimum age at present and no requirement for a surrogate to be a mother already: the report recommends introducing a minimum age of 21 but no change on the latter point.January 17, 2025Asked whether the UK should be forced to take back British Isis prisoners (World, Jan 8), Donald Trump’s incoming director of counterterrorism Sebastian Gorka replied: “Any nation which wishes to be seen to be a serious ally and friend of the most powerful nation in the world should act in a fashion that reflects that serious commitment.” He made no mention of Keir Starmer or Shamima Begum. We are happy to make this clear.AdvertisementJanuary 16, 2025We said (Sport, Jan 13) Dame Tracey Crouch had “intimated” that a sport regulator would have stopped the Saudi takeover of Newcastle. In fact she said, when asked in 2021, “I certainly can’t tell you whether or not this integrity test would have stopped the Newcastle takeover. I don’t know the details of it. But I would say that it would certainly have stress-tested it more and it would have been more transparent in that testing.” We are happy to make this clear.January 14, 2025In an article headlined “Law firm rejects accusations over BHP settlement” (Business, Nov 6) we suggested that Pogust Goodhead might for financial reasons be improperly pressuring its clients to reject a settlement offer in relation to the ongoing High Court litigation against BHP concerning the Mariana dam collapse. That suggestion was untrue and we apologise to Pogust Goodhead. We have agreed to pay them damages and legal costs.January 11, 2025Taunton School is not passing on the full 20 per cent VAT on fees as we said but rather keeping fee increases below 10 per cent (News, Jan 4). We apologise for the mistake.It was in 2015 that Stonewall announced it would focus on trans rights, not 2004 as we wrongly said (Comment, Jan 8). We apologise for the mistake.January 9, 2025We reported Barbara Mills KC, the new head of the Bar Council, as saying that the judiciary “isn’t too white and too male” (Law, Jan 9). In fact she said, when asked if the bench was too white and too male, “I’d put it another way: it isn’t too anything.”AdvertisementJanuary 8, 2025We said that to become pope requires a simple majority of cardinals in a papal conclave (Comment, Jan 6). This was once the case but since 2007 a two thirds majority has been required.We said the sculptor Anne Curry was married to David Curry (News, Jan 6). We have been asked to make clear that the couple are still married, and we are happy to do so.A photograph showed Newton Ferrers, Devon, not nearby Noss Mayo as the caption wrongly said (Weekend, Jan 4).January 7, 2025An article on the two candidates for leadership of the Muslim Council for Britain wrongly suggested both had praised Iran (News, Dec 6). Dr Wajid Akhter has not expressed such views. We have further been informed that Dr Akhter did not, as originally reported, say New Year celebrations “usually” involve “un-Islamic practices”, but that they “may” do so. We are happy to make this clear.January 6, 2025Humanae Vitae, the papal encyclical on birth control, was issued by Pope Paul VI, not Pope John VI as we wrongly said (David Lodge obituary, Jan 4).January 3, 2025We wrongly said the fastest-growing group among the economically inactive were those including mental health disorders in their claim for a personal independence payment (Comment, Aug 19). While such claims have risen, not all claimants are economically inactive and it does not follow that they are the fastest growing group within the economically inactive cohort. This correction is published following an upheld ruling by the Independent Press Standards Organisation.December 30, 2024 A photo in World News (“The resourceful ‘lord’ rebooting the Rhine one castle at a time”, Dec 26) showed Katz Castle, not Rheinstein Castle as we said. We said homeowners with solar panels can make 4.1p per kWh of electricity exported back to the national grid (News, Dec 28). In fact many rates are available, currently ranging from 1p to more than 25p.December 27, 2024An obituary of Hazel, 10th Baroness Howard de Walden (Dec 27), was wrongly illustrated with a photograph of Gillian, Lady Howard de Walden, widow of the 9th baron. We apologise for the mistake.December 23, 2024We said that Yuan Yi Zhu in a book review called some of the contributors to a volume of essays “self-discrediting and morally bankrupt” (News, Dec 20). Professor Zhu has informed us that in fact he described only one contributor in those terms.December 21, 2024We said the coroner Shirley Radcliffe contacted Chelsea and Westminster hospital to raise concerns about an investigation into the death of Hayden Nguyen (News, Dec 18). While the coroner’s office did make such contact, Dr Radcliffe has informed us she was not responsible. We are happy to put this on record.December 20, 2024A photograph showed Rushanara Ali MP, not Tulip Siddiq MP as the caption wrongly said (Business, Dec 18). This was due to an agency error.December 16, 2024We wrongly said Greenpeace had incurred $11 million in legal costs for a case against Shell (Business, Dec 11). This was the amount the group might have paid if they had lost the case, which was settled out of court.December 15, 2024A photograph on page 4 (Dec 13) showed choristers from Gloucester Cathedral, not Winchester Cathedral as we said. Gloucester Cathedral’s carol services are on Dec 22 and 23.December 12, 2024We said that some vegan substitutes were worse for the planet than meat and dairy (News, Dec 5). While vegan processed food compared badly with vegan whole food on environmental grounds, it rated worse than meat and dairy only when factors such as cost were taken into account.December 11, 2024We wrongly said the vast majority of the extra £3.4 billion Scotland will receive from the most recent budget comes from English taxpayers (Comment, Dec 9). In fact 89 per cent is funded by Scottish taxpayers.December 10, 2024In acknowledging that we had wrongly referred to “wrangling 6.9 million people on sickness benefits back to work” (Corrections and Clarifications, Dec 9), we failed to make clear that only a minority of those claiming disability benefits are both of working age and out of work.December 9, 2024We wrongly referred to the government’s task of “wrangling 6.9 million people on sickness benefits back to work” (Comment, Dec 6). While 6.9 million claim disability benefits, such benefits are also available to employed people.November 22, 2024 An article about Mayo Walters, who died at Dignitas in April, wrongly described her as having been the first female judge in Kenya (News, Nov 16). In fact it was stated in her eulogy that she was the first white female magistrate in Nairobi. We are happy to put this on record.November 11, 2024An article on the reopened investigation into the death of Jeannette May (nee Bishop) referred to telegrams purporting to link her to a robbery at Christie’s, and said she knew the antiques dealer Sergio Vaccari (News, Nov 5). In fact the police concluded the telegrams were a hoax, and ties between May and Vaccari were ruled out at an inquest. We are happy to make this clear.November 9, 2024We wrongly said that Jacqueline Aston “lost her job” at a care home after she was found guilty of three charges of stalking (News, Oct 25). She resigned of her own volition.November 8, 2024We said it was not Lady Carbisdale but another woman who was given a police warning after a disturbance in the aftermath of a council meeting (Magazine, Oct 12). We have since been provided with evidence suggesting this was inaccurate. We are happy to set this on record.November 7, 2024We wrongly suggested that resolutions on rewilding and Pride events, which were rejected at an annual general meeting of the National Trust, were proposed by the group Restore Trust (News, Nov 2). The group’s candidates stood for election to the National Trust council at the meeting, but it did not put forward the resolutions.November 6, 2024We quoted concerns that a ship carrying potentially explosive material was docked by a nuclear power station at Great Yarmouth (News, Nov 2). The town’s power station runs on gas, not nuclear fuel.November 2, 2024A production error led to three pictures being placed next to the wrong caption in “Joe’s favourite lime green plants” in today’s Weekend section. The plant at the top right is Euphorbia palustris (spurge); the middle picture is Cotinus coggygria ‘Golden Spirit’ (smoke bush); and the bottom right is Heuchera ‘Lime marmalade’ (coral bells).November 1, 2024 In “Debate over class action funding”, (Law, Oct 3), we stated that the law firm Pogust Goodhead had made a typographical error in its retainer with its clients which meant it would cap its fees at 50 per cent rather than 35 per cent. In fact, the typographical error was in one place and all other references were to the correct fee cap of 50 per cent. We also said that the High Court criticised and reduced the firm’s costs of £343 million when in fact the judge did not single out Pogust Goodhead and this figure actually represented the overall costs and disbursements sought by all 19 claimant law firms in the case. Pogust Goodhead has asked us to point out that the defendants’ costs were also significantly reduced. We apologise for the errors and have made a payment to Pogust Goodhead which it intends to donate to The Access to Justice Foundation.We reported Sarah Wright as saying residents refused to pay for repairs to Whitebarns Lane in Hertfordshire (News, Oct 30). In fact she said they cannot afford to. We are happy to make this clear.October 31, 2024We suggested Ben Delo of BitMEX had been indicted in a US court and that certain findings of fact had been made against him (news, Apr 12). It has been pointed out to us, and we accept, that this was incorrect. The hearing in question concerned a civil claim against HDR Global Trading Limited and others, including Mr Delo, and concerned the question of whether the New York court had jurisdi"
