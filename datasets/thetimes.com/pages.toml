["https://thetimes.com/comment/columnists/article/rehang-in-the-commons-is-a-reminder-we-are-ashamed-to-be-english-whkq0ddnl"]
title = "Rehang in the Commons is a reminder we are ashamed to be ‘English’"
description = "It is a strange country that despises its past and believes people should be airbrushed out of the picture, or locked in a basement"
full_description = "ROD LIDDLERehang in the Commons is a reminder we are ashamed to be ‘English’It is a strange country that despises its past and believes people should be airbrushed out of the picture, or locked in a basementRod LiddleSunday March 02 2025, 12.01am, The Sunday TimesThey’ve been shifting the artworks about in the House of Commons, part of a drive to make the paintings seem to onlookers inclusive and diverse. So out have gone the Duke of Wellington, Oliver Cromwell, Lord Nelson and Sir Winston Churchill. And in their place we have a portrait of Baroness Hodge, plus a really peculiar depiction of our home secretary, Yvette Cooper, standing with her neck outstretched and an uncomfortable expression on her face, looking for all the world like an alpaca that has just been inappropriately propositioned by a drunken member of the ways and means subcommittee.I have done my bit by sending a pen-and-ink drawing of David Lammy sitting in the BBC green room before his hilarious appearance on Celebrity Mastermind, but it remains to be seen if it will be put on display. It is a strange country, though, that so despises its past, wishes to be rid of it, wishes it had all never happened and believes the people from that despised time — “before now” — should be airbrushed out of the picture, or locked in a basement.And yet there is nothing very new in it. As George Orwell noted in his essay The Lion and the Unicorn, under the darkening skies of 1941, we are “perhaps the only great country whose intellectuals are ashamed of their own nationality. In left-wing circles it is always felt that there is something slightly disgraceful in being an Englishman and that it is a duty to snigger at every English institution, from horse-racing to suet puddings.” Conferring the title “intellectuals” upon our parliamentarians is maybe a step too far, but the point remains. We have never waved flags with the fervour of our continental neighbours, still less the Americans. And so it is perhaps fitting that we are a country in which, in the past two weeks, a man can be charged with a criminal offence for burning the Koran but no action is taken against pro-Palestinian demonstrators for tearing the Union flag into bits. Fill your boots, you Hamas groupies: we don’t really care. An indifference to the flag meant, for Orwell, an innate aversion to the banshee call of fascism: unlike the Germans and the Italians, we would never succumb to an ideology that relies for its allure upon the performative rather than the real. I’m less sure about that.This whole business has been in the news since a small and interesting spat between the comedian and blogger Konstantin Kisin and the Times columnist Fraser Nelson over whether Rishi Sunak could be considered “English”. Nelson reckoned that to be born in England rendered one immediately and unequivocally English. I think this is very wide of the mark — the only countries in the world where that may apply are the USA and, to a slightly lesser extent, Australia. Kisin, who is Ukrainian, Greek and Jewish but nominally Russian, held that the more civic term “British” might apply, but not “English”, which contained connotations of ethnicity. Suella Braverman — ever on hand at the scene of a fire with a large can of petrol — agreed entirely with Kisin. She would never consider herself English, she said: “For Englishness to mean something substantial, it must be rooted in ancestry, heritage and, yes, ethnicity — not just residence or fluency.”To the extent that it matters a damn, I am with Braverman on this. But it is a complicated business, not least for me — someone who thought himself quintessentially English until one of those ancestral DNA tests revealed that I am almost 90 per cent Scottish with a sliver of Belgian thrown into the mix, just to make things worse. How my wife (10 per cent Silesian!) laughed. The obvious answer is that Englishness is a merger between our essence and our existence, as that bag of wind Sartre might have put it. I do not think you can be properly English without buying into the story, however flawed that story may be. You are English not just if you find the spectacle of an old maid cycling to communion in the early morning mist (something I have never, ever, seen, incidentally) becoming, but if you also have a deep and immovable respect for those things that England has given itself, or taken from other people, and likewise given the world. And in there somewhere — more controversially — a slight sense of superiority; but no greater a sense of superiority than the French or Italians or Americans possess, for different reasons.AdvertisementIn which case, Englishness must surely diminish into nothing, for we are no longer allowed to subscribe to that notion, are we? It has been chiselled out of our collective conscious these past thirty or forty years and replaced by a sullen contempt for the deeds of our forefathers. Whether that is a good thing or a bad thing I am not entirely sure. But the fact that we can still have this debate suggests to me that the whole notion of Englishness is winnowing away.King Charles invites TrumpGlass of red with a hint of goldfishBelgians are furious that they have been banned from drinking fish. There is a spring tradition in Flanders in which locals drink a beverage that has a live gudgeon swimming around in it. But new animal welfare laws prohibit the practice. The Belgians argue that this is simply another one of their country’s historic traditions, like making chocolate, urinating in public and abducting children, but their protests have fallen on deaf ears. Given Belgium’s intensive and not wholly kindly pig farming, it does occur that the animal welfare lobby may have had the wrong targets in their sights. But I suppose the gudgeons will be happy.Some fan mail from the Old BillSince starting my Times Radio programme on Saturday morning I have been both touched and delighted by the response of the general public. They seem full of excitement about the show. On Wednesday, for example, I was driving through the Co Durham village of Fir Tree and oncoming motorists, recognising me through the windscreen, flashed their headlights on and off in joyous appreciation of my broadcasting. It was a moment which was both elating and humbling.But fate always has a way of bringing one down, doesn’t it? The following day I received through the post a fixed penalty notice for speeding, my first ever. Ah well. One labours on.CommentColumnistsRelated articlesROD LIDDLEBBC bosses with no brains created The Hamas ShowFebruary 23 2025, 12.01amRod LiddleROD LIDDLEIt’s not Reeves’s fibbing I mind. It’s that she didn’t have the gumption to worry about being caughtFebruary 15 2025, 6.00pmRod LiddlePROMOTED CONTENT"
