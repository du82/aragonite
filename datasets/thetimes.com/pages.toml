["https://thetimes.com/article/emma-raducanu-stalker-threat-modern-athlete-blackmail-threat-kgtkm0gbk"]
title = "Special forces and silent alarms on children — true cost of obsessive fans"
description = "High-profile sportswomen like Emma Raducanu are facing blackmail, AI scams and stalkers, and the lengths they go to stay safe are growing more extreme"
full_description = "TOM KERSHAWSpecial forces and silent alarms on children — true cost of obsessive fansHigh-profile sportswomen like Emma Raducanu are facing blackmail, AI scams and stalkers, and the lengths they go to stay safe are growing more extremeILLUSTRATION BY NINA KRAUSETom Kershaw, Sports ReporterSaturday March 01 2025, 6.30pm, The Sunday TimesThe need for Emma Raducanu to be escorted between tennis courts by a five-man security detail next week at Indian Wells is a cruel reality rather than a dystopian nightmare for a growing number of high-profile female athletes. The “fixated” man that stalked the 22-year-old across international borders, handed her a letter outside her tournament hotel with his phone number on, and eventually reduced Raducanu to tears of panic at the Dubai Championships is already the second person to receive a restraining order in her short career; in 2022, a man was arrested after turning up three times at her home in Bromley, southeast London, and once even posted a card with a hand-drawn map as proof of the 23 miles he had walked to her doorstep.The physical threat needs little explaining to those who remember the crazed fan of Steffi Graf who ran on to the court in Germany and stabbed her rival Monica Seles with a boning knife in 1993, but the psychological distress can be inescapable. Bromley magistrates’ court heard that Raducanu felt like she was always “looking over her shoulder” during the trial in 2022. Raducanu spotted the “fixated” man early in her second-round match in Dubai with MuchovaThe three-times Olympic gold-medal winner Gabby Thomas revealed in January that a group of men had gained access to her flight schedule and followed her to airports, while in January a man was charged with stalking the basketball superstar Caitlin Clark. “It happens to all of us, it’s part of life when you’re in the public eye,” Katie Boulter, the British No1, said in December of several instances of harassment.That sad regularity has meant athletes are now having to take extra — and often extreme — measures to ensure their safety, be it ex-special forces personnel to guard their homes, encrypted devices to evade hackers, or even mediators to deal with organised criminals who threaten the athletes’ children in an attempt to force them into match-fixing schemes.AdvertisementPaul Higgins has been one of the world’s foremost bodyguards for two decades and has worked for everyone from One Direction to the boxing promoter Bob Arum. The number of stalkers pursuing his female clients, some of whom he has had to apprehend outside his clients’ houses, has increased markedly in recent years. “The security do all their due diligence, they get restraining orders, all the legal stuff is tied up, but it doesn’t stop someone that has got intent,” he says. “It’s a mental health issue. They turn someone’s world upside down because it’s a life sentence. They’re petrified. That’s why I feel so sorry for [Raducanu] because it’s always in the back of your mind, looking at who’s in the crowd. At that level, you need to be at your best.”The bodyguard Paul Higgins has provided security for high-profile clients including One DirectionIt has not been disclosed if Raducanu will travel with her own private security, along with the team provided by the WTA on tournament grounds. In the most severe instances, where a stalker has posed a threat to his client’s life, the protocol Higgins follows is more akin to espionage. An “advance team” will discretely trace and record several routes from the airport to the hotel. Frontline bodyguards — there are in excess of ten for a big boyband — receive video logs before travelling to an event. “We’d go in under a pseudonym, lock down the floor, the lifts, the cars, carpark, everything. No parcels go to the room. We’d have security next door,” Higgins says. “It’s a game of cat and mouse, but you can’t sustain that unless you’re at the very highest level.”Such are the number of obsessed fans, if not outright stalkers, that a market of scammers has developed seeking to take advantage of them. The golfer Charley Hull has more than 720,000 followers on Instagram and impersonators have created unofficial accounts in her name and singled out avid fans that comment underneath all of her posts. Advertisement“They message directly and say, ‘Thanks for your kind comments, this is my private account, my manager can’t see this, so we can talk freely here,’ that kind of thing,” says Vicky Cuming, Hull’s agent. “That’s how it starts and then they build up their confidence. They’ve used AI to put Charley’s head on a glamour girl’s [body]. They’ve recorded messages in wording that sounds really like her. Then they start asking for money.”The man was removed from the stands at the Dubai Championships after Raducanu raised her concerns and then stood behind the umpire’s chairAt two LPGA Tour events in Florida over the past six months alone, Hull has been approached by strangers who thought they had been communicating with her and said things like, “Hey sweetie, it’s me.” Most are simply left red-faced after realising they have been conned but, in rarer instances, others have become angry and started demanding their money back. Hull is a strong and fairly relaxed character, and the LPGA’s on-site security, which has been upped recently, is sufficient for the time being, but it is still very disconcerting. “It is embarrassing there are men out there who think they are in a relationship with me when I have a boyfriend back home,” she says. “I value all of my fans. It saddens me that they’re being targeted by criminals.”Hull, the world No9, also received packages to her house in Surrey from a stranger on Valentine’s Day. “I’m still not sure how he got my address but luckily I wasn’t home when he made the delivery,” she says. Vasilis Sotiropoulos, an ex-special forces lieutenant, now owns Spartan Elite Security, which specialises in home guarding as well as close protection. He says demand has boomed among athletes, and particularly top footballers, who want to deter both obsessed fans and opportunistic intruders, who can easily ascertain when a player will be away from the fixture lists. AdvertisementHull has received unwanted packages at her home address and has to deal with fans who believe they have a relationship with herROSLAN RAHMAN/AFPWhen players are transferred, Sotiropoulos is now also brought in as a consultant to carry out risk assessments and reinforce the security at their new homes. “They have hundreds of thousands of followers on social media. It’s part of their job to post, but they need to be careful because the criminals can find out where they live easily,” he says.• Emma Raducanu to play at Indian Wells Open after stalker incidentA high-profile sporting client of Schillings, the reputation and privacy consultancy that has acted for the royal family, mentioned in an interview that they had moved house and liked a new café in the area. A stalker appeared days later and waited until they saw the person and followed them to their home. Much of online security work is “basic hygiene”, removing compromising material from an athlete’s social media, along with external information that poses a risk and strengthening passwords. “You need to defend your personal device as if it were your house keys,” says Adam Wilkinson, who leads the critical risk division. “Is your information on the dark web? The answer for 99 per cent of people in the world is yes, and it can be pieced together.”But the biggest problem Schillings encounters in relation to athletes is actually blackmail. “These things run from the salacious boy-meets-girl type story, which turns into intimate photos or hacked iCloud accounts and affairs to, ‘I found out this information about your family and if you don’t want me to attack them, you’re going to bowl a wide in the third over.’ You don’t read about that very often because hopefully we defeat the criminals, but it is a serious risk to young athletes who have a lot of money and don’t necessarily put a filter on what they’re doing.”Seles, right, with Graf at the US Open final in 1996, survived being stabbed courtside by a fan of her German opponent in 1993AFPTo mitigate that threat, some sporting clients are using geofencing on their children so, if they deviate from the area they are supposed to be in, it triggers an automated silent alarm on a wearable tracking device. A particularly cautious athlete in the US uses red teaming, a simulation where Schillings try to breach their own client’s digital and physical space to see if they are detected. Some have now also moved to having their technology constantly monitored to ensure a third party has not gained access or only use ultra-secure highly encrypted devices.AdvertisementAdvancements in AI have made it easier to monitor obsessive or threatening behaviour online, but Wilkinson concedes that “if a high-level bad actor wants to get into your mobile phone, they will be able to do it”. The incentive for that calibre of involvement has increased dramatically, too, as sports stars increasingly mingle with senior figures within international governments, be it players at state-owned football clubs, boxers who dine with a close friend of the Crown Prince in Riyadh, or the friendship between the UFC president Dana White and Donald Trump.The prevailing sense is that this is only the tip of the iceberg. Beyond sport, the killing of Brian Thompson, the chief executive of United Healthcare, in New York in December has caused an enormous industry-wide spike in enquiries. “That exposed the underbelly of the angry hate mob and it’s only getting angrier and bigger,” says Simon Rowland, chief executive of Veritas International, who has orchestrated the security for four British & Irish Lions tours as well as for individual athletes. “The UK has been at least ambivalent towards the concept of tailored security solutions for high-profile executives. People who are successful, whether in the sporting field or otherwise, are naturally reluctant to accept full-time security because it does change your life, there’s no hiding that fact. Unfortunately, Emma has got to make that change now because of that recent experience. The most common thing I hear is, ‘I never thought it’d be me.’ ”Related articlesVideo IconVIDEORaducanu to play at Indian Wells Open after stalker incidentFebruary 27 2025, 4.45pmStuart Fraser, Tennis CorrespondentRaducanu security ramped up by ex-US Secret Service agentFebruary 24 2025, 5.00pmStuart Fraser, Tennis CorrespondentVideo IconVIDEOEmma Raducanu, Monica Seles and the sinister side of successFebruary 20 2025, 12.00amRick BroadbentPROMOTED CONTENT"
