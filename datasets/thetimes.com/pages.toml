title = "The best films of 2025 so far"
description = "From the Brazilian drama I’m Still Here to the new Bridget Jones film, here are the year’s best movies chosen by our critics — and the ones to look forward to"
full_description = "Video IconVIDEOThe best films of 2025 so farFrom the Brazilian drama I’m Still Here to the new Bridget Jones film, here are the year’s best movies chosen by our critics — and the ones to look forward toThe defiant Paiva family in the powerful Brazilian drama I’m Still HereTom Shone, Film Critic, The Sunday TimesSunday March 02 2025, 12.01am, The TimesHere our film critic Tom Shone picks his highlights of the year so far — and lists the most anticipated films yet to hit our screens. Be sure to check back often, as we’ll be updating this list regularly. I’m Still HereThe highest-grossing Brazilian movie since the pandemic, Walter Salles’s I’m Still Here, is — yep — another powerful film about the military dictatorship that occupied that country from 1964 to 1985. The film opens on Ipanema beach in 1970, where Rubens Paiva (Selton Mello), his wife, Eunice, and their five kids are playing football. They’re an adorable family, whose sprawling energy proves infectious even as military helicopters fly ominously overhead. The actress who plays Eunice, Fernanda Torres, gives a fiercely controlled, quietly powerful performance of a woman keeping body and soul together for the sake of her family. For all its sadness, the film bears witness to an immense fortitude. The family’s defiance in the face of the regime is there in the title: Still Here.15, 138min• Oscars favourites 2025: where to watch the nominated filmsWatch the trailer for Bridget Jones: Mad About the BoyBridget Jones: Mad About the Boy“There they all are, all the old voices, giving advice,” a sombre Bridget (Renée Zellweger) notes at the beginning ofBridget Jones: Mad About the Boy — she is four years into grieving the death of Mark Darcy (Colin Firth). Despite that, the party is still going on in the new film, but it’s got that slightly delirious, end-of-the-evening vibe, when people can’t really tell how drunk they are, and friends start singing songs and getting sentimental with one another. But we’ve grown old with these characters too, so the whole thing packs a surprisingly emotional wallop. In fact, if you hold the series in any regard whatsoever, you’ll be a complete Bridget-style mess by the end of it. Bring a box of Kleenex. 15, 125minSeptember 5 revisits the massacre at the 1972 Munich OlympicsJÜRGEN OLCZYK/PARAMOUNT PICTURESSeptember 5A taut, ticking-clock thriller about ABC’s news coverage of the Munich massacre at the 1972 Olympic Games. I must confess, I have a weakness for pressure-cooker procedurals featuring lots of people barking into walkie-talkies and Bakelite telephones about matters of life and death while the clock ticks. The tale has no heroes. Mistakes are made and by the end all we get are a succession of ashen-faced journalists hanging their heads in shame, even the golf tournament guy. Hindsight can be such a flattener of good drama. 15, 95minAdvertisementThe Seed of the Sacred FigConceived in captivity and shot secretly before its director, Mohammad Rasoulof, was forced to flee Iran, The Seed of the Sacred Fig easily gets the award for the year’s most daring production history. The film is pretty good too — an intimately observed family drama that morphs into an impassioned political thriller set against the backdrop of the “Woman, Life, Freedom” protests that gripped Iran after the death in police custody of 22-year-old Jina Mahsa Amini. What stays with you are the real-life horrors witnessed on the streets of Tehran and the image of buckshot removed from a girl’s face with tweezers and dropped into a bloody sink. 15, 167minPresenceThis film is one of those ingenious, micro-budget contraptions, seemingly shot on an iPhone, which the director uses to keep his hand in these days. It’s the film-making equivalent of one of those bicycles that folds into a backpack, small but perfectly formed — a David Koepp-scripted supernatural drama about a family whose house is haunted by a ghost, shot from the point of view of the ghost.15, 85minTimothée Chalamet as Bob Dylan in A Complete UnknownMACALL POLAY/PAA Complete UnknownThat Bob Dylan was, in addition to being a transformative musical genius, a colossal arsehole — unfaithful to those who loved him, cruel to those who supported him — is not lost on James Mangold’s marvellous film, which manages to make Dylan matter even to those who are not ardent Dylanologists. Adapted from Elijah Wald’s 2015 book Dylan Goes Electric!, A Complete Unknown forgoes the usual cradle-to-grave biopic approach. What we have is less a biopic and more an origin story: the day the folk star went rock’n’roll.15, 140minBabygirlCementing her status as Hollywood’s boldest actress, Nicole Kidman bares herself every which way — physically, emotionally and artistically — in Babygirl, Halina Reijn’s film about a torrid workplace affair that pushes its participants to the edge of destruction and its audience to the edge of embarrassment. As squirm-inducing as it is riveting, it’s the kind of film that makes you grateful for the darkness in which films are shown.18, 114minWatch the trailer for A Real PainA Real PainKieran Culkin takes his motor-mouthed candour for a delightful, rip-roaring spin in Jesse Eisenberg’s film about two cousins touring Poland in remembrance of their recently deceased grandmother. The film is one of those elegant, odd-couple two-handers, elevated by pithy, resonant writing, which used to be a Hollywood mainstay, and Culkin is fabulous as the weed-smoking Benji — as joyous and melancholic as the spectre of Hamlet’s Yorick, trying to provoke an unfeeling world into caring.15, 90minAdvertisementWe Live in TimeThis absolutely darling new film stars Andrew Garfield and Florence Pugh as a couple who meet after she runs him over when he wanders into the road. The pair are in their element because the set-up allows them to play to type, safe in the knowledge that they won’t get boxed in. Garfield is able to play into how deeply adorable he is and Pugh is able to be her usual bold, brassy self without fear of obnoxiousness because even her ambition has a seize-the-day poignancy.15, 108minComing later this yearHighest 2 LowestAn adaptation of Akira Kurosawa’s 1963 crime thriller about corporate shenanigans, directed by Spike Lee and starring Denzel Washington and Jeffrey Wright? Yes please. Kurosawa’s film about a businessman forced to decide between gaining executive control of his board and lending his employer the money to free his child from kidnappers has the perfect moral hook to anchor a fast-moving, top-notch thriller. Expected spring Ethan Hunt, played by Tom Cruise, returns for the final instalment in the all-action Mission Impossible franchisePARAMOUNT PICTURESMission: Impossible — The Final Reckoning The Mission: Impossible series, urged on by the indefatigable Tom Cruise and his partner in crime, the director Christopher McQuarrie, seems to be going out on a high — with Cruise hanging from a bright yellow biplane, among other perilous activities. Hayley Atwell, Ving Rhames, Simon Pegg and Vanessa Kirby all reprise their roles to give one of the all-time great action franchises a send-off. May 2128 Years LaterYes, it is almost 28 years since Danny Boyle gave us his zombie classic 28 Days Later. Returning to the director’s chair for the first time since his 2019 film Yesterday, Boyle, working with the series’ original writer, Alex Garland, has cooked up a fresh apocalypse for Cillian Murphy, Aaron Taylor-Johnson, Jodie Comer and Ralph Fiennes. Be afraid, be very afraid. JunBrad Pitt and Damson Idris in F1ALAMYF1The Top Gun: Maverick director Joseph Kosinski directs Brad Pitt as a Formula 1 world champion persuaded to come out of retirement to mentor a driving prodigy (Damson Idris). Shot during Grand Prix weekends and co-starring Kerry Condon, Javier Bardem and Tobias Menzies, the film, to judge by its trailer, promises state-of-the-art driving sequences and a killer soundtrack. JunAdvertisementThe Battle of Baktan CrossDirected, written and produced by Paul Thomas Anderson, The Battle of Baktan Cross is a crime thriller starring Leonardo DiCaprio, Sean Penn, Regina Hall, Benicio del Toro and Alana Haim. Rumoured to be Anderson’s take on Thomas Pynchon’s Vineland, the film, shot in Mexico, California and Texas, has his biggest budget ($140 million) and is his first shot in Imax — his boldest gamble yet. AugThe Running ManEdgar Wright directs Glen Powell in this adaptation of the Stephen King novel about a deadly game show in which a man must outrun killers to win a cash prize and save his child. Pledging greater fidelity to King’s original novel than the Arnold Schwarzenegger adaptation of 1987, Wright’s version, shot in England last year, also stars William H Macy, Michael Cera and Josh Brolin. Expect to be run off your feet. NovThe Lost BusMatthew McConaughey’s first lead role in six years is as a down-on-his-luck bus driver trying to ferry 22 kids to safety in the middle of California’s biggest forest fire. Based on a true story, it co-stars America Ferrera. It’s the director Paul Greengrass’s first film since News of the World in 2020 and is reportedly a return to what he does best: an edge-of-your-seat thriller about contemporary world events. Speed in the age of global warming. NovAvatar: Fire and AshJames Cameron directs the third instalment of his therapy course for Hollywood geniuses suffering from a God complex. Starring Sam Worthington, Zoe Saldana, Sigourney Weaver, David Thewlis, Giovanni Ribisi and Michelle Yeoh, this returns to Pandora to explore the flora and fauna of the “Ash people” who represent fire, have red skins and do not seem committed to a model of sustainability. DecNouvelle VagueShot in black and white in French, Richard Linklater’s film, starring Zoey Deutch as Jean Seberg and Guillaume Marbeck as Jean-Luc Godard, recreates the making of Godard’s Breathless — the written-and-shot-on-the-fly classic that launched a thousand and one films featuring lovers on the lam, edited like jazz. Can the laidback Linklater rebottle that electricity? He is certainly the American director closest to Godard’s low-budget indie spirit. Release date tbcAdvertisementAfter the HuntThe director on a hot streak, Luca Guadagnino, directs Julia Roberts in this thriller about a college professor forced to grapple with her secretive past when a star pupil levels an accusation against one of her colleagues. Also starring Andrew Garfield, Michael Stuhlbarg and Chloë Sevigny, the film seems like Guadagnino’s boldest bid for the mainstream and an overdue return to the big screen for Roberts. Release date tbcThe Smashing MachineBenny Safdie directs Dwayne Johnson as the wrestling legend Mark Kerr, whose career in no-holds-barred bouts — he was famous for headbutting grounded opponents — and struggles with painkiller addiction were first shown in an HBO documentary of the same name. Emily Blunt plays his girlfriend, Dawn Staples. Could the Rock finally be headed for the Oscars? Release date tbcMarty SupremeThe other Safdie brother, Josh, directs Timothée Chalamet in this film about the American table tennis legend Martin “Marty” Reisman, known as “the Needle” because of his slight build, who won 22 major table tennis championships, including two US Opens and a British Open. Also starring Gwyneth Paltrow, Fran Drescher, Sandra Bernhard and Tyler the Creator, and costing $90 million, it represents the indie studio A24’s biggest splurge to date. Release date tbcFrankensteinMonster maestro Guillermo del Toro takes on Frankenstein for Netflix, with Oscar Isaac as Victor Frankenstein, the doctor who electrifies dead tissue into a new being, played by Jacob Elordi. Shot in the ruins of Scotland’s great houses, the film also stars Mia Goth, Christoph Waltz and Charles Dance, and promises a full English breakfast of Mary Shelley’s classic with all the gothic trappings. Release date tbcWhat are your favourite films of the year so far? Let us know in the comments belowAdvertisementTwo-for-one cinema tickets at EverymanMake Wednesday your go-to cinema day. Each month Times+ members can bring a friend for free at Everyman on a Wednesday. The perfect cinema experience with plush sofas, a full bar and great food. Visit mytimesplus.co.uk to find out more.CultureFilmRelated articlesWho is on the Bafta film awards longlist?January 03 2025, 5.00pmDavid Sanderson, Arts CorrespondentVideo IconVIDEOOur critics pick the top 25 films of the year you can watch nowDecember 17 2024, 5.00pmKevin Maher | Tom ShonePROMOTED CONTENT"
