["https://thetimes.com/culture/books/article/waste-wars-dirty-deals-rivalries-rubbish-alexander-clapp-review-mhjvx8jbs"]
title = "The dirty truth about where your rubbish goes"
description = "Burning plastic, buried paint sludge, poisoned children and scammers populate the pages of Waste Wars, Alexander Clapp’s shocking investigation of the global trash trade"
full_description = "ENVIRONMENTThe dirty truth about where your rubbish goesBurning plastic, buried paint sludge, poisoned children and scammers populate the pages of Waste Wars, Alexander Clapp’s shocking investigation of the global trash tradeA man scavenges among the waste in GhanaMANIGLIA ROMANO/PACIFIC PRESS/LIGHTROCKET/GETTY IMAGESJames McConnachieSunday March 02 2025, 12.01am, The Sunday TimesYou have to love the magic trick of the recycling bin. The unending tsunami of plastic that pours into my house from the supermarket is rinsed, sorted and popped into the reassuringly green wheelie bin before being carted off fortnightly by the men from the council.After that it goes, well, I know not where — and that is where this horrifying book steps in. Alexander Clapp, a journalist, follows the trail from our recycling centres via shadowy “waste brokers” to the poorer countries where much of it ends up. He descends on the shipbreaking yards of Aliaga in Turkey, where cruise ships are dismantled by men wielding blowtorches, and on Agbogbloshie, the toxic slum at the heart of Ghana’s capital, Accra, where unwanted phones and computers are pulled apart for their valuable metals and the leftover plastic is burnt in the open air.I’ve read books that have made me tearful, nauseous and aroused, but never one that made me actually feel the acrid taste of burning plastic at the back of my throat. In Gedangrowo, East Java — one of the notorious “trash towns” of Indonesia — Clapp finds a “plantation of plastic” carpeting the countryside at depths of anything from two feet to two storeys. Women rake it over, in shifts, to dry it in the sun before selling it to be burnt.The place feels “like a jungle outpost, a drug den, a rebel encampment”. But it is also doing very well for itself as an “inside-out oil well”, where dog-food bags and deodorant sticks from all over the world are turned into cheap fuel. All this activity has been illegal since Indonesia banned imports of foreign waste, but the locals have carried on regardless. They have even built their own makeshift roads to literally get around the authorities.Rather bravely, Clapp also visits the neighbouring village of Bangun only a few months after another journalist was stabbed there for asking questions about where the rubbish came from. Clapp meets the big boss, Mohammed Ikhsan, expecting to confront him, but is confronted instead with difficult questions. “Go check our rivers. There is no trash in them,” Ikhsan tells him. “We value every piece of plastic here in Bangun.” Unlike the West, it is implied — where most of the plastic comes from.AdvertisementThe fuel created in Bangun and Gedangrowo is sold for burning by local tofu and cracker factories. Tragically it is done at temperatures too low to break down the toxic additives in the plastics. So the toxins pass into the air, and into the tofu and the crackers. With waste, someone else always pays the downstream cost.Agbogbloshie, in Ghana, is even more dismaying. This “economic purgatory” of a slum lies near Accra’s glossy sports stadium — “a sepulchral coliseum that rises forth from the sizzling pavement like a stale wedding cake”. (Clapp’s travels do inspire some punchy writing.) It handles astounding volumes of waste electronics. Except that none of this deluge of phones and laptops actually arrives in Ghana as waste: that would be illegal. It comes in the guise of resales or charitable donations, even though, in reality, a quarter of the items do not work on arrival and most stop working within three years.A “trash town” in West Java, IndonesiaAGUNG FATMA PUTRA/SOPA IMAGES/LIGHTROCKET/GETTY IMAGESClapp invites you to consider all the electronic devices you have ever owned. They may have ended up here, beside a slum lagoon in west Africa, where, after the metals are stripped, the bola — or unusable parts — are burnt. The scene looks to Clapp “like so many tent fires of an encamped army”, and it leaves air and soil that is miserably, dangerously contaminated. A child who eats a portion of chicken in Agbogbloshie apparently absorbs 220 times the amount of chlorinated dioxins deemed safe by the European Food Safety Authority.Some of Agbogbloshie’s devices are mined for information, as well as silicon and copper. Clapp heads to the Wembley Pub, where scammers and identity thieves meet to sip energy drinks, show off their “glittering shirts” and compare stories of “big fish” they have reeled in — like the divorced American men who, they claim, have added them to their wills, or the European women sending thousands of dollars to Ghanaian boys claiming to be stranded French legionnaires. Again, though, it is Clapp who is confronted, rather than the “browser boys”. He is persuaded that they are engaged in “long-range economic retaliation on the richer half of the world”. A “scam generosity”, he writes — all those donated phones — “has given way to an economy of scammers”.What all this amounts to is a massive transfer of waste “from the world’s richest countries to those places that can least afford to handle it”. Clapp calls it “a funhouse-mirror version of the globalised economies of extraction, production and consumption”.AdvertisementHe is undoubtedly right, but if you detect a certain smoulderingly leftist rage there, you are not wrong. Elsewhere, Clapp describes a giant cruise ship being dismantled in Turkey as “a floating shrine to the stupefying self-indulgence of America’s cruise ship industry”. To be fair, he had just visited the grave of a young Turkish man “roasted alive” by an explosion in the 14-storey Carnival Inspiration, a cruise ship that had been sent to Turkey for dismantling.Men burn electronic waste in Agbogbloshie, GhanaTHOMAS IMO/PHOTOTHEK/GETTYPowering this “garbage imperialism” is, bizarrely and tragically, nothing other than our own environmental legislation. The West’s desire to clean up its act has made it expensive or outright impossible to deal with the problem closer to source. Why pay hundreds of dollars a tonne to bury paint sludge according to stringent regulations when you can ship it abroad for next to nothing? Why deal with plastic expensively at home when you can cheaply add to a landfill island in the Maldives that is already the size of 25 aircraft carriers?Servicing this trade in rubbish is a murky network of international waste brokers. These “grifters and hustlers” operate global businesses but are very much not global brands. “They don’t have websites. They have WhatsApp numbers.” Electronics are openly traded, smuggled or donated as aid. Ships are transferred to laissez-faire “black flag nations” then sold via brokers while anchored in international waters. Plastic waste is routed via “stacks of shell firms incorporated in tax havens”, obscuring its origins. “At its most nefarious,” Clapp says, “the global waste trade is an outright criminal enterprise.” But what he never quite does is join the dots or name the names, and it’s unclear exactly how — or how legally — the waste leaves the West in the first place. Did the lawyers get nervous?• The 16 million waste pickers collecting the world’s plastic push for a fairer dealAdvertisementAlso missing from the book is any admission that recycling could be even part of a genuine solution. Clapp dismisses it as “a deliberate deception foisted on residents of rich countries” and “just another gamey stroke of industry advertising”. For one thing, he says, the recycling process simply does not work with plastic. Plastics are like cheeses in that “it is unfeasible to melt mozzarella down and expect to produce parmesan”, and even the most recyclable types of plastic can only go through the process two or three times. Then there’s the economics — it is always cheaper to make new plastic. And the additives: plastics are full of flame retardants, plasticisers, stabilisers and other “chemically ingrained” toxins. As for burning the stuff, or turning it into fuel, Clapp is equally sceptical. He mentions one of the hot-topic innovations of recent years, “advanced chemical recycling”, which is a way of turning plastic into a liquid fuel. Clapp calls it “filthy” and “a disastrous solution to a problem that has already largely been solved by renewable energy”.The answer, for Clapp, is regulation — or “requiring waste’s perpetuators to become financially liable for the fate of that which they insist on overproducing”. Pending global agreement, it seems that we will go on producing the equivalent of the entire weight of our species in plastic every year. And continue swimming in it, burning it, breathing it in and eating it. (Yes: we apparently consume the equivalent of a credit card’s worth of plastic, in weight, every week.) And continue popping it in the magical recycling bin awaiting its transubstantiation.Waste Wars: Dirty Deals, International Rivalries and the Scandalous Afterlife of Rubbish by Alexander Clapp (John Murray £25 pp400). To order a copy go to timesbookshop.co.uk. Free UK standard P&P on orders over £25. Special discount available for Times+ membersCultureBooksRelated articlesBOOKS I ENVIRONMENTHow climate change is making us cranky, dopey and sickApril 06 2024, 12.01amBen CookeBOOK OF THE WEEKFrom the collapse of Rome to Brexit — it’s all thanks to our ever-changing climateFebruary 26 2023, 12.01amDan JonesPROMOTED CONTENT"
