["https://thetimes.com/business-money/companies/article/jes-staley-jeffrey-epstein-value-judgment-zvfd89fbw"]
title = "Jes Staley, Jeffrey Epstein and the value of judgment"
description = "The former Barclays boss has little to gain from fighting the regulator’s decision to fine and ban him, even if he wins"
full_description = "OLIVER SHAHJes Staley, Jeffrey Epstein and the value of judgmentThe former Barclays boss has little to gain from fighting the regulator’s decision to fine and ban him, even if he winsOliver ShahSunday March 02 2025, 12.01am, The TimesAlmost exactly five years ago, I described Jes Staley’s deepening travails at Barclays as being like a theatrical production of Voltaire’s Candide, with Staley the naïve, wide-eyed protagonist repeatedly led into trouble by a cruel world.The triangular-jawed Wall Streeter had already got into scrapes by intervening in a dispute involving his brother-in-law and the private equity giant KKR, falling for prank emails and trying to unmask a whistleblower. He was fined by two City regulators for the latter offence and probably should have resigned at that point. Instead, he struggled on, apparently still believing in the best of all possible worlds.But February 2020’s news ended up being terminal. Barclays revealed that it was being investigated by the Financial Conduct Authority (FCA) and the Prudential Regulation Authority over its characterisation of its chief executive’s relationship with the late sex offender Jeffrey Epstein. On Staley’s guidance, Barclays had told the watchdogs there was no close friendship and that contact had ceased well before Staley arrived at Barclays in 2015. But emails helpfully released by Staley’s former employer, JP Morgan, seemed to demolish both assurances. Staley stood down to fight the FCA’s case in 2021, and in 2023 the regulator announced that it intended to fine him £1.8 million and ban him from holding a senior position in UK financial services again.A story that could have ended there will be revived this week when our disgraced Candide’s appeal against the FCA’s verdict begins at the Upper Tribunal. Staley is now 68 and would be unlikely to get another big job anywhere, even if he manages to win. Yet he is determined to argue that the FCA’s process was unfair, that it relied on the selective use of old documents, and that Staley was far from unique in having dallied with Epstein.His case doesn’t quite spell it out, but there is a sense that he thinks the FCA was out to get him, having failed to scalp him over the whistleblowing incident, and that he was knifed by JP Morgan, run by a man he had once hoped to succeed — Jamie Dimon.AdvertisementThe FCA’s statement of case and skeleton argument exhume the many embarrassing pieces of evidence raised against Staley: his congratulatory email to Epstein after he was released from prison for soliciting prostitution from a minor (“I toast your courage!!!!!”), the visits to Epstein’s private island and ranch in New Mexico, the professions of “deep” and “profound” friendship, the emails from Epstein attaching pictures of women, the emails from Staley referring to “Snow White” and “Beauty and the Beast”. They show that the two were in direct contact until three days before Staley’s Barclays appointment was announced, and that they continued to communicate via Staley’s daughter, Alexa, for years. At one point she relayed Epstein’s suggestion that Staley become Donald Trump’s first Treasury secretary.Judgment is one of the most important things in business, and life. It is usually noticeable only when glaringly absent. Staley was, and probably still is, blessed with a salesman’s charm. But his career at Barclays was a long list of terrible decisions. The hearings this week will form an apt coda. Whatever the outcome, Staley and Barclays lose from the revival of this tawdry drama.WFH: breakfast, then ShakespeareDimon may have rowed back slightly from his latest work-from-home rant, but I had a lunch with an old friend last week that corroborated his basic complaint (“Don’t give me that shit that work-from-home Friday works”). It was amazing not just because we shared a creamy wagyu steak and a lusciously caramelly bottle of Rioja, but because this person — who works for a consulting firm that most would perceive to be high-performing — told me he had taken to slacking off epically.Irked by what he saw as a collapse in the firm’s culture and — perhaps more importantly — meagre pay rises during a period of high inflation, he simply decided to do less work. He now rarely goes into the office. He gets up late, does the school run, enjoys a leisurely breakfast, then does some DIY or potters around the house. He has taken to reading Shakespeare. He guesstimated that he did about two hours’ work a day.Most remarkably, nobody even seemed to have noticed. How many other WFH-ers are mowing the lawn or flicking through The Merchant of Venice when their calendars are blocked out?AdvertisementAlleged AfD donor’s London linksThe next time you walk into Liberty London or Kensington Roof Gardens, think of who owns the building. Henning Conle, 81, a German, has amassed a UK property empire worth about £2 billion. He is also an unsavoury political donor. The Bundestag has fined the hard-right Alternativ für Deutschland (AfD) party in the past for accepting donations from Conle via “straw men”. These included €132,000 for the office of Alice Weidel, the AfD’s candidate for chancellor.The AfD is now facing a fine of €7 million for allegedly disguising a €2.4 million gift from Conle made via an Austrian politician. It funded a billboard campaign for last month’s elections, which saw the AfD finish second. Conle was always viewed as a mysterious player in the UK real estate market. The latest claims only raise more questions.Vogue House: gateway to a Casa?Casa Cipriani, the New York and Milan private members’ club beloved of the cashmere quarter-zip crowd, is said to be looking at a site in London. The property being talked about is Vogue House, sold by publishing group Condé Nast to shipping tycoon Eyal Ofer last year as the magazine’s staff were decanted to the Adelphi building on the Embankment.Edward Enninful, former editor-in-chief of British Vogue, described Vogue House as “like the gateway to a dream”. Casa Cipriani would offer ita more glamorous afterlife than an office conversion.Business & MoneyCompaniesRelated articlesOLIVER SHAH | AGENDABarclays needs to resolve its identity crisisFebruary 18 2024, 12.01amAfD faces €7m fine for ‘lying’ over donations linked to property mogulFebruary 19 2025, 6.45pmOliver Moody, BerlinPROMOTED CONTENT"
