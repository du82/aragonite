["https://thetimes.com/business-money/companies/article/mclaren-f1s-zak-brown-red-bulls-in-disarray-were-full-throttle-9gq6ltgdl"]
title = "McLaren F1’s Zak Brown: from school dropout to speed king"
description = "The McLaren Racing boss reveals how he turned the British Formula One team around both on and off the track, after it flirted with collapse during the pandemic"
full_description = "THE SUNDAY TIMES BUSINESS PROFILEMcLaren F1’s Zak Brown: from school dropout to speed kingThe McLaren Racing boss reveals how he turned the British Formula One team around both on and off the track, after it flirted with collapse during the pandemicJohn ArlidgeSunday March 02 2025, 12.01am, The Sunday TimesILLUSTRATION BY TONY BELLJohn ArlidgeSunday March 02 2025, 12.01am, The Sunday Times“Make some noise and raise the roof for the world champions — McLaren!” the announcer roared as McLaren driver Lando Norris took to the stage in London’s O2 arena last month for the formal launch of the new Formula One season. “We’re excited,” said Norris as he celebrated his team’s victory last season in the constructors’ championship — the title awarded to the most successful F1 team throughout the racing year.Norris, a Briton who came second to Red Bull’s Max Verstappen in last year’s drivers’ championship, believes that with “a lot of work from the guys and the girls back in the factory” McLaren can go one better and win both the constructors’ and the drivers’ titles this year, completing a remarkable financial and sporting turnaround for the British team. Five years ago McLaren was preparing for bankruptcy. “Today it starts,” he said.The chief guy back in the McLaren Racing factory, just outside Woking, Surrey, is Zak Brown, the CEO. He accepts the challenge. “I’m starting to hear Lando is the odds-on favourite,” he says, glancing expectantly towards the lobby of McLaren’s headquarters, the floor of which is covered with its race-winning F1 cars of old, driven by James Hunt and Niki Lauda.The McLaren team celebrate during the F1 Grand Prix of Emilia-Romagna last year in Imola, ItalySTEVEN TEE/2024 LAT IMAGESWhich rival is he more worried about: Verstappen or Lewis Hamilton, who will race for a resurgent Ferrari team this season? Verstappen is the man to beat. “He’s an unbelievable talent.” Does he like him? “I do.” Does he like his racing style? “Not everything he does is my cup of tea. But if you look at most great world champions, they’ve had their elbows out at some point.” The fiery Dutchman collided with Norris at the Austrian Grand Prix and in Mexico City last season, and was punished with hefty time penalties. He was booed by British fans at last week’s F1 launch.AdvertisementBrown thinks McLaren can beat Red Bull because of weaknesses in the Red Bull garage. “One of the things that has made us so competitive is unity … They’ve had a lot of issues, away from the racetrack. They’ve lost a lot of quality people. Half their pit wall!”Red Bull’s chief technical officer, its head of race strategy and its chief engineer have all quit. Insiders at the Milton Keynes-based team say many top executives were angered by the obdurate manner in which team principal Christian Horner acted after he was investigated and then cleared, twice, over allegations of controlling behaviour towards a female employee, which he has always denied.Verstappen’s father, Jos, publicly called for Horner to step down, warning that Red Bull was “in danger of being torn apart”. Brown agrees: “If I felt I’d lost the factory floor and couldn’t lead the team, that they didn’t believe in me, that’s not a good place for a racing team or any business.”Brown, who is wearing a light blue open-neck shirt and dark trousers when we meet, is on a roll now. He has a dig at Horner for his habit of talking to Red Bull drivers on the team radio during races, rather than leaving that task to the team’s race director. “Some team bosses come on the radio because they want to create a perception to the general public that they’re doing more than they are in a race situation. I would never do that because I wouldn’t want my own team to look at me and go: ‘Zak’s taking credit for stuff he shouldn’t take credit for.’”AdvertisementBrown is a natural-born scrappy competitor, a quality that has helped him propel McLaren Racing — the sports car division is a separate business — back on to the podium after years of failure on and off the track. Born in California, he never graduated high school. “I was thrown out for fighting.” He grew up dreaming of becoming a baseball player but he shifted gears when his parents took him to the 1981 Long Beach Grand Prix. “I fell in love. The sound, the speed.”Zak Brown in racing overalls, August 1992ALAMYBrown went back to watch the race — now IndyCar — six years later, met American F1 driver Mario Andretti and asked him how to get into motorsport. Take up karting, Andretti advised. Brown had made more than $1,000 by pawning some Cartier watches he had won when he appeared on the Wheel of Fortune TV game show aged 13, and used the money to buy a kart and take lessons.He came to Europe and won karting championships and went on to race in British GT and British Formula 3 in the 1990s. In 1995, he founded JMI (Just Marketing International), which grew to become the world’s biggest motorsport marketing company. He sold the firm to Chime Communications’ Sport & Entertainment agency, CSM, headed by Sebastian Coe, in 2013. Along the way he built one of the world’s greatest private car collections, including Ayrton Senna’s 1991 McLaren MP4/6. The value of his private garage? £100 million.Brown in his British Formula Vauxhall Lotus in 1992ALAMYIn 2016 he gave up the JMI CEO role to join McLaren Racing as executive director, following the departure of the hard-charging boss Ron Dennis after a bitter boardroom power struggle. Two years later he became the chief executive. “It was not the easiest start,” Brown recalls.The team, founded by New Zealander Bruce McLaren in 1963, was demoralised. It had fallen to ninth in the constructors’ title race in 2017 and failed to win a single F1 race between 2012 and 2021. When Covid hit, McLaren was “months away” from collapse, he says, and had to begin legal proceedings to protect against insolvency. Painful cuts, a stop-gap loan from the Bank of Bahrain and fresh investment from a private equity outfit, MSP Sports Capital, saved the firm.AdvertisementHis decision in 2023 to promote Andrea Stella, the acclaimed former race engineer for Michael Schumacher, to become team principal was one of the key reasons for the team’s return to the front of the starting grid. Now McLaren Racing, which is majority-owned by Mumtalakat, the sovereign wealth fund of Bahrain, is profitable again on revenues of £430 million in 2023, and “this year will be a record year in terms of finances”, Brown promises. The firm, he declares, “has never been stronger. But that was last year. We’ve got to climb the mountain again. So there is no ‘let’s take our foot off the throttle’. Foot down!”The same could be said for F1 itself. Thanks to an injection of US razzle-dazzle by its owners, Liberty Media — and the Netflix hit show Formula 1: Drive to Survive — the sport’s fan base has never been bigger. It is attracting new teams — Cadillac joins next year — and new sponsors including luxury leather goods maker Louis Vuitton, a brand as far removed from oil, sweat and exhaust fumes as you can get. Can the boom continue?Yes, Brown says, largely thanks to the budget cap imposed on teams in 2021, which means none can outspend the others to dominate. “In the past, the three or four teams that spent the most were always at the front. Now you have ten teams all spending the same amount of money and seven different drivers winning multiple races last season. It’s a better competition.”Brown may be tough on competitors, but he insists he is tougher on himself. “I’m my biggest critic, to motivate and try to improve. I’m constantly thinking: what can I do better? That’s the mindset of the organisation, too. We’re competing against unbelievable teams. The spread on the field is about 2 per cent, so you don’t have to be off your game by much to fall behind.” AdvertisementWhat have been his biggest mistakes? “We should have won at Silverstone last season. How the race played out, we got that wrong. We could have won at Monza.”If there are no race-day errors this season and Norris does become the first Englishman to win the F1 drivers’ title for McLaren since Lewis Hamilton in 2008, Brown faces a ticklish problem. He celebrates key victories by getting tattoos. On one shoulder he has the outline of Italy’s Monza circuit, inked after Daniel Ricciardo won the team’s first victory in nine years there in 2021. On the other shoulder he has the Miami circuit to mark Norris’s win there last year. If Norris is victorious, what tattoo will he get and where?For once, Brown is stumped for words. Would he have a tattoo of Lando’s name, I suggest. “Lando’s name on me would be weird,” he replies. Perhaps he should ask Christian Horner where to stick it.Brown’s last holiday was in PhuketGETTYThe life of Zak BrownBorn: November 7, 1971Status: married with two sonsEducation: did not make it through high schoolHome: SurreyFirst job: Bagging groceries at a Gelson’s supermarket in Los AngelesSalary: £26 millionCar: Porsche 959Watch: Richard MilleFavourite book: The Big Moo: Stop Trying to be Perfect and Start Being Remarkable, edited by Seth Godin, “because I’m featured in it!”Film: history or mafia documentariesMusic: Hall & Oates, Red Hot Chili PeppersDrink: greyhound classic cocktail: gin or vodka with grapefruit juiceGadget: “My phone charger!”Last holiday: Phuket for ChristmasCharities: Husky Halfway House, dedicated to rescuing huskies and other northern breed dogsAdvertisementWorking day: Zak Brown drives around the lake to the entrance of McLaren’s Norman Foster-designed headquarters just outside Woking at 8am. He hates getting stuck in his office — “conference call, conference call, conference call” — so he sets aside time to walk around the different departments in the factory, including the wind tunnel, engineering, and commercial departments. “My view is I work for the team, the team doesn’t work for me.” He admits he does not understand the finer technical details of the engineering that can shave 1/100th of a second off a lap time but he likes to ask: “Do you need more equipment? How’s your headcount? Everything good?” He gets home at 8pm and does another hour’s work.Downtime: Brown “hangs out” with the family, plays golf or races cars. He particularly enjoys the Monterey Historics, now the Rolex Monterey Motorsports Reunion — a four-day vintage motor racing event held in the final weekend of Monterey Car Week in California, in which he likes to drive an old F1 car, a Porsche 935 or a Jaguar XJR-10 from his private collection of 50 cars, which is housed in a hangar in Yorkshire.Business & MoneyCompaniesRelated articlesMOLLY HUDSONF1’s glitzy launch — Boos for Horner and Gordon Ramsay backs swearingFebruary 19 2025, 9.45amMolly Hudson, Motor Racing ReporterNorris wins in Abu Dhabi to secure McLaren’s first title in 26 yearsDecember 08 2024, 3.00pmMolly Hudson, Motor Racing ReporterPROMOTED CONTENT"
