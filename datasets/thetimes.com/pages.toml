["https://thetimes.com/comment/columnists/article/the-pandering-to-trump-must-end-it-only-encourages-his-tyranny-fqk0js3sf"]
title = "The pandering to Trump must end — it only encourages his tyranny"
description = "Never again can we allow the bully in the White House to isolate one of our friends as he did Ukraine"
full_description = "MATTHEW SYEDThe pandering to Trump must end — it only encourages his tyrannyNever again can we allow the bully in the White House to isolate one of our friends as he did UkraineMatthew SyedSaturday March 01 2025, 5.35pm, The Sunday TimesWake up, Keir. Smell the coffee, Emmanuel. Pay attention, Friedrich. Watch the press conference in the Oval Office again and again until you grasp what is unfolding before your eyes. America is trashing its most precious values (not to mention its allies) under the cultlike leadership of its president, and the Republican Party, tech bros and other useful idiots are slavishly enabling it.I hate to sound apocalyptic, but if that ten-minute exchange wasn’t a moment of clarity, I don’t know what is. As Donald Trump and his bearded lackey JD Vance bullied Volodymyr Zelensky — speaking in a foreign language and trying desperately to advocate for a nation under pitiless assault — I felt sick to the stomach. I wondered how the kidnapped children, raped women and mutilated soldiers of Ukraine felt about this co-ordinated and premeditated humiliation of a man seeking to hold the front line against tyranny.But let us rewind to Keir Starmer’s mortifying sycophancy the previous day. Even before the Zelensky press conference, I watched in astonishment as commentators lined up to laud the obeisance we witnessed in the Oval Office. Genuflecting like an errant sixth-former, Starmer paraded a letter from the King, hoping that this toadying would spare the UK the bullying endured by Panama, Canada, Mexico and Denmark. Please leave me alone, sir! Spare me, sir! I felt nauseous.Trade deal? I almost laughed when I heard the euphoric response of UK negotiators to the mirage being dangled by Trump. Do they not understand the strategy of divide and rule, so exquisitely deployed by our own Clive of India on the subcontinent? By fluttering his eyelashes at Starmer, and peeling him yet further away from the EU, Trump is manoeuvring the UK into a position of naked dependency, which he will in time — mark my words — mercilessly use against us. Do those around Starmer not see this?• Ukraine war live: follow the latestAdvertisementAny concessions to this tyrant merely encourage the madness. Look at how Trudeau offered more border guards, Colombia sent aircraft to pick up migrants and Panama bent in the wind. These were explained away as harmless retreats to avoid a larger confrontation, but there is a more apposite word: appeasement. Each concession emboldened Trump and watermarked his strategy, to the point where the classroom bully felt entitled to mock, ridicule and traduce the leader of the nation most beholden to American power, even as Zelensky — a man who knows what it means to risk his life for a bigger ideal — bravely held his ground.The drumbeat towards authoritarianism (I do not use the word lightly) in Washington is unmistakable. I am not just talking about the violations of the rule of law and trashing of long-established norms. I am not even talking about how Elon Musk, Steve Bannon and other Maga faithful deploy the Nazi salute and eulogise the AfD (it’s not even subtle any more). I am also talking of how Trump, like Napoleon in Animal Farm, has cemented his grip on the levers of lethal power, a point made by Edward Luce in the FT. Dan Caine, the new military leader, has said (according to Trump): “I love you sir. I think you’re great sir. I’ll kill for you sir.” Last week the judge advocate-generals for the three branches of the armed forces — the people who tell military leaders what is and is not legal — were all sacked. “The only thing that matters is power,” Dan Bongino, newly installed deputy head of the FBI, has said. “We have a system of checks and balances? Haha! That’s a good one.”• Can Ukraine survive without US aid?And then there’s the assault on truth. Nobody can keep up with the firehose of lies — “Ukraine started the war!”; “Zelensky’s a dictator!” — because the strategy is to demoralise the concept of truth itself. As I watched Trump and Vance gaslighting Zelensky, I could only think wanly of the words of Hannah Arendt, written after the cataclysms of the last century. “The ideal subject of totalitarian rule is not the convinced Nazi or the convinced Communist, but people for whom the distinction between fact and fiction (that is, the reality of experience) and the distinction between true and false (that is, the standards of thought) no longer exist.”AdvertisementI should perhaps say that I know only too well how we got to this frightening place. Trump’s rise was fuelled, in part, by the anger felt by American taxpayers, who have been serially ripped off by European nations failing to spend adequately on communal defence. I am not alone in having criticised this for years. We also know that immigration went up to insane levels, woke ideology reached ever deeper into our institutions and the working classes were left behind by the great wave of globalisation. Even in a column like this, context matters.But it should now be obvious that the cure is worse than the disease. We must find a way of inoculating the world against Trump and all he represents, while addressing the betrayals that invigorated his rise. This requires two things as a bare minimum. First, the EU, the UK and like-minded nations must come together to back Ukraine with more money, more weapons and whatever else is needed. Defence spending cannot dally around 2.5 per cent or even 3 per cent. We must all get to 4 or ideally 5 per cent, whatever that means in reducing other parts of national budgets. It is existential.• Reeves: I’m sending billions from frozen Russian assets to UkraineSecond, the free world must stand together in a rock-solid alliance and never allow Trump to isolate any single nation. The days of individual leaders going to the Oval Office to bob and curtsy, picked off one by one in those squalid press conferences, must end. I have thoughts about a new security architecture, pooled defence capabilities, perhaps even how the UK might start negotiations to rejoin the EU. These may sound like bold steps (to channel my inner Sir Humphrey), but never again will western leaders have an opportunity to make the changes they know in their hearts to be right.The optimist in me believes that America will, in time, return to sanity; that as this great republic notices its allies pulling their weight, the anger harnessed by Trump will abate and it will once again lead the free world. I also hope most right-minded Americans will come to see that Zelensky isn’t trying to start World War Three, as alleged by Trump, but to prevent it. For unless Putin is stopped, he will keep going, other tyrants will sniff their chance and the world will descend into a conflagration that makes previous global conflicts look like scuffles.“The men of Normandy had faith that what they were doing was right, faith that they fought for all humanity, faith that a just God would grant them mercy on this beachhead or on the next. It was the deep knowledge — and pray God we have not lost it — that there is a profound moral difference between the use of force for liberation and the use of force for conquest.” These words, spoken by Ronald Reagan at Pointe du Hoc in 1984, should be uppermost in the minds of European leaders as they meet Zelensky in London. We stand before the sliding doors of history with the future of western civilisation in the balance.CommentColumnistsRelated articlesVideo IconVIDEOZelensky meets prime minister after Trump rowMarch 01 2025, 7.15pmPeter Conradi, Europe Editor | Dominic HauschildVideo IconMARK GALEOTTICan Ukraine survive without US aid? The reality of going it aloneMarch 01 2025, 2.29pmMark GaleottiPROMOTED CONTENT"
