["https://thetimes.com/business-money/money/article/our-daughter-died-at-30-now-nationwide-is-adding-to-the-pain-0qd69ng72"]
title = "Our daughter died at 30. Now Nationwide is adding to the pain"
description = "Telling a bank that you have lost a loved one so you can close their account is stressful enough — imagine having to do it three times because of staff errors"
full_description = "YOUR MONEY MATTERSOur daughter died at 30. Now Nationwide is adding to the painTelling a bank that you have lost a loved one so you can close their account is stressful enough — imagine having to do it three times because of staff errorsKatherine Denham, Consumer championSunday March 02 2025, 12.00am, The Sunday TimesIn November my daughter, Lauren, sadly died when she was just 30. She had been very unwell for two years and spent a lot of time in hospital. My wife also cared for her when she was at home. She then caught two viruses at once, which hit her already weak immune system, and she died with us all by her bedside. We are heartbroken.In December we finally gathered our wits to sort out her finances. Lauren had saved £13,717 into a Help to Buy Isa with Nationwide Building Society. My wife and I decided to pass this on to Lauren’s brother.My wife, Margaret, visited our local Nationwide branch in Stirling with Lauren’s death certificate and other documents, and brought her own identification too. A branch assistant took copies of the documents and explained to her that she would get a letter and a form in the post that she would need to complete and sign and send it back. It said the funds would be returned to us in the form of a cheque.Lauren Hunter had £13,717 saved in her Help to Buy Isa with NationwideBut seven weeks went by without a letter, so on January 23 Margaret returned to the branch to ask why we hadn’t got the form yet. The assistant told her everything was in hand and that they had prioritised her issue.But it has now been another three weeks and we have still heard nothing. My wife was too upset to deal with Nationwide so I went to the branch myself. After watching two members of staff plug data into a computer for half an hour, they said they couldn’t tell me anything, other than that it could be their fault for not copying all the documents. AdvertisementI was told that because Margaret had registered the request in the first place, she would have to return to the branch. That’s the last thing she wants to do right now, yet Nationwide said there is nothing else it could do.We are grieving the loss of our daughter and this appalling level of service is compounding that grief. We really hope you can help to resolve this.Ewan Hunter, StirlingKatherine Denham writes I was so sorry to hear of your devastating loss. It was heartbreaking to hear how Lauren had diligently saved into a Help to Buy Isa in the hope that she would use the funds to buy her first home, but that dream never became a reality. Your request was a simple one — you had inherited your daughter’s money, which you wanted to pass on to your son. But Nationwide was making this far harder than it should have been. The building society told me that it had sent a letter to your address on December 13, yet you and Margaret were adamant that you never had any post from Nationwide.AdvertisementWhen Margaret visited the branch again in January for an update, she was forced to explain again that her daughter had died. As you so eloquently explain, issues like this can compound grief for bereaved relatives at the hardest of times. The branch assistant put a note on her record to say that she hadn’t received the letter, but failed to flag this to the bereavement team. • Unapologetic care home owes us £18,000 after my husband’s deathThis means that they did not know to send her another letter, so the branch staff member was wrong to tell Margaret that the issue would be prioritised. This was a human error, but banks and building societies should give extra support to customers who are bereaved and vulnerable, and I felt that Nationwide had badly let you and Margaret down. It told me that the branch manager had spoken to the team to make sure they understood the correct process to prevent this from happening again.I wondered why this couldn’t all be arranged online, which would save Margaret from returning to the branch for a third time. Thankfully the day after my intervention, Nationwide emailed the form, which you sent back within hours. The money was transferred a few days later with an additional £150 compensation.AdvertisementNationwide said: “We apologise to our customer for the delays they experienced at a difficult time. While the bereavement was correctly processed, it appears that they didn’t receive the letters to complete the account closure, and we missed opportunities to rectify this.”You said: “Thank you for moving this to a conclusion. It’s hugely appreciated by all of us.”My refund for free travel is nowhere to be seen after TfL cyberattack I wondered if you could help me with an ongoing battle I’m having with getting a refund from Transport for London (TfL). When I turned 60 in October, I became eligible for an Oyster card that lets me travel on London public transport free. Because TfL was the victim of a cyberattack in September, it wasn’t able to issue new Oyster cards or much else. This meant that after my 60th birthday I had to pay to travel and tapped in and out using my bank cards.I was eventually able to apply for my new Oyster card, which arrived on November 25. I then asked TfL to refund me the travel fares that I paid between my birthday and the arrival of my new card, which amounts to £68.65. Advertisement• BA bumped my 15-year-old daughter off a flightSince November I have spoken to so many people at TfL and have called at least eight times, often spending about 30 minutes on the phone, although one call lasted for an hour. During these calls I have received conflicting information about how to apply for the refund. I had initially been told to apply for a refund through the “Oyster and Contactless” section of TfL’s website, but I then discovered there is a separate section for the 60+ Oyster card so I applied for a refund there too. I thought I had finally cracked it, but that didn’t elicit a refund either.I have emailed TfL about six times and keep getting automated messages which say it will respond within ten working days, but I’ve never had a reply to my emails. I even sent a letter to TfL with all the relevant documents, including bank statements, but I’ve not had a response to that either. I know it’s not a huge amount of money but I would like it back.Stacey, London AdvertisementKatherine Denham writes In September TfL had its IT system hacked and customers’ bank account details were accessed. A teenage boy has since been arrested and anyone who is affected by the security breach should have been contacted by now.The attack disrupted TfL’s online services and its staff are still working through a backlog of refund requests. Before the cyberattack it would usually take ten days for TfL to process a refund, but between October and December, the average was 59 days. You have been waiting 80 days and counting.To apply for a refund you can call TfL or apply online through Oyster or Contactless accounts. TfL told me that you had used different bank cards for your journeys and had two Oyster accounts, so it took longer to collate and verify all the information to process all the journeys correctly. You said you had only used two bank cards — and one of them for just one journey, so you were surprised it had been so difficult for it to gather that information. With my help, TfL refunded you within two days.TfL said: “We apologise for the time it has taken to process these refunds. Following the cyber incident in September 2024, we have been working to restore our internal systems and process customer refunds as quickly as possible. Any customers who believe that they are due a refund can contact TfL customer services.”You said: “I am really grateful. You have far more unjust causes to take on so it’s really good of you to take the time to do this for me.”You have generously donated the money to your local city farm, which has been fundraising for a new roof for their donkeys.• £467,272: The amount Your Money Matters has saved readers of The Sunday Times and The Times this yearIf you have a money problem you would like Katherine Denham to investigate email yourmoneymatters@thetimes.co.uk. Please include a phone numberBusiness & MoneyMoneyRelated articlesYOUR MONEY MATTERSHMRC took £57k from my pension even though I pay tax in SpainFebruary 23 2025, 12.00amKatherine Denham, Consumer championYOUR MONEY MATTERSSally sold her car, but is still being stung for Ulez chargesFebruary 18 2025, 12.00amKatherine Denham, Consumer championHow families are rushing to protect their nest eggFebruary 15 2025, 12.00amLucy Andrews, Money reporter | Rachel Mortimer, Assistant Money EditorPROMOTED CONTENT"
