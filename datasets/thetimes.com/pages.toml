title = "What to watch on TV this week — The Ruth Ellis Story and more"
description = "Your ultimate guide to TV entertainment, chosen by our expert critics"
full_description = "VIEWING GUIDEWhat to watch on TV this week — The Ruth Ellis Story and moreYour ultimate guide to TV entertainment, chosen by our expert criticsLaurie Davidson and Lucy Boynton in A Cruel Love — The Ruth Ellis Story (ITV1, Wed, 9pm)DES WILLIE/ITVVictoria Segal | Jake Helm | John Dugdale | Helen Stewart | Andrew MaleSunday March 02 2025, 12.01am, The Sunday TimesPick of the weekA Cruel Love — The Ruth Ellis Story (Wednesday, ITV1, 9pm)The complex case of Ruth Ellis, the last woman to be executed in Britain, is sunk deep into the national psyche, its combination of sex, murder and potential injustice making it a source of continuing fascination. Ellis was found guilty of shooting her violently abusive lover David Blakely outside a Hampstead pub on April 10, 1955. She was just 28 when she was hanged three months later at Holloway prison. This four-part series isn’t the first drama to grapple with Ellis’s life and death, but its sombre, sympathetic tone chimes with her family’s enduring view that she should never have been executed.Lucy Boynton plays the brittle, resilient Ellis, while Toby Jones is her downbeat solicitor John Bickford. Based on Carol Ann Lee’s book A Fine Day for a Hanging, A Cruel Love evokes a harsh reality of unresolved postwar trauma, latent violence and deep misogyny, exposing a world in which Ellis never stood a chance. Victoria Segal• My grandmother Ruth Ellis was hanged but she deserves a pardonDocumentary choicePauline Boty — I Am the Sixties (Mon, BBC4, 10pm)Peter Blake and Jim Moir are just two of the artists featured in this programme about the life of the outrageous and boundary-pushing artist hailed as a star of London’s Swinging Sixties art scene. Boty, who rubbed shoulders with Bob Dylan and Michael Caine, died in 1966 at the age of 28, and her work was stashed in a barn by her family and largely forgotten. Jake HelmQuiz choiceRob Beckett’s Smart TV (Wed, Sky Max/Now, 9pm)The comedian is back for a second series of his TV-themed panel show, with team captains Alison Hammond and Josh Widdicombe. They will be joined by Danny Dyer and Richard Osman among other guests for some chaotic comedy and quizzing. JHAdvertisementSport choiceAthletics: European Indoor Championships (Thu, BBC2, 5pm)Apeldoorn in the Netherlands will become home to four days of action. It kicks off with the opening ceremony. With finals happening every day, expect plenty of drama. Sadly Keely Hodgkinson will miss the event because of a hamstring injury. JHOliver Jackson-Cohen and Ella Lily Hyland in Towards ZeroJAMES PARDON/BBCSundayCritics’ choiceTowards Zero (BBC1, 9pm)“I like a good detective story,” intones the solicitor Mr Treves (Clarke Peters) as he regales a table of miserable aristocrats. “But they begin in the wrong place — they begin with the murder. The murder is the end.” Full of foreshadowing, these doomy words begin Rachel Bennette’s glamorous version of Agatha Christie’s 1944 novel, a tale of grand dames and tennis stars, society divorces and love triangles, renegade policemen and rogue cousins. It’s an improvement on the BBC’s previous Christie adaptation, 2023’s lacklustre Murder Is Easy, elevated by a cast that includes Anjelica Houston as Lady Tressilian, Anjana Vasan as her companion Mary and Matthew Rhys as the troubled Inspector Leach. Bucking the trend for grimly seedy Christie adaptations, it’s a red-lipsticked, cut-glass take on a dysfunctional family affair. VS• Agatha Christie with sex and swearing: why Towards Zero is the best in yearsCall the Midwife (BBC1, 8pm)A blaze in a mother-and-baby house in Essex causes problems for the nurses of Nonnatus House when they have to find space for four suddenly homeless residents — among them the 14-year-old Paula Cunningham (Kitty Anderson), returning after her scene-stealing role earlier in the season. Nancy (Megan Cusack) is preparing for her wedding, while Sister Catherine (Molly Vevers) approaches the day she will make her first vows. The fashions might change — this being 1970, there’s a lot of orange florals and embroidered ponchos — but this show’s ability to trigger almost constant weeping with its kind nuns and newborn babies remains steady. While this is the final episode of this series, there’s no reason for fans of scenes of perilous childbirth to despair: Call the Midwife will return for a 15th series in 2026. VSThe Bay (ITV1, 9pm)DS Jenn Townsend (Marsha Thomason) returns from bereavement leave, and finds the major investigations unit as run-down, poorly resourced and under threat of closure as ever. But luckily she doesn’t have to spend much time there, as there’s a murder to solve: a student, Hannah, was strangled and dumped in the docks. Her family predictably turns out to be dysfunctional, and her housemates are also potential suspects. John DugdaleAdvertisementThe Americas (BBC1, 6.45pm)Tom Hanks narrates an “epic” nature/geography series acquired from NBC — and not to be confused with Simon Reeve’s The Americas. A first part devoted to “The Atlantic Coast” (of the US) typifies an approach in which each segment focuses on one place and one or two species. So we get a wild stallion in North Carolina, seabirds in Chesapeake Bay, a raccoon in New York City, black bears in Appalachia and a red oak in New England. JDDavid Frost Vs (Sky Documentaries/Now, 9pm)The series moves on to Muhammad Ali. Frost meets a swaggering Ali in 1968, then finds him more thoughtful in 1969 after refusing to serve in Vietnam. When Ali bids to regain his boxing title in Zaire in 1974, he’s quizzed before and after the “Rumble in the Jungle”. JD• David Frost’s 10 best TV interviews — chosen by his son WilfredPopcorn ready for Hollywood’s big nightJonathan Ross is the host for ITV1’s coverage of the 97th Academy AwardsMATT FROST/ITVOscars (ITV1, 10.30pm)Jonathan Ross presents this live broadcast of the 97th Academy Awards, with the ceremony beginning at midnight UK time and running until around 3am. The Brutalist, A Complete Unknown, The Substance and Wicked are among the contenders in the best picture category. Before this year’s Oscars are distributed, there’s a chance to unleash your inner fashion critic with footage from the Dolby Theatre’s red carpet. VS• Where to watch and stream the Oscar nominated films in 2025AdvertisementArmando Iannucci’s career is examined by Alan Yentob tonight on BBC1HARRY TRUMAN/BBCMondayCritics’ choiceThe Academy of Armando (BBC1, 10.40pm)Steve Coogan across Alan Partridge’s many iterations. Peter Capaldi in The Thick of It. Julia Louis-Dreyfus in Veep. Dev Patel as David Copperfield. All were given career-defining parts by Armando Iannucci that stretched them and opened up new avenues. Hence the notion of an “Academy of Armando” (suggested by Capaldi) that gives this fascinating Imagine film its title — implying that each project is a course for its cast and writers, taught by a mixture of professor, acting guru and showrunner. The idea also provides its presenter, Alan Yentob, with a through-line for a profile that would otherwise just be a (very good) trot through the CV. Other academy alumni interviewed include Chris Morris and Jesse Armstrong. Also discussed are Iannucci’s ADHD diagnosis and whether he was any good as an on-screen performer. JD• Armando Iannucci: My fantasy dinner guests? Donald Trump and Miriam MargolyesI Am the Sixties (BBC4, 10pm)In 1962 Pauline Boty was one of the four artists in Ken Russell’s classic Monitor film, Pop Goes the Easel. In January, 63 years later, she figured in an episode of Simon Schama’s Story of Us. But this is the first documentary devoted to her, reflecting a recent revival of interest in a painter whom Jim Moir calls “the great forgotten pioneer”. It praises Boty — who died of cancer, aged 28, in 1966 — as a forerunner of second-wave feminism whose paintings often celebrated female sexuality; as the only woman in a British pop art movement that also included Peter Blake, Richard Hamilton and David Hockney; and as an anticipator of today’s obsession with “celebrity culture”, with a distinctive take on her era’s famous faces. Among the contributors are Moir, Blake, the art critic Kate Bryan and the print designer Natalie Gibson, who was Boty’s best friend. JDClean It, Fix It (BBC1, 2pm)For the clutter monkeys whose homes are insufficiently appalling for Stacey Solomon, there is Clean It, Fix It, now in its fourth series and with the addition of the host Mark Wright. He needn’t be there, really, the deep-cleaning expert Maxine Dwyer, legendary DIY man Tommy Walsh and carpenter Asher Edwards are more than capable of leaning into the sentiment of fixing up a messy house. Today they help Rachel to recover from years of caring for her late father. Helen StewartThe Interview (BBC2, 7pm)Emma Barnett is known as a fierce interviewer on the Today show, the scourge of many politicians, but Chimamanda Ngozi Adichie is more than a match for her as she publicises her new novel, Dream Count (published in the UK tomorrow). It has been ten years since Adichie last wrote a novel — that part of her brain having been rather hijacked by maternity, she has conceded — so will fans of her warm intelligence find it has been worth the wait? HSAdvertisementTour De Fred — Northern Ireland (ITV1, 2pm)The First Dates front-of-house man Fred Sirieix leaves behind his TV pal Gino D’Acampo to go solo in this gastronomic cycling tour, starting in Dublin and then getting on his bike and heading for the Mournes, mountains that prove a challenge to the Sirieix calves. HSWatch live as Ipswich take on ForestWill Chris Wood score for Nottingham Forest against Ipswich?ED SYKES/SPORTSPHOTO/ALLSTAR/GETTY IMAGESFA Cup Live: Nottingham Forest v Ipswich Town (ITV4, 6.45pm, ko 7.30pm)Things get hotter in the fifth round as Nuno Espírito Santo’s side host Ipswich Town at the City Ground. The Blues have drawn Forest after beating Coventry City 4-1 in the fourth round, while Forest drew 2-2 at Exeter City before coming out on top in a penalty shoot-out in their fourth-round clash. The in-form Chris Wood scored from the penalty spot the last time the teams met. JHMeghan Markle shares her cooking and hosting tipsNETFLIXTuesdayCritics’ choiceWith Love, Meghan (Netflix)Life is tricky in the post-royal influencer sector. Meghan Markle and her husband Prince Harry’s income stream relies on delivering to their adoring fans sufficient material to churn permanent gossip to promote product while simultaneously appearing to be above such base instincts. “I’ve always loved taking something pretty ordinary and elevating it,” she drawled in the trailer for this new lifestyle show, despite having travelled her life partner in very much the opposite direction. How gauche it is to speculate that appearances at the singed edges of recent LA fires, cooing PDAs at the Invictus Games and even a last-minute rebrand dropped on to Instagram announcing the death of American Riviera Orchard and the birth of As Ever were all in service of Meghan’s new Netflix property, but here, finally, it is. Martha Stewart can’t keep going for ever, can she? HS• Inside Montecito, Harry and Meghan’s super-rich home townThe Crime I Can’t Forget (BBC1, 10.40pm)The legacy of a murder that took place in Lisburn on May 19, 2002, and the investigation that took place is explored in this thought-provoking documentary from BBC Northern Ireland. Paul Gault and his wife, Lesley, were well known as the parents of five-year-old triplets, a local newspaper having celebrated their birth and followed their progress. When 34-year-old Paul Gault was found bludgeoned to death in the bedroom of his home in Lisburn, Co Antrim, it was assumed to have been a burglary gone wrong. A highly publicised funeral took place but the investigative team “had a gut feeling” that something was amiss. For those unfamiliar with the story, this operates as an unfolding mystery, but the co-operation of one of the children (Jonathan Gault, now an adult) points to records being straightened. HSAdvertisementThe Covid Queue at Pavilion 6 (BBC4, 10pm)From post-jab selfies to Pfizer versus AstraZeneca discourse, you might find you have blotted out the minutiae of pandemic life. Filmed in a Croatian vaccination centre in 2021, this documentary brings the details rushing back as well as capturing the conversations (mundane or deep) taking place. Especially enjoyable is the marshal exasperated by the public: “There’s no point telling you to keep your distance any more.” VSSkinny Jab Scandal (C4, 8pm)With about half a million Britons prescribed the “skinny jab”, the rise of weight-loss drugs such as Ozempic and Wegovy falls under the scrutiny of tonight’s edition of Dispatches. Ellie Flynn reports on concerns by experts about how a lack of oversight is compromising patient safety — especially those who are underage — and asks why there are areas of the country where the NHS is not offering the treatment. VS• I tried Ozempic microdosing, the secret way the rich lose weightSeeking Satoshi — The Mystery Bitcoin Creator (C4, 10pm)The journalist Gabriel Gatehouse initially starts his documentary by investigating the true identity of Satoshi Nakamoto, the creator of Bitcoin, but soon finds himself on the trail of a wider, wilder conspiracy. VSMary Shelley’s tale gets a double takeBenedict Cumberbatch and Jonny Lee Miller in FrankensteinALASTAIR MUIR/SHUTTERSTOCK/REXNational Theatre Live: Frankenstein (Sky Arts/Now, 9pm)Jonny Lee Miller is the Creature and Benedict Cumberbatch is Victor Frankenstein in Danny Boyle’s 2011 production; but the stars alternated the roles, and next Tuesday it’ll be the other way round. This version adopts the Creature’s point of view, framing him as a “sympathetic” outsider struggling for social acceptance rather than the monster of the horror movie tradition. JDRishi Sunak talks about his time as prime minister in Lessons From Downing StreetJEFF OVERS/BBC/GETTY IMAGESWednesdayCritics’ choiceLessons From Downing Street (BBC2, 7pm)Last month Nick Robinson announced on X that he was “delighted” that Rishi Sunak was “breaking his silence” to give his first significant interview since leaving Downing Street and being replaced by Kemi Badenoch as leader of the opposition. Two episodes of Political Thinking with Nick Robinson are the result, released on BBC Sounds as well as being broadcast on BBC2. As shown by Channel 4’s Brian and Maggie, where Steve Coogan and Harriet Walter played Brian Walden and Margaret Thatcher, or the reconstructions of Emily Maitlis’s encounter with Prince Andrew, striking interviews are ripe for dramatisation. Whether this will meet that excitement threshold is as yet unknown, but at the very least Robinson should glean insights into the “bright future” Sunak said was ahead of him at 44 years of age. VSGet Millie Black (C4, 9pm)The opening voiceover promises “a ghost story” is about to unfold, and there is a haunting quality to this striking new crime drama. Created by the "
