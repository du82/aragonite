["https://thetimes.com/culture/film/article/christina-lamb-oscars-the-seed-of-the-sacred-fig-qngd7dk7p"]
title = "The actress facing 74 lashes in Iran for her Oscar-nominated film"
description = "Instead of attending the glitzy Hollywood ceremony, Soheila Golestani is on trial by the Revolutionary Court for her part in The Seed of the Sacred Fig"
full_description = "EXCLUSIVE INTERVIEWThe actress facing 74 lashes in Iran for her Oscar-nominated filmInstead of attending the glitzy Hollywood ceremony, Soheila Golestani is on trial by the Revolutionary Court for her part in The Seed of the Sacred FigThe Iranian actress Soheila Golestani, star of The Seed of a Sacred Fig, faces a year in prison and 74 lashesChristina Lamb, Chief Foreign CorrespondentSunday March 02 2025, 12.00am, The TimesAs stars walk the red carpet in Los Angeles for tonight’s Oscars ceremony in their usual array of eye-popping glamour, the leading lady of one of the nominated films will be watching in slouchy pyjamas from her flat in Tehran, banned from leaving the country.Instead of appearing at glitzy award ceremonies and international film festivals, Soheila Golestani is appearing in Iran’s Revolutionary Court, where she faces charges of “spreading corruption on earth and propaganda against the regime” for her role in The Seed of the Sacred Fig. Since first being taken in for interrogation in April, she has been stopped from working and lives with uncertainty — the courts are a law unto themselves and the threat of a year in prison and 74 lashes hangs over her.Golestani, 44, spent time in the country’s notorious Evin jail two years ago after posting a brave video in solidarity with the Woman, Life, Freedom protests that filled the streets for months after the death in custody of Mahsa Amini in September 2022. The silent video shows her and other actresses, all dressed in black, remove their hijabs, which are compulsory in Iran, and stare defiantly into the camera.“Attending the Oscars ceremony would have been an amazing opportunity and experience for me, but I do not have permission to leave Iran so I must watch from home,” she says. “But I am happy the film gets the prestige and visibility. The presence of each member of the cast and crew [in Los Angeles] will be like my presence there.”The film’s director, Mohammad Rasoulof, 52, and other main actors managed to flee Iran last May, but Golestani got left behind. In the brief window when curfew was lifted, after President Ebrahim Raisi’s death in a helicopter crash, she was undergoing emergency surgery.Advertisement“I got stranded because of my operation,” she says. “But leaving your home and land is a personal decision, as unique to each person as their fingerprints. And I wanted to stay and face the impact of what I had done and my right to do it.” She lives with her partner in Tehran.Facing down the ayatollahs puts a whole new light on what courage means in a year when Hollywood is congratulating itself on its bravery. By this it means Demi Moore baring all in The Substance to satirise ageing, Sebastian Stan daring to play a young Donald Trump in The Apprentice and Karla Sofía Gascón playing a Mexican druglord who changes gender in Emila Pérez. Gascón is the first transgender person to be nominated for an acting Oscar (later forced to apologise for “causing pain” with a series of racist, antisemitic posts made on X before finding fame). That movie is a direct rival for best international film and won at the Baftas. Were there an Oscar for bravery, none could come close to The Seed of the Sacred Fig. Named after a tree that strangles its host, this is a searing critique of Iran’s theocratic regime, focusing on one family riven apart during the Woman, Life, Freedom protests to highlight the tensions and moral corruption within Iranian society.The film’s director, Mohammad Rasoulof, holds up portraits of Golestani and the actor Missagh Zareh at the Cannes Film Festival in May 2024AFPGolestani plays Najmeh, the wife of a regime official, Imam, who is promoted to “investigator” in the Revolutionary Court and expected to sign off on death warrants for which there is no evidence.While urging their two teenage daughters not to do anything to jeopardise his position, Najmeh finds herself torn between the benefits of Imam’s promotion — the possibility of a bigger apartment, maybe even a dishwasher — and the turmoil on the streets outside.Advertisement• The best films of 2025 so farThe film is intercut withreal smartphone footage of the protests her daughters are following. When one of their school friends is shot in the eye with pellets fired by regime guards, Najmeh is dragged in. In what isperhaps the film’s most powerful scene, she removes the pellets with eyebrow tweezers, dropping the bloody buckshot into the basin. Meanwhile, her husband has become so infected by the paranoia of the system that he ends up interrogating his daughters like criminals.“It is impossible to describe the conflicting feelings I had acting in this film,” Golestani says. “It was like nothing I had ever experienced.” She agreed to take part, despite the risks, “because of the importance of making such a film at such an important time in our history and social environment. And playing a real female character the likes of whom has never before appeared on our screens — something ordinary in world cinema, but for us in the past 40 years something very new, and of course dangerous.”Golestani has already spent time in Iran’s notorious Evin jail after posting a video in solidarity with the Woman, Life, Freedom protestsMEHRAN RIAZI / MEHRThe film was made in secret and shot with two scripts, one an officially approved version that they would switch to if anyone approached. Its writer and director, Rasoulof, also a person of astonishing courage, had already been arrested three times since 2010. He was sentenced to one year in prison for his 2017 film A Man of Integrity, about a goldfish farmer struggling to survive within a corrupt system. He also served five weeks in solitary confinement in a filthy cell in 2022 for his film There Is No Evil (2020), which was about executioners in a country that is second only to China when it comes to the number of people executed (901 last year).It was talking to one of his jailers that gave Rasoulof the idea of exploring the moral dilemmas of regime apparatchiks. “What I wanted to show in this film is the extent to which people are prepared to forget their human qualities and submit to power,” he said after a screening in London.Advertisement• Iranian actress Taraneh Alidoosti held after condemning executionFilm has become an important part of the resistance there, says Omid Shams, an Iranian writer and human rights lawyer living in London who, like many Iranians, will be cheering on the movie tonight. “In a country like Iran, where the nation’s image, visibility and even imagination are strictly controlled by an authoritarian regime, cinema has become the most far-reaching and impactful image of resistance and a powerful act of defiance.”Iranian films are also amazingly good. “Some countries and cultures become more creative under repression,” says Ali Vaez, Iran project director for the Crisis Group. “Iranian society has always relied on culture as a means to survive.”But the ability to turn out such critical social commentary under such a repressive regime confounds many outside. “I could be defined as a cultural gangster,” Rasoulof says. “Making underground films has become something of a culture in Iran for directors like me who don’t want to submit to censorship. Every time we have to find a new way to do it as they [the regime] work out the ways we have used before.”This time he used a very small cast and crew and limited equipment, and directed remotely by FaceTime from his sofa, something he describes as a “very testing process”. When he absolutely needed to be there, he would sit in a car a hundred metres away.AdvertisementReza Akhlaghirad and Misagh Zare in The Seed of the Sacred FigTo cast it, knowing his name would endanger them, Rasoulof contacted actors through intermediaries. “They would say, ‘There’s this short film going to be made without a permit. Would you like to be in it?’ If they responded positively, then they would say, ‘It’s actually not that short and we will show the hair of the actresses.’”To his surprise, inspired by the protests, female actresses said they would happily appear without their hijabs. But because he was unwilling to risk a young person’s safety, the role of the 15-year-old younger daughter is played by the 32-year-old Mahsa Rostami. “There’s no way I could have involved a teenager,” Rasoulof says.The Seed of the Sacred Fig premiered at the Cannes Film Festival last May and won a special prize, although the regime tried to pressure the director to withdraw it by interrogating Golestani. They also stopped the sound recordist leaving at the airport.• This is why I’m Still Here is tipped for an OscarThe film was nominated for the Oscars’ international category by Germany, where Rasoulof now lives in exile. Although overjoyed to be up for the award, he worries about his leading lady. “More than anyone else, I am very worried about Soheila because she is still in Iran under pressure,” he says.AdvertisementYet she insists she has no regrets. “We made our decision from the start when we agreed to participate and prepared ourselves for any kind of consequences,” she says. “What the regime does to me is the least important thing, whether it’s a violent reaction or silence, as if to say the film is not important.”Even speaking to a foreign journalist is an act of bravery. Pointing out that, despite the crackdown that ended the protests, women and girls have continued to defy the regime by baring their heads on the streets of Tehran, Golestani closes with a defiant message. “The really important thing is we will not go back to the past,” she says.CultureFilmRelated articlesVideo IconVIDEOThe best films of 2025 so far — from I’m Still Here to Bridget Jones: Mad About the BoyMarch 02 2025, 12.01amTom Shone, Film Critic, The Sunday TimesCHRISTINA LAMBMy friend Vika was a victim of Putin. This is the remarkable book she didn’t finishFebruary 09 2025, 12.00amChristina LambPROMOTED CONTENT"
