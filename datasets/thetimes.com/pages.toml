["https://thetimes.com/culture/tv-radio/article/samuel-anderson-amandaland-interview-wd07g868m"]
title = "Meet Samuel Anderson — aka Mal — the breakout star of Amandaland"
description = "As the single dad in the hit BBC comedy, the Brummie actor has got school-gate mums hot under the collar"
full_description = "Meet Samuel Anderson — aka Mal — the breakout star of AmandalandAs the single dad in the hit BBC comedy, the Brummie actor has got school-gate mums hot under the collarShirt and coat, prices on application, loewe.com. Trousers, POA, zegna.comPHOTOGRAPHS: JOSHUA TARN. STYLING: HELEN ATKINJulia Llewellyn SmithSunday March 02 2025, 12.00am, The Sunday TimesSamuel Anderson, the actor who plays the laid-back single dad Mal in the BBC’s new mega-smash Amandaland, is roaring with laughter, discussing how we all see elements of ourselves in the show’s shallow, social-climbing eponymous heroine. Take claiming to be better friends with people than we actually are — “I was guilty of that at James Corden’s wedding,” Anderson says, hooting. “‘I know that person!’ No, you saw them across the room. ‘Kylie? Yeah, we had a drink and a dance.’ She had no idea who I am!’”Maybe she didn’t then; she will now. The year is still young, but Amandaland, a spin-off of the beloved sitcom Motherland, has already marked itself as the comedy of 2025, garnering ecstatic reactions both critically and on the street, with my WhatsApp groups buzzing with everyone from mum friends to my Gen Z daughters raving about the gag-packed yet oddly poignant series.Anderson, 42, was in Spain over the weekend that Amandaland dropped, avoiding social media. Only on landing in his native Birmingham did he look at his phone. “Then I was like, ‘Oh shit!’ It was all popping off. Everyone was messaging me, people from my schooldays. I called my nephew to pick me up from the airport, he was like, ‘Hi, Twiggy!’ [a nickname from the show]. At first I didn’t know what he was talking about, I’d forgotten all that. I went to The Range with my mum and was pushing my sister in her wheelchair and this woman goes, ‘You were the last thing I saw last night.’ I went red, she went red, she said, ‘No, I mean, you weren’t the last one — that was my husband!’ To have this reception is the greatest feeling ever.”Jumper, £785, and trousers, £580, sacai.jp. Ring, Samuel’s ownJOSHUA TARNAnderson is no stranger to smash hits: he was in the original National Theatre cast of The History Boys with Corden, who then gave him the recurring role of Fingers in Gavin & Stacey. Back in 2014 he played Danny Pink in Peter Capaldi’s Doctor Who. “But I’ve never had a reaction like the one to Amandaland. It’s like we’ve dropped a bomb.”It could have been very different: Motherland is an adored institution, so the stakes were sky high for this follow-up about the post-divorce move of its villain, Amanda, from posh Chiswick to shabby south Harlesden (or SoHa, as she calls it). Amandaland’s triumph is largely down to the old guard (Lucy Punch as Amanda, Joanna Lumley as her mother, Felicity) being joined by a spectacular new cast, with Anderson’s Mal singled out for praise for his turn as the downstairs neighbour of the narcissistic Amanda (“I’m literally above him”), who has to take in her deliveries of the supplements she flogs on her “lifestyle platform”, Senuous, and cope with her Tesla blocking in his van (“I’m sorry if my saving the planet annoys you”).AdvertisementRelaxed and wry, Mal is the yin to Amanda’s stress yang. He’s also decidedly — in the words of several Mumsnet users — “hot”, with one poster confirming: “I am undeniably in luv with Mal. I wish we had one in my neighbourhood.”• Read our review of AmandalandIn person, in an east London photographer’s studio, Anderson is every bit as easy-going as his character, yet he’s far more charismatic and a much sharper dresser than the tracksuited Mal — today in an old, tailored tweed jacket by Douglas Hayward, a grey cashmere Uniqlo jumper and a natty bowler hat. “I dress up. I went through a stage of wearing a suit every day. My Jamaican grandad wore a shirt and tie always, unless he was playing dominoes — then he’d put on a baseball cap.”Anderson describes himself as “a nomad” who’s hoping eventually to base himself in Spain (“I just love it there and have good friends all over”), but for now he has rented out his London pad and, between jobs, lives with his family in Handsworth, Birmingham. His Jamaican dad is a retired engineer, while his Irish mother ran her own nursery. Both are in their seventies, so Anderson helps them as much as possible with the care of his two sisters — aged 45 and 39 — who have a rare condition caused by variants in the PRMT7 gene that can cause, variously, severe developmental delays and decreased muscle tone.“They’re the oldest people alive with this condition,” Anderson says, before describing them and their quirks with huge fondness. “Normally I’m the most chilled-out person — good luck if you can offend me — but when I was younger, if people would give them a funny look or say something about them, I’d see the red mist. Now I understand it’s a lack of understanding on their part, but then …”AdvertisementHis older sister also lives in the family home with her sons, aged ten and seven (“I’m their climbing frame”), and a stepdaughter. “It’s like the Waltons, a proper Irish house,” he says, laughing. Anderson lives there on and off and so has plenty of Amandaland-necessary experience of children, although he’s single and has none of his own. “I get a beautiful taste of that world, then continue with my world, chasing the madness that I’m chasing.”• The star of Amandaland is needy, arrogant, self-centred and shallow — and I love herAnderson (Mal) with Lucy Punch (Amanda) in AmandalandBBCAnderson didn’t love academia — “I was constantly arguing with my parents about how stupid school was” — and his Catholic school had no drama department. But then, when he was about 14, a cousin told him about an acting course he was attending. “I said, ‘I’m coming!’ ” He quit school at 17 to work in call centres — “Staples Direct, Samuel speaking, how may I help you? Can I take your order number please,” he trills. Friends had to push him to apply to the Academy of Live and Recorded Arts in London. While studying there he supported himself by working as a theatre usher. On graduating he was acting in a fringe show when the director Nicholas Hytner called him to audition for a new Alan Bennett play.“Nick was sat on one side of the table, Alan over there. I reached over to shake Nick’s hand and Alan gets out the chair and we smack heads. He’s going, ‘Aargh!’, I’m like, that’s the end of that.”But by the time Anderson arrived home Hytner had cast him in the role of Crowther, alongside other unknowns at the time, including Dominic Cooper, Russell Tovey and Corden. “We didn’t think the play would do anything. I remember performing it for the National’s staff and us all looking at each other, like, ‘I thought Alan Bennett was a genius but this is going to be a disaster.’ Then on opening night the first line’s delivered and the audience falls apart. It just clicked.”AdvertisementThe History Boys was a phenomenon, winning an Olivier award, and then a Tony upon transferring to Broadway after an international tour, before being turned into a film. Anderson was there for the entire ride, but while most of the cast partied around the globe, Corden was often working in his hotel bedroom. “We were like, ‘We’re in New York, let’s go.’ He’d say, ‘I’ve got to stay in and write, Ruth [Jones, his co-writer] is coming over.’”Cotton tank top, £480, short-sleeve knit, £4,000, jacket, £3,500, and trousers, £950, hermes.comJOSHUA TARNThe script was Gavin & Stacey. When the BBC bought it, Corden cast Anderson as Fingers, Gavin and Smithy’s buddy. Reuniting the cast for last year’s Christmas special, which to date has attracted more than 19 million viewers, was “emotional, man. We were all laughing and crying.”Yet, in a very un-Amanda-like way, Anderson had been too shy to contact Corden when he went to Los Angeles (where Corden was hosting The Late Late Show) three years ago for pilot season. “I was like, I’m not going to bother. He’s going to be super-busy.” Shortly afterwards he heard Corden wanted to cast him in his Amazon series Mammals. “Then he cussed me out for not calling him. He was like, ‘Bro, we’re brothers. You should have stayed at mine, my house is too big for my family.’ He was telling me how Michael Jordan was playing golf in his back garden. He said, ‘You were too polite.’ ”Next up: Anderson has finished filming The Rumour, a Channel 5 thriller loosely based on the true story of the British child killer Mary Bell, alongside Emily Atack, and is just starting on The Walsh Sisters, a BBC adaptation of two Marian Keyes bestsellers, Rachel’s Holiday and Anybody Out There, playing another heart-throb.But all everybody wants to know is will there be a second series of Amandaland? (“I don’t know, I hope so.”) If so, will Mal and Amanda’s opposites-attract chemistry bloom into something more? Anderson shrugs: “It’s one of those things that could never be — we’d like it to work but it’s going to be a disaster. That’s the joy of Amandaland, they’re all so beautifully imperfect.” AdvertisementAll episodes of Amandaland are available on BBC iPlayerStyling: Helen Atkin. Grooming: Nicola Harrowell at Premier Hair and Make-up using Elemis and Hair by Sam McKnightCultureTV & RadioRelated articlesVideo IconVIDEOJason Isaacs: White Lotus, addiction and sex with Daniel CraigFebruary 24 2025, 10.00pmMichael OdellWhat does The Baldwins tell us about Hollywood’s strangest couple?February 24 2025, 10.00amTim Teeman | Ben DowellPROMOTED CONTENT"
