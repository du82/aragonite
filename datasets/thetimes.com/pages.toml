full_description = "The Sunday Times Bestsellers List — the UK’s definitive book chartupdatedThis is the oldest and most influential book sales chart in the UK, the one that every author wants to be on and the most accurate estimation of book sales in the countryThe Sunday TimesSunday March 02 2025, 12.01am, The Sunday TimesThe Sunday Times Bestseller List is the oldest and most influential book sales chart in the UK, and the one that every author wants to be on. The listings are based on data collected each Saturday for the following Sunday by Nielsen BookScan (which has been collecting digital data since 1998) and the chart is the most accurate and comprehensive estimation of book sales in the country.• It’s that time of year: the children’s chart is dominated by those £1 World Book Day exclusives. Leading the pack is Bluey: Blue’s Little Book, based on the Australian TV show — it’s steaming ahead of The Fart That Broke World Book Day.• This week’s charts range from the ridiculous to the sublime. If you’ve had enough fart-powered spaceships, turn to general paperbacks for a new book on forming connections with angels.General hardbacks1 The Let Them Theory by Mel Robbins (Hay House £22.99)Stop wasting your time and energy on the things that you can’t control (5,825)Read our interview with Mel Robbins2 Addicted to Anxiety by Owen O’Kane (Michael Joseph £18.99)Advice on breaking the habits we unwittingly build around our anxieties (2,190)Read our interview with Owen O’Kane3 To the Women by Donna Ashworth (Black & White £12.99)Poetry collection celebrating the beauty, strength and joy of being a woman (1,515)Advertisement4 Raising Hare by Chloe Dalton (Canongate £18.99) How an unlikely friendship with a newborn hare transformed the author’s life (1,500) Read our review of Raising Hare5 What’s Your Dream? by Simon Squibb (Century £20) The entrepreneur shares lessons learnt from his business life and personal life (1,480)6 Open When … by Julie Smith (Michael Joseph £20) Advice to turn to when you find yourself caught in the eye of a storm (1,460) Read our interview with Julie Smith7 The Technological Republic by Alexander C Karp and Nicholas W Zamiska (The Bodley Head £25) A critique of our collective abandonment of ambition (1,390)8 Get In by Patrick Maguire and Gabriel Pogrund (Bodley Head £25)The inside story of Labour’s reinvention and return to power under Keir Starmer (1,230)Read our review of Get InAdvertisement9 A Training School for Elephants by Sophy Roberts (Doubleday £22)King Leopold II of Belgium’s plan to plunder Africa’s resources using elephants (1,100)10 The Boy, the Mole, the Fox and the Horse by Charlie Mackesy (Ebury £20) A fable containing gentle life philosophy (1,105)General paperbacks1 The Trading Game by Gary Stevenson (Penguin £10.99)The rags-to-riches memoir of a former City trader and why he gave it all up (6,815)Read our review of The Trading Game2 The Anxious Generation by Jonathan Haidt (Penguin £10.99) How a shift from free play to smartphones in childhood has affected our health (3,045) Read our review of The Anxious Generation3 Atomic Habits by James Clear (Random House Business £17.99)The minuscule changes that can result in life-altering outcomes (2,765)4 The Courage to Be Disliked by Ichiro Kishimi and Fumitake Koga (Allen & Unwin £10.99) A philosopher and a student discuss the means to achieve lasting happiness (2,280)Advertisement5 Please Help My Mummy by Maggie Hartley (Seven Dials £8.99) The story of a newborn baby, Felix, abandoned at a train station (2,010)6 Angels Are with You Now by Kyle Gray (Hay House £12.99)Strengthen your connections with angels to transform the way you live your life (1,955)7 Ultra-Processed People by Chris van Tulleken (Penguin £10.99)Investigating the science and economics of highly processed food (1,940)Read our review of Ultra-Processed People8 Raising the SEN-Betweeners by Lisa Lloyd (Vermilion £16.99)Advice on navigating the challenges and joys of raising neurodivergent children (1,805)9 The Psychology of Money by Morgan Housel (Harriman House £14.99) A series of essays on the strange ways people think about money (1,665)Advertisement10 SAS: Rogue Heroes by Ben Macintyre (Penguin £9.99)Authorised wartime history of Britain’s celebrated military regiment (1,630)Read our review of SAS: Rogue HeroesFiction hardbacks1 Onyx Storm by Rebecca Yarros (Piatkus £25) As war heightens in Basgiath loyalties are tested; sequel to Iron Flame (7,495) Read our review of Onyx Storm2 We All Live Here by Jojo Moyes (Michael Joseph £22)When Lila Kennedy’s estranged dad reappears in her life it feels like the final straw (4,810)Read our interview with Jojo Moyes 3 The Frozen People by Elly Griffiths (Quercus £22) Ali Dawson travels to Victorian London to clear an infamous aristocrat of murder (2,955)4 Death of the Author by Nnedi Okorafor (Gollancz £20)The lines between fiction and reality begin to blur for a newly unemployed professor (2,935)Advertisement5 Three Days in June by Anne Tyler (Chatto & Windus £14.99) A mother of the bride navigates some tricky days around her daughter’s wedding (2,470) Read our review of Three Days in June6 Where the Library Hides by Isabel Ibañez (Hodderscape £20)Inez Olivera may have to bind her fate to one whose secret plans could ruin her (2,360)7 Quicksilver by Callie Hart (Hodderscape £20) A young woman with strange powers lands in the middle of a centuries-long conflict (2,010)8 = Daughter of the Moon Goddess by Sue Lynn Tan (HarperVoyager £16.99)A young woman’s quest to free her mother pits her against an immortal (1,310)8 = From London With Love by Katie Fforde (Century £16.99)Romance beckons in 1960s London for a woman who dreams of being an artist (1,310)10 Nemesis by Gregg Hurwitz (Michael Joseph £16.99)The former government assassin Evan Smoak is betrayed by his oldest friend (1,240)Fiction paperbacks1 My Favourite Mistake by Marian Keyes (Penguin £9.99)A beauty PR trades the skyscrapers of Manhattan for a tiny Irish town (14,560)Read our interview with Marian Keyes2 The Women by Kristin Hannah (Pan £9.99) In 1965 a sheltered daughter of conservative parents enlists as a nurse in Vietnam (12,180)3 Blue Sisters by Coco Mellors (4th Estate £9.99) Three estranged siblings return to their childhood home to prevent its sale (9,595) Read our review of Blue Sisters4 Murder at the Monastery by Richard Coles (Weidenfeld & Nicolson £9.99) Tensions mount at the monastery where Canon Clement was a novice (8,895)5 Fourth Wing by Rebecca Yarros (Piatkus £10.99) A young woman is among many candidates to become an elite dragon rider (8,870) Read our interview with Rebecca Yarros6 Someone in the Attic by Andrea Mara (Penguin £9.99)A video of a masked man climbing out of an attic looks all too familiar (8,360)7 The Suspect by Rob Rinder (Penguin £9.99) A junior barrister investigates the death of a beloved British TV presenter (7,610)8 Iron Flame by Rebecca Yarros (Piatkus £10.99) Violet Sorrengail’s second year at Basgiath War College; sequel to Fourth Wing (7,265)9 Deep End by Ali Hazelwood (Sphere £9.99)A champion swimmer and a competitive diver jump into forbidden waters (6,910)10 The Crash by Freida McFadden (Poisoned Pen £9.99) Rescued in a blizzard, a pregnant woman’s problems have only just begun (6,890) Read our interview with Freida McFaddenChildren’s1 Bluey: Blue’s Little Book (Ladybird £1)Meet Bluey, Bingo and all their family, friends and toys in this World Book Day exclusive picture book (27,930)2 The Adventures of Paddington: Farm Escape! (HarperCollins £1)Paddington forgets to shut the gate at a farm and all the animals escape (21,435)3 The Fart That Broke World Book Day by Stephen Mangan and Anita Mangan (Scholastic £1)Aliens, mayhem and a fart-powered spaceship (20,455)4 Pokémon: The Epic Pocket Guide by Pokémon (Farshore £1)Become an expert Pokémon trainer with this guide full of facts, stats, tips and training styles (19,035)5 Tales from Acorn Wood: Who’s in Acorn Wood? by Julia Donaldson and Axel Scheffler (Macmillan £1)Rhyming search-and-find book (19,025)The lists are prepared by and the data is supplied by (and copyrighted to) Nielsen BookScan, and are taken from the TCM for the week ending 22/02/25. Figures shown are sales for the seven-day period.To order a copy of any of our bestsellers go to timesbookshop.co.uk/bestsellersExplore the best books of 2025 with our critics’ top reads so far, or see the top 100 bestselling books of the past 50 yearsHave you recently read a very good book? Let us know in the comments belowCultureBooksRelated articlesBESTSELLERSThe 100 bestselling books of the past 50 yearsAugust 16 2024, 6.00amVictoria Segal | Sarah Ditum | Laura HackettBESTSELLERSWhat the Sunday Times bestseller list says about usAugust 16 2024, 6.00amJohanna Thomas-CorrPROMOTED CONTENT"
