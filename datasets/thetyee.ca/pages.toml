title = "Tyee wins gold, silver Canadian Online Publishing Awards | The Hook, A Tyee blog."
description = "The Tyee last night received two Canadian Online Publishing Awards, a gold for best online-only article or series of articles, and a silver for best news coverage."
full_description = '''About The Tyee Advertise Contact Funding Jobs Master Classes Privacy Policy Submissions Support The Tyee News Culture Opinion National Mediacheck Solutions Video Publications Tyee News Weekly Archives Reported Elsewhere Steve Burgess Ian Gill Crawford Kilian Andrew Nikiforuk Dorothy Woodend Follow The Tyee Subscribe by email Subscribe by RSS The Hook: Political news, freshly caught Tyee wins gold, silver Canadian Online Publishing Awards By Tyee Staff Published October 25, 2011 01:30 pm | Comments Tweet The Tyee last night received two Canadian Online Publishing Awards, a gold for best online-only article or series of articles, and a silver for best news coverage. The winning series, Growing the Local Bounty, written by Colleen Kimmett and Jeff Nield, with photos and video by Justin Langille, investigated challenges facing local food producers, highlighting solutions emerging in British Columbia and Ontario. The 17-story series was produced by the Tyee Solutions Society, which is a new model for funding and sharing first-rate solutions-focused journalism. Parts of the series were published as well by The Waterloo Region Record and Small Farmer magazine. The silver in the articles category went to Neil MacDonald of CBC News for his report: Who killed Lebanon's Rafik Hariri. Other finalists in the category were The Tyee's Geoff Dembicki for his series The War over Oil Sands: Report from Washington D.C., and teams from CBC News: Special Report and the Vancouver Observer. The Tyee's news coverage garnered a silver in a category crowded with Canada's top news organizations. The gold went to the CBC for its federal election coverage. Other finalists included The Toronto Star, The Globe and Mail, The National Post, Cyberpresse (La Presse), Edmonton Journal and the Winnipeg Free Press. The Tyee was also a finalist in the category of best online only site. The Canadian Online Publishing Awards are produced by Masthead, which covers Canadian publishing industry news. "Many, many thanks to Masthead and the judges," said Tyee editor David Beers. "All the finalists were strong and deserved honours. This is a gratifying affirmation of the commitment to excellence I see every day from my wonderful colleagues at The Tyee." He added: "I think the fact that a small and scrappy organization like The Tyee is able to compete with the nation's best-resourced news organizations is a hopeful sign that there is room for more diversity and creativity in Canadian media. Let a thousand more online experiments bloom!" Find more in: Labour + Industry and Media Tweet googletag.cmd.push(function() { googletag.display('div-gpt-ad-1547775028808-0'); }); Previous: 'Wind power revolution' hits Europe as US mulls Keystone XLNext: BC commissioner asks minister to fix FOI gap What have we missed? What do you think? We want to know. Comment below. Keep in mind: Do: Verify facts, debunk rumours Add context and background Spot typos and logical fallacies Highlight reporting blind spots Ignore trolls Treat all with respect and curiosity Connect with each other Do not: Use sexist, classist, racist or homophobic language Libel or defame Bully or troll Troll patrol. Instead, flag suspect activity. /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */ var disqus_shortname = 'thetyee'; // required: replace example with your forum shortname var disqus_identifier = 'CC66884E-FF46-11E0-976D-8BBF935A16F8'; var disqus_title = 'Tyee wins gold, silver Canadian Online Publishing Awards'; var disqus_url = 'http://thetyee.ca/Blogs/TheHook/Media/2011/10/25/Tyee-COPA-Awards/'; /* * * DON'T EDIT BELOW THIS LINE * * */ (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://