title = "Lisa Sundberg and Peter Holmdahl, as told to Aldyn Chwelos | The Tyee"
full_description = '''Thanks for reading this article from The Tyee. I hope it added something to your day. If we haven't met yet, The Tyee is an independent, non-profit news outlet based in Vancouver, B.C. We've been around since 2003 and our team publishes original in-depth articles every single weekday. You are able to access all of The Tyee's articles — free of charge — because our non-profit newsroom is supported by thousands of supporters of independent journalism. We call them Tyee Builders, and they contribute an amount that works for them. Why do we call them "Tyee Builders"? Because they literally help build The Tyee. As our reader contributions grow, we invest all of it back into more original journalism, and adding more talented researchers, writers and editors to our team. Only about 1 per cent of people who regularly read The Tyee contribute financially, but amazingly, that’s enough to cover half of our total budget. Just 1 per cent of people chipping in means that the other 99 per cent get to enjoy open access to fact-based journalism published by a trusted, independent news organization. Public interest journalism is vital for our democracy, but the sad truth is that newsrooms across Canada are struggling, and laying off more and more journalists each year. Support from our readers means that we can keep our newsroom staffed, resourced, and showing up every day with new original stories that you won't read anywhere else. It also means that we are accountable to you first, not shareholders (we don't have any) or corporate backers (we don't have any of those, either). Be a part of making Canadian media better and join Tyee Builders today. You choose the amount and frequency you give, and you can cancel at any time. And we’re not at the mercy of hedge funds or corporations whose focus is on the next quarterly profit report. We’re a nonprofit newsroom that is supported by our readers. We rely on your financial support for our journalism and recognize the importance of earning your trust.'''
