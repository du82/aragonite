["https://thetyee.ca/Blogs/TheHook/2013/06/14/CJF-Award-Win-2013"]
title = "Tyee nets national Excellence in Journalism award | The Hook, A Tyee blog."
description = "The Tyee is proud to have won this year's Excellence in Journalism Award from the Canadian Journalism Foundation."
full_description = '''About The Tyee Advertise Contact Funding Jobs Master Classes Privacy Policy Submissions Support The Tyee News Culture Opinion National Mediacheck Solutions Video Publications Tyee News Weekly Archives Reported Elsewhere Steve Burgess Ian Gill Crawford Kilian Andrew Nikiforuk Dorothy Woodend Follow The Tyee Subscribe by email Subscribe by RSS The Hook: Political news, freshly caught Tyee nets national Excellence in Journalism award By Tyee Staff Published June 14, 2013 03:00 pm | Comments Tweet The Tyee is proud to have won this year's Excellence in Journalism Award from the Canadian Journalism Foundation. The award is presented annually to a Canadian media organization for "overall extraordinary performance." It is given, according to the foundation, to an organization that "embraces ideals of originality, courage, independence, accuracy, social responsibility and accountability, as well as diversity and professional development opportunities." "This is a very great honour and a joy to receive because it honours the entire team of writers and creative people who make The Tyee happen," said founding editor David Beers. One large and one small media organization receives the honour each year. The Tyee won the small category, among contenders that included CBC New Brunswick, CP24, Turtle Island News and the Vancouver Observer. This year's winner in the large media category was the Winnipeg Free Press. The Tyee last won the award in 2009. Michelle Hoar, who co-founded The Tyee with Beers in 2003, accepted the award at the Fairmont Royal York ceremony last night in Toronto. Find more in: Media Tweet googletag.cmd.push(function() { googletag.display('div-gpt-ad-1547775028808-0'); }); Previous: NDP's Dix reassigns several senior critic roles in new shadow cabinetNext: Democracy Watch fears Wright-Duffy investigation will produce no results What have we missed? What do you think? We want to know. Comment below. Keep in mind: Do: Verify facts, debunk rumours Add context and background Spot typos and logical fallacies Highlight reporting blind spots Ignore trolls Treat all with respect and curiosity Connect with each other Do not: Use sexist, classist, racist or homophobic language Libel or defame Bully or troll Troll patrol. Instead, flag suspect activity. /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */ var disqus_shortname = 'thetyee'; // required: replace example with your forum shortname var disqus_identifier = '0C536F84-D53E-11E2-81F6-91AD73026D8A'; var disqus_title = 'Tyee nets national Excellence in Journalism award'; var disqus_url = 'http://thetyee.ca/Blogs/TheHook/2013/06/14/CJF-Award-Win-2013/'; /* * * DON'T EDIT BELOW THIS LINE * * */ (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus'''
