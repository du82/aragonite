["https://thetyee.ca/News/2025/03/03/Terry-Hui-Hole-Vancouver-Heart"]
title = "Terry Hui’s Hole in Vancouver’s Heart | The Tyee"
description = "Why did the billionaire stall Expo lands completion for decades, leaving a void where there could be homes? A Tyee deep dive."
full_description = "When Premier Bill Vander Zalm announced the $320-million sale of the Expo lands on Vancouver’s False Creek to Hong Kong tycoon Li Ka-shing on a rainy day in April 1988, no one noticed 24-year-old Terry Hui in the crowd of cabinet ministers, power brokers, business moguls and real estate speculators jammed into British Columbia’s Enterprise Centre. Announcements, Events & more from Tyee and select partners CONTEST: Win a Pair of Tickets to ‘The Early Moderns’ One lucky Tyee reader will get the opportunity to experience the avant-garde sounds of the 17th century. Ballet BC Brings World-Class Talent to Vancouver Catch ZENITH, a lineup of three performances March 6 to 8. They would recognize him soon enough. Despite his youth, Hui quickly won total control of the massive land development, at 82 hectares the largest in B.C. history, leveraging its profits to create one of the biggest real estate development firms in Canada and likely making himself a billionaire several times over. In a city that worships real estate, Hui moved effortlessly from the edge of the crowd to the top of the power pyramid — one of Vancouver’s largest landowners, a sought-after philanthropist, a business leader — where he remains to this day. If there was one person whose decisions could change the face of the city, it was Hui, sole owner and guiding genius of Concord Pacific Place, the real estate project that defined “Vancouverism.” In the first 15 years under Hui’s leadership, Concord Pacific built a new community of thousands of homes between the Granville Bridge and the Cambie Bridge. Its highrise towers, soaring over a community centre, daycares and waterfront parks, were featured on countless postcards and triggered explosive redevelopment in Yaletown and south Granville. The land sale also delivered on its promise of transforming the provincial economy, signalling to the Asia-Pacific that foreign investment in this new hub between North America and the East was far-sighted and profitable. Concord Pacific Place validated that claim. But for all his successes, Hui’s legacy remains in doubt 40 years after Expo 86 welcomed its last visitor. Sometime around 2005, the date that Concord Pacific Place was supposed to be complete, Hui’s attention shifted; the pace of construction on False Creek slowed, and then stalled. Twenty years later the Expo lands transformation remains unfinished, a huge swath of empty asphalt scarring False Creek’s northeast shore. Concord still owes B.C. a final payment for the land — estimated to be in the hundreds of millions of dollars — for millions of square feet of density it achieved above its 1988 target. A major waterfront park has never been built. The neighbourhoods nearby, like Chinatown and the Downtown Eastside, are spiralling down, cut off from major investments that sparked the neighbourhood revivals a few blocks west. Despite Hui’s sudden declaration Jan. 7 that he wishes to proceed with rezoning, provincial Housing Minister Ravi Kahlon has condemned the 20-year delay to complete the final phase as “unacceptable.” Kahlon would like shovels in the ground by Christmas. No one wants to explain why the land remains empty in 2025, nearly 40 years after Expo 86 shut down. The stage is set for a final negotiation, between the city and the province on the one hand, and Terry Hui’s Concord Pacific on the other. The rezoning process will clarify how much density Hui achieved since 1988, how much that exceeds expectations and how much revenue will flow to the province as a result. This unique arrangement, called a “participation mortgage” and forgotten by all but a handful of the original deal-makers, guarantees taxpayers a final, additional payment for all 82 hectares based on how many millions of square feet Concord has built over 13.2 million feet, multiplied by an index of the increase in the value of Vancouver real estate since 1988. If the project is never finished, Concord never has to pay. If Kahlon has his way, the negotiation will be quick, Concord will make a final payment of hundreds of millions of dollars for the land, and work will begin before the end of the year. Terry Hui, Concord Pacific Developments CEO since age 29, has been described as ‘really creative, highly artistic, thoroughly technical and intensely analytical.’ Photo via Concord Pacific. Concord says Hui’s decision to seek rezoning on his last parcel of those priceless Expo lands was triggered by the density windfall generated by the city’s 2024 decision to eliminate view corridors over the site, as well as the province’s elimination of parking minimums. RELATED STORIES A Long-Delayed Vancouver Housing Megaproject Is Closer to RealityVancouver’s Dubious Deal with a Major DeveloperBehold! The Tyee’s 2023 Impact Report If Hui’s vision is approved, the empty land between the Plaza of Nations and Science World, now used mainly for parking by touring rock groups and Cirque du Soleil, will feature a cluster of the city’s tallest towers, including 5,000 homes and a new retail district overlooking a major waterfront park. But first, Hui must complete some unfinished business. He needs direction from the city and the province about the location and specifications for new roads and utilities he is required to build, just as he did for earlier phases. This will include removal and replacement of the Georgia and Dunsmuir viaducts, which are not seismically sound and could collapse on the SkyTrain. (Full disclosure: as a Vision Vancouver city councillor between 2008 and 2017, I worked closely with city staff and stakeholders both on the Northeast False Creek Plan and on the decision to remove the viaducts.) He must make that final payment for the land, some of which the province will use to manage contaminated soil. Finally, he needs to deliver a spectacular development that exceeds everything he has done so far, a waterfront community of such excellence that the 20-year delay seems worthwhile. The project, when it begins, will be the biggest in Vancouver, dwarfing projects like the multi-towered Oakridge Park. According to his corporate biography, Hui is someone who “continues to foster community through both development and philanthropy, shaping skylines and society landscapes alike.” Despite all his other achievements, completing northeast False Creek is the one on which Terry Hui will be judged. Will he deliver on Li Ka-shing’s long-ago promise to the people of B.C. to transform this site in the heart of the city? As the history of the land deal shows, the purchase has been very lucrative for Terry Hui and Concord. Now it’s time for the previous landowners, the taxpayers of B.C., to see that project completed and to enjoy their share of that wealth. THE CURTAIN RISES There was a collective gasp from the 500 VIPs jamming B.C.’s Enterprise Centre on April 27, 1988, when Premier Bill Vander Zalm unveiled Li Ka-shing’s offer to the people of B.C.: in just 15 years, the Hong Kong tycoon vowed to spend $2 billion to transform the abandoned rail yards in Vancouver’s False Creek into a “West Coast Venice” of lagoons and residential towers, a community of 11,000 signalling B.C.’s rising status as a Pacific Rim trading hub. (The lagoons soon disappeared at the insistence of city planners.) “BREATHTAKING,” shouted the Vancouver Sun’s banner headline, summarizing the project as “$2 billion, 45 towers, 15 years.” Li Ka-shing, the owner of Hong Kong’s Hutchison Whampoa trade group, was “the New Emperor.” Li and his son Victor, 23, who would lead the Concord Pacific Place development, had promised to pay $320 million for 82 hectares on the north shore of Vancouver’s False Creek, with $50 million down and a series of nine further payments between 1995 and 2002 to make up the difference. If the city was generous in its density approvals over the life of the project, Vander Zalm said, the new owners would pay even more through a “participation mortgage” that the government expected would generate an additional $100 million for taxpayers, or even more. Critics immediately charged that the province had been robbed in the rushed process that produced the sale. The Vancouver Sun’s front page on April 28, 1988, heralded the deal to develop the Expo lands, but critics said the province left hundreds of millions of dollars on the table. Image via Newspapers.com. Vander Zalm’s good friend Peter Toigo, whose rejected bid for the Expo lands and related assets had been closer to $500 million, did not trouble to hide his bitterness. The premier’s hands-on promotion of Toigo’s bid had been so forceful that it triggered an RCMP investigation of conflict-of-interest charges. (Vander Zalm had to break away from the main news conference to deny any wrongdoing.) Li had fleeced the province, Toigo said, adding that “if he was capable of stealing the property, good luck to him.” The Far Eastern Economic Review declared that Li had secured the property on “extremely cheap terms” that promised “to be a veritable gold mine for Li and his partners.” In fact, within a year, the site had been assessed at $700 million, more than double the sale price. Prominent B.C. realtors told the Globe and Mail in 1989 that the sale was “the biggest giveaway in the province’s history,” sneering that Li had acquired the land for less than the price of a suburban warehouse project. Grace McCarthy, the minister responsible for the deal, conceded that B.C. left millions of dollars on the table because of Vander Zalm’s demands for a speedy sale. Li Ka-shing was quick to offer reassurances. “Vancouver is a beautiful city,” Li said in a call with reporters from Beijing, where he was negotiating with top Chinese officials about the future takeover of Hong Kong. “I hope people are happy with what we want to do with the land.” The total cost, Li admitted, was a “relatively small amount of money” compared with his other investments. Victor Li, already a Canadian citizen and Vancouver resident, declared that in just 15 to 20 years, Concord Pacific Place would transform the former rail yards into a symbol of British Columbia’s rising stature as a Pacific Rim trading hub, complete with schools, community centres, daycares, stores, office space and affordable housing. To ensure that taxpayers received full value, Concord Pacific would make a final payment when the project was complete, a “participation mortgage” to give taxpayers a share of the cash Concord generated from density above 13.2 million square feet of development. For every additional foot above that mark, Concord would pay $12.50 multiplied by an index of the increase in the value of Vancouver real estate since 1988. Depending on how the payment was calculated, it was expected to add hundreds of millions of dollars to the sale price. Most business leaders closed ranks behind the deal. A full-page government ad in the Vancouver Sun extolled the virtues of the sale, noting that “the government will continue to receive value from increased property and income taxes, saved interest payments and a participation agreement that ensures we will share in increased value over time.” “By any measure,” declared Vancouver Sun columnist Vaughn Palmer, “Expo land price is fair.” Hong Kong’s richest man today, Li Ka-shing declared his interest in buying the Expo lands at a private dinner with then-premier Bill Bennett in 1986 and won out over a local bid. Photo via Wikipedia. Li Ka-shing’s interest in the province had deep roots. He had been visiting the region since the 1960s and even owned a home in Vancouver’s Kerrisdale neighbourhood. It was Victor who urged his father to consider the Expo purchase. Li, looking for investments offshore as the Chinese takeover of Hong Kong loomed ahead, went right to the top. He declared his interest in buying the Expo lands at a private dinner with then-premier Bill Bennett in the summer of 1986. From that point on, competitors had to struggle to keep up. By the summer of 1987, cabinet had agreed to sell the land as a single parcel, and in September, the province sought global expressions of interest for a 30-day period. By the end of October, the bids were in. From beginning to end, the sale of the Expo lands would last only eight months. Li’s decisive move came in the summer of 1987 when he persuaded Stanley Kwok, once one of Hong Kong’s most respected architects and now a longtime B.C. resident and corporate leader, to join his bid team. Kwok, who had spent years on the board of the Crown corporation that owned the Expo lands, had an intimate knowledge of the site’s problems and potential. He also brought vital connections to the business elites of Hong Kong and Vancouver. Li Ka-shing never looked back. For the next six months, McCarthy fought a relentless rearguard action against Vander Zalm to preserve the bid process and keep the Toigo offer offside. Their bitter political battle broke into the open with mutual recriminations just days before cabinet confirmed the inevitable: Li Ka-shing’s bid was successful, overpowering a much weaker late entry by a consortium of Vancouver businessmen. The lawyers got busy writing up the sale document. Shovels would be in the ground by the autumn of 1988. Thanks to Kwok’s impeccable connections, planning of the massive project proceeded at a blistering pace. The False Creek North Official Development Plan was approved by city council in record time on April 10, 1990, providing for 9,100 residential units, 20 per cent core need housing, commercial space, library space, two schools, a community centre and eight separate pieces of parkland totalling 17 hectares. Views south down existing streets to False Creek were protected, as were mountain views from the south side of the creek. Public opposition seemed loud on the first night of the public hearing but collapsed on the second. Concord had obtained 90 per cent of its goals, according to observers, distributed across 46 towers. The company, however, viewed the plan as just the beginning of negotiations, not the end. The coming years would bring a series of renegotiations, in the form of rezonings, to add units, increase density, shift affordable or social housing off-site, convert the new library to a cash contribution, and much more. Construction workers swarmed across the site, and cranes marched across the horizon. Within four years, residents were moving in. The Concord team moved quickly to reward its investors and reduce its costs. In January 1990, Li sold the Plaza of Nations site for $40 million to Canadian Metropolitan Properties Corp., an arm of the real estate empire owned by Singapore tycoon Oei Hong Leong. This was not far off the $50-million down payment Concord had made for the entire site in 1988. Then Concord partner Lee Shau Kee, Hong Kong’s second-wealthiest man, won city approval to develop the easternmost parcel of the site on Pender Street between Chinatown and the old Sun Tower. International Village, as it is called"
