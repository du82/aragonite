 by JavaScript Audience development analyst (Toronto, Ontario) Shubhalaxmi Patil, emailE = 'thetyee.ca' emailE = ('spatil' + '@' + emailE) document.write('<A href="mailto:' + emailE + '">' + emailE + '</a>') Email address protected by JavaScript Operations co-ordinator Alyssa Mossman, emailE = 'thetyee.ca' emailE = ('amossman' + '@' + emailE) document.write('<A href="mailto:' + emailE + '">' + emailE + '</a>') Email address protected by JavaScript Technical contacts Director, web production Bryan Carney, Extension 103, emailE = 'thetyee.ca' emailE = ('bcarney' + '@' + emailE) document.write('<A href="mailto:' + emailE + '">' + emailE + '</a>') Email address protected by JavaScript Acknowledgements The Tyee is based in what is commonly known as Vancouver, British Columbia, on the unceded territories of the xʷməθkʷəy̓əm (Musqueam), Sḵwx̱wú7mesh (Squamish) and Sel̓íl̓witulh (Tsleil-Waututh) nations. Our team reaches across the province, to the unceded territory of the lək̓ʷəŋən peoples on the traditional territory of the Songhees and Esquimalt nations on Vancouver Island, commonly known as Victoria; the territory of the Gidimt’en Clan of the Wet’suwet’en in the Interior, in what is commonly known as Smithers; and qathet in the traditional territories of the Tla’amin Nation on the Sunshine Coast, commonly known as Powell River. Members of our editorial and business team also extend east, to the traditional territory of the Huron-Wendat, the Seneca and the Mississaugas of the Credit, in what is commonly known as Toronto, Ontario. We are grateful to work on the territory of these nations, and through The Tyee, to expand knowledge of Indigenous relationships to the land commonly known as Canada. Legal counsel The Tyee is represented by the law firm of McGrady and Co., Vancouver, Canada.'''
