["https://thetyee.ca/Opinion/2017/04/10/BC-Liberal-Falsehoods-Scandals-Whole-List"]
title = "117 BC Liberal Falsehoods, Boondoggles and Scandals: The Complete List | The Tyee"
description = "The Tyee’s updated tally of 15 years of public messes, sourced and explained."
full_description = "Also in this series: ‘BC in the Balance’: The Tyee’s 2017 Election Reporting NDP to Raise Concerns with Elections BC about ‘Mishandled’ Ballots Liberal or NDP Government? We Should Know By Wednesday It’s Official: Liberals 43, NDP 41, Greens 3 Liberal ‘Gerrymandering’ Handed Them Election Win: Analyst BC Vote Doesn’t Change Support for Kinder Morgan, Says Ottawa (Click here for the complete list of stories.) [Editor’s note: This list, which combines the Gordon Campbell and Christy Clark eras, grew from an original 98 items published last week to 117 after we invited Tyee readers to suggest additions. Some definitions: By falsehood we mean promises broken or assertions that proved demonstrably untrue. By boondoggle we mean significant public money lost to waste, overruns, or ill-conceived initiatives. And by scandal we mean moments when government was revealed to have seriously broken rules or caused harm either deliberately or through neglect or incompetence. The Tyee chose these categories with the assumption that all voters, no matter their political leanings, would prefer their government tell the truth, spend money responsibly, and avoid embarrassing breaches of ethics or the law. We also present sidebar items that don’t fit the categories, but also aren’t anything a premier might put on her podium sign. You can also download the list as a PDF here.] THE CHRISTY CLARK ERA (2011-2017) (20 Falsehoods, 19 Boondoggles, 25 Scandals) Announcements, Events & more from Tyee and select partners CONTEST: Win a Pair of Tickets to ‘The Early Moderns’ One lucky Tyee reader will get the opportunity to experience the avant-garde sounds of the 17th century. Ballet BC Brings World-Class Talent to Vancouver Catch ZENITH, a lineup of three performances March 6 to 8. BOONDOGGLE: Air Christy B.C.’s high-flying premier ran up more than half a million dollars in private jet flights during her first five years in office, at times managing to squeeze in Liberal party fundraisers among the government photo ops. On at least two occasions, Clark flew on jets chartered from companies owned by wealthy Liberal backers. BOONDOGGLE: Faulty Schools Data System Scrapped after $81-Million Overrun In 2005 the BC Liberal government created a universal computer system to track K-12 student data across the province. Cost overruns zoomed from $16 million to $97 million as glitches, shutdowns, slow service and a critical independent assessment doomed it to obsolescence. The province gave up on the system in 2011 and ordered up a replacement. It took four years to find and install, and performed so badly it elicited new excoriations from educator users, and an apology from its maker. BOONDOGGLE: Stanley Cup Riot Report Topped $300K, No One to Blame After the 2011 Stanley Cup riot, the government hired former Olympics boss John Furlong and Former Nova Scotia deputy attorney-general Doug Keefe to co-chair an inquiry. Their report was criticized for letting Canucks brass, senior bureaucrats, police and politicians off the hook. The inquiry did manage to go over its budget, though, running up a bill well over $300,000. Documents showed that Furlong billed for four hours of work the same day he spoke to the International Olympic Committee in South Africa. FALSEHOOD: Forest Job Figures Didn’t Count Real Jobs The government boasted the booming economy they’d created had resulted in 27 mill re-openings and 10,000 new forestry jobs since 2009. Turns out those numbers were based on the “number of board feet [exported to] China divided by 250 million feet per mill” — numbers that the Opposition NDP said didn’t match figures from Statistics Canada. The NDP’s numbers came up with less than half that number of new jobs. And the government’s own stats don’t bear out the boast. SCANDAL: Four Die, No Charges Laid Due to Botched WorkSafeBC Probe Robert Luggi, a worker at a Burns Lake sawmill texted his wife from work. “Please pray for me,” he wrote. “I'm going to check something out.” Twenty-seven minutes later Luggi and co-worker Carl Charlie were dead, as the mill exploded into a fireball that injured 20 others. Three months later, in April 2012, two more men died when a sawmill near Prince George blew up. Both explosions were caused by a lethal buildup of dry sawdust. As The Tyee reported, the blasts took place “in a context of work speedup and imperfect regulatory inspections, long, exhausting shifts and work sites covered with fine, flammable dust that should have been cleared away.” The B.C. government would eventually bring in new rules to improve sawmill safety but declined to mount a public inquiry. No charges were laid against the mills’ owners because the B.C. Criminal Justice Branch decided that WorkSafeBC’s actions and inactions had made successful prosecutions unlikely. Not only had WorkSafeBC failed to warn the mills of the dust buildup, but its investigations into the tragedies were so flawed that the evidence gathered would not be admissible in court, the prosecutors concluded. BOONDOGGLE: Premier’s Fired Press Aide Got $67,000 Severance for 11 Months Work When Christy Clark replaced Gordon Campbell as B.C.’s premier she cleaned house, racking up a big severance bill: $2.4 million for 13 members of Campbell’s senior staff shown the door. One of Clark’s hand-picked replacements was press secretary Chris Olsen. Less than year after his hire, he was fired and given $67,000 in severance, all “by the rules” assured an otherwise mum Clark. FALSEHOOD: BC Libs Understated Deficit by $520 Million: AG HEAL THYSELF: MLA’s Policy Cure Favours Son British Columbia should make it easier for B.C. students who study medicine abroad to get training positions in their home province, advocated a report prepared by BC Liberal MLA Moira Stilwell for the health minister. “Our population needs these gifted young physicians,” she wrote. What she didn’t tell the health minister is that her own son was studying medicine at a school in Ireland. The B.C. government used non-standard accounting to make the deficit seem $520 million smaller than it really was, accused B.C.’s auditor general in 2012. It was too familiar, he said, citing “a long-standing trend of shortcomings in the transparency of government’s finances” throughout the BC Liberal era. SCANDAL: Over Sharing Minister Fired Harry Bloy was the only MLA to support Christy Clark in her campaign for BC Liberal leader. When she won, the career backbencher found himself in cabinet, as minister of social development. As his ministry shut down programs for disabled adults, Bloy gave the impression of a man with only the faintest idea of what his job entailed. After being demoted to minister of state for multiculturalism, Bloy was forced to resign when he passed on a private email from a Province reporter to officials of a company the reporter was investigating. FALSEHOOD: Reversal on Pesticide Ban In May 2011, Premier Christy Clark said she was going to ban the cosmetic use of pesticides, telling reporters: “I’ve supported this for years now. We are going to do it.” A year later, after a legislative committee split along party lines on whether to support a ban, Clark wasn’t going to do it. Unlike most provinces, B.C. still has not banned cosmetic pesticides. FALSEHOOD: Clark Reneged on Public Consult on Treaty In June 2011 Premier Clark promised the public would get the chance to comment on the Comprehensive Economic and Trade Agreement between Canada and the European Union, then under negotiation. “There will be, I’m told, consultation on this agreement,” she said. “There will be many avenues for the public’s input.” A year later, no consultation. “No, we don’t intend to do that,” Clark told the legislature. SCANDAL: No Proof Chinese Temp Worker Shakedown Was Investigated After The Tyee reported Chinese temporary workers were being illegally charged thousands by recruiters for B.C. mining operations, and the CBC independently confirmed the practice, the BC Liberal government pledged to investigate, but claimed to find no evidence. Pressed, the government produced no evidence any real investigation had been done, and union reps cried foul. FALSEHOOD: Premier ‘Fudging’ Job Creation At the end of 2012, there was “no other way to say it: The B.C. government is fudging its job creation record,” wrote National Post senior reporter David Akin. “While Clark campaigns to be number one on job creation, B.C. is actually the worst in the West and fourth worst in Canada” and the “B.C. government is making false claims about the performance of the BC Jobs Plan.” FALSEHOOD: Minister Wrongly Claimed RCMP Investigating Fired Health Workers When Minister Margaret MacDiarmid announced the firing of seven health ministry workers in 2012, she claimed the RCMP were investigating their alleged misbehaviour. Later, after one worker committed suicide, others sued, none were charged, some got cash settlements and their jobs back, and the premier apologized, it came to light that the RCMP, for lack of evidence, had never launched any investigation. Roderick MacIsaac killed himself three months after he was fired as part of a 2012 investigation into alleged ethics breaches. Premier Clark eventually apologized for the “heavy handed” firings of MacIsaac and others. SCANDAL: Researcher, Wrongly Fired, Committed Suicide Ph.D student Roderick MacIsaac killed himself three months after he was fired with six other government health researchers as part of a 2012 investigation into alleged ethics breaches. MacIsaac had been assessing the risks of anti-smoking drugs the province was paying for after Christy Clark promised it would when running for leader. The drugs included Champix, previously the subject of U.S. and Canada safety warnings. Premier Clark eventually apologized for the “heavy handed” firings of MacIsaac and others. Some were offered their jobs back and awarded cash settlements after the government admitted it overreacted. The NDP and MacIsaac’s sister called for a public inquiry, but the Clark government said no, choosing the less transparent route of putting the Ombudsperson in charge of fact-finding and even changing the law to make it possible, despite serious concerns raised by the fired, the opposition and the Ombudsperson himself. BOONDOGGLE: Big Price Tag for Health Ministry Firing Mess The BC Liberals’ false persecution of seven drug researchers in 2012 left taxpayers on the hook for cash settlements with the fired workers, legal costs, and multiple reviews of the snafu. One such probe was contracted to Deloitte & Touche LLP without allowing other firms to compete because “an unforeseeable emergency exists,” the 2012 paperwork showed. The firm billed $684,309.67 in less than five months and in May 2013 stood to receive another non-compete contract for $650,000 to keep at it. Meanwhile, taxpayers incurred the untold expense of paying for drugs that might otherwise have been recommended against. For example, the government kept paying for Alzheimer’s drugs in a pilot study longer than planned while the research work on its effectiveness halted after the firings. Graham Whitmarsh, who was deputy minister during the firings, was himself fired after the next election and given a $250,000 golden parachute. STINKER: Opposition Plugs Nose at Sheep Hide Grant B.C. government officials smelled a problem and warned superiors when the Tanned, Wild and Woolly project sought a grant to teach five people in Powell River how to tan sheepskins. “There is a direct conflict of interest with the President of the Non-profit being hired as the Supervisor on the project,” the assessment said. That president/supervisor-to-be was former BC Liberal MLA Judy Tyabji Wilson, whose non-profit eventually got $181,635 from a joint program of the B.C. and Canadian governments, $67,000 to Tyabji Wilson. The conflict was “resolved,” said Tyabji Wilson, who went on to write a friendly biography of Premier Clark and who is married to Gordon Wilson, contracted by Clark’s government to help promote LNG jobs. But NDP house leader Mike Farnworth wondered, “How is it that the premier’s biographer is able to get a grant that ministry staff say is in a conflict of interest, it gets awarded, the government’s been told it’s a conflict of interest, and then the grant gets increased and it doesn’t meet its objectives?” He added: “Part of this project was to stop sheep hides going into a landfill. This whole thing stinks like sheep hides in a landfill.” FALSEHOOD: Broken Promise to Revise Municipal Election Rules In July 2010 the BC Liberal government promised to change the legislation covering municipal election spending in time for the 2011 elections. Nine months later, however, the government admitted the changes wouldn’t happen until 2014 “due to tight timelines for spring legislation and the complexity of the planned changes.” Then, in February 2013, the minister in charge admitted the changes weren’t coming anytime soon. The changes finally went through in 2014, in time for the 2018 elections — seven years late. SCANDAL: Chief of Staff Did Something So ‘Inappropriate’ in a Pub He Resigned Premier Clark’s chief of staff Ken Boessenkool suddenly resigned after he acted, he said, “inappropriately.” Whatever he did involved a female government staffer in a bar, according to news reports. The premier refused to give details, citing privacy. Her deputy chief of staff may have destroyed related records, the Information Commissioner later found. FALSEHOOD: Clark Canards Riddled Radio Interview In the thick of 2013’s election, Premier Clark took to the airwaves to make a series of false claims about her government’s record on debt, deficits, and the province’s credit rating. FALSEHOOD: Clark Kept Exaggerating NDP Spending Plans by 50% On the campaign trail last election, Christy Clark repeatedly claimed the NDP would up spending by $3 billion, even creating billboards saying so. The real figure was $2 billion and how it would be covered was accounted for in the party’s platform, countered her NDP opponent Adrian Dix. The CBC calculated BC Liberal math “just doesn’t add up. We find their $3 billion claim wrong.” BOONDOGGLE: Public Paid $11 Million to Host Bollywood Extravaganza The BC Liberal government spent $11 million of British Columbians’ money hosting a Times of India Film Awards show a month before the 2013 provincial election. The Bollywood bash, exuded Premier Clark, “is just part of what’s going to inject millions into our economy as a result of our relationship with the Times of India Media Group,” later crediting the show with boosting visits by Indian tourists to B.C. Visits to Greater Vancouver did rise the next year, at about the same rate for all of Canada. But instead of crediting the awards show, the Canadian Tourism Commission cited the easing of visa restrictions for Indians. Two years after the show aired, B.C. continued to lag behind Ontario and Alberta in number of tou"
