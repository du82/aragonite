full_description = "Photo by Christopher Grabowski. What are the causes, costs and possible solutions for income inequality in British Columbia, by some measures the worst province for inequality in Canada? Tyee Legislative Bureau Chief Andrew MacLeod spent two months researching those questions to produce this multi-part series funded by the Tyee Solutions Society in collaboration with Tides Canada Initiatives (TCI). Tweet In This Series Business Leaders Stare into BC's Widened Income Gap In province where inequality keeps outstripping Canada as a whole, 'a growing disconnect.' First in a series on Super Unequal BC. Andrew MacLeod / 27 Jan 2014 INFOGRAPHIC: Inequality in British Columbia By the numbers. Part of a series on Super Unequal BC. April Alayon and Andrew MacLeod / 27 Jan 2014 In BC, How Unequal Are We? Jimmy Pattison 'just doesn't talk about that kind of thing.' This year his wealth grew by $1.25 billion. Third in a series on inequality solutions. Andrew MacLeod / 28 Jan 2014 The Banker Who Dares Argue Inequality Is Worse than Taxes Why Paul Summerville begs to differ with his business friends (as does The Economist). Fourth in a series. Andrew MacLeod / 29 Jan 2014 High BC Housing Costs Weaken Economy, Drive Inequality While owners sit on wealth, many struggle to find homes they can afford. Fifth in a series. Andrew MacLeod / 30 Jan 2014 Expensive Housing, Low Pay Challenge Next Generation Governments cut seniors' poverty but failed to support young, says UBC prof. Latest in Super Unequal BC series. Andrew MacLeod / 31 Jan 2014 Out of Inequality Grow Fresh Ways to Imagine Economy Visions of new currencies, new values, a new commons. Latest in series 'Super Unequal BC.' Andrew MacLeod / 3 Feb 2014 Eighteen Ways to Shrink Inequality Steps to raise the poor and strengthen the middle in BC, and Canada, too. Latest in a series. Andrew MacLeod / 4 Feb 2014 To Unclog the Top, Fix Politics Seven ways to de-concentrate wealth. And so it can happen, four ways to change how we elect. Latest in a series. Andrew MacLeod / 5 Feb 2014 Biggest Myth About Inequality Is We Can't Fix It Avoiding collapse requires planned positive change. Last in series Super Unequal BC. Andrew MacLeod / 6 Feb 2014"
