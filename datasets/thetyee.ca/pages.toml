["https://thetyee.ca/News/2023/02/13/Chelsea-Noelle-Tatyanna-Went-Missing"]
title = "Chelsea, Noelle and Tatyanna Went Missing. Did Police Do Enough to Find Them? | The Tyee"
description = "In three tragic cases, the families of missing Indigenous women and youth encountered baffling police decisions and delays."
full_description = "[Editor’s note: This article contains descriptions of sexual assault and stories related to missing and deceased Indigenous women and youth. It may be triggering to some readers.] THERE IS HELP If you or someone you know is experiencing difficulty in relation to missing Indigenous women and youth, call the independent support line at 1-844-413-6649. For more information, visit the National Inquiry into Missing and Murdered Indigenous Women and Girls website. Announcements, Events & more from Tyee and select partners CONTEST: Win a Pair of Tickets to ‘The Early Moderns’ One lucky Tyee reader will get the opportunity to experience the avant-garde sounds of the 17th century. Ballet BC Brings World-Class Talent to Vancouver Catch ZENITH, a lineup of three performances March 6 to 8. On Sept. 6, 2020, 24-year-old Chelsea Poorman went out for dinner with her sister. They ended up at a friend’s apartment on Granville Street, then Chelsea left. A phone call later that night would be the last time Paige would ever hear from her. On May 12, 2021, Noelle O’Soup left a foster care group home in Port Coquitlam. It wasn’t the first time the 13-year-old had left foster care, a warning sign O’Soup's family says should have been taken more seriously. Twenty-year-old Tatyanna Harrison was last seen at the Grand Union Pub in Vancouver on April 22. Her mother desperately searched the Downtown Eastside for her for months, but couldn’t find her daughter. The remains of Poorman, O’Soup and Harrison were discovered in different locations over the span of six months in 2022, sending shockwaves through the Downtown Eastside, Indigenous communities and the wider public. Poorman’s body was discovered behind a vacant home in the city’s exclusive Shaughnessy neighbourhood. Harrison’s half-clothed body was found in an abandoned yacht in Richmond. And O’Soup’s remains were found inside an SRO room rented by a man who repeatedly lured young women to his room to give them drugs. The three cases have again raised questions about the quality of police and other investigations into missing Indigenous women and youth. Over the past 13 years, a provincial and then a national inquiry on murdered and missing Indigenous women have led to dozens of recommendations, including changes to how police respond to reports of missing Indigenous people. But the families of Poorman, O’Soup and Harrison say they experienced delays, indifference and baffling decisions as they dealt with the disappearance of their loved ones. “I hope we can reach a point in our justice system where cases like these get solved instead of brushed under the rug,” said Natasha Harrison, Tatyanna’s mother, during a press conference organized by Sisters in Spirit and Amnesty International Canada on Oct. 4. “We need to end the careless disregard of human life based on race, stigma and class.” Experts in policing and death investigations say the cases raise questions about how police investigate missing persons cases, and the quality of death investigations when the deceased person is Indigenous. Steff King is a PhD student in criminology at Simon Fraser University who has studied and identified common patterns in incomplete death investigations involving young Indigenous people in Canada. King pointed out that Vancouver has a history of mishandling cases of missing Indigenous women in the 1980s and '90s when serial killer Robert Pickton was killing dozens of women who lived in the Downtown Eastside while police and local politicians downplayed the disappearances. “This is definitely something that we've seen before and we did not treat it correctly before,” King said. “This is definitely a point in which investigators need to be more critical and more action-focused,” she said. Either we’re paying more attention to police investigation practices, “or we're seeing another pattern of an increase of Indigenous women going missing.” These are the questions the families of Chelsea Poorman, Tatyanna Harrison and Noelle O’Soup still have about the investigations. Chelsea Poorman Chelsea Poorman had moved to Vancouver from Saskatchewan in the summer of 2020, following her mom Sheila Poorman and sister Paige Kiernan. The family is from the Kawacatoose First Nation. RELATED STORIES 'He Was Always with Other Girls, Giving Them Free Drugs'When Police Investigations Are InadequateWhat Happened to Chelsea? Chelsea had persevered through many obstacles, including overcoming serious injuries from a car accident and mental health issues. Despite those challenges, Chelsea was “happy and positive and strong and kept going,” her sister Diamond Poorman remembers. “You could never really see how much pain or what she went through physically on the outside — other than her limp,” Diamond said. Sheila remembers Chelsea’s kindness towards others who were less fortunate, her love of animals and her dreams for the future. “Chelsea wanted to be a veterinarian or paramedic, musician, artist, fashion designer and makeup artist. She had so much to live for when her life was taken,” Sheila said. Chelsea had been living in Vancouver for just over a month when she and Paige went out for dinner, then to a friend’s apartment at Granville and Drake, on Sept. 6, a warm fall Sunday. Chelsea Poorman’s family says she was ‘happy and positive and strong’ despite the many challenges in her life. Photos supplied. Chelsea left the friend’s apartment around midnight and later called Paige, saying she’d met “a new bae.” Sheila Poorman reported Chelsea missing on Sept. 8. In a pattern that’s common to all three cases, police did not issue a press release about Chelsea being missing until several days after the missing person report. In Chelsea’s case, the press release was sent out on Sept. 18 — a gap of 11 days between the day Sheila reported her daughter missing and the day the press release was posted. “I would watch the news and notice that others go missing, but they were on the news and the Vancouver Police Department also made a press release for them the same day,” Sheila Poorman said. “It was so frustrating to see how they were treated compared to Chelsea.” When missing person press releases hit news inboxes, Metro Vancouver’s news media usually post a quick write-up on their websites and social media accounts. To preserve the privacy of vulnerable people, it’s common practice to edit the story later to remove the person’s name if they are found safe. Vancouver police usually post a press release immediately if a missing person is a vulnerable senior with dementia. But police say there’s a concern that in other cases posting a news release could cause harm. “If detectives are concerned about someone’s mental health and feel that the extra news attention would be detrimental to their personal safety (i.e. self harm), they will continue to pursue the case through investigative means,” VPD spokesperson Simi Heer previously explained to The Tyee when asked why police waited to release information about Chelsea Poorman. Lorimer Shenher, a former detective with the Vancouver Police Department, said that explanation doesn’t make sense. Chelsea had both a physical disability and a brain injury, and she was an Indigenous woman. All of those factors should have led to her being flagged as a high-risk missing person by police, Shenher said — and requiring an immediate public appeal to locate her. “It’s the police’s job to find people, and if they're at risk of self harm, to get them somewhere where they're going to get help,” Shenher said. “Are we going to launch a full-scale task force to find her? Maybe not, but we're going to make a public appeal. Why is it any different for someone with Alzheimer's? And why is it any different for a child?” It was the second time Chelsea had gone missing after moving to Vancouver. Sheila had reported Chelsea missing earlier that summer, but Chelsea made contact five days later, saying she had lost her phone. Shenher said Chelsea’s previous disappearance is a warning sign that she was at increased risk if she went missing again. That’s because people who have previously been reported missing are statistically more likely to experience “misadventure” or violence in a subsequent disappearance. “All of those things are supposed to, by policy, necessitate an investigation — an immediate investigation,” Shenher said. Vancouver police say they did diligently investigate Chelsea’s disappearance, although her mom and sisters say they often felt dismissed by officers and had to contact police for updates. The case was transferred to the VPD’s major crimes section in November 2020 and police say they took “numerous investigative steps,” including conducting interviews, checking bank and cellphone records and “conducting an extensive video canvas.” However, Chelsea’s family remains skeptical that video footage from businesses on Granville Street was ever sought by police. The Poorman family and many supporters from Vancouver’s urban Indigenous community tried to keep Chelsea’s disappearance in the public eye in hope she would be found. But on May 6, 2022, police announced the tragic news that Chelsea’s remains had been found in the backyard of an empty house in Vancouver’s high-priced Shaughnessy neighbourhood. Left: Sheila Poorman, Chelsea’s mother, stands in front of the apartment buildings on Granville Street where Paige last saw her sister. Right: The vacant home in Vancouver’s Shaughnessy neighbourhood where Chelsea’s remains were discovered on April 22. Sheila Poorman by Christopher Cheung, mansion by Kayla Isomura. Police said Chelsea had likely died soon after she went missing, and her remains had somehow gone undetected for 18 months until a contractor doing work on the house had discovered them on April 22. Chelsea’s family was shocked and outraged to hear that police still did not consider Chelsea’s death to be suspicious. “Based on the totality of everything that we know from the start of this investigation up until we received the coroner’s findings, we don’t believe that this death is suspicious,” Sgt. Steve Addison told reporters at a May 6, 2022 press conference. “When I say that, what I mean is we do not believe Chelsea was murdered, [and] we don’t believe her death was caused by another person.” As more details started to trickle out, that determination became more baffling to the public and journalists who had covered the case. What police didn’t say at the May 6 press conference was that several body parts were missing from the skeletal remains. It fell to Sheila Poorman to tell supporters and media that the cranium and several finger bones were missing from the remains found behind the Shaughnessy house. Nor did police offer any explanation of how Chelsea came to be at the house, or how she had died. Chelsea’s family says she wasn’t familiar with the Shaughnessy neighbourhood, an area filled with multimillion dollar homes six kilometres away from downtown Vancouver. But police said the vacant $7.1-million mansion where Chelsea’s remains were found was known to be frequently entered by people who didn’t own the house or live there. Diamond Poorman has told The Tyee that a VPD detective explained to her that investigators determined Chelsea was in a sitting position when she died. “They said she was sitting with her leg brace off.” During the VPD’s press conference on May 6, media liaison officer Sgt. Steve Addison said the force had received the results of the coroner’s investigation and did not consider the death suspicious. However, the BC Coroners Service told The Tyee its investigation remains open. Shenher, the former VPD detective, said determining whether or not a death is suspicious is subjective, and factors like race and class can affect how zealously police investigate certain cases. “If you look at those kinds of circumstances, the demographic or the circumstances of the victim will definitely play a factor in how long the police are going to refrain from making that determination, until they have all the evidence,” Shenher said. “You've got to walk back the whole decision-making process for police to the very initial impressions that they have of this person. Because they do make very subjective judgments and decisions very early in the process.” Shenher said it’s surprising that police quickly determined Poorman’s death to be not suspicious. “Going missing from [downtown Vancouver] and found on a vacant property in Shaughnessy — and with her accessibility issues — there are just so many questions,” Shenher said. “How could that not be suspicious?” Steff King, the criminologist, said what jumps out to her about the Chelsea Poorman case is that police did not treat her death as suspicious. “It's not common for a young person to die at all, in any circumstance, so that should be treated as suspicious just as a baseline,” King said. “The standard practice that all investigators should follow, whether they're police or coroner, is to assume homicide first. And then their investigation is supposed to either prove or disprove that, and then they continue forward.” After the vigil where Sheila Poorman publicly stated her daughter’s remains were missing several body parts and called on police to do more, the VPD searched VanDusen Botanical Gardens, a garden near the home where Chelsea’s body was found. They didn’t find the missing body parts. The RCMP is now reviewing the VPD investigation. In September, Sheila and her daughter Paige worked with Vancouver police to record a video message pleading for information on how Chelsea ended up in Shaughnessy. Months after the discovery of her daughter’s remains, Sheila Poorman is left with so many questions. Why did police wait to send out a press release when she first went missing? Why wasn’t she flagged as vulnerable, and why wasn’t her case transferred to major crimes sooner? Why didn’t anyone notice Chelsea’s body in the backyard of a home in a quiet residential neighbourhood? “I think that after my girl being found in an abandoned, unoccupied mansion, there should be a bylaw that those places should be searched with within 24 hours or 48 hours after a person goes missing,” Sheila Poorman said. “Especially a vulnerable one.” Noelle O’Soup Noelle O’Soup, who also went by Ellie, went missing from their Port Coquitlam foster care group home at 6:30 p.m. on May 12, 2021. O’Soup had run away from foster care before, and their cousin, Olivia Louie, said the 13-year-old was being bullied at the group home. “She was happy, quirky, shy until you got to know her. Then she opened up her personality,” Josie August, a relative of O’Soup, said at a press conference in October. Ellie had family ties to the Key First Nation in Saskatchewan and the Saulteau First Nation in northern B.C. Noelle O’Soup’s family describes them as being ‘happy, quirky, shy until you got to know her.’ Photos supplied. Ellie was also known to B.C.’s foster care advocate, Jennifer C"
author = "Jen St. Denis"
