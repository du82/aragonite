["https://thetyee.ca/Blogs/TheHook/2013/10/31/David-Ball-Webster-Award"]
title = "David P. Ball's Tyee series about coal exports garners Webster award | The Hook, A Tyee blog."
description = "Vancouver journalist David P. Ball won a Webster award last night in the Community Reporting category for his series of articles on escalating West Coast coal exports published on The Tyee."
full_description = '''About The Tyee Advertise Contact Funding Jobs Master Classes Privacy Policy Submissions Support The Tyee News Culture Opinion National Mediacheck Solutions Video Publications Tyee News Weekly Archives Reported Elsewhere Steve Burgess Ian Gill Crawford Kilian Andrew Nikiforuk Dorothy Woodend Follow The Tyee Subscribe by email Subscribe by RSS The Hook: Political news, freshly caught David P. Ball's Tyee series about coal exports garners Webster award By Tyee Staff Published October 31, 2013 10:45 am | Comments Tweet Vancouver journalist David P. Ball won a Webster award last night in the Community Reporting category for his series of articles on escalating West Coast coal exports published on The Tyee. The series "Cross Border Coal War?" documented the ramped-up pressure to ship U.S.-mined coal from western ports on both sides of the Canada-U.S. border. Ball's five-parter examined the hot debate in Washington State over whether planned massively increased train shipments of coal into port communities exact too high a pollution cost relative to the jobs and economic activity they might generate. The series also profiled the CEO of the Fraser-Surrey docks slated for coal export expansion, and looked at activist efforts to forge ties across the border in resisting a burgeoning coal industry that contributes greatly to greenhouse gas emissions globally. "It was humbling to take the stage alongside so many incredible journalists at last night's Websters," said Ball of his win. "Critical, fact-based reporting seems more and more scarce today, but the award-winners demonstrate that investigative, hard-hitting journalism isn't dead. It's great to see The Tyee recognized as an important place in keeping such journalism alive." Tyee editor David Beers said it was a privilege to publish Ball's series. "David Ball was very early to this story, and served the public interest by reporting in-depth on developments that had low awareness among local citizens who could be directly affected by more coal shipped through their neighbourhoods," said Beers. "It's also an issue with important international, truly global, implications." Ball is a seasoned freelance journalist who regularly contributes to The Tyee and Tyee Solutions Society. Presently he is teaming with Jackie Wong to cover affordable housing issues for the Tyee Solutions Society. The Webster Awards are British Columbia's top prizes for journalism. Find more in: Media Tweet googletag.cmd.push(function() { googletag.display('div-gpt-ad-1547775028808-0'); }); Previous: Journalist fights back against Furlong media 'onslaught'Next: Anti-war group wants Dick Cheney arrested during Canadian visit What have we missed? What do you think? We want to know. Comment below. Keep in mind: Do: Verify facts, debunk rumours Add context and background Spot typos and logical fallacies Highlight reporting blind spots Ignore trolls Treat all with respect and curiosity Connect with each other Do not: Use sexist, classist, racist or homophobic language Libel or defame Bully or troll Troll patrol. Instead, flag suspect activity. /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */ var disqus_shortname = 'thetyee'; // required: replace example with your forum shortname var disqus_identifier = 'A19A2F78-4254-11E3-85BC-9658465C0BED'; var disqus_title = 'David P. Ball&#39;s Tyee series about coal exports garners Webster award'; var disqus_url = 'http://thetyee.ca/Blogs/TheHook/2013/10/31/David-Ball-Webster-Award/'; /* * * DON'T EDIT BELOW THIS LINE * * */ (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus'''
