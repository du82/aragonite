["https://thetyee.ca/Opinion/2014/11/06/BC-Government-Demand-Response"]
title = "Why The Tyee Said No to BC Government's Demand | The Tyee"
description = "Lawyer's letter sought to stop publishing details from internal health ministry emails obtained by reporter Andrew MacLeod."
full_description = '''In service of government transparency: Responsibly publishing health ministry email contents is in the public interest. Photo of BC Legislature Building by Chris Leboe from Your BC: The Tyee Photo Pool. Following The Tyee's publication on Oct. 21 of an article about the contents of internal health ministry emails, a lawyer acting for the ministry sent The Tyee a letter demanding we publish no further personal details from those messages. Key Health Ministry Advisor Was Surprised Firings Targeted Just 'Low Level People': Emails read more Announcements, Events & more from Tyee and select partners CONTEST: Win a Pair of Tickets to ‘The Early Moderns’ One lucky Tyee reader will get the opportunity to experience the avant-garde sounds of the 17th century. Ballet BC Brings World-Class Talent to Vancouver Catch ZENITH, a lineup of three performances March 6 to 8. In consultation with our lawyer, we've chosen not to comply. We've taken this position for a number of reasons, including our view that the provisions of the legislation relied on by the ministry's lawyer are either inapplicable to our circumstances here, or if they do apply, they are unconstitutional and contrary to the press freedoms guaranteed under the Charter. "Personal information" in the emails would include any discussion of the employment history of an employee or "information relating to workplace situations that is evaluative in nature, including allegations about an employee," wrote Ministry of Justice lawyer John Tuck in an Oct. 24 letter, published in full below, on behalf of the health ministry. "This letter is not intended to stifle or limit public debate about the general issue referred to in the Article," wrote Tuck. "However, the [Freedom of Information and Protection of Privacy Act] obliges the Ministry to take steps to contain this privacy breach so as to prevent harm to the individuals whose personal information is at issue." The letter cited sections of the FOIPPA that require a public body to take steps to contain a breach when it becomes aware of an unauthorized disclosure of personal information within its custody or under its control. The Tyee has 20 days to respond formally to Tuck's letter, which we will do. The government's letter feels to us at The Tyee like an attempt to intimidate and muzzle us from further reporting on an important topic for British Columbia. We believe the public interest is better served by us treating the information in the emails carefully and reporting on it responsibly, than it would be by complying with the government's attempt at censorship. While the emails The Tyee obtained were written by people within the government, they were sent to us by somebody outside of the government who we believe had legitimate access to them. That is, they do not appear to have been within the government's "custody or under its control" before we received them. The government's actions on this file led to seven firings, a freeze on some drug research contracts, five lawsuits, a union grievance, several investigations and possibly a suicide. From the start there have been many unanswered questions and the government's attempt to stop us from shining a light on what happened won't help. The emails reveal that government investigators uncovered what they believed to be serious problems with contracts, conflicts of interest and data management, but that disciplinary action including firings focused on lower-level employees, not the senior managers who were aware of the various concerning situations and in some cases approved them. We feel compelled to share with the public relevant information that is clearly, in our view, in the public interest. DV.load("//www.documentcloud.org/documents/1354609-lt-editor-of-tyee-oct-24-14-2.js", { width: 600, height: 400, sidebar: false, pdf: false, container: "#DV-viewer-1354609-lt-editor-of-tyee-oct-24-14-2" }); Read more: BC Politics, Media'''
