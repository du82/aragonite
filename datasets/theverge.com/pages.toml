title = "Amazon buys Wondery, setting itself up to compete against Spotify for podcast domination | The Verge"
description = "Amazon acquired independent podcast company Wondery. The two companies didn’t announce the deal price but said the arrangement would help bring podcasts to a global audience."
full_description = "TechAmazon buys Wondery, setting itself up to compete against Spotify for podcast dominationWondery is now part of Amazon MusicWondery is now part of Amazon Musicby Ashley CarmanDec 30, 2020, 5:54 PM UTCLinkFacebookThreadsAmazonWondery, one of the last major independent podcast networks, might soon be owned by Amazon. The companies announced an acquisition deal today, ending speculation about who might eventually buy the network, which is most well-known for true crime podcasts like Dirty John. (Apple and Sony were also reported to have at least discussed a possible purchase.)Amazon didn’t disclose the acquisition price, although earlier reports from Bloomberg and The Wall Street Journal suggested Wondery’s value was at least $300 million. Wondery would technically be part of Amazon Music, which launched podcast support in September this year. Wondery CEO Hernan Lopez will step down and leave the company when the deal closes, and COO Jen Sargent will take over, according to Wall Street Journal reporter Ben Mullin.The acquisition is a notable one, if only because it sets Amazon up to better compete against Spotify, which has been acquiring networks and exclusive talent for over a year. Amazon says this Wondery deal doesn’t change existing shows — they’ll still be available through “a variety of providers.” But Amazon says it hopes buying Wondery will “accelerate the growth and evolution of podcasts by bringing creators, hosts, and immersive experiences to even more listeners across the globe.”Of course, Amazon Music would likely promote Wondery shows over other programs and possibly put even more marketing spend behind them, especially globally. Interestingly, Audible isn’t mentioned in the news release, even though the Amazon-owned company creates its own exclusive podcasts, as well as publicly available ones, and recently launched a cheaper price tier specifically for people who might want to hear Audible exclusives.Correction 12/30, 1:29 PM ET: This story previously stated that Wondery is now owned by Amazon, but the deal has not yet closed.Update 12/30, 3:13 PM ET: Updated to reflect that Hernan Lopez will leave Wondery when the deal closes.See More: CreatorsNewsPodcastsTechMost PopularMost PopularGoogle’s co-founder tells AI staff to stop ‘building nanny products’With Alexa Plus, Amazon finally reinvents its best productThe armless PP-1 turntable is made from a solid block of aluminumAMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thAsus ROG Flow Z13 (2025) review: hold up, integrated graphics are good now?InstallerA weekly newsletter by David Pierce designed to tell you everything you need to download, watch, read, listen to, and explore that fits in The Verge’s universe.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
