title = "Taylor Swift’s podcaster boyfriend has a new deal with Amazon | The Verge"
description = "The New Heights with Travis and Jason Kelce hosts have signed a $100 million deal that gives Amazon publisher Wondery distribution and ad sales rights for the show."
full_description = "Column /Hot PodTaylor Swift’s podcaster boyfriend has a new deal with AmazonTravis and Jason Kelce get a $100 million deal to go ad-free on Amazon’s Wondery Plus.Travis and Jason Kelce get a $100 million deal to go ad-free on Amazon’s Wondery Plus.by Wes DavisAug 27, 2024, 2:36 PM UTCLinkFacebookThreadsTravis and Jason Kelce after the 2024 AFC Championship. Photo: Patrick Smith / Getty ImagesWes Davis is a weekend editor who covers the latest in tech and entertainment. He has written news, reviews, and more as a tech journalist since 2020.Taylor Swift’s boyfriend, Travis Kelce, and his brother Jason have inked a $100 million deal to hand over distribution of their sports podcast series, New Heights with Jason & Travis Kelce, to Amazon’s Wondery publisher, reports The Wall Street Journal. The deal gives subscribers to Wondery Plus “early and ad-free” access to the popular series, Amazon announced.Wondery Plus subscribers will also get a once-a-year livestream of the Kelces’ show, according to the Journal. Otherwise, folks who listen to New Heights (which launched in 2022 and has since become one of the top US podcasts) on other platforms like Apple Podcasts and Spotify, or watch it on YouTube, probably won’t notice much of a difference.“Wondery understands the shared vision and will offer a wealth of experience and resources to take us to new heights,” said the two cohosts in Amazon’s announcement. “We are going to create some groundbreaking moments together through this partnership.” The brothers Kelce will give Wondery opportunities for other live events and first dibs on any product lines either of them decides to introduce, the Journal writes.Podcast deals like this, which lack the total exclusivity of Spotify’s older deals, include Call Her Daddy and SmartLess, both of which SiriusXM nabbed this year. New Heights joins other Wondery Plus early access shows like Dax Shepard’s Armchair Expert, which Wondery secured distribution rights for in July.See More: AmazonColumnCreatorsHot PodNewsTechMost PopularMost PopularGoogle’s co-founder tells AI staff to stop ‘building nanny products’With Alexa Plus, Amazon finally reinvents its best productThe armless PP-1 turntable is made from a solid block of aluminumAMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thAsus ROG Flow Z13 (2025) review: hold up, integrated graphics are good now?InstallerA weekly newsletter by David Pierce designed to tell you everything you need to download, watch, read, listen to, and explore that fits in The Verge’s universe.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
