["https://theverge.com/24348851/donald-trump-presidency-tech-science-news"]
title = "Trump’s first 100 days: all the news affecting the tech industry | The Verge"
description = "President Donald Trump is taking on TikTok, electric vehicle policies, and AI in his first 100 days in office. This time around, he has the backing of many tech billionaires."
full_description = "PolicyUpdated Today, Mar 1, 2025, 4:52 PM UTCTrump’s first 100 days: all the news affecting the tech industryby Verge StaffLinkFacebookThreadsRSSPresident Donald Trump kicked off the first day of his presidency by signing a flurry of executive actions, including halting enforcement of the TikTok ban and rolling back the Biden administration’s artificial intelligence order.Having already run the country once before, Trump entered the presidency with the goal of hitting the ground running, having already selected nominees and chairs for key agencies that oversee tech. This time, Trump has the backing of many tech billionaires who attended his inauguration and showed up at his home in Mar-a-Lago.Read on below as we keep track of all the ways Trump is leaving his mark on tech in his first 100 days in office.Today, 4:52 PM UTCWes DavisNew email tells federal employees to list recent accomplishments weeklyImage: Cath Virginia / The Verge, Getty ImagesFederal workers started getting emails on Friday night, “asking them to provide a list of accomplishments from the week,” reports The New York Times. According to the outlet, the message told workers they’ll now be expected to provide such a list every Monday by 11:59PM ET.This time around, the Times writes that “employees who worked only on classified or sensitive activities were instructed to write ‘all of my activities are sensitive’ in response.” The Office of Personnel Management (OPM) reportedly sent the email to agencies that include the FBI, the General Services Administration, and the Departments of Defense, Justice, Labor, and Agriculture. In at least one other case, it was sent by an internal department address, according to The Associated Press.Read Article >Feb 28Lauren FeinerDOGE wants to lay off the ‘vast majority’ of CFPB workers, employees sayImage: Cath Virginia / The VergeThe Department of Government Efficiency (DOGE) is planning to fire the “vast majority” of employees at the Consumer Financial Protection Bureau (CFPB), agency employees — some using pseudonyms for fear of retaliation — told a federal court in sworn declarations.Seven current and five former CFPB employees submitted the declarations as part of the National Treasury Employees Union case against Office of Management and Budget director Russell Vought, who’s currently serving as the acting director of the CFPB. The union is seeking to halt the already in-progress dismantling of the financial services watchdog, which fields thousands of consumer complaints each week about financial products, and as of 2023, had returned $17.5 billion to consumers over 12 years through things like monetary compensation and canceled debts. Earlier this month, The Verge reported that roughly 20 technologists at the agency were suddenly fired on a weeknight, amid a broader swath of layoffs. The court has temporarily barred the CFPB from making further cuts. Read Article >Feb 28Justine CalmaTed Cruz ‘investigation’ flagged mint research as ‘woke.’Why? The grant application — for a project on the evolution of mint — discussed the diversity of plants and mentioned that there was a female scientist on the team, ProPublica reports. It’s just one example of how all kinds of work is getting caught up in the anti-civil rights crusade jeopardizing scientific research.A Study of Mint Plants. A Device to Stop Bleeding. This Is the Scientific Research Ted Cruz Calls “Woke.”[propublica.org]Feb 27Andrew J. HawkinsStarlink poised to take over $2.4 billion contract to overhaul air traffic control communicationThe air traffic control tower after the American Airlines crash at Reagan National Airport on February 3rd, 2025, in Arlington, Virginia. Image: Getty ImagesWhile Elon Musk hacks away at the federal bureaucracy in the name of “efficiency,” his company Starlink appears poised to steal a multibillion-dollar government contract from Verizon.The Federal Aviation Administration is on the cusp of canceling a $2.4 billion contract to overhaul the communication system for the nation’s air traffic control system and handing it to the SpaceX subsidiary instead, The Washington Post reports, citing two unnamed sources briefed on the plans. The news was also confirmed by Bloomberg and The Associated Press.Read Article >Feb 27Justine CalmaAntarctic research is at risk.The wrecking ball the Trump administration and DOGE have taken to federal government agencies is already having an impact in Antarctica. Questions loom about whether US stations will be able to survive the chaos. And the US could wind up ceding influence on the continent to other countries, Wired reports.“Even brief interruptions will result in people walking away and not coming back,” Nathan Whitehorn, an Antarctic scientist at Michigan State University, tells Wired.DOGE’s Chaos Reaches Antarctica[wired.com]Feb 25Adi RobertsonWe finally know who’s legally running DOGEImage: Cath Virginia / The Verge, Getty ImagesThe White House has named Amy Gleason as the acting administrator of the Department of Government Efficiency (DOGE). The news, delivered by an unnamed White House official to CNBC and other media outlets, follows days of obfuscation in courtrooms, the press, and the pseudo-department itself. It designates Gleason a likely target for the nigh-continuous legal challenges over DOGE’s access to sensitive data and freezing of government funds — while potentially shielding its high-level leader Elon Musk.Gleason’s LinkedIn profile indicates she previously served in the US Digital Service (which has since been converted to serve DOGE’s efforts) and worked for the healthcare investment firm Russell Street Ventures. It’s unclear when she was given her current title or whether there are plans for a permanent head of DOGE. And earlier today, White House press secretary Karoline Leavitt refused to name a formal administrator for the group. “I am not going to reveal the name of that individual from this podium,” Leavitt said, telling reporters she would be “happy to follow up” later to provide it.Read Article >Feb 25Justine CalmaDonald Trump broke the law by removing climate change references from USDA websites, lawsuit allegesOrganic labeled vegetables are offered for sale at a grocery store on January 19, 2023 in Chicago, Illinois. Getty ImagesThe US Department of Agriculture’s decision to purge information about climate change from its websites harms organic farmers and threatens their livelihoods, a new lawsuit alleges.Since President Donald Trump stepped into office, the USDA has removed “scores of vitally important webpages” that mention climate change, the suit says. The administration has been racing to destroy public resources that address climate change and civil rights, sparking legal battles to bring those webpages back.Read Article >Feb 24Adi RobertsonThe government is still threatening to ‘semi-fire’ workers who don’t answer an email from Elon MuskImage: Cath Virginia / The Verge, Getty ImagesWe’re nearing the deadline that Elon Musk imposed for government workers to reply to a mass email about productivity, and the results have been predictably confusing — with even a direct statement from President Donald Trump failing to clear things up.Government agencies have taken significantly different tacks toward the Musk-promoted email, which he announced to the public midday on February 22nd. Sent by the Office of Personnel Management (OPM), the message demanded all federal employees respond by the end of the 24th with “5 bullets of what you accomplished last week,” and Musk said on X that “failure to respond will be taken as a resignation.” The email reportedly didn’t include this noteworthy detail.Read Article >Feb 24Richard LawlerAbout that State Department ‘estimate’ for a $400 million order of armored Teslas.After questions were raised earlier this month about the line item proposing $400 million for “Armored Tesla (Production Units),” the State Department said the solicitation stemmed from a Biden-admin request. However, an NPR reporter says a document shows the Biden administration had approved less than $500k to look into armoring electric vehicles, while experts said the new figure would just about account for replacing the department’s entire 3,000-vehicle fleet with Tesla trucks.Feb 24Richard LawlerHow much of Apple’s ‘$500 billion commitment to our country’s future’ is actually new?This Wall Street Journal report looks into Apple’s history of spending to give some context to its half-trillion-dollar Monday morning announcement.There’s a note from a UBS analyst outlining that the firm is a “skeptic” because coming up with new funds to invest would mean increasing Apple’s balance sheet leverage or reducing the cadence of stock buybacks. Otherwise, despite accounting for “some new, incremental spending domestically,” the report finds that based on analysts’s existing projections, “Apple’s announced figure is in line with what one might expect the company to be spending anyway, given its financials.”Apple’s $500 Billion U.S. Investment Is Mostly Already in the Books[wsj.com]Feb 24Richard LawlerSomeone flooded HUD HQ TVs with an AI-generated video of Trump and Musk.As shown in a clip posted by The Handbasket writer Marisa Kabas, people in the Department of Housing and Urban Development HQ were greeted on day one of their mandatory return to office with what appears to be an AI-generated video of Donald Trump kissing Elon Musk’s feet. It is visible in the post, and they are both left feet, for some reason.She writes that the video played on loop for about five minutes, until staff unplugged them.Marisa Kabas (@marisakabas.bsky.social)[bsky.app]Feb 24Wes DavisConservative podcaster Dan Bongino named deputy FBI directorDan Bongino at the 2022 Fox Nation Patriot Awards. Photo by Jason Koerner/Getty ImagesPresident Donald Trump announced Sunday night he has named conservative podcaster Dan Bongino as the FBI’s new deputy director. Bongino has worked as a New York police officer and US Secret Service agent, but has no FBI experience.Bongino is well-known in conservative media, thanks to credits like having hosted a Fox News show and contributed to conspiracy website InfoWars. (Another one-time Fox News presenter, Pete Hegseth, serves as the US Secretary of Defense.) He was also among the right-wing commentators whose popularity sparked a fight over Facebook’s CrowdTangle analytics tool, ultimately resulting in its shutdown. His outsized online influence saw him named one of the top election conspiracy “misinformation superspreaders” in research by global human rights group Avaaz, The New York Times reported in 2020.Read Article >Feb 24Richard LawlerThe SEC has ended its investigation into Robinhood crypto.Closely following similar news from Coinbase on Friday, Robinhood says:On February 21, 2025, the SEC’s Enforcement Division advised RHC in a letter that it had concluded its investigation and did not intend to move forward with an enforcement action.As we noted last week, the crypto industry donated heavily in the 2024 election cycle, and Robinhood lists the $TRUMP memecoin on its platform. Robinhood CEO Vlad Tenev noted making a $2 million donation to Trump’s inaugural campaign fund in a Fox News interview, claiming the Biden administration engaged in “open warfare” with the crypto industry.Feb 24Dominic PrestonApple responds to tariff threat with a $500 billion US investment planUS President Donald Trump speaks with Tim Cook in 2019. Bloomberg via Getty ImagesApple has announced plans to invest more than $500 billion in the US over the next four years, including hiring 20,000 new employees and launching a new server factory in Texas. The announcement was teased after a meeting last week between CEO Tim Cook and President Donald Trump, and comes as the company tries to mitigate the business impact of Trump’s trade tariffs, with a 10 percent tariff already in effect on goods imported from China, and a 25 percent tariff threatened for chips.The announcement echoes one Apple made in early 2018, during the first Trump administration. At that point Apple also promised 20,000 new jobs as part of a $350 billion spend in the US, alongside a new campus in Austin which is still under construction. The company successfully appealed for tariff exemptions for some of its products, and a new US investment may be a way to secure further protection from Trump’s new charges. Apple has not confirmed how many of the new investments were already planned before Trump took office.Read Article >Feb 23Richard Lawler and Wes DavisElon Musk claims federal employees have 48 hours to explain recent work or resignImage: Cath Virginia / The Verge, Getty ImagesElon Musk tweeted Saturday that federal workers would soon get an email “requesting to understand what they got done last week.” According to the New York Times, the email from the Office of Personnel Management went to agencies across the federal government that afternoon, including the FBI, State Department, and others, with a deadline for response by 11:59PM ET on Monday. However, the message lacked a detail from Musk’s tweet, according to the Times, where he said, “Failure to respond will be taken as a resignation,” which a number of lawyers have said would be illegal. The Washington Post reports that experts said it “may be asking some recipients to violate federal laws,” and Sam Bagenstos, a University of Michigan law professor quoted by the Times, said, “There is zero basis in the civil service system for this.” Read Article >Feb 23Wes DavisDOGE asks federal workers to justify their recent work or resign.Apparently responding to a President Trump post saying he wanted Elon Musk to be “more aggressive,” the Musk-led organization emailed federal workers — even some placed on leave — demanding “approx. 5 bullets of what you accomplished last week” by Monday at 11:59PM ET, reports Business Insider.“Failure to respond will be taken as a resignation,” Musk posted today, echoing his 2022 opt-in-to-stay-employed email to Twitter workers. Federal employee union AFGE said in a statement it will “challenge any unlawful terminations.”Feb 22Wes DavisThe SEC drops its investigation against OpenSea.The Securties and Exchange Commission’s investigation was related to an almost two-year-old lawsuit against the struggling NFT marketplace, but has now been dropped as the agency backs off of its campaign against digital assets, reports Axios.The news follows yesterday’s SEC announcement it was ending a similar lawsuit against Coinbase.SEC closes investigation into OpenSea, furthering new stance on crypto industry[axios.com]Feb 22Wes DavisThe new US Social Security head was suspected of secretly feeding info to Musk’s DOGE.Acting commissioner Leland Dudek, a data analyst at a small anti-fraud office before his ascension last week, was placed on paid leave and under internal investigation on suspicion he’d broken privacy and tax laws by “sharing unauth"
