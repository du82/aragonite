["https://theverge.com/2024/11/19/24300709/google-gemini-chatbot-memory"]
title = "Google Gemini can remember things now | The Verge"
description = "Google is rolling out the ability for Gemini to “memorize” certain things you’ve told it, such as your interests, personal aspirations, and more."
full_description = "Tech /GoogleGoogle Gemini can remember things nowThe AI chatbot can now personalize its responses based on your interests and preferences.The AI chatbot can now personalize its responses based on your interests and preferences.by Emma RothNov 19, 2024, 6:15 PM UTCLinkFacebookThreadsIllustration: The VergeEmma Roth is a news writer who covers the streaming wars, consumer tech, crypto, social media, and much more. Previously, she was a writer and editor at MUO.Google Gemini can now “remember” certain things about you, such as your interests and personal preferences. The change is rolling out to subscribers with access to Gemini Advanced, and it will allow the AI chatbot to tailor its responses based on your needs, according to Gemini’s most recent release notes.As noted by Google, you can share your interests, as well as details about your work, hobbies, or aspirations, while chatting with Gemini. You can also enter relevant details about yourself within the bot’s “Saved Info” page, such as telling it to only suggest vegetarian recipes, or that you work as an accountant.You can view, edit, or delete data Gemini has collected from the “Saved Info” page as well. Gemini will note when it incorporates your information in its responses. You can access Gemini Advanced through a Google One AI Premium subscription, and it’s only available in English for now.OpenAI first rolled out its Memory feature to ChatGPT Plus subscribers in April. Just like with Gemini, ChatGPT can keep track of things you’ve mentioned in previous conversations, such as your favorite food, or the kinds of pets you have.See More: AIGoogleNewsTechMore in this streamSee allPew Research poll asks what workers are doing with AI chatbots.Richard LawlerFeb 25CommentsComment Icon BubbleGoogle charges 50 cents per second to use its Veo 2 AI video generator.Wes DavisFeb 24CommentsComment Icon BubbleAnthropic’s new ‘hybrid reasoning’ AI model is its smartest yetAlex HeathFeb 24CommentsComment Icon BubbleMost PopularMost PopularMicrosoft is shutting down Skype in favor of TeamsMeta is firing about 20 employees for leaking informationGoogle’s co-founder tells AI staff to stop ‘building nanny products’AMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thNHL officials are wearing Apple Watches on iceInstallerA weekly newsletter by David Pierce designed to tell you everything you need to download, watch, read, listen to, and explore that fits in The Verge’s universe.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
