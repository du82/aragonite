["https://theverge.com/2021/9/16/22677015/project-taara-fsoc-wireless-internet-kinshasa-congo-fiber"]
title = "Alphabet’s Project Taara laser tech beamed 700TB of data across nearly 5km | The Verge"
description = "Google’s parent company Alphabet has a moonshot project dedicated to building up a wireless optical technology that can create links capable of sending up to 20Gbps. A recent test linking two cities across the Congo River managed to transfer 700TB of data over 20 days, with 99.9 percent uptime."
full_description = "TechAlphabet’s Project Taara laser tech beamed 700TB of data across nearly 5kmThe 20Gbps Free Space Optical Communications tech for Project Taara was originally part of Project LoonThe 20Gbps Free Space Optical Communications tech for Project Taara was originally part of Project Loonby Richard LawlerSep 16, 2021, 7:11 AM UTCLinkFacebookThreadsProject Taara link Image: XRichard Lawler is a senior editor following news across tech, culture, policy, and entertainment. He joined The Verge in 2021 after several years covering news at Engadget.In January, Google’s parent company, Alphabet, shut down Project Loon, an initiative exploring using stratospheric helium balloons to distribute wireless internet (an attempt to use solar-powered drones folded in 2017). However, some technology developed as a part of the Loon project remained in development, specifically the Free Space Optical Communications (FSOC) links that were originally meant to connect the high flying balloons — and now that technology is actively in use providing a high-speed broadband link for people in Africa.Sort of like fiber optic cables without the cable, FSOC can create a 20Gbps+ broadband link from two points that have a clear line of sight, and Alphabet’s moonshot lab X has built up Project Taara to give it a shot. They started by setting up links in India a few years ago as well as a few pilots in Kenya, and today X revealed what it has achieved by using its wireless optical link to connect service across the Congo River from Brazzaville in the Republic of Congo and Kinshasa in the Democratic Republic of Congo.The wireless optical link achieved 99.9 percent availability over 20 daysIn 20 days, Project Taara lead Baris Erkmen says the link transmitted nearly 700TB of data, augmenting fiber connections used by local telecom partner Econet and its subsidiaries. The reason for testing the technology in this location is not only the climate, which the team admits is better suited to wireless optical communications than a foggy city like San Francisco but the obstacle created by the deep and fast-flowing river. The cities are only a few miles apart as the crow flies, but Taara says a fiber link to Kinshasa has to run nearly 250 miles (400 kilometers), making it five times as expensive to get online.Despite sending its communications without the protection of a physical fiber, Taara says that during the test period, its link had 99.9 percent availability. The team tells The Verge that end users don’t know when their communications are using FSOC instead of fiber and that it aims to provide an indistinguishable experience. They also said that they hadn’t experienced any weather conditions in the Congo that affected the connection on this link so far. They credit its resilience in the face of haze, light rain, birds, and other obstacles to the ability to adjust laser power on the fly, as well as improved pointing and tracking.Project Taara pointing and tracking system Image: XProject Taara links are placed high up, naturally, since they need to be able to see each other, and as you can see in the GIF above, they’re capable of automatically adjusting their mirrors to connect “a light beam the width of a chopstick accurately enough to hit a 5-centimeter target that’s 10 kilometers away.” The system can adjust itself within +/-5 degree cone, and the team says that if that fails for some reason, they can attempt to remote control them into a connection before sending technicians out.See More: GoogleNewsTechMost PopularMost PopularGoogle’s co-founder tells AI staff to stop ‘building nanny products’Meta is firing about 20 employees for leaking informationAMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thMicrosoft is shutting down Skype in favor of TeamsThe armless PP-1 turntable is made from a solid block of aluminumInstallerA weekly newsletter by David Pierce designed to tell you everything you need to download, watch, read, listen to, and explore that fits in The Verge’s universe.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
