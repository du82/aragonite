["https://theverge.com/23758095/electric-vehicle-charging-news-nacs-ccs-tesla-supercharger-us-infrastructure"]
title = "EV charging in America: all the news about building a new electric car infrastructure | The Verge"
description = "Tesla’s Superchargers have long given its electric cars an edge over others from Ford, GM, Rivian, and Volvo. With its NACS EV port stepping on the toes of CCS, what does that mean for North America’s complicated charging situation?"
full_description = "TranspoUpdated Feb 28, 2025, 7:31 PM UTCAll the news about EV charging in the USby Verge StaffLinkFacebookThreadsRSSThe state of electric vehicle charging in North America is shaping up like the smartphone charging wars — but focused on much more expensive hardware. Right now, like USB-C and Android phones, the Combined Charging System (CCS, Type 1) plug is on a greater variety of cars. Meanwhile, Tesla’s plug was long compared to Apple and Lightning.But while Apple eventually adopted USB-C, Tesla is opening up its connector, renaming it the North American Charging Standard (NACS), and trying to shove CCS out of the way.And it’s working: the new NACS port is being standardized by SAE International, and today, largely every automaker, including Ford, GM, Toyota, Rivian, Volvo, Polestar, Nissan, Mercedes-Benz, Jaguar Land Rover, Fisker, Hyundai, Stellantis, Volkswagen, and BMW, has signed on. New cars equipped with NACS are on the way but likely won’t start rolling out until 2026.Meanwhile, Europe already dealt with its standards issue by settling on CCS2. For now, EV drivers in their Tesla Model Ys, Kia EV6s, and Nissan Leafs (with the ailing CHAdeMO connector) in the US are still stuck looking for the right station or adapter and hoping everything’s operational — but things should get easier soon.To help solve these issues, the federal government has established a pool of $7.5 billion to fund charging network operators in building reliable EV infrastructure.North America can become a great and convenient place to own an electric vehicle, but how long will that take? You can find out by reading all the news about electric vehicle charging right here, so come back and plug in often.Feb 28Andrew J. HawkinsTesla Superchargers coming to dozens of Steak ‘n Shake locationsImage: GettyTesla is planning to install dozens of Supercharger sites at Steak ‘n Shake locations across the country, according to an exchange between the companies on X. The companies have signed an agreement for over six sites, with over 20 more to come. And if Steak ‘n Shake gets its way, possibly 100 restaurants will see future Supercharger installations.The way the news trickled out was a little weird, yet typical of how Elon Musk likes to use his social media platform, X, to publicize new information about his various companies.Read Article >Feb 28Umar ShakirEVgo says no to fast-charging extension cables and breakaway adaptersImage: EVgoElectric vehicle charging network EVgo changed its terms of service Thursday to include new language explicitly prohibiting the use of high-speed DC extension cables and breakaway adapters at the company’s stations. The terms, which go into effect March 8th, are another bump in the road for enterprising companies looking to cash in on EV charging accessories.EVgo added the following terms in bold to the Authorized Charging Adapters section of its Terms of Service: “EVgo prohibits the use of all other adapters, including break-away adapters and DC extension cords (“Unauthorized Equipment”) on EVgo’s network and Charging Stations.” The company continues to authorize “automaker-manufactured charging adapters” (such as J3400 “NACS” to CCS1) and have UL2252 certification.Read Article >Feb 21Andrew J. HawkinsThe GSA is shutting down its EV chargers, calling them ‘not mission critical’A GSA-owned EV charger. Image: GSAThe General Services Administration (GSA), which manages buildings owned by the federal government, is planning to shut down all of its electric vehicle chargers nationwide, describing them as “not mission critical.” The agency, which manages contracts for the government’s vehicle fleets, is also looking to offload newly purchased EVs. The GSA currently operates several hundred EV chargers across the country, with approximately 8,000 plugs that are available for government-owned EVs as well as federal employees’ personally owned vehicles. Read Article >Feb 7Andrew J. HawkinsTrump administration halts $5 billion EV charging program that benefited TeslaNEVI-funded Tesla Supercharger in Frisco, Colorado. Image: NEVIThe Trump administration’s war on electric cars continues with the halt of a national program that sends money to states to install EV charging equipment. It was the latest move by President Donald Trump to reverse Biden-era EV policies — even as those policies have personally enriched his top ally, Elon Musk.According to a memo from the Federal Highway Administration (FHWA), the National Electric Vehicle Infrastructure (NEVI) program will be put on pause while it is retooled to align with the new administration’s priorities (those priorities being more gas guzzlers and fewer EVs). The agency said it is “immediately suspending” the approval of plans to deploy new EV chargers “for all fiscal years” and will no longer approve new funding requests until a new plan is implemented.Read Article >Feb 3Umar ShakirFord is bringing its free home EV charger offer to Canada.Canadians can now take advantage of the recently extended Ford Power Promise promotion, which includes a free home charger plus standard installation, 24/7 live EV support, and access to the BlueOval charging network. You must buy or lease a new Ford F-150 Lightning, Mustang Mach-E, or an E-Transit vehicle between February 1st and March 31st to take advantage. In Quebec, the charger plus installation costs $2,450 plus tax.Switching to Electric Just Got Easier for Canadians with the Ford Power…[linkedin.com]Jan 30Umar ShakirKia EVs will get Tesla Supercharger access in MarchImage: Tim Stevens for The VergeKia’s electric vehicles will get Tesla Supercharger access “sometime in March 2025,” the company announced in a statement. Kia EVs, including the EV6 and EV9, were scheduled to get Supercharger access in January using NACS to CCS1 adapters, but that has been delayed.Kia’s sister company, Hyundai, is beginning to ship new 2025 model year Ioniq 5 EVs with native NACS ports that match the ones on Teslas, and its models with older CCS1 ports can already plug into Supercharger stations using an adapter. However, Kia dealerships are now receiving NACS adapters meant to be free to EV6 and EV9 owners who purchased the new vehicles on or after September 4th, 2024. Kia also says owners can buy the adapter from dealers.Read Article >Jan 28Umar ShakirTesla Cybertrucks get faster charging at V4 Supercharger stalls.If you can find them, that is. While there aren’t a lot of new V4 posts out there yet, they’re supposed to support up to 500kW of fast charging once Tesla upgrades the on-site cabinets. For now, locations with the newly-designed stalls will support 325kW charging for Cybertrucks. Electrek notes that Elon Musk once suggested V3 would be capable of more than 350kW.Jan 28Andrew J. HawkinsLucid Gravity has a unique rear motor to help maximize EV chargingImage: LucidLucid started delivering the Gravity SUV to customers late last year but waited until now to reveal an interesting quirk about the new luxury EV that it says can help make charging better than ever before.When it was first announced, Lucid said that the 450-mile, $94,950 Gravity SUV would come with an incredible 926-volt architecture, making it one of the few vehicles on the market to exceed the 900-volt Lucid Air or fast-charging 800-volt systems found in many Hyundai, Kia, and Genesis vehicles. That architecture allows Gravity owners to add up to 200 miles of range after just 12 minutes of charging — provided you have access to the right charger.Read Article >Jan 16Umar ShakirChargePoint is doing something about all the EV charger cable-cutting crooksPhoto by Andrew Liptak / The VergeChargePoint has had enough of vandalizing thieves who saw through EV charger cables to steal valuable copper — so now it’s making new “cut-resistant” cables and adding alarm systems in an attempt to mitigate the damage.ChargePoint’s VP of product management Steve Farrell tells The Verge the cable uses a patent-pending technology that includes strategically placed steel to provide protection. Although the design may make the cables a bit larger and less flexible, Farrell wrote that usability won’t be impacted, and that most users “will not notice the difference” with the changes. The new cable can be retrofitted on commercial and fleet charging stations (both AC and DC models) made by the company.Read Article >Jan 9Andrew J. HawkinsMercedes-Benz EV owners can start using Tesla Superchargers in FebruaryImage: Mercedes-BenzMercedes-Benz said that its electric vehicles will be able to access Tesla’s Supercharger network starting in February.By now you should be familiar with how this goes: a manufacturer announces Supercharger access, first through the use of NACS-to-CCS adapters and then later with native NACS integration. The adapters are available to purchase through dealerships. And EV owners will get to giddily watch as the number of accessible public EV chargers suddenly grows by the thousands. (By last count, Tesla had 20,000 stalls in the US and Canada.)Read Article >Dec 23, 2024Umar ShakirHyundai will give its EV customers free NACS adapters in early 2025An Ioniq 5 using a CCS to NACS adapter to charge at a Supercharger. Image: HyundaiHyundai announced it will start distributing free CCS to Tesla NACS adapters to its EV customers in the first quarter of 2025. The adapters will enable vehicles such as the Ioniq 5 and Ioniq 6 to connect to “20,000-plus” Tesla Supercharger stations. The free adapter is available to those who purchased or leased their Hyundai EVs on or before January 31st, 2025.The NACS adapter deal includes 2024 and earlier Kona Electric, Ioniq hatchback, Ioniq 5, and Ioniq 6. It also includes the 2025 Ioniq 6, 2025 Ioniq 5 N, 2025 Kona Electric, and Genesis brand EVs (a full list will be revealed next year). You can request the free adapter through the My Hyundai owner portal.Read Article >Dec 18, 2024Umar ShakirGM and ChargePoint plan to install hundreds of fast EV chargers by the end of 2025A station render with Chargepoint-built GM Energy chargers. Image: GMGM is partnering with ChargePoint to build out a new EV charging network under the GM Energy brand, the companies announced today.GM plans to install up to 500 DC fast-charging ports at stations deployed in “strategic” places across the US, with some equipped with ChargePoint’s Express Plus platform that supports charge speeds up to 500kW. GM and Chargepoint plan to open the stations “rapidly, with the locations deployed by the end of 2025.”Read Article >Dec 13, 2024Andrew J. HawkinsEVgo nabs $1.25 billion loan as Biden races to approve more EV spendingPhoto by Smith Collection/Gado/Getty ImagesThe US Department of Energy announced a $1.25 billion loan to electric vehicle charging company EVgo as the Biden administration races to finalize its spending on EVs before Donald Trump takes office. The money will fund EVgo’s plans to install approximately 7,500 chargers at roughly 1,100 charging stations across the US over the next five years, with a particular focus on fast-charging 350kW stalls that can charge two vehicles simultaneously.But more importantly, it shows how President Joe Biden is intent on doling out as much money for EV projects as he can before leaving office. Trump has promised to reverse or cancel much of the spending by Biden on EVs once he assumes office. He has said he will kill the $7,500 tax credit for new EV purchases and wipe out the rest of the spending from the Inflation Reduction Act (IRA) on EV charging infrastructure.Read Article >Dec 5, 2024Andrew J. HawkinsRivian opens up its charging network to other EVs for the first timeImage: RivianRivian’s latest EV charging station is the first to be open to other companies’ vehicles.The new station located in California’s Joshua Tree National Park will be the companies’ first that’s available to non-Rivian electric vehicles. The station features a new design, including larger displays with a tap-to-pay option, that can accommodate any car brands’ EVs.Read Article >Dec 4, 2024Umar ShakirNissan needs a little something extra to connect the Ariya to Tesla’s SuperchargersI’m sorry, I put that thing in what? Image: NissanNissan put out a tutorial video for Ariya owners today that shows how to use a Tesla NACS adapter with the vehicle, and it includes a step completely out of left field: shove a small piece of plastic into your car’s CCS port before you connect the adapter.The Ariya is Nissan’s first EV with a CCS port, and the automaker just activated the vehicle’s ability to connect to Tesla’s vast Supercharger network in October. Other manufacturers have also adopted Tesla’s NACS standard, with companies like Ford and Rivian already shipping adapters to current EV owners. But none of those EVs need you to take a confusing extra step to make the adapter work.Read Article >Dec 4, 2024Wes DavisGM and EVgo now have over 2,000 EV charging stalls and countingOne of the co-branded GM Energy / EVgo fast chargers. Image: General MotorsGeneral Motors and EV charging company EVgo announced that they’ve installed their 2,000th public EV charging stall, in Murrieta, California. With that, GM has met a deadline it set in September to have the bulk of its planned 2,850 DC fast-charging stalls set up by the end of this year.GM says the new station, which is near Interstate 215 in Riverside County, serves five 350kW fast chargers for as many as 10 EVs simultaneously. All of the new GM / EVgo stalls are populated with CCS chargers, EVgo communications director Katie Wallace told The Verge in an email. Wallace said the company is still testing Tesla’s NACS, which has emerged as the de facto standard over the last year and a half, before using it in charging stations:Read Article >Dec 4, 2024Andrew J. HawkinsA universal ‘Plug and Charge’ protocol for EV charging is coming in 2025Photo by Andrew J. Hawkins / The VergeThe fragmented and frustrating nature of our current EV charging landscape has been widely — and correctly — cited as one of the most significant barriers to EV adoption. Why buy a plug-in car when every time you plug it in, you have to sign up for another EV charging app, fumble through your payment information, authorize the account, and pray it results in a successful charging experience?What if you could instead plug in and everything just worked automatically? That’s the goal of a partnership between nonprofit SAE’s Industries Technology Consortia and a consortium of automakers and EV charging operators, along with the Biden administration’s Joint Office of Energy and Transportation, which just announced a new security framework for “universal Plug and Charge” that will be officially rolled out early next year.Read Article >Nov 26, 2024Umar ShakirElon Musk learns how EV charging works from Pete ButtigiegImage: Hugo Herrera / The VergeYou’d think Elon Musk, the CEO of Tesla and its wide-reaching Supercharger network, would already know about the workings of the federa"
