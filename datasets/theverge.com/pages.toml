["https://theverge.com/ai-artificial-intelligence"]
title = "Artificial Intelligence | The Verge"
description = "Artificial intelligence is more a part of our lives than ever before. While some might call it hype and compare it to NFTs or 3D TVs, generative AI is causing a sea change in nearly every part of the technology industry. OpenAI’s ChatGPT is still the best-known AI chatbot around, but with Google pushing Gemini, Microsoft building Copilot, and Apple adding its Intelligence to Siri, AI is probably going to be in the spotlight for a very long time. At The Verge, we’re exploring what might be possible with AI — and a lot of the bad stuff AI does, too."
full_description = "AIArtificial intelligence is more a part of our lives than ever before. While some might call it hype and compare it to NFTs or 3D TVs, generative AI is causing a sea change in nearly every part of the technology industry. OpenAI’s ChatGPT is still the best-known AI chatbot around, but with Google pushing Gemini, Microsoft building Copilot, and Apple adding its Intelligence to Siri, AI is probably going to be in the spotlight for a very long time. At The Verge, we’re exploring what might be possible with AI — and a lot of the bad stuff AI does, too.Samsung reveals Galaxy A56 with more AI and a modest spec bumpThe new line of A-series devices has slightly larger screens and a bigger emphasis on AI image editing tools.Emma RothTwo hours agoFrom ChatGPT to Gemini: how AI is rewriting the internetHow we use the internet is changing fast thanks to the advancement of AI-powered chatbots that can find information and redeliver it as a simple conversation.Verge StaffMar 1Latest In AIWExternal LinkWes DavisMar 1LinkCall centers are using AI for “accent translation.”Call center firm Teleperformance SE is rolling out an artificial intelligence system that “softens English-speaking Indian workers’ accents in real time,” aiming to “make them more understandable,” reports Bloomberg.The company wouldn’t disclose which clients use the tech, Bloomberg writes. The article notes that Teleperformance’s call center and content moderation clients include Apple, Samsung Electronics, and TikTok.Teleperformance Uses AI to Make Staff Sound Less Indian[bloomberg.com]WExternal LinkWes DavisMar 1LinkTinkerers got the Humane AI Pin working again.Wired chronicles a Discord community’s work to unbrick the AI gadget after HP bought Humane.But their work involved unsanctioned use of an internal access certificate, endangering an official effort to give the access they were after, an anonymous Humane employee told the outlet. Wired writes:Employees at Humane were in the process of going through the proper channels to put out an OTA that would give people access without compromising IP rights. Now, that process might be stalled.The Humane Ai Pin Has Already Been Brought Back to Life[wired.com]NewsNewsAll of the announcements from Amazon’s Alexa Plus eventTodd HaseltonMar 1CommentsComment Icon BubbleCommand LineCommand LineGoogle’s co-founder tells AI staff to stop ‘building nanny products’Alex HeathFeb 28CommentsComment Icon BubbleUExternal LinkUmar ShakirFeb 28LinkGoogle Gemini is now remembering things for free.Last year, the AI chatbot gained the ability to personalize responses for you based on your personal preferences, but only if you were a paying Gemini Advanced member. As reported by 9to5Google, the “Saved Info” feature has started rolling out to some free users.Gemini ‘Saved info’ is the latest Advanced feature to go free, rolling out[9to5google.com]JTwitterJess WeatherbedFeb 28LinkSora launches in Europe.The AI video generator can only be accessed by users who are subscribed to ChatGPT’s Plus ($20/£20 per month) or Pro ($200/£200 per month) tiers. Sora being rolled out to the UK comes as creatives in the country are fighting against government plans to embrace generative AI by weakening copyright protections.JExternal LinkJay PetersFeb 28LinkA Canadian investigation into X’s AI training practices.“The investigation will focus on the platform’s compliance with federal privacy law with respect to its collection, use, and disclosure of Canadians’ personal information to train artificial intelligence models,” according to a statement from The Office of the Privacy Commissioner of Canada published by Reuters.Canada's privacy watchdog probing X's use of personal data in AI models' training[reuters.com]NewsNewsMeta’s AI chatbot will soon have a standalone appEmma RothFeb 27CommentsComment Icon BubbleNewsNewsMicrosoft releases a Copilot app for MacTom WarrenFeb 27CommentsComment Icon BubbleNewsNewsOpenAI announces GPT-4.5, warns it’s not a frontier AI modelTom Warren and Emma RothFeb 27CommentsComment Icon BubbleNewsNewsSesame is the first voice assistant I’ve ever wanted to talk to more than onceSean HollisterFeb 27CommentsComment Icon BubbleNotepadNotepadMicrosoft pushes ahead with AI in gamingTom WarrenFeb 27CommentsComment Icon BubbleTTwitterTom WarrenFeb 27LinkHappy GPT-4.5 day to those who celebrate.We knew OpenAI’s GPT-4.5 launch was imminent, and now it has cheekily revealed a live stream is due at 3PM ET today. “Livestream in 4.5 hours,” said OpenAI in a post on X, seemingly confirming references to GPT-4.5 that have been spotted on ChatGPT this week.TTom WarrenFeb 27LinkMicrosoft’s Copilot can help you pirate Windows 11.Redditors have discovered that Copilot will recommend a script to permanently activate copies of Windows and Office. It’s a method that’s been available for a couple of years now, but it’s certainly amusing to see Copilot offer up the exact detailed steps.AIAIChip race: Microsoft, Meta, Google, and Nvidia battle it out for AI chip supremacyVerge StaffFeb 26CommentsComment Icon BubbleTTom WarrenFeb 26LinkMicrosoft launches next-gen Phi AI models.Phi-4-multimodal and Phi-4-mini are Microsoft’s latest small language models, both launching on Azure AI Foundry and Hugging Face today. Phi-4-multimodal improves speech recognition, translation, summarization, audio understanding, and image analysis. Phi-4-mini is designed for speed and efficiency situations, and both can be used by developers on smartphones, PCs, and cars.Image: MicrosoftNewsNewsAmazon is launching Alexa.com and new app for Alexa PlusJay PetersFeb 26CommentsComment Icon BubbleNewsNewsAlexa Plus’ AI upgrades cost $19.99, but it’s all free with PrimeAndrew LiszewskiFeb 26CommentsComment Icon BubbleTExternal LinkTom WarrenFeb 26LinkOpenAI’s GPT-4.5 launch is imminent.I reported last week that OpenAI was targeting a release of GPT-4.5 by the end of February, and it looks like it’s about to happen. Reddit posters have discovered references to GPT-4.5, codenamed Orion, in the Android version of ChatGPT. I’ve also heard from one source familiar with OpenAI’s plans that the GPT-4.5 launch should be going ahead today.GPT 4.5 is here[reddit.com]NewsNewsAmazon announces AI-powered Alexa PlusWes DavisFeb 26CommentsComment Icon BubbleNewsNewsAmazon Alexa event live blog: all the news from the keynoteTodd Haselton, Jennifer Pattison Tuohy and 1 moreFeb 26CommentsComment Icon BubbleChatGPT is a terrible, fascinating, and thrilling to-do list appInside this chatbot is an assistant that can remember and do stuff for you. Sometimes.David PierceFeb 26CommentsComment Icon BubbleJJay PetersFeb 25LinkAnthropic’s Claude AI is playing Pokémon.As I write this, it’s hunting a Mankey outside of Viridian City in Pokémon Red. It’s using the new Claude 3.7 Sonnet “hybrid reasoning model” and shows its thinking in a side window.The stream is less interesting and slower-paced than the original Twitch Plays Pokémon. But it’s fun to see Claude’s thinking process, especially when some of it has mirrored my own while playing Pokémon games.Update: Claude is playing Pokémon Red; I initially missed that in the Twitch description.JJay PetersFeb 25LinkOpenAI is rolling out a free version of its Advanced Voice mode.This free version will be powered by GPT-4o mini instead of GPT-4o. “The natural conversation pace and tone are similar to the GPT-4o version while being more cost effective to serve,” OpenAI says on X.JTwitterJay PetersFeb 25LinkOpenAI’s Deep Research is rolling out to ChatGPT Plus.That means subscribers to OpenAI’s $20 per month tier can try it instead of having to cough up for the $200 per month Pro tier. The feature is rolling out to Team, Edu, and Enterprise users, too, OpenAI says.RRichard LawlerFeb 25LinkPew Research poll asks what workers are doing with AI chatbots.Responses from 5,273 employed adults in the US show that 52 percent are worried about the use of AI in the workplace. People who reported using AI were more likely to say they believe it will affect future job opportunities, whether saying it would lead to fewer (42 percent) or more (15 percent), compared to 32 and 6 overall, respectively. The most common uses? Doing research or editing written content.You can read the full breakdown right here, including questions and methodology.Responses to Pew Research survey about the most common uses for AI chatbots at work, and where they rated the tools as extremely helpful. Image: Pew Research CenterNewsNewsMicrosoft makes Copilot Voice and Think Deeper free with unlimited useTom WarrenFeb 25CommentsComment Icon BubbleNewsNewsChegg sues Google over AI OverviewsSheena VasaniFeb 25CommentsComment Icon BubbleNewsNewsUK newspapers blanket their covers to protest loss of AI protectionsJess WeatherbedFeb 25CommentsComment Icon BubbleNewsNewsTrello’s new update helps you manage Slack, email, and everything elseDavid PierceFeb 25CommentsComment Icon BubbleNewsNewsGoogle Gemini’s AI coding tool is now free for individual usersJess WeatherbedFeb 25CommentsComment Icon BubbleDDominic PrestonFeb 25LinkKate Bush covers John Cage.She’s one of over 1,000 musicians, including Damon Albarn, Annie Lennox, and Hans Zimmer, who’ve put their names behind an album protesting UK AI policy. Each of the 12 tracks is a recording of an empty studio or performance space.The UK government is today closing a consultation on proposed changes to copyright law that would give AI companies the right to train on copyrighted works unless rights holders opt out.WExternal LinkWes DavisFeb 24LinkGoogle charges 50 cents per second to use its Veo 2 AI video generator.That’s according to Google’s AI tool pricing tables, which it recently updated to include the early-access Veo 2 model.As TechCrunch notes, that rate adds up to $30 per minute or $1,800 for an hour of AI-made video — far more than the $200-per-month subscription fee for OpenAI’s Sora.Vertex AI Pricing | Generative AI | Google Cloud[cloud.google.com]NewsNewsAnthropic’s new ‘hybrid reasoning’ AI model is its smartest yetAlex HeathFeb 24CommentsComment Icon BubbleVimeo CEO Philip Moyer is betting on the human touch — and AIAI tools are here to stay, Moyer says, but Vimeo wants to build on ‘authenticity.’Nilay PatelFeb 24CommentsComment Icon BubbleAppleAppleApple gets into AI: all the news on iOS 18, macOS Sequoia, and moreVerge StaffFeb 24CommentsComment Icon BubbleNewsNewsGrok blocked results saying Musk and Trump ‘spread misinformation’Wes DavisFeb 23CommentsComment Icon BubbleWWes DavisFeb 23LinkApple may be preparing Gemini integration in Apple Intelligence.Apple has introduced code referencing “Google” as a third-party model choice for Apple Intelligence to leverage, according to a backend change spotted by Aaron Perris, who often shares info gleaned from Apple firmware code, following the release of the first iOS 18.4 beta last week.Apple executive Craig Federighi specifically named Gemini when he suggested last year that Apple Intelligence could leverage more third-party AI models than just ChatGPT, as 9to5Mac notes.Google appears as a third-party choice in Perris’ screenshot. Screenshot: XNewsNewsElon Musk’s AI said he and Trump deserve the death penaltyJay PetersFeb 22CommentsComment Icon BubbleCommand LineCommand LineGrok resets the AI raceAlex HeathFeb 21CommentsComment Icon BubblePaginationPage 1 of 15NextMost PopularMost PopularGoogle’s co-founder tells AI staff to stop ‘building nanny products’With Alexa Plus, Amazon finally reinvents its best productAMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thMicrosoft is shutting down Skype in favor of TeamsThe armless PP-1 turntable is made from a solid block of aluminumInstallerA weekly newsletter by David Pierce designed to tell you everything you need to download, watch, read, listen to, and explore that fits in The Verge’s universe.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
