description = "Once a modest online seller of books, Amazon is now one of the largest companies in the world, and its former CEO, Jeff Bezos, is the world’s most wealthy person. We track developments, both of Bezos and Amazon, its growth as a video producer, the popular Prime service, as well as its own hardware, which includes the Amazon Kindle e-reader, Amazon Kindle Fire tablets, and Amazon Fire TV streaming boxes."
full_description = "AmazonOnce a modest online seller of books, Amazon is now one of the largest companies in the world, and its former CEO, Jeff Bezos, is the world’s most wealthy person. We track developments, both of Bezos and Amazon, its growth as a video producer, the popular Prime service, as well as its own hardware, which includes the Amazon Kindle e-reader, Amazon Kindle Fire tablets, and Amazon Fire TV streaming boxes.0DealsDealsAmazon’s latest Fire TV Stick 4K Max is more than 30 percent off right nowSheena Vasani and Brandon WidderMar 1CommentsComment Icon BubbleWith Alexa Plus, Amazon finally reinvents its best product﻿The new voice assistant has been a long time coming, but it won’t get here all at once.Jennifer Pattison TuohyMar 1CommentsComment Icon BubbleCommand LineCommand LineGoogle’s co-founder tells AI staff to stop ‘building nanny products’Alex HeathFeb 28CommentsComment Icon BubbleEExternal LinkEmma RothFeb 28LinkAmazon’s Wondery podcast studio is laying off workers.In a statement to Reuters, Amazon spokesperson Alice Zou said the layoffs impact a “small number of roles” without offering any specifics. Amazon acquired Wondery in 2020, which has produced podcasts like New Heights with Jason & Travis Kelce and Dr. Death.Amazon's Wondery podcast unit trims jobs[reuters.com]JTikTokJennifer Pattison TuohyFeb 28LinkAlexa Plus is much easier to chat with.I grabbed a few minutes with the new Alexa at Amazon’s event and was impressed. Gone is the need for “Alexa speak.” Instead, I created a morning wake-up routine just by talking about what I wanted, and controlled several smart home devices without knowing their names or locations.Of all the new features Amazon announced for the voice assistant, talking to Alexa and having it reliably understand you is easily the biggest improvement.VergecastVergecastThe high stakes for AI AlexaDavid PierceFeb 28CommentsComment Icon BubbleE-Reader ReviewsE-Reader ReviewsThe best ebook reader to buy right nowSheena VasaniFeb 28CommentsComment Icon BubbleNewsNewsAmazon CEO says ‘beautiful’ new Alexa hardware is coming this fallEmma RothFeb 27CommentsComment Icon BubbleNewsNewsHands-on with Alexa Plus in the smart homeJennifer Pattison TuohyFeb 27CommentsComment Icon BubbleNewsNewsAmazon says its new quantum computing chip will make error correction more efficientEmma RothFeb 27CommentsComment Icon BubbleAIAIChip race: Microsoft, Meta, Google, and Nvidia battle it out for AI chip supremacyVerge StaffFeb 26CommentsComment Icon BubbleNewsNewsAlexa Plus leaves behind Amazon’s earliest Echo devicesWes DavisFeb 26CommentsComment Icon BubbleNewsNewsAmazon is launching Alexa.com and new app for Alexa PlusJay PetersFeb 26CommentsComment Icon BubbleNewsNewsAlexa Plus’ AI upgrades cost $19.99, but it’s all free with PrimeAndrew LiszewskiFeb 26CommentsComment Icon BubbleTTodd HaseltonFeb 26LinkWe can’t try Alexa Plus ourselves in the demo area.We’re down on the demo floor now, and we were hoping to try out the new AI-powered assistant. There are six rooms, one with a Fire TV and the rest with Echo Show 21 screens. But all the demos are being run by Amazon reps.BBrandon WidderFeb 26LinkAlexa engagement continues to grow.That’s according to Amazon’s new devices and service chief Panos Panay, who just took the stage at Amazon’s big Alexa event in New York City.The engagement metrics he’s referencing are a little unclear, but he says customers used Amazon’s virtual assistant 20 percent more in 2024 than they did in 2023.Image: Chris Welch / The VergeNewsNewsAmazon announces AI-powered Alexa PlusWes DavisFeb 26CommentsComment Icon BubbleNewsNewsAmazon Alexa event live blog: all the news from the keynoteTodd Haselton, Jennifer Pattison Tuohy and 1 moreFeb 26CommentsComment Icon BubbleJJennifer Pattison TuohyFeb 26LinkWe’re on the ground at Amazon’s event.The show is set to start at 10AM ET. We’re in a (chilly) line outside, waiting to get live blogging. Follow along for all the big announcements.Image: Jen Tuohy / The VergeWhat to expect from Amazon’s big Alexa event this weekA smarter Alexa, new Echo hardware, and a lot of Panos Panay. We’re pumped!Jennifer Pattison TuohyFeb 24CommentsComment Icon BubbleCExternal LinkCharles Pulliam-MooreFeb 20LinkAmazon might have spent another $1 billion for James Bond.Money was the obviously part of what convinced Barbara Broccoli and Michael G. Wilson to give Amazon complete creative control over the James Bond franchise after years of telling the studio to kick rocks. None of the involved parties have disclosed exactly how much cash it took to secure the deal, but Deadline is pretty sure 007 wound up costing Amazon a cool $1 billion — that’s in addition to the $8.5 billion Amazon already spent acquiring MGM.Amazon MGM Studios Shelled Out An Extra $1 Billion-Plus To Take Control Of James Bond: What’s Next For The Franchise[deadline.com]NewsNewsAdidas plugs its website and app into Amazon’s ‘Buy with Prime’ programAntonio G. Di BenedettoFeb 20CommentsComment Icon Bubble0DealsDealsHere are the best Kindle deals right nowSheena VasaniFeb 20CommentsComment Icon BubbleNewsNewsAmazon’s Appstore is pulling Android supportJess WeatherbedFeb 20CommentsComment Icon BubbleNewsNewsAmazon now has creative control over the James Bond franchiseCharles Pulliam-MooreFeb 20CommentsComment Icon BubbleNewsNewsRing’s new security camera supports 2K video out of the boxAndrew LiszewskiFeb 20CommentsComment Icon BubbleJExternal LinkJay PetersFeb 20LinkA death knell for Chime.Amazon announced today that it’s ending support for its Amazon Chime service for business calls and meetings. The company is no longer accepting new customers for Chime, and you won’t be able to host meetings after February 20th, 2026.Update on Support for Amazon Chime | Amazon Web Services[aws.amazon.com]NewsNewsEero announces its new Wi-Fi 7 line-upWes DavisFeb 19CommentsComment Icon BubbleNewsNewsAmazon scraps its TikTok-style Inspire feedEmma RothFeb 18CommentsComment Icon Bubble0DealsDealsHere are the best streaming service deals available right nowSheena VasaniFeb 17CommentsComment Icon BubbleNewsNewsAmazon’s revamped Alexa might launch over a month after its announcement eventWes DavisFeb 15CommentsComment Icon BubbleNewsNewsAmazon’s killing a feature that let you download and backup Kindle booksAndrew LiszewskiFeb 14CommentsComment Icon BubbleRQuoteRichard LawlerFeb 14Link“Trump’s share of a $10 million settlement Elon Musk’s X agreed to this week is expected to go to him directly.”That’s just one line in this Wall Street Journal article detailing money flowing to the presidential family via crypto or other means. Another section highlights Melania Trump’s documentary pitch to Jeff Bezos and Lauren Sanchez during their December visit preceding Amazon’s $40 million deal that reportedly nearly tripled the next-closest offer.But if you wondered how that January 6th Twitter lawsuit got settled, we have an answer:The settlement talks with X began after the election and were more informal, with both Trump and Musk personally involved in hammering out the $10 million number, people familiar with the matter said.NewsNewsAmazon revamps Prime Video’s Apple TV appEmma RothFeb 13CommentsComment Icon BubbleNewsNewsAmazon has renewed The Rings of Power for a third seasonCharles Pulliam-MooreFeb 13CommentsComment Icon BubbleNewsNewsAmazon’s app will start listing items Amazon doesn’t sellJennifer Pattison TuohyFeb 12CommentsComment Icon BubbleZoox robotaxi hands-on: safe but laggingThe toaster-shaped vehicle made safe if conservative decisions and offered a relatively comfortable ride through Las Vegas.Abigail BassettFeb 11CommentsComment Icon BubbleCExternal LinkCharles Pulliam-MooreFeb 10LinkAmazon MGM’s Masters Of The Universe just keeps getting more real.It is still kind of hard to believe that Amazon MGM is producing a live-action Masters of the Universe movie starring Nicholas Galitzine as He-Man and Jared Leto as Skeletor. But it’s true, and Deadine reports that Morena Baccarin (Deadpool) and Jóhannes Haukur Jóhannesson (Vikings: Valhalla) have signed on to play The Sorceress of Castle Grayskull and Fisto, respectively.Amazon MGM Studios & Mattel’s ‘Masters Of The Universe’ Finds Its Sorceress & Fisto[deadline.com]NewsNewsRivian is now selling electric vans to anyone who wants oneAndrew J. HawkinsFeb 10CommentsComment Icon Bubble0GadgetsGadgetsThese retractable USB-C cables replaced everything else in my bagDavid PierceFeb 7CommentsComment Icon BubblePaginationPage 1 of 15NextMost PopularMost PopularGoogle’s co-founder tells AI staff to stop ‘building nanny products’With Alexa Plus, Amazon finally reinvents its best productAsus ROG Flow Z13 (2025) review: hold up, integrated graphics are good now?The armless PP-1 turntable is made from a solid block of aluminumAMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thInstallerA weekly newsletter by David Pierce designed to tell you everything you need to download, watch, read, listen to, and explore that fits in The Verge’s universe.Email (required)Sign UpBy submitting your email, you agree to our Terms and Privacy Notice. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.Advertiser Content FromThis is the title for the native ad"
