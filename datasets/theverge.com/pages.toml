full_description = "The VergeThe Verge logo.With Alexa Plus, Amazon finally reinvents its best product﻿The new voice assistant has been a long time coming, but it won’t get here all at once.Jennifer Pattison TuohyMar 1CommentsComment Icon BubbleTop Stories1What can a 100-pixel video teach us about storytelling around the world?Kristen RadtkeMar 1CommentsComment Icon BubbleWhat can a 100-pixel video teach us about storytelling around the world?Kristen RadtkeMar 1CommentsComment Icon Bubble2Asus ROG Flow Z13 (2025) review: hold up, integrated graphics are good now?Antonio G. Di BenedettoMar 1CommentsComment Icon BubbleAsus ROG Flow Z13 (2025) review: hold up, integrated graphics are good now?Antonio G. Di BenedettoMar 1CommentsComment Icon Bubble3Elon enters the circusGaby Del ValleFeb 28CommentsComment Icon BubbleElon enters the circusGaby Del ValleFeb 28CommentsComment Icon Bubble4Google’s co-founder tells AI staff to stop ‘building nanny products’Alex HeathFeb 28CommentsComment Icon BubbleGoogle’s co-founder tells AI staff to stop ‘building nanny products’Alex HeathFeb 28CommentsComment Icon Bubble5The Verge looks back on SkypeVerge StaffFeb 28CommentsComment Icon BubbleThe Verge looks back on SkypeVerge StaffFeb 28CommentsComment Icon BubbleToday’s StorystreamFeed refreshed Mar 1 It's all bangersNewsNewsSamsung reveals Galaxy A56 with more AI and a modest spec bumpEmma RothMar 1CommentsComment Icon BubbleNewsNewsMWC 2025: all the phones, gadgets, and commentary from BarcelonaVerge StaffMar 1CommentsComment Icon BubbleWWes DavisMar 1LinkWhatsApp’s latest Android beta brings emoji to video calls.Android Authority spotted that the latest WhatsApp Android beta now lets you raise your hand or send emoji reactions during a video call.Similar to a video call in Google Meet, the WhatsApp beta only presents a handful of options, like the thumbs-up emoji or heart emoji. Both the hand-raising option and emoji reactions are tucked behind the three-dots menu.WhatsApp is getting new emoji reactions. Screenshot: Android AuthorityAdvertiser Content FromThis is the title for the native ad8Verge ScoreAurzen Zip tri-fold projector review: mirror anything (without DRM)So easy to use you’ll take it everywhere, but it can’t stream services like Netflix or Amazon Prime.Thomas RickerFeb 28CommentsComment Icon BubbleWExternal LinkWes DavisMar 1LinkAlphabet packs its light-based Taara internet tech into a chip.In a new Project Taara blog post, Alphabet says it transmitted data at 10Gbps from one Taara chip to another, using only light beamed from the chip’s “hundreds” of software-controlled light emitters — an improvement on the mechanical beam-directing technique used by its traffic light-sized Taara Lightbridge.Derived from Alphabet’s failed balloon-based internet project, Project Taara could enable “10, if not 100 times more bandwidth” than a typical Starlink antenna, Taara lead Mahesh Krishnaswamy tells Wired.Google’s Taara Hopes to Usher in a New Era of Internet Powered by Light[wired.com]PolicyPolicyTrump’s first 100 days: all the news affecting the tech industryVerge StaffMar 1CommentsComment Icon BubbleMost PopularMost Popular1Google’s co-founder tells AI staff to stop ‘building nanny products’Alex HeathFeb 282With Alexa Plus, Amazon finally reinvents its best productJennifer Pattison TuohyMar 13Asus ROG Flow Z13 (2025) review: hold up, integrated graphics are good now?Antonio G. Di BenedettoMar 14The armless PP-1 turntable is made from a solid block of aluminumAndrew LiszewskiFeb 285AMD’s Radeon RX 9070 and 9070 XT start at $549, ship March 6thSean HollisterFeb 28WExternal LinkWes DavisMar 1LinkCall centers are using AI for “accent translation.”Call center firm Teleperformance SE is rolling out an artificial intelligence system that “softens English-speaking Indian workers’ accents in real time,” aiming to “make them more understandable,” reports Bloomberg.The company wouldn’t disclose which clients use the tech, Bloomberg writes. The article notes that Teleperformance’s call center and content moderation clients include Apple, Samsung Electronics, and TikTok.Teleperformance Uses AI to Make Staff Sound Less Indian[bloomberg.com]NewsNewsIkea registered a Matter-over-Thread temperature sensor with the FCCWes DavisMar 1CommentsComment Icon BubbleWWes DavisMar 1LinkNvidia issues a new hotfix for black screens.An Nvidia support page says the new hotfix (v572.65) drivers “are basically the same as the previous released version, with a small number of additional targeted fixes,” referring to issues with black screens on RTX 50 GPUs that drivers released earlier this week were also aimed at addressing.Nvidia announced the new hotfix on X this morning. Screenshot: XNewsNewsNew email tells federal employees to list recent accomplishments weeklyWes DavisMar 1CommentsComment Icon Bubble0DealsDealsAmazon’s latest Fire TV Stick 4K Max is more than 30 percent off right nowSheena Vasani and Brandon WidderMar 1CommentsComment Icon BubbleHow toHow toHow to find images in Google PhotosDavid NieldMar 1CommentsComment Icon BubbleJust For YouJust For YouWExternal LinkWes DavisMar 1LinkTinkerers got the Humane AI Pin working again.Wired chronicles a Discord community’s work to unbrick the AI gadget after HP bought Humane.But their work involved unsanctioned use of an internal access certificate, endangering an official effort to give the access they were after, an anonymous Humane employee told the outlet. Wired writes:Employees at Humane were in the process of going through the proper channels to put out an OTA that would give people access without compromising IP rights. Now, that process might be stalled.The Humane Ai Pin Has Already Been Brought Back to Life[wired.com]Games ReviewGames ReviewOne of my favorite pop albums is a video game — and now it’s on the PS5Andrew WebsterMar 1CommentsComment Icon BubbleNewsNewsAll of the announcements from Amazon’s Alexa Plus eventTodd HaseltonMar 1CommentsComment Icon BubbleNewsNewsMozilla is already revising its new Firefox terms to clarify how it handles user dataJay PetersMar 1CommentsComment Icon BubbleTechTechZapier says someone broke into its code repositories and may have accessed customer dataJay PetersFeb 28CommentsComment Icon BubbleEExternal LinkEmma RothFeb 28LinkAmazon’s Wondery podcast studio is laying off workers.In a statement to Reuters, Amazon spokesperson Alice Zou said the layoffs impact a “small number of roles” without offering any specifics. Amazon acquired Wondery in 2020, which has produced podcasts like New Heights with Jason & Travis Kelce and Dr. Death.Amazon's Wondery podcast unit trims jobs[reuters.com]TechTechSee all Tech‘We’re nowhere near done with Framework Laptop 16’ says Framework CEOSean HollisterFeb 26Samsung’s first Pro series Gen 5 PCIe SSD arrives in MarchQuentyn KennemerFeb 26CommentsComment Icon BubbleSamsung reveals Galaxy A56 with more AI and a modest spec bumpEmma RothMar 1CommentsComment Icon BubbleJYoutubeJay PetersFeb 28LinkMore Questing.Apple debuted a trailer today for Side Quest, the upcoming four-episode anthology series based off of Mythic Quest. I bounced off Mythic Quest after season 2, but I liked the episodes that were separate from the main plot line. Hopefully this series channels those.All four Side Quest episodes will be available on Apple TV Plus on March 26th, the same day as the finale of the current Mythic Quest season.PolicyPolicyThe UK will neither confirm nor deny that it’s killing encryptionJess WeatherbedFeb 28CommentsComment Icon BubbleJExternal LinkJay PetersFeb 28LinkMore Washington Post cancellations.Following owner Jeff Bezos’ opinion section changes, the Post has lost more than 75,000 digital subscribers, NPR reports. More than 300,000 subscribers canceled their subscriptions between when Bezos reportedly killed the paper’s Kamala Harris endorsement and Election Day, NPR says.Bezos' changes at 'Washington Post' lead to mass subscription cancellations — again[npr.org]NewsNewsThe armless PP-1 turntable is made from a solid block of aluminumAndrew LiszewskiFeb 28CommentsComment Icon BubbleJJay PetersFeb 28LinkNintendo Switch Online’s first delisting.Super Formation Soccer is being pulled from the service on March 28th, a Japanese Nintendo support account announced. The game, which seems to be owned by Spike Chunsoft and goes by Super Soccer in the US and Europe, will be removed from NSO worldwide, too, Nintendo Everything reports.Update: Added that the game will reportedly be removed worldwide.NewsNewsTesla Superchargers coming to dozens of Steak ‘n Shake locationsAndrew J. HawkinsFeb 28CommentsComment Icon BubblePodcastsPodcastsSee all Podcasts1The high stakes for AI AlexaDavid PierceFeb 28CommentsComment Icon Bubble2Understanding Elon Musk’s polarizing ascent in the MAGA movementAlex HeathFeb 27CommentsComment Icon Bubble3We can’t quit electric cars — or robotaxisDavid PierceFeb 25CommentsComment Icon Bubble4Vimeo CEO Philip Moyer is betting on the human touch — and AINilay PatelFeb 24CommentsComment Icon Bubble5The ups and downs of the iPhone 16EDavid PierceFeb 21CommentsComment Icon BubbleCold Wallet’s director wanted to make a revenge thriller for the crypto eraDirector Cutter Hodierne’s new film, Cold Wallet, is a parable about how the house almost always wins.Charles Pulliam-MooreFeb 28CommentsComment Icon BubbleJExternal LinkJay PetersFeb 28LinkAudit Me!It’s tax season, so naturally, H&R Block is launching Roblox experiences within two other Roblox games, Mega Mansion Tycoon and Club Roblox. When you’re done seeing those, you can try Turbotax’s games in Fortnite.What a wonderful time of year.H&R Block Brings Taxes to the Gaming World with Immersive Roblox Experience[globenewswire.com]CYoutubeCharles Pulliam-MooreFeb 28LinkPretty pretty please, let this magical girl pilot get a series order.Kiana Khansmith’s (Big City Greens) Pretty Pretty Please I Don’t Want to be a Magical Girl isn’t a fledged show just yet, but her new pilot introducing Aika (Anairis Quiñones), Zira (Bennett Abara), and Hoshi (Christine Marie Cabanos) is concrete evidence that it absolutely needs to be.UExternal LinkUmar ShakirFeb 28LinkGoogle Gemini is now remembering things for free.Last year, the AI chatbot gained the ability to personalize responses for you based on your personal preferences, but only if you were a paying Gemini Advanced member. As reported by 9to5Google, the “Saved Info” feature has started rolling out to some free users.Gemini ‘Saved info’ is the latest Advanced feature to go free, rolling out[9to5google.com]NewsNewsDOGE wants to lay off the ‘vast majority’ of CFPB workers, employees sayLauren FeinerFeb 28CommentsComment Icon BubbleEEmma RothFeb 28LinkWindows 11 tests putting an emoji button in the taskbar.The new button opens up a panel where you can quickly access emoji and GIFs, similar to what you can already do with the Win + . keyboard shortcut.Microsoft is also testing the ability to trim screen recordings with the Snipping Tool. The changes are rolling out now to the Beta Channel in Preview Build 22635.5015.Image: MicrosoftScienceScienceSee all ScienceSpaceX thinks it knows why Starship exploded on its last test flightAndrew LiszewskiFeb 24Donald Trump broke the law by removing climate change references from USDA websites, lawsuit allegesJustine CalmaFeb 25CommentsComment Icon BubbleAll the news about EV charging in the USVerge StaffFeb 28CommentsComment Icon BubbleSteam’s Next Fest is full of weird-ass, cool-ass gamesA sampling of the kinds of cool games on offer during Steam’s Next Fest 2025.Ash ParrishFeb 28CommentsComment Icon BubbleNewsNewsMozilla says its new Firefox terms don’t give it ownership of your dataJay PetersFeb 28CommentsComment Icon BubbleNewsNewsEVgo says no to fast-charging extension cables and breakaway adaptersUmar ShakirFeb 28CommentsComment Icon Bubble0DealsDealsApple’s AirTags are on sale for their best price to dateQuentyn KennemerFeb 28CommentsComment Icon Bu