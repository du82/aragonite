["https://theverge.com/23350899/nintendo-switch-controllers-best-wireless-joy-con-gamepad"]
title = "The best Nintendo Switch controllers for 2025 | The Verge"
description = "We highlight standouts from Nintendo, GuliKit, and 8BitDo, plus a couple of Joy-Con alternatives and a dongle for connecting Xbox and PlayStation gamepads."
full_description = "Entertainment /GamingThe best Nintendo Switch controllers to buy right nowOur picks include official pro-style controllers and Joy-Con alternatives, along with a dongle for connecting Xbox and PlayStation gamepads.Our picks include official pro-style controllers and Joy-Con alternatives, along with a dongle for connecting Xbox and PlayStation gamepads.by Quentyn Kennemer and Cameron FaulknerPhotography by Amelia Holowaty KralesUpdated Feb 28, 2025, 5:15 PM UTCLinkFacebookThreadsIf you buy something from a Verge link, Vox Media may earn a commission. See our ethics statement.Image: Cath Virginia / The VergeThe best Nintendo Switch controllers aren’t the ones that come with it. While the removable Joy-Cons included with all non-Lite Switch consoles are convenient given they can be detached for wireless use, their tiny contourless design isn’t that comfortable for long gaming sessions or large hands. And while Nintendo has taken steps to address the dreaded Joy-Con drift and earlier quality control problems, some issues persist.In this articleThe best Nintendo Switch controller for TV modeThe best Switch controller for handheld modeThe best Xbox-style controller for the SwitchA Switch controller for PC and Steam DeckA well-rounded Switch controller that looks like a DualShockAn adapter that lets you use your own controllersOther Switch controllers we testedWhat’s coming next?In this buying guide, we focus on wireless controllers that are both comfortable and reliable, as well as a few options that come with unique features designed to match your play style. We’re not covering wired controllers that plug into the Switch’s dock, as they’re almost all the same and don’t offer substantial savings in many cases. (PowerA and PDP make decent ones that will do in a pinch, but they’re very basic. Unless you detest recharging your controllers, it makes more sense to go wireless.)Also, if you buy a third-party wireless controller (as in, one not made by Nintendo), there are certain things that it likely won’t be able to do unless otherwise noted:It won’t have HD rumble. This is what Nintendo calls its advanced haptic feedback, which is more precise than that of many third-party controllers and more akin to Sony’s haptics engine in its subtlety. That said, some more limited rumble may be present. Many third-party Switch controllers don’t have motion controls for gestures or gyroscopic aiming in games that support it, though more options are starting to implement the latter feature with varying degrees of quality.Most non-Nintendo options lack an NFC reader for Amiibo cards or figurines, which unlock special features in some games. Most third-party options won’t be able to turn on the Switch remotely. (You’ll have to manually press the console’s power button.) While some Switch controllers have 3.5mm headphone jacks, getting audio out of them can only happen through a wired USB connection, not wirelessly. For most people, pairing Bluetooth headphones to your Switch is a sufficient (and very easy) workaround.If you’re playing your Switch while docked, it’s hard to go wrong with the official Nintendo Switch Pro Controller. It’s the only traditional gamepad that checks all the boxes above — minus the 3.5mm audio jack — and it’s one of the most satisfying controllers we’ve tested. The GuliKit KingKong 3 Pro and Max, meanwhile, make for great Xbox-style controllers with exhaustive customization, while the Hori Split Pad Pro is great for those who prefer to play in handheld mode. Then there’s 8BitDo’s PC-friendly Ultimate Bluetooth Controller and DualShock-esque Pro 2 controller, both of which are well worth a look.What we’re looking forHow we test Nintendo Switch controllersCollapseWe test Nintendo Switch controllers by playing with them with a standard grip — the same way most gamers do. We test how easy they are to connect to the Switch and other compatible platforms, as well as how reliably they stay connected. Then, we jump into a game. Since some controllers are better suited to specific genres than others, we try a variety of titles, including fighting games like Super Smash Bros. Ultimate, racers like Mario Kart 8 Deluxe, and shooters like Overwatch 2. We pay attention to how buttons, triggers, analog sticks, and the D-pad feel, noting whether any of them feel mushy or stiff. For controllers that support sensitivity customization, we note how easy it is to make these adjustments and how they feel compared to their default settings.ConnectivityCollapseDoes it support Bluetooth? Can you use it in wired mode? Are there alternate wireless modes, such as 2.4GHz?QualityCollapseDo the buttons, sticks, and triggers feel good and sturdy? Does the controller have a satisfying, well-balanced weight? Does it use premium materials for the casing and grips? Any connection issues or glitches?Extra featuresCollapseAre there rear-facing buttons? Does it support macros? Can you use it on multiple platforms?CustomizationCollapseCan you remap buttons? Is there software support for tweaking controller settings? Does it have interchangeable buttons or sticks? Can you fine-tune vibration and sensitivity?ValueCollapseIs it priced fairly? Are the features and quality worth the money?The best Nintendo Switch controller for TV modeNintendo Switch Pro Controller$54$6922% off$54The GoodHigh quality, sturdy buildSupports HD rumble, gyro motion, and NFCLong battery lifeMobile and PC compatibilityThe BadOn the pricier side$54 at Walmart$70 at Best Buy$70 at TargetHow we rate and review productsSupported platforms: Nintendo Switch, PC, Steam Deck, mobile, Apple TV / Connectivity: Bluetooth, wired / Connector type: USB-C / Mappable rear buttons: No / Software customization: No / Rumble: Yes, HD / NFC: Yes / Motion: Yes / Power: Built-in rechargeable / Console Wakeup: YesNearly eight years down the road, Nintendo’s first-party Pro controller is still the best gamepad for the Switch. It launched alongside the console in 2017 as a more traditional alternative to Nintendo’s quirky Joy-Cons, and in many ways, it rivals the standard models from Sony and Microsoft in terms of comfort and build quality.RelatedSwitch 2: all the news and rumors on Nintendo’s next consoleNintendo says the Switch successor will be compatible with Switch gamesNintendo finally made its own Joy-Con controller charging stationAside from the Joy-Cons, the Switch Pro Controller is the only wireless option that includes HD rumble, gyroscopic movement support, and an NFC reader for Amiibo cards and figurines. It’s also the only controller we’ve tested (again, aside from the Joy-Cons) that can power on the Switch without being plugged into it. The gamepad is built like a tank, and its battery life is so good that it sometimes seems like it’ll never run out. Nintendo says that it lasts around 40 hours per charge, so it’ll likely take casual gamers a long time to run down the battery.Photo: James Bareham / The VergeThe buttons and triggers have a satisfying bounce, while its directional pad is responsive and clicky enough to satisfy retro gamers. The controller charges via USB-C, just like the Switch, and it’s compatible with a slew of other platforms you might game on, including PC, Android, and SteamOS. It also works with Apple devices thanks to its compatibility with the latest versions of iOS, macOS, and even tvOS and visionOS.Given the price, we wish that it had other features, like programmable buttons or a 3.5mm headphone jack for audio, even if wireless audio transmission from the Switch to a controller isn’t currently possible. (At least you can connect a pair of wireless headphones via Bluetooth, but only if you have no more than two controllers connected to your Switch at once.)The best Switch controller for handheld modeHori Split Pad Pro$50$500% off$50The GoodBetter ergonomics than Joy-ConsAdds rear buttonsUsable as a wired controller with attachment setThe BadLacks motion, NFC, and rumbleCan’t use wirelesslySize is clunky for travel$50 at Walmart$50 at Best Buy$50 at AmazonHow we rate and review productsSupported Platforms: Switch / Connectivity: Wired / Connector type: Joy-Con slots / Mappable rear buttons: Yes / Software customization: No / Rumble: No / NFC: No / Motion: No / Power: via Joy-Con slots / Console Wakeup: NoI’m sure there are some people who enjoy using Joy-Con controllers, but kids and small-handed folks aside, most people probably wouldn’t say they’re the most comfortable option. That’s where the Hori Split Pad Pro comes in.RelatedEchoes of Wisdom wants you to fight like a warrior and think like a princessNintendo shares more info on its Switch 2 directThe Split Pad Pro comes in a variety of colorways, and it both looks and feels like a Switch Pro Controller that’s split in half. One-half slides into each side of the Switch console like Joy-Cons, but unlike Nintendo’s default controllers, Hori’s gamepad features big, easy-to-reach buttons and generously sized triggers and analog sticks, all of which feel great in play. It also provides a lot of grip, which is particularly useful for people who need to get a better handle on the console for fast gameplay or stay comfy over longer play sessions.The Split Pad Pro fits in your Switch’s Joy-Con slots and doubles as a standalone controller with the optional attachment set. Photo: Cameron Faulkner / The VergeThe Split Pad Pro doesn’t have batteries or sensors — not to mention support for rumble, motion, IR, or NFC — so it’s completely useless when detached from the Switch. It’s only for handheld mode unless you purchase the Split Pad Pro Attachment that turns it into a wired controller. We don’t recommend most people go that route since the attachment alone costs more than a Switch Pro Controller, which is a shame considering it doesn’t try to add any of the aforementioned elements (it does add a 3.5mm headphone jack, however).The company also sells the Split Pad Compact, which is a smaller version of the Split Pad Pro that costs $50 (you can also get it with an Attachment Set for $79.99). It might be worth a look if you want something as functional as the Split Pad Pro but closer in size to a Joy-Con.Read our Hori Split Pad Pro review.The best Xbox-style controller for the SwitchGuliKit KingKong 3$60$60The GoodGreat ergonomics with Xbox-style shapeDeep customization optionsHall effect sticks and triggersSupports HD rumble, NFC, and motionWide platform compatibilityThe BadLacks companion app for customizations$60 at Amazon (Pro)$80 at Amazon (Max)How we rate and review productsSupported Platforms: Switch, PC, Steam Deck, mobile, Apple TV / Connectivity: Bluetooth, wired / Connector type: USB-C / Mappable rear buttons: Yes / Software customization: No / Rumble: Yes / NFC: Yes / Motion: Yes / Power: Built-in rechargeable / Console Wakeup: YesOn the surface, the GuliKit KingKong 3 Pro and KingKong 3 Max are similar to the last-gen models they replaced, which took design cues from Microsoft’s standard Xbox controller but rivaled the Switch Pro Controller in terms of build quality and features. We tested them on the Nintendo Switch, PC, and mobile, but you can also use them with other Bluetooth devices, including the Steam Deck and Apple TV 4K.RelatedThe best Xbox controller to buy right nowScuf’s Valor Pro is a promising start for its Hall effect Xbox controllersBut there are several notable improvements and additions if you scratch deeper. They each have Hall effect dual-mode triggers (both can switch between analog and digital, but the KK3 Max exclusively adds physical trigger stops), in addition to RGB-surrounded Hall effect analog sticks. It should make them virtually impervious to drifting and waning responsiveness, as iFixit explains here. They each have GuliKit’s powerful magnetic vibration motors with two intensity levels and three distinct modes (including the Switch’s HD rumble). You can even customize the hot-swappable face buttons to match your preferred platform, and to the delight of tournament players, you can play with a 1,000Hz polling rate for reduced input lag on PC (wired or wireless via a dongle).Additionally, both controllers now feature detachable rear-facing buttons. You get two metal moon-shaped paddles with the KK3 Pro that protrude further from the controller than the extra four you get with the KK3 Max, which are longer and curved to match the contour of the controllers’ rear grips. The latter are similar to the paddles on the Xbox Elite Series 2 and even borrow the same installation technique — just push them into the designated holes on the back. They require a lot more force, though they also won’t easily dislodge. GuliKit’s newest Switch controllers offer ample customization. Photo: Quentyn Kennemer / The VergeThe longer paddles are comfortably reachable once installed, but if you have larger hands, you may need to make adjustments for the shorter protruding variety. They only need a light tap, but since they occupy the space where your fingers usually rest, it can lead to increased misfires while gaming. You can map each back button to emulate any other button on the controller — including the rear triggers — but you can’t configure them to execute combo presses or macros.In summary, the KK3 Pro and KK3 Max offer a lot. In fact, there may be no better option for interoperability and value in a single multiplatform controller right now. If we’re nitpicking, our biggest gripe is that GuliKit still hasn’t created an app to manage all of it more easily.A Switch controller for PC and Steam Deck8BitDo Ultimate Bluetooth Controller$53$7024% off$53The GoodErgonomically similar to the Switch Pro controllerUses GuliKit Hall effect sticksWirelessly compatible with mobile and PCExcellent companion appThe BadLacks NFCBattery life falls short of Nintendo’s official gamepad$53 at Amazon$55 at 8BitDo$56 at Best BuyHow we rate and review productsSupported Platforms: Switch, PC, Steam Deck, mobile, Apple TV / Connectivity: 2.4GHz, Bluetooth, wired / Connector type: USB-C / Mappable rear buttons: Yes / Software customization: Yes / Rumble: Yes / NFC: No / Motion: Yes / Power: Built-in rechargeable / Console Wakeup: No8BitDo’s Ultimate Bluetooth Controller feels like a Switch Pro Controller in shape, with a similarly short grip profile that larger hands may not prefer. Both share Switch and Windows PC support, but 8BitDo gets a leg up with full Steam Deck compatibility. Its haptics are decent but not as good as Nintendo’s, and it’s missing Amiibo support, though it does feature customizable back paddles and motion controls — along with a hidden trick that allows you to wake a docked Switch by giving the controller a little shake.Related8BitDo’s $29.99 wireless controller is now Switch compatible8BitDo’s first smartphone controller has Hall effect joysticks and triggersIt also comes with a charging dock, which stores the 2.4GHz dongle when not in use. The included dock is handy for charging the 22-hour battery, whic"
