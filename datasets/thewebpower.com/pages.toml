title = "Δωρεάν 4 μήνες Web Hosting με σύσταση άλλων πελατών."
description = "Για κάθε νέο πελάτη που μας συστήνετε θα προσθέτουμε έως και 4 μήνες φιλοξενίας ιστοσελίδων - web hosting στο δικό σας πακέτο."
full_description = "Τώρα σας προσφέρουμε την δυνατότητα να έχετε εντελώς ΔΩΡΕΑΝ φιλοξενία για το site σας. Αρκεί να μας συστήσετε πελάτες οι οποίοι θα αγοράσουν το δικό τους ανεξάρτητο πακέτο φιλοξενίας. Για κάθε νέο πελάτη θα προσθέτουμε έως και 4 μήνες φιλοξενίας στο δικό σας πακέτο για όσο διάστημα οι πελάτες που συστήσατε συνεχίζουν την φιλοξενία τους στην THEWEBPOWER. Η προσφορά ισχύει για όλα τα πακέτα μας σε Shared Hosting* καθώς επίσης για τα WordPress και Joomla πακέτα μας. ΟΡΟΙ Προσθέτουμε 4 μήνες φιλοξενίας στο πακέτο σας αν ο πελάτης που θα συστήσετε αγοράσει πακέτο για 24 μήνες. Προσθέτουμε 2 μήνες φιλοξενίας στο πακέτο σας αν ο πελάτης που θα συστήσετε αγοράσει πακέτο για 12 μήνες. Προσθέτουμε 1 μήνα φιλοξενίας στο πακέτο σας αν ο πελάτης που θα συστήσετε αγοράσει πακέτο για 6 μήνες. * Η προσφορά δεν ισχύει για το SMALL πακέτο φιλοξενίας και για μεταπωλητές. Για να μας ενημερώσετε σχετικά με τους πελάτες που συστήνετε μπορείτε απλά να μας στείλετε την παρακάτω φόρμα. Σύμφωνω με τους όρους Προστασίας Προσωπικών Δεδομένων όπως αυτοί αναφέρονται στην σελίδα: https://www.thewebpower.com/personal-data-privacy/"
