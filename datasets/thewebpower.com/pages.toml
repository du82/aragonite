["https://www.thewebpower.com/transfer-your-wordpress-site-to-thewebpower"]
title = "Wordpress hosting website transfer"
description = "Πώς να μεταφέρετε το WordPress site σας εύκολα και γρήγορα σε νέο wordpress hosting χωρίς downtime."
full_description = "28Απρ201724 Οκτωβρίου, 2018Μεταφορά του WordPress site σαςΠώς να μεταφέρετε το WordPress site σας στo web hosting της theWebPower.Είναι πολύ εύκολο να μεταφέρετε το WordPress site σας και όλα τα περιεχόμενα του στο δικό σας web hosting μαζί μας.Σε μόλις 4 εύκολα βήματα, πολύ γρήγορα και χωρίς προβλήματα.1. Δημιουργία αντιγράφων ασφαλείας αρχείων WordPress και βάσης δεδομένωνΕγκαταστήστε ένα backup plugin στον τρέχοντα ιστότοπο όπως για παράδειγμα το All-in-One Migration WP ή κάποιο παρόμοιο.Πρέπει να εξάγετε όλα τα δεδομένα από τον παλιό server, επομένως θα χρειαστεί να κατεβάσετε το αρχείο στον υπολογιστή σας.2. Εγκαταστήστε το WordPress στον λογαριασμό σας χρησιμοποιώντας το Softaculous που μπορείτε να βρείτε μέσα στο cPanel.Προσοχή στην εγκατάσταση να αφήσετε κενό το πεδίο οπυ ζητάει να πείτε που θα εγκατασταθεί, αν θέλετε η εγκατάσταση wordpress να είναι η αρχική σελίδα του site σας.3. Εισάγετε τον παλιό ιστότοπο WordPress στη νέα εφαρμογή WordPress.Εγκαταστήστε το plugin All-in-One Migration WP στη νέα σας εφαρμογή WordPress. Λάβετε υπόψη ότι αν το domain σας δεν λειτουργεί ακόμη, θα πρέπει να χρησιμοποιήσετε την προσωρινή διεύθυνση URL που σας στείλαμε με τις οδηγίες σας.Για να μπορέσετε να συνδεθείτε στη νέα εγκατάσταση, πρέπει πρώτα να κάνετε τα εξής:Διαμορφώστε το WordPress για να χρησιμοποιήσετε προσωρινή διεύθυνση URLΓια να χρησιμοποιήσετε την προσωρινή σας διεύθυνση URL με το WordPress, απλά εγκαταστήστε το WordPress στο domain σας. Μην ανησυχείτε για την προσωρινή διεύθυνση URL ακόμα.Στη συνέχεια θα χρειαστεί να εντοπίσετε το αρχείο wp-config.php στον διαχειριστή αρχείων στο cPanel. Το αρχείο wp-config.php θα βρίσκεται στο φάκελο όπου εγκαταστήσατε το WordPress.Στη συνέχεια, θα χρειαστεί να κάνετε δεξί κλικ στο αρχείο και να επιλέξετε “επεξεργασία”.Αυτό θα ανοίξει τον πραγματικό κώδικα του αρχείου όπου θα πρέπει να εισαγάγετε δύο γραμμές κώδικα στην κορυφή του αρχείου για να ορίσετε την προσωρινή διεύθυνση URL ως τον τρόπο πρόσβασης στην εγκατάσταση του WordPress.Define (‘WP_HOME’, ‘http: //67,225,209.93/~username’); Define (‘WP_SITEURL’, ‘http: //67,225,209.93/~username’);Όπου http://67,225,209.93/~username χρησιμοποιήστε την προσωρινή διεύθυνση URL που έχετε λάβει με τις οδηγίες του λογαριασμού σας.Αποθηκεύστε τις αλλαγές κάνοντας κλικ στο κουμπί “αποθήκευση αλλαγών” στην επάνω δεξιά γωνία.Συγχαρητήρια! Έχετε αλλάξει με επιτυχία το WordPress για να χρησιμοποιεί την προσωρινή σας διεύθυνση URL.4. Μεταφορτώστε το WordPress site σας στη νέα εγκατάσταση.Έχετε αλλάξει επιτυχώς το WordPress για να χρησιμοποιεί την προσωρινή σας διεύθυνση URL. Έτσι μπορείτε να συνδεθείτε τώρα στη νέα σας εφαρμογή WordPress χρησιμοποιώντας αυτή τη διεύθυνση URL.Εγκαταστήστε το plugin All-in-One Migration WP στη νέα σας εφαρμογή WordPress και εισάγετε το backup αρχείο που δημιουργήσατε νωρίτερα από τον υπολογιστή σας.Το site σας έχει μεταφερθεί. Ελέγξτε τις σελίδες χρησιμοποιώντας τη προσωρινή διεύθυνση URL για να βεβαιωθείτε ότι όλα είναι εντάξει.Ρύθμιση του WordPress για να χρησιμοποιεί το domain σαςΌταν ολοκληρώσετε τη ρύθμιση και τη δοκιμή του ιστότοπού σας χρησιμοποιώντας την προσωρινή διεύθυνση URL, θα χρειαστεί να επεξεργαστείτε ξανά το αρχείο wp-config.php και να αφαιρέσετε τον κώδικα που τοποθετήσατε στο αρχείο. Ανοίξτε το αρχείο wp-config.php με το πρόγραμμα επεξεργασίας κώδικα και αντικαταστήστε την προσωρινή διεύθυνση URL με το domain σας.Το τελευταίο βήμα είναι να αλλάξετε τους παλιούς nameservers με τους νέους.Μεταβείτε στον καταχωρητή του domain σας και αλλάξτε τους nameservers με τους νέους που σας έχουμε στείλει με τις οδηγίες του πακέτου σας.Η διαδικασία ολοκληρώθηκε.Η ιστοσελίδα σας θα είναι ορατή στο νέο σας wordpress web hosting λογαριασμό μαζί μας, μόλις γίνει η σχετική ενημέρωση των παρόχων internet μέσα σε περίπου 24 ώρες.Αν δεν έχετε ήδη φιλοξενία μαζί μας, κάντε κλικ εδώ για να εγγραφείτε τώρα από μόνο 3€ το μήνα!!!Αναλαμβάνουμε εμείς ΔΩΡΕΑΝ όλη την διαδικασία μεταφοράς για το πρώτο site κάθε πακέτου που ανοίγετε σε εμάς μαζί με ΔΩΡΕΑΝ web hosting σύμφωνα με την μεγάλη προσφορά μας για όσους μεταφέρουν το website τους απο άλλο πάροχο.Θα χαρούμε να απαντήσουμε σε οποιεσδήποτε ερωτήσεις που πιθανόν να έχετε.0by thewebpowerin Web Hosting BlogShare It Facebook Twitter Pinterest"
