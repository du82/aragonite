["https://www.thewebpower.com/formmail"]
title = "Προεγκατεστημένο Formmail script για φόρμες επικοινωνίας σε html σελίδες"
description = "Για να χρησιμοποιήσετε το Formmail για την λειτουργία των φορμών επικοινωνίας ,αρκεί να δημιουργήσετε μια φόρμα με οποιοδήποτε πρόγραμμα σχεδίασης στατικών ιστοσελίδων. Το actio ..."
full_description = "17Μαΐ202318 Μαΐου, 2023Formmail script για φόρμες επικοινωνίας σε html σελίδεςΓια να χρησιμοποιήσετε το Formmail για την λειτουργία των φορμών επικοινωνίας ,αρκεί να δημιουργήσετε μια φόρμα με οποιοδήποτε πρόγραμμα σχεδίασης στατικών ιστοσελίδων.Το action της φόρμας πρέπει να είναι: “/cgi-sys/FormMail.cgi”Μπορείτε να καθορίσετε την συμπεριφορά του Formmail χρησιμοποιώντας κρυμμένα πεδία (hidden fields) στην φόρμα σας. Υπάρχουν δύο υποχρεωτικά πεδία που πρέπει να έχετε στην φόρμα σας για να δουλεύει σωστά το Formmail. Αυτά είναι το recipient και το email (πεδίο). Παρακάτω αναφέρονται μερικά πεδία ρύθμισης:ΠΕΔΙΟ : recipient ΠΕΡΙΓΡΑΦΗ: Αυτό το πεδίο φόρμας σας επιτρέπει να ορίσετε σε που θελετε να αποστέλωνται με email τα αποτελέσματα της φόρμας .Ορίστε αυτή την επιλογή σαν ένα κρυμμένο (hidden) πεδίο φόρμας βάζοντας την email διεύθυνση που θέλετε να αποστέλει η φόρμα. ΣΥΝΤΑΞΗ: input type=hidden name=”recipient” value=”email@yourdomainname.gr”ΠΕΔΙΟ : subject ΠΕΡΙΓΡΑΦΗ: Αυτό το πεδίο σας επιτρέπει να ορίσετε το θέμα που θέλετε να εμφανίζεται στα email που λαμβάνετε μέσω της φόρμας. ΣΥΝΤΑΞΗ: input type=hidden name=”subject” value=”Το θέμα σας”ΠΕΔΙΟ : email ΠΕΡΙΓΡΑΦΗ: Αυτό το πεδίο φόρμας καθορίζει την e-mail adress αυτού που συμπληρωνει την φόρμα. Αν θέλετε να έχετε την δυνατότητα να απαντάτε τα e-mail απο τον πελάτη σας , θα πρέπει οπωσδήποτε να συμπεριλάβετε αυτό το πεδίο σαν υποχρεωτικό (required) και με e-mail address valid syntax. ΣΥΝΤΑΞΗ: input type=text name=”email”ΠΕΔΙΟ : redirect ΠΕΡΙΓΡΑΦΗ: Αν θέλετε να κάνετε προώθηση (redirect) του χρήστη σε ένα διαφορετικό URL μετά την συμπλήρωση της φόρμας, χρησιμοποιείστε αυτό το κρυμμένο πεδίο για να τον στείλετε σε μια άλλη σελίδα. ΣΥΝΤΑΞΗ: input type=hidden name=”redirect” value=”http://yourdomainname.gr/page.html”Περισσότερες πληροφορίες σχετικά με το formmail θα βρείτε εδώ.0by thewebin Emails, Γνωσιακή ΒάσηShare It Facebook Twitter Pinterest"
