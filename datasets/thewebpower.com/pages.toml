title = "Domain name"
description = "FAQ - Τί είναι το όνομα χώρου / domain name;"
full_description = "28Μαρ201721 Μαΐου, 2017Τί είναι το όνομα χώρου / domain name;Το όνομα χώρου (domain name) είναι το όνομα μιας ιστοσελίδας-site στο internet. Τα domain names είναι μοναδικά και χαρακτηρίζουν την ιστοσελίδα στην οποία αναφέρονται. Ένα domain name αποτελείται από το πρόθεμα ( πχ. το όνομά σας , η επωνυμία της εταιρείας σας) , και μια κατάληξη (TLD). Η κατάληξη προσδιορίζει το αντικείμενο ενός website ή αποτελεί γεωγραφικό προσδιορισμό.Για κάθε χώρα υπάρχει μια μοναδική τέτοια κατάληξη (πχ. .gr για την Ελλάδα, .de για την Γερμανία). Έτσι λοιπόν για παράδειγμα η κατάληξη .com, που χρησιμοποιείται διεθνώς, σχετίζεται κυρίως με εμπορικά domain names, οι δημοφιλείς καταλήξεις .net, .org, .biz, .info χρησιμοποιούνται από εταιρίες και ιδιώτες σε όλο τον κόσμο, ενώ καταλήξεις όπως .gr προσδιορίζουν την γεωγραφική θέση του ονόματος και κατ’επέκταση του ιδιοκτήτη.Για τον χώρο Ονομάτων με κατάληξη [. GR ], ένα Domain Name θα έχει την μορφή onoma.gr και επισκεπτόμαστε τις ιστοσελίδες που του αντιστοιχούν γράφοντας σε κάποιο πρόγραμμα πλοήγησης (browser) μια διεύθυνση της μορφής http://www.onoma.gr.0by thewebpowerin Domain Names, Γνωσιακή ΒάσηShare It Facebook Twitter Pinterest"
