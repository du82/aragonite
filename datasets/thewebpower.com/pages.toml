["https://www.thewebpower.com/domain-change-seo"]
title = "SEO - change domain"
description = "Αλλαγή domain; Τι γίνεται με το SEO;"
full_description = "22Μαρ201818 Μαΐου, 2023Αλλαγή domain; Τι γίνεται με το SEO;Θυμάστε τις ημέρες όταν τα μόνα διαθέσιμα domains ήταν τα .com, .net ή .org;Τα πράγματα ήταν εύκολα τότε. Είτε κατοχυρώνατε το ακριβές όνομα που αναζητούσατε (όπως το ‘web.com’) – είτε το επόμενο καλύτερο.Τότε οι χρήστες πίστευαν ότι ένα domain .com ήταν ότι καλύτερο. Το .com έδειχνε ότι το domain σας ήταν ένα από τα πρωτότυπα και ως εκ τούτου πρέπει να αντιμετωπίζεται με σεβασμό.Ενώ αρχικά το μήκος των domains ήταν περιορισμένο, το μήκος τους αυξήθηκε γρήγορα και πλέον μπορείτε να δημιουργήσετε domains με 253 χαρακτήρες. Αυτό ήταν εξαιρετικό για το SEO – Το Google ήταν πολύ φιλικό σε domains όπου το περιεχόμενο ενός ιστότοπου αντανακλάται από τη διεύθυνση URL. Σταδιακά όμως, οι χρήστες άρχισαν να μιλάνε για την “εμπειρία του χρήστη” και να αναρωτιούνται αν τα domains όπως “www.everything-you-ever-want-to-know-about-web-hosting.com” προσφέρουν μια ποιοτική εμπειρία στον χρήστη.Έτσι ήρθε η εποχή των γενικών Top-Level-Domains (gTLDs)!Εκτός από domains με καταλήξεις που υποδηλώνουν γεωγραφική θέση (όπως ‘.co.uk’), υπάρχουν τώρα εκατοντάδες επιλογές καταλήξεων που αντικατοπτρίζουν τον χώρο των επιχειρήσεων που ανήκετε, το επάγγελμά σας ή τα ενδιαφέροντα σας. Για παράδειγμα .doctor, .club και .accountant. Αν θέλετε να δείτε περισσότερα, η Wikipedia έχει μια πλήρη λίστα των καταλήξεων που είναι διαθέσιμες ενώ ο κατάλογος συνεχίζει να αυξάνεται σε καθημερινή βάση.Με τόσες επιλογές, οι χρήστες δεν χρειάζεται πλέον να δεχτούν το δεύτερο καλύτερο. Σήμερα είναι πολύ πιθανό να υπάρχει ένα διαθέσιμο domain που να εκφράζει ΑΚΡΙΒΩΣ αυτό που θέλετε. Αλλά ενώ η επιλογή είναι εκεί, και πολλοί μπαίνουν στον πειρασμό να αλλάξουν το domain του site τους σε κάτι καλύτερο, λίγοι το κάνουν. Ο λόγος για αυτό είναι βέβαια, το Search Engine Optimization ή SEO.Το SEO βοηθά ένα site να κερδίσει καλύτερη θέση στις μηχανές αναζήτησης και καθώς η παλαιότητα ενός domain παίζει ρόλο, οι χρήστες έχουν την τάση να μην αλλάζουν sites τα οποία υπάρχουν εδώ και πολλά χρόνια . Είναι όμως δυνατό να έχουμε και τα δύο, να αλλάξουμε το domain ενός site χωρίς να επηρεάσουμε το SEO (ή τουλάχιστον να κάνουμε τον αντίκτυπο πολύ ελάχιστο).Εδώ είναι ένας βασικός οδηγός για μια αποτελεσματική αλλαγή domain:1. Πριν αγοράσετε – ελέγξτε αν το domain σας έχει καταχωρηθείΕάν πρόκειται για ένα ολοκαίνουργιο domain με μία από τις πιο πρόσφατες καταλήξεις, οι πιθανότητες να έχει ήδη καταχωρηθεί είναι ελάχιστες, αλλά υπάρχει πάντα μια πιθανότητα. Θα πρέπει επίσης να ελέγξετε αν το domain έχει τιμωρηθεί με οποιονδήποτε τρόπο από την Google.Αρχικά χρησιμοποιήστε έναν ιστότοπο ‘whois’ για να δείτε αν υπάρχουν ήδη λεπτομέρειες σχετικά με τον τομέα που έχετε επιλέξει. Ομοίως, το Wayback Machine προσφέρει μια καλή ιδέα για το αν ένα domain έχει χρησιμοποιηθεί προηγουμένως. Αν ναι, πρέπει να κοιτάξετε περισσότερο. Εάν ένα domain έχει τιμωρηθεί από την Google, δεν θα επιτρέπεται να χρησιμοποιεί το Google Adsense, επομένως ο έλεγχος εάν ένα domain επιτρέπεται να χρησιμοποιεί το Google Adsense θα σας δώσει μια σαφή εικόνα για το ιστορικό και την αξία του για εσάς. Η Google προσφέρει επίσης αναφορές Μη αυτόματων ενεργειών, οι οποίες μπορούν να σας ενημερώσουν εάν κάποιος χρήστης της Google έχει προηγουμένως επισημάνει τον τομέα για οποιονδήποτε λόγο. Ίσως θελήσετε επίσης να μάθετε αν ένα όνομα είναι καταχωρημένο εμπορικό σήμα για να αποφύγετε μελλοντικά νομικά προβλήματα.2. Αντίγραφα ασφαλείαςΗ μεταφορά του site σας σε ένα νέο domain απαιτεί αλλαγή διακομιστών ή τουλάχιστον αλλαγή σε νέο λογαριασμό στον ίδιο διακομιστή. Όταν κάνετε σημαντικές αλλαγές όπως αυτές, πάντα φοβάστε το χειρότερο. Φανταστείτε να χάσετε τα πάντα και με αυτόν τον τρόπο θα κάνετε πάντα ενστικτωδώς ένα πλήρες αντίγραφο ασφαλείας. Το πώς θα το κάνετε αυτό θα εξαρτηθεί από τον πίνακα ελέγχου που χρησιμοποιείτε ή αν χρησιμοποιείτε cloud υπηρεσία δημιουργίας αντιγράφων ασφαλείας. Ανεξαρτήτως, βεβαιωθείτε ότι είναι διαθέσιμο ένα πλήρες αντίγραφο ασφαλείας.3. Μετακινήστε τα αρχεία σας στο νέο διακομιστή / λογαριασμόΕάν χρησιμοποιείτε ένα Σύστημα Διαχείρισης Περιεχομένου (CMS) όπως το Joomla, το WordPress ή το Drupal, είναι διαθέσιμα διάφορα modules / plugins για να που μπορούν να σας βοηθήσουν. Χωρίς μια τέτοια επιλογή, θα χρειαστεί να φτιάξετε τις σελίδες σας κάτω από νέες διευθύνσεις URL.4. Οδηγήστε τις παλιές διευθύνσεις URL στις νέες διευθύνσεις URLΑν αυτό μπορεί να γίνει αυτοματοποιημένα, η ζωή σας θα γίνει πολύ πιο απλή, διαφορετικά θα χρειαστεί να μπείτε στο αρχείο .htacess και να κάνετε τις ανακατευθύνσεις με μη αυτόματο τρόπο. Ωστόσο, πρέπει να γίνει. Για να ανακατευθύνετε τις σελίδες χρησιμοποιήστε ένα “301 redirect”. Αυτό σημαίνει ότι οι διακομιστές κατανοούν την αλλαγή ως “μόνιμη”. Εάν η αλλαγή είναι μόνιμη, η Google θα μεταφέρει τα αποτελέσματα του SEO από την παλιά διεύθυνση URL στη νέα διεύθυνση URL.5. Δημιουργήστε μια σελίδα ανακατεύθυνσης 404Οι πιθανότητες είναι ότι αν κάνετε μια αλλαγή με το χέρι, θα κάνετε κάποια λάθη και αυτό θα έχει ως αποτέλεσμα ορισμένους συνδέσμους που οδηγούν σε σελίδες που δεν υπάρχουν: Αυτό είναι πολύ κακό για το SEO, αλλά μπορείτε να το αντιμετωπίσετε πριν γίνει πρόβλημα. Για να γίνει αυτό, πρέπει να δημιουργήσετε μια ειδική σελίδα ανακατεύθυνσης 404:Μην χρησιμοποιείτε κώδικα τύπου “ανανέωσης” στη σελίδα σας html: <meta http-equiv = “ανανέωση” content = “0; URL = ‘http: //newwebsite.com/newpage'” />Παρόλο που είναι εύκολο να γίνει, η Google δεν το δέχεται.Η προσθήκη του ‘Redirect 301 / http://www.newwebsite.com/newpage’ στο αρχείο .htacess σας θα είναι πολύ καλύτερο όσον αφορά το SEO.6. Δημιουργήστε και προσθέστε νέο χάρτη ιστοτόπου XMLΟι χάρτες ιστοτόπου XML καθιστούν ευκολότερο για την Google να διαβάζει τις σελίδες του ιστότοπού σας, οπότε μην ξεχάσετε να προσθέσετε ένα. Και πάλι, με τη χρήση του Joomla, του WordPress ή του Drupal υπάρχουν πρόσθετα που μπορούν να το κάνουν αυτό για εσάς, αλλά αν όχι υπάρχουν αρκετοί ιστότοποι που θα δημιουργήσουν ένα sitemap για εσάς. Για να υποβάλετε έναν χάρτη ιστότοπου, πρέπει να μεταβείτε στο Google Webmaster Tools.7. Υποβάλετε το νέο ιστότοπο στην GoogleΌσο ταχύτερα η Google αναγνωρίζει την αλλαγή, τόσο καλύτερα θα είναι για το SEO σας. Και πάλι θα χρειαστείτε το Google Webmaster Tools.Προσοχή: Το αν η βαθμολογία του ιστότοπού σας στο Google μεταφέρεται πραγματικά στον νέο σας domain εξαρτάται από διάφορους παράγοντες. Εάν, για παράδειγμα, ανακατευθύνετε τις σελίδες σας και οι σελίδες του νέου ιστότοπού σας είναι πιο αργές από τις σελίδες του παλιού ιστότοπού σας, θα υπάρχει αντίκτυπο και στο SEO. Γενικότερα εάν ο νέος ιστότοπός σας υπολείπεται με οποιονδήποτε τρόπο σε σχέση με τον παλιό, το SEO θα επηρεαστεί αρνητικά.1by thewebpowerin Web Hosting BlogShare It Facebook Twitter Pinterest"
author = "Thewebpower.com - Media Power LTD"
