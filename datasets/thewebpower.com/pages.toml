full_description = "28Μαρ201721 Μαΐου, 2017Πώς ανεβάζω το website μου στον server ;Όλα τα αρχεία και τα directories του site σας πρέπει να μπουν στον φάκελο /public_html. Πρόσβαση σε αυτόν έχετε είτε μέσω FTP client είτε μέσω του FileManager από το cPanel. Υπάρχουν αρκετά FTP προγράμματα διαθέσιμα στο internet. Τα στοιχεία login που χρειάζεστε θα σας σταλούν με email μόλις ενεργοποιηθεί ο λογαριασμός σας. Δημιουργείστε μια index σελίδα σαν πρώτη σελίδα του site σας. Αυτή μπορεί να είναι index.htm, index.html, index.php, κλπ. Προσοχή: υπάρχει διάκριση μεταξύ κεφαλαίων και πεζών σε συστήματα Linux οπότε index.htm και Index.htm είναι 2 διαφορετικά αρχεία. Η Index.htm δεν αναγνωρίζεται σαν πρώτη σελίδα. Πρέπει να είναι index.htm (.html, .php, κλπ) με πεζά γράμματα.0by thewebpowerin Web Hosting, Γνωσιακή ΒάσηShare It Facebook Twitter Pinterest"
