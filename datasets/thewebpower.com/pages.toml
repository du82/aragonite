description = "FAQ - Από τί χαρακτήρες μπορεί να αποτελείται ένα domain name;"
full_description = "Άρθρο Από τί χαρακτήρες μπορεί να αποτελείται ένα domain name; Τα Oνόματα Xώρου (domain names) με διεθνή κατάληξη αποτελούνται από αλφαριθμητικούς χαρακτήρες του λατινικού αλφαβήτου [Α-Ζ,a-z,0-9] και τον ειδικό χαρακτήρα [-]. Περιλαμβάνουν τουλάχιστον (2) χαρακτήρες και έως (63) χαρακτήρες. Τα ονόματα χώρου (domain names) με κατάληξη .gr αποτελούνται από αλφαριθμητικούς χαρακτήρες του λατινικού [Α-Ζ,a-z,0-9], ή του ελληνικού αλφαβήτου [Α-Ω,α-ω,0-9] οι οποίοι κωδικοποιούνται σε μορφή PUNYCODE,...28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Έχω δηλώσει λάθος domain name στην αίτηση κατοχύρωσης, μπορώ να κάνω αντικατάσταση; Σε περίπτωση που δηλώσατε λάθος domain name και η αίτησή σας έχει καταχωρηθεί στο μητρώο , τότε σε περίπτωση που το όνομα έχει κατάληξη .gr μπορεί να γίνει ανάκληση της αίτησης μέσα σε διάστημα 5 ημερών από την καταχώρηση της αίτησης. Σε αυτή την περίπτωση θα πρέπει να μας στείλετε με email το αίτημα ανάκλησης...28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο H παραγγελία κατοχύρωσης/ανανέωσης του domain μου θα εκτελεστεί πριν ή μετά την πληρωμή; Αν γίνει παραγγελία για ένα domain name δε σημαίνει ότι θα γίνει άμεσα και η κατοχύρωση ή ανανέωσή του αν προηγουμένως δεν λάβουμε την πληρωμή σας ή γίνει η χρέωση της κάρτας σας. Αν μέχρι τότε, το domain name κατοχυρωθεί από άλλο πρόσωπο, ουδεμία ευθύνη φέρουμε για την απώλειά του. Αν έχετε κάνει παραγγελία ανανέωσης...28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower"
