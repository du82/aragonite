["https://www.thewebpower.com/https-ssl-google"]
title = "Google, HTTPS and SSL for SEO"
description = "Πλέον το HTTPS και το SSL χρειάζονται για όλους τους ιστότοπους, προκειμένου να κατατάσσονται καλά στην Google"
full_description = "25Απρ20175 Φεβρουαρίου, 2019Πλέον το HTTPS και το SSL χρειάζονται για όλους τους ιστότοπους, προκειμένου να κατατάσσονται καλά στην Google.Όλα ξεκίνησαν το 2014, όταν η Google ανακοίνωσε ότι το HTTPS θα ζητείται από κάθε ιστότοπο στο ιντερνετ. Η Google έχει 3 κύριους λόγους για αυτή την μετάβαση, αλλά πριν μιλήσουμε για αυτά, ίσως να αναρωτιέστε τι είναι το HTTPS και το SSL.Τι είναι το HTTPS και το SSL;Το HTTPS είναι το ακρωνύμιο για το Ασφαλές πρωτόκολλο μεταφοράς υπερκειμένου. Πρόκειται για ένα πρωτόκολλο που χρησιμοποιείται για ασφαλείς επικοινωνίες μέσω ενός δικτύου υπολογιστών, όπως το διαδίκτυο. Η επικοινωνία μέσω HTTPS κρυπτογραφείται μεταξύ του πελάτη και του διακομιστή, έτσι ώστε κανένας να μην μπορεί να δει την πραγματική ανταλλαγή δεδομένων και τα δεδομένα του ιστοτόπου σας είναι ασφαλή.Το SSL (Secure Sockets Layer) είναι η τυπική τεχνολογία ασφάλειας για την καθιέρωση κρυπτογραφημένης σύνδεσης μεταξύ ενός διακομιστή ιστού και ενός προγράμματος περιήγησης. Αυτός ο σύνδεσμος διασφαλίζει ότι όλα τα δεδομένα που μεταφέρονται μεταξύ του διακομιστή ιστού και των προγραμμάτων περιήγησης παραμένουν ιδιωτικά και ολοκληρωμένα. Το SSL αποτελεί βιομηχανικό πρότυπο και χρησιμοποιείται από εκατομμύρια ιστότοπους για την προστασία των ηλεκτρονικών συναλλαγών τους με τους πελάτες τους.Η κρυπτογράφηση SSL εμποδίζει τους χάκερς να κλέβουν ιδιωτικές πληροφορίες, όπως αριθμούς πιστωτικών καρτών, ονόματα και διευθύνσεις. Εάν πουλάτε προϊόντα ή υπηρεσίες στον ιστότοπό σας και δέχεστε πιστωτικές κάρτες στο διαδίκτυο, χρειάζεστε ένα πιστοποιητικό SSL για την ασφάλεια ιστότοπου σας.Γιατί η Google καλεί όλους τους ιστότοπους να μεταβούν στο HTTPS;Αυτό μας επαναφέρει στους τρείς λόγους για τους οποίους η Google καλεί όλους τους ιστότοπους να μεταβούν στο HTTPS. Μέχρι πρόσφατα, για να αποκτήσετε πρόσβαση στους περισσότερους ιστότοπους, η διεύθυνση URL αρχίζει συνήθως με “HTTP”. Αυτή είναι η μη ασφαλής έκδοση του πρωτοκόλλου που μεταφέρει δεδομένα μεταξύ του διακομιστή ιστού και του προγράμματος περιήγησης στον υπολογιστή σας ή στο smartphone. Το HTTP δεν εξασφαλίζει τις προσωπικές σας πληροφορίες, όπως αριθμούς πιστωτικών καρτών κ.λ.π.Η Google βλέπει τρεις λόγους για να εξασφαλίσει τον ιστότοπό σας με HTTPS και SSL. Αυτοί είναι οι εξής: “Έλεγχος ταυτότητας”, “Ακεραιότητα δεδομένων” και “Κρυπτογράφηση”. Αυτά τα 3 σημεία καλύπτουν μαι σειρά από θέματα που έχουν προκύψει όταν πρόκειται για επικοινωνίες μέσω του διαδικτύου.Ο Έλεγχος ταυτότητας καλύπτει το ζήτημα της επαλήθευσης της ιδιοκτησίας του ιστότοπού σας. Πιστέψτε το ή όχι, υπάρχουν άνθρωποι εκεί έξω που κάνουν αντίγραφα ιστοτόπων και εκτρέπουν την κυκλοφορία σε αυτό σε μια προσπάθεια να κλέψουν από σας. Οι περισσότεροι άνθρωποι γνωρίζουν ότι πρέπει να ελέγξουν για το πράσινο κλείδωμα στο πρόγραμμα περιήγησής τους προτού εισάγουν προσωπικές πληροφορίες στον ιστότοπο. Μπορείτε να προχωρήσετε ένα βήμα παραπέρα και να επαληθεύσετε το πιστοποιητικό SSL για να βεβαιωθείτε ότι ανήκει στον ιστότοπο στον οποίο βρίσκεστε.Η Ακεραιότητα Δεδομένων μιλάει για το κατά πόσο τα δεδομένα στον ιστότοπο έχουν αλλοιωθεί ή όχι κατά τη μεταφορά τους. Εάν κάποιος ξέρει τι κάνει και ο ιστότοπός σας δεν είναι ασφαλής, μπορεί να παραβιάσει τα δεδομένα που μεταδίδονται από τον διακομιστή σας στον πελάτη. Η υποβολή της φόρμας που μόλις έστειλε ο πελάτης θα μπορούσε να μεταβεί στον χάκερ και όχι σε εσάς.Η Κρυπτογράφηση αναφέρεται στην ασφάλεια των επικοινωνιών μεταξύ του πελάτη και του διακομιστή, ώστε κανένας άλλος να μην μπορεί να τα διαβάσει. Αυτό είναι ένα βασικό σημείο για τους εμπορικούς ιστοτόπους. Ενώ είναι εξαιρετικά σημαντικό να κρυπτογραφήσετε τις επικοινωνίες σε έναν ιστότοπο ηλεκτρονικού εμπορίου, είναι εξίσου σημαντικό να κρυπτογραφήσετε τα δεδομένα που υποβάλλονται χρησιμοποιώντας τις φόρμες.SSL και καλύτερη κατάταξη στα αποτελέσματα αναζήτησης της GoogleΤο 2014 η Google ανακοίνωσε ότι εάν ο ιστότοπός σας ήταν HTTPS, θα έδινε σε αυτόν τον ιστότοπο πλεονέκτημα στην κατάταξη μέσα στα αποτελέσματα αναζήτησης. Αυτό είναι καλό για τις επιχειρήσεις που διαθέτουν ιστότοπους που ανταγωνίζονται άλλες επιχειρήσεις για τη θέση τους στις σελίδες αποτελεσμάτων μηχανών αναζήτησης.Τον Σεπτέμβριο του 2016 η Google ανήγγειλε έναν άλλο λόγο για την μετάβαση στο HTTPS. Ξεκινώντας από τον Ιανουάριο του 2017 άρχισαν να εμφανίζουν την ασφάλεια της σύνδεσης στη γραμμή διεύθυνσης του Chrome v.56 σε σελίδες που εμφανίζουν έναν κωδικό πρόσβασης ή / και ένα πεδίο πιστωτικής κάρτας. Αυτή είναι η αρχή ενός μακροπρόθεσμου σχεδίου να χαρακτηριστούν όλες οι HTTP σελίδες μη ασφαλείς.Το πρώτο βήμα είναι αυτό:HTTPS vs HTTP ειδοποίηση Google ChromeΑλλά στις ακόλουθες εκδόσεις του Chrome η ένδειξη θα είναι ΚΟΚΚΙΝΗ!Πολύ κακό για κάθε ιστότοπο που δεν διαθέτει πιστοποιητικό SSL να λειτουργεί με το HTTPS.Τι πρέπει να κάνετε; Απλά προσθέστε ένα πιστοποιητικό SSL στον ιστότοπό σας ΤΩΡΑ.0by thewebpowerin Web Hosting BlogShare It Facebook Twitter Pinterest"
