full_description = "Άρθρο Τί είναι το bandwidth/traffic ; Το traffic (bandwidth) είναι ο όγκος των δεδομένων που ανταλλάσεται μεταξύ του server που φιλοξενεί ένα site και των χρηστών που το επισκέπτονται. Όσο ποιο μεγάλο είναι ένα site και όσο μεγαλύτερος ο αριθμός των επισκέψεων, τόσο μεγαλύτερο είναι και το μέγεθος του traffic.28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Τί είναι τα Subdomains/Addons/Parked Domains ; Το subdomain δείχνει σε υποκατάλογο του κύριου ονόματος. Για παράδειγμα το test.yourdomain.name θα έδειχνε στον φάκελο /test κάτω από το κύριο όνομα yourdomain.name. Τα περιεχόμενά του είναι ξεχωριστά από το υπόλοιπο site , λειτουργεί δηλαδή σαν ένα ανεξάρτητο site. Τα parked domains είναι δευτερεύοντα ονόματα του κύριου ονόματος. Δείχνουν στην ίδια ακριβώς σελίδα με το...28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Τα πακέτα φιλοξενίας παρέχουν υποστήριξη σε PHP και MySQL ; Όλα τα πακέτα φιλοξενίας – με εξαίρεση το Small – υποστηρίζουν PHP και MySQL. Επίσης μπορείτε να διαχειριστείτε τις MySQL βάσεις σας μέσω του phpMyAdmin (περιλαμβάνεται στο cPanel).28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Έχω ήδη κατοχυρωμένο όνομα, μπορώ να χρησιμοποιήσω αυτό στο πακέτο φιλοξενίας ; Βεβαίως, δεν χρειάζεται να κατοχυρώσετε νέο όνομα, μπορείτε να χρησιμοποιήσετε το ήδη υπάρχον. Απλά κατά την διαδικασία παραγγελίας πακέτου φιλοξενίας δηλώστε το όνομα που έχετε ήδη κατοχυρωμένο. Προτείνουμε όμως τη μεταφορά του domain σας στην εταιρεία μας (αλλαγή καταχωρητή), ώστε να έχουμε τη δυνατότητα επεξεργασίας του στο μέλλον σε περίπτωση αναβάθμισης των υπηρεσιών μας.28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower"
