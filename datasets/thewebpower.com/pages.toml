["https://www.thewebpower.com/email-pop-imap"]
title = "POP και IMAP λογαριασμοί, ποιο να διαλέξω;"
full_description = "17Μαΐ202320 Ιουλίου, 2023Πως διαχειρίζομαι και αποθηκεύω τα emails μου. POP, IMAP, WebmailΣυνήθως οι περισσότεροι χρήστες είτε είναι επιχειρήσεις είτε πρόσωπα, θέλουν να διατηρούν αρχείο των emails τους, για να ανατρέχουν σε κάθε email όταν χρειαστεί. Ο σωστός τρόπος διαχείρισης εξασφαλίζει την ύπαρξη του αρχείου αυτού.Ο χώρος αποθήκευσης των emails στον server είναι πεπερασμένος οπότε στην περίπτωση που λαμβάνουμε πολλά emails με επισυνάψεις, ο χώρος αυτός αργά ή γρήγορα θα γεμίσει. Αρα είναι βασικό να διατηρούμε το γενικό αρχείο που περιλαμβάνει όλα τα emails τοπικά σε ένα δικό μας υπολογιστή, ώστε να έχουμε πρόσβαση πάντοτε ακόμα και όταν δεν έχουμε σύνδεση στο Ιντερνετ και να μην χάνουμε τα παλιά emails που δεν χωράνε στο χώρο αποθήκευσης του server.Σε αυτό το άρθρο θα αναλύσουμε την διαδικασία και πως θα το πετύχουμε αυτό χρησιμοποιώντας οποιοδήποτε πρωτόκολλο αποθήκευσης POP ή IMAP και τα προγράμματα email (email clients) και επίσης προγράμματα email backup τα οποία προσφέρονται όλα Δωρεάν. Email clients (outlook , thunderbird ή κάποιo άλλο λογισμικό διαχείρισης email)Αυτά είναι προγράμματα που είναι εγκατεστημένα στον υπολογιστή σας ή στο κινητό σας, που συνδέονται με τον server για να κατεβάσουν και να στείλουν e-mail. Η όλη διαδικασία γίνεται στον υπολογιστή σας ή στο κινητό σας, μέσω της εγκατεστημένης εφαρμογής. Η καλύτερη δωρεάν εφαρμογή κατά την γνώμη μας , που μπορείτε να εγκαταστήσετε είναι το Mozilla Thunderbird.Εδώ μπορείτε να βρείτε τις γενικές ρυθμίσεις για εγκατάσταση email και εδώ τις ρυθμίσεις ειδικά για το thunderbirdΌταν κάνετε εγκατάσταση ενός λογαριασμού email σε μια εφαρμογή, θα συναντήσετε δυο επιλογές για τον τύπο του λογαριασμού. Συγκεκριμένα θα δείτε τις επιλογές POP και IMAP.Ποιες όμως είναι οι βασικές διαφορές τους;POPΤα emails αποθηκεύονται τοπικά στον υπολογιστή σας και όχι στον server μας, με αποτέλεσμα να μην επηρεάζεται ο χώρος του πακέτου σας στον server.Το πρωτόκολλο POP ήταν το πρώτο πρωτόκολλο που κατασκευάστηκε και το πιο δημοφιλές σήμερα.Όταν χρησιμοποιείτε POP, όλα τα μηνύματα κατεβαίνουν από τον mailserver και αποθηκεύονται τοπικά στον υπολογιστή ή συσκευή που βλέπετε τα emails. Άρα υπάρχουν κανονικά αντίγραφα στον υπολογιστή αυτόν. Έχετε την δυνατότητα να επιλέξετε κατά την δημιουργία του email στον email client που χρησιμοποιείτε, αν αφού κατέβουν τα emails στον υπολογιστή σας θα σβηστούν από τον server, ώστε να μην καταλαμβάνουν χώρο εκεί ή θα παραμείνουν εκεί, ώστε να μπορείτε να τα κατεβάσετε και σε άλλη συσκευή. Δηλαδή με αυτόν τον τρόπο έχετε την δυνατότητα όταν κατεβάζετε τα emails από ένα συγκεκριμένο υπολογιστή τότε αυτά να σβήνονται από τον server. Τα μεγάλα πλεονέκτημα του πρωτοκόλλου POP είναι στο ότι τα email είναι πάντα διαθέσιμα ακόμη και όταν δεν υπάρχει σύνδεση στο διαδίκτυο και ότι τα email παραμένουν ασφαλή στον υπολογιστή σας σε κάθε περίπτωση.Επίσης με αυτόν τον τρόπο δεν χρειάζεται να ανησυχείτε ότι μπορεί να γεμίσει ο χώρος αποθήκευσης στον server και να σταματήσετε να λαμβάνετε emails. IMAPΤα emails αποθηκεύονται στον server μας και όχι τοπικά, με αποτέλεσμα να δεσμεύεται ο χώρος στον server που έχετε για την εξυπηρέτηση των email. Το IMAP επιτρέπει στους χρήστες να συνδεθούν σε πολλούς διαφορετικούς email clients ή webmail και να βλέπουν τα ίδια μηνύματα, επειδή τα email διατηρούνται στον server και δεν σβήνονται απο αυτόν, μέχρι ο χρήστης να τα διαγράψει. Στις μέρες μας, με την διάδοση των smart phones, το IMAP έχει γίνει εξαιρετικά δημοφιλές.Όταν διαβάζετε ένα μήνυμα ηλεκτρονικού ταχυδρομείου χρησιμοποιώντας IMAP, στην πραγματικότητα δεν κάνετε λήψη ή αποθήκευση στον υπολογιστή σας, αλλά το διαβάζετε από τον server.Εάν έχετε μεγάλο αριθμό μηνυμάτων που θέλετε να κρατήσετε και δεν έχετε φροντίσει για την αποθήκευση τους τοπικά σε δικό σας υπολογιστή και την διαγραφή τους απο τον server, θα αντιμετωπίσετε προβλήματα κατά την αποστολή και λήψη e-mail, αν το mail box σας γεμίσει. Ορισμένοι χρήστες παρακάμπτουν αυτό το πρόβλημα κρατώντας τοπικά αντίγραφα σε κάποιον client ρυθμίζοντας τον email client να κατεβάσει τοπικά πραγματικά αντίγραφα και να τα διαγράψει αυτόματα από τον server σε συγκεκριμένες ημέρες, πχ. 40, εξοικονομώντας χώρο στον server.Προσοχή εδώ θα πρέπει να βεβαιωθείτε ότι έχετε ρυθμίσει σωστά τον email client ώστε να κρατάει τοπικά αντίγραφα.Ακόμα όμως και αν δεν έχει την δυνατότητα το πρόγραμμα διαχείρισης email (email client) που χρησιμοποιείτε να εκτελέσει αυτήν την λειτουργία, υπάρχει η λύση χρησιμοποιώντας ένα πρόγραμμα email backup για να κατεβάσετε τα αντίγραφα των emails και το εργαλείο του cpanel που σας παρέχουμε για την μαζική διαγραφή τους απο τον server με κριτήρια διαγραφής που εσείς θα επιλέξετε.Παρακάτω σας εξηγούμε πως γίνεται αυτή η διαδικασία. Πως να πάρετε αντίγραφα των emails σας (Backup) από ένα IMAP λογαριασμό Υπάρχουν διάφορα προγράμματα ώστε να πάρετε τα αντίγραφα των emails σας από ένα IMAP λογαριασμό τοπικά στον υπολογιστή σας.Προτείνουμε το πρόγραμμα MailStore το οποίο είναι δωρεάν με πολλές λειτουργίες και ικανοποιητική βοήθεια, αλλά υπάρχουν και άλλες επιλογές που μπορείτε να βρείτε απλά κάνοντας search στο internet.Τα αντίγραφα των email που θα πάρει το πρόγραμμα θα αποθηκευτούν στον υπολογιστή σας και θα μπορείτε να τα επεξεργαστείτε απο οποιονδήποτε email client έχετε εγκαταστήσει στον υπολογιστή σας ή απο το ίδιο το πρόγραμμα backup. Μαζική διαγραφή emails από ένα λογαριασμόΓια να διαγράψετε μαζικά emails από τον server για ένα λογαριασμό όταν δεν έχετε κάνει κάποια σχετική ρύθμιση στο πρόγραμμα του email client που χρησιμοποιείτε για να το κάνει, θα χρησιμοποιήσετε το σχετικό εργαλείο απο το cPanel. Mπορείτε να διαγράψετε τα emails που θέλετε να διαγραφούν και μόνο, χρησιμοποιώντας είτε χρονικά κριτήρια π.χ. διαγραφή των emails παλαιότερα του ενός έτους, είτε άλλου είδους κριτήρια που θα ορίσετε εσείς. Ετσι θα αποφύγετε την πιθανότητα να γεμίσει ο χώρος των email σας και να έχετε προβλήματα στην λήψη νέων email.Μπορείτε εδώ να δείτε ακριβώς με αναλυτικές οδηγίες την διαδικασία διαγραφής emailWebmailΤο Web mail λειτουργεί διαδικτυακά μέσω ενός browser και δεν χρειάζεται εγκατάσταση και συμπλήρωση διάφορων στοιχείων του λογαριασμού mail (όπως διακομιστής εισερχομένων και εξερχομένων) όπως γίνεται στην περίπτωση του POP και του IMAP. Η αποστολή, η λήψη και η διαχείριση των email στην κατηγορία αυτή γίνεται με την χρήση ενός οποιουδήποτε web browser (όπως ο Mozilla Firefox, ο Internet Explorer κτλ) Έτσι όπου και να βρίσκεστε έχετε πρόσβαση στα email σας , με την παραδοχή ότι έχετε σύνδεση στο διαδίκτυο.Πρόσβαση στο webmail έχετε μέσω:“http://yourdomain.gr/webmail/”όπου yourdomain.gr βάζετε το δικό σας όνομα χώρου που έχετε για το site σας.Οδηγίες για την σύνδεση μεσω webmail θα βρείτε εδώ.Με το webmail δεν υπάρχει η δυνατότητα να κατεβάσετε τοπικά αντίγραφα των emails στον υπολογιστή σας. Όρια στο μέγεθος του κάθε mailbox στον serverΣας υπενθυμίζουμε τα όρια που ισχύουν για κάθε μια διεύθυνση ηλεκτρονικού ταχυδρομείου (mailbox) που διατηρείτε στον χώρο του server ανάλογα με το πακέτο φιλοξενίας που έχετε αγοράσει.Τα όρια που ισχύουν ανά πακέτο φιλοξενίας είναι τα εξής:SMALL 500MB ανά mailboxBASIC 1000MB ανά mailboxSUPER BASIC 1000MB ανά mailboxADVANCED 2000MB ανά mailboxSUPER PRO 3000MB ανά mailboxPROFESSIONAL 5000MB ανά mailboxBasic WP 1000MB ανά mailboxSuper Basic WP 1000MB ανά mailboxAdvanced WP 2000MB ανά mailboxSuper Basic JOOMLA 1000MB ανά mailboxAdvanced JOOMLA 1500MB ανά mailbox Για κάθε επιπλέον διευκρίνηση ή πληροφορία επικοινωνήστε μαζί μας στο 2109211597 ή στα emailsales@thewebpower.comsupport@thewebpower.comΘα χαρούμε πολύ να σας παρέχουμε οποιαδήποτε σχετική βοήθεια.0by thewebin Web Hosting BlogShare It Facebook Twitter Pinterest"
