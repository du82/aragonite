full_description = "Άρθρο Ποιά domains προστατεύω με το πιστοποιητικό ασφαλείας; Τα SSL πιστοπoιητικά υποστηρίζουν το domain name και το www record (πχ. yourdomain.name και www.yourdomain.name).28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Τι ακριβώς είναι η δυναμική σφραγίδα (secure seal); H δυναμική σφραγίδα είναι ένα γραφικό που εξασφαλίζει εμπιστοσύνη στο internet. Οι επισκέπτες πατώντας επάνω σε αυτό επιβεβαιώνουν σε πραγματικό χρόνο ότι το site σας είναι πιστοποιημένο.28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Πώς ακριβώς δουλεύει το SSL; Ένα SSL πιστοποιητικό είναι ένα αρχείο που εγκαθίστανται στον server όπου φιλοξενείτε την ιστοσελίδα σας. Αποτελείται από ένα δημόσιο κλειδί, που κρυπτογραφεί τα δεδομένα, και ένα ιδιωτικό κλειδί που τα αποκρυπτογραφεί. Όταν ο client , πχ ένας web browser, συνδέεται στον SSL secured server, δημιουργείται ένα μοναδικό session που χρησιμοποιεί τα δύο αυτά κλειδιά. Όλα...28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Για ποιο λόγο χρειάζεται να εγκαταστήσετε SSL πιστοποιητικό στην ιστοσελίδα σας; Αν η ιστοσελίδα σας στέλνει ή δέχεται ευαίσθητα προσωπικά δεδομένα, όπως στοιχεία πιστωτικών καρτών, στοιχεία login, πληροφορίες μελών, τότε θα πρέπει να προστατεύεται από ένα πιστοποιητικό ασφαλείας.28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower"
