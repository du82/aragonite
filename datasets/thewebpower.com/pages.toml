full_description = "28Μαρ201721 Μαΐου, 2017Πως μπορώ να μεταφέρω από άλλη εταιρία το site μου χωρίς downtime ;Για να μεταφέρετε το site σας από άλλη εταιρεία στον δικό μας server ακολουθήστε τα παρακάτω βήματα:Μην διακόψετε τον λογαριασμό σας στην άλλη εταιρία μέχρι να ολοκληρωθεί η διαδικασία μεταφοράς. Κατεβάζετε τα αρχεία του site σας (backup) από τον παλιό server και τα ανεβάζετε με FTP στον νέο σας λογαριασμό στην THE WEB POWER (πρέπει να μεταφέρετε και τις βάσεις δεδομένων, αν υπάρχουν). Ελέγχετε από το προσωρινό URL (http://ip_address/~username), που σας παρέχουμε, αν το site σας λειτουργεί κανονικά μετά την μεταφορά. Δημιουργείτε τους λογαριασμούς email που χρησιμοποιούσατε μέσα από το control panel. Δηλώνετε στον καταχωρητή του domain name τους καινούριους nameservers τους οποίους λαμβάνετε από εμάς με το email ενεργοποίησης πακέτου φιλοξενίας. Χρειάζονται τυπικά έως 72 ώρες για να παίξει το site σας από τον δικό μας server. Μέχρι τότε θα συνεχίσει να λειτουργεί κανονικά από τον παλιό server.Για οποιοδήποτε πρόβλημα αντιμετωπίσετε κατά την διαδικασία μεταφοράς μπορείτε να επικοινωνήσετε με το τμήμα υποστήριξης της εταιρείας μας.0by thewebpowerin Web Hosting, Γνωσιακή ΒάσηShare It Facebook Twitter Pinterest"
