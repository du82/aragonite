description = "Web hosting -Επιλέγοντας το DNS Hosting έχετε την δυνατότητα διαχείρησης και αλλαγών στα DNS records του Domain Name σας."
full_description = "Επιλέγοντας το DNS Hosting έχετε την δυνατότητα αλλαγών στα DNS records του Domain Name σας. Κατοχυρώστε ή μεταφέρετε ένα ή περισσότερα domain στην THE WEB POWER, και θα μπορείτε να διαχειριστείτε εντελώς ΔΩΡΕΑΝ τα DNS records στα domain σας, ή να τα ανακατευθύνετε σε σελίδες της επιλογής σας. Έτσι, μπορείτε να τα συνδέσετε με υπηρεσίες της Google, Blogger κλπ. Όλα τα πακέτα φιλοξενίας της THE WEB POWER παρέχουν ΔΩΡΕΑΝ τη δυνατότητα αλλαγών των DNS εγγραφών. Σε περίπτωση όμως που δεν επιθυμείτε το Domain σας να φιλοξενηθεί σε κάποιο πακέτο, το DNS hosting είναι η καλύτερη επιλογή. Χωρίς μικρά γράμματα και κρυφές χρεώσεις. Η υπηρεσία διατίθεται εντελώς ΔΩΡΕΑΝ. Προχωρήστε απλά σε κατοχύρωση domain name και επιλέξτε την υπηρεσία του DNS Hosting. Χαρακτηριστικά DNS hosting Αριθμός DNS records: ΑΠΕΡΙΟΡΙΣΤΟΣ Δωρεάν εγκατάσταση 1 Domain name DNS εγγραφές που υποστηρίζει η υπηρεσία (Α) IPv4 Address Record (CNAME) Canonical Name Record (NS) Name Server Record (MX) Mail Exchanger Record (TEXT) Text Record (PTR) Pointer Record Απλό redirect – ΝΑΙ Δεν υπάρχει κανένας περιορισμός ως προς την κατάληξη του ονόματος χώρου που έχετε κατοχυρώσει. Το DNS hosting υποστηρίζει όλες τις δυνατές καταλήξεις ονομάτων. Κάθε πακέτο DNS hosting μπορεί να ενεργοποιηθεί για ένα Domain Name."
