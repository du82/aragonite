["https://www.thewebpower.com/author/thewebpower/page/8"]
title = "User account instructions - web hosting"
description = "FAQ - Έλαβα μήνυμα ότι η φιλοξενία ιστοσελίδων μου έχει ενεργοποιηθεί αλλά δεν μπορώ να δω το site μου. Τι συμβαίνει ;"
full_description = "Άρθρο Έλαβα μήνυμα ότι η φιλοξενία ιστοσελίδων μου έχει ενεργοποιηθεί αλλά δεν μπορώ να δω το site μου. Τι συμβαίνει ; Tο domain name σας δείχνει στους δικούς μας nameservers ; Χρειάζονται περίπου έως 72 ώρες για να ενημερωθούν οι internet providers σχετικά με αλλαγές στους nameservers. Έχετε ανεβάσει το site σας στο σωστό σημείο ; Όλα τα αρχεία και οι φάκελοι του site σας θα πρέπει να είναι ανεβασμένα στον φάκελο /public_html. Είναι η πρώτη...28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Τι συμβαίνει αν γεμίσει ο χώρος μου στον server ; Θα πρέπει να είστε προσεκτικοί να μην εξαντληθεί ο διαθέσιμος χώρος σας στον server γιατί δεν θα μπορείτε να λαμβάνετε emails. Ανά πάσα στιγμή μπορείτε να ελέγχετε τον χώρο σας μέσα από το cPanel. Σε περίπτωση που χρειάζεστε επιπλέον χώρο μπορείτε να κάνετε αναβάθμιση στο πακέτο σας.28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower Άρθρο Τί είναι το Control Panel ; Το Control Panel είναι ο πίνακας ελέγχου που σας παρέχουμε για τη διαχείριση των υπηρεσιών του πακέτου φιλοξενίας. Όλα τα πακέτα φιλοξενίας παρέχονται με την υποστήριξη του cPanel. Πρόσβαση στο cPanel έχετε μέσω http://yourdomain.com/cpanel όπου yourdomain.com το όνομα του site σας.28 Μαρτίου, 201721 Μαΐου, 2017by thewebpower"
