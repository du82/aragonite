title = "Οροι χρήσης"
description = "Οροι χρήσης των υπηρεσιών μας."
full_description = "H MEDIA POWER LTD με τον διακριτικό τίτλο THE WEB POWER διαθέτει προιόντα και υπηρεσίες Διαδικτύου μέσω των προσφερομένων από αυτήν Εξυπηρετητών Υπολογιστών Servers και από εδώ και πέρα θα αναφέρεται ως Εταιρία. Οι χρήστες του δικτυακού τόπου, των προιόντων και υπηρεσιών της Εταιρίας, που από εδώ και στο εξής θα αναφέρονται ως Πελάτης, υποδηλώνουν την πλήρη αποδοχή στους κάτωθι όρους και προϋποθέσεις που έχει θέσει η Εταιρία. Οι παρόντες όροι έχουν ισχύ ιδιωτικού συμφωνητικού για κάθε νόμιμη διαδικασία. Ο Πελάτης που δεν συμφωνεί με αυτούς τους όρους και προϋποθέσεις, οφείλει να μην προβεί σε χρήση του δικτυακού τόπου ή/και των προιόντων και υπηρεσιών της Εταιρίας. Προσωπικά Δεδομένα Ο Πελάτης μπορεί να περιηγηθεί στο δκτυακό τόπο της Εταιρίας χωρίς να δώσει προσωπικές πληροφορίες. Τα προσωπικά δεδομένα χρειάζονται μόνο όταν ο Πελάτης προχωρήσει σε παραγγελία υπηρεσιών ή προϊόντων. Τέτοιες πληροφορίες είναι τα απαραίτητα στοιχεία για κάθε συναλλαγή, όπως ονοματεπώνυμο, τηλέφωνο, διεύθυνση (οδός, πόλη, ταχυδρομικός κώδικας) και τα στοιχεία τιμολόγησης. Για την ενεργοποίηση οποιασδήποτε υπηρεσίας, ο Πελάτης δηλώνει στο δικτυακό τόπο τα στοιχεία επικοινωνίας του. Όλες οι πληροφορίες που διαβιβάζονται από τον Πελάτη είναι εμπιστευτικές και γίνεται χρήση τους μόνο μέσα στα πλαίσια των παρεχόμενων υπηρεσιών από την Εταιρία. Η Εταιρία μπορεί να επικοινωνήσει μαζί του για οποιοδήποτε ζήτημα αφορά τις υπηρεσίες που του παρέχει, για ενημέρωση για νέες υπηρεσίες, αναβαθμίσεις ή προσφορές. Τα προσωπικά στοιχεία του Πελάτη παραμένουν απόρρητα σύμφωνα με τη σχετική νομοθεσία και μπορούν να κοινοποιηθούν προς τρίτους μόνο αν υπάρχει έγγραφη εξουσιοδότηση από τον Πελάτη ή αυτό επιβάλλεται από δικαστική απόφαση ή απόφαση άλλης δημόσιας αρχής. Τα προσωπικά στοιχεία, σε καμία περίπτωση δε γνωστοποιούνται σε τρίτους για διαφημιστικούς λόγους. Η διαχείριση και προστασία των προσωπικών δεδομένων υπόκειται πάντοτε στις σχετικές διατάξεις του ελληνικού και ευρωπαϊκού δικαίου. Ο Πελάτης οφείλει να έχει πάντα τα στοιχεία επικοινωνίας του ενημερωμένα και να ειδοποιεί την Εταιρία για κάθε μεταβολή τους. H επικοινωνία της Εταιρίας προς τον Πελάτη για θέματα που αφορούν τον λογαριασμό του διεξάγεται μέσω ηλεκτρονικής αλληλογραφίας. Ο Πελάτης οφείλει να ελέγχει το email που έχει ορίσει σαν email επικοινωνίας ώστε να ενημερώνεται για όλα τα θέματα που τον αφορούν."
