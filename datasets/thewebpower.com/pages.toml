["https://www.thewebpower.com/how-to-transfer-your-joomla-website"]
title = "Joomla website transfer"
description = "Πώς να μεταφέρετε την Joomla ιστοσελίδα σας σε νέο χώρο φιλοξενίας."
full_description = "19Μαΐ201712 Ιουνίου, 2017Πώς να μεταφέρετε την Joomla ιστοσελίδα σας σε νέο χώρο φιλοξενίας.Πώς να μεταφέρετε την Joomla ιστοσελίδα σας στους servers μας.Αντιγραφή αρχείων με FTPΜια μέθοδος αντιγραφής των αρχείων είναι να χρησιμοποιήσετε το FTP για να κατεβάσετε πρώτα όλα τα αρχεία που περιλαμβάνονται στον ιστότοπό σας και στη συνέχεια να μεταφορτώστε τα αρχεία αυτά στον νέο server. Ο τρόπος αυτός λειτουργεί είτε αλλάζετε φάκελο εγκατάστασης, είτε αλλάζετε server.Είναι σημαντικό να διατηρήσετε την ίδια δομή καταλόγου για όλους τους φακέλους και τα αρχεία σας καθώς τα μετακινείτε από τη μια θέση στην άλλη.Σημειώστε ότι αφού μετακινήσετε τα αρχεία από μια θέση σε άλλη, ίσως χρειαστεί να επεξεργαστείτε το αρχείο ρυθμίσεων του Joomla ή και να κάνετε κάποιες αλλαγές από την πλευρά του server.Σε σπάνιες περιπτώσεις, ένα αρχείο μπορεί να καταστραφεί κατά τη διάρκεια μιας μεταφοράς FTP, όπου μόνο ένα μέρος του αρχείου μεταδίδεται με επιτυχία. Αν αντιμετωπίζετε παράξενα ή μη αναμενόμενα λάθη με το νέο σας Joomla μετά την αντιγραφή των αρχείων, ίσως χρειαστεί να μεταφέρετε τα αρχεία σας ξανά.Λήψη αρχείων από διακομιστή στον υπολογιστή σαςΧρησιμοποιήστε το λογισμικό FTP (π.χ. FileZilla) για να συνδεθείτε με το διακομιστή 2. Επιλέξτε τον κατάλογο που θέλετε να κατεβάσετε (κυρίως / public_html / ή / htdocs /) 3. Κάντε δεξί κλικ στο κουμπί + επιλέξτε αρχεία / φάκελο για λήψη ή σύρετε + αποθέστε το φάκελο από την προβολή “Απομακρυσμένη τοποθεσία” στην προβολή “Τοπικός ιστότοπος” 4. Θα ξεκινήσει η λήψη των απομακρυσμένων αρχείων 5. Αφού κατεβάσετε τα αρχεία, ελέγξτε για τυχόν σφάλματαΜεταφορτώστε αρχεία από τον υπολογιστή σας σε διακομιστήΒεβαιωθείτε ότι το configuration.php έχει τις σωστές ρυθμίσεις για το διακομιστή (ειδικά: localhost, βάση δεδομένων, χρήστη βάσης δεδομένων, κωδικός πρόσβασης βάσης δεδομένων, log_path, tmp_path) 2. Χρησιμοποιήστε το λογισμικό FTP (π.χ. FileZilla) για να συνδεθείτε με το διακομιστή 3. Επιλέξτε τον κατάλογο που θέλετε να μεταφορτώσετε, δηλαδή / public_html / 4. Κάντε δεξί κλικ στο κουμπί + επιλέξτε αρχεία / φάκελο για μεταφόρτωση ή σύρετε + αποθέστε τον φάκελο από την προβολή “Τοπικός ιστότοπος” στην προβολή “Απομακρυσμένη τοποθεσία” 5. Θα ξεκινήσει η μεταφόρτωση των τοπικών αρχείων στον απομακρυσμένο διακομιστή 6. Αφού μεταφορτώσετε τα αρχεία, ελέγξτε για τυχόν σφάλματαΑντιγραφή της βάσης δεδομένων με το phpMyAdminΤο εργαλείο phpMyAdmin μπορεί να χρησιμοποιηθεί για την εξαγωγή και εισαγωγή μιας βάσης δεδομένων, παρέχοντας έναν απλό τρόπο να αντιγράψετε ένα αντίγραφο μιας βάσης δεδομένων χρησιμοποιώντας διαφορετικό όνομα στους διακομιστές μας.Εξαγωγή αντιγράφου της βάσης δεδομένων στον υπολογιστή σαςΣυνδεθείτε στη βάση δεδομένων που θέλετε να αντιγράψετε χρησιμοποιώντας το phpMyAdmin 2. Κάντε κλικ στο όνομα της βάσης δεδομένων στην αριστερή πλευρά της σελίδας. 3. Επιλέξτε την καρτέλα Εξαγωγή 4. Επιλέξτε την επιλογή Αποθήκευση ως αρχείο 5. Κάντε κλικ στο κουμπί ΜετάβασηΣτη συνέχεια, θα σας ζητηθεί να αποθηκεύσετε το αρχείο βάσης δεδομένων στον προσωπικό σας υπολογιστή.Εισαγωγή του αντιγράφου σε μια νέα βάση δεδομένωνΘα πρέπει πρώτα να δημιουργήσετε τη νέα κενή βάση δεδομένων στον διακομιστή σας χρησιμοποιώντας τον πίνακα ελέγχου. Πρέπει να είναι UTF8 (utf8_generic_ci). Μετά τη δημιουργία της νέας βάσης δεδομένων:1.Συνδεθείτε στη νέα βάση δεδομένων χρησιμοποιώντας το phpMyAdmin 2.Κάντε κλικ στο όνομα της βάσης δεδομένων στην αριστερή πλευρά της σελίδας 3.Επιλέξτε την καρτέλα Εισαγωγή 4.Κάντε κλικ στο κουμπί “Αναζήτηση” στο “Αρχείο για εισαγωγή”, στη συνέχεια επιλέξτε το αρχείο βάσης δεδομένων από τον υπολογιστή σας 5.Κάντε κλικ στο κουμπί Μετάβαση για εισαγωγή της βάσης δεδομένωνΣυμβουλή: Εάν δείτε ένα σφάλμα “Δεν έχει επιλεγεί βάση δεδομένων”, πιθανότατα επειδή ξεχάσατε να κάνετε πρώτα κλικ στο όνομα της βάσης δεδομένων στην αριστερή στήλη.Αλλαγή του configuration.phpΠροκειμένου το Joomla να λειτουργήσει στο νέο διακομιστή, θα πρέπει να κάνετε τις απαραίτητες αλλαγές στο configuration.php. Θα πρέπει να ελέγξετε / να επεξεργαστείτε τα παρακάτω στο:var $host = ‘localhost’; // usually “localhost”. var $user = ‘the_db_username’; var $db = ‘the_databasename’; var $password = ‘the_db_password’; var $live_site = ”; // is usually empty.Το Joomla θα λειτουργήσει, ακόμη και αν το $ log_path και το $ tmp_path είναι λάθος, αν και δεν θα μπορείτε να εγκαταστήσετε επεκτάσεις. Συνδεθείτε στο διαχειριστικό του νέου ιστότοπού σας στο Joomla.Στο Joomla 1.5: Βοήθεια> Πληροφορίες συστήματος> Δικαιώματα καταλόγου. Δείτε τις κάτω τέσσερις σειρές:Cache Directory /var/www/example.com/cache/ Writable Cache Directory /var/www/example.com/administrator/cache/ Writable Log Directory ($log_path) /var/www/some/other/folder/example.com/logs/ Unwritable Temp Directory ($tmp_path) /var/www/some/other/folder/example.com/ UnwritableΑν τα αρχεία $ log_path και $ tmp_path δεν έχουν δικαιώματα εγγραφής, θα χρειαστεί να αλλάξετε τις τιμές στο configuration.php.Χρησιμοποιήστε τις τιμές του “Κατάλογος Cache” χωρίς το τμήμα “/ cache /” και αλλάξτε τα $ log_path και $ tmp_path στο:var $log_path = ‘/var/www/example.com/logs’; var $tmp_path = ‘/var/www/example.com/tmp’;Εάν τα δικαιώματα καταλόγου δείχνουν ότι το $ log_path και το $ tmp_path είναι “εγγράψιμα”, θα πρέπει να μπορείτε να εγκαταστήσετε επεκτάσεις.Τώρα το τελευταίο βήμα. Μεταβείτε στον καταχωρητή του domain σας και αλλάξτε τα dns.Αντικαταστήστε τους παλιούς διακομιστές ονομάτων με τα νέα DNS που σας έχουμε στείλει.Ο Joomla ιστότοπός σας θα είναι ορατός στο νέο σας web hosting μαζί μας σε περίπου 24 ώρες.0by thewebpowerin Web Hosting BlogShare It Facebook Twitter Pinterest"
