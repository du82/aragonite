title = "Home | The White Pube"
full_description = "this month's resident: Daryl Rainbow 🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨ For the past 4 years, we’ve been giving £500 a month to a creative in the UK. Grant #053 goes to Daryl Rainbow whose work you can see below. If you like Daryl’s work, here is a link to his shop where you can grab a print :) DARYL RAINBOW: ‘I was born in Manila, Philippines and moved to the UK with my mum when I was 3. I grew up on the outskirts of London living in areas near Heathrow and now like every other creative I live in Hackney. I went to Camberwell College of Arts, part of UAL, and graduated with a BA in Illustration. I have been working full time as a freelance illustrator since 2017. I am based in East London and work from my studio in Hackney Downs Studios. A lot of my work is inspired by cultural trends and zeitgeists. In particular the bullshitty, gentrification-ey stuff in East London and also the ever dramatic world of football. I have created work for clients such as: Adidas, Netflix, Creative Review, The Times, Arsenal FC, Nike, Time Out, Under Armour, Radio Times, Amazon UK, Harry’s, West Ham United FC, etc. I also work as a lecturer at Ravensbourne University on their BA Illustration course.' This month’s grant is funded by a reader called E.R. – thank you E.R.! and if you want to donate to keep the grant going please email us (info [at] the white pube [dot] com) find out more about the grant 🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨🌈✨"
