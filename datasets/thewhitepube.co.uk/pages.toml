["https://thewhitepube.co.uk/funding-library"]
title = "Funding Library | The White Pube"
description = "successful funding applications you can learn from"
full_description = "Successful Funding Application Library Funding applications are forms you complete and submit to funding bodies, organisations or trusts in the hopes of gaining money to support something you would like to do. In the arts, funding covers all sorts: a gallery’s running costs and programming, artist fees, staff payment, materials, money for research and development, marketing, printing, production, archiving, organisational development, travel… everything really. The arts relies on it. Artists and groups apply for themselves and if they’re lucky, they’ll get something; and big galleries apply to lots of different private and public funders in order to make up their big budgets. But knowing where to start when writing an application can be difficult; knowing who to apply to can be tricky as well. This library is a resource of successful funding applications that you can learn from. Personally, I found writing them really confusing until I spent time reading some and then I could finally get a handle on the language used and the way budgets are put together. Take a look below, see if anything is relevant to what you're hoping to do, or learn from other applications' writing and shape. Look at what is being applied to and where, and check out the funders these are addressed to see to if they are appropriate for your project. The library will grow and we’ll try to furnish this page with even more information so that everyone can hopefully secure themselves some £££. If you want to share a successful application, please click this form for more info; and if you cannot submit click this link instead for submissions directly to our email Some words have been redacted by choice of the people sharing the apps We recently made a podcast called 'Everything you need to know about funding.' Search The White Pube on Spotify or Apple Podcasts or listen to it on our website where you can also find the transcription. Hope between this podcast and the examples below, you can find some help! LIBRARY Filter by grant for specific grant! ⭐️ SUCCESSFUL APPLICATIONS ⭐️ If you want to open the library on a separate page, click here. MORE INCOMING HOLD TIGHTTTTTTT WAITING FOR APPLICATIONS TO ROLL INNNNN… ⭐️ OTHER LINKS/DOCUMENTS THAT MIGHT HELP: 1. Easier to read Top 10 Tips for funding applications from DASH Arts 2. PDF from 'Writing Applications for Funding: Workshop' by Sophie Chapman, for Into The Wild Artist Development Programme, August 2020 3. We recently made a podcast called 'Everything you need to know about funding.' Search The White Pube on Spotify or Apple Podcasts or listen to it on our website where you can also find the transcription. 4. Web link for Arts Council England's access support for help in completing applications 5. Grant for the Oppenheim Downes Trust for aged 30+ applicants 6a. Arts Council England's Developing Your Creative Practice fund. Grant range is £2k-£10k and it is aimed at individual practitioners for research and development. 6b. Arts Council England's Developing Your Creative Practice list of recent grants given. 7. PDF for Access Support information from Arts Council England (helpful for everyone imo) 8. Templates for Arts Council Applications on the Uncultured’s website, including the new Under 30K Project Grant 9. Artist Commissioning Contract Crib Sheet - ie. an Easy Read Artist contract template for use between artists and galleries/organisations they are working with 10. Introduction to the Easy Read Artist Contract from Jack Tan and FACT ^ ie. info on the link above this one … … … MORE COMING SOOOOON… IF ANYONE U KNO HAS AN APP OR GOOD LINK, SEND EM TO THIS PAGE!"
