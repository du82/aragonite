["https://thewhitepube.co.uk/grants"]
title = "The Creatives Grant | The White Pube"
description = "let's make art less middle class"
full_description = "The White Pube Creatives Grant The White Pube Creatives Grant is a one-off £500 grant to be given out to a different working class creative practitioner based in the UK once every month. This grant has been set up to support creatives of all ages who are early in their careers and would benefit from this no-strings attached financial support to help them in whatever they like - be that money to cover time to make, or money to fund materials, equipment, research, subscriptions, development, travel, or even rent and bills. The grant is open to anybody who makes stuff. Art, writing, performance, sound, music, craft, comedy, games, whatever you want to throw at us. Anybody can put themselves forward by emailing [email protected]. Give us a brief introduction to yourself, contact information and an example of your work. There is no deadline as this is a monthly rolling grant, and the grant does not expect any outcomes or reporting. If you are not awarded the grant one month, your submission is still taken into consideration for future months so there is no need to re-submit. We share the work of each recipient on The White Pube homepage, plus you can find more information about previous recipients below. Click here to read FAQS FUNDERS: Previously, the grant was wholly funded by an organisation called Creative Debuts who supported 46 recipients from September 2020-June 2024 but now we are supported by different TWP readers and supporters who want to keep the grant going. If you are able to fund one, or two, however many grants you like, please get in touch. The whole world would appreciate it. SELECTORS: The White Pube is the collaborative identity of Zarina Muhammad and Gabrielle de la Puente through which we write about exhibitions, video games, books, films, the art industry and more on this website & across social media as @thewhitepube. We are based in London and Liverpool respectively. I know how rough it is to try getting into the arts with no financial backing, no safety net, no connections, the wrong clothes, the wrong accent and all the rest of it. 500 quid isn’t going to solve everything but between a bit of cash and our public backing, we hope will help at least a little. February 2025: Recipient 53, Daryl Rainbow The 53rd recipient of the Creatives Grant is Daryl Rainbow. Daryl is an illustrator in London. His work is inspired by cultural trends, zeitgeists, ‘the bullshitty, gentrification-ey stuff in East London’ – the kind of thing that feels semiotically important, but that i don’t think we have a very good language for talkign about. It caught my eye immediately, because there’s something fun and tough in Daryl’s work, something like love for a city like London, that cannot possibly belong to you even though you belong to it. Something about the flaneur, the passerby or the witness. Daryl sent over a portfolio and I just felt deeply moved by his Neo Neo Classical Hackney series – you can peep some of the illustrations from that series on our homepage. How this grant has been funded: Creatives Grant 053 has been funded a reader, E.R. – thank you E.R., and if you want to donate to keep the grant going please email us (info [at] the white pube [dot] com) BIO: I was born in Manila, Philippines and moved to the UK with my mum when I was 3. I grew up on the outskirts of London living in areas near Heathrow and now like every other creative I live in Hackney. I went to Camberwell College of Arts, part of UAL, and graduated with a BA in Illustration. I have been working full time as a freelance illustrator since 2017. I am based in East London and work from my studio in Hackney Downs Studios. A lot of my work is inspired by cultural trends and zeitgeists. In particular the bullshitty, gentrification-ey stuff in East London and also the ever dramatic world of football. I have created work for clients such as: Adidas, Netflix, Creative Review, The Times, Arsenal FC, Nike, Time Out, Under Armour, Radio Times, Amazon UK, Harry’s, West Ham United FC, etc. I also work as a lecturer at Ravensbourne University on their BA Illustration course. LINKS: Follow Daryl on Instagram Here is Daryl’s shop! Here’s Daryl’s website January 2025: Recipient 52, Francesca Dourado Happy new year you lot!!!!!! New month means a new grant recipient, and we are happy to announce that we’ll be giving the 52nd monthly creatives grant to Bristol-based artist Francesca Dourado -> @francesca_dourado. In the early stages of her practice as a ceramicist, Francesca makes work that looks like melting seashells, inverted glassy irises and perfect little relics from grandparents’ cupboards. We can’t wait to see more of it — aaand since we sent her a message offering her this month’s grant, Francesca has been announced as one of the contestants on this year’s Great Pottery Throw Down! We have great taste, it’s confirmed. We’re psyched other people will get to see her creations and we hope this £500 helps her on the way :) We don’t expect any concrete goals when people put themselves forward for the grant but Francesca mentioned opening a studio space in which she could ‘encourage other BAME potters to discover their craft in a community which is massively underrepresented in the ceramics world.’ We liked imagining that, because we like imagining a world in which there is no need to talk of representation or underrepresentation, because everyone is invited to the table — because everyone gets to be an artist. How this grant has been funded: Creatives Grant 052 has been funded by Holly Gramazio – thank you to Holly, and if you want to donate to keep the grant going please email us (info [at] the white pube [dot] com) BIO Francesca Dourado is an artist based in Bristol, specializing in ceramics. Her love for the medium was ignited in 2023 when she undertook an intensive pottery course in India, where she discovered a deep passion for the craft. Since then, ceramics has become both a creative outlet and a personal journey, allowing her to explore the delicate balance between form and function. Drawing inspiration from the natural world, Francesca’s work blends organic shapes with modern design, with a particular focus on wood-fired ceramics. This technique gives unique textures and earthy tones, each one telling its own story. With a relentless curiosity and an unwavering passion for ceramics, Francesca continues to evolve as an artist, creating pieces that are as much about the process as they are about the finished form. LINKS Here’s Francesca’s instagram December 2024: Recipient 051, Toby Rainbird The 51st recipient of the Creatives Grant is Toby Rainbird. Toby is an artist and curator based in London. He sent over some images of his paintings and an essay about them and – we obviously loved them, we loved his description of his paintings as visual flirting. cheeky, playful, shiny and dazzling. isn’t that the best thing a painting can be? For us, for me, i think so. images are so everywhere and yet painting still holds a power because of its energy !! and we felt that energy the painter put in, radiating back at us, even through the screen. magic magic, there’s no disputing it when it’s there. How this grant has been funded: Creatives Grant 051 has been funded by Holly Gramazio – thank you to Holly, and if you want to donate to keep the grant going please email us (info [at] the white pube [dot] com) BIO Toby Rainbird (b. 1994, Jersey, C.I.) is a British artist and curator based in London. He recently completed an MA in Painting at the Royal College of Art, where he was awarded the university’s prestigious Hine Painting Prize. In 2016, he graduated with First-Class Honours in Fine Art from the Bath School of Art & Design, receiving the Outstanding Achievement in Fine Art Award. Rainbird has exhibited extensively across London, the UK, and internationally in Japan, Germany, and Canada. LINKS Here is Toby’s website Follow Toby on instagram image creds for Toby’s portrait: Reliant Imaging November 2024: Recipient 050, Ira Putilova The 50th recipient of the Creatives Grant is Ira Putilova. Ira is a director and editor based in London. Ira sent over a link to their documentary: Bender Defenders, about a queer Muay Thai club in East London. It’s one of those artworks that is about one thing on the face of itself, and then it slices through to something deeper. It’s about community, vulnerability, when you’re training hard with other people you see them at this point of exhaustion, some true essence of their self emerges. It’s funny that most coversation around sport or fitness doesn’t really engage with that: the raw or fundamental humanity that is exposed in repeated exertion, in response to fear, pain, tension, impact. That vulnerability is kind of something you need to offer up if you ever want true connection, to be truly seen for the person you are, to be held, known, loved. I wasn’t expecting a philosophical enquiry into the human condition when i pressed play on a documentary about a queer Muay Thai club, but Ira’s documentary is – not to be dramatic, but it is genuinely profound. Unfortunately we can’t host a screener link, but it’ll be screened at the St. Louis International Film Festival and the Norwich Film Festival both in November – hopefully if you catch it in either of those places, you find it as profound and moving as we did! How this grant has been funded: Creatives Grant 050 is the last of 4 grants funded by a reader named Nina – thank you to Nina for your generous donation, and thank you for helping us support creatives in this way! BIO Ira Putilova is a non-binary director and editor living in London. Born and raised in Russia, Ira was a member of several Russian art-activist groups and directed films that condemned state crimes, police brutality and violence against queer people. Since Ira had to flee persecution by Russian authorities and claim political asylum in the UK in 2013, they continued to both direct and edit a body of work that explores themes of gender, bodies, poverty, migration, belonging and queerness. Ira was selected for Doc Leipzig Short’n’Sweet 2020, Grierson DocLab’s Editing Scheme 2021 and IDFAcademy 2024 and has worked as assistant editor and editor on high-end Netflix, Channel 4, ITV, and Sky documentaries. Ira worked on CHERNOBYL: THE LOST TAPES which won several BAFTAs in 2023, whilst LOVE LANGUAGES, a Netflix short film that Ira co-edited, was long-listed for a BAFTA. Alongside their debut documentary feature LOOK AT ME AND THEN UP, Ira directed BENDER DEFENDERS, an award-winning short documentary about members of a queer Muay Thai club in East London. LINKS You can find Ira on Instagram This is the Bad Table Manners website, a film production company Ira is a mamber of This is the Bender Defenders Instagram, if you want to stay tuned for updates on where it’ll be screened next :) October 2024: Recipient 049, Nouria Bah The 49th recipient of the Creatives Grant is Nouria Bah! Nouria is a musician based in London, she sent over a link to her EP: Don B4. We really enjoyed the laidback smoothness of the work, so effortless and light. Nouria’s email made mention of the close harmonies she enjoys using in her work and it became all I could hear – the way voice and music moved together ever so tightly. Some parts tinkling like glass (instrument and voice) or doubling over like a drop shadow, cigarette paper between them. It felt like listening to two hands holding each other, tender, loving, careful, overlapped. I love finding bits of culture like that, bodily and felt and ethereal. I’ve been listening to Nouria’s work on repeat in the background while the seasons change (heavy into autumn) and it has been such sweet smoky company. We hope you enjoy it as much as we have! Don B4 is out on 11th October, Nouria will be performing at SJQ in Dalston on 21st October (TICKETS HERE). How this grant has been funded: Creatives Grant 049 is the third of 4 grants funded by a reader named Nina – thank you to Nina for your generous donation, and thank you for helping us support creatives in this way! BIO: Nouria Bah is a musician and audio producer who combines her love of close harmonies, silly puns and catchy basslines to create bricolage-like grooves. With roots in Senegal/Guinea, she grew up in the US before moving to London in 2011. Since then, she has contributed to various experimental/indie projects and performed at award-winning festivals including We Out Here 2023. Her songs have also been featured on BBC Radio 6/Introducing, Jazz FM, Soho Radio, NTS, and Resonance FM. As the title track and lyrics suggest, the songs on her debut EP, “Don B4” out October 11th, 2024 have “all been done before” in different setups and ensembles throughout the years. It is now officially recorded and mastered with the help of amazing musicians Kyle ACAB (All Cats Are Beautiful, Widget), David Sappa, Anna De Mutiis, Deborah Borg Brincat (BERNE), Loretta Tosson and the mentorship of her piano teacher Harry Oakes. “The title track is loosely based on meeting someone at a party who got annoyed when I explained I made music. She explained how she lives in Berlin where everyone is a musician and how boring that is. I made Don B4 partly to address this idea and my feelings of inadequacy when trying to make and perform songs. It is also a slight homage to the film Don starring Amitabh Bacchan which I was watching at the time and the lyrics include a cheesy Eminem pun.” LINKS: Instagram Bandcamp Soundcloud Spotify Youtube September 2024: Recipient 048, Haoran Bie The 48th recipient of the Creatives Grant is Haoran Bie! Haoran is a ceramic artist and designer based in London. We found his work really exciting. It is handmade, so clean and contemporary. We respect the craft, skill and precision that’s obvious behind that sleekness, the experience and work that it must have taken. His work is also whimsical, playful, still functional and beautiful. It’s an approach to art, design and craft that I really respect and enjoy. Why shouldn’t the objects in our homes, that we use everyday, be very very cool and interesting? Why shouldn’t they be pleasing and delightful! Art belongs in homes and in hands just as much as like, clean white walled galleries. We grateful that we get to support Haoran’s work in this way, and we hope this grant will enable him to continue making things that feel tender, exciting, whimsical and skillful. How this grant has been funded: Creatives Grant 048 is the second of 4 grants funded by a reader named Nina – thank you to Nina for your generous donation, and thank you for helping us support creatives in this way! BIO: Haoran Bie is a London-based ceramic artist and designer whose work is deeply rooted in the meeting point between traditional craftsmanship and contemporary design. With a background in product design, Haoran has been working on his ceramic skills since 2021, specialising in throwing, ceramic casting and mould "
