full_description = "Poor Artists our book Poor Artists is out now in hardback, audiobook and ebook. It is a fictional quest through the real art world. Using dialogue from anonymous interviews we did with people across the industry, we ridicule a contemporary art world that has turned art into artworks, art schools into art universities, and creative expression into cut-throat competition 👹 get it from an indie bookshop! or a big bookshop! or a library! POOR ARTISTS HAS JUST BEEN SHORTLISTED FOR THE GORDON BURN PRIZE WOOOOOO EVENTS 2024/25: Oct 3 — London Review of Books ✅ Oct 15 — Crafts Council Book Club ✅ Oct 24 — The Margate Bookshop ✅ Nov 5 — Institute of Contemporary Arts, London ✅ Nov 22 — Edinburgh’s Radical Bookfair @ Lighthouse ✅ Nov 23 — Generator Projects, Dundee ✅ Nov 25 – Central Saint Martins, London ✅ Jan 8 – Academy of Fine Art, Munich ✅ Jan 24 – London Art Fair ✅ Feb 1 – Sirius Arts Centre, Cobh, Ireland ✅ Feb 20 – Phoenix, Leicester ✅ Feb 24 – Toppings, Bath ✅ Feb 27 – Bluecoat, Liverpool Mar 4 – Nicer Tuesdays, London Mar 20 – Uni of Sussex Apr 17 – Jwllrs, Morecambe May 8 – Newcastle Centre for Literary Arts WHAT PEOPLE ARE SAYING ABOUT THE BOOK: Legacy Russell said it is ‘an indispensible read’! Nathalie Olah said ‘this is a landmark for art writing’! Travis Alabanza said ‘I finished the book overwhelmingly grateful that it exists’! The Tate’s bookshop said ‘the most essential and significant story of Art in 2024’ hahaha. We’re tracking press on this page! it’s going WEIRDLY WELL WHERE TO GET IT: Still in the midst of putting this list together but besides the usual suspects, you can get the book from the following independent bookshops* NORTH Dead Ink Bookshop, Liverpool unitom, Manchester Colours May Vary, Leeds West Kirby Bookshop, Birkenhead The Whitworth, Manchester MIDLANDS IKON gallery, Birmingham Drop City Books, Stoke-on-Trent Lark Books, Lincoln SOUTH Hastings Bookshop The Margate Bookshop Resident, Brighton Aspex, Portsmouth De La Wa