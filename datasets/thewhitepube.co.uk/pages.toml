title = "The White Pube™ Podcast | The White Pube"
full_description = "The White Pube™ Podcast on The White Pube, we publish a new text every Sunday. We always record texts incase people want to listen instead of read, and so TWP podcast is a collection of those recordings as well as a few chatty episodes now and again. we use this page to link transcriptions to those outlier episodes. listen to the latest episode -> or subscribe on APPLE, SPOTIFY, YOUTUBE, BREAKER, POCKET CASTS, RADIO PUBLIC & ANCHOR Click here for transcription Episode 24: Should museums give back stolen objects? Dahomey is OUT TODAY on MUBI -- directed by Mati Diop, it's a film about the restitution of objects in Western museums. We spoke to Dan Hicks and Sumaya Kassim for a special investigative episode about whether museums should give back their stolen objects. Click here for transcription Episode 23: Galleries, Get it Together! We have a cheeky bonus guest episode from Art Assassins, a collective based out of South London Gallery. They’ve been investigating the role galleries play in public life and they’ve put their research together in this episode, especially for your ears! Click here for transcription Episode 22: Ins and Outs for 2024 listen it's too early in the year to jump straight into criticism, we haven't even recovered from last year, so we're kicking off 2024 with a new year's resolutions tirade about learning arabic, fucking off Adidas, staring into space, falling in love with musicals, and cancelling ezcema. There's audio, video and a transcription. enjoy the holy trinity you nice people Click here for transcription Episode 21: We got a book deal???? we've been meaning to record this story for the past year and a half but we actually just got so busy writing the book and we shouldn't really be messing about uploading podcasts about it because it STILL isn't done 🤡 Click here for transcription Episode 20: Every Nando's is a Gallery Did you know Nando’s has the biggest collection of contemporary Southern African art in the world? In this week’s SPECIAL episode, we explore Nando’s massive patronage of the arts. Over the past 20 years, they’ve purchased over 28,000 thousand pieces! We meet with 3 artists in South Africa who have benefitted from this support — Nkosinathi Quwe, Colijn Strydom, and Viven Kohler — and we speak to Cape Town arts organisation Spier Arts Trust who run multiple artist development programmes sponsored by Nando’s. 🌶 Leave a chilli emoji in the comments on our instagram once you’re done listening :D Click here for transcription Episode 19: ART SCHOOL! a weird place for weird people doing weird things. these are 3 texts that discuss ways it could all be less WEIRD! Click here for transcription Episode 18: SOUND! (& Jai Paul Supremacy) it's just a really weird coincidence Click here for transcription Episode 17: covid is obsessed with me tired tired tired Click here for transcription Episode 16: In Conversation with Holly Márie Parnell! Holly Márie Parnell ! A filmmaker, a friend, a really lovely person !!! This podcast episode was mostly recorded at a live event a couple weeks ago at Sirius, an arts centre in Cobh, Ireland. Sirius are showing Holly's film, Cabbage. We chat about loads of things: about the film itself but also beyond, about filmmaking as an act of love, engaging with text through the medium of film, shrinking your rig to try and make filmmaking a portable, inconspicuous practice as you relate to your subjects, and MORE! enjoy! Click here for transcription Episode 15: An interview with v buckenham new series! our brains are soup while we are busy writing a book so we are outsourcing your entertainment and learning and art-thinking; please enjoy the first of many interviews with interesting people we know, starting with v buckenham Click here for transcription Episode 14: REVISITED: THE ULTIMATE WHITE PUBE REVIEW We revisit the ultimate White Pube review: a 2016 text Gab wrote about Jesse Darling's show, The Great Near, at Arcadia Missa. Click here for transcription Episode 14: Instagram has ruined the art world. What now? Is Instagram a good place to share art? It's like we are all standing in the same town square screaming for attention but we can't even clearly hear the screams because we are screaming too. In this episode, we discuss the limits of centralised social media for artists and we also look at the alternatives -- with special guests Kim Foale and honor ash. Click here for transcription Episode 13: ART SCHOOL HORROR STORIES We asked our audience for the weirdest things they witnessed in art school and, unfortunately, they delivered. Today's episode is Art School Horror Stories, discussing bodily fluids, animals, weird students and weird tutors. Click here for transcription Episode 12: Our biggest fight ever We recorded an Ask Me Anything to celebrate 7 years of The White Pube. We get INTO it. We talk about Zarina's day job, the few days we worked for the Brexit festival, going viral, health, the future, what we would do if the other one died, fuck-marry-kill, hair conditioner, and of course, our biggest fight ever. We actually recorded this so if you'd prefer to watch, check out our youtube channel! Click here for transcription Episode 11: My diagnosis has changed I got COVID in January 2021 and I spent last year in a pit, stuck at home, no energy, in pain, dealing with the vague endlessness of Long Covid. In the middle of January 2022, I posted a one year update podcast episode where I told everybody how bad Long Covid continued to be. And then, at the end of that month, I had an in-person appointment with the Long Covid Clinic in Liverpool where they did a test and told me what brand of Long Covid I had. This episode is all about the disability COVID has left me with, POTS. Click here for transcription Episode 10: Are white girls capable of making art that's not about themselves? REVISITED! continuing this series where we look back on old texts, we re-read and then discuss the 2019 white girl art text that was read by too many people, got us cancelled by one very angry person in the DMs, is possibly the only text I wish I'd spent more time on, and made me extra paranoid as a writer ever after Click here for transcription Episode 9: Who doesn't have a praise kink? We’ve known each other since 2013 but now we know each other on quite frankly an unnecessary level after recording this episode lmao. Using a few decks courtesy of So Cards, we ask each other some set questions and end up discussing smoking, Zarina’s dream job, education reform, how our exes don’t exist, IBS in public, taxi drivers, becoming Jack Grealish, and of course, our shared praise kink. Click here for transcription Episode 8: I hate Dishoom The 2nd in the new podcast series, we revisit Zarina's 2020 text 'I hate Dishoom' that caused... a ruckus. How does she feel about it now? Was it even that deep? Did the owner of Dishoom get in touch and did they meet to discuss it? Find out on the latest episode of the white pube podcast wooo Click here for transcription Episode 7: Why museums are bad vibes We are starting a new series on our podcast where we revisit and discuss old texts. In this first instalment, we look at Gabrielle's 2019 text 'why museums are bad vibes.' Spoiler: they are even worse vibes here in 2022. Click here for transcription Episode 6: A Year of Long Covid As soon as we finished recording, I could already think of a million other things I wanted to say. But this is all I could give you for now. This episode of The White Pube podcast reflects on this year of Long Covid, of becoming housebound, of losing community and finding community, and making difficult decisions. Click here for transcription Episode 5: The Long Covid Episode In this episode, we have a quick catch up about what we've been doing in the 4-5 months we haven't recorded new episodes and then we get into it. Gab got COVID and it has just... not... gone. We talk symptoms, recovery and where she's at now. Has her relationship with her body changed? Is a sickness a part of her identity now? How long will these even last? I don’t know. But we both had a cry while filming this. It's all been so emotional. Click here for transcription Episode 4: Everything you need to know about funding This time you don’t just have to put up with us telling stories and making each other laugh - this episode is actually USEFUL, thank GOD. It is the funding episode! And for it, we are joined by Anna Hart who is going to talk us through everything you need to know about (arts) funding (in the UK). We wanted to rope Anna into this podcast episode to do an explainer on funding because she's the one that taught us the ins and outs. And it’s tricky - like honestly what is it, how do I get some for myself, and where is the money coming from? In this episode, we chat about the logistics of arts funding, the criticisms of it too, and offer some tips on writing a good application. Have a listen and hope it is useful! Click here for transcription Episode 3: Kardashians and Kottagecore This episode of our podcast is, quite frankly, a continuation of last episode's mild chaos. We talk about reality TV: why we love(d) it, what we can't stand now we're in pandemic-lockdown, and what we'd do if we were mind-bogglingly rich. We chat about That Tweet about Kim Kardashian's birthday, and why being a millionaire is FUCKING DESGOSTENG, but also, for some unknown reason, Gab tells us a story about how her driving test was terminated for dangerous driving!? I promise next episode we'll have some actual art content that is useful and serious, we've just got that end-of-year feeling; wana bunk off French lessons, or watch a film in class on the box telly, instead of doin work. Click here for transcription Episode 2: The culture that saved us in lockdown This second episode of our much-lauded podcast is a lil lockdown special where we chat about the bits o' ~culture~ that've been getting us through the hellscape that is 2020. We chat about Gab's freaky psychic connection with the radio, (romantically speaking) why Zarina loves period dramas, and like... a lot of wheezy laughing away from the microphone, and tryna hold in an enormous honking snort laugh while Gab tells a story about how she nearly proposed on a bungee jump in the Millennium Dome. All Quality, Top-Notch, Intellectual, high-brow Art Critic stuff. Click here for transcription Episode 1: Origin Story We start this new era of lockdown podcasting with the full origin story of how we came to begin our little website and why, again wtf, five years later it is still our actual job. Covering uni, values, audiences, writing, travel and the move into games, we go through every little step of this journey in detail. Most of our freelance work over the past few years has involved doing a 1 hour version of this talk in different art schools and galleries, so reaaaally, we are shooting ourselves in the foot a bit by putting the ultra deluxe version online. Oh well."
