full_description = "blog hello we post our Big Important texts that take us ages to write on the /reviews tab but this page is our BLOG where we let loose, forget to spell check, write quick things about whatever we want, and jusss do some old school bloggin baby ✌.ʕʘ‿ʘʔ.✌ Coming to Manchester and Leicester! see ya soon gang i was on the conversation art podcast talking about poor artists, and some desperate things I did when I was younger lol ow shortlisted for the gordon burn prize! AHHHH Good YouTube #8 i am the best at youtube please enjoy my recommendations there's a liverpool event for the book!!!! see you at the bluecoat yerrrse huck interview with Isaac Muk!!! full circle baby see u in drogheda @ Highlanes Gallery I read more books this year than i ever have before books are sooo good i had forgotten tbh everything we wrote in 2024 every SINGLE thing we were on the All About Art podcast with Alexandra Steinacker 🍋 LADS I FANCY #33 i don't really need to explain this one WOULD YOU LIKE A PRESENT hehehe our book is up for a prize maybe! Poor Artists has been longlisted for the Gordon Burn Prize goblinhood event! tickets here yer dirty goblins save Soanes @ tower hamlets council gift guide! pretending to be a really normal blog for one post some book press, please click on this or don't, see if i care book tour shenanigans getting film developed is the highlight of my life Good YouTube #7 i am the best at youtube please enjoy my recommendations how to write good exhibition interpretation or how 2 make me happy deleting twitter good riddance Good YouTube #6 i am the best at youtube please enjoy my recommendations some book events! we're on tour BabYYYY the book is out omg and i had my film camera with me during launch week! Endorsing PACBI We’re signing up to PACBI, the Palestinian Campaign for the Academic and Cultural Boycott of Israel Ranking the names in my family tree this is what blog posts were made for things ive been enjoying lately knitting, linkin park, and art-porn 1 month til the book i have touched the real thing Good YouTube #5 i am the best at youtube please enjoy my recommendations Good YouTube #4 i am the best at youtube please enjoy my recommendations I got a kitten a message to susanna clarke I knitted our book cover it's pretty good I wrote about Harry Josephine Giles Deep Wheel Orcadia & disability praise 4 poor artists it's starting i did a reading at the fitzcarraldo summer party yes, i did! LADS I FANCY #32 who else??? Good YouTube #3 i am the best at youtube please enjoy my recommendations The Creatives Grant is BACK ON, BABY someone did indeed raise their hand, but tbf we need more hands Newcastle & Turps! i love my job! learning spanish muy bien la sangre llama The Creatives Grant is on PAUSE if you're rich and also nice please raise your hand desert island discs important information Good YouTube #2 i am the best at youtube please enjoy my recommendations AGAIN bbc radio london interview with Karim Bitar how to pre-order our book in the US WALMART ETC. Good YouTube i am the best at youtube please enjoy my recommendations imagine this website is a vending machine i am j pushing another lil blog thru to send the last one on its way WHAT I SAW LAST WEEK: 29th April i've been to see lots of exhibitions, honestly loads -- 2 weeks worth of SURPLUS STUFF! WHAT I SAW LAST WEEK: 22nd April holly hendry @ temple station roof garden, the muslim cowboy, st paul's cathedral (& being a tourist) WHAT I SAW LAST WEEK: 15th April tice cin! tom hunter! delicate bonds @ lychee one! sylvanian families (again) and i am quitting smoking! do you want to see my holiday photos I have secretly been in France Hardeep Pandhal has a monograph out! and Gab wrote a text for it WHAT I SAW LAST WEEK: 8th April show pony, cute, phillida reid group show, the husbands, italo calvino, diy lash lift WHAT I SAW LAST WEEK: 1st April i am now an amateur ceramicist, poor things, homage to catalonia, fidget toys WHAT I SAW LAST WEEK: 25th March new contemps! soufiane ababri! barbican conservatory & drummond street! I've read 12 and a half books this year here is what I thought of them WHAT I SAW LAST WEEK: 18th March i don't like slavoj zizek!? london feeds itself launch! maz murray @ focal point! i saw the sun!!! tested some purple film! developed more pictures at Take It Easy lab WHAT I SAW LAST WEEK: 11th March DUNE 2! American fiction! daunt books! tiktok bby!! you can now read our Poor Things review in Czech! thanks to Nora Třísková and Revue Prostor WHAT I SAW LAST WEEK: 26th Feb & 4th Mar bumper pack! Hackney Musuem, taviani brothers @ BFI, Gary Zhexi Zhang @ ICA, tate reading room! I wrote about games and wolf alice and precious objects for my Elephant column Culture at Home I'm a photographer btw official photographer WHAT I SAW LAST WEEK: 19th Feb eliza clarke boy parts! i hated this film! (past lives) BTS: London 2039 post-mortem to puncture the idea of a text as a final perfect thing, and to show you some cool photos! OUR BOOK POOR ARTISTS RELEASES OCTOBER 3RD BOOK ANNOUNCEMENTTTTTTTTT WHAT I SAW LAST WEEK: 12th Feb lots of books! bits n bobs! here are some essays about women in fiction everyone's got an opinion about Types of Ficitonal Woman! WHAT I SAW LAST WEEK: 5th Feb this blew my mind!!! WHAT I SAW LAST WEEK: 29th Jan so much for consistency, i've got a backlog if you like to knit... here are the things I've been making LADS I FANCY #31 ANOTHER MUSICAL LAD the coolest artists according to our readers writers I should read according to our readers LADS I FANCY #30 MUSICAL LAD We filmed a walkthrough for the 2023 John Moores Painting Prize zarina shouts TITS CALLING INDEPENDENT CURATORS! Art Fund have a survey for u :) How can funders aid and support your career development? They don't know, so you should TELL THEM! WHAT I SAW LAST WEEK: 8th Jan film club is a hit. i'm now a CINEMA ENJOYER! Judging old paintings FOR FUN Looking through the catalogue for the 1995 John Moores Paintin