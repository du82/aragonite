full_description = "Texts hello it is Gabrielle and Zarina. we used to have our exhibition reviews, essays on art, game reviews, and miscellaneous texts on separate pages – pages which are all linked in this big long sentence if you prefer the separation. But it’s 2024 and we fancy just putting all those texts in one place so that you can SEE US FOR WHO WE ARE. If you would prefer to listen instead of read, there are audio recordings on each page or head over to the podcast. Mary and the Rabbit Dream I've been gone, in more ways than one NO MORE FOUND OBJECTS an essay about readymades, found objects in art and whether that's a good thing Spray Ella Fleck @ Season 4 Episode 6 // an artwork made from pheromone fog London Art Fair written and uploaded from bed Grey Unpleasant Land a story about an exhibition about property & inheritance & national identity -- Sophia Al-Maria and Lydia Ourahmane at Spike Island Woman on the Edge of Time kicking the 2025 reviews off with a book I think I might love DAHOMEY (dir. Mati Diop) a film about the restitution of 26 objects to Benin Laisul Hoque @ Whitechapel a one day exhibition, conceptual value grab. How much money I made this year or a text about how 'Culture is bad for you' The Sound Voice Project 3 performances at the Royal Opera House about voice loss Grenfell: in the words of survivors via National Theatre's streaming service Turner Prize 2024 a text for Jasleen Kaur's Turner Prize installation at tate Britain The Crab Museum how are we alive Imran Perretta @ Somerset House Studios a lament for a dead city The Substance there are two wolves inside me Ellie Cotton @ General Assembly i saw a painting that i couldn't stop looking at The Dentist just like, an actual review of my dentist's Dream Machines, by Rebecca Moss a text about a performance lecture on the swan pedalos at Stratford Olympic Park Prima Facie Jodie Comer is the actress of her generation Slow Art as I said last time, let's all quit our jobs The Unbearable Lightness of Forgetting My Name, Noorain Inam a text about a specific painting, a text about painting and imagining and feeling like things are over there but then also within you. The Purpose was to Document the Other Side a film by Laisul Hoque, about distance and love, in a week like this week! Severance let's all quit our jobs Work!? thinking about Serban Savu's 'what work is' Romanian pavilion at the Venice Biennale STRAND NEWS a group show @ strand news, an off licence on the strand Parable of the Sower or a review of the UK's 2024 general election Tai Shani @ The Cosmic House THE WORLD TO ME WAS A SECRET: CAESIOUS, ZINNOBER, CELADON, AND VIRESCENT -- a vignette about looking through windows! the LJMU degree show i still can't believe this happened Unreal Estate a text housing, art and lying to estate agents about where I want to live. The Hologram how to run your own peer-to-peer health network Goldsmiths 4 Palestine 4eva a text about the student occupation of Goldsmiths, for Palestine I ran away to Spain a text about Miranda July's new novel All Fours & the Guggenheim Museum Bilbao Caterpillar Memories a story about a woman called Jane who wants to unlock her inner creative potential, through a boozy painting workshop. I went on a residency in France at a place called The Mill SHOW PONY a group show @ islington arts factory, curated by kelly wu THE RISE OF CREATIVE INDUSTRY GROUP INCORPORATED a work of art criticism as dystopian business science fiction It is as if you were doing work how do I rewire my brain, and also, do I want to Overnight At The Museum a story about a sleepover at the National Gallery, in pursuit of answers to a question: what is the POINT of ART?! Diversity Policy 101 writing about why I no longer want to write about Diversity The Floatation Tank i reviewed a floatation tank!!! London 2039 a story about an immortal cat, the last artists left in East London & a squat in the 90s that's still here today! Unrest it should have been a horror film instead I'm A Fan // I Want to Punch My Dad a review and a short story about wish fulfilment, desire and how i really want to punch my Dad Poor Things A text about a matador, a driving lesson, Bella Baxter and me Painting, Smoking, Eating (Philip Guston) a love letter to a painting? a love letter to limbo, chewing gum, dead time and unalienated labour The Largest McDonald's in Europe but it's actually a review of Liverpool City Centre Saltburn was not at all weird, just a normal and sexy time I WENT TO THE OPERA! to see Rigoletto @ the Royal Opera House, and it was amazing! Portrait of an Artists Co-op Welcome to our Sunday Lecture series. This week's guest lecturer is from the Artists' Co-op. Please save your questions for the end. The Maggot Man fan fiction of a TikTok artist Art! on the Underground Did you know there's art down there? yeah, proper interesting. No Sunday Text Free Palestine No Sunday Text Free Palestine The Entire History of Art School From Medieval times until, like, now. Portrait of a Different Kind of Art School vaping in the studio with a guy that runs an art school. Chaotic Nightclub Photos a text about the history of art about nightclubs + my new favourite twitter account Doodle House I stayed at Doodle House for a night (for legal reasons, I didn't really) WELCOME POMODORO! This text is a story about a horse called Pomodoro who goes on a residency and has a little existential crisis about the nature of art as a kind of work. The Bingo Review I went to the bingo for my 29th birthday and wrote this swimming pools swimming pools and paintings -- a semi-review of Alina Grassman's show at Niru Ratnam Come Dine With Me a short story be right back sick note, personal day, overtime, all of it Portrait of a Curator in London Curator as interlocutor! These institutions aren’t destinations, they’re tools! The Northern Boys Raising a glass to the gays and the bi's and the trans and the girls and the big bald men 18th Berwick Film & Media Arts Festival video diary!!! fitting The Problem with Diaspora Art 2 If there's one thing i love to do, it's rewrite old texts. Bigger! Better! More accurate! Second time lucky! This is a second stab at TWPDA. Mauro C. Martinez @ Unit London a review of Mauro C. Martinez's show for which I should have just written 'pick a side' Sound of the Underground @ the Royal Court Theatre written by Travis Alabanza! co-created by Debbie Hannan! Starring icons from the UK's queer club scene! i loved it! God of War Ragnarök i feel bad for the writers Jake Grewal @ Thomas Dane the sun! and the landscape! and the sky! and i don't really know what the sublime is!! Tai Shani @ Gathering The first exhibition at the new London space, ZM writes about saints and hallucinations in Tai Shani's new exhibition Sable why I didn't want it to end The African Desperate Directed by Martine Syms Emergency, Daisy Hildyard This is a novel about noticing things. Museum Shitpost Statement i'm just letting off some steam My Favourite Painting This week's text is about my favourite painting: Simone Martini’s Blessed Agostino Novello Triptych My Favourite Painter This week's text is about my favourite painter: Bhupen Khakhar Stray stop giving us dystopias, please, i am begging Body Vessel Clay @ York Art Gallery This week's text is a guided meditation, a walk through Body Vessel Clay: Black Women, Ceramics and Contemporary Art @ York Art Gallery The Long Dark a game about needing things, a text about learning to want more Sun & Sea @ the Albany This week's text is a review of Sun & Sea, an opera about climate change, @ the Albany. It's also a text about heatwaves and the Second Body. Level One Identity Art An essay but also a review of the 2022 play Our Town Needs A Nandos by Samantha O'Rourke and Ameera Conrad Munch @ the Courtauld This week's text is about Munch's paintings, a lil walk through of when i went to see the masterpieces from Bergen show at the Courtauld and had a really nice time Tell Me I'm Worthless the debut novel by Alison Rumfitt about fascism + identity politics Cloud Point @ Paradise Row This week's text is a review of Cloud Point, a group show curated by Nicolas Bourriaud, at Paradise Row Everything Everywhere All At Once I'm so done with everything everywhere R.I.P. Germain, Shimmer @ Two Queens This week's text is a review of Shimmer, R.I.P. Germain's solo show at Two Queens in Leicester. @BoschBot “The Garden of Earthly Delights is the best painting on earth as it is in heaven” Portrait of a Director of an Artist-led Space in Leicester I don’t want to give the game away, I don’t want to let you in on the big secret. But this is fiction… slightly, sort of. This isn’t real - oh, but it is. I don’t know what to tell you, you’re just going to have to believe me. @afffirmations “is this the real life, is this just irony” Shenece Oretha: Ah So It Go, Ah No So It Go, Go So! @ Cubitt This week's text is a review of Shenece Oretha: Ah So It Go, A No So It Go, Go So! At Cubitt, the last show of Languid Hands’ curatorial fellowship programme Portrait of a Moving Image Artist in London I don’t want to give the game away, I don’t want to let you in on the big secret. But this is fiction… slightly, sort of. This isn’t real - oh, but it is. I don’t know what to tell you, you’re just going to have to believe me. Old writing about horror and disability in the works of M Night. Shyamalan, the bastard I'm hungry TW: discussion of disordered eating. This text is about hunger. Learning to Cheat a text about cheating but also one about learning to ask for help I ❤️ London This week's text is a chunky art thought about the problems with London. Why is it so hard to be in the arts in London? What is it about the city that makes life such a crazy mess? And what does HOUSING CRISIS EVEN MEAN??? i investigated and here are the answers I found. Beat Saber a little story about wanting something and not being able to have it until the time is right Inventing Anna This week's text is a review of Inventing Anna, the newest Shondaland series about the Anna Delvey girlboss scam, on Netflix. Uncharted 4 actually too cool for me to care about it Danielle Brathwaite-Shirley @ Arebyte This week's text is less a review, more a document or journal entry of my experience playing through SHE KEEPS ME DAMN ALIVE, a game by Danielle Brathwaite-Shirley @ Arebyte Pokemon Legends: Arceus so close to being what I want it to be but it's just not there yet Jasleen Kaur, Gut Feelings Meri Jaan This week's text is a review of Gut Feelings Meri Jaan, a show at Touchstones by Jasleen Kaur and a group of collaborators from Rochdale Unpacking it was a fine game and sometimes fine is all I actually want a game to be On Yearning: Period Dramas & Hot Vibes This week's text is a very embarassing essay about why i love period dramas. tl;dr, it's all about that ~vibe~. Apex Legends considering the narrative value of an elaborate first person shooter Lubaina Himid @ Tate first ZM review of the year!!! this week's review is Lubaina Himid at Tate Modern. it's also a text about good art, magic, dreams & stories. I am addicted to a game and I'm wondering if addiction is ever okay NEoN Evaluation 2021 see u in 2018, hope the art world is better by then but I DOUBT IT Becoming A Disabled Game Critic thanks Long Covid I guess???? fucking lol Institutions & Identity This text is an art thought essay about the museum as part of the Neoliberal political project, a re-write of our 2018 text 'the Problem with Representation'! Love Letter to the Art World a love letter but I'm PISSED Sutapa Biswas @ Kettle's Yard This week's text is a review of Sutapa Biswas's show: Lumen at Kettle's Yard in Cambridge. It's also a lil bit different to my normal texts, bc it's written as an audio tour. So you can listen to me guide you round in person, or listen on an imagined art date, IRL or art guided meditation. The Forgotten City the best kind of horror is horror you're not expecting 3 for 1 at Camden Art Centre: Adam Farah, Phoebe Collings-James & Zeinab Saleh This week's text on the White Pube is a review of 3 for 1 at Camden Art Centre: Adam Farah, Phoebe Collings-James & Zeinab Saleh. tl;dr (& SPOILER): I think the decision to put on 3 separate solo shows, in the space that'd normally contain 1 solo show, at the same time is racialised. BLACKTRANSSEA the new game by Danielle Brathwaite-Shirley as a part of her first solo exhibition at QUAD in Derby Turner Prize 2021, Bumper Pack This week's text is a review of the 2021 Turner Prize! This year, there's been so much noise about the nominees being collectives, and I went up to the Herbert on a press trip to go have a look round with the rest of the press pack - felt like i literally HAD to review it lmao. SO, a long chunky extended cut: reviews of the work being presented, as well as a run down of the wider TP vibe. Also, a soft proposition for the Turner Prize to be more like the X Factor, that i'm only HALF joking about. Kena: Bridge of Spirits a strong challenge without a strong story to back it up, which is fine for some! Manifesto, Ane Hjort Guttu I remember when I told my parents I wanted to go to art school. No Longer Home a game about two people finishing an art degree and wondering what will come next this exhibition doesn't exist This week's text is a review of an exhibition that doesn't exist. in writing about something that doesn’t exist, maybe i can burrow through and write about something that should.' Red Dead Redemption 2 thinking about escaping into fiction and creating fiction to escape Ain Bailey: Version @ Wysing Arts Centre This week's text on The White Pube is a review of Ain Bailey's show, Version, at Wysing Arts Centre over in Cambridge. In this review, I think about about generosity, overlap, and liquid, as well as ~vibey~ descriptions of sound works. Love Island Season 7 why i'm never watching it again Marble Arch Mound a review of the Marble Arch Mound (before it got shut down thanks in part to this review (I like to think)) The Real Housewives of Beverly Hills a text about chronic illness, reality tv, and finding relief in other people's problems a rant! a reel!, Camara Taylor @ Cubitt This week's text is a review! of Camara Taylor's a rant! a reel! at Cubitt. It's the third show in Languid Hands' ongoing curatorial fellowship program, called No Real Closure. 54 The Gate This week's text is a review of 54 The Gate, an online show that is also a game, on Arcadia Missa's Open Office. it is also a text about how i just want art to be FUN. We Dwell in Possibility the new game from Robert Yang and Eleanor Davis: a sweet sex camping ground Ghost of Tsushima too pretty!!! stop being so pretty!!! it's a problem!!! Death Stranding: The Final Walk writing about the power of the game's ending and how emotion is achieved between story, song, and gameplay Cooking Sections @ Tate Britain This week's text is a review of ~Salmon: A Red Herring~, the Art Now show by Cooking Sections, at Tate Brit"
