["https://theworld.com/world/about/history/wikipedia"]
title = "The World (Internet service provider) - Wikipedia"
full_description = '''Toggle the table of contents The World (Internet service provider) Add languages Add links ArticleTalk English ReadEditView history Tools Tools move to sidebar hide Actions ReadEditView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Print/export Download as PDFPrintable version In other projects Wikidata item Appearance move to sidebar hide From Wikipedia, the free encyclopedia .mw-parser-output .infobox-subbox{padding:0;border:none;margin:-3px;width:auto;min-width:100%;font-size:100%;clear:none;float:none;background-color:transparent}.mw-parser-output .infobox-3cols-child{margin:auto}.mw-parser-output .infobox .navbar{font-size:100%}@media screen{html.skin-theme-clientpref-night .mw-parser-output .infobox-full-data:not(.notheme)>div:not(.notheme)[style]{background:#1f1f23!important;color:#f8f9fa}}@media screen and (prefers-color-scheme:dark){html.skin-theme-clientpref-os .mw-parser-output .infobox-full-data:not(.notheme) div:not(.notheme){background:#1f1f23!important;color:#f8f9fa}}@media(min-width:640px){body.skin--responsive .mw-parser-output .infobox-table{display:table!important}body.skin--responsive .mw-parser-output .infobox-table>caption{display:table-caption!important}body.skin--responsive .mw-parser-output .infobox-table>tbody{display:table-row-group}body.skin--responsive .mw-parser-output .infobox-table tr{display:table-row!important}body.skin--responsive .mw-parser-output .infobox-table th,body.skin--responsive .mw-parser-output .infobox-table td{padding-left:inherit;padding-right:inherit}}The WorldPresidentBarry Shein[1]Key peopleJim Frost, Joe "Spike" Ilacqua, James "Kibo" ParryURLTheWorld.comLaunchedNovember 1989[2] The S.S. Pierce Building, original Brookline headquarters of The World. The World is an Internet service provider originally headquartered in Brookline, Massachusetts. It was the first commercial ISP in the world that provided a direct connection to the internet, with its first customer logging on in November 1989.[3] Controversy[edit] Many government and university installations blocked, threatened to block, or attempted to shut-down The World's Internet connection until Software Tool & Die was eventually granted permission by the National Science Foundation to provide public Internet access on "an experimental basis."[4] Domain name history[edit] The World is operated by Software Tool & Die. The site and services were initially hosted solely under the domain name world.std.com which continues to function to this day. Sometime in or before 1994, the domain name world.com had been purchased by Software Tool & Die and used as The World's primary domain name. In 2000, STD let go ownership of world.com and is no longer associated with it. In 1999, STD obtained the domain name theworld.com, promoting the PascalCase version TheWorld.com as the primary domain name of The World. Services[edit] The World still offers text-based dial-up and PPP dial-up, with over 9000 telephone access numbers throughout Canada, the United States, and Puerto Rico. Other features include shell access, with many historically standard shell features and utilities still offered.[5] Additional user services include Usenet feed, personal web space, mailing lists, and email aliases. As of 2012, there were approximately 1750 active users. More recent features include domain name hosting and complete website hosting. Community[edit] The World offers a community Usenet hierarchy, wstd.*, which is accessible only to users of The World. There are over 60 newsgroups in this hierarchy. The World users may send each other Memos (password protected messaging) and access a list of all personal customer websites. Much of The World's website and associated functionality was designed and built by James "Kibo" Parry. Notable sites at The World[edit] The Barry Shein Home Page Boston Japanimation Society Brookline Pax General Theory of Religion (archive) The Wombat Information Center The World's Index of Customers' Home Pages See also[edit] Netcom (United States)—West Coast dial-up ISP similar to The World The WELL The Source References[edit] .mw-parser-output .reflist{margin-bottom:0.5em;list-style-type:decimal}@media screen{.mw-parser-output .reflist{font-size:90%}}.mw-parser-output .reflist .references{font-size:100%;margin-bottom:0;list-style-type:inherit}.mw-parser-output .reflist-columns-2{column-width:30em}.mw-parser-output .reflist-columns-3{column-width:25em}.mw-parser-output .reflist-columns{margin-top:0.3em}.mw-parser-output .reflist-columns ol{margin-top:0}.mw-parser-output .reflist-columns li{page-break-inside:avoid;break-inside:avoid-column}.mw-parser-output .reflist-upper-alpha{list-style-type:upper-alpha}.mw-parser-output .reflist-upper-roman{list-style-type:upper-roman}.mw-parser-output .reflist-lower-alpha{list-style-type:lower-alpha}.mw-parser-output .reflist-lower-greek{list-style-type:lower-greek}.mw-parser-output .reflist-lower-roman{list-style-type:lower-roman} ^ .mw-parser-output cite.citation{font-style:inherit;word-wrap:break-word}.mw-parser-output .citation q{quotes:"\"""\"""'""'"}.mw-parser-output .citation:target{background-color:rgba(0,127,255,0.133)}.mw-parser-output .id-lock-free.id-lock-free a{background:url("//upload.wikimedia.org/wikipedia/commons/6/65/Lock-green.svg")right 0.1em center/9px no-repeat}.mw-parser-output .id-lock-limited.id-lock-limited a,.mw-parser-output .id-lock-registration.id-lock-registration a{background:url("//upload.wikimedia.org/wikipedia/commons/d/d6/Lock-gray-alt-2.svg")right 0.1em center/9px no-repeat}.mw-parser-output .id-lock-subscription.id-lock-subscription a{background:url("//upload.wikimedia.org/wikipedia/commons/a/aa/Lock-red-alt-2.svg")right 0.1em center/9px no-repeat}.mw-parser-output .cs1-ws-icon a{background:url("//upload.wikimedia.org/wikipedia/commons/4/4c/Wikisource-logo.svg")right 0.1em center/12px no-repeat}body:not(.skin-tim