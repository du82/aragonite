g service as desired. 4. The current HPA service does not offer CGI scripting and programming capabilities for customers. World Kiosk service allows CGI scripting and programming, but not arbitrarily long running programs. A CGI script or program is software which runs only on direct request from a web page, and only for the time it takes to respond to that specific request. 5. Design, debugging, support or instruction in the creation or maintenance of HTML files for use with the World Wide Web is not included in this agreement and is subject to separate charge and contract when available. 6. Customer understands that the World Wide Web software is an experimental and rapidly evolving technology. STD will provide reasonable effort to maintain currency of software releases, bug fixes, and security. STD makes no guarantee of any particular fitness for use of software offered and will not be liable for problems or limitations arising from any software currently in use or not. In the event of failure to provide service, liability of STD shall be limited to refund or credit of fees billed to customer for service by Software Tool & Die on a pro-rata basis. In no case shall Software Tool & Die be liable for damages, lost business or other incidental losses attributable to these services. In addition, in no case is STD liable for damages, loss of business or other incidental losses caused by circumstances beyond our control such as network disruptions, phone service outage, loss of electrical power, etc. 7. The basic credit limit per World customer account is $50 per month. STD reserves the right to require cash deposit or equivalent on a per customer basis for accounts which exceed their basic credit limit. Customers who exceed the basic credit limit during any given month may have their service suspended if suitable arrangements for payment can not be agreed upon with STD. 8. From time to time Software Tool & Die must perform maintenance or repair of facilities which may 