 | d01'''
full_description = '''The World® A Public Information Utility™ The World (www.TheWorld.com), operated by Software Tool & Die, Is an Internet service provider with headquarters in Boston, MA, USA. In 1989 we were the first commercial Internet Service Provider on the planet for the general public. And we're still proud to be the best. Dialing The World® How This Works... Every current operating system includes the necessary tools for connecting to The World over a phone line — you probably won't need to install any special programs. The World supports PPP (a standard for connecting to the Internet from any sort of computer) so all you need to do is tell your computer to call one of our phone numbers and log you in via PPP. After this one-time setup has been done, whenever you connect you can use any Internet programs (any Web browser, any mail program, and so on) — you can use whatever you choose. Getting Started is Easy! Our illustrated "quick start" guides will walk you through a simple setup (it only takes about five minutes). The "detailed instructions" are longer text documents for special setups. We suggest you print out whichever instructions you plan to use. If you haven't yet opened an account with The World, you'll need to Join The World first. Windows Windows XP/Vista/7 quick start detailed instructions Windows 2000 detailed instructions Windows ME detailed instructions Windows 98 detailed instructions Windows NT 4 detailed instructions Windows 95 detailed instructions Mac OS Mac OS X quick start detailed instructions Linux Linux detailed instructions Comments? Questions? Problems? Contact us. Page last modified July 31, 2010. Web site contents & design Copyright © 2010 Software Tool & Die. Legal information. | Privacy policy.'''
