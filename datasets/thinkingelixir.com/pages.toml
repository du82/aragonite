full_description = "News for 2020-10-27 October 28, 2020 News from episode #19. Elixir v1.11.1 Released with fixes If you’ve already moved up to Elixir 1.11.0, make sure to get the latest bug fix updates. https://twitter.com/elixirlang/status/1317021884475711490 https://github.com/elixir-lang/elixir/releases/tag/v1.11.1 phoenix_live_dashboard v0.3.0 released Jose Valim shared a Twitter thread discussing the enhancements which includes screenshots to illustrate new features. Improvements include: Adding Ecto Stats that shows relevant stats from your database, such as vacuum stats, index usage, long queries, etcIf you enable the :allow_destructive_actions option, you can now simulate failures by killing processes using the Dashboard.Official support for “custom pages”, thanks to the newly added PageBuilder. Most of the Dashboard’s pages were ported to use this new approach. This means it is much easier to create a custom Dashboard page that is specific to your systems and applications. Project updates Ash framework ecto_commons v0.3.0 Oban v2.2.3 Posted in News and tagged news, podcast"
