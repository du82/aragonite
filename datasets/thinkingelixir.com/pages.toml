full_description = 'Available Courses FREE Pattern Matching Course Pattern matching is a powerful language feature. It is built in to almost every corner or Elixir. In order for you to even read Elixir code and follow along, you need to understand Pattern Matching. Once you “get it", pattern matching starts to feel like a super power. You start to unlearn some of the coding patterns used in other languages because now you can create even clearer and more elegant code than was possible before! Learn more Code Flow Course How do you control the flow of your application code in Elixir? Pattern matching, Immutability and recursion really change how you do things more than you might expect. Learn the coding patterns, language features, and techniques for solving problems in a new way. Gain the confidence to start contributing meaningful code to projects. Learn when to use new techniques and why you might choose one over the other. All while getting hands-on experience. Learn more'
