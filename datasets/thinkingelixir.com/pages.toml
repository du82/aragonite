["https://thinkingelixir.com/the-podcast"]
title = "Thinking Elixir Podcast"
description = """
The Thinking Elixir podcast is a weekly show where we talk about the Elixir programming language and the community around it. We cover news and interview guests to learn more about projects and developments in the community.

Whether you are already experienced with Elixir or just exploring the language, this show is created with you in mind. We discuss community news, Functional Programming, transitioning from OOP, coding conventions, and more.

Guests visit the show to help challenge our assumptions, learn about new developments and grow in the process.

Subscribe to join us on this journey!"""
full_description = '''Thinking Elixir Podcast News and interviews for the Elixir community RSS Apple Podcasts Spotify Stitcher About the show The Thinking Elixir podcast is a weekly show where we talk about the Elixir programming language and the community around it. We cover news and interview guests to learn more about projects and developments in the community. Whether you are already experienced with Elixir or just exploring the language, this show is created with you in mind. We discuss community news, Functional Programming, transitioning from OOP, coding conventions, and more. Guests visit the show to help challenge our assumptions, learn about new developments and grow in the process. Subscribe to join us on this journey! Thinking Elixir Podcast on social media Your Hosts Mark Ericksen David Bernheisel Tyler Young Dave Lucia Episodes 243: Elixir Jobs: Seniors Only Need Apply? March 4th, 2025 | 59 mins 25 secs ebpf, elixir, employment, jobs, junior, news, python, pythonx News includes PythonX for Python interoperability in Elixir, academic work on Elixir-to-eBPF compilation, AI-powered Phoenix demos from Chris McCord, plus insights on the current Elixir job market and tips for job seekers! 242: Magic Links and Sudo Mode February 25th, 2025 | 20 mins 21 secs auth, debugger, elixir, phoenix, security, sudo News includes Phoenix gen_auth adding magic links and sudo mode security, DaisyUI Components reaching v0.7.0, new security best practices from Paraxial.io, PostgreSQL self-join improvements, and more! 241: A LiveView Debugger and Gigalixir February 18th, 2025 | 44 mins 59 secs debugging, deployment, elixir, gigalixir, hex, liveview, news, paas News includes a new browser-based debugging tool for LiveView, a project for creating private Hex registries, plus Tim Knight from Gigalixir joins us to discuss their Elixir-focused platform, and more! 240: Standards and Security February 11th, 2025 | 18 mins 50 secs asdf, certification, elixir, news, oban, openchain, pentest, security News includes Erlang/OTP achieving OpenChain ISO certification, a new "Elixir Patterns" book release, a security audit validating Oban Web and Pro's safety, and more! 239: Scaling to Unicorn Status February 4th, 2025 | 29 mins 9 secs ai, elixir, langchain, news, remote, unicorn News includes Remote's Elixir case study showcasing unicorn-level scaling, Tailwind CSS 4.0's release, Chris McCord's AI code generator preview, Elixir LangChain v0.3.0's update, and more! 238: Oban Web Goes Free and Open January 28th, 2025 | 25 mins 35 secs elixir, hologram, news, oban, playwright, testing News includes Oban Web being released as open source with MySQL support, the introduction of the Hologram web framework, PhoenixTest gaining Playwright support, and more! 237: Types, Analytics, and FLAME on EC2 January 21st, 2025 | 27 mins 6 secs analytics, ec2, elixir, flame, types News includes improvements to ex_doc's version navigation, Phoenix Analytics 0.3.0 release, José Valim's exploration of set-theoretic types, the beta release of the Ash Framework book, FLAME's new AWS EC2 support, and more! 236: Turn it up to 1000! January 14th, 2025 | 21 mins 50 secs conferences, deno, elixir, javascript, news, types News includes José Valim's enhanced type inference PR for Elixir 1.19, ElixirLS's 0.26.0 release, a new DenoRider library for JavaScript integration, Gleam v1.7.0's performance improvements, and more! 235: Wrapping Up 2024 with Types January 7th, 2025 | 26 mins 55 secs 2024, conferences, elixir, liveview native, news, page transitions, swup.js, types News includes Elixir 1.18.0's release with enhanced type system support, LiveView Native's v0.4.0-rc.0 with a new networking stack, ExDoc v0.36's smooth page transitions with swup.js, Swedish goats, and more! 234: Source Drops, AI, and Holiday Cheer December 24th, 2024 | 14 mins 43 secs ai, beamops, christmas, elixir, news, source News includes "Engineering Elixir Applications" source release, the "hex2txt" package for AI coding, LiveView Native's LiveUploads, AI iOS app guide by Headway, and more! Enjoy festive greetings and best wishes! 233: LiveView 1.0 and Elixir 1.18! December 17th, 2024 | 1 hr 3 mins aurora dsql, aws, elixir, liveview, nerves, nerves cloud, nerves hub, news Phoenix LiveView 1.0 is out! Elixir 1.18 introduces JSON support and test improvements. AWS Aurora DSQL debuts, and Lars Wikman shares updates on Nerves and oswag.org. And more! 232: Towering Over Errors December 10th, 2024 | 1 hr 9 secs elixir, errors, errortracker, news, nx, tower News includes updates from Saša Jurić, Phoenix LiveView RC 8, ErrorTracker, NX MLX backend, a chat with Gonzalo Rodriguez about Tower for error reporting, and more!'''
