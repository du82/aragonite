title = "Landing Page - Thinking Elixir"
description = "Get Started Mindset Shift New to functional programming? Learn how to design your code when using immutable data! Learn how to take full advantage of concurrency. The right mental models avoids struggle. Idiomatic Elixir Learn the style of Elixir code, the patterns of the community, best practices, and benefit from the lessons learned by others.…"
full_description = "Get Started Mindset ShiftNew to functional programming? Learn how to design your code when using immutable data! Learn how to take full advantage of concurrency. The right mental models avoids struggle. Idiomatic ElixirLearn the style of Elixir code, the patterns of the community, best practices, and benefit from the lessons learned by others. AchieveRapidly become productive with Elixir. Understand the concepts and teach it to others. Build practical skill and experience. What do you need help with? Your Personal Elixir JourneyYou are self-motivated. You want to learning Elixir. You know Elixir is a Functional Programming language, has immutable data, uses pattern matching and is highly concurrent. You can figure it all out on your own given enough time and work. You also know that a personal guide can get you to your goal faster. Read more Building an Elixir TeamYou are building your team and need Elixir developers. You can't find the people with the Elixir experience you'd like, so you hire talented people that can learn Elixir. You are completely capable of sitting with them and mentoring them all along the way and make it happen. But you have a team to run, product to ship, and problems to solve. You need help bringing new members up-to-speed quickly. Read more Try the FREE Pattern Matching Course Take this chance to get started with Elixir and also try before you buy. Together we cover pattern matching and a lot more! You can get started right now. MORE INFORMATION Testimonials Matthew M. Most training courses I’ve done are full video. I liked the self-paced learning of walking through a mostly text-based course. I really liked the practice exercises. Getting test cases to pass is a good way to learn. It got me exploring and working with code without being overwhelmed with a new language. I learned a lot quickly. Longer, more tedious video course became largely obsolete for me. Jonathan A. It is excellent content, just overall great training. Now I think about programming differently. When I go back to writing in C#, there are things I miss from Elixir! The modules are a good length, they don’t push too much content at once, there's good opportunity to practice what you're learning. I like the code with tests for me to practice on. I think it's important to be coding as much as possible as you work through a lesson to practice what you’re learning. Paulo G. Mark's course refreshed some topics and showed me some new ways of leveraging pattern matching in my code. There is always room for technical improvement and the course helped me become a stronger programmer. Alex M. The course is well paced and very interactive. I learned through hands on experience. It is a great starting point in Elixir and didn't require any previous Elixir experience. The provided test cases let me independently check (and refactor) my work without needing to look up the answer. I got quick feedback and a chance to try again. Josh I. I really enjoyed Pattern Matching and Code Flow! Your explanations and the order in which you present the topics is fantastic! Darren E. I’ve taken a handful of online courses in Elixir this past year. Mark’s classes are the most thorough I’ve taken. His practice exercises require you to really think about and understand the language. I recommend it to everyone joining my team as the go-to resource for starting to learn Elixir. Tell me when more courses are ready! Want to be notified when more courses are ready? Subscribe to be notified when new training resources are available. Name Please enter your name. Email Address Please enter a valid email address. Subscribe! Thanks for subscribing! Please check your email for further instructions. Something went wrong. Please check your entries and try again. Questions about getting started? Drop me a line to find out more! I love helping individuals and teams gain new skills and make the mind shift faster. How can I help you? Get In Touch"
