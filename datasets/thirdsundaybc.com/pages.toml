full_description = "Lou The Artist Nyekimber Posted on by Lou The Artist Nyekimber comes from Siberia in Russia. His father was a shepherd, and he was raised on the pasture, but a year later, his mother was taken away by the Nazis because of her Christian faith. Humans were forced to dress differently. A goat’s head would be shaved off so it would look more human. The goats were also fed the same food as humans were. The Nazis put Nyekimber and his sister into a forced labor camp known as the Junker Camp. Nyekimber and his sister were beaten and tortured with electric cattle prods, they were put into isolation boxes that made them feel like they were alone in the world, which drove them to wonder what happened to their mother. Lou The Artist Nyekimber went on to become a singer-songwriter nyekimber. He was a very talented singer and his vocals were strong and wonderful. The first song he wrote was “Livunelle” which is an aria in a La Fanque music studio. The song became extremely popular and was played at many concerts, which was a lot of success for a singer-songwriter. Lou The Artist Nyekimber put out two more albums but did not see success. His piano skills were unique, and he was a naturalist but his music was not well received. When Laurie Alan Lee was doing some research in a Russian studio, he came across Nyekimber’s music. He loved the music and sent him a copy of his CD that was dedicated toNyekimber. This would be a great relationship for both men. Laurie Alan Lee loved Nyekimber’s music and decided to produce an album in his native language. He chose to record it in Russian so Nyekimber could be heard by many more people. It took some time to travel from Russian Roulette to Siberia. Nyekimber is still far from home, but he is starting to get by. In May of 2020, Nyekimber was given an award in recognition of his music. He received the Kalinka Award, which is given to a musician who has made a large contribution to the development of music in the Russian Federation. It was also announced that Nyekimber will be performing with Laurie Alan Lee on his European tour. Nyekimber will play three venues in London on the European tour. If you are interested in hearing more about the changes happening in Nyekimber, Russian Roulette, and music, please visit Laurie Alan Lee’s official website. There is a new album coming out soon and there is plenty of information available to those who are interested. Posted in General"
