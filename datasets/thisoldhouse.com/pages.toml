full_description = "Navigation for This Old House Seasons Season 44 - 1720 Cape Ann Gambrel Season 44 - Newburyport Forever House Season 44 - Atlanta Postmaster's House Season 43 - Saratoga Legacy Restored Season 43 - The West Roxbury Victorian Season 43 - The Concord Country Cape Season 42 - Extra Episodes Season 42 - The Dorchester Triple Decker Season 42 - The Seaside Victorian Cottage Season 42 - Behind the Build Season 41 - The Cape Ann House Season 41 - Rebuilding Paradise Season 41 - The Westerly Ranch House Season 40 - The Brookline Mid-century Modern House Season 40 - The Jamestown Net-Zero House Season 39 - The Charleston Houses Season 39 - The Newton Generation NEXT House Season 38 - The Detroit House Season 38 - The Arlington Arts & Crafts House Season 37 - The Belmont Victorian House Season 37 - The North Shore Farmhouse Season 36 - The Veteran's Special House Project Season 36 - The Lexington Colonial House Season 36 - The Charlestown 2014 House Season 35 - The Arlington Italianate House Season 35 - Jersey Shore Rebuilds Season 34 - The Cambridge 2012 House Season 34 - The Essex House Season 33 - The Barrington Beach House Season 33 - The Bedford House Season 32 - The Auburndale House Season 32 - The Los Angeles House Season 31 - The Newton Centre House Season 31 - The Roxbury House Season 30 - The New York City House Season 30 - The Weston House Season 29 - New Orleans Rebuilds Season 29 - The Newton Shingle-Style House Season 28 - The Austin House Season 28 - The East Boston House Season 27 - The Washington, D.C. House Season 27 - The Cambridge House Season 26 - The Carlisle House Season 25 - The Bermuda House Season 25 - The Concord Cottage Season 24 - The Winchester House Season 24 - The Lake Forest Dream Kitchen Season 23 - The Manchester House Season 22 - The West Palm Beach House Season 22 - The Charlestown House Season 21 - The Billerica House Season 21 - The Santa Barbara House Season 20 - The Watertown House Season 20 - The Key West House Season 19 - The Milton House Season 19 - The San Francisco House Season 18 - The Nantucket House Season 18 - The Tucson House Season 17 - The Salem House Season 17 - The Savannah House Season 16 - The Acton House Season 16 - The Napa Valley House Season 15 - The Belmont House Season 15 - The Honolulu House Season 14 - The Lexington Ranch Season 14 - The Miami House Season 13 - The London House Season 13 - The Wayland House Season 12 - The Jamaica Plain House Season 12 - The New Orleans House Season 11 - The Concord Barn Season 11 - The Santa Fe House Season 10 - The Lexington Bed and Breakfast Season 9 - The Santa Barbara Bungalow Season 9 - The Westwood House Season 8 - The Phoenix House Season 8 - The Brimfield House Season 8 - The Reading House Season 7 - The Tampa House Season 7 - The Melrose House Season 7 - The Newton Victorian Season 7 - The Reading Ranch Season 6 - In and Around Boston Season 5 - The Brookline House Season 4 - The Arlington House Season 3 - The Woburn House Season 2 - The Newton House Season 1 - The Dorchester House Cast Norm Abram Heath Eastman Lee Gilliam Nathan Gilbert Mauro Henrique Mark McCullough Jenn Nawada Kevin O’Connor Charlie Silva Tom Silva Richard Trethewey Ross Trethewey Webcams Submit Your House AboutJenn NawadaLandscape Contractor by This Old House Chad GriffithAs Landscape Contractor on This Old House and Ask This Old House, Jenn Nawada teaches solutions to viewers across the country that make their landscapes more beautiful and functional.Jenn has been working in the landscape design and build field since 2001 and founded Nawada Landscape Design, Inc. more than a decade ago As a residential landscape designer, Jenn creates and installs landscape plans that are sophisticated, stylish, and sustainable. She helps clients realize the potential of their land, which can lead to healthier connections between people and their environments. She designs, manages, and implements both large and midsize projects throughout the Boston area with some of the finest local professionals to ensure a successful completion of each project.After first serving as Landscape Designer on the This Old House Auburndale project in 2010, working alongside Roger Cook to create a welcoming garden out front, Jenn joined the Ask This Old House team in 2015, and officially became Landscape Contractor for This Old House in January 2020.Jenn earned her Bachelor of Arts in Environmental Studies from Rollins College in Florida and a Master of Arts in Landscape Design and Land Use Planning from the Conway School of Landscape Design in Massachusetts. She has been a Massachusetts Certified Horticulturist since 2004. Prior to owning her own business, she was lead designer at a design firm in Boston, worked at a large-scale nursery in the Boston suburbs, and even worked as an Environmental Education Instructor in Vermont.Jenn lives in an early 1900s house in the Boston area with her husband and two sons.Follow Jenn on Facebook, Twitter @JNawadaTOH, Instagram @JNawadaTOH, and on TikTok.Most Popular Our 6 Best Above-Ground Pool Picks (2024) Play How To Get Rid of Ice Dams 8 DIY Humidifier Ideas 7 Best Tankless Water Heaters (2025) How To Build a Sauna Newsletter Sign up for the Newsletter Get the latest This Old House news, trusted tips, tricks, and DIY Smarts projects from our experts–straight to your inbox. Email (required) By submitting your email, you agree to our Terms and Privacy Policy. You can opt out at any time. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Subscribe"
