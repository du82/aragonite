son 19 - The Milton House Season 19 - The San Francisco House Season 18 - The Nantucket House Season 18 - The Tucson House Season 17 - The Salem House Season 17 - The Savannah House Season 16 - The Acton House Season 16 - The Napa Valley House Season 15 - The Belmont House Season 15 - The Honolulu House Season 14 - The Lexington Ranch Season 14 - The Miami House Season 13 - The London House Season 13 - The Wayland House Season 12 - The Jamaica Plain House Season 12 - The New Orleans House Season 11 - The Concord Barn Season 11 - The Santa Fe House Season 10 - The Lexington Bed and Breakfast Season 9 - The Santa Barbara Bungalow Season 9 - The Westwood House Season 8 - The Phoenix House Season 8 - The Brimfield House Season 8 - The Reading House Season 7 - The Tampa House Season 7 - The Melrose House Season 7 - The Newton Victorian Season 7 - The Reading Ranch Season 6 - In and Around Boston Season 5 - The Brookline House Season 4 - The Arlington House Season 3 - The Woburn House Season 2 - The Newton House Season 1 - The Dorchester House Cast Norm Abram Heath Eastman Lee Gilliam Nathan Gilbert Mauro Henrique Mark McCullough Jenn Nawada Kevin O’Connor Charlie Silva Tom Silva Richard Trethewey Ross Trethewey Webcams Submit Your House AboutTom SilvaGeneral Contractor by This Old House Chad GriffithAs a proud member of America’s favorite home improvement team since 1986, general contractor Tom Silva has provided years of expert advice to home enthusiasts across the country on This Old House and Ask This Old House.Renovating houses since he was a child, Tom’s first major project, working alongside his dad and brother, was installing a basement fallout shelter underneath their 1787 Colonial in Lexington, Massachusetts. After digging out the 20x40x12-foot hole under the house, by hand, and hauling away all the boulders, they framed it and finished it off. “It took us two years, and I felt such pride in what we had accomplished that I knew I wanted to do this for a living,” says Tom.Silva Brothers Construction, made up of Tom, his father, and brother Richard, built the original set for the WGBH-TV Boston production The Victory Garden in the parking lot of WGBH. Russell Morash, the creator of This Old House, discovered the Silva crew while they were conducting a major restoration on an 1845 Greek Revival-style house. It was then that Russ named Tom and his crew the general contractors for the show.“Each job is unique and different, which is just what I like,” says Tom. “Besides loving my work, I’ve made good friends with the entire crew of This Old House, and it’s been a rewarding experience.”Parents of a daughter and a son, Tom and his wife live in a 19th-century house he continues to renovate in a Boston suburb. He is a native of Massachusetts and a boating enthusiast.Follow Tom on Facebook, Twitter @TomSilvaTOH, Instagram @tomsilvatoh, and on TikTok.Most Popular Our 6 Best Above-Ground Pool Picks (2024) Play How To Get Rid of Ice Dams 8 DIY Humidifier Ideas 7 Best Tankless Water Heaters (2025) How To Build a Sauna Newsletter Sign up for the Newsletter Get the latest This Old House news, trusted tips, tricks, and DIY Smarts projects from our experts–straight to your inbox. Email (required) By submitting your email, you agree to our Terms and Privacy Policy. You can opt out at any time. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Subscribe"
