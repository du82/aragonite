["https://www.thisoldhouse.com/bathrooms/reviews/tub-to-shower-conversion-cost"]
title = "How Much Does Tub-to-Shower Conversion Cost? (2025 Guide)"
description = "Ready to convert your traditional tub or tub-shower combo into a modern walk-in shower? Find out how much to budget and get saving tips."
full_description = 'The average tub-to-shower conversion cost is $3,000.* Converting your tub into a shower can make your bathroom seem larger and is a relatively affordable way to give your bathroom an upgrade. This comprehensive guide pulls from our research of analyzing the cost of various bathroom remodeling jobs and breaks down average costs and other factors to help you determine if a tub-to-shower conversion makes sense for your home. *All cost data in this article was averaged from multiple sources, including The Home Depot, HomeAdvisor, and Remodeling Calculator. Find Expert Help Use our expert research to learn more about your projectEnter your ZIP code and tell us about your homeMatch with local experts who can meet your needs Get Estimates from Local Bathroom Remodeling Experts Compare quotes from local pros Please Enter Your Zip Code Invalid Zip Code Get Your Estimate Enter details in under 3 minutes Clicking “Get Your Estimate” submits your data to Home Service Quotes, which will process your data in accordance with the Home Service Quotes Privacy Policy. Advertiser Disclosure The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. Ad Disclaimer The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg" class="attachment-medium size-medium" alt="kemper home insurance review" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1024x683.jpg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-768x512.jpg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1536x1024.jpg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-scaled.jpg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Full Bathroom Remodel Avg. Remodel Cost: $2,000 – $18,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg" class="attachment-medium size-medium" alt="Branches with green eucalyptus leaves in shower" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1536x1024.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-2048x1365.jpeg 2048w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-scaled.jpeg 1920w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Walk–In Shower Cost Avg. Installation Cost: $1,000 – $15,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg" class="attachment-medium size-medium" alt="Modern bathroom interior in luxury apartment" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-768x513.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1536x1025.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-scaled.jpeg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Bathtub Refinishing Cost Avg. Refinishing Cost: $335 – $630 Get Quote Average Cost To Convert a Tub Into a Shower Tub-to-shower conversion costs between $1,200 and $8,000 but averages around $3,000.* Labor can cost thousands more if you hire professionals. Tub-to-Shower Conversion Cost Factors Your total cost depends on the following factors. Shower type: A simple stall or walk-in shower typically costs much less than a fully tiled or curbless shower. Shower door: Adding a frosted glass shower door instead of a shower curtain will increase your budget by $600–$1,350. Showerheads and accessories: Upgraded features and accessories, such as grab bars or seats, can increase your costs by anywhere from $50–$900. Tub-to-Shower Conversion Cost by Shower Type Different types of showers cost more or less to convert. We expand on each type below. Shower TypeCost RangeShower stall$700–$1,600Walk-in shower$750–$7,000Tile shower$3,500–$15,000Curbless shower$6,000–$10,000 <img decoding="async" width="1920" height="1281" style="width:100%;aspect-ratio:1920/1281" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135049/shower-stall.jpeg" alt="A glass shower stall in a modern bathroom" class="wp-image-259154" style="width:374px;height:auto" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135049/shower-stall.jpeg 1920w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135049/shower-stall-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135049/shower-stall-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135049/shower-stall-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135049/shower-stall-1536x1025.jpeg 1536w" sizes="(max-width: 1920px) 100vw, 1920px" data-eio="l" /> Shower stall ($700-$1,600) Tub-to-shower conversions are considered an expensive home renovation project but are cheaper than a full bathroom remodel. Replacing your tub with a shower stall can increase your home’s value with a relatively small investment. A shower stall is usually 32 to 48 inches in width. A prefabricated shower stall kit costs just $1,200–$3,600, slightly cheaper than the $1,800–$4,000 it costs to build one from scratch. These kits include a bottom shower pan base and three shower walls. <img decoding="async" width="1920" height="1280" style="width:100%;aspect-ratio:1920/1280" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134720/walk-in-shower.jpeg" alt="A walk-in shower with white tile walls" class="wp-image-259151" style="width:374px;height:auto" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134720/walk-in-shower.jpeg 1920w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134720/walk-in-shower-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134720/walk-in-shower-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134720/walk-in-shower-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134720/walk-in-shower-1536x1024.jpeg 1536w" sizes="(max-width: 1920px) 100vw, 1920px" data-eio="l" /> Walk-in shower ($750-$7,000) Walk-in showers have no barriers, curtains, or steps, offering an accessible and easy bathing experience. However, the convenience will cost more. This type of conversion costs $750–$7,000, depending on the shower size and materials. <img decoding="async" width="1920" height="1280" style="width:100%;aspect-ratio:1920/1280" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134934/tiled-shower.jpeg" alt="A white tiled shower in a bathroom" class="wp-image-259153" style="width:374px" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134934/tiled-shower.jpeg 1920w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134934/tiled-shower-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134934/tiled-shower-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134934/tiled-shower-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08134934/tiled-shower-1536x1024.jpeg 1536w" sizes="(max-width: 1920px) 100vw, 1920px" data-eio="l" /> Tiled shower ($3,500-$15,000) Converting a tub to a tiled shower is on the higher end of the cost spectrum, averaging $3,500–$15,000. However, it’s more affordable if you do it yourself or use less expensive materials. For example, ceramic tiles usually cost less than marble or other natural stones. <img decoding="async" width="1920" height="1577" style="width:100%;aspect-ratio:1920/1577" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135234/curbless-shower-e1709932497946.jpeg" alt="A curbless shower in a modern bathroom" class="wp-image-259156" style="width:374px" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135234/curbless-shower-e1709932497946.jpeg 1920w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135234/curbless-shower-e1709932497946-300x246.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135234/curbless-shower-e1709932497946-1024x841.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135234/curbless-shower-e1709932497946-768x631.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2024/03/08135234/curbless-shower-e1709932497946-1536x1262.jpeg 1536w" sizes="(max-width: 1920px) 100vw, 1920px" data-eio="l" /> Curbless shower ($6,000-$10,000) Curbless showers are level with the bathroom floor and rely on sloped floors to drain the water. These can make your home look ultra-modern and offer more accessibility. These conversions are often the most expensive, costing $6,000–$10,000. Most of the increased cost is from redesigning the floor to make it drain properly. Benches, inset shelves, and heated bathroom floors can also increase the final price. Shower Door Cost The average cost for a shower enclosure, which adds additional protection from water, is $200–$3,000, depending on the features and type. A shower door is an effective way to keep water in the shower where it belongs without the use of another framed wall, giving it a more open feel. Framed shower doors are the most affordable, including a heavy-duty aluminum frame for increased stability and leak protection. Frameless shower doors, also known as “heavy glass,” are slightly more expensive but look sleeker. They use a thicker glass, usually 3/8 inch thick, instead of a metal frame. All shower enclosures use tempered glass, and it can come in either clear or opaque styles. Here is a breakdown of what costs each shower door type will add: Framed shower doors ($200-$600) Shower units are either sliding units or swinging glass doors. They provide an elegant, customizable shower enclosure and feature watertight seals with easy entry, making them a popular alternative to basic shower curtains. Frameless shower doors ($500-$3,000) Frameless shower doors utilize heavy glass as the primary material to create a minimal, seamless enclosure that complements contemporary bathroom styling. Glass panels are installed edge-to-edge and connected using clamps and hinges. The hinges allow the doors to swing open easily. This frameless construction provides an airy, open feel. Custom shower enclosures ($3,000+) These made-to-order enclosures are designed for showers with nonstandard sizes and layouts. Ordering a custom shower unit provides an ideal fit, unique features, and custom styling. Towel bars can also be designed into custom units. Shower Accessories Cost Shower accessories can vary from a few dollars to a few hundred. For instance, shower curtains start at as little as $20, while heated towel racks might run well over $500. The addition of a hand-held showerhead, bench, shelf, or footstool can make a stall feel like a spa. The most common shower accessories provide comfort and convenience, such as bath mats or towel hooks. Some homeowners opt for more luxurious additions, such as heated towel racks and recessed lighting. These high-end accessories can increase your comfort and home’s resale value but require a larger up-front investment. Here’s a breakdown of average costs for common accessories. Bathroom towel warmer: $600 Shower footstool: $50–$500 Shower bench: $100–$300 Variable showerhead: $75–$450 Additional Factors of Tub-to-Shower Conversions Tub-to-shower conversion costs can vary greatly depending on your bathtub’s size, type, and the shower materials you use. Here are the key cost factors and their average price ranges. Bathtub size ($10–$65 per square foot): A large bathtub will cost more to convert than a small one. Plan on spending $10–$25 per square foot for a manufactured shower, $15–$58 for a tiled shower, and $20–$65 for a curbless shower. The standard built-in bathtub is 60 by 32 inches, though units have varying dimensions. Bathtub removal ($450–$2,000): Tubs can be more expensive than showers to remove and install. In some instances, tub removal costs more than buying a new shower. For example, removing an old clawfoot tub can be costly because it’s heavy and nearly impossible to take apart. Old tub removal usually costs $450–$800 depending on how many people are needed to get the tub out of the building. Material ($1,000–$8,000): The material you choose for your new shower floor and walls has one of the biggest impacts on your budget. Stone and tile typically cost more than fiberglass or acrylic. The plumbing controls for a shower are different than for a tub, so a new shower valve and trim will likely be required. Style (price varies): A skilled contractor can transform your tub space into a brand-new, completely renovated shower area, but this will cost you. Using the same footprint of your tub for the new shower area will lower your total cost. If you expand or reduce its size, you’ll be adding a new bathroom floor to your project too. Hidden Costs of Tub-to-Shower Conversion We’ve outlined some common cost factors for tub-to-shower conversions, but hidden costs might sneak up on you during the process. We cover these unexpected expenses below. Water damage Permits Repairs or replacement parts Typical Cost: $1,500–$9,000If the contractor uncovers water intrusion around the tub or t'
