full_description = 'Our PartnersThis Old House and Ask This Old House are made possible with the ongoing support provided by our national underwriters.<img fetchpriority="high" decoding="async" width="1024" height="1024" src="https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0-1024x1024.png" alt="TheHomeDepot.2000px-svg.0" class="wp-image-44976 size-full lazyload" srcset="https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0-1024x1024.png 1024w, https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0-300x300.png 300w, https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0-150x150.png 150w, https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0-768x768.png 768w, https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0-200x200.png 200w, https://s42814.pcdn.co/wp-content/uploads/2020/01/TheHomeDepot.2000px-svg.0.png 2000w" sizes="(max-width: 1024px) 100vw, 1024px" />The Home Depot(This Old House & Ask This Old House)The Home Depot is the world’s largest home improvement specialty retailer with over 400,000 associates and more than 2,200 stores across the U.S., District of Columbia, Puerto Rico, U.S. Virgin Islands, Guam, Canada and Mexico. The typical store today averages 105,000 square feet of indoor retail space, interconnected with an e-commerce business that offers more than one million products right at your fingertips. To make home improvement easier, faster, and more convenient, Home Depot shoppers can utilize the app, which features project calculators, visual and voice search, a variety of delivery options, and expanded tool and truck rental.For more information, visit homedepot.com.<img decoding="async" width="908" height="1024" src="https://s42814.pcdn.co/wp-content/uploads/2024/09/LOGO-RbA-Vertical-RGB-908x1024.png" alt="Renewal by Andersen logo" class="wp-image-115854 size-full lazyload" srcset="https://s42814.pcdn.co/wp-content/uploads/2024/09/LOGO-RbA-Vertical-RGB-908x1024.png 908w, https://s42814.pcdn.co/wp-content/uploads/2024/09/LOGO-RbA-Vertical-RGB-266x300.png 266w, https://s42814.pcdn.co/wp-content/uploads/2024/09/LOGO-RbA-Vertical-RGB-768x866.png 768w, https://s42814.pcdn.co/wp-content/uploads/2024/09/LOGO-RbA-Vertical-RGB.png 2048w" sizes="(max-width: 908px) 100vw, 908px" />Renewal By Andersen(This Old House)Renewal by Andersen is the full-service window replacement division of 122-year-old Andersen Corporation. Since opening its first store in Minnesota in 1995, Renewal by Andersen has rapidly grown to more than 100 markets in the U.S., becoming one of the largest replacement window companies in the country. Renewal provides homeowners a hassle-free, white-glove renovation experience. From the initial design consult to custom manufacturing, from installation and service to warranty coverage, we own the entire process, giving homeowners a single point of contact and helping make their experience the most streamlined home-improvement project they’ve ever done.For more information, visit renewalbyandersen.com'
