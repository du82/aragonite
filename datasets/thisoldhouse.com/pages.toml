["https://www.thisoldhouse.com/bathrooms/reviews/shower-remodel-cost"]
title = "How Much Does a Shower Remodel Cost? (2025)"
description = "Remodeling a shower can give your bathroom a boost. Our guide breaks down the cost of a shower remodel based on the size, project scope, and materials used."
full_description = 'Consider upgrading an outdated bathroom with a shower remodel, which can cost anywhere from $1,000 to $15,000. Updating your shower can increase your home’s resale value, improve accessibility, and provide a spa-like feel. Learn more about what it takes to remodel your shower and what the project will cost below. Cost data in this article was sourced from HomeAdvisor, Fixr, and Angi. Get Estimates from Local Bathroom Remodeling Experts Compare quotes from local pros Please Enter Your Zip Code Invalid Zip Code Get Your Estimate Enter details in under 3 minutes Clicking “Get Your Estimate” submits your data to Home Service Quotes, which will process your data in accordance with the Home Service Quotes Privacy Policy. Advertiser Disclosure The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. Ad Disclaimer The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg" class="attachment-medium size-medium" alt="kemper home insurance review" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1024x683.jpg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-768x512.jpg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1536x1024.jpg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-scaled.jpg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Full Bathroom Remodel Avg. Remodel Cost: $2,000 – $18,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg" class="attachment-medium size-medium" alt="Branches with green eucalyptus leaves in shower" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1536x1024.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-2048x1365.jpeg 2048w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-scaled.jpeg 1920w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Walk–In Shower Cost Avg. Installation Cost: $1,000 – $15,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg" class="attachment-medium size-medium" alt="Modern bathroom interior in luxury apartment" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-768x513.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1536x1025.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-scaled.jpeg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Bathtub Refinishing Cost Avg. Refinishing Cost: $335 – $630 Get Quote What Major Factors Affect Shower Remodel Cost? Shower remodel costs vary depending on the scope of your project and the materials you select. The national average cost is around $8,000, but key factors can swing that total up or down: Age and current condition: Older showers might have hidden issues that require extensive repairs or replacement, increasing the project cost. Fixtures and features: The more high-end upgrades you include, the higher the price tag will be. Labor: Labor costs can fluctuate by season, region, project complexity, and contractor experience. Materials: The choice between premium materials or prefabricated kits can change the overall cost. Project scope: A simple retiling project or fixture replacement differs significantly in cost from a full-blown shower overhaul. Shower size: The size of your shower can impact how much time and how many materials your remodel requires. Shower type: Different types of showers have different price ranges and labor costs. Age and Current Condition You may discover water damage, rusty pipes, mold, or antiquated plumbing while remodeling an older shower. Remedying these items can make your shower remodel pricier, especially if the repairs require multiple trades such as carpenters and plumbers. Fixtures and Features Investing in high-end fixtures, such as multiple shower heads or steam units, can make your daily routine feel like a luxurious spa experience. These upgrades have a higher price tag, so account for every detail, from the shower enclosure to the type of faucet. Feature/FixtureCost (Low End)Cost (High End) Multiple shower heads $75 $250 Grab bars $85 $300 Accessibility modifications $100 $800 Shower bench $100 $800 Shower ramp $100 $1,000 Lower faucet/controls $200 $800 Shower pan $530 $2,700 Bi-fold glass shower doors $750 $2,700 Frameless doors $1,000 $3,300 Steam shower $2,600 $6,050 Labor Your contractor will need to remove existing plumbing fixtures, the tub or shower wall material, and the shower base or bathtub tiles before beginning a shower remodel. Once the contractor has stripped away the old setup, they can address issues with plumbing or subfloor to prepare your new shower’s construction. The cost of these services will vary based on your location and the complexity of the project. A custom tile shower, for instance, will take more time and cost more than installing a prefab shower kit. You can expect labor to account for 40–60% of the overall cost. Materials The aesthetic materials homeowners select for the shower walls will play a big role in the longevity and cost of the new shower. One budget-friendly option is a prefab shower stall made from acrylic or fiberglass. More expensive choices include prefabricated marble showers, stone tiles or slabs, or other solid surfaces. MaterialPrice Per Square Foot Ceramic tile $6–$110 Porcelain tile $8–$40 Porcelain slab $13–$40 Stone tile $10–$110 Glass tile $25–$60 Stone slab $45–$410 Solid surface $105–$210 Prefabricated acrylic showers (entire unit) $300–$600 Prefabricated fiberglass shower (entire unit) $300–$1,000 Prefabricated marble shower (entire unit) $600–$2,000 Project Scope The scope of a shower remodel can range from a few simple improvements to a full-scale bathroom renovation. A small-scale shower remodel may involve replacing fixture trims or just replacing the walls around the bathtub. More complicated projects include tub-to-shower conversions, expanding the size of the shower, or building a custom walk-in shower with bench seats and glass block walls. Shower Size Shower size changes the material and labor costs associated with your home remodeling project. A palatial walk-in shower costs more than a basic 32×32-inch shower stall, for example. The size of the bathroom also matters. Installing a shower in a small bathroom may limit your design options while a larger room will give you additional choices. Shower Type The total cost of remodeling your shower depends on the type of shower you currently have, the type of shower you want, and how closely the two match up. Three of the most popular styles are prefabricated showers, tub-shower combinations, and walk-in showers. Prefabricated Showers Prefabricated shower kits come ready-made from the manufacturer and are typically made of acrylic or fiberglass. They come in one-piece units or with the base and wall sections as individual pieces. Prefabricated shower kits are the least expensive choice and are relatively easy to install, making them a good choice for homeowners on a tight budget or timeline. Tub and Shower Combinations Tub-shower combos merge the functionality of a bathtub and a shower. This type of shower works especially well in homes with limited bathroom space or for homeowners who want the luxury of both options without a hefty price tag. Oftentimes, homes with children need the functionality of both. When the children become old enough to transition from bathing to showering, you can add a glass shower enclosure to complete the renovation. Walk-In Showers Walk-in showers offer minimalist appeal and accessibility, as they’re easier to enter and exit than a tub-shower combination. Many homeowners choose to upgrade their walk-in showers with benches, hand-held spray units, and multiple shower heads. Here’s a rundown of the cost of the most popular shower types: Shower TypePrice Range Corner shower $1,400–$3,300 Double shower $830–$5,000+ Walk-in shower $800–$10,000+ Steam shower $2,600–$14,500 Shower-tub combo $3,000 Prefabricated shower stall $200–$8,000 DIY vs. Professional Shower Remodels You can choose to go the do-it-yourself (DIY) route or call in professional reinforcements to complete your shower remodel. Both options have their merits and cost implications. DIY Shower Remodeling The DIY approach works best for simple tasks, such as replacing the showerhead or touching up the grout between tiles. Before undertaking a DIY shower remodel project, make sure you have a clear vision of what you want to accomplish and a realistic understanding of your skills. You should also consider whether you have the tools, time, and know-how to efficiently complete the project. A Few Questions To Ask Yourself Do you have a vehicle large enough to transport all the materials you need? If not, how much will it cost to rent a vehicle or have the materials delivered? Do you have all the tools you need? Will you need to buy or rent any equipment? How long will the project take from start to finish, and can you afford to have your bathroom out of commission for that long? How much experience do you have with plumbing, tile work, and other aspects of the project? What will you do if you run into unexpected issues such as leaky pipes or a water-damaged subfloor? You can save money on labor costs by doing all or some of the work yourself, but make sure you can do it properly. Mistakes can lead to costly repairs, mildew growth, and water damage in the future. A poorly installed shower can even negatively impact your home value. Professional Shower Remodeling Hiring a professional to remodel your shower costs more upfront than the DIY approach, but it can save you time and money in the long run. An experienced contractor can replace or upgrade your shower more quickly and capably than the average homeowner. The benefits of hiring a professional include: Convenience Expertise Peace of Mind A professional team can handle every facet of your bathroom remodel, from interior design services to plumbing and electrical work. Contractors with years of experience can anticipate problems, offer design insights, secure permits, and ensure a polished finish. Most professionals offer a warranty on their work, guaranteeing a certain standard and quick resolution if issues arise. Professional contractors also have access to material discounts and specialized tools that can streamline the project and may save you money. Additional Shower Remodel Cost Factors Additional costs could emerge during your shower remodel. Permits Local municipalities often require permits for a bathroom remodel, especially if you’re making major plumbing or structural changes, so plan accordingly. Permits for a shower remodel can cost $50–$2,000 or more, depending on the specifics of your project. Mold Remediation Homeowners may find mold as they strip away the pieces of an old or poorly ventilated bathroom, and addressing the growth is paramount to a healthy household. Best left to professionals, mold and mildew remediation can cost an additional $1,500–$9,000. Unexpected Repairs Bathrooms are prime candidates for hidden water damage, and your remodeling project might uncover spongy, rotting subfloors or rusted, leaky pipes. A licensed plumber or contractor is best equipped to handle these issues before continuing with your renovation. Repairing water damage can cost $1,300–$5,500. Disposal Remodeling often means discarding old materials that cannot be tossed in your normal garbage bin. Disposing of tubs, tiles, and fixtures may require renting a dumpster or hiring a junk removal company, which will add to the cost of the project. Removing and hauling away an old tub, for instance, can cost $150–$300. If your existing bathroom was built before 1978, you may encounter asbestos in the drywall and possibly the flooring, as well as lead in the plumbing or tile glazing. During removal, these materials can become hazardous dust which should only be handled and disposed of by properly certified remediation contractors. Surface Prep Before installing new tiles or a prefab shower stall, surfaces must be flat, clean, and clear of debris or old adhesive. The underlying structure should also be waterproofed to prevent mold, mildew, and water damage. You can expect to pay $1 per square foot to have a professional install a waterproof membrane. How To Save on a Shower Remodel A shower remodel doesn’t have to break the bank. A few strategic choices can help you cut costs without compromising the end result. Choose budget-friendly materials: Choose a prefab shower or ceramic bathroom tiles instead of springing for natural stone or handmade tiles. Handle simpler tasks yourself: Some tasks may require professional intervention, but you can undertake simpler ones, such as removing old tiles or painting. Keep the same layout: Avoid making big changes to the size of your shower or the bathroom layout to minimize the amount of work required. Look for deals: Look for overstock sales, discounts, and specials on the materials you need. For professional services, gather multiple quotes and compare prices. Opt for cheaper fixtures: Shop around for fixtures that fit your budget and earn consistently high customer ratings. Reuse your old fixtures: '
