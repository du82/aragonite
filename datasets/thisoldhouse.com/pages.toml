title = "How Much Does a Walk-In Shower Cost? (2025 Pricing)"
description = "It costs an average of $6,700 to install a walk-in shower in your bathroom, either to replace your tub or to create a new, luxurious bathing space."
full_description = 'Whether you’re remodeling your shower or your entire bathroom, a walk-in shower can give your home a modern style upgrade. Walk-in showers are growing in popularity, making bathrooms look more spacious and allowing users to avoid stepping over a bathtub that no one uses any longer. You can either pick a prefabricated design to save money or can design the customized shower of your dreams. Due to the wide range of options, the cost of a walk-in shower spans from $1,000–$15,000, with an average cost of $6,700.* We’ll go over the cost factors in more detail below. *Cost figure via Angi. Find Expert Help Use our expert research to learn more about your projectEnter your ZIP code and tell us about your homeMatch with local experts who can meet your needs Get Estimates from Local Bathroom Remodeling Experts Compare quotes from local pros Please Enter Your Zip Code Invalid Zip Code Get Your Estimate Enter details in under 3 minutes Clicking “Get Your Estimate” submits your data to Home Service Quotes, which will process your data in accordance with the Home Service Quotes Privacy Policy. Advertiser Disclosure The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. Ad Disclaimer The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg" class="attachment-medium size-medium" alt="kemper home insurance review" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1024x683.jpg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-768x512.jpg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1536x1024.jpg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-scaled.jpg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Full Bathroom Remodel Avg. Remodel Cost: $2,000 – $18,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg" class="attachment-medium size-medium" alt="Branches with green eucalyptus leaves in shower" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1536x1024.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-2048x1365.jpeg 2048w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-scaled.jpeg 1920w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Walk–In Shower Cost Avg. Installation Cost: $1,000 – $15,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg" class="attachment-medium size-medium" alt="Modern bathroom interior in luxury apartment" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-768x513.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1536x1025.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-scaled.jpeg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Bathtub Refinishing Cost Avg. Refinishing Cost: $335 – $630 Get Quote Average Walk-In Shower Cost Where your project falls within the typical price range primarily depends on these factors. Prefab versus custom: Prefabricated shower stalls cost much less to install than custom designs. Type of shower: The shower’s configuration and location affects the price. Shower material: Acrylic and fiberglass cost much less than tile, solid surface, and stone. Installation and labor: Anything that increases the project’s time and effort will increase the price. Prefabricated vs. Custom Design The most relevant cost factor—and the first choice you’ll have to make—is whether to install a prefabricated or custom unit. Prefab showers include the shower pan and surround, and may even arrive with plumbing and shower doors in the kit. These showers are less expensive because they’re standardized, and they’re cheaper to install because some of the work is already done. A prefab unit with installation costs $3,000–$9,000, according to Angi. Custom walk-in showers are built from the ground up, requiring more labor. Oftentimes they involve framing a new area or incorporating an existing closet space into the shower. Customer showers are typically made of more durable, high-end materials. Depending on which options you select, a custom shower can cost anywhere from $3,500–$11,000, increasing the total cost of a bathroom remodel according to HomeAdvisor. Though this is a bigger upfront investment, custom showers might fit in better with a full bathroom renovation later on. Cost by Type of Shower The type of shower refers to its configuration and where in the bathroom it’s located. If your project is a tub-to-shower conversion, you’ll likely install the new shower in the old bathtub alcove, which requires three shower walls and a glass enclosure or shower curtain in the front. You can put your new shower in a corner with a curved or angled pan to save space in small bathrooms, though these rarely meet Americans with Disabilities Act (ADA) standards. You can also opt for a frameless or free-standing shower, with the showerhead located on the wall or in the ceiling surrounded by one or more glass panels. A free-standing shower can be open with no walls if the rest of the bathroom is large enough or a wet room. Any of these shower types can be made curbless—meaning the shower floor is flush with the bathroom floor, and there’s no lip to step over. This is often the best choice for residents with mobility issues. Here are some typical price ranges for prefab showers of various types. Type of ShowerUnit Cost*Alcove$800–$3,000Corner$800–$1,400Curbless$900–$4,000Free-standing$1,000–$7,000*Data sourced from Fixr.com. Cost by Shower Material Your shower’s materials are partially set by whether you choose a prefabricated or a custom shower. Prefab units are commonly made of acrylic, fiberglass, or cultured marble, a combination of stone particles and resin. All three are often available in multiple colors, textures, and finishes. On the higher end of both quality and pricing is solid surface, a synthetic material made of minerals and resins. Prefab Shower MaterialUnit Cost*Acrylic$800–$2,500Cultured marble$800–$3,000Fiberglass$2,000–$5,000*Data sourced from Fixr.com. Custom showers offer more design and material options. Some custom showers use a prefabricated pan with an added seat for customization. Because custom showers don’t have standard-sized walls or floors, adaptable materials are a must. Ceramic and porcelain tiles tend to be the least expensive while natural stone slabs are the priciest. Here are the most common materials and their costs per square foot. Custom Shower MaterialPrice per Square FootCeramic tile$1.25–$100Glass tile$20–$50Porcelain tile$3–$30Porcelain slab$8–$30Solid surface$100–$200Stone slab$40–$400Stone tile$5–$100*Data sourced from Fixr.com. Installation and Labor Costs Labor varies depending on whether you’re installing a kit or creating a large custom shower. You may pay as little as $750–$2,500 in labor if you choose a prefabricated unit, according to the home remodeling website Fixr.com. Your price will depend on how much alteration your current bathroom requires and whether any repairs or additional waterproofing are needed. Custom showers usually cost $4,000–$8,000 to install. This typically includes carpentry, plumbing, electrical work, tile and grout work, drywall, and more. Additional Cost Considerations The above factors have the biggest impact on cost, but you should also consider the following. Shower Size Your new shower’s size will partially determine its material and installation costs. The ADA requires showers to be no smaller than 36 inches by 36 inches to meet accessibility standards. According to Fixr, a prefab unit of this size usually costs $800–$1,200. Units can go up to 60 inches by 72 inches, usually costing $1,800–$7,000. You can determine the size and dimensions of a custom shower yourself. Plumbing and Electrical You’ll need to hire licensed trade professionals for specialty work. Converting a tub to a shower or moving faucets or drains requires a licensed plumber. These professionals will ensure everything in your bathroom remodel is up to code. You’ll also need an electrician if you’re installing shower lighting or a new ventilation fan. According to Fixr, both of these specialists charge around $75–$150 per hour. Shower Enclosure Keeping water inside your new walk-in shower is key, so a good glass shower enclosure matters. Kit showers often use standard shower enclosures, but you’ll probably need to have the enclosure measured and installed by a glass professional for custom showers. A common upgrade is 3/8-inch-thick glass, also known as heavy glass, which can easily be colored, shaped, and accented. Expect a custom enclosure to cost $700–$5,000. Shower Accessories and Upgrades Safety is often a primary concern for homeowners installing new walk-in showers. Many accessories and upgrades can make keeping your balance, entering the shower, and exiting it safer. There are also benches and ledges for sitting or shaving legs which can be added along with bottle and soap ledges. Shower AccessoryCost*Bench$100–$300Built-in shelves$75–$300Grab bars$85–$300Slip-resistant floor$200–$1,000*Data sourced from Fixr.com. How To Save on Walk-In Showers Even if you hire professional shower installers, you can still save money by following these tips. Install a prefabricated shower in an existing location instead of customizing your shower. Do your old shower or tub’s disassembly and removal yourself using proper safety equipment. If you opt for a tile shower, consider doing grout sealing at the end of installation. Work with your home’s existing plumbing location as much as possible. DIY vs. Professional Walk-In Shower Installation Avid do-it-yourselfers (DIYers) may be tempted to install a new shower themselves to save money on labor costs. Here’s what you should know. DIY Installation Many prefab units are sold as shower kits, which an experienced DIYer may be able to install. A plumber will most likely still be needed to hook the drain and water valve, but you’ll save on the remainder of the project’s labor costs. The supplies you need depend on the specifics of your shower remodel, but if you’re not altering your bathroom’s plumbing or wiring, you might be able to take on the project yourself. Professional Installation Custom showers need to be installed by professionals. You may be able to do some preparation and finishing yourself, but most work should be completed by contractors. Because the project requires waterproofing a custom-made space, experts will do a better job at protecting your bathroom from mold, mildew, and water damage. You’ll have to pay labor costs, but the job will be finished more professionally, safely, and quickly. You’ll need a carpenter, a plumber, an electrician, a tile or slab installer, and a glass professional for most custom showers. This is one of the reasons to hire a general building contractor to oversee the project and make sure that all pieces are installed correctly and professionally. Additionally, it’s the contractor’s job to use licensed and insured subcontractors and verify their credentials and experience. Expect to pay an additional 10%–25% for the service of a general contractor. How To Hire a Professional When looking for professional shower installers, keep the following things in mind. All the tradesmen involved should be licensed in your state. All contractors should carry workers’ compensation and liability insurance. Check the company’s Better Business Bureau (BBB) rating and accreditation status. Get quotes on a set design from at least three different contractors before making your choice. Ask for the contact details of prior customers who can verify the work quality and customer service. Is Installing a Walk-In Shower Worth It? Installing a walk-in shower can make showering more enjoyable, simplify life for those with mobility issues, and raise your home’s resale value. Plan your budget carefully, and consider a prefab shower if cost is a primary concern. We recommend professional installation for inexperienced DIYers or those installing a custom shower. Design your shower first and choose materials before talking with several local contractors. FAQs About Walk-In Showers How much does the average walk-in shower cost? According to Fixr.com, a new walk-in shower costs an average of $6,700, but the project’s price can range from $1,000–$15,000 depending on your chosen design and how much work you do yourself. Will adding a walk-in shower increase my home’s value? Replacing a tub or old shower with a walk-in shower may increase your home’s value, particularly if you live in an area with older residents where accessible bathrooms are important. However, families with young children tend to value having at least one bathtub in the house. What is the difference between a walk-in shower and a step-in shower? A step-in shower is usually combined with a bathtub, and you must step over the side of the bathtub to get in. A walk-in shower has no tub, so you may only need to step over a small lip called a curb—or sometimes no lip at all—to get in. { "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [[ { "@type": "Question", "name": "How much does the average walk-in shower cost?", "acceptedAn'
