description = "Find out how much it costs to install the bathtub of your dreams in this comprehensive bathtub replacement and installation guide."
full_description = 'Upgrading your bathtub can enhance your bathroom’s appearance and provide a luxurious bathing experience. Whether you’re replacing the old tub with a similar model or splurging on a soaking tub, it’s important to budget for the cost of your bathroom remodel. The cost of installing a bathtub can range from $1,950 to $9,200, with the national average being $5,600. This comprehensive guide breaks down bathtub installation pricing and provides saving tips. Note: Cost data in this article was sourced from Angi and HomeAdvisor. Key TakeawaysThe average cost of installing a bathtub is around $5,600 but can vary depending on the scope of your project. Although the majority of installation costs come from the tub material and the tub itself, additional factors such as hardware, repairs, and upgrades can increase your expenses. Find Expert Help Use our expert research to learn more about your projectEnter your ZIP code and tell us about your homeMatch with local experts who can meet your needs Get Estimates from Local Bathroom Remodeling Experts Compare quotes from local pros Please Enter Your Zip Code Invalid Zip Code Get Your Estimate Enter details in under 3 minutes Clicking “Get Your Estimate” submits your data to Home Service Quotes, which will process your data in accordance with the Home Service Quotes Privacy Policy. Advertiser Disclosure The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. Ad Disclaimer The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg" class="attachment-medium size-medium" alt="kemper home insurance review" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-300x200.jpg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1024x683.jpg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-768x512.jpg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-1536x1024.jpg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2022/07/29205534/kemper-home-insurance-review-scaled.jpg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Full Bathroom Remodel Avg. Remodel Cost: $2,000 – $18,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg" class="attachment-medium size-medium" alt="Branches with green eucalyptus leaves in shower" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-768x512.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-1536x1024.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-2048x1365.jpeg 2048w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190716/AdobeStock_418331498-scaled.jpeg 1920w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Walk–In Shower Cost Avg. Installation Cost: $1,000 – $15,000 Get Quote <img decoding="async" width="300" height="200" src="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg" class="attachment-medium size-medium" alt="Modern bathroom interior in luxury apartment" srcset="https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-300x200.jpeg 300w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1024x683.jpeg 1024w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-768x513.jpeg 768w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-1536x1025.jpeg 1536w, https://dlczb9lfz9r73.cloudfront.net/wp-content/uploads/2023/03/29190659/AdobeStock_260392691-scaled.jpeg 2048w" sizes="(max-width: 300px) 100vw, 300px" data-eio="l" /> Bathtub Refinishing Cost Avg. Refinishing Cost: $335 – $630 Get Quote How Much is the Average Bathtub Installation Cost? How much your bathtub will cost to install depends on these three main factors. Bathtub materials: Acrylic, fiberglass, and steel tubs cost the least, while copper, solid surface, and natural stone tubs cost the most. Bathtub type: The larger and more specialized the tub, the more it will cost. Tub surrounds: The material surrounding the alcove or wall behind the tub will also increase your total project costs. Cost by Bathtub Type Tubs can be divided into various categories, but how the tub is used is most relevant to cost. All-Purpose Standard Bathtubs Most bathrooms have a general-purpose standard tub, either as a stand-alone or as part of a tub-shower combo. These tubs are the least expensive. They tend to be shallow and made of acrylic, steel, or fiberglass. Freestanding Bathtubs Tubs that aren’t attached to the wall like clawfoot bathtubs are called free-standing tubs. These don’t require decking or surrounds but may require specialty plumbing for faucets and drainage. They can sit directly on the bathroom floor or have feet or an elevated base to create a focal point. These tubs are often made of attractive natural stone, solid surface, or copper materials. Jet or Whirlpool Tubs Whirlpool or jetted tubs feature water-circulating jets that can be fixed or adjustable. These tubs are meant to deliver a spalike bathing experience and are priced accordingly. They’re generally lightweight acrylic tubs located in an alcove so there’s hidden space around the tub for the motor, heater, and jet plumbing. Jetted tubs also require a dedicated electrical circuit for the motor and heater, which can add to the cost of installation. Soaking Tubs Tubs meant for soaking are particularly deep. Many free-standing tubs are also soaking tubs, though some may be designed to drop into existing decking. Most soaking tubs are long enough to stretch out in. Japanese-style soaking tubs are designed for sitting, providing luxury while minimizing floor space. Walk-In Tubs Walk-in bathtubs have hinged doors that allow users to enter the tub without stepping over the side. They also have sitting bench seats and typically fill to the user’s shoulders. People who use wheelchairs or have limited mobility can use these tubs with relative safety, though they’ll need to sit in the tub while it fills and until it empties. These tubs typically require specialty installation, making them more expensive in terms of both labor and materials. .thcb-table_8224 { margin: 20px auto 10px auto; padding: 0px 0px 4px 0px; } .thcb-table_8224 table { border-color: transparent; } .thcb-table_8224.show-top-border table { border-top: 2px solid transparent; } .thcb-table_8224 table thead tr { background-color: #fff; } .thcb-table_8224 table thead tr th { color: #2C2C2C !important; border-color: transparent !important; border-bottom-color: #e0e0e0 !important; } .thcb-table_8224 table tbody tr td, .thcb-table_8224 table tbody tr td p{ color: #000000; } .thcb-table_8224 table tbody tr td { border-color: #e0e0e0; } .thcb-table_8224 table tbody tr { background-color: #ffffff; } .thcb-table_8224 table.has-row-stripes tbody tr:nth-child(2n) { background-color: #F9F8F3 !important; } .thcb-table_8224 table.has-sticky-col thead tr th:first-child { background-color: #fff !important; } .thcb-table_8224 table.has-row-stripes.has-sticky-col tbody tr td:first-child { background-color: #ffffff !important; } .thcb-table_8224 table.has-row-stripes.has-sticky-col tbody tr:nth-child(2n) td:first-child { background-color: #F9F8F3 !important; } Type of TubPrice All-purpose tub $200–$800 Free-standing/clawfoot tub $2,500–$10,000 Jet/whirlpool tub $1,000–$4,000 Soaking tub $600–$13,000 Walk-in tub $2,000–$8,000 Cost by Bathtub Material Lighter bathtub materials cost less than heavier ones, though they’re often less durable. Here’s how much some of the most common tub materials cost, excluding labor: Acrylic Tubs Acrylic is one of the most common and inexpensive tub materials due to its light weight and easier installation process. You can find acrylic tubs in many styles and colors. They’re often referred to as fiberglass tubs since they’re made of an acrylic coating over a reinforced fiberglass frame. Acrylic tubs can be expensive because high-tech models are often made of acrylic over fiberglass due to its ability to be shaped easily. Cast Iron Tubs Cast iron infused with porcelain is one of the oldest bathtub materials due to its place in historical casting, its durability, and the ability to hold heat. These tubs can be affordable but are heavy and may require floor reinforcement. Copper Tubs Copper has a distinctive appearance, is durable, and easily resists bacteria, mold growth, and corrosion. However, these tubs are expensive because of the material’s value and the difficulty of building them. They’re usually handmade, so you may not be able to find them in an exact size or style. Enameled Steel Tubs Enameled steel holds heat like cast iron but is much lighter, making it less expensive and easier to install. Most steel tubs are coated in white or off-white enamels. Steel-coated tubs also come in insulated versions to be less tinny sounding and to seem more like cast-iron tubs. Fiberglass Tubs Fiberglass tubs are similar to acrylic tubs since they’re both based on fiberglass, but there are differences. Fiberglass tubs are less durable and can become porous and stain, but they’re also cheaper and easier to repair. Acrylic tubs can be refinished, though this is a time-consuming project. Fiberglass bathtubs aren’t as durable as metal or stone and their color fades with time. Granite Tubs Granite bathtubs are a luxury option, often chosen as freestanding statement pieces in a large bathroom. They’re expensive because they’re carved from a single chunk of natural stone, which is extremely heavy and durable. Unfortunately, they’re high-maintenance if you want to prevent staining and etching. Marble Tubs Marble bathtubs are typically made of poured cultured marble rather than solid chunks of natural marble, as this would make them prohibitively expensive. Cultured marble can be customized in many ways, and the gel coating increases durability and ability to be refinished. Solid-Surface Tubs Solid surface is a synthetic composite material containing acrylic, minerals, and resin. It’s waterproof and stain-resistant, making it a popular choice for countertops, bathtubs, and other home features. Solid surface can be poured into shape, making it customizable. While damages can easily be repaired, solid surface sits on the high end of the cost spectrum. .thcb-table_8225 { margin: 20px auto 10px auto; padding: 0px 0px 4px 0px; } .thcb-table_8225 table { border-color: transparent; } .thcb-table_8225.show-top-border table { border-top: 2px solid transparent; } .thcb-table_8225 table thead tr { background-color: #fff; } .thcb-table_8225 table thead tr th { color: #2C2C2C !important; border-color: transparent !important; border-bottom-color: #e0e0e0 !important; } .thcb-table_8225 table tbody tr td, .thcb-table_8225 table tbody tr td p{ color: #000000; } .thcb-table_8225 table tbody tr td { border-color: #e0e0e0; } .thcb-table_8225 table tbody tr { background-color: #ffffff; } .thcb-table_8225 table.has-row-stripes tbody tr:nth-child(2n) { background-color: #F9F8F3 !important; } .thcb-table_8225 table.has-sticky-col thead tr th:first-child { background-color: #fff !important; } .thcb-table_8225 table.has-row-stripes.has-sticky-col tbody tr td:first-child { background-color: #ffffff !important; } .thcb-table_8225 table.has-row-stripes.has-sticky-col tbody tr:nth-child(2n) td:first-child { background-color: #F9F8F3 !important; } Tub MaterialPrice Range Acrylic $700–$1,000 Cast iron $400–$14,000 Copper $2,000–$5,000 Enameled steel $200–$1,000 Fiberglass $200–$800 Granite $10,000–$20,000 Marble $2,000–$5,000 Solid surface $2,100–$8,000 Signs That You Need to Replace Your Bathtub Sometimes it will be obvious that you need a new tub. Here are some signs to look out for: Outdated style Stains that can’t be removed by cleaning Visible cracks or leaks You or your family’s changing accessibility needs How Much Does a Bathtub Surround Cost? During installation, you’ll need to replace the surround walls of your new bathtub. If you have a tub-shower combination, these surrounds sit on top of the tub and must reach past the showerhead to provide proper waterproofing. Often, a free-standing tub will have a half-height surround on the walls of the alcove adjacent to the tub. Here’s a breakdown of various bathtub surround materials and their costs for a 60-square-foot installation. .thcb-table_8226 { margin: 20px auto 10px auto; padding: 0px 0px 4px 0px; } .thcb-table_8226 table { border-color: transparent; } .thcb-table_8226.show-top-border table { border-top: 2px solid transparent; } .thcb-table_8226 table thead tr { background-color: #fff; } .thcb-table_8226 table thead tr th { color: #2C2C2C !important; border-color: transparent !important; border-bottom-color: #e0e0e0 !important; } .thcb-table_8226 table tbody tr td, .thcb-table_8226 table tbody tr td p{ color: #000000; } .thcb-table_8226 table tbody tr td { border-color: #e0e0e0; } .thcb-table_8226 table tbody tr { background-color: #ffffff; } .thcb-table_8226 table.has-row-stripes tbody tr:nth-child(2n) { background-color: #F9F8F3 !important; } .thcb-table_8226 table.has-sticky-col thead tr th:first-child { background-color: #fff !important; } .thcb-table_8226 table.has-row-stripes.has-sticky-col tbody tr td:first-child { background-color: #ffffff !important; } .thcb-table_8226 table.has-row-stripes.has-sticky-col tbody tr:nth-child(2n) td:first-child { background-color: #F9F8F3 !important; } Bathtub Surround MaterialPrice (Material Only) Acrylic $300–$700 Composite $250–$2,000 Fiberglass $400–$1,200 Natural stone $2,400–$24,000 Quartz $6,000–$12,000 Solid surface $6,000–$12,000 Tile $120–$6,000 Acrylic: Very easy to care for and maybe prefabricated with features like soap dishes and grab bars Composite: Customizable and can be installed directly into '
