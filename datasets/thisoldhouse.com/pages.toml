full_description = "About This Old House Ventures, LLCThis Old House Ventures, LLC is the company behind a leading multi-platform home enthusiast brand, serving over 20 million consumers each month with trusted home improvement information and expert advice.When This Old House premiered in 1979, the show launched a new television genre, empowering legions of home remodelers. More than four decades later, the company boasts two of the top-rated home improvement shows on television in This Old House and Ask This Old House, the highly regarded This Old House Magazine, and a robust digital business at ThisOldHouse.com and across a myriad of platforms including social, podcasting, app, YouTube, and free ad-supported digital television.The National Academy of Television Arts & Sciences has recognized This Old House and Ask This Old House with 20 Emmy® Awards and 105 nominations, with the most recent honor coming in July, 2021 when This Old House won “Outstanding Instructional and How-To Program” at the 48th Annual Daytime Emmy® Awards.The brand continues to resonate with audiences across the world, as detailed by The New York Times, Salon and The Atlantic, as well as evidenced by recent appearances on The Today Show and The Tonight Show Starring Jimmy Fallon.This Old House Ventures, LLC, is headquartered in Stamford, CT, and has a production studio in Concord, MA."
