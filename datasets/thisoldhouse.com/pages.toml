["https://www.thisoldhouse.com/bathrooms/87621/reglazing-tile"]
title = "How To Reglaze Bathroom Tile and Freshen up your Surfaces"
description = "Give your old tiles new life by reglazing them. Read this guide to learn what you need and how to reglaze tiles to make them look fresh."
full_description = 'Navigation for Bathrooms Overview Budget Ideas How To & DIY Ideas & Inspiration Installation Maintenance Planning Renovation Video ReviewsHow To Reglaze Bathroom TileGive your old tiles new life by reglazing them. by Tom ScalisiUpdated 08/28/2024 iStock We may be compensated if you purchase through links on our website. Our team is committed to delivering honest, objective, and independent reviews on home products and services.MoreProject detailsSkill2 out of 5Easy to ModerateCostRoughly $50–$80 per 100 square feet (depending on the product)Estimated Label3–4 days (one day of working time)Reglazing bathroom tile is a cost-effective way to refresh your space without the hassle of a full renovation. This do-it-yourself-friendly process can transform outdated or worn tiles and give your bathroom an updated look. We’ll walk through the steps of reglazing bathroom tile, from preparation to maintenance, to help you achieve professional-looking results.RelatedThe Best Firewood to Heat Your HomeWhat Is Tile Reglazing?Tile reglazing involves applying a new finish to existing tiles rather than restoring the original glaze. Instead, the old surface is covered with a durable coating (typically epoxy-based) that adheres to the existing tile. It’s an excellent option when your tiles are structurally sound but visually outdated or worn. Reglazing your bathroom tiles offers several advantages over replacement:Cost-effective: Reglazing is significantly less expensive than replacement.Customizable: Choose from a wide range of colors to match your bathroom.Eco-friendly: Reglazing reduces waste by reusing existing materials.Less messy: Avoid the dust and debris associated with tile removal.Time-saving: Takes only a few days, compared to weeks for a total renovation.However, if any tiles are missing or seriously damaged, you may need to replace them instead.Essential Materials and Tools for Reglazing Bathroom TileHere’s what you’ll need to get started on your tile reglazing project:Box fanDrop cloths or plastic sheetingEmpty bucketsMicrofiber clothsOrbital sanderPaint roller and trayPaintbrushPainter’s tapePencilPutty knife or scraperRespiratorSafety equipment (goggles, gloves, respirator)Sandpaper (400 and 600 grit)Tile cleaning solutionTile reglazing kit (including primer and epoxy)Wet/dry vacuumTools & Materials<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2021/10/TOOL_drywall_puttyknife_iStock_1327579568-1-scaled.jpg.optimal.jpg" />Putty knife<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2021/10/TOOL_Utility_Knife_iStock_173811871-scaled.jpg.optimal.jpg" />Utility knife<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2021/11/TOOL_RandomOrbitSander_iStock_1185649269-scaled.jpg.optimal.jpg" />Orbit sander<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2021/11/TOOL_WetDryVac_ShopVac_iStock_182890011a-scaled.jpg.optimal.jpg" />Wet/dry vac<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2021/11/TOOL_PaintRoller_iStock_478623702-scaled.jpg.optimal.jpg" />Paint roller<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2021/10/TOOL_Paintbrush_iStock_184953379-1-scaled.jpg.optimal.jpg" />Paintbrush<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2023/04/TOOL_empty-paint-bucket-istock-scaled-1-scaled.jpg.optimal.jpg" />Empty paint bucketSafety Tips for Reglazing TileStay safe when working with epoxy and other chemicals. Wear gloves and protective clothing to prevent skin contact, and keep a first aid kit handy for minor accidents.Setting Up Proper VentilationReglazing products contain volatile organic compounds (VOCs) that can be harmful if inhaled. Set up proper ventilation by opening windows and putting a box fan in the window to blow fumes outside. We also recommend wearing a respirator.Handling Chemical SpillsIf spills occur, clean them promptly using appropriate methods and protective gear. Follow the manufacturer’s guidelines for disposal and cleanup of epoxy products to stay safe and comply with environmental guidelines.Step-by-Step Guide To Reglaze Bathroom TileHere are our steps for a successful tile reglazing. Be sure to read all the manufacturer’s instructions before starting. If they suggest a specific temperature and humidity range, follow the guidelines to help the finished product look its best.Cleaning and Repairing Existing TilesThoroughly clean the tiles. Using a putty knife or scraper, remove any gunk, buildup, or debris. For stubborn residue, use a tile-cleaning solution. Rinse thoroughly to remove any cleaning solution residue.Inspect the tiles for any damage. Reglazing can hide minor imperfections, but you’ll want to repair major cracks or chips before proceeding.Protecting Surrounding AreasUse painter’s tape to protect areas you don’t want to reglaze, such as fixtures, trim, and adjacent surfaces. Lay down drop cloths or plastic sheeting to protect your floor and fixtures.Sanding the Tile SurfaceSand the tile surface to help the primer adhere better:Attach 400-grit sandpaper to your orbital sander.Sand the entire tile surface to remove the glossy finish.Vacuum the dust and wipe the surface clean with a damp microfiber cloth.Repeat the process with 600-grit sandpaper for a smoother finish.Rinse the surface with clean water and let it dry completely.Applying PrimerNow it’s time to apply the primer:Pour the primer into a paint tray.Use a paintbrush to cut in around edges and grout lines.Roll the primer onto the wider tile areas, taking your time for even coverage.Allow the primer to dry according to the manufacturer’s instructions, typically two to four hours.Mixing and Applying the Reglazing EpoxyOnce the primer is dry, it’s time to apply the epoxy. These chemicals typically have very strong fumes, so put on your respirator if you’re not already wearing it.Steps for mixing and applying the epoxy include:Mix the epoxy components in a clean bucket according to the manufacturer’s instructions.Pour the mixed epoxy into a paint tray.Use a paintbrush to cut in along edges and grout lines.Roll the epoxy onto the tile surface, maintaining a wet edge to avoid lap marks.Work quickly, as most epoxies have a limited working time of about six hours.Apply a thin, even coat and avoid overloading the roller or brush.Adding the Final CoatTwo coats of reglazing epoxy should be enough. Keep track of time and apply the second coat exactly when the manufacturer states. If you wait too long, the coat will cure, and you’ll have to start sanding all over again. If you apply it too soon, the epoxy will run and pool.Allow the first coat to dry for 45 minutes to an hour or as directed by the manufacturer.Apply a second coat of epoxy using the same technique as the first.Maintain even coverage and watch for drips or pooling in grout lines.If needed, lightly sand the surface between coats for smoother results.Curing and MaintenanceProper curing and maintenance help your reglazed tiles last longer. Follow these guidelines to protect your newly refreshed bathroom.Proper Curing TimeAllow the reglazed surface to cure fully before using the bathroom. This process typically takes three to four days—we recommend following the manufacturer’s recommendations for best results. Keep the area well-ventilated and avoid using the bathroom, as high humidity levels will prevent the reglazing epoxy from curing.Cleaning and Maintaining Reglazed TilesOnce the epoxy is completely dry, clean the entire surface with a tile-cleaning solution and a microfiber cloth.Maintaining Grout LinesThe reglazing process coats grout lines, but they may still require occasional touch-ups. Use a grout pen or resealer as needed to maintain your grout’s fresh look.Common Mistakes To Avoid When Reglazing Bathroom TileAvoid these common mistakes when reglazing your bathroom tiles:Applying epoxy too thick or too thin: This can result in an uneven or brittle finish.Inadequate surface preparation: Failing to clean and sand tiles thoroughly can lead to poor adhesion.Neglecting to protect surrounding areas: Spills and drips can ruin fixtures and flooring.Poor ventilation: Inhaling fumes from the epoxy can be dangerous, and inadequate ventilation will slow the curing process.Rushing the process: Skipping steps or not adhering to recommended cure times can negatively affect the results.Professional vs. DIY ReglazingWhile you technically can reglaze your bathroom tile with supplies from the hardware store, consider your skills and available time before starting. Doing it yourself gives you complete creative control and is typically more affordable than hiring a professional. However, professionals are less likely to make mistakes and typically work much faster.We recommend calling a professional if any of the following apply:The project involves a large area or complex tile patterns.You don’t have the time to do a thorough job yourself.You’re not confident in your do-it-yourself (DIY) skills.Your tiles require significant repairs before reglazing.Cost Considerations For Tile ReglazingA tile reglazing kit typically costs $30–$50 at hardware stores. Hiring a professional costs between $4–$10 per square foot, according to HomeAdvisor.Be aware of the cost of making DIY mistakes: according to Angi, it costs between $10–$50 to retile a bathroom.Next Up In Bathrooms Before and After: From Builder-Grade Bathroom to High-Style Upgrade How to Install a Recessed Cabinet How To Repair a Shower Anti-Scald Pressure Balancer Shower Upgrades for Aging in Place How To Fix a Wobbly Toilet What to Know Before Buying a Pedestal SinkMost Popular Our 6 Best Above-Ground Pool Picks (2024) Play How To Get Rid of Ice Dams 8 DIY Humidifier Ideas 7 Best Tankless Water Heaters (2025) How To Build a Sauna Newsletter Sign up for the Newsletter Get the latest This Old House news, trusted tips, tricks, and DIY Smarts projects from our experts–straight to your inbox. Email (required) By submitting your email, you agree to our Terms and Privacy Policy. You can opt out at any time. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Subscribe'
