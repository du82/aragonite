 Beach House Season 22 - The Charlestown House Season 21 - The Billerica House Season 21 - The Santa Barbara House Season 20 - The Watertown House Season 20 - The Key West House Season 19 - The Milton House Season 19 - The San Francisco House Season 18 - The Nantucket House Season 18 - The Tucson House Season 17 - The Salem House Season 17 - The Savannah House Season 16 - The Acton House Season 16 - The Napa Valley House Season 15 - The Belmont House Season 15 - The Honolulu House Season 14 - The Lexington Ranch Season 14 - The Miami House Season 13 - The London House Season 13 - The Wayland House Season 12 - The Jamaica Plain House Season 12 - The New Orleans House Season 11 - The Concord Barn Season 11 - The Santa Fe House Season 10 - The Lexington Bed and Breakfast Season 9 - The Santa Barbara Bungalow Season 9 - The Westwood House Season 8 - The Phoenix House Season 8 - The Brimfield House Season 8 - The Reading House Season 7 - The Tampa House Season 7 - The Melrose House Season 7 - The Newton Victorian Season 7 - The Reading Ranch Season 6 - In and Around Boston Season 5 - The Brookline House Season 4 - The Arlington House Season 3 - The Woburn House Season 2 - The Newton House Season 1 - The Dorchester House Cast Norm Abram Heath Eastman Lee Gilliam Nathan Gilbert Mauro Henrique Mark McCullough Jenn Nawada Tom Silva Charlie Silva Richard Trethewey Ross Trethewey Webcams Submit Your House About This Old HouseSeason 46 starts with the revival of a 1929 brick cottage in Nashville, TN. Then, the crew heads to Ridgewood, NJ to remodel a 1930s Colonial Revival. The last stop: a 19th century historic home in Westford, MA.Latest Seasons Season 46 - Westford Historic RenovationA 19th century house damaged by fire finds new owners to bring it back to life Season 46 - Ridgewood Colonial RevivalA quaint but tired 1930 house gains more space, new systems, and a fresh outlook. Season 46 - Nashville Brick CottageAn historic home damaged by a tornado gets an update to accommodate a young family Season 45 - Glen Ridge GenerationalA tired Victorian gets a refresh to restore original details and make room for multiple generations. Season 45 - Lexington ModernThis 1960s home with disjointed additions gets a modern update so the whole family can enjoy it together. Season 44 - 1720 Cape Ann GambrelAn empty-nester couple relocates from Washington, DC, to work remotely in their historic house in Ipswich, MA. This tired 1720 Gambrel will be restored, while wood beams and floors from the 1800’s ell will be re-used in the new addition. Season 44 - Newburyport Forever HouseThe Schwab family is looking to remodel their classic New England-style home in Newburyport, MA, to become their forever home. This 1,400-square-foot house (and others on the street) was initially built in 1889 to house the local shipbuilders. Season 44 - Atlanta Postmaster's HouseThis house was the focal point of the black community in South Atlanta, and was once owned by the area's first postmaster, Luther Price. The deep history and charm led homeowners Kysha and Jonathan to want to restore it for their family and use it as a homeschool for their children. Season 43 - Saratoga Legacy RestoredA worn and tattered multi-generational Dutch Colonial gets its second wind in a turn toward its former glory. Season 43 - The West Roxbury VictorianOriginally built on farmland in 1894, the West Roxbury Victorian was the first one-family erected in the new subdivision. Will the crew be able to bring the house up to the lifestyle standards of the 2020s? Season 43 - The Concord Country CapeAn urban-dwelling couple plan to leave the city for this 1880 New England Cape in historic Concord, Massachusetts. They plan to improve the views of the beautiful three-acre property and make better use of the space inside. Season 42 - Extra EpisodesSeason 42 concludes with four Specials—Scandinavian Modern, Generation Next, Rebirth of Detroit, and Return to Paradise. Season 42 - The Dorchester Triple DeckerThis 1905 three-family home in Dorchester, MA endured a fire on the 4th of July in 2019. Thankfully, no one was hurt, but the house suffered significant damage. In addition to repairing the fire damage in the back of the house, all three kitchens will need restoration, and the water-damaged heating system needs to be replaced in the basement. Episodes air the first week of April on PBS. Check your local listings. Season 42 - The Seaside Victorian CottageThis three-bedroom, one-bathroom Queen Anne Victorian in Narragansett, Rhode Island sits on a corner lot, steps from the beach. It is in poor condition with rot, deterioration, and structural damage. The design will replicate the exterior architectural details, such as the curved shingles and the “rising sun” patterned clapboards, as well as improve the foundation and footings, fix and expand the deteriorating porch, and replace the rotting roof. Season 41 - The Cape Ann HousePutting the history back into this turn-of-the-century beauty, homeowners John and Molly plan to strip away the 1970s carpet, cracking balusters, and doors to nowhere and reclaim the history of this rambling shingle-style home. Episodes begin on March 26, 2020. Check your local listings. Season 41 - Rebuilding ParadiseFamilies rebuild their homes and lives after the California wildfire. This Old House visits Paradise, CA in a special four-episode series. Season 41 - The Westerly Ranch HouseA 1940s ranch will be transformed into an updated Dutch Colonial revival. Cast More Cast Kevin O’ConnorHost Richard TretheweyPlumbing and Heating Expert Jenn NawadaLandscape Contractor Tom SilvaGeneral ContractorPagination More Content"
