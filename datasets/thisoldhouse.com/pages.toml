08-78421 .two-panel .product-logo img{ max-width: 80%; } @media (max-width: 499px) { #cta-widget-99408-78421 .widget-container { margin: 0 auto; } #cta-widget-99408-78421 .widget-header .header-text { font-size: 16px; margin-bottom: 0; } #cta-widget-99408-78421 .widget-header .subheader-text { display: none; } #cta-widget-99408-78421 .product-logo { text-align: inherit; margin: 0 auto; } #cta-widget-99408-78421 .two-panel .widget-panel { padding: 10px 0 0; } #cta-widget-99408-78421 .button, #cta-widget-99408-78421 .two-panel .button { width: 100%; margin: 10px auto 0; } #cta-widget-99408-78421 .product-logo img, #cta-widget-99408-78421 .two-panel .product-logo img{ margin: 0; max-height: 75px; width: auto; } } Check Price Best Bathtubs: Top 7 Picks*Links below open to product retail page.Best Overall: FerdY Acrylic Freestanding BathtubBest Alcove Tub: Kingston Brass Alcove BathtubBest Standard Tub: American Standard Apron BathtubBest Freestanding Tub: WOODBRIDGE BathtubBest Walk-In Tub: Empava Freestanding Walk-In BathtubBest Design: KOHLER K-20201 Alcove Bath Best Portable: ELDERFLOWER & BERRIES Portable BathtubCompare Top BathtubsProductWater CapacityDesign TypeWarrantyWeightDimensionsFerdY Acrylic Freestanding Bathtub52 gallonsFreestanding6-year (structural and surface)91 pounds‎55.1 x 28 x 22.8 inchesKingston Brass Alcove Bathtub58 gallonsAlcoveLifetime95 pounds‎60 x 30.7 x 22.1 inchesAmerican Standard Apron Bathtub48 gallonsAlcoveLifetime96 pounds60 x 30 x 19 inchesWOODBRIDGE Bathtub55 gallonsFreestanding1-year114 pounds‎59 x 32 x 23 inchesEmpava Freestanding Walk-In Bathtub94 gallonsWalk-in3-year160 pounds‎52.5 x 26.5 x 40 inchesKOHLER K-20201 Alcove Bath 68 gallonsAlcove1-year128 pounds60 x 30 x 19 inchesELDERFLOWER & BERRIES Portable Bathtub55 gallonsPortableNot listed23 pounds56 x 23 x 23 inchesProductWater CapacityDesign TypeWarrantyWeightDimensions *Links above open to product retail page. Best Bathtub Overall<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2022/12/bathtub_1.png" alt="Product Card Image" loading="lazy"/>Courtesy AmazonFerdY Acrylic Freestanding Bathtub$959.99Prices taken at time of publishing.Our team liked that this freestanding tub has a high-gloss white surface with a drain finish of your choice. It measures 55 inches across with a 15-inch soaking depth that holds up to 52 gallons of water or 1,750 pounds of weight, making it a high-capacity, heavy-duty tub.$959.99 at Amazon <link rel="stylesheet" href="https://s42814.pcdn.co/wp-content/plugins/3S-CTA-Widgets/assets/css/widget-types/pros-and-cons-widget.min.css?v=1678473915"> Pros Made from acrylic that’s reinforced with fiberglass for long-lasting durability Has a high load capacity of 1,750 pounds Comes with a drain that you can purchase in different finishes Cons May be difficult for people with limited mobility to climb into Has a six-year surface warranty that doesn’t cover scratchesGood For: Homeowners looking for a for a freestanding tub with a durable design.What Are People Saying About the FerdY Acrylic Freestanding Bathtub?We noticed that those who were happy with this soaking tub said that it was comfortable to sit in and made from sturdy materials. They also mentioned its stylish, modern design. However, unhappy customers found installation to be a challenge, and others said it was hard to get in and out of.“Very happy with this purchase. I had been wanting a standalone tub for several years, and I assumed I would have to pay a fortune to get one I liked. This one is affordable, lightweight and easy to install. It keeps the water hot/warm for my entire soak. It also stays white and cleans easily. I love it! Highly recommend! I don’t often write reviews but this one really deserved it. Comes in different sizes. Awesome!” — Pam via Amazon“….Very slippery, small and hard to get out of. I’ll need to buy a gripper mat for it. I do not recommend this tub to anyone over 50. It’s very pretty to look at.” — Renee via AmazonBest Alcove Bathtub<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2022/11/TOH_Product_Card_Template___2022_11_28T104905.120.png" alt="Product Card Image" loading="lazy"/>Courtesy AmazonKingston Brass Alcove Bathtub$599.99$829.9528% offPrices taken at time of publishing.This tub fits in a three-wall alcove that measures 60 inches long and 30 inches wide. Depending on the layout of your alcove, we like that you can choose between a left- or right-handed drain. It’s also made from durable acrylic that’s reinforced with fiberglass and resin.$599.99 at Amazon <link rel="stylesheet" href="https://s42814.pcdn.co/wp-content/plugins/3S-CTA-Widgets/assets/css/widget-types/pros-and-cons-widget.min.css?v=1678473915"> Pros Has a tile flange and apron Can choose a left- or right-facing drain Is big enough for most people to stretch their legs out Cons Doesn’t include a drain kit Fits only in a 60-by-30-inch cutoutGood For: Customers seeing a wide-angled alcove tub with left- and right-handed drains.What Are People Saying About the Kingston Brass Alcove Bathtub?We found that customers were pleased with how easy to install and comfortable to use this affordable tub was. However, we also noted some users felt that the manufacturer sacrificed durability for this affordability, as the tub didn’t last for them, while others noted a design flaw that caused water to drain unexpectedly.“Best purchase of my whole, newly remodeled bathroom! This deep soaker is amazing! The clean, straight lines set the tone for all of my purchases for this room. The price was amazing, and my contractor wanted to know where I bought it for future remodels.” — Cecelia Harkins via Amazon“I will give it three stars. It is a really nice and deep bathtub and easy to install. But like others have noted, it has a very large ledge around it, which is nice, especially since it is a soaking tub. The bad is that the ledge is slightly angled out instead of in where it should be so that water drains. I would give it four or five if it weren’t for this. You need something to dry the ledge after showers, or you will quickly notice mold and other stuff growing cause of sitting water” — Joel via AmazonBest Standard Bathtub<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2023/01/american_standard_tub.jpg.optimal.jpg" alt="Product Card Image" loading="lazy"/>Courtesy AmazonAmerican Standard Apron Bathtub$668.85Prices taken at time of publishing.Like most alcove tubs, this one measures 60 inches across and 30 inches wide. However, we appreciated that it’s slightly lower to the ground at 18 inches deep to accommodate those with limited mobility. The side opposite the drain also features a contoured backrest for comfortable soaking sessions.$668.85 at Amazon <link rel="stylesheet" href="https://s42814.pcdn.co/wp-content/plugins/3S-CTA-Widgets/assets/css/widget-types/pros-and-cons-widget.min.css?v=1678473915"> Pros Features contoured lumbar support Compatible with universal and deep-soak drains Has a pre-leveled bottom for easier DIY installation Cons Doesn’t have a left drain option Not the best for soaking because it’s only 18 inches deepGood For: Homeowners looking for an alcove tub that’s lower to the ground.What Are People Saying About the American Standard Apron Bathtub?Overall, we found that customers thought that this alcove bathtub was durable, specifically noting its scratch-resistant finish. Our research also showed displeased customers did struggle to get water to drain from it properly, though.“Bought this and installed ourselves! Super easy to put in. It is so deep and comfortable! Dream tub for sure!” — Chelsea McMahon via Amazon“…The front and back short sides are level yet the lip on the long wall side slightly angles towards the wall, causing water to pool against the wall, which would eventually lead to discoloration and mold growth on the tile grout. And yes, this is not an above ground rough in. I had to chisel away concrete in the slab to fit the drain and footline to the waste, and now I have to chisel it all out again. This would have been a great tub if not for a few design issues.” — Junior via AmazonBest Freestanding Bathtub<img decoding="async" class="lazyload" src="https://s42814.pcdn.co/wp-content/uploads/2023/01/woodridge_bathtub.jpg.optimal.jpg" alt="Product Card Image" loading="lazy"/>Courtesy AmazonWOODBRIDGE Freestanding Bathtub$719.99Prices taken at time of publishing.Spaciously built for two-person soaking, this freestanding tub is 59 inches long and 23 inches deep to hold 55 gallons of water. We like that this tub uses EnduraClean technology to keep its surface is stain- and scratch-resistant for longevity and cleaning purposes.$719.99 at Amazon <link rel="stylesheet" href="https://s42814.pcdn.co/wp-content/plugins/3S-CTA-Widgets/assets/css/widget-types/pros-and-cons-widget.min.css?v=1678473915"> Pros Offers one- or two-person bathing Uses a double-walled design '
