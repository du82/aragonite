full_description = 'PodcastsListen to the Ask This Old House & Clearstory podcasts, from This Old House.Clearstory Podcast<img fetchpriority="high" decoding="async" width="1024" height="1024" src="https://s42814.pcdn.co/wp-content/uploads/2021/04/Clearstory_season2-1024x1024.png" alt="Clearstory_season2" class="wp-image-54900 lazyload" srcset="https://s42814.pcdn.co/wp-content/uploads/2021/04/Clearstory_season2-1024x1024.png 1024w, https://s42814.pcdn.co/wp-content/uploads/2021/04/Clearstory_season2-300x300.png 300w, https://s42814.pcdn.co/wp-content/uploads/2021/04/Clearstory_season2-150x150.png 150w, https://s42814.pcdn.co/wp-content/uploads/2021/04/Clearstory_season2-768x768.png 768w, https://s42814.pcdn.co/wp-content/uploads/2021/04/Clearstory_season2-200x200.png 200w" sizes="(max-width: 1024px) 100vw, 1024px" />From This Old House, Clearstory is a window that sheds light on the surprising stories behind our homes. Host Kevin O’Connor digs into the systems, structures, and materials in our homes from unexpected angles. Will future skyscrapers be built out of wood? Why is the American Chestnut heralded as “the perfect tree”? Did the Romans have a better recipe for concrete than what we use today? How will we build on Mars?You’ll hear from Richard Trethewey, Tom Silva, Jeff Sweenor and the This Old House experts, as well as industry leaders, historians, and builders. Clearstory—your home in a new light.Listen and learn more about each episode of ClearstorySubscribe to Clearstory on Apple, Spotify, Google, Stitcher, or, wherever you get your podcasts.Peek into episodes from the latest season:Episode 1: The Post-Pandemic HomeEpisode 2: The (Second) Rise of ConcreteEpisode 3: Our Perpetual House GuestsEpisode 4: Life on Mars?Episode 5: The Perfect Tree?Episode 6: Healthy HomesEpisode 7: “Plyscrapers”Episode 8: Urban ResilienceEpisode 9: Materials Around UsEpisode 10: Home in a KitSign up for the newsletter PodcastsSign-up to learn about when new episodes of the Ask This Old House and Clearstory podcasts drop.Email (required)By submitting your email, you agree to our Terms and Privacy Notice. You can opt out at any time. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.SubscribeAsk This Old House Podcast<img decoding="async" width="1024" height="1024" src="https://s42814.pcdn.co/wp-content/uploads/2020/10/Ask_Podcast_Logo3000x3000-1024x1024.png" alt="Ask_Podcast_Logo3000x3000" class="wp-image-52006 lazyload" srcset="https://s42814.pcdn.co/wp-content/uploads/2020/10/Ask_Podcast_Logo3000x3000-1024x1024.png 1024w, https://s42814.pcdn.co/wp-content/uploads/2020/10/Ask_Podcast_Logo3000x3000-300x300.png 300w, https://s42814.pcdn.co/wp-content/uploads/2020/10/Ask_Podcast_Logo3000x3000-150x150.png 150w, https://s42814.pcdn.co/wp-content/uploads/2020/10/Ask_Podcast_Logo3000x3000-768x768.png 768w, https://s42814.pcdn.co/wp-content/uploads/2020/10/Ask_Podcast_Logo3000x3000-200x200.png 200w" sizes="(max-width: 1024px) 100vw, 1024px" />If you’re a fan of Ask This Old House on TV, you’ll love the Ask This Old House podcast. Hosted by This Old House Editor Chris Ermides, you’ll hear from home enthusiasts around the country, who ask questions about the toughest projects in their homes. Learn from trusted This Old House experts, including Tom Silva, Richard Trethewey, Jenn Nawada, Heath Eastman, Charlie Silva, Ross Trethewey, Mauro Henrique, and Mark McCullough, who share tips and tricks to help listeners tackle their home improvement projects with confidence.Listen and learn more about each episode of the Ask This Old House PodcastSubscribe to the Ask This Old House Podcast on Apple, Spotify, Google, Stitcher, or, wherever you get your podcasts.Episode 1: Fixture and Fan InstallationsEpisode 2: Weed KillersEpisode 3: Fixing Peeling PaintEpisode 4: Attic & Roof InsulationEpisode 5: Prepare Plants for WinterEpisode 6: Protecting Ungrounded OutletsEpisode 7: How to Hang a Bedroom DoorEpisode 8: Landscapi