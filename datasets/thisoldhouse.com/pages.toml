son 19 - The Milton House Season 19 - The San Francisco House Season 18 - The Nantucket House Season 18 - The Tucson House Season 17 - The Salem House Season 17 - The Savannah House Season 16 - The Acton House Season 16 - The Napa Valley House Season 15 - The Belmont House Season 15 - The Honolulu House Season 14 - The Lexington Ranch Season 14 - The Miami House Season 13 - The London House Season 13 - The Wayland House Season 12 - The Jamaica Plain House Season 12 - The New Orleans House Season 11 - The Concord Barn Season 11 - The Santa Fe House Season 10 - The Lexington Bed and Breakfast Season 9 - The Santa Barbara Bungalow Season 9 - The Westwood House Season 8 - The Phoenix House Season 8 - The Brimfield House Season 8 - The Reading House Season 7 - The Tampa House Season 7 - The Melrose House Season 7 - The Newton Victorian Season 7 - The Reading Ranch Season 6 - In and Around Boston Season 5 - The Brookline House Season 4 - The Arlington House Season 3 - The Woburn House Season 2 - The Newton House Season 1 - The Dorchester House Cast Norm Abram Heath Eastman Lee Gilliam Nathan Gilbert Mauro Henrique Mark McCullough Jenn Nawada Kevin O’Connor Charlie Silva Tom Silva Richard Trethewey Ross Trethewey Webcams Submit Your House AboutRichard TretheweyPlumbing and Heating Expert by This Old House Chad GriffithRichard Trethewey has been an integral part of the This Old House team since the home improvement show’s debut in 1979. Today, he also appears on the Emmy Award-winning show’s sister series, Ask This Old House, and on the podcast Clearstory.Russell Morash, creator of This Old House, first called Richard’s father Ron, proprietor of Trethewey Bros. Inc., the family plumbing and heating business, with an idea for a home improvement show in 1978. Serving the Boston community since 1902, Trethewey Bros. Inc. enjoyed a tremendous reputation and was highly recommended. After one season, Ron was in love with This Old House, but not with the pressure of filming before cameras, so he asked his son to take over. It was then, in 1980, that Richard became the show’s plumbing and heating expert. “I guess I was just too young to be nervous,” he says of his TV debut.Born and raised in Dedham, Massachusetts, Richard learned from his father and others involved in the family business by working summers and school vacations. He is a licensed master and journeyman plumber in the Commonwealth of Massachusetts and has long been an advocate for professionalism in the building trades. Richard is the founder of RST Thermal, a manufacturer’s representative company that provides training to the skilled trades. His two sons, Ross and Evan, are active in the industry as well; Ross, a professional engineer, is president of TE2 Engineering. Evan is president of RST Thermal.Richard lives on the South Coast of Massachusetts when he is not living aboard a sailboat in Boston. His interests include sailing and home renovation. He enjoys 4 grandchildren who are all “well above average”.Follow Richard on Facebook, Twitter @thisoldplumber, and Instagram @thisoldplumber.Most Popular Our 6 Best Above-Ground Pool Picks (2024) Play How To Get Rid of Ice Dams 8 DIY Humidifier Ideas 7 Best Tankless Water Heaters (2025) How To Build a Sauna Newsletter Sign up for the Newsletter Get the latest This Old House news, trusted tips, tricks, and DIY Smarts projects from our experts–straight to your inbox. Email (required) By submitting your email, you agree to our Terms and Privacy Policy. You can opt out at any time. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Subscribe"
