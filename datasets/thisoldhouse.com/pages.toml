he Detroit HouseA 1939 Russell Woods-area home is restored with help from the community. Watch full episodes on demand here Season 38 - The Arlington Arts & Crafts HouseThis Old House TV returns for an all-new season to follow a young family as they tackle a diamond in the rough—an Arts and Crafts–style gem in a historic Boston suburb. Season 37 - The Belmont Victorian HouseThis Old House renovates a three-story 1895 Queen Anne in the Boston suburb of Belmont. Season 37 - The North Shore FarmhouseThis Old House shows it's possible to get old-house charm from scratch with new materials. Season 36 - The Veteran's Special House ProjectThe crew partners with Homes for Our Troops (HFOT) to build and outfit a house in Hopkinton, New Hampshire, for a wounded Iraq War veteran. Season 36 - The Lexington Colonial HouseGeneral contractor Tom Silva and the This Old House crew renovate the youngest house ever featured on the show: a 1966 Garrison Colonial, in Lexington, Massachusetts. Season 36 - The Charlestown 2014 HouseThe This Old House crew, led by general contractor Tom Silva, restore an 1850 Greek Revival row house in Boston's historic Charlestown. Season 35 - Jersey Shore RebuildsThis Old House heads to the coast of New Jersey to follow the post-Superstorm Sandy rebuilding efforts in three communities. Season 35 - The Arlington Italianate House Season 34 - The Cambridge 2012 HouseThis Old House heads to a historic New England neighborhood to give a bland Queen Anne some Scandinavian style. Season 34 - The Essex HouseAn unassuming cottage will get new life as a house that's designed for aging in place. Season 33 - The Barrington Beach HouseIn this season, This Old House heads to Rhode Island to restore a forlorn beach house with oceanfront views. Season 33 - The Bedford HouseIn this season, This Old House takes on the renovation of one of its oldest houses to date—a 1720 Georgian home listed on the National Register of Historic Places. Season 32 - The Auburndale HouseThis ho-hum house along the Charles River will become a curb-appeal Cinderella—transformed into an architectural thing of beauty by the This Old House crew. Season 32 - The Los Angeles HouseThe This Old House crew head to the fabled land of superstars and studio tours, stopping at its quieter and decidedly hipper cousin to the east, Silver Lake, home to this season's project house. Season 31 - The Newton Centre HouseWatch the renovation of a 1915 Dutch Colonial Revival in Newton Centre—a suburban community a few miles west of Boston. Season 31 - The Roxbury HouseFor its 30th anniversary, TOH works with a nonprofit to renovate a foreclosed Second Empire for two deserving families. Season 30 - The New York City HouseThis Old House heads to the land of egg creams, stickball, and brownstones for a rowhouse remodel. Season 30 - The Weston HouseThis Old House does new construction with a twist, helping build a prefab timber-frame house for a family of four. Season 29 - New Orleans RebuildsPost-Katrina, This Old House follows stories of rebuilding and recovery in New Orleans, while helping one fourth-generation resident of the Lower Ninth Ward return home by renovating her flood-damaged shotgun single. Season 29 - The Newton Shingle-Style HouseA family lets go of a house they've liked living in for a decade to renovate one they hope they'll love for an even longer time. Season 28 - The Austin HouseThe renovation of a 1926 Craftsman Bungalow follows an eco-friendly path while adding space for a newly married couple with kids. Season 28 - The East Boston HouseA worn out 1916 two-family house gets upgraded for two descendants of the original owners. Season 27 - The Washington, D.C. HouseThis tough old building has survived everything. Now, it's returning to habitability as a 3-bed, 2-bath beauty. Season 27 - The Cambridge HouseBuilt in 1950, this Modern house is tired, leaking, and historic. So, what's worth saving? Season 26 - The Carlisle HouseThis Old House purchased an 1849 Greek Revival farmhouse in a pastoral suburb of Boston to give it the update it desperately needs, then hands it off to new owners. Season 25 - The Bermuda HousePink sand beaches, tourists on mopeds, and men in shorts — that's the background for this season's This Old House project. Follow the unique construction and renovation techniques that come with life on a remote island. Season 25 - The Concord CottageThis Old House takes on adaptive reuse, as we convert a century-old barn, complete with horse stall, into a two-story jewel box of a home. It will be perfect for the in-laws today, and who knows who else in the future? Season 24 - The Winchester HouseHealthy but tired, this 1920s Colonial Revival in Winchester gets an improved kitchen and master suite, an updated heating plant, and a cosmetic freshening inside and out. Season 24 - The Lake Forest Dream KitchenWhen this brick Tudor was built in 1928, nobody was anticipating the needs of 21st century triplets. This Old House gives the family a better layout, improved flow, and the elbow room they need. Season 23 - The Manchester HouseOn New England's north shore, This Old House gives grand rebirth to a once-stately, uniquely American Shingle-style house by the sea. Season 22 - The West Palm Beach HouseHomeowner Rob Thompson and the This Old House team transformed this Mediterranean Revival-style house into a delightful tropical compound. Season 22 - The Charlestown HouseThis Old House heads back to the city for the renovation of an 1865 Second Empire-style brick townhouse in Boston's historic Charlestown neighborhood. Season 21 - The Billerica HouseClose to home, This Old House tackled a project close to its heart: rebuilding Dick and Sandra Silvas' house from foundation to finishes after a devastating fire. Season 21 - The Santa Barbara HouseThe guys headed west for the winter to raise the roof on Jan Winford's 1907 Craftsman-style bungalow in sunny Santa Barbara. Season 20 - The Watertown HouseThe show kicked off its 20th anniversary with the renovation of a sprawling 1886 Queen Anne-style Victorian in the Boston suburb of Watertown, Massachusetts. Season 20 - The Key West HouseThis Old House headed to the southernmost city in the continental United States, Key West, Florida, for the renovation of a circa 1886 Conch Captain house. Season 19 - The Milton HouseWith the help of Julia Child, Marian Morash, Ethan Allen and Laura Ashley, to name a few, This Old House turned an Antique Colonial farmhouse into a dream house. Season 19 - The San Francisco HouseThis Old House converted a 1906 Arts and Crafts-style church into a single family home for Laurie Ann Bishop and Mark Dvorak. Season 18 - The Nantucket HouseThe This Old House crew transformed a small 1887 Victorian cottage into a summer home with year-round capabilities. Season 18 - The Tucson HousePlans for this 1930s Pueblo Revival stucco home included expanding the kitchen and patio areas and building an outdoor courtyard and veranda, all against a breathtaking "
