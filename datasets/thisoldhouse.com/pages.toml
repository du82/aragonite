title = "Privacy Policy  - This Old House"
full_description = "Privacy Policy Updated as of January 1, 2025We value and respect the privacy of our users. This Privacy Policy describes the information that TOH Intermediate Holdings, LLC and its subsidiaries (collectively, “This Old House”, “we”, or “us”) collect about consumers (“you” and “your household”) through the “TOH Services”, which include This Old House’s websites and online store (“Websites”), mobile and connected TV applications, emails, newsletters, and our accounts and content services on third-party websites and applications.TOH Services may also be available on platforms and online services operated by other companies, including websites, applications, smart TVs, set top boxes, streaming devices and channels, gaming devices, mobile devices or other internet connected devices. This Privacy Policy does not cover the actions and privacy practices of these platform and online service operators or their partners. For more information about how these companies use your data, please see their privacy policies.1. Information You ProvideA. Registration, Purchase, and Shipping InformationWhen you register to become an “Insider” member of TOH Services, or purchase any other product through TOH Services, you will be asked to provide certain personal information, including your name, email address, password (and password hints), mailing address, billing address, and payment information.B. CommunicationsIf you contact us directly, we will receive information you provide, such as your name, email address and phone number, and the contents of any messages or attachments that you send to us. If you subscribe to our newsletters or marketing communications, we will collect your email address or other contact information. C. Promotions and SurveysIf you enter one of our contests, sweepstakes, or competitions, or participate in surveys through TOH Services, you may need to provide personal information such as your name and email address. If you are a winner of a contest or sweepstakes, you may need to provide additional contact information, such as phone number and mailing address, in order for us to fulfill your prize. You may also be invited to participate in TOH user surveys conducted through TOH Services or via email. If you choose to participate in these surveys, TOH will collect your responses. D. Comments, Reviews and ContentYou may be able to submit comments, reviews, images, and audio and visual materials to our Websites and accounts on third-party social networking sites. Information posted in these venues may be visible to the public. Please be mindful of your own privacy needs and those of others as you choose what to disclose and make public. We cannot control the privacy or security of information you choose to make public.E. Information You Provide About OthersWe also collect the personal information of other people. For example, if you invite others to join TOH Services, or purchase our products or services for other people (such as our Insider membership), we may collect the recipients’ names, email addresses, and their postal addresses. In addition, personal information about other people may be collected and used when you use certain parts of our Websites. For instance, we will receive any videos, images and voice content containing other individuals that you choose to upload to our Websites. We rely on you to obtain any required permissions in advance to allow us to receive and use such information.2. Information We Collect Automatically Through TOH ServicesA. Device InformationWe and our service providers collect information about the browsers and devices you use to access TOH Services. This information includes device types and models, unique identifiers (including advertising identifiers associated with that device), IP address, device ID, operating system type and version, browser type and language, and Internet service provider used.B. Activity and Usage InformationWe and our service providers also collect information about your interactions with TOH Services, including browsing and search history, search results, clicks, access time, the web page you came from and go to next, the web page(s) you access during your visit, content and ads you view, and your interactions with content or advertising on TOH Services. We may infer your general location information and internet service provider from the device information we collect (for example, IP address may be used to infer your general geographic area).3. Information from Cookies and Similar TechnologiesLike many online services, we and our service providers and business partners collect information about your online activities over time and across different online services. For example, we use technologies such as cookies, pixel tags, web beacons, SDK, device identifiers or similar technologies to recognize you when you use TOH Services, and to collect information about your usage and preferences, such as the number of visits, which features and, pages are popular, and to measure your browsing activities. These technologies allow us to optimize the operation of our services, including by allowing us to ensure our services are functioning properly, to improve and personalize our services, and to provide, personalize, and measure ads.Similarly, we and our service providers use e-mail tracking technologies to monitor the success of e-mail campaigns (for example, to track whether an email was opened and record how many e-mails in a campaign were opened).4. Information We Receive from Third PartiesWe collect information about you from other sources for the purposes described in this Privacy Policy, including to provide you a tailored user experience and advertising that may be of interest to you. For example, we may collect information from the following sources:Third parties who distribute This Old House content on their devices or channels. If you access TOH Services on streaming devices or mobile devices from other companies, or if you access This Old House content on streaming services like Free Ad-supported Streaming TV (FAST) channels operated by other companies, they may provide us with IP addresses, device IDs or other unique identifiers, and information about actions that you make through these devices or channels that relate to the This Old House content you access.Ad networks and other advertising partners. These business partners may provide IP addresses, device IDs, other unique identifiers, and information about you, such as information about your online activities, interests, household information, demographics, and analytics (e.g., information about how many ads were delivered and clicked).Advertisers. Advertisers that show ads on TOH Services may provide data about individuals to personalize and measure ads and for other purposes described in this Privacy Policy.Service providers. We outsource some of our operations to our service providers and vendors, such as payment service providers that provide us payment or balance information, and ad fraud vendors that provide IP addresses to help us identify potentially suspicious activities.Sweepstakes and Contests. If you enter one of our sweepstakes or contests hosted on a third-party platform, we will receive information about you and the information you provide to enter.From Other Users. We may also receive your personal information from other individuals if they have referred you as described in Section 1(E) above.5. Information Collected by Third PartiesA. Third-Party Devices and ServicesSome TOH Services are accessible on third-party devices (e.g., on Fire TVs and iPhones), and some TOH content is available through third-party services (e.g., Facebook, Instagram, TikTok, Pinterest, X, and YouTube). When you use these devices or services, you are also interacting directly with the provider of these devices or services, as the case may be, and they may collect additional information about you. You should review that provider’s privacy policy to learn more about the data it collects and how it uses your information. For information on the data we receive from these third parties, please see Section 4 above.B. Third-Party Features and LinksTOH’s website and mobile applications may contain third-party features and tools (e.g., cost estimators, home service provider searches) and links to other websites, applications, or online services, including affiliate links from our business partners. When you use these tools or click on these links, these partners may collect information from you or about you. You should review the privacy policies of these third parties to learn more about the data they collect and how they use that data.C. Third-Party Cookies, Pixels and Other Similar TechnologiesSome of our business partners, such as analytics and advertising partners, collect information about your online activities over time and across different online services. For example, they use cookies, pixel tags, web beacons, SDK, device identifiers or similar technologies to recognize you when you use TOH Services, to measure your browsing activities, personalize ads and measure their effectiveness.6. How We Use InformationWe may use the information we collect about you to derive other information and inferences about you. We use the information we collect and derive for the following purposes:Support, Maintenance and Fulfillment. We use your information to provide and maintain our operations and services and those of our affiliates, and to process and fulfill your requests or orders.Product and Service Improvement. We use your information to understand and analyze our user base and how you use our and our affiliates’ services, to improve and enhance these services, including building correlations in order to better serve our advertisers, and to develop new products, services, features and functionalities.Personalization. We use your information to personalize your experience, including suggesting and offering you relevant content and recommendations.Advertising. We use your information to show you ads, through TOH Services and on third-party websites, mobile apps, platforms, services and devices. We may use your information to create online identifiers, measure and understand the reach, viewership, and effectiveness of ads, and to provide advertising analytics and reporting. We also help advertisers and advertising partners reach the desired audience and understand, measure and improve their ad campaigns.Marketing and Promotions. We use your information for marketing purposes, including to send you alerts, notifications, direct mail, emails and text messages about products, events, promotions and offers from This Old House or its partners, and to measure and understand the effectiveness of our marketing.Analytics and Performance. We use your information to measure performance and analyze key metrics relevant to our business.Service Communication and Customer Care. We use your information to communicate with you, including sending you service information such as confirmations, invoices, notices, updates, security alerts, user surveys, and support and administrative messages; and to respond to your comments and questions and provide customer service.Protect This Old House, our Users and Others. We use your information to enforce our terms and conditions or protect our business, partners or users, and to comply with our contractual, regulatory, and legal obligations; andSecurity and Fraud Prevention. We use your information to protect, investigate, and deter against fraudulent, unauthorized, infringing or illegal activity, including click fraud.7. How We Disclose InformationA. Service Providers and VendorsWe work with other businesses (including contractors and service providers) to provide services for us and to help with our operations, which may require that they access and use your information. For instance, we may use other companies to communicate with you (including via telephone, email, or letter) about our products or services, to send information to you, to fulfill your purchases, to process and collect payment via your credit card (if applicable), to provide customer support and other services, to obtain additional data about you, to run and manage our services and operations, and to perform analytics and other work that we may need to outsource — such as using Google Analytics to collect and process certain analytics data for TOH Services. These analytics services may also collect information regarding your use of other companies’ websites, apps, online services, and devices. You can learn about Google’s privacy practices by going to https://www.google.com/policies/privacy/partners, and opt out of them by downloading the Google Analytics opt-out browser add-on, available at https://tools.google.com/dlpage/gaoptout.B. Advertisers, Ad Networks and Advertising PartnersWe work with ad networks and other advertising partners to show you ads that we think may interest you on TOH Services and on other companies’ websites, apps, and devices. We disclose information to these ad networks, advertising partners and our advertisers, and they may set and access their own cookies, pixel tags and similar technologies on TOH Services and they may otherwise collect or have access to information about you which they collect over time and across different online services and devices.C. Advertising Measurement Providers and ServicesWe work with advertising measurement providers and their service providers to help us and our advertisers understand information about the content and ads viewed, and the effectiveness of ad campaigns, including the audience that saw their ads and how they responded.D. Corporate AffiliatesWe may disclose your information to our current or future affiliates (which means a parent company, and any subsidiaries, joint ventures, or other companies under common control), in which case we will require our affiliates to honor this Privacy Policy.E. ConsentWe may also disclose personal information, including personally identifying information, with your consent.F. Merger, Sale, or Other Asset TransfersWe may also disclose your information to others in connection with or during negotiation of any merger, financing, acquisition, bankruptcy, dissolution, transaction or proceeding involving sale, transfer, divestiture or disclosure of all or a portion of our business or assets to another company.G. As Required by Law and Similar DisclosuresWe may also disclose your information (1) to comply with laws or to respond to lawful requests and legal process, (2) to protect the rights and property of This Old House, our employees, agents, customers, and others, including to enforce our agreements, policies, and terms of use, (3) in an emergency to protect the personal safety of This Old House, its employees or customers, or any person, or (4) to investigate, prevent, or take action regarding illegal or suspected ille"
