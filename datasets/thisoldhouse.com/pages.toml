title = "Bathroom Remodel Cost in 2025"
description = "Learn about the factors that contribute to the total price of renovating the smallest room in your house with our bathroom remodeling cost guide."
full_description = "The price to remodel a mid-range bathroom can run as little as $2,500 to $30,000 or more, depending on the scope and type of remodeling job. A mid-range bathroom remodel costs an average of $25,000, according to recent cost data published by the Journal of Light Construction (JLC). After a bathroom remodel, homeowners enjoy comfort, convenience, and the satisfaction that their new bathroom features more modern fixtures and design elements. This guide explores the factors that influence the cost of remodeling a bathroom, as well as the benefits and potential red flags. Cost data in this article was sourced from the JLC 2024 cost report and 2025 Angi pricing data. Key TakeawaysA mid-range bathroom remodeling job costs an average of $25,000 but can cost as little as $2,500 depending on design, materials, and scope. The JLC 2024 cost report estimates a return on investment of 73.7% for a mid-range bathroom remodel. Remodeling a wet surface area, such as the bathtub or shower, can cost between $200–$15,000, depending on the type and the materials. Get Estimates from Local Bathroom Remodeling Experts Compare quotes from local pros Please Enter Your Zip Code Invalid Zip Code Get Your Estimate Enter details in under 3 minutes Clicking “Get Your Estimate” submits your data to Home Service Quotes, which will process your data in accordance with the Home Service Quotes Privacy Policy. Advertiser Disclosure The listings that appear are from companies from which this website receives compensation, which may impact how, where and in what order products appear. This listing does not include all companies or all available offers and products. Average Bathroom Remodeling Cost The average bathroom remodeling cost depends on a lot of factors, including the scope of the job and the materials you use. According to the JLC, a mid-range remodel of a bathroom costs an average of about $25,000. A major, upscale bathroom remodeling job costs an average of $79,000. Jim Fuson, owner of 21st Century Home Inspections, says that bathroom remodels can get complicated. “The sky’s the limit on bathroom design. If we’re going from just your traditional single-person shower, and now we want a two-person shower with dual shower heads and all the little toys inside, you may end up looking at increasing your water heater storage capacity.” Projects like this might involve a new tankless water heater, additional electrical work, or radiant heat floor installation, which all increase your overall cost. How Much Do Common Bathroom Remodeling Projects Cost? The table below shows an item-by-item breakdown of estimated costs for a bathroom remodel: Bathroom ProjectCostBathtub installation$215–$14,700Shower installation$390–$17,000Cabinetry$200–$600 per unitFaucets$170–$360Toilet$375Vinyl or laminate flooring$1–$14 per square footRadiant floor heating$15–$60 per square footLight fixture installation$150–$930Countertops$1–$190 per square footVent fan installation$400Cost figures sourced via 2025 Angi pricing data. Remodel Cost by Type of Bathroom Because size is such a significant determiner of cost, here’s a breakdown of the estimated cost to remodel or renovate bathroom types and how long remodels typically take to complete. The total cost usually ranges from $100–$200 per square foot. Type of Bathroom RemodelAverage CostAverage TimeHalf-bath remodel$1,500–$15,0005–7 daysGuest bath remodel$3,500–$20,00010–14 daysPrimary bath remodel$7,000–$30,00015–25 daysWet room installation$2,000-$30,00010-30 days What Are The Most Common Cost Factors of a Bathroom Remodel? In addition to your bathroom’s size, the areas you choose to renovate and your selected materials can go a long way in determining the final price tag. The most expensive material costs are the wet area, bathroom vanity, countertops, and tiling. Below, we break down the most common cost factors for a bathroom remodel. Remodeling a Wet Area The bathroom’s wet area is the portion of the room that is waterproofed because it’s designed to withstand the damp, humid conditions found in a bathroom. Typically, this encompasses the bathtub, shower, or combination of the two, as well as the walls and floors around it. It’s also usually the most expensive part of a bathroom remodeling project. Because there are so many projects related to the wet area, the time and expense of this renovation can vary greatly. It might take just a few hours if you’re just having the tub refinished or a liner installed. However, large projects like converting all or part of a bathroom into a wet room can take several days to several weeks since they involve substantial demolition. Shower Remodels Why remodel or replace your shower? Because it’s old and out of style, floor or wall tiles are broken or cracked, the shower head and fixtures no longer work as well as they should, the pipes and drain are out of date and faulty, or because you’re feeling your age and you need to install a safer showering environment. Factors that influence the cost of a shower remodel include the materials you choose, the scope of the job, the type of fixtures and features you choose, and the type of shower you choose (a corner standup shower or a double shower, for example). Bathtub Remodels A bathroom remodeling job often entails the complete replacement of an old or broken bathtub. This might mean repairing or replacing plumbing fixtures and pipes or simply removing an old tub and dropping a new tub into the same spot. Factors that influence the cost of a new tub include the type of bathtub you choose, the scope of the renovation job, and the materials required for the job. On average, a new bathtub installation costs about $5,600. That price can rise or fall depending on the tub type. For example, a free-standing bathtub or a whirlpool tub might cost considerably more than a standard, all-purpose bathtub. Updating Cabinetry Replacing, upgrading or refinishing your bathroom cabinets is typically not as expensive as many other parts of the project. Cabinets can cost $200–$600 per unit, and you can install ready-to-assemble cabinets yourself. Of course, more durable material costs more, and a high-end custom vanity can cost $10,000. Remember that bathroom cabinetry needs to withstand more humidity than cabinets in other rooms. Updating Countertops Cabinets usually go hand-in-hand with countertops, and you’ve got a choice of materials here, too. Bathroom countertops don’t have to stand up to the same level of use as kitchen countertops, so you have a few more options. The least expensive materials are laminate, tile, and sealed wood, though these may be difficult to clean or be susceptible to damage. Granite, marble, and solid surface materials like quartzite are more expensive and durable, but some need to be properly sealed and may show stains. Changing Faucets and Plumbing Faucets in the bathroom are a relatively minor expense, and you can change them yourself for a few hundred dollars. This hardware is available in zinc, stainless steel, and brass in several finishes. Chrome-finished plastic is also available, and though it’s the least expensive option, it’s not recommended because it’s often flimsy and lacks durability. Good hardware will come with a substantial, even lifetime, warranty. Although the faucets themselves are inexpensive, making substantial changes to the plumbing isn’t. When you start tinkering with your bathroom’s layout and its existing plumbing—changing the location of the toilet or tub, for example—you’ll need to hire a licensed plumber to do the work. Plumbing work typically costs $45–$200 an hour. Toilet Upgrades Depending on your old toilet’s condition, you may decide it’s time for an upgrade. A new toilet costs an average of $375 for the unit itself and the installation, though you may be able to find a bargain model as low as $100 if you install it yourself. You could look into higher-end models like dual flush toilets, bidets, or smart toilets. Installing New Flooring Bathroom flooring is another factor that provides many options, including some that can save you a lot of money. Natural stone and hardwood are higher-cost options, but new options in vinyl and laminate flooring can mimic their appearance at a much lower price. Floor tile made of ceramic or porcelain is another popular option, and it can be inexpensive, though tiles are harder to install and keep clean because of the grout. All these options are priced by square footage, so the larger your bathroom, the higher the material and labor costs. If you want a more luxurious bathroom floor, you can opt for a radiant heating system under the tile work. The cost range for such a system is typically $15–$60 per square foot. Replacing Light Fixtures New light fixtures for your bathroom require relatively low costs. If you’re just swapping out existing fixtures, you can often do this yourself for an affordable price. However, moving lights around or adding new ones means you’ll need to hire an electrician. Electrician costs can range between $50 and $200 an hour. Electrical work, particularly in an area with so much water around, should be completed by a professional. Even general contractors usually employ subcontractors for this job. Ventilation Ventilation is essential to ensure that your bathroom can dry between uses so that mold and mildew don’t become a problem. Typically, this takes the form of an exhaust fan. Replacing this fan costs between $240 and $550, but if you need to install one from scratch, you must also install ductwork and vents. For this, you should hire a professional, driving the price closer to $1,000. The cost of bathroom vents usually depends on the quietness of the fan, the size of your bathroom, and the type of light provided, if there is one. Quieter fans that move a greater amount of air and come with LED lighting will generally be more expensive. Other Potential Bathroom Renovation Projects The above is not an exhaustive list of bathroom renovation options. Here are some other factors that can go into a primary bathroom remodel: Bidet Hardware (drawer pulls, towel racks, toilet paper holder) Hot tub Medicine cabinet Mirrors Sauna Shower doors or curtains Tub and shower wall surrounds Additional Bathroom Remodel Cost Considerations There are a few costs that come with a remodel that many forget to include in their budget. Keep the following expenses in mind when estimating how much your remodeling project will cost. Permits Although cosmetic renovations don’t require a permit, more extensive remodeling projects do. Changes such as adding new windows, installing new plumbing, moving an outlet, and replacing a water heater typically require permits. You may also need a permit if your remodel’s total cost exceeds a certain amount. Since building codes vary from city to city, make sure to check with your local planning or building department when designing your new bathroom and setting your budget. As the homeowner, you are responsible for the permits, though some contractors will assist you with applying for them. Accessibility If you need to make your bathroom more accessible, note that ADA-accessible appliances are often more expensive and may take up more space. For example, a top-of-the-line walk-in tub or roll-in shower will likely cost more and be bulkier than a standard tub or shower. Reduced-mobility features such as grab bars and shower seats make your bathroom safer but also add to material and labor costs. Geographical Location Where you live also affects material and labor prices. The cost of a bathroom remodel in one state may be a couple thousand dollars higher or lower in your area. Ensure you get a detailed estimate of your specific project before assessing your budget. Disposal of Materials In some cases, homeowners are responsible for material disposal during and after the project. Depending on how much construction and replacements your project involves, you could be left with fixtures you no longer need, flooring that’s been removed, or an entire wall to get rid of. Make a plan with your contractor ahead of time to see who will be in charge of disposal and what the best method is. If you can’t safely and properly dispose of the materials yourself, you may need to hire a specialized waste company to take them away. Not all materials can go to your local waste dropoff center, so research where your county requires each material to be taken. Note that work performed in houses built before 1978 may release asbestos and lead dust, which must be removed and disposed of by a professional. Ask An Expert What hidden costs should I budget for? Katie Loughmiller, Ph.D. Associate ProfessorKansas State University Alecia Taylor Interior DesignerCabinetNow.com “Some of the forgotten costs include delivery charges, disposal of demolished or excess materials, and additional materials needed for the installation that may not be known to the homeowner.” “Homeowners often forget to budget for permits, which can add up depending on the scope of the remodel. Disposal fees for old materials, such as tiles or fixtures, can also be a hidden cost. Additionally, the costs of accessible design should be included in the budget from the beginning.” Should You Remodel Your Bathroom? Remodel or renovate your bathroom within your budget if it has become dangerous, whether through cracked or broken tile, slippery surfaces or electrical hazards. The decision to remodel your bathroom comes down to your budget and tolerance for disruption to your daily life. On the one hand, bathroom remodeling often has a substantial return on investment (ROI) when it comes to your home’s value. However, not everyone has remodeling money in the budget. Let’s look at some benefits of remodeling. Return on Investment (ROI) According to the JLC’s 2024 Cost vs. Value Report, a mid-range bathroom remodel costs an average of $25,251 and recoups an average of $18,613 for a 73.7% ROI. Universal design and upscale remodels cost more and have a lower ROI (49.4% and 45.1%, respectively), but they still add resale value to your home. Assume there will be unforeseen expenses that affect ROI. We recommend planning a 30% cushion in your budget. And while bathroom remodeling has a strong ROI, other projects can add more value, such as window and siding replacement (62.9%–88.4%) or a minor mid-range kitchen remodel (96.1%). Improved Safety If you have an older home, a home that wasn’t designed well, or a resident in your home with limited mobility, a bathroom remodel can remove safety issues. You may need to relocate electrical outlets farther away from water sources, add more lighting or ventilation, or make the layout or fixtures more user-friendly for your housemates. Katie Loughmiller, Ph.D., associate professor at Kansas State University’s Department of Architectural Engineering and Construction Science, emphasizes the long-term value of an ADA-compatible design. “For homeowners planning "
