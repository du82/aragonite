title = "Watch “This Old House” Shows on The Roku Channel - This Old House"
description = "Here’s how to watch full episodes of This Old House and Ask This Old House on The Roku Channel."
full_description = "Navigation for Front Page Seasonal Checklist Checklist VideosWatch “This Old House” Shows on The Roku ChannelHere’s how to watch full episodes of This Old House and Ask This Old House on The Roku Channel. by This Old House Catch new episodes of This Old House and Ask This Old House every week on your local PBS station and every Monday for free on The Roku Channel.Current SeasonsNew episodes of the current seasons of This Old House and Ask This Old House are available to watch on The Roku Channel every Monday.On-DemandSelect prior seasons from This Old House and Ask This Old House libraries are available for free on-demand via The Roku Channel.Linear ChannelsStream This Old House and Ask This Old House episodes free, 24/7/365 on The Roku Channel, channel 456. In Canada, watch on channel 340.This Old House Classic ChannelThis Old House Classic (channel 457 on The Roku Channel) is a free live channel streaming classic This Old House episodes featuring hosts Bob Vila and Steve Thomas, and early Ask This Old House episodes. From the first project in Dorchester, MA, to other fan-favorite projects, This Old House Classic streams seminal episodes featuring Norm Abram, Tom Silva, Richard Trethewey, Roger Cook, and more. In Canada, watch on Channel 341.Premium Subscription ChannelUpgrade to the Premium Subscription option of This Old House and enjoy new and classic episodes commercial-free, plus get early access to new episodes every Thursday. Access these perks for $4.99 per month and start with a 7-day free trial. This Old House Makers ChannelFrom woodworking to design and engineering to welding, This Old House Makers Channel features master creators at home in their workshops, where they take on projects in their way. Stream Makers Channel 24/7/365 for free on The Roku Channel, channel 458.How to Access The Roku ChannelOn Your Roku Streaming Device or Smart TVPurchase a Roku Streaming Device or Smart TV on Roku.com. Once the device is connected to your TV, select The Roku Channel app from the main app menu. Then, navigate to This Old House, or search for This Old House. From the This Old House hub, select from any of our content channels and start streaming.On The WebVisit TheRokuChannel.com, and stream This Old House channels from your desktop, tablet, or mobile device.On Your Mobile DeviceDownload the Roku app from the Android or Apple store. Select The Roku Channel from the bottom nav bar, then select This Old House or search for your favorite This Old House show.Watch on Amazon Fire TV devicesIn the US, download The Roku Channel to Amazon Fire TV streaming devices, including Fire TV Edition smart TVs, and Fire TV Edition soundbars.Finding The Roku Channel is easy with Alexa, just say “Alexa, find The Roku Channel app” into your Alexa Voice Remote, a paired Echo device, or Fire TV Cube. Just say, “Alexa, find The Roku Channel” or “Alexa, open The Roku Channel” to open the app once downloaded.You can also search by clicking the search icon in the Fire TV top navigation or download directly by clicking here. If you don’t have a Roku account, don’t worry — you won’t need an account to login into The Roku Channel on your Amazon Fire TV device.Watch on Samsung TVOn your smart TV, press the Smart Hub button or Home button (depending on the Samsung TV model) on your remote. Then, navigate down the page to “Apps;” Search for “Roku,” The Roku Channel should appear as a search result. Select The Roku Channel app and choose “Download.”Next Up In Front Page TOH Wants to Showcase ADU Projects in the Boston Area 8 Best Garbage Disposals (2025 Guide) E11: New Year Storage Checklist 8 Best Grow Lights (2025) How to Choose a Smart Doorbell E10: Holiday Gift Giving ChecklistMost Popular Our 6 Best Above-Ground Pool Picks (2024) Play How To Get Rid of Ice Dams 8 DIY Humidifier Ideas 7 Best Tankless Water Heaters (2025) How To Build a Sauna Newsletter Sign up for the Newsletter Get the latest This Old House news, trusted tips, tricks, and DIY Smarts projects from our experts–straight to your inbox. Email (required) By submitting your email, you agree to our Terms and Privacy Policy. You can opt out at any time. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Subscribe"
