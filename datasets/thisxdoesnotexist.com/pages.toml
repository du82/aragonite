title = "This X Does Not Exist"
description = "Using generative adversarial networks (GAN), we can learn how to create realistic-looking fake versions of almost anything, as shown by this collection of sites that have sprung up in the past month."
full_description = '''This X Does Not Exist Using generative adversarial networks (GAN), we can learn how to create realistic-looking fake versions of almost anything, as shown by this collection of sites that have sprung up in the past month. Learn how it works. This Person Does Not Exist The site that started it all, with the name that says it all. Created using a style-based generative adversarial network (StyleGAN), this website had the tech community buzzing with excitement and intrigue and inspired many more sites. Created by Phillip Wang. This Cat Does Not Exist These purr-fect GAN-made cats will freshen your feeline-gs and make you wish you could reach through your screen and cuddle them. Once in a while the cats have visual deformities due to imperfections in the model – beware, they can cause nightmares. Created by Ryan Hoover. This Rental Does Not Exist Why bother trying to look for the perfect home when you can create one instead? Just find a listing you like, buy some land, build it, and then enjoy the rest of your life. Created by Christopher Schmidt. This Waifu Does Not Exist This one is a little stranger than the others, but I bet you'll read more of the plot summary than you expect. It's engrossing. Created by Gwern Branwen. This Question Does Not Exist By generating seemingly realistic Stack Overflow questions, you can keep this open on your computer to seem like you're actually doing work. The most interesting aspect is the "Other Random Questions" section on the right side of the page, which shows other equally synthetic questions. Created by Brad Dwyer. This Resume Does Not Exist To showcase their resume template builder, this company went as far as to incorporate TextgenRNN – not quite a GAN but rather a recurrent neural network (RNN) specializing in text generation. Bonus points – the headshots used in each resume are from thispersondoesnotexist.com. Created by Enhancv. This Emotion Does Not Exist While it doesn't necessarily use Deep Learning, this site showcases the power of a relatively simple model's ability to interpret emotions from facial expressions. The results may shock you. Or delight you. Or anger you. Regardless, the site can identify the emotion. Created by Jan Schneider. This Vessel Does Not Exist Drawing a beautiful parallel between Generators and Discriminators in GANs and apprentices and masters in ceramics, this site demonstrates the beautiful ability of neural networks to replicate the mastery of professionals at yet another craft. Created by Derek Philip Au. These Lyrics Do Not Exist Now we can generate lyrics for a song given a theme or topic. If only we combined this with text-to-speech and a melody-generating model to create completely original songs. Then the music industry would take GANs seriously. Created by Peter Ranieri. This Snack Does Not Exist For when you're feeling especially hungry and creative, this website will remind you that you're more hungry and less creative than you thought. Created by Ariel Levi, Koby Ofek, et al. This Meme Does Not Exist Honestly, if I had to quantify the site with the largest value-add to humanity, this would be in the top three. Memes galore and so much more on every pageload. Created by Imgflip. This Chair Does Not Exist Before I explain this site, you may want to take a seat, preferably in one of the chairs generated by this GAN. What's more is that the chairs are all 3D and you can fine tune the "weirdness." Created by Marian Kleineberg. This Foot Does Not Exist Note that this is an SMS chatbot. You can text it to get pictures of feet. The pictures are animated. The feet are nonexistent. Why would you want to do this? Who knows. Created by MSCHF. This Artwork Does Not Exist Be inspired by minimalism, realism, post-modernism, pre-modernism, modernism, and ancientism (not actually a thing). No matter your art preferences, you can find it here with enough refreshing. Created by Michael Friesen. This Chemical Does Not Exist Who said drug discovery is hard? Just refresh until you find the right chemical. In all seriousness, the fact that this renders a 3D model with the correct bond pairings is impressive. This Horse Does Not Exist Some of the horses have people on them, but it seems like they're also generated by the GAN since something always seems a bit off with the people. The horses, as always, look great. This Word Does Not Exist Using GPT-2, this website manages to generate words that sound like they should exist, but don't. Great for startup names or baby names (now that the coveted X Æ A-12 is taken). Created by Thomas Dimson. This MP Does Not Exist With the state of politics in the world, who wouldn't want a refreshing new face in charge? The author of this site trained a GAN on real faces of UK Parliament. Unfortunately the faces this model generates don't actually exist, but they still get my vote. Created by Matt Round. This Pony Does Not Exist This site was created with user experience in mind. You can pan the generated ponies, zoom in, and even auto-expand on hover. And best of all, each pony is uniquely made for you. Created by arfa. This Automobile Does Not Exist Legend has it Elon used this website to design the Cybertruck. From there, he made some slight changes to the curvature on the left windows, but that was it. Created by James Park. This Eye Does Not Exist It's not hard to see why this site is impactful. In fact, while you're looking at this site, you might find this site looking back at you. A helpful feature would be Sephora links to the shown makeup, but I wouldn't hold your breath for that feature coming anytime soon. Created by Gonçalo Abreu. This Butterfly Does Not Exist Surprisingly, butterflies look a lot scarier up close and on your monitor. Or is that just me? Anyway, take digitised specimens from the Natural History Musem in London, sprinkle in a little GAN magic, and you get this website. This City Does Not Exist The next time your flight attendant tells you to close the window shades, look no further than this website. With it, you can get a unique new overhead view every time you refresh the page. And the best part is, you can almost make out your house from up here! Created by Ron Hagensieker and Tomas Langer. This Food Blog Does Not Exist Looking to surprise someone special with a new recipe that'll leave them wondering where you got your newly found culinary talents? Yeah, this is not the site for you. But, if you're looking to share a dank, new, AI-generated site that boasts the prowess of GANs, this site IS for you! Created by Chip Thien. This Fu***ed-up Homer Does Not Exist I have seen the dark side of the interwebs, and this is 100% cacao (read: very dark), folks. Visit at your own peril – you'll never look at the Simpsons in the same way. Created by Thomas Dimson. This Fursona Does Not Exist I'm not sure exactly what to do think of this. On the one hand, I learned the word "fursona" today. On the other hand, I discovered the page "wikifur.com" today. These are strange times. Regardless, excellent execution of a StyleGAN. Created by arfa. This Night Sky Does Not Exist Over 55% of the world lives in an urban area with immense light pollution, unable to see the beauty of the stars and constellations. Unable to see the wonders of space. Unable to see whether they're a Scorpio or a Pisces – this site aims to solve that by democratizing access to the night sky. Created by Arthur Findelair. This Music Video Does Not Exist Next up on the AI chopping block – the music industry. By combining OpenAI's Jukebox and a StyleGAN for visuals, this website will give you a never-before-seen music video worthy of a VMA. Watch out MTV – you're about to have a lot more nominations this year than you expected. Created by Taggart Bonham. This Beach Does Not Exist Are you in need of a tropical vacation? Well do we have the perfect deal for you. Exclusively through his site, Vojtěch can sell you a lease to beachfront property with no tourists! Of course, the property only exists inside of a computer, but you're paying for the experience so be grateful. Created by Vojtěch Semecký. This Map Does Not Exist With Apple Maps and Google Maps competing on improving the quality and detail of their maps through satellite imagery and AI, this site takes a completely different approach – just create your own maps with as much detail as you want. Users won't actually check if there's a house there...will they? Created by Isaac Boates. This Idea Does Not Exist Looking for a fun, new side-project? Look no further than this new site that recommends groundbreaking new ideas for companies or open-source projects. It's an I'm Feeling Lucky for how to spend an exotic weekend with some wine and your favorite IDE. Created by Andrew Cantino. This Sneaker Does Not Exist Sneaker heads beware – this site will keep you hooked. Feature request: every sneaker should have a button that allows you to instantly send the sneaker's photo to Nike. Created by Stan van der Vossen. This Baseball Player Does Not Exist Fortunately for the MLB, we've developed a fantastic recruiting pipeline for budding new baseball talent – generate 'em with AI. Created by Nolan Madge. This Flag Does Not Exist It's not often that a country is in the market for a new flag, but on the off chance that they are, this site has them covered. It'll even offer a potentially new name for the flag. You know, just in case they wanna change their name too. Created by VRBobbie. This Interview Does Not Exist Interviewing is a pain, and this tool is trying to lessen that pain by generating both the questions and the answers. Now, you can sit back and relax before any interview, knowing that this site has got your back. Fingers crossed you get the job! This Iris Does Not Exist Do you ever get the feeling that something's watching you? Don't worry, it could just be this GAN and its latest iris. It takes the phrase "I've got my eye on you" to a whole new level. This Voice Does Not Exist This might be one of my favorites, not only because the actual voices sound absolutely realistic, but also because the generated sentences are absurd and exactly what I'd expect an AI to say. The voices may not pass a Turing Test, but they'll make you question who's actually on the other end of the phone next time you call customer support. Created by Nicolas Müller. This Pepe Does Not Exist In a stroke of absolute brilliance, this site finally delivers what we've all been yearning for since the inception of generative AI models at scale. While you may see some Pepe as blurred or malformed, consider the deformities a visual metaphor for the uncertainty of life and the haziness of trying to predict the future. Either that or the model needs some more training data. But who knows! Created by Jess Moss & Helena Milionis. This House Does Not Exist The crack research team at Airbnb has been working on a solution to their supply-chain issues - they're running out of new houses to feature on their marketplace. To solve this, they've built an AI to just generate new house pictures for their listings. Disclaimer: That is a complete joke. True story: I would genuinely live in some of the houses generated by this amazing GAN. Created by @levelsio. This Campsite Does Not Exist There's nothing quite like escaping nature and taking in a great breath of fresh air. But then again, why drive somewhere when you can get 99% of the experience from the comfort of your computer? With this site, you can experience the beauty of nature from the convenience of home. Win-win. Created by Andy Feliciotti. This Mountain Does Not Exist The world has become obsessed with the idea of climbing ever since Free Solo. But the dangers of free soloing aren't for everyone. For the more practical climbers, simply take a visit to this site that uses GANs to maximize your safety - you can't get injured climbing a mountain if the mountain doesn't exist! Created by Kiru. This Music Does Not Exist Record companies avert your eyes, for no industry is safe [insert sarcastic tone here]. This site features AI-generated scores from a variety of instruments ranging from string to brass. Take a listen and be sure to catch this AI on tour at a venue near you! Created by Nicolas Müller. This Street View Does Not Exist An incredible game that combines a dataset from GeoGuessr with the new DALL-E 2 model to generate fake street views of actual places, and then makes a GeoGuessr like game out of those views. For some extra fun, try out Funky Mode. Created by @lemiffe. This Graffiti Does Not Exist Breaking the law is a big price to pay for dedication to an art form. But worry no more! With this site, you can experience and appreciate the beauty of graffiti without resorting to vandalism and risking jail time. Or at the very least a fine. Or at the very, very least, some anxiety about getting a stern talking-to. Created by Måns Grebäck. This Airport Does Not Exist While air travel is becoming more convenient every day, there isn't an airport at every location you may want to go. To solve this, what if we created our own airpots on demand? That way, if you're flying from London to Paris but wanted to get off a bit earlier in Northern France, you could just ask your Uber driver...errr pilot to let you off a bit early. Created by Sam Conrad Joyce. This Play Does Not Exist When Broadway tickets are a bit too difficult to get, you can experience the true magic of a play using this incredible Instagram account all from the comfort of your home. Every set transports you to a different world (in the mind of a GAN). Created by Jost von Harleßem.'''
