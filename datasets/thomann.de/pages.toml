duct-carousel-tabbed-blowouts"], []); Über Ape Labs Firmenstandort Deutschland Bei uns seit 2009 Produkte auf Lager 153 Ø Verfügbarkeit 81.97% (1 Jahr) Die Ursprünge der Firma APE labs GmbH reichen ins Jahr 2009 zurück, als Julius Schrenk den Grundstein für das Unternehmen legte. Der Hauptsitz ist in Eisingen (D). Aktuell führen wir 170 Produkte von Ape Labs – davon sind 154 direkt ab Lager Treppendorf verfügbar (und natürlich auch in unserem Laden antestbar) und 2 Angebote in unseren aktuellen Hot Deals. Wir führen Produkte von Ape Labs seit 2009, also seit 16 Jahren. Wir geben uns viel Mühe, unsere Kunden auch über die Produkte von Ape Labs umfassend zu Informieren. Alleine zu Produkten von Ape Labs finden Sie auf unserer Webseite aktuell 2095 Bilder, 43 detaillierte 360-Grad-Ansichten und 451 User-Bewertungen. Insgesamt 32 Produkte von Ape Labs sind derzeit Top-Seller von Thomann, u. a. in den Kategorien LED Outdoor Scheinwerfer, LED Tubes, Wireless DMX / Funk DMX, LED Scheinwerfer Akkubetrieben, LED Dekobeleuchtung, LED Leuchtmittel und LED Stripes. Aktueller Top-Seller ist das Produkt Ape Labs LightCan V2 Grey. Absoluter Dauerbrenner ist Ape Labs ApeLight maxi V2 (B) TP 6 SB G - von diesem Artikel haben wir bereits über 750 verkauft. Der Hersteller gibt auf seine Produkte 2 Jahre Garantie, doch mit unserer 3 Jahre Thomann Garantie gewähren wir Ihnen ein Jahr zusätzlich. Billig kann jeder, aber nicht so wie Thomann :-) Alleine in den letzten 90 Tagen haben wir bei 13 Produkten von Ape Labs die Preise nach unten korrigiert. Mehr Informationen zum Hersteller finden Sie auf http://www.apelabs.de So erreichen Sie uns tho.bootstrapModule('helpdesk.contactContentHelpdesk', [[{"id":16,"label":"Beleuchtung","phone":"09546-9223-45","faxNumber":"09546-9223-443","mailto":"licht@thomann.de","assistants":[{"image":"https:\/\/thumbs.static-thomann.de\/thumb\/thumb90x90\/pics\/sbpics\/200r\/4224.jpg","alt":"employee"},{"image":"https:\/\/thumbs.static-thomann.de\/thumb\/thumb9