full_description = "Featured Case Study Knect How thoughtbot helped a founder determine if their AI opportunity was technically feasible and worth pursuing. Knect: Read the case study AI in Focus - Learning series Let’s break down the AI hype machine. Join our series designed for thoughtful product leaders who want to uncover the business potential of realistic AI options. In each session, we’ll guide you beyond the buzz. Learn how to sort through your AI ideas, identify the most viable options, assess technical feasibility, and start executing. About this series Discover business opportunity beyond the hype Part 1 of this series features roundtables on the strategic foundations for roadmapping successful AI projects. Part 2 of this series is an Intro to AI for Rails developers led by thoughtbot CEO Chad Pytel. Part 1 How to bring your best AI idea to life How do we separate valuable real-world applications from misleading AI market hype? Part 1 of our series features thoughtbot product leaders sharing their experiences and advice for turning AI into a powerful tool in your problem-solving toolbox. Whether you're stuck or just starting on your AI initiative, you'll gain actionable insights on everything from technology choices to managing your AI project after launch. Part 1 Strategic Foundations Getting started The group discusses the most common misconceptions that hold teams back from starting AI projects. Watch The AI feasibility framework Is AI right for your product? Learn how to evaluate your technical options, business impact, cost, and role in your product roadmap. Watch Managing AI after launch The group discusses why the human element is critical to managing and iterating on your AI project for long-term success. Watch AI discovery case study Coming soon! Learn how one CEO went from hypotheses to a validated proof of concept and a clear product roadmap. Part 2 Let's start implementing code! Now that you have the strategic foundations down, it’s time to start your AI initiative. Learn by doing alongside thoughtbot CEO Chad Pytel. Chad's sessions walk through foundational AI technical concepts to help you implement your first AI features. This section of the series is ideal for experienced web developers and technical product folks. Part 2 Intro to AI for Rails Developers Working with OpenAI's ChatGPT Explore using ChatGPT to answer questions from non-public internal documentation, and ensuring accurate answers. Watch Structured data and function calling Build on the last session and get the LLM to give our documentation back a JSON formatted response to searches. Watch Information summarization Use an LLM to summarize user-supplied information in our app and ensure privacy. Watch Setting up a local LLM Set up a local LLM, explore AI ethics, and implement a recommended articles system using embeddings and OpenAI. Watch AI success story Validating and building an AI proof-of-concept Featured Case Study Knect How thoughtbot helped a founder determine if their AI opportunity was technically feasible and worth pursuing. Knect: Read the case study What does success look like for your project? Let’s talk!"
