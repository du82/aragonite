title = "thoughtbot Accessibility Statement | thoughtbot"
description = "Everyone, regardless of device or ability, should be able to enjoy visiting thoughtbot.com. This means building our website in a robust and accessible way."
full_description = "Our commitment to accessibility Everyone, regardless of device or ability, should be able to enjoy visiting thoughtbot.com. This means building our website in a robust and accessible way. thoughtbot Accessibility Statement thoughtbot is committed to digital accessibility, conforming to the Web Content Accessibility Guidelines (WCAG) 2.2, Level A and AA, and complying with Americans with Disabilities Act (ADA) effective communication requirements and other applicable regulations. We create working, maintainable, and understandable software that is enjoyable and easy to use. Beyond that, designing and building quality software means improving the security, privacy, and accessibility of the product, and includes improvements of life and reduction of harm for all users and contributors. Everyone, regardless of device or ability, should be able to enjoy visiting thoughtbot.com. This means building our website in a robust and accessible way. To accomplish this, we have engaged an experienced accessibility consultant, Allyant, to provide recommendations to increase accessibility so that our website meets or exceeds applicable standards. We want to hear from you if you encounter any accessibility barriers on our digital properties. Please contact our Customer Support at hello@thoughtbot.com."
