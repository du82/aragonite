full_description = "sea moment Published: January 2, 2023 Modified: January 2, 2023 I went for a regular walk today - sitting next to the water I was thinking about moments, the sea always reminds me of moments. Things come and go, people and objects and places; the only things that are ever really yours are the moments you live. As Im walking past people on the road, we share moments. If you listen to time; those moments are worth the world; and then they pass on, making room for more! (Look at this rock!) sea moment Published: January 2, 2023 Modified: January 2, 2023 I went for a regular walk today - sitting next to the water I was thinking about moments, the sea always reminds me of moments. Things come and go, people and objects and places; the only things that are ever really yours are the moments you live. As Im walking past people on the road, we share moments. If you listen to time; those moments are worth the world; and then they pass on, making room for more! (Look at this rock!) Previous Next"
