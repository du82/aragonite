["https://www.threatmodelingmanifesto.org"]
title = "Threat Modeling Manifesto"
description = "The Threat Modeling Manifesto documents the values, principles and key characteristics as an industry guidance for conducting threat modeling."
full_description = "What is threat modeling? Threat modeling is analyzing representations of a system to highlight concerns about security and privacy characteristics. At the highest levels, when we threat model, we ask four key questions: What are we working on? What can go wrong? What are we going to do about it? Did we do a good enough job? Why threat model? When you perform threat modeling, you begin to recognize what can go wrong in a system. It also allows you to pinpoint design and implementation issues that require mitigation, whether it is early in or throughout the lifetime of the system. The output of the threat model, which are known as threats, informs decisions that you might make in subsequent design, development, testing, and post-deployment phases. Who should threat model? You. Everyone. Anyone who is concerned about the privacy, safety, and security of their system. How should I use the Threat Modeling Manifesto? Use the Manifesto as a guide to develop or refine a methodology that best fits your needs. We believe that following the guidance in the Manifesto will result in more effective and more productive threat modeling. In turn, this will help you to successfully develop more secure applications, systems, and organizations and protect them from threats to your data and services. The Manifesto contains ideas, but is not a how-to, and is methodology-agnostic. The Threat Modeling Manifesto follows a similar format to that of the Agile Manifesto by identifying the two following guidelines: Values: A value in threat modeling is something that has relative worth, merit, or importance. That is, while there is value in the items on the right, we value the items on the left more. Principles: A principle describes the fundamental truths of threat modeling. There are three types of principles: (i) fundamental, primary, or general truths that enable successful threat modeling, (ii) patterns that are highly recommended, and (iii) anti-patterns that should be avoided. Values We have come to value: A culture of finding and fixing design issues over checkbox compliance. People and collaboration over processes, methodologies, and tools. A journey of understanding over a security or privacy snapshot. Doing threat modeling over talking about it. Continuous refinement over a single delivery. Principles We follow these principles: The best use of threat modeling is to improve the security and privacy of a system through early and frequent analysis. Threat modeling must align with an organization’s development practices and follow design changes in iterations that are each scoped to manageable portions of the system. The outcomes of threat modeling are meaningful when they are of value to stakeholders. Dialog is key to establishing the common understandings that lead to value, while documents record those understandings, and enable measurement. These patterns benefit threat modeling: Systematic Approach Achieve thoroughness and reproducibility by applying security and privacy knowledge in a structured manner. Informed Creativity Allow for creativity by including both craft and science. Varied Viewpoints Assemble a diverse team with appropriate subject matter experts and cross-functional collaboration. Useful Toolkit Support your approach with tools that allow you to increase your productivity, enhance your workflows, enable repeatability and provide measurability. Theory into Practice Use successfully field-tested techniques aligned to local needs, and that are informed by the latest thinking on the benefits and limits of those techniques. These anti-patterns inhibit threat modeling: Hero Threat Modeler Threat modeling does not depend on one’s innate ability or unique mindset; everyone can and should do it. Admiration for the Problem Go beyond just analyzing the problem; reach for practical and relevant solutions. Tendency to Overfocus Do not lose sight of the big picture, as parts of a model may be interdependent. Avoid exaggerating attention on adversaries, assets, or techniques. Perfect Representation It is better to create multiple threat modeling representations because there is no single ideal view, and additional representations may illuminate different problems. About Our intention for the Threat Modeling Manifesto is to share a distilled version of our collective threat modeling knowledge in a way that should inform, educate, and inspire other practitioners to adopt threat modeling as well as improve security and privacy during development. We developed this Manifesto after years of experience thinking about, performing, teaching, and developing the practice of, Threat Modeling. We have diverse backgrounds as industry professionals, academics, authors, hands-on experts, and presenters. We bring together varied perspectives on threat modeling. Our ongoing conversations, which focus on the conditions and approaches that lead to the best results in threat modeling, as well as how to correct when we fail, continue to shape our ideas. We provide a PDF version of the manifesto and this website is also print friendly. You can always find the current version of this manifesto at https://www.threatmodelingmanifesto.org/. This work is licensed under a Creative Commons Attribution 4.0 International License. Authors The working group of the Threat Modeling Manifesto consists of individuals with years of experience threat modeling for security or privacy. Zoe Braiterman Adam Shostack Jonathan Marcil Stephen de Vries Irene Michlin Kim Wuyts Robert Hurlbut Brook S.E. Schoenfield Fraser Scott Matthew Coles Chris Romeo Alyssa Miller Izar Tarandach Avi Douglen Marc French The working group would like to thank Loren Kohnfelder and Sheila Kamath for their technical edit review and expert feedback on the document content and structure. Resources New manifesto offers CISOs an agile guide to threat modeling article by Derek B. Johnson, SC Magazine The Threat Modeling Manifesto – Part 1 on the Application Security Podcast The Threat Modeling Manifesto – Part 2 on the Application Security Podcast Threat Modeling Manifesto defines the foundation of threat modeling article by Kim Wuyts, LINDDUN privacy Twitter list of all the authors by Jonathan Marcil Security Pros Push for More Pervasive Threat Modeling article by Robert Lemos, DARKReading Threat modeling gets its manifesto: Map out your app sec risk first article by John P. Mello Jr., TechBeacon How Matters As Much As What & Why LinkedIn article by Brook Schoenfield A threat modelling experience talk by Brook S.E. Schoenfield, OWASP BeNeLux-Day 2020 Continuous Threat Modeling for Development Teams talk by Izar Tarandach, OWASP BeNeLux-Day 2020 Using the Threat Modeling Manifesto to Get Your Team Going By Irene Michlin The Threat Modeling Manifesto Posters on Agile Stationery Threat Model Diversity by Brook Schoenfield Boost Pipeline Efficiency with Threat Modeling by Alyssa Miller Privacy. Privacy by design. Privacy engineering. by Kim Wuyts Threat Modeling Manifesto Panel, Open Security Summit 2020 Using the Threat Modeling Manifesto to Build an Enterprise Threat Modeling Program by Chris Romeo, LASCON 2021 Threat Modeling Manifesto in a Mobile First World by Chris Romeo at DevSecOps Bunch Threat Modeling: A Manifesto And Some Code by Matthew Coles and Izar Tarandach at DevSecOps - London Gathering"
year_published = 2025
clearnet = "https://www.threatmodelingmanifesto.org"
