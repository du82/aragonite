["https://threatpost.com/ransomware-attacks-are-on-the-rise/180481"]
title = "Ransomware Attacks are on the Rise | Threatpost"
description = "Lockbit is by far this summer’s most prolific ransomware group, trailed by two offshoots of the Conti group."
full_description = "Ransomware Attacks are on the Rise Author: Nate Nelson August 26, 2022 12:44 pm minute read Share this article: Lockbit is by far this summer’s most prolific ransomware group, trailed by two offshoots of the Conti group. After a recent dip, ransomware attacks are back on the rise. According to data released by NCC Group, the resurgence is being led by old ransomware-as-a-service (RaaS) groups. With data gathered by “actively monitoring the leak sites used by each ransomware group and scraping victim details as they are released,” researchers have determined that Lockbit was by far the most prolific ransomware gang in July, behind 62 attacks. That’s ten more than the month prior, and more than twice as many as the second and third most prolific groups combined. “Lockbit 3.0 maintain their foothold as the most threatening ransomware group,” the authors wrote, “and one with which all organizations should aim to be aware of.” Those second and third most prolific groups are Hiveleaks – 27 attacks – and BlackBasta – 24 attacks. These figures represent rapid rises for each group – since June, a 440 percent rise for Hiveleaks, and a 50 percent rise for BlackBasta. It may well be that the resurgence in ransomware attacks, and the rise of these two particular groups, are intimately connected. Why Ransomware Has Bounced Researchers from NCC Group counted 198 successful ransomware campaigns in July – up 47 percent from June. Sharp as that incline may be, it still falls some ways short of the high-water mark set this Spring, with nearly 300 such campaigns in both March and April. Why the Flux? Well, in May, the United States government ramped up its efforts against Russian cybercrime by offering up to $15 million for prized information about Conti, then the world’s foremost ransomware gang. “It is likely that the threat actors that were undergoing structural changes,” the authors of the report speculated, “and have begun settling into their new modes of operating, resulting in their total compromises increasing in conjunction.” Hiveleaks and BlackBasta are the result of that restructuring. Both groups are “associated with Conti,” the authors noted, Hiveleaks as an affiliate and BlackBasta as a replacement strain. “As such, it appears that it has not taken long for Conti’s presence to filter back into the threat landscape, albeit under a new identity.” Now that Conti’s properly split in two, the authors speculated, “it would not be surprising to see these figures further increase as we move into August.” Share this article: Malware Vulnerabilities"
year_published = 2022
year_updated = 2022
