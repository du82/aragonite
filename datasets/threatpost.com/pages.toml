["https://threatpost.com/experts-weigh-in-ecommerce-security/160630"]
title = "Experts Weigh in on E-Commerce Security Amid Snowballing Threats | Threatpost"
description = "How a retail sector reeling from COVID-19 can lock down their online systems to prevent fraud during the upcoming holiday shopping spike."
full_description = "Experts Weigh in on E-Commerce Security Amid Snowballing Threats Author: Becky Bracken October 28, 2020 8:00 am minute read Share this article: How a retail sector reeling from COVID-19 can lock down their online systems to prevent fraud during the upcoming holiday shopping spike. The raging pandemic has forced many retailers to re-imagine their businesses, shifting from in-person to contactless interactions through online sales. This new socially distanced reality is colliding with the crush of an upcoming holiday shopping season, creating an unprecedented opportunity for cybercriminals to capitalize. Magecart is just one of the more potent types of attacks to emerge in recent months. Over one September weekend alone, the group’s card-skimmer malware was launched against 2,000 online retailers, compromising more than 10,000 shoppers. But experts are warning retailers not to focus only on one threat or on protecting one particular system. Increasingly, attacks are attempting to infiltrate systems from multiple entry points simultaneously, supercharged by bots and automation, and lured by flocks of unsuspecting newbie online shoppers. In fact, new customer accounts make up 30 percent of current transactions, which is five times higher than pre-COVID, according to Forter’s recent fraud attack index. With threat levels at historic highs, Threatpost gathered a panel of experts on retail e-commerce security to help sort through the rising threats – and how retailers can defend themselves, their reputations and their customer’s data. Their prescription isn’t simple. Each suggested a wholistic approach which starts with the basics: Patching, encouraging strong passwords and strong, fundamental Web Application Firewall (WAF) protection. Besides that, retailers need to understand their own operations first and foremost, gaining a transparent view into them and getting a firm handle on what “normal” looks like for each organization. It’s that critical baseline that will often trigger the first alert the site is under attack. Industry-leading experts Robert Capps, NuData’s vice president of marketplace innovation; Allan Liska, intelligence analyst for Recorded Future; and Matt Wilson who leads product management for network and application security at Neustar all joined a live Threatpost Webinar event on Oct. 14 titled, “Retail Security: Magecart and the Rise of e-Commerce Threats.” They offered an up-to-the-minute look at the retail threat landscape, including the application network layer and the evolving role of automation and bots (which are increasingly able to mimic human behavior to evade detection). Other topics included loyalty programs, fraudsters who buy online and pick up merchandise in the store, the ways cybercriminals can turn an easy buck on unsuspecting retailers is always evolving and more. Check out our experts’ critical insights on how to keep ahead in our video replay, below, followed by a lightly edited transcript of the event. Also please check out Threatpost’s collection of previous and upcoming webinar events, available here. Transcript Becky Bracken: Hello, everybody, and welcome to Threatpost’s Live webinar titled, Retail Security and the Rise of E-commerce. I’m Becky Bracken and I will be your host for today’s presentation. Today, we’ve gathered a world-class panel of security experts who will discuss threats online to retailers, and we’re thrilled to have them join us. The pandemic, as we all know, is created a bit of a perfect storm for retails security breaches, of all kinds. It’s drastically accelerated the shift from shopping in a store to making even the most mundane purchases online. And I think pretty much once we were all on eBay, bidding on rolls of toilet paper, all sense flew out the window of us not being able to buy everyday stuff online. In fact, new customer accounts make up 30 percent of current transactions online, which is five times higher than it was before the pandemic, according to Fortes recent fraud attack index. Retailers have also had to cobble together entirely new chains of business, moving away from in-person to contactless transactions like delivery. And there are new models of buy online, pick up in store. But because they’re new, they’re pretty plum pickings for clever criminals trying to find their next hustle. And now we’re headed into the holiday shopping season, which will add an entirely new level of chaos. Fraudsters love to use the cover of spike in traffic for their crimes. More transactions means security is bogged down and gets overloaded with traffic surges and increased volume, which leaves them exposed. It’s a new world for retailers and we’ve brought together our panelists to sort it out and talk about the trends that they’re seeing. First, we’d like to welcome Robert Capps, who is NuData’s VP of Marketplace Innovation. He’s a respected industry expert with more than 25 years of experience in the sector. So welcome, Robert. Next, we have Allan Liska, an intelligence analyst for Recorded Future. He’s a go-to media source and consultant to businesses on how to combat evolving threats. Finally, I’d like to introduce Matt Wilson. He leads Product Management for Network and Application Security at Neustar, where he developed and maintains the largest DDOs mitigation network in the world. I want to welcome all of you and thank you very much for being here. For the purposes of today’s discussion, we’ve broken the whole universe of exposure into three vectors: external threats, threats from the network view and threats from the internal view. First, we’re going to have Allan discuss the retail security landscape as a whole and highlight a few of the most headline making and prolific threats, Allan, if you’d like to take it away. Allan Liska: Yeah, absolutely! Thank you very much for kicking us off, and thank you, everyone, for attending today. So, I want to start with what we’re looking at, in terms of the biggest attacks that we’re seeing against e-commerce and retail sites over the last six months. So the big sort of headline-grabber, and the reason that it’s in the title of the webinar today, is Magecart, which has hit has hit a lot of major retailers. Whether that’s through actual vulnerabilities in the retail site, or whether it’s through targeted campaigns, there’s been a whole lot of different groups. And there have been a whole lot of different methods of attack, and unfortunately, they’ve been very prolific. The second thing is we’re seeing is a rise in DDoS attacks against e-commerce and retail sites. So we have [Amazon Web Services] halting the largest DDoS attack ever recorded; GameStop getting hit with DDOs attacks; etc. So it seems like every major retailer has had a problem with DDoS. And we have now the problem of DDoS extortion. Similar to ransomware, where the attackers threaten to release your data unless you pay them $250,000 in Bitcoin. That’s a big problem. And then, we also have the problem of retail and e-commerce sites being used as phishing lures. Now that’s been a problem for the largest brands. So, Apple has been used, Amazon has been used, Yahoo and Netflix have been used as phishing lures. But we’re seeing a change in the capabilities of these phishing-lure campaigns where the attackers are very adaptable to what’s going on in the world. And we’ll talk a little bit about that. So Magecart is used an identifier for multiple threat actors. It’s not just one team behind Magecart. There are multiple of them. And basically, what Magecart is, is a JavaScript-based card skimmer. So, you load that up onto a website. You intercept somebody trying to buy something on the store, and you steal their credit-card information. There are dozens of different groups that Recorded Future has been tracking, and they’ve hit thousands and thousands of websites. So right now, it’s one of the biggest threats to e-commerce sites. In September we saw, over a weekend, 2,000 sites get hit by the exploitation of a single vulnerability. This is a great graphic that I pulled from Security Affairs to show kind of how it works. What you have is, you have an e-commerce site, and then an actor will get in, [maybe] through an exploitation. They’re using known vulnerabilities that have public exploits, that have been out for a while. They’ll exploit those, top-load their code, or they’ll go buy advertising on certain websites through the banner ads, and they’ll use that and load that in the banner ad itself. So basically, what happens is the victim gets hit. Then their credit-card and other information is stolen. The attacker then goes and uses that to buy merchandise and other things. The shipment goes to an Eastern European buyer, and the attacker winds up getting the money. It’s a long, complicated process, but it’s been very profitable for a lot of these attackers. It’s been relatively safe as a means to an attack without detection. So while Magecart is one of the biggest threats, the other things that we want to focus on are the DDoS attacks and the phishing lures. I’m gonna let Matt, who has way more information, talk about DDoS attacks. They are on the rise and they’ve taken out some of the some of the larger sites at least temporarily. And again, we’re seeing a rise in retail DDoS extortion. And we expect to continue to see more of that as it gets easier and easier to launch these DDoS attacks. Every time a botnet gets taken down, another one pops up or it just reforms itself. We saw it with TrickBot, which is generally not used for DDoS attacks. But it was temporarily disrupted and immediately came right back online with backup infrastructure. So, unfortunately, disrupting these botnets is, at best, a temporary solution. They continue to pop back up. But again, when we talk about retail organizations being increasingly used as phishing lures, one of the things we saw during the pandemic is a quick adaption depending on what the current news stories were. So for the first time ever, we saw grocery stores being used for phishing. So you get an ad purported to come from a national grocery store chain, but in fact, it was a phishing attack. Same thing with food-delivery services. We saw a huge uptick in fake domains being registered. Domains being registered for places like DoorDash, Uber Eats, things like that. And we saw that there was an awfully bad attempt to get people to click on to buy toilet paper. So we saw even toilet-paper companies get impersonated as part of these attacks. So, as things continue to evolve, and especially heading into the season, we normally expect the luxury brands to be impersonated, we see a lot of that with like Rolex and Porsche, and Mercedes, et cetera. As phishing actors get more sophisticated, they’re moving downstream and they’re moving to very specific verticals that people aren’t necessarily expecting to be used as phishing lures. And we expect that trend to continue. So, unfortunately, it’s something that’s not going away. Matt Wilson: Yeah, hi, everybody. So DDoS really falls into two different aspects. You think about it in two different ways. One is about protecting your infrastructure. And that’s really the idea that having a website that’s up, is actually really critical obviously. So, you know, if your website’s not up, everything else kinda doesn’t matter from a retail perspective. So we’ve seen for years that DDoS has been used for a lot of different reasons. It’s being used currently and political ways, you know, taking down political dissidents, targeting our nation states. In the case of things like the invasion of Georgia, and some other places, they saw a lot of DDoS attacks preempting that. Also, you see a lot of people, just sort of angry and wanting to take somebody offline. But then you’ve also seen a lot where you’ve had both anti-competitive type of type of threats where someone wants to take down a competition that might exist in another area. But increasingly, what it’s come back to here recently is the idea of extortion attacks. We’ve seen a huge uptick in this. It was never really went away. We’ve always had a lot of customers who have come under extortion attacks, but they tended to be, as Allan mentioned, in specific industry verticals, against high-profile brands, things like that. So, increasingly, starting back in August, you started to see a lot more extortion attacks, including a big campaign of different groups going after financial and travel companies, and they’ve since morphed. And I think you’ve seen a transition from just focusing on high profiles — large banks, things along those lines — and now they’re starting to go after what are traditionally less high-profile, less-lucrative types of businesses, in healthcare, regional banks, insurance providers, even things like personal care products. It’s started to evolve, and the threat landscape has really evolved, particularly in the last year. So we’ve seen kind of two real things happen. One is, new people beginning to get threatened and attacked. These aren’t traditional types of targets, who might not be what you would consider to be high-risk. So they may be less likely to have protection in place. So maybe they’re a little more likely to pay out a ransomware, but then they’ve also sort of moved down the stack. And so you’ve seen things that where, instead of just trying to take down networks, [bad actors] try to take on applications. And I don’t just see one type of attack. For instance, some of these extortion attacks, there’s about six or seven different vectors that are commonly used as part of these attacks. Typically it’s not one, they don’t simply send one vector. They’ll send multiple vectors. So having one type of protection really doesn’t work anymore. You need to be able to have defense in depth. So, it starts at the network level. Being able to absorb the big bandwidth attacks leaves you to be able to put your resources into more specific, more targeted types of attacks on your end. Like I said, this is what we’ve seen a lot of, is…extortion attacks, but you’ve seen them as part of phishing campaigns with the idea being that the DDoS attack is very much a diversionary tactic. They hit the news. They’re big. We talk about things like, you know, the largest attacks out there being in the two terabits per second type of range. And they’re all big, really big. And they’re very scary looking. However, the real damage can come behind the scenes, and I equate it to walking down the street and someone comes up and punches you in the face. Meanwhile, someone else is picking your pocket, while you’re worried about your face. And that’s very much where DDOs falls into that threat landscape. Oftentimes, it’s not just a matter of if you’re going to be in an attack, having a plan is very important. One of the biggest parts of [defending against] a DDoS attack is simply limiting your attack surface. You have applications that are open"
