["https://tidbyt.com/pages/about"]
title = """
About
 – Tidbyt"""
description = "Tidbyt keeps you updated on transit, weather and more. Leave your phone in your pocket."
full_description = '''We’ve built a new way to keep up with the things you care about. <link href="//tidbyt.com/cdn/shop/t/12/assets/component-rte.css?v=69919436638515329781658581767" rel="stylesheet" type="text/css" media="all" /> <link href="//tidbyt.com/cdn/shop/t/12/assets/section-rich-text.css?v=19372591342986554131658581767" rel="stylesheet" type="text/css" media="all" />.section-template--16275240943849__1652960718b987416d-padding { padding-top: 0px; padding-bottom: 0px; } @media screen and (min-width: 750px) { .section-template--16275240943849__1652960718b987416d-padding { padding-top: px; padding-bottom: px; } } Hey, we're Mats, Rohan, and Mark, the creators of Tidbyt. The original idea for Tidbyt was to make a device that simplified our morning routines. What time is it? What's the weather like? When does the next subway depart? Having to reach for our phones over and over again to answer these questions was a pain.Our solution? A simple LED display device that cycles through our most important apps, so we could spend less time looking at our phones and more time doing... anything else. About us Rohan Singh Co-founder Rohan is a software and hardware hacker with 15 years of experience in tech. He has built several successful products at companies including Facebook, Spotify, and Starbucks Coffee Co.A Seattle native, he is a graduate of the University of Washington. Mats Linander Co-founder A computer nerd who turned to the dark side and became a pointy-haired boss. Over the past 12 years, Mats has led multiple teams of engineers at Spotify, and worked as a technical product owner to ship multiple products.Mats holds an M.Sc., Computer Science from the KTH Royal Institute of Technology. Mark Spicer Founding software engineer Mark is a software engineer with a passion for understanding how things work. He’s held infrastructure focused software roles at Facebook, Squarespace, and Spotify.Mark holds a BS from Rochester Institute of Technology majoring in Networking and Systems Administration as well Computing Security. Pär Johansson Product Lead A gadget lover and computer nerd, Par has spent the last 20 years working in the tech industry. For the past 10 years, he has led multiple teams at Spotify as Technical Product Owner and Product Lead, delivering multiple products that people use every day to get their job done. const cardItemSelector = ".ProfileCard_Item"; const cardSummarySelector = ".ProfileCard_Summary"; const cardDetailsSelector = ".ProfileCard_Details"; const cardCloseSelector = ".ProfileCard_Close"; document.querySelectorAll(cardSummarySelector).forEach((item, index) => { item.addEventListener('click', event => { item.classList.add('ProfileCard_Summary--active'); }) }); document.querySelectorAll(cardCloseSelector).forEach((item, index) => { item.addEventListener('click', event => { document.querySelector(cardItemSelector + ':nth-child('+ (index + 1) +') .ProfileCard_Summary').classList.remove('ProfileCard_Summary--active'); }) }) We design and build hardware in Brooklyn, NY. function initMap() { var opts = { center: { lat: 40.696899, lng: -73.953366, }, zoom: 12, styles: [{ "featureType": "administrative", "elementType": "all", "stylers": [{ "saturation": "-100" }] }, { "featureType": "administrative.province", "elementType": "all", "stylers": [{ "visibility": "off" }] }, { "featureType": "landscape", "elementType": "all", "stylers": [{ "saturation": -100 }, { "lightness": 65 }, { "visibility": "on" }] }, { "featureType": "poi", "elementType": "all", "stylers": [{ "saturation": -100 }, { "lightness": "50" }, { "visibility": "simplified" }] }, { "featureType": "road", "elementType": "all", "stylers": [{ "saturation": "-100" }] }, { "featureType": "road.highway", "elementType": "all", "stylers": [{ "visibility": "simplified" }] }, { "featureType": "road.arterial", "elementType": "all", "stylers": [{ "lightness": "30" }] }, { "featureType": "road.local", "elementType": "all", "stylers": [{ "lightness": "40" }]