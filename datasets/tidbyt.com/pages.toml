description = "Tidbyt keeps you updated on transit, weather and more. Leave your phone in your pocket."
full_description = ".shopify-policy__container { margin-top: var(--section-margin); margin-bottom: var(--section-margin) !important; } Refund policy We have a 30-day return policy, which means you have 30 days after receiving your item to request a return. To be eligible for a return, your item must be in the same condition that you received it, unused and in its original packaging. You’ll also need the receipt or proof of purchase. To start a return, you can contact us at [email protected]. If your return is accepted, we’ll send you a return shipping label, as well as instructions on how and where to send your package. Items sent back to us without first requesting a return will not be accepted. You can always contact us for any return question at [email protected]. Damages and issues Please inspect your order upon reception and contact us immediately if the item is defective, damaged or if you receive the wrong item, so that we can evaluate the issue and make it right. Exceptions / non-returnable items Certain types of items cannot be returned, like custom products (such as special orders or personalized items), and open box or factory discount items. We also do not accept returns for hazardous materials, flammable liquids, or gases. Please get in touch if you have questions or concerns about your specific item. Unfortunately, we cannot accept returns on sale items or gift cards. Exchanges The fastest way to ensure you get what you want is to return the item you have, and once the return is accepted, make a separate purchase for the new item. Refunds We will notify you once we’ve received and inspected your return, and let you know if the refund was approved or not. If approved, you’ll be automatically refunded on your original payment method. Please remember it can take some time for your bank or credit card company to process and post the refund too."
