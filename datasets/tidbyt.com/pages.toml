["https://tidbyt.com/pages/faq"]
title = """
FAQ
 – Tidbyt"""
description = "Tidbyt keeps you updated on transit, weather and more. Leave your phone in your pocket."
full_description = "How Do I Get Started? 1Plug in your Tidbyt. 2Download the Tidbyt app. 3Tap the button to connect your Tidbyt and set it up. 4Choose your favorite apps, sit back, and relax. FAQs Can I make my own apps?Tidbyt is totally hackable — you can write your own apps to show whatever you want. You can even use Tidbyt to learn how to code. 🔧Can I use Tidbyt without my phone?Totally, that's the point. Just use your Android or iPhone to setup Tidbyt at first. After that, it works on its own over Wi-Fi.Does Tidbyt connect to Wi-Fi?Yup, the Tidbyt connects to your Wi-Fi netwoork to stay updated. Tidbyt supports 2.4 GHz Wi-Fi networks, with or without a password.Does Tidbyt have a battery?Tidbyt does not have a battery, so no worries about it wearing out. If you want to use it on the go, power it with any USB-C cable and power bank.Does Tidbyt have a speaker?No speakers, AI, or mics! Tidbyt is a distraction-free experience.What is it made out of?Tidbyt is a tiny computer and a screen full of pretty LED's, all in a walnut hardwood case.What are the dimensions?8.2” / 208mm4.4” / 111mm2.0” / 51mm Shipping & Returns How long does it take before my order ships?Please allow 1-3 business days for your order to be processed for shipping. We make every effort to fulfill orders as quickly as possible.ShippingShipping times depend on your location. We ship with both UPS and Fedex which quotes, but does not guarantee, 1-5 business days for domestic delivery. Alaska and Hawaii usually require a few extra days. International shipping is longer. What is your return policy?We're happy to return or exchange your Tidbyt within 30 days of delivery. Please save the original packaging, and contact us at [email protected].Can I cancel my order?You can cancel your order at any time before we have shipped your Tidbyt for a full refund.My Tidbyt been marked delivered, but it’s not here.Sometimes carriers mark items as delivered before they have actually delivered the items. We know this can be frustrating - please wait a few days to see if your package arrives and reach out to [email protected] if it does not.Do you ship internationally?Tidbyt ships from the USA to select countries. International deliveries will be sent duty unpaid. This means that if you are ordering a Tidbyt outside the US, you may owe duty, VAT, or other taxes, based on your local regulations. .FullBtn { text-align: center; text-transform: uppercase; font: var(--font-body-medium); font-weight: 600; padding: 3.4rem var(--container-margin); cursor: pointer; background-color: var(--color-info); display: block; transition: all .3s; } .FullBtn > span { border-bottom: 1px solid currentColor; } .FullBtn:hover { background-color: black; color: white; } .FullBtn--ctaColor { background-color: var(--color-cta); } .FullBtn--accountColor { background-color: var(--color-account); } .FullBtn--shopColor { background-color: var(--color-shop); } Email us"
