["https://tidbyt.com/policies/privacy-policy"]
title = """
Privacy policy
 – Tidbyt"""
description = "Tidbyt keeps you updated on transit, weather and more. Leave your phone in your pocket."
full_description = ".shopify-policy__container { margin-top: var(--section-margin); margin-bottom: var(--section-margin) !important; } Privacy policy TIDBYT, INC. (“we” or “us” or “our”) respects the privacy of our users (“user” or “you”). This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website, tidbyt.com, and our mobile application, including any other media form, media channel, mobile website, or mobile application related or connected thereto (collectively, the “Site”). Please read this privacy policy carefully. If you do not agree with the terms of this privacy policy, please do not access the site. We reserve the right to make changes to this Privacy Policy at any time and for any reason. We will alert you about any changes by updating the “Last Updated” date of this Privacy Policy. Any changes or modifications will be effective immediately upon posting the updated Privacy Policy on the Site, and you waive the right to receive specific notice of each such change or modification. You are encouraged to periodically review this Privacy Policy to stay informed of updates. You will be deemed to have been made aware of, will be subject to, and will be deemed to have accepted the changes in any revised Privacy Policy by your continued use of the Site after the date such revised Privacy Policy is posted. COLLECTION OF YOUR INFORMATION We may collect information about you in a variety of ways. The information we may collect on the Site includes: Personal Data Personally identifiable information, such as your name, shipping address, email address, and telephone number, and demographic information, such as your age, gender, hometown, and interests, that you voluntarily give to us when you register with the Site or our mobile application, or when you choose to participate in various activities related to the Site and our mobile application, such as online chat and message boards. You are under no obligation to provide us with personal information of any kind, however your refusal to do so may prevent you from using certain features of the Site and our mobile application. Derivative Data Information our servers automatically collect when you access the Site, such as your IP address, your browser type, your operating system, your access times, and the pages you have viewed directly before and after accessing the Site. If you are using our mobile application, this information may also include your device name and type, your operating system, your phone number, your country, your likes and replies to a post, and other interactions with the application and other users via server log files, as well as any other information you choose to provide. Financial Data Financial information, such as data related to your payment method (e.g. valid credit card number, card brand, expiration date) that we may collect when you purchase, order, return, exchange, or request information about our services from the Site or our mobile application. We store only very limited, if any, financial information that we collect. Otherwise, all financial information is stored by our payment processors, Stripe and Shopify. You are encouraged to review their privacy policies and contact them directly for responses to your questions. Facebook Permissions The Site may by default access your Facebook basic account information, including your name, email, gender, birthday, current city, and profile picture URL, as well as other information that you choose to make public. We may also request access to other permissions related to your account, such as friends, checkins, and likes, and you may choose to grant or deny us access to each individual permission. For more information regarding Facebook permissions, refer to the Facebook Permissions Reference page. Data From Social Networks User information from social networking sites, such as Facebook, Google, Instagram, and Twitter, including your name, your social network username, location, gender, birth date, email address, profile picture, and public data for contacts, if you connect your account to such social networks. Mobile Device Data Device information, such as your mobile device ID, model, and manufacturer, and information about the location of your device, if you access the Site from a mobile device. Third-Party Data Information from third parties, such as personal information or network friends, if you connect your account to the third party and grant the Site permission to access this information. Data From Contests, Giveaways, and Surveys Personal and other information you may provide when entering contests or giveaways and/or responding to surveys. Mobile Application Information If you connect using our mobile application: Geo-Location Information. We may request access or permission to and track location-based information from your mobile device while you are using our mobile application, to provide location-based services. If you wish to change our access or permissions, you may do so in your device’s settings. Mobile Device Access. We may request access or permission to certain features from your mobile device, including your mobile device’s Bluetooth, calendar, camera, contacts, reminders, SMS messages, social media accounts, storage, and other features. If you wish to change our access or permissions, you may do so in your device’s settings. Mobile Device Data. We may collect device information (such as your mobile device ID, model and manufacturer), operating system, version information and IP address. Push Notifications. We may request to send you push notifications regarding your account or the Application. If you wish to opt-out from receiving these types of communications, you may turn them off in your device’s settings. USE OF YOUR INFORMATION Having accurate information about you permits us to provide you with a smooth, efficient, and customized experience. Specifically, we may use information collected about you via the Site or our mobile application to: Administer sweepstakes, promotions, and contests. Assist law enforcement and respond to subpoena. Compile anonymous statistical data and analysis for use internally or with third parties. Create and manage your account. Deliver targeted advertising, coupons, newsletters, and other information regarding promotions and the Site and our mobile application to you. Email you regarding your account or order. Enable user-to-user communications. Fulfill and manage purchases, orders, payments, and other transactions related to the Site and our mobile application. Generate a personal profile about you to make future visits to the Site and our mobile application more personalized. Increase the efficiency and operation of the Site and our mobile application. Monitor and analyze usage and trends to improve your experience with the Site and our mobile application. Notify you of updates to the Site and our mobile applications. Offer new products, services, mobile applications, and/or recommendations to you. Perform other business activities as needed. Prevent fraudulent transactions, monitor against theft, and protect against criminal activity. Process payments and refunds. Request feedback and contact you about your use of the Site and our mobile application . Resolve disputes and troubleshoot problems. Respond to product and customer service requests. Send you a newsletter. Solicit support for the Site and our mobile application. DISCLOSURE OF YOUR INFORMATION We may share information we have collected about you in certain situations. Your information may be disclosed as follows: By Law or to Protect Rights If we believe the release of information about you is necessary to respond to legal process, to investigate or remedy potential violations of our policies, or to protect the rights, property, and safety of others, we may share your information as permitted or required by any applicable law, rule, or regulation. This includes exchanging information with other entities for fraud protection and credit risk reduction. Third-Party Service Providers We may share your information with third parties that perform services for us or on our behalf, including payment processing, data analysis, email delivery, hosting services, customer service, and marketing assistance. Marketing Communications With your consent, or with an opportunity for you to withdraw consent, we may share your information with third parties for marketing purposes, as permitted by law. Interactions with Other Users If you interact with other users of the Site and our mobile application, those users may see your name, profile photo, and descriptions of your activity, including sending invitations to other users, chatting with other users, liking posts, following blogs. Online Postings When you post comments, contributions or other content to the Site or our mobile applications, your posts may be viewed by all users and may be publicly distributed outside the Site and our mobile application in perpetuity. Affiliates We may share your information with our affiliates, in which case we will require those affiliates to honor this Privacy Policy. Affiliates include our parent company and any subsidiaries, joint venture partners or other companies that we control or that are under common control with us. Business Partners We may share your information with our business partners to offer you certain products, services or promotions. Other Third Parties We may share your information with advertisers and investors for the purpose of conducting general business analysis. We may also share your information with such third parties for marketing purposes, as permitted by law. Sale or Bankruptcy If we reorganize or sell all or a portion of our assets, undergo a merger, or are acquired by another entity, we may transfer your information to the successor entity. If we go out of business or enter bankruptcy, your information would be an as