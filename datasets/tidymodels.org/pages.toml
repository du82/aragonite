title = "Create your own recipe step function – tidymodels"
description = "Write a new recipe step for data preprocessing."
full_description = '''Develop custom modeling toolsCreate your own recipe step function Create your own recipe step function developer tools Write a new recipe step for data preprocessing. Introduction To use code in this article, you will need to install the following packages: modeldata and tidymodels. There are many existing recipe steps in packages like recipes, themis, textrecipes, and others. A full list of steps in CRAN packages can be found here. However, you might need to define your own preprocessing operations; this article describes how to do that. If you are looking for good examples of existing steps, we suggest looking at the code for centering or PCA to start. For check operations (e.g. check_class()), the process is very similar. Notes on this are available at the end of this article. The general process to follow is to: Define a step constructor function. Create the minimal S3 methods for prep(), bake(), and print(). Optionally add some extra methods to work with other tidymodels packages, such as tunable() and tidy(). As an example, we will create a step for converting data into percentiles. A new step definition Let’s create a step that replaces the value of a variable with its percentile from the training set. The example data we’ll use is from the modeldata package: library(modeldata) data(biomass) str(biomass) #> 'data.frame': 536 obs. of 8 variables: #> $ sample : chr "Akhrot Shell" "Alabama Oak Wood Waste" "Alder" "Alfalfa" ... #> $ dataset : chr "Training" "Training" "Training" "Training" ... #> $ carbon : num 49.8 49.5 47.8 45.1 46.8 ... #> $ hydrogen: num 5.64 5.7 5.8 4.97 5.4 5.75 5.99 5.7 5.5 5.9 ... #> $ oxygen : num 42.9 41.3 46.2 35.6 40.7 ... #> $ nitrogen: num 0.41 0.2 0.11 3.3 1 2.04 2.68 1.7 0.8 1.2 ... #> $ sulfur : num 0 0 0.02 0.16 0.02 0.1 0.2 0.2 0 0.1 ... #> $ HHV : num 20 19.2 18.3 18.2 18.4 ... biomass_tr <- biomass[biomass$dataset == "Training",] biomass_te <- biomass[biomass$dataset == "Testing",] To illustrate the transformation with the carbon variable, note the training set distribution of this variable with a vertical line below for the first value of the test set. library(ggplot2) theme_set(theme_bw()) ggplot(biomass_tr, aes(x = carbon)) + geom_histogram(binwidth = 5, col = "blue", fill = "blue", alpha = .5) + geom_vline(xintercept = biomass_te$carbon[1], lty = 2) Based on the training set, 42.1% of the data are less than a value of 46.35. There are some applications where it might be advantageous to represent the predictor values as percentiles rather than their original values. Our new step will do this computation for any numeric variables of interest. We will call this new recipe step step_percentiles(). The code below is designed for illustration and not speed or best practices. We’ve left out a lot of error trapping that we would want in a real implementation. Note The step step_percentiles() that will be created on this page, has been implemented in recipes as step_percentile(). Create the function To start, there is a user-facing function. Let’s call that step_percentiles(). This is just a simple wrapper around a constructor function, which defines the rules for any step object that defines a percentile transformation. We’ll call this constructor step_percentiles_new(). The function step_percentiles() takes the same arguments as your function and simply adds it to a new recipe. The ... signifies the variable selectors that can be used. step_percentiles <- function( recipe, ..., role = NA, trained = FALSE, ref_dist = NULL, options = list(probs = (0:100)/100, names = TRUE), skip = FALSE, id = rand_id("percentiles") ) { add_step( recipe, step_percentiles_new( terms = enquos(...), trained = trained, role = role, ref_dist = ref_dist, options = options, skip = skip, id = id ) ) } You should always keep the first four arguments (recipe though trained) the same as listed above. Some notes: the role argument is used when you either 1) create new variables and want their role to be pre-set or 2) replace the existing variables with new values. The latter is what we will be doing and using role = NA will leave the existing role intact. trained is set by the package when the estimation step has been run. You should default your function definition’s argument to FALSE. skip is a logical. Whenever a recipe is prepped, each step is trained and then baked. However, there are some steps that should not be applied when a call to bake() is used. For example, if a step is applied to the variables with roles of “outcomes”, these data would not be available for new samples. id is a character string that can be used to identify steps in package code. rand_id() will create an ID that has the prefix and a random character sequence. We can estimate the percentiles of new data points based on the percentiles from the training set with approx(). Our step_percentiles contains a ref_dist object to store these percentiles (pre-computed from the training set in prep()) for later use in bake(). We will use stats::quantile() to compute the grid. However, we might also want to have control over the granularity of this grid, so the options argument will be used to define how that calculation is done. We could use the ellipses (aka ...) so that any options passed to step_percentiles() that are not one of its arguments will then be passed to stats::quantile(). However, we recommend making a separate list object with the options and use these inside the function because ... is already used to define the variable selection. It is also important to consider if there are any main arguments to the step. For example, for spline-related steps such as step_ns(), users typically want to adjust the argument for the degrees of freedom in the spline (e.g. splines::ns(x, df)). Rather than letting users add df to the options argument: Allow the important arguments to be main arguments to the step function. Follow the tidymodels conventions for naming arguments. Whenever possible, avoid jargon and keep common argument names. There are benefits to following these principles (as shown below). Initialize a new object Now, the constructor function can be created. The function cascade is: step_percentiles() calls recipes::add_step() └──> recipes::add_step() calls step_percentiles_new() └──> step_percentiles_new() calls recipes::step() step() is a general constructor for recipes that mainly makes sure that the resulting step object is a list with an appropriate S3 class structure. Using subclass = "percentiles" will set the class of new objects to "step_percentiles". step_percentiles_new <- function(terms, role, trained, ref_dist, options, skip, id) { step( subclass = "percentiles", terms = terms, role = role, trained = trained, ref_dist = ref_dist, options = options, skip = skip, id = id ) } This constructor function should have no default argument values. Defaults should be set in the user-facing step object. Create the prep method You will need to create a new prep() method for your step’s class. To do this, three arguments that the method should have are: function(x, training, info = NULL) where x will be the step_percentiles object, training will be a tibble that has the training set data, and info will also be a tibble that has information on the current set of data available. This information is updated as each step is evaluated by its specific prep() method so it may not have the variables from the original data. The columns in this tibble are variable (the variable name), type (currently either “numeric” or “nominal”), role (defining the variable’s role), and source (either “original” or “derived” depending on where it originated). You can define other arguments as well. The first thing that you might want to do in the prep() function is to translate the specification listed in the terms argument to column names in the current data. There is a function called recipes_eval_select() that can be used to obtain this. Warning The recipes_eval_select() function is not one you interact with as a typical recipes user, but it is helpful if you develop your own custom recipe steps. prep.step_percentiles <- function(x, training, info = NULL, ...) { col_names <- recipes_eval_select(x$terms, training, info) # TODO finish the rest of the function } After this function call, it is a good idea to check that the selected columns have the appropriate type (e.g. numeric for this example). See recipes::check_type() to do this for basic types. Once we have this, we can save the approximation grid. For the grid, we will use a helper function that enables us to run rlang::exec() to splice in any extra arguments contained in the options list to the call to quantile(): get_train_pctl <- function(x, args = NULL) { res <- rlang::exec("quantile", x = x, !!!args) # Remove duplicate percentile values res[!duplicated(res)] } # For example: get_train_pctl(biomass_tr$carbon, list(probs = 0:1)) #> 0% 100% #> 14.61 97.18 get_train_pctl(biomass_tr$carbon) #> 0% 25% 50% 75% 100% #> 14.610 44.715 47.100 49.725 97.180 Now, the prep() method can be created: prep.step_percentiles <- function(x, training, info = NULL, ...) { col_names <- recipes_eval_select(x$terms, training, info) check_type(training[, col_names], types = c("double", "integer")) ## We'll use the names later so make sure they are available if (x$options$names == FALSE) { rlang::abort("`names` should be set to TRUE") } if (!any(names(x$options) == "probs")) { x$options$probs <- (0:100)/100 } else { x$options$probs <- sort(unique(x$options$probs)) } # Compute percentile grid ref_dist <- purrr::map(training[, col_names], get_train_pctl, args = x$options) ## Use the constructor function to return the updated object. ## Note that `trained` is now set to TRUE step_percentiles_new( terms = x$terms, trained = TRUE, role = x$role, ref_dist = ref_dist, options = x$options, skip = x$skip, id = x$id ) } We suggest favoring rlang::abort() and rlang::warn() over stop() and warning(). The former can be used for better traceback results. Create the bake method Remember that the prep() function does not apply the step to the data; it only estimates any required values such as ref_dist. We will need to create a new method for our step_percentiles() class. The minimum arguments for this are function(object, new_data, ...) where object is the updated step function that has been through the corresponding prep() code and new_data is a tibble of data to be processed. Here is the code to convert the new data to percentiles. The input data (x below) comes in as a numeric vector and the output is a vector of approximate percentiles: pctl_by_approx <- function(x, ref) { # In case duplicates were removed, get the percentiles from # the names of the reference object grid <- as.numeric(gsub("%$", "", names(ref))) approx(x = ref, y = grid, xout = x)$y/100 } We will loop over the variables one by and and apply the transformation. check_new_data() is used to make sure that the variables that are affected in this step are present. bake.step_percentiles <- function(object, new_data, ...) { col_names <- names(object$ref_dist) check_new_data(col_names, object, new_data) for (col_name in col_names) { new_data[[col_name]] <- pctl_by_approx( x = new_data[[col_name]], ref = object$ref_dist[[col_name]] ) } # new_data will be a tibble when passed to this function. It should also # be a tibble on the way out. new_data } Note You need to import recipes::prep() and recipes::bake() to create your own step function in a package. Run the example Let’s use the example data to make sure that it works: rec_obj <- recipe(HHV ~ ., data = biomass_tr) %>% step_percentiles(ends_with("gen")) %>% prep(training = biomass_tr) biomass_te %>% select(ends_with("gen")) %>% slice(1:2) #> hydrogen oxygen nitrogen #> 1 5.67 47.20 0.30 #> 2 5.50 48.06 2.85 bake(rec_obj, biomass_te %>% slice(1:2), ends_with("gen")) #> # A tibble: 2 × 3 #> hydrogen oxygen nitrogen #> <dbl> <dbl> <dbl> #> 1 0.45 0.903 0.21 #> 2 0.38 0.922 0.928 # Checking to get approximate result: mean(biomass_tr$hydrogen <= biomass_te$hydrogen[1]) #> [1] 0.4517544 mean(biomass_tr$oxygen <= biomass_te$oxygen[1]) #> [1] 0.9013158 The plot below shows how the original hydrogen percentiles line up with the estimated values: hydrogen_values <- bake(rec_obj, biomass_te, hydrogen) %>% bind_cols(biomass_te %>% select(original = hydrogen)) ggplot(biomass_tr, aes(x = hydrogen)) + # Plot the empirical distribution function of the # hydrogen training set values as a black line stat_ecdf() + # Overlay the estimated percentiles for the new data: geom_point(data = hydrogen_values, aes(x = original, y = hydrogen), col = "red", alpha = .5, cex = 2) + labs(x = "New Hydrogen Values", y = "Percentile Based on Training Set") These line up very nicely! Custom check operations The process here is exactly the same as steps; the internal functions have a similar naming convention: add_check() instead of add_step() check() instead of step(), and so on. It is strongly recommended that: The operations start with check_ (i.e. check_range() and check_range_new()) The check uses rlang::abort(paste0(...)) when the conditions are not met The original data are returned (unaltered) by the check when the conditions are satisfied. Other step methods There are a few other S3 methods that can be created for your step function. They are not required unless you plan on using your step in the broader tidymodels package set. A print method If you don’t add a print method for step_percentiles, it will still print but it will be printed as a list of (potentially large) objects and look a bit ugly. The recipes package contains a helper function called print_step() that should be useful in most cases. We are using it here for the custom print method for step_percentiles. It requires the original terms specification and the column names this specification is evaluated to by prep(). For the former, our step object is structured so that the list object ref_dist has the names of the selected variables: print.step_percentiles <- function(x, width = max(20, options()$width - 35), ...) { title <- "Percentile transformation on " print_step( # Names after prep: tr_obj = names(x$ref_dist), # Names before prep (could be selectors) untr_obj = x$terms, # Has it been prepped? trained = x$trained, # What does this step do? title = title, # An estimate of how many characters to print on a line: width = width ) invisible(x) } # Results before `prep()`: recipe(HHV ~ ., data = biomass_tr) %>% step_percentiles(ends_with("gen")) #> #> ── Recipe ──────────────────────────────────────────────────────────── #> #> ── Inputs #> Number of variables by role #> outcome: 1 #> predictor: 7 #> #> ── Operations #> • Percentile transformation on: ends_with("gen") # Results after `prep()`: rec_obj #> #> ── Recipe ──────────────────────────────────────────────────────────── #> #> ── Inputs #> Number of variables by role #> outcome: 1 #> predictor: 7 #> #> ── Training information #>'''
year_published = 2025
clearnet = "https://tidymodels.org/learn/develop/recipes/index.html"
