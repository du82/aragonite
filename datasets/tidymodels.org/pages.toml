title = "How to build a parsnip model – tidymodels"
description = "Create a parsnip model function from an existing model implementation."
full_description = '''Develop custom modeling toolsHow to build a parsnip model How to build a parsnip model developer tools Create a parsnip model function from an existing model implementation. Introduction To use code in this article, you will need to install the following packages: mda, modeldata, and tidymodels. The parsnip package constructs models and predictions by representing those actions in expressions. There are a few reasons for this: It eliminates a lot of duplicate code. Since the expressions are not evaluated until fitting, it eliminates many package dependencies. A parsnip model function is itself very general. For example, the logistic_reg() function itself doesn’t have any model code within it. Instead, each model function is associated with one or more computational engines. These might be different R packages or some function in another language (that can be evaluated by R). This article describes the process of creating a new model function. Before proceeding, take a minute and read our guidelines on creating modeling packages to understand the general themes and conventions that we use. An example model As an example, we’ll create a function for mixture discriminant analysis. There are a few packages that implement this but we’ll focus on mda::mda(): str(mda::mda) #> function (formula = formula(data), data = sys.frame(sys.parent()), subclasses = 3, #> sub.df = NULL, tot.df = NULL, dimension = sum(subclasses) - 1, eps = 100 * #> .Machine$double.eps, iter = 5, weights = mda.start(x, g, subclasses, #> trace, ...), method = polyreg, keep.fitted = (n * dimension < 5000), #> trace = FALSE, ...) The main hyperparameter is the number of subclasses. We’ll name our function discrim_mixture(). Aspects of models Before proceeding, it helps to to review how parsnip categorizes models: The model type is related to the structural aspect of the model. For example, the model type linear_reg() represents linear models (slopes and intercepts) that model a numeric outcome. Other model types in the package are nearest_neighbor(), decision_tree(), and so on. Within a model type is the mode, related to the modeling goal. Currently the three modes in the package are regression, classification, and censored regression. Some models have methods for multiple modes (e.g. nearest neighbors) while others have only a single mode (e.g. logistic regression). The computation engine is a combination of the estimation method and the implementation. For example, for linear regression, one engine is "lm" which uses ordinary least squares analysis via the lm() function. Another engine is "stan" which uses the Stan infrastructure to estimate parameters using Bayes rule. When adding a model into parsnip, the user has to specify which modes and engines are used. The package also enables users to add a new mode or engine to an existing model. The general process The parsnip package stores information about the models in an internal environment object. The environment can be accessed via the function get_model_env(). The package includes a variety of functions that can get or set the different aspects of the models. If you are adding a new model from your own package, you can use these functions to add new entries into the model environment. Step 1. Register the model, modes, and arguments We will add the MDA model using the model type discrim_mixture(). Since this is a classification method, we only have to register a single mode: library(tidymodels) set_new_model("discrim_mixture") set_model_mode(model = "discrim_mixture", mode = "classification") set_model_engine( "discrim_mixture", mode = "classification", eng = "mda" ) set_dependency("discrim_mixture", eng = "mda", pkg = "mda") These functions should silently finish. There is also a function that can be used to show what aspects of the model have been added to parsnip: show_model_info("discrim_mixture") #> Information for `discrim_mixture` #> modes: unknown, classification #> #> engines: #> classification: mdaNA #> #> ¹The model can use case weights. #> #> no registered arguments. #> #> no registered fit modules. #> #> no registered prediction modules. The next step is to declare the main arguments to the model. These are declared independent of the mode. To specify the argument, there are a few slots to fill in: The name that parsnip uses for the argument. In general, we try to use non-jargony names for arguments (e.g. “penalty” instead of “lambda” for regularized regression). We recommend consulting the model argument table available here to see if an existing argument name can be used before creating a new one. The argument name that is used by the underlying modeling function. A function reference for a constructor that will be used to generate tuning parameter values. This should be a character vector with a named element called fun that is the constructor function. There is an optional element pkg that can be used to call the function using its namespace. If referencing functions from the dials package, quantitative parameters can have additional arguments in the list for trans and range while qualitative parameters can pass values via this list. A logical value for whether the argument can be used to generate multiple predictions for a single R object. For example, for boosted trees, if a model is fit with 10 boosting iterations, many modeling packages allow the model object to make predictions for any iterations less than the one used to fit the model. In general this is not the case so one would use has_submodels = FALSE. For mda::mda(), the main tuning parameter is subclasses which we will rewrite as sub_classes. set_model_arg( model = "discrim_mixture", eng = "mda", parsnip = "sub_classes", original = "subclasses", func = list(pkg = "foo", fun = "bar"), has_submodel = FALSE ) show_model_info("discrim_mixture") #> Information for `discrim_mixture` #> modes: unknown, classification #> #> engines: #> classification: mdaNA #> #> ¹The model can use case weights. #> #> arguments: #> mda: #> sub_classes --> subclasses #> #> no registered fit modules. #> #> no registered prediction modules. Step 2. Create the model function This is a fairly simple function that can follow a basic template. The main arguments to our function will be: The mode. If the model can do more than one mode, you might default this to "unknown". In our case, since it is only a classification model, it makes sense to default it to that mode so that the users won’t have to specify it. The argument names (sub_classes here). These should be defaulted to NULL. A basic version of the function is: discrim_mixture <- function(mode = "classification", sub_classes = NULL) { # Check for correct mode if (mode != "classification") { rlang::abort("`mode` should be 'classification'.") } # Capture the arguments in quosures args <- list(sub_classes = rlang::enquo(sub_classes)) # Save some empty slots for future parts of the specification new_model_spec( "discrim_mixture", args = args, eng_args = NULL, mode = mode, method = NULL, engine = NULL ) } This is pretty simple since the data are not exposed to this function. Warning We strongly suggest favoring rlang::abort() and rlang::warn() (or their cli counterparts cli::cli_abort() and cli::cli_warn()) over stop() and warning(). The former return better traceback results and have safer defaults for handling call objects. Step 3. Add a fit module Now that parsnip knows about the model, mode, and engine, we can give it the information on fitting the model for our engine. The information needed to fit the model is contained in another list. The elements are: interface is a single character value that could be "formula", "data.frame", or "matrix". This defines the type of interface used by the underlying fit function (mda::mda(), in this case). This helps the translation of the data to be in an appropriate format for the that function. protect is an optional list of function arguments that should not be changeable by the user. In this case, we probably don’t want users to pass data values to these arguments (until the fit() function is called). func is the package and name of the function that will be called. If you are using a locally defined function, only fun is required. defaults is an optional list of arguments to the fit function that the user can change, but whose defaults can be set here. This isn’t needed in this case, but is described later in this document. For the first engine: set_fit( model = "discrim_mixture", eng = "mda", mode = "classification", value = list( interface = "formula", protect = c("formula", "data"), func = c(pkg = "mda", fun = "mda"), defaults = list() ) ) show_model_info("discrim_mixture") #> Information for `discrim_mixture` #> modes: unknown, classification #> #> engines: #> classification: mda #> #> ¹The model can use case weights. #> #> arguments: #> mda: #> sub_classes --> subclasses #> #> fit modules: #> engine mode #> mda classification #> #> no registered prediction modules. We also set up the information on how the predictors should be handled. These options ensure that the data that parsnip gives to the underlying model allows for a model fit that is as similar as possible to what it would have produced directly. predictor_indicators describes whether and how to create indicator/dummy variables from factor predictors. There are three options: "none" (do not expand factor predictors), "traditional" (apply the standard model.matrix() encodings), and "one_hot" (create the complete set including the baseline level for all factors). compute_intercept controls whether model.matrix() should include the intercept in its formula. This affects more than the inclusion of an intercept column. With an intercept, model.matrix() computes dummy variables for all but one factor level. Without an intercept, model.matrix() computes a full set of indicators for the first factor variable, but an incomplete set for the remainder. remove_intercept removes the intercept column after model.matrix() is finished. This can be useful if the model function (e.g. lm()) automatically generates an intercept. allow_sparse_x specifies whether the model can accommodate a sparse representation for predictors during fitting and tuning. set_encoding( model = "discrim_mixture", eng = "mda", mode = "classification", options = list( predictor_indicators = "traditional", compute_intercept = TRUE, remove_intercept = TRUE, allow_sparse_x = FALSE ) ) Step 4. Add modules for prediction Similar to the fitting module, we specify the code for making different types of predictions. To make hard class predictions, the class_info object below contains the details. The elements of the list are: pre and post are optional functions that can preprocess the data being fed to the prediction code and to postprocess the raw output of the predictions. These won’t be needed for this example, but a section below has examples of how these can be used when the model code is not easy to use. If the data being predicted has a simple type requirement, you can avoid using a pre function with the args below. func is the prediction function (in the same format as above). In many cases, packages have a predict method for their model’s class but this is typically not exported. In this case (and the example below), it is simple enough to make a generic call to predict() with no associated package. args is a list of arguments to pass to the prediction function. These will most likely be wrapped in rlang::expr() so that they are not evaluated when defining the method. For mda, the code would be predict(object, newdata, type = "class"). What is actually given to the function is the parsnip model fit object, which includes a sub-object called fit that houses the mda model object. If the data need to be a matrix or data frame, you could also use newdata = rlang::expr(as.data.frame(newdata)) or similar. The parsnip prediction code will expect the result to be an unnamed character string or factor. This will be coerced to a factor with the same levels as the original data. To add this method to the model environment, a similar set function, set_pred(), is used: class_info <- list( pre = NULL, post = NULL, func = c(fun = "predict"), args = # These lists should be of the form: # {predict.mda argument name} = {values provided from parsnip objects} list( # We don't want the first two arguments evaluated right now # since they don't exist yet. `type` is a simple object that # doesn't need to have its evaluation deferred. object = rlang::expr(object$fit), newdata = rlang::expr(new_data), type = "class" ) ) set_pred( model = "discrim_mixture", eng = "mda", mode = "classification", type = "class", value = class_info ) A similar call can be used to define the class probability module (if they can be computed). The format is identical to the class module but the output is expected to be a tibble with columns for each factor level. As an example of the post function, the data frame created by mda:::predict.mda() will be converted to a tibble. The arguments are x (the raw results coming from the predict method) and object (the parsnip model fit object). The latter has a sub-object called lvl which is a character string of the outcome’s factor levels (if any). We register the probability module. There is a template function that makes it slightly easier to format the objects: prob_info <- pred_value_template( post = function(x, object) { tibble::as_tibble(x) }, func = c(fun = "predict"), # Now everything else is put into the `args` slot object = rlang::expr(object$fit), newdata = rlang::expr(new_data), type = "posterior" ) set_pred( model = "discrim_mixture", eng = "mda", mode = "classification", type = "prob", value = prob_info ) show_model_info("discrim_mixture") #> Information for `discrim_mixture` #> modes: unknown, classification #> #> engines: #> classification: mda #> #> ¹The model can use case weights. #> #> arguments: #> mda: #> sub_classes --> subclasses #> #> fit modules: #> engine mode #> mda classification #> #> prediction modules: #> mode engine methods #> classification mda class, prob If this model could be used for regression situations, we could also add a numeric module. For these predictions, the model requires an unnamed numeric vector output. Examples are here and here. Does it work? As a developer, one thing that may come in handy is the translate() function. This will tell you what the model’s eventual syntax will be. For example: discrim_mixture(sub_classes = 2) %>% translate(engine = "mda") #> discrim mixture Model Specification (classification) #> #> Main Arguments: #> sub_classes = 2 #> #> Computational engine: mda #> #> Model fit template: #> mda::mda(formula = missing_arg(), data = missing_arg(), subclasses = 2) Let’s try it on a data set from the modeldata package: data("two_class_dat", package = "modeldata") set.seed(4622) example_split <- initial_split(two_class_dat, prop = 0.99) example_train <- training(example_sp'''
