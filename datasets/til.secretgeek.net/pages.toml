full_description = '''Today I Learned This is a place where I store short descriptions of things I learn each day. —Leon Bambrick. Available online: TIL.secretGeek.net HTML Source repo Markdown Source repo This site is generated with clowncar🤡🚗, with markdown conversion by markdig Guidelines Each page of this site should be a factoid that you expect to refer to again. Hence, any factoid that is merely "Well that's interesting!" but would never be referenced again is "trivia" and NOT wanted here. So they mostly end up being technical things (though the concepts and reading notes categories are an exception). The folder structure means things are categorised by ONE main topic, not tagged with endless topics/subtopics. Inspired by Josh Branchaud's til — and this Hacker news thread thoughtbot inc.'s til Jake Worth's til See also wiki.secretGeek.net — Wiki of things I find fascinating, fractals, recursion etc. secretGeek.net — my blog List of Second Brains — Kasper Zutterman's curated list of somewhat similar sites. Digital Garden Directory — via Maggie Appleton Oh and I wrote this Though this site is published as a free digital-only book, I've also published a real book to help product creators. Choose Your First Product helps creators find a suitable idea for their first digital product. If you want to build products, please learn more at Your First Product. Thank you. Topics Topic # Articles .net 12 articles .net core MVC 16 articles 7z 2 articles active directory 3 articles airtable 1 article android 1 article angular 1 article appharbor 1 article asp.net mvc 15 articles azure 1 article azure devops 4 articles banking 1 article bookmarklets 1 article bower 2 articles chat-gpt 2 articles chocolatey 8 articles concepts 20 articles console 5 articles cpu analyzer 1 article crypto 1 article csharp 8 articles css 12 articles csv 3 articles cypress 2 articles d3 1 article design 2 articles digital gardens 1 article docker 6 articles domains 1 article edge 1 article educati