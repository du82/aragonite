title = "greatest books in psychology . Today I Learned (secretGeek)"
full_description = '''"50 Psychology Classics: the Greatest Books in Psychology" I listened to the audiobook of "50 Psychology Classics" by Tom Butler-Bowdon. It's quite detailed and does a good job distilling so much information down. Here's a list of the books in chronological order, (though in the book they are ordered alphabetical by author's surname. I'd prefer chronological ascending as earlier books tend to influence later and seldom vice versa) Year Author Title 1890 William James Principles of Psychology 1901 Sigmund Freud The Interpretation of Dreams 1927 Alfred Adler Understanding Human Nature 1927 IP Pavlov Conditioned Reflexes 1936 Anna Freud The Ego and the Mechanisms of Defense 1945 Karen Horney Our Inner Conflicts 1947 Hans Eysenck Dimensions of Personality 1951 Eric Hoffer The True Believer: Thoughts on the Nature of Mass Movements 1951 Fritz Perls Gestalt Therapy: Excitement and Growth in the Human Personality 1953 Carl Jung The Archetypes and the Collective Unconscious 1953 Alfred Kinsey Sexual Behavior in the Human Female 1953 BF Skinner Beyond Freedom & Dignity 1954 Gordon Allport The Nature of Prejudice 1958 Eric Erikson Young Man Luther 1958 Harry Harlow The Nature of Love 1959 RD Laing The Divided Self 1961 Albert Ellis & Robert Harper A Guide To Rational Living 1961 Carl Rogers On Becoming a Person 1964 Eric Berne Games People Play 1966 Jean Piaget The Language and Thought of the Child 1967 Thomas A Harris I'm OK - You're OK 1969 Viktor Frankl The Will to Meaning 1970 Abraham Maslow The Farther Reaches of Human Nature 1970 Oliver Sacks The Man Who Mistook His Wife for a Hat 1974 Stanley Milgram Obedience To Authority 1980 Isabel Briggs-Myers Gifts Differing: Understanding Personality Type 1980 David D Burns Feeling Good: The New Mood Therapy 1982 Milton Erickson My Voice Will Go With You 1983 Howard Gardner Frames of Mind: The Theory of Multiple Intelligences 1984 Robert Cialdini Influence: The Psychology of Persuasion 1990 William Styron Darkness Visible 1997 Albert Bandura Self-Efficacy: The Exercise of Control 1997 Gavin Becker The Gift of Fear 1997 Mihaly Csikszentmihalyi Creativity 1998 Daniel Goleman Emotional Intelligence at Work 1998 VS Ramachandran Phantoms in the Brain 1999 John M Gottman The Seven Principles For Making Marriage Work 2000 Douglas Stone, Bruce Patton & Sheila Heen Difficult Conversations 2002 Steven Pinker The Blank Slate: The Modern Denial of Human Nature 2002 Martin Seligman Authentic Happiness 2004 Barry Schwartz The Paradox of Choice: Why More is Less 2005 Malcolm Gladwell Blink: The Power of Thinking Without Thinking 2006 Louann Brizendine The Female Brain 2006 Carol Dweck Mindset: The New Psychology of Success 2006 Daniel Gilbert Stumbling on Happiness 2011 Daniel Kahneman Thinking, Fast and Slow 2012 Susan Cain Quiet: The Power of Introverts in a World That Can't Stop Talking 2012 Leonard Mlodinow Subliminal: How Your Unconscious Mind Rules Your Behavior 2013 Temple Grandin The Autistic Brain: Helping Different Kinds of Minds Succeed 2014 Walter Mischel The Marshmallow Test Sources 50 Psychology Classics'''
