["https://tildeverse.org"]
title = "tildeverse"
full_description = "we're a loose association of like-minded tilde communities. if you're interested in learning about *nix (linux, unix, bsd, etc) come check out our member tildes and sign up! member status in the tildeverse mainly involves some level of engagement or presence on irc; all other systems are independent. stop by our irc network (or use our web client) and hang out. there's a bot that can toot from this mastodon account, but it's mostly silly quotes from chat. there's also a wiki that documents a bunch of things in and outside the tildeverse. anyone with an account on a recognized tilde can make an account, so feel free to help out once in a while. folding@home team: let's show what the tildeverse can do! - https://stats.foldingathome.org/team/242169 A roguelike adventure through dungeons filled with dangerous monsters in a quest to find the mystifyingly fabulous Orb of Zot. - https://crawl.tildeverse.org"
