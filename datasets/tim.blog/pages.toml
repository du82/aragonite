r just a sideshow? [1:20:17] Wealth and resources. [1:25:30] Recommended thinkers. [1:28:05] Taking Children Seriously, ToKCast, Critical Rationalists, and Popper 101. [1:31:55] David’s most interesting problems right now. [1:39:24] Parting thoughts. MORE DAVID DEUTSCH QUOTES FROM THE INTERVIEW “In many ways, our institutions are wiser than we are. “— David Deutsch “AI [artificial intelligence] has nothing to do with AGI [artificial general intelligence]. It’s a completely different technology, and it is in many ways the opposite of AGI … An AGI can do anything, whereas an AI can only do the narrow thing that it’s supposed to do.”— David Deutsch “Even the most careful scientific observation is all theory-laden, and theories are inherently fallible.”— David Deutsch “Good explanations begin with bad explanations. And you get there—between the bad explanation and the good explanation—by criticism, by conjecturing variance of the story, and then criticizing both them and the original story, and then choosing '
