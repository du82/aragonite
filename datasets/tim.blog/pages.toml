description = "The Tim Ferriss Show is often the #1 business podcast on all of Apple Podcasts, and it's been ranked #1 out of 500,000+ podcasts on many occasions. Past guests include Arnold Schwarzenegger, LeBron James, Ray Dalio, Doris Kearns Goodwin, Edward Norton, Tony Robbins, Maria Sharapova, Jamie Foxx, Maria Popova, Peter Thiel, Marc Andreessen, Amanda Palmer, Malcolm Gladwell, Vince Vaughn, Rick Rubin, Reid Hoffman, Jon Favreau, Whitney Cummings, Mike Shinoda, and 300+ more."
full_description = "Podcast — The Tim Ferriss Show To find any guest’s episode, please type their name in the search bar below, then click Enter/Return. If you prefer, you can find all episodes of the podcast here. You can subscribe for free on Apple Podcasts, Spotify, or wherever you listen to podcasts. Click Here to See All Episodes About The Tim Ferriss Show The Tim Ferriss Show is often the #1 business podcast on all of Apple Podcasts, and it’s been ranked #1 out of 500,000+ podcasts on many occasions. It is the first business/interview podcast to pass 100,000,000 downloads, it has been selected as “Best of” Apple Podcasts for three years running, and readers of Fortune Magazine‘s Term Sheet recently selected The Tim Ferriss Show as their top business podcast. It has now surpassed one billion downloads. Past guests include Hugh Jackman, Dr. Jane Goodall, Jerry Seinfeld, Arnold Schwarzenegger, Madeleine Albright, LeBron James, Margaret Atwood, Elizabeth Gilbert, Mark Zuckerberg, Ray Dalio, Michael Lewis, Doris Kearns Goodwin, Jocko Willink, Bill Burr, Kevin Hart, Edward Norton, Tony Robbins, Maria Sharapova, Jamie Foxx, Maria Popova, Peter Thiel, Marc Andreessen, Dr. Peter Attia, Malcolm Gladwell, Vince Vaughn, Terry Crews, Rick Rubin, Reid Hoffman, Brené Brown, Dr. Gabor Maté, Naval Ravikant, Anne Lamott, Matthew McConaughey, Sarah Silverman, Dr. Andrew Huberman, and 700+ more. Each episode, I deconstruct world-class performers from eclectic areas (investing, sports, business, art, etc.) to extract the tactics, tools, and routines you can use. This includes favorite books, morning routines, exercise habits, time-management tricks, and much more. Aside from promo impact (often bigger than full-page NYT, WSJ, or Esquire coverage, or primetime CNN), guests enjoy the show because it’s friendly, long-form, and they have final cut before audio is published. This leads to extremely open, raw interviews and — paradoxically — fewer edits. Here is a good overview from The Observer: “How Tim Ferriss Became The ‘Oprah of Audio’“ Every single time I talk to Tim, I enjoy it and he finds a way to get me to come up with 5 new quotes for people to put on posters. Listen to our conversation! https://t.co/gNid5DxDXU— Arnold (@Schwarzenegger) October 3, 2023 Thanks so much Tim for taking the time to talk to me! Possibly the best interview experience I've ever had.— Brandon Sanderson (@BrandSanderson) February 5, 2025 Salon has included the podcast in their list of “suggestions to make you remember the world can be a good place.” It’s about positive tactics you can use, not “gotchas” or other B.S.. The Internet has enough of that, and I wanted to do something to reverse the trend. You can subscribe on Apple Podcasts, Spotify, RSS feed, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or wherever you listen to podcasts. DISCLAIMER: The people interviewed are well-trained experts and highly skilled in their areas of practice. They take many safety precautions prior to attempting the activities described. The activities or research discussed in these podcasts should not be attempted without qualified supervision and training with professionals. Subscribe to the Podcast Listen on Apple Podcasts Listen on Spotify Listen onOvercast Sponsorship and Advertising If you are interested in sponsoring the podcast, please fill out the Sponsor Interest Form, which we review 1-2 times per month. Show Notes, Links, Transcripts, and Resources for All Episodes Below are the most recent episodes! Click on the title to find all the associated show notes and resources. You can also click here to see the list of all available transcripts of past episodes on the podcast. All Episodes (From Newest to Oldest) Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory (#797) L.A. Paul — On Becoming a Vampire, Whether or Not to Have Kids, Getting Incredible Mentorship for $250, Transformative Experiences, and More (#796) The 4-Hour Workweek Revisited — The End of Time Management (#795) Brandon Sanderson on Building a Fiction Empire, Creating $40M+ Kickstarter Campaigns, Unbreakable Habits, The Art of World-Building, and The Science of Magic Systems (#794) Seth Godin on Playing the Right Game and Strategy as a Superpower (#792) Chris Sacca — How to Succeed by Living on Your Own Terms and Getting into Good Trouble (#790) Naval Ravikant and Aaron Stupple — How to Raise a Sovereign Child, A Freedom-Maximizing Approach to Parenting (#788) Tactics and Strategies for a 2025 Reboot — Essentialism and Greg McKeown (#786) The Random Show — 2025 Predictions (AI, Aliens, BTC, and More), New Year’s Resolutions and Strategies, Smart Fitness, The Spinal Engine, New Apps, and Much More (#785) Dr. Becky Kennedy — Parenting Strategies for Raising Resilient Kids, Plus Word-for-Word Scripts for Repairing Relationships, Setting Boundaries, and More (#784) Load more podcasts Loading podcasts..."
