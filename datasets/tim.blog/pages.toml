["https://tim.blog/2015/08/07/5-bullet-friday"]
title = '''"5-Bullet Friday" — 5 Things I've Been Loving, Using, and Reading - The Blog of Author Tim Ferriss'''
description = '''Greetings, friends. Here are some popular links, thoughts, and articles that have appeared in my “5-Bullet Friday” e-mail newsletter, which is free and goes out every Friday.  I cheated in this post and gave you six. Enjoy! Article I’m enjoying (and pondering) — How Bold Entrepreneurs Are Breaking $1 Million In One-Person Businesses by Elaine Pofeldt for … Continue reading ""5-Bullet Friday" — 5 Things I've Been Loving, Using, and Reading"'''
full_description = '''Posted on August 7, 2015August 13, 2021 by Tim Ferriss"5-Bullet Friday" — 5 Things I've Been Loving, Using, and Reading 496 Comments Topics: CategoriesUncategorizedShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" class="size-full wp-image-16200" src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/tf_cowboy.png?resize=297%2C300&#038;ssl=1" alt="Absolutely the best for flying. But which one? The booze, hat, or weird footwear?" width="297" height="300" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/tf_cowboy.png?w=297&amp;ssl=1 297w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/tf_cowboy.png?resize=100%2C100&amp;ssl=1 100w" sizes="(max-width: 297px) 100vw, 297px" />Absolutely the best for flying. But which one? The booze, hat, squat, or weird footwear? Greetings, friends. Here are some popular links, thoughts, and articles that have appeared in my “5-Bullet Friday” e-mail newsletter, which is free and goes out every Friday. I cheated in this post and gave you six. Enjoy! Article I’m enjoying (and pondering) — How Bold Entrepreneurs Are Breaking $1 Million In One-Person Businesses by Elaine Pofeldt for Forbes.com Clothing I’m loving — Check out Myles’ “everyday shorts.” I originally got these as a gift from Huckberry, and they are now my go-to shorts for nearly everything. I swim in them (quick drying), I wear them while working at coffee shops, and you can even wear them to a nice dinner if you have decent shoes. Multi-purpose rocks. My most popular Facebook post recently — Japan’s Michael Jordan of Day Trading. His “one rule” is quite smart, methinks… A quote that’s on my mind — “People think focus means saying yes to the thing you’ve got to focus on. But that’s not what it means at all. It means saying no to the hundred other good ideas that there are. You have to pick carefully. I’m actually as proud of the things we haven’t done as the things I have done. Innovation is saying no to 1,000 things.” – Steve Jobs Responses I’ll be practicing (yet again) next week — How to graciously say no to anyone by Austin Kleon. This is worth revisiting constantly. New footwear, long overdue — I’ve needed Adidas slip-ons for years. No idea why it took me so long to get them. They’re perfect as indoor Japanese-style slippers, or for wearing outside when you don’t want flip-flops killing your toe webbing. I’m typing this on an airplane, where I’m wearing them with socks. #GermanStyle Would you like to get a very short (five-bullet) e-mail from me every Friday with the five coolest things I’ve found that week? It might include books, gadgets, albums, articles, new hacks/tricks, and — of course — all sorts of weird stuff I dig up around the world. These “5-Bullet Friday” emails are only available if you subscribe to my e-mail newsletter. They will not be on the blog or anywhere else. This post is just a teaser to entice you to sign up. Try it out for a week! Unsubscribing is easy, and there’s great stuff coming next Friday. Just submit your email address in the opt-in below (or here) and you’re set. Sign Up For 5-Bullet Friday P.S. If you haven’t seen this short commencement speech, you’re in for a treat. Perfect weekend viewing. Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesUncategorizedTags: Tags5-bullet, 5-bullet Friday, bullet, five, five bullet friday, five-bullet, friday, fridays, tim ferris newsletter, tim ferriss newsletter'''
