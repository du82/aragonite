e?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. QUESTION(S) OF THE DAY: What do you still want to know about investing, whether in startups or elsewhere? Or: What was your favorite takeaway from Naval? Please let me know in the comments. Scroll below for links and show notes… Enjoy! Selected Links from the Episode The Book of Life: Daily Meditations with Krishnamurti by Jiddu Krishnamurti Love Yourself Like Your Life Depends On It by Kamal Ravikant Lying by Sam Harris Surely You Must Be Joking Mr. Feynman by Richard Feynman Meditations by Marcus Aurelius Striking Thoughts by Bruce Lee The Origin of Species by Charles Darwin Read the Melting Asphalt blog Read the Dilbert blog, specifically, The Day You Became a Better Writer Siddhartha by Hermann Hesse The Power of Habit by Charles Duhigg Go on a meditation retreat with noetic.org Don’t Shoot the Dog! by Karen Pryor Sapiens by Yuval Noah Harari The Rational Optimist by Matt Ridley Poor Charlie’s Almanac by Charlie Munger Illusions by Richard Bach The Origins of Virtue by Matt Ridley Influence by Robert Cialdini Snow Crash by Neal Stephenson The Name of the Wind by Patrick Rothfuss The Lies of Locke Lamora by Scott Lynch Zorba the Greek by 