value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Momentous high-quality supplements! Momentous offers high-quality supplements and products across a broad spectrum of categories, and I’ve been testing their products for months now. I’ve been using their magnesium threonate, apigenin, and L-theanine daily, all of which have helped me improve the onset, quality, and duration of my sleep. I’ve also been using Momentous creatine, and while it certainly helps physical performance, including poundage or wattage in sports, I use it primarily for mental performance (short-term memory, etc.). Their products are third-party tested (Informed-Sport and/or NSF certified), so you can trust that what is on the label is in the bottle and nothing else. If you want to try Momentous for yourself, you can use code Tim for 20% off your one-time purchase at LiveMomentous.com/Tim. And not to worry, my non-US friends, Momentous ships internationally and has you covered. Want to hear the last time Derek was on the show? Listen to our conversation here, in which we discuss the benefits of an unoptimized life, finding and asking mentors for help, the wisdom of quitting when you’re ahead, how to teach an 11-year-old to act like a 16-year-old, the problem with moral relativism and other -isms, securing tech independence, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Derek Sivers: Website | Podcast | Twitter | YouTube Useful Not True: Whatever Works for You by Derek Sivers How to Live: 27 Conflicting Answers and One Weird Conclusion by Derek Sivers Hell Yeah or No: What’s Worth Doing by Derek Sivers Your Music and People: Creative and Considerate Fame by Derek Sivers Anything You Want: 40 Lessons for a New Kind of Entrepreneur by Derek Sivers Derek Sivers — The Joys of an Un-Opti