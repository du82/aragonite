es in Lucid Dreaming, The One Clock to Rule Them All, The IP Addresses of Your Memories, and More | The Tim Ferriss Show #654 Sugar: Does it Really Cause Hyperactivity? | EatRight.org Oreo Chocolate Sandwich Cookies | Amazon Inside TikTok’s Dangerously Addictive Algorithm | Online Journalism Awards Pavlov’s Dog Experiment: For Whom the Bell Tolls | United 4 Social Change Rick Rubin: “I Have No Technical Ability. And I Know Nothing About Music.” | 60 Minutes Cocolemon — We Are Lemon! | YouTube CoComelon — Nursery Rhymes | YouTube Elon Musk Streams His ”Totally Not Boosted” ‘Path of Exile 2’ Character, Proves He Has No Idea What He’s Doing | Vice Sudden Infant Death Syndrome (SIDS) Symptoms and Causes | Mayo Clinic Breastfeeding vs. Formula Feeding Information | Mount Sinai Is the Food Pyramid Obsolete? | NPR Herd Immunity and COVID-19: What You Need to Know | Mayo Clinic New Pentagon Report on Ufos Includes Hundreds of New Incidents but No Evidence of Aliens | AP News SHOW NOTES [00:08:40] Who is Aaron, and what makes him qualified to dispense parenting advice? [00:13:44] Taking Children Seriously (TCS) and The Sovereign Child philosophies. [00:17:49] The David Deutsch influence on these tenets. [00:22:57] Supporting evidence and long-term case studies. [00:27:17] Ways Naval and Aaron have incorporated these philosophies into their own parenting. [00:31:13] How rules work while parenting for freedom-maximizing. [00:37:42] Why building knowledge beats coercion. [00:43:41] Non-negotiables. [00:46:35] Is this method of parenting only accessible to the educated elite? [00:50:05] Handling sibling conflict. [00:54:41] How do freedom-maximized kids adapt to an adulthood of endless societal rules? [00:58:55] When kids present counter-accountability. [01:00:41] One tool does not fix all. [01:03:52] Putting mistakes to good use. [01:08:00] Homeschooling, unschooling, and socialization challenges. [01:15:56] Building resilience. [01:20:23] Coping with food and drink cravings. [01:25:54] Avoiding the terminology of confirmation bias. [01:31:37] Sports. [01:35:09] Organically cultivating interests. [01:38:11] The pros and cons of traditional schooling. [01:47:24] Parental disagreements and avoiding hypocrisy. [01:57:18] Four categories of harm that come from rules. [02:00:38] The benefits of optional constraints. [02:05:32] Body Electric. [02:07:03] Things you should know before visiting the emergency room. [02:13:18] A hierarchy of knowledge and lessons learned from this conversation. [02:17:19] Tactics for addressing sibling (and spousal) conflict. [02:19:47] Tactics to foster learning. [02:22:54] The best baby (and adult) sitter. [02:26:07] Parenting into the teen years. [02:27:54] Tactics for forming good sleep habits. [02:31:20] Tactics for encouraging good eating habits. [02:37:34] Tactics for freedom-maximizing. [02:42:56] Tactics for minimizing screen and social media obsession. [02:55:29] Too cool for rules. [03:00:14] All information is subject to challenge. [03:03:10] Happiness and creativity cannot be forced. MORE AARON STUPPLE QUOTES FROM THE INTERVIEW “I think rules give kids a reason to present a false persona to their parents. … It’s a disaster for their own self-confidence. I think it’s a disaster for the parents because kids are entering into this kind of dark contraband world where they’re keeping their parents in the dark.”— Aaron Stupple “I want to preserve interests. A kid that’s interested in something—that is absolutely precious, and I want to cultivate that. I want to pour fuel on that fire.”— Aaron Stupple “Once a problem gets solved to the kid’s own understanding, it’s solved for the rest of their life.”— Aaron Stupple “Resilience comes from passion. It comes from an interest. When someone is just absolutely obsessed with some problem, they have the fortitude, the stick-to-it-iveness. Nothing approaches the stick-to-it-iveness of somebody who is just hell-bent on achieving something, building something, creating something.”— Aaron Stupple “The typical way of looking at parenting is the question of what do you allow and what do you disallow? … What my wife and I do is we step away from that question altogether and instead view problems as they arise and try to find solutions to those problems rather than appealing to rules.”— Aaron Stupple “Every time you force your child to do something, you inevitably set yourself up as an adversary to your kid. … If broccoli is really important, then it’s really important that broccoli is not confused by what your [parental] expectations are.”— Aaron Stupple “I think there’s a huge middle ground to relaxing rules. And one easy thing people can do right now is just say that instead of enforcing a rule, we think about it for 60 seconds. Just spend 60 seconds and think ‘Is there some solution to this that gets around this problem?'”— Aaron Stupple PEOPLE MENTIONED Dr. Becky Kennedy David Deutsch Karl Popper Sarah Fitz-Claridge Molly Ferriss Bryan Johnson Jordan Peterson Isaac Newton '''
