description = 'Please enjoy this transcript of my interview with Dr. Keith Baar, a professor at the University of California, Davis, in the Department of Physiology and Membrane Biology. During his PhD studies, his research revealed that mechanical strain on muscle fibers activates the mammalian target of rapamycin (mTOR) signaling pathway, a crucial regulator of muscular hypertrophy.  … Continue reading "The Tim Ferriss Show Transcripts: Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory (#797)"'
full_description = 'Posted on February 27, 2025February 27, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory (#797) Leave a comment Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with Dr. Keith Baar, a professor at the University of California, Davis, in the Department of Physiology and Membrane Biology.During his PhD studies, his research revealed that mechanical strain on muscle fibers activates the mammalian target of rapamycin (mTOR) signaling pathway, a crucial regulator of muscular hypertrophy. Subsequently, he studied the molecular dynamics of skeletal muscle adaptation to endurance training under the guidance of Dr. John Holloszy, a legend in the field of exercise physiology, considered the father of modern exercise biochemistry. Building on all of this experience, he conducted research into tendon health and the potential for engineering ligaments, which could have implications for treatment and recovery from injuries. Dr. Baar now runs the Functional Molecular Biology Lab at UC Davis. His lab’s work ranges from studying molecular changes in our cells to conducting studies to effect real-world improvements in people’s health, longevity, and quality of life. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/d7be84b6-bee9-4ffe-82a2-be20d9a3a52c/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: All right. Let’s start off, Keith, just by saying thank you for the time. Dr. Keith Baar: Thank you. This is going to be great. This should be really fun. Tim Ferriss: It should be a good time. I have a lot of questions, and the start time for this was delayed because I was getting focused shockwave treatments with a doctor who I think is very credible. And that is why we’re starting late which segues very nicely into our conversation. I wanted to give the genesis story because I came across your work for the first time, shockingly. It’s astonishing to me I didn’t come across you earlier because I put a tweet online, not sure what the noun is for something like that on X at this point, asking about remedies related to tennis elbow specifically and it was within the context of rock climbing. And someone put up a video from YouTube by Emil Abrahamsson, I’m probably pronouncing that incorrectly, who is a high-level climber, great YouTube creator and teacher who put up a video called something like, “Doing hangboard training twice a day for 30 days.” And that is where he referenced the study of yours or it may have been a review, I’m not sure exactly, but “Minimizing Injury and Maximizing Return to Play: Lessons from Engineered Ligaments.” And I just want to give people the punchline to this and then I’ll shut up and let the expert talk. He is a high-level climber. He climbs V15s bouldering. He is incredibly good. And after 30 days of doing 10 minutes a day roughly of hangboard, not even full hangs, let’s just say 70 percent body weight, so his feet are on the floor kind of like a nice stretch for 10 seconds on, 50 seconds off so 100 seconds of tension per session he, I think, added 60 percent weight to his maximum hangs, so this is weight attached around the waist. He went from something like a .5 second one-handed hang on a tiny little ledge, I’m not using technical climbing language here, to 13 seconds, and so on and so forth. And it just blew his mind completely. So let’s just start with asking, what is happening here? What are the adaptations that are allowing something like that to happen? And then we’ll kick off from there. Dr. Keith Baar: Absolutely. So it’s a great place to start because we think it actually shows something fundamental about strength, because I’m in our strength physiology facility here and we normally think of strength as, yeah, we’re going to lift weights, we’re going to do something really, really heavy. And because that’s going to make us stronger we know that when we lift heavy weights, we get stronger. And the reality is that there are especially certain athletes like climbers where they’re doing all kinds of heavy lifts, they’re doing all kinds of heavy work, they’re doing all kinds of really dynamic moves. And what happens, what breaks down is they break down in their finger tendons and they break down in the little pulleys within the tendons. And we had come to this because for years I had been working on how to make muscles bigger and stronger and I always said okay, bigger and stronger because the definition in my old textbooks would say that the strength of a muscle is related to the cross-sectional area, it’s proportional of the cross-sectional muscle. And so I was like, “Okay, to get stronger, you need to be bigger.” So I actually was really fortunate to be part of the team where we discovered that the small molecule in our cells that actually allows our cells to get bigger when we do resistance exercise. Tim Ferriss: What is the name of that, just in brief? Dr. Keith Baar: Yeah, so it’s mTOR. So it’s mTORC1. It’s the mechanistic target of rapamycin. And so I had been doing this. I had a new laboratory. My first laboratory was in Scotland and I was invited down by the English Institute of Sport to come to their cycling center and they were like, “Okay, this is great. We have these incredible athletes who are winning all kinds of gold medals and we wanted to get stronger.” And so I go in there with my spiel about bigger muscles and all of this, and they’re like, “Yeah, but we’ve got to carry that muscle mass. And I’ve got five years of data that shows me I’m getting these athletes stronger without making them any bigger and in many cases making them smaller.” And I’m like, “Oh, well, so much for all the science that I’ve been doing for a long time.” But then I had to figure out, okay, so how is this working? How am I getting or how are they getting people who are stronger without them getting bigger? And so what it came down to is if we have the little motors in our muscles that are going to produce the force, what we then have to do is we have to transmit that force, and that force has to be transmitted from our muscle where we’re producing it to our bone, where the movement is going to occur. And that’s going to go through tendons, it’s going to go through connective tissue, it’s going to go through all of these proteins that we call, colloquially, force transfer proteins. And so that was the first thing that we were thinking of. And then what we were doing is we would make these little engineered ligaments. And so the goal at the beginning is, “Hey, I’m going to make ligaments. You’re going to rupture your ACL, you’re going to send me a sample that will take in the doctor’s office. I’m going to isolate the cells. I’m going to make you an ACL in the dish in my laboratory. I’m going to send it back to you so that you don’t have to take your hamstring or the middle of third of your patella and we can replace that ruptured ACL.” So that’s the idea, but we have to get them stronger. So we started looking at, okay, we know exercise makes these tendons stronger, but what about the exercise? And what we found is it didn’t matter whether we stretched them 20 percent or five percent or two percent, the signals to get bigger and stronger were the same. But then we started doing for different timelines and the signal would go up and then it would go away really quickly. And so the way that I explain it now is that your tendon ligament to your bone, all of your connective tissue cells are a lot like my 17-year-old daughter. She’s going to listen to me for maybe five minutes, maybe 10 minutes, and then she’s going to just tune me out. So I need to get all the information in that five to 10 minutes. So if you’re going to go and you’re going to climb, for example, like Emil would do all the time, he’s going to spend three, four or five hours at the wall doing different things. The tendons stopped getting the signal to adapt at 10 minutes. Everything on top of that was just wear and tear that could slightly cause problems. And so what that meant to us is that there’s this minimal effective dose. So if I give you 10 minutes of loading that is optimized for those connective tissues, whether it’s tendon, ligament, cartilage or bone, I can get you to get all of the signal from that whole exercise in 10 minutes. And so that was the first part. The second part was how long does it take before I can get more signal to go through that system? Think of it like your toilet. I flush my toilet, it’s going to flush, but when my daughter was younger, she would, “Oh, that was fun. Let me do that again.” It wouldn’t flush for a while. She needed to let the bowl refill, let the tank refill so that I can flush it. So that’s called the refractory period. How long do I have to wait before that next session? And what we found is about six to eight hours later, and amazingly that was almost exactly the same thing that other researchers had found for bone, that as little as few as 40 stimuli with eight hours of rest was maximal for bone we found that 10 minutes of activity, whether you did walking or running or just holds 10 minutes worth, so 10 seconds on 50 seconds off, 100 seconds total over that 10 minutes, that’s all the signal your cells need. You wait eight hours, you could do it again. And so Emil’s brother had lots of injuries, so he did it twice a day and he got his hands are healthy now he can climb again. Emil, because he’s a huge strong boulder who does these dynamic loads, he had a really big effect of doing those isometric holds because he was getting all of the stimulus to make the muscle stronger, the brain power to stimulate the right muscles to have him to be able to contract that. What he was missing was he was getting too much wear and tear on the tendons, on the force transfer stuff. So when we just got him to do those 10 minute sessions, his forced transfer capacity went way up and now his grip strength went way up. And one of the best videos that he has is he becomes a competitor in the world’s strongest grip competition. And so these guys are — Tim Ferriss: That’s an amazing video. It’s so good. Dr. Keith Baar: — twice his size and he’s grabbing all these things about the same as the people who are twice his size. And it’s awesome because Emil’s smaller than me, he’s a great guy. But it’s like, okay, so you’re getting to the point where you have some of the strongest grip in the world and all you’re doing is these little things. You’re doing your dynamic climbing and you’re combining that with these isometric holds. And so what we’re improving is those that ability to transmit the force between the muscle that’s making it and the bone that’s trying to help us do the movement. Tim Ferriss: Okay. Let me dive into a few aspects of that with clarifying questions just so we can keep folks who need Scooby Snacks engaged with just some prescriptive stuff. But before I get to that, let me just ask you, and we can come back to this because I am sure it’s a large topic we could uncork. But in 2016 I interviewed David Sabatini on mTOR and then Navdeep Chandel on metformin, and we did it in Easter Island — or on Easter Island, so Rapa Nui after which rapamycin is named, and we had a great conversation. And you mentioned earlier, I suppose, and correct me if I’m getting this wrong, but the mTORC1 pathway is being key for resistance, exercise induced hypertrophy muscle growth. Does that mean now that taking something that has maybe more of a systemic effect like rapamycin a lot of people in Silicon Valley and elsewhere take rapamycin hoped for longevity purposes since they’ve seen that demonstrated in some species, are you making sacrifices on the hypertrophy side hypothetically or do you expect not much of an interference there? Dr. Keith Baar: So the short answer is that at the doses that they’re taking for longevity, you have a minimal effect on the adaptation of skeletal muscle, but you’re still going to have a somewhat negative eff'
