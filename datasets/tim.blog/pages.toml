title = "The Tim Ferriss Show Transcripts: Naval Ravikant and Aaron Stupple — How to Raise a Sovereign Child, A Freedom-Maximizing Approach to Parenting (#788) - The Blog of Author Tim Ferriss"
description = 'Please enjoy this transcript of my parenting conversation with Aaron Stupple and Naval Ravikant. Aaron Stupple (@astupple) is a board-certified internal medicine physician. He focuses on reviving the non-coercive parenting movement derived from the philosophy of Popper and Deutsch called Taking Children Seriously. His book, The Sovereign Child: How a Forgotten Philosophy Can Liberate Kids … Continue reading "The Tim Ferriss Show Transcripts: Naval Ravikant and Aaron Stupple — How to Raise a Sovereign Child, A Freedom-Maximizing Approach to Parenting (#788)"'
full_description = 'Posted on January 20, 2025January 20, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: Naval Ravikant and Aaron Stupple — How to Raise a Sovereign Child, A Freedom-Maximizing Approach to Parenting (#788) Leave a comment Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my parenting conversation with Aaron Stupple and Naval Ravikant. Aaron Stupple (@astupple) is a board-certified internal medicine physician. He focuses on reviving the non-coercive parenting movement derived from the philosophy of Popper and Deutsch called Taking Children Seriously. His book, The Sovereign Child: How a Forgotten Philosophy Can Liberate Kids and Their Parents, gives practical examples of this freedom-maximizing approach to parenting, gleaned from his experience as a father of five. Naval Ravikant (@naval) is the co-founder of AngelList. He has invested in more than 100 companies, including many mega-successes, such as Twitter, Uber, Notion, Opendoor, Postmates, and Wish. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the interview on YouTube. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #788: Naval Ravikant and Aaron Stupple — How to Raise a Sovereign Child, A Freedom-Maximizing Approach to Parenting<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/bb8b49e2-6ad8-485d-bc86-d4426801cd06/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: Brother Naval, Brother Aaron, nice to see you both. And Naval, would you like to kick us off, grab the reins, go to town? Naval Ravikant: Aaron Stupple here, who I actually met, I think we met online, right? Aaron Stupple: Yeah. Naval Ravikant: We met online on various channels, Twitter, Airchat, and just talking about various things. He came out of the critical rationalism crowd, which is a group of thinkers that surround David Deutsch and his philosophy. And Aaron struck me as someone at first who I was like, this man is insane, but I realized in a good way. He’s a very ground up, very principled thinker. And what I really liked about talking to Aaron, who came out of nowhere, is that he will take these philosophically sound positions that are very controversial and then he will just defend them indefatigably without tiring. He’ll just keep going. He’ll keep repeating himself if we need to. He’ll explain it from 10 different angles, but he is very tied into the idea of using creativity to find answers to problems and to not using coercion. And so he would end up in these rabbit holes where I would find myself having to, usually when I meet someone like that, I usually side with them, I learn from them, and I try to help preach that to the rest of the world. Here, it was a little bit the opposite. I found myself on the defensive. I found him too radical, too hard to take seriously. But as time went on, I actually realized he was right about a lot of things. It gave me that very uncomfortable feeling. And so Aaron actually wrote a book called The Sovereign Child. He’s been espousing a theory around Taking Children Seriously, which is an older philosophy, but he’s, I would say, the best expositor of that philosophy. But he also had really great takes in everything from “Is AI going to end the world?” to “What do you do if you walk into an emergency room?” because he’s a doctor, to “How to run a classroom,” because I think he’s also been a public school teacher. So I just found him a very compelling person to talk to, and I’m still honestly trying to digest a lot of what he has to say. And I think some of it has seeped into my life and my family life and some of it still hasn’t. So I’m here to challenge him and interrogate him and to reveal him to the rest of the world. I will say that this may end up being one of your most controversial episodes for two reasons. I think one is, it really attacks, at a core level, the entire system we have around how we view children and raise children. So it’s really a big F you to the entire system, everything from schooling to parenting to child raising to how do you take care of the most precious thing in your life? And second, it’s a bunch of dudes. It’s a bunch of men standing around talking about this. I don’t see the wives or the women. So you could just call this the bro parenting episode, right? This is a bunch of dads and potential dads talking about what is the best way to raise sovereign children? So let me just start off by maybe asking Aaron, give us a very quick background on yourself. Tim Ferriss: And also mention how many kids you have, just so we underscore some bona fides. Naval Ravikant: Zero. He actually has zero children. Aaron Stupple: Zero children. It’s all theoretical. I’ve got five kids, ages seven to one. And thanks so much for those kind words, Naval. I really appreciate that, and it’s been so much fun talking with you and your cohort on Airchat and Twitter and elsewhere. I started off as a public school teacher coming out of college and spent five years doing that and was really kind of deep into the human nature and the experience of young people and formed some pretty strong ideas about human nature and children, and then converted that into medical school. And I’ve been a practicing physician now for the past 10 years, internal medicine. And along the way, I got into one of our mutual heroes, David Deutsch, and his take on Karl Popper’s philosophy. And within that, David Deutsch and his colleague, Sarah Fitz-Claridge, they both developed this theory on children and childhood called Taking Children Seriously. And I stumbled upon this right with the birth of our first child, and I thought, boy, this is pretty radical and pretty interesting. And after reading more about it and learning more about it, I was kind of faced with, do I apply this to my own kid? Because it’s very different from the typical conventional view on parenting and what I had already been very comfortable with coming out of teaching. And I did. The short story is that I did, my wife and I, she is very open-minded and was open to these ideas. And we found ourselves just doing this 100 percent, basically. And so we’ve got five kids now. We’ve been doing this for seven years. And it’s remarkable. I’ve been into philosophy as an amateur since college, but this is the first time that was a really strong application of these ideas to my life. And I can’t think of a more transformative day-to-day impactful, practical, applicable set of ideas than this set of ideas as applied to children. Naval Ravikant: I will say, I’ve incorporated, maybe, call it 30 percent to 50 percent of what you’re saying. I was already directionally inclined, but I’ve managed to incorporate some of it and my wife and I are open to more of the rest, although it’s pretty radical. So let’s get into it. So just as an example, the philosophy that you’re talking about, the Taking Children Seriously philosophy, which you lay out in The Sovereign Child, the book, you basically say the kids have no sleep schedules, you don’t control what they eat, they have unrestricted screen time. I’m not even sure I have unrestricted screen time, but your kids have unrestricted screen time. You don’t force them to go to school. You don’t make them do chores. You don’t have rules like “Don’t hit each other.” You try not to mediate sibling conflict. You don’t force them to share things. They’re not forced to say “Thank you” or obliged to say “Thank you” or even badgered to say “Thank you.” There’s no real punishment, there’s no timeouts or withholding of things. There’s no making them spend time with the grandparents or the extended family. You don’t force them to brush their teeth. You don’t make them sit at the dinner table, that’s optional. So what are we talking about here? Do you have children or do you have roommates? Tim Ferriss: Feral animals. Naval Ravikant: Feral animals, exactly. So what is this all about? Where did this come from? Aaron Stupple: The typical way of looking at parenting is the question of what do you allow and what do you disallow? And almost every view I’m parenting is a discussion of, well, we allow this, but we don’t allow that, and these are the methods that we use to enforce these limitations and these are the justifications that we have for enforcing these limitations. And what my wife and I do is we just step away from that question altogether and instead view problems as they arise and try to find solutions to those problems rather than appealing to rules. The way we interact with our friends and our family, the adults in our lives, we don’t apply rules to people. If we’re not crazy about what we’re having for dinner, we don’t say, “Okay, this is the rule for dinner time.” We instead try to come up with something that works for everybody. And so you could just start with sleep, you could start with brushing teeth or eating food. The idea is to let kids choose what is interesting or appealing to them and then deal with problems as they arise. Naval Ravikant: But couldn’t every parent say, “Well, I try to do that. I try to convince them that broccoli is good and salmon is good and they should eat their broccoli and salmon, then they get dessert. And so I try to convince them to do that, but they don’t know any better.” And so I always try to negotiate with them, but after a while, you sort of give up because you realize they’re just going to eat chocolate until they explode. And so I have to cut that off and say, “No. No more ice cream. And you’re going to eat your salmon, your broccoli, and then you can have your ice cream.” And then there’s a little bit of fighting and whining, and then eventually they just get used to it. So what’s wrong with that? I tried too, I tried to negotiate with them. Aaron Stupple: The thing that’s wrong with it is that every time you force your child to do something, you inevitably set yourself up as an adversary to your kid. So if you’re trying to get them to eat broccoli, you are introducing a difficulty in their life around food. And food is something that is crucial to a person’s engagement with the world, a young person, and you want them to learn about broccoli for broccoli’s sake. If broccoli is good for you, you want them to understand broccoli for its own properties. If chocolate is bad for you, if chocolate makes you feel bad, then you want them to understand that as mediated by themselves, not because you’re introducing yourself into that thing. So you don’t want them to avoid chocolate because they’re afraid of Dad. You don’t want them to eat broccoli because Dad makes you eat broccoli at the dinner table and you can’t go up and do what you want to do because you’ve got to appease Dad. If broccoli is really important, then it’s really important that broccoli is not confused. If eating well is really important, then it’s really important that eating is not confused by what your parents’ expectations are. Tim Ferriss: Let me just zoom out for a minute. So if we look at, say David Deutsch and his collaborator on Taking Children Seriously, and for people who want more on David Deutsch, we might have some mentions and sidebars, but Naval and I did an episode with David. Why did they land on the tenets that they did for Taking Children Seriously? And can we know that their approach is right? In other words, is there any way to even know that this is a good approach to parenting? Aaron Stupple: So that’s perfect. It’s about knowing, right? And there’s different theories about, how do we know when we know something, right? We call this epistemology, the theory of knowledge. And Deutsch’s perspective on this is that humans are uniquely knowledge creators. And the thing about children that’s similar to adults is that they’re both knowledge creators in the same way. And the role of the parent is to facilitate the child as a burgeoning knowledge creator and not to foil that process. And things that foil that process of knowledge creation and discovery are authorities that arbitrarily thwart you when you’re trying to learn about something. And so that’s how they hit on this originally. Sarah Fitz-Claridge was just very interested in non-coercion and raising children with zero coercion. She just had that in her mind as a parent and she kind of searched around for schools of parenting that had zero coercion, that had no enforcement of rules. And the person that she aligned with was David Deutsch who brought this epistemological perspective. And his whole argument is that the problem with coercion is that it blocks knowledge growth and your duty as a parent is to facilitate and'
