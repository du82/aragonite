description = 'Please enjoy this transcript of my interview with Peter Attia, M.D., founder of Attia Medical, PC; David Sabatini, M.D., Ph.D., of MIT’s Whitehead Institute for Biomedical Research; and Navdeep Chandel, Ph.D., the David W. Cugell Professor of Medicine and Cell Biology at the Feinberg School of Medicine, Northwestern University. Transcripts may contain a few typos—with … Continue reading "The Tim Ferriss Show Transcripts: Peter Attia, David Sabatini, and Navdeep Chandel (#193)"'
full_description = 'Posted on June 5, 2018January 16, 2020 by Tim FerrissThe Tim Ferriss Show Transcripts: Peter Attia, David Sabatini, and Navdeep Chandel (#193) Leave a comment Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with Peter Attia, M.D., founder of Attia Medical, PC; David Sabatini, M.D., Ph.D., of MIT’s Whitehead Institute for Biomedical Research; and Navdeep Chandel, Ph.D., the David W. Cugell Professor of Medicine and Cell Biology at the Feinberg School of Medicine, Northwestern University. Transcripts may contain a few typos—with some episodes lasting 2+ hours, it’s difficult to catch some minor errors. Enjoy! Listen to the interview here or by selecting any of the options below. Listen onApple Podcasts Listen onStitcher #193: My Life Extension Pilgrimage to Easter Island<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/60436d84-c78f-4c48-bdd8-88c89a5d8bde/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: Hello, boys and girls. This is Tim Ferriss and welcome to another episode of The Tim Ferriss Show. It is my job to deconstruct world class performers and to tease out the habits, routines, and belief systems that you can apply to your own lives. This episode was extremely fun. It took place in the middle of nowhere, effectively, on Easter Island. That’s a very hard place to get to, and you can think of it in a sense as my life extension pilgrimage for a whole host of reasons. I was surrounded by three incredibly brilliant people and I’m going to describe each in turn. The first is Navdeep Chandel, PhD, who goes by Nav. He is a David W. Cugell Professor of Medicine and Cell Biology within the Feinberg School of Medicine at Northwestern University. Nav is extremely good at questioning assumptions, testing assumptions, as are the other people I’m going to mention. I’m just going to give you one example. Many of you listening probably take antioxidants and here is a description of interest on Nav’s faculty profile. I’m going to blaze through this, but I do think it’s really fascinating and opens the door to discussions that many people are not having. “Historically, reactive oxygen species (ROS) have been thought to be cellular damaging agents, lacking a physiological function.” This is why many of us take antioxidants, right? We want to snuff out these reactive oxygen species. “Accumulation of ROS and oxidative damage have been linked to multiple pathologies, including neurodegenerative diseases, diabetes, cancer, and premature aging. This guilt by association relationship left a picture of ROS as a necessary evil of oxidative metabolism, a product of an imperfect system. Yet few biological systems possess such flagrant imperfections, thanks to the persistent optimization of evolution, and it appears that oxidative metabolism is no different. “More and more evidence suggests that low levels of ROS are critical for healthy cellular function. [In his lab], we are testing whether mitochondrial release of H2O2 – that’s hydrogen peroxide – “has evolved as a method of communication between mitochondrial function and other cellular processes to maintain homeostasis (e.g. stem cell function and immune responses) and promote adaptation to stress (e.g. hypoxia).” So this very much a counterview to what you’d find in media. For that reason, and many others, I enjoyed hanging out with Nav. Now, his partner in crime comes up next. One of his best friends and partner in crime is David Sabatini, M.D., Ph.D. You can find him on Twitter @dmsabatini. He’s a member of the Whitehead Institute for Biomedical Research, an investigator at the Howard Hughes Medical Institute, a professor of biology at the Massachusetts Institute of Technology – otherwise known as MIT – and a senior associate member at the Broad Institute. David is on what you can think of as a short list for the Nobel Prize – at least according to Reuters – for his work in elucidating the role of rapamycin and something called mTOR, which we’re going to talk a lot about. For those of you out there who have thought a lot about life extension and looked for silver bullets, you’ve probably come across metformin and rapamycin. Well, in these two gents, Nav and David, you have respectively two of the world’s foremost experts in how metformin and rapamycin function. Next up, we have one of my faves. He’s been on the podcast at least twice before – Peter Attia, M.D. You can find him on Twitter @peterattiamd. He is a former ultra-endurance athlete, swimming races of 25 miles and crazy stuff like that. He’s a compulsive self-experimenter like yours truly and one of the most fascinating human beings that I know. He makes my OCD look like a light case. He is also one of my go-to doctors for anything performance or longevity related. Peter earned his MD from Stanford and holds a Bachelor of Science in mechanical engineering and applied mathematics from Queens University in Kingston, Ontario. He did his residency in general surgery at Johns Hopkins and conducted research at the National Cancer Institute under Dr. Steven Rosenberg, where Peter focused on the role of regulatory T-cells in cancer regression and other immune based therapies for cancer. We get into a lot in this wine-infused jam session on Easter Island. I tried to guide it the best I could. I had a fair amount of wine, as did one or two others in the group. We discuss antioxidants, their role or lack thereof, and we get into all sorts of serious stuff. But we also talk about – and might even have an impersonation of – Borat. We talk about what is ass crack voting exactly, how to staple fonts, and a supplement that many of you have asked about, Basis by a company called Elysium. There you have it folks. Sorry for the long intro, but I felt that context would be important. These guys are absolutely brilliant and I was playing catch-up the entire trip. But that is how you grow. You have to be the weakest person in the room sometime. I hope you guys enjoy this as much as I enjoyed recording it. Thank you for listening. Alright, folks. Here we are on Easter Island, Isla de Pascua, of all places. We have a number of folks here – one doing something obscene with his hands. I’m not going to mention who. We’re going to start with some introductions. We have one known character and two new faces. Nav, would you mind introducing your friend, David? Navdeep Chandel: Well, Tim, I want to thank you for inviting me to your wonderful podcast in this lovely, magical place called Easter Island. I’m here with my good friend, David Sabatini, who is a professor at Massachusetts Intitule of Technology. David is a professor at MIT and made a remarkable discovery about 20 years ago. He hasn’t discovered anything after that, but it was remarkable 20 years ago. On a serious note, he figured out a protein called mTOR – mechanistic target of rapamycin. Rapamycin was actually found on Easter Island. For David, this is kind of like a pilgrimage to sort of pay homage to this great little molecule. We’ll talk a lot about all these wonderful things rapamycin could possibly do. Tim Ferriss: Fantastic. Since it may not be obvious at first listen, these two have known each other for a very, very long time. So the way that Peter and I bust each other’s balls, you may hear occasional busting of balls between these two. David? David Sabatini: Sure. Thanks, Tim and Peter. Peter was actually the person who took an incipient idea and had this actually happen for us all to be here. Navdeep Chandel, I’ve known him about 10-15 years or somewhere in that range. He’s a professor at Northwestern in Chicago. He is my best friend in science. He started working in an area of biology that, frankly, a lot of people were not that interested in for a long time. These are these things called mitochondria inside our cells. People have probably heard of them as the powerhouses of the cell because they make a molecule called ATP, which is an energy molecule. Nav, I think it’s safe to say, was the first person who realized that these important compartments in the cell did a lot of other things. This idea that they’re so called signaling organelles really initiated with Nav. These are not very popular things to study and Nav was there at the beginning to do that. He is also one of the most charming people in science. He is friends with everyone. He’s the social butterfly of all meetings. A meeting without Nav is no fun. Tim Ferriss: He strikes an incredible resemblance to a Bollywood star – Navdeep Chandel: I thought you were going to say Julie from the Love Boat – the cruise director, as he just sort of pointed out. David Sabatini: Well, I’ll take the Bollywood star. The ones who don’t usually get the girls. Tim Ferriss: Peter, how did you come to know these two guys? Peter Attia: I’ve known David for a few years. We actually met – I don’t remember who introduced us, but I took an interest in how to better understand how inhibition of this thing that Nav eluded to – mTOR – could be valuable in the treatment of cancer. About a year and a half ago, we were having dinner and he mentioned that one of the things he always wanted to do was have a meeting on Easter Island to commemorate the 20th anniversary of the elucidation of how rapamycin works. As Nav eluded to, we’ll talk a lot about that. This idea kind of seemed amazing to me because I thought the story of rapamycin’s discover was about one of the most interesting stories in science, not just from the standpoint of the expedition and the identification of the molecule, but also how close it came to never happening. To the story of how its mechanism of action was identified independently by different groups, how David did it at such a young age is amazing to me. David and I crafted this idea about a year ago, that we would come to Easter Island to scope it out and see first and foremost where rapamycin was discovered, but also to figure out if there was a way to have a conference here. That idea quickly took hold and I think I just talked you into it in about 10-11 seconds. I think David similarly talked Nav into it and that’s what – Navdeep Chandel: That took 11 minutes. Peter Attia: So that’s what got us here. Navdeep Chandel: He wanted to share a room with me and I made sure that did not happen. Once I disabused him of that – Tim Ferriss: So Peter, you’ve told me – and I ask you to retell it like a bedtime story because I like it so much – the lore and connection between Easter Island, also known as Rapa Nui, and rapamycin. Peter Attia: In 1964, an expedition from McGill University set out. They arrived in early December of ’64 and spent probably half a year here? Navdeep Chandel: Dude, you just watched a movie about it last night. Peter Attia: Yeah, YouTube wasn’t working. It took an hour to get through the first four minutes of the documentary. I think I know less now than I did before we tried to watch. Rapa Nui is great for many things. Connectivity is not one of them. This group returned to McGill University and by about 1972 the soil that contained Streptomyces – which one was it, David? David Sabatini: Hygroscopicus, which they’d collected near a volcano here. Peter Attia: That’s right. We saw that the first day we got here. It was mindboggling. This made its way into the hand of a chemist named Suren Sehgal, who was at a biotech company that is no longer in existence. Navdeep Chandel: Another Bollywood star. David Sabatini: It was a pharma company called Ayerst. Peter Attia: It had offices around the country, but he was in the Montreal office. He spent the next three years purifying the active compound within this, which he named rapamycin. Rapa is obviously paying respect to the island on which it was discovered and mycin being the sort of thing we’d add to the name of something that was an antimicrobial agent. Tim Ferriss: What was the lore among the locals, the purported background of this volcano? Peter Attia: The word on the street, which was reiterated to us this week, was that – Navdeep Chandel: More than once, independently. Peter Attia: Any time natives were sick, the Rapa Nui would go and spend an evening in the marsh area of the volcano and it would seem to rid them of all their ails. In truth, it’s not clear to me that’s why they were prospecting there. I think they were looking for biodiversity, but it certainly makes for a great story. Back in Montreal, sometime between 1975 and 1980, this company went through a series of layoffs. The majority of9 the people in Montreal were released. Suren was one of the few who was not. He was transferred to the New Jersey office; however, he was ordered to destroy all nonviable compounds, of which rapamycin was one. He’d already figured out something pretty remarkable about rapamycin, which is it was a potent inhibitor of yeast. As the story goes, he believed this was going to be a game changing drug for athlete’s foot. I don’t think at the time, they understood its full antiproliferative effects, did they, David? David Sabatini: No, but it was pretty early that they started seeing things in human cells and immune cells, too. Peter Attia: Suren’s son, Ajai, was supposed to be on this trip with us. It is sad that he had a work commitment and couldn’t make it here. They packaged up the rapamycin into little dry ice containers and wouldn’t even let the movers move it. They were the ones'
