full_description = '''Posted on March 3, 2023March 3, 2023Revisiting Warren Buffett’s Advice to Me in 2008 (Plus: 7 Lessons for Young Investors) If someone asked me to give investing advice to a 30-year-old today who had just made their first million, I would first point them somewhere else. I’m not a financial advisor and don’t think I’m qualified to give anyone financial advice. The particulars matter too much. But if they insisted, I might say: <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2017/08/jason_calacanis.jpg?fit=600%2C404&#038;ssl=1" alt="Finding &quot;Unicorns:&quot; Questions to Ask Before You Invest in a Startup"/> Posted on August 4, 2017January 16, 2020Finding "Unicorns:" Questions to Ask Before You Invest in a Startup Many people ask me about startup investing and how to get started. This post — while for informational purposes only and not investment advice — is intended to show you how one successful investor approached the early-stage game. Jason Calacanis (@jason) has made 125 early-stage startup investments and picked 6 “unicorns” (startups to exceed … Continue reading “Finding "Unicorns:" Questions to Ask Before You Invest in a Startup” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/10/journal_startup_vacation.jpg?fit=600%2C805&#038;ssl=1" alt="How to Say No When It Matters Most (or &#8220;Why I&#8217;m Taking a Long &#8216;Startup Vacation&#039;&#8221;)"/> Posted on October 29, 2015March 3, 2023How to Say No When It Matters Most (or “Why I’m Taking a Long ‘Startup Vacation'”) Saying yes to too much “cool” will bury you alive and render you a B-player, even if you have A-player skills. To develop your edge initially, you learn to set priorities; to maintain your edge, you need to defend against the priorities of others. <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2016/12/sacca-tim-festive-gift-guide-2016.jpg?fit=600%2C600&#038;ssl=1" alt="Chris Sacca on Being Different and Making Billions (#79)"/> Posted on