title = "The Tim Ferriss Show Transcripts: L.A. Paul — On Becoming a Vampire, Whether or Not to Have Kids, Getting Incredible Mentorship for $250, Transformative Experiences, and More (#796) - The Blog of Author Tim Ferriss"
description = 'Please enjoy this transcript of my interview with L. A. Paul (lapaul.org). Paul is the Millstone Family Professor of Philosophy and Professor of Cognitive Science at Yale University, where she leads the Self and Society Initiative for the Wu Tsai Institute. Her research explores questions about the nature of the self and decision-making and the … Continue reading "The Tim Ferriss Show Transcripts: L.A. Paul — On Becoming a Vampire, Whether or Not to Have Kids, Getting Incredible Mentorship for $250, Transformative Experiences, and More (#796)"'
full_description = 'Posted on February 22, 2025February 22, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: L.A. Paul — On Becoming a Vampire, Whether or Not to Have Kids, Getting Incredible Mentorship for $250, Transformative Experiences, and More (#796) Leave a comment Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with L. A. Paul (lapaul.org). Paul is the Millstone Family Professor of Philosophy and Professor of Cognitive Science at Yale University, where she leads the Self and Society Initiative for the Wu Tsai Institute. Her research explores questions about the nature of the self and decision-making and the metaphysics and cognitive science of time, cause, and experience. She is the recipient of fellowships from the Guggenheim Foundation, the National Humanities Center, and the Australian National University. She is the author of Transformative Experience and coauthor of Causation: A User’s Guide, which was awarded the American Philosophical Association Sanders Book Prize. Her work on transformative experience has been covered by The New York Times, The Wall Street Journal, The Guardian, NPR, and the BBC, among others. And in 2024, she was profiled by The New Yorker. She is currently working on a book, under contract with Farrar, Straus and Giroux, about self-construction, transformative experience, humility, and fear of mental corruption. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #796: L.A. Paul — On Becoming a Vampire, Whether or Not to Have Kids, Getting Incredible Mentorship for $250, Transformative Experiences, and More (#796)<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/e6b8e87f-8823-4d6f-8b6e-4e8f8955cb59/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: So I am very interested in someone by the name of Quentin Smith and the role that he played in your life. How did that connection happen and what was the result of that connection? L. A. Paul: I was at Antioch College. I had gotten my undergraduate degree, I think, or I was close to finishing. I can’t quite remember exactly when I met him, but I was already thinking I wanted to study philosophy, but wasn’t sure how to go about it, because I don’t have an undergraduate degree in philosophy. In fact, I tried twice to take philosophy classes and each time it was a huge disaster. And I realized about three or four weeks into the class, it just wasn’t working with me, so I dropped out. I never managed to take a single philosophy class when I was in college. And yet, don’t ask me to explain this, I have no idea, I was convinced that philosophy was probably the thing that would be most meaningful for me to study and explore. I don’t know what to tell you about that other than I can be a reasonably stubborn individual in various ways, as my husband will be happy to elaborate on. Okay, so I thought, “I really want to study philosophy. I don’t know how to do this or what the best way is,” and there are lots of different kinds of philosophy, I’ll just add. So you can do kind of Western philosophy, Eastern philosophy. These are rough categories, so Eastern might be Buddhism or related sorts of faith-based philosophical views. And then within Western style philosophy, so it’s continental philosophy and analytic-style philosophy, which is what I do. Anyway, so I didn’t even have a grasp of these distinctions, but I was committed. So I needed to earn some money because that’s why I’d graduated, and I was just sort of hanging out with friends of trying to figure out what my next step would be. And so I worked for the college, driving back and forth to the airport to pick up invited speakers, and Quentin Smith was an invited speaker. So, I drive to the airport and I pick him up. I don’t think I knew anything about him. It wasn’t like I thought, “Oh, a philosopher, I want to meet this person.” It’s just some random invitation. He gets in the car — Tim Ferriss: A pickup. L. A. Paul: Yeah, some random pickup. Right, I picked him up, and he gets in the car, and we started talking. It’s a long drive. I think it was like — I don’t remember. I think he came into Cincinnati, so we had like an hour and a half and he asked me about myself, and I asked him about him, and I discovered he’s a philosopher, and then we start talking and I say, “Oh, I really would love philosophy and I really want to do it, but I don’t really know how and I don’t know if the things I’m interested in are really philosophical.” And he said, “Well, tell me about it.” And I said, “Well, I really care about how to understand who we are in the world, and I think a lot about time and I’m trying to make sense of what it’s like to have a point of view.” And so I started just blabbing basically as I’m — I don’t know how old I was, like 22 or something. And he said as we’re driving, he’s like, “You should study philosophy. You’re exactly the kind of person who would be interested in doing philosophy.” And I said, “Well, what should I study?” And he said, “Well, you should read Martin Heidegger’s Being and Time to start, because that’s all about the nature of the self and time.” And I said, “Okay.” And then we kept going and we kept talking and I said, “Okay, I’m going to read this book.” And then he said, “Well, I think you should read the book.” And then he said, “And I think you also should study with me.” It was after like an hour, because I told him I studied — I studied chemistry, and I really loved problem solving, so I loved organic chemistry. And that’s what I was really into when I was in college, and I was good at it. It was my thing. I could have become a chemist. I also drove him back from his talk and I thought, “Okay, wow.” So, he goes off to have his visit and I immediately go to the library, dig out Being and Time, and start reading it. And I was like, “This is fantastic.” Confusing, but really interesting. So then I drive him back and I tell him what I’ve gotten out of the first, I don’t know, of 10 pages I had read. It’s very dense. It took me forever to read it, but I managed to get through 10 pages, and he said, “You should study with me. Here are my details. Let’s figure this out,” and so that was how it started. I didn’t know anything about him, but he was so great to talk to and so responsive, and he understood the intellectual problems that I wanted to explore, because he explores those intellectual problems. And I had never met anybody who had any understanding of this weird orientation that I had. I could tell you more, but that’s how it happened. It was completely random. Tim Ferriss: So I’m going to come back to Quentin Smith, but I want to call back to something that you said a few minutes ago, which was you took some philosophy classes, I’m paraphrasing here, and they were disasters. Why were those classes disasters? What didn’t work? L. A. Paul: Nothing worked. Okay, so they were a combination of things, and some of it was me, and some of it was certainly the teachers, and also some of it was analytic philosophy can be extremely inaccessible, okay? It’s a beautiful way of thinking and it involves a very rigorous concepts-oriented approach to thinking about almost anything that you want to pick out in the world around us or how we think and how we make sense of the world, but it’s not very accessible in the sense that it doesn’t feel very natural. And so the first thing was I was both immature, very impressed with myself in the sense of like, “Well, I’ll just do this. I do mathematics, I can do chemistry, I do physics. Well, of course I can do this.” And I think I underestimated things, but also the teaching wasn’t very good. I put myself through college and I started at a big state school and the class was huge and the professor wasn’t really into the teaching and I had some TA, and so she would stand down there. It was this huge — there must’ve been 300 students in the lecture hall, and she would stand down on this blackboard and scribbled things on the blackboard, and I could barely see it, and I didn’t understand, really, what she was doing. I would do the readings and work really hard to understand the readings. The TA wasn’t especially into his job either. And then there was the first assignment, I worked incredibly hard on it, incredibly hard, and I had taken other classes, like writing classes and stuff like that, and the TA hated it, and I was so angry that I just dropped the class. I was like, “I’m sorry, but this is bullshit,” so I dropped the class. That was the first time. And part of it was like the class wasn’t really designed — it was designed, “Oh, these are the things you should know if you are going to think about philosophy as like a one-on-one,” and she started out with some history, but no one seemed to really care about how to take these abstract ideas and connect them to things that were meaningful in a certain way. I care very much about the nature of how we live our lives, the kinds of struggles that individual people have. I’m fascinated by the fact that all of us have these internal worlds, and then there’s some way in which we all have these internal worlds, and then these internal worlds have to kind of coexist with the external world, and we have to try to make sense of everything, and try to understand other people. These are deep puzzles for me, and it’s not that analytical philosophy doesn’t address this, but it doesn’t address it in a straightforward way. And so, I didn’t understand why I was supposed to work through some abstract — It was actually sad. It was Descartes that really she started with, and Descartes talks about the mind-body problem, but she didn’t make any connection to these sorts of questions. It was just like, “Oh, the mind is different from the body and here are these questions, and here’s an analysis of what Descartes was saying and what the problem was,” and so it wasn’t a good experience. And then the second time I took a more applied class, and this was a philosophy of law class, and I tried this and this also didn’t go well. And there’s another thing, which is that I may have mentioned I was a stubborn person. Well, I have views and I was committed to trying to argue something that was kind of creative. Also with the first paper, actually, I wanted to give my own perspective, and I’m sure that it was raw and not especially good in various ways, but it wasn’t stupid. Do you know what I mean? And I got treated as though I was making a mistake by trying to really engage in a very open and creative way, as opposed to just vomit back what I was being told, okay? Now, I’m not going to mention the schools I was at. I mean, I put myself through school, I had to apply — so it was a mix of things that made it go badly, and blame can be spread all around. Anyway, that’s what happened. Tim Ferriss: All right, thank you for answering that. Part of the reason I wanted to ask this is that many people listening will not know how philosophy applies to their lives, or they have had similar experiences. They take a philosophy class and it’s an hour and a half of trying to define what is is, and they’re like, “I don’t know how this is relevant to my life. I am out.” L. A. Paul: Right. Tim Ferriss: I would like to think of myself as a curious person, but I’ve had these experiences where it’s like, “Okay, I’m interested in the limits of our language and the limits of our world. Let me get into Wittgenstein. And I’m like, “Wow, cool family, but I cannot decipher this guy any which way from Sunday.” And then I’ve had a few experiences though that have brought things home. I won’t make this into a soliloquy, but I remember taking a freshman class when I was undergrad at Princeton with Gideon Rosen, and I believe it was Introduction to Epistemology, something like that, which in and of itself — L. A. Paul: That sounds right. Tim Ferriss: — as a course title, none of us knew how to make any sense of, but he was so good at weaving stories together with the concepts that it was very compelling and very, very memorable to the extent that here I am, whatever it is, 25+ years later, and I still remember the impact of that class. And I just want to give credit where credit is due to a lovely Austrian woman who’s now at HBS, Harvard Business School, who gave me a copy of your book, Transformative Experience, and that was my personal experience of reading some of the examples in that, which we’ll get to, whether it be the cochlear implants or some of the other thought experiments that we’ll certainly get into. I was li'
