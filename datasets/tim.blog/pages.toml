full_description = 'Posted on May 9, 2011January 16, 2020Semi-Finals: Scholarship for Opening the Kimono (Photo: Josh Liba) NOTE: VOTING HAS ENDED — THANKS! Once again, I have been BLOWN AWAY by you all. Please find below the semi-finalists for the scholarship spot to the $10,000 Opening The Kimono™ event. There are 26, listed in no particular order, as we could not narrow it down further. The case studies range … Continue reading “Semi-Finals: Scholarship for Opening the Kimono” Posted on April 26, 2011January 16, 2020How to Bribe People to Start Companies (Plus: Kimono Event Scholarship) Once upon a time, two entrepreneurs had an idea: what if we used traditional bookbinding to make iPad cases? It was a fun idea. Then it suddenly became very, very profitable. The two entrepreneurs, Patrick Buckley and Craig Dalton, named the idea DODOCase and soon had sold more than 10,000 iPad cases at $60 a … Continue reading “How to Bribe People to Start Companies (Plus: Kimono Event Scholarship)” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2011/04/210421689_42d4e1308f.jpg?fit=500%2C493&#038;ssl=1" alt="Opening the Kimono® Event"/> Posted on April 12, 2011January 16, 2020Opening the Kimono® Event (Photo: E. Murray) The most frequent question I get is: “How did you hit #1 on The New York Times bestseller list?” Historically, I’ve answered with “That’s a long, long story.” If pressed further, I would explain that I couldn’t go into the details until I hit #1 a second time. Alas, in publishing and … Continue reading “Opening the Kimono® Event”'
