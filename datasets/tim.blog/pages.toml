description = '“Fuck it… I’m just not going to play this traditionally anymore.” — Chris Sacca Chris Sacca was recently the cover story of the “Midas Issue” of Forbes Magazine. The reason: He is a newly-minted billionaire and the proprietor of what will likely be the most successful venture capital fund in history: LOWERCASE I of LOWERCASE Capital. He’s an early-stage … Continue reading "Chris Sacca on Being Different and Making Billions (#79)"'
full_description = '''Posted on May 30, 2015January 22, 2025 by Tim FerrissChris Sacca on Being Different and Making Billions (#79) 97 Comments Topics: CategoriesInvesting, The Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="597" src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?resize=600%2C597&#038;ssl=1" alt="sacca_disco" class="wp-image-15222" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?w=1096&amp;ssl=1 1096w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?resize=150%2C150&amp;ssl=1 150w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?resize=300%2C298&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?resize=768%2C764&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?resize=1024%2C1018&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/05/sacca_disco.png?resize=100%2C100&amp;ssl=1 100w" sizes="(max-width: 767px) 90vw, 600px" />Goofing around with Sacca and his afro. “Fuck it… I’m just not going to play this traditionally anymore.” — Chris Sacca Chris Sacca was recently the cover story of the “Midas Issue” of Forbes Magazine. The reason: He is a newly-minted billionaire and the proprietor of what will likely be the most successful venture capital fund in history: LOWERCASE I of LOWERCASE Capital. He’s an early-stage investor in companies like Twitter, Uber, Instagram, Kickstarter, and many more. In this interview, we discuss unfair advantages, how Chris chooses founders and investments, stories of missed opportunities, the styles that differentiate Wall Street from Silicon Valley investors, and how keg parties can liberate law students from the tyranny of class (Chris completed law school without attending any classes). Enjoy! You can find the transcript of this episode here. Transcripts of all episodes can be found here. #79: Chris Sacca on Being Different and Making Billions<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/8a26b2f5-7db0-403c-ad49-b15b5c312adc/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode mentions the incredible Matt Mullenweg. Matt, who’s also been on this podcast, was a lead developer behind WordPress, which runs about 23% of the Internet. You can listen to our booze-infused conversation here, in which we discuss polyphasic sleep, tequila, and building billion-dollar companies like his current gig. Ep 61: The Benevolent Dictator of the Internet, Matt Mullenweg<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/1f3aff03-e180-4cfd-9e45-b0aad6111f4a/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> QUESTION(S) OF THE DAY: What’s the best investment advice you ever received? Or worst? Please let me know in the comments. Scroll below for links and show notes… Selected Links from the Episode A partial list of Chris Sacca’s investments. Want to skip an MBA program? Check out Feld Thoughts Not Fade Away: A Short Life Well Lived by Laurence Shames and Peter Barton Watch Chris Sacca’s commencement speech to University of Minnesota I Seem to be a Verb by Buckminster Fuller The Magic of Thinking Big by David Schwartz The Essential Scratch and Sniff Guide to Becoming a Wine Expert by Richard Betts, Wendy MacNaughton and Crystal English Sacca Follow Chris on Twitter – @Sacca Show Notes What is Chris Sacca best known for? [6:10] Total Immersion swimming and how to invest like Chris Sacca [8:40] Pieces of advice given to Chris Sacca on early-stage investing [11:55] What disqualifies startup founders in Sacca’s mind [16:05] Travis Kalanick and Nintendo Wii Tennis [18:55] Traits of founders for whom success, at massive scale, is predestined [22:00] The whales that got away: GoPro, Snapchat, and more [27:40] On letting the negative case dominate one’s analysis for whether to invest or not [29:55] Differences between venture capitalists and private equity [35:15] Books for investing and cultivating emotional intelligence [41:00] Thoughts on modeling what it is to be successful [49:30] What Chris Sacca’s parents did when he was a kid [53:50] What Sacca looks for when hiring [58:25] What historical figure Sacca most identifies with? [1:01:15] Early collecting habits [1:04:25] The story of the prophetic notebook [1:10:10] The two differentiators that shifted the nature of Sacca’s business [1:19:10] Advice to founders or would-be entrepreneurs [1:27:40] Most readily quoted movie [1:31:10] People Mentioned Mike Maples Jr. Josh Kopelman Tony Conrad Hans Swildens Kevin Systrom Evan Williams Patrick Collison John Collison Travis Kalanick Nick Woodman Brad Feld John Doerr Michael Moritz Brian Sacca Buckminster Fuller Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesInvesting, The Tim Ferriss ShowTags: Tagsbillionaire, capital, chris saca, chris sacca, cover, forbes, instagram, kickstarter, lowercase, lowercase capital, midas, twitter, uber'''
