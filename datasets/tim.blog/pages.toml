full_description = 'Posted on February 26, 2025March 4, 2025Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory (#797) 5 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Dr. Keith Baar is a professor at the University of California, Davis, in the Department of Physiology and Membrane Biology.During his PhD studies, his research revealed that mechanical strain on muscle fibers activates the mammalian target of rapamycin (mTOR) signaling pathway, a crucial regulator of muscular hypertrophy. Subsequently, he studied the molecular dynamics of skeletal muscle adaptation to endurance training under the guidance of Dr. John Holloszy, a legend in the field of exercise physiology, considered the father of modern exercise biochemistry. Building on all of this experience, he conducted research into tendon health and the potential for engineering ligaments, which could have implications for treatment and recovery from injuries. Dr. Baar now runs the Functional Molecular Biology Lab at UC Davis. His lab’s work ranges from studying molecular changes in our cells to conducting studies to effect real-world improvements in people’s health, longevity, and quality of life. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. The transcript of this episode can be found here. Transcripts of all episodes can be found here. This episode is brought to you by Cresset prestigious family office for CEOs, founders, and entrepreneurs; AG1 all-in-one nutritional supplement; and Shopify global commerce platform, providing tools to start, grow, market, and manage a retail business. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/d7be84b6-bee9-4ffe-82a2-be20d9a3a52c/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Cresset Family Office! Listeners have heard me talk about “making before you manage” for years. And for me—as a writer and entrepreneur—I definitely gravitate toward making. So it’s important that I find the right people who are great at managing. That’s why I trust this episode’s sponsor, Cresset Family Office. Cresset is a prestigious family office for CEOs, founders, and entrepreneurs. They handle the complex financial planning, uncertain tax strategies, timely exit planning, bill pay and wires, and all the other parts of wealth management that would otherwise pull me away from doing what I love most: making things, mastering skills, and spending time with the people I care about. Experience the freedom of focusing on what matters to you with the support of a top wealth management team. Schedule a call today at cressetcapital.com/Tim to see how Cresset can