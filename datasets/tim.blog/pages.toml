5985_f8339dd2cf.jpg?fit=500%2C399&#038;ssl=1" alt="How to Be Jason Bourne: Multiple Passports, Swiss Banking, and Crossing Borders"/> Posted on March 3, 2009January 16, 2020How to Be Jason Bourne: Multiple Passports, Swiss Banking, and Crossing Borders Is it possible to become invisible without breaking the law? (Photo: gravitywave) LOS ANGELES, MID-JUNE 2008 Sitting on a plush couch in the neon-infused nightclub, I asked again: “What’s it about?” Neil Strauss glanced around and looked nervous, which I found strange. After all, we’d known each other for close to two years now. In … Continue reading “How to Be Jason Bourne: Multiple Passports, Swiss Banking, and Crossing Borders”'''
