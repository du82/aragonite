description = 'Sometimes, going weird allows you to go big. (Photo: My weird Instagram) In this episode, I answer questions submitted by you all. 50% of this episode is spent explaining how I’d build an audience from scratch, if I had to start over today. The other ~10 questions/topics are listed below. Do you like or dislike this … Continue reading "How to Build a Large Audience From Scratch (And More) (#78)"'
full_description = '''Posted on May 28, 2015January 16, 2020 by Tim FerrissHow to Build a Large Audience From Scratch (And More) (#78) 95 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Sometimes, going weird allows you to go big. (Photo: My weird Instagram) In this episode, I answer questions submitted by you all. 50% of this episode is spent explaining how I’d build an audience from scratch, if I had to start over today. The other ~10 questions/topics are listed below. Do you like or dislike this type of episode? Please let me know in the comments, and I’ll do more or fewer based on that. For the movie recommendations I mention (shorts, documentaries, etc.), click here to see the growing list. Enjoy! You can find the transcript of this episode here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" class="aligncenter size-full wp-image-14332" src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/01/tf-itunesbutton.png?resize=223%2C76&#038;ssl=1" alt="TF-ItunesButton" width="223" height="76" /> Listen onStitcher #78: How to Build a Large Audience from Scratch (and More)<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/f02f71ef-d5ed-4a04-bed8-17886b8b9774/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Listen onApple Podcasts Listen onStitcher Listen to it on iTunes. Stream by clicking here. Download as an MP3 by right-clicking here and choosing “save as.” If you enjoy the above Q&A episode, you might also like this episode, where I answer the question: “What would you add to The 4-Hour Workweek for 2015?” Ep 49: Tim Answers Your 10 Most Popular Questions<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/666e1714-634a-4e98-8f91-ef56994b562f/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Other questions I answer in this episode: If you’re the average of the 5 people you surround yourself with, who are those 5 people for you? Based on the self-experiments you conducted in your books, are there any habits you continue to implement on a daily basis? What is the most important question you ask yourself everyday? If you could make one new thing mandatory in the nationwide high school curriculum, what would it be? Bruce Lee said “The successful warrior is the average man, with laser-like focus.” What methods do you practice to maintain focus and follow through to achieve your goals rather than getting side tracked, distracted, or discouraged? With all the misleading information on health out there, what are the best/most reliable resources? What are your top 10 natural supplements that you’ve found most helpful? What are the things you’ve done to become a better writer? What are your guilty pleasures for those times when your brain needs a rest? What would you go back and tell your younger self? Again, here are my answers. ### For previous episodes of the podcast, including Arnold Schwarzenegger, Rick Rubin, Jon Favreau, and others, click here. Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss Show'''
