description = 'I’m often asked about how I approach New Year’s resolutions. The truth is that I no longer approach them at all, even though I did for decades. Why the change? I have found “past year reviews” (PYR) more informed, valuable, and actionable than half-blindly looking forward with broad resolutions. I did my first PYR after … Continue reading "Forget New Year’s Resolutions and Conduct a ‘Past Year Review’ Instead (#559)"'
full_description = '''Posted on December 27, 2021December 30, 2021 by Tim FerrissForget New Year’s Resolutions and Conduct a ‘Past Year Review’ Instead (#559) 91 Comments Topics: CategoriesPractical Philosophy, Protecting Time, The Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="600" src="https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?resize=600%2C600&#038;ssl=1" alt="" class="wp-image-36726" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?w=3831&amp;ssl=1 3831w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?resize=150%2C150&amp;ssl=1 150w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?resize=300%2C300&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?resize=768%2C768&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?resize=1024%2C1024&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?resize=100%2C100&amp;ssl=1 100w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2018/07/tfs_essentialism_blog.jpg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" /> I’m often asked about how I approach New Year’s resolutions. The truth is that I no longer approach them at all, even though I did for decades. Why the change? I have found “past year reviews” (PYR) more informed, valuable, and actionable than half-blindly looking forward with broad resolutions. I did my first PYR after a mentor’s young daughter died of cancer on December 31st, eight years ago, and I’ve done it every year since. Her passing was a somber reminder that our days here are too precious not to fill them with the people and activities that nourish us most. The PYR takes just 30–60 minutes and looks like this: Grab a notepad and create two columns: POSITIVE and NEGATIVE.Go through your calendar from the last year, looking at every week.For each week, jot down on the pad any people or activities or commitments that triggered peak positive or negative emotions for that month. Put them in their respective columns.Once you’ve gone through the past year, look at your notepad list and ask, “What 20% of each column produced the most reliable or powerful peaks?”Based on the answers, take your “positive” leaders and schedule more of them in the new year. Get them on the calendar now! Book things with friends and prepay for activities/events/commitments that you know work. It’s not real until it’s in the calendar. That’s step one. Step two is to take your “negative” leaders, put “NOT-TO-DO LIST” at the top, and put them somewhere you can see them each morning for the first few weeks of 2022. These are the people and things you *know* make you miserable, so don’t put them on your calendar out of obligation, guilt, FOMO, or other nonsense. That’s it! If you try it, let me know how it goes. And just remember: it’s not enough to remove the negative. That simply creates a void. Get the positive things on the calendar ASAP, lest they get crowded out by the bullshit and noise that will otherwise fill your days. Good luck and godspeed, everyone! ###If you prefer to listen to the audio version of this blog post, you can find the audio on The Tim Ferriss Show podcast: <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #559: Forget New Year’s Resolutions and Conduct a ‘Past Year Review’ Instead<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/70df830d-de78-4729-ad0e-5b31c70ea986/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Stitcher, Castbox, Google Podcasts, Amazon Music, or on your favorite podcast platform. Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesPractical Philosophy, Protecting Time, The Tim Ferriss ShowTags: Tagsnew year's resolutions, past year review'''
