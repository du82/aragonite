description = "Tim Ferriss is the author of five #1 New York Times bestsellers and host of The Tim Ferriss Show podcast."
full_description = '''Posted on December 18, 2024February 12, 2025 by Tim FerrissThe 4-Hour Workweek Revisited – How to Get Uncommon Results by Doing the Opposite, Aiming with Precision, and Aiming for the Unrealistic (#783) 19 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="493" src="https://i0.wp.com/tim.blog/wp-content/uploads/2017/12/4-hour-workweek-case-studies.png?resize=600%2C493&#038;ssl=1" alt="Promo image for &quot;The 4-Hour Workweek&quot; by Tim Ferriss with the text, &quot;If you could 10X your per-hour output, how would your life and business change?&quot;" class="wp-image-34411" style="width:840px;height:auto" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2017/12/4-hour-workweek-case-studies.png?w=640&amp;ssl=1 640w, https://i0.wp.com/tim.blog/wp-content/uploads/2017/12/4-hour-workweek-case-studies.png?resize=300%2C247&amp;ssl=1 300w" sizes="(max-width: 767px) 90vw, 600px" /> Welcome to another episode of The Tim Ferriss Show. This time around, we have a bit of a different format, featuring the book that started it all, The 4-Hour Workweek, which was published in 2007. It’s crazy to think that the 20th anniversary is around the corner. Readers and listeners often ask me what I would change or update, but in my mind, an equally interesting question is: what wouldn’t I change? What stands the test of time and hasn’t lost any potency? This episode features three chapters from the audiobook of The 4-Hour Workweek that are time-tested. They represent tools and frameworks that have changed my life and that I still use today. The chapters are narrated by the great voice actor Ray Porter. The 4-Hour Workweek is written in four sections, each corresponding to a letter in the acronym DEAL, which stands for Definition, Elimination, Automation, and Liberation. The chapters you’ll hear are from the section “D is for Definition.” If you want to craft your best life and your ideal lifestyle, these chapters should help. If you want to maximize your per-hour output, whether it’s four, 40, or 100 hours per week, Definition is the also the most important first step. If you are interested in checking out the rest of the audiobook, which is produced and copyrighted by Blackstone Publishing, you can find it on Audible, Apple, Google, Spotify, Downpour.com, or wherever you find your favorite audiobooks. Please enjoy! This episode is brought to you by Seed’s DS-01® Daily Synbiotic broad spectrum 24-strain probiotic + prebiotic, Helix Sleep premium mattresses, and AG1 all-in-one nutritional supplement. Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #783: The 4-Hour Workweek Revisited – How to Get Uncommon Results by Doing the Opposite, Aiming with Precision, and Aiming for the Unrealistic (#783)<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/ba6e6670-28fe-4d58-b1ad-356cc4b640a9/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Helix Sleep! Helix was selected as the best overall mattress of 2024 by Forbes, Fortune, and Wired magazines and many others. With Helix, there’s a specific mattress to meet each and every body’s unique comfort needs. Just take their quiz—only two minutes to complete—that matches your body type and sleep preferences to the perfect mattress for you. They have a 10-year warranty, and you get to try it out for a hundred nights, risk-free. They’ll even pick it up from you if you don’t love it. And now, Helix is offering between 20% and 27% off all mattress orders at HelixSleep.com/Tim. This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Seed’s DS-01 Daily Synbiotic! Seed’s DS-01 was recommended to me months ago by a PhD microbiologist, so I started using it well before their team ever reached out to me. Since then, it’s become a daily staple and one of the few supplements I travel with. I’ve always been highly skeptical of most probiotics due to the lack of science and the fact that many do not survive digestion. But after incorporating two capsules of Seed’s DS-01 into my morning routine, I have noticed improved digestion, skin tone, and overall health. Why is it so effective? For one, it’s a 2-in-1 probiotic and prebiotic formulated with 24 clinically and scientifically studied strains that have systemic benefits in and beyond the gut. And now, you can get 25% off your first month of DS-01 with code 25TIM. Want to hear another podcast episode that features The 4-Hour Workweek? Check out this episode, in which Cal Newport interviews me for an article he ended up writing for The New Yorker titled “Revisiting ‘The 4-Hour Workweek’: How Tim Ferriss’s 2007 manifesto anticipated our current moment of professional upheaval.” What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE The 4-Hour Workweek: Escape 9-5, Live Anywhere, and Join the New Rich by Tim Ferriss | Amazon How to Lose 30 Pounds in 24 Hours: The Definitive Guide to Cutting Weight | Tim Ferriss 1999 Sanshou Nationals Finals Finish | Instagram Richard Douglas Fosbury | Olympics The Physics of the Fosbury Flop | Stanford University George Does the Opposite | Seinfeld Always Be Closing: Y Combinator and The Art of the Pitch | Tim Ferriss The Weekend Retirement Test Drive: Groundhog Day and the Rest of Your Life | Tim Ferriss How to Take a Mini-Retirement: Tips and Tricks | Tim Ferriss Mr. Money Mustache — Living Beautifully on $25-27K Per Year | The Tim Ferriss Show #221 Your Body Knows the Difference Between Good Stress and Bad Stress: Do You? | Mayo Clinic News Network How to Succeed in High-Stress Situations | The Tim Ferriss Show #319 Florianopolis Surf Vacation | Nexus Surf (Via The Internet Archive) Why Tim Ferriss Sold His Muse | Inc.com The Favorite Stoic Exercises of Tim Ferriss, Arianna Huffington, Robert Greene, and More | Daily Stoic How to Prioritize Your Life and Make Time for What Matters | The Tim Ferriss Show #304 Fear-Setting: The Most Valuable Exercise I Do Every Month | Tim Ferriss Why Bigger Goals = Less Competition | Tim Ferriss Tim Ferriss’ Princeton Challenge. Can You Do It? | r/Manprovement Postcard from Warren Buffett | The Real Josh (Via The Internet Archive) Seven Strange Questions That Help You Find Your Life Purpose | Mark Manson What Screams “Midlife Crisis?” | r/AskReddit How to Get George Bush or the CEO of Google on the Phone | Tim Ferriss Fail Better by Adam Gottesfeld | Princeton Alumni Weekly Ideal Lifestyle Costing (with Dreamlining Tools) | Tim Ferriss SHOW NOTES [00:00:00] Intro (D is for definition). [00:05:43] Beating the game, not playing the game. [00:10:11] Challenging the status quo vs. being stupid. [00:11:48] Retirement is worst-case-scenario insurance. [00:13:40] Interest and energy are cyclical. [00:15:06] Less is not laziness. [00:16:24] The timing is never right. [00:17:24] Ask for forgiveness, not permission. [00:18:01] Emphasize strengths, don’t fix weaknesses. [00:18:57] Things in excess become their opposite. [00:20:02] Money alone is not the solution. [00:21:24] Relative income is more important than absolute income. [00:24:13] Distress is bad, eustress is good. [00:25:59] Questions and actions. [00:27:45] Dodging bullets: fear-setting and escaping paralysis. [00:32:51] The power of pessimism: defining the nightmare. [00:36:59] Conquering fear = defining fear. [00:39:55] Uncovering fear disguised as optimism. [00:42:00] Someone call the Maître d’. [00:45:02] Questions and actions. [00:49:45] System reset: Being unreasonable and unambiguous. [00:53:13] Doing the unrealistic is easier than doing the realistic. [00:55:41] What do you want? A better question, first of all. [00:57:41] Adult-onset ADD: adventure deficit disorder. [00:59:44] The fat man in the red BMW convertible. [01:01:21] Correcting course: get unrealistic. [01:02:28] How to get George Bush or the CEO of Google on the phone. [01:08:41] Questions and actions and dreamlining calculations. PEOPLE MENTIONED Ray Porter Herbert Bayard Swope Oscar Wilde Dick Fosbury Donald Trump Joan Rivers Yoda Hans Keeling Benjamin Disraeli Seneca the Younger Yvon Chouinard James Dean Jean Cocteau Jean-Marc Hachey Mark Twain Lewis Carroll George Bernard Shaw Jennifer Lopez William J. Clinton J.D. Salinger Santa Claus Douglas Price Adam Gottesfeld Ryan Marrinan Randy Komisar Eric Schmidt Ed Zschau George H.W. Bush Taisen Deshimaru Samuel Beckett Nathan Kaplan Sharpe James Al Sharpton Viktor Frankl Michael Ellsberg Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tags4-hour workweek'''
