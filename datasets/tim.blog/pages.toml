lass="podcast-block__link-icon"/>Listen onOvercast #786: Tactics and Strategies for a 2025 Reboot — Essentialism and Greg McKeown<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/4ef7f8ce-ab08-4ead-b044-b19995e8b6e3/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Momentous high-quality supplements! Momentous offers high-quality supplements and products across a broad spectrum of categories, and I’ve been testing their products for months now. I’ve been using their magnesium threonate, apigenin, and L-theanine daily, all of which have helped me improve the onset, quality, and duration of my sleep. I’ve also been using Momentous creatine, and while it certainly helps physical performance, including poundage or wattage in sports, I use it primarily for mental performance (short-term memory, etc.). Their products are third-party tested (Informed-Sport and/or NSF certified), so you can trust that what is on the label is in the bottle and nothing else. If you want to try Momentous for yourself, you can use code Tim for 20% off your one-time purchase at LiveMomentous.com/Tim. And not to worry, my non-US friends, Momentous ships internationally and has you covered. This episode is brought to you by Eight Sleep. Temperature is one of the main causes of poor sleep, and heat is my personal nemesis. I’ve suffered for decades, tossing and turning, throwing blankets off, pulling them back on, and repeating ad nauseam. But a few years ago, I started using the Pod Cover, and it has transformed my sleep. Eight Sleep has launched their newest generation of the Pod: Pod 4 Ultra. It cools, it heats, and now it elevates, automatically. With the best temperature performance to date, Pod 4 Ultra ensures you and your partner stay cool in the heat and cozy warm in the cold. Plus, it automatically tracks your sleep time, snoring, sleep stages, and HRV, all with high precision. For example, their heart rate tracking is at an incredible 99% accuracy. Pod 4 Ultra also introduces an adjustable Base that fits between your mattress and your bed frame to add custom positions for the best sleeping experience. Plus, it automatically reduces your snoring when detected. Add it easily to any bed. And now, listeners of The Tim Ferriss Show can get $350 off of the Pod 4 Ultra for a limited time! Click here to claim this deal and unlock your full potential through optimal sleep. This episode is brought to you by Wealthfront! Wealthfront is a financial services platform that offers services to help you save and invest your money. Right now, you can earn 4.00% APY—that’s the Annual Percentage Yield—with the Wealthfront Brokerage Cash Account through its network of partner banks. That’s nearly ten times more interest than a savings account at a bank, according to FDIC.gov as of December 16, 2024. It takes just a few minutes to sign up, and then you’ll immediately start earning 4.00% APY interest on your short-term cash until you’re ready to invest. And when new clients open an account today, they can get an extra fifty-dollar bonus with a deposit of five hundred dollars or more. Visit Wealthfront.com/Tim to get started.Tim Ferriss receives cash compensation from Wealthfront Brokerage, LLC for advertising and holds a non-controlling equity interest in the corporate parent of Wealthfront Brokerage. See full disclosures here. Want to hear the last time Greg McKeown was on the podcast? Listen to our walk and talk conversation here where we discussed Greg’s system for effortless execution of daily tasks, poetic mysticism and matchmaking introspection, Maslow’s forgotten pinnacle of self-transcendence, why self-actualization is an insufficient foundation for meaningful relationships, the benefits of treating social media as an option rather than an obligation, blocking time for top priorities, why AI is a good servant but a poor master, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Greg McKeown: Website | Twitter | Facebook | Instagram The Essentialism Planner: A 90-Day Guide to Accomplishing More by Doing Less by Greg McKeown | Amazon Effortless: Make It Easier to Do What Matters Most by Greg McKeown | Amazon Essentialism: The Disciplined Pursuit of Less by Greg McKeown | Amazon Inspired Weekly Conversations | The Greg McKeown Podcast Join the “Less, But Better” Free 30-Day Email Course | Greg McKeown Walk & Talk with Greg McKeown — How to Find Your Purpose and Master Essentialism in 2024 | The Tim Ferriss Show #719 Greg McKeown — The Art of Effortless Results, How to Take the Lighter Path, the Joys of Simplicity, and More | The Tim Ferriss Show #510 Greg McKeown — How to Master Essentialism | The Tim Ferriss Show #355 How to Say “No” Gracefully and Uncommit | The Tim Ferriss Show #328 The Listener by James Christensen | The Collection Shop Essential Trade-offs and Saying Yes with Sam Bridgstock (Part 1) | The Greg McKeown Podcast #310 Essential Trade-offs and Saying Yes with Sam Bridgstock (Part 2) | The Greg McKeown Podcast #311 Meditation, Mindset, and Mastery | The Tim Ferriss Show #201 What My Morning Journal Looks Like | Tim Ferriss The Artist’s Way Morning Pages Journal: A Companion Volume to the Artist’s Way by Julia Cameron | Amazon How to Cage the Monkey Mind | The Tim Ferriss Show #175 David Allen — The Art of Getting Things Done (GTD) | The Tim Ferriss Show #384 Want to Know What Your Brain Does When It Hears a Question? | Fast Company Trends in Counseling and Psychotherapy | American Psychologist Top 10 Influential Psychotherapists | Mind Hacks Carl Rogers Bot | ChatGPT The Fresh Start Effect: Temporal Landmarks Motivate Aspirational Behavior | Management Science Whenever Resolutions: How to Use Temporal Landmarks to Pursue Your Goals | Getting Simple Personal Quarterly Offsite Meetings | DennisKennedy.Blog Let’s Unpack the Notion of Courage | The Ethics Centre Microbursts: One Key to Getting Things Done | Susan Kelley Are You an Insecure Overachiever? | BBC The Stoic Art of Negative Visualization | Daily Stoic Premortem Analysis: Anticipate Failure to Achieve Success | SkillPacks The Collapse of Complex Societies by Joseph A. Tainter | Amazon Michael Phelps and Grant Hackett — Two Legends on Competing, Overcoming Adversity, Must-Read Books, and Much More | The Tim Ferriss Show #494 Ridiculousness | MTV The Best of Rob & Big | Prime Video Systems You Need to 10 X with Rob Dyrdek (Part 1) | The Greg McKeown Podcast #129 Machine Living: Operating System for Your Life with Rob Dyrdek (Part 2) | The Greg McKeown Podcast #131 Rob Dyrdek on the Advantages of Being Part Alien, Creating a “Rhythm of Experience” Document, and the Four Stages to an Extraordinary Lifestyle | The Greg McKeown Podcast #86 Life Operating System: The Rhythm of Your Existence | Beyond Time How to Design Your Rhythm of Existence | Build With Rob The 1-2-3 Method | The Greg McKeown Podcast #225 1-Minute Wednesday No. 169: Tuning out the Noise: How the ‘Power Half an Hour’ Can Help You Accomplish What’s Essential by Greg McKeown | LinkedIn Tools of Titans: The Tactics, Routines, and Habits of Billionaires, Icons, and World-Class Performers by Tim Ferriss | Amazon Jerry Seinfeld, Ichiro Suzuki, and the Pursuit of Mastery | SatPost by Trung Phan Man’s Search for Meaning by Viktor Frankl | Amazon Radical Gratitude: How to Turn Your Pain into Peace | Tiny Buddha ‘When My Daughter Suffered a Mysterious Illness, I Decided the Best Thing to Do Was Nothing’ | The Telegraph A Grief Observed by C.S. Lewis | Amazon Thoughts on A Grief Observed by C.S. Lewis | Novel Insights Sonder: The Realization That Everyone Has A Story | A Lust For Life Did Robin Williams Say, ‘Everyone You Meet Is Fighting a Battle You Know Nothing About’? | Snopes.com Chris Bosh on How to Reinvent Yourself, The Way and The Power, the Poison of Complaining, Leonardo da Vinci, and More | The Tim Ferriss Show #515 Memorial Church & Companion Spaces | Stanford University The Power of True Connection with Erik Newton | The Greg McKeown Podcast #271 SHOW NOTES [00:05:12] Handling destabilizing events and personal turmoil. [00:10:47] Writing as therapy and “screaming onto the page.” [00:13:35] Using Morning Pages and AI tools for personal reflection. [00:17:52] Carl Rogers and the power of deep listening. [00:20:33] Reviewing the core concepts of Essentialism and Effortless. [00:24:54] Temporal landmarks and the fresh start effect. [00:29:25] Personal quarterly offsites and the importance of direction over speed. [00:31:13] The three essential questions for quarterly reviews. [00:34:16] Making essential tasks effortless — practical examples and strategies. [00:37:03] The law of inverse prioritization — why important things don’t get done. [00:38:45] Strategies for making tasks simpler — the microburst concept. [00:44:37] The courage to be rubbish. [00:47:09] Pre-mortems and anticipating obstacles. [00:52:37] Michael Phelps’ preparation and routine. [01:07:31] The 1-2-3 method and defining what “done” looks like. [01:15:19] Meaning over productivity, and making vs. managing. [01:23:14] Radical gratitude and finding meaning in suffering. [01:36:43] Parting thoughts on deep connection and listening. MORE GREG MCKEOWN QUOTES FROM THE INTERVIEW “I think all of us are prisoners to the way our mind currently works, and we’re prisoners until we become observers to it.”— Greg McKeown “That process of screaming into the page, of letting it all out, separating ourselves from that discombobulating internal state, is extremely powerful because it helps us to go from prisoner to observer. And then from observer, I think once we start observing, we are better able to become a creator, so I think that’s the shift.” — Greg McKeown “Changing the ratio of consumption to creation is one self-evident shift that I think a lot of people would benefit in.” — Greg McKeown “Insecure overachievers can endlessly complicate any task to an infinite degree. … If you don’t know what done looks like, you cannot be done.” — Greg McKeown “Radical gratitude is expressing thanks for things you’re not thankful for, because that’s what gratitude actually is.” — Greg McKeown “Essentialism, in one word, would be ‘focus.’ Effortless, in one word, would be ‘simplification.'” — Greg McKeown “Essentialism is figuring out what the right thing is to do, and Effortless is to do it in the right way.” — Greg McKeown “One of the principles in Effortless is the courage to be rubbish and doing it in a shorter period of time.” — Greg McKeown “I think most addictions really are, at the core, to avoid the experience of being alive. And that’s because it’s so painful to be alive.” — Greg McKeown “We live in a time where it’s so easy to have what I would describe as counterfeit agility. So you’re moving fast, life feels fast, life is fast, and you’re taking messages, you’re sending messages, and you’re doing things, but actually, they don’t add up to a lot of progress toward what matters.” — Greg McKeown “What I have learned is this strange law of inverse prioritization. … The most important thing in our lives at any given time is the least likely thing to get done, which is really strange.” — Greg McKeown “Courage is a virtue, but courage always feels terrible. It is an awful feeling. It’s not like you imagine when you see other people being courageous.” — Greg McKeown “If you think about the future as only a perfect, best-case scenario, you are setting yourself up for really frustrating, stressful, poor execution.” — Greg McKeown PEOPLE MENTIONED Sam Bridgstock David Allen Carl Rogers Sigmund Freud Scrooge McDuck Anna McKeown Rob Dyrdek Warren Buffett John D. Rockefeller Joseph Tainter Michael Phelps Bob Bowman Trung T. Phan Jerry Seinfeld Ichiro Suzuki Viktor Frankl Eve McKeown C.S. Lewis Chris Bosh Erik Newton Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: TagsEffortless, Essentialism, Greg McKeown'''
