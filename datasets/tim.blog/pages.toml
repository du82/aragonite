full_description = 'Posted on March 13, 2024April 7, 2024 by Tim FerrissHugh Howey, Author of Silo and Wool — A Masterclass on Writing, Unorthodox Self-Publishing, and Living in The AI Age (#726) 6 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="480" src="https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration.jpeg?resize=600%2C480&#038;ssl=1" alt="" class="wp-image-73716" style="width:840px;height:auto" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?resize=1024%2C819&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?resize=300%2C240&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?resize=768%2C614&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?resize=1536%2C1229&amp;ssl=1 1536w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?resize=2048%2C1638&amp;ssl=1 2048w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/03/Hugh-Howey-Illustration-scaled.jpeg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" />Illustration via 99designs “You have to have loftier goals than your expected outcome.” — Hugh Howey Hugh Howey (@hughhowey) is the New York Times bestselling author of Wool, Beacon 23, Sand, Machine Learning, Half Way Home, and more than a dozen other novels. His Silo trilogy was recently adapted by Apple TV, becoming their #1 drama of all time. A series based on his novel Beacon 23, starring Lena Headey, also released last year, with season two due in March. Hugh’s works have been translated into more than 40 languages and have sold millions of copies around the world. He lives in New York City with his wife Shay. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, Google Podcasts, Amazon Music, or on your favorite podcast platform. Watch the interview on YouTube here. Brought to you by Wealthfront high-yield savings account, Momentous high-quality supplements, and Helix Sleep premium mattresses. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #726: Hugh Howey, Author of Silo and Wool — A Masterclass on Writing, Unorthodox Self-Publishing, and Living in The AI Age<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/2a339c51-78b7-4350-a008-bb31d77b6345/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Wealthfront! Wealthfront is a financial services platform that offers services to help you save and invest your money. Right now, you can earn 4.00% APY—that’s the Annual Percentage Yield—with the Wealthfront Brokerage Cash Account through its network of partner banks. That’s nearly ten times more interest than a savings account at a bank, according to FDIC.gov as of December 16, 2024. It takes just a few minutes to sign up, and then you’ll immediately start earning 4.00% APY interest on your short-term cash until you’re ready to invest. And when new clients open an account today, they can get an extra fifty-dollar bonus with a deposit of five hundred dollars or more. Visit Wealthfront.com/Tim to get started.Tim Ferriss receives cash compensation from Wealthfront Brokerage, LLC for advertising and holds a non-controlling equity interest in the corporate parent of Wealthfront Brokerage. See full disclosures here. This episode is brought to you by Momentous high-quality supplements! Momentous offers high-quality supplements and products across a broad spectrum of categories, and I’ve been testing their products for months now. I’ve been using their magnesium threonate, apigenin, and L-theanine daily, all of which have helped me improve the onset, quality, and duration of my sleep. I’ve also been using Momentous creatine, and while it certainly helps physical performance, including poundage or wattage in sports, I use it primarily for mental performance (short-term memory, etc.). Their products are third-party tested (Informed-Sport and/or NSF certified), so you can trust that what is on the label is in the bottle and nothing else. If you want to try Momentous for yourself, you can use code Tim for 20% off your one-time purchase at LiveMomentous.com/Tim. And not to worry, my non-US friends, Momentous ships internationally and has you covered. This episode is brought to you by Helix Sleep! Helix was selected as the best overall mattress of 2024 by Forbes, Fortune, and Wired magazines and many others. With Helix, there’s a specific mattress to meet each and every body’s unique comfort needs. Just take their quiz—only two minutes to complete—that matches your body type and sleep preferences to the perfect mattress for you. They have a 10-year warranty, and you get to try it out for a hundred nights, risk-free. They’ll even pick it up from you if you don’t love it. And now, Helix is offering between 20% and 27% off all mattress orders at HelixSleep.com/Tim. What was your favorite quote or lesson from this episode? Please let me know in the comments. Want to hear another episode with someone who builds fictional worlds for a living? Listen to my most recent conversation with The School for Good & Evil author Soman Chainani, in which we discussed giving stories away, the art of Christopher Marley, potentially gay bulls, career lessons from Taylor Swift, cross-collar dating, dodgy allergies, the life-changing power of ketamine, hookups, and much more. #720: Life Lessons from Taylor Swift, Conquering Anxiety, Coaching Teens, Career Reinvention, Supposedly Gay Bulls, Your Shadow Side, and More — Soman Chainani<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/bfe53fcc-4a26-4e57-ac32-0d62a86190b8/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> SELECTED LINKS FROM THE EPISODE Connect with Hugh Howey: Website | Twitter | Facebook | Instagram The Silo Series Boxed Set: Wool, Shift, Dust, and Silo Stories by Hugh Howey | Amazon Silo | Apple TV+ Beacon 23: The Complete Novel by Hugh Howey | Amazon Beacon 23 | Prime Video Sand by Hugh Howey | Amazon Machine Learning: New and Collected Stories by Hugh Howey | Amazon Half Way Home by Hugh Howey | Amazon So You Want to be a Writer… | Hugh Howey The Complete Hitchhiker’s Guide to the Galaxy by Douglas Adams | Amazon Ender’s Game by Orson Scott Card | Amazon Hugh Howey: Winning at the Self-Publishing Game | The Knowledge Project Podcast #63 The Bern Saga by Hugh Howey | Amazon Celebrating 100 Years | Simon & Schuster A Publishing Contract Should Not Be Forever | The Authors Guild Ten Things Nobody Tells You About the Publishing Industry | Publishers Weekly What Is Stockholm Syndrome? It All Started with a Bank Robbery 50 Years Ago | AP News Imposter Syndrome: Why You May Feel Like a Fraud | Verywell Mind The 4-Hour Workweek: Escape 9-5, Live Anywhere, and Join the New Rich by Tim Ferriss | Amazon Best Sellers | The New York Times The Murky Path To Becoming a New York Times Best Seller | Esquire CreateSpace | Kindle Direct Publishing Dedicated to Serving the Book Industry | Ingram Content Group A Guide to Book Publishing Rights | Amita Parikh Literary Agents Discuss Foreign Rights and the International Book Market | Jane Friedman Power Laws: How Nonlinear Relationships Amplify Results | Farnam Street Blog Hugh Howey (Author of Wool Omnibus) | Goodreads My Advice to Aspiring Authors | Hugh Howey Don’t Like to Write, But Like Having Written | Quote Investigator What We Find When We Get Lost in Proust | The New Yorker This Is How You Lose the Time War by Amal El-Mohtar | Amazon Circe by Madeline Miller | Amazon Tomorrow, and Tomorrow, and Tomorrow: A Novel by Gabrielle Zevin | Amazon The Lincoln Highway: A Novel by Amor Towles | Amazon Table for Two: Fictions by Amor Towles | Amazon Why Rappers Love Grey Poupon | Vox Writing About My Father | Hugh Howey The Power of Story | Hugh Howey 1,000 True Fans by Kevin Kelly | The Technium Who Are the Big Five Publishers? | Aspiring Author Highlander: The Movie | Prime Video The Three Breakthroughs That Have Finally Unleashed AI on the World | Wired The Upside of Artificial Intelligence Development | Wired The Creator of ‘Silo’ Says Same-Day AI Movies Are Coming Soon | Wired Why I Write About AI | Hugh Howey The First Emotionally Intelligent AI | Pi The AI Companion Who Cares | Replika Sheila Conversational AI | App Store AI Won’t Replace Humans — But Humans with AI Will Replace Humans without AI | Harvard Business Review The Beginning to the End of the Universe: The Big Crunch vs. The Big Freeze | Astronomy What is CRISPR? | New Scientist How Cheap Drones Are Transforming Warfare in Ukraine | The Economist The Race to a Battery-Powered Future | The Brink With NVIDIA Up 80% This Year, Are There Any AI Crypto Tokens You Should Be Buying Now? | The Motley Fool Surgical Sperm Extraction | HFEA By 02060 the Total Population of Humans on Earth Will Be Less than It Is Today. | Long Bets World Population Growth Is Expected to Nearly Stop By 2100 | Pew Research Center What to Expect at a Shabbat Dinner | Chabad.org How Long Until We’re All Amish? by Lyman Stone | Medium The Power of Myth — The Hero’s Adventure with Joseph Campbell and Bill Moyers | The Tim Ferriss Show #456 The Brains of Believers and Non-Believers Work Differently | Psychology Today Everybody Worships: David Foster Wallace on Real Freedom and the Skeleton of Every Great Story | Mockingbird This is Water by David Foster Wallace (Full Transcript and Audio) | Farnam Street This Is Water: Some Thoughts, Delivered on a Significant Occasion, about Living a Compassionate Life by David Foster Wallace | Amazon Atheists Can Be Dogmatic | Discover Magazine Consider Revising Celibacy Rule for Catholic Priests, Vatican Official Says | The Guardian Married Catholic Priests? They Exist, and Here’s How | Baltimore Sun C.S. Lewis and Eight Reasons for Believing in Objective Morality | Moral Apologetics Why Do We Clean? | Hugh Howey Justice with Michael Sandel | Harvard University The Iliad by Homer | Amazon The Golden Rule | Internet Encyclopedia of Philosophy Roland Griffiths, PhD — Life’s Ultimate Glide Path, An Unexpected Stage IV Diagnosis, Facing Death, How Meditation and Psychedelics Can Help, and The Art of Living a Life of Gratitude | The Tim Ferriss Show #641 SHOW NOTES [06:48] Breaking the formula with a literary sleight of hand. [11:00] A commitment to 10 years of obscurity. [15:02] Buying back rights and self-publishing. [22:04] Why authors should strive for a reader-first vs. publisher-first mindset. [24:22] Hitting the NYT Best Sellers List with a self-pub book. [27:44] Pricing logic. [31:00] The undersold value of worldwide rights. [33:57] How authors can find deal leverage early on. [37:07] Establishing a daily writing habit. [41:34] Fiction that inspires better writing. [45:27] Collaboration vs. writing solo. [46:59] Ways the publishing industry protects the status quo. [49:55] Why Hugh makes publishing deals at all. [50:45] Self-promotion as therapy. [53:05] Keys to fruitful collaboration. [55:47] Common mistakes creatives make. [1:01:03] AI’s present-and-future impact on publishing. [1:06:05] AI-generated occupational and existential crises. [01:10:11] Mid-term optimist, long-term pessimist [01:14:57] Procreation in uncertain times. [01:19:07] The future of religion. [01:26:21] Free will and objective moral truth. [01:31:02] Parting thoughts. MORE HUGH HOWEY QUOTES FROM THE INTERVIEW “It might not be your best time as a professional or a human, but your best time as a writer is when you’re doing it for yourself and no one’s looking over your shoulder while you’re doing it.”— Hugh Howey “You have to write a book that you think one other human will find this the best book they’ve ever read.”— Hugh Howey “You don’t want a bad review, someone to pay $2.99 for something they read in an hour. No amount of money is worth the onslaught of one-star reviews from angry readers.”— Hugh Howey “Publishers used to think a book kind of burned out its welcome really quickly, and now they’re realizing books have really long tails — successful books — and if you can get an engaged readership on board, it’s worth so much money to have that engaged fandom.”— Hugh Howey “You have to have loftier goals than your expected outcome.”— Hugh Howey “A common mistake I see people make is thinking that readers won’t follow you across genres. So you see people spread out their name amongst different pen names. I’m going to write under this for sci-fi and under this for romance, and this is my nonfiction stuff. The brand is you. And if people enjoy your prose, they’ll follow you to other genres. So really consolidate your identity. Unless you have a reason to not write under your real name, embrace your writing under your real name and make sure that you are the brand. The more readers can feel a connection with the person behind the work, the better off your career will be.”— Hugh Howey “Trusting expertise can get you in trouble.”— Hugh Howey “Everything written more than a hundred years ago is all free to read and you can download them all. That has not stopped people from having amazing careers. So the idea that there’ll be too much to read and so no one will make a living, that’s always been true. I’m not sure what AI would change about that.”— Hugh Howey “I think there’s an existential crisis that we’re going to face when we realize what you and I do is computational. Our brains are large language models. We’re not that special. We can replicate the human soul in a lot of ways. I think people are going to have a hard time with that.”— Hugh Howey “If you try to decide on whether or not to have kids based on what kind of life you think they’re going to have, no one would have kids, because nothing’s a guarantee. Life is going to be weird.”— Hugh Howey PEOPLE MENTIONED Shay Lond'
