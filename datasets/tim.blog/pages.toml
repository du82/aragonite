full_description = '''Posted on June 9, 2015January 2, 2020 by Tim FerrissLearn How to Triple Your Reading Speed in 5 Minutes (Seriously) [VIDEO] 73 Comments Topics: CategoriesMental PerformanceShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint This short (<5 minutes) video will teach you how to triple your reading speed in less than 20 minutes. It works nearly immediately, and there is zero loss in comprehension. No voodoo, no pseudoscience — just two tricks for optimizing eye movement. Some of you learn better with text, and some of you learn better with video. As one commenter who watched the above video put it: “Tim, thanks so much for this video. I read your blog post about this like four times without being able to get it. With a video, it’s much easier.” Have fun, and I’d love to hear your results in the comments. If you enjoy this, you might also like my posts on rapid language learning, or my interview with champion memory competitor, Ed Cooke. You can stream the latter below: Ep 52: Ed Cooke, Grandmaster of Memory, on Mental Performance, Imagination, and Productive Mischief<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/b65c885f-03a8-439f-91b4-b2b5bb8b32c0/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Ep 53: Ed Cooke (Part 2), Grandmaster of Memory, on Mental Performance, Imagination, and Productive Mischief<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/502155eb-989c-4885-90c9-97b1bc59ab2e/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesMental PerformanceTags: Tagshow to speed read, speed read, speed reading, speedreading'''
