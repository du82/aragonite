e More Than They Expect by Will Guidara | Amazon Madison Square Garden Uses Facial Recognition to Ban Its Owner’s Enemies | The New York Times Eleven Madison Park Restaurant How Scaffolding Transforms Barriers into Stepping Stones | Career Insight Studio Hidden Potential: The Science of Achieving Greater Things by Adam Grant | Amazon 3D CAD, CAM, CAE, & PCB Cloud-Based Software | Autodesk The Strategy Deck | Porchlight Book Promotions Thinking in Bets: Making Smarter Decisions When You Don’t Have All the Facts by Annie Duke | Amazon Seahawks’ Pete Carroll Explains Ill-Fated Call In Super Bowl XLIX | NFL What Is Claude AI, and How Does It Compare to ChatGPT? | Pluralsight AI-Powered Answer Engine | Perplexity Too Big to Care. Enshittification Is a Choice. by Cory Doctorow | Medium SHOW NOTES [00:06:08] A home run for Seth? [00:06:35] What the word “strategy” means to Seth. [00:08:33] Real-world examples of good business strategies. [00:11:31] The core ingredients of enacting a successful strategy. [00:12:21] Systems. [00:19:00] Time. [00:23:06] Games. [00:27:30] Empathy. [00:33:04] Don’t try to burn big logs if you only have a little bit of kindling. [00:35:09] Systems don’t start out selfish, but resilient ones often end up that way. [00:40:40] Shortcut shortcomings. [00:43:30] Feedback loops. [00:45:52] The network effect. [00:52:15] Tension. [00:53:40] Affiliation status. [01:00:43] How early successes make later successes more likely. [01:06:05] Volunteer firemen. [01:07:05] Expanding the circle of now and circle of us. [01:09:41] Freedom from the feeling of fear. [01:11:02] Picking customers and competitors. [01:14:24] Guaranteeing attendance while building community. [01:20:45] Community leadership. [01:27:32] Perspective-changing exercises and scaffolding. [01:32:16] The Strategy Deck. [01:35:06] Good decisions vs. good outcomes. [01:39:51] How Seth avoids false proxies in the hiring process. [01:42:10] Gauging acceptance of feedback. [01:45:27] How Seth uses AI. [01:50:25] Enshittification. [01:52:41] Parting thoughts. MORE SETH GODIN QUOTES FROM THE INTERVIEW “When you pick your customers, you pick your future, and when you pick your competitors, you pick your future.”— Seth Godin “You don’t get better clients by doing a good job for bad clients; you get better clients by becoming the freelancer good clients want to hire.”— Seth Godin “Systems don’t start out selfish, but resilient ones often end up that way.”— Seth Godin “If you do average work for average pay, AI is going to be able to do it cheaper than you.”— Seth Godin “If you want to make change happen, you have to create tension on purpose. Not stress. Stress is bad. Stress is you’re trapped. Stress is life is bad. Stress is you want to leave, but you can’t. Tension is what happens if I pull a rubber band back and then let go.”— Seth Godin PEOPLE MENTIONED Bill Gates Howard Schultz Marissa Mayer Donella Meadows James Gleick H.G. Wells Stephen Breyer Sergey Brin Jeff Bezos Jack Welch Shawn Askinosie Ilana Glazer Robert Rodriguez Richard Garfield Helene Godin Taylor Swift Tim Cook Stephen King Elmore Leonard Tina Brown Ted Sarandos James Clear Gina Bianchini Jim Killoran Ayn Rand Ray Kroc Henry Ford Frederick Winslow Taylor Larry Page Will Guidara James L. Dolan Annie Duke Pete Carroll Chip Kidd Cory Doctorow Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tagsseth godin'''
