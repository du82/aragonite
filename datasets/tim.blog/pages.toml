full_description = 'Posted on May 9, 2024May 17, 2024Magic Pill — Johann Hari and the New “Miracle” Weight-Loss Drugs Ozempic and other GLP-1 receptor agonists have skyrocketed in popularity as a treatment for obesity, promising rapid weight-loss at a hefty price. “Miracle drug” is one of the descriptors use by celebrities, influencers, and many journalists. I have so far held off on first-hand experience (Related read: No Biological Free Lunches), and I suggest reading … Continue reading “Magic Pill — Johann Hari and the New “Miracle” Weight-Loss Drugs” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2011/01/5406429807_a80ca7e1f2.jpg?fit=500%2C375&#038;ssl=1" alt="You Don&#8217;t Need More How-To Advice — You Need a Beautiful and Painful Reckoning"/> Posted on February 9, 2024February 12, 2024You Don’t Need More How-To Advice — You Need a Beautiful and Painful Reckoning Most people have an insufficient reason for action. The pain isn’t painful enough. It’s a nice-to-have, not a must-have. There has been no “Harajuku Moment.” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/For-blog-post-preview-on-web-scaled.jpg?fit=600%2C600&#038;ssl=1" alt="No Biological Free Lunches"/> Posted on February 2, 2024February 2, 2024No Biological Free Lunches It’s alarming how many folks now treat “T” or “TRT” (testosterone replacement therapy) as something akin to taking a multivitamin, when they never would have considered taking androgenic-anabolic steroids (AAS) a few years earlier. Like Patagonian toothfish has become Chilean sea bass on fashionable menus worldwide, it’s quite the rebrand story, but that doesn’t change the underlying biology. <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2021/07/Dr.-Andrew-Huberman--scaled.jpeg?fit=600%2C480&#038;ssl=1" alt="Dr. Andrew Huberman — A Neurobiologist on Optimizing Sleep, Enhancing Performance, Reducing Anxiety, Increasing Testosterone, and Using the Body to Control the Mind (#521)"/> Posted on July 6, 2021December 5, 2023Dr. Andrew Huberman — A Neurobiologist on Optimizing Sleep, Enhancing Performance, Reducing Anxiety, Increasing Testosterone, and Using the Body to Control the Mind (#521) Interview with Dr. Andrew Huberman on The Tim Ferriss Show podcast'
