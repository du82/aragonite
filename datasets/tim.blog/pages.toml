aw and serve, and the prep work eats up time I’d rather spend hiking with Molly. Sundays for Dogs solves my problem with air-dried, high-quality dog food I can store and pour right from my pantry. ​The magic behind Sundays for Dogs is in their proprietary air-drying method. To lock in nutrients, they gently dry the meat, low and slow. Unlike other dry brands, which are filled with hyper-processed grains and synthetic vitamins, Sundays for Dogs uses only all-natural poultry and USDA-grade beef. And meat makes up 90% of their recipes. The other 10% are fruits and veggies, ingredients you’d find at the farmer’s market, not at the pharmacy. Get 50% off your first order of Sundays for Dogs by going to SundaysForDogs.com/TIM or by using code TIM at checkout. Upgrade your pup to Sundays for Dogs and feel great about the food you feed your best friend. This episode is brought to you by ShipStation. Do you sell stuff online? Then you know what a pain the shipping process is. ShipStation was created to make your life easier. Whether you’re selling on eBay, Amazon, Shopify, or over 100 other popular selling channels, ShipStation lets you access all of your orders from one simple dashboard, and it works with all of the major shipping carriers, locally and globally, including FedEx, UPS, and USPS. Tim Ferriss Show listeners get to try ShipStation free for 60 days. Just visit ShipStation.com/Tim! Want to hear the episode with David Deutsch and Naval? Listen to our conversation here in which we discussed dispelling common misconceptions about science, the four strands and the benefits of understanding them, how quantum computing arose from trying to test a multiverse theory, what a good explanation looks like, how conjecture and criticism can give us a basis for optimism, AI vs. AGI, Taking Children Seriously, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Aaron Stupple: Website | Twitter Connect with Naval Ravikant: Website | Twitter | Airchat The Sovereign Child: How a Forgotten Philosophy Can Liberate Kids and Their Parents by Aaron Stupple and Logan Chipkin | Amazon Advancing Critical Rationalism | Conjecture Institute A New View of Children | Taking Children Seriously Dr. Becky Kennedy — Parenting Strategies for Raising Resilient Kids, Plus Word-for-Word Scripts for Repairing Relationships, Setting Boundaries, and More | The Tim Ferriss Show #784 David Deutsch and Naval Ravikant — The Fabric of Reality, The Importance of Disobedience, The Inevitability of Artificial General Intelligence, Finding Good Problems, Redefining Wealth, Foundations of True Knowledge, Harnessing Optimism, Quantum Computing, and More | The Tim Ferriss Show #662 Epistemology | Stanford Encyclopedia of Philosophy What Is Feminism? | International Women’s Development Agency The Lindy Effect | ModelThinkers Orajel Kids Paw Patrol Anti-Cavity Fluoride Toothpaste | Amazon The Scientist in the Crib: What Early Learning Tells Us About the Mind by Alison Gopnik , Andrew N. Meltzoff, and Patricia K. Kuhl | Amazon How Experience Changes Brain Plasticity (Neuroplasticity) | Verywell Mind Your Fat Cells Never Disappear — Making Future Weight Gain More Likely | Discover Magazine Summerhill School: A New View of Childhood by A.S. Neill and Albert Lamb | Amazon Lord of the Flies by William Golding | Amazon Objectified | Prime Video Strategic Design & Innovation Consulting Firm | Smart Design Make Your Mark | Frog Design UNO | Amazon Pokémon Assorted Cards | Amazon The Convoluted History of the Double-Helix | Royal Society The Four Humors, Explained | Patrick Kelly What Are Newton’s Laws of Motion? | Space Einstein’s Law of Motion | ProofWiki Tools of Titans: The Tactics, Routines, and Habits of Billionaires, Icons, and World-Class Performers by Tim Ferriss | Amazon Unschooling vs. Homeschooling — What’s the Difference? | Unschooling Mom2Mom AGI (with David Deutsch) | Reason