osopher. [01:02:59] An aside defining counterfactuals. [01:07:15] What makes understanding analytic philosophy a worthwhile endeavor? [01:10:29] What readers can expect of Laurie’s book, Transformative Experience. [01:12:30] Epistemology. [01:13:15] How to maintain a passion for philosophy. [01:17:21] Commonly misrepresented philosophical concepts. [01:19:59] Continental philosophy. [01:21:48] Philosophy beyond the academic. [01:23:46] Laurie vs. Agnes Callard. [01:25:34] Aristotle vs. drugs. [01:32:01] Thoughts on life’s final transformative experience: death. [01:35:48] Forgiving the philosophers and other parting thoughts. MORE L. A. PAUL QUOTES FROM THE INTERVIEW “I care very much about the nature of how we live our lives, the kinds of struggles that individual people have. I’m fascinated by the fact that all of us have these internal worlds, and then there’s some way in which we all have these internal worlds, and then these internal worlds have to kind of coexist with the external world, and we have'
