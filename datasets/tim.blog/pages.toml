description = 'Lo and behold! Please find transcripts for all current episodes of The Tim Ferriss Show podcast below! (Click here to be taken to the most recent transcripts.) They go all the way back to episode #1 with my dear friend, world-class investor and entrepreneur Kevin Rose, who nicknamed the show “TimTimTalkTalk” in the first few minutes of … Continue reading "All Transcripts from The Tim Ferriss Show!"'
full_description = 'Posted on September 20, 2018February 27, 2025 by Tim FerrissAll Transcripts from The Tim Ferriss Show! 127 Comments Topics: CategoriesThe Tim Ferriss Show, The Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="500" height="334" src="https://i0.wp.com/tim.blog/wp-content/uploads/2017/06/tim-ferriss-tools-of-titans.jpg?resize=500%2C334&#038;ssl=1" alt="" class="wp-image-33114" style="width:600px;height:undefinedpx" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2017/06/tim-ferriss-tools-of-titans.jpg?w=500&amp;ssl=1 500w, https://i0.wp.com/tim.blog/wp-content/uploads/2017/06/tim-ferriss-tools-of-titans.jpg?resize=360%2C240&amp;ssl=1 360w, https://i0.wp.com/tim.blog/wp-content/uploads/2017/06/tim-ferriss-tools-of-titans.jpg?resize=300%2C200&amp;ssl=1 300w" sizes="(max-width: 500px) 100vw, 500px" /> Lo and behold! Please find transcripts for all current episodes of The Tim Ferriss Show podcast below! (Click here to be taken to the most recent transcripts.) They go all the way back to episode #1 with my dear friend, world-class investor and entrepreneur Kevin Rose, who nicknamed the show “TimTimTalkTalk” in the first few minutes of its existence. Ah, the early days… There are currently more than 750 transcripts. Newer transcripts will be added as they are published and will also be listed under the site topic The Tim Ferriss Show Transcripts. Each link below will take you directly to that episode’s transcript. (Click here to be taken to the most recent transcripts.) Enjoy! * * * Before you dig in, please read the below, which applies to every transcript, and which I sadly need to post due to previous legal headaches and related misbehavior… Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. * * * Click here to be taken to the most recent transcripts. #1: Kevin Rose #2: Joshua Waitzkin #3: Kelly Starrett and Dr. Justin Mager #4: Ryan Holiday #5: Jason Silva #6: 6 Formulas for More Output and Less Overwhelm #7: Stephen Dubner, co-author of Freakonomics #8: Chase Jarvis, Master Photographer #9: The 9 Habits to Stop Now — The Not-To-Do List #10: Brian Koppelman, co-writer/producer of Rounders, Ocean’s Thirteen, The Illusionist, etc. #11: Drugs and the Meaning of Life #12: Dr. Rhonda Patrick on Life Extension, Performance, and More #13: “Productivity” Tricks for the Neurotic, Manic-Depressive, and Crazy (Like Me) #14: Sam Harris, PhD — Spirituality, Neuroscience, Meditation, and More #15: Neil Strauss — Author of The Game and 7 New York Times Bestsellers #16: Joe De Sena on Grit, Endurance, and Building Empires #17: The Power of Negative Visualization (<10 Minutes) #18: James Altucher on Saying No, Failing Better, Business Building, and More #19: The Top 5 Reasons to Be a Jack of All Trades #20: Dan Carlin — Hardcore History, Building Podcasts, Creativity, and More #21: Mike Shinoda of Linkin Park — On Music, Creativity, Selling 60+ Million Albums #22: Ed Catmull, President of Pixar, on Steve Jobs, Stories, and Lessons Learned #23: Do “Homeopathic” Remedies or Medicine Work? #24: Kevin Rose — Gut Bacteria, Meditation, Startups, and More #25: Kevin Kelly — WIRED Co-Founder, Polymath, Most Interesting Man In The World #26: Kevin Kelly (Part 2) — WIRED Co-Founder, Polymath, Most Interesting Man In The World #27: Kevin Kelly (Part 3) – WIRED Co-Founder, Polymath, Most Interesting Man In The World #28: Peter Thiel, Billionaire Investor and Company Creator on Investing, Business, and Life #29: What I Learned Losing a Million Dollars, with Author Brendan Moynihan #30: Tracy DiNunzio, Founder of Tradesy, on High-Velocity Growth and Tactics #31: Tracy DiNunzio (Part 2), Founder of Tradesy, on Rapid Growth and Rapid Learning #32: Tracy DiNunzio (Part 3), Founder of Tradesy, on Rapid Growth and Rapid Learning #33: Ramit Sethi on Persuasion, Negotiation, and Turning a Blog Into a Multi-Million-Dollar Business #34: Ramit Sethi (Part 2) on Persuasion, Negotiation, and Turning a Blog Into a Multi-Million-Dollar Business #35: Tony Robbins and Peter Diamandis (XPRIZE) on the Magic of Thinking BIG #36: Alexis Ohanian on Y Combinator, Getting Punched, and Picking Winners #37: Tony Robbins on Morning Routines, Peak Performance, and Mastering Money #38: Tony Robbins (Part 2) on Morning Routines, Peak Performance, and Mastering Money #39: Maria Popova on Writing, Work Arounds, and Building BrainPickings.org #40: Andrew Zimmern on Simple Cooking Tricks, Developing TV, and Addiction #41: Rolf Potts on Travel Tactics, Creating Time Wealth, and Lateral Thinking #42: Rolf Potts (Part 2) on Travel Tactics, Creating Time Wealth, and Lateral Thinking #43: Margaret Cho on Comedy, Bisexuality, and The Slow-Carb Diet #44: How to Avoid Decision Fatigue (<20 Min) #45: Nick Ganju on The Majesty of Ping Pong, Poker, and How to Write Hit Songs #46: Hating Tech, Hidden Japanese Gems, Sexual Awkwardness, and More #47: Bryan Callen on Eating Corgis (Yes, The Dogs) and Improving Creativity #48: Marc Goodman, FBI Futurist, on High-Tech Crime and How to Protect Yourself #49: Tim Answers Your 10 Most Popular Questions #50: Dr. Peter Attia on Ultra-Endurance, Drinking Jet Fuel, Human Foie Gras, and More #51: Tim Answers 10 More Popular Questions from Listeners #52: Ed Cooke, Grandmaster of Memory, on Mental Performance, Imagination, and Productive Mischief #53: Ed Cooke (Part 2), Grandmaster of Memory, on Mental Performance, Imagination, and Productive Mischief (Scroll to page 24 for Ep 53 [Part 2].) #54: The Promises and Perils of the Microbiome — Dr. Jonathan Eisen and Jessica Richman #55: The Science of Strength and Simplicity with Pavel Tsatsouline #56: How to Think Like Elon Musk and Jeff Bezos #57: Pavel Tsatsouline Answers Your 15 Most Popular Exercise Questions #58: How to Create a Blockbuster Podcast (Part 1) #59: How to Create a Blockbuster Podcast (Part 2) #60: Tim Ferriss Interviews Arnold Schwarzenegger on Psychological Warfare (And Much More) #61: The Benevolent Dictator of the Internet, Matt Mullenweg #62: The EDM Cinderella — How The Glitch Mob Exploded #63: Hedge Funds, Investing, and Optimizing Lifestyle (Mark Hart, Raoul Pal) #64: CrossFit’s Good, Bad, and Ugly #65: Supplements, Blood Tests, and Near-Death Experiences (Dr. Peter Attia) #66: The Psychedelic Explorer’s Guide — Risks, Micro-Dosing, Ibogaine, and More #67: Amanda Palmer on How to Fight, Meditate, and Make Good Art #68: Lazy: A Manifesto (only available as audio due to copyright reasons) #69: Inside the Mind of Glenn Beck Is… Walt Disney and Orson Welles? #70: How to Earn Your Freedom (only available as audio due to copyright reasons) #71: The Master Creator — How Jon Favreau Went from Swingers to Elf to Ironman to Chef #72: Triple H on Pre-Fight Rituals, Injury Avoidance, and Floyd Mayweather, Jr. #73: A Chess Prodigy on Mastering Martial Arts, Chess, and Life (only available as audio due to copyright reasons) #74: How a Computer Hacker Optimizes Online Dating, Opens Locked Cars, and Hijacks Drones Part 1 & Part 2 #75: Tools and Tricks from the #30 Employee at Facebook #76: Rick Rubin, The Seclusive Zen Master #77: What Do Google X, Medicine, and Great Relationships Have In Common? #78: How to Build a Large Audience from Scratch (and More) #79: Chris Sacca on Being Different and Making Billions #80: Thomas Edison’s Formula for Greatness (only available as audio due to copyright reasons) #81: The Rags to Riches Philosopher: Bryan Johnson’s Path to $800 Million #82: Sam Kass on Trials by Fire and Cooking for The Obamas #83: The Maverick of Brain Optimization #84: How to Turn Pain Into Creativity (Whitney Cummings) #85: Kelly Starrett on the 80/20 of Mobility and Performance (The podcast source for this episode may be found here.) #86: General Stan McChrystal on Eating One Meal Per Day, Special Ops, and Mental Toughness #87: Sam Harris on Daily Routines, The Trolley Scenario, and 5 Books Everyone Should Read #88: Stanley McChrystal on Anti-War Americans, Pushing Your Limits, and The Three Military Tests You Should Take #89: Laird Hamilton, The King of Big Wave Surfing (Plus: Gabrielle Reece and Brian MacKenzie) #90: Peter Diamandis on Disrupting the Education System, The Evolution of Healthcare, and Building a Billion-Dollar Business #91: Charles Poliquin on Strength Training, Shredding Body Fat, and Increasing Testosterone and Sex Drive #92: Maria Popova on Being Interesting, Creating More Time in a Day, And How to Start A Successful Blog #93: Jane McGonigal on Getting More Done with Less Stress and The Health Benefits of Gaming #94: Tara Brach on Meditation and Overcoming FOMO (Fear Of Missing Out) #95: Lessons Learned from Jeff Bezos, Reid Hoffman, and More #96: Kevin Kelly on Artificial Intelligence and Designer Babies #97: The Evolutionary Angel, Naval Ravikant #98: The “Wizard” of Hollywood, Robert Rodriguez #99: How to Build a World-Class Network in Record Time #100: Brene Brown on Vulnerability and Home Run TED Talks #101: The Oracle of Silicon Valley, Reid Hoffman (Plus: Michael McCullough) #102: “The Iceman,” Wim Hof #103: Drunk Dialing Fans — Celebrating The 100th Podcast Episode! #104: Are Psychedelic Drugs the Next Medical Breakthrough? #105: 5 Morning Rituals That Help Me Win the Day #106: Scott Adams: The Man Behind Dilbert #107: The Scariest Navy SEAL I’ve Ever Met… And What He Taught Me #108: Comedy’s Dynamic Duo, Seth Rogen and Evan Goldberg #109: The 5 Things I Did To Become a Better Investor #110: The Tattooed Heretic of Wine and Whiskey, Richard Betts #111: Should You Start a Startup or Build a Cash-Flow Business? #112: The Nasty Icon of Retail, Sophia Amoruso #113: 5 Tools I Use For Faster And Better Sleep #114: The Athlete (And Artist) Who Cheats Death, Jimmy Chin #115: Thinking About Extra Dimensions with Physicist Lisa Randall #116: How Casey Neistat Gets Away With Murder #117: Dom D’Agostino on Fasting, Ketosis, and The End of Cancer #118: How Philosophy Can Change Your Life, Alain de Botton #119: Kevin Costner on Building His Career, Positive Self-Talk, and Making Dances with Wolves Happen #120: Will MacAskill on Effective Altruism, Y Combinator, and Artificial Intelligence #121: BJ Novak of The Office on Creative Process, Handling Rejection, and Good Comedy #122: The Magic of Mindfulness: Complain Less, Appreciate More, and Live a Better Life #123: Rainn Wilson on Meditation, The Sexy Nostril Exercise, and Acting as Therapy #124: Jamie Foxx on Workout Routines, Success Habits, and Untold Hollywood Stories #125: Derek Sivers on Developing Confidence, Finding Happiness, and Saying “No” to Millions #126: 25 Great Things I Learned from Podcast Guests in 2015 #127: Amelia Boone on Beating 99% of Men and Suffering for a High-Performance Life #128: Derek Sivers Reloaded — On Success Habits and Billionaires with Perfect Abs #129: Recommendations and Resolutions for 2016 — Kevin Rose and Tim Ferriss #130: Daymond John and How to Turn Weaknesses into Strengths #131: Eric Weinstein on Challenging Reality, Working with Peter Thiel, and Destroying Education to Save It #132: Chris Sacca on Shark Tank, Building Your Business, and Startup Mistakes #133: Edward Norton on Mastery, Must-Read Books, and The Future of CrowdFunding #134: The Tao of Seneca #135: Luis Von Ahn on Learning Languages, Building Companies, and Changing the World #136: Naval Ravikant on Happiness Hacks and The 5 Chimps Theory #137: How to Practice Poverty and Reduce Fear #138: How Seth Godin Manages His Life — Rules, Principles, and Obsessions #140: Shaun White: The Most Unholy Snowboarder Ever #141: Kaskade and Sekou Andrews: The Musician and the Poet #142: How to Achieve Self-Ownership #143: The World’s Most Famous Performance-Enhancement Chemist #144: How to 10X Your Results, One Tiny Tweak at a Time #145: The Interview Master: Cal Fussman and the Power of Listening #146: The Random Show, Ice Cold Edition #147: How to Avoid the Busy Trap (And Other Misuses of Your Time) #148: Josh Waitzkin, The Prodigy Returns #149: How to Live in The Moment #150: Morgan Spurlock: Inside the Mind of a Human Guinea Pig #151: How to Overcome Fear — Lessons from Firefighter and Luger, Caroline Paul #152: On Philosophy and Riches #153: The Man Who Studied 1,000 Deaths to Learn How to Live #154: The Habits of a Master — Paulo Coelho, Author of The Alchemist #155: On Zero-to-Hero Transformations #156: Joshua Skenes — Playing with Fire #157: The Importance of Being Dirty: Lessons from Mike Rowe #158: The Secrets of Gymnastic Strength Training #159: How to Optimize Creative Output — Jarvis versus Ferriss #160: Assessing Risk and Living Without a Rope — Lessons from Alex Honnold #161: Lessons from War, Tribal Societies, and a Non-Fiction Life (Sebastian Junger) #162: How to Be Tim Ferriss – Featuring Freakonomics #163: Marc Andreessen — Lessons, Predictions, and Recommendations from an Icon #164: Kevin Kelly — AI, Virtual Reality, and The Inevitable #165: The Canvas Strategy — What Ben Franklin and Bill Belichick Have in Common (only available as audio due to copyright reasons) #166: How Creatives Should Negotiate #167: Jamie Foxx Part 2 — Bringing the Thunder #168: Dissecting the Success of Malcolm Gladwell #169: Useful Lessons from Workaholics Anonymous, Corporate Implosions, and More #170: Shay Carl — From Manual Laborer to 2.3 Billion YouTube Views #171: The Random Show — New Favorite Books, Memory Training, and Bets On VR #172: Dom D’Agostino — The Power of the Ketogenic Diet #173: Lessons from Geniuses, Billionaires, and Tinkerers #174: The One-Handed Concert Pianist, Nicholas McCarthy #175: How to Cage the Monkey Mind #176: Mike Birbiglia, The Sleepwalking Comedy G'
