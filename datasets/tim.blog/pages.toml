full_description = 'Posted on January 12, 2025January 12, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: Tactics and Strategies for a 2025 Reboot — Essentialism and Greg McKeown (#786) Leave a comment Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with Greg McKeown (@GregoryMcKeown), the author of two New York Times bestsellers, Essentialism: The Disciplined Pursuit of Less and Effortless: Make It Easier to Do What Matters Most. Greg is also a speaker, host of The Greg McKeown Podcast, and founder of The Essentialism Academy, with students from 96 countries. 200,000 people receive his weekly 1-Minute Wednesday newsletter, and he recently released The Essentialism Planner: A 90-Day Guide to Accomplishing More by Doing Less. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the conversation on YouTube here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #786: Tactics and Strategies for a 2025 Reboot — Essentialism and Greg McKeown<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/4ef7f8ce-ab08-4ead-b044-b19995e8b6e3/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: When something hits, it could be a calamity, it could just be something destabilizing, it could be anything, how do you center yourself so that you don’t just end up feeling like you’re in the washing machine? Because I am very good at getting things done even when I’m internally suffering a lot of turmoil. But the last handful of days have been very, very challenging and we don’t have to go into specifics. But this is a close loved one and a lot of the responsibilities are going to fall on me to figure things out. It’s also the holidays, so the people I want to get ahold of, I cannot get ahold of. And I recognize that fretting over it does not fix anything and it makes me, it makes my day less peaceful and enjoyable.And I’ll make a reference to one of our earlier conversations which may have been on the record, may have been behind the scenes, but I’m pretty sure that you mentioned a piece of artwork called The Listener, I want to say. Greg McKeown: Yes, that’s right. Tim Ferriss: It is this sort of centered, calm person. And I have it up on my wall at home, with all of this shouting commotion and chaos around him and in the center, he’s just perfectly centered and thinking clearly. I suppose my question is how do you help get yourself closer to that depiction of The Listener when you realize, “Wow, there may be a lot of chaos around me, there may be a lot of chaos in my head?” And look, I’m meditating twice a day. It’s helpful, it doesn’t seem to be quite enough. Maybe the answer is, look, you sit with it. This is just something you’re going to have to weather, so don’t make a problem out of a problem in a sense. But I’m curious what you have found helpful in those circumstances. Greg McKeown: Well, I think I can respond that I don’t think it’s just sitting with it and I’m pro-meditation and I’m certainly pro-prayer. But the thing I want to say is sort of distinguishing the noise outside of us and the noise inside of us because they are two different things. And I want to share a story and then illustrate the action that comes back from it. But this last summer I was back in England, I’m doing this doctorate at the University of Cambridge, and so part of the requirement of that is to have residency every year there. And this summer, I felt really destabilized while I was there. It wasn’t the doctorate that I don’t think was particularly a major part of why, it was because my best friend of 35 years, Sam Bridgstock, is dying of cancer. And that’s been a long time coming, we’ve known that that would happen, but facing it more directly in person. But it wasn’t even just that because it wasn’t like I didn’t know before. It wasn’t that I’d come to a new understanding of the truth or the reality. It was, actually, for a while, I couldn’t work out what it was. But then I realized, “Oh, he has so much mind share about the reality of my whole life.” We became friends when I was 10 years old. And those years, those developmental years, I escaped to that friendship and it was so stabilizing to me at the time to have a relationship that was open and honest. And if I’m completely frank, at a little bit of a risk in a way, but in a family culture that didn’t prioritize that for a whole series of complex reasons. And so suddenly, the imminent and certain loss of him, it’s like, “My goodness, my whole sense of reality is being shaken.” So it’s not just, even though this is a lot, the loss of such a friendship and so on, it tapped right back into this whole sense of, “Well, what is true and who do you go to, to validate that? And do I have enough internal sense of truth to be able to navigate this?” Because he was the one I would go to. Oh my goodness, this is what’s happening. This is the reality, this is the situation in those most complex relationships. And the idea of like, “I won’t be able to go to him,” it destabilized something at a different level. And all human systems have these levels, right, from the surface, which is secure, safe, shallow. And then you go further, closer and closer to say that the onion of human systems at the core are things that are so meaningful that they are inherently, blisteringly vulnerable. Because to mess with them, to tweak them, even, the opportunity’s enormous. That’s where massive transformational change happens. But if it gets shaken by something, everything shakes. It’s the earthquake because the tectonic plate of truth inside of you is getting readjusted, or either you’re getting a clearer sense of what is true. Now, that’s all contextual because I think from your own description, if you’re using language of destabilization, it’s because whatever’s happening externally isn’t just reverberating at the surface or the middle, it’s hitting something really deep. And so of course, then that changes everything. Nothing works the same way before, everything has been injected with some sort of degree of uncertainty.I just want to come back to this idea of just meditating, the idea of just sitting with it. And people that are more deeply meditative than I am may say, “Well, no, that practice would be the thing to do, but I found this summer and I find in general I need to write it out and loudly. It’s one of the things I try to teach our children about. There’s all kinds of prayer, there’s all kinds of writing. Scream it out, cry it out, whatever it is. It’s like it doesn’t have to be a conservative version of this. A little example of this was given to me, somebody that I have had of my podcast had just started a new business, and that destabilized not all the way to the core, but suddenly she’s waking up, she doesn’t have a set income as before. And she wakes up at 4:00 in the morning, just hot sweat, just, “What have I done?” Just super stressed. Tim Ferriss: Sounds like my morning this morning. Greg McKeown: Yeah, well, that’s it. Tim Ferriss: Different reasons, but yeah, viscerally. Greg McKeown: Different reasons but the dynamic is similar. And what she did, she did it all spontaneously, which I think is pretty amazing. But what she did, she grabbed a sheet of paper, and I think it may have been deliberate that she grabbed a sheet of paper rather than a book, like a journal or a planner, because she wanted to scream onto the page. She wanted to do it with complete abandonment, with the conscious awareness, “I’m going to throw this thing away. No one else gets to see this, or no one else has to see it.” Tim Ferriss: I see, so the sheet had more of an impermanent implication than a journal you’re less likely to tear it out and toss it. Greg McKeown: Right. Tim Ferriss: This is like, “I’m going to scribble fast and furious,” and then that’s the act. Greg McKeown: Well, right. And then I thought was interesting because without her intent, what she experienced in just a few minutes was that she went, and maybe this is my restate of what she experienced, but she went from confusion to clarity, and then naturally onto creation without meaning to do that. And I thought that that was one of the things that was so interesting in her case study, is that she didn’t wake up going, “Okay, I need to create a plan of what to do in these circumstances.” She just went, “The noise is so loud and it’s so overwhelming, the emotions are so much I have to give it somewhere.” But that process of screaming into the page, of letting it all out, separating ourselves from that discombobulating internal state, I think is extremely powerful because I think it helps us to go from prisoner to observer. And then from observer, I think once we start observing, we are better able to become a creator, so I think that’s the shift. Tim Ferriss: This is a good reminder that these best practices are like brushing your teeth. And I know this, but I’ve lapsed in my use of something that sounds very similar, which would be Morning Pages. And it’s been a while since I’ve done it. I picked up a new habit, this meditation, and there are only so many minutes in the morning so it’s tough to do a 27 step boot up, especially if you have kids or responsibilities. So the meditation came in, other things went out. One of them was the Morning Pages, which is fine, but I had forgotten that was in my toolkit. And this is a very good reminder to me that when in doubt, kind of go back to the fundamentals. Maybe it’s something that you’ve already used. It doesn’t necessarily have to be a brand new shiny thing. And in this case, you’re absolutely right. While my monkey mind is just running in circles, trying to think my way through it is not going to be a help. It’s just a fruitless labor. Greg McKeown: Yeah, I think so. I remember this summer because I happened to be doing the research. I was raging into the page one day for, I don’t know, a couple of hours. And I don’t know that anything there was usable for the research or for a future book or so on. It was too raw for any of that and I just definitely wanted to get it all out. And I thought when I looked at it all afterwards, I thought, “Yeah.” David Allen says your mind is a bad office because it’s good at all sorts of things, but not that sort of complex organization on its own. And when I looked at the page of all this content, I thought, “There’s way, way too much for the RAM of my mind to be able to navigate.” This is like layers and layers of complexity and intensity that needs to step over there so I can look at it, rather than trying to live in it. One additional little thing I learned in this conversation, in the case today I was mentioning, is a term I had never heard before, and it’s instinctive elaboration. What that is, is when you ask a question, we’ve all had this happen. If someone asks you a question, it is impossible not to think about it. And that’s a really powerful thing to learn about somehow, our cognitive inheritance. Because it means if you give yourself a prompt and then rage about it, it’s like your mind can’t help but go there. And just recently I used this instinctive elaboration when I felt overwhelmed, not in the same level of destabilization, but a very intense last 30 days. There was a family wedding, there’s been funerals, there’s been the holidays, Christmas, two birthdays, and that’s just a normal, that’s just high level, some of the stuff that’s been going on, so it’s been this really intense period. And I remember one time I was sitting down, my journal is finished. It’s over the holiday and there’s so much going on. I was like, “I can’t just go and grab another one.” I thought I had extras and I didn’t have it. And I really felt strangely stuck. Of course, there’s so many possible solutions, but when you feel frozen or stuck with things, you’re not thinking in that creative way. And so I literally used an AI tool and I sort of raged into that. Answering this question, what is going on? Just download what is happening in your life. And I like this structure of, “What? So what? Now what? What is happening? Let’s just get it out.” And then once I look at it, “Now what’s the news, what does this mean?” Because we’re all meaning makers and destabilizing experiences. What they’re really doing is they’re messing with our sense of meaning and orientation. And so then now what is, “What do I do about it?” I just download, I literally recorded it and then sent the recording and was like, “What do you make of that?” I didn’t really expect that much from it, but the restate it gave me back was so helpful. It really put'
