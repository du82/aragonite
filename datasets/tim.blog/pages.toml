dIn screens candidates for the hard and soft skills you’re looking for and puts your job in front of candidates looking for job opportunities that match what you have to offer. Using LinkedIn’s active community of more than 1 billion professionals worldwide, LinkedIn Jobs can help you find and hire the right person faster. When your business is ready to make that next hire, find the right person with LinkedIn Jobs. And now, you can post a job for free. Just visit LinkedIn.com/Tim. This episode is brought to you by FreshBooks. I’ve been talking about FreshBooks—an all-in-one invoicing + payments + accounting solution—for years now. Many entrepreneurs, as well as the contractors and freelancers that I work with, use it all the time. FreshBooks makes it super easy to track things like expenses, project time, and client info and then merge it all into great-looking invoices. And right now, there’s a special offer just for my listeners. Head over to FreshBooks.com/Tim to get 90% off your FreshBooks subscription for 4 months. Want to hear another episode that ponders the nature of reality? Have a listen to my conversation with Professor Donald Hoffman, in which we discuss the science of consciousness, how perception may influence the physical world, the holographic model of the universe, panpsychism (and influential panpsychists), cosmological polytope, the use of hallucinogenic drugs to tap into deeper reality and interact with conscious agents, QBism, the probability of zero that humans evolved to see reality in full, and much more. #585: Professor Donald Hoffman — The Case Against Reality, Beyond Spacetime, Rethinking Death, Panpsychism, QBism, and More<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/49f43155-f25b-4f1b-bb1b-96840b80f4d4/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> What was your favorite quote or lesson from this episode? Please let me know in the comments. SCROLL BELOW FOR LINKS AND SHOW NOTES… SELECTED LINKS FROM THE EPISODE Connect with David Deutsch: Website | Twitter Connect with Naval Ravikant: Website | Twitter | Airchat The Fabric of Reality: The Science of Parallel Universes — And Its Implications by David Deutsch | Amazon The Beginning of Infinity: Explanations That Transform the World by David Deutsch | Amazon The Beginning of Infinity, Part 1 (with Brett Hall) | Naval Podcast The Beginning of Infinity, Part 2 (with Brett Hall) | Naval Podcast David Deutsch: Knowledge Creation and the Human Race | Naval Podcast David Deutsch: Chemical Scum That Dream of Distant Quasars | TED Talk The Best Theory of Knowledge and Progress | Critical Rationalism Hub ToKCast | Brett Hall Science | Airchat (Where Brett and Naval Discuss David’s work) Philosophy and the Real World: An Introduction to Karl Popper by Bryan Magee | Amazon Aaron Stupple’s Chapter-by-Chapter Commentary on Philosophy and the Real World | Airchat The Science of Can and Can’t: A Physicist’s Journey through the Land of Counterfactuals by Chiara Marletto | Amazon Interviews with Chiara Marletto, David Deutsch, and Others About Constructor Theory | Logan Chipkin A New View of Children | Taking Children Seriously The Four Strands of the Fabric of Reality | David Deutsch The Theory Of Everything: The Origin and Fate of the Universe by Stephen W. Hawking | Amazon Computing Machinery and Intelligence by A.M. Turing | Mind Church–Turing–Deutsch Principle | Wikipedia Multiverse | Wikipedia Genetic Evolution Was a Prelude to Memetic Evolution (with Brett Hall) [Clip] | Naval Podcast Epistemology | Stanford Encyclopedia of Philosophy Scientific Method | Stanford Encyclopedia of Philosophy If You Say ‘Science Is Right,’ You’re Wrong | Scientific American Famous Scientific Theories That Were Proven Wrong | Grunge 1946 and All That | LSE Summary of Popper’s Lectures at the LSE | Critical Rationalism Blog Karl Popper’s Falsification | BBC Radio 4 “Summary: It’s Not Yet Known. But It Will Be.” | David Deutsch, Twitter Lamarckism | Wikipedia “Lamarckism! 33 Years After It Had Become Untenable.” | David Deutsch, Twitter The Many-Worlds Theory, Explained | The MIT Press Reader Copenhagen Interpretation of Quantum Mechanics | Stanford Encyclopedia of Philosophy What is a Qubit? | Quantum Inspire ‘Father of Quantum Computing’ Wins $3M Physics Prize | The Guardian Shor’s Algorithm | IBM Quantum How to Use Occam’s Razor without Getting Cut | Farnam Street David Deutsch: A New Way to Explain Explanation | TED Talk “The Elephant’s Child” from Just So Stories by Rudyard Kipling | Lit2Go ETC “Science Must Begin with Myths…” -Karl R. Popper | Goodreads Common Sense | The Chicago School of Media Theory Iseult Gillespie: The Myth of Hades and Persephone | TED-Ed What is Earth’s Axial Tilt? | Universe Today The Infinite Optimism of Physicist David Deutsch | Scientific American Blog Network Deus Ex Machina Explained | Fandor How to Travel Faster Than Light | Fermilab Humans vs. Robots: The Difference Between AI and AGI | Becoming Human: Artificial Intelligence Magazine Paradox of Tolerance: To Tolerate or Not to Tolerate? | Academy 4SC Quarantine by Greg Egan | Amazon Unended Quest: An Intellectual Autobiography by Karl Popper | Amazon David Deutsch: After Billions of Years of Monotony, the Universe Is Waking Up | TED Talk Quantum Computing Expert Explains How Humans Could Control the Whole Galaxy | Inverse How Do Crystals Form and Grow? | Geology Page The Origin of Atmospheric Oxygen on Earth: The Innovation of Oxygenic Photosynthesis | PNAS Antonio Stoppani’s ‘Anthropozoic’ in the Context of the Anthropocene | The British Journal for the History of Science The History of England by Lord Thomas Babington Macaulay | Amazon Wealth is Knowledge | David Deutsch The Open Society and Its Enemies by Karl R. Popper | Amazon The Logic of Scientific Discovery by Karl R. Popper | Amazon 2004: What’s Your Law? | Edge.org A New Approach to Formulating Fundamental Laws