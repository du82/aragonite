full_description = 'Posted on February 26, 2025March 4, 2025 by Tim Ferriss and PaulDr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory (#797) 5 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Dr. Keith Baar is a professor at the University of California, Davis, in the Department of Physiology and Membrane Biology.During his PhD studies, his research revealed that mechanical strain on muscle fibers activates the mammalian target of rapamycin (mTOR) signaling pathway, a crucial regulator of muscular hypertrophy. Subsequently, he studied the molecular dynamics of skeletal muscle adaptation to endurance training under the guidance of Dr. John Holloszy, a legend in the field of exercise physiology, considered the father of modern exercise biochemistry. Building on all of this experience, he conducted research into tendon health and the potential for engineering ligaments, which could have implications for treatment and recovery from injuries. Dr. Baar now runs the Functional Molecular Biology Lab at UC Davis. His lab’s work ranges from studying molecular changes in our cells to conducting studies to effect real-world improvements in people’s health, longevity, and quality of life. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. The transcript of this episode can be found here. Transcripts of all episodes can be found here. This episode is brought to you by Cresset prestigious family office for CEOs, founders, and entrepreneurs; AG1 all-in-one nutritional supplement; and Shopify global commerce platform, providing tools to start, grow, market, and manage a retail business. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/d7be84b6-bee9-4ffe-82a2-be20d9a3a52c/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Cresset Family Office! Listeners have heard me talk about “making before you manage” for years. And for me—as a writer and entrepreneur—I definitely gravitate toward making. So it’s important that I find the right people who are great at managing. That’s why I trust this episode’s sponsor, Cresset Family Office. Cresset is a prestigious family office for CEOs, founders, and entrepreneurs. They handle the complex financial planning, uncertain tax strategies, timely exit planning, bill pay and wires, and all the other parts of wealth management that would otherwise pull me away from doing what I love most: making things, mastering skills, and spending time with the people I care about. Experience the freedom of focusing on what matters to you with the support of a top wealth management team. Schedule a call today at cressetcapital.com/Tim to see how Cresset can help streamline your financial plans and grow your wealth. I’m a client of Cresset. There are no material conflicts other than this paid testimonial. All investing involves risk, including loss of principal. This episode is brought to you by Shopify! Shopify is one of my favorite platforms and one of my favorite companies. Shopify is designed for anyone to sell anywhere, giving entrepreneurs the resources once reserved for big business. In no time flat, you can have a great-looking online store that brings your ideas to life, and you can have the tools to manage your day-to-day and drive sales. No coding or design experience required. Go to shopify.com/Tim to sign up for a one-dollar-per-month trial period. It’s a great deal for a great service, so I encourage you to check it out. Take your business to the next level today by visiting shopify.com/Tim. This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. Want to hear another episode that explores the possibilities of rapamycin? Have a listen to the conversation I had with Peter Attia, David M. Sabatini, and Navdeep S. Chandel at the source of this miraculous compound: Easter Island. Here, we discuss how one of the most important discoveries of medical science was almost lost, why metabolism (along with longevity) research is key to treating a long list of diseases, intermittent dosing of rapamycin, parenting advice from scientists on confidence and conflict, the necessary failures of good science, good fonts versus bad fonts, “non-potato” relationships, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Dr. Keith Baar: Website | Bluesky | LinkedIn The transcript of this episode can be found here. Transcripts of all episodes can be found here. Physiology & BiologyStrength Physiology Muscle Hypertrophy Force Transfer Connective Tissue Adaptation Tendon vs. Ligament Stress Shielding Collagen Synthesis Lysyl Oxidase (LOX) Mitochondrial Biogenesis Mitochondrial Function Mitophagy Refractory Period Minimum Effective Dose Systemic Inflammation Molecular Biology mTOR (Mechanistic Target of Rapamycin) IGF-1 (Insulin-Like Growth Factor 1) Growth Hormone Receptor JAK-STAT Pathway (Janus Kinase-Signal Transducer and Activator of Transcription) Super Amino Acids: Glycine and Proline Ketones/Ketogenesis PGC1-Alpha Reactive Oxygen Species (ROS) Exercise Physiology Isometric Contractions (Yielding vs. Overcoming) Eccentric vs. Concentric Contractions Rate of Perceived Exertion (RPE) Load Duration Rest Intervals Jerk Tempo Static vs. Dynamic Stretching Injury & Recovery Tendinopathy Alfredson Protocol Scar Tissue Formation Anterior Cruciate Ligament (ACL) Rupture/Repair RICE (Rest, Ice, Compression, Elevation) Immobilization Pain Management Debridement Training & Rehabilitation Methods Shockwave Therapy Hangboard Training Isometric Holds The Alphabet Exercise Eccentric Loading Strength Training Thera-Band Flexbar Substances & Interventions Supplements Hydrolyzed Collagen Peptides Vitamin C Whey Protein Gelatin Bone Broth Pharmaceuticals Rapamycin Metformin JAK-STAT Inhibitors (ending in -NIB, e.g., Itacitinib, Vorasidenib) Fluoroquinolone Antibiotics (e.g., Ciprofloxacin) AT1 Receptor Drugs (Sartan drugs) Resorbable vs. Non-Resorbable Sutures Testosterone Estrogen Nandrolone Liothyronine (Cytomel) Relaxin Orthobiologics (Critiqued) BPC-157 PRP (Platelet-Rich Plasma) Prolotherapy Stem Cells Diets Ketogenic Diet One Meal A Day (OMAD) Institutions & Places The UK Sports Institute Rapa Nui (Easter Island) UC Davis Aspetar Finland University of Illinois, Chicago Maastricht NFL NCAA Movies Lorenzo’s Oil Research Minimizing Injury and Maximizing Return to Play: Lessons from Engineered Ligaments | Sports Medicine Acute Resistance Exercise Activates Rapamycin-Sensitive and -Insensitive Mechanisms That Control Translational Activity and Capacity in Skeletal Muscle | Journal of Physiology Effects of Stress Shielding on the Mechanical Properties of Rabbit Patellar Tendon | Journal of Biomechanical Engineering A 1-Month Ketogenic Diet Increased Mitochondrial Mass in Red Gastrocnemius Muscle, but Not in the Brain or Liver of Middle-Aged Mice | Nutrients Ingestion of a Whey Plus Collagen Protein Blend Increases Myofibrillar and Muscle Connective Protein Synthesis Rates | Medicine & Science in Sports & Exercise Pentadecapeptide BPC 157 Enhances the Growth Hormone Receptor Expression in Tendon Fibroblasts | Molecules ACE-II Receptor Antagonists Are Associated with Achilles Tendon Rupture | University of Eastern Finland Effect of Estrogen on Musculoskeletal Performance and Injury Risk | Frontiers in Physiology Ketogenic Diets and Mitochondrial Function: Benefits for Aging But Not for Athletes | Exercise and Sport Sciences Reviews Do Inflammatory Cells Influence Skeletal Muscle Hypertrophy? | Frontiers in Bioscience-Elite Relevant Resources Tendon and Ligament Health | SinewUS RE: Tim Seeks Tennis Elbow Relief | Twitter How this Climber Went from V0 to V15 in 5 Years | Josh Rundle My Life Extension Pilgrimage to Easter Island | The Tim Ferriss Show #193 Work Medium, Play Medium | Pretty Alright Goods Free Weights vs. Machine Weights? Here’s How to Choose. | GoodRx Orthopaedics in the Dawn of Civilisation, Practices in Ancient Egypt | International Orthopaedics The Characteristics of Valter Longo’s “Longevity Diet” | USC Leonard Davis SHOW NOTES [00:07:12] How I discovered Keith’s work through a tweet about tennis elbow and rock climbing. [00:07:54] Emil Abrahamsson’s hangboard training protocol. [00:09:20] The fundamental principles of strength training and connective tissue adaptation. [00:10:36] mTOR complex 1 and its role in muscle growth. [00:12:06] Engineered ligaments and the discovery of minimal effective doses for tendon adaptation. [00:13:50] The refractory period between optimal tendon loading sessions. [00:16:42] Rapamycin’s effects on muscle hypertrophy. [00:18:49] Protocols for tennis elbow rehabilitation. [00:20:28] Why isometrics work better than eccentrics for tendon healing. [00:22:14] Stress shielding and how load distribution affects tendon healing. [00:29:07] The misconception about eccentric loading for tendon injuries and why velocity matters. [00:29:58] Ideal duration for isometric holds (10-30 seconds) based on injury status. [00:33:50] My elbow issues and current rehab approach. [00:36:02] Overcoming vs. yielding isometrics and optimal loading strategies. [00:47:11] Dr. Barr’s movement prescription for my tennis elbow. [00:52:18] Loading timing post-surgery and RICE protocol criticism. [00:56:58] Achilles tendon rehabilitation after surgery. [01:00:18] Critique of orthopedic suturing techniques and recommendation for resorbable sutures. [01:04:02] Multiple position isometrics for tennis elbow rehabilitation. [01:07:26] Collagen synthesis, supplementation, and vitamin C timing. [01:12:59] Critique of BPC-157 and other injectable peptides for tendon healing. [01:18:19] Evaluation of orthobiologics’ (PRP, prolotherapy, stem cells) effectiveness. [01:21:37] JAK-STAT inhibitor drugs and their effects on tendon growth. [01:25:35] Drugs that increase risk of tendon ruptures (fluoroquinolones, AT-1 receptor drugs). [01:29:33] How estrogen affects tendon stiffness and injury risk in women. [01:32:48] Testosterone’s opposite effects on tendon compared to estrogen. [01:35:31] Protein intake recommendations and timing. [01:40:11] Ketogenic diet effects on mitochondrial biogenesis and longevity. [01:41:57] Comparison of ketogenic diet, low protein diet, and rapamycin for longevity. [01:47:19] Inflammation’s role in adaptation and when to reduce it. [01:51:17] Timing of ice baths relative to training for optimal recovery. [01:52:33] Parting thoughts. MORE DR. KEITH BAAR QUOTES FROM THE INTERVIEW “The number one cost to the US medical system is actually musculoskeletal sprains, strains, and tears—the back and the neck as well as the rest of the body. It’s more than diabetes and heart disease combined.”— Dr. Keith Baar “If passive flexibility were really important for decreasing tendon injury, then the women’s gymnasts who have the most passive flexibility wouldn’t be the NCAA sport with the highest rate of Achilles tendon rupture.”— Dr. Keith Baar “Injury related to flexibility is a U-shaped curve. So our injuries are really high when we’re very inflexible. When we get into that sweet spot where we have good mobility, we can do the full range of motion, actually the injury rate is very low. If we become hyper-mobile, we actually have that injury rate go up as well.”— Dr. Keith Baar “We don’t use a ketogenic diet if we want to go fast, but if we’re training for life, we see that it increases longevity, that the ketones themselves are really good for brain function.”— Dr. Keith Baar “The first recorded immobilizer for an ankle or a leg is from Egyptian hieroglyphs, where they showed pictures 4,500 years ago. If I took you and you said you had cancer, you would not want a treatment that was developed 4,500 years ago. You would hope that something new had been developed in the last 4,500 years. That is where we are for our orthopedic situations.”— Dr. Keith Baar “The reality is that there are especially certain athletes like climbers where they’re doing all kinds of heavy lifts, they’re doing all kinds of heavy work, they’re doing all kinds of really dynamic moves. And what happens, what breaks down, is they break down in their finger tendons and they break down in the little pulleys within the tendons.”— Dr. Keith Baar PEOPLE MENTIONED Vincent Van Gogh Emil Abrahamsson David Sabatini Navdeep Chandel Dwayne “The Rock” Johnson Kozaburo Hayashi Håkan Alfredson Michael Kjær Monika Lucia Bayer Rod Whiteley Natalie Gilmore Timo Nyyssönen Venus Williams Luc van Loon Stuart Phillips Jon Ramsey Valter Longo Ron Maughan Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" '
