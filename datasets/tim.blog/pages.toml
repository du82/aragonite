description = 'Please enjoy this transcript of my interview with Seth Godin, author of 21 internationally bestselling books, translated into more than 35 languages, including Linchpin, Tribes, The Dip, and Purple Cow. His latest book, This Is Strategy, offers a fresh lens on how we can make bold decisions, embrace change, and navigate a complex, rapidly evolving … Continue reading "The Tim Ferriss Show Transcripts: Seth Godin on Playing the Right Game and Strategy as a Superpower (#792)"'
full_description = 'Posted on January 31, 2025January 31, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: Seth Godin on Playing the Right Game and Strategy as a Superpower (#792) 2 Comments Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with Seth Godin, author of 21 internationally bestselling books, translated into more than 35 languages, including Linchpin, Tribes, The Dip, and Purple Cow. His latest book, This Is Strategy, offers a fresh lens on how we can make bold decisions, embrace change, and navigate a complex, rapidly evolving world. Seth is the founder of the altMBA and The Akimbo Workshops, transformative online programs that have helped thousands of people take their work to the next level. His blog (seths.blog) is one of the most widely read in the world. Seth is also the creator of The Carbon Almanac, a global initiative focused on climate action. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the interview on YouTube. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #792: Seth Godin on Playing the Right Game and Strategy as a Superpower<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/af7e8c43-5ff2-495c-b2f9-43e48d825a2a/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: I suppose I want to ask the question that I always ask, what would make this time well spent for you? What would make this the home run, looking back? Seth Godin: I have to confess that I’ve never had a conversation with you that wasn’t well spent. What would make it a home run for me is if you considered it one of the best episodes of the year or maybe even longer. I want to be on the greatest hits. Tim Ferriss: All right. Seth Godin: That’s what we’re pushing for. Tim Ferriss: All right, perfect. To kick that off out of the gate, what would be a sensible place to start? Is there a particular story or a lead question that you think would help us start with a bang? Anything come to mind? There are a million places I could start, of course. Seth Godin: Well, you know best, but it seems to me that many of your listeners actually want a job without a boss. They don’t seek to build something and they need to be woken up about that. And number two, people who misunderstand your breakthrough books think they’re about tactics, and they follow the steps instead of realizing they’re about strategy, and then find a resilient way forward. And strategy, this philosophy is something you’ve been doing your entire career, but never called it that. Tim Ferriss: Well, let’s start there. So strategy, like success or God, if we want to really get out there, are words that a lot of people use, but oftentimes they’re in their minds referring to different things. So when you use the word strategy, what does that mean to you? Seth Godin: I think it’s a philosophy of becoming. I don’t think it’s a set of tactics. I don’t think it’s about winning in the short run. I think it’s about being very clear about the change we seek to make and who we seek to change, understanding the systems and the games around us, and then committing to the long-term process of getting to where we’re going. Meaning our tactics will change all the time, but our strategy does not. And most people, because we’ve been indoctrinated to have a job, want tactics instead. And I could do much better if I was peddling tactics, but I’m not. And I’m never going to write a story, a book called This is God — Tim Ferriss: The Tactic Monger Volume One. Seth Godin: Exactly. So if I’m not going to write This is God, or This is Tactics, at least I could write This is Strategy. Tim Ferriss: And what would be a real world example of good strategy? Any particular company or project come to mind? Seth Godin: So some famous strategies, an elegant strategy. Bill Gates says, “We are going to have the strategy that no one ever got fired for buying Microsoft.” He stole that strategy from IBM. So IBM had a 50-year run where their products weren’t the most cutting edge, they weren’t the best priced, but they had enough salespeople, and support, and infrastructure that if you worked for a big company, buying IBM was easy. Every time Microsoft followed that strategy, they did fine. And when they veered away from it, they had problems. A strategy, when I was at Yahoo, we had the chance to buy Google for about $10 million and we didn’t buy them. I didn’t get a vote. But Yahoo’s strategy was “The web is a dark and nasty place. Come to Yahoo and don’t leave.” And the home page had 183 links on it. At Google, their strategy was “The web has grown up. Come here and go somewhere else.” And Marissa Mayer built the most profitable marketing engine of all time by making sure, fighting for years to make it so there’s only a couple links on the home page because that was built into the strategy, which is, if you’re leaving Google, we’re doing something right. And that’s where all the ads came from. And that’s why Yahoo couldn’t buy Google, because the strategies were completely the opposite. And Starbucks had a strategy that took them a very long way for a very long time, but it’s not about frappuccinos, it’s about understanding who is this for and how can we incrementally help them get there? Tim Ferriss: What did that look like for Starbucks and what did it look like for them to stray? Seth Godin: Howard Schultz did not start Starbucks. When he got there there were two Starbuckses and neither one of them sold cups of coffee. They only sold beans. And Howard had been to Italy and he realized that there was a deep human desire A, to go from being pre-caffeinated to caffeinated. And that gets refreshed every single day. And two, to be able to do it with other people who you see yourself in, people like us do things like this. So in the Northeast there was Dunkin Donuts, but the idea of Dunkin Donuts is you’re not happy that you’re getting coffee. The coffee isn’t that delicious, let’s just get this over with. And every time Howard built more of that feeling that you could go to any Starbucks in the world and feel like you were with your people, and that for five bucks you could feel like a rich person, he could repeat it over, and over, and over again, and the tactics would take care of themselves. Tim Ferriss: If not the tactics, what are the core ingredients of enacting a strategy like that? Seth Godin: There’s all sorts of surprising ways that we can challenge ourselves once we start down this path. But to start down the path, there are four things we’re looking for. We’re looking for systems, we’re looking for time, we’re looking for games, and finally, empathy. And all four of them are really unexplored and mysterious, but once you see all four of them, strategy is much easier to take care of itself. So I’m happy to take them one by one or give examples, but those four keep interweaving over and over again. And that unfolds for us what a strategy can be. Tim Ferriss: Great. Well, let’s go through the four. Seth Godin: Okay. We’ll start with systems. Tim Ferriss: And maybe if it’s not too cumbersome, if there’s an example that’s easy to give, that’s great too. Seth Godin: Okay. Tim Ferriss: However you want to land it. Seth Godin: Systems are invisible and they hide themselves because they don’t want people to see who’s operating things. They invent culture to defend themselves. Systems, the most famous one is the Solar System. There’s this invisible gravity. The Earth doesn’t go around the sun because it wants, it goes around the sun because gravity makes that its easiest path. If you grew up in the United States to middle-class parents, you’ll be under pressure from the time you’re five years old to get good grades. Why do I need to get good grades? So you can get into a famous college, but you’re not supposed to call it a famous college. You’re supposed to call it a good college. And that system with tuition and tenure, and student debt and football teams, and cheerleaders, and college tours, and the sticker on the back of a car, and the SATs, all of it is just taken for granted as normal. And so Donella Meadows has done brilliant writing before she passed way too early about all the dynamics of systems, systems in our world, systems that we want to build. So when we see a system under stress, then we can see the system, then we can see the climate when temperatures start to rise. But before the temperature started to rise, when the climate was normal, no one paid attention to it because the system, the thing that keeps it going was sort of invisible. So if you’re going to start any enterprise, a little plumbing business, a giant internet company, if you’re going to run for office, you should be able to see and name the elements of the system. Where is there gravity? What is seen as normal? And there’s pushback if you don’t do it. And so I’ll finish the rant by asking a simple question. How much should a wedding cost? Tim Ferriss: I’m especially unqualified to answer this. Seth Godin: No, it’s super simple. Tim Ferriss: I’m working on it. Seth Godin: The answer is exactly what your best friend spent, but a little more. Tim Ferriss: Yeah. Seth Godin: And that’s why a wedding in New York City costs more than a hundred thousand dollars, not because you need monogrammed matchbooks to have a good wedding. You need them to be part of the wedding industrial complex, to show your status to the people who’ve been invited, because that’s what the thing is for. So we have to see systems and then either we work for the system or the system works for us. Tim Ferriss: And we can linger on this one for a bit because the next one is time. So I feel like we should take our time plus it’s long form. So could you give an example on a smaller scale of a, you mentioned plumbing doesn’t need to be plumbing, but a solopreneur or a very, very small startup, two to four employees, and how they might start to ask questions around systems to identify the systems that are at work. Because for instance, in my life, I’m good at identifying what is normal, like what are the unquestioned assumptions? I’m good at that, but that seems like I’m holding the tail of the elephant, like one of the blind men in the parable. I’ve got a piece of it, but it’s not the whole elephant, clearly. Seth Godin: I don’t think you’re giving yourself enough credit. The whole tango thing. I mean, you have been doing this for a very long time, really well. Tim Ferriss: Or the archery thing behind me. Seth Godin: So let’s say you’re going to build a small business that supports medium-sized businesses with their Google Workspace. So you’re a couple nerds and you’re going to be the person who helps people set up their Google Drive, and across the organization, reasonably secure for a company with a hundred employees. Because you’re in there in the factory seeing how things are made, it’s very tempting to imagine that everyone you’re serving wants what you want, and that you think your customer is the person who’s buying stuff from you, and what they need is a tech solution. None of these things are true, that the system of a company with a hundred people is, it’s probably not the CEO’s job to set this thing up. So it’s someone else’s job. There’s a system, a hierarchy of jobs. What does that person want? It’s not their money, so lowering your price to get new customers is not going to help you get new customers, that in fact, what that person wants is a story to tell their boss, a story of why did I pick these people, and even better a story of if it fails, why they are not going to be in trouble. And so when we show up at an organization to tell our story to that system, we have to do it understanding how do they buy everything else? What do they measure? What would happen to us if we’re bigger than the other people bidding or smaller than the other people bidding? All of these things go into how the system works, the same way the admissions office at the famous college doesn’t always pick the people with the highest SAT scores, because there’s this complicated mechanism at play that is historical to feed and maintain the system. And so in the case of this Google Workspace thing, let’s say you decide to close on Thanksgiving Day and you’ve just got a message on your voicemail, “We’re closed on Thanksgiving Day. Leave a message, we’ll call you back tomorrow.” That seems normal, unless what got you into the system was an unbreakable promise that you will never get in trouble because we will always answer the phone. That decision, that tactical decision has to be driven by what you seek t'
