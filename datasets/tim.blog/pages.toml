full_description = '<img src="https://i0.wp.com/tim.blog/wp-content/uploads/2023/05/john-fowler-aaIN3y2zcMQ-unsplash-scaled.jpg?fit=600%2C397&#038;ssl=1" alt="I Feel Love: MDMA for Autism and Social Anxiety"/> Posted on May 30, 2023June 1, 2023I Feel Love: MDMA for Autism and Social Anxiety In best cases, he added, the drug can help “transform your understanding of yourself, the world, and your relationship to it, and give you new beliefs moving forward.” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2021/03/maxresdefault.jpeg?fit=600%2C338&#038;ssl=1" alt="Psychedelics 101: Books, Documentaries, Podcasts, Science, and More"/> Posted on March 31, 2021February 9, 2022Psychedelics 101: Books, Documentaries, Podcasts, Science, and More By popular request, I recorded the short video above to cover what I consider “psychedelics 101.” There is a sea of misinformation out there, and the video covers resources I consider well vetted. All links are listed below. Please be sure to see the important disclaimer at the bottom of this post. <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2021/03/Lewis-Minor-Photo.jpg?fit=600%2C600&#038;ssl=1" alt="Some Thoughts on For-Profit Psychedelic Startups and Companies"/> Posted on March 5, 2021March 15, 2021Some Thoughts on For-Profit Psychedelic Startups and Companies This week has been a fascinating firestorm for me. Part of the excitement came after a series of tweets I published about some of the concerns I have as psychedelic medicine makes the leap from research to for-profit startups and companies. Here is what I wrote: <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2021/02/Extraction-of-Kambo-frog-poison-near-Iquitos-Peru-scaled.jpg?fit=600%2C387&#038;ssl=1" alt="An Urgent Plea to Users of Psychedelics: Let’s Consider a More Ethical Menu of Plants and Compounds"/> Posted on February 21, 2021March 18, 2023An Urgent Plea to Users of Psychedelics: Let’s Consider a More Ethical Menu of Plants and Compounds This is a blog post I wish I didn’t need to write. I have personally invested years and millions of dollars into non-profit psychedelic research around the world (one example in the UK, one in the US, and one in NZ) because A) I believe it has the potential to revolutionize the treatment of mental health and addiction, and the data are increasingly proving this to be true. B) I’m a case study. Psychedelics have saved my life several times over, including helping me to heal from childhood abuse.'
