full_description = 'Posted on February 21, 2024February 24, 2024 by Tim FerrissCal Newport — How to Embrace Slow Productivity, Build a Deep Life, Achieve Mastery, and Defend Your Time (#722) 9 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="480" src="https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration.jpeg?resize=600%2C480&#038;ssl=1" alt="" class="wp-image-73322" style="width:840px;height:auto" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?resize=1024%2C819&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?resize=300%2C240&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?resize=768%2C614&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?resize=1536%2C1229&amp;ssl=1 1536w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?resize=2048%2C1638&amp;ssl=1 2048w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/02/Cal-Newport-Illustration-scaled.jpeg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" />Illustration via 99designs “You can’t be busy and frenetic and bouncing off the walls with 100 projects if you’re obsessed about doing something really well.” — Cal Newport Cal Newport is a professor of computer science at Georgetown University, where he is also a founding member of the Center for Digital Ethics. In addition to his academic work, Newport is a New York Times bestselling author who writes for a general audience about the intersection of technology, productivity, and culture. His books have sold millions of copies and been translated into over forty languages. He is also a contributor to The New Yorker and hosts the popular Deep Questions podcast.His new book is Slow Productivity: The Lost Art of Accomplishment Without Burnout. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, Google Podcasts, Amazon Music, or on your favorite podcast platform. Watch the interview on YouTube here. Brought to you by AG1 all-in-one nutritional supplement, Eight Sleep’s Pod Cover sleeping solution for dynamic cooling and heating, and Momentous high-quality supplements. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #722: Cal Newport — How to Embrace Slow Productivity, Build a Deep Life, Achieve Mastery, and Defend Your Time<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/d1a88aff-ad88-45f6-9f6c-cc0ab23a5565/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Momentous high-quality supplements! Momentous offers high-quality supplements and products across a broad spectrum of categories, and I’ve been testing their products for months now. I’ve been using their magnesium threonate, apigenin, and L-theanine daily, all of which have helped me improve the onset, quality, and duration of my sleep. I’ve also been using Momentous creatine, and while it certainly helps physical performance, including poundage or wattage in sports, I use it primarily for mental performance (short-term memory, etc.). Their products are third-party tested (Informed-Sport and/or NSF certified), so you can trust that what is on the label is in the bottle and nothing else. If you want to try Momentous for yourself, you can use code Tim for 20% off your one-time purchase at LiveMomentous.com/Tim. And not to worry, my non-US friends, Momentous ships internationally and has you covered. This episode is brought to you by Eight Sleep. Temperature is one of the main causes of poor sleep, and heat is my personal nemesis. I’ve suffered for decades, tossing and turning, throwing blankets off, pulling them back on, and repeating ad nauseam. But a few years ago, I started using the Pod Cover, and it has transformed my sleep. Eight Sleep has launched their newest generation of the Pod: Pod 4 Ultra. It cools, it heats, and now it elevates, automatically. With the best temperature performance to date, Pod 4 Ultra ensures you and your partner stay cool in the heat and cozy warm in the cold. Plus, it automatically tracks your sleep time, snoring, sleep stages, and HRV, all with high precision. For example, their heart rate tracking is at an incredible 99% accuracy. Pod 4 Ultra also introduces an adjustable Base that fits between your mattress and your bed frame to add custom positions for the best sleeping experience. Plus, it automatically reduces your snoring when detected. Add it easily to any bed. And now, listeners of The Tim Ferriss Show can get $350 off of the Pod 4 Ultra for a limited time! Click here to claim this deal and unlock your full potential through optimal sleep. What was your favorite quote or lesson from this episode? Please let me know in the comments. Want to hear the last time Cal Newport was on this show? Listen here to our conversation in which we discussed lessons from Steve Martin, living the deep life, how Cal secured his first book deal as an unproven 20-year-old, honing the funny bone for humor writing, mastering slow productivity despite 21st-century distractions, crafting the lives we desire, considering the spiritual as an exercise of meticulous craft and creation, Cal’s 30-day digital minimalism declutter, and much more. #568: Cal Newport — The Eternal Pursuit of Craftsmanship, the Deep Life, Slow Productivity, and a 30-Day Digital Minimalism Challenge<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/a459a266-d76a-47a2-bb38-697962eaa763/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> SELECTED LINKS FROM THE EPISODE Connect with Cal Newport: Website | Blog | YouTube Slow Productivity: The Lost Art of Accomplishment Without Burnout by Cal Newport | Amazon The Deep Questions Podcast So Good They Can’t Ignore You: Why Skills Trump Passion in the Quest for Work Y