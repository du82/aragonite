full_description = '''Posted on August 18, 2015February 29, 2024 by Tim FerrissNaval Ravikant — The Person I Call Most for Startup Advice (#97) 491 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="500" height="334" src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?resize=500%2C334&#038;ssl=1" alt="The Tim Ferriss Show with Naval Ravikant" class="wp-image-18651" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?w=500&amp;ssl=1 500w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?resize=360%2C240&amp;ssl=1 360w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?resize=300%2C200&amp;ssl=1 300w" sizes="(max-width: 500px) 100vw, 500px" /> “Desire is a contract you make with yourself to be unhappy until you get what you want.”— Naval Ravikant Naval Ravikant (@naval) is the CEO and a co-founder of AngelList. He previously co-founded Epinions, which went public as part of Shopping.com, and Vast.com. He is an active angel investor and has invested in more than 100 companies, including more than a few “unicorn” mega-successes. His deals include Twitter, Uber, Yammer, Postmates, Wish, Thumbtack, and OpenDNS, which Cisco just bought for $635 million in cash. BUT, even if you have zero interest in startups or investing, this episode is well worth your time. This is really about the habits and beliefs of a highly successful (and happy) person. Naval has refined his way of living in very unique ways, and you can borrow what he’s learned, read the books that have changed him, and experiment with the habits he has developed through trial and error. Enjoy this conversation with a curious character! UPDATE: This episode was extremely popular (and 