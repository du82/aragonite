full_description = '''Posted on January 31, 2024February 27, 2024 by Tim FerrissWalk & Talk with Greg McKeown — How to Find Your Purpose and Master Essentialism in 2024 (#719) 24 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="480" src="https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown.jpeg?resize=600%2C480&#038;ssl=1" alt="" class="wp-image-72766" style="width:840px;height:auto" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?resize=1024%2C819&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?resize=300%2C240&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?resize=768%2C614&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?resize=1536%2C1229&amp;ssl=1 1536w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?resize=2048%2C1638&amp;ssl=1 2048w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2024/01/Greg-McKeown-scaled.jpeg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" />Illustration via 99designs “A flight is off track 90 percent of the time. An airplane literally only gets to where it’s supposed to get to at the time it’s supposed to get there because it readjusts constantly along the way. And I feel like that myself.” — Greg McKeown Greg McKeown (@GregoryMcKeown) is the author of two New York Times bestsellers, Essentialism: The Disciplined Pursuit of Less and Effortless: Make It Easier to Do What Matters Most. Together they have sold more than two million copies in 37 languages. He is also a speaker, host of The Greg McKeown Podcast, and founder of The Essentialism Academy, with students from 96 countries. More than 175,000 people have signed up for his 1-Minute Wednesday newsletter. He is currently doing a doctorate at the University of Cambridge, and he is easily one of my favorite thinkers on all things related to effectiveness, efficiency, and quality of life. Greg is originally from London, England, and he and his wife Anna are parents to four children. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, Google Podcasts, Amazon Music, or on your favorite podcast platform. Brought to you by AG1 all-in-one nutritional supplement, Helix Sleep premium mattresses, and Momentous high-quality supplements. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #719: Walk & Talk with Greg McKeown — How to Find Your Purpose and Master Essentialism in 2024<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/6e360f82-b4be-4ede-87da-75d062acb828/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Helix Sleep! Helix was selected as the best overall mattress of 2024 by Forbes, Fortune, and Wired magazines and many others. With Helix, there’s a specific mattress to meet each and every body’s unique comfort needs. Just take their quiz—only two minutes to complete—that matches your body type and sleep preferences to the perfect mattress for you. They have a 10-year warranty, and you get to try it out for a hundred nights, risk-free. They’ll even pick it up from you if you don’t love it. And now, Helix is offering between 20% and 27% off all mattress orders at HelixSleep.com/Tim. This episode is brought to you by Momentous high-quality supplements! Momentous offers high-quality supplements and products across a broad spectrum of categories, and I’ve been testing their products for months now. I’ve been using their magnesium threonate, apigenin, and L-theanine daily, all of which have helped me improve the onset, quality, and duration of my sleep. I’ve also been using Momentous creatine, and while it certainly helps physical performance, including poundage or wattage in sports, I use it primarily for mental performance (short-term memory, etc.). Their products are third-party tested (Informed-Sport and/or NSF certified), so you can trust that what is on the label is in the bottle and nothing else. If you want to try Momentous for yourself, you can use code Tim for 20% off your one-time purchase at LiveMomentous.com/Tim. And not to worry, my non-US friends, Momentous ships internationally and has you covered. What was your favorite quote or lesson from this episode? Please let me know in the comments. Want to hear the last time Greg McKeown was on this show? Listen to our conversation here, in which we discussed how Gandhi would sum up Essentialism, how life experiences can unwittingly write scripts that hurt us more than they serve us, questions we can ask ourselves to cope with pet peeves, actionable gratitude, the difference between effortless action and effortless results, and much more. #510: Greg McKeown — The Art of Effortless Results, How to Take the Lighter Path, the Joys of Simplicity, and More<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/f456e66c-df80-4a42-98f8-eb09661f82eb/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> SELECTED LINKS FROM THE EPISODE Connect with Greg McKeown: Website | Twitter | Facebook | Instagram Effortless: Make It Easier to Do What Matters Most by Greg McKeown | Amazon Essentialism: The Disciplined Pursuit of Less by Greg McKeown | Amazon Greg McKeown — The Art of Effortless Results, How to Take the Lighter Path, the Joys of Simplicity, and More | The Tim Ferriss Show #510 Greg McKeown — How to Master Essentialism | The Tim Ferriss Show #355 How to Say “No” Gracefully and Uncommit | The Tim Ferriss Show #328 How to Be Okay When You’re Not Okay by Greg McKeown | LinkedIn Manaus | Visit Brasil A Christmas Carol by Charles Dickens | Amazon If You’re Too Busy For These Five Things, Your Life Is Very Off-Course | Observer The 1-2-3 Method | The Greg McKeown Podcast #225 The Stake Patriarch | The Church of Jesus Christ of Latter-Day Saints About Patriarchal Blessings | The Church of Jesus Christ of Latter-Day Saints Why “Metanoia” Is So Much Greater Than “Repentance” — And Why | Here’s the Joy The Angels Knocking on the Tavern Door: Thirty Poems of Hafez | Amazon General Stanley McChrystal — Mastering Risk: A User’s Guide | The Tim Ferriss Show #535 Mary Oliver Reads Her Beloved Poem “Wild Geese” | The Marginalian A Mystery: Why Can’t We Walk Straight? | NPR I Think You’re Fat by A.J. Jacobs | Esquire Anna Karenina by Leo Tolstoy | Amazon Maslow’s Hierarchy of Needs | Wikipedia Maslow’s Forgotten Pinnacle: Self-Transcendence | Big Think A Two-Year-Old Goes to Hospital | Vimeo On Demand Attachment Theory: Bowlby & Ainsworth’s Theory Explained | Simply Psychology Portlandia | Prime Video Attached: The New Science of Adult Attachment and How It Can Help You Find — and Keep — Love by Amir Levine and Rachel Heller | Amazon Hold Me Tight: Seven Conversations for a Lifetime of Love by Dr. Sue Johnson | Amazon Iconic Therapist Dr. Sue Johnson — How to Improve Sex and Crack the Code of Love | The Tim Ferriss Show #529 What is EFT? | The International Centre For Excellence In Emotionally Focused Therapy (ICEEFT) The Formative Power of Attachment (Fewer But Deeper Series: Part 3) | The Greg McKeown Podcast #256 Erik Newton’s Story | Twitter They Left Social Media for Good. Are They Happier? | The Washington Post Why Did You Quit Social Media, and How Did It Change Your Life? | Quora How to Get Off Social Media | Sidekick The Matrix | Prime Video Is AI a Tool or Weapon with Microsoft’s Brad Smith (Part 1) | The Greg McKeown Podcast #214 A Shared Strength of Three Microsoft CEOs with Brad Smith | The Greg McKeown Podcast #216 Gantt Chart | Wikipedia Why Does My Child Only Misbehave At Home And Not At School? | Healthy Young Minds Embracing Constraints | Seth’s Blog Industrial Revolution and the Standard of Living | Econlib The KJV Holy Bible | Amazon Keeping Up With the Kardashians | Prime Video How to Use Occam’s Razor without Getting Cut | Farnam Street The Sunk Cost Fallacy | The Decision Lab “Blame Game” Ends as No-Fault Divorce Comes into Force | Gov.uk Foraminal Stenosis | Cleveland Clinic George Does the Opposite | Seinfeld Reinventing the Office: How to Lose Fat and Increase Productivity at Work by David Teten | Tim Ferriss SHOW NOTES [10:02] How 2023 informed 2024’s highest priorities. [16:09] Greg’s system for effortless execution of daily tasks. [27:42] Directional documents, shameless repentance, and shifting success. [36:53] Poetic mysticism and matchmaking introspection. [41:51] What compass guides you toward purpose? [45:10] The truth as a path to your best possible future. [50:34] Maslow’s forgotten pinnacle of self-transcendence. [54:28] Why self-actualization is an insufficient foundation for meaningful relationships. [1:03:09] Recommended reading for relationship cultivation. [1:07:43] A true, bittersweet tale of progressively deepening love. [1:13:28] The benefits of treating social media as an option rather than an obligation. [1:16:12] AI: good servant, poor master. [1:17:23] Blocking time for a top priority. [1:27:55] “It’s the tools, stupid.” [1:30:56] Embracing the constraints that stack the decks in your favor. [1:35:41] How to sign up for Greg’s free “Less, But Better” 30-day email program. [1:37:09] Employing the George Costanza opposite life hack. [1:40:53] Parting thoughts. MORE GREG MCKEOWN QUOTES FROM THE INTERVIEW “I don’t want to trust my weaknesses. I want to build a system that means my weaknesses become irrelevant.”— Greg McKeown “A flight is off track 90 percent of the time. An airplane literally only gets to where it’s supposed to get to at the time it’s supposed to get there because it readjusts constantly along the way. And I feel like that myself.”— Greg McKeown “There’s only two kinds of people in the world: there are people who are lost and there are people who know they are lost. I know how easy it is for me to get lost.”— Greg McKeown “There’s a big difference between 20 years of experience and the same year lived 20 times [in which] you don’t learn the lessons because you’re just going in circles and you’re just rushing, rushing and actually not getting closer to what the purpose of your life really is.”— Greg McKeown “AI perhaps makes a good servant, but it certainly makes a poor master. And if I’m not conscious that it is either already my master, or is trying to be, then it’s already over.”— Greg McKeown PEOPLE MENTIONED Anna McKeown Stephen Covey Hafez Stanley McChrystal Mary Oliver Abraham Maslow John Bowlby Gordon Gekko Amir Levine, Rachel S.F. Heller Sue Johnson Erik Newton Seth Godin George Costanza Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: TagsEffortless, Essentialism, Greg McKeown, life mission, priority, purpose'''
