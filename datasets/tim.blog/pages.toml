rld | Songbird Dulcimers The 4-Hour Workweek: Escape 9-5, Live Anywhere, and Join the New Rich by Tim Ferriss | Derek Sivers The 4-Hour Body: An Uncommon Guide to Rapid Fat Loss, Incredible Sex, and Becoming Superhuman by Timothy Ferriss | Derek Sivers How Groupthink Impacts Our Behavior | Verywell Mind What Is Asset Allocation and Why Is It Important? | Investopedia Varadaraja V. Raman — The Heart’s Reason: Hinduism and Science | The On Being Project System 1 and System 2 Thinking | The Decision Lab Thinking, Fast and Slow by Daniel Kahneman | Derek Sivers The Gift of Fear: Survival Signals That Protect Us from Violence by Gavin de Becker | Amazon The Work | Byron Katie Oblique Strategies: Over One Hundred Worthwhile Dilemmas by Brian Eno | Amazon A Quiet Place to Think About Music | MusicThoughts Brian Eno: Interview with the Producer of U2’s No Line on the Horizon | The Telegraph Nam June Paik: Moon Is the Oldest TV | Prime Video John Cage Performs “Water Walk” | I’ve Got a Secret Seesaws Built On US Border Wall Win Prestigious Design Prize | NPR The Story Of ‘4’33″‘ | NPR A 639-Year-Long John Cage Organ Performance Strikes a New Chord in Germany | NPR How Buildings Learn: What Happens After They’re Built by Stewart Brand | Derek Sivers Stewart Brand – The Polymath of Polymaths | The Tim Ferriss Show #281 The Latest in Technology, Science, Culture, and Business | Wired Interview of Kevin Kelly, Co-Founder of WIRED, Polymath, Most Interesting Man In The World? | The Tim Ferriss Show #25, #26, & #27 How to Do a Turkish Get-Up | Furthermore from Equinox Robust, Practical, and Fast | Clojure Simplicity Matters by Rich Hickey | Rails Conf 2012 Keynote Etymology of Complex | Online Etymology Dictionary Six Reasons the Puerto Rico Tax Incentives Aren’t All They’re Cracked Up to Be | US Tax Services Money — Master the Game: 7 Simple Steps to Financial Freedom by Tony Robbins | Derek Sivers Emergency: This Book Will Save Your Life by Neil Strauss | Amazon Tools of Titans: