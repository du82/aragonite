description = 'Please enjoy this transcript of my interview with Chris Sacca, co-founder of Lowercarbon Capital, managing a portfolio of countless startups in energy, industrial materials, and carbon removal. If it’s unf**king the planet, he’s probably working on it. Previously, Chris founded Lowercase Capital, one of history’s most successful funds ever, primarily known for its very early investments in … Continue reading "The Tim Ferriss Show Transcripts: Chris Sacca — How to Succeed by Living on Your Own Terms and Getting into Good Trouble (#790)"'
full_description = 'Posted on January 24, 2025January 24, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: Chris Sacca — How to Succeed by Living on Your Own Terms and Getting into Good Trouble (#790) 4 Comments Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with Chris Sacca, co-founder of Lowercarbon Capital, managing a portfolio of countless startups in energy, industrial materials, and carbon removal. If it’s unf**king the planet, he’s probably working on it. Previously, Chris founded Lowercase Capital, one of history’s most successful funds ever, primarily known for its very early investments in companies like Twitter, Uber, Instagram, Twilio, Docker, Optimizely, Blue Bottle Coffee, and Stripe. But you might just know him as the guy who wore those ridiculous cowboy shirts for a few seasons of Shark Tank. To purchase Chris’s ranch, schedule a viewing at FivePondsRanch.com. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! P.S. This episode features a special, one-of-a-kind introduction that Chris made of yours truly. 🙂 Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #790: Chris Sacca — How to Succeed by Living on Your Own Terms and Getting Into Good Trouble<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/9a1c14de-2fd4-47c3-9cf9-453c2393be75/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Chris Sacca: You know my host today as the human guinea pig, the sample size of one, and the only clinical trial on two feet and New York Times bestselling author of The 4-Hour Workweek, The 4-Hour Body, The 4-Hour Chef, and The 4-Minute Intimacy Guide. This man has inspired millions to learn Mandarin Chinese in just three hours, while doing handstand Kegels during their optimal billing cycle. As one of the founders of the life hacking movement, he leads by example and not having checked his email since the Clinton administration and outsourcing all of his sneezes and existential crises to Bolivia.. His chart-topping podcast practically gave birth to the Manosphere and spawned an entire generation of wannabe pod bros, who think dropping references to Stoicism makes them philosophical sages as they read undies ads from Mom’s basement while promoting pseudo-scientific creatine enema regimens. If it’s cool today, my host blogged about it in the ’90s, wrote a 13-point checklist for optimizing it, and has the lab results to prove it. When he’s not interviewing world-class performers with pauses so pregnant they wear elastic waistbands, you can find him meticulously organizing his pharmaceutical-grade kitchen fridge full of blood, urine, and stool samples, and his bathroom cabinet looks like a GNC nutrition store fucked a Japanese vending machine. He’s only 14 months away from having supplemented every possible molecular combination from the known periodic table. He has hot boxed with Himalayan monks, ice bathed with Arctic shamans, and achieved ego death with cultures that anthropologists haven’t even discovered yet. On four separate continents, there are sacred psychedelic ceremonies that tribes have named after him, and twice his meditations have opened portals to another dimension. He’s given lectures on Seneca in 27 languages, can ask for warm body oil and CBD cream in 31, and say, “Whoa, brother, we just tripped balls” in 38. I challenge any of you to identify a medieval weapon with which he hasn’t competed at the international level. This is a man who enchants the world’s most powerful and influential people with the insatiable curiosity of a four-year-old, the energy level of a seven-year-old who just ate three boxes of M&Ms, and when texting memes to his friends, the emotional maturity of a 10-year-old. He’s already prepared interview questions for future podcasts who have yet to be born. Carbs fear him. To-do lists quake in his presence. His morning routine starts before he goes to sleep, and his gratitude lists kick off by individually thanking each of his gut bacteria. His circadian rhythm is so optimized that he experiences next week’s REM sleep during yesterday’s power nap. He’s had romantic relationships with kettle bells, but we are told he is holding out for a human lady long-term. The world’s most eligible bachelor, who, just last week, stopped requiring potential dates to submit three years of sleep-tracking data. The man, the myth, the legend, the guy who would absolutely win gold if self-experimentation and self-pleasure were an Olympic sport. It’s the one, and thank God for all of us, the only, Tim Ferriss, everyone. Tim Ferriss, everyone. Tim Ferriss: Now, for people who have not heard the first episode, but maybe they see the headline, which is, “Chris Sacca On Being Different and Making Billions.” Would you like to just give a quick snippet of where you grew up? I believe it was somewhere in Connecticut as the scion of a wealthy family. Am I getting that wrong?Chris Sacca: I grew up in Lockport, New York, a little town on the Erie Canal just north of Buffalo. A town that is as working class as it gets. We had a town employer, it was the GM plant where they made radiators and air conditioners for GM cars. Most of my buddies’ dads worked at the plant. And I feel really lucky to have grown up in that kind of place. It’s a safe place, it’s a fun place. I wasn’t exposed to any extreme wealth and I also wasn’t exposed to any extreme poverty. But at the same time, I also feel lucky to have seen the canary in the coal mine. And what happens when the company town factory shuts down and the jobs ship off to Mexico, and the pension’s bankrupted. My buddies’ dads who were retired suddenly had to work as greeters at Walmart. Before long, we had the largest trailer park in the Northeast in our town, drugs that ultimately became fentanyl in modern times really set in. And there was just a lot of angst and depression. And I watched that town go from reliably union Democrat to hardcore MAGA. But along the way I really saw the empathetic roots for it. Why is this happening? What happens when people lose agency over their lives? When they feel like they can’t provide for their kids the way their parent provided for them. When they lose their small businesses, and those are replaced by Walmart or Home Depot. And I feel like that’s something that I’ve really tried to stay in touch with. And I know we’re not really going to talk about politics, but it leaves me with the state of America today never being a surprise. I was just back in Buffalo this weekend. Go Bills. And nothing about what’s happening in America is surprising. I don’t love it, but it doesn’t shock me. I feel really grateful to have grown up there. Now, what it means is, by the time I got into this business, I didn’t have a network. I didn’t know anybody. I didn’t even know what money really was. I had to make my own way in everything I did. And I had these incredibly bright and supportive parents who went way out of their way to create opportunities for us, me and my brother. But at the same time, I was an outsider to the kind of stuff we do now, for sure. And I still feel like that. I lived in the Valley for a while, in Silicon Valley. But as you know, Tim, because you visited me in various places, I’ve spent more of my time outside. I live in the Rockies now. I live in Montana. Before that, Wyoming. Before that, Truckee. I really try to stay in places where real people live and work. And our kids go to public school. And I would never claim to be fully in touch, because my life is ridiculously special. But at the same time, I feel really lucky the way I grew up going to public schools and being one among many. And I worry that the kind of people, Tim, you and I know, and the kind of people we work with, aren’t those people anymore. And have really lost touch. And you can see it in the decisions they make and the stuff they say. Did we start this out lighthearted enough? Are we onto — did we — Tim Ferriss: I was going to do some knock-knock jokes, but I’m not sure that’s an appropriate segue. Chris Sacca: There’s other stuff we said in the old episode. Look, I was really good at school. I went to university for math starting in seventh grade. I think one thing that I’ve talked about before, but I will bring up because I see it missing these days, is I always had a hustle. I always had a little bit of a side business. From the time I was six years old I was going around the neighborhood selling walnuts that I’d poke holes in and call air fresheners, or rocks that I had found in a parking lot. I was literally going door to door. Tim Ferriss: What was your JT Marlin & Associates? What was your — Chris Sacca: 100 percent. I started trading commodities when I was 13 or 14. I had a pager that had a 45-second delay to the Chicago Board of Trade. Talk about latency. And I was trading live hogs. I just always had a business: mowing lawns, washing cars, detailing, a paper route. Tim Ferriss: I’m not sure we talked about the live hogs. Chris Sacca: Somehow we skipped that. Tim Ferriss: How did you even get into commodities? Chris Sacca: I’ll tell you, my dad’s best friend ran basically a construction and equipment rental business that I have talked to you about. Where it was a gritty-ass job. My mom and dad believed in — Tim Ferriss: This is the sweet and sour. Chris Sacca: Yeah, exactly. It was just grind it out, work your ass off in a real job, job. And my boss there, who is my dad’s best friend, he was under strict instruction to my dad to just kick our asses and make us appreciate everything we had. And hopefully go on to work our asses off in school and maybe not have to do a job like that someday. A lot of my coworkers were on parole. And it was a tough dead end situation. But that guy had a commodities account on a computer up in the attic of the building I worked in. And he said, “Come here. You probably know what the hell is going on with this stuff.” I didn’t. But he showed it to me. I went to the library, I started learning about Stochastics, about charts, and technical analysis. Then I was reading about seasonality of literally frozen orange juice concentrate, like Trading Places. And cocoa and coffee and oil. And I identified what I thought was a pattern anomaly in live hogs. And he had this deal with me. He said, “Look, I’ve got $3,000 in this account, you make a trade. Take a week, I want you to think about it. You make a trade. If you make money, we’ll split the upside. If you lose money, I’ll cover it.” By the way, that’s called venture capital. I went all in. I read everything, I studied everything. I looked at these charts. And imagine charts on a low res green monitor, right? Tim Ferriss: Like WarGames style. Yeah. Chris Sacca: And I had this pager, and I’m trying to go to school and also monitor my quotes on my — I think it was called a Quotron pager. And eventually I placed this trade, and two weeks later I cashed out, and I netted $171 for myself. Tim Ferriss: Nice. Chris Sacca: And I just remember thinking, “Downstairs, I’m making $4.25 an hour. Upstairs, I just made $171 by pushing a button and using my brain.” I was like, “I want to be the guy who works upstairs.” I can’t tell you how seminal that experience was for me, the rest of my life. There’s only so far you can lever a man-hour. Bob Haas was that guy’s name. I feel incredibly indebted to him for that kind of exposure. And the Rich Dad Poor Dad world— My mom and dad, they didn’t own stocks, they weren’t really investors like that. They had a rental property once. But Bob Haas was like my rich dad, a guy who got me exposed to capital markets. Tim Ferriss: Amazing. Live hogs. Chris Sacca: Yeah. But I also had hustles like, in high school I ran a card room. I started one in junior high, but by the time I was in high school I ran a full on card room. I paid off a teacher. Rest in peace, Mr. Main, he was on the rake. We were always hustling. I was selling Blow Pops with my buddy Hawkeye. We ran a little sports book. Tim Ferriss: Hawkeye? Did he give himself that nickname? Chris Sacca: No, no, no, that was given to him at his birth. Actually, I was just at the Bills game, all my high school buddies. And I turn around. I’m talking to some other people, I had some family. I turn around and I see my daughters, who are 13, 11, and nine, playing beer pong with my high school buddies. And we’d been deep in the tailgate with Pinto Ron, if anyone follows the Bills. The girls are eating bacon off of Pinto Ron’s car and making pizza with Pizza Pete, who cooks pizza in the file cabinet, literally. Go Google that, Pinto Ron and Pizza Pete ar'
