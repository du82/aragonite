at the source of this miraculous compound: Easter Island. Here, we discuss how one of the most important discoveries of medical science was almost lost, why metabolism (along with longevity) research is key to treating a long list of diseases, intermittent dosing of rapamycin, parenting advice from scientists on confidence and conflict, the necessary failures of good science, good fonts versus bad fonts, “non-potato” relationships, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. Continue reading “Dr. Keith Baar, UC Davis — Simple Exercises That Can Repair Tendons (Tennis Elbow, etc.), Collagen Fact vs. Fiction, Isometrics vs. Eccentrics, JAK Inhibitors, Growth Hormone vs. IGF-1, The Anti-RICE Protocol, and How to Use Load as an Anti-Inflammatory (#797)”'
