rek’s experimental housing project. [01:03:51] Rich Hickey and practical applications of simplicity. [01:29:20] Tyler Cowen. [01:35:57] Inchword and language learning. [01:46:35] Traveling to inhabit philosophies. [01:54:14] Parting thoughts. MORE DEREK SIVERS QUOTES FROM THE INTERVIEW “Whatever you feel yourself leaning away from, try leaning into. If you hate opera, then go learn more about opera. And if you hate sports, well, then go learn more about sports. It’s usually just learning about something gives you an appreciation for this thing that you used to just dismiss.”— Derek Sivers “I travel to inhabit philosophies.”— Derek Sivers “Don’t jump through hoops to save taxes, jump through a hoop to go make more money. That’s the growth choice anyway. That’s the thought process that leads you to make growing decisions, not shrinking decisions.”— Derek Sivers “I’m willing to throw myself in and feel the pain to see if I’ve done it wrong.”— Derek Sivers “When I’m around people who I know agree with me, my inherent curiosity level drops a bit. And when I’m around people who I know don’t think like me, my curiosity piques.”— Derek Sivers “I deliberately fucked up my life and made a bunch of crazy fucking decisions, and some of them worked out great, and some of them didn’t. And I’m so happy that I did that.”— Derek Sivers “So often, the difference between success and failure is the mindset that leads you to take different actions. But if you just look at a situation, and you say, “That’s it. That’s what the situation is,” I’m not talking about physical things. I mean declaring something to be a dead end, declaring something to suck, these are all things of the mind, and nothing of the mind is necessarily true. Everything that’s just in the mind is just one perspective.”— Derek Sivers “It can be much harder to do something that is objectively simple, that stands alone, that isn’t dependent on other things. It can be harder to make that, but it’s ultimately usually a better choice because it’s more maintainable, it’s easier to change, it’s easier to stop and start. It’s simpler even if it’s harder to make.”— Derek Sivers “Esperanto is hippie Klingon.”— Derek Sivers PEOPLE MENTIONED Seth Godin Wilfred Thesiger T. E. Lawrence Zayed bin Sultan Al Nahyan Lee Kuan Yew Mohammad Kazim Cormac McCarthy Richard Branson Elon Musk Gavin de Becker Byron Katie Brian Eno John Cage Nam June Paik Stewart Brand Kevin Kelly Frank Lloyd Wright Rich Hickey Tony Robbins Neil Strauss George Costanza Tyler Cowen Satoshi Nakamoto John F. Kennedy Jeff Koons Benny Lewis Ludwik Lejzer Zamenhof Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferri'''
