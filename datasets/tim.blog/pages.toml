description = 'Please enjoy this transcript of my interview with Brandon Sanderson (@BrandSanderson), the #1 New York Times bestselling author of The Stormlight Archive series and the Mistborn saga; the middle-grade series Alcatraz vs. the Evil Librarians; and the young-adult novels The Rithmatist, the Reckoners trilogy, and the Skyward series. Brandon has sold more than 40 million … Continue reading "The Tim Ferriss Show Transcripts: Brandon Sanderson on Building a Fiction Empire, Creating $40M+ Kickstarter Campaigns, Unbreakable Habits, The Art of World-Building, and The Science of Magic Systems (#794)"'
full_description = 'Posted on February 7, 2025February 12, 2025 by Tim FerrissThe Tim Ferriss Show Transcripts: Brandon Sanderson on Building a Fiction Empire, Creating $40M+ Kickstarter Campaigns, Unbreakable Habits, The Art of World-Building, and The Science of Magic Systems (#794) Leave a comment Topics: CategoriesThe Tim Ferriss Show TranscriptsShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint Please enjoy this transcript of my interview with Brandon Sanderson (@BrandSanderson), the #1 New York Times bestselling author of The Stormlight Archive series and the Mistborn saga; the middle-grade series Alcatraz vs. the Evil Librarians; and the young-adult novels The Rithmatist, the Reckoners trilogy, and the Skyward series. Brandon has sold more than 40 million books in 35 languages, and he is a four-time nominee for the Hugo Awards, winning in 2013 for his novella The Emperor’s Soul. That same year, he was chosen to complete Robert Jordan’s The Wheel of Time series, culminating in A Memory of Light. Brandon cohosts (with fellow author Dan Wells) the popular Intentionally Blank podcast and teaches creative writing at Brigham Young University. Transcripts may contain a few typos. With many episodes lasting 2+ hours, it can be difficult to catch minor errors. Enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the interview on YouTube. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #794: Brandon Sanderson on Building a Fiction Empire, Creating $40M+ Kickstarter Campaigns, Unbreakable Habits, The Art of World-Building, and The Science of Magic Systems<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/000622c1-3a74-42e1-923b-5b5349f6f85a/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> DUE TO SOME HEADACHES IN THE PAST, PLEASE NOTE LEGAL CONDITIONS: Tim Ferriss owns the copyright in and to all content in and transcripts of The Tim Ferriss Show podcast, with all rights reserved, as well as his right of publicity. WHAT YOU’RE WELCOME TO DO: You are welcome to share the below transcript (up to 500 words but not more) in media articles (e.g., The New York Times, LA Times, The Guardian), on your personal website, in a non-commercial article or blog post (e.g., Medium), and/or on a personal social media account for non-commercial purposes, provided that you include attribution to “The Tim Ferriss Show” and link back to the tim.blog/podcast URL. For the sake of clarity, media outlets with advertising models are permitted to use excerpts from the transcript per the above. WHAT IS NOT ALLOWED: No one is authorized to copy any portion of the podcast content or use Tim Ferriss’ name, image or likeness for any commercial purpose or use, including without limitation inclusion in any books, e-books, book summaries or synopses, or on a commercial website or social media site (e.g., Facebook, Twitter, Instagram, etc.) that offers or promotes your or another’s products or services. For the sake of clarity, media outlets are permitted to use photos of Tim Ferriss from the media room on tim.blog or (obviously) license photos of Tim Ferriss from Getty Images, etc. Tim Ferriss: So Brandon, just when we were doing sound check — Brandon Sanderson: Yes. Tim Ferriss: What did you do? Brandon Sanderson: So when I was in kindergarten, I was taught the state song, right? And I have a good friend, Mary Robinette. She worked in stage for a while and we did a podcast together when podcasts were brand new, and she would always soundcheck by doing the “Jabberwock” poem, just this beautiful poetry. She had learned to memorize a poem so that they could get a soundcheck because people generally don’t talk enough for a soundcheck. And so then they come to me and I’d be like, “I’m talking, I’m talking.” You’ve seen it — Tim Ferriss: I’ve seen it. Brandon Sanderson: — the stuff that people do. Tim Ferriss: I’ve seen it. Brandon Sanderson: And they’re like, “Is that enough? Is that enough?” They’re like, “Still some more,” and you’re like, “Oh, I’m talking, I’m talking.” So I thought, I need a thing, but I don’t know any poetry, but I do know what Ms. Sukup taught me in kindergarten, which is the state song, and so I just started listing off the states in alphabetical order and it became a thing. So now they soundcheck me off with a list of states. Tim Ferriss: You made it to New Mexico. I’m not sure I could make it past California without making a mistake. Brandon Sanderson: I still hear the song in my head, “50 Nifty United States.” Tim Ferriss: All right. Well, let’s leap off of that. Do you have, would you say, in terms of superpowers, an unusual memory, or is there something just to the rhythm and musicality of that that made it stick? Brandon Sanderson: No, I don’t think I have an unusual memory. Well, I have an unusual one. I don’t have an uncommonly good one. How about that? Tim Ferriss: Mm-hmm. Brandon Sanderson: My wife always jokes I don’t forget a story and that I don’t tend to reread books. I don’t tend to rewatch movies because I’ve seen it, I’ve read it. 20 years or so, I’ll go back and rewatch something, but stories just stick with me. I can tell you about stories that I read when I was still a teenager, but I will forget where my keys are and I will forget people’s names and I will — all of that stuff. I joke that I’ve just got so much RAM and I’ve filled it all with story ideas and so everything else kind of just gets squeezed out the ears. Tim Ferriss: Well, it seems like where we’re sitting, where we’re sitting at HQ, it seems like the design of Dragonsteel, maybe the intention behind it is to allow you to do that on some level. Brandon Sanderson: Yeah, yeah. I mean, everything in our company is built around “Let Brandon cook, and take away from Brandon anything that he doesn’t have to think about or doesn’t strictly need to.” I actually think this is kind of a Tim Ferriss thing, right? Like my water bottle, I don’t have to worry about refilling it and having ice in the morning. I’ve set up a system where somebody does that and I just pick it up and go. The more that I can keep out of my brain that I have to track, the better, because I am always constructing narrative. I’m always working on the story, and so, yeah. Tim Ferriss: Well, let’s give another example of productivity that I don’t want to say I vetoed, but it was a conversation — Brandon Sanderson: Yes. Tim Ferriss: — before we started recording. How many books or book plates do you sign per year? Brandon Sanderson: So we need between fifty thousand and a hundred thousand times my signature signed. The story is usually I’m sitting here and signing pages while I’m doing anything, because if I have to sign my name a hundred thousand times, then you know — Tim Ferriss: I’d take up the empty space. Brandon Sanderson: Yeah, and we actually used to. Once upon a time, we would get the books, the full books, and I would sit and sign them, and that’s just a massive undertaking. We couldn’t do that anymore. When it got over around 10,000, I’d actually listen to podcasts and go sit and sign books and sign books and sign books. Now we get the pages, like the front page, and we just give them to me in stacks. If anyone wants to see it, my podcast exists so that I can sign the pages. It’s the reverse. I started up because I need to sign these things and I’ll just sit and zip through them normally while I’m doing anything else. But today, I wanted to give you my undivided attention. Tim Ferriss: I appreciate that. And I’m going to have a lot of super fans of yours, I’m sure, wish and petition me that I would’ve asked a different set of questions. But I’m actually going to start with Seoul, Korea because as I mentioned, I was East Asian studies major, spent formative time, completely changed my life in Japan and other places, Taiwan and mainland China also. Where does Seoul, Korea fit into your life? Brandon Sanderson: So I’m a member of the Church of Jesus Christ of Latter-Day Saints. A lot of us go on two-year missions, can be anywhere. It can be local, it can be overseas. I ended up going to Korea. I got the letter saying, “Hey, this is where we’d like you,” and I’m like, “Where’s Korea?” But I loved my time there. It was really formative for me in multiple ways, one of which is kind of more amusing. I was, at the time, a chemistry major in college, and I was so happy to be on another continent from chemistry. I had those two years away to really kind of reassess my life and kind of grow up. And most people, when they grow up, they go away from the artistic pursuits because they don’t make a lot of sense. I grew up and came back and said, “I’m going to do this,” right? “I’m going to be a writer.” But living in another culture, living where you are a minority, granted a privileged minority still, but a minority, living and seeing that the way that people’s language influences the way they think about the world, the way that their social mores impact their relationships with one another, and all of these things, was extremely formative for me in understanding how to approach writing a fantastical culture just on a fundamental basis, getting rid of some of these ideas that the way that I do things is the only way to do things. Tim Ferriss: The Korean language, for people who haven’t been exposed, particularly the writing system — Brandon Sanderson: Yes. Tim Ferriss: So Hangul, if people want to learn to read Korean, you won’t be able to understand what you’re reading, but if you want to sound it out, you can learn it in a few hours. Brandon Sanderson: Yeah. We learned it in a few hours. Do you know the story? Tim Ferriss: Tell the story. Brandon Sanderson: The story. You know the story. Tim Ferriss: I do, but I think people will appreciate it. Brandon Sanderson: Yes. This is obviously mythologized, right? But King Sejong, so King Sejong, he’s the guy on essentially the $10 bill in Korea. He is their George Washington, and Sejong the Great. And what happens, Chinese is a really fascinating writing system because it’s logographic, which means that anyone can read a Chinese character. It’s more of a hieroglyph than it is — you can’t sound it out. And so because anyone can read it, it transcends language in a lot of ways. You can see the symbol for person and know it means person, whether you speak Mongolian, or whether you speak Thai, or whether you speak Japanese or Korean or Chinese, so it makes it a great kind of language for trade. But it also is extremely hard to learn because every concept must have essentially its own letter. And so to be fluent in reading it, you need to learn 2,000 to 3,000 letters. Tim Ferriss: Yeah. Brandon Sanderson: And so it was a really bad system for a common people to learn how to read. And King Sejong was like, “My people are illiterate. They can’t learn Chinese. We must have our own writing system that you can sound out, that you sound out Korean.” And he gathered his scholars, and the story is they together created the system that would have no deviations. It read like it sounded. And they designed it based on the movements of the mouth you make. And then King Sejong loved it so much, he wrote it on little leaves and then spread it out because the upper class did not want people to learn how to read and they were very against it. They’re like, “Oh, we don’t want the commoners to read. That’s for us.” Passing the tests in Chinese was a big — Tim Ferriss: Like Latin for — Brandon Sanderson: Yeah. Tim Ferriss: — the high priesthood. Brandon Sanderson: And so Sejong wrote it on the letters and it blew through Korea and the people picked it up and it was so divinely inspired that they intrinsically knew how to read Korean. And he frustrated the attempts of the nobles from keeping people to read by giving it to people written on leaves. It’s so delightful. Tim Ferriss: It is an amazing, amazing mythologized story. And the Korean people are very proud of this writing system for good reason. I encourage everybody to just take a few hours. I think there’s even a comic book called How to Learn to Read Korean in 15 Minutes or something like that. Slight exaggeration, it’s going to take you more than 15 minutes — Brandon Sanderson: Yeah. Tim Ferriss: — but in 60 minutes you could definitely get the basics and figure it out. Brandon Sanderson: Definitely gives you a false sense of your own skill. When you learn it, you’re like, “Wow, I’m reading,” and they’re like, “All right, now the actual language, what these things mean.” Tim Ferriss: Yeah. Good news, if you do learn some Korean, you can hop reasonably easily to Japanese, and in some cases, to Chinese as well. So you might have jeonhwa for telephone, then diànhuà in Mandarin, and then denwa in Japanese. So there’s a lot of overlap. Or if you wanted to say “Tansan mizu o kudasai,” like, “Please give me sparkling water,” in Japanese, it’d be “Tansansu juseyo” in Korean. Brandon Sanderson: Yep, mm-hmm. Tim Ferriss: So anyway, if you get one, then it’s a good branch off to other things. All right, I’m going to cut my linguistics nerding short. Brandon Sanderson: You need to create a conlang. Have you ever done it? Tim Ferriss: It? I have actually. So you should explain what that means. But I have actually spent some time on it, and I owe you a huge debt of gratitude because I listened to probably 40 episodes of Writing Excuses. Brandon Sanderson: Oh. Tim Ferriss: When I was working on my first real attempt at fantasy worldbuilding a few years ago, and I wanted to incorporate language as a core piece of it. And I spent a lot of time also looking at Tolkien’s work with languages. Brandon Sanderson: He’s the master. Tim Ferriss: Yeah. Brandon Sanderson: Yeah. Tim Ferriss: Unbelievably complex. And I also, at one point, this is actually from my third book, reached out to the gentleman who designed the Na’vi language in Avatar, which in very partial measures stemmed from some of his exposure to some of these East Asian languages as well. But okay, so how would you approach and how do you think about language construction? Brandon Sanderson: Are you sure we’re not getting too nerdy for your audience? Tim Ferriss: Ah, you know what —'
