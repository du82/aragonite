full_description = 'Posted on March 23, 2023March 30, 2023 by Tim FerrissDavid Deutsch and Naval Ravikant — The Fabric of Reality, The Importance of Disobedience, The Inevitability of Artificial General Intelligence, Finding Good Problems, Redefining Wealth, Foundations of True Knowledge, Harnessing Optimism, Quantum Computing, and More (#662) 5 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="480" src="https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration.jpeg?resize=600%2C480&#038;ssl=1" alt="" class="wp-image-66881" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?resize=1024%2C819&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?resize=300%2C240&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?resize=768%2C614&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?resize=1536%2C1229&amp;ssl=1 1536w, https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?resize=2048%2C1638&amp;ssl=1 2048w, https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2023/03/David-Deutsch-Naval-Ravikant-Illustration-scaled.jpeg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" />Illustration via 99designs “Wealth is not a number. I don’t think it can be characterized very well by a number. It is the set of all transformations that you are capable of bringing about. That is your wealth. And if optimism is true, then there’s no limit to wealth.“ — David Deutsch David Deutsch (@DavidDeutschOxf) is a visiting professor of physics at the Centre for Quantum Computation, a part of the Clarendon Laboratory at Oxford University, and an honorary fellow of Wolfson College, Oxford. He works on fundamental issues in physics, particularly the quantum theory of computation and information and especially constructor theory, which he is proposing as a new way of formulating laws of nature. He is the author of The Fabric of Reality and The Beginning of Infinity, and he is an advocate of the philosophy of Karl Popper. Naval Ravikant (@naval) is the co-founder of Airchat and AngelList. He has invested in more than 100 companies, including many mega-successes, such as Twitter, Uber, Notion, Opendoor, Postmates, and Wish. You can see his latest musings on Airchat and subscribe to Naval, his podcast on wealth and happiness, on Apple Podcasts, Spotify, Overcast, or wherever you get your podcasts. You can also find his blog at nav.al. For more Naval-plus-Tim, check out my wildly popular interview with him from 2015 (nominated for “Podcast of the Year”) and our conversation from 2020. Naval also co-piloted the interviews with Ethereum creator Vitalik Buterin and famed investor Chris Dixon. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, Google Podcasts, Stitcher, Amazon Music, or on your favorite podcast platform. Brought to you by LinkedIn Jobs recruitment platform with 900M+ users, FreshBooks cloud-based small business accounting software, and Athletic Greens’s AG1 all-in-one nutritional supplement. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" 