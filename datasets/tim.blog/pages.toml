full_description = '''Posted on August 23, 2015February 18, 2025 by Tim FerrissThe "Wizard" of Hollywood, Robert Rodriguez (#98) 69 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="399" src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/rodriguez_foto_jpg_cropped.jpg?resize=600%2C399&#038;ssl=1" alt="" class="wp-image-16169" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/rodriguez_foto_jpg_cropped.jpg?w=962&amp;ssl=1 962w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/rodriguez_foto_jpg_cropped.jpg?resize=300%2C200&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/rodriguez_foto_jpg_cropped.jpg?resize=768%2C511&amp;ssl=1 768w" sizes="(max-width: 767px) 90vw, 600px" />Robert Rodriguez, nicknamed “The Wizard.” Robert Rodriguez (@Rodriguez) is a film director, screenwriter, producer, cinematographer, editor, and musician. He is also the founder and chairman of El Rey Network, the new genre-busting English-language cable network. While a student at the University of Texas at Austin in 1991, Rodriguez wrote the script for his first feature film while he was a paid subject in a clinical experiment at a drug research facility. That paycheck covered the cost of shooting his film. The film, “El Mariachi,” went on to win the coveted Audience Award at the Sundance Film Festival, and became the lowest budget movie ever released by a major studio. Rodriguez wrote about these experiences in Rebel Without a Crew, a perennial guide for the independent filmmaker. Rodriguez went on to write, produce, and direct a series of successful films including, Desperado, From Dusk Till Dawn, the Spy Kids franchise, Once Upon a Time in Mexico, Frank Miller’s Sin City, and Machete, among many others. I hope you find listening to this episode as enjoyable as it was to record. You can find the transcript of this episode here. Transcripts of all episodes can be found here. Listen onApple Podcasts Listen onStitcher The "Wizard" of Hollywood, Robert Rodriguez (#98)<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/a1a49bef-971a-4c1c-b9af-216fd217e7c7/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Want to hear another podcast with another award-winning movie maker? Listen to my conversation with Brian Koppelman, co-writer/producer of Rounders, The Illusionist & Ocean’s Thirteen. In this episode, we explore how he got started, how he handles rejection, his big breaks, his creative process, and much more. Ep. 10: Brian Koppelman, co-writer/producer of Rounders, Ocean's Thirteen, The Illusionist, etc.<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/a7042c78-d249-4a70-8be3-cf68760113ba/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by 99designs, the global creative platform by Vista that makes it easy for designers and clients to work together to create designs they love. Its creative process has become the go-to solution for businesses, agencies, and individuals, and I have used it for years to help with display advertising and illustrations and to rapid-prototype the cover for The Tao of Seneca. Whether your business needs a logo, website design, business card, or anything you can imagine, check out 99designs. You can work with multiple designers at once to get a bunch of different ideas or hire the perfect designer for your project based on their style and industry specialization. It’s simple to review concepts and leave feedback so you’ll end up with a design that you’re happy with. Click this link and get $20 off plus a $99 upgrade. QUESTION(S) OF THE DAY: What’s the biggest risk you’ve ever taken and what was the result? Please let me know in the comments. Scroll below for links and show notes… Enjoy! Selected Links from the Episode View more about the Directors Chair episodes here Robert’s first movie, El Mariachi, and production company Los Hooligans Productions The making of El Mariachi – Rebel without a Crew More information about Bedhead – the short film Robert made before El Mariachi More information about Troublemaker Studios Check out the movie Sin City Check out the movie Desperado Simon Sinek – Start with Why Cooking School: Texas BBQ | Sin City Breakfast Tacos Robert’s TV Network El Rey Connect with Robert Rodriguez: @ElReyNetwork | @Rodriguez | @DuskElRey | @LuchaElRey Show Notes How does Robert go about journaling? [05:04] How does Robert keep morale high when working with a crew? [13:29] Being creative on set [14:31] “What clicked” that allowed Robert to be truly creative [15:57] Embracing the creative process “in the moment” [19:28] The amazing story of how El Mariachi was financed [21:41] What was the story behind El Mariachi getting released by Columbia? [24:45] How to maintain the creative mindset once resources are no longer a creative driver [35:22] How cartooning helped creative endeavors? [39:53] The strange reason Robert changed the name of his production company to Troublemaker Studios [44:11] What book does Robert most frequently gift to other people? [55:35] The Directors Guild, Frank Miller, Sin City & the ‘Special Guest Director’ [57:41] Why setting precedents are important [1:09:59] How Robert spends his downtime [1:14:38] Why was Robert so keen to make the movie Sin City? [1:19:54] What does the first 60 minutes of Roberts’ day look like? [1:26:29] Robert’s TV network, El Rey [1:32:52] What is Robert geeking out on right now? [1:51:56] Tips for early stage filmmakers [1:54:37] What advice does Robert have for his 30-year-old self? [1:58:39] Robert’s one request of you, the listener. [2:01:07] People Mentioned Francis Ford Coppola Quentin Tarantino Jim Cameron Michael Mann Robert Newman Antonio Banderas Jack Ma John Carpenter Winston Churchill Simon Sinek Frank Miller George Lucas Bruce Willis Benicio del Toro Robert De Niro George Miller General Stan McChrystal Johnny Depp Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tagscreativity, El Mariachi, El Rey, film making, journaling, movie making, movies, robert Rodriguez, The Tim Ferriss Show'''
