full_description = '''Posted on October 26, 2020November 4, 2020 by Tim FerrissSeth Godin on The Game of Life, The Value of Hacks, and Overcoming Anxiety (#476) 17 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="480" src="https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration.jpg?resize=600%2C480&#038;ssl=1" alt="" class="wp-image-53402" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?resize=1024%2C819&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?resize=300%2C240&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?resize=768%2C614&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?resize=1536%2C1229&amp;ssl=1 1536w, https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?resize=2048%2C1638&amp;ssl=1 2048w, https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2020/10/Seth-Godin-Illustration-scaled.jpg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" />Illustration via 99designs “Perfectionism has nothing to do with perfect.”— Seth Godin Seth Godin (@ThisIsSethsBlog) is the author of 19 international bestsellers translated into more than 35 languages, including Tribes, Purple Cow, Linchpin, The Dip, and This Is Marketing. He writes daily at Seths.blog, which is one of the most popular blogs in the world. He’s also the founder of the altMBA and The Akimbo Workshops, online seminars that have transformed the work of thousands of people. He writes about the post-industrial revolution, the way ideas spread, marketing, quitting, leadership, and most of all, changing everything. His newest book is The Practice: Shipping Creative Work. In this episode, we explore many topics, including: The value of hacksThe magic of HamiltonWhat learning to juggle and cultivating creativity have in commonThe myth of qualityWhat Seth means by “Don’t steal the revelation.”Focusing on generosity instead of anxietyChoosing the ruleset of your own game of lifeHow Joni Mitchell eschewed the safety of the sinecureWhat you would do if you knew you would fail? Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Stitcher, Castbox, Google Podcasts, or on your favorite podcast platform. Brought to you by Athletic Greens all-in-one supplement, Four Sigmatic mushroom coffee, and Tonal smart home gym. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #476: Seth Godin on The Game of Life, The Value of Hacks, and Overcoming Anxiety<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/44c9d0ba-7cc8-455b-ab0d-0e33d4142401/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Four Sigmatic and their delicious mushroom coffee, featuring lion’s mane and chaga. It tastes like coffee, but it has less than half the caffeine of what you would find in a regular cup of coffee. I do not get any jitters, acid reflux, or any type of stomach burn. It’s organic and keto friendly, plus every single batch is third-party lab tested. You can try it right now by going to FourSigmatic.com/Tim and using the code TIM. You will receive up to 39% off on the lion’s mane coffee bundle. Simply visit FourSigmatic.com/Tim. If you are in the experimental mindset, I do not think you’ll be disappointed. This episode is brought to you by Tonal! Tonal is the world’s most intelligent home gym and personal trainer. It is precision engineered and designed to be the most advanced strength studio on the market today. Tonal uses breakthrough technology—like adaptive digital weights and AI learning—together with the best experts in resistance training so you get stronger, faster. Every program is personalized to your body using AI, and smart features check your form in real time, just like a personal trainer. Try Tonal, the world’s smartest home gym, for 30 days in your home, and if you don’t love it, you can return it for a full refund. Visit Tonal.com for $100 off their smart accessories when you use promo code TIM100 at checkout. What was your favorite quote or lesson from this episode? Please let me know in the comments. SCROLL BELOW FOR LINKS AND SHOW NOTES… Want to hear the last time Seth was on the show? Click here to listen to our conversation in which we discussed how Seth deals with overwhelm, saying “no” and setting boundaries, long work vs. hard work, how to find your smallest viable audience, crafting April Fool’s jokes, and much more. #343: Seth Godin on How to Say “No,” Market Like a Professional, and Win at Life<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/f90ab568-0eb2-4724-8b22-3d08685cf062/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> SELECTED LINKS FROM THE EPISODE Connect with Seth Godin: Website | Seth’s Blog | Twitter | Instagram | Facebook | altMBA | The Akimbo Workshops Seth’s previous appearances on the podcast: 402, 343, 177, 138 The Practice: Shipping Creative Work by Seth GodinOther Books by Seth GodinProfessionals, Hacks, and Amateurs | Seth’s BlogHackneyed | World Wide WordsSpecification-Based Management is Not Sufficient | The W. Edwards Deming InstituteTotaling Up the Repairs on the Cheapest Rolls-Royce Phantom in the USA | AutotraderHamilton | BroadwayWest Side Story | BroadwayRichard Serra Exhibitions | Dia BeaconYou Can’t Say You Can’t Play | Seth’s Blog1,000 True Fans | The TechniumNike ‘Just Do It’ Slogan Inspired by Utah Spree Killer Gary Gilmore | Business InsiderHow Long Does It Take To Climb Mount Everest? | OutdoorsmanLabPermission Marketing: Turning Strangers into Friends and Friends into Customers by Seth GodinThe Tipping Point: How Little Things Can Make a Big Difference by Malcolm GladwellLinchpin: Are You Indispensable? by Seth GodinDouble Take: The Art of Elizabeth King | Prime VideoOrigin and Meaning of Amateur | Online Etymology DictionaryThe Interview Master: Cal Fussman and the Power of Listening | The Tim Ferriss Show #145House Of The Rising Sun by Joni MitchellThe 4-Hour Chef: The Simple Path to Cooking Like a Pro, Learning Anything, and Living the Good Life by Timothy FerrissTufte’s Principles | thedoublethinkSurvival Is Not Enough: Zooming, Evolution, and the Future of Your Company by Seth GodinPurple Cow: Transform Your Business by Being Remarkable by Seth GodinThe HBS Case Method | Harvard Business SchoolCase Studies | Stanford Graduate School of BusinessThe Sunk Cost Fallacy | You Are Not So SmartR.E.M. Reflect on ‘Radical’ ‘Out of Time’ LP 25 Years Later | Rolling StoneThe Go-Go’s | ShowtimeOn Kings by David Graeber and Marshall SahlinsStone Age Economics by Marshall SahlinsThe Flintstones | Prime VideoYoyodyne | WikipediaSquidoo | WikipediaRefuseniks | YIVOThrowing and Catching | Seth’s BlogTerry Laughlin, The Master Who Changed My Life | The Tim Ferriss Show #276The History of Search Engines: A Timeline | WordStreamMaslow’s Hierarchy of Needs | Simply PsychologySinecure | WikipediaDon Juan’s Reckless Daughter by Joni MitchellGod Must Be a Boogie Man by Joni Mitchell SHOW NOTES What’s the etymology of the word “hack,” and how does it relate to Seth’s new book, The Practice? [07:35]What is the specific definition of the word “quality,” and how does it differ from its generally accepted meaning? [09:21]What makes Lin-Manuel Miranda’s Broadway blockbuster Hamilton more “magical,” in Seth’s estimation, than West Side Story? Perhaps the real question: what is magic, and what does it take to make it? [12:40]Why hiding behind words like “quality” or “perfection” as a means of postponing action to avoid risk is a cop-out — especially these days. [16:49]What Isaac Asimov and Gary Gilmore can teach us about writer’s block and other common procrastinations. [19:18]Examining what we mean when we tell ourselves our work isn’t “good enough,” weighing the real reasons we might opt to take a less challenging path, what it sometimes takes to get us back on the right path, and why generosity doesn’t mean free. [24:59]“Process saves us from the poverty of our intentions.” -Elizabeth King [33:21]On the selfishness of authenticity, and why Seth believes the way we act determines how we feel way more often than the way we feel determines how we act. [35:08]If attitudes are skills, how do we sharpen them? [36:32]Skills with a disproportionate return on investment that entrepreneurs and creatives should consider cultivating. [40:47]On anxiety and the futility of reassurance. [43:15]One of the biggest mistakes ineffective teachers make, and what we should remember if we want to be effective learners. [45:58]The importance of applying constraints and boundaries to the learning process, and understanding the gift that tension gives. [50:06]How do you not steal the revelation as a teacher, but create tension so that people will plow ahead with developing a skill or learning something? [53:14]Examples of how the power of positive constraints have had an impact on Seth — and how they went from being a source of frustration to the core of his useful working life. [57:46]How would Seth usher a prospective entrepreneur through the process of deciding on constraints before they embark on creating some darling that they’re not willing to kill? [1:00:27]How can an entrepreneur or freelancer apply constraints when their plans are already in motion? [1:03:15]A nugget from The Practice: Seek joy. But how does one do this? [1:06:09]As someone who’s succeeded in zigging where others have zagged, How has Seth chosen the games he has played, and in what ways has this changed over time? [1:08:04]What provided Seth with a template to understand the difference between doing fulfilling work and simply training for the outcome? For that matter, what’s so bad about training for the outcome? [1:11:07]The Practice is Seth’s 20th book. What is he saying in this one that he didn’t get around to in the 20 before, and what should prospective readers hope to get from it? [1:16:14]How would Seth suggest someone literally learn how to juggle, and how does this process figuratively encapsulate the building of resilience necessary for thriving in an ever-changing world? [1:19:06]How the way I learned to swim — in my 30s — was similarly counterintuitive but completely effective (and by coincidence, the technique Seth uses to swim every day). [1:21:32]In what ways is cultivating creativity similar to learning how to juggle? [1:25:13]How does Seth separate genre from generic, and who was Earl Stanley Gardner? [1:26:49]With 230 chapters in less than 230 pages, which ones does Seth hope most resonate with readers? [1:29:40]How Joni Mitchell alienated her mainstream audience in order to find her smallest viable audience and, ultimately, do better work that didn’t train for the outcome. [1:33:01]What would you do even if you knew you would fail? [1:34:47]Parting thoughts. [1:35:54] PEOPLE MENTIONED Edwards DemingAlexander HamiltonLin-Manuel MirandaRichard SerraLenny LevineKevin KellyIsaac AsimovCharles MansonGary GilmoreMalcolm GladwellElizabeth KingBen FranklinDale CarnegieCal FussmanMuhammad AliMikhail GorbachevJoni MitchellEdward TufteNapoleon BonaparteGoldilocksMarie SchachtAlex PeckSusan RothenbergKen BurnsFred RogersIsaac NewtonDavid GraeberMarshall SahlinsMilton FriedmanChögyam TrungpaTerry LaughlinBill BoomerEarl Stanley GardnerAgatha ChristiePerry MasonDella StreetJames PattersonJames BondMarissa MayerAbraham MaslowJaco Pastorius Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tagsanxiety, creativity, seth godin, The Game of Life, The Practice'''
