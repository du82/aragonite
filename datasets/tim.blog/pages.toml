full_description = 'Posted on February 5, 2025February 24, 2025 by Tim FerrissBrandon Sanderson on Building a Fiction Empire, Creating $40M+ Kickstarter Campaigns, Unbreakable Habits, The Art of World-Building, and The Science of Magic Systems (#794) 17 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="600" height="424" src="https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2.jpg?resize=600%2C424&#038;ssl=1" alt="" class="wp-image-107504" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?resize=1024%2C723&amp;ssl=1 1024w, https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?resize=300%2C212&amp;ssl=1 300w, https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?resize=768%2C542&amp;ssl=1 768w, https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?resize=1536%2C1084&amp;ssl=1 1536w, https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?resize=2048%2C1446&amp;ssl=1 2048w, https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?w=1200&amp;ssl=1 1200w, https://i0.wp.com/tim.blog/wp-content/uploads/2025/02/Tim.Brandon-2-scaled.jpg?w=1800&amp;ssl=1 1800w" sizes="(max-width: 767px) 90vw, 600px" /> “Always err on the side of what’s awesome.”— Brandon Sanderson Brandon Sanderson (@BrandSanderson) is the #1 New York Times bestselling author of The Stormlight Archive series and the Mistborn saga; the middle-grade series Alcatraz vs. the Evil Librarians; and the young-adult novels The Rithmatist, the Reckoners trilogy, and the Skyward series. He has sold more than 40 million books in 35 languages, and he is a four-time nominee for the Hugo Awards, winning in 2013 for his novella The Emperor’s Soul. That same year, he was chosen to complete Robert Jordan’s The Wheel of Time series, culminating in A Memory of Light. Brandon cohosts (with fellow author Dan Wells) the popular Intentionally Blank podcast and teaches creative writing at Brigham Young University. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the interview on YouTube. This episode is brought to you by Cresset prestigious family office for CEOs, founders, and entrepreneurs; Seed’s DS-01® Daily Synbiotic broad spectrum 24-strain probiotic + prebiotic; Wealthfront high-yield cash account. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #794: Brandon Sanderson on Building a Fiction Empire, Creating $40M+ Kickstarter Campaigns, Unbreakable Habits, The Art of World-Building, and The Science of Magic Systems<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/000622c1-3a74-42e1-923b-5b5349f6f85a/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Cresset Family Office! Listeners have heard me talk about “making before you manage” for years. And for me—as a writer and entrepreneur—I definitely gravitate toward making. So it’s important that I find the right people who are great at managing. That’s why I trust this episode’s sponsor, Cresset Family Office. Cresset is a prestigious family office for CEOs, founders, and entrepreneurs. They handle the complex financial planning, uncertain tax strategies, timely exit planning, bill pay and wires, and all the other parts of wealth management that would otherwise pull me away from doing what I love most: making things, mastering skills, and spending time with the people I care about. Experience the freedom of focusing on what matters to you with the support of a top wealth management team. Schedule a call today at cressetcapital.com/Tim to see how Cresset can help streamline your financial plans and grow your wealth. I’m a client of Cresset. There are no material conflicts other than this paid testimonial. All investing involves risk, including loss of principal. This episode is brought to you by Seed’s DS-01 Daily Synbiotic! Seed’s DS-01 was recommended to me months ago by a PhD microbiologist, so I started using it well before their team ever reached out to me. Since then, it’s become a daily staple and one of the few supplements I travel with. I’ve always been highly skeptical of most probiotics due to the lack of science and the fact that many do not survive digestion. But after incorporating two capsules of Seed’s DS-01 into my morning routine, I have noticed improved digestion, skin tone, and overall health. Why is it so effective? For one, it’s a 2-in-1 probiotic and prebiotic formulated with 24 clinically and scientifically studied strains that have systemic benefits in and beyond the gut. And now, you can get 25% off your first month of DS-01 with code 25TIM. This episode is brought to you by Wealthfront! Wealthfront is a financial services platform that offers services to help you save and invest your money. Right now, you can earn 4.00% APY—that’s the Annual Percentage Yield—with the Wealthfront Brokerage Cash Account through its network of partner banks. That’s nearly ten times more interest than a savings account at a bank, according to FDIC.gov as of December 16, 2024. It takes just a few minutes to sign up, and then you’ll immediately start earning 4.00% APY interest on your short-term cash until you’re ready to invest. And when new clients open an account today, they can get an extra fifty-dollar bonus with a deposit of five hundred dollars or more. Visit Wealthfront.com/Tim to get started.Tim Ferriss receives cash compensation from Wealthfront Brokerage, LLC for advertising and holds a non-controlling equity interest in the corporate parent of Wealthfront Brokerage. See full disclosures here. Want to hear an episode with another publishing-savvy worldbuilder? Listen to my interview with Silo author Hugh Howey in which we discussed breaking formula with a literary sleight of hand, the benefits of buying back rights and self-publishing, why authors should strive for a reader-first vs. publisher-first mindset, how authors can find deal leverage early on, fiction that inspires better writing, keys to fruitful collaboration, AI’s present-and-future impact on publishing, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Brandon Sanderson: Website | YouTube Books The Stormlight Archive Series: The Way of Kings, Words of Radiance, Oathbringer, Rhythm of War, and Wind and Truth by Brandon Sanderson The Mistborn Saga: Mistborn, The Well of Ascension, The Hero of Ages, The Alloy of Law, Shadows of Self, The Bands of Mourning, and The Lost Metal by Brandon Sanderson Alcatraz Versus the Evil Librarians: Alcatraz vs. the Evil Librarians, The Scrivener’s Bones, The Knights of Crystallia, The Shattered Lens, The Dark Talent, and Bastille vs. the Evil Librarians by Brandon Sanderson The Rithmatist by Brandon Sanderson The Reckoners Trilogy: Steelheart, Firefight, and Calamity by Brandon Sanderson The Skyward Series: Skyward, Starsight, Cytonic, and Defiant by Brandon Sanderson Elantris by Brandon Sanderson The Emperor’s Soul by Brandon Sanderson Warbreaker by Brandon Sanderson Tress of the Emerald Sea by Brandon Sanderson The Wheel of Time by Robert Jordan Song of Ice and Fire Series: A Game of Thrones, A Clash of Kings, A Storm of Swords, A Feast for Crows, A Dance with Dragons by George R.R. Martin Lord of the Rings by J.R.R. Tolkien On Writing by Stephen King How to Write Science Fiction and Fantasy by Orson Scott Card Dragonsbane by Barbara Hambly The Harry Potter Series by J.K. Rowling Save the Cat! The Last Book on Screenwriting You’ll Ever Need by Blake Snyder Save the Cat! Goes to the Movies by Blake Snyder Writing to Sell by Scott Meredith The Name of the Wind by Patrick Rothfuss Alice in Wonderland by Lewis Carroll The Chronicles of Narnia by C.S. Lewis Beowulf: A Translation and Commentary by J.R.R. Tolkien The Conan the Barbarian Stories by Robert E. Howard The Blade Itself by Joe Abercrombie The Epic of Gilgamesh Lions of Al-Rassan by Guy Gavriel Kay Tigana by Guy Gavriel Kay The Princess Bride by William Goldman Twelfth Night by William Shakespeare The Book of Swords Series by Fred Saberhagen Ender’s Game by Orson Scott Card The 4-Hour Workweek by Timothy Ferriss The Hunger Games Series by Suzanne Collins The Lies of Locke Lamora by Scott Lynch The Principles of Scientific Management by Frederick Winslow Taylor His Dark Materials Series by Philip Pullman Movies Avatar Blade Runner Sneakers The Sting Ocean’s Eleven The Italian Job (1969) The Italian Job (2003) The Lord of the Rings: The Two Towers Collector’s Gift Set with Gollum Raiders of the Lost Ark The Princess Bride Butch Cassidy and the Sundance Kid Star Wars Shows Writing Excuses (Podcast): A podcast about the craft of writing, featuring Brandon Sanderson and other authors. Whose Line Is It Anyway?: An improv comedy show that Brandon Sanderson uses as inspiration for his writing exercises. Game of Thrones: A fantasy TV series based on the books by George R.R. Martin, known for its complex characters and unpredictable plot. Arcane: A fantasy TV series that features a magepunk aesthetic, where magic is combined with technology. The Colbert Report: A satirical news show that once featured Brandon Sanderson’s picture in a segment about zeppelins. The History Channel: A TV channel that Brandon Sanderson’s former editor, Moshe, used to watch as a form of self-medication. Institutions Brigham Young University: The university Brandon Sanderson attended and currently teaches a creative writing class. Creative Commons: The nonprofit behind the licenses and tools the world uses to share. The Hugo Awards: The Academy Awards of science fiction and fantasy, where Brandon Sanderson once received a pin from Cory Doctorow. Concepts Conlang: A constructed language, such as Klingon or Elvish, that is created specifically for a fictional world. J.R.R. Tolkien’s Languages: An examination of Tolkien’s work with conlangs in his universe. Paul Frommer On Creating the Na’vi Language for Avatar: An interview with Avatar’s conlang creator. Worldbuilder’s Disease: The tendency for fantasy writers to get bogged down in worldbuilding at the expense of the story. 10 of the Best Cures for Writer’s Block: Trying to get unstuck? Different strategies work for different writers. Some of these may help. The Hero’s Journey: A common narrative structure in fiction, where a hero goes on a quest, faces challenges, and ultimately triumphs over evil. Three-Act Play: A common narrative structure in plays and films, where the story is divided into three acts: setup, confrontation, and resolution. Worldbuilding 101 as Taught by Robert Jordan: How Robert Jordan created a fully realized world for his The Wheel of Time series. “Yes, But” or “No, And”: First, decide whether or not your protagonist is going to achieve the scene goal. Yes or No. The answer will determine where to go next. Plot Points: What They Are, and How to Use Them Well: Once you have mastered these, everything else should fall neatly into place. The Sunk-Cost Fallacy: Following through with something that we’ve already invested heavily in (be it time, money, effort, or emotional energy), even when giving up is clearly a better idea. The Ultimate Guide to Fantasy Sub Genres: They are legion. Magepunk: A subgenre of fantasy where magic is combined with technology. Hextech: A magic-based technology that uses runes and gemstones to power devices in the Arcane universe. What Is Discovery Writing, Anyway?: Brandon says he “discovery wrote” his Alcatraz vs. the Evil Librarians series. What does that mean? The Cosmere: The shared universe that connects many of Brandon’s fantasy novels. The MCU: The Marvel Cinematic Universe The Death Spiral: When a book’s sales decline with each subsequent printing, leading to fewer copies being ordered and less visibility in bookstores. Allomancy: One of the three magic systems in the Mistborn trilogy. “Allomancers” have the ability to use metals to fuel a variety of physical and mental enhancements. Isaac Newton’s Secret Alchemy: John Maynard Keynes declared that Newton “was not the first of the age of reason. He was the last of the magicians.” Scientific Method: A way of demarcating scientific activity from non-science. Taylor and the Gilbreths: How Frederick Winslow Taylor and Frank and Lillian Gilbreth attempted to maximize human productivity while minimizing the wear and tear of physical toil around the turn of the 19th and 20th centuries — with science! Was Arthur C. Clarke Right? An Exploration of the Magical Nature of Technology: “Any sufficiently advanced technology is indistinguishable from magic.” The Use of Magic in Tolkien’s Universe — Building a World: Magic serves to further the plot in Tolkien’s works, but it is used in a conservative way in order to focus on the courage and willpower of the characters to make the world safe from the Shadow. Sanderson’s Laws of Magic: Three rules that Brandon follows when creating magic systems for his fantasy novels. 10 Things Harry Potter Taught Us About a Mother’s Love: The courage and selflessness of mothers ultimately save the entire wizarding world from Voldemort’s evil reign. Deus Ex Machina: A plot device whereby a seemingly unsolvable problem in a story is suddenly or abruptly resolved by an unexpected and unlikely occurrence. What’s the Difference Between Young Adult and Adult Books?: If you’re writing a book and you’re not sure if it should be categorized as Middle Grade, Young Adult, New Adult, or Adult, then this is the post for you! Feruchemy: The second magic system in the Mistborn series. While an Allomancer burns metal to gain power, a Feruchemist must provide the power for the magic from their own body. Hemalurgy: The third magic system in the Mistborn Series. To use Hemalurgy, a metal spike must be driven through someone’s heart. Then the spike is taken and stabbed into the body of another person. Yikes! Zeroth Law of Thermodynamics: If two the'
