full_description = '''Posted on December 27, 2024January 3, 2025 by Tim FerrissDr. Becky Kennedy — Parenting Strategies for Raising Resilient Kids, Plus Word-for-Word Scripts for Repairing Relationships, Setting Boundaries, and More (#784) 5 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint “This feels hard because it is hard, not because I’m doing something wrong.”— Dr. Becky Kennedy Dr. Becky Kennedy (@DrBeckyAtGoodInside) is the founder and CEO of Good Inside, a parenting movement that disrupts conventional parenting practices by empowering parents to become sturdy, confident leaders and raise sturdy, confident kids. Good Inside currently has members across more than 100 countries and millions of followers across social media platforms, including nearly 3M followers on Instagram alone. Good Inside released a mobile app that serves as a “24/7 parenting coach,” offering personalized, age-based support and an AI Chatbot trained on Dr. Becky’s entire library of content. Dr. Becky is also behind the #1 New York Times bestselling book Good Inside: A Guide to Becoming the Parent You Want to Be, a chart-topping podcast, a TED talk with nearly 4 million views on the power of repair, and an upcoming children’s book, That’s My Truck! A Good Inside Story About Hitting. Please enjoy! This episode is brought to you by GiveWell.org charity research and effective giving, Wealthfront high-yield cash account, and AG1 all-in-one nutritional supplement. Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the interview on YouTube here. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #784: Dr. Becky Kennedy — Parenting Strategies for Raising Resilient Kids, Plus Word-for-Word Scripts for Repairing Relationships, Setting Boundaries, and More<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/6b2487cd-7add-481d-9010-7cd9af11a225/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by GiveWell.org! For more than ten years, GiveWell.org has helped donors find the charities and projects that save and improve lives most per dollar. GiveWell spends over 30,000 hours each year researching charitable organizations and only recommends a few of the highest-impact, evidence-backed charities they’ve found. In total, more than 100,000 people have used GiveWell to donate as effectively as possible. This year, support the charities that save and improve lives most, with GiveWell. Any of my listeners who become new GiveWell donors will have their first donation matched up to $100 when you go to GiveWell.org and select “PODCAST” and “The Tim Ferriss Show” at checkout. This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Wealthfront! Wealthfront is a financial services platform that offers services to help you save and invest your money. Right now, you can earn 4.00% APY—that’s the Annual Percentage Yield—with the Wealthfront Brokerage Cash Account through its network of partner banks. That’s nearly ten times more interest than a savings account at a bank, according to FDIC.gov as of December 16, 2024. It takes just a few minutes to sign up, and then you’ll immediately start earning 4.00% APY interest on your short-term cash until you’re ready to invest. And when new clients open an account today, they can get an extra fifty-dollar bonus with a deposit of five hundred dollars or more. Visit Wealthfront.com/Tim to get started.Tim Ferriss receives cash compensation from Wealthfront Brokerage, LLC for advertising and holds a non-controlling equity interest in the corporate parent of Wealthfront Brokerage. See full disclosures here. Want to hear another podccast episode that focuses on education and the intricacies of parenting? Listen to my conversation with New York Times bestselling author Jessica Lahey, in which we discussed confidence vs. competence when trying to foster a child’s self-esteem, why instilling hope in a child is so crucial to their lifelong well-being, books and activities that keep Jessica aligned along the path of hope and optimism, advice for parents who get the dreaded phone call that their child has been caught up in non-ideal behavior, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Dr. Becky Kennedy: Good Inside | Twitter | Facebook | Instagram | Threads | TikTok | YouTube Good Inside: A Guide to Becoming the Parent You Want to Be by Dr. Becky Kennedy | Amazon That’s My Truck!: A Good Inside Story About Hitting by Dr. Becky Kennedy and Joanie Stone | Amazon Parenting Podcast | Good Inside 24/7 Parenting Support | Good Inside App Becky Kennedy: The Single Most Important Parenting Strategy | TED Talk Extreme Ownership: How U.S. Navy SEALs Lead and Win by Jocko Willink and Leif Babin | Amazon The Scariest Navy SEAL Imaginable…And What He Taught Me | The Tim Ferriss Show #107 Everyone Yells at Their Kids. How Do You Repair the Moment? | Today Dr. Becky on Activating Curiosity | Instagram Grit: The Power of Passion and Perseverance by Angela Duckworth | Amazon Dr Becky Kennedy: It’s Not Your Job to Make Your Kid Happy | Lewis Howes Why Your Teen Needs a Sturdy Leader, Per Dr. Becky | Motherly Dr. Becky Kennedy Wants to Help Parents Land the Plane | The New Yorker The Profile Dossier: Becky Kennedy, The Parenting Guru Offering Practical Solutions | The Profile Don’t Shoot the Dog: The Art of Teaching and Training by Karen Pryor | Amazon The How and What of “The Most Generous Interpretation” Method | First Things First Dr. Becky Kennedy Is Instagram’s Favorite Parenting Guru | Romper Conscious Loving: The Journey to Co-Commitment by Gay Hendricks and Kathlyn Hendricks | Amazon Nonviolent Communication: Create Your Life, Your Relationships, and Your World in Harmony with Your Values by Marshall B. Rosenberg | Amazon Richard Schwartz — IFS, Psychedelic Experiences without Drugs, and Finding Inner Peace for Our Many Parts | The Tim Ferriss Show #492 Introduction to Internal Family Systems by Richard C. Schwartz, Ph.D. | Amazon No Bad Parts: Healing Trauma and Restoring Wholeness with the Internal Family Systems Model by Richard C. Schwartz, Ph.D. | Amazon Fair Play: A Game-Changing Solution for When You Have Too Much to Do (And More Life to Live) by Eve Rodsky | Amazon Tiny Beautiful Things: Advice from Dear Sugar by Cheryl Strayed | Amazon What Grandparents Need to Know About Popular Parenting Methods | More Than Grand Eating Disorders: Six Types and Their Symptoms | Healthline Dr. Becky Kennedy: Wire Your Children for Resilience | Mayim Bialik’s Breakdown Hanna | Prime Video The Bourne Identity | Prime Video Emotional Dysregulation | Cleveland Clinic The Exorcist | Prime Video The Highly Sensitive Person: How to Thrive When the World Overwhelms You by Elaine N. Aron, Ph.D. | Amazon Jiro Dreams of Sushi | Prime Video SHOW NOTES [00:06:49] The power of repair. [00:09:44] “It’s never your fault when I yell at you.” [00:13:49] What does it mean to be a “good” parent? [00:15:26] Activating curiosity over judgment. [00:18:27] Alternatives to saying “Good job” as a confidence builder. [00:23:16] Making kids happy vs. building capability. [00:26:44] A pilot metaphor for sturdy leadership. [00:31:56] Role confusion. [00:34:30] Defining boundaries. [00:38:44] How parenting becomes a two-way mirror for growth. [00:43:46] The MGI (Most Generous Interpretation) approach. [00:46:29] Biggest challenges in parenting. [00:50:29] Recommended reading for someone with kids in their life. [00:55:49] Advisable prerequisites for singles who aim to build a family. [00:59:55] Setting boundaries with grandparents and dealing with different parenting styles. [01:05:18] Handling frustration when a child is pushing your buttons. [01:13:35] Lessons learned from working with eating disorders. [01:17:03] Managing troublemaker behavior. [01:21:14] Bad influence intervention. [01:26:28] Cultivating resilience in “deeply feeling” kids (DFKs). [01:32:35] The trials and errors that birthed Good Inside. [01:36:30] “Our words are not our wishes. Our words are our fears.” [01:43:44] Billboard messages and mantras. [01:51:37] Fan-favorite scripts on saying no, boundaries, and repair. [01:54:52] The tennis court metaphor for boundaries. [01:59:22] Resources and parting thoughts. MORE DR. BECKY KENNEDY QUOTES FROM THE INTERVIEW “Parenting doesn’t come naturally. The only thing that comes naturally is how you were parented.”— Dr. Becky Kennedy “What scares you does not scare me. … What a sturdy leader really does is they say to you, ‘I see what’s happening for you. I see your feelings as real and your feelings don’t overwhelm me.'”— Dr. Becky Kennedy “This feels hard because it is hard, not because I’m doing something wrong.”— Dr. Becky Kennedy “We were never meant to parent on instinct alone.”— Dr. Becky Kennedy “When we’re completely out of control and overwhelmed and we scream things out in that state, our words are not our wishes; our words are our fears.”— Dr. Becky Kennedy “Do not deprive my child of finding their capability. Do not steal it. Do not steal their capability. A kid doesn’t feel capable when they do something easy.”— Dr. Becky Kennedy “Kids develop capability after watching themselves survive something that was really difficult and just get through it.”— Dr. Becky Kennedy “Our body has this remarkable way to act out conflict if we don’t kind of understand it and resolve it.”— Dr. Becky Kennedy “The most under-utilized strategy in parenting—and this sounds like a joke, but I do want to name it to make it official—is doing nothing.”— Dr. Becky Kennedy PEOPLE MENTIONED Jocko Willink Angela Duckworth Karen Pryor Chesley “Sully” Sullenberger Eve Rodsky Cheryl Strayed Richard Schwartz Gay Hendricks Katie Hendricks Oscar Wilde Abraham Lincoln Eric Bana Jason Bourne Jiro Ono Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tagsboundaries, Dr. Becky Kennedy, gentle parenting, good inside, parenting, parenting styles, parenting tips, saying no'''
