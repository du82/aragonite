full_description = '''Posted on January 30, 2025February 8, 2025 by Tim FerrissSeth Godin on Playing the Right Game and Strategy as a Superpower (#792) 5 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint “If you want to make change happen, you have to create tension on purpose.—Seth Godin Seth Godin is the author of 21 internationally bestselling books, translated into more than 35 languages, including Linchpin, Tribes, The Dip, and Purple Cow. His latest book, This Is Strategy, offers a fresh lens on how we can make bold decisions, embrace change, and navigate a complex, rapidly evolving world. Seth is the founder of the altMBA and the Akimbo Workshops, transformative online programs that have helped thousands of people take their work to the next level. His blog (seths.blog) is one of the most widely read in the world. Seth is also the creator of The Carbon Almanac, a global initiative focused on climate action. Please enjoy! Listen to the episode on Apple Podcasts, Spotify, Overcast, Podcast Addict, Pocket Casts, Castbox, YouTube Music, Amazon Music, Audible, or on your favorite podcast platform. Watch the interview on YouTube. This episode is brought to you by Cresset prestigious family office for CEOs, founders, and entrepreneurs; AG1 all-in-one nutritional supplement; and Shopify global commerce platform, providing tools to start, grow, market, and manage a retail business. The transcript of this episode can be found here. Transcripts of all episodes can be found here. <img data-recalc-dims="1" decoding="async" src="https://i0.wp.com/tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/apple-podcast.png?w=600&#038;ssl=1" class="podcast-block__link-icon"/>Listen onApple Podcasts <img width="167" height="167" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/spotify.svg" class="podcast-block__link-icon"/>Listen onSpotify <img width="1000" height="1000" decoding="async" src="https://tim.blog/wp-content/themes/timferriss/inc/blocks/podcast-link/images/overcast.svg" class="podcast-block__link-icon"/>Listen onOvercast #792: Seth Godin on Playing the Right Game and Strategy as a Superpower<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/af7e8c43-5ff2-495c-b2f9-43e48d825a2a/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by Cresset Family Office! Listeners have heard me talk about “making before you manage” for years. And for me—as a writer and entrepreneur—I definitely gravitate toward making. So it’s important that I find the right people who are great at managing. That’s why I trust this episode’s sponsor, Cresset Family Office. Cresset is a prestigious family office for CEOs, founders, and entrepreneurs. They handle the complex financial planning, uncertain tax strategies, timely exit planning, bill pay and wires, and all the other parts of wealth management that would otherwise pull me away from doing what I love most: making things, mastering skills, and spending time with the people I care about. Experience the freedom of focusing on what matters to you with the support of a top wealth management team. Schedule a call today at cressetcapital.com/Tim to see how Cresset can help streamline your financial plans and grow your wealth. I’m a client of Cresset. There are no material conflicts other than this paid testimonial. All investing involves risk, including loss of principal. This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. This episode is brought to you by Shopify! Shopify is one of my favorite platforms and one of my favorite companies. Shopify is designed for anyone to sell anywhere, giving entrepreneurs the resources once reserved for big business. In no time flat, you can have a great-looking online store that brings your ideas to life, and you can have the tools to manage your day-to-day and drive sales. No coding or design experience required. Go to shopify.com/Tim to sign up for a one-dollar-per-month trial period. It’s a great deal for a great service, so I encourage you to check it out. Take your business to the next level today by visiting shopify.com/Tim. Want to hear the last time Seth Godin was on the show? Listen to our conversation here, in which we discussed why hiding behind words like “quality” or “perfection” as a means of postponing action to avoid risk is a cop-out, what Isaac Asimov and Gary Gilmore can teach us about writer’s block and other common procrastinations, the selfishness of authenticity, how to sharpen attitudes, the futility of reassurance, separating genre from generic, and much more. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE Connect with Seth Godin: Website | Seth’s Blog | Instagram | Facebook This Is Strategy: Make Better Plans by Seth Godin | Amazon Other Books by Seth Godin | Amazon “Nobody Gets Fired F