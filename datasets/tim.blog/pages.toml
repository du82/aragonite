description = '“Desire is a contract you make with yourself to be unhappy until you get what you want.”— Naval Ravikant Naval Ravikant (@naval) is the CEO and a co-founder of AngelList. He previously co-founded Epinions, which went public as part of Shopping.com, and Vast.com. He is an active angel investor and has invested in more than … Continue reading "Naval Ravikant — The Person I Call Most for Startup Advice (#97)"'
full_description = '''Posted on August 18, 2015February 29, 2024 by Tim FerrissNaval Ravikant — The Person I Call Most for Startup Advice (#97) 491 Comments Topics: CategoriesThe Tim Ferriss ShowShare this:TwitterFacebookLinkedInEmailMoreRedditTumblrPinterestPocketWhatsAppTelegramPrint <img data-recalc-dims="1" decoding="async" width="500" height="334" src="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?resize=500%2C334&#038;ssl=1" alt="The Tim Ferriss Show with Naval Ravikant" class="wp-image-18651" srcset="https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?w=500&amp;ssl=1 500w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?resize=360%2C240&amp;ssl=1 360w, https://i0.wp.com/tim.blog/wp-content/uploads/2015/08/naval-ravikant-on-the-tim-ferriss-show.jpg?resize=300%2C200&amp;ssl=1 300w" sizes="(max-width: 500px) 100vw, 500px" /> “Desire is a contract you make with yourself to be unhappy until you get what you want.”— Naval Ravikant Naval Ravikant (@naval) is the CEO and a co-founder of AngelList. He previously co-founded Epinions, which went public as part of Shopping.com, and Vast.com. He is an active angel investor and has invested in more than 100 companies, including more than a few “unicorn” mega-successes. His deals include Twitter, Uber, Yammer, Postmates, Wish, Thumbtack, and OpenDNS, which Cisco just bought for $635 million in cash. BUT, even if you have zero interest in startups or investing, this episode is well worth your time. This is really about the habits and beliefs of a highly successful (and happy) person. Naval has refined his way of living in very unique ways, and you can borrow what he’s learned, read the books that have changed him, and experiment with the habits he has developed through trial and error. Enjoy this conversation with a curious character! UPDATE: This episode was extremely popular (and nominated for “Podcast of the Year”), so we did a round two with Naval. Here it is! Listen to the episode on Apple Podcasts, Spotify, or wherever you get your podcasts. You can find the transcript of this episode here. Transcripts of all episodes can be found here. #97: The Evolutionary Angel, Naval Ravikant<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/68f95546-fd20-47f4-8dd1-37e652f4d70c/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> Want to hear another podcast on meditation and “spirituality”? Listen to my conversation with Sam Harris, PhD. In the below episode, we discuss “spirituality,” neuroscience, his meditation practice, and more. Ep. 14: Sam Harris, PhD - Spirituality, Neuroscience, Meditation, and More<iframe src="https://www.art19.com/shows/58dacbdc-646e-4585-9914-19c3de11d1ba/episodes/74642a52-96cf-431b-bdcf-e49878642d73/embed?type=micro" style="width: 100%; height: 30px; border: 0 none;" scrolling="no"></iframe> This episode is brought to you by 99designs, the global creative platform by Vista that makes it easy for designers and clients to work together to create designs they love. Its creative process has become the go-to solution for businesses, agencies, and individuals, and I have used it for years to help with display advertising and illustrations and to rapid-prototype the cover for The Tao of Seneca. Whether your business needs a logo, website design, business card, or anything you can imagine, check out 99designs. You can work with multiple designers at once to get a bunch of different ideas or hire the perfect designer for your project based on their style and industry specialization. It’s simple to review concepts and leave feedback so you’ll end up with a design that you’re happy with. Click this link and get $20 off plus a $99 upgrade. This episode is brought to you by AG1! I get asked all the time, “If you could use only one supplement, what would it be?” My answer is usually AG1, my all-in-one nutritional insurance. I recommended it in The 4-Hour Body in 2010 and did not get paid to do so. I do my best with nutrient-dense meals, of course, but AG1 further covers my bases with vitamins, minerals, and whole-food-sourced micronutrients that support gut health and the immune system. Right now, you’ll get a 1-year supply of Vitamin D free with your first subscription purchase—a vital nutrient for a strong immune system and strong bones. Visit DrinkAG1.com/Tim to claim this special offer today and receive your 1-year supply of Vitamin D (and 5 free AG1 travel packs) with your first subscription purchase! That’s up to a one-year supply of Vitamin D as added value when you try their delicious and comprehensive daily, foundational nutrition supplement that supports whole-body health. QUESTION(S) OF THE DAY: What do you still want to know about investing, whether in startups or elsewhere? Or: What was your favorite takeaway from Naval? Please let me know in the comments. Scroll below for links and show notes… Enjoy! Selected Links from the Episode The Book of Life: Daily Meditations with Krishnamurti by Jiddu Krishnamurti Love Yourself Like Your Life Depends On It by Kamal Ravikant Lying by Sam Harris Surely You Must Be Joking Mr. Feynman by Richard Feynman Meditations by Marcus Aurelius Striking Thoughts by Bruce Lee The Origin of Species by Charles Darwin Read the Melting Asphalt blog Read the Dilbert blog, specifically, The Day You Became a Better Writer Siddhartha by Hermann Hesse The Power of Habit by Charles Duhigg Go on a meditation retreat with noetic.org Don’t Shoot the Dog! by Karen Pryor Sapiens by Yuval Noah Harari The Rational Optimist by Matt Ridley Poor Charlie’s Almanac by Charlie Munger Illusions by Richard Bach The Origins of Virtue by Matt Ridley Influence by Robert Cialdini Snow Crash by Neal Stephenson The Name of the Wind by Patrick Rothfuss The Lies of Locke Lamora by Scott Lynch Zorba the Greek by Nikos Kazantzakis The Secret Life of Salvadore Dali by Salvadore Dali “What Do You Care What Other People Think?” by Richard Feynman Connect with Naval Ravikant: AngelList | Startup Boy Blog | Twitter Learn more about Tim on AngelList Show Notes On the intensity of Naval Ravikant [6:55] On uncompromising honesty [16:54] How AngelList and Venture Hacks came to be [20:09] What Naval looks for when deciding to invest in a founder [25:24] Common “wives tales” in venture capital [32:39] What books, outside the startup world, have most improved Naval’s ability to invest? [36:54] Greatest investing hits and misses [51:49] When you think of the successful people, who is the first that comes to mind? [58:19] Meditative practices [1:00:58] How to replace bad habits with good habits [1:07:06] On setting stakes and awards [1:24:49] How to treat your life like a movie [1:34:44] Overused words and phrases [1:39:39] Early life education and the importance of “loving to read” [1:43:19] Advice for his younger self [1:51:09] Describing the first 60 minutes of each day [1:52:40] If you could have one billboard anywhere, where would it be and what would it say? [2:04:19] People Mentioned Marcus Aurelius Sam Harris Bruce Lee Jiddu Krishnamurti Scott Adams Steve Jobs Marc Andreessen Satoshi Nakamoto Elon Musk Charlie Munger Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tagsangel investing, angel investor, Angel List, AngelList, business success, founders, investments, Naval Ravikant, podcast, startup, The Tim Ferriss Show, venture capital, Venture Hacks'''
