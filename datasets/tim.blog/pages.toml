ry, my non-US friends, Momentous ships internationally and has you covered. This episode is brought to you by Helix Sleep! Helix was selected as the best overall mattress of 2024 by Forbes, Fortune, and Wired magazines and many others. With Helix, there’s a specific mattress to meet each and every body’s unique comfort needs. Just take their quiz—only two minutes to complete—that matches your body type and sleep preferences to the perfect mattress for you. They have a 10-year warranty, and you get to try it out for a hundred nights, risk-free. They’ll even pick it up from you if you don’t love it. And now, Helix is offering between 20% and 27% off all mattress orders at HelixSleep.com/Tim. Want to hear another episode that features content straight from The 4-Hour Workweek? Listen here for the three chapters preceding this one that cover how to get uncommon results by doing the opposite, aiming with precision, and aiming for the unrealistic. What was your favorite quote or lesson from this episode? Please let me know in the comments. SELECTED LINKS FROM THE EPISODE The 4-Hour Workweek: Escape 9-5, Live Anywhere, and Join the New Rich by Tim Ferriss | Amazon The Little Prince by Antoine de Saint-Exupéry | Amazon How to Use Occam’s Razor without Getting Cut | Farnam Street George’s Hack for Looking Busy at Work | Seinfeld The 4-Hour Workweek DEAL Framework | Steady Compounding Tim Ferriss: Are You Being Effective or Efficient? | Modern Wisdom with Chris Williamson What Gets Measured Gets Managed? | MOPs and MOEs Manual of Political Economy by Vilfredo Pareto | Amazon 80/20 Rule (Pareto Principle) | Investopedia 5 ChatGPT Prompts to Implement The 4-Hour Workweek in Your Business | Forbes Why the 9-to-5 Schedule Has Lost Its Place in the Workplace | Fast Company Ed Zschau — The Polymath Professor Who Changed My Life | The Tim Ferriss Show #380 Parkinson’s Law: The ‘Law’ That Explains Why You Can’t Get Anything Done | BBC How to Use Parkinson’s Law to Get More Done in Less Time | Lifehack Fear-Setting: The Most Valuable Exercise I Do Every Month | Tim Ferriss Jim Rohn: You’re the Average of the Five People You Spend the Most Time With | Business Insider How to End a Friendship | Verywell Mind Fully Automated Time-Tracking Software | RescueTime Multitasking and the Brain | Brighter Minds A Simple Countdown Timer | E.ggTimer Comfort Challenge #2: Learn to Propose | Tim Ferriss SHOW NOTES [00:05:27] E is for Elimination. [00:05:46] The end of time management. [00:07:57] How you will use productivity. [00:10:36] Being effective vs. being efficient. [00:12:12] Pareto and his garden: 80/20 and freedom from futility. [00:24:01] The 9-5 Illusion and Parkinson’s Law. [00:31:41] A dozen cupcakes and one question. [00:34:47] Questions and actions. [00:35:05] Define a to-do list and a not-to-do list. [00:35:41] If you had a heart attack and had to work two hours per day, what would you do? [00:36:33] If you had a second heart attack and had to work two hours per week, what would you do? [00:36:42] If you had a gun to your head and had to stop doing 4/5 of different time-consuming activities, what would you remove? [00:37:21] What are the top-three activities that you use to fill time to feel as though you’ve been productive? [00:37:45] Who are the 20% of people who produce 80% of your enjoyment and propel you forward, and which 20% cause 80% of your depression, anger, and second-guessing? [00:40:16] If this is the only thing you accomplish today, will you be satisfied with your day? [00:41:47] Are you inventing things to do to avoid the important? [00:42:25] Do not multitask. [00:43:17] Use Parkinson’s Law on a macro and micro level. [00:44:45] Comfort challenge: Learn to propose. [00:45:39] Lifestyle design in action. PEOPLE MENTIONED Ray Porter Bruce Lee Antoine de Saint-Exupéry William of Ockham Peter Drucker Vilfredo Pareto Léon Walras Steven Wright Ed Zschau Seneca the Younger Oprah Winfrey Derek Sivers Victor Johnson Related The Tim Ferriss Show is one of the most popular podcasts in the world with more than one billion downloads. It has been selected for "Best of Apple Podcasts" three times, it is often the #1 interview podcast across all of Apple Podcasts, and it's been ranked #1 out of 400,000+ podcasts on many occasions. To listen to any of the past episodes for free, check out this page. Topics: CategoriesThe Tim Ferriss ShowTags: Tags4-hour workweek, productivity, time management'''
