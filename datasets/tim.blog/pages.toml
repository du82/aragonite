full_description = 'Posted on December 27, 2021December 30, 2021Forget New Year’s Resolutions and Conduct a ‘Past Year Review’ Instead (#559) I’m often asked about how I approach New Year’s resolutions. The truth is that I no longer approach them at all, even though I did for decades. Why the change? I have found “past year reviews” (PYR) more informed, valuable, and actionable than half-blindly looking forward with broad resolutions. I did my first PYR after … Continue reading “Forget New Year’s Resolutions and Conduct a ‘Past Year Review’ Instead (#559)” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2016/04/screen-shot-2016-04-25-at-6-59-24-am12.png?fit=600%2C597&#038;ssl=1" alt="My 10 Favorite Purchases in 10 Months"/> Posted on April 25, 2016March 23, 2021My 10 Favorite Purchases in 10 Months I love testing new gadgets and products. It’s an obsession. For The 4-Hour Chef alone, I tested well over $100,000 worth of gear. OCD + Amazon Prime = expensive. Why on earth do I do it? Simple–I love sharing the 5-10 things out of 500-1,000 that really work. Strange fetish, perhaps, but I get off on it. … Continue reading “My 10 Favorite Purchases in 10 Months” <img src="https://i0.wp.com/tim.blog/wp-content/uploads/2014/06/edmund_wilson.jpg?fit=497%2C658&#038;ssl=1" alt="The Best Decline Letter of All Time: Edmund Wilson"/> Posted on October 7, 2009January 16, 2020The Best Decline Letter of All Time: Edmund Wilson Edmund Wilson, recipient of both the Presidential Medal of Freedom and the National Medal for Literature, was one of the most prominent social and literary critics of the 20th century. He realized, like most uber-productive people, that, while there were many behaviors needed to guarantee high output, there was one single behavior guaranteed to prevent … Continue reading “The Best Decline Letter of All Time: Edmund Wilson” Posted on July 6, 2009January 16, 2020Facebook Bankruptcy Template The following is an e-mail I received from Paul Colligan, which inspired me to finally take the leap and get Facebook under control. To tame the beast and use it, instead of having it use me. I hope you find it useful, or at least entertaining. Paul, if you mind me putting this up, please … Continue reading “Facebook Bankruptcy Template”'
