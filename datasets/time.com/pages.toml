title = "Here's What DOGE Is Doing Across the Federal Government | TIME"
description = "Musk’s DOGE team has positioned people across the federal government."
full_description = '''By Nik PopliUpdated: February 21, 2025 1:31 PM EST | Originally published: February 13, 2025 2:48 PM ESTWithin days of President Donald Trump’s second inauguration, billionaire Elon Musk emerged as a standout figure in his administration through the newly-established Department of Government Efficiency. Within weeks, Musk’s DOGE team had positioned people across the federal government, disrupting functions, gaining access to sensitive data, and executing cuts.DOGE claims that it has saved an estimated $55 billion in federal spending so far, but a review of the itemized savings posted on its website only accounts for about $16 billion in savings. While it's not yet possible to verify how much DOGE has cut, Trump is fully behind Musk’s effort—calling him “a leader” who “gets it done” even though the White House insists he doesn’t actually work for DOGE. The DOGE receipts show that it has cut at least $6.5 billion from the USAID, $502 million from the Department of Education, $232 million from the Social Security Administration and $192 million from the General Services Administration.Musk has reiterated his overall goal to reduce the deficit by $1 trillion. “If the deficit is not brought under control, America will go bankrupt,” Musk told Fox News in a joint interview with Trump. “This is a very important thing for people to understand. A country is no different from an individual, in that if an individual overspends, an individual can go bankrupt, and so can a country.” The government spent more than $6.75 trillion in the last fiscal year, for perspective.DOGE has sparked fierce debate over its methods, with supporters praising its goal of efficiency and cost-cutting, while critics argue it risks dismantling essential programs and consolidating too much power under Musk.The activities by Musk's team have sparked a growing number of legal challenges, many of them questioning the legality of DOGE's sweeping access to confidential data and the dismantling of agencies. Fourteen states have filed a motion against Musk and DOGE, stating his authority is unchecked and unconstitutional. On Feb. 17, a federal judge held the first hearing to address the lawsuit and the states’ request for a temporary restraining order to stop DOGE from accessing data and firing federal workers. Read More: Inside Elon Musk’s War on Washington Here is what we know about what DOGE is doing across the federal government, and the ways it has impacted federal agencies so far.Cutting the federal workforceMass layoffs have begun at multiple government agencies as DOGE has been tasked by Trump to drastically shrink the federal workforce. Termination emails have been sent to federal employees at various agencies, including the Internal Revenue Service and Department of Education, leaving federal employees baffled and setting the stage for future legal battles. Many of those fired were recently hired employees still on probation, as the Trump Administration has ordered most agencies to let go of nearly all probationary employees who haven’t yet gained civil service protection.The firings began after the government’s offer for federal workers to accept a so-called buyout—an offer initiated by Musk allies at the Office of Personnel Management—expired on Feb. 12. The White House said that the offer was accepted by about 77,000 workers, or around 3% of the civilian workforce. The offer encouraged federal employees to leave their jobs with the promise of continuing to be paid through September.In mid-February, layoffs spearheaded by DOGE expanded, and health agencies were hit hard: on Feb. 15, layoffs began at the Food and Drug Administration (FDA), and on Feb. 14, the Centers for Disease Control and Prevention (CDC) fired 1,300 employees, Bloomberg reported. Weeks after a midair crash between a regional jet and a U.S. Army Black Hawk helicopter brought new scrutiny to the Federal Aviation Administration (FAA), the agency’s union shared that several hundred employees were terminated with messages sent from an ‘exec order’ Microsoft email address, not an official .gov email address,” according to the union. The union’s president, David Spero, wrote in a statement that these messages began on Friday night and went late into the night of Feb. 14.“These are not nameless, faceless bureaucrats. They are our family, friends and neighbors. They contribute to our communities. Many military veterans are among them,” Spero wrote. “It is shameful to toss aside dedicated public servants who have chosen to work on behalf of their fellow Americans.”On Feb. 17, new Transportation Secretary Sean Duffy posted on X that Musk’s Space X team would take a tour of the Air Traffic Control System Command Center in Virginia to review the current system and “envision how we can make a new, better, modern and safer system.” Duffy disputed any claims that he is giving Musk special access.Also on Feb. 14, 388 employees were also terminated at the Environmental Protection Agency (EPA), “in accordance with President Trump’s executive orders,” EPA spokesperson Molly Vaseliou told Politico.One department experienced a false alarm. According to the Associated Press, up to 350 employees at the National Nuclear Security Administration were abruptly laid off late on Feb. 13. The next day, though, those layoffs were rescinded, and less than 50 people were reportedly officially fired.Read More: Trump Administration Fires, Then Rescinds Firing of Nuclear Weapons WorkersThe U.S. Department of Agriculture said Feb. 18. that it accidentally fired "several" agency employees who are working on the federal government's response to the bird flu outbreak, and was trying to quickly reverse the firings.Several lawmakers in Congress have spoken out against the mass layoffs.“Let’s be clear that these sweeping layoffs do not address fraud or waste. These firings are totally arbitrary–pushing out high performers and the promising next generation of our federal workforce who won’t be easily replaced.” Democratic Senator Patty Murray wrote in a statement. “Two billionaires who have zero concept of what the federal workforce does are breaking the American government—decimating essential services and leaving all of us worse off. Terminating federal contractsThe DOGE receipts posted to its website show it has terminated more than 1,000 federal contracts it deems unnecessary or wasteful, including high-profile agreements related to federal technology infrastructure and healthcare programs. The contracts span 39 federal departments and agencies, according to DOGE, totaling roughly $8.6 billion of the $55 billion it claims to have saved.While Musk has asserted that DOGE is "maximally transparent,” its claims about the contracts it has terminated have often been vague, incomplete, or unsubstantiated.A recently launched doge.gov website features the agency’s posts on X, most of which provide scant details of the contracts cancelled. One terminated contract, published to DOGE’s website on Feb. 15, used erroneous federal data to claim that DOGE saved taxpayers $8 billion by canceling a single U.S. Immigration and Customs Enforcement (ICE) contract that was actually worth a maximum of $8 million. The contract was described as a “program and technical support services” for ICE’s Office of Diversity and Civil Rights. The DOGE website was updated on Feb. 19 to show an $8 million savings rather than $8 billion, but it retained the $55 billion top-line savings claim. (DOGE claims that the agency contracting officer mistakenly wrote $8 billion and that DOGE used the correct $8 million in its calculations).Another post from Feb. 3 reads: “All in today, 36 contracts were terminated for a total savings of ~$165mm across 6 agencies, including a DHS contract for ‘people and culture survey and climate support services.’”Whether Musk or DOGE has the legal authority to end so many federal contracts has been a subject of debate. The savings from the contracts that have been cancelled also remains unclear. For instance, Nat Malkus, a senior fellow at the conservative think tank American Enterprise Institute, told The Washington Post that the actual savings from dozens of cancelled Education Department may be half as much as DOGE has claimed, or less, noting that some claims appear inflated, and much of the money had already been spent in some of the others cancelled contracts.Sweeping cuts at USAIDAmong the first and most significant targets of DOGE’s reach is the United States Agency for International Development (USAID), a cornerstone of the country’s global humanitarian efforts. Musk has made it clear his disdain for the agency’s operations, which he claims are riddled with inefficiency and waste. Since DOGE's involvement began, USAID has seen the deepest cuts of any agency to date, totaling $6.5 billion per DOGE records, along with dramatic staffing changes. Nearly 7,000 employees were reportedly placed on leave or fired, a move that has sparked considerable controversy.As part of its ongoing effort to reduce the agency’s footprint, DOGE has implemented measures that critics argue jeopardize the future of global development and humanitarian aid. USAID’s website, an essential resource for many aid organizations, was temporarily shut down, leaving workers in the field uncertain about the continuity of their programs. The moves were met with swift legal action, with a judge temporarily halting the removal of thousands of employees, but the long-term viability of USAID remains uncertain as DOGE continues its push for cuts.Canceling DEI programs and grantsSince taking office, Trump has made canceling contracts related to diversity, equity, inclusion and accessibility a priority. One of his first executive orders of his second term rolled back DEI practices across the federal government. DOGE has claimed a role in cancelling dozens of DEI-related expenditures. It announced on Jan. 29 that it had canceled $45 million in “DEI scholarships” that allowed Burmese students from marginalized and underprivileged backgrounds to study at universities across Asia. The program was funded by the U.S. Agency for International Development, or USAID. A Jan. 31 DOGE post on X included a table that claims $1 billion in savings from more than 100 DEIA-related contracts. In February, DOGE posted that the Department of Education terminated 32 DEI training grants totaling $116 million. On Feb. 14, DOGE posted a letter on X sent to each state’s Department of Education, threatening to cut federal funding of any school that does not remove DEI programming.Terminating federal leases for office spaceDOGE has been involved in efforts at the General Services Administration, which manages federal property for various agencies, to begin terminating leases on roughly 7,500 federal offices around the country, according to The Associated Press. In early February, DOGE claimed that nearly two dozen office leases had been terminated, saving the government $44.6 million. No details were provided on the offices or proof of the savings.Eliminating penniesA day after Trump took office, DOGE posted on X that the penny costs over 3 cents to make and cost taxpayers over $179 million in the 2023 fiscal year. Following that post, Trump directed the Treasury Department to stop minting new pennies, citing the rising cost of producing the one-cent coin.Accessing Treasury Department dataDOGE’s infiltration of the Treasury Department has drawn among the strongest reaction from lawmakers and the public. The department is responsible for managing federal finances, including overseeing the issuance of money, managing public debt, and collecting taxes. In early February 2025, DOGE staffers gained access to the Treasury's expansive payment system, which disburses trillions of dollars annually, and is normally overseen by a small group of nonpartisan Treasury employees. While Musk has defended this action, claiming that it was necessary for identifying fraud and inefficiencies, critics argue that it could compromise financial transparency and security, and raises myriad conflict-of-interest questions, particularly given Musk’s vast business dealings. DOGE’s access to the Treasury Department’s systems included read-only access to data that involved sensitive information, such as taxpayer records, Social Security numbers, and banking details of millions of Americans. Treasury officials revealed in a court document released on Feb. 11 that 25-year-old DOGE staffer Marko Elez was “mistakenly” given the power to edit a sensitive Treasury payments system. Elez never made use of that access before it was revoked, according to the filing.DOGE’s moves at Treasury have sparked legal challenges from federal employee unions and advocacy groups. A federal judge issued a temporary restraining order, halting DOGE’s ability to access certain critical taxpayer information. Paralyzing the Consumer Financial Protection BureauAs a watchdog agency tasked with safeguarding consumers from financial abuse, the CFPB plays a crucial role in regulating banking, lending, and credit practices. However, under DOGE’s influence, the agency has been paralyzed. On Feb. 7, Musk hinted at shuttering the agency, a move that aligns with broader conservative goals to reduce oversight of the financial industry. t DOGE staffers entered the CFPB's offices, demanding "read-only" access to sensitive financial applications, according to WIRED. After Trump fired the agency’s director, its acting director, Office of Management and Budget director Russell Vought, instructed staff members “not to perform any work tasks” starting Feb. 10. The National Treasury Employees Union has filed multiple lawsuits against DOGE, challenging its unprecedented access to CFPB systems and its attempts to eliminate or drastically alter the agency’s operations. Read More: What Cuts to the CFPB Could Mean For ConsumersAccessing Department of Education dataThe Department of Education has also become a focal point in DOGE’s campaign to shrink the federal government. On Feb. 5, reports surfaced that DOGE staff had been granted access to federal student loan data, which sparked an outcry among lawmakers and education advocates. While Musk’s allies claim that this move is part of a broader efficiency effort, many see it as a direct attack on federal education programs, which have long been a pillar of U.S. domestic policy.In addition to gaining access to sensitive student loan records, DOGE has made cuts to the Department of Education’s research programs, including those with the Institute of Education Sciences (IES), according to the AP. Accessing Federal Aviation Administration technologyIn early February, Musk claimed that his team had gained access to the Federal Aviation Administration’s technologies to facilitate "rapid safety upgrades." While the notion of improving safety in the aviation sector is widely supported, critics point to the potential conflict of '''
