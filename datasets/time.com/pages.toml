["https://time.com/7263291/zelensky-trump-oval-office-showdown-us-ukraine-world-leaders-react"]
title = "World Leaders React: Zelensky and Trump Oval Office Showdown | TIME"
description = "“You are not only fighting for your freedom but also for all of Europe’s,” Sweden's Prime Minister Ulf Kristersson said to Zelensky."
full_description = '''By Rebecca SchneidUpdated: March 1, 2025 4:36 PM EST | Originally published: March 1, 2025 11:59 AM ESTU.S. President Donald Trump and Ukrainian President Volodymyr Zelensky had a tense showdown in the Oval Office on Friday—the likes of which many world leaders were able to watch unfold, thanks to the media being present with their cameras rolling. The pair, joined by U.S. Vice President J.D. Vance, interrupted each other repeatedly during a meeting initially intended to be about a key U.S.-Ukraine minerals agreement.“You don’t have the cards right now,” Trump told Zelensky in the exchange, referencing Ukraine’s ongoing war with Russia and Russian President Vladimir Putin. Zelensky responded with a point of his own: “We’re not playing cards.”Trump made various other remarks about Zelensky and Ukraine’s current position, and the involvement the Biden Administration had in supplying support and funds to Ukraine after it was invaded by Russia. Zelensky remained steadfast on his point that a cease-fire agreement between Ukraine and Russia wouldn't be sufficient without security guarantees from the U.S., and that Putin cannot be trusted.“You’re gambling with [the] lives of millions of people, you’re gambling with World War III and what you’re doing is very disrespectful to this country,” Trump told Zelensky.Read More: Zelensky’s Oval Office Clash with Trump Draws Pride and Fear in UkraineTrump followed that up by saying: “Your men are brave, but they had our military. If you didn’t have our military equipment, this war would have been over in two weeks.”Shortly after the exchange, Trump canceled a planned press conference with Zelensky and cut off negotiations. He took to his own social media platform, Truth Social, where he wrote that Zelensky “is not ready for Peace if America is involved.”“He disrespected the United States of America in its cherished Oval Office. He can come back when he is ready for Peace,” Trump said.Following the Oval Office confrontation, many world leaders have spoken out, remarking upon what happened.Many have reified their support for Ukraine in its defense against Russia’s invasion. A few have supported Trump.Zelensky has been posting on X (formerly Twitter) to thank the world leaders who have come to his defense on the platform. The Ukrainian leader met with British Prime Minister Keir Starmer, as planned, on Saturday, and is still set to attend the summit of European leaders in London on Sunday, focusing on Ukraine and European security.The day after: Zelensky met with Britain's Prime Minister Sir Keir Starmer in London on Saturday. The two politicians are set to attend a summit of European leaders on Sunday. Peter Nicholls—Getty ImagesIn a lengthy statement posted to X on Saturday, Zelensky stated he was “thankful” to Trump, Congress, and the American people for their support, and that the country’s help has been “vital” in Ukraine’s survival.“It’s crucial for us to have President Trump’s support. He wants to end the war, but no one wants peace more than we do,” Zelensky said. “We are the ones living this war in Ukraine. It’s a fight for our freedom, for our very survival… Our situation is tough, but we can’t just stop fighting and not having guarantees that Putin will not return tomorrow.”Here’s how world leaders have responded to the Oval Office showdown:AustraliaAustralian Prime Minister Anthony Albanese reified the country’s support for Ukraine in a press conference with reporters soon after the exchange.“We stand with Ukraine,” he said. “The people of Ukraine are fighting not just for their own national sovereignty, they are fighting for the international rule of law.”BelgiumBelgium's Prime Minister, Bart De Wever, echoed his fellow European leaders' support. In a statement shared on X, he said: "We stand behind Ukraine and the Ukrainian people in their historic fight to defend themselves against an unprovoked Russian aggression. Their fight is our fight. United we are strong."CanadaPrime Minister Justin Trudeau said that Canada will “continue to stand with Ukraine.”“Russia illegally and unjustifiably invaded Ukraine,” he said, via a post on X. “For three years now, Ukrainians have fought with courage and resilience. Their fight for democracy, freedom, and sovereignty is a fight that matters to us all.”Russia illegally and unjustifiably invaded Ukraine. For three years now, Ukrainians have fought with courage and resilience. Their fight for democracy, freedom, and sovereignty is a fight that matters to us all. Canada will continue to stand with Ukraine and…— Justin Trudeau (@JustinTrudeau) February 28, 2025 EnglandZelensky has since arrived in England for a planned meeting with U.K. Prime Minister Keir Starmer, as a statement from Downing Street shared that Starmer still expresses “unwavering support for Ukraine.” Starmer reportedly spoke with both Trump—who he met in the Oval Office earlier this week—and Zelensky after the heated exchange.Starmer took to X after his meeting with Zelensky and posted a video of himself greeting the Ukrainian President."Action, not just words. Britain stands with Ukraine, today and always," he said.EstoniaPresident of Estonia Alar Karis said his country's support for Ukraine is "unwavering.""Your courage inspires us all. We stand with you, President Zelensky, and with [the] people of Ukraine. You are not alone," he said.European Commission“Your dignity honors the bravery of the Ukrainian people,” Ursula von der Leyen, the president of the European Commission—the executive branch of the European Union— said on social media. Addressing Zelensky, she said: “Be strong, be brave, be fearless. You are never alone, dear President.”Vice president of the European Commission, Kaja Kallas, supported this stance. "Ukraine is Europe! We stand by Ukraine," she said.Your dignity honors the bravery of the Ukrainian people.Be strong, be brave, be fearless. You are never alone, dear President @ZelenskyyUa.We will continue working with you for a just and lasting peace.— Ursula von der Leyen (@vonderleyen) February 28, 2025 FinlandAlexander Stubb, the President of Finland, shared a message stating: "We will stand by Ukraine for as long as it takes.""The heroic fight of Ukraine against Russia’s war of aggression is about the existence of Ukraine as a nation," he said, via social media. "We in Finland understand what Ukraine is going through."FranceFrench President Emmanuel Macron posted in clear support of Ukraine, stating that those who continue to fight for Ukraine do so “for their dignity, their independence, their children, and the security of Europe.”“There is an aggressor: Russia. There is a victim: Ukraine,” he said. “We were right to help Ukraine and sanction Russia three years ago - and to keep doing so.”GeorgiaGeorgia’s Prime Minister Irakli Kobakhidze took to Facebook to support Trump, wishing the U.S. President “endurance and courage” in a lengthy post in Georgian, which could be translated to English on the social media platform.GermanyThere have been varying responses out of Germany. Several German leaders have come to Zelensky’s defense.“Ukraine is not alone,” Foreign Minister Annalena Baerbock wrote in a statement posted to social media. “Germany together with our European allies stands united alongside Ukraine— and against the Russian aggression. Ukraine can build on unwavering support from Germany, Europe, and beyond.”Germany's current Chancellor, Olaf Scholz, and the incoming Chancellor, Friedrich Merz, also voiced their support, on X.“We must never confuse aggressor and victim in this terrible war,” Merz said.Dear Volodymyr @zelenskyyua, we stand with #Ukraine in good and in testing times. We must never confuse aggressor and victim in this terrible war. (FM)— Friedrich Merz (@_FriedrichMerz) February 28, 2025 Elsewhere, Tino Chrupalla, a co-leader of Germany's far-right Alternative for Germany (AfD), vocalized his support for Trump.“Since the E.U. and Germany unfortunately fail as mediators, the USA and Russia must come to an agreement,” he said, via a translated post shared on X.HungaryThe Prime Minister of Hungary, Orbán Viktor, notably broke away from many of his European counterparts and showcased his support for Trump.“Strong men make peace, weak men make war,” he said in a post on X. “Today President @realDonaldTrump stood bravely for peace. Even if it was difficult for many to digest. Thank you, Mr. President!”Strong men make peace, weak men make war.Today President @realDonaldTrump stood bravely for peace. Even if it was difficult for many to digest. Thank you, Mr. President!— Orbán Viktor (@PM_ViktorOrban) February 28, 2025 IrelandMicheál Martin, the Taoiseach (Prime Minister) of Ireland and Simon Harris, the Tánaiste (Deputy Prime Minister), both showed their support to Ukraine via X.“Having visited Ukraine twice, I’ve seen the resilience and courage of its people,” said Martin, who met with Zelensky on Feb. 27. “Ireland stands with Ukraine.”Ukraine is not to blame for this war brought about by Russia’s illegal invasion.We stand with Ukraine. 🇺🇦 🇮🇪— Simon Harris TD (@SimonHarrisTD) February 28, 2025 ItalyItaly’s Prime Minister Giorgia Meloni, who is well-liked by Trump, suggested a summit between the U.S., European nations, and allies to “speak frankly about how we intend to address today’s major challenges, starting with Ukraine” in a statement released Friday.“Any division of the West makes us all weaker, and benefits those who would like to see the decline of our civilization; not the decline of its power or influence, but the decline of the principles on which it was founded, first and foremost: freedom,” Meloni’s statement continued.MontenegroJakov Milatović, President of Montenegro, posted on X to show his support to Ukraine, tagging Zelensky. “Montenegro supports a just and lasting peace in Ukraine and stands with its people in their pursuit of peace,” he reaffirmed.New ZealandPrime Minister of New Zealand Christopher Luxon spoke out via social media. "New Zealand remains steadfast in its support for Ukraine as it defends itself in a war that Russia started," he said. "It's mounting the defence of a proud, democratic and sovereign nation, but also the defence of international law."New Zealand remains steadfast in its support for Ukraine as it defends itself in a war that Russia started. It's mounting the defence of a proud, democratic and sovereign nation, but also the defence of international law.— Christopher Luxon (@chrisluxonmp) March 1, 2025 Slovak Republic Former President of Slovakia, Zuzana Čaputová, who led the country until 2024, posted on X in support of Ukraine, stating that the people are “defending their right to live.”“It’s that simple,” she said. “They deserve all the support they can get to defend this right and to live and prosper as a sovereign nation living in peace.”SloveniaNataša Pirc Musar, President of Slovenia, said: "What we witnessed in the Oval Office today undermines these values and the foundations of diplomacy. We stand firmly in support of Ukraine's sovereignty. We repeat, Russia is the aggressor."Slovenia upholds the principles and respect of international law and international relations. What we witnessed in the Oval Office today undermines these values and the foundations of diplomacy. We stand firmly in support of Ukraine's sovereignty. We repeat, Russia is the…— Nataša Pirc Musar (@nmusar) February 28, 2025 SpainPrime Minister Pedro Sánchez, who recently announced a new military aid package worth over $1 billion to Ukraine, said: “Ukraine, Spain stands with you.” The social media message was translated into Spanish and Ukrainian.Ucrania, España está contigo. Ukraine, Spain stands with you. Україно, Іспанія з тобою. 🇺🇦 🇪🇸— Pedro Sánchez (@sanchezcastejon) February 28, 2025 SwedenSwedish Prime Minister Ulf Kristersson supported Ukraine on social media, writing that the country “stands with Ukraine.”“You are not only fighting for your freedom but also for all of Europe’s,” he said.Sweden stands with Ukraine. You are not only fighting for your freedom but also for all of Europe’s. Slava Ukraini! 🇺🇦— SwedishPM (@SwedishPM) February 28, 2025'''
