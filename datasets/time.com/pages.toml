["https://time.com/7259962/trump-administration-officials-resign"]
title = "Everyone Who's Resigned From the Trump Administration | TIME"
description = "Several prominent government officials have decided to resign from the Trump Administration after thousands of federal workers were fired."
full_description = '''By Nik PopliUpdated: February 26, 2025 11:08 AM EST | Originally published: February 20, 2025 1:24 PM ESTA number of prominent government officials have decided to resign from the Trump Administration after thousands of federal workers were fired as part of a push to streamline government operations.The career officials, many of whom served in previous presidential administrations, have condemned President Donald Trump and billionaire Elon Musk for seemingly pressuring workers not considered loyal to the new administration to vacate their jobs. In February, the Trump Administration—working closely with the newly-established Department of Government Efficiency (DOGE), led by Musk—ordered agencies to terminate most probationary and temporary employees.Here’s a list of the government officials who have resigned from the Trump Administration in protest.Top Treasury Department officialDavid Lebryk, the highest-ranking Treasury Department career official, retired on Jan. 31 after clashing with Musk’s allies over access to government payment systems, the Washington Post reported. Lebryk, who briefly served as acting Treasury Secretary until Scott Bessent’s confirmation, oversaw the more than one billion payments that the federal government makes every year.Lebryk reportedly told colleagues in an email that he would retire after more than 35 years of working for the government. The Trump Administration, however, says it placed Lebryk on administrative leave before he announced he would step down. As acting Treasury Secretary under Trump, Lebryk resisted Musk’s surrogates who were dispatched to take control of the Treasury computers used to complete payments in order to identify fraud and abuse, as part of DOGE’s efforts to reduce government spending. “The fiscal service performs some of the most vital functions in government,” Lebryk wrote in his email, according to The New York Times. “Our work may be unknown to most of the public, but that doesn’t mean it isn’t exceptionally important.” Director of the FDA’s food divisionJim Jones, the director of the Food and Drug Administration’s food division, stepped down on Feb. 17, citing “indiscriminate” cuts across the agency that he said would make it “fruitless for him to continue.” “I was looking forward to working to pursue the department’s agenda of improving the health of Americans by reducing diet-related chronic disease and risks from chemicals in food,” Jones wrote in his resignation letter, according to Bloomberg. He added that the Trump Administration’s “disdain for the very people” needed to implement food safety reforms gave him no choice but to depart.Jones joined the agency in September 2023 and most recently oversaw the Biden Administration’s ban on the food dye Red No. 3 in January, as well as the FDA’s investigation of contaminated applesauce linked to dozens of lead poisoning cases in children. In his letter, he estimated that 89 staff members out of the 2,000 people in his division were fired as part of the Trump Administration’s cuts.Jones also criticized Robert F. Kennedy Jr., the newly-appointed secretary of the Department of Health and Human Services (HSS), for “impugning the integrity of the food staff, asserting they are corrupt based on falsities.”Acting SSA commissionerMichelle King, the top official at the Social Security Administration, stepped down from her role as acting commissioner after DOGE sought access to sensitive records containing the private information of Americans, according to the Associated Press. King refused to hand over sensitive information to the DOGE staffers, and was replaced as acting commissioner by Leland Dudek.King had spent 30 years working in the agency, which oversees retiree and disability benefits received by 73 million people. Trump told reporters at a press conference on Feb. 18 that King did not resign but was rather fired: “You know when you fire someone, they always resign and then they say, 'We resigned.' But when you have numbers like that, I think really it's [you] got fired."GSA engineering leadSteven Reilly, a lead engineer at the Technology Transformation Services arm of the General Services Administration, resigned on Feb. 18 after Thomas Shedd, a DOGE ally now in charge of the branch, requested access to sensitive data, including personally identifiable information (PII), according to The Washington Post. “We have not received a justification for this request, which makes it difficult to suggest alternative approaches that would accomplish Thomas’ goals while still being protective of [personally identifying information] for members of the public,” Reilly wrote in a parting message to colleagues, according to The Washington Post. “We have made clear to Thomas that this level of permission would allow access to PII. While we have suggested alternatives, such as read-only access, Thomas has continued to request full admin/root access.”Reilly led the engineering team for notify.gov, a government system used to send mass text messages to the public. Career Justice Department officialsJustice Department officials normally remain in office from one administration to the next. But dozens of career officials, including top prosecutors in Washington, D.C., and New York, have quit since Trump took office, in protest of his calls to shake up the department he believes was used against him.Seven federal prosecutors have so far resigned after acting Deputy Attorney General Emil Bove ordered them to drop criminal corruption charges against New York City Mayor Eric Adams, who is set to go on trial in April on charges of bribery and campaign finance violations. Adams, a Democrat who pleaded not guilty and denied wrongdoing, has forged ties with Trump and his border czar, Tom Homan, particularly over immigration. The officials who resigned included Danielle Sassoon, acting U.S. attorney for the Southern District of New York; Hagan Scotten, assistant U.S. attorney with the Southern District of New York; John Keller, acting head of the Justice Department’s Public Integrity Section; and Kevin Driscoll, acting head of the Justice Department’s Criminal Division. Elsewhere in the Justice Department, Bradley Weinsheimer, a senior ethics official who was named associate deputy attorney general during Trump’s first term, accepted the government’s deferred resignation offer after the Administration tried to reassign him to a new sanctuary cities working group, according to Reuters. Weinsheimer had been with the department for 34 years.Denise Cheung, the head of the criminal division in the U.S. Attorney’s Office in Washington, D.C., resigned Feb. 18 after she received an order from Trump’s Justice Department to open a grand jury investigation into Biden-era climate funds, which she viewed as premature and unsupported by evidence. “When I explained that the quantum of evidence did not support that action, you stated that you believed that there was sufficient evidence,” Cheung wrote in her resignation letter, according to Politico. “I still do not believe that there is sufficient evidence to issue the letter you described.” Cheung, who had worked in the U.S. Attorney’s Office since 2000, refused the order to open the investigation and use the DOJ's powers to freeze that climate funding, claiming that step would only be permitted if prosecutors had “probable cause” to believe a crime had been committed.DOGE employeesMore than 20 civil service employees have resigned from Musk’s DOGE, stating that they were refusing to use their technical expertise to “dismantle critical public services,” according to a joint resignation letter sent to White House chief of staff Susie Wiles on Feb. 25, that was obtained by the Associated Press.The employees, who had worked for the United States Digital Service (renamed the United States DOGE Service once Musk took charge), said in their letter that “we swore to serve the American people and uphold our oath to the Constitution across presidential administrations. However, it has become clear that we can no longer honor those commitments at the United States DOGE Service.”“We will not use our skills as technologists to compromise core government systems, jeopardize Americans’ sensitive data, or dismantle critical public services,” they continued. Their resignation comes as the Trump Administration has enabled DOGE to purge the federal workforce, leaving thousands of government workers out of jobs.In response to the Associated Press’ reporting of the resignations, Musk said in a post on X: “More fake news from Associated Propaganda. These were Dem political holdovers who refused to return to the office. They would have been fired had they not resigned.”The letter cites multiple reasons for their decision to resign, including a move to fire roughly one-third of staffers in their office, many of whom worked on Social Security, veterans’ services, tax filing, and health care. The staffers also said that they were interviewed by people wearing White House visitors’ badges, some of whom reportedly refused to identify themselves, a day after Trump’s Inauguration Ceremony and that they “asked questions about political loyalty, attempted to pit colleagues against each other, and demonstrated limited technical ability,” according to their letter.'''
