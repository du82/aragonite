ctures on... By Rebekah Taussig February 14, 2022 <img style="opacity:1;" src="https://api.time.com/wp-content/uploads/2021/10/flying-disabled-challenges-2.jpg?quality&#x3D;85&amp;w&#x3D;407&amp;h&#x3D;271&amp;crop&#x3D;1" alt="" /> The Disempowering Experience of Flying as a Disabled Person I am the youngest daughter of a man who paid his way through college working 50 hours a week, replacing sleep with sheer grit. He raised six kids and still woke before dawn for his... By Rebekah Taussig November 1, 2021 <img style="opacity:1;" src="https://api.time.com/wp-content/uploads/2021/04/Rebekah-Taussig-motherhood-pandemic.jpg?quality&#x3D;85&amp;w&#x3D;407&amp;h&#x3D;271&amp;crop&#x3D;1" alt="" /> My Pandemic Baby Is Willing Us Outside I am a different person now than I was when this pandemic started. I don’t just mean that I’ve stopped wearing makeup and started wearing leggings as my work-and-play uniform, although, yes, that too. Everything... By Rebekah Taussig April 28, 2021 <img style="opacity:1;" src="https://api.time.com/wp-content/uploads/2021/01/joy-pain-rebekah-taussig-featured.jpg?quality&#x3D;85&amp;crop&#x3D;0px%2C670px%2C2400px%2C1601px&amp;resize&#x3D;407%2C271&amp;strip" alt="" /> Living in a Tangle of Joy and Pain It was a night in mid-April that I fell asleep to the phrase this is too hard pinging through my brain, and they were the first words to cross my mind when I opened my... By Rebekah Taussig January 5, 2021 <img style="opacity:1;" src="https://api.time.com/wp-content/uploads/2020/08/disability-kindness-01-vertical.jpg?quality&#x3D;85&amp;crop&#x3D;0px%2C77px%2C1800px%2C1200px&amp;resize&#x3D;407%2C271&amp;strip" alt="" /> I've Been Paralyzed Since I Was 3. Here's Why Kindness Toward Disabled People Is More Complicated Than You Think Your efforts to help disabled people may not always have the intended effect By Rebekah Taussig August 20, 2020 More from TIME More From TIME'''
