["https://time.com/7262542/pam-bondi-jeffrey-epstein-files"]
title = "AG Pam Bondi Blames FBI for Incomplete Release of 'Epstein Files' | TIME"
description = "A review of the released documents found that they included heavy redactions and mostly information that had been previously reported."
full_description = "By Nik Popli and Chad de GuzmanUpdated: February 28, 2025 12:00 AM EST | Originally published: February 27, 2025 3:48 PM ESTA group of conservative influencers left the White House on Thursday afternoon, all holding white binders emblazoned with the Department of Justice seal. Some of them held up the binders to the cameras, which showed that they were labeled “The Epstein Files: Phase 1.”The unusual scene came just hours after Attorney General Pam Bondi, who was confirmed earlier this month, vowed to release a cache of documents related to the late financier and convicted sex offender Jeffrey Epstein. Bondi had promised that the files would include flight logs and the names of individuals involved, but she had cautioned that some information could not be disclosed due to the need to protect more than 250 victims.Read More: How Longtime Epstein Watchers Reacted to the Release of the ‘Epstein Files’A review of the released documents found that they included heavy redactions and mostly information that had been previously reported. While the binders appeared to be marked “declassified,” questions remained as to whether they had ever been classified in the first place. The limited scope of the release drew criticism from some Republicans, including Rep. Anna Paulina Luna of Florida, who leads a House GOP task force on government transparency.“I nor the task force were given or reviewed the Epstein documents being released today … A NY Post story just revealed that the documents will simply be Epstein’s phonebook,” Luna tweeted. “THIS IS NOT WHAT WE OR THE AMERICAN PEOPLE ASKED FOR and a complete disappointment. GET US THE INFORMATION WE ASKED FOR!”Read More: Released ‘Epstein Files’ Disappoint Anticipators. A Republican ‘Rickroll’ Didn’t HelpIn a Thursday letter to FBI Director Kash Patel, Bondi suggested that the FBI had more documents related to Epstein’s investigation and indictment. She ordered the “full and complete” Epstein files to be delivered to her office by Friday morning, and also ordered Patel to “conduct an immediate investigation” as to why her previous order on delivering all the files wasn’t followed.As the Epstein documents were released, Patel posted on X that the bureau is “entering a new era.” He added: “If there are gaps, we will find them. If records have been hidden, we will uncover them. And we will bring everything we find to the DOJ to be fully assessed and transparently disseminated to the American people as it should be.”Among those carrying the binders outside the White House was political commentator Rogan O’Handley, known online as DC Draino, along with Libs of TikTok creator Chaya Raichik, podcaster Liz Wheeler, and Jack Posobiec, among others. Some posted the same seemingly coordinated message on X, including the line: “This is the most transparent administration in American history.”Bondi discussed the release of the documents in an interview with Fox News on Wednesday, offering a glimpse of what might be included—though she stopped short of confirming whether new revelations would emerge from the files, beyond what the public already knew. Epstein’s dark history, marked by his abuse of underage girls, has been extensively documented over the years, with multiple lawsuits, criminal dockets, and public disclosures laying bare the extent of his crimes.Read More: The Biggest Names from Jeffrey Epstein’s Unsealed Court DocumentsIn January 2024, a court unsealed a large batch of documents from the lawsuit filed by Virginia Giuffre, one of Epstein’s victims. The materials released at that time, including police reports and victim testimonies, had already been publicly circulated.Epstein’s predatory behavior spanned more than a decade, with allegations dating back to the 1990s. He was accused of abusing hundreds of children, some as young as 14, in a sprawling operation allegedly involving high-profile individuals, including politicians, celebrities, and royalty. Epstein’s death in 2019, ruled a suicide while in a Manhattan jail awaiting trial, only fueled conspiracy theories and renewed calls for transparency."
