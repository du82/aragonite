started changing. “I mean, drastically,” she says. “I had no desire to get up, no libido, nothing.” It took some time for her and her doctor to figure out the right testosterone dosage, but once they did, she felt like the best version of herself again. “Within a week, I thought, ‘I feel so much better. I feel more clear.’ I was working out and my intensity was back, my libido was back,” she says. ‘I thought, ‘This is fantastic. Who wouldn’t do this? I need to tell more people.’”So is TRT really all that? There’s simply not enough data to back up the hype. “We really can't say that it's not potentially helpful,” Kurtzer says. “Could it help with body composition and replacing that muscle? Could it help with physical functioning, energy, and even cognitive health and mood?” Maybe. “The problem is,” she says, “we just don't have sufficient data.” The studies that do exist have yielded uncertain results beyond improving sexual function; plus, little is known about the long-term effects of testosterone in women. “We have no long-term studies—even using it for HSDD, the studies really are around two years,” she says. “With the idea that this is a long-term solution, what's the tradeoff? Are you now impacting that woman's overall heart disease risk? Are we increasing breast cancer risk? We have no long-term data on that.”Read More: Menopause Is Finally Going MainstreamMore data exist for men. Large analyses have found no evidence that testosterone increases cardiovascular problems in the short- to medium-term, for example, and a person’s risk of dying early doesn’t appear to change. Another study found that TRT doesn’t increase the risk of prostate cancer, even after more than 15 years of treatment. Yet it’s hard to draw conclusions about women based on these findings, experts say, since dosage isn’t the same (though it’s usually lower) and women’s bodies work differently.Still, Kurtzer—who has been prescribing testosterone to women for years—hopes research will one day confirm that TRT is as beneficial as some of her patients claim. “I would love for it to be true that it helps with all those things, because we don't have a lot of other solutions, and it’s frustrating for people,” she says. “I used to liken it to a drug—and I meant that facetiously—but people who were on it felt so elated and good. It’s a powerful kind of feeling. That's why I'm like, ‘Wow, if it's true and it's safe, and we can use it long term, I'm all for it.’ But at this point, we just don't know the detrimental piece of it.”Side effects of testosterone therapyWhen April Sandefer first tried TRT 10 years ago, it went well. “I felt great,” she says. But she stopped taking it when the compounding pharmacy she used went out of business. A couple years ago, she decided to start back up again, and within a few months, she noticed her hair was becoming thin and her face was breaking out. She also became aggressive at work, she says—an out-of-character development. “I said some really inappropriate things,” recalls Sandefer, 64, who lives in Oklahoma City. “My boss pulled me aside and was like, ‘April, you can't talk like that to me.’” She ended up stopping treatment. “It’s disappointing that as we get older, we just have to accept [annoying symptoms], because they don't seem to have a lot of things created for women,” she says. She doesn’t plan to try testosterone again: “It’s not worth it to me.”Indeed, research suggests that in the short term, TRT could lead to hair growth on the face, chest, and back, as well as acne and behavioral and personality changes. That can be especially true for those receiving pellets, which typically contain higher doses than other forms of testosterone. “Once they’re in your body, you can't alter or adjust the dose or how long you're exposed to it,” Kurtzer says. “Those have typically been the people who come to us with complications, because it’s way more than their bodies can accommodate.” It takes about three to four months for testosterone pellets to metabolize out of your system, she adds, which is a long time to deal with unpleasant side effects. That's why experts including Kurtzer typically recommend against using pellets.Read More: Why You Sweat So Much at Night—And What to Do About ItStill, experts say that one common worry about TRT in women—developing male traits—is overblown. “Concern about masculinization is disproportionate to what really happens,” Jordan says. She hasn’t seen patients develop male pattern baldness, grow a beard, or start speaking in a deeper voice, for example. Regular blood testing is helpful, she adds, and allows clinicians to make dosage adjustments if side effects like mild masculinization do occur.“The way we approach it is we listen to women, figure out what their symptoms are and what health benefit they're seeking, and what's going to help them feel well and vital—rather than just saying it’s a blanket anti-aging treatment that all women should have,” Jordan says. “When it’s done with that sort of guidance and counseling, it can be very safe and effective.”"
