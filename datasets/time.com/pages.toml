["http://www.time.com/7210599/percival-everett-james-literary-canon"]
title = "Percival Everett Is Challenging the American Literary Canon | TIME"
description = "With his latest novel, ‘James,’ the National Book Award winner has jump-started a conversation about the Great American novel."
full_description = "By Eliana DocktermanFebruary 6, 2025 7:00 AM ESTPercival Everett claims he is not as brilliant as his fans know him to be. He deeply researches the worlds in which his novels are set, yet swears that everything he learns falls out of his head as soon as each book is published. “So I’m no smarter at the end than I was at the beginning,” he says, shrugging his shoulders. Years ago, sick of his writing students asking him if they were good enough to be published, he took a class to a bookstore in Middlebury, Vt., to prove he was not unique. “Look around,” he told them. “Anyone can be published. ‘Are you good enough to make a difference?’ is the question.” With his latest, James, a reimagining of Huckleberry Finn told from the perspective of the escaped slave Jim—who drops his nickname for the more noble-sounding James—Everett has jump-started a conversation about the great American novel, how issues of race interplay with the so-called American canon, and how we talk to our children about America’s past. But just a few hours before he wins the National Book Award for fiction, he demurs when pressed on the book’s impact. “If a reader is coming to me for any kind of message or answer about anything in the world,” he says, “they’re already in deep trouble.” For many, however, James has become an important companion piece to Mark Twain’s work, the book “all American literature comes from,” to quote Ernest Hemingway. “I’ve been getting lots of mail from former and current English teachers thanking me that they can now teach Huck Finn again because they can do it alongside James,” he admits, “which is great news for me and certainly flattering, but doesn’t come as a great surprise. It’s a problematic text.”Everett, 68, would do away with the canon altogether if he could. But at the very least he hopes that writers, readers, and educators can acknowledge the inherent issues with putting certain books on a pedestal. “My joke is, ‘The canon is loaded,’” says Everett. “Canon formation is necessarily skewed. It’s necessarily racist and sexist. As soon as you’re saying there are these texts that must be read, someone has to choose. Who chooses?”While Jim is little more than a sidekick on Huck’s journey down the Mississippi in the original, in Everett’s version he is at the center of the story. James and other Black characters code switch when white characters are present; on his own, James interrogates philosophers like Voltaire for his repugnant views on slavery. “Enslaved people, it had occurred to me, are always depicted as simple-minded and superstitious, and of course, they weren’t,” Everett says. “So I embarked on this.” Everett gives James the gift of language, and James writes his account of his travels with a stolen pencil stub—one which comes at great human cost. “Whoever controls language, controls everything. If someone has no voice, they cannot get what they want or what they need,” says Everett. Everett, who has published two dozen novels, including the Pulitzer Prize finalist Telephone, has historically bristled at being categorized in the genre of African American fiction, especially considering he has written everything from propulsive westerns to a novella styled like a Lifetime movie. “Any work of art that comes out of this American culture is about race. If there is no race in it, that is a statement about race,” he says. This frustration is at the heart of Erasure, one of Everett’s early and best-known novels, which was adapted into the Oscar-winning 2023 film American Fiction. The story centers on Thelonious “Monk” Ellison, the author of experimental novels that don’t sell particularly well. Monk becomes so exasperated with the publishing industry bolstering Black fiction that depicts only stereotypes that he pens a novel as an illiterate thug to prove a point. The book is a hit, much to the author’s chagrin. James, too, will get the Hollywood treatment, with Steven Spielberg producing and Taika Waititi in talks to direct, though Everett insists this attention is “fleeting.” “I'll write some experimental novel next that no one will understand,” he says. “You would have to be crazy to get into literary fiction to get famous or to get rich.”"
