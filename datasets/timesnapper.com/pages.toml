["https://timesnapper.com/help"]
title = "Help with TimeSnapper - TimeSnapper"
full_description = '''Filter lets you stop TimeSnapper from recording certain programs, or let you set that only some programs will be recorded. Details of the Filter feature are available here. The delay between each frame is shown in the Up/Down Picker. A shorter delay will cause a faster animation. The smallest delay you can enter is thirty milliseconds: this makes for an extremely fast and frenetic film. Note: if you enter a delay that is too fast for your machine, parts of the application may appear to freeze. This effect is temporary. If this occurs, press the pause button and increase the delay to an acceptable level before pressing play again. While your activity is being played, a "Pause" button is available (instead of a "Play" button). This will let you freeze the movie. The date and time of the current image is shown as the window title at all times. TimeSnapper now includes our customized TimeBarTM control in the top center of the 'Browse Day' screen. The TimeBar lets you see your activity at a glance. You can quickly tell what hours you worked, when you had lunch and when you had coffee breaks. Once the TimeBar is selected, you can use your keyboard's right and left arrows to bump the movie one frame ahead or backward. Use the PgUp or PgDown keys to jump backwards or forwards by a larger slice of time. The ">>" button will load the next day's activity. (It is disabled in the screen shot because the next day has not been recorded yet... 'tomorrow never comes') By default the image is stretched to be as large or as small as the Day Browser. But there are two other options, available from the Context Menu. You can view the image at Original (full) size, either centered, or anchored to the top right corner. In the main menu, chose View | Options... and you will be presented with the options form. The Options form has four tabs: Portable network graphics format. An open format usable on any system. At maximum quality it is 'lossless', at lower quality it compress into quite a small size.'''
