["https://timesnapper.com/screenshots"]
title = "Screenshots and Feature Tour, Automatic Screen Capture with TimeSnapper - TimeSnapper"
full_description = "Press Record and TimeSnapper immediately minimizes to the system tray, silently taking screenshots in the background. You can see if TimeSnapper is taking screenshots or not by the red X over the icon in the system tray: No worries, you can password protect all your images and NO ONE can see them except you. The screenshots are encrypted by state of the art encryption methods. No worries, TimeSnapper is extremely efficient and has no noticable effect on your computer performance! Click the Play button to view the screenshots TimeSnapper has recorded. That will open up the Day Browser: Click anywhere in the TimeBar to jump to that point in time. It's like a Time Machine! Or you can just watch the day like a movie by pressing the Play button. This is one of the ways TimeSnapper can help you track time automatically and effectively. Also notice the red and green stripes in the TimeBar -- they differentiate between productive and unproductive time so you can quickly see patterns! One of the hardest part of keeping notes of what you did throughout the day is actually remembering to take notes in the first place! TimeSnapper has an innovative way to remind you to write down what you are doing without causing distraction. The note will be visible on the TimeBar, which you can hover over to see the details or click to edit: You control when and how (and if) this dialog pops up. Of course you can manually create a new note any time you want (e.g. by right clicking the system tray icon) One of TimeSnapper's innovative features is the ability to help you track your productivity. Once set up, TimeSnapper takes care of calculating your productivity. This can really help if you are trying to stay more focused and make better use of your time. There are a lot of other great features (e.g. more reports) and TimeSnapper is constantly evolving. Take a look at more screenshots and details here. Go ahead and purchase a copy of TimeSnapper Professional. It just might be one of your best investments yet!"
