["https://timesnapper.com/purchase"]
title = "Purchase - TimeSnapper"
full_description = "What is a site-wide license? A site-wide license is the best solution for teams of 10 or more people on Windows. In fact we allow up to 300 users on a site-wide license, so it can save you thousands of dollars, while boosting the productivity of your entire team. Secure and Easy Payment Purchases of the Windows version are via PayPal. You don't need an account, just an email address and a credit card number. Orders are processed immediately and the license key is delivered by e-mail, and shown onscreen. Upgrade Protection After purchasing TimeSnapper for Windows, you will receive upgrades for free (e.g. version 3.5 to version 3.6) Individual License - Install On Three Computers! Most people use TimeSnapper for Windows on their work computer, home computer and laptop. We respect that. You only need one individual TimeSnapper for Windows license in that situation. Activate online or offline Most customers activate TimeSnapper for Windows online, using the unique code we send them. If needed we can also arrange for offline activation. (Useful for computers that are not connected to the internet.) RISK FREE! If you change your mind or are unhappy with TimeSnapper for Windows for any reason, we will refund your money and apologize for the inconvenience. TimeSnapper for Mac sales are managed by Apple and the Mac App Store, so we're not in control of refunds for the Mac version. We will always try to honor your wishes. We want happy customers even if they become former customers."
