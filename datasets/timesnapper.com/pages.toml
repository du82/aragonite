["https://timesnapper.com/faq"]
title = "Frequently Asked Questions - TimeSnapper"
full_description = '''If your question isn't answered here, don't hesitate to email us or to visit the wiki, to see if your question is answered there. For everyday use, TimeSnapper should have no noticeable effect on the performance of your machine. It generally uses between 1 and 5 megabytes of memory. In a modern computer this is a small amount of memory. When I first thought of the idea for TimeSnapper, I assumed it would slow my computer right down. I almost gave up on the idea for this reason. Later, when I saw the first prototype (developed by TimeSnapper's chief developer, Atli) I was completely won over by the incredible performance of Atli's implementation. And since then, the application has been further improved with a number of optimisations to give a very smooth ride. We use TimeSnapper day in, day out on a variety of computers and find that it has no noticeable effect on the performance of a computer. Try it and see for yourself. If your experience is otherwise, write to us and tell us. Firstly, no images are taken when the computer is idle. So if you are away from your computer, or leave it on overnight, no screenshots are taken. Second, there is an archiving feature, that you can use to specify, "Delete all images older than 14 days" (or as many days as you choose). You can also limit TimeSnapper to use no more than a certain number of mega-bytes of hard drive space. (The archiving options are shown in the image below) The third feature is that you can configure the resolution of the images, and take smaller, or fuzzier images if you wish. This can have a dramatic reduction on the required hard drive space. The fourth feature that helps is the amount of time between images. If you have very limited space, you can take screenshots less often. Perhaps only once per minute, or even once every ten minutes. It will still give a fairly useful picture of where all that time went. Yes! TimeSnapper can now cater for up to three monitors. You can also configure it to capture only the current application. More details are included in the help page.'''
