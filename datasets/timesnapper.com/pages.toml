["https://timesnapper.com/pluginhowto"]
title = "Creates Plugins for TimeSnapper, Frequently Asked Questions - TimeSnapper"
full_description = '''If your question isn't answered here, you might also like to read the Plugin Development Wiki for TimeSnapper. For more in-depth help developing plugins, don't hesitate to contact us. At the code level, it is a .net class that implements an interface (ITimeSnapperPlugin) that TimeSnapper will seek out talk to. At the file level, a TimeSnapper plugin is a dll that ends with the word "Plugin" -- for example "SamplePlugin.dll". It sits in a subfolder called "Plugins" located under the TimeSnapper folder. For example "C:\Program Files\TimeSnapper\Plugins". In addition to subscribing to events, a plugin can tell TimeSnapper to put extra menu items into some of the context menus in the TimeSnapper application. The standard answer we've given to tricky questions for the last year has always been "If you want to do that, you'll need to write a plugin". A sample that ships with the latest version of TimeSnapper is called 'the Animated GIF' plugin. It lets you export a series of images as an animated gif. Achieving this inside a plugin was quite trivial (we did it by following Jon Galloway's lead when he built the same plugin feature for Cropper. We tinkered with the NGif project at codeproject, and then leveraged public domain portions of the animated gif plugin that Jon wrote.) Connect to TFS, get outstanding tasks and assign time against them. Or -- connect to TFS, read what work items a user completed, and drop them into the timeline as flags. Run over older images, resize them and/or convert them to lower resolution. Record current application activity in outlook Journal. Integrate with a user's Outlook Calendar and note in the timeline that the user was in a meeting from 2-3pm instead of showing a gap. Create a new project in visual studio, of type "Class Library". (In other words, we will be creating a DLL.) The two properties above are used by TimeSnapper for providing information about the plugin, inside the 'Options' dialog: So, if you want your plugin to subscribe to the "Flag Saved" event and the "Snapshot Saved" event, you would write this code:'''
