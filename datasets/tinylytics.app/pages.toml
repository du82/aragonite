["https://tinylytics.app/docs/ignore_your_hits"]
title = "Ignoring Your Own Hits | Tinylytics"
full_description = "Ignoring Your Own Hits Once you’ve embedded your script and started recording hits, you might want to exclude your own visits from the analytics. This guide shows you how to easily ignore your own hits. Quick Setup Add one of these URL parameters to your site and reload the page: # Standard version https://your-awesome-site.com?tiny_ignore=true # Simplified version (if you have issues with underscores) https://your-awesome-site.com?ti=true Important: Make sure to include the full URL with https:// or http:// to avoid being redirected to search results. How It Works When you visit your site with the ignore parameter: A flag is set in your browser’s localStorage You’ll see a confirmation alert Your future visits won’t be counted The setting: Persists across page refreshes Is browser-specific (you’ll need to set it for each browser you use) Doesn’t affect other visitors’ hits Reverting the Setting To start recording your hits again, you have several options: URL Parameter Method: https://your-awesome-site.com?tiny_ignore=false Alternative Methods: Clear your browser data for the website Delete the localStorage key (for advanced users) Best Practices Set this up early in your site’s lifecycle Apply it on all browsers you use for development Consider setting it on your mobile devices too Keep the URL handy for future browser setups Tips Perfect for development and testing Helps maintain accurate analytics Works alongside all other Tinylytics features No impact on your site’s performance Technical Details Uses browser localStorage No cookies required Zero impact on other visitors Works with all modern browsers"
