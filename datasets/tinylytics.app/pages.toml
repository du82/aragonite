["https://tinylytics.app/docs/showing_countries"]
title = "Showing Visited Countries | Tinylytics"
full_description = 'Showing Visited Countries Add a global touch to your site by displaying which countries have visited your pages! Tinylytics makes it easy to show this information using emoji flags, arranged in alphabetical order. Setting Up Country Display 1. Modify Your Embed Script Add the countries parameter to your embed script: https://tinylytics.app/embed/YOUR_EMBED_CODE.js?countries Combining with Other Features You can combine the countries feature with other Tinylytics features: https://tinylytics.app/embed/YOUR_EMBED_CODE.js?kudos&hits&countries Implementation Adding the Countries Display Add this HTML element where you want to show the country flags: <span class="tinylytics_countries"></span> Note: - The element’s content will be automatically populated - Countries are displayed as emoji flags - Flags are arranged alphabetically - The display updates automatically as new countries visit Example Here’s how it looks in action: 🌍 Styling Tips Add padding between flags for better readability Consider hover effects to show country names Works well in footers or sidebars Can be styled to match your site’s design Best Practices Place it where it won’t distract from main content Consider adding a title or label Use appropriate spacing around the flags Test the display at different screen sizes Features Automatic updates as new countries visit Emoji flags for visual appeal Alphabetical ordering for consistency No maintenance required - just set and forget!'
