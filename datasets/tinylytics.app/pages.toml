["https://tinylytics.app/privacy"]
title = "Privacy Policy | Tinylytics"
full_description = "Privacy Policy This document outlines the information gathering and data handling practices for Tinylytics and its associated services. Information Collection For service monitoring and debugging purposes, we utilize Sentry.io. In the event of an application error, only your customer ID is logged and stored within Sentry.io, strictly for debugging purposes. Our server logs are automatically filtered to remove sensitive data and are permanently deleted after 7 days. These logs do not contain client IP addresses unless there is an attempt to circumvent our Cloudflare security layer. Access to logs is strictly limited to debugging and security purposes. We maintain no means of connecting this data to individual identities, which applies to both our customers and third-party visitors. We employ Cloudflare’s services for platform security and content delivery network (CDN) functionality. Payment Processing For payment processing, Tinylytics utilizes Lemon Squeezy. For legacy payments, we use Paddle. Please refer to their respective privacy policies for detailed information. We do not store or maintain any credit card information on our servers. Security Measures We implement comprehensive security measures to protect against unauthorized access, alteration, or misuse of your information. All data transmission is secured using SSL encryption. Platform security is enhanced through Cloudflare, providing protection against malicious activities. Third-Party Data Handling We maintain strict data privacy standards. Your data is never sold or shared with third parties, with the sole exceptions of essential debugging services and image delivery as specified above. We are committed to treating your data with the utmost respect and confidentiality. Analytics We use our own analytics solution exclusively on our homepage, demonstrating our commitment to privacy-first analytics. Cookie Usage We employ a single session cookie solely for maintaining your login state, which is automatically removed upon logout. This cookie serves no other purpose beyond providing essential service functionality."
