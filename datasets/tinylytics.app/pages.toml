["https://tinylytics.app/docs/showing_uptime"]
title = "Showing Uptime on Your Site | Tinylytics"
full_description = 'Showing Uptime on Your Site Once you’ve set up uptime monitoring for your site, you can easily display these statistics on your website. It’s a great way to showcase your site’s reliability! Setting Up Uptime Display 1. Modify Your Embed Script Add the uptime parameter to your embed script: https://tinylytics.app/embed/YOUR_EMBED_CODE.js?uptime Combining with Other Features You can combine uptime with other features: # With hit counter https://tinylytics.app/embed/YOUR_EMBED_CODE.js?hits&uptime # With hits and kudos https://tinylytics.app/embed/YOUR_EMBED_CODE.js?hits&kudos&uptime Implementation Adding the Uptime Display Add this HTML element where you want to show your uptime: <span class="tinylytics_uptime"></span> Important Notes: - Create only one uptime element per page - The script will automatically populate it with your uptime data - Uptime monitoring is available for paid accounts only Example Here’s how it looks in action: 💯🔥✅ Tips Place the uptime display in your footer or status page Combine with hit counters for more comprehensive stats Great for business sites to show reliability Perfect for SaaS products and professional services Plan Features Free Plan: No uptime monitoring Paid Plans: Full uptime monitoring and display capabilities'
