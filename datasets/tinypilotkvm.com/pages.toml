["https://tinypilotkvm.com/faq/enable-audio"]
title = "How can I stream audio from the target computer? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow can I stream audio from the target computer? Note: Audio streaming is only available on TinyPilot Voyager 2a models. If your target computer plays audio, TinyPilot can stream the remote system's audio through your browser. This page explains how to configure your TinyPilot for audio streaming and how to troubleshoot issues when audio isn't working. Enabling audio streaming Audio streaming is only available when TinyPilot is in H.264 streaming mode. You can check your TinyPilot's current streaming mode using the streaming mode indicator on the bottom left-hand corner of the TinyPilot web interface: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/mjpeg-tip.9fa36e9.f60347a51d7be26d73da0a8352fa7a21.png" width="654" alt="TinyPilot's web interface shows a target machine's desktop and the streaming mode indicator tool-tip in MJPEG mode."> To enable audio, configure your video settings to use H.264 streaming mode: Go to System > Video Settings in the TinyPilot web interface. Click the "Streaming Mode" dropdown. Set the streaming mode to H.264. Click "Apply". <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/enable-h264.2655f1b.1ccf5857853f331f2c213a29ebc8c7be.png" width="1728" alt="TinyPilot's video settings menu. The 'Streaming Mode' dropdown highlights the H.264 option"> Troubleshooting audio issues If you can't hear any audio after switching to H.264 streaming, try the following troubleshooting steps: Check your target machine's output device For TinyPilot to capture audio, your target machine must output sound via HDMI. Check that your target machine is using HDMI as its sound output device. The process of changing the output device varies by operating system, but you can usually find the sound output options in your computer's system settings under "Sound". Go to your sound settings, select "Output", and then select "HDMI". <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/output-hdmi.2665e34.4445813b2d20fb932fd083faa525af0c.png" width="1920" alt="A settings window displays the computer's sound options. A cursor is selecting 'HDMI' as the output device."> Verify that your target machine plays audio If you're unable to hear sound through TinyPilot's web interface, it could be because the target machine isn't producing audio at all. To test whether the target machine is producing audio: Disconnect your TinyPilot from your target machine. Verify that audio is unmuted on your target machine. Verify that volume is turned to an audible level on your target machine. Open a video or music file on the target machine. If you can hear sound on your target machine with TinyPilot disconnected, reconnect TinyPilot and re-verify muting and volume settings. Verify that your client machine plays audio TinyPilot may fail to produce audio due to volume settings on your client system, the device from which you're viewing TinyPilot in the browser. To test audio on your client sytem: Verify that audio is unmuted on your client system. Verify that volume is turned to an audible level on your client system. Open a video or music file on your client system. Check for muting in your browser If your browser tab shows a speaker icon with a line through it, it means that the tab is muted: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-muted.6f92103.e81191dfc05785415751a0fea565c2a7.png" width="1032" alt="A red arrow points to the TinyPilot tab with a muted speaker icon."> Unmute by right-clicking on the tab for the tab's menu, then click "Unmute". <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-unmuted.6f92103.0d67bb5affc1f5e815d7072d52fd22a7.png" width="1032" alt="A red arrow points to the TinyPilot tab with a (now unmuted) speaker icon."> Check your browser's autoplay settings If you're unable to hear sound from your target computer, your browser may be preventing TinyPilot from playing audio. Check that your browser's settings allow audio playback. On Chrome: Go to chrome://settings/content/sound. Check that https://tinypilot is listed in the "Allowed to play sound" section. If the domain isn't listed, click "Add" in the "Allowed to play sound" section. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/chrome-audio-settings1.2665e34.70802cff3ac64d2ba176d97e56f2b050.png" width="1920" alt="A Chrome window is open on the sound settings page. A red arrow points to an 'Add' button to add a site that is allowed to play sound."> Enter your TinyPilot's URL and click "Add." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/chrome-audio-settings2.2665e34.ee34940e1602709c3068ff0dac9b9e2d.png" width="1920" alt="A Chrome window is open on the sound settings page. A TinyPilot URL is begin added to an overlayed text box. Red arrows point to the URL and the 'Add' button."> On Firefox: Click on the Autoplay permissions settings button on the left side of the address bar (autoplay must be supressing audio or video to see these settings). From the dropdown menu, select "Allow Audio and Video." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/firefox-audio-settings.8bdc266.c8a0b91a789120aa5bafac13bf86aa04.png" width="1524" alt="A Firefox window is open and focused on the address bar. A red arrow points to the button for managing site permissions next to the address bar. The autoplay permissions box is open, and the Autoplay dropdown lists the available permissions. A second red arrow points to 'Allow Audio and Video.'"> Interact with the webpage Browsers don't play audio until you’ve interacted with the webpage. When debugging audio issues by reloading the webpage, you may not hear any sound until you click somewhere on the page. Disconnect and reconnect your HDMI cable A faulty connection can prevent audio from streaming through the HDMI cable. If previous steps have not restored audio, try disconnecting and reconnecting the HDMI cable from both the TinyPilot device and the target computer. Try browsing without extensions Web browser extensions may interfere with audio playback functionality. Try a different browser without extensions, or use your browser's incognito or private browsing mode. This will tell you whether the audio issues are related to a browser extension. Check TinyPilot's streaming mode If you configured TinyPilot to use H.264 streaming mode, it's possible that H.264 streaming will fail over to MJPEG mode, which will prevent audio from streaming. Check for a warning in TinyPilot's status bar about an H.264 streaming failure: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/h264-fail.2f2d982.cffd6fb644a1a2be6ef3feb4e9e937af.png" width="650" alt="TinyPilot's web interface shows a target machine's desktop and the streaming mode indicator tool-tip in MJPEG mode along with a warning icon showing that H.264 failed to capture a video output."> If you see an H.264 failure, refreshing the browser page may fix the issue. macOS: Check additional audio settings If you can't hear audio from a macOS target, you may need to set your TinyPilot as the sound output device in the Control Center and the app you're using. Open the Control Center and expand the list of sound output devices by clicking on the AirPlay symbol: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/control-center.2e654da.0264a3b9d74bba09352f45a7dc750f3d.png" width="311" alt="The macOS Control Center is shown, with an arrow pointing to the AirPlay symbol."> Ensure that "TinyPilot" is the selected sound output device: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/control-center-devices.c620b0b.5f44cfff59fccef89e0d254fb6901454.png" width="312" alt="The macOS Control Center displays a list of sound output devices. 'TinyPilot' is selected."> If you still can't hear audio, check if the app you're using has its own sound output controls: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/apple-music.6b0a70f.6d313391fa4ce8af61860420db0f92c8.png" width="1229" alt="The Apple Music app is shown, with an arrow pointing to the AirPlay symbol."> If it does, ensure that "TinyPilot" is the selected sound output device. Still having issues? Create a new thread in our help forum with the following details: Make and model of your target device Operating system of your target device Model of your TinyPilot A log URL from your TinyPilot On the TinyPilot web interface, go to System > Logs, then click Get Shareable URL.'''
