["https://tinypilotkvm.com/product/tinypilot-power-connector"]
title = "TinyPilot Power Connector | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = "TinyPilot Power Connector Are you building a DIY TinyPilot with a Raspberry Pi? The TinyPilot Power Connector offers a low-cost way to build your own TinyPilot. We've retired the TinyPilot Power Connector in favor of the new, improved TinyPilot Voyager 2a. Shop TinyPilot Voyager 2aLicense Key: Where do I find my existing TinyPilot Pro license key? Total $34.99 Ships in 1-3 business daysInstant download Add To Cart The TinyPilot Power Connector splits the Raspberry Pi 4B's USB-C port into a power input and a data output. It offers a power switch that allows you to reset your TinyPilot or disconnect power without physically removing cables. Maintain full, continuous power The Raspberry Pi 4 requires 3 Amps of power for stable operation. A computer's USB port provides less than a third of that. The TinyPilot power connector allows you to connect your Pi to an external power source so it can receive the full 3 Amps it needs. The connector ensures that your Pi stays running even when the target computer shuts down. This allows TinyPilot to power down its target computer without risking an unplanned shutdown of its own power. Protect your hardware from power backflows Critically, the TinyPilot Power Connector prevents damage to your hardware. Without a device like the TinyPilot Power Connector that prevents reverse current, power can flow incorrectly between your devices and cause permanent damage to your Pi or your motherboard. Requirements 1x - USB-C to USB-A cable 2x - USB-A to microUSB cables Shipping Orders ship from North Carolina within three business days. International shipping is available via DHL, UPS, and USPS."
