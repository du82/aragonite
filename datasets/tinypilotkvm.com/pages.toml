title = "How do I remove the TinyPilot CA certificate? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I remove the TinyPilot CA certificate? .faq-content img { margin: 1rem; border: 1px solid black; } Note: These instructions apply only to TinyPilot Pro. The TinyPilot CA certificate establishes trust between your browser and your TinyPilot device. The private key for the TinyPilot CA certificate is stored on the device at /etc/ssl/private/tinypilot-ca.key. If your device's CA private key is ever compromised, you should uninstall the TinyPilot CA certificate from any machine where you installed it as a trusted certificate. Remove the TinyPilot CA certificate To remove the TinyPilot CA certificate, follow the instructions below your operating system: Windows Debian/Ubuntu macOS Windows Open the Start Menu. Type certmgr. Click "Manage computer certificates." Open "Trusted Root Certification Authorities > Certificates" in the left panel. Find "tinypilot-ca" in the right panel. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/win-tinypilot-ca.721e452.b554c3ba3687d391760b8a947e0ae526.png" width="701" alt="Screenshot of certificate manager showing Trusted Root Certification Authorities > Certificates in the left panel and tinypilot-ca selected in the right panel"> Right-click "tinypilot-ca" and select "Delete." Click "Yes" to confirm the deletion. Debian / Ubuntu From the terminal type, sudo dpkg-reconfigure ca-certificates. When prompted "Trust new certificates from certificate authorities?" select "no." Scroll to extra/tinypilot-ca.crt and press the Space key to deselect it. The certificate may alternatively have the name ca.crt. Press the Tab key to select Ok and hit Enter. Purge the certificate with sudo rm /usr/share/ca-certificates/extra/tinypilot-ca.crt. macOS From Finder, open "Applications" > "Utilities" > "Keychain Access." Select the "System" keychain. Find "tinypilot-ca" in the right panel. Right-click the "tinypilot-ca" entry and select "Delete." Click "Delete" to confirm the deletion. Reinstalling the TinyPilot CA To reinstall the TinyPilot CA, see "How do I fix browser privacy errors?"'''
year_published = 2025
