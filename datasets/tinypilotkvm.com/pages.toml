["https://tinypilotkvm.com/blog/whats-new-in-1-5-1"]
title = "What's New in TinyPilot 1.5.1 | TinyPilot"
description = "TinyPilot 1.5.1 is a minor release that adds stability improvements and enhancements to previous features."
full_description = '''What's New in TinyPilot 1.5.1Originally published June 15, 2021 Last updated TinyPilot 1.5.1 came out this week. This is a minor release that enhances the convenience of existing features and improves overall stability. Load virtual disk drive from URL The major new feature of TinyPilot's last release was virtual disk mounting. It allows you to upload a .iso or .img file from your client device and then present it as a removable USB drive to your target computer. Uploading images from your client worked fine, but what if you don't already have the image locally? You have to download it from the Internet onto your client machine, then upload it from your client machine to your TinyPilot. It felt convoluted to download a file to one device and then upload it to another, so we added a second option: download from URL. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/download-from-url.eaeab81.85e98f0c043b70e3542b11575f913d9c.png" width="864" alt="Screenshot of download from URL interface"> When you specify an image URL, TinyPilot downloads the file and adds it to its virtual disk inventory. The demo below shows a user downloading the latest Ubuntu server image directly from a remote URL. Sorry, your browser doesn't support embedded videos. Pro feature: The virtual storage feature is available exclusively in TinyPilot Pro, which is included with all TinyPilot hardware packages. Use .local domains securely TinyPilot uses a custom certificate authority that allows your browser to secure its connection to your TinyPilot. When you visit https://tinypilot/, the address bar shows a lock sign, indicating that the browser authenticated the TLS connection and encrypted it end-to-end. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tls-lock.72c3ce3.bd701ec750a997011a6be5c4cdc5a122.png" width="321" alt="Screenshot of lock symbol in address bar for https://tinypilot address"> Before this release, the TLS security indicator only worked for the https://tinypilot/ address. If your network added suffixes for local hosts like tinypilot.local or tinypilot.localdomain, your browser would flag the connection as insecure. In the newest release, TinyPilot's TLS certificate supports Subject Alternative Names for common local DNS suffixes: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-sans.42b425e.9fbb4ec2e17e772dbbbf0f942f45a5e7.png" width="405" alt="Screenshot of Subject Alternative Names in TinyPilot certificate showing DNS Name=tinypilot, DNS Name=tinypilot.local, DNS Name=tinypilot.localdomain"> Support for Subject Alternative Names means that you can access your device using any of the following addresses, and TLS will still work as expected: https://tinypilot https://tinypilot.local https://tinypilot.localdomain <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/secure-local.eaffd7b.efbd587be2b26826aebf5d04970168d0.png" width="453" alt="Screenshot of local symbol in address bar for https://tinypilot.local address"> Want to use a different hostname than tinypilot? No problem! You can use the System > Hostname feature to rename your device. TinyPilot will automatically update its TLS certificate to match the new name. Pro feature: HTTPS is available exclusively in TinyPilot Pro, which is included with all TinyPilot hardware packages. Bugfixes and improvements In addition to these enhancements, TinyPilot adds several stability improvements and bugfixes: Adds a "reset to defaults" option to the video settings dialog and improves its UI Improved robustness and error detection during updates Fixed a bug that prevented modifier keys from registering during mouse clicks Improved compatibility for TinyPilot's virtual mouse feature Add temperature and throttling checks to TinyPilot's diagnostic script Updating to TinyPilot 1.5.1 You can update to the latest version of TinyPilot by clicking System > Update in the navigation bar: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/update-button.46a4be9.adaafa145431fa30f5e653b76e09494d.png" width="537" alt="The update button is located in the navbar under System"> Don't see an update option? For older versions of TinyPilot, SSH into your device and update with the following command: /opt/tinypilot/scripts/upgrade && sudo reboot Users of the free, Community Edition of TinyPilot can upgrade to Pro to take advantage of the new premium features. Written by Michael Lynch, TinyPilot Founder and CEO'''
year_published = 2021
year_updated = 2021
