["https://tinypilotkvm.com/blog/whats-new-in-1-4"]
title = "What's New in TinyPilot 1.4.0 | TinyPilot"
description = "TinyPilot v1.4.0 includes many new features, including easy updates, support for multiple TinyPilots, and accessible logs."
full_description = '''What's New in TinyPilot 1.4.0Originally published March 9, 2021 Last updated I'm pleased to announce the release of TinyPilot Community Edition 1.4.0 and TinyPilot is 2.1.0. This release includes several new features that make TinyPilot more convenient and easier to use. Easy updates Previously, TinyPilot made software updates harder than they needed to be. The app didn't show you information about when an update was available or how to install it. Starting in 1.4.0, you can update TinyPilot right from the web interface. Now, it's easy to keep up with the latest new features, bugfixes, and security updates. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/update-tinypilot.e0c5b99.838e353ba86e3999d90b8a0d33e41d0f.gif" width="1024" alt="Screen capture of TinyPilot initiating an update"> Simple device renames If you're running multiple TinyPilot nodes on the same network, each one needs a different hostname. By default, TinyPilot devices ship with the name tinypilot, but we've made it easy for you to change it. From the System menu, you can now update your device's hostname. The process will rename your device, update all necessary TLS certificates, and redirect you to the device's new URL. Sorry, your browser doesn't support embedded videos. Accessible logs Need help diagnosing an issue with your device? Previously, the only way to view your debug logs was from the command line. With TinyPilot 1.4.0, diagnostic information about your TinyPilot is available right from the web dashboard. If you want to share your logs in TinyPilot's help forum, you can upload your logs to a shareable URL in just one click. Sorry, your browser doesn't support embedded videos. Acknowledgements This release would not be possible without the hard work of TinyPilot's newest team members: Jan Heuermann and Jason Wallace. Thanks also to our open-source contributors WarheadsSE, tretinha, and invrainbow. Updating to TinyPilot 1.4.0 Running an earlier version of TinyPilot? Upgrading is easy. SSH into your TinyPilot, and run the following bash commands: /opt/tinypilot/scripts/upgrade && sudo reboot After this update, you'll be able to perform all future updates right from the web app. Written by Michael Lynch, TinyPilot Founder and CEO'''
