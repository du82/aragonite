["https://tinypilotkvm.com/faq/change-edid"]
title = "How do I change my TinyPilot's EDID? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I change my TinyPilot's EDID?In order to capture display output from your devices, TinyPilot sends a standard message called an EDID through the HDMI port. The EDID tells other devices what video resolutions and refresh rates TinyPilot recognizes. If your TinyPilot web interface displays a "No Signal" message and TinyPilot's display troubleshooting steps haven't resolved the issue, TinyPilot's alternate EDID might fix the problem. TinyPilot’s alternate EDID uses modified settings that may allow TinyPilot to capture display from devices that fail to interact with TinyPilot's default EDID. Differences from TinyPilot's default EDID TinyPilot's alternate EDID makes the following additional display settings available to the target machine: Resolution Refresh rates (Hz) 1680x1050 60 1440x900 75 1368x776 60 720x576 50 720x400 70 TinyPilot's alternate EDID also presents the product name as Toshiba-H2C instead of TinyPilot. Your target machine's display and audio device settings may show this product name as a device identifier. Using TinyPilot's alternate EDID To change to TinyPilot's alternate EDID, SSH into your TinyPilot, and then run the following commands: EDID="/home/ustreamer/edids/tc358743-edid.hex" # Back up original EDID cp --no-clobber "${EDID}" ~/tc358743-edid.hex.bak # Set the new EDID echo -ne "" | sudo tee "${EDID}" && \ echo '00ffffffffffff0052627698008888882d1e0103' | sudo tee -a "${EDID}" && \ echo '800000781aee91a3544c99260f5054ffef8081c0' | sudo tee -a "${EDID}" && \ echo '8140810081809500a9c081406140271f80f07138' | sudo tee -a "${EDID}" && \ echo '164038c0350000000000001e000000fa00b30095' | sudo tee -a "${EDID}" && \ echo '0f8cc00100010001000a000000fc00546f736869' | sudo tee -a "${EDID}" && \ echo '62612d4832430a20000000fd00185a125010000a' | sudo tee -a "${EDID}" && \ echo '2020202020200195020320f14d010204131f2021' | sudo tee -a "${EDID}" && \ echo '223c3d3e12032309070766030c00300080e2007f' | sudo tee -a "${EDID}" && \ echo '0000000000000000000000000000000000000000' | sudo tee -a "${EDID}" && \ echo '0000000000000000000000000000000000000000' | sudo tee -a "${EDID}" && \ echo '0000000000000000000000000000000000000000' | sudo tee -a "${EDID}" && \ echo '0000000000000000000000000000000000000000' | sudo tee -a "${EDID}" && \ echo '00000000000000000000000000000075' | sudo tee -a "${EDID}" && \ sudo v4l2-ctl --device=/dev/video0 --set-edid=file="${EDID}" --fix-edid-checksums Reverting EDID changes To restore TinyPilot's default EDID, SSH into your TinyPilot, and run the following commands: EDID="/home/ustreamer/edids/tc358743-edid.hex" sudo cp ~/tc358743-edid.hex.bak "${EDID}" && \ sudo chown ustreamer:ustreamer "${EDID}" && \ sudo v4l2-ctl --device=/dev/video0 --set-edid=file="${EDID}" --fix-edid-checksums'''
year_published = 2025
clearnet = "https://tinypilotkvm.com/faq/change-edid"
