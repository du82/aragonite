["https://tinypilotkvm.com/instructions/voyager2a/v2"]
title = "Voyager 2a Quick Start Instructions | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''Voyager 2a Quick Start InstructionsStep 1: Attach Ethernet cable Connect an Ethernet cable to your Voyager 2a's Ethernet port. Connect the other end of the Ethernet cable to your network router or switch. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-ethernet-cable.b1f4eea.a19249f8e9729baf5351c18404c02f6e.jpg" width="1600"> Step 2: Attach power cable If you purchased the TinyPilot Voyager 2a with PoE, you can skip this step. Connect the AC to USB-C power adaptor to a power outlet. Connect the USB-C cable from the power adaptor to the USB-C port labeled "POWER" on the TinyPilot Voyager 2a device. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-power-outlet.75e41ba.ecd9c18f2cdce6f7571413c93b5e26e1.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-usb-c-power.b1f4eea.8ce0fb2b7dfbc11b29625e07daf67873.jpg" width="1600"> Step 3: Verify status lights If everything is connected correctly, you should see Voyager 2a's status LED lights turn on: The power LED should shine a solid red. The disk activity LED will flash green intermittently as the device runs. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-led-lights.b1f4eea.d4c5c92f685df644359a9160816da53c.jpg" width="1600"> Step 4: Attach USB data cable Use the USB-C to USB-A cable to connect the Voyager 2a to your target computer. Connect the USB-C end (rounded) of the cable to the USB-C port labeled "DATA" on the TinyPilot Voyager 2a device. Connect the USB-A end (rectangular) of the cable to a USB port on your target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-usb-c-data.b1f4eea.5a3ac55d51adfd9b93f9087c27823672.jpg" width="1600"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-usb-c-data-pc.b1f4eea.fc9d47d1fb25baef901c24a7be8dcc9d.jpg" width="1600"> Step 5: Connect VGA to HDMI adaptor (Optional) This step only applies if you purchased a VGA adaptor for a target system with no HDMI output. Connect the VGA adaptor to your computer's VGA display output. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-vga-to-hdmi-1.b1f4eea.4e9daeca4f5eb4a4f0497d978ca830c7.jpg" width="1600"> Use the 3.5mm audio cable to connect your computer's audio output port to the VGA adaptor's audio input port. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-vga-to-hdmi-2.b1f4eea.90462adac767f79e41aa12a737e4432f.jpg" width="1600"> Use the 30-inch black USB-A to microUSB cable to connect the VGA adaptor to any available USB port on your computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-vga-to-hdmi-3.b1f4eea.e8328fa3c72f1129694eadb677bf0fa6.jpg" width="1600"> Step 6: Connect the HDMI cable Connect the HDMI cable to the HDMI input port on the Voyager 2a. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-insert-hdmi.b1f4eea.44991f7e9aebb706894e4eaabece37b8.jpg" width="1600"> Connect the other end of the HDMI cable to the output display port of the target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-hdmi-server.b1f4eea.c83e89ca7f0582b9732d14cb1108214d.jpg" width="1600"> Depending on the target computer's output, you can use a HDMI to HDMI cable, a DisplayPort to HDMI cable, or a DVI to HDMI cable. Step 7: Access the TinyPilot web interface Your first boot will take up to five minutes. You may see the web interface restart as TinyPilot generates new, unique TLS keys for your device. With your TinyPilot booted, you can now access the TinyPilot web interface from any device on your local network by visiting one of the following URLs: https://tinypilot/ https://tinypilot.local/ https://tinypilot.localdomain/ The first time you visit the TinyPilot web interface, you'll see a privacy error because TinyPilot establishes a secure connection, but your system doesn't recognize the server yet. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-privacy-error-1.41e7f26.822ecc36aa9999c4d8c1e23d3b1cfbca.png" width="967"> You can safely ignore this warning and proceed to TinyPilot. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-privacy-error-2.41e7f26.411823f08496b4b1904dc525de546323.png" width="967"> After you resolve the privacy error, you will be able to access the TinyPilot web interface. To fix the privacy error permanently, see Fix Privacy Error instructions. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-v2-web-interface.4298124.bef004c63c9087d48411792e57df85f3.webp" width="1316"> Your target computer's display output should display in the browser. TinyPilot forwards any keystrokes you enter to the target machine. Step 8: Turn on user authentication If your TinyPilot connects to a shared network or is accessible over the Internet, you should turn on user authentication. This will help restrict access to your TinyPilot's web interface to authorized users only. To set up user authentication, navigate to System > Security in TinyPilot's menu then toggle the "Require username and password" switch to on. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/security-settings.b1f4eea.c6cace143b996ccb033fe8df1a275586.png" width="1600"> Enter your choice of username and strong password in the dialog box, and click the "Add User" button. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/user-auth.b1f4eea.54634adb1dff1e5bbaa87e8699961e96.png" width="1600"> You can set up multiple users by clicking the "Add User" button in the Security Settings dialog. Questions? Feedback? How'd installation go? If you're interested in next steps, the TinyPilot FAQ will help guide you through the most common questions people have about using TinyPilot. If you have any questions or feedback about your TinyPilot, we'll be happy to help you in the support forum.'''
