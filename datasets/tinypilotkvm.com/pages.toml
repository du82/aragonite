full_description = '''PiKVM vs. TinyPilot Voyager 2aLooking for a user-friendly alternative to PiKVM? Look no further than the TinyPilot Voyager 2a. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-back.75e41ba.6bec01b99be5a8f24851c2e624ec41d5.webp" width="1200" alt="Voyager 2a back view"> The TinyPilot Voyager 2a and PiKVM are both KVM over IP devices, but they offer starkly different experiences. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2a-front.75e41ba.7d544f3324811a9d97d55f8b54322573.webp" width="1200" alt="TinyPilot Voyager 2a front view"> The TinyPilot Voyager 2a ships in a sleek metal case. TinyPilot prioritizes ease of use From day one, TinyPilot's top priority has been user experience. TinyPilot features a powerful web interface that allows you to control every feature of your device directly from the browser. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-bios-menu.ca13802.39b16e933c602e67ee498e1c03206122.png" width="1503"> PiKVM prioritizes breadth of features over ease of use. Many of PiKVM's features are not available through the web UI. Instead, the user must search online for command-line instructions and configuration file formats to achieve what they need. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pikvm-ezcoo.3fb7b9b.482d0fe939f0d18a9a878b1a3c6c0376.png" width="845" alt="Adding UI elements to control the KVM switch"> TinyPilot is fully plug 'n play To exercise the full functionality of PiKVM, users must install a custom circuit board on top of their motherboard and re-route their power supply's ATX pins. .img-has-border img { border: 1px solid gray; } <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pikvm-install-instructions.7e8556a.a9f5982f13cf3c6732b1c0e0b06990b8.webp" width="778" alt="Screenshot of PiKVM installation documentation showing the user connecting ATX pins from their PiKVM to their motherboard"> PiKVM's installation involves modifying the ATX connections on your motherboard. To install TinyPilot Voyager 2a, just plug in three cables. No motherboard surgery required. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/just-three-cables.2671d65.05f49409bb5b748021e3dc3fead166c7.webp" width="900" alt="Screenshot of PiKVM installation documentation showing the user connecting ATX pins from their PiKVM to their motherboard"> TinyPilot requires just three simple cables and is fully plug 'n play. TinyPilot provides professional, comprehensive support TinyPilot offers a searchable support forum, and we answer most questions within hours. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-support.286da2b.809d5a711b955110f649955232b24ae9.png" width="1510" alt="Screenshot of TinyPilot help forum"> TinyPilot offers customers technical support in a searchable help forum. In addition to our support forum, TinyPilot offers easy private email support through our contact page. PiKVM has no public help forum and does not offer email support. Instead, PiKVM has a support channel on their Discord chat server, which is not organized or easily searchable. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pikvm-support.286da2b.6f1ca8fd023d0cb1160235ffb6dc2d94.png" width="1510"> PiKVM only offers customer support via Discord chat. PiKVM sells its hardware through a network of independent distributors. If you have an issue, will you contact PiKVM or the distributor? When you purchase from TinyPilot, you can contact a single team for all of your questions. We take responsibility for the full experience, including shipping your device to you, making sure you get up and running, and answering any questions as you use TinyPilot on a day-to-day basis. Feature comparison TinyPilot Voyager 2a PiKVM v3 Illustrated installation instructions ✔️Available online ❌ HTML5 interface ✔️ ✔️ BIOS-level access ✔️ ✔️ Video capture ✔️ ✔️ Keyboard capture ✔️ ✔️ Mouse capture ✔️ ✔️ Full-screen mode ✔️ ✔️ Paste from clipboard ✔️ ✔️ Password-based authentication ✔️ ✔️ Wake-on-LAN ✔️ ✔️ Power over Ethernet (PoE) ✔️ ❌ Update from web UI ✔️ ❌ ATX power control ❌ ✔️ VNC support ❌ ✔️ Mount virtual drives ✔️ ✔️ Serial interface ❌ ✔️ Cloud access ✔️With third-party tools ✔️With Tailscale Support Help forum, Support email Discord chat Base OS Raspberry Pi OS (Debian) Custom ArchLinux build Video streaming formats MJPEG, H.264 MJPEG, H.264 Video Latency 100-140ms 100-140ms Video resolution 1920x1080 1920x1080 Order Now'''
