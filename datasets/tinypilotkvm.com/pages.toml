["https://tinypilotkvm.com/instructions/voyager/v4"]
title = "Voyager Installation Instructions | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''Voyager Installation Instructions Warning: These instructions are for the legacy Voyager 1 product.See our updated instructions for setting up a new TinyPilot Voyager 2 device. The instructions below walk you through connecting your Voyager and preparing it for use. Step 1: Install the power connector Connect the USB-C port on the Voyager to the USB-A port on the TinyPilot Power Connector using the 6-inch USB-C to USB-A cable. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-power-connector-usb-c.75e41ba.392577971a909cf7899bb6e1c544391e.jpg" width="1200"> Connect a microUSB to USB-A cable to the port labeled "PWR" on the TinyPilot Power Connector. Connect the other end to the USB to AC adaptor, and plug it into a power outlet. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-power-microusb-power.75e41ba.28294c8ca5a291fc0e957a66e29e18bc.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-power-microusb-ac.b1f4eea.9e2264d1e48d0dace7443b70dd12a815.jpg" width="1600"> Flip on the power switch (slide it toward the "TINYPILOT" label). If it's properly receiving power, the green LED will light up. Connect a microUSB to USB-A cable to the port labeled "Data" on the TinyPilot Power Connector. Connect the other end to a USB port on your target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-power-microusb-data.75e41ba.d086d1f5c1b38ed7aa255955dc0d203c.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/usb-cable-to-computer.75e41ba.ef6f05356cbeaf5ca12c68e5ca8035d5.jpg" width="1200"> If everything is connected correctly, you should see Voyager's power LED shine a solid red. The disk activity LED will flash green intermittently as the device runs. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-led-lights.75e41ba.f1b6729641b844d9b55e58530039fa2e.jpg" width="1200"> Step 2: Connect the VGA to HDMI adaptor (Optional) This step only applies if you purchased a VGA adaptor for a target system with no HDMI output. Connect the VGA adaptor to your computer's VGA display output. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-vga-to-hdmi-1.75e41ba.a644f7e738ad8d1b658df3c04e67e377.jpg" width="1200"> Use the 30-inch black USB-A to microUSB cable to connect the VGA adaptor to any available USB port on your computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-vga-to-hdmi-2.75e41ba.a7efe43040e56782fced18452905a07f.jpg" width="1200"> Step 3: Connect the HDMI cable Connect an HDMI cable to the HDMI input port on the Voyager. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-insert-hdmi.75e41ba.6b85211d6080947bb6f5ba869a2ab99d.jpg" width="1200"> Connect the other end of the HDMI cable to the output display port of the target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-hdmi-server.b1f4eea.d026366ec611949a11a597b6fc0985be.jpg" width="1600"> Depending on the target computer's output, you can use a HDMI to HDMI cable, a DisplayPort to HDMI cable, or a DVI to HDMI cable. Step 4: Attach an Ethernet cable Connect to your local network by connecting an Ethernet cable to the Voyager's Ethernet port and connect the other end to your network router or switch. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-ethernet-cable.b1f4eea.ef759bc817a5c90777fa44ff65e3abf2.jpg" width="1600"> Step 5: Access the TinyPilot web interface Your first boot will take up to five minutes. You may see the web interface restart as TinyPilot generates new, unique TLS keys for your device. With your TinyPilot booted, you can now access the TinyPilot web interface from any device on your local network by visiting one of the following URLs: https://tinypilot/ https://tinypilot.local/ https://tinypilot.localdomain/ The first time you visit the TinyPilot web interface, you'll see a privacy error because TinyPilot establishes a secure connection, but your system doesn't recognize the server yet. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-privacy-error-1.41e7f26.822ecc36aa9999c4d8c1e23d3b1cfbca.png" width="967"> You can safely ignore this warning and proceed to TinyPilot. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-privacy-error-2.41e7f26.411823f08496b4b1904dc525de546323.png" width="967"> After you resolve the privacy error, you will be able to access the TinyPilot web interface. To fix the privacy error permanently, see Fix Privacy Error instructions. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-v4-web-interface.a5b406b.6b948cfc24d84fe6f786e0de5f454930.png" width="1596"> Your target computer's display output should display in the browser. TinyPilot forwards any keystrokes you enter to the target machine. Step 6: Change SSH credentials TinyPilot's default credentials are: Username: pilot Password: flyingsopi For security, you should connect to TinyPilot through SSH and run passwd to update your password. Questions? Feedback? How'd installation go? If you have any questions or feedback about your TinyPilot, we'll be happy to help you in the support forum.'''
year_published = 2025
