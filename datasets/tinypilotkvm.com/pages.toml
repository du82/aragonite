["https://tinypilotkvm.com/blog/dslr"]
title = "Using TinyPilot to Control a DSLR Camera | TinyPilot"
description = "TinyPilot partnered with SpaceRex to build a prototype device that allows you to fire a camera shutter right from your browser."
full_description = '''Using TinyPilot to Control a DSLR CameraOriginally published April 30, 2021 Last updated Back in February, Will Yarborough published a review of TinyPilot on his YouTube channel, SpaceRex. Ever since then, we've been talking about other ways TinyPilot and SpaceRex could collaborate. Will is a photography enthusiast and uses a variety of DSLR cameras for his YouTube channel. But he was frustrated at the tools available for controlling his cameras remotely. Some camera manufacturers offer remote management software, but the connection is often flaky, and the stream lags badly. Worse, each solution is manufacturer-specific, so you need a different tool for each camera. Could TinyPilot control a camera? Will wondered if we could modify a TinyPilot to control all of his cameras. It seemed like it should work in theory. HDMI output is nearly universal on DSLR cameras, so we could capture video the same way we do with computers. Tons of third-party manufacturers make accessories for controlling camera shutters, and the electronics are simple. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/remote-shutter.a5aea3c.88ef5857d0ec8261d0d08df67e94812a.jpg" width="436" alt="Voyager side view"> On the software side, we wouldn't have to change much of TinyPilot's functionality. Obviously, a camera has no need for logic that controls a keyboard and mouse. I could tear that out and replace it with buttons to control the camera's focus and shutter. And because TinyPilot is built on the Raspberry Pi, it already has the hardware necessary to interface with electronic components. Early versions I created an experimental branch of TinyPilot for this project and shared it with Will. I don't own a DSLR, so I had no idea if this code would even work. A few days later, Will sent me the video below. He had ripped apart his poor Voyager to access the GPIO pins and connected it to a simple circuit he had rigged up. It worked! He could fire his camera shutter from his browser: Sorry, your browser doesn't support embedded videos. With a bit more tinkering, Will had a complete solution. His camera's viewfinder appeared crystal clear in his browser, and he could activate the shutter from anywhere on his network: Sorry, your browser doesn't support embedded videos. Build a DSLR TinyPilot Will published a video yesterday demonstrating his complete solution. It shows more of TinyPilot controlling a camera and teaches you to build your own DIY version: Written by Michael Lynch, TinyPilot Founder and CEO'''
year_published = 2021
year_updated = 2021
clearnet = "https://tinypilotkvm.com/blog/dslr"
