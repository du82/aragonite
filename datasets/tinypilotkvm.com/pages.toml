["https://tinypilotkvm.com/blog/whats-new-in-2024-10"]
title = "What's New in TinyPilot's October 2024 Update | TinyPilot"
description = "TinyPilot's October release allows you to manage your device's Wi-Fi connection, view its network status, and control your target machine's mouse programmatically."
full_description = '''What's New in TinyPilot's October 2024 UpdateOriginally published October 21, 2024 Last updated TinyPilot's October release allows you to manage your device's Wi-Fi connection, view its network status, and control your target machine's mouse programmatically. Manage TinyPilot's Wi-Fi connection While most people connect their TinyPilot to the network using Ethernet, a Wi-Fi connection is more convenient if you move your TinyPilot between machines in different locations on the same network. You can now configure and manage your TinyPilot's Wi-Fi connection directly using the TinyPilot web interface under the new "Wi-Fi" menu. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/wifi-dialog.3b03c43.792056b3591473984e05bc9c39d46293.png" width="1600" alt="TinyPilot's Wi-Fi credentials dialog. There are text boxes for the network name and password. A drop down menu shows the country set to 'United States (US)'. There are buttons to remove, save or close the dialog box."> Configuring a Wi-Fi network. Your TinyPilot will automatically connect to a configured Wi-Fi network if it's available, allowing you to access the TinyPilot web interface and control a target machine without a physical network connection. This is especially useful for immediate connectivity if you set up Wi-Fi credentials before deploying your device remotely. View TinyPilot's network status Alongside Wi-Fi configuration, this month's update introduces a new "Network Status" view to help monitor your TinyPilot's network connections. The Network Status lists the connection status, IP address, and MAC address of your TinyPilot's Ethernet and Wi-Fi interfaces so you can quickly validate network configurations and avoid unnecessary downtime. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/network-dialog.3b03c43.e24004da1d3e665654adbe1cbc578e76.png" width="1600" alt="TinyPilot's 'Network Status' dialog shows a healthy Ethernet and Wi-Fi connection along with the IP address and MAC address of both interfaces."> Control TinyPilot's mouse programmatically TinyPilot's REST API allows you to create custom integrations to programmatically enter keypresses and take screenshots. In this month's release, TinyPilot's REST API introduces mouse control with the new mouseEvent endpoint, allowing you to move your target machine's cursor, use the mouse wheel, and click. Sorry, your browser doesn't support embedded videos. Navigating tinypilotkvm.com using the REST API and the new mouseEvent endpoint. With the new API endpoint, you can automate more processes with TinyPilot, like clicking through installation wizards and UI testing. For more information on TinyPilot's new mouseEvent API, see our API documentation. Note: TinyPilot's REST API requires a TinyPilot Enterprise subscription. To purchase an Enterprise license, contact enterprise@tinypilotkvm.com. Full changelog For the full list of changes in TinyPilot Pro 2.6.5, see the changelog. Updating to the latest version You can update to the latest version of TinyPilot by clicking System > Update in the navigation bar: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/update-button.7428ecd.1d8c3c11550c6f6d643211fe135cc2d4.png" width="1583" alt="The update button is located in the navbar under System"> Written by Dave Brown, TinyPilot Support Engineer'''
