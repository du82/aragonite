title = "What's New in TinyPilot 1.1 | TinyPilot"
description = "TinyPilot v1.1 includes many new features, including mouse integration, fullscreen mode, and paste from clipboard."
full_description = '''What's New in TinyPilot 1.1Originally published October 2, 2020 Last updated TinyPilot recently reached its v1.1 milestone, which includes many exciting new features. Mouse integration Mouse integration was, by far, the most common feature that users requested for TinyPilot. Tons of TinyPilot customers manage Windows machines, where navigation without a mouse is burdensome. TinyPilot now captures mouse input and forwards it to the target machine! <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/mouse.e8634cb.ca4c24c900084d01753d84117ac61322.gif" width="1183" alt="Screen capture of TinyPilot forwarding mouse input to perform a Google search"> Performance is quick on a local network. If you're accessing TinyPilot over a slow connection, it will automatically throttle down mouse sensitivity to avoid flooding your connection with excessive mouse chatter. Fullscreen mode Want to make your local computer feel just like your remote machine? Fullscreen mode lets you break your remote screen out of the browser window, creating an immersive experience on your local display. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/fullscreen.3b03c43.ccc71f27bac1e8a9c39d5da281ecbc80.png" width="1600" alt="Screenshot of TinyPilot in fullscreen mode"> Big thanks to @djclueless for contributing this feature, which often makes me forget I'm even typing on a remote server. Paste text from clipboard Many TinyPilot users keep their passwords in a password manager. Without the ability to paste text, they were forced to type out long, random passwords by hand. Not fun. Supporting clipboard pasting is more complex than it would seem. For security reasons, browsers strictly limit web applications from accessing the clipboard. It's possible to overcome this limitation with browser plugins or ::shudder:: Java applets, but I want to keep TinyPilot lightweight, performant, and easy to use. @pwcazenave and I worked together to find a solution in pure JavaScript. From the command menu, you can now click "Paste" and then paste text from your clipboard. TinyPilot will replicate that text on the remote machine. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/paste.e8634cb.262b9ddb32bea2724dce411f4a80d625.gif" width="1183" alt="Screen capture of using the paste feature to paste a password into Twitter's login screen"> TinyPilot's paste feature makes it easy to copy passwords or other forms of text between your local machine and your remote device. AZERTY support One of my customers in France reached out to ask if TinyPilot could support the French-style AZERTY keyboard layout. I had never used an AZERTY keyboard, so I picked one up off Amazon and started experimenting. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/azerty-keyboard.3b03c43.0c0813fbedd76e1a77ece8ea98c35ab1.jpg" width="1600" alt="Photo of my AZERTY keyboard"> TinyPilot originally assumed a US-style QWERTY keyboard layout. After a few days of tinkering, I reorganized TinyPilot's code to support configurable keyboard layouts. So far, TinyPilot only supports QWERTY and AZERTY, but it should be fairly straightforward to support additional keyboard types in the future. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/azerty-support.0d06865.f58f511852e1fb80a73c188f1318e810.png" width="1164" alt="Screenshot of editor with the text "That will be £5, Loïs""> To configure your TinyPilot for AZERTY layout, run this command before installing or upgrading TinyPilot: export TINYPILOT_INSTALL_VARS="keyboard_layout=azerty" Update (2020-12-23): As of TinyPilot 1.3.0, TinyPilot automatically supports most keyboard layouts with no configuration required. Upgrading to TinyPilot 1.1 Running an earlier version of TinyPilot? Upgrading is easy. SSH into your TinyPilot, and run the following bash commands: curl \ --silent \ --show-error \ https://raw.githubusercontent.com/tiny-pilot/tinypilot/master/quick-install | \ bash - && \ sudo reboot Written by Michael Lynch, TinyPilot Founder and CEO'''
year_published = 2020
year_updated = 2020
clearnet = "https://tinypilotkvm.com/blog/whats-new-in-1-1"
