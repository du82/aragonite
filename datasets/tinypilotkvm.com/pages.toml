["https://tinypilotkvm.com/faq/fix-browser-privacy-errors"]
title = "How do I fix browser privacy errors? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I fix browser privacy errors? .faq-content img { margin: 1rem; border: 1px solid black; } Note: These instructions apply only to TinyPilot Pro. When you first visit TinyPilot over HTTPS, you'll see a privacy error like this: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/privacy-error-1.41e7f26.822ecc36aa9999c4d8c1e23d3b1cfbca.png" width="967" alt="TinyPilot privacy error"> This error is expected because TinyPilot secures the HTTPS connection using a key that your system doesn't know about yet. You can ignore the privacy error, but the better fix is to prevent it in the first place. The fix In order for your browser to trust the TinyPilot HTTPS connection, you need to download the TinyPilot device's root certificate and install it on your system. This certificate is secure, as the certificate is unique to your device. To accept the certificate, follow the instructions below for your operating system: Windows Debian/Ubuntu macOS Windows Download your device's unique root certificate from http://tinypilot/ca.crt. The above URL is for the TinyPilot device on your local network. If you access your TinyPilot through a different URL, add /ca.crt to the end of your device's URL. Double-click the downloaded ca.crt file. When you see the Security Warning, click "Open." Click "Install Certificate..." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/win-install-ca.458ca25.d3d54a469e6794437277bcab2288c504.png" width="405" alt="Screenshot of Windows dialog showing Install Certificate button"> When prompted for a store location, choose "Local Machine." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/win-import-machine.3eafece.0f1754c5da26d8e2d04c9e2c586a0e06.png" width="535" alt="Screenshot of Certificate Import Wizard showing Store Location as Local Machine"> Choose "Place all certificates in the following store." Click "Browse..." and then click "Trusted Root Certification Authorities." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/win-trusted-root.3eafece.f5b2396008d9efe534f8fd98d9a232ec.png" width="535" alt="Screenshot of Certificate Import Wizard showing 'Place all certificates in the following store: Trusted Root Certification Authorities'"> Click Next. Click Finish. Debian / Ubuntu Run the following commands from the terminal: wget \ http://tinypilot/ca.crt \ -O tinypilot-ca.crt && \ sudo mkdir -p /usr/share/ca-certificates/extra && \ sudo cp tinypilot-ca.crt /usr/share/ca-certificates/extra/ && \ sudo dpkg-reconfigure ca-certificates The last command will display a console UI: When prompted "Trust new certificates from certificate authorities?" select "no." Scroll to extra/tinypilot-ca.crt and press the Space key to select it. Press the Tab key to select Ok. Press the Enter key to complete installation. macOS Download your device's unique root certificate from http://tinypilot/ca.crt. The above URL is for the TinyPilot device on your local network. If you access your TinyPilot through a different URL, add /ca.crt to the end of your device's URL. Open the "Keychain Access" app and select the "System" keychain. In the "File" menu, click "Import items..." to add the downloaded ca.crt file. Right-click the newly added "tinypilot-ca" entry and select "Get Info." In the "Trust" section of the dialog, choose "Always Trust" for "Secure Sockets Layer (SSL)." Remove TinyPilot CA certificate If your TinyPilot device's CA private key is ever compromised, you should uninstall the TinyPilot CA certificate from any machine where you added it as a trusted certificate. See How do I remove the TinyPilot CA certificate? Troubleshooting Firefox doesn't use the new certificate Firefox has a separate certificate store and, depending on your settings, may not use the newly installed TinyPilot CA certificate. You can add the TinyPilot CA certificate to Firefox as follows: Open the Firefox settings page. Navigate to "Privacy & Security." Scroll down to the "Certificates" section. Press "View Certificates." Press the "Import..." button. Select the TinyPilot CA certificate and press "OK." Press on "OK" again. Close the Firefox settings page.'''
