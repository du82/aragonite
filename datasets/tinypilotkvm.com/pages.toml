title = "Preview: Rack-Mounted TinyPilot | TinyPilot"
description = "TinyPilot is working on a new version you mount in a server rack. What do you think?"
full_description = '''Preview: Rack-Mounted TinyPilotOriginally published March 5, 2021 Last updated Customers frequently ask me when I'll offer a version of TinyPilot they can mount in their server rack. Today, I finally have an answer: soon! Design preview I've been working on a design for a new version of TinyPilot that mounts directly to your server rack. Check out the preview below: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/preview.1778da9.124ffcf630a8f72bf0ad30ffc409a72c.png" width="1500" alt="Preview flyer for Voyager Rack-Mount"> Update - May 18th, 2021 Quick update here. I'm still working on this, but part of my plans included a custom chip to provide the TinyPilot with power over Ethernet (PoE). Due to the global chip shortage, it's been more difficult to build custom chips, so this is taking longer than I expected. I'm still continuing to work on this, and I hope to have a version available by the end of 2021. Update - November 17th, 2021 I'm still hard at work on this! The Voyager 2 with PoE is almost ready, so we're aiming for a rack-mounted Voyager 2 option in early 2022. Update - March 16, 2023 I apologize for the long delay, but I sadly decided to defer work on the rack mount indefinitely. The global chip shortage made electronics manufacturing so difficult in 2022 that I had no available bandwidth to make progress on a rack mount. I'm still interested in supporting rack mounting, but it is not on TinyPilot's short-term roadmap currently. Written by Michael Lynch, TinyPilot Founder and CEO'''
