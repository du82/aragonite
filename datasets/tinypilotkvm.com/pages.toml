full_description = "FAQHow do I control the mouse with a touchscreen?TinyPilot can accept touchscreen input on your local device to control the mouse on your target computer, allowing you to left-click, right-click, and double-click. Sorry, your browser doesn't support embedded videos. Using a touchscreen tablet to control a target computer. Using gestures to click You can use gestures to perform various types of mouse clicks: Click Gesture Left-click Tap with one finger Right-click Tap with two fingers Double-click Tap twice in the same place with one finger Moving the cursor When using touchscreen input with TinyPilot, tapping on the screen will click in the location you tap, moving the cursor for you. TinyPilot can accept touchscreen input on your local device to control the mouse on your target computer, allowing you to left-click, right-click, and double-click. Sorry, your browser doesn't support embedded videos. Using a touchscreen tablet to control a target computer. Using gestures to click You can use gestures to perform various types of mouse clicks: Click Gesture Left-click Tap with one finger Right-click Tap with two fingers Double-click Tap twice in the same place with one finger Moving the cursor When using touchscreen input with TinyPilot, tapping on the screen will click in the location you tap, moving the cursor for you."
