["https://tinypilotkvm.com/blog/introducing-voyager-2a"]
title = "Introducing TinyPilot Voyager 2a | TinyPilot"
description = "Voyager 2a features a sleek metal case and streams crystal-clear audio."
full_description = '''Introducing TinyPilot Voyager 2aOriginally published February 16, 2023 Last updated The Voyager 2a is TinyPilot's newest KVM over IP device, featuring a redesigned case, audio streaming, and the latest TinyPilot Pro software. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/2a-group.8474172.e34de5f3bcd831975c3f9d17e4313c22.webp" width="800" alt="Group of three Voyager 2a devices side-by-side"> A sleek metal case Prior to the Voyager 2a, we 3D printed all of our cases. We worked with an amazing 3D print designer who did an excellent job with our cases, but 3D printing has its limitations. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-angled.25efab6.5f69e91a1e43eeffbda2167b180f4de3.jpg" width="1200" alt="Voyager 2 angled view"> We used the highest-quality 3D printed material we could find, but it never quite matched the quality of a nice metal case. 3D printing also limited production speed. Each Voyager 2 case took 12 hours to print. Customers were buying TinyPilot devices faster than we could print cases, even after our fleet expanded to six printers. The Voyager 2a features a fully redesigned metal case. Switching to metal allows us to scale up production quickly, and the smooth powder coat finish makes the device a pleasure to handle. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/2a-front.8474172.125bc70a536765af7a57216d97007e32.webp" width="800" alt="Front view of Voyager 2a"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/2a-back.8474172.d473d8954b4b079843edf6dd921bbddc.webp" width="800" alt="Rear view of Voyager 2a"> Crystal-clear audio Audio streaming has been one of the most commonly-requested TinyPilot features. We're pleased to announce that the Voyager 2a supports audio! If your target computer is playing audio, you'll hear it right through your browser. Sorry, your browser doesn't support embedded videos. See our guide for details on enabling audio on your TinyPilot Voyager 2a device. TinyPilot Pro included TinyPilot Voyager 2a ships with TinyPilot Pro 2.5.3 and includes a year of free updates and priority technical support. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-bios-menu-2.68ad24f.1273ea7fd0e363a07b825bed3d21c0a2.webp" width="1515" alt="Screenshot of TinyPilot Pro on an HP ProLiant BIOS screen"> TinyPilot Pro is the premium version of TinyPilot's software and includes several features not available in the free, open-source version, such as: Mount disk images as virtual disks Wake on LAN TLS security Password-based authentication Purchase TinyPilot Voyager 2a is available for immediate shipping. Order Now Written by Michael Lynch, TinyPilot Founder and CEO'''
