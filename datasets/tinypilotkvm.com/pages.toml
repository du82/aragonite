["https://tinypilotkvm.com/instructions/power-connector/v4"]
title = "Power Connector Installation Instructions | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''Power Connector Installation InstructionsThe instructions below walk you through connecting your TinyPilot Power Connector to your Raspberry Pi and target computer. Use a short USB-C to USB-A cable to connect the USB-C port on the Raspberry Pi to the USB-A port on the TinyPilot Power Connector. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pc-v4-power-connector-usb-c.75e41ba.1122472b242f900883ffa4a98beba2d1.jpg" width="1200"> Connect a microUSB to USB-A cable to the port labeled "PWR" on the TinyPilot Power Connector. Connect the other end to a 5 V / 3 Amp USB power adaptor and plug it into a power outlet. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pc-v4-power-microusb-power.75e41ba.28294c8ca5a291fc0e957a66e29e18bc.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pc-v4-power-microusb-ac.b1f4eea.9e2264d1e48d0dace7443b70dd12a815.jpg" width="1600"> Flip on the power switch (slide it toward the "TINYPILOT" label). If it's properly receiving power, the green LED will light up. Connect a microUSB to USB-A cable to the port labeled "Data" on the TinyPilot Power Connector. Connect the other end to a USB port on your target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pc-v4-power-microusb-data.75e41ba.d086d1f5c1b38ed7aa255955dc0d203c.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/usb-cable-to-computer.75e41ba.ef6f05356cbeaf5ca12c68e5ca8035d5.jpg" width="1200"> If everything is connected correctly, you should see the Pi's power LED shine a solid red. The disk activity LED will flash green intermittently as the device runs. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pc-v4-led-lights.75e41ba.5cb09bcc4583e9c7204cac49a3d59fee.jpg" width="1200"> Questions? Feedback? How'd installation go? If you have any questions or feedback about your TinyPilot, we'll be happy to help you in the support forum.'''
year_published = 2025
