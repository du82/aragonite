["https://tinypilotkvm.com/faq/ssh-credentials"]
title = "How do I log in to TinyPilot over SSH? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I log in to TinyPilot over SSH?Enabling SSH access To enable SSH access, navigate to System > Security in the web application: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/system-security.b248880.4162bbc7ac9155a42429dab91eab0b1f.png" width="408" alt="The TinyPilot web interface is shown. The 'System' menu has been opened, with the 'Security' menu item highlighted, ready to be chosen."> In the Security Settings dialog, set the "Enable SSH access" toggle to active: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/enable-ssh.5a4924c.d46e7659332d9bd1f20426e6074b1884.png" width="866" alt="The TinyPilot 'Security Settings' dialog is shown. The 'Enable SSH access' toggle is in the on position."> Once SSH is enabled, you can access your device over SSH with any SSH client. Connecting using SSH Start a new connection in your SSH client using TinyPilot's default SSH credentials: Hostname: tinypilot Username: pilot Password: flyingsopi For text-based SSH clients, connect using this command: ssh pilot@tinypilot When you have successfully connected, you will see the following prompt: pilot@tinypilot:~ $ For security, you should run passwd after your first login to select a secure, unique password. Running commands Some TinyPilot FAQs ask you to run groups of commands. To run a group of commands, copy all of the commands to the clipboard in one go: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/copy-commands.e911259.8af79a6595a446273c4f218320d3c55d.png" width="565" alt="A code snippet in a TinyPilot FAQ is shown, with all the commands in the code snippet highlighted. The right-click menu has been opened, with the 'Copy' menu item highlighted, ready to be chosen."> Paste the commands into the SSH window using the "Edit" or right-click menus: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/paste-commands.d4a38f4.aa777b88b91a1b9bc8fdc9b14218558b.png" width="747" alt="A terminal window displays an SSH connection to a TinyPilot. The right-click menu has been opened near the prompt, with the 'Paste' menu item highlighted, ready to be chosen."> Press the "Enter" key once to run the commands. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/run-commands.d4a38f4.04dc85b8de023d0c858aeae5d23b0110.png" width="747" alt="A terminal window displays an SSH connection to a TinyPilot. A group of commands have been pasted into the prompt, ready to be run.">'''
