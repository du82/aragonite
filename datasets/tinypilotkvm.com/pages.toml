["https://tinypilotkvm.com/instructions/voyager2/v2"]
title = "Voyager 2 Quick Start Instructions | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''Voyager 2 Quick Start InstructionsStep 1: Attach Ethernet cable Connect to your local network by connecting an Ethernet cable to the Voyager 2's Ethernet port and connect the other end to your network router or switch. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-ethernet-cable.b1f4eea.b26ace7dcfc6ea4b28da5b37b6ae672a.jpg" width="1600"> Step 2: Attach power cable If you purchased the TinyPilot Voyager 2 with PoE, you can skip this step. Connect the AC to USB-C power adaptor to a power outlet. Connect the USB-C cable from the power adaptor to the USB-C port labeled "POWER" on the TinyPilot Voyager 2 device. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-power-outlet.75e41ba.1d1e84bb659df1843c3688a750fbcf30.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-usb-c-power.75e41ba.0c1904d9e3aa906c79f401c4ada27fe3.jpg" width="1200"> Step 3: Verify status lights If everything is connected correctly, you should see Voyager 2's status LED lights turn on: The power LED should shine a solid red. The disk activity LED will flash green intermittently as the device runs. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-led-lights.75e41ba.95422ca59f76ff5db01474c10da98e9e.jpg" width="1200"> Step 4: Attach USB data cable Next, use the USB-C to USB-A cable to connect the Voyager 2 to your target computer. Connect the USB-C end (rounded) of the cable to the USB-C port labeled "DATA" on the TinyPilot Voyager 2 device. Connect the USB-A end (rectangular) of the cable to a USB port on your target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-usb-c-data.75e41ba.c6dccfa12ef7d469e796e4448125b056.jpg" width="1200"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-usb-c-data-pc.75e41ba.800d8372dcbdfe68867efc7b3e7b7b0f.jpg" width="1200"> Step 5: Connect VGA to HDMI adaptor (Optional) This step only applies if you purchased a VGA adaptor for a target system with no HDMI output. Connect the VGA adaptor to your computer's VGA display output. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-vga-to-hdmi-1.75e41ba.a644f7e738ad8d1b658df3c04e67e377.jpg" width="1200"> Use the 30-inch black USB-A to microUSB cable to connect the VGA adaptor to any available USB port on your computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-vga-to-hdmi-2.75e41ba.a7efe43040e56782fced18452905a07f.jpg" width="1200"> Step 6: Connect the HDMI cable Connect an HDMI cable to the HDMI input port on the Voyager 2. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-insert-hdmi.75e41ba.11c1add703dd815337925ab8915df983.jpg" width="1200"> Connect the other end of the HDMI cable to the output display port of the target computer. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-hdmi-server.b1f4eea.d026366ec611949a11a597b6fc0985be.jpg" width="1600"> Depending on the target computer's output, you can use a HDMI to HDMI cable, a DisplayPort to HDMI cable, or a DVI to HDMI cable. Step 7: Access the TinyPilot web interface Your first boot will take up to five minutes. You may see the web interface restart as TinyPilot generates new, unique TLS keys for your device. With your TinyPilot booted, you can now access the TinyPilot web interface from any device on your local network by visiting one of the following URLs: https://tinypilot/ https://tinypilot.local/ https://tinypilot.localdomain/ The first time you visit the TinyPilot web interface, you'll see a privacy error because TinyPilot establishes a secure connection, but your system doesn't recognize the server yet. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-privacy-error-1.41e7f26.822ecc36aa9999c4d8c1e23d3b1cfbca.png" width="967"> You can safely ignore this warning and proceed to TinyPilot. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-privacy-error-2.41e7f26.411823f08496b4b1904dc525de546323.png" width="967"> After you resolve the privacy error, you will be able to access the TinyPilot web interface. To fix the privacy error permanently, see Fix Privacy Error instructions. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-v2-web-interface.a5b406b.6b948cfc24d84fe6f786e0de5f454930.png" width="1596"> Your target computer's display output should display in the browser. TinyPilot forwards any keystrokes you enter to the target machine. Questions? Feedback? How'd installation go? If you have any questions or feedback about your TinyPilot, we'll be happy to help you in the support forum.'''
year_published = 2025
clearnet = "https://tinypilotkvm.com/instructions/voyager2/v2"
