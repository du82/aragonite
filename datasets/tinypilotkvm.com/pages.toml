["https://tinypilotkvm.com/blog/introducing-voyager"]
title = "Introducing TinyPilot Voyager | TinyPilot"
description = "Voyager is TinyPilot's newest model, featuring a sleek design and richer video capture."
full_description = '''Introducing TinyPilot VoyagerOriginally published November 18, 2020 Last updated The Voyager is TinyPilot's newest KVM over IP, featuring a sleek design, richer video capture, and the latest TinyPilot software. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-angled.20cf8e9.5d38fe45dd104b9baefd31a558971135.jpg" width="1920" alt="Voyager 3/4 view"> All-in-one design Voyager's most obvious new feature is its case. The original TinyPilot captured video through an external USB dongle, but I wanted something simpler. I worked with 3D-printing experts to design a custom case for TinyPilot. The case is made from a carbon fiber material that's both lightweight and durable. To keep the device cool, the Voyager features a low-noise fan. Best of all, it allows you to plug an HDMI cable right into the device. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-side-cables.20cf8e9.be7c052c4b913f448c9850620ecf5374.jpg" width="1920" alt="Voyager 3/4 view with cables"> The Voyager case still provides full access to all of the device's external ports, including its micro HDMI outputs. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-port-side.20cf8e9.3b8c95889959931cf3e59a34f31c21ef.jpg" width="1920" alt="Voyager side view"> Improved video capture Voyager uses the Toshiba TC358743, an internal chip that captures HDMI video at high quality. Compared to USB video capture dongles, the TC358743 offers a sharper picture, more accurate colors, and greater reliability. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/capture-side-by-side.20cf8e9.5dffedbc3f7f6af3b2f2c13c6290ddcd.png" width="1920" alt="Side-by-side comparison of capture from Hobbyist Kit vs. capture from Voyager"> TinyPilot 1.2.0 Voyager ships with TinyPilot v1.2.0, the latest version of TinyPilot. It includes new features such as native support for screenshots and a full on-screen keyboard. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/osk.8677140.cc6e5d11a5b64f9609c7191afd2a4b03.png" width="1420" alt="Side-by-side comparison of capture from Hobbyist Kit vs. capture from Voyager"> As I continue to develop TinyPilot's software, Voyager users will able to upgrade their system in place to take advantage of bugfixes and receive the latest and greatest features. Purchase Voyager is available in the TinyPilot store today. Order Now Written by Michael Lynch, TinyPilot Founder and CEO'''
