["https://tinypilotkvm.com/faq/scrambled-video"]
title = "How do I fix a scrambled screen image? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I fix a scrambled screen image?If your TinyPilot and target machine have mismatched display settings, TinyPilot may misinterpret the signal, causing the image to scramble. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/minor-scramble.cbab2cf.27c6089e197d97b026ae71da6f741898.jpg" width="1024" alt="A screenshot of a PC's desktop. There are green lines evenly spaced throughout the image, and a thick green bar at the bottom of the desktop."> Examples Screen scrambling can manifest in different ways from slight distortion to complete corruption of the image. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/vga-scramble.b1f4eea.ab72c189eca94b722070833d79995890.jpg" width="1600" alt="The BIOS screen is illegible"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/major-scramble.2665e34.033342fb943f2521a65b1e2e5af4aa2e.jpg" width="1920" alt="Green lines and flickering are present throughout the image. Elements on the desktop are disjointed and illegible."> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/static-scramble.58d2b6c.691ff2d898cf2c6440a087e6bb9e134f.jpg" width="1680" alt="The entire image is static noise."> Solution To resolve these scrambling issues, you will need to change your target machine's display output settings. 1280x720 at 60Hz works well across most devices. The process of adjusting display settings varies by operating system, but you can usually find resolution and frame rate options in your computer's system settings under "Display." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/display-settings-720p.bc8bf31.5aecd8303b660ff2e3ba456da02f1669.png" width="954" alt="A display settings menu with a resolution drop down listing multiple resolutions."> In cases where the scrambling makes it impossible to adjust your display settings, changing your TinyPilot's EDID may resolve this issue. Still having issues? Create a new thread in our help forum with the following details: Make and model of your target device Operating system of your target device Model of your TinyPilot A log URL from your TinyPilot On the TinyPilot web interface, go to System > Logs, then click Get Shareable URL Whether you are using any adapters (VGA, DVI, etc.)'''
year_published = 2025
