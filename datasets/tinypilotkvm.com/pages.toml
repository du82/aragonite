["https://tinypilotkvm.com/faq/reduce-bandwidth"]
title = "How can I reduce TinyPilot's latency? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow can I reduce TinyPilot's latency?On a well-provisioned local network, TinyPilot achieves 100-140 milliseconds of latency on its H.264 video stream. On slower networks or across the Internet, you may experience higher latency. This article includes steps you can take to reduce TinyPilot's latency. Switch to H.264 video Switching to the H.264 video format can drastically improve latency. To change which video format TinyPilot uses, go to System > Video Settings. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/video-settings.44ddbd3.4d8bdbe5c303bcd338a4a2dad2214790.png" width="458" alt="Screenshot of TinyPilot navigation bar selecting Video Settings"> Choose H.264 from the streaming mode dropdown list. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/change-video-format.a5b7b84.5d7d91fd00d54ebbe12f726cbba6b068.png" width="861" alt="Screenshot of TinyPilot video format selection dropdown list"> If your network connection to the TinyPilot doesn't support WebRTC connections, you can optimize latency using MJPEG (see below). Reducing latency with H.264 video Adjust the frame rate and bit rate settings to fine-tune performance for your network. A higher bit rate will improve picture quality, and a higher frame rate will improve responsiveness. Using lower values may reduce latency. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/change-video-settings-h264.a5b7b84.235361122e51c46188db159ec5d8e6cb.png" width="861" alt="Screenshot of TinyPilot's H.264 Video Settings dialog"> Reducing latency with MJPEG video For most users, you will achieve better performance using H.264 video. You should only switch to MJPEG video if your network is incompatible with the WebRTC connection that H.264 mode requires. To select MJPEG mode, follow the instructions under Switch to H.264 video but choose MJPEG from the streaming mode dropdown list. Adjust the frame rate and quality settings to fine-tune performance for your network. Latency will reduce as you lower the frame rate and quality. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/change-video-settings-mjpeg.a5b7b84.52a00829010028c4e208b48b6ff08b2a.png" width="861" alt="Screenshot of TinyPilot's MJPEG Video Settings dialog">'''
year_published = 2025
clearnet = "https://tinypilotkvm.com/faq/reduce-bandwidth"
