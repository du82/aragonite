["https://tinypilotkvm.com/blog/whats-new-in-2024-06"]
title = "What's New in TinyPilot's June 2024 Update | TinyPilot"
description = "TinyPilot's June release lets you transfer files using a virtual USB drive and adds touchscreen support."
full_description = '''What's New in TinyPilot's June 2024 UpdateOriginally published June 28, 2024 Last updated TinyPilot's June release lets you transfer files using a virtual USB drive and adds touchscreen support. Easily transfer files using a virtual USB drive TinyPilot's virtual media feature made installing operating systems and other software from disk images onto your target machine quick and straightforward, and we've now expanded this feature to make transferring individual files from your computer just as easy! Simply select one or more files from your local computer, and TinyPilot will create a disk image you can use just like any other virtual media. It works like a virtual USB drive, meaning you can open and copy the files on your target computer just as you would if you were physically there! Transferring files using a virtual USB drive can make awkward tasks, such as updating the BIOS on a target computer, quick, easy, and convenient. Sorry, your browser doesn't support embedded videos. Updating the BIOS on a target computer using a virtual USB drive (sequence sped up). Support for using touchscreen input If you've previously tried to use TinyPilot from a touchscreen device, you might have found it tricky to control the target computer's cursor. We've now added touchscreen support for clicking, double-clicking, and right-clicking directly into TinyPilot, meaning it's easy to work with your target device, even when you're away from your desk. Sorry, your browser doesn't support embedded videos. Using a touchscreen tablet to control a target computer. Full changelog For the full list of changes in TinyPilot Pro 2.6.4, see the changelog. Updating to the latest version You can update to the latest version of TinyPilot by clicking System > Update in the navigation bar: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/update-button.7428ecd.1d8c3c11550c6f6d643211fe135cc2d4.png" width="1583" alt="The update button is located in the navbar under System"> Written by Charles Hague, TinyPilot Support Engineer'''
