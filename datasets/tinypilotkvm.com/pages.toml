["https://tinypilotkvm.com/pro/changes"]
title = "TinyPilot Pro Change History | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''TinyPilot Pro Change History 2.6.5 Published: 2024-10-16 New features Manage Wi-Fi connections in TinyPilot's web UI. Network status dialog allows you to view your device's network connections, IP address, and MAC address. Meta + Alt + Escape shortcut to open the "Force Quit" utility on macOS. Alt + Tab shortcut to switch to the next window on macOS, Windows, and more. Ctrl + Alt + Backspace shortcut to restart the desktop environment on some Linux distributions. Send mouse events using the Enterprise REST API. Bugfixes Moving virtual media to an external disk no longer prevents TinyPilot's web UI from loading. Moving virtual media to an external disk now warns when existing files are too large for the external filesystem. Attempting to move virtual media to an external disk no longer fails when virtual media hasn't yet been used. Improvements Added de-DE support when pasting text (thanks to @DustyDiamond). External virtual media now supports ext4-formatted drives for images over 4GiB. Disk image checksums (SHA-256) Voyager: 1906b296e7cb191c81a4e0a4a13fc733a8fa6be69eb85c11ca63aaada5301c01 Hobbyist: 3e32a59dc27fa67ae4d0934f7a86f793d1aff4c0857d92be935fc7e0c912e7bb 2.6.4 Published: 2024-06-20 New features Create virtual media disk images from files on your local computer. Support for using touchscreen input. The "Paste Text" dialog now supports masking text for privacy. Improvements The "Manage Virtual Media" dialog displays how much free disk space is available. The disk image table shows the file size of individual disk images. Notes Debug logs now include static IP address details. Manage a TinyPilot Wi-Fi access point using convienience scripts. Disk image checksums (SHA-256) Voyager: 7ad262a0f196e32843d3ecbe7323eb10448e54d59515793b2b9a94e0f29fd89a Hobbyist: edab3cbc668cd1522bc1c1ae75e7383111e27440df34fa26efdf1e02217572d9 2.6.3 Published: 2024-02-29 New features Assign your device a static IP address in TinyPilot's web UI. Bugfixes UI behavior is now consistent when re-uploading a disk image. Eliminated noise from the debug logs on TinyPilot systems that use USB-based HDMI capture. Security Fixed privilege escalation through scripts. Improvements Optimized timing on menus to make it harder to accidentally exit the menu too early. TinyPilot remembers your log-in details after you restart your browser. TinyPilot redirects you to your originally requested page after authentication. Improved guidance for enabling SSH access. Semantics for action buttons are now consistent across dialog windows. Disk image checksums (SHA-256) Voyager: f29317229349573eea140aa65dacecaf573d5a08cc7eb459d07ada6a1ed0975c Hobbyist: 033bee160840bf7f9aea524381b517a837270eb87f12e149949eb4fb54288a5e 2.6.2 Published: 2023-11-09 New features STUN server configuration options are now available in H.264 video settings. Static IP dialog allows you to view your device's static IP address and your router's IP address. Bugfixes Pasting large amounts of text now works reliably. The streaming indicator correctly reports the streaming mode when the remote display is off. Improvements H.264 mode video performance is 9% faster than 2.6.1. First boot is now 20% faster. Virtual media dialog displays a warning if you try to mount too large an image in ISO mode. Detailed update logs now announce when the install is complete. Debug logs now provide information about the current and selected streaming modes. Update to uStreamer v5.43. Notes The "Hostname" menu item has moved to System > Networking > Hostname. 2.6.1 Published: 2023-09-04 New features Dedicated Window view allows you to view your remote screen in a dedicated browser window without any menus or status bars. Bugfixes Resizing the browser window vertically no longer creates sizing jumps at certain heights. Improvements Actions > Paste now opens a standard dialog instead of a confusing overlay. Updates install 70% faster. The update process requires fewer downloads of external resources. Dialogs consistently allow you to submit by pressing Enter in input fields. HTTP 502 Bad Gateway errors result in clearer guidance about how to fix the issue. Debug logs have better information about temperature, network interfaces, CPU throttling, power, and hardware architecture. Notes TinyPilot now manages the Raspberry Pi's GPIO pin 2 if you install from a disk image. If you install from the command line, TinyPilot does not assume ownership of any GPIO pins. TinyPilot's localhost-only ports have changed from the 8000-8002 range to 48000-48002. It is no longer possible to make changes to TinyPilot's undocumented settings through the /home/tinypilot/settings.yml file. The following settings are supported and remain configurable through settings.yml: tinypilot_external_port tinypilot_external_tls_port tinypilot_manage_tls_keys ustreamer_edid The following settings are configurable through settings.yml, but we may remove configuration support for them in the future: tinypilot_keyboard_interface tinypilot_mouse_interface 2.6.0 Published: 2023-06-26 New features The on-screen keyboard has been redesigned and now supports easy hiding. Bugfixes Clean up temporary files if there's a failure during the update or install process. Improvements The update process is 45% faster than 2.5.4 and writes 48% less to the disk. 2.5.4 Published: 2023-04-27 New features Add support for exporting and importing TinyPilot settings. Add a help menu. Bugfixes Release modifier keys when switching windows (e.g., Alt+Tab). Fix a blank screen bug that affected macOS Ventura 13.3 systems. Improvements Support a wider range of display resolutions and refresh rates from target systems. Add support for INTL_RO and INTL_YEN keycodes for Japanese systems. Provide a more helpful error message if a software update fails. Update to uStreamer v5.38. Reduce log writes to disk. Notes This release may cause target systems to forget TinyPilot's previously configured display settings. This release updates TinyPilot's EDID, including revising the product ID field. Some systems cache display settings such as Mirror vs. Extend based on the display device's EDID. If you configured settings such as output resolution or display mode on your target system when you first set up TinyPilot, you may need to re-apply those settings after this update. This is the final update available for systems running Raspberry Pi OS Lite (Raspbian) Buster. For affected systems, the update dialog will provide instructions on how to migrate to the latest base OS. Users running Raspberry Pi OS Lite (Raspbian) Bullseye can continue updating normally. 2.5.3 Published: 2023-02-09 New features Stream audio from the target computer in H.264 video mode. Requires Voyager 2a or later. Requires Raspberry Pi OS (Raspbian) Bullseye as the base OS image, so users who upgrade from previous TinyPilot Pro images won't have access to this feature without a clean install with the latest pre-built microSD image. Improvements Switch to Raspberry Pi OS Lite (Raspbian) Bullseye as base OS image. Add ECDHE-ECDSA-AES256-GCM-SHA384 to supported SSL ciphers. Bugfixes Prevent flicker when video stream loads in H.264 mode. Notes TinyPilot support for Raspberry Pi OS Lite (Raspbian) Buster will soon be ending. TinyPilot is working on a Buster to Bullseye migration path, but we recommend new installations use Bullseye systems. 2.5.2 Published: 2023-01-17 New features H.264 video encoding is available to provide lower-bandwidth, low-latency streaming. Improvements Changes to video settings apply 90% faster. Respect OS dark-mode preference for background color. Add command-line scripts to manage static IP addresses. Various improvements speed up the install/upgrade process. Prevent an ineffectual upgrade when the read-only filesystem is enabled. Prevent an install on incompatible hardware. Capture more OS version information in debug logs (thanks to @raphaelts3). Capture hardware revision in debug logs. Make better use of Python f-strings (thanks to @jmunoz94). Bugfixes Video settings dialog spins infinitely on error. 2.5.0 Published: 2022-10-03 New features Add an About page. Improvements Install TinyPilot via Debian package instead of a git repository. Check for updates using the TinyPilot update web service instead of a git server. Allow remote screen to occupy full width of browser window. Enabling experimental support for H.264 is now much faster as we use a pre-compiled binary. Skip pip upgrade unless it's necessary. 2.4.1 Published: 2022-05-12 New features Experimental opt-in support for H.264 video over WebRTC. Instructions to enable H.264 Improvements Disable spellcheck and auto-complete on non-prose text inputs. Bugfixes Remove noise from debug logs. Prevent update from timing out on slow network connections. 2.4.0 Published: 2022-03-24 New features Extend password authentication to allow multiple users with distinct credentials. Improvements Present virtual storage to target computer only when a drive is mounted. This improves compatibility with systems that don't recognize virtual storage devices. Bugfixes (Security): Fix a vulnerability that allowed users to reuse previously valid session tokens. (Security): Strengthen validation for long-lived connections. Automatically repair Flask's secret key if it becomes corrupted. Prevent shutdown dialog from closing after shutdown is complete. Prevent TinyPilot from incorrectly sending the Ctrl key modifier in certain situations. Prevent uStreamer compilation failure. Known issues If you have password authentication required when you upgrade your system to 2.4.0 or later, the update dialog will report that the update failed with "Error: Authentication required." You can safely ignore this message. If you reload the page and log in, you will find that the update has completed successfully. 2.3.2 Published: 2022-01-10 New features Redact sensitive information from diagnostic logs Enable/disable SSH access from the web UI SSH access is now disabled by default on fresh installations Improvements Add TinyPilot's new logo Resize the remote screen when the browser window is shorter to prevent vertical clipping Add more logging for security-related events (login, add user) Bugfixes Make fullscreen feature work with more browsers Fix a bug in "Download image from URL" feature when URL contained URL-encoded characters 2.3.1 Published: 2021-11-18 Improvements Improve keyboard compatibility with systems that have buggy HID implementations in pre-boot, including Mac hardware. Improve performance for mouse movement and reduce the network bandwidth it consumes. Present a warning in the Security dialog if device has default SSH credentials. On login failure, show password reset instructions. Hide X ("close") button on dialogs that cannot be closed. Relax checking for "download from URL" virtual media feature to allow URLs that don't end in .img or .iso. Add a configuration option to disable virtual media. Support Raspberry Pi OS Bullseye release (2021-10-30) Bugfixes Prevent CSRF token from expiring on system restart. Make Ctrl+Alt+Del shortcut show a clearer keystroke history and more accurately mimic a user manually pushing that key sequence. Prevent nginx from buffering the video stream, which could sometimes prevent the last frame from appearing with low-framerate settings. 2.3.0 Published: 2021-09-20 New features Add support for Wake on LAN Allow mounting virtual media in CD-ROM mode View detailed progress logs during version-to-version updates Add shortcut for Ctrl+Alt+Del Improvements Speed up JavaScript loading Add consistent close buttons to dialog boxes Remove extraneous scrollbars when dialog boxes are showing Bugfixes Detect more keyboard forwarding failures Fix Meta+V pasting on macOS 2.2.5 Published: 2021-08-27 Bugfixes Applies a more robust fix to the failure in the apt-get command that was causing updates to fail. 2.2.4 Published: 2021-08-25 Bugfixes Fixes a failure in the apt-get command that was causing updates to fail. 2.2.3 Published: 2021-07-20 New features Add a REST API (Enterprise-only) Allow access over plaintext HTTP (disabled by default) Improvements Add version change information to the update dialog Warn the user if they try to close the browser tab in the middle of a virtual image upload Bugfixes Fix a bug that affects updates from <= 2.2.1 to later versions (#735) Fix space bar functionality on virtual keyboard (#736) Fix a bug that prevented TinyPilot from sending left and right modifiers simultaneously (#364) Prevent gateway timeout errors when uploading virtual storage images Fix a UI bug in the list of virtual storage images Fix CA certificate compatibility on macOS 2.2.2 Published: 2021-06-14 New features Upload virtual storage images from URL Add "reset to defaults" to video settings screen (#705) Support .local and .localdomain SANs Improvements Make style choices consistent across the web app (#721, #703, #699, #698, #674) Improve robustness and error detection during updates (#702, #675) Switch to conventional HTTP status codes (#680) Improve mouse compatibility Bugfixes Fix UI bugs in virtual storage feature Fix bug that prevented modifier keys from working during mouse clicks (#692) Eliminate a dependency on Internet connectivity for first boot Add temperature and throttling checks to diagnostic script 2.2.1 Published: 2021-05-05 Bugfixes Hotfix for an issue with the install process 2.2.0 Published: 2021-05-04 New features Mount virtual drives from disk images Tune the video stream from the web UI Bugfixes Improved reliability of the update process'''
