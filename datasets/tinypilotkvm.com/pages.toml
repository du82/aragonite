["https://tinypilotkvm.com/blog/introducing-voyager-2"]
title = "Introducing TinyPilot Voyager 2 | TinyPilot"
description = "Voyager 2 delivers everything you love about the TinyPilot in a tidier and more convenient form factor."
full_description = '''Introducing TinyPilot Voyager 2Originally published December 9, 2021 Last updated .white-img img { max-width: 80% !important; margin-left: auto; margin-right: auto; display: block; } @media screen and (min-width: 768px) { .white-img img { max-width: 400px !important; } } The Voyager 2 is TinyPilot's newest KVM over IP device, featuring a tidier, more convenient form factor and the latest TinyPilot Pro software. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-white.25efab6.4062846e5d0f16f4a2420e3fc893395b.jpg" width="1200" alt="Side view of Voyager 2"> Voyager 2: Now with fewer appendages TinyPilot has always focused on convenience. We want TinyPilot to be the easiest way to get physical-level access to your server. One of the least convenient things about the Voyager 1 was its power adapter. It was an external component that sat outside the Voyager. That design added cabling and caused the device to occupy a larger physical space: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager-1-power-connector.25efab6.7fb39f52e12fb452d5993ad095b268b1.jpg" width="1200" alt="Voyager 1 with Power Connector"> The Voyager 2 eliminates the external power connector, integrating everything into an elegant, compact case: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-angled.25efab6.5f69e91a1e43eeffbda2167b180f4de3.jpg" width="1200" alt="Voyager 2 angled view"> The Voyager 2 is just 3.5 inches wide, 3.5 inches long, and 2 inches tall, so it's still small enough to keep next to your servers and convenient enough to take with you wherever you need it. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/voyager2-connected.25efab6.977f6785cfbf826941b8dd41a24c2aad.jpg" width="1200" alt="Voyager 2 angled view with cables"> TinyPilot Pro included Voyager 2 ships with TinyPilot Pro 2.3.1 and includes a year of free updates and priority technical support. TinyPilot Pro is the premium version of TinyPilot's software and includes several features not available in the free, open-source version. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-dell-bios.f4bf18c.8482e2725e50e8a74267509a85f12132.jpg" width="1457" alt="View of TinyPilot booting Dell BIOS"> Here are some features we've added to TinyPilot Pro in the past few months: Wake on LAN Upload virtual disk images by URL Mount virtual disks in CD-ROM mode PoE Voyager 2 is coming soon The current model of the Voyager 2 supports power via USB-C, but we're still hard at work on a solution for users who want power over Ethernet (PoE). Update (2022-03-01): Voyager 2 PoE is now available. Purchase TinyPilot Voyager 2 is available for immediate shipping. Order Now Written by Michael Lynch, TinyPilot Founder and CEO'''
