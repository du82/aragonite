["https://tinypilotkvm.com/blog/whats-new-in-2023-09"]
title = "What's New in TinyPilot's September 2023 Update | TinyPilot"
description = "TinyPilot's September release introduces Dedicated Window mode and improves the user experience for pasting text from your clipboard."
full_description = '''What's New in TinyPilot's September 2023 UpdateOriginally published September 5, 2023 Last updated .blog-post .side-by-side { display: flex; flex-direction: column; max-width: 100%; } @media screen and (min-width: 768px) { .blog-post .side-by-side { flex-direction: row; } .instructions-content .side-by-side p { max-width: 50%; } .instructions-content .side-by-side p .g-image { max-width: 100%; } } TinyPilot's September release introduces Dedicated Window mode and improves the user experience for pasting text from your clipboard. Improve focus with Dedicated Window mode One request we've heard consistently from our customers is for TinyPilot to offer a simple view of their remote screen with no TinyPilot menus or status bars. In the latest version of TinyPilot, you'll find a new option under the View menu called "Dedicated Window." <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/dedicated-window-menu.11a3fb4.1b660d4647bb7a0a508520fc02588385.webp" width="683" alt="Screenshot of option under View menu showing "Dedicated Window" option"> When you select that option, TinyPilot will pop out a separate browser window that contains only your remote screen with no other distractions: Sorry, your browser doesn't support embedded videos. A demo of TinyPilot's Dedicated Window feature Improving the clipboard paste experience TinyPilot added support for pasting text to your remote device almost three years ago. Unfortunately, the UI for that feature hasn't received much investment, so it was in desperate need of a touch-up. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/paste-1.3.0.e8634cb.6a31bf7485b5c7b7ed5311f0250b569b.webp" width="1183" alt="Screenshot of paste feature from TinyPilot Pro 1.1.0"> <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/paste-2.6.0.067b99d.b87c5af5183f7db9b8f5982ff5a5fb13.webp" width="1182" alt="Screenshot of paste feature from TinyPilot Pro 2.6.0"> The paste interface in October 2020 (left) vs. August 2023 (right) Customers reported that TinyPilot's paste experience was confusing — the UI disappeared unexpectedly if you clicked the mouse or pressed the wrong key. TinyPilot's September release revamps the paste interface. It's now a simple, familiar dialog with clear behavior. Sorry, your browser doesn't support embedded videos. TinyPilot's improved paste experience is more intuitive and consistent with the rest of TinyPilot's UI. Faster updates For the past year, we've been improving TinyPilot's update process to make it faster and more reliable. The September release includes our most significant improvement yet. The latest release of TinyPilot Pro installs 90% faster than TinyPilot Pro 2.5.4 and 80% faster than the previous release, TinyPilot Pro 2.6.0. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/update-speed-graph.5e749b2.0073d359ca790a4ed2904b209fcfae18.webp" width="583" alt="Graph showing update speed dropped from 320 seconds (2.5.3 to 2.5.4 update) to 176 seconds (2.5.4 to 2.6.0 update) to 34 seconds (2.6.0 to 2.6.1 update)"> The new update experience isn't just faster — it's simpler, too. We purged the complex legacy components that were slowing down updates and replaced them with modern tools. Full changelog For the full list of changes in TinyPilot Pro 2.6.1, see the changelog. Updating to the latest version You can update to the latest version of TinyPilot by clicking System > Update in the navigation bar: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/update-button.690fb43.55f5410a8b0f91157773aea21df7e07f.png" width="505" alt="The update button is located in the navbar under System"> Written by Michael Lynch, TinyPilot Founder and CEO'''
