["https://tinypilotkvm.com/faq/browser-hotkeys"]
title = "How do I send keystrokes like Ctrl+T that are also browser hotkeys? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I send keystrokes like Ctrl+T that are also browser hotkeys?Certain key combinations are difficult to enter into the TinyPilot web dashboard because they're also browser hotkeys. These key combinations include Ctrl+T and Ctrl+W. Use on-screen keyboard The simplest way to send browser hotkeys to the remote machine is to use TinyPilot's on-screen keyboard. For example, to send Ctrl+W, click the left Ctrl key, then click the W key: Sorry, your browser doesn't support embedded videos. If you don't see TinyPilot's on-screen keyboard, enable it with View > Show Keyboard. Use Chrome "App Mode" An alternative method for Chrome users is to run Chrome under App Mode. To use TinyPilot in Chrome's App Mode: Visit your TinyPilot web dashboard. Click the Chrome menu button (⋮ or ☰). Select More tools → Create Shortcut. Edit the name if you wish, and click OK. This will create a TinyPilot shortcut on your desktop that launches Chrome in "App Mode," which will handle browser-specific key combinations like Ctrl+T and Ctrl+W properly. Alternatively, you can launch Chrome in App Mode from the command prompt. On Windows: "%PROGRAMFILES%\Google\Chrome\Application\chrome.exe" --app=https://tinypilot.local On macOS and Linux: google-chrome --app=https://tinypilot/ Certain key combinations are difficult to enter into the TinyPilot web dashboard because they're also browser hotkeys. These key combinations include Ctrl+T and Ctrl+W. Use on-screen keyboard The simplest way to send browser hotkeys to the remote machine is to use TinyPilot's on-screen keyboard. For example, to send Ctrl+W, click the left Ctrl key, then click the W key: Sorry, your browser doesn't support embedded videos. If you don't see TinyPilot's on-screen keyboard, enable it with View > Show Keyboard. Use Chrome "App Mode" An alternative method for Chrome users is to run Chrome under App Mode. To use TinyPilot in Chrome's App Mode: Visit your TinyPilot web dashboard. Click the Chrome menu button (⋮ or ☰). Select More tools → Create Shortcut. Edit the name if you wish, and click OK. This will create a TinyPilot shortcut on your desktop that launches Chrome in "App Mode," which will handle browser-specific key combinations like Ctrl+T and Ctrl+W properly. Alternatively, you can launch Chrome in App Mode from the command prompt. On Windows: "%PROGRAMFILES%\Google\Chrome\Application\chrome.exe" --app=https://tinypilot.local On macOS and Linux: google-chrome --app=https://tinypilot/'''
year_published = 2025
