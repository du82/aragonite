["https://tinypilotkvm.com/blog/voyager-2-poe"]
title = "Voyager 2: Now with PoE | TinyPilot"
description = "Voyager 2 PoE makes TinyPilot even more convenient, with just three cables."
full_description = '''Voyager 2: Now with PoEOriginally published March 1, 2022 Last updated Today, I'm happy to announce a new version of the TinyPilot Voyager 2 that supports power over Ethernet (PoE). The Voyager 2's PoE feature makes it easier than ever to manage your servers. Just three cables When you're installing hardware, the fewer cables, the better. That's why we're always looking for ways to reduce TinyPilot's cabling. As the name implies, power over Ethernet allows you to power your device via the Ethernet cable. You don't need to worry about finding a power outlet or connecting a power cable — the Voyager 2 turns on as soon as you plug in the Ethernet cable. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/poe-demo-opt.eb6d199.25ebd5be267642a194177f21984fd04f.gif" width="550" alt="Animated image showing Voyager 2 powering on after Ethernet cable is connected"> With PoE, you only need to plug in three cables: an Ethernet cable for power and network connectivity, a USB cable for data, and an HDMI cable to capture display output. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/three-cables.3b03c43.c99c12d9cf084a3845ab8c672c8e9361.jpg" width="1600" alt="Photo of TinyPilot Voyager 2 cables"> How do I use PoE? To use the Voyager 2's PoE functionality, you'll need PoE-enabled networking equipment, such as a PoE router or switch. If you're unsure if your router supports power over Ethernet, look for the terms "PoE" or "802.af" in the product specifications. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/poe-switch.8fefb59.12afa0bcab7f5da00500d493c2910628.png" width="1266" alt="Screenshot of product page for a PoE-enabled network switch"> You can also use a PoE injector like the TP-Link TL-POE150S, which adds PoE functionality to an Ethernet connection even if you don't have a PoE-enabled networking switch. USB-C power is still available Planning to use the Voyager 2 in environments where PoE isn't available? No problem. The Voyager 2 PoE still supports power via its USB-C port. If you need to use your Voyager 2 in an environment without PoE-compatible equipment, you can always power your device with the included AC to USB adaptor. Purchase The TinyPilot Voyager 2 PoE is now available for immediate shipping. Order Now Written by Michael Lynch, TinyPilot Founder and CEO'''
