["https://tinypilotkvm.com/faq/move-virtual-media"]
title = "How do I move my virtual media to a USB drive? | TinyPilot"
description = "TinyPilot is the most convenient way to get BIOS-level control of your remote servers"
full_description = '''FAQHow do I move my virtual media to a USB drive?TinyPilot's virtual media feature lets you upload disk images and mount them on your remote computer. If you want to upload a large number of images, you may exhaust TinyPilot's internal 32 GB disk. You can store more virtual media images on your TinyPilot by adding a large-capacity external USB drive to your device. Pre-requisites A USB drive formatted with an ext4 or FAT filesystem FAT-formatted drives do not support files larger than 4GB Connecting a USB drive Connect your USB drive to one of the blue USB ports on your TinyPilot device. The blue ports are USB 3.0, which performs better than USB 2.0 and is ideal for virtual media. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/usb-3.0.775f9c8.875f6662858c349a3ad36c8c48dc2dae.webp" width="800" alt="USB 3.0 ports on the TinyPilot Voyager 2a"> Your device will supply power to a USB drive, but some larger drives may need an additional power supply to function correctly. Moving virtual media to a USB drive Connect to your TinyPilot device using SSH and run the following command: lsblk -o NAME,SIZE,VENDOR,MODEL,LABEL,UUID You should see a list of connected storage devices. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/lsblk.34e745a.9eeedbd75492c63eb0cd58fa6016a7c4.png" width="983" alt="Output from lsblk command"> Your USB drive has a unique identifier known as a UUID. Use the vendor name, drive size, and other details to determine the UUID for your USB drive. If you're unsure which UUID to use, share the above output on our help forum. Once you have identified the UUID, specify it by running: # Configure with the correct UUID - ext4 drives use a 36-character UUID UUID="ABCD-1234" Run the command below to configure TinyPilot to use your USB drive for virtual media storage. The command will automatically migrate any existing disk images on your device to the USB drive. sudo /opt/tinypilot-privileged/scripts/move-virtual-media-to-disk --uuid ${UUID} Your TinyPilot device will expect the USB drive to remain permanently connected. If you need to disconnect the drive, move the virtual media back to the default location first. Moving virtual media back to the default location To move your virtual media back to the default location, SSH in and run: sudo /opt/tinypilot-privileged/scripts/restore-default-virtual-media-location You can safely disconnect your USB drive once the process completes.'''
year_published = 2025
