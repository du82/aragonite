["https://tinypilotkvm.com/blog/build-a-kvm-over-ip-under-100"]
title = "TinyPilot: Build a KVM Over IP for Under $100 | TinyPilot"
description = "Using only a Raspberry Pi and an $11 video capture dongle, you can create your own KVM over IP device, allowing you to send keyboard input to a remote computer and capture its display."
full_description = '''TinyPilot: Build a KVM Over IP for Under $100Originally published July 23, 2020 Last updated TinyPilot is my inexpensive, open-source device for controlling computers remotely. It works even before the operating system boots, so I use TinyPilot to install new OSes and debug boot failures on my bare metal homelab servers. This post details my experience creating TinyPilot and shows how you can build your own for under $100 using a Raspberry Pi. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/win-ubuntu.3b03c43.b8264e8afc85570ea02108a88b2904b6.jpg" width="1600" alt="Photo of TinyPilot connecting two computers"> Using TinyPilot to control my Ubuntu laptop from Chrome on my Microsoft Surface I don't want your life story; just tell me how to build it If you're a grinch who wants to skip my fascinating tale of triumph and despair in developing TinyPilot, jump directly to the section, "How to Build Your Own TinyPilot." Demo Why TinyPilot? A few years ago, I built my own home server for testing software. It's been a valuable investment, and I use it every day. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/homelab-server.3b03c43.e7939aefd20684a61e540f11cbe606b9.jpg" width="1600" alt="Photo of my homelab VM server"> The homelab server I built in 2017 to host my virtual machines The server has no keyboard or monitor attached because I access it over ssh or a web interface. This is a convenient setup, but it also turns small issues into a colossal pain. Every few months, I'll screw something up and prevent the server from booting or joining the network, effectively locking me out of the machine. To get things running again, I have to disconnect everything, drag the server over to my desk, and juggle cables around to connect the server to the keyboard and monitor at my desktop. Commercial solutions Friends have raved to me about their experience with iDRAC. It's a chip in Dell servers that provides a virtual console from the moment the system powers on. I briefly considered an iDRAC for my next home server, but its hefty price tag quickly put an end to that. The license alone costs $300, and it requires expensive custom hardware. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/idrac-price.cd8e336.4d048e0f1038abaff52fd8edf03325e8.png" width="1083" alt="Screenshot of $300 price for iDRAC 9 Enterprise license"> A license for Dell's iDRAC technology costs $300 per machine plus the cost of hardware. Next, I looked at commercial KVM over IP solutions. They provide similar functionality to Dell's iDRAC, but they're external devices that connect to a computer's keyboard, video, and mouse ports (hence the name KVM). Sadly, they're even more expensive, ranging in price from $500 to $1000 per unit. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/raritan-kvm.a12d4b2.bd80f2f105548f542dc8e1895d6b0284.png" width="1157" alt="Screenshot of purchsase page for Raritan Dominion KVM over IP"> As lazy as I am about dragging servers around, I couldn't justify spending $500 to save myself the trouble of swapping cables around a few times per year. So, I did what any appropriately irrational programmer would do: spend several hundred hours building my own KVM over IP. Building a KVM over IP with Raspberry Pi The Raspberry Pi is a small, inexpensive single-board computer. The devices are powerful enough to run a full desktop operating system, so their $30-60 price point makes them a popular tool among hobbyists and programmers. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/pi-in-hand.3b03c43.e0519e5168c5a57282882b948b67aeb1.jpg" width="1600" alt="Raspberry Pi in the palm of my hand"> The Raspberry Pi is a fully-functional computer that fits on a single chip and costs only $30-60. Recent versions of the Pi support USB on-the-go (USB OTG), which allows the Pi to impersonate USB devices such as keyboards, thumb drives, and microphones. As a proof of concept of my Pi-as-KVM idea, I created a simple web app called Key Mime Pi. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/key-mime-pi-interface.067b99d.bc967ab125bbb4da08fc46c437fe2b2e.png" width="1182" alt="Screenshot of Key Mime Pi web interface"> Key Mime Pi, my early precursor to TinyPilot that only supported keyboard forwarding. Key Mime Pi connects to another computer via USB and registers as a USB keyboard. It also presents a web page and listens for JavaScript key events. As the user types, Key Mime Pi captures the key events and translates them into keystrokes through its fake USB keyboard. This causes the keystrokes to appear on the target computer. I described this behavior in depth in my previous post. The challenge of capturing video Keyboard forwarding isn't so useful if you can't see what's happening on the screen. My obvious next step was to find a way to capture my server's display output in the Pi and render it in the browser. My first attempt at video capture was to use the Lenkeng LKV373A HDMI extender. Daniel Kučera (aka danman) did an excellent job reverse engineering this device. It was available from Chinese merchants on eBay for around $40, so it seemed like my best option. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/lkv373a.3b03c43.b76573fa2bedbc96c79d09d553400f75.jpg" width="1600" alt="Photo of Lenkeng LKV373A HDMI extender"> The Lenkeng LKV373A HDMI extender was my first attempt at HDMI video capture. Capturing video was tricky because the LKV373A transmitter isn't a video capture device. Its intended purpose is to pair with an LKV373A receiver that converts the network stream back to HDMI output. In danman's investigation, he discovered a way to intercept and capture the video stream, but the LKV373A speaks a non-standard variant of the RTP protocol that few video tools understand. Fortunately, danman contributed a patch to ffmpeg that handles the LKV377A's goofy behavior, so I was able to render the stream using ffmpeg's video player: ffplay -i udp://239.255.42.42:5004 <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/ffplay-screenshot.20cf8e9.faee9bbba23683dfb66f73aa34a8bdd2.jpg" width="1920" alt="Screenshot of ffplay rendering video stream from LKV373A"> Rendering the video stream from the LKV373A with ffplay It was here that I received my first taste of a problem that dogged me throughout the project: latency. There was almost a one-second delay between the target computer and the video playback on my desktop. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/lkv373a-latency.3b03c43.18fbf35cb438f9632acdfdd0f0d125cd.jpg" width="1600" alt="Photo of Lenkeng LKV373A HDMI extender"> The LKV373A introduced 838 milliseconds of latency before any re-encoding. I tried playing around with ffplay's many command-line flags to speed up the stream, but I never pushed past 800 milliseconds. And that was on my desktop with its high-end GPU and CPU. It didn't bode well performance-wise for my scrappy little Raspberry Pi. Fortunately, I found a better solution by complete coincidence. HDMI to USB dongle While mindlessly scrolling through Twitter, I happened to see a tweet by Arsenio Dev about a low-cost HDMI to USB dongle he had just purchased: <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/arsenio-dev-tweet.587f173.3b741b6de8d326488b27758599754913.jpg" width="616" alt="Screenshot of Rufus"> A tweet from Arsenio Dev tipped me off to a better video capture solution. Capturing video at 1080p resolution and 30 frames per second seemed a little too good to be true, so I ordered one from eBay. It was only $11, including shipping. I don't even know what you call it — it has no brand name, so I'll just call it "the HDMI dongle." There are several variants, but they're all just different housing over the same MacroSilicon MS2109 chip. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/hdmi-ebay.1dcf820.aca097949bf27059a64ee2b0327f536b.png" width="1497" alt="Screenshot of HDMI for sale on eBay for $11.20"> HDMI to USB dongle available on eBay for $11.20 with free shipping When the device arrived a few days later, it blew me away. Without any tinkering, it showed up as a UVC video capture device as soon as I plugged it in to the Raspberry Pi. $ sudo v4l2-ctl --list-devices bcm2835-codec-decode (platform:bcm2835-codec): /dev/video10 /dev/video11 /dev/video12 UVC Camera (534d:2109): USB Vid (usb-0000:01:00.0-1.4): <<< HDMI capture dongle /dev/video0 /dev/video1 Within minutes, I was able to capture and restream HDMI video: # On the Pi ffmpeg \ -re \ -f v4l2 \ -i /dev/video0 \ -vcodec libx264 \ -f mpegts udp://10.0.0.100:1234/stream # On my Windows desktop ffplay.exe -i udp://@10.0.0.100:1234/stream It was so darn convenient, too. The LKV373A was nearly brick-sized and required its own power source and Ethernet cable. The HDMI dongle was as small as a thumb drive and required nothing more than a USB port. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/lkv373a-vs-dongle.3b03c43.0aba1e8dd43a12a1152d8cbe609c2a66.jpg" width="1600" alt="Comparison of Lenkeng LKV373A with HDMI dongle"> The Lenkeng LKV373A HDMI extender (left) was larger and required more connections than the HDMI dongle (right). The only problem was, again, latency. The Pi's rebroadcast of the video stream lagged the source computer by 7-10 seconds. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/dongle-ffmpeg.3b03c43.e8b0c1d13d9ee224526adc80d20dc191.jpg" width="1600" alt="Comparison of Lenkeng LKV373A with HDMI dongle"> Using ffmpeg to stream video from my Pi, there was a delay in the video of up to 10 seconds. I wasn't sure if this delay came from dongle itself, ffmpeg on the Pi, or ffplay on my desktop. Arsenio Dev reported latency of 20 ms, so it seemed like faster performance was possible if I delved into ffmpeg's arcane and mysterious command-line flags. Another stroke of luck spared me from that miserable task. Borrowing from a similar project When I published my previous blog post about Key Mime Pi, I received a comment from Max Devaev, who encouraged me to check out his project, Pi-KVM. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/maxim-comment.eaeab81.f599acf2d644f02e544f28a76acf12bb.png" width="864" alt="Max's comment: Hi:) Take a look at this project: https://github.com/pikvm/pikvm We have already done and debugged many things"> Max Devaev pointed me to his existing Pi-KVM project. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/melty-breadboard.20cf8e9.1f88e3418435d944df2ac0ab5f78e849.jpg" width="1920" alt="GPIO pins"> My previous experience with breadboards involved accidentally melting them. I had looked at Pi-KVM briefly, but its requirements of breadboards and soldering scared me off. At Max's suggestion, I gave Pi-KVM a second look, particularly interested in how he solved the video latency issue. I noticed that he captured video through a tool called uStreamer. Note: From further discussions with Max, I've learned that Pi-KVM does support builds without soldering or breadboards. uStreamer: a super-fast video streamer Have you ever found a tool that's so good, it solves problems you hadn't even anticipated? Right out of the box, uStreamer reduced my latency from 8 seconds to 500-600 milliseconds. But it also eliminated a whole chain of extra work. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/ustreamer-1.3b03c43.676f3abf27f5bd4c1d6a267deb54f7aa.jpg" width="1600" alt="500 ms latency with uStreamer and the HDMI dongle"> uStreamer reduced my latency by a factor of 15. Prior to uStreamer, I wasn't sure how to get video from ffmpeg into the user's browser, but I knew it was possible somehow. I tested this mostly-accurate tutorial for piping video from ffmpeg to nginx using HLS, but it added even more latency. And it still left open problems like how to start and stop streaming on HDMI cable connects and disconnects and how to translate the video to a browser-friendly format. uStreamer solved all of this. It ran its own minimal HTTP server that served video in Motion JPEG, a format browsers play natively. I didn't have to bother with HLS streams or getting ffmpeg and nginx to talk to each other. The tool was so fully-featured that I assumed Max simply forked it from a more mature project, but I was mistaken. This maniac wrote his own video encoder in C just to squeeze the maximum performance out of Pi hardware. I quickly donated to Max and invite anyone who uses his software to do the same. Improving video latency uStreamer reduced my latency from 10 seconds down to ~600 milliseconds. That was a huge leap forward but still a noticeable delay. I told Max I was interested in funding uStreamer further if he could find ways to improve performance, so we got to chatting. Max was interested in the HDMI dongle I was using since he'd never seen that particular device. He invited me to create a shared shell session using tmate so that he could access my Pi remotely. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/maxim-tmate.752f850.cc22fc6b16e67218eb8db0a9536ea387.png" width="680" alt="Screenshot of conversation where Max ofers to help me via tmate"> Max offered to either help improve latency or frame me for a federal crime. Fortunately, he ended up doing the former. After a few minutes of testing how uStreamer ran on my hardware, Max ran the v4l2-ctl utility and saw a line that fascinated him but totally went over my head: $ sudo v4l2-ctl --all Driver Info: Driver name : uvcvideo Card type : UVC Camera (534d:2109): USB Vid ... Format Video Capture: Width/Height : 1280/720 Pixel Format : 'MJPG' (Motion-JPEG) ... Streaming Parameters Video Capture: Capabilities : timeperframe Frames per second: 30.000 (30/1) The HDMI dongle was delivering the video stream in Motion JPEG format! uStreamer's hardware-assisted encoding was fast, but it was totally unnecessary, as modern browsers play Motion JPEG natively. We configured uStreamer to skip re-encoding and just pass through the video stream as-is. <img class="g-image g-image--lazy g-image--loaded" src="/assets/static/tinypilot-latency.3b03c43.e496520d43989005d00d634224e0a626.jpg" width="1600" alt="Photo showing 200ms of latency after eliminating re-encode step"> Skipping the extra re-encode step on the Pi reduced latency from 600 ms down to 200 ms. Latency went from 600 milliseconds all the way down to 200 ms. It's not instantaneous, but it's low enough to forget the delay after using it for a few minutes. TinyPilot in action Remember way back at the beginning of this post when I said I wanted TinyPilot so that I could access my headless VM server before it boots? Well, it works and I do! I iterated on Key Mime Pi to make a new web interface that integrates the video capture functionality: <img class="g-'''
