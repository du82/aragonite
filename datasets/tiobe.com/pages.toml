["https://www.tiobe.com/quality-models/tqi"]
title = "TIOBE Quality Indicator - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. The proverb “the proof of the pudding is in the eating” applies perfectly to software quality. Because only after a software product has been shipped, the true quality of a software product reveals itself. It is well known that the costs of repairing defects increase exponentially if they are found later on in the software development process. So if it is possible to measure the software quality of a system before release, it will potentially save a lot of money. TIOBE has developed a measuring system for this purpose. The TIOBE QUALITY INDICATOR is a software quality measurement system based on a pragmatic approach. The focus is on code quality (as opposed to quality of requirements or the architecture). The defined approach is based on many years of experience in this field and the analysis of more than 1 billion lines of industrial production software code that are checked each day. Download the TQI definition here. For older versions of the TIOBE Quality Indicator document, see here. Go to our TQI Assessment section for a one-time measurement with a detailed report, or the TiCS Framework section for continuous monitoring of software quality according to this quality model."
