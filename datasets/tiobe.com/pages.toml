["https://www.tiobe.com/knowledge/article/technical-debt-what-is-it-and-how-to-fight-it"]
title = "What is technical debt? - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. Software developers tend to be under a lot of pressure: customers want new features and managers want to release these features as soon as possible. This urgency is understandable, but it also has a downside: it often forces engineers to introduce technical debt. Technical debt is created when a solution to a technical problem is chosen that works in the short-term but will cause more work down the line. Release pressure is a common cause for accruing technical debt. It fixes a problem in the here and now, but a ‘debt’ is created that will have to be paid back eventually. And just like with debt, the longer you wait with paying, the more interest accumulates, and the more difficult it becomes to pay back. Technical debt can creep into a software product trought several ways. The first one is unintentional technical debt: a junior developer writes code in a way that is very hard to read, maintain, etc., and for some reason this goes unnoticed and ends up in the product. Ways to ensure this does not happen are having thorough code reviews, using pair programming or having good code checkers in place. But technical debt can also be intentional: a manager must decide how Feature X will be implemented, and there’s a lot of pressure to release soon due to certain circumstances at an important customer. The manager can decide to do it the ‘quick and dirty’ way to ensure the deadline is met, and schedule some time in the next release to properly implement the feature in a clean way. Sadly enough, in practice, the next release will also have a tight deadline and no time to properly work away the technical debt accrued during the previous release. You can guess what that means: technical debt keeps piling up, with the interest you need to pay back increasing as well."
year_published = 2025
year_updated = 2025
