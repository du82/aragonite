title = "Trusted Product Maintainability Assessment - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. Complex software systems tend to be very large nowadays. For instance, a modern car contains more than 100 million lines of code and it is expected to increase to 1 billion lines the next few years due to autonomous driving and security measures in the code. Imagine that 100 million lines of code is a book of about 1.8 million pages of text if printed out. Who is able to maintain such a vast amount of pages? With this in mind, it shouldn’t come as a surprise that the maintenance costs of a software system take about 90% of the total software lifetime costs. In conclusion: maintainability is an important quality characteristic that needs to be taken seriously. The TIOBE TÜViT Trusted Product Maintainability ISO/IEC 25010 Quality Model is a pragmatic way to get an overview of the maintainability of software code before release, or even earlier, during the software development process. The indicator uses well-known code quality metrics. The model defines how the quality metrics are measured and how the outcome of the resulting measurements should be evaluated. Based on this, a software system is labelled between A and F. These levels represent descending quality levels in terms of software maintainability. TÜViT approved TIOBE as a testing laboratory for evaluations of software products against the TIOBE/TÜViT Trusted Product Maintainability ISO/IEC 25010 Quality Model. This means that together with TÜViT, TIOBE can support you in getting your software to a certified level of Trusted Product Maintainability."
