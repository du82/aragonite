["https://www.tiobe.com/knowledge/article/increasing-developer-productivity-using-the-tics-framework"]
title = "TomTom - Increasing Developer Productivity using the TiCS Framework - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. The automotive market was (and still is) changing quickly. For TomTom, a Dutch supplier of navigational systems, this meant that a shift in focus was made to software development as one of their core competencies. Proper software development requires the implementation of new ways of working. In TomTom’s case, this meant adopting a more agile process and the introduction of new software quality tools. The main goal of these introductions was to increase developer productivity. TomTom asked TIOBE to coordinate its landscape of static analysis tools to increase developer productivity. Higher software code quality had already been linked to both higher developer happiness and higher developer productivity, and TomTom believed this would also bring big improvements to their development organization. For TomTom, it was important that the selected solution should support managers in making strategic decisions on priorities in addressing technical debt, as well as give engineers hands-on ways to improve their software code quality. Both of these could be facilitated by TIOBE’s TiCS Framework. TIOBE implemented its TiCS Framework for TomTom. To guarantee quality, TomTom’s management even issued a statement to engineers that they should adhere to the following policies: To help engineers meet these criteria, TIOBE gave workshops on how software quality metrics worked, why they were important and how they could be improved. This led to an efficient usage of software quality tooling and increases in both software quality and developer productivity could be measured soon afterwards. TomTom managed to almost triple its developer productivity in 2 years’ time. The introduction of TiCS as software quality framework enabled developers to find and solve quality issues a lot earlier during the development cycle and helped management to assess risks and define priorities of refactoring actions to address technical debt. At the CES 2017, TomTom announced it was the first automotive supplier with a number 1 ranking in the TIOBE benchmark, which had commercial benefits for TomTom as well."
