["https://www.tiobe.com/knowledge/article/how-to-quality-gate-software-code"]
title = "How to Quality Gate Software Code - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. How do you quality gate your software code quality? Which metrics do you use? Do you use relative or absolute gates? Where in the development process should the gates be placed? Let’s find out! Now that most organizations in the software industry have embraced continuous integration, we are ready for the next challenge: quality gates. Continuous integration has brought us highly automated software deliveries. That is a great thing, unless the quality of these deliveries is insufficient. The most logical next step is to put a gate or a set of gates before these deliveries, which will prevent bad software from being released. In this guide, we will explain how to set up software quality gates in the most efficient way, based on many years of experience with this topic. Bad quality gates can cause a lot of frustration in an organization, so it is advisable to get it right from the start. The first location, in the development process during a pull request, is the most popular and well-known one. It is very effective because it is early in the development process, but it also has some important caveats. Quality gates as part of a pull request should be fast, robust and easy to fix. Let’s have a look at these 3 constraints in more detail: The second location is a bit later in the software development process. This is after delivery, during the nightly build. At this location, there is less time pressure, which means we can focus on the slower metrics to be checked. The most important constraint at this location is that the extra check should have a lot of added value because if this gate fails it will go back to the engineer one or more days after his/her delivery. There must be a very good reason to demand repair that late in the game. An example could be a deep flow analysis that identified a memory leak or a null pointer exception, i.e. fatal errors that are hard to detect with fast tools."
