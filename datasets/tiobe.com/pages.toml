["https://www.tiobe.com/knowledge/article/code-quality-maturity-a-6-steps-guide"]
title = "Code Quality Maturity: a 6-steps guide - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. Where does your organization stand in terms of software quality maturity? Take a look at TIOBE’s checklist to find out! Achieving high software quality does not happen overnight. It is a long journey that should be taken step by step. At TIOBE, we defined a set of maturity levels to see where an organization stands in terms of software code quality. By going through this checklist, you can determine what your next step should be, and how to achieve it! For every level in the checklist, TIOBE has specific materials that can help you take the leap to the next level, so feel free to reach out to us if you need any help. Congratulations! You have done your first software code quality measurement! This is where your journey towards higher software quality starts. An ad hoc measurement give you a snapshot of what your code quality is like at a specific moment in time. There can be many reasons why you have performed this measurement: you are close to an important delivery and want to make sure that the reliability of your code is up to the mark. Or you want to spend a large amount of time refactoring, but want to know which parts of your code are the least maintainable before you start. Regardless of the reason, you now have tangible results that you can use to start with improvements to your software. Criterion: The Majority of your code is automatically checked on quality on a continuous (preferably daily) basis Now that you’ve made some improvements based on the first measurement, you want to know whether these improvements actually improved quality as a result. Has the refactoring actually improved maintainability? Has our reliability-score increased after solving these bugs? The best way to make sure that feedback on improvements is quick, is simply by doing a quality measurement on a daily basis. Every day, you can see the results of newly committed code to your overall quality. While the ad hoc measurements help with finding the hotspots that need attention, it is continuous monitoring that allows you to follow up on those hotspots and make improvements."
