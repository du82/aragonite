["https://tiobe.com"]
title = "Home - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. Software quality does not arise from simply running a code checker: it requires strategy, oversight, and the right tools. TIOBE serves as a partner for organizations that want to be completely unburdened in the software quality domain. We adapt our solutions to your organization, tools and specific technologies. The proverb “the proof of the pudding is in the eating” applies perfectly to software quality. Because only after a software product has been shipped, the true quality of a software product reveals itself. For this purpose, TIOBE has developed quality models to enable an objective, reproducible and independent statement of the quality of your software. Furthermore, we work with world-renowned certification authority TÜViT to further develop our models and provide certification. With our software quality framework TiCS we support software quality improvements from development to board level: from bit to board. TiCS provides a clear overview using multiple reporting and dashboard tools for every layer and team in your organization. We provide a smooth integration in your organization’s development process, and tailor our solution to fit your organization if required. Since code quality is quite a broad term, lots of measurements should be taken to determine the code quality of a piece of code. Possible metrics to be applied are unit test code coverage, the number of compiler warnings, cyclomatic complexity, etc. TIOBE offers a predefined set of 8 software metrics to get a good indication of code quality. See our TIOBE Quality Indicator Quality Model for more details. This is quite a difficult question because there are all kind of quality aspects to software code. These aspects are nicely defined in the ISO/IEC 25010 standard. It ranges from reliability (no bugs) to maintainability (is my code comprehensive)."
