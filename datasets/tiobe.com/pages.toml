["https://www.tiobe.com/knowledge/article/controlling-code-complexity"]
title = "How to Measure Code Complexity - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. Welcome to the third installment of our blog series on code quality! In our previous posts (which can be found here: demystifying code complexity and why it matters), we unraveled the intricacies of code complexity, exploring its definitions and why it’s crucial to measure. Today, we embark on a journey to discover how to measure code complexity effectively. In the realm of software development, objectivity is the North Star guiding decisions and strategies. Without accurate, reliable metrics, you’re navigating blindfolded, relying on intuition and guesswork. Objective measurement of code complexity is crucial for several reasons: Code complexity metrics are typically measured at the function or file level. Still, their true significance emerges when you consider them at the component or project level. It’s entirely plausible for specific files or functions to have high complexity figures, especially when they implement complex functionality. However, it should never be the case that all your files and functions exhibit high complexity. If that’s the scenario, it’s a clear indication of low overall code quality, and improvements are urgently needed. Choosing the right code complexity metric is akin to selecting the right tool for the job. It’s imperative that the chosen metric resonates with all stakeholders within the development organization and is measurable. Using a single agreed-upon Code Complexity metric helps align the entire development organization; it fosters transparent decision-making. Whether it’s prioritizing refactoring efforts, assessing code quality during code reviews, or making architectural decisions, a consistent metric provides clear data to support these choices. However, it’s essential to acknowledge that different projects and organizations have different needs and priorities. While some projects may prioritize maintainability and readability, others might prioritize high performance and efficiency. Therefore, the choice of metric should align with your project’s specific goals and the preferences of your development team."
