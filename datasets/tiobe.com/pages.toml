["https://www.tiobe.com/knowledge/article/software-quality-during-tenders"]
title = "Enexis - Software Quality During Tenders - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. As power grid operator, Enexis manages the infrastructure that allows for the of gas and electricity in the Southern Netherlands. Part of their grid are their smart-meters at customers, of which Enexis is having a new generation developed. As per usual with such a large development project, Enexis issued a tender. There was insufficient attention for software code quality in previous tenders. However, reliable and maintainable meter software is crucial for meters that will have to last at least 20 years. But how can you guarantee that software code quality is sufficient if the code in question hasn’t been written yet? TIOBE developed a Quick Scan for Enexis that could be performed that determines software quality during tenders, which made it possible for Enexis to assess which suppliers would meet their criteria before development even started. For Enexis it was very important that the party that would perform the measurements had the right expertise and experience, and was completely independent from the whole development process. Apart from the fact that TIOBE adhered to these criteria, it also played an important role that TIOBE has a model (based on previous measurements) that could easily be used to determine which quality scores the new meters should achieve to qualify for Enexis’ criteria. Using a standardized, internationally recognized model eliminates any discussions about interpretation of results, that might otherwise arise when a model is constructed in-house. During the performed quick-scans, TIOBE measured the following aspects of the available software at all participants of the tender: Based on these results TIOBE wrote a report with which Enexis could ‘attribute’ the selection criterion Software Quality in the tender process, and therefore take software quality into consideration in the assessment of suppliers."
