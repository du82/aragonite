["https://www.tiobe.com/about-us"]
title = "About us - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. TIOBE is specialized in assessing and tracking the quality of software. We measure the quality of a software system by applying widely accepted software metrics to it. TIOBE checks more than 1 billion lines of software code for its customers worldwide, real-time, each day. We measure software code quality with the goal to achieve a bug-free world through software quality expertise. TIOBE Software BV was founded on the 1st of October 2000 by Paul Jansen. The name TIOBE stands for “The Importance Of Being Earnest”. This is also the name of a play written by Oscar Wilde at the end of the nineteenth century. By choosing this name, the founders of TIOBE emphasize their sincere and professional attitude towards customers, suppliers and colleagues. Most employees of TIOBE are Masters of Science and/or have a PhD degree in computer science. We are applying state-of-the-art methodologies and technologies to support you. Paul Jansen (1967) graduated from the University of Amsterdam in computing science and philosophy (both cum laude). At Philips Research he was a computer scientist in the field of compiler construction and domain-specific languages. After a brief stay at Atos Origin and QA Systems, he founded TIOBE Software in 2000. Paul Jansen is the driving force behind the definition of the TIOBE Quality Indicator (TQI) and the famous TIOBE index that is published every month. Rob Goud (1983) graduated from the Technical University of Eindhoven in Computing Science and Engineering. After graduating he joined Everest as a business engineer and was involved in the development of several portal applications at Nationale Nederlanden. In 2007 he joined TIOBE as a senior consultant and was promoted to Chief Services Officer in 2012. As Chief Services Officer Rob is responsible for all TiCS installations and support activities throughout the world."
