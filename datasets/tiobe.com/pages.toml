title = "European Central Bank - Auditing Supplier Software Quality - TIOBE"
full_description = "Let op! Internet Explorer wordt niet meer ondersteund. Hierdoor kan de website mogelijk niet goed functioneren, gebruik een alternatieve browser om optimaal gebruik te maken van deze website. Klik hier om een alternatieve browser te downloaden. The European Central Bank (ECB) is responsible for monetary and financial policy within the Eurozone and one of the most prestigious financial institutions worldwide. Software development is not the focus of the ECB: they outsource the development of many of their systems to third parties. However, the ECB wants to make sure that after purchasing the software, it is maintainable enough to develop additional features over time. To make sure this is the case, the ECB was looking for an independent party to audit their software against industry-recognized standards. Together with TÜViT, TIOBE developed the TIOBE TÜViT Trusted product maintainability ISO/IEC 25010 Quality Model. This Quality Model enables organizations to audit the maintainability of their software in an independent and repeatable way. Based on the results of TIOBE’s assessments, TÜViT can issue an official certificate if the maintainability is above a certain qualification level. An independent assessment with an official TÜViT certification was exactly what the ECB needed. Based on the application domain of the software, TIOBE advised that the software developed by the ECB’s supplier should at least receive a C grade on an A to F scale to qualify as maintainable. TIOBE measured the ECB’s system on a set of 5 metrics to determine the software’s maintainability. This was Followed by a TIOBE report that included benchmarking statistics and advice on how ECB can best move forward with the system from a software quality perspective. The set of software quality metrics TIOBE used to measure the Maintainability, were the following: The software ECB scored a B-grade, which meant that TÜViT could officially issue a Trusted Product Maintainability certificate. The results also gave insights into how the software could be improved further."
