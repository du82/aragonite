title = "in every language there is a word for it | yours, tiramisu"
description = "I got back home Wednesday night. Dad is out of town for work and V has been at his girlfriend’s, so it’s just me and Mom in the house. It’s been relative..."
full_description = '''in every language there is a word for it 2024 Nov 23 Home, I said. In every language there is a word for it. I got back home Wednesday night. Dad is out of town for work and V has been at his girlfriend’s, so it’s just me and Mom in the house. It’s been relatively peaceful save for the verbal shellacking I got for gaining weight (sighs). Trust me, I want to lose it too. The post-breakup diet isn’t exactly known for being healthy. My mom cooks every meal when I’m at home. Per usual I’m catching up on eating all the things I can’t bring myself to buy and don’t know how to make, like blueberries, wild-caught salmon, golden kiwis, and homemade yogurt to name a few. But this time I find myself especially appreciating how my stomach feels when I’m at home eating her cooking. Her healthy portion sizes bring gentle tides of satiety and hunger. I eat until I’m no longer hungry rather than uncomfortably full; as a result, when meals come around I’m hungry enough to fully enjoy them. In contrast, when I’m on my own I swing wildly between extremes. I skip meals out of laziness or a desire to lose weight and then my extreme hunger causes me to overeat at the next meal or binge snack late at night. Here, I’m eating three square meals a day with all sorts of fruits and veggies and my body can finally return to equilibrium. Physical benefits aside, It is also so nice to just not have think about when or what or how much I’ll eat. While I already feel better physically, it’s easier for me to languish emotionally at home, because I don’t have (as many) chores or going to the office to rouse me out of my catatonia. I’ve spent the past few days mostly in bed playing Pokèmon. I saw D yesterday which was nice and went to a family friend’s house for hotpot today, but other than that I’m rotting away sixteen hours a day. I feel soft and mired in self-pity and hurt. Seeing friends helps but doesn’t change how comfortable I am lying in bed and staying in my room all day. Speaking of Pokèmon, I beat my first Pokèmon game! (Pearl, if you’re curious, emulated on iPad.) I’m very proud, actually; it’s an achievement more than fifteen years in the making. When I do stuff like this — play the games and watch the movies and shows I wasn’t allowed to as a kid — I feel like I’m living some of the childhood I missed out on. Sometimes I wonder if I’d be a different person today if I grew up with (e.g.) the Studio Ghibli movies in my heart, rather than the fluff and cobwebs I think I must have had from being so culturally deprived growing up. A few people have asked me if I’m getting anything for Black Friday. I’m trying not to. After I got home I went through the closet in my room and felt ashamed coming across items of clothing in there that I didn’t even know existed, that I couldn’t remember wearing or even seeing before. Why am I still looking for deals on pants when I have four perfectly good pairs at home? I suppose it’s a sign of growth that what used to be my favorite holiday is now one I try to avoid. At our family friend’s house I got to meet D’s older sister, who’s ten years older than Mom. She herself grew up in China like my parents; unlike them, she twice married Americans, neither of which speaks a lick of Mandarin. I’m always fascinated by relationships where one partner isn’t at a native level of fluency in the language they use to communicate. How do you make things work? I already feel challenged enough in relationships with people that speak the same language(s) as me, frequently stifled by the inadequacy of words. (How odd I can have all this inside of me and to you it’s just words.) Do I demand a higher fidelity of conversational precision than the average person? And does this even help me at all? D’s sister seems happy enough in her marriage, so clearly not everybody needs or wants what I do. It’s almost 1 AM! One more thing—I had my second performance evaluation today, and it went well! I can’t believe almost six months have passed since I started. I’m starting to realize that the way I perform at work is a vicious cycle, for better or for worse. If you praise me for doing well, I’ll want to continue pleasing you, and work harder as a result. The same goes for how much I get along with my teammates. If I like them initially, I’ll be in a better mood when I talk to them, which I’m sure makes me easier to be around in turn. My last job was an example of this working to my disadvantage. It’s nice to feel the opposite for a change: I want to work harder because I like the people I work with, and I want to please them! That’s all for tonight. I’d been putting off writing but I think my brain would have exploded if I’d let all these thoughts bounce around any longer. I’m going to be okay! I have no choice, anyway. #english #home #wordvomit 9 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
