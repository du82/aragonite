full_description = '''大连 photo dump 2024 May 23 High speed rail Took high speed rail to 大连. Train cars are very clean, though the tickets weren't cheap by Chinese standards. I love all the sightseeing you can do from trains. We passed by lots of rice paddies and other fields. You also get a quick view of each city and its outskirts as you pass by. The stations in big cities are very nice. Can you spy the Lawson? The view inside Anywide, a Chinese convenience store. You can get steamed buns (包子), 饼, and even 茶叶蛋 (tea eggs). The onigiri from a Chinese Lawson. Instead of kombu and mentaiko and tuna mayo, the Chinese ones have fillings like tomato sauce and beef. The rice in the Chinese ones is stickier. I much prefer the Japanese ones, though it's hard to complain when they're 4 rmb each (about $0.50). 俄罗斯风情街 （Russian Folklore Street）(Cool article which talks about what's happening to 大连 (Dalian).) You can see glimpses of the construction going on in this photograph. Construction or not, I don't recommend coming to this street. There's not a whole lot to do and everything there is blatantly pandering to tourists. It was very dead when we visited. 威尼斯水城 (Oriental Venice Water City) Venice homage, with gondolas and gondoliers with striped shirts and red hankies tied around their necks. Visit at night; it's dead during daylight hours. Seagulls swarm the pier outside the Venice water city because people insist on feeding them. There are some cool souvenir shops inside the Venice water city (ugh, I hate its English name). You pay tourist prices, though. 星海广场 (Xinghai Square)This is apparently the biggest city square in the world. Which, when you're actually there, doesn't feel all that impressive. It's just a big roundabout with grass and sidewalks in the center. You can't really see it here, but this is actually a huge skate ramp, probably the largest, most stretched out half pipe I've seen. (Notice the concrete curling up at the edges of the photograph.) It took me all of one minute to get told off by the megaphone-toting policeman for climbing all the way to the edge to look over. I did not spot a single person on skateboard. A small amusement park overlooks the bay. Pedestrian bridge bringing you to the restaurants and hotels which overlook the bay & Square. The Square is very pretty at night when all the city lights are on. The building on the left which looks like a shell is actually the Dalian Shell Museum. 老虎滩渔人码头 （Fisherman's Wharf）This is supposedly modeled to look like a fishing town from the American northeast. Yes, if you're counting, that is the third big tourist attraction that is designed to look like something else. (Sighs.) There are lots of people selling seafood and corn grilled over coals here; I don't have any photos of them because I felt bad taking a pictures without buying anything. You can get live fish, octopus, squid, sea urchin, even starfish straight from Styrofoam boxes filled with seawater. The vendors grab flailing fish and squirming octopi and throw them directly onto hot grills. I know they do that to show you how fresh the food is, but I rather like octopi and couldn't stand to see them die, so I settled for corn on the cob. (I couldn't stop thinking about this Netflix documentary I really like.) 西安路商业区A bustling nightlife street. Misc Mom's friend's laughed at me when I told them I had 凉皮 (spicy cold skin noodles made of wheat or rice flour) in 大连, a city famous for seafood. I just really like 陕西菜 (Shaanxi cuisine). Dalian public transit is very nice. We took the subway and the bus, both of which were impressively clean and dependable. You do have to go through a metal detector to use the subway. There is no way McDonald's put exercise bike tables in their stores. Could you imagine this in America? Mom says Americans freak out about frivolous things. #china #english #travel #wordvomit 9 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
