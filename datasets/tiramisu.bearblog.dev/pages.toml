full_description = '''tokyo, day 3: roppongi, harajuku (again), lidabashi 2024 May 22 The National Art Center Tokyo is in Roppongi. You pay per exhibit. A few are free. I regret not seeing the Matisse exhibition; he's one of my favorites. At this point we were all running on fumes. I would have liked to explore Roppongi more, if only to see more cool architecture. We were only in Roppongi because my brother wanted to see Tokyo Tower. You have to pay to get up to the observation deck but it's well worth the admission, in my opinion. The views are incredible. We visited 鰻の成瀬 六本木店｜Naruse's Unagi Eel Restaurant Roppongi for lunch. It's very popular among tourists and thus has English everywhere. Food was delicious (unagi is one of my favorites). Apparently there are other outposts in Tokyo, so we needn't have come all the way to Roppongi for this. Oh well. HarajukuMum & V wanted to see the Imperial Palace and I wanted to see Meiji Jingu instead, so we split up after lunch. I'm glad I did. Meiji Jingu is surrounded by a heavily wooded park, which makes for a lovely stroll to the shrine. I spent about an hour all told. There are no photos allowed once you walk up to the actual temple. Inside there were some people cleaning up and doing who knows what. Outside, as with the temple in Asakusa, you can buy trinkets and good luck charms. No incense here though, if I remember correctly. Most people walk up to the temple, bow a few times (as suggested), and toss some change in the designated receptacles for good luck. I watched them prune this tree for a good 10 minutes. There are four or five men in the tree and they cut, prune, and shake branches to remove dead/loose leaves. Some tourists took fallen branches as souvenirs. At this point I could hardly stand so I spent a few hours sitting and reading in the IKEA food court. Ah, I love traveling alone; you don't have to answer to anybody. This awful IKEA matcha mont blanc makes me want to try one from an actual dessert cafe to see what it's supposed to be like.. lidabashiI got to a lidabashi with a few hours to kill before my dinner plans with a friend. I was surprised to find the area (Kagurazaka) filled with little shops. My friend later told me that the main street in Kagurazaka is a popular tourist destination. It is a wonderful place to wander and spend an hour or two. We waited in line for almost an hour to get dinner at Nihonbashi Kaisen Don Tsujihan Kagurazaka. Their seafood donburi is delicious and very affordable. Highly recommend if you can get there before it opens to avoid the queue, and don't forget to bring cash. Inside it's very intimate, with a narrow counter seating about 10 like an omakase restaurant. The expectation is that you order, eat, and leave quickly. You start off with some barley tea and sashimi. The helpful instructions say to leave some of the sashimi for the last stage of the meal. I ordered the Take course (1650 yen), which includes salmon roe, tuna, nakaochi, whelk, geoduck, squid, herring eggs, cucumber, green onion, along with extra crab and salmon roe all over rice. It was delicious. I'm salivating just writing about it. After you're about a third of the way done you put your bowl up on the higher counter so the chef can fill your bowl with sea bream broth. The broth is very light and delicate. You can also have extra rice added at no additional charge. #english #japan #travel #wordvomit 7 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
