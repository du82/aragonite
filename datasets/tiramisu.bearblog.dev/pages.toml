description = "Before he moved into our current spot, J used to live on the other side of the Hudson, in Hoboken. I stayed with him a few times while visiting and so ever s..."
full_description = '''the best mutz in hoboken 2024 Oct 12 Before he moved into our current spot, J used to live on the other side of the Hudson, in Hoboken. I stayed with him a few times while visiting and so ever since I moved in we've both been talking about going back to visit. You know, to bathe in the memories at our old favorite spots and see how much has changed. In the morning instead of going to Hoboken directly we got off PATH a stop earlier in Newport to meet E and her boyfriend (who live in Jersey City) at Kura Revolving Sushi Bar. Recently I've been learning how to express my opinions with more tact so I'll just say I was glad I ate breakfast before. It was nice to see E again after a few weeks, though — there's always plenty of tomfoolery to go around when J, E, and I are together. Since today was my first time in Jersey City I intended on wandering around and getting to know the city a little bit, but after only about half an hour of walking along the waterfront I felt a heavy fatigue settle in my limbs. I feel bad when this happens, especially when I'm with someone else and they have to slow down to my pace and wait for me when I sit down and wait for feeling to come back into my calves. I can sense when sometimes people don't understand what this fatigue feels like and it certainly doesn't help that I can't explain it either; I can only assume it comes as a side effect of one of my medications, especially because I've been resting adequately of late. What I do know with certainty is that my desire to walk everywhere and see everything hasn't waned; my body simply can't keep up anymore, I'm afraid. I gave up on forcing my body to walk all the way down to see the Colgate Clock (maybe next time — the photos actually look pretty cool) so we took the light rail up to Hoboken in the early afternoon. The light rail dropped us off at the Hoboken train station, which I was surprised I'd never seen before. It's very neat. I love Hoboken. The difference between its quiet tree-lined streets feels stark coming not just from Manhattan, but also from Jersey City, where most of the buildings are high-rises. I love that the buildings along Washington Street vary in height and architectural style and house shops and restaurants at street level, even if that means seeing Starbucks and Soulcycles inhabiting majestic carved stone buildings that used to house banks. I love the conspicuous absence of the elevated train's metallic scream. J says he can feel the difference in the air quality too. All this, plus the wide sidewalks and the families ambling on it, the narrow, low-velocity streets, makes for a wonderful place to walk and wander around. I've been telling A I wanted to take her here sometime and I had worried what to show her but being back here puts me at ease. It's just a nice place to spend a few hours and unwind. One of J's favorite pizza places in Jersey City is Basile's. For many reasons (primarily health-related), it's probably not somewhere I'd go if I lived nearby, but J introduced me to it last year, and as it happens I find their thin crispy slices (~$5/ea) as good as he does. ("A true New York slice," J said, even though we were in Jersey.) This is why I jump when friends offer to show me around their neighborhoods — they inevitably end up with favorites that I might have missed or not even noticed at all. How nice it is to see the world through someone else's eyes! We cleaned up the greasy mess with a (rather large) lemon Italian ice from Rita's down the street. I like to think of myself as someone with decent self-control when I'm out — I don't usually buy things impulsively simply because I want them — but Italian ice is a notable exception. I get it almost every time I see it, and since today was unseasonably warm and sunny it was a no-brainer. I'm happy to report I have no regrets. "I'm not allowed to get more vinyls," I said to J as we walked into Tunes. He laughed and we split up to browse. I squatted to peer into the dim unorganized crates of the classical section. "No way—" I said it so loudly J came over from the popular music section to see me ogling at a record of Alicia de Larrocha playing Granados's Goyescas. "You're not even through one crate yet." "I must get this." I tucked the Goyescas away in a corner before eyeing the Tchaik 1 in my hand. "I suppose one more couldn't hurt." By the time I'd gone through the four crates of classical records my knees were screaming at me. Sometimes it makes me a little upset to see the classical music section relegated to the worst places in the store (the disrespect!) but I also recognize that's the reason I can score my favorite records in near-mint condition for less than the price of a coffee. You can't have it all. J waxes poetic about the Italian sandwiches he used to get in Jersey at every chance he gets. His favorite spot is Vito's. Vito's storefront boasts the best 'mutz' (the Hoboken term for fresh mozzarella) in town. I groaned with pleasure after every bite. The mutz is soft yet fun to tear into; its delicate creamy saltiness pairs beautifully with pesto and peppers in the sandwich. I miss it already! I'll be back soon, Hoboken. #cities #english #food #friendship #music #wordvomit 9 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
