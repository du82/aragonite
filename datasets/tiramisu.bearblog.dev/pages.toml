title = "tokyo, day 2: asakusa, oshiage, shibuya, harajuku | yours, tiramisu"
description = "I saw this shop selling onigiri made to order on a vlog! It was a stone's throw from where I stayed. Ordering was difficult because the entire menu i..."
full_description = '''tokyo, day 2: asakusa, oshiage, shibuya, harajuku 2024 May 22 Onigiriya Shichiroka Japan, 〒103-0013 Tokyo, Chuo City, Nihonbashiningyocho, 3 Chome−5−6 榎本ビル 1階 I saw this shop selling onigiri made to order on a vlog! It was a stone's throw from where I stayed. Ordering was difficult because the entire menu is written in Japanese. I Google translated it ahead of time but the owner had a bunch of follow-up questions (do you plan on dining in? which onigiri fillings / sides do you want?) and he didn't seem keen on speaking English so we just repeated the same things back and forth to each other. (I was so uncomfortable!) Cash only, as is the norm for small hole in the walls like this. Handmade onigiri are better than their konbini counterparts. The ones I had were much bigger, boasted warm rice, and commanded a higher price tag which I think is worth it. I can eat three or four konbini onigiri for breakfast; I was full after only two of these big ones. The sides I opted for were tamago (sweet Japanese omelet) and pickled mushrooms. The mushrooms were very salty, as was the miso soup that came standard. In general, I found Japanese leaned salty. I'm sure it uses about as much salt as its Asian counterparts, but because the dishes are often so simple the saltiness stands out. E.g. Korean food usually has the acidity (like pickled vegetables) and sweetness/spiciness (gochujang) to mask the salt. The daily set breakfasts are for dine-in only. (I think? The menu seems to indicate that there are set breakfast options you can order for take out, but that's not what I understood from our interaction. Who knows.) The entire space inside the restaurant for guests is about ten square feet, and there are only two tiny tables with stools, so be sure to pay attention to that before ordering. AsakusaWe headed to Asakusa after breakfast. The first thing that will greet you as you head to Nakamise-dori street from the subway station is this big ol' lantern, which Google Maps tells me is called Kamanarimon. The lantern is part of the main gate of Sensoji Temple, connected to the main hall by the shopping street. I am not sure you are supposed to touch that lantern, sir. (sighs) We arrived so early the shops weren't even open yet! This is why you should plan ahead. That did allow us to visit Sensō-ji without being too harassed by other tourists, though. Leading to the entrance of the temple there are little stores where you can buy little trinkets which deliver certain kinds of good fortune, like traffic safety, divine intervention, and romantic/financial success, among many others. Generally, the larger the good fortune promised, the more expensive the trinket. (Divine intervention was like $30 or something, I think? Now that I think about it, that's pretty cheap for a favor from the person upstairs.) You can find the same stores at other popular shrines and temples in Tokyo, so don't fret if the line is long. Something else you can find at other temples is a place to wash your hands and face to cleanse yourself before visiting the temple. At this point it feels like no trip of mine is complete until I see a Chinese grandma drink and fill up her water bottle from somewhere they are most definitely not supposed to. (Head in hands.) Apologies for the terrible photo — I was too shaken by the aforementioned grandma to get proper framing. At the actual temple you can pay 100 yen (about a dollar) to draw a stick and get your fortune. Mine was surprisingly not bad, for once? What the hell does Recover from sickness, but if careless, might be serious mean? Why do you have to ruin a good fortune like that? Not to worry if you're unlucky: if you draw a bad fortune you can tie it up on one of the wires next to the fortune stands to banish it and pay 100 yen for another one! Seeing capitalism survive in even the most spiritual of places warms my heart, I tell you. The stores were mostly opened by the time we had finished wandering the temple and the surroundings. They're very touristy too, selling mostly expensive trinkets and traditional sweets that (no offense) don't taste very good. Your time is better spent wandering the surrounding streets. I regret not getting anything from Komugi no Dorei (bakery specializing in melonpan), Asakusa Unana (unagi onigiri), and Kotobuki-sei-an (matcha tiramisu!!!!!!), among others. I ate too many onigiri and 7-11 baked goods to be able to stomach anything else that early, sadly. Many of the stores don't open until 11 either, which sucks because by that time the main market street is swarmed with tourists. You can't have it all, I guess. My foolish brethren and I lining up to pay $3 for a singular strawberry. Look at this adorable fella I found outside the matcha tiramisu place! It's tucked in a narrow alley. I love how so many streets in Japan are human scale. The occasional car does drive through, but the lack of space means they do so slowly. Japan has vending machines that serve fresh squeezed orange juice. I cannot express how jealous this makes me. There is a small FLOWER MIFFY shop by the Asakusa station. I am obsessed — two of my favorite things! To this day I cannot believe that Miffy is Dutch. She's everywhere in Japan. I cannot believe I forgot to visit the Asakusa Underground Street! I was really looking forward to going. Though it probably would have been dead at the time I went anyway, who knows. Oshiage (SKYTREE)The Tokyo Skytree is a convenient two metro stops away from Asakusa. My brother dragged us here, and I'm glad he did! Even though none of us went up to the observation deck (it rained every day we were in Tokyo), we still managed to spend a solid two or three hours resting and browsing the many floors of the mall. There was a Taiwanese food festival happening at the outdoor picnic area of the Tokyo SKYTREE. A real Miffy store! There is also a PEANUTS store in the SKYTREE mall. Even after the Mitsukoshi Ginza food court, the SKYTREE counterpart holds up. There are fewer vendors, but they're spaced out more and the salespersons aren't as aggressive, which made it easier for me to settle on something. I chose a Hokkaido chiffon cake from Hokkaido Milk Company which was delicious. I highly recommend getting a bite to eat here and browsing the stores if you get rained out (or even if you're not). While walking through the food courts at the Mitsukoshi Ginza and the SKYTREE I wished I could vlog the whole thing. I am at a loss for how to properly convey how overwhelmed I felt (in the best way) browsing all the stores through mere words and photographs. My family and I are allergic to eating inside malls so we had lunch at Kamimura Soba House. The restaurant was completely empty aside from us and the food forgettable. Oh well, at least the owner was nice. Cash only, again. Shibuya & HarajukuAfterwards we took a long metro ride to Shibuya, which spits you out at the Scramble Crossing. I took a moment to observe the hordes of people lining up to take pictures with the Hachiko Memorial Statue before visiting Tower Records Shibuya per recommendation of a fellow Bear blogger! Sadly, Mom and V dragged me out after mere minutes because they weren't interested in looking at records, but I liked the little I saw. If my memory serves me correct there is a sizeable food court in Shibuya station too. The prices seemed okay. Looking back I missed a bunch of bookmarks in Shibuya. Uobei: Conveyor belt sushi. Can you believe I did not have any sushi in Japan? Or ramen or gyudon or teppanyaki or okonomiyaki or yakitori? Yeah, I don't know what I was doing either. Shibuya Parco: I'm not too miffed about missing another mall but this one does seem cool. Pork Vindaloo Taberu Fukudaitoryo: Michelin Bib Gourmand Indian food in Japan! Mum vetoed it; she hates Indian food. MEGA Don Quijote: I went to a different Don Quijote, but this one is biiiig. Barefootinc Japan 東京店: A store specializing in barefoot shoes?! A dream come true for me, though sadly one a bit too far from the beaten path. I made a beeline for Miyashita Park. It was a letdown. There's nothing there, and the Studio Ghibli store I wanted to see (GBL MIYASHITA PARK店) was small and hideously overpriced. (What did I expect?) The rooftop park was deserted, maybe because it was partially underwater. There's this cool alley of yakitori bars attached to the side of Miyashita Park. Okay, there was a Hightide store (stationery) which had this PEANUTS popup. And the Tom & Jerry popup below. Not all was lost at Miyashita Park. We walked over to Harajuku to see Takeshita Street, another shopping district like Tsukiji and Ameyoko. Compared to those two, this one had a DAISO, more cosplay stores, and animal cafes (which I did not see at the other ones). You can pay money to hang out with dogs, cats, and — if you're more ambitious — snakes, ferrets, capybaras, and meerkats. I am admittedly not a fan of the idea of paying money to harass animals. Other than that there's not much to do in Takeshita street and I was out within an hour, about a third of which I spent inside DAISO. A dreadful picture of the start of Takeshita street. This donut shop had a long line every single time I passed by. No amount of hype can get me to wait in a line behind thirty other people. #english #japan #travel #wordvomit 5 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
