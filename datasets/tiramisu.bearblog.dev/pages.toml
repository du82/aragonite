full_description = '''what i'm grasping for is not a place, but a feeling 2024 Sep 11 I want to go home, I want to go home, but what I mean, what I'm grasping for, is not a place, it's a feeling. I want to go back. But back where?1 It's ten in the morning. I'm sitting on a wooden chair in my room. A breeze brings a hint of fragrant morning dew through the open window. The robins are screaming their good mornings and the first maple leaves are starting to burn mauve and brown and let go of their branches. I slept wonderfully last night — a deep, dreamless slumber — and while that is likely the result of accumulated sleep debt, there is something about this place that puts me at ease. I love the chorus of cicadas and crickets, the verdant air, the quiet rush of cars passing by, the caress of my velvet bedspread, the pale yellow walls surrounding me, even the intermittent buzzing of the gadget in the backyard which is supposed to deter moles from tunneling through our carpet of Bermuda grass. You're finally home, they whisper. My parents are finally empty nesters now, and the house reflects it. I can't ever remember seeing the upstairs bathroom so bare. Last night while getting ready for bed I had to go downstairs to get contact solution, toothpaste, floss, all things I expected to be waiting for me like they had for the past twenty years. It makes sense why they've cleaned it all up since everything they use is in the master bedroom now, but it still feels a little weird being a guest in my own home. Every time I come home after a long time away I'm struck by its peculiarities. The counters are unusually low, maybe because the last family that lived here built them to be more kid-friendly. I have to bend over more than I'm used to to brush my teeth or wash my face. Other remnants of the previous dwellers live on too. My walls are the same pale yellow they were when we moved in. The painted wooden fish hanging above my windows must have been there for decades now, I'm only realizing. None of us are really the decorating type so we live very lightly here, leaving most of what was and hardly making any embellishments of our own. I have always been this way with the places I've lived: you can hardly tell I've been there after I move out. I catch up with Mom over savory steamed egg custard, peanut sesame flatbread, bulbous blueberries, and homemade yogurt. The sounds of Dad's conference call float over from the living room. My mother tongue is rusty from disuse, but I can feel it coming back as I override my instinct to respond in English, instead forcing my thoughts through the slow gears. As I gather my plates and put them in the sink Mom asks if I have a girlfriend yet and I laugh. It's the first time she's asked me that before my blood pressure or my weight. thanks eve for sending me this!↩ #english #family #home #wordvomit 16 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
