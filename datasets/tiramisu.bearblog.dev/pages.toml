["https://tiramisu.bearblog.dev/2024-election-postmortem"]
title = "the pangs of your sadness will pass as your senses will rise | yours, tiramisu"
description = '''My boss took the day off today. "I won't be able to focus," she'd said. It sounded like a good idea when I heard it, though now that I'm in the office, I...'''
full_description = '''the pangs of your sadness will pass as your senses will rise 2024 Nov 06 "I wish it need not have happened in my time," said Frodo. "So do I," said Gandalf, "and so do all who live to see such times. But that is not for them to decide. All we have to decide is what to do with the time that is given us." My boss took the day off today. "I won't be able to focus," she'd said. It sounded like a good idea when I heard it, though now that I'm in the office, I'm glad to be here. I'd be doing my head in at home without something like work to distract me. She must not have been the only one with that idea, because the office is eerily quiet today. People greet each other with shaking heads and long hugs and soft words of sympathy. "Can you believe that they'll teach this in government class someday?" J asked me this morning. I could not in 2016 and still cannot. The wildest thing I remember learning about in civics class is the journalist that threw his shoe at Bush during a press conference. I've become so desensitized in the years since, I can't imagine what would have to transpire for me to bat an eye now. You know how you don't get to choose your memories, but rather they choose you? I still remember exactly where I was in 2016, gaping at the election results in the morning before school. I feel like this morning will be the same for me. Back then I was shocked that something I'd not even entertained as a possibility had actually happened; now I'm shocked that something I feared was possible happened. I was worried about this outcome enough to ask my parents if they were going to vote. Neither of them did. "It won't matter who wins," Dad said, as I struggled to contain my frustration. It's still hard for me to not get worked up at them for not voting, though I'm not sure whether I have a right to be. It's hard to write in the aftermath of something like this. What is there even to say, really? Do words even matter when it feels like the world is falling apart? A invited me to an election watch party at her place last night. I couldn't go because I had a class to teach and a game to play in. On my way to the field J asked me why I agreed to play in a 10 PM game an hour away from my place, to which I replied that I needed the serotonin boost. I hadn't left the apartment all day. I felt vindicated after the game, a 10-6 win against a much larger team. Perhaps because I didn't have time to warm up properly, my knees feel stiff and swollen even now, a day later. It makes me sad when my body revolts against what my mind wants to do. Stiff knees one day, tight adductor another. I've half a mind to stop playing soccer altogether before I injure myself more seriously but it's hard to even think about letting go of one of my surest sources of joy. I reached out to a physical therapist to see if he can help me. Before I left for my game at 9 I checked the early election results and it was already looking grim. When I got home around midnight it was already a foregone conclusion (92%, I think?), but that didn't stop me from tossing and turning my way through surreal dreams that one side or the other had won. Between the election and everything else that has happened in the last few weeks, my brain is having to do lots of gymnastics to avoid thinking about everything. The title of this post comes from To Ramona. #english #wordvomit 12 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
