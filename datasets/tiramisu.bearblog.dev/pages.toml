full_description = '''沈阳 photo dump (mostly 老北市) 2024 May 23 Some photographs from the Chinese city of 沈阳 (Shenyang). I could spend all day browsing these five-story malls. This one boasted restaurants, cafes, daycares, basketball courts, go-karting, and live fish. Fine dining in 沈阳. These are the food models in the lobby. Outside the frame, my mom is fighting with my aunt and uncle-in-law first to pay the bill, and when she loses that battle, to order fewer items. Lots of 客气 to go around. Although it may look the part, those flowers are not lavender. You can't see it here, but the whole time we were in Shenyang it looked as though it were snowing. I later learned that the "snow" was actually the seed hairs of the willow and the poplar trees. It looks cool until the fuzz gets in your eyes, on your clothes, everywhere. (source) 老北市A popular night market in 沈阳 which runs every night. If you're there at the right time, you can catch the show with flying drone-powered phoenixes shooting fireworks from their wings. Sadly I don't have any good photos of that show — my senses were overwhelmed for most of the night (in a good way). Night markets have been ruined for me forever. How can anything measure up to that? Not to mention we passed two markets en route to 老北市 that also looked better than anything I'd ever seen. #china #english #travel #wordvomit 23 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
