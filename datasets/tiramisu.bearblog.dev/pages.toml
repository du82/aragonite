description = "Today is our last day at the grandparents’ house. Tomorrow we take a taxi to the city we flew into and we’ll spend the day and night there before departing i..."
full_description = '''even the dustiest of streets has a place in memory 2024 May 17 Today is our last day at the grandparents’ house. Tomorrow we take a taxi to the city we flew into and we’ll spend the day and night there before departing in the morning. Mom is in her parents’ bedroom with Grandma and Grandpa. She’s sharing photos of us to Grandma and showing her how to download them to her tablet. I laugh as Mom gets frustrated with Grandma’s technological ineptitude. It’s her turn to teach technology to a Boomer. Earlier I mustered up the courage to wander a little further from home than normal. I walked all the way to the train station and park in the center of town. I’m glad I did, because I saw a lot of things I hadn’t before. As the sun dips below the horizon vendors set up tables in front of the supermarket. They sell a wide assortment of wares. Cages with corgis, rabbits, mice, parakeets, and chicks. Tanks and buckets teeming with crabs, frogs, fish, shrimp. Corn and skewers of lamb darkening over coals that pop with drops of grease (grilled corn is surprisingly delicious). Little copper and bamboo trinkets. Barberry and Luis Voitton [sic] handbags. USB-C charging cables. Knockoff shampoo and soap. And knickknacks of every kind, things you wouldn’t ever think to buy on the street. I spend a few minutes petting a corgi who melts my heart. No animal should be kept in a cage like this to be sold. I want to set them all free, even though I know that will only make the problem worse. The local park is packed with the elderly singing, dancing, and working out. I make my way over to the high bar at the outdoor gym, one of the few places I feel truly at home. In between sets of muscle-ups and pull-ups I spectate a circle of middle-aged men and women play 毽子. They’re unbelievable. The shuttlecock hardly touches the ground. They even let the shuttlecock fly over their head so they can bend over and kick it with their heel behind their back, a maneuver as difficult and unnecessary as it is flashy. Who doesn’t like a bit of flair? (I wish I asked to join them, but I’m shy and I didn’t want to ruin the rhythm of their game. I might get one for myself back home. I just wish I had someone to play with!) A man working out on rings approaches me to ask me if I’m ex-military or a cop. (Cue laughter.) I try not to let on that I’m not a local, but he’s insistent in asking me where I train, so I confess that I’m not from around here. I’m happy to see his surprise: it’s nice to know I can blend in here, even if only on the surface. Mom and Grandma are arguing about something now. They’re mad at my cousin and aunt-in-law for not footing the bill for any of my uncle’s medical expenses. They went straight to my aunt to ask for money, who paid for everything without hesitation. (A saint!) I’ve picked up on so much internal family drama this trip. It’s sad — money (or greed) is to blame for just about every single family grudge. Mom always tells me the same thing: don’t lose your friends and family over something as silly as money. It’s not worth it. Some things in life you can’t buy. The words mean more coming from someone I know values money, the very same woman I watch count out every last penny of change at the supermarket checkout. Even though I’ve not a single friend within the dusty city limits, I’m going to miss being here, surprisingly. I wish I could stay longer, even if I’m looking forward to putting some space between my grandparents’ nagging and their rock-hard mattresses. There’s so much left here for me to try, to learn. So many dogs to pet, so many skewers and bowls of noodles to try, so many signs to read, so many locals to talk to. I hate to leave it all behind for more comfortable pastures. #china #english #life #travel #wordvomit 12 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); cons