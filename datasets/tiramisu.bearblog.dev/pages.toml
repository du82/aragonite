["https://tiramisu.bearblog.dev/2024-tokyo-0"]
title = "tokyo, day 0-1: ginza, tsukiji, ueno | yours, tiramisu"
description = "I'm feeling lazy, so the travel recaps I'm going to do for this trip are going to be less thorough than my usual fare, more like annotated photo dumps than a..."
full_description = '''tokyo, day 0-1: ginza, tsukiji, ueno 2024 May 21 I'm feeling lazy, so the travel recaps I'm going to do for this trip are going to be less thorough than my usual fare, more like annotated photo dumps than anything. I hope they're still fun to scroll through and read! We flew ANA from LAX to Tokyo and United Airlines on the way back. The ANA meals were more Japanese and tasted better than the UA ones. I noticed the Rolls Royce logo on the turbines on of our plane. Maybe they manufacture them? My first photograph in Japan! No surprise that it's of public transit. I love how accessible and easy to use the metro system is. The subway cars are unbelievably clean and well-designed. GinzaI spent my first day in Ginza, near where I stayed. Ginza is cleaner, glitzier Fifth Ave: lots of luxury stores and boutiques, not a lot in the way of (relatively) cheap eats or hole in the walls. Fortunately, food in Japan is still relatively inexpensive across the board, unless you're going out of your way to eat high-end meat or seafood (or fruit!). That said, my recommendation if you ever find yourself in Ginza is to get out and go somewhere else. Godaime Hanayama Udon Ginza 3 Chome-14-13 Ginza, Chuo City, Tokyo 104-0061, Japan Stumbled into this place after going to the Pokemon Store. The GMaps description says it all: "elegant, traditional-inspired space for wide himokawa udon noodles, served in soups & with tempura." I really liked the chilled wide udon noodles. It's very light fare served in a relaxing atmosphere. Tsuru TonTan UDON NOODLE Brasserie MARYNA Japan, 〒104-0061 Tokyo, Chuo City, Ginza, 5 Chome−2−1 東急プラザ銀座 10階; Floor 10 of Tokyu Plaza Ginza The spicy mentaiko udon I ordered here disappointed me. I was surprised to see that they let you modify your noodle portion to 1, 1.5, 2, or even 3 servings without added charge, though. Ginza Fukurokuju 2 Chome-8-8 Ginza, Chuo City, Tokyo 104-0061, Japan I had a hankering for kakigōri (かき氷) after dinner and found this cafe which serves it. I liked the peach and white yogurt one I got, though it was huge and the cafe mandates that everyone order their own. How are you supposed to finish this on your own? It's the size of a soccer ball! I couldn't finish and fretted about offending the waitstaff. Pokemon Center Tokyo DX 髙島屋S.C.東館, 5F, 2 Chome-11-2 Nihonbashi, Chuo City, Tokyo 103-0027, Japan A bit disappointing, honestly. I thought there'd be more experiences for Pokemon fans. It only really has Pokemon merch (plushies, stationery, etc) and a few gachapon machines. Uniqlo Ginza Flagship Japan, 〒104-0061 Tokyo, Chuo City, Ginza, 6 Chome−9−5 ギンザコマツ東館 1－12F Uniqlo is much cheaper in Japan than it is in the US. Bring a foreign passport and enjoy tax-free shopping on most items. Many big retails often have deals too for tourists (like 5-10% off). GU - Ginza store 5 Chome-7-7 Ginza, Chuo City, Tokyo 104-0061, Japan Not nearly as great as the Uniqlo store nearby. ⭐️ Mitsukoshi Ginza 4 Chome-6-16 Ginza, Chuo City, Tokyo 104-8212, Japan The food court at this department store boasted a dizzying variety of food. Everything looked amazing and was presented like art. Highly recommend, even if you just browse like I did. Sanrio World Ginza Japan, 〒104-0061 Tokyo, Chuo City, Ginza, 4 Chome−1−先 西銀座 2F Ginza Itoya Japan, 〒104-0061 Tokyo, Chuo City, Ginza, 2 Chome−7−15 12F Famous stationery store. I didn't get as much time as here as I wanted; of the 12 floors, I only got to walk through 2. TsukijiTsukiji Outer Market Japan, 〒104-0045 Tokyo, Chuo City, Tsukiji, 4 Chome, 及び６丁目一部 This used to be the place where you could watch fishermen auction tuna. These days it's been converted entirely into a market catering to tourists. There were more foreigners than actual Japanese here, and the prices were the highest I saw anywhere in Tokyo. In Tsukiji Uogashi - Odawarabashi Building there are a few vendors still selling seafood (though nothing close to the same scale as the original Tsukiji market), as well as a nice food court and rooftop area to enjoy your vittles. UenoAmeyoko Shopping District 6 Chome-10 Ueno, Taito City, Tokyo 110-0005, Japan A lot to see here. Still touristy, though not quite as much as Tsukiji. Fun to browse at night, probably the best of the 3 shopping streets I visited (the other being Takeshita Street in Harajuku). Misc photographs: I love marveling at all the handwritten menus outside restaurants at Tokyo, even though I can't read them. Didn't eat here, but how can you not love those lights? #english #japan #travel #wordvomit 7 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
