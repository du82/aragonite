title = "returning to the land of the well | yours, tiramisu"
description = "And there I go, disappearing again. I spent the past week completing my bimonthly sojourn to the land of the sick, which couldn't have come at a more ino..."
full_description = '''returning to the land of the well 2024 Dec 16 “To love makes one solitary," she thought. VIRGINIA WOOLF, from Mrs. Dalloway And there I go, disappearing again. I spent the past week completing my bimonthly sojourn to the land of the sick, which couldn't have come at a more inopportune time. This is the third (?) time I’ve gotten sick since I got here, which sounds like a lot but still feels like an underestimation considering I didn’t feel myself for almost the entire months of August and September. It’s frustrating to eat and sleep and move well and avoid all the major stressors and still get sick every few weeks when the wind blows a hole in your paper-thin immune system. I always say I want to stay here forever but sometimes I think I’ll be forced out by my health before my wallet. I didn’t get sick nearly as frequently back in the suburbs, probably a side effect of never interacting with anyone else. To let my body rest, I canceled a few days' worth of plans, which made me feel more of this baseline anxiety I have over the inevitability of me getting sick. Making plans any more than two days in advance is a crapshoot now with how often I seem to be getting ill. Can I be somewhere a few weeks, months from now? You may as well play Russian roulette. That said, I'm thankful that it wasn't more serious and that (fingers crossed) I seem to be over the worst of it. I call them head colds because they rarely come accompanied by fever, but the fatigue and congestion and cough are usually enough to knock me out for the better part of a week. At least I got to catch up on reading and go to heaven. When I emerged from my throne of tissues after three straight days cooped up in my apartment, the puddles outside my apartment were frozen solid. I have to go back more than a year to remember the last time I saw such a thing. I try not to think about being in the Midwest as a rule but seeing the milky puddles and feeling their satisfying crunch underfoot brought me right back to the empty expanses flying by on the interstate and the slick icy streets speckled with salt. The construction at my local subway station is now finished too, somehow. I was so shocked to see the shiny new turnstiles and the naked side of the platform sans scaffolding I turned to my friends and said I wanted to take a picture. When will it ever be this clean again? They laughed, but the moment lingered in my mind long after we'd gotten on our train. How often do you know when you've got the very best of something while you have it?1 There's no better reminder of time's relentless march than a week away from New York, even if you spend the week inside. What better way to celebrate ending a hibernation than food? Well, I can think of better places than eating at Adda Indian Canteen, that's for sure. We ordered aloo chana chaat, bheja fry (goat brains), chili paneer tikka, malvani fish curry, dilliwala butter chicken, and the lucknow dum biryani, plus garlic and amul cheese & chili naan. Everything was fine (except the chili paneer tikka — don't get that) but unremarkable and not deserving of the price tag. Just go to Jackson Heights instead, you're not far from the 7. Bheja fry (left), or goat brains, which tasted to me like ground beef; chili paneer tikka (right) From left to right: fish curry, raita (yogurt), biryani, naan, butter chicken; the butter chicken was definitely my favorite. Fortunately Flushing treated me a little better today and rewarded me for being more adventurous than usual. This 担担面 (dandanmian), or dan dan noodles, was so good. $11 from one of the stalls on the right wall of the New York Food Court. Next time I'm back I want to try the $7 热干面 from that Wuhan stall 火上面. 酒酿圆子! Never seen this anywhere before. We make jiuniang (glutinous rice fermented until slightly sweet and boozy) at home, but I've never eaten it hot like this, with ribbons of egg and chewy glutinous rice balls. A nice sweet treat on a cold day. You can find it for $5 at the 游子老鸭粉丝馆 in the New World Mall food court. A quote from The Office about this: "I wish there was a way to know you were in the good old days before you actually left them."↩ #english #food #sick #wordvomit 5 document.querySelector('#upvote-form').addEventListener('submit', (e) => { e.preventDefault(); const form = e.target; fetch(form.action, { method: form.method, body: new FormData(form), }); const button = form.querySelector('button') button.disabled = true button.style.color = "salmon" const upvoteCount = document.querySelector('.upvote-count') upvoteCount.innerHTML = `${(parseInt(upvoteCount.innerHTML.split(" ")[0]) + 1)}` });'''
