full_description = "security education, security operations Why AI Can’t Replace Cybersecurity Analysts Published by hacks4pancakes on February 26, 2025 As we face an extreme downturn in cybersecurity hiring which entry level candidates bear the brunt of, I want to address an elephant in the room: AI. I spend a lot of my time providing career clinics and mentorship, and I truly understand this is one of the worst cybersecurity… Continue reading →: Why AI Can’t Replace Cybersecurity Analysts digital forensics, infosec The Phillip Wylie Show! Published by hacks4pancakes on February 26, 2025 I made an appearance on the wonderful Phillip Wylie show! It was incredibly kind of him to have me on. We talked about a kind of niche area of ICS – how to do digital forensics in that space – especially weird and legacy stuff – and what that actually… Continue reading →: The Phillip Wylie Show! infosec Last chance for online career mentorship, for a while Published by hacks4pancakes on February 19, 2025 As I turn my attention to the major life change of moving to Australia, this will be the last opportunity to take advantage of my free, weekly cybersecurity career mentorship sessions for the indefinite future. I’ve really enjoyed providing this service on top of my normal career clinics at conferences,… Continue reading →: Last chance for online career mentorship, for a while ics-scada, iot Podcast: Expanding Frontiers Research Published by hacks4pancakes on February 19, 2025 In this podcast, I’m asked about current and future trends in industrial cyberattacks, as well as a variety of community and social issues facing our industry in the future. Continue reading →: Podcast: Expanding Frontiers Research ask lesley, infosec, security education On Cybersecurity Mentorship Published by hacks4pancakes on February 16, 2025 I want to take a moment to articulate my thoughts on cybersecurity mentorship and what it should entail. I speak a lot about problems I see doing extensive mentoring