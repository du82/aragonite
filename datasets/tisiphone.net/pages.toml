full_description = "Hi friends! I hope you’re having a wonderful Thanksgiving weekend (for the US folks), or a nice weekend regardless of location. I just wanted to drop a quick note to let you all know that from now on the best way to follow my daily social media posts, which include Q&As, cybersecurity news, and news commentary, will be on Mastodon. Unfortunately, the levels of direct abuse and spam my friends and I are receiving on Twitter have grown so untenable under the new management that I no longer feel comfortable trusting it as my primary platform for the foreseeable future. I may occasionally post business updates on Twitter, but that’s about it for the foreseeable future. If you are interested in joining Mastodon, Sentinel One has a great post on getting started here! We would love to have you. If you are interested in following what is up in Pancakes-land beyond these blogs, you can find me at the following places: https://infosec.exchange/@hacks4pancakes https://www.linkedin.com/in/lcarhart/ https://www.youtube.com/@hacks4pancakes I also have personal (not primarily infosec) social accounts at @hacks4pancakes on Instagram and TikTok. Share this:TwitterFacebookLike Loading…"
