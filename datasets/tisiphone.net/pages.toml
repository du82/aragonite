title = "About Lesley – Lesley Carhart's Cybersecurity Blog"
description = "Lesley Carhart is Technical Director of Industrial Incident Response at the industrial cybersecurity company Dragos, Inc., leading response to and proactively hunting for threats in customers’ ICS environments. Prior to joining Dragos, Lesley was the incident response team lead at Motorola Solutions. Following four years as a Principal Incident Responder for Dragos, Lesley now leads…"
full_description = "Schools call on FCC for cybersecurity fundingMarketplace – Sep 22, 2022 Lesley Carhart talks cybersecurity at Monadnock Summer LyceumMonadnock Ledger Transcript Aug 22 Everyone finally understands the importance of cybersecurity. What does that mean for cybersecurers?Marketplace Aug 24, 2021 Lesley Carhart is Technical Director of Industrial Incident Response at the industrial cybersecurity company Dragos, Inc., leading response to and proactively hunting for threats in customers’ ICS environments. Prior to joining Dragos, Lesley was the incident response team lead at Motorola Solutions. Following four years as a Principal Incident Responder for Dragos, Lesley now leads a team of incident response and digital forensics professionals across North America who perform investigations of commodity, targeted, and insider threat cases in industrial networks. Lesley is also an instructor for SANS ICS515: ICS Visibility, Detection, and Response https://www.sans.org/cyber-security-courses/ics-visibility-detection-response/. Lesley is honored to be retired from the United States Air Force Reserves, and to have received recognition such as “DEF CON Hacker of the Year”, “SANS Difference Maker Lifetime Achievement Award”, and “Power Player” from SC Magazine. You may find Lesley organizing resumé and interview clinics at several cybersecurity conferences, lecturing, and blogging and tweeting prolifically about cybersecurity. When not working, Lesley enjoys being a youth martial arts instructor. Lesley speaks on a variety of cybersecurity topics for multiple audiences. For information about corporate/commercial speaking engagements, please contact Leading Authorities: https://www.leadingauthorities.com/speakers/lesley-carhart For community or miscellaneous inquiries, contact hacks4pancakes [at] gmail . com You can view some of Lesley’s talks here: Talks Media Appearances and Bylines Your Cyber Response Plan Needs These 6 ComponentsASIS Online – October 1, 2022 S