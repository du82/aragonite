full_description = "AwardsJudge’s Award for Overall Project Excellence — Mechanical Engineering Department2nd Place — School-wide CompetitionSee Dean Glandt talk about our project in the Penn Engineering Graduation Speech.1st Place — James Dyson Award 1st Place — Cornell Cup Embedded Systems Competition Winner — The CNN 10 Inventions 2014 Winner — The Popular Science Invention Awards 2014 – On CBSBronze Award — The James F. Lincoln Arc Welding Award1st Runner Up — NIH DEBUT Competition, Category of Technology to Aid Underserved Populations and Individuals with DisabilitiesRecognitionOur project is featured in this video around minute 4.“Those of us who’ve seen the Elysium trailer know the real story, though, and the TitanArm’s aluminum frame, powerful electric motor, and cable driven system should grant anyone superhero-like powers—at least in their right arm.”TitanArm Exoskeleton: Elysium Is Basically Already RealWhile many offer leg support, a team from University of Pennsylvania recently took silver in an engineering competition for its TitanArm prototype, a powered upper-body exoskeleton that, as the picture above shows, allows you to out-rep anyone at the gym.UPenn’s TitanArm exoskeleton prototype makes light work of heavy liftingEyes-on: University of Pennsylvania’s TitanArm exoskeleton (With video interview)The exoskeleton market is an exploding field, but the Titan Arm is pretty slick considering it’s still in its early prototype stages. The cost is particularly attractive and another upside is that there has been less upper-body exoskeleton designs compared to lower-body models (which are aimed at helping paraplegics walk).Iron Man? Nope, New Lifting Aid is Called the “Titan Arm”Although it was developed to assist people with limited mobility, it certainly looks like it could be used for world domination — or better, overthrowing a tyrannical space station.Is Elysium’s Exoskeleton Already a Real Thing?"
