title = "Titan Arm: Archive"
full_description = "Our team is happy to report that we took 2nd place overall in Penn Engineering this past Thursday at the All Engineering Senior Design Presentations. Thanks for all the support! Our new teaser video is below, and we should be receiving a link to our full presentation on YouTube soon! Today, Team Titan presented our project at the Mechanical Engineering Senior Design Day. Attached to this post, you’ll find our poster with information, as well as our “teaser” video below. We’re happy to report that our team was honored with the Judge’s Award for overall project excellence. We’ll be one of three teams representing that Mechanical Engineering Department at the All Engineering Senior Design presentations next week. The team has been hard at work completing our exoskeleton. We’ll be demonstrating our exoskeleton at the MEAM Senior Design Poster Session this Wednesday from 9am-4pm."
