title = "Titan Arm: Archive"
full_description = "Our team is pleased to announce that we’ve been featured on CNN’s “Blueprint” Series. Check out the video here. We’re honored that our project has received 1st Runner Up in the National Institutes of Health (NIH) Design by Biomedical Undergraduate Teams (DEBUT) Competition. Our team competed in the category “Technology to Aid Underserved Populations and Individuals with Disabilities”. Niko and McGill represented the team this past week in Washington DC, where they met with The Washington Post, Boot Camp radio, and the Wall Street Journal. We’re happy to report that Team Titan was awarded first place at the Cornell Cup 2013! Thank you to Cornell and Intel for organizing a remarkable competition. Our project has been featured on the Discovery Channel “Daily Planet” segment. Check out the video here – our part comes in around the 4 minute marker. Our team is headed down to Disney tomorrow to compete in the Cornell Cup! We’ll be making some last minute tweaks tonight and then catching an early flight – wish us luck! Our team is happy to report that we took 2nd place overall in Penn Engineering this past Thursday at the All Engineering Senior Design Presentations. Thanks for all the support! Our new teaser video is below, and we should be receiving a link to our full presentation on YouTube soon! Today, Team Titan presented our project at the Mechanical Engineering Senior Design Day. Attached to this post, you’ll find our poster with information, as well as our “teaser” video below. We’re happy to report that our team was honored with the Judge’s Award for overall project excellence. We’ll be one of three teams representing that Mechanical Engineering Department at the All Engineering Senior Design presentations next week. The team has been hard at work completing our exoskeleton. We’ll be demonstrating our exoskeleton at the MEAM Senior Design Poster Session this Wednesday from 9am-4pm. After many long, 14 hour-or-so days in the machine shop, the majority of our components have been manufactured."
