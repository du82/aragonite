full_description = "Posted 17, November, 2014 The Collegiate Inventor’s Competition was going on today at the US Patent and Trademark Office! Congratulations to all teams – your inventions looked wonderful!Our team would like to thank the CIC for having us to the competition last year – the event had a great impression on all of our team members. We’re happy that our team is still involved through volunteering – Elizabeth presented & helped out at Camp Invention just a few months ago. Looking forward to getting involved in more events and meeting talented young inventors! #collegiate #inventors #competition #camp #invention #volunteering Posted 6, October, 2013 We’re happy to announce that the Titan Arm is one of 6 finalists in the 2013 Collegiate Inventors Competition. We’ll be traveling down to Alexandria, VA next month for the final competition.Special shout out to Team HERALD from the University of Pennsylvania, who are also finalists! #CIC #collegiate #inventors #competition #upenn #titan #herald"
