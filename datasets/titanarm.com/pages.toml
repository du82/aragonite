title = "Titan Arm: Archive"
full_description = "As we learned in our controls class at Penn, Matlab’s Simulink package provides a powerful way to build and test control systems. As such, our team has started building a Simulink model for use in simulating suit behavior and response. Based on the last testing, our team developed grips that were more accurate to the forces that the cables would be experiencing. Two set screws were used to grip down on the cable – two of these blocks were used to hold the cable in between the grips of the machine. The given testing gave more reasonable results, though slipping of the cable is clear in the stress vs. strain curve below."
