full_description = "1 note Posted 8, July, 2014 Our team is ecstatic to say that we’ve been nominated for a Philly Geek Award – Best I.R.L. (In Real Life) Project! You can read about it on Newsworks and Geekadelphia. We’ll know in August if we’ve won! #geekawards #geek #awards #phl #philadelphia #upenn #titan #titanarm #arm #exoskeleton #irl #best #project #in #real #life #philly Posted 24, October, 2013 Titan Arm hits CNN Our team is pleased to announce that we’ve been featured on CNN’s “Blueprint” Series. Check out the video here. #cnn #titan #titanarm #arm #upenn #university of pennsylvania #engineering Posted 6, October, 2013 We’re happy to announce that the Titan Arm is one of 6 finalists in the 2013 Collegiate Inventors Competition. We’ll be traveling down to Alexandria, VA next month for the final competition.Special shout out to Team HERALD from the University of Pennsylvania, who are also finalists! #CIC #collegiate #inventors #competition #upenn #titan #herald Posted 6, October, 2013 Our team is ecstatic to report that our project has made the first cut in the international James Dyson Award competition. We’re part of the top 25% of projects entering the second round – wish us luck! Check out our project page. #james #dyson #award #titan #upenn"
