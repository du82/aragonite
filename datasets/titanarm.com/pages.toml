title = "Titan Arm"
description = "A powered, upper body exoskeleton developed by students at the University of Pennsylvania."
full_description = "1 note Posted 8, July, 2014 Our team is ecstatic to say that we’ve been nominated for a Philly Geek Award – Best I.R.L. (In Real Life) Project! You can read about it on Newsworks and Geekadelphia. We’ll know in August if we’ve won! #geekawards #geek #awards #phl #philadelphia #upenn #titan #titanarm #arm #exoskeleton #irl #best #project #in #real #life #philly 4 notes Posted 29, June, 2014 Some updates over the past year:Titan Arm was picked as one of The CNN 10 Inventions for 2014The Arm was chosen for a Popular Science Invention Award for 2014 (featured on CBS)Our team won the International James Dyson Award for 2013We’ve been overwhelmed by the response from the media and our fans. We love hearing from you – you can contact us at [email protected] #cnn10 #cnn #inventions #popsci #popular #science #jda #james #dyson #award #titan #arm #titanarm #exoskeleton Posted 17, April, 2013 Titan Arm: MEAM Senior Design Presentation Today, Team Titan presented our project at the Mechanical Engineering Senior Design Day. Attached to this post, you’ll find our poster with information, as well as our “teaser” video below.We’re happy to report that our team was honored with the Judge’s Award for overall project excellence. We’ll be one of three teams representing that Mechanical Engineering Department at the All Engineering Senior Design presentations next week. #titanarm #titan #arm #physical therapy #powered #upper #body #exoskeleton #senior design #meam #judges #award #physical #therapy #occupational #lifting #parrotta #mcgill #beattie #vladimirov Posted 5, October, 2012 Titan - An Abstract Our team is designing an untethered, powered, upper body exoskeleton for use in the fields of rehabilitation and therapeutic application, as well as occupations requiring augmented strength. Though systems exist, past exoskeleton endeavors have led to bulky, expensive, invasive, and tethered solutions. The challenge is to build an exoskeletal system that is inexpensive, streamlined, and wireless.Our solution is unique in that it will be a low-cost, ergonomic device actuated through sensors measuring the user’s motion and muscle activity. Through onboard sensing, the skeleton can provide rich data, such as range of motion or strength for use in physical therapy. This data can be used by doctors and patients to more accurately track improvement over time. With its low cost, hospitals could employ multiple devices and aid a larger audience of patients; the devices could even be used at home for physical therapy, which would dramatically increase quality of life for patients.Outside of physical therapy, augmented strength is applicable to physically intensive occupations, as well as search and rescue operations. Each year, thousands of workers must take leave due to injuries triggered by heavy lifting; with augmented strength, workers could avoid harmful situations. #titan #abstract #physical #therapy #titanarm #exoskeleton"
year_published = 2014
