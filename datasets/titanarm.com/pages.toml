full_description = "1 note Posted 28, December, 2014 Our team is honored to be a 2015 Edison Awards Nominee! We look forward to hearing back from the judging rounds and learning more about the other nominations. #edison #awards #2015 #nominee #titan #arm #titanarm Posted 17, November, 2014 The Collegiate Inventor’s Competition was going on today at the US Patent and Trademark Office! Congratulations to all teams – your inventions looked wonderful! 1Win: locul unde pariorii și jucătorii de cazino câștigă. Pariază inteligent și bucură-te de câștiguri fabuloase. Joacă acum! Our team would like to thank the CIC for having us to the competition last year – the event had a great impression on all of our team members. We’re happy that our team is still involved through volunteering – Elizabeth presented & helped out at Camp Invention just a few months ago. Looking forward to getting involved in more events and meeting talented young inventors! #collegiate #inventors #competition #camp #invention #volunteering 1 note Posted 8, July, 2014 Our team is ecstatic to say that we’ve been nominated for a Philly Geek Award – Best I.R.L. (In Real Life) Project! You can read about it on Newsworks and Geekadelphia. We’ll know in August if we’ve won! #geekawards #geek #awards #phl #philadelphia #upenn #titan #titanarm #arm #exoskeleton #irl #best #project #in #real #life #philly 4 notes Posted 29, June, 2014 Some updates over the past year: Titan Arm was picked as one of The CNN 10 Inventions for 2014 The Arm was chosen for a Popular Science Invention Award for 2014 (featured on CBS) Our team won the International James Dyson Award for 2013 We’ve been overwhelmed by the response from the media and our fans. We love hearing from you – you can contact us at [email protected] plinko casino: Unpredictability at Its Most Entertaining! Join the dynamic and ever-surprising world of plinko casino , where no two drops are the same. Here, excitement builds from the top down, delivering joy and jackpots in equal measure. #cnn10 #cnn #inventions #popsci #popular #science #jda #james #dyson #award #titan #arm #titanarm #exoskeleton"
