title = "Titan Arm: Archive"
full_description = "We’re pleased to announce that we’ve been accepted to the Cornell Cup Competition! Cornell and Intel have teamed up to present an embedded systems competition. We’ll be competing this May is Disney World, Florida! Stay tuned. Based on our actuation selection, a cable drive will be implemented on the exoskeleton to transmit the power from the motor to the elbow joint. A cable drive system allows for non-localized actuation. Other exoskeletons, such as HAL (image below), use localized motors for actuation. With non-localized actuation, it is possible to increase the motor strength and decrease the weight at the joint extremities. We’ll be investigating cables and sheathing to transmit the force from the back to the elbow joint. After months of deliberation, our team decided to purse an actuated upper body exoskeleton for use in the fields of healthcare, search and rescue, and strength intensive occupations. Our team has decided to move forward with a DC motor actuation system. This system was chosen because the team has experience; DC motors are already relatively inexpensive, clean, quiet, and precise. One way of creating a natural user experience is to give a quick, smooth response to the user input. This is no small feat; how can you tell when a user requires additional strength? Electromyography is a potential solution. Electromyography, or EMG, is a way of sensing muscle activity through electrical signals. When muscles are activated by the brain, an electrical potential can be measured in the range of 50uV to 30 mV. By amplifying and filtering the signals, it’s possible to read and decompose the signals. When the muscles are inactive, the electrical potential is low; however, when lifting an object, the electrical potential rises. As the work required of the human increases, more muscle is called on to help lift the object, increasing the potential even higher. Therefore, using the correct sensors and filtering, it’s possible to scale the amount of aid from an exoskeletal suit."
year_published = 2012
