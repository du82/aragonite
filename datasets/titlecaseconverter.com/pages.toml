full_description = "The Title Case Converter allows you to choose between eight different title case styles. Selecting the one that’s best suited for you might be a tough decision, so this article is intended to provide assistance.Selecting a Style Based on GuidelinesIt’s quite possible that you do not really have a choice. If you are writing for a magazine or a publisher, then they might have their own style guide or a manual of style which typically contains specifications how to handle titles and headings. The same applies to universities. If you are writing an assignment, check with your lecturer if there are any guidelines regarding title capitalization.Selecting a Style Based on Subject AreaEven if there are no explicit specifications for a title case style that you need to follow, there might be a prevailing style in your discipline, especially in an academic setting. Therefore you may want to select a style that is common in the subject area you are writing about. Here is an overview which style guides are used in which disciplines:AMA: medicineAPA: social and behavioral sciencesBluebook: lawChicago: humanities, social sciencesMLA: humanities, literatureAP and New York Times style are journalistic styles, so these two, along with Wikipedia style, would be appropriate in a non-academic setting.Selecting a Style Based on Personal PreferenceAlternatively, you can simply select the title case style that you like best, i.e., the one whose rules make the most sense to you, and/or whose results you think look best. For example, for some people it looks strange when with is capitalized in a title, while others find it strange when with is not capitalized.The biggest difference between the various styles is probably how they treat prepositions. In this regard, the styles can be classified into three groups:lowercase prepositions up to 3 letters (e.g., at, on, in)lowercase prepositions up to 4 letters (e.g., from, over, with)lowercase all prepositions (e.g., after, between, without)The following title demonstrates the differences between these three groups:a.How to Keep in Touch With Friends After Movingb.How to Keep in Touch with Friends After Movingc.How to Keep in Touch with Friends after MovingWhich variant do you like best? Read on in the respective section to narrow down your choice to a concrete style.Lowercase Prepositions Up to Three LettersFour of the major title case styles only lowercase prepositions with 3 letters of fewer: AMA, AP, APA, and New York Times style. However, while they agree on this rule, they differ in other regards.AMA style is the only of these four styles that capitalizes short subordinating conjunctions (e.g., as and if). In addition, the last word of a title is not automatically capitalized in this style.What makes AP style unique is that it capitalizes to in infinitives.In APA style, the last word is not automatically capitalized, just like in AMA style.What’s special about the New York Times style is that only selected prepositions and conjunctions with three letters or fewer are lowercased. Others, like off, out, and up, are capitalized.The following example highlights these differences, and you can judge which version you prefer.AMA:How to Live off the Grid, If That’s Something You’re Interested inAP:How To Live off the Grid, if That’s Something You’re Interested InAPA:How to Live off the Grid, if That’s Something You’re Interested inNYT:How to Live Off the Grid, if That’s Something You’re Interested InLowercase Prepositions Up to Four LettersThree styles lowercase prepositions up to four letters: Bluebook, Chicago (CMOS), and Wikipedia. They differ in other ways, however: In Chicago style and Wikipedia style, the last word of a title is always capitalized. This is not the case in Bluebook style, so a preposition at the end of a title would be lowercased, as the following example shows.BB:What Are You Waiting for?CMOS:What Are You Waiting For?WP:What Are You Waiting For?Another difference is that in Chicago style, as is always lowercased, regardless of its grammatical function. Similarly, so and yet are always capitalized. Bluebook and Wikipedia style, on the other hand, strictly capitalize according to grammatical function. All adverbs and all subordinating conjunctions, including as, are capitalized, and all coordinating conjunctions, including so and yet, are lowercased.BB:Stay Safe yet Active As You AgeCMOS:Stay Safe Yet Active as You AgeWP:Stay Safe yet Active As You AgeLowercase All PrepositionsThe MLA handbook is the only major style guide that specifies that all prepositions should be lowercased, independent of their length. So if that is what you prefer, your only choice is MLA style.TipsYou can find further details on the rules of the individual styles on the dedicated Title Case Rules page. It also features a comparison table which might be useful.The Title Case Converter allows you to select more than one style if the option “Enable Multi-Line Input” is unchecked, so you can enter your title, select all styles, and then you’ll see at a glance what it looks like in each style.Related ArticlesSentence Case vs. Title Case: When to Use WhichThe Most Common Title Case MistakesTitle Capitalization Rule Changes in the 18th Edition of the Chicago Manual of StyleFeatured ArticlesIs Out Capitalized in a Title?Is But Capitalized in a Title?Is About Capitalized in a Title?"
