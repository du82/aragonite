title = "Title Capitalization Rules | Title Case Converter"
description = "Detailed title capitalization rules for eight common title case styles"
full_description = "There are two basic styles for the capitalization of titles and headlines, sentence case and title case.In sentence case, the first word and all proper nouns and proper adjectives are capitalized. All other words are lowercased (just like in a regular English sentence): Bank of America is missing out on Wall Street’s boomIn title case, the first word (and usually the last word) is capitalized, as well as all major words. Minor words are lowercased: Bank of America Is Missing Out on Wall Street’s BoomHowever, there is no universal convention which words in a title are major and which are minor. Rather, there are various style guides which each have their own rules regarding title case. This page describes the title case rules of eight common style guides: the AMA Manual of Style, the AP Stylebook, the APA Publication Manual, the Bluebook, the Chicago Manual of Style, the MLA Handbook, the New York Times Manual of Style and Usage, and the Wikipedia Manual of Style. Also featured is a table with a comparison of these styles.A different approach to title case can be found on the page Words to Capitalize in a Title, which specifies the correct capitalization for individual words. And, of course, the Title Case Converter offers a fully automatic conversion to title case, applying the rules of the style of your choice.⮝·AMA·AP·APA·Bluebook·Chicago·MLA·New York Times·Wikipedia·ComparisonAMA Title CaseCapitalize the first word of titles and subtitlesCapitalize major wordsDo not capitalize coordinating conjunctions (and, but, for, nor, or, so, yet), articles, or prepositions of three or fewer lettersDo not capitalize to in infinitivesCapitalize both parts of a hyphenated compoundCapitalize the genus but not the species epithetSourcesThe JAMA Network Editors. AMA Manual of Style. 11th ed. Oxford: Oxford University Press, 2020.Brenda Gregoline. “Capitalization.” AMA Manual of Style Online. Published February 2020, updated May 25, 2023. https://academic.oup.com/amamanualofstyle/book/27941/chapter/207567096/CommentaryThe rules for hyphenated compounds in the print version of the AMA Manual of Style are quite complex. However, they are no longer valid since the corresponding chapter (10.2.2) was updated in the online version of the manual in May 2023. The new rules are much simpler and no longer distinguish between temporary and permanent compounds, or between words that follow a lowercase or uppercase Greek letter.AP Title CaseCapitalize the first word and the last word of the titleCapitalize the principal wordsCapitalize to in infinitivesCapitalize all words of four letters or moreDo not capitalize articles, conjunctions, and prepositions of three letters or fewerSourceThe Associated Press. The Associated Press Stylebook. 57th ed. New York: Basic Books, 2024.CommentaryIt should be noted that the rules above are the AP rules for composition titles (titles of books, movies, songs, poems etc.) For headlines, the AP Stylebook prescribes sentence case.In previous editions of the AP Stylebook, it was not clear whether the rule to not capitalize short conjunctions only refers to coordinating conjunctions, or also includes subordinating conjunctions. The 2019 edition made it clear that short subordinating conjunctions like if are indeed not capitalized in AP style.APA Title CaseCapitalize the first word of a title or subtitleCapitalize the first word after a colon, em dash, or end punctuationCapitalize nouns, verbs, adjectives, adverbs, and pronounsCapitalize all words of four letters or moreDo not capitalize articles, conjunctions, and prepositions of three letters or fewerCapitalize the second part of hyphenated major wordsDo not capitalize the second part of a Latin species nameSourcesAmerican Psychological Association. Publication Manual of the American Psychological Association. 7th ed. Washington, DC: American Psychological Association, 2020.Lee, Chelsea. “Title Case and Sentence Case Capitalization in APA Style.” APA Style Blog. March 9, 2012. Accessed September 1, 2018. http://blog.apastyle.org/​apastyle/​2012/​03/​title-case-​and-​sentence-​case-​capitalization-​in-​apa-​style.htmlMcAdoo, Timothy. “How to Format Scientific Names of Animals.” APA Style Blog. February 15, 2017. Accessed September 1, 2018. http://blog.apastyle.org/​apastyle/​2017/​02/​-how-to-​format-​scientific-​names-​of-​animals.htmlCommentaryWhile all other styles discussed on this page always capitalize the last word of a title, APA style has no such rule, which means that prepositions at the end of titles must be lowercased (e.g., “Service You Can Count on”).The rule to lowercase short conjunctions includes subordinating conjunctions. The 7th edition of the APA Publication Manual explicitly lists as and if as conjunctions to be lowercased.The Publication Manual does not explicitly state how to in infinitives should be handled, but it uses a lowercase to in its own headings, for example, “Strategies to Improve Your Writing” in chapter 4.Bluebook Title CaseCapitalize the first word of a heading or title and the first word after a colonCapitalize all words except articles, conjunctions, or prepositions of four letters or fewerSourceHarvard Law Review, Columbia Law Review, and Yale Law Review. The Bluebook: A Uniform System of Citation. 21st ed. Cambridge: Harvard Law Review Association, 2020.CommentaryWhile the Bluebook does not explicitly mention whether or not the to in infinitives should be capitalized, it contains several example titles that show that it should not be capitalized, for example, “Using Private Schools to Promote Public Values” in chapter 16.4.Furthermore the Bluebook does not make it clear whether the rule to not capitalize short conjunctions also refers to subordinating conjunctions such as if or as. Judging from past article titles in The Harvard Law Review, this does not seem to be the case (e.g., “We Couldn’t Kill the Internet If We Tried”).Chicago Title CaseCapitalize the first and last words of titles and subtitlesCapitalize nouns, pronouns, verbs, adjectives, adverbs, and some conjunctionsCapitalize prepositions with five or more lettersDo not capitalize articles and prepositions of four letters or fewer, except for prepositions that are part of Latin expressions used adjectivally or adverbially (e.g., “In Situ”)Do not capitalize the conjunctions and, but, for, or, and norDo not capitalize to in infinitivesDo not capitalize as in any grammatical functionDo not capitalize the part of a proper name that would be lowercased in text (e.g., “Vincent van Gogh”)Do not capitalize the second part of a Latin species name, even if it is the last word of the title or subtitleIn hyphenated compounds, capitalize the first element and subsequent words that are not articles, prepositions, coordinating conjunctions, or modifiers following musical key symbols (e.g., “Symphony in F-sharp Major”).SourceThe University of Chicago Press Editorial Staff. The Chicago Manual of Style. 18th ed. Chicago: University of Chicago Press, 2024.CommentaryThe title case rules of the Chicago Manual of Style are more exhaustive than all others, and they feature a few peculiarities: All other styles (except for the New York Times) lowercase all seven coordinating conjunctions, but only five are lowercased in Chicago style, namely and, but, for, nor, and or, whereas yet and so are capitalized.On the other hand, as is always lowercased in Chicago style, which is sensible, because it avoids the necessity of determining the grammatical function of this word.In the past, all prepositions were lowercased in Chicago style, regardless of length, but this was changed in the 18th edition.MLA Title CaseCapitalize the first word and the last word of titles and subtitlesCapitalize nouns, pronouns, verbs, adjectives, adverbs, and subordinating conjunctionsDo not capitalize articles, prepositions (regardless of length), and coordinating conjunctionsDo not capitalize to in infinitivesCapitalize principal words that follow hyphens in compound termsDo not capitalize the word that follows a hyphenated prefix if the prefix combined with the word is listed without a hyphen in a dictionary (e.g., “Anti-tumor,” but “Anti-Intellectual”)SourceModern Language Association of America. MLA Handbook. 9th ed. New York: Modern Language Association of America, 2021.CommentaryUnlike Chicago style, MLA style treats all coordinating conjunctions alike and does not have special rules for as. The rules regarding hyphenated words seem unwieldy since they require consulting a dictionary, and furthermore can lead to different results depending on which dictionary is used.New York Times Title CaseCapitalize nouns, pronouns, and verbsCapitalize all words of four or more lettersCapitalize no, nor, not, off, out, so, and upDo not capitalize a, and, as, at, but, by, en, for, if, in, of, on, or, the, to, v., vs., and via, except when used as adverbsCapitalize for if it takes the place of a verb meaning “support” or “advocate”In hyphenated compounds, do not capitalize the second part if it follows a prefix of two or three letters and if the hyphen separates doubled vowels (e.g., “Co-operation”). Otherwise, capitalize the second part (e.g., “Co-Author”).SourceSiegal, Allan M., Connolly, William G., Corbett, Philip B., and New York Times Company. The New York Times Manual of Style and Usage. 5th ed. New York: Three Rivers Press, 2015.CommentaryThe New York Times style is unique among the styles discussed here since not all 2- and 3-letter preposition are lowercased in this style. Instead, short words to capitalize and to lowercase are explicitly listed. This results in the prepositions off, out, and up being capitalized in New York Times style while they would be lowercased in any other style.Taken verbatim, the New York Times rules would mean that in and on should be lowercased when used as adjectives, but that is probably not the intended meaning, and evidence suggests that they are capitalized in that grammatical function.Source · CC BY-SA 3.0Wikipedia Title CaseCapitalize the first word and last word of the titleCapitalize verbs, nouns, pronouns, adjectives, adverbs, and subordinating conjunctionsCapitalize prepositions of five letters or moreCapitalize the first word in a compound preposition (e.g., “Out of”)Do not capitalize articles, prepositions of four letters or fewer, and coordinating conjunctionsDo not capitalize to in infinitivesFor hyphenated words, follow the majority usage in independent, reliable sourcesSource“Wikipedia:Manual of Style/Titles#Capital_letters.” Wikipedia. Accessed September 1, 2018. https://en.wikipedia.org/​wiki/​Wikipedia:​Manual_of_Style/​Titles​#Capital_letters.CommentaryIn Wikipedia style, preposition with up to four letters are lowercased, which means that this style represents a compromise between journalistic styles, where only short preposition with up to three letters are lowercased (e.g., AP) and the academic MLA style, where all prepositions are lowercased, regardless of length.The Wikipedia rules are detailed and clearly specify how to capitalize a multitude of cases, with the exception of hyphenated compounds, for which the rules instruct to follow external sources. This seems unusual.Style Guide ComparisonThe following table provides a comparison of the title case rules of the six style guides supported by this website. The following symbols are used: stands for “capitalize,” stands for “lowercase,” and “” means that the style guide does not have a rule for the word or case in question.AcademiaJournalismCMOSMLABBAPAAMAAPNYTWPfirst wordlast wordnounspronounsverbsadjectivesadverbsasbuttootherarticlesprepositions1 letterv.2 lettersatbyinofonuptoother3 lettersbutfor /offoutviaother4 lettersfromintountowithother5+ lettersanycoordinatingforconjunctionsandnorbutoryetsosubordinatingasconjunctionsifother“to” in infinitivessecond part of species names()()()"
