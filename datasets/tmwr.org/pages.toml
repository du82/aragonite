full_description = '6 Fitting Models with parsnip The parsnip package, one of the R packages that are part of the tidymodels metapackage, provides a fluent and standardized interface for a variety of different models. In this chapter, we give some motivation for why a common interface is beneficial for understanding and building models in practice and show how to use the parsnip package. Specifically, we will focus on how to fit() and predict() directly with a parsnip object, which may be a good fit for some straightforward modeling problems. The next chapter illustrates a better approach for many modeling tasks by combining models and preprocessors together into something called a workflow object. 6.1 Create a Model Once the data have been encoded in a format ready for a modeling algorithm, such as a numeric matrix, they can be used in the model building process. Suppose that a linear regression model was our initial choice. This is equivalent to specifying that the outcome data is numeric and that the predictors are related to the outcome in terms of simple slopes and intercepts: \[y_i = \beta_0 + \beta_1 x_{1i} + \ldots + \beta_p x_{pi}\] A variety of methods can be used to estimate the model parameters: Ordinary linear regression uses the traditional method of least squares to solve for the model parameters. Regularized linear regression adds a penalty to the least squares method to encourage simplicity by removing predictors and/or shrinking their coefficients towards zero. This can be executed using Bayesian or non-Bayesian techniques. In R, the stats package can be used for the first case. The syntax for linear regression using the function lm() is: model <- lm(formula, data, ...) where ... symbolizes other options to pass to lm(). The function does not have an x/y interface, where we might pass in our outcome as y and our predictors as x. To estimate with regularization, the second case, a Bayesian model can be fit using the rstanarm package: model <- stan_glm(formula, data, family = "gaussian", ...) In this case, the other options passed via ... would include arguments for the prior distributions of the parameters as well as specifics about the numerical aspects of the model. As with lm(), only the formula interface is available. A popular non-Bayesian approach to regularized regression is the glmnet model (Friedman, Hastie, and Tibshirani 2010). Its syntax is: model <- glmnet(x = matrix, y = vector, family = "gaussian", ...) In this case, the predictor data must already be formatted into a numeric matrix; there is only an x/y method and no formula method. Note that these interfaces are heterogeneous in either how the data are passed to the model function or in terms of their arguments. The first issue is that, to fit models across different packages, the data must be formatted in different ways. lm() and stan_glm() only have formula interfaces while glmnet() does not. For other types of models, the interfaces may be even more disparate. For a person trying to do data analysis, these differences require the memorization of each package’s syntax and can be very frustrating. For tidymodels, the approach to specifying a model is intended to be more unified: Specify the type of model based on its mathematical structure (e.g., linear regression, random forest, KNN, etc). Specify the engine for fitting the model. Most often this reflects the software package that should be used, like Stan or glmnet. These are models in their own right, and parsnip provides consistent interfaces by using these as engines for modeling. When required, declare the mode of the model. The mode reflects the type of prediction outcome. For numeric outcomes, the mode is regression; for qualitative outcomes, it is classification.14 If a model algorithm can only address one type of prediction outcome, such as linear regression, the mode is already set. These specifications are built without referencing the data. For example, for the three cases we outlined: library(tidymodels) tidymodels_prefer() linear_reg() %>% set_engine("lm") #> Linear Regression Model Specification (regression) #> #> Computational engine: lm linear_reg() %>% set_engine("glmnet") #> Linear Regression Model Specification (regression) #> #> Computational engine: glmnet linear_reg() %>% set_engine("stan") #> Linear Regression Model Specification (regression) #> #> Computational engine: stan Once the details of the model have been specified, the model estimation can be done with either the fit() function (to use a formula) or the fit_xy() function (when your data are already pre-processed). The parsnip package allows the user to be indifferent to the interface of the underlying model; you can always use a formula even if the modeling package’s function only has the x/y interface. The translate() function can provide details on how parsnip converts the user’s code to the package’s syntax: linear_reg() %>% set_engine("lm") %>% translate() #> Linear Regression Model Specification (regression) #> #> Computational engine: lm #> #> Model fit template: #> stats::lm(formula = missing_arg(), data = missing_arg(), weights = missing_arg()) linear_reg(penalty = 1) %>% set_engine("glmnet") %>% translate() #> Linear Regression Model Specification (regression) #> #> Main Arguments: #> penalty = 1 #> #> Computational engine: glmnet #> #> Model fit template: #> glmnet::glmnet(x = missing_arg(), y = missing_arg(), weights = missing_arg(), #> family = "gaussian") linear_reg() %>% set_engine("stan") %>% translate() #> Linear Regression Model Specification (regression) #> #> Computational engine: stan #> #> Model fit template: #> rstanarm::stan_glm(formula = missing_arg(), data = missing_arg(), #> weights = missing_arg(), family = stats::gaussian, refresh = 0) Note that missing_arg() is just a placeholder for the data that has yet to be provided. We supplied a required penalty argument for the glmnet engine. Also, for the Stan and glmnet engines, the family argument was automatically added as a default. As will be shown later in this section, this option can be changed. Let’s walk through how to predict the sale price of houses in the Ames data as a function of only longitude and latitude:15 lm_model <- linear_reg() %>% set_engine("lm") lm_form_fit <- lm_model %>% # Recall that Sale_Price has been pre-logged fit(Sale_Price ~ Longitude + Latitude, data = ames_train) lm_xy_fit <- lm_model %>% fit_xy( x = ames_train %>% select(Longitude, Latitude), y = ames_train %>% pull(Sale_Price) ) lm_form_fit #> parsnip model object #> #> #> Call: #> stats::lm(formula = Sale_Price ~ Longitude + Latitude, data = data) #> #> Coefficients: #> (Intercept) Longitude Latitude #> -302.97 -2.07 2.71 lm_xy_fit #> parsnip model object #> #> #> Call: #> stats::lm(formula = ..y ~ ., data = data) #> #> Coefficients: #> (Intercept) Longitude Latitude #> -302.97 -2.07 2.71 Not only does parsnip enable a consistent model interface for different packages, it also provides consistency in the model arguments. It is common for different functions that fit the same model to have different argument names. Random forest model functions are a good example. Three commonly used arguments are the number of trees in the ensemble, the number of predictors to randomly sample with each split within a tree, and the number of data points required to make a split. For three different R packages implementing this algorithm, those arguments are shown in Table 6.1. Table 6.1: Example argument names for different random forest functions. Argument Type ranger randomForest sparklyr # sampled predictors mtry mtry feature_subset_strategy # trees num.trees ntree num_trees # data points to split min.node.size nodesize min_instances_per_node In an effort to make argument specification less painful, parsnip uses common argument names within and between packages. Table 6.2 shows, for random forests, what parsnip models use. Table 6.2: Random forest argument names used by parsnip. Argument Type parsnip # sampled predictors mtry # trees trees # data points to split min_n Admittedly, this is one more set of arguments to memorize. However, when other types of models have the same argument types, these names still apply. For example, boosted tree ensembles also create a large number of tree-based models, so trees is also used there, as is min_n, and so on. Some of the original argument names can be fairly jargon-y. For example, to specify the amount of regularization to use in a glmnet model, the Greek letter lambda is used. While this mathematical notation is commonly used in the statistics literature, it is not obvious to many people what lambda represents (especially those who consume the model results). Since this is the penalty used in regularization, parsnip standardizes on the argument name penalty. Similarly, the number of neighbors in a KNN model is called neighbors instead of k. Our rule of thumb when standardizing argument names is: If a practitioner were to include these names in a plot or table, would the people viewing those results understand the name? To understand how the parsnip argument names map to the original names, use the help file for the model (available via ?rand_forest) as well as the translate() function: rand_forest(trees = 1000, min_n = 5) %>% set_engine("ranger") %>% set_mode("regression") %>% translate() #> Random Forest Model Specification (regression) #> #> Main Arguments: #> trees = 1000 #> min_n = 5 #> #> Computational engine: ranger #> #> Model fit template: #> ranger::ranger(x = missing_arg(), y = missing_arg(), weights = missing_arg(), #> num.trees = 1000, min.node.size = min_rows(~5, x), num.threads = 1, #> verbose = FALSE, seed = sample.int(10^5, 1)) Modeling functions in parsnip separate model arguments into two categories: Main arguments are more commonly used and tend to be available across engines. Engine arguments are either specific to a particular engine or used more rarely. For example, in the translation of the previous random forest code, the arguments num.threads, verbose, and seed were added by default. These arguments are specific to the ranger implementation of random forest models and wouldn’t make sense as main arguments. Engine-specific arguments can be specified in set_engine(). For example, to have the ranger::ranger() function print out more information about the fit: rand_forest(trees = 1000, min_n = 5) %>% set_engine("ranger", verbose = TRUE) %>% set_mode("regression") #> Random Forest Model Specification (regression) #> #> Main Arguments: #> trees = 1000 #> min_n = 5 #> #> Engine-Specific Arguments: #> verbose = TRUE #> #> Computational engine: ranger 6.2 Use the Model Results Once the model is created and fit, we can use the results in a variety of ways; we might want to plot, print, or otherwise examine the model output. Several quantities are stored in a parsnip model object, including the fitted model. This can be found in an element called fit, which can be returned using the extract_fit_engine() function: lm_form_fit %>% extract_fit_engine() #> #> Call: #> stats::lm(formula = Sale_Price ~ Longitude + Latitude, data = data) #> #> Coefficients: #> (Intercept) Longitude Latitude #> -302.97 -2.07 2.71 Normal methods can be applied to this object, such as printing and plotting: lm_form_fit %>% extract_fit_engine() %>% vcov() #> (Intercept) Longitude Latitude #> (Intercept) 207.311 1.57466 -1.42397 #> Longitude 1.575 0.01655 -0.00060 #> Latitude -1.424 -0.00060 0.03254 Never pass the fit element of a parsnip model to a model prediction function, i.e., use predict(lm_form_fit) but do not use predict(lm_form_fit$fit). If the data were preprocessed in any way, incorrect predictions will be generated (sometimes, without errors). The underlying model’s prediction function has no idea if any transformations have been made to the data prior to running the model. See Section 6.3 for more on making predictions. One issue with some existing methods in base R is that the results are stored in a manner that may not be the most useful. For example, the summary() method for lm objects can be used to print the results of the model fit, including a table with parameter values, their uncertainty estimates, and p-values. These particular results can also be saved: model_res <- lm_form_fit %>% extract_fit_engine() %>% summary() # The model coefficient table is accessible via the `coef` method. param_est <- coef(model_res) class(param_est) #> [1] "matrix" "array" param_est #> Estimate Std. Error t value Pr(>|t|) #> (Intercept) -302.974 14.3983 -21.04 3.640e-90 #> Longitude -2.075 0.1286 -16.13 1.395e-55 #> Latitude 2.710 0.1804 15.02 9.289e-49 There are a few things to notice about this result. First, the object is a numeric matrix. This data structure was mostly likely chosen since all of the calculated results are numeric and a matrix object is stored more efficiently than a data frame. This choice was probably made in the late 1970s when computational efficiency was extremely critical. Second, the non-numeric data (the labels for the coefficients) are contained in the row names. Keeping the parameter labels as row names is very consistent with the conventions in the original S language. A reasonable next step might be to create a visualization of the parameter values. To do this, it would be sensible to convert the parameter matrix to a data frame. We could add the row names as a column so that they can be used in a plot. However, notice that several of the existing matrix column names would not be valid R column names for ordinary data frames (e.g., "Pr(>|t|)"). Another complication is the consistency of the column names. For lm objects, the column for the p-value is "Pr(>|t|)", but for other models, a different test might be used and, as a result, the column name would be different (e.g., "Pr(>|z|)") and the type of test would be encoded in the column name. While these additional data formatting steps are not impossible to overcome, they are a hindrance, especially since they might be different for different types of models. The matrix is not a highly reusable data structure mostly because it constrains the data to be of a single type (e.g., numeric). Additionally, keeping some data in the dimension names is also problematic since those data must be extracted to be of general use. As a solution, the broom package can convert many types of model objects to a tidy structure. For example, using the tidy() method on the linear model produces: tidy(lm_form_fit) #> # A tibble: 3 × 5 #> term estimate std.error statistic p.value #> <chr> <dbl> <dbl> <dbl> <dbl> #> 1 (Intercept) -303. 14.4 -21.0 3.64e-90 #> 2 Longitude -2.07 0.129 -16.1 1.40e-55 #> 3 Latitude 2.71 0.180 15.0 9.29e-49 The column names are standardized across models and do not contain any additional data (such as the type of statistical test). The data previously contained in the row names are now in a column called term. One important principle in the tidymodels ecosys'
