full_description = '''13 Grid Search In Chapter 12 we demonstrated how users can mark or tag arguments in preprocessing recipes and/or model specifications for optimization using the tune() function. Once we know what to optimize, it’s time to address the question of how to optimize the parameters. This chapter describes grid search methods that specify the possible values of the parameters a priori. (Chapter 14 will continue the discussion by describing iterative search methods.) Let’s start by looking at two main approaches for assembling a grid. 13.1 Regular and Nonregular Grids There are two main types of grids. A regular grid combines each parameter (with its corresponding set of possible values) factorially, i.e., by using all combinations of the sets. Alternatively, a nonregular grid is one where the parameter combinations are not formed from a small set of points. Before we look at each type in more detail, let’s consider an example model: the multilayer perceptron model (a.k.a. single layer artificial neural network). The parameters marked for tuning are: the number of hidden units the number of fitting epochs/iterations in model training the amount of weight decay penalization Historically, the number of epochs was determined by early stopping; a separate validation set determined the length of training based on the error rate, since re-predicting the training set led to overfitting. In our case, the use of a weight decay penalty should prohibit overfitting, and there is little harm in tuning the penalty and the number of epochs. Using parsnip, the specification for a classification model fit using the nnet package is: library(tidymodels) tidymodels_prefer() mlp_spec <- mlp(hidden_units = tune(), penalty = tune(), epochs = tune()) %>% set_engine("nnet", trace = 0) %>% set_mode("classification") The argument trace = 0 prevents extra logging of the training process. As shown in Section 12.6, the extract_parameter_set_dials() function can extract the set of arguments with unknown values and sets their dials objects: mlp_param <- extract_parameter_set_dials(mlp_spec) mlp_param %>% extract_parameter_dials("hidden_units") #> # Hidden Units (quantitative) #> Range: [1, 10] mlp_param %>% extract_parameter_dials("penalty") #> Amount of Regularization (quantitative) #> Transformer: log-10 [1e-100, Inf] #> Range (transformed scale): [-10, 0] mlp_param %>% extract_parameter_dials("epochs") #> # Epochs (quantitative) #> Range: [10, 1000] This output indicates that the parameter objects are complete and prints their default ranges. These values will be used to demonstrate how to create different types of parameter grids. Regular grids Regular grids are combinations of separate sets of parameter values. First, the user creates a distinct set of values for each parameter. The number of possible values need not be the same for each parameter. The tidyr function crossing() is one way to create a regular grid: crossing( hidden_units = 1:3, penalty = c(0.0, 0.1), epochs = c(100, 200) ) #> # A tibble: 12 × 3 #> hidden_units penalty epochs #> <int> <dbl> <dbl> #> 1 1 0 100 #> 2 1 0 200 #> 3 1 0.1 100 #> 4 1 0.1 200 #> 5 2 0 100 #> 6 2 0 200 #> # ℹ 6 more rows The parameter object knows the ranges of the parameters. The dials package contains a set of grid_*() functions that take the parameter object as input to produce different types of grids. For example: grid_regular(mlp_param, levels = 2) #> # A tibble: 8 × 3 #> hidden_units penalty epochs #> <int> <dbl> <int> #> 1 1 0.0000000001 10 #> 2 10 0.0000000001 10 #> 3 1 1 10 #> 4 10 1 10 #> 5 1 0.0000000001 1000 #> 6 10 0.0000000001 1000 #> # ℹ 2 more rows The levels argument is the number of levels per parameter to create. It can also take a named vector of values: mlp_param %>% grid_regular(levels = c(hidden_units = 3, penalty = 2, epochs = 2)) #> # A tibble: 12 × 3 #> hidden_units penalty epochs #> <int> <dbl> <int> #> 1 1 0.0000000001 10 #> 2 5 0.0000000001 10 #> 3 10 0.0000000001 10 #> 4 1 1 10 #> 5 5 1 10 #> 6 10 1 10 #> # ℹ 6 more rows There are techniques for creating regular grids that do not use all possible values of each parameter set. These fractional factorial designs (Box, Hunter, and Hunter 2005) could also be used. To learn more, consult the CRAN Task View for experimental design.28 Regular grids can be computationally expensive to use, especially when there are a medium-to-large number of tuning parameters. This is true for many models but not all. As discussed in Section 13.5 below, there are many models whose tuning time decreases with a regular grid! One advantage to using a regular grid is that the relationships and patterns between the tuning parameters and the model metrics are easily understood. The factorial nature of these designs allows for examination of each parameter separately with little confounding between parameters. Irregular grids There are several options for creating non-regular grids. The first is to use random sampling across the range of parameters. The grid_random() function generates independent uniform random numbers across the parameter ranges. If the parameter object has an associated transformation (such as we have for penalty), the random numbers are generated on the transformed scale. Let’s create a random grid for the parameters from our example neural network: set.seed(1301) mlp_param %>% grid_random(size = 1000) %>% # 'size' is the number of combinations summary() #> hidden_units penalty epochs #> Min. : 1.00 Min. :0.0000 Min. : 10 #> 1st Qu.: 3.00 1st Qu.:0.0000 1st Qu.:266 #> Median : 5.00 Median :0.0000 Median :497 #> Mean : 5.38 Mean :0.0437 Mean :510 #> 3rd Qu.: 8.00 3rd Qu.:0.0027 3rd Qu.:761 #> Max. :10.00 Max. :0.9814 Max. :999 For penalty, the random numbers are uniform on the log (base-10) scale but the values in the grid are in the natural units. The issue with random grids is that, with small-to-medium grids, random values can result in overlapping parameter combinations. Also, the random grid needs to cover the whole parameter space, but the likelihood of good coverage increases with the number of grid values. Even for a sample of 15 candidate points, Figure 13.1 shows some overlap between points for our example multilayer perceptron. library(ggforce) set.seed(1302) mlp_param %>% # The 'original = FALSE' option keeps penalty in log10 units grid_random(size = 20, original = FALSE) %>% ggplot(aes(x = .panel_x, y = .panel_y)) + geom_point() + geom_blank() + facet_matrix(vars(hidden_units, penalty, epochs), layer.diag = 2) + labs(title = "Random design with 20 candidates") Figure 13.1: Three tuning parameters with 15 points generated at random A much better approach is to use a set of experimental designs called space-filling designs. While different design methods have slightly different goals, they generally find a configuration of points that cover the parameter space with the smallest chance of overlapping or redundant values. Examples of such designs are Latin hypercubes (McKay, Beckman, and Conover 1979), maximum entropy designs (Shewry and Wynn 1987), maximum projection designs (Joseph, Gul, and Ba 2015), and others. See Santner et al. (2003) for an overview. The dials package contains functions for Latin hypercube and maximum entropy designs. As with grid_random(), the primary inputs are the number of parameter combinations and a parameter object. Let’s compare a random design with a Latin hypercube design for 20 candidate parameter values in Figure 13.2. set.seed(1303) mlp_param %>% grid_latin_hypercube(size = 20, original = FALSE) %>% ggplot(aes(x = .panel_x, y = .panel_y)) + geom_point() + geom_blank() + facet_matrix(vars(hidden_units, penalty, epochs), layer.diag = 2) + labs(title = "Latin Hypercube design with 20 candidates") Figure 13.2: Three tuning parameters with 20 points generated using a space-filling design While not perfect, this Latin hypercube design spaces the points farther away from one another and allows a better exploration of the hyperparameter space. Space-filling designs can be very effective at representing the parameter space. The default design used by the tune package is the maximum entropy design. These tend to produce grids that cover the candidate space well and drastically increase the chances of finding good results. 13.2 Evaluating the Grid To choose the best tuning parameter combination, each candidate set is assessed using data that were not used to train that model. Resampling methods or a single validation set work well for this purpose. The process (and syntax) closely resembles the approach in Section 10.3 that used the fit_resamples() function from the tune package. After resampling, the user selects the most appropriate candidate parameter set. It might make sense to choose the empirically best parameter combination or bias the choice towards other aspects of the model fit, such as simplicity. We use a classification data set to demonstrate model tuning in this and the next chapter. The data come from Hill et al. (2007), who developed an automated microscopy laboratory tool for cancer research. The data consists of 56 imaging measurements on 2019 human breast cancer cells. These predictors represent shape and intensity characteristics of different parts of the cells (e.g., the nucleus, the cell boundary, etc.). There is a high degree of correlation between the predictors. For example, there are several different predictors that measure the size and shape of the nucleus and cell boundary. Also, individually, many predictors have skewed distributions. Each cell belongs to one of two classes. Since this is part of an automated lab test, the focus was on prediction capability rather than inference. The data are included in the modeldata package. Let’s remove one column not needed for analysis (case): library(tidymodels) data(cells) cells <- cells %>% select(-case) Given the dimensions of the data, we can compute performance metrics using 10-fold cross-validation: set.seed(1304) cell_folds <- vfold_cv(cells) Because of the high degree of correlation between predictors, it makes sense to use PCA feature extraction to decorrelate the predictors. The following recipe contains steps to transform the predictors to increase symmetry, normalize them to be on the same scale, then conduct feature extraction. The number of PCA components to retain is also tuned, along with the model parameters. While the resulting PCA components are technically on the same scale, the lower-rank components tend to have a wider range than the higher-rank components. For this reason, we normalize again to coerce the predictors to have the same mean and variance. Many of the predictors have skewed distributions. Since PCA is variance based, extreme values can have a detrimental effect on these calculations. To counter this, let’s add a recipe step estimating a Yeo-Johnson transformation for each predictor (Yeo and Johnson 2000). While originally intended as a transformation of the outcome, it can also be used to estimate transformations that encourage more symmetric distributions. This step step_YeoJohnson() occurs in the recipe just prior to the initial normalization via step_normalize(). Then, let’s combine this feature engineering recipe with our neural network model specification mlp_spec. mlp_rec <- recipe(class ~ ., data = cells) %>% step_YeoJohnson(all_numeric_predictors()) %>% step_normalize(all_numeric_predictors()) %>% step_pca(all_numeric_predictors(), num_comp = tune()) %>% step_normalize(all_numeric_predictors()) mlp_wflow <- workflow() %>% add_model(mlp_spec) %>% add_recipe(mlp_rec) Let’s create a parameter object mlp_param to adjust a few of the default ranges. We can change the number of epochs to have a smaller range (50 to 200 epochs). Also, the default range for num_comp() defaults to a very narrow range (one to four components); we can increase the range to 40 components and set the minimum value to zero: mlp_param <- mlp_wflow %>% extract_parameter_set_dials() %>% update( epochs = epochs(c(50, 200)), num_comp = num_comp(c(0, 40)) ) In step_pca(), using zero PCA components is a shortcut to skip the feature extraction. In this way, the original predictors can be directly compared to the results that include PCA components. The tune_grid() function is the primary function for conducting grid search. Its functionality is very similar to fit_resamples() from Section 10.3, although it has additional arguments related to the grid: grid: An integer or data frame. When an integer is used, the function creates a space-filling design with grid number of candidate parameter combinations. If specific parameter combinations exist, the grid parameter is used to pass them to the function. param_info: An optional argument for defining the parameter ranges. The argument is most useful when grid is an integer. Otherwise, the interface to tune_grid() is the same as fit_resamples(). The first argument is either a model specification or workflow. When a model is given, the second argument can be either a recipe or formula. The other required argument is an rsample resampling object (such as cell_folds). The following call also passes a metric set so that the area under the ROC curve is measured during resampling. To start, let’s evaluate a regular grid with three levels across the resamples: roc_res <- metric_set(roc_auc) set.seed(1305) mlp_reg_tune <- mlp_wflow %>% tune_grid( cell_folds, grid = mlp_param %>% grid_regular(levels = 3), metrics = roc_res ) mlp_reg_tune #> # Tuning results #> # 10-fold cross-validation #> # A tibble: 10 × 4 #> splits id .metrics .notes #> <list> <chr> <list> <list> #> 1 <split [1817/202]> Fold01 <tibble [81 × 8]> <tibble [0 × 3]> #> 2 <split [1817/202]> Fold02 <tibble [81 × 8]> <tibble [0 × 3]> #> 3 <split [1817/202]> Fold03 <tibble [81 × 8]> <tibble [0 × 3]> #> 4 <split [1817/202]> Fold04 <tibble [81 × 8]> <tibble [0 × 3]> #> 5 <split [1817/202]> Fold05 <tibble [81 × 8]> <tibble [0 × 3]> #> 6 <split [1817/202]> Fold06 <tibble [81 × 8]> <tibble [0 × 3]> #> # ℹ 4 more rows There are high-level convenience functions we can use to understand the results. First, the autoplot() method for regular grids shows the performance profiles across tuning parameters in Figure 13.3. autoplot(mlp_reg_tune) + scale_color_viridis_d(direction = -1) + theme(legend.position = "top") Figure 13.3: The regular grid results For these data, the amount of penalization has the largest impact on the area under the ROC curve. The number of epochs doesn’t appear to have a pronounced effect on performance. The change in the number of hidden units appears to matter most when the amount of regularization is low (and harms performance). There are several parameter configurations that have roughly equivalent performance, as seen using the function show_best(): show_best(mlp_reg_tune) %>% select(-.estimator) #> # A tibble: 5 × 9 #> hidden_units penalty epochs num_comp .metric mean n std_err .config #> <int> <dbl> <int> <int> <chr'''
