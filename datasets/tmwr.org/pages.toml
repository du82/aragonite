full_description = '11 Comparing Models with Resampling Once we create two or more models, the next step is to compare them to understand which one is best. In some cases, comparisons might be within-model, where the same model might be evaluated with different features or preprocessing methods. Alternatively, between-model comparisons, such as when we compared linear regression and random forest models in Chapter 10, are the more common scenario. In either case, the result is a collection of resampled summary statistics (e.g., RMSE, accuracy, etc.) for each model. In this chapter, we’ll first demonstrate how workflow sets can be used to fit multiple models. Then, we’ll discuss important aspects of resampling statistics. Finally, we’ll look at how to formally compare models (using either hypothesis testing or a Bayesian approach). 11.1 Creating Multiple Models with Workflow Sets In Section 7.5 we described the idea of a workflow set where different preprocessors and/or models can be combinatorially generated. In Chapter 10, we used a recipe for the Ames data that included an interaction term as well as spline functions for longitude and latitude. To demonstrate more with workflow sets, let’s create three different linear models that add these preprocessing steps incrementally; we can test whether these additional terms improve the model results. We’ll create three recipes then combine them into a workflow set: library(tidymodels) tidymodels_prefer() basic_rec <- recipe(Sale_Price ~ Neighborhood + Gr_Liv_Area + Year_Built + Bldg_Type + Latitude + Longitude, data = ames_train) %>% step_log(Gr_Liv_Area, base = 10) %>% step_other(Neighborhood, threshold = 0.01) %>% step_dummy(all_nominal_predictors()) interaction_rec <- basic_rec %>% step_interact( ~ Gr_Liv_Area:starts_with("Bldg_Type_") ) spline_rec <- interaction_rec %>% step_ns(Latitude, Longitude, deg_free = 50) preproc <- list(basic = basic_rec, interact = interaction_rec, splines = spline_rec ) lm_models <- workflow_set(preproc, list(lm = linear_reg()), cross = FALSE) lm_models #> # A workflow set/tibble: 3 × 4 #> wflow_id info option result #> <chr> <list> <list> <list> #> 1 basic_lm <tibble [1 × 4]> <opts[0]> <list [0]> #> 2 interact_lm <tibble [1 × 4]> <opts[0]> <list [0]> #> 3 splines_lm <tibble [1 × 4]> <opts[0]> <list [0]> We’d like to resample each of these models in turn. To do so, we will use a purrr-like function called workflow_map(). This function takes an initial argument of the function to apply to the workflows, followed by options to that function. We also set a verbose argument that will print the progress as well as a seed argument that makes sure that each model uses the same random number stream as the others. lm_models <- lm_models %>% workflow_map("fit_resamples", # Options to `workflow_map()`: seed = 1101, verbose = TRUE, # Options to `fit_resamples()`: resamples = ames_folds, control = keep_pred) #> i 1 of 3 resampling: basic_lm #> ✔ 1 of 3 resampling: basic_lm (1.3s) #> i 2 of 3 resampling: interact_lm #> ✔ 2 of 3 resampling: interact_lm (1.4s) #> i 3 of 3 resampling: splines_lm #> ✔ 3 of 3 resampling: splines_lm (2.6s) lm_models #> # A workflow set/tibble: 3 × 4 #> wflow_id info option result #> <chr> <list> <list> <list> #> 1 basic_lm <tibble [1 × 4]> <opts[2]> <rsmp[+]> #> 2 interact_lm <tibble [1 × 4]> <opts[2]> <rsmp[+]> #> 3 splines_lm <tibble [1 × 4]> <opts[2]> <rsmp[+]> Notice that the option and result columns are now populated. The former includes the options to fit_resamples() that were given (for reproducibility), and the latter column contains the results produced by fit_resamples(). There are a few convenience functions for workflow sets, including collect_metrics() to collate the performance statistics. We can filter() to any specific metric we are interested in: collect_metrics(lm_models) %>% filter(.metric == "rmse") #> # A tibble: 3 × 9 #> wflow_id .config preproc model .metric .estimator mean n std_err #> <chr> <chr> <chr> <chr> <chr> <chr> <dbl> <int> <dbl> #> 1 basic_lm Preprocessor1_M… recipe line… rmse standard 0.0803 10 0.00264 #> 2 interact_lm Preprocessor1_M… recipe line… rmse standard 0.0799 10 0.00272 #> 3 splines_lm Preprocessor1_M… recipe line… rmse standard 0.0785 10 0.00282 What about the random forest model from the previous chapter? We can add it to the set by first converting it to its own workflow set then binding rows. This requires that, when the model was resampled, the save_workflow = TRUE option was set in the control function. four_models <- as_workflow_set(random_forest = rf_res) %>% bind_rows(lm_models) four_models #> # A workflow set/tibble: 4 × 4 #> wflow_id info option result #> <chr> <list> <list> <list> #> 1 random_forest <tibble [1 × 4]> <opts[0]> <rsmp[+]> #> 2 basic_lm <tibble [1 × 4]> <opts[2]> <rsmp[+]> #> 3 interact_lm <tibble [1 × 4]> <opts[2]> <rsmp[+]> #> 4 splines_lm <tibble [1 × 4]> <opts[2]> <rsmp[+]> The autoplot() method, with output in Figure 11.1, shows confidence intervals for each model in order of best to worst. In this chapter, we’ll focus on the coefficient of determination (a.k.a. \(R^2\)) and use metric = "rsq" in the call to set up our plot: library(ggrepel) autoplot(four_models, metric = "rsq") + geom_text_repel(aes(label = wflow_id), nudge_x = 1/8, nudge_y = 1/100) + theme(legend.position = "none") Figure 11.1: Confidence intervals for the coefficient of determination using four different models From this plot of \(R^2\) confidence intervals, we can see that the random forest method is doing the best job and there are minor improvements in the linear models as we add more recipe steps. Now that we have 10 resampled performance estimates for each of the four models, these summary statistics can be used to make between-model comparisons. 11.2 Comparing Resampled Performance Statistics Considering the preceding results for the three linear models, it appears that the additional terms do not profoundly improve the mean RMSE or \(R^2\) statistics for the linear models. The difference is small, but it might be larger than the experimental noise in the system, i.e., considered statistically significant. We can formally test the hypothesis that the additional terms increase \(R^2\). Before making between-model comparisons, it is important for us to discuss the within-resample correlation for resampling statistics. Each model was measured with the same cross-validation folds, and results for the same resample tend to be similar. In other words, there are some resamples where performance across models tends to be low and others where it tends to be high. In statistics, this is called a resample-to-resample component of variation. To illustrate, let’s gather the individual resampling statistics for the linear models and the random forest. We will focus on the \(R^2\) statistic for each model, which measures correlation between the observed and predicted sale prices for each house. Let’s filter() to keep only the \(R^2\) metrics, reshape the results, and compute how the metrics are correlated with each other. rsq_indiv_estimates <- collect_metrics(four_models, summarize = FALSE) %>% filter(.metric == "rsq") rsq_wider <- rsq_indiv_estimates %>% select(wflow_id, .estimate, id) %>% pivot_wider(id_cols = "id", names_from = "wflow_id", values_from = ".estimate") corrr::correlate(rsq_wider %>% select(-id), quiet = TRUE) #> # A tibble: 4 × 5 #> term random_forest basic_lm interact_lm splines_lm #> <chr> <dbl> <dbl> <dbl> <dbl> #> 1 random_forest NA 0.887 0.888 0.889 #> 2 basic_lm 0.887 NA 0.993 0.997 #> 3 interact_lm 0.888 0.993 NA 0.987 #> 4 splines_lm 0.889 0.997 0.987 NA These correlations are high, and indicate that, across models, there are large within-resample correlations. To see this visually in Figure 11.2, the \(R^2\) statistics are shown for each model with lines connecting the resamples: rsq_indiv_estimates %>% mutate(wflow_id = reorder(wflow_id, .estimate)) %>% ggplot(aes(x = wflow_id, y = .estimate, group = id, color = id)) + geom_line(alpha = .5, linewidth = 1.25) + theme(legend.position = "none") Figure 11.2: Resample statistics across models If the resample-to-resample effect was not real, there would not be any parallel lines. A statistical test for the correlations evaluates whether the magnitudes of these correlations are not simply noise. For the linear models: rsq_wider %>% with( cor.test(basic_lm, splines_lm) ) %>% tidy() %>% select(estimate, starts_with("conf")) #> # A tibble: 1 × 3 #> estimate conf.low conf.high #> <dbl> <dbl> <dbl> #> 1 0.997 0.987 0.999 The results of the correlation test (the estimate of the correlation and the confidence intervals) show us that the within-resample correlation appears to be real. What effect does the extra correlation have on our analysis? Consider the variance of a difference of two variables: \[\operatorname{Var}[X - Y] = \operatorname{Var}[X] + \operatorname{Var}[Y] - 2 \operatorname{Cov}[X, Y]\] The last term is the covariance between two items. If there is a significant positive covariance, then any statistical test of this difference would be critically under-powered comparing the difference in two models. In other words, ignoring the resample-to-resample effect would bias our model comparisons towards finding no differences between models. This characteristic of resampling statistics will come into play in the next two sections. Before making model comparisons or looking at the resampling results, it can be helpful to define a relevant practical effect size. Since these analyses focus on the \(R^2\) statistics, the practical effect size is the change in \(R^2\) that we would consider to be a realistic difference that matters. For example, we might think that two models are not practically different if their \(R^2\) values are within \(\pm 2\)%. If this were the case, differences smaller than 2% are not deemed important even if they are statistically significant. Practical significance is subjective; two people can have very different ideas on the threshold for importance. However, we’ll show later that this consideration can be very helpful when deciding between models. 11.3 Simple Hypothesis Testing Methods We can use simple hypothesis testing to make formal comparisons between models. Consider the familiar linear statistical model: \[y_{ij} = \beta_0 + \beta_1x_{i1} + \ldots + \beta_px_{ip} + \epsilon_{ij}\] This versatile model is used to create regression models as well as being the basis for the popular analysis of variance (ANOVA) technique for comparing groups. With the ANOVA model, the predictors (\(x_{ij}\)) are binary dummy variables for different groups. From this, the \(\beta\) parameters estimate whether two or more groups are different from one another using hypothesis testing techniques. In our specific situation, the ANOVA can also make model comparisons. Suppose the individual resampled \(R^2\) statistics serve as the outcome data (i.e., the \(y_{ij}\)) and the models as the predictors in the ANOVA model. A sampling of this data structure is shown in Table 11.1. Table 11.1: Model performance statistics as a data set for analysis. Y = rsq model X1 X2 X3 id 0.8108 basic_lm 0 0 0 Fold01 0.8134 interact_lm 1 0 0 Fold01 0.8615 random_forest 0 1 0 Fold01 0.8217 splines_lm 0 0 1 Fold01 0.8045 basic_lm 0 0 0 Fold02 0.8103 interact_lm 1 0 0 Fold02 The X1, X2, and X3 columns in the table are indicators for the values in the model column. Their order was defined in the same way that R would define them, alphabetically ordered by model. For our model comparison, the specific ANOVA model is: \[y_{ij} = \beta_0 + \beta_1x_{i1} + \beta_2x_{i2} + \beta_3x_{i3} + \epsilon_{ij}\] where \(\beta_0\) is the estimate of the mean \(R^2\) statistic for the basic linear models (i.e., without splines or interactions), \(\beta_1\) is the change in mean \(R^2\) when interactions are added to the basic linear model, \(\beta_2\) is the change in mean \(R^2\) between the basic linear model and the random forest model, and \(\beta_3\) is the change in mean \(R^2\) between the basic linear model and one with interactions and splines. From these model parameters, hypothesis tests and p-values are generated to statistically compare models, but we must contend with how to handle the resample-to-resample effect. Historically, the resample groups would be considered a block effect and an appropriate term was added to the model. Alternatively, the resample effect could be considered a random effect where these particular resamples were drawn at random from a larger population of possible resamples. However, we aren’t really interested in these effects; we only want to adjust for them in the model so that the variances of the interesting differences are properly estimated. Treating the resamples as random effects is theoretically appealing. Methods for fitting an ANOVA model with this type of random effect could include the linear mixed model (Faraway 2016) or a Bayesian hierarchical model (shown in the next section). A simple and fast method for comparing two models at a time is to use the differences in \(R^2\) values as the outcome data in the ANOVA model. Since the outcomes are matched by resample, the differences do not contain the resample-to-resample effect and, for this reason, the standard ANOVA model is appropriate. To illustrate, this call to lm() tests the difference between two of the linear regression models: compare_lm <- rsq_wider %>% mutate(difference = splines_lm - basic_lm) lm(difference ~ 1, data = compare_lm) %>% tidy(conf.int = TRUE) %>% select(estimate, p.value, starts_with("conf")) #> # A tibble: 1 × 4 #> estimate p.value conf.low conf.high #> <dbl> <dbl> <dbl> <dbl> #> 1 0.00913 0.0000256 0.00650 0.0118 # Alternatively, a paired t-test could also be used: rsq_wider %>% with( t.test(splines_lm, basic_lm, paired = TRUE) ) %>% tidy() %>% select(estimate, p.value, starts_with("conf")) #> # A tibble: 1 × 4 #> estimate p.value conf.low conf.high #> <dbl> <dbl> <dbl> <dbl> #> 1 0.00913 0.0000256 0.00650 0.0118 We could evaluate each pair-wise difference in this way. Note that the p-value indicates a statistically significant signal; the collection of spline terms for longitude and latitude do appear to have an effect. However, the difference in \(R^2\) is estimated at 0.91%. If our practical effect size were 2%, we might not consider these terms worth including in the model. We’ve briefly mentioned p-values already, but what actually are they? From Wasserstein and Lazar (2016): “Informally, a p-value is the probability under a specified statistical model that a statistical summary of the data (e.g., the sample mean difference between two compared groups) would be equal to or more extreme than its observed value.” In other words, if this analysis were repeated a large number of times under the null hypothesis of no differences, the p-value reflects how extreme our observed results would be in comparison. 11.4 Bayesian Methods We just us'
