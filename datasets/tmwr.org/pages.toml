full_description = '10 Resampling for Evaluating Performance We have already covered several pieces that must be put together to evaluate the performance of a model. Chapter 9 described statistics for measuring model performance. Chapter 5 introduced the idea of data spending, and we recommended the test set for obtaining an unbiased estimate of performance. However, we usually need to understand the performance of a model or even multiple models before using the test set. Typically we can’t decide on which final model to use with the test set before first assessing model performance. There is a gap between our need to measure performance reliably and the data splits (training and testing) we have available. In this chapter, we describe an approach called resampling that can fill this gap. Resampling estimates of performance can generalize to new data in a similar way as estimates from a test set. The next chapter complements this one by demonstrating statistical methods that compare resampling results. In order to fully appreciate the value of resampling, let’s first take a look the resubstitution approach, which can often fail. 10.1 The Resubstitution Approach When we measure performance on the same data that we used for training (as opposed to new data or testing data), we say we have resubstituted the data. Let’s again use the Ames housing data to demonstrate these concepts. Section 8.8 summarizes the current state of our Ames analysis. It includes a recipe object named ames_rec, a linear model, and a workflow using that recipe and model called lm_wflow. This workflow was fit on the training set, resulting in lm_fit. For a comparison to this linear model, we can also fit a different type of model. Random forests are a tree ensemble method that operates by creating a large number of decision trees from slightly different versions of the training set (Breiman 2001a). This collection of trees makes up the ensemble. When predicting a new sample, each ensemble member makes a separate prediction. These are averaged to create the final ensemble prediction for the new data point. Random forest models are very powerful, and they can emulate the underlying data patterns very closely. While this model can be computationally intensive, it is very low maintenance; very little preprocessing is required (as documented in Appendix A). Using the same predictor set as the linear model (without the extra preprocessing steps), we can fit a random forest model to the training set via the "ranger" engine (which uses the ranger R package for computation). This model requires no preprocessing, so a simple formula can be used: rf_model <- rand_forest(trees = 1000) %>% set_engine("ranger") %>% set_mode("regression") rf_wflow <- workflow() %>% add_formula( Sale_Price ~ Neighborhood + Gr_Liv_Area + Year_Built + Bldg_Type + Latitude + Longitude) %>% add_model(rf_model) rf_fit <- rf_wflow %>% fit(data = ames_train) How should we compare the linear and random forest models? For demonstration, we will predict the training set to produce what is known as an apparent metric or resubstitution metric. This function creates predictions and formats the results: estimate_perf <- function(model, dat) { # Capture the names of the `model` and `dat` objects cl <- match.call() obj_name <- as.character(cl$model) data_name <- as.character(cl$dat) data_name <- gsub("ames_", "", data_name) # Estimate these metrics: reg_metrics <- metric_set(rmse, rsq) model %>% predict(dat) %>% bind_cols(dat %>% select(Sale_Price)) %>% reg_metrics(Sale_Price, .pred) %>% select(-.estimator) %>% mutate(object = obj_name, data = data_name) } Both RMSE and \(R^2\) are computed. The resubstitution statistics are: estimate_perf(rf_fit, ames_train) #> # A tibble: 2 × 4 #> .metric .estimate object data #> <chr> <dbl> <chr> <chr> #> 1 rmse 0.0365 rf_fit train #> 2 rsq 0.960 rf_fit train estimate_perf(lm_fit, ames_train) #> # A tibble: 2 × 4 #> .metric .estimate object data #> <chr> <dbl> <chr> <chr> #> 1 rmse 0.0754 lm_fit train #> 2 rsq 0.816 lm_fit train Based on these results, the random forest is much more capable of predicting the sale prices; the RMSE estimate is two-fold better than linear regression. If we needed to choose between these two models for this price prediction problem, we would probably chose the random forest because, on the log scale we are using, its RMSE is about half as large. The next step applies the random forest model to the test set for final verification: estimate_perf(rf_fit, ames_test) #> # A tibble: 2 × 4 #> .metric .estimate object data #> <chr> <dbl> <chr> <chr> #> 1 rmse 0.0704 rf_fit test #> 2 rsq 0.852 rf_fit test The test set RMSE estimate, 0.0704, is much worse than the training set value of 0.0365! Why did this happen? Many predictive models are capable of learning complex trends from the data. In statistics, these are commonly referred to as low bias models. In this context, bias is the difference between the true pattern or relationships in data and the types of patterns that the model can emulate. Many black-box machine learning models have low bias, meaning they can reproduce complex relationships. Other models (such as linear/logistic regression, discriminant analysis, and others) are not as adaptable and are considered high bias models.18 For a low bias model, the high degree of predictive capacity can sometimes result in the model nearly memorizing the training set data. As an obvious example, consider a 1-nearest neighbor model. It will always provide perfect predictions for the training set no matter how well it truly works for other data sets. Random forest models are similar; repredicting the training set will always result in an artificially optimistic estimate of performance. For both models, Table 10.1 summarizes the RMSE estimate for the training and test sets: Table 10.1: Performance statistics for training and test sets. RMSE Estimates object train test lm_fit 0.0754 0.0736 rf_fit 0.0365 0.0704 Notice that the linear regression model is consistent between training and testing, because of its limited complexity.19 The main takeaway from this example is that repredicting the training set will result in an artificially optimistic estimate of performance. It is a bad idea for most models. If the test set should not be used immediately, and repredicting the training set is a bad idea, what should be done? Resampling methods, such as cross-validation or validation sets, are the solution. 10.2 Resampling Methods Resampling methods are empirical simulation systems that emulate the process of using some data for modeling and different data for evaluation. Most resampling methods are iterative, meaning that this process is repeated multiple times. The diagram in Figure 10.1 illustrates how resampling methods generally operate. Figure 10.1: Data splitting scheme from the initial data split to resampling Resampling is conducted only on the training set, as you see in Figure 10.1. The test set is not involved. For each iteration of resampling, the data are partitioned into two subsamples: The model is fit with the analysis set. The model is evaluated with the assessment set. These two subsamples are somewhat analogous to training and test sets. Our language of analysis and assessment avoids confusion with the initial split of the data. These data sets are mutually exclusive. The partitioning scheme used to create the analysis and assessment sets is usually the defining characteristic of the method. Suppose 20 iterations of resampling are conducted. This means that 20 separate models are fit on the analysis sets, and the corresponding assessment sets produce 20 sets of performance statistics. The final estimate of performance for a model is the average of the 20 replicates of the statistics. This average has very good generalization properties and is far better than the resubstitution estimates. The next section defines several commonly used resampling methods and discusses their pros and cons. 10.2.1 Cross-validation Cross-validation is a well established resampling method. While there are a number of variations, the most common cross-validation method is V-fold cross-validation. The data are randomly partitioned into V sets of roughly equal size (called the folds). For illustration, V = 3 is shown in Figure 10.2 for a data set of 30 training set points with random fold allocations. The number inside the symbols is the sample number. Figure 10.2: V-fold cross-validation randomly assigns data to folds The color of the symbols in Figure 10.2 represents their randomly assigned folds. Stratified sampling is also an option for assigning folds (previously discussed in Section 5.1). For three-fold cross-validation, the three iterations of resampling are illustrated in Figure 10.3. For each iteration, one fold is held out for assessment statistics and the remaining folds are substrate for the model. This process continues for each fold so that three models produce three sets of performance statistics. Figure 10.3: V-fold cross-validation data usage When V = 3, the analysis sets are 2/3 of the training set and each assessment set is a distinct 1/3. The final resampling estimate of performance averages each of the V replicates. Using V = 3 is a good choice to illustrate cross-validation, but it is a poor choice in practice because it is too low to generate reliable estimates. In practice, values of V are most often 5 or 10; we generally prefer 10-fold cross-validation as a default because it is large enough for good results in most situations. What are the effects of changing V? Larger values result in resampling estimates with small bias but substantial variance. Smaller values of V have large bias but low variance. We prefer 10-fold since noise is reduced by replication, but bias is not.20 The primary input is the training set data frame as well as the number of folds (defaulting to 10): set.seed(1001) ames_folds <- vfold_cv(ames_train, v = 10) ames_folds #> # 10-fold cross-validation #> # A tibble: 10 × 2 #> splits id #> <list> <chr> #> 1 <split [2107/235]> Fold01 #> 2 <split [2107/235]> Fold02 #> 3 <split [2108/234]> Fold03 #> 4 <split [2108/234]> Fold04 #> 5 <split [2108/234]> Fold05 #> 6 <split [2108/234]> Fold06 #> # ℹ 4 more rows The column named splits contains the information on how to split the data (similar to the object used to create the initial training/test partition). While each row of splits has an embedded copy of the entire training set, R is smart enough not to make copies of the data in memory.21 The print method inside of the tibble shows the frequency of each: [2107/235] indicates that about two thousand samples are in the analysis set and 235 are in that particular assessment set. These objects also always contain a character column called id that labels the partition.22 To manually retrieve the partitioned data, the analysis() and assessment() functions return the corresponding data frames: # For the first fold: ames_folds$splits[[1]] %>% analysis() %>% dim() #> [1] 2107 74 The tidymodels packages, such as tune, contain high-level user interfaces so that functions like analysis() are not generally needed for day-to-day work. Section 10.3 demonstrates a function to fit a model over these resamples. There are a variety of cross-validation variations; we’ll go through the most important ones. Repeated cross-validation The most important variation on cross-validation is repeated V-fold cross-validation. Depending on data size or other characteristics, the resampling estimate produced by V-fold cross-validation may be excessively noisy.23 As with many statistical problems, one way to reduce noise is to gather more data. For cross-validation, this means averaging more than V statistics. To create R repeats of V-fold cross-validation, the same fold generation process is done R times to generate R collections of V partitions. Now, instead of averaging V statistics, \(V \times R\) statistics produce the final resampling estimate. Due to the Central Limit Theorem, the summary statistics from each model tend toward a normal distribution, as long as we have a lot of data relative to \(V \times R\). Consider the Ames data. On average, 10-fold cross-validation uses assessment sets that contain roughly 234 properties. If RMSE is the statistic of choice, we can denote that estimate’s standard deviation as \(\sigma\). With simple 10-fold cross-validation, the standard error of the mean RMSE is \(\sigma/\sqrt{10}\). If this is too noisy, repeats reduce the standard error to \(\sigma/\sqrt{10R}\). For 10-fold cross-validation with \(R\) replicates, the plot in Figure 10.4 shows how quickly the standard error24 decreases with replicates. Figure 10.4: Relationship between the relative variance in performance estimates versus the number of cross-validation repeats Larger numbers of replicates tend to have less impact on the standard error. However, if the baseline value of \(\sigma\) is impractically large, the diminishing returns on replication may still be worth the extra computational costs. To create repeats, invoke vfold_cv() with an additional argument repeats: vfold_cv(ames_train, v = 10, repeats = 5) #> # 10-fold cross-validation repeated 5 times #> # A tibble: 50 × 3 #> splits id id2 #> <list> <chr> <chr> #> 1 <split [2107/235]> Repeat1 Fold01 #> 2 <split [2107/235]> Repeat1 Fold02 #> 3 <split [2108/234]> Repeat1 Fold03 #> 4 <split [2108/234]> Repeat1 Fold04 #> 5 <split [2108/234]> Repeat1 Fold05 #> 6 <split [2108/234]> Repeat1 Fold06 #> # ℹ 44 more rows Leave-one-out cross-validation One variation of cross-validation is leave-one-out (LOO) cross-validation. If there are \(n\) training set samples, \(n\) models are fit using \(n-1\) rows of the training set. Each model predicts the single excluded data point. At the end of resampling, the \(n\) predictions are pooled to produce a single performance statistic. Leave-one-out methods are deficient compared to almost any other method. For anything but pathologically small samples, LOO is computationally excessive, and it may not have good statistical properties. Although the rsample package contains a loo_cv() function, these objects are not generally integrated into the broader tidymodels frameworks. Monte Carlo cross-validation Another variant of V-fold cross-validation is Monte Carlo cross-validation (MCCV, Xu and Liang (2001)). Like V-fold cross-validation, it allocates a fixed proportion of data to the assessment sets. The difference between MCCV and regular cross-validation is that, for MCCV, this proportion of the data is randomly selected each time. This results in assessment sets that are not mutually exclusive. To create these resampling objects: mc_cv(ames_train, prop = 9/10, times = 20) #> # Monte Carlo cross-validation (0.9/0.1) with 20 resamples #> # A tibble: 20 × 2 #> splits id #> <list> <chr> #> 1 <split [2107/235]> Resample01 #> 2 <split [2107/235]> Resample02 #> 3 <split [2107/235]> Re'
