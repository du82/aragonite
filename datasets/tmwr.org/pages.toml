full_description = '8 Feature Engineering with recipes Feature engineering entails reformatting predictor values to make them easier for a model to use effectively. This includes transformations and encodings of the data to best represent their important characteristics. Imagine that you have two predictors in a data set that can be more effectively represented in your model as a ratio; creating a new predictor from the ratio of the original two is a simple example of feature engineering. Take the location of a house in Ames as a more involved example. There are a variety of ways that this spatial information can be exposed to a model, including neighborhood (a qualitative measure), longitude/latitude, distance to the nearest school or Iowa State University, and so on. When choosing how to encode these data in modeling, we might choose an option we believe is most associated with the outcome. The original format of the data, for example numeric (e.g., distance) versus categorical (e.g., neighborhood), is also a driving factor in feature engineering choices. Other examples of preprocessing to build better features for modeling include: Correlation between predictors can be reduced via feature extraction or the removal of some predictors. When some predictors have missing values, they can be imputed using a sub-model. Models that use variance-type measures may benefit from coercing the distribution of some skewed predictors to be symmetric by estimating a transformation. Feature engineering and data preprocessing can also involve reformatting that may be required by the model. Some models use geometric distance metrics and, consequently, numeric predictors should be centered and scaled so that they are all in the same units. Otherwise, the distance values would be biased by the scale of each column. Different models have different preprocessing requirements and some, such as tree-based models, require very little preprocessing at all. Appendix A contains a small table of recommended preprocessing techniques for different models. In this chapter, we introduce the recipes package that you can use to combine different feature engineering and preprocessing tasks into a single object and then apply these transformations to different data sets. The recipes package is, like parsnip for models, one of the core tidymodels packages. This chapter uses the Ames housing data and the R objects created in the book so far, as summarized in Section 7.7. 8.1 A Simple recipe() for the Ames Housing Data In this section, we will focus on a small subset of the predictors available in the Ames housing data: The neighborhood (qualitative, with 29 neighborhoods in the training set) The gross above-grade living area (continuous, named Gr_Liv_Area) The year built (Year_Built) The type of building (Bldg_Type with values OneFam (\(n = 1,936\)), TwoFmCon (\(n = 50\)), Duplex (\(n = 88\)), Twnhs (\(n = 77\)), and TwnhsE (\(n = 191\))) Suppose that an initial ordinary linear regression model were fit to these data. Recalling that, in Chapter 4, the sale prices were pre-logged, a standard call to lm() might look like: lm(Sale_Price ~ Neighborhood + log10(Gr_Liv_Area) + Year_Built + Bldg_Type, data = ames) When this function is executed, the data are converted from a data frame to a numeric design matrix (also called a model matrix) and then the least squares method is used to estimate parameters. In Section 3.2 we listed the multiple purposes of the R model formula; let’s focus only on the data manipulation aspects for now. What this formula does can be decomposed into a series of steps: Sale price is defined as the outcome while neighborhood, gross living area, the year built, and building type variables are all defined as predictors. A log transformation is applied to the gross living area predictor. The neighborhood and building type columns are converted from a non-numeric format to a numeric format (since least squares requires numeric predictors). As mentioned in Chapter 3, the formula method will apply these data manipulations to any data, including new data, that are passed to the predict() function. A recipe is also an object that defines a series of steps for data processing. Unlike the formula method inside a modeling function, the recipe defines the steps via step_*() functions without immediately executing them; it is only a specification of what should be done. Here is a recipe equivalent to the previous formula that builds on the code summary in Section 5.5: library(tidymodels) # Includes the recipes package tidymodels_prefer() simple_ames <- recipe(Sale_Price ~ Neighborhood + Gr_Liv_Area + Year_Built + Bldg_Type, data = ames_train) %>% step_log(Gr_Liv_Area, base = 10) %>% step_dummy(all_nominal_predictors()) simple_ames #> #> ── Recipe ─────────────────────────────────────────────────────────────────────────── #> #> ── Inputs #> Number of variables by role #> outcome: 1 #> predictor: 4 #> #> ── Operations #> • Log transformation on: Gr_Liv_Area #> • Dummy variables from: all_nominal_predictors() Let’s break this down: The call to recipe() with a formula tells the recipe the roles of the “ingredients” or variables (e.g., predictor, outcome). It only uses the data ames_train to determine the data types for the columns. step_log() declares that Gr_Liv_Area should be log transformed. step_dummy() specifies which variables should be converted from a qualitative format to a quantitative format, in this case, using dummy or indicator variables. An indicator or dummy variable is a binary numeric variable (a column of ones and zeroes) that encodes qualitative information; we will dig deeper into these kinds of variables in Section 8.4.1. The function all_nominal_predictors() captures the names of any predictor columns that are currently factor or character (i.e., nominal) in nature. This is a dplyr-like selector function similar to starts_with() or matches() but that can only be used inside of a recipe. Other selectors specific to the recipes package are: all_numeric_predictors(), all_numeric(), all_predictors(), and all_outcomes(). As with dplyr, one or more unquoted expressions, separated by commas, can be used to select which columns are affected by each step. What is the advantage to using a recipe, over a formula or raw predictors? There are a few, including: These computations can be recycled across models since they are not tightly coupled to the modeling function. A recipe enables a broader set of data processing choices than formulas can offer. The syntax can be very compact. For example, all_nominal_predictors() can be used to capture many variables for specific types of processing while a formula would require each to be explicitly listed. All data processing can be captured in a single R object instead of in scripts that are repeated, or even spread across different files. 8.2 Using Recipes As we discussed in Chapter 7, preprocessing choices and feature engineering should typically be considered part of a modeling workflow, not a separate task. The workflows package contains high level functions to handle different types of preprocessors. Our previous workflow (lm_wflow) used a simple set of dplyr selectors. To improve on that approach with more complex feature engineering, let’s use the simple_ames recipe to preprocess data for modeling. This object can be attached to the workflow: lm_wflow %>% add_recipe(simple_ames) #> Error in `add_recipe()`: #> ! A recipe cannot be added when variables already exist. That did not work! We can have only one preprocessing method at a time, so we need to remove the existing preprocessor before adding the recipe. lm_wflow <- lm_wflow %>% remove_variables() %>% add_recipe(simple_ames) lm_wflow #> ══ Workflow ═════════════════════════════════════════════════════════════════════════ #> Preprocessor: Recipe #> Model: linear_reg() #> #> ── Preprocessor ───────────────────────────────────────────────────────────────────── #> 2 Recipe Steps #> #> • step_log() #> • step_dummy() #> #> ── Model ──────────────────────────────────────────────────────────────────────────── #> Linear Regression Model Specification (regression) #> #> Computational engine: lm Let’s estimate both the recipe and model using a simple call to fit(): lm_fit <- fit(lm_wflow, ames_train) The predict() method applies the same preprocessing that was used on the training set to the new data before passing them along to the model’s predict() method: predict(lm_fit, ames_test %>% slice(1:3)) #> # A tibble: 3 × 1 #> .pred #> <dbl> #> 1 5.08 #> 2 5.32 #> 3 5.28 If we need the bare model object or recipe, there are extract_* functions that can retrieve them: # Get the recipe after it has been estimated: lm_fit %>% extract_recipe(estimated = TRUE) #> #> ── Recipe ─────────────────────────────────────────────────────────────────────────── #> #> ── Inputs #> Number of variables by role #> outcome: 1 #> predictor: 4 #> #> ── Training information #> Training data contained 2342 data points and no incomplete rows. #> #> ── Operations #> • Log transformation on: Gr_Liv_Area | Trained #> • Dummy variables from: Neighborhood, Bldg_Type | Trained # To tidy the model fit: lm_fit %>% # This returns the parsnip object: extract_fit_parsnip() %>% # Now tidy the linear model object: tidy() %>% slice(1:5) #> # A tibble: 5 × 5 #> term estimate std.error statistic p.value #> <chr> <dbl> <dbl> <dbl> <dbl> #> 1 (Intercept) -0.669 0.231 -2.90 3.80e- 3 #> 2 Gr_Liv_Area 0.620 0.0143 43.2 2.63e-299 #> 3 Year_Built 0.00200 0.000117 17.1 6.16e- 62 #> 4 Neighborhood_College_Creek 0.0178 0.00819 2.17 3.02e- 2 #> 5 Neighborhood_Old_Town -0.0330 0.00838 -3.93 8.66e- 5 Tools for using (and debugging) recipes outside of workflow objects are described in Section 16.4. 8.3 How Data Are Used by the recipe() Data are passed to recipes at different stages. First, when calling recipe(..., data), the data set is used to determine the data types of each column so that selectors such as all_numeric() or all_numeric_predictors() can be used. Second, when preparing the data using fit(workflow, data), the training data are used for all estimation operations including a recipe that may be part of the workflow, from determining factor levels to computing PCA components and everything in between. All preprocessing and feature engineering steps use only the training data. Otherwise, information leakage can negatively impact the model’s performance when used with new data. Finally, when using predict(workflow, new_data), no model or preprocessor parameters like those from recipes are re-estimated using the values in new_data. Take centering and scaling using step_normalize() as an example. Using this step, the means and standard deviations from the appropriate columns are determined from the training set; new samples at prediction time are standardized using these values from training when predict() is invoked. 8.4 Examples of Recipe Steps Before proceeding, let’s take an extended tour of the capabilities of recipes and explore some of the most important step_*() functions. These recipe step functions each specify a specific possible step in a feature engineering process, and different recipe steps can have different effects on columns of data. 8.4.1 Encoding qualitative data in a numeric format One of the most common feature engineering tasks is transforming nominal or qualitative data (factors or characters) so that they can be encoded or represented numerically. Sometimes we can alter the factor levels of a qualitative column in helpful ways prior to such a transformation. For example, step_unknown() can be used to change missing values to a dedicated factor level. Similarly, if we anticipate that a new factor level may be encountered in future data, step_novel() can allot a new level for this purpose. Additionally, step_other() can be used to analyze the frequencies of the factor levels in the training set and convert infrequently occurring values to a catch-all level of “other,” with a threshold that can be specified. A good example is the Neighborhood predictor in our data, shown in Figure 8.1. Figure 8.1: Frequencies of neighborhoods in the Ames training set Here we see that two neighborhoods have less than five properties in the training data (Landmark and Green Hills); in this case, no houses at all in the Landmark neighborhood were included in the testing set. For some models, it may be problematic to have dummy variables with a single nonzero entry in the column. At a minimum, it is highly improbable that these features would be important to a model. If we add step_other(Neighborhood, threshold = 0.01) to our recipe, the bottom 1% of the neighborhoods will be lumped into a new level called “other.” In this training set, this will catch seven neighborhoods. For the Ames data, we can amend the recipe to use: simple_ames <- recipe(Sale_Price ~ Neighborhood + Gr_Liv_Area + Year_Built + Bldg_Type, data = ames_train) %>% step_log(Gr_Liv_Area, base = 10) %>% step_other(Neighborhood, threshold = 0.01) %>% step_dummy(all_nominal_predictors()) Many, but not all, underlying model calculations require predictor values to be encoded as numbers. Notable exceptions include tree-based models, rule-based models, and naive Bayes models. The most common method for converting a factor predictor to a numeric format is to create dummy or indicator variables. Let’s take the predictor in the Ames data for the building type, which is a factor variable with five levels (see Table 8.1). For dummy variables, the single Bldg_Type column would be replaced with four numeric columns whose values are either zero or one. These binary variables represent specific factor level values. In R, the convention is to exclude a column for the first factor level (OneFam, in this case). The Bldg_Type column would be replaced with a column called TwoFmCon that is one when the row has that value and zero otherwise. Three other columns are similarly created: Table 8.1: Illustration of binary encodings (i.e., dummy variables) for a qualitative predictor. Raw Data TwoFmCon Duplex Twnhs TwnhsE OneFam 0 0 0 0 TwoFmCon 1 0 0 0 Duplex 0 1 0 0 Twnhs 0 0 1 0 TwnhsE 0 0 0 1 Why not all five? The most basic reason is simplicity; if you know the value for these four columns, you can determine the last value because these are mutually exclusive categories. More technically, the classical justification is that a number of models, including ordinary linear regression, have numerical issues when there are linear dependencies between columns. If all five building type indicator columns are included, they would add up to the intercept column (if there is one). This would cause an issue, or perhaps an outright error, in the underlying matrix algebra. The full set of encodings can be used for some models. This is traditionally called the one-hot encoding and can be achieved using the one_hot argument of step_dummy(). One helpful feature of step_dummy() is that th'
