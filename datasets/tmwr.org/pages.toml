full_description = '''16 Dimensionality Reduction Dimensionality reduction transforms a data set from a high-dimensional space into a low-dimensional space, and can be a good choice when you suspect there are “too many” variables. An excess of variables, usually predictors, can be a problem because it is difficult to understand or visualize data in higher dimensions. 16.1 What Problems Can Dimensionality Reduction Solve? Dimensionality reduction can be used either in feature engineering or in exploratory data analysis. For example, in high-dimensional biology experiments, one of the first tasks, before any modeling, is to determine if there are any unwanted trends in the data (e.g., effects not related to the question of interest, such as lab-to-lab differences). Debugging the data is difficult when there are hundreds of thousands of dimensions, and dimensionality reduction can be an aid for exploratory data analysis. Another potential consequence of having a multitude of predictors is possible harm to a model. The simplest example is a method like ordinary linear regression where the number of predictors should be less than the number of data points used to fit the model. Another issue is multicollinearity, where between-predictor correlations can negatively impact the mathematical operations used to estimate a model. If there are an extremely large number of predictors, it is fairly unlikely that there are an equal number of real underlying effects. Predictors may be measuring the same latent effect(s), and thus such predictors will be highly correlated. Many dimensionality reduction techniques thrive in this situation. In fact, most can be effective only when there are such relationships between predictors that can be exploited. When starting a new modeling project, reducing the dimensions of the data may provide some intuition about how hard the modeling problem may be. Principal component analysis (PCA) is one of the most straightforward methods for reducing the number of columns in the data set because it relies on linear methods and is unsupervised (i.e., does not consider the outcome data). For a high-dimensional classification problem, an initial plot of the main PCA components might show a clear separation between the classes. If this is the case, then it is fairly safe to assume that a linear classifier might do a good job. However, the converse is not true; a lack of separation does not mean that the problem is insurmountable. The dimensionality reduction methods discussed in this chapter are generally not feature selection methods. Methods such as PCA represent the original predictors using a smaller subset of new features. All of the original predictors are required to compute these new features. The exception to this are sparse methods that have the ability to completely remove the impact of predictors when creating the new features. This chapter has two goals: Demonstrate how to use recipes to create a small set of features that capture the main aspects of the original predictor set. Describe how recipes can be used on their own (as opposed to being used in a workflow object, as in Section 8.2). The latter is helpful when testing or debugging a recipe. However, as described in Section 8.2, the best way to use a recipe for modeling is from within a workflow object. In addition to the tidymodels package, this chapter uses the following packages: baguette, beans, bestNormalize, corrplot, discrim, embed, ggforce, klaR, learntidymodels,32 mixOmics,33 and uwot. 16.2 A Picture Is Worth a Thousand… Beans Let’s walk through how to use dimensionality reduction with recipes for an example data set. Koklu and Ozkan (2020) published a data set of visual characteristics of dried beans and described methods for determining the varieties of dried beans in an image. While the dimensionality of these data is not very large compared to many real-world modeling problems, it does provide a nice working example to demonstrate how to reduce the number of features. From their manuscript: The primary objective of this study is to provide a method for obtaining uniform seed varieties from crop production, which is in the form of population, so the seeds are not certified as a sole variety. Thus, a computer vision system was developed to distinguish seven different registered varieties of dry beans with similar features in order to obtain uniform seed classification. For the classification model, images of 13,611 grains of 7 different registered dry beans were taken with a high-resolution camera. Each image contains multiple beans. The process of determining which pixels correspond to a particular bean is called image segmentation. These pixels can be analyzed to produce features for each bean, such as color and morphology (i.e., shape). These features are then used to model the outcome (bean variety) because different bean varieties look different. The training data come from a set of manually labeled images, and this data set is used to create a predictive model that can distinguish between seven bean varieties: Cali, Horoz, Dermason, Seker, Bombay, Barbunya, and Sira. Producing an effective model can help manufacturers quantify the homogeneity of a batch of beans. There are numerous methods for quantifying shapes of objects (Mingqiang, Kidiyo, and Joseph 2008). Many are related to the boundaries or regions of the object of interest. Example of features include: The area (or size) can be estimated using the number of pixels in the object or the size of the convex hull around the object. We can measure the perimeter using the number of pixels in the boundary as well as the area of the bounding box (the smallest rectangle enclosing an object). The major axis quantifies the longest line connecting the most extreme parts of the object. The minor axis is perpendicular to the major axis. We can measure the compactness of an object using the ratio of the object’s area to the area of a circle with the same perimeter. For example, the symbols “•” and “×” have very different compactness. There are also different measures of how elongated or oblong an object is. For example, the eccentricity statistic is the ratio of the major and minor axes. There are also related estimates for roundness and convexity. Notice the eccentricity for the different shapes in Figure 16.1. Figure 16.1: Some example shapes and their eccentricity statistics Shapes such as circles and squares have low eccentricity while oblong shapes have high values. Also, the metric is unaffected by the rotation of the object. Many of these image features have high correlations; objects with large areas are more likely to have large perimeters. There are often multiple methods to quantify the same underlying characteristics (e.g., size). In the bean data, 16 morphology features were computed: area, perimeter, major axis length, minor axis length, aspect ratio, eccentricity, convex area, equiv diameter, extent, solidity, roundness, compactness, shape factor 1, shape factor 2, shape factor 3, and shape factor 4. The latter four are described in Symons and Fulcher (1988). We can begin by loading the data: library(tidymodels) tidymodels_prefer() library(beans) It is important to maintain good data discipline when evaluating dimensionality reduction techniques, especially if you will use them within a model. For our analyses, we start by holding back a testing set with initial_split(). The remaining data are split into training and validation sets: set.seed(1601) bean_split <- initial_validation_split(beans, strata = class, prop = c(0.75, 0.125)) #> Warning: Too little data to stratify. #> • Resampling will be unstratified. bean_split #> <Training/Validation/Testing/Total> #> <10206/1702/1703/13611> # Return data frames: bean_train <- training(bean_split) bean_test <- testing(bean_split) bean_validation <- validation(bean_split) set.seed(1602) # Return an 'rset' object to use with the tune functions: bean_val <- validation_set(bean_split) bean_val$splits[[1]] #> <Training/Validation/Total> #> <10206/1702/11908> To visually assess how well different methods perform, we can estimate the methods on the training set (n = 10,206 beans) and display the results using the validation set (n = 1,702). Before beginning any dimensionality reduction, we can spend some time investigating our data. Since we know that many of these shape features are probably measuring similar concepts, let’s take a look at the correlation structure of the data in Figure 16.2 using this code. library(corrplot) tmwr_cols <- colorRampPalette(c("#91CBD765", "#CA225E")) bean_train %>% select(-class) %>% cor() %>% corrplot(col = tmwr_cols(200), tl.col = "black", method = "ellipse") Figure 16.2: Correlation matrix of the predictors with variables ordered via clustering Many of these predictors are highly correlated, such as area and perimeter or shape factors 2 and 3. While we don’t take the time to do it here, it is also important to see if this correlation structure significantly changes across the outcome categories. This can help create better models. 16.3 A Starter Recipe It’s time to look at the beans data in a smaller space. We can start with a basic recipe to preprocess the data prior to any dimensionality reduction steps. Several predictors are ratios and so are likely to have skewed distributions. Such distributions can wreak havoc on variance calculations (such as the ones used in PCA). The bestNormalize package has a step that can enforce a symmetric distribution for the predictors. We’ll use this to mitigate the issue of skewed distributions: library(bestNormalize) bean_rec <- # Use the training data from the bean_val split object recipe(class ~ ., data = bean_train) %>% step_zv(all_numeric_predictors()) %>% step_orderNorm(all_numeric_predictors()) %>% step_normalize(all_numeric_predictors()) Remember that when invoking the recipe() function, the steps are not estimated or executed in any way. This recipe will be extended with additional steps for the dimensionality reduction analyses. Before doing so, let’s go over how a recipe can be used outside of a workflow. 16.4 Recipes in the Wild As mentioned in Section 8.2, a workflow containing a recipe uses fit() to estimate the recipe and model, then predict() to process the data and make model predictions. There are analogous functions in the recipes package that can be used for the same purpose: prep(recipe, training) fits the recipe to the training set. bake(recipe, new_data) applies the recipe operations to new_data. Figure 16.3 summarizes this. Let’s look at each of these functions in more detail. Figure 16.3: Summary of recipe-related functions 16.4.1 Preparing a recipe Let’s estimate bean_rec using the training set data, with prep(bean_rec): bean_rec_trained <- prep(bean_rec) bean_rec_trained #> #> ── Recipe ─────────────────────────────────────────────────────────────────────────── #> #> ── Inputs #> Number of variables by role #> outcome: 1 #> predictor: 16 #> #> ── Training information #> Training data contained 10206 data points and no incomplete rows. #> #> ── Operations #> • Zero variance filter removed: <none> | Trained #> • orderNorm transformation on: area, perimeter, major_axis_length, ... | Trained #> • Centering and scaling for: area, perimeter, major_axis_length, ... | Trained Remember that prep() for a recipe is like fit() for a model. Note in the output that the steps have been trained and that the selectors are no longer general (i.e., all_numeric_predictors()); they now show the actual columns that were selected. Also, prep(bean_rec) does not require the training argument. You can pass any data into that argument, but omitting it means that the original data from the call to recipe() will be used. In our case, this was the training set data. One important argument to prep() is retain. When retain = TRUE (the default), the estimated version of the training set is kept within the recipe. This data set has been pre-processed using all of the steps listed in the recipe. Since prep() has to execute the recipe as it proceeds, it may be advantageous to keep this version of the training set so that, if that data set is to be used later, redundant calculations can be avoided. However, if the training set is big, it may be problematic to keep such a large amount of data in memory. Use retain = FALSE to avoid this. Once new steps are added to this estimated recipe, reapplying prep() will estimate only the untrained steps. This will come in handy when we try different feature extraction methods. If you encounter errors when working with a recipe, prep() can be used with its verbose option to troubleshoot: bean_rec_trained %>% step_dummy(cornbread) %>% # <- not a real predictor prep(verbose = TRUE) #> oper 1 step zv [pre-trained] #> oper 2 step orderNorm [pre-trained] #> oper 3 step normalize [pre-trained] #> oper 4 step dummy [training] #> Error in `step_dummy()`: #> Caused by error in `prep()`: #> ! Can't subset columns that don't exist. #> ✖ Column `cornbread` doesn't exist. Another option that can help you understand what happens in the analysis is log_changes: show_variables <- bean_rec %>% prep(log_changes = TRUE) #> step_zv (zv_RLYwH): same number of columns #> #> step_orderNorm (orderNorm_Jx8oD): same number of columns #> #> step_normalize (normalize_GU75D): same number of columns 16.4.2 Baking the recipe Using bake() with a recipe is much like using predict() with a model; the operations estimated from the training set are applied to any data, like testing data or new data at prediction time. For example, the validation set samples can be processed: bean_val_processed <- bake(bean_rec_trained, new_data = bean_validation) Figure 16.4 shows histograms of the area predictor before and after the recipe was prepared. library(patchwork) p1 <- bean_validation %>% ggplot(aes(x = area)) + geom_histogram(bins = 30, color = "white", fill = "blue", alpha = 1/3) + ggtitle("Original validation set data") p2 <- bean_val_processed %>% ggplot(aes(x = area)) + geom_histogram(bins = 30, color = "white", fill = "red", alpha = 1/3) + ggtitle("Processed validation set data") p1 + p2 Figure 16.4: The area predictor before and after preprocessing Two important aspects of bake() are worth noting here. First, as previously mentioned, using prep(recipe, retain = TRUE) keeps the existing processed version of the training set in the recipe. This enables the user to use bake(recipe, new_data = NULL), which returns that data set without further computations. For example: bake(bean_rec_trained, new_data = NULL) %>% nrow() #> [1] 10206 bean_train %>% nrow() #> [1] 10206 If the training set is not pathologically large, using this value of retain can save a lot of computational time. Second, additional selectors can be used in the call to specify which columns to return. The default selector is everything(), but more specific directives can be used. We will use prep() and bake() in the next s'''
author = "Max Kuhn and Julia Silge"
