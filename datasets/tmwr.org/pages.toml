full_description = '''3 A Review of R Modeling Fundamentals Before describing how to use tidymodels for applying tidy data principles to building models with R, let’s review how models are created, trained, and used in the core R language (often called “base R”). This chapter is a brief illustration of core language conventions that are important to be aware of even if you never use base R for models at all. This chapter is not exhaustive, but it provides readers (especially those new to R) the basic, most commonly used motifs. The S language, on which R is based, has had a rich data analysis environment since the publication of Chambers and Hastie (1992) (commonly known as The White Book). This version of S introduced standard infrastructure components familiar to R users today, such as symbolic model formulae, model matrices, and data frames, as well as standard object-oriented programming methods for data analysis. These user interfaces have not substantively changed since then. 3.1 An Example To demonstrate some fundamentals for modeling in base R, let’s use experimental data from McDonald (2009), by way of Mangiafico (2015), on the relationship between the ambient temperature and the rate of cricket chirps per minute. Data were collected for two species: O. exclamationis and O. niveus. The data are contained in a data frame called crickets with a total of 31 data points. These data are shown in Figure 3.1 using the following ggplot2 code. library(tidyverse) data(crickets, package = "modeldata") names(crickets) # Plot the temperature on the x-axis, the chirp rate on the y-axis. The plot # elements will be colored differently for each species: ggplot(crickets, aes(x = temp, y = rate, color = species, pch = species, lty = species)) + # Plot points for each data point and color by species geom_point(size = 2) + # Show a simple linear model fit created separately for each species: geom_smooth(method = lm, se = FALSE, alpha = 0.5) + scale_color_brewer(palette = "Paired") + labs(x = "Temperature (C)", y = "Chirp Rate (per minute)") #> [1] "species" "temp" "rate" Figure 3.1: Relationship between chirp rate and temperature for two different species of crickets The data exhibit fairly linear trends for each species. For a given temperature, O. exclamationis appears to chirp more per minute than the other species. For an inferential model, the researchers might have specified the following null hypotheses prior to seeing the data: Temperature has no effect on the chirp rate. There are no differences between the species’ chirp rate. There may be some scientific or practical value in predicting the chirp rate but in this example we will focus on inference. To fit an ordinary linear model in R, the lm() function is commonly used. The important arguments to this function are a model formula and a data frame that contains the data. The formula is symbolic. For example, the simple formula: rate ~ temp specifies that the chirp rate is the outcome (since it is on the left-hand side of the tilde ~) and that the temperature value is the predictor.8 Suppose the data contained the time of day in which the measurements were obtained in a column called time. The formula: rate ~ temp + time would not add the time and temperature values together. This formula would symbolically represent that temperature and time should be added as separate main effects to the model. A main effect is a model term that contains a single predictor variable. There are no time measurements in these data but the species can be added to the model in the same way: rate ~ temp + species Species is not a quantitative variable; in the data frame, it is represented as a factor column with levels "O. exclamationis" and "O. niveus". The vast majority of model functions cannot operate on nonnumeric data. For species, the model needs to encode the species data in a numeric format. The most common approach is to use indicator variables (also known as dummy variables) in place of the original qualitative values. In this instance, since species has two possible values, the model formula will automatically encode this column as numeric by adding a new column that has a value of zero when the species is "O. exclamationis" and a value of one when the data correspond to "O. niveus". The underlying formula machinery automatically converts these values for the data set used to create the model, as well as for any new data points (for example, when the model is used for prediction). Suppose there were five species instead of two. The model formula, in this case, would create four binary columns that are binary indicators for four of the species. The reference level of the factor (i.e., the first level) is always left out of the predictor set. The idea is that, if you know the values of the four indicator variables, the value of the species can be determined. We discuss binary indicator variables in more detail in Section 8.4.1. The model formula rate ~ temp + species creates a model with different y-intercepts for each species; the slopes of the regression lines could be different for each species as well. To accommodate this structure, an interaction term can be added to the model. This can be specified in a few different ways, and the most basic uses the colon: rate ~ temp + species + temp:species # A shortcut can be used to expand all interactions containing # interactions with two variables: rate ~ (temp + species)^2 # Another shortcut to expand factors to include all possible # interactions (equivalent for this example): rate ~ temp * species In addition to the convenience of automatically creating indicator variables, the formula offers a few other niceties: In-line functions can be used in the formula. For example, to use the natural log of the temperature, we can create the formula rate ~ log(temp). Since the formula is symbolic by default, literal math can also be applied to the predictors using the identity function I(). To use Fahrenheit units, the formula could be rate ~ I( (temp * 9/5) + 32 ) to convert from Celsius. R has many functions that are useful inside of formulas. For example, poly(x, 3) adds linear, quadratic, and cubic terms for x to the model as main effects. The splines package also has several functions to create nonlinear spline terms in the formula. For data sets where there are many predictors, the period shortcut is available. The period represents main effects for all of the columns that are not on the left-hand side of the tilde. Using ~ (.)^3 would add main effects as well as all two- and three-variable interactions to the model. Returning to our chirping crickets, let’s use a two-way interaction model. In this book, we use the suffix _fit for R objects that are fitted models. interaction_fit <- lm(rate ~ (temp + species)^2, data = crickets) # To print a short summary of the model: interaction_fit #> #> Call: #> lm(formula = rate ~ (temp + species)^2, data = crickets) #> #> Coefficients: #> (Intercept) temp speciesO. niveus #> -11.041 3.751 -4.348 #> temp:speciesO. niveus #> -0.234 This output is a little hard to read. For the species indicator variables, R mashes the variable name (species) together with the factor level (O. niveus) with no delimiter. Before going into any inferential results for this model, the fit should be assessed using diagnostic plots. We can use the plot() method for lm objects. This method produces a set of four plots for the object, each showing different aspects of the fit, as shown in Figure 3.2. # Place two plots next to one another: par(mfrow = c(1, 2)) # Show residuals vs predicted values: plot(interaction_fit, which = 1) # A normal quantile plot on the residuals: plot(interaction_fit, which = 2) Figure 3.2: Residual diagnostic plots for the linear model with interactions, which appear reasonable enough to conduct inferential analysis When it comes to the technical details of evaluating expressions, R is lazy (as opposed to eager). This means that model fitting functions typically compute the minimum possible quantities at the last possible moment. For example, if you are interested in the coefficient table for each model term, this is not automatically computed with the model but is instead computed via the summary() method. Our next order of business with the crickets is to assess if the inclusion of the interaction term is necessary. The most appropriate approach for this model is to recompute the model without the interaction term and use the anova() method. # Fit a reduced model: main_effect_fit <- lm(rate ~ temp + species, data = crickets) # Compare the two: anova(main_effect_fit, interaction_fit) #> Analysis of Variance Table #> #> Model 1: rate ~ temp + species #> Model 2: rate ~ (temp + species)^2 #> Res.Df RSS Df Sum of Sq F Pr(>F) #> 1 28 89.3 #> 2 27 85.1 1 4.28 1.36 0.25 This statistical test generates a p-value of 0.25. This implies that there is a lack of evidence against the null hypothesis that the interaction term is not needed by the model. For this reason, we will conduct further analysis on the model without the interaction. Residual plots should be reassessed to make sure that our theoretical assumptions are valid enough to trust the p-values produced by the model (plots not shown here but spoiler alert: they are). We can use the summary() method to inspect the coefficients, standard errors, and p-values of each model term: summary(main_effect_fit) #> #> Call: #> lm(formula = rate ~ temp + species, data = crickets) #> #> Residuals: #> Min 1Q Median 3Q Max #> -3.013 -1.130 -0.391 0.965 3.780 #> #> Coefficients: #> Estimate Std. Error t value Pr(>|t|) #> (Intercept) -7.2109 2.5509 -2.83 0.0086 ** #> temp 3.6028 0.0973 37.03 < 2e-16 *** #> speciesO. niveus -10.0653 0.7353 -13.69 6.3e-14 *** #> --- #> Signif. codes: 0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1 #> #> Residual standard error: 1.79 on 28 degrees of freedom #> Multiple R-squared: 0.99, Adjusted R-squared: 0.989 #> F-statistic: 1.33e+03 on 2 and 28 DF, p-value: <2e-16 The chirp rate for each species increases by 3.6 chirps as the temperature increases by a single degree. This term shows strong statistical significance as evidenced by the p-value. The species term has a value of -10.07. This indicates that, across all temperature values, O. niveus has a chirp rate that is about 10 fewer chirps per minute than O. exclamationis. Similar to the temperature term, the species effect is associated with a very small p-value. The only issue in this analysis is the intercept value. It indicates that at 0° C, there are negative chirps per minute for both species. While this doesn’t make sense, the data only go as low as 17.2° C and interpreting the model at 0° C would be an extrapolation. This would be a bad idea. That being said, the model fit is good within the applicable range of the temperature values; the conclusions should be limited to the observed temperature range. If we needed to estimate the chirp rate at a temperature that was not observed in the experiment, we could use the predict() method. It takes the model object and a data frame of new values for prediction. For example, the model estimates the chirp rate for O. exclamationis for temperatures between 15° C and 20° C can be computed via: new_values <- data.frame(species = "O. exclamationis", temp = 15:20) predict(main_effect_fit, new_values) #> 1 2 3 4 5 6 #> 46.83 50.43 54.04 57.64 61.24 64.84 Note that the non-numeric value of species is passed to the predict method, as opposed to the numeric, binary indicator variable. While this analysis has obviously not been an exhaustive demonstration of R’s modeling capabilities, it does highlight some major features important for the rest of this book: The language has an expressive syntax for specifying model terms for both simple and quite complex models. The R formula method has many conveniences for modeling that are also applied to new data when predictions are generated. There are numerous helper functions (e.g., anova(), summary() and predict()) that you can use to conduct specific calculations after the fitted model is created. Finally, as previously mentioned, this framework was first published in 1992. Most of these ideas and methods were developed in that period but have remained remarkably relevant to this day. It highlights that the S language and, by extension R, has been designed for data analysis since its inception. 3.2 What Does the R Formula Do? The R model formula is used by many modeling packages. It usually serves multiple purposes: The formula defines the columns that the model uses. The standard R machinery uses the formula to encode the columns into an appropriate format. The roles of the columns are defined by the formula. For the most part, practitioners’ understanding of what the formula does is dominated by the last purpose. Our focus when typing out a formula is often to declare how the columns should be used. For example, the previous specification we discussed sets up predictors to be used in a specific way: (temp + species)^2 Our focus, when seeing this, is that there are two predictors and the model should contain their main effects and the two-way interactions. However, this formula also implies that, since species is a factor, it should also create indicator variable columns for this predictor (see Section 8.4.1) and multiply those columns by the temp column to create the interactions. This transformation represents our second bullet point on encoding; the formula also defines how each column is encoded and can create additional columns that are not in the original data. This is an important point that will come up multiple times in this text, especially when we discuss more complex feature engineering in Chapter 8 and beyond. The formula in R has some limitations, and our approaches to overcoming them contend with all three aspects. 3.3 Why Tidiness Is Important for Modeling One of the strengths of R is that it encourages developers to create a user interface that fits their needs. As an example, here are three common methods for creating a scatter plot of two numeric variables in a data frame called plot_data: plot(plot_data$x, plot_data$y) library(lattice) xyplot(y ~ x, data = plot_data) library(ggplot2) ggplot(plot_data, aes(x = x, y = y)) + geom_point() In these three cases, separate groups of developers devised three distinct interfaces for the same task. Each has advantages and disadvantages. In comparison, the Python Developer’s Guide espouses the notion that, when approaching a problem: “There should be one – and preferably only one – obvious way to do it.” R is quite different from Python in this respect. An advantage of R’s diversity of interfaces is that it can evolve over time and fit different needs for different users. Unfortunately, some of the syntactical diversity is due to a focus on the needs of the person developing the code instead of the needs of the person using the code. Inconsistencies amon'''
