title = "About TODAY - TODAY Show, TODAY Digital, Shop TODAY & Studio 1A History"
description = "Learn all about TODAY. Read about TODAY show anchors and hosts, our team at TODAY digital and Shop TODAY, and how to visit the Plaza at 30 Rockefeller Center."
full_description = '''TODAYEverything to know about TODAYFrom our morning show on NBC to where to find us online, we've got you covered.Nathan Congleton / TODAY / Updated As America's first-ever morning show, TODAY is your trusted destination to stay informed and get inspired. Whether it's on your TV or your phone, your day starts here, with the latest in news, wellness, parenting, pop-culture, and more — plus, all the tools you need to live a happier, healthier life. Read on for more information about TODAY on NBC, our anchors, our editorial content, and more.Meet the TODAY AnchorsSavannah Guthrie & Craig MelvinTODAYNBC’s TODAY is a news program that informs, entertains, inspires and sets the agenda each morning for Americans, starting at 7 a.m. Want to know more about hosts Savannah Guthrie, Craig Melvin, Al Roker, Carson Daly, Jenna Bush Hager, Dylan Dreyer, Sheinelle Jones, Willie Geist, Peter Alexander and Laura Jarrett. Read our anchors' bios here.About TODAY DigitalNathan Congleton / TODAYEvery day on TODAY.com and across our social media platforms, our team of experts, writers, reporters, editors, photo editors and producers work to expand the TODAY show’s mission to help you stay informed and get inspired, 24/7. From the latest news to health and wellness, parenting and lifestyle stories, TODAY.com is your trusted authority on living a happier, healthier life. You can meet our digital team here! And to keep up with the latest, follow us on Instagram, X, TikTok, and Facebook.About Shop TODAYNathan Congleton / TODAYThe Shop TODAY editors and writers are shopping enthusiasts who seek out what’s new and best in style, beauty, home and tech. They scour the internet and comb through customer reviews to find the best products out there, with a focus on affordability and finds that will make your life rewarding, easier and more fun. Whether you’re looking for expert-approved recommendations, online deals, sales or gift guides for everyone in your life, you’ll find it here.How to Visit the TODAY Plaza in New York CityColombian superstar Karol G broke TODAY's concert attendance record at Rockefeller Plaza on July 10, 2023.Tyler Essary / TODAYNo trip to New York is complete without a visit to the TODAY plaza. Whether you’re stopping by to see your favorite anchor or catching a summer concert, it’s a good idea to plan ahead.To register for your visit, click here.The History of TODAYNBCNBC pioneered morning television more than 72 years ago when the network debuted its new show, TODAY, in 1952.Since then, the live broadcast program has become a cornerstone of American television, drawing millions of viewers each day who tune in for breaking news, celebrity interviews, live concerts, sports, business, lifestyle and all the latest happenings in pop culture.Consider yourself a TODAY superfan? Brush up on some little-known facts about Studio 1A, the TODAY Plaza and Rockefeller Center below:Millions of viewers tune into TODAY every morning.In 1952, TODAY's expansive studio windows were given the nickname “Window on the World.”Notable journalist Barbara Walters became the first woman to co-host TODAY in 1974.The first band to perform at the first-ever TODAY summer concert series was Earth, Wind & Fire on June 16, 1995.For even more fun facts, test your knowledge with these 55 TODAY Plaza trivia questions and answers.30 Years of Studio 1A and the TODAY PlazaCrowds gather outside to watch a live taping of the "TODAY" on Nov. 18, 1955.NBCLight the candles — this year marks the 30th anniversary of Studio 1A and the TODAY Plaza! The brainchild of NBC president Pat Weaver, TODAY was conceived back in the early 1950s as a two-hour morning TV show that would be both entertaining and informative.Though he'd settled on the snappy name, “Rise and Shine,” Weaver's wife convinced him to change it to “TODAY.” And the rest, as they say, is history.On June 20, 1994, Studio 1A opened to the world and has since produced three decades of unforgettable moments including dazzling Halloween costume reveals, live concerts performed by some of music’s biggest luminaries like Beyonce, Taylor Swift, Celine Dion and Prince, along with milestones like the Plaza’s transformation into a vaccine clinic at the height of the pandemic, as well as an impromptu concert venue for disaster relief in the wake of Hurricane Katrina.For a full visual timeline of Studio 1A and the TODAY Plaza, take a look back at the plaza's biggest and best moments here.TODAY GuestbookNathan Congleton / TODAYIf you'd like to share your TODAY story and photos from your previous trip to the plaza, we want to hear from you. Share your TODAY story here.For editorial questions or comments, email: newsroom@nbcuni.com.RelatedPatrick Randak / NBCJenna Bush Hager, host of TODAY with Jenna & FriendsTODAY / Updated Hoda Kotb, former co-anchor of TODAY and former co-host of TODAY with Hoda & JennaTODAY / Updated Patrick Randak / NBCCraig Melvin, co-anchor for TODAY, co-host of 3rd hour of TODAYTODAY / Updated TODAY Illustration / Getty ImagesMasthead: Meet the TODAY Digital TeamTODAY / Updated Everything to know about Craig Melvin’s 2 kids, Delano and Sybil Dads / Updated Julien M. Hekimian / Getty ImagesWho are Savannah Guthrie's kids? All about Vale and CharleyMoms / Updated TODAY Illustration / Getty ImagesAl Roker reveals his dream dinner party guest listPeople / Updated TODAYMeet the TODAY AnchorsTODAY / Updated Nathan Congleton / TODAY55 TODAY trivia questions and answersInspiration / Updated CPSC / TODAY IllustrationNearly 5M blenders sold at Costco, Target and Walmart recalled over fire and laceration risks Recall / Updated See More'''
