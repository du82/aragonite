title = "USC men’s basketball zero waste ‘green game’ a sustainability win"
description = "The annual USC “green game” puts a spotlight on USC’s efforts to reduce waste through reuse, recycling and composting."
full_description = "USC Chief Sustainability Officer Mick Dalrymple pitches in during Tuesday’s “green game.” (USC Photo/Evan Morris) Share University USC men’s basketball zero waste ‘green game’ a sustainability win The annual event puts a spotlight on USC’s efforts to reduce waste through reuse, recycling and composting. January 16, 2025 By Stephen Gee The Trojan spirit was on display Tuesday when the USC men’s basketball team beat the Iowa Hawkeyes 99-89 at the Galen Center, and so too was the university’s commitment to sustainability. Learn more about USC’s Assignment: Earth initiative. The fixture was the team’s annual zero waste “green game,” an opportunity to amplify USC’s work to reduce waste through reuse, recycling and composting. Fans who attended the game saw numerous specialty trash bins and signage added to help them better dispose of their waste as well as the various sustainable materials used in concession stands. “The Galen Center is committed to the highest standards of waste management,” said Paul Neidermire, Galen Center general manager and associate athletic director of operations. “The zero waste ‘green games’ are an opportunity to celebrate our sustainability efforts and remind fans to do their part.” In total, 345 pounds of waste from the game was recycled and more than 383 pounds of waste was composted. About 414 pounds ended up in landfill, a diversion rate of more than 63%. University Brilliance and legacy celebrated at USC Black History Month ‘Family Reunion’ Feb 26, 2025"
