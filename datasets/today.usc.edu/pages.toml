["https://today.usc.edu/campus-access-for-media"]
title = "Campus Access for Media - USC Today"
description = "USC has opened all of its gates to ensure easy access to the campus. Journalists are welcome, and to ensure you get on campus to do your story before your deadline, here is a rundown of our guidelines (we call them the “4Cs”):"
full_description = "Campus Access for Media USC has opened all of its gates to ensure easy access to the campus. Journalists are welcome, and to ensure you get on campus to do your story before your deadline, here is a rundown of our guidelines (we call them the “4Cs”): The four Cs: Call ahead: Call or email USC Media Relations to register for your visit: uscnews@usc.edu or (213) 740-2215. When possible, please give us a reasonable amount of lead time so we can get you registered before you arrive at campus. Credentials: Bring your media credentials/ID. Place them on your dashboard to park at a USC parking structure for free. Code: Our guests need a visitor QR code to enter. You’ll get that from USC Media Relations. Carry an ID: A driver’s license, passport or other government-issued ID will be needed in addition to your QR code to ensure entry. If you’re planning to do an interview inside one of our buildings at the University Park Campus, one of our USC communications team members will be there to accompany you. This helps ensure that you have easy access to the specific building and room you need and you can complete your interview without interruption. We’ve had this practice in place for years to prioritize safety, security and privacy. Some buildings house clinical care for patients (including students), while others have secure research facilities and classrooms. We also want to minimize any disruptions to classes and research out of respect for the privacy of our students and the important work our faculty and staff are doing. Parking instructions Show your visitor QR code at the campus gate, whether you are driving or walking into campus. Regular-sized vehicles: If you are driving a regular-sized vehicle, you may park for free in any parking structure on campus (see parking map) as long as you place a media placard or other credential identifying your outlet on your dashboard. Full-sized TV trucks: You can, once you have checked into the gate with your registered QR code, drive onto campus and park anywhere there is a yellow line. See the maps below. Please note that if you are driving to campus, you can enter at any access point. The one exception Monday through Friday during regular business hours is the McClintock Entrance, which is limited to drivers who are affiliated with USC or who are approved vendors. Pedestrians, however, can enter the campus through any of the gates. The last step: After parking, you may need to stop at the gate nearest the parking structure to show your QR code and ID to get into campus. You may be asked to speak with campus welcome services staff at the welcome services tents, too, before entering. Then, you may meet with USC communications staff who have been assisting you with your story. Important links (Please note one exception: the McClintock Entrance is limited to vendors and USC ID holders only on weekdays.) Campus map with vehicle and pedestrian access Visitor registration page USC Pressroom How to access campus"
