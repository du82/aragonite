["https://today.usc.edu/pressroom/election-2024"]
title = "Election 2024 - USC Today"
description = "As campaigns gain momentum and voters prepare to head to the polls on November 5, USC experts are available to assist reporters covering elections this year with data-driven insights and fresh perspectives on the critical issues unfolding along the campaign trail."
full_description = "Election 2024 As campaigns gain momentum and voters prepare to head to the polls on November 5, USC experts are available to assist reporters covering elections this year with data-driven insights and fresh perspectives on the critical issues unfolding along the campaign trail. Expertise by Topic Politics | DEI | Public Policy | National Security | Economy | Law | Health Affairs | Government | Immigration | Media | Foreign Policy | Polls | Voters To connect with a USC expert, please email USC Media Relations at uscnews@usc.edu or call (213) 740-2215. Source Alerts USC’s Election Coverage Browse our source alerts for trends and topics shaping the upcoming election. Election night watch party; USC experts available Reporters are invited to join USC’s 2024 Presidential Election Night Watch Party for live analysis and expert insights. USC experts will also be available for interviews throughout election week. As California goes, so goes the nation: 6 ways California shapes America’s future As Election Day approaches and all eyes turn to California’s competitive congressional races – likely to sway the balance of power in the U.S. House – USC experts discuss the Golden State’s influence that extends far beyond the ballot box. Walz vs. Vance debate: USC experts available for comment Minnesota Democratic Gov. Tim Walz and Ohio GOP Sen. J.D. Vance will face off in their first scheduled debate on Tuesday, Oct. 1. Harris vs. Trump debate: USC experts available for comment Vice President Kamala Harris and former President Donald Trump will face off in their first and only scheduled debate on Sept. 10. USC experts are available for pre- and post-debate comment and analysis. Election 2024: Inside California’s ballot propositions When Californians head to the polls in November, they’ll vote on 10 statewide ballot measures tackling critical policy issues like affordable housing, climate resilience and modernizing the state’s public schools. USC experts weigh in. 2024 Democratic National Convention: USC experts available Democratic Party delegates will convene in Chicago, Illinois, from Monday, August 19 to Thursday, August 22, for the Democratic National Convention. USC experts are available for comment. 2024 Republican National Convention: USC experts available The Republican National Convention will take place in Milwaukee, Wisconsin, from July 15-18, 2024. USC experts are available to provide commentary on various aspects of the convention. A stage for persuasion: Political theater in the 2024 presidential debate As President Biden and former President Trump gear up for their first debate of the 2024 election season, USC experts explore the enduring connections between politics and theater. Biden vs. Trump: USC experts available to discuss first major presidential debate President Joe Biden and former President Donald Trump face off in the first presidential debate of the 2024 election season. Dobbs, 2 years later: Abortion and the 2024 election USC experts discuss how the 2022 rollback of Roe v. Wade has changed reproductive rights and access across the country, and how these critical issues might shape voter behavior and decisions in the 2024 election. Immigration: USC experts available to discuss America’s most polarizing topic Immigration remains a focal point in the race for the White House, igniting heated discussions among candidates on the campaign trail, the debate stage and across social media. USC experts are available for comment and in-depth analysis on this pressing issue shaping the 2024 election. Experts available to speak on grand jury’s indictment against Trump USC experts are available to discuss the grand jury’s four-count indictment against former President Donald Trump in connection with the Jan. 6, 2021 attack on the U.S. Capitol. Trust in voting: How misinformation threatens democracy With misinformation on the rise and American voters increasingly losing faith in elections, USC experts explore strategies to restore confidence in democracy. Read on USC News Related Articles from USC Today USC’s Election Coverage Browse our recent coverage of trends and topics shaping the upcoming election, curated by our USC Today editors. Trust in voting: How misinformation threatens democracy With misinformation on the rise and American voters increasingly losing faith in elections, USC experts explore strategies to restore confidence in democracy. Confronting misinformation and building voter trust: Q&A with Mindy Romero Romero, an expert on voter behavior and political representation, offers insights into what it will take to restore trust in America’s electoral process and safeguard inclusive democracy. Why truth is no match for misinformation: Q&A with Kristina Lerman Lerman, an expert on how people communicate in digital spaces, explains how misinformation thrives on emotional triggers — and why traditional fact-checking often misses the mark. How underrepresented voters could influence the 2024 election Groups with historically low voter turnout could play a deciding role this election. Their shifting party alliances may also be reshaping politics broadly, USC experts say. Poll: Katie Porter the early frontrunner for California governor New poll of California likely voters also shows Kamala Harris outperforming Joe Biden against Donald Trump in the U.S. presidential race. California House poll: Democrats hold slim leads in state’s closest races Republican incumbents in four key U.S. House races are in tight bids for reelection, according to a series of polls from USC, CSULB and Cal Poly Pomona. In tonight’s presidential debate, what question would you ask the candidates? USC scholars are thinking about issues that they feel matter to Americans but that might be getting less attention than others. New USC research reveals untapped potential for mobilizing voters of color in battleground states New research by the Center for Inclusive Democracy at USC finds persistent low turnout for Latino, Asian-American and Black voters in all nine swing states. Boosting groups’ participation could be a gamechanger for the November election. The changing role of courts in U.S. politics: Q&A with Jeb Barnes Barnes, an expert in law, politics and public policy, explains how recent Supreme Court decisions and a shift in judicial tactics are reshaping U.S. politics. Election 2024: Inside California’s ballot propositions This November, Californians will vote on 10 statewide ballot measures, including two $10 billion bond proposals. USC experts weigh in. 2024 California ballot measures: Q&A with John Matsusaka Matsusaka, a political economist and expert on direct democracy, discusses the key statewide ballot propositions voters will decide on in November. Paris 2024: Geopolitics and the Olympics USC experts in international relations and foreign policy discuss how the Olympics shape — and are shaped by — global politics. Political advertising in the 2024 election: Q&A with USC’s Steve Caplan The media expert offers insights on the habits of cord-cutting Americans, deepfake videos, and the expected increase in ads that could shape this historic election. Will Biden drop out of the presidential race? Political historian Jeffery Jenkins weighs in on Biden’s situation and how members of Congress could play a role. How to spot AI fake content — and what policymakers can do to help stop it The rise of AI has flooded the internet with election disinformation. Experts discuss how governments can regulate the emerging technology. A stage for persuasion: Political theater in the 2024 presidential debate As President Biden and former President Trump gear up for their first debate of the 2024 election season, USC experts explore the enduring connections between politics and theater. What to expect from tonight’s presidential debate: Q&A with USC’s Christian Grose During tonight’s first Biden-Trump debate of 2024, the spotlight will be on how each candidate leverages the elements of political theater to shape the narrative of their campaign. The Supreme Court’s ‘Dobbs’ ruling, 2 years later: It’s about more than just abortion The rollback of Roe v. Wade added fuel to a contentious nationwide debate that now extends well beyond the right to terminate a pregnancy. USC experts discuss Dobbs’ lasting impacts and potential influence in the November election. Can we still trust the polls? The 2024 election looms large, and with it, the question of how much we can trust preelection polls. USC pollsters break down the art and science of public opinion polling in the aftermath of Super Tuesday. Polls get a lot of hype, but what do they really tell us? A Q&A with polling pro Christian Grose Christian Grose, a seasoned USC pollster and political scientist, offers a deep dive into the world of public opinion polling. Q&A with Aya Gruber: The link between law and feminism An expert in criminal law and feminist legal theory, Gruber is a powerful voice for women’s rights in the courtroom and the classroom. Voters underutilizing free tool to track status of vote-by-mail ballots, USC report finds Fewer than one-third of voters used the free BallotTrax tracking tool in 2022, USC Price’s Center for Inclusive Democracy says. California voter poll: Schiff leads, while Porter and Garvey neck-and-neck for second in the U.S. Senate primary The survey by USC, CSULB and Cal Poly Pomona shows many likely voters remain undecided, and that Garvey’s history with the Dodgers isn’t boosting his chances. Two truths and a lie about immigration USC experts unpack the nuanced realities driving the United States’ immigration debate. How old is too old to be president? The candidates’ ages are a concern for many ahead of the 2024 elections, but significant life experience has its advantages, USC experts say. How Americans really feel about the teaching of controversial topics in schools Americans are united on core principles like the importance of public education and parental involvement, but diverge on the details, a new USC study suggests. The rollback of ‘Roe v. Wade’ — 1 year later The impact, still rippling outward, continues to roil politics and disrupt pregnancy care. Voters reject culture war tactics in school board elections Voters on Nov. 7 turned away from candidates with extreme views in key races, signaling a potential shift in priorities as 2024 looms. Supreme Court to decide scope of federal agency power The court has signaled that it is ready to reject a precedent known as “Chevron deference.” USC experts say that could reshape how environmental, health and consumer protection policies are made and enforced, and even threaten health and safety. SCOTUS Preview: Key cases to watch and USC experts to connect with this term USC experts are available to discuss key issues on the Supreme Court’s docket. As election nears, USC-led cybersecurity initiative pivots to voter education and access The Google-funded USC Election Cybersecurity Initiative has held workshops for officials around the country, bracing them for cyberthreats. Now, they are channeling their efforts into helping voters. Barriers to voting have huge impact on turnout, but Americans overlook their effect Practical difficulties such as child care requirements and limited polling place hours can curb voter turnout, but USC researchers find most Americans think voting is a matter of belief. How Did American Politics Lose Its Civility? Q&A: Why USC hosts two voting centers Registered voters can drop off their completed ballots at voting centers on the University Park and Health Sciences campuses. Why does USC have these centers? The executive director of USC Dornsife’s Center for the Political Future explains. Featured Expert Christian Grose is a professor of political science and international relations and public policy at the USC Dornsife College of Letters, Arts and Sciences and the USC Price School of Public Policy. He is also the academic director of the USC Schwarzenegger Institute for State and Global Policy at USC Price. Grose is an expert on American politics, legislative politics, public administration, public policy, race and ethnicity, voting rights and political representation. “California Democratic House candidates have the wind at their back, but the real question is whether Democratic voter excitement will knock up against a red wall of California Republican incumbents. As goes California’s congressional districts, so goes control of the U.S. Congress.” Expert Profile Related Events Looking for experts for a different topic? Visit USC Pressroom"
