full_description = "Health $10.8 million award funds USC-led clinical trial to improve hip fracture outcomes An international team of researchers will study what type of surgery best serves patients with a common type of hip fracture. Feb 7, 2025 Health Why some heavy drinkers develop advanced liver disease, while others do not The answer may lie in three common underlying medical conditions, according to a new study from Keck Medicine of USC. Feb 6, 2025 University Research teams awarded NEMO Prizes for work at the intersection of health, engineering Funded by a gift from Shelly and Ofer Nemirovsky, the latest prizes address a rare childhood heart disease and a widespread cause of blindness. Feb 4, 2025 Health New partnership offers dental care to families experiencing homelessness When housing is a challenge, dental care can often be neglected. USC’s new partnership with URM Angeles House is helping affected families, including those with young children. Feb 4, 2025 Health Obesity and diabetes drugs can catalyze profound changes in your body — and in public health, too Feb 3, 2025 Health Parenting through disaster: How California’s wildfires are affecting children and families As families cope with the loss of homes, schools and communities, USC experts offer guidance to help parents and children make sense of tragedy, protect their health and find hope. Jan 24, 2025 Health Study links contamination of drinking water with ‘forever chemicals’ to a range of rare cancers USC researchers found an association between levels of PFAS in drinking water and the incidence of certain digestive, endocrine, respiratory, and mouth and throat cancers. Jan 21, 2025 Health Exposure to air pollution before pregnancy linked to higher child body mass index Greater air pollution exposure in the three months before conception was associated with higher childhood obesity risk up to two years after birth, research co-led by the Keck School of Medicine of USC found. Jan 17, 2025 Health Th