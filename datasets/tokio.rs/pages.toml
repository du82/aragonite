["http://tokio.rs/blog/2021-05-14-inventing-the-service-trait"]
title = "Inventing the Service trait | Tokio - An asynchronous Rust runtime"
description = "Tokio is a runtime for writing reliable asynchronous applications with Rust. It provides async I/O, networking, scheduling, timers, and more."
full_description = '''LearnAPI DocsBlogTABLE OF CONTENTS2025January 1Announcing axum 0.8.02024October 23Announcing Toasty, an async ORM for Rust2023November 27Announcing axum 0.7.0January 3Announcing turmoil2022November 25Announcing axum 0.6.0October 27Announcing async-backtraceMore Blog PostsInventing the Service traitMay 17, 2021Tower is a library of modular and reusable components for building robust networking clients and servers. At its core is the Service trait. A Service is an asynchronous function that takes a request and produces a response. However, some aspects of its design may not be immediately obvious. Rather than explaining the Service trait as it exists in Tower today, let's look at the motivation behind Service by imagining how you might invent it if you started from scratch. Imagine you are building a little HTTP framework in Rust. The framework would allow users to implement an HTTP server by supplying code that receives requests and replies with some response. You might have an API like this: // Create a server that listens on port 3000 let server = Server::new("127.0.0.1:3000").await?; // Somehow run the user's application server.run(the_users_application).await?; The question is, what should the_users_application be? The simplest thing that just might work is: fn handle_request(request: HttpRequest) -> HttpResponse { // ... } Where HttpRequest and HttpResponse are some structs provided by our framework. With this, we can implement Server::run like so: impl Server { async fn run<F>(self, handler: F) -> Result<(), Error> where F: Fn(HttpRequest) -> HttpResponse, { let listener = TcpListener::bind(self.addr).await?; loop { let mut connection = listener.accept().await?; let request = read_http_request(&mut connection).await?; task::spawn(async move { // Call the handler provided by the user let response = handler(request); write_http_response(connection, response).await?; }); } } } Here, we have an asynchronous function run which takes a closure that accepts an HttpRequest and returns an HttpResponse. That means users can use our Server like so: fn handle_request(request: HttpRequest) -> HttpResponse { if request.path() == "/" { HttpResponse::ok("Hello, World!") } else { HttpResponse::not_found() } } // Run the server and handle requests using our `handle_request` function server.run(handle_request).await?; This is not bad. It makes it easy for users to run HTTP servers without worrying about any of the low level details. However, our current design has one issue: we cannot handle requests asynchronously. Imagine our user needs to query a database or send a request to some other server while handling the request. Currently, that would require blocking while we wait for the handler to produce a response. If we want our server to be able to handle a large number of concurrent connections, we need to be able to serve other requests while we wait for that request to complete asynchronously. Let's fix this by having the handler function return a future: impl Server { async fn run<F, Fut>(self, handler: F) -> Result<(), Error> where // `handler` now returns a generic type `Fut`... F: Fn(HttpRequest) -> Fut, // ...which is a `Future` whose `Output` is an `HttpResponse` Fut: Future<Output = HttpResponse>, { let listener = TcpListener::bind(self.addr).await?; loop { let mut connection = listener.accept().await?; let request = read_http_request(&mut connection).await?; task::spawn(async move { // Await the future returned by `handler` let response = handler(request).await; write_http_response(connection, response).await?; }); } } } Using this API is very similar to before: // Now an async function async fn handle_request(request: HttpRequest) -> HttpResponse { if request.path() == "/" { HttpResponse::ok("Hello, World!") } else if request.path() == "/important-data" { // We can now do async stuff in here let some_data = fetch_data_from_database().await; make_response(some_data) } else { HttpResponse::not_found() } } // Running the server is the same server.run(handle_request).await?; This is much nicer, since our request handling can now call other async functions. However, there is still something missing. What if our handler encounters an error and cannot produce a response? Let's make it return a Result: impl Server { async fn run<F, Fut>(self, handler: F) -> Result<(), Error> where F: Fn(HttpRequest) -> Fut, // The response future is now allowed to fail Fut: Future<Output = Result<HttpResponse, Error>>, { let listener = TcpListener::bind(self.addr).await?; loop { let mut connection = listener.accept().await?; let request = read_http_request(&mut connection).await?; task::spawn(async move { // Pattern match on the result of the response future match handler(request).await { Ok(response) => write_http_response(connection, response).await?, Err(error) => handle_error_somehow(error, connection), } }); } } } Adding more behavior Now, suppose we want to ensure that all requests complete in a timely manner or fail, rather than keeping the client waiting indefinitely for a response that may never arrive. We can do this by adding a timeout to each request. A timeout sets a limit on the maximum duration the handler is allowed to take. If it doesn't produce a response within that amount of time, an error is returned. This allows the client to retry that request or report an error to the user, rather than waiting forever. Your first idea might be to modify Server so that it can be configured with a timeout. It would then apply that timeout every time it calls handler. However, it turns out you can actually add a timeout without modifying Server. Using tokio::time::timeout, we can make a new handler function that calls our previous handle_request, but with a timeout of 30 seconds: async fn handler_with_timeout(request: HttpRequest) -> Result<HttpResponse, Error> { let result = tokio::time::timeout( Duration::from_secs(30), handle_request(request) ).await; match result { Ok(Ok(response)) => Ok(response), Ok(Err(error)) => Err(error), Err(_timeout_elapsed) => Err(Error::timeout()), } } This provides a quite nice separation of concerns. We were able to add a timeout without changing any of our existing code. Let's add one more feature in this way. Imagine we're building a JSON API and would therefore like a Content-Type: application/json header on all responses. We can wrap handler_with_timeout in a similar way, and modify the response like so: async fn handler_with_timeout_and_content_type( request: HttpRequest, ) -> Result<HttpResponse, Error> { let mut response = handler_with_timeout(request).await?; response.set_header("Content-Type", "application/json"); Ok(response) } We now have a handler that will process an HTTP request, take no longer than 30 seconds, and always have the right Content-Type header, all without modifying our original handle_request function or Server struct. Designing libraries that can be extended in this way is very powerful, since it allows users to extend the library's functionality by layering in new behavior, without having to wait for the library maintainers to add support for it. It also makes testing easier, since you can break your code into small isolated units and write fine-grained tests for them, without worrying about all the other pieces. However, there is one problem. Our current design lets us compose new behavior by wrapping a handler function in a new handler function that implements the behavior and then calls the inner function. This works, but it doesn't scale very well if we want to add lots of additional functionality. Imagine we have many handle_with_* functions that each add a little bit new of behavior. Having to hard-code the chain of which intermediate handler calls which will become challenging. Our current chain is handler_with_timeout_and_content_type which calls handler_with_timeout which calls handle_request which actually processes the request It would be nice if we could somehow compose these three functions without having to hard-code the exact order. Something like: let final_handler = with_content_type(with_timeout(handle_request)); While still being able to run our handler like before: server.run(final_handler).await?; You could try and implement with_content_type and with_timeout as functions that took an argument of type F: Fn(HttpRequest) -> Future<Output = Result<HttpResponse, Error>> and returned a closure like impl Fn(HttpRequest) -> impl Future<Output = Result<HttpResponse, Error>> but that actually isn't possible due to limitations in where Rust allows impl Trait today. Specifically impl Fn() -> impl Future is not allowed. Using Box would be possible but that has a performance cost we would like to avoid. You also wouldn't be able to add other behavior to your handlers besides calling them but why that's necessary is something we'll get back to. The Handler trait Let's try another approach. Rather than Server::run accepting a closure (Fn(HttpRequest) -> ...), let's make a new trait that encapsulates the same async fn(HttpRequest) -> Result<HttpResponse, Error>: trait Handler { async fn call(&mut self, request: HttpRequest) -> Result<HttpResponse, Error>; } Having a trait like this allows us to write concrete types that implement it, so we don't have to deal with Fns all the time. However, Rust currently doesn't support async trait methods, so we have two options: Make call return a boxed future like Pin<Box<dyn Future<Output = Result<HttpResponse, Error>>>. This is what the async-trait crate does. Add an associated type Future to Handler so users get to pick their own type. Let's go with option two, as it's the most flexible. Users who have a concrete future type can use that without the cost of a Box, and users who don't care can still use Pin<Box<...>>. trait Handler { type Future: Future<Output = Result<HttpResponse, Error>>; fn call(&mut self, request: HttpRequest) -> Self::Future; } We still have to require that Handler::Future implements Future with the output type Result<HttpResponse, Error>, as that is what Server::run requires. Having call take &mut self is useful because it allows handlers to update their internal state if necessary1. Let's convert our original handle_request function into an implementation of this trait: struct RequestHandler; impl Handler for RequestHandler { // We use `Pin<Box<...>>` here for simplicity, but could also define our // own `Future` type to avoid the overhead type Future = Pin<Box<dyn Future<Output = Result<HttpResponse, Error>>>>; fn call(&mut self, request: HttpRequest) -> Self::Future { Box::pin(async move { // same implementation as we had before if request.path() == "/" { Ok(HttpResponse::ok("Hello, World!")) } else if request.path() == "/important-data" { let some_data = fetch_data_from_database().await?; Ok(make_response(some_data)) } else { Ok(HttpResponse::not_found()) } }) } } How about supporting timeouts? Remember, the solution we're aiming for is one that allows us to combine different pieces of functionality together without having to modify each individual piece. What if we defined a generic Timeout struct like this: struct Timeout<T> { // T will be some type that implements `Handler` inner_handler: T, duration: Duration, } We could then implement Handler for Timeout<T> and delegate to T's Handler implementation: impl<T> Handler for Timeout<T> where T: Handler, { type Future = Pin<Box<dyn Future<Output = Result<HttpResponse, Error>>>>; fn call(&mut self, request: HttpRequest) -> Self::Future { Box::pin(async move { let result = tokio::time::timeout( self.duration, self.inner_handler.call(request), ).await; match result { Ok(Ok(response)) => Ok(response), Ok(Err(error)) => Err(error), Err(_timeout) => Err(Error::timeout()), } }) } } The important line here is self.inner_handler.call(request). This is where we delegate to the inner handler and let it do its thing. We don't know what it is, we just know that it produces a Result<HttpResponse, Error> when its done. This code doesn't quite compile though. We get an error like this: error[E0759]: `self` has an anonymous lifetime `'_` but it needs to satisfy a `'static` lifetime requirement --> src/lib.rs:145:29 | 144 | fn call(&mut self, request: HttpRequest) -> Self::Future { | --------- this data with an anonymous lifetime `'_`... 145 | Box::pin(async move { | _____________________________^ 146 | | let result = tokio::time::timeout( 147 | | self.duration, 148 | | self.inner_handler.call(request), ... | 155 | | } 156 | | }) | |_________^ ...is captured here, requiring it to live as long as `'static` The issue is that we're capturing a &mut self and moving it into an async block. That means the lifetime of our future is tied to the lifetime of &mut self. This doesn't work for us, since we might want to run our response futures on multiple threads to get better performance, or produce multiple response futures and run them all in parallel. That isn't possible if a reference to the handler lives inside the futures2. Instead we need to convert the &mut self into an owned self. That is exactly what Clone does: // this must be `Clone` for `Timeout<T>` to be `Clone` #[derive(Clone)] struct RequestHandler; impl Handler for RequestHandler { // ... } #[derive(Clone)] struct Timeout<T> { inner_handler: T, duration: Duration, } impl<T> Handler for Timeout<T> where T: Handler + Clone, { type Future = Pin<Box<dyn Future<Output = Result<HttpResponse, Error>>>>; fn call(&mut self, request: HttpRequest) -> Self::Future { // Get an owned clone of `&mut self` let mut this = self.clone(); Box::pin(async move { let result = tokio::time::timeout( this.duration, this.inner_handler.call(request), ).await; match result { Ok(Ok(response)) => Ok(response), Ok(Err(error)) => Err(error), Err(_timeout) => Err(Error::timeout()), } }) } } Note that cloning is very cheap in this case, since RequestHandler doesn't have any data and Timeout<T> only adds a Duration (which is Copy). One step closer. We now get a different error: error[E0310]: the parameter type `T` may not live long enough --> src/lib.rs:149:9 | 140 | impl<T> Handler for Timeout<T> | - help: consider adding an explicit lifetime bound...: `T: 'static` ... 149 | / Box::pin(async move { 150 | | let result = tokio::time::timeout( 151 | | this.duration, 152 | | this.inner_handler.call(request), ... | 159 | | } 160 | | }) | |__________^ ...so that the type `impl Future` will meet its required lifetime bounds The problem now is that T can be any type whatsoever. It can even be a type that contains references, like Vec<&'a str>. However that won't work for the same reason as before. We need the response future to have a 'static lifetime so we can more easily pass it around. The compiler actually tells us what the fix is. Add T: 'static: impl<T> Handler for Timeout<T> where T: Handler + Clone + 'static, { // ... } The response future now satisfies the 'static lifetime requirement, since it doesn't contain references (and any references T co'''
