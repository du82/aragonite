title = "Announcing turmoil | Tokio - An asynchronous Rust runtime"
description = "Tokio is a runtime for writing reliable asynchronous applications with Rust. It provides async I/O, networking, scheduling, timers, and more."
full_description = '''LearnAPI DocsBlogTABLE OF CONTENTS2025January 1Announcing axum 0.8.02024October 23Announcing Toasty, an async ORM for Rust2023November 27Announcing axum 0.7.0January 3Announcing turmoil2022November 25Announcing axum 0.6.0October 27Announcing async-backtraceMore Blog PostsAnnouncing turmoilJanuary 3, 2023Today, we are happy to announce the initial release of turmoil, a framework for developing and testing distributed systems. Testing distributed systems is hard. Non-determinism is everywhere (network, time, threads, etc.), making reproducible results difficult to achieve. Development cycles are lengthy due to deployments. All these factors slow down development and make it difficult to ensure system correctness. turmoil strives to solve these problems by simulating hosts, time and the network. This allows for an entire distributed system to run within a single process on a single thread, achieving deterministic execution. We also provide fine grain control over the network, with support for dropping, holding and delaying messages between hosts. Getting Started To use turmoil, add the crate to your Cargo.toml file: [dev-dependencies] turmoil = "0.3" Similar to loom, we provide simulated networking types that mirror tokio::net. Define a new module in your crate named net or any other name of your choosing. In this module, list out the types that need to be toggled between turmoil and tokio::net: #[cfg(not(feature = "turmoil"))] pub use tokio::net::*; #[cfg(feature = "turmoil")] pub use turmoil::net::*; Then, write your software using networking types from this local module. #[cfg(feature = "turmoil")] mod simulation { #[test] fn simulate_it() -> turmoil::Result { // build the simulation let mut sim = turmoil::Builder::new().build(); // setup a host sim.host("server", || async move { // host software goes here }); // setup the test sim.client("test", async move { // dns lookup for "server" let addr = turmoil::lookup("server"); // test code goes here Ok(()) }); // run the simulation sim.run() } } Each host (including the test code) runs on its own Runtime, which is managed by the simulation. Within run(), the simulation steps each runtime a configurable duration until the test code completes. What's next? This crate is still experimental. Your use cases and feedback are invaluable in guiding our development. Please file issues and ping us on Discord in #turmoil-simulation. Happy testing! — Brett McChesney (@mcches) Announcing axum 0.6.0Announcing axum 0.7.0Get Help:Edit this page'''
