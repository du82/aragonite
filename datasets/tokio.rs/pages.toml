["https://tokio.rs/blog/2019-08-tracing"]
title = "Diagnostics with Tracing | Tokio - An asynchronous Rust runtime"
description = "Tokio is a runtime for writing reliable asynchronous applications with Rust. It provides async I/O, networking, scheduling, timers, and more."
full_description = '''LearnAPI DocsBlogTABLE OF CONTENTS2025January 1Announcing axum 0.8.02024October 23Announcing Toasty, an async ORM for Rust2023November 27Announcing axum 0.7.0January 3Announcing turmoil2022November 25Announcing axum 0.6.0October 27Announcing async-backtraceMore Blog PostsDiagnostics with TracingAugust 14, 2019Effectively developing systems and operating them in production requires visibility into their behavior at runtime. While conventional logging can provide some of this visibility, asynchronous software — like applications using the Tokio runtime — introduces new challenges. tracing is a collection of libraries that provide a framework for instrumenting Rust programs to collect structured, context-aware, event driven diagnostics. Note that tracing was originally released under the name tokio-trace; the name was changed to reflect that, although it is part of the Tokio project, the tokio runtime is not required to use tracing. Why do we need another logging library? Rust already has a robust logging ecosystem based around the log crate's logging facade, with libraries such as env_logger and fern in widespread use. This raises reasonable questions– why is tracing necessary, and what benefit does it provide that existing libraries don't? To answer these questions, we need to consider the challenges introduced by diagnostics in asynchronous systems. In synchronous code, we can simply log individual messages as the program executes, and expect them to be printed in order. A programmer can interpret the logs fairly easily, since the log records are output sequentially. For example, in a synchronous system, if I see a group of log messages like this: DEBUG server: accepted connection from 106.42.126.8:56975 DEBUG server::http: received request WARN server::http: invalid request headers DEBUG server: closing connection I can infer that the request from the client with the IP address 106.42.126.8 was the one that failed, and that the connection from that client was then closed by the server. The context is implied by previous messages: because the synchronous server must serve each request before accepting the next connection, we can determine that any log records occurring after an "accepted connection..." message and before a "closing connection" message refer to that connection. However, in asynchronous systems like Tokio, interpreting traditional log messages can often be quite challenging. A single thread in an asynchronous system might be executing any number of tasks, switching between them as IO resources become available, and an application might consist of a number of such worker threads running concurrently. In this world, we can no longer rely on the ordering of log messages to determine context or cause and effect. A task might log some messages and yield, allowing the executor to poll another task that logs its own unrelated messages. Log messages from threads running concurrently might be printed out interleaved. To understand asynchronous systems, the contextual and causal relationships must be recorded explicitly, rather than implied by sequential ordering. If the log lines in the above example were emitted by a asynchronous application, the server task may continue accepting new connections while previously-accepted ones are being processed by other tasks; multiple requests might be processed concurrently by worker threads. We might see something like this: DEBUG server: accepted connection from 106.42.126.8:56975 DEBUG server: closing connection DEBUG server::http: received request DEBUG server: accepted connection from 11.103.8.9:49123 DEBUG server::http: received request DEBUG server: accepted connection from 102.12.37.105:51342 WARN server::http: invalid request headers TRACE server: closing connection We don't know that the request with invalid headers was received from 106.42.126.8 any longer. Since multiple connections are being processed concurrently, the invalid headers might have been sent on another connection while we waited to receive more data from that client. What can we do to make sense of this mess? Conventional logging often captures static contexts about the program — such as what file, module, or function an event was recorded in — but that's of limited use to us in understanding the program's runtime behavior. Instead, visibility into asynchronous code requires diagnostics that track the dynamic runtime contexts in which events occur. Application-Level Tracing tracing is more than a logging library: it implements scoped, contextual, and structured diagnostic instrumentation. This allows users to trace logical contexts in the application through time, even as the actual flow of execution moves between those contexts. Spans To record the flow of execution, tracing introduces the concept of spans. Unlike a log line that represents a moment in time, a span models a period of time with a beginning and an end. When a program begins executing in a context or performing a unit of work, it enters a span, and when it stops executing in that context, it exits the span. Any events that occur between when a span is entered and when it is exited are considered to have occurred within that span. Similarly, spans may be nested: when a thread enters a span inside of another span, it is in both spans, with the newly-entered span considered the child and the outer span the parent. We can then construct a tree of nested spans and follow them throughout different parts of a program. tracing also supports events, which model instantaneous points in time. Events are similar to traditional log messages, but exist within the tree of spans as well. When we record an event, we can pinpoint the context in which it occurred. Structure By attaching structured data to spans, we can model contexts. Rather than simply recording unstructured, human-readable messages, tracing instrumentation points record typed key-value data called fields. For example, in an HTTP server, a span representing an accepted connection might record fields such as the client's IP address, the requested path, request method, headers, and so on. If we revisit the example above, with the addition of spans, we might see something like this: DEBUG server{client.addr=106.42.126.8:56975}: accepted connection DEBUG server{client.addr=82.5.70.2:53121}: closing connection DEBUG server{client.addr=89.56.1.12:55601} request{path="/posts/tracing" method=GET}: received request DEBUG server{client.addr=111.103.8.9:49123}: accepted connection DEBUG server{client.addr=106.42.126.8:56975} request{path="/" method=PUT}: received request DEBUG server{client.addr=113.12.37.105:51342}: accepted connection WARN server{client.addr=106.42.126.8:56975} request{path="/" method=PUT}: invalid request headers TRACE server{client.addr=106.42.126.8:56975} request{path="/" method=PUT}: closing connection Notice how the events are annotated with spans that record the client IP address, and the request's path and method. Although multiple events are happening concurrently in different contexts, we can now follow the flow of the request from 106.42.126.8 through the system, and determine that it was the request containing the invalid headers that generated the warning. This machine-readable structured data also gives us the ability to consume diagnostic data in more sophisticated ways than simply formatting it to be read by a human. For example, we might also consume the above data by counting the number of requests recieved for different paths or HTTP methods. By looking at the structure of the span tree as well as at key-value data, we can even do things like recording the entire lifespan of a request only when it ended with an error. A Worked Example To demonstrate the value of this kind of diagnostics, let's take a look at an example. In this example, we've written a small HTTP service, using tower, that implements "character repetition as a service". The service recieves requests for paths consisting of a single ASCII character, and responds with that character duplicated a number of times equal to the value of the Content-Length header. We've instrumented the example service using tracing, and used the tracing-subscriber crate to implement an admin endpoint that allows us to change the filter configuration that determines what tracing instrumentation is enabled at runtime. A load generator runs in the background that constantly sends requests for random alphabetic characters to the demo service. With a version of the example service instrumented using the log and env_logger crates, we get output like this: ... [DEBUG load_log] accepted connection from [::1]:55257 [DEBUG load_log] received request for path "/z" [DEBUG load_log] accepted connection from [::1]:55258 [DEBUG load_log] received request for path "/Z" [ERROR load_log] error received from server! status: 500 [DEBUG load_log] accepted connection from [::1]:55259 [DEBUG load_log] accepted connection from [::1]:55260 [DEBUG load_log] received request for path "/H" [DEBUG load_log] accepted connection from [::1]:55261 [DEBUG load_log] received request for path "/S" [DEBUG load_log] received request for path "/C" [DEBUG load_log] accepted connection from [::1]:55262 [DEBUG load_log] received request for path "/x" [DEBUG load_log] accepted connection from [::1]:55263 [DEBUG load_log] accepted connection from [::1]:55264 [WARN load_log] path "/" not found; returning 404 [DEBUG load_log] accepted connection from [::1]:55265 [ERROR load_log] error received from server! status: 404 [DEBUG load_log] received request for path "/Q" [DEBUG load_log] accepted connection from [::1]:55266 [DEBUG load_log] received request for path "/l" ... Because the service is under load, these messages scroll past very fast. I've included just a small sample of the output here. Although the errors do show up in the logs, it's difficult to associate them with any context that might help us determine their cause. For the 404 error, we're lucky enough that whomever added the warning line logged by the server thought to include the path in the human-readable log message, but for the 500 error, we're flying blind. Now, let's switch to a version of the demo application that's instrumented with tracing: ... DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60891}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60890}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60891}:request{req.method=GET req.path="/I"}: load: received request. req.headers={"content-length": "18", "host": "[::1]:3000"} req.version=HTTP/1.1 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60890}:request{req.method=GET req.path="/T"}: load: received request. req.headers={"content-length": "4", "host": "[::1]:3000"} req.version=HTTP/1.1 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60892}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60892}:request{req.method=GET req.path="/x"}: load: received request. req.headers={"content-length": "6", "host": "[::1]:3000"} req.version=HTTP/1.1 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60893}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60895}:request{req.method=GET req.path="/"}: load: received request. req.headers={"content-length": "13", "host": "[::1]:3000"} req.version=HTTP/1.1 WARN server{name=serve local=[::1]:3000}:conn{remote=[::1]:60895}:request{req.method=GET req.path="/"}: load: rsp.status=404 ERROR gen: error received from server! status=404 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60893}:request{req.method=GET req.path="/a"}: load: received request. req.headers={"content-length": "11", "host": "[::1]:3000"} req.version=HTTP/1.1 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60894}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60894}:request{req.method=GET req.path="/V"}: load: received request. req.headers={"content-length": "12", "host": "[::1]:3000"} req.version=HTTP/1.1 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60896}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60998}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60996}:request{req.method=GET req.path="/z"}: load: received request. req.headers={"content-length": "17", "host": "[::1]:3000"} req.version=HTTP/1.1 ERROR gen: error received from server! status=500 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60987}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60911}: load: accepted connection DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60911}:request{req.method=GET req.path="/m"}: load: received request. req.headers={"content-length": "7", "host": "[::1]:3000"} req.version=HTTP/1.1 DEBUG server{name=serve local=[::1]:3000}:conn{remote=[::1]:60912}: load: accepted connection ... Notice how in addition to printing individual events, the span contexts in which they occurred are also printed. In particular, each connection and request creates its own span. However, these events are recorded very frequently, so the logs are still scrolling by quite fast. If we send a request to the demo app's admin endpoint, we can reload the filter configuration to look only at the events recorded by the load generators: :; curl -X PUT localhost:3001/filter -d "gen=debug" These filters are specified using a syntax similar to that of the env_logger crate. The rate at which the logs scroll by slows down significantly, and we see output like this: ... ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/"}: gen: error received from server! status=404 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/z"}: gen: error received from server! status=500 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/z"}: gen: error received from server! status=500 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/z"}: gen: error received from server! status=500 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/z"}: gen: error received from server! status=500 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/"}: gen: error received from server! status=404 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/z"}: gen: error received from server! status=500 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/"}: gen: error received from server! status=404 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/"}: gen: error received from server! status=404 ERROR load_gen{remote.addr=[::1]:3000}:request{req.method=GET req.path="/z"}: gen: error received from server! status=500 ERRO'''
