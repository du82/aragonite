["http://tom.preston-werner.com/2008/11/03/how-to-meet-your-next-cofounder"]
title = "How to Meet Your Next Cofounder"
full_description = "Over the last few months I’ve seen a number of people looking for cofounders on Hacker News or via their own personal blogs. I think this is, at best, a highly inefficient way to find a cofounder and, at worst, a way to fool yourself into finding the wrong cofounder. In any case, it’s a naive approach to finding the person that will need to stand by your side in the coming storm that we call “running a startup.” Don’t get me wrong, the internet is an amazing tool for meeting people. The wider the net you cast, the more likely you are to find the perfect match. But the internet has its limitations. I’ve had internet friends that were engaging, witty, and brilliant online, but in person felt awkward and boring. Conversely, I know people that are volatile and inflammatory online, but present an attitude of friendliness and caring in person. This phenomenon makes it difficult to gauge an individual’s personality from online interaction alone. A far better use of the internet is to find groups of people that share your interests. Track down the local users group for your language or technology of choice. The simple fact that members of these groups take time out of their day to show up means that they’re more motivated and driven than the average person. Even if it’s a bit of a commute to get to the meetings, start showing up regularly. Prepare a few presentations on topics that you’re passionate about. Bonus points if you present on ideas related to your potential startup. Don’t worry about revealing your game-changing secrets; stealth mode is bullshit. Talk to everyone. Steer the conversation toward your interests and if someone there is excited about the same things, it will be clear. It may take weeks or months, but in a good group you’ll find a handful of people that you really like. If at all possible, go out drinking with these people after the meetups. This is one of the easiest ways to go from “acquaintance” to “friend” and gives you free license to bring up your craziest of ideas without sounding like too much of a nutjob."
author = "Tom Preston-Werner"
year_published = 2025
