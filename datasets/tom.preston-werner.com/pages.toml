["https://tom.preston-werner.com/2014/04/21/farewell-github-hello-immersive-computing"]
title = "Farewell GitHub, Hello Immersive Computing"
full_description = "Today is my last day at GitHub. Recent events have given me a lot of time to reflect on what’s important to me, and I’ve decided to switch gears and focus on building something from scratch again. Since visiting the Oculus VR team at their office three months ago, I’ve come to believe that immersive computing (aka virtual reality) is poised to rival the personal computer, the web, social networking, and mobile devices in its impact. While the timing is more abrupt than I had intended, with everything that’s happened, I think now is the right time to do this, and I’d like to explain why. First, I want to address the serious accusations that were made against me and my family over the past month. With every decision I made at GitHub and in every interaction I had with employees, I tried to treat people better than they expected and to resolve conflict with empathy. Despite that, I’ve made mistakes, and I am deeply sorry to anyone who was hurt by those mistakes. It devastates me to know that I missed the mark, and I will strive to do better, every day. That said, I want to be very clear about one thing: neither my wife, Theresa, nor I have ever engaged in gender-based harassment or discrimination. The results of GitHub’s independent investigation unequivocally confirm this and we are prepared to fight any further false claims on this matter to the full extent of the law. I believe in diversity and equality for all people in all professions, especially the tech sector. It’s immensely important to me and I will continue to do my very best to further that belief. Unfortunately, the investigation and all the attention surrounding it have me concerned that remaining at GitHub would be a distraction for both me and the company. I’m incredibly proud of what I’ve helped build at GitHub and I don’t want the events of the past month to jeopardize that. I care too much about the company and the people here to let that happen. The GitHub team is incredibly strong, with fierce vision, and I have no doubt they will continue to revolutionize software development for decades to come. Founding and building GitHub has been the greatest adventure of my life. I’ve been so lucky to be on this journey with such amazing, helpful, talented, and real people. I’m going to miss working with such a great team, but I’m also insanely excited about the future."
