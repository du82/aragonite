["http://tom.preston-werner.com/2020/03/04/joining-the-netlify-board"]
title = "Joining the Netlify Board to Help Shape the Future of the JAMstack"
full_description = "In late September, 2015, I got an email out of the blue from Mathias Biilmann. He told me about his brand new 2-person startup called Netlify and asked if I’d fancy getting together to chat about it. You see, they were making it really easy to deploy static sites like Jekyll and thought I might be interested in learning more. It sounded cool, and it’s hard for me to turn down anything Jekyll-related, so I agreed to meet. On October 1st we met up at a bar in the Dogpatch. I sat down with Matt and his cofounder Christian Bach for several hours over some craft beer and they showed me how they could already build and deploy Jekyll sites (and a few other static site generators) to a global CDN with the push of a button. It was like GitHub Pages, but souped up and turbocharged with global scale production deployments in mind from day one. That existing technology (and the smooth developer experience it offered) was already very impressive, but what really got my attention was their vision around a new term they wanted to coin: the JAMstack (the JAM is for JavaScript, APIs, & Markup). At the time, we all called Jekyll and friends “static site generators”, even though many of them were starting to do really interesting things with JavaScript and 3rd party APIs to handle the dynamic bits like comments, text search, eCommerce, and more. The problem was not that this description of the generators was inaccurate, but that it failed to capture the capabilities and imaginative possibilities of this new architecture, namely, pre-rendering content into CDN-deliverable static pages and then layering interactivity on top with JavaScript and 3rd party APIs. In the same way that the term “AJAX” allowed us to take discussions of what was possible on the web to new conceptual heights, Chris and Matt argued that developers and businesses could communicate more effectively about the potential of “JavaScript and API enhanced static markup sites you can deploy with a git push” if we had a catchy name to capture that development methodology and deployment flow."
author = "Tom Preston-Werner"
year_published = 2025
