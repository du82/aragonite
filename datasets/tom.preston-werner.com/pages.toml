["https://tom.preston-werner.com/2023/05/30/redwoods-next-epoch-all-in-on-rsc"]
title = "RedwoodJS’ Next Epoch: All In on React Server Components"
full_description = "RedwoodJS is the full-stack JS/TS web framework designed to help you grow from side project to startup. For the last year, the RedwoodJS team has been prototyping solutions to the framework’s lack of a proper server-side rendering (SSR) feature. Today, I’m happy to announce that we have chosen to implement a modern SSR solution with a front-end server, leveraging React’s streaming capabilities. This will also allow us to add React Server Components (RSC) to Redwood as our solution to the many downsides of pure single page applications (SPAs). This will require a significant evolution of Redwood’s core architecture and to celebrate this milestone, the first Redwood release with server rendering capabilities will also be the first release of the next epoch: RedwoodJS Bighorn. In addition, I’m excited to announce the first ever RedwoodJS Conference, to be held in-person in Grant’s Pass, Oregon, USA on September 26–29. Join us for an intimate, single-track, two-day gathering (plus a workshop day and a local activity day) nestled in the gorgeous mountain forests of southern Oregon. If you’ve followed Redwood, you may be wondering how we’ve decided to leave our Jamstack-optimized SPA roots behind in favor of a serverful-first, full-stack React framework future. Here’s a laundry list of reasons why: When it comes to React Server Components, it’s still the first inning. Implementing RSC in a framework is a big task, especially because there is no official RSC spec or reference implementation yet. We see this as an opportunity to join the ball game and help guide the future of this awesome technology. Our goal is to make Redwood the premier, open source, fully independent, full-stack React framework that you will choose for your next web app project. Beyond RSC, we have a ton more features and enhancements planned for the Bighorn epoch. You can follow along with the RedwoodJS Roadmap. If all this gets you as excited as it gets me, please drop by our Community Forums or come meet me and the Redwood core team in person at the RedwoodJS Conference in September!"
