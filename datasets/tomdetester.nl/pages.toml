["https://tomdetester.nl/over-mij"]
title = "Over Mij | Tom De Tester | Grote Doelen Bereik Je Samen"
description = "Profielschets:Testen is een vak apart waarin ik excelleer om samen met de opdrachtgever de gestelde doelen te bereiken.  Het gaat er bij mij niet zo zeer om wat ik breng, maar wat u, de klant van mij verwacht. Mijn credo is: “Kwaliteit is een keuze en het juiste niveau bepalen we samen” en dat is precies hoe ik werk en in het leven sta. Niet als einzelgänger maar als teamspeler die mijn teamgenoten coacht, begeleidt en helpt producten van betere kwaliteit te realiseren.Mijn toegevoegde waarde:Ik ben in staat om complexe processen en architecturen te vereenvoudigen en mogelijke knelpunten identificeren.  Ik kan in heldere bewoordingen uitleggen wat de bedoeling is van bepaalde componenten en hoe je deze het beste in kan passen in bestaande processen, procedures etc. Ik help teamgenoten het beste uit zichzelf te halen. Mocht u na het lezen van bovenstaande informatie meer over mij te weten willen komen als professional, dan kunt u middels onderstaande knop mijn meest actuele CV downloaden."
