["https://tomdetester.nl/portfolio"]
title = "Portfolio | Tom De Tester | Grote Doelen Bereik Je Samen"
description = "Testen is een vak apart, hierin wil ik presteren. Ik wil kwaliteit leveren en combineer dat met gedrevenheid en vakmanschap. Ik ben steeds bezig mijn kennis verder te ontwikkelen. Met de nodige creativiteit en flexibiliteit probeer ik de doelstellingen van de opdrachtgever te realiseren."
full_description = "Portfolio Benieuwd met welke technologie ik ervaring heb? Klik hier voor een overzicht Opdrachtgever: Belastingdienst IV-OrganisatiePeriode: 2020-10 tot hedenRol: Testcoach – Lead Tester – Sr. Test Automation EngineerTechnoglogy stack: Robot Frame Work, IBM Developer; Z/Os; DB-2; Jira; Confluence; BitBucket; Git; Python; Cobol; SQL; Jenkins; Safe; Visual Studio Code;Project: VBNVerantwoordelijkheden: Als Sr. Testautomation Engineer was ik verantwoordelijk voor het opzetten, onderhouden en verbeteren van het testautomatiseringsframework, zoals dat is opgezet in de Robot framework. Naast het onderhouden en verbeteren van het testframework draag je als Test Automation Engineer ook bij aan de testwerkzaamheden die uitgevoerd moeten worden voor het team. Daarnaast heb ik een aantal trainees begeleidt in hun eerste stappen van hun loopbaan als Test Automation professional. Naast deze werkzaamheden heb ik ook een meerder malen de workshop Zakelijk tekenen voor IT-professionals gegeven. Naast mijn werkzaamheden als Test Automation Engineer, heb ik ook een aantal testers gecoacht in hun ontwikkeling naar een betere tester. Dit doe ik door het voeren van intervisie gescprekken. Opdrachtgever: TenneT TSOPeriode: 2022-03 tot hedenRol: Sr. Test Automation EngineerTechnology stack: Java8; Java11; Java17, IntelliJ; Cucumber; BDD; Jira; Confluence; Bitbucket; Git ; SQL; Oracle; Agile; Scurm; Jenkins; Quarkus; Safe; Postman;Project: Equality Verantwoordelijkheden:Als Sr Test Automation Engineer ben je verantwoordelijk voor het automatiseren van de test uitvoering op basis van de gerealiseerde User Stories. Opdrachtgever: Nederlandse SpoorwegenPeriode: 2022-11 tot en met 2022-02Rol: Sr. Test Automation Engineer Technology stack: SAP Hybriss Billing; Soap-UI; Java; Jira; Confluence; Bitbucket; Git; SQL; Jenkins; Agile Scrum; Safe;Project: IT Back OfficeVerantwoordelijkheden:Als Sr. Test Automation Engineer ben je verantwoordelijk voor het automatiseren van de gerealiseerde SAP-processen. Daarnaast mee geholpen aan het implementeren van een vernieuwd framework en geholpen om testers een betere tester te maken. Tijdens de opdracht tot de conclussie gekomen dat SAP en Tom de Tester niet een winnende combinatie is. Opdrachtgever: Nederlandse SpoorwegenPeriode: 2020-02 tot – 2020-10Rol: Sr. Test Automation EngineerTechnology stack: SAP-CRM; Soap-UI; Java; Jira; Confluence; Bitbucket; Git; SQL; Jenkins; Agile; Scrum;Project: NS Business CardVerantwoordelijkheden: Als Sr. Test Automation Engineer ben je verantwoordelijk voor het automatiseren van de gerealiseerde SAP-processen. Daarnaast mee geholpen aan het implementeren van een vernieuwd framework en geholpen om testers een betere tester te maken. Op de tweede dag van mijn opdracht brak corona wereldwijd uit en moest ik net als heel Nederland vanuit huis werken, dit bleek een onoverkomelijke horde voor mij en daardoor heb ik voortijde de opdracht teruggegeven. Opdrachtgever: Belastingdienst IV-OrganisatiePeriode: 2018-07 tot – 2020-02Rol: Test Coach – Sr. Test Automation EngineerTechnology stack: Java; Cucumber; SQL; Z-OS; Cobol; Jenkins; Jira; Confluence; Bitbucket; Git; BDD; Agile; Scrum; Safe; Jenkins; Soap UI; IntelliJProject: Generiek Kantoor & ToezichtVerantwoordelijkheden: Als Test Engineer het framework voor de Front End van de applicaites opgezet en onderhouden. De testuitvoering geautomaiseerd. De stappen zo generiek mogelijk opgezet zodat andere testers het framework middels copy and paste toe kunnem passen. Opdrachtgever: AgrifirmPeriode: 2017-05 tot – 2018-06Rol: Agiile Coach – Sr. Test Automation EngineerTechnology stack: SAP; Swagger; Azure; .Net; BDD; Specflow; Jira; Cunfluence;; Visual Studio; Scrum; AgileProject E-commerceVerantwoordelijkheden:Voordat ik mijn opdracht aanvaarde werd de testactiviteit in de sprint na de ontwikkelactiviteiten uitgeoerd. Dit heb ik door testautomatisering te introducren omgevormd naar testen in de sprint. Verder de businsess opgeleid in hoe zij effectiever kunnen testen en bij kunnen dragen aan de testspecificaties. Opdrachtgever: JumboPeriode: 2014-02 tot 2014-11Rol: Lead Tester Technology stack: Stack: SAP-FiCo; Soap-UI; Java; Cucumber; Jira; Confluence; Bitbucket; Git ; SQL; Jenkins; Agile; Scrum; IntershopProject: Elephant – e-commerceVerantwoordelijkheden: Als Lead Tester was ik verantwoordelijk voor het bedenken en invullen van de Test strategie voor het order management deel van het e-commerce platform. Hiertoe is een maatwerk applicatie ontwikkeld welke moest integreren met het bestaande SAP-backend en de Intershop front-end van de webshop. Daarnaast heb ik voor de business inzichtelijk gemaakt door het maken van een praatplaat wat het verschil is in de verschillende stromen tussen de bestaande wereld (de fysieke winkels) en de webwinkel. Opdrachtgever: CJIBPeriode: 2014-11 tot 2016-05Rol: Lead Tester FlitspalenTechnology stack: TMap; Reviews en Inspecties; Technische Acceptatie; Functionele Acceptatie; Service Oriented Architecture; SAP; SQL; Git; Jiral Business Intelligence; ConfluenceProject: FlitspalenVerantwoordelijkheden: Als Lead tester voor de flitspalen ben je verantwoordelijk voor het monitoren van de productie van recent opgeleverde handhavingsmiddelen. Het gaat hierbij om het inrichten en monitoren van het datawarehouse. Van elk handhavingsmiddel werden de foto’s getoetst op mogelijke afwijkingen. Wanneer er afwijkingen geconstateerd werden informeerde je de contractpartij en de contract manager. Opdrachtgever: Coop SupermarktenPeriode: 2016-06 tot 2017-01Rol: Lead Tester E-commerceTechnology stack: Intershop; Agile; Scrum; UX; SAP HANA; System Integration Testing; Gebruikers Acceptatie Test; Git; Jira; Test Atuomation; BDD (Cucumber); ECM;Project: E-commerceVerantwoordelijkheden: Als Lead tester was ik verantwoordelijk voor de kwaliteit van de eerste versie van de webshop en het ondersteunen van de gebruikers (winkeliers en kantoor personeel) bij de lancering. De implementatie van de webshop van Coop was anders dan die van Jumbo. Waar Jumbo koos voor een centrale aanpak en de webshop als een eigen entiteit zag, was de opzet van Coop anders. Zij kozen ervoor om elke stenenwinkel ook een eigen virtuele winkel te laten hebben. De uitdaging zat hem hierbij in, de juistheid van het assortiment van welke winkel. Daarnaast heb ik voor Coop ook de functionele werking van de backend van de webshop gedocumenteerd. Opdrachtgever: Allianz Roadside AssistancePeriode: 2017-01 tot 2017-02Rol: TestCoachTechnology stack: HP Demand (Openview); Gebruikers Acceptatie Testen.Project: ABS – Road side assistanceVerantwoordelijkheden: Tijdens de acceptatie test fase ingezet als Testcoach om de kern gebruikers te begeleiden tijdens de acceptatie testfase van een systeem dat Allianz (internationaal) breed wordt ingezet om claims af te handelen. Hierbij de kerngebruikers gecoacht zodat zij daadwerkelijk keken of het nieuwe product paste op hun werkwijze in plaats van dat zij functioneel gingen testen. Opdrachtgever: Nederlandse Publieke OmroepPeriode: 2015-06 tot 2015-09Rol: TestCoachTechnology stack: BigData; Digidoc; SearchEnging; Supply Demand; Virtualisatie; OTAP; Gestructureerd Testen.Project: DigidocVerantwoordelijkheden : Binnen het programma digidoc wordt gewerkt met een externe leverancier die de bigdata oplossing voor de redactie van een grootaantal redacties van de NPO levert. Dit programma is opnieuw ontwikkeld en voor deze nieuw ontwikkelde versie moesten de gebruikers gecoacht worden in het opstellen van testscripts. Opdrachtgever: Horizon JeugdzorgPeriode: 2015-06 tot 2015-09Rol: TestCoachTechnology stack: Gestructureerd Testen ; Process Cyclus TestProject: HorizonVerantwoordelijkheden : Begeleid de kerngebruikers in het testen en het beschrijven van de testen voor het bestaande systeem en het nieuwe systeem."
