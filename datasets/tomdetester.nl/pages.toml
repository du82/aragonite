description = "Testen is een vak apart, hierin wil ik presteren. Ik wil kwaliteit leveren en combineer dat met gedrevenheid en vakmanschap. Ik ben steeds bezig mijn kennis verder te ontwikkelen. Met de nodige creativiteit en flexibiliteit probeer ik de doelstellingen van de opdrachtgever te realiseren. Ik ben een harde werker, die het best tot zijn recht komt in een team. Het ondersteunen en begeleiden van mijn collega’s zie ik als een van mijn professionele verantwoordelijkheden. Het vakgebied van Testen geeft mij de ruimte om niet alleen de ICT doelstellingen te testen (lees: functionaliteit), maar juist ook die van de business in samen spraak met de business (de toepassing van de applicatie in de bedrijfsprocessen). Ik heb de volgende rollen vervuld: Test automation Engineer  – Agile Test Coach – Scrum master – Software Test Engineer – Lead Tester – Test coördinator"
