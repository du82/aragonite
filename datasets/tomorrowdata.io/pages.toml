["https://tomorrowdata.io/it/the-making-of-an-iot-project"]
title = "Realizzare un progetto IoT"
full_description = "In una infrastruttura completa per progetti di Internet delle Cose ritroviamo una interazione complessa di vari elementi: hardware, firmware, communicazione, funzioni e fruibilità per gli utenti. #utbx_67c3e4a1b8297 { background:#CCC; }#utbx_67c3e4a1b8297:hover { background: #f05222; } #utbx_67c3e4a1b8297:after { box-shadow: 0 0 0 4px #f05222; } Not only cloud We know logic and useful functions cannot just “live in the cloud”. They should be implemented “on the field”, near to whatever relevant is happening out there. #utbx_67c3e4a1b82e3 { background:#CCC; }#utbx_67c3e4a1b82e3:hover { background: #f05222; } #utbx_67c3e4a1b82e3:after { box-shadow: 0 0 0 4px #f05222; } On the field to benefit from real-time high frequency data to reduce action latency and bandwidth consumption to make the data actionable even if the connection is discontinuous #utbx_67c3e4a1b8307 { background:#CCC; }#utbx_67c3e4a1b8307:hover { background: #f05222; } #utbx_67c3e4a1b8307:after { box-shadow: 0 0 0 4px #f05222; } Continuous integration Maintaining and changing useful functions while they live on the field, raises important issues: – what happens if the device won’t reboot? – what happens if firmware is corrupted during transfer? Ultimately we know that an IoT project will stuck against firmware issues as soon as it matures from a prototype to a critical application and … putting it on the cloud won’t just be enough. La comunicazione e la gestione dei dispositivi"
year_published = 2025
