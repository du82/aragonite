title = ""
full_description = "about-us About Us We have the ambition of making IoT technology within the reach of SMEs #ut_scv_67c3e484d9721 .ut-service-icon .fa.fa-stack-1x { color: #f05222; }#ut_scv_67c3e484d9721 .ut-service-icon .fa.fa-stack-2x { color: #CCC; } Enthusiasm about the opportunities the availlable technology can offer. We love “combinatorial innovation #ut_scv_67c3e484d975f .ut-service-icon .fa.fa-stack-1x { color: #f05222; }#ut_scv_67c3e484d975f .ut-service-icon .fa.fa-stack-2x { color: #CCC; } Listening careful to the core of customer business to enhance knowledge with the right “things” #ut_scv_67c3e484d9770 .ut-service-icon .fa.fa-stack-1x { color: #f05222; }#ut_scv_67c3e484d9770 .ut-service-icon .fa.fa-stack-2x { color: #CCC; } Beauty we think a software should be: – easy to use and effective outside – elegant and robust inside Our Way internet-of-things Internet of Things Now, therefore, be it Resolved, that it is the sense of the House of Representatives that the life and achievements of Antonio Meucci should be recognized, and his work in the invention of the telephone should be acknowledged H.RES.269.EH 107th United States Congress (2001-2002) In our vision, IoT is about enabling enterprises and people to communicate, control, manage and use remote objects when this is really useful and profitable, creative or simply enjoyable. The making of an IoT project Impacts of device communication and management Our design of an IoT platform internet-of-things-machine-learning Internet of Things + Machine Learning Le cose di ogni giorno raccontano segreti a chi le sa guardare ed ascoltare (transl. Everyday things tell secret to those who watch and listen) Ci vuole un fiore,1974 (lyrics Gianni Rodari – music Luis Enriquez Bacalov, Sergio Endrigo, music publisher Jubal, Noah’s Ark) Internet of Things is not only the garden sprinkler to start or the fridge that tells you to buy the milk. Internet of Things is inside business life. Internet of Things is deeply involved in maintenance, production and logistic processes. But the things are not only able to notify and execute. We put artificial intelligence inside the things and with Machine Learning technologies, we enable them to interact and take decision like (and sometimes even better) human pratices. Enterprise applications Maintenance and supply chains How it works"
