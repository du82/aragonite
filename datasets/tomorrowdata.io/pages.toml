["https://tomorrowdata.io/rd-sibilla"]
title = "Sibilla"
full_description = "Progetto SIBILLA Industria 4.0, Big Data Analytics, Machine Learning e Internet of Things TOMORROWDATA SRL Progetto finanziato nel quadro del POR FESR 2014-2020 ASSE 1 AZIONE 1.1.5 per un importo di Euro 88.048,64 Realizzato da un team di 4 aziende con l’obiettivo di ricerca, progettazione e sviluppo di un SIstema di Business InteLLigence per Aziende Industria 4.0, con funzionalità di collaboration, automatic interaction, Big Data Analytics e machine learning per estrarre conoscenza realizzando analisi predittive integrando Big Data acquisiti dal Web e da architetture Internet of Things. La gestione e la valorizzazione dei Big Data rappresenta una delle più importanti sfide tecnologiche che le imprese devono affrontare nel contesto di industria 4.0 per rendere più efficace ed efficiente la gestione dei propri processi. Gli attuali sistemi di Business Intelligence (BI) e di Corporate Performance Management (CPM) non rispondono pienamente all’esigenza di adeguare l’ambito della BI innovandola verso l’integrazione con soluzioni e tecnologie tipiche di Industria 4.0, come impiegare funzionalità evolute di data mining e machine learning per estrarre conoscenza da grandi moli di dati, siano essi detenuti nei sistemi informativi aziendali, raccolti dal Web o acquisiti tramite architetture IoT. Il consorzio d’imprese costituito per l’esecuzione del progetto, vede coinvolta FabricaLab S.r.L. come capofila oltre allle società BSD, TomorrowData e Università di Pisa. SIBILLA si pone l’obiettivo di superare le criticità degli attuali sistemi di CPM/BI realizzando il prototipo di un sistema di BI che implementi tecnologie tipiche di industria 4.0 e sia in grado di estrarre, da Big Data provenienti da fonti eterogenee, se pur esogene, informazioni utili a realizzare analisi predittive e ad ottimizzare la gestione dei processi aziendali. Nell’ambito del progetto verranno sviluppati moduli software con funzionalità di web crawling, data pre-processing, text analysis e Big Data mining, in grado di realizzare sentiment analysis e opinion mining su dati raccolti dal web. Risultati raggiunti Sono stati sviluppati moduli software con funzionalità di web crawling, data pre-processing, text analysis e Big Data mining, in grado di realizzare sentiment analysis e opinion mining su dati raccolti dal web. TomorrowData in particolare ha implementato una soluzione per sfruttare in chiave predittiva le misurazioni di grandezze fisiche effettuate da architetture IoT. Maggiori dettagli sul modulo sottosistema di AI/Industrial IoT realizzato da Tomorrowdata sono consultabili qui"
year_published = 2025
clearnet = "https://tomorrowdata.io/rd-sibilla"
