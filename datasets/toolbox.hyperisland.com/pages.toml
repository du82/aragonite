full_description = '''Toolbox Methods & Tools curated by Hyper Island LOGIN TO ACCESS Enjoy the full variety of selected Hyper Island tools for your business. Email* Password* Show password Remember Me Forgot password? or Try going password-less. Get a link sent to your email that'll sign you in. Email* I agree to allow Hyper Island to store and process my personal data. document.getElementById('hs-passwordless-submit').disabled = true; document.querySelector("input[name=explicit_consent]").addEventListener('change',function(){ if (this.checked){ document.getElementById('hs-passwordless-submit').disabled=false; } else{ document.getElementById('hs-passwordless-submit').disabled=true; } }); Don't have an account? Register here. function onFormSubmit() { // document.querySelector('.hs-membership-loader').classList.add('active'); } document.onkeydown = function(e) { if (['ArrowUp','ArrowDown'].includes(e.code)) { var children = [].slice.call(document.querySelectorAll('#hs-membership-form input:not([type="hidden"]):not([type="checkbox"]):not([disabled])')); for (i = 0; i < children.length; i++) { var input = children[i]; if (input === document.activeElement) { if (e.code =='ArrowDown' && children[i+1] !== undefined) { children[i+1].focus(); break; } else if (e.code=='ArrowUp' && children[i-1]!==undefined) { children[i-1].focus(); break; } } else if (i + 1 === children.length) { children[0].focus(); } } } else if ('Enter' === e.code) { e.preventDefault(); var children = [].slice.call(document.querySelectorAll('#hs-membership-form input:not([type="hidden"]):not([type="checkbox"]):not([disabled])')); for (i = 0; i < children.length; i++) { var input=children[i]; if (input === document.activeElement && children[i+1] !== undefined) { children[i+1].focus(); break; } else if (input === document.activeElement && i + 1 === children.length) { // document.querySelector('.hs-membership-loader').classList.add('active'); document.getElementById('hs-membership-form').submit(); } else if (i + 1 === children.length) { children[0].focus(); } } } } You've made too many attempts at this request. Please try this action again in a few minutes. function show_password(id) { var input = document.getElementById(id); input.type = input.type === 'password' ? 'text' : 'password'; } function getCookie(name) { var nameEQ = name + "="; var ca = document.cookie.split(';'); for(var i=0;i < ca.length;i++) { var c = ca[i]; while (c.charAt(0)==' ') c = c.substring(1,c.length); if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length); } return null; } function setTracker() { var utkInput = document.getElementById('hs-membership-form-hubspotutk'); if (!utkInput.value) { utkInput.value = getCookie("hubspotutk"); } } setInterval(setTracker, 300); Having trouble? Contact the admin. New here? Create an account to get free access to the Toolbox! document.addEventListener('DOMContentLoaded', function() { const module = document.querySelector('#hs_cos_wrapper_my_login'); const params = new URL(document.location).searchParams const paramError = params.get('membership_error'); if (paramError) { module.querySelector('.hs-error-msgs').style.display = 'block'; } });'''
