full_description = '''Open thread Terin Stock @terinjokes Terin Stock. Username: @terinjokes. I have a lot of fun projects in flight this weekend! Show sensitive media Published Feb 21, 2025, 14:24 Language English Feb 21, 2025, 14:24 4 4 replies 2 2 favourites 0 0 boosts en Open thread catskull @dareelcatskull catskull. Username: @dareelcatskull@mastodon.social. @terinjokes what are the microcontrollers? that's a very interesting package on the 2040 Published Feb 21, 2025, 15:35 Language English Feb 21, 2025, 15:35 1 1 reply 0 0 favourites 0 0 boosts en Open thread Terin Stock @terinjokes Terin Stock. Username: @terinjokes. @dareelcatskull- PGA2040, which breaks out all 30 GPIO pins from the RP2040, in a package a easier to use in development.- RM2 breakout, the BT+WiFi chipset from the Pico 2 W- Ebyte CC2530, ZigBee 3.0 module Published Feb 21, 2025, 16:45 Language English Feb 21, 2025, 16:45 1 1 reply 1 1 favourite 0 0 boosts en Open thread catskull @dareelcatskull catskull. Username: @dareelcatskull@mastodon.social. @terinjokes Interesting, a standalone WF/BT chipset...What's the plan with the zigbee? Back in the day I interned at Digi International which makes the XBee line of radios and had a lot of fun playing with random radios including zigbee. My favorite was their 802.15.4 radio which had this "I/O line passing" feature that let you pair two of them and the I/O state would just magically reflect on the other device. I made a smart diaper system and won a few hundred bucks in the hackathon! Published Feb 21, 2025, 17:38 Language English Feb 21, 2025, 17:38 1 1 reply 0 0 favourites 0 0 boosts en'''
