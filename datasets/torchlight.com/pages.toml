["https://www.torchlight.com/investment-management"]
title = "Investment Management - Torchlight Investors"
description = "Since its inception, Torchlight has acquired and managed over $30 billion in commercial real estate debt investments on behalf of institutional investors, including public and corporate pension funds, endowments and foundations, and sovereign wealth funds. Torchlight has sponsored investment funds in opportunistic, value-add and hedge fund strategies."
full_description = "Investment Management Discipline Since its inception, Torchlight has acquired and managed over $30 billion in commercial real estate debt investments on behalf of institutional investors, including public and corporate pension funds, endowments and foundations, and sovereign wealth funds. Torchlight has sponsored investment funds in opportunistic, value-add and hedge fund strategies. Investment Management Discipline Since its inception, Torchlight has acquired and managed over $30 billion in commercial real estate debt investments on behalf of institutional investors, including public and corporate pension funds, endowments and foundations, and sovereign wealth funds. Torchlight has sponsored investment funds in opportunistic, value-add and hedge fund strategies. Strategies Torchlight pursues investments across the spectrum of debt and other interests relating to commercial real estate, including senior and mezzanine mortgage loans, CMBS, preferred equity and equity positions. Opportunistic/Value-Add Strategies: Torchlight identifies significant market opportunities in strategic segments of the commercial real estate market through the evaluation of supply/demand technicals and real estate fundamentals. Torchlight strives to maximize risk-adjusted returns for opportunistic and value-add investors through our sharp attention toward mitigating downside risk and prudent use of leverage. Benchmarked Strategies: Torchlight has managed various benchmark strategies in commercial real estate debt. Torchlight has developed portfolios benchmarked to both the Barclays Capital Aggregate Bond Index and its CMBS subcomponent. Long/Short Strategies: Torchlight has managed both short and market neutral strategies. Torchlight believes that its fundamental real estate approach allows it to identify both long and short positions that can generate favorable risk-adjusted returns. Our Portfolio Southeast Office Read More Aurora Multifamily Read More Florida Hotel Read More Dollar General Retail Portfolio Read More Brickell Hotel Read More Austin Multifamily Read More View All"
