title = "Financial Control & Operations Archives - Torchlight Investors"
full_description = "Financial Control & Operations Back to Leadership VADIM BLIKSHTEYN Partner, Chief Financial Officer Read More × VADIM BLIKSHTEYN Partner, Chief Financial Officer Vadim is a Partner and Chief Financial Officer. He has 15 years of professional experience. Prior to Torchlight, Vadim worked at Baker Tilly Virchow Krause, LLP and Holtz Rubenstein Reminick, LLP. Vadim is a Certified Public Accountant in the State of New York and holds a BS from Brooklyn College – City University of New York. IRINA DEVANE Partner, Head of Fund Operations Read More × IRINA DEVANE Partner, Head of Fund Operations Irina is a Partner and Head of Fund Operations. She has 19 years of professional experience. Prior to Torchlight, Irina worked at Ride Safely. Irina holds a BA from Touro College. FELIPE DORREGARAY Partner, Chief Operating Officer Read More × FELIPE DORREGARAY Partner, Chief Operating Officer Felipe is a Partner and Chief Operating Officer as well as a member of the Operating Committee. He has 28 years of professional experience. Prior to Torchlight, Felipe worked at The Carlyle Group / Metropolitan Real Estate Equity Management, LLC, ABN AMRO, Inc., and Salomon Smith Barney, Inc. Felipe holds an MBA from The American University and a BS from the University of Miami. DMITRY GERTS Senior Vice President, Head of Fund Accounting Read More × DMITRY GERTS Senior Vice President, Head of Fund Accounting Dmitry is a Senior Vice President and Head of Fund Accounting. He has 18 years of professional experience. Prior to Torchlight, Dmitry worked at Citco Fund Services and Rothstein Kass. Dmitry holds a BBA from Pace University. JASON KERR Chief Compliance Officer and General Counsel Read More × JASON KERR Chief Compliance Officer and General Counsel Jason is Chief Compliance Officer and General Counsel. He has 22 years of professional experience. Prior to Torchlight, Jason worked at Robinson Bradshaw, Axiom, The Carlyle Group / Metropolitan Real Estate Equity Management, LLC, Marsh & McLennan Companies, Inc. and Akin Gump Strauss Hauer & Feld LLP. Jason holds a JD from Columbia University and a BA from University of California, Berkeley."
