title = "Leadership - Torchlight Investors"
description = "Torchlight has a deep bench of professionals with valued insight and perspectives in commercial real estate, financial structuring, tax, and capital markets. The senior personnel of Torchlight average over 20 years of professional experience. The professionals at Torchlight share in a culture of accountability, integrity and excellence that form the foundation of our core values. […]"
full_description = "Leadership Experienced Team Torchlight has a deep bench of professionals with valued insight and perspectives in commercial real estate, financial structuring, tax, and capital markets. The senior personnel of Torchlight average over 20 years of professional experience. The professionals at Torchlight share in a culture of accountability, integrity and excellence that form the foundation of our core values. Partners Investment Management Investor Relations Financial Control & Operations Leadership Experienced Team Torchlight has a deep bench of professionals with valued insight and perspectives in commercial real estate, financial structuring, tax, and capital markets. The senior personnel of Torchlight average over 20 years of professional experience. The professionals at Torchlight share in a culture of accountability, integrity and excellence that form the foundation of our core values. Partners Investment Management Investor Relations Financial Control & Operations Our Team VADIM BLIKSHTEYN Partner, Chief Financial Officer Read More × VADIM BLIKSHTEYN Partner, Chief Financial Officer Vadim is a Partner and Chief Financial Officer. He has 15 years of professional experience. Prior to Torchlight, Vadim worked at Baker Tilly Virchow Krause, LLP and Holtz Rubenstein Reminick, LLP. Vadim is a Certified Public Accountant in the State of New York and holds a BS from Brooklyn College – City University of New York. SAMUEL CHANG Partner, Co-Head of Portfolio Management Read More × SAMUEL CHANG Partner, Co-Head of Portfolio Management Sam is a Partner and Co-Head of Portfolio Management as well as a member of the Investment and Operating Committees. He has 26 years of professional experience. Sam holds a BS from Columbia University. ROBINSON CHIN Senior Vice President, Asset Management Read More × ROBINSON CHIN Senior Vice President, Asset Management Robinson is a Senior Vice President in the asset management group. He has 17 years of professional experience. Robinson holds a BBA from the University of Michigan. WILLIAM CLARKSON Partner, Head of Distressed Workouts Read More × WILLIAM CLARKSON Partner, Head of Distressed Workouts Bill is a Partner and Head of Distressed Workouts. He has 20 years of professional experience. Prior to Torchlight, Bill worked at Auction.com, LNR Partners, Rockwood Real Estate Advisors and First Potomac Realty Trust. Bill holds an MBA from the University of Florida and a BBA from Roanoke College. ALEXANDRA CRAWLEY Senior Vice President, Asset Management Read More × ALEXANDRA CRAWLEY Senior Vice President, Asset Management Alex is a Senior Vice President in the asset management group. She has 13 years of professional experience. Prior to Torchlight, Alex worked at Antheus Capital, Guggenheim Partners and Stonebeck Capital. Alex holds a BA from Columbia University. IRINA DEVANE Partner, Head of Fund Operations Read More × IRINA DEVANE Partner, Head of Fund Operations Irina is a Partner and Head of Fund Operations. She has 19 years of professional experience. Prior to Torchlight, Irina worked at Ride Safely. Irina holds a BA from Touro College. GREGORY DINEEN Partner, Co-Chief Investment Officer Read More × GREGORY DINEEN Partner, Co-Chief Investment Officer Greg is a Partner and Co-Chief Investment Officer as well as a member of the Investment and Operating Committees. He has 22 years of professional experience. Prior to Torchlight, Greg worked at B2R Finance (Blackstone), Guggenheim Partners and Credit Suisse. Greg holds a BS from Villanova University. FELIPE DORREGARAY Partner, Chief Operating Officer Read More × FELIPE DORREGARAY Partner, Chief Operating Officer Felipe is a Partner and Chief Operating Officer as well as a member of the Operating Committee. He has 28 years of professional experience. Prior to Torchlight, Felipe worked at The Carlyle Group / Metropolitan Real Estate Equity Management, LLC, ABN AMRO, Inc., and Salomon Smith Barney, Inc. Felipe holds an MBA from The American University and a BS from the University of Miami. BRADLEY ERLICH Senior Vice President, Asset Management Read More × BRADLEY ERLICH Senior Vice President, Asset Management Brad is a Senior Vice President in the asset management group. He has 17 years of professional experience. Prior to Torchlight, Brad worked at Bear Stearns. Brad holds a BA from the University of Pennsylvania. KAITLYN FUREY Senior Vice President, Client Strategy Read More × KAITLYN FUREY Senior Vice President, Client Strategy Kait is a Senior Vice President in the Client Strategy group. She has 16 years of professional experience. Prior to Torchlight, Kait worked at Angelo Gordon and PricewaterhouseCoopers. Kait is a Certified Public Accountant in the State of New York and holds a BS from Villanova University. WAYNE GAVIOLI Director, Research Read More × WAYNE GAVIOLI Director, Research Wayne is a Director of Research. He has 16 years of professional experience. Wayne is a CFA Charterholder and holds an AB from Harvard University. DMITRY GERTS Senior Vice President, Head of Fund Accounting Read More × DMITRY GERTS Senior Vice President, Head of Fund Accounting Dmitry is a Senior Vice President and Head of Fund Accounting. He has 18 years of professional experience. Prior to Torchlight, Dmitry worked at Citco Fund Services and Rothstein Kass. Dmitry holds a BBA from Pace University. DANIEL GREENHOLTZ Partner, Co-Head of Portfolio Management Read More × DANIEL GREENHOLTZ Partner, Co-Head of Portfolio Management Dan is a Partner and Co-Head of Portfolio Management. He has 20 years of professional experience. Prior to Torchlight, Daniel worked at CWCapital and SNS Property Finance. Daniel holds a BA from University of Maryland. DANIEL HEFLIN Partner, Co-Chief Investment Officer Read More × DANIEL HEFLIN Partner, Co-Chief Investment Officer Dan is a Partner and Co-Chief Investment Officer as well as a member of the Investment and Operating Committees. Dan was the Founder of Torchlight and has 37 years of professional experience. Prior to Torchlight, Dan worked at Ocwen Financial Corporation, Credit Suisse and Arthur Andersen. While with Arthur Andersen, Dan received his Certified Public Accountant license in the State of New York. He holds an MS from the London School of Economics and Political Science and a BBA from Texas Christian University. HEIDI KAUFMAN Partner, Head of Client Strategy Read More × HEIDI KAUFMAN Partner, Head of Client Strategy Heidi is a Partner and Head of Client Strategy as well as a member of the Operating Committee. She has 20 years of professional experience. Prior to Torchlight, Heidi worked at H/2 Capital Partners and Hypo Real Estate. Heidi holds a BS from Saint Thomas Aquinas College. JASON KERR Chief Compliance Officer and General Counsel Read More × JASON KERR Chief Compliance Officer and General Counsel Jason is Chief Compliance Officer and General Counsel. He has 22 years of professional experience. Prior to Torchlight, Jason worked at Robinson Bradshaw, Axiom, The Carlyle Group / Metropolitan Real Estate Equity Management, LLC, Marsh & McLennan Companies, Inc. and Akin Gump Strauss Hauer & Feld LLP. Jason holds a JD from Columbia University and a BA from University of California, Berkeley. ABBEY KOSAKOWSKI Partner, Deal Structuring Read More × ABBEY KOSAKOWSKI Partner, Deal Structuring Abbey is a Partner in the acquisitions group. She has 29 years of professional experience. Prior to Torchlight, Abbey worked at JPMorgan and Lehman Brothers as a practicing attorney. Abbey holds a JD and BS from the University of Florida. DANIEL LOCKWOOD Partner, Co-Head of Private Acquisitions Read More × DANIEL LOCKWOOD Partner, Co-Head of Private Acquisitions Daniel is a Partner and Co-Head of Private Acquisitions. He has 27 years of professional experience. Prior to Torchlight, Daniel worked at World Class Capital Group, Guggenheim Partners, Zurich Alternative Management, and Credit Suisse. Daniel holds a BA from Pennsylvania State University. GIANLUCA MONTALTI Partner, Head of Asset Management Read More × GIANLUCA MONTALTI Partner, Head of Asset Management Luca is a Partner and Head of Asset Management as well as a member of the Investment and Operating Committees. He has 27 years of professional experience. Prior to Torchlight, Luca worked at Investcorp International, Greenstreet Real Estate Partners and LaSalle Investment Management. Luca holds an MBA from the University of Chicago and a BBA from the University of Michigan. JOHN PITTENGER Senior Vice President, Asset Management Read More × JOHN PITTENGER Senior Vice President, Asset Management John is a Senior Vice President in the asset management group. He has 18 years of professional experience. Prior to Torchlight, John worked at BlackRock. John holds an MBA from Rutgers University and a BA from Franklin & Marshall College. JORGE RODRIGUEZ Senior Vice President, Distressed Debt Workout Read More × JORGE RODRIGUEZ Senior Vice President, Distressed Debt Workout Jorge is a Senior Vice President in the distressed debt workout group. He has 19 years of professional experience. Prior to Torchlight, Jorge worked at LNR Partners and American Real Estate Capital. Jorge holds a MS and BS from Florida International University. BRIAN SEDWITZ Senior Vice President, Public Acquisitions Read More × BRIAN SEDWITZ Senior Vice President, Public Acquisitions Brian is a Senior Vice President in the investment management and acquisitions group. He has 15 years of professional experience. Prior to Torchlight, Brian worked at K2 Advisors. Brian is a CFA Charterholder and holds a BS from Georgetown University. MARY SMENDZUIK Senior Vice President, Business Development Read More × MARY SMENDZUIK Senior Vice President, Business Development Mary is a Senior Vice President in the investor relations group. She has 18 years of professional experience. Prior to Torchlight, Mary worked at New York Life Real Estate Investors, Capri Capital, Credit Suisse and Bank of America. Mary holds an MBA from the University of Michigan and a BA from Michigan State University. JONATHAN STEIN Partner, Co-Head of Private Acquisitions Read More × JONATHAN STEIN Partner, Co-Head of Private Acquisitions Jon is a Partner and Co-Head of Private Acquisitions. He has 23 years of professional experience. Prior to Torchlight, Jon worked at Allegiant Real Estate Capital, Realty Finance Trust, Brookfield Asset Management and Credit Suisse. Jon holds an MBA from Columbia Business School, a JD from Georgetown University and an AB from Harvard University. RYAN WALTERS Senior Vice President, Asset Management Read More × RYAN WALTERS Senior Vice President, Asset Management Ryan is a Senior Vice President in the asset management group. He has 14 years of professional experience. Prior to Torchlight, Ryan worked at Ernst & Young LLP and Cushman & Wakefield. Ryan holds a BA from Lehigh University. MARC YOUNG Partner, Co-Chief Investment Officer Read More × MARC YOUNG Partner, Co-Chief Investment Officer Marc is a Partner and Co-Chief Investment Officer as well as a member of the Investment and Operating Committees. He has 31 years of professional experience. Prior to Torchlight, Marc worked at CWCapital and AIG Global Investments. Marc holds an MBA from Temple University and a BS from Pennsylvania State University."
