["http://www.torchlight.com/about-us"]
title = "About Us - Torchlight Investors"
description = "Since inception, Torchlight has acquired over $30 billion in commercial real estate debt investments and has $6.6 billion of assets under management. Over a span of 30 years, Torchlight has launched 13 institutional funds, investing in both public and private markets across the real estate capital stack. Investing across the credit spectrum has allowed Torchlight […]"
full_description = "About Us Founded in 1995 Since inception, Torchlight has acquired over $30 billion in commercial real estate debt investments and has $6.6 billion of assets under management. Over a span of 30 years, Torchlight has launched 13 institutional funds, investing in both public and private markets across the real estate capital stack. Investing across the credit spectrum has allowed Torchlight to identify attractive risk-adjusted opportunities and implement acquisition, investment management and disposition strategies for our investors through multiple market cycles. Torchlight launched its distressed debt workout business, Torchlight Loan Services, in 1998. Torchlight Loan Services is a nationally rated special servicer and is the named special servicer on $10.2 billion of structured commercial real estate debt. Since inception, Torchlight Loan Services has resolved over 740 loans with a par value of $11.8 billion and has managed over 250 properties with a total value of $2.9 billion."
