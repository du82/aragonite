description = "Torchlight provides customized lending solutions for borrowers in a wide range of property types. We offer stable and flexible financing to commercial real estate projects, including bridge and permanent loans, DIP financing, stabilization and mezzanine loans. Torchlight can quickly assess and value opportunities to best meet the needs of commercial real estate developers and investors."
full_description = "Lending Innovative Product Solutions Torchlight provides customized lending solutions for borrowers in a wide range of property types. We offer stable and flexible financing to commercial real estate projects, including bridge and permanent loans, DIP financing, stabilization and mezzanine loans. Torchlight can quickly assess and value opportunities to best meet the needs of commercial real estate developers and investors. Lending Innovative Product Solutions Torchlight provides customized lending solutions for borrowers in a wide range of property types. We offer stable and flexible financing to commercial real estate projects, including bridge and permanent loans, DIP financing, stabilization and mezzanine loans. Torchlight can quickly assess and value opportunities to best meet the needs of commercial real estate developers and investors. Lending Solutions Guidelines Commercial Real Estate Debt Investment Guidelines: New loan origination – subordinate debt, preferred equity, stretch seniors Acquisition of existing loans and loan portfolios All U.S. markets, all major property types Value-add and opportunistic acquisitions and recapitalizations Non-recourse Quick closings Excluded deal types: Construction/Development; Land; Single family homes Subordinate Debt and Preferred Equity: Mezzanine Loans, Preferred Equity and B-Notes $10 million minimum loan size 3-10 year loan terms (co-terminus with senior loans) Leverage up to 95% LTC (of total budget) Accrual (PIK) available Lower preferred hurdles with participating waterfall structures available Senior & Subordinate 'One Stop Shop' Senior Loan (only in combination with Subordinate Loan) Leverage up to 70-75% LTV/LTC Floating rate 3-5 year loan terms Flexible prepayment provisions Mezzanine Loan / Preferred Equity Same criteria as Subordinate Debt and Preferred Equity Program above Debt Acquisitions Non-Performing and Sub-Performing loans Single loans and loan portfolios $20 million minimum investment size Joint-Venture Equity Investing in JV equity on a select basis for exceptional opportunistic deals Please contact us for additional information regarding the Torchlight lending program. Our Portfolio Southeast Office Read More Aurora Multifamily Read More Florida Hotel Read More View More"
