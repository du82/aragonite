["https://torontopubliclibrary.ca/about-the-library/strat-annual.jsp"]
title = "Strategic Plans, Annual Reports & Statistics : Toronto Public Library"
description = "Strategic Plans, Annual Reports & Statistics"
full_description = "Strategic Plans, Annual Reports & Statistics Strategic Plan 2025-2029 We are in the process of developing a new Strategic Plan to guide the library for the next five years. The feedback we gather will help us improve our services. This will help us better meet the changing needs of Torontonians and help address the challenges and opportunities that our city faces. Learn more about the development process: Creating a new Strategic Plan: 2025 - 2029 (December 2023, PDF) Strategic Plan 2025 – 2029: Environmental Scan Focus Areas and Consultation Plan (January 2024, PDF) Strategic Plan 2025-2029: Environmental Scan Summary and Internal Consultation Phase One Results (April 2024. PDF) Strategic Plan 2025-2029: External Consultation Phase One Results and Phase Two Consultation Plan (May 2024, PDF) View an interactive summary report of the phase one public consultation results including thoughts ranked from highest to lowest and for each theme. Strategic Plan 2025-2029: Results of Survey of Toronto Residents (September 2024, PDF) Strategic Plan 2025-2029: Phase Two Consultation Results and Priority Areas (October 2024, PDF) Strategic Plan 2025-2029: Creating connection and belonging for Torontonians to thrive in every neighbourhood (December 2024, PDF) Strategic Plan 2020-2024 Our Strategic Plan (2020-2024) reflects the input of thousands of Torontonians from every neighbourhood, and community partners and collaborators across many sectors. We have developed five strategic priorities and three supporting enablers that will shape and guide our work over the next five years. They allow us to plan for the long-term, and be responsive in the moment to change. You will also see in our new Plan that we have put Torontonians at the centre of it, with the ambition of building more resilience, success and well-being for our city and its residents. tpl: vital to toronto building success, resilience and well-being for our city Download PDF Download Accessible PDF Our plan at a glance Here is a high-level view of the plan, which will guide our work over the next five years. Our Strategic Priorities are where we will focus and invest over the next five years. There are five priorities: public space, digital inclusion and literacy, workforce development, a democratic society and public service excellence. Our Focus on Equity applies to all of our Strategic Priorities. This focus is our commitment to understanding and breaking down barriers to access and increasing inclusion. Our Enablers are foundational and organizational supports that allow us to deliver on our outcomes. They apply to all of the work we do. There are three enablers: partnerships, modernization, and evaluation and accountability. Our short- and medium-term outcomes focus on what success looks like for individual Torontonians when they use the library. Our long-term outcomes have city impacts and tie to larger city initiatives. These outcomes are the transformational change that helps make our city successful, resilient and well. How we got here Building the Strategic Plan was a collective effort over a year-long process. We’ve engaged over 4,000 library staff, Torontonians, community partners and stakeholders about what we can do to support them and their communities now and into the future. Find out more about the key steps and decisions in our process in the reports below. Environmental Scan and Consultation Creating a New Strategic Plan (March 2019, PDF) Preliminary Environmental Scan and Consultation Plan (April 2019, PDF) Environmental Scan and Consultation Plan Results (June 2019, PDF) Phase 2 Consultation Update and Draft Priority Areas (September 2019, PDF) Results of Survey of Torontonians (November 2019, PDF) Past Strategic Plans 2016-2019: Expanding access. Increasing opportunity. Building connections (PDF) 2012-2015: Read. Learn. Create. Deliver (PDF) 2008-2011: Our Shared Stories: Writing the Future of Toronto's Library (PDF) 2004-2007: Urban Stories: The Next Chapter (PDF) 2000-2003: Creating the Future. Treasuring the Past (PDF) Annual Reports 2023 Annual Report 2022 Annual Report 2021 Annual Report 2020 Annual Report 2019 Annual Report 2018 Annual Report 2017 Annual Report 2016 Annual Report 2015 Annual Report 2014 Annual Report 2013 Annual Report 2012 Annual Report (PDF) 2011 Annual Report (PDF) 2010 Annual Report (PDF) 2009 Annual Report (PDF) 2008 Annual Report (PDF) 2007 Annual Report (PDF) 2006 Annual Report (PDF) 2005 Annual Report (PDF) 2004 Annual Report (PDF) 2003 Annual Report (PDF) 2002 Annual Report (PDF) 2001 Annual Report (PDF) 2000 Annual Report (PDF) 1999 Annual Report (PDF) Related links Library Statistics & Value Service Plans, Strategies, Frameworks & Reports"
