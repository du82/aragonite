["https://torontopubliclibrary.ca/about-the-library/library-jobs"]
title = "Jobs at the Library : Toronto Public Library"
description = "Employment information for people wanting to work at the library."
full_description = '''Jobs at the Library View and apply for current opportunities Join our team at the busiest urban public library system in the world and help us advance our mission to inform and inspire Toronto and its communities, making us all more resilient, knowledgeable, connected, and successful. We have many exciting opportunities, including entry-level Page roles, Librarian and other library public service positions, and roles in areas such as IT, Marketing and Communications, Facilities, Finance and HR. Before you can apply for job opportunities, you must create a candidate profile. Check below for current postings. Current Opportunities Internal Applicants External Applicants Stay connected Join our talent network and set up job alerts to stay informed about opportunities at the library. Equity, Inclusion and Reconciliation Statement TPL invites applications from all qualified individuals. The Library is committed to equal opportunity, diversity in the workplace, equity and reconciliation, and welcomes applications from Indigenous people, Black and racialized groups, people with disabilities, 2SLGBTQ+ people and women. Accessibility and Accommodations Statement TPL is committed to providing an open, accessible and equitable environment through its recruitment and hiring practices, including the provision of accessible formats and communication supports upon request for candidates with disabilities throughout the entire hiring process. To make a request for an accessibility accommodation, please contact recruitment@tpl.ca. A member of TPL’s recruitment team will follow up with further information upon receiving your request. Support For questions about job postings, please email recruitment@tpl.ca. For technical support, please contact NJOYN by email at candidate.njoynhelp@cgi.com or by phone between 8am and 8pm, EST at 1-877-427-7717. Frequently Asked Questions How do I apply for jobs at TPL? To apply for a job at TPL, select the External or Internal Job Board, and select the role you are interested in. After reviewing the job details and requirements you can select "I'm Interested" at the bottom of the page. You will be prompted to log in to your candidate profile. If you don’t already have an existing candidate profile you will need to follow the outlined steps to create a profile. Once you have logged in please fill out the required fields (for example, answering pre-qualification questions) and attach a formatted cover letter and resume. Select Submit. You can review all your applications at any time in the “My Jobs” section. Do I need to create a candidate profile to apply for jobs? Yes, you are required to create a profile in NJOYN to apply to any TPL position. Will TPL contact me about my application? TPL Recruitment will inform candidates selected for interview of the next stages in the hiring process. We will inform all candidates once the role they have applied to is no longer available. What is the best format to submit my application? We suggest uploading a pdf version of your resume and cover letter. How do I request an accommodation during the hiring process? Requests for accommodation can be made at any stage of the recruitment process by contacting recruitment@tpl.ca. How often does TPL post jobs? TPL typically posts roles on Thursdays every week. Bargaining unit positions are posted for a period of seven days; non-union/exempt positions may be posted for longer. Can I submit a general application to learn about future roles at TPL? Yes, we welcome all applications. If you don’t see a posting that meets your qualifications at this time, please register and create a profile on our recruitment site under the “My Profile” section and indicate the job categories you desire. You can also create Job Alerts. Will my information be kept confidential? Yes, all information is kept confidential and is only used for employment purposes. The information related to your job application(s), offer(s) and/or onboarding is collected under the authority of sections 20 (a) and (d) of the Public Libraries Act. The Toronto Public Library collects personal information for the purpose of facilitating the recruitment process and managing human resource functions. This includes information like your contact details, employment and education history, other information you have provided or will provide to the Toronto Public Library. Questions related to the collection of this information should be directed to the Manager of Human Resources at Toronto Public Library, 789 Yonge St, Toronto, ON, M4W 2G8, or by telephone: 416-395-5884, or by email: recruitment@tpl.ca. Whom do I contact if I’m having technical issues? For technical help, please contact the NJOYN help desk by email or phone, and include the brand and version number of your browser, as well as the version of your operating system. Email address: candidate.njoynhelp@cgi.com Phone number: 1-877-427-7717 Hours of operation: Monday to Friday 8 am to 8 pm, EST (except statutory holidays) We have become aware of recruitment fraud involving false job opportunities at Toronto Public Library. Please note: We never ask for a credit card, banking information, or social insurance numbers during the recruitment process. Do not click on any links or respond to emails about jobs at TPL that aren’t sent from tpl.ca, cgi.com or njoyn.com addresses. If you have been the victim of recruitment fraud, please inform your local police department. Back to top'''
