full_description = 'Accessibility at Library Branches Service Update The OpenDyslexic for Chrome extension is currently not available on public computers. It remains available in the Adaptive Technology Rooms at North York Central Library and Toronto Reference Library.ZoomText font smoothing is currently not available.Kurzweil 1000 and Kurzweil 3000 are currently not available. Related links Accessibility Accessibility Services Accessible Collections Website Accessibility AODA Compliance Equipment Available In Select Branches Book stand Props up a book to reduce handling. Available at all branches Braille writer A manual typewriter-like machine used to create braille. Check branch availability CCTV - Print Magnifier A closed circuit television system (CCTV) is a magnification system that uses a video camera to enlarge text on a page up to 50 times larger on a screen. Check branch availability Computer with screen reader software (JAWS) Reads aloud the contents of documents and web pages and speaks standard computer functions for someone who is blind. Keystrokes are used instead of the mouse. Check branch availability Computer with Kurzweil 1000 software and scanner Currently unavailable Kurzweil 1000 software reads scanned materials aloud for people who are blind or have low vision. Computer with Kurzweil 3000 software and scanner Currently unavailable Text to speech technology with a full graphical interface reads scanned materials aloud for people who are blind, have a print disability, or are literacy learners. Computer with screen magnification software (Zoomtext) Font smoothing is currently not available Enlarges text and images on the monitor for people with low vision. Available on one workstation in all branches; on one workstation in each Toronto Reference and North York Central department; on one workstation in all Le@rning Centres. ZoomText workstations provide access to: Internet; Toronto Public Library research and eLearning sites; Microsoft Office products. Available at all branches FM personal amplification system Sound transmitted from microphone to receiver via FM frequency. FM listening system can be used in conjunction with an individual’s hearing aid or by earplugs. Available at Toronto Reference Library Large print keyboard Large typeface on the keys for greater visibility. Available at all branches Large trackball mouse Requires less fine motor control to operate than a standard mouse. Available at all branches Magnifier A handheld magnifier with 2x main magnification and a 4x bifocal inset. Available at all branches Natural spectrum lamp A natural spectrum desk lamp that can improve clarity and contrast and reduce glare and eyestrain for people with a visual disability. Available at all branches Page turner A device with a rubber tip that helps people with limited use of their hands to turn pages. Available at all branches TTY telephone Type messages back and forth via a telephone connection for people who are deaf, hard of hearing or speech-impaired. Check branch availability Wheelchair Accessible Furniture Furniture may be either height adjustable or with at least 29" clearance under table top - tables, study carrels, or computer workstation. Available at all branches'
