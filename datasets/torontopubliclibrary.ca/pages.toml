["https://torontopubliclibrary.ca/about-the-library/service-plans-strategies-frameworks.jsp"]
title = "Service Plans, Strategies, Frameworks & Reports : Toronto Public Library"
description = "Service Plans, Strategies, Frameworks and Reports"
full_description = "Digital Strategy (2020) TPL’s Digital Strategy is our path to delivering exceptional digital value and experiences by ensuring our customers and staff have the right combination of technologies and supports enabled by a modern, connected and sustainable data and technology environment that is transformation-ready. It defines a shared vision, course of action and required investments to enable the priorities set out in our 2020-2024 Strategic Plan and the Service Delivery Model.Download the Digital Strategy (PDF) Facilities Master Plan (2019) This plan provides a framework for capital investment in the library’s facilities infrastructure. It guides the timing and location for renovations and rebuilding projects. The plan is informed by: population and community growth studies, property condition assessments, trends in building automation technology, and requirements to provide 21st century library service throughout the library system.Download the Facilities Master Plan (PDF) Innovation Strategy (2019) This supports Toronto Public Library’s vision for a culture of experimentation with an open, collaborative and engaged workforce. It encourages all staff to experiment and create innovative programs and services that create excellent customer experiences and enriched staff experiences.Download the Innovation Strategy (PDF) Middle Childhood Framework (2014) This framework represents a new direction to services for school-aged children six to 12 and their families. Building on the success of the Ready for Reading programs and services for the early years, the Middle Childhood Framework provides a blueprint for supporting the healthy growth and development of school-aged children as they transition into independent and self-reliant learners.Download the Middle Childhood Framework (PDF) Service Delivery Model (Last Updated 2023) TPL’s Service Delivery Model outlines the types of services we offer (our service pillars) and how those services are provided (our service tiers). It establishes our service levels and describes how we plan and deliver library services and infrastructure. The Service Delivery Model is both practical and aspirational, outlining a systematic approach to branch and service planning that envisions what’s possible with sustained investments in library infrastructure and service delivery. Download the Service Delivery Model (PDF)"
