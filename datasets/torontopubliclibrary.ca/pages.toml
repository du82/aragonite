["https://torontopubliclibrary.ca/accessibility/accessibility-services"]
title = "Accessibility Services : Toronto Public Library"
description = "The library can help people with disabilities. Find out about our services, equipment and collections to help people with disabilities."
full_description = "Accessibility Services Related links Accessibility Accessibility at Library Branches Accessible Collections Website Accessibility AODA Compliance Home Library Services If you are homebound for three months or longer due to age, illness or disability, find out how the library can come to you with Home Library Service. Accessibility Supports If you identify as a person with a disability or a person who is Deaf and require an accessible format of a Library document, or an accessibility accommodation to participate in a Library program or event, you can Request Accessibility Supports. Please let us know as far in advance as possible and we will do our best to meet your request. At least 2 weeks’ notice is preferred. Persons with Disabilities Status If you have difficulty returning and picking up library materials on time due to a disability, you can apply to change your library card to Persons with Disabilities Status. Complete the Application for Persons with Disabilities Status online or in a branch. Persons with Print Disabilities If you have a print disability that prevents you from reading works in their original format, you can apply to change your library card to Talking Books Status. Complete the Talking Book Status Application online or in a branch. TTY Service This telephone device allows callers to communicate through typed messages. Use a TTY in these branches: North York Central Library – not available due to renovations. Toronto Reference Library – on the main floor. If you are a TTY user, you can also call us using TTY Relay Service (711)."
