["https://torontopubliclibrary.ca/about-the-library/board"]
title = "Library Board : Toronto Public Library"
description = "Library Board member biographies and contact information."
full_description = "Library Board Related links Library Board Meetings Contacting the Board Toronto Public Library Procedural By-law Board Member Code of Conduct Lobbying Disclosure Information Lobbying Disclosure for Board Members Policy Conflicts of Interest Disclosure Board Members Alim Remtulla (Chair) Jonathan Hoss (Vice Chair) Sakariya Ahmed Councillor Paul Ainslie Tamara Balan Serda Evren Amina Mohamed Deputy Mayor Amber Morley Soo Wong How can I apply to become a Board member? City Council makes citizen appointments to agencies, boards and commissions, including Toronto Public Library Board. For details, see Citizen appointments to City of Toronto agencies, boards and commissions on the City of Toronto website. Board Member Biographies Alim Remtulla (Chair) Alim Remtulla is a strategy professional who has led initiatives across the public, private and non-profit sectors. Currently, Alim works for Telus Communications, where he leads a global team focused on the Team Member experience at Telus. Previously, he held brand marketing, product management and innovation roles in the consumer-packaged goods sector. Alim is active in the community and is a Governor of Seneca College. Jonathan Hoss (Vice Chair) Jonathan Hoss is a business leader with a background in the arts, technology, and education. Over nine years at McKinsey &Company, he consulted on strategy, digital ventures, and talent development. Later, he served as Vice President and Head of Innovation at Canada Life. Today, he advises enterprises and non-profits on strategic, operational, creative, and labour issues. He holds degrees in Engineering Science from the University of Toronto and Foresight and Innovation from Ontario College of Art and Design University. Sakariya Ahmed Sakariya Ahmed is a lifelong Torontonian, a city builder, policy wonk, and a strong proponent of community. He spends his time thinking about education and equity in public policy and professionally helps ideate, create, and deliver products as a Product Manager. He sits on the board of his alma mater, the Ivey Business School, consulting on its various equity initiatives. He spent the previous year studying policy responses to the housing crisis as an Action Canada fellow and is now working on building a Black-led community centre to address the resourcing gaps. He brings strong expertise in technology, public education, and civic engagement. Councillor Paul Ainslie Paul Ainslie Biography Tamara Balan Tamara is the Vice President of Operations and Community at the St. Joseph's Health Centre Foundation. Previously, she held the role of Chief Operating Officer of CivicAction. Tamara believes that collective leadership is key to making the Toronto region better. For more than fifteen years, Tamara has been boosting civic engagement of senior and rising leaders across sectors and municipal boundaries. In 2012, Tamara was named a Vital Person by the Toronto Community Foundation. Serda Evren Serda is an award-winning communication professional who has a wealth of experience in the public and corporate sectors. Serda was awarded an honours Bachelor of Arts Degree in Political Science and History from the University of Toronto, and a master's in political psychology from George Washington University, in Washington, DC. She has been honoured with an International Association of Business Communicators Award of Distinction as the Corporate Communications Department of the Year and won a Multimedia or Digital Content Merit Award. Amina Mohamed Amina Mohamed is the founder of RiteClik and a lifelong lover of the library. She holds a degree in English and Comparative Literature from the University of Toronto and a masters’ degree in New Media and Digital Culture from the University of Amsterdam. Amina has worked on a variety of digital infrastructure projects in Canada, the United States, Germany and the Netherlands. She brings expertise in strategic communications, data policy, community engagement, and research development. Deputy Mayor Amber Morley Amber Morley Biography Soo Wong Soo Wong grew up in Toronto. She is a life-long supporter and user of the Toronto Public Library. Currently, she is a consultant; previously an Executive Director of a not-for-profit Long-Term Care Home in the Greater Toronto Area, and was a former Member of Provincial Parliament and Deputy Speaker at the Ontario Legislature. She is a former Toronto District School Board Trustee and Nursing Professor at Humber College. She brings extensive knowledge and skills in board governance, long-term care, public health and public education."
