full_description = "Accessibility for Ontarians with Disabilities Act (AODA) Compliance Related links Accessibility Accessibility at Library Branches Accessibility Services Accessible Collections Website Accessibility The Toronto Public Library is committed to meeting and exceeding its compliance requirements under the Accessibility for Ontarians with Disabilities Act (AODA) and the Integrated Accessibility Standards Regulation. Through the Library’s AODA Program, we are dedicated to the identification, removal, and prevention of systemic accessibility barriers within our services, programs, employment practices, and digital and physical spaces. On this page, you can learn how the Library is actively removing barriers and advancing accessibility and inclusion for our staff and customers with disabilities. Multi-Year Accessibility Plan (MYAP) Our accessibility road map to remove and prevent barriers for our staff and customers with disabilities. Read the Plan (PDF) Status Report Our annual progress on delivering the Multi-Year Accessibility Plan. 2023 report (PDF) 2022 report (PDF) Accessibility Compliance Reports TPL’s provincial accessibility reports, demonstrating our compliance with the requirements under the Accessibility for Ontarians with Disabilities Act (AODA). 2023 Accessibility Compliance Report (PDF) - This form may not be viewable in your browser. Please download it to open with a PDF viewer. 2020 Accessibility Compliance Report (PDF) - This form may not be viewable in your browser. Please download it to open with a PDF viewer. 2017 Accessibility Compliance Report (PDF)"
