["https://torontopubliclibrary.ca/adult-literacy"]
title = "Adult Literacy : Toronto Public Library"
description = "Services, books and support for adult learners and the Adult Literacy community."
full_description = "Adult Literacy The Adult Literacy Program offers free, one-on-one tutoring in basic reading, writing and math for English-speaking adults 19 years or older (exceptions may apply). Volunteer tutors work with learners to help them reach their literacy goals. If you, or someone you know, can benefit from this program, please make an appointment with your nearest Adult Literacy Office to complete an intake assessment to determine eligibility. Toronto Public Library offers the Adult Literacy Program in the following branches: Library Days and Hours Albion 416-394-5173 Monday 12:30 p.m. - 8:30 p.m. Tuesday 10:00 a.m. - 6:00 p.m. Barbara Frum 416-395-5424 Thursday 10:00 a.m. - 6:00 p.m. Friday 10:00 a.m. - 6:00 p.m. Don Mills 416-395-5849 Monday, Tuesday 12:30 p.m. - 8:30 p.m. Wednesday, Thursday, Friday 10:00 a.m. - 6:00 p.m. Downsview 416-395-5724 Monday, Tuesday 12:30 p.m. - 8:30 p.m. Wednesday, Friday 9:00 a.m. - 5:00 p.m. Fairview Closed for renovations Malvern 416-396-3668 *Temporarily relocated to Highland Creek for approximately 4-5 months due to renovations. Wednesday 10:00 a.m. - 6:00 p.m. Thursday 12:30 p.m. - 8:30 p.m. Friday 10:00 a.m. - 6:00 p.m. Maria A. Shchuka 416-394-1054 Monday, Tuesday 12:30 p.m. - 8:30 p.m. Wednesday 10:00 a.m. - 6:00 p.m. North York Central Library 416-395-5554 Monday 10:00 a.m. - 6:00 p.m. Tuesday 12:30 p.m. - 8:30 p.m. S. Walter Stewart 416-396-3852 Wednesday 12:30 p.m. - 8:30 p.m. Thursday 10:00 a.m. - 6:00 p.m. Friday 10:00 a.m. - 6:00 p.m. York Woods 416-395-5724 Thursday 9:00 a.m. - 5:00 p.m. Who volunteers? The Adult Literacy Program matches learners with volunteers who tutor them in basic reading, writing and math. Once accepted into the program, volunteers will get training on how to be a tutor and are supported with all the resources the library offers to help learners. Volunteers are needed! More ways to improve your literacy skills Adult Literacy books Books for adults working to improve their reading, writing and math skills. Family literacy for adult literacy learners Videos that help adult learners build important reading and writing skills in their children. Services to the literacy community Toronto Public Library has focused services for organizations and agencies that support adult literacy and skills upgrading programs. Outreach presentations and visits If you are an agency who provides adult literacy support, a good way for your learners to connect with the local library is by arranging for library staff to visit learners in your program. TPL offers in-person and remote presentations that focus on general library information and recommended services and resources to support adult learners. Local library tours A field trip to a library branch is a great way to learn more about what the library has to offer adult learners. Adult Literacy Services staff can arrange for your learners to have a guided library tour. With 100 branches, Toronto Public Library has a location near you! Resources eLearning Free access to online services that can help you learn new skills. eBooks and Online Content Online access to books, magazines and newspapers. Computer and Library Training Programs Free, in-person computer classes across Toronto. Open to everyone, no library card required. Job & Career Help Programs to help you find a job and upgrade your skills. Contact us For more information about the Adult Literacy program, to arrange a visit from library staff or a library tour please contact: Adult Literacy Services Phone: 416-395-5555 Email: adultliteracy@tpl.ca Funding provided by:"
