["https://torontopubliclibrary.ca/about-the-library/library-history"]
title = "History of Toronto Public Library : Toronto Public Library"
description = "Important dates in the library's history from 1830 to present."
full_description = '''History of Toronto Public Library Toronto Public Library has a long history dating back to 1883, and was preceded by mechanics' institutes starting in 1830 in York (Toronto). In 1998, seven library boards amalgamated to form the new Toronto Public Library, the largest public library system in North America. Timeline More library history Timeline 1810 The Toronto Library, a short-lived private subscription library, is founded on December 9. During the American occupation of York in April 1813, the library was looted. In November 1813, Isaac Chauncey (commander of the U.S. fleet) returned two cases of the library's books, with a note of apology to the trustees. Image: Elmsley House, home of Toronto Library, 1810–1813 1830 York Mechanics' Institute is established "for the mutual improvement of its members in useful scientific knowledge." It included a library for reference and circulation. Image: York Mechanics' Institute notice in the York Commercial Directory, 1833 1834 Town of York becomes the City of Toronto, and the York Mechanics' Institute is renamed Toronto Mechanics' Institute. To educate workers (mechanics), the Institute had a library and offered classes on philosophy, music, science, architectural drawing and more. Scarboro' Subscription Library is also established. Learn about Scarborough's early library service. Image: Toronto Mechanics' Institute diploma, designed by Sandford Fleming, 1850 1845 Toronto Mechanics' Institute relocates its library and news-room to the upper floor of the new Central Fire Hall (behind the County Court House) on the north side of Court-house lane (now Court Street), west of Church Street between King and Adelaide streets. Image: Toronto Mechanics' Institute, Court Street Firehall, 1860 1858 Weston Mechanics' Institute is established. See also: Weston Library History and more history of this Institute. Image: Weston Town Hall, 1955, location of the Weston Mechanics' Institute (later Weston Public Library), 1885–1914 1861 Toronto Mechanics' Institute moves into its new home at the northeast corner of Church and Adelaide streets. Designed by F. W. Cumberland & G. W. Storm, the building contains a library with a reading room, a lecture hall and a large music hall. Image: Toronto Mechanics' Institute, 1867 1870s and 1880s Mechanics' institutes with lending libraries and reading rooms are incorporated at Scarboro' (1878), Parkdale (1880) and West Toronto Junction (1888); and revitalized and reorganized at Weston (1885). Image: Campbell Block, location of West Toronto Junction Mechanics' Institute, 1889–1893 1882 Free Libraries Act is passed by the Ontario Legislature. Alderman John Hallam leads the Toronto campaign to establish a free public library in Toronto. Image: Campaign card for the free public library, approximately 1882 1883 Free Library By-Law is approved by a huge majority of Toronto voters, January 1. Toronto and Guelph are the first municipalities in Ontario to create free public libraries. John Hallam becomes the first chair of the Toronto Public Library Board. Image: John Hallam (1833–1900), first chairman of the Toronto Public Library Board, 1883 1884 Toronto Public Library officially opens in the old Mechanics' Institute building, Church and Adelaide streets, on March 6, the city's 50th anniversary. Toronto Public Library opens its first two branches, Northern and Western — the Northern Branch is in St. Paul's Hall (formerly Yorkville Town Hall) on Yonge Street. In 1888, another pair are opened, North Western and Eastern. All are in rented spaces. Image: Invitation to the opening of Toronto Public Library, March 6, 1884 1885 Books in German and French are bought, the beginnings of the library's multi-language collections. Literature in Spanish and Italian is added by 1900, and, to meet the needs of recent immigrants, books in several other European languages are added in the 1910s. See also: Toronto Public Library's services for immigrants, 1908–1937. Image: Reference Library staff, approximately 1895 1887 Policy to collect Canadiana is established. James Bain Jr., the first Chief Librarian, begins building the library's special collections of publications and manuscripts documenting Canada. Image: James Bain Jr. (1842–1908), first Chief Librarian, 1909 1890s Mechanics' institutes — renamed public libraries on May 1, 1895 — are formed at Highland Creek (1890) Islington (1890), Don (1896) and Bracondale (1898). Image: Don Public Library in Aggie Hogg's store, 1925 1890 Toronto Public Library opens Dundas Street Branch in January in rented quarters on today's Ossington Avenue north of Queen Street. It uses furniture and books from the former Parkdale Mechanics' Institute library, annexed to Toronto in 1889. Image: Dundas Street Branch, 1901 1896 Scarborough Centennial Memorial Library is built as part of the township's 100th anniversary celebrations. Image: Scarborough Centennial Memorial Library committee, 1896 1900s Public libraries are established at East Toronto (1903), Deer Park (1905), North Toronto (1909) and Runnymede (1909). Toronto Public Library opens College Street Branch in rented quarters at the corner of Brunswick Avenue. Image: Runnymede Public Library, York Township, approximately 1912 1903 Toronto is awarded a Carnegie grant of $350,000 for a new central library (1909–1977) and three branches: Yorkville (1907), Queen & Lisgar (1909–1964) and Riverdale (1910).Image: Letter offering Carnegie grant, January 23, 1903 1909 Central Library (old Toronto Reference Library) is opened at the northwest corner of College and St. George streets with 97,788 books. College Street Branch, previously housed in rented quarters at the corner of Brunswick Avenue, is relocated to the basement of the new Central Library; it includes a Children's Room. Western (now Annette Street) Branch opens. It was built with a $20,000 Carnegie grant to the old City of West Toronto, amalgamated with Toronto in May 1909. Open shelf system is adopted allowing borrowers in the branches to retrieve books themselves instead of asking library staff.Image: Toronto Reference Library, College & St. George streets, 1910 1910 Toronto Public Library opens branches in storefronts and other rented premises to serve areas recently annexed to Toronto until permanent libraries can be built: Deer Park and Wychwood in 1911; Northern and Earlscourt in 1913, and Beaches and Eastern in 1914. Prior to annexation, some of these areas had their own public libraries. Donation of the J. Ross Robertson Historical Collection (now part of our Baldwin Collection of Canadiana) firmly establishes Toronto Public Library as a collector of historical Canadian imagery. Image: John Ross Robertson with his collection at the Toronto Reference Library, approximately 1912 1911 Municipal Reference Library opens in Toronto City Hall. It's the start of special services for civic officials and business people. Image: Municipal Reference Branch, City Hall, 1911 1912 Lillian H. Smith is hired to head Toronto Public Library's new Children's Department, and inaugurates story hours and other innovative services for children. See also: History of Children's Services and Toronto Public Library's services for immigrants, 1908–1937. Dewey Decimal system of classification is adopted for all books except fiction. Toronto Public Library's Cataloguing Department prepares An Extension of the Dewey Decimal Classification applied to Canada. Image: Lillian H. Smith (1887–1983), approximately 1925 1913 Dovercourt (now Bloor/Gladstone) Branch opens. It is the first library to be financed fully by the City of Toronto. Mimico Public Library Board is established, opening a Carnegie-funded library in the village in 1915. Image: Dovercourt (now Bloor/Gladstone) Branch, rendering about 1912 1914 Weston Public Library Board, established in 1912, opens a Carnegie-funded library in the town. Image: Weston Public Library, approximately 1915 1915 A camp library is established at Exhibition Park for troops training to serve in the First World War. Toronto Public Library is the first library in North America to provide this service for soldiers. Image: "Overseas contingent in largest military parade ever held in Toronto," 1915 1916 Three identical branches open: Beaches, High Park and Wychwood. They were built with a $50,000 grant to Toronto Public Library in 1908. Image: Beaches Branch, approximately 1916 1918 To provide extra service for inner city children, Toronto Public Library opens a library in Central Neighbourhood House. Children's libraries soon are started at other settlement houses: St. Christopher House in 1920, University Settlement House in 1921 and Memorial Institute in 1931. See also: Toronto Public Library's services for immigrants, 1908–1937. Library associations are formed at Agincourt, followed by Swansea (1919), established "as a Memorial to our Swansea men who have seen active service in the Great War." Image: Library at University Settlement House, 1920s 1920s Six new branches open in Toronto: Earlscourt (1921, now Dufferin/St. Clair), Eastern (1921, now Main Street), Northern (1923–1975, later St. Clement's), Gerrard (1924, now Gerrard/Ashdale), Downtown (1927–1965), and Danforth (1929, now Pape/Danforth). Association libraries also are organized at Birch Cliff (1920), New Toronto (1921), Scarboro Bluffs (1922) Long Branch (1923) and Humber Bay (1925). Image: Danforth (now Pape/Danforth) Branch rendering, approximately 1928 1922 Boys and Girls House opens on St. George Street. It is the first library devoted exclusively to children in the British Empire. Learn about its history. Image: Boys and Girls House, 1922 1923 Canadian Catalogue of Books is started, an annual list of "books published in Canada about Canada, as well as those written by Canadians." Toronto Public Library continues to prepare and publish this forerunner of Canada's official national bibliography for 28 annual installments. The National Library of Canada takes over the project in 1951, renaming the bibliography, Canadiana. The association library at New Toronto transfers its assets to the newly-created free public library board, which opens a new building in 1928. Image: Canadian Catalogue of Books, 1923 1927 Chief Librarian George H. Locke is the first Canadian to be president of the American Library Association, 1926–1927. During his presidency, the American Library Association held its annual meeting in Toronto, June 1927. See also: Toronto Public Library's services for immigrants, 1908–1937. Image: George H. Locke (1870–1937), Chief Librarian 1908–1937 1928 City of Toronto grants $400,000 to retrofit the Central Library and also purchases a house at 236 College Street. The building is used for a staff clubhouse, cafeteria and restrooms until 1964 when it is demolished. A free public library is organized in York Township School Section 28, Mount Dennis. Image: Painting of Staff House by E. Kilgour, approximately 1950s 1930s A public library association is organized in Oakwood (1933), which never operates, and association libraries close at Don, Islington, Long Branch, Runnymede and Scarborough Bluffs, followed by Birch Cliff in 1944. 1930 Toronto Public Library extends service to Thistletown Hospital for Sick Children, the start of its extension work to hospitals, long-term care homes and other institutions. Runnymede Branch opens. (See an early rendering.) Central Circulating Library is added to the Central Library on College Street. Image: Sunnybrook Hospital Reading Room, 1948 1931 Edith Mary Davidson is appointed the first woman chair of the Toronto Public Library Board, a position she also holds in 1936 and 1942. Image: Edith Mary Davidson and the TPL Board 1939 Military Camp Library is established at Exhibition Place for the troops in training there. Image: Military Camp Library, 1939 1943 An association public library is organized in Leaside, and opens a library in rented quarters at 645 (now 1645) Bayview Avenue. The Leaside Public Library Board, formed in 1944, opens a library at 165 McRae Drive in 1950. Image: First Leaside Public Library, 645 Bayview Avenue, 1945 1944 A children's library opens in R. H. McGregor School, East York on November 7, 1944. The Township of East York Public Library Board is established in 1946, opening a library at the northeast corner of Coxwell and Mortimer avenues in 1950. Image: Charles R. Sanderson, Chief Librarian, at the opening of East York children's library, 1945 1945 Township of York Public Library Board is formed, taking over the assets of the Mount Dennis Library, which operated a small branch in rented quarters above a store. On September 9, 1946, a second branch is opened in rented quarters at the corner of Oakwood Avenue and Vaughan Road. In February 1948, it inaugurates the first bookmobile service in Toronto area. A Main Library on Eglinton West at Northcliffe, and two new branches, Jane Street and Mount Dennis, open in 1951. 1946 Long Branch Public Library Board holds its first meeting on January 22. In 1955, it opens its own library building on Lake Shore Boulevard. Image: Long Branch Library opening, June 8, 1955 1949 The Osborne Collection of Early Children's Books is presented to the Toronto Public Library Board by Edgar Osborne; the collection spans English children's literature from the 15th century to 1910. George H. Locke Memorial Branch opens, Toronto Public Library's first new branch since the Depression and the Second World War. It is named for Toronto Public Library's chief librarian, 1908–1937. Image: Edgar Osborne and the Osborne Collection of Early Children's Books 1950s Two new branch buildings open in Toronto: Deer Park (1952) and Parliament Street (1955). Image: Deer Park Branch, 1952 1950 Township of Etobicoke Public Library Board is established. During the 1950s, when Etobicoke's population tripled, branch libraries are opened at Humber Bay (1951), Brentwood (1955) Alderwood (1958) and Rexdale (1959), while a bookmobile serves many neighbourhoods. North York Public Library opens on the ground floor of the new North York Memorial Community Hall, Yonge Street, south of Park Home Avenue. By 1997 it has grown into a system of 19 library locations, providing a tiered model of service with a central library, and regional and satellite branches. Image: Etobicoke Public Library bookmobile, about 1953 1954 Forest Hill Public Library Board is established, with assets transferred from an earlier association library. A new library opens in the village's municipal building built in 1962. Image: Construction of new Forest Hill Village Library and Municipal Building, 1962 1955 Scarborough Public Library Board is established, bringing together the Agincourt, Highland Creek and Scarboro library associations, and opening the Golden Mile Branch in 1956. By 1997, it has developed into a system of 19 libraries including neighbourhood and community branches, and three district libraries. Image: Scarborough P'''
