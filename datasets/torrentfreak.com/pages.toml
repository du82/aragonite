["https://torrentfreak.com/new-york-times-selectively-cracks-down-on-copyright-infringing-trump-meme-200602"]
title = "New York Times Selectively Cracks Down on 'Copyright Infringing' Trump Meme * TorrentFreak"
description = "Twitter has removed a Trump meme following a takedown request from the New Tork Times, which appears to be politically motivated in part."
full_description = "Home > Anti-Piracy > DMCA > Twitter has removed a Trump meme posted by the US President himself. The social media platform took action after the New York Times sent a copyright complaint. The news organization owns the related copyright and can have the tweet removed. However, it doesn't appear interested in going after others sharing the same meme. Last year, millions of people feared that the new EU Copyright Directive would ‘kill’ memes. While the first signs of a massive meme-massacre have yet to appear, captioned photos are not above the law. President Trump can attest to that. Yesterday, he posted a meme featuring a photo of himself with the text: “In reality they’re not after me. They’re after you. I’m just in the way.” Needless to say, this tweet was either loved or hated, depending on personal conviction. That by itself is nothing new. However, Trump’s post also triggered a response from the New York Times (NYT) because the newspaper hadn’t approved the photo for use in this context. The photo, taken by Damon Winter, originates from a NYT feature that was published in 2015. After the article came out, however, the same photo was memeified and published numerous times all over the Internet. You can even buy a t-shirt featuring the meme on Amazon. The removed image These memes have never triggered a copyright complaint from the newspaper, as far as we know. But when Trump posted it to Twitter the company was quick to respond, as spotted by Axios. The complaint is documented by the Lumen Database, which has a copy of the takedown notice. While the NYT certainly has the right to protect its content, the action appears to be more than just a basic copyright issue. The newspaper’s takedown request only targets Trump’s tweet and leaves all other copies of the same image untouched. It doesn’t take much effort to find the exact same meme or anti-Trump memes featuring the same image on Twitter. However, these all remain freely accessible. Further research reveals that NYT sent only one other takedown notice to Twitter this year. That was for a video that was allegedly copied from the news site. Counter-meme The NYT confirmed to TorrentFreak that the company is indeed behind the takedown request. We also asked why no action was taken against the same image posted by other accounts, but that question remains unanswered (see update below). The newspaper has been very critical of Trump so that may play a role here as well. Or simply the fact that his tweets have so much exposure compared to others. Whether that is right or wrong is up for debate. The New York Times has the law on its side, but the selective use of a DMCA takedown is worth highlighting. This is also true for another special ‘Trump-treatment’ when it comes to copyright infringement. Twitter usually suspends accounts of repeat copyright infringers, but that’s not the case with Trump. The US President has had over a dozen of his tweets flagged for copyright infringement but his account remains intact. Others have not been so lucky. This preferential treatment also expands to other alleged policy violations. Twitter grants Trump more leeway than the average Twitter user. This is in part because it has a special stance toward ‘world leaders.’ While Twitter has removed the original meme from Trump’s tweet, a copy remains available on the Internet Archive. On Twitter, people can still see the meme and counter-memes as well, just not from the President directly. In fact, as we’ve seen in the past with takedown requests, people are now sharing the meme even more following its removal, which is exemplary of the Streisand Effect. Update: We received an additional comment form the newspaper, clarifying that they are looking into other meme postings as well. “We only recently became aware of the fact that this meme has been circulating. We are looking at the other social media accounts that are using it to determine whether they, too, are in violation of copyright laws. That requires a case-by-case fair use analysis, which is ongoing,” Eileen Murphy, a NYT spokesperson tells TorrentFreak. — Although it appears that Trump is the intended target, The President is only in the way of the Left's plan to destroy America and The American Dream forever. pic.twitter.com/hLDk1X5Dxm — Anna Bacon ⚖️ (@AnnaBD20) June 7, 2020 pic.twitter.com/yN85Tn5EWg — Trumpy Trumpy (parody) (@outofcontroljb) June 30, 2020 pic.twitter.com/938WSaHWli — Dolan Dark (@DolanDark) June 30, 2020 — Please keep the discussion limited to the issue at hand."
