["https://totalspaces.binaryage.com/faq2"]
title = "TotalSpaces2 Questions"
full_description = "TotalSpaces2 is tested on OSX Mavericks 10.9 and OSX Yosemite 10.10 and should work on any mac that can run these operating systems. We also try to add support for new versions as soon as the betas are available. TotalSpaces2 runs without an icon in the Dock, but instead an icon like this should appear in your menu bar. There is an option to hide the menu bar icon, and perhaps this is turned on for some reason. In order to re-show the menu bar icon, double click on TotalSpaces2 in your Applications folder (as if to launch the app). This should tell the app to show the menu bar icon again. The dashboard can be removed from your grid by unchecking “Show dashboard as a space” in Mission Control preferences, or setting Dashboard to “Off” (in Yosemite). TotalSpaces2 is a normal app that can be dragged to the Trash, except for one additional file that must be removed from /Library/ScriptingAdditions. The uninstaller will remove this file along with the app itself, as well as restarting Dock so that no trace of TotalSpaces2 remains running in the system. Note: TotalSpaces2 is built on top of Mission Control. Underneath TotalSpaces2, the desktops are normal OSX desktops. The uninstaller will not remove any desktops you have created whilst running TotalSpaces2, you must adjust your desktops how you like them in Mission Control once you have uninstalled TotalSpaces2. TotalSpaces does not make any changes whatsoever to the system software or to OSX - once you have uninstalled it the system will be running only the original OSX software. Final note: If you wish to be super-clean you can also remove the preferences files in ~/Library/Preferences/com.binaryage.TotalSpaces2.plist and ~/Library/Preferences/com.binaryage.totalspacescrashwatcher.plist As we have rewritten the system transitions for TotalSpaces2, it may be that we can support diagonal transitions for some of the animations in the future. The normal preferences slider goes to 110, but 130 is the hard limit; do not set it higher - anyway you won’t even see the transitions at that speed."
