["https://totalspaces.binaryage.com/differences2"]
title = "Differences from TotalSpaces"
full_description = "TotalSpaces2 is a substantial rewrite of TotalSpaces. It focuses on the grid, and the most important idea is that all spaces participate in the grid, whether regular desktops, fullscreens, or the dashboard. There is support for both multi-monitor modes provided by OSX Mavericks (Mission Control’s “Displays have separate Spaces” setting), and a more active overview grid that allows you to move your spaces to where you want them. The space transitions have also been rewritten, and there is a new preferences pane for the layout allowing you to easily choose the grid you want. Here is a brief list of changes so you can review whether TotalSpaces2 will do everything you need. Please download and test TotalSpaces2 before you pay for the upgrade."
