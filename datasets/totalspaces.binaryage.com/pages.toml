["https://totalspaces.binaryage.com/installing-mojave"]
title = "Installing TotalSpaces2 v2.7.2 and above"
full_description = "These instructions apply to TotalSpaces2 v.2.7.2 and above on macOS 10.14 and above. If you are upgrading from High Sierra to a more recent version, note that TotalSpaces2 can no longer work with SIP turned on due to changes made by Apple. These instructions are for macOS Big Sur, Catalina or Mojave - see here if you are running High Sierra or earlier. TotalSpaces2 requires changes to your security settings to be installed. Carefully read more about it here. In the window that opens, type csrutil disable and press return. This turns off System Integrity Protection so that TotalSpaces2 can be installed. Note: Advanced users who want to only partially disable SIP may use the command csrutil enable --without debug --without fs However, csrutil will warn that this configuration is unsupported. Double click on the DMG file you downloaded with TotalSpace2 in it. Drag TotalSpaces2 into your Applications folder. Run TotalSpaces2 from your Applications folder. It will ask for your password in order to install its plugin component. If you are installing on macOS 10.14 Mojave or later then unfortunately SIP must remain disabled or partially disabled for TotalSpaces2 to work. Note that if you are installing on versions of macOS prior to 10.14 Mojave then there is an optional step 3 to turn SIP back on, see here."
