full_description = "This allows you to evaluate TotalSpaces2’s functionality and decide whether you want to buy it or not. When you buy a TotalSpaces2 license you get my permission to use the software. Here is the legal code. Please visit the store where you can purchase TotalSpaces2. It is easy and safe (powered by FastSpring). When you buy a license you may freely update to all TotalSpaces2 versions within one major OS release. For example by buying TotalSpaces2 today you will get free updates for all versions compatible with Mavericks (OS X 10.9). A new major OS release (after OS X Mavericks) may require substantial rewrites and intensive testing. I may charge existing users an upgrade fee for a new OS. TotalSpaces2 does not connect to or communicate over the network. It works perfectly on a computer disconnected from the internet. We have tested TotalSpaces2 with our systems and we did our best to make it bug-free and stable. However it may still contain undiscovered bugs or issues."
