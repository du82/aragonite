["https://totalspaces.binaryage.com/defaults-settings2"]
title = "TotalSpaces2 Defaults settings"
full_description = "This is a list of the user accessible defaults settings that you can adjust using the ‘defaults’ command line program in Terminal.app. The normal preferences slider goes to 110, but 130 is the hard limit; do not set it higher - anyway you won’t even see the transitions at that speed. Note that there is a small built in delay after you press the hotkey that is unavoidable with transitions - they take a little time to set up. The notification graphic remains on the screen for this period, unless the transition was triggered by hotkeys in which case it stays on screen for as long as you hold the modifier keys down. These adjust the dwell and repeat period for triggering space changes by bringing your mouse to the edge of the screen. The range is 0.1 - 20.0, the default is 1.1 seconds. This setting also affects how quickly you can drag windows from desktop to desktop. Normally windows stay where you drop them in the overview grid, but pressing the ALT (option) key whilst dragging will cause the windows to retain their original position, so will be positioned as they were in the space the window came from. You can swap this behaviour so that keeping the position is the default, and pressing the ALT key will allow the to be dropped in an exact position. If you are using key combinations such as ALT with the arrow keys to change space, it can be useful to differentiate between the keys on each side of the keyboard so that the left side ones can be used for the usual functions, and the right side ones for changing space. Turning this setting on means TotalSpaces2 will only recognise space change hotkeys if the modifier keys on the right side of the keyboard are used. In some isolated cases we found that the caching that makes the overview grid faster to bring up was causing Mail.app to slow down unacceptably. In order to work around the problem in these cases, there is a command line setting to turn off this caching. It is not recommended unless you have this problem, it will slow down the performance of the overview grid."
year_published = 2025
