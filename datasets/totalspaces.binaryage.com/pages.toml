["https://totalspaces.binaryage.com/multi-monitors2"]
title = "Multi-monitors"
full_description = "In OSX Mavericks, there are two different modes, selected by “Displays have separate Spaces” in Mission Control preferenes. When “Displays have separate Spaces” is checked, each display will have its own grid of spaces, and they operate independently. You can set up each grid separately in Layout preferences by selecting the display. When you activate the overview grid, each monitor will display its own grid. You can then easily drag windows between your spaces, and between monitors. You navigate between spaces using your usual hotkeys, but which display the mouse cursor is on will determine which display’s grid changes space. If you uncheck “Displays have separate Spaces” in Mission Control preferences, the grid and your spaces will behave the same as on OSX Mountain Lion and before. All displays share the same grid, and navigation happens simultaneously. Because the monitor screens are shown together on your main display, you can easily drag windows between each of your monitors."
year_published = 2025
