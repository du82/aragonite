["https://totalspaces.binaryage.com/documentation2"]
title = "TotalSpaces2 Documentation"
full_description = "TotalSpaces2 was discontinued and is no longer offered for sale. Please read our blog post with announcement here. An easy to use 2D grid of desktops. Navigate using the cursor keys (by default together with SHIFT-ALT), choose your transitions, and quickly access a birds eye view of your grid of spaces where you can manage your application windows. You can even give your spaces names. Having a grid of spaces allows you to keep a mental picture of where each of your applications is, and to navigate easily and quickly between them. From there, you can control TotalSpaces2, and access the preferences where you can set up your grid, name your spaces, and configure your desktops just how you like them. TotalSpaces2 allows you to easily navigate between your spaces, by swiping, with hotkeys, or by just moving your mouse the the edge of the screen in the direction you wish to move."
