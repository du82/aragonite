["https://townandcountrytoday.com/barrhead-news/barrhead-renegades-finish-regular-season-undefeated-10244644"]
title = "Barrhead U18 has perfect regular season goes undefeated - Athabasca, Barrhead & Westlock News"
description = "Barrhead heads into the North Eastern Alberta Hockey League playoffs with a perfect 17-0 record"
full_description = '''BARRHEAD - The Barrhead U18 finished a perfect regular season by winning their last two games in convincing fashion in front of their home fans, 7-0 against the Plamondon Cougars on Valentine's Day and 5-1 against their Highway 33 rivals, the Westlock Warriors 5-1 two days later to go 19-0. "We've been on quite a roll here," head coach JC Lane said following the Plamondon Cougards game, adding none of the games have been particularly close. On multiple occasions in the season's early going, the Renegades defeated their opponents by over a dozen goals. To help rebalance and create more competition between the teams, the North Eastern Alberta Hockey League (NEAHL) promoted Barrhead to the higher level Tier 3 from Tier 3B early in the New Year. And while Barrhead did not hit double-digit differentials quite as often, the Renegades continued their undefeated streak, dominating their opponents, including three shutouts and five games where the goal differential was eight or more in their final eight games of the season. "They're a good group of boys," he said. "They've really come together as a group, and obviously, they've played well the entire season, and hopefully, it is something we will be able to continue into the playoffs." Lane added Barrhead would likely receive the first-round bye, saying they were still in the hunt for first place in the Tier 3 North Division. At the end of the regular season, as of the press deadline, the Barrhead Renegades stood in second place in the division with one less win than the leaders, the Plamondon Cougars, with one less win, whose record was 9 wins, 4 losses and 1 tie. But the standings are complicated because nine of the Renegades' wins were removed from the regular season standings as they came before the team was re-tiered. In the two games Barrhead played against Plamondon, they won decisively, 11-3 and 7-0.'''
year_published = 2025
year_updated = 2025
