["https://townandcountrytoday.com/barrhead-news/barrhead-composite-senior-boys-basketball-gryphons-prepare-for-run-to-provincials-10163208"]
title = "Barrhead basketball high school team making big strides - Athabasca, Barrhead & Westlock News"
description = "Northern rural high school basketball team preparing for run to qualify for provincial championships"
full_description = '''Last week, on Jan 27, the Gryphons defeated the Athabasca Predators 68-52. The game was up for grabs, going back and forth until about halfway through the fourth quarter when Barrhead pulled ahead for good. "We are a young team," Thijs de Wildt said in an e-mail interview following the game. "The youngest we've coached." This year, the senior Gryphons have six returning veterans, all in Grade 12 and seven rookies. de Wildt co-coaches the Gryphons with Thomas Koekkoek, who are both Gryphons aluminus. de Wildt added that the Gryphons will need them to continue to improve and play big minutes as Barrhead approaches the meat of its schedule, with three successive tournaments starting in February. de Wildt also said he and Thomas are particularly impressed with the intangibles this group of players brings to the team. "They are very coachable and show up every practice and game to work hard and improv," he said. "It's really fun to be part of this group; everyone gets along, and there is great team spirit, which in previous years has lacked. We are very impressed with every individual on this team, and we're ready to give it everything we've got to, hopefully, make it to Provincials in mid-March."'''
