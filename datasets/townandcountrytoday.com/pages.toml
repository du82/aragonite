["https://townandcountrytoday.com/athabasca-news/the-long-road-to-athabasca-6198563"]
title = "The long road to Athabasca - Athabasca, Barrhead & Westlock News"
description = "Scott Cook performs at the NAT Wednesday"
full_description = '''ATHABASCA — Musician Scott Cook took a more non-traditional route to become a folk musician — he started off teaching in Taiwan. Never really feeling it was his calling, he came back to Canada and has since released six albums, plus his first which was recorded in Taiwan, and a single. Then to make it more interesting he started including his writing – 240 pages of art, photos and musings with his 2020 album Tangle of Souls. “I loved (teaching); I never felt like it was my calling really. It was great, it was a great job. It's great to be around kids, they've got so much energy and imagination. It's just cool hanging out with them,” Cook said in a Nov. 25 interview. “But music, I would come back to Canada in the summertime and do little tours ... and I had the thought that if I didn't give music a go, if I didn't really try to do it full time, I would probably wonder when I was older.” He released his first album, Long Way to Wander in 2007, which he recorded in Taiwan. The title track is almost nine captivating minutes of Cook weaving his memories with his music. “Along the way, I feel like there's always been enough to keep me interested and it's gotten really quite wonderful in the last few years,” he said. "I've been able to travel where I want and I have been able to make a living and being able to bring other musicians along at times and all that, so it feels like success to me, even if it's under the radar.” When the pandemic hit, Cook drove back to Canada from Texas to the house he had just bought after living mostly off the grid for over a decade. “I had just moved into a house,” he said. “I was living in a minivan or backpack for 13 years, but I had just moved into a house with my sweetheart Pamela Mae, right before the pandemic hit, like a month before. That was really fortunate timing, I had a place to flee back to and a place to be.” Like everyone else, he thought it would be a few days, maybe a few weeks at most, then his tour dates started melting off the list.'''
year_published = 2022
year_updated = 2022
