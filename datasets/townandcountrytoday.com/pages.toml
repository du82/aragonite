["https://townandcountrytoday.com/athabasca-news/have-you-ever-wondered-whats-in-your-bread-10276735"]
title = "Alberta farmer boasts benefits of fresh whole grain flour - Athabasca, Barrhead & Westlock News"
description = "One northern Alberta grain farmer is selling his wheat locally to help others avoid low nutrient and outsourced products amidst threats of a tarriff, trade war"
full_description = "ATHABASCA — As Albertans prepare to see rising costs for U.S. goods on grocery store shelves, shoppers are looking for ways to identify Canadian-made goods to keep their dollars in-country. But before talk of tariffs and trade war started making daily headlines, a group of researchers and innovators in Athabasca began conversations around how to create and strengthen local food economies under the title Athabasca Grown. And one local farmer is making the ideals of buying from one’s backyard and keeping cash within the community his bread and butter with a new business: selling whole wheat berries and equipment to make freshly ground flour. “My daughter’s actually been doing it for a couple years,” said Otto Rottier, originator of Life Bread Wellness. “She’s been home baking and selling some baking goods and selling some flour. “I realized how easy it was and then started reading up on how good it is for you, and I said ‘I have to make this available to the public and not just keep it to ourselves,’” he added. “I’ve grown wheat for probably thirty years but never actually tried to eat it myself.” Previously from Westlock, Rottier and his wife now live and produce grain in the Athabasca area. After trying his hand at a few loaves in late fall — and learning lessons along the way — Rottier was ready to hit the ground running, and started selling pails of wheat berries, or unprocessed hard red wheat and grain grinders as an alternative to store bought flour. “The narrative out there is that wheat is bad, and there’s a whole lot of people with gluten intolerant issues and it does appear to be from the wheat, but if you look at it further, it’s not actually the wheat, it’s what’s done to the flour.” White flour originates from wheat berries, but during the grinding process much of the wheat bran and germ, which contain large amounts of vitamins, minerals and fibre, are removed. A portion of the bran and germ are added afterwards to reconstitute the flour, but studies have shown reduced nutritional value of refined flour compared to whole grain flour."
