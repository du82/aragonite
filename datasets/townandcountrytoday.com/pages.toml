["https://townandcountrytoday.com/alberta-news/gretzky-super-fan-memorabilia-market-undeterred-by-outrage-over-trump-connection-10306197"]
title = "Gretzky super fan, memorabilia market undeterred by outrage over Trump connection - Athabasca, Barrhead & Westlock News"
description = "EDMONTON — Hockey legend Wayne Gretzky might be in the penalty box in the minds of many Canadians right now, but one Alberta-based superfan says his admiration for the Great One remains intact."
full_description = '''EDMONTON — Hockey legend Wayne Gretzky might be in the penalty box in the minds of many Canadians right now, but one Alberta-based superfan says his admiration for the Great One remains intact. "Wayne is still Wayne," said Shawn Chaulk in an interview Friday. "He's an icon (and) people should continue to see him as such. Who cares what his political beliefs are? Chaulk lives in Fort McMurray and owns a massive collection of Gretzky game-used sticks and jerseys, rookie cards and photographs. He even sports a tattoo of the NHL’s all-time points, assists and goals leader. Gretzky has drawn the ire of hockey fans and non-hockey fans alike for his public support of U.S. President Donald Trump, who has dismissed Canada as a thankless, self-interested dependency that deserves to be its 51st state. Trump is also threatening to punish Canada with steep tariffs starting next week, saying Canada enjoys an unfair trade advantage and is not doing enough to stop cross-border drug traffic. In Edmonton, the site of Gretzky’s hockey glory days, one resident has started a petition to rename the Wayne Gretzky Drive freeway. As of Friday, the petition has garnered more than 11,000 signatures. She acknowledged Gretzky might be hitting a post or two in his post-hockey years, especially by not wearing a Team Canada jersey when he recently served as honorary captain for Canada at the recent 4 Nations Face-Off. "The social media sphere can get a little bit mean, but I don't think it detracts from his legacy at all." Gretzky’s ties to Alberta and Edmonton are deep. In the 1980s, he led the Edmonton Oilers to four of their five Stanley Cups before being sent to the Los Angeles Kings in a trade that shocked the hockey world. He and his wife, Janet, were married in Edmonton, and there is a life-size statue of Gretzky hoisting the Cup outside the Oilers’ downtown arena. Gretzky attended an election victory party for Trump in November and was seen sporting a Make America Great Again hat. He and his wife also attended Trump's inauguration in January.'''
