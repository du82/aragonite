["https://townandcountrytoday.com/athabasca-news/too-cold-for-crime-in-boyle-in-late-2024-rcmp-10270667"]
title = "'Too cold for crime' in Boyle in late 2024: RCMP - Athabasca, Barrhead & Westlock News"
description = "Boyle RCMP say Q3 statistics on par with expectations"
full_description = "BOYLE — Crime trends including property offences stayed on par for the Boyle area for the last months of 2024, according to Boyle RCMP, thanks in part to cold winter weather. “It’s too cold for crime,” said Boyle Coun. Pat Ferguson during the village’s Feb. 19 regular council meeting when elected officials reviewed Q3 stats from the local detachment. “When the RCMP says freeze, they do.” While Ferguson’s jokes garnered laughs and eye-rolls from his counterparts, Boyle RCMP detachment commander Sgt. Dennis Properzi said cold temperatures do play a part in both criminal and police activity. “Generally, it does slow down for us a bit, obviously on the traffic side things slow down a lot more, people are cautious going out in the extreme weather elements,” said Properzi. “We are generally trying to be a bit safer, with the extreme conditions on the highways we’re trying to not become a hazard ourselves out there.” Between October and December 2024, Boyle RCMP recorded 124 total provincial traffic files, down from 174 in 2023 and a five-year high of 456 in 2022. Properzi said he typically advises against unnecessary travel in -30 or -40 C weather, and if unavoidable, recommends drivers be prepared for the unexpected; poor road conditions, mechanical issues, and long wait times for help. “We try to also be cognizant that we’re also not immune to the extreme weather, so if we’re gonna be going to a very remote area on some of the calls for service, we try to triage that we’re doing it in a safe manner, we don’t want to be breaking down and not having a tow truck available.” Another factor in the reduced traffic files is staffing at the Boyle detachment. Properzi is currently short three officers, with two hard vacancies, including a Corporal position after officer Gavin Bergey was promoted to Sergeant and transferred to Athabasca, and one soft vacancy due to paternity leave. “Members are young in this detachment, and now they’re starting young families,” said Properzi. “It’s encouraging and stressful for us to go through some shortages, but we also know what kind of a stressful situation it is being a new parent.”"
year_published = 2025
year_updated = 2025
