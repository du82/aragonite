["https://townandcountrytoday.com/athabasca-news/athabasca-county-investigating-cost-recovery-for-fires-10256704"]
title = "Athabasca County investigating cost recovery for fires - Athabasca, Barrhead & Westlock News"
description = "Councillors debate what role taxpayer money has after the worst has happened"
full_description = "ATHABASCA – How much should Athabasca County residents have to pay for the men, women, and equipment that fight to save their homes when a fire breaks out? Athabasca County councillors tackled the question during their first discussion about a new fire cost recovery policy, presented by manager of protective services Travis Shalapay during the Feb. 18 committee of the whole meeting. Shalapay’s team investigated what other municipalities were doing across the province, but after finding a variety of cases, ranging from total cost recovery to subsidized models, they turned to council for guidance. “Does council wish to pursue a more robust cost recovery, where we try to fully recover the cost of providing service? Do we want to pursue more of a partial recovery where we have different options?” asked Shalapay. Councillors were in favour of a variety of options, ranging from a highly subsidized model for people lacking fire insurance, to a more aggressive cost recovery plan that would reduce the burden on taxpayers. “There are not many tangible things we provide to rate payers on a given day; they care about water, they care about roads, and you can add in there that they care that their house doesn’t burn to the ground,” said Coun. Gary Cromwell. ‘When it does, and they’re having the worst day of their life, they (shouldn’t) get hit with a multi-thousand dollar bill. There should be a partial cost recovery differentiating between insured and uninsured.” Cromwell said he would like to see a capped fee at no more than $5,000 for insured residents and $2,500 for the uninsured — no data was provided for how much the average recovery bill is — something other councillors disagreed with. “That incentivizes people not to insure their property adequately, and I think we have a responsibility to ensure that we have adequate insurance on our properties,” said Coun. Ashtin Anderson. Anderson recognized sometimes things happen, like an unnoticed change in policy from a company, but stressed residents should be responsible for costs, lest the taxpayer have to pick up the tab."
