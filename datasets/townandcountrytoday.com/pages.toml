["https://townandcountrytoday.com/barrhead-news/barrhead-council-approves-feasibility-study-for-recognized-chain-hotel-10291485"]
title = "Barrhead councillors OK hotel feasibility study - Athabasca, Barrhead & Westlock News"
description = "Majority of northern Alberta rural council councillors state the need for a recognizable, branded hotel"
full_description = '''To see if it is actually feasible for the community to attract and support such a business, councillors, during their Feb. 25 meeting, voted 5-1 to authorize the municipality to proceed with a hotel feasibility study. Chief administrative officer Collin Steffes said the municipality has been in discussions with the Edmonton-based development company McCammon Realty Advisors about the "potential non-residential composition" of a roughly six-acre parcel of land north of DeHerdt Gardens on the west side of the community adjacent to 53rd Avenue or Grizzly Trail. "More importantly, long-term, what types of uses is the town interested in?" he said, adding that one of the potential uses discussed with the developer was the need for a recognized chain hotel and more hospitality facilities. The municipality tentatively sold the property, now nicknamed Chrissy's Crossing, to McCammon Realty Advisors in late July 2023. The sale has yet to be finalized, with the developer asking for and receiving multiple extensions to give them time to do their due diligence. The latest deadline to finalize the purchase is April 15, 2025. Related link: https://www.townandcountrytoday.com/preview/d4f3964c-80f4-ef11-90cb-00224822c5a4?tagId=210017 The developer asked if the municipality would front the study cost as they have many other expenses to ensure the property fits their needs. Steffes agreed to bring it to council for its consideration, as the study cost was relatively low and the information it would provide was universal. "It could be used for [Chrissy's Crossing], or other sites, for not only the developer but others contemplating the viability of a [hotel affiliated with a recognizable hotel chain] in the area, so it is suitable information for the municipality to have," he said. The first stage, he said, would include a site evaluation and market analysis, as well as primary and secondary research. "If, at that point, [council] feels that pursuing a hotel chain is no longer viable, we could stop there," Steffes said, adding the first phase of the study would cost the municipality $1,500. "If [the study] is favourable, we could then proceed with the second phase, which would include such things as market share [how the hotel would compete in terms of occupancy and daily room rate performance] and statement of projected revenue and expenses."'''
year_published = 2025
year_updated = 2025
