["https://townandcountrytoday.com/athabasca-news/just-plant-some-damn-trees-county-councillors-have-policy-dust-up-10224493"]
title = "Rural Alberta county struggling with dust control policy - Athabasca, Barrhead & Westlock News"
description = "Athabasca County's gravel roads and campgrounds continue to cause councillors concern with residents complaining about dust, and businesses the bill"
full_description = "ATHABASCA – Athabasca County councillors are continuing to tinker with the dust control policy for the third year in a row, with changes being proposed to the amount of coverage residents can pay for, and possible obligations placed on commercial entities. During the Feb. 11 regular council meeting, councillors narrowly approved a motion to revise the policy to include options to purchase additional treatment at cost, with councillors Gary Cromwell, Brian Hall, Natasha Kapitaniuk, Camille Wallach, and Ashtin Anderson voting in favour. Reeve Tracy Holland and councillors Rob Minns, Kelly Chamzuk, and Joe Gerlach were opposed. While the actual changes are mostly procedural — councillors highlighted wording in the policy they wanted added or removed — the discussion focused around the potential cost to the county, as well as the need for extra dust control in general. “Two-hundred metres isn’t enough for a lot of people. They live on straight stretches of road with a lot of traffic and that 200 metres doesn’t cover their yard, so their houses are still getting dusty,” said Wallach. The topic came back to council after an early November delegation brought the often-discussed and frequently-changed policy back onto the agenda. The four councillors, including Minns, who were opposed to the changes cited fears over rapidly expanding costs, and a lack of need as reasons why they wanted it to remain in place. “We spend a lot of money on dust control through the county and it just gets astronomical the amount of subsidizing that we do,” said Minns, who has been a staunch opponent for expanding the program over the past year. “We made a dust control policy and we’ve only run it for a year before we’re already changing it. We just need to let it run as is for a little while.” Before entering politics, Minns worked at the Athabasca County public works department, finishing his career there as the maintenance foreman. He told his fellow councillors that the extra 200 metres of coverage available for purchase wasn’t as small a task as it seemed."
year_published = 2025
year_updated = 2025
