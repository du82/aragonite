["https://townandcountrytoday.com/alberta-news/young-guns-brier-rookies-mooibroek-and-purcell-open-with-victories-10308668"]
title = "Young Guns: Brier rookies Mooibroek and Purcell open with victories - Athabasca, Barrhead & Westlock News"
description = "KELOWNA, B.C. — When Ontario's Sam Mooibroek was warming up ahead of his Montana's Brier debut on Saturday, Canadian curling heavyweights could be spotted at every turn."
full_description = '''Ontario skip Sam Mooibroek celebrates after scoring five against Quebec in the second end during the Montana's Brier in Kelowna, B.C., on Saturday, March 1, 2025. THE CANADIAN PRESS/Darryl Dyck KELOWNA, B.C. — When Ontario's Sam Mooibroek was warming up ahead of his Montana's Brier debut on Saturday, Canadian curling heavyweights could be spotted at every turn. Olympic champions Ben Hebert, Marc Kennedy and Brad Jacobs were by the sheet beside him. Three-time world champion Brent Laing was on the far coach's bench. Former national champions Brett Gallant and Colton Flasch were also nearby. Mooibroek has played many of the sport's top teams during his ascent into the top 25 in the world rankings. But the Brier stage is different and some early jitters could be expected. Instead the 25-year-old played like a seasoned veteran, scoring five points in the second end en route to an 11-4 rout of Quebec's Jean-Michel Menard. Youth was served in the second draw of the 10-day competition. Mooibroek was joined by Brier freshmen Owen Purcell of Nova Scotia and Rylan Kleiter of Saskatchewan in afternoon play at Prospera Place, all part of a rookie-heavy Pool B. Purcell flashed a stone in the fourth end but rebounded with a runback for three in the fifth against Kleiter in a 7-2 win. "We've had the chance to really build some confidence and say, 'You know what? We belong here,' said Purcell. "So I think that confidence definitely helped us to begin our first draw." The three young skips — all in their mid-20s — came up together at the junior level and now lead a new generation of Canadian curling talent that has arrived at the nationals. "We desperately need these teams," said Ontario coach Jake Higgs. "Old guys like me and just slightly younger than me, they're going to be gone (from the sport soon). We need this new influx of young talent … I expect big things out of all those teams this week." The other rookie skip in the nine-team pool is Aaron Bartling of the Northwest Territories, who was scheduled to play his first game against Mooibroek on Sunday morning.'''
year_published = 2025
year_updated = 2025
