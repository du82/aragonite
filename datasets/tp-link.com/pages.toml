["https://tp-link.com/ca/about-us/career"]
title = "Careers at TP-Link"
description = "TP-Link is always on the lookout for passionate individuals, who are enthusiastic about their work and willing to progress the career within the company. We are a global company that values diversity and thrives on entrepreneurial values. TP-LINK offers great working environment, competitive salary, paid vacations, sick leave, overtime pay, and company bonus. Send us your CV if you feel you have the qualifications to meet the challenge of joining the world's #1 market share Wireless LAN Company."
full_description = "JOIN OUR TALENT POOL! TP-Link Canada is always on the lookout for passionate individuals, who are enthusiastic about their work and willing to progress the career within the company. We are a global company that values diversity and thrives on entrepreneurial values. We provide opportunities for personal and professional development in a challenging and fulfilling work environment. If that describes you, we’d love to hear from you! If you are interested in employment with TP-Link Canada but didn't see a position that fits your skill set at this time, feel free to submit your application and should something become available we will contact you. Areas of Expertise Sales & Marketing Warehouse & Distribution Customer Support (English & French) Computer Network Engineer Intern Application Procedures To apply for a position, please send us a cover letter and resume outlining your job skills, education background and professional experience. We accept applications by email, mail and fax. Please direct your application to: TP-Link Canada Inc. Address: 88 Fulton Way, Richmond Hill, ON, L4B 1J5 Fax: 905-882-9830 Email: hr.ca@tp-link.com While we thank all applicants for their interest, only those who are selected for an interview will be contacted. TP-Link Canada is an equal opportunity employer. We are committed to employment equity and fair and accessible employment practices. Accommodations will be provided for job applicants with disabilities, where needed and on request, to support their participation in all aspects of the recruitment process. All personal data being collected will be treated in strict confidence and used for recruitment purposes only. Role Summary: The Marketing Coordinator will be supporting the execution of all consumer marketing activities for TP-Link Canada. The Marketing Coordinator is responsible for the project management of a wide variety of Retail, E-Tail, Corporate and Amazon marketing programs utilizing market knowledge, creativity and communication skills. Key Areas of Responsibilities Operations & Coordination: Execute key marketing communications strategies that align to corporate business goals and objectives and consistent with branding guidelines. Assist in the development and implementation of marketing plans within budget requirements. Packaging Creation: editing English copy, proofreading, translation and design. Allocate tasks to graphic design resources as needed to produce marketing collateral in accordance with brand messages. Help to ensure all products, services, and other offerings conform to brand identity; conduct ongoing brand management. Training & Education: Develop and maintain training decks for consumer product lines. Collaborate with sales teams to ensure training materials align with product updates and customer needs. Ensure all marketing and communications materials are developed and distributed according to an appropriate timeline. Technical & Software Expertise: Manage social media platforms and community management. Use Creative Cloud tools for design-related tasks. Manage website updates, ensuring accurate product and promotional content. Execute email campaigns using mailing programs like Mailchimp, Klayvio, and Constant Contact. Technical Competencies Creative Cloud (Photoshop, Illustrator, InDesign). Social Media Tools (Hootsuite, Meta Business Suite). Analytics Platforms (Google Analytics). Mailing Programs (Mailchimp, Klayvio, Constant Contact). Proficiency in Microsoft Office Suite Budget Tracking (media spend, monthly invoices, receipts). SEO and website management tools. Key Qualifications 1-2 years of direct work experience in a marketing or communications. Post-secondary education in Marketing, Public Relations, Communications or related field Strong organizational skills to juggle multiple priorities and meet deadlines. Able to work effectively in a fast-paced environment and collaborate with cross-functional teams. Excellent written and verbal communication, with fluency in both English and French. Ability to analyze data and provide actionable insights for campaigns. Experience collaborating with agencies and managing external vendors. Strong attention to detail for proofreading and quality control. Ability to take vague concepts, processes and develop solutions and complete projects. A passion for new technologies and staying up to date with industry trends. Language Bilingual in English + French both written and verbal This position offers valuable hands-on experience in marketing execution and provides an opportunity to contribute to the success of our product launches and marketing initiatives. If you're eager to learn and grow in a dynamic marketing environment, we encourage you to apply. Employment Type: Full-Time, Permanent Application: Email your resume to hr.ca@tp-link.com to apply. TP-Link Canada Inc. is an equal opportunity employer. While we sincerely thank all applicants for their interest, only those who are selected for an interview will be contacted. All personal data being collected will be treated in strict confidence and used for recruitment purposes only."
