["https://tr.designtokens.org/format"]
title = "Design Tokens Format Module"
description = """
This document describes the technical specification for a file format to    exchange design tokens between different tools."""
full_description = '''5.2.1 Description A plain text description explaining the token's purpose can be provided via the optional $description property. Tools MAY use the description in various ways. For example: Style guide generators MAY display the description text alongside a visual preview of the token IDEs MAY display the description as a tooltip for auto-completion (similar to how API docs are displayed) Design tools MAY display the description as a tooltip or alongside tokens wherever they can be selected Translation tools MAY render the description to a source code comment alongside the variable or constant they export. The value of the $description property MUST be a plain JSON string, for example: Example 4 { "Button background": { "$value": "#777777", "$type": "color", "$description": "The background color for buttons in their normal state." } }'''
year_published = 2025
clearnet = "https://tr.designtokens.org/format"
