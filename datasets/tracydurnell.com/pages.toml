full_description = '''Categories Science Fiction Read Collision Course Post author By Tracy Durnell Post date February 27, 2025 2 Comments on Read Collision Course ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) Read Collision Course (Class 5, #6) A step into the unknown . . . Rose is looking forward to meeting the Fisone as part of the United Council’s outreach mission. Since the Tecran were defeated, and the full scope of their crimes were uncovered, the UC has wanted to find the Tecran’s victims and extend the hand of friendship. The fact that Rose is close to having her baby is just another element to the adventure of finding the Fisone’s planet and seeing if they could be potential allies. An explorer’s dream . . . Dav Jallan has been captain of the Barrist for a few years, but this is the first time he’s headed for a planet inhabited by advanced sentients. The Fisone exist—that is indisputable—and every part of this mission is why he became an explorer in the first place. The goal is to find them, form alliances, and make friends. The fact that he’s about to become a new father simply adds to his sense of excitement. A collision course with reality . . . When Sazo’s Class 5 and the Barrist enter the Fisone’s airspace, what they find is far from the uncomplicated meeting they had envisioned. The Fisone are divided, carrying a grudge, and are sure the Grih are no different from the Tecran they encountered the year before. When they take Rose as a hostage, both Dav and Sazo focus everything they have on finding her, and as the Fisone’s actions create more and more danger, ideas of alliances, friendship, and cooperation become less and less important. The only comfort both Dav and Sazo have to draw from is that Rose has been taken by others before, underestimated before, and her abductors have lived to regret it. They are counting on history repeating itself. This is very much the Rose show, with supporting performances from Sazo and Dav. It’s enjoyable and the plot is a comedy of errors, albeit with high stakes. New allies and new enemies, new alien species and new thinking systems. I’d class this as primarily sci-fi, with an existing relationship that doesn’t change much over the course of the book. Best read after Dark Horse, Dark Ambitions, and Dark Deeds. Tags 2025, AI, book, first contact, Kindle Unlimited, Michelle Diener, pregnancy By Tracy Durnell Writer and designer in the Seattle area. Reach me at tracy.durnell@gmail.com or @tracy@notes.tracydurnell.com. She/her. View Archive → ← Listened to Baby by Spank Rock → Read A Few Rules for Predicting the Future 2 replies on “Read Collision Course” Tracy Durnell says: @ tracydurnell.com January 1, 2025 at 3:10 pm Jump to: Books read in 2025 | Did Not Finish | Other Years’ Reading | Currently reading Books Read in 2025 * indicates re-reads. 👍 = enjoyed a lot 👍👍 = loved Presented in reverse order. Links go to my review / notes. {{CODEbookbuttons}} {{CODEfilterbooks}} Read in February Collision Course by Michelle Diener (sci-fi, first… Reply Tracy Durnell says: @ tracydurnell.com February 28, 2025 at 8:24 pm [caption id="attachment_24993" align="alignnone" width="750"] the creek in the ravine behind my house from the back 40[/caption] Neighbors were getting a new roof this week so there was a lot of hammering ten feet from my office (since I’m on the second floor) — deployed the noise cancelling headphones quite a bit 🎧 Highlight of the… Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond 