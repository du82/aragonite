full_description = '''Categories Weeknotes Weeknotes: Feb. 22-28, 2025 Post author By Tracy Durnell Post date February 28, 2025 1 Comment on Weeknotes: Feb. 22-28, 2025 ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) the creek in the ravine behind my house from the back 40 Neighbors were getting a new roof this week so there was a lot of hammering ten feet from my office (since I’m on the second floor) — deployed the noise cancelling headphones quite a bit 🎧 Highlight of the week: delved into the back 40 and was pleased to see a native rhodie and cedar tree I planted a few years ago are still holding on Looking forward to: getting out in the yard more with good weather! Stuff I did: 3.75 hours consulting 6.5 hours writing finished tax documents + filed papers did business tax-chores cleaned out my miscellaneous papers box, filing and following up as needed took my other cat to urgent care and a followup visit (she’s fine but needs teeth extracted 😿) baked orange poppy seed cake with blood orange glaze from Snacking Cakes — tasty but, as my husband pointed out, a little mentally confusing since we expect poppyseed cake to be lemon flavored 🍋🍊 (or I used to make a rum version) bought a few more songs and finished my sister’s birthday playlist spent a couple hours pruning my japanese maple on two nice afternoons — I feel like I could finally see “how the tree wants to grow” and for once feel pretty good about the cuts I made ✂️💪 finally got a walk in with my friends Dinners: leftover peanut sauce + broccoli + leftover chowder + cake Italian lentil soup — 1.5x batch with green lentils — added bay leaves and a dash of thyme + ciabatta bread teriyaki takeout — salmon teriyaki with rice leek and salmon quiche with leftover salmon (👎 didn’t like the capers in it, and had to use dried dill which was too strong) fajita burritos with these new soy shreds my friend told me about paneer bhurji + sourdough toast + Coke frozen waffles, strawberries, fake sausage, and fried eggs Reading: Read The Wild Wolf’s Rejected Mate by Cate C. Wells, He’s Not My Type by Meghan Quinn, How to Please a Princely Fae by January Bell, Wooing the Witch Queen by Stephanie Burgis 👍, and Collision Course by Michelle Diener Words I looked up / concepts I learned: “Narrative containment is what happens when a story suggests that our lives could be radically different — full of men who support independent women, for instance — only to wind up acclimating us to the status quo.” — Annalee Newitz cavalcade Choice phrases: “There is something lovely about spraying a perfume not to project out into the world but to keep as a kind of covenant between you and your skin…” — Miccaeli (I am not a scent person, but it’s interesting how someone who is writes about scents.) Pretty stuff I saw: this painting of trees by a cityscape by Honora this pretty dot painted rock by Heather “Warm” by Pip New music I listened to: Free at Dawn — Small Black Nature notes: yellow crocuses are blooming! I didn’t plant any last fall but we got some returners by the front door spotted the sapsucker again, heard the hummingbird more looking back towards the house from the edge of the back 40 — blackberries to deal with but a lot of canes that died on their own too… I want to pull down the old vines from the shrubs — very little undergrowth has survived, I suspect it’s planted so densely not enough light makes it Tags personal By Tracy Durnell Writer and designer in the Seattle area. Reach me at tracy.durnell@gmail.com or @tracy@notes.tracydurnell.com. She/her. View Archive → ← Read A Few Rules for Predicting the Future → Listened to Beneath the Brine One reply on “Weeknotes: Feb. 22-28, 2025” Deb Rouleau says: @ tracydurnell.com March 1, 2025 at 1:57 pm Likes Weeknotes: Feb. 22-28, 2025 by Tracy Durnell. Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'''
