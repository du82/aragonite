full_description = "Categories Future Building Read A Few Rules for Predicting the Future Post author By Tracy Durnell Post date February 27, 2025 No Comments on Read A Few Rules for Predicting the Future ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) Read A Few Rules for Predicting the Future: An Essay The wise words of science fiction icon Octavia E. Butler live on in this beautiful and giftable little volume. “There’s no single answer that will solve all our future problems. There’s no magic bullet. Instead there are thousands of answers—at least. You can be one of them if you choose to be.” Originally published in Essence magazine in the year 2000, Octavia E. Butler’s essay “A Few Rules for Predicting the Future” offers an honest look into the inspiration behind her science fiction novels and the importance of studying history and taking responsibility for our actions if we are to move forward. Organized into four main rules, this short essay reminds readers to learn from the past, respect the law of consequences, be aware of their perspectives, and count on the surprises. Citing the warning signs of fascism, the illusive effects of fear and wishful thinking, and the unpredictable nature of what is yet to come, Butler shares realistic but hopeful suggestions to shape our future into something good. An inspiring and motivational gift for students and recent graduates, fans of Butler’s work, and anyone seeking a brighter day tomorrow, this exquisite gift book includes stunning Afrofuturist artwork by Manzel Bowman alongside the full text of the original essay. Nice presentation but not worth the price 🤷‍♀️ There are only four pieces of art scattered throughout and a paragraph or two of text on each page. I’d be happier about having bought this if it were larger so I could see the art better or there were a few more illustrations. Tags 2024, art book, book, Chronicle Books, essay, Manzel Bowman, Octavia Butler"
