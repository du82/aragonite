full_description = "Categories Weeknotes Weeknotes: Feb. 22-28, 2025 Post author By Tracy Durnell Post date February 28, 2025 1 Comment on Weeknotes: Feb. 22-28, 2025 ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) the creek in the ravine behind my house from the back 40 Neighbors were getting a new roof this week so there was a lot of hammering ten feet from my office (since I’m on the second floor) — deployed the noise cancelling headphones quite a bit 🎧 Highlight of the week: delved into the back 40 and was pleased to see a native rhodie and cedar tree I planted a few years ago are still holding on Looking forward to: getting out in the yard more with good weather! Stuff I did: 3.75 hours consulting 6.5 hours writing finished tax documents + filed papers did business tax-chores cleaned out my miscellaneous papers box, filing and following up as needed took my other cat to urgent care and a followup visit (she’s fine but needs teeth extracted 😿) baked orange poppy seed cake with blood orange glaze from Snacking Cakes — tasty but, as my husband pointed out, a little mentally confusing since we expect poppyseed cake to be lemon flavored 🍋🍊 (or I used to make a rum version) bought a few more songs and finished my sister’s birthday playlist spent a couple hours pruning my japanese maple on two nice afternoons — I feel like I could finally see “how the tree wants to grow” and for once feel pretty good about the cuts I made ✂️💪 finally got a walk in with my friends Continue reading “Weeknotes: Feb. 22-28, 2025” Tags personal Categories Culture The Internet Choosing my pace by shaping my thinking spaces (Part 5) Post author By Tracy Durnell Post date February 23, 2025 5 Comments on Choosing my pace by shaping my thinking spaces (Part 5) ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) This is part five of a series on tackling wants, managing my media diet, and finding enough. Each post stands alone, so you don’t have to read them all. Read the introduction on “the mindset of more.” Too much info, too fast Information has a near-physicality to it — we feel the emotional force of content. Although the same volume of information is coming into my feed reader as always, the intensity of the content of late has made it feel like too much. The perceived speed of my intellectual spaces has increased because so much of the information I’m exposed to is emotionally distressing. And going too fast for too long makes me tired — mentally and physically. As someone prone to anxiety, I need to be conscious of how my body internalizes what I’m reading. We feel the emotional intensity of what we read from a feed as speed because it seems that a large number of consequential things have happened to us in a short span of time. Caitlin Dewey frames it as being deluged: [W]hen it comes to political news… I sometimes feel like I’m standing at the base of some fucked-up virtual waterfall, with thousands of gallons of dense, icy water pounding down ceaselessly on my head. Our bodies translate our online emotional experiences into physical realities; our bodies react to what happens in virtual spaces the same way they react in physical spaces, releasing stress hormones and raising our heart rate and blood pressure although we’re sitting still. Chronic stress is terrible for our health. But we wouldn’t spend so much time online if it was only bad – we also receive mental rewards from gathering information. I don’t think withdrawing from information altogether is the answer, but I wonder whether we can reclaim some agency by changing the places and ways we’re exposed to information — by controlling our perceived intellectual pace. Our intellectual pace is influenced by: the total amount of information we’re exposed to, how much of it we actually consume, the information’s emotional intensity, the place we’re consuming it, and whether we feel we can do anything about it. Continue reading “Choosing my pace by shaping my thinking spaces (Part 5)” This is the (current) last article in a series on the mindset of more. Previous: The open web as gift economy (Part 4) Tags agency, balance, bodies, control, FOMO, indie web, IndieWeb, letting go, media diet, open web, overwhelm, pacing, place, Ray Bradbury, slow living, social media, spaces, speed, willpower"
