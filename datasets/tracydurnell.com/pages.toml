full_description = "Categories Weeknotes Weeknotes: Feb. 22-28, 2025 Post author By Tracy Durnell Post date February 28, 2025 1 Comment on Weeknotes: Feb. 22-28, 2025 ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) the creek in the ravine behind my house from the back 40 Neighbors were getting a new roof this week so there was a lot of hammering ten feet from my office (since I’m on the second floor) — deployed the noise cancelling headphones quite a bit 🎧 Highlight of the week: delved into the back 40 and was pleased to see a native rhodie and cedar tree I planted a few years ago are still holding on Looking forward to: getting out in the yard more with good weather! Stuff I did: 3.75 hours consulting 6.5 hours writing finished tax documents + filed papers did business tax-chores cleaned out my miscellaneous papers box, filing and following up as needed took my other cat to urgent care and a followup visit (she’s fine but needs teeth extracted 😿) baked orange poppy seed cake with blood orange glaze from Snacking Cakes — tasty but, as my husband pointed out, a little mentally confusing since we expect poppyseed cake to be lemon flavored 🍋🍊 (or I used to make a rum version) bought a few more songs and finished my sister’s birthday playlist spent a couple hours pruning my japanese maple on two nice afternoons — I feel like I could finally see “how the tree wants to grow” and for once feel pretty good about the cuts I made ✂️💪 finally got a walk in with my friends Continue reading “Weeknotes: Feb. 22-28, 2025” Tags personal Categories Weeknotes Weeknotes: Feb. 15-21, 2025 Post author By Tracy Durnell Post date February 21, 2025 No Comments on Weeknotes: Feb. 15-21, 2025 ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) I can get away with one egg for breakfast (for me) if I make potatoes too… I’ve been cutting up 3-4 yellow potatoes the night before and putting them in a tupperware covered with water, then in the morning I drain them, dry them, and toss them with olive oil, paprika, and rosemary, and airfry at 400F for 10 minutes — probably not actually any cheaper but I <3 potatoes 😄 Win of the week: I’ve been looking for my Pixel 3a so I can root it and use it as my everyday browsing device, and haven’t found it yet, but DID find my Pretty Hate Machine CD that’s been missing for like a year 🙌💿 (It was hiding along with The Postal Service, which I did not notice was missing lol) Looking forward to: resting my brain this weekend Stuff I did: 6.5 hours consulting 5 hours writing took Monday off work for Presidents Day didn’t win the big project, so it goes 🤷‍♀️ rounded up all my tax documents and filled out paperwork for my tax people — almost done moved some uninvested money around for better interest rates and put a little in short-term CDs with a better return than savings accounts offer chipped away at the next blog post in my series… over the weekend it ballooned to 6000 words, then I restructured it completely and pared it back to 3000… maybe this weekend I’ll finish it 🤞 downloaded my Amazon ebook library and converted everything to epub out of spite that they won’t allow you to download your files anymore after Feb. 26th finally got above 40 degrees F outside and the sun was out, so I got an hour of pruning in — brutalized my Diablo ninebark in hopes a severe cleanup will make it healthier, it gets powdery mildew like nothing else played games with my sister… still getting mild motion sickness after an hour of running around no matter how I tweak the settings 🫤 one virtual appointment skipped my weekly walk for rain so I made myself ride my indoor bike for five minutes Continue reading “Weeknotes: Feb. 15-21, 2025” Tags personal"
