full_description = "Interesting People Personal websites of interesting people who I used to follow on social media before I bailed. Now I’m adding new cool folks I find. More collections: blogroll | neat websites | cool artists | graphic design resources | indie shops | wishlist | big questions Writers Ursula Vernon – writes adult works as T. Kingfisher – was mostly self-pub but also now published through Tor – also a cartoonist – and a gardener – you should read her Saint of Steel series and comic Digger – active on Tumblr and Bluesky Courtney Milan – auto-buy romance author, former lawyer, has helped raise a ton of money for voting and abortion rights (also has a delightful newsletter about tea and writing) Annalee Newitz – science, history and science fiction – I liked their book Four Lost Cities – their newsletter The Hypothesis is enjoyable Ed Yong – science journalist who’s gotten into birding – I’m really digging Ed’s newsletter lately KJ Charles – romance and mystery author – writes infrequent but useful fiction writing advice James Somers – wrote “you’re probably using the wrong dictionary” Creative types Rebecca Toh – photographer James Greig – graphic designer, likes cycling, has a newsletter Ingrid Burrington – art? design? maps? unsure but looks neat Anna Eschelman – pretty maps and scientific visualizations Dan Coe Carto – beautiful lidar maps and other scientific graphics Disability advocacy Sara Hendren – disability design (has a good newsletter) Rebekah Taussig – disabled writer and teacher who uses a wheelchair (mostly on Instagram) – I’ve read and enjoyed part of her book Sitting Pretty KC Davis – living with disability – loved her book How to Keep House While Drowning Jodi Ettenberg – disabled writer who talks about her spinal issues (has a newsletter where she shares tons of random links) Dani Donovan – ADHD Scientists & academics Sarah Taber – ag commentary – she does awesome takedowns of the agriculture industry on Twitter / Mastodon / BlueSky Jared Yates Sexton – fascism and history – has a good newsletter that I have to dip in and out of because it’s stressful for me Alex Wild – insect photographer and entomologist Adam Harvey Studio – art + research + surveillance + privacy Outdoors & travel Paul Stamatiou – cool trip logs with great photos Jimmy Chin – climber, photographer and filmmaker Alastair Humphreys – adventure and travel with a fun attitude Miscellaneous Kiun B. — YouTube channel — indigenous woman from Yakutsk sharing her culture Chris La Tray — Métis poet in Montana who writes An Irritable Métis on indigenous issues and belonging Miss Mina — YouTube channel — she and her mom do city food tour videos from a base in the PNW 11 replies on “Interesting People” Tracy Durnell says: @ tracydurnell.com October 17, 2020 at 10:37 pm I’m a book lover, sci-fi writer, and native plant nerd. Learn more about me, and see what I’m up to now. This is my personal site — you may be looking for my professional sustainability consulting services. Explore my site Peruse a starter set of posts on my favorite topics Join me in pondering my… Tracy Durnell says: @ tracydurnell.com February 26, 2021 at 9:50 pm Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com October 27, 2022 at 10:40 pm Personal websites of interesting people who I used to follow on social media before I bailed. Now I’m adding new cool folks I find. More… Tracy Durnell says: @ tracydurnell.com October 28, 2022 at 6:52 pm Over the years, I’ve followed hundreds of artists and interesting people on Instagram and Twitter. Social media platforms don’t make it very easy to see everyone you follow, even as they constantly change the way they show you information so you don’t know what updates you’re missing. They also reward frequency and recency. The idea of an algorithm is nice — ‘it’ll show me posts I missed from people I care about!’ — but in practice it’s more like ‘ok thanks for showing me that five people I follow liked a political meme’. As I move away from regularly using Twitter and Instagram, I don’t want to lose track of everyone who I followed there. So, I made my own lists of people who I follow — their own websites, not their social media accounts or profiles on other platforms: Cool Artists – artists and craftspeople of all varieties Interesting People – people with interesting and helpful things to say, from a range of backgrounds (science, art, advocacy, interior design) Some of these people may also have newsletters and blogs that I don’t know about or am not following, or may have no way to follow their activity at all outside of social media — but at least I’ll always be able to find them. (Presumably anyone who’s bothered to set up a personal website will keep it?) And maybe a list is a way other people can find new folks to follow too. The main bummer is not having images to represent everyone’s art, but that sounded like a helluva lot of additional work 😉 How I collated these lists I went through my Twitter and Instagram following lists — which were much longer than I had realized 😨 — and opened bio links to personal websites for everyone who had one. There was probably an easier way to do it, but I manually opened everyone’s profile to remind myself who they were. Instagram’s interface to see who you’re following is Terrible if you’re following any large number of users. Because I’m into the IndieWeb and everyone having their own website, I decided to be a stickler and only include personal websites, not BigCartel shops or platform profiles or linktrees. That meant a number of artists did get excluded — but honestly the lists are plenty long anyway 🤷‍♀️ I also didn’t duplicate my blogroll, so the websites of people whose blogs and newsletters I’m following aren’t currently on this list… I may go back and add personal websites of people who write newsletters instead of blogs. When we in the IndieWeb talk about owning our content, the focus is often on the things we have posted ourselves, or saving our likes and bookmarks — but keeping track of who we follow is also useful. Also posted on IndieNews Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com October 28, 2022 at 6:52 pm Over the years, I’ve followed hundreds of artists and interesting people on Instagram and Twitter. Social media platforms don’t make it very easy to see… Tracy Durnell says: @ tracydurnell.com November 17, 2022 at 11:44 am Jump to: Home goods | Art shops & galleries | Personal care | Paper goods | Clothes & accessories | Garden | PNW food companies | Services More collections: blogroll | interesting people | cool artists | graphic design resources | neat websites | wishlist | big questions I like to support independent shops, artists,… Tracy Durnell says: @ tracydurnell.com November 26, 2022 at 9:38 pm Liked How to Weave the Artisan Web by John Scalzi (whatever.scalzi.com) 1. Create/reactivate your own site, owned by you, to hold your own work. 2. When you create that site, write or otherwise present work on your site at least once a week, every week. 3. Regularly visit the sites of other creators to read/see/experience the work they present there. 4. Promote/link the work of others, on your own site and also on your other social media channels where you have followers. I’ve got 1 and 3 down — it’s 2 and 4 that are the hard part for me 😉 I post here multiple times a week, but don’t write something on my blog Cascadia Inspired every week, nor my pen name website. Here I link to a lot of other people’s blogs and sites as I bookmark and comment on articles, but not so much on my blog. I post mostly original content there — photos and essays. For visitors to this site, I do have a blogroll plus my new pages of artists and interesting people. Almost never do I remember to share work from any site — mine or others’ — on social media. Lately I’ve been trying to share my blog posts on micro.blog, though Twitter or LinkedIn would theoretically reach more people 🤷‍♀️ Note to self: offer on LinkedIn to help anyone who wants to set up a new website. Tracy Durnell says: @ tracydurnell.com December 7, 2022 at 11:02 pm I have too many pages to fit in my nav! Here’s a sitemap of all the pages on this website. Blog Mind Garden Post Index Links to blog about Big Questions Big Questions Balanced Lifestyle Effective Creative Processes Writing Fiction Thinking Better Information Diet Future of the Internet Resisting Fascism Building Community Transforming Capitalism Women’s… Tracy Durnell says: @ tracydurnell.com March 18, 2023 at 12:23 pm Jump to: Neat projects | Webcomics | Plants & nature | Food | Collections | Math & science | Places | Tools | Seattle 🆕 added February 2025 More collections: blogroll | interesting people | cool artists | graphic design resources | indie shops | wishlist | big questions Neat projects It’s Post Day! (Sarah… Tracy Durnell says: @ tracydurnell.com October 8, 2023 at 4:59 pm And unweirdification is unhumanization. The pattern follows the same path as the consolidation and corporatization as our built environment… The internet has been… Tracy Durnell says: @ tracydurnell.com December 6, 2024 at 8:39 pm new fridge!!!! I am so psyched for this layout, I think the produce drawer will be a game changer 👉 Do you have a blog?… To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
