e photography (Australia) Scott Kranz – mountain photos (Seattle) Floris van Breugel (Art in Nature) – nature photography Forgotten Heritage (Matt Emmett) – architectural and heritage photography (England) Edward Burtynsky – “nature transformed by industry” Christopher Payne – architectural and industrial photography Ben Simon Rehn Warren Keelan – textural wave photos Painters Unsettling Nick Sheehy – macabre surrealist paintings of animals and bones Miranda Meeks – eerie fantasy paintings Tom Bagshaw – dark witchy women Peter Ferguson – old-timey surrealist paintings of people with odd animals Joao Ruas – unsettling detached people Femke Hiemstra (Femtasia) – surrealist stories with an old-fashioned vibe Brandi Milne – cheerfully dark fairy tale scenes Paul Barnes – unsettling fantastical scenes Christina Mrozik – dying creatures and flowers Lee Madgwick – modern gothic landscapes Shaun Tan – surrealist worlds peopled by imaginary creatures Syd Bee – luminous pink and blue women (Seattle) Reliah Szade – cyberpunkish sci-fi paintings of people Shok-1 – x-ray paintings Mary Iverson – geometry superimposed on landscapes (Seattle) Ethereal Amy Sol – moody peaceful pastel-hued women in fantasy realms Rebecca Chaperon – mystical floating crystals over dark seas (Canada) Audrey Kawasaki – powerful women on wood Sarah Joncas – beautiful women (Canada) Bao Pham – floral portraits of women (Iowa) Kristin Kwan – fantasy creature and mondo cat paintings Dragica Carlin – beautiful swirling colors Teagan White – gouache and watercolor wildlife (PNW) Lois von Baarle (Loish) – emotive digital portraits of women Angela Lane – airy landscapes (Germany) Allie Oldfield – luscious landscapes (London) Ulla Thynell – fairy tale forest paintings and mixed media Chris Berens – soft surreal fantasy scenes (Amsterdam) Janelle Lile – paintings of women with nature ephemera (Washington) Nguyễn Thanh Nhàn (xnhan00) – delicate women paintings 🆕 Owen Gent – richly colored dreamscapes and surreal 