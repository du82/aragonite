rofiles on other platforms: Cool Artists – artists and craftspeople of all varieties Interesting People – people with interesting and helpful things to say, from a range of backgrounds (science, art, advocacy, interior design) Some of these people may also have newsletters and blogs that I don’t know about or am not following, or may have no way to follow their activity at all outside of social media — but at least I’ll always be able to find them. (Presumably anyone who’s bothered to set up a personal website will keep it?) And maybe a list is a way other people can find new folks to follow too. The main bummer is not having images to represent everyone’s art, but that sounded like a helluva lot of additional work 😉 How I collated these lists I went through my Twitter and Instagram following lists — which were much longer than I had realized 😨 — and opened bio links to personal websites for everyone who had one. There was probably an easier way to do it, but I manually opened everyone’s profile to remind"
