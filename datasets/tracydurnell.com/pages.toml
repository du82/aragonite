full_description = '''Categories Future Building Read A Few Rules for Predicting the Future Post author By Tracy Durnell Post date February 27, 2025 No Comments on Read A Few Rules for Predicting the Future ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) Read A Few Rules for Predicting the Future: An Essay The wise words of science fiction icon Octavia E. Butler live on in this beautiful and giftable little volume. “There’s no single answer that will solve all our future problems. There’s no magic bullet. Instead there are thousands of answers—at least. You can be one of them if you choose to be.” Originally published in Essence magazine in the year 2000, Octavia E. Butler’s essay “A Few Rules for Predicting the Future” offers an honest look into the inspiration behind her science fiction novels and the importance of studying history and taking responsibility for our actions if we are to move forward. Organized into four main rules, this short essay reminds readers to learn from the past, respect the law of consequences, be aware of their perspectives, and count on the surprises. Citing the warning signs of fascism, the illusive effects of fear and wishful thinking, and the unpredictable nature of what is yet to come, Butler shares realistic but hopeful suggestions to shape our future into something good. An inspiring and motivational gift for students and recent graduates, fans of Butler’s work, and anyone seeking a brighter day tomorrow, this exquisite gift book includes stunning Afrofuturist artwork by Manzel Bowman alongside the full text of the original essay. Nice presentation but not worth the price 🤷‍♀️ There are only four pieces of art scattered throughout and a paragraph or two of text on each page. I’d be happier about having bought this if it were larger so I could see the art better or there were a few more illustrations. Tags 2024, art book, book, Chronicle Books, essay, Manzel Bowman, Octavia Butler By Tracy Durnell Writer and designer in the Seattle area. Reach me at tracy.durnell@gmail.com or @tracy@notes.tracydurnell.com. She/her. View Archive → ← Read Collision Course → Weeknotes: Feb. 22-28, 2025 Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'''
