full_description = "Blogroll Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I follow relatively often for variety. My websites | Personal blogs | Topical blogs & newsletters | Keep exploring My websites RSS feeds for this website Digital Garden RSS Feed — all posts except book reviews Articles RSS Feed — just article posts (includes weeknotes) Weeknotes RSS Feed — if you only want weeknotes! Book Review RSS Feed — book reviews only It’s WordPress, it’ll generate a feed for whatever you fancy (tags, categories, post kinds, etc.)! Just put /feed/ at the end of the URL you want to follow. My other websites My notes blog (also on micro.blog) (also available via Mastodon) My consulting website sustainability planning + communications Cascadia Inspired nature + creativity (active 2012-2023) Sense Memory outdoor stories (published in 2021) Personal blogs + websites The line between personal versus topical blog can be tricky to define, so some things on here may be more of a personal blog than not. 🤷‍♀️ I’ve omitted blogs that haven’t posted in the last 6 months. I also follow a bunch of people through micro.blog instead of RSS and it is sadly too much work to add them all here too 😅 People I’ve met Al Abut (RSS) Alex Sirac (RSS) Angelo Gladding Annie Mueller (RSS) Anthony Ciccarello (RSS) ArtLung (RSS) Benji (RSS) Cam Pegg (RSS) Durnell Studio (my sister!) gRegor Love (RSS) Jacky Alciné (RSS) James G (RSS) Jeremy Cherfas (RSS) Joseph Lafond Nick Simson (RSS) Pablo Morales (RSS) Reilly Spitzfaden (RSS) Sara Jakša (RSS) uncountable thoughts (RSS) People I’ve interacted with People who I’ve exchanged emails with or who have left comments here. I’m going by memory and might be wrong 😉 Andrés Cárdenas (RSS) Andy Sylvester (RSS) The Artist’s Notebook (RSS) Chris Glass (RSS) Colin Walker (RSS) Jan Boddez (RSS) Manu Moreale (RSS) The Obvious? (RSS) Perspectives (RSS) Prof. von Explaino (RSS) The Wallflower Digest (RSS) Everyone else Alice Bartlett (RSS) Anh (RSS) As in guillotine (RSS) Ash Huang (RSS) Brandon’s Journal (RSS) Cassey Lottman (RSS) Cory Dransfeldt (RSS) Curtis McHale (RSS) data + feelings (RSS) disassociated (RSS) Dominik Hofer (RSS) Dostoynikov (RSS) Excited Pixels (RSS) Heed Not the Rolling Wave Hey Georgie (RSS) Island in the Net (RSS) Jack Cheng (RSS) Jay Hoffman (RSS) Katy DeCorah (RSS) Keenan (RSS) aka Ken Smith (RSS) Kwon.nyc (RSS) Leah Das (RSS) localghost (RSS) Luke Dorny (RSS) Makoism (RSS) Mario Villalobos (RSS) Melanie Richards (RSS) Naz Hamid (RSS) Nicky’s Blog (RSS) Oatmeal (RSS) Piper Haywood (RSS) Popaghandi (RSS) Pradyuman K. (RSS) Rach Smith (RSS) ribo.zone (RSS) Sonia Turcotte (RSS) The Garden (RSS) theunderground.blog (RSS) Ultranormal (RSS) Willa Magland Keep exploring Topical writing People writing about: culture the internet transforming capitalism resisting fascism feminism information diet thinking better creative processes balanced lifestyle More interesting people Cool Artists — a long list of personal websites of artists and artisans Interesting People — personal websites of interesting people from a range of backgrounds More interesting websites Neat websites — a random collection of websites I’ve found useful and webpages for interesting organizations Small businesses — support indie creators & small businesses ✊ Graphic Design Resources — books, blogs, collections, typefaces, and references More options for discovery IndieWeb Discovery Finding Personal Websites Boutique Search Engines Breaking Out of What the Algorithm Feeds You 25 replies on “Blogroll” Tracy Durnell says: @ tracydurnell.com October 17, 2020 at 10:37 pm I’m a book lover, sci-fi writer, and native plant nerd. Learn more about me, and see what I’m up to now. This is my personal site — you may be looking for my professional sustainability consulting services. Explore my site Peruse a starter set of posts on my favorite topics Join me in pondering my… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com February 26, 2021 at 9:50 pm Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com February 26, 2021 at 9:50 pm Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com February 26, 2021 at 9:50 pm Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com February 26, 2021 at 9:50 pm Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I… Tracy Durnell says: @ tracydurnell.com August 27, 2021 at 12:54 pm I’m a sci-fi writer, graphic designer and urbanist in the Seattle suburbs. Reading and blogging are my favorite pasttimes and I’m an advocate of the IndieWeb. On this site, I track what I read and watch, write commentary on things that interest me, and collect reference information. I’m curious about everything from technology to history to… Intellectual Monocropping – Tracy Durnell says: @ tracydurnell.com October 5, 2021 at 8:56 pm Excerpt: Lately I feel like my RSS feeds and newsletter subscriptions are a bit off, like I’m not getting enough variety. I notice the same articles be recommended time and again. I’ve been taking that as an indication that I really need to read that article, but maybe it’s that I’m reading within the same spheres. Ironic since I made an effort to cast a broader net with what I’m reading earlier this year. Funnily enough I did often find new things on Twitter, when I let myself use it, because I was following a ton of artists and writers – I wish they all had blogs or newsletters I could follow instead! Breaking Out of What the Algorithm Feeds You – Tracy Durnell says: @ tracydurnell.com November 11, 2021 at 11:44 pm Excerpt: I am a huge proponent of RSS and honestly don’t understand how anyone can do without it 🤷‍♀️ Tracy Durnell says: @ tracydurnell.com June 10, 2022 at 7:52 pm This Article was mentioned on tracydurnell.com Tracy Durnell says: @ tracydurnell.com November 26, 2022 at 9:38 pm Liked How to Weave the Artisan Web by John Scalzi (whatever.scalzi.com) 1. Create/reactivate your own site, owned by you, to hold your own work. 2. When you create that site, write or otherwise present work on your site at least once a week, every week. 3. Regularly visit the sites of other creators to read/see/experience the work they present there. 4. Promote/link the work of others, on your own site and also on your other social media channels where you have followers. Tracy Durnell says: @ tracydurnell.com December 7, 2022 at 11:02 pm I have too many pages to fit in my nav! Here’s a sitemap of all the pages on this website. Blog Mind Garden Post Index Links to blog about Big Questions Big Questions Balanced Lifestyle Effective Creative Processes Writing Fiction Thinking Better Information Diet Future of the Internet Resisting Fascism Building Community Transforming Capitalism Women’s… Tracy Durnell says: @ tracydurnell.com February 7, 2023 at 11:24 am Excerpt: I am a huge fan of RSS and have never stopped using it to follow blogs and webcomics. But lately as I’ve read lots of people talking about timelines, a question has been niggling at me: what does make an RSS feed* feel better to use than “the timeline” of social media? They are both streams of information, but I prefer RSS. Tracy Durnell says: @ tracydurnell.com May 19, 2023 at 9:16 pm Excerpt: I much prefer following people to publications, and curating for myself what’s interesting out of what those people have curated for themselves. There’s a good bit of noise, but there’s also a lot of serendipity — neat things I would never have encountered on my own, that I wouldn’t have thought to investigate. Tracy Durnell says: @ tracydurnell.com September 23, 2023 at 9:25 am Twenty years ago today, I wrote my first blog post! (I stopped blogging from about 2009-2011, so I haven’t technically been blogging for… Tracy Durnell says: @ tracydurnell.com November 30, 2023 at 7:31 pm Last week, I updated my blogroll to include everyone in my RSS feed reader. While I read a lot of topical blogs and… Rian van der Merwe says: December 3, 2023 at 6:57 am […] Tracy also updated her blog roll (remember those!?) and I am definitely going to add one here as […] Tracy Durnell says: @ tracydurnell.com January 11, 2024 at 12:00 am I’ve been thinking about this a lot the past few weeks as writers on Substack weigh whether to go or stay where Nazis are openly… Keenan says: @ social.lol January 16, 2024 at 1:01 pm @benji @vkc Oh, hey, thanks! 🥰 Tracy Durnell says: @ tracydurnell.com April 19, 2024 at 7:41 pm Rethinking our spaces for what would be useful to our lives, not what’s expected to go there — I’m digging having a bunch of open… Tracy Durnell says: @ tracydurnell.com August 24, 2024 at 12:14 am a tasty summer breakfast Win of the week: taking time in the morning twice this week to cook lunch — stole some writing time but… Tracy Durnell says: @ tracydurnell.com October 23, 2024 at 10:09 pm Here are some things on my wishlist. (These are mostly bookmarks that I will probably not ever buy, but it makes me feel better to save them just in case 😉 Also I’m trying to get away from Pinterest.) Prices from when items were added. More collections: blogroll | interesting people | cool artists |… Good Morning Magpie says: @ goodmorningmagpie.ghost.io December 31, 2024 at 9:53 am Good morning fellow subscribers and a happy New Years Eve. With 2024 closing and a brand new year upon us, I wanted to reflect on Good Morning Magpie over the past year, openly speculate where I might want to take this blog going into 2025, and provide an opportunity for Tracy Durnell says: @ tracydurnell.com January 4, 2025 at 9:27 am This is part three of a series on tackling wants, managing my media diet, and finding enough. Read the introduction on “the mindset of more.”… Tracy Durnell says: @ tracydurnell.com January 21, 2025 at 10:49 pm I saw someone* share a list of guiding principles for their website they described as “Core Website Tenets,” and I love the idea of codifying… Tracy Durnell says: @ tracydurnell.com February 6, 2025 at 10:43 am Last updated 6 Feb. 2025 | Mirror of my post Guiding principles for my website 1. Be friendly and kind Link and cite generously Post my blogroll Post my contact info Invite connection Accept comments and Webmentions Reply to comments more often than not Don’t be a dick — be kind even when critical But… To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
