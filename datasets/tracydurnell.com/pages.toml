full_description = "Hi, I’m Tracy, a storyteller in Seattle Scroll Down I’m a book lover, sci-fi writer, and native plant nerd. Learn more about me, and see what I’m up to now. This is my personal site — you may be looking for my professional sustainability consulting services. Explore my site Peruse a starter set of posts on my favorite topics Join me in pondering my big questions (my approach to organizing my learning and thinking by theme) Check out featured posts for “the hits” See all posts in reverse chronological order Explore topics in the index Roll for a random post Recommendations + collections 📚 What I’ve been reading and my book reviews 🎧 What I’ve been listening to, favorite albums, and playlists 🤓 Cool artists, interesting people, neat websites, indie and small businesses, graphic design resources, and a blogroll of personal websites and blogs I follow 🥧 Recipes I’d make again and recipes to try What I write about here I use my digital garden to think out loud, so much of this site is exploratory. I’m an advocate of the indie web and think a lot about how we can connect outside of silos. My writing often leans political, because the personal is political. Posts are organized by type — like reads, watches, and listens — and extensively categorized and tagged. In the comments, you’ll find links to any newer posts on the website that mention it. I invite you to chime in here in the comments (or by webmention), shoot me an email, or say hi on the fediverse! I don’t use tracking so I have no idea you came by unless you say something 😉"
