full_description = "Neat Websites Jump to: Neat projects | Webcomics | Plants & nature | Food | Collections | Math & science | Places | Tools | Seattle 🆕 added February 2025 More collections: blogroll | interesting people | cool artists | graphic design resources | indie shops | wishlist | big questions Neat projects It’s Post Day! (Sarah Avenir) — email art project How Not to Make a Book (Robin Rendle) — documenting the process of creating a book about typography Werner’s Nomenclature of Colors (Nicholas Rougeux) — A recreation of the original 1821 color guidebook with new cross references, photographic examples, and posters Screens, research and hypertext — hypertext book about hypertext — love that meta brr.fyi — blog by an anonymous IT worker who overwintered in Antarctica WA 100 Peaks — photographer and climber Scott Kranz climbed 100 peaks in Washington Johannes Klingebiel’s digital garden — nice design Emmanuel Quartey’s “questions” — I like the framing and organization of information 🆕 The Shape of Music Albums — visualization of the characteristics Spotify assigns to tracks, created by Greg Wolanski 🆕 Tinnitus Tracker — concerts attended by Rob Weychert 🆕 Atlas of Intangibles — cool interactive visualization of markers of distinctiveness and wear in London locations Webcomics False Knees (Joshua Barkman) – comic strips with goofy birds webcomic name (Alex Norris) – “oh no” Poorly Drawn Lines (Reza Farazmand) – comic strips with returning animal characters Cat and Girl (Dorothy) – social commentary from Cat and Girl The Creator’s Guide to Comics* Devices (Reimena Yee) — illustrated guide to tools that comic artists can use in storytelling Info Plants and nature –> check out my garden section Small Seasons — the year divided into two-week segments named for the natural phenomena that tend to happen then (in Japan) Native Plants PNW — comprehensive listings of northwest native plants Pacific Northwest Wildflowers — photographic database of wildflowers filterable by color and useful for identification The Natural Navigator (Tristan Gooley) – interpreting nature sign Cotswald Diary (Chris) – a look into the ongoing work of natural restoration projects New Hampshire Garden Solutions – pretty plants and insects oakland garden club (Alexis Madrigal)* – plants and art Clamsplaining (Dan Killam) – clam science Natural World Facts’ Deep Sea Hub (Leo Richards) — YouTube channel — mesmeric deep ocean videos Wildhope.tv — YouTube channel — documentaries of conservation projects around the world Bumble Bee Watch — report sightings of native bees Pangea Seed — funding marine conservation through art Food –> check out recipes I like and saved recipes to try Budget Bytes Vegetarian Recipes — cheap recipes, usually easy Smitten Kitchen (Deb Perelmen) — Deb has an inviting writing style – consistently good source of baking recipes Still Tasty — database of how long food lasts and storage instructions for a wide variety of foods The Good Enough Weekly (Devin K. Pope)* – climate and food Eat This Newsletter (Jeremy Cherfas)* – food Tasting History (Max Miller) — YouTube channel — he cooks a historic recipe from basically any time period and talks about its context while it’s cooking Kenji’s Cooking Show (J. Kenji López-Alt) — YouTube channel — down to earth cooking advice from a science minded chef 🆕 Black Farmers Index — directory of Black farmers by region of the USA Collections PubMed Central — a free government database of medical journal papers, many of which include free full-text access because the researchers received grant funding 🙌 Federal Open Science Repository of Canada — “federally authored scientific articles and publications from participating science-based departments and agencies” — climate & environment portal 🆕 Specific Suggestions — “The most potent tools for fighting injustice are the ones already in your hands.” 🆕 Sprout Distro — free printable zines Places –> check out my road trip page Atlas Obscura — a searchable map and repository of cool destinations around the world — I always check this when I’m planning a trip Close.city — map with overlays for walking / biking / transit times to major destinations — looks similar to WalkScore but without a score Math and Science Stand-up Maths (Matt Parker) — YouTube channel — goofy math questions explored with demos and field trips Veritasium (Derek Muller) — YouTube channel –longer explainer videos on science and engineering topics, often with cool models Practical Engineering (Grady Hillhouse) — YouTube channel — simple explanations of engineering practices with model demonstrations and case studies Tools + Guides 🆕 Diff Text – compare two text blocks 🆕 Loot Lasso Portfolio Rebalancing Calculator – saw recommended on Reddit, haven’t used 😉 🆕 symbol.wtf – quickly copy and paste symbols 🆕 60 Seconds of Advice on Surviving a Nuclear Blast – also see NUKEMAP by Alex Wellerstein Seattle area Washington Smoke Information – invaluable during smoke season The Urbanist – Seattle area urbanist news Lushootseed (Tulalip Tribe) – phrases and pronunciation of Lushootseed words “the language of Puget Sound” Washington Trails Association – an amazing repository of trip notes with current conditions from hikers all across Washington 10 replies on “Neat Websites” Tracy Durnell says: @ tracydurnell.com October 17, 2020 at 10:37 pm I’m a book lover, sci-fi writer, and native plant nerd. Learn more about me, and see what I’m up to now. This is my personal site — you may be looking for my professional sustainability consulting services. Explore my site Peruse a starter set of posts on my favorite topics Join me in pondering my… Tracy Durnell says: @ tracydurnell.com February 26, 2021 at 9:50 pm Updated 15 January 2025 This is more of a “following” page than a curated blogroll, but I decided to go with the more is more approach 😄 I maintain this page manually so I don’t update it often — also that probably means I’ve missed some feeds I follow 🤷‍♀️ I change up who I… Tracy Durnell says: @ tracydurnell.com December 7, 2022 at 11:02 pm I have too many pages to fit in my nav! Here’s a sitemap of all the pages on this website. Blog Mind Garden Post Index Links to blog about Big Questions Big Questions Balanced Lifestyle Effective Creative Processes Writing Fiction Thinking Better Information Diet Future of the Internet Resisting Fascism Building Community Transforming Capitalism Women’s… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com March 18, 2023 at 12:23 pm Jump to: Neat projects | Webcomics | Plants & nature | Food | Collections | Math & science | Places | Seattle More collections: blogroll… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com March 18, 2023 at 12:23 pm Jump to: Neat projects | Webcomics | Plants & nature | Food | Collections | Math & science | Places | Seattle More collections: blogroll… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com March 18, 2023 at 12:23 pm Jump to: Neat projects | Webcomics | Plants & nature | Food | Collections | Math & science | Places | Seattle More collections: blogroll… Tracy Durnell says: @ tracydurnell.com says: @ tracydurnell.com March 18, 2023 at 12:23 pm Jump to: Neat projects | Webcomics | Plants & nature | Food | Collections | Math & science | Places | Seattle More collections: blogroll… Tracy Durnell says: @ tracydurnell.com March 24, 2023 at 4:31 pm Excerpt: Website Changes: New organizing section! I created a new section called “Big Questions” which organizes a lot of my notes and reading under broad questions that I’ve been thinking about a lot over the past couple years: Balanced Lifestyle Effective Creative Processes Writing Fiction – this one hasn’t been populated yet Thinking Better Information Diet Future of the Internet Resisting Fascism Building Community I got some good ideas at Homebrew Website Club that I’ve only started implementing on the ‘balanced lifestyle’ page, so these still have some work to do. I also need to figure out what system I’m going to follow to update them since it’s all manual 😉 New page I also finally published a page collecting “neat websites” as an addition to my pages for interesting people and cool artists and blogroll. I’d been sitting on it, feeling like it needed more content before I could post it, but whatev, may as well post now and can keep adding 🤷‍♀️ Tracy Durnell says: @ tracydurnell.com December 6, 2024 at 8:39 pm new fridge!!!! I am so psyched for this layout, I think the produce drawer will be a game changer 👉 Do you have a blog?… Tracy Durnell says: @ tracydurnell.com February 7, 2025 at 9:29 pm snow! got this much two days in a row Highlight of the week: made sourdough pancakes while watching fat snowflakes fall and listening to Sure… To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
