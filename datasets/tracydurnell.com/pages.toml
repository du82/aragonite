full_description = "Categories Culture Featured The Internet The open web as gift economy (Part 4) Post author By Tracy Durnell Post date January 27, 2025 12 Comments on The open web as gift economy (Part 4) ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) This is part four of a series on tackling wants, managing my media diet, and finding enough. Each post stands alone, so you don’t have to read them all. Read the introduction on “the mindset of more.” What is the internet for? Is the internet, at its core, a marketplace or a Third Place? Is it meant for facilitating capitalism or community? Whether we think of the internet first a place for connection and second for commerce, or vice versa, shapes our expectations and norms for the web. Continue reading “The open web as gift economy (Part 4)” This article is part of a series on the mindset of more. Next up: Choosing my pace by shaping my thinking spaces (Part 5) Previous: Disrupting my reading habits to read more of what *I* want (Part 3) Tags algorithm, commons, corporate interests, corporate web, curation, gifts, indie web, open access, oral culture, paywall, perspective, Robin Wall Kimmerer Categories Featured Relationships Technology The Internet Websites Sanding off friction from indie web connection Post author By Tracy Durnell Post date January 9, 2025 18 Comments on Sanding off friction from indie web connection ❤️ window.customElements.whenDefined('open-heart').then(() => { for (const oh of document.querySelectorAll('open-heart')) { oh.getCount() } }) // refresh component after click window.addEventListener('open-heart', e => { e && e.target && e.target.getCount && e.target.getCount() }) Add friction to the activities you’d like to change, and remove friction from the things you’d like to do more of. This is usually applied at a personal level, but we can think of it across communities, too: Where is there friction in our community that blocks people from participating in the ways we’d like? This is followup to “The IndieWeb’s next stage?” as well as my entry for this month’s IndieWeb Carnival, hosted by Venkatram Harish Belvadi on the theme of friction. Continue reading “Sanding off friction from indie web connection” Tags challenge, community, conversation, feelings, indie web, IndieWeb, safety, tools, Webmention"
