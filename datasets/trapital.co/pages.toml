title = "Berner’s Billion Dollar Cannabis Business and Hip-Hop’s Wealthiest Artists"
full_description = "December 8, 2022EpisodeBerner’s Billion Dollar Cannabis Business and Hip-Hop’s Wealthiest ArtistsImage credit: Various sources. For specific credits, please contact us. .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byHow the Cookies crumbleZack estimates that Berner’s net worth is $410 million. Most of that is from Cookies, his cannabis business that does nearly $500 million in annual revenue.When weed was legalized in California, Berner worked at a Bay Area dispensary and gained a reputation for his Girl Scout cookies-style strain of cannabis.He turned that into a standalone Cookies company that licenses its products to other dispensaries, sells direct-to-consumer, and has a clothing line too. Cookies now has nine distinct brands and operates 55 stores in 20 states and seven countries. It’s the type of legitimate enterprise that Stringer Bell dreamed of when he took that Macroeconomics 101 class in The Wire.And when Berner’s not building his business, he’s still a prolific hip-hop artist. In 2022, he released a 30-track album and had over 100 million Spotify streams overall.Wealth for the non-superstarThe wealthiest artists tend to be the ones who first reached the highest levels in music. Jay Z, Diddy, Rihanna, Dr. Dre, and Ye leveraged their massive fanbases and influence in music to build their billion-dollar businesses. They launched audience-first companies with built-in distribution.They’re all impressive, but Berner’s success is more unique. He wasn’t a household name from his music, but he still used his notoriety to build Cookies. He also did it in a polarizing industry with tons of regulatory challenges. It speaks to the strength of the company, its products, and its marketing.Also, weed is historically (and literally) grassroots. Cannabis consumers don’t rely on big brands or celebrities to influence buying decisions. Berner started selling weed when he was an underground rapper. He’s the perfect salesman. If you have ever bought weed, you’ve probably bought it from someone who also tried to sell you their mixtape too. If that’s not product-market fit, I don’t know what is.Berner’s not alone as an artist building a non-superstar business empire. Master P is a hybrid. He was well-known after No Limit’s run. “Make Em Say Uhh” was an anthem. But P never reach the consistent music heights that Jay Z or Diddy did. Percy Miller did get there in business though. His consumer products have distribution in Walmart and other major locations. Plus, he owns most of his businesses so the margins are much higher.Another example is Chamillionaire. He had a huge hit in 2006 with “Ridin Dirty.” He never hit that superstar level in music, but he started angel investing, worked at Upfront Ventures, and has invested in several companies that have exited, like Lyft, Ring, Cruise.The rest of the listHere’s the full list of Hip-Hop’s Wealthiest Artists of 2022:– Jay Z – $1.5 billion– Diddy – $1 billion– Ye – $500 million– Berner – $410 million-– Dr. Dre – $400 millionNot much has changed for Jay Z recently. His name is always in the mix of potential buyers when an NFL team is up for sale though. $1.5 billion isn’t enough for outright ownership of a team, but he could still contribute to a sizable stake in a bid.Diddy recently bought a $185 million cannabis business and hopes to bring that Ciroc marketing magic to the industry. Berner’s success with Cookies is a sign that a great marketer can win in this space.Ye and Dr. Dre have dropped on the list in recent years, but Zack predicts that Drake may be the next artist to rise up. With his massive streaming numbers and his massive deal with Universal Music Group, it may only be a matter of time.Listen to my full conversation with Zack on the Trapital Podcast:0:00 Zack’s process behind putting the list together 2:59 The newest billionaire on the list8:31 The growth of Diddy’s DeLeon tequila brand17:06 Sean John’s place in Diddy’s portfolio 18:40 Diddy’s latest moves in cannabis and possibly Twitter 21:47 The evolving business of REVOLT26:24 Berner’s “surprise” $410 million net worth31:50 High potential for Berner’s business34:52 Berner’s business success supersedes his music fame 39:50 Drake moving up the ranks 43:50 Girl Dad storiesTRANSCRIPTION:[00:00:00] Dan Runcie: Hey, welcome to the Trapital Podcast. I’m your host and the founder of Trapital, Dan Runcie. This podcast is your place to gain insights from the executives in music, media, entertainment, and more who are taking hip hop culture to the next level.[00:00:23] Dan Runcie: Hey, today’s episode is a two parter. The first part of the episode, we’re gonna do a breakdown on one of the more recent news that happened in the music industry. Motown Records CEO and Chairwoman Ethiopia Habtemariam has stepped down and there is a lot to unpack there. So we’re gonna talk about that. And in the second half of this episode, we’re joined by my guy Zack O’Malley Greenburg, and we are gonna talk about the recent list that he put out, which is his hip hop’s 2022 list for the wealthiest artist. He has some new announcements, some usual names, and we break it all down. But first, let’s start with the news at Motown. So it was last week, shortly after Thanksgiving. Ethiopia and Universal, and Motown announced that she will be stepping down from her role. This is a role that she has officially had at this level for just over a year and a half. I think it was March, 2021 that the role was announced, but she’s essentially been the face of Motown from a leadership perspective for over a decade now and when the move happened, I think that there were a fair amount of people I could understand that could have been caught off guard by it. But when I start asking around, asking a few people questions who I know understand the situation pretty well, it’s quick to see that what’s being pushed publicly isn’t quite reflecting what’s actually happening behind closed doors. But before we get to all that, let’s talk about some of the wins that I think Motown and Ethiopia have accomplished over the past decade, because I think these stand out and they’re really important. I look at the 2015 joint venture deal that she did with quality control music, as one of those deals that can ultimately help bring a record label from its days of resting on its laurels to being able to get a bit more current. We’ve seen this happen time and time again. You look at Interscope in the early nineties. Interscope was a legacy rock and roll label. Jimmy Iovine was trying to figure out the next thing and then boom. Here comes Suge Knight. Here comes Dr. Dre and Death Row records comes through. Not only does Death Row continue to rise up with the supportive Interscope, but you also see Interscope adopt a bit of that cool factor and really revive itself, and now Interscope is continuing to be one of the strongest record labels that we have. You also saw that a few years later happened with Republic records and with cash money signs. The deal that I’ve talked about plenty of times on this podcast, that 1998 distribution deal and that deal did a lot for Baby and Slim, but it arguably did even more for Republic Records, which now I believe it’s in its fourth year in a row, the leading industry or the leading record label in the industry when it comes to overall market share. And I do think that what quality control and Motown were able to do, do deserve some similar praise. But the slight difference here is that Motown for a lot of its time and even more so as we continue to learn, was saddled under the Capitol Music Group umbrella and didn’t really have the opportunity to standalone as a true record label that could run on its own and be a standalone entity. The same way that we see with Interscope, the same way that you see with Republic. And some of the other record labels that are under the Universal Music Group umbrella. When the news first announced though, there wasn’t as much chatter about Ethiopia’s departure. You think about the times that Def Jam has turned over CEOs. There are think pieces on think piece. You can’t get people to stop talking and sharing their opinions, and some of them on base, but people sharing their opinions about what Def Jam did and didn’t do wrong, but there wasn’t as much here. You saw a little bit in piece that Gail Mitchell at Billboard had done where I think she did a good breakdown. You could definitely read between the lines a little bit of some of the things that necessarily weren’t being said, but what I think we started to unpack and what we started to get a sense for was, even though Motown had increased its market share considerably under Ethiopia’s tenure, I believe back in 2017, it was around 0.4%. And as of most recently from what Billboard reported in 2022, it’s at 0.95%. And that’s great, more than double. And you think about how much more recorded music has grown from 2017 to 2022 now as well, that’s a pretty huge growth and that’s nothing to shy away from. The thing is, record label executives and the music industry aren’t just judged on market share. You’re judged on how efficient you are with what you do to acquire that market share. You’re also judged on your ability to score deals and your ability to do it in a way that’s efficient. Everyone still has a PNL at the end of the day. But I think the slight difference for some of these companies is that because they sit under the Universal Music Group umbrella, you may not necessarily know what’s really happening unless you have a really discerning eye and you can put two and two together. And if you look at some of the moves that Motown has made over the years, there have been a number of big signings. But have those big signings always necessarily led to the type of results? You know, someone like Universal CEO, Lucian Green wants to see from a record label that now would be standing alone and no longer under the Capitol Music Group umbrella. You look at an artist like Lil Baby, who you know, through quality control, is part of that Motown collective. But, you needed a few more artists at that level and you needed to get them at affordable rates. And I think the biggest win that we saw from Motown in recent years was they recently signed NBA Young Boy. This is about a year after he started working with his record label, but how much did it cost to get NBA Young Boy? He had just posted on Instagram, this is two months before this deal was made public. He had just posted on Instagram, this was in August, 2022, that he was a 60 million dollar dude. You’re saying you’re a 60 million dude. A lot of people thought that was a cash money deal. They thought that was probably what Baby and Slim offered, but you later find out that this is what was coming from Motown, and I don’t know if that’s the number or not, but you can just assume a few things. One, NBA Young Boy was someone that just got out of his deal at Atlantic Records and he’s getting out of his deal. This is the second most streamed artist according to HITS Daily Double for year to date for 2022. But as we also know about streams, not all streams are necessarily weighted the same, and those YouTube streams may not necessarily lead to the same payouts that you may get from the digital streaming providers. Your Spotify, your Apple music, your titles, your Amazon, and so forth. So you have that. You also mix that in with NBA Young Boy’s audience isn’t necessarily the type to go buy up a bunch of vinyl. They’re not the type to go buy up a bunch of digital copies or then necessarily sell out an arena. And it’s great that he has those streams, but he has those streams because he is dropping an album every other month. It’s not the same as Columbia having a big release from Harry Styles and then monetizing the shit out of that. Or Kendrick Lamar having a big release on Interscope, and then that continues to do numbers and numbers. It’s not the same type of thing in that way. So I think, even if you were able to win a bidding war, which is great, obviously a number of labels would’ve wanted to get NBA Young Boy. There’s a certain price to everything, and even though we may not know the specific details, we can put two and two together. There are also a few other recent signings that could be called a bit into question. There were signings of Diddy and Brandy, and these are names that I think a lot of people, especially millennials and Gen X folks grew up with, and they’re gonna be people who have done quite a bit in the music industry, but they’re at a different stage in their career. They’re hot. Their years of earning meaningful revenue for a record label aren’t necessarily where they are at this particular point in their careers. That’s okay. But does the price that was paid to get them, justify that. And I think there’s kind of an unsaid thing where if you’re signing someone who is already well off, they are likely doing this for their own choice, then it may cost a little bit more than an equivalent artist who could produce just as much from a revenue side as what you may expect from Diddy or Brandy moving forward if they don’t have that name and that cache. And to be frank, the stability to not do a deal unless it’s gonna be lucrative enough for them. And then you also have artists like Smino and Vince Staples who are talented at rap, and they definitely had the moment where you thought things were rising up, but they don’t move units like that. And then it brings you back to the broader piece of what’s happening, specifically with the JV, with quality control music. And I think that you’ve seen a lot of success there. Little Baby is one of the most successful artists that we’ve seen, but I think you just needed a few more artists, even Migos. I think that Migos in some ways from a commercial standpoint, peaked with that first culture album that came out. Culture two wasn’t able to hit the same heights and Culture three definitely wasn’t either. None of the solo artists were necessarily able to do that, and unfortunately there was some, you know, conflict between the Migos themselves. Takeoff is no longer with us. There’s just a lot that just didn’t exactly line up. It’s really tough, and it’s even tough to share it this way because I think one of the reasons you didn’t hear a lot of chatter and discussion about this is a lot of people really wanted to see Ethiopia succeed, myself included. We wanna be able to see these black executives continue to reach the highest ranks that they can because we also wanna be able to see the same, whether it’s toon feat at Def Jam or other. But the way that things are presented externally and this effort to necessarily hide things may have you thinking that these executives have more control and influence th"
