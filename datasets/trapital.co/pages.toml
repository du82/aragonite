title = "Artist Independence (with Steve Stoute)"
full_description = "May 18, 2023EpisodeArtist Independence (with Steve Stoute)Image credit: Various sources. For specific credits, please contact us. .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byToday’s Trapital episode is with Steve Stoute. It’s his third time on the podcast and this is the best one we’ve done. We talked about how UnitedMasters and Translation work alongside each other, Brent Faiyaz’ new deal with UM, record labels, streaming, and more. Here are a few highlights from our chat.Competitive advantages in musicUnitedMasters’ edge in music distribution is the value-add opportunities it offers artists. It’s not just about getting their music onto streaming services and playlists. It’s the sync placements in NBA 2K, brand partnerships with various companies, and more. This aligns with Steve Stoute’s marketing background and his ad agency, Translation.Music distribution is crowded. And since the sole act of putting on song onto a digital streaming provider is commoditized, each service needs its lane.Steve didn’t quite call UnitedMasters’ edge a “moat,” but our discussion got me thinking:Does any company in the music industry have a real economic moat?There’s a case to make for both Apple and YouTube. Their music streaming platforms sit under large corporations, which offer cost advantages. Music (and content more broadly) help them acquire customers for their core products.Their music streaming businesses still have P+Ls to manage, but the stakes aren’t the same as a standalone streamer. It’s one of the reasons why streaming services under large corporations have been quicker to raise monthly prices. They are relatively less sensitive about how the additional revenue gets split.But despite their advantages, Spotify is the dominant player in the space, with over 500 million monthly active users. It’s where most industry leaders check to monitor the performance of a song. The service is synonymous with our current generation of music.Ticketmaster does have a moat in ticketing, but venues, even the larger ones, still have a choice in which company to partner with. The Washington Commanders’ FedEx Field recently signed with SeatGeek as its ticketing partner. There’s more competition in ticketing (and live entertainment overall) than the general public may believe.Record labels’ market share is shrinking with the rise of independent artists. We’ve yet to see an independent artist become a megastar, headlining-the-Super-Bowl level artist, but deals like R&B artist Brent Faiyaz’s new UnitedMasters deal are a step in that direction.You can listen to my full episode with Steve or read below for more highlights.Competing for dealsLast week, R&B artist Brent Faiyaz teamed up with UnitedMasters to continue his independent journey. I heard from a source that the deal is likely in the $30 – $35 million range. That same source said that Faiyaz was offered a contract from Interscope that included masters reversion, but he turned that down.Masters reversion has been more common for the “de-risked” stars that labels want to continue working with. Drake, Taylor Swift, and Olivia Rodrigo signed similar deals with the majors. It helps record labels participate on the upside, maintain market share, and give artists back ownership of their assets at a certain point. But the revenue that labels collect during the initial period is still quite valuable.Brent currently has over 20 million Spotify monthly listeners, which puts him at ~260th overall. That’s higher than most independent artists and higher than a lot of signed artists. It’s been nearly ten years since Brent released his debut Black Child EP, and he is today. He has that OutKast Edge in him.But since UnitedMasters won’t own Brent’s assets, the economics must work on both sides. Let’s run some rough numbers.Spotify’s 2023 Loud and Clear report says that 470 artists’ catalogs generate at least $2 million annually on the platform, and 130 artists’ catalogs generate over $5 million. Since Brent is the 260th most listened to on the service, let’s assume he’s at $2.5 million annually. Since Spotify accounts for roughly 25% of all recorded music and publishing revenue, that would mean his music will generate $10 million this year.Brent Faiyaz is at UM’s Partner level, a white-glove service for top talent. Let’s also assume he has an 80 – 20 royalty split with UnitedMasters (80% to Brent, 20% to UnitedMasters). UM would get $2 million annually from his music revenue alone, plus any revenue from future brand deals or other opportunities.If Brent’s career continues to grow at the same rate it has the past 3-5 years, then he can recoup his advance soon. There’s risk in any deal, but Faiyaz’ sustained and consistent growth is a great sign. He’s more reliable than the flash-in-the-pan, viral TikTok stars who dominate the discussion around new artist discovery.What’s hype, and what’s real?Let’s be honest. As fascinating as new technology is, following the latest trend can be exhausting. From blockchain to the creator economy to web3 to AI, separating the real from the fake can be a full-time job.It’s easy to play Monday morning quarterback, play to the results, and laugh at the billions lost on trends that didn’t pan out, but these guesses are more complicated in the moment.FOMO is one hell of an economic driver.Steve and I talked a lot about this at length. The challenge today is that companies make the mistake of building technology in search of a solution. Technology is most successful if it has use cases beyond its enthusiast echo chambers.If you enjoyed these highlights, you’ll enjoy the rest of the episode with Steve. We also talked about:– how NIL deals are like the independent music business– building both Translation and UnitedMasters at once– brand dollars shifting from institutions to creatorsListen here:1:40 The ups and downs of entrepreneurship 6:11 Building two companies at once11:22 Positioning UnitedMasters in the music distribution space 14:15 Does anyone in music have a moat?17:25 Why Brent Faiyaz chose to sign with UnitedMasters26:00 Should the DSPs raise prices?32:00 Artists and creators becoming mini-media channels 41:03 How NIL (name, image, likeness) is like the independent music business47:35 Is Steve going to strike more NIL deals?51:10 Why every artists needs a Chief Technology Officer55:00 Separating real from hype: blockchain, to web3, to AITRANSCRIPTION:[00:00:00] Steve Stoute: They used to have a moat, but no longer do they have a moat. And I don’t think anybody independent music has a moat. I think Distro kid has a lane and TuneCore has a lane, and United masses have a lane. And, you know, others have, certain strengths about them. but, I think the only moat you have is the moat that is a true result of the success that you have. If people choose you and you build a strong business, and you’re growing, that’s the quote unquote moat. [00:00:27] Dan Runcie Intro: Hey, welcome to the Trapital Podcast. I’m your host and the founder of Trapital, Dan Runcie. This podcast is your place to gain insights from executives in music, media, entertainment, and more who are taking hip hop culture to the next level. [00:00:55] Dan Runcie: All right. We’re back with the Trapital podcast. Yeah. We got the one and only Steve Stoute here. I think this is your third time on the pod. [00:01:02] Steve Stoute: Really? I thought. I guess I thought it was twice. Thought This was my second time. [00:01:05] Dan Runcie: We did one time. We was at Empire Studio there. Yeah. We did it virtual during the pandemic, and then we got this one.[00:01:13] Steve Stoute: Oh, well, I’m fan of it. very early. You were? Yeah, I was on it very, very early. I think you’re a good job. [00:01:19] Dan Runcie: Appreciate that. [00:01:20] Steve Stoute: Thanks for having me back. [00:01:21] Dan Runcie: Thank you. Yeah. These conversations are always good. And I wanna start this one and a place we haven’t started others. I feel like we normally dive into the business, but take it a step back.You’ve been building businesses as an entrepreneur for decades now. How do you stay even keeled? How do you stay consistent with it, just knowing the ups and downs that naturally happen with building businesses? [00:01:43] Steve Stoute: Well, the fact that I appear to be even keeled is a compliment because, I certainly am emotionally attached to the businesses I build.I know there’s, you know, the saying, don’t be emotional about business, but when I’m building something from an original idea that I have, it’s, you birthed the idea. I’m emotionally attached to the success of it, and the organization around it and the perception of it. So, you’ve been through those tumultuous cycles, so you tend to not chase the highs or chase the lows.and that sounds good. but it is definitely harder to do that when you’re emotionally attached than, you know, understanding the theory that you should do that. And I think experience helps a bit, takes the edge off. But yeah, I would say to you, you just, like, for me, I’ve been able to sustain the energy andsustain through the ups and downs, through, sort of expecting them and not, chasing the highs like that’s where the big mistake is when something great happens or a series of great things happen, you know, respecting it, but not chasing it because I believe that that’s still not, gonna prevent the tumultuous time from coming. Because [00:02:58] Dan Runcie: I think the tough part with that, and this is something I know I struggle with too, it’s tying your own satisfaction, your own esteem at particular points with those highs when things are going well. Yeah. And it’s great to say those things, but I know even myself, it’s tough to be able to stay even keeled when things are going well. The phone starts ringing more, you start getting more opportunities, more looks for things. Yeah, yeah, [00:03:21] Steve Stoute: Yeah. And it becomes more hectic. And then you have to hire more people. And then that creates another set of problems and responsibilities. And look, building a business isn’t easy. I said it, the shop, know that the biggest mistake that I see is the glorification of entrepreneurs like, almond entrepreneurs. So therefore, like, you know, the sacrifice that it requires, to be able to know that failure is imminent or success is imminent that you may have an idea and you can go years without realizing the opportunity and it may go to somebody else. people ask me, how do I do it? And, you know, I’m here in San Francisco, I was, You know, in LA the day before that I was in Miami, the day before that, the day before that I was in LA again, it’s like, it just keeps going. And like, you know, not seeing your family an d sacrificing some of the comforts of home or the comforts that you have of a routine, it’s also part of the sacrifice. So it’s not easy, and you have to really be committed to it. It almost has to be your A plan, your B plan. Your C plan is that plan, like you won’t find joy or fulfillment. in doing anything else. At least that’s how I feel. [00:04:41] Dan Runcie: Yeah. I think a lot of it’s accepting those trade-offs and knowing that you can’t do it all. I think I’ve heard you talk about this on the shop as well, whether it’s so-and-so as the birthday party, so-and-so as the this, and yeah, it’s great if you can line up and do those things, but you’ve chosen this life to be able to be in LA, be in Miami, be in New York, and back to back days and Yeah, doing that requires this type of commitment to it and you can’t do everything. [00:05:05] Steve Stoute: Yeah. and hiring great people, is part of it. but putting your own personal comfort is certainly not a priority. [00:05:13] Dan Runcie: Yeah, definitely. Interesting you brought up the hiring piece because I think you’ve definitely built up a reputation as someone that’s always operating on 10. So you naturally wanna surround yourself with people that are at that level. What are some of the things that you look for to see, okay, does this person have the edge? Cuz you know you’re gonna be running all the time. Can they run with you? [00:05:37] Steve Stoute: it’s very hard to, you know, resumes or LinkedIn pages, whatever you use can tell you a lot, but they don’t measure resourcefulness or effort, right? So those things do not appear in any aspect of looking at, a person’s profile. So I’ve learned through failure, you know, I may have not, I may have, I have high, I have hired and fired. you know, 3000 plus people, you know, so you learn what are the qualities or what are the questions to ask, to try to help, mitigate that the kind of person you need for your company. It doesn’t mean that person’s bad. You could have made a bad hire, not because the person’s not good, they just don’t fit your team. I mean, you see it in the NBA all the time. Players on somebody that was on the Lakers or somewhere else goes to another team and then all of a sudden they do well cuz it’s the system, it’s the culture, it’s the coach. And that’s the same thing with employment. Like, you just may be good just not for this company. So understanding what you specifically need versus, oh, this person worked at, so tech high, or they worked at Google, they worked at Airbnb, we want that right? Pulling them into a startup or pulling them into that culture or pulling them into that product not made completely, is completely different, specifically in our case, than what they were doing over there. And not every single job transfers one to one, whether it’s the music business, the tech industry, the marketing business. We hire people at translation all the time. They came from Ogilvy. It’s like, well, that has nothing to do with us, right? Or they come from Goodbee and you’re like, well, that ain’t gonna work here, right? Why? Just because the way we are, set up, what they may be used to, the programming that they run versus what we run, they, you know, may not be a great culture fit. And so, knowing that helps mitigate that risk. So knowing who you are, knowing what kind of people respond well to your culture is an important aspect. Not only just the mission statement stuff. Yeah, great, But like really innately knowing it and feeling what works.What are the common attributes of the people that are successful at your company that are more nuanced based and knowing how to identify that in others and what other companies share those values so that people that come from those companies tend to do well at your company.[00:08:06] Dan Runcie: You mentioned how this is a tension point in music in this industry. I think we’ve seen it from time and time, whether it’s the record label side and folks on the creative versus streaming and tech coming in and some of the pushback there. I"
