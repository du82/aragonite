title = "Ghazi on Why He Will Never Sell EMPIRE"
full_description = '''October 24, 2024EpisodeGhazi on Why He Will Never Sell EMPIREImage credit: Various sources. For specific credits, please contact us.Editorial/PR: Sean T. Smith .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byThis memo is presented by Splice.Splice is home to the world’s most extensive and meticulously curated library of sounds. These sounds are behind some of 2024’s biggest hits, including the Julian Bunetta produced "Espresso" and you can hear Splice loops across the Hot 100.At Splice, they strike the balance between celebrating human creativity with AI technology. Human creativity is in control, while also having access to powerful new tools that streamline producer workflow and enhance their production process.Why Ghazi Won’t Sell EMPIRELately, it’s rare to see an independent record label or distributor that’s not looking to sell or raise money. It’s a seller’s market. Capital is flowing. Investors have more interest in music than ever before. It’s become the norm for founders to build their companies for mergers and acquisitions.But not EMPIRE.At our summit, I asked Ghazi if he’s had over/under four requests in the past year from firms trying to buy or invest in the company.Here was his response:“I haven't gotten any phone calls. No one tries to acquire because everybody knows I'm not for sale. Period. I'm dead serious. I'm living my purpose. There's no price on that. I'm one of the very few people that don't give a shit about money. For me, personally. I care about the money that I get to share with other people and the livelihood that I get to create.I used to tell people when I started EMPIRE, I want to be the Robin Hood of the music business. And I think that I've really stuck to my principles. But, people will always poke around, but it just never gets to me. Because I tell people, if this ever gets to you just shut it down.”Again, this is a less common perspective from most company leaders in the space. In 2021, Quality Control Music was acquired by HYBE. 300 Entertainment was bought by Warner Music Group. Reservoir Media acquired Tommy Boy. I’ve spoken to many who have sold in recent years. Money was a big driver for these deals, but the company also wanted to strengthen its distribution. The indies had access to talent, but felt they didn’t have the firepower to maximize the reach of their music.But in 2024, EMPIRE’s now behind the biggest hit of the year on the Billboard Hot 100 with Shaboozey’s “A Bar Song (Tipsy). It’s been the #1 song in the U.S. for thirteen weeks and counting. It’s another sign of the rise of independent music.From a personnel perspective, bootstrapped companies without exit opportunities may not attract and retain employees who want equity, ownership, and higher financial upside. My friend Nathan Barry from ConvertKit had a great post about how he turned down Spotify’s offer to buy his bootstrapped business for hundreds of millions of dollars, how the decision impacted his team, and what he did in response.But EMPIRE’s leadership core has been together for a while. Frankly, there’s been less turnover there than at some of the major record labels.Ghazi’s quote on not selling EMPIRE was picked up by Billboard and has made the rounds. Several people have reached out to me about his talk at the summit. The running joke is that more investors will reach out whenever a CEO says their company is not for sale.In many situations, it’s an effective bargaining tactic to increase a sale price. Who doesn’t want what they “can’t have”? But in EMPIRE’s case, the response from Ghazi will likely be the same as before.Our fireside chat at the summit was brief, but you can listen to the full pod here. We talked about leadership, staying hungry, and EMPIRE’s plan for big upcoming sports events in San Francisco.Dan RuncieFounder of TrapitalLike this memo? Share it! Facebook iconLinkedIn iconSubscribe to Trapital “You tell the true stories. Not just the end product, but how you get to the end product. Your point of view on it is dope.”Steve StouteCEO, UnitedMasters and Translation "The stuff that Trapital puts out is fantastic. Really interesting insights into the industry, artists trends, and market trends."Mike WeissmanFormer CEO, SoundCloud .button.is-arrow.swiper-button-disabled{ opacity: 0.3; pointer-events: none; } testimonialsRead what the industry leaders read Intersection of Hip-Hop + BusinessHip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Perfect intersection of business and entertainmentLooking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 Phenomenal Podcast!If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee The best music business podcastIf you work in — or have an interest in — the music business, Trapital is a must.Samu Rast Subject Matter Expert on the Biz of Hip HopA good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate Dan is such a great interviewer!I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue Golden Age GoodnessAs a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal One of my fave podcasts hands downI love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 Great podcast! Keep it up!I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronektestimonialsRead what the industry leaders read Hip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Looking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee If you work in — or have an interest in — the music business, Trapital is a must.Samu Rast A good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue As a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal I love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronekWant more? Check out other episodesFebruary 25, 2025Who is ‘Spotify Music Pro’ Really For? February 18, 2025The Rise and Fall of Instagram Live February 10, 2025The Biggest Surprises in Streaming Show moreSUBSCRIBE FOR FREEJoin readers who stay ahead of all the trends /*home 3 bottom signup */ .formkit-form[data-uid="7692c30a96"] .formkit-input { background: #ffffff; font-size: 20px !important; padding: 12px; padding-left: 24px !important; border: 1px solid #e3e3e3; -webkit-flex: 1 0 auto; -ms-flex: 1 0 auto; flex: 1 0 auto; line-height: 1.4; margin: 0; -webkit-transition: border-color ease-out 300ms; transition: border-color ease-out 300ms; height: 72px !important; } .formkit-form[data-uid="7692c30a96"] .formkit-submit { position: static; font-size: 20px !important; } .formkit-form[data-uid="7692c30a96"][min-width~="700"] [data-style="clean"], .formkit-form[data-uid="7692c30a96"][min-width~="800"] [data-style="clean"] { width: 100%; } button.formkit-submit { display: flex !important; justify-content: center !important; align-items: center !important; padding: 0 !important; height: 72px !important; /* Ensure this matches your desired height */ } button.formkit-submit span { height: 100% !important; width: 100% !important; padding-top: 14px !important; display: flex !important; justify-content: center !important; align-items: center !important; } /*footer signup */ .formkit-field { font-size: 19px !important; height: 72px !important; } /*end of podcast */ .formkit-form[data-uid="1e4ffd70f3"] .formkit-fields { display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; -webkit-flex-wrap: wrap; -ms-flex-wrap: wrap; flex-wrap: nowrap !important; margin: 0 auto; } .seva-fields.formkit-fields { display: grid !important; grid-template-columns: 65% 35% !important; } .formkit-form[data-uid="1e4ffd70f3"] .formkit-input { background: #ffffff; font-size: 15px; padding: 12px; border: 1px solid #e3e3e3; -webkit-flex: 1 0 auto; -ms-flex: 1 0 auto; flex: 1 0 auto; line-height: 1.4; margin: 0; -webkit-transition: border-color ease-o