title = "Arena Tours: The Art and Science Behind Sold Out Shows"
full_description = '''June 21, 2024EpisodeArena Tours: The Art and Science Behind Sold Out ShowsImage credit: Various sources. For specific credits, please contact us. .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byThis memo is brought to you by HubSpot.Now that Universal and TikTok have agreed to a deal, it’s the perfect time to level up your strategy on the short-form video platform. Our friends at HubSpot created this 25-page free guide to download. It has actionable advice on how to master TikTok marketing.TikTok is a learned skill, no different than mastering Excel, SQL, or Javascript. You will learn and create marketing approaches that will engage, convert your audience, and stand out from the pack. You can also check out TikTok for Business analytics to optimize your campaigns, identify key growth drivers, and facilitate audience connection.The HubSpot team has been day-ones for Trapital. I’m glad that we could work together on this. The importance of short-form video platforms for entertainment isn’t going anywhere, anytime soon.You can get the free downloadable report here.‍‍ .separator-line { display: inline-block; /* Inline-block to embed within text */ padding-top: .25rem; /* Top padding */ margin-bottom: .25rem; /* Bottom margin */ position: relative; /* Position relative for the pseudo-element */ width: 100%; /* Full width */ } .separator-line::after { content: ''; /* Empty content */ display: block; /* Display as a block */ border-bottom: 1px solid black; /* Bottom border */ width: 100%; /* Full width */ position: absolute; /* Absolute positioning */ bottom: 0; /* Position at the bottom */ } What’s really going on with arena tours?This week’s episode is about arena tours and the art and science behind sold-out shows. There’s been a lot of talk recently about J. Lo and others who have struggled to sell tickets, so we decided to dig in and break down the current landscape. I’m joined by my guy, CAA agent Akin Aliu.You can listen here or read below for some highlights.There have been several articles and viral tweets about well-known artists who have struggled to sell their arena concert tours in recent months. The Black Keys, Charli XCX, Porter Robinson, and the list goes on.There’s a lot of finger-pointing and a lot of schadenfreude, but are we cherry-picking the bad news?Artists like Asake and Burna Boy have sold out arena-level venues. 50 Cent’s The Final Lap Tour has sold well too, especially outside of North America. Artists in other genres, like Pearl Jam, have sold out these same venues without an issue.But that said, we knew there would be pent-up demand post-pandemic, but how long will that last before things level off?Fans have more things than ever that compete for their attention. Having a “good” tour isn’t enough. It needs to be a can’t-miss event that people are willing to leave their houses and spend their time and money on. People need to feel the urgency when they first hear that tickets are on sale.Also, the cost of the tour has risen! That puts pressure on artists to get higher guarantees from promoters for their shows. At a certain level, an arena is the smallest venue size that can fulfill that guarantee.Every few weeks, I walk by the Chase Center in San Francisco to see an upcoming concert and say to myself “Really? That artist is in arenas now? Yeah, good luck with that.” Sometimes I was pleasantly proven wrong, but other times I was not.But Chase, like other arenas and stadiums, are either owned or operated by one of the major events promoters. Those promoters get a cut of ancillary revenue from the concert, which shifts the incentives decision-making for certain tours.It can lead a promoter to push for a show in a larger venue because the revenue they get from ancillary sources may offset the money lost from the guarantee.The larger tour also gasses up the ego of an artist who wants to be at an arena level and wants to bet on themselves, even if they’re not there yet.You should listen to the full episode here or read below for more highlights.The art and science of predicting demandWhen Akin and I talked about estimating demand, I remembered my time working at Delta Air Lines. That industry has revenue management down to a science. If you want to fly from Los Angeles to Tokyo on August 19, there are endless data points to determine the exact price, size of the plane, the lifetime value of a customer who purchases that flight, and how many no-shows to expect on the flight.Touring is different. There are far fewer data points, yet more intangibles. It’s both art and science.In 2019, Nicki Minaj and Future couldn’t sell their joint arena tour, NICKIHNDRXXX, in North America, so they shelved it. But in 2024, Nicki Minaj’s arena tour added extra shows and will be one of the highest-selling hip-hop tours yet.Meanwhile, Jennifer Lopez, who had a successful arena tour in 2019, had to cancel her arena tour in 2024. Which historical data points could have predicted either outcome? In live music, data needs to be matched with an understanding of the culture and context.Your followers (and listeners) aren’t your fansWe’ve talked often about how social media followers don’t translate to album sales. That dynamic is even more true for selling concert tickets. Neither followers, streams, or soft tickets sold at a nightclub or festival may have a direct correlation to hard ticket sales at an artist’s own concert.The music industry is building its superfan products for an artist’s most passionate fans. Those products are built to maximize recorded music and publishing revenue, but some of those tools may be even more effective at identifying concertgoers. Right now, superfans may leave money on the table on DSPs, but the live business and vinyl sales capture a lot of that market.The tools may improve, but mastering the touring business will continue to be both an art and a science.Listen to the rest of the episode for more on:– Planning touts for newer artists with big songs, like Tommy Richman– why do some agents take bigger risks for their artists than others– how to package a unique concert to sell to fansChartmetric stats of the week – Charli XCXThe British singer’s tour may not have taken off as expected, but her fanbase still shows up to stream her music. Her Spotify popularity index is at 82, which is the highest it has been for her since the stat has been tracked.Dan RuncieFounder of TrapitalLike this memo? Share it! Facebook iconLinkedIn iconSubscribe to Trapital “You tell the true stories. Not just the end product, but how you get to the end product. Your point of view on it is dope.”Steve StouteCEO, UnitedMasters and Translation "The stuff that Trapital puts out is fantastic. Really interesting insights into the industry, artists trends, and market trends."Mike WeissmanFormer CEO, SoundCloud .button.is-arrow.swiper-button-disabled{ opacity: 0.3; pointer-events: none; } testimonialsRead what the industry leaders read Intersection of Hip-Hop + BusinessHip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Perfect intersection of business and entertainmentLooking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 Phenomenal Podcast!If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee The best music business podcastIf you work in — or have an interest in — the music business, Trapital is a must.Samu Rast Subject Matter Expert on the Biz of Hip HopA good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate Dan is such a great interviewer!I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue Golden Age GoodnessAs a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal One of my fave podcasts hands downI love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 Great podcast! Keep it up!I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronektestimonialsRead what the industry 