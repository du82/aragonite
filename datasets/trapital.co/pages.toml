ture who curates other trend setters from across the globe. Salute!Mrkamal I love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronekWant more? Check out other episodesFebruary 25, 2025Who is ‘Spotify Music Pro’ Really For? February 18, 2025The Rise and Fall of Instagram Live February 10, 2025The Biggest Surprises in Streaming Show moreSUBSCRIBE FOR FREEJoin readers who stay ahead of all the trends /*home 3 bottom signup */ .formkit-form[data-uid="7692c30a96"] .formkit-input { background: #ffffff; font-size: 20px !important; padding: 12px; padding-left: 24px !important; border: 1px solid #e3e3e3; -webkit-flex: 1 0 auto; -ms-flex: 1 0 auto; flex: 1 0 auto; line-height: 1.4; margin: 0; -webkit-transition: border-color ease-out 300ms; transition: border-color ease-out 300ms; height: 72px !important; } .formkit-form[data-uid="7692c30a96"] .formkit-submit { position: static; font-size: 20px !important; } .formkit-form[data-uid="7692c30a96"][min-width~="700"] [data-style="clean"], .formkit-form[data-uid="7692c30a96"][min-width~="800"] [data-style="clean"] { width: 100%; } button.formkit-submit { display: flex !important; justify-content: center !important; align-items: center !important; padding: 0 !important; height: 72px !important; /* Ensure this matches your desired height */ } button.formkit-submit span { height: 100% !important; width: 100% !important; padding-top: