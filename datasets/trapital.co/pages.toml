title = "Def Jam Recordings: A 40-Year Legacy"
full_description = '''September 22, 2023EpisodeDef Jam Recordings: A 40-Year LegacyImage credit: Various sources. For specific credits, please contact us. .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byPowered by RedCircleToday’s episode and memo is about the one, the only, Def Jam Recordings. It’s hip-hop’s most influential label, and its backstory was fun to dig into. I’m joined by friend of the pod, Zack O’Malley Greenburg. We talk about the highs, like Def Jam’s peak years. But we can’t talk about Def Jam without mentioning the lows, like co-founder Russell Simmons’ numerous allegations of sexual assault and misconduct. It’s nearly a 40 year history, and we covered it all.You can listen to the episode here or read highlights below.More Def or more Jam?In an interview with VladTV, Russell Simmons shared why he and Rick Rubin parted ways in 1988:"It kind of split us apart because I'm making Oran "Juice" Jones [R&B singer] "Walking in the Rain" and he's making Slayer [thrash metal]… so then he left… He and Lyor [Cohen] didn't get along that well at the time… if we had all stayed on hip-hop and we didn't think about Oran "Juice" Jones or Slayer, God knows what we would have done."Simmons once said Def Jam got its name because Rubin was more “Def,” while Simmons was more “Jam.” At best, the combo paved the way for LL Cool J, The Beastie Boys, and Run DMC. But at its worst, the split identity left a label and its artists straddling multiple worlds.Ironically, each Def Jam phase has leaned one way or the other. Redman’s successful 1992 debut, Whut? Thee Album, was a turning point for Def Jam. The label was $19 million in the red at the time—bleeding money. But Reggie Noble’s success set the tone for Def Jam’s 1990s focus on hardcore New York rap.A decade later, though, once Def Jam was entirely under the major record label umbrella, it leaned more into the “Jam.” Then CEO L.A. Reid was in superstar-building mode. L.A. admittedly dropped Lady Gaga too soon, but he was there for the rise of Rihanna, Ne-Yo, Justin Bieber, and “Stadium Ye” Kanye West.By the mid-2010s, though, Justin Bieber was the most bankable artist on the roster. His 2015 album Purpose is the label’s highest-selling album release since Ye’s 2007 classic, Graduation.People often comment on Def Jam’s shift away from its core, but to be fair, Def Jam’s co-founders couldn’t agree on its core either!Like most companies, the brand evolves with each of its leaders. The major label incentives pushed those leaders to focus on market share, efficiency, and landing hot artists. And those incentives make it hard to turn down a commercially successful artist like Bieber.Listen to the full episode here or read below for more highlights.The infrastructure for new entrantsTo prep for this episode, I asked a handful of industry execs which Def Jam CEO was most effective at their job. Most of them gave me different answers. There’s no correct answer, but here are two wise moves worth mentioning.In the mid-90s, Russell Simmons was reportedly frustrated when Bad Boy and Death Row execs got on the cover of VIBE, but Russell couldn’t get on.It was humbling, but Def Jam saw an opportunity to shift its brand. Instead of being the brand in front, Def Jam became the infrastructure for several sub-labels to stand out in front. Def Jam had deals with Roc-a-Fella Records, Murder Inc., and Disturbing Tha Peace. Def Jam backed them like an institutional VC firm that invests in emerging fund managers.Those labelheads were younger, closer to the ground, and tapped into their respective regions. It allowed Def Jam to stay present and benefit from those companies. We covered Roc-a-Fella’s story recently. Murder Inc. had its moment with Ashanti and Ja Rule, and every Ludacris album in the early 2000s was a hit.In most cases, record label imprints or labels housed under other labels gain little traction. Many are merely vanity projects. In hip-hop, the best examples are Def Jam’s sub-labels and Young Money under Cash Money Records. There are a few others, but the list of good examples is few and far between.How DMX and Jay-Z fueled the Def Jam saleThe other smart move in Def Jam’s late 1990s run was its sale to Seagram, which owned Universal Music Group at the time. Seagram recently bought PolyGram, which had owned 60% of Def Jam, and now Seagram’s UMG wanted the rest.In our episode, Zack told how Def Jam was offered $50 million but turned it down. Then, Seagram countered with $34 million, so Def Jam went to the drawing board.Seagram had valued Def Jam on a multiple of revenue, not EBITDA. So Def Jam set out to maximize its revenue. Lyor and Russell went to their top two artists on the label, DMX and Jay-Z, and asked them to release another album by the end of 1998.X gets a $1 million bonus for Flesh of My Flesh, Blood of my Blood released just seven months after his debut album, It’s Dark and Hell Is Hot. Jay-Z released Vol 2… Hard Knock Life just ten months after In My Lifetime, Vol. 1.Here’s a quote from former Def Jam exec Kevin Liles in a 2016 interview with The Fader:KEVIN LILES: "The consumers were starving. X fed that hunger — that hunger for realness, that hunger for the street. And what better way to serve it up than to give two full entrees in the same year? … LYOR COHEN: There was a huge demand and very little supply. We don't typically do what you're supposed to do. We focus on what we should do.IIn 1998, Def Jam made $40 million in profit on an estimated $176 million in sales! Seagram bought the remaining 40% stake for $100 million, double the initial offer.DMX was feeling himself after that one, and rightfully so. From The Fader in 2016:DMX: I made $144 million dollars for [Def Jam] that first year. I felt vindicated. I knew I was fucking dope. Not in an arrogant way, but in a way that was like, "Yes, I dare to believe in myself." And I turned out to be right. And dropping two albums in one year, it sped up the pace of how music is put out. It set a new standard.I’m sure X would have felt even more vindicated with an even larger bonus thought!This is still one of my favorite hip-hop best business deals. It’s a high-stakes M&A deal at the industry’s peak. It was well-timed. Def Jam did give up ownership and control, but at least it maximized the check in the process.In the rest of the episode, we also talked about:-Jay-Z’s tenure as CEO– Def Jam Vendetta, Def Poetry Jam, Def Comedy Jam– which CEO was most effective?– underrated moves, missed opportunities, and moreListen to the episode here or watch below:‍TRANSCRIPTDan Runcie [00:00:00]:You can’t tell the story about hip hop without telling the story about Def Jam. This company is the blueprint. It set the foundation for the music, the fashion, the culture, the entertainment, and so much of what hip hop is still considered today. And in this episode, we break it all down. We start from the beginning. Who were the founders? Russell Simmons and Rick Rubin. The company they built, how they connected, and the vision that they saw together. Other we talk about the highs. We talk about the lows. We talk about the different leaders that this company has had and the different evolutions that this company has had as well. From a young and budding independent record label trying to break through with a unique sound, to making some of the biggest deals in the 90s, recovering, making its comeback, and making some big bets to eventually have one of the big landmark deals in hip hop at the time. We also talk about where the label is today and where the label has been since it’s been under the major record label umbrella. We talk about some of the highs, some of the lows, some of the best signings which CEO we think was the best as Def Jam CEO and so much more. So if you’ve loved the breakdown episodes we’ve done on Trapital, you are going to really enjoy this one. So let’s dive in, let’s go back to the early eighty s and let’s revisit Def Jam. All right, I’m back with Zach Greenberg and we are about to break down a company that’s been on the list for a minute. We’ve been circling this one for a while, so I’m glad we’re finally about to dig into Def Jam. How you feeling?Zack O’Malley Greenburg [00:01:28]:Not too bad, not too bad. I feel like we kind of talked around a lot of Def Jam stories on prior episodes, but there’s like a whole bunch that I wanted to get into. So now we have the whole episode to take. I’m stoked.Dan Runcie [00:01:40]:Yeah, same here. The Cash Money episode we did, we started with this whole question about was Cash Money the greatest record label of all time? And I think we landed on both of us agreeing that Def Jam was. But the distinction that you made, which I agreed with, was that Cash Money, better business, Def Jam more influential, greater record label. And I think that’d be a good place to start from a high level. Why do you think that? And then I can share my thoughts, too.Zack O’Malley Greenburg [00:02:08]:Yeah, I think just it’s kind of a basic smell test, right? When somebody asks you what’s the greatest hip hop label of all time? It probably would jump to mean maybe you throw out a bunch of names. But I think for most people, Def Jam would be the first name that comes to mind. It’s kind of synonymous with hip hop. It was the first big early label. It maintained its influence over many decades, and then you’d probably be like, oh, yeah, but also Cash Money. And then you start to go down the list and talk about some other labels. But I think just like the cultural clout, the know, that sort of thing puts Def Jam up. You know, is it really the better Business? I mean, if you look at the numbers that Def Jam ultimately sold for, and we get into that as we go through the mean, cash Money, I think, has actually gotten a pretty comparable valuation over the years, know, maybe bigger, depending on when you kind of take the snapshot. Of course, like, you don’t really hear as much about Def Jam artists not getting paid. So maybe that’s part of the better business. For whom? But there you have it. I think with Cash Money, it’s like a pretty tight focus on a certain sound in the early days, kind of pivoted more in the recent era, but you kind of have more of a through line of what Cash Money is over the years. And Def Jam, I think, particularly over the past decade or two, has lost some of its identity. It’s kind of floating. It’s a little bit adrift in the maze of the corporate record infrastructure, but still relevant. And it’s got a lot of heritage to lean on. So, yeah, I think that’s the Def Jam versus Cash Money. I don’t know, what do you think?Dan Runcie [00:04:01]:Better business for whom? Is probably a good place to put it. But I agree with the broader sentiment of if you’re trying to tell the story of hip hop, you’re trying to capture the journey, especially once you get past the early years of hip hop’s founding and what really helped craft the art form to what it is. And this is probably a good place to get into some of the backstory here. Def Jam created what people identify as the modern record label, and its founders had a big influence on what people consider to be hip hop and how people think about hip hop, not just the music, but all of its various extensions. And those two founders, Russell Simmons and Rick Rubin, I think it’s interesting to look at what they were doing before Def Jam and how they got to this spot. How they got to this spot. So, of course, famously, the record label idea comes from Rick Rubin himself. And he’s a student at NYU, and he’s in his dorm room. He was really interested in rock music and producing and making music, but really wanted to lean into a record label and he wanted to create his own imprint. And he really identified with a lot of hip hop. I think one of the things that he said that stuck out to him was a lot of the hip hop at the time was much more focused on taking soul records or taking disco records and then rapping over them. That was definitely a lot of the Sugar Hill record style production. But there wasn’t as much of the true beat making The B-Boys and the style and the aesthetic that was a bit more native to what people think about. When you think about hardcore New York hip hop in that type of way or even things like how a verse leads into a chorus and then you have another verse and then you repeat that chorus again, something that sounds so obvious. It really wasn’t that. And I think that’s one of the things that Ruben really helped craft, especially in those early years.Zack O’Malley Greenburg [00:06:01]:Yeah, definitely. And it’s such an unlikely pairing, right? I mean, you have Russell Simmons, who was kind of bouncing around the early days of hip hop, helping elevate some of the early superstars like Curtis Blow selling fake weed on the side, or so he says. And, you know, like Rick Rubin, who’s just but I don’t know. Was he a hippie back then, too? Did he have the hair and the beard? I don’t know. But he know this hard rocking college student know really into thrash metal and stuff like of it’s kind kind of a strange mix. But like you say, that’s kind of the magic that created Def Jam. And I think Rick Rubin really did give hip hop a harder edge. And weirdly, I think it came from rock, right? It was that rock, that kind of like metal sensibility that maybe kind of took the flashy shine off a little bit of that sort of early disco rap, like the early kind of stuff that Russell Simmons was pushing and gave it that a bit of an edge. Which is funny because hip hop, of course, originated from the streets in the South Bronx and stuff. But it did have that disco element. So in a way, it was like coming downtown, getting the rock aspect added to it that made it musically sound like a little harder edge. And certainly when you start to see like, Cool J and you know, it sounds definitely different from the very disco inflected kind of early hip hop. Yeah, quite an OD marriage, I think. Not the most harmonious marriage all the time, but I think in the way that sometimes that’s how you get the best creative work. Lenon, McCartney, or if you look at even Jay Z and Nas over the years, I know they didn’t necessarily work together, but like pushing each other know, inspiring each other to create better know simply through their rivalry. And so, yeah, I think that’s kind of what you got in some way from Rick Rubin and Russell Simmons and.Dan Runcie [00:08:21]:How these two met always sticks out to me. So they met at this party for this TV show in the early 80s called Graffiti Rock. It’s this pilot episode that they were having. And then they meet there and they knew of each other’s work. Ruben was really admiring what Simmons was doing, especially at the time, he had had Rush Productions and he was '''
