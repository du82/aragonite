title = "Founder Mode vs. Manager Mode with Believe’s Denis Ladegaillerie - Trapital Summit"
full_description = '''December 9, 2024EpisodeFounder Mode vs. Manager Mode with Believe’s Denis Ladegaillerie - Trapital SummitImage credit: Various sources. For specific credits, please contact us.Sean T. Smith .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byThis memo is presented by Warner Music Group.Amy Allen is reshaping modern music. She is up for four GRAMMYs®, including Songwriter of the Year, Non-Classical, a nomination she's earned twice. Allen is also Variety Hitmakers 2024 Songwriter of the Year.The GRAMMY® and Ivor Novello Award-winning songwriter, producer, and artist is a driving force behind hits for Sabrina Carpenter, Harry Styles, Olivia Rodrigo, Selena Gomez, Tate McRae, and Halsey. She was the only co-writer on every single song on Sabrina Carpenter’s Short n’ Sweet. She is also a finalist for the 2024 Billboard Music Awards Top Hot 100 Songwriter category.Flying high and diving deepAt our summit, both Denis and EMPIRE founder and CEO Ghazi referenced the need to “fly high and go deep” when running their companies. It hits at the balance of founder mode and manager mode.Now, we’re a few months away from the initial buzz from Paul Graham’s essay and the exhausting discourse it created. Instead of debating one or the other here, let’s discuss their relevance in music and entertainment.At the major record labels, the incentives for their leadership do not line up with founder mode. Their executive teams are compensated by market share, chart performance, and quarterly performance. These companies are designed to be run in manager mode. The music companies that can truly decide between founder and manager mode are the standalone streaming services like Spotify, independent record labels, and live music companies.The more polarizing leadership debate in music is whether a CEO is a “music person.” Are they a “creative” or a “suit”? Did they “come from music” or “come from outside”? Every leader gets put into a bucket, and much of the journalism about them is done through this lens. I even hear it about Trapital! I wish I had a dollar for every time someone told me, “But you’re a tech guy,” or something similar.Regardless of where a leader in music comes from, there needs to be a focus on internal alignment. They run vastly different business lines that all need to operate together—recording, publishing, distribution, radio, merch, and more. Without effective communication and leadership, these areas can operate in silos and create issues. The goal for most artists is to maximize distribution and reach. They want to be present on legacy mediums like radio and emerging platforms that are on the cusp of breaking out. Each part of the company needs to talk to each other to make that happen, which needs to stem from the person at the top.People, strategy, executionWhen I pitched our Summit topic idea to Denis, he sent me back a video from Apple CEO Tim Cook who explained his three focuses on how he runs the company:“I spend almost all my time on people, strategy, and execution. Most everything else falls from those. If you have the most brilliant people, wicked smart people who collaborate well together. In our case, we’re all about products, so our strategy is very product-oriented. And if you’re executing like crazy, there are some things that still arise, but if you get those three right, the world is a great place.”A lot of “founder mode” believers may look at Steve Jobs’ return to Apple in 1997 as the ultimate founder mode story arc. There’s literally a movie about it. But “manager mode” believers may point at Cook's growing Apple from its $350 billion market cap in 2011 to a $2.5 trillion company today. Again, there are success stories on both sides of the debate.At the Summit, Denis also talked about the hundreds of hours he has spent understanding algorithms and AI tools to make sure he fully understands the landscape. That taps back into the founder mode mentality. AI has too much potential influence in music for that work to be delegated passively.Denis and I also talked about how he navigated Warner Music Group’s acquisition attempt, Believe’s plans to spend hundreds of millions of Euros on potential acquisitions in 2025, and more. You should listen to the full episode here.Chartmetric Stat of the WeekOn November 20, Spotify announced that Bruno Mars and Lady Gaga's “Die With A Smile” became the fastest song to hit 1 billion streams. I was surprised. I heard the song when it first came out, but I’ve yet to hear it outside that much. Not the way I’ve heard “Not Like Us” or “Espresso” everywhere. And that may be because I live in a bubble… called the U.S.!Only 18% of “Die With a Smile” Spotify streams (around 200 million) came from the U.S., compared to 46% from the U.S. (over 420 million streams ) for Kendrick Lamar’s diss track.Dan RuncieFounder of TrapitalLike this memo? Share it! Facebook iconLinkedIn iconSubscribe to Trapital “You tell the true stories. Not just the end product, but how you get to the end product. Your point of view on it is dope.”Steve StouteCEO, UnitedMasters and Translation "The stuff that Trapital puts out is fantastic. Really interesting insights into the industry, artists trends, and market trends."Mike WeissmanFormer CEO, SoundCloud .button.is-arrow.swiper-button-disabled{ opacity: 0.3; pointer-events: none; } testimonialsRead what the industry leaders read Intersection of Hip-Hop + BusinessHip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Perfect intersection of business and entertainmentLooking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 Phenomenal Podcast!If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee The best music business podcastIf you work in — or have an interest in — the music business, Trapital is a must.Samu Rast Subject Matter Expert on the Biz of Hip HopA good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate Dan is such a great interviewer!I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue Golden Age GoodnessAs a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal One of my fave podcasts hands downI love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 Great podcast! Keep it up!I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronektestimonialsRead what the industry leaders read Hip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Looking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee If you work in — or have an interest in — the music business, Trapital is a must.Samu Rast A good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue As a guy who came up in NYC during the late 90s / early 2000s rap scene,