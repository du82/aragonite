full_description = '''Trapital Summit is the premier place for visionaries and innovators in entertainment and technology. We have a curated lineup of top speakers to join us for intimate, fireside chat style conversations and to discuss their big ideas for the future.‍Our goal is to bring together inspiring leaders like you to build relationships with each other and make lasting connections that will push your business to the next level.‍Join us on Wednesday September 10, 2025 at NeueHouse Hollywood in Los Angeles, CA for a day full of inspiring conversations.‍Speakers include top leaders in entertainment, technology, and more.‍Trapital Summit is hosted by Trapital's Dan Runcie and is brought to you by several leading companies that are pushing the industry forward.Register NowBecome a PartnerGain insights from every sessionFireside chats with top executivesMost conferences are full of panels with four or five people, where each person only has a few talking points.Not the Trapital Summit. Each of our speaking sessions on stage are one-on-one fireside chats with the leaders you want to hear and learn from.Networking opportunitiesOur attendees at the summit are as impressive as the people on stage. This event attracts executives, founders, investors, and more.We schedule in plenty of time for you to meet and build relationships with each other.Join hundreds of leaders for a unique dayThe one thing we heard from our 2024 attendees was, "This event felt different."The types of discussions, the people on stage, the quality of people in the room, the honesty and insights shared, and more. That was our goal. We can't wait to do it again.Past Summit SpeakersIssa RaeFounder and CEO, HOORAETroy CarterCEO, Venice MusicGhaziFounder and CEO, EMPIRESherrese Clarke SoaresFounder and CEO, HarbourView Equity PartnersCarletta HigginsonEVP, Chief Digital Officer, Warner Music GroupLarry JacksonCo-Founder & CEO, gammaKakul SrivastavaCEO, SpliceTunji BalogunCHAIRMAN & CEO, DEF JAM REC