title = "A24 Wants to Evolve. Can it Maintain its Brand Along the Way?"
full_description = 'June 7, 2024EpisodeA24 Wants to Evolve. Can it Maintain its Brand Along the Way?Image credit: Various sources. For specific credits, please contact us. .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byThis memo is brought to you by HubSpot.Each week, I learn new ways to be more efficient at Trapital thanks to new AI tools. If you read this newsletter often, the same is likely true for you too.My friends at HubSpot agree. They made this free guide for you, Supercharge Your Workday With ChatGPT.It’s full of insights that you can implement today, like these:– Improve your superfan strategy by segmenting your fanbase– Streamline your email marketing so your messages resonate– Discover unique ways to break through the noise with your next major releaseThe guide has a full list of 100 AI prompts like this that you can tweak for your needs.We’re all figuring out how to do more with less. These tools help us get 1% better every day. Get your free guide here.The future of A24This week’s memo and podcast are on A24. The beloved film studio made a name for itself with low-budget, high-volume, auteur-driven movies. But after a few box office misses, outside investments, and bigger ambitions, there’s a big question:Can the indie darling maintain its identity as it expands?I’m joined by Dr. Marcus Collins to break it all down. You can listen to us here or read a few highlights below:When Cord Jefferson won his 2024 Oscar for Best Original Screenplay, he dropped a line about Hollywood that went viral:“Instead of making one $200 million, try making 20 $10 million movies.”Ironically, that’s the model for Tyler Perry Studios, which was not-so-subtlety critiqued in Jefferson’s film, American Fiction.But that has also been the A24 model for over a decade. A24 gave us Hereditary, Moonlight, and Everything, Everywhere, All At Once, and more. Hit after hit. But after a sluggish stretch in 2023 and an influx of outside capital, the indie darling faces pressure to become more like the companies it once distinguished itself from.A24 now wants to produce bigger-budget films that can command more dollars at the box office attendance. It also wants to acquire popular IP-based projects, like its rumored interest in the Halloween franchise.The ambitions are understandable. Those investors who got in A24 at a $2.5 billion valuation want to see a return from their $225 million investment. And it’s harder to do that with films from a studio that has yet to generate $225 million in box office revenue from a single movie.Changes are inevitable. Can the beloved indie darling maintain its energy along the way?The difficult taskThe path that A24 is on isn’t uncommon. It works like clockwork, especially in media and tech. Here’s the flow:– An upstart company notices a gap in the market and embraces new tech trends to address it– It solves the problem successfully and profitably, yet at a much smaller scale than the incumbents– As the indie grows, it faces pressure to expand due to economic trends, rising costs, market, or regulatory changes– It feels pressure (internal and external) to scale– It eventually gets acquired by an incumbent and evolves into a clone of the incumbent, losing its unique edgeThis happens in the music business often. Look at the individual labels and companies owned by Universal, Sony, and Warner Music Groups. The logos on those pages are full of brands that started as unique standalone entities with distinct brands and genres.It’s not that those companies lacked the skills or patience to break through. They lacked the major label’s moat— their back catalog of valuable music, that provides cost and resource advantages that well-funded upstarts can struggle to surpass. If you can’t beat em, join em.Hollywood has had its own examples of this. Miramax, which was acquired by Disney in 1993, faced ongoing tension with its parent company until the founders left the business.For A24 to expand and scale without diminishing its brand, it needs to acquire an IP that fits its brand ethos.Halloween makes perfect sense, and there are plenty of other good horror fits too. A24 could revamp one of the campier IP stories. Sony is reportedly planning on another sequel for I Know What You Did Last Summer. The original was a classic “not good but peak 90s nostalgia” movie that was popular enough for a sequel at the time. What would an A24 version look like? There are plenty of franchises where that came from.We want to be them, they want to be usIn our recent episode, Why Top Artists Stick With Record Labels, we talked about how record labels and distributors have become more like each other. Labels now offer more flexible deals. Distributors offer bigger advances and more label services. Their worlds have blended.A24 and Hollywood are similar. A24 wants bigger budgets, IPs, and franchises. The major film studios want to fight franchise fatigue with lesser-known IP and original stories.Despite the tradeoffs for both sides, they face the same post-pandemic challenges in theaters:– A movie being “good” isn’t enough to generate box office returns– Due to streaming, beloved movies that are box office misses rarely get the same second life in DVD or VHS sales that they once did– People aren’t showing up in droves to the box office unless it’s an event movie.Sure, there are exceptions. The Northman (2022) did quite well in on-demand sales, deservedly so. But that’s not the norm. Well-reviewed 2024 movies like The Fall Guy and Furiosa will have to hope for similar on-demand success given their big budgets, massive marketing spends, and tepid ticket sales.Despite the challenges, I believe that A24 will figure this out. This is a hit-driven business. All it takes is one or two big hits, especially if those hits are from bigger swings. It won’t be easy, but the opportunities are out there.Listen to the rest of the episode! We also covered:– Marcus’ pitch to HBO for its Max rebrand– Our favorite A24 films– Misconceptions about “coastal elite” and “middle of the country” audiencesChartmetric stat of the weekOne of the original A24 films is Spring Breakers, which has a bunch of fun needle drops like Nicki Minaj‘s “Moment 4 Life” with Drake. It’s a 13-year-old song that has gotten at least 233 spins per week in the past year on terrestrial radio.Dan RuncieFounder of TrapitalLike this memo? Share it! Facebook iconLinkedIn iconSubscribe to Trapital “You tell the true stories. Not just the end product, but how you get to the end product. Your point of view on it is dope.”Steve StouteCEO, UnitedMasters and Translation "The stuff that Trapital puts out is fantastic. Really interesting insights into the industry, artists trends, and market trends."Mike WeissmanFormer CEO, SoundCloud .button.is-arrow.swiper-button-disabled{ opacity: 0.3; pointer-events: none; } testimonialsRead what the industry leaders read Intersection of Hip-Hop + BusinessHip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Perfect intersection of business and entertainmentLooking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 Phenomenal Podcast!If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee The best music business podcastIf you work in — or have an interest in — the music business, Trapital is a must.Samu Rast Subject Matter Expert on the Biz of Hip HopA good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate Dan is such a great interviewer!I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue Golden Age GoodnessAs a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal One of my fave podcasts hands downI love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 Great podcast! Keep it up!I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronektestimonialsRead what the industry leaders read Hip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Looking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee If you work in — or have an interest in — the music business, Trapital is a must.Samu Rast A good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue As a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal I love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening