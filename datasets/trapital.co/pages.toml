title = "Disney’s Pop Star Pipeline"
full_description = 'February 3, 2025EpisodeDisney’s Pop Star PipelineImage credit: Various sources. For specific credits, please contact us.Via Shutterstock .redcircle-link:link { color: #ea404d; text-decoration: none; } .redcircle-link:hover { color: #ea404d; } .redcircle-link:active { color: #ea404d; } .redcircle-link:visited { color: #ea404d; } Powered by RedCircleListen topresented byThis memo is presented by Measure of Music.Measure of Music returns for its milestone fifth year from February 21-23, 2025, bringing together global voices in music, tech, and data. With industry-leading speakers, networking opportunities, a career fair, and an exciting hackathon, this virtual event is designed to break down barriers for marginalized communities and provide access to the music business. Featuring keynote speaker Cherie Hu, plus support from The Orchard, Songkick, Chartmetric, and more, this is your chance to learn, connect, and shape the future of music. Don’t miss out—register today and be part of the movement at Measure of Music!For pop stars, Disney is an unrivaled launchpad. It’s the Y-Combinator for entertainment. The product that comes through its system will increase its odds of success. That’s especially valuable in power law-driven fields like startups and entertainment, where the top 0.1% reap most of the rewards. Even the artists whose music careers don’t take off, like Zendaya and Vanessa Hudgens, can still find greater success on the big screen.But unlike Y-Combinator, where founders lean on their YC participation for the rest of their careers, Disney’s child prodigies will inevitably want out.They all reach a point where they no longer want to be seen as that cute, adorable kid. Instead, they want to swear in their music and talk about their sex life and other adult themes.There’s a clear rebrand in their whole aesthetic, like Christina Aguilera’s “Dirrty” music video, Justin Timberlake’s music with Pharrell and Timbaland, Miley Cyrus twerking at the VMAs, and Sabrina Carpenter’s fashion and style.This also means that these stars are less likely to sign with Disney’s in-house label, Hollywood Records. Olivia Rodrigo was offered a deal with Hollywood but instead signed with Geffen Records, entered the major record label system, and her career has taken off.Very few Disney artists want to take the Hilary Duff route. She stuck with Disney for her music during her Lizzie McGuire days. But when she became older and wanted to shift the nature of her show, it was at odds with Disney’s vision, which led to the end of her show and her time with the record label.The tension between Disney’s approach and its talents is timing. Disney’s job is to consistently entertain kids, tweens, and their families. Its target audience is stagnant, even as the individuals in that audience grow out of its content. That was true in the Mickey Mouse Club days and it’s true today.But the talent’s job is to build a fanbase that operates like a moving parade. That parade often ages along with the artist. In 1998, Justin Timberlake was a teenager who served a core audience of millennial teenagers. They were much closer in age to the Mickey Mouse Club’s target audience. In 2025 though, Timberlake, 44, still serves a largely millennial fanbase who are now older too. Many of them are now in their 40s and may have their own kids who are in Disney’s target demo. To best serve a moving parade, the artist’s music, and content needs to evolve.The pop star’s desire to move on from Disney is built into the design. The benefits are great but no one wants to stay too long. Like many things in life, the reward for eating pie is more pie. In this case, that pie is an ice cream cake with a screen-printed picture of Elsa and Moana at the top of the cake. That might be great for a 6-year-old but not a 16-year-old.Listen here: ​Apple​ | ​Spotify​ | ​OvercastChartmetric Stat of the WeekIt’s been four years since Olivia Rodrigo’s drivers license. The week before it dropped, Rodrigo had 75,000 YouTube subscribers. One month later, that number skyrocketed to 1.25 million. Today, she’s closing in on 15 million subscribers. That’s some hockey stick growth right there.Dan RuncieFounder of TrapitalLike this memo? Share it! Facebook iconLinkedIn iconSubscribe to Trapital “You tell the true stories. Not just the end product, but how you get to the end product. Your point of view on it is dope.”Steve StouteCEO, UnitedMasters and Translation "The stuff that Trapital puts out is fantastic. Really interesting insights into the industry, artists trends, and market trends."Mike WeissmanFormer CEO, SoundCloud .button.is-arrow.swiper-button-disabled{ opacity: 0.3; pointer-events: none; } testimonialsRead what the industry leaders read Intersection of Hip-Hop + BusinessHip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Perfect intersection of business and entertainmentLooking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 Phenomenal Podcast!If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee The best music business podcastIf you work in — or have an interest in — the music business, Trapital is a must.Samu Rast Subject Matter Expert on the Biz of Hip HopA good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate Dan is such a great interviewer!I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue Golden Age GoodnessAs a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal One of my fave podcasts hands downI love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 Great podcast! Keep it up!I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronektestimonialsRead what the industry leaders read Hip-hop mirrors the business world in a lot of ways. While I’ve always thought and known that, it’s great to see those ideas brought to life by someone so knowledgeable about both of those things. Huge fan of Trapital.PPLS CHAMP Looking forward to future episodes of Trapital. I’ve been following the newsletters for awhile and always learn something new that’s relevant to hip hop and business. Great job getting the nuggets of info from Matthew Knowles on the 1st episode, can’t wait until the next one!Cburns08 If you’re looking for a podcast with a wealth of info on the business of hip hop, then Trapital is your new home. Dan is an excellent host who has a myriad of of experienced guests to talk their role in the business of hip hop. Check it out!RoyalSkegee If you work in — or have an interest in — the music business, Trapital is a must.Samu Rast A good friend of mine put me on this podcast and it took me some time to tap in, but once I did, I couldn’t stop listening! Dan has a talent for pulling out the narratives between lines, connecting it to the culture and then making it make sense. I’m a loyal subscriber and am thankful for the podcast!Zealous Advocate I am a real estate investor and came across this podcast after a recommendation from a friend who shares my loves for both hip hop and business. Often, those two interests have such polar opposite “voices” - but Dan’s podcast brings those two together for me. The result is magical. Great guests, too!Gabriel Blue As a guy who came up in NYC during the late 90s / early 2000s rap scene, I appreciate the history revisited by Dan, who obviously has an authentic and unique perspective on the culture. But he’s not only a hip hop historian; he’s also a visionary of art, technology and culture who curates other trend setters from across the globe. Salute!Mrkamal I love Dan’s ability to bring diverse and timely perspectives to the show while asking deeply insightful questions that engage the audience on so many interesting levels. I’ve learned so much in just a short period of listening. Excited for what Dan has in store for the show in the future!Greg0188 I stumbled upon this podcast by learning about Dan / Trapital via LinkedIn. I listen to A LOT of podcasts and I decided to give it a listen. First, Dan has a calm and authentic demeanor, which are great qualities. When he’s talking to his guests it’s very conversational and easy flowing. I’m a former music industry vet so the topics are right up my alley.Phil StolaronekWant more? Check out other episodesFebruary 25, 2025Who is ‘Spotify Music Pro’ Really For? February 18, 2025The Rise and Fall of Instagram Live February 10, 2025The Biggest Surprises in Streaming Show moreSUBSCRIBE FOR FREEJoin readers who stay ahead of all the trends /*home 3 bottom signup */ .formkit-form[data-uid="7692c30a96"] .formkit-input { background: #ffffff; font-size: 20px !important; padding: 12px; padding-left: 24px !important; border: 1px solid #e3e3e3; -webkit-flex: 1 0 auto; -ms-flex: 1 0 auto; flex: 1 0 auto; line-height: 1.4; margin: 0; -webkit-transition: border-color ease-out 300ms; transition: border-color ease-out 300ms; height: 72px !important; } .formkit-form[data-uid="7692c30a96"] .formkit-submit { position: static; font-size: 20px !important; } .formkit-form[data-uid="7692c30a96"][min-width~="700"] [data-style="clean"], .formkit-form[data-uid="7692c30a96"][min-width~="800"] [data-style="clean"] { width: 100%; } button.formkit-submit { display: flex !important; justify-content: center !important; align-items: center !important; padding: 0 !important; height: 72px !important; /* Ensure this matches your desired height */ } button.formkit-submit span { height: 100% !important; width: 100% !important; padding-top: 14px !important; display: flex !important; justify-content: center !important; align-items: center !important; } /*footer signup */ .formkit-field { font-size: 19px !important; height: 72px !important; } /*end of podcast */ .formkit-form[data-uid="1e4ffd70f3"] .formkit-fields { display: -webkit-box; display: -webkit-flex; display: -ms-flexbox; display: flex; -webkit-flex-wrap: wrap; -ms-flex-wrap: wrap; flex-wrap: nowrap !important; margin: 0 auto; } .seva-fields.formkit-fields { display: grid !important; grid-template-columns: 65% 35% !important; } .formkit-form[data-uid="1e4ffd70f3"] .formkit-input { backgroun