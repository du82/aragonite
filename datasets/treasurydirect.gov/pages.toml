["https://treasurydirect.gov/laws-and-regulations/savings-bond-regulations"]
title = "Savings Bond Regulations — TreasuryDirect"
full_description = "Laws, Regulations and Guidance Laws & Regulations Auction Regulations (UOC) Collateral Programs Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites Laws & Regulations Savings Bond Regulations Savings Bond Regulations U.S. Treasury regulations, or circulars, which implement the statutes, are found in 31 CFR. We use the Government Printing Office's GPO Access to connect to the regulations. Series EE and HH Savings Bonds Offering of Series EE (Part 351) Describes the offering of definitive and paperless Series EE Savings Bonds, including available denominations and other attributes, and how we calculate and pay the interest earned. Offering of Series HH (Part 352) Describes the offering of Series HH Savings Bonds, including available denominations and other attributes, and how we calculate and pay the interest earned (no longer offered for sale). Terms and Conditions for Series EE and HH (Part 353) Describes the terms and conditions for Series EE/HH Savings Bonds, including registration restrictions, how the bonds are paid, and to whom. Series I Savings Bonds Offering of Series I (Part 359) Describes the offering of definitive and paperless Series I savings bonds, including available denominations, other attributes of I Bonds, and how we calculate and pay the interest earned. Terms and Conditions for Series I (Part 360) Describes the terms and conditions for Series I Savings Bonds, including registration restrictions, how the bonds are paid and to whom. Further Reading Currently Viewing: Savings Bond Regulations Other Pages: Laws & Regulations Auction Regulations (UOC) Collateral Programs Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites"
