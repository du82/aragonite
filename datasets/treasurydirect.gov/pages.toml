title = "Interest Cost by Fund Report — TreasuryDirect"
full_description = "Federal Investments Program About the Federal Investments Program Federal Investments Program Reports Statement of Account Interest Cost by Fund Report Principal Outstanding Report Investments Distribution Query Investments Transaction Query Customer Guides & Forms Government Users About the Federal Investments Program Interest Cost by Fund Report Interest Cost by Fund Reports Year Month Some of these documents are in Adobe’s Portable Document Format (PDF). Many computers include the Adobe Acrobat Reader, which allows you to view PDF files. If you do not have the Acrobat Reader, it is free to download and use. Find more help downloading. (function () { const form = document.getElementById('interestCost'); const now = new Date(); const yearSelectElement = document.getElementById('year'); const monthSelectElement = document.getElementById('month'); const monthListArray = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; function pad(n, width, z) { z = z || '0'; n = n + ''; return n.length >= width ? n : new Array(width - n.length + 1).join(z) + n; } function getPreviousMonth(date, howFarBack) { let lastMonth; if (date.getMonth() === 0) { lastMonth = new Date(date.getFullYear() - howFarBack, 11, 1); } else { lastMonth = new Date(date.getFullYear(), date.getMonth() - howFarBack, 1); } return lastMonth; } function getFirstBusinessDay(year, month) { let worked = 0; for (let i = 1; i <= 31; i++) { let testDate = new Date(year, month, i); let day = testDate.getDay(); if (day > 0 && day < 6) { if (++worked === 1) { return i; } } } } function getLastBusinessDay(year, month) { let date = new Date(); let offset = 0; let result = null; if ('undefined' === typeof year || null === year) { year = date.getFullYear(); } if ('undefined' === typeof month || null === month) { month = date.getMonth(); } do { result = new Date(year, month, offset); offset--; } while (0 === result.getDay() || 6 === result.getDay()); return result.getDate(); } function populateYear(todaysDate, selectElement) { let yearArray = []; if (now.getMonth() === 0) { for (let i = 0; i <= ((now.getFullYear() - 1) - 2001); i++) { yearArray.push(i + 2001) } } else { for (let i = 0; i <= (now.getFullYear() - 2001); i++) { yearArray.push(i + 2001) } } yearArray.reverse(); for (let i = 0; i < yearArray.length; i++) { let optionElement = document.createElement('option'); optionElement.value = yearArray[i]; optionElement.innerHTML = yearArray[i]; selectElement.appendChild(optionElement); } } function populateMonth(event) { let monthArray = []; let selectedYear; if ((event !== undefined) && (event !== null)) { selectedYear = parseInt(event.target.options[event.target.selectedIndex].value); } else { selectedYear = now.getFullYear(); } if (selectedYear === now.getFullYear() && now.getMonth() !== 0) { if (getFirstBusinessDay(now.getFullYear(), now.getMonth()) <= now.getDate()) { for (let i = 0; i <= getPreviousMonth(now, 1).getMonth(); i++) { monthArray.push(monthListArray[i]); } } else { for (let i = 0; i <= getPreviousMonth(now, 2).getMonth(); i++) { monthArray.push(monthListArray[i]); } } }else { monthArray = monthListArray; } while (monthSelectElement.firstChild) { monthSelectElement.removeChild(monthSelectElement.lastChild); } for (let i = 0; i < monthArray.length; i++) { let optionElement = document.createElement('option'); optionElement.value = pad((i + 1), 2, 0); optionElement.innerHTML = monthArray[i]; monthSelectElement.appendChild(optionElement); } } function commit(event) { event.preventDefault(); let year = event.target.elements['year'].value; let month = event.target.elements['month'].value; let reportURI = '/govt/reports/fip/intcost/dfi_int_' + year + month + getLastBusinessDay(year, month) + '.pdf'; window.open(reportURI, 'Account Statement'); } populateYear(now, yearSelectElement); populateMonth(); yearSelectElement.addEventListener('change', populateMonth); form.addEventListener('submit', commit); }());"
