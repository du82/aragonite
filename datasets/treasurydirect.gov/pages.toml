title = "Public Debt Reports — TreasuryDirect"
full_description = "Public Debt Reports Public Debt Reports Accountability Report Average Interest Rates on U.S. Treasury Securities Debt Position and Activity Report Gifts to Reduce the Public Debt Interest Expense on the Debt Outstanding Schedules of Federal Debt Debt to the Penny (Daily History / Search Application) Daily Treasury Statement Treasury Bulletin Monthly Statement of the Public Debt (MSPD) MSPD Balancing Sheet Monthly Treasury Statement of Receipts and Outlays of the U.S. Government History of the Debt Historical Debt Outstanding Savings Bond Issues, Redemptions, and Maturities by Series Electronic Securities Transactions U.S. Savings Bonds and Notes (SBN) Tables and Downloadable Files Debt Subject to Limit Government Public Debt Reports Public Debt Reports Visit the Fiscal Data website to view: National Debt explainer National Deficit explainer Federal Spending explainer Government Revenue explainer Currency Exchange Rates Converter Savings Bond explainer Interest Expense and Average Interest Rates on the National Debt explainer Accountability Report Consists of five separate financial statements which account for the outstanding debt recorded by the Bureau of the Fiscal Service. Average Interest Rates on U.S. Treasury Securities This dataset moved permanently as of May 5, 2022 to fiscaldata.treasury.gov Bearer and Registered Securities The Bureau of the Fiscal Service is no longer publishing the Bearer and Registered Securities report. However, you can get the same information in millions of dollars from the Debt Position and Activity Report. If you need the figures to the penny, send an e-mail to SecuritiesAccountingTeam@fiscal.treasury.gov. Debt Position and Activity Report Shows the current and historical debt position of the Department of the Treasury in relation to Debt Held by the Public, Intragovernmental Holdings and Statutory Debt Limit. Issues and redemptions activity are also provided in this report. Gifts to Reduce the Public Debt Provides data on contributions to reduce the debt held by the public. This dataset moved permanently as of May 5, 2022 to fiscaldata.treasury.gov Interest Expense on the Debt Outstanding This dataset moved permanently as of May 5, 2022 to fiscaldata.treasury.gov Schedules of Federal Debt Shows the Schedules of Federal Debt, the associated Notes to the Schedules, Unqualified Opinion issued by the General Accounting Office (GAO) and Management's Response. This dataset moved permanently as of May 5, 2022 to fiscaldata.treasury.gov Schedules of Federal Debt – Daily, Unaudited The Daily Summary Debt Schedule data moved permanently to FiscalData.Treasury.gov on May 4, 2022. Debt to the Penny (Daily History / Search Application) Shows current and historical data for the Debt calculated to the penny. Daily Treasury Statement Summarizes the United States Treasury's cash and debt operations for the federal government. Treasury's operating cash is maintained in an account at the Federal Reserve Bank of New York and in Tax and Loan accounts at commercial banks. Treasury Bulletin Contains a mix of narrative, tables, and charts related to Treasury issues, federal financial operations, international statistics, liabilities, and financial commitments of the U.S government. Monthly Statement of the Public Debt (MSPD) Consists of five tables reflecting various forms of financial information vital to government borrowing and the financial market, including summary and detail information regarding outstanding Treasury securities, and information regarding the statutory debt limit. This dataset moved permanently as of May 5, 2022 to fiscaldata.treasury.gov MSPD Balancing Sheet Represents the public debt outstanding in exact dollars, rounded to millions. These figures become Tables 1 and II of the Monthly Statement of the Public Debt. This dataset moved permanently as of July 7, 2023 to fiscaldata.treasury.gov. In the preview and download section, select published reports and choose balancing sheet from the drop down menu. Monthly Treasury Statement of Receipts and Outlays of the U.S. Government Provides the cash position of the Treasury. The History of the Debt A narrative description of the history of the debt. Historical Debt Outstanding Provides annual debt outstanding figures from 1791 to the present. The Annual Historical Debt Outstanding reports have moved to FiscalData.Treasury.gov where they are available for download in multiple machine-readable formats with complete metadata! Savings Bond Issues, Redemptions, and Maturities by Series This data has moved permanently to fiscaldata.treasury.gov as of May 2021 Electronic Securities Transactions This data has moved permanently to fiscaldata.treasury.gov as of May 2022. U.S. Savings Bonds and Notes (SBN) Data on sales and redemptions of savings bonds and notes. Debt Subject to Limit The Debt Subject to Limit is the maximum amount of money the Government is allowed to borrow without receiving additional authority from Congress."
