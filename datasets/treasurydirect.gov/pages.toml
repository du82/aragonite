["https://treasurydirect.gov/laws-and-regulations"]
title = "Laws & Regulations — TreasuryDirect"
full_description = '''Laws, Regulations and Guidance Laws & Regulations Code of Federal Regulations (CFR) Department Circulars Auction Regulations (UOC) Collateral Programs Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites Laws & Regulations Laws & Regulations On this page: Authorizing StatutesRegulationsFederal RegisterOther Legal ReferencesFurther Reading Are you a lawyer or financial advisor working with a client who owns Treasury securities? Are you a law student researching a paper? Are you just curious about the laws and regulations on which our programs are based? This page links you to the relevant information. Authorizing Statutes These are the laws that authorize us to sell securities and that govern securities brokers and dealers. We use the Government Printing Office (GPO) website to link to the statutes. GPO has the official legal text. Sale of Treasury Securities 31 U.S.C. Title 31, Subtitle III, Subchapter I authorizes Treasury to borrow money and Subtitle II governs the administration of debt. Government Securities Act (15 U.S.C. Chapter 2B Section 780-5) governs government securities brokers and dealers. Regulations Regulations tell how to carry out the laws. Some of Treasury’s regulations are in Title 31 of the Code of Federal Regulations (31 CFR). Treasury’s Government Securities Act (GSA) regulations are in Title 17. The current rules are at the website, www.ecfr.gov. The regulations are also Treasury department circulars, and you can reach many of them through our page on CFR department circulars. More detailed pages for: Savings bond laws and regulations Series EE, HH, and I savings bonds Treasury Marketable securities laws and regulations Treasury Direct, TRADES (related to the commercial book-entry system), buybacks, and Legacy Treasury Direct. Auction laws, regulations, and guidance The Uniform Offering Circular (UOC), which is the regulation about Treasury auctions, as well as a history of amendments and interpretations Government Securities Act (GSA) regulations Treasury's rules for government securities broker-dealers on financial responsibility, protecting customer securities and funds, record keeping, and financial reporting and audits. Also included are rules concerning custodial holdings of government securities by depository institutions. Large Position Reporting Rules Non-Marketable Treasury Securities State and Local Government Series (SLGS) (Part 344) Describes the terms and conditions for the sale of Special securities for issuers of tax-exempt securities, mostly States and local governments. Federal Register The Federal Register – the daily publication related to the Code of Federal Regulations (CFR) – includes more than what is in the actual CFR. For example, it includes notices and other important information about proposed changes. The links in this list take you to pages on our site with links to PDFs of Federal Register items about Treasury securities and about the Bureau of the Fiscal Service. (Note that before 2013, we were the Bureau of the Public Debt.) 2023 (January - December) 2022 (January - December) 2021 (January - December) 2020 (January - December) 2019 (January - December) 2018 (January - December) 2017 (January - December) 2016 (January - December) 2015 (January - December) 2014 (January - December) 2013 (January - December) 2012 (January - December) 2011 (January - December) 2010 (January - December) 2009 (January - December) 2008 (January - December) 2007 (January - December) 2006 (January - December) 2005 (January - December) 2004 (January - December) 2003 (January - December) 2002 (January - December) 2001 (January - December) 2000 (January - December) 1999 (July - December) 1999 (January - June) 1998 (July - December) 1998 (January - June) 1997 (July - December) 1997 (January - June) 1996 (July - December) To review or comment on proposed or interim regulations from us or any other federal agencies, go to www.regulation.gov. Other Legal References Article on Recent Developments Related to Treasury's "TRADES" Regulations As the name indicates, this page summarizes Treasury's "TRADES" Regulations. The TRADES regulations govern holdings of marketable Treasury securities outside of TreasuryDirect. They were enacted in 1996. Frauds, Phonies and Scams If you have been presented with a suspicious Treasury Security that doesn't look right or have been invited to participate in a Treasury Securities transaction ''guaranteed'' to make lots of money, visit our web page related to ''frauds and phonies'' to read about fraudulent schemes and phony financial instruments. Freedom Of Information Act (FOIA) Visit our web pages for useful information about FOIA, including how to make a FOIA request. Further Reading Currently Viewing: Laws & Regulations Other Pages: Laws & Regulations Auction Regulations (UOC) Collateral Programs Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites'''
