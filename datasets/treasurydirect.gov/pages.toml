yData[0].interestRate, 3) } else { let securityType = 'Note'; securityElm.innerHTML = ` <div class="rate">No scheduled ${securityType} offerings.</div> `; } if (percentageType !== null) { securityElm.innerHTML = ` <div class="rate">${percentageType}%</div> <p>Issued ${dateConverter(securityData[0].issueDate)}. Price per $100: ${securityData[0].pricePer100}. CUSIP ${securityData[0].cusip}.</p> `; } }); }); See All Auction Results More About Treasury Marketable Securities Processing Times Heavy volume is slowing our response time to cases sent by mail. The following transactions require at least 2 weeks of processing time if bonds and/or TreasuryDirect accounts are in your name. Cashing paper savings bonds where you are named on the bonds, and you send in the bonds with your request Unlocking your TreasuryDirect account or updating your banking information within that account Converting your paper savings bonds into electronic format (in a TreasuryDirect account) Requests to search for lost, stolen or missing savings bonds require at least 4 months to process. Other paper savings bond transactions you are authorized to handle, but not in your name require at least 6 weeks to process. Other TreasuryDirect requests, including trusts, may require 6 months or more to process. Special Announcements for TreasuryDirect account holders: 2024 1099 tax forms for TreasuryDirect will be available January 31, 2025. See our 1099 information. You can call us from 8 a.m. to 6 p.m. ET, Monday through Friday, at 844-284-2676. The annual purchase limit for Series I savings bonds in TreasuryDirect is $10,000. Check out our new savings bond explainer page Latest News February 2025 Fiscal Service Aids Savings Bonds Owners in West Virginia Affected by Severe Storm, Straight-line Winds, Flooding, Landslides, and Mudslides; One-year minimum holding period waived Fiscal Service Aids Savings Bonds Owners in Kentucky Affected by Severe Storms, Straight-line Winds, Flooding, Landslides, and Mudsl