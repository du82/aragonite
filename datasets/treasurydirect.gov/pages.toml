') { percentageType = decimalConverter(securityData[0].highInvestmentRate, 3) } else if ('Bond' === 'FRN') { percentageType = decimalConverter(securityData[0].spread, 3) } else if (decimalConverter(securityData[0].interestRate, 3) !== null) { percentageType = decimalConverter(securityData[0].interestRate, 3) } else { let securityType = 'Bond'; securityElm.innerHTML = ` <div class="rate">No scheduled ${securityType} offerings.</div> `; } if (percentageType !== null) { securityElm.innerHTML = ` <div class="rate">${percentageType}%</div> <p>Issued ${dateConverter(securityData[0].issueDate)}. Price per $100: ${securityData[0].pricePer100}. CUSIP ${securityData[0].cusip}.</p> `; } }); }); 10-Year Notes document.addEventListener('DOMContentLoaded', function () { var hostLocation = 'https://www.treasurydirect.gov'; if (!window.location.origin) { window.location.origin = window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port: ''); } if (window.location.origin === 'https://acc.treasurydirect.gov'){ hostLocation = 'https://acc.treasurydirect.gov'; } function dateConverter(rawDate) { return rawDate.substr(5, 2) + '\/' + rawDate.substr(8, 2) + '\/' + rawDate.substr(0, 4); } function decimalConverter(rawNumber, decimalSpaces) { if (rawNumber === "") { return rawNumber; } else { return parseFloat(rawNumber).toFixed(decimalSpaces); } } let securityElm = document.getElementById('10-Year'); $.getJSON(`${hostLocation}/TA_WS/securities/auctioned?format=jsonp&limitByTerm=true&type=Note&callback=?`, function (data) { let securityData = 'Note' === 'FRN' ? data : data.filter(item => item.term.includes('10-Year')); let percentageType; if ('Note' === 'Bill') { percentageType = decimalConverter(securityData[0].highInvestmentRate, 3) } else if ('Note' === 'FRN') { percentageType = decimalConverter(securityData[0].spread, 3) } else if (decimalConverter(securityData[0].interestRate, 3) !== null) { percentageType = decimalConverter(securityData[0].interestRate, 3) } else { let securityType = 'Note'; securityElm.innerHTML = ` <div class="rate">No scheduled ${securityType} offerings.</div> `; } if (percentageType !== null) { securityElm.innerHTML = ` <div class="rate">${percentageType}%</div> <p>Issued ${dateConverter(securityData[0].issueDate)}. Price per $100: ${securityData[0].pricePer100}. CUSIP ${securityData[0].cusip}.</p> `; } }); }); See All Auction Results More About Treasury Marketable Securities Processing Times Heavy volume is slowing our response time to cases sent by mail. The following transactions require at least 2 weeks of processing time if bonds and/or TreasuryDirect accounts are in your name. Cashing paper savings bonds where you are named on the bonds, and you send in the bonds with your request Unlocking your TreasuryDirect account or updating your banking information within that account Converting your paper savings bonds into electronic format (in a TreasuryDirect account) Requests to search for lost, stolen or missing savings bonds require at least 4 months to process. Other paper savings bond transactions you are authorized to handle, but not in your name require at least 6 weeks to process. Other TreasuryDirect requests, including trusts, may require 6 months or more to process. Special Announcements for TreasuryDirect account holders: 2024 1099 tax forms for TreasuryDirect will be available January 31, 2025. See our 1099 information. You can call us from 8 a.m. to 6 p.m. ET, Monday through Friday, at 844-284-2676. The annual purchase limit for Series I savings bonds in TreasuryDirect is $10,000. Check out our new savings bond explainer page Latest News February 2025 Fiscal Service Aids Savings Bonds Owners in West Virginia Affected by Severe Storm, Straight-line Winds, Flooding, Landslides, and Mudslides; One-year minimum holding period waived Fiscal Service Aids Savings Bonds Owners in Kentucky Affected by Severe Storms, Straight-line Winds, Flooding, Landslides, and Mudslides; One-year minimum holding period waived The Fiscal Service Announces Activity for Securities in the STRIPS Program for January 2025 January 2025 Fiscal Service Aids Savings Bonds Owners in California Affected by Wildfires and Straight-line Winds; One-year minimum holding period waived The Fiscal Service Announces Activity for Securities in the STRIPS Program for December 2024 December 2024 Fiscal Service Aids Savings Bonds Owners in West Virginia Affected by Tropical Storm Helene; One-year minimum holding period waived The Fiscal Service Announces Activity for Securities in the STRIPS Program for November 2024 November 2024 Fiscal Service Aids Savings Bonds Owners of the Crow Tribe of Montana Affected by Severe Storm and Straight-line Winds; One-year minimum holding period waived Fiscal Service Aids Savings Bonds Owners of the Seminole Tribe in Florida Affected by Hurricane Milton; One-year minimum holding period waived Fiscal Service Aids Savings Bonds Owners in New Mexico Affected by Severe Storm and Flooding; One-year minimum holding period waived Fiscal Service Aids Savings Bonds Owners in the Cheyenne River Sioux Tribe Affected by Severe Storm, Straight-line Winds, and Flooding; One-year minimum holding period waived The Fiscal Service Announces Activity for Securities in the STRIPS Program for October 2024 Fiscal Service Announces New Savings Bonds Rates, Series I to Earn 3.11%, Series EE to Earn 2.60% See All News Help Center Guides Savings Bonds Help Redeeming a Paper Savings Bond Change of Ownership Lost, Stolen, or Destroyed Bonds See More Securities & Auctions Participate in an Auction Types of Bids Searching by CUSIP Number See More Logging In Forgot My Password Forgot My Account Number Help with One-time Passcodes See More Gift a Savings Bond We're Here to Help Contact Us'''
