["https://treasurydirect.gov/indiv/help/treasurydirect-help/how-do-i"]
title = "How Do I...? — TreasuryDirect"
full_description = '''TreasuryDirect Help TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide How Do I...? Learn More Technical Help TreasuryDirect Help How Do I...? How Do I...? How do I purchase savings bonds in TreasuryDirect? NOTE: All Savings Bonds are issued in electronic form; no paper bonds are issued. You may purchase savings bonds by using BuyDirect®. BuyDirect: Log into your primary TreasuryDirect® account. Click the BuyDirect tab at the top of the page. On the BuyDirect page, choose the series of Savings Bonds and click "Submit". Under the heading Registration Information, choose the desired registration from the drop-down box. (If the registration you want is not listed, you can create it by clicking "Add New Registration". If a gift registration, remember to click the "This is a gift" box at the bottom of the Add New Registration page. Once you've created the desired registration, you'll be brought back to the BuyDirect page where you can choose the registration you just created from the drop-down box.) Note: Entity accounts may only have one registration. All securities in an entity account carry a registration identical to the entity account name. Under the heading Purchase Information, enter the Purchase Amount (from $25.00 to $10,000.00). Note: Electronic savings bonds are always purchased at full face value. For example, you pay $50 for a $50 savings bond. Select a source of funds you wish to debit from the drop-down box. You may choose to use your bank account or your Zero-Percent C of I. Under the heading Purchase Frequency, the system will default to Schedule single purchase for today's date. If you wish to change it to a future date, simply enter the date you want. If you'd rather set up repeat purchases, choose the button for Schedule repeat purchases and choose the frequency from the drop-down box. You can then enter the beginning and ending dates for the purchase schedule. If you want to select your own dates, choose the button for Schedule purchases by selecting your own dates and enter each date in the spaces provided. If you want to schedule more than six dates, click "Schedule More". Click "Submit" to proceed. The Purchase Review page will then appear. Please review the information and read the statements at the bottom. (If you wish to change any of the data you entered, click the "Edit" button to go back to the previous page where you can make any desired changes.) If the data on the Purchase Review page is accurate including the purchase date, click "Submit". You'll then see a Confirmation Page listing the details of the purchase, including the Purchase Date and Confirmation Number for each security. Savings bond purchases are generally issued to your TreasuryDirect account within one business day of the purchase date. If you select a non-business day as your purchase date, we will change it to the next available business day. How do I redeem savings bonds being held in my TreasuryDirect account? Note: United States Savings Bonds must be held for a minimum of one year from their issue date before they are eligible to be redeemed. Log into your primary TreasuryDirect® account. Click the ManageDirect® tab at the top of the page. Under the heading Manage My Securities, click "Redeem securities". On the Redemption page, choose the button beside the security type you want to redeem and click "Submit". On the Summary page, check the box beside each security that you want to redeem and click "Select". You may select up to 50 securities per redemption transaction. The process from here differs depending on whether you have selected one or more than one security for redemption: If more than one security was selected for redemption, you will see the Multiple Redemption Request page. If redeeming more than one security, the full amount must be redeemed to the same financial institution. If only one security was selected for redemption, you will see the Redemption Request page. On this page, either leave the default button selected for Redeem full amount or select the button for Redeem partial amount and enter the desired amount. (Note: In a partial redemption, you must redeem at least $25 and leave a value of $25 in the security.) From the drop-down box, select the destination (bank account or C of I) you would like to credit with the proceeds. Click "Review" on the Redemption Request or the Multiple Redemption Request page. The Redemption Review or Multiple Redemption Review page is then displayed. If any information needs to be changed, click "Edit" and make the changes. Otherwise, click "Submit". A Redemption Confirmation or Multiple Redemption Confirmation page will be displayed to signify completion of the request. You may wish to print a copy of this page for your records. How do I add a bank account? Log into your primary TreasuryDirect® account. Click the ManageDirect tab at the top of the page. Under the heading Manage My Account, click "Update my Bank Information". The ManageDirect >> Bank Information page will appear. To add a new bank: Click the "Add" button. The ManageDirect >> Bank Information >> Add page will appear. Complete all the bank account fields. If you wish to make the new bank account your primary bank, click the checkbox next to “Make this my primary bank information...” Click the "Submit" button. Note: When adding a new bank account, your bank information will be verified by an account verification service. If the information is unable to be verified, you will be allowed two additional attempts. If the bank information is unable to be verified on the 3rd attempt, a hold will be placed on your bank account and you will receive an email which includes information and a link to the Bank Change Request form (FS Form 5512). How do I edit a bank account? If you need to designate a different existing bank account as your Primary bank, or make minor corrections to the name on the bank account or change the bank name, please call (844) 284-2676, choose option 3 at the first menu, and choose option 3 at the second. If you are unable to call, please follow the Edit instructions below. To edit an existing bank account: Click the "radio button" for the bank you wish to edit and click the "Edit" button. The ManageDirect >> Bank Change Form Request page will appear. A link will be provided to a Bank Change Request form (FS Form 5512) to edit an existing bank in your TreasuryDirect Account. You must sign the paper form in the presence of an authorized certifying official available at a bank, trust company, or credit union and mail it to us for processing. Certification by a Notary Public is not acceptable. Your request will not be processed until we receive and approve your form with any necessary supporting documentation. We will notify you by e-mail when your transaction has been completed. How do I buy a gift savings bond in TreasuryDirect? It is important to note some things about gift savings bonds in TreasuryDirect: Gift savings bonds are issued only in electronic form. The recipient of a gift savings bond must have a TreasuryDirect account before you can deliver the bond to him or her. In the interim, you can hold the bond in the Gift Box area of your TreasuryDirect account. You must wait five business days after the purchase date to deliver a gift savings bond. Gift savings bonds are not available in entity accounts and Treasury marketable securities are not available for purchase as gifts. To buy gift savings bonds, follow these instructions: See How do I purchase savings bonds in TreasuryDirect. When providing your registration information, if the gift registration you want is not listed in the drop-down box, you can create one by clicking the "Add New Registration" button. Make sure to choose the type of registration you want (Sole Owner, Primary Owner, or Beneficiary) and click the "This is a gift" box at the bottom of the Add New Registration page. Once you've created the desired registration, you'll be brought back to the BuyDirect page you were originally on with the registration(s) added to the drop-down box. Gift savings bond purchases are generally issued to the Gift Box in your TreasuryDirect account within one business day of the purchase date. If you select a non-business day as your purchase date, we will change it to the next available business day. How do I deliver a gift savings bond? Note: The recipient of a gift bond must have his or her own TreasuryDirect account. You must wait five business days after the purchase date to deliver a gift savings bond. Gift bonds may not be delivered to an entity account. Log into your primary TreasuryDirect® account. Click the Gift Box tab in the top, right corner of the page. On the Gift Box page, select the button beside the confirmation number of the bond you wish to deliver and click "Submit". The Detail page will appear. Click "Deliver". The Delivery Request page will then appear. To deliver the full value of the bond, enter the recipient's TreasuryDirect Account number in the field and click "Submit". To deliver less than the full amount of the bond, select the button beside Deliver partial amount and enter the desired dollar amount, the recipient's TreasuryDirect Account number in the field, and click "Submit". (Note: You must deliver at least $25 and leave a value of $25 for the bond.) The Delivery Review page will then appear. If you wish to change any of the data you entered, click "Edit" to go back to the previous page where you can make any desired changes. Otherwise click "Submit". A Delivery Confirmation page will appear to verify completion of the transaction. You may wish to print a copy of this page for your records. How do I open an account for a minor? A Minor account is a custodial account you may establish for a child under the age of 18 if you are a parent or person providing chief support of the child. You may purchase, redeem, receive gifts, and perform other transactions within an individual account on behalf of the minor. You can even create a customized name, such as "Ben's College Fund", for the account. When the minor reaches age 18 and establishes a Primary TreasuryDirect account, you may de-link the securities from the Minor account to move them to the new Primary account. Note: Minor accounts are not available in entity accounts. To open an account for a minor within an individual account: Log into your primary TreasuryDirect® account. Click the ManageDirect tab at the top of the page. Under the heading Manage My Linked Accounts, click "Establish a Minor Linked Account". The Establish an Account for a Minor page will appear. Complete all of the information for the minor (the minor's Middle Name or Initial field is optional). Complete the Give Your Account a Name field. Select Use my Primary Account Information if you want to use the account address and contact information or you may select Enter New Account Information. The Bank Information displays from your primary account. Instructions are provided if you choose to change the Bank Information once the minor account has been established. Read the statements in the Taxpayer Identification Number Certification box, check the box indicating you agree with the statements, and click "Submit". On the Review page, review the Account Information. Click "Edit" to go back to the previous page to make corrections. When the Account Information is correct, read the Certification statements and click "Submit". A personalized account name for the Minor account, followed by its TreasuryDirect account number, appears in the top right corner of the Account Info page. The two arrows let you know that you're presently viewing the minor's account. To go back to your primary account, click the link above the minor account number. How do I purchase Treasury marketable securities in TreasuryDirect? You may purchase Treasury marketable securities by using BuyDirect: BuyDirect: Log into your primary TreasuryDirect® account. Click the BuyDirect tab at the top of the page. Choose the type of security you wish to purchase and click "Submit". Under the heading Registration Information, choose the desired registration from the drop-down box. If the registration you want is not listed, you can create it by clicking "Add New Registration". Once you've created the desired registration, you'll be brought back to the BuyDirect page where you can choose the registration you just created from the drop-down box. Note: Entity accounts may only have one registration. All securities in an entity account carry a registration identical to the entity account name. Under the heading Purchase Information, choose the security you wish to purchase from the list of planned auctions for the type of security selected. Enter the Purchase Amount (from 100 to 10,000,000 in $100 increments). Select a source of funds you wish to debit from the drop-down box. You may choose to use your bank account or your Zero-Percent C of I. See Learn More about C of I. If you wish to schedule reinvestment of the security, under the heading Schedule Reinvestment, click "Yes". For a Bill, also indicate the number of times you wish to reinvest. See Learn more about Reinvesting Maturing Proceeds. Under the heading Payment Destination, choose a destination for the last maturity payment from the drop-down box. If the security is a Note, Bond, TIPS, or FRN, you must also choose a destination for the interest payments. Click "Submit" to proceed. The Purchase Review page will then appear. Please review the information and read the statements at the bottom. (If you wish to change any of the data you entered, click "Edit" to go back to the previous page where you can make any desired changes.) If the data on the Purchase Review page is accurate, click "Submit". You'll then see a Confirmation page listing the details of the purchase. The purchase amount will be taken from your bank or C of I on the security’s issue date, which usually follows within a week of the auction date. How do I edit the payment destination of Treasury marketable securities? You may edit the interest and/or maturity payment destination of your Treasury marketable securities by following the instructions below: Log into your primary TreasuryDirect® account. Click on the Current Holdings tab at the top of the page. Scroll down to the heading Treasury Marketable Securities, click the radio button next to the security type you want to edit, and click "Submit". On the Current Holdings Summary page, choose the security you wish to edit, and click "Submit". At the bottom of the Current Holdings Detail page, click "Edit Payment Destination". On the ManageDirect Edit Payment Destination page select the bank account you desire from the drop-down menu for the maturity and/or interest payment destination, and click "Submit". Repeat the steps above to edit the payment destinations of other Treasury marketable securities. How do I transfer savings bonds from'''
year_published = 2025
