title = "Accessibility — TreasuryDirect"
full_description = "Legal Notices Freedom of Information Act Laws & Guidance Privacy Policy Terms & Conditions Report problems with our data Web Development APIs Accessibility Accessibility Accessibility Statement Fiscal Service is committed to making its website accessible to everyone. To meet this commitment, we are striving to make the site compliant with the requirements of Section 508 of the Rehabilitation Act, as amended in 1998. Our website is designed to be equally accessible to those using current, standards-compliant web browsers or assistive technologies. Reporting an Accessibility Concern Achieving compliance with Section 508 is an ongoing process. If you have difficulty accessing any of our web pages or have questions about accessing information on a particular page, please e-mail us at: FSInternet@fiscal.treasury.gov Note: The above e-mail address is NOT for problems with, or questions about your TreasuryDirect account. No one at this e-mail address is able to help you with your TreasuryDirect account. For help with your TreasuryDirect account, call 844-284-2676."
