["http://www.treasurydirect.gov/indiv/help/TDhelp/help_ug_274-SecFeaturesProtectAcctLearnMore.htm"]
title = "User Guide Sections 271 Through 280 — TreasuryDirect"
full_description = '''TreasuryDirect Help TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide 001 Through 010 011 Through 020 021 Through 030 031 Through 040 041 Through 050 051 Through 060 061 Through 070 071 Through 080 081 Through 090 091 Through 100 101 Through 110 111 Through 120 121 Through 130 131 Through 140 141 Through 150 151 Through 160 161 Through 170 171 Through 180 181 Through 190 191 Through 200 201 Through 210 211 Through 220 221 Through 230 231 Through 240 251 Through 260 261 Through 270 271 Through 280 281 Through 290 291 Through 300 301 Through 310 311 Through 320 471 Through 480 591 Through 600 601 Through 610 How Do I...? Learn More Technical Help TreasuryDirect Help User Guide User Guide Sections 271 Through 280 User Guide Sections 271 Through 280 On this page: User Guide 274User Guide 280Further Reading User Guide 274 Learn More About Security Features and Protecting Your Account Watch our TreasuryDirect demo on how to login to your account. One Time Passcode (OTP): You'll need a One Time Passcode (OTP) to log into your TreasuryDirect account. The OTP will be e-mailed to you after you enter your account number and click "Submit". On the OTP page, enter the OTP into the space provided, and click "Submit" to go to the password page. The OTP is case sensitive and may be copied and pasted from the e-mail message. NOTE: A One Time Passcode is valid for 24 hours or until it is successfully submitted on the OTP page. Personalized Image and Caption: You will be asked to choose a personalized image and create a caption which will be displayed on the Password page when you log in to your TreasuryDirect account. Your personalized image/caption helps you to know that you are on the authentic TreasuryDirect website. You may change your personalized image/caption at any time. Choosing a Password When you open a new account or change your password, you'll need to follow the latest guidelines for choosing a password. If you are already an account owner, we encourage you to change your password if it does not conform to the latest guidelines. When selecting a password, please keep the following in mind: Length. Use a minimum of twelve (12) characters without spaces. Characters. May contain any or all of these elements: letters, numbers, special characters excluding: < \ > - % ‘ / ". Content. Avoid numbers, names, or dates that are significant to you. For example, your phone number, first name or date of birth. Try to choose a password based on a memory aid. Choosing Security Questions When you open an account, you must select three security questions and provide answers, which we'll use to confirm your identity if you forget your account number or password. As an added security measure, we may also require you to answer one of your security questions when you attempt to perform certain transactions. When prompted to answer a security question, your response must match your previous answer. You may change your questions and answers at any time. If you previously chose the question "What is your mother's maiden name?" or the question "You were born in what city?" we recommend that you consider different questions, because the answers to these are easier for others to find. The special characters !^[ ]|"< > are not valid characters for answering security questions. Customer Hold As an added security feature, TreasuryDirect allows you to place a hold on your account. If you believe someone else has learned your account access information and you want to prevent unauthorized access to your account, you may edit your Account Info in your primary account to place a Customer Hold. This action will prohibit all transactions associated with your primary and linked accounts. After you place your Customer Hold, you will not have access to your account until the hold is removed. To remove the hold, you must contact the Bureau of the Fiscal Service (formerly Bureau of the Public Debt), Risk Management Group. Last Login When you log in to your account, a message appears at the top of the page, displaying the date and time of your last login. If the last login date and time displayed does not coincide with the date and time that you last logged into your account, you should report this to us by calling 844-284-2676. If you believe the security of your account has been compromised, you may also place a hold on your account (see Customer Hold above). Protected Information You will notice that some sensitive information is protected or "masked" so that it is not visible on certain pages in your account. On some pages, you may be required to answer one of your security questions to continue with a transaction. These measures provide you with added protection for your account. Transactions Requiring Paper Forms For your protection, certain security transfers require the submission of a signed and certified paper form. Help Home User Guide 280 Page Title: ManageDirect® > External Transfer Form Request What you can do on this page: You can access a form necessary to transfer one or more securities from your account. Primary Actions Click the link for "FS Form 5511" to access a Transfer Request. To transfer securities from your account, you must complete and mail the signed, certified request. Click "Cancel" to display ManageDirect > Transfer of Marketables > Summary. Help Home Further Reading Currently Viewing: User Guide Sections 271 Through 280 (Subpage of: User Guide) Other Pages: TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide How Do I...? Learn More Technical Help'''
year_published = 2025
