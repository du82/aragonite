["https://treasurydirect.gov/laws-and-regulations/gsa/lpr-reports"]
title = "Large Position Reporting (LPR) — TreasuryDirect"
full_description = "Laws, Regulations and Guidance Laws & Regulations Auction Regulations (UOC) Collateral Programs Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites Laws & Regulations Government Securities Act (GSA) Large Position Reporting (LPR) Large Position Reporting (LPR) Announcement for large position reports Date of announcement: July 9, 2024 Who must report: Entities whose positions in the 4-3/4% Treasury Bonds of November 2043 (CUSIP 912810TW8) equaled or exceeded $1.6 billion as of Tuesday, December 19, 2023, or Friday, December 29, 2023. Deadline for reporting: Monday, July 15, 2024, 12:00 PM (ET) Security Description: 4-3/4% Treasury Bonds of November 2043 4-3/4% Treasury Bonds of November 2043 CUSIP Number: 912810TW8 912810TW8 CUSIP Number of STRIPS Principal Component: 912803GX5 912803GX5 Maturity Date: November 15, 2043 November 15, 2043 Reporting Dates: Tuesday, December 19, 2023 Friday, December 29, 2023 Reporting Threshold: $1.6 Billion (Par Value) $1.6 Billion (Par Value) Date Report Is Due: July 15, 2024, before 12:00 P.M. (ET) July 15, 2024, before 12:00 P.M. (ET) See the announcement for details of the requirement. Form for Reporting Supplementary Formula Guidance (PDF, April 2023) Training Modules A brief explanation of LPR Treasury's large position reporting rules (17 CFR Part 420) provide an on-demand reporting system that requires entities controlling a position in a particular Treasury security (or securities) equaling or exceeding a specified threshold to submit a large position report. This lets Treasury monitor the impact of concentrations of positions in the Treasury securities market. Treasury does not believe that large positions are inherently problematic, and there is no presumption of manipulative or illegal intent merely because an entity's position is large enough to subject it to Treasury's large position reporting regulations. LPR rules and amendments Large position reporting rules 17 CFR Part 420 Technical amendment for filing reports (November 2018) On October 18, 2018, we published a final rule amending Treasury’s large position reporting rules to provide us with additional flexibility as to where and how large position reports are to be filed (83 FR 52767). The rule became effective on November 17, 2018. Final rule On December 10, 2014, we published a final rule amending Treasury’s large position reporting rules to improve the information reported so that we can better understand supply and demand dynamics in certain Treasury securities (79 FR 73408). The rule became effective on March 10, 2015. On June 10, 2014, Treasury issued a proposed rule to solicit public comment on proposed amendments to Treasury's rules for reporting large positions in certain Treasury securities (79 FR 33145). The comment period closed on August 9, 2014. View comment letters. Note: The final rule amendments issued on December 10, 2014 supersede earlier rules for large position reporting. Further Reading Currently Viewing: Large Position Reporting (LPR) Other Pages: Laws & Regulations Auction Regulations (UOC) Collateral Programs Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites"
