["https://treasurydirect.gov/auctions/when-auctions-happen/schedule-auction-reopenings"]
title = "Schedule Of Auction Reopenings — TreasuryDirect"
full_description = "Auctions When auctions happen (schedules) Schedule Of Auction Reopenings Schedule Of Auction Reopenings For other views of auction schedules, you may want one of these pages instead: Upcoming auctions Latest tentative six-month auction schedule (PDF) An overall schedule by type of security The typical monthly pattern for auctions A more detailed table with other information as well as the auction pattern When we hold a reopening auction, we are selling additional amounts of a previously issued security. The reopened security has the same CUSIP number, maturity date, and interest rate or spread as the original security, but it has a different issue date and usually a different price. As with any Treasury auction, the price for a reopened security is decided by the auction. If the price is more than the par value of the security, you pay a premium. Sometimes, with a reopened security, you may have to pay accrued interest. If this is the case, you get that interest back with the first regular interest payment for that security. If you bid in a reopening, check after the auction to see if you owe a premium or accrued interest or both. By the issue date, you must have the necessary funds in your account to pay for the security. If you bid through your TreasuryDirect account, you can see the results of your bid after 5 PM Eastern time on auction day. In your TreasuryDirect account, chose Current Holdings, then Pending Purchases and Reinvestments. The price you see is for each $100 of your bid. On this page: Tables of scheduled reopening auctions for: BondsNotesTreasury Inflation-Protected Securities (TIPS)Floating Rate Notes (FRNs) Bonds Term Original issue Reopening Comments 20-years Bonds and 30-year Bonds February March, April Reopened one month after original issuance and then reopened a 2nd time two months after original issuance May June, July August September, October November December, January Notes We reopen only the 10-year note. Term Original issue Reopening Comments 10-year Notes February March, April Reopened one month after original issuance and then reopened a 2nd time two months after original issuance May June, July August September, October November December, January Treasury Inflation-Protected Securities (TIPS) Term Original issue Reopening Comments 5-year TIPS April June Reopened two months after original issuance October December 10-year TIPS January March, May Reopened two months after original issuance and then reopened a 2nd time four months after original issuance July September, November 30-year TIPS February August Reopened six months after original issuance Floating Rate Notes (FRNs) Term Original issue Reopening Comments 2-year FRN January February, March Reopened one month after original issuance and then reopened a 2nd time two months after original issuance April May, June July August, September October November, December"
