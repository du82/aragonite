title = "User Guide Sections 291 Through 300 — TreasuryDirect"
full_description = '''TreasuryDirect Help TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide 001 Through 010 011 Through 020 021 Through 030 031 Through 040 041 Through 050 051 Through 060 061 Through 070 071 Through 080 081 Through 090 091 Through 100 101 Through 110 111 Through 120 121 Through 130 131 Through 140 141 Through 150 151 Through 160 161 Through 170 171 Through 180 181 Through 190 191 Through 200 201 Through 210 211 Through 220 221 Through 230 231 Through 240 251 Through 260 261 Through 270 271 Through 280 281 Through 290 291 Through 300 301 Through 310 311 Through 320 471 Through 480 591 Through 600 601 Through 610 How Do I...? Learn More Technical Help TreasuryDirect Help User Guide User Guide Sections 291 Through 300 User Guide Sections 291 Through 300 On this page: User Guide 291User Guide 291AUser Guide 291BUser Guide 292User Guide 293User Guide 293AUser Guide 295User Guide 295AUser Guide 300Further Reading User Guide 291 Page Title: Account Info >Edit What you can do on this page: This page allows you to edit specific fields. While in the primary account, you may place a Customer Hold on the account. Please contact us to edit any unavailable fields, such as name or Taxpayer Identification Number. Only Customer Service can change these fields to maintain the security and accuracy of your account. Primary Actions Click "Submit" to return to Account Info showing your updated information. Click "Cancel" to return to the previous page without changing your account. Help Home User Guide 291A Page Title: Account Info > Contact Info Edit What you can do on this page This page allows you to edit any Entity and Account Manager contact information. Primary Actions Click "Submit" to keep the contact information changes you made and go to the Welcome page. Click "Cancel" to return to the previous page without changing your contact information. Help Home User Guide 291B Page Title: Account Info >Edit What you can do on this page: This page allows you to edit the Personalized Account Name and E-Mail Address in a Linked account. Other changes may be made in the Primary Account in the Account Info section. Primary Actions Click "Submit" to return to Account Info showing your updated information. Click "Cancel" to return to the previous page without changing your account. Help Home User Guide 292 Page Title: Learn More About Entity Accounts Certain kinds of entities are permitted to open accounts in TreasuryDirect. An entity account must be opened by an individual (known as the entity account manager) who can legally act alone when managing the account on behalf of the entity or organization. **IMPORTANT: Please visit "How Do I Open an Account for a Minor?" for further information about accounts for children. If a single individual can't legally act alone, then you can't open an entity account. The entity account manager may open an account by completing the online application. The account manager will choose a password, password reminder, security questions, and a personalized image/caption, and we'll e-mail the account number in just a few minutes. The account number and password are required to log into your TreasuryDirect account. Restrictions An entity is not permitted to: Have more than one registration per account Open a minor linked account Purchase securities as gifts for others or receive gift securities Name a secondary owner or beneficiary in its registration Grant View or Transact rights Fund the account using the Payroll Savings Plan An entity must: Appoint one account manager who can act alone. Be able to produce evidence (e.g., Trust, Letters of Appointment, etc.), if necessary, showing that the account manager can legally act alone. TreasuryDirect accommodates the following types of entity registrations Corporation Deceased Estate Limited Liability Company (LLC) Living Estate (court-appointed legal guardian of the estate of another living person) Partnership Professional Limited Liability Company (PLLC) Sole proprietorship Trust NOTE: Entity accounts are not available at this time for unincorporated associations, governmental organizations/officers, or tribal organizations. If you have an account in Legacy TreasuryDirect and are switching to TreasuryDirect, you may want to transfer your securities from your Legacy account to your TreasuryDirect account. To help you with this process, use the Instructions for transferring securities from Legacy TreasuryDirect. Entity Registration Types and Examples The registration for securities held in an entity account must accurately reflect the name of the entity. The forms of registration available for entities and the requirements to act as an entity account manager are: Corporation. A corporate form of registration is available for an entity that has been incorporated pursuant to state law. The registration must contain a reference to the corporate status. The entity account manager must be a corporate officer or designated employee and must certify that he or she has the authority to act alone on behalf of the corporation with regard to this account. Registration example: "ABC Corporation." The Employer Identification Number of the corporation will be used. Deceased Estate (The estate of a decedent). The decedent's estate form of registration is available for an individual or organization that has been appointed by a court according to state law to act on behalf of the estate of a decedent. This form of registration is not available where the legal representative is acting on behalf of a federal, state, or local government. The entity account manager must be the court-appointed individual legal representative or an employee of the court-appointed organizational legal representative who has the authority to act alone with regard to the account on behalf of the organization in its role as legal representative of the estate. Registration example: “John Doe, Legal Representative of the Estate of William Jones, a decedent.” The Employer Identification Number of the decedent’s estate or the Social Security Number of the decedent will be used. Limited Liability Company (LLC). The LLC form of registration is available for an entity that has registered articles of organization pursuant to state law. The registration must contain a reference to the company´s status. The entity account manager must be a company official or designated employee and must certify that he or she has the authority to act alone on behalf of the company with regard to this account. Registration example: "Summit Consulting Service, LLC." The Employer Identification Number of the company will be used Living Estate (A court-appointed legal guardian of the estate of another living person). This form of registration is available for an individual or organization that has been court-appointed according to state law to act on behalf of the estate of an incompetent person or other living person. This form of registration is not available where the legal guardian is acting on behalf of a federal, state, or local government. The entity account manager must be a court-appointed legal guardian who has the authority to act alone with regard to the account, or an employee of the court-appointed organizational legal guardian who has the authority to act alone with regard to the account on behalf of the organization in its role as legal guardian. Registration example: “John Doe, Legal Guardian of the estate of William Jones.” The Social Security Number of the incompetent person will be used. Partnership. A partnership form of registration is available for two or more individuals who are doing business as a partnership, including a limited liability partnership. Unless the name of a partnership includes the word "partnership," the registration must include descriptive words indicating partnership status. The entity account manager must be a general partner, and must certify that he or she has the authority to act alone on behalf of the partnership with regard to this account. Registration example: "Smith and Jones Construction Company, a partnership." The Employer Identification Number of the partnership or the Social Security Number of a partner will be used. Professional Limited Liability Company (PLLC). A PLLC form of registration is available for an entity that has registered articles of organization pursuant to state law. The registration must contain a reference to the company´s status. The entity account manager must be a company official or designated employee and must certify that he or she has the authority to act alone on behalf of the company with regard to this account. Registration example: "Paine Dental Associates, PLLC." The Employer Identification Number of the company will be used. Sole proprietorship. A sole proprietorship form of registration is available for an individual who is doing business as a sole proprietor. The entity account manager must be the owner of the business. Registration example: "John Doe DBA Doe Plumbing Supplies." The Employer Identification Number of the proprietorship or the Social Security Number of the individual doing business as the proprietor will be used Trust (Trustee of a Trust). A trust form of registration is available. The trust form of registration is not available for trusts in which the trustee is acting on behalf of a federal, state, or local government. The entity account manager must certify that he or she has the authority to act alone on behalf of the trust with regard to the account. The wording in the registration must specifically identify the trust. The registration must state: The authority or document creating the trust. The date the document was executed. (Not necessary in the case of a probated will.) The name of a trustee who is authorized to act alone on behalf of the trust. Any information that is necessary to distinguish the trust from any other trust. Name of the Grantor Registration examples: “John Doe, Trustee under Declaration of Trust dated January 1, 2001” “First National Bank, Trustee under Agreement with William Jones dated January 1, 2001, Employer Identification Number 12-3456789" "John Doe or Sarah Jones, Trustees under Agreement with Jane Doe dated January 1, 2001” “Sarah Jones, Trustee under the Will of Matthew Smith, deceased” The Employer Identification Number of the trust or the Social Security Number of the grantor will be used when establishing the account. If the trustees are individuals – one of them must be the entity account manager and that person must be named specifically in the registration. (Ex: “John Doe, Trustee under Declaration of Trust dated January 1, 2001”). If the trustee is an organization – the person acting as the entity account manager must be a duly authorized employee of that organization who has the authority to act alone and the organization must be named specifically in the registration. (Ex: “First National Bank, Trustee under Agreement with William Jones dated January 1, 2001, Employer Identification Number 12-3456789"). If the legal name of your trust, as shown in your trust document, shows more than one trustee and the names are joined by the connector "AND" (e.g., John Doe and Sarah Jones, Trustees under Agreement with Jane Doe dated January 1, 2001) you will be required to provide a Summary of Trust (also known as Certificate of Trust or Memorandum of Trust) or the appropriate pages of the trust showing that either named co-trustee may act independently. Please send the following pages of the document: The page showing the name and date of the trust. The page(s) identifying the trustee(s). If more than one trustee is named and each can act independently, submit that portion of the trust. The signature page(s). Any amendments to the trust that may alter the information on the pages submitted or limit the authority of the trustee. Mail the information to: Treasury Retail Securities Services PO Box 214 Minneapolis, MN 55480-0214 IRS Name Control When establishing an entity account, you must furnish a name control code provided by the IRS. A name control is a sequence of characters, generally the first four characters of a taxpayer's last name or the first four letters of a business name. The name control is used by the IRS to process information electronically reported to them. It is important that the combination of name control and Taxpayer Identification Number (TIN) provided on electronically reported information match IRS´s record of name controls and TINS. For more information on name control, go to https://www.irs.gov/ and search ‘name control’. Change in Entity Account Manager The entity account manager is the only person authorized to perform transactions in the TreasuryDirect account. If an event occurs that necessitates a change of entity account manager, the currently acting account manager and/or the new account manager must complete the appropriate sections of the TreasuryDirect Offline Transaction Request, FS Form 5446. To explain why the change in Employer Identification Number is requested, legal evidence must also be provided (a copy of the trust, letters of resignation, partnership agreement, corporate resolution, articles of organization, letters of appointment, death certificate, etc.). See the form for additional instructions. (We don't return legal evidence.) Abbreviations Due to space limitations in the Entity Name (Registration), abbreviations may be used in place of full words or titles. Accepted abbreviations include the following: Abbreviations Name Abbreviation Administrator ADM Co-Administrators CO-ADM Co-Executors CO-EX Co-Trustee CO-TR Conservator CONS Court Order CT ORD Custodian CUST Doing Business As DBA Deceased DECD Estate EST Executor or executrix EX Executor of the estate of;Executor under the will of EX U/W Guardian GDN Of estate of EST or O/E/O Partnership PTNSP Personal Representative PERS REP Persons entitled to the estate PERS ENT EST Professional Association PA Professional Corporation PC Public Administrator PUB ADM Representative REP Retirement RET Revocable REV Trustee Under Agreement TR U/A Trustee Under Will TR U/W Under Declaration of Trust U/D/T;U/DECL/TR Under Legal Guardianship U/L/GDN Under Trust Agreement U/TR/A Under (The) Will of; Under theLast Will and Testament of U/W Help Home User Guide 293 Page Title: ManageDirect® > Reinvestment Request Schedule What you can do on this page: After you select a security type to reinvest, this page lists all eligible Treasury marketable securities which have no reinvestments scheduled. You may select one or up to 50 securities to reinvest at one time. Enter the number of times you want each security reinvested. NOTE: If you accessed this page from Current Holdings Detail for a particular security, only that security will be displayed. You can Learn more about Reinvesting Maturing Proceeds . Primary Actions Click "Submit" to confirm your request. Click "Cancel" to return to the previous pag'''
