["https://treasurydirect.gov/help-center/faqs/glsf-faqs"]
title = "FAQs for Government Losses in Shipment Fund (GLSF) — TreasuryDirect"
full_description = "Help Center FAQs for Government Losses in Shipment Fund (GLSF) FAQs for Government Losses in Shipment Fund (GLSF) What is the Government Losses in Shipment Fund (GLSF)? The Government Losses in Shipment Fund (GLSF) is a revolving fund in the Treasury used for the replacement of valuables, or the value of valuables lost, destroyed, or damaged while being shipped in accordance with regulations. The fund is available to the Federal Government, including its' executive departments, independent establishments, agencies, wholly owned Government corporations, officers, or employees. When valuables that have been shipped in accordance with regulations are lost, destroyed, or damaged a claim in writing for replacement shall be made on the Secretary of the Treasury. For more information, or to make a claim, please contact the Bureau of the Fiscal Service, Division of Financial Management at (304) 480-7109. NOTE: This phone number is NOT for questions or issues with the TreasuryDirect application or questions about savings bonds. For questions or issues with the TreasuryDirect application or savings bonds, please call 844-284-2676. We're Here to Help Contact Us"
year_published = 2025
