full_description = "Laws, Regulations and Guidance Laws & Regulations Auction Regulations (UOC) Collateral Programs Acceptable Collateral for the Special Direct Investment (SDI) Program Acceptable Collateral for the Term Investment Option (TIO) Program Acceptable Securities and Assigned Margins for Treasury's Repurchase Agreement (Repo) Program Commercial Book-Entry Regulations (TRADES) Frauds, Phonies, & Scams Government Securities Act (GSA) Regulations Large Position Reporting (LPR) Redemption Ops (Buyback) Rules Treasury Marketable Securities Regulations Savings Bond Regulations TreasuryDirect Regulations Links to Other Sites Laws & Regulations Collateral Programs Collateral Programs Government agencies must ensure the security of public money on deposit at depository institutions, such as a bank. A bank must pledge collateral (see Treasury’s lists of acceptable collateral) to secure these funds. This page contains information and links to the rules governing Treasury’s Fiscal Service collateral programs, lists of acceptable collateral, and collateral margins tables. You can learn more about Treasury's 31 CFR Part 202 and 225 collateral programs from Treasury Collateral Management and Monitoring The Federal Reserve Banks act as fiscal agent for Treasury's Fiscal Service collateral programs. Find out more at: frbservices.org/treasury-services/collateral-services.html Questions? Treasury Support Center 1-888-568-7343 Option 2: Collateral Monitoring Lists of Acceptable Collateral and Margins Tables for the Payment of Federal Taxes and the Treasury Tax and Loan (TT&L) Program (31 CFR Part 203) Note: Treasury's TT&L Program is currently inactive. Acceptable Collateral for the Treasury Tax and Loan (TT&L) Program (PDF, November 1, 2023) Acceptable Collateral for the Special Direct Investment (SDI) Program Acceptable Collateral for the Term Investment Option (TIO) Program Acceptable Securities and Assigned Margins for Treasury's Repurchase Agreement (Repo) Program TT&L 