full_description = "Federal Investments Program About the Federal Investments Program Federal Investments Program Reports Statement of Account Interest Cost by Fund Report Principal Outstanding Report Investments Distribution Query Investments Transaction Query Customer Guides & Forms Government Users About the Federal Investments Program Federal Investments Program Reports Federal Investments Program Reports This section contains a variety of reports for Federal Investments Program customers invested in Government Account Series (GAS) securities. Click on the links below to access these reports. Statement of Account - Monthly detailed reports specifying the security holdings as of the end of each month and all transaction activity during that month for each individual investment account. Interest Cost by Fund Report - A monthly summary report containing premiums, discounts, accrued interest collected, interest payments, and inflation compensation for all investment accounts, as well as premium and discount amortization for accounts invested in zero-coupon bonds. Principal Outstanding Report - A monthly report containing principal balances at individual security level for all investment accounts. Investments Distribution Query - A query, updated daily, showing balances data at the security level for each individual investment account as of any date up to and including current day. Investments Transaction Query - A query, updated daily, showing transaction data for each individual investment account for date ranges up to and including current day, but not to exceed 366 days."
