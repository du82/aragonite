full_description = "Help Center The Help Center offers step-by-step instructions, answers to frequently asked questions (FAQs), and glossaries of common words used on this website. From this page, you can get help setting up, logging in, and using our online program, TreasuryDirect get to our glossaries to find definitions for words we use that you may not know If you don’t find what you need on our website, you can email or call us. Our contact information is further down this page. Help for TreasuryDirect (TreasuryDirect is our online program for holding and managing your electronic Treasury securities) Setting up an account About TreasuryDirect Open an individual account Link an account for a minor (a child under 18) Open an entity account (for corporations/organizations/trusts) Logging in Forgot my password Forgot my account number Help with one-time passcodes Using TreasuryDirect Help for TreasuryDirect (links to many topics, a demo, technical support, and more) How do I? (step-by-step instructions to major actions when logged in to TreasuryDirect) TreasuryDirect Videos Legacy Treasury Direct Help Center Guides Savings Bonds Help Redeeming a Paper Savings Bond Change of Ownership Lost, Stolen, or Destroyed Bonds See More Securities & Auctions Participate in an Auction Types of Bids Searching by CUSIP Number Learn More About Redeeming/Reinvesting Floating Rate Notes Learn More About Selling Floating Rate Notes See More Frequently Asked Questions FAQs for Savings Bonds FAQs for Treasury Marketable Securities FAQs for Auctions FAQs for Floating Rate Notes FAQs for Public Debt FAQs for SLGS FAQs for SLGSafe FAQs for Buybacks FAQs for Additional Auction Related Subjects FAQs for Unclaimed Money and Assets FAQs for Government Losses in Shipment Fund (GLSF) FAQs for Payments to Fiscal Service's Accounts Receivable Section Glossaries Glossary of Terms Go to the Glossary of Terms Glossary for Savings Bonds Terms Go to the Glossary for Savings Bonds Terms Glossary for Tr