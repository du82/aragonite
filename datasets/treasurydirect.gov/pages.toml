earSelectElement = document.getElementById('year'); const monthSelectElement = document.getElementById('month'); const monthListArray = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; function pad(n, width, z) { z = z || '0'; n = n + ''; return n.length >= width ? n : new Array(width - n.length + 1).join(z) + n; } function getPreviousMonth(date, howFarBack) { let lastMonth; if (date.getMonth() === 0) { lastMonth = new Date(date.getFullYear() - howFarBack, 11, 1); } else { lastMonth = new Date(date.getFullYear(), date.getMonth() - howFarBack, 1); } return lastMonth; } function getFirstBusinessDay(year, month) { let worked = 0; for (let i = 1; i <= 31; i++) { let testDate = new Date(year, month, i); let day = testDate.getDay(); if (day > 0 && day < 6) { if (++worked === 1) { return i; } } } } function populateYear(todaysDate, selectElement) { let yearArray = []; if (now.getMonth() === 0) { for (let i = 0; i <= ((now.getFullYear() - 1) - 2001); i++) { yearArray.push(i + 2001) } } else { for (let i = 0; i <= (now.getFullYear() - 2001); i++) { yearArray.push(i + 2001) } } yearArray.reverse(); for (let i = 0; i < yearArray.length; i++) { let optionElement = document.createElement('option'); optionElement.value = yearArray[i]; optionElement.innerHTML = yearArray[i]; selectElement.appendChild(optionElement); } } function populateMonth(event) { let monthArray = []; let selectedYear; if ((event !== undefined) && (event !== null)) { selectedYear = parseInt(event.target.options[event.target.selectedIndex].value); } else { selectedYear = now.getFullYear(); } if (selectedYear === now.getFullYear() && now.getMonth() !== 0) { if (getFirstBusinessDay(now.getFullYear(), now.getMonth()) <= now.getDate()) { for (let i = 0; i <= getPreviousMonth(now, 1).getMonth(); i++) { monthArray.push(monthListArray[i]); } } else { for (let i = 0; i <= getPreviousMonth(now, 2).getMonth(); i++) { monthArray.push(monthListArray[i]); } } } else { monthArray = monthListArray; } while (monthSelectElement.firstChild) { monthSelectElement.removeChild(monthSelectElement.lastChild); } for (let i = 0; i < monthArray.length; i++) { let optionElement = document.createElement('option'); optionElement.value = pad((i + 1), 2, 0); optionElement.innerHTML = monthArray[i]; monthSelectElement.appendChild(optionElement); } } function commit(event) { event.preventDefault(); let reportURI = '/ftp/fib/dfi' + event.target.elements['accountNumber'].value + event.target.elements['year'].value + event.target.elements['month'].value + '.txt'; window.open(reportURI, 'Account Statement'); } populateYear(now, yearSelectElement); populateMonth(); yearSelectElement.addEventListener('change', populateMonth); form.addEventListener('submit', commit); }());"
