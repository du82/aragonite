full_description = '''Legal Notices Freedom of Information Act Laws & Guidance Privacy Policy Terms & Conditions Intellectual Property Report problems with our data Web Development APIs Accessibility Terms & Conditions Terms & Conditions These Terms and Conditions govern the access and use of our website and should be read carefully. By accessing or using our website, the user accepts and agrees to be bound by these Terms and Conditions as they may from time to time be modified by TreasuryDirect.gov, fiscal.treasury.gov, and all other websites operated by the Bureau of the Fiscal Service ("Fiscal Service"). As used below, the terms "we," "us" and "our" refer to TreasuryDirect.gov, fiscal.treasury.gov and all other websites operated by Fiscal Service. A. Security Notification. You are entering an official United States government system, which may be used only for authorized purposes. The government may monitor and audit usage of this system. You are hereby notified that use of this system establishes your consent to such monitoring and auditing. For site security purposes and to ensure that this service remains available to all users, we employ software programs to monitor network traffic, to identify unauthorized attempts to upload or change information, or otherwise cause damage. Unauthorized attempts to upload or change information on this website are strictly prohibited and are subject to prosecution under the Computer Fraud and Abuse Act of 1986, 18 U.S.C. §1001 and §1030, the National Information Infrastructure Protection Act, and relevant executive orders. B. Jurisdictional Issues and Applicable Law. For jurisdiction and venue purposes: If you take legal action relating to Treasury securities, or any other information or transaction conducted on these websites, you agree to accept jurisdiction of the U.S. federal courts. Unless otherwise specified, federal law and regulations, which have the force and effect of law, govern the operation of these websites and the terms and conditions. C. Regulations Governing Electronic Transactions. We have regulations governing electronic transactions, which are set out in 31 CFR part 370 "Electronic Transactions and Transfers relating to Treasury Securities." These regulations generally apply as a matter of contract law. The regulations require you to: exercise ordinary care in protecting the means (account number, password, or digital certificate) that you use to access our site and conduct transactions electronically. If you don't exercise ordinary care and an unauthorized transaction is the result, then under some circumstances you could be held accountable for those transactions. inform us promptly if you believe that another person has improperly obtained your means of accessing our site and conducting transactions electronically. 1. PROHIBITION AGAINST MISUSE OF TREASURY NAMES, TERMS, SYMBOLS, STATIONERY, ETC. Government works generally cannot be copyrighted, though we request that we be given appropriate credit. Section 31 U.S.C. § 333 prohibits the use of names, terms, symbols, and stationery of the Department of the Treasury, as well as any colorable imitations of these items in a way that gives the false impression that Treasury is involved in their use. It is illegal to falsely imply that business activities are in any manner approved, endorsed, sponsored, authorized by, or associated with the Department of the Treasury. For instance, linking to or framing this site in a manner designed to falsely imply a relationship with Treasury is forbidden under the statute. You should know that Section 333 expressly provides that the use of disclaimers of Treasury involvement in materials or on a website can be ignored when we determine that the statute has been violated. 2. INTELLECTUAL PROPERTY RIGHTS This site contains trademarks, service marks and trade names owned by Fiscal Service ("Fiscal Service Intellectual Property") that are protected by applicable trademark and other intellectual property laws. You may view, download and print material on this site for non-commercial personal use only. However, without the express prior written consent of Fiscal Service and any other rights owner, you may not publicly display, perform, transmit, list, modify, reproduce, distribute, participate in the transfer or sale of, make derivative works from, upload or otherwise use any of the Fiscal Service Intellectual Property contained on this website or the selection, arrangement or coordination of its content. If you receive such permission, you may not delete, change or in any manner or fashion alter or enhance the existing trademark notices. You should not assume anything on this site is necessarily in the public domain. Additionally, you agree not to post or use any information from this site for any advertising or solicitation for products or services without Fiscal Service's express prior written consent. 3. DISCLAIMER OF LIABILITY AND WARRANTIES Fiscal Service does not warrant the accuracy, adequacy or completeness of the information and materials and expressly disclaims liability for errors or omissions in this information and materials. No warranty of any kind, implied, expressed or statutory including but not limited to the warranties of non-infringement of third party rights, title, merchantability, fitness for a particular purpose and freedom from computer virus, is given with respect to any software, information, or other item located on, derived from, or linked to by this website. Everything is provided "as is," "as available." In no event will Fiscal Service be liable for any damages, including without limitation direct or indirect, special, incidental or consequential damages, losses or expenses of any kind arising in connection with the use of or inability to use this website or any linked site. Additionally, we aren't liable for any item created by you or any third party, including, but not limited to, software products such as savings bond applications. Use of this service and any service derived wholly or in part from this website is at your own risk. You assume the entire cost of all necessary servicing, repair, or correction of your property or operations as a result of using this website. You also accept, at your own risk, that the Internet and online communications medium may not perform as intended despite our efforts, those of your Internet service provider, or you. 4. DISCLAIMER OF ENDORSEMENT Fiscal Service doesn't endorse any commercial product, process, service or enterprise, by trade name, trademark, service mark, manufacturer or otherwise. Links to other websites and references to any commercial product or enterprise are provided solely for your convenience, and do not necessarily constitute or imply our endorsement, recommendation or exclusive approval thereof. Accordingly, Fiscal Service does not endorse or assume responsibility for the content provided on any third-party website to which we are linked. 5. YOUR ACCOUNT If you use this site, you are responsible for maintaining the confidentiality of your account, password and for restricting access to your computer. You also agree to assume responsibility for all activities that occur under any account or password that you maintain for electronic commerce with Treasury or Fiscal Service. TreasuryDirect.gov, fiscal.treasury.gov and all other websites operated by Fiscal Service do not sell products to minors. If you are under 18, you may use TreasuryDirect.gov only with involvement of a parent or guardian. TreasuryDirect.gov, fiscal.treasury.gov, and all other websites operated by Fiscal Service reserve the right to refuse service, terminate accounts, remove or edit content, or cancel purchases in their sole discretion. 6. VENUE, JURISDICTION AND CHOICE OF LAW By accessing this site, you are consenting to the exclusive jurisdiction of the United States federal courts located in Washington, D.C., in any action arising out of or relating to this agreement, including without limitation any use of this website. Additionally, you waive any other venue to which you might be entitled by domicile or otherwise. This agreement and your use of this website will be governed by and construed in accordance with the federal laws of the United States of America. 7. MISCELLANEOUS ITEMS The provisions of this page extend to TreasuryDirect.gov, fiscal.treasury.gov, and all other websites operated by Fiscal Service.'''
