lectual property laws. You may view, download and print material on this site for non-commercial personal use only. However, without the express prior written consent of Fiscal Service and any other rights owner, you may not publicly display, perform, transmit, list, modify, reproduce, distribute, participate in the transfer or sale of, make derivative works from, upload or otherwise use any of the Fiscal Service Intellectual Property contained on this website or the selection, arrangement or coordination of its content. If you receive such permission, you may not delete, change or in any manner or fashion alter or enhance the existing trademark notices. You should not assume anything on this site is necessarily in the public domain. Additionally, you agree not to post or use any information from this site for any advertising or solicitation for products or services without Fiscal Service's express prior written consent. 3. DISCLAIMER OF LIABILITY AND WARRANTIES Fiscal Service does not warrant the accuracy, adequacy or completeness of the information and materials and expressly disclaims liability for errors or omissions in this information and materials. No warranty of any kind, implied, expressed or statutory including but not limited to the warranties of non-infringement of third party rights, title, merchantability, fitness for a particular purpose and freedom from computer virus, is given with respect to any software, information, or other item located on, derived from, or linked to by this website. Everything is provided "as is," "as available." In no event will Fiscal Service be liable for any damages, including without limitation direct or indirect, special, incidental or consequential damages, losses or expenses of any kind arising in connection with the use of or inability to use this website or any linked site. Additionally, we aren't liable for any item created by you or any third party, including, but not limited to, software products such as savings bond applications. Use of this service and any service derived wholly or in part from this website is at your own risk. You assume the entire cost of all necessary servicing, repair, or correction of your property or operations as a result of using this website. You also accept, at your own risk, that the Internet and online communications medium may not perform as intended despite our efforts, those of your Internet service provider, or you. 4. DISCLAIMER OF ENDORSEMENT Fiscal Service doesn't endorse any commercial product, process, service or enterprise, by trade name, trademark, service mark, manufacturer or otherwise. Links to other websites and references to any commercial product or enterprise are provided solely for your convenience, and do not necessarily constitute or imply our endorsement, recommendation or exclusive approval thereof. Accordingly, Fiscal Service does not endorse or assume responsibility for the content provided on any third-party website to which we are linked. 5. YOUR ACCOUNT If you use this site, you are responsible for maintaining the confidentiality of your account, password and for restricting access to your computer. You also agree to assume responsibility for all activities that occur under any account or password that you maintain for electronic commerce with Treasury or Fiscal Service. TreasuryDirect.gov, fiscal.treasury.gov and all other websites operated by Fiscal Service do not sell products to minors. If you are under 18, you may use TreasuryDirect.gov only with involvement of a parent or guardian. TreasuryDirect.gov, fiscal.treasury.gov, and all other websites operated by Fiscal Service reserve the right to refuse service, terminate accounts, remove or edit content, or cancel purchases in their sole discretion. 6. VENUE, JURISDICTION AND CHOICE OF LAW By accessing this site, you are consenting to the exclusive jurisdiction of the United States federal courts located in Washington, D.C., in any action arising out of or relating 