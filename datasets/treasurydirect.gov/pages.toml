["https://treasurydirect.gov/government/historical-debt-outstanding"]
title = "History of the Debt — TreasuryDirect"
full_description = '''Government History of the Debt The History of the Debt The Annual Historical Debt Outstanding reports have moved to FiscalData.Treasury.gov where they are available for download in multiple machine-readable formats with complete metadata! Select the plus signs below to read about different periods in the history of the debt. Our Heritage "The United States debt, foreign and domestic, was the price of liberty. The faith of America has been repeatedly pledged for it... Among ourselves, the most enlightened friends of good government are those whose expectations of prompt payment are the highest. To justify and preserve their confidence; to promote the increasing respectability of the American name; to answer the calls of justice; to restore landed property to its due value; to furnish new resources, both to agriculture and commerce; to cement more closely the Union of the States; to add to their security against foreign attack; to establish public order on the basis of an upright and liberal policy; these are the great and invaluable ends to be secured by a proper and adequate provision, at the present period, for the support of public credit." Alexander Hamilton, 1790, First Report on the Public Credit Public Debt In America 1798 bond Public debt is a fact of life. The U.S. has had debt since its inception. Our records show that debts incurred during the American Revolutionary War amounted to $75,463,476.52 by January 1, 1791. Over the following 45 years, the debt grew. Notably, the public debt actually shrank to zero by January 1835, under President Andrew Jackson. But soon after, it quickly grew into the millions again. The American Civil War resulted in dramatic debt growth. The debt was just $65 million in 1860, but passed $1 billion in 1863 and had reached $2.7 billion following the war. The debt grew steadily into the Twentieth Century and was roughly $22 billion as the country paid for involvement in World War I. The buildup to World War II brought the debt up another order of magnitude from $51 billion in 1940 to $260 billion following the war. After this period, the debt's growth closely matched the rate of inflation until the 1980s, when it again began to increase rapidly. Between 1980 and 1990, the debt more than tripled. The debt shrank briefly after the end of the Cold War, but by the end of FY 2008, the gross national debt had reached $10.3 trillion, about 10 times its 1980 level. The national debt as a percentage of the gross domestic product In recent years there has been a "debt ceiling" in effect. Whereas Congress once approved legislation for every debt issuance, the growth of government fiscal operations in the 20th century made this impractical. (For example, the Treasury now conducts more than 425 sales of debt by auction every year to fund $22 trillion in debt operations.) The Treasury was granted authority by the Congress to issue such debt as was needed to fund government operations as long as the total debt did not exceed a stated ceiling. The "ceiling" is routinely raised by passage of new laws by the United States Congress. Under Public Law 113-83, Temporary Debt Limit Extension Act, the statutory debt limit is suspended through March 15, 2015. The 18th Century 1776: The Birth of Public Debt George Washington portrait by Gilbert Stuart "No pecuniary consideration is more urgent than the regular redemption and discharge of the public debt: on none can delay be more injurious, or an economy of the time more valuable." George Washington, 1793, Message to the House of Representatives The public debt of the United States can be traced back as far as the American Revolution. In 1776, a committee of ten founders took charge of what would become the Treasury, and they helped secure funding for the war through "loan certificates" (equivalent to bonds) with which they borrowed money for the fledgling government from France and the Netherlands. This committee morphed over the next decade into the Department of Finance. Robert Morris, a wealthy merchant and Congressman (nicknamed "The Financier"), was chosen to lead a new Department of Finance in 1782. As the new Superintendent of Finance, Morris was the first committee member to order a reporting of the total government debt owed. This marked the beginning of annual Treasury reports to the President. On January 1, 1783, the public debt of the new United States totaled $43 million. 1783: Raising Taxes to Meet Operating Expenses In 1783, Congress was given the power to raise taxes. This helped meet the normal operating expenses of the new national government. But in 1785, revenues were still inadequate. Alexander Hamilton rallied for the government to assume some debt and help meet its expenses. He pushed the framers of the new Constitution to establish measures to provide the assurance that the debt would be paid, and thus increase confidence in the growing government. Many of Hamilton's policies have remained a part of our government's operations ever since. On September 2, 1789, Congress established The Treasury Department, naming Alexander Hamilton, its chief architect, as "Secretary." Alexander Hamilton, portrait by John Trumbull, 1792 1789: Alexander Hamilton Alexander Hamilton (b. January 11, 1755 - d. July 12, 1804) was the first United States Secretary of the Treasury, a Founding Father, economist, political philosopher and confidant of George Washington. He was one of America's first Constitutional lawyers, and co-wrote "The Federalist Papers," a primary source for Constitutional interpretation. As Washington's Treasury Secretary, Hamilton was very influential in the policy decisions of the new government. An admirer of British political systems, Hamilton emphasized strong central government and implied powers, under which the new U.S. Congress funded the national debt, assumed state debts, created a national bank, and established tariffs and taxes. "A national debt, if it is not excessive," Hamilton argued, "will be to us a national blessing." 1790: The Funding Act Hamilton, estimating the total public debt at $77.1 million, called for the issuance of new federal bonds to cover the debt. By assuming the obligation to pay this debt, the government firmly established its good credit. By February 1792, interest-bearing government bonds were selling for $1.20-on-the-dollar. A shrewd investor, buying $100 in bonds in 1786 (at a market price of about $15) could have sold the replacement bonds issued by the new government for $121.50 in 1792, realizing a handsome profit. The system of debt management instituted by Hamilton worked well to consolidate the debt and permit the government to make interest payments as they came due (as well as to secure the faith and credit of the government in the new United States and abroad). 1791: The Bank To consolidate the government's financial affairs, Hamilton proposed the formation of a national bank to supplement the activities of The Treasury. Despite the opposition of Jefferson and Madison, the First Bank of the United States opened in 1791 with a total capital of $10 million. Just ten years later, though, Jeffersonian Democrats, who didn't trust banks, overturned this progress. Jefferson's Secretary of the Treasury, Albert Gallatin, was a chief critic of Hamilton's methods of debt management, and made it his priority to reduce public debt. This worked for a time, reducing the public debt to $45.2 million by 1811, but was derailed by Jefferson's "Louisiana Purchase." The 19th Century Albert Gallatin, 1848 1803: Albert Gallatin Abraham Alfonse Albert Gallatin (b. January 29, 1761 – d. August 12, 1849) was a Swiss-American anti-Federalist diplomat and congressman, and the longest-serving United States Secretary of the Treasury. He opposed Hamilton’s entire program, but, faced with declining revenues and the massive cost of the War of 1812, Gallatin was forced to reintroduce the Federalist taxes he had previously denounced. By funding the war deficit ($69 million) with bond issues, he helped defray the costs. He later helped charter the Second Bank of the United States in 1816. 1812: The First Test of Debt The War of 1812 was financed mainly through the use of borrowed funds. Total public debt increased from $45.2 million on January 1, 1812, to $119.2 million as of September 30, 1815. Andrew Jackson, portrait by Thomas Sully, 1824 1837: Andrew Jackson Andrew Jackson, the seventh president of the United States, was suspicious of banks and did not trust the paper money they issued. In 1837, he liquidated the Second Bank of the United States, returning the government’s original investment plus a profit. This resulted in a huge government surplus of funds. (In 1835, the $17.9 million budget surplus was greater than the total government expenses for that year.) By January of 1835, for the first and only time, all of the government’s interest-bearing debt was paid off. Congress distributed the surplus to the states (many of which were heavily in debt). The Jackson administration ended with the country almost completely out of debt! 1846: Rebuilding the Debt The United States went to war with Mexico in May, 1846, over the annexation of Texas and California. The total cost of the war was estimated to be $64 million, and Congress authorized the issuing of additional debt to meet these obligations. It is this concept that would later become the basis for the Savings Bond program. By the end of 1849, public debt totaled $63.1 million. 1860: The Civil War "This war of ours, in its magnitude and in its duration, is one of the most terrible. It has produced a national debt and taxation unprecedented, at least in this country. It has carried mourning to almost every home, until it can almost be said that the 'heavens are hung black'." Abraham Lincoln, 1864, Speech at Great Central Sanitary Fair, Philadelphia, PA Public debt in 1860 totaled $64.8 million (the annual budget of the federal government at the time was $63.1 million). But this small debt would look completely insignificant compared to the amount of money the government would owe at the end of the Civil War. It is estimated that the Civil War cost the nation $5.2 billion in direct expenditures. As the war dragged on, the federal government was forced to completely overhaul its financial organization to cope with this as-yet-unheard-of amount. Enormous leaps in the methods and amount of public financing took place during the war years, including: Legal Tender Act (1862) authorized the Treasury to issue $150 million in United States notes and authorized the sale of $500 Million in bonds to fund the war effort. National Bank Act (1863) permitting the charter of national banks. By the end of 1865, interest-bearing public debt stood at $2.2 billion, but the union had been preserved. Salmon P Chase, circa 1855-65 1865: Salmon P. Chase Salmon Portland Chase (b. January 13, 1808 – d. May 7, 1873) was one of Lincoln’s first political appointees, and served as U.S. Treasury Secretary during the Civil War (and then as Supreme Court Chief Justice of the United States). Chase was an active and avid abolitionist, and devoted to ending slavery. As Treasury Secretary, Chase oversaw the establishment of a national banking system, which secured a market for government bonds and provided a permanent uniform national currency. The first U.S. federal currency was printed in 1862, during Chase’s tenure as Secretary of the Treasury. He designed the bills (many of which originally featured his likeness). 1899: Dawn of a New Age At the close of the fiscal year of 1899, the gross debt including Treasury Notes stood at $1.9 billion, and government ended the century with its finances in very good order. The World Wars Third Liberty Loan Poster 1913: Federal Reserve The aftermath of the financial panic of 1907 caused many financial experts to rethink the need for a central bank in the United States. Legislation in 1913 enabled the formation of the Federal Reserve System, giving it the responsibility of maintaining flexibility in the money supply, providing a way to rediscount bank loans (by selling loans on a secondary market to increase credit), and overseeing the functions of the banking system. Prior to our entrance into WWI, the Treasury also underwent a process of reorganization. In 1916, the government prepared for war by raising taxes and authorizing the Treasury to borrow $300 million. Congress authorized the first Liberty Loan of $5 billion, and permitted the Treasury to sell $2 billion in short-term certificates to generate operating revenues. By the end of 1919, total debt exceeded $25 billion, but the war was won and a great burden of debt had been accepted and managed without causing substantial disruption to the economy. 1920: Reorganization The Bureau of the Public Debt (established later, in 1940) is a direct descendant of the reorganization of the Treasury Department in 1919 and 1920. What had been the Office of the Register and the Division of Loans and Currency were both placed under a new Commissioner of the Public Debt, who headed the new Public Debt Service. A Division of Public Debt Accounts and Audits was formed to maintain auditing control over these two operations and the public debt efforts of the Federal Reserve. At the time, the number of Public Debt Service employees totaled 3061. 1929: Panic Through the 1920s, federal budget surpluses got as high as $689 million. Total debt was gradually reduced from $24 billion to about $17 billion. But business activity began to decline in the summer of 1929, and the stock market crash followed in October. By the early 1930s, it was apparent that a major economic crisis was in progress. President Hoover tried to balance the budget, and FDR continued this after being elected in 1932, but bad times forced the deficit up as public works efforts (to offset financial hardships) were funded. By 1933, the budget deficit was nearly $3 billion, and the debt had risen to more than $22 billion. Many economists at the time disdained the attempt to balance the budget "no matter what," and, drawing on the ideas of the English economist John Maynard Keynes, thought that a general fiscal depression was as great a national emergency as a war, and that the government should be willing to use deficits to stimulate the economy, just as it would borrow money to fight a war. John Maynard Keynes (right) and Harry Dexter White at the Bretton Woods Conference, 1944 1932: John Maynard Keynes John Maynard Keynes (b. June 5, 1883 – d. April 21, 1946) was a British economist whose ideas, called "Keynesian economics," had a major impact on modern economic and political theory as well as on many governments' fiscal policies. He advocated an "interventionist" government policy, by which the government would use fiscal and monetary measures to mitigate the adverse effects of economic recessions, depressions and booms. He is one of the fathers of modern the'''
