full_description = '''Contact Us This page shows how to reach us by email, phone, and U.S. mail. How-To Guides and FAQs Processing Times Heavy volume is slowing our response time to cases sent by mail. The following transactions require at least 2 weeks of processing time if bonds and/or TreasuryDirect accounts are in your name. Cashing paper savings bonds where you are named on the bonds, and you send in the bonds with your request Unlocking your TreasuryDirect account or updating your banking information within that account Converting your paper savings bonds into electronic format (in a TreasuryDirect account) Requests to search for lost, stolen or missing savings bonds require at least 4 months to process. Other paper savings bond transactions you are authorized to handle, but not in your name require at least 6 weeks to process. Other TreasuryDirect requests, including trusts, may require 6 months or more to process. TreasuryDirect customers: Our call center hours are Monday-Friday, 8am-6pm ET. You may reach us at 844-284-2676. If you open an account and are asked to send us an Account Authorization form, you must submit the form before you can access your account. Don't forget to have your signature certified. You can make some bank changes online while logged in to your account. Click the ManageDirect tab and then "Update my Bank Information." Web help: How do I . . . ? Instructional videos To recover account number To reset password Call or Write Us U.S. Savings Bonds Electronic Savings Bonds Treasury Retail Securities Services P.O. Box 9150 Minneapolis, MN 55480-9150 Paper Savings Bonds Toll-free: 844-284-2676 Note: Beware of scammers, and carefully dial the correct numbers. Remember, we charge no fees, nor do we offer gifts for working with our office. Series EE and Series I Treasury Retail Securities Services P.O. Box 9150 Minneapolis, MN 55480-9150 Series HH and Series H Treasury Retail Securities Services P.O. Box 9150 Minneapolis, MN 55480-9150 Treasur