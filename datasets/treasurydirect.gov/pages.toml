["https://treasurydirect.gov/government/federal-investments-program"]
title = "About the Federal Investments Program — TreasuryDirect"
full_description = "About the Federal Investments Program Certain authorized federal agencies may invest funds with Treasury. The software used to transact investments is called FedInvest. Federal Investments Program About the Federal Investments Program Federal Investments Program Reports Statement of Account Interest Cost by Fund Report Principal Outstanding Report Investments Distribution Query Investments Transaction Query Customer Guides & Forms Government Users About the Federal Investments Program The Federal Investments Program The Federal Investments Program is administered by the Bureau of the Fiscal Service’s (Fiscal Service) Federal Investments and Borrowings Branch (FIBB). Federal agencies that have the proper legal authority granted by Congress can invest funds in Government Account Series (GAS) securities with the Department of the Treasury (Treasury). Treasury will review and document all new investment authority prior to initial investment activity. The purpose of the Federal Investments Program is to facilitate these investments on behalf of Treasury. The Federal Investments Program represents about one fifth of the public debt outstanding, providing services to approximately 240 trust, deposit, and special Funds. Customer Guides & Forms The Federal Investments and Borrowings Branch (FIBB): Maintains detailed records of GAS investment transactions between Treasury and other federal agencies. Accounts for and reports Treasury's Federal Investments Program-related debt and the associated accruals and payments. Develops and maintains accounting policies and standards for the management of the Federal Investments Program. The FedInvest Software Application FedInvest is a Federal Investments Program application, owned and maintained by Fiscal Service, to be used by federal agencies for investment in GAS securities. FedInvest allows federal agencies to buy and sell securities, view account holdings, transactions, and reports, and download data. The FedInvest system is only accessible by a PIV/CAC/LincPass card, or a ID.me account. Refer to the FedInvest User Credentialing Requirements for detailed information. Login to FedInvest Guidance TFM Volume I, Part 2, Chapter 4300 – Communicates the policies and procedures of Treasury about government accounts that the Secretary of the Treasury is authorized or directed by law to invest. TFM Volume I, Part 2, Chapter 4700 – Describes how agencies provide data for the Financial Report of the United States Government. Contact FIBB 304-480-5151 Option 3 FedInvestor@fiscal.treasury.gov Department of the Treasury Bureau of the Fiscal Service Federal Investments and Borrowings Branch, Room 119 Parkersburg Warehouse & Operations Center Dock 1 257 Bosley Industrial Park Drive Parkersburg, WV 26101"
