["https://treasurydirect.gov/legal-information/foia"]
title = "Freedom of Information Act — TreasuryDirect"
full_description = '''Legal Notices Freedom of Information Act Reports of unclaimed money Laws & Guidance Privacy Policy Terms & Conditions Report problems with our data Web Development APIs Accessibility Freedom of Information Act Freedom of Information Act Look here for the information first You'll find a lot of information about the public debt and the Treasury securities we sell right here on our website. We've got information about Bills, Notes, and Bonds, Savings Bonds, and other special securities. You can also find a lot of public debt statistics or do a quick search of our site. After you look around on your own, if you don't find what you want to know about us, send us an email from our Contact Us page. You just might find all the information you're looking for here without having to make a formal Freedom of Information Act (FOIA) request and paying a fee. Try looking around on our website first; it will probably be the most convenient way for you to get information. How to make a FOIA request The Bureau of the Public Debt consolidated with the Financial Management Service in October 2012 to become the Bureau of the Fiscal Service. All FOIA requests for TreasuryDirect are handled by the Bureau of the Fiscal Service and information about submitting a FOIA request is available at the Fiscal Service website . Why we sometimes withhold information under the Freedom of Information Act (FOIA) Deceased individuals' records are protected for the survivors' interest and individuals' records are protected for their own interest, both under FOIA Exemption (b)(6). Exemption (b)(6) permits the government to withhold all information about individuals in "personnel and medical files and similar files" when the disclosure of the information "would constitute a clearly unwarranted invasion of personal privacy." Commonly requested FOIA information Documents previously disclosed under a FOIA request for which we believe there may be additional requests or a broad interest are shown below. Monthly FHA Debenture Reports (file size 40KB, uploaded 02/03/2025) Matured, Unredeemed Debt and Unclaimed Moneys Reports'''
