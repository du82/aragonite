["https://treasurydirect.gov/indiv/help/treasurydirect-help/user-guide/001-010"]
title = "User Guide Sections 001 Through 010 — TreasuryDirect"
full_description = '''TreasuryDirect Help TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide 001 Through 010 011 Through 020 021 Through 030 031 Through 040 041 Through 050 051 Through 060 061 Through 070 071 Through 080 081 Through 090 091 Through 100 101 Through 110 111 Through 120 121 Through 130 131 Through 140 141 Through 150 151 Through 160 161 Through 170 171 Through 180 181 Through 190 191 Through 200 201 Through 210 211 Through 220 221 Through 230 231 Through 240 251 Through 260 261 Through 270 271 Through 280 281 Through 290 291 Through 300 301 Through 310 311 Through 320 471 Through 480 591 Through 600 601 Through 610 How Do I...? Learn More Technical Help TreasuryDirect Help User Guide User Guide Sections 001 Through 010 User Guide Sections 001 Through 010 On this page: User Guide 002User Guide 003User Guide 004User Guide 005User Guide 007User Guide 007AUser Guide 008User Guide 008AUser Guide 009User Guide 010Further Reading User Guide 002 Page Title: Introduction What you can do on this page Take a Guided Tour of TreasuryDirect to see for yourself how simple it is to set up an account and to buy and manage securities online. If you're ready to open an account, review the information you'll need to have on hand to complete the easy, three-step process: Taxpayer Identification Number (TIN) - Social Security Number for an individual or Employer Identification Number for an entity Bank Routing Number and Account Number (the checking or savings account you'd like to use to set up your TreasuryDirect account) E-mail address The introductory page also provides an opportunity to review account "Terms and Conditions", and “Learn more about Security Features and Protecting Your Account.” Clicking either of these links will open an additional browser window. Please use the buttons and links provided on each page when you're managing your Treasury securities. For security reasons, using your browser controls to navigate (including the back, forward, and refresh buttons) will end your session. Need more flexibility to manage your securities portfolio? Linked accounts offer solutions to manage your specific financial needs. Establish and access Minor accounts for your children (in individual accounts only) or Custom accounts for your specific goals. You can convert your paper Series EE and I Bonds to electronic versions and they can be managed in your Conversion Linked account. Holdings for each Linked account are kept separately from your Primary account and can be accessed only through your Primary account. Note: TreasuryDirect does not provide paper savings bonds or paper account statements. If you want a paper copy of your account information, you should use the browser's toolbar to print the relevant pages in your account that show your holdings. Primary Actions Click "Apply Now" to go to the Account Type page. Help Home User Guide 003 Page Title: Individual Account Application What you can do on this page Individuals can open a TreasuryDirect account by completing all of the following sections of the online application: Account Owner Information, Contact Information Bank Information, and Submission sections. Asterisks denote required fields. If you leave the 'Give Your Account a Name' field blank, the account name will be personalized based on your first name as shown in Account Owner Information. You will be able to edit this personalized information at any time using the Account Info tab. In the Bank Information section, we encourage you to abbreviate or condense the Bank Name and Name(s) on the Account. Automated Clearinghouse (ACH) rules limit the amount of space we can provide. In the Submission section you certify: You have provided your correct taxpayer identification number. (This is typically your Social Security Number.) You are NOT subject to backup withholding. You are a U.S. person. (You must be a U.S. citizen, resident, or individual who is at least 18 years old with a valid U.S. Social Security Number. You must also have a U.S. address of record and an account at a U.S. depository financial institution that will accept debits and credits using the Automated Clearing House method of payment.) HELPFUL HINT: After establishing a TreasuryDirect Primary account, you may create Linked accounts - Minor, Custom, and Conversion accounts. Holdings for each Linked account are kept separately and can be accessed only through your Primary account. Primary Actions Click "Submit" to proceed to the Individual Account Application Review. Click "Cancel" to delete your application and return to the Account Type page. Help Home User Guide 004 Page Title: Choose a Password What You Can Do on This Page You can: Create a unique password. Create a password reminder or clue to help you remember the password if you forget it. Answer any three security questions (used to verify your identity when you've lost or forgotten your password or account number or when you attempt to perform certain transactions). When later prompted to answer a security question, your answer must match your previous answer. The special characters !^[ ]|"< > are not valid characters for answering security questions. Here are the guidelines for creating a password and password reminder: Your password must be a minimum of twelve (12) characters without spaces. Your password is NOT case-sensitive. Your password may contain any or all of these elements: letters, numbers, special characters excluding: < \ > - % ‘ / ". You should avoid significant or meaningful numbers, names, or dates. The actual password may not be used as the password reminder. Keep a record of your password and account number in a safe place. For your security, the Bureau of the Public Debt does not maintain any records of customer passwords in any form. Helpful Hints If the information you submitted cannot be verified, we may ask you to complete a convenient, printable authentication form. Please, complete the form according to the instructions and submit it to the address we provide. As an added security measure, TreasuryDirect may require you to answer one of your three Security Questions when you attempt to perform certain transactions. Failure to answer the question correctly will result in a lock on your account, depending upon the number of attempts you make. Primary Actions Click "Submit" to process your password information and proceed to the Customer Info page. Your TreasuryDirect account number will be generated at this time and e-mailed to the address you provided in the application. Click "Cancel" to delete your application and return to the Introduction page. Help Home User Guide 005 Page Title: Additional Security Questions What you can do on this page Security questions are an added step in the screening process to protect our customers. If you've forgotten your account number or password, you'll end up here, answering the three questions you previously selected. Who was your best friend in high school? What was your first pet's name? What was your favorite teacher's name? What was the first car you owned? Who would you most like to meet? What is the location of your dream vacation? Who is your favorite author? What is your favorite movie? What is your mother's maiden name? You were born in what city? Answers must be typed as originally submitted. Failure to complete the appropriate questions correctly may result in a lock on your account, depending upon the number of attempts you make. HELPFUL HINT As an added security measure, TreasuryDirect may require you to answer one of your three Additional Security Questions when you attempt to perform certain transactions. Failure to answer the question correctly will result in a lock on your account, depending upon the number of attempts you make. Primary Actions Click "Submit" and: If you've forgotten your password, you will go to the Change Password page. If you've forgotten your account number, you will proceed to a message screen stating an e-mail has been sent to you containing your account number. Click "Cancel" to discontinue the process and exit TreasuryDirect. Help Home User Guide 007 Page Title: Account Info » Edit » Customer Info What you can do on this page: This page confirms that a hold has been placed on your account as requested. This hold will prohibit access to your account and all transactions will be prohibited. HELPFUL HINT You will receive an e-mail with confirmation of this transaction. Help Home User Guide 007A Page Title: Account Info > Edit > Customer Info What you can do on this page: This page confirms that a hold has been placed on your account as requested. This hold will prohibit access to your account and all transactions will be prohibited. HELPFUL HINT You will receive an e-mail with confirmation of this transaction. Help Home User Guide 008 Page Title: Verification (Accessing Your Account) What you can do on this page When you can't remember your password, even after seeing your reminder, you begin the process of verification and changing your password here. Your TreasuryDirect account number is already filled in, so you're only required to enter your Taxpayer Identification Number. Primary Actions Click "Continue" to proceed to answering the security questions. A valid entry takes you to answer Additional Security Questions. An invalid entry may result in a lock on your account, depending upon the number of attempts you make. Click "Cancel" to discontinue the process and exit TreasuryDirect. Help Home User Guide 008A Page Title: Verification (Accessing Your Account) What you can do on this page: When you can't remember your password, even after seeing your reminder, you begin the process of verification and changing your password here. The TreasuryDirect Account Number is already filled in, so you're only required to enter the Entity Taxpayer Identification Number. Primary Actions Click "Continue" to proceed to answering the security questions. A valid entry takes you to answer Additional Security Questions. An invalid entry may result in a lock on your account, depending upon the number of attempts you make. Click "Cancel" to discontinue the process and exit TreasuryDirect. Help Home User Guide 009 Page Title: Changing Your Password What you can do on this page Having successfully answered the security questions, you can now change your password to access your account. The guidelines for creating a password and password reminder are the same as when you opened your account . Here are the guidelines for creating a password and password reminder: Your password must be a minimum of twelve (12) characters without spaces. Your password is NOT case-sensitive. Your password may contain any or all of these elements: letters, numbers, special characters excluding: < \ > - % ‘ / ". You should avoid significant or meaningful numbers, names, or dates. The actual password may not be used as the password reminder. Primary Actions Click "Submit" to proceed to the Logon page. Click "Cancel" to discontinue the process and exit TreasuryDirect. Help Home User Guide 010 Page Title: Accessing Your Account (Forgot Your Account Number) What you can do on this page Retrieving a lost or forgotten account number requires a rigorous process for verifying a customer's identity. When you click the "Forgot your Account Number?" link from the Account Number page, you are required to indicate whether your account is an Individual account or an Entity account. You must then match previously submitted information held in your TreasuryDirect account. The information is not case sensitive. Note: For an Entity account, enter the Account Manager’s information and the Entity’s bank account information. Primary Actions Click "Continue" to proceed to Additional Security Questions, provided you have successfully matched information in the account. Click "Cancel" to discontinue the process and exit TreasuryDirect. Help Home Further Reading Currently Viewing: User Guide Sections 001 Through 010 (Subpage of: User Guide) Other Pages: TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide How Do I...? Learn More Technical Help'''
