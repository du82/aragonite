["https://treasurydirect.gov/marketable-securities/treasury-bills"]
title = "Treasury Bills — TreasuryDirect"
full_description = '''Treasury Marketable Securities Treasury Bills Treasury Bills We sell Treasury Bills (Bills) for terms ranging from four weeks to 52 weeks. Bills are sold at a discount or at par (face value). When the bill matures, you are paid its face value. You can hold a bill until it matures or sell it before it matures. Note about Cash Management Bills: We also sell Cash Management Bills (CMBs) at various times and for variable terms. Cash Management Bills are only available through a bank, broker, or dealer. We do not sell them in TreasuryDirect. Bills at a Glance Now issued in Electronic form only Matures in 4, 6, 8, 13, 17, 26, and 52 weeks Also, see the note above about Cash Management Bills. Interest rate Fixed at auction. For bills, "interest" is the difference between what you paid and the face value you get when the bill matures. See Results of recent Bill auctions. Also see Understanding pricing and interest rates. Interest paid When the bill matures Minimum purchase $100 In increments of $100 Maximum purchase $10 million (non-competitive bid) 35% of offering amount (competitive bid) (See Buying a Treasury marketable security for information on types of bids.) Auction frequency Every four weeks for 52-week bills Weekly for 4, 6, 8, 13, 17, 26-week bills No regular schedule for Cash Management Bills See the Auction calendar for specific dates. Taxes Federal tax due on interest earned No state or local taxes Eligible for STRIPS? No How do I ... for a bill Buy a Treasury marketable security Find out about tax forms and tax withholding Get my money when my security matures (redeem the security) Reinvest my money in the same type of security Sell my security before it matures Transfer from one system to another Understand pricing and interest rates Related topics: About Treasury Marketable Securities About Auctions Treasury Bonds Treasury Notes TIPS FRNS We're Here to Help We welcome your questions and comments. Write Us If you write to us and want a response, please put your address in your letter (not just on the envelope). Department of the Treasury Bureau of the Fiscal Service Attention: Auctions 3201 Pennsy Drive, Building E Landover, MD 20785 Call Us For general inquiries, please call us at 844-284-2676 (toll free) E-mail Us'''
