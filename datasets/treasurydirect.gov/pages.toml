title = "Sign Up for Fiscal Service Mailing Lists — TreasuryDirect"
full_description = "Sign Up for Fiscal Service Mailing Lists You may subscribe or unsubscribe to Fiscal Service mailing lists on various topics of interest from this page. To start your subscription to a mailing list: Click on 'subscribe' located below the description of the mailing list you are interested in. To cancel your subscription to a mailing list: Click on 'unsubscribe' located below the description of the mailing list you want to cancel. Instructions When subscribing or unsubscribing to the mailing lists below, a new e-mail message window will pop up with the necessary information already filled in. All you need to do is send the e-mail to complete the process. Within 15 minutes, you should receive an e-mail confirmation message from that mailing list. If you believe you did not receive a mailing that you should have, try signing up again to verify that you are on the list. Before continuing, please read our Privacy and Legal Notices. Follow this link for savings bonds news and information mailing lists. If you are having difficulty with the subscribe and unsubscribe links, please check the alternative method of signing up for a mailing list. Government Securities Mailing Lists: Notices related to government securities issuances. Auction Announcement Press Releases Subscribe | Unsubscribe Auction Results Press Releases Subscribe | Unsubscribe Auction Rule (Uniform Offering Circular) Amendments and Interpretations Specifically related to 31 CFR Part 356. Subscribe | Unsubscribe Changes to Auction Data Informing customers about changes to RSS feeds, XML structure, and other potential new data sources such as Web APIs. Subscribe | Unsubscribe Collateral Programs Acceptability and valuation information Treasury's Fiscal Service collateral programs (31 CFR Parts 202, 225, and 203) that require the pledging of collateral to secure deposits of public monies and other financial interests of the Federal Government. Subscribe | Unsubscribe Buyback Operations Subscribe | Unsubscribe CPI Press Releases for TIPS Current index ratios used for valuation of Inflation-Protected Securities. Subscribe | Unsubscribe Government Securities Act Rule Amendments Interpretations and Exemptions Specifically related to 17 CFR Parts 400 through 450. Subscribe | Unsubscribe Notification of Calls for Large Position Reports The large position notification is intended for entities that may potentially have a reportable position of $2 billion or more in a particular Treasury security. Market participants should not rely solely on their inclusion in this mailing list for notice of a call for large position reports but may use it as an additional source of information. Subscribe | Unsubscribe Savings Bond Information Mailing Lists Savings Bond Updates Mailing List: Occasional e-mails with semiannual interest rate changes, product changes, and other essential news for our customers. Subscribe | Unsubscribe Employers: Receive up-to-date information about Savings Bonds and other Treasury securities that you can pass along to your employees. Payroll and HR. Subscribe | Unsubscribe Financial Institutions: Periodic e-mail messages containing matters of interest to Savings Bonds issuing and redemption agents, such as customer service updates, rate changes, newly available software, and technical and/or procedural changes. Information for financial institutions. Subscribe | Unsubscribe Alternative Method for Subscribing/Unsubscribing to Fiscal Service Mailing Lists In the event your e-mail client does not open, or you are using an older browser that does not recognize the links on our Fiscal Service Mailing Lists page, you can subscribe or unsubscribe by e-mail as follows. To subscribe, start a new e-mail message to: join-<listname>@lists.fiscal.treasury.gov. In place of <listname> use the relevant list name below for the list you wish to join. To unsubscribe, start a new e-mail message to: leave-<listname>@lists.fiscal.treasury.gov. In place of <listname> use the relevant list name below for the list you wish to leave. The subject line and body of the message should be empty. See sample e-mail messages at the bottom of this page for subscribing and unsubscribing. Mailing Lists Mailing List Descriptions List Names Auction Announcement Press Releases auction-announcements Auction Results Press Releases auction-results Auction Rule (Uniform Offering Circular) Amendments and Interpretations auction-rule-amendments-and-interpretations Buyback Operations buyback-operations Information about changes to auction data such as RSS feeds or XML structure. changes-to-auction-data Collateral Programs collateral-programs CPI Press Releases for Inflation-Indexed Securities cpi-index-ratios Government Securities Act Rule Amendments, Interpretations and Exemptions gsa-rule-amendments-and-interps Notification of Calls for Large Position Reports calls-for-large-position-reports Savings Bond Updates Mailing List for customers savings-bond-information Information for Financial Institutions financial-institutions Employers payroll-and-hr-admin Sample E-mail Messages Subscribe To: join-auction-announcements@lists.fiscal.treasury.gov From: jdoe@aol.com Subject: Unsubscribe To: leave-auction-announcements@lists.fiscal.treasury.gov From: jdoe@aol.com Subject:"
