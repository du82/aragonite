["https://treasurydirect.gov/auctions"]
title = "About Auctions — TreasuryDirect"
full_description = '''About Auctions We sell U.S. Treasury marketable securities through auctions. In 2024, we held 440 public auctions and issued about $28.5 trillion in Treasury marketable securities. Treasury marketable securities include Bills, Notes, Bonds, Treasury Inflation-Protected Securities (TIPS), and Floating Rate Notes (FRNs). What makes them "marketable" is that you can sell or transfer them before they mature. Treasury Marketable securities differ from U.S. savings bonds in two ways: You buy savings bonds without an auction. You can't sell or transfer a savings bond. I’m looking for… How Auctions Work Upcoming Auctions Recent Results Historical Auction Search Auction Regulations (UOC) How Auctions Work Auctions happen in 4 steps: We announce the auction We hold the auction You bid for the amount you want We issue the securities More about how auctions work Glossary of Treasury Marketable Securities Terms Upcoming Auctions View press releases announcing upcoming auctions. All Announcements Recent Results View today's results, or the most recent 20 auctions. Go to Recent Results Historical Auction Search Search auction results by CUSIP number, date, keywords, and more. Go to Auction Search Financial Institutions: Participate in Auctions with TAAPS TAAPS is an application for the exclusive use of institutions that provides direct access to U.S. Treasury auctions. Read More Auction FAQs How do I find out the results of an auction? Subscribe to get the results electronically through e-mail. View the results on TreasuryDirect.gov. Some newspapers report auction results. Where can I find long-range information on auctions? Usually on the first Wednesday of February, May, August, and November, the U.S. Treasury publishes a tentative auction schedule (PDF). The dates on the schedule can change, but seldom do. In addition to this schedule, we provide a general pattern of when auctions are held; this information is available by type of security and by month. What are Treasury’s auction information handling guidelines? Treasury is providing participants in competitive auctions with guidelines to encourage the establishment of clear information-handling policies, disclosure practices, and internal control programs. Guidelines for Handling Information Related to Treasury Securities Auctions See All Auction FAQs Laws, Regulations and Guidance Authorizing Statutes Auction Information Handling Guidelines Auction Regulations (UOC) Collateral Acceptability & Valuation Regulations Commercial Book-Entry Regulations (TRADES) Government Securities Act Regulations Redemption Operations (Buyback) Regulations See All Laws, Regulations and Guidance'''
