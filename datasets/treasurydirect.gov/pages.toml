title = "Open An Account - Intro"
full_description = "Open An Account » Intro For Account Security: Please use the buttons and links we've provided on each page. Using your browser to navigate (including the back, forward, and refresh buttons) will end your session. Thank you for choosing TreasuryDirect! You may open an account right now by following the 3 easy steps described below, or you may learn more about opening an account by viewing our Guided Tour-Individual Account or Guided Tour-Entity Account. Our secure application process should only take about 10 minutes. Keep in mind, that when establishing a TreasuryDirect account, you will be bound by our terms and conditions. It takes just 3 steps to open a TreasuryDirect Account. Step 1 Choose the type of account you are opening. Step 2 Provide personal information, including: Tax ID Number (SSN or EIN) E-mail Address Bank Account and Routing Number Step 3 Choose the following: Password Password Reminder Personalized Image Caption Security Questions Related Info/Links NO Paper Savings Bonds TreasuryDirect does not provide paper savings bonds; however, we've added detailed instructions on how to buy electronic gift savings bonds in TreasuryDirect. Account Statements If you want a paper copy of your account information, you should use the browser's toolbar to print the relevant pages in your account that show your holdings. Learn more about Security Features and Protecting Your Account."
