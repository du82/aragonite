["https://treasurydirect.gov/auctions/auction-query/auction-query-help"]
title = "How To Use The Auction Query Database — TreasuryDirect"
full_description = '''Auctions Auction Search (query) How To Use The Auction Query Database How To Use The Auction Query Database This page will help you take advantage of the many features of our auction query database. Our database works like many spreadsheet programs. Specifically, you can: ScrollSortFilter by type of securityFilter other dataChoose specific date(s)Show and hide columnsChoose specific page(s) or row(s)Export the data four ways Scroll The scroll bar is on the far right. Sort To sort (or undo): Move the cursor into the label block of the column you want to sort by. An arrow appears and a menu of options opens. Choose: Sort ascending, Sort descending, or Remove sort. The spreadsheet changes based on your choice. Filter by type of security If you’re interested in a specific type of security (Bills, Bonds, Notes, TIPS, or FRNs), you can filter the database to show information just for that type of security. Note: Floating Rate Notes (FRNs) are listed with Notes. Treasury Inflation-Protected Securities (TIPS) are with Bonds. First, filter for Notes or Bonds and then go to the steps below to get only FRNs or only TIPS. To filter by type of security: In the column for Security Type, click the arrow next to Select Filter. A menu appears to choose which security or securities to see. Check the type(s) you want and press Enter. The spreadsheet changes based on your choice. To include TIPS and FRNs: First, filter by security type (Notes for FRNs, Bonds for TIPS). Then, go to the end of the table to find the filter for Show/Hide Columns. Scroll the list under Show/Hide Columns to filter for the specific type you want to see. The spreadsheet changes based on your choice. Filter other data For columns that do not have the arrow and menu, type in part or all of the content you want to see (for example, a specific CUSIP number, a specific term). To undo filtering, go to the bottom of the table and click "Remove Filter." Choose specific date(s) The date columns include a calendar icon. You must use the calendar icon to select a date or date range. You can choose to see: days in a month months in a year years in a decade The default is days in the current month. To move the calendar from month to month, use the left and right arrows. To change to months in the current year, click once on the month in the blue bar at the top of the calendar. You may choose a specific month in that year or use the arrows to move a year at a time. To change to years in a decade, click on the date at the top of the calendar. You may choose a specific year in that decade or use the arrows to move the calendar a decade at a time. To return from the decade view to the year view, click on any year. To return from the year view to any month, click on the month. To select a specific date or date range: Single date: Double click on the date. Date range: Single click on the first date of the range, then single click on the last date of the range. (If the last date of the range is in a different month, use the previous instructions to move to the month you want.) The calendar closes and the date or date range you choose appears in the box. To remove a selected date or date range: To return to today's date, at the bottom of the calendar, click Today. To clear the filter, at the bottom of the calendar, click Clear. Show and hide columns The database includes many data options not in the default setup. To select other data items to view: Go to the end of the table and find the Show / Hide Columns button Click on the button to open a list of data items you may choose. Check items you want to see in the spreadsheet. Uncheck items to remove them from what you see in the spreadsheet. Note: You may also select all the columns or unselect all the columns.If the spreadsheet has more columns than fit on your screen, a horizontal scroll bar appears at the bottom of the table. To close the list, click the Show / Hide Column button again. Choose specific page(s) or row(s) At the bottom right of the table, you may also do these tasks: View a specific page by typing a page number and press Enter. Choose the number of rows to see by clicking on the arrow. Move forward and backward among the pages by clicking the right or left arrows. Export the data four ways You may export the data to these file formats that you see above the table: CSV - Comma Separated Values JSON - JavaScript Object Notation TSV - Tab Separated Values XML - Extensible Markup Language Clicking on the ? shows the full name. To export the data: Select the format to use. A File Download box appears. Choose to open or save. You may use Save As to indicate where to put the file.'''
year_published = 2025
clearnet = "https://treasurydirect.gov/auctions/auction-query/auction-query-help"
