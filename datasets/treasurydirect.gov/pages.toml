["https://treasurydirect.gov/government/treasury-managed-accounts"]
title = "Treasury Managed Accounts — TreasuryDirect"
full_description = "Treasury Managed Accounts Treasury Managed Accounts Report of receivables from contract disputes Report of receivables from the No FEAR Act Report of unclaimed money Government Users Treasury Managed Accounts Treasury Managed Accounts Treasury manages many financial accounts for federal government agencies. There are 77 Treasury Managed Accounts. These accounts are specific in purpose and consist of deposit funds, receipt accounts, and appropriated accounts. These three accounts are relevant to this section of the website. On the linked pages, you can see which situation each web page explains as well as the amounts in the relevant accounts for each agency. Each agency is responsible for reviewing the reports on the three linked pages every quarter and confirming to us (the Bureau of the Fiscal Service) that the information in our reports is accurate. Each web page also tells your agency how to reimburse the appropriate Treasury account. Report of receivables from contract disputes Report of receivables from the No FEAR Act Report of unclaimed money Fiscal Service has no data on unclaimed moneys owed to individuals. Information on this page is aggregate data supplied to Fiscal Service from government agencies and is posted here so government agencies can review this information. For more information on unclaimed moneys see our Frequently Asked Questions. Related Topics Gifts to the U.S. Government Contact If you have any questions about the information on this page, please contact us: Reporting and Analysis Branch 2 tmas@fiscal.treasury.gov"
