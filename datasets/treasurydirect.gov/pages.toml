["https://treasurydirect.gov/government"]
title = "For Government Users — TreasuryDirect"
full_description = "For Government Users In addition to the sale of Treasury marketable securities or savings bonds to the public, TreasuryDirect also offers investing opportunities to federal, state, or local U.S. government agencies that meet certain legal requirements. Federal Investments Program Federal agencies that have the necessary legal authority, proper documentation, and available funds can purchase Government Account Series (GAS) securities using FedInvest. The Federal Investments Program accounts for almost one-quarter of the public debt, providing services to about 240 trust, deposit, and special funds. Go to the Federal Investments Program Log Into FedInvest Issuers of state and local government tax-exempt debt can purchase securities that comply with the Internal Revenue Code. Several varieties of State/Local Government Securities (SLGS) can be managed using SLGSafe, an online portfolio application. Log Into SLGSafe Learn More Resources & Reports for Government Security Liquidation & Proceeds Security Liquidation is a process in which the Bureau of the Fiscal Service can convert securities (obligations) that have been received by Federal Executive Agencies into cash. Go to Security Liquidation & Proceeds Federal Borrowings Program The purpose of the Federal Borrowings Program is to facilitate loans to federal agencies on behalf of the Department of the Treasury (Treasury). Certain authorized Federal agencies may borrow funds from Treasury. The proceeds are used to support programs such as education, housing, flood relief, agriculture, and small businesses. Go to Federal Borrowings Program Treasury Managed Accounts There are 77 Treasury Managed Accounts. These accounts are specific in purpose and consist of deposit funds, receipt accounts, and appropriated accounts. Reports are available on Contract Disputes, No FEAR Act, and Unclaimed Moneys. Go to Treasury Managed Accounts Funds Management Program Reports The Bureau of the Fiscal Service's Funds Management Branch (FMB) provides investment and limited accounting services to Treasury-managed Trust Funds and Treasury-program Trust Funds. Go to Funds Management Program Reports Historical Debt Outstanding The Bureau of the Fiscal Service’s Summary Debt Accounting Branch accounts for and reports on the public debt. Read the fascinating story of the debt over the years. Go to Historical Debt Outstanding Public Debt Reports View various reports on the current status of the public debt. Go to Public Debt Reports Government Losses in Shipment Fund The Government Losses in Shipment Fund (GLSF) is a revolving fund in the Treasury used for the replacement value of items lost, destroyed, or damaged while being shipped in accordance with regulations. Read more Interest Rates and Prices Looking for current or past interest rates on a federal investment or security? Here you can find the information you need through a variety of applications and reports. Go to Interest Rates and Prices The Debt Subject to Limit is the maximum amount of money the Government is allowed to borrow without receiving additional authority from Congress. *The statutory debt limit has been suspended until January 2025. Go to Debt Subject to Limit Subscribe to News about Government Securities Subscribe Contacts for Government Customers Federal Investments Program 304-480-5151 Federal Borrowings Program 304-480-7488 SLGS and SLGSafe 304-480-5299 FHA Debentures 304-480-5299 Mortgage Guaranty Insurance Company Tax and Loss Bonds 304-480-5299"
