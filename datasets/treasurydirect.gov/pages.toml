["https://treasurydirect.gov/about"]
title = "About — TreasuryDirect"
full_description = "About TreasuryDirect.gov TreasuryDirect.gov is the one and only place to buy and redeem U.S. savings bonds and other securities directly from the U.S. Treasury! Your investments are backed by the full faith and credit of the United States government. What’s on this site? TreasuryDirect.gov is divided into two parts: Informational Website At TreasuryDirect.gov, you can learn about U.S. Savings Bonds, and Treasury marketable securities like Treasury Bills, Bonds, Notes, and more. This site also contains a robust Research Center. It's not just individuals buying bonds — financial institutions, government agencies, and even other countries purchase billions of dollars’ worth of U.S. securities every year. Buying and Redeeming When you're ready to buy or redeem your first savings bond or other security, you'll need to create a TreasuryDirect account. The process is similar to opening up a checking or savings account. Once your account is open, and after you log in with your account number and password, then you can buy, redeem, and manage your investments. Who is this site for? Individuals Anyone can use this site to learn about savings bonds and other investments available for purchase. To make a purchase and manage them, open a TreasuryDirect account. TreasuryDirect accounts offer Series I and EE Savings Bonds, Treasury Bills, Notes, Bonds, Inflation-Protected Securities (TIPS), and Floating Rate Notes, all in electronic form, and all in one convenient account. Financial Institutions Banks and other financial institutions help the general public cash in their old paper savings bonds. Investment houses and financial professionals use the TreasuryDirect.gov website to get information about Treasury marketable securities and the auction process, auction announcements, and auctions results. Institutional investors use the TAAPS program to buy Treasury marketable securities and manage large investments on behalf of their clients, company, or institutions. Government Investors FedInvest (the Federal Investments Program) provides investment services to about 250 Trust, Deposit and Special Funds. These investments represent more than 1/3 of the public debt outstanding. With the SLGS program, securities are offered for sale to issuers of state and local government tax-exempt debt. Watch our video about the TreasuryDirect.gov website"
year_published = 2025
