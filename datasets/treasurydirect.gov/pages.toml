["https://treasurydirect.gov/indiv/help/treasurydirect-help/user-guide/601-610"]
title = "User Guide Sections 601 Through 610 — TreasuryDirect"
full_description = '''TreasuryDirect Help TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide 001 Through 010 011 Through 020 021 Through 030 031 Through 040 041 Through 050 051 Through 060 061 Through 070 071 Through 080 081 Through 090 091 Through 100 101 Through 110 111 Through 120 121 Through 130 131 Through 140 141 Through 150 151 Through 160 161 Through 170 171 Through 180 181 Through 190 191 Through 200 201 Through 210 211 Through 220 221 Through 230 231 Through 240 251 Through 260 261 Through 270 271 Through 280 281 Through 290 291 Through 300 301 Through 310 311 Through 320 471 Through 480 591 Through 600 601 Through 610 How Do I...? Learn More Technical Help TreasuryDirect Help User Guide User Guide Sections 601 Through 610 User Guide Sections 601 Through 610 On this page: User Guide 601User Guide 602User Guide 607User Guide 608Further Reading User Guide 601 Page Title: Password What you can do on this page To log on, enter your password, then click the "Submit" button. (Your Password is case sensitive.) If you have previously chosen a personalized image/caption, it will appear on the Password page. Your personalized image/caption helps you to know that you are on the authentic TreasuryDirect website. Also, you're given other options, depending on your needs and circumstances: If you can't remember your Password, click the Forgot your Password? link. If your personalized image/caption is incorrect, click the Incorrect Personalized Image? link. Primary Actions Click "Submit" to go to the Welcome page inside your account. Depending on your circumstances, you may first be asked to verify your e-mail address, choose a personalized image/caption, and/or see a C of I purchase disclosure page. Click "Cancel" to return to the Account Number page. Help Home User Guide 602 Page Title: One Time Passcode (OTP) What you can do on this page When this page is displayed, a One Time Passcode (OTP) is required in order for you to log into your account. The OTP provides an additional form of authentication. When the ATTENTION message is displayed at the top of the page, your NEW OTP will have been sent to your e-mail account. Go to your e-mail account and find your NEW OTP and enter it into the Enter your OTP: box. (The OTP is case sensitive and is good for 24 hours, or until it is successfully submitted on the OTP page.) Click the "Submit" button, and the next screen will be the Password page. If you close your browser and you return before the OTP expires (24 hours), the REMINDER message is displayed at the top of the page informing you that we previously sent an OTP to your e-mail account. Go to your e-mail account for your OTP, and enter it into the Enter your OTP: box. If you need to request another e-mail containing the OTP, click on the we will resend the OTP link. When the NOTICE message is displayed at the top of the page, your OTP will have been resent to your e-mail account. Go to your e-mail account for your OTP, and enter it into the Enter your OTP: box. Watch our TreasuryDirect demo on how to login to your account. Primary Actions Click "Submit" to go to the Password page to continue the log in process. Click "Cancel" to return to the Account Number page. Help Home User Guide 607 Page Title: Open an Account > Personalized Image / Caption What you can do on this page As part of the process of keeping your account secure, you will be asked to choose a personalized image and create a caption when you open a TreasuryDirect account. Your personalized image/caption helps you to know that you are on the authentic TreasuryDirect website. To choose a personalized image and create a caption: Click the radio button that corresponds with the personalized image you want. (Click the Show me more images link to see more randomly displayed images.) Enter a caption (3 - 30 alphanumeric characters - no special characters). Primary Actions Click "Submit" to go to the Choose a Password page. Help Home User Guide 608 Learn More About Funding Options We offer three ways for you to pay for securities you buy in TreasuryDirect. Bank Account You can pay using either your checking or savings account at a bank. When you apply for an account in TreasuryDirect, you give us information about one of your bank accounts. When you buy a security in TreasuryDirect, you can choose that bank account as the source of funds. Zero-Percent Certificate of Indebtedness The Zero-Percent Certificate of Indebtedness (Zero-Percent C of I or, simply, C of I) is a Treasury security that doesn't earn interest. It is intended to be used as a source of funds for purchasing Treasury securities. Payroll Zero-Percent Certificate of Indebtedness The Payroll Zero-Percent Certificate of Indebtedness (Payroll C of I) is a Treasury security that doesn't earn interest, and it will be discontinued on January 31, 2025. It was previously intended to be used as a source of funds for purchasing Series EE and Series I savings bonds through the Payroll Savings Plan. Help Home Further Reading Currently Viewing: User Guide Sections 601 Through 610 (Subpage of: User Guide) Other Pages: TreasuryDirect Help TreasuryDirect FAQ TreasuryDirect Glossary User Guide How Do I...? Learn More Technical Help'''
