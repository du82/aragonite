["https://treasurydirect.gov/marketable-securities/floating-rate-notes"]
title = "Floating Rate Notes — TreasuryDirect"
full_description = '''Treasury Marketable Securities Floating Rate Notes Floating Rate Notes (FRNs) Floating Rate Notes (FRNs) are relatively short-term investments that: mature in two years pay interest four times each year have an interest rate that may change or "float" over time You can hold an FRN until it matures or sell it before it matures. FRNs at a Glance Issued in Electronic form only Matures in Two years Interest rate The rate varies. See How we calculate the floating interest rate further down this page. Interest paid Every three months until maturity Minimum purchase $100 In increments of $100 Max. purchase amount $10 million (non-competitive bid) 35% of offering amount (competitive bid) (See Buying a Treasury marketable security for information on types of bids.) Auction dates Original issue: Jan., April, July, Oct. Reopenings: All other months See the Auction Calendar for specific dates. Taxes Federal tax due each year on interest earned. No state or local taxes Eligible for STRIPS? No Latest Rates 2-Year FRN document.addEventListener('DOMContentLoaded', function () { var hostLocation = 'https://www.treasurydirect.gov'; if (!window.location.origin) { window.location.origin = window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port: ''); } if (window.location.origin === 'https://acc.treasurydirect.gov'){ hostLocation = 'https://acc.treasurydirect.gov'; } function dateConverter(rawDate) { return rawDate.substr(5, 2) + '\/' + rawDate.substr(8, 2) + '\/' + rawDate.substr(0, 4); } function decimalConverter(rawNumber, decimalSpaces) { if (rawNumber === "") { return rawNumber; } else { return parseFloat(rawNumber).toFixed(decimalSpaces); } } let securityElm = document.getElementById('2-Year'); $.getJSON(`${hostLocation}/TA_WS/securities/auctioned?format=jsonp&limitByTerm=true&type=FRN&days=720&&callback=?`, function (data) { let securityData = 'FRN' === 'FRN' ? data : data.filter(item => item.term.includes('2-Year')); let percentageType; if ('FRN' === 'Bill') { percentageType = decimalConverter(securityData[0].highInvestmentRate, 3) } else if ('FRN' === 'FRN') { percentageType = decimalConverter(securityData[0].spread, 3) } else if (decimalConverter(securityData[0].interestRate, 3) !== null) { percentageType = decimalConverter(securityData[0].interestRate, 3) } else { let securityType = 'FRN'; securityElm.innerHTML = ` <div class="rate">No scheduled ${securityType} offerings.</div> `; } if (percentageType !== null) { securityElm.innerHTML = ` <div class="rate">${percentageType}%</div> <p>Issued ${dateConverter(securityData[0].issueDate)}. Price per $100: ${securityData[0].pricePer100}. CUSIP ${securityData[0].cusip}.</p> `; } }); }); See All Rates How we calculate the floating interest rate The interest rate of an FRN is the sum of two components: an index rate and a spread. Index rate. This rate is tied to the highest accepted discount rate of the most recent 13-week Treasury bill. We auction the 13-week Treasury bill every week, so the index rate of an FRN is reset every week. Spread. The spread is a rate we apply to the index rate. The spread stays the same for the life of an FRN. The spread is determined at the auction when the FRN is first offered. The spread is the highest accepted discount margin in that auction. The index rate plus the spread equals the interest rate. We apply the interest rate to an FRN's par value every day. Thus, the FRN accumulates interest earned every day. You can see the index rates and spread for current FRNs. Also, see "How to use the FRN daily indexes database". How do I ... for an FRN Buy a Treasury marketable security Find out about tax forms and tax withholding Get my money when my security matures (redeem the security) Reinvest my money in the same type of security Sell my security before it matures Transfer from one system to another Understand pricing and interest rates Related topics: About Treasury Marketable Securities About Auctions Treasury Bills Treasury Bonds Treasury Notes TIPS We're Here to Help We welcome your questions and comments. Write Us If you write to us and want a response, please put your address in your letter (not just on the envelope). Department of the Treasury Bureau of the Fiscal Service Attention: Auctions 3201 Pennsy Drive, Building E Landover, MD 20785 Call Us For general inquiries, please call us at 844-284-2676 (toll free) E-mail Us'''
year_published = 2025
