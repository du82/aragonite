["https://treasurydirect.gov/government/security-liquidation-proceeds"]
title = "Security Liquidation & Proceeds — TreasuryDirect"
full_description = "Security Liquidation & Proceeds Program Overview Redelegation Authorities Internal Revenue Service Levy Bankruptcy, Settlement or Other Litigation Donations to a Federal Executive Agency Address Information Proceeds from the Sale of a Security Glossary for Security Liquidation Government Users Security Liquidation & Proceeds Security Liquidation & Proceeds Note: This page does not apply to savings bonds, TreasuryDirect accounts, or Legacy Treasury Direct accounts. For information or questions related to these subjects, please select “Contact Us” at the top of this page. Security Liquidation is a process in which the Bureau of the Fiscal Service can convert securities (obligations) that have been received by Federal Executive Agencies into cash. The Department of the Treasury delegated this program to the Bureau of the Fiscal Service. Through this redelegation authority, the Security Liquidation process is accomplished by the Fiscal Service in the Special Assets and Liabilities Division (SALD). The securities include: Bonds, notes, or other securities acquired by the Secretary of the Treasury for the United States Government Securities delivered to the Secretary by a Federal Executive Agency Securities received by an agency for any of the following reasons may be liquidated by Special Assets and Liabilities Division: Internal Revenue Service (IRS) levy Bankruptcy, Settlement, or Other Litigation Donations to a Federal Executive Agency Delivery Please contact the Bureau of the Fiscal Service to receive instructions on where to mail physical securities or wire electronic securities. Physical securities will need to be sent by registered mail or special messenger. Payment View the proceeds process and methods of payment. Return Securities If SALD is unable to liquidate the security after a reasonable amount of time, it will be returned along with an explanation to the Federal Executive Agency."
