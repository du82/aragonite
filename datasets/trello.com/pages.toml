title = "Scan2Cad + Trello: Customer Case Study | Trello"
description = "Learn how Scan2Cad used Trello to help 90,000+ customers bring design dreams to life—all with a team of less than 25."
full_description = "Scan2Cad + TrelloConverting Customer Files And Company WorkflowsHow Scan2CAD uses Trello to grow with simplicity, flexibility, and visibilityFor most companies, growth leads to more staff, more processes, more complexity, and more headaches. But Scan2CAD, the world's leading conversion software for architectural and engineering designs, is defying this trend with the help of Trello.Scan2CAD is committed to scaling while simplifying. While other orgs might have impulsively added staff and square footage as their customer base grew to 90,000+, Scan2CAD’s team remains small (fewer than 25 people, including contractors!) and distributed. While other firms might rush to introduce new products and markets, Scan2CAD is keeping laser focused on one product for two core audiences.And while others may pile on more systems and tools, Scan2CAD is doubling down on Trello, using it in creative ways to meet all of their project administration, sales, and product management needs.Bridging The Gap Between Physical And DigitalScan2CAD helps architects and engineers bring their projects and products to life. Their software makes it easy to convert scanned blueprints and images in traditional file types to CAD- (computer-assisted drawing) and CAM-friendly (computer-assisted manufacturing) files for editing and documentation purposes. This smart technology and its underlying mission were front of mind for CEO Luke Kennedy when he acquired the company in 2010.Luke was new to the role of owner, but hardly new to the company. His father had founded Scan2CAD over 20 years earlier. The firm was acquired after he retired, but when that acquirer wanted to take the firm in a different direction years later, Luke jumped at the chance to acquire it back and continue his father’s legacy.As soon as Luke assumed the role of CEO, he saw opportunities to simplify, increase productivity, and improve visibility. “We know our customers use us for one thing – converting files – so I wanted to make it as simple as possible for them to do that one thing,” he explains. “Then I started thinking, ‘How can we simplify our business too?’”In the spirit of streamlining, Luke set out to find a single flexible system that would keep his team organized in the present and grow with them in the future. So he opened his trusty personal Trello board and introduced its magic to his Scan2CAD colleagues.One Tool, Endless UsesIf it weren’t for Trello, we’d probably rely on 10 separate apps...We’ve saved hours of time and pain, plus a lot of money.As Luke coordinated with each team, he shared ideas for ways they could use Trello to manage everything from simple to-do lists to complex workflows. Over time, employees took those ideas and ran with them. Eventually, the entire company adopted Trello for all their critical processes (including sales and hiring, content ideation and creation, software development, and bug tracking) and consolidated several tools into one. “If it weren’t for Trello, we’d probably rely on 10 separate apps,” Luke says. “By only using one, we’ve saved hours of time and pain, plus a lot of money.”For example, Scan2CAD’s content team uses Trello to brainstorm ideas for help articles and customer resources. They create a new card for each topic or deliverable, then organize the cards by month and assign authors. The author moves their cards from Draft to Editing to Launch as they work through the process. Editors also rely on Trello’s Card Repeater Power-Up and Checklist feature to make sure no editing tasks slip through the cracks.Scan2CAD’s sales team uses Trello in a similar way. Whenever action is required for a new lead or existing customer, the sales rep creates a card on the “Deals” Trello board to ensure follow-through.Scan2CAD’s developers have adapted Trello to their needs too, rather than adding another tool into the mix. Although they use scripts for automated testing, deployment still requires a lot of manual input. To reduce mental load and ensure every task is completed, the development team creates Trello cards for every release, then uses the Checklist feature to auto-populate checklists for deployment and launch.Developers also rely on Trello to track and resolve bugs. They create cards for each bug, assign specific users to work on it (which also reduces noise for the rest of the team), and communicate about the issue through card comments. Luke reports that this workflow has been so helpful for the team, their success now depends on it. “We wouldn’t make a release without it,” he proclaims. “And because we only assign people to cards they need to know about, they can stay focused and know exactly what they’re responsible for. There’s a balance between transparency and [not] overwhelming people.”A Simple, Flexible System That Brings Data And Dreams AliveTrello is our one ‘source of truth.’From very linear processes (such as content creation) to those that are more iterative (like bug tracking), Scan2CAD has found Trello is flexible enough to fit all of their critical workflows.The company has also improved visibility and collaboration across their worldwide, fully remote team with the help of Trello. Luke explains, “It’s our ‘one source of truth.’ Anyone on the team, including new employees who are onboarding, can look in Trello and have access to everything they need.”Luke credits Scan2CAD’s wide adoption of and success with Trello to its intuitive design and flexibility. No matter how tech savvy someone is, they can learn to use it quickly without training and adapt boards to their specific needs. He says, “Trello is as flexible as a spreadsheet, but more powerful. It can be used as a bulleted list in its simplest form, or as a complete app that’s integrated with other systems to drive entire parts of your business.”As Scan2CAD has expanded Trello from a single personal board to a company-wide system, Luke and his team have come to rely on it to bring their ideas to life. “Trello has become a file type for us. It’s not really comparable to other apps,” Luke says. “We use Trello because our data becomes alive. A bullet point list turns into real tasks that are assigned to real people with due dates and connections to our other apps. The power in that is fantastic.”Join over 2,000,000 teams worldwide who are using Trello to get more done.NOW AVAILABLEA 14 Day Free Trial of Premium!Get unlimited boards, Trello views, and limitless automation, plus a ton more.Try it todayTrello customer case studies"
year_published = 2025
clearnet = "https://trello.com/customers/scan2cad"
