title = "Which Trello Plan Is Best for You? Our Pricing Guide Can Help | Trello"
description = "Built for teams of any size - even one - Trello has something for everyone. Find out which pricing plan is best for your team with our feature breakdown."
full_description = "Trello your way.Trusted by millions, Trello powers teams all around the world.Explore which option is right for you.Free$0USDFree for up to 10 collaborators per WorkspaceCapture your to-dos, get organized, and get sh*t done.See what's includedIncluded in Free:Unlimited cardsUp to 10 boards per WorkspaceQuick capture Inbox Unlimited Power-Ups per boardUnlimited storage (10MB/file)250 Workspace command runs per monthCustom backgrounds & stickersUnlimited activity logAssignee and due datesiOS and Android mobile apps2-factor authenticationStandard$5USDPer user/month if billed annually ($6 billed monthly)Get more stuff done with unlimited boards, card mirroring, and more automation.See what's includedEverything in Free, plus:Unlimited boardsPlanner Advanced checklistsCard mirroringCustom FieldsUnlimited storage (250MB/file)1,000 Workspace command runs per monthSingle board guestsSaved searchesLearn more about StandardPremium$10USDPer user/month if billed annually ($12.50 billed monthly)Add AI to your boards and admin controls to your toolkit. Plus, get more perspective with views.See what's includedEverything in Standard, plus:Atlassian Intelligence (AI)Views: Calendar, Timeline, Table, Dashboard, and MapWorkspace views: Table and CalendarUnlimited Workspace command runsAdmin and security featuresWorkspace-level templatesCollectionsObserversSimple data exportLearn more about PremiumEnterprise$17.50USDPer user/month - billed annually ($210.00 annual price per user)Add enterprise-grade security and controls. This plan includes Atlassian Guard Standard and 24/7 Enterprise Admin support.Est. cost forusersSee what's includedEverything in Premium, plus:Unlimited WorkspacesOrganization-wide permissionsOrganization-visible boardsPublic board managementMulti-board guestsAttachment permissionsPower-Up administrationFree SSO and user provisioning with Atlassian GuardLearn more about EnterpriseCompare our plansFeaturesFreeStandardPremiumEnterpriseUnlimited cardsTrueTrueTrueTrueQuick captureComing SoonCapture to-dos, notes, and messages, from email and Slack instantly.TrueTrueTrueTrueInboxComing SoonGather messages and to-dos in this personal space before organizing them into your boards.TrueTrueTrueTruePlanner (view-only)Coming SoonView your scheduled cards on a calendar and synchronize events from your favorite tools.TrueTrueTrueTruePlanner (full access)Coming SoonDrag and drop cards on a calendar to block any available time. Sync with more events in your favorite tools.FalseTrueTrueTrueCard mirroringView your cards from different boards with access to all information.FalseTrueTrueTrueBuilt-in automationPowerful no-code automation is built into every Trello board.Start automatingTrueTrueTrueTrueAssignee and due datesTrueTrueTrueTrueiOS and Android mobile appsDownload mobile appsTrueTrueTrueTrueDesktop appDownload desktop appTrueTrueTrueTrueUnlimited activity logsTrueTrueTrueTrueTrello templatesGive your team a blueprint for success with tried-and-true templates from the Trello community.Try a templateTrueTrueTrueTrue2-factor authenticationTrueTrueTrueTrueMobile device managementEnforce security controls on mobile app usage through built-in mobile device management (MDM) support for iOS and Android.TrueTrueTrueTrueUnlimited power-upsIntegrate with more than 200+ apps and tools your team depends on like Slack, Google Drive, Salesforce, and more directly into your Trello boards. (Note: Some Power-Ups by our partners require an additional subscription fee.)Learn moreTrueTrueTrueTrueUnlimited Workspace collaboratorsUp to 10 collaboratorsTrueTrueTrueUnlimited boardsCreate as many Trello boards as your team sees fit; from onboarding new hires, to sprint planning, and every team meeting agenda in between.FalseTrueTrueTrueAdvanced checklistsBreak down projects into byte-sized tasks and get granular by assigning members and due dates to individual tasks. FalseTrueTrueTrueCustom fieldsBring process and formality to your workflow by structuring information on Trello cards to the task at hand with Custom Fields. FalseTrueTrueTrueAtlassian Intelligence (AI)Enhance Trello card descriptions and comments effortlessly with AI-driven content generation, grammar correction, and brainstorming. Learn moreFalseFalseTrueTrueDashboard viewTrello’s reporting tool lets you access real-time insights and communicate your team’s progress in a visual and meaningful way.Learn moreFalseFalseTrueTrueMap viewPlan an offsite, scout new office locations, or manage product distribution points by adding locations to your cards and visualizing them geographically on a map.Learn moreFalseFalseTrueTrueTimeline viewPlan your project, stay on top of every sprint, and see how all of the moving parts fit together over time with Timeline.Learn moreFalseFalseTrueTrueTable ViewBring a clearer perspective to all the work happening across a single board in a list format where you can create and edit cards in just a few clicks.Learn moreFalseFalseTrueTrueCalendar viewCalendar displays start dates, due dates, and advanced checklist items so you can see what lies ahead for your project and stay on top of today’s to-dos.Learn moreFalseFalseTrueTrueWorkspace table viewSee your projects and tasks across Workspaces and boards in a spreadsheet-style list that can be sorted and filtered to drill down to exactly the cards you need to see.Learn moreFalseFalseTrueTrueWorkspace calendar viewWorkspace calendar displays items with start dates and due dates across your projects and boards, so you can see what lies ahead for all your teamwork.Learn moreFalseFalseTrueTrueWorkspace-level templatesFalseFalseTrueTrueCommand run administrationPremium or Enterprise administrators can disable commands on behalf of other users, and perform other command maintenance.FalseFalseTrueTrueBoard collectionsPremium and Enterprise teams can use Board Collections to easily group boards together whether by Workspace, department, or major project.FalseFalseTrueTrueObserversObservers are a Premium security setting that limit a user’s actions within a board.FalseFalseTrueTrueDomain-restricted invitesFalseFalseTrueTrueDeactivate membersFalseFalseTrueTrueSimple data exportFalseFalseTrueTrueUnlimited command runsFalseFalseTrueTrueSAML SSO via Atlassian GuardAtlassian Guard is a separate subscription that your company can enable across all your Atlassian products and starts at $4/month/user.Learn moreAvailableAvailableAvailableTrueUnlimited workspacesFalseFalseFalseTruePower-up administrationFalseFalseFalseTrueAttachment restrictionsFalseFalseFalseTrueOrganization wide permissionsFalseFalseFalseTrueOrganization visible boardsFalseFalseFalseTruePublic board managementFalseFalseFalseTrueSupportLearn moreCommunity SupportLocal Business Hours24/5 Premium Support24/7 Enterprise Admin SupportDidn’t find what you were looking for?Make a suggestionFrequently asked questions +Does Trello offer a Premium free trial?We sure do. All users can enroll their Workspace in a free trial of Trello Premium. With that trial your Workspace will get access to create unlimited Trello boards, automate as much as you’d like, take advantage of Timeline, Dashboard, and other new views, and much more!+Do you offer any discounted plans?Yes! Trello offers both a non-profit community discount as well as an education discount.+What payment methods do you accept?You can purchase a monthly or annual Trello Standard or Premium subscription with any major credit card. We offer more options for Enterprise customers, if you’re interested in learning more about Trello Enterprise contact our sales team.+How do I cancel my Trello Standard or Premium subscription?If you aren’t 100% satisfied with Trello Standard or Premium you may downgrade at any time. When a team downgrades from Standard or Premium, it retains its Standard or Premium features and unlimited boards until the end of its prepaid service period. At the end of its prepaid service period, it becomes a free Trello Workspace that can hold 10 boards. Learn more about canceling your Standard or Premium subscription here.+How are users counted towards billing?A Trello user who is added as a member to a Workspace—either as a normal member or as a team admin—is considered a billable team member that is included in the cost of Trello Standard or Premium.Any Guest that is on more than one board within the Workspace is considered a Multi-Board Guest and is billed at the same rate as Standard or Premium Workspace members. See this page for more information on Multi-Board Guests.+Is there an on-premises version of Trello?Trello is proudly a cloud-only product. We offer access via the web, desktop, and our awesome mobile apps.+Can I have Trello Standard or Premium just for my own account?Trello Standard and Premium are designed for all teams—even teams of one! To upgrade to Standard or Premium you’ll need to create a Workspace and then upgrade that Workspace.+How secure is Trello?Trello, Inc. (“we”, “us” or “our”) is SOC2 Type 2 certified—we receive and review our data hosting providers’ SOC1 and SOC2 reports every 6 months under NDA. Trello is ISO/IEC 27001 certified which validates our information security management system (ISMS) and the implementation of our security controls. More information is available on the Atlassian Trust Management System. Trello is PCI-DSS certified. Learn more about Trello’s security protocols here.Best-in-class security and centralized administration with Atlassian GuardSAML single sign-onEnforced 2FAAtlassian Guard is a separate subscription that your company can enable across all your Atlassian products and starts at $4/month/user. Trello is an Atlassian product.Learn more"
