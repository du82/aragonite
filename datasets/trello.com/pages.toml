["https://trello.com/customers/palace-law"]
title = "Palace Law + Trello: Customer Case Study | Trello"
description = "Learn how Palace Law uses Trello to better serve more clients, reduce stress for its attorneys, and save more than 200 pieces of paper a day."
full_description = "Palace Law + TrelloThriving With Less Paper, More Revenue, And Happier ClientsGoing paperless in the law profession can be intimidating, but it became a mission-mandate for Palace Law when the firm realized replacing its traditional operations and processes with an all-digital system would be beneficial to its clients, staff, and the environment. With the help of Trello, Palace Law is able to better serve more clients, reduce stress for its attorneys, and save more than 200 pieces of paper a day.When you picture a lawyer at work, what comes to mind?Traditionally, they might represent a stuffy suit-and-tie professional culture, long days at the office, and lots of file folders and paperwork.The legal profession, as it was designed and has existed for decades, was built on a paper-based system.According to Jordan Couch, an attorney at Palace Law, it was also built with an emphasis on the people practicing the profession, rather than those being served by it. “It’s an industry that—in some ways—counters the best interests of the client,” Jordan says. “Consider the billable hour model. The client’s success is your hindrance, because the faster and more efficient you work, the less you make. That’s problematic for the client.”In law school, Jordan was inspired by his professors to consider new and different ways to practice law. When he graduated, he sought out a like-minded firm. His search led him to Patrick Palace, founder of Palace Law. Both believed the profession needed to better serve clients without charging more. “We wanted to deliver better service to more people, more efficiently,” Jordan says. “That aspiration was the basis for all the changes we’ve made and continue to make today.”Palace Law decided the way to achieve its goal of better serving clients was to create and implement a digital system replacing the paper-based structure at the heart of many legal professionals’ workdaysStarting The Digital Journey'Being able to visualize a workflow is really important for lawyers, but our workflows can be hard to see and understand,' Jordan says. 'That’s why we looked at Trello.'When Palace Law first began its digital transformation, the practice focused on two key challenges.The first was to make attorneys available to clients outside of the office. To do this, the firm had to find a way to make all the information scattered across desks and on shelves—all of those paper files—accessible from anywhere. Palace Law adopted Clio Legal Trends Report as its cloud-based practice management system, which became the firm’s digital file room. Every communication and file was recorded and stored there.The second challenge was to help attorneys access their case assignments and tasks in a digital environment. “Being able to visualize a workflow is really important for lawyers, but our workflows can be hard to see and understand,” Jordan says. “That’s why we looked at Trello.” Palace Law adopted Trello as a cloud-based workflow system, and through Zapier, it was integrated with Clio, giving the staff at Palace Law access to the information they needed for a variety of processes. Palace Law also chose Trello because of its integration capabilities; Slack and Google Drive are also part of the firm’s digital ecosystem.Once this paperless environment was in place, the firm reviewed each of its workflows and updated them for the new digital system. For example, in the old system, someone would physically carry a stack of case folders to an attorney and heap them on her desk. The pile of folders amounted to the attorney’s workload, and anchored her to the office. Without them, she couldn’t get her work done.Trello has completely transformed this operational structure. Now, case folders are represented by a Trello card. Those cards are assigned to attorneys’ Trello boards, and attorneys use Trello features to prioritize their work. In the old model, an attorney manually marked a case folder indicating when it needed to be reviewed again. Now, they receive a reminder in Trello that it’s time to revisit a case.Palace Law digitized its mail and client communication workflow as well as its client intake process, and even manages cases in litigation with the help of Trello.“Trello gave us something tangible,” Jordan says. “Since we no longer had a physical file on our desk, we needed a way to see each case folder—to know what to work on, to understand the priorities, to see the files associated with a client.”This change has allowed attorneys to work at home or have their resources handy when meeting with a client offsite, which has reduced stress and made everyone’s lives easier. For example, Jordan uses the Trello mobile app to check his mail and review deadlines. “The mobile app is a big tool for checking in on things and seeing what’s coming up,” Jordan says.Saving 200 Sheets Of Paper A Day'People have generally been happier since we started using Trello. It has made our lives a lot easier,' Jordan says.Today, the team at Palace Law is confident about its digital system, but going paperless was intimidating. “When we started, very few people were doing it, which made it a little scary,” Jordan says. “There was no proven model for it.”While the staff at Palace Law were nervous about the transformation, they were generally on board. “Part of our culture is to be creative, innovative, and adaptable. We’re always looking for ways to do things better for our clients,” Jordan says.The system has yielded some remarkable results. In just 9 months, Palace Law increased revenue by 76%. The firm has also earned an impressive Net Promoter Score (NPS) of 70. According to the Clio Legal Trends report, the nationwide average NPS for law firms is 25. The firm has dramatically reduced how much paper it uses, too. On average, they’re saving 200 sheets of paper a day.As an added bonus, the transformation has also affected the way people feel about their work. “People have generally been happier since we started using Trello. It has made our lives a lot easier,” Jordan says. “People are less stressed. Having a lot of paperwork on your desk is hard to keep track of. Looking at Trello cards with labels and due dates has reduced our stress and made it easier to identify the important priorities in our workflows.”Join over 2,000,000 teams worldwide who are using Trello to get more done.NOW AVAILABLEA 14 Day Free Trial of Premium!Get unlimited boards, Trello views, and limitless automation, plus a ton more.Try it todayTrello customer case studies"
