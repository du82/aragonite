["https://trendmicro.com/de_de/about/customer-stories/atlassian.html"]
title = "Atlassian | Trend Micro (DE)"
description = "Bei Atlassian nutzen wir für den eigenen Geschäftsbetrieb überwiegend Amazon Web Services (AWS). Aufgrund unserer umfangreichen Infrastruktur können Teams Änderungen selbst vornehmen, ohne dass eine zentrale Prüfung erforderlich ist. Wir arbeiten nach dem Grundsatz „Vertrauen ist gut, Kontrolle ist besser“: Wir geben Teams eine Reihe von Best Practices und Richtlinien an die Hand, die zu befolgen sind und deren Anwendung wir anschließend überprüfen. Wird das vorgegebene Ziel nicht erreicht, unterstützen wir das Team bei den Korrekturmaßnahmen."
