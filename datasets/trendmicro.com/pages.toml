["https://trendmicro.com/de_de/about/customer-stories/knmi.html"]
title = "KNMI | Trend Micro (DE)"
description = "Das Königlich-Niederländische Meteorologische Institut, kurz KNMI, ist für seine Wettervorhersagen allgemein bekannt. Der Wetterdienst des KNMI ist rund um die Uhr im Einsatz, um die Bürgerinnen und Bürger in den Niederlanden vor Unwetter oder gefährlichen Wetterbedingungen zu warnen. Das KNMI berät die Regierung, Hafenbetriebe und den Flughafen Schiphol. Auch Anbieter wie Buienradar und Nachrichtenprogramme vertrauen den Services und Daten des Instituts. Das KNMI verfügt über riesige Mengen an historischen Klimadaten, die bis zurück ins 17. Jahrhundert reichen und mit Analysemodellen ausgewertet werden."
