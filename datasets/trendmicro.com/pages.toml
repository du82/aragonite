["https://trendmicro.com/de_de/about/customer-stories/summit-carbon-solutions.html"]
title = "Summit Carbon Solutions | Trend Micro (DE)"
description = """
Summit Carbon Solutions wurde 2020 mit dem Ziel gegründet, die Biokraftstoff- und Agrarindustrie durch Kohlenstoffabscheidung und -sequestrierung zu dekarbonisieren.
Das Unternehmen hat das weltweit größte Projekt zur Kohlenstoffabscheidung und -speicherung ins Leben gerufen, um Treibhausgasemissionen zu reduzieren. Dies wird durch die Verbindung von Industrieanlagen über eine strategische Infrastruktur erreicht. Mehr als 15 Millionen Tonnen Kohlenstoff werden jedes Jahr gesammelt und sicher und dauerhaft in Speicherstätten im mittleren Westen der USA gelagert. Um schnell reagieren zu können, setzt CIO und CTO Jason Cradit auf die Zusammenarbeit mit strategischen Partnern wie Trend Micro."""
