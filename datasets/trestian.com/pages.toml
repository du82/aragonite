7/02/bryan-2017-1-1024x1024.jpg 1024w" sizes="(max-width: 3560px) 100vw, 3560px" />Bryan MojicaDirector of Operations and DevelopmentMeet Bryan Bryan Mojica Director of Operations Bryan is a full-stack software engineer with expertise in JavaScript and PHP/Hack. At Trestian, Bryan combines his engineering and business acumen to optimize value for our clients: resourcefully building and maintaining client applications, sites, and related services.Bryan’s background includes application engineering at Facebook, auditing at KPMG, technical support for nonprofits, and entrepreneurial ventures. He studied software engineering at San Francisco's Hack Reactor and has a BA in Accountancy/Accounting Information Systems from the University of San Diego . Bryan loves to leverage the latest technologies in shipping modular, built-to-scale applications and is keenly interested in slick data visualization. <img decoding="async" class="fl-photo-img wp-image-231 size-full lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/jerry-2017-1.jpg" alt="jerry-2017" itemprop="image" height="700" width="700" title="jerry-2017" srcset="https://www.trestian.com/wp-content/uploads/2017/02/jerry-2017-1.jpg 700w, https://www.trestian.com/wp-content/uploads/2017/02/jerry-2017-1-150x150.jpg 150w, https://www.trestian.com/wp-content/uploads/2017/02/jerry-2017-1-300x300.jpg 300w" sizes="(max-width: 700px) 100vw, 700px" />Jerry Hermel, Ph.D.Director of EngineeringMeet Jerry Jerry Hermel Director of Engineering Jerry Hermel has 38+ years’ experience providing hands-on architecture leadership, systems engineering, mathematics, data science and analysis, and guidance and mentoring to cross-functional teams. He serves as a close collaborator and trusted advisor to internal and external stakeholders while ensuring the delivery of high-quality, robust, and scalable technology, software, and data analytic solutions.Jerry has a Doctorate in Engineering with a focus in computational fluid mechanics and applied mathematics from the University of Southern California.He is passionate about discovering methods and opportunities for developing core technologies used by businesses of varying sizes and across industries such as finance, medical, aerospace, insurance, and more. Possesses diverse, industry-leading accomplishments in software development with fluency in all essential programming languages including PHP, Perl, C, C++, Java, and R. Showcases talent in building web and software platforms from the ground up and ensuring sustainability and functionality. Our clients trust in Trestian <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/verifone.png" alt="Verifone" data-no-lazy="1" /> Verifone <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/pilgrimage-transparent-1.png" alt="Pilgrimage of the Heart Yoga" data-no-lazy="1" /> Pilgrimage of the Heart Yoga <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/uw.png" alt="University of Washington" data-no-lazy="1" /> University of Washington <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/flint-lgo.png" alt="Flint Builders" data-no-lazy="1" /> Flint Builders <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/curb.png" alt="Curb" data-no-lazy="1" /> Curb <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/02/compassionit.png" alt="compassion it" data-no-lazy="1" /> compassion it <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/08/swarm.png" alt="Swarm Mobile" data-no-lazy="1" /> Swarm Mobile <img decoding="async" class="logo-image lazyload" src="https://www.trestian.com/wp-content/uploads/2017/08/AoC_Website_Text_001.png" alt="As