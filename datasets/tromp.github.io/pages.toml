["https://tromp.github.io"]
title = "John Tromp HomePage"
full_description = "When I was still a PhD student, under the supervision of Paul Vitányi, I thought of doing a thesis on the game of connect-4. Instead, I ended up working on distributed computing problems, and many other topics in my PhD research, which resulted in this thesis. Since the early 90s, I've been fascinated by recumbent bikes. Check out this picture of a Green Machine, a design concept that in 2005 has finally been revived in a slightly different form. Since 2017, I am the proud owner of an M5 M-racer. replacing my Optima Condor from 2000. I like to think of cute algorithms (or take other peoples') and write them in the absolute minimum amount of code, greatly obfuscating them in the process. See my programming pearls."
