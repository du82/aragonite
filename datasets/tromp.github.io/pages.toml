["https://tromp.github.io/go/legal.html"]
title = "Counting Legal Positions in Go"
full_description = "L19 = 208168199381979984699478633344862770286522453884530548425639456820927419612738015378525648451698519643907259916015628128546089888314427129715319317557736620397247064840935 It should come as no surprise that L19, viewed as a position, is itself illegal. The initial ternary digits show that the probability of a random position being legal is about 0.0000222 in ternary, close to 3^-4, or 1 in 81. This 1.2% chance was already computed by random sampling back in 1992. The approximation Using an ECM implementation courtesy of Dario Alejandro Alpern, I was able to factorize L19 in mere hours on my laptop, yielding 8 prime factors: Such an algorithm was developed in the early 2000s, and is described in detail in our paper Combinatorics of Go. It essentially reduces computing L19 to taking the 361st power of a very sparse matrix of 363 billion rows and columns. The computational power required for this only became available to me last year. derived from earlier results. Finally, application of the Chinese Remainder Theorem provide an important safeguard in that a tiny change in any of the inputs results in a huge change of output. n number of legal n*n positions 1 1 2 57 3 12675 4 24318165 5 414295148741 6 62567386502084877 7 83677847847984287628595 8 990966953618170260281935463385 9 103919148791293834318983090438798793469 10 96498428501909654589630887978835098088148177857 11 793474866816582266820936671790189132321673383112185151899 12 57774258489513238998237970307483999327287210756991189655942651331169 13 37249792307686396442294904767024517674249157948208717533254799550970595875237705 14 212667732900366224249789357650440598098805861083269127196623872213228196352455447575029701325 15 10751464308361383118768413754866123809733788820327844402764601662870883601711298309339239868998337801509491 16 4813066963822755416429056022484299646486874100967249263944719599975607459850502222039591149331431805524655467453067042377 17 1907938891962819920460572618185046