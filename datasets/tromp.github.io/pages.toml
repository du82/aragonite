title = "John's Go Page"
full_description = 'Let me just re-iterate the motivations for wanting to adopt Chinese-style rules. They are by far the simplest, most elegant, most easily worded, and most easily umpired of the main rule sets. The matter of when the game finishes, and what is dead/removable, in particular, is far more logical and simple than in the Japanese variants, where the main motivations seem to be undue respect for tradition, and a feeling for the "beauty of omission", (a criterion possibly more appropriate to Noh opera than to a worldwide game of strategy). It is of particular concern that the rules be made as "natural" and comprehensible as possible for beginners, so that they not be turned away from the game by puzzlement or outrage, notably at the unfair-looking "free removal" of scoring prisoners at the end of the game. Many of us have known this to happen with promising beginners. Western countries especially cannot afford this kind of wastage of recruits. Another point which has come up in email is this. There are four main areas in which Chinese and Japanese rules differ, and are effectively independent of one another. So in principle there are 2x2x2x2 = 16 ways of forming the rules, in these respects. Only the first difference is crucial. It should be noted that (especially for tournaments) there would need to be a further layer of rules and proprieties concerning things like clocks and time, physical disturbances, ambiguous placements, getting unfair advice, and so on. (What Barry Phease succinctly dubbed "not rules of the game, but rules about playing the game".) I have completely ignored such matters.'
