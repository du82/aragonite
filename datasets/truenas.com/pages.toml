["https://www.truenas.com/truenas-core"]
title = "TrueNAS CORE - World's Most Popular Open Storage OS"
description = "TrueNAS CORE is the world’s most popular Open Source Storage OS. Store, archive and protect your data, share files, and stream media."
full_description = 'Discover the World’s Most Popular Storage OS Free and Open Source unified storage built on OpenZFS. Install on any hardware or VM. Download Overview Features Resources Download .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } TrueNAS Core Overview Experience Storage Freedom TrueNAS® CORE (formerly known as FreeNAS®) is the world’s most popular storage OS because it gives you the power to build your own professional-grade storage system to use in a variety of data-intensive applications without any software costs. Simply install it onto hardware or a VM and experience the true storage freedom of open source storage. Share Files. Serve Media. Store Anything. TrueNAS CORE can be used from the home to the office to the data center for a variety of data-intensive use cases. IT professionals, photographers, designers, audio/video producers and editors, developers, and any user serious about storing and protecting lots of data can take advantage of TrueNAS CORE. Pair it with your favorite backup software to archive large quantities of infrequently used data off of your local devices and even sync and push data to the cloud. Nothing Protects Your Data Like ZFS At the heart of TrueNAS is the self-healing OpenZFS filesystem. Previously only available on the highest-end enterprise storage systems, TrueNAS gives you direct, user-friendly access to ZFS. With its built-in RAID, powerful data management tools, and ability to automatically detect and repair silent data corruption (and bit rot), TrueNAS and OpenZFS ensure data integrity from start to finish. Go Beyond “NAS” More than a traditional “Network Attached Storage”, TrueNAS is Unified Storage that integrates seamlessly into any environment with a variety of file, block, or object access protocols. You can also expand its functionality using FreeBSD Jails, like Plex Media Server, NextCloud, Syncthing, and others. Manage Your Data Like a Pro Unlimited snapshots, clones, and replication add additional layers to safeguard your data from human error or external threats like ransomware. Add system memory (DRAM) and flash to supercharge performance. Use built-in data compression to maximize space. Manage it all from a user-friendly web interface. Join the TrueNAS Community Need help? TrueNAS CORE has detailed documentation and a global community of users to learn from and collaborate with. Appliances & Support for Important Workloads If your data is critical or you simply need professional support, TrueNAS Enterprise and the full line of TrueNAS storage appliances provide enhanced features and the around-the-clock support necessary to keep your storage online. TrueNAS CORE Features .empty-cell{ background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !important; } .head-cell{ background-color: #00597F !important; text-align: center; border: none !important; } .heading-cell{ background-color: #00597F !important; color:#FFF !important; border: none !important; } .Hybrid_dark{ background-color: #0095d5 !important; color:#FFF !important; text-align: center; } .Hybrid_dark { background-color: #0095d5 !important; color:#FFF !important; text-align: center; } .Dark-gray th{ background-color: #666666!important; color: #fff!important; border: 0; } .Hybrid_light th{ background-color: #0095d5 !important; color: #fff!important; } .Hybrid_light td{ background-color: #ebf7fc !important; } tr.Hybrid_light:nth-of-type(2n){ background-color: #31BEEC !important; /*color:#FFF !important; */ } .Flash_dark th{ background-color: #71BF44; color:#FFF !important; text-align: center; } .Flash_dark td{ background-color: rgba(165,206,61,0.2) !important; text-align: center; } tr.Flash_light{ background-color: rgba(165,206,61,0.56) !important; } tr.Flash_light:nth-of-type(2n){ background-color: #A5CE3C !important; } .all_models { background-color: #CCCCCC; text-align: center; } th > h3 { margin: 0; padding: 0; font-size: 2.2em; color: #fff!important; line-height: 1.2em; } table { background-color: transparent ; border-collapse: collapse; } .dcf-table tbody, .dcf-table thead { font-size: 1em } .dcf-table tfoot { font-size: .75em } .dcf-table tbody { border-bottom: 1px solid #e