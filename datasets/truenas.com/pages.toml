["https://www.truenas.com/blog/ixsystems-experiences-record-growth-in-truenas-enterprise-storage-spins-off-server-business-to-amaara-networks"]
title = "iXsystems Experiences Record Growth in TrueNAS Enterprise Storage, Spins Off Server Business to Amaara Networks - TrueNAS - Welcome to the Open Storage Era"
description = "All-Flash NVMe Performance."
full_description = "San Jose, CA – February 12, 2025 – iXsystems, the leader in Open Enterprise Storage, is sharpening its focus on the rapid growth of its TrueNAS Enterprise storage business by transitioning its server hardware integration division to its trusted partner, Amaara Networks. Effective immediately, this strategic move allows iXsystems to accelerate innovation in open enterprise storage, ensuring that customers benefit from both cutting-edge storage solutions and high-quality server offerings. Amaara Networks, with deep expertise in server solutions and a strong customer-first approach, will seamlessly take over server operations, delivering continued excellence. This transition reinforces iXsystems’ leadership in enterprise storage by enabling a sharper focus on the expansion of TrueNAS Enterprise, the industry’s leading open enterprise storage platform. As demand continues to surge, iXsystems is dedicating more resources to driving continued TrueNAS innovation, enhancing security, and delivering the best value in enterprise storage while ensuring customers continue to receive top-tier server solutions through Amaara Networks. For customers, this move ensures best-in-class offerings in both storage and server solutions. It also marks a milestone in iXsystems’ long-term strategy—solidifying its position as the go-to provider for versatile, scalable, and secure enterprise storage. “As enterprises increasingly adopt open enterprise storage, we see a tremendous opportunity to expand and enhance TrueNAS for the global market,” said Mike Lauth, CEO of iXsystems. “By transitioning our server business to Amaara Networks, we ensure our customers receive the best possible experience while allowing us to dedicate our full focus to advancing TrueNAS as the industry’s leading open enterprise storage solution. Amaara’s deep expertise and commitment to customer success make them the perfect partner for this transition.” “We are honored to be entrusted with iXsystems’ server business and are fully committed to maintaining the high level of service and reliability that their customers have come to expect,” said Victor Ahuja, Co-Founder and Head of Sales of Amaara Networks. “This partnership strengthens our collaboration with iXsystems and allows us to expand our solutions while ensuring a smooth and seamless transition for all server customers.”"
