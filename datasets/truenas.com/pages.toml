x-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Overview TrueCommand expands on the ease of use and power of TrueNAS systems with multi-system management. The powerful yet intuitive interface provides the following features: Storage Fleet Dashboard Single Sign-on to all TrueNAS Systems Customized Alerts and Reports Rapid Fault Management and Diagnosis Real-Time Data Collection and Analysis Predictive Analytics to Maximize Uptime Team-Based 24×7 Operations Enterprise Security with Role-Based Access Control (RBAC) and Auditing Manage Systems Locally or from the Cloud Simplified Operations TrueCommand is a ZFS-aware solution allowing you to set custom alerts on statistics like ARC usage or pool capacity, ensuring storage uptime and future planning. TrueCommand also identifies and pinpoints errors on drives or vdevs (RAID groups), saving you valuable time when troubleshooting and resolving issues. View Datasheetvar option_df_80238 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/11\/TrueCommand_Data_Sheet_November_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Use TrueCommand Cloud – Software as a Service TrueCommand Cloud is a secure and easy-to-use cloud service. Each TrueCommand instance is hosted by iXsystems® in a private cloud and uses WireGuard VPN technology to secure communications with each NAS system and with each user or storage admin. Subscriptions start at $6 per month for 30 drives and are based on the number of drives. Requires TrueNAS 12.0+ or TrueNAS SCALE Subscribe and setup TrueCommand Cloud with these instructions. Get Started with TrueCommand Cloud Screenshots TrueCommand Administrator TrueCommand Systems Monitoring TrueCommand System Status TrueCommand User Dashboard Resources TrueCommand Manages the NAS Fleetvar option_df_85941 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2023\/05\/TrueCommand_2.3_White_Paper_May_2023.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} TrueCommand Datasheetvar option_df_80238 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/11\/TrueCommand_Data_Sheet_November_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Download the Self-hosted TrueCommand Container ixhsOptionsDownload = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "valeue": "null"}, {"enabled": true, "name": "form_domain", "valeue": "TrueNAS.com"}, {"enabled": false, "name": "form_location", "valeue": "Embedded"}, {"enabled": true, "name": "form_use_case", "valeue": "null"} ], //"hideAfterSubmit": ".ixhs-hide-download", //"showAfterSubmit": ".element-download-show", // default udefined "formSubmitted": function() { showInstall(); } // default udefined } hbspt.forms.create({ portalId: "6502416", formId: "d865c815-e8fc-41fd-8b38-8317d38a6132", cssRequired: "", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsDownload); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsDownload); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixhsOptionsDownload); } }); var tcdCookieSet = false; function showInstall(){ jQuery(".element-download-show").fadeIn("slow"); jQuery(".ixhs-hide-download").fadeOut("slow"); handleCookie(); }; function showAuthorized(){ jQuery(".element-download-show").show(); jQuery(".ixhs-hide-download").hide(); handleCookie(); }; function handleCookie(){ if(tcdCookieSet === false) { var expires = (new Date(Date.now()+ 1 * 365 * 1000 * 86400)).toUTCString(); //years * days * mili * seconds in 1 day document.cookie = "tcdSignedUp=1; expires=" + expires + "; path=/"; tcdCookieSet = true; window.dataLayer = window.dataLayer || []; dataLayer.push({ 'event': 'eventTracking', 'category': 'Cookie', 'action': 'Set', 'label': "Truecommand SignUp Form Filled" }); } }; jQuery(document).ready(function() { jQuery("#tcd-optout").click(function(){ showInstall(); }); if(window.location.hash.toLowerCase().indexOf("authorized") >= 0){ showAuthorized(); window.location.hash = ''; jQuery( "a[href^='#Download']" ).click(); } else if(document.cookie.indexOf("tcdSignedUp=1") > -1) { tcdCookieSet = true; showAuthorized(); } }); Installation Installing/Starting the image To fetch/use these images, run the following: docker pull ixsystems/truecommand docker run --detach -v "[hostdirectory]:/data" -p [portnumber]:80 -p [sslportnumber]:443 ixsystems/truecommand Where the “[hostdirectory]” should point to some persistent directory on the host to use as the long-lived data directory for the container. Checking the status of the running containers This will also return which port numbers on the local host get redirected to the TrueCommand container docker ps Stopping the container docker stop [container ID] Other resources TrueCommand on Docker Hub The username and password for the VM images are both “truecommand” License Portal How To Install Documentation docker pull ixsystems/truecommand docker run --detach -v "[hostdirectory]:/data" -p [portnumber]:80 -p [sslportnumber]:443 ixsystems/truecommand docker ps .console{ width:92%; max-width:92vw; margin: 0 auto; text-align:left; border-radius:5px; margin-bottom:10px } @media (max-width:830px){ .console{ margin-right:auto; margin-left:auto } } .console_head{ overflow:hidden; background-color:#d5d5d5; padding:8px 15px; border-top-left-radius:5px; border-top-right-radius:5px } .console_dot{ width:12px; height:12px; border-radius:50%; box-shadow:0 1px 1px 0 rgba(0,0,0,.2) } .dot-l{ float:left; margin-right:7px; } .dot-r{ float:right; margin-left:7px; } .console_dot-1{ background-color:#383838 } .console_dot-2{ background-color:#787878 } .console_dot-3{ background-color:#A8A8A8 } .console_dot-4{ background-color:#181818 } .console_body{ background-color:#1e1e1e; padding:30px 17px 20px; border-bottom-left-radius:5px; border-bottom-right-radius:5px } .console_command{ display:block; margin-bottom:15px; font-family:"Source Code Pro",monospace; font-size:15px; color: white; } .console_command::before{ content:">"; padding-right:15px; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none } CONTACT US TrueCommand Licensing TrueCommand software is free to use to manage up to 50 drives, and can be deployed as a Docker Container. Licenses to expand TrueCommand capabilities may be purchased from the iXsystems Account Portal. Pricing is based on the number of drives and the support level required. Recommended System Requirements A 64-bit Linux distro (we recommend Debian) Linux Kernel Support: 4.x+ 1 CPU with 2 GB RAM 1 Hard Disk with 50 GB storage space Customer networking settings and internet access Buy License View Datasheet Get a Quote ixhsOptionsQt = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": "null"}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "null"} ], "popUp": true, "popUpTriggerClass": ".quote-pop-up", "popUpElementClass": ".ixhs-pop-up-box-quote", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "20ba0761-836