["https://www.truenas.com/blog/data-mobility-with-enterprise"]
title = "Improves Data Mobility and Furthers Data Freedom"
description = "Enhance data mobility and achieve greater data freedom with our Enterprise File Sync solution. Experience improved data management today!"
full_description = "One aspect of freedom that applies to storing and managing data is relatively easy to understand and measure: Data Mobility. At one end of the spectrum, you are entirely free to move data between any storage systems without restrictions. On the other end, proprietary systems effectively imprison your data where it is stored. This blog is part of a series of blogs on Data Freedom, so subscribe to our RSS feed and check back weekly to read more in this series. In the roughly 30 years since networked storage emerged, organizations have complained about — and surrendered to — the limits and complexities associated with moving data and how they slow down operations. Organizations want more agility, yet many continue to deploy networked storage in proprietary silos with restrictions. TrueNAS has always offered many choices for moving data, and now there is a new official app that allows Enterprise File Sync, known as Syncthing, in the Enterprise Train for TrueNAS SCALE. Organizations of all sizes need data mobility’s flexibility to keep data synced between geographically distributed systems. Whether you need off-site backups or the ability to migrate data between systems within data centers, TrueNAS has several choices among built-in tools for replicating data. While many have frequently used ZFS replication, rsync, and cloudsync to manage data transfers, these tools were not designed for multi-site file sync needs. That’s where Enterprise File Sync with syncthing comes in. Many organizations have multiple buildings or remote sites that house content and software development, and users want to collaborate and share this critical data. But where should the data be located for the best user experience and productivity? TrueNAS Enterprise File Sync allows data to be present on systems at multiple sites worldwide while providing concurrent read and write access to each system. File updates to one system are automatically synced across all systems, with the only constraint being the bandwidth between the systems."
