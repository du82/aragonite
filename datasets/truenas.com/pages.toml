full_description = '''Fangtooth Unification Begins Feb 13, 2025TrueNAS "Fangtooth" takes its first big step into the limelight with today's release of TrueNAS 25.04-BETA. With new features for both Community and Enterprise users, TrueNAS 25.04 will offer an upgrade to SCALE 24.10 and CORE 13.x users alike - and the BETA release... read more Fangtooth Unifies the TrueNAS Community Jan 7, 2025The Fangtooth is a deep sea fish with two outsized teeth, the largest of any ocean fish in proportion to their body. It’s also the code name for the next version of TrueNAS, the successor to the very successful TrueNAS Electric Eel. For TrueNAS, the two teeth of the... read more TrueNAS Electric Eel Performance Sizzles Dec 20, 2024After a successful release and the fastest software adoption in TrueNAS history, TrueNAS SCALE 24.10 “Electric Eel” is now widely deployed. The update to TrueNAS 24.10.1 has delivered the quality needed for general usage. Electric Eel's performance is also up to 70%... read more TrueNAS 24.10.1 “Electric Eel” is Charged Up Dec 18, 2024Following the highly successful initial release of "Electric Eel" the TrueNAS team is excited to announce the availability of the TrueNAS 24.10.1 update, downloadable from truenas.com/download-truenas-scale/ or within your existing TrueNAS installation. With over... read more TrueNAS Launches “Powered by TrueNAS” Initiative with First Partner HexOS Jul 31, 2024TrueNAS, the world’s leading open-source storage software, today announced the launch of its “Powered by TrueNAS” initiative. This new initiative will see TrueNAS partner with industry leaders and visionaries to deliver tailored storage solutions for specific use... read more TrueNAS SCALE Dragonfish Matures with Second Major Quality Update Jul 8, 2024TrueNAS SCALE 24.04 “Dragonfish” continues to mature with today’s release of the second major update. TrueNAS SCALE 24.04.2 is focused on security and stability, in preparation for widespread enterprise adoption. In the last month, TrueNAS SCALE has reached over... read more'''
