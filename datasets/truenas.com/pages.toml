full_description = 'M-Series Flagship Performance & Scalability All-Flash or Hybrid Disk/Flash High Availability Options Raw Capacity Up to 20 PB Simple Upgrades & Serviceability Enterprise Support Get In Touch Overview Architecture Models Datasheetvar option_df_15 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","pageMode":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/08\/TrueNAS_M-Series_Data_Sheet_August_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Resources Get In Touch .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Overview Enterprise-Grade Open Storage Built to maximize storage capacity, performance, and uptime, the M-Series is the TrueNAS® flagship line of appliances designed with the flexibility to address an array of demanding storage requirements and adapt as needs change over time. With high-availability options and advanced data management tools, the TrueNAS M-Series safeguards data for mission-critical operations where downtime is not an option. Performance & Scale without Compromise All-flash or hybrid disk and flash? The M-Series can be both. Combining vast system RAM, NVDIMM, and NVMe flash as layered cache provides industry-leading read and write efficiency and optimizes the performance of the primary storage media. Flash pools are supercharged, and high-density disk pools deliver low latency flash performance at disk capacity and cost. Fusion Pools, comprised of both disk and flash together, deliver the best of both worlds. With up to four 100Gb/s network ports per controller, the TrueNAS M-Series is designed to move terabytes at maximum speed. Storage You Can Rely On The TrueNAS M-Series offers unmatched data reliability in both software and hardware. The OpenZFS file system is the last word in data protection with copy-on-write and bit-rot detection ensuring the integrity of your data from write to read. Dual controllers and high- availability options ensure over 99.999% uptime to maintain business operations and keep applications running around the clock. Hardware Management & Upgrades, Simplified Servicing an M-Series system is made easy by the modular, tool-less hardware design. Additional integrated enclosure management capabilities save time and effort by providing graphical visualization of the system in the UI, making it easy to monitor the state of your system from a single screen. If performance or capacity needs change over time, it’s as simple as a non-disruptive upgrade to higher-end M-Series controllers. Scale Up or “SCALE” Out Begin building the foundation of your scale-out, hyper-converged virtualization infrastructure with SCALE or use Enterprise for high-performance, ultra-reliable local HA storage. Expand to over 20 PB on a single M60 head unit with support for up to 12 expansion shelves, or use TrueNAS SCALE to cluster over 100 systems together for massive capacity and performance. Award-Winning Support In the unlikely event that a failure does happen, you can rest easy knowing that all TrueNAS H-Series systems are fully backed by our world-class support team, celebrated for their excellence and highly rated by clients on Gartner Peer Insights™. Our Bronze, Silver, and Gold support packages are further reinforced by a global spares network, ensuring you stay up and running no matter where you’re located. Architecture The M-Series is a 4U system with dual controllers. Each controller has NVDIMMs for extremely low latency write caching and there is a high bandwidth PCIe interconnect between controllers to synchronize the NVDIMMs. The controllers share access to 24 x 3.5” drives (HDD, SSD, RI-SSD) and also can share 4 low latency NVMe drives which can be used for metadata or persistent read cache. Models .empty-cell{ background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !important; } .head-cell{ background-color: #00597F !important; text-align: center; border: none !important; } .heading-cell{ background-color: #00597F !important; color:#FFF !important; border: none !important; } .Hybrid_dark{