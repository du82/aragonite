["https://www.truenas.com/blog/ixsystems-named-a-gartner-peer-insights-customers-choice"]
title = "iXsystems Named Gartner Peer Insights™ Customers’ Choice"
description = "iXsystems honored as a Gartner Peer Insights Customers' Choice in Primary Storage for rueNAS Enterprise. Experienced TrueNAS!"
full_description = "Thank You iX Customers! We are honored to share that iXsystems and our product TrueNAS Enterprise have been named a North America Customers’ Choice in the Gartner Peer Insights™ Voice of the Customer Report for Primary Storage. This recognition was made possible by our customers who shared their experiences with TrueNAS. What started with a handful of reviews in 2022 quickly grew to more than a hundred, ranking us above other well-known storage vendors and culminating in yet another award for TrueNAS Enterprise and iXsystems. Though, what makes this recognition even more special is that it was driven by our incredible customers. This is the first such award for iXsystems from Gartner, and we look forward to competing in the Primary Storage category for years to come, while simultaneously expanding into the “Distributed File Systems and Object Storage” category with TrueNAS SCALE. The full report can be accessed at https://www.gartner.com/en/documents/4304999 (Gartner Subscription Required). TrueNAS Enterprise from iX received higher scores than offerings from Dell EMC, HPE, and NetApp, while also coming in with identical scores to Pure Storage and Infinidat. We are also the only vendor with 100% of reviewers reporting they would recommend our solution to others. Unlike some of the comparable products in the Primary Storage category that offer only block storage, TrueNAS is a universal data platform that gives customers choice of block, file, and object storage interfaces as well as applications. According to one customer review, “I’ve been a customer of iXsystems and TrueNAS products for over 8 years and two companies. Everything from their sales team to their implementation and support teams are top notch individuals. I highly recommend them to other colleagues as well when they are looking for a reliable, lower cost storage platform with all the major bells and whistles of the larger players.” According to another customer review, “There is no other array we can find that delivers block-storage via iscsi and fibre-channel… file shares by SMB/CIFS/NFS… and S3-compatible buckets at this price point. The flexibility is unreal, and the management portals are thorough. Development of new features and squashing of bugs are continuous and frequent. Transparency on their forums is amazing.”"
