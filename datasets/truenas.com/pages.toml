title = "Secure Private Cloud Storage - Reduce TCO & Consolidate Data"
description = "TrueNAS works with many S3 providers or as a private cloud storage that lowers your TCO. Scale compute, storage, and performance independently with TrueNAS."
full_description = 'Secure Solutions for Cloud Storage Overview Use Cases Our Clients Resources Management Get Pricing .getPricing{ background-color:#FFF; text-transform:uppercase; color:#0095D5 !important; } .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Managing the Cloud Companies find that the cloud is great for new applications that start small, but may no longer be cost effective when they grow. Many such companies have chosen TrueNAS® to lower their costs up to 70% compared to AWS S3-compatible storage that is globally distributed and a fraction of the price of AWS is available with iX-Storj which is built-in to TrueNAS. Compare Systems Get a Quote Reliable Data Security TrueNAS ensures data integrity with its self-healing file system that automatically repairs bit rot. Unlimited snapshots make it easy to restore your data in the event of a malware attack or hardware failure. Full volume encryption and Self-Encrypting Drives provide additional security against unauthorized access. Virtualization Freedom TrueNAS integrates with all major virtual machine environments, enabling you to deploy hundreds or thousands of VMs and virtual desktops (VDI) in minutes and run more operating environments on a single host from a single, hassle-free array. Cost-Effective Scaling OpenZFS is a future-proof 128-bit “scale up” file system that is designed for decades of continuous use. TrueNAS grows from 10 TB to 10 PB per system and can be upgraded to a highly available configuration. With TrueNAS you don’t have to worry about data or its availability. Simplify Cloud Access Back Up and Secure Data Safeguard your data by creating off-site backups with scheduled sync and replication features. The self-healing file system at the heart of TrueNAS provides bit rot protection and copy-on-write ensures data integrity from the moment the data is written. TrueNAS’s built-in ZFS snapshot and replication feature makes it easy to restore your data by rolling back to before the data was compromised. Sync and Share Petabytes of Data Consolidate all of your data onto a single, powerful platform. TrueNAS supports block, file, and object storage across all standard file protocols including SMBv1/v2/v3, AFP, NFSv3/v4, S3 API, and iSCSI. Integration via Active Directory, LDAP and Kerberos is included. It is also easy to sync and back up your files to popular cloud services including Amazon S3, Backblaze B2, and many more. Reduce Total Cost of Ownership If you don’t have a second data center to back up to, TrueNAS includes the tools to back up your data to public or private clouds like Amazon S3, Azure, Backblaze B2, Box, and Google Cloud Storage. Pay for what you use with no upfront costs and no additional TrueNAS licenses. Extend your Private Cloud with iX-Storj Storing important data offsite is also vital in your strategy to recover from a data disaster. Given its decentralized network, iX-Storj cloud storage is easy to configure and delivers incredible performance for hot backups with high multi-region availability. Data is broken into erasure-coded pieces and distributed globally where all file segments and metadata are separately encrypted so only you know what is stored. Trusted By the Majority of the Fortune 500 View our Clients “If you’re considering an upgrade…ESG recommends that you consider the iXsystems TrueNAS storage platform with cloud extensibility, deep management analytics, and up to twice the performance at half the cost of the competition.” -Enterprise Strategy Group (ESG) Read the Report Resources var option_df_71660 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2023\/05\/TrueNAS_Overview_White_Paper_May_2023.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} var option_df_85941 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2023\/05\/TrueCommand_2.3_White_Paper_May_2023.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DF