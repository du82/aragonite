description = "TrueNAS Mini is a powerful, enterprise-grade storage solution for SOHO and businesses. Get more out of your storage with the TrueNAS Mini today."
full_description = 'TrueNAS Mini .row { display: flex; width: 100%; } .col { flex: 50%; padding: 5px; } @media (min-width: 500px) { .row { flex-direction: row; } } @media (max-width: 500px) { .row { flex-direction: column; } } { "prerender": [ { "source": "list", "urls": ["/configure-and-buy-truenas-mini/"], "eagerness":"immediate" } ] } Overview Specifications Resources Configure & Buy .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Overview Manage Your Data Like a Pro There are many compact NAS options on the market, but only one gives you access to the same tools used by enterprise storage professionals for backing up and sharing your movies, photos, VMs, and files from a single device. The small but mighty TrueNAS® Minis stand apart with unmatched power to provide your data with the protection and performance it truly deserves. Endless Possibilities Ideal for file-sharing, backup, multimedia processing and distribution, video surveillance, edge/remote office, development, personal cloud, and other small/home office & SMB applications. Sharing is Caring Easily create file shares, set permissions, and perform maintenance from a single web browser. The TrueNAS Mini supports all major file and block protocols and is designed to run quietly in any existing home or office environment. Plug it in and start it up, it just works. Don’t Just Store Your Data. Protect it. At the heart of TrueNAS is the self-healing, enterprise-grade OpenZFS file system. Combined with advanced tools like built-in RAID, snapshots, encryption, and bitrot detection, TrueNAS Minis provide ultimate protection against data loss, corruption, and ransomware. Mini but Mighty Just because a NAS is small, doesn’t mean it has to be underpowered. TrueNAS Minis have the hardware horsepower to outperform any compact NAS on the market, and caching SSDs can be added to supercharge read and write performance even further. All while still remaining power-efficient and quiet. Go Beyond Storage with Apps & VMs Broaden your Mini’s capabilities with a variety of Apps from the TrueNAS App Catalog, deploy VMs, or run custom Docker images to fill a variety of needs from shared media hosting to private cloud management. The Preferred Drive of TrueNAS Mini TrueNAS Minis come standard with Western Digital Red Plus hard drives, which are especially suited for NAS workloads and offer an excellent balance of reliability, performance, noise-reduction, and power efficiency.* *Regardless of which drives you use for your system, purchase drives with traditional CMR technology and avoid those that use SMR technology. Specifications TrueNAS Mini X Starting at $1148 5 + 2 Hot-Swap Bays Quad-core C3558 Intel CPU 16 GB ECC RAM Efficient Design Quad 1GbE TrueNAS Mini X+ Starting at $1448 5 + 2 Hot-Swap Bays Octa-core C3758 Intel CPU 32 GB ECC RAM Great Performance Dual 1/10GbE TrueNAS Mini R Starting at $1848 12 Hot-Swap Bays Octa-core C3758 Intel CPU 32 GB ECC RAM Maximum Capacity Dual 1/10GbE Full Specifications FEATURES TrueNAS Mini X TrueNAS Mini X+ TrueNAS Mini R Chassis 5+2 Bay Enclosure – Super Quiet Design 12 Bay Enclosure – Super Quiet Design Drive Bays 5 x SATA 3.5” Hot-Swappable Drive Bays(Optional 3.5″ to 2.5″ adaptors available)2 x SATA 2.5” Hot-Swappable SSD Bays 12 x SATA 3.5” Hot-Swappable Drive Bays (Optional 3.5″ to 2.5″ adaptors available) Maximum Raw Capacity Up to 90 TB Up to 105 TB Up to 216 TB CPU Quad-core C3558 Intel CPU Octa-core C3758 Intel CPU Octa-core C3758 Intel CPU Memory 16 GB DDR4 with ECC(Upgradeable to 32GB) 32 GB DDR4 with ECC(Upgradeable to 64GB) 32 GB DDR4 with ECC(Upgradeable to 64GB) RAID OpenZFS – RAIDZ1 (RAID 5), RAIDZ2 (RAID 6), Multi-Disk Mirror (RAID 10), and RAID0 (stripe) Disk Management Hot-Swappable Drives, Bad Block Scan + HDD S.M.A.R.TISO Mounting Support, Hardware-Accelerated Disk Encryption Network Standard: 4 x 1 Gigabit Ethernet LAN ports (10/100/1000)Dedicated RJ45 IPMI Port (Remote Hardware Management) Standard: 2 x RJ45 1/10GBaseT Ethernet LAN portsDedicated RJ45 IPMI Port (Remote Hardware Management)2 x SFP+ 10G Add On Card (Optional) Standard: 2 x RJ45 1/10GBaseT Ethernet LAN portsDedicated RJ45 IPMI Port (Remote Hardware Management)2 x SFP+ 10G Add On Card (Optional) USB Ports 2 x USB 2