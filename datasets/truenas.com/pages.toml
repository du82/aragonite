 game and app production companies manage large volumes of data and media assets, with dozens – if not hundreds – of team members collaborating in the media workflows, needing reliable storage infrastructure to ensure that the code, data and worlds they create are protected against malicious ransomware and preserved against failures. TrueNAS provides robust data integrity and high performance caching, leveraging ZFS, and is proven in both large and boutique gaming development studios. Accelerate Game Development and Infrastructure Design Collaboration is at the heart of Game Design. TrueNAS Enterprise delivers battle tested performance and sharing of data by providing universal storage – supporting block, file and object access. Every common operating system, hypervisor, and application are supported. Instead of creating storage silos for your various applications, you can use one TrueNAS storage array to manage your data and scale up or out as your needs grow. Manage Beyond user access – managing diverse workloads such as data delivery to render farms and dev-test environments, is a critical aspect of game development. Large volumes of data can be organized on TrueNAS via popular source repositories such as Perforce, Git, ClearCase or Subversion. Gaming assets are stored safely trusting the highest level of file system data integrity delivered via TrueNAS and ZFS. Media failures are immediately addressed via a self healing architecture. Deliver Public cloud based gaming environments can struggle to deliver frame rates suitable for a seamless gaming experience. Bringing gaming workloads back into private cloud environments and serving gaming data from TrueNAS Enterprise have resulted in significant improvements in frame rates. TrueNAS Enterprise Appliances for Game Design and Delivery F-Series M-Series H-Series Due to the varied nature of game development requirements, please connect with our Media and Entertainment team for a solution that intersects with your unique workload. Let’s Create Together See how TrueNAS can help your workflow! Get In Touch ixhsOptionsQt = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "Gaming"} ], "popUp": true, "popUpTriggerClass": ".quote-pop-up", "popUpElementClass": ".ixhs-pop-up-quote", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "f71e6c91-e849-4ff6-afdd-054c32a54b31", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsQt); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsQt); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixhsOptionsQt); } }); ixhsOptionsEx = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "Gaming"} ], "popUp": true, "popUpTriggerClass": ".expert-pop-up", "popUpElementClass": ".ixhs-pop-up-expert", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "a22c0f41-7467-47c5-bb42-1059479400ef", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsEx); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsEx); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixhsOptionsEx); } }); var iXpageVersion = "1";'
