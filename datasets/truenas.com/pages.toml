title = "TrueNAS F-Series High-Performance Storage Systems"
description = "TrueNAS F-Series is a high-performance NVMe storage solution for maximum speed and data density."
full_description = '''TrueNAS F-Series Experience True Performance All-Flash NVMe Performance and Legendary ZFS Reliability.Never Compromise. Get In Touch Watch The Video Overview Architecture Models Datasheetvar option_df_92395 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/11\/TrueNAS_F-Series_Data_Sheet_November_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Resources Get In Touch .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Overview NVMe Performance & Density Without Compromise Ultimate performance, reliability, and density? You now can choose all three. With built-in high-availability and NVMe Gen4 SSDs for the fastest possible throughput, the TrueNAS F-Series safeguards data for mission-critical, high-performance operations where downtime is not an option. The F-Series delivers performance up to 30 GB/s, while packing 720 TB of space into a dense 2U form factor – expandable up to 5 PB. Built for High Performance Workloads The TrueNAS F-Series boasts top-of-the-line performance for the most demanding workloads, including post-production, data analytics, virtualization, and many more. It is the industry’s fastest OpenZFS appliance available, with all of the data protection and workload optimization capabilities that come with OpenZFS. Dual controllers and high-availability ensure over 99.999% uptime to maintain business operations and keep applications running around the clock. Hardware Management & Upgrades, Simplified The TrueNAS F-Series modular hardware architecture conserves power, space, and cooling while supporting multiple applications with its ultra-performant NVMe Flash. High Availability (HA) ensures storage services are not disrupted, while Intelligent Storage Optimization maximizes storage efficiency with typical data reduction ratios of greater than 2.5x. Award-Winning Support In the unlikely event that a failure does happen, you can rest easy knowing that all TrueNAS F-Series systems are fully backed by our world-class support team, celebrated for their excellence and highly rated by clients on Gartner Peer Insights™. Our Bronze, Silver, and Gold support packages are further reinforced by a global spares network, ensuring you stay up and running no matter where you’re located. Architecture The F-Series is a 2U system with dual controllers. Each controller has direct, low-latency access to the NVMe drives, and uses a dedicated high-bandwidth interconnect between controllers for synchronization and high-availability. Models F60 F100 NVMe Storage/All-Flash Max Capacity 2.1 PB 5 PB Max Effective Capacity* 4 PB 10 PB Max Throughput 20 GByte/s 30 GByte/s Max Drives Supported 24 Max Expansion Shelves 2 6 Height 2U Chassis Depth 27”, 686mm Dual Controllers Yes DRAM Per Controller 512 GB Networking Up to 4x 40/100 GbE (optical) Up to 6x 40/100 GbE (optical) 2x 10G Base-T All Models Performance Varies based on configuration.Contact Us. Pricing Guidance Starting at $40,000 with dual controllers and 1 year Bronze Support Starting at $70,000 with dual controllers and 1 year Gold Support Guidance of approximately $300/TB for Flash Capacity. Prices vary based on configuration. Datasheets F-Series Datasheet,var option_df_92395 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/11\/TrueNAS_F-Series_Data_Sheet_November_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Expansion Shelf Data Sheetvar option_df_70147 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/10\/Expansion_Shelf_Data_Sheet_October_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} * Maximum effective capacity assumes typical data reduction through compression and deduplication. .empty-cell{ backgr