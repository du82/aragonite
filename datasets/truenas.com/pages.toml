full_description = '.hero-title { display: flex; font-size: clamp(6.5em, 0.5vw, 1.2em) !important; flex-wrap: wrap; } /*** Responsive Styles Smartphone Portrait ***/ @media all and (max-width: 479px) { .hero-title { display: flex; font-size: 4.7em !important; flex-wrap: wrap; } } FreeNAS Where Open Storage Began Learn About Our TrueNAS Enterprise Storage Products October 2021FreeNAS & TrueNAS Unification Complete October 2020TrueNAS 12.0 CORE is released and becomes the standard upgrade path for FreeNAS 11.3 July 2020 TrueNAS SCALE, a scale-out Linux-based project based on TrueNAS CORE, is announced. March 2020 TrueNAS Open Storage is revealed creating TrueNAS CORE and TrueNAS Enterprise March 2020 iXsystems announces unification of FreeNAS and TrueNAS code base in TrueNAS 12.0. May 2019 TrueCommand 1.0 is released to provide a single pane of glass management for FreeNAS and TrueNAS. June 2018 FreeNAS 11.2 introduces iocage, modernizing the jail infrastructure May 2017 iXsystems announces the release of FreeNAS 11 with a new graphical interface. March 2015 FreeNAS 9.10 adds support for the bhyve hypervisor, enabling VMs October 2013 TrueNAS, the enterprise appliance edition of FreeNAS with high availability (HA), is released. July 2012 Modern “Jail” and Plugin Architecture Arrives in Version 8.2 January 2010 FreeNAS adds OpenZFS (ZFS) support September 2009 Olivier Cochard-Labbé asks iXsystems to continue the development of FreeNAS. iXsystems takes over and invests in the project. October 2005 FreeNAS Created by Olivier Cochard-Labbé and based on FreeBSD .timeline { list-style: none; padding: 10px 0; position: relative; } .timeline:before { top: 0; bottom: 0; position: absolute; content: " "; width: 2px; background: #0095D5; left: 50%; margin-left: 8px; } .timeline > li { margin-bottom: -45px; position: relative; width: 50%; float: left; clear: left; list-style: none; margin-left: 1px !important; } .timeline > li:before, .timeline > li:after { content: " "; display: