*/ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Overview Versatile Hybrid or All-Flash Storage The TrueNAS H-Series brings the reliability, unbeatable value, and efficient performance of TrueNAS Enterprise to the entry-level price point. Available in hybrid or all-flash configurations, the H-Series provides high availability options for up to 2.5 PB in HDD or 720 TB in flash. Powerful and Efficient Performance The TrueNAS H-Series is a compact, 2U system with 12 drives and optional expansion to 114 drives with 2.5 PB of capacity. Each system can be configured for scalable Hybrid capacity, or affordable All-Flash performance. The H-Series is designed for industry-leading Total Cost of Ownership (TCO) with <300W typical power consumption. Pricing is all-inclusive of TrueNAS Enterprise software. The optional TrueCommand service (licensed separately) can be used to manage single or multiple TrueNAS systems. Big Capacity, Tiny Footprint The sleek 2U design of the TrueNAS H-Series is designed to minimize rack space and power footprint, providing efficient performance and capacity for small to medium workloads. A single TrueNAS H-Series paired with an ES102 can support up to 2.5 PB of raw capacity in just 6U. Storage You Can Rely On Pairing the best Open Source storage technology with enterprise-grade hardware offers best-in-class reliability. The OpenZFS file system is the final word in data protection, with copy-on-write and bit-rot detection ensuring the integrity of your data from write to read. Dual controllers and high availability options ensure over 99.999% uptime so you can keep working even during maintenance events. Hardware Management Simplified The H-Series was built for painless operation and maintenance with its modular hardware design. Additional integrated enclosure management capabilities save time and effort by providing graphical visualization of the system in the UI, making it easy to monitor the state of your system from a single screen. Optional TrueCommand software allows managing multiple TrueNAS units from a single control panel. Scale up or Scale Out Begin building the foundation of your virtualization infrastructure with TrueNAS SCALE, or use TrueNAS Enterprise for high-performance, ultra-reliable local HA storage. With the lowest total cost of ownership for enterprise storage, a self-hosted TrueNAS storage solution can save over 70% the cost of public cloud storage. Award-Winning Support In the unlikely event that a failure does happen, you can rest easy knowing that all TrueNAS H-Series systems are fully backed by our world-class support team, celebrated for their excellence and highly rated by clients on Gartner Peer Insights™. Our Bronze, Silver, and Gold support packages are further reinforced by a global spares network, ensuring you stay up and running no matter where you’re located. Architecture The TrueNAS H-Series is a compact, 2U system with 12 drives and optional expansion to 114 drives with 2.5 PB of capacity. Each system can be configured for scalable Hybrid capacity, or affordable All-Flash performance. The H-Series is designed for industry-leading Total Cost of Ownership (TCO) with <300W typical power consumption. Pricing is all-inclusive of TrueNAS Enterprise software. The optional TrueCommand service (licensed separately) can be used to manage single or multiple TrueNAS systems. Models H10 H20 H30 Dimensions 26.8” x 19” x 3.5” | 681 x 483 x 89 mm Dual Controllers Optional DRAM Per Controller 64 GB - 128 GB 128 GB - 256 GB 256 GB Onboard Networking 4x 1G Base-T 4x 1G Base-T2x 10G Base-T Additional Networking (Optional) Up to 4x 10/25 GbE (SFP28) Up to 4x 10/25 GbE (SFP28) or 2x 10/25 GbE (SFP28) and 2x 40/100 GbE (QSFP28) Up to 4x 10/25 GbE or 2x 10/25 GbE + 2x 40/100 GbE Max Drives Supported 72 114 114 Max Expansion Shelves 1x ES24 or ES60 1x ES24, ES60, or ES102 1x ES24, ES60, or ES102 Max Throughput 2 GByte/s 4 GByte/s 8 GByte/s Hybrid Storage (HDD + Flash) Max Capacity 1.5 PB 2.5 PB 2.5 PB Max Effective Capacity* 3 PB 5 PB 5 PB Write Cache NVMe SSD NVMe SSD 2x NVMe SSD Max Read Cache 3.2 TB NVMe SSD 2x 3.2 TB NVMe SSD 2x 6.4 TB NVMe SSD All-NVMe Flash Max Capacity 180 TB 360 TB 720 TB Max Effective Capacity* 360 TB 720 TB 1.5 PB All Models Performance Varies based on configuration.Contact Us. Pricing Guidance Starting at under $8,500 with single controller and 1 Year Bronze Support Guidance of approximately $60/TB for Hard Drive capacity and approximately $350/TB for Flash Capacity. Prices vary based on configuration. Datasheets H-Series Datasheet,var option_df_96421 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2025\/01\/TrueNAS_H-Series_Data_Sheet_January_2025.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} TrueNAS Expansion Shelf Datasheetvar option_df_70147 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/10\/Expansion_Shelf_Data_Sheet_October_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} * Maximum effective capacity assumes typical data reduction through compression and deduplication. .empty-cell{ background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !important; } .head-cell{ background-color: #00597F !important; text-align: center; border: none