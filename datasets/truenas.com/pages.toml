["https://www.truenas.com/case-studies/firstlink"]
title = "Firstlink Case Study - TrueNAS - Welcome to the Open Storage Era"
description = "Firstlink Technology uses TrueNAS to keep event data protected, safe and secure."
full_description = '''FREENAS® AND TRUENAS® BEHIND THE SCENES ON THE PGA TOUR Denver, Coloradohttp://www.firstlink.com/High-tech Download as PDF Benefits FreeNAS Mini XL offers powerful file sharing with autocaching in a small form factor Onsite data can be archived to Firstlink’s TrueNAS to protect against data loss 18TB of redundant storage in a convenient form factor at a reasonable price via the FreeNAS Mini XL THE STORAGE CHALLENGE Firstlink Technology is an IT service company specializing in creating web-based services for clients with diverse needs. Able to handle everything from search engine optimization (SEO) to website development and cloud hosting, the company offers online application development and infrastructure recommendations to their diverse clientele. Firstlink can also host its customers’ websites and online services in its own cloud-based infrastructure. As a hosting company, data uptime and storage availability are essential for normal business operation.Several years ago the company began working with the ZFS file system and building out their own storage using commodity hardware. Through customer references, they learned that they could get the same scalable, secure ZFS file system from iXsystems in a pre-tested, proven platform that was feature-rich and simple to use. The company has since purchased two TrueNAS systems with over 200 TB of storage capacity. FIRSTLINK TECHNOLOGY Firstlink was tasked with building out an inexpensive content management system for the Sanford International Golf Tournament PGA Tour. The system needed to easily share, protect, and sync media from the event without breaking the bank.Already familiar with iXsystems and their world-class level of support and flexibility, CEO Jeff Luinstra reached out to iXsystems to help set up a solution that met their customer’s needs and seamlessly synchronized with his existing TrueNAS infrastructure to guarantee against data loss or corruption. The golf tournament used two workstations and a series of Chromebooks to capture and edit media, and then organize it for broadcast and archiving. Firstlink chose to use a FreeNAS Mini XL with 18TB of usable capacity that supported the SMB and NFS protocols to store and share data between the various clients accessing the system. Firstlink created a custom script to automatically backup photos and videos to the FreeNAS Mini XL. The backup data was then replicated to Firstlink’s TrueNAS infrastructure, creating a robust data redundancy system across multiple locations at a fraction of the cost of a 100% cloudbased storage solution. The Sanford International Golf Tournament plans to continue to use the FreeNAS Mini XL and the replication architecture mapped out by Firstlink for the next five years. Due to its portability, the system can be deployed along with the other laptops and equipment when needed, allowing every team member to browse and sort content based on their needs. Mr. Luinstra is getting good mileage out of both his TrueNAS system and the FreeNAS Mini XL used at the golf tournament. He is considering the purchase of a few more systems to act as office file sharing and backups around his own office. The flexible architecture, performance, ability to sync with TrueNAS, and entry-level price points make the FreeNAS Mini product line a perfect small-office NAS that can do it all. Requirements Flexible storage in a portable form factor that can be quickly deployed Easily sync with backend to protect against data loss System needs to meet a limited budget (function ($) { $(document).ready(function () { // Option #1: Move Divi Module(s) into a Module // Limit: One Instance per Column // Use following code if you want to move // a module inside another module. Each column with the // class 'parent-column' will append any module(s) // with the class 'divi-portable-module' to the div // with the class 'divi-module-destination'. // Only one instance of 'divi-module-destination' should // be added per column. $('.divi-portable-module').each(function () { $(this).closest('.parent-column').find('.divi-module-destination').append($(this)); }); // Buttons: Insert Button Module(s) into a Module // Adding a custom CSS class to a button module // is applied to the 'a' tag which is a child element // of the module wrapper. This code makes sure to append // the entire button module wrapper (the parent element) // as well. This functionality is the same as option #3 above. // Siimply use the class 'divi-portable-button' on a button module // instead of 'divi-portable-module'. $('.divi-portable-button').parent().each(function () { $(this).closest('.parent-column').find('.divi-module-destination').append($(this)); }); // Option #2: Move Divi Row(s) into a Module // Limit: One Instance per Section // Use the following code if you want to move // a row inside a module on more than one section // of a page. Each section with the // class 'parent-section' will append any row(s) // with the class 'divi-portable-row' to the div // with the class 'divi-row-destination'. // Only one instance of 'divi-row-destination' should // be added per section. $('.divi-portable-row').each(function () { $(this).closest('.parent-section').find('.divi-row-destination').append($(this)); }); }); })(jQuery); Requirements Scalable infrastructure to grow from 200 TB to over 4.5 PB Protect over Millions of videos and audio files Ensure public availability of data while keeping systems secure THE STORAGE CHALLENGE The JFK Library Foundation has a long term plan to digitize and store millions of documents and large amounts of videos, film, and audio recordings. Not only is the material vast, but it is also diverse, with files being copied to the storage system from a variety of sources in numerous file types and sizes. The library required a high-end NAS system capable of sharing with a variety of systems as the digitization process is completed. Performance aside, the platform had to be accessible to various thirdparty platforms, while maintaining data integrity. The storage had to be capable of being managed independently from any digital asset management software, so that the library’s independent services could easily access the data. Admins, users, and staff all require varying levels of access to the storage infrastructure to ensure against data loss from theft or human error. Data itself then needed to be incredibly secure, so that high resolution, uncompressed media can remain error-free from the time it is stored. “I’m just very happy with the architecture, flexibility, price point, and overall performance of the product.” Jeff Luinstra, CEO Firstlink Technology Find Out How TrueNAS Can Help Your Business Talk to Us Read more successful stories Clockwork 9 University College of London JFK Presidential Library and Museum University College of Londonvar option_df_1366 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2020\/07\/UCL_Case_Study_WEB.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} ixhsOptionsQt = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": true, "name": "form_model", "value": "null"}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "Firstlink Case Study"} ], "popUp": true, "popUpTriggerClass": ".quote-pop-up", "popUpElementClass": ".ixhs-pop-up-quote", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "96f32797-3cb6-4da6-8b80-06f34e02958c", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsQt); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsQt); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixh