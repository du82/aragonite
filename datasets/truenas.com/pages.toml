title = "File Sharing - TrueNAS - Welcome to the Open Storage Era"
description = "TrueNAS File Sharing: Secure, scalable, and cost-efficient data sharing between diverse operating systems with robust protection"
full_description = 'File Sharing Overview Use Cases Resources Management Get Pricing .getPricing{ background-color:#FFF; text-transform:uppercase; color:#0095D5 !important; } .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Share Your Data Between Any Operating Systems TrueNAS makes it convenient for organizations of all sizes to collaborate and supports a variety of file sharing protocols including SMB (CIFS), NFS, iSCSI, SSH, rsync and FTP/TFTP on any platform. Whether your clients are running Windows, Apple (MacOS), or Linux, TrueNAS is OS agnostic and can be set up to work with any operating system. TrueNAS is easy to deploy and serves in a wide range of file sharing needs, from personal use to enterprise requirements. This includes workflows needing backups, cloud, replication, and general file-sharing. Shares and datasets can be snapshotted and replicated to other TrueNAS Systems, maintaining all of their properties and giving you a Disaster Recovery option in the event of a failure or ransomware attack. All TrueNAS Systems are built on OpenZFS, giving you the most secure and resilient file system available today in enterprise data protection. Get a Quote Collaborate and Share Conveniently share between any system – regardless of which operating system your client computers use. Data Protection and Security TrueNAS Appliances protect your data against ransomware with many unique features like immutable snapshots, allowing you to quickly recover and keep your business running. Future-Proof Scaling OpenZFS is a future-proof file system designed for decades of continuous use and unlimited data scalability. Powerful Features and Exceptional Value Data Storage Simplified TrueNAS simplifies sharing data by providing universal storage, and supporting block, file and object access. Every common operating system, hypervisor, and application are supported. Instead of creating storage silos for your various applications, you can use one TrueNAS storage array to manage your data and scale up or out as your needs grow. Powerful Protection at Scale TrueNAS protects your data in many unique ways with features like High Availability (HA), Unlimited Snapshots, OpenZFS checksumming and bit rot protection, Replication, Native Backup Integration with 3rd Parties, and up to triple-parity RAIDZ3 protection. This gives confidence that your data is protected at every level. Encrypt at the hardware level, zpool level, and even data set level. Open Source Economics We believe that cost and sustainability is key when choosing the right storage solution. That’s why at iXsystems, we build and support our storage and servers right here in the USA. With no vendor lock-in, license fees, or planned obsolescence, you can rest assured that TrueNAS appliances start lower in cost and continue creating value throughout and after their lifecycle. Trusted By the Majority of the Fortune 500 View our Clients “If you’re considering an upgrade…ESG recommends that you consider the iXsystems TrueNAS storage platform with cloud extensibility, deep management analytics, and up to twice the performance at half the cost of the competition.” -Enterprise Strategy Group (ESG) Read the Report Resources var option_df_71833 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2022\/05\/iostudio_Case_Study_2022.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} var option_df_1366 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2020\/07\/UCL_Case_Study_WEB.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} var option_df_74183 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2022\/05\/Firstlink_Case_Study_2022.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Ho