rise Overview TrueNAS Enterprise Quick Overview Enterprise Appliances and Support TrueNAS® Enterprise appliances combine the ultimate in data protection, performance, and efficiency of TrueNAS with enterprise-grade hardware, additional features, and around-the-clock support. With flexible choices including high-availability and all-flash configurations, TrueNAS Enterprise appliances integrate into any environment and take guesswork and worry out of storage and data management. The Ultimate Data Protection TrueNAS Enterprise delivers integrated data protection features including copy-on-write and data integrity checks to prevent corruption. Built-in RAID protection, unlimited snapshots, self healing media management, and resilient replication protect your data and facilitate recovery in the face of hardware failure or ransomware attacks. Storage optimization features like advanced compression, caching, and thin/thick provisioning both maximize storage efficiency and accelerate performance. Incorporating the powerful OpenZFS file system, TrueNAS Enterprise has best in class data protection and security. True Data Freedom Free your data and your budget from proprietary systems and costly vendor lock-in. With our all-inclusive licensing model, you pay one price for all the features with no hidden fees to drive up costs. Available in all-flash or hybrid disk/flash configurations to meet any performance or capacity need, TrueNAS can be deployed as both a NAS and a SAN and supports block, file, and object protocols. Flexible & Future-Proof Whether you need a compact system for a remote office or a high-performance, rack-scale solution, there is a TrueNAS Enterprise system to fit your needs. Grow a system from a few terabytes to over twenty five petabytes on a single head unit. Scalable performance can be tuned to fit the specific needs of your workload or application. Easily integrate TrueNAS into any environment with built-in support for all major hypervisors and cloud backup services. TrueNAS Enterprise is flexible storage that adapts to your ever-changing infrastructure requirements. When Downtime is Not an Option When your business can’t afford to go offline, a TrueNAS system with high availability has your back. Redundant controllers and full redundancy of all active components provide simple serviceability and maximize uptime for mission-critical environments. In the unlikely event that a failover occurs, all services automatically proceed on the second controller for uninterrupted access. Award-Winning Support Every TrueNAS Enterprise system is fully backed by our world-class support team, celebrated for their excellence and highly rated by clients on Gartner Peer Insights™. Our Bronze, Silver, and Gold support packages are further reinforced by a global spares network, ensuring you stay up and running no matter where you’re located. Systems TrueNAS F-Series Ultra-Performance & High-Density NVMe Flash Storage Designed for maximum performance and high-density applications, the F-Series is our fastest storage available. With built-in high-availability and NVMe SSDs for the fastest possible throughput, the TrueNAS F-Series safeguards data for mission-critical operations while keeping data operations moving as fast as possible. Learn More TrueNAS M-Series Performance & Capacity Storage Powered by the Latest Technology When you need to balance performance, capacity, and reliability, look no further than the TrueNAS M-Series. Backed by NVDIMM and NVMe technology, the M-Series is capable of bandwidth up to 10 GB/s and can grow beyond 20 PB in a single rack, enough to support over 10,000 VMs. Learn More TrueNAS H-Series Reliable, Efficient, Hybrid Storage with HA & NVMe Versatility Designed for small and medium businesses, the H-Series offers optional dual controllers, hybrid or all-flash configurations, NVMe support in every bay for low-latency workloads, and unified file, block, and object storage across three models: H10, H20, and H30. Delivering speeds up to 8 GB/s and scaling up to 2.5 PB of raw capacity, the entry-level H-Series ensures maximum uptime while providing the lowest Total Cost of Ownership (TCO). Learn More TrueNAS R-Series Configurable Value-Oriented Storage Lineup The TrueNAS R-Series offers a selection of flexible configurations designed for various applications and use cases. Available in both all-flash and hybrid models, these single controller appliances provide excellent storage density and performance. The TrueNAS R-Series can be installed with TrueNAS CORE, Enterprise, or SCALE. Learn More TrueNAS Enterprise: Features .empty-cell { background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !important; } .head-cell { background-color: #00597f !important; text-align: center; border: none !important; } .heading-cell { background-color: #00597f !important; color: #fff !important; border: none !important; } .Hybrid_dark { background-color: #0095d5 !important; color: #fff !important; text-align: center; } .Hybrid_yellow { background-color: #ffff00 !important; color: #666 !important; text-align: center; } .Hybrid_dark { background-color: #0095d5 !important; color: #fff !important; text-align: center; } .Dark-gray th { background-color: #666666 !important; color: #fff !important; border: 0; } .Hybrid_light th { background-color: #0095d5 !important; color: #fff !important; } .Hybrid_light td { background-color: #ebf7fc !important; } tr.Hybrid_light:nth-of-type(2n) { background-color: #31beec !important; /*color:#FFF !important; */ } .Flash_dark th { background-color: #71bf44; color: #fff !important; text-align: center; } .Flash_dark td { background-color: rgba(165, 206, 61, 0.2) !important; text-align: center; } tr.Flash_light { background-color: rgba(165, 206, 61, 0.56) !important; } tr.Flash_light:nth-of-type(2n) { background-color: #a5ce3c !important; } .all_models { background-color: #cccccc; t