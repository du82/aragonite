["https://www.truenas.com/blog/truenas-fangtooth-25-04-beta"]
title = "Fangtooth Unification Begins"
description = "TrueNAS 25.04 “Fangtooth” BETA is available. It brings major VM and LXC improvements, more flexible App networking, and Fibre Channel for Enterprise."
full_description = "The incredibly popular TrueNAS 24.10 release was used as the foundation for Fangtooth development. The latest release, TrueNAS 24.10.2, brings the integrated Docker support and significantly improved performance over TrueNAS 13.0 to a level where it is recommended for (and used by) the majority of the TrueNAS Community, with over 100,000 systems in operation today. Fangtooth unifies CORE and SCALE and introduces a number of new features to TrueNAS to improve performance, security, and scalability for users, including: For further details, see the Fangtooth introduction blog, the OpenZFS 2.3 feature highlights, and TrueNAS release notes on our Docs website. Existing TrueCommand users should refrain from upgrading to the Fangtooth BETA at this time, as the current release of TrueCommand 3.0.2 does not yet support this. The upcoming TrueCommand 3.1 will add the ability to manage 25.04 systems, in addition to retaining backwards compatibility with other versions. TrueNAS Enterprise appliances running 25.04 will also receive improved security and performance features designed for more intense Enterprise workloads: For more information about these features and other Enterprise benefits, including up to 24×7 support, connect with a TrueNAS product specialist to discuss available options. In addition to the robust Apps catalog powered by Docker Compose, the BETA release of Fangtooth leverages the Incus manager to offer both lightweight Linux containers and powerful KVM virtualization in the same management interface. Containers, like the Jails functionality offered in TrueNAS CORE, offer lightweight, efficient virtualization by sharing the host OS kernel, providing faster startup times and reduced resource usage compared to full virtual machines. When stronger isolation, kernel independence, or a different guest operating system entirely is desired, a VM can be deployed and configured. This functionality is still under significant development in 25.04-BETA, and is suggested for early adopters who are comfortable with this emerging feature."
