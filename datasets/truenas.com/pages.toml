 { flex: 100%; } } TrueNAS SCALE Overview Open Storage that Scales TrueNAS® SCALE is an Open Source Infrastructure solution. In addition to powerful scale-out storage capabilities, SCALE adds Linux Containers and VMs (KVM) so your organization can run workloads closer to data. Scale-Up or Scale-Out OpenZFS with its excellent data management capabilities is the basis for all deployments. Scale-up by adding drives, or deploy scale-out object storage by adding multiple systems to a cluster. Deploy a single host in your home/office, or group nodes together for a highly scalable and highly available software-defined infrastructure. Go Beyond Storage TrueNAS SCALE allows you to easily customize and expand functionality with a variety of free Apps, like Plex Media Server, NextCloud, Prometheus, Elastic Search, Emby, and many others. It also provides simple access to the well-established Linux container ecosystem, with support for KVM virtual machines, Kubernetes, and Docker containers. Join Millions in the TrueNAS Community With a global community of testers and contributors, the TrueNAS Open Source development model enables broader testing, and ultimately, a higher quality product, in addition to its unbeaten value. Join the “Storage Freedom” movement and enjoy the benefits of Open Source economics. Manage Storage Clusters and Fleets Cluster many systems together with SCALE and manage them all with TrueCommand. TrueCommand makes it easy to monitor and administer all of your systems from a single, easy-to-use dashboard. Appliances & Support for Important Workloads If your data is critical or you simply need professional support, TrueNAS Enterprise and the full line of TrueNAS storage appliances provide enhanced features and the around-the-clock support necessary to keep your storage online. TrueNAS SCALE Features .empty-cell{ background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !importan