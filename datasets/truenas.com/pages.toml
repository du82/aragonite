["https://www.truenas.com/blog/truenas-h30-announce"]
title = "The TrueNAS H30 is the Swiss Army Knife of Storage"
description = "The TrueNAS H30 is the high versatility and performance Edge storage system."
full_description = "Today, we’re capping off our TrueNAS H-series platform line with the upgraded TrueNAS H30. With support for 60 TB NVMe drives in each of its twelve bays and 100 GbE connectivity, the H30 delivers new levels of performance and capacity in the compact 2U storage market. Powered by the newly released (TrueNAS 24.10.2) “Electric Eel” software and under active testing with the new TrueNAS 25.04 “Fangtooth” software, the H30 navigates effortlessly through a variety of enterprise workloads, from the edge of the cloud to the heart of your datacenter. Like its H10 and H20 siblings, the H30 is a compact, low-power 2U platform designed for Edge workloads. With tri-mode technology to enable NVMe SSDs or SAS HDDs in each of its 12 bays, the H30 offers incredible advances in efficiency over previous-generation hardware, increasing performance and capacity by over 300% All H-Series systems can be configured as either single controller or dual controller High Availability (HA) and offer expansion up to 114 drive bays in a 6U footprint. Upgrades from H10 and H20 to H30 can be done without data migration, and without downtime in HA systems. With network connectivity options from 1 Gbps through to 100 Gbps, the H30 is ready to be integrated into any network.. TrueNAS 24.10 delivers File, Block, Object, and Docker Apps services with HA using the highly reliable OpenZFS 2.3 as the unifying file system. 24.10 is now the most widely installed version of TrueNAS, with over 100,000 adopters in less than three months. The new TrueNAS H30 inherits all of the robust Electric Eel capabilities, including TrueSecure, with its federal FIPS 140 capabilities. All TrueNAS platforms come with industry-leading Enterprise support, which is one of the highest rated on Gartner Peer Insights. TrueNAS Fangtooth is preparing to enter its BETA release, adding several new capabilities to the TrueNAS H30 including: Apps, Containers, and VMs enable TrueNAS storage systems to add new services, software. These can include MinIO, Nextcloud, backup software, and data migration tools like SyncThing. Integrating applications and storage reduces the cost, power, complexity, and space for Edge deployments like retail storefronts, and allow workloads with heavy IO demands to run directly adjacent to high-performance storage."
