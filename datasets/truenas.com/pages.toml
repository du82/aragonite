["https://www.truenas.com/software-status"]
title = "Software Status - TrueNAS Roadmap - Open Source NAS Software"
description = "Get up-to-date insight on the TrueNAS roadmap. Explore the TrueNAS project timeline and stay informed with the latest updates."
full_description = 'Software Status Which Version of TrueNAS Should I Choose? TrueNAS has several Editions: CORE, Enterprise, and Community Edition (formerly SCALE). To choose the right Edition, refer to the Editions Comparison overview. Keep in mind that both CORE & Enterprise 13.0 users can migrate to the newer TrueNAS 24.x releases if and when they want to take advantage of its unique features. Once the right edition is selected, new and existing TrueNAS users must then decide which version is most appropriate and when to update. TrueNAS can be used in many ways, and choosing which version of TrueNAS to use is often a tradeoff between the desire for new features and the need to reduce operational risk for given use cases. Whether you are a developer, an early adopter, a mission-critical user, or somewhere in between, the recommendations in the table below are updated regularly and can help you choose which version is best for you at any point in time. User Type Developer N/A N/A Goldeye Nightly Tester N/A N/A 24.10.2 25.04-BETA1 Early Adopter N/A N/A 24.10.2 24.10.2 General 13.0-U6.7 13.0-U6.7 24.10.2 24.10.2 Conservative 13.0-U6.7 13.0-U6.7 24.04.2.5 24.10.1 Mission Critical Enterprise 13.0-U6.7 24.04.2.5 Enterprise Recommendations are based on User Type and their expectations for software quality. Each user gets to decide on whether they want the latest features, the highest maturity, or something in between. User Type Expectations Developer Latest software with new features and bugs alike. There is an opportunity to contribute directly to thedevelopment process. Tester New software with recent features. Some bugs are expected and there is a willingness to provide bugreports and feedback to the developers. Early Adopter Released software with new features. Data is protected, but some issues may need workarounds orpatience. General Field tested software with mature features. Few issues are expected. Conservative Mature software with well documented limitations. Software updates are infrequent. Mission Critical Mature software that enables 24 x 7 operations with high availability for a very clearly defined usecase. Software updates are very infrequent and based on need. In all cases for systems with a TrueNAS support contract from iX, we recommend contacting iX Support prior to updating to the latest 13.0 version or migrating to TrueNAS 24.x. Our Support team can provide advice based on your unique requirements and be there to help you resolve any unexpected issues. We recommend that you bookmark this page, and/or refer back to it anytime you consider upgrading TrueNAS to monitor the latest release statuses. You can expect that the latest version of software may be recommended for general use but will not be recommended for conservative or mission critical environments until a few weeks or months post-release once it has received further testing in more complex environments. .empty-cell { background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !important; } .head-cell { background-color: #00597f !important; text-align: center; border: none !important; } th, .heading-cell { background-color: #00597f !important; color: #fff !important; border: none !important; } .Hybrid_dark { background-color: #00597f; color: #fff !important; text-align: center; } tr.Hybrid_light { background-color: rgba(49, 191, 236, 0.62) !important; } tr.Hybrid_light:nth-of-type(2n) { background-color: #31beec !important; /*color:#FFF !important; */ } .Flash_dark { background-color: #71bf44; color: #fff !important; text-align: center; } tr.Flash_light { background-color: rgba(165, 206, 61, 0.56) !important; } tr.Flash_light:nth-of-type(2n) { background-color: #a5ce3c !important; } .all_models { background-color: #cccccc; text-align: center; } table { background-color: transparent; border-collapse: collapse; } .dcf-table tbody, .dcf-table thead { font-size: 1em; } .dcf-tabl