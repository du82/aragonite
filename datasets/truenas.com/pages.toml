ption from the Version dropdown.See Software Releases to download releases or view upgrade paths, release schedules, and development timelines.Historical DocumentationThe TrueNAS team maintains this documentation and provide regular updates for current and in development (future) versions of TrueNAS software. For documentation purposes, current and future releases are those recommended by the TrueNAS Software Status page for one or more user type.Documentation for previous releases, that are no longer recommended for any user type, is archived and unmaintained.To view documentation for past versions of TrueNAS software products, visit the Documentation Archive.Additional ContentInterested in contributing to the TrueNAS projects or documentation or want to learn more about the technologies TrueNAS uses? See these additional content areas:Project ContributionsOverviewInterface TranslationsTrueNAS Issue ReportingDocumentation ChangesReference ContentTrueNAS SolutionsReference ArticlesConcepts and TerminologyZettabyte File System (ZFS) PrimerAccess Control List (ACL) PrimerAdditional LinksSecurity AdvisoriesDocs ArchiveRepositoryRSS FeedCopyrights and Trademarks'
