full_description = '''TrueNAS R-Series Powerful Single Controller Storage Experience unmatched value that deliversperformance, scalability, and enterprise data protection. Watch to Learn More Get In Touch Overview Models Datasheetvar option_df_69836 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/11\/TrueNAS_R_Series_Data_Sheet_November_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Resources Get In Touch .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Overview High-Density Unified Storage Appliances The TrueNAS® R-Series line of storage appliances combines the powerful features of OpenZFS with value-oriented, single controller hardware. Available in both all-flash and hybrid models, these systems feature excellent density and price-performance. The TrueNAS R-Series is available in three editions: CORE, Enterprise, and SCALE with Bronze and Silver support options available for Enterprise installations. Get More for Your Storage Budget The R-Series appliance line is designed for storage requirements that need to optimize for per-dollar performance and scalability. Whether used as a single NAS/SAN/object target, or as nodes in a scale-out cluster, the R-Series is versatile storage that maximizes value. Data Management: Simplified. Simplify your data management with powerful features including data protection, snapshots, replication, scrubbing, data reduction, and security. Integrated enclosure management capabilities save time and effort by making it easy to monitor the state of your drives from a single screen. Proven Data Protection Built on the self-healing OpenZFS file system, the TrueNAS R-Series features powerful data protection tools like copy-on-write and automatic bit-rot detection to prevent corruption. Built-in RAID protection, unlimited snapshots, and resilient replication protect your data and make it easy to restore data in the event of hardware failures or malware attacks. One System – Multiple Purposes The TrueNAS R-Series appliances can serve more than just traditional file and block storage workloads. Connect multiple systems together to form a scale-out object repository, with optional immutability to enhance data protection. Run demanding, data-driven Apps directly on the R-Series itself for maximum storage performance. Flexible Integration With support for most major virtualization hypervisors and cloud sync services, as well as a fully-featured API for hands-off management, TrueNAS seamlessly integrates with your infrastructure, letting you stay focused on driving your business needs forward. Models .empty-cell{ background-color: transparent !important; border: none !important; } tr:has(> th.empty-cell) { border: none !important; border-bottom: none !important; } .head-cell{ background-color: #00597F !important; text-align: center; border: none !important; } .heading-cell{ background-color: #00597F !important; color:#FFF !important; border: none !important; } .first_first{ background-color: #0784ba; color:#FFFFFF !important; } .first_flash{ background-color:#71BF44; color:#FFFFFF !important; } .first_hybrid{ background-color:#00597F; color:#FFFFFF !important; } .second_first{ background-color:#1ca4de; color:#FFFFFF !important; } .second_flash{ background-color:rgba(165,206,61,0.56); } .second_hybrid{ background-color:rgba(49,191,236,0.62); } .third_first{ background-color:#89c6e2; color:#FFFFFF !important; } .third_flash{ background-color:#A5CE3C; } .third_hybrid{ background-color:#31BEEC; } .Hybrid_dark{ background-color: #00597F; color:#FFF !important; } tr.Hybrid_light{ background-color: rgba(49,191,236,0.62) !important; } tr.Hybrid_light:nth-of-type(2n){ background-color: #31BEEC !important; /*color:#FFF !important; */ } .Flash_dark{ background-color: #71BF44; color:#FFF !important; } tr.Flash_light{ background-color: rgba(165,206,61,0.56) !important; } tr.Flash_light:nth-of-type(2n){ background-color: #A5CE3C !important; } table { background-color: transparent ; border-collapse: collapse; } .dcf-table tbody, .dcf-table thead { font-size: 1em } .dcf-