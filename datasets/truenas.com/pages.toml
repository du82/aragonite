title = "TrueNAS Delivers Record Growth in 2024, Plans Strategic Expansions in 2025 - TrueNAS - Welcome to the Open Storage Era"
description = "Campbell, CA – February 4, 2025 – TrueNAS, the global leader in open enterprise storage, has announced another year of record-breaking growth in 2024,"
full_description = "Campbell, CA – February 4, 2025 – TrueNAS, the global leader in open enterprise storage, has announced another year of record-breaking growth in 2024, cementing its position as the world’s most widely used storage software. Leveraging its position as a trusted storage solution, TrueNAS is addressing the industry’s most pressing challenges, from data security to cloud cost management. With over 40% CAGR since 2021, TrueNAS recorded an all-time revenue high, driven by the following growth highlights: “TrueNAS is redefining what’s possible in open storage by delivering enterprise-grade reliability and security at a fraction of the cost of traditional vendors,” said Brett Davis, EVP, TrueNAS. “With our focus on customer needs and service, we’re uniquely positioned to help organizations address data growth and budget challenges.” “Organizations are navigating a perfect storm of data growth, cost pressures, and security threats,” added Davis. “TrueNAS is here to help them face these challenges head-on by delivering solutions that combine technical innovation with economic value.” TrueNAS is the world’s most trusted open storage platform, relied on by millions of users and a majority of Fortune 500™ companies. Powered by the acclaimed OpenZFS file system, TrueNAS delivers scalable, unified storage with unmatched reliability and performance. TrueNAS Enterprise combines data center grade hardware and professional support to meet the demands of enterprise users, providing cost-effective, modern data storage solutions."
