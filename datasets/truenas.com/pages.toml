full_description = 'The Company Behind World’s Most Deployed NAS Software Over 15,000,000 Downloads Over 1M Community Members About iX and TrueNAS Our Brand Promise = True Data Freedom iX is an Open Source pioneer and the company behind TrueNAS®, the world’s most deployed storage software. Relied upon by millions in over 140 countries, TrueNAS is an award-winning universal data platform used by a majority of Fortune 500 companies. It helps organizations modernize how they store and protect data by leveraging open storage to simplify operations and drastically reduce cost. The platform harnesses the power of the legendary ZFS file system to provide scale-up or scale-out unified storage with the reliability and performance demanded by virtualization, backup, and many other data-heavy workloads. Thousands of organizations have chosen TrueNAS® Enterprise systems and support from iX, rating it 4.9/5 and a Customer’s Choice on Gartner Peer Insights™. Founded in Silicon Valley in 2002, iXsystems is a profitable self-funded company with no outside investors. This independence allows the company to focus solely on making users and customers successful, offering an alternative to traditional commercial storage systems that are proprietary, restrictive, and overpriced. Contact Us OUR COMPANY REVIEWS Find out why our customers give us 5-star reviews. OUR CLIENTS Meet our devoted customers who have experienced our white glove customer experience. AWARDS We are always honored to be recognized for the work we do. Check out our trophy wall. NEWSROOM Read more about us, our products, and our accolades. OUR TEAM Meet the team leaders who are leading the way to True Data Freedom. CAREERS Are you ready to become an iXian and revolutionize the enterprise storage industry? Explore our open positions and join our team! OUR HISTORY We are a bootstrapped company and dedicated open source pioneers. CONTACT US Do you have questions or want more information? Let us know and we’ll be glad to help. Our Business Read 2022 Results OUR CORE VALUES THINK PEOPLEBEFORE PROFIT ULTRA-COLLABORATIVE OPEN SOURCE TRAILBLAZERS BOOTSTRAPPED MINDSET PURSUE KAIZEN Contact Us ixhsOptionsQt = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": true, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "ixsystems.com"}, {"enabled": true, "name": "form_location", "value": "About Us Page"}, {"enabled": false, "name": "form_use_case", "value": ""} ], "popUp": true, "popUpTriggerClass": ".about_us-pop-up", "popUpElementClass": ".ixhs-pop-up-box-quote", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "d0fb33ca-5061-493e-86da-586c476cff3f", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsQt); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsQt); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixhsOptionsQt); } }); var iXpageVersion = "1";'
