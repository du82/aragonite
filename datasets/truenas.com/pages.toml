_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } S3-Compatible Cloud Storage Globally distributed storage is a world-wide network of thousands of storage nodes. This modern architecture provides global performance, cost savings, and redundancy that rivals any public cloud. iX-Storj provides S3-Compatible cloud storage at $4/TB per month and a starter package at $150 per year for 5 Terabytes, an unbeatable value. Like ZFS in TrueNAS, iX-Storj is inherently secure with CloudSync 256-bit encryption for both data-at-rest and data-in-flight. Most importantly, encryption keys are controlled by the TrueNAS administrator and no one else. Sign Up & Log in - iX-Storj 80%+ Lower Cost Pro pricing on iX-Storj is $4 per TB per month compared with single-region AWS S3 at $25 per TB per month. For the same price, store 5x more data. Double the Bandwidth Leverages the aggregated bandwidth of globally distributed storage, with performance typically more than double that of AWS S3. 11 Nines of Durability Extremely high durability suitable for offsite backup and long-term archival. Equivalent to storing a PetaByte for 1,000 years with <1 object lost. Built-In to TrueNAS All editions of TrueNAS have the iX-Storj service built-in and are ready to be configured with an iX-Storj account. Take your TrueNAS Global Fast & Easy Offsite Backup TrueNAS is great for protecting data and backups onsite. Storing important data offsite is also vital in your strategy to recover from a data disaster. Given its decentralized network, iX-Storj cloud storage is easy to configure and delivers incredible performance for hot backups with high multi-region availability. Exceptional Data Security Every object is end-to-end encrypted to ensure that only authorized users have access to the data. Data is broken into erasure-coded pieces and distributed globally where all file segments and metadata are separately encrypted so only you know what is stored. You control the encryption keys. No one can access your files or metadata—ever. Optimized for Media TrueNAS is top-rated for media creation workflows, and iX-Storj cloud is perfectly designed to host large multimedia files. The distributed global network enables incredibly fast performance and allowing collaboration and sharing across studios. Achieve top-tier efficiency at an affordable price with iX-Storj cloud storage. Cost-Effective Storage Scaling Pay only $4/TB a month for capacity on iX-Storj, 80%+ lower cost than large-scale clouds. TrueNAS users can opt for iX-Storj Starter – 5TB of cloud storage for only $150/year (A $275 Value). TrueNAS SCALE as “Storj Nodes” In addition to the unbeatable savings TrueNAS users get with iX-Storj, they can even recuperate some of the costs of using the service by configuring TrueNAS SCALE systems as “Storj Nodes”. By allocating unused storage capacity and participating as a provider to Storj cloud storage, providers can earn on the network. 5 TB of Cloud Storage/ 1 Year TrueNAS is Trusted By the Majority of the Fortune 500 View our Clients Resources How Can We Help? Contact Us ixhsOptionsQt = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "Virtualization"} ], "popUp": true, "popUpTriggerClass": ".quote-pop-up", "popUpElementClass": ".ixhs-pop-up-quote", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "f71e6c91-e849-4ff6-afdd-054c32a54b31", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsQt); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsQt); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixhsOptionsQt); } }); ixhsOptionsEx = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "ix Storj"} ], "popUp": true, "popUpTriggerClass": ".expert-pop-up", "popUpElementClass": ".ixhs-pop-up-expert", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "a22c0f41-7467-47c5-bb42-1059479400ef", onFormReady: function($