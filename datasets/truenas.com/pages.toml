full_description = 'Data Backup and Archival Overview Use Cases Our Clients Resources Management Get Pricing .getPricing{ background-color:#FFF; text-transform:uppercase; color:#0095D5 !important; } .sticky { position: -webkit-sticky; position: sticky !important; top: 85px; padding: 50px; z-index: 999; } .et_pb_slider .et_pb_slide_0 { background-position: center; } .et_pb_main_blurb_image { min-height: 125px; } .overview .et_pb_blurb_container > h3:after { content: " "; display: block; width: 250px; height: 4px; background: #0095d5; margin: 0 auto 10px; } .dflip-books { text-align: center; } .dflip-resources { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } .dflip-resources * { max-width: 300px; margin-bottom: 0 !important; vertical-align: top; margin: 0 !important; } .heading_section h2 { padding-bottom: 0px; } .heading_section:after { content: " "; display: block; background-image: linear-gradient(270deg, #ffffff 0%, #0095d5 70%) !important; width: 100%; height: 3px; margin: 0 auto 10px; } .sticky_column_flex { display: flex; flex-direction: row; justify-content: space-evenly; flex-wrap: wrap; } .sticky-menu-row a { display: inline-block; color: #fff; } .sticky-menu-row a:after { display: block; content: ""; border-bottom: solid 3px #fff; transform: scaleX(0); transition: transform 250ms ease-in-out; } .sticky-menu-row a:hover:after { transform: scaleX(1); } .sticky-menu-row a { min-width: fit-content; padding: 2px 10px 0px 10px; } .four-column-row .et_pb_main_blurb_image { margin-right: auto !important; margin-left: auto !important; } /* Min with 981px */ @media only screen and (min-width: 981px) { .four-column-row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1em; } } /* Max width 981px */ @media only screen and (max-width: 981px) { #ixhs-hp-video-pop-up-box-row { width: 90%; } } /* Min with 678px */ @media only screen and (max-width: 678px) { .four-column-row .et_pb_column { flex: 100%; } } Affordable Scalability TrueNAS® Enterprise appliances offer the perfect range of features and scalability to simplify operations and drastically reduce cost for data backup, disaster recovery, and archive. Whether you’re a small business, school, or enterprise, there is a TrueNAS resilient storage solution that fits. Compare Systems Get a Quote High-Speed Recovery Flexible interconnects from 1 to 100 GbE provide maximum bandwidth and simple integration via iSCSI, SMB or NFS into existing environments. Backup Flexibility TrueNAS simplifies storage in any backup software environment, integrating with CommVault, Nakivo, Veeam and many other backup software providers. Cost-Effective Scaling Grow a single system from 10 TB to 25 PB without purchasing additional controller nodes or expansion licenses. ZFS protection ensures you get capacity, speed, and redundancy. Trusted Archive OpenZFS provides long-term, secure retention of critical data. RAID-Z ensures pool protection and global spares. Unlimited snapshots make it easy to travel back in time and defeat ransomware. Back Up Any Data Replicate Data for Disaster Recovery Automatically archive or share datasets to another TrueNAS system with scheduled sync and replication. ZFS replication is based on periodic snapshots which can be taken at a chosen interval. The remote system can be quickly converted into an active system if the primary site or system is down. Veeam Ready Repository With multiple models certified as a Veeam Ready Repository for v12, TrueNAS provides top rated performance and affordability with no lock-in.With SMB, iSCSI, and Object support, TrueNAS can handle your toughest Veeam backup workloads quickly and efficiently. Built-in Cloud Storage TrueNAS is great for protecting data and backups onsite. Storing important data offsite is also vital in your strategy to recover from a data disaster. With its decentralized network, iX-Storj cloud storage is easy to configure and delivers incredible performance for backups with high multi-region availability. Use Any Cloud for Backup If you don’t have a second data center to back up to, TrueNAS includes the tools to back up your data to public or private clouds like Amazon S3, Azure, Backblaze B2, Box, and Google Cloud Storage. Pay for what you use with no upfront costs and no additional TrueNAS licenses. Trusted By Top Companies View our Clients “If you’re considering an upgrade…ESG recommends that you consider the iXsystems TrueNAS storage platform with cloud extensibility, deep management analytics, and up to twice the performance at half the cost of the competition.” -Enterprise Strategy Group (ESG) Read the Report Resources var option_df_87515 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/03\/Veeam_Backup_and_Replication_Solution_Brief_March_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} var option_df_71879 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2024\/03\/Large_Scale_Enterprise_Backups_With_TrueNAS_White_Paper_March_2024.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} var option_df_70148 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2023\/06\/Asigra_TrueNAS_Data_Sheet_June_2023.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} var option_df_71878 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.true