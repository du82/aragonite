ese requirements in order to lower their acquisition and operational costs. “ -Trevor Carlson, Vice President of Engineering, THUMBWAR Manage Workflows Modern broadcast operations face more than just the challenges of live multicamera ingestion and rapid production cycles; they must also prepare and deliver content to a multitude of distribution partners, oftentimes reaching a global audience. Managing and maintaining complex workflows, whether mobile or in-studio, can be particularly challenging given the need for flexibility and unpredictable situational demands. Enabling multiple points of ingest, diverse real time collaborators and distribution platforms requires a resilient enterprise storage platform that not only exceeds the storage performance demands, but does so while easily and economically scaling to meet exploding capacity requirements. Broadcast Workflow TrueNAS Enterprise Delivers Mission Critical Capabilities Capture It All Broadcast requires mobile and studio capable solutions for scaling storage. Mobile trucks require compact solutions that deliver extreme performance with minimal consumption of power, weight and space. As capacity requirements grow, easily adding additional storage for on the go or in the studio is a must have. TrueNAS Enterprise streamlines the ability to adapt to the range of operating requirements in every environment. Digital Hub Inbound content from raw data feeds and freshly ingested material requires the utmost in data integrity. TrueNAS Enterprise, built on ZFS, provides best in class resilience against data corruption. Furthermore, TrueNAS supports containerized applications directly on the system to rapidly transfer critical assets to archival storage and downstream delivery. Collaboration Editors and Decision Makers need to smoothly engage across a variety of live and existing assets. TrueNAS Enterprise, leveraging high performance ZFS Cache, has been tuned to exceed the performance demands of broadcast workflows to enable real time collaboration and accelerate time to broadcast. var option_df_71836 = {"outline":[],"forceFit":"true","autoEnableOutline":"false","autoEnableThumbnail":"false","overwritePDFOutline":"false","direction":"1","pageSize":"0","source":"https:\/\/www.truenas.com\/wp-content\/uploads\/2022\/05\/Star_Studio_Childrens_Hospitals_Case_Study_2022.pdf","wpOptions":"true"}; if(window.DFLIP && DFLIP.parseBooks){DFLIP.parseBooks();} Let’s Deliver Together See how TrueNAS can help your workflow! Get In Touch ixhsOptionsQt = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "Broadcasting"} ], "popUp": true, "popUpTriggerClass": ".quote-pop-up", "popUpElementClass": ".ixhs-pop-up-quote", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "f71e6c91-e849-4ff6-afdd-054c32a54b31", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsQt); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptionsQt); }, onFormSubmitted: function($form) { ixtegrateFormOnSubmitted($form, ixhsOptionsQt); } }); ixhsOptionsEx = { "includeUTM": true, "includeExtras": true, "extras": [ {"enabled": false, "name": "form_model", "value": ""}, {"enabled": true, "name": "form_domain", "value": "truenas.com"}, {"enabled": true, "name": "form_location", "value": "null"}, {"enabled": true, "name": "form_use_case", "value": "Broadcasting"} ], "popUp": true, "popUpTriggerClass": ".expert-pop-up", "popUpElementClass": ".ixhs-pop-up-expert", "hideAfterSubmit": ".ixhs-hide" } hbspt.forms.create({ portalId: "6502416", formId: "a22c0f41-7467-47c5-bb42-1059479400ef", onFormReady: function($form) { ixtegrateFormOnReady($form, ixhsOptionsEx); }, onFormSubmit: function($form) { ixtegrateFormOnSubmit($form, ixhsOptio