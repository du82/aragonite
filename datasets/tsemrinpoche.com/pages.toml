["https://tsemrinpoche.com/tsem-tulku-rinpoche/art-architecture/malaysian-wedding-customs.html"]
title = "Malaysian Wedding Customs | Tsem Rinpoche"
description = "This former Wesak Day Buddhist’s idea of spirituality came in the form of Yoda in Star Wars. Fortunately, she met an awesome spiritual teacher, H.E. the 25th Rinpoche, who is the catalyst and steady guide in her current spiritual path."
full_description = "This former Wesak Day Buddhist’s idea of spirituality came in the form of Yoda in Star Wars. Fortunately, she met an awesome spiritual teacher, H.E. the 25th Rinpoche, who is the catalyst and steady guide in her current spiritual path. In Malaysia, it is common for the Malay bride’s fingers to be decorated with henna for her wedding. (Photo credit: mariefranceasia.com) Malaysian weddings are diverse, unique and colourful affairs, as is to be expected in a country that is a melting pot of cultures and faiths. Generally speaking, wedding customs in Malaysia are determined based on the couple’s race, religion or both. As a large percentage of Malaysians are Malays, and given that Malaysia’s constitution provides that all Malays are to be Muslims, Malay weddings are typically steeped in Malay traditions and solemnised according to the tenets of Islam. On the other hand, Chinese wedding customs are diverse as there are many different sub-ethnic groups such as the Cantonese, Hokkiens, Hakkas and Peranakan Cina (Baba Nyonyas). Coupled with the different religions practised by Malaysian Chinese, there are numerous options of wedding rites and customs to choose from. The Chinese wedding may or may not include religious aspects but traditional Chinese rites are usually observed. Chinese Christians may include a church ceremony as part of their wedding while those who are Buddhists or Taoists may include a blessing ceremony at the temple. Malaysians of Indian descent usually opt for weddings based on their religion, whether it is Hinduism, Christianity, Buddhism or Islam, as well as the sub-ethnic group they belong to. Hindu Indians usually incorporate a blessing and solemnisation ceremony at the temple while Christian Indians normally include a church ceremony as part of their wedding. The sheer number of possible permutations based on ethnicity, sub-ethnicity, religious beliefs and personal preference results in a variety of wedding customs unlike anywhere else in the world. Some of the most unique Malaysian weddings are interracial marriages which are a fusion of the cultures and customs of the happy couple, resulting in a one-of-a-kind wedding where love and respect matter more than faith, colour or race."
author = "https://www.facebook.com/TsemTulkuRinpoche"
