full_description = "This stunning Methar statue carved of wood is on the main Dorje Shugden altar as part of the entourage in Kechara Forest Retreat. I wanted to share with all of you the story of the very potent Methar and how he arose as a dharma protector and came to be a part of Dorje Shugden’s mandala. He was placed under the care of Kache Marpo, who is Dorje Shugden’s main assistant. This protector has a very interesting but tragic story, and yet he is a very powerful being that can aid practitioners quickly and effectively. Serkong Dorje Chang and his son Serkong Tsenshab Rinpoche (debate partner of the 14th Dalai Lama) of Gaden Jangtse Monastery are among the many who relied on this protector. His story is one of political intrigue, unholy plots against innocent men and murder. Please read carefully and understand Methar’s origins well. It is very fascinating. You can also have a free download of Methar’s painting which cannot be found easily. I must thank my team for their help in research, composition and artwork for this fantastic post. The Dharma protector Methar. In his previous life he was the treasurer of Tengyeling Monastery. He was brutally killed and then arose as a Dharma protector. Click above to go to the BUDDHA IMAGES section to download a free high resolution copy. During the period of His Holiness the 13th Dalai Lama, there was an attempt to assassinate him by means of black magic. When the 13th Dalai Lama was around 20 years old, he was given a pair of silk soles for his shoes by one of his senior tutors, the 9th Demo Rinpoche, Ngawang Lobsang Trinle Rabgye. Demo Rinpoche in turn had been given the silk soles by a stranger, who was a Ngakpa. Ngakpas are non-monastic practitioners who follow a different set of vows as compared to lay practitioners. Thinking that they were too precious for him, Demo Rinpoche offered them to the 13th Dalai Lama. The 4th Demo Rinpoche, Lhawang Tenpai Gyaltsen, a student of the great 5th Dalai Lama, was a previous incarnation of the 9th Demo Rinpoche. This thangka is said to bear his actual likeness, as opposed to traditional thangkas which are more stylised. Click to enlarge."
