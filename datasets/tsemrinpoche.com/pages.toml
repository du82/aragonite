["https://tsemrinpoche.com/tsem-tulku-rinpoche/kechara-13-depts/welcome-to-kechara-forest-retreat.html"]
title = "Welcome to Kechara Forest Retreat – New Pictures! | 欢迎来到克切拉禅修林（新照片）！ | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "“Since I was a young child, I wanted to create a place where people come together to live as one with nature, one with the earth; a place for healing, detoxification, contemplation, relaxation, and retreat. An international centre for meditation courses not based on religion but tapping into ourselves and our potential. A place for eco-living modelled on sustainability and growth. This project is Kechara Forest Retreat and it will be a space to inspire the world to do the same in their own communities.” In line with Rinpoche’s vision, Kechara Forest Retreat (KFR) primarily serves as a Tibetan Buddhist Retreat and Wellness centre that heals, nourishes and enlightens life naturally and spiritually. Since the completion of Phase 1 within a year of its conception in early 2012, KFR has been gradually channeling eons of Buddhist wisdom through pragmatic teachings that are a source of peace to a world in search of spiritual empowerment, education and restoration of inner balance. KFR is a sacred land, home to a pantheon of Tibetan deities presiding peacefully within its grounds, each catering to the different karmic propensities of visitors from all walks of life who step into our mandala. A visit here will have you feeling blessed, renewed and rejuvenated. And, even if you are not spiritually inclined, KFR presents the opportunity to experience the distinctively rich culture, history and traditions of Tibetan Buddhism. Spend a few hours, a day or more as our guest, take a walk through our gardens, offer candles to the Buddhas, make a prayer in our meditation hall, or just sit and listen to the calming sounds of the forest. The best way to explore KFR is to embark on a self-guided Holy Walk covering the following sacred sites within our beautifully manicured grounds. You are welcome to wander these sacred abodes and immerse yourself in the holy energies of the enlightened beings. You can also pay homage or show your respect in traditional Tibetan fashion via mantra recitation, hand-held prayer wheel spinning, circumambulation, prostration, meditation and making offerings of Mantra Stones, Candles, Incense, Flowers, Fruits, Food (vegetarian), Beverages and more. And, if you’re seeking ways to deepen your spiritual practice, consider speaking to one of our Buddhist pastors to learn more about Tibetan Buddhism, rituals and pujas, or to receive advice and a blessing."
