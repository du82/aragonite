title = "Support the Kechara Pastors | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "The pastorship role was conceptualised by His Eminence Tsem Rinpoche to preserve the Dharma and to give laypeople an opportunity to commit to benefiting others. The first Buddhist Pastors were ordained on 24th October 2011 and every year since then, more have made this commitment to bring the Buddha’s teachings to people in our modern era. Kechara’s Buddhist Pastors received their ordination from His Eminence, whose vows stem from an unbroken lineage of Tibetan Buddhist masters, tracing all the way back to Lord Shakyamuni, the historical Buddha. In addition to holding their Refuge and Pastors vows, serving others with sincerity and without a selfish motivation, they also undergo various levels of training in their spiritual advancement before they become one of Kechara’s Buddhist Pastors. The selection and training is a rigorous process, and the appointment of the Pastors must be approved by Kechara’s Board of Directors and blessed by His Eminence. Pastors bridge the gap between the ordained Sangha and the everyday practitioner. By holding their Pastors’ vow, they make the Dharma more accessible to people, giving guidance and sharing their knowledge. Pastors are ordinary people who have taken an extraordinary step in dedicating their lives towards sharing the Dharma. They have made a commitment towards their spirituality and the spirituality of others. Eight years have passed as the Pastors continue to serve the community, in a spiritual capacity, assisting His Eminence in his compassionate and visionary works. His Eminence envisioned Pastors to create waves of merit for limitless sentient beings through their body, speech and mind. The Pastors have the privilege of touching many people’s lives, by serving the public; Kechara members, their friends and family; as well as people all over the world through social media and a dedicated Pastors’ corner on His Eminence’s blog (https://www.tsemrinpoche.com/ask-the-pastors). Pastors dedicate their time fully to assist His Eminence by nurturing fellow practitioners along their spiritual path. Pastors share the Dharma with others, help them with their practice and inspire them with their good example. Pastors will also prepare fellow practitioners to receive higher teachings and initiations in the future."
