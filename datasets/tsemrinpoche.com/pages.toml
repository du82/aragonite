full_description = "My students and friends have worked long and hard to convert my video teachings on my YouTube channel to audio format. These teachings are now available here mp3 format. You can click on the “Play” button to listen to each teaching online, or press “Download” to save the files to your mp3 player, iPod or computer and listen to them at your convenience. Enjoy If you are in the United States, please note that your offerings and contributions are tax deductible. ~ the tsemrinpoche.com blog team Kindly note that the comments or posts given by third parties in the comment section below do not represent the views of the owner and/or host of this Blog, save for responses specifically given by the owner and/or host. All other comments or posts or any other opinions, discussions or views given below under the comment section do not represent our views and should not be regarded as such. We reserve the right to remove any comments/views which we may find offensive but due to the volume of such comments, the non removal and/or non detection of any such comments/views does not mean that we condone the same. We do hope that the participants of any comments, posts, opinions, discussions or views below will act responsibly and do not engage nor make any statements which are defamatory in nature or which may incite and contempt or ridicule of any party, individual or their beliefs or to contravene any laws. Thank you Rinpoche for this audio teachings. Nowadays whenever I am driving, I will listen to Rinpoche’s and other teachings as well. I was so surprise + excited when i see this new audio teaching feature and it is FREE !!! 😉 it is so easy to download i can just listen Rinpoche’s audio teaching while i am driving. Sometimes i think there is lots of time wasted listening to FM radio during driving or stuck in heavy traffic.I must Thank You Rinpoche for you love ,Kindness and make us easy to receive Buddha Dharma in this degenerate era. I folded my hand feel grateful from deep of heart thanks again to you Rinpoche."
