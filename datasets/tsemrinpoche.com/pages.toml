description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "Note: This section of H.E. Tsem Rinpoche’s blog is meant for Dharma questions or questions related to Kechara and our lineage. If the question is not relevant or out of our scope, we will respectfully request you to seek an answer on a more relevant platform. Before posting your question, we would also like to suggest that you look through some of the older posts (or do a search on this blog) before you post a question as your question may have been already answered in an older post. Hi pastors, can you share with me Thongkapa short prayer? As I will be going to the YongHe temple at Beijing soon. I would love to offer a prayer to buddha thongkapa. Thanks in advance. Thanks for your question. It’s incredible that you will be visiting Yong He Gong Temple. Here are some prayer to Lama Tsongkhapa which you may like: https://www.tsemrinpoche.com/tsem-tulku-rinpoche/buddhas-dharma/tsongkhapa-prayers.html Hi pastors, can you share with me a short prayer to Buddha Guan Yin? I would like to make this prayer when I visit temples that have Guan Yin Buddha. Thanks in advance. In Tibetan Buddhism which we practice, Guan Yin is actually worshipped in a male form. He is known as Chenresig in Tibetan or Avalokiteshvara in Sanskrit. You can find a short yet very powerful praise to Chenresig here: https://www.tsemrinpoche.com/tsem-tulku-rinpoche/one-minute-story/powerful-and-short-praise-to-avalokitesvara-chenrezig Dear pastors, when we perform the Lama Tsongkhapa practice, are there any visualizations we can do to heal people who are sick or have undergone surgery? I know there are healing practices with Medicine Buddha, White Tara, etc., but I want to know if there are techniques for healing others through Lama Tsongkhapa. Are the practices of Black Manjushri and Trakpo Sumtril effective in curing people who have recently undergone surgery? Thanks. In short, yes, the practice of Lama Tsongkhapa can be used for healing for oneself and others. When engaged in the mantra recitation section, visualise white healing lights from Lama Tsongkhapa’s heart healing the particular person you are praying for."
