["https://tsemrinpoche.com/tsem-tulku-rinpoche/great-lamas-masters/the-tsem-rinpoche-relic-stupa-project.html"]
title = "The Tsem Rinpoche Relic Stupa Project | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "His Eminence the 25th Tsem Rinpoche was not an ordinary being. Defying all odds, Rinpoche came to Malaysia with nothing and built Kechara into one of the most well-known and progressive Buddhist institutions in the region. Alone in a foreign land, Rinpoche skilfully adapted his Dharma teachings to suit the minds and ways of modern spiritual seekers, while faithfully preserving the pure lineage of Lama Tsongkhapa along with key practices of the Gelug lineage. Along the way, Rinpoche also touched countless lives, founded and supported various charities, and even established the first Buddhist pastorship in the region. And so, official recognitions aside, it is clear even to ordinary eyes that Rinpoche’s Dharma activities were exceptional and far beyond the capabilities of even the best of ordinary men. Less obvious is the Herculean role that Tsem Rinpoche assumed in fulfilling H.H. Kyabje Trijang Rinpoche’s prophecy of a divine play of enlightened beings, orchestrated to keep the wheel of Dharma turning. The highest enlightened masters of our lineage regarded the practice of Dharma Protector Dorje Shugden as vital during the Kali Yuga (Age of Strife), this degenerate time in which we live. However, such is the heavy karma of the Kali Yuga that in recent times, obstacles have arisen to impede this very important practice. So, just like the Great Padmasambhava was forced to engage in cosmic battles for Dharma to take root in Tibet, an enlightened being ascended to remove the restraints to Lama Tsongkhapa’s pure lineage. We know this enlightened being as our Guru, His Eminence the 25th Tsem Rinpoche. Rinpoche dedicated his entire life to reviving Lama Tsongkhapa’s lineage which Dorje Shugden arose to protect. Click on image to enlarge. The work of the 25th Tsem Rinpoche was difficult but not in vain. To safeguard the Dorje Shugden practice is to secure the path that gives sentient beings a means to escape the clutches of samsara. The Dharma Protector Dorje Shugden arose due to an oath taken by Duldzin Drakpa Gyaltsen, an emanation of the Wisdom Buddha Manjushri himself, to protect Lama Tsongkhapa’s teachings especially those on Emptiness — specifically Nagarjuna’s Middle Way View. These teachings are a precious key to enlightenment, a rarity the further we progress into the Kali Yuga."
