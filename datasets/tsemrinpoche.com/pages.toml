full_description = '''I’ve created this section for all of you to share your opinions, thoughts and feelings about whatever interests you. // <![CDATA[ function toggleDiv( divId ) { jQuery("#"+divId).slideToggle(); if ( jQuery( '.expand-link' ).html() == 'EXPAND' ) { jQuery( '.expand-link' ).html( 'CLOSE' ); } else { jQuery( '.expand-link' ).html( 'EXPAND' ); } } // ]]&gt; These are some simple guidelines to make the blog chat room a positive, enjoyable and enlightening experience for everyone. Please note that as this is a chat room, we chat! Do not flood the chat room, or post without interacting with others. Remember that these are real people you are chatting with. They may have different opinions to you and come from different cultures. Treat them as you would face to face, and respect their opinions, and they will treat you the same. Give the room a chance to answer you. Patience is a virtue. And if after awhile, people don’t respond, perhaps they don’t know the answer or they did not see your question. Do ask again or address someone directly. Do not be offended if people do not or are unable to respond to you. This is the blog of H.E. Tsem Rinpoche. Please respect this space. We request that all participants here are respectful of H.E. Tsem Rinpoche and his organisation, Kechara. Avoid the use of language or attitudes which may be offensive to others. If someone is disrespectful to you, ignore them instead of arguing with them. Please be advised that anyone who contravenes these guidelines may be banned from the chatroom. Banning is at the complete discretion of the administrator of this blog. Should anyone wish to make an appeal or complaint about the behaviour of someone in the chatroom, please copy paste the relevant chat in an email to us at care@kechara.com and state the date and time of the respective conversation. This blog and chat room is a place for constructive discussions which will enhance one’s Dharma knowledge. Points and questions are raised in a respectful manner with intent to create understanding and harmony.'''
