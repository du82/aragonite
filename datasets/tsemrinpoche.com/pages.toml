["https://tsemrinpoche.com/foundation"]
title = "Tsem Rinpoche Foundation, Inc. | Tsem Rinpoche"
description = "Tsem Rinpoche Foundation, Inc. is a non-profit 501(c)3 charitable institution dedicated to encouraging Buddhist prayers and rituals along with the growth, ..."
full_description = "Tsem Rinpoche Foundation, Inc. is a non-profit 501(c)3 charitable institution dedicated to encouraging Buddhist prayers and rituals along with the growth, development and study of Buddhism, and Buddhist philosophy in accordance to the Gadenpa Tradition (Tibetan Buddhism), teachings of Je Tsongkhapa and H.E. Tsem Tulku Rinpoche. The Foundation’s also provides the public with Buddhist-related and spiritual services and educational content. Incorporated officially on 19th February 2014 in the USA, Tsem Rinpoche Foundation, Inc. is affiliated with a global group of Buddhist associations and social enterprises. This includes Kechara House, a non-profit Buddhist association in Malaysia, and Kechara Soup Kitchen, a charitable project whose primary goal is to feed and empower the homeless and underprivileged in Malaysia, Indonesia and Shanghai, China to become independent and self-sustaining. For the time being, our pastors are operating out of Kuala Lumpur, Malaysia. If you have any questions, please write to them at foundation@tsemrinpoche.com. EVERTRUST BANK Account name: Tsem Rinpoche Foundation, Inc. dba Kechara Account number: 002-018-299 ABA#: 1222-4229-6 SWIFT#: ETBKUS6L Bank address: EverTrust Bank 200 S. Garfield Ave., STE 100 Alhambra, CA 91801 USA CITY NATIONAL BANK Account name: Tsem Rinpoche Foundation, Inc. dba Kechara Account number: 28027885 Routing Number: 122016066 SWIFT#: CINAUS6L Bank address: City National Bank 1012 Swarthmore Ave. Pacific Palisades, CA 90272 USA Our PayPal information will be published soon as we are further working on this section. Do visit again. If you are in the United States, please note that your offerings and contributions are tax deductible. As part of their teaching duties, the pastors took their guests on a pilgrimage to the various places in Los Angeles that Tsem Rinpoche frequented as a teenager. The visitors were fortunate enough to visit the first and second locations of Thubten Dhargye Ling, the Dharma centre that Rinpoche attended as a teenager where he had studied under the great Geshe Tsultrim Gyeltsen. The pastors also brought the group to the site of Fenmore Apartments, where Rinpoche lived as a teenager, and Sun Cleaners where Rinpoche was working when he received news that his root guru H.H. Kyabje Zong Rinpoche had entered clear light."
