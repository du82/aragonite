title = "Shugdenpas Speaking Up Across The Globe | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "This section features videos created by groups of loyal Dorje Shugden practitioners and supporters from all around the world. Their bravery and commitment to continuously and passionately speaking up against the Dorje Shugden ban is an inspiration for all of us. We at tsemrinpoche.com are very happy to be able to provide a platform to support their efforts and to enable more people to hear their views. The voices of strong and steadfast Shugdenpas have been suppressed for far too long by the Tibetan leadership, and it is time that the world sits up and takes notice of what they have to say. སྡེ་ཚན་འདི་ནང་ཡོད་པའི་བརྙན་འཕྲིན་དེ་དག་ནི་འཛམ་གླིང་གང་སར་བཞུགས་ཡོད་པའི་རྡོ་རྗེ་ཤུགས་ལྡན་བསྟེན་གསོལ་བྱེད་མཁན་དང་རྒྱབ་སྐྱོར་བ་རྣམས་ཀྱིས་གསར་སྐྲུན་བྱས་པའི་བརྙན་འཕྲིན་ཁག་བཀོད་སྒྲིག་བྱས་པ་ཡིན། ཁོང་རྣམས་ཀྱིས་སྙིང་སྟོབས་དང་ཁས་ལེན་དམ་བཅའ་མུ་འཐུད་ནང་གནང་ཡོད་པ་ལྟར་སེམས་འཚོར་དྲག་པོའི་ངང་ནས་རྡོ་རྗེ་ཤུགས་ལྡན་བཀག་སྡོམ་གྱི་ཁ་གཏད་དུ་ཁ་གསངས་པ་ནི་ང་རང་ཚོར་སེམས་སྐུལ་ཞིག་ཆག་གི་ཡོད།། ང་ཚོ་ tsemrinpoche.com དེ་ཉིད་ནང་ཁོང་རྣམས་ཀྱི་ཕྱག་ལས་དེ་དག་ལ་རྒྱབ་སྐོར་བྱེད་པའི་ཕྱིར་དང་མི་མང་སྐྱིལ་དུ་ཁོང་ཚོའི་བསམ་འཆར་འཁྱེར་ཡོང་བར་སྡིངས་ཆ་ཞིག་གོ་སྒྲིག་བྱེད་ཐུབ་པའི་ཧ་ཅང་དགའ་བ་མྱོང་། དབུས་བོད་མིའི་སྒྲིག་འཛུགས་ཀྱིས་ད་བར་དཔུང་སྟོབས་དང་ལྡན་པའི་ཤུགས་ལྡན་བསྟེན་གསོལ་བ་རྣམས་ཀྱི་སྐད་སྒྲ་དེ་ཉིད་དུས་ཡུན་རོང་པོར་བཙན་གནོན་བྱེད་ནས་འོང་། ཁོང་ཚོས་གང་བཤད་འདོད་ཡོད་པ་དེ་འཛམ་གླིང་ཡོངས་ཀྱི་གསན་དགོས་པའི་དུས་ཚོད་ལེབས་ཡོད།"
