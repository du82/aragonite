["https://tsemrinpoche.com/tsem-tulku-rinpoche/tibetan-astrology/tibetan-astrology.html"]
title = "Tibetan Astrology | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = 'Tibetan astrology is a blend of both Chinese and Indian astrological traditions but is uniquely Buddhist as it is based on the Kalachakra Tantra. As such there are many methods that are taught to overcome any negative influences that we may go through in daily life. These methods allow us to purify any negative astrological influences and karma, leading to a happier, smoother life as well as creating the causes for a fortunate rebirth in the future. According to the Buddhist teachings, we all have a unique blend of karma that determines where we are born, the circumstances of our birth and the quality of our life. Naturally, this is due to the actions that we performed in previous lives. Karma also dictates our characteristics and traits that determine how we act throughout our lives, which in turn leads to certain outcomes in this life and a determination of where we will take rebirth in the future. Karma, however, is not set in stone. We can change our circumstances through our own efforts – purification of karma and accumulation of merit. Tibetan astrology, based on these Buddhist principles, provides us the methods to ensure success in this life and a good rebirth in the future. Tibetan astrology can also predict what will happen to us in this life and our next rebirth based on the time of our birth. Discover your traits according to the Mewa, or Magical Square system of Tibetan astrology below, and find out how to purify your negative karma to improve your life! <img style="float: right;" src="/wp-content/uploads/tibastrology/150px/buddha-1.png" title="Chenresig" alt="Chenresig" /> The energy and properties of Arya Avalokiteshvara, Lokeshwara, Padmapani, Chenrezig and Kuan Yin are just synonyms of a very powerful universal energy called compassion. Compassion in symbolic form is this Buddha Chenrezig and in definitive meaning, it is what we need as the main nourishment to survive on this planet. show more For those who are born with Chenrezig as their Birth Buddha, it can be an indication that they may need to give more love to others. It may also be an indication that in their life, they might come across pockets of people and events that will create a lot of anger in themselves or in others that becomes an obstacle to their lives.'
