["https://tsemrinpoche.com/tsem-tulku-rinpoche/buddhas-dharma/vajradhara-and-84-mahasiddhas.html"]
title = "84 Mahasiddhas | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "The 84 Mahasiddhas represent all those who have, within a single lifetime, attained direct realization of the Buddha’s teachings. Their life stories represent what they have accomplished and what they did for others upon gaining realization from their practice. By reading their stories, we know that through effort and practice of the Buddha’s teachings, we too can gain liberation. The lives of these 84 mahasiddhas have a similar pattern… the siddha-to-be experiences some sort of preliminary discontent or a life-crisis leading to the appearance of the guru. Their personal encounter with a spiritual teacher turns out to be a turning point in their lives. The siddhas-to-be are given an initiation by their respective gurus, and the guru will skilfully give them instructions. This is usually something that they can put to immediate use. The students gradually (or some immediately) acquire great faith and place a high level of commitment to their teacher. They do not hold back in any possible aspect. Any instruction from the guru is of great importance to them, and they practice it diligently as it is the vital link to the highest attainment. The mahasiddhas are people who come from all walks of life. There are men and women, kings and beggars, young and old, monks and laymen. It proves to us that no matter what our initial state is, it is possible to reach the highest human condition within one lifetime. Below is a list of the 84 mahasiddas and of Vajradhara. There is a photo and a short description on the side. I have always love to read the stories of these Mahasiddhas. They brought tears, joy, amazement, faith, wonder, awe, and laughter when reading about them. They always inspire great inspiration towards the Dharma and blesses me to do more. To realize perseverance and diligence does produce results. Each of them had their particular attachments, delusions and hang ups. In each of them, we can find ourselves or something similar. It makes us realize, before they became attained, they were just like you and me. That means, we can be eventually just like them if we apply ourselves!"
