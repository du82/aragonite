["https://tsemrinpoche.com/comments-i-like"]
title = "Comments I Like | Tsem Rinpoche"
description = "According to legend, Shambhala is a place where wisdom and love reign, and there is no crime. Doesn't this sound like the kind of place all of us would love to live in? https://www.tsemrinpoche.com/?p=204874"
full_description = "If you are in the United States, please note that your offerings and contributions are tax deductible. ~ the tsemrinpoche.com blog team Kindly note that the comments or posts given by third parties in the comment section below do not represent the views of the owner and/or host of this Blog, save for responses specifically given by the owner and/or host. All other comments or posts or any other opinions, discussions or views given below under the comment section do not represent our views and should not be regarded as such. We reserve the right to remove any comments/views which we may find offensive but due to the volume of such comments, the non removal and/or non detection of any such comments/views does not mean that we condone the same. We do hope that the participants of any comments, posts, opinions, discussions or views below will act responsibly and do not engage nor make any statements which are defamatory in nature or which may incite and contempt or ridicule of any party, individual or their beliefs or to contravene any laws. Namaste, I am happy to find a blog where is so many Dharma inspiration. Thank you Rinpoche, I will come backe here! Dorota, Poland Dear Dorota, Welcome to tsemrinpoche.com. We are glad that you have found many Dharma inspiration through the blog. You can visit the category page of “Buddhas, Dharma & Practice” where all Dharma-related posts are listed: https://www.tsemrinpoche.com/tsem-tulku-rinpoche/category/buddhas-dharma You can also access “Audio Teachings” page here where video teachings on Rinpoche’s YouTube channel are converted to mp3 format: https://www.tsemrinpoche.com/audio-teachings You can click on the “Play” button to listen to each teaching online, or press “Download” to save the files to your mp3 player, iPod or computer and listen to them at your convenience. Hope to see you more on the blog. You can also go on chat to interact live with us: https://www.tsemrinpoche.com/chat Thank you Tsem Rinpoche. The following was sent to David Lai earlier today…Hello David. Firstly, thank you for all that you do to aid Tsem Rinpoche. Your hard work is greatly appreciated. I am just reading some of the fb posts by people in regard to the Shugden picture with his Eminence. I am truly saddened that there lives are so empty they must fill the world with hatred and persecution. I truly hope they realize the error of their ways and make reparations for the damage they are doing.I have learned so much from Tsem Rinpoche and I feel great compassion for him and honor his teachings and that of his preceding lineage holders. I live in an area of canada that has no Dharma center and no Buddhism to speak of. Without the teachings Kechara has provided through the internet I fear I may have chosen the wrong path. I thank you from the inner most depths of mind and heart for your invaluable contributions to The Dharma and the bringing about of the liberation of all sentient beings. Even those who hold wrong views. Deeply disturbed that these individuals would spend so much time and energy on making themselves look so foolish. On a lighter note…I went to a gift shop here in canada. miramichi, new brunswick to be exact and wanted to purchase a statue fitting to my practice here at home. There were 50 of the same laughing Buddhas! lol One large over priced laughing buddha and one small statue of what I thought was a Buddha? Well, excited I bought it. I thought it was Ushnishavijaya? When I got it home I learned that it was in fact Bramha, the Thai version, Phra Phrom? It is a Hindu Dharni but holds a wheel of Dharma? Well, to make a long story short, it was PHRA PHROM what I was looking for! ha The owner of the store told me that people come in and leave money on the buddhas belly and other people come along and steal it. Ah, Samsara! HA! I am a personal care aid working with the disabled and the elderly and recently lost a client I worked with, as he passed on. Therefore it has been a difficult few months made easier by yourself and all the hard work you and Tsem Tulku Rinpoche are doing. Not to mention everyone else who supports your efforts. Thank you so much. I would love to hear from you and will continue to follow and support. Many blessings take care. Your friend. Mark"
