["https://tsh.io/portfolio/snappit-case-study"]
title = "Case study: Events with 15K+ fans used Snappit's ordering app"
description = "Snappit rebuilt their remote ordering app for a new client — a Norwegian bank. Crowds used the new product at events that often reached over 15,000 attendees."
full_description = '''Case studies Snappit logo białe 1a-svg.s0 { fill: #ffffff } Copied Snappit's upgraded ordering app was used at events for up to 15K peopleWe prepared the technology for food and drink ordering for fail-safe use at big venues in Norway. Thousands of Muse, Justin Timberlake, or Foo Fighters fans used the app at concerts in the Telenor Arena in 2017/2018. About SnappitSnappit was a Norwegian technology company founded in 2011 that offered remote ordering technology for restaurants.Guests could order at the table by using Snappit’s app. The kitchen would receive the request directly in the browser.Over 4000 Norwegian restaurants adopted Snappit.In 2017, DnB Nord (or DbN) — Norway’s second-largest bank — bought Snappit’s app to use it as an ordering solution for events. DnB integrated their product into Vipps, their payment gateway for smartphones.From then on, Snappit’s remote ordering application became one function of Vipps known as VippsGo.The Software House worked with Snappit on their restaurant app and with DNB Nord on VippsGo. Country Norway Industry E-commerce Timeline 02.2017 - 11.2019Snappit was a Norwegian technology company founded in 2011 that offered remote ordering technology for restaurants.Guests could order at the table by using Snappit’s app. The kitchen would receive the request directly in the browser.Over 4000 Norwegian restaurants adopted Snappit.In 2017, DnB Nord (or DbN) — Norway’s second-largest bank — bought Snappit’s app to use it as an ordering solution for events. DnB integrated their product into Vipps, their payment gateway for smartphones.From then on, Snappit’s remote ordering application became one function of Vipps known as VippsGo.The Software House worked with Snappit on their restaurant app and with DNB Nord on VippsGo. 200+ B2B clients (Snappit) 13.3 peak no. of orders per second (VippsGo) 18,000+ B2B clients (VippsGO) The challengeDnB Nord wanted to add a new service to Vipps, their mobile payment product, to enter the restaurant and event industries.To outrun the competition, they bought a recognized solution for remote ordering from Snappit.Snappit decided to sign a winning contract with DnB. But their stack was outdated and unprepared to service high-volume orders. With the launch in 2 months, they needed to double their team.After that time, Snappit’s product needed to work flawlessly as a part of Vipps. We will later call this VippsGo.Snappit’s CTO looked for a team extension in Poland, known for valuable PHP talent. They allied with The Software House, which specializes in this technology. Partnership goal To prepare Snappit's remote ordering app for thousands of new users delivered by DnB Nord BeforeSnappit was already a success before the DnB deal with 200+ Norwegian restaurants adopting it. But the technology wasn’t scalable enough for mass events. AfterVippsGo, the app’s new version, processed 13.3 orders per second. The remote food and drink service became a hit at venues often reaching over 15K attendees. How VippsGo works The Software House's agile team led the development process for Snappit We worked on Web development React development Cloud development & DevOps Symfony development Software Architecture Development Quality Assurance Team formationThe Software House filled the talent and knowledge gap in weeks to help Snappit deliver software under a tight deadline of 2 months.Our partnership went on for over 2 years. For this project, we assigned 3 Developers, 2 DevOps, and a Project Manager. We worked on auto-scaling for Snappit’s cloud so that their remote ordering platform wouldn't crash during a 15 minute break at a concert when the crowd hurries to grab a beer and snacks. Marek Gajda CTO at The Software House Our partnershipSnappit’s product became clean and ready for integration with Vipps in 2 months. The Software House continued to develop VippsGo for 2 years, focusing on scalability and maintenance.Technology choice PHP, JS, AWS, Kubernetes, Grafana, ElasticSearch, Jenkins.What Snappit achievedSnappit’s remote ordering application – later added to VippsGo – was separated from their bigger platform for restaurants.Originally, there was a mobile app for customers and a web panel for restaurateurs — both using AWS cloud.In just 2 months, our developers rewrote the app for Vipps as a React-based SPA and helped develop new admin panels.VippsGo launchesThe team refactored 75% of legacy code left over after Snappit’s restaurant app.VippsGo had to be error-free after scaling.Our developers updated PHP to 7.1, Symfony to 3.4, Node to 10, and Bootstrap to 4. All frontend libraries got updated, too.The key changes we made to the cloud infrastructure included: Limiting the number of database queries, Rewriting queries so that they work faster, Including indexes for database columns.We moved to stress testing to see how VippsGo withstands a barrage of requests.TV-aksjonen campaignEvery year since 1974, Norwegians donate funds to charity during 1 week in Autumn called TV-aksjonen.In 2019, DnB chose that week to promote VippsGo in a program from NRK, Norway’s public broadcaster and the makers of the campaign.For high-intensity times like that, our cloud engineering team used auto-scaling.During that week, 24,000 users per minute ordered from VippsGo at a peak. That translates to 13.3 orders per second. No crashes.The partnership with Telenor ArenaCrowds of thousands could use VippsGo as the main remote ordering app at venues held at Telenor Arena, a 10 400 m² event stadium in Oslo, Norway.Some of the biggest events relying on VippsGo included shows from Justin Timberlake, Foo Fighters, or Muse. Source: Vipps Deliver the project with a product team recommended by 98% of CTOsOn average, tech leaders from 10+ industries gave us ★5 for quality and speed. Build you product with confidence by using our 9 years of experience in software development. Book free consultation Work only with scalable technologiesExpect a software solution designed for stability, usability, and scalability thanks to next-gen technologies used at The Software House: microservices, serverless, and cloud computing 240+ professionals availablePeople with the skill set your project needs are within reach – developers, cloud engineers, DevOps, architects, and product designers Rated 4.9/5 on Clutch.coWe follow a simple mantra that worked for +160 software projects we delivered with success — everything we build must be of great value to you and your clients "The team itself is full of high-quality individuals."Said by Product Director Matthew Knapp from a US moving company in a ★5 review. He delivered a new customer portal with us that call center requests by 40%. Book free consultation Contact us Specialists On Demand Team Augmentation Dedicated Product Teams Effective Delivery Web Development Mobile Development App Modernization Cloud Engineering Data Engineering Modern Frontend Digital Product Design Acceleration Sprints™ AWS Cost Cut GenAI Rapid Prototyping React Performance Observability Strategy App Modernization Roadmap Accessibility Review Headquartersul. Twarda 18 Warszawa, 00-105 Polandul. Dolnych Wałów 8 Gliwice, 44-100 Poland The Software House 2025 The Software House | All rights reserved EU Funds | Privacy policy | Terms of service The Software House 2025 The Software House | All rights reserved EU Funds | Privacy policy | Terms of service'''
