["https://tsh.io/blog/machine-translation-with-ai"]
title = "Machine translation with AI reduced costs by 99% | TSH.io"
description = "Software Architect experienced in backend technologies such as Node.js, cloud infrastructure, software architecture, and DevOps. Keenly interested in data engineering. One of the creators of Kakunin – our open-source framework for E2E testing. In his free time, Mariusz loves biking, machine learning, and 3D graphics."
full_description = "06 May 2024 Machine translation. An AI-based solution cut translation costs by 99% Przemysław Gacka Mariusz Richtscheid Software Architect Rafał Sikorski Node.js Developer Mariusz, Rafał Multiple authors 14 minutes read Contents: Back to the start 1. R&D 2. Implemented solution 3. Machine translation final solution 4. Cost down by 99% 5. Benefits Share the article with your friends: Copied Artificial intelligence works wonders for your budget IF implemented appropriately. Human translators are overwhelmed with more complex tasks, and machine language translation partially relieves them. Our partner in the media industry reduced their translation costs by 99% with our Lambda-based solution. Exactly, down from $200 to $1.95 to generate one report with 4k articles! Business problem – accurate translationThe project emerged from a partner from media industy. The publisher wanted to translate a substantial volume of articles into English, each containing approximately 4,000 characters. Given the large number of texts involved, the solution could operate asynchronously, so there is no need for real-time responsiveness.We’ve been conducting diverse text analyses for the client, including sentiment analysis, name extraction, classification, and gender analysis. We employed various tools and external services like TextRazor, SpanMarker, etc. While these tools were effective in English, some texts we needed to analyze were in multiple languages. Consequently, we had to translate them before analyzing English texts.The main challenge involved ensuring accurate translations from various languages to English and preserving the text’s original meaning.However, measuring translation accuracy took a lot of work due to the many languages involved. Given the expected large volume of texts, the client anticipated potential high costs in the foreseeable future. Their initial suggestions were leveraging Large Language Models (LLMs) and external translation services. Our task was to identify the optimal solution, prioritizing cost reduction, as processing speed was not a top priority due to asynchronous operations.The verification methods included reading texts and relying on metrics provided by the authors of various solutions. One such metric is BLEU. It gives a general overview of the quality of the translated text, comparable to human judgment. Unfortunately, this metric is not perfect because the score strictly depends on the fact that translated language consists of word boundaries. So, it doesn’t work for all the cases. Read more on this project: AI for publishers. Comparing AI name extraction software for more user engagement Research & development. Initial ideas that didn’t workBloom LLMInitially, the client suggested testing the Bloom LLM model due to our experience with various LLMs. However, it required one of the most expensive EC2 instances, which ideally should run and shut down after completing the task. The translations were not highly accurate because of hallucinations (common in LLM models, as they aren’t designed for a perfect translation process).Exploring AWS SageMaker, we identified Batch Transform as a promising solution, but the API wasn’t mature enough and demanded time-consuming development effort.Natural Language ProcessingRecognizing the vast landscape of LLMs, we sought a better alternative. Our architect discovered the University of Helsinki’s Language Technology Research Group, specializing in NLP for morphologically rich languages. They offered over 1400 models at Hugging Face, providing a potential solution to our translation challenges.Upon discovering the lightweight translation models (around 300 MB each), we immediately considered running them on AWS Lambda (at TSH, we’re serverless architecture enthusiasts). This approach would substantially reduce costs.External translation providersFollowing extensive market research, we compared popular machine translation services and their pricing models. Initially, we explored: AWS Translate, DeepL, Google Translate, Azure AI Translator, ModernMT, IBM Translator. All aforementioned providers’ pricing depended on the number of characters in the text. So, we ran a cost simulation vs accuracy. Translation cost chartWe then projected monthly costs for the next two years, factoring in newly registered publishers, the number of articles to translate, and their average length. The charts highlighted a significant cost spike at the end of the two years, reaching around $100,000 when using external services!Shockingly, the machine translation module would be more expensive than the overall application expenses! That was unacceptable for the business (and rightfully so), so we sought more cost-effective alternatives.Testing new toolsWe encountered several new tools during our exploration, and for testing purposes, we selected the following: SeamlessM4T Tested using the SeamlessCommunication package and a Spacy tokenizer. NLLBOlder architecture compared to SeamlessM4T with limits to noncommercial usage. M2M100Tested using EasyNMT. MBart50Tested using EasyNMT. OpusMTTested using EasyNMT.We delved deeper into their characteristics, considering factors such as organization, speech support, available languages, licensing, and whether it’s a single model. SolutionOrganizationSourceSpeech supportLanguagesSingle modelLicenseCommercialSeamlessM4TMetaLinkYes~100YesCC-BY-NC 4.0NoNLLBMetaLinkNo~200YesCC-BY-NC 4.0NoM2M100MetaLinkNo~100YesMITYesMBart50MetaLinkNo~50YesMITYesOpusMTUniversity of HelsinkiLinkNo~230NoCC-BY 4.0YesMT5GoogleLinkNo~100YesApache 2.0Yes OpusMT emerged as a promising choice. Made by Helsinki University, it supports translations for over 100 languages in various directions. Each pair of languages has a lightweight model capable of being translated directly and efficiently. Usually, the size of a model is around 100-200MB, which makes it perfect for some low-end machines or Lambda functions.We verified SageMaker Studio Lab in two configurations: T3.xlarge machine with 4vCPU and 16GB RAM, excluding a GPU. G4dn.xlarge machine with 4vCPU, 16GB RAM, and 1 NVIDIA T4 GPU.For comparison, we used a short dataset of three texts in Polish of various lengths and then translated them using Google Translate to learn what to expect from these models.TextsLanguageTypeCharactersWordsShortPolishWeather19231MediumPolishClimate64182LongPolishPolitics2430303 To show the example this is how short text looked like:“Jesień to piękna pora roku, kiedy liście drzew zmieniają się w kolorowe odcienie, a wieczory stają się chłodniejsze. To czas, gdy można cieszyć się spacerami w parku i kubkiem gorącej herbaty.”Translated by Google Translate:“Autumn is a beautiful time of year when the leaves of the trees change into colorful shades and the evenings become cooler. This is the time to enjoy a walk in the park and a cup of hot tea.”Translated by OpusMT:“Autumn is a beautiful time of year when leaves of trees turn into colorful shades and evenings become cooler. It’s a time when you can enjoy walking in the park and a cup of hot tea.”The difference between those two is negligible. Translation with similar quality was produced by other models as well. Knowing that we needed to consider additional aspects to narrow our choices.We calculated the performance of all the models running on various machine configurations with CPU or GPU. As you can see, the best performing one was OpusMT, and on GPU it is super fast. ModelProcessorTextTime [s]SeamlessM4TCPUShort15,7SeamlessM4TCPUMedium42,4SeamlessM4TCPULong151,2OpusMTCPUShort2,1OpusMTCPUMedium3,2OpusMTCPULong5,7MBart50CPUShort18,9MBart50CPUMedium21,5MBart50CPULong53,4M2M100CPUShort13,1M2M100CPUMedium19,2M2M100CPULong42,7SeamlessM4TGPUShort1SeamlessM4TGPUMedium2,3SeamlessM4TGPULong8,3OpusMTGPUShort0,2OpusMTGPUMedium0,3OpusMTGPULong0,7MBart50GPUShort0,7MBart50GPUMedium0,9MBart50GPULong2,3M2M100GPUShort0,6M2M100GPUMedium0,9M2M100GPULong2,1Considering all the aspects of such models, such as licensing, model weight, ease of use, performance, and quality, we have finally opted for OpusMT.Implemented solutionWe’ve opted for the EasyNmt Python library to handle the heavy lifting for us. This library conveniently provides a pre-built container with a functional API, making it a breeze to set up on EC2. Check out the setup guide here. We’re mindful of the EC2 costs – juggling infrastructure maintenance, manual updates, and setting up auto-scaling can be a handful. So, we’ve put that on hold for the time being. Real-time translations aren’t our immediate need; most of the time, EC2 won’t be in the spotlight. Our game plan? Give AWS Lambda a shot to trim down those costs. AWS LambdaUnderstanding the limitations of AWS Lambda, especially regarding storage capacity, is crucial. This necessity underscores the rationale for utilizing containerized Lambdas.In this context, the code package size within a container Lambda can reach up to 10GB, and with the additional ephemeral storage available in “/tmp” (up to 10GB), the total capacity is 20 GB. This enables the creation of customized containers housing 6-7 pre-downloaded models, each approximately 300MB. This approach eliminates downloading these models on demand when the Lambda function initiates. When models haven’t been pre-downloaded, the initial translation time for text containing around 4,000 characters is approximately 15 seconds. During Lambda initialization, tasks include accelerating the Virtual Machine, loading the container, analyzing the text’s language, downloading the required model, and loading it. Once these steps are completed, subsequent requests will take approximately 5 seconds for the Lambda function to provide answers.The EasyNMT library includes a remarkable utility that can automatically recognize the language of a given text. Additionally, it dynamically downloads the necessary model on the fly, streamlining the process and improving efficiency.Developing the machine translation solutionThis repository provides a simple yet powerful solution for running the Opus-MT (Machine Translation) model for text translation within an AWS Lambda.In our client projects, we have typically utilized the Serverless Framework. However, I have employed the SST Framework to construct our serverless solution for this case. The SST Framework offers a modern and developer-friendly experience for building serverless applications on AWS. It simplifies defining and deploying serverless infrastructure using TypeScript, making our code type safe. Under the hood, SST constructs leverage AWS CDK, giving developers access to raw CDK functionalities if needed.To kickstart our project, let’s begin by initializing with the following command: `npx create-sst@latest serverless-translations`Building containers in Dockerfile This Dockerfile is designed to establish an environment for executing our translation Lambda function, utilizing the Opus-MT model and essential dependencies and code. Let’s delve into the purpose of each section:1. `FROM amazon/aws-lambda-python:3.9` Specifies the base image for the Docker container, utilizing the amazon/aws-lambda-python image tailored for running Python Lambda functions with Python 3.9.2. `COPY ./requirements.txt /requirements.txt` Copies the local requirements.txt file into the container’s root directory.3. `RUN yum -y install gcc-c++` Installs the gcc-c++ package via yum, which is likely necessary for building specific Python packages involving C or C++ code compilation.4. `RUN pip install –no-cache-dir torch –extra-index-url https://download.pytorch.org/whl/cpu` Installs the PyTorch library without caching files, specifying the extra index URL for downloading PyTorch. Additionally, it indicates the use of the CPU version since it’s intended for Lambda.5. `RUN pip install –no-cache-dir -r /requirements.txt` Installs Python dependencies listed in requirements.txt using pip. The –no-cache-dir flag ensures that no cached files are utilized during installation.Our requirements.txt: 6. `ENV HOME /tmp` This directive establishes the HOME environment variable within the container, setting it to /tmp. This step is crucial because EasyNMT may attempt to download files or models, and without this line, it might try to store them outside of Lambda’s ephemeral storage, leading to errors.7. `COPY handler.py ${LAMBDA_TASK_ROOT}` This command copies the local handler.py file into the Lambda task root directory within the container. This ensures that the Lambda function can access and execute the specified handler.8. `CMD [“handler.main”]`This instruction defines the command to execute when the Docker container starts. It specifies running the primary function from the handler.py file. Essentially, this sets the entry point for the container’s execution, indicating the starting point for the Lambda function within the container.Lambda handlerNow, let’s implement our Lambda logic.The code execution unfolds as follows: Input RetrievalBegin by obtaining the target language code from the path parameters. Then, extract the source text from the request body, which is intended for translation. Parameter ValidationConduct basic validation checks on the provided parameters. EasyNMT IntegrationThis code section utilizes EasyNMT to load the “opus-mt” model and automatically detect the source text’s language. The primary action involves invoking the ‘.translate’ method and awaiting the result. EasyNMT Workflow DetailsInternally, EasyNMT checks if the source_language is provided as an argument; otherwise, it automatically attempts language detection. Based on the target language provided, EasyNMT seeks and downloads the desired translation model. The acquired model is then utilized to translate the source text. Project StructureThe Dockerfile, handler.py, and requirements.txt files must be placed in the packages/functions/src/translation directory. SST ConfigurationTo consolidate the different components and establish connections, create a new file under the ‘stacks’ directory and name it, for example, ‘Translations.ts’. This file acts as the central piece connecting the various elements using SST (Serverless Stack Toolkit).This function serves multiple purposes. During deployment, SST will search for a Dockerfile in the specified path in the ‘handler’ argument. It will then build a container and push it to the AWS Elastic Container Registry, facilitating the connection between the containerized function and AWS Lambda. As a result, the function returns to obtain its reference in other stacks.With the Lambda function established, I’ll show you how to create a simple API easily using SST.Create `Api.ts` under the ‘stacks’ folder.In the initial steps, refer to the translation function created earlier using the SST hook. Subsequently, SST’s API construct will be employed, facilitating the creation of API Gateway resources and the connection of Lambdas to them.The API construct offers robust functionality, incorpora"
