["https://tsh.io/state-of-frontend"]
title = "State of Frontend 2024"
description = "Based on surveys filled in by 6028 developers from 139 countries, the State of Frontend 2024 is supported by 23 expert commentaries about frontend trends and the future."
full_description = "Welcome to the State of Frontend 2024 report – third time the charm!AleksandraDąbrowskaReport's Editor-in-ChiefThe frontend universe in the post-pandemic world seems to be doing alright, but it is not without reminiscing about the good (not-so) old times when the world had to move online, new tech projects were overflowing, and waves of funding were high. Now, the industry seems to have shaken off the glitter of the gilded era and entered a phase of practicality and simplicity.Wondering how this influenced the daily work of frontend teams, we decided to expand the report's scope and ask more detailed questions (while hoping for the grace of our participants, who had to put more time in to complete the survey). Some sections are new (AI, a11y), and some mark our evergreen staples. So, if possible, we compared data from The State of Frontend 2022. This edition is our most comprehensive survey yet, with 6,288 responses from developers, engineers, and tech enthusiasts across 139 countries.Our community spans the globe, with the largest number of responses coming from countries like the USA, Poland, Germany, and France. We're also thrilled to have heard from individuals in places as diverse as Andorra, the Maldives, Mauritius, Senegal, and Guinea-Bissau—where a single yet equally important voice represented each country. We are extremely grateful and send a big thanks to each and every one of you who took the time to fill out the survey. Without your experiences, we couldn't create this resource for the community, helping us understand where frontend development is headed. Regarding industry affiliations, IT services led with 29.7%, followed by finance, banking, and fintech (13.9%) and retail and e-commerce (11.6%). Other notable sectors included entertainment, healthcare, and education. Beyond these major industries, there was significant diversity, with 13% of respondents falling into the “Other” category. This group represented a wide array of fields, including consultancy, marketing, art, AI, nonprofits, agriculture, blockchain, environmental services, aerospace, defense, and game development. The breadth of industries highlights the growing role of frontend development, reaching not only traditional tech areas but also specialized sectors."
