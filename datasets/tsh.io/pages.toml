full_description = "Privacy PolicyWhat terms do we use in Privacy Policy?Personal data – data of a person who can be identified by the use of such data. This Privacy Policy explains how we use the personal information you provide to us.TSH/We – The Software House sp. z o.o. with registered office in Gliwice, ul. Dolnych Wałów 8, entered in the Register of Entrepreneurs of the National Court Register kept by the District Court in Gliwice, 10th Commercial NCR Division, REGON (National Official Business Register No.): 146211123, TIN: 5272680543.You, Yours – any natural person whose Personal data we process and to whom this Privacy Policy applies.GDPR – Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the processing of personal data and on the free movement of such data and repealing Directive 95/46/EC (General Data Protection Regulation).Website – our website and its subpages: www.tsh.io.Recipients – entities to whom we may transfer a part of your personal data, in connection with the performance of certain activities or services by them on our behalf. They may not do anything about your personal data until we have instructed them to do so, and only to the extent we have indicated. They will store your personal data securely and only for as long as we indicate or as required by applicable law.Cookies – the so-called Internet cookies, i.e. tiny information recorded by the server on your computer disc in the form of small text files. Cookies make it possible to recognize the User’s device during the next visit, providing access to certain functions and allow us to understand how he navigated the site.Privacy Policy – this policy sets forth the principles governing cookies and processing and protection of personal data.Whose data does the privacy policy apply to?Privacy Policy defines the method of collecting, processing and storing personal data of: job candidates employees contractors clients/suppliers employees or persons representing clients newsletter subscribers, individuals who complete any forms on Website (including event applications), and individuals who download any content from Website (including but not limited to reports, e-books and other resources) correspondents participants of meetup eventsWho will be your data controller?The controller of your Personal data: The Software House sp. z o.o. with registered office in Gliwice (hereinafter referred to as “TSH” or “we”) at ul. Dolnych Wałów 8. This means that we decide for what purpose the personal data you have provided to us are processed. We want you to know that we make every effort to keep your personal data safe. We do not provide personal data entrusted to us for a fee. You can contact us directly for information regarding the protection of your personal data at: [email protected].How do we process personal data?Personal data is processed in accordance with the GDPR. The Personal data collected by TSH will be: processed in accordance with the law collected for specified, lawful purposes and not subjected to further processing incompatible with these purposes factually correct and adequate in relation to the purposes for which they are processed stored no longer than it is necessary to achieve the purpose of processing.Detailed information on how we process your data in specific processes can be found in the section: “For what purposes, on what legal grounds and for how long do we process your Personal data?”What data are we talking about?We collect information about you when you provide it to us yourself (for example when you complete forms, download any content from the Website) or when you use our services, including the services and other functionalities provided by TSH on the Website and stored in cookies that are installed on our website, as well as the data we have obtained from publicly available sources, such as social media or through third parties that have suggested that we contact you. If you then decide to cooperate with us, additionally there will be all personal data you provide us with.For what purposes, on what legal grounds and for how long do we process your personal data?Information for job applicantsPurpose of processingLegal basisPeriod of processingCarrying out the recruitment procedure in the scope of data indicated by the provisions of the labor law and taking the necessary actions to conclude a contract with the selected candidate article 22¹ of the Labor Code and article 6 sec. 1 pt. b) GDPR;The data will be processed until the end of the recruitment process, no longer than 12 months from the receipt of the candidate’s application by the Controller or for the period indicated in the possible consent for future recruitments (no longer than one year from the end of the recruitment process).Including additional data in the recruitment process based on your consents, including personal data provided other than those resulting from legal provisions article 6 sec. 1 pt. a) GDPR (ordinary data) or in accordance with article 9 sec. 2 pt. a) GDPR (data of a special category, e.g. data on health or degree of disbility)(consent);The data will be processed until the end of the recruitment process, no longer than 12 months from the receipt of the candidate’s application by the Controller or for the period indicated in the possible consent for future recruitments (no longer than one year from the end of the recruitment process).Participation in future recruitment processes, based on the expressed consent article 6 sec. 1 pt. a) GDPR (consent);The data will be processed until the end of the recruitment process, no longer than 12 months from the receipt of the candidate’s application by the Controller or for the period indicated in the possible consent for future recruitments (no longer than one year from the end of the recruitment process). Providing personal data is mandatory based on the law, and in the remaining scope is voluntary.Information for employeesPurpose of processingLegal basisPeriod of processingConclusion and performance of an employment contractarticle 6 sec. 1 pt. b) GDPR and article 221 of the Labor CodeThe data will be processed for the time necessary to perform the concluded contract, the limitation period for claims arising from it and the period of storage of related settlement documentsKeeping accounting and tax documentationarticle 6 sec. 1 pt. c) GDPR and article 74 of the Accounting Act and others concerning taxpayers (processing is necessary for compliance with a legal obligation to which the controller is subject)The data will be processed for the time necessary to perform the concluded contract, the limitation period for claims arising from it and the period of storage of related settlement documentsPursuing claims and protection against claimsarticle 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller) The data will be processed for the period of limitation of potential claims (3 years from the date on which the claim became due)Ensuring the safety of employees, protection of property, as well as maintaining the secrecy of information, the disclosure of which could expose the employer to damagearticle 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller)The data will be processed until an effective objection is raised by the data subjectOrganization of training for employeesarticle 6 sec. 1 pt. a) GDPR (consent)article 6 sec. 1 pt. b) GDPR (processing is necessary for the performance of a contract of employment)article 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller)The data will be processed until an effective objection is raised by the data subject;until the consent is withdrawn, until the terms of the contract expire, and then for the period of limitation of potential claims (3 years from the date on which the claim became due)Performance of obligations arising from health and safety regulations, i.e. on determining the circumstances and causes of accidents at workarticle 6 sec. 1 pt. c) GDPR (processing is necessary for compliance with a legal obligation to which the controller is subject)The data will be processed for the period resulting from the provisions of law, i.e. for a period of 10 years, counting from the end of the calendar year in which the employment relationship was terminated or expired. Providing personal data is mandatory based on the law, and in the remaining scope is voluntary. Without providing mandatory data, it is not possible to conclude an employment contract.Information for contractorsPurpose of processingLegal basisPeriod of processingConclusion and performance of an contractarticle 6 sec. 1 pt. b) GDPRThe data will be processed:– for the time necessary to perform the concluded contract, the limitation period for claims arising from it and the period of storage of related settlement documents,– for the period required by law in order to fulfill the obligations arising from the regulations until these obligations are fulfilledKeeping accounting and tax documentationarticle 6 sec. 1 pt. c) GDPR and article 74 of the Accounting Act and others concerning taxpayers article 6 sec. 1 pt. c) GDPR (processing is necessary for compliance with a legal obligation to which the controller is subject)Pursuing claims and protection against claims Providing personal data is mandatory based on the law, and in the remaining scope is voluntary. Without providing mandatory data, it is not possible to conclude a contract.Information for clients/suppliersPurpose of processingLegal basisPeriod of processingEstablishment of commercial contacts – salesarticle 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller)Until an effective objection is raised in connection with a special situation of the data subjectConclusion and performance of the sales agreement article 6 sec. 1 pt. b) GDPRUntil the termination/expiry of the agreement subject to the time limits for any claims (6 years after the date of termination)Handling the enquiries of prospective and existing Clients, including claims/complaints article 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller))Until the termination/expiry of the agreement subject to the time limits for any claims (6 years after the date of termination) Maintenance of accounting and tax documentation article 6 sec. 1 pt. c) GDPR and article 74 of the Accounting Act and others concerning taxpayers (processing is necessary for compliance with a legal obligation to which the controller is subject)5 years after the end of the calendar year in which the tax was due Debt collection article 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller)respectively for the period of limitation/expiry of claims inherent in the legal relationship, 6 years after the date of issue of the orderInvestigation of claims and protection against claims article 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by the Controller)respectively for the period of limitation/extinction of claims inherent in the legal relationship (at least 6 years after the date of termination of cooperation)Direct marketing of own products and services article 6 par. 1 item a of GDPR in connection with Article 10 of the Act on the provision of electronic services and Article 6 par. 1 item f of GDPR)until withdrawal of consent. Providing personal data is mandatory based on the law, and in the remaining scope is voluntary. Without providing mandatory data, it is not possible to conclude an contract.Information for employees or persons representing clientsPurpose of processingLegal basisPeriod of processingOngoing handling of the agreement concluded article 6 sec. 1 pt. f) GDPRThe data will be processed for the term of the agreement Establishment and investigation of claims and damages, defence against possible claims article 6 sec. 1 pt. f) GDPRFor the period of limitation of potential claims (6 years after the end of cooperation) Providing personal data is voluntary but without providing data, it is not possible to conclude an contract.If the data were not obtained directly from you, this means that the source of origin of the data is your employer or an entity represented by you.Information for newsletter subscribers, individuals who complete any forms on Website (including event applications), individuals who download any content from Website (including but not limited to reports, e-books and other resources)Purpose of processingLegal basisPeriod of processingSending messages from various fields in the form of a newsletter which is a form of direct marketing of the Controller’s products or servicesarticle 6 sec. 1 pt. a) GDPRUntil withdrawal of consent by the data subject. Withdrawal of the consent does not affect lawfulness of processing performed prior to the withdrawal.Sending e-mail notifications about offers or content of interest, which in some cases may include commercial informationarticle 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by us), within the scope of your consentUntil an effective objection is filled.Conducting other types of activities related to the direct marketing of goods and services (including sending commercial information electronically)article 6 sec. 1 pt. f) GDPR (processing is necessary for the purposes of the legitimate interests pursued by us), within the scope of your consentUntil an effective objection is filled.Processing your registration to attend our event, updating you with details regarding our event, administer the event, contacti