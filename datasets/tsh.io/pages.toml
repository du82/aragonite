["https://tsh.io/portfolio/stageclip-case-study-cloud-costs"]
title = "Case study: Cloud costs cut from $30K to $2K per month"
description = "After optimizing cloud costs for 1000 websites on 25 servers with our engineers, StageClip shrunk the bill by 93%. They now save $28,000 every month. Learn how."
full_description = '''Case studies StageClip logo białe-svg .s0 { fill: #ffffff } Copied Rebuilding StageClip's cloud architecture saved $28,000 per monthThe client’s virtual graduation platform connected to 1000 WordPress sites generated $30,000 per month in cloud costs. Rearchitecting them under one Next.js application cut the bill to only $2,000 per month. About StageClipBefore 2020, StageClip specialized in preparing personalized videos of graduation ceremonies.When the COVID pandemic hit in 2020, StageClip changed into an event technology provider to diversify revenue. Their new video platform lets universities and high schools create and share clips from online graduation ceremonies.StageClip is a technology partner of over 1400+ educational institutions worldwide, including the University of California, Florida International University, or the University of St. Andrews. Country UK Industry Event technology Timeline 11.2019 – 12.2021Before 2020, StageClip specialized in preparing personalized videos of graduation ceremonies.When the COVID pandemic hit in 2020, StageClip changed into an event technology provider to diversify revenue. Their new video platform lets universities and high schools create and share clips from online graduation ceremonies.StageClip is a technology partner of over 1400+ educational institutions worldwide, including the University of California, Florida International University, or the University of St. Andrews. 1,400+ B2B clients to date 1.3M total unique users 1441 graduation events serviced Business contextOnce we upgraded StageClip’s core product, their team needed to optimize the company’s Azure cloud costs.Every B2B client has one WordPress site under the stageclip.com domain where university graduates would upload their stage speeches.In 2020, StageClip’s platform for managing virtual graduations reached peak interest, so the team kept adding sub-pages for clients.Once the company operated 1000+ sites hosted on 25 servers, their cloud cost exploded up to $30,000 monthly.StageClip asked our engineers to: Investigate why the architecture is so expensive Reduce cloud spending while the service stays live Partnership goal To find why the cloud cost $30,000 monthly and to cut the spend BeforeStageClip kept scaling cloud services for incoming clients but didn’t optimize its architecture After1000 client websites nested in a Next.js application cut the cloud costs by 93% The Software House's cloud engineering team led the optimization project We worked on: Cloud development & DevOps Next.js development Team formationTwo cloud engineers worked on rearchitecting while another development team from us focused on product growth.At one point in our partnership with StageClip, our dedicated team scaled up to 22 experts that included 8 Developers, 4 QA Engineers, and 2 Project Managers. Our partnershipStageClip reached a record low in cloud spending of $2,000 per month. This is because all subdomains of the 1000+ WordPress sites connect to 1 Next.js application which only requires 1 server instead of the previous 25.The developmentStageClip build their initial Azure architecture themselves with just a team of 3: CTO and 2 full-time developers.Their system wasn’t design to saved costs, because they were busy scaling the product for hundreds of new institutional clients.Our engineers discovered that Azure services costed thousands per month because: The cloud received traffic from 1000 WordPress websites used by clients One client page required one Azure serviceThey build a Next.js application with a client panel and a backend that service the traffic from 1000 websites.This way, the number of Azure services went down to one, which eventually resulted in a $28,000 monthly saving.The team also needed to modify the base Next.jx so that it recognizes different subdomains.They also used the framework to build a transition system that kept the product live while StageClip switched from the old to the new architecture. What happened nextOnce StageClip could rely on a cost-efficient Azure architecture, they entered a contract with 400 more universities and institutions.In 2022, over 1400 B2B clients subcsribed to their virtual graduation platform. Discover our work for StageClip in detail How a startup cut cloud costs from $30K to $2K per month by nesting 1K websites in 1 Next.js app Marcin Kuśmierz and Marcin Królczak, our cloud engineers who worked with StageClip, reveal how they remodeled the company's Azure architecture. Read more Deliver the project with a product team recommended by 98% of CTOsOn average, tech leaders from 10+ industries gave us ★5 for quality and speed. Build you product with confidence by using our 9 years of experience in software development. Book free consultation Work only with scalable technologiesExpect a software solution designed to remain stable, usable, and expandable thanks to last-gen technologies we deploy: microservices, serverless, or cloud computing 240+ professionals availablePeople with the skill set your project needs are within reach – developers, cloud engineers, DevOps, architects, and product designers Rated 4.8/5 on Clutch.coWe encourage clients to follow a simple attitude that worked for 160+ software projects — everything we build must be of great value to you and your users "The project is a grand success. The user feedback is absolutely overwhelming."Said by Chief Architect of Vaana in a ★5 review. He delivered an employee benefit platform with us for 1M end-users. How can we help you? Book free consultation Contact us Specialists On Demand Team Augmentation Dedicated Product Teams Effective Delivery Web Development Mobile Development App Modernization Cloud Engineering Data Engineering Modern Frontend Digital Product Design Acceleration Sprints™ AWS Cost Cut GenAI Rapid Prototyping React Performance Observability Strategy App Modernization Roadmap Accessibility Review Headquartersul. Twarda 18 Warszawa, 00-105 Polandul. 