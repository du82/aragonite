nce, EN 301 549 compliance.Accessibility Review Sprint’s outcomesAccessibility reviewHighlights issues and regulatory gaps in global code, readability, graphics, or forms.Project backlogA list for web development teams with recommended improvements, tasks, dependencies, and the timeframeAn A11Y planA checklist of the WCAG standards your website should comply with.Book this SprintHow does this Sprint™ work?Step 1 /Initiation stageTimeframe1 dayParticipantsBusiness Analyst, Designer, Frontend Developer, Quality Assurance, Your company’s stakeholdersNeededYour business case that should include the project’s goals, roles and responsibilities, and the definition of success.Steps We’ll choose business and technology goals for the audit that match accessibility compliance criteria, and divide roles and responsibilities among the team.Step 2 /Accessibility auditTimeframe1-3 weeksParticipantsBusiness Analysts, Designers, Developers, Quality AssuranceNeededTechnical information provided to our team at least 2 days before the workshop.Deliverables→ A web accessibility audit backlog with tasks, dependencies, and timeframes.→ A review of the website’s design and frontend performance in terms of WCAG, EAA, EN 301 549, and/or ADA standards.→ (Optional) An A11Y accessibility implementation plan.StepsWe’ll discuss bringing in A11Y improvements to the project, followed by a code base review. Then, we’ll prepare accessibility guidelines for tasks, best practices for development, and A11Y/WCAG testing scenarios. Finally, we’ll prepare an accessibility test for current users.Step 1 /Initiation stageTimeframe1 dayParticipantsBusiness Analyst, Designer, Frontend Developer, Quality Assurance, Your company’s stakeholdersNeededYour business case that should include the project’s goals, roles and responsibilities, and the definition of success.Steps We’ll choose business and technology goals for the audit that match accessibility compliance criteria, and divide roles and responsibilities amon