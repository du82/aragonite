description = "New technology won 10 awards | After a back-end migration from Zend to Symfony, allowing eSky to enter new markets in 2 weeks rather than 2 months."
full_description = '''Case studies eSky logo 1b-svgtspan { white-space:pre }.shp0 { fill: #ffffff } Copied Scaling up a travel platform operating in 34 marketsMigrating eSky’s backend from Zend to Symfony cut the system’s market adoption time from 2 months to 2 weeks and earned the company 10 awards for product innovation. About eSkyeSky in a worldwide online travel agency now present in 50 markets, providing booking for 1030 airlines and 1.3M hotels and flats.Travelers using the company’s search engine can secure a flight, a hotel, a car, and insurance that are essential for having memorable experiences on a trip. At least 180M users per year visit eSky’s domains that rely on the backend The Software House helped to transform. Country Poland Industry Travel & transportation Timeline 07.2014 - 09.2017eSky in a worldwide online travel agency now present in 50 markets, providing booking for 1030 airlines and 1.3M hotels and flats.Travelers using the company’s search engine can secure a flight, a hotel, a car, and insurance that are essential for having memorable experiences on a trip. At least 180M users per year visit eSky’s domains that rely on the backend The Software House helped to transform. 1030 registered airlines 50+ localized domains 1.3M hotels and flats available The challengeeSky started as a booking platform operating in Poland. The company was launching localized domains for new countries in the portfolio, where each website connected with one system for the booking engine created in PHP Zend.The engine processed enormous volumes of information about airline, hotel, car, and insurance availability.Booking information had to be displayed in 18+ languages and currencies with 13 filter categories changing the search.The management soon couldn’t service increasing waves of users or connect new domains to their system without performance issues that caused a loss of the customer’s interest.An internal technology audit found out that PHP Symfony could carry the weight if eSky had access to developers who mastered it. Partnership goal To modernize a leading travel platform in preparation for future scalability BeforeAn outdated backend and the lack of Symfony developers prevented eSky from scaling up into lucrative markets AfterUnder The Software House’s lead, eSky’s platform regained stability and became ready to service new millions of users The Software House hand-picked professionals who joined eSky's team under a hybrid model We worked on Web development DevOps engineering Quality Assurance Team formationeSky’s stack update required more Backend developers on board.The Software House filled the talent and knowledge gap in weeks where the company would have needed months to do so. The line-up included 11 PHP developers. Our partnershipFor over 3 years, our joint team was rebuilding the system’s back-end components in Symfony. The newer version of the product allowed eSky to enter markets 77% faster.Technology choiceAngular 2, Typescript (frontend), PHP Symfony (backend), Kakunin, BabelSheet.What eSky achievedThe Software House started by introducing eSky’s developers to the basics of Symfony for the teams to sync. The entire backend in Zend needed an urgent rewrite. After our lead developer presented the migration plan, 13 of our professionals begun working on 3 out of 4 of the platform’s components.First, we re-integrated static pages with travel content with the backend.We continued with the optimization of eSky’s transaction process in the BBD (behavior-driven development) methodology.Transaction functions that needed updating included the quick search, the booking offer list with prices, the order form, and the confirmation page.Our third project involved rewriting the “Deals” module with pricing alerts for airlines.The team’s last massive undertaking was dealing with the hotel booking process.We needed to develop under rules set by the Payment Card Industry Data Security Standard so that eSky acquires a critical certificate needed for credit card processing. They did.The public’s opinion of the platformAfter the much-needed update that finished in 2017, the platform’s performance and ease of use won eSky 10 product-related awards in the following years.• Page of the year 2018• 2018 +Digital Enterprise award• (Two) Internet Effectiveness award for 2018• e.Comm award 2018• e.Comm award 2017• ekomersy 2017 award• Best Online Travel Agency 2017• Good Design 2017 award• APG Airlines award for 2017 Reach a breakthrough in your project just like eSky didFor over 9 years, tech leaders from 10 industries entrusted The Software House’s engineers with refactoring, development, and cloud computing works. Book free consultation Work only with scalable technologiesExpect a software solution designed for stability, usability, and scalability thanks to next-gen technologies used at The Software House: microservices, serverless, and cloud computing 320+ professionals availablePeople with the skill set your project needs are within reach – developers, cloud engineers, DevOps, architects, and product designers Rated 4.8/5 on Clutch.coWe follow a simple mantra that worked for +160 software projects we delivered with success — everything we build must be of great value to you and your clients "The Software House is a very reliable partner."As said by a Senior Product Manager at Workpath in a ★5 review. He optimized the platform’s UI for conversion with our design team. How can we help you? Book free consultation Contact us Specialists On Demand Team Augmentation Dedicated Product Teams Effective Delivery Web Development Mobile Development App Modernization Cloud Engineering Data Engineering Modern Frontend Digital Product Design Acceleration Sprints™ AWS Cost Cut GenAI Rapid Prototyping React Performance Observability Strategy App Modernization Roadmap Accessibility Review Headquartersul. Twarda 18 Warszawa, 00-105 Polandul. Dolnych Wałów 8 Gliwice, 44-100 Poland The Software House 2025 The Software House | All rights reserved EU Funds | Privacy policy | Terms of service The Software House 2025 The Software House | All rights reserved EU Funds | Privacy policy | Terms of service'''
