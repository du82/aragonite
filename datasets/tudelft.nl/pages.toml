title = "De introductie van machine learning in het dagelijks leven"
full_description = '''De introductie van machine learning in het dagelijks leven Van academisch onderzoek tot toepassingen in de praktijk Nieuws - 31 januari 2025 We horen voortdurend over de 'AI-revolutie' en 'digitale transformatie' en zien overal om ons heen op AI gebaseerde robots en software. Deze ontwikkelingen zijn het resultaat van de snelle innovaties in het vakgebied machine learning, zoals zelfrijdende auto’s, ChatGPT, DeepSeek en zelfs het voorspellen van extreme weersomstandigheden. Maar hoe ontwikkelen deze innovaties zich van fundamenteel onderzoek tot onderdeel van het dagelijks leven? Geert-Jan Houben bespreekt deze vraag met de twee codirecteuren van de ELLIS Unit Delft: Frans Oliehoek en Jens Kober. De rol van 'machine learning' binnen 'artificial intelligence (AI)' “Het is binnen AI traditie om problemen als zoek- of optimalisatieprobleem te formuleren. Dat houdt wel in dat we weten wat we proberen te optimaliseren of dat we beschikken over de juiste data om waarschijnlijkheden in te schatten. Maar in veel gevallen weten we dat niet of zijn deze data niet voorhanden," legt Frans Oliehoek uit, universitair hoofddocent aan de faculteit Elektrotechniek, Wiskunde en Informatica (EWI). “In dat geval komt machine learning (ML) in beeld als deelgebied van AI. ML haalt met behulp van algoritmen informatie uit data, waardoor onze oplossingen beter aansluiten bij alledaagse problemen. Zo kan ML worden ingezet om zeldzame fenomenen als extreme weersomstandigheden te voorspellen. Door patronen te vinden in grote of complexe datasets bieden ML-modellen nieuwe inzichten in situaties waarin traditionele methoden soms tekortschieten." "Bovendien maakt ML inmiddels een integraal en fundamenteel onderdeel uit van veel AI-systemen. Zo blijken op regels gebaseerde modellen in zelfrijdende auto's niet te voldoen in complexe en onvoorspelbare omgevingen als drukke steden. Maar via ML kunnen de systemen leren van observaties en zich aanpassen aan dit soort onvoorspelbare scenario's," Jens Kober, universitair hoofddocent aan de faculteit Mechanical Engineering (ME), voegt daaraan toe: "Een van de grootste pluspunten van ML is dat het mogelijk wordt taken als bijvoorbeeld gezichtsherkenning te automatiseren. Die werden voorheen handmatig uitgevoerd omdat we ze onvoldoende begrijpen om expliciet oplossingen te kunnen programmeren." Kort gezegd, richt machine learning zich op het vinden van patronen in complexe data en snelle aanpassingen aan nieuwe of onvoorspelbare omgevingen. En deze combinatie kan nieuwe inzichten opleveren voor allerlei toepassingen Geert-Jan Houben De toepassing van machine learning in het dagelijks leven "Ons fundamentele onderzoek naar machine learning vormt een belangrijke basis voor innovaties en andere onderzoeken. De kennis die we opdoen door dergelijk onderzoek 'over AI' of ‘over ML’ speelt steeds vaker een rol in het onderzoek 'met ML', dat op de hele universiteit plaatsvindt. Zo komen nieuwe werkmethoden uit het lab voort en daardoor krijgt ML ook impact in allerlei vakgebieden als individuele gezondheidszorg, mobiliteit en energie-infrastructuren. En daardoor is ons werk in ML relevant voor het dagelijks leven," stelt Geert-Jan Houben, Pro Vice Rector Magnificus AI, Data en Digitalisering en leider van het TU Delft AI Initiative. “Een drijvende kracht achter ons onderzoek naar ML is de ELLIS Unit Delft, waar Jens en ik samen directeur van zijn. De leden van ELLIS zijn internationaal erkende ML-experts en werken aan een heel scala aan ML-technieken en toepassingsdomeinen. Bij de ELLIS Unit Delft richten we ons sterk op het verbinden van de theorie met praktische toepassingen. Ik denk dat we ons daarin onderscheiden van sommige andere ELLIS-units," legt Frans uit. "Daarnaast blijkt het niet altijd eenvoudig ML toe te passen voor specifieke problemen. Op het gebied van stadsplanning kan ML bijvoorbeeld worden ingezet voor de planning van noodzakelijk onderhoud van belangrijke infrastructuren, maar de paar beschikbare openbare datasets volstaan niet om de complexiteit van het probleem te ondervangen. "Een ander voorbeeld is de zorg, waarbij ML kan helpen bij het opsporen van afwijkingen die anders om diverse redenen over het hoofd zouden worden gezien. Dat zijn positieve ontwikkelingen, maar we moeten er ook voor zorgen dat de onderliggende systemen betrouwbaar en begrijpelijk zijn. Het is dus cruciaal dat ingenieurs die zich bezighouden met onderzoeksvragen 'met ML' ook betrokken zijn bij het ontwikkelen en toepassen van fundamentele methoden," aldus Jens. Frans: "Deze voorbeelden laten zien dat we, doordat onze ELLIS-unit integraal onderdeel is van het bredere AI-ecosysteem, nieuwe kennis over ML kunnen delen voor technische toepassingen, terwijl tegelijkertijd de beperkingen van bestaande methoden worden teruggekoppeld naar de ML-gemeenschap." We willen met de ELLIS Unit Delft niet alleen wetenschappelijk succesvol zijn op het gebied van ML, maar ook het theoretisch onderzoek en de fundamentele technieken vertalen naar praktische oplossingen voor belangrijke maatschappelijke problemen. Frans Oliekoek en Jens Kober Geert-Jan: "Ik zou hieraan willen toevoegen dat deze voorbeelden allemaal aantonen hoe interdisciplinair onderzoek en innovaties niet alleen snel, maar ook goed aangepakt kunnen worden. En met 'goed' bedoelen we dat het deugdelijke wetenschap is, maar ook dat de maatschappij er baat hij heeft. Dat is waar het bij ML voor het dagelijks leven om draait. De vertaling van machine learning naar het dagelijks leven "De vertaling van ML naar toepassingen voor het dagelijks leven is een flinke opgave. Modellen zijn weliswaar nooit perfect, maar we kunnen beginnen om met de beschikbare data die kloof te overbruggen, door te testen hoe technieken zich vertalen in verschillende domeinen en situaties. Door na te denken over de vraag wat een goed model is kunnen wetenschappers niet alleen problemen oplossen, maar begrijpen ze ook beter waar behoefte aan is,” zegt Jens. "Een bedrijf waarmee we samenwerken heeft bijvoorbeeld een neuraal netwerk ontwikkeld om voorspellingen te doen over zoutindringing in vaarten. Dat levert goede resultaten op met hun dataset, maar het is de vraag hoe robuust die zijn bij wijzigende omstandigheden, zoals door klimaatverandering of nieuwe infrastructuur. Hoe meer een model zich kan aanpassen aan veranderingen in de dagelijkse werkelijkheid hoe beter, maar het is een uitdaging om dat voor elkaar te krijgen," legt Frans uit. "In dat kader zijn iteratief onderzoek en ontwerp van essentieel belang; modellen zijn niet van het begin af aan perfect, ze worden beter door verfijning en door ze te testen in de alledaagse praktijk. Samenwerking met wetenschappers uit andere vakgebieden biedt ons de benodigde context voor het testen van methoden, want de praktijk gedraagt zich anders dan een gecontroleerd laboratorium. Een computervisiemodel kan stopborden bijvoorbeeld goed herkennen in een schone dataset, maar stopborden zijn in werkelijkheid vaak beschadigd, vuil of slecht zichtbaar. Die uitdaging maakt het model uiteindelijk robuuster. De onderzoekers van onze ELLIS-unit beschikken over de benodigde expertise op het gebied van robuustheid en op het gebied van iteratieve methoden om dit op te lossen. Geert-Jan benadrukt dat het verder van groot belang is om de grenzen van ML te onderkennen. "Inderdaad kan niet elk probleem via deze methoden worden opgelost," beaamt Jens. "Soms is de beschikbare data onvoldoende voor effectieve toepassing van ML, of is de doelstelling onduidelijk. Dat kan leiden tot onvoorziene problemen, zoals discriminatie of het niet meewegen van voorkeuren van mensen. Dan is het net zo belangrijk om toepassing van ML af te raden als het in andere gevallen is om het toe te passen. Daarmee zorg je ervoor dat de technologie verantwoord en effectief wordt gebruikt." Het vinden van de balans tussen regulering en innovatie "Soms zijn de optimalisatiedoelen van machine learning niet in lijn met wat gunstig is voor de maatschappij. Aanbevelingssystemen zijn bijvoorbeeld vaak vooral gebaseerd op de eerdere belangstelling van gebruikers, maar dat kan leiden tot filterbubbels waarin nauwelijks meer sprake is van verschillende perspectieven," zegt Jens. "Ik denk dat dit goed laat zien hoe belangrijk het is om kritisch na te denken over wat we optimaliseren en waarom. Bovendien blijven menselijke beslissingen essentieel. ML kan het menselijk oordeel niet volledig vervangen, vooral niet in complexe systemen waarbij mensen het voor het zeggen moeten hebben," benadrukt Geert-Jan. "En dat gaat ook op voor regelgeving," voegt Frans toe. "Voor de ontwikkeling van verantwoorde AI is het nodig een iteratief proces te doorlopen waarin kan worden getest in de dagelijkse werkelijkheid, rekening wordt gehouden met ethische overwegingen en waarin diverse waarborgen zijn geïmplementeerd. De rol van wetenschappers is cruciaal als het gaat om het waarborgen van de juiste toepassing van AI, met name op gevoelige gebieden zoals gezondheidszorg, zelfrijdende auto's en verkeersmanagement. Door zich bezig te houden met zowel de technologie zelf als de verantwoorde toepassing ervan, dragen ze bij aan het vinden van de balans tussen de soms met elkaar strijdige eisen van innovatie en regelgeving." Het vinden van de balans tussen regulering en innovatie is cruciaal voor een verantwoorde ontwikkeling van AI Frans Oliehoek "Ja, er is ruimte nodig om te experimenteren om tot innovatie te komen, maar tegelijkertijd moeten er robuuste mechanismen zijn die de veiligheid garanderen en ethische normen handhaven," benadrukt Geert-Jan. De kracht van interdisciplinaire samenwerking binnen machine learning "Machine learning speelt een steeds belangrijkere rol in techniek en ontwerp, maar is ook een belangrijke tool in wetenschappelijke laboratoria. Dat betekent dat ML steeds meer fungeert als 'motor' voor zowel maatschappelijke impact als wetenschappelijk onderzoek. Daarom zijn samenwerking en integratie zo belangrijk," legt Geert-Jan uit. "Het beeld van de eenzame wetenschapper die helemaal alleen op zoek is naar een grote doorbraak is per definitie achterhaald," beaamt Jens. "Wetenschap is zeer afhankelijk van samenwerkingsverbanden en (internationale) netwerken. Door ons sterke lokale netwerk kunnen we 'een compleet pakket' aanbieden, met zowel algoritmische als domeinexpertise, terwijl we door deel uit te maken van het ELLIS-netwerk kunnen samenwerken met experts uit heel Europa." Samenwerking is essentieel voor het testen en verfijnen van methoden voor scenario's uit de alledaagse werkelijkheid, zodat die zinvolle resultaten opleveren. Jens Kober "ML verbetert de tools van andere disciplines, wat de samenwerking ten goede komt. Onderzoekers zijn erbij gebaat om in contact te staan met experts, zodat ze deze technieken effectief in de praktijk kunnen toepassen. Door samen te werken met experts op andere domeinen krijgen wij inzicht in waar behoefte aan is en kunnen wij onze methoden te verfijnen. Dat is goed voor de wetenschap, maar zo kan de maatschappij daar ook meer van profiteren,” aldus Frans. ELLIS (het European Laboratory for Learning and Intelligent Systems) is een pan-Europees expertisenetwerk voor AI dat zich richt op fundamentele wetenschap, technische innovatie en maatschappelijke impact. Het werd opgericht in 2018 en er zijn inmiddels 43 units in 17 landen, met meer dan 1.500 actieve onderzoekers. Naast het opbouwen van een netwerk van toponderzoekers op het gebied van machine learning in heel Europa is het de missie van ELLIS om de ontwikkeling van ethisch verantwoorde en betrouwbare AI te stimuleren, met een positieve maatschappelijk impact. De ELLIS-eenheid Delft telt bijna 40 leden afkomstig van vier faculteiten. Bekijk de website of de wekelijkse AI Update voor meer informatie over het onderzoek van de Unit en over komende evenementen. blockquote { border-top: .3rem solid #0076C2 !important; } .quote-title-size--medium { color: #0076C2; } Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
