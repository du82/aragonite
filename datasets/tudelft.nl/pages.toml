["https://tudelft.nl/2024/innovation-impact/start-vpdelta-programma-2025-2029"]
title = "Start VPdelta-programma 2025-2029"
description = "In 2012 ging het eerste Valorisatieprogramma Deltatechnologie en Water, nu bekend als VPdelta, van start. Vele onderzoeken, opschalingen en samenwerkingen verder, is het programma uitgegroeid tot een sterk netwerk met impactvolle innovaties voor een klimaatbestendige regio."
full_description = "Technische Universiteit Delft Start VPdelta-programma 2025-2029 Start VPdelta-programma 2025-2029 In 2012 ging het eerste Valorisatieprogramma Deltatechnologie en Water, nu bekend als VPdelta, van start. Vele onderzoeken, opschalingen en samenwerkingen verder, is het programma uitgegroeid tot een sterk netwerk met impactvolle innovaties voor een klimaatbestendige regio. Het programma 2020-2024 is onlangs afgesloten en maakt plaats voor het nieuwe VPdelta-programma van 2025-2029. Met een sterke focus op praktijktoepassing en samenwerking, zetten we de succesvolle samenwerking met onze partners voort en blijven we samen onze impact vergroten voor een klimaatbestendige regio. In dit artikel blikken we kort terug, maar kijken we vooral vooruit naar de komende periode. Een deel van de VPdelta stuurgroep ©Robèrt Kroonen Terugblik De afgelopen vier jaar waren een waardevolle periode van onderzoek, innovatie, opschaling en intensieve samenwerking. Zo onderging het HittePlein een indrukwekkende transformatie met de installatie van talloze sensoren, waardoor meer ruimte en mogelijkheden onstonden voor stedelijk hitteonderzoek. Ook openden we, in samenwerking met het ministerie van Binnenlandse Zaken (nu: Volkshuisvesting en Ruimtelijke Ordening), het KlimaatKwartier: een proeftuin voor klimaatadaptieve gebouwen. Tijdens ons programma van 2020 tot 2024 verwelkomden we maar liefst 57 innovaties en waren er meer dan 300 opschalingen in Nederland. Dit laatste betekent dat de geteste innovaties ook zijn toegepast op locaties buiten onze proeftuinen. Nadruk op praktijktoepassing en opschaling De komende vier jaar blijven we ons richten op het versnellen van klimaatadaptatie in de gebouwde omgeving, met een sterke nadruk op praktijktoepassing en opschaling. Hierbij fungeert het programma als een facilitator voor samenwerking tussen overheden, kennisinstellingen en innovatieve bedrijven. De proeftuinen blijven daarbij een cruciale rol vervullen. In de vijf huidige proeftuinen - KlimaatKwartier, WaterStraat, HittePlein, Flood Proof Holland en Diergaarde Blijdorp – worden innovaties getest, verbeterd, gedemonstreerd en voorbereid op grootschalige implementatie. Zo vormen we de essentiële schakel tussen theorie en praktijk en bouwen we aan een klimaatbestendige regio. Innovaties en opschalingen VPdelta Een greep uit de opschalingen van innovaties uit het VPdelta-portfolio in Provincie Zuid-Holland Uitbreiding thematische focus De komende jaren blijven we onverminderd werken aan de uitdagingen zoals wateroverlast, hitte, droogte, waterveiligheid en waterbewustzijn. Daarnaast zetten we in op drie nieuwe thema’s: circulaire waterketen(s), het verbeteren van stedelijke waterkwaliteit en een integrale aanpak van uitdagingen zoals droogte, wateroverlast en de energietransitie. Deze verbreding biedt nog meer kansen voor samenwerking tussen domeinen en versterkt de impact van het programma. Dit alles doen we natuurlijk niet alleen, maar samen met onze partners. Een nieuw element aan het programma is dat elke partner samen met het VPdelta-team aan de slag gaat met een concrete casus binnen hun werkgebied. Van het vergroenen van pleinen tot aan het ontwikkelen van een circulair watersysteem; deze casussen leveren directe, meetbare impact en waardevolle lessen op. Tegelijkertijd zal het gezamenlijk leren tussen partners versterken en het opschaalproces verder versnellen. Hierover zal later meer volgen. Meer weten? Benieuwd naar ons werk? Neem contact op met Floor Pino (f.e.a.pino@tudelft.nl) voor vragen en/of opmerkingen. Meer weten over de innovaties binnen een specifiek thema? Wellicht is een rondleiding dan iets voor jouw organisatie. Bekijk hier de mogelijkheden. Met dank aan onze partners: Provincie Zuid-Holland, Gemeente Rotterdam, Gemeente Den Haag, Gemeente Delft, Hoogheemraadschap van Delfland, Hoogheemraadschap van Rijnland, Hoogheemraadschap Schieland en de Krimpenerwaard, Dunea, IHE Delft en Hogeschool Rotterdam. Het VPdelta-partnernetwerk"
year_published = 2025
