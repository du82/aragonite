title = "BK Feminist Week"
full_description = '''BK Feminist Week 03 maart 2025 09:30 t/m 07 maart 2025 18:00 - Locatie: Faculty of Architecture and the Built Environment & TU Delft Campus - Door: Communicatie BK | Zet in mijn agenda (function () { const config = {"name":"BK Feminist Week","description":"Van 3 tot 7 maart vindt de BK Feminist Week plaats. ","startDate":"2025-03-03","endDate":"2025-03-07","startTime":"09:30","endTime":"18:00","options":["Apple","Google","iCal","Microsoft365","MicrosoftTeams","Outlook.com","Yahoo"],"timeZone":"Europe\/Amsterdam","trigger":"click","iCalFileName":"BK-Feminist-Week","location":"Faculty of Architecture and the Built Environment & TU Delft Campus"}; const button = document.querySelector('#addToCalendarLink'); button.addEventListener('click', () => atcb_action(config, button)); }()); Van 3 tot 7 maart vindt de BK Feminist Week plaats. BK Feminist Week viert feminisme op onze faculteit en nodigt iedereen uit om mee te doen aan discussies, te vieren, te reflecteren en collectieve verantwoordelijkheid op te bouwen. De week valt samen met Internationale Vrouwendag en omvat activiteiten, discussies en wandelingen op de campus die de strijd en successen van feministen in de academische wereld en daarbuiten belichten. Door het delen van ervaringen wil de week ruimte creëren voor inspiratie, empowerment en verandering. Zie voor het volledige programma de Engelse pagina. Opmerking: Sommige evenementen zijn speciaal ontworpen om een veilige ruimte te creëren voor degenen die zich als vrouw identificeren. Deze evenementen zijn gemarkeerd met ♀. Bij alle andere evenementen moedigen we iedereen die feministische waarden aanhangt, hoe geëngageerd, nieuwsgierig of onzeker ook, aan om mee te doen! Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
