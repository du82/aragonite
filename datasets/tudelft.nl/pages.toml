["https://tudelft.nl/evenementen/2025/climate-action-programme/climate-action-programme-lecture-climate-finance"]
title = 'Climate Action Programme lecture "Climate Finance"'
full_description = '''Climate Action Programme lecture "Climate Finance" 13 maart 2025 12:45 t/m 13:45 - Locatie: TU Delft tbd | Zet in mijn agenda (function () { const config = {"name":"Climate Action Programme lecture \"Climate Finance\"","description":"","startDate":"2025-03-13","endDate":"2025-03-13","startTime":"12:45","endTime":"13:45","options":["Apple","Google","iCal","Microsoft365","MicrosoftTeams","Outlook.com","Yahoo"],"timeZone":"Europe\/Amsterdam","trigger":"click","iCalFileName":"Climate-Action-Programme-lecture-Climate-Finance","location":"TU Delft tbd"}; const button = document.querySelector('#addToCalendarLink'); button.addEventListener('click', () => atcb_action(config, button)); }()); Date: Thursday 13 March 2025 Time: 12:45 - 13:45 (free vegetarian lunch from 12:15 if registered) Location: TU Delft; CEG Hall B Registration: is mandatory via this link Climate Finance By Zac Taylor and Theodoros Chatzivasileiadis Theodoros Chatzivasileiadis is Assistant Professor in the Policy Analysis department of the TU Delft faculty Technology, Policy and Management. And leads the Climate Finance for Climate Resilient Infrastructure flagship of TU Delft’s Climate Action Program. His research is focussed on the economic effects of physical climate risks and the economics of climate change adaptation using Computable General Equilibrium models and econometric analysis. Zac Taylor is an Assistant Professor in the Department of Management in the Built Environment at TU Delft, and Academic Lead of the Delta theme at Resilient Delta (TU Delft and Erasmus University). Zac’s research examines how financial institutions manage climate risk in the built environment, and what this means for equitable urban climate transitions. They currently co-lead Red&Blue, a network of transdisciplinary research projects on climate adaptation finance and governance in the Netherlands. Zac is also a member of the Working Group on Climate Adaptation of the Sustainable Finance Platform hosted by the DNB. Zac: Shared Fates: Reimagining Disaster Insurance and Financialized Climate Risk Management in US Cities” “Recent wildfires in California and hurricanes in Florida, among other states, have revealed a crisis of disaster insurance affordability and availability. These crises speak to growing climate-fueled losses, but also to a deeply flawed forms of financialized urban climate risk management in cities. This approach fails to address the root causes of the insurability crisis – and ultimately, cannot secure safe, affordable housing in a changing climate. This talk introduces the contours of this crisis, highlights ongoing research with community organizations in the US to imagine alternatives, and reflects on what this means for how we organize urban climate risk management in the Dutch delta. Registration: is mandatory via this link ► After the lectures there will be time for questions/discussion with the speakers and the audience ► Please join and bring your peers, this might be a chance to meet colleagues for new collaborations. ► Click here if you want to subscribe or to unsubscribe from the notifications of Climate Action events ► Follow us on LinkedIn ► Follow us on Instagram TU Delft Climate Action Programme Website Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
