["https://tudelft.nl/cookiebeleid"]
title = "Cookiebeleid"
full_description = "Cookiebeleid De TU Delft maakt gebruik van cookies op haar website. Via deze cookies worden soms ook privacygevoelige gegevens van gebruikers verzameld. In dit cookiebeleid informeren we je over de wijze waarop wij cookies gebruiken, en hoe wij zorgvuldig omgaan met de verzamelde gegevens. De principiële werking van tudelft.nl zal niet wijzigen indien je geen toestemming geeft voor het plaatsen van cookies van derden of analytics-cookies blokkeert. Wat zijn cookies? Een cookie is een klein tekstbestand dat wordt gedownload door uw browser en vervolgens opgeslagen wordt op jouw computer of mobiele device. De opgeslagen informatie is alleen toegankelijk voor de website die de cookie genereert en de cookie is alleen in staat om die informatie op te slaan die je hebt verstrekt op de website. Wij gebruiken onze cookies uitsluitend om informatie te verzamelen over het gebruik van onze diensten en deze te verbeteren en aan te passen aan de wensen van onze bezoekers. Onze analytics-cookies (zie tevens de paragraaf hieronder) bevatten informatie met betrekking tot persoonsidentificatie. Je kunt je browser zo instellen dat je geen cookies ontvangt. Hieronder een aantal links die je kunnen helpen bij het wijzigen van je browserinstellingen: Cookie-instellingen in Internet Explorer Cookie-instellingen in Firefox Cookie-instellingen in Chrome Cookie-instellingen in Microsoft Edge Cookie-instellingen in Safari web en iOS Waar gebruikt TU Delft de cookies voor? Hieronder leggen we uit welke cookies wij gebruiken en voor welke doeleinden. Technische cookies Deze cookies zijn noodzakelijk om de technische werking van onze website mogelijk te maken. Dit gebeurt uitsluitend geanonimiseerd. Analytics-cookies De TU Delft maakt gebruik van analytics-cookies van Siteimprove om te analyseren hoe gebruikers de website gebruiken. Zo kunnen wij verbeteringen in de gebruiksvriendelijkheid van de website doorvoeren. Siteimprove verwerkt uitsluitend via de website verkregen gegevens. De TU Delft heeft de volgende maatregelen genomen om Siteimprove privacyvriendelijk te gebruiken: 1. Er is een verwerkersovereenkomst afgesloten met Siteimprove; 2. Siteimprove mag de gegevens alleen voor door TU Delft gedefinieerde doeleinden gebruiken, en niet voor eigenbepaalde doeleinden (bv. advertentiedoeleinden, benchmarking); De gegevens die wij verwerken met behulp van cookies zijn uitsluitend bestemd voor het optimaliseren van de website. De TU Delft zal de gegevens nooit gebruiken met een ander doel dan om onze website en jouw bezoek te verbeteren. Cookies van derden www.tudelft.nl gebruikt soms content van van derden op de website, onder meer via social media-plugins (Instagram, Twitter e.a.), voor een rijkere gebruikservaring. Via deze content worden soms ook cookies geplaatst. De TU Delft kan deze cookies niet lezen (zoals derden de cookies van de TU Delft ook niet kunnen lezen), en heeft geen invloed op hoe de door derden verzamelde informatie verwerkt en gebruikt wordt. Lees de privacyverklaring van deze derden om te zien wat zij met jouw persoonsgegevens doen. Hieronder een tabel met het overzicht van de cookies op tudelft.nl: Cookie Bewaartermijn Geplaatst door fontsLoaded Sessie TU Delft __cookieNotice_constent 6 maanden TU Delft Nmstat 1 jaar Siteimprove Let op: Dit betreffen alleen de cookies die door tudelft.nl worden gebruikt. Voor informatie over cookies van derden, zie het onderdeel 'Cookies van derden' hierboven. Uw cookie-instellingen Hieronder kunt u aangeven welke cookies u wenst toe te staan. Wilt u uw voorkeuren wijzigen? Klik dan onderaan op het cookie-icoon in het zwarte menu. Strikt noodzakelijk U ontvangt strikt-noodzakelijke cookies, omdat ze nodig zijn voor het juist functioneren van deze website. Deze cookies kunt u niet uitschakelen. Cookies van derden Tudelft.nl maakt op sommige pagina’s gebruik van een externe functionaliteit. Zonder akkoord op het gebruik van cookies van derden zullen we deze functionaliteit voor u inactief maken, om plaatsing van cookies te voorkomen. Deze externe functionaliteiten hebben geen invloed op de principiële werking van de website. Analytics-cookies Om tudelft.nl te optimaliseren, meten wij met behulp van de software van een derde partij (Siteimprove) het bezoek op onze website. Hiervoor gebruiken wij analytics-cookies. Opslaan Toestemming voor gebruik van cookies De TU Delft plaatst technische cookies op grond van het gerechtvaardigd belang. Hierbij is uw expliciete toestemming dus niet nodig. Wel moet de TU Delft voldoen aan de informatieplicht. Daarom informeren wij u bij een bezoek aan onze website over het gebruik van cookies. De TU Delft vraagt expliciet toestemming voor het plaatsen van analytics-cookies en cookies van derden. Uw toestemming blijft maximaal zes maanden geldig. Na maximaal zes maanden vragen wij u dus opnieuw voor toestemming. De principiële werking van tudelft.nl zal niet wijzigen indien u het gebruik van analytics-cookies blokkeert of cookies van derden niet accepteert. Wijzigingen in cookiebeleid Indien zich wijzigingen voordoen in het cookiebeleid van de TU Delft, kunt u opnieuw om toestemming gevraagd worden, ondanks eerder gegeven toestemming. Meer informatie over cookies? Op de volgende websites kan je meer informatie over cookies vinden: www.vpn.nl/faq/cookies-verwijderen Consumentenbond: “Wat zijn cookies?” Consumentenbond: “Cookies verwijderen” Consumentenbond: “Cookies uitschakelen” Your Online Choices: “A guide to online behavioural advertising” Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina"
