["https://tudelft.nl/2025/citg/slim-omgaan-met-zand-en-slib-in-de-waddenzee"]
title = "Slim omgaan met zand en slib in de Waddenzee"
description = "De Waddenzee tussen de Friese kust en Ameland wordt de komende maanden onder de loep genomen door onderzoekers van de TU Delft en Universiteit Utrecht. Meetopstellingen in de geulen en op de wadplaten moeten helderheid geven over de uitwisseling van water, zand en slib. Hoe kunnen we het waardevolle zand en slib in de Waddenzee behouden en de vaarwegen toch toegankelijk houden?"
full_description = 'Slim omgaan met zand en slib in de Waddenzee Nieuws - 11 februari 2025 - Webredactie De Waddenzee tussen de Friese kust en Ameland wordt de komende maanden onder de loep genomen door onderzoekers van de TU Delft en Universiteit Utrecht. Meetopstellingen in de geulen en op de wadplaten moeten helderheid geven over de uitwisseling van water, zand en slib. Hoe kunnen we het waardevolle zand en slib in de Waddenzee behouden en de vaarwegen toch toegankelijk houden? De onderzoekers willen de vorming van geulen en wadplaten beter begrijpen. In de vaarwegen in de Waddenzee is namelijk te veel zand en slib. Door te baggeren worden de geulen toegankelijk gehouden voor veerboten en andere schepen. Toch is het waardevol om dit zand en slib te koesteren, omdat het nodig is om mee te groeien met de zeespiegelstijging en het zorgt voor een uniek en waardevol intergetijdengebied. Slim baggeren Roy van Weerdenburg, promovendus Kustwaterbouwkunde bij de TU Delft, volgt de komende tijd de bewegingen van zand en slib in de Waddenzee. “Zand en slib ligt afwisselend op de platen en in de geulen, maar eigenlijk zijn er veel aspecten aan deze uitwisseling die we nog niet goed genoeg begrijpen. We willen die kennis bijvoorbeeld gebruiken om locaties aan te wijzen waar het gebaggerde slib langer blijft liggen of juist verder de Waddenzee ingaat. Zo hopen we dat de hoeveelheid slib die binnen de kortste keren weer in de vaargeul belandt afneemt." Rijkswaterstaat volgt het onderzoek met veel interesse en hoopt op nieuwe inzichten om de geulen op duurzamere wijze bevaarbaar te houden. Plaklaag Van Weerdenburg is vooral nieuwsgierig naar het effect van rustige periodes zonder stormen. Slib dat een zomer lang op de wadplaten ligt is vaak veel sterker, mede door een plakkerige laag van algenmatten. “Als we meer weten over deze plaklaag kan er rekening mee worden gehouden tijdens het baggeren en verspreiden van slib, zodat het tijdens de stormachtige wintermaanden beter op de wadplaten blijft liggen.” Mobiel lab Om deze vragen te beantwoorden staan er de komende twee maanden frames in de geul en op de wadplaten die onder andere de stroomsnelheid en de concentraties zand en slib in het water meten. Ook gaat Van Weerdenburg bodemmonsters van de wadplaten nemen voor erosieproeven. Die neemt hij voorzichtig mee naar het mobiele lab van de TU Delft, dat voor de gelegenheid op de veerdam in Holwerd staat. Onder gecontroleerde omstandigheden test hij hier hoe het sediment in beweging komt onder invloed van stromend water. Uiteindelijk wordt de data verwerkt in modellen, waarmee verschillende toekomstscenario’s nader onderzocht kunnen worden. Deze meetcampagne is onderdeel van het NWO Perspectiefprogramma WadSED, onder leiding van de Universiteit Utrecht. Binnen het project werken verschillende kennisinstellingen, bedrijven, natuurorganisaties en overheidsinstanties samen om slimmer om te gaan met zand en slib. Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'
