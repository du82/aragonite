title = "Smeltende gletsjers versnellen zeespiegelstijging en brengen drinkwatervoorziening in gevaar"
description = "Over de hele wereld smelten gletsjers. Afgelopen tien jaar zijn gletsjers in meer bevolkte gebieden, zoals Europa, veel harder gaan smelten dan daarvoor. Dit zorgt niet alleen voor een versnelde zeespiegelstijging, maar is ook alarmerend voor de zoetwatervoorraad. Een internationale groep onderzoekers verzamelde gegevens van al die gletsjers, Antarctica en Groenland daar gelaten. Het onderzoek is onlangs gepubliceerd in Nature."
full_description = "Smeltende gletsjers versnellen zeespiegelstijging en brengen drinkwatervoorziening in gevaar Nieuws - 20 februari 2025 - Webredactie Over de hele wereld smelten gletsjers. Afgelopen tien jaar zijn gletsjers in meer bevolkte gebieden, zoals Europa, veel harder gaan smelten dan daarvoor. Dit zorgt niet alleen voor een versnelde zeespiegelstijging, maar is ook alarmerend voor de zoetwatervoorraad. Een internationale groep onderzoekers verzamelde gegevens van al die gletsjers, Antarctica en Groenland daar gelaten. Het onderzoek is onlangs gepubliceerd in Nature. Alle relatief kleine gletsjers samen (want die van Antarctica en Groenland zijn niet meegerekend) verloren tussen 2000 en 2023 gemiddeld zo’n 5% van hun volume. Dit komt neer op een verlies van 273 miljard ton ijs, dat is ruim twee keer zoveel als het verlies op Antarctica. In Centraal Europa, denk bijvoorbeeld aan de Alpen, ging zelfs 39% van de ijsmassa verloren. Steeds meer verlies Er komt natuurlijk niet elk jaar evenveel smeltwater naar beneden. Maar het patroon dat zichtbaar wordt noemen de onderzoekers schokkend. Tussen 2012 en 2023 ging er veel meer ijs verloren (36% meer smeltwater) in vergelijking met het decennium daarvoor. Die toename is zorgelijk, en niet alleen vanwege het stijgen van de zeespiegel, zegt Bert Wouters. “Het smelten van deze gletsjers gaan we echt heel direct merken. Omdat ze deels in gebieden liggen waar veel mensen wonen heeft het gevolgen voor de drinkwatervoorzieningen, vooral in Zuid-Amerika en Azië. Het risico op overstromingen na het smeltseizoen vormt ook een gevaar.” Wereldwijde smeltgegevens combineren Bert Wouters is Universitair Hoofddocent Geoscience and Remote Sensing bij de TU Delft en zorgde ervoor dat de gegevens uit de vele onderzoeken samen tot een gedegen schatting leidde. “Vooral van de toegankelijke gletsjers hebben we veldmetingen. Van al die andere gletsjers hebben we data van satellieten. De methoden en dus ook de schattingen van het smeltwater lagen vaak ver uit elkaar. Het was een grote uitdaging om er wetenschappelijk gezien een geheel van te maken.” Het lukte het team van onderzoekers, onderdeel van het Glacier Mass Balance Intercomparison Exercise (Glambie). Dat resulteerde in een tijdreeks van veranderingen in de gletsjermassa voor alle gletsjergebieden wereldwijd van 2000 tot 2023. The GlaMBIE Team (2025): Community estimate of global glacier mass changes from 2000 to 2023. Nature. https://doi.org/10.1038/s41586-024-08545-z Header photo by Sentinel Hub Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina"
year_published = 2025
