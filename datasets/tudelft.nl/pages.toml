["https://tudelft.nl/2025/tu-delft/kwartaalrapportage-en-uitvoeringsplan-aangeboden-aan-onderwijsinspectie"]
title = "Kwartaalrapportage en uitvoeringsplan aangeboden aan onderwijsinspectie"
full_description = '''Kwartaalrapportage en uitvoeringsplan aangeboden aan onderwijsinspectie Nieuws - 31 januari 2025 - Webredactie Communication Vandaag heeft TU Delft de kwartaalrapportage over Q4 2024 en het uitvoeringsplan Sociale Veiligheid en Integriteit aangeboden aan de Inspectie van het Onderwijs. Kwartaalrapportage In de kwartaalrapportage blikt de universiteit terug op de periode oktober tot en met december 2024. Het rapport biedt een overzicht van de voortgang en resultaten van de initiatieven en de lessen die zijn getrokken in het bevorderen van sociale veiligheid en integriteit. De afgelopen periode hebben mensen uit de hele universiteit hard gewerkt aan verschillende initiatieven op het gebied van preventie, bewustzijn, signalering, handhaving en nazorg, die deel uitmaken van het Programma Sociale Veiligheid en Integriteit. De kwartaalrapportage geeft hiervan een update en zoomt in op onder andere de lessen uit en reacties op Mindlab, de voortgang op de ontwikkeling van een centraal Meldpunt, de aanstaande lancering (3 februari 2025) van de bewustwordingscampagne "Acceptable? Or not?", de introductie van innovatieve trainingsprogramma's zoals “License to Lead” en de voortgang op de ontwikkeling van een nieuwe gedragscode. Uitvoeringsplan In het uitvoeringsplan blikt de universiteit vooruit. Op basis van het "Plan for Change" van mei 2024 zijn ambities uitgewerkt en vertaald in uitvoerbare doelstellingen als basis voor een praktische en meetbare aanpak om de structuren, systemen en cultuur binnen de organisatie te verbeteren. Met dit plan ligt er een stevig fundament voor de noodzakelijke stappen om een sociaal veilige en integere omgeving voor alle medewerkers en studenten te realiseren en te behouden zo schrijft het College van Bestuur aan de inspectie. Het bestuur zoomt ook in op eigen reflecties. “Vele uitwisselingen met andere universiteiten en organisaties, het doorlopen van persoonlijke coaching trajecten en vele gesprekken met en in de organisatie hebben ons diepgaande inzichten en reflecties opgeleverd. We trekken waardevolle lessen uit de ervaringen die we meekrijgen uit Mindlab en Share & Care en zijn diepgeraakt door de open en persoonlijke gesprekken tijdens de CvB-inloopspreekuren, waarin we samen kwetsbaar durven te zijn”, aldus het CvB. Duurzame verandering Ook vraagt de universiteit begrip en ruimte voor de noodzaak van een zorgvuldige uitrol van de plannen. Het blijft maatwerk dat zich niet eenvoudig in een actieplan laat vertalen en om een stapsgewijze omslag van de organisatie vraagt. “Het is een proces van de lange adem, waarbij we gestaag de stap maken naar een duurzaam systeem van integriteit en sociale veiligheid en tegelijkertijd in het bestaande systeem moeten blijven anticiperen op zaken die spelen. Dat betekent dat processen nu nog kunnen schuren, vertragen en soms meer (implementatie)tijd vragen dan we graag zouden willen zien, maar we hebben alle vertrouwen in het ingezette proces. We leren van de ervaringen die we opdoen en de feedback die we krijgen. En we sturen bij waar nodig. Het is een continu proces, dat ons volle commitment heeft”. Meer informatie Lees de volledige brief aan de Inspectie van het Onderwijs en beide rapporten via onderstaande links. De begeleidende brief namens het CvB aan de Inspectie van het Onderwijs De leeswijzer bij de kwartaalrapportage en het uitvoeringsplan De kwartaalrapportage Q4 2024 Sociale Veiligheid en Integriteit Het uitvoeringsplan Sociale Veiligheid en Integriteit Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
