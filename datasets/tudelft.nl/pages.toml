 Engelse versie van de website is: https://www.tudelft.nl/en. Privacybeleid De TU Delft verwerkt persoonsgegevens en gebruikt cookies voor deze website. In dit Privacy Statement informeren we u over de doeleinden waarvoor de TU Delft persoonsgegevens verwerkt en over het uitoefenen van uw privacyrechten. Tevens wordt verdere informatie verstrekt die voor u van belang kan zijn. Cookies De TU Delft maakt op haar website gebruik van zogenaamde ‘cookies’, kleine bestandjes die op uw computer, tablet of smartphone wordt opgeslagen. Cookies worden onder andere gebruikt om u bij een later gebruik te identificeren en om toegang te verschaffen tot bepaalde delen van de TU Delft website. Vrijwel alle internetbrowsers zoals Microsoft Internet Explorer, FireFox en Safari, bieden de gebruikers de mogelijkheid om ‘cookies’ te accepteren of om deze te weigeren. Vastleggen en beveiliging van gegevens De TU Delft maakt gebruik van veiligheidsprocedures om te voorkomen dat onbevoegden toegang krijgen tot vertrouwelijke informatie op de website zoals gegevens omtrent bezoekersaantallen en bezoekersgedrag. Podcasts en vodcasts TU Delft ontwikkelt podcasts en vodcasts teneinde technisch, academisch materiaal beschikbaar te maken voor een breder publiek. Dit materiaal is samengesteld door docenten en wordt als zodanig gebruikt in de opleidingen die op de website worden aangeboden. De docenten (en/of aangewezen collega’s), studenten of andere personen zijn zelf verantwoordelijk voor het materiaal dat ze produceren. Het materiaal kan tekst of afbeeldingen bevatten die aanstootgevend kunnen zijn voor sommige mensen. Dergelijk materiaal wordt echter enkel gepubliceerd voor academische doeleinden en is niet bedoeld om de religieuze, politieke, humane of maatschappelijke opvattingen van wie dan ook te bekritiseren. Intellectueel eigendom TU Delft doet alles wat in zijn macht ligt om met de rechtmatige eigenaar van digitale tekst en afbeeldingen tot een schriftelijke overeenkomst te komen over het gebruik ervan. In sommige gevallen is dit echter niet mogelijk, omdat een of meer van de rechtmatige eigenaars of erfgenamen van het intellectueel eigendom niet kunnen worden achterhaald. Mocht u van mening zijn dat de tekst of digitale objecten die door TU Delft gepubliceerd zijn op een van de communicatiekanalen van de universiteit uw rechten schaadt, dan kunt u contact opnemen met info@tudelft.nl. Vermeld in de e-mail de titel van het betreffende item, het communicatiekanaal en om welk materiaal het gaat. Indien geen andere overeenkomst bereikt kan worden, wijzigt of verwijdert TU Delft het materiaal in zulke gevallen. Hiervan wordt melding gemaakt in het betreffende materiaal. Hoewel het cursusmateriaal met de grootste zorg is samengesteld, aanvaarden de auteurs noch TU Delft aansprakelijkheid voor onvolledigheid, (druk)fouten of onnauwkeurigheden, of voor de gevolgen die hieruit voortvloeien. Deze website is ontwikkeld voor educatieve en maatschappelijke doeleinden zonder winstoogmerk. Daarom wordt niet betaald voor materiaal dat wordt aangeleverd voor publicatie en verwijzing op de site. TU Delft aanvaardt geen aansprakelijkheid voor oneigenlijk gebruik van deze website, of eventuele schade die voortkomt uit het gebruik ervan. Auteursrecht De teksten en afbeeldingen op de TU Delft website mogen niet zonder voorafgaande schriftelijke toestemming worden gekopieerd of gewijzigd, of op enigerlei andere wijze worden gebruikt. Het intellectuele eigendomsrecht van de TU Delft website (waaronder teksten, ontwerp, foto’s, video’s en logo’s) berust bij de TU Delft. De TU Delft respecteert natuurlijk ook het auteursrecht van derden. Mocht u van mening zijn dat de informatie op de website van de TU Delft uw rechten schaadt, dan wordt u verzocht om contact op te nemen via info@tudelft.nl. Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina"
