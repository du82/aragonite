["https://tudelft.nl/evenementen/2024/tnw/betasteunpunt/vier-pi-dag-bij-tu-delft"]
title = "Vier Pi-dag bij TU Delft"
full_description = '''Vier Pi-dag bij TU Delft 14 maart 2025 15:14 t/m 18:00 - Door: Bètasteunpunt Zuid-Holland | Zet in mijn agenda (function () { const config = {"name":"Vier Pi-dag bij TU Delft","description":"","startDate":"2025-03-14","endDate":"2025-03-14","startTime":"15:14","endTime":"18:00","options":["Apple","Google","iCal","Microsoft365","MicrosoftTeams","Outlook.com","Yahoo"],"timeZone":"Europe\/Amsterdam","trigger":"click","iCalFileName":"Vier-Pi-dag-bij-TU-Delft","location":""}; const button = document.querySelector('#addToCalendarLink'); button.addEventListener('click', () => atcb_action(config, button)); }()); Zie je iets ronds, dan denk je aan π. Maar wist je dat π ook op allerlei plekken binnen en buiten de wiskunde opduikt waar op het eerste gezicht niets ronds te ontdekken valt? Tijdens deze π -middag behandelen we weer enkele spectaculaire voorbeelden van onverwachte verschijningen van ons favoriete getal. Sommige voorbeelden kun je in je wiskundelessen gebruiken en bij andere voorbeelden kun je gewoon lekker achteroverleunen en genieten van het grote raadsel π. Programma We verzamelen om 15 uur buiten voor het EWI gebouw. Om 15:14 uur heten we je graag welkom bij de feestelijke aftrap door prof. Kees Vuik, afdelingshoofd van het Delft Institute of Applied Mathematics (DIAM). Na een korte inleiding over het grote raadsel dat het getal π al sinds de oudheid is neemt onze bevlogen π-specialist Dr. Jeroen Spandaw ons ook dit jaar weer mee in een interactieve presentatie waarin π de hoofdrol heeft. We nemen ruim de tijd om proefondervindelijk onverwachte verschijningen van π te ervaren en insπiratie op te doen voor de lespraktijk. We sluiten de feestelijke viering van π-dag af met een netwerkborrel die tot ongeveer 18:00 zal duren. We kijken uit naar je komst! 15:00 uur iedereen verzamelen buiten voor EWI gebouw 15:14 Feestelijke aftrap Pi-dag door prof. Kees Vuik, afdelingshoofd van het Delft Institute of Applied Mathematics (DIAM) (met hapje en drankje) 15:45 – 16:30 π-lezing voor docenten door Dr. Jeroen Spandaw (Snijderszaal) 16:45 – 18:00 napraten met door pi geïnspireerde netwerkborrel Doel & resultaat Inspiratie voor wiskunde met π in de hoofdrol π-dag, de veertiende dag van de derde maand wordt wereldwijd op wiskundeafdelingen van universiteiten gevierd. De cijfervolgorde is in navolging van de datumnotatie jaar/maand/dag, bijvoorbeeld 2025/03/14. De driecijferige benadering voor π is namelijk 3,14. Datum, tijd en locatie Vrijdag 14 maart 2025 15:14 - 18:00 uur Locatie: TU Delft (gebouw 36) Elektrotechniek, Wiskunde en Informatica, Mekelweg 4 Delft Meld je hier aan voor Pi-dag 2025 Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
