title = "Delft University of Technology | TU Delft | Challenge. Change. Impact!"
description = """
Smart AI coach helps smokers quit using Reinforcement Learning                                                                        Today, Nele Albers defends her doctoral dissertation on using AI coaches to help smokers quit smoking and vaping. She developed an AI coach that uses psychologically informed Reinforcement Learning (RL), a form of machine learning in which a model learns through rewards, similar to how humans learn behaviors. Albers based her research on insights from behavior change theories and data from three large-scale studies with more than 500 participants each."""
full_description = '''Impact for a better society Carousel Impact for a better society Student Pravesha advocates for better inclusion and social safety Interview | From raising concerns to real change Read more Involving Dutch residents in the energy transition Story of Science | No home left behind Read more How the sun can shine for green energy from the sea Student Story | Sophie simulated a floating solar farm during her master's project Read more Putting public transport on the right track Story of Science | Solutions for a public transport system that is optimised for travellers and society Read more Our societal challenges Our societal challenges News Nieuws Smart AI coach helps smokers quit using Reinforcement Learning Today, Nele Albers defends her doctoral dissertation on using AI coaches to help smokers quit smoking and vaping. She developed an AI coach that uses psychologically informed Reinforcement Learning (RL), a form of machine learning in which a model learns through rewards, similar to how humans learn behaviors. Albers based her research on insights from behavior change theories and data from three large-scale studies with more than 500 participants each. New research reveals Mars’ young northern ice cap and the surprises below its surface A group of researchers from TU Delft and the Institute for Planetary Research of the German Aerospace Center have been able to the determinate the Mars’s interior structure and the age of the large ice sheet covering its north pole. They have published their findings in Nature. The team used the same geophysical trick on Mars that geologists use here on Earth to: measure how large areas of land are deformed by the ice sheet that presses down on the planet itself. That in turn says a lot about the material and structure underneath all that ice. Melting glaciers accelerate sea level rise and put drinking water supply at risk Glaciers are melting around the world. Last decade, the loss of ice in the more populated regions, such as Europe, increased at ever-faster rates. This not only accelerates sea level rise, but is also endangers freshwater supplies. An international group of researchers combined data from all those glaciers, excluding Antarctica and Greenland. The study was recently published in Nature. A smart approach to sand and silt in the Wadden Sea During the next few months, the Wadden Sea between the Friesian coast and Ameland will be the subject of a project undertaken by researchers from TU Delft and Utrecht University. Measuring equipment in the gullies and mudflats will help explain the interaction of water, sand, and silt. How can we keep the valuable sand and silt in the Wadden Sea, but at the same time keep the navigation routes open? High-accuracy digital rail crossing inspection The Dutch railway network has more than seven thousand track switches and crossings. These components are prone to wear and frequently require labour-intensive repairs. Within the XCross research consortium, TU Delft is working with other partners to optimise the inspection and maintenance process. The project recently received funding from the European Union. TU Delft receives grant for nuclear education and research Bringing machine learning into the real world We constantly hear about the ‘AI revolution’ and the ‘digital transformation’. This is being driven by rapid advances from the field of machine learning (ML), such as those enabling autonomous vehicles, ChatGPT, DeepSeek and even predicting extreme weather events. But how do these innovations move from fundamental research to real-world impact? Geert-Jan Houben explores this question with the co-directors of the ELLIS Unit Delft: Frans Oliehoek and Jens Kober. Quarterly Report and implementation Plan for Social Safety sent to Inspection Upon the departure of the Vice Rector Magnificus last year, a possible new governance model for TU Delft was discussed in the run-up to the recruitment of a new Executive Board member. It was considered whether the current combination of Rector Magnificus and President of the Executive Board (EB) was still appropriate, or whether these two positions should be assigned to two different EB members. TU Delft develops 3D-printed brain-like environment that promotes neuron growth Key cells in the brain, neurons, form networks by exchanging signals, enabling the brain to learn and adapt at incredible speed. Researchers of the University of Technology in Delft (TU Delft) have developed a 3D-printed ‘brain-like environment’ where neurons grow similarly to a real brain. More collaboration, less litter: education and city join forces against trash On a cold December morning, first-year Landscape and Environment Management students from Inholland University of Applied Sciences teamed up with the municipality for a waste excursion in Delft-West. They toured the neighborhood, picked up some litter here and there, and witnessed – with wide eyes and pinched noses – how garbage trucks dumped their haul at Avalex. Not long after, students from ProGrotius set off on their own waste safari in the neighborhood, while a TU Delft student conducted research at Avalex to improve glass recycling processes. Go to previous item Go to next item More news More news Events For everyone 3 maart: Critical Mass Sessions | Colonialism and language For everyone 3 March - 7 March: Open Education Week 2025 For everyone 3 - 7 March: BK Feminist Week For everyone 4 March: Kick-off event: Heat press For everyone 10 March: International Women's Day For everyone 13 March: Climate Action Programme lecture 'Climate Finance' For everyone 14 March: Pi day For everyone 17 March: Health Week X (Monday) For everyone 18 March: Best Climate Action and Energy Paper 2024 For everyone 25 March - 1 April: AccessAbility Week For everyone 29 March: For Love of the World: Philosophy, Technology and Art Festival Go to previous item Go to next item More events More events // Split carousel description by | 