title = "TU Delft | Technische Universiteit Delft | Challenge. Change. Impact!"
description = """
Slimme AI-coach helpt rokers stoppen met behulp van Reinforcement Learning                                                                        Vandaag verdedigt Nele Albers haar proefschrift over de inzet van AI-coaches bij het stoppen met roken en vapen. Ze ontwikkelde een AI-coach die gebruikmaakt van psychologisch geïnformeerde Reinforcement Learning (RL), een vorm van machine learning waarbij een model leert door middel van belonen, vergelijkbaar met hoe mensen gedrag aanleren. Albers baseerde haar onderzoek op inzichten uit gedragsveranderingstheorieën en gegevens uit drie grootschalige studies met elk meer dan 500 deelnemers."""
full_description = '''Impact for a better society Carousel Impact for a better society Studente Pravesha pleit voor betere inclusie en sociale veiligheid Interview | Van zorgen uiten naar echte verandering Lees meer Betrekken van Nederlandse inwoners bij de energietransitie Story of Science | Een rol voor elk huis Lees meer Hoe de zon kan gaan schijnen voor groene stroom vanaf zee Student Story | Sophie simuleerde een drijvend zonnepark tijdens haar afstudeerproject Lees meer Het OV op het juiste spoor zetten Story of Science | Oplossingen voor een optimaal ov-systeem voor reiziger en maatschappij Lees meer Onze maatschappelijke uitdagingen Onze maatschappelijke uitdagingen Nieuws Nieuws Slimme AI-coach helpt rokers stoppen met behulp van Reinforcement Learning Vandaag verdedigt Nele Albers haar proefschrift over de inzet van AI-coaches bij het stoppen met roken en vapen. Ze ontwikkelde een AI-coach die gebruikmaakt van psychologisch geïnformeerde Reinforcement Learning (RL), een vorm van machine learning waarbij een model leert door middel van belonen, vergelijkbaar met hoe mensen gedrag aanleren. Albers baseerde haar onderzoek op inzichten uit gedragsveranderingstheorieën en gegevens uit drie grootschalige studies met elk meer dan 500 deelnemers. Nieuw onderzoek onthult verrassingen onder de jonge noordelijke ijskap van Mars Een groep onderzoekers van de TU Delft en het Institute for Planetary Research van het Duitse Lucht- en Ruimtevaartcentrum is erin geslaagd om de inwendige structuur van Mars en de leeftijd van de grote ijskap die haar noordpool bedekt te bepalen. Ze hebben hun bevindingen gepubliceerd in Nature. Het team gebruikte op Mars dezelfde geofysische truc die geologen hier op aarde gebruiken: meten hoe grote stukken land zijn vervormd door de ijskap die op de planeet drukt. Dat zegt weer veel over het materiaal en de structuur onder al dat ijs. Start VPdelta-programma 2025-2029 In 2012 ging het eerste Valorisatieprogramma Deltatechnologie en Water, nu bekend als VPdelta, van start. Vele onderzoeken, opschalingen en samenwerkingen verder, is het programma uitgegroeid tot een sterk netwerk met impactvolle innovaties voor een klimaatbestendige regio. Smeltende gletsjers versnellen zeespiegelstijging en brengen drinkwatervoorziening in gevaar Over de hele wereld smelten gletsjers. Afgelopen tien jaar zijn gletsjers in meer bevolkte gebieden, zoals Europa, veel harder gaan smelten dan daarvoor. Dit zorgt niet alleen voor een versnelde zeespiegelstijging, maar is ook alarmerend voor de zoetwatervoorraad. Een internationale groep onderzoekers verzamelde gegevens van al die gletsjers, Antarctica en Groenland daar gelaten. Het onderzoek is onlangs gepubliceerd in Nature. Nieuwe proeftuin Office Lab helpt het verduurzamen van kantoorgebouwen te versnellen Slim omgaan met zand en slib in de Waddenzee De Waddenzee tussen de Friese kust en Ameland wordt de komende maanden onder de loep genomen door onderzoekers van de TU Delft en Universiteit Utrecht. Meetopstellingen in de geulen en op de wadplaten moeten helderheid geven over de uitwisseling van water, zand en slib. Hoe kunnen we het waardevolle zand en slib in de Waddenzee behouden en de vaarwegen toch toegankelijk houden? Precisiewerk met digitale inspectie van spoorweg-kruisingen Het Nederlandse spoor kent meer dan zevenduizend wissels en kruisingen. Deze zijn gevoelig voor slijtage en hebben regelmatig arbeidsintensieve reparaties nodig. Binnen het onderzoeksconsortium XCross werkt de TU Delft met andere partners aan optimalisatie van het inspectie- en onderhoudsproces. Het project kreeg onlangs financiering van de Europese Unie. TU Delft ontvangt subsidie voor nucleair onderwijs en onderzoek De introductie van machine learning in het dagelijks leven We horen voortdurend over de 'AI-revolutie' en 'digitale transformatie' en zien overal om ons heen op AI gebaseerde robots en software. Deze ontwikkelingen zijn het resultaat van de snelle innovaties in het vakgebied machine learning, zoals zelfrijdende auto’s, ChatGPT, DeepSeek en zelfs het voorspellen van extreme weersomstandigheden. Maar hoe ontwikkelen deze innovaties zich van fundamenteel onderzoek tot onderdeel van het dagelijks leven? Geert-Jan Houben bespreekt deze vraag met de twee codirecteuren van de ELLIS Unit Delft: Frans Oliehoek en Jens Kober. Kwartaalrapportage en uitvoeringsplan aangeboden aan onderwijsinspectie Met het vertrek van de Vice Rector Magnificus afgelopen najaar is er, in aanloop naar het werven van een nieuw CvB-lid, gesproken over een eventueel nieuw bestuursmodel voor de TU Delft. Er is gekeken of de huidige combinatie van Rector Magnificus en voorzitter College van Bestuur (CvB) nog steeds gewenst is, of dat deze twee functies bij twee verschillende CvB-leden moeten worden belegd. Ga naar vorig item Ga naar volgend item Meer nieuws Meer nieuws Evenementen Voor iedereen 3 maart: Critical Mass Sessions | Kolonialisme en taal: Wie claimt het verhaal? Voor iedereen 3 maart - 7 maart: Open Education Week 2025 Voor iedereen 3 - 7 maart: BK Feminist Week Voor iedereen 4 maart: Kick-off event: Hittepers Voor iedereen 10 maart: International Women's Day Voor iedereen 13 maart: Climate Action Programme lecture 'Climate Finance' Voor iedereen 14 maart: Pi-dag Voor iedereen 17 maart: Health Week X (maandag) Voor iedereen 18 maart: Best Climate Action and Energy Paper 2024 Voor iedereen 25 maart - 1 april: AccessAbility Week Voor iedereen 29 maart: For Love of the World: Philosophy, Technology and Art Festival Ga naar vorig item Ga naar volgend item Meer evenementen Meer evenementen // Split carousel description by | symbol var carouselTitle = document.getElementsByClassName("sliderCentered-itemDescription"); for (let i = 0; i < carouselTitle.length; i++) { var splitTitle = carouselTitle[i].innerHTML.split(" | "); if(splitTitle.length == 2) { carouselTitle[i].innerHTML = splitTitle[1]; let newItem = document.createElement("div"); newItem.innerHTML = splitTitle[0]