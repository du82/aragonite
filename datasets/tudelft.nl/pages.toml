["https://tudelft.nl/2025/tu-delft/nieuw-onderzoek-onthult-verrassingen-onder-de-jonge-noordelijke-ijskap-van-mars"]
title = "Nieuw onderzoek onthult verrassingen onder de jonge noordelijke ijskap van Mars"
description = "DLR Institute of Planetary Research"
full_description = "Nieuw onderzoek onthult verrassingen onder de jonge noordelijke ijskap van Mars Nieuws - 26 februari 2025 - Webredactie Communication Een groep onderzoekers van de TU Delft en het Institute for Planetary Research van het Duitse Lucht- en Ruimtevaartcentrum is erin geslaagd om de inwendige structuur van Mars en de leeftijd van de grote ijskap die haar noordpool bedekt te bepalen. Ze hebben hun bevindingen gepubliceerd in Nature. Het team gebruikte op Mars dezelfde geofysische truc die geologen hier op aarde gebruiken: meten hoe grote stukken land zijn vervormd door de ijskap die op de planeet drukt. Dat zegt weer veel over het materiaal en de structuur onder al dat ijs. Korte samenvatting: De 3 km dikke ijskap die de noordpool van Mars bedekt is jong en 2 tot 12 miljoen jaar geleden gevormd De ijskap buigt de rotskorst met een snelheid van 0,13 millimeter per jaar. De mantel van Mars is stijf en heeft een viscositeit die tien tot honderd keer hoger is dan op aarde. Aandachtspunten: Planetair onderzoek, Mars, ruimtevaart Terugveren na ijs Wist je dat Scandinavië een paar millimeter per jaar uit zee oprijst? Dit komt door de zogenaamde glaciale isostatische aanpassing. Dit deel van de aarde was ooit bedekt met kilometers ijs tijdens de laatste ijstijd, zo'n 20.000 jaar geleden. Deze dikke ijsblokken hebben het aardoppervlak ooit vervormd en gebogen. Na de ontdooiing kwam het oppervlak langzaam weer omhoog. Door dit te meten hebben geologen kunnen vaststellen wat eronder zit: de viscositeit van de aardmantel en de effecten daarvan op de zwaartekracht. Soortgelijke processen op andere planeten zijn tot nu toe niet gedocumenteerd. ESA-missies wijzen de weg In 2003 en 2005 werden twee ruimtevaartuigen van ESA (Mars Express) en NASA (Mars Reconnaissance Orbiter) naar Mars gestuurd, uitgerust met radarsondes. Deze sondes brachten de noordelijke poolkap van Mars in kaart en maakten het mogelijk om de vorm van het grensvlak tussen ijs en vast gesteente in beeld te brengen. De noordpool van Mars wordt bedekt door een ijskap die voornamelijk uit puur waterijs bestaat en die een diameter van 1000 kilometer en een dikte van ongeveer drie kilometer heeft. Verrassend genoeg waren grote ijskappen 20.000 jaar geleden in staat om het oppervlak van de aarde aanzienlijk te vervormen, terwijl het oppervlak van Mars niet vervormd leek door zo'n grote ijsmassa. De Chasma Boreale op de noordpool van Mars is een ravijn van ongeveer 500 kilometer lang en op sommige plekken wel 2 kilometer diep. Credit: ESA/DLR/FU Berlin, NASA MGS MOLA Science Team Waarom het oppervlak van Mars zo stijf en onvervormd is gebleven, is al tientallen jaren onduidelijk. “De vorming van ijs op Mars verschilt van die op aarde door het verschil in baan rond de zon,” stelt Bart Root, assistent-professor Planetary Exploration aan de TU Delft en lid van het onderzoeksteam. “Er zijn natuurlijk ook verschillen in temperatuur en druk, die beide lager zijn op Mars dan op aarde. We weten bijvoorbeeld ook dat ijs op Mars grotendeels uit CO2 bestaat.” Het verrassende binnenste van de rode planeet Door radargegevens te combineren met schattingen van het in de tijd variabele zwaartekrachtsveld van Mars en metingen van de InSight seismometer, kan het team onder leiding van dr. Adrien Broquet onthullen dat de sleutel tot dit raadsel tijd is. Het binnenste van Mars is zo stroperig en koud dat het oppervlak nog geen tijd heeft gehad om volledig te vervormen. Met behulp van numerieke simulaties schat de groep dat de noordpool van Mars momenteel naar beneden zakt met een snelheid van hooguit 0,13 millimeter per jaar. Hiervoor moet de viscositeit van de mantel van Mars tien tot honderd keer groter zijn dan op aarde en dit wijst erop dat het binnenste van de rode planeet vandaag extreem koud is. “Hoewel de noordpool van Mars naar schatting koud is, zijn onze modellen nog steeds in staat om de aanwezigheid van lokale smeltzones in de korst en dicht bij de evenaar te voorspellen”, zegt Dr. Breuer, co-auteur van het onderzoek. Het binnenste van Mars zit vol verrassingen: met een schijnbaar koude noordpool vergeleken met de vulkanisch actieve equatoriale gebieden, zoals gemonitord door orbiters en de InSight lander. Dit thermische evolutiemodel illustreert de dynamica onder de oppervlakte van Mars. Warme kleuren geven hete thermische anomalieën aan (zogenaamde mantelopwellingen of mantelpluimen) die warmte van het diepe binnenste naar het oppervlak transporteren. De koude kleuren duiden op koud materiaal dat zinkt en het binnenste van de planeet afkoelt. Nieuwe wetenschappelijke resultaten tonen aan dat de mantel van Mars zeer visceus is. Het oppervlak is gebaseerd op de Viking Global Colour Mosaic kaart. Credit: DLR Jong ijs en nieuwe mogelijkheden De ijskap die de noordpool van Mars bedekt, moet aanzienlijk jonger zijn dan alles van die omvang dat momenteel op Mars te zien is. Met een geschatte leeftijd van 2 tot 12 miljoen jaar is de ijskap die de noordpool van Mars bedekt daarom een goede kandidaat om de jongste en grootste eigenschap te vertegenwoordigen die we op de rode planeet zien. Het werk van Broquet, Breuer, Root en collega's is het eerste dat glaciale isostatische aanpassing op een andere planeet documenteert en heeft diepgaande implicaties voor ons begrip van het inwendige en de geologische evolutie van Mars. In de afgelopen jaren zijn er meerdere GRACE-achtige zwaartekrachtmissies naar Mars voorgesteld, zoals Oracle en MaQuIs. Naast het begrijpen van het klimaat van de planeet hebben toekomstige zwaartekrachtmissies nu een nieuw doel: nieuwe metingen doen van het stijgen en dalen van Mars. Root: “Ik ben vooral enthousiast over het concept van MaQuls, waarbij we kwantumtechnologie gebruiken om het zwaartekrachtsveld van Mars veel nauwkeuriger in kaart te brengen. Maar wat nog belangrijker is, is dat kwantumtechnologie ons in staat zal stellen om naar veranderingen in het zwaartekrachtsveld te kijken. En dit zal een hele nieuwe golf van onderzoek op gang brengen, omdat we dan kunnen kijken naar de meer dynamische processen onder het oppervlak van Mars.” Nature publication Glacial isostatic adjustment reveils Mars’ interior viscosity structure. DOI: 10.1038/s41586-024-08565-9 Bart Root Assistant-Professor Planetary Exploration DLR Institute of Planetary Research Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina"
