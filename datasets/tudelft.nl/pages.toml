["https://tudelft.nl/2025/citg/precisiewerk-met-digitale-inspectie-van-spoorweg-kruisingen"]
title = "Precisiewerk met digitale inspectie van spoorweg-kruisingen"
description = "Het Nederlandse spoor kent meer dan zevenduizend wissels en kruisingen. Deze zijn gevoelig voor slijtage en hebben regelmatig arbeidsintensieve reparaties nodig. Binnen het onderzoeksconsortium XCross werkt de TU Delft met andere partners aan optimalisatie van het inspectie- en onderhoudsproces. Het project kreeg onlangs financiering van de Europese Unie."
full_description = 'Precisiewerk met digitale inspectie van spoorweg-kruisingen Nieuws - 10 februari 2025 - Webredactie Het Nederlandse spoor kent meer dan zevenduizend wissels en kruisingen. Deze zijn gevoelig voor slijtage en hebben regelmatig arbeidsintensieve reparaties nodig. Binnen het onderzoeksconsortium XCross werkt de TU Delft met andere partners aan optimalisatie van het inspectie- en onderhoudsproces. Het project kreeg onlangs financiering van de Europese Unie. Kruisingen van spoorrails zijn de zwakke schakels in het systeem en hebben veel te lijden onder de wielbelasting, legt Valerí Markine uit. Hij is projectleider van XCross en Universitair Hoofddocent Railbouwkunde bij de TU Delft. “De rails worden bij een kruising onderbroken, waardoor passagierstreinen en zware goederentreinen als het ware een sprongetje moeten maken. Dit heeft veel impact op de rails waardoor ze snel slijten." Met de hand en een meetlat worden oneffenheden op de rails gezocht. Pilot test met 3D scanner. Handwerk De schade wordt momenteel gerepareerd door professionals die met het oog zoeken naar oneffenheden. Met lassen en slijpen maken zij de versleten kruisingen weer in orde, het is handwerk en precisiewerk. De onderzoekers hopen dit proces te optimaliseren met handzame 3D-scans op locatie. De scans kunnen veel preciezer zien waar er oneffenheden zijn en dit live verwerking in computermodellen. Zowel in virtual reality als met 3D-geprinte mallen kan dit de lasmedewerkers de juiste aanwijzingen geven. Onderhoud voorbereiden Computermodellen detecteren afwijkingen ten opzichte van de oorspronkelijke geometrie van de rails en kunnen zelfs een nieuwe geoptimaliseerde geometrie voor een specifieke situatie genereren. Het wordt direct zichtbaar op het scherm waar er materiaal moet worden toegevoegd of juist weggeslepen. Markine denkt dat dit waardevolle informatie kan zijn voor de lassers ter plaatse. Maar hij hoopt ook dat dit inspecteurs van informatie kan voorzien waardoor onderhoudswerkzaamheden beter voorbereid kunnen worden. Breed inzetbaar Een ander groot voordeel van de computermodellen, de digital twins, is dat ze verschillende spoorwegsituaties kunnen nabootsen. Binnen Europa worden er verschillende voertuigen, spoorstaven en wielen ingezet. Zo ontstaan er steeds andere interacties tussen het spoor en de voertuigen. Aangezien het bij reparatie van wissels om millimeters gaat, zijn dit essentiële details om mee te nemen in de digitale modellen. Betere levensduur spoorwegen Markine is blij dat bedrijven als ProRail en RET meedenken aan de innovaties binnen het XCross-project. Het doel is dat slijtage eerder gesignaleerd wordt en dat de rails tijdig of zelfs preventief reparaties ondergaan. Dit zal de levensduur van de spoorwegen ten goede komen. The Next Generation of Railway Crossing Asset Management Technology project (XCross) wordt gefinancierd door Europe’s Rail Joint Undertaking, het Europese partnerschap voor onderzoek en innovatie op het gebied van spoorwegen. Binnen dit project werken tien partners vanuit zeven verschillende landen samen. Naast TU Delft zijn dat onder andere ProRail, Rotterdam Electric Tram (RET), International Union of Railways (UIC), Dresden University of Technology (TU Dresden) en University of Leeds. Ga naar projectwebsite voor meer informatie. Foto credits: TU Delft Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'
