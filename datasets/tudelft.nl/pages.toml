full_description = '''International Women’s Day 2025 10 maart 2025 16:30 t/m 21:00 - Locatie: Aula, Foyer and Auditorium | Zet in mijn agenda (function () { const config = {"name":"International Women\u2019s Day 2025","description":"","startDate":"2025-03-10","endDate":"2025-03-10","startTime":"16:30","endTime":"21:00","options":["Apple","Google","iCal","Microsoft365","MicrosoftTeams","Outlook.com","Yahoo"],"timeZone":"Europe\/Amsterdam","trigger":"click","iCalFileName":"International-Womens-Day-2025","location":"Aula, Foyer and Auditorium"}; const button = document.querySelector('#addToCalendarLink'); button.addEventListener('click', () => atcb_action(config, button)); }()); On 10 March, we celebrate International Women's Day with this year's theme: 'Woman of the Future'. This theme invites us all to look beyond the present and reflect on the immense impact, power and potential of women in shaping the world of tomorrow. We envision a future where women thrive in every facet of society - from science and technology to culture, politics and beyond. This theme challenges us to break down barriers, create opportunities and foster a more inclusive world where women can reach their full potential. This day is not only a celebration of the achievements of women past and present, but also an invitation to build a shared vision for a more equitable future. A future where every woman, in every corner of society, has the space and support to make a difference - not just for herself, but for others and for generations to come. Join us as we honour women's contributions, explore the challenges that remain, and work together to ensure a brighter, more inclusive future. More information and registration Interview Pravesha Ramsundersingh MSc student computer science “My message to women considering tech: If this is your passion, don’t let anything stop you.” Interview Ilke Ercan Associate Professor at Electrical Engineering, Mathematics and Computer Science (function () { var i, buttons = document.getElementsByClassName('sliderCentered-itemLink btn'); if (buttons) { for (i = 0; i < buttons.length; i++) { buttons[i].innerHTML = "Personal page"; } } }()); Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
