["https://tudelft.nl/2025/tu-delft/nieuwe-proeftuin-office-lab-helpt-het-verduurzamen-van-kantoorgebouwen-te-versnellen"]
title = "Nieuwe proeftuin Office Lab helpt het verduurzamen van kantoorgebouwen te versnellen"
full_description = "Nieuwe proeftuin Office Lab helpt het verduurzamen van kantoorgebouwen te versnellen Nieuws - 12 februari 2025 - Webredactie Communication Om het verduurzamen van kantoren te versnellen, opende The Green Village gisteren de nieuwe proeftuin Office Lab. Deze proeftuin, onderdeel van fieldlab The Green Village van de TU Delft, biedt een plek aan onderzoekers en ondernemers om oplossingen te testen en door te ontwikkelen die bijdragen aan het toekomstbestendig maken van kantoorgebouwen. Alleen als we onze kantoren duurzaam gaan bouwen en renoveren, kunnen we de klimaatdoelstellingen halen: CO2-neutraal en een circulaire economie in 2050. Grondstoffen voor staal en beton zijn eindig en hebben een aanzienlijke impact op het milieu. Daarnaast is het energiegebruik van (kantoor) gebouwen verantwoordelijk voor 30% van de CO²-uitstoot in de gebouwde omgeving. Tegelijkertijd zorgen de gevolgen van klimaatverandering, zoals hittestress, voor nieuwe uitdagingen in gebouwen en op bedrijventerreinen. Kortom: er is behoefte aan duurzame materialen, energie-efficiënte systemen en klimaatadaptieve oplossingen. Van proeftuin naar duurzaam kantoor Het doel van de proeftuin Office Lab is de vertaalslag maken van pionieren in de proeftuin naar schaalbare producten en systemen, zoals biobased gevelpanelen, energie-efficiënte klimaatsystemen en slimme waterbesparende- en klimaatadaptatieve maatregelen, die daadwerkelijk gebruikt worden in kantoorgebouwen. Marjan Kreijns, directeur The Green Village: “Ons Office Lab is dé praktijkplek voor ondernemers, de bouwsector, opdrachtgevers, onderzoekers en overheden om kantoorinnovaties te testen, door te ontwikkelen en te demonstreren. Het kantoor is een regelluwe en realistische testomgeving waar collega’s werken en waar we ons netwerk ontmoeten. Ook brengen we alle partijen samen om kennis op te doen, uit te wisselen en samen te werken. Dat is een essentiële stap in de opschaling.” Directeur Marjan Kreijns, Programmamanager Duurzaam bouwen en renoveren Willy Spanjer en Ton Jonker Directeur Economie, Energie, Digitalisering en Circulair bij Provincie Zuid-Holland Drie innovaties Ondernemers, onderzoekers en opdrachtgevers kunnen gebruikmaken van de proeftuin om innovaties te testen. Drie voorbeelden van innovaties die de weg al hebben gevonden. 1. Wollen Designvilt – Hollands Wol Collectief Wollen wandbekleding heeft uitstekende akoestische eigenschappen, waardoor het zeer geschikt is voor toepassing in een kantoortuin. Wol is van nature brandwerend, isolerend en groeit bovendien elk jaar weer opnieuw aan. De natuurlijke vezels kunnen aan het einde van de levensduur volledig worden gecomposteerd als bodemverbeteraar, waardoor het onderdeel wordt van de biologische kringloop. Dit biobased én biodegradable materiaal gaat Nederland helpen bij het uitfaseren van de enorme hoeveelheid vervuilende en schadelijke synthetische vezels! https://www.thegreenvillage.org/project/wollen-designvilt/ 2. Sustainer.home - Sustainer Sustainer.home is een duurzaam bouwsysteem voor modulaire woningbouw in hout, ontwikkeld door Sustainer. Het systeem is flexibel te ontwerpen met behulp van 3D modellen en behaalt dezelfde prestaties als massiefhoutbouw, maar met het effectieve materiaalgebruik van traditionele houtskeletbouw. Zo helpt Sustainer ontwikkelaars, aannemers, architecten en producenten te versnellen in de transitie naar schaalbaar en betaalbaar duurzaam bouwen. https://www.thegreenvillage.org/project/sustainer-home/ 3. SlowFlow – AGS Products SlowFlow van AGS Products biedt een innovatieve en eenvoudige oplossing voor regenwaterberging op platte daken. Het systeem bestaat uit een met tegel verzwaarde aluminium vertragingsring met kleine openingen die rondom de afvoer zijn geplaatst. Hierdoor fungeert het dak als tijdelijke buffer en kan het hemelwater vertraagd worden afgevoerd. Op deze manier wordt de druk op het riool verminderd. SlowFlow is universeel toepasbaar, beschikt over een noodoverloop en is eenvoudig zelf te installeren op nieuwe en bestaande platte daken. https://www.thegreenvillage.org/project/slowflow/ Betrokken partners De renovatie van het Office Lab is mede mogelijk gemaakt met de Campussubsidie van provincie Zuid-Holland. Over The Green Village Op The Green Village onderzoeken, experimenteren, valideren en demonstreren kennis- en onderwijsinstellingen, ondernemingen, overheden én burgers innovaties die bijdragen aan het energiezuinig, klimaatbestendig en circulair maken van wijken. Het is een regelluw “openluchtlaboratorium” van de TU Delft met een focus op de gebouwde omgeving, waar we testen op wijk-, straat- en gebouwniveau. Met toegang tot het innovatie-ecosysteem van de TU Delft is de wetenschap altijd dichtbij. Op The Green Village wordt gewoond, gewerkt en geleerd. De regelluwe status maakt het mogelijk concepten uit te proberen die ergens anders niet zomaar getest kunnen worden. Experimenteren in een levensechte omgeving met bewoners en andere gebruikers houdt je scherp en zorgt ervoor dat je na een testperiode op The Green Village klaar bent voor de volgende stap: de buitenwereld in. Op dit moment zijn er meer dan 100 innovaties op het terrein actief en zijn er nog tal in ontwikkeling. Het team van The Green Village helpt partijen zodat ze snel hun doel bereiken en hun innovaties kunnen opschalen in gebouwen, wijken en steden. Zo helpt het team innovatie versnellen van theorie naar praktijk en draagt zij bij aan een duurzame en toekomstbestendige samenleving. https://www.thegreenvillage.org/office-lab Samenwerken Wil jij ook innoveren in proeftuin Office Lab op The Green Village? Ben je als partij uit de bouwsector op zoek naar inspiratie? Neem contact op met Willy Spanjer, Programmamanager Duurzaam bouwen & renoveren (Willy W.M.J.Spanjer@tudelft.nl - +31 (0)6 14609631) of Communicatieadviseur Jehan Daal (j.l.a.daal@tudelft.nl - 06 39 10 76 83 ) . Voor persvragen kun je terecht bij persvoorlichter Karlijn Spoor: k.spoor@tudelft.nl – 06-41612272 Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina"
