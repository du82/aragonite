["https://tudelft.nl/2024/ewi/slimme-ai-coach-helpt-rokers-stoppen-met-behulp-van-reinforcement-learning"]
title = "Slimme AI-coach helpt rokers stoppen met behulp van Reinforcement Learning"
full_description = 'Slimme AI-coach helpt rokers stoppen met behulp van Reinforcement Learning Nieuws - 27 februari 2025 - Communication EWI Vandaag verdedigt Nele Albers haar proefschrift over de inzet van AI-coaches bij het stoppen met roken en vapen. Ze ontwikkelde een AI-coach die gebruikmaakt van psychologisch geïnformeerde Reinforcement Learning (RL), een vorm van machine learning waarbij een model leert door middel van belonen, vergelijkbaar met hoe mensen gedrag aanleren. Albers baseerde haar onderzoek op inzichten uit gedragsveranderingstheorieën en gegevens uit drie grootschalige studies met elk meer dan 500 deelnemers. Naast de technische kant onderzocht Albers ethische, economische en psychologische aspecten en analyseerde ze hoe verschillende factoren bijdragen aan effectieve gedragsverandering, namelijk: hoe stoppende rokers kunnen worden overtuigd, wat hen wordt gevraagd te doen en door wie ze moeten worden ondersteund. Haar onderzoek laat zien dat AI-coaches die rekening houden met psychologische principes veel potentie hebben om effectieve ondersteuning te bieden aan mensen die willen stoppen met roken. Mijn onderzoek laat zien hoe het personaliseren van ondersteuning – door rekening te houden met zowel de huidige als toekomstige toestand van een persoon – de effectiviteit van AI-gebaseerde eHealth-toepassingen vergroot. Dit biedt veel mogelijkheden voor gedragsverandering. Afbeelding: Voorbeeld uit een dialoog met een AI-coach uit proefschrift Nele Albers Slimmere eHealth-toepassingen door gepersonaliseerde AI-coaching AI-coaches in eHealth-toepassingen zouden mensen effectief kunnen begeleiden bij gedragsverandering en tegelijkertijd kosten kunnen besparen. Toch worden deze toepassingen nog niet breed ingezet. Uitdagingen blijven bijvoorbeeld uitval en een gebrek aan betrokkenheid. Beter afgestemde ondersteuning – die rekening houdt met kennis, motivatie, vitaliteit, denkpatronen– kan het gebruik systematisch verhogen. Om de effectiviteit van stoppen-met-roken-ondersteuning te verbeteren, onderzocht Albers zowel de algoritmische kant als de interactie tussen rokers en AI-coaches. Haar model kan bijvoorbeeld bepalen wanneer het nuttig is om naast de AI coach ook een menselijke coach te betrekken. Daarnaast keek ze naar het spanningsveld tussen de voorkeuren van rokers en de adviezen van gezondheidsexperts. Gezondheidszorgexperts bepalen wat goed is, maar rokers kijken hier vaak anders naar. Albers’ algoritme probeert een balans te vinden tussen de twee perspectieven. Bevindingen onderzoek Een belangrijke bevinding uit haar onderzoek is dat ondersteuning effectiever is wanneer deze zich aanpast aan de situatie van een individu, bijvoorbeeld bij het voorstellen van verschillende activiteiten. Zo kan de AI-coach iemand stimuleren om na te denken over prikkels die het verlangen naar roken oproepen of over de persoon die ze in de toekomst willen zijn. Denk aan een motivatie als: "Ik wil een betere ouder zijn voor mijn kind door het goede voorbeeld te geven." Daarnaast speelt de context een rol bij de effectiviteit van berichten. Afhankelijk van de situatie kan een formulering zoals "Andere rokers vinden..." beter werken dan "Dokters raden aan”. Op basis van haar analyse en bevindingen ontwikkelde ze modellen die de betrokkenheid van rokers vergroten en hen beter ondersteunen bij het opbouwen van vaardigheden om te stoppen. Persvragen en meer informatie Op aanvraag is het voor pers mogelijk om het onderzoek van Nele Albers van dichtbij te ervaren door zelf een sessie met de AI-coach mee te maken. Dit kan in de context van voorbereiding op stoppen met roken, waarbij de AI-coach ondersteuning biedt. Om toegang te krijgen neem contact op met Marc de Kool, persvoorlichter Digital Society, a.j.m.dekool@tudelft.nl/ 06-10038065 Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'
