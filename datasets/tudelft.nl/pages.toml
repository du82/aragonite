["https://tudelft.nl/bk/onderzoek/research-stories/een-rol-voor-elk-huis-het-betrekken-van-nederlandse-inwoners-bij-de-energietransitie"]
title = "Een rol voor elk huis: het betrekken van Nederlandse inwoners bij de energietransitie"
full_description = '''Bouwkunde Onderzoek Research stories Een rol voor elk huis: het betrekken van Nederlandse inwoners bij de energietransitie Dit artikel draagt bij aan de Energy Hub campagne van de TU Delft, van 5 t/m 15 november 2024. Ontdek de verhalen en evenementen op de campagnepagina. De noodzaak van de energietransitie is inmiddels duidelijk, en de urgentie neemt alleen maar toe. Eén grote uitdaging is de woningsector, die in Nederland verantwoordelijk is voor meer dan 20% van het elektriciteitsverbruik en bijna 30% van het aardgasverbruik. Veel van onze gebouwen zijn dringend aan renovatie toe, maar dat kan alleen met de instemming en medewerking van bewoners. Hier zijn vier van de onderzoekers die hun PhD's wijden aan het streven om iedereen te betrekken. Honderden wetenschappers aan de TU Delft wijden hun tijd en expertise aan het verminderen van ons energieverbruik. Deze vier, van de faculteit Bouwkunde, richten zich op woningen. Drie bestuderen de meest voorkomende typen: verenigingen van eigenaren (Ragy Elgendy), sociale huurwoningen (Stefanie Horian), en individuele woningen (Ladislav Krutisch). De vierde, Diletta Ricci, onderzoekt specifiek hoe we kwetsbare buurten kunnen helpen. Van links naar rechts: Ladislav Krutisch, Ragy Elgendy, Diletta Ricci en Stefanie Horian. Ragy: stel een communicatiestrategie op, huur adviseurs in Ragy maakt deel uit van project CondoReno, dat zich richt op het versnellen van energierenovaties door Verenigingen van Eigenaren (VvE's). Ragy verdeelde de renovaties in vier fasen: iedereen overtuigen, een algemeen plan opstellen, de financiën op orde krijgen, en het eigenlijke werk uitvoeren. “Ik inventariseerde de obstakels die het project kunnen vertragen of ontsporen. Het grote aantal functies en betrokken partijen verraste me, evenals het belang van sociale dynamiek: bewoners raken vaak overweldigd door de hoeveelheid informatie of schrikken van de kosten, wat leidt tot wantrouwen en tegenstemmen.” De lessen tot nu toe Ragy: “Communicatiestrategieën van renovatiebedrijven kunnen conflicten binnen VvE's voorkomen. Maak bewoners wegwijs in het proces door bij elke stap duidelijk aan te geven wat de kosten en betrokken partijen zijn.” Hij ziet nu het voordeel van geïntegreerde dienstverleners: tussenpersonen die de hele woningrenovatie afhandelen. Een alternatief, bekend bij sommige EU-landen, is adviseurs aan renovatieprojecten koppelen om VvE's te helpen bij het overwinnen van financiële, juridische, en sociale hindernissen. “Het lijkt een grote investering, maar er zijn stimulansen en leningen beschikbaar op lokaal, nationaal en EU-niveau. Want energierenovaties verbeteren efficiëntie, verlagen kosten, verminderen CO2-uitstoot, en leiden tot gezondere inwoners.” Ragy Elgendy Staff page Stefanie Horian Staff page Stefanie: steun moeilijke beslissingen, beperkt transactiekosten Stefanie maakt deel uit van het ALIGN4energy project, dat zich richt op klimaatneutraliteit en decarbonisatie van de Nederlandse sociale huursector. Ze enquêteert huurders en categoriseert ze in persona's, elk met verschillende prioriteiten en behoeften. Verder interviewt ze experts bij woningcorporaties en aanverwante partijen om obstakels tijdens energierenovaties te onderzoeken. “Door inzichten over gedrag te integreren in de transactiekostentheorie, toont mijn onderzoek dat de knelpunten bij renovaties in deze sector verder gaan dan financieel: ze hebben bijvoorbeeld te maken met tijd, inspanning, en het gedrag van persona's." Stefanie streeft ernaar beleidsmakers te informeren en effectieve stimulansen voor renovatie aan te dragen. De lessen tot nu toe Tijdens haar onderzoek ontdekte Stefanie tot haar verbazing dat zelfs doorgewinterde professionals worstelen met de complexiteit van renovatie. “Het benadrukt de urgentie om kaders te ontwikkelen die effectieve en efficiënte besluitvorming ondersteunen, vooral rondom het minimaliseren van transactiekosten.” Ze beseft dat de energietransitie niet alleen gaat over technologische vooruitgang of financiële investering: “aangezien de meeste partijen graag decarbonisatie willen versnellen, lijkt de sociale transitie de grootste uitdaging.” Stefanie is vastberaden om een bijdrage te leveren met haar onderzoek. “Bewoners van sociale huurwoningen zijn zowel zeer divers als vaak kwetsbaar voor energiearmoede. Door te focussen op deze groep wil ik ervoor zorgen dat niemand achterblijft.” Diletta, Ladislav, Stefanie, en Ragy bij een renovatieproject. Ladislav: verminder fricties en verbeter financiële kennis Ladislav, ook onderdeel van ALIGN4energy, probeert de psychologie te begrijpen waardoor huiseigenaren besluiten om te renoveren. “Ongeveer 90% van Nederlandse woningen wordt verwarmd met aardgas, wat indruist tegen zowel nationale als EU-klimaatdoelstellingen. Maar de overheid kan huiseigenaren niet dwingen om te renoveren: we moeten bewoners overtuigen met een gerichte aanpak.” Net als Stefanie combineert hij enquêtes onder bewoners met interviews van experts in onderzoek en praktijk. “Ik probeer te achterhalen welke factoren fricties of barrières in het renovatieproces verklaren: psychologisch, sociaal, economisch... hoe gaan experts met deze uitdagingen om, en hoe kunnen we fricties verminderen?” De lessen tot nu toe Een verrassende ontdekking is dat bepaalde groepen huiseigenaren onverschillig staan tegenover bijvoorbeeld milieuredenen, maar toch kiezen voor renovatie. “De initiële kosten zijn meestal de voornaamste barrière, ook al suggereren trends in energie- en gasprijzen dat elk type energierenovatie op de lange termijn een goede investering is.” Daarom stelt Ladislav als mogelijke strategie voor om bewoners meer financiële kennis bij te brengen. Hij ziet ook een rol voor de faculteit: “We zijn zo gefocust op nieuwbouw, terwijl een forse meerderheid van alle bestaande gebouwen in de EU nog tot minstens 2050 meegaat! Architectuurstudenten moeten leren hoe ze deze structuren kunnen aanpassen, renoveren, en onderhouden.” Ladislav Krutisch Staff page Diletta Ricci Staff page Diletta: luister naar, betrek, en verbeter de levens van bewoners Waar haar drie collega's zich bezighouden met de belangrijkste woonvormen, helpt Diletta's project JustPrepare de energietransitie van kwetsbare Nederlandse wijken op een maatschappelijk verantwoorde manier. “Kwetsbaarheid kan duiden op de gezondheid of sociaaleconomische status van bewoners, maar ook op stedelijke problemen of slechte energielabels van woningen.” Ze probeert sociale aspecten te integreren in technische beslissingen: bepalen welke combinatie van renovatiemaatregelen past bij elke situatie. “Er zijn nationale subsidies speciaal voor deze wijken. Hoe passen we die toe zonder wantrouwen of frustratie op te wekken?” De lessen tot nu toe Zoals veel deskundigen focuste Diletta vroeger op de resultaten van renovatie. “Maar het proces is zeer ontwrichtend voor bewoners! Hun instemming hangt af van zeggenschap verlenen en rekening houden met hun behoeften en wensen.” Daarom hamert JustPrepare op erkenning (de bewoners leren kennen), procedure (hen bij het proces betrekken), en verstrekking (zorgen dat de resultaten hun leven verbeteren). Diletta ontdekte dat opvallende verbeteringen aan woonruimtes cruciaal zijn om instemming te krijgen: “bijvoorbeeld meer daglicht, verbeterde luchtkwaliteit, of nieuwe gemeenschappelijke ruimtes voor sociale activiteiten.” Terwijl het installeren van efficiënte maar zeer complexe energiesystemen, zonder de noodzaak of het gebruik ervan goed uit te leggen, kan leiden tot onbegrip en bitterheid! Gepubliceerd: oktober 2024 Meer informatie Dit artikel is een introductie tot, maar zeker geen volledige uitleg van, het werk van Ragy, Stefanie, Ladislav en Diletta. Zij zullen hun onderzoek presenteren (in het Engels) tijdens het gratis evenement 'Burgerparticipatie in de Energietransitie', waar ook presentaties van en discussies met gemeenteambtenaren van Delft zullen plaatsvinden (in het Nederlands). 14 november 2024, 15:00 tot 18:00 uur, in Delft. Meld je hier aan. Lees meer over de overkoepelende onderzoeksprojecten: CondoReno (Ragy), ALIGN4energy (Stefanie and Ladislav), en JustPrepare (Diletta). De statistieken in de inleiding zijn respectievelijk afkomstig van de websites van ‘Energie Nederland’ en het Nederlandse Centraal Bureau voor de Statistiek. Alle afbeeldingen in dit artikel zijn gemaakt door Annelies van 't Hul.'''
