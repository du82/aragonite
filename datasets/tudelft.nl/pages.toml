full_description = '''Kick-off event: Hittepers 04 maart 2025 15:00 t/m 17:30 - Locatie: Co-Creation Centre, The Green Village (Van Den Broekweg 4, 2628 CR, Delft) - Door: Communicatie BK | Zet in mijn agenda (function () { const config = {"name":"Kick-off event: Hittepers","description":"Op 4 maart vindt het 'Hittepers kick-off event' plaats in het Co-Creation Centre van The Green Village.","startDate":"2025-03-04","endDate":"2025-03-04","startTime":"15:00","endTime":"17:30","options":["Apple","Google","iCal","Microsoft365","MicrosoftTeams","Outlook.com","Yahoo"],"timeZone":"Europe\/Amsterdam","trigger":"click","iCalFileName":"Kick-off-event-Hittepers","location":"Co-Creation Centre, The Green Village (Van Den Broekweg 4, 2628 CR, Delft)"}; const button = document.querySelector('#addToCalendarLink'); button.addEventListener('click', () => atcb_action(config, button)); }()); Op 4 maart vindt het 'Hittepers kick-off event' plaats in het Co-Creation Centre van The Green Village. Tijdens dit evenement lanceert de Collectieve Vezel Hub het gebruik van een nieuwe hittepers, waarmee innovatieve makers worden gestimuleerd nieuwe ‘recepten’ voor biobased plaatmaterialen te ontwikkelen. Met deze hittepers kunnen zij veel samples en prototypes maken, zonder zelf te investeren in dure apparatuur. Gedurende deze middag delen we kennis over het gebruik en de mogelijkheden van de pers. Ook gaan we in op de kansen en uitdagingen voor opschaling. Programma 15:00 Inloop 15:15 Welkom en introductie Collectieve Vezel Hub The Green Village en Noorderwind 15:30 Gebruik, belang en mogelijkheden van de hittepers VanHier 16:00 Kansen en uitdagingen om op te schalen Building Balance en Avans Hogeschool 16:30 Borrel en live demonstratie van de hittepers VanHier Meer informatie & aanmelden Voor meer informatie en aanmelden voor het kick-off evenement, bezoek de website van The Green Village. Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina'''
