["https://tudelft.nl/2025/tu-delft/tu-delft-ontvangt-subsidie-voor-nucleair-onderwijs-en-onderzoek"]
title = "TU Delft ontvangt subsidie voor nucleair onderwijs en onderzoek"
description = "Nucleair Onderwijs"
full_description = "TU Delft ontvangt subsidie voor nucleair onderwijs en onderzoek Nieuws - 06 februari 2025 - Webredactie Communication TU Delft vindt het belangrijk om met goed nucleair onderwijs en onderzoek te kunnen bijdragen aan de veilige toepassing van kernenergie in Nederland. Hiertoe zullen in totaal vier nieuwe leerstoelen op het gebied van kernenergie worden ingevuld. Twee leerstoelen op de gebieden Stralingsdosimetrie en Kernreactorfysica zijn ingebed bij het TU Delft Reactor Institute van de faculteit Technische Natuurwetenschappen (TNW), terwijl de leerstoelen op het gebied van Nucleaire Energie Technologie en Nucleaire Materialen zijn ondergebracht bij de faculteit Mechanical Engineering (ME). Recentelijk heeft het ministerie van Klimaat en Groene Groei subsidie verleend voor de leerstoelen Kernreactorfysica, Nucleaire Energie Technologie en Nucleaire Materialen. Voor de leerstoel op het gebied van Stralingsdosimetrie is eerder subsidie verleend door het toenmalig ministerie van Economische Zaken en Klimaat. Zie ook: https://www.rijksoverheid.nl/ministeries/ministerie-van-klimaat-en-groene-groei/documenten/kamerstukken/2025/02/04/voortgang-ontwikkelingen-nucleaire-kennis-en-innovatie-infrastructuur Opleiden nucleaire ingenieurs en experts Met deze versterking van het nucleaire onderwijs en onderzoek wil TU Delft een grote bijdrage leveren aan de opleiding van nucleaire ingenieurs en experts ter ondersteuning van de kabinetsplannen voor uitbreiding van het aantal kerncentrales in Nederland. Ook zullen promovendi worden aangesteld voor nucleair onderzoek en voor de begeleiding van studenten bij hun afstudeerproject. Mechanical Engineering Met de nieuwe leerstoelen slaat de faculteit Mechanical Engineering een brug tussen werktuigbouwkunde en de specifieke toepassing ervan voor nucleaire energieopwekking. De leerstoel Nuclear Energy Technology wordt ingebed binnen de afdeling Proces & Energy. De focus zal liggen op het ontwikkelen van nieuwe ontwerpen, zoals kleine modulaire reactoren, en de integratie in de Nederlandse energie-infrastructuur. Binnen de afdeling Materials Sciences and Engineering (MSE) wordt de leerstoel Materials Science for Nuclear Reactors ondergebracht. Materialen in nucleaire toepassingen staan bloot aan extreme condities, zoals hoge temperaturen en stralingsdoses. Nieuwe nucleaire systemen leiden doorgaans tot nog extremere condities voor het materiaal. Het is van groot belang om de levensduur van materialen te verlengen, maar vooral ook nauwkeurig te kunnen voorspellen op een tijdschaal die relevant is voor nucleaire systemen. De nieuw aan te wijzen hoogleraren zullen tevens zorgdragen voor een nieuwe generatie werktuigbouwkundige ingenieurs met solide basiskennis van nucleaire technologie. Radiation Science & Technology De afdeling Radiation Science & Technology heeft unieke expertise in het gebruik van ioniserende straling zoals positronen en neutronen voor onderzoek en onderwijs. Ze beschikt over directe toegang tot een onderzoeksreactor die is uitgerust met geavanceerde bundellijninstrumenten, bestralingsfaciliteiten en radiologische laboratoria en tot het HollandPTC waar gebruik kan worden gemaakt van een protonenbundel voor onderzoek. Het onderzoek richt zich naast innovatieve en duurzame kernenergie, ook op materiaalkunde voor energieomzetting en -opslag, gezondheidstechnologie voor beeldvorming en diagnostiek, radionuclidentherapie en protontherapie. De afdeling biedt onderwijs aan studenten op het gebied van natuurkunde, scheikunde en biomedische wetenschappen. Voor meer informatie Femke Werkman +31643287791 F.M.Werkman@tudelft.nl Nucleair Onderwijs Deel deze pagina: Facebook Linkedin Twitter Email WhatsApp Deel deze pagina"
