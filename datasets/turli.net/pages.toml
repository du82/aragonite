["https://turli.net/chanserv.php"]
title = "The Union of Russian Language IRC Networks"
full_description = '''ChanServ позволяет Вам регистрировать канал и управлять каналом. ChanServ может предохранить от злобных пользователей, желающих "захватить" канал, используя ограничение возможности получения опа на канале. Доступные команды показаны ниже; чтобы использовать их пишите /msg ChanServ команда. Для более подробной информации о конкретной команде, напишите /msg ChanServ HELP команда. REGISTER - Регистрация канала IDENTIFY - Идентифицироваться как владелец канала SET - Установить информацию о канале и опции канала AOP - Модифицировать список AOP'ов SOP - Модифицировать список SOP'ов ACCESS - Модифицировать список привилегированных пользователей LEVELS - Переустановить значения уровней доступа AKICK - Управление списком автокиков DROP - Удалить канал из базы данных ChanServ Другие команды: BAN, CLEAR, DEOP, DEVOICE, GETKEY, INFO, INVITE, KICK, LIST, LOGOUT, OP, TOPIC, UNBAN, VOICE, VOP, DEOWNER, DEHALFOP, DEPROTECT, HALFOP, HOP, OWNER, PROTECT Основные команды: REGISTER #канал пароль описание Регистрирует канал в базе данных ChanServ. Чтобы использовать эту команду Вы должны быть оператором канала, который Вы пытаетесь зарегистрировать. Пароль должен быть использован с командой IDENTIFY, чтобы иметь возможность изменять различные параметры канала. Последний параметр (описание), который обязательно должен присутствовать, является описанием канала и, возможно, его тематикой. Когда Вы зарегистрируете канал, Вы будете записаны в список доступа канала как "владелец" канала. Владелец канала может изменять любые параметры канала; ChanServ также автоматически даст статус оператора канала и режим +q владельцу при заходе его на канал. Используйте команду ACCESS (/msg ChanServ HELP ACCESS) или систему xOP (/msg ChanServ help vop/hop/aop/sop) для для получения информации о том, как давать дополнительные привилегии на канале для других пользователей. ПРИМЕЧАНИЕ: Чтобы зарегистрировать канал, сперва Вы должны зарегистрировать Ваш ник. Если Вы этого еще не сделали, /msg NickServ HELP REGISTER для получения информации о том, как зарегистрировать ник. Пример: /msg ChanServ REGISTER #football foot344 Канал посвященный футболу. Зарегистрирует канал #football с паролем foot344 и описанием "Канал посвященный футболу."'''
year_published = 2025
clearnet = "https://turli.net/chanserv.php"
tags = ["#link", "#канал", "access", "akick", "bans", "bantype", "clear", "dehalfop", "deop", "deowner"]
