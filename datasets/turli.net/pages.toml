["https://turli.net/about.php"]
title = "The Union of Russian Language IRC Networks"
full_description = "Сеть образовалась в октябре 2003 года. Официальный день рождения сети это 14 октября. Изначально в сети было всего пять серверов. После развала вомнета, многие перешли в сеть TURLINet. Постепенно к нам присоединялись irc-серверы из разных городов России и СНГ. В данный момент в сети присутствуют юзеры из России, Украины, Азербайджана, Узбекистана и даже Германии. В данный момент идет трудоемкая работа над выдвижением сети на уровень качественной автономной IRC сети. Идёт работа над сервисами. Пишутся собственные модули для обеспечения защиты и приятного препровождения юзеров в сети. Мы всегда рады видить новые лица и конечно никогда не против линковки новых IRC-серверов. Увидимся в сети и приятного чата :)"
