["https://turli.net/botserv.php"]
title = "The Union of Russian Language IRC Networks"
full_description = 'BotServ позволяет Вам повесить бота на свой канал. Это сделано для тех, кто не может иначе установить или настроить бота, или если использование ботов запрещено в Вашей IRC сети. Доступные команды перечислены ниже; чтобы использовать их, напишите /msg BotServ команда. Для получения более подробной информации по конкретной команде, напишите /msg BotServ HELP команда. *** Минимум пользователей, необходимых для присоединения бота к каналу: 1. BOTLIST - выводит список доступных для установки ботов. ASSIGN - устанавливает бота на канал. SET - настройки бота. KICK - настройки защиты канала (за что будет бот кикать\банить) BADWORDS - настройка списка плохих (ругательств) слов. ACT - аналог команды "action" или "me" в mIRC. INFO - информация о боте и его настройках. SAY - аналог команды "say" в mIRC. UNASSIGN - удалить бота с канала. BOTLIST Выведет список доступны для установки ботов, его ник и идент с хостом. Пример: /msg BotServ botlist ASSIGN #канал ник Установит бота под указанным ником на указанный канал. Теперь Вы можете настраивать опции бота так, как Вам необходимо. Пример: /msg BotServ ASSIGN #канал ник UNASSIGN #канал Убирает бота с указанного канала. При использовании этой команды бот больше не будет заходить на канал. Тем не менее, конфигурация бота для данного канала будет сохранена, поэтому если Вы позднее снова установите этого бота на канал, все его настройки будут восстановлены. Пример: /msg BotServ UNASSIGN #канал'
year_published = 2025
clearnet = "https://turli.net/botserv.php"
tags = ["#link", "#канал", "assign", "badwords", "bolds", "botlist", "caps", "clear", "colors", "dontkickops"]
