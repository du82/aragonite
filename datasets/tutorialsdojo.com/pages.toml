title = "Amazon DynamoDB Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = 'Last updated on November 14, 2024 Bookmarks Core Components Data Types For Attributes Other Notes Throughout Management Capacity Unit Consumption DynamoDB Auto Scaling DynamoDB Items Tagging DynamoDB Queries DynamoDB Scans On Demand Backup and Restore DynamoDB Transactions Global Tables Security Monitoring DynamoDB Accelerator (DAX) Best Practices Pricing DynamoDB-Related Cheat Sheets Validate Your Knowledge Amazon DynamoDB Cheat Sheet NoSQL database service that provides fast and predictable performance with seamless scalability. Offers encryption at rest. You can create database tables that can store and retrieve any amount of data, and serve any level of request traffic. You can scale up or scale down your tables’ throughput capacity without downtime or performance degradation, and use the AWS Management Console to monitor resource utilization and performance metrics. Provides on-demand backup capability as well as enable point-in-time recovery for your DynamoDB tables. With point-in-time recovery, you can restore that table to any point in time during the last 35 days. All of your data is stored in partitions, backed by solid state disks (SSDs) and automatically replicated across multiple AZs in an AWS region, providing built-in high availability and data durability. You can create tables that are automatically replicated across two or more AWS Regions, with full support for multi-master writes. AWS now specifies the IP address ranges for Amazon DynamoDB endpoints. You can use these IP address ranges in your routing and firewall policies to control outbound application traffic. You can also use these ranges to control outbound traffic for applications in your Amazon Virtual Private Cloud, behind AWS Virtual Private Network or AWS Direct Connect. <iframe title="YouTube video player" src="https://www.youtube.com/embed/3ZOyUNIeorU" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"></iframe> Core Components Tables – a collection of items DynamoDB stores data in a table, which is a collection of data. Are schemaless. There is an initial limit of 256 tables per region. Items – a collection of attributes DynamoDB uses primary keys to uniquely identify each item in a table and secondary indexes to provide more querying flexibility. Each table contains zero or more items. Attributes – a fundamental data element DynamoDB supports nested attributes up to 32 levels deep. Primary Key – uniquely identifies each item in the table, so that no two items can have the same key. Must be scalar. Partition key – a simple primary key, composed of one attribute. Partition key and sort key (composite primary key) – composed of two attributes. DynamoDB uses the partition key value as input to an internal hash function. The output from the hash function determines the partition in which the item will be stored. All items with the same partition key are stored together, in sorted order by sort key value. If no sort key is used, no two items can have the same partition key value. Secondary Indexes – lets you query the data in the table using an alternate key, in addition to queries against the primary key. You can create one or more secondary indexes on a table. Two kinds of indexes: Global secondary index – An index with a partition key and sort key that can be different from those on the table. Local secondary index – An index that has the same partition key as the table, but a different sort key. You can define up to 20 global secondary indexes and 5 local secondary indexes per table. DynamoDB Streams – an optional feature that captures data modification events in DynamoDB tables. The naming convention for DynamoDB Streams endpoints is streams.dynamodb..amazonaws.com Each event is represented by a stream record, and captures the following events: A new item is added to the table: captures an image of the entire item, including all of its attributes. An item is updated: captures the “before” and “after” image of any attributes that were modified in the item. An item is deleted from the table: captures an image of the entire item before it was deleted. Each stream record also contains the name of the table, the event timestamp, and other metadata. Stream records are organized into groups, or shards. Each shard acts as a container for multiple stream records, and contains information required for accessing and iterating through these records. Stream records have a lifetime of 24 hours; after that, they are automatically removed from the stream. You can use DynamoDB Streams together with AWS Lambda to create a trigger, which is a code that executes automatically whenever an event of interest appears in a stream. DynamoDB Streams enables powerful solutions such as data replication within and across Regions, materialized views of data in DynamoDB tables, data analysis using Kinesis materialized views, and much more. <img decoding="async" class="aligncenter size-full wp-image-2619" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-2.jpg" alt="AWS Training Amazon DynamoDB 2" width="468" height="281" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-2-200x120.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-2-300x180.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-2-400x240.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-2.jpg 468w" sizes="(max-width: 468px) 100vw, 468px" /> Data Types for Attributes Scalar Types – A scalar type can represent exactly one value. The scalar types are number, string, binary, Boolean, and null. Primary keys should be scalar types. Document Types – A document type can represent a complex structure with nested attributes—such as you would find in a JSON document. The document types are list and map. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Set Types – A set type can represent multiple scalar values. The set types are string set, number set, and binary set. Other Notes: When you read data from a DynamoDB table, the response might not reflect the results of a recently completed write operation. The response might include some stale data, but you should eventually have consistent reads. When you request a strongly consistent read, DynamoDB returns a response with the most up-to-date data, reflecting the updates from all prior write operations that were successful. A strongly consistent read might not be available if there is a network delay or outage. DynamoDB does not support strongly consistent reads across AWS regions When you create a table or index in DynamoDB, you must specify your throughput capacity requirements for read and write activity in terms of: One read capacity unit represents one strongly consistent read per second, or two eventually consistent reads per second, for an item up to 4 KB in size. If you need to read an item that is larger than 4 KB, DynamoDB will need to consume additional read capacity units. One write capacity unit represents one write per second for an item up to 1 KB in size. If you need to write an item that is larger than 1 KB, DynamoDB will need to consume additional write capacity units. Throttling prevents your application from consuming too many capacity units. DynamoDB can throttle read or write requests that exceed the throughput settings for a table, and can also throttle read requests exceeds for an index. When a request is throttled, it fails with an HTTP 400 code (Bad Request) and a ProvisionedThroughputExceededException. Throughput Management Provisioned throughput – manually defined maximum amount of capacity that an application can consume from a table or index. If your application exceeds your provisioned throughput settings, it is subject to request throttling. Free tier eligible. DynamoDB auto scaling Define a range (upper and lower limits) for read and write capacity units, and define a target utilization percentage within that range. A table or a global secondary index can increase its provisioned read and write capacity to handle sudden increases in traffic, without request throttling. DynamoDB auto scaling can decrease the throughput when the workload decreases so that you don’t pay for unused provisioned capacity. Reserved capacity – with reserved capacity, you pay a one-time upfront fee and commit to a minimum usage level over a period of time, for cost-saving solutions. Amazon DynamoDB on-demand is a flexible capacity mode for DynamoDB capable of serving thousands of requests per second without capacity planning. When you choose on-demand capacity mode, DynamoDB instantly accommodates your workloads as they ramp up or down to any previously reached traffic level. If a workload’s traffic level hits a new peak, DynamoDB adapts rapidly to accommodate the workload. DynamoDB on-demand offers simple pay-per-request pricing for read and write requests so that you only pay for what you use, making it easy to balance costs and performance. Capacity Unit Consumption CUC for Reads – strongly consistent read request consumes one read capacity unit, while an eventually consistent read request consumes 0.5 of a read capacity unit. GetItem – reads a single item from a table. BatchGetItem – reads up to 100 items, from one or more tables. Query – reads multiple items that have the same partition key value. Scan – reads all of the items in a table CUC for Writes PutItem – writes a single item to a table. UpdateItem – modifies a single item in the table. DeleteItem – removes a single item from a table. BatchWriteItem – writes up to 25 items to one or more tables. Calculating the Required Read and Write Capacity Unit for Your DynamoDB table: https://tutorialsdojo.com/calculating-the-required-read-and-write-capacity-unit-for-your-dynamodb-table/ DynamoDB Auto Scaling When you use the AWS Management Console to create a new table, DynamoDB auto scaling is enabled for that table by default. Uses the AWS Application Auto Scaling service to dynamically adjust provisioned throughput capacity on your behalf, in response to actual traffic patterns. You create a scaling policy for a table or a global secondary index. The scaling policy specifies whether you want to scale read capacity or write capacity (or both), and the minimum and maximum provisioned capacity unit settings for the table or index. The scaling policy also contains a target utilization, which is the percentage of consumed provisioned throughput at a point in time. <img decoding="async" class="aligncenter size-full wp-image-2620" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-3.jpg" alt="AWS Training Amazon DynamoDB 3" width="494" height="352" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-3-200x143.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-3-300x214.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-3-400x285.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-DynamoDB-3.jpg 494w" sizes="(max-width: 494px) 100vw, 494px" /> DynamoDB auto scaling doesn’t prevent you from manually modifying provisioned throughput settings. If you enable DynamoDB auto scaling for a table that has one or more global secondary indexes, AWS highly recommends that you also apply auto scaling uniformly to those indexes. Tagging Tags can help you: Quickly identify a resource based on the tags you’ve assigned to it. See AWS bills broken down by tags. Each DynamoDB table can have only one tag with the same key. If you try to add an existing tag (same key), the existing tag value will be updated to the new value. Maximum number of tags per resource: 50 DynamoDB Items You can use the UpdateItem operation to implement an atomic counter – a numeric attribute that is incremented, unconditionally, without interfering with other write requests. DynamoDB optionally supports conditional writes for these operations: PutItem, UpdateItem, DeleteItem. A conditional write will succeed only if the item attributes meet one or more expected conditions. Conditional writes can be idempotent if the conditional check is on the same attribute that is being updated. DynamoDB performs a given write request only if certain attribute values in the item match what you expect them to be at the time of the request. Expressions To get only a few attributes of an item, use a projection expression. An expression attribute name is a placeholder that you use in an expression, as an alternative to an actual attribute name. An expression attribute name must begin with a #, and be followed by one or more alphanumeric characters. Expression attribute values are substitutes for the actual values that you want to compare — values that you might not know until runtime. An expression attribute value must begin with a :, and be followed by one or more alphanumeric characters. For PutItem, UpdateItem and DeleteItem operations, you can specify a condition expression to determine which items should be modified. If the condition expression evaluates to true, the operation succeeds; otherwise, the operation fails. An update expression specifies how UpdateItem will modify the attributes of an item—for example, setting a scalar value, or removing elements from a list or a map. Time To Live (TTL) Allows you to define when items in a table expire so that they can be automatically deleted from the database. DynamoDB Queries The Query operation finds items based on primary key values. You can query any table or secondary index that has a composite primary key (a partition key and a sort key). A key condition expression is a search criteria that determines the items to be read from the table or index. You must specify the partition key name and value as an equality condition. You can optionally provide a second condition for the sort key. The sort key condition must use one of the following comparison operators: =, <, <=, >, >=, BETWEEN, AND A single Query operation can retrieve a maximum of 1 MB of data. For further refining of Query results, you can optionally provide a filter expression, to determine which items within the Query results should be returned to you. All of the other results are discarded. The Query operation allows you to limit the number of items that it returns in the result by setting the Limit parameter to the maximum number of items that you want. DynamoDB paginates the results from Query operations, where Query results are divided into “pages”'
