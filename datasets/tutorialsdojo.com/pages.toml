["https://tutorialsdojo.com/amazon-memorydb-for-redis"]
title = "Amazon MemoryDB for Redis - Tutorials Dojo"
description = "Gerome is a Software Engineer with 5 cloud certifications from Amazon Web Services, Microsoft Azure, and Oracle. He co-authored high-quality educational materials in the cloud computing space, which have been used by over a quarter-million people worldwide. He is also part of the AWS Community Builders program, which aims to help fellow IT professionals advance their careers in the cloud. He is passionate about education, and now it's his turn to share his knowledge, experiences, and passion for cloud computing."
full_description = '''Last updated on October 7, 2023 Bookmarks Features Concepts Security Networking Pricing Amazon MemoryDB for Redis Cheat Sheet An in-memory database service for microservices-based applications. MemoryDB stores all of your data in memory, allowing you to achieve microsecond read and single-digit millisecond write latency and high throughput. It also uses a Multi-AZ transactional log to store data across multiple AZs in order to enable fast failover, database recovery, and node restarts. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Features Primary nodes have strong consistency, and replica nodes have guaranteed eventual consistency. Scale horizontally by adding and removing nodes or vertically by changing node types. Write throughput – can be increased by adding shards. Read throughput – can be increased by adding replicas. With Amazon S3, you can store snapshots with a retention period of up to 35 days. Automatic software patching and cluster upgrades. Supports both encryption in-transit / at-rest and authentication of users via ACLs. Concepts Clusters A collection of one or more nodes serving a single dataset. A dataset is partitioned into shards, and each shard has a primary node and up to 5 optional replica nodes. Primary node – serves both read and write requests. Replica node – only serves read requests. A cluster’s nodes are all designed to be the same node type, with the same parameter and security group settings. When a primary node fails over to a replica node, that replica becomes the new primary node for that shard. Each MemoryDB cluster has its own Redis engine version. Each cluster endpoint has an address and a port that clients can use to discover the specific roles, IP addresses, and slots for each node in the cluster. Supports data tiering using a node type from the r6gd family. When you create or modify a cluster without specifying a preferred maintenance window, MemoryDB assigns a 60-minute maintenance window within your region’s maintenance window on a randomly selected day of the week. Data is automatically backed up to a Multi-AZ transactional log, but you can choose to create point-in-time snapshots of a cluster either periodically or on-demand. Nodes The smallest component of a MemoryDB deployment that runs on an Amazon EC2 instance. A node is part of a shard, which is part of a cluster. Each node runs an instance of the engine at the version you specified when you set up your cluster. Every node has its own DNS name and port number. Multiple types of nodes are supported, each with different amounts of memory and processing power. When MemoryDB for Redis replaces a node, the new node may have a different IP address. You must update your application configuration to use the new IP address. Shards A hierarchical arrangement of nodes, each wrapped in a cluster. A grouping of one to six nodes, with one serving as the primary write node and the other five as read replicas. A cluster should always have at least one shard. Supports both replication and multiple shards within a cluster. Parameter groups are named set of engine-specific settings that can be applied to a cluster so that all nodes in the cluster are configured identically. Subnet Groups are a set of subnets that you can assign to your clusters in an Amazon VPC environment. Access Control Lists (ACLs) are a collection of one or more users. Snapshots Supports automatic snapshots. The snapshot window has a minimum length of 60 minutes. You can set the retention limit of your snapshots in Amazon S3. The snapshot is automatically deleted when the retention period expires. Security To control who has access to clusters, you can create users with specific permissions and add them to ACLs. Configure TLS encryption in transit and encryption at rest using AWS KMS keys. Use a VPC security group to allow inbound traffic on the node’s endpoint and port to control which devices and Amazon EC2 instances can connect to MemoryDB clusters in a VPC. Networking An Amazon EC2 instance in the same Amazon VPC can connect to your MemoryDB node. Alternatively, you can use VPC peering to connect to your MemoryDB node from another Amazon VPC. Your application uses the endpoint to connect to your cluster. The endpoint is a unique address that identifies your cluster. Pricing You can choose between two types of nodes: You are charged per hour for on-demand nodes. By reserving nodes in 1-year or 3-year terms, you get discounts on the ongoing hourly usage rate. You can pay using any of the following methods: No Upfront – low hourly rate. Partial Upfront – lower hourly rate. All Upfront – lowest hourly rate. You are charged based on the amount of data (in GB) written to the MemoryDB cluster. You are charged for the additional snapshot storage. Amazon MemoryDB for Redis Cheat Sheet References: https://docs.aws.amazon.com/memorydb/latest/devguide/what-is-memorydb-for-redis.html https://aws.amazon.com/memorydb/ Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> FREE AWS, Azure, GCP Practice Test Samplers <img decoding="async" class="aligncenter wp-image-9295 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg" alt="" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Subscribe to our YouTube Channel <img decoding="async" class="aligncenter wp-image-13778 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube.jpg" alt="Tutorials Dojo YouTube Channel" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Follow Us On Linkedin<img width="400" height="224" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin.jpg" class="image wp-image-11068 attachment-full size-full" alt="" decoding="async" style="max-width: 100%; height: auto;" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /><img width="400" height="224" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack.jpg" class="image wp-image-11067 attachment-full size-full" alt="" decoding="async" style="max-width: 100%; height: auto;" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Recent Posts DeepSeek in Amazon Bedrock: A Comprehensive Demo PHP-FPM Failures Are Killing Your Uptime – Automate Slack Alerts Before It’s Too Late! Commanding Genomics: AWS CLI for Bioinformatics Workflows Written by: Gerome Pagatpatan <img alt='' src='https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2022/12/author-gp.jpg' srcset='https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2022/12/author-gp.jpg 2x' class='avatar avatar-72 photo avatar-default' height='72' width='72' decoding='async'/> Gerome is a Software Engineer with 5 cloud certifications from Amazon Web Services, Microsoft Azure, and Oracle. He co-authored high-quality educational materials in the cloud computing space, which have been used by over a quarter-million people worldwide. He is also part of the AWS Community Builders program, which aims to help fellow IT professionals advance their careers in the cloud. He is passionate about education, and now it's his turn to share his knowledge, experiences, and passion for cloud computing.'''
