title = "Amazon Augmented AI Cheat Sheet"
description = "In this Amazon Augmented AI Cheat Sheet, we will learn the concepts of Amazon Augmented AI. Amazon Augmented AI is a service that helps you easily integrate human reviews in a machine learning workflow."
full_description = '''Last updated on November 14, 2024Amazon Augmented AI Cheat Sheet Amazon A2I is a service that helps you easily integrate human reviews in a machine learning workflow. Simplifies managing a large number of human reviewers at scale. Has direct integration with Amazon Textract and Amazon Rekognition Common Use Cases: Content Moderation where human oversight is required to judge uncertain results from a machine learning model. Manual reviews of low confidence predictions due to documents that are scanned poorly or contain bad handwriting. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Concepts Task Type Type of task to be reviewed. Available task types Key-value pairs extracted by Amazon Textract Unsafe content flagged by Amazon Rekognition Custom machine learning workflows Worker task template This template lets you define a set of instructions for your workers whenever they perform a task. Worker types Amazon Mechanical Turk – a crowdsourcing service that allows you to outsource jobs to an on-demand 24×7 distributed workforce online. Private – A group of workers that you have sourced yourself (e.g., internal employees) Vendor – Third-party vendors from AWS Marketplace that offer human review services. Amazon Augmented AI Pricing $0.02 – $0.03 per reviewed image from Amazon Rekognition $0.02 – $0.03 per reviewed page from Amazon Textract $0.02 – $0.08 per reviewed objects from Custom workflows Note: If you are studying for the AWS Certified Machine Learning Specialty exam, we highly recommend that you take our AWS Certified Machine Learning – Specialty Practice Exams and read our Machine Learning Specialty exam study guide. <img decoding="async" class="aligncenter wp-image-12967" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/11/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-scaled.webp" alt="AWS Certified Machine Learning Specialty Practice Exams" width="700" height="393" /> Amazon Augmented AI Cheat Sheet References: https://aws.amazon.com/augmented-ai/faqs/ https://aws.amazon.com/blogs/awsmarketplace/using-amazon-augmented-ai-with-aws-marketplace-machine-learning-models https://docs.aws.amazon.com/textract/latest/dg/a2i-textract.html Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> FREE AWS, Azure, GCP Practice Test Samplers <img decoding="async" class="aligncenter wp-image-9295 size-full" src="https://td-mainsite-cdn.tu