title = "Amazon Comprehend Cheat Sheet"
description = "Carlo is a cloud engineer and a content creator at Tutorials Dojo. He's also a member of the AWS Community builder and holds 5 AWS Certifications. Carlo specializes in building and automating solutions in the Amazon Web Services Cloud."
full_description = '''Last updated on October 5, 2023 Bookmarks Common Use Cases Concepts Amazon Comprehend Medical Pricing Validate Your Knowledge What is Amazon Comprehend? A managed Natural Language Processing (NLP) service that you can use to extract meaningful information from unstructured texts so you can analyze them in a human-like context. It is an off-the-shelf solution that does not require deep machine learning expertise to get started. Works with social media feeds, web pages, comments, product reviews, articles, or emails. Can analyze texts in real-time by using built-in and custom models. Also offers medical insights and protected health information (PHI) detection via Amazon Comprehend Medical Amazon Comprehend Common Use Cases Sentiment analysis for social media posts Organize documents by topics Knowledge management and discovery <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Classifies support tickets for better issue handling Medical cohort analysis Identify personally identifiable information (PII) in documents. Identify protected health information (PHI) in documents Amazon Comprehend generates insights in six (6) categories: Entities Detects and categorizes real-world objects like date, organization, person, quantity, brands, or even a title given to a song or movie. Custom Entity Recognition Allows you to identify new entities that are not supported by the preset entities. This is useful if you want to extract entities that are specific only to your business, such as product codes. Sentiment Detects and classifies emotions into neutral, positive, negative, or mixed. Language Detects the language used in a text by using identifiers from RFC 5646. Useful for multilingual companies or applications. Key Phrases A key phrase refers to a noun or a noun phrase that describes a particular thing. Personally Identifiable Information (PII) Determines sensitive information that could be used to identify a person, such as full name, birth date, bank account number, phone number, or email. Syntax Determine the different parts of speech used in the document, such as noun, pronoun, verb, adjective, adverb, etc. Amazon Comprehend Concepts Each insight is associated with a confidence score. A confidence score is between 0 and 100, indicating the probability that a given prediction is correct. A product review with a positive sentiment and a 0.99 confidence score highly suggest positive feedback from a customer. Topic Modeling Classifies a collection of documents according to its common subject. For example, you can use Topic Modeling to categorize news articles into politics, sports, business, entertainment, etc. Comprehend custom It helps non-experts in machine learning build and train their own NLP models suited to their specific needs. Amazon Comprehend uses a machine learning method called transfer learning to train custom models. Amazon Comprehend Medical A type of Amazon Comprehend service that is focused on medical use cases A natural language processing service that extracts relevant medical information from unstructured text. Can quickly and accurately gather medical conditions, medication, dosage, strength, and frequency from a text file Has the ability to recognize and analyze Protected Health Information (PHI) from text documents. Amazon Comprehend Pricing Charges are based on units where a single unit is equal to 100 characters. 3 unit (300 characters) minimum charge per request. All insights except for Syntax analysis are charged for $0.0001 per 10M units. Syntax Analysis is charged for $0.00005 per 10M units. Topic Modeling has a flat rate of $1.00 per job. Note: If you are studying for the AWS Certified Machine Learning Specialty exam, we highly recommend that you take our AWS Certified Machine Learning – Specialty Practice Exams and read our Machine Learning Specialty exam study guide. <img decoding="async" class="aligncenter wp-image-17137 size-large" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-1024x585.jpg" alt="AWS Certified Machine Learning Specialty Practice Exam MLS-C01" width="1024" height="585" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-200x114.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-300x171.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-400x229.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-600x343.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-768x439.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-800x457.jpg 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-1024x585.jpg 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-1200x686.jpg 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/05/AWS-Certified-Machine-Learning-Specialty-Practice-Exam-MLS-C01-1536x878.jpg 1536w" sizes="(max-width: 1024px) 100vw, 1024px" /> Validate Your Knowledge Question 1 A Machine Learning Specialist working for an e-commerce company is creating an application using Amazon Comprehend. The application will analyze sentiments for reviews about various electronic products. During development, he noticed that all device model names are labeled as Commercial item. The Specialist wants to identify the model names under a more specific category. Which approach will produce the MOST appropriate result? Use regular expressions to determine the entities. <img width="1010" height="117" border="0" alt="Free AWS Courses" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2022/01/td-learn-for-free-now.png"> Use Topic Modelling to determine entities. Create a Custom Entity Recognition model. Create a list for each product and use string matching to determine their entities. Show me the answer! Correct Answer: 3 Custom entity recognition extends the capability of Amazon Comprehend by enabling you to identify new entity types not supported as one of the preset generic entity types. This means that in addition to identifying entity types such as LOCATION, DATE, PERSON, and so on, you can analyze documents and extract entities like product codes or business-specific entities that fit your particular needs. <img decoding="async" style="display: block; margin-left: auto; margin-right: auto;" src="https://media.tutorialsdojo.com/public/custom-entity-recognizer-m2_01OCT2023.gif" width="800" height="258" /> Creating a custom entity recognition model is a more effective approach, compared to using string matching or regular expressions to identify entities. For example, to extract product codes, it would be difficult to enumerate all possible patterns to apply string matching. But a custom entity recognition model can learn the context where those product codes are most likely to appear and then make such inferences even though it has never previously seen the exact product codes. As well, typos in product codes and the addition of new product codes can still be expected to be caught by Amazon Comprehend’s custom entity recognition model but would be missed when using string matches against a static list. Hence, the correct answer is: Create a Custom Entity Recognition model. The option that says: Use regular expressions to determine the entities is incorrect. Although this is possible, it isn’t as effective as creating a Custom Entity Recognition model. The option that says: Use Topic Modelling to determine entities is incorrect because this is specifically used for determining themes/topics from a collection of documents. Take note that we only need to identify entities from a list of words. The option that says: Create a list for each product and use string matching to determine their entities is incorrect. Like regular expressions, it would be difficult to match all possible patterns with string matching. This would produce less accurate results than when using a Custom Entity Recognition model. References: https://docs.aws.amazon.com/comprehend/latest/dg/custom-entity-recognition.html https://aws.amazon.com/blogs/machine-learning/build-a-custom-entity-recognizer-using-amazon-comprehend/ Note: This question was extracted from our AWS Certified Machine Learning – Specialty Practice Exams. For more AWS practice exam questions with detailed explanations, visit the Tutorials Dojo Portal: <img decoding="async" class="aligncenter wp-image-7692 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-scaled.jpg" alt="Tutorials Dojo AWS Practice Tests" width="2560" height="310" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-200x24.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-300x36.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-400x48.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-600x73.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-768x93.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-800x97.jpg 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-1024x124.jpg 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-1200x145.jpg 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-1536x186.jpg 1536w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2019/08/All-Courses-Horizontal-scaled.jpg 2560w" sizes="(max-width: 2560px) 100vw, 2560px" /> Amazon Comprehend Cheat Sheet References: https://aws.amazon.com/comprehend/ https://docs.aws.amazon.com/comprehend/latest/dg/how-it-works.html https://aws.amazon.com/comprehend/pricing/ Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, ht