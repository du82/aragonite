["https://tutorialsdojo.com/amazon-detective"]
title = "Amazon Detective Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = '''Last updated on November 14, 2024 Bookmarks Concepts Limits Common Use Cases Amazon Detective Cheat Sheet The service automatically collects log data from your AWS resources and uses machine learning, statistical analysis, and graph theory to build a linked set of data that enables you to easily conduct faster and more efficient security investigations. Can be integrated with AWS security services like Amazon GuardDuty, Amazon Macie, and AWS Security Hub as well as partner security products to identify potential security issues, or findings. Amazon Detective can analyze trillions of events from multiple data sources such as VPC Flow Logs, AWS CloudTrail, and Amazon GuardDuty, and automatically creates a unified, interactive view of your resources, users, and the interactions between them over time. This allows you to identify the underlying reasons for the findings, drill down into relevant historical activities, and quickly determine the root cause of a security concern. Amazon Detective’s prebuilt data aggregations, summaries, and context help you to quickly analyze and determine the nature and extent of possible security issues. How It Works <img decoding="async" class="aligncenter wp-image-7641 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective.jpg" alt="Amazon Detective" width="903" height="349" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective-200x77.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective-300x116.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective-400x155.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective-600x232.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective-768x297.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective-800x309.jpg 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/03/Amazon-Detective.jpg 903w" sizes="(max-width: 903px) 100vw, 903px" /> Concepts Investigation – The process of performing triage on suspicious or interesting activity, determining the scope, getting to its underlying source or cause, and then determining how to proceed. Behavior graph – A linked set of data generated from incoming source data that is associated with one or more AWS accounts. Each behavior graph uses the same structure of findings, entities, and relationships. Management account – The AWS account that owns a behavior graph and that uses the behavior graph for investigation. The management account invites member accounts to contribute their data to the behavior graph. Management accounts can also view data usage for the behavior graph, and remove member accounts from the behavior graph. Member account – An AWS account that a management account invited to contribute data to a behavior graph. Member accounts can respond to the behavior graph invitation and remove their account from the behavior graph. They have no other access to the behavior graph. Finding – A security issue detected by Amazon GuardDuty. Entity – An item extracted from the incoming data. Each entity has a type, which identifies the type of object it represents. Examples include IP addresses, Amazon EC2 instances, and AWS users. For each entity, the source data is also used to populate entity properties. Property values can be extracted directly from source records or aggregated across multiple records. Relationship – Activity that occurs between individual entities. Relationships are also extracted from the incoming source data. Similar to an entity, a relationship has a type, which identifies the types of entities involved and the direction of the connection. An example of a relationship type is an IP address connecting to an Amazon EC2 instance. Profile – For a finding or an entity, a single page that provides a collection of data visualizations plus supporting guidance. For findings, profiles help analysts to determine whether the finding is of genuine concern or a false positive. For entities, profiles provide supporting details for an investigation into a finding or for a general hunt for suspicious activity. Scope time – The time window that is used to scope the data displayed on finding and entity profiles. The default scope time for a finding profile reflects the first and last times when the suspicious activity was observed. The default scope time for an entity profile is the previous 24 hours. Amazon Detective needs to be enabled on a per region basis and enables you to quickly analyze activity across all your accounts within each region. Amazon Detective is a multi-account service that aggregates data from monitored member accounts under a single management account within the same region. You can configure multi-account monitoring deployments in the same way that you configure management and member accounts in Amazon GuardDuty and AWS Security Hub. If you cannot use the same management accounts across all of the services, then after you enable Detective, you can optionally create a cross-account role. If you are using Amazon GuardDuty, Amazon Detective will automatically ingest and process two weeks of historical log data upon activation. The management account for a behavior graph can disable Amazon Detective. When you disable Detective, the behavior graph and its associated Detective data are deleted. Deleted behavior graphs cannot be restored. Amazon Detective is able to analyze IAM role sessions by processing VPC flow records and CloudTrail management events from across a customer’s enabled accounts, collating data about activity performed under an IAM Role into role sessions. This lets you visualize and understand the actions that users and apps have performed using the assumed roles. Amazon Detective vs Amazon GuardDuty vs AWS Security Hub Amazon GuardDuty is a threat detection service that continuously monitors for malicious activity and unauthorized behavior to protect your AWS accounts and workloads. With Security Hub, you have a single place that aggregates, organizes, and prioritizes your security alerts, or findings, from multiple AWS services, such as Amazon GuardDuty, Amazon Inspector, and Amazon Macie, as well as from AWS Partner solutions. Amazon Detective simplifies the process of investigating security findings and identifying the root cause. Amazon Detective Limits You can maintain up to a year of aggregated findings for analysis Common Use Cases Triage security findings Incident investigation Hunting for hidden security threats Note: If you are studying for the AWS Certified Security Specialty exam, we highly recommend that you take our AWS Certified Security – Specialty Practice Exams and read our Security Specialty exam study guide. <img decoding="async" class="aligncenter wp-image-8176" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/11/AWS-Certified-Security-Specialty-Practice-Exam-scaled.webp" alt="AWS Certified Security - Specialty Exam Study Path" width="600" height="337" /> Amazon Detective Cheat Sheet References: https://aws.amazon.com/detective/ https://aws.amazon.com/detective/faqs/ https://docs.aws.amazon.com/detective/latest/adminguide/what-is-detective.html https://docs.aws.amazon.com/detective/latest/userguide/detective-investigation-about.html Search for: <img width="1010" height="117" border="0" alt="Free AWS Courses" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2022/01/td-learn-for-free-now.png"> 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> FREE AWS, Azure, GCP Practice Test Samplers <img decoding="async" class="aligncenter wp-image-9295 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg" alt="" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Subscribe to our YouTube Channel <img decoding="async" class="aligncenter wp-image-13778 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube.jpg" alt="Tutorials Dojo YouTube Channel" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Follow Us On Linkedin<img width="400" height="224" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin.jpg" class="image wp-image-11068 attachment-full size-full" alt="" decoding="async" style="max-width: 100%; height: auto;" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /><img width="400" height="224" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack.jpg" class="image wp-image-11067 attachment-full size-full" alt="" decoding="async" style="max-width: 100%; height: auto;" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/join-us-on-slack.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Recent Posts DeepSeek in Amazon Bedrock: A Comprehensive Demo PHP-FPM Failures Are Killing Your Uptime – Automate Slack Alerts Before It’s Too Late! Commanding Genomics: AWS CLI for Bioinformatics Workflows Written by: Jon Bonso <img alt='' src='https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2016/03/Jon-Bonso-Tutorials-Dojo.jpg' srcset='https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2016/03/Jo