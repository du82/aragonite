title = "Amazon Cognito Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = 'Last updated on November 14, 2024 Bookmarks How It Works User Pools Identity Pools Common Use Cases Pricing Validate Your Knowledge Amazon Cognito Cheat Sheet A user management and authentication service that can be integrated to your web or mobile applications. Amazon Cognito also enables you to authenticate users through an external identity provider and provides temporary security credentials to access your app’s backend resources in AWS or any service behind Amazon API Gateway. Amazon Cognito works with external identity providers that support SAML or OpenID Connect, social identity providers (Facebook, Twitter, Amazon, Google, Apple) and you can also integrate your own identity provider. An Amazon Cognito ID token is represented as a JSON Web Token (JWT). Amazon Cognito uses JSON Web Tokens for token authentication. How It Works <img decoding="async" class="aligncenter wp-image-7536 " src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito.jpg" alt="Amazon Cognito" width="405" height="383" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito-200x189.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito-300x283.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito-400x378.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito.jpg 506w" sizes="(max-width: 405px) 100vw, 405px" /> User Pools User pools are user directories that provide sign-up and sign-in options for your app users. Users can sign in to your web or mobile app through Amazon Cognito, or federate through a third-party identity provider (IdP). You can use the aliasing feature to enable your users to sign up or sign in with an email address and a password or a phone number and a password. User pools are each created in one AWS Region, and they store the user profile data only in that region. You can also send user data to a different AWS Region. Tokens provided through user pools: Access tokens contain scopes and groups and are used to grant access to authorized resources. Access tokens can be configured to expire in as little as five minutes or as long as 24 hours. Refresh tokens contain the information necessary to obtain a new ID or access token. Refresh tokens can be configured to expire in as little as one hour or as long as ten years. A User Pool is like a directory of users. Manage Users After you create a user pool, you can create, confirm, and manage users accounts. Amazon Cognito User Pools groups lets you manage your users and their access to resources by mapping IAM roles to groups. User accounts are added to your user pool in one of the following ways: The user signs up in your user pool’s client app, which can be a mobile or web app. You can import the user’s account into your user pool. You can create the user’s account in your user pool and invite the user to sign in. Sign up authflow below <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> <img decoding="async" class="aligncenter wp-image-7537 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito2.jpg" alt="Amazon Cognito" width="523" height="380" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito2-200x145.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito2-300x218.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito2-400x291.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito2.jpg 523w" sizes="(max-width: 523px) 100vw, 523px" /> Identity Pools Use this feature if you want to federate users to your AWS services. Identity pools enable you to grant your users temporary AWS credentials to access AWS services, such as Amazon S3 and DynamoDB. Identity pools support anonymous guest users, as well as the following identity providers: Amazon Cognito user pools Social sign-in with Facebook, Google, and Login with Amazon OpenID Connect (OIDC) providers SAML identity providers Developer authenticated identities To save user profile information, your identity pool needs to be integrated with a user pool. Amazon Cognito Identity Pools can support unauthenticated identities by providing a unique identifier and AWS credentials for users who do not authenticate with an identity provider. The permissions for each authenticated and non-authenticated user are controlled through IAM roles that you create. Once you have an OpenID Connect token, you can then trade this for temporary AWS credentials via the AssumeRoleWithWebIdentity API call in AWS Security Token Service (STS). This call is no different than if you were using Facebook, Google+, or Login with Amazon directly, except that you are passing an Amazon Cognito token instead of a token from one of the other public providers. Common Use Cases Enable your users to authenticate with a user pool. <img decoding="async" class="aligncenter wp-image-7538 " src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3.jpg" alt="Amazon Cognito" width="705" height="123" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3-200x35.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3-300x52.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3-400x70.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3-600x105.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3-768x134.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3-800x139.jpg 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito3.jpg 855w" sizes="(max-width: 705px) 100vw, 705px" /> After a successful user pool sign-in, your web or mobile app will receive user pool tokens from Amazon Cognito. You can use those tokens to control access to your server-side resources. <img decoding="async" class="aligncenter wp-image-7539 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito4.jpg" alt="Amazon Cognito" width="455" height="329" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito4-200x145.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito4-300x217.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito4-400x289.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito4.jpg 455w" sizes="(max-width: 455px) 100vw, 455px" /> Access resources with API Gateway and Lambda with a User Pool. API Gateway validates the tokens from a successful user pool authentication, and uses them to grant your users access to resources including Lambda functions, or your own API. <img decoding="async" class="aligncenter wp-image-7540 " src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito5.jpg" alt="Amazon Cognito" width="424" height="277" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito5-200x131.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito5-300x196.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito5-400x261.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito5.jpg 554w" sizes="(max-width: 424px) 100vw, 424px" /> After a successful user pool authentication, your app will receive user pool tokens from Amazon Cognito. You can exchange them for temporary access to other AWS services with an identity pool. <img decoding="async" class="aligncenter wp-image-7541 " src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito7.jpg" alt="Amazon Cognito" width="478" height="339" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito7-200x142.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito7-300x214.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito7-400x283.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito7-600x425.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito7.jpg 672w" sizes="(max-width: 478px) 100vw, 478px" /> Enable your users access to AWS services through an identity pool. In exchange, the identity pool grants temporary AWS credentials that you can use to access other AWS services. <img decoding="async" class="aligncenter wp-image-7542 " src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito8.jpg" alt="Amazon Cognito" width="433" height="321" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito8-200x148.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito8-300x223.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito8-400x297.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/02/Amazon-Cognito8.jpg 554w" sizes="(max-width: 433px) 100vw, 433px" /> Grant your users access to AWS AppSync resources with tokens from a successful Amazon Cognito authentication (from a user pool or an identity pool). Amazon Cognito is also commonly used together with AWS Amplify, a framework for developing web and mobile applications with AWS services. Amazon Cognito Sync Store and sync data across devices using Cognito Sync. You can programmatically trigger the sync of data sets between client devices and the Amazon Cognito sync store by using the synchronize() method in the AWS Mobile SDK. The synchronize() method reads the latest version of the data available in the Amazon Cognito sync store and compares it to the local, cached copy. After comparison, the synchronize() method writes the latest updates as necessary to the local data store and the Amazon Cognito sync store. The Amazon Cognito Sync store is a key/value pair store linked to an Amazon Cognito identity. There is no limit to the number of identities you can create in your identity pools and sync store. Each user information store can have a maximum size of 20MB. Each data set within the user information store can contain up to 1MB of data. Within a data set you can have up to 1024 keys. With Cognito Streams, you can push sync store data to a Kinesis stream in your AWS account. Advanced Security Features When Amazon Cognito detects unusual sign-in activity, such as sign-in attempts from new locations and devices, it assigns a risk score to the activity and lets you choose to either prompt users for additional verification or block the sign-in request. Users can verify their identities using SMS or a Time-based One-time Password (TOTP) generator. When Amazon Cognito detects users have entered credentials that have been compromised elsewhere, it prompts a password change. Integration with AWS Lambda You can create an AWS Lambda function and then trigger that function during user pool operations such as user sign-up, confirmation, and sign-in (authentication) with a Lambda trigger. Amazon Cognito invokes Lambda functions synchronously. When called, your Lambda function must respond within 5 seconds. If it does not, Amazon Cognito retries the call. After 3 unsuccessful attempts, the function times out. You can create a Lambda function as a backend to Cognito that serves auth challenges to users signing in. Amazon Cognito Pricing If you are using Cognito Identity to create a User Pool, you pay based on your monthly active users (MAUs) only. A user is counted as a MAU if, within a calendar month, there is an identity operation related to that user, such as sign-up, sign-in, token refresh or password change. The Cognito Your User Pool feature has a free tier of 50,000 MAUs for users who sign in directly to Cognito User Pools or through social identity providers, and 50 MAUs for users federated through SAML 2.0 based identity providers. You pay an additional fee when you enable advanced security features for Amazon Cognito. Amazon Cognito uses Amazon SNS for sending SMS messages for Multi-Factor Authentication (MFA) and phone number verification, so there are associated SNS costs as well. Note: If you are studying for the AWS Certified Security Specialty exam, we highly recommend that you take our AWS Certified Security – Specialty Practice Exams and read our Security Specialty exam study guide. <img decoding="async" class="aligncenter wp-image-8176" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/11/AWS-Certified-Security-Specialty-Practice-Exam-scaled.webp" alt="AWS Certified Security - Specialty Exam Study Path" width="600" height="337" /> Validate Your Knowledge Question 1 A Software Engineer has developed a web application to monitor the pending/processed orders on the corporate sales server. The application needs to be accessed by Delivery, Finance, and Admin teams. The Security Administrator decided to integrate Amazon Cognito to the application to provide user sign-in functionality for the members of each team. The Delivery team should be able to update entries on the application while the Finance team only needs read permissions to verify the flow of orders. Which of the following options will help the Administrator grant distinct permissions for each team member? Amazon Cognito User Pool Groups Amazon Cognito Identity Pool Amazon Cognito Sync Amazon Cognito Federated Identities <img width="1010" height="117" border="0" alt="Free AWS Courses" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2022/01/td-learn-for-free-now.png"> Show me the answer! Correct Answer: 1 Amazon Cognito User Pool supports “groups” which enables you to create and manage groups, add users to groups, and remove users from groups. Use groups to create collections of users to manage their permissions or to represent different types of users. You can assign an AWS Identity and Access Management (IAM) role to a group to define the permissions for members of a group. You can use groups to create a collection of users in a user pool, which is often done to set the permissions for those users. For example, you can create separate groups for users who are readers, contributors, and editors of your website and app. Using the IAM role associated with a group, you can also set different permissions for those different groups so tha'
