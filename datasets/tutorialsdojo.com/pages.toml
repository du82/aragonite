title = "Amazon Neptune Cheat Sheet"
description = "Carlo is a cloud engineer and a content creator at Tutorials Dojo. He's also a member of the AWS Community builder and holds 5 AWS Certifications. Carlo specializes in building and automating solutions in the Amazon Web Services Cloud."
full_description = '''Last updated on November 14, 2024 Bookmarks How it Works Common Use Cases Performance Reliability Backup And Restore Security Pricing Monitoring Limitations Amazon Neptune Cheat Sheet Amazon Neptune is a fully managed graph database service used for building applications that work with highly connected datasets. Optimized for storing billions of relationships between pieces of information. Provide milliseconds latency when querying the graph. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Neptune supports graph query languages like Apache TinkerPop Gremlin and W3C’s SPARQL. How it works <img decoding="async" class="aligncenter size-full wp-image-9711" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2.jpg" alt="Amazon Neptune" width="1542" height="544" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-200x71.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-300x106.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-400x141.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-600x212.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-768x271.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-800x282.jpg 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-1024x361.jpg 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-1200x423.jpg 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2-1536x542.jpg 1536w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/Amazon-Neptune-2.jpg 1542w" sizes="(max-width: 1542px) 100vw, 1542px" /> Common Use Cases Social Networking Amazon Neptune can easily process user’s interactions like comments, follows, and likes in a social network application through highly interactive queries. Recommendation Engines You can use Amazon Neptune to build applications for suggesting personalized and relevant products based on relationships between information such as customer’s interest and purchase history. Knowledge Graphs With the help of Amazon Neptune, you can create a knowledge graph for search engines that will enable users to quickly discover new information. Identity Graphs You can use Amazon Neptune as a graph database to easily link and update user profile data for ad-targeting, personalization, and analytics. Amazon Neptune Performance Supports 15 read replicas and 100,000s of queries per second. Amazon Neptune uses query optimization for both SPARQL queries and Gremlin traversals. Reliability Database volume is replicated six ways across three availability zones. Amazon Neptune can withstand a loss of up to two copies of data and three copies of data without affecting write availability and read availability respectively. Amazon Neptune’s storage is self-healing. Data blocks are continuously scanned for errors and replaced automatically. Amazon Neptune uses asynchronous replication to update the changes made to the primary instance to all of Neptune’s read replicas. Replicas can act as a failover target with no data loss. Supports automatic failover. Supports promotion priority within a cluster. Amazon Neptune will promote the replica with the highest priority tier to primary when the primary instance fails. Cluster Volume Local Storage STORED DATA TYPE Persistent data Temporary data SCALABILITY Automatically scales out when more space is required Limited to the DB Instance class Backup And Restore Automated backups are always enabled. Supports Point-In-Time restoration, which can be up to 5 minutes in the past. Supports sharing of encrypted manual snapshots. Amazon Neptune Security Amazon Neptune supports AWS Key Management Service ( KMS ) encryption at rest. It also supports HTTPS connection. Neptune enforces a minimum version of TLS v1.2 and SSL client connections to Neptune in all AWS Regions where Neptune is available. To encrypt an existing Neptune instance, you should create a new instance with encryption enabled and migrate your data into it. You can create custom endpoints for Amazon Neptune to access your workload. Custom endpoints allow you to distribute your workload across a designated set of instances within a Neptune cluster. Offers database deletion protection. Amazon Neptune Pricing You are billed based on the DB instance hours, I/O requests, storage, and Data transfer. Storage rate and I/O rate is billed in per GB-month increments and per million request increments respectively. Amazon Neptune Monitoring Visualize your graph using the Neptune Workbench. You can receive event notifications on your Amazon Neptune DB clusters, DB instances, DB cluster snapshots, parameter groups, or security groups through Amazon SNS. Amazon Neptune Limitations It does not support cross-region replicas. Encryption of an existing Neptune instance is not supported. Sharing of automatic DB snapshots to other accounts is not allowed. A workaround for this is to manually copy the snapshot from the automatic snapshot, then, copy the manual snapshot to another account. Note: If you are studying for the AWS Certified Data Engineer Associate exam, we highly recommend that you take our AWS Certified Data Engineer Associate Practice Exams and read our Data Engineer Associate exam study guide. <img decoding="async" class="aligncenter" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/TD-AWS-Data-Engineer-Associate-jpg.webp" alt="AWS Certified Data Engineer Associate exam" width="700" height="393" /> Amazon Neptune Cheat Sheet Resource: https://aws.amazon.com/neptune/ Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> FREE AWS, Azure, GCP Practice Test Samplers <img decoding="async" class="aligncenter wp-image-9295 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg" alt="" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content