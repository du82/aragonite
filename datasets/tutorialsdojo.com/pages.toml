["https://tutorialsdojo.com/amazon-elastic-container-service-amazon-ecs"]
title = "Amazon ECS Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = 'Last updated on January 18, 2024 Bookmarks Features Components AWS Fargate Task Definitions for Fargate Launch Task Definitions for EC2 Launch Type Monitoring Tagging Pricing Amazon Elastic Container Service Cheat Sheet A container management service to run, stop and manage Docker containers on a cluster. ECS can be used to create a consistent deployment and build experience, manage, and scale batch and Extract-Transform-Load (ETL) workloads, and build sophisticated application architectures on a microservices model. Amazon ECS is a regional service. Features You can create ECS clusters within a new or existing VPC. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> After a cluster is up and running, you can define task definitions and services that specify which Docker container images to run across your clusters. AWS Compute SLA guarantees a Monthly Uptime Percentage of at least 99.99% for Amazon ECS. Amazon ECS Exec is a way for customers to execute commands in a container running on Amazon EC2 instances or AWS Fargate. ECS Exec gives you interactive shell or single command access to a running container. Components Containers and Images Your application components must be architected to run in containers ー containing everything that your software application needs to run: code, runtime, system tools, system libraries, etc. Containers are created from a read-only template called an image. Images are typically built from a Dockerfile, a plain text file that specifies all of the components that are included in the container. These images are then stored in a registry from which they can be downloaded and run on your cluster. When you launch a container instance, you have the option of passing user data to the instance. The data can be used to perform common automated configuration tasks and even run scripts when the instance boots. Docker Volumes can be a local instance store volume, EBS volume, or EFS volume. Connect your Docker containers to these volumes using Docker drivers and plugins. Task Components Task definitions specify various parameters for your application. It is a text file, in JSON format, that describes one or more containers, up to a maximum of ten, that form your application. Task definitions are split into separate parts: Task family – the name of the task, and each family can have multiple revisions. IAM task role – specifies the permissions that containers in the task should have. Network mode – determines how the networking is configured for your containers. Container definitions – specify which image to use, how much CPU and memory the container is allocated, and many more options. Volumes – allow you to share data between containers and even persist the data on the container instance when the containers are no longer running. Task placement constraints – lets you customize how your tasks are placed within the infrastructure. Launch types – determines which infrastructure your tasks use. Tasks and Scheduling A task is the instantiation of a task definition within a cluster. After you have created a task definition for your application, you can specify the number of tasks that will run on your cluster. Each task that uses the Fargate launch type has its own isolation boundary and does not share the underlying kernel, CPU resources, memory resources, or elastic network interface with another task. The task scheduler is responsible for placing tasks within your cluster. There are several different scheduling options available. REPLICA — places and maintains the desired number of tasks across your cluster. By default, the service scheduler spreads tasks across Availability Zones. You can use task placement strategies and constraints to customize task placement decisions. DAEMON — deploys exactly one task on each active container instance that meets all of the task placement constraints that you specify in your cluster. When using this strategy, there is no need to specify a desired number of tasks, a task placement strategy, or use Service Auto Scaling policies. You can upload a new version of your application task definition, and the ECS scheduler automatically starts new containers using the updated image and stop containers running the previous version. Amazon ECS tasks running on both Amazon EC2 and AWS Fargate can mount Amazon Elastic File System (EFS) file systems. Clusters When you run tasks using ECS, you place them in a cluster, which is a logical grouping of resources. Clusters are Region-specific. Clusters can contain tasks using both the Fargate and EC2 launch types. When using the Fargate launch type with tasks within your cluster, ECS manages your cluster resources. When using the EC2 launch type, then your clusters are a group of container instances you manage. These clusters can contain multiple different container instance types, but each container instance may only be part of one cluster at a time. Before you can delete a cluster, you must delete the services and deregister the container instances inside that cluster. Enabling managed Amazon ECS cluster auto-scaling allows ECS to manage the scale-in and scale-out actions of the Auto Scaling group. On your behalf, Amazon ECS creates an AWS Auto Scaling scaling plan with a target tracking scaling policy based on the target capacity value that you specify. Services ECS allows you to run and maintain a specified number of instances of a task definition simultaneously in a cluster. In addition to maintaining the desired count of tasks in your service, you can optionally run your service behind a load balancer. There are two deployment strategies in ECS: Rolling Update This involves the service scheduler replacing the currently running version of the container with the latest version. The number of tasks ECS adds or removes from the service during a rolling update is controlled by the deployment configuration, which consists of the minimum and maximum number of tasks allowed during service deployment. Blue/Green Deployment with AWS CodeDeploy This deployment type allows you to verify a new deployment of a service before sending production traffic to it. The service must be configured to use either an Application Load Balancer or Network Load Balancer. Container Agent The container agent runs on each infrastructure resource within an ECS cluster. It sends information about the resource’s current running tasks and resource utilization to ECS, and starts and stops tasks whenever it receives a request from ECS. The container agent is only supported on Amazon EC2 instances. Service Load Balancing Amazon ECS services support the Application Load Balancer, Network Load Balancer, and Classic Load Balancer ELBs. Application Load Balancers are used to route HTTP/HTTPS (or layer 7) traffic. Network Load Balancers are used to route TCP or UDP (or layer 4) traffic. Classic Load Balancers are used to route TCP traffic. You can attach multiple target groups to your Amazon ECS services that are running on either Amazon EC2 or AWS Fargate. This allows you to maintain a single ECS service that can serve traffic from both internal and external load balancers and support multiple path-based routing rules and applications that need to expose more than one port. The Classic Load Balancer doesn’t allow you to run multiple copies of a task on the same instance. You must statically map port numbers on a container instance. However, an Application Load Balancer uses dynamic port mapping, so you can run multiple tasks from a single service on the same container instance. If a service’s task fails the load balancer health check criteria, the task is stopped and restarted. This process continues until your service reaches the number of desired running tasks. Services with tasks that use the awsvpc network mode, such as those with the Fargate launch type, do not support Classic Load Balancers. You must use NLB instead of TCP. AWS Fargate You can use Fargate with ECS to run containers without having to manage servers or clusters of EC2 instances. You no longer have to provision, configure, or scale clusters of virtual machines to run containers. Fargate only supports container images hosted on Elastic Container Registry (ECR) or Docker Hub. Task Definitions for Fargate Launch Type Fargate task definitions require that the network mode is set to awsvpc. The awsvpc network mode provides each task with its own elastic network interface. Fargate task definitions require that you specify CPU and memory at the task level. Fargate task definitions only support the awslogs log driver for the log configuration. This configures your Fargate tasks to send log information to Amazon CloudWatch Logs. Task storage is ephemeral. After a Fargate task stops, the storage is deleted. Amazon ECS tasks running on both Amazon EC2 and AWS Fargate can mount Amazon Elastic File System (EFS) file systems. Put multiple containers in the same task definition if: Containers share a common lifecycle. Containers are required to be run on the same underlying host. You want your containers to share resources. Your containers share data volumes. Otherwise, define your containers in separate task definitions so that you can scale, provision, and de-provision them separately. Task Definitions for EC2 Launch Type Create task definitions that group the containers that are used for a common purpose, and separate the different components into multiple task definitions. <img width="1010" height="117" border="0" alt="Free AWS Courses" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2022/01/td-learn-for-free-now.png"> After you have your task definitions, you can create services from them to maintain the availability of your desired tasks. For EC2 tasks, the following are the types of data volumes that can be used: Docker volumes Bind mounts Private repositories are only supported by the EC2 Launch Type. Amazon Elastic Container Service Monitoring You can configure your container instances to send log information to CloudWatch Logs. This enables you to view different logs from your container instances in one convenient location. With CloudWatch Alarms, watch a single metric over a time period that you specify, and perform one or more actions based on the value of the metric relative to a given threshold over a number of time periods. Share log files between accounts, and monitor CloudTrail log files in real time by sending them to CloudWatch Logs. Amazon Elastic Container Service Tagging ECS resources, including task definitions, clusters, tasks, services, and container instances, are assigned an Amazon Resource Name (ARN) and a unique resource identifier (ID). These resources can be tagged with values that you define, to help you organize and identify them. Amazon Elastic Container Service Pricing With Fargate, you pay for the amount of vCPU and memory resources that your containerized application requests. vCPU and memory resources are calculated from the time your container images are pulled until the Amazon ECS Task terminates. There is no additional charge for the EC2 launch type. You pay for AWS resources (e.g. EC2 instances or EBS volumes) you create to store and run your application. Amazon Elastic Container Service Cheat Sheet References: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html https://aws.amazon.com/ecs/features/ https://aws.amazon.com/ecs/pricing/ https://aws.amazon.com/ecs/faqs/ Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> FREE AWS, Azure, GCP Practice Test Samplers <img decoding="async" class="aligncenter wp-image-9295 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg" alt="" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Subscribe to our YouTube Channel <img decoding="async" class="aligncenter wp-image-13778 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube.jpg" alt="Tutorials Dojo YouTube Channel" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/04/TD-Sidebar-Youtube.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> Follow Us On Linkedin<img width="400" height="224" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin.jpg" class="image wp-image-11068 attachment-full size-full" alt="" decoding="async" style="max-width: 100%; height: auto;" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/09/follow-us-on-linkedin.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /><img width="400" height="224" src="https://td-mainsite-cdn.tutori'
