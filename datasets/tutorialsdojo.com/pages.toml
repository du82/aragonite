["https://tutorialsdojo.com/amazon-documentdb"]
title = "Amazon DocumentDB Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = '''Last updated on November 14, 2024 Bookmarks How it Works Performance Scaling Reliability Backup and Restore Security Pricing Limitations Amazon DocumentDB Cheat Sheet Fully managed document database service designed to be fast, scalable, and highly available. Data is stored in JSON-like documents. Compatible with MongoDb. Flexible schema and indexing. Commonly used for content management, user profiles, and real-time big data. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> How it Works <img decoding="async" class="aligncenter wp-image-10022 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work.png" alt="how does amazon documentdb work" width="773" height="436" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work-200x113.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work-300x169.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work-400x226.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work-600x338.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work-768x433.png 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/08/how-does-amazon-documentdb-work.png 773w" sizes="(max-width: 773px) 100vw, 773px" /> An Amazon DocumentDB cluster decouples storage and compute. A cluster consists of Cluster volume and Instances Cluster volume refers to the storage layer that spans multiple Availability Zones. Each Availability Zone has a copy of the cluster data. Instances refers to the compute layer. It provides the processing power needed for the database to write data to, and read data from, the cluster volume. Amazon DocumentDB Endpoints Cluster endpoint Connects to cluster’s current primary instance. Can be used for both read and write operations. Reader endpoint Connects to one of the available replicas of the cluster. Use for read operations only. If the cluster has more than one replica, the reader endpoint will direct each request to DocumentDB replicas. Instance endpoint Connects to a specific instance in the cluster. Use for specialized workloads that will only affect specific replica instances. Performance Provides millions of requests per second with millisecond latency and has twice the throughput of MongoDb. Amazon DocumentDB Scaling The minimum storage is 10GB. The Amazon DocumentDB storage will automatically scale up to 64 TB in 10 GB increments without affecting performance. The Amazon DocumentDB cluster can be scaled by modifying the instance class for each instance in the cluster. You can create up to 15 Amazon DocumentDB replicas in the cluster. The replication lag is usually less than 100 milliseconds after the primary instance has written an update. Amazon DocumentDB Reliability The cluster volume provides durability by maintaining six copies of all data across three Availability Zones. Amazon DocumentDB uses asynchronous replication to update the changes made to the primary instance to all of DocumentDB’s read replicas. In most cases, the DocumentDB’s restart time is less than a minute after a database crash. DocumentDB replicas can act as a failover target with no data loss. Supports automatic failover. Supports promotion priority within a cluster. Amazon DocumentDB will promote the replica with the highest priority tier to primary when the primary instance fails. To increase the cluster’s availability, create replicas in multiple Availability Zones. The Amazon DocumentDB will automatically include the replicas when selecting for a failover target in the event of an instance failure. Backup And Restore Cluster Volume Local Storage STORED DATA TYPE Persistent data Temporary data SCALABILITY Automatically scales out when more space is required Limited to the DB Instance class Automated backups are always enabled. Supports Point-In-Time restoration, which can be up to 5 minutes in the past. You can restore from a cluster snapshot. Supports sharing of encrypted manual snapshots. Supports cross-region snapshot copying. Amazon DocumentDB Security You can authenticate a connection to a DocumentDB database through standard MongoDb tools with Salted Challenge Response Authentication Mechanism (SCRAM). You can authenticate and authorize the use of DocumentDB management APIs through the use of IAM users, roles, and policies. Data in transit is encrypted using Transport Layer Security (TLS). Data at rest is encrypted using keys you manage through AWS KMS. Amazon DocumentDB supports role based access control ( RBAC ) with built-in roles to enforce the principle of least privileged access. Amazon DocumentDB Pricing You are billed based on four categories On-demand instances Pricing per second with a 10-minute minimum Database I/O Pricing per million I/Os Database Storage Pricing per GB/month Backup Storage Pricing per GB/month Amazon DocumentDB Limitations Amazon DocumentDB supports the Global Clusters feature which allows you to launch up to five read-only replicas. Encryption of an existing DocumentDB instance is not supported. Sharing of automatic DB snapshots to other accounts is not allowed. A workaround for this is to manually copy the snapshot from the automatic snapshot, then, copy the manual snapshot to another account. Note: If you are studying for the AWS Certified Data Engineer Associate exam, we highly recommend that you take our AWS Certified Data Engineer Associate Practice Exams and read our Data Engineer Associate exam study guide. <img decoding="async" class="aligncenter" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/TD-AWS-Data-Engineer-Associate-jpg.webp" alt="" width="700" height="393" /> Amazon DocumentDB Cheat Sheet References: https://aws.amazon.com/documentdb/faqs/ https://aws.amazon.com/blogs/database/migrating-to-amazon-documentdb-with-the-online-method/ Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg 400w" sizes="(max-width: 400px) 100vw, 400px" /> FREE AWS, Azure, GCP Practice Test Samplers <img decoding="async" class="aligncenter wp-image-9295 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/07/free-sampler.jpg" alt="" width="400" height="224" srcset="https://td-mainsite-cdn.