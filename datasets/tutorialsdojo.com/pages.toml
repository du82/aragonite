["https://tutorialsdojo.com/amazon-cognito-user-pools-vs-identity-pools"]
title = "Amazon Cognito User Pools vs Identity Pools"
description = "Kenneth is an AWS Architect & Linux System Administrator. He's a Red Hat Certified System Administrator, AWS Certified Solutions Architect Professional, and a VMware Certified Professional. He's also a registered Electronics Engineer and Cisco Certified Network Associate (CCNA). He enjoys exploring cloud platforms and administering Linux systems. When he's not busy, you’ll find him online playing League of Legends."
full_description = '''Last updated on August 29, 2024 Bookmarks Amazon Cognito User Pools Amazon Cognito Identity Pools With the proliferation of smartphones in our connected world, more and more developers are quickly deploying their applications on the cloud. One of the first challenges in developing applications is allowing users to log in and authenticate on your applications. There are multiple stages involved in user verification and most of these are not visible from the end-user. AWS provides an easy solution for this situation. User Identity verification is at the core of Amazon Cognito. It provides solutions for three key areas of user identification: Authentication – provides users sign-up and sign-in options. Enables support for federation with Enterprise Identities (Microsoft AD), or Social Identities (Amazon, Facebook, Google, etc.) Authorization – sets of permission or operations allowed for a user. It provides fine-grained access control to resources. User Management – allows management of user lifecycles, such as importing users, onboarding users, disabling users, and storing and managing user profiles. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> In this post, we’ll talk about Cognito User Pools and Identity Pools, including an overview of how they are used to provide authentication and authorization functionalities that can be integrated on your mobile app. Amazon Cognito User Pools Amazon Cognito User Pools are used for authentication. To verify your user’s identity, you will want to have a way for them to login using username/passwords or federated login using Identity Providers such as Amazon, Facebook, Google, or a SAML supported authentication such as Microsoft Active Directory. You can configure these Identity Providers on Cognito, and it will handle the interactions with these providers so you only have to worry about handling the Authentication tokens on your app. <img decoding="async" class="wp-image-8481 size-full aligncenter" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers.png" alt="Amazon Cognito Integration with Identity Providers" width="731" height="471" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers-200x129.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers-300x193.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers-400x258.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers-460x295.png 460w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers-600x387.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Amazon-Cognito-Integration-with-Identity-Providers.png 731w" sizes="(max-width: 731px) 100vw, 731px" /> With Cognito User Pools, you can provide sign-up and sign-in functionality for your mobile or web app users. You don’t have to build or maintain any server infrastructure on which users will authenticate. This diagram shows how authentication is handled with Cognito User Pools: <img decoding="async" class="alignnone wp-image-8482 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication.png" alt="Cognito User Pool for Authentication" width="779" height="598" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication-200x154.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication-300x230.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication-400x307.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication-600x461.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication-768x590.png 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-User-Pool-for-Authentication.png 779w" sizes="(max-width: 779px) 100vw, 779px" /> Users send authentication requests to Cognito User Pools. The Cognito user pool verifies the identity of the user or sends the request to Identity Providers such as Facebook, Google, Amazon, or SAML authentication (with Microsoft AD). The Cognito User Pool Token is sent back to the user. The person can then use this token to access your backend APIs hosted on your EC2 clusters or in API Gateway and Lambda. If you want a quick login page, you can even use the pre-built login UI provided by Amazon Cognito which you just have to integrate on your application. <img decoding="async" class="alignnone wp-image-8483 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Default-Amazon-Cognito-User-Login-Page.png" alt="Default Amazon Cognito User Login Page" width="500" height="468" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Default-Amazon-Cognito-User-Login-Page-200x187.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Default-Amazon-Cognito-User-Login-Page-300x281.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Default-Amazon-Cognito-User-Login-Page-400x374.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Default-Amazon-Cognito-User-Login-Page.png 500w" sizes="(max-width: 500px) 100vw, 500px" /> On the Amazon Cognito User Pool page, you can also manage users if you need to. You can reset the password, disable/enable users, and enroll/delete users or other actions needed for User Management. Amazon Cognito Identity Pools Cognito Identity Pools (Federated Identities) provides different functionality compared to User Pools. Identity Pools are used for User Authorization. You can create unique identities for your users and federate them with your identity providers. Using identity pools, users can obtain temporary AWS credentials to access other AWS services. Identity Pools can be thought of as the actual mechanism authorizing access to AWS resources. When you create Identity Pools, think of it as defining who is allowed to get AWS credentials and use those credentials to access AWS resources. This diagram shows how authorization is handled with Cognito Identity Pools: <img decoding="async" class="alignnone wp-image-8484 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities.png" alt="Cognito Identity Pools (Federated Identities)" width="730" height="589" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities-177x142.png 177w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities-200x161.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities-300x242.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities-400x323.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities-600x484.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/05/Cognito-Identity-Pools-Federated-Identities.png 730w" sizes="(max-width: 730px) 100vw, 730px" /> The web app or mobile app sends its authentication token to Cognito Identity Pools. The token can come from a valid Identity Provider, like Cognito User Pools, Amazon, or Facebook. Cognito Identity Pool exchanges the user authentication token for temporary AWS credentials to access resources such as S3 or DynamoDB. AWS credentials are sent back to the user. The temporary AWS credentials will be used to access AWS resources. You can define rules in Cognito Identity Pools for mapping users to different IAM roles to provide fine-grain permissions. Here’s a table summary describing Cognito User Pool and Identity Pool: Cognito User Pools Cognito Identity Pools Handles the IdP interactions for you Provides AWS credentials for accessing resources on behalf of users Provides profiles to manage users Supports rules to map users to different IAM roles Provides OpenID Connect and OAuth standard tokens Free Priced per monthly active user Note: If you are studying for the AWS Certified Security Specialty exam, we highly recommend that you take our AWS Certified Security – Specialty Practice Exams and read our Security Specialty exam study guide. <img decoding="async" class="aligncenter wp-image-8176" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-300x168.jpg" alt="AWS Certified Security - Specialty Exam Study Path" width="600" height="337" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-400x224.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-600x337.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-768x431.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1-800x449.jpg 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2020/04/Security-rec1.jpg 1018w" sizes="(max-width: 600px) 100vw, 600px" /> Amazon Cognito User Pools vs Identity Pools References: https://aws.amazon.com/premiumsupport/knowledge-center/cognito-user-pools-identity-pools/ https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-identity-pools.html https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-identity.html https://docs.aws.amazon.com/cognito/latest/developerguide/authentication.html https://docs.aws.amazon.com/cognito/latest/developerguide/switching-identities.html This article is authored by: Kenneth Samonte, our resident AWS whiz/contributor. Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook.jpg" alt="tutorials dojo study guide eBook" width="400" height="224" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-200x112.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/09/TD-Ebook-300x168.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2021/