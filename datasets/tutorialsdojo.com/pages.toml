title = "Amazon EC2 Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = 'Last updated on November 19, 2024 Bookmarks Features Instance States Root Device Volumes AMI EC2 Image Builder Pricing Security Networking Monitoring Instance Metadata and User Data Placement Groups Rules Storage Amazon EC2 Related Cheatsheets Validate Your Knowledge Amazon EC2 Cheat Sheet A Linux-based/Windows-based/Mac-based virtual server that you can provision. You are limited to running On-Demand Instances per your vCPU-based On-Demand Instance limit, purchasing 20 Reserved Instances, and requesting Spot Instances per your dynamic Spot limit per region. Amazon EC2 Features The AWS Nitro System is the underlying platform of the next generation of EC2 instances. Traditionally, hypervisors protect the physical hardware and bios, virtualize the CPU, storage, networking, and provide a rich set of management capabilities. With the Nitro System, these functions are offloaded to dedicated hardware and software, thereby reducing the costs of your instances in the process. Hence, the Nitro Hypervisor delivers performance that is indistinguishable from bare metal and performs better than its predecessor: the Xen Hypervisor. Server environments are called instances. Package OS and additional installations in a reusable template called Amazon Machine Images. Various configurations of CPU, memory, storage, and networking capacity for your instances, known as instance types t-type and m-type for general purpose c-type for compute optimized r-type, x-type, and z-type for memory-optimized d-type, h-type, and i-type for storage optimized f-type, g-type, and p-type for accelerated computing Secure login information for your instances using key pairs Storage volumes for temporary data that are deleted when you STOP or TERMINATE your instance, known as instance store volumes. Take note that you can stop an EBS-backed instance but not an Instance Store-backed instance. You can only either start or terminate an Instance Store-backed instance. Persistent storage volumes for your data using Elastic Block Store volumes (see AWS storage services). Multiple physical locations for deploying your resources, such as instances and EBS volumes, known as regions and Availability Zones (see AWS overview). A firewall that enables you to specify the protocols, ports, and source IP ranges that can reach your instances using security groups (see aws networking and content delivery). Static IPv4 addresses for dynamic cloud computing, known as Elastic IP addresses (see aws networking and content delivery). Metadata, known as tags, that you can create and assign to your EC2 resources Virtual networks you can create that are logically isolated from the rest of the AWS cloud, and that you can optionally connect to your own network, known as virtual private clouds or VPCs (see aws networking and content delivery). Add a script that will be run on instance boot called user-data. Host Recovery for Amazon EC2 automatically restarts your instances on a new host in the event of an unexpected hardware failure on a Dedicated Host. EC2 Hibernation is available for On-Demand and Reserved Instances running on freshly launched M3, M4, M5, C3, C4, C5, R3, R4, and R5 instances running Amazon Linux and Ubuntu 18.04 LTS. You can enable hibernation for your EBS-backed instances at launch. You can then hibernate and resume your instances through the AWS Management Console, or through the AWS SDK and CLI using the existing stop-instances and start-instances commands. Hibernation requires an EC2 instance to be an encrypted EBS-backed instance. You can allow automatic connection of one or more EC2 instances to an RDS database. Instance states Start – run your instance normally. You are continuously billed while your instance is running. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Stop – is just a normal instance shut down. You may restart it again anytime. All EBS volumes remain attached, but data in instance store volumes are deleted. You won’t be charged for usage while instance is stopped. You can attach or detach EBS volumes. You can also create an AMI from the instance, and change the kernel, RAM disk, and instance type while in this state. Hibernate – When an instance is hibernated, it writes the in-memory state to a file in the root EBS volume and then shuts itself down. The AMI used to launch the instance must be encrypted, and also the root EBS volume of the instance. The encryption ensures proper protection for sensitive data when it is copied from memory to the EBS volume. While the instance is in hibernation, you pay only for the EBS volumes and Elastic IP Addresses attached to it; there are no hourly charges. Terminate – instance performs a normal shutdown and gets deleted. You won’t be able to restart an instance once you terminate it. The root device volume is deleted by default, but any attached EBS volumes are preserved by default. Data in instance store volumes are deleted. To prevent accidental termination, enable termination protection. By enabling instance stop protection, you can prevent an instance from being accidentally stopped. Root Device Volumes The root device volume contains the image used to boot the instance. You can replace the root volume of a running EC2 instance using the following: Initial launch state Snapshot AMI Instance Store-backed Instances Any data on the instance store volumes are deleted when the instance is terminated (instance store-backed instances do not support the Stop action) or if it fails (such as if an underlying drive has issues). You should also back up critical data from your instance store volumes to persistent storage on a regular basis. Amazon EBS-backed Instances An Amazon EBS-backed instance can be stopped and later restarted without affecting data stored in the attached volumes. When in a stopped state, you can modify the properties of the instance, change its size, or update the kernel it is using, or you can attach your root volume to a different running instance for debugging or any other purpose. By default, the root device volume for an AMI backed by Amazon EBS is deleted when the instance terminates. Previously, to launch an encrypted EBS-backed EC2 instance from an unencrypted AMI, you would first need to create an encrypted copy of the AMI and use that to launch the EC2 instance. Now, you can launch encrypted EBS-backed EC2 instances from unencrypted AMIs directly. Amazon EC2 – AMI Includes the following: A template for the root volume for the instance (OS, application server, and applications) Launch permissions that control which AWS accounts can use the AMI to launch instances A block device mapping that specifies the volumes to attach to the instance when it’s launched <img decoding="async" class="aligncenter wp-image-2579 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-EC2-2.jpg" alt="AWS Training Amazon EC2 2" width="580" height="247" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-EC2-2-200x85.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-EC2-2-300x128.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-EC2-2-400x170.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-EC2-2.jpg 580w" sizes="(max-width: 580px) 100vw, 580px" /> Backed by Amazon EBS – root device for an instance launched from the AMI is an Amazon EBS volume. AMIs backed by Amazon EBS snapshots can use EBS encryption. Backed by Instance Store – root device for an instance launched from the AMI is an instance store volume created from a template stored in S3. Characteristic Amazon EBS-backed AMI Amazon instance store-backed AMI Boot time for an instance Usually less than 1 minute. Usually less than 5 minutes. Size limit for a root device 64 TiB** 10 GiB Root device volume EBS volume Instance store volume Data persistence By default, the root volume is deleted when the instances terminates.* Data on any other EBS volumes persists after instance termination by default. Data on any instance store volumes persists only during the life of the instance. Modifications The instance type, kernel, RAM disk and user data can be changed while the instances is stopped. Instance attributes are fixed for the life of an instance. Charges You’re charged for instance usage, EBS volume usage, and storing your AMI as an EBS snapshot. You’re charged for instance usage and storing your AMI in Amazon S3. AMI creation/bundling Uses a single command/call. Requires installation and use of AMI tools. Stopped state Can be in a stopped state. Even when the instance is stopped and not running, the root volumes persisted in Amazon EBS. Cannot be in stopped state; instances are running or terminated. You can copy AMIs to different regions. Recycle Bin You can restore deleted AMIs using recycle bin. You can set lock retention rules to protect against modifications and deletions. Check the LastLaunchedTime timestamp to see when your AMI was last used to launch an instance. By default, a public AMI is deprecated after 2-years from the creation date. In the EC2 console, public AMIs owned by Amazon or a verified Amazon partner is marked as a verified provider. When an AMI changes state, an event is automatically generated, and you can use Amazon EventBridge to detect and respond to these events. With UEFI Secure Boot, you can ensure that an instance only boots software signed with cryptographic keys. You can configure an AMI to use Instance Metadata Service Version 2 (IMDSv2) when requesting instance metadata. If an AMI has been shared with your AWS account, you can remove your account from the AMI’s launch permissions. Amazon EC2 Image Builder A fully managed AWS service that automates the creation, management, and deployment of your Amazon Machine Images (AMIs) The AWS Management Console, AWS Command Line Interface, or AWS APIs can be used to create custom images in your AWS account. The customized images that Image Builder creates in your account are owned by you, and you can configure pipelines to automate updates as well as system patching for the images in your AWS account. Amazon EC2 Image Builder also provides a stand-alone command to create an AMI with the configuration resources that you have defined. Amazon EC2 Pricing On-Demand – pay for the instances that you use by the second, with no long-term commitments or upfront payments. Reserved – make a low, one-time, up-front payment for an instance, reserve it for a one– or three-year term, and pay a significantly lower hourly rate for these instances. It has two offering classes: Standard and Convertible. The Standard class provides the most significant discount but you can only modify some of its attributes during the term. It can also be sold in the Reserved Instance Marketplace. The Convertible class provides a lower discount than Standard Reserved Instances, but can be exchanged for another Convertible Reserved Instance with different instance attributes. However, this one cannot be sold in the Reserved Instance Marketplace. Standard RI Convertible RI Terms (average discount off On-Demand) 1 year (40%) 3 years (60%) 1 year (31%) 3 years (54%) Change Availability Zone, Instance size (for Linux OS), Networking type Yes Yes Change instance families, operating system, tenancy, and payment option Yes Benefit from Price Reductions Yes When purchasing a Reserved Instance, you’ll need to determine its scope (regional or zonal). Regional RI Zonal RI Ability to Reserve Capacity No Yes Availability Zone Flexibility The discount is valid for instance usage in any Availability Zone within the specified Region. The discount only applies to instance usage in the specified Availability Zone. Instance Size Flexibility The discount applies to instance usage within the instance family. The discount only applies to instance usage for the specified instance type and size. Queuing A Purchase Yes No Spot – request unused EC2 instances, which can lower your costs significantly. Spot Instances are available at up to a 90% discount compared to On-Demand prices. Spot Instances with a defined duration (also known as Spot blocks) are designed not to be interrupted and will run continuously for the duration you select. This makes them ideal for jobs that take a finite time to complete, such as batch processing, encoding and rendering, modeling and analysis, and continuous integration. A Spot Fleet is a collection of Spot Instances and optionally On-Demand Instances. The service attempts to launch the number of Spot Instances and On-Demand Instances to meet your specified target capacity. The request for Spot Instances is fulfilled if there is available capacity and the maximum price you specified in the request exceeds the current Spot price. The Spot Fleet also attempts to maintain its target capacity fleet if your Spot Instances are interrupted. A Spot Capacity pool is a set of unused EC2 instances with the same instance type, operating system, Availability Zone, and network platform. You can start and stop your Spot Instances backed by Amazon EBS at will. You can modify instance types and weights for a running EC2 Fleet or Spot Fleet without having to recreate it. Allocation strategy for Spot Instances LowestPrice – The Spot Instances come from the pool with the lowest price. This is the default strategy. Diversified – The Spot Instances are distributed across all pools. CapacityOptimized – The Spot Instances come from the pool with optimal capacity for the number of instances that are launching. InstancePoolsToUseCount – The Spot Instances are distributed across the number of Spot pools that you specify. This parameter is valid only when used in combination with the lowest Price. Spot Instances On-Demand Instances Launch time Can only be launched immediately if the Spot Request is active and capacity is available. Can only be launched immediately if you make a manual launch request and capacity is available. Available capacity If capacity is not available, the Spot Request continues to automatically make the launch request until capacity becomes available. If Capacity is not available when you make a launch request, you get an Insufficient Capacity Error (ICE). Hourly price The hourly price for Spot Instances varies based on demand. The hourly price for On-Demand instance is static Rebalance recommendation The signal that Amazon EC2 emits for a running Spot Instance when the instance is at an elevated risk of interruption. You determine when an On-Demand Instance is interrupted (stopped, hibernated, or terminated). Instance interruption You can stop and start an Amazon EBS-backed Spot Instance. In addition, the Amazon EC2 Spot servic'
