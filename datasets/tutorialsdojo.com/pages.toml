title = "AI-900 Microsoft Azure AI Fundamentals Sample Exam Questions - Tutorials Dojo"
description = "Tutorials Dojo offers the best AWS and other IT certification exam reviewers in different training modes to help you pass your certification exams on your first try!"
full_description = 'Last updated on June 24, 2024Here are 10 AI-900 Microsoft Azure AI Fundamentals practice exam questions to help you gauge your readiness for the actual exam. Question 1 Match the relevant Microsoft guiding principles for responsible AI with their appropriate descriptions. Instructions: To answer, drag the appropriate item from the column on the left to its description on the right. Each correct match is worth one point. <img data-dominant-color="292929" data-has-transparency="false" style="--dominant-color: #292929;" decoding="async" class="not-transparent aligncenter size-full wp-image-23201" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions.png" alt="" width="1362" height="541" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-200x79.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-300x119.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-400x159.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-600x238.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-768x305.png 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-800x318.png 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1024x407.png 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1200x477.png 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions.png 1362w" sizes="(max-width: 1362px) 100vw, 1362px" /> Show me the answer! Correct Answer: Accountability: Establishing procedures to enable human intervention and override the decisions made by AI systems. Transparency: Enables the team to comprehend the data, algorithms, transformations, and final model associated with the training process. Reliability and safety: Guaranteeing that AI systems adhere to their original design, effectively handle unexpected circumstances, and are resistant to malicious manipulation. Fairness: Ensure non-discrimination based on gender, race, sexual orientation, or religion, Microsoft offers an AI checklist. Microsoft emphasizes six key principles for responsible AI: accountability, inclusiveness, reliability and safety, fairness, transparency, and privacy and security. <img decoding="async" style="margin-left: auto; margin-right: auto; display: block;" src="https://media.tutorialsdojo.com/public/principles-responsible-ai.png" width="715" height="493" /> Accountability principle means putting in place procedures that allow humans to intervene and override the decisions made by AI systems. This ensures that there is a responsible entity overseeing the AI system and taking responsibility for its actions, addressing any biases or errors that may arise. Transparency emphasizes the importance of providing visibility into the data, algorithms, and transformations used in AI models. By doing so, stakeholders can gain a better understanding of how the AI system operates and can scrutinize its processes. Reliability and safety principle focuses on ensuring that AI systems consistently perform as intended, respond effectively to unforeseen situations, and are safeguarded against manipulation. This is essential for building trust in AI and preventing unintended harm or malicious exploitation. Fairness principle highlights the importance of avoiding discrimination and bias in AI systems to ensure equal treatment for all individuals. By providing guidelines and checklists, developers and organizations can assess and address potential biases, promoting fairness in AI decision-making processes. References: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/innovate/best-practices/trusted-ai https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2 Check out this Azure Responsible AI Cheat Sheet: https://tutorialsdojo.com/azure-responsible-ai/ Question 2 What guiding principle ensures that consumers have control over their data and safeguards their privacy and security in AI systems? Transparency Reliability and Safety Privacy and Security Accountability Show me the answer! Correct Answer: 3 The Privacy and Security concept is a guiding principle ensures that personal data is protected and accessed in a way that preserves an individual’s privacy. It also focuses on safeguarding AI systems against cybersecurity threats to ensure the integrity and confidentiality of data. Hence, the correct answer is: Privacy and Security. Transparency is incorrect because it does not directly address consumer control over data or privacy and security concerns. Transparency promotes understanding of data and algorithms used in AI models. Reliability and Safety is incorrect because it is centered around ensuring that AI systems perform as intended and respond to unexpected circumstances. While safety measures indirectly contribute to protecting data, they do not specifically address Accountability is incorrect because it pertains to establishing procedures for human intervention and decision overrides in AI systems. While accountability is important for responsible AI, it does not directly address consumer control over data or privacy and security concerns. References: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/innovate/best-practices/trusted-ai https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2#privacy-and-security Check out this Azure Responsible AI Cheat Sheet: https://tutorialsdojo.com/azure-responsible-ai/ Question 3 What principle in responsible AI emphasize regarding the ability of humans to intervene and override decisions made by AI systems when required? Reliability and safety Accountability <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Inclusiveness Transparency Show me the answer! Correct Answer: 2 Accountability is the guiding principle that focuses on establishing procedures that enable human intervention and decision override in AI systems. This principle ensures that there is a responsible entity or individuals who can take ownership and be held accountable for the actions and outcomes of AI systems. Hence, the correct answer is: Accountability. Reliability and safety is incorrect because it does not directly address the ability of humans to intervene and override AI decisions. Inclusiveness is incorrect because it pertains to considering all human races and experiences in AI development, but it does not directly relate to human intervention and decision override. Transparency is incorrect because it only provides visibility into the data, algorithms, and transformations used in AI models, but it does not specifically address the ability to intervene and override AI decisions. References: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/innovate/best-practices/trusted-ai https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2 Check out this Azure Responsible AI Cheat Sheet: https://tutorialsdojo.com/azure-responsible-ai/ Question 4 Which responsible AI principle aligns with the solution of using Snapshots within Azure Machine Learning workspaces to record or retrain training-related assets and metrics, thus promoting transparency? Reliability and safety Accountability Inclusiveness Transparency Show me the answer! Correct Answer: 4 Transparency is the guiding principle that provides visibility into the data, algorithms, and transformations used in AI models. By utilizing Snapshots within Azure Machine Learning workspaces, organizations can record and track the assets and metrics associated with the AI model’s training process. This allows for a transparent and reproducible approach, enabling stakeholders to understand how the model was created and providing insights into its development and performance. Hence, the correct answer is: Transparency. Reliability and safety is incorrect because it does not directly address the solution of using Snapshots for transparency in AI model development. Accountability is incorrect because it focuses on the responsibility and decision-making aspects but does not specifically address the use of Snapshots for transparency. Inclusiveness is incorrect because it pertains to considering all human races and experiences in AI development, but it is not directly related to using Snapshots for transparency. References: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/innovate/best-practices/trusted-ai https://learn.microsoft.com/en-us/azure/machine-learning/concept-workspace?view=azureml-api-2 Check out this Azure Responsible AI Cheat Sheet: https://tutorialsdojo.com/azure-responsible-ai/ Question 5 Match the types of AI workloads to the appropriate scenarios. To answer, drag the appropriate workload type from the column on the left to its scenario on the right. <img data-dominant-color="303030" data-has-transparency="false" style="--dominant-color: #303030;" decoding="async" class="not-transparent aligncenter size-full wp-image-23202" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1.png" alt="" width="1342" height="367" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-200x55.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-300x82.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-400x109.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-600x164.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-768x210.png 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-800x219.png 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-1024x280.png 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1-1200x328.png 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/08/AI900-sample-questions-1.png 1342w" sizes="(max-width: 1342px) 100vw, 1342px" /> Show me the answer! Correct Answer: Natural language processing (NLP): Translate English to Filipino Computer vision: Image search engines Regression: Property assessment valuation Classification: Property assessment valuation Azure Machine Learning offers AutoML capabilities in five domains: classification, regression, forecasting, computer vision, and natural language processing (NLP). With AutoML, users can automate the process of building high-quality machine learning models, leveraging breakthroughs from Microsoft Research and streamlining the ML development experience. <img decoding="async" style="display: block; margin-left: auto; margin-right: auto;" src="https://media.tutorialsdojo.com/azure_auto_ml_CLI.png" alt="" width="911" height="303" /> Natural language processing (NLP) – Translating English to Filipino is an example of NLP, as it involves analyzing and generating human language. The scenarios of review insights and automated responses also align with NLP’s aim to analyze and understand text or speech data. Computer vision – Image search engines leverage computer vision to extract meaningful information from images and videos. The mentioned scenarios of interpreting handwriting and pattern recognition fall within the domain of computer vision. Regression – Property assessment valuation involves analyzing relationships between variables (such as property characteristics) to predict a numerical outcome (property value). This aligns with the regression category. Classification – Email spam detection is a common scenario of classification where the AI model classifies emails into spam or legitimate categories based on their features. References: https://learn.microsoft.com/en-us/azure/machine-learning/concept-automated-ml?view=azureml-api-2 https://azure.microsoft.com/en-us/products/machine-learning/automatedml/#overview Check out this Automated Machine Learning (AutoML) in Azure Cheat Sheet: https://tutorialsdojo.com/automated-machine-learning-automl-in-azure/ Question 6 Which specific workload type within AutoML is typically employed in the development process of chatbots that possess the capability to automatically respond to inquiries pertaining to refunds and exchanges? Classification Regression Natural language processing (NLP) Computer vision Show me the answer! Correct Answer: 3 Natural Language Processing (NLP) specifically deals with text or speech data and aims to analyze, understand, and generate human language. It is the most suitable choice for developing chatbots that can automatically process and respond to questions. <img decoding="async" style="margin-left: auto; margin-right: auto; display: block;" src="https://media.tutorialsdojo.com/public/natural-language-processing-functionality.png" width="900" height="611" /> Hence, the correct answer is: Natural Language Processing (NLP). Classification is incorrect because it is not the suitable choice for the complex task of understanding and generating human language required for answering questions about refunds and exchanges. While it can be used for intent classification, it lacks the complexities needed for natural language understanding. Regression is incorrect because it is not directly applicable to processing and understanding natural language for chatbot responses. Its focus is on predicting numerical values based on independent variables, which does not align with the complexities of language processing. Computer vision is incorrect because it is not directly applicable to understanding and generating human language. It focuses on analyzing and interpreting visual data from images or videos, which is different from processing and responding to language-based queries. References: https://learn.microsoft.com/en-us/azure/machine-learning/concept-automated-ml?view=azureml-api-2 https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/natural-language-processing Check out this Automated Machine Learning (AutoML) in Azure Cheat Sheet: https://tutorialsdojo.com/automated-machine-learning-automl-in-azure/ Question 7 You are tasked with developing a predictive model for a multi-location retail business to generate accurate forecasts for future sales, taking into account the historical sales data from each store and the unique seasonal patterns '
