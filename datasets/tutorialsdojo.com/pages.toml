title = "Amazon Kinesis Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = 'Last updated on July 17, 2024 Bookmarks Kinesis Video Streams Kinesis Data Stream Data Firehose Kinesis Data Analytics Amazon Kinesis-related Cheat Sheets Validate Your Knowledge Amazon Kinesis Cheat Sheet Makes it easy to collect, process, and analyze real-time, streaming data. Kinesis can ingest real-time data such as video, audio, application logs, website clickstreams, and IoT telemetry data for machine learning, analytics, and other applications. Kinesis Video Streams A fully managed AWS service that you can use to stream live video from devices to the AWS Cloud, or build applications for real-time video processing or batch-oriented video analytics. How it works <img decoding="async" class="aligncenter size-full wp-image-3210" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2.jpg" alt="AWS Training Amazon Kinesis 2" width="791" height="419" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2-200x106.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2-300x159.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2-400x212.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2-600x318.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2-768x407.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-2.jpg 791w" sizes="(max-width: 791px) 100vw, 791px" /> Benefits You can connect and stream from millions of devices. You can configure your Kinesis video stream to durably store media data for custom retention periods. Kinesis Video Streams also generates an index over the stored data based on producer-generated or service-side timestamps. Kinesis Video Streams is serverless, so there is no infrastructure to set up or manage. You can build real-time and batch applications on data streams. Kinesis Video Streams enforces Transport Layer Security (TLS)-based encryption on data streaming from devices, and encrypts all data at rest using AWS KMS. Components Producer – Any source that puts data into a Kinesis video stream. Kinesis video stream – A resource that enables you to transport live video data, optionally store it, and make the data available for consumption both in real time and on a batch or ad hoc basis. Time-encoded data is any data in which the records are in a time series, and each record is related to its previous and next records. A fragment is a self-contained sequence of frames. The frames belonging to a fragment should have no dependency on any frames from other fragments. Upon receiving the data from a producer, Kinesis Video Streams stores incoming media data as chunks. Each chunk consists of the actual media fragment, a copy of media metadata sent by the producer, and the Kinesis Video Streams-specific metadata such as the fragment number, and server-side and producer-side timestamps. Consumer – Gets data, such as fragments and frames, from a Kinesis video stream to view, process, or analyze it. Generally, these consumers are called Kinesis Video Streams applications. Kinesis Video Streams provides APIs for you to create and manage streams and read or write media data to and from a stream. A console that supports live and video-on-demand playback. A set of producer libraries that you can use in your application code to extract data from your media sources and upload it to your Kinesis video stream. Video Playbacks You can view a Kinesis video stream using either HTTP Live Streaming (HLS) – You can use HLS for live playback. GetMedia API – You use the GetMedia API to build your own applications to process Kinesis video streams. GetMedia is a real-time API with low latency. Metadata Metadata is a mutable key-value pair. You can use it to describe the content of the fragment, embed associated sensor readings that need to be transferred along with the actual fragment, or meet other custom needs. There are two modes in which the metadata can be embedded with fragments in a stream: Nonpersistent: You can affix metadata on an ad hoc basis to fragments in a stream, based on business-specific criteria that have occurred. Persistent: You can affix metadata to successive, consecutive fragments in a stream based on a continuing need. Pricing You pay only for the volume of data you ingest, store, and consume through the service. Kinesis Data Stream A massively scalable, highly durable data ingestion and processing service optimized for streaming data. You can configure hundreds of thousands of data producers to continuously put data into a Kinesis data stream. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> How it works <img decoding="async" class="aligncenter size-full wp-image-3211" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3.jpg" alt="AWS Training Amazon Kinesis 3" width="793" height="383" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3-200x97.jpg 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3-300x145.jpg 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3-400x193.jpg 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3-600x290.jpg 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3-768x371.jpg 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/AWS-Training-Amazon-Kinesis-3.jpg 793w" sizes="(max-width: 793px) 100vw, 793px" /> Concepts Data Producer – An application that typically emits data records as they are generated to a Kinesis data stream. Data producers assign partition keys to records. Partition keys ultimately determine which shard ingests the data record for a data stream. Data Consumer – A distributed Kinesis application or AWS service retrieving data from all shards in a stream as it is generated. Most data consumers are retrieving the most recent data in a shard, enabling real-time analytics or handling of data. Data Stream – A logical grouping of shards. There are no bounds on the number of shards within a data stream. A data stream will retain data for 24 hours, or up to 7 days when extended retention is enabled. Shard – The base throughput unit of a Kinesis data stream. A shard is an append-only log and a unit of streaming capability. A shard contains an ordered sequence of records ordered by arrival time. Add or remove shards from your stream dynamically as your data throughput changes. One shard can ingest up to 1000 data records per second, or 1MB/sec. Add more shards to increase your ingestion capability. When consumers use enhanced fan-out, one shard provides 1MB/sec data input and 2MB/sec data output for each data consumer registered to use enhanced fan-out. When consumers do not use enhanced fan-out, a shard provides 1MB/sec of input and 2MB/sec of data output, and this output is shared with any consumer not using enhanced fan-out. You will specify the number of shards needed when you create a stream and can change the quantity at any time. Data Record A record is the unit of data stored in a Kinesis stream. A record is composed of a sequence number, partition key, and data blob. A data blob is the data of interest your data producer adds to a stream. The maximum size of a data blob is 1 MB. Partition Key A partition key is typically a meaningful identifier, such as a user ID or timestamp. It is specified by your data producer while putting data into a Kinesis data stream, and useful for consumers as they can use the partition key to replay or build a history associated with the partition key. The partition key is also used to segregate and route data records to different shards of a stream. Sequence Number A sequence number is a unique identifier for each data record. A sequence number is assigned by Kinesis Data Streams when a data producer calls PutRecord or PutRecords API to add data to a Kinesis data stream. Amazon Kinesis Agent is a pre-built Java application that offers an easy way to collect and send data to your Amazon Kinesis data stream. Monitoring You can monitor shard-level metrics in Kinesis Data Streams. You can monitor your data streams in Amazon Kinesis Data Streams using CloudWatch, Kinesis Agent, Kinesis libraries. Log API calls with CloudTrail. Security Kinesis Data Streams can automatically encrypt sensitive data as a producer enters it into a stream. Kinesis Data Streams uses AWS KMS master keys for encryption. Use IAM for managing access controls. You can use an interface VPC endpoint to keep traffic between your Amazon VPC and Kinesis Data Streams from leaving the Amazon network. Pricing You are charged for each shard at an hourly rate. PUT Payload Unit is charged with a per million PUT Payload Units rate. When consumers use enhanced fan-out, they incur hourly charges per consumer-shard hour and per GB of data retrieved. You are charged an additional rate on each shard hour incurred by your data stream once you enable extended data retention. Limits There is no upper limit on the number of shards you can have in a stream or account. There is no upper limit on the number of streams you can have in an account. A single shard can ingest up to 1 MiB of data per second (including partition keys) or 1,000 records per second for writes. The default shard limit is 500 shards for the following AWS Regions: US East (N. Virginia), US West (Oregon), and EU (Ireland). For all other Regions, the default shard limit is 200 shards. Each shard can support up to five read transactions per second. Data Firehose The easiest way to load streaming data into data stores and analytics tools. It is a fully managed service that automatically scales to match the throughput of your data. It can also batch, compress, and encrypt the data before loading it. How it works<img data-dominant-color="e4e5e7" data-has-transparency="false" style="--dominant-color: #e4e5e7;" decoding="async" class="not-transparent aligncenter wp-image-26922 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose.png" alt="Amazon Kinesis" width="1920" height="929" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-200x97.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-300x145.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-400x194.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-600x290.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-768x372.png 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-800x387.png 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-1024x495.png 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-1200x581.png 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose-1536x743.png 1536w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/td-amazon-data-firehose.png 1920w" sizes="(max-width: 1920px) 100vw, 1920px" /> Features It can capture, transform, and load streaming data into S3, Redshift, Elasticsearch Service, generic HTTP endpoints, and service providers like Datadog, New Relic, MongoDB, and Splunk, enabling near real-time analytics with existing business intelligence tools and dashboards being used today. You can specify a batch size or batch interval to control how quickly data is uploaded to destinations. Additionally, you can specify if data should be compressed. Once launched, your delivery streams automatically scale up and down to handle gigabytes per second or more of input data rate, and maintain data latency at levels you specify for the stream. Data Firehose can convert the format of incoming data from JSON to Parquet or ORC formats before storing the data in S3. You can configure Data Firehose to prepare your streaming data before it is loaded to data stores. Data Firehose provides pre-built Lambda blueprints for converting common data sources such as Apache logs and system logs to JSON and CSV formats. You can use these pre-built blueprints without any change, customize them further, or write your own custom functions. Concepts Firehose stream – The underlying entity of Amazon Data Firehose is a Firehose stream, which allows you to send data to it. Record – The data of interest that your data producer sends to a Firehose stream. A record can be as large as 1,000 KB. Data Producer – Producers send records to Firehose streams. Buffer Size and Buffer Interval – Data Firehose buffers incoming streaming data to a certain size or for a certain period of time before delivering it to destinations. Buffer Size is in MBs and Buffer Interval is in seconds. Stream Sources You can send data to your Firehose stream using different types of sources: Kinesis Data Streams Amazon MSK Kinesis Agent AWS SDK CloudWatch Logs CloudWatch Events AWS IoT Some AWS services can only send messages and events to a Firehose stream that is in the same Region. Data Delivery and Transformation Data Firehose can invoke your Lambda function to transform incoming source data and deliver the transformed data to destinations. Data Firehose buffers incoming data up to 3 MB by default. If your Lambda function invocation fails because of a network timeout or because you’ve reached the Lambda invocation limit, Data Firehose retries the invocation three times by default. Data Firehose can convert the format of your input data from JSON to Apache Parquet or Apache ORC before storing the data in S3. Parquet and ORC are columnar data formats that save space and enable faster queries compared to row-oriented formats like JSON. Data delivery format: For data delivery to S3, Data Firehose concatenates multiple incoming records based on the buffering configuration of your delivery stream. It then delivers the records to S3 as an S3 object. For data delivery to Redshift, Data Firehose first delivers incoming data to your S3 bucket in the format described earlier. Data Firehose then issues a Redshift COPY command to load the data from your S3 bucket to your Redshift cluster. For data delivery to ElasticSearch, Data Firehose buffers incoming r'
