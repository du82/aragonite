["https://tutorialsdojo.com/amazon-inspector"]
title = "Amazon Inspector Cheat Sheet"
description = "Jon Bonso is the co-founder of Tutorials Dojo, an EdTech startup and an AWS Digital Training Partner that provides high-quality educational materials in the cloud computing space. He graduated from Mapúa Institute of Technology in 2007 with a bachelor's degree in Information Technology. Jon holds 10 AWS Certifications and is also an active AWS Community Builder since 2020."
full_description = '''Last updated on November 14, 2024 Bookmarks Features Concepts Rules Packages and Rules Assessment Reports Pricing Amazon Inspector Cheat Sheet An automated security assessment service that helps you test the network accessibility of your EC2 instances and the security state of your applications running on the instances. Inspector uses IAM service-linked roles. <img width="2560" height="296" border="0" alt="Tutorials dojo strip" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-strip-ad-11Feb2025-scaled.webp"> Features Inspector provides an engine that analyzes system and resource configuration and monitors activity to determine what an assessment target looks like, how it behaves, and its dependent components. The combination of this telemetry provides a complete picture of the assessment target and its potential security or compliance issues. Inspector incorporates a built-in library of rules and reports. These include checks against best practices, common compliance standards and vulnerabilities. Automate security vulnerability assessments throughout your development and deployment pipeline or against static production systems. Inspector is an API-driven service that uses an optional agent, making it easy to deploy, manage, and automate. <img decoding="async" class="aligncenter wp-image-8749 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector.png" alt="Amazon Inspector" width="1888" height="1550" srcset="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-200x164.png 200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-300x246.png 300w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-400x328.png 400w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-600x493.png 600w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-768x631.png 768w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-800x657.png 800w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-1024x841.png 1024w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-1200x985.png 1200w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector-1536x1261.png 1536w, https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2018/12/Amazon-Inspector.png 1888w" sizes="(max-width: 1888px) 100vw, 1888px" /> Concepts Inspector Agent – A software agent that you can install on all EC2 instances that are included in the assessment target, the security of which you want to evaluate with Inspector. Assessment run – The process of discovering potential security issues through the analysis of your assessment target’s configuration and behavior against specified rules packages. Assessment target – A collection of AWS resources that work together as a unit to help you accomplish your business goals. Inspector assessment targets can consist only of EC2 instances. Assessment template – A configuration that is used during your assessment run, which includes Rules packages against which you want Inspector to evaluate your assessment target, The duration of the assessment run, Amazon SNS topics to which you want Inspector to send notifications about assessment run states and findings, Inspector-specific attributes (key-value pairs) that you can assign to findings generated by the assessment run that uses this assessment template. After you create an assessment template, you can’t modify it. Finding – A potential security issue discovered during the assessment run of the specified target. Rule – A security check performed during an assessment run. When a rule detects a potential security issue, Inspector generates a finding that describes the issue. Rules package – A collection of rules that corresponds to a security goal that you might have. Telemetry – EC2 instance data collected by Inspector during an assessment run and passed to the Inspector service for analysis. The telemetry data generated by the Inspector Agent during assessment runs is formatted in JSON files and delivered in near-real-time over TLS to Inspector, where it is encrypted with a per-assessment-run, ephemeral KMS-derived key and securely stored in an S3 bucket dedicated for the service. Rules Packages and Rules Inspector compares the behavior and the security configuration of the assessment targets to selected security rules packages. Rules are grouped together into distinct rules packages either by category, severity, or pricing. Each rule has an assigned severity level High, Medium, and Low levels all indicate a security issue that can result in compromised information confidentiality, integrity, and availability within your assessment target. The Informational level simply highlights a security configuration detail of your assessment target. The findings generated by rules in the Network Reachability package show whether your ports are reachable from the internet through an internet gateway, a VPC peering connection, or a VPN through a virtual gateway. These findings also highlight network configurations that allow for potentially malicious access, such as mismanaged security groups, ACLs, IGWs, and so on. Assessment Reports A document that details what is tested in the assessment run, and the results of the assessment. You can view the following types of assessment reports: Findings report – this report contains the following information: Executive summary of the assessment EC2 instances evaluated during the assessment run Rules packages included in the assessment run Detailed information about each finding, including all EC2 instances that had the finding Full report – this report contains all the information that is included in a findings report, and additionally provides the list of rules that passed on all instances in the assessment target. Amazon Inspector Pricing Pricing is based on two dimensions The number of EC2 instances included in each assessment The type(s) of rules package you select: host assessment rules packages and/or the network reachability rules package Note: If you are studying for the AWS Certified Security Specialty exam, we highly recommend that you take our AWS Certified Security – Specialty Practice Exams and read our Security Specialty exam study guide. <img decoding="async" class="aligncenter wp-image-8176" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/11/AWS-Certified-Security-Specialty-Practice-Exam-scaled.webp" alt="AWS Certified Security - Specialty Exam Study Path" width="600" height="337" /> Amazon Inspector Cheat Sheet References: https://docs.aws.amazon.com/inspector/latest/userguide https://aws.amazon.com/inspector/pricing/ https://aws.amazon.com/inspector/faqs/ Search for: 💝 Valentine’s Sale! Get 30% OFF Any Reviewer. Use coupon code: PASSION-4-CLOUD & 10% OFF Store Credits/Gift Cards <img decoding="async" class="aligncenter wp-image-9669 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2025/02/td-Valentines-Sale-sidebar-11Feb2025-jpg.webp" alt="Tutorials Dojo portal" width="400" height="224" /> Learn AWS with our PlayCloud Hands-On Labs <img decoding="async" class="aligncenter wp-image-13018 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2024/09/PlayCloud-Products-jpg.webp" alt="" width="400" height="224" /> FREE AWS Exam Readiness Digital Courses <img decoding="async" class="aligncenter wp-image-16244 size-full" src="https://td-mainsite-cdn.tutorialsdojo.com/wp-content/uploads/2023/05/aws-certification-TutorialsDojo-Free-Digital-Courses-jpg.webp" alt="" width="400" height="224" /> Tutorials Dojo Exam Study Guide eBooks <img decoding="async" class="aligncenter wp-image-16263 size-full" src="h