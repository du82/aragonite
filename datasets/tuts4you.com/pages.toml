title = "Tuts 4 You"
full_description = "Since its inception in 2003 Tuts 4 You has remained a non-commercial, independent community. Its primary role has been dedicated to the sharing of knowledge and information on reverse code engineering in many of the subject areas it spans, across the many different operating systems, platforms, hardware and devices that exist today.Tuts 4 You takes pride in knowing that it has been able to unite talented people from all corners of the reverse engineering community. Enabling them to develop and improve their skills, share ideas, promote and kickstart projects that have helped to shape the future of the reverse engineering community."
