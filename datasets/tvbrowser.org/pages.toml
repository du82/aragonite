["https://tvbrowser.org"]
title = "TV-Browser"
full_description = "An update for TV-Browser for Android is now available. This update only extends the runtime to 2029-12-31, nothing else was changed. Since TV-Browser for Android is still based on Android 9 newer versions of Android will warn that it misses security features. It still can be installed. The update is only available for the free version (blue icon) of TV-Browser since it currently doesn't comply with PlayStore rules. You can switch easily between the PlayStore variant and the free version by usage of the synchronisation function of TV-Browser. TV-Browser 4.2.5 contained bugs that caused existing Reminders not to be imported and filter highlightings not be loaded at the start of TV-Browser. Therefor TV-Browser 4.2.6 fixes those bugs. If you want to import your existing Reminders make sure to select the settings of TV-Browser 4.2.4 or earlier to import the settings from. If you don't use Reminders or filter highlightings you don't need to update from TV-Browser 4.2.5 to 4.2.6."
year_published = 2024
clearnet = "https://tvbrowser.org"
tags = ["4.2.6", "4.2.7", "android", "content management system", "easy", "final", "free", "getsimple", "supported", "tv-browser"]
language = "en"
internal-references = ["none"]
external-references = ["addons.mozilla.org", "adoptium.net", "android.tvbrowser.org", "cyberpress.biz", "en.wikipedia.org", "enwiki.tvbrowser.org", "free-css-templates.com", "get-simple.info", "hilfe.tvbrowser.org", "openusability.org", "sourceforge.net", "tvbrowser-app.de", "twitter.com", "yourkit.com"]

