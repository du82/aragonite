 check that these are installed somewhere globally on your system, but they can’t automatically install anything themselves. And for good reason: they are not package managers, merely build tools. What we are proposing here is to let Stack manage building the Haskell dependencies as it always has, but teach it how to build ad hoc environments where all the system dependencies are guaranteed to be present. Turns out the “teaching” part was easy: we got Stack to reuse Nix, an existing off-the-shelf toolchain for creating ad hoc build environments. So easy in fact that this feature has already shipped as part of Stack’s latest release. What this means in practice is: you can build an adequately configured Stack project replete with all manner of system dependencies and be pretty sure it’ll all just work, no matter whether you already have conflicting versions installed on your system. Yet we haven’t turned Stack into a package manager. Read on to find out why. Why Nix ? Nix is a multifaceted tool. A build system, a package manager, a lazy dynamically-typed functional language, you name it. In our case, what interests us is its capacity to express the dependencies and the build of a project declaratively, to automate the download of dependencies as any good package manager would and to provide a local environment (the nix-shell) in which commands (build operations in this situation) should be run, as any Linux container would. However, Nix isn’t a package manager in the usual sense. For one, Nix isn’t distro specific: it supports all Linux distros, OS X and in principle Windows too. Further, it’s purely functional, meaning that it never installs anything globally at a named location, since this would amount to having the side-effect of mutating the state of your global /usr directory. So really you can think of Nix as a lightweight containerization technology: given a declarative specification of what packages and configuration you want, it copies package content somewhere (doesn’t matter where) and then sets up your local shell so that these packages (and only these packages) are available inside it. Compared to other containerization technologies such as Docker, Nix does less. It’s a more lightweight solution that does not virtualize every namespace out there such as the process namespace, the network namespace, the user namespace, the mount namespace, etc. It just does the deed with a clever use of symlinks under the hood. So you’re getting weaker isolation guarantees with Nix than with Docker (which Stack already supports). On the flipside though: for simply building an open source project, you’re often not interested in iron-clad isolation - you just want the build to work, one way or another; Nix’'
