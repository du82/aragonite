rface with the machines, from the languages used to build software itself to specialized languages interacting with software for graphics, audio, configuration, hardware programming, data analysis, data processing, data querying, and so on. There are many languages, many compilers, and probably increasingly so. The mission of the Programming Languages and Compilers Group is to foster our programming languages design and implementation expertise encompassing multiple disciplines (mathematics, computer science, software engineering, UX design, etc.), in order to support clients who need to engage with any programming language-related task. We seek to have a wider impact on the future of programming languages, by actively participating in the research, the design and the implementation of programming languages and related tools which align with Tweag’s values. The Programming Languages and Compilers Technical Group can offer its expertise and its unique positioning in top-tier open source projects, which implies the capacity to upstream our developments: Provide support, consulting or team augmentation on projects using advanced functional languages (Haskell, Rust, Scala, OCaml, etc.) Develop new features in an existing language Fix bugs and shortcomings in an existing language Improve compiler toolchains Improve the compilation output (optimizations and performance) Design and implement custom domain-specific languages .css-oe606t{box-sizing:border-box;margin:0;min-width:0;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;max-width:40rem;-webkit-flex-basis:25rem;-ms-flex-preferred-size:25rem;flex-basis:25rem;-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;gap:2rem;}.css-1rl7n0k{box-sizing:border-box;margin:0;min-width:0;display:grid;grid-gap:12px;grid-template-columns:repeat(1, 1fr);}Members.css-q3he1s{box-sizing:border-box;margin:0;min-width:0;