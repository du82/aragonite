wyh .token.atrule,.css-p4mwyh .token.keyword,.css-p4mwyh .token.attr-value,.css-p4mwyh .language-autohotkey .token.selector,.css-p4mwyh .language-json .token.boolean,.css-p4mwyh .language-json .token.number,.css-p4mwyh code[class*="language-css"]{color:#0000ff;}.css-p4mwyh .token.function{color:#393a34;}.css-p4mwyh .token.deleted,.css-p4mwyh .language-autohotkey .token.tag{color:#9a050f;}.css-p4mwyh .token.selector,.css-p4mwyh .language-autohotkey .token.keyword{color:#00009f;}.css-p4mwyh .token.important{color:#e90;}.css-p4mwyh .token.important,.css-p4mwyh .token.bold{font-weight:bold;}.css-p4mwyh .token.italic{font-style:italic;}.css-p4mwyh .token.class-name,.css-p4mwyh .language-json .token.property{color:#2b91af;}.css-p4mwyh .token.tag,.css-p4mwyh .token.selector{color:#800000;}.css-p4mwyh .token.attr-name,.css-p4mwyh .token.property,.css-p4mwyh .token.regex,.css-p4mwyh .token.entity{color:#ff0000;}.css-p4mwyh .token.directive.tag .tag{background:#ffff00;color:#393a34;}Most good data stories start with a interesting question. If the average request latency went down by a further 100ms, by how much could we expect user engagement to increase? How can we detect evidence of corruption of government officials given a list of all bids nationwide for the building of new roads and repair of existing ones? Can we identify a new pandemic in the making given a timeline of common search terms? Often though, we know we have the data, but we don’t even know what questions the data might help answer, or how the story will unfold. From the data scientist who scratched an itch on an idle afternoon, to a low latency, high availability, real-time analysis deployed on hundreds of machines, the story typically involves lots of rewrites, meanderings and building out of a lot of code and utilities to improve the precision, speed or scale of the analysis. R provides a great interactive environment for poking at the dataset du jour and find what answers might be lurking in there. It provides a wealth of readily available libraries for banging out an initial story to tell. But R is a special purpose scripting language. Its strength in supporting throwaway “do what I mean” programming to test and iterate on hypotheses quickly becomes a hindrance when a model is to be built out into an industrial scale, performant and maintainable product or service. By then, a more general purpose language encouraging structured, modular programming, providing strong static guarantees of correctness and that compiles down to native code for maximum speed becomes more appropriate. Haskell is such a language. Mind you, Haskell makes for a great language to support rapid iteration, “in the small” exploratory programming too, but it as of yet lacks the plethora of high quality libraries from machine learning to visualization that R provides, and perhaps also some syntactic facilities to play it fast and loose. Today we’re proud to announce the first public release of the HaskellR project, which includes a library and two interactive environments for seamlessly programming in both R and Haskell in the same source file, or indeed at the same prompt. At the heart of the project lies inline-r (whose design later inspired inline-c - they share a coauthor), which exports a few quasiquoters for expressing calls to R functions and indeed arbitrary R code in R’s syntax. The principles behind the design of inline-r are, use R libraries the way R intends them to be used: using R’s syntax and calling conventions; keep the overhead of crossing language boundaries as low as possible to encourage fine grained interleaving of code in both languages; zero marshalling overhead in the common case; optional typing of R data as executable documentation of what functions expect and return; let the user stoop as low or jump as high as (s)he likes in the abstraction stack: everything is under the user’s control control in case (s)he needs it. We’ll touch upon each of the above points in more detail below and in future posts. But first, let’s get a taste of this stuff. You may want to consider the below setup as your go-to interactive shell if you haven’t already: it reuses existing projects and works much like GHCi, in an isolated sandbox if you like, except that you have inline graphics and formulas out-of-the-box, as Shae Erisson first pioneered in the Haskell world with ghclive and Manuel Chakravarty realized more recently on OS X with Haskell for Mac. Charts, code, prose and formulas in a playground HaskellR features two interactive prompts: a bare bones REPL, called H. This is a thin wrapper around GHCi initializing it with all the right extensions and imports to hit the road running; an all singing, all dancing interact'
