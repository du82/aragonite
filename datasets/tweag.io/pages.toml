37708;}.css-p4mwyh .token.atrule,.css-p4mwyh .token.keyword,.css-p4mwyh .token.attr-value,.css-p4mwyh .language-autohotkey .token.selector,.css-p4mwyh .language-json .token.boolean,.css-p4mwyh .language-json .token.number,.css-p4mwyh code[class*="language-css"]{color:#0000ff;}.css-p4mwyh .token.function{color:#393a34;}.css-p4mwyh .token.deleted,.css-p4mwyh .language-autohotkey .token.tag{color:#9a050f;}.css-p4mwyh .token.selector,.css-p4mwyh .language-autohotkey .token.keyword{color:#00009f;}.css-p4mwyh .token.important{color:#e90;}.css-p4mwyh .token.important,.css-p4mwyh .token.bold{font-weight:bold;}.css-p4mwyh .token.italic{font-style:italic;}.css-p4mwyh .token.class-name,.css-p4mwyh .language-json .token.property{color:#2b91af;}.css-p4mwyh .token.tag,.css-p4mwyh .token.selector{color:#800000;}.css-p4mwyh .token.attr-name,.css-p4mwyh .token.property,.css-p4mwyh .token.regex,.css-p4mwyh .token.entity{color:#ff0000;}.css-p4mwyh .token.directive.tag .tag{background:#ffff00;color:#393a34;}Cooked Validators is a Haskell library designed to simplify the complex process of crafting and testing transactions on the Cardano blockchain. Writing proper transactions in Cardano can be challenging due to its UTXO-based model, which requires precise definitions and careful structuring of inputs, outputs, and complementary components. cooked-validators tackles these challenges by offering a powerful framework for defining transactions in a minimal and declarative manner while incorporating a significant degree of automation. One of the library’s core strengths lies in its ability to help developers transform simple transaction templates, referred to as “skeletons”, or TxSkel, into fully-formed transactions that satisfy the technical requirements of Cardano’s validation process. This automation not only minimizes boilerplate code but also reduce the room for errors, thus streamlining the creation and testing of transactions. In particular, we’ve used cooked-validators extensively to rigorously audit smart contracts for many clients and well-known products now live on Cardano. Although cooked-validators has been a reliable tool for years, no blog post has yet explored how it automates key aspects of transaction creation, simplifying complex processes into manageable workflows. This post aims to fill that gap by showcasing how the library helps developers build Cardano transactions with ease and efficiency, allowing them to focus on high-level design and intent rather than getting bogged down by low-level technical details. Validating transactions in cooked-validators cooked-validators provides a convenient way to interact with the blockchain through a type class abstraction, MonadBlockChain. Among the primitives provided by this type class, the most fundamental is validateTxSkel which: takes a transaction skeleton as input, expands the skeleton’s content based on missing parts and skeleton options, generates a transaction, submits this transaction for validation, and returns the validated transaction, or throws an error if it is invalid. Thus, the function has the following type signature: validateTxSkel :: (MonadBlockChain m) => TxSkel -> m CardanoTx In the remainder of this post, we will explore the fields of the transaction skeleton (TxSkel) and how validateTxSkel behaves when automatically expanding this skeleton. Transaction skeletons Cardano transactions are usually represented by large Haskell records containing a predefined set of fields that evolve alongside the Cardano protocol. The traditional approach to building transactions involves directly creating instances of these records and submitting them for validation. In cooked-validators, however, transactions are further abstracted through a custom record called TxSkel, which has its own set of fields, some of which map directly to corresponding fields in a Cardano transaction, while others guide the translation process. The primary motivation behind using this abstraction is to highlight the most relevant information for common use cases while hiding less critical details that can be inferred automatically based on the provided data1. There are several additional reasons for the use of TxSkel: Our transaction skeletons embed as much type information as possible for scripts and UTXOs, thus increasing type-safety. Each transaction skeleton includes its own set of options to guide transaction generation, with sensible default values. Our transaction skeletons have default values for all fields, allowing users to provide minimal information relevant to their use-case. Our skeleton elements use meaningful, yet simple types, avoiding the need for the complex overlays and type annotations commonly found in Cardano or Ledg'
