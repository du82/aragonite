.token.inserted{color:#037708;}.css-p4mwyh .token.atrule,.css-p4mwyh .token.keyword,.css-p4mwyh .token.attr-value,.css-p4mwyh .language-autohotkey .token.selector,.css-p4mwyh .language-json .token.boolean,.css-p4mwyh .language-json .token.number,.css-p4mwyh code[class*="language-css"]{color:#0000ff;}.css-p4mwyh .token.function{color:#393a34;}.css-p4mwyh .token.deleted,.css-p4mwyh .language-autohotkey .token.tag{color:#9a050f;}.css-p4mwyh .token.selector,.css-p4mwyh .language-autohotkey .token.keyword{color:#00009f;}.css-p4mwyh .token.important{color:#e90;}.css-p4mwyh .token.important,.css-p4mwyh .token.bold{font-weight:bold;}.css-p4mwyh .token.italic{font-style:italic;}.css-p4mwyh .token.class-name,.css-p4mwyh .language-json .token.property{color:#2b91af;}.css-p4mwyh .token.tag,.css-p4mwyh .token.selector{color:#800000;}.css-p4mwyh .token.attr-name,.css-p4mwyh .token.property,.css-p4mwyh .token.regex,.css-p4mwyh .token.entity{color:#ff0000;}.css-p4mwyh .token.directive.tag .tag{background:#ffff00;color:#393a34;}Retrieval-augmented generation (RAG) is about providing large language models with extra context to help them produce more informative responses. Like any machine learning application, your RAG app needs to be monitored and evaluated to ensure that it continues to respond accurately to user queries. Fortunately, the RAG ecosystem has developed to the point where you can evaluate your system in just a handful of lines of code. The outputs of these evaluations are easily interpretable: numbers between 0 and 1, where higher numbers are better. Just copy our sample code below, paste it into your continuous monitoring system, and you’ll be looking at nice dashboards in no time. So that’s it, right? Well, not quite. There are several common pitfalls in RAG evaluation. From this blog post, you will learn what the metrics mean and how to check that they’re working correctly on your data with our field-gained knowledge. As they say, “forewarned is forearmed”! Background If you’re new to RAG evaluation, our previous posts about it give an introduction to evaluation and discuss benchmark suites. For now, you just need to know that a benchmark suite consists of a collection of questions or prompts, and for each question establishes: a “ground truth” context, consisting of documents from our database that are relevant for answering the question; and a “ground truth” answer to the question. For example Query Ground truth context Ground truth answer What is the capital of France? Paris, the capital of France, is known for its delicious croissants. Paris Where are the best croissants? Lune Croissanterie, in Melbourne, Australia, has been touted as ‘the best croissant in the world.’ Melbourne Then the RAG system provides (for each question): a “retrieved” context — the documents that our RAG system thought were relevant — and a generated answer. The inputs to a RAG evaluator Example Here’s an example that uses the Ragas library to evaluate the “faithfulness” (how well the response was supported by the context) of a single RAG output, using an LLM from AWS Bedrock: from langchain_aws import ChatBedrockConverse from ragas import EvaluationDataset, evaluate from ragas.llms import LangchainLLMWrapper from ragas.metrics import Faithfulness # In real life, this probably gets loaded from an internal file (and hopefully # has more than one element!) eval_dataset = EvaluationDataset.from_list([{ "user_input": "What is the capital of France?", "retrieved_contexts": ["Berlin is the capital of Germany."], "response": "I don't know.", }]) # The LLM to use for computing metrics (more on this below). model = "anthropic.claude-3-haiku-20240307-v1:0" evaluator = LangchainLLMWrapper(ChatBedrockConverse(model=model)) print(evaluate(dataset=eval_dataset, metrics=[Faithfulness(llm=evaluator)])) If you paid close attention in the previous section, you’ll have noticed that our evaluation dataset doesn’t include all of the components we talked about. That’s because the “faithfulness” metric only requires the retrieved context and the generated answer. RAG evaluation metrics There are a variety of RAG evaluation metrics available; to keep them straight, we like to use the RAG Triad, a helpful system of categorizing some RAG metrics. A RAG system has one input (the query) and two outputs (the context and the response), and the RAG Triad lets us visualize the three interactions that need to be evaluated. The RAG triad Evaluating retrieval Feeding an LLM with accurate and relevant context can help it respond well; that’s the whole idea of RAG. Your system needs to find that relevant context, and your evaluation system needs to figure out how well the retrieval is working. This is the top-right side '''
