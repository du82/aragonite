037708;}.css-p4mwyh .token.atrule,.css-p4mwyh .token.keyword,.css-p4mwyh .token.attr-value,.css-p4mwyh .language-autohotkey .token.selector,.css-p4mwyh .language-json .token.boolean,.css-p4mwyh .language-json .token.number,.css-p4mwyh code[class*="language-css"]{color:#0000ff;}.css-p4mwyh .token.function{color:#393a34;}.css-p4mwyh .token.deleted,.css-p4mwyh .language-autohotkey .token.tag{color:#9a050f;}.css-p4mwyh .token.selector,.css-p4mwyh .language-autohotkey .token.keyword{color:#00009f;}.css-p4mwyh .token.important{color:#e90;}.css-p4mwyh .token.important,.css-p4mwyh .token.bold{font-weight:bold;}.css-p4mwyh .token.italic{font-style:italic;}.css-p4mwyh .token.class-name,.css-p4mwyh .language-json .token.property{color:#2b91af;}.css-p4mwyh .token.tag,.css-p4mwyh .token.selector{color:#800000;}.css-p4mwyh .token.attr-name,.css-p4mwyh .token.property,.css-p4mwyh .token.regex,.css-p4mwyh .token.entity{color:#ff0000;}.css-p4mwyh .token.directive.tag .tag{background:#ffff00;color:#393a34;}Large scale distributed applications are complex: there are effects at scale that matter far more than when your application is basked in the warmth of a single machine. Messages between any two processes may or may not make it to their final destination. If reading from a memory bank yields corrupted bytes about once a year, with 10,000 nodes this is likely to happen within the hour. In a million components system some hardware somewhere will be in a failed state, continuously. And it takes cunning to maximize throughput when network latencies are vastly superior to processing units’ crunch power. The key idea behind distributed computing middlewares such as Hadoop is to capture common application patterns, and solve coping with these effects once and for all for each such pattern, so that applications writers don’t have to do so themselves from scratch every time. Today we’re introducing a tech preview of sparkle. The motto: implement a robust and scalable distributed computing middleware for Haskell, by reusing Apache Spark (itself built on top of parts of Hadoop). Why Spark? We could as well have built a complete platform starting from the likes of Cloud Haskell, which we maintain. And distributed computing engines is increasingly becoming a crowded space. But we started by asking a simple question: if I’m a data scientist seeking to train a model with state-of-the-art machine learning techniques, what is my best option to get the job done? How can I do that without giving up Haskell’s strong static guarantees and concise syntax? Spark is a popular piece of the puzzle that leverages the huge Hadoop ecosystem for storage and cluster resource management to make it easy to write robust and scalable distributed applications as the composition of basic but familiar combinators to us FP aficionados: (distributed!) map, filter, zip, reduce, concat and many of their friends. These patterns generalize the surprisingly effective MapReduce framework of old. And on top of those, Sparks builds an impressively large set of general machine learning techniques as a library (we’ll see an example of using these in this post). Today, Spark is already available to write scalable Scala, Java, R or Python applications. Haskell is a great language for writing clearly the kind of intricately complex algorithms common in analytics, so we’re throwing Haskell into the mix. With Haskell, you get the benefit of a language and ecosystem ruthlessly focused on refactorability, backed by a state of the art optimizing native code compiler supporting SIMD intrinsics when you need them. sparkle basics So what is it like in practice? sparkle’s “Hello World” on a hosted Amazon EMR cluster: # Build it $ stack build hello # Package it $ mvn package -f sparkle -Dsparkle.app=sparkle-example-hello # Run it $ spark-submit --master 'spark://IP:PORT' sparkle/target/sparkle-0.1.jar The code looks something like this: {-# LANGUAGE OverloadedStrings #-} {-# LANGUAGE StaticPointers #-} import Control.Distributed.Spark as RDD import Data.Text (isInfixOf) main :: IO () main = do conf <- newSparkConf "Hello sparkle!" sc <- newSparkContext conf rdd <- textFile sc "s3://some-bucket/some-file.txt" as <- RDD.filter (static (\line -> "a" `isInfixOf` line)) rdd numAs <- RDD.count as putStrLn $ show numAs ++ " lines with the letter 'a'." Nothing too fancy here: assuming we have a file somewhere (on S3 in this case), we’d like to count the number of lines that contain at least one “a”. If the file is very large, Spark, the underlying middleware that we’re using to write this app, could choose to do this piecewise on multiple nodes in parallel. Spark will break down this high-level description into a number of low-level tasks, then sc'''
