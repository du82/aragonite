full_description = '''.css-lgbo0i{box-sizing:border-box;margin:0;min-width:0;}.css-afnuv7{box-sizing:border-box;margin:0;min-width:0;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:min(calc(100% - 2rem), 100rem);margin-top:3rem;margin-bottom:4rem;margin-left:auto;margin-right:auto;-webkit-align-items:stretch;-webkit-box-align:stretch;-ms-flex-align:stretch;align-items:stretch;-webkit-box-flex-wrap:wrap;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;}.css-1oi77he{box-sizing:border-box;margin:0;min-width:0;width:60em;padding-top:2rem;padding-bottom:2rem;padding-left:2rem;padding-right:2rem;-webkit-box-flex:0;-webkit-flex-grow:0;-ms-flex-positive:0;flex-grow:0;-webkit-flex-shrink:1;-ms-flex-negative:1;flex-shrink:1;}@media screen and (min-width: 768px){.css-1oi77he{padding-top:4rem;padding-bottom:4rem;padding-left:7rem;padding-right:4rem;}}.css-1gtj42u{box-sizing:border-box;margin:0;min-width:0;margin-bottom:2em;}.css-pnt65o{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;font-weight:700;line-height:heading;font-size:2.5em;font-weight:700;text-transform:uppercase;}@media screen and (min-width: 768px){.css-pnt65o{font-size:3.5em;}}Tweag's Academic Research.css-6oja4k{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;font-size:1.2em;}@media screen and (min-width: 768px){.css-6oja4k{font-size:1.6em;}}.css-1yvu3y9{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;font-weight:400;line-height:body;margin-top:1em;margin-bottom:1em;}Engaging in scholarly research supports Tweag's mission to improve the art of compositional software engineering. We at Tweag learn from the best — and contribute our own new discoveries — by publishing and participating in top-tier venues for computer science research. Sharing knowledge is the way we build a world where software everywhere is more correct, more maintainable, and more performant.We employ researchers with strong academic backgrounds and ask them to keep pushing the envelope. Their sole focus is to identify future directions for automation and programming languages. Tweagers are working on safety through linear types and dependent types, best practices, application performance and other innovations to improve developer and scientist experience.TOTAL PAPERS: 20.css-1yugef9{box-sizing:border-box;margin:0;min-width:0;-webkit-animation:1s animation-1pq24qy;animation:1s animation-1pq24qy;background-image:url(data:image/svg+xml;base64,);-webkit-background-size:contain;background-size:contain;background-repeat:no-repeat;-webkit-background-position:right;background-position:right;min-width:5rem;-webkit-box-flex:1;-webkit-flex-grow:1;-ms-flex-positive:1;flex-grow:1;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;}@-webkit-keyframes animation-1pq24qy{from{opacity:0;-webkit-transform:translateX(10rem);-moz-transform:translateX(10rem);-ms-transform:translateX(10rem);transform:translateX(10rem);}to{opacity:1;-webkit-transform:translateX(0);-moz-transform:translateX(0);-ms-transform:translateX(0);transform:translateX(0);}}@keyframes animation-1pq24qy{from{opacity:0;-webkit-transform:translateX(10rem);-moz-transform:translateX(10rem);-ms-transform:translateX(10rem);transform:translateX(10rem);}to{opacity:1;-webkit-transform:translateX(0);-moz-transform:translateX(0);-ms-transform:translateX(0);transform:translateX(0);}}.css-q2m8bu{box-sizing:border-box;margin:0;min-width:0;padding-left:2rem;padding-right:2rem;padding-top:2rem;padding-bottom:2rem;background-color:white;}@media screen and (min-width: 768px){.css-q2m8bu{padding-left:4rem;padding-right:4rem;}}.css-7fp6wy{font-weight:300;}.css-1v0iqoa{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;font-weight:300;}haskell.css-1p36n4d{font-weight:100;}.css-1p24tj5{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;font-weight:100;}17language interop1ocaml1effects1type systems11machine learning2performance1types in practice3nickel1wasm1.css-340kh{display:grid;gap:1rem;grid-template:"year" "articles"/1fr;}@media screen and (min-width: 1024px){.css-340kh{grid-template:"year articles"/1fr 6fr;}}.css-1dacfit{grid-area:year;font-size:4rem;font-weight:1000;}.css-iaefi8{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;}2024.css-tsihor{grid-area:articles;}.css-7vmnn5{margin-bottom:0.8rem;}.css-1p9vqvs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:0.8rem;}Destination-passing style programming: a Haskell implementation.css-j4s8jq{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;margin-bottom:0.8rem;}JFLA 2024.css-1uf4eft{color:#4D22A8;}Thomas Bagrel.css-1c1ooq1{margin-top:2rem;}.css-ow45at{box-sizing:border-box;margin:0;min-width:0;font-family:stratos,Arial,Helvetica,sans-serif;margin-top:2rem;}Destination-passing style programming introduces destinations, which represent the address of a write-once memory cell. Those destinations can be passed as function parameters, and thus enable the caller of a function to keep control over memory management: the body of the called function will just be responsible of filling that memory cell. This is especially useful in functional programming languages, in which the body of a function is typically responsible for allocation of the result value. Programming with destination in Haskell is an interesting way to improve performance of critical parts of some programs, without sacrificing memory guarantees. Indeed, thanks to a linearly-typed API I present, a write-once memory cell cannot be left uninitialized before being read, and is still disposed of by the garbage collector when it is not in use anymore, eliminating the risk of uninitialized read, memory leak, or double-free errors that can arise when memory is managed manually. In this article, I present an implementation of destinations for Haskell, which relies on so-called compact regions. I demonstrate, in particular, a simple parser example for which the destination-based version uses 35% less memory and time than its naive counterpart for large inputs. Arxiv2023Crème de la Crem: Composable Representable Executable MachinesFUNARCH 2023Marco Perone, Georgios KarachaliasIn this paper we describe how to build software architectures as a composition of state machines, using ideas and principles from the field of Domain-Driven Design. By definition, our approach is modular, allowing one to compose independent subcomponents to create bigger systems, and representable, allowing the implementation of a system to be kept in sync with its graphical representation. In addition to the design itself we introduce the Crem library, which provides a concrete state machine implementation that is both compositional and representable, Crem uses Haskell's advanced type-level features to allow users to specify allowed and forbidden state transitions, and to encode complex state machine -- and therefore domain-specific -- properties. Moreover, since Crem's state machines are representable, Crem can automatically generate graphical representations of systems from their domain implementations. LinkArxivNo Unification Variable Left Behind: Fully Grounding Type Inference for the HDM SystemITP 2023Roger Bosman, Georgios Karachalias, Tom SchrijversThe Hindley-Damas-Milner (HDM) system provides polymorphism, a key feature of functional programming languages such as Haskell and OCaml. It does so through a type inference algorithm, whose soundness and completeness have been well-studied and proven both manually (on paper) and mechanically (in a proof assistant). Earlier research has focused on the problem of inferring the type of a top-level expression. Yet, in practice, we also may wish to infer the type of subexpressions, either for the sake of elaboration into an explicitly-typed target language, or for reporting those types back to the programmer. One key difference between these two problems is the treatment of underconstrained types: in the former, unification variables that do not affect the overall type need not be instantiated. However, in the latter, instantiating all unification variables is essential, because unification variables are internal to the algorithm and should not leak into the output. We present an algorithm for the HDM system that explicitly tracks the scope of all unification variables. In addition to solving the subexpression type reconstruction problem described above, it can be used as a basis for elaboration algorithms, including those that implement elaboration-based features such as type classes. The algorithm implements input and output contexts, as well as the novel concept of full contexts, which significantly simplifies the state-passing of traditional algorithms. The algorithm has been formalised and proven sound and complete using the Coq proof assistant. Link2022Linearly Qualified Types: Generic inference for capabilities and uniquenessICFP 2022Arnaud Spiwack, Csongor Kiss, Jean-Philippe Bernardy, Nicolas Wu, Richard A. EisenbergA linear parameter must be consumed exactly once in the body of its function. When declaring resources such as file handles and manually managed memory as linear arguments, a linear type system can verify that these resources are used safely. However, writing code with explicit linear arguments requires bureaucracy. This paper presents linear constraints, a front-end feature for linear typing that decreases the bureaucracy of working with linear types. Linear constraints are implicit linear arguments that are filled in automatically by the compiler. We present linear constraints as a qualified type system,together with an inference algorithm which extends GHC's existing constraint solver algorithm. Soundness of linear constraints is ensured by the fact that they desugar into Linear Haskell. LinkArxivBeyond Relooper: Recursive Translation of Unstructured Control Flow to Structured Control FlowICFP 2022Norman RamseyIn many compilers, control flow is represented using an arbitrary directed graph. But in some interesting target languages, including JavaScript and WebAssembly, intraprocedural control flow can be expressed only in structured ways, using loops, conditionals, and multilevel breaks or exits. As has long been known, arbitrary control flow can be translated into structured control flow [Peterson, Kasami, and Tokura 1973]. The translation uses two standard analyses, but as published, it takes three passes—which may explain why it was overlooked by Emscripten, a compiler that is widely used to translate C to JavaScript [Zakai 2011]. By tweaking the analyses and by applying fundamental ideas from functional programming (recursive functions and immutable abstract-syntax trees), the translation can be implemented in a single pass—along with a couple of code improvements. This new implementation is slated to be added to the Glasgow Haskell Compiler. Its single-pass translation, its immutable representation, and its use of dominator trees make it much easier to reason about than the original translation. LinkProvably Correct, Asymptotically Efficient, Higher-Order Reverse-Mode Automatic Differentiationconditionally accepted at POPL 2022Faustyna Krawiec, Neel Krishnaswami, Simon Peyton-Jones, Tom Ellis, Andrew Fitzgibbon, Richard A. EisenbergIn this paper, we give a simple and efficient implementation of reverse-mode automatic differentiation, which both extends easily to higher-order functions, and has run time and memory consumption linear in the run time of the original program. In addition to a formal description of the translation, we also describe an implementation of this algorithm, and prove its correctness by means of a logical relations argument. 2021Efficient Compilation of Algebraic Effect HandlersOOPSLA 2021Georgios Karachalias, Filip Koprivec, Matija Pretnar, Tom SchrijversThe popularity of algebraic effect handlers as a programming language feature for user-defined computational effects is steadily growing. Yet, even though efficient runtime representations have already been studied, most handler-based programs are still much slower than hand-written code. This paper shows that the performance gap can be drastically narrowed (in some cases even closed) by means of type-and-effect directed optimising compilation. Our approach consists of source-to-source transformations in two phases of the compilation pipeline. Firstly, elementary rewrites, aided by judicious function specialisation, exploit the explicit type and effect information of the compiler's core language to aggressively reduce handler applications. Secondly, after erasing the effect information further rewrites in the backend of the compiler emit tight code. This work comes with a practical implementation: an optimising compiler from Eff, an ML style language with algebraic effect handlers, to OCaml. Experimental evaluation with this implementation demonstrates that in a number of benchmarks, our approach eliminates much of the overhead of handlers, outperforms capability-passing style compilation and yields competitive performance compared to hand-written OCaml code as well Multicore OCaml's dedicated runtime support. LinkZenodoUnion and intersection contracts are hard, actuallyDynamic Language Symposium 2021Teodoro Freund, Yann Hamdaoui, Arnaud SpiwackUnion and intersection types are a staple of gradually typed language such as TypeScript. While it's long been recognized that union and intersection types are difficult to verify statically, it may appear at first that the dynamic part of gradual typing is actually pretty simple. It turns '''
