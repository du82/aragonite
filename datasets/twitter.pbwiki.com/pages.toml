["https://twitter.pbwiki.com/Ideas"]
title = "Twitter Fan Wiki / Ideas"
full_description = '''Bah, didn't see the comments before. I have a copy of the original if anyone has a problem with the changes made. I had originally intended to add something, but in the process of reorganising completely forgot what it was :D Twitter needs to have a App that allows you to browse other members to find new friends. I see Twitter has a place where u can search for other members. But you have to know the members First Name, Last Name, or Screename. It would be great to have an app which would allow you to search for Twitter friends with things like: location, genre, disability...ect. A game in which one user is granted by twitter access to a music library like napster or itunes. This user would become like a music dj. Now the followers of this user must guess the song bieng played. The music bieng played would be intentionally obscure but as one obsure song is chosen by the dj his playlist would be narrowed down until eventually a popular song must be chosen. This will also keep one user from having the dj position to long. Now the prize would be that will the dj holds his or her position he can download as many songs as possible... Check out GM commerical "Technically that is correct." Hilarious. Bloopers@end so keep watching............http://www.youtube.com/watch?v=iUO2lVSbJUc I opened a Twitter at storymachine that might be a new use for Twitter -- creating an on-going action-adventure story with the microplot points suggested by Twitter responses. I think it would be fun to generate a long-running story with unexpected plot twists suggested by followers! Who knows what will become of the "unknownman". PBworks / Help Terms of use / Privacy policy / GDPR About this workspace Contact the owner / RSS feed / This workspace is public Welcome to the Twitter Fan Wiki We've set this up as a place to post cool ideas, uses and feature requests for Twitter. Share anything you've found that you think the Twitter community might be interested in! Newbies Co