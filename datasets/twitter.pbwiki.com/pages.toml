full_description = "Momail (www.momail.com) recently launched Twitter support to its mobile mail product. More information may be found here: http://bit.ly/198PLk what's the purpose of getting a twitter app? isn't it supposed to be so you can use it from your phone? i'm new at this so forgive any silly questions. i was thinking there were downloads for the cellphone to make twitter more effective? i don't see that. is there something like that? i don't have a pda or smartphone, i have an lg enV (verizon). heeelp! tuitwit is a mobile web apps for twitter, more info: - intregate with gmap and detect friends location automaticly - intregate with tinypic, tweetphoto and yfrog to show their thumbnails picture - customizable for volumed based connection users, help the low-end / mid-end users to saving their twitter-ing cost - build in python and run in google app engine TuiTwit | http://m.tuitwit.com Socially is an interesting Nokia S60 application. With it, you can see your friends' facebook/LinkedIn/Twitter updates when they call you on your mobile phone. More info on http://www.socially.in http://www.kelebekcafe.net http://www.kelebekcafe.org http://www.mirclider.com http://www.mirclider.net http://www.mirclider.org http://www.doruknet.org http://www.dorukchat.net http://www.dorukchat.org http://www.netzurna.com http://www.onursan.org http://www.gevezechat.org http://www.izmirchat.org http://www.cinselchat.org http://www.hanimeligelinlik.com http://www.hanimeligelinlik.net http://www.hanimeligelinlik.org http://www.oyunlider.com http://sikisyeri.blogspot.com/ http://fikra34.blogspot.com/ http://gunluk-filim.blogspot.com/ http://cinsel-muhabbet.blogspot.com http://escinselsohbet.blogspot.com http://cinselsohbetiniz.blogspot.com http://gaysohbetiniz.blogspot.com http://lezsohbetiniz.blogspot.com http://ist-lgbtt.blogspot.com/ http://travesti34.blogspot.com/ http://gay34.blogspot.com/ http://gay-lez.blogspot.com/ http://gay-europa.blogspot.com/ http://drkcht.blogspot.com