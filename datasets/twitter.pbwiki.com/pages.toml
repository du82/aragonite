["https://twitter.pbwiki.com/Universities"]
title = "Twitter Fan Wiki / Universities"
full_description = '''Just wanted to let you know that Washington University in St. Louis also has a twitter: http://twitter.com/WUSTL One can also follow @higheredu via http://twitter.com/higheredu which is an account which only follows colleges, universities, alumni groups, and higher education related accounts. A twitter search for #highered [http://search.twitter.com/search?q=%23highered] is the most common hashtag for discussions on the category. Many in the category are holding discussions on Buzzable via http://buzzable.com/highered#. Please add Marywood University to this list :-) @MarywoodAlum you can also contact us at alumni@marywood.edu The University of Texas Health Science Center at Houston can be found at http://twitter.com/UTHouston Aloha! Please add the University of Hawai'i at Manoa | William S. Richardson School of Law to your list, http://twitter.com/UHLawSchool Mahalo! Hello, could you please add Mount St. Mary's University to your list - Thanks! http://twitter.com/MountStMarysU Hello. Please add the University of South Carolina to your list of colleges and universities. http://twitter.com/UofSCnews Hello! Please add Concordia University Chicago to your College/University Twitter directory. http://twitter.com/CUChicago Please add: Bucks County Community College: general interest http://twitter.com/bucks_edu Career Services: /BucksCareer Foundation/Alumni Association: /BCCCFriends I created an account but couldn't figure out how to add a row to the table.... Hello, This is a great site. Please add University of Phoenix to the directory: http://twitter.com/uopx Learn more about our social initiatives at http://phoenix.edu/social. Thanks so much. Check out GM commerical "Technically that is correct." Hilarious. Bloopers@end so keep watching............http://www.youtube.com/watch?v=iUO2lVSbJUc If you would please add Southern Illinois University Edwardsville. Our Twitter is: http://twitter.com/siue Our notes: http://siue.edu This is a great listing - thanks! Please add Washington State University's main campus Twitter http://twitter.com/WSUPullman & two more WSU regional campuses http://twitter.com/TriCities and http://twitter.com/WSUVancouver. Thanks!'''
