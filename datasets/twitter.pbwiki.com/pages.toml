["https://twitter.pbwiki.com/w/page/1779712/AcademicResearch"]
title = "Twitter Fan Wiki / AcademicResearch"
full_description = "Hi. For those interested in Twitter usage patterns, I'm conducting a twitter user survey for my PhD thesis at Dublin City University: http://www.eSurveysPro.com/Survey.aspx?id=9faf41ce-c4ce-4f3e-a551-976a272a7dec I'll be posting analysis of results via @cheesemonger in due course. Feel free to tweet to your followers as we have a long way to go to reach our target number of respondents! Hi. Why not going to a target creating your own WOC-UP-YOU sharing your copyrights in public collaboration mode ? I'm proposing that at my first WOC-UP-YOU and I would like to put it here on pbwiki as Twitter add. http://woc-up-you.ning.com/ http://woc-up-you.ning.com/profile/FilipeAlvesFerreira Regards/Filipe27 http://www.kelebekcafe.net http://www.kelebekcafe.org http://www.mirclider.com http://www.mirclider.net http://www.mirclider.org http://www.doruknet.org http://www.dorukchat.net http://www.dorukchat.org http://www.netzurna.com http://www.onursan.org http://www.gevezechat.org http://www.izmirchat.org http://www.cinselchat.org http://www.hanimeligelinlik.com http://www.hanimeligelinlik.net http://www.hanimeligelinlik.org http://www.oyunlider.com http://sikisyeri.blogspot.com/ http://fikra34.blogspot.com/ http://gunluk-filim.blogspot.com/ http://cinsel-muhabbet.blogspot.com http://escinselsohbet.blogspot.com http://cinselsohbetiniz.blogspot.com http://gaysohbetiniz.blogspot.com http://lezsohbetiniz.blogspot.com http://ist-lgbtt.blogspot.com/ http://travesti34.blogspot.com/ http://gay34.blogspot.com/ http://gay-lez.blogspot.com/ http://gay-europa.blogspot.com/ http://drkcht.blogspot.com/ http://sarki-s0zleri.blogspot.com/ http://www.facebook.com/OnurSan.Fan http://www.facebook.com/GunalSen http://www.facebook.com/Partneriniz http://www.facebook.com/AdultChat http://twitter.com/OnurSanFan PBworks / Help Terms of use / Privacy policy / GDPR About this workspace Contact the owner / RSS feed / This workspace is public Welcome to the Twitter Fan Wiki We've set this