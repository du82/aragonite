title = "Twitter Fan Wiki / FrontPage"
full_description = '''Here is a interesting site.. http://www.twittergamebots.com. They make bots for playing various games on twitter, currently only 140 mafia, but still nice software. Hi! folks. Hope you are all doing well. I got some problem here. Actually I got a mail subjected to SUSPENDED MY TWITTER ACCOUNT. There are also some opportunity to reinstatement my account, but I have to submit a ticket to request reinstatement. I have not found any thing how to reinstatement my twitter account till now. So please any body help to reinstated it. I know this is twitter fan wiki, but I think you guys, have the solve of my problem. Please help me... Hello Cynthia. I was just passing through the list here and saw your picture and thought I'd personally ask if I could "follow you" on Twitter? I'm new to Twitter so I hope I'm okay with my Twitter "etiquette" by asking to follow you. I haven't gotten that far (Twitter etiquette) I'm a fast learner though, lol. Thanx I would like to add my site to the list, somewhere under entertainment. URL: www.twitdrunk.com. Drunk Tweets! Good Times. We actually just launched the site 3 days ago and have some cool features coming up. "Drink. Tweet. Be Merry. :-)" - Colleen Hello ... who needs a twitter notebook(s) to keep notes write ideas or just to make a list of things would not be great if we have an applet to do that please let me know cuss.. I was a programmer Thx i am so happy that you find it fun and excting but remember the responabities that you have for this website iight and i am happy for you so just keep enjoying and i am here to answer any questions you have becuz i am a very nice and easy person to get a lone with and have gud advice for ya iight I reverted the most recent spam but I think this page should really be locked for editing. In fact most of this wiki seems to be spam, which is unfortunately ruining it. hey guys. Please, Help me. I work on CANVAS (virtual magazine) and I need clics in my recently article about twitter... http://canvas.red10.com/2009/07/twitters-de-famosos-mexicanos/ In this article you'll find some twitters of famous people'''
