["https://twitter.pbwiki.com/Apps"]
title = "Twitter Fan Wiki / Apps"
full_description = '''Put Windows Apps in alphabetical order on a previous suggestion. Other sections could also benefit from this as well. I am unsure about where to include http://www.quoteurl.com on this list, I see that a similar app (LinkBunch) is under "Posting and Alerts", so I am putting it there but please feel free to move it to "Others" or any other category you guys find appropriate. :) I don't know where should I put Twitnest (http://twitnest.appspot.com) It visualizes twitter's social graph as a graph with automatic grouping. Added Twittley(http://twittley.com) - First Twitter social bookmarking site..Share interesting news with Twitter users I am adding TwitterPray (http://www.twitterpray.com) under search engine apps. My app is a real time snapshot of what people are praying about on Twitter and what people are requesting. Question. Any insights into how to link forums to twitter in a useful way? Specifically: phpbb (www.time4learning.net) and joomla fireboard (http://www.spellingcity.com/index.php?option=com_fireboard&Itemid=171) Could somebody please add http://prune.it (maybe in the Posting category?) Its - yes another, sorry :-) - tiny url and tiny pic clone - but all under one roof, pruned web page urls or uploaded image urls urls and a message can be tweeted direct from the website, thanks. Added iTweetReply as "A service that automatically send you an email every time somebody "@" replies or mentions you on twitter." - http://www.itweetreply.com Just added TweetRSVP (www.tweetrsvp.com) under Search Engine section. Took a couple of edits and typo correction before getting a final version but all seems OK now. Thanks. I have been playing with a newly released Q&A exchange platform for the Twitter community: TweetBrain <http://tweetbrain.com>. It's hard to categorize it into the existing categories. Since it's a crowdsourcing platform for Twitter. On the surface, it's for Q&A, but playing it a bit, I think it has great potential for growing your social network on Twitter. An very effective way to hold online contests, to provide customer support, to raise awareness of a new business, to improve customer satisfaction etc.'''
