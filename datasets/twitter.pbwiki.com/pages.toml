["https://twitter.pbwiki.com/Hashtags"]
title = "Twitter Fan Wiki / Hashtags"
full_description = '''Regarding the list of references down toward the end of the page - would there be any objection if we added parenthetical statements after the author's name, containing a brief summary of the content of the link? (e.g. the Nate Ritter link could have the statement "(account of tweeting #sandiegofire information)" When you start following @hashtags, will it request your user timeline immediately and pick up hashtags in tweets made before following? We created @tagref (and http://thebounder.co.uk/tagref/) because we were seeing lots of #hashtags that we didn’t understand, both in our regular contacts’ tweets and in Twitter search’s ‘Trending topics’. If you try a simple search for the hashtag alone, it could potentially return thousands of tweets, most of which may not enlighten you as to what it actually means. As far as I know, there is no other way to 'define' what a hashtag means? I guess you could search for the first ever mention of it, but it still might not help. some of you may be interesting in @tagalus (http://tagal.us), which lets you define hashtags. Similar to what @tagref was suggesting, but more involved Twitter trending topics, search and related applicatins thrive on these hashtags, as they serve as noted keywords in the sea of tweets going through the microblogging platform. So determining the perfect hashtag is akin to creating the perfect title for a blog post. http://www.pupuweb.com/blog/promote-yourself-with-twitter-hashtag/ It took almost two years, but I finally did it. Under my old pseudonym, I had previously proposed (in January 2008) that parenthetical explanations be added to the ends of the "Further reading" entries. I've added a few of these, and hope that others will add more and (when necessary) improve the parenthetical summaries that I wrote. In addition, if there are any discussions regarding Twitter's formal adoption of hashtag support, perhaps they should be added to the "Further reading" list also. As smart phones, and access to Twitter reaches near-ubiquity, it may be beneficial for Twitter to work with the public sector to establish and promote certain hashtags for "official use only." For example, it may be advisable soon to set #911 as an "emergency tweet channel" that can be monitored by 911 operators, enabling victims and witnesses of crime and/or natural disasters to communicate silently if necessary, or when signal quality makes it difficult to get calls out.'''
