title = "Tyler Cowen's Ethnic Dining Guide | All food is ethnic food."
full_description = "← Older posts Bengaluru Cafe Posted on 2025/02/24 by . Bengaluru Cafe, web site, 3957 Pender Dr # 105, Fairfax, VA, 703-691-2468 (Metro Trip Planner – opens in new window) [Google | Washingtonian | RoadTrippers | Reddit | Restaurantji] Right now the best dosa short of the Herndon-Dulles area. Excellent South Indian vegetarian food, lots of other regional dishes, note they are heavy on carbs, don’t come here looking for vegetables. Has a good Indian crowd, and you can trust your GPS, it is really is hidden behind all those office buildings, even if you feel a restaurant cannot possibly be here. Recommended. Related Posts:Street KitchenChettinadu Indian CuisineIs Indian food the world’s best?Southeast ImpressionChaatwala Posted in Fairfax, Indian, Southern Indian, Virginia | Tagged Bengaluru Cafe, dosa, Fairfax, indian, vegetarian | Leave a comment Is Indian food the world’s best? Posted on 2024/12/19 by . From my latest Bloomberg column: Why is the food so good? I have several overlapping hypotheses, most of them coming from my background as an economist. Interestingly, India’s culinary advantages can be traced to some good and some not-so-good aspects of Indian society. First, food supply chains here are typically very short. Trucking, refrigeration and other aspects of modernity are widespread, but a lot of supply chains are left over from a time when those were luxuries. So if you are eating a vegetable, there is a good chance it came from nearby. That usually means it is more fresh and tastes better. The sad truth is that India still has very high rates of food spoilage, especially when food is transported longer distances. The country is making significant progress building out its transportation networks, but in the meantime the American culinary tourist enjoys the best of all worlds: Our purchasing power is high, and we can spend our money eating super-local. And: India also has high income inequality. That means there is plenty of cheap labor competing to cook for diners with higher incomes. The “thickness” of the competition leads to innovation and experimentation — there are a lot of restaurants, food stalls, truck stops and the like. It is a buyer’s market. Furthermore, some of India’s best dishes, such as Bengali sweets, are very labor-intensive. Indian desserts that are mediocre in US restaurants receive the proper care and attention in Kolkata. And: Then there is the cultural side. India is a “food nation.” When I ask locals which are the best places to eat, which I regularly do, I am repeatedly struck by how many have strong opinions. When everyone is a food critic, standards rise accordingly. It also makes it easy for the visitor to get quality recommendations. There are further good arguments at the link. In Bangalore I had a superb meal, Kayasth food, by Manu Chandra in Lupa, this was a special menu: Is Indian food the world’s best? Originally posted on Marginal Revolution – click to see full post, links, comments and suggestions. Related Posts:Bengaluru CafeWhy do the servers always want to take our cutlery and plates and glasses away?Rules for Tri-State Italian foodSan Francisco dining“Around since xxxx” Posted in Indian | Tagged indian, Marginal Revolution | Leave a comment Peter Chang MacLean Posted on 2024/09/03 by . Peter Chang MacLean, web site, 6715 Lowell Ave., McLean, VA, 571-405-6686 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | FFX Now | Reddit | Restaurantji | NoVA Mag] This is probably the second best of the Chang restaurants right now? I won’t go through the full Chang litany, but yes they do have most of the classic dishes here, cauliflower included. They also have the green chili fish, which is not always on the menu at Mama Chang proper. But the real treat here is the pork, which is from Amish farms. These are the best pork dishes in any local Chinese restaurant right now. The Twice Cooked Pork is especially fine. And get the beef with crispy rice with green chilies, again one of the best Chinese dishes around at the moment. Related Posts:Mama ChangAsian OriginQ by Peter ChangWhat could be more self-recommending than this?The economics of why Noma is closing Posted in Chicken, Chinese, Favorites - Current, McLean, Virginia | Tagged Amish chicken, Amish pork, beef, chicken, Chinese, McLean, Peter Chang, Peter Chang MacLean, pork | Leave a comment Why do the servers always want to take our cutlery and plates and glasses away? Posted on 2024/08/26 by . I have noticed repeatedly, over the course of many restaurant visits, that my servers want to take away my plates, my glasses, my cutlery, and indeed almost anything else — before I really want to give it up. The ratio of “they want to take it away too soon” to “they take it away too late” seems to me at least five to one. Those who know me would not describe me as a lingerer over meals, or a very slow eater. So I do not view this phenomenon as merely my peculiarity, rather the servers often want to take my things away before I am done with them. In many restaurants the servers seem to put more energy into keeping your table clean than in taking your order promptly in the first place. How should we model this behavior? One possibility is that the servers know they will be busier yet later on, so they want to get some of the work out of the way now. Surely that holds in many cases, but still I observe this “server grabbing behavior” in a wide variety of circumstances, including in near-empty restaurants. Could it be that the restaurant managers give these instructions, hoping it will induce the diners to order further dishes and spend more money? Another possibility is that the servers feel the need to signal that they are always busy, rather than standing around and looking idle. I can imagine that hypothesis having some truth, but it doesn’t explain the entirety of what I observe. The most plausible general explanation is that the restaurant managers favor a more rapid turnover of tables than the customers do, and regular plate- and glass-clearing helps to achieve that end. It also creates another “point of contact,” giving the customer the opportunity to ask for the check. Still, you might think ex ante competition to attract diners would moderate this practice more than it does. I have asked both current and former servers why there is so much emphasis on place-clearing, and usually I receive circular answers, such as “We want to make sure your plates and glasses are cleared away when you are done with them.” So what is the best way of thinking about this practice? Why do the servers always want to take our cutlery and plates and glasses away? Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Agglomeration externalities from restaurantsThe decline of Michelin-starred restaurantsRules for Tri-State Italian foodSan Francisco dining“Around since xxxx” Posted in Economics of Dining | Tagged economics of dining, Marginal Revolution, waiters | Leave a comment Eating well in Stockholm Posted on 2024/06/19 by . Yes, the fancy expensive places are great. But more generally, I recommend that you order the dishes with game and lingonberries, most of all lingonberries. Soups here are above average, and I do not generally love soups. The pizza is surprisingly good, make sure you order it with “pizza salad,” which turns out to be cabbage. If you are craving non-Western food, I would try Persian before Indian or Chinese. At breakfast, butter is consistently good. Overall, Stockholm is a quality food city, though it is not superb when it comes to breadth. Eating well in Stockholm Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts: Posted in Sweden | Comments Off on Eating well in Stockholm Where and how to eat in Cape Town, South Africa Posted on 2024/06/10 by . Don’t laugh, but basically you want to eat in the restaurants with the beautiful women. And with the views of the waterfront. You may recall those are usually the opposite of the correct recommendations. But in Cape Town, there is no coherent “mom and pop” restaurant sector, based on either recent Asian or Latino immigrants, or based on an existing middle class. You simply want to go to the nice, fancy places. And you don’t need my list, many sources can tell you which ones those are. The economics of that are simple. There is a well-defined class of people with a lot of money, and the best restaurants do everything they can to target them, including seaside views. That is by far the best way to get good food here, arguably the only way. You cannot in fact “arbitrage against the inequality,” even if you think you might wish to. Usually you should order seafood, and (as in Chile) be suspicious of any menu item with a cream sauce, which will be overdone on the creamy side. You may see batches of Afrikaans words on the English-language menus, don’t worry just pull out your ChatGPT app and enjoy the feeling of strangeness. I did have one meal of grilled meats and bbq in a black township, and it was not bad. But I would say you are going for the sociological experience more than for the food. You’ll also get some South African side dishes, such as the corn meal, that may not pop up in the fancier restaurants. So do that if you can, I also found the experience to be safe and not stressful. Prices here are very low, and an excellent meal can be well under half of the comparable cost in the United States or Europe, maybe even 3x lower. Wherever you go, make sure they give you a seat looking out on the water! Where and how to eat in Cape Town, South Africa Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Shinwari Namak MandiSan Francisco diningOne reason why the Seoul dining scene still has so many nooks and cranniesAditiIsabella Eatery Posted in Outside DC, South Africa | Tagged beautiful women, Seafood, South Africa, travel | Comments Off on Where and how to eat in Cape Town, South Africa Shinwari Namak Mandi Posted on 2024/05/07 by . Shinwari Namak Mandi, web site, FB, 5884 Leesburg Pike, Falls Church, VA, 703-347-8311 (Metro Trip Planner – opens in new window) [Google | RoadTrippers | Restaurant Guru] Yet further evidence that this area’s Pakistani restaurants are better than the Indian restaurants. Ask for haleem, sometimes they have it! But it’s not on the menu. What they serve here is predictable, but I mean that word in the good sense. The real stand-out here is the bread – maybe the best I’ve had in any northern Virginia restaurant? Make sure you get that. With the rest of the meal you will be fine too. Note there is a seafood sign on the outside of the restaurant, but this is not mainly a seafood restaurant, noting that Pakistani fish fry is not to be neglected. Related Posts:Desi Breakfast ClubFollow Up for Desi BethakDesi BethakKhan KabobNew Orleans Cajun Seafood Posted in Falls Church/Seven Corners, Pakistani, Virginia | Tagged bread, Falls Church, fish fry, haleem, Pakistani, Seafood, Shinwari Namak Mandi | Comments Off on Shinwari Namak Mandi Southeast Impression Posted on 2024/04/20 by . Southeast Impression, web site, 9530 Fairfax Blvd., Fairfax, VA, 703-865-4884 (Metro Trip Planner – opens in new window) [Google | Washingtonian | FFX Now | Restaurantji] Real Malaysian food, right near my house! They have Thai dishes too, but I’m not sure I’ll ever get around to trying them. The Nasi Lemak is my top recommendation here. Most dishes are good, though the laksa I found too tame. The others you can improve through the condiments. Good beef rendang. The roti with lentils appetizer is top-tier. Quality vegetables. So my standard of living has gone up by quite a bit. Note this is a “nice” place, rather than a Mom and Pop, but it is not a “fancy” place. Still, circa 2024, the beef rendang does cost $27. Related Posts:Malaysian KopitiamSisters Thai, The Living Room CaféBengaluru CafeMum AroiHow to eat well in Sri Lanka Posted in Fairfax, Malaysian, Thai, Virginia | Tagged beef rendang, Fairfax, laksa, Malaysia, Nasi Lemak, roti, Southeast Impression, thai | Comments Off on Southeast Impression Rules for Tri-State Italian food Posted on 2024/03/30 by . Piers emails me: You’re a NJ native and great at finding good restaurants. So what are the rules for finding good old school American Italian restaurants? Not like modern farm to table places full of natural light in Brooklyn or SF, you know what I mean? Review aggregators are useless. Horrid “egg noodles and ketchup” places get high scores just for being family run. It is harder and harder to find such places. I think the Latino-ization of the New Jersey heartland largely has been a good thing, and also a good thing for food (Peruvian!), but it hasn’t helped Italian dining very much. More and more New Jersey Italian places sell to the upper middle class, rather than to the diehards. I have two pieces of advice: 1. Go to a classic heartland road, such as Rt.17 or Rt.46, and try to learn which places still have Mafia ties, or had them recently. 2. Go to a town in the heartland, and ask a person working at a fire station. Heed the answer only if that person has a New Jersey accent. As a side remark, the good places have either “too good but tacky” decor, or poor, not good enough decor. Either way, it should not feel pleasant, that is a sign the ravioli and lasagna will be ordinary. And you can always resort to Staten Island, the Bronx, and parts of Connecticut, in that order. If you need to ask what “the heartland” means, you shouldn’t even be trying to eat this food, just drive to Kearny and opt for the lomo saltado or maybe something Brazilian, Dominican or Puerto Rican in Paterson. Rules for Tri-State Italian food Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Why do the servers always want to take our cutlery and plates and glasses away?San Francisco dining“Around since xxxx”How to eat well in Sri LankaAgglomeration externalities from restaurants Posted in Italian, New Jersey, New York, Outside DC | Tagged Bronx, Italian, Marginal Revolution, Peruvian, Staten Island | 1 Comment San Francisco dining Posted on 2024/03/26 by . Dwarkesh brought me to the very good Sizzling Pot King, 139 8th St, San Francisco, genuine Hunan food and yes I have been to Changsha. Don’t walk there though, take an Uber or better yet a Waymo. Dwarkesh was kind enough to call me one for the trip back to the hotel. When I asked for jazz music, I was shocked to hear a very high quality Bill Evans trio cut, not some popular slop. The Guam restaurant on Mission — Prubechu — is quite interesting and serves largely the indigenous Chamorro food. It is rare that I have the chance to try an altogether new cuisine, in any case I would eat there again. San Francisco dining Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Why d"
