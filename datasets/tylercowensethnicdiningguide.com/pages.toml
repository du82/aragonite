full_description = "← Asian Origin Kaliwa → Xian Gourmet Posted on 2018/06/26 by . Xian Gourmet, web site, 316 N Washington St, Rockville, MD, 301-875-1544 (Metro Trip Planner – opens in new window) [Ylp] Wow. Word is this is from the people who brought you Panda Gourmet in DC. As a Sichuan place, it would be one of the region’s five best, but that is not even their real strength. For Xian food it is a clear first in the region. Get their soups, most of all the beef with chili and noodle soup (contrary to the name it is not spicy) and the lamb soup with bread. The Dan Dan noodles I found to be a slight disappointment, but overall this is one of the very best Chinese places around plus it has many dishes you won’t find elsewhere. Pleasant service, great prices, no downside here that I can see. Xi’an – China Related Posts:Panda GourmetAsian OriginYu Zhou CaféDumpling QueenXian bleg This entry was posted in Chinese, Current Favorites, Maryland, Rockville/Gaithersburg, The Best and tagged Dan Dan noodles, lamb soup, Panda Gourmet, Sichuanese, Xian, Xian Gourmet. Bookmark the permalink. ← Asian Origin Kaliwa →"
