rk, Outside DC | Tagged Flushing, NY, Queens | 2 Comments New York tips: Tulsi, Jones Wood Foundry, Golden Mall Posted on 2011/05/09 by . 1. Tulsi, web site, 211 E. 46th, between 1st and 2nd, New York, NY, 212-888-0820. The most authentic Indian food I’ve had in the U.S., ever, get the vegetables. Not a cheap mom and pop, but by Manhattan standards this … Continue reading → Posted in Chinese, Gastropub, Indian, New York | Tagged Golden Mall, Jones Wood Foundry, LaGuardia, Tulsi | Comments Off on New York tips: Tulsi, Jones Wood Foundry, Golden Mall ← Older posts"
