title = "Super Bowl Noodle House | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Diya Momo’s Indian and Nepalese Food → Super Bowl Noodle House Posted on 2014/12/13 by . Super Bowl Noodle House, web site, 785-G Rockville Pike, Rockville, MD, 301-738-0086 (Metro Trip Planner – opens in new window) [WaPo | dishtip | Ylp | Don Rockwell] This place is a revelation and a knock-out, one of the absolute must-visits. It is a mix of Shanxi, Sichuan, and Taiwanese styles, with some other odd dishes thrown in. Order the Shanxi Noodle Soup but also – above all – at least one of the Spicy Dry Hot Pots, one of the best dishes around in any restaurant. It is hard to describe if you don’t already know it but very yummy. Get the flatbread with pork inside, the Chong Qing Dry Chili Chicken, the spicy cucumber salad, the soft tofu with numbing, and then ask for the specials. I don’t know of any other Chinese place around which serves food like this. It is both high quality and authentic, go, go, go. It is also very cheap and the staff is cheery and friendly, a winner all around. Related Posts:Wang DynastyUncle Liu’s Hot PotSichuan Legend Hot PotYu Noodles, FairfaxYu Noodles Café This entry was posted in Chinese, Current Favorites, Maryland, Rockville/Gaithersburg, Taiwanese and tagged Chong Qing Dry Chili Chicken, hot pot, noodles, NyILKgsjS3E, Rockville, Shanxi, Shanxi Noodle Soup, Sichuan, spicy cucumber salad, Spicy Dry Hot Pots, Super Bowl Noodle House, Taiwanese. Bookmark the permalink. ← Diya Momo’s Indian and Nepalese Food →"
