full_description = "← Warsaw bleg Karachi, Pakistan bleg → Poca Madre Posted on 2019/08/27 by . Poca Madre, web site, 777 Eye St., Techworld Plaza, NW, Washington, DC, 202-838-5300 (Metro Trip Planner – opens in new window) [Google | WaPo | Washingtonian | Don Rockwell | TripAdvisor | City Paper | Ylp] Chefs Dish DC | Chef Victor Albisu | Sponsored One of my favorite places right now, you could call it Mexican-Peruvian fusion, from the people who formerly brought you Del Campo. A few of the dishes here are among the best in town, in particular the Mango ceviche (yup), the fried chicken with mole (very subtle), and the corn risotto, called Huitsquites. I’ve had many of the other dishes, no disappointments, but those for me are the clear favorites. Not cheap, but the prices are not outrageous relative to value. I’m not so much into desserts, but if you like Latin desserts, try the Suspiro. Related Posts:Taco BambaDon PolloBarra Brava Cevicheria UrbanaTaco Bamba ViennaNazca Mochica This entry was posted in Chinatown/Verizon Center, Convention Center / Shaw, Current Favorites, DC, Mexican, Peruvian, The Best and tagged ceviche, corn risotto, Del Campo, Huitsquites, Mango ceviche, Mexican, Mexican-Peruvian, Peruvian, Poca Madre, Taco Bamba, Victor Albisu. Bookmark the permalink. ← Warsaw bleg Karachi, Pakistan bleg →"
