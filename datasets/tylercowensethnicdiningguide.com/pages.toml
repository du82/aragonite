full_description = "← Russian restaurants around the world Hong Kong Palace – Sichuan → BonChon Chicken Posted on 2007/08/07 by . BonChon Chicken, web site, 6653 Little River Turnpike, #H, Annandale, VA, 703-750-1424 [Don Rockwell] Is it the best fried chicken I’ve had? I didn’t even mind the forty-minute wait, though now I know to call ahead, as the Koreans do. Get it with both sauces – soy and garlic, and hot –and be sure to ask for the kimchi. Here is the NYT on Korean fried chicken. It’s also healthier than you think: crunchy, spicy, and non-greasy. Related Posts: This entry was posted in Annandale, Chicken, Korean, Virginia. Bookmark the permalink. ← Russian restaurants around the world Hong Kong Palace – Sichuan → One Response to BonChon Chicken Tim says: 2007/11/05 at 8:54 pm You left off the best one: Sensucht Berlin, Germany Restaurant for anorexic people (closed) Comments are closed."
