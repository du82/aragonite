full_description = "← Rumi’s Kitchen Las Gemelas → Aditi Posted on 2021/06/10 by . Aditi (Aditi Streetside Indian), web site, the new version, same location at 405 Maple Avenue East, Vienna, VA, 703-938-0100 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | Ylp] Aditi has had many incarnations, and many at this same location, and they all have been good. Not surprisingly the buffet is removed. The restaurant is much smaller and feels more mom and pop. There are new seafood dishes from Cochin and Kerala, and they are the highlight of the menu. So it is still quite good, and reasonably priced, and it is worth a revisit. The Malabar fish masala is one good place to start. Related Posts:Aditi BistroPunjabi by NatureTurmericBengaluru CafeWhere and how to eat in Cape Town, South Africa This entry was posted in Indian, Vienna/Tysons, Virginia and tagged Aditi, Aditi Streetside Indian, indian, Malabar fish masala, Seafood, Vienna. Bookmark the permalink. ← Rumi’s Kitchen Las Gemelas →"
