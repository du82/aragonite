["https://tylercowensethnicdiningguide.com/index.php/elephant-jumps-update"]
title = "Elephant Jumps – Update | Tyler Cowen's Ethnic Dining Guide"
full_description = "← *The Language of Food: A Linguist Reads the Menu* La Ciccia (and some thoughts on role models in universities) → Elephant Jumps – Update Posted on 2014/04/19 by . Elephant Jumps, web site, Thai food in Merrifield, 8110 A Arlington Blvd, Falls Church, VA, 22042, 703-942-6600, in the Yorktowne Center, more on Gallows than Route 50 (it is in the northwest corner of the Center, which sits on the northwest corner of Rte. 50 and Gallows Road). (Metro Trip Planner – opens in new window) [Google | WaPo | Don Rockwell | NoVA Mag | Yelp | View from the Wing – 2013 2014 | Washingtonian | Gayot] Previous review here. This place has improved so much I feel it deserves another review. It was already one of the best places on this list, nowadays it is probably the very best place. It has consistently original and authentic Thai food which is refined and improved on a regular basis. These days my favorite dishes are the Yum Pla Dook Foo (ground tuna, dried, peanuts, mango sauce), the Ka Nom Jee (hard to explain, but a mix of Thai delicious stuff on top of piles of noodles), Hung Lay curry (a kind of Thai barbecue, slow-cooked pork in tamarind sauce), crispy rice salad, and then a series of dishes which are not on the menu at all and vary in their availability. They include some spicy noodle dishes, one with pork, sour bamboo shoots curry, and a fermented fish dish as a kind of curry. Find the proprietor Tom and ask him “What would Tyler do?” And the older dishes which I previously reviewed are as good as ever, though I think no longer the very best ones. And for vegetarians I really like their green beans curry with tofu dish. If you are ever upset that I am not writing more restaurant reviews, the answer is that I am eating here too much. Related Posts:Elephant JumpsElephant Jumps, Thai food in MerrifieldSoutheast ImpressionMum AroiThai Treasure This entry was posted in Current Favorites, Falls Church/Seven Corners, Laotian, Thai, The Best, Uncategorized, Vienna/Tysons, Virginia and tagged crispy rice salad, Elephant Jumps, Hung Lay Curry, Ka Nom Jee, Ka Nom Jeen, KaNom Jeen, Ni1BzrqgqSI, thai, Thai food in Merrifield, tuna appetizer, YJFojq6uCRA, Yum Pla Dook Foo. Bookmark the permalink. ← *The Language of Food: A Linguist Reads the Menu* La Ciccia (and some thoughts on role models in universities) →"
