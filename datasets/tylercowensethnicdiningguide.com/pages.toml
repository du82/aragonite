full_description = "← The new html edition of Tyler Cowen’s Ethnic Dining Guide How to avoid being fooled by a menu → To Sok Jib Posted on 2009/12/11 by . To Sok Jib, web site, 7211 Columbia Pike, Annandale, VA, 703-333-2861 (Metro Trip Planner – opens in new window) [Yelp] (Updated review November 2016.) Previously reviewed on TCEDG in 2006 here, but this seems to be a new place. Quite small, very mom and pop. Of all the Korean places around, they have the best whole fried fish, the croaker in particular and maybe the mackerel too. That’s the thing to get here. Of all the rest, nothing is below average, though not much above the prevailing average. This is a fun place and you can’t go wrong here. At lunch time it can fill up, though if need be there are other nearby places you can walk to, if you don’t want to wait. Related Posts:To Sok JipTo Sok Jib9292 Korean BBQBalo KitchenMr. Tofu House & BBQ This entry was posted in Annandale, Korean, Virginia and tagged Annandale, Korean, To Sok Jib, To Sok Jip. Bookmark the permalink. ← The new html edition of Tyler Cowen’s Ethnic Dining Guide How to avoid being fooled by a menu →"
