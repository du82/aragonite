, Seafood, t_o--x2_fFM | Comments Off on Fiola Mare Should you scorn seafood in the American Midwest? Posted on 2014/02/19 by . Bruce Arthur, a loyal MR reader, writes to me: I grew up in a Polish immigrant neighborhood in Chicago, where I was raised on a diet high in seafood. My mother was raised close to the Baltic Sea and we … Continue reading → Posted in Seafood | Tagged asam laksa, Cincinnati Chili, midwest, Seafood, yEOHr8FudwQ | Comments Off on Should you scorn seafood in the American Midwest? Blue Sand Seafood Posted on 2013/10/08 by . Blue Sand Seafood, 4231-H Markham Street, Annandale, VA, 703-914-1004 (Metro Trip Planner – opens in new window) [Google] This is now the best Korean place for seafood, especially those spicy stews and soups which hardly anyone likes (but I do). … Continue reading → Posted in Annandale, Current Favorites, Korean, Seafood, Virginia | Tagged Annandale, BGpdQQqoN2A, Blue Sand, Blue Sand Seafood, Korean, Seafood | 1 Comment New Orleans Cajun Seafood Posted on 2013/06/29 by . New Orleans Cajun Seafood, web site and here, too, 6168 Arlington Blvd., Falls Church, VA, in Willston Shopping Center across from Mark’s Duck House, 703-536-2288 (Metro Trip Planner – opens in new window) [Don Rockwell | Yelp] Run by Vietnamese … Continue reading → Posted in Cajun, Falls Church/Seven Corners, Seafood, Virginia | Tagged beignet, boiled spicy crawfish, Cajun, crawfish, cU01XAtFkmk, Falls Church, New Orleans, New Orleans Cajun, Po Boys, Seafood | 1 Comment Pelican Seafood Posted on 2012/06/23 by . Pelican Seafood, 7327 Little River Turnpike, Annandale, VA, 703-354-9888 (Metro Trip Planner – opens in new window) [Chowhound | Yelp] An odd mix of a totally normal “American-Chinese” restaurant, eight or so quite good Hong Kong style noodle soup dishes … Continue reading → Posted in Annandale, Chinese, Crabs, Seafood, Virginia | Tagged American-Chinese, Annandale, fish and chips, Hong Kong noodles, Pelican Seafood, puffin, puffins, steam crabs, steamed crabs | 1 Comment Seafood Hokkaido Buffet Posted on 2011/06/10 by . Seafood Hokkaido Buffet, 5900 Leesburg Pike, Falls Church, Baileys Crossroads, VA, 703-845-0888 (Metro Trip Planner – opens in new window) [WaPo | Yelp] Huge, cavernous, and culturally unidentifiable despite the Japanese name. They serve sushi, kimchee, 1950s style cafeteria food … Continue reading → Posted in Bailey's Crossroads, Falls Church/Seven Corners, Seafood, Virginia | Comments Off on Seafood Hokkaido Buffet Eel Se Flounder Dong (Annandale Seafood Restaurant) Posted on 2010/08/21 by . Eel Se Flounder Dong (Annandale Seafood Restaurant), web site, 7123 Columbia Pike, Annandale, VA, 703-642-0628 (Metro Trip Planner – opens in new window) [Yelp] Lots of sushi and sashimi, fresh fish, above average in those areas, plus they specialize in … Continue reading → Posted in Annandale, Seafood, Virginia | Comments Off on Eel Se Flounder Dong (Annandale Seafood Restaurant) ← Older posts"
