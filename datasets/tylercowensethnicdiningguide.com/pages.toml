full_description = "Category Archives: New York ← Older posts Rules for Tri-State Italian food Posted on 2024/03/30 by . Piers emails me: You’re a NJ native and great at finding good restaurants. So what are the rules for finding good old school American Italian restaurants? Not like modern farm to table places full of natural light in Brooklyn or … Continue reading → Posted in Italian, New Jersey, New York, Outside DC | Tagged Bronx, Italian, Marginal Revolution, Peruvian, Staten Island | 1 Comment Singaporean hawker centre in Manhattan Posted on 2023/03/17 by . Urban Hawker, On 135 W.50th, 17 vendors Here is a NYT review, good photos of the key dishes. The Hainanese chicken rice was amazing, worthy of Singapore, get it poached of course. Condiments! The Malaysian lontong was quite good, the … Continue reading → Posted in Food Stands, New York, Singaporean | Tagged Manhattan, Marginal Revolution, NYC, Singaporean | Comments Off on Singaporean hawker centre in Manhattan Cafe China – NYC Posted on 2022/02/17 by . Cafe China, web site, 59 W.37th St. NY, NY, 212-213-2810 [Google | NYMag | TripAdvisor | Ylp] Recently opened, still in “soft launch” phase. Sichuan, but fragrant rather than “knock your socks off hot.” The smoked tofu is amazing, the … Continue reading → Posted in Chinese, New York, Outside DC | Tagged Beef with green chili, Cafe China, Chinese, NYC, Sichuan, smoked tofu, tofu | Comments Off on Cafe China – NYC Jungle Bird, NYC Posted on 2019/06/12 by . Jungle Bird, NYC, web site, 174 8th Avenue, New York, NY, 646-868-8422 [Google | Ylp] That is my brother’s new restaurant in Chelsea, southeast Asian food, it has made the Approval Matrix and after three weeks is already a big … Continue reading → Posted in Asian (Pan-Asian), Bars, Cocktails, New York, Outside DC | Tagged Chelsea, Jungle Bird, New York City, NYC | Comments Off on Jungle Bird, NYC Three Manhattan Places Posted on 2016/10/17 by . A few places to eat in Manhattan: Hatsuhana, very expensive sush