title = "Yu Noodles, Fairfax | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Tabla Duangrat’s Oriental Food Mart → Yu Noodles, Fairfax Posted on 2020/12/24 by . Yu Noodles, Fairfax, web site, 11217-C Lee Highway, Fairfax, VA, 703-877-0818, in the same strip mall as Nanjing Bistro. (Metro Trip Planner – opens in new window) [Google | NoVA Mag | Ylp] One of the best places around, and yes it opened during the pandemic. It seems to be doing quite well. Sichuan yes, but with a twist, these are mostly dishes from Chongqing rather than Chengdu. Everything here will be broadly familiar to you in terms of soups, dumplings, noodles, ma la, and the like but always with twists. By now I’ve had most of the menu here. It is consistently excellent, my main recommendations are simply to go with the spicy dishes, everything is worthwhile. The specials on the blackboard, which vary, are usually worth trying. Most of the food (soups aside) holds up very well for take-out. One of the gems of this year. Related Posts:Wang DynastyYu Noodles CaféUncle Liu’s Hot PotMama ChangCafe China – NYC This entry was posted in Chinese, Current Favorites, Fairfax, The Best, Virginia and tagged Chinese, Chongqing, dumplings, Fairfax, Nanjing Bistro, noodles, Sichuan, soups, Yu Noodles. Bookmark the permalink. ← Tabla Duangrat’s Oriental Food Mart → 2 Responses to Yu Noodles, Fairfax Lantian says: 2020/12/26 at 9:03 pm Great find. My wife and I went there in October. Their signature dish – the noodles (????) gained popularity in China in recent years. I had never heard of it when I left China five years ago, but since then I’ve heard a lot about it and there are ???? restaurants all over the country. There’s another Chinese restaurant in the same strip mall – Nanjing Bistro – we’ve wanted to try but didn’t get the chance. Lantian says: 2020/12/26 at 9:07 pm For some reason the Chinese characters I typed were displayed as question marks. The word I typed was Chongqing Xi?o Miàn – Chongqing noodles. https://zh.wikipedia.org/wiki/%E5%B0%8F%E9%9D%A2 Comments are closed."
