full_description = "← The countercyclical asset, northern Virginia edition West End Bistro → Aditi Bistro Posted on 2009/03/07 by . Aditi Bistro, web site, 405 Maple Avenue East, Vienna, VA, 703-938-0100 (Metro Trip Planner – opens in new window) [WaPo | Yelp] New Review June 10, 2021 Run by the Aditi people, it has lots of wraps. Imagine trying to do Chipotle with Indian food. It’s OK, good enough if you’re in the area, but not up to the best Indian places around. Related Posts:AditiThai TreasureBlend 111Lotus GardenPunjabi by Nature This entry was posted in Indian, Vienna/Tysons, Virginia and tagged Aditi, Aditi Streetside Indian, Vienna. Bookmark the permalink. ← The countercyclical asset, northern Virginia edition West End Bistro → One Response to Aditi Bistro Pete says: 2009/05/04 at 4:57 pm It depends on what you’re looking for. If what you’re looking for is the most incredibly tasty Indian food you’ve ever had, or some authentic new and unusual thing you’ve never had before, Aditi Bistro is likely to disappoint. HOWEVER…if what you want is good quality, still quite tasty, and moderately priced Indian flavored “Fast Food” that you can carry out and eat while driving, then the Masala Wraps (with rice) or the smaller Kati Rolls (no rice, just the meat or other filling in the wrap) SIMPLY CANNOT BE BEAT. Just be careful to hold the bottom of the wrap well, so as not to drip spicy chutney dressing in the wrap all over your pants if you eat it in the car! Comments are closed."
