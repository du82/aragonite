full_description = "← Toosso Bistro Aracosia → Chiko Posted on 2018/02/10 by . Chiko, web site, 423 8th SE, Washington, DC, 202-558-9934 (Metro Trip Planner – opens in new window) [Zagat | WaPo | Washingtonian | TripAdvisor | City Paper | Ylp] Chinese and Korean and fusion, this place is all the rage with DC food critics. Everything here is quite good, and the dish with rice, brisket, and egg is one of the better dishes in town. Nothing is outrageously priced. The space is small, it fills up early, and there are only limited reservations. Unlike most lower-priced places in DC, it genuinely seems to be well run. So I am quite enthusiastic, and if I simply stumbled upon this place I would give it a rave review. As it stands, I can’t help but feel it is a wee bit overrated. Most of the dishes are on the “quite good by suburban standards for Asian” level, which is a) on its own quite good, and b) a miracle of sorts for SE Washington, DC. But for those of us from said suburbs, we might be just a little bit less impressed. Related Posts:Shared Plates, Shared Minds: Consuming from a Shared Plate Promotes CooperationPeter Chang MacLeanWhat could be more self-recommending than this?One reason why the Seoul dining scene still has so many nooks and cranniesShi Miaodao Yunnan Rice Noodle This entry was posted in Capitol Hill/Union Station, Chinese, DC, Korean, Southeast and tagged Capitol Hill, Chiko, Chinese, Eastern Market, Korean, washington dc. Bookmark the permalink. ← Toosso Bistro Aracosia →"
