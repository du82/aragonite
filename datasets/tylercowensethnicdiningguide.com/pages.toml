full_description = "← Rules for Tri-State Italian food Shinwari Namak Mandi → Southeast Impression Posted on 2024/04/20 by . Southeast Impression, web site, 9530 Fairfax Blvd., Fairfax, VA, 703-865-4884 (Metro Trip Planner – opens in new window) [Google | Washingtonian | FFX Now | Restaurantji] Real Malaysian food, right near my house! They have Thai dishes too, but I’m not sure I’ll ever get around to trying them. The Nasi Lemak is my top recommendation here. Most dishes are good, though the laksa I found too tame. The others you can improve through the condiments. Good beef rendang. The roti with lentils appetizer is top-tier. Quality vegetables. So my standard of living has gone up by quite a bit. Note this is a “nice” place, rather than a Mom and Pop, but it is not a “fancy” place. Still, circa 2024, the beef rendang does cost $27. Related Posts:Malaysian KopitiamSisters Thai, The Living Room CaféBengaluru CafeMum AroiHow to eat well in Sri Lanka This entry was posted in Fairfax, Malaysian, Thai, Virginia and tagged beef rendang, Fairfax, laksa, Malaysia, Nasi Lemak, roti, Southeast Impression, thai. Bookmark the permalink. ← Rules for Tri-State Italian food Shinwari Namak Mandi →"
