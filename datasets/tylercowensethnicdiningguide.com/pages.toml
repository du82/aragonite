en around so long but is good, why haven’t I heard … Continue reading → Posted in Economics of Dining | Tagged Marginal Revolution | 1 Comment How to eat well in Sri Lanka Posted on 2023/07/31 by . Food here is excellent, but eating well involves some counterintuitive advice. For one thing, there are few “undiscovered gems” along the roadways. It is just not a thing here, and several Sri Lanka residents have confirmed this to me (one … Continue reading → Posted in Sri Lanka, Sri Lankan | Tagged curry, Marginal Revolution, roti, Sri Lanka, Sri Lankan | Comments Off on How to eat well in Sri Lanka Agglomeration externalities from restaurants Posted on 2023/06/17 by . We estimate agglomeration externalities in Milan’s restaurant sector using the abolition of a unique regulation that restricted where restaurants could locate. In 2005, Milan abolished a minimum distance requirement that had kept the number of establishments artificially constant across neighborhoods. … Continue reading → Posted in Economics of Dining | Tagged economics of dining, Marginal Revolution | Comments Off on Agglomeration externalities from restaurants Singaporean hawker centre in Manhattan Posted on 2023/03/17 by . Urban Hawker, On 135 W.50th, 17 vendors Here is a NYT review, good photos of the key dishes. The Hainanese chicken rice was amazing, worthy of Singapore, get it poached of course. Condiments! The Malaysian lontong was quite good, the … Continue reading → Posted in Food Stands, New York, Singaporean | Tagged Manhattan, Marginal Revolution, NYC, Singaporean | Comments Off on Singaporean hawker centre in Manhattan The decline of Michelin-starred restaurants Posted on 2023/02/23 by . That is the topic of my latest Bloomberg column, here is one bit: And then there is the spread of the Michelin brand. There are now Michelin guides for many US cities, which has caused the brand to lose some … Continue reading → Posted in Economics of Dining, Fine Dining, General remarks, Overrated | Tagged 