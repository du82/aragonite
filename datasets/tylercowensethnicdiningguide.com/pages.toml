full_description = "← &pizza Food consumption now has higher entry barriers than does music consumption → Street Kitchen Posted on 2017/03/05 by . Street Kitchen, web site, 7943B Tysons Corner Center, Ste G21U (2nd floor), Tysons Corner, VA, Tysons Corner Mall I, floor 2, near the restaurant American Tandoor, 571-633-1820 (Metro Trip Planner – opens in new window) [Zagat | TripAdvisor | Ylp] A dosa stand in Tysons! It’s not just good for Tysons, it’s really good period. In fact I’ll put it in the top tier of dosa places around. And the Mysore masala dosa is the spiciest dosa I’ve had in this area in years. The sides are decent. I’ve tried the wraps there too, they are OK but not the reason to go. The dosas are excellent, hurrah! Related Posts:Bengaluru CafeChettinadu Indian CuisineDiyaJoonChaatwala This entry was posted in Indian, Vienna/Tysons, Virginia and tagged American Tandoor, dosa, indian, Mysore masala dosa, Street Kitchen, Tysons. Bookmark the permalink. ← &pizza Food consumption now has higher entry barriers than does music consumption →"
