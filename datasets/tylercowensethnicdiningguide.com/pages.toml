full_description = "Category Archives: General remarks ← Older posts The decline of Michelin-starred restaurants Posted on 2023/02/23 by . That is the topic of my latest Bloomberg column, here is one bit: And then there is the spread of the Michelin brand. There are now Michelin guides for many US cities, which has caused the brand to lose some … Continue reading → Posted in Economics of Dining, Fine Dining, General remarks, Overrated | Tagged economics of dining, Marginal Revolution, Michelin | Comments Off on The decline of Michelin-starred restaurants The meaning of death, from an economist’s point of view Posted on 2019/02/10 by . A few days ago Garett Jones came to my office door and asked “what do we really know about labor supply?” I said we might as well extend the query to labor demand. In any case, here was part of … Continue reading → Posted in Economics of Dining, General remarks | Tagged death, economics of dining, kebab, minimum wage, pupusas, roast chicken | Comments Off on The meaning of death, from an economist’s point of view Shared Plates, Shared Minds: Consuming from a Shared Plate Promotes Cooperation Posted on 2018/12/28 by . Here’s What Happens When Strangers Unexpectedly Eat Together At The Airport A meal naturally brings people together, but does the way a meal is served and consumed further matter for cooperation between people? This research (n = 1476) … Continue reading → Posted in Chinese, General remarks, General Tips, History of Food, Hot Pot, Humor, Italian, Korean | Tagged Chinese, family style, Korean, lazy Susan, table fellowship | Comments Off on Shared Plates, Shared Minds: Consuming from a Shared Plate Promotes Cooperation 10 Things I Learned: Tyler Cowen Posted on 2018/08/12 by . That is a short interview with me from Northern Virginia magazine, here is one excerpt: When did you feel you had “made it”? Jan. 21, 1962 (his birthday). That was a turning point of sorts for me. How do you … Continue reading → Posted in General remarks, General Tips | Tagged Conversations with Tyler | Comments Off on 10 Things I Learned: Tyler Cowen Economist’s Christmas Posted on 2017/12/22 by . Economist’s Christmas Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts: Posted in General remarks, Humor | Comments Off on Economist’s Christmas Lessons from the Washington, D.C. dining scene Posted on 2017/12/09 by . Can One Chef’s Approach to Global Fine Dining Catch on in Washington D.C.? Contrary to what many people will insist, it’s now possible to eat excellent Mexican food, including tacqueria-style tacos, in D.C., Northern Virginia and nearby Maryland. But this … Continue reading → Posted in DC, Economics of Dining, General remarks, Maryland, Mexican, Virginia | Tagged GoGwUNHbncg, Mexican, thai, Vietnamese | Comments Off on Lessons from the Washington, D.C. dining scene Food consumption now has higher entry barriers than does music consumption Posted on 2017/04/09 by . Marco Bresba emails me: I loved your post on how Food has displaced Music in pop culture (March 29) I’ve been thinking about the topic for years, and I believe complacency is pertinent. Musical taste (like one’s taste in wine, … Continue reading → Posted in Economics of Dining, General remarks | Comments Off on Food consumption now has higher entry barriers than does music consumption “Why isn’t your way of eating and dining more popular?” Posted on 2017/01/24 by . That is a request from an MR reader. Getting past the “because I am weird” answer, I will offer a few observations: 1. I think my view, or broadly speaking some version of it, is in fact pretty popular, though … Continue reading → Posted in Beautiful Women, General remarks | Tagged beautiful women, Six Rules for Dining Out | Comments Off on “Why isn’t your way of eating and dining more popular?” Discussions about restaurants in the New York Times Posted on 2016/05/13 by . The data start in 1880 and run through 2013. Based on my visual reading of the chart, discussion of Chinese restaurants appears to have peaked in the 1940s (!). German restaurants are the biggest loser over time, with plunges during … Continue reading → Posted in Books, General remarks | Tagged Krishnendu Ray, The Ethnic Restaurateur | Comments Off on Discussions about restaurants in the New York Times New edition of Tyler Cowen’s ethnic dining guide Posted on 2016/04/22 by . Here is the one file, print it all out version, just revised. Here is the blog version, which is easier to follow in bits and pieces, looks nicer, works better, and accepts comments. Here are the links on Twitter. The … Continue reading → Posted in General remarks | 1 Comment ← Older posts"
