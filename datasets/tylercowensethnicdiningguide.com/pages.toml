full_description = "← Queen Ammanisa North West Chinese Food → Mr. Tofu House & BBQ Posted on 2016/01/18 by . Mr. Tofu House & BBQ, 7137 Little River Turnpike, Annandale, VA, 703-256-1888 (Metro Trip Planner – opens in new window) [Annandale VA | xiaohua] Mr Tofu House & BBQ, bulgogi It looks ordinary, but it’s well above average. There’s nothing especially innovative about this place, but it does a lot of the standard Korean dishes better than its competitors. Right now this is my favorite Bul-gogi in the area, for instance. Their kimchee soups are also at the top of the distribution. Don’t expect to find your worldview shattered, but if you are up for the Annandale experience this is one of my favorite places in town right now. Related Posts:Il Mee Buffet9292 Korean BBQBalo KitchenTo Sok JipEvergreen Korean Cuisine, or Sang Rok Soo This entry was posted in Annandale, Korean, Virginia and tagged Annandale, Bul-Gogi, Bulgogi, kimchee, kimchee soup, kimchi, Korean, Mr. Tofu. Bookmark the permalink. ← Queen Ammanisa North West Chinese Food →"
