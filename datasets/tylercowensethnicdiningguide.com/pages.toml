full_description = "← The sushi restaurant in the D.C. Trump International Hotel Mirabelle → Mayura Posted on 2018/11/05 by . Mayura, web site 1, web site 2, 10406 Venice Blvd, Culver City, Los Angeles, CA, 310-559-9644 [Google | LA Weekly | TripAdvisor | Ylp] I don’t usually think of LA as a splendid place for Indian food, but in fact it is. The specialty here is Keralan, and that is what you should order. Go to the Keralan section of the menu and get all eight or so dishes there, or fewer if you are alone. The vegetables are superb, the biryani too. I don’t know of any place in North America better for Keralan food. The buffet looked fine, but I doubt if that is your optimal strategy here. Plus it is in a lovely strip mall. MAYURA SOUTH INDIAN CUISINE, Culver City, CA. by Golfing Country Related Posts:Los Angeles diningChit Chaat CaféMoghul Express, Edison, New JerseyDining out in KarachiDesi Bethak This entry was posted in California, Indian, Outside DC, Southern Indian and tagged biryani, California, Keralan, Los Angeles, Mayura. Bookmark the permalink. ← The sushi restaurant in the D.C. Trump International Hotel Mirabelle →"
