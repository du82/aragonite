full_description = "← Is food the new music? (sentences to ponder) Forthcoming Uighur markets in everything → Curry Leaf Posted on 2015/08/25 by . Curry Leaf, web site, 13919 Baltimore Ave #4, Laurel, Maryland, 301-497-2017, a bit north on 95, they are often closed for part of the mid-afternoon. (Metro Trip Planner – opens in new window) [WaPo | Washingtonian | TripAdvisor | Ylp | Don Rockwell] This much-heralded Indian place does live up to its billing. It probably has the best “simple” vegetables around, such as spinach, eggplant, and lentils. The Uttapham is excellent. Everything is at least very good. It doesn’t have dishes you can’t get somewhere else, but in terms of overall quality this is one of the two or three best Indian choices around. The buffet is a good option too, and I usually don’t like Indian buffets. Related Posts:Follow Up for Desi BethakBistro AracosiaAfghan BistroKingsway Café of LaurelTurmeric This entry was posted in Columbia/Laurel, Indian, Maryland and tagged Curry Leaf, eggplant, Indian buffet, K82wm5ihGG4, Laurel, lentils, spinach, Uttapham. Bookmark the permalink. ← Is food the new music? (sentences to ponder) Forthcoming Uighur markets in everything →"
