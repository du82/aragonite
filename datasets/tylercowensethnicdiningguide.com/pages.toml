title = "Is Indian food the world’s best? | Tyler Cowen's Ethnic Dining Guide"
full_description = '← Peter Chang MacLean Bengaluru Cafe → Is Indian food the world’s best? Posted on 2024/12/19 by . From my latest Bloomberg column: Why is the food so good? I have several overlapping hypotheses, most of them coming from my background as an economist. Interestingly, India’s culinary advantages can be traced to some good and some not-so-good aspects of Indian society. First, food supply chains here are typically very short. Trucking, refrigeration and other aspects of modernity are widespread, but a lot of supply chains are left over from a time when those were luxuries. So if you are eating a vegetable, there is a good chance it came from nearby. That usually means it is more fresh and tastes better. The sad truth is that India still has very high rates of food spoilage, especially when food is transported longer distances. The country is making significant progress building out its transportation networks, but in the meantime the American culinary tourist enjoys the best of all worlds: Our purchasing power is high, and we can spend our money eating super-local. And: India also has high income inequality. That means there is plenty of cheap labor competing to cook for diners with higher incomes. The “thickness” of the competition leads to innovation and experimentation — there are a lot of restaurants, food stalls, truck stops and the like. It is a buyer’s market. Furthermore, some of India’s best dishes, such as Bengali sweets, are very labor-intensive. Indian desserts that are mediocre in US restaurants receive the proper care and attention in Kolkata. And: Then there is the cultural side. India is a “food nation.” When I ask locals which are the best places to eat, which I regularly do, I am repeatedly struck by how many have strong opinions. When everyone is a food critic, standards rise accordingly. It also makes it easy for the visitor to get quality recommendations. There are further good arguments at the link. In Bangalore I had a superb meal, Kayasth food, by Manu Chandra in Lupa, this was a special menu: Is Indian food the world’s best? Originally posted on Marginal Revolution – click to see full post, links, comments and suggestions. Related Posts:Bengaluru CafeWhy do the servers always want to take our cutlery and plates and glasses away?Rules for Tri-State Italian foodSan Francisco dining“Around since xxxx” This entry was posted in Indian and tagged indian, Marginal Revolution. Bookmark the permalink. ← Peter Chang MacLean Bengaluru Cafe → Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
