full_description = "← Urban Butcher Split, Croatia bleg → Baan Thai Posted on 2015/07/26 by . Baan Thai, web site, 1326 14th Street NW, Washington, DC 202-588-5889 (Metro Trip Planner – opens in new window) [WaPo | TripAdvisor | City Paper | Ylp | Don Rockwell] Regional Thai cuisine, from four different parts of the country, the attached sushi restaurant serves as a talisman against the uninformed. Get the tapioca chicken, the Isan sausage, and the Thai vermicelli in chili peanut sauce. This is one of three or four local places with real Thai food, and thus one of the best dining spots in DC. The Yelp reviews are nearly worthless, but here is useful WaPo coverage. Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Southeast ImpressionMum AroiCeiboAbovegroundThai Treasure This entry was posted in Current Favorites, DC, Logan Circle, Thai and tagged Baan Thai, dc, Isan sausage, sushi, tapioca chicken, thai, UI4kPuKKDhY. Bookmark the permalink. ← Urban Butcher Split, Croatia bleg →"
