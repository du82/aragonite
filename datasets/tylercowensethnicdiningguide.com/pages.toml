full_description = "← What should I ask Mark Miller? Chercher Ethiopian Restaurant and Mart → All-Purpose Pizzeria Posted on 2016/10/24 by . All-Purpose Pizzeria, web site, 1250 Ninth Street NW, Washington, DC, 202-849-6174, lots of lines but going early will work. (Metro Trip Planner – opens in new window) [WaPo | Washingtonian | TripAdvisor | City Paper | Ylp | Gayot] Washington Post loved this place and perhaps it raised my expectations too high, plus I very much like The Red Hen, which is run by the same people. Here I enjoyed the variety of dishes I tried, but I didn’t love the pizza. I liked it. Eggplant parmigiana had an excellent quality eggplant, but it led me to conclude that eggplant parmigiana just isn’t that good a dish. The Sicilian tuna mousse I thought was outstanding, one of the best appetizers I’ve had in town in a while. Overall it is a very good neighborhood Italian restaurant, not to be confused with a top DC restaurant but having its uses nonetheless. Related Posts:All-Purpose PizzaRules for Tri-State Italian foodTimber Pizza Co.Isabella EateryMenomale This entry was posted in Convention Center / Shaw, DC, Italian, Pizza and tagged All-Purpose, All-Purpose Pizzeria, Eggplant parmigiana, Italian, pizza, tuna mousse. Bookmark the permalink. ← What should I ask Mark Miller? Chercher Ethiopian Restaurant and Mart →"
