full_description = "← Dulce’s Bakery and Empanada Shop Blue Sand Seafood → Kogiya, Korean BBQ Posted on 2013/10/06 by . Kogiya, Korean BBQ, web site, 4220 Annandale Road, Annandale, VA, 703-942-6995 (Metro Trip Planner – opens in new window) [Google | WaPo | Washingtonian | Don Rockwell] This is now a clear first choice for Korean barbecue in the area. It is consistently excellent at every stage of the meal and dining experience and no other place around is, not after the decline of Honey Pig. It’s not original or surprising, just very good. Most people get one of the two all you can eat specials, for $20.99 or I think $28.99, respectively. Basically you are paying extra for an option on intestines, if you wish, so for most people the cheaper of the two will do. The decor is excellent, in the metallic direction, and they have some intriguing back rooms you can dine in. Here’s the catch: it is pretty small (twelve or so tables?) and it fills up early. I went on 4:30 pm on a Saturday and the place was already more than half full. The cool people come here to see and be seen, etc. Definitely recommended. Related Posts:Seoul Gool Dae Gee (Honey Pig Restaurant)9292 Korean BBQIron AgeJD Ethiopian Restaurant and BarEl Habanero Tacqueria This entry was posted in Annandale, Current Favorites, Korean, The Best, Virginia and tagged Annandale, GFbBMvr0ZJY, Honey Pig, Kogiya, Korean Barbecue, Korean BBQ. Bookmark the permalink. ← Dulce’s Bakery and Empanada Shop Blue Sand Seafood →"
