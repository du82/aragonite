full_description = "← Montreal bleg Fiola Mare → Charcoal Chicken Posted on 2014/06/20 by . Charcoal Chicken, web site, 13969 Metrotech Dr., Chantilly, VA, 703-953-3707 (Metro Trip Planner – opens in new window) [Google | zabihah] The number one Pakistani place in Virginia, better than the competitors. Get the karahi chicken and the lamb with spinach. They have knock out bread and green sauce, make sure you dip *something* in the green sauce. Everything else seems pretty consistent. The fried fish is good too. Let the spices and juices from everything soak into the bread, and then the best part of the meal has arrived. Superb, I hope you get there. Related Posts:Shinwari Namak MandiDesi Breakfast ClubFollow Up for Desi BethakDining out in KarachiKarachi, Pakistan bleg This entry was posted in Chicken, Current Favorites, Herndon/Reston/Ashburn/Chantilly / Dulles Airport, Pakistani, Virginia and tagged Chantilly, Charcoal Chicken, J4kkToz_qA4, karahi chicken, Pakistani. Bookmark the permalink. ← Montreal bleg Fiola Mare →"
