full_description = "← Los Angeles food bleg Maneki Neko → Rose’s Luxury Posted on 2015/01/08 by . Rose’s Luxury, web site, 707 8th Street SE, Washington, DC, 202-580-8889 (Metro Trip Planner – opens in new window) [Google | WaPo | Washingtonian | City Paper | Bon Appetit | Ylp | Don Rockwell | Gayot] I was skeptical, but after one visit I believe this is the best restaurant in DC right now and the hype and lines are actually justified. I went with four people, sampled about a dozen courses and each and every one of them was both excellent and original. The way to go here is to maximize the number of small dishes you get. It’s not cheap, but I know at least fifteen places which cost more, none of them as good. The menu changes rapidly, but I thought the pork and lychee salad was especially outstanding. Related Posts:ChikoDie Aufhebung des Bezahlens This entry was posted in American, Current Favorites, DC, Southeast and tagged 9gMWRhoMIl4, Eastern Market, JFMX0NX_-pw, lychee salad, Rose's Luxury, small dishes. Bookmark the permalink. ← Los Angeles food bleg Maneki Neko →"
