title = "Takumi | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Bad Saint Texas Jack’s → Takumi Posted on 2016/04/05 by . Takumi, web site, 310 S. Washington Blvd., Falls Church, VA, Rt.29, just west of Rt.7, 703-241-1128. (Metro Trip Planner – opens in new window) [Google | NoVA Mag | Ylp | Don Rockwell] This is the best sushi place around, period, I don’t know how else to put it. It’s like having a real sushi restaurant of the sort you might find in NYC or LA or heaven forbid Tokyo; I thank Don Rockwell for pointing me here. It compares favorably with the elite places of DC, even though it is in a miserable little strip mall in the crummy (wonderful) part of Falls Church. The doorway is so narrow it is hard to spot, immediately adjacent to some kind of vaping store and directly across the street from Happy Family Chinese restaurant. The main guy involved used to be with Kaz Sushi Bistro when that was a wonderful restaurant. Go, go, go. The funny thing is, I know you still don’t believe me. Related Posts:Kaz Sushi BistroManeki NekoShinwari Namak MandiMum AroiHu Tieu Mi Lacay Cho Lon This entry was posted in Current Favorites, Falls Church/Seven Corners, Sushi, Virginia and tagged Falls Church, Kaz Sushi Bistro, sushi, Takumi. Bookmark the permalink. ← Bad Saint Texas Jack’s → 5 Responses to Takumi Don Rockwell says: 2016/04/14 at 3:53 pm I believe you. 🙂 Matt Thompson says: 2016/04/16 at 9:20 pm As do I. Just went there tonight. Amazing. Amber says: 2016/04/15 at 3:10 pm It’s above-average for sure, but more equivalent to Kotobuki in Palisades. Not seeing why anyone would rave about it. Solid, but no more. mhl says: 2016/04/23 at 7:37 am Street address is wrong – 310 – not 301 (per their website). Nancy says: 2016/04/26 at 12:00 pm The correct address is 310B. 301 is Happy Family Comments are closed."
