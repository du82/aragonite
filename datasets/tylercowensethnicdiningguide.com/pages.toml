full_description = "← Bresca Toosso → Maydan Posted on 2018/01/19 by . Maydan, web site, 1346 Florida Ave NW, Washington, DC, 202-370-3696, dinner only. (Metro Trip Planner – opens in new window) [Zagat | WaPo | Washingtonian | TripAdvisor | City Paper | Ylp] Food from the Caucasus, Georgia, Azerbaijan, Moroccan, and the Middle East. Excellent all around! This is a place to get many of the options, with a group, rather than to see the single stand-out course. It also has the most fun décor of any place I know in DC. Usually I hate places that try to look cool, but this restaurant really does look cool! This is a very nice addition to the local dining scene. It’s in the “I definitely can go back many times” category rather than the “I’ve tried their best dishes and can move on” slot. Not cheap and not a mom and pop, but hey you wanted DC gentrification, didn’t you? Related Posts:SupraTablaWhich ten restaurants would you most want to live next door to?Baku blegFava Pot This entry was posted in Azerbaijan, Caucasus, Current Favorites, DC, Fine Dining, Georgian, Lebanese, Middle Eastern, Moroccan, Turkish, U Street / Shaw and tagged Azerbaijan, Caucasus, Georgian, Maydan, Middle Eastern, Moroccan. Bookmark the permalink. ← Bresca Toosso →"
