full_description = "Category Archives: California San Francisco dining Posted on 2024/03/26 by . Dwarkesh brought me to the very good Sizzling Pot King, 139 8th St, San Francisco, genuine Hunan food and yes I have been to Changsha. Don’t walk there though, take an Uber or better yet a Waymo. Dwarkesh was kind … Continue reading → Posted in California, Chinese, Outside DC | Tagged Guam, Hunan, Marginal Revolution, San Francisco, travel | Comments Off on San Francisco dining Los Angeles dining Posted on 2022/12/09 by . Northern Thai Food Club, 5301 Sunset Blvd. Kao Soi, melon salad, and don’t forget the sour bamboo shoots. The place has only a few tables. Old Sasoon Bakery, Pasadena, 1132 North Allen Avenue, mostly Armenian and some Georgian dishes, won’t … Continue reading → Posted in California, Outside DC | Tagged California, Los Angeles | Comments Off on Los Angeles dining Mayura Posted on 2018/11/05 by . Mayura, web site 1, web site 2, 10406 Venice Blvd, Culver City, Los Angeles, CA, 310-559-9644 [Google | LA Weekly | TripAdvisor | Ylp] I don’t usually think of LA as a splendid place for Indian food, but in fact … Continue reading → Posted in California, Indian, Outside DC, Southern Indian | Tagged biryani, California, Keralan, Los Angeles, Mayura | Comments Off on Mayura San Francisco dining Posted on 2017/01/30 by . Mandalay was the best Burmese food I’ve had, probably ever (NB: I’ve never been to Myanmar). Get the noodle dishes and soups, not the meat-based curries. In the Richmond neighborhood. Angor Borei is very good Cambodian, I enjoyed the pumpkin … Continue reading → Posted in California, Outside DC | Tagged Burmese, Cambodian, San Francisco, thai | Comments Off on San Francisco dining The culinary culture that is San Francisco Posted on 2016/08/10 by . I am all in favor of San Francisco’s $13 per hour minimum wage (which rises to $15 by 2018), plus mandatory paid sick leave, parental leave and employer health care contributions. But labor costs at restaurants are inching past 50 … Continue reading → Posted in California, Economics of Dining, Outside DC | Tagged California, economics of dining, San Francisco | Comments Off on The culinary culture that is San Francisco Los Angeles food bleg Posted on 2014/12/31 by . Where to eat? Probably you can forget the rest, unless you ought to rationally think I do not already know of it. Originally posted on Marginal Revolution – click to see comments and suggestions. Also see the follow-up post here. … Continue reading → Posted in Bleg, Travel, California | Tagged bleg, Los Angeles | Comments Off on Los Angeles food bleg La Ciccia (and some thoughts on role models in universities) Posted on 2014/04/23 by . La Ciccia, web site, 291 30th Street, San Francisco, CA, 415-550-8114 [Zagat | SFGate | Ylp | KQED | Gayot] That is a Sardinian restaurant in San Francisco, and it was my pick from the San Francsico dining bleg from … Continue reading → Posted in California | Tagged California, HsWJSe_3Cyo, kTcv4HyEY3w, La Ciccia, N8xCgC3w1zs, San Francisco, Sardinian | Comments Off on La Ciccia (and some thoughts on role models in universities) I have one dinner in San Francisco Posted on 2014/04/10 by . It should be in a Tyler Cowen sort of place. Probably not in the center of town, but still in SF proper. Where should I go? Thank you for your suggestions. Originally posted on Marginal Revolution – click to see … Continue reading → Posted in Bleg, Travel, California, Outside DC | Tagged food bleg, San Francisco | 1 Comment San Diego food bleg Posted on 2012/12/30 by . Many economists will be converging on this city this coming week for the annual American Economics Association meetings. Please tell us where to eat! San Diego food bleg Originally posted on Marginal Revolution – click to see comments and suggestions. … Continue reading → Posted in Bleg, Travel, California | Tagged San Diego | Comments Off on San Diego food bleg Palm Springs bleg Posted on 2009/01/23 by . I have a few hours