full_description = "← Support your favorite restaurant! Comfort foods make a comeback → Pickles are underrated Posted on 2020/04/05 by . You are going to be running to the refrigerator for snacks anyway, so why not make the most of it? Pickles are cool, fresh, delicious, and just the right size for snacking. At the same time, they are not too delicious, and they are pretty good for you, more so than say chips or candy. They store well too. I have been ordering from Number One Sons (kimchee too, and they deliver in my area), while one very smart reader (Alex R.) recommends Oregon Brineworks, especially the spicy ones. Soon I’ll be turning to books and movies for your lockdown. Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Comfort foods make a comebackMichael Pollan’s “Cooked: A Natural History of Transformation”CeiboAbovegroundMenomale This entry was posted in Eclectic, Favorites - Current, Fermented Food and tagged dc, fermentation, fermented cabbage, fermented foods, lockdown, pickles. Bookmark the permalink. ← Support your favorite restaurant! Comfort foods make a comeback →"
