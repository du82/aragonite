["https://tylercowensethnicdiningguide.com/index.php/six-rules-for-dining-out"]
title = "Six Rules for Dining Out | Tyler Cowen's Ethnic Dining Guide"
full_description = 'Six Rules for Dining Out I’ve been an economist for some 30 years, and a foodie for nearly as long. In this time, I’ve learned that by applying some basic economics to my food choices, I can make nearly every meal count. I’ve also realized that a lot of the best food is cheap. Herewith, a distillation of what I’ve learned about dining out, in six simple rules. In the Fanciest Restaurants, Order What Sounds Least Appetizing Beware the Beautiful, Laughing Women Get Out of the City and Into the Strip Mall Corollary: The food truck is your friend. Side tip: When in Manhattan, choose restaurants on the streets over those on the avenues. Admit What You Don’t Know Exploit Restaurant Workers Quality food is cheaper when cheap labor is available to cook it. In a relatively wealthy country like the United States, cheap labor can be hard to find. We have a high level of labor productivity and a minimum wage; in some cases even illegal immigrants earn more than the legal minimum. But one obvious place to find cheap labor is in family-owned, family-run Asian restaurants. Family members will work in the kitchen or as waiters for relatively little pay, or sometimes no pay at all. Sometimes they’re expected to do the work as part of their contribution to the family. The upshot is that these restaurants tend to offer good food buys. Prefer Vietnamese to Thai Exception: Eat at Thai restaurants attached to motels. Corollary: Prefer Pakistani to Indian. Read the whole thing at “Six Rules for Dining Out: How a frugal economist finds the perfect lunch,” by Tyler Cowen, The Atlantic, May 2012 Related Posts: 3 Responses to Six Rules for Dining Out dixie vereen says: 2016/06/07 at 2:04 pm Check out Clarity restaurant in vienna Reply Skylar Williams says: 2016/10/05 at 10:20 pm I have noticed that family run food joints are much cheaper. When I lived in Washington there were cheap ‘Teriyaki’ restaurants on every corner each ran by a different family. There were huge portions, good quality, and it was relatively cheap. Reply Reed says: 2023/11/30 at 12:13 pm Big foodie in DC proper that loves ethnic food. If you get a chance to try Mr. Chen’s Organic Chinese (Cleveland Park), Purple Patch (Mt. Pleasant), or El Chucho (Columbia Heights) these are some of my favorite restaurants in NW DC. Reply Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
