title = "Thai Taste by Kob | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Jose Andres America Eats Saba → Thai Taste by Kob Posted on 2014/07/31 by . Thai Taste by Kob, FB, 11315 Fern Street, Wheaton, MD, 301-942-0288 (Metro Trip Planner – opens in new window) [Zagat | Washingtonian | Don Rockwell | Ylp] Whole fish in chili sauce A Thai street food place, excellent quality. The whole fish in chili sauce is a must. The soups are very good, try the first one with various kinds of pork, make sure you stir in the condiments (ask for help if need be), the minty stuff, the bean sprouts, the full deal, to get the most out of this dish. The Thai sausage in the Nam Kao is first-rate. The mussamun beef curry and the Chieng Mai noodles with chicken are also very very good dishes, get them. Three happy Thai Taste diners The menu here is huge and I don’t pretend to know it very well, but this is one of the five best Thai places around and on that list it is not the fifth. Definitely recommended for anyone wishing to explore authentic and quality Thai food at extremely reasonable prices. Massaman beef curry Chiang Mai noodles with chicken Related Posts:Southeast ImpressionMum AroiThai TreasureDuangrat’s Oriental Food MartLessons from the Washington, D.C. dining scene This entry was posted in Current Favorites, Maryland, Thai, Wheaton/Kensington and tagged Kob, lx9dVk1T3S4, Nam Kao, thai, Thai Taste, Thai Taste by Kob, Wheaton, whole fish in chili sauce. Bookmark the permalink. ← Jose Andres America Eats Saba →"
