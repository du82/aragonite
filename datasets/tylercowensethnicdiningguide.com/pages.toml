full_description = "← Café Azul – Caracas de Ayer Queen Ammanisa → Marib Posted on 2015/12/25 by . Marib, 6981 Hechinger Drive, Springfield, VA, 703-376-3388, note the larger sign still says “BBQ Delight.” More importantly, this is easier to find than most places in Springfield, easily accessible through Backlick Rd. in Annandale, or 495 or 395. (Metro Trip Planner – opens in new window) [Google | Ylp | Don Rockwell] Marib, Chicken Mandi Very special, the best of the growing number of Yemeni places around. Their saltah, a boiled vegetables dish which sounds awful, is a knockout due to the herbs and flavoring. Chicken mandi has lovely, moist meat with excellent onions on top of the fluffy rice. Marib, foul Foul, lentil soup, layered rice dishes, breakfast dishes, plain old hummus, there are many very good dishes here. I have yet to try the lamb. And like the other Yemeni places around, they have those $40 desserts, bread and stuff soaked in honey, I have yet to try them. Strongly recommended. Marib, saltah Related Posts:Saba restaurantFava PotAl HamraFatoucheHouse of Mandi This entry was posted in Current Favorites, Springfield, Virginia, Yemeni and tagged Chicken mandi, hummus, Marib, saltah, Yemeni. Bookmark the permalink. ← Café Azul – Caracas de Ayer Queen Ammanisa →"
