ot a thing here, and several Sri Lanka residents have confirmed this to me (one … Continue reading → Posted in Sri Lanka, Sri Lankan | Tagged curry, Marginal Revolution, roti, Sri Lanka, Sri Lankan | Comments Off on How to eat well in Sri Lanka Alaska food notes Posted on 2023/04/17 by . There is salmon, halibut, and crab, the latter usually priced at $125 for the meal. The salmon I liked but did not love, so the halibut is the standout order in Anchorage, noting that even fish and chips may cost … Continue reading → Posted in Alaska, Outside DC | Tagged Alaska, crab, fish, salmon | Comments Off on Alaska food notes Singaporean hawker centre in Manhattan Posted on 2023/03/17 by . Urban Hawker, On 135 W.50th, 17 vendors Here is a NYT review, good photos of the key dishes. The Hainanese chicken rice was amazing, worthy of Singapore, get it poached of course. Condiments! The Malaysian lontong was quite good, the … Continue reading → Posted in Food Stands, New York, Singaporean | Tagged Manhattan, Marginal Revolution, NYC, Singaporean | Comments Off on Singaporean hawker centre in Manhattan Jiwa Singapura Posted on 2023/02/16 by . Jiwa Singapura, web site, located inside Tysons Galleria at the mezzanine level by CMX Cinema (above Arhaus Furniture), 1702U The Galleria at Tysons, Floor 3M, McLean, VA 22102, 571-425-4101 (Metro Trip Planner – opens in new window) [Google | Washingtonian … Continue reading → Posted in Fine Dining, Singapore, Singaporean, Vienna/Tysons, Virginia | Tagged black pepper crab, Jiwa Singapura, mackerel fish cake, Marginal Revolution, Nasi Lemak, seafood laksa, Singapore, Singaporean, street food, Tysons | Comments Off on Jiwa Singapura Los Angeles dining Posted on 2022/12/09 by . Northern Thai Food Club, 5301 Sunset Blvd. Kao Soi, melon salad, and don’t forget the sour bamboo shoots. The place has only a few tables. Old Sasoon Bakery, Pasadena, 1132 North Allen Avenue, mostly Armenian and some Georgian dishes, won’t … Continue reading → Posted in