title = "Blue Sand Seafood | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Kogiya, Korean BBQ My longstanding quest for the ideal bibimbap → Blue Sand Seafood Posted on 2013/10/08 by . Blue Sand Seafood, 4231-H Markham Street, Annandale, VA, 703-914-1004 (Metro Trip Planner – opens in new window) [Google] This is now the best Korean place for seafood, especially those spicy stews and soups which hardly anyone likes (but I do). Everything is fresh, and the decor is attractive, yet the place does not lose its mom and pop feel. Note that they have very little besides seafood, so this cannot also serve as a generic Korean place for those who want bul-gogi or bibimbap. Nonetheless I will visit regularly and I can recommend it without hesitation for all who are interested in the basic set of offerings. They also do clams and crab, which I have not yet tried there. Related Posts:9292 Korean BBQBalo KitchenTo Sok JipMr. Tofu House & BBQTo Sok Jib This entry was posted in Annandale, Current Favorites, Korean, Seafood, Virginia and tagged Annandale, BGpdQQqoN2A, Blue Sand, Blue Sand Seafood, Korean, Seafood. Bookmark the permalink. ← Kogiya, Korean BBQ My longstanding quest for the ideal bibimbap → One Response to Blue Sand Seafood Brenda says: 2013/10/24 at 3:11 pm For the past several weeks, my husband and I have been using your dining guide to sample to the amazing array of Korean and other ethnic restaurants in Annandale. It’s sort of sad that we’re usually in the non-Korean minority. We’d like to learn more about the etiquette of eating in various types of ethnic restaurants. We often find that we’ve ordered too much food (though we gobble it up, regardless), or that we’re combining things on our plates that probably seem odd to the wait-staff. Any idea where we can turn for some Korean dining etiquette? Thank you for getting the word out about the wealth of good food right out our doorstep. I wish more of our neighbors would help fill the dining rooms! Comments are closed."
