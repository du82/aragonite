full_description = "← Bayou Bakery Seleme (Seleme Carry Out & Grocery) → Curry Mantra Posted on 2011/05/31 by . Curry Mantra, web site, 9984 Main Street, Fairfax, VA, 703-218-8128. (Metro Trip Planner – opens in new window) [Google | WaPo | zabihah | NoVA Mag | Don Rockwell | Yelp] Most of the food here is north Indian, and it is decent but only somewhat above average. The south Indian dishes are excellent. Get the sevpuri. Get the spicy chicken or the goan fish. All of the daily specials are really quite good and I have made a point of trying them. The chicken and fish are cooked just right in these specials. Right now it is the best dosa around. The buffet is fine but boring. The rest of the menu is fine but boring. This is a good place that intelligent ordering can turn into a great place. It’s best dishes put it in the top half dozen Indian places around. Related Posts:Bengaluru CafeHow to eat well in Sri LankaStreet KitchenChettinadu Indian CuisineCurry Leaf This entry was posted in Indian, Southern Indian, Vienna/Tysons, Virginia and tagged curry, dosa, Goan Fish, goat biryani, Indian buffet, sevpuri, spicy chicken. Bookmark the permalink. ← Bayou Bakery Seleme (Seleme Carry Out & Grocery) →"
