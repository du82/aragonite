full_description = "Tag Archives: Seafood Where and how to eat in Cape Town, South Africa Posted on 2024/06/10 by . Don’t laugh, but basically you want to eat in the restaurants with the beautiful women. And with the views of the waterfront. You may recall those are usually the opposite of the correct recommendations. But in Cape Town, there is … Continue reading → Posted in Outside DC, South Africa | Tagged beautiful women, Seafood, South Africa, travel | Comments Off on Where and how to eat in Cape Town, South Africa Shinwari Namak Mandi Posted on 2024/05/07 by . Shinwari Namak Mandi, web site, FB, 5884 Leesburg Pike, Falls Church, VA, 703-347-8311 (Metro Trip Planner – opens in new window) [Google | RoadTrippers | Restaurant Guru] Yet further evidence that this area’s Pakistani restaurants are better than the Indian … Continue reading → Posted in Falls Church/Seven Corners, Pakistani, Virginia | Tagged bread, Falls Church, fish fry, haleem, Pakistani, Seafood, Shinwari Namak Mandi | Comments Off on Shinwari Namak Mandi Aditi Posted on 2021/06/10 by . Aditi (Aditi Streetside Indian), web site, the new version, same location at 405 Maple Avenue East, Vienna, VA, 703-938-0100 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | Ylp] Aditi has had many incarnations, and many at … Continue reading → Posted in Indian, Vienna/Tysons, Virginia | Tagged Aditi, Aditi Streetside Indian, indian, Malabar fish masala, Seafood, Vienna | Comments Off on Aditi Isabella Eatery Posted on 2018/02/26 by . Isabella Eatery, web site, Tysons II, 2001 International Drive, McLean, VA, 571-489-8505, top floor food court (Metro Trip Planner – opens in new window) [Zagat | WaPo | Washingtonian | TripAdvisor | WTOP | City Paper | NoVA Mag | … Continue reading → Posted in Cocktails, Greek, Italian, Mexican, Seafood, Sushi, Vienna/Tysons, Virginia | Tagged Arroz, burritos, enchiladas, food court, food hall, Graffiato, Isabella Eatery, pasta, Pepina Cantina, pizza, Requin, Seafood,