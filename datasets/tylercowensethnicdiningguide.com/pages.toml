title = "“But we just had Indian food yesterday!” | Tyler Cowen's Ethnic Dining Guide"
full_description = "← My longstanding quest for the ideal bibimbap Aladdin → “But we just had Indian food yesterday!” Posted on 2013/10/16 by . I’ve never understood this argument, which is sometimes cited as a reason to go to a non-Indian restaurant on a given day. How should people cope who live in India? They have Indian food many, many days in a row, and often (not always, by any means) poorer Indians are choosing from a less varied menu of that food than Americans who visit Indian restaurants. Would it be so terrible to eat only Indian food, whether at home or in restaurants, every day for a week? Every day for a month? I don”t see why. So how about two days in a row? Or two meals in a row? Three? What if you had Indo-Chinese food somewhere in the middle of the sequence? Momos cooked by Nepalese immigrants? Until a group meal yesterday, I had Korean food five days in a row, three meals a day, much to my joy. I bet some Koreans, in Korea, did the same. Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts: This entry was posted in General remarks. Bookmark the permalink. ← My longstanding quest for the ideal bibimbap Aladdin →"
