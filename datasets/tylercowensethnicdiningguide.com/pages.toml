title = "Isabella Eatery | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Bistro Aracosia The decline of German food in America → Isabella Eatery Posted on 2018/02/26 by . Isabella Eatery, web site, Tysons II, 2001 International Drive, McLean, VA, 571-489-8505, top floor food court (Metro Trip Planner – opens in new window) [Zagat | WaPo | Washingtonian | TripAdvisor | WTOP | City Paper | NoVA Mag | NYT | Ylp] They have branches of Arroz, Requin, Graffiato, Yona, and Pepina Cantina, among other places, but in general don’t compare those to the original home bases, the menus have few similarities. Overall, I’ve been surprised how fun this set-up is. Tysons II just isn’t so crowded, so at most hours you have the area’s best food court almost entirely to yourself. Go to two or three places, ordering small dishes along the way, and finish with chocolate ice cream. It offers nice spaces to sit and chat, and somehow vaguely reminds me of Singapore, albeit with much Asian food. I enjoyed everything I sampled (five visits, multiple plates each time), maybe the pastas in Graffiato have been my favorite but this is more about the experience than the single killer dish. The catch? It’s just not that cheap. Still, this will remain an impressive achievement until either the crowds pour in, it goes out of business, or maybe a bit of both. Related Posts:Where and how to eat in Cape Town, South AfricaShinwari Namak MandiAditiTimber Pizza Co.All-Purpose Pizza This entry was posted in Cocktails, Greek, Italian, Mexican, Seafood, Sushi, Vienna/Tysons, Virginia and tagged Arroz, burritos, enchiladas, food court, food hall, Graffiato, Isabella Eatery, pasta, Pepina Cantina, pizza, Requin, Seafood, sushi, tapas, The Block, tortillas, Yona. Bookmark the permalink. ← Bistro Aracosia The decline of German food in America →"
