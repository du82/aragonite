ere is one bit: And then there is the spread of the Michelin brand. There are now Michelin guides for many US cities, which has caused the brand to lose some … Continue reading → Posted in Economics of Dining, Fine Dining, General remarks, Overrated | Tagged economics of dining, Marginal Revolution, Michelin | Comments Off on The decline of Michelin-starred restaurants The economics of why Noma is closing Posted on 2023/01/12 by . Here is the take of yours truly: Tyler Cowen, a professor of economics at George Mason University in Fairfax, Va., and a devoted restaurant-goer, says that people are misinterpreting Redzepi’s intentions with the closure. Cowen doesn’t think the chef is … Continue reading → Posted in An Economist Gets Lunch, Chicken, Economics of Dining, Fine Dining | Tagged chicken, David Chang, Denmark, Marginal Revolution, Noma, Redzepi | Comments Off on The economics of why Noma is closing The New Top Chef Posted on 2021/10/07 by . During the pandemic a pasta restaurant launched on UberEats in Paris. Cala quickly attracted a top 1% rating for it’s high quality to price ratio. Only now has it been revealed that the chef is a robot. “We wanted to … Continue reading → Posted in Economics of Dining, France, Outside DC, Robots | Tagged Marginal Revolution, robots | Comments Off on The New Top Chef “You have to order all at once” Posted on 2021/03/14 by . Boia De, web site, 5205 NE 2nd Ave Miami, FL 33137 [Trip Advisor | 4 CBS | Ylp] Lung Yai Thai Tapas, web site 1, web site 2, 1731 SW 8th St, Miami, FL 33135 [Trip Advisor | Ylp | … Continue reading → Posted in Economics of Dining, Florida | Tagged Boia De, economics of dining, Florida, Lung Yai Thai Tapas, Miami | Comments Off on “You have to order all at once” Delivery service price cap regulations Posted on 2020/06/15 by . Ben emails me: Could you please consider and comment on some of the unseen consequences of local price caps on restaurant delivery services? (Politico article describing the phenomenon 