full_description = "← Ambar A safety net we all can stand behind → Indigo Posted on 2017/05/06 by . Indigo, web site, 243 K St NE, Washington, DC, 202-544-4777, the hours can vary on weekends so do check. (Metro Trip Planner – opens in new window) [WaPo | Washingtonian | TripAdvisor | City Paper | Michelin Guide | Ylp] Gujarati food, really! This is probably the most neglected Indian restaurant around, and you don’t even have to go to the suburbs. Everything here tastes real. Do you know that kind of Indian place where the spices taste a little grainy because they haven’t been ground fully to a smooth blend? That is this place. Recommended, and badly needed as well. Related Posts:Chit Chaat CaféAnandaPunjabi by NatureBengaluru CafeChaatwala This entry was posted in DC, H Street NE, Indian, Northeast and tagged Gujarati, H Street NE, indian, Indigo, Punjabi. Bookmark the permalink. ← Ambar A safety net we all can stand behind → 2 Responses to Indigo Simul Parikh says: 2017/05/06 at 3:18 pm Tyler, The owners are Punjabi, there is Punjabi’s Bar inside and the food is all North Indian. There is almost zero Gujarati food on the menu (I’d know- I’m Gujarati and took my Gujarati parents there. Goat curry, biryani, chicken tolls masala, items with saag, keema are not at all Gujarati. Wish we had a restaurant like that here. I do agree that it’s delicious. Mike says: 2017/05/10 at 4:49 pm Soon to open a second location in Brookland. Comments are closed."
