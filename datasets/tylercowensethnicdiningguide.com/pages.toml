full_description = "← Sichuan Legend Hot Pot San Francisco dining → Mum Aroi Posted on 2024/02/18 by , Mum Aroi, web site, 5892 Leesburg Pike, Falls Church, VA (Baileys Crossroads area), 703-671-4222 (Metro Trip Planner – opens in new window) [Google | Restaurantji | Annandale Today] This place has the same chef as the former Duangrat’s Oriental Food Mart, now relabeled Thai Value, and is right next door. But now it is also a proper sit-down restaurant, but they kept the food true to its earlier mom and pop roots. Could it be overall the most authentic Thai food around? In any case it sits in the top tier of local NoVa restaurants. The Nam Khao is excellent, as are the “dumplings” (they’re not, get them anyway and use the dipping sauce), and just a powerful restaurant all around, with Thai Noodle soups as well. Definitely recommended. Related Posts:Thai TreasureEsaan CuisineThai FoodShinwari Namak MandiSoutheast Impression This entry was posted in Falls Church/Seven Corners, Thai, Virginia and tagged Bailey's Crossroads, dumplings, Falls Church, Mum Aroi, Nam Khao, thai, Thai Food, Thai Noodle soup. Bookmark the permalink. ← Sichuan Legend Hot Pot San Francisco dining →"
