full_description = "← Chercher Ethiopian Restaurant and Mart Haifa Grill → To Sok Jip Posted on 2016/11/23 by . To Sok Jip, web site, 7211 Columbia Pike, Annandale, VA, 703-333-2861 (Metro Trip Planner – opens in new window) [WaPo | TripAdvisor | Ylp] (Previously reviewed in 2009 and 2006.) This is now clearly the best Korean place around. The broiled fish and the bibim bap are better than in any of the competitors. Everything here just tastes better, the vegetables too. Mostly soups, stews, and noodles, no barbecue or porridge. Quite small, very mom and pop. The lines start early, and they don’t take reservations, nonetheless I would say that half of your Annandale visits should involve eating at this place. Related Posts:To Sok JibTo Sok JibEvergreen Korean Cuisine, or Sang Rok Soo9292 Korean BBQBalo Kitchen This entry was posted in Annandale, Korean, Virginia and tagged Annandale, bibim-bap, bibimbap, broiled fish, Korean, To Sok Jib, To Sok Jip. Bookmark the permalink. ← Chercher Ethiopian Restaurant and Mart Haifa Grill →"
