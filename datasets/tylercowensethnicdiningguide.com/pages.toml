full_description = "← Joon Nue Elegantly Vietnamese → Truong Tien Posted on 2023/11/12 by . Truong Tien, web site, 6763 Wilson Blvd., Falls Church, VA, Eden Center, inside the mall, the back end far from the road, 703-216-2868 (Metro Trip Planner – opens in new window) [Google | WaPo | Reddit] The best Vietnamese place around right now (Nov. 2023). Everything seems to be quite good, many Hue dishes as well. Get the little scoopy things that you dip in a sauce. Good Seven Courses of Beef, a smaller version. Good pho. It’s just better than the other places, and somehow it reminds me more of the Westminster Vietnamese places in Orange County, CA. Note it is small and fills up early. Let us hope this harkens the end of “the great stagnation” in Vietnamese restaurants in northern Virginia. Related Posts:Pho Ga VangPhung HoangHu Tieu Mi Lacay Cho LonPho Tu EchBanh Cuon Thang Long This entry was posted in Current Favorites, Eden Center, Falls Church/Seven Corners, Vietnamese, Virginia and tagged Eden Center, Hue, Pho, Seven Courses of Beef, Truong Tien, Vietnamese. Bookmark the permalink. ← Joon Nue Elegantly Vietnamese →"
