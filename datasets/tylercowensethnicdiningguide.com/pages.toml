full_description = "Category Archives: Chinese ← Older posts Peter Chang MacLean Posted on 2024/09/03 by . Peter Chang MacLean, web site, 6715 Lowell Ave., McLean, VA, 571-405-6686 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | FFX Now | Reddit | Restaurantji | NoVA Mag] This is probably the second best of the … Continue reading → Posted in Chicken, Chinese, Favorites - Current, McLean, Virginia | Tagged Amish chicken, Amish pork, beef, chicken, Chinese, McLean, Peter Chang, Peter Chang MacLean, pork | Leave a comment San Francisco dining Posted on 2024/03/26 by . Dwarkesh brought me to the very good Sizzling Pot King, 139 8th St, San Francisco, genuine Hunan food and yes I have been to Changsha. Don’t walk there though, take an Uber or better yet a Waymo. Dwarkesh was kind … Continue reading → Posted in California, Chinese, Outside DC | Tagged Guam, Hunan, Marginal Revolution, San Francisco, travel | Comments Off on San Francisco dining Sichuan Legend Hot Pot Posted on 2024/01/20 by , Sichuan Legend Hot Pot, web site, 9992 Main St., Fairfax, VA, 703-865-7773, 571-536-7780, closed Tuesday (Metro Trip Planner – opens in new window) [Google | Restaurant Guru] I don’t love most hot pot but the core Sichuan dishes here are … Continue reading → Posted in Chinese, Fairfax, Virginia | Tagged Chengdu, cumin fish, favorites, hot pot, ma po tofu, Sichuan, Sichuan hot pot, Sichuan Legend Hot Pot | Comments Off on Sichuan Legend Hot Pot What could be more self-recommending than this? Posted on 2023/07/03 by . Fuchsia Dunlop, Invitation to a Banquet: The Story of Chinese Food. Due out in November. Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:*The Food of Sichuan,* by Fuchsia DunlopPeter Chang MacLeanShi Miaodao Yunnan Rice … Continue reading → Posted in Books, Chinese | Tagged book, Chinese, Fuchsia Dunlop | Comments Off on What could be more self-recommending than this? Le Wei Peter Zhang Posted on 2022/11/02 by . Le Wei Peter Zhang, web site, 10728 Fairfax Blvd Fairfax, VA 22030 (Metro Trip Planner – opens in new window) [Google] If you want to open a new Peter Chang restaurant in Fairfax, but not quite tell people it is … Continue reading → Posted in Chinese, Fairfax, Virginia | Tagged Fairfax, Le Wei, Le Wei Peter Zhang, Peter Chang, Peter Zhang | 1 Comment Shi Miaodao Yunnan Rice Noodle Posted on 2022/03/06 by . Shi Miaodao Yunnan Rice Noodle, 819 Hungerford Drive, Rockville, MD, 240-386-8596 (Metro Trip Planner – opens in new window) [Google | WaPo | Rest Guru] Small, very mom and pop, though actually part of a much broader chain. This is … Continue reading → Posted in Chinese, Maryland, Rockville/Gaithersburg | Tagged Chinese, mom and pop, Rockville, Shi Miaodao Yunnan Rice Noodle, soup, Yunnan soup | Comments Off on Shi Miaodao Yunnan Rice Noodle Cafe China – NYC Posted on 2022/02/17 by . Cafe China, web site, 59 W.37th St. NY, NY, 212-213-2810 [Google | NYMag | TripAdvisor | Ylp] Recently opened, still in “soft launch” phase. Sichuan, but fragrant rather than “knock your socks off hot.” The smoked tofu is amazing, the … Continue reading → Posted in Chinese, New York, Outside DC | Tagged Beef with green chili, Cafe China, Chinese, NYC, Sichuan, smoked tofu, tofu | Comments Off on Cafe China – NYC Yanzi Noodle House and Taiwan Style Posted on 2022/02/13 by . Yanzi Noodle House and Taiwan Style, web site, 10955 Fairfax Blvd, Suite 108, Fairfax, VA (between T-Mobile and Red Wing), 301-777-8888 (Metro Trip Planner – opens in new window) [WaPo | Reddit | Ylp] They moved from Rockville, MD. One … Continue reading → Posted in Chinese, Fairfax, Some Places You Must Try, Virginia | Tagged Chinese, Fairfax, Guangxi, luosifen, noodle soups, recommended, Yanzi Noodle House, Yanzi Noodle House and Taiwan Style | 3 Comments Yu Noodles, Fairfax Posted on 2020/12/24 by . Yu Noodles, Fairfax, web site, 11217-C Lee Highway, Fairfax, VA, 703-877-0818, in the same strip mall as Nan