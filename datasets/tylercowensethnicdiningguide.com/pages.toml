full_description = "← House of Biryani Bar Shu and Hot Stuff – London → Cheogajip Chicken Posted on 2007/05/07 by . Cheogajip Chicken, Lotte Plaza, near the deli in the supermarket, 3250 Old Lee Highway, Fairfax Circle, Fairfax, VA, 703-273-4499, usually open. (Metro Trip Planner – opens in new window) [WaPo also see this | Washington Area Korean Restaurant Guide] This in the same place as Tian Chinese Restaurant. See also “Koreans Share Their Secret for Chicken With a Crunch,” by Julia Moskin, The New York Times, February 7, 2007 This location is inside Lotte Plaza, 3250 Old Lee Highway, which is located just west of the intersection of Old Lee Highway and Old Pickett Road. The counter is about 30 feet south of the Customer Service desk and next to the deli. Other locations: in the Korean Mini Mall at 13814 Braddock Rd, Centreville, VA; and 4300 Evergreen Lane Suite 102, Annandale, VA. Korean fried chicken comes to this area, finally. Very moist and juicy and they cook it fresh, that means a 15-minute wait. This isn’t the very best Korean fried chicken I’ve had, but the idea is a phenomenon and if you haven’t had it before, do give it a try. It comes in regular, sweet, spicy, and herb, so far I’ve only tried the sweet. From the company web site: Cheogajip Chicken is one of Korea’s largest chicken franchise with 1,200 franchises in Korea. Cheogajip Chicken has been loved by everyone for its classic, mouthwatering taste, which was developed through 17 years of experience. Cheogajip USA was established in March of 2005 and opened its first restaurant in Annandale, Virginia in October 2005. Soon after, in March 2006, a second restaurant was opened in Centreville, Virginia, followed by a third in Flushing, New York in April 2006. In order to reach more customers, we are planning to expand with more restaurants throughout the East Coast this year and in the earlier part of 2007, we will spread out to the West Coast starting with Los Angeles. Related Posts: This entry was posted in Annandale, Centreville/Manassas, Chicken, Fairfax, Korean, Virginia. Bookmark the permalink. ← House of Biryani Bar Shu and Hot Stuff – London → 7 Responses to Cheogajip Chicken Jason says: 2007/12/29 at 6:40 pm Unfortunately the Cheogajip Chicken in Lotte Plaza in Fairfax Circle is closed, a shame since they gave the largest portions. In any case, the locations in Annandale and Centerville are still around and serving pizza to boot. love the site, Jason Wendy says: 2008/03/02 at 1:11 pm I never tried this place before but there is one just opened in Super H Mart grocery store (in fairfax, route50, opposite to St. Paul IX high school). Also, the noodle place in the grocery store is excellent as well. With pictures so you know what you are ordering. Yummy. Lori Goode says: 2009/01/27 at 1:58 pm The Korean chicken producer in Super H Mart is NOT Cheogajip Chicken. It is in fact ToreOre Chicken & Joy. From what I’ve found, that brand has paired up with Super H Marts around the country. http://chilibobshoustoneats.blogspot.com/2008/08/toreore-chicken-n-joy.html The spicy sauce is definitely in Buffalo wing territory. You can’t get much relief … but oh so addictive! Nicole says: 2009/12/06 at 7:50 pm Went to the Annandale location for dinner today, and it was really fantastic. The texture of the coating really is an incredible phenomenon. Having the chicken freshly made really makes a difference too, and the sauces have a uniquely Korean flavor that is fantastic. This will probably be my new favorite guilty pleasure. Lovely service too– we received profuse apologies for the food being late (which it wasn’t, that I noticed), offers of refills for the salad and radish that come on the side, and extra chicken. It should be noted that the spicy sauce is NOT for the timid. Daniel S. says: 2009/12/07 at 5:01 pm My sister told me about this, and when I heard it was called “Chicken Pizza Love Letter” I couldn’t resist. The chicken was actually great, we got the spicy chicken which was actually really really spicy, but I am also a bit of a wimp nowadays when it comes to spicy food. I am definitely going back soon and would recommend it. Pingback: Tyler Cowen's Ethnic Dining Guide » Blog Archive » Tian Chinese Restaurant - All food is ethnic food. Pingback: Where is that perfect little French bistro hiding? - Northern Virginia - Virginia (VA) - Page 7 - City-Data Forum Comments are closed."
