full_description = "← Chennai bleg San Diego food bleg → Turmeric Posted on 2012/12/27 by . Turmeric, web site, 405 Maple Avenue East, Vienna, VA, 703-938-0100 (Metro Trip Planner – opens in new window) [Google | WaPo | Washingtonian | Yelp | Gayot] One of Virginia’s best Indian restaurants. The buffet is well above average, even with a good biryani and on the buffet at that. They have a decent number of regional dishes, including from Goa and Kerala. Consistent all around. This isn’t one of the best two or three Indian places around, but it’s just below that and nipping at their heels. Vienna has been needing a place like this. Good lassis too. Nice atmosphere rather than a dump. Related Posts:Chit Chaat CaféAditiDining out in KarachiPunjabi by NatureBawarchi This entry was posted in Indian, The Best, Vienna/Tysons, Virginia and tagged biryani, Goa, Goan, indian, Indian buffet, Kerala, lassi, Turmeric, Vienna. Bookmark the permalink. ← Chennai bleg San Diego food bleg →"
