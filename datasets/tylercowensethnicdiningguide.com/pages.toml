full_description = "Category Archives: An Economist Gets Lunch ← Older posts The economics of why Noma is closing Posted on 2023/01/12 by . Here is the take of yours truly: Tyler Cowen, a professor of economics at George Mason University in Fairfax, Va., and a devoted restaurant-goer, says that people are misinterpreting Redzepi’s intentions with the closure. Cowen doesn’t think the chef is … Continue reading → Posted in An Economist Gets Lunch, Chicken, Economics of Dining, Fine Dining | Tagged chicken, David Chang, Denmark, Marginal Revolution, Noma, Redzepi | Comments Off on The economics of why Noma is closing Dining out as cultural trade Posted on 2019/07/02 by . By Joel Waldfogel, here is the abstract: Perceptions of Anglo-American dominance in movie and music trade motivate restrictions on cultural trade. Yet, the market for another cultural good, food at restaurants, is roughly ten times larger than the markets for … Continue reading → Posted in An Economist Gets Lunch, Economics of Dining | Tagged economics of dining, Joel Waldfogel, trade | Comments Off on Dining out as cultural trade Do land use restrictions increase restaurant quality and diversity? Posted on 2019/02/09 by . Daniel Shoag and Stan Veuger say yes, but I am not so convinced. It turns out that metrics of land use restrictions are correlated with restaurant quality, across cities. To cut to the chase, Los Angeles ranks number one on … Continue reading → Posted in An Economist Gets Lunch, Economics of Dining, Strip Malls for Food | Tagged An Economist Gets Lunch, economics of dining, zoning | Comments Off on Do land use restrictions increase restaurant quality and diversity? Lines are overrated, and totally empty restaurants are underrated Posted on 2013/10/21 by . Some readers (or journalists) ask me if I have further principles for finding good food which are not outlined in my ethnic dining guide or in An Economist Gets Lunch. Of course I do, though many of them are not … Continue reading → Posted in An Economist Gets Lunch, General remarks, General Tips | Tagged Afghan, Haitian, Pakistani, x0dmZj3G214 | Comments Off on Lines are overrated, and totally empty restaurants are underrated My talk at Arlington Public Library, April 3, 2013 Posted on 2013/03/20 by . The talk is available on YouTube: WEDNESDAY, APRIL 3, 2013 6:00 pm – Food Trucks Open for Business 7:00 pm – Lecture, Q&A with the Author Arlington Public Library, 1015 North Quincy Street, Arlington, VA 22201 (Metro Trip Planner) RSVP … Continue reading → Posted in An Economist Gets Lunch, Arlington, Food Trucks/Street Vendors, Virginia | Tagged An Economist Gets Lunch, Arlington Public Library, event, talk | Comments Off on My talk at Arlington Public Library, April 3, 2013 I answer food questions over at Freakonomics Posted on 2012/06/28 by . I liked the whole interview, here is the concluding segment: Q. What restaurant or food type would Tyler Cowen, Murray Rothbard and Ludwig von Mises enjoy for lunch? Why? -Bill N. A. Rothbard was quite a conservative eater, but he … Continue reading → Posted in An Economist Gets Lunch, Books | Tagged An Economist Gets Lunch, freakonomics, Ludwig von Mises, Murray Rothbard, Wiener Schnitzel | Comments Off on I answer food questions over at Freakonomics How to find good food in American bars Posted on 2012/05/22 by . Jacob Grier has an excellent post on this topic (which I do not cover), here is just one part of a longer discussion: Reading An Economist Gets Lunch inspired me to think explicitly about how to find good food in … Continue reading → Posted in An Economist Gets Lunch, Bars | Tagged American Bars, An Economist Gets Lunch, bar, bars, batavia arrack, genever, herbal liqueurs, Italian amari, Jacob Grier, liqueurs | Comments Off on How to find good food in American bars Food Rules! Posted on 2012/05/19 by . So how did American food fall to the depths of 1960? In Cowen’s view, it wasn’t the doing of greedy agribusiness in league with the Mad Men. Three great tsunamis wrecked the American palate: Prohibition, the Emergency Quota Act of … Continue reading → Posted in An Economist Gets Lunch, Books | Tagged An Economist Gets Lunch, Emergency Quota Act of 1921, empire of children, Jerry Weinberger, Prohibition | Comments Off on Food Rules! Scaling the Great Wall Posted on 2012/05/17 by . Great Wall Supermarket, web site, 2982 Gallows Road, Falls Church, VA, 703-208-3320 (Metro Trip Planner – opens in new window) [Patch | Yahoo Local | Yelp] Here is my essay from Washingtonian magazine, adapted from An Economist Gets Lunch, about … Continue reading → Posted in An Economist Gets Lunch, Books, Fairfax, Food Stores, Virginia | Tagged An Economist Gets Lunch, Falls Church, Great Wall, Great Wall Supermarket, live animals | Comments Off on Scaling the Great Wall The Independent on “An Economist Gets Lunch” Posted on 2012/05/11 by . The review is here, by Will Dean, the summary is here: If you’re interested in how the food and restaurant industries work – and how to exploit those factors for your own good – then Cowen’s work is indispensable. And: … Continue reading → Posted in An Economist Gets Lunch, Books | Tagged An Economist Gets Lunch, Will Dean | Comments Off on The Independent on “An Economist Gets Lunch” ← Older posts"
