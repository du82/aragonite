full_description = "Category Archives: McLean ← Older posts Peter Chang MacLean Posted on 2024/09/03 by . Peter Chang MacLean, web site, 6715 Lowell Ave., McLean, VA, 571-405-6686 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | FFX Now | Reddit | Restaurantji | NoVA Mag] This is probably the second best of the … Continue reading → Posted in Chicken, Chinese, Favorites - Current, McLean, Virginia | Tagged Amish chicken, Amish pork, beef, chicken, Chinese, McLean, Peter Chang, Peter Chang MacLean, pork | Leave a comment Will Covid-19 expose the ghost firms? Posted on 2020/05/19 by . That is the topic of my latest Bloomberg column, here is one excerpt: Demand for in-restaurant dining is likely to fall as well, though estimates vary. Since the average small business carries less than a month’s worth of liquid reserves, … Continue reading → Posted in Alexandria, Annandale, Arlington, Bailey's Crossroads, Centreville/Manassas, Crystal City/Pentagon City/National Airport, Economics of Dining, Eden Center, Fairfax, Falls Church/Seven Corners, Herndon/Reston/Ashburn/Chantilly / Dulles Airport, Leesburg/Winchester, McLean, Merrifield / Mosaic, Springfield, Vienna/Tysons, Virginia | Tagged Coronavirus, COVID-19, economics of dining, ethnic restaurants, ghost restaurants, mom and pop, Northern Virginia | Comments Off on Will Covid-19 expose the ghost firms? Fahrenheit Posted on 2018/11/11 by . Fahrenheit, web site, 1313 Dolley Madison Blvd., you have to enter on Beverly, McLean, VA, 703-646-8968 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | Ylp] How come no one reviews this place? The menu is limited, … Continue reading → Posted in Chinese, McLean, The Best, Virginia | Tagged Ants on a Tree, Chinese, Fahrenheit, kung pao chicken, Sichuan, Szechuan | 2 Comments Asian Origin Posted on 2018/06/17 by . Asian Origin, web site, 1753 Pinnacle Drive, McLean, VA, very close to Tysons II, 703-448-9988 (Metro Trip Planner – opens in new window) [Don