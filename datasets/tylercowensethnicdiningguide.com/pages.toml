full_description = "← Chloe Himitsu → Ananda Posted on 2019/01/13 by . Ananda, web site, 7421 Maple Lawn Blvd., Fulton, MD, 301-725-4800. Hard to get to, but it is there! (Metro Trip Planner – opens in new window) [Google | Washingtonian | TripAdvisor | Baltimore Sun | Baltimore Mag | Ylp] Right now this is the best Indian place around, period. Broadly Punjabi, not at all a spice fest. Super high quality ingredients, vegetables, cooking. Consistent. Occasional Chesapeake connections, such as through crab and crab cake. The best mango lassi I’ve had in the United States, ever. Note the décor is…strange. It feels like the building is a reclaimed mansion house of some kind, the dining rooms are spacious, there are fireplaces, and…there is somebody’s idea of an alternate universe I would gladly spend a lot more time in. Related Posts:Chit Chaat CaféPunjabi by NatureIndigoBengaluru CafeChaatwala This entry was posted in Columbia/Laurel, Current Favorites, Favorites - Current, Indian, Maryland and tagged Ananda, crab cake, indian, mango lassi, Punjabi. Bookmark the permalink. ← Chloe Himitsu →"
