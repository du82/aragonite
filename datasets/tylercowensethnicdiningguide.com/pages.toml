["https://tylercowensethnicdiningguide.com/index.php/currently-what-are-you-favorite-places-to-eat-in-the-d-c-metro-area"]
title = "Currently, what are you favorite places to eat in the D.C. metro area? | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Teddy’s Roti Shop Caribbean Sea Seafood Restaurant → Currently, what are you favorite places to eat in the D.C. metro area? Posted on 2008/10/17 by . I love Thai X-ing (DC), Meaza (Baileys Crossroad), Nava Thai (Wheaton), Hong Kong Palace (Falls Church), China Star (Fairfax), Bombay Indian (Silver Spring) and Angeethi (Herndon), plus just about everything Vietnamese in Eden Center (Falls Church). The 9th Street Ethiopian row is very good as well, and also Zenebech, up on Florida/U/5th or so. Those places are very good and I can eat at them more or less without limit. There aren’t many places around as good as those. Here is much more: “Chewing the Fat: Tyler Cowen and his Ethnic Dining Guide,” by Alicia Mazzara, DCist, October 8, 2008 Related Posts: This entry was posted in Favorites - Current, Some Places You Must Try. Bookmark the permalink. ← Teddy’s Roti Shop Caribbean Sea Seafood Restaurant → 2 Responses to Currently, what are you favorite places to eat in the D.C. metro area? Kiril says: 2008/10/20 at 11:57 am It’s a bit out there, but Rainbow African (Ghanaian) Restaurant in Gaithersburg is fantastic. I am no expert on Ghanaian cuisine, but went with some Ghanaians as well as Americans who have lived there, and they all assured me the food was dead on. And, of course, it tasted delicious, which was all I needed to know. foodlove says: 2008/11/05 at 10:14 pm We love food, but don’t believe it has to be fancy at all. So, we love Charcoal Kabob in Herndon, VA… the place has seriously authentic Pakistani food… try Haleem and Nehari. Also love Afghan Restaurant in Arlington, VA (almost across from Potomac Yard)… try their Quabili Palau and Chapli Kabob. Cantler’s in Annapolis, MD for steamed crab. Amicci’s in “Little Italy” of Baltimore, MD… try its Pane Rotondo and Scampi Fla Diabolo. Oh… can we add something for NYC? Nobu 57 on 57th St. and Payard for pastries!!! Comments are closed."
