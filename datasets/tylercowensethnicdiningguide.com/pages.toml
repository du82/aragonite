full_description = '← Why do the servers always want to take our cutlery and plates and glasses away? Is Indian food the world’s best? → Peter Chang MacLean Posted on 2024/09/03 by . Peter Chang MacLean, web site, 6715 Lowell Ave., McLean, VA, 571-405-6686 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | FFX Now | Reddit | Restaurantji | NoVA Mag] This is probably the second best of the Chang restaurants right now? I won’t go through the full Chang litany, but yes they do have most of the classic dishes here, cauliflower included. They also have the green chili fish, which is not always on the menu at Mama Chang proper. But the real treat here is the pork, which is from Amish farms. These are the best pork dishes in any local Chinese restaurant right now. The Twice Cooked Pork is especially fine. And get the beef with crispy rice with green chilies, again one of the best Chinese dishes around at the moment. Related Posts:Mama ChangAsian OriginQ by Peter ChangWhat could be more self-recommending than this?The economics of why Noma is closing This entry was posted in Chicken, Chinese, Favorites - Current, McLean, Virginia and tagged Amish chicken, Amish pork, beef, chicken, Chinese, McLean, Peter Chang, Peter Chang MacLean, pork. Bookmark the permalink. ← Why do the servers always want to take our cutlery and plates and glasses away? Is Indian food the world’s best? → Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
