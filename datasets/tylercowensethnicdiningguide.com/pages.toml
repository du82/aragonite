title = "Chez Manelle | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Enat Restaurant Strategic food attack at functions → Chez Manelle Posted on 2010/09/26 by . Chez Manelle, web site, 2313 Wilson Blvd, Arlington, VA, 703-522-2141, near Courthouse Metro. (Metro Trip Planner – opens in new window) [WaPo | Washingtonian | Examiner | Yelp] Everything here tastes real at this Tunisian place, from the French fries to the eggplant to the sausage. It’s exactly the kind of place we need more of, namely a reasonably priced restaurant that makes its way through good ingredients. They don’t have many seats, so make sure you come at the right time or have a reservation. Definitely recommended, better than I thought it was going to be from the outside, the location, or the menu. Since it is very close to Me Jana, we can now consider that mini-region to be the area’s epicenter for MENA food. Related Posts:Bistro AracosiaAfghan BistroCurry Leaf This entry was posted in Arlington, Tunisian, Turkish, Virginia and tagged eggplant, French fries, MENA, reasonably priced. Bookmark the permalink. ← Enat Restaurant Strategic food attack at functions → 2 Responses to Chez Manelle Bob says: 2011/01/10 at 3:27 pm Tried this place in December. It’s as described. We found it mildly interesting, but I’m not sure we are likely to return often. Nothing wrong, but the food wasn’t interesting enough. One dish was a kind of bread and garbanzo combination. It was unusual and pleasant enough. Tunisian comfort food? Maybe we didn’t order the right things. What do we know about Tunisian food? The place was comfortable and service was okay. LKrishnan says: 2011/09/06 at 1:44 pm Went here during the early days of the restaurant’s initial management. The food was lovely, filling and homey. The brik alone was reason to return. Service was on the leisurely side, but that’s something I expect and even desire in a good Middle Eastern or African restaurant. It’s a sign of hospitality in those regions to allow time for conversation and digestion. Now the management’s changed, the menu’s changed a bit and the execution needs work. As yet to be seen if the new management can correct these issues. Comments are closed."
