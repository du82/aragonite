full_description = "← Mum Aroi Rules for Tri-State Italian food → San Francisco dining Posted on 2024/03/26 by . Dwarkesh brought me to the very good Sizzling Pot King, 139 8th St, San Francisco, genuine Hunan food and yes I have been to Changsha. Don’t walk there though, take an Uber or better yet a Waymo. Dwarkesh was kind enough to call me one for the trip back to the hotel. When I asked for jazz music, I was shocked to hear a very high quality Bill Evans trio cut, not some popular slop. The Guam restaurant on Mission — Prubechu — is quite interesting and serves largely the indigenous Chamorro food. It is rare that I have the chance to try an altogether new cuisine, in any case I would eat there again. San Francisco dining Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Why do the servers always want to take our cutlery and plates and glasses away?Where and how to eat in Cape Town, South AfricaRules for Tri-State Italian food“Around since xxxx”How to eat well in Sri Lanka This entry was posted in California, Chinese, Outside DC and tagged Guam, Hunan, Marginal Revolution, San Francisco, travel. Bookmark the permalink. ← Mum Aroi Rules for Tri-State Italian food →"
