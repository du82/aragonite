full_description = "← Menomale Bresca → Punjabi by Nature Posted on 2018/01/12 by . Punjabi by Nature, web site, 2750 Gallows Road, Vienna, VA, 571-489-8500, also 19405 Promenade Drive, Leesburg, and a branch with a smaller menu in Lotte Plaza in Chantilly (13955 MetroTech Drive, Chantilly, VA). (Metro Trip Planner – opens in new window) [WaPo | TripAdvisor | zabihah | Ylp] One of the less-reported stories is the hollowing out of central northern Virginia for really good Indian food; these days it is mostly out by Dulles. But Punjabi by Nature is well above average. The main branch in Vienna has excellent vegetarian dishes, and most of all get their three chicken specials, marked as chef’s specialties on the menu, some of them having a Punjabi twist. The branch in Chantilly has a more regional menu, is more of a mom and pop, maybe preferable for me but they are both good if not quite the answer to my pleas. Related Posts:Chit Chaat CaféAditiAnandaIndigoBawarchi This entry was posted in Herndon/Reston/Ashburn/Chantilly / Dulles Airport, Indian, Leesburg/Winchester, Vienna/Tysons, Virginia and tagged Chantilly, indian, Leesburg, Punjabi, Punjabi by Nature, Vienna. Bookmark the permalink. ← Menomale Bresca →"
