full_description = "← Thai Taste by Kob Tanpopo Ramen House → Saba Posted on 2014/08/03 by . Saba, Yemeni restaurant, 3900 A Pickett Road, Fairfax, VA, 703-425-1130 (or 252-347-2016) (Metro Trip Planner – opens in new window) [Don Rockwell | Ylp] Wow, a real Yemeni place and an authentic one at that. Where Sheba (Ethiopian) used to be, and right next to Wild Chicken. I’ve tried I think seven of their dishes and all are excellent. The lentil soup and the breakfast dish clay oven bread mashed with honey and dates stand out as my two favorites. If you order the sambusas, make sure you ask for the dipping sauce, makes a big difference. In general ask if the breakfast dishes are available, often they are. I am told they have a lunch buffet but only Monday through Wednesday. Saba Yogurt Soup The photo is of a quite good yogurt soup, note some of the portions here are quite large, not a complaint but plan accordingly. Good for people-watching as well. Everyone who enjoys ethnic food should visit this place, it counts as a new favorite. The desserts look and sound remarkable, although I am not eating much dessert these days. Related Posts:Saba restaurantMaribHouse of Mandi This entry was posted in Current Favorites, Fairfax, Virginia, Yemeni and tagged -Rma8lPa5Fc, lentil soup, Saba, sambusas, Yemeni, yogurt soup. Bookmark the permalink. ← Thai Taste by Kob Tanpopo Ramen House → 2 Responses to Saba Andrea says: 2014/08/07 at 10:09 am Are there any vegetarian options there? The breakfast dish and the lentil soup sound like possibilities… Michael Reed says: 2014/08/26 at 8:55 pm I popped in for the first time this evening for takeout, and I noticed they do offer at least one vegetarian entree. The vegetable sambusas were excellent, as was the chicken mahndi (sp?). No takeout menu or website, but they do have a Facebook page. Looking forward to a return visit, as they are minutes from my house. Comments are closed."
