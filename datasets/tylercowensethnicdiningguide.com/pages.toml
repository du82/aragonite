full_description = "← “You have to order all at once” Aditi → Rumi’s Kitchen Posted on 2021/06/05 by . Rumi’s Kitchen, web site, 640 L St NW, Washington, DC, 202-900-9106 (Metro Trip Planner – opens in new window) [Google | Washingtonian | WaPo | Michelin | Ylp] Oh what a suburban snob I am! I almost didn’t go to this place, figuring it couldn’t be better than my NoVa favorites. And yet it is. Higher marks for authenticity, better quality ingredients, and a super-nice space to dine in. They have all the classic Persian dishes. At 2x the price mind you, but anyone who cares about Persian food should make a beeline to this place as soon as possible. Related Posts:JoonSaffron House of KabobFatoucheAlborzHow to find good Iranian food This entry was posted in Convention Center / Shaw, DC, Persian and tagged Persian, Rumi's Kitchen. Bookmark the permalink. ← “You have to order all at once” Aditi →"
