full_description = "← A Taste of Burma Which are the safest restaurants to eat in? → King of Koshary Posted on 2020/03/01 by . King of Koshary, web site, 5515 Wilson Blvd., Arlington, VA, 571-317-7925 (Metro Trip Planner – opens in new window) [Google | TripAdvisor | zabihah | Reddit | Arlington Now | Ylp] Excellent fish dishes, from Alexandria (Egypt) and elsewhere. Very good marinade, the rice side dishes are some of the best rice in the area. The Alexandrian chicken and rice dish is to be recommended as well. Also good for sitting and talking – this place deserves to be much better known than it is. Very mom and pop, and attached to a butcher shop. Related Posts:Pho Ga VangAlaska food notesMalaysian KopitiamShi Miaodao Yunnan Rice NoodleChit Chaat Café This entry was posted in Arlington, Egyptian, Virginia and tagged Alexandrian chicken and rice, Arlington, Egyptian, fish, King of Koshary, mom and pop, rice side dishes. Bookmark the permalink. ← A Taste of Burma Which are the safest restaurants to eat in? →"
