full_description = "Author Archives: . ← Older posts Newer posts → JD Ethiopian Restaurant and Bar Posted on 2024/01/07 by . JD Ethiopian Restaurant and Bar, web site, 6669 Little River Turnpike, Annandale, VA, 703-717-3871, usually open and music Saturday nights (Metro Trip Planner – opens in new window) [Google | Restaurant Guru | RoadTrippers | Annandale Today] Monarch Ethiopian used … Continue reading → Posted in Annandale, Ethiopian, Virginia | Tagged Annandale, Ethiopian, JD Ethiopian Restaurant, JD Ethiopian Restaurant and Bar, kitfo | Comments Off on JD Ethiopian Restaurant and Bar Hu Tieu Mi Lacay Cho Lon Posted on 2023/12/31 by . Hu Tieu Mi Lacay Cho Lon, web site, 6793-D Wilson Blvd., Falls Church, VA (Edene Center), 703-531-1420 (Metro Trip Planner – opens in new window) [Google | RoadTrippers] Most of all, good noodle soups. Good vermicelli dishes. Appeals to the … Continue reading → Posted in Eden Center, Falls Church/Seven Corners, Vietnamese, Virginia | Tagged Eden Center, Falls Church, Hu Tieu Mi Lacay Cho Lon, noodle soups, vermicelli, Vietnamese | Comments Off on Hu Tieu Mi Lacay Cho Lon Pho Ga Vang Posted on 2023/12/29 by . Pho Ga Vang, web site, 6767 Wilson Blvd., Eden Center, Falls Church, VA (inside Mr. Wish), 571-375-8281 (Metro Trip Planner – opens in new window) [Google | Washingtonian | Reddit | NoVA Mag] Most of all, I am pleased to … Continue reading → Posted in Current Favorites, Eden Center, Falls Church/Seven Corners, Vietnamese, Virginia | Tagged Arlington, Eden Center, Falls Church, lemon grass chicken, Pho, Pho Ga Vang, recommended, Truong Tien, Vietnamese | Comments Off on Pho Ga Vang “Around since xxxx” Posted on 2023/12/24 by . From a reader, Matt: Is “Since 19XX” a positive or negative signal for a restaurant? I passed a BBQ restaurant in Denver recently with such a sign. If it’s been around so long but is good, why haven’t I heard … Continue reading → Posted in Economics of Dining | Tagged Marginal Revolution | 1 Comment Truong Tien Posted on 2023/11/12 by . Truong Tien, web site, 6763 Wilson Blvd., Falls Church, VA, Eden Center, inside the mall, the back end far from the road, 703-216-2868 (Metro Trip Planner – opens in new window) [Google | WaPo | Reddit] The best Vietnamese place … Continue reading → Posted in Current Favorites, Eden Center, Falls Church/Seven Corners, Vietnamese, Virginia | Tagged Eden Center, Hue, Pho, Seven Courses of Beef, Truong Tien, Vietnamese | Comments Off on Truong Tien Joon Posted on 2023/11/08 by . Joon, web site, 8045 Leesburg Pike, Tysons, VA (in that strip mall right next to the Tiffany’s), 571-378-1390 (Metro Trip Planner – opens in new window) [Google | Washingtonian | Washington Post | Arlington Mag] One of the very best … Continue reading → Posted in Current Favorites, Persian, Vienna/Tysons, Virginia | Tagged Cherry Rice, Fesenjan, Iranian, Joon, kabob, Mast-o-Moseer, Persian, Tysons | Comments Off on Joon Amazon drivers’ urine packaged as energy drink, sold on Amazon Posted on 2023/10/21 by . The drink had all the hallmarks of a beverage sensation. Striking design, bold font, and the punchy name Release. But inside, each bottle was filled with urine allegedly discarded by Amazon delivery drivers and collected from plastic bottles by the … Continue reading → Posted in Delivery, Economics of Dining | Tagged Amazon, Amit Katwala, economics of dining, urine | 1 Comment La Tingeria Posted on 2023/09/01 by . La Tingeria, 626 S Washington St, Falls Church, VA 571-378-1593 (Metro Trip Planner – opens in new window) [Google | Washingtonian | Restaurantji] Hey, this place is really good! Maybe the Mexican of choice in NoVa right now (Fall 2023)? … Continue reading → Posted in Current Favorites, Falls Church/Seven Corners, Mexican, Virginia | Tagged birria tacos, Falls Church, La Tingeria, Mexican, Mexican food, quesadillas, recommended, tacos, tortas | Comments Off on La Tingeria Chaatwala Posted on 2023/08/27 by . Chaatwala, web site, 1050 Elden St., Herndon, VA, 888-504-9666 (Metro Trip Planner – opens in new window) [Google | Restaurantji] Mumbai snacks, this place really “sings.” Downright yummy, excellent Indian sandwiches too. Don’t expect a normal menu of curries, this … Continue reading → Posted in Herndon/Reston/Ashburn/Chantilly / Dulles Airport, Indian, Some Places You Must Try, Virginia | Tagged chaat, Chaatwala, indian, Mumbai, pomegranate seeds, recommended, yogurt | Comments Off on Chaatwala Sari Filipino Kusina Posted on 2023/08/20 by . Sari Filipino Kusina, web site, 6920 Braddock Road, Annandale, VA, 571-395-4055 (Metro Trip Planner – opens in new window) [Google | Washingtonian | Roadtrippers | NoVA Mag] An excellent choice for Filipino food, even if you think you don’t much … Continue reading → Posted in Annandale, Filipino, Virginia | Tagged barbecue, beef brisket, Filipino, milkfish, recommended, Sari Filipino Kusina, Sinigang | Comments Off on Sari Filipino Kusina ← Older posts Newer posts →"
