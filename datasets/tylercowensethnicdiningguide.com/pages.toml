title = "Agglomeration externalities from restaurants | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Alaska food notes What could be more self-recommending than this? → Agglomeration externalities from restaurants Posted on 2023/06/17 by . We estimate agglomeration externalities in Milan’s restaurant sector using the abolition of a unique regulation that restricted where restaurants could locate. In 2005, Milan abolished a minimum distance requirement that had kept the number of establishments artificially constant across neighborhoods. We find that after 2005, the geographical concentration of restaurants increased sharply and at an accelerating rate. Consistent with the existence of strong and self-sustaining agglomeration externalities, restaurants agglomerated in some neighborhoods and deserted others, leading to a growing divergence in local amenities across neighborhoods. Restaurants located in neighborhoods that experienced large increases in agglomeration reacted by increasing product differentiation. That is from a new AER Insights piece by Marco Leonardi and Enrico Moretti. Here are some ungated copies. I am myself repeatedly surprised how much the mere location of a restaurant can predict its quality. Agglomeration externalities from restaurants Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts:Why do the servers always want to take our cutlery and plates and glasses away?The decline of Michelin-starred restaurantsRules for Tri-State Italian foodSan Francisco dining“Around since xxxx” This entry was posted in Economics of Dining and tagged economics of dining, Marginal Revolution. Bookmark the permalink. ← Alaska food notes What could be more self-recommending than this? →"
