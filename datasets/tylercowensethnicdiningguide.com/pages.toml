full_description = "Category Archives: Economics of Dining ← Older posts Newer posts → Support your favorite restaurant! Posted on 2020/03/15 by . If you wish to support your favorite restaurant, and the American economy at the same time, perhaps consider buying a gift card from them? They get the money now and stay solvent, and you can cash in the card later, … Continue reading → Posted in Economics of Dining | Tagged favorites, gift cards | Comments Off on Support your favorite restaurant! Relative rates of fraud Posted on 2019/07/31 by . About 21% of delivery customers worry the driver may have nibbled their order en route—and with good reason, according to a new study of delivery gripes. Some 28% of drivers say they were unable to resist taking a bite. Here … Continue reading → Posted in Economics of Dining, Food Stores | Tagged delivery, fraud, take out | Comments Off on Relative rates of fraud Dining out as cultural trade Posted on 2019/07/02 by . By Joel Waldfogel, here is the abstract: Perceptions of Anglo-American dominance in movie and music trade motivate restrictions on cultural trade. Yet, the market for another cultural good, food at restaurants, is roughly ten times larger than the markets for … Continue reading → Posted in An Economist Gets Lunch, Economics of Dining | Tagged economics of dining, Joel Waldfogel, trade | Comments Off on Dining out as cultural trade What is the optimal tax rate on restaurants? Posted on 2019/05/17 by . bhauth asks me: What do you think the optimal tax rate on restaurants would be? The current rates seem high to me: 1) The marginal substitution rate between restaurants and cooking at home is high. 2) Cooking at home uses … Continue reading → Posted in Economics of Dining | Tagged tax | Comments Off on What is the optimal tax rate on restaurants? Inegalitarian restaurants Posted on 2019/05/14 by . Or maybe you’re a senior staffer for Steve Scalise, the second-ranking Republican in the House. The aide usually pings his usual server for one of his usual perches: table 10 in the main dining room. It’s the corner booth with … Continue reading → Posted in Beautiful Women, Economics of Dining | Tagged Michael Arnaud, PPX, TTA, VIP diners | 1 Comment Do minimum wage hikes get rid of bad restaurants? Posted on 2019/05/07 by . We study the impact of the minimum wage on firm exit in the restaurant industry, exploiting recent changes in the minimum wage at the city level. We find that the impact of the minimum wage depends on whether a restaurant … Continue reading → Posted in Economics of Dining | Tagged minimum wage | Comments Off on Do minimum wage hikes get rid of bad restaurants? The meaning of death, from an economist’s point of view Posted on 2019/02/10 by . A few days ago Garett Jones came to my office door and asked “what do we really know about labor supply?” I said we might as well extend the query to labor demand. In any case, here was part of … Continue reading → Posted in Economics of Dining, General remarks | Tagged death, economics of dining, kebab, minimum wage, pupusas, roast chicken | Comments Off on The meaning of death, from an economist’s point of view Do land use restrictions increase restaurant quality and diversity? Posted on 2019/02/09 by . Daniel Shoag and Stan Veuger say yes, but I am not so convinced. It turns out that metrics of land use restrictions are correlated with restaurant quality, across cities. To cut to the chase, Los Angeles ranks number one on … Continue reading → Posted in An Economist Gets Lunch, Economics of Dining, Strip Malls for Food | Tagged An Economist Gets Lunch, economics of dining, zoning | Comments Off on Do land use restrictions increase restaurant quality and diversity? Lessons from the Washington, D.C. dining scene Posted on 2017/12/09 by . Can One Chef’s Approach to Global Fine Dining Catch on in Washington D.C.? Contrary to what many people will insist, it’s now possible to eat excellent Mexican food, including tacqueria-style tacos, in D.C., Northern Virginia and nearby Maryland. But this … Continue reading → Posted in DC, Economics of Dining, General remarks, Maryland, Mexican, Virginia | Tagged GoGwUNHbncg, Mexican, thai, Vietnamese | Comments Off on Lessons from the Washington, D.C. dining scene Is there a restaurant bubble? Posted on 2017/07/06 by . Mostly not, here is a good article by Maura Judkis. Here is part of the chat with me: What’s happening is something that some restaurateurs may not want to hear: Competition in an already-tough business is getting even tougher. Cowen … Continue reading → Posted in Economics of Dining | Comments Off on Is there a restaurant bubble? ← Older posts Newer posts →"
