full_description = "← Chiko Isabella Eatery → Bistro Aracosia Posted on 2018/02/20 by . Bistro Aracosia, web site, 5100 MacArthur Blvd. NW, Washington, DC, 202-363-0400 (Metro Trip Planner – opens in new window) [WaPo | Washingtonian | TripAdvisor | Ylp] One of the best ethnic restaurants in DC, and indeed one of the best restaurants in DC period. This is from the Afghan Bistro people, except turned into a normal restaurant with nice décor, rather than a mom and pop. And yet the prices are still reasonable. Most of all, get the complex stews and the vegetable dishes. The kadu is from butternut squash, and is the best in the area. The eggplant and aushak are also first-rate, this place is a winner all-around. Reservations typically are required, even for off-hours, as the place does fill up. Related Posts:Afghan BistroRumi’s BistroCurry LeafLines are overrated, and totally empty restaurants are underratedChez Manelle This entry was posted in Afghan, Current Favorites, DC, Palisades/Foxhall, The Best, Top Five and tagged Afghan, Afghan Bistro, Aushak, Bistro Aracosia, eggplant, kadu, Palisades. Bookmark the permalink. ← Chiko Isabella Eatery →"
