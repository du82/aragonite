full_description = "← “But we just had Indian food yesterday!” Lines are overrated, and totally empty restaurants are underrated → Aladdin Posted on 2013/10/19 by . Aladdin, 5169 Lee Highway, Garden City Shopping Center, Arlington, VA, 703-533-0077 (Metro Trip Planner – opens in new window) [Google | Arlington Now | FCNP] (This is at the previous location of Deshi Spice.) Bangladeshi feast! at Aladdin, by Annie Lowrey An awesome Bangladeshi restaurant. Get the shrimp curry in coconut milk, the biryanis (lamb, or goat on Saturdays if you call ahead), the channa, and the fish curry, among other dishes. The halim appetizer is spectacular and indeed they all are. This place is a knockout and our dining companions loved it too. A must try. Related Posts:Gharer KhabarPho Ga VangKing of KosharyTortas y Tacos La ChiquitaAmbar This entry was posted in Arlington, Bangladeshi, Current Favorites, The Best, Virginia and tagged Aladdin, Arlington, Bangladeshi. Bookmark the permalink. ← “But we just had Indian food yesterday!” Lines are overrated, and totally empty restaurants are underrated → One Response to Aladdin Paul Page says: 2013/11/23 at 2:01 pm Try Indigo in Northeast. 3rd and K NE. Excellent Indian. Comments are closed."
