["https://tylercowensethnicdiningguide.com/index.php/eating-well-in-stockholm"]
title = "Eating well in Stockholm | Tyler Cowen's Ethnic Dining Guide"
full_description = "← Where and how to eat in Cape Town, South Africa Why do the servers always want to take our cutlery and plates and glasses away? → Eating well in Stockholm Posted on 2024/06/19 by . Yes, the fancy expensive places are great. But more generally, I recommend that you order the dishes with game and lingonberries, most of all lingonberries. Soups here are above average, and I do not generally love soups. The pizza is surprisingly good, make sure you order it with “pizza salad,” which turns out to be cabbage. If you are craving non-Western food, I would try Persian before Indian or Chinese. At breakfast, butter is consistently good. Overall, Stockholm is a quality food city, though it is not superb when it comes to breadth. Eating well in Stockholm Originally posted on Marginal Revolution – click to see comments and suggestions. Related Posts: This entry was posted in Sweden. Bookmark the permalink. ← Where and how to eat in Cape Town, South Africa Why do the servers always want to take our cutlery and plates and glasses away? →"
