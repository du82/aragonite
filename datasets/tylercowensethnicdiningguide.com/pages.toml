full_description = "← Purple Patch Alborz → Maketto Posted on 2015/09/12 by . Maketto, Cambodian/Taiwanese, web site, 1315 H Street NE, Washington, DC, 202-838-9972 (Metro Trip Planner – opens in new window) [Google | WaPo | Washingtonian | TripAdvisor | City Paper | Ylp | Don Rockwell] Restaurant, café, fun space to sit, space to buy sneakers, all-purpose slacker hangout, they open at 7 a.m. but not all parts of the menu are available at all times. For weekend lunch for instance you can only get the Cambodian entrees, not the Taiwanese, so check before you go at a particular time. I have tried all of the weekend lunch items, and thought a few were excellent and the rest were at least good. The noodle soup and some kind of Khmer salad with beef and things piled on top of each other; I don’t see it on their current on-line menu. The Taiwanese fried chicken gets good reviews on-line. A fun place, worth trying, it may end up as too trendy but still I found it to be a positive experience and where else can you get Cambodian food around here these days? Related Posts:Wang DynastyTaipei notesSan Francisco diningSuper Bowl Noodle HouseBob’s Shanghai 66 This entry was posted in Cambodian, DC, H Street NE, Taiwanese and tagged Cambodian, iCVuC84LSRs, Maketto, noodle soup, Taiwanese, Taiwanese fried chicken. Bookmark the permalink. ← Purple Patch Alborz →"
