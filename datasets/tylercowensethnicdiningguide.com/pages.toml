full_description = "← Mim’s Food Hedzole, food stand → Follow Up for Desi Bethak Posted on 2020/09/08 by . Desi Bethak, web site, 8000 Haute Court, Springfield, VA, 703-337-2448 (Metro Trip Planner – opens in new window) [Google | zabihah | Ylp] Original review here. I had never had the pepper chicken here, a wok dish, and one of my very favorite entrees in this whole area, worth the more than $30 cost, plus it feeds two or more. The mix of creamy, biting, sweet, and nutty is quite special. Get it with the lentils. And I still recommend the haleem. Could this be the best place that no one knows about? Their outdoor dining offers two low-slung tables, both large, and three seats, with more available inside. It works great if the weather cooperates. Related Posts:Desi BethakShinwari Namak MandiDesi Breakfast ClubChutny RestaurantDining out in Karachi This entry was posted in Pakistani, Springfield, Virginia and tagged Desi Bethak, haleem, lentils, Pakistani, pepper chicken. Bookmark the permalink. ← Mim’s Food Hedzole, food stand →"
