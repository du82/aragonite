["https://tylermcginnis.com/dan-abramov"]
title = "Progression, Curiosity, and Burnout with Dan Abramov"
description = "In this episode I chat with Dan Abramov, an Engineer at Facebook and co-author of Redux. We discuss his upbringing and what it's like learning to program in Russia, the backstory of how Redux came to be, handling burnout, and much more."
full_description = '''Progression, Curiosity, and Burnout with Dan AbramovDescription There's no one that I know personally who has a more interesting backstory than Dan Abramov. In a matter of years he went from hacking on VBA and C# apps for $200 a week in Russia to building one of the most popular JavaScript libraries (Redux) and working as an engineer at Facebook. I've always been curious about this process and I finally got the chance to ask him all about it. In this episode we talk about his upbringing and what it's like learning to program in Russia, the backstory of how Redux came to be, handling burnout, and much more. Transcript const Tyler = "Tyler McGinnis";const Dan = "Dan Abramov"; Tyler: Welcome to this podcast where I decode the implementation details of successful Software Engineers. When I first had the idea for this podcast, someone who kept popping into my head over and over to try to interview was Dan Abramov. The problem with that, is that I'm trying to have all of my interview for this podcast just because it feels just a little more geniune that way. Unfortunately, I live in Utah and Dan lives in London so we are no where close to each other. But, luckily for me, Dan attended React Rally last week here in Utah and was kind enough to sit down with me as a last minute request. If by some small chance you don't already know who Dan is, he's the co-author of Redux and now works at Facebook on the React team. I've always been curious how someone from such a humble background as Dan could have such a positive impact in our industry so quickly. What I found in our interview, and I think this attribute can be credited to a lot of his success, is Dan is probably the most curious person I've ever met. He never comes out and explicitly states this, but every story he tells, whether he's a 14 year old in Russia reading bootleg VBA books or a twenty something year old writing Redux to prepare for a conference talk, every story is just engulfed with curiosity. With that said, I am so happy to bring you this interview with one the developers that I look up to the most - Dan Abramov. Tyler: I think what interests me most about you, and this is kind of universally what I've heard is, you have an incredibly interesting backstory. And I don't know if I have ever heard it personally. Everyone kind of knows you are from Russia and they know you are at Facebook. But there's a lot in between there that I don't know that if you've ever talked about or I don't know if it's really been discussed. That's the first question I have for you is, how does someone go from Russia, to now, working at Facebook? Tell me, probably in more detail than you want to, the steps or kind of the history of how you did that. Dan: I think I was about 12 maybe. I did not really intentionally start to program. So I remember I had a book on Pascal actually, which I had no idea what it meant. Like, I didn't understand that it's something you need to input into a computer so it was like a book with code printed in it. And I don't remember it was some kind of database thing. So I remember seeing it, but I didn't make anything of it. I didn't have any like... We had computer classes in school but they did not include programming at all. It was Word, and PowerPoint then Office programs, Microsoft Paint. And so I was just doing, yeah. And I loved PowerPoint. PowerPoint was my favorite program ever because I tried to inspect every feature. I opened every menu in PowerPoint and tried to test it and it had this crazy features I don't know if you remember, but you can insert all the objects which is like you can insert, so Microsoft had this... its own component model back in the day where you could have applications export different types of content that would be embeddable in other applications. So Iike, if you installed both Excel and PowerPoint, you can embed Excel spreadsheets into PowerPoint slides. And then if you press on it it's going to activate, like the tool bars are going to be replaced by Excel. And I was just fascinated by is kind of like things that you can put into other things and they like do something. And so it also, so apart from this it also had these animations. So you could schedule animations on like some kind of board you could say, "This thing flies off from like from the right, then it fades in. Then like this thing happens..." So it was a visual way to design, I guess, not an interaction but like just animations. But then I noticed a really cool menu years so it was called service-micros and what you could do is it would show a tool bar which looked like a tape recorder so it had the, "Record," "Play," and, "Stop," buttons. And I remember that I pressed record and then I just moved somethings on the side. And then I pressed stop. And then if I pressed, "Play," it would do the same thing again automatically. Like, repeat what I did. And I found it really cool and I noticed that if I double click it, it opens up some completely different program with some weird menus and a white screen of text and in the text it says, 'With Picture box One. Dot Left equals something, Dot Top equals something. End With" And I changed those numbers and I pressed play again and it would move it to a different spot and I am like, "Wow. Like, these are coordinates." And if I press, "Up," so like it let me assigned properties. And if I pressed that again, it would show a list of all the properties that are available. And I would just try every property in there to see what I could do with these pictures and objects. And so this was really fascinating and the thing was called Visual Basic for applications, it's like a small version of Visual Basic . I bought a book on it. And in Russia they would sell technical books in our underground when you go to an underground station, before the entrance to the station there will be a small shop. I am not even sure if it was official licensed or whatever, but they would sell CD's and DVD's everything. It was pirated, of course. And there were some books and some technical books as well, and so I bought a book, like a book by some, it was not even a translation, just some Russian author who wrote about automating stuff with VBA and so I read that, I read another book on VBA and I started just, so my grandmother sure so like to like buy me treats and I stuff and I just asked for books about Visual Basic. So our favorite... Tyler: Which is normal for a 14-year old. Dan: Yeah. Totally. And my favorite way to spend a weekend was to go with my grandma to eat some pizza, something like this, and then go to a bookstore and pick the thickest book about Visual Basics. I had like maybe five or six such books. And I mean as books they were probably not very great because they didn't teach programming, they just described the APIs, and stuff. But I quickly started, so I picked Visual Basic 6, that was the version that was popular at the time. And I don't know, I was just, you could drag and drop things onto like a window, and it would have this Visual Designer and then you could write some code for event handlers. And this really how I got into programming because I could just like put a button. It felt very powerful to see a window, and track a button on it. And press, "Play," and I see this as a real thing, as a real application. Tyler: Was feedback. Dan: Yeah. It was. So there was this talk at, so we are at React Rally, for the context of the conference. And there was this talk today by Preeti. And she talked about how feedback loop was important to how she got into JavaScript. And I now realize that I did not, like JavaScript was not popular at the time when I learned. But for me it was also this visual feedback loop that got me into programming, I would never have gotten into it if, with this book about Pascal this didn't make any sense for me. But just dropping things and running them and seeing them live, I think that made the biggest impression on me. Tyler: When you were learning Fiber, you tweeted how you were building a to-do list or something in order to learn it. Has that always been kind of your path to learning new things is basically just getting as hands-on with that is possible or what's a path? Like, say because back then it was purely your drive, your reading books, all you had were books essentially. Your Grandma, books and pizza, right? Is the process still similar today with newer technology? Dan: I don't learn new technology much. Tyler: Unfortunately. So say when you're learning Fiber, which was I think a year ago or something? What was the path you took to learn that? Dan: For the context, Fiber is a project that, it is like a rewrite of React that Sebastian Marbage has started which is a bit complicated because it's not like the JavasScript code that I have seen before. Yeah. It took me some time to understand the reasoning behind how it's written. I think for me the way I understood it was just by trying to implement a feature in it. So like, we needed to get to feature parity. Yeah. And actually I started work, the first feature that I worked on in Fiber was Error Boundaries, which was actually a new feature. So I would just write some tests, like initial tests for what I was trying to do here, and wrote the hackiest version like, I could write that did what I was trying to do here. And obviously it was violating some principles of how Sebastian wanted it to be done. So Sebastian actually wrote up an issue called, "Contributing to Fiber," where he lists that his constraints, like the things that he, the way that he wants the code to be written like, things to be aware of. And after reading that and talking with him through it, "I think I got a clearer picture of like what he was trying to do." And the like, the invariants, the constraints that I need to follow. And yeah. It kind of went from there. But I mean it wasn't also it wasn't like I'm learning a new thing. It was more like Sebastian started like shaping it. And you know, it's kind of like a sculpture, right? So you have this raw material at first and then you like, work on them and they become something, and he had shared it with us at a very rough stage, like the first stage. And then we just try to learn how to work on this thing together. It changed many times as we were working on it but... Tyler: It worked out. Dan: Yeah, it... Tyler: It shipped. It's working out. Dan: Yeah. I mean it shipped to Facebook. It's just we haven't released 16 yet, but hopefully in a few weeks, it'll be out. Tyler: So let's go back to when you're in Russia with your grandma. She gets you pizza, treats, you'd be reading like these super fat VBA. So what was the path from there to learning JavaScript? Where was that transition? Dan: So it took a long time really. So again I started at about 12. But I stalled a lot I'd been trying to write a single program like for my step-dad. So basically he needed, he worked as a photographer and he needed something like a database for keeping track of like, of photoshoots. Like location, topics, tags, descriptions. Yeah. And it was just a regular it could have been a spreadsheet, but he didn't know how to use Excel. Tyler: Everything can definitely be a spreadsheet. Dan: Yeah. And so I was trying to gather, but I was reading books. So right after Visual Basic I think I never I didn't start reading books about programming fundamentals, but instead I got fascinated by the OOP stuff. So I started I read Gang of Four, I read refactoring, design patterns, I got super fixed on UML for some reason. So I was drawing these crazy diagrams of object oriented things and inheritance hierarchies and all this stuff. Tyler: Was this so you could build a product for your step-dad or was this out of curiosity? Dan: It was kind of both. I was using this project as an excuse to do everything. So like, I was trying to, I was reading a book about how to gather project requirements and like user stories and Agile stuff and all of this. And I was, like 14. And I it made a big impression on me at the time. So I was, yeah, I was just drawing UI mockups and figuring out how to express this in objects. And also at the same time, so I was using this project as a test bed for everything I learned. I was also buying part of the copies of ActiveX controls. Wow. That sounds really funny in 2017. And there was this component abstraction for Windows, which is a way to share comp- like this is like React components now that I think of it. You could just drag and drop them, and decide their properties. And they had events. This is ridiculous, it's like I am working on the same thing now. Yeah, but at the time they were not open source. So like, open source was not a big thing back then, everything was commercial. But in Russia, you could just go to this underground shop and there would be CD-ROMs with 250 ActiveX controls... Tyler: Oh my goodness. Dan: And stuff like this. And I would just like, I was fascinated by toolbars. So there were a lot of controls that implemented Microsoft Office style tool bars, that are not native to windows. Like, you actually have to implement them and I would like, try every single one of them and I would change like the tool bar implementation every week and try to give it abstracts so I could swap them up. And like, this project was ridiculous, and I never really shipped it, so I think it kept going for like, two years for me. I was just tweaking random things I mean he was using it at some point because like, it kind of worked but I think I never really finished all the features I wanted to finish. And yeah. It took me a long time just to I think it's gotten to a point where so, .NET came out and VB6 was kind of deprecated. I was trying to migrate to VB.NET and I started learning C# around the same time because like everybody was using C#. And I think the project kind of just sunk like, I couldn't change anything without introducing a bug. Because like, the code was such a mess that like talk to database and do everything in a single place, in the event handlers and forms that I would like, fix one bug and introduce three other bugs. And at some point I just abandoned it. But that's, I think that was the longest project I had at the time and then I kind of stopped programming for a few years. Tyler: Do you know remember what year this was when you finished the program? Dan: So I think I was about 15, so that was 2007. And I stopped programming for a couple of years after that. Tyler: What made you stop? Dan: I just didn't have any I was just frustrated after this first project, and I also had the school was getting more demand. And although I hated school so I just copied my homework. And I don't know, I just wasn't in a good place to like, do something like this. I wasn't really very interested, but I got into a programming forum so I started to spend a lot of time online. I had a smartphone with Opera mini as a browser which was super '''
