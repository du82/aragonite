title = "A Complete Guide to React Router: Everything You Need to Know"
description = "In this comprehensive, up-to-date tutorial, you'll learn everything you need to know to build production ready apps with React Router."
full_description = '''A Complete Guide to React Router: Everything You Need to KnowIt's probably no surprise to you that React Router is the most popular 3rd party library in the React ecosystem. In fact, during the last 6 months, React Router has been included in 44% of all React projects. This statistic alone is enough to declare React Router as essential knowledge for any serious React developer. The problem, honestly, lies in the fact that no one wants to spend their weekend learning about a router – regardless of how popular it is. To make that pill a little easier to swallow, this post is a culmination of everything you'll need to know in order to be effective with React Router. In this React Router tutorial, we'll start off with a high-level look at what React Router is. From there we'll dive into the fundamentals of the API. Finally, we'll finish off looking at a few lot of different use cases you may face in the real-world. What is React Router? First created in 2014, React Router is a declarative, component based, client and server-side routing library for React. Just as React gives you a declarative and composable API for adding to and updating application state, React Router gives you a declarative and composable API for adding to and updating the user's navigation history. If you're new to React, it may come as a surprise to know that a router isn't baked into the library itself, but that's foundational to React's ethos. React focuses on giving you UI primitives for building your application, and nothing more. Poetically, React Router follows a similar ethos, except instead of UI primitives, they give you routing primitives. To align with React, naturally, these "routing primitives" are really just a collection of React components and Hooks. Let's dive into the most important ones before we look at specific use cases. BrowserRouter Naturally, in order to do its thing, React Router needs to be both aware and in control of your app's location. The way it does this is with its BrowserRouter component. Under the hood, BrowserRouter uses both the history library as well as React Context. The history library helps React Router keep track of the browsing history of the application using the browser's built-in history stack, and React Context helps make history available wherever React Router needs it. There's not much to BrowserRouter, you just need to make sure that if you're using React Router on the web, you wrap your app inside of the BrowserRouter component. import ReactDOM from 'react-dom'import * as React from 'react'import { BrowserRouter } from 'react-router-dom'import App from './App` ReactDOM.render( <BrowserRouter> <App /> </BrowserRouter>, document.getElementById('app)) The other <Routers />If you're using React Router in an environment that isn't the browser, check out MemoryRouter and StaticRouter.MemoryRouter keeps track of the history of the application in memory, rather than in the URL. Use this instead of BrowserRouter if you're developing a React Native application.StaticRouter, as the name implies, is useful in environments where the app's location never actually changes, like when rendering a single route to static HTML on a server. Now that you know how to enable React Router via the BrowserRouter component, let's look at how you can actually tell React Router to create a new route. Route Put simply, Route allows you to map your app's location to different React components. For example, say we wanted to render a Dashboard component whenever a user navigated to the /dashboard path. To do so, we'd render a Route that looked like this. <Route path="/dashboard" element={<Dashboard />} /> The mental model I use for Route is that it always has to render something – either its element prop if the path matches the app's current location or null, if it doesn't. You can render as many Routes as you'd like. <Route path="/" element={<Home />} /><Route path="/about" element={<About />} /><Route path="/settings" element={<Settings />} /> You can even render nested routes, which we'll talk about later on in this post. With our Route elements in this configuration, it's possible for multiple routes to match on a single URL. You might want to do that sometimes, but most often you want React Router to only render the route that matches best. Fortunately, we can easily do that with Routes. Routes You can think of Routes as the metaphorical conductor of your routes. Whenever you have one or more Routes, you'll most likely want to wrap them in a Routes. import { Routes, Route } from "react-router-dom"; function App() { return ( <Routes> <Route path="/" element={<Home />} /> <Route path="/about" element={<About />} /> <Route path="/settings" element={<Settings />} /> <Route path="*" element={<NotFound />} /> </Routes> );} The reason for this is because it's Routes job is to understand all of its children Route elements, and intelligently choose which ones are the best to render. Though it's not shown in the simple example above, once we start adding more complex Routes to our application, Routes will start to do more work like enabling intelligent rendering and relative paths. We'll see these scenarios in a bit. Next up, linking between pages. Link Now that you know how to map the app's location to certain React components using Routes and Route, the next step is being able to navigate between them. This is the purpose of the Link component. To tell Link what path to take the user to when clicked, you pass it a to prop. <nav> <Link to="/">Home</Link> <Link to="/about">About</Link> <Link to="/settings">Settings</Link></nav> If you need more control over Link, you can also pass to as an object. Doing so allows you to add a query string via the search property or pass along any data to the new route via state. <nav> <Link to="/">Home</Link> <Link to="/about">About</Link> <Link to={{ pathname: "/settings", search: "?sort=date", state: { fromHome: true }, }} > Settings </Link></nav> We'll cover state, Query Strings, and how React Router supports relative paths in more depth later on in this post. At this point we've covered both the history and the absolute fundamentals of React Router, but one thing should already be clear - by embracing composition, React Router is truly a router for React. I believe React will make you a better JavaScript developer and React Router will make you a better React developer. Now, instead of just walking you through the rest of the API, we'll take a more practical approach by breaking down all of the common use cases you'll need when using React Router. URL Parameters Like function parameters allow you to declare placeholders when you define a function, URL Parameters allow you to declare placeholders for portions of a URL. Take Wikipedia for example. When you visit a topic on Wikipedia, you'll notice that the URL pattern is always the same, wikipedia.com/wiki/{topicId}. Instead of defining a route for every topic on the site, they can declare one route with a placeholder for the topic's id. The way you tell React Router that a certain portion of the URL is a placeholder (or URL Parameter), is by using a : in the Route's path prop. <Route path="/wiki/:topicId" element={<Article />} /> Now whenever anyone visits a URL that matches the /wiki/:topicId pattern (/wiki/javascript, /wiki/Brendan_Eich, /wiki/anything) , the Article component is rendered. Now the question becomes, how do you access the dynamic portion of the URL – in this case, topicId – in the component that's rendered? As of v5.1, React Router comes with a useParams Hook that returns an object with a mapping between the URL parameter(s) and its value. import * as React from 'react'import { useParams } from 'react-router-dom'import { getArticle } from '../utils' function Article () { const [article, setArticle] = React.useState(null) const { topicId } = useParams() React.useEffect(() => { getArticle(topicId) .then(setUser) }, [topicId]) return ( ... )} Want more?For a much more comprehensive explanation, visit The Complete Guide to URL parameters with React Router. Nested Routes Nested Routes allow the parent Route to act as a wrapper and control the rendering of a child Route. route style:nested A real-life example of this UI could look similar to Twitter's /messages route. When you go to /messages, you see all of your previous conversations on the left side of the screen. Then, when you go to /messages/:id, you still see all your messages, but you also see your chat history for :id. Let's look at how we could implement this sort of nested routes pattern with React Router. We'll start off with some basic Routes. // App.jsfunction App() { return ( <Routes> <Route path="/" element={<Home />} /> <Route path="/messages" element={<Messages />} /> <Route path="/settings" element={<Settings />} /> </Routes> );} Now, if we want Messages to be in control of rendering a child Routes, what's stopping us from just rendering another Routes component inside Messages? Something like this: function Messages() { return ( <Container> <Conversations /> <Routes> <Route path=":id" element={<Chat />} /> </Routes> </Container> );} Now when the user navigates to /messages, React Router renders the Messages component. From there, Messages shows all our conversations via the Conversations component and then renders another Routes with a Route that maps /messages/:id to the Chat component. Relative RoutesNotice that we don't have to include the full /messages/:id path in the nested Route. This is because Routes is intelligent and by leaving off the leading /, it assumes we want this path to be relative to the parent's location, /messages. Looks good, but there's one subtle issue. Can you spot it? Messages only gets rendered when the user is at /messages. When they visit a URL that matches the /messages/:id pattern, Messages no longer matches and therefore, our nested Routes never gets rendered. To fix this, naturally, we need a way to tell React Router that we want to render Messages both when the user is at /messages or any other location that matches the /messages/* pattern. Wait. What if we just update our path to be /messages/*? // App.jsfunction App() { return ( <Routes> <Route path="/" element={<Home />} /> <Route path="/messages/*" element={<Messages />} /> <Route path="/settings" element={<Settings />} /> </Routes> );} Much to our delight, that'll work. By appending a /* to the end of our /messages path, we're essentially telling React Router that Messages has a nested Routes component and our parent path should match for /messages as well as any other location that matches the /messages/* pattern. Exactly what we wanted. At this point, we've looked at how you can create nested routes by appending /* to our Route's path and rendering, literally, a nested Routes component. This works when you want your child Route in control of rendering the nested Routes, but what if we wanted our App component to contain all the information it needed to create our nested routes rather than having to do it inside of Messages? Because this is a common preference, React Router supports this way of creating nested routes as well. Here's what it looks like. function App() { return ( <Routes> <Route path="/" element={<Home />} /> <Route path="/messages" element={<Messages />}> <Route path=":id" element={<Chats />} /> </Route> <Route path="/settings" element={<Settings />} /> </Routes> );} You declaratively nest the child Route as a children of the parent Route. Like before, the child Route is now relative to the parent, so you don't need to include the parent (/messages) path. Now, the last thing you need to do is tell React Router where in the parent Route (Messages) should it render the child Route (Chats). To do this, you use React Router's Outlet component. import { Outlet } from "react-router-dom"; function Messages() { return ( <Container> <Conversations /> <Outlet /> </Container> );} If the app's location matches the nested Route's path, this Outlet component will render the Route's element. So based on our Routes above, if we were at /messages, the Outlet component would render null, but if we were at /messages/1, it would render the <Chats /> component. Want more?For a much more comprehensive explanation, visit The Guide to Nested Routes with React Router. Pass props to Router Components In previous versions of React Router (v4), this was non-trivial since React Router was in charge of creating the React element. However, with React Router v6, since you're in charge of creating the element, you just pass a prop to the component as you normally would. <Route path="/dashboard" element={<Dashboard authed={true} />} /> Want more?For a much more comprehensive explanation, visit How to Pass Props to a Component Rendered by React Router. Programmatically Navigate React Router offers two different ways to programmatically navigate, depending on your preference. First is the imperative navigate method and second is the declarative Navigate component. To get access to the imperative navigate method, you'll need to use React Router's useNavigate Hook. From there, you can pass navigate the new path you'd like the user to be taken to when navigate is invoked. import { useNavigate } from 'react-router-dom function Register () { const navigate = useNavigate() return ( <div> <h1>Register</h1> <Form afterSubmit={() => navigate('/dashboard')} /> </div> )} If you'd prefer a more declarative approach, you can use React Router's Navigate component. Navigate works just like any other React component, however, instead of rendering some UI, it navigates the user to a new location. import { Navigate } from "react-router-dom"; function Register() { const [toDashboard, setToDashboard] = React.useState(false); if (toDashboard === true) { return <Navigate to="/dashboard" />; } return ( <div> <h1>Register</h1> <Form afterSubmit={() => toDashboard(true)} /> </div> );} It is more typing, but I'd argue that explicit state leading to a declarative API is better than implicit state handled by an imperative API. Want more?For a much more comprehensive explanation, visit How to Programmatically Navigate with React Router. Query Strings You've almost certainly run into query strings before. They're the ? and & you see appended onto URLs. They're a fundamental aspect of how the Web works as they allow you to pass state via the URL. Query String Exampletwitter.com/search?q=ui.dev&src=typed_query&f=live Above is an example of a query string you'd see if you searched for ui.dev on Twitter. As of v6, React Router relies heavily on the URLSearchParams API to deal with query strings. URLSearchParams is built into all browsers (except for IE) and gives you utility methods for dealing with query strings. To do this, React Router comes with a custom useSearchParams Hook which is a small wrapper over URLSearchParams. useSearchParams returns an array with the first element being an instance of URLSearchParams and the se'''
