title = "The printer is a device too!"
description = "Brad Frost created one of the more commonly used photos found on responsive design presentations (see below). This depicts the world we live in today which contains hundreds of devices with internet capabilities."
full_description = '''The printer is a device too!Brad Frost created one of the more commonly used photos found on responsive design presentations (see below). This depicts the world we live in today which contains hundreds of devices with internet capabilities. The web is available on all these devices, and there's more coming With every one of these devices brings the challenge for our websites to respond in a logical, beautiful and above all user friendly way. The problem is that we're focusing too much on the future devices and we've forgotten the devices that have been with us for years. The Printer While not the snazziest of devices connected to the internet it STILL is a device that can render our web pages, and unfortunately this is probably the most forgotten and least styled of all the devices around. The printer has become one of the forgotten devices, yet we've been able to target it well before CSS3 Media Queries The Print Stylesheet In October 2013 I did a talk at the Squiz User Conference on how to make changes to your website without actually changing anything at all. While preparing the talk I took at leaf out of another talk I had seen during dConstruct by Maciej Cegłowski, creator of PinBoard. The leaf I took was to provide the audience with something that they could use on Monday morning when they got back to work, and pass it off to their boss as it it was their own. For me this takeaway was the Squiz.io site. I wanted it to be more than a website so I added some HTML5 editable regions to allow the reader to update the title and description, and then applied a Print Stylesheet so it was nicely formatted for then to print and pass off as their own ideas. Here's the simple but effective styles. @media print { section { display: block; page-break-before: always; } pre code {page-break-after: always;} @page {margin-top:0.4cm;margin: 0.5cm;}p a, code, pre {word-wrap: break-word;}img {display:none;} pre a[href]:after { content: ""; } pre abbr[title]:after { content: ""; } pre .ir a:after, pre a[href^="javascript:"]:after, pre a[href^="#"]:after { content: ""; } .no-print {display:none;} }Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but @tylermcginnis doesn’t miss with the Bytes email. If you’re a developer, you really need to subscribeAli Spittel@aspittelCan I just say that I giggle every time I get the @uidotdev email each week? You should definitely subscribe.Chris Finn@thefinnomenonEvery JavaScript programmer should be subscribed to the newsletter from @uidotdev. Not only do they manage to succinctly cover the hot news in the JavaScript world for the week but it they manage to add a refreshing humor to it all.'''
