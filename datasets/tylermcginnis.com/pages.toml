title = "How to check for undefined in JavaScript"
description = "In this post you'll learn the best way to check for undefined in JavaScript."
full_description = '''How to check for undefined in JavaScriptThis is one of those topics where the strange history of the JavaScript language clouds what is now an easy solution. In this post we'll ignore that history (cause it's been fixed) and look at the two predominant ways to check if a value is undefined in JavaScript today, not 10 years ago. Best Solution The way I recommend to check for undefined in JavaScript is using the strict equality operator, ===, and comparing it to the primitive undefined. if (user === undefined) { // user is undefined} Checking for `undefined`` this way will work in every use case except for one, if the variable hasn't been declared yet. Admittedly, this is a rare occurrence which is why I recommend the solution above. Other Solution In cases where you're not sure if a variable has been declared, you can use the typeof operator and compare it to the string of 'undefined'. if (typeof notSureIfDeclared === "undefined") {}Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially