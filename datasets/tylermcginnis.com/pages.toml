["https://tylermcginnis.com/react-router-v5-pass-props-to-link"]
title = "Pass props to React Router v5's Link component"
description = "In this post you'll learn how to pass props to the Link component in React Router v5."
full_description = '''Pass props to React Router v5's Link componentCheck your versionThis post assumes you're using React Router v5. If not, find your version below.React Router v4React Router v6 When building an app with React Router v5, sometimes you'll need to pass props through the Link component to the new route. In this post, we'll break down how that process works. There are two different ways to pass data from the Link component through to the new route. The first is through URL Parameters and the second is through state. First, let's take a look at URL parameters. If you've read our URL Parameters post, you'll be familiar with this example. Say we were in charge of building out the Route that renders Twitter's profile page. If created with React Router v5, that Route would probably look something like this. <Route path="/:handle"> <Profile /></Route> Notice that handle has a : in front of it, that's because it's going to be dynamic. It could be anything from tylermcginnis or dan_abramov to realDonaldTrump. So in our app, we may have a Link component that looks like this. <Link to="/tylermcginnis">Tyler McGinnis</Link> If clicked, the user would be taken to /tylermcginnis and the Profile component would be rendered. Profile would be able to access the dynamic URL parameter (tylermcginnis) by using the useParams custom Hook. function Profile () { const { handle } = useParams() const [user, setUser] = React.useState(null) React.useEffect(() => { fetch(`https://api.twitter.com/user/${handle}`) .then(setUser) }, [handle]) return ( ... )} URL parameters are great, but they're not meant to serve as a way to get data from one route to another as they're limited to just strings. What if instead of just a string, we wanted to pass along something a little more complex, like an object or an array? There would be no way to do that with URL parameters. This brings us to the second way to pass data from one route to another and that's with state. Going back to our Twitter example from earlier, what if we wanted to pass along if the user is coming from a certain route? For example, say we wanted to know if the user is coming from the /notifications route when they click on the Link. To do this, instead of passing to as a string to Link, we can pass it an object with a pathname and a state property. <Link to={{ pathname: "/tylermcginnis", state: { fromNotifications: true, }, }}> Tyler McGinnis</Link> Now the question becomes, how does the component that's being rendered when the user goes to /tylermcginnis get access to the fromNotifications property? Anytime you pass data along via the state property, that data will be available on location.state which you can get access to by using the custom useLocation Hook that comes with React Router v5. function Profile () { const { handle } = useParams() const location = useLocation() const { fromNotifications } = location.state const [user, setUser] = React.useState(null) React.useEffect(() => { fetch(`https://api.twitter.com/user/${handle}`) .then(setUser) }, [handle]) return ( ... )} To recap, there are two ways to pass data from a Link through to the new route: URL parameters and state. URL parameters work great for strings, but aren't meant for any other data types. By making the Links to prop an object, you can pass along any sort of data you need under the state property and that data can be accessed via location.state using the custom useLocation Hook.Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos