title = "Computed Property Names in JavaScript"
description = "In this post you'll learn how to have an expression be computed as a property name on an object in JavaScript using ES6's (ES2015) Computed Property Names feature."
full_description = '''Computed Property Names in JavaScriptES6's "Computed Property Names" feature allows you to have an expression (a piece of code that results in a single value like a variable or function invocation) be computed as a property name on an object. For example, say you wanted to create a function that took in two arguments (key, value) and returned an object using those arguments. Before Computed Property Names, because the property name on the object was a variable (key), you'd have to create the object first, then use bracket notation to assign that property to the value. function objectify (key, value) { let obj = {} obj[key] = value return obj} objectify('name', 'Tyler') // { name: 'Tyler' } However, now with Computed Property Names, you can use object literal notation to assign the expression as a property on the object without having to create it first. So the code above can now be rewritten like this. function objectify (key, value) { return { [key]: value }} objectify('name', 'Tyler') // { name: 'Tyler' } Where key can be any expression as long as it's wrapped in brackets, [].Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s 