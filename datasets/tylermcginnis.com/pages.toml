["https://tylermcginnis.com/shorthand-properties"]
title = "Shorthand Property and Method Names in JavaScript | ES6"
description = "In this post you'll learn how ES6's Shorthand Property and Shorthand Method Names features allow you to more concisely add properties to JavaScript objects."
full_description = "Shorthand Property and Method Names in JavaScript | ES6ES6 introduced two new features to make objects more concise - Shorthand Properties and Shorthand Method Names. Shorthand Properties With Shorthand Properties, whenever you have a variable which is the same name as a property on an object, when constructing the object, you can omit the property name. What that means is that code that used to look like this, function formatMessage (name, id, avatar) { return { name: name, id: id, avatar: avatar, timestamp: Date.now() }} can now look like this. function formatMessage (name, id, avatar) { return { name, id, avatar, timestamp: Date.now() }} Shorthand Method Names Now, what if one of those properties was a function? A function that is a property on an object is called a method. With ES6's Shorthand Method Names, you can omit the function keyword completely. What that means is that code that used to look like this, function formatMessage (name, id, avatar) { return { name, id, avatar, timestamp: Date.now(), save: function () { // save message } }} can now look like this function formatMessage (name, id, avatar) { return { name, id, avatar, timestamp: Date.now(), save () { //save message } }} Both Shorthand Properties and Shorthand Method Names are just syntactic sugar over the previous ways we used to add properties to an object. However, because they're such common tasks, even the smallest improvements eventually add up.Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. 