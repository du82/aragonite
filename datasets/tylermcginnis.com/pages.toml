["https://tylermcginnis.com/this-keyword-call-apply-bind-javascript"]
title = 'Understanding the "this" keyword, call, apply, and bind in JavaScript'
description = "In this post you'll learn 5 rules for understanding JavaScript's 'this' keyword as well as JavaScript's bind, call, and apply array methods."
full_description = '''Understanding the "this" keyword, call, apply, and bind in JavaScriptBefore diving into the specifics of the this keyword in JavaScript, it's important to take a step back and first look at why the this keyword exists in the first place. The this keyword allows you to reuse functions with different contexts. Said differently, the "this" keyword allows you to decide which object should be focal when invoking a function or a method. Everything we talk about after this will build upon that idea. We want to be able to reuse functions or methods in different contexts or with different objects. The first thing we'll look at is how to tell what the this keyword is referencing. The first and most important question you need to ask yourself when you're trying to answer this question is "Where is this function being invoked?". The only way you can tell what the this keyword is referencing is by looking at where the function using the this keyword was invoked. To demonstrate this with an example you're already familiar with, say we had a greet function that took in a name an alerted a welcome message. function greet (name) { alert(`Hello, my name is ${name}`)} If I were to ask you exactly what greet was going to alert, what would your answer be? Given only the function definition, it's impossible to know. In order to know what name is, you'd have to look at the function invocation of greet. greet('Tyler') It's the exact same idea with figuring out what the this keyword is referencing. You can even think about the this keyword as you would a normal argument to a function - it's going to change based on how the function is invoked. Now that you know the first step to figuring out what the this keyword is referencing is to look at where the function is being invoked, what's next? To help us with the next step, we're going to establish 5 rules or guidelines. Implicit Binding Explicit Binding new Binding Lexical Binding window Binding Implicit Binding Remember, the goal here is to be able to look at a function definition using the this keyword and tell what this is referencing. The first and most common rule for doing that is called the Implicit Binding. I'd say it'll tell you what the this keyword is referencing about 80% of the time. Let's say we had an object that looked like this const user = { name: 'Tyler', age: 27, greet() { alert(`Hello, my name is ${this.name}`) }} Now, if you were to invoke the greet method on the user object, you'd do so be using dot notation. user.greet() This brings us to the main key point of the implicit binding rule. In order to figure out what the this keyword is referencing, first, look to the left of the dot when the function is invoked. If there is a "dot", look to the left of that dot to find the object that the this keyword is referencing. In the example above, user is to "the left of the dot" which means the this keyword is referencing the user object. So, it's as if, inside the greet method, the JavaScript interpreter changes this to user. greet() { // alert(`Hello, my name is ${this.name}`) alert(`Hello, my name is ${user.name}`) // Tyler} Let's take a look at a similar, but a slightly more advanced example. Now, instead of just having a name, age, and greet property, let's also give our user object a mother property which also has a name and greet property. const user = { name: 'Tyler', age: 27, greet() { alert(`Hello, my name is ${this.name}`) }, mother: { name: 'Stacey', greet() { alert(`Hello, my name is ${this.name}`) } }} Now the question becomes, what is each invocation below going to alert? user.greet()user.mother.greet() Whenever we're trying to figure out what the this keyword is referencing we need to look to the invocation and see what's to the "left of the dot". In the first invocation, user is to the left of the dot which means this is going to reference user. In the second invocation, mother is to the left of the dot which means this is going to reference mother. user.greet() // Tyleruser.mother.greet() // Stacey As mentioned earlier, about 80% of the time there will be an object to the "left of the dot". That's why the first step you should take when figuring out what the this keyword is referencing is to "look to the left of the dot". But, what if there is no dot? This brings us to our next rule - Explicit Binding Now, what if instead of our greet function being a method on the user object, it was just its own standalone function. function greet () { alert(`Hello, my name is ${this.name}`)} const user = { name: 'Tyler', age: 27,} We know that in order to tell what the this keyword is referencing we first have to look at where the function is being invoked. Now, this brings up the question, how can we invoke greet but have it be invoked with the this keyword referencing the user object. We can't just do user.greet() like we did before because user doesn't have a greet method. In JavaScript, every function contains a method which allows you to do exactly this and that method is named call. "call" is a method on every function that allows you to invoke the function specifying in what context the function will be invoked. With that in mind, we can invoke greet in the context of user with the following code - greet.call(user) Again, call is a property on every function and the first argument you pass to it will be the context (or the focal object) in which the function is invoked. In other words, the first argument you pass to call will be what the this keyword inside that function is referencing. This is the foundation of rule #2 (Explicit Binding) because we're explicitly (using .call), specifying what the this keyword is referencing. Now let's modify our greet function just a little bit. What if we also wanted to pass in some arguments? Say along with their name, we also wanted to alert what languages they know. Something like this function greet (l1, l2, l3) { alert( `Hello, my name is ${this.name} and I know ${l1}, ${l2}, and ${l3}` )} Now to pass arguments to a function being invoked with .call, you pass them in one by one after you specify the first argument which is the context. function greet (l1, l2, l3) { alert( `Hello, my name is ${this.name} and I know ${l1}, ${l2}, and ${l3}` )} const user = { name: 'Tyler', age: 27,} const languages = ['JavaScript', 'Ruby', 'Python'] greet.call(user, languages[0], languages[1], languages[2]) This works and it shows how you can pass arguments to a function being invoked with .call. However, as you may have noticed, it's a tad annoying to have to pass in the arguments one by one from our languages array. It would be nice if we could just pass in the whole array as the second argument and JavaScript would spread those out for us. Well good news for us, this is exactly what .apply does. .apply is the exact same thing as .call, but instead of passing in arguments one by one, you can pass in a single array and it will spread each element in the array out for you as arguments to the function. So now using .apply, our code can change into this (below) with everything else staying the same. const languages = ['JavaScript', 'Ruby', 'Python'] // greet.call(user, languages[0], languages[1], languages[2])greet.apply(user, languages) So far under our "Explicit Binding" rule we've learned about .call as well as .apply which both allow you to invoke a function, specifying what the this keyword is going to be referencing inside of that function. The last part of this rule is .bind. .bind is the exact same as .call but instead of immediately invoking the function, it'll return a new function that you can invoke at a later time. So if we look at our code from earlier, using .bind, it'll look like this function greet (l1, l2, l3) { alert( `Hello, my name is ${this.name} and I know ${l1}, ${l2}, and ${l3}` )} const user = { name: 'Tyler', age: 27,} const languages = ['JavaScript', 'Ruby', 'Python'] const newFn = greet.bind(user, languages[0], languages[1], languages[2])newFn() // alerts "Hello, my name is Tyler and I know JavaScript, Ruby, and Python" new Binding The third rule for figuring out what the this keyword is referencing is called the new binding. If you're unfamiliar with the new keyword in JavaScript, whenever you invoke a function with the new keyword, under the hood, the JavaScript interpreter will create a brand new object for you and call it this. So, naturally, if a function was called with new, the this keyword is referencing that new object that the interpreter created. function User (name, age) { /* Under the hood, JavaScript creates a new object called `this` which delegates to the User's prototype on failed lookups. If a function is called with the new keyword, then it's this new object that interpreter created that the this keyword is referencing. */ this.name = name this.age = age} const me = new User('Tyler', 27) Lexical Binding At this point, we're on our 4th rule and you may be feeling a bit overwhelmed. That's fair. The this keyword in JavaScript is arguably more complex than it should be. Here's the good news, this next rule is the most intuitive. Odds are you've heard of and used an arrow function before. They're new as of ES6. They allow you to write functions in a more concise format. friends.map((friend) => friend.name) Even more than conciseness, arrow functions have a much more intuitive approach when it comes to this keyword. Unlike normal functions, arrow functions don't have their own this. Instead, this is determined lexically. That's a fancy way of saying this is determined how you'd expect, following the normal variable lookup rules. Let's continue with the example we used earlier. Now, instead of having languages and greet as separate from the object, let's combine them. const user = { name: 'Tyler', age: 27, languages: ['JavaScript', 'Ruby', 'Python'], greet() {}} Earlier we assumed that the languages array would always have a length of 3. By doing so we were able to use hardcoded variables like l1, l2, and l3. Let's make greet a little more intelligent now and assume that languages can be of any length. To do this, we'll use .reduce in order to create our string. const user = { name: 'Tyler', age: 27, languages: ['JavaScript', 'Ruby', 'Python'], greet() { const hello = `Hello, my name is ${this.name} and I know` const langs = this.languages.reduce(function (str, lang, i) { if (i === this.languages.length - 1) { return `${str} and ${lang}.` } return `${str} ${lang},` }, "") alert(hello + langs) }} That's a lot more code but the end result should be the same. When we invoke user.greet(), we expect to see Hello, my name is Tyler and I know JavaScript, Ruby, and Python.. Sadly, there's an error. Can you spot it? Grab the code above and run it in your console. You'll notice it's throwing the error Uncaught TypeError: Cannot read property 'length' of undefined. Gross. The only place we're using .length is on line 9, so we know our error is there. if (i === this.languages.length - 1) {} According to our error, this.languages is undefined. Let's walk through our steps to figure out what that this keyword is referencing cause clearly, it's not referencing user as it should be. First, we need to look at where the function is being invoked. Wait? Where is the function being invoked? The function is being passed to .reduce so we have no idea. We never actually see the invocation of our anonymous function since JavaScript does that itself in the implementation of .reduce. That's the problem. We need to specify that we want the anonymous function we pass to .reduce to be invoked in the context of user. That way this.languages will reference user.languages. As we learned above, we can use .bind. const user = { name: 'Tyler', age: 27, languages: ['JavaScript', 'Ruby', 'Python'], greet() { const hello = `Hello, my name is ${this.name} and I know` const langs = this.languages.reduce(function (str, lang, i) { if (i === this.languages.length - 1) { return `${str} and ${lang}.` } return `${str} ${lang},` }.bind(this), "") alert(hello + langs) }} So we've seen how .bind solves the issue, but what does this have to do with arrow functions. Earlier I said that with arrow functions "this is determined lexically. That's a fancy way of saying this is determined how you'd expect, following the normal variable lookup rules." In the code above, following just your natural intuition, what would the this keyword reference inside of the anonymous function? For me, it should reference user. There's no reason to create a new context just because I had to pass a new function to .reduce. And with that intuition comes the often overlooked value of arrow functions. If we re-write the code above and do nothing but use an anonymous arrow function instead of an anonymous function declaration, everything "just works". const user = { name: 'Tyler', age: 27, languages: ['JavaScript', 'Ruby', 'Python'], greet() { const hello = `Hello, my name is ${this.name} and I know` const langs = this.languages.reduce((str, lang, i) => { if (i === this.languages.length - 1) { return `${str} and ${lang}.` } return `${str} ${lang},` }, "") alert(hello + langs) }} Again the reason for this because with arrow functions, this is determined "lexically". Arrow functions don't have their own this. Instead, just like with variable lookups, the JavaScript interpreter will look to the enclosing (parent) scope to determine what this is referencing. window Binding Finally is the "catch-all" case - the window binding. Let's say we had the following code function sayAge () { console.log(`My age is ${this.age}`)} const user = { name: 'Tyler', age: 27} As we covered earlier, if you wanted to invoke sayAge in the context of user, you could use .call, .apply, or .bind. What would happen if we didn't use any of those and instead just invoked sayAge as you normally would sayAge() // My age is undefined What you'd get is, unsurprisingly, My age is undefined because this.age would be undefined. Here's where things get a little weird. What's really happening here is because there's nothing to the left of the dot, we're not using .call, .apply, .bind, or the new keyword, JavaScript is defaulting this to reference the window object. What that means is if we add an age property to the window object, then when we invoke our sayAge function again, this.age will no longer be undefined but instead, it'll be whatever the age property is on the window object. Don't believe me? Run this code, window.age = 27 function sayAge () { console.log(`My age is ${this.age}`)} Pretty gnarly, right? That's why the 5th rule is the window Binding. If none of the other rules are met, then JavaScript will default the this keyword to reference the window object. As of ES5, if you have "strict mode" enabled, JavaScript will do the right thing and instead of defaulting to the window object will just keep "this" as undefined. 'use strict' window.age = 27 function sayAge () { console.log(`My age is ${this.age}`)} s'''
