title = "React Elements vs React Components"
description = "A guide to understanding the difference between Components and Elements in React."
full_description = '''React Elements vs React ComponentsA few months ago I had, what I thought, was a simple question that I posted to Twitter. // Function Definitionfunction add (x, y) { return x + y} // Function Invocationadd(1,2) // Component Definitionclass Icon extends Component // Component Invocation???<Icon /> What surprised me wasn’t the joint confusion around this question, but instead was the number of inaccurate responses I received. Instances / Instantiation Rendering Evaluation Invocation “Using it :)” The primary reason for the confusion is that there’s an often un-talked about abstraction layer between JSX and what’s actually going on in React land. To answer this question, we need to take a deep dive into that abstraction. Let’s start by looking at the absolute fundamentals of React. What is React? It’s a library for building user interfaces. No matter how complex React or the React ecosystem seem to be, this is React at its core — building UIs. With this in mind, we arrive at our first definition, an Element. Simply put, a React element describes what you want to see on the screen. Not so simply put, a React element is an object representation of a DOM node. Notice I used the word describe. It’s important to note that a React element isn’t actually the thing you’ll see on your screen. Instead, it’s just an object representation of it. There are a few reasons for this. The first is that JavaScript objects are lightweight — React can create and destroy these elements without too much overhead. The second reason is React can analyze the object, diff it with the previous object representation to see what changed. Then, React can update the actual DOM only where those changes occurred. This has some performance upsides to it. In order to create our object representation of a DOM node (aka a React element), we can use React's createElement method. const element = React.createElement( 'div', {id: 'login-btn'}, 'Login') createElement takes in three arguments. The first is a tag name string (div, span, etc), the second is any attributes you want the element to have, the third is the contents or the children of the element, in this case, the text "Login". The createElement invocation above is going to return an object that looks like this. { type: 'div', props: { children: 'Login', id: 'login-btn' }} When it’s rendered to the DOM (using ReactDOM.render), we’ll have a new DOM node that looks like this, <div id='login-btn'>Login</div> What’s interesting about learning React is that typically the first thing you’re taught are components. “Components are the building blocks of React”. Notice, however, that we started this post with elements. The reason for this is because once you understand elements, understanding components is a smooth transition. A component is a function or a Class which optionally accepts input and returns a React element. function Button ({ onLogin }) { return React.createElement( 'div', {id: 'login-btn', onClick: onLogin}, 'Login' )} By definition, we have a Button component which accepts an onLogin input and returns a React element. One thing to note is that our Button component receives an onLogin method as its prop. To pass that along to our object representation of the DOM, we pass it along as the second argument to createElement, just as we did our id attribute. Let’s go deeper. Up until this point we’ve only covered creating React elements with the type property of native HTML elements (span, div, etc), but you can also pass in other React components to the first argument of createElement. const element = React.createElement( User, {name: 'Tyler McGinnis'}, null) However, unlike with an HTML tag name, if React sees a class or a function as the first argument, it will then check to see what element it renders, given the corresponding props. React will continue to do this until there are no more createElement invocations which have a class or a function as their first argument. Let’s take a look at this in action. function Button ({ addFriend }) { return React.createElement( "button", { onClick: addFriend }, "Add Friend" )} function User({ name, addFriend }) { return React.createElement( "div", null, React.createElement( "p", null, name ), React.createElement(Button, { addFriend }) )} Above we have two components. A Button and a User. User’s object representation of the DOM will be a div with two children, a p which wraps the user’s name and a Button component. Now, let’s swap out the createElement invocations with what they return, function Button ({ addFriend }) { return { type: 'button', props: { onClick: addFriend, children: 'Add Friend' } }} function User ({ name, addFriend }) { return { type: 'div', props: { children: [ { type: 'p', props: { children: name } }, { type: Button, props: { addFriend } } ] } }} You’ll notice in the above code we have four different type properties, button, div, p, and Button. When React sees an element with a function or class type (like our type: Button above), it will then consult with that component to know which element it returns, given the corresponding props. With that in mind, at the end of this process, React has a full object representation of the DOM tree. In our example, that will look like this, { type: 'div', props: { children: [ { type: 'p', props: { children: 'Tyler McGinnis' } }, { type: 'button', props: { onClick: addFriend, children: 'Add Friend' } } ] }} This whole process is called reconciliation in React and it’s triggered every time setState or ReactDOM.render is called. So now let’s again take a look at our initial question that sparked this blog post, // Function Definitionfunction add (x, y) { return x + y} // Function Invocationadd(1,2) // Component Definitionfunction Icon () {} // Component Invocation???<Icon /> At this point, we have all the knowledge we need to answer this question except for one crucial piece. Odds are, if you’ve been using React for any amount of time, you don’t use React.createElement to create your object representations of the DOM. Instead, you’re probably using JSX. Earlier I wrote, “The primary reason for the confusion is that there’s an often un-talked about abstraction layer between JSX and what’s actually going on in React land”. This abstraction layer is that JSX is always going to get compiled to React.createElement invocations (typically) via Babel. Looking at our earlier example, this code function Button ({ addFriend }) { return React.createElement( "button", { onClick: addFriend }, "Add Friend" )} function User({ name, addFriend }) { return React.createElement( "div", null, React.createElement( "p", null, name ), React.createElement(Button, { addFriend }) )} is the result of this JSX being compiled. function Button ({ addFriend }) { return ( <button onClick={addFriend}>Add Friend</button> )} function User ({ name, addFriend }) { return ( <div> <p>{name}</p> <Button addFriend={addFriend}/> </div> )} So finally, what do we call it when we write out our component like this, <Icon/>? We can call it “creating an element” because after the JSX is compiled, that’s exactly what’s happening. React.createElement(Icon, null) All of these examples are “creating a React element”. React.createElement( 'div', { className: 'container' }, 'Hello!') <div className='container'>Hello!</div> <Hello />Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but @tylermcginnis doesn’t miss with the Bytes email. If you’re a developer, you really need to subscribeAli Spittel@aspittelCan I just say that I giggle every time I get the @uidotdev email each week? You should definitely subscribe.Chris Finn@thefinnomenonEvery JavaScript programmer should be subscribed to the newsletter from @uidotdev. Not only do they manage to succinctly cover the hot news in the JavaScript world for the week but it they manage to add a refreshing humor to it all.'''
