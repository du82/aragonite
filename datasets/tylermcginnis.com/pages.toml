["https://tylermcginnis.com/react-router-v4-pass-props-to-components"]
title = "Pass props to a component rendered by React Router v4"
description = "In this post you'll learn how to pass props to components being rendered by React Router v4."
full_description = '''Pass props to a component rendered by React Router v4Check your versionThis post assumes you're using React Router v4. If not, find your version below.React Router v5React Router v6 React Router v4 uses a declarative, component-based approach to routing. What that means is when you want to create a new route, you render a Route component. Route allows you to map URL paths to different React components. For example, say we wanted to render the Dashboard component whenever a user navigates to the /dashboard path. To do that, we'd render a Route that looks like this. <Route path="/dashboard" component={Dashboard} /> Now, what if we also wanted to pass the Dashboard component a prop? There are a few different ways to solve this problem but only one right way. The first idea you might have is to just pass it as a prop on Route. <Route path="/dashboard" component={Dashboard} isAuthed={true} /> Unfortunately, this won't work. React Router won't forward that prop onto the component. Instead, it will just ignore it. The next idea you might have, and a pattern I've seen a few places is to pass component an inline function that creates the React element. <Route path="/dashboard" component={() => <Dashboard isAuthed={true} />} /> Though technically this will work, it's not the best solution. The reason for this is because of performance. According to the official React Router v4 docs... "When you use component, the router uses React.createElement to create a new React element from the given component. That means if you provide an inline function to the component attribute, you would create a new component every render. This results in the existing component unmounting and the new component mounting instead of just updating the existing component." So if you're not supposed to pass a function to component, what's the solution? Instead of using the component prop, use the render prop. render accepts a functional component and that function won't get unnecessarily remounted like with component. That function will also receive all the same props that component would receive so you can pass those through to the rendered component. <Route path="/dashboard" render={(props) => <Dashboard {...props} isAuthed={true} />}/> So to recap, if you need to pass a prop to a component being rendered by React Router v4, instead of using Routes component prop, use its render prop. With render, you're in charge of creating the element and can pass the component any props you'd like.Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but 