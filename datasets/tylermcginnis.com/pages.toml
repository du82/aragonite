["https://tylermcginnis.com/react-router-v4-handling-404-pages"]
title = "Handling 404 pages (catch all routes) with React Router v4"
description = "In this post you'll learn how to implement catch all routes for handling 404 pages with React Router v4."
full_description = '''Handling 404 pages (catch all routes) with React Router v4Check your versionThis post assumes you're using React Router v4. If not, find your version below.React Router v5React Router v6 A common use case for when you're building a web app is to have a "catch all" route that will be rendered if none of your other routes match. A common example of this would be a 404 page. To see how this works with React Router v4, let's first render a navbar with the following paths - /, /will-match, /will-not-match, and /also/will/not/match. import React from "react";import { BrowserRouter as Router, Route, Link } from "react-router-dom"; class App extends React.Component { render() { return ( <Router> <div> <ul> <li> <Link to="/">Home</Link> </li> <li> <Link to="/will-match">Will Match</Link> </li> <li> <Link to="/will-not-match">Will Not Match</Link> </li> <li> <Link to="/also/will/not/match">Also Will Not Match</Link> </li> </ul> </div> </Router> ); }} export default App; Now that we have the navbar set up, let's create three different components to render - Home, which will match on /, WillMatch which will match on /will-match, and NoMatch, which will be the catch-all component which will render only if none of the other Route's match. const Home = () => <h1>Home</h1>; const WillMatch = () => <h3>Matched!</h3>; const NoMatch = ({ location }) => ( <h3> No match for <code>{location.pathname}</code> </h3>); Now that we have the components which are going to be rendered, we need to actually render some Routes. Home and WillMatch are straight forward, you just render them as you normally would. render() { return ( <Router> <div> <ul> <li><Link to="/">Home</Link></li> <li><Link to="/will-match">Will Match</Link></li> <li><Link to="/will-not-match">Will Not Match</Link></li> <li><Link to="/also/will/not/match">Also Will Not Match</Link></li> </ul> <Route path="/" exact component={Home}/> <Route path="/will-match" component={WillMatch}/> </div> </Router> )} Now the question becomes, how do we render NoMatch? Remember, we only want to render NoMatch if both the / and /will-match Routes don't match. There are two parts to accomplishing this - the first is that if you render a Route but don't specify a path prop, that route will always match and render the component. Let's do that for our NoMatch component. <Route path="/" exact component={Home}/><Route path="/will-match" component={WillMatch}/><Route component={NoMatch} /> That's closer, but if you play around with the app, you know we're not done yet. Now the app renders the Home and WillMatch components properly but it also always renders the NoMatch component no matter what path we're on. What we need is a way to tell React Router v4 that we only want to render the first Route that matches - even if there's more than one match. By doing this, our NoMatch component will only get rendered if the two Routes above it, / and /will-match aren't matched. The good news is React Router v4 comes with a component that does exactly this and it's called Switch. By wrapping your Routes inside of Switch, React Router will only render the first Route that matches. render() { return ( <Router> <div> <ul> <li><Link to="/">Home</Link></li> <li><Link to="/will-match">Will Match</Link></li> <li><Link to="/will-not-match">Will Not Match</Link></li> <li><Link to="/also/will/not/match">Also Will Not Match</Link></li> </ul> <Switch> <Route path="/" exact component={Home}/> <Route path="/will-match" component={WillMatch}/> <Route component={NoMatch} /> </Switch> </div> </Router> )} Now if the user isn't at / or /will-match, the NoMatch component will be rendered. You can utilize this same pattern to render a client-side 404 page if none of your other Routes match. <Switch> <Route exact path="/" component={Home} /> <Route exact path="/profile" component={Profile} /> <Route component={FourZeroFour} /></Switch>Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but @tylermcginnis doesn’t miss with the Bytes email. If you’re a developer, you really need to subscribeAli Spittel@aspittelCan I just say that I giggle every time I get the @uidotdev email each week? You should definitely subscribe.Chris Finn@thefinnomenonEvery JavaScript programmer should be subscribed to the newsletter from @uidotdev. Not only do they manage to succinctly cover the hot news in the JavaScript world for the week but it they manage to add a refreshing humor to it all.'''
