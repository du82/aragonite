title = "Learn TypeScript"
description = "Our course is the complete guide that takes you from zero to TypeScript hero."
full_description = "TypeScriptOur course is the complete guide that takes you from zero to TypeScript hero.Get started today“I loved the course!”-Adithya NR“The course is awesome!”-Tsvetan RusenovLogos: Apple, Netflix, Microsoft, Netlify, Uber, Tesla, Amazon, SpotifyYou’ll be in great company with other developers we’ve trainedWant to skip the docs?There’s an easier way to master TypeScript.Our linear course is like having a smart, experienced friend sit down next to you, walk you through each concept, and apply what you learn. It’s our secret sauce.Ingredients:Non-contextual introductionQuizNon-Contextual practiceContextual practiceRepeat For Each TopicReal-world project01TypeScript OverviewIn this section, we’ll answer that question in regards to TypeScript as well as cover some other programming fundamentals that TypeScript utilizes.LessonQuizBonus02Typing in JavaScriptTypes are fundamental to TypeScript, so naturally you’ll need to be familiar with the base types that exist in JavaScript.LessonQuizPracticeProject03Getting TypeScript ConfiguredTypeScript is both a type checker and a compiler, so you’ll need to install it to use it with your projects. You’ll also learn about the most important configuration settings for TypeScript.Lesson04Basic Type CheckingNow that you’re all set up, you can start writing TypeScript code! You’ll learn about the TypeScript type checker and how to write type annotations when the type checker can’t automatically infer them.LessonQuizPractice05Special TypeScript TypesTypeScript includes a few special types which it uses to augment the types that come with JavaScript. You’ll learn how you can use these to add better type safety to your programs.LessonQuizPractice06Project: Tic Tac ToeWe’ll make Tic Tac Toe using TypeScript so you can get a feel for how to write type definitions that match the data structures you use in your code.Project07Advanced TypeScript TypesTypeScript comes with its own set of operators which you can use to transform your types. You’ll also learn about some special ways to add type annotations to functions.LessonQuizPractice08ClassesIn this section you’ll learn about how to define classes and some special features that TypeScript provides to give your classes a bit of extra type safety.LessonQuizPracticeProject09GenericsJust like you can write functions to reuse code, you can write generic types to reuse type definitions throughout your codebase. We’ll even look at a real-world library to see how it uses generics.LessonQuizPracticeProject10Type NarrowingOften, you’ll find that you have a value that could be several different types. How can you tell what type it actually is? Once you learn about Type Narrowing, you can add runtime checks to determine the type of any value.LessonQuizPractice11ModulesModules are all about getting code from one file into another file. TypeScript has a nuanced approach to modules, so you’ll learn what things to watch out for as you use modules in your TypeScript code.LessonQuizPractice12ModulesModules are all about getting code from one file into another file. TypeScript has a nuanced approach to modules, so you’ll learn what things to watch out for as you use modules in your TypeScript code.LessonQuizPractice13Declaration FilesYou’ll learn about the type definitions that ship with TypeScript, third-party type definitions, and how to write your own type definitions for third-party modules.LessonQuizPractice14Extra TopicsIn this section you’ll learn about all the things that don’t really fit with the normal flow of the course.LessonQuizPractice15Project: Web ServerNow that we know a bit more about configuring TypeScript, we’ll use this knowledge to write a Node.js server using TypeScript. We’ll handle the request and response object, create a few routes, and even grab some dynamic data.ProjectMake it clickEverything you need to know to master TypeScriptGet that money.Learn TypeScriptSet a strong foundation working with TypesGet hands on practical experience with TypeScriptLevel up your skills to get that raiseAdithya NRDeveloperI loved the course! I learned a lot about TypeScript in a short period of time, thanks to this course.Baiaman KasymbaevDeveloperAs I developer who has been using TypeScript for 2 years a learnt a lot! It’s not too fetched while managing to cover every topic. It’s also great that I have an option to choose between text and video materials.Albert Vila CalvoDeveloperGood course, highly recommended, with plenty of content. It doesn’t simply cover the basics, but instead goes deep into advanced things like type transformations. Note that it’s though and quite long, so it will take some time and effort to complete it.Miika LuiroDeveloperThis course certainly delivered what it had promised! After this course I have a comprehensive view of TypeScript and I’m confident to start using it in my next project.Jordan GibbingsDeveloperThis is my first course with ui.dev, the experience thus far has been great! Absolutely lives up to the advertised quality. The pacing, structure and focused content is a breath of fresh air compared to cookie-cutter courses found elsewhere. Learning a ton and enjoying every minute of it.Developers love our content (and we think you will too).Over 1 million YouTube views this yearOver 80k developers have taken our coursesOver 100k developers read our newslettersui.devLoginBlogReviewsTermsPrivacyCode of ConductnpmtrendsuseHooksBytesReact Newsletterreact.ggquery.ggSign Up For BytesDelivered to over 200,000 web developers every Monday and ThursdayGet Bytes Today"
