description = "Still using Class based React components at work? This is the course for you."
full_description = "Classic ReactStill using Class based React components at work? This is the course for you.Get started today“Really enjoyed it!”-Julia Nething“Awesome course.”-Juan P.Logos: Apple, Netflix, Microsoft, Netlify, Uber, Tesla, Amazon, SpotifyYou’ll be in great company with other developers we’ve trainedBreak out of Tutorial Hell.Stop reading out-of-date tutorials and watching crappy screen-share videos. We use a linear approach to take you step by step from the fundamental building blocks of React — all the way to building real-world applications from with confidence.And it’s all thanks to our secret sauce...Ingredients:Non-contextual introductionQuizNon-Contextual practiceContextual practiceRepeat For Each TopicReal-world project01React OverviewIn this section, we’ll answer that question in regards to React as well as cover some other programming fundamentals that React utilizes.LessonQuizBonus02The Road to Hello WorldThere’s more to learning how to build React apps than React itself. In this section you’ll learn those topics which include NPM and Webpack.LessonQuizPracticeProject03Passing Data to ComponentsWith any component based system you need a way to pass data into component. In this section, we’ll cover how to do that in React with props.LessonQuizPractice04Rendering ListsAs a front-end developer, you eventually come to the reality that you’re a glorified list creator. In this section you’ll learn how to create performant lists in React.LessonQuizPracticeProject05Managing StateComponents managing their own state is part of what makes React so special. In this section you’ll learn how to do that as well as some pitfalls to watch out for.LessonQuizPracticeProject06Functional ComponentsWith React there are two ways to create components. In this section, you’ll learn one of those ways utilizing pure functions.LessonQuizProject07Validating Props with PropTypesThings go wrong when you get your types mixed up. In this section you’ll learn how to minimize that by using PropTypes.LessonQuizPracticeProject08The Component LifecycleReact exposes various methods that allow you to hook into the component life-cycle. In this section you’ll learn what those methods are as well as pitfalls to avoid.LessonQuizProject09Handling Form StateHandling form state can be different than handling component state in React. In this section you’ll learn both approaches as well as their tradeoffs.LessonProject10Building Reuseable ComponentsWhat good would a component model be without reusability. In this section you’ll learn how to create highly reusable React components.LessonProject11Bypassing Props with React ContextSometimes you need to pass data deep into the component tree. In this section you’ll learn how to do that using React’s context feature.LessonQuizProject12Code Sharing in ReactThe problem is coupling UI to a component is it makes it hard to reshare non-visual logic. In this section you’ll learn two strategies for best accomplishing that - Higher-order components and Render Props.LessonQuizProject13Code Sharing in ReactThe problem is coupling UI to a component is it makes it hard to reshare non-visual logic. In this section you’ll learn two strategies for best accomplishing that - Higher-order components and Render Props.LessonQuizProject14Better Classes with Class FieldsIn this section you’ll learn how to utilize JavaScript’s new Class Fields feature to make your React components more concise.LessonQuizProject15React RouterReact Router is the most popular routing solution for React. In this section you’ll learn its philosophy as well as how to use it.LessonQuizProject16Production Builds and HostingIn this section you’ll not only learn how to host a React application, but first how to build your React app for production to make it more performant.LessonQuizProject17Performance Gains with Code SplittingIn this section you’ll learn how to code split your applications for increased performance gains.LessonQuizProject18Bonus 