title = "Compiling vs Polyfills with Babel (JavaScript)"
description = "In this post you'll learn the difference between compiling your code and polyfilling it. It's both simpler and more complex than you'd expect."
full_description = '''Compiling vs Polyfills with Babel (JavaScript)JavaScript is a living language that's constantly progressing. As a developer, this is great because we're constantly learning and our tools are constantly improving. The downside of this is that it typically takes browsers a few years to catch up. Whenever a new language proposal is created, it needs to go through five different stages before it's added to the official language specification. Once it's part of the official spec, it still actually needs to be implemented into every browser you think your users will use. Because of this delay, if you ever want to use the newest JavaScript features, you need to either wait for the latest browsers to implement them (and then hope your users don't use older browsers) or you need to use a tool like Babel to compile your new, modern code back to code that older browsers can understand. When it's framed like that, it's almost certain that a compiler like Babel will always be a fundamental part of building JavaScript applications, assuming the language continues to progress. Again, the purpose of Babel is to take your code which uses new features that browsers may not support yet, and transform it into code that any browser you care about can understand. So for example, code that looks like this, const getProfile = username => { return fetch(`https://api.github.com/users/${username}`) .then((response) => response.json()) .then(({ data }) => ({ name: data.name, location: data.location, company: data.company, blog: data.blog.includes('https') ? data.blog : null })) .catch((e) => console.warn(e))} would get compiled into code that looks like this, var getProfile = function getProfile(username) { return fetch('https://api.github.com/users/' + username).then(function (response) { return response.json(); }).then(function (_ref) { var data = _ref.data; return { name: data.name, location: data.location, company: data.company, blog: data.blog.includes('https') ? data.blog : null }; }).catch(function (e) { return console.warn(e); });}; You'll notice that most of the ES6 code like the Arrow Functions and Template Strings have been compiled into regular old ES5 JavaScript. There are, however, two features that didn't get compiled: fetch and includes. The whole goal of Babel is to take our "next generation" code (as the Babel website says) and make it work in all the browsers we care about. You would think that includes and fetch would get compiled into something native like indexOf and XMLHttpRequest, but that's not the case. So now the question becomes, why didn't fetch or includes get compiled? fetch isn't actually part of ES6 so that one at least makes a little bit of sense assuming we're only having Babel compile our ES6 code. includes, however, is part of ES6 but still didn't get compiled. What this tells us is that compiling only gets our code part of the way there. There's still another step, that if we're using certain new features, we need to take - polyfilling. What's the difference between compiling and polyfilling? When Babel compiles your code, what it's doing is taking your syntax and running it through various syntax transforms in order to get browser compatible syntax. What it's not doing is adding any new JavaScript primitives or any properties you may need to the browser's global namespace. One way you can think about it is that when you compile your code, you're transforming it. When you add a polyfill, you're adding new functionality to the browser. If this is still fuzzy, here are a list of new language features. Try to figure out if they are compiled or if they need to be polyfilled. Arrow FunctionsClassesPromisesDestructuringFetchString.includes Arrow functions: Babel can transform arrow functions into regular functions, so, they can be compiled. Classes: Like Arrow functions, Class can be transformed into functions with prototypes, so they can be compiled as well. Promises: There's nothing Babel can do to transform promises into native syntax that browsers understand. More important, compiling won't add new properties, like Promise, to the global namespace so Promises need to be polyfilled. Destructuring: Babel can transform every destructured object into normal variables using dot notation. So, compiled. Fetch: fetch needs to be polyfilled because, by the definition mentioned earlier, when you compile code you're not adding any new global or primitive properties that you may need. fetch would be a new property on the global namespace, therefore, it needs to be polyfilled. String.includes: This one is tricky because it doesn't follow our typical routine. One could argue that includes should be transformed to use indexOf, however, again, compiling doesn't add new properties to any primitives, so it needs to be polyfilled. Here's a pretty extensive list from the Babel website as to what features are compiled and what features need to be polyfilled. Features that need to be compiled Arrow functionsAsync functionsAsync generator functionsBlock scopingBlock scoped functionsClassesClass propertiesComputed property namesConstantsDecoratorsDefault parametersDestructuringDo expressionsExponentiation operatorFor-ofFunction bindGeneratorsModulesModule export extensionsNew literalsObject rest/spreadProperty method assignmentProperty name shorthandRest parametersSpreadSticky regexTemplate literalsTrailing function commasType annotationsUnicode regex Features that need to be polyfilled ArrayBufferArray.fromArray.ofArray#copyWithinArray#fillArray#findArray#findIndexFunction#nameMapMath.acoshMath.hypotMath.imulNumber.isNaNNumber.isIntegerObject.assignObject.getOwnPropertyDescriptorsObject.isObject.entriesObject.valuesObject.setPrototypeOfPromiseReflectRegExp#flagsSetString#codePointAtString#endsWithString.fromCodePointString#includesString.rawString#repeatString#startsWithString#padStartString#padEndSymbolWeakMapWeakSet Because adding new features to your project isn't done very often, instead of trying to memorize what's compiled and what's polyfilled, I think it's important to understand the general rules behind the two concepts, then if you need to know if you should include a polyfill for a specific feature, check Babel's website.Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but @tylermcginnis doesn’t miss with the Bytes email. If you’re a developer, you really need to subscribeAli Spittel@aspittelCan I just say that I giggle every time I get the @uidotdev email each week? You should definitely subscribe.Chris Finn@thefinnomenonEvery JavaScript programmer should be subscribed to the newsletter from @uidotdev. Not only do they manage to succinctly cover the hot news in the JavaScript world for the week but it they manage to add a refreshing humor to it all.'''
