set the default value of a function’s parameter if one is not given when the function is invoked.LessonQuiz09Spread OperatorIn this section you’ll learn how you can use ES6’s ‘Spread Operator’ to spread out an array or object into a function’s arguments.LessonQuiz10Compiling vs PolyfillsIn this section you’ll learn the difference between compiling your code and polyfilling it as well as why that matters.LessonQuiz11Async JavaScriptIn this section you’ll take a step back in time to learn how the way we manage asynchronous JavaScript code has changed from Callbacks, to Promises, to Async/Await.LessonQuiz12ClassesIn this section you’ll learn all about ES6 Classes by looking at how Classes work under the hood with the Prototype Chain.LessonQuiz13JavaScript ModulesIn this section you’ll get a history lesson by learning how JavaScript modules used to work in the past as well as how they work today.LessonQuiz14Class FieldsIn this section you’ll learn how to utilize JavaScript’s new Class Fields feature to make your Classes more concise.LessonQuizMake it clickEverything you need to know to master Modern JavaScriptGet that money.Learn Modern JavaScriptLearn the latest features in JavaScriptGain a deep understanding of the ins and outs of ES6Level up your skills to get that raiseAntonio P.DeveloperEasily a five! While I was familiar with the topics I found I learned something new in each section. Specifically the ES modules, I didn’t know it was now possible to implement that without Babel. I thoroughly enjoyed the course, thank you for making it!Steve HanlonDeveloperYour explanations are stellar and worth 5 stars! Thank you for such clear explanations. The course was very helpful.Clarissa GaytonDeveloperWhat a gem! I’ve just completed a bootcamp and have been studying on my own for quite some time now. I spent a few weeks doing research on the best online courses to take that would solidify the knowledge I already have and I’m sad to say I didn’t find Tyler McGinnis earlier.