["https://tylermcginnis.com/react-router-v5-url-parameters"]
title = "URL Parameters with React Router v5"
description = "URL parameters are a fundamental aspect of building web applications. In this post you'll learn how to utilize URL Parameters with React Router v5."
full_description = '''URL Parameters with React Router v5Check your versionThis post assumes you're using React Router v5. If not, find your version below.React Router v4React Router v6 URL parameters are parameters whose values are set dynamically in a page's URL. This allows a route to render the same component (UI) while passing that component the dynamic portion of the URL so it can change based off of it. Take Twitter for example. Regardless of which profile you go to, Twitter is going to show you the same UI just with different data. They do this by utilizing URL Parameters. If rendered by React Router v5, the Route for the profile pages may look like this. <Route path="/:handle"> <Profile /></Route> Notice that the path has a : in front of it. That's because it's dynamic. Instead of matching literally, it's matching for a specific pattern. With this app, anytime someone visits a route that matches that pattern (/tylermcginnis, /dan_abramov, /anything), the Profile component is going to be rendered. Now the question becomes, how do we access the dynamic portion of the URL (in this case, handle) from the component that's rendered? As of React Router v5.1, React Router ships with a custom Hook that does just this, useParams. useParams returns an object with a mapping between the URL Parameter and its value. import * as React from 'react'import { useParams } from 'react-router-dom' function Profile () { const [user, setUser] = React.useState(null) const { handle } = useParams() React.useEffect(() => { fetch(`https://api.twitter.com/user/${handle}`) .then(setUser) }, handle) return ( ... )} Now let's look at the example from the React Router v5 docs. It's a simple app that allows us to navigate between 4 different "accounts" - netflix, zillow-group, yahoo, and module-create. Each account will have its own page, similar to Twitter we saw earlier. First, let's import the components we'll need and create our navbar for linking between the different accounts. import * as React from "react";import { BrowserRouter as Router, Link } from "react-router-dom"; export default function App() { return ( <Router> <React.Fragment> <h2>Accounts</h2> <ul> <li> <Link to="/netflix">Netflix</Link> </li> <li> <Link to="/zillow-group">Zillow Group</Link> </li> <li> <Link to="/yahoo">Yahoo</Link> </li> <li> <Link to="/modus-create">Modus Create</Link> </li> </ul> </React.Fragment> </Router> );} Now that we can navigate between our different accounts, we need to actually render some UI for each account page. To keep things simple, we'll create a component that just renders the name of the account, i.e. the URL Parameter. Again, in order to get access to the URL Parameter with React Router v5, you use the useParams Hook. function Account() { const { account } = useParams(); return <h3>ID: {account}</h3>;} Now that we have our links and the component to render, let's create our Route with a URL Parameter. Like we saw earlier with Twitter, the pattern we want to use is /:account. export default function App() { return ( <Router> <React.Fragment> <h2>Accounts</h2> <ul> <li> <Link to="/netflix">Netflix</Link> </li> <li> <Link to="/zillow-group">Zillow Group</Link> </li> <li> <Link to="/yahoo">Yahoo</Link> </li> <li> <Link to="/modus-create">Modus Create</Link> </li> </ul> <Route path="/:account"> <Account /> </Route> </React.Fragment> </Router> );} And that's it. Because we're using a URL parameter, we can have four different paths render the same component and that component can get access to the dynamic URL Parameter via React Router v5's useParams Hook.Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but @tylermcginnis doesn’t miss with the Bytes email. If you’re a developer, you really need to subscribeAli Spittel@aspittelCan I just say that I giggle every time I get the @uidotdev email each week? You should definitely subscribe.Chris Finn@thefinnomenonEvery JavaScript programmer should be subscribed to the newsletter from @uidotdev. Not only do they manage to succinctly cover the hot news in the JavaScript world for the week but it they manage to add a refreshing humor to it all.'''
