["https://tylermcginnis.com/react-router-v4-query-strings"]
title = "Query Strings with React Router v4"
description = "In this post we'll break down how to implement and parse query strings with React Router v4."
full_description = '''Query Strings with React Router v4Check your versionThis post assumes you're using React Router v4. If not, find your version below.React Router v5React Router v6 When you're building for the web, sometimes you need to pass information via the URL. To do this, you can use a query string. You've probably seen them before IRL. Here's an example from Twitter's analytics page. This URL has three route parameters and two query strings. Twitter is using query strings to tell its route to filter the Tweets by top (most popular) and that the origin was im (which I'm not sure what that means, TBH). With that said, odds are you're not here to learn what query strings are but instead how to use them with React Router v4. The good news is that if you're already comfortable with React Router v4, there are just a few small details you need to know. Let's say we were Twitter and we were building the Route for the URL above. It would probably look something like this. <Route path={`${match.path}/tweets`} component={Tweets} /> Notice at this point there's nothing new. We don't account for the query string when we create the Route. Instead, we parse them inside the component that is being rendered when that path matches - in this case, Tweets. Now the question becomes, how do we actually do this? If you poke around on the location object that is passed to all components rendered by React Router v4, you'll notice that it has a search property on it. componentDidMount() { console.log(this.props.location.search) // "?filter=top&origin=im"} Cool, but this is the literal query string. You'll need to somehow parse it before you can get the actual values. You may be surprised to hear that React Router v4 doesn't come with built-in support for parsing query strings. The reason for this is because, over the years, there have been many requests to support different implementations. With that, the team decided it would be best for users to decide what the implementation looks like rather than baking in a "one size fits all" solution. Regardless, what that means is that you'll need to bring your own query-string parser. There are two common solutions. Either use a browser API (that may not be supported by all the browsers you need) or use an external library for parsing the query string. The library I typically use is the query-string library on NPM. With that library installed, all we need to do is call queryString.parse passing in our location.search. That will parse the query string into an object which we can then grab the values off of. import queryString from 'query-string' ... componentDidMount() { const values = queryString.parse(this.props.location.search) console.log(values.filter) // "top" console.log(values.origin) // "im"} That's it. Go parse those query strings.Before you leaveI know, another newsletter pitch - but hear me out. Most JavaScript newsletters are terrible. When’s the last time you actually looked forward to getting one? Even worse, when’s the last time you actually read one? We wanted to change that.We call it Bytes, but others call it their favorite newsletter.Delivered to over 200,000 web developers every Monday and ThursdayGet Bytes TodaySdu@sduduzo_gThis is the first ever newsletter that I open a music playlist for and maximize my browser window just to read it in peace. Kudos to @uidotdev for great weekly content.Brandon Bayer@flybayerThe Bytes newsletter is a work of art! It’s the only dev newsletter I’m subscribed too. They somehow take semi boring stuff and infuse it with just the right amount of comedy to make you chuckle.John Hawley@johnhawlyBytes has been my favorite newsletter since its inception. It’s my favorite thing I look forward to on Mondays. Goes great with a hot cup of coffee!Garrett Green@garrettgreenI subscribe to A LOT of dev (especially JS/TS/Node) newsletters and Bytes by @uidotdev is always such a welcomed, enjoyable change of pace to most (funny, lighthearted, etc) but still comprehensive/useful.Muhammad@mhashim6_Literally the only newsletter I’m waiting for every week.Grayson Hicks@graysonhicksBytes is the developer newsletter I most look forward to each week. Great balance of content and context! Thanks @uidotdev.Mitchell Wright@mitchellbwrightI know I’ve said it before, but @tylermcginnis doesn’t miss with the Bytes email. If you’re a developer, you really need to subscribeAli Spittel@aspittelCan I just say that I giggle every time I get the @uidotdev email each week? You should definitely subscribe.Chris Finn@thefinnomenonEvery JavaScript programmer should be subscribed to the newsletter from @uidotdev. Not only do they manage to succinctly cover the hot news in the JavaScript world for the week but it they manage to add a refreshing humor to it all.'''
