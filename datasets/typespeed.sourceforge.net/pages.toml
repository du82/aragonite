title = "Home of Typespeed"
full_description = 'You can play typespeed for your own or with a friend using TCP/IPv4. These options are called Single player and Multiplayer respectively. Typespeed is written in C and uses curses to display the menu and game. The network code is written using core library functions. Generally any POSIX-compatible system with a curses library and some advanced functions (like snprintf(), etc.) should work, although development concentrates on GNU/Linux (x86_64) and ncurses. Feel free to contribute patches for your system, too! Beside of that the following systems have been tested and/or have maintained ports: If you are interested in previous versions of typespeed, please look at download page for typespeed on sourceforge.net. Date Source Code Fedora Core 6 Mandriva 2008 PS2 Linux Slackware Windows 2008-08-13 typespeed-0.6.5.tar.gz yes yes 2007-12-01 typespeed-0.6.4.tar.gz yes 2007-11-02 typespeed-0.6.3.tar.gz yes yes yes 2007-06-01 typespeed-0.6.2.tar.gz yes yes yes yes 2007-03-16 typespeed-0.6.1.tar.gz yes yes yes yes 2007-01-19 typespeed-0.6.0.tar.gz yes yes yes rpm (i386) srpm typespeed-0.6.2-1fc6.i386.rpm typespeed-0.6.2-1fc6.src.rpm typespeed-0.6.1-1fc6.i386.rpm typespeed-0.6.1-1fc6.src.rpm rpm (mipsel) srpm typespeed-0.6.3-1.mipsel.rpm typespeed-0.6.3-1ps2.src.rpm typespeed-0.6.2-1.mipsel.rpm typespeed-0.6.2-1ps2.src.rpm typespeed-0.6.1-1.mipsel.rpm typespeed-0.6.1-1ps2.src.rpm typespeed-0.6.0-1.mipsel.rpm typespeed-0.6.0-1ps2.src.rpm tgz (i486) typespeed-0.6.5-i486-1kan.tgz typespeed-0.6.2-i486-1kan.tgz typespeed-0.6.1-i486-1kan.tgz typespeed-0.6.0-i486-1kan.tgz zip (i686) typespeed-0.6.5-1.zip typespeed-0.6.4-1.zip typespeed-0.6.3-1.zip typespeed-0.6.2-1.zip typespeed-0.6.1-1.zip typespeed-0.6.0-1.zip These packages are compiled with MinGW 5.1.3 and pdcurses on Windows XP. Version 0.6.3 and newer also include parts of gettext 0.16.1 and libiconv 1.11 as DLLs. All required changes that had to be done are available in zip (in directory "docs"). Please note that not all functionality of typespeed is included in this port yet.'
