full_description = "TYPO3 remote days Every 15th of a month, the TYPO3 remote days are taking place. Members of the TYPO3 teams met online and collaborate.What is that?We meet on every 15th and 25th of the month in the year 2023 (from midnight to midnight).We work on prepared tasksEverybody is welcome to joinIf you contribute to prepared team task and your contribution is approved by the team leader of this team, you may order food and beverages. These costs can be reimbursed and will be paid by the Association Tool: reimbursement.typo3.com (login with your typo3.org credentials) Requirements: Maximum 30,- EUR per contributor per day, Provable via bill, Food or beverages, No strong alcoholVoice ChatWe are using discord for voice chat and screen sharing. Join the official TYPO3 Discord server (possible via my.typo3.org) and come to the t3o team channel.ParticipateJust enter your name at https://notes.typo3.org/remote-days-2023 (at the next event) or join via discord. Pick up a project, where you like to contribute frontend editing for typo3.org We can offer an acknowledgement of € 1,200.00, if you deliver this feature. Get in touch with our team, if you want to take over responsibility. show Migration to EXT:container We can offer an acknowledgement of € 2,000.00, if you deliver this feature. Get in touch with our team, if you want to take over responsibility. show Refactoring frontend code and tooling We can offer an acknowledgement of € 3,000.00, if you deliver this feature. Get in touch with our team, if you want to take over responsibility. show Restructure content on typo3.org homepage We can offer an acknowledgement of € 2,500.00, if you deliver this feature. Get in touch with our team, if you want to take over responsibility. show"
