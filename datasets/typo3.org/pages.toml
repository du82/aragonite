53e01e04c typo3_src-7.6.58.tar.gz e415846e9dca9ad4219c0d0c9e334419dc7d3a5b typo3_src-7.6.58.zip MD5 79eda1a70f15b951bc32cd2d9619510a typo3_src-7.6.58.tar.gz 00a9c1beba42d402be86854bda460440 typo3_src-7.6.58.zip Package Signatures TYPO3 Release Packages (the downloadable tarballs and zip files) as well as Git tags are signed using PGP signatures during the automated release process. Besides that, MD5 and SHA2-256 hashes are being generated for these files. Find more details on verifying signatures and hashes in the infrastructure guide. Upgrading The usual upgrading procedure applies. No database updates are necessary. It might be required to clear all caches; the "important actions" section in the TYPO3 Install Tool offers the accordant possibility to do so. Changes 2022-09-13 73fccd7637 [RELEASE] Release of TYPO3 7.6.58 (thanks to Andreas Fernandez) 2022-09-13 cdf7399c93 [TASK] Update ChangeLog (thanks to Andreas Fernandez) 2022-09-13 433b38d2a8 [SECURITY] Upgrade to typo3/html-sanitizer v1.0.7 (thanks to Andreas Fernandez) 2022-09-13 a7090a0b21 [SECURITY] Mitigate timing discrepancies during user authentication (thanks to Oliver Hader) 2022-09-13 e61e6b1a4c [SECURITY] Mitigate cross-site-scripting in FileDumpController (thanks to Oliver Hader) 2022-09-13 a52ba8718f [BUGFIX] Add missing msclkid parameter to cacheHash excludedParameters (thanks to dsteinborn) 2022-06-14 6c3085abc3 [TASK] Set TYPO3 version to 7.6.58-dev (thanks to Andreas Fernandez)'
