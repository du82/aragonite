["https://typo3.org/cms/features/secure-performant-scalable/performance-scalability"]
title = "Performance Features of TYPO3"
description = "TYPO3 improves audience retention and customer conversion rates by delivering content to your audience faster."
full_description = "Performance & Scalability TYPO3 improves audience retention and customer conversion rates by delivering content to your audience faster. PHP Version 8.0 Introduced in version 11.3 The TYPO3 Core is now compatible with PHP version 8.0. This PHP version receives security updates for at least the next 28 months from now, until November 2023. Developers can leverage many new features, optimizations, and improvements of the programming language that powers TYPO3. Read more about PHP version 8 on php.net. The compatibility with PHP version 7.4 also remains in place. Documentation Cache presets Introduced in version 10.1 As an enterprise content management system, TYPO3 is well-known and popular for powering very large websites and applications without problems. But also small to medium-sized web projects running on shared hosting environments use TYPO3 for various reasons. Two of these are performance and the option to fine-tune almost every aspect of an installation. TYPO3’s caching framework uses the database as the storage for caching by default. However, various tests show that this is under certain circumstances, not the perfect and most performant configuration. Depending on the environment and hosting setup, a cache stored in the file system is faster. Integrators and administrators can now configure the storage type for caches. Documentation > Cache dependency injection Introduced in version 10.1 Caching has been an important success factor and that’s why we are not getting tired improving this component in TYPO3 whenever, wherever we can. Symfony’s Service Container was introduced in TYPO3 version 10.0 and this allows us now to inject cache objects directly rather than using the CacheManager. In other words: the TYPO3 core now provides all core caches as dependency injection services and extension developers are encouraged to leverage this pattern from now on. To do this, add your cache service to the file “Configuration/Services.yaml” and dependency injection takes care of passing the cache to your class constructor. Since TYPO3 version 10.1 developers don’t need to use the “CacheManager” anymore. Does this sound complicated? In fact, it is not: have a look at the documentation which also shows some code examples. Documentation"
year_published = 2025
clearnet = "https://typo3.org/cms/features/secure-performant-scalable/performance-scalability"
