["https://typo3.org/community/contribute/get-your-typo3org-community-account"]
title = "Get a My TYPO3 account"
description = "Create login for the online services. Find out which are the main services we are providing for our community."
full_description = "Get your My TYPO3 account What is the My TYPO3 account? My TYPO3 is your centralized account management platform. By registering for My TYPO3, you create one centralized account for all your activities in the TYPO3 ecosystem. No matter if you want to create a Slack account, book online certifications, attend training courses, or buy at the TYPO3 shop. With the My TYPO3 account, you have all services at your fingertips.Register now for your My TYPO3 account When do I need a My TYPO3 login? If you want to use online services of the typo3.org or typo3.com infrastructure a personalized login is needed. The most important services are:https://my.typo3.org:Maintain your user profile and account datahttps://extensions.typo3.org: Upload or rate TYPO3 extensionshttps://forge.typo3.org: Report issues for TYPO3https://shop.typo3.com: Buy merchandise items, certifications and membershipshttps://talk.typo3.org: Comment news articles and discuss with the communityhttps://decisions.typo3.org: Discuss and decide ideas for TYPO3 Core Developmenthttps://typo3.org: Login to restricted areas for community teamshttps://review.typo3.org: Provide reviews for the TYPO3 core Registration Process Visit https://my.typo3.org/register to start the registration process Choose a unique username for your My TYPO3 Login. Usernames can contain the following characters: a to z (lowercase), 0 to 9, - _ . and @. Note that your username can not be changed once it has been saved. Confirm your email adress. During the registration process, you need to confirm your personal mail adress. Once the registration process is finished, you will receive a welcome message and your account is active. In some cases the admin group will validate your registration manually. This is needed to prevent fake accounts and spam. Please note also, that we do not accept one time mail adresses."
