["https://typo3.org/cms/roadmap"]
title = "Development Roadmap for TYPO3 CMS"
description = "The TYPO3 CMS development roadmap follows an 18-month release cycle for Long Term Support versions."
full_description = "TYPO3 CMS Development Roadmap TYPO3 Development Roadmap Maintenance Releases Schedule TYPO3 v13 TYPO3 v12 TYPO3 v11 TYPO3 v10 TYPO3 v9 TYPO3 v8 TYPO3 v13 TYPO3 v13 will drastically improve the time to set up a new website by utilizing Frontend presets and providing new ways to create custom content types. New APIs are added in order to increase productivity for power-users. Releases Version Primary Focus Estimated Release 13.0 Breaking changes and new system requirements Released: 2024-01-30 13.1 Reusable components for creating new sites Released: 2024-04-23 13.2 Enhanced backend UI and Schema API Released: 2024-07-02 13.3 Feature freeze Released: 2024-09-17 13.4 LTS-release Released: 2024-10-15 TYPO3 v12 TYPO3 v12 will feature a significant productivity boost as we aim to make the system the fastest TYPO3 version. We have a bunch of ideas up our sleeves to achieve this goal, for example: Improve backend usability, so backend users can manage website content with fewer clicks.Enable TYPO3 integrators to create custom content types quickly and easily.Simplify the methods for registering backend modules, allowing developers to create custom solutions more efficiently.Build new ways to let TYPO3 communicate with third-party systems as outgoing and incoming event notifications.Improve performance by leveraging more underlying system layers, such as specialized PHP and database features. Releases Version Primary Focus Estimated Release 12.0 New system requirements and breaking changes Released: 2022-10-04 12.1 Interoperability with third-party systems Released: 2022-12-06 12.2 Improved backend UI Released: 2023-02-07 12.3 Last-Minute Features Released: 2023-03-28 12.4 LTS Release Released: 2023-04-25 TYPO3 v11 Overall Goals Quick and straightforward upgrade path from TYPO3 v9 and TYPO3 v10 installations Improved experience for editors and administrators Focus on accessibility for TYPO3 Backend Streamlined authentication TYPO3 v11 LTS version will be fully supported for 1.5 years, and will be supported with security and critical fixes until October 2024. Releases Version Primary Focus Estimated Release 11.0 New system requirements and breaking changes Released: 2020-12-22 11.1 Multi-factor authentication Released: 2021-02-23 11.2 Link sharing for TYPO3 Backend Released: 2021-05-04 11.3 UX improvements for backend users and PHP v8 support Released: 2021-07-13 11.4 Feature freeze Released: 2021-09-07 11.5 LTS release Released: 2021-10-05 TYPO3 v10 Overall Goals Faster time-to-market via improved site setup Optimized and streamlined template handling for page layouts Implement strong defaults and better standards for existing APIs TYPO3 v10 LTS version will be fully supported for 1.5 years, and will be supported with security and critical fixes until April 2023. Releases Version Primary Focus Estimated Release 10.0 Pave the way for exciting new concepts and APIs & necessary breaking changes Released: 2019-07-23 10.1 Routing Improvements and Site Handling v2 Released: 2019-10-01 10.2 Fluid / Rendering Engine Improvements Released: 2019-12-03 10.3 Feature Freeze Released: 2020-02-25 10.4 LTS Release Released: 2020-04-21 TYPO3 v9 Overall Goals Implement optimized deprecation strategy and make upgrades even easier Implement URL Routing Improve Multisite handling Add SEO features The TYPO3 v9 LTS version will be fully supported for 1.5 years, and will be supported with security and critical fixes until October 2021. The previously announced integration of new Frontend Editing is available as a separate extension. Releases Version Primary Focus Estimated Release 9.0 Unified Page Translations, Install Tool Refactoring, Page Tree Refactoring Released: 2017-12-12 9.1 Redirect Handling Released: 2018-01-30 9.2 Site Handling Released: 2018-04-10 9.3 SEO and URL Routing Preparations Released: 2018-06-12 9.4 URL Routing for Pages + SEO improvements Released: 2018-09-04 9.5 Long Term Support Release Released: 2018-10-02 TYPO3 v8 Overall Goals Cloud Integration Aid editors by creating responsive websites Next level rich text editing In-page editing for editors in the frontend (as a separate extension) The TYPO3 v8 LTS version will be fully supported until TYPO3 v9 LTS is out, and will be supported with security and critical fixes until March 2020. Releases Version Primary Focus Estimated Release 8.0 Adding last minute things Released: 2016-03-22 8.1 Cloud Integration Released: 2016-05-03 8.2 Doctrine Prerequisites Released: 2016-07-05 8.3 Rich Text Editor Released: 2016-08-30 8.4 Doctrine Migration + Upgrades Released: 2016-10-18 8.5 New RTE + Integrator Support Released: 2016-12-20 8.6 Everything except Frontend Editing Released: 2017-02-14 8.7 Long-Term-Support Released: 2017-04-04 Support Times Extended Support for TYPO3 You can find further information about our Extended Support Plans on TYPO3.com Get extended Support PHP Compatibility Chart PHP versions TYPO3 v13 2023 - 2027 TYPO3 v12 2021 - 2026 TYPO3 v11 2020 - 2024 TYPO3 v10 2019 - 2023 TYPO3 v9 2017 - 2021 TYPO3 v8 2015 - 2020 PHP 7.0 no no no no no Yes PHP 7.1 no no no no no Yes PHP 7.2 no no no Yes Yes Yes PHP 7.3 no no no Yes Yes Yes PHP 7.4 no no Yes Yes Yes Yes PHP 8.0 no no Yes no no no PHP 8.1 no Yes Yes no no no PHP 8.2 Yes Yes Yes no no no PHP 8.3 Yes Yes Yes no no no PHP 8.4 Yes Yes no no no no End-Of-Life Announcements This list contains references to announcements for TYPO3 versions that reached their end-of-life (EOL) and are not maintained by the community any further.6 April 2023: End-Of-Life announcement for TYPO3 v10 LTS30 September 2021: End-Of-Life announcement for TYPO3 v9 LTS31 March 2020: End-Of-Life announcement for TYPO3 v8 LTS30 November 2018: End-Of-Life announcement for TYPO3 v7 LTS18 April 2017: End-Of-Life announcement for TYPO3 v6.2 LTS"
