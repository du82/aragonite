["https://typo3.org/cms/features/smart-content-management/content-models-metadata-management-tagging-search-seo"]
title = "Content Models, Metadata Management, Tagging & Search, SEO Features of TYPO3"
description = "Make your website easier to find for potential customers. TYPO3 provides you with the tools to implement your SEO strategy."
full_description = 'Content Models, Metadata Management, Tagging & Search Extended View Introduced in version 11.3 The List module has an extended view to access further functions such as displaying extra details or seeing the change history on content elements. These functions are secondary actions that backend users need less frequently in their daily work. Previously the extended view was activated by a checkbox, which then applied the view to all the tables on the page. With TYPO3 version 11.3, the checkbox has been removed, and users can access the secondary functions for each table individually (using the button with three vertical dots). > > Data Download Introduced in version 11.3 Do you know that backend users can download almost all database tables as CSV files from the List module? Of course, appropriate access permissions to the tables are required. This "export" functionality has long been part of TYPO3 Core but was sometimes missed by users. In TYPO3 v11.3, the download button is now prominently displayed in the header of each table. But that’s not all. Instead of a simple CSV download, backend users can now customize the export. A dialog box lets users configure the file name and the format (CSV or JSON), along with other settings. >'
