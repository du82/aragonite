["https://typo3.org/cms/release-news/page"]
title = "Release News"
description = "The TYPO3 Core Team announces version 4.2.11 of the TYPO3 Enterprise Content Management System."
full_description = "TYPO3 CMS release news Thu. 14th January, 2010 TYPO3 4.2.11 released Categories: Development Created by Ingo Renner The TYPO3 Core Team announces version 4.2.11 of the TYPO3 Enterprise Content Management System. Read more Mon. 30th November, 2009 TYPO3 Version 4.3 Released: Frontend Editing and a Promising Future Categories: Development Created by Soeren Schaffstein BAAR, 2009-11-30 Today the TYPO3 Association released the newest version of their outstandingly successful Open Source project TYPO3. TYPO3 has been downloaded over 4.1 million times - making it one of the world's leading Enterprise Open Source projects. The latest TYPO3 version 4.3 comes packed with numerous brand new features and improvements. Highlights include the completely new Frontend editing module and the integration of Extbase and Fluid. Additionally, TYPO3's already excellent security features have been improved even further. Read more Mon. 28th September, 2009 TYPO3 4.2.9 released Categories: Development Created by Ingmar Schlecht The TYPO3 Core Team announces version 4.2.9 of the TYPO3 Enterprise Content Management System. Read more Tue. 6th March, 2007 TYPO3 Association Releases Version 4.1 Categories: Association TYPO3 Association Releases Version 4.1: Focus on Usability and Performance Improvements Read more Mon. 5th February, 2007 TYPO3 4.1 Release Candidate 1 Categories: Development Created by Ingmar Schlecht The core team is proud to announce the first Release Candidate of TYPO3 4.1. The 4.1 development is now feature frozen so only bugfixes will be added until the final release. Read more « ‹ ... 48 49 50 › »"
