["https://typo3.org/community/teams/communication-coordination"]
title = "The TYPO3 Content Coordination Committee (T3C3)"
description = "The Committee coordinates the communication and marketing of the TYPO3 Company and Association, through a unified workflow and pipeline."
full_description = "The TYPO3 Content Coordination Committee (T3C3) Facilitating creation and distribution of content for the TYPO3 community The Communication Coordination Committee coordinates the communication and marketing of the TYPO3 Company and the TYPO3 Association, through a unified workflow and production pipeline. The goal is to enable the creation of more and better content from more authors in more channels.The committee’s job is to say “yes!” and get content ideas realised and published where they will be most effective for the community. The Committee helps coordinate publication across the community websites, social media, and other places online, suggesting timing, formats, and publishing destinations. Submit Content or Idea Get help with writing, proofreading, or publishing content. Offering Help to Writers The Committee offers editorial review and writing help for authors, and all articles will be proofread and scheduled for publication at times and in channels that will give it best effect.Even if you are no writer or native English speaker, you will be given the help you need to answer important questions and define the points you would like to get across. A better writer will help you make a great article out of it. Writer's Guide and Workflow Overview Need to communicate something? Want to publish an article? Announce or report back on an event? Propose something new? Whatever it may be, get in touch with the Communication Coordination Committee.The Communication Coordination Committee will help you clarify important details like: Who owns the message? Is it the TYPO3 Company or Association, a team or an individual?What help and resources do you need? Editorial guidance, assistance, or maybe just proofreading? Who should be involved?What priority should it have?What media channels are best suited for its distribution?How can we get the most out of it? Can we make any “spin-offs” like marketing materials, videos, talks at events, or follow-up articles?The Communication Coordination Committee sets up a publication timeline and helps coordinate the production-to-publishing workflow, including, assigning resources and keeping relevant stakeholder groups (such as Marketing, Content, and Social Media) in the loop, helping overcome any blocks or hurdles that may be encountered. These groups can then make their own plans and assign their own resources."
year_published = 2025
clearnet = "https://typo3.org/community/teams/communication-coordination"
