["https://typo3.org/cms/features/smart-content-management/digital-asset-management-dam"]
title = "Digital Asset Management (DAM) Features of TYPO3"
description = "TYPO3’s DAM integrations deliver effective asset discovery, access, and reuse, greatly reducing editorial and management overhead."
full_description = 'Digital Asset Management (DAM) Adding Online Media Introduced in version 7.0 Organizing and working with online media assets like youtube and vimeo videos is much easier. Youtube links can be referenced in the the "Text & Media" content element directly by pasting a video URL, a preview thumbnail is shown, and they can be organized in the file list module just like any other asset. You can also embed local files – easy and hassle­free. Selection of Files and Records Introduced in version 11.3 Previous TYPO3 v11 sprint releases already received some well-received improvements for the page and file tree as well as for the Record Selector. These components now feature super-fast and lightweight techniques such as the underlying SVG-based code. We started tackling another area in TYPO3 v11.3 that requires an overhaul: selecting files and records from a list. Let’s look at an example: adding images to a page using the “Text and Media” content element. The “Add media file” button displays a modal window to select one or more files from a list. Backend users can now enable a checkbox on the left-hand side for each file, or open a context menu and check/uncheck all elements with one click. They can also toggle the current selection. You will also find this great functionality in another often used area of the TYPO3 backend: the file list module. > Working with the Filelist Module Introduced in version 11.1 The module “Filelist” received a visual overhaul in TYPO3 v11.1. Using the same lightweight technologies as the page tree does, both components now feature a consistent look and feel in the navigation area. This change also means that we removed the iframe that was previously used by the module. The main benefit is a performance boost, but you will also notice an input field at the top. This field lets you filter down the folder list based on search terms, similar to the page tree filter many backend users are used to in the page tree. The search in the file list even takes file names into account. Documentation > Define File upload default action Introduced in version 10.1 Integrators will embrace this new feature and backend users will love it for sure: the default action when backend users upload files is now configurable! In previous TYPO3 versions, the default is “Skip this file” if backend users try to upload a file that already exists. This is, of course, the safest option, but TYPO3 v10.1 allows you to re-configure it, making the file upload functionality more flexible and user-friendly. Available options are “replace”, “rename”, and “cancel”. Documentation >'
