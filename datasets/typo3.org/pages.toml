["https://typo3.org/community/teams/academic-committee"]
title = "TYPO3 Academic Committee"
description = "The TYPO3 Academic Committee is made up of TYPO3 Association members from universities that use TYPO3-CMS for their homepages."
full_description = '''Academic Committee members of the TYPO3 Academic Committee ---- See German version below. ----TasksThe Academic Committee’s tasks include:Representing universities’ interests in the TYPO3 AssociationProviding a central point of contact for the TYPO3 AssociationSupporting the TYPO3 Association, e.g. with technical resourcesIntroducing a TYPO3 Academic MembershipHolding regular university meetingsEstablishing the TYPO3 University Community Package (T3UP)Strengthening cooperation among universities for new features / extensions and their further developmentCooperating with the TYPO3 Association and TYPO3 Core Team in further development of TYPO3Assisting the working groupsCurrently, the Committee is focused on German-language regions. The working language is German. Reports are regularly published in English.MembersThe Academic Committee members are:Up to 10 elected, voting members from universities (max. 1 per university). Another person from the same university may stand in for each member.Every university may be an advising member.1 member of the TYPO3 Association Board as a liaisonHalf of the voting members and 2 substitute members are elected at the annual TYPO3 University Day. Universities with TYPO3 membership are eligible to vote. The term of office is 2 years. The TYPO3 Association member is appointed by the Board.Selection and Tasks of OfficersFrom among the voting members, the Committee elects one chairperson, a first deputy chairperson, and a second deputy chairperson. The term of office for each is 2 years. The tasks of the chairpersons include:Calling for committee meetings, directing meetings, taking minutesManaging the mailing listWorking GroupsThe Committee may establish working groups for specific topics. In each working group, at least one member of the Committee should be represented. The working groups may also include members other than universities (e.g. agencies).Working PlatformsToolDetailsMailinglistenFor all university representatives: typo3-universities(at)lists.univie.ac.at registration: https://lists.univie.ac.at/mailman/listinfo/typo3-universities TYPO3 University Days Upcoming EventTYPO3 University Days 2025 take place from 16. and 17. September 2025 at Universität des Saarlandes (Saarbrücken). All representatives of universities that use TYPO3 or are considering using TYPO3 are invited. Website: https://www.uni-saarland.de/t3ud25 | Twitter/X #T3UD25Past EventsTYPO3 University Days 2024 took place from 17. and 18. September 2024 at Universität Leipzig. All representatives of universities that use TYPO3 or are considering using TYPO3 were invited. Website: https://www.uni-leipzig.de/t3ud2024 | Twitter #T3UD24TYPO3 University Days 19. and 20. September 2023 took place at Hochschule Darmstadt. All representatives of universities that use TYPO3 or are considering using TYPO3 were invited. Website: https://t3ud23.h-da.de | Twitter #T3UD23TYPO3 University Days 2022 took place from September 14-15, 2022 as an online-web-conference. They were organised by University of Witten/Herdecke. All representatives of universities that use TYPO3 or are considering using TYPO3 were invited. Website: https://t3ud22.uni-wh.de | Twitter #T3UD22TYPO3 University Days 2021 took place from September 22-23, 2021 as an online-web-conference. They were organised by University of Weimar and University of Ulm. All representatives of universities that use TYPO3 or are considering using TYPO3 were invited. Website: https://t3ud.uni-weimar.de | Twitter #T3UD21.TYPO3 University Days 2020 took place from September 16-17, 2020 as an online-web-conference. They were organised by University of Ulm. All representatives of universities that use TYPO3 or are considering using TYPO3 were invited. Website: https://www.uni-ulm.de/misc/t3-university-days/ | Twitter #T3UD20.The TYPO3 University Days 2019 took place from September 18-19, 2019, at University of Vienna, Co-host was the Technical University of Munich. Website: https://t3-university-days.univie.ac.at | Twitter #T3UD19The TYPO3 University Days 2018 took place from September 25-26, 2018, at Akademie der Wissenschaften und der Literatur Mainz. Website: https://t3ud18.adwmainz.de/t3ud18.html | Twitter #T3UD18The TYPO3 University Days 2017 took place from September 27-28, 2017, at Hochschule Darmstadt. Twitter #T3UD17The TYPO3 University Days 2016 took place from September 20-21, 2016, at Hochschule Darmstadt T3AC Happy Hour Between the T3UD there are always quite big gaps with little exchange. To fill these gaps, we as the TYPO3 Academic Committee (T3AC) would like to establish another meeting format in the future: The TYPO3 Happy Hour, an online meeting that takes place approximately once a quarter and is about 60 minutes long with a short keynote speech on an interesting topic followed by time for questions and discussion.Powermail CleanerDate: Friday, 06 December 2024, at 10:30 amSpeakers: Ulfried Herrmann (Bauhaus University Weimar)Topic: The new add-on extension for Powermail, with which you can automatically delete stored form data from the TYPO3 database in compliance with GDPR, has been ready for 14 days! The development of Powermail Cleaner was made possible by joint funding from several universities and is now freely available: https://extensions.typo3.org/extension/powermail_cleaner What can Powermail Cleaner do? How easy or complicated is it to work with? Ulfried Herrmann from the Bauhaus University Weimar will give us an input with a practical demonstration and of course we will have the opportunity to ask questions afterwards.Language: GermanOnline meeting: BBB room Uni Oldenburg https://meeting.uol.de/b/vol-ax5-dbp-xzhThe TYPO3 dashboardDate: Friday, 28 June 2024, at 10:30 amSpeakers: TYPO3 team of the TU BraunschweigTopic: Since TYPO3 10 there is the dashboard, which can be activated as an additional view. "Widgets" can be placed there, which can contain various information to provide orientation about current to-dos or similar. The TYPO3 team at TU Braunschweig has kindly agreed to give us a practical demonstration of this and show us how the dashboard can be put to good use in everyday life! As always, there will also be time for questions and suggestions.Language: GermanOnline meeting: BBB room Uni Oldenburg https://meeting.uol.de/b/vol-ax5-dbp-xzhLink verification with the brofix extensionDate: Friday, March 01, 2023, at 10:30 a.m.Speakers: Sybille Peters and Volker Burggräf (Carl von Ossietzky University Oldenburg)Topic: There are many hyperlinks to internal or external websites or to download documents on our university websites - and thus unfortunately also broken links from time to time when there are changes to the link destinations. The brofix extension helps to find and correct broken links. It can be found in the TER (https://extensions.typo3.org/extension/brofix) and is compatible with TYPO3 v9 to v12. We are particularly pleased that the developer of brofix will be presenting the extension in person at our T3AC Happy Hour! Various functionalities will be demonstrated, which have already been developed over a long period of time in practice and for practice.Language: GermanOnline meeting: BBB room Uni Oldenburg https://meeting.uol.de/b/vol-ax5-dbp-xzhJob advertisementsDate: Friday, 17 November 2023, at 10:30 a.m.Speaker: Volker Burggräf (Carl von Ossietzky University Oldenburg) and everyone who wants to present their solutionTopic: We want to discuss procedures for the presentation of job advertisements with TYPO3Language: GermanEmergency website for universities and collegesDate: Friday, 16 June 2023, at 10:30 a.m.Speaker: Alex Kellner (in2code), Klaus Fumy (Universität Ulm)Topic: in2code presents a concept for an emergency website in case of a hack. The Uni Ulm is a customer of in2code and reports on the setup.Language: GermanAutomatic translations with DeepL in TYPO3 (extension wv_deepltranslate)Date: Friday, 24 February 2023, at 10:30 a.m.Speaker: Volker Burggräf (Carl von Ossietzky University Oldenburg)Topic: The extension wv_deepltranslate will be demonstrated. With the financial participation of several universities, it has now been extended to include the ability to include one's own translation glossaries. Academic Committee - German version Das TYPO3 Association Academic Committee besteht aus TYPO3 Association-Mitgliedern von Universitäten und Hochschulen, die das TYPO3-CMS für ihre Website nutzen. Es wurde im November 2016 gegründet.AufgabenDie Aufgaben des Academic Committee sind:Interessensvertretung der Universitäten/Hochschulen in der TYPO3 AssociationZentraler Ansprechpartner für die TYPO3 AssociationUnterstützung der TYPO3 Association z.B. durch technische RessourcenEinführung einer TYPO3 Academic MembershipDurchführung von regelmäßigen HochschultreffenEtablierung des TYPO3 University Community Package (T3UP)Stärkung der Zusammenarbeit von Hochschulen für neue Features/Extensions und deren WeiterentwicklungZusammenarbeit mit der TYPO3 Association und dem TYPO3 Core Team bei der Weiterentwicklung von TYPO3Begleitung der ArbeitsgruppenDas Committee ist zurzeit auf den deutschsprachigen Raum ausgerichtet. Die Arbeitssprache ist deutsch. Es werden regelmäßig Berichte auf Englisch erstellt.MitgliederMitglieder des Academic Committee sind:Bis zu 10 gewählte stimmberechtigte Mitglieder von Hochschulen (max. 1 pro Hochschule). Diese Mitglieder können durch eine andere Person der Hochschule vertreten werden.Jede Hochschule kann beratendes Mitglied sein.1 Mitglied des TYPO3 Association-Board als VerbindungspersonDie Hälfte der stimmberechtigten Mitglieder und 2 Nachrücker werden auf dem jährlich stattfindenden TYPO3 University Day gewählt. Stimmberechtigt sind Hochschulen mit TYPO3 Academic Membership. Die Amtszeit beträgt 2 Jahre. Das Mitglied der TYPO3 Association wird vom Board bestimmt.LeitungDas Committee wählt aus der Mitte der stimmberechtigten Mitglieder einen Vorsitzenden, 1. und 2. Stellvertreter. Die Amtszeit beträgt jeweils 2 Jahre. Die Aufgaben der Leitung sind:Einberufung der Comittee-Treffen, Sitzungsleitung, ProtokollführungVerwaltung der MailinglisteArbeitsgruppenDas Committee kann Arbeitsgruppen für thematische Schwerpunkte einberufen. In jeder Arbeitsgruppe sollte mindestens ein Mitglied des Committee vertreten sein. Die Arbeitsgruppen können auch Mitglieder außerhalb der Hochschulen enthalten (z.B. Agenturen).ArbeitsplattformenToolDetailsMailinglistenFür alle Hochschul-Vertreter: typo3-universities(at)lists.univie.ac.at Registrierung: https://lists.univie.ac.at/mailman/listinfo/typo3-universities TYPO3 University Days Kommende VeranstaltungDie TYPO3 University Days 2025 finden am 16. and 17. September 2025 an der Universität des Saarlandes (Saarbrücken) statt. Eingeladen sind alle Vertreter der Hochschulen, die TYPO3 nutzen oder eine Nutzung in Erwägung ziehen. Website: https://www.uni-saarland.de/t3ud25 | Twitter /X #T3UD25Vergangene VeranstaltungenDie TYPO3 University Days 2024 fanden am 17. and 18. September 2024 an der Universität Leipzig statt. Eingeladen waren alle Vertreter der Hochschulen, die TYPO3 nutzen oder eine Nutzung in Erwägung ziehen. Website: https://www.uni-leipzig.de/t3ud2024 | Twitter #T3UD24Die TYPO3 University Days am 18. und 20. September 2023 fanden an der Hochschule Darmstadt statt. Eingeladen waren alle Vertreter der Hochschulen, die TYPO3 nutzen oder eine Nutzung in Erwägung ziehen. Website: https://t3ud23.h-da.de | Twitter #T3UD23Die TYPO3 Online University Days 2022 fanden vom 14. bis 15. September 2022 als Online-Webkonferenz statt. Organisiert wurden sie von der Universität Witten/Herdecke. Eingeladen waren alle Vertreter der Hochschulen, die TYPO3 nutzen oder eine Nutzung in Erwägung ziehen.Website: https://t3ud22.uni-wh.de | Twitter #T3UD22Die TYPO3 Online University Days 2021 fanden vom 22. bis 23. September 2021 als Online-Webkonferenz statt. Organisiert von der Universität Weimar in Zusammenarbeit mit der Uni Ulm. Eingeladen waren alle Vertreter der Hochschulen, die TYPO3 nutzen oder eine Nutzung in Erwägung ziehen. Website: t3ud.uni-weimar.de | Twitter #T3UD21Die TYPO3 Online University Days 2020 fanden vom 16. bis 17. September 2020 als Online-Webkonferenz statt. Organisiert von der Universität Ulm. Eingeladen waren alle Vertreter der Hochschulen, die TYPO3 nutzen oder eine Nutzung in Erwägung ziehen. Website: https://www.uni-ulm.de/misc/t3-university-days/ | Twitter #T3UD20Die TYPO3 University Days 2019 fanden am 18. und 19. September 2019 an der Universität Wien statt. Mitgastgeber war die Technische Universität München. Website: https://t3-university-days.univie.ac.at | Twitter #T3UD19Die TYPO3 University Days 2018 fanden am 25. und 26. September 2018 an der Akademie der Wissenschaften und der Literatur Mainz statt. Twitter #T3UD18Die TYPO3 University Days 2017 fanden am 27. und 28. September 2017 an der Hochschule Darmstadt statt. Twitter #T3UD17Die TYPO3 University Days 2016 fanden am 20. und 21. September 2016 an der Hochschule Darmstadt statt. T3AC Happy Hour Zwischen den T3UD gibt es immer recht große Lücken mit wenig Austausch. Um diese zu füllen, möchten wir als TYPO3 Academic Committee (T3AC) zukünftig ein weiteres Meeting-Format etablieren: Die TYPO3 Happy Hour, ein ca. einmal pro Quartal stattfindendes Online-Treffen von etwa 60 Minuten Länge mit einem kurzen Impulsreferat zu einem interessanten Thema sowie anschließender Zeit für Fragen und Diskussion.Powermail Cleaner Termin: Freitag, 06. Dezember 2024, um 10:30 UhrReferenten: Ulfried Herrmann (Bauhaus-Universität Weimar)Thema: Seit 14 Tagen ist sie fertig, die neue Ergänzungs-Extension für Powermail, mit der man gespeicherte Formulardaten automatisch DSGVO-konform aus der TYPO3-Datenbank löschen lassen kann!Die Entwicklung von Powermail Cleaner wurde ermöglicht durch gemeinsame Finanzierung aus mehreren Universitäten und steht jetzt frei zur Verfügung: https://extensions.typo3.org/extension/powermail_cleanerWas kann Powermail Cleaner? Wie einfach oder kompliziert ist es, damit zu arbeiten? Hierüber werden wir einen Input mit praktischer Vorführung von Ulfried Herrmann aus der Bauhaus-Universität Weimar erhalten und im Anschluss natürlich auch wieder die Gelegenheit zu Rückfragen haben.Online-Treffen: BBB-Raum Uni Oldenburg https://meeting.uol.de/b/vol-ax5-dbp-xzhDas Dashboard von TYPO3 Termin: Freitag, 28. Juni 2024, um 10:30 UhrReferenten: TYPO3-Team der TU BraunschweigThema: Seit TYPO3 10 gibt es das Dashboard, das als zusätzliche Ansicht aktiviert werden kann. Dort können „Widgets“ platziert werden, die verschiedene Informationen enthalten können, um Orientierung über aktuelle ToDos o.ä. zu geben. Das TYPO3-Team der TU Braunschweig hat sich erfreulicherweise bereiterklärt, uns dies einmal ganz praktisch vorzuführen und zu zeigen, wie das Dashboard im täglichen Leben nutzbringend eingesetzt wird! Wie immer wird es auch Zeit für Fragen und Anregungen geben.Online-Treffen: BBB-Raum Uni Oldenburg https://meeting.'''
