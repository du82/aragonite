["https://typo3.org/community/events"]
title = "TYPO3 Events & Events With TYPO3"
description = """
Meet TYPO3
\t\t\t\t\t
\t\t\t\t\t
\t\t\t\t\t\tThis non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who."""
full_description = "10 Mar 11 Mar 2025 Meet TYPO3 at FOSS Backstage Berlin, Germany FOSS Backstage is dedicated to everything related to FOSS (Free and Open Source Software) governance and open collaboration. As the conference website explains, the topics include “open source project leadership best practices, community management, open source project metrics, open source strategy for enterprise, adopting open source collaboration in corporations, legal matters when dealing with open source and many more.” TYPO3, as a free and open source CMS, is keenly interested in these topics. For us, this is an opportunity to meet and network with old and new friends from the FOSS community, learn from others, and share experiences from our own activities. Mathias Bolt Lesniak, TYPO3 project ambassador, will be present at the event and speak about How to Explain the Impact of Your Open Source Work with Jeffrey A. “jam” McGuire. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Mathias Bolt Lesniak more info 13 Mar 14 Mar 2025 TYPO3 Outreach Event: Albania Tirana, Albania Background and objectives:TYPO3 GmbH intends to exchange ideas with Albanian experts in the field of digitization in the public sector. The event is designed as a network meeting. Participants have the opportunity to present a topic based on a use case in a short slot (approx. 10 minutes). The selected use case should be as current as possible, preferably also in development. Projects are helpful for a short presentation. Ideally, illustrative application examples should show a solution to a specific problem. Afterwards, open networking sessions offer the opportunity to go deeper into the discussion and initiate possible partnerships. The event is organized in cooperation with contenance GmbH and hyretech Sh.P.K and is aimed at decision-makers, technology providers and institutions. In addition to the German partners, Albanian institutions such as GIZ, DIHA, AITA Albania and representatives of universities are involved. The aim is to promote an exchange between technology providers, public institutions and educational institutions in order to discuss innovative approaches and concrete solutions for digitization in the public sector. You Can Meet: Daniel Fau Christian Dölker Frank Nägler Luisa Sofie Faßbender more info 15 Mar 22 Mar 2025 T3BOARD Serfaus, Austria Winter Is Coming — T3BOARD Is Coming! Save The Date! The Diamond of CMS Meets the Diamond of the Alps The TYPO3 community will meet again in Serfaus, Tyrol, Austria for the 24th T3BOARD event. Be part of an inspiring week with people from our vibrant community, on the slopes during the day and in sessions about TYPO3 and IT in the evenings! T3BOARD is the longest running event of the TYPO3 universe — the first one was held back in 2001 in Bad Gastein, Austria. More Information more info 15 Mar 17 Mar 2025 Meet TYPO3 at CloudFest Hackathon Rust, Germany CloudFest Hackathon is three days of coding, collaboration, and creativity. The organizers call it “a blend of learning, networking, and impact.” The event takes place in the days preceeding Cloudfest, a major international internet infrastructure event. TYPO3 Core Team members will join other TYPO3 contributors at this event. Together with developers from other CMSs, they will work on collaborative projects and share knowledge. TYPO3 is an official Hackathon Partner. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. more info 17 Mar 20 Mar 2025 Meet TYPO3 at CloudFest Rust, Germany CloudFest gathers over 9,000 leaders of the internet infrastructure industry for a festival of learning, sharing, networking, and forming partnerships in a theme park in Germany’s Black Forest. For TYPO3, this event is a great opportunity to connect with experts outside our ecosystem, explore new trends and topics, build new and strengthen existing partnerships, and extend our presence in the cloud ecosystem. TYPO3 Association President Olivier Dobberkau will be present together with the TYPO3 Company’s Senior and Junior Success Managers Luisa Fassbender and Myrna Gönnemann. TYPO3 is also an official partner and participant at the CloudFest Hackathon preceding this event. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Olivier Dobberkau Luisa Sofie Faßbender Myrna Gönnemann more info 20 Mar 22 Mar 2025 TYPO3 Camp Mitteldeutschland 2025 Jena, Germany Save the Date: March 20-22, 2025 at the Ernst Abbe University of Applied Sciences in JenaThe TYPO3Camp Central Germany welcomes you to Jena for the first time in 2025. The seventh TYPO3Camp Central Germany will take place from March 20 - 22, 2025. The venue is new this time. We are looking forward to many exciting sessions, a great community and interesting discussions at the Ernst Abbe University of Applied Sciences in Jena. All further information will follow soon. See you at #T3CMD2025! Tickets & more info more info 24 Mar 27 Mar 2025 Meet TYPO3 at DrupalCon Atlanta Atlanta, Georgia, USA TYPO3 is a PHP-based open-source CMS, just like Drupal. The structure and backend experience differs, but, under the hood, our two communities solve web publishing and content management with similar tools and third-party dependencies. DrupalCon is a place to meet, exchange ideas, and discuss solutions to the challenges faced by open source software today. DrupalCon Atlanta bills itself “the biggest open-source event in North America.” The conference features many tracks and numerous sessions over four days. The Drupal Association is the event organizer, and the event will be an opportunity to strengthen the collaboration in the Open Website Alliance, where the TYPO3 Association is also a member. Mathias Bolt Lesniak, TYPO3's project ambassador, will be present during the three final days of the conference. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Mathias Bolt Lesniak more info 8 Apr 2025 TYPO3 Association General Assembly Düsseldorf, Germany The General Assembly kicks off 08 April 2024, 13:00 CET, at the venue of the TYPO3 GmbH This means the General Assembly is not only a great way to participate in the decision-making processes of your favorite open-source project, If you are unable to attend in person, you will be able to join the meeting online. Register for the General Assembly Submit a Petition More information will be published on typo3.org in due course. You Can Meet: Olivier Dobberkau Boris Hinzer Stefan Busemann Susi Moog Rachel Foucard Mathias Bolt Lesniak Thomas Maroschik Tymoteusz Motylewski more info 1 May 3 May 2025 TYPO3camp Schweiz Zürich, Switzerland Welcome to TYPO3camp Switzerland! With the idea of further strengthening the TYPO3 brand in Switzerland, we would like to bring together all areas of interest from the community, from TYPO3 developers/integrators to project managers and decision-makers to TYPO3 enthusiasts. Join us and share your experience and knowledge about TYPO3. #t3cch More information can be found on https://typo3camp.ch You Can Meet: Andri Steiner more info 3 May 10 May 2025 TYPO3 Surfcamp Las Palmas, Spain Surfing, Coding and Shaping the Future of TYPO3 Dive into TYPO3 Surfcamp, a thrilling one-week adventure for the next generation of TYPO3 enthusiasts! Join a vibrant mix of participants from all backgrounds to learn, create, and connect. With fun workshops, hands-on projects, and exciting surf sessions, you'll level up your TYPO3 skills while making new friends and conquering the waves. Experience the perfect blend of learning and camaraderie in a supportive and inclusive environment. Leave the Surfcamp inspired, connected, and ready to rock the TYPO3 world! More Information Apply Now You Can Meet: Susi Moog Benni Mack more info 9 May 11 May 2025 TYPO3Camp Vienna Vienna, Austria more info 13 May 14 May 2025 Meet TYPO3 at CMS Summit 25 Frankfurt am Main, Germany CMS Summit 25 calls itself “a vendor-neutral conference focused on CMS.” It is a European version of the North-American conference where TYPO3 has also previously been present. The event is one of multiple annual digital leadership conferences organized by Danish internet entrepreneur Janus Boye and Boye & co. Their focus is on the value of openness, friendliness and honesty in a profession where so much is based on the intangibles of know-how and experience. TYPO3 is a member of Boye & co’s CMS Experts group. This is a forum where CMS analysts, thinkers, practitioners, experts, and vendors meet to discuss and share thoughts and ideas. This is a place to meet practitioners and hear case studies with an under-the-hood look at how they think content management. TYPO3 Core Team lead Benni Mack will take part in the summit. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Boris Hinzer Benni Mack more info 28 May 29 May 2025 Meet TYPO3 at The e-Governance Conference Tallinn, Estonia The e-Governance Conference brings together strategists, decision makers, policy implementers, and donors. This year’s conference title is From Bytes to Benefits, Raising prosperity through digital transformation. For TYPO3, the events in 2022 and 2023 were a great success. This year, we will continue to promote our CMS and create interest and engagement around our four-pillar model for using a democratic and not-for-profit open-source project to foster sustainable and independent business as outlined in the TYPO3 Association’s report on Open Source Standardization of Government Websites in Rwanda. TYPO3 will be present for the third time with our own booth. Daniel Homorodean, leader of the TYPO3 Community Expansion Committee, as well as Mathias Bolt Lesniak, the TYPO3 project ambassador, will participate in the event. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Daniel Homorodean Mathias Bolt Lesniak more info 5 Jun 7 Jun 2025 Meet TYPO3 at WordCamp Europe Basel, Switzerland WordCamp Europe is an annual event centered around the WordPress CMS platform. It is described as “an informal, community-organized gathering of WordPress enthusiasts — from casual users to Core developers — where we discuss all things WordPress, share ideas and get to know each other.” For TYPO3, the event is a place to meet, exchange ideas, and discuss solutions to the challenges faced by open source software today. It is also a great way to meet with one of our fellow members in the Open Website Alliance. TYPO3 Project Ambassador Mathias Bolt Lesniak will attend the conference. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Mathias Bolt Lesniak more info 6 Jun 2025 Meet TYPO3 at AltCtrlOrg Basel, Switzerland AltCtrlOrg is a side event in the evening of the second day of WordCamp Europe, where you can “hear alternative talks on WordPress that you probably won’t hear at WordCamp.” The event's mission includes the wish to “celebrate and champion the openness, collaboration, and inclusivity” and “create a space where everyone can contribute equally, a space where diverse and interesting perspectives are heard.” TYPO3 is a PHP-based open-source CMS, just like WordPress. Events like this one are a place for CMS projects and their communities to meet, exchange ideas, and discuss solutions to the challenges faced by open source software today. The TYPO3 Association is an event sponsor, and President Olivier Dobberkau, will speak about The TYPO3 community Story at the event. TYPO3 Project Ambassador Mathias Bolt Lesniak will also be present. Meet TYPO3 This non-TYPO3 event is an opportunity to meet one of our active community members. Check the You Can Meet section below to see who. You Can Meet: Olivier Dobberkau Mathias Bolt Lesniak more info 23 Jun 27 Jun 2025 TYPO3 Community Sprint Q2/2025 Düsseldorf, Germany The TYPO3 Community Code Sprint for all TYPO3 community teams, initiatives, and those invited by them. All TYPO3 teams are invited to join us in our office in Düsseldorf for our on-location TYPO3 Code Sprint. We — the TYPO3 GmbH — will take care of your hotel costs and provide the location. You — the participants — bring your topics, motivation, and high spirits, and together we will work on moving TYPO3 forward. Please note: Travel costs (train, plane, car) will need to be reimbursed against the teams' budgets — please clarify the rules for that with your team leaders. Register Now more info 26 Jun 28 Jun 2025 TYPO3 Camp Hamburg Hamburg, Germany TYPO3camp Hamburg is an opportunity for developers, designers and anyone interested in the TYPO3 content management system to network, learn about the latest trends and share knowledge. Information and Tickets more info 6 Aug 2025 TYPO3 Team Leader Dialogue Day Karlsruhe, Germany more info 7 Aug 9 Aug 2025 TYPO3 Developer Days Karlsruhe, Germany The TYPO3 Developer Days are packed with insightful talks. Like last time, the DevDays 2025 will take place at GenoHotel, Karlsruhe, Germany. More information will be available closer to the event. You Can Meet: Boris Hinzer Mathias Bolt Lesniak more info 8 Sep 12 Sep 2025 TYPO3 Community Sprint Q3/2025 Düsseldorf, Germany The TYPO3 Community Code Sprint for all TYPO3 community teams, initiatives, and those invited by them. All TYPO3 teams are invited to join us in our office in Düsseldorf for our on-location TYPO3 Code Sprint. We — the TYPO3 GmbH — will take care of your hotel costs and provide the location. You — the participants — bring your topics, motivation, and high spirits, and together we will work on moving TYPO3 forward. Please note: Travel costs (train, plane, car) will need to be reimbursed against the teams' budgets — please clarify the rules for that with your team leaders. Register Now more info 12 Sep 14 Sep 2025 TYPO3 Camp Munich Tickets & More info more info 16 Sep 17 Sep 2025 TYPO3 University Days 2025 Saarbrücken, Germany TYPO3 University Days 2025 take place 16–17 September 2025 at Saarland University, Saarbrücken campus, Germany. All representatives of universities that use TYPO3 or are considering using TYPO3 are invited. More information can be found here: https://www.uni-saarland.de/page/t3ud25.html You Can Meet: Boris Hinzer Martina Ahlswede more info 17 Sep 18 Sep 2025 Meet TYPO3 at DMEXCO Cologne, Germany Visit us to learn more about the latest innovations in the world of open source CMS and meet some of our Official Partners who will be joining us at the "
