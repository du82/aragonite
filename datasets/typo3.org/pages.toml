["https://typo3.org/community/contribute/mentorship"]
title = "International TYPO3 Mentorship Program"
description = "Local web developers and agencies learn how to use TYPO3, a performant, secure, and flexible CMS, for their projects. All through one-on-on mentorship."
full_description = "The International TYPO3 Mentorship Program The TYPO3 International Mentorship program brings TYPO3 to new countries. TYPO3 CMS is a performant, secure, and flexible CMS, well-suited for many types of projects. Through individual mentorship, we show local web development communities how to use it for their projects and join our community. World-Wide TYPO3 Business and Community The mentoring program introduces new web developers to TYPO3. They learn our CMS and to start using it through a one-to-one learning process mentored by experienced members of our community. It brings TYPO3 to countries where the CMS does not have yet a relevant presence and the main goal is to expand TYPO3, its community of developers, and its market.Through 3 months, with weekly study topics, homework, and direct video communication with their mentors, the TYPO3 students learn how to build their own TYPO3 website and how to use it professionally, at their web agency or as freelancers. By understanding the basics of TYPO3, they can develop their knowledge further. By being introduced to the community, they can ask questions. They'll become sources of knowledge and contributors themselves, sharing with their local community and the global community. Curriculum, Time Requirement, and Organization The program consists of 12 chapters, or lessons. With one lesson a week, the curriculum builds TYPO3 expertise over approximately 3 months.The curriculum requires a commitment of at least 4 hours per week from the mentee. This includes time for independent study, doing homework, assessment, and one-on-one calls with the mentor. The mentor should dedicate 2–3 hours per week.The program is coordinated by a committee supervising the process. The committee evaluates the mentee and mentor candidates, monitors progress and provides assistance to the mentors and mentees.The mentors are rewarded for their involvement using funds from the TYPO3 Community Expansion Committee's budget and from generous sponsors. Skilldisplay offers a platform to organize the learning process and measure progress. The Story So Far May 2020Project preparations. Creating the operational processes and the curriculum.Reaching out to web developer communities around the world and presenting TYPO3 to them.Collecting registrations and assessing candidates.Identifying suitable mentors and preparing them.July 2020The first batch of registered mentees were interviewed and ready to start.The first five mentors were confirmed.The curriculum was completed the methodology established.August 2020The mentors were onboarded.Final preparations took place, including the setup of hosting environments for each mentee, with the support of jweiland.net.September 2020Six mentees started the program. They were from Zimbabwe, Chile, Benin, Cuba, and Rwanda. Four mentors were assigned. They come from Germany, France, Poland and Romania.February 2021The first edition of the program has come to a fruitful conclusion Planning has started for a new edition, which should start in Q2 2021. If you would like to contribute in any way, if you would like to become a mentor, a sponsor or you know and you want to recommend someone who would like to become a mentee, we would love to talk with you! You can write directly to the program coordinator, Daniel.Homorodean(at)typo3.org Future Plans The first edition of the program (2020) was a success. We have supported young web developers from 5 countries to make their first steps into the TYPO3 world, to get the basics of TYPO3 integration and learn about our communities. They want to continue their journey, beyond internship. We have two main goals for 2021: To extend the mentorship program in more countries, with more mentees and more mentors. To provide a chance of continuity for our mentees, to give them a chance to become TYPO3 integrators and developers and earn their living by working with TYPO3. To achieve both objectives, we need your help! Contact us if you would like to be a mentor, or to sponsor the program, or if you can help us find new mentees in countries where TYPO3 is not yet present. Contact us also if your agency would be interested to offer internships to the young mentees who went through the mentorship program and now have the basics of TYPO3 integrator knowledge. Maybe they will become good assets for your web agency in the future! Mentors Anja Leichsenring, Germany Alina Fleșer-Miclăuș, Romania Florian Rival, France Oskar Dydo, Poland Sergio Catalá, Spain Program Committee Daniel Homorodean, Romania Management, promotion, and engagementTymoteusz Motylewski, Poland Technical coordination, curriculum, and onboarding processMathias Bolt Lesniak, Norway Mentor and mentee assessment and program reportingAlina Fleser, Romania Technical content and mentor onboardingOlivier Dobberkau, Germany Organizational supportRachel Foucard, France Engage French community Sponsors jweiland.net SkillDisplay Arxia Macopedia Pixelant dkd Internet Service"
year_published = 2025
