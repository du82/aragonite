["https://typo3.org/community/teams"]
title = "Teams and Committees of the TYPO3 Community"
description = "The TYPO3 Documentation Team has enhanced the resources available to new integrators and developers, delivering a completely revamped Getting Started Tutorial. With updated content and new sections, this guide is designed to help newcomers confidently navigate TYPO3 from day one."
full_description = "Teams and Committees The teams and committees of the TYPO3 community take on tasks within specific areas, such as core development, education, communication and security. Some apply for funding from the TYPO3 Association and organize regular meetings or sprints. Others, such as the Academic Committy, are funded by its members and address or promote topics specific for the members. Many meet regularly online. Join or Help Out The teams and committees have varying requirements, but many are looking for more people. Contact the team or committee leader to hear how you can help out. TYPO3 Development The TYPO3 Core Development Team is dedicated to develop and maintain the central parts of TYPO3 CMS. Academic The TYPO3 Academic Committee is made up of TYPO3 Association members from universities that use TYPO3-CMS for their homepages. Accessibility The Accessibility Team assists to improve and maintain the accessibility in TYPO3. Therefore we share our accessibility expertise with TYPO3 developers. Best Practices Focusing on establishing and communicating best practices around TYPO3. Communication Coordination The Committee coordinates the communication and marketing of the TYPO3 Company and the TYPO3 Association, through a unified workflow and production pipeline. The goal is to enable the creation of more and better content from more authors in more channels. Community Expansion The TYPO3 Community Expansion Committee (T3CEC) goal is to foster the use of TYPO3 by developers, agencies and clients all over the world. Content Write, Translate, Proofread. No coding skills are required. You can support us on a regular basis or when you have time. Content TypesDocumentation The documentation team provides exhaustive, quality documentation about TYPO3 products for all users, with the help of the community. Education & Certification The committee is responsible for the TYPO3 education strategy, enabling easy access to learning materials, as well as official certifications. Localization The goal of the localization team is to provide and maintain the services to make TYPO3 core and extensions available in as many languages as possible. Marketing Create. Communicate. Contribute. Support us with sharing your knowledge and help us to spread the word about TYPO3. Ombudsperson Ensuring the wellbeing of everyone in the community through education about and enforcement of the Code of Conduct. Security Security is taken very seriously by the developers of TYPO3. The visible part of that concern is the TYPO3 Security Team. Server We are in charge of the TYPO3 IT infrastructure. About a dozen core applications are run and managed by our team directly, and we provide additional services to other teams. TYPO3 CMS Product Strategy Group The TYPO3 CMS Product Strategy Group is a dynamic team from the TYPO3 Project dedicated to shaping the future of TYPO3 by driving strategic initiatives and ensuring the continued success of our beloved content management system. typo3.org website The typo3.org website team develops and maintains the typo3.org website, the Extension Repository, Events and Certification Listings, and much more. User Experience (UX) The main goal of this team is to work on TYPO3 existing features UX improvments and also to collaborate on building any new feature during the concept process if help is wanted. Sun. 2nd February, 2025 Community Budget Idea: Improving Documentation for New Integrators and Developers Categories: Budget idea, Community, Documentation Created by Maike Kiebele The TYPO3 Documentation Team has enhanced the resources available to new integrators and developers, delivering a completely revamped Getting Started Tutorial. With updated content and new sections, this guide is designed to help newcomers confidently navigate TYPO3 from day one. Read more Fri. 31st January, 2025 Getting Started With TYPO3 CMS Categories: TYPO3 CMS, Documentation Created by Tom Warwick Whether you're new to TYPO3 or perhaps you’ve used it in the past, this short guide is the ideal starting point. In this guide we’re going to introduce some TYPO3 concepts, then look at how we log in and navigate TYPO3’s backend. Read more Sun. 26th January, 2025 Annual Report of the TYPO3 Documentation Team Categories: Community, TYPO3 CMS, Documentation Created by Beatrice Finocchiaro The TYPO3 Documentation Team made significant strides in 2024, achieving groundbreaking advancements and key improvements. Let’s explore the accomplishments and contributions that defined this transformative year. Read more Sun. 19th January, 2025 Remote Day Each Month for The Best Practices Team Categories: Community, Best Practice Created by Daniel Siepmann In 2025, the Best Practices Team will have one remote day per month. We'll meet on TYPO3 Slack for a day of general housework and working through our backlog. While we may not complete all our goals, this sprint is an excellent opportunity to learn and collaborate. Read more Thu. 16th January, 2025 Visitors From the Symfony World Contribute To TYPO3 Documentation Search Frontend Categories: Development, Documentation, Community Created by Mathias Bolt Lesniak When the much-improved functionality at docs.typo3.org was implemented, it still missed a nice-looking frontend. That work was completed by two French companies from the Symfony world. Here’s their story. Read more Tue. 31st December, 2024 Documentation Made Easier With Markdown Categories: Community, Documentation Created by Beatrice Finocchiaro With Markdown, contributors can create and edit documentation using a format that's both simpler and more intuitive. This helps to break down the barriers of programming. If needed, you can switch to ReST later, for more advanced features. Read more Tue. 24th December, 2024 Translate TYPO3 Backend In-Context Categories: Community, TYPO3 CMS, Localization Created by Xavier Perseguers The TYPO3 Localization Team gathered in Düsseldorf for a full week during the TYPO3 Community Sprint Q4/2024 and made the TYPO3 extension, Crowdin, a reality. The extension provides an in-context feature which enables TYPO3 backend users to translate labels of the TYPO3 Core and extensions directly in the TYPO3 backend. Read more Sun. 22nd December, 2024 Server Team Status Report — November 2024 Categories: Community, Server Created by Andri Steiner Time flies, and with the fourth community sprint of the year almost complete, we’re ready to look back on another year of server maintenance work in the TYPO3 universe. Read more Thu. 28th November, 2024 Become a TYPO3 First Responder at talk.typo3.org Categories: Community, Documentation, Education & Certification Created by Andreas Nedbal Everyone who asks a question at talk.typo3.org deserves a quick response, and we're looking for help with initial triaging. Make people feel welcome in the TYPO3 world — and it can require just half an hour a week. Read more Wed. 20th November, 2024 First Steps Towards Implementing CommonMark Markdown for TYPO3 Documentation Categories: Budget idea, Development, Association, Documentation Created by Florian Thiele As the TYPO3 Documentation Team, we’re excited to share the progress we’ve made so far on our current project: extending TYPO3’s documentation support to fully embrace CommonMark Markdown syntax. Read more"
