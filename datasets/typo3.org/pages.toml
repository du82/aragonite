["https://typo3.org/community/meet/how-to-use-slack-in-the-typo3-community"]
title = "How to use Slack in the TYPO3 Slack Workspace"
description = "Find important channels for the TYPO3 community and learn how to get you started."
full_description = '''How to Use Slack in the TYPO3 Community Slack simplifies communication and brings our global community together, creating a virtual shared workspace where conversations are documented and accessible. You can use Slack in a web browser. Additionally, the Slack app is available on many platforms. Download the Slack App Thanks to Slack, the TYPO3 community members are able to: Chat via group chat or direct messaging.Exchange links and files.Call and make presentations using video and audio.Get updates, including via email when they are offline. What will I find in Slack? A great environment for communicating with many different channels (groups). Here are some of the important channels for the TYPO3 community to get you started:#announcements: the TYPO3 project announcement channel–you will automatically join this channel, but you cannot post there#typo3-cms: TYPO3 CMS support channel#typo3-cms-coredev: TYPO3 CMS core development channel#random: have fun, share anything you like#T3DD: TYPO3 Developer Days channel#typo3-documentation: Documentation Team–if you have any questions or suggestions regarding documentation#t3o-team: typo3.org–if you are having trouble with the typo3.org, extensions.typo3.org or voting.typo3.org website ... and there are many more for you to discover!You can also start one-to-one chats by starting a conversation with a single user. Stick to the rules When using Slack, we ask you to please stick to the TYPO3 community code of conduct.N.B. If you have a support question, please ask it on Stack Overflow first. Slack is a very handy and fast tool for getting answers, but it is not a publicly available resource. To increase the visibility of TYPO3 and TYPO3 related questions on the web, please ask your support question on Stack Overflow and then paste it into Slack. Following your discussion please make sure the result (hopefully the right answer!) is added to Stack Overflow to help the wider community.Guidelines for creating new channels: Please check first, if there is already a channel, which matches with your topic. Add a description about your channel, that others can easily identify the purpose of your channel.Use our naming conventionsGeneral Tips: ​​​​​​​Use names from more general to more specific, separated by dash ('-'). Example: #generalcategory-specificcategory. This way if someone is in several similar channels, they will be sorted in a way that is helpful for them.Channels about a general topic often begin with #cig (e.g. #cig-performance)Use well-known terms for things that are already being used. Example: #t3cs is used for TYPO3 camp Stuttgart. That is already being used as hashtag. #t3ch-hamburg adds additional clarification and disambiguation.Specific conventions: Channels for specific extensions: #ext-<extkey>, example: #ext-newsChannels for user groups: #t3ug<usergroupname>'', example: #t3ughof (user group Hof), #t3ugrn (user group Rhein-Neckar)Channels for camps: #t3c<location>, e.g. #t3ch (Hamburg) or #t3ch-hamburg (is longer, but avoids ambiguity)Use threads for one topic: To make discussions more clearly arranged, use the threads options It isok to create a thread from someone's message. Direct messages: Please respect the privacy of our users and avoid direct messages. Use them only, if you are already in touch with someone.Use notification wisely: Please consider always before use a @user, @here, @channel notation, if this notification is really needed.How do we get channels closed? Our admin team identifies channel with duplicated purposes or with no actions. They will get archived and later finally deleted. FAQ How do I sign up to the TYPO3 Community Slack?Just visit our guide to sign up a TYPO3 Slack Account.What if I already have a TYPO3 Slack account?You can also connect your existing Slack account with your typo3.org user profile and become part of the TYPO3 Slack community. Login at https://my.typo3.org and use the "connect" option for your account. If you do not have a My TYPO3 login, follow our guide to sign a My TYPO3 account.'''
year_published = 2025
clearnet = "https://typo3.org/community/meet/how-to-use-slack-in-the-typo3-community"
