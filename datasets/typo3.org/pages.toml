full_description = '''Regular Open Sprints Get more done together in open source. In the TYPO3 community, we recommend working together in regular open sprints. This concept was introduced in 2019 by the TYPO3 Association. The idea behind "combined sprints" In the past every team had its own (mostly invite-only) sprints. But for many projects, bringing teams to work together is more effective. For example to work on the typo3.org website: the design team, server team and the website team harmonize well. So that's why we encourage teams to organize combined sprints towards shared goals. And even when teams are working on different projects, being in the same space at the same time helps teams mingle, share ideas, and participants can meet new people. Stefan Busemann Any qustions? Get in contact. Contact Goals Help teams to meet at one location and join forces. Provide a location and accommodation for teams from the regular open sprint budget.Make it easier for interested community members to get involved - onboard them when they want to sneak into a team.Teams can prepare collaborative agendas for regular open sprints, but they can also just share a sprint location. Even when they aren't directly working on the same project, they can get together and share the same space. It is always inspiring when people see what other teams are doing. It's a great way to get new ideas and creative solutions. And of course, these kind of sprints are also open for everyone who wants to contribute to the project. For example, to improve documentation, create content, create a patch, do a review, and to meet others in the community. 23 Jun 27 Jun 2025 TYPO3 Community Sprint Q2/2025 Düsseldorf, Germany The TYPO3 Community Code Sprint for all TYPO3 community teams, initiatives, and those invited by them. All TYPO3 teams are invited to join us in our office in Düsseldorf for our on-location TYPO3 Code Sprint. We — the TYPO3 GmbH — will take care of your hotel costs and provide the location. You — the participants — bring your topics, motivation, and high spirits, and together we will work on moving TYPO3 forward. Please note: Travel costs (train, plane, car) will need to be reimbursed against the teams' budgets — please clarify the rules for that with your team leaders. Register Now more info 8 Sep 12 Sep 2025 TYPO3 Community Sprint Q3/2025 Düsseldorf, Germany The TYPO3 Community Code Sprint for all TYPO3 community teams, initiatives, and those invited by them. All TYPO3 teams are invited to join us in our office in Düsseldorf for our on-location TYPO3 Code Sprint. We — the TYPO3 GmbH — will take care of your hotel costs and provide the location. You — the participants — bring your topics, motivation, and high spirits, and together we will work on moving TYPO3 forward. Please note: Travel costs (train, plane, car) will need to be reimbursed against the teams' budgets — please clarify the rules for that with your team leaders. Register Now more info 10 Nov 14 Nov 2025 TYPO3 Community Sprint Q4/2025 Düsseldorf, Germany The TYPO3 Community Code Sprint for all TYPO3 community teams, initiatives, and those invited by them. All TYPO3 teams are invited to join us in our office in Düsseldorf for our on-location TYPO3 Code Sprint. We — the TYPO3 GmbH — will take care of your hotel costs and provide the location. You — the participants — bring your topics, motivation, and high spirits, and together we will work on moving TYPO3 forward. Please note: Travel costs (train, plane, car) will need to be reimbursed against the teams' budgets — please clarify the rules for that with your team leaders. Register Now more info All events Accommodation Düsseldorf For our sprints in Düsseldorf we do have special rates in a hotel.MoreNote: You have to be logged in, to access that page.'''
year_published = 2025
