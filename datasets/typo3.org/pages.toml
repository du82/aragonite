title = "Contribute and Get Involved in TYPO3"
full_description = "Contribute and Get Involved in TYPO3 User Accounts and Collaboration Tools Create your TYPO3 user account. Your login opens the door to our collaboration tools. Our main collaboration tools are TYPO3 Forge and Slack chat. Forge is public, commenting and contributing requires a TYPO3 user account. Please follow the Code of Conduct. Events: Meeting People in Person Online communication tools cannot replace meeting people in real life. Take part in TYPO3 events to learn new skills and meet other TYPO3 enthusiasts face to face. Donate Time, Bring Your Skills Time, skills, and experience are valued higher than gold in our community. It is easy to get involved in one of our teams or committees. People's skills are what keeps the TYPO3 project going and in good shape. Skills We Need Editing and Proofreading Copywriting Translation Design Marketing PHP and JavaScript Development System Administrators Event Organizers Teams and Committees Where you fit in? These teams and committees make important contributions to all sides of the TYPO3 project. We welcome dedicated people who want to make a difference. Core Development typo3.org Make a One-Time Donation or Become a Member When you do not have time or experience to contribute, money will make a difference. Become a Member One-Time Donation List of all Donors"
