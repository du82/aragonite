["https://typo3.org/community/meet/user-groups"]
title = "TYPO3 User Groups - Meet the community worldwide"
description = "Many users would like to get in personal contact with other TYPO3 enthusiasts. This is how local TYPO3 User Groups (TUG) are formed and knowledge happens."
full_description = "TYPO3 User Groups As TYPO3 is spreading around the world, many users would like to get in personal contact with other TYPO3 enthusiasts. This is how local TYPO3 User Groups (TUG) are formed. These groups are open for everyone, from newbie to expert. Check out the listings on this page, and see whether there is a TYPO3 user group in your area. If not - why not start one yourself? Write a message to info(at)typo3.org. What happens in a TYPO3 User Group? That is totally up to the members of the TUG, but this is a list of suggestions for activities: Exchange of know-how Introducing TYPO3 to newbies Tutorials (how do I accomplish this or that in TYPO3) Talk about how we can support the TYPO3 community Joint work on TYPO3 projects Ideas for new extensions Providing users/customers with local support List of User Groups There are a number of TYPO3 User Groups (TUGs) either established or forming at the moment. If you are interested in joining one of the groups please send an email to the contact person of the group. International TYPO3 User Groups User Groups exist all over the world, below is a list of the ones we are aware of. Please contact the typo3.org team if your user group is missing. AustriaAustria — TirolIndiaRwandaUkraine User Groups in Germany The most vital and sizeable TYPO3 community is in Germany. This is a list of TYPO3 User Groups in Germany: BerlinBodenseeChemnitzDresdenDüsseldorfUsergroup RuhrFrankfurtHamburgJenaKarlsruheKölnLeipzigMagdeburgMünchenRegensburgRhein-NeckarSaarlandStuttgartWürzburg Next user groups"
