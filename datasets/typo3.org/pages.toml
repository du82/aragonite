["https://typo3.org/community/teams/localization"]
title = "Localization"
description = "The TYPO3 Localization Team gathered in Düsseldorf for a full week during the TYPO3 Community Sprint Q4/2024 and made the TYPO3 extension, Crowdin, a reality. The extension provides an in-context feature which enables TYPO3 backend users to translate labels of the TYPO3 Core and extensions directly in the TYPO3 backend."
full_description = "The Localization Team The goal of the localization team is to provide and maintain the services to make TYPO3 core and extensions available in as many languages as possible. What we do: We help to make the localization process as smooth as possible. We take part in helping with errors and bugs in Crowdin or TYPO3 core related to localization. We help developers create projects on the Crowdin server. And we maintain the localization ecosystem. What we don’t do: The localization team does not participate in the actual translation work. The team does not get involved in discussions about labels, grammar, spelling, etc. We don't help extension developers make their extension localizable. Members of the localization team may be involved in these processes, of course, but outside the team. Contact us The best way to reach out is in the Slack #typo3-localization-team channel.Register for SlackOr write us an email at localization(at)typo3.org. Do you want to participate? We're a small team with big ambitions. We can always use more help, so if you would like to join us, please consider which area you would like to contribute to.As a translator?Please read the documentation on how the translation process works. It's easy to get started, but there are a few prerequisites.As a developer?If you're an extension developer and want to make your new extension available in many languages (or extend an existing extension), please read about localizing extensions in the documentation.As a team member?If you would like to join us, please contact us. We work on all technical levels and can always use a helping hand.Join us today and help make TYPO3 the best CMS in ANY language! Peter Kraume Team lead localization(at)typo3.org Abdulhamid Kwieder Team co-lead Preben Rather Sørensen Xavier Perseguers Supporter Georg Ringer Josef Glatz Tue. 24th December, 2024 Translate TYPO3 Backend In-Context Categories: Community, TYPO3 CMS, Localization Created by Xavier Perseguers The TYPO3 Localization Team gathered in Düsseldorf for a full week during the TYPO3 Community Sprint Q4/2024 and made the TYPO3 extension, Crowdin, a reality. The extension provides an in-context feature which enables TYPO3 backend users to translate labels of the TYPO3 Core and extensions directly in the TYPO3 backend. Read more Sun. 14th July, 2024 CMS Localization: What to Consider and Why it Matters Categories: TYPO3 CMS, Localization Created by Panos Semitekolos CMS Localization allows businesses to make an impact on a global scale. From culturally resonant copy, to streamlined content, and high-quality translations, discover how TYPO3 empowers brands to leave their mark. Read more Sun. 7th July, 2024 Help Us Translate TYPO3’s Backend Into Your Language Categories: Localization, Community, TYPO3 CMS Created by Peter Kraume Using software in your native language often makes a huge difference in feeling at home with what you're doing. TYPO3’s backend is no different. With the help of Crowdin, a cloud-based localization technology, all TYPO3 backend labels can be translated into any language. Read more Wed. 12th June, 2024 Translating TYPO3's backend interface using Crowdin Categories: Development, Localization Created by Tom Warwick TYPO3 supports the translation of its backend in any given language and has support for more than forty languages, each in its own state of completion. To better support the process of localization and to make it easier to add new languages to TYPO3’s backend, the localization team partnered with Crowdin, a localization tool designed to help teams translate and maintain their applications translation files. Read more Sun. 24th March, 2024 Report From the Localization Team (2023) Categories: Localization, Community Created by Peter Kraume Last year was marked by the revitalization of the Localization Team. We re-established regular meetings and started working on a number of issues, including decommissioning the old translation infrastructure with Pootle, which had become obsolete since the switch to Crowdin. Read more Mon. 18th December, 2023 Arabic CMS: Mastering Right-to-Left Content Categories: Community, TYPO3 CMS, Localization Created by Abdulhamid Kwieder Join us in celebrating the 2023 World Arabic Language Day and learn about the intricacies and the properties of right-to-left content management, Arabic diacritics, and how TYPO3 can help you master them! Read more Sun. 3rd December, 2023 Shutdown of the Pootle Translation Server Categories: Localization, Development, TYPO3 CMS, Public Service Announcement Created by Peter Kraume Crowdin has been our default translation server for quite some time. We have now decommissioned the infrastructure that supported the old Pootle translation server — here is how it impacts you. Read more Tue. 22nd August, 2023 TYPO3 Fully Translated to Arabic Categories: Community, TYPO3 CMS, Localization Created by Felicity Brand Community member Abdulhamid Kwieder recently shared on the TYPO3 Slack that he has completed the translation of the entire content of the TYPO3 backend to the Arabic language. Read more Wed. 25th November, 2020 Extension Repository Shows Localization Status Categories: Development, Community, Localization Created by Georg Ringer The TYPO3 Extension Repository now includes the status of translations for extensions drawn from Crowdin. This is an exciting development because TYPO3 is an international community. Previously, it was difficult to find out the status of translation for particular extensions, and now it is publicly available for all users to see. Read more Mon. 23rd September, 2019 Better Multilingual Support with Crowdin Categories: Community, TYPO3 CMS, Localization Created by Georg Ringer The multilingual backend has always been a great benefit of TYPO3. Whether you’re French, German, or English-speaking, having the editing and administrative user interface in a language you understand means you can work faster and more confidently. After a long history with Pootle, TYPO3 is moving on to Crowdin, to take translation to the next level. Read more"
year_published = 2024
clearnet = "https://typo3.org/community/teams/localization"
