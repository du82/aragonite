title = "TYPO3 CMS – Open Source Content Management"
description = "Free and open source, TYPO3 CMS is a leading content management system with a feature set eclipsing that of our commercial and proprietary competitors."
full_description = "TYPO3 Delivers Blazingly Fast, Flexible Websites Powered by an enterprise open-source CMS, and backed by a vibrant professional community and a commercial ecosystem—use TYPO3 to connect to your customers and compete in today’s landscape with the richest digital experiences. #cms-landing{ font-size: 1.5rem; padding: 2rem 2rem; } #cms-landing-img{ width: auto; height: 13rem; position: absolute; right: 5%; top:25%; } .cms-landing-button{ max-width: 25rem; padding: 0.8rem; } /*------ Fenstergrösse max 1260px --------------------------------- */ @media (max-width: 1260px) { #cms-landing-img { display:none; } } Scalable multisite, multilingual installations for global campaigns and organizations. Connect anything. Open, adaptable, pluggable, decoupled architecture. Runs anywhere. Set up new sites in minutes on your existing infrastructure. Blazingly fast for higher engagement and more conversions. Secure, respects user privacy by design. Vibrant professional community backed by a strong commercial ecosystem. Learn More Comprehensive Feature List Demo: Try TYPO3 Now View Case Studies at typo3.com Case Studies and Best Practice Major Brands & Companies Trust TYPO3 TYPO3 is used by many well-known companies and organizations. Take a look at the case-studies and see for yourself: Choosing TYPO3 will be a good decision. Open Source TYPO3 CMS is free software published under the GPL license. You will never have to pay a fee for using it. This also means that everyone can improve the CMS. More About the License TYPO3 Association The TYPO3 Association is the official representative body of TYPO3 CMS. It coordinates and funds the long-term development of the TYPO3 CMS platform. More About the TYPO3 Association"
