["https://typo3.org/community/meet/chat-slack"]
title = "Chat With the TYPO3 Community on Slack"
description = "It is the main channel for communication in the TYPO3 community. This page explains how to get access to TYPO3’s Slack workspace."
full_description = "Chat With the TYPO3 Community on Slack Slack is an instant messaging and team collaboration tool. It is our main channel for communication in the TYPO3 community. This page explains how to get access to TYPO3’s Slack workspace through your new or existing my.typo3.org user profile. Go to TYPO3’s Slack Workspace Please read the introduction to Slack before you start using the tool. How to Get Your TYPO3 Slack Account 1. Register Your My TYPO3 Account In order to use TYPO3 Slack you must first register a My TYPO3 account. Head to the my.typo3.org account registration page to start the process.If you already have a My TYPO3 account, you can continue to step 2.Register a New My TYPO3 Account 2. Slack invite Log in to your My TYPO3 account at my.typo3.org/login. After logging in, you will be directed to your profile page. On your profile page, look for the Connected Services section. Click on the Invite Me button. An email with an invitation link will be sent to your email. If you already have a user in TYPO3 Slack, you can connect it to your my.typo3.org account by clicking the Connect button. 3. Confirm Invitation mail Open your email client and look for the invitation email. In the email, click on the Join Now link. A Slack user account setup page will open in your web browser. When prompted, enter your desired password for the TYPO3 Slack workspace. Complete your Slack profile setup. Please Note: For technical reasons, your my.typo3.org account does not allow you to gain access to Slack directly. That’s why you are asked to set up a Slack user account and supply a password for it. Your Slack login credentials are therefore not the same as the ones you use for your My TYPO3 account."
