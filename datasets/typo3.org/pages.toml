["https://typo3.org/community/contribute/donate"]
title = "Donate to the TYPO3 Association"
description = "TYPO3 is an Open Source project, dependent in large parts on donations. This page is for those who want to donate money"
full_description = "Donate to TYPO3 TYPO3 is an Open Source project, dependent in large parts on donations. This page presents a straight-forward donation process. Try it out, you'll be amazed how good it feels to donate. The Best Way to Donate Become a Member We are happy to accept your donation, but the best and most sustainable way to support TYPO3 is to become a member of the TYPO3 Association. Annual memberships start at less than EUR 8 and go up to EUR 12500, so every individual and every company has the possibility to donate according to their means. Reliable funding is the only way to secure the development of TYPO3 CMS. Questions? If you have questions regarding the donation form or other ways to support the TYPO3 project, please feel free to email us at donation(at)typo3.org Donation Agreement Please Read All donations from the donation form will be published in the List of Donations. We accept donations via PayPal only. Minimum donation for a web link is EUR 125. Recurring monthly donation web links are available from EUR 100/month, for a minimum of 6 months. If you would like your name to link to your website, please request this by filling in the appropriate form field when donating. Please note that we will check your website URL. Links to illegal or inappropriate content will be refused, including gambling, porn, violence, racism, ponzi schemes, make-money-quickly, etc. We will give no refunds. Donate via Paypal Donate now Donate through the TYPO3 Shop You can also purchase sponsorship and donations at the TYPO3 Shop."
year_published = 2025
