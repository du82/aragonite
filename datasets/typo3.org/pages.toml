["https://typo3.org/cms/comparison-cards"]
title = "The TYPO3 Comparison Cards"
description = "Super charge your sales presentations with fact-based comparisons between TYPO3 and other products and features."
full_description = "The TYPO3 Comparison Cards What Are Comparison Cards and Why Do We Need Them? When it comes to choosing a CMS there are tons of solutions available online—and the market is continuously growing. Without knowing what you actually need and what the different systems can offer you, it can be quite overwhelming to pick and choose the right CMS for your needs. The Comparison Cards are meant for everyone selling CMS to customers, who needs support when it comes to evaluating different solutions.The purpose of the Comparison Cards is to help people compare TYPO3 to alternatives with at-a-glance reference material, based on facts and without objections. Which Products Did We Evaluate? 1. One-on-one comparisons to other products In the first batch, we evaluated WordPress, Drupal, Joomla! and Sitecore Experience Platform. These were chosen based on surveys and discussions. 2. Comparisons to product categories In the second batch, we evaluated the wider market in distinct categories. There are many offerings in each category, but they have similar attributes. The second batch includes SaaS, Headless-only CMS and Digital Experience Platforms (DXP). How to Use the Comparison Cards The Comparison Cards have been created to help sell TYPO3 better and enable salespeople to create fact based comparisons between TYPO3 and competitor (products). The slides should be seen as an assistance tool for agency and solutions presentations. Please note that the Comparison Cards listed here should be seen as version 1. They are current as of March 2021 and we expect to update them at least on a yearly basis or with the release of new major versions.If you would like to provide feedback on the existing ones, please do so by contacting us in the #marketing Slack channel. Download the Comparison Cards You have to be logged in to see this content. Log in or create an account."
year_published = 2025
