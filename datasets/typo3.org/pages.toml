["https://typo3.org/community/teams/education-certification"]
title = "The TYPO3 Education & Certification Committee"
description = "The committee is responsible for the TYPO3 education strategy, enabling easy access to learning materials, as well as official certifications."
full_description = "TYPO3 Education Committee The TYPO3 Education Committee has been installed by the TYPO3 Association's Board and Expert Advisory Board in early 2014. It is meant to create an education strategy, enabling community members and TYPO3 beginners to access TYPO3 related learning easier and manage the TYPO3 certification program.We want to foster the number of qualified and well trained and certified TYPO3 professionals and achieve a growth of the community and the ecosystem around TYPO3. The work of the Education Committee shall support companies in the continuing education of their employees. How you can help We have ambitious objectives and we are therefore working on a high pace. We’d love to have some more help within the committee itself and the related teams and task forces. If you like to get involved on a regular and reliable base with a great motivated team please get in touch with Marc (marc.willmann(at)typo3.org), or check our official TYPO3 Slack Channels #edu-general and #typo3-certification.LinksEducation Committee on Twitter What happens in the Education Committee? We are planning two sprints every year with as many Education Committee members as possible as well as many small sprints of the respecting task forces. This workflow is both very effective and respects the team spirit.Report from the Major Sprint I/2023 in Düsseldorf (April 2023)Report from the Major Sprint I/2019 in Hamburg (February 2019) Leader Marc Willmann marc.willmann(at)typo3.orgSlack: @marc-willmannCo-LeaderGernot Ploinergernot.ploiner(at)typo3.orgSlack: @gernottAndreas WolfAnja LeichsenringAxel HempeltBoris HinzerDaniel SiepmannFlorian WeissFrank SchüsslerKerstin NäglerKnud FrankKorbinian KugelmannLarissa SchleinLennart RuschlauLisa KreitzMichael SchamsMoritz KrausOliver ThieleOliver WandPeter PröllSandra ErbelSarah McCarthyTom NovotnyTorben FreudewaldWolfgang TwarochWolfgang Wagner"
