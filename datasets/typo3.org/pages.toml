title = "The TYPO3 Community—More Than Software"
description = "The TYPO3 Community is growing, and we do more than just developing software. Everyone is welcome. Offer your skills and contribute to TYPO3."
full_description = "The TYPO3 Community The TYPO3 Community is growing, and we do more than develop software. Offer your skills and contribute to the project. Coding, design, writing, or maybe something else entirely? Everyone is welcome. Membership in the TYPO3 Association is never a requirement, but many people from the community choose to become members in order to have a stronger influence on the direction of the TYPO3 project. Meet the Community Online, at events, or in user groups. There are many ways to meet us. Meet the Community Contribute to TYPO3 Work together, use your skills, and gain experience. Contribute / Get Involved Conferences and Events TYPO3 events combine fun and meetings with serious learning. Upcoming Events Community Values We promote trust, respect, openness, and sharing. Values and Proceedings Become a Part of Something Big! For Developers Developers expand and improve on the TYPO3 software. Supply patches Test and report Help others Write documentation Start Developing For Everybody Else Non-developers can also contribute. Designers, photographers, writers, translators, etc., are welcome to join.MarketingNewsDocumentationOrganize eventsJoin a Team Social Life Outsiders often remark on the active social life of the TYPO3 community. User group meetings Bar camps Sports events Conferences TYPO3 Events"
