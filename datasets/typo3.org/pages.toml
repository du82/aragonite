["https://typo3.org/community/dataprotection-corner"]
title = "Data Protection Corner"
full_description = 'Data Protection "Karens Corner" Welcome at my little corner. My name is Karen Falkenberg and I am taking care about Data Protection in the TYPO3 project. I have been working as a data protection officer for various clients since 2010. In 2018 started my work for the TYPO3 Association.Data protection should not be an obstacle but a challenge and an opportunity. As a data protection officer, I support process analysis and control, so processes can be optimized with the data controller. This approach leads to a good level of data protection. What are my tasks? My tasks are the tasks of a data protection officer resulting from Art. 39 GDPR. [Source]The data protection officer shall have at least the following tasks: to inform and advise the controller or the processor and the employees who carry out processing of their obligations pursuant to this Regulation and to other Union or Member State data protection provisions;to monitor compliance with this Regulation, with other Union or Member State data protection provisions and with the policies of the controller or processor in relation to the protection of personal data, including the assignment of responsibilities, awareness-raising and training of staff involved in processing operations, and the related audits;to provide advice where requested as regards the data protection impact assessment and monitor its performance pursuant to Article 35;to cooperate with the supervisory authority;to act as the contact point for the supervisory authority on issues relating to processing, including the prior consultation referred to in Article 36, and to consult, where appropriate, with regard to any other matter.The data protection officer shall in the performance of his or her tasks have due regard to the risk associated with processing operations, taking into account the nature, scope, context and purposes of processing.Please note: I can help you for questions, if you are involved in the TYPO3 Association / Community. Consulting for private projects is not possible! Get in touch Do you have any questions about Data protection within the TYPO3 project? Contact me and I will try to help you. Phone +49 2307 80102 Mail karen.falkenberg(at)typo3.org'
year_published = 2025
clearnet = "https://typo3.org/community/dataprotection-corner"
