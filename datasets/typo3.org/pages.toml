["https://typo3.org/community/teams/documentation"]
title = "The TYPO3 Documentation Team"
description = "The TYPO3 Documentation Team has enhanced the resources available to new integrators and developers, delivering a completely revamped Getting Started Tutorial. With updated content and new sections, this guide is designed to help newcomers confidently navigate TYPO3 from day one."
full_description = "The TYPO3 Documentation Team Our main goal is comprehensive, relevant, up-to-date and easy to find documentation about TYPO3 products for all users.The Documentation Team sets the stage for you - the community - to write great documentation. Though we do love to write and update documentation, the purpose of our team is to provide the TYPO3 community with the tools to improve documentation. This includes information about using the tools to write great documentation. We strongly encourage the community to get involved. If you want to start right now, skip to the Contribute section on this page! Contribute Contact us The best way to contact the Documentation Team is in the Slack #typo3-documentation channel.Register for Slack Slack Calls The Documentation Team uses regular Slack calls to talk about ongoing tasks. The meetings are announced in the Slack channel #typo3-documentation. Become Part of the Documentation Team! The Documentation Team provides the infrastructure and support to help the TYPO3 community write great documentation.Documentation is important to you?You would like to work on improving the technical infrastructure?You like to improve things?You want to help us in any way? Good documentation is important. You can contribute!Contact Us! Lina Wolf Leader Sandra Erbel Co-Leader Garvin Hicking GitHub Administrator Martin Bless Member Sarah McCarthy Member Stefan Frömken Member Jaap van Otterdijk (Jaapio) Member (Tooling, phpDocumentor) Contribute If you do not wish to officially join the Documentation Team just yet, you can still contribute to the documentation.Read More About Documentation Contribution Contribution Workflow Did you know that contributing to the documentation has never been easier? That you are just one click away from starting a contribution yourself every time you visit a page on https://docs.typo3.org? Every official manual is contained in a GitHub repository and can be edited by anyone with a GitHub account. You can also edit a page directly on GitHub. All you need for that is a browser. If you are familiar with using Git and Docker, you can clone the repository and edit and render locally instead. Contribute now! Ways to Contribute There are several ways to contribute and things you can do as a contributor: Look at How You can Help for some ideas for contributions For individual projects see Documentation Intiatives Long term and continous work on the documentation is important. Please consider joining the Documentation Team You can ask on Slack for things to do Past Achievements You can browse through the Documentation Changelogs to see past achievements. But do note that a significant number of these achievements were contributed by community members who were not Documentation Team members. But that is a good thing because that is what we want to do: Involve you in creating great documentation. Responsibilities of the Documentation Team The Documentation Team provides the following:Information about how to write documentationSupport via the Slack channel #typo3-documentation: Answer questions about writing documentation and using the toolsSupport the TYPO3 CMS Core Team and other teams in their documentation effortsRendering of official manuals and extensions on the documentation server docs.typo3.org via automated toolchainDocker image for local renderingThemeOrganize sprints for working on documentation related tasksPromote the work by writing news on typo3.org, tweeting and speaking at eventsThe following tasks were previously the responsibility of the documentation team and have now been redefined:Translation of manuals: The Documentation Team can help others in matters concerning workflow and tools, but it concentrates its efforts on manuals in English.https://wiki.typo3.org: The technical infrastructure is handled by the Server Team. Who will coordinate maintaining / migrating the content is yet to be defined.https://api.typo3.org: The technical infrastructure is handled by the Server Team.Writing content: Writing content must be a combined effort of the TYPO3 community.Maintaining content: Content must continuously be updated and maintained. The long term goal is to put this in the hands of dedicated manual maintainers. Documentation News See also Documentation Changelogs on docs.typo3.org. Sun. 2nd February, 2025 Community Budget Idea: Improving Documentation for New Integrators and Developers Categories: Budget idea, Community, Documentation Created by Maike Kiebele The TYPO3 Documentation Team has enhanced the resources available to new integrators and developers, delivering a completely revamped Getting Started Tutorial. With updated content and new sections, this guide is designed to help newcomers confidently navigate TYPO3 from day one. Read more Fri. 31st January, 2025 Getting Started With TYPO3 CMS Categories: TYPO3 CMS, Documentation Created by Tom Warwick Whether you're new to TYPO3 or perhaps you’ve used it in the past, this short guide is the ideal starting point. In this guide we’re going to introduce some TYPO3 concepts, then look at how we log in and navigate TYPO3’s backend. Read more Sun. 26th January, 2025 Annual Report of the TYPO3 Documentation Team Categories: Community, TYPO3 CMS, Documentation Created by Beatrice Finocchiaro The TYPO3 Documentation Team made significant strides in 2024, achieving groundbreaking advancements and key improvements. Let’s explore the accomplishments and contributions that defined this transformative year. Read more Thu. 16th January, 2025 Visitors From the Symfony World Contribute To TYPO3 Documentation Search Frontend Categories: Development, Documentation, Community Created by Mathias Bolt Lesniak When the much-improved functionality at docs.typo3.org was implemented, it still missed a nice-looking frontend. That work was completed by two French companies from the Symfony world. Here’s their story. Read more Tue. 31st December, 2024 Documentation Made Easier With Markdown Categories: Community, Documentation Created by Beatrice Finocchiaro With Markdown, contributors can create and edit documentation using a format that's both simpler and more intuitive. This helps to break down the barriers of programming. If needed, you can switch to ReST later, for more advanced features. Read more Thu. 28th November, 2024 Become a TYPO3 First Responder at talk.typo3.org Categories: Community, Documentation, Education & Certification Created by Andreas Nedbal Everyone who asks a question at talk.typo3.org deserves a quick response, and we're looking for help with initial triaging. Make people feel welcome in the TYPO3 world — and it can require just half an hour a week. Read more Wed. 20th November, 2024 First Steps Towards Implementing CommonMark Markdown for TYPO3 Documentation Categories: Budget idea, Development, Association, Documentation Created by Florian Thiele As the TYPO3 Documentation Team, we’re excited to share the progress we’ve made so far on our current project: extending TYPO3’s documentation support to fully embrace CommonMark Markdown syntax. Read more Sun. 17th November, 2024 Community Budget Idea Interim Report: Improving Documentation for New Integrators and Developers Categories: Budget idea, Community, Documentation Created by Björn Huber To assist newcomers to TYPO3, the initiative to improve documentation for new integrators and developers will update and restructure key resources to make them more accessible and easier to follow. Read more Sun. 13th October, 2024 Transition to Full PHP-Based Rendering for All TYPO3 Extension Manuals Categories: Community, Documentation Created by Florian Thiele We are excited to announce that the TYPO3 Documentation Team is preparing to fully transition all extension manuals to the new PHP-based reStructuredText (reST) rendering system, and we will be shutting down the old Sphinx-based rendering in the near future. Read more Fri. 4th October, 2024 How to Streamline Your Data Exports with Download Presets in TYPO3 v13 Categories: Demo, Development, TYPO3 CMS, Documentation Created by Tom Warwick Presets can be tailored to only include the columns you require for download. Plus, it can be shared with other backend users so that they have the ability to run the export themselves. Watch our latest video. Read more « ‹ 1 2 › »"
