["https://uaudio.com/ua-giving"]
title = "UA Giving"
description = "UA Giving partners with leading nonprofit organizations that share the values of music education, equality, and community outreach."
full_description = "UA supports the preservation of music education, especially in underserved communities that need it most. UA is an ally in furthering equal access to social and economic opportunity worldwide to improve lives. With offices in Amsterdam, Boulder, Scotts Valley, and Santa Cruz, UA employees make a positive impact on the communities where we live and work. To support humanitarian relief efforts for the Ukrainian people, UA Giving donated 100% of our online store proceeds on March 16th — $152,000 — to World Central Kitchen, Community Organized Relief Effort (CORE), and Doctors Without Borders. Learn more about UA’s response to the situation in Ukraine here. LDF seeks structural changes to expand democracy, eliminate disparities, and achieve racial justice, fulfilling the promise of equality for all Americans. Helping kids, schools, and communities discover their full potential through music, Save The Music is a nonprofit that has supported music education for over 20 years. Since the 1950s,YMF has provided access to high quality music education and experiences to students and communities at the margins of society. The Digital NEST aspires to give youth access to the best technology, training, and experiences that prepare them for today's technology workforce. Our partnership with Universal Audio sparks their creativity while teaching them valuable audio production skills. Universal Audio is a longstanding community partner of ours. They continued to provide generous support to our “Mondays with Kuumbwa” virtual concert series, and their Apollo 8 interface and UAD plug-ins make our sound exceptional too! Thank you UA! Over the years, Universal Audio’s contributions through the Holiday Food and Fund Drive have provided nearly 50,000 meals to our neighbors in need. This is truly a team effort and we could not feed hope in our community without their partnership. Without music in my younger years, I might not be here now. Music education gave me a voice when I didn’t fit into the status quo."
