full_description = "From rare tube compressors and equalizers, to vintage reverb processors and tape machines, UAD Powered Plug-Ins inject three-dimensional “out-of-the-box” analog sound to your in-the-box and live mixes. With UAD Powered Plug-Ins, the actual processing is offloaded to UAD-2 hardware. This frees up your computer to do other things, like mixing audio and running samplers or soft synths. Whether it’s Thunderbolt, USB or FireWire, UAD-2 Satellite DSP Accelerators offer simple “plug-and-play” portability for a powerful mobile recording rig. UAD Powered Plug-Ins are compatible with both Mac and Windows, and run smoothly in all major DAWs including Pro Tools, Logic Pro, Cubase, Ableton Live, and more. A sleek, portable Thunderbolt 3 DSP accelerator for Mac and Windows users, bringing the rich analog sound of UAD plug-ins to all major DAWs. Available with UAD-2 QUAD or OCTO Core processing. A portable DSP accelerator solution for Windows users — “supercharging” DAWs with the rich analog sound of UAD plug-ins over USB 3. Available with UAD-2 QUAD or OCTO Core processing. The compact, easy solution for DSP acceleration of UAD plug-ins on FireWire-equipped Macs and PCs. Available with UAD-2 QUAD processing. User-installable DSP accelerator cards for running acclaimed UAD plug-ins on desktop towers or PCIe expansion chassis. Available with UAD-2 QUAD or OCTO Core processing. A sleek, portable Thunderbolt 3 DSP accelerator for Mac and Windows users, bringing the rich analog sound of UAD plug-ins to all major DAWs. Available with UAD-2 QUAD or OCTO Core processing. A portable DSP accelerator solution for Windows users — “supercharging” DAWs with the rich analog sound of UAD plug-ins over USB 3. Available with UAD-2 QUAD or OCTO Core processing. The compact, easy solution for DSP acceleration of UAD plug-ins on FireWire-equipped Macs and PCs. Available with UAD-2 QUAD processing. User-installable DSP accelerator cards for running acclaimed UAD plug-ins on desktop