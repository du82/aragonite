full_description = '''UAD Native plug-ins run on both macOS 10.15 Catalina or newer and Windows 10 and 11. Go to our UA Support page for system requirements. The SSL E Series Channel Strip plug-in gives you everything you need to dial in professional, polished tracks with classic SSL sonics. With the inclusion of both the Type E “black knob” and “brown knob” four-band EQ and filters — hallowed in SSL lineage — you can apply refined punch to drums, presence to vocals, and heft to bass. Other features include high and low cut filters, an expander/gate, and compression. A faithful circuit emulation of the legendary SSL 4000 G console's bus compressor, this iconic dynamics processor delivers undeniable drive and punch that helped make the original 4000 G Series the world's most successful production console. Top engineers have come to rely on this master compressor to "glue together" mixes like nothing else, as well as patching into it for stunningly musical results on drums, pianos, and more. Yes another brilliant one from SSL 4000G been using SSL Bus Compressor a lot recently in mixes so this was another one for the group! Does what it says on the packet. Easy to use presets... Yes another brilliant one from SSL 4000E been using SSL channel strips a lot recently in mixes so this was another one for the group! Does what it says on the packet. Easy to use presets... Of all the emulations I've tried, this is by far the best, look no further, it's incredible how it handles sound, the EQ curves are extremely musical unlike other emulations, buy it, you... Most authentic SSL 4000 E Channel Strip plug-in, including mic preamp modeling Developed and voiced in close partnership with Solid State Logic Record in realtime using Apollo interface with Unison technology for authentic analog input impedance and gain staging Now includes Jensen transformer Input amplifier and other nonlinear circuit behaviors Exacting nonlinear circuit emulation of both Type E “black” and “brown” knob