["https://www.uaudio.com/uad-plugins/plug-in-bundles/uad-guitar-amp-bundle.html"]
title = "UAD Guitar Amp Bundle | UAD Audio Plugins | Universal Audio"
description = "Play and record through the greatest tube amps ever made, right in your DAW."
full_description = '''Included version: UAD Native Explore the quintessential British valve amp tones beloved by bands from Queen to U2 to Radiohead*. The Ruby '63 Top Boost Amplifier plug-in serves up everything from choirboy cleans to complex overdrive and classic vibrato effects. Plus you'll get classic boost effects, room sound, and a collection of perfectly miked speaker cabs. Included version: UAD Native Play through the essential American tube amp sounds beloved by artists and producers for more than 60 years. The Dream '65 Reverb Amplifier plug-in perfectly captures the timeless sound and feel of a "golden unit" 1965 reverb amp — with its bold cleans, sweet tube breakup, and divine spring reverb and vibrato — along with built-in boosts, famous amp mods, and a collection of perfectly mic'd speaker cabs. Included version: UAD Native Experience the classic British amp sounds made famous by decades of legendary rock bands. The Lion ‘68 Super Lead Amp plug-in delivers the sound of three distinct 100-watt plexi amplifiers, so you can enjoy the same gorgeous cleans, aggressive breakup, and hot-rodded roar of the originals. Plus you'll get classic boost effects, room sound, and a collection of perfectly mic'd speaker cabs. Yes, for every UAD plug-in that supports native and Apollo/UAD-2 versions, you get a license for both. Yes, absolutely, our new bundles provide tremendous value on some of our most popular collections of plug-ins, and native versions are included for the best of both worlds. Native UAD plug-ins also allow you to record and mix on-the-go without attaching UAD hardware. I'VE BEEN PLAYING THE FENDER '65 FOR SO MANY YEARS AND THIS PLUGIN COME SO CLOSE TO THE REAL THING. I LUV THIS AMP SIM!!!! Lots of folks out here wondering why UA's Dream Verb and other Spark plugins don't take advantage of the Unison slot on their Apollos? Well, that's simple. That would be a zero latency... These plugins are absolutely incredible! The sound quality is outstanding, and the fact that I can have access to all these...'''
year_published = 2025
