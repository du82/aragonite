["https://www.uaudio.com/uad-plugins/reverbs/uad-sound-city-studios-plug-in.html"]
title = "UAD Sound City Studios Plug-In | UAD Audio Plugins | Universal Audio"
description = "Universal Audio is the world’s leader in Thunderbolt audio interfaces, analog recording hardware, and UAD audio plug-ins. Explore products and shop now."
full_description = '''UAD Native plug-ins run on both macOS 10.15 Catalina or newer and Windows 10 and 11. Go to our UA Support page for system requirements. Sound City Studios' famous Studio A is the birthplace of hundreds of hit records. Voiced with original multitrack recordings cut at Sound City Studios, we expertly captured the distinct "warts and all" character — with historical setup guidance from engineers who used it everyday — so you can easily put your productions in the same space where magic was made. Simply choose your source — vocals, drums, guitar, ensembles, or piano — and get proven room and mic setups, from the big reflective sound used on Nirvana's Nevermind to Tom Petty's intimate "wood" corner.* You can even re-mic your guitars with a selection of perfectly placed cabinets and room mics. Go far beyond historic setups and customize your space by moving a stunning collection of classic condenser and ribbon mics from AKG, Neumann, and RCA — in realtime for authentic room sounds beyond the original chart-topping positions.** The centerpiece of Studio A since the early '70s, Sound City Studios' custom-made console artfully colored everything that ran through it. Now you can get the same satisfying analog character and tone with perfect emulations of a vintage British 3-band EQ and bus compressor on all your sources. Along with the legendary limiting of the iconic Rev E 1176 compressor, Sound City Studios gives you the first-ever emulation of the Dolby A301** noise reduction system — a multiband EQ/limiter used and abused by Sound City Studios' engineers — so you can get the same glossy-to-hyped background vocals and explosive drum sounds heard on decades of hit records. Put the finishing touch on your tracks with the same natural, open-sounding reverb used by Queens of the Stone Age, Phoebe Bridgers, Death Cab for Cutie, and more. Plus, you can season your ambient space using perfectly placed pairs of dynamic, small-diaphragm condenser, and ribbon mics.* Learn how to add classic drum ambience, re‑amp guitar tones, and craft unique airy background vocals using the UAD Sound City Studios plug-in.'''
