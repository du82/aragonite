description = "Released in 2004, the hand-built 6176 has been the channel strip to stars including Coldplay, Adele, and Pharrell. Now you can get an entirely new UAD channel strip that puts decades of classic and modern vocal, guitar, drum, and bass sounds at the flip o"
full_description = "UAD Native plug-ins run on both macOS 10.15 Catalina or newer and Windows 10 and 11. Go to our UA Support page for system requirements. Bill Putnam Jr. discusses UA’s long legacy of innovating legendary hardware like the 1176, LA-2A, and 610 preamp — and what inspired him to combine them into modern tools that help musicians around the world make records. Bill Putnam’s 610 Modular Amplifier preamp was a milestone in audio history, introduced in the 1960’s and used to record everyone from the Beach Boys, Ray Charles, and Johnny Cash to Coldplay and Adele. The LA-6176 plug-in features the modern 610-B circuit, giving you even deeper EQ controls for adding rich tube sound that works on everything. The 6176 hardware is the first channel strip to pair our iconic 610 tube preamp with classic 1176 Limiting Amplifier. The 1176 is the compressor that defined decades of popular rock and pop music, from Led Zeppelin to Bob Marley to Beyonce. Its FET-based circuit delivers ultra fast response to guitar, bass, and drum transients making your tracks pop through the speakers. Borrowing from our LA-610 MkII hardware channel strip, the LA-6176 plug-in packs iconic optical compression at the flip of a switch. In LA-2A mode, you’ll get the same silky compression heard on classic vocal and instrument recordings for over 60 years. Plus, you can easily toggle between the LA-2A and 1176 modes to find your perfect sound. With an Apollo interface and Unison technology, the LA-6176 Signature Channel Strip makes you forget you’re recording through a plug-in. You'll get all the unique impedance, gain stage sweet spots, and circuit behaviors of an original 610 tube preamp. And when you add in two legendary compressors — it puts three of our most famous analog circuits on a single Unison channel. Learn the settings on LA-6176 Signature Channel Strip that unlock dreamy analog sounds for vocals, drums, and bass. This is the BEST sounding channel strip plugin I currently own (and I own quite a few, many of which are considered to be TOP NOTCH). Also, you’re getting two plugins for the price of..."
