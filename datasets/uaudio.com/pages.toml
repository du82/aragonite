title = "UAD & Apollo Tips | Universal Audio"
description = "Universal Audio is the world’s leader in Thunderbolt audio interfaces, analog recording hardware, and UAD audio plug-ins. Explore products and shop now."
full_description = 'There’s a lot to consider when choosing an audio interface. Here’s three easy questions to help you find the perfect interface for your needs. Learn to get the most from Capitol Chambers, Universal Audio’s stunning reverb plug-in, which emulates the echo chambers originally designed by Les Paul and located 30-feet beneath the iconic Capitol Records Building in Los Angeles. Watch the full UAD 5-Min Tip video and learn how the Pure Plate Reverb gives your mixes the natural depth and shimmer that only plate reverb can provide. In this 5-Minute UAD Tip, learn how to use the UAD Helios Type 69 Preamp and EQ plug-in to mix live drums using only the Helios channel strip. In this "5-Minute UAD Tips" video, learn how the UAD Lexicon 480L Digital Reverb can inject space and dimension to your mixes. Watch the full UAD 5-Min Tip video and learn how the EL8 Distressor compressor can transform your mixes into something truly special. In this installment of Presets Unpacked, we dig into engineer/mixer Peter Mokran’s “Vocal” preset for the UAD Pure Plate Reverb. In this 5-Minute UAD Tip, learn how to craft tastefully saturated bass and electric guitar tones with the UAD Century Tube Channel Strip plug-in.'
