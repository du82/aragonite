full_description = '''#hero__item_9306 { padding-bottom: initial; } @media (min-width: 981px) { #hero__item_9306 { padding-bottom: 55.4%; } } Portable Recording with Volt Interfaces Facebook Twitter LinkedIn Email Learn how to capture your sound anywhere. There's remote recording, and then there's remote recording. Here, with the help of Madeline Dahm and Cameron Crabtree, you'll learn how to easily record yourself with pro sound, even in the bucolic Northern California redwoods. Your Portable Recording Packing List iPad (iOS 14 or later) loaded with free GarageBand recording software Volt 276 audio interface USB-C cable to connect to an iPad with USB-C (or an Apple Lightning to USB Camera Adapter to connect to other iPadOS and iOS devices) External power supply or USB battery bank for your Volt (unless you have an iPad Pro) Two mics (we’re using UA SC-1 Standard Condenser mics) Mic cables and stand .asset_9305 { padding-bottom: 62.5% !important; } @media (min-width: 769px) { .asset_9305 { padding-bottom: 62.5% !important; } } Recording in the Northern Californian redwoods using a Volt 276 audio interface, SC-1 Standard Condenser microphones, and an iPad. Let's Get Set Up Volt connects to the iPad via USB-C to USB-A cable and Lightning to USB adapter. An external USB power bank connects to Volt and keeps the iPad battery from draining too quickly. Connect the two mics to the XLR inputs on Volt Engage Volt's Vintage mode on both mics. This gives you a warm analog tone based on the classic UA 610 tube preamp For the vocal mic, use the "Vocal" compressor setting and likewise "Guitar" compression setting for the acoustic For the vocals, the singer is around 6″ from the mic. The windscreen helps control plosives For the guitar, position the mic around the 12th fret, pointed towards the soundhole Press Volt's Direct button twice until it turns blue to hear both inputs centered in your headphones In GarageBand, create two new tracks and assign each of Volt's inputs Record 