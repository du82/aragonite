["https://uaudio.com/guitar-pedals/anti-1992-high-gain-amp.html"]
title = "ANTI 1992 High Gain Amp | Universal Audio"
description = "ANTI 1992 High Gain Amp is a stereo amp and cab emulation pedal with six famous mic/speaker pairs, built-in boosts, live and preset modes, and customization with the UAFX mobile app."
full_description = "In punishing detail, ANTI 1992 High Gain Amp captures the sound of the 120-watt amp that gave rise to notorious Metal subgenres throughout the '90s. From Thrash and Death Metal to Grunge, Black Metal, and beyond — ANTI delivers the rich, scooped tones that have fueled iconic bands for decades. ANTI’s built-in noise gate keeps your signal clear, even at super high gain settings. And its TS-style overdrive adds classic mid-boost saturation, perfect for tight and articulate playing. Or switch to an integrated preamp boost for classic Scandinavian metal tones. ANTI’s six perfectly-modeled mic and speaker combinations conjure legendary sounds used on decades of famous metal recordings. Whether you’re chasing the brutal clarity of Scandinavian Death Metal or the thick, saturated crunch of American Thrash, ANTI puts a palette of vicious tones at your feet. With the UAFX mobile app, you can pull up presets designed by pro guitarists or sculpt and save your own sounds to recall at any time. Plus the app unlocks deep customization for your pedal, allowing you to tweak hidden controls, boosts and noise gate settings, and even adjust output tube biasing."
year_published = 2025
clearnet = "https://uaudio.com/guitar-pedals/anti-1992-high-gain-amp.html"
