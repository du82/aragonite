title = "OX | Amp Top Box | Universal Audio"
description = "OX Amp Top Box is a premium reactive load box and guitar recording system that lets you play and record your tube amp in its sweet spots — from huge clean tones and edge-of-breakup to fully cranked — at any volume level, and with mic, room, and speaker ca"
full_description = "OX’s front-panel, six-position RIG control allows you to quickly choose from complete setups — including emulated speaker cabinets, close mics, ambient room mics, and up to four simultaneous studio effects. OX is also the only guitar recording system to offer a complete selection of expertly placed room mics, giving you the authentic experience of pushing air while recording your cranked amp in a world-class tracking room. UA’s groundbreaking Dynamic Speaker Modeling faithfully emulates speaker breakup, drive, and cone cry — an essential ingredient to authentic tube amp tones. Using the Speaker Breakup knob in the OX app, you can control the harmonics and sonic complexity that occurs only at certain frequencies and volume levels on various speakers — far beyond a static Impulse Response system — giving you the same sonic phenomenon that occurs with a real speaker cabinet. Not only does OX Amp Top Box feature a front-panel headphone jack for silent practice with your cranked tube amp, it also sports a bevy of connections for all kinds of recording and live workflows. Stereo S/PDIF digital outputs via RCA and optical TOSLINK, as well as balanced TRS stereo line outputs with front panel level control, give you the necessary connections for studio monitors, DAW, or live mixing console inputs. Plus, you can connect any one, two, or three-button footswitch and toggle OX's studio-quality effects on and off. Most guitar products do digital awkwardly. They’re ugly and hard to understand. The OX software app, on the other hand, offers slick, intuitive control over all of OX’s RIG settings via Wi-Fi — letting you tweak, store and recall hundreds of presets from your iPad, Mac, or Windows 10 computer. You can then save your six favorite tones onto OX’s front-panel RIG knob for instant recall in the studio or at a gig. I am more than happy with what I can do with the OX, it exceeded my expectations and I am now getting the most out of my tube amps. There is nothing that compares to the raw sound of a qualitative tube amp ramped up into good speakers. There are few venues, homes, apartments or even stages where you can get away with..."
