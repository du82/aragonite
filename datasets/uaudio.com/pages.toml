["https://uaudio.com/guitar-pedals/astra-modulation-machine.html"]
title = "Astra Modulation Machine"
description = "UAFX Astra Modulation Machine gives you the most authentic bucket-brigade chorus, studio flanger/doubler, and tube amp tremolo ever captured in an effects pedal."
full_description = '''Upon its release in 1976, this legendary gray bucket-brigade stompbox changed the sound of music with its thick, luxuriant chorus and wavy vibrato. Astra's Brigade Chorus mode gives you the most complete circuit emulation of this landmark unit — including its preamp section for authentically thick, saturated sounds — letting you paint with subtle ripples of analog texture and tone, adding chewiness, shimmer, and motion to everything you play. Packed with late-'70s bucket-brigade tech, this classic rackmount studio flanger/doubler is famous for stunning whoosh effects, organic thickening, and a parade of wild sounds that go way beyond typical flanger boxes. Astra's Flanger/Dblr effect is the only end‑to‑end circuit emulation of this ultra‑rare unit, capturing its original features to a "T" and putting impossibly dense, complex flanging/doubling right at your feet. Few things compare to the optical tube-driven tremolo of '60s American amplifiers. Deep, undulating, and the very essence of vibe, Trem 65 is a faithful emulation of this classic circuit. From shimmering ripples to choppy mayhem, every dynamic detail is captured in UA style, down to the complex interactions between the light source photoresistor and 12AT7 driver tube. Plus, you can explore further and create your own trem textures with variable sine and square wave settings. Astra's UAFX engine powers separate stereo instances of each modulation effect, thanks to its unique dual‑engine processing. It's like having two bucket-brigade hardware units running simultaneously — or even dual tremolo circuits — giving you a full stereo spread of complex, jaw‑dropping textures. With modern, high‑powered features like studio‑grade conversion, dual‑processing engines, additional downloadable effects at registration, Live/Preset modes, true/buffered bypass,* and silent switching, Astra Modulation Machine has your colors — now go forth, and paint your masterpiece. I've always been incredibly fickle with modulation. I generally love flanger, but find its use limited. I think I hate phaser, but always end up using it on my board. Tremolo is... a thing,...'''
year_published = 2024
