["https://uaudio.com/microphones/ua-sphere-lx-modeling-microphone.html"]
title = "UA Sphere LX Modeling Microphone"
description = "The UA Sphere LX modeling microphone system gives you the sound of classic mics used by everyone from The Beatles and Beyoncé to Radiohead and Frank Sinatra."
full_description = '''Sphere LX is built upon the same powerful mic modeling technology found in our flagship DLX model, giving you the sound of classic mics used by everyone from The Beatles to Beyoncé in a smaller, more affordable package. With the included Sphere Mic Collection software — allowing you to instantly pull up legendary mic models from Neumann, Telefunken, AKG, Sony, and more — Sphere LX puts the sound of 20 classic microphones at the ready.* See included mic models › Already own Sphere LX? Download the UA Connect app to get your free Sphere Mic Collection plug-in today. Sphere LX lets you audition classic mics before, during, and after recording. You can do this with any audio interface in any DAW. But with an Apollo, you unlock realtime workflows so it all happens with immediacy and precision, and doesn’t affect your performance. In Dual Mode, the Sphere mic modeling system allows you to blend any two mics, perfectly in-phase. This means you can start with a classic-sounding mic combination, then tailor it to find sounds that have never been heard before, all while only setting up a single microphone. With Sphere LX’s Off-Axis Correction and IsoSphere™ technology, you can easily tame room sounds and reflections for cleaner, more professional recordings. With its expert presets tailored for the toughest acoustic spaces like bedrooms or project studios, Sphere LX comes ready to use alongside popular iso filters from sE Reflexion Filters, Aston Halo, Kaotica Eyeball, and more.* Sphere LX includes a mic standmount, 25' dual-output XLR cable, and carrying case — so you'll be ready to create with the sound of legendary mics the minute you unpack the box. The classic 47-style mic is the ultimate studio workhorse. Its thick “sit in the mix” sound has been used by everyone from The Beatles and Frank Sinatra to countless modern artists. A go-to choice for vocals, this mic sounds equally amazing on acoustic guitars, bass, and drums.** This coveted mic was famously used for lead vocals on classics like “Hey Jude” and "Sympathy for the Devil” along with Nirvana’s Nevermind album. Our model is based on a custom 67 mic using new-old-stock parts offering a smooth and musical sound, useful on almost anything.**'''
