full_description = "No. The UA 1176 Classic FET Compressor is available natively (UADx) meaning it can be used on compatible macOS and Windows systems, no UA hardware required. To claim your license for the UA 1176 Classic FET Compressor, you’ll need a UA account. Then, navigate back to this page and click the “Download Now” button. The license will be deposited into your account automatically. If you are claiming the license from a participating third-party reseller (e.g. Sweetwater or Plugin Boutique), you will have to redeem a code provided by the reseller by following the steps in this article. There are no replacements available for this plug-in during the promotion. However, if you own the 1176 Classic Limiter Collection or native UA 1176 Collection, you'll be eligible for a coupon that you can use in our online store. The promotional UA 1176 Classic FET Compressor features the same authentic modeling used in our UA 1176 Classic Limiter Collection, so you’ll get the same classic tones of the original hardware. However, the promotional plug-in offers a simpler feature set and user interface, so you can find the tones you want quickly."
