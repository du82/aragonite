full_description = "UAD Native plug-ins run on both macOS 10.15 Catalina or newer and Windows 10 and 11. Go to our UA Support page for system requirements. Dive deep into all of Verve’s machines and uncover the sounds and settings that unlock magical analog tone for your mixes. Verve Analog Machines puts vintage sound at the ready. Giving you 10 colorful UA‑designed effects with settings that are super easy to dial in, it’s like a sandbox full of analog toys right in your DAW. Need to energize drums, guitars, vocals, synths, or your whole mix? From gluey tape warmth and hi‑fi tube saturation to all‑out distorted mayhem, Verve Analog Machines makes your in‑the‑box productions sound instantly more expressive and alive. Whether you seek the strange sound of thrift store tape machines, that tiny speaker effect from a vintage guitar amp, or the big-studio luster of a premium tube channel strip – Verve Analog Machines instantly levels up any mix with vibey analog color. Add warmth to anything with classic reel-to-reel sound that can be gently overdriven. Great for: Getting studio-grade tape sound on vocals, instruments, or your entire mix. Get the effect of driving up the gain on an analog console to energize your recordings with crunchy saturation. Great for: Bringing dull recordings to life. Make tracks blush with rich harmonics, like the sound you get when plugging into a high-end tube preamp or channel strip. Great for: Warming up bright or thin-sounding tracks. An older and bolder tape machine. It’s similar to Sweeten, but with a deeper warmth and warble. Great for: Getting tape sound with added movement. Hop in your time machine and explore gritty lo-fi textures from half a century ago. Great for: Giving any track some added vibe and dimension. Need a tone that’s all your own? Score thriftstore tape machine sound that’s older than your grandparents. Great for: Making modern recordings sound old. Get tube sound that’s been pushed to the edge, similar to driving an analog preamp a bit too hard. Great for: Getting tracks to sound bold and exciting."
