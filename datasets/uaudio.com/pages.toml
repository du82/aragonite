reshold design and how input gain determines the amount of compression. [02:22] Attack and Release A breakdown of the ultra-fast attack times that make the 1176 ideal for shaping transients and controlling dynamics. [03:29] Ratio An overview of the different ratio settings, including 4:1 for subtle compression and "All Buttons In" mode for aggressive, explosive dynamics. [04:51] Starting Point Settings A recommended starting point for dialing in the 1176, including attack, release, and input/output settings. [05:58] Full Mix bypass A/B A demonstration of how multiple instances of the 1176 affect an entire mix and enhance cohesion and presence. [07:12] Collection A closer look at the UA 1176 Classic Limiter Collection, featuring three distinct models with unique sonic characteristics. [09:12] Additional Features An exploration of the advanced features included in the collection, such as mix control for parallel compression and sidechain filtering for improved low-end response. [10:20] Outro A recap of everything covered in the video and why the 1176 is an essential tool for any producer or engineer. <!-- .newsletter-text {background:#1A1A1A;padding-top:50px;max-width:800px;margin:auto;} .newsletter-form {max-width:800px;margin:auto;} .newsletter-form input { -webkit-appearance: none; -moz-appearance: none; appearance: none;} .newsletter-text h3 {font-size: 34px;color: #f0e8d7;font-weight: bold;margin-bottom: 0;margin-bottom: -15px !important;} .newsletter-text .text-centered p {text-transform:uppercase;color:#df732c;letter-spacing: 2px;font-size:20px;padding-top:10px;} .drip_signup {color:#fff !important;padding: 25px 10px 70px;} .drip_input {display:inline;} .drip_signup .button {line-height:1 !important;background: #df732c !important;border-radius: 3px !important;padding: 11px 30px; letter-spacing:2px !important;} .text-centered--with-bg {padding: 0 !important;} @media only screen and (max-width: 600px) { .drip_signup .button {padding: 11px 10px; margin-top:15px; w