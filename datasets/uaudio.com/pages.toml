description = "Universal Audio is the world’s leader in Thunderbolt audio interfaces, analog recording hardware, and UAD audio plug-ins. Explore products and shop now."
full_description = "Control the Unison™ preamps on your Apollo to track through emulations of classic gear from Neve, Manley, API, and dozens more — giving you the rich analog textures used on the greatest recordings of our time. Apollo audio interfaces feature onboard DSP, controlled using the UAD Console app. This allows you to record and monitor through UAD plug-ins in realtime, freeing up your computer’s host processing for running native plug-ins and instruments. New! Auto-Gain automatically adjusts your levels for consistent gain staging in seconds. No more manual tweaking of your input gain — simply turn this feature on when setting up to record, and get back to being creative. New! If you use a subwoofer, you can control it using Bass Management with adjustable crossover slope and frequency. While the Speaker Utilities panel provides trim, mute, and solo per speaker output. New! Use Alt Monitoring for Surround Modes to switch between stereo or immersive monitoring setups and keep up with today’s mix format demands. With Plug-In Scenes, Channel Strip Presets, and Console Sessions you can quickly save and recall entire plug-in chains across multiple sessions. This allows you to experiment with different setups or instantly restore your go-to configurations from one session to the next."
