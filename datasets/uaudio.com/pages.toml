["https://www.uaudio.com/uad-plugins/compressors-limiters/fairchild-tube-limiter-collection.html"]
title = "Fairchild Tube Limiter Collection | UAD Audio Plugins | Universal Audio"
description = "Give your tracks and mixes classic Fairchild tube warmth and character through the 670 and 660 with the Fairchild Tube Limiter Collection. Learn more."
full_description = "UAD Native plug-ins run on both macOS 10.15 Catalina or newer and Windows 10 and 11. Go to our UA Support page for system requirements. Learn how to thicken vocals, add aggressiveness to drums, and widen your mixes with the Fairchild Tube Limiter Collection. The Fairchild 670 and companion, the Fairchild 660, have defined some of popular music’s most revered sounds. Renowned for its aggressiveness, the 660 punches up piano, bass, and guitar, tracks, while the flagship 670 is a full stereo compressor that injects vibe and color onto channels, final mixes, and even masters. Far beyond other Fairchild emulations, only the UAD Fairchild Collection is based on accurate circuit models of “golden‑reference” units from legendary Ocean Way Studios, giving you all the rich tube tone of the unattainable iconic hardware. (Pretty Lights, Highly Suspect) Add presence and texture to lead vocals with the Fairchild Tube Limiter Collection. The Mix control lets you blend your unprocessed signal with the compressed signal, opening worlds of textural possibilities on everything from a drum bus to a mix bus. Punch up your drum bus without triggering the threshold of the compressor with the kick drum, for drums with max impact using the Fairchild's Sidechain Filters. The Headroom (HR) control can be increased to make mastering applications a breeze, raising the gain reduction threshold and lowering distortion. Conversely, you can decrease headroom, lowering the gain reduction threshold and raising distortion for grittier textures that work on everything from vocals and drums to guitar and bass. This is THE Royal Variable Mu King. The tone this compressor delivers is incredible, it gives exceptional body in the low end and those highs come to the fore, it's great for sustained... The beauty of character and tone that the Fairchild collection provides is UNIQUE, it is impressive how it handles the sustain of the audio with those slow releases. Definitely the UA... Although I’ve worked with an original hardware version of this compressor, this plugin definitely has a “vintage” sound/vibe. In my opinion, tone wise and behavior/response wise,..."
