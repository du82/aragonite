title = "Ampex® ATR-102 Mastering Tape Recorder | UAD Audio Plugins | Universal Audio"
description = "The Ampex ATR-102 Mastering Tape Recorder plug-in for UAD and Apollo gives your tracks and mixes that final “analog polish.” Learn more."
full_description = "UAD Native plug-ins run on both macOS 10.15 Catalina or newer and Windows 10 and 11. Go to our UA Support page for system requirements. Getting perfect gain staging on the Ampex ATR-102 requires meticulous calibration of the repro and record levels, a delicate art that demands precision. With Auto-Gain, you can make adjustments to either the Repro or Record levels while maintaining perfect gain staging. And with its Retina-enhanced GUI, the ATR-102 is that beautifully vibey plug-in that you’ll want to leave on all the time.* The Ampex ATR-102 Mastering Tape Recorder plug-in and LUNA Extension provides the final “analog glue” for your music. Fully authenticated by the Ampex Corporation, now you can get the same unique dynamics, frequency response, and saturation characteristics of the original mastering hardware, virtually indistinguishable from its analog ancestor. Discover vast reel-to-reel textures using three classic tape heads (¼”, ½”, and 1”) tape speeds and emphasis EQs, famous tape formulas (GP9, 456, 900, 250), and more. You can even fine-tune the machine’s calibration to open up some headroom, or get grittier tape compression and saturation. Ignite your inspiration with presets from longtime ATR‑102 users Chuck Ainlay (Chris Botti, Mark Knopfler) Richard Dodd (Wilco, Robert Plant), Buddy Miller (Martina McBride, Emmylou Harris), Mike Poole (Keith Urban, Dolly Parton) and more. Use these presets as a starting point and season to taste on your mixes — you'll marvel at the cohesive, rich sound that can only come from an Ampex tape machine. Use the Ampex ATR‑102 LUNA Extension to transform LUNA’s mixer into an analog tape wonderland. Without having to manage separate plug-in windows, this gives you rich album‑ready Ampex tape textures with all the authentic dynamics, frequency response, and saturation of the original machine. Unlike a lot of the other reviewers, I have zero experience with actual analog equipment. And because of that, I was very skeptical of this plugin. Holy crap though, it makes everything..."
