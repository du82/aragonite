["https://uaudio.com/microphones/ua-sphere-dlx-modeling-microphone.html"]
title = "UA Sphere DLX Modeling Microphone"
description = "The UA Sphere DLX modeling microphone system gives you the sound of classic mics used by everyone from The Beatles and Beyoncé to Radiohead and Frank Sinatra."
full_description = "Capture the best recordings of your life with Sphere DLX, the world’s most powerful mic modeling system that combines our flagship dual-capsule condenser with the Sphere Mic Collection plug-in to give you the sound of classic mics used by everyone from The Beatles to Beyoncé. With the included Sphere Mic Collection software — allowing you to instantly pull up 38 legendary mic models from Neumann, Telefunken, AKG, Sony, and more — Sphere DLX puts the world-famous sound of classic condenser, dynamic, and ribbon microphones at the ready.* See included mic models › Already own Sphere DLX? Download the UA Connect app to get your free Sphere Mic Collection plug-in today. Sphere DLX is the only dual-capsule mic modeling system that lets you audition mics before, during, and after recording. You can do this with any audio interface in any DAW. But with an Apollo, you unlock realtime workflows so it all happens with immediacy and precision, and doesn’t affect your performance. In Dual Mode, the Sphere mic modeling system allows you to blend any two mics, perfectly in-phase. This means you can start with a classic-sounding mic combination, then tailor it to find sounds that have never been heard before, all while only setting up a single microphone. Thanks to its dual-capsule design, the Sphere DLX lets you easily record piano, drums, strings, and more in stereo. You can even use different mic models on the left and right channels for a more colorful stereo image. With Sphere DLX’s Off-Axis Correction and IsoSphere™ technology, you can easily tame room sounds and reflections for cleaner, more professional recordings. With its expert presets tailored for the toughest acoustic spaces like bedrooms or project studios, Sphere DLX comes ready to use alongside popular iso filters from sE Reflexion Filters, Aston Halo, Kaotica Eyeball, and more.* Sphere DLX includes a professional shockmount, 25' dual-output XLR cable, mic stand mount, and carrying case — so you'll be ready to create with the sound of legendary mics the minute you unpack the box."
