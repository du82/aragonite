["https://uaudio.com/about"]
title = "About | Universal Audio"
description = "Founded in 1958 by Bill Putnam Sr., Universal Audio has been synonymous with innovative recording products since its inception."
full_description = "Founded in 1958 by Bill Putnam Sr., Universal Audio has been synonymous with innovative recording products since its inception. A favorite engineer of Frank Sinatra, Nat King Cole, Ray Charles and more, the late Bill Putnam Sr. was a passionate innovator who is widely regarded as the father of modern recording — with many of his legendary studio and equipment designs still in use today.Specifically, Putnam was the inventor of the modern recording console, the multi-band audio equalizer, and the vocal booth, and he was the first engineer to use artificial reverberation in commercial recording. Alongside his friend Les Paul, Putnam was also involved in the early development of stereophonic recording.Putnam, a natural entrepreneur, started three audio product companies during his long career: Universal Audio, Studio Electronics, and UREI. All three companies built equipment that remains widely used decades after their introduction, including the ubiquitous LA-2A and 1176 compressors, and the 610 tube recording console. The 610 console in particular stands as one of the most beloved designs in audio history, used to record everyone from Sinatra to the Beach Boys to Van Halen’s eponymous debut. Universal Audio was re-founded in 1999 by Bill's sons, James Putnam and Bill Putnam Jr., with two main goals: to faithfully reproduce classic analog recording equipment in the tradition of their father; and to design new digital recording tools with the sound and spirit of vintage analog technology. To that end, Universal Audio employs the world's brightest DSP engineers and digital modeling authorities to develop our award-winning UAD Powered Plug-Ins platform. Featuring the most authentic analog emulation plug-ins in the industry, our DSP gurus work with the original hardware manufacturers — using their exact schematics, golden units, and experienced ears — to give UAD plug-ins warmth and harmonics in all the right places, just like analog. Nothing better represents the merging of our analog heritage and groundbreaking digital designs than the award-winning Apollo audio interface. Introduced in 2012, Apollo has become the new worldwide standard for professional music production, and has been used to record breakthrough albums by artists such as Kendrick Lamar, Coldplay, Dr. Dre, Brad Paisley, and many more.With more than 200 employees, and offices in Los Angeles, Colorado, and Amsterdam, Universal Audio is headquartered near Silicon Valley in Scotts Valley, California. A few miles away in Santa Cruz is the Universal Audio Custom Shop, where our classic analog gear is still hand-built, one unit at a time.Software or hardware, every Universal Audio product is backed by a decades long legacy of innovation, superlative quality, and technical passion."
