title = "Uberspace - Hosting on Asteroids"
description = "Uberspace.de is your platform for websites and mail. We have a lot of options, dedicated support from experienced Linux admins - and you choose how much you pay for it."
full_description = "SupportUntil the penny drops: We fly the extra mile, because we think it is the best and most sustainable solution if both you and we learn something new from each problem.ManualAll essential information can be found in the manual. Here you will find everything you need to get started.Thanks to our experience, we provide you with just the right amount of information: No gobbledygook, no misunderstandings, no secrets.How do I set up a domain for web?How do I set up email addresses?How do I create a MySQL database?manual.uberspace.deUberlabWe’ll explain what you can do with your Uberspace and help you bring it to life.In our Uberlab you will find uniform and easy to understand Step-by-step instructions for installing various tools. And because everybody can get involved in the Uberlab, the list is growing constantly! Examples wanted?How do I install WordPress?How do I set up a mailing list?How do I install Nextcloud?lab.uberspace.deServer statusWe are not immune to outages, even though we place great value on stability and reliability. So that you know when problems occur, we put our cards on the table and document all outages that last longer than 10 minutes.is.uberspace.onlineContactWe are always at your side with practical advice: fast, competent and pragmatic. If you need help or have any questions, get in touch and we will take care of your needs.Our support team works from monday to friday and in most cases you will get an answer within one working day. Our support includes everything documented in the manual and Uberlab. In addition, we try to help you as competent as possible with questions that go beyond that.hallo@uberspace.deSend us an email!GNUPG-KEY B992F4EA2FE04419FINGERPRINT 30BE F274 C7F4 701F 376B 2248 B992 F4EA 2FE0 4419@hallo@uberspace.socialFor general questions and minor issues, you can reach us on Mastodon. Your email address only, no other personal data Try 30 days for free Transparent costs, no subscription Pay as you go, no contract period"
year_published = 2025
