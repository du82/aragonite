["https://uberspace.de/en/about"]
title = "Uberspace - Hosting on Asteroids"
description = "Uberspace.de is your platform for websites and mail. We have a lot of options, dedicated support from experienced Linux admins - and you choose how much you pay for it."
full_description = "Who we areInstead of an anonymous big corporation, Uberspace is run by about a dozen people that strive to make technology accessible, understandable and manageable for you. You’ll find us in coworking spaces, at local meetups or in the audience of Linux-themed conferences. With us, you could share a coffee, a Mate, or a beer with exactly those people that are building the next feature into Uberspace - or mount the next server into a rack.What we believe inGiven the fact that we were able to serve you that way since 2010 and having grown since then with you and through your support, delights us a lot as it means we’re doing something right, and we’re gladly taking responsibility to follow that path even further, keeping discovering new technology and making it available to you.TransparencyWe are not cagey about our concepts, our code or our vendors.Data minimizationWe do not collect any personal data from you except your mail address.HonestyWe do not sweep our disruptions and outages under the rug, but instead blogging about them, including our learnings.FriendlinessWe put ourselves in your place and keep our understanding of having been newbies at some point as well.Our teamWe’re connected as a team by sharing common beliefs, but not by sharing the same place: What’s called working “remote first” today has been our reality right from the start. We all work from home, across Germany and Austria. This provides us with a lot of flexibility and freedom. Frequent video meetings and visiting each other in person helps keeping in touch. Twice a year, we all meet, not only to work together, but also to give room for bonding - and fun, for sure.Social MediaWe write about topics that move us, give insights into our working world and behind the scenes.BlogWould you like some more? You can find background information on many topics in the blog.MastodonFollow us in the Fediverse for news brought to you by our individual teams, interesting tech, support and background info!InstagramWe feed our Instagram Account of space and rocket friends with snapshots from our daily lives.RepositoriesLook into the source code! Many of our repositories are publicly available on GitHub and the number is constantly growing.github.com/UberspaceMerchandiseThe best, as always, comes at the end. Hotly desired at every event and hand-delivered!Order stickers Your email address only, no other personal data Try 30 days for free Transparent costs, no subscription Pay as you go, no contract period"
year_published = 2025
clearnet = "https://uberspace.de/en/about"
