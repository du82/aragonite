title = "Charmed Ceph Documentation| Ubuntu"
description = "Ubuntu is an open source software operating system that runs from the desktop, to the cloud, to all your internet connected things."
full_description = '''Submit Toggle side navigation Toggle side navigation Charmed Ceph Documentation Get started How-to guides Installing Ceph Charmed Ceph Ceph dashboard Managing Ceph cluster Adding OSDs Adding MONs Replacing OSD disks Removing OSDs Removing MONs Multi-site operations Setting up multi-site replication Recovering from an outage with multi-site replication Scaling down multi-site to single-site Node startup and shutdown Enabling full disk encryption Connecting to the observability stack Integrating Ceph with other tools Kubernetes LXD OpenStack VMware Upgrading deployment software Upgrading charms Upgrading node operating system Upgrading Ceph Explanation Object storage Block storage File storage Replicated pools Erasure coded pools RADOS Gateway multi-site replication Reference Supported Ceph versions Release cycle Release notes Appendices Client setup Charm list Upgrade notes Get in touch Charmed Ceph Documentation Charmed Ceph is a software-defined storage solution that provides object, block and file storage on commodity hardware. Charmed Ceph makes it easy to use and deploy Ceph. It provides a simpler way to deliver Ceph to users using a set of scripts called charms that are deployed with Juju. Corporate users can benefit from the robust and manageable full-suite storage solution, and the ease with which their Ceph clusters can be deployed with Charmed Ceph. An individual or corporate user with a large and growing volume of valuable data to manage, and appreciates the ease of integration with other cloud services would greatly benefit from Charmed Ceph. In this documentation Tutorial Get Started: a hands-on introduction to Ceph clusters for new users How-to guides How-to guides for installation, integration and other key operations Explanation Technical background, discussions and clarification of key topics, including pool types and storage types Reference Technical information: supported versions, release cycle, release notes and appendices Project and community Charmed Ceph is an Open Source project that welcomes usage discussion, project feedback, and especially contributions! Join our user forum Chat to us on Mattermost or Matrix We abide by the Ubuntu Code of Conduct Get involved in improving our software or documentation Don’t hesitate to contact us if you have questions about integrating Charmed Ceph into your project. Next Get started This page was last modified a month ago. Help improve this document in the forum. // Allows the 'onchange' listener to be used on a select field, while still being accessible. (function initSelect() { var selectField = document.querySelector("#version-select"); selectField.changed = false; selectField.onfocus = selectFocussed; selectField.onblur = selectUnFocussed; selectField.onkeyup = selectKeyed; selectField.onchange = updatePage; })(); function updatePage(e) { this.changed = true; window.location.href = e.target.value; } function selectFocussed() { this.initValue = this.value; } function selectUnFocussed() { if (this.value != this.initValue) { this.changed = true; window.location.href = this.value; } } function selectKeyed(e) { e.preventDefault(); var theKeyPressed; var validConfirmKeys = [9, "Tab", 13, "Enter"] var validCancleKeys = [27, "Escape", "esc"] if (e) { theKeyPressed = e.key || e.keyCode; } else { return false; } if (validConfirmKeys.includes(theKeyPressed) && this.value != this.initValue) { this.changed = true; window.location.href = this.value; } else if (validCancleKeys.includes(theKeyPressed)) { this.value = this.initValue; } else { this.changed = false; } }'''
