full_description = '''Ubuntu on AWS Whether you are moving to Amazon Web Services or are already running cloud-native, Ubuntu is the platform of choice for AWS. Canonical continuously tracks and delivers updates to Ubuntu images to ensure security and stability are built-in from the moment your machines and containers launch. Today, Ubuntu powers billions of mission-critical workloads. Talk to us about Ubuntu on AWS Ubuntu on AWS powers cloud leaders Choose the right Ubuntu for you Select between the standard Ubuntu Server and the Pro edition, which includes expanded security, compliance and AWS integration: Ubuntu Free to use AWS-optimised kernel and userspace components built from the latest releases Broad set of open source application components available for development Security patches for the kernel and key infrastructure components Updates mirrored and images published in all AWS regions worldwide 5-year lifetime Launch Ubuntu Server 24.04 LTS Ubuntu Pro for AWS From $0.001/hour (Equivalent to $9/year) Includes all Ubuntu optimisations and updates of the free version Expanded security covering application components delivered with Ubuntu Kernel live patching for instant security and longer uptimes FIPS 140-2 and CC-EAL certified components Integration with AWS security and compliance features 10-year lifetime Launch Ubuntu Pro 24.04 LTS More about Ubuntu Pro for AWS › Features Optimised Ubuntu on AWS runs on an AWS-optimised kernel, which includes improved device drivers, like ENA, and out of the box support for accelerators like GPUs. This means faster instance starts and better runtime performance for your workloads. Security built in Our security teams track alerts 24/7 and release patches to system components and applications continuously. Canonical operates a worldwide distribution network ensuring that package updates are delivered in-region quickly. All the bits you need Ubuntu includes everything you need out of the box to build and operate cloud-native applications at scale. Supporting runtimes like Python, node.js and Go, and server components like Apache Kafka, NGINX, MongoDB, Redis and PostgreSQL. Get Ubuntu Pro on AWS now 24.04 LTS 22.04 LTS 20.04 LTS 18.04 LTS 16.04 LTS Learn more about Ubuntu Pro › What our customers say "The optimisations built into Ubuntu Pro on AWS provide us with the performance requirements needed and a trusted platform to run our operations and fleet." Justin Rigling CTO, Rigado Optimise your cloud journey with Canonical Canonical works with the top enterprises and innovators in the world to define and execute their cloud journeys. Migration, application redesign, support and optimisation services are some of the ways in which we have helped customers make the most of Ubuntu and AWS together. Talk to us about Ubuntu on AWS Close Canonical - the "Ubuntu on AWS" experts Already running Ubuntu on AWS, or planning a migration to the public cloud? Canonical has the expertise to assist you in your project, whether it involves compliance, application architecture, optimisation or streamlining operations at scale. Share some details about your project with us and let's get started. Tell us about your project If you use Ubuntu, which version(s) are you using? LTS within standard support 24.04 LTS 22.04 LTS 20.04 LTS LTS out of standard support 18.04 LTS 16.04 LTS 14.04 LTS Outdated or non-LTS releases non-LTS release non-LTS release 12.04 LTS Other I don't use Ubuntu today I don't know What kind of device are you using? Desktop workstation Physical server Public cloud Virtual machine IoT/Edge device How many devices? < 5 machines 5 - 15 machines 15 - 50 machines 50 - 100 machines > 100 machines How do you consume open source? Ubuntu repositories GitHub/Upstream Internally approved repository I don't know Do you have specific compliance or hardening requirements? PCI-DSS HIPAA FISMA FIPS 140 NCSC DISA-STIG FedRAMP CIS Benchmark Who is responsible for tracking, testing and applying CVE patche