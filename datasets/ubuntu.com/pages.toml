full_description = '''LXD Ubuntu Appliance By Canonical Developer Raspberry Pi 4 Intel NUC System container manager and APILXD is a system container managerWith LXD you can run hundreds of containers of a variety of Linux distributions, apply resource limits, pass in directories, USB devices or GPUs and setup any network and storage you want. LXD containers are lightweight, secure by default and a great alternative to running Linux virtual machines. Run any Linux distribution you wantPre-made images are available for Ubuntu, Alpine Linux, ArchLinux, CentOS, Debian, Fedora, Gentoo, OpenSUSE and more. A full list of available images can be found here: https://images.linuxcontainers.org Can't find the distribution you want? It's easy to make your own images too, either using our distrobuilder tool or by assembling your own image tarball by hand. Containers at scaleLXD is network aware and all interactions go through a simple REST API, making it possible to remotely interact with containers on remote systems, copying and moving them as you wish. Want to go big? LXD also has built-in clustering support, letting you turn dozens of servers into one big LXD server. Configuration optionsSupported options for the LXD snap (snap set lxd KEY=VALUE): ceph.builtin: Use snap-specific ceph configuration [default=false] criu.enable: Enable experimental live-migration support [default=false] daemon.debug: Increases logging to debug level [default=false] daemon.group: Group of users that can interact with LXD [default=lxd] daemon.preseed: A YAML configuration to feed lxd init on initial start lxcfs.pidfd: Start per-container process tracking [default=false] lxcfs.loadavg: Start tracking per-container load average [default=false] lxcfs.cfs: Consider CPU shares for CPU usage [default=false] openvswitch.builtin: Run a snap-specific OVS daemon [default=false] shiftfs.enable: Enable shiftfs support [default=auto] Certified Maintained until 2030-09-18 ARM Relevant links Documentation LXD website License - Apache-2.0 Privacy compliance EU GDPR California law Base core18 Date published 2020-09-18 Snaps in the image PUBLISHER VERSION UPDATED LXD Canonical 4.5 18 September 2020 Try it out! Grab a spare board or NUC. Install on a Raspberry 4 Pi › Install on an Intel NUC › Join the community Our Discourse forum for LXD is the best place for news and views. (function () { var downloadForm = document.querySelector(".js-download"); if (downloadForm) { const linkElement = downloadForm.querySelector('.js-download-button'); const selectElement = downloadForm.querySelector('.js-platform-select'); if (linkElement && selectElement) { selectElement.addEventListener('change', function() { linkElement.href = window.location.pathname + '/' + selectElement.value; }); } } })();'''
