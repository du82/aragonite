title = """
Ubuntu flavours| Ubuntu"""
description = "Ubuntu flavours are different installations of Ubuntu - each with a choice of packages and applications included by default. Here you are able to choose and download the officially recognised flavour that would best suit your particular industry and unique needs."
full_description = '''Ubuntu flavours What are Ubuntu flavours? Ubuntu flavours offer a unique way to experience Ubuntu, each with their own choice of default applications and settings. Ubuntu flavours are owned and developed by members of our global community and backed by the full Ubuntu archive for packages and updates. Edubuntu Edubuntu is an official flavour of Ubuntu crafted for use in the education world. Teachers and students will have access to a huge ecosystem of learning software and educational tools built on a familiar and usable desktop. Edubuntu provides a fast, stable, secure and privacy conscious option for schools and universities. Get Edubuntu Join the Edubuntu community › Follow Edubuntu › Kubuntu Kubuntu unites Ubuntu with KDE and the Plasma desktop, bringing you a full set of applications including productivity, office, email, graphics, photography, and music applications ready to use at startup with extensive additional software installed from not one, but two desktop package managers. Built using the Qt toolkit, Kubuntu is fast, slick and beautiful. Kubuntu is mobile-ready, enabling easy integration between your PC desktop and phone or tablet with KDE Connect. Get Kubuntu Join the Kubuntu community › Follow Kubuntu › Lubuntu Lubuntu is designed to be a simple, easy to use system that is light, fast and modern. Lubuntu provides the LXQt desktop environment which is focused on Qt technologies. Lubuntu comes with the essential applications and services needed to browse the Internet, chat, play and be productive. Get Lubuntu Join the Lubuntu community › Follow Lubuntu › Ubuntu Budgie Ubuntu Budgie is a proud official Ubuntu flavour. We combine the simplicity and elegance of the Budgie desktop environment with the power and familiarity of an Ubuntu based operative system. The result is a modern and fast desktop distribution with great defaults, yet fully customisable. Get Ubuntu Budgie Join the Ubuntu Budgie community › Follow Ubuntu Budgie › Ubuntu Cinnamon Ubuntu Cinnamon combines Ubuntu with the Cinnamon desktop, built upon GNOME 2 to provide a traditionally modern experience. It is made for all home users alike, with intuitive software, and a simpler, customisable desktop suited with many personalization options and addons for some extra spice. Get Ubuntu Cinnamon Join the Ubuntu Cinnamon community › Follow Ubuntu Cinnamon › Ubuntu Kylin The Ubuntu Kylin project is tuned to the needs of Chinese users, providing a thoughtful and elegant experience out-of-the-box. The lightweight Ubuntu Kylin User Interface (UKUI) is perfect for older machines, and an ideal introduction to Linux for first-time users. Get Ubuntu Kylin Join the Ubuntu Kylin community › Follow Ubuntu Kylin › Ubuntu MATE Ubuntu MATE is a stable, easy-to-use operating system with a configurable desktop environment. It is ideal for those who want the most out of their computers and prefer a traditional desktop metaphor. With modest hardware requirements it is suitable for modern workstations, single board computers and older hardware alike. Ubuntu MATE makes modern computers fast and old computers usable. Get Ubuntu MATE Join the Ubuntu MATE community › Follow Ubuntu MATE › Ubuntu Studio Ubuntu Studio is pre-configured for content creation of all kinds. Whether you're an audio engineer, musician, graphic designer, photographer, video producer, or streamer, this is a full-fledged desktop computing system that will fit your needs. If you can dream it, you can create it with Ubuntu Studio. Get Ubuntu Studio Join the Ubuntu Studio community › Follow Ubuntu Studio › Ubuntu Unity Bringing the best of Ubuntu and Unity together, Ubuntu Unity is a beautiful, slick and lightweight Ubuntu flavour. With its beautiful design, efficient and elegant workflow, and features like the heads-up display (HUD), the Global Menu, powerful search and a high level of customizability (using the Unity Tweak Tool), you'll be able to work with an unparalleled level of efficiency. You can also choose from a wide range of window animations and effects available in Compiz. Get Ubuntu Unity Join the Ubuntu Unity community › Follow Ubuntu Unity › Xubuntu Xubuntu comes with Xfce, which is a stable, light and configurable desktop environment with a lot of consideration for usability. Whether you have a high-end computer or even a moderately older machine, Xubuntu is able to provide you with a smooth and usable desktop experience. Xubuntu has an expansive list of customization options so you can make the desktop your own. Get Xubuntu Join the Xubuntu community › Follow Xubuntu › More ways to experience Ubuntu Ubuntu-based variants In addition to the officially recognised flavours, dozens of other Linux distributions take Ubuntu as a base for their own distinctive ideas and approaches. A complete list of known flavours, editions and customizations is maintained on the Ubuntu Wiki's UbuntuFlavors page › Looking for Ubuntu? Download the latest release of Ubuntu desktop, the open source operating system that powers millions of PCs and laptops around the world. It's easy to install on Windows or macOS, or run Ubuntu alongside them! Download now Latest Ubuntu Desktop news from our blog › Explore all canonicalLatestNews.fetchLatestNews( { articlesContainerSelector: "#desktop-latest-articles", articleTemplateSelector: "#desktop-articles-template", excerptLength: 200, groupId: "1479", linkImage: true, limit: 3 } )'''
