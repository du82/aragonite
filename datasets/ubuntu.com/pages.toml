full_description = '''Ubuntu Core The embedded Linux OS for devices Ubuntu Core is a minimal, secure and strictly confined operating system powering devices around the world. Build your Ubuntu Core image today. Try Ubuntu Core Read the Ubuntu Core datasheet An OS with all the infrastructure Ubuntu Core is more than just your embedded Linux OS, it's your whole deployment infrastructure. Build targeted production-ready images, unlock over-the air (OTA) updates, deploy in air gap environments, manage your fleet of devices, achieve real-time operations, comply with cybersecurity requirements and more. Ubuntu Core will transform the way you deploy devices with the longest support window in the industry — 12 years. Continuous security Imagine a world where every device is trustworthy. We designed every aspect of Ubuntu Core to create the most secure embedded Linux ever, with a 12 year LTS commitment. Learn more about Ubuntu security › Device management Enjoy reliable, remotely accessible and recoverable devices which are always up-to-date with mission-critical OTA updates. In connected or air-gap environments. Learn more about fleet management › Agile containerisation Ubuntu Core is immutable and strictly confined. There is a clean separation between the kernel, OS image and applications, each updated independently and protected against corruption. Learn more about confinement › A strong hardware ecosystem We enable Ubuntu Core with the best ODMs and silicon vendors in the world. We continuously test it on leading IoT and edge devices and hardware. Browse all certified hardware › Discover the full feature list › From development to deployment Use the same kernel, the same libraries, and the same system software for a smooth transition from development to production. Once you have created your application in Ubuntu Desktop or Server, build your immutable Ubuntu Core image based on your developed applications and targeted hardware. Overview Ubuntu Snapcraft Snap Store Ubuntu Core Overview Ubuntu Snapcraft Snap Store Ubuntu Core Deploying a device? Ubuntu is your development environment. Ubuntu Core is your deployment OS. Whether you develop your application using C++, Rust, Python, or others – whatever tech stack you use, package and deploy it seamlessly on Ubuntu Core. For more than 20 years, Ubuntu has provided the best development environment. Every aspect of the development process benefits from Ubuntu’s responsiveness, ease of use, regular software updates and a high degree of security. Learn more about Ubuntu › Snapcraft is the command-line tool for packaging your software as a snap. Snaps are containerised packages designed for deploying embedded applications, with increased performance compared to other technologies. Ubuntu Core architecture is built on snaps and each element benefits from its tooling. Learn more about snaps in Ubuntu Core › Canonical's Snap Store powers developers to host and manage software updates for their devices. It provides a trusted update infrastructure, including reliable OTA updates, delta updates, and more. Organisations can also create private marketplaces, with advanced software management for fleets of devices. Learn more about Snap Stores › The right OS for your devices. Ubuntu Core is a strictly confined and immutable embedded Linux OS. Build your Ubuntu Core image for your application and targeted hardware, and enjoy a fully managed, secure, and 12-year LTS production image. Learn more about Ubuntu Core › Get started with Ubuntu Core › For smart use cases. Get Core. Get snaps. Get going. Automotive Industrial Robotics Signage Smart cities Ubuntu core customer stories All the success stories › Industrial Smart Kiosk Network Cloud Bosch Rexroth reinvents automation Bosch adopts Ubuntu Core and snaps for app-based ctrl-X industry 4.0 platform. Read the press release › Pudo deploys fleet for robust last-mile logistics Pudo chooses Ubuntu Core as the foundation for its IoT-based APMs to maximise security and uptime. Read the case study › Rigado cuts customers’ time to market Ubuntu Core enables Rigado to manage end-to-end security for commercial IoT gateways. Read the case study › IBM Cloud provides highly isolated and performant bare metal servers IBM Cloud's bare metal servers offer highly isolated and high-performing tenant-cloud isolation through the use of Ubuntu Core. Read the press release › Get to market fast with our hardware ecosystem Browse all certified hardware › Contact us › Learn more about Ubuntu Core Docs Start your Core journey today Features Discover everything that Core offers you Customer stories Find out how our users are finding success with Core White papers An independent security audit of Ubuntu Core Embedded Linux: make or buy? Webinar Introduction to Ubuntu Core 22 Ready to innovate? Whether you are a startup bringing your concept to market or already have large fleets of devices deployed in the field, we have the expertise and infrastructure to launch and support you. Get in touch document.addEventListener('DOMContentLoaded', function() { const videoLink = document.querySelector('.p-hero-video-link'); const style = document.querySelector("style"); const video = document.querySelector('.p-hero-video'); const videoContainer = document.querySelector('.p-hero-video-container'); videoLink.addEventListener('click', function(e) { e.preventDefault(); videoContainer.classList.remove('u-hide'); videoLink.classList.add('u-hide'); }); });'''
