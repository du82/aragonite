["https://ubuntu.com/appliance/community"]
title = """
Ubuntu Appliance Community - Governance and Policies| Ubuntu"""
description = "Join the Ubuntu community by developing, discussing or even simply downloading one of the Ubuntu Appliances. Anyone can create an Ubuntu Appliance. Have your project benefit from all of the goodness that goes into Ubuntu."
full_description = "Welcome to our Ubuntu Appliance community Whether you are a power user, a developer, a member of the Ubuntu project or a new contributor to Ubuntu Appliances, we invite you to join our Ubuntu Appliance Discourse and make your voice heard. Join the Ubuntu Appliance Discourse New Ubuntu Appliance ideas and proposals To suggest a new Ubuntu Appliance: Share your idea with a Proposed New Appliance topic to get community feedback Publish your appliance software at snapcraft.io Test on a PC or Raspberry Pi with vanilla Ubuntu Core Optimise your appliance images for devices you want to support Your Proposed New Appliance topic is where we coordinate image creation and inclusion. Privacy Policy Ubuntu Appliances must comply with the European GDPR and/or California CCPA laws.Each Ubuntu Appliance must link to its privacy policy to clarify if any information is collected and who has access to it. We review your privacy policies and data handling on the appliance during appliance optimisation. The Canonical privacy policy for Ubuntu applies to Ubuntu Appliances. Licensing Each Ubuntu Appliance contains apps and content under its own licence. Publishers must have the necessary rights to make that content available. Open source code must take advantage of the secure Ubuntu build infrastructure, while commercial content must come from the official source of those materials together with its standard maintenance commitment. Updates and security maintenance Ubuntu is famous for its security updates, release cadence and maintenance commitment. All of those strengths apply to every Ubuntu Appliance. In addition, Ubuntu Appliances are built on Ubuntu Core, with transactional updates and rollback. A fully containerised platform improves security and makes updates much more reliable. Updates for system components of Ubuntu Core are published immediately for critical security fixes. We roll less critical fixes into an update approximately every two weeks. Your appliance can be set to receive updates less frequently based on the needs of the publisher. Software components on the appliance are updated by the publisher on their own schedule. Canonical will notify publishers of any known security issues in Ubuntu Appliance components to help them publish updates quickly. Certified, maintained and experimental appliances A certified Ubuntu Appliance gets continuous testing by Canonical on all certified hardware. Canonical works with publishers to make sure their Ubuntu Appliance 'just works' from first boot, and will continue to work whenever Ubuntu Core receives an update. Both certified and maintained Ubuntu Appliances have a commitment from the appliance maintainers to update the underlying snaps for a declared period, and to test their Ubuntu Appliance image works on their recommended hardware. Certified Ubuntu Appliances have a commitment until the underlying Ubuntu Core is 5 or 10 years old. For example, an Ubuntu Appliance built on Ubuntu Core 20 is certified until 2025 or 2030 at the publisher's discretion. An experimental Ubuntu Appliance does not yet have a maintenance commitment. Either the appliance itself is still being finalised, or the software components don't have someone standing behind them for a guaranteed maintenance period. Hardware compatibility Ubuntu Core is guaranteed to work on any Ubuntu certified hardware. We recommend the Raspberry Pi or Intel NUCs for your development and testing. We recommend that you work with Canonical to certify any other hardware that is particularly relevant for your appliance. Certification means that every update, bug fix or security patch is tested on these boards in Canonical's testing lab to minimise regressions. Governance Any healthy and large community will have to manage tensions and conflicting member goals, even though we have a strong shared interest. Here, multiple open source communities and commercial vendors collaborate and create Ubuntu Appliances. Governance ensures that any stress is resolved productively. We lean towards ownership over committee, because doing the work earns the right to decide how best it should be done. Where there are significant questions that touch multiple contributors, we encourage them to work out a constructive common ground, and we offer an escalation path to resolve matters that do not reach quick consensus. Any developer can lead an Ubuntu Appliance. To be hosted on this site, the person or team behind the Ubuntu Appliance publisher must demonstrate that they follow the Ubuntu Code of Conduct. Before we publish it as a maintained or certified Ubuntu Appliance, we make sure that there is a credible commitment to the maintenance of its software."
year_published = 2025
