["https://ubuntu.com/blog/why-you-should-buy-a-pre-installed-ubuntu-workstation"]
title = """
Why you should buy a pre-installed Ubuntu workstation| Ubuntu"""
description = "Read an overview of the benefits that come from buying Dell workstations that are pre-installed with Ubuntu and certified by Canonical"
full_description = '''Why you should buy a pre-installed Ubuntu workstation Rhys Davies on 3 February 2020 Share on: Facebook Twitter LinkedIn Tags: Certification , Dell , pre-install , workstation This article is more than 5 year s old. Dell offers numerous workstations that come pre-installed with Ubuntu. For users wanting to run Ubuntu, pre-installed hardware offers a lot of long term benefits. On top of receiving the Ubuntu desktop experience out of the box, users receive specially fine-tuned features that complement their chosen hardware. For a PC to receive this level of quality assurance it needs to be certified. Canonical works closely with Dell and other vendors, to certify devices so that every user receives the best possible Ubuntu experience. Everything “just works” out of the box When a user buys a certified PC that is pre-installed with Ubuntu, they get peace of mind in knowing Canonical has performed thousands of rigorous tests to ensure all subsystems (WiFi, Bluetooth, etc) just work. This is the case for a range of Dell workstations and proves incredibly popular among developers. A lot of the high-end workstations Dell offers are designed specifically with developers in mind. In those cases, the benefits of pre-installed Ubuntu expand. Ubuntu is the number one operating system for AI development, most popular AI tools and frameworks are built on Ubuntu themselves. But more on that in another blog. The Dell XPS 13 Developer Edition, 10th generation Everything will keep working One of the main benefits of running Ubuntu is security. Over the lifetime of an Ubuntu release, Canonical releases thousands of patches and conforms to industry-leading security standards. Part of certification means that Canonical performs continuous regression testing throughout the lifecycle of the Ubuntu release on the PC. This way, Canonical ensures that everything works out of the box and will continue to work for years to come. Ubuntu hardware quality assurance Before hardware can be certified, Canonical runs tests to ensure a standard of quality for the best possible user experience. The process is simple, tests are conducted in Canonical’s lab and if a workstation fails a test, Canonical works with Dell and key partners (Intel, NVIDIA, AMD) to identify the problem and solve the issue. Hardware can only be shipped as “certified Ubuntu” if Canonical is sure it will deliver the most optimal user experience. Supporting Ubuntu Another reason to buy a pre-installed Ubuntu machine is simply to support Ubuntu. Purchasing a laptop that is pre-installed with Ubuntu, sends a message to partners, like Dell, that Ubuntu matters to them. If Dell or other vendors get this message, Ubuntu will be able to grow to be pre-installed on more devices. More Ubuntu pre-installed devices means supporting the Ubuntu community, open-source and general flexibility and security for PC users. Ubuntu desktop Learn how the Ubuntu desktop operating system powers millions of PCs and laptops around the world. // Get all loaded cards var cards = document.getElementsByClassName('js-product-card'); if (cards) { // Roll a dice var selectedIndex = Math.floor(Math.random() * cards.length); // Display card cards[selectedIndex].classList.remove("u-hide") } Newsletter signup Get the latest Ubuntu news and updates in your inbox. Work email: *I agree to receive information about Canonical's products and services. By submitting this form, I confirm that I have read and agree to Canonical's Privacy Policy. Sign up'''
