full_description = '''Ubuntu Desktop for developers Whether you're an app or web developer, engineering manager, data scientist, or AI/ML researcher — Ubuntu is your ideal workstation. Get Ubuntu now Why choose Ubuntu Desktop? The developers' choice Using Ubuntu Desktop provides a common platform for development, test, and production environments. Tools, such as Juju, Microk8s, and Multipass make developing, testing, and cross-building easy and affordable. Long term support (LTS) releases are delivered every 2 years, with 5 years of standard support extended to 10 years with an Ubuntu Pro Desktop subscription. New Developer editions of Ubuntu Desktop are released every 6 months, with 9 months of support and access to the latest kernel, libraries, and new upstream OS features. The Ubuntu release cycle › Security support for Ubuntu releases Released End of Standard Support End of Ubuntu Pro Support End of Legacy Support 24.10 (Oracular Oriole) Oct 2024 Jul 2025 24.04 LTS (Noble Numbat) Apr 2024 Apr 2029 Apr 2034 Apr 2036 22.04 LTS (Jammy Jellyfish) Apr 2022 Apr 2027 Apr 2032 Apr 2034 20.04 LTS (Focal Fossa) Apr 2020 May 2025 Apr 2030 Apr 2032 18.04 LTS (Bionic Beaver) Apr 2018 May 2023 Apr 2028 Apr 2030 16.04 LTS (Xenial Xerus) Apr 2016 Apr 2021 Apr 2026 Apr 2028 14.04 LTS (Trusty Tahr) Apr 2014 Apr 2019 Apr 2024 Apr 2026 Access to cutting-edge hardware and software Ubuntu ships with the latest toolchains for Python, Rust, Ruby, Go, PHP and Perl, and users get first access to the latest updates for key libraries and packages. Ubuntu is the OS of choice for data science and machine learning, with support for popular frameworks like OpenCV, TensorFlow, Keras, PyTorch and Kubeflow. Ubuntu is the target platform for the NVIDIA data science stack, which enables GPU accelerated data science workloads to be run locally before deploying to the cloud. How Ubuntu enables AI innovation › A rich ecosystem With a Snap Store of over 7,000 applications in addition to the Ubuntu repository, it's easy to tailor Ubuntu desktop to your needs. Development tools include Visual Studio Code, IntelliJ, GitKraken, Unity and Blender. Office productivity tools include Slack, Microsoft Teams, Dropbox, and Zoom as well as the Microsoft-compatible LibreOffice. Media, gaming, and content creation apps include Spotify, Steam, Discord and OBS Studio. Learn more about Snapcraft › Certified hardware Streamline deployment of Ubuntu Desktop with certified hardware from OEMs including Dell, Lenovo, and HP – no additional configuration required. Ubuntu performs out of the box across a wide range of laptops, desktops, and workstations, including the HP Z series and Dell XPS and Precision lines. Strategic partnerships extend to component manufacturers and Ubuntu is certified to work with the full range of NVIDIA GPUs. Ubuntu certified hardware › Developers love Ubuntu, organisations trust it Operating systems developers prefer Multiple choice poll Operating system Percentage Ubuntu 66% MS Windows 61% MacOS 57% CentOs 11% Debian 10% Fedora 9% Arch Linux 8% Solaris 4% FreeBSD 2% Deepin 1% Source: The 2020 HackerEarth Developer Survey Which of these open source technologies does your organisation use today to support your software infrastructure? Operating system Percentage Ubuntu 66% MS Windows 61% MacOS 57% CentOs 11% Debian 10% Fedora 9% Arch Linux 8% Solaris 4% FreeBSD 2% Deepin 1% Source: The 2022 State of Open Source Report – OpenLogic Source: The 2020 HackerEarth Developer Survey Source: The 2022 State of Open Source Report – OpenLogic Secure enterprise management with Ubuntu Pro Desktop Ubuntu Pro Desktop is a comprehensive subscription delivering enterprise-grade security, management tooling, and extended support for developers and organisations. Ubuntu Pro Desktop is free for personal use on up to five machines. Security updates for the full open source stack Advanced Active Directory and LDAP integration Estate monitoring and management FIPS 140-2 certified modules and CIS hardening Optional weekday or 24/7 support tiers Free for personal use on up to five machines Secure your open source stack with a personal Ubuntu Pro license and get access to security patching for over 23,000 packages in the Ubuntu Universe repository. Get started with a free subscription › Ubuntu Desktop for organisations › Get started today Download and install Download Ubuntu Desktop and replace your current operating system. It's easy to install on Windows or macOS, or run Ubuntu alongside it. Download now Buy it pre-installed Ubuntu is available on a huge range of devices from the world's largest hardware manufacturers, including Dell, HP, and Lenovo. Find out more about our retail partners › Join our community Share ideas, write code, and get advice and help from our large, active community of IT professionals. Ubuntu Discourse Ask Ubuntu Mailing lists Launchpad Answers Latest Ubuntu Desktop news from our blog › Explore all canonicalLatestNews.fetchLatestNews( { articlesContainerSelector: "#desktop-latest-articles", articleTemplateSelector: "#desktop-articles-template", excerptLength: 200, groupId: "1479", linkImage: true, limit: 3 } )'''
