["https://ubuntu.com/azure"]
title = """
Ubuntu on Azure| Ubuntu"""
description = "Ubuntu is the operating system platform of choice for Azure, powering innovation on public cloud in environments ranging from dev/test to mission-critical production. Run Ubuntu on Azure, benefit from our worldwide mirroring and publication and talk to Canonical about how we can help optimise your cloud workloads."
full_description = '''Apply to join our preview for Managed Kubeflow on Azure! Learn more and sign up. Ubuntu on Azure Canonical produces official Ubuntu images on Microsoft Azure with continuous updates to ensure security and stability from the moment your machines and containers launch. Microsoft works closely with Canonical to optimize Ubuntu images on Microsoft Azure and ensure Ubuntu supports the latest cloud features as these are released. Today, Ubuntu powers a large number of mission-critical workloads on Azure. Beyond Ubuntu, Canonical also offers Charmed Apps on Microsoft Azure, enabling hybrid environments. Launch Ubuntu 24.04 on Azure Talk to us about Ubuntu on Azure › Why choose Ubuntu on Azure? Azure-optimized kernel built from the latest releases Broad set of open source application components Security patches for the kernel and key infrastructure Optional 12-year expanded security and compliance Continuous updates in all Azure regions worldwide Availability of confidential VMs All available on Ubuntu and Ubuntu Pro Choose the right Ubuntu for you Select between the standard Ubuntu Server and the Pro edition, which includes expanded security, compliance and Azure integration: Ubuntu LTS Server Free to use Security patches for the kernel and key infrastructure components 5-year lifetime support No automated compliance and hardening Patching requires a reboot Community and update level support Launch Ubuntu on Azure Ubuntu Pro Metered prices available on the Azure Calculator Expanded security patches beyond kernel and key infrastructure to apps and critical vulnerabilities (36,000 packages) Up to 12-year lifetime support Automated compliance and hardening tools available FIPS 140-2 CC-EAL certified components DATA-STIG Kernel live patching for instant security and longer uptimes Optional 24/7 enterprise level support for your Ubuntu workloads (contact us to discuss adding this by Azure Marketplace Private Offer) Get Ubuntu Pro on Azure More about Ubuntu