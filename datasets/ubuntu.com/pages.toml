full_description = '''Ubuntu Pro for Azure For production. For professionals. Ubuntu Pro for Azure is a premium image delivering security and compliance for the OS and open source apps on Azure. The image offers critical and high CVE patching, security for over 30,000 open source packages, automated hardening for compliance, and more Ubuntu Pro is suitable for all size Linux enterprise operations with pay-as-you-go or annual billing on your existing Azure invoice. Upgrade Ubuntu LTS to Ubuntu Pro Upgrade your Ubuntu Server instances to Ubuntu Pro. Using Azure CLI, upgrading requires no disruption to your services or VM redeployment. Learn how to upgrade Launch Ubuntu Pro 24.04 LTS Ubuntu Pro 24.04 delivers additional layers of security and compliance services with security patches covering a wider range of packages, until 2034. Launch Ubuntu Pro 24.04 LTS Contact us to discuss Ubuntu Pro with support › Previous releases 22.04 LTS › Maintained until 2032 20.04 LTS › Maintained until 2030 18.04 LTS › Maintained until 2028 16.04 LTS › Maintained until 2026 What's in Ubuntu Pro? FIPS & CC-EAL2 certified Officially certified components to enable operating environments under compliance regimes like FedRAMP, HIPAA, PCI and ISO. CIS and DISA STIG For companies looking to leverage industry benchmarks for hardening, Ubuntu Pro makes two leading implementation guides available. Open source security Ubuntu Pro adds security coverage for the most important open source applications like Apache Kafka, NGINX, Redis and PostgreSQL. Predictable and optimized Ubuntu Pro is based on Ubuntu and leverages both the breadth of open source included and the Azure optimizations built in. Kernel Livepatch Ubuntu kernel updates are regularly issued. With our Livepatch service, kernel patches are delivered immediately, without the need to reboot your VMs. Billed through the cloud Choose between annual fixed or consumption-based pricing, with billing simplified through direct integration with your Azure bill and counting towards your Microsoft Azure Cloud Consumption (MACC) agreement. Seamless integration with your Azure Ubuntu Pro offers full integration with core Azure services such as Azure Pricing, Azure Guest Patching, and Update Management Center. Up to 12 years lifetime Canonical backs Ubuntu Pro for up to 12 years, ensuring security updates are available throughout, with a guaranteed upgrade path. Optional 24/7 support Additional enterprise-grade support is available through a private offer for Ubuntu Pro infrastructure and applications. Let's talk Pro › Is Ubuntu Pro right for you? Use the pro security-status command to get a complete overview of your machine's installed packages and their corresponding security coverage. Learn more › Latest news from our blog › canonicalLatestNews.fetchLatestNews( { articlesContainerSelector: "#azure-latest", articleTemplateSelector: "#azure-latest-template", excerptLength: 200, tagId: 4540, linkImage: true, limit: 3 } )'''
