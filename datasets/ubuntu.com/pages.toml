description = "Embedded Linux development is easy and secure on Ubuntu. Choose an enterprise app store or use the global Snap Store for reliable IoT package management. Start your embedded Linux project today. Get Ubuntu on your board with hardware certification and enablement."
full_description = 'Embedded Linux 2.0 More reliable updates. Much better security. Faster, cheaper, better. Pick any 3. Reduce the time to design, develop and launch your devices. Lower the cost of development and maintenance. Raise the quality and security of every component. Save time Developers are much more productive on Ubuntu than handcrafted embedded Linux. Save money Sharing a platform shares the cost. Licensing is cheaper, updates more tested and maintenance shared. Raise quality Familiar and widely used Ubuntu means easy CI/CD, better tools, faster updates and better kernels. Pre-enabled boards Linux is not a differentiator. Use pre-enabled boards and focus on software unique to your story. Simplify operations Managing a familiar environment and platform is easier and cheaper than a specialist OS. Naturally. More talent More Linux developers choose Ubuntu, so the talent pool is deeper and broader. Get in touch Developers drive success. Give them the platform they love. More developers Tap the biggest talent pool. Ubuntu is ahead of the pack by every measure. More packages Productivity starts with reuse. Accelerate developers with the world’s largest package selection. Better tools Every compiler and language developers use today is there, free, in Ubuntu. Cloud compatible Developers use Ubuntu in the cloud for CI/CD and build systems - iterate faster, deliver sooner. Latest software Ubuntu is renowned for being the place where you get the best and the latest bits. Container friendly The people who drive docker hardest do it on Ubuntu. Make cloud-native things. Classic Ubuntu Server or new Ubuntu Core The popular Ubuntu Server is great for developers and system administrators. The new Ubuntu Core is an appliance platform with immutable packages. Ubuntu Server The world’s most popular Linux includes a huge range of debs with rich dependency handling, as well as the new snaps for transactional package updates. Best for machines with high sysadmin touch. Learn more about Ubuntu Server › Ubuntu Core The all-snap Ubuntu Core runs only strictly confined snaps and locks the entire appliance down with immutable images and signatures. Best for appliances. Learn more about Ubuntu Core › Security matters most Get 12 years of automatic security updates for every major CVE. Any compromise of your device puts your reputation on the line. Fast fixes Canonical publishes security updates for Ubuntu every day. You choose when they get installed on your devices. Binary package updates Canonical builds and tests binary package updates for Ubuntu. No need to integrate a mountain of source code patches every year. CVE tracking A database of fixes supports your customer compliance policy by making it clear which issue is addressed in any update. Trusted Compute Ubuntu provides a verified boot sequence and full disk encryption with optional hardware keys. Strict confinement Keep your custom software strictly confined as snaps to ensure any problem stays isolated. 12 year maintenance No other embedded Linux comes close to Canonical’s commitment to long term security. Improved compliance Automatic tracking of Ubuntu component licenses and monitoring for your packages help you and your customers meet obligations. Automatic source publication Meet GPL requirements automatically. Annotations Know what licenses are used in each package. Scanning Let us check for undocumented or unauthorized code combinations. Apps Develop, deploy, iterate and improve. With Ubuntu and snaps, your teams run at cloud speeds. Enterprise App Store The IoT App Store is designed for distributed devices. Control updates and versioning. Choose which apps you want your devices to see. Create exclusive, private snaps for your ecosystem. Manage app stores as a service for ODMs, resellers and integrators. Learn more about IoT App Stores Read the datasheet › Snap Store The global Snap Store delivers apps to millions of Linux machines every day. With automatic OTA updates and advanced software versioning, snaps are a perfect solution for IoT. Deploy your app to the Store to get global exposure. It integrates directly with GitHub and Travis, and best of all it’s free to use. Explore the Snap Store DevOps for devices Build, test and publish applications automatically. Bring CI/CD to your IoT appliances. Give your developers a pipeline to deliver updates to customers straight from their standard process. Empower customers to test beta and pre-release versions. Whether you’re using Git with Travis or Jenkins, automated snap creation is just a few steps away. For open source projects, we will even build your snap for ARM, x86, POWER and Z. Canary updates and automatic rollbacks let you go fast with confidence. Build a snap All kinds of containers Snaps App packages for desktop, cloud and IoT that are easy to install, secure, cross‐platform and dependency‐free. Snaps are discoverable and installable from the Snap Store, the app store for Linux with an audience of millions. Build a snap Docker Bring your cloud containers and CI/CD tooling to the edge. Using apt and debs: apt install docker.io Using snaps: snap install docker Kubernetes MicroK8s is the simplest production-grade upstream K8s. Lightweight and focused. Single command install on Linux, Windows and macOS. Made for devops, great for edge, appliances and IoT with full high availability Kubernetes and autonomous clusters. Explore MicroK8s LXD LXD is a next generation container and virtual machine manager, providing flexibility and scalability for various use cases. Includes support for different storage backends, network types and the ability to install on a range of hardware. Learn more about LXD Ultra-reliable updates Transactional Failed updates roll back to the last working version automatically, allowing for rapid deployment. Auditable All snaps are digitally signed and can be verified at any time. On Ubuntu Core, the entire device is immutable and traceable. Secured Every application is confined to its own area for heightened security. On Ubuntu Core, the OS is locked down too. Snap deltas Binary deltas mean we transmit the least possible data per update, saving you time and money. Snapshots Backup device data at any time. Integrate with your existing data management strategy. Update control Schedule snap updates to align with planned maintenance windows. Learn more Hardware? Easy. We certify the major platforms so you are ready to roll. Fixed-price enablement and certification of related boards. Reference platforms Raspberry Pi Intel NUC Xilinx Evaluation Kits and SOMs Qualcomm Dragonboard Explore Ubuntu reference platforms Ubuntu enablement Get Ubuntu on your preferred board Activate standard and custom capabilities Security updates for 10 years Supported by Canonical Get in touch about certification Unleash your hardware Have a custom board? Let us deliver a standard Linux for your developers. Super connected Bluetooth, WiFi, LTE. It’s all at your fingertips. Standard system services with long term maintenance included. Sensor integration Get your real-world data streams flowing with the UPM and MRAA packages for Ubuntu. Architectures Our entire platform is certified on both x86 and ARM. Pick your favorite, or use both in a product family with little overhead. Right size silicon Start on Ubuntu and select the right silicon close to physical shipment, when your performance needs are better defined. Performance optimized Canonical works with the leading silicon providers to optimize the entire stack - from metal and kernel to computer vision and AI. Secure appliances Full disk encryption, secure boot and hardware key management raise the bar for trusted computing at the edge. Backed by Canonical Long term support, defined and delivered. We’ll get you from POC to MVP and shipping in record time. Frictionless development Standard images of Ubuntu are free to download, get started with no friction. FIPS, EAL, HIPAA We are trusted by the world’s most demanding institutions to deliver platforms for regulated services. Managed maintenance Updates and support from Canonical, for the life of your device. Enterprise management Thousands of companies manage Ubuntu every day. Your appliance will feel right at home. Global support No matter where you ship, no matter where your customers are, we can be there when you need us. Edge pioneers The intelligent edge is born on Ubuntu. From telco to retail, the trailblazers choose Canonical. Contact us Explore what snaps bring to Embedded Linux Read the whitepaperEmbedded Linux: Yocto or Ubuntu Core? › Read the whitepaperSecuring IoT device data against physical access › Read the whitepaperEmbedded Linux: make or buy? › <section class="p-section--deep"> <div class="row"> <h3><a href="/blog/tag/iot">Read the latest news on our blog&nbsp;&rsaquo;</a></h3> </div> </section> Latest news from our blog › Loading... canonicalLatestNews.fetchLatestNews( { articlesContainerSelector: "#horizontal-latest-articles", articleTemplateSelector: "#horizontal-articles-template", gtmEventLabel: "ubuntu.com/iot", tagId: "3633", tag_name: "iot", limit: "4", linkImage: true, excerptLength: "200", } )'
