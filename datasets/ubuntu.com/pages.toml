full_description = "Ceph storage on Ubuntu Canonical Ceph provides a flexible open source storage option for OpenStack, Kubernetes or as a stand-alone storage cluster. Get in touch Learn how Ceph can reduce your storage costs › Production-worthy Ceph storage Designed from the ground up for petabyte-scale deployments, Canonical's Ceph solutions include only open source components with highly automated operations to drive down the total cost of ownership. If you do not have the in house expertise to operate your own storage infrastructure Canonical Ceph is available as a managed service. Proven success with Ceph storage In the early days of Ceph, Yahoo! Japan searched for a local company who could support them in implementing an open-source distributed storage solution from the Linux operating system all the way to Ceph. Canonical provided not only Ceph but also the tooling and expertise that reduced the OpEx associated with managing a large storage cluster. Learn more about Yahoo! Japan's Ceph cluster › The Wellcome Sanger Institute initially opted for self-maintained Ceph storage, but as their capacity needs grew from 3 PB to over 20 PB, they turned to Canonical to resolve their scaling issues. With the help of Canonical support, the Institute's latest Ceph rollout decreased from a month to just four days. Learn how Wellcome Sanger achieved a cost-effective Ceph infrastructure › Learn more about Yahoo! Japan's Ceph cluster › Learn how Wellcome Sanger achieved a cost-effective Ceph infrastructure › Ceph storage deployment and operations Canonical can help you to design and install your Ceph cluster or provide consulting to enable you to run Ceph autonomously. Day 2 operations are straightforward with highly automated procedures to upgrade and expand clusters, and manage hardware replacements.If you prefer to treat your storage as-a-service, we offer Managed Ceph – a Ceph cluster fully managed by Canonical. Benefits of Ceph on Ubuntu The choice is yours as to whether 