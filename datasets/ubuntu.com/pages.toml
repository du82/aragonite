full_description = "Ubuntu on public clouds Ubuntu is the world's most popular cloud operating system across public clouds. Thanks to its security, versatility and policy of regular updates, Ubuntu is the leading cloud guest OS and the only free cloud operating system with the option of enterprise-grade commercial support. Contact us Ubuntu builds optimised and certified images of Ubuntu Server for partners like Amazon AWS, Microsoft Azure, Google Cloud, IBM Cloud and Oracle Cloud. 5 years of maintenance and security updates with Ubuntu LTS Proven for enterprise-scale workloads on all leading public clouds Free from licence fees, regardless of how many images you run Ubuntu Pro is a subscription that provides additional enterprise-grade support, security and compliance on top of Ubuntu LTS. 10 years of maintenance and security updates for over 36,700 packages, up to 12 years with Legacy Support Kernel security updates applied without reboot with Livepatch Hardening and audit tools for CIS and DISA-STIG, and FIPS certified components A selection of our certified public cloud partners › Select your platform AWS Azure Google Cloud IBM Cloud Oracle Cloud AWS Azure Google Cloud IBM Oracle Get Ubuntu Pro on AWS Get Ubuntu Server on AWS Learn more about Ubuntu on AWS Find Ubuntu images on AWS Documentation Get Ubuntu Pro on Azure Get Ubuntu Server on Azure Learn more about Ubuntu on Azure Find Ubuntu images on Azure Documentation Get Ubuntu Pro on Google Cloud Get Ubuntu Server on Google Cloud Learn more about Ubuntu on Google Cloud Find Ubuntu images on Google Cloud Documentation Please contact us to purchase an Ubuntu Pro subscription that you can attach to your IBM Cloud instance. Find Ubuntu images on IBM Cloud Documentation Information for Ubuntu 18.04 LTS users Please contact us to purchase an Ubuntu Pro subscription that you can attach to your Oracle Cloud Infrastructure instance. Find Ubuntu images on Oracle Cloud Documentation Information for Ubuntu 18.04 LTS user