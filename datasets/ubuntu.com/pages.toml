full_description = '''Bring Ubuntu to your organisation Ubuntu Desktop combines enterprise-grade support, security and functionality with the best of open source. Contact us Download the datasheet Secure open source with Ubuntu Pro › Secure enterprise management with Ubuntu Pro Desktop Secure open source stack Receive 10 years of security patches for Ubuntu LTS releases with Expanded Security Maintenance (ESM) and coverage for over 23,000 packages in the Ubuntu Universe repository. Minimise downtime with Kernel Livepatch. Learn more about Ubuntu Pro › Landscape fleet management Software updates, configuration management, policy compliance, and permission control for your entire physical and virtual fleet. Landscape is easy to use and smoothly integrates with other tooling through a robust API. Learn more about Landscape › Advanced Active Directory policies Increase your management capabilities with full Group Policy Object support, remote script execution and privilege management. Learn more about Active Directory integration › Compliance, certification and hardening Ubuntu Pro delivers security and compliance for even the most sensitive workloads with FIPS 140-2 certified modules, CIS hardening and Common Criteria EAL2 certification available. Learn more about Ubuntu's security practices › Weekday or 24/7 support Advanced support customers get direct 24/7 access to our enterprise open source support team through our web portal, knowledge base or via phone. Contact us Adopting a secure enterprise Linux desktop Learn more about how you can adopt Linux securely for development teams in a Windows-centric organisation, without compromising on manageability and compliance. Download our guide High performance on your choice of hardware To offer the best performance on Ubuntu, manufacturers are pre-loading devices with an Ubuntu certified image. Canonical is committed to working closely with the world’s leading manufacturers to optimise and certify Ubuntu on their laptops and PCs. Learn more about Ubuntu certified hardware › Endorsed by partners and customers “Developers and data science teams use the Ubuntu platform to support their most important work. Our collaboration with Canonical enables industry innovators to get AI-powered insights from their data faster”. Manuvir Das NVIDIA, Head of Enterprise Computing Seamless integration with your existing infrastructure Advanced Active Directory support (GPO) Microsoft Active Directory integration is available by default for user authentication. Ubuntu Pro users receive access to advanced functionalities like GPO support, like remote script execution and privilege management through ADsys. Integrating Ubuntu Desktop with Active Directory › ADSys documentation › Cloud identity providers integration Newer versions of Ubuntu include Authd, a new authentication daemon that allows direct integration with cloud-based identity providers for both Ubuntu Desktop and Server. At launch, Authd supports Microsoft Entra ID (formerly Azure Active Directory) identity provider, with additional providers to be introduced in the future. Learn more about Authd › Supported by key Microsoft tools Microsoft Intune on Ubuntu Desktop enables custom policy compliance and gated access to corporate resources via the Microsoft Edge browser. Ubuntu also supports critical business and administration applications such as Powershell and Microsoft Teams. Watch our webinar › Ubuntu on Windows Subsystem for Linux Windows Subsystem for Linux (WSL) gives Windows developers a full Ubuntu terminal experience and easy access to cutting edge open source tools. IT administrators can leverage Ubuntu Pro to remotely manage and secure their developer instances. Learn more about Ubuntu on WSL › Virtual desktops, powered by AWS Ubuntu Desktop on Amazon WorkSpaces offers developers an optimised Ubuntu Desktop environment to rapidly build, test and deploy code — spinning up and tearing down instances as required. IT organisations benefit from rapid deployment, configuration and scalability for their managed Ubuntu Desktops whilst their applications and data remain secured in the AWS cloud, even when their developers are working remotely. Find out more about Ubuntu WorkSpaces › Day zero support with Ubuntu Desktop Enterprise Services Designed to help your developers get up and running on Ubuntu as quickly as possible. Canonical engineers partner with you to deliver a solution tailored to your needs, including: Custom image creation Post-deployment automation Active Directory integration Security configuration Landscape deployment and registration Learn more about our enterprise services Learn more about Ubuntu Desktop in organisations Webinars Adopting Linux securely in a Windows-centric enterprise Unleashing Z Workstations by HP Powered by Ubuntu Whitepapers Adopting a secure enterprise Linux desktop How to integrate Ubuntu Desktop with Active Directory Maximizing security and compliance in the US public sector with Ubuntu Pro How to increase developer productivity with Ubuntu Desktop Latest Ubuntu Desktop news from our blog › Explore all canonicalLatestNews.fetchLatestNews( { articlesContainerSelector: "#desktop-latest-articles", articleTemplateSelector: "#desktop-articles-template", excerptLength: 200, groupId: "1479", linkImage: true, limit: 3 } )'''
