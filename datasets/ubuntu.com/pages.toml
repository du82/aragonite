title = """
How can you personalize your Ubuntu Pro subscription?| Ubuntu"""
description = "Ubuntu Pro is Canonical’s subscription for open source software security, support and compliance. Users of Ubuntu Pro benefit from Expanded Security Maintenance, which extends patching from the standard 5 years to 10 years, for both the Main and Universe repositories. However, Ubuntu Pro goes beyond patching and maintenance, and includes  […]"
full_description = '''How can you personalize your Ubuntu Pro subscription? Ishani Ghoshal on 13 February 2025 Share on: Facebook Twitter LinkedIn Tags: store , Ubuntu Pro Ubuntu Pro is Canonical’s subscription for open source software security, support and compliance. Users of Ubuntu Pro benefit from Expanded Security Maintenance, which extends patching from the standard 5 years to 10 years, for both the Main and Universe repositories. However, Ubuntu Pro goes beyond patching and maintenance, and includes access to a host of tools that can further enhance both security and stability for our users. We’re dedicated to ensuring that every user and organization gets the most out of their subscription, so in this blog, we’ll introduce how you can benefit from some of the other features of Pro, such as automated compliance hardening, device management, and live kernel-patching. We’ll also provide a runthrough of the different types of Ubuntu Pro subscription available to users via the Ubuntu shop. Let’s dive in. Learn more about Ubuntu Pro How does Ubuntu Pro fit your needs? As an enterprise-grade subscription, Ubuntu Pro caters to various environments and use-cases. Ubuntu Pro is always free for individuals on up to 5 machines, whilst for organizations there are a range of flexible plans to accommodate varying needs. Essentially, where Ubuntu goes, Pro can follow, meaning that if you’re using Ubuntu on a desktop, public cloud, server or device, your Pro subscription will cover all your use cases. So how might you benefit from the tools that Ubuntu Pro offers? We’re sharing some instances from our users to help illustrate how you can use your subscription to its full potential. PCI-DSS compliance for VMs Ubuntu Pro includes tools for compliance automation, to help simplify compliance for frameworks such as NIST, FedRAMP, ISO27001 and CIS. That means that Pro can help organizations streamline their compliance process across a whole range of industries. For instance, PCI-DSS is a payment industry standard that must be followed by any company that stores, processes or transmits payment card information. It requires adherence with established frameworks such as NIST, DISA-STIG and CIS, depending on the location and use case, which can be daunting to try to configure manually. Financial institutions often run private cloud environments for their workloads, which may include VMs to host customer-facing applications. Ubuntu Security Guide (USG), included with Ubuntu Pro, simplifies this process by providing prebuilt hardening profiles for compliance frameworks like CIS benchmarks (for desktops and servers) and DISA-STIG (aligned with NIST 800-171 for US Federal use cases). This allows administrators to efficiently configure their servers and audit their systems to ensure adherence to security best practices, reducing the risk of misconfigurations and non-compliance. To get started, you can visit the Ubuntu Pro shop to select how many VMs you need to cover and choose the plan that best suits your organization’s security and compliance needs. Live patching for public cloud instances – Suitable for scalable workloads on AWS, Azure, or Google Cloud Many organizations choose to innovate on the public cloud, which is why Canonical works directly with vendors such as AWS, Azure and Google Cloud to bring the benefits of Ubuntu Pro to their platforms. In addition to the expanded patching and maintenance that Pro users receive wherever they use Ubuntu, many organizations also opt to make use of kernel livepatching. This is a feature that patches the Linux kernel between security maintenance windows, whilst the system runs, enabling you to minimize downtime. Taking the example of a SaaS enterprise hosting its infrastructure on public clouds, Live-kernel patching helps avoid downtime for customers, whilst maintaining full compliance with regulatory requirements and ensuring that production workloads remain secure and audit-ready. Get started with Ubuntu Pro on your preferred public cloud provider today Secure workstations for developers and professionals We know that many users depend on Ubuntu for critical use cases, where downtime is costly and disruptive. Additionally, managing multiple workstations can be complex and time-consuming, especially in environments where security and compliance are critical. With Landscape, included as part of Ubuntu Pro, organizations can efficiently manage their workstation fleet at scale. Landscape enables administrators to audit systems for updates, monitor their security status, and ensure that all machines are running the latest patches. This centralized management approach provides a unified view of all workstations and allows organizations to maintain secure workstation environments with minimal operational overhead.. Visit the Ubuntu Pro shop to select the machines or environments you want to cover and unlock the benefits of Landscape. Streamline device management and ensure uninterrupted service delivery with Landscape Let’s say an energy company needs to manage hundreds of IoT-enabled EV charging stations, requiring centralized maintenance and monitoring. Landscape, Canonical’s systems management tool included with Ubuntu Pro, streamlines device management by automating security patching, software updates, and device monitoring, ensuring uninterrupted service delivery and compliance with industrial standards. To get started with Ubuntu Pro for Devices, get in touch with us. Customizing your subscription Ubuntu Pro supports all the use-cases outlined above and many more. Once you decide on what your requirements are, with just a few clicks, you can choose a subscription that aligns with those requirements. Machine Count– Scale from one machine to hundreds, with Pro growing alongside your needs. Ubuntu LTS Version– Compatible with Ubuntu 16.04 LTS and higher. Security Coverage– Whether you need full-stack security or infrastructure-focused coverage, Ubuntu Pro has flexible options to fit your needs. Pro – Comprehensive coverage for packages in main and universe repositories. Infra-only – Focused coverage for packages in the main repository. Support add-ons If you’re looking for hands-on support, you can also tailor your subscription to include direct access to Canonical’s global expert support team, with phone and ticket support. Canonical support engineers will provide your organisation with troubleshooting, break fix, bug fix and guidance promptly and effectively. Visit the shop and select the coverage and response time that works best for your organisation: Select Infra Support for break-fix and bug fix-support for Ubuntu Base OS, Kubernetes, LXD, and Charms, OpenStack and MAAS, Ceph and Swift Storage. Or opt for full stack support for 25,000+ packages and all of Canonical’s applications. For both cases, you can choose between weekday support and 24/7/365 support. Start your Ubuntu Pro journey today With an easy-to-use online shop, getting Ubuntu Pro has never been simpler. Get Ubuntu Pro now Try Ubuntu Pro today Alternatively, you can try before you buy. Activate a 30-day free trial via the online shop and experience Ubuntu Pro with no upfront commitment. Your card will only be billed at the end of the trial period. Managing and renewing your subscription Once your subscription is active, you simply have to navigate to your Pro dashboard to view your current plan or make any changes to your plan. You can also manage the renewal of your subscription via the Pro dashboard. Any questions? Get in touch with us. Talk to us today Interested in running Ubuntu in your organisation? // Get all loaded cards var cards = document.getElementsByClassName('js-product-card'); if (cards) { // Roll a dice var selectedIndex = Math.floor(Math.random() * cards.length); // Display card cards[selectedIndex].classList.remove("u-hide") } Newsletter signup Get the latest Ubuntu news and updates in your inbox. Work email: *I agree to receive information about Canonical's products and services. By submitting this form, I confirm that I have read and agree to Canonical's Privacy Policy. Sign up'''
