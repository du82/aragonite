["https://ubuntu.com/blog/ubuntu-security-defense-in-depth"]
title = """
Security in depth with Ubuntu: Mapping security primitives to attacker capabilities| Ubuntu"""
description = "Discover how Ubuntu’s layered security approach outmaneuvers attackers at every stage. From rapid patching to zero-day containment, learn how to make cyber attacks unviable."
full_description = '''Security in depth with Ubuntu: Mapping security primitives to attacker capabilities ijlal-loutfi on 7 February 2025 Share on: Facebook Twitter LinkedIn Tags: confidential computing Cybersecurity is not about perfection. In fact, it’s more like a game of chess: predicting your opponent’s moves and making the game unwinnable for them. Like chess players, attackers are always looking for an opening, probing for weaknesses, or waiting for you to make a mistake. Therefore, the best defense isn’t a single unbreakable barrier, but instead a layered strategy that forces your adversary into a losing position at every turn. Ubuntu’s security model follows this philosophy. Instead of chasing the illusion of an unbreakable system, it deploys a deep, multi-layered defense that forces attackers to spend exponentially more time, skill, and resources at each step. Each security feature works in harmony to create a robust platform capable of withstanding sophisticated attacks. By recognizing the unique threats each layer addresses, you can choose the defenses best suited to your environment. From rapid patching of known vulnerabilities to hypervisor-level isolation with confidential computing, every layer raises the cost of an attack, making intrusion less feasible and containment more effective. In this blog post, I’ll outline the various layers of defense you can build to ensure the strongest cybersecurity strategy possible. Defending against Known Vulnerabilities Once a vulnerability goes public, the clock starts ticking. Attackers move fast, often exploiting new CVEs within days or even hours. Despite this, organizations still take an average of 97.8 days to patch critical vulnerabilities, leaving a gaping window of exposure. Ubuntu’s Extended Security Maintenance (ESM), part of the Ubuntu Pro subscription, shuts that window tight. With up to 12 years of dedicated security updates, even legacy systems stay protected. Canonical’s security team tracks vulnerabilities in real time, delivering patches at an average speed of under 24 hours for critical CVEs. The result? A system that adapts faster than attackers can strike. Strengthening cryptographic integrity A more sophisticated attacker won’t just wait for a CVE, they’ll go after cryptographic weaknesses, exploiting implementation flaws through padding oracle attacks, timing attacks, or side-channel analysis. To mitigate these risks, Ubuntu provides FIPS-certified cryptographic modules, meeting stringent NIST standards for cryptographic integrity. Whether you’re securing government systems or enterprise workloads, Ubuntu’s validated components, Linux Kernel Crypto API, OpenSSL, OpenSSH, libgcrypt, and strongSwan ensure that encryption mechanisms remain robust against both theoretical and practical attacks. Guarding against misconfigurations Even with a fully patched system, a single misconfiguration can open the door for attackers. Weak default settings, unnecessary services, and improperly configured access controls are some of the most common entry points for adversaries. Ubuntu addresses this challenge with the Ubuntu Security Guide (USG), a tool that automates security hardening based on industry benchmarks from CIS and DISA. USG applies best practices such as: Disabling unused USB ports to prevent physical attacks Enforcing full disk encryption to protect data at rest Removing unnecessary packages to reduce the attack surface Tightening file system permissions to enforce least privilege Implementing remote logging to prevent log tampering By automating security hardening, USG transforms complex compliance tasks into a streamlined process, ensuring that Ubuntu deployments are resilient by default. Deep dive into security in depth with this whitepaper Protecting against zero-day vulnerabilities with AppArmor Zero-day exploits are the security industry’s nightmare. By definition, there’s no patch available for such exploits; but that doesn’t mean you’re completely defenseless AppArmor, Ubuntu’s Mandatory Access Control (MAC) framework, isolates applications and enforces strict security profiles. Even if an attacker exploits a zero-day, AppArmor prevents them from executing arbitrary actions or moving laterally within the system. Ubuntu ships with preconfigured AppArmor profiles, and users can generate custom policies to lock down critical workloads, mitigating the impact of unknown threats before they strike. Securing early boot software Some attackers don’t wait until the OS is running, they target the system before it even boots. Compromising firmware or bootloaders provides attackers with deep persistence and near-undetectable control. Ubuntu counters this with Secure Boot and Full Disk Encryption (FDE): Secure Boot enforces a chain of trust, ensuring that only signed, trusted firmware and bootloaders execute Full Disk Encryption (FDE) protects data from offline attacks, rendering the storage unreadable without the correct decryption key Together, these measures ensure that attackers can’t tamper with the system’s foundation, preventing stealthy boot-level compromises. Defending against host-level compromise with Confidential Computing For the most advanced adversaries – such as those who can compromise an entire host environment –traditional defenses fall short. If the hypervisor or host OS is breached, all virtual machines (VMs) running on it are at risk. Confidential Computing changes the game. With technologies like Intel TDX and AMD SEV-SNP, Ubuntu isolates workloads within the CPU itself, ensuring that even a compromised hypervisor cannot access sensitive data. This separation of resource management from data access establishes a new security primitive, one that fundamentally reshapes how cloud security is architected. Join our webinar about security in depth to learn more about Ubuntu’s security solutions and learn how to tailor them to your environment. Security as a layered defense There is no checkmate in cybersecurity. The game never ends, and hesitation is fatal. Every move must raise the cost of attack, tighten the perimeter, and shrink the blast radius. The goal of cybersecurity isn’t to be invulnerable. That’s a fantasy. The goal is to make intrusion expensive, persistence impossible, and silence a myth. Security isn’t about stopping every attack, it’s about making sure the adversary never wins. As such, Ubuntu builds a battlefield where every step forward drains the adversary’s time, skill, and resources. Fast patching, hardened cryptography, automated lockdowns, zero-day containment, and pre-boot integrity : a relentless defense that makes intrusion a war of attrition attackers can’t afford. Resources Explore Ubuntu Pro Contact us Talk to us today Interested in running Ubuntu in your organisation? // Get all loaded cards var cards = document.getElementsByClassName('js-product-card'); if (cards) { // Roll a dice var selectedIndex = Math.floor(Math.random() * cards.length); // Display card cards[selectedIndex].classList.remove("u-hide") } Newsletter signup Get the latest Ubuntu news and updates in your inbox. Work email: *I agree to receive information about Canonical's products and services. By submitting this form, I confirm that I have read and agree to Canonical's Privacy Policy. Sign up'''
