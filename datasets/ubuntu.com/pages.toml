full_description = '''Submit Toggle side navigation Toggle side navigation Ubuntu Core documentation Latest release: Ubuntu Core 24 Tutorials Get started Build your first image Access Ubuntu One Create a model Sign the model Build the image Boot the image Try pre-built images Install on a VM Install on a device Use Raspberry Pi Imager Use the dd command How-to guides Using Ubuntu Core Image creation Use ubuntu-image Add custom snaps Add a splash screen Add console-conf Optimise boot speed Calculate partition sizes Build a gadget snap Build a kernel snap Board enablement Manage Ubuntu Core Use Ubuntu One SSH Test on QEMU Upgrade Ubuntu Core Set system options Use a recovery mode Add a system user Modify kernel options Create a recovery system from the API Set system time Troubleshooting Container deployment Run a Docker container Deploy Docker from a snap Package Docker images in a snap Build an image for Docker deployment Reference System requirements Testing platforms Gadget snap format Kernel boot parameters Assertions account account-key model repair serial snap-build snap-declaration snap-resource-pair snap-resource-revision snap-revision system-user store validation validation-set Explanation Remodelling Refresh control Recovery modes Full disk encryption Preseed performance How installation works Docker companion snap Security and sandboxing Core elements Snaps in Ubuntu Core Storage layout Stores Brand accounts Dedicated Snap Stores Store scoping Store overview System snaps Bluetooth management Modem Manager Install Modem Manager How-to guides Gather Modem Information Enter SIM passwords Configure cellular connections Reference Debug Available commands DBus API Release Notes Network Manager Install NetworkManager How-to guides Explore Network Status Configure WiFi Connections Configure WiFi Access Points Configure Cellular Connections Configure shared connections Configure VPN connections NetworkManager and netplan Edit Connections Message logging Reference Routing Tables Snap Configuration Default renderer Debug Connectivity check Wake on WLAN WIFi Powersave Available Commands DBUS API Release Notes Report a Bug Contribute to our docs Ubuntu Core documentation Ubuntu Core is a version of the Ubuntu operating system designed and engineered for deploying IoT and embedded systems. In Ubuntu Core, every element of the system runs within a confined sandbox using Snap packages, which are used exclusively to create a transaction-based system. Security and robustness are the key features, alongside being easy to install, easy to maintain, and easy to upgrade. Ubuntu Core is ideal for embedded devices because it manages itself. Whether it’s running on a PC-style system hidden for media streaming, or an embedded ARM device handling garage door automation, Ubuntu Core remains transparent, trustworthy and autonomous. From Linux and maker space tinkerers, to the robotics, automotive and signage industries; from a single device, to a deployment of thousands: Ubuntu Core can handle it. In this documentation Tutorials Get started - a hands-on introduction to Ubuntu Core for new users How-to guides Step-by-step guides covering key operations and common tasks Explanation Concepts - discussion and clarification of key topics Reference Technical information - specifications, APIs, architecture Project and community Ubuntu Core is a member of the Ubuntu family. It’s an open source project that welcomes community projects, contributions, suggestions, fixes and constructive feedback. Community engagement commitment Our Code of Conduct How to get support Join the Discourse forum Interactive chat on Matrix.org Product roadmap Thinking about using Ubuntu Core for your next project? Get in touch! Next Latest release: Ubuntu Core 24 This page was last modified 30 days ago. Help improve this document in the forum. // Allows the 'onchange' listener to be used on a select field, while still being accessible. (function initSelect() { var selectField = document.querySelector("#version-select"); selectField.changed = false; selectField.onfocus = selectFocussed; selectField.onblur = selectUnFocussed; selectField.onkeyup = selectKeyed; selectField.onchange = updatePage; })(); function updatePage(e) { this.changed = true; window.location.href = e.target.value; } function selectFocussed() { this.initValue = this.value; } function selectUnFocussed() { if (this.value != this.initValue) { this.changed = true; window.location.href = this.value; } } function selectKeyed(e) { e.preventDefault(); var theKeyPressed; var validConfirmKeys = [9, "Tab", 13, "Enter"] var validCancleKeys = [27, "Escape", "esc"] if (e) { theKeyPressed = e.key || e.keyCode; } else { return false; } if (validConfirmKeys.includes(theKeyPressed) && this.value != this.initValue) { this.changed = true; window.location.href = this.value; } else if (validCancleKeys.includes(theKeyPressed)) { this.value = this.initValue; } else { this.changed = false; } }'''
