anagement tooling enables you to manage the entire lifecycle of deployment, configuration, and operation of a Ceph cluster, no matter its size or complexity. Our tooling simplifies both installation automation as well as Day-2 operations orchestration, such as monitoring, scaling, upgrades and hardware maintenance while remaining interoperable with other infrastructure and application management solutions. Benefits of Canonical Ceph Highly scalable from Terabytes to Exabytes Highly reliable with no single point of failure in the cluster Fault-tolerant through data replication and erasure coding Enable BCP/DR with remote replication Highly secure client authentication and at rest encryption Compatible with Amazon S3 and OpenStack Swift APIs Decrease CapEx by using commodity hardware Decrease OpEx through failure detection, self-management and self-healing Configurable and optimizable for cost and performance Encryption at rest Canonical Ceph allows for encryption at rest to be configured through our deployment tooling to provide data encryption and integrity assurance for Ceph OSDs. Tested architecture Our Ceph reference architectures have been developed after extensive testing and production experience with leading hardware vendors. Utilize nearline SAS or SATA drives for bulk storage to drive lower storage costs with NVMe flash as a cache device to increase performance. Getting started with Ceph on Ubuntu Charmed Ceph Deploy large-scale complex Ceph clusters in minutes Easily upgrade to newer Ceph versions Provide model-driven orchestration for repeatability and predictability RBD, CephFS and RGW support NFS and iSCSI support Configure nodes consistently Replace failing disk drives and retire old hardware Expand the capacity of your storage cluster Install Charmed Ceph › Ceph support on Ubuntu Ceph support is included in Ubuntu Pro Simple and predictable pricing model Up to 384TB of raw storage included per node OCI compliant rocks for cephadm and Rook or packages available Get access to the Ceph storage experts 24/7 or during business hours Alternatively, get extended security maintenance if all you need is peace of mind by consuming security patches from the world's leading security team Learn more about Ubuntu Pro › MicroCeph Streamlined and effortless Ceph Opinionated and automated cluster deployment and management RBD, CephFS and RGW support Perfect for edge computing and remote offices Isolated deployment package to protect underlying systems Developer friendly, ideal for training delivery and local development Install MicroCeph › Managed Ceph Fully managed storage cluster, on your servers, at your location Built in 2 weeks using a proven reference architecture Customize the architecture in iterations based on your storage needs Your team has access to all machines at all times Modern monitoring and log management Canonical hands over the keys when you are ready Learn more about fully managed Ceph › Learn more about Ceph Webinar Ceph for Enterprise Whitepapers Introduction to cloud-native storage Cloud storage cost optimization"
