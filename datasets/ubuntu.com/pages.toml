full_description = '''University of Tasmania unlocks real-time space tracking with AI/ML supercomputing Learn how Tasmania University is modernising its space-tracking data processing with the Firmus Supercloud, built on Canonical’s open infrastructure stack Download The Case Study Spacecraft, satellites, and debris – all objects in orbit around Earth or on planetary missions must be tracked. The University of Tasmania (UTAS) is among the leading providers of space tracking in the southern hemisphere. Still, traditional CPU-based data processing had led to a bottleneck that prevented comprehensive, real-time object monitoring. To address this challenge, the university migrated its space-tracking software to Supercloud – a cost-effective and highly sustainable supercomputing platform built using Charmed OpenStack and Charmed Kubernetes to support the most data-intensive AI/ML workloads with the help of Canonical and Firmus. Read the case study to learn how: Tasmania University, with the help of Canonical and Firmus has eliminated the data processing bottleneck, unlocking real-time, multi-object identification and monitoring. Supercloud will empower UTAS to pursue additional AI/ML initiatives UTAS is planning its MLOps tooling to simplify AI/ ML workflows through automation and reproducibility. "[Supercloud] gives data scientists full flexibility to use the latest open source tools and NVIDIA hardware capabilities, which is not achievable with off-the-shelf solutions” Maciej Mazur, AI/ML Principal Engineer at Canonical Further reading Getting Started with AI A Guide to MLOps What is MLOps Contact information First name: Last name: Work email: Company name: Job title: Mobile/cell phone number: Country: Select... France Germany Japan United Kingdom United States of America —————————————————— Afghanistan Åland Islands Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Australia Austria Azerbaijan Bahamas Bahrain 