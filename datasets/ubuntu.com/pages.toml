lassNameString; // Set language attributes if (selectedTakeover.lang) { takeover.setAttribute("lang", selectedTakeover.lang); } if (selectedTakeover.lang_skip) { takeover.setAttribute("lang-skip", selectedTakeover.lang_skip); } // Set takeover content if (title.textContent.length > 80 || subtitle.textContent.length > 80) { title.classList.remove("u-no-margin--bottom") subtitle.classList.remove("p-heading--2") } title.textContent = selectedTakeover.title; subtitle.textContent = selectedTakeover.subtitle; image.src = selectedTakeover.image; image.onload = function() { // Remove animation delay if (takeoverAnimation) { takeoverAnimation.className = takeoverAnimation.className.replace(" is-loading", ""); takeoverAnimation.className += " is-loaded"; } } if (image.getAttribute("src") === "") { takeoverAnimation.className = takeoverAnimation.className.replace(" is-loading", ""); takeoverAnimation.className += " is-loaded"; } image.removeAttribute("style"); image.width = selectedTakeover.image_width; image.height = selectedTakeover.image_height; if (selectedTakeover.primary_url && selectedTakeover.primary_cta) { primaryUrl.href = selectedTakeover.primary_url; primaryUrl.textContent = selectedTakeover.primary_cta; } else { primaryUrl.remove(); } if (secondaryUrl && selectedTakeover.secondary_url && selectedTakeover.secondary_url !== "") { secondaryUrl.href = selectedTakeover.secondary_url; secondaryUrl.innerHTML = selectedTakeover.secondary_cta + "&nbsp;&rsaquo;"; } else { secondaryUrl?.remove(); } dataLayer.push({ event: "NonInteractiveGAEvent", eventCategory: "www.ubuntu.com-impression-takeover", eventAction: "from:" + window.location.href + " to:" + selectedTakeover.primary_url, eventLabel: selectedTakeover.primary_cta, eventValue: undefined, }); }'''
