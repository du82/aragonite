["https://ucdavis.edu/about/visit/tour-guides/heidi-aleman-jimenez"]
title = "Heidi Aleman Jimenez | UC Davis"
description = "Heidi Aleman JimenezPronouns: she/her/ella Major: Psychology"
full_description = '''Heidi Aleman JimenezPronouns: she/her/ella Major: Psychology Minor: NeuroscienceWhere have you found community and support on campus?"Some things that I’ve been involved with have been the University Honors Program and Aggie House. I have found community and support on campus through the Student Community Center, El Centro and the Women Research and Resource Center. These spaces, along with others, have events throughout the school year that encourage students to socialize and connect with new people." What would you tell prospective students about UC Davis?"I would tell prospective students that UC Davis is such a beautiful and welcoming campus. There’s a ton of resources here that will allow you to grow academically, professionally and individually. There's a rich student life here and there’s other cities to explore like Sacramento, Lake Tahoe, and San Francisco which are close by for a fun trip with friends." Why did you choose UC Davis?"I decided to choose UC Davis because of the environment. When I got a tour from here in high school I could just feel that it was a welcoming place and knew that this would be my home away for the next four years. I also chose UC Davis because of the financial aid package I received. Coming from a low income family one of my goals was to reduce the amount of money I had to pay for college, luckily I am on the road to graduate debt free." What do you like about academics and student life here?"What I like about the academics here is the flexibility of my major. I truly feel like my major is the perfect balance between STEM courses and non-stem courses. I’ve been able to take some fun classes such as the Design of Coffee. What I like about the student life here is that we have tons of clubs on campus which makes it easy to get involved!"'''
author = "Derrick Anthony Phipps"
