full_description = "Beach day trips Breadcrumb UC Davis About Us Locations In the Middle of Everywhere Beach day trips Popular beaches a day trip from Davis Davis is right in the middle of Northern California. In a day trip, you can drive or take public transit to popular beaches from our valley location. Below, you can browse common beach destinations and directions to reach them. Santa Cruz Santa Cruz is a two-hour drive from Davis. The town is known for its great surf and popular beach boardwalk. Image Stinson Beach A great beach for swimming and soaking up the sun just an hour and forty-five minutes from Davis. Image Half Moon Bay A great combination of sandy beaches, tide pools and amazing scenery — all less than a two-hour drive from Davis. Image Baker Beach This landmark beach is just an hour and half from Davis. It’s known for beautiful scenery and proximity to San Francisco. Image Carmel by the Sea Carmel is known for its relaxed beaches, golf courses and proximity to the Monterey Bay Aquarium. Image South Lake Tahoe Known for its skiing, Tahoe also has some excellent beaches and summer activities. Image"
