title = "Ellie Kwon | UC Davis"
description = "Ellie KwonPronouns: she/her/hersMajor: Psychology with a biological emphasis"
full_description = 'Ellie KwonPronouns: she/her/hersMajor: Psychology with a biological emphasis Minor: Asian American studiesHow do you feel UC Davis is helping you grow and preparing you for success? "There are so many resources that UC Davis offers, especially when it comes to academics. I have had no trouble attending tutoring and getting the help that I need to be successful in my classes. Meanwhile, being a tour guide has taught me how to communicate information effectively and accurately, which is useful for so many different careers." What would you tell prospective students about UC Davis?"UC Davis is a unique and charming college town. The students here are supportive of one another and the professors are enthusiastic about what they teach. If you are ever struggling, whether it be in academics, finding a club to join or your living situation, UC Davis has all of those resources just waiting to be found." Why did you choose UC Davis?"I chose UC Davis because of its location and accessibility to transportation. Growing up in Los Angeles, I have battled traffic, crazy drivers and unorganized public transport. The last thing I wanted was to move to another big city and feel that familiar stress. Here in Davis, I can bike anywhere no problem and I love that! Also, since I am from Southern California, I wanted to explore the other half of California and Davis is right in the center of so many great places to travel to." What do you like about academics and student life here?"I like that academics are truly collaborative here and that there are an endless amount of options when it comes to finding that home away from home. The amount of study groups, collaboration and tutoring that goes around at UC Davis helps students thrive. This especially helped me in my first year as I was adjusted to the quarter system and college classes."'
author = "Derrick Anthony Phipps"
year_published = 2024
year_updated = 2025
