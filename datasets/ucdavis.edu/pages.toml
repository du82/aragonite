["https://ucdavis.edu/about/visit/tour-guides/megan-wallace"]
title = "Megan Wallace | UC Davis"
description = "Megan WallacePronouns: she/theyMajor: Managerial economics, communications"
full_description = '''Megan WallacePronouns: she/theyMajor: Managerial economics, communicationsWhere have you found community and support on campus?"I've been involved in a multitude of clubs, however Undergraduate Admissions has been the biggest contributor to my personal and professional growth during my time at Davis."What would you tell prospective students about UC Davis?"For me, the most catalyzing element of UC Davis was undoubtedly the people. I know it's cliche but I have been surrounded by the most encouraging, empowering and friendly individuals. They have pushed me to become my best self, succeed in courses and explore various fields and career paths. Living in Davis presents many environments. First, you are surrounded by a safe, accessible, student-oriented college town. Second, you have access to larger cities and experiences within driving, bussing or training distance! There are endless possibilities." Why did you choose UC Davis?"The collectivistic, environmentally-conscious and adventurous atmosphere drew me in instantly!"What do you like about academics and student life here?"While going to a top ten public university presents challenging academic rigor, the student body, here is incredibly open to group work and help. In fact, just by asking for help on a concept in lecture, I have made friends that have followed me all four years."'''
