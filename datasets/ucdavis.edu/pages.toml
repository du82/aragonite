["http://ucdavis.edu/about/locations/transportation/join-team-bike"]
title = "Join ‘Team Bike’ | UC Davis"
description = 'Your bike-friendly neighborhood university Did you know nearly 50 percent of UC Davis students commute using a bike to get around town and campus? When you attend UC Davis, you’ll find bikes are very popular for getting to class or taking a recreational spin on the Davis Bike Loop. There are many great reasons to join the UC Davis “Team Bike."'
