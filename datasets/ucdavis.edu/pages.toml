["https://ucdavis.edu/about/visit/tour-guides/madelyn-parker"]
title = "Madelyn Parker | UC Davis"
description = "Madelyn ParkerPronouns: she/her/hersMajor: Human development"
full_description = '''Madelyn ParkerPronouns: she/her/hersMajor: Human development How do you feel UC Davis is helping you grow and preparing you for success? "UC Davis is preparing me for success by pushing me out of my comfort zone. I was a lot more closed off and shy when I came to college, but over my time here I've found lifetime friends and had so many unforgettable, wonderful experiences." Where have you found community and support on campus?"Mainly I've been involved with the tour program since coming here. When I went on my own tour of UC Davis senior year of college, I instantly knew I wanted to be a tour guide. Through this program, I've found some of the most wonderful people I've ever met, while learning more than I could've possibly imagined about my college campus." What would you tell prospective students about UC Davis?"UC Davis is a wonderful place to be, I have no doubt that anyone who comes here can find their best friends for life. You just have to get out there and find them! Your college experience is what you make it, so make it great!" What do you like about academics and student life here?"I love how supportive and collaborative we are, it's super easy to find people in your classes to study with and get help with any questions you have!"'''
