full_description = 'Elyse WohlenbergPronouns: she/her/hersMajor: Environmental science and management Minor: Human rightsWhere have you found community and support on campus?"I have worked with the Learning by Leading program through the arboretum, various research labs and the UC Davis student farm. I have found my community in some way with every place I have worked by meeting others with similar interests or career goals."What would you tell prospective students about UC Davis?"I would say to make the most of your time while you are here! We have an endless list of clubs, events, resources and so on that are here for you as a student. Take advantage of the amazing opportunities you are offered and enjoy the beautiful campus too!"Why did you choose UC Davis?"UC Davis had been my top school for years before I applied because of the amazing environmental science program and great academic reputation." What do you like about academics and student life here?"I love the supportive aspect of academics and how everyone genuinely wants everyone to succeed. It is very easy to make friends, study groups or branch out in some regard no matter the program you are a part of."'
