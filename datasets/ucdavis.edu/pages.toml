full_description = '''Rankings Breadcrumb UC Davis About Us Rankings Administration Diversity and Inclusion Rankings Locations Sustainability Visit UC Davis UC Davis Health Student Safety A top tier public university UC Davis is a tier one research university. Several of our programs are among the best in the country and have been for decades. We hope you will help us continue this legacy and solve some of the world’s greatest challenges. View our admission statistics More about UC Davis Image Our rankings Ranked 1st in the nation in agriculture and forestry Ranked 1st in the nation in veterinary medicine Ranked 3rd public university in the nation for graduate financial success Ranked 9th nationally among public universities Ranked 1st in the nation for campus sustainability Ranked 1st in the nation for diversity, inclusiveness and internationalization Ranked 12th among the top 100 producers of minority bachelor's degrees Ranked 2nd in top public university performers on social mobility Ranked 8th best public school for making an impact Ranked 11th best university in America, by value Named a Forbes "Best Employer for Diversity" and "Best Employer for Women" How we rank UC Davis is highly ranked in the nation and the world, according to influential university ranking publications like U.S. News & World Report (national and global), QS World University Rankings, the Times Higher Education World University Rankings and The Princeton Review. The Wall Street Journal recognized UC Davis as the fifth-best public university in the United States in its 2022 Wall Street Journal/Times Higher Education College Rankings. Washington Monthly magazine ranked UC Davis second nationally among Affordable Elite Colleges in 2019. World’s No. 2 in veterinary science QS World University Rankings by Subject 2022 2nd nationally in ecology and evolutionary biology U.S. News & World Report’s 2022 “America’s Best Graduate Schools” 3rd nationally in biological and agricultural engineering U.S.