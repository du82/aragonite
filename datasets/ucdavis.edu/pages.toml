["http://ucdavis.edu/about"]
title = "About Us | UC Davis"
description = "UC Davis was founded in 1908 to serve the state of California. We do and we always will. And today, the seed that was planted those years ago has grown into one of the world’s top universities. See our rankings."
full_description = "About Us Breadcrumb UC Davis About Us Administration Diversity and Inclusion Rankings Locations Sustainability Visit UC Davis UC Davis Health Student Safety We grow California UC Davis was founded in 1908 to serve the state of California. We do and we always will. And today, the seed that was planted those years ago has grown into one of the world’s top universities. See our rankings Aggie Tip Sheet Image UC Davis at a glance 38,347 students 107 academic majors 6 professional schools 625 beds in teaching hospital 101 graduate degrees 21:1 student to faculty ratio Image What sets UC Davis apart? Our talented students are more likely to collaborate than compete. This friendly approach has led to an incredibly rich campus community that turns big ideas into real solutions. UC Davis research Custom Image Undergraduate research Custom Image College town atmosphere Custom Image Teamwork and humility Custom Image Flexible majors Custom Image Sustainability Quick facts Received over $1 billion in research funding in 2021-22 UC Davis Health serves 30,000 patients a year and handles nearly 1 million visits On any given day, there are over 22,000 bikes on our campus Our athletics name is “The Aggies” — a reference to our agricultural beginnings 50% of our undergraduate students conduct research and creative projects beyond the classroom Boundless academics World-class research UC Davis is a tier-one research university. Discoveries made by our students and faculty continue to improve the lives of people here in California and around the world. Explore our research A school for every interest In addition to our undergraduate and graduate study opportunities, we have professional schools in medicine, law, business, veterinary medicine, nursing and education. See our professional schools Study abroad Through the Global Learning Hub, students can find global learning opportunities available on campus, in the region, and across all seven continents. Find opportunities Bodega Bay Marine Lab Bodega Marine Laboratory (BML) is a leader in multidisciplinary research aimed at solving complex environmental problems in coastal ecosystems. Learn about the lab Tahoe Environmental Research Center (TERC) TERC is internationally recognized for its multidisciplinary, collaborative research on lakes and their surrounding watersheds. Explore TERC Faculty mentors UC Davis Graduate Studies supports and advances graduate faculty-student mentoring through a variety of efforts, such as the Distinguished Graduate and Distinguished Postdoctoral Scholar Mentoring Awards. Meet our mentors Land Acknowledgment We should take a moment to acknowledge the land on which UC Davis is located. For thousands of years, this land has been the home of Patwin people. Today, there are three federally recognized Patwin tribes: Cachil DeHe Band of Wintun Indians of the Colusa Indian Community, Kletsel Dehe Wintun Nation, and Yocha Dehe Wintun Nation. The Patwin people have remained committed to the stewardship of this land over many centuries. It has been cherished and protected, as elders have instructed the young through generations. We are honored and grateful to be here today on their traditional lands. Learn more about Land Acknowledgment UC Davis history We first opened our doors in 1908 as the University Farm, the research and science-based instruction extension of UC Berkeley. As the century evolved, our mission expanded beyond agriculture to match a larger understanding of how we should be serving the public. 1909: After University Farm School opens in January with 18 students, more than 2,200 people attend the first Picnic Day in May. 1916: Animals from the University Farm herd sweep championships at the Chicago International Livestock Show. 1938: The campus is renamed the College of Agriculture at Davis. One hundred and six courses are taught by 76 faculty. 1940: The Division of Chemistry acquires the first patents for the entire University of California. 1959: The regents designate UC Davis and UC Riverside general campuses. 1969: Begun as an “art happening”, the Whole Earth Festival attracts 30,000 folks for eclectic music, henna tattoos, vegan food and regional crafts. 1975: The veterinary school is ranked first in the nation by a national survey of deans. 1990: The football team wins its 20th consecutive league championship, a national record. 2018: UC Davis scientists unveil images from the world’s first total body scanner. Feeding a Growing Population Connecting our research and expertise to the effort to feed a growing population under a changing climate. Image Science & Climate UC Davis is applying its collective strengths in science, engineering, art and design to the problem of climate change and a warming planet. Image Advancing Health Worldwide Advancing the study of medicine as a worldwide leader in human health and veterinary sciences. Image Driven by Curiosity Answering foundational questions about our world, showcasing research that transcends science, technology, arts and humanities, and social sciences. Image"
author = "Tristan Peery"
year_published = 2020
year_updated = 2024
