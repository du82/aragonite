["http://ucdavis.edu/about/locations/unique-to-uc-davis"]
title = "Unique to UC Davis | UC Davis"
description = "As you enter our campus, you’ll pass our vineyard. Go farther, and you’ll see our arboretum and its creek shaded by native and international trees and plants. You might pass our student farm and gardens, cows and horses, several museums, food trucks, hammocks and quirky sculptures. Bikes whiz by the tree-lined trails. UC Davis is like no place else."
full_description = "Unique to UC Davis Watch more UC Davis is a special place As you enter our campus, you’ll pass our vineyard. Go farther, and you’ll see our arboretum and its creek shaded by native and international trees and plants. You might pass our student farm and gardens, cows and horses, several museums, food trucks, hammocks and quirky sculptures. Bikes whiz by the tree-lined trails. UC Davis is like no place else. The Davis difference California’s college town Image Find yourself at UC Davis UC Davis is known for its elite academics and thriving campus life, but there is even more to the story. We do things a little differently here and love that every new Aggie that is added to our community has a something special to add to it. UC Davis traditions Custom Image Unique Areas of Study Custom Image Supportive programs Custom Image The Davis difference Custom Image Blockbuster events Custom Image Bike City U.S.A. Unique Davis facts The City of Davis was the first city to create bike lanes. With over 125,000 attendees, Picnic Day is the largest student-run event in the country. Along with wine and beer-making programs, UC Davis offers classes in coffee brewing as well. UC Davis has its own airport where students can learn to take to the sky. UC Davis’ supportive programs include “Fluffy Therapy” during finals week. Locations UC Davis has locations all across Northern California. Image California’s College Town The City of Davis was made for Aggies. Image In the middle of everywhere UC Davis is a day trip away from some of the world's best attractions. Image Picture UC Davis The Memorial Union at UC Davis provides students with several places to eat and study, an information center, resources for food insecurity, a book store, a Veterans Success Center and much more. There are many places in the Arboretum to study, relax or just take in the view. The Silo offers many options for food including food trucks, Peet’s Coffee and the newly opened Silo Market. The Activities and Recreation Center is a 150,000 square foot destination full of ways to stay active. One of the great UC Davis traditions is the Running of the First-years, where new Aggies run into UC Davis Health Stadium together to show their spirit. The UC Davis Recreation Pool is open all Spring and is a great chance to get out in the sun. Students like Akira Hood get first hand experience at the Sheep Barn, where she can apply her skills as an Animal Science major. The Manetti Shrem Museum offers students and the public a place to admire famous artworks, listen to unique speakers, attend a class or just sit and soak in the creativity. Picnic Day is a family-friendly event offered each spring where you can experience the richness of diversity and achievement at UC Davis, as well as the surrounding community in areas of research, teaching, service and campus life. The Quad is a perfect spot on campus to take a nap, hang out with friends or get some studying done as you enjoy the weather and the surroundings. Hammocks lining the Quad offer students a place to take a nap or just unwind after a busy day. During homecoming week students have the chance to hitch a ride on a horse drawn carriage! Greek life at UC Davis offers many opportunities to expand your social horizons. UC Davis has a multitude of comfortable and quiet study lounges throughout campus. UC Davis loves school spirit. We have many traditions that allow our students to show their Aggie Pride!"
author = "Tristan Peery"
year_published = 2021
year_updated = 2022
