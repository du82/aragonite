["https://ucdavis.edu/about/visit/tour-guides/ava-hutchins"]
title = "Ava Hutchins | UC Davis"
description = "Ava HutchinsMajor: Cognitive science and philosophyHow do you feel UC Davis is helping you grow and preparing you for success?"
full_description = '''Ava HutchinsMajor: Cognitive science and philosophyHow do you feel UC Davis is helping you grow and preparing you for success? "The variety of resources from advisors have helped me feel comfortable with the uncertainty of post-undergrad life, and have given me confidence in pursuing a path to medical school. The professors and their support have shown me that grades in classes don't define your worth and that learning isn't always a straightforward path for everyone." Where have you found community and support on campus?"Besides being a tour guide, I'm a research assistant in a neuroscience lab, I tutor for General Psychology classes and I rock climb. I've found many friends through these communities on campus and they've taught me invaluable skills." Why did you choose UC Davis?"I chose Davis for its friendly student atmosphere and for the variety of resources available for undergraduates." What do you like about academics and student life here?"I appreciate that UC Davis has a blend of rigorous academics with a supportive student life. The student life at Davis encourages you to be competitive with yourself (be the best version of yourself) rather than competitive with each other. The professors are also enthusiastic about their classes and research, and are more than happy to chat with you outside of class."'''
