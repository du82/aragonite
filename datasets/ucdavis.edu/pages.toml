title = "UC Davis | California's College Town"
description = "UC Davis innovates to address the world’s most challenging problems and educates tomorrow’s leaders."
full_description = "UC Davis How Research Funding Solves Real-World Problems From Labs to Lives Majors Admissions Cost Campus life VISIT Apply California's College Town Davis is the ultimate college town. It’s green, laid back and friendly. You can walk or bike from the main campus to the main street in a few blocks. College students fill up the tables at nearby restaurants and coffee shops with their laptops, homework and friends. The town of Davis helps our students thrive. 360 Virtual Tour About us Image Main Campus Davis, California Bodega Marine Lab Bodega Bay, California UC Davis Health Sacramento, California Tahoe Environmental Research Center Incline Village, Nevada Redwoods NP Lassen Volcanic NP Lake Tahoe Sacramento San Francisco Silicon Valley Yosemite NP Sequoia NP In the middle of everywhere UC Davis is centrally located in Northern California. We’re a day trip away from some of the most beautiful places in the world. Explore the region A top-tier public university Ranked 1st in the nation in agriculture and forestry Ranked 1st in the nation in veterinary medicine Ranked 3rd public university in the nation for graduate financial success Ranked 9th nationally among public universities More rankings Image Unrivaled student experience UC Davis has all the opportunities you’d expect from a large public university — and a lot of experiences that will surprise you. California’s college town Custom Image Housing Custom Image Dining and Food Custom Image City of Davis Custom Image Athletics Campus facts With roughly 55 miles of bike and pedestrian paths, Davis is easy to get around. Like the invention of the full-body scanner, UC Davis has led the way with innovative discoveries for more than half a century. 700+ students present their research at our annual Undergraduate Research, Scholarship and Creative Activities Conference. Unique to UC Davis Learn to brew beer! That’s right, you can learn the art of liquid bread! UC Davis has an entry level brewing class and even a Master’s in Brewing Science available. More unique programs Take a study break with a puppy! During finals week students can take a break and pet some adorable fluffy friends at the MU. More unique traditions Make a gift to UC Davis Join the Alumni Association Student safety Parent information Trending now Custom Image 7 Fun Things to Do Outside of Davis ‘Face to Face’: Davis Students Launch Seizure-Prediction Startup February 25, 2025 Connections Are Central at Black Futures Kickoff February 14, 2025 Killing H5N1 in Waste Milk — An Alternative To Pasteurization February 13, 2025 Record Number Apply for Undergraduate Studies at UC Davis February 12, 2025 UC Davis First University To Earn Silver SEA Change Award for Diversity, Equity and Inclusion February 07, 2025 Follow us"
