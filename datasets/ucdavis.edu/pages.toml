["http://ucdavis.edu/about/visit/tour-guides"]
title = "Tour Guides | UC Davis"
description = "Hear what it’s like to be a UC Davis Aggie from one of our student tour guides! They will show you why they chose UC Davis and what makes our campus so special."
full_description = '''Meet our campus tour guidesLearn what life as an Aggie is all about from our enthusiastic UC Davis student tour guides! Plan your visit to campus and connect with a tour guide in real-time. See our events page and find more opportunities to engage, like our guided virtual tours.Student Ambassador Chairs Megan Wallace Pronouns: she/theyMajor: Managerial economics, communicationsHow do you feel UC Davis is helping you grow and preparing you for success? "UC Davis has a plethora of resources and opportunities for professional development. Coursework has prepared me well and my professors always support my endeavors. On-campus jobs have primed me even more, giving me options for exploration and upward movement within a department." Raynisha Fields Pronouns: she/her/hersMajor: Environmental policy analysis and planningMinor: CommunicationsWhere have you found community and support on campus? "Something cool I’ve been a part of was the Taekwondo Sports club! I not only was in the club, but was even a part of the board, which was a very fun and enriching experience!" Student Ambassador Council Aidan Hymel Pronouns: he/him/hisMajor: Cognitive science with a neuroscience emphasisMinor: Public healthHow do you feel UC Davis is helping you grow and preparing you for success? "Besides the obvious of getting an amazing education from world-renowned researchers and professors, I feel as if UC Davis does a great job of teaching a lot of other essential skills. By having access to so many amazing resources and services around our campus, we learn how to utilize and maximize these resources, find a voice for ourselves and ultimately our passion to succeed in our next chapter, whatever that may be." Ava Hutchins Major: Cognitive science and philosophyWhat would you tell prospective students about UC Davis? "Take advantage of all the resources Davis has to offer, that being student clubs and advising organizations. I've found some of my best friends through a climbing club here on campus, and I never would've befriended them had I not pushed myself out of my comfort zone and joined the club." Bianca Pahler Pronouns: she/her/hersMajor: Environmental science and management and economics Where have you found community and support on campus? "I have been involved with the club softball team since my freshman year and have found leadership positions such as publicity and president. This team gave me friendships with girls from all grades while practicing and having fun playing the sport. I am also on staff for the Whole Earth Festival creating a three-day zero festival on campus. I have also done environmental research both on campus and at Cache Creek Conservancy. I've strengthened my teamwork, communication and empathy working with the people in my activities." Cameron Green Pronouns: she/her/hersMajor: Animal scienceWhat do you like about academics and student life here? "I love that we have rigorous academic programs without a competitive atmosphere. Classes are challenging but all my professors have been incredibly approachable and have encouraged questions and feedback from their students. Student life is also incredibly supportive. I have found no shortage of support inside and outside the classroom, from forming study groups with my classmates to running into a friendly face downtown." Elise Hernandez Pronouns: she/her/hersMajor: DesignMinor: Gender, sexuality and women's studiesHow do you feel UC Davis is helping you grow and preparing you for success? "As a fourth year, looking towards life after graduation is daunting. But in my classes my professors demonstrate not only care and passion for their material, but also recognize the significance of their coursework for students. In this, professors provide us with projects, opportunities and knowledge that directly prepare us for the future. Because of this, I feel UC Davis is providing me with real life skills and through this preparing me for success." Ellie Kwon Pronouns: she/her/hersMajor: Psychology with a biological emphasis Minor: Asian American studiesWhere have you found community and support on campus? "I have been a tour guide since my freshman year. During that time, I joined the Fiber Arts Club and also the Aggie Hurricane Skate Club where I roller skate! Last summer, I worked as a Camp Counselor for the UC Davis Youth Programs and had such a blast. This year, I joined the Yellow Cluster Advising team as a peer advisor, helping students with scheduling and answering their questions about their major." Elyse Wohlenberg Pronouns: she/her/hersMajor: Environmental science and management Minor: Human rightsHow do you feel UC Davis is helping you grow and preparing you for success? "UC Davis has an outstanding support system for students to receive guidance on everything from class selection to job searches and graduate school. I have always felt like it is very easy to speak with mentors or advisors to strengthen skills I will use far past my time at UC Davis such as interviewing or resume writing." Esin Demiray Pronouns: she/her/hersMajor: Neurobiology, physiology and behaviorWhat do you like about academics and student life here? "I appreciate that at UC Davis, you are not only receiving a world-class education but are also encouraged to pursue professional opportunities at the undergraduate level. I've gotten to work with graduate students and Clinical Research Coordinators at the medical school as soon as my first year!" Heidi Aleman Jimenez Pronouns: she/her/ella Major: Psychology Minor: NeuroscienceHow do you feel UC Davis is helping you grow and preparing you for success? "I feel like UC Davis is preparing me for success through on campus jobs, volunteering opportunities and career fairs that take place on campus. I’ve been able to gain a lot of leadership and communication skills through this job and other organizations I was previously a part of. I have also attended some professional and academic workshops at the Career Center which were super helpful!" Lauren Sirmons Pronouns: she/her/hersMajor: Biochemistry and molecular biology Minor: Forensic entomologyHow do you feel UC Davis is helping you grow and preparing you for success? "Especially in my STEM classes, the curriculum is constantly evolving with the changes in the science world to make sure students are learning both modern day methods and technologies." Madelyn Parker Pronouns: she/her/hersMajor: Human developmentWhy did you choose UC Davis? "I chose UC Davis for many reasons: I like the closeness to my family (who live in Sacramento County), while still having the independence of living away from home. Upon touring here, the tight knit community of Davis also stood out to me, and I desperately wanted to be a part of it. UC Davis has turned out to be the perfect place for me!" Miguel Moran Pronouns: he/him/hisMajor: Landscape architecture Minor: Chicana/o studiesWhere have you found community and support on campus? "I've been working at the arboretum since my first quarter here at Davis! I started off as an intern for the Sustainable Horticulture Team and then worked as the internship co-coordinator my second and third year. I'm currently a horticulture apprentice at the arboretum, and spend weekdays gardening and doing maintenance around campus. I found my community at the arboretum, but also got a lot of support from the landscape architecture department. I genuinely am so thankful for the friends I've made in my department and am so glad to have them by my side when I spend late nights working in the studio." Olivia Westall Major: Chemical engineeringWhat would you tell prospective students about UC Davis? "I would say that UC Davis can seem like a really large university but that it can be as small as you want! They have the resources of a large, public university but enough opportunities and niches on campus that you can find your people. I would also say that the university also tends to attract individuals (students as well as faculty) that build a village. I have always felt supported when I was going through both highs and lows. I always had people to turn to if I needed help and also that would celebrate with me when I had a personal victory." Riti Prasanna Pronouns: she/theyMajor: Molecular and medical microbiology How do you feel UC Davis is helping you grow and preparing you for success? "We have a lot of different resources that I have used to help me succeed and thrive academically and professionally! I love the Career Center and the Academic Assistance and Tutoring Center as they have really helped me learn tips and tricks that I can use for other parts of my life like work and social aspects!" Teresa Yubeta Pronouns: she/her/hersMajor: Landscape architectureWhat would you tell prospective students about UC Davis? "UC Davis has the home away from home feeling! Finding community is as easy as introducing yourself to the person sitting next to you in class. Between classes, clubs, organizations, recreation, sport opportunities and campus events students find an amazing community as they get their degrees." Thomas Kao Major: History Minors: English, education, East Asian studiesWhere have you found community and support on campus? "The creative writers and bookworms of Davis; both student and heartwarming downtown university emeritus are the kindest people on this green earth. Used book sales at the library, poetry fundraisers at the gallery, slam readings at the Mondavi and bustling book clubs by Olson: are nothing but a blast to attend and staff."'''
author = "Max Boyd"
year_published = 2021
year_updated = 2025
