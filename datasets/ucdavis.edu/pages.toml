["https://ucdavis.edu/about/visit/campus-tour"]
title = "Campus Tour | UC Davis"
description = "Visiting campus is one of the best ways to find out if you'll be happy pursuing your degree at UC Davis. We invite you and your family to take a campus walking tour with one of our engaging student tour guides. You will get a glimpse of student life, hear about our academic excellence, student services, organizations, clubs, as well as research and internship opportunities and see what makes UC Davis unique among college campuses."
