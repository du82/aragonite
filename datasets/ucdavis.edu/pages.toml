full_description = 'Riti PrasannaPronouns: she/theyMajor: Molecular and medical microbiology Where have you found community and support on campus?"I am the music director of an acapella group here on campus and I have loved being part of that group for the past 4 years! They really have become my best friends and I am very grateful to have such a supportive group of people in my life! I often find support in my workplaces as well, as all of my coworkers and supervisors want to see the best for me and I want to see that for them as well!"What would you tell prospective students about UC Davis?"UC Davis has truly become my home away from home! I absolutely adore the campus and the town and I love the sense of community here as well! There is truly something for everyone here and we are all here to support one another." Why did you choose UC Davis?"I chose UC Davis because I really loved how the campus had a cozy feeling to it and the amount of opportunities I have access to! I learned a lot about many different organizations and clubs on campus that would help me for my plans for the future and I really appreciated how accessible all this information was as an admitted student!"What do you like about academics and student life here?"I really love how supportive everyone is of each other! Whether it be professors, teaching assistants, or other students, everyone just wants to see each other succeed and I have never felt unsupported here!"'
