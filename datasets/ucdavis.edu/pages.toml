full_description = "Jobs Breadcrumb Home About Us Jobs Staff jobs As a top-ranked research university, and the second-largest employer in the region, UC Davis has a community of employees who are leading the way in teaching, research, public service and patient care. Search Jobs More about working here Image Clinician and health staff jobs In addition to the intellectual and cultural advantages of being a member of UC Davis Health, employees have the distinction of being part of one of the largest and most acclaimed institutions in higher education, the University of California. Search Jobs More about working here Image Academic jobs Teach the next generation of leaders. Research the next breakthrough innovation that makes a real impact on our society. Do it all at UC Davis. Search jobs More about working here Image Student jobs We want to make sure your college jobs and internships help you develop your career goals and prepare you for the profession you want. Search jobs Image Employment resources Internship and Career Center The Internship and Career Center has advisors ready to meet with you to talk about your career goals. They can help you edit your resume and find an internship. Visit the ICC Employment benefits At UC Davis, we strive to create an environment where individuals can be problem solvers, risk takers and restless pioneers. By offering competitive benefits and rewards, our employees can continue to do their best work. Our benefits packages Moving to Davis As a new UC Davis employee, you might be eligible for some relocation assistance in the form of reimbursements and employment opportunities for your spouse/partner. California’s college town Professional development Education is at the heart of UC Davis, not only for students, but also for employees. We don’t just want you to work for a higher education and research institution, we want you to experience it too. See the classes Partner Opportunities Program Our Partner Opportunities Program (POP) 