["https://ucdavis.edu/about/locations/middle-of-everywhere/wine-country-day-trips"]
title = "Wine country day trips | UC Davis"
description = "UC Davis is one of the world authorities in winemaking, and we helped to establish wine country in Northern California. We are surrounded by some of the best vineyards on earth. In under an hour, you can drive to Napa Valley, Mendocino County or the Sierra Nevada foothills."
full_description = "Wine country day trips Breadcrumb UC Davis About Us Locations In the Middle of Everywhere Wine country day trips We built wine country UC Davis is one of the world authorities in winemaking, and we helped to establish wine country in Northern California. We are surrounded by some of the best vineyards on earth. In under an hour, you can drive to Napa Valley, Mendocino County or the Sierra Nevada foothills. Department of Viticulture and Enology Napa Valley The world renowned Napa Valley is only a forty-five minute drive from campus. Image Sonoma Valley West of Napa, Sonoma County produces more wine than any other area in the state. Image Mendocino County In unspoiled coastal country, Mendocino offers a uniquely laidback wine country with amazing food. Image Gold Country A quick drive southeast of Davis takes you to the charming wine country of the Sierra Nevada foothills. Image Lodi A quick drive south of Davis takes you to the emerging wine region of Lodi. Image Clarksburg The crowds are smaller, and the scenery and the wine quality matches some of the world’s top wineries. Image"
