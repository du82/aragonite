full_description = "Plan your visit Breadcrumb UC Davis About Us Visit UC Davis Plan your visit Come for campus, stay for fun The UC Davis campus is a destination in its own right with a 100-acre arboretum and multiple museums. After a campus tour, get to know the town of Davis through its walkable downtown and delicious restaurants. Visit the Welcome Center Getting here Directions and parking Image Where to stay Image Downtown Davis Image What to eat Restaurants in Davis Image Food on campus Image Farmers’ market Image Image Campus attractions At UC Davis, you can walk through our campus gardens, discover art and insects at our museums, and stock up on Aggie gear at the UC Davis Stores. Things to do here Custom Image Manetti Shrem Museum of Art Custom Image Bohart Museum of Entomology Custom Image C.N.Gorman Museum Custom Image UC Davis Arboretum Custom Image Häagen-Dazs Honey Bee Haven Custom Image UC Davis Stores Unique Davis facts The city of Davis is the first city to create bike lanes. With over 125,000 attendees, Picnic Day is the largest student-run event in the country. Along with wine and beer-making programs, UC Davis offers classes in coffee brewing as well. UC Davis has its own airport where our students can learn to take to the sky! See sustainable landscaping by our own campus sheep."
