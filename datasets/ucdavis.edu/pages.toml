["https://ucdavis.edu/about/visit/tour-guides/lauren-sirmons"]
title = "Lauren Sirmons | UC Davis"
description = "Lauren SirmonsPronouns: she/her/hersMajor: Biochemistry and molecular biology"
full_description = 'Lauren SirmonsPronouns: she/her/hersMajor: Biochemistry and molecular biology Minor: Forensic entomologyWhere have you found community and support on campus?"IM soccer and volleyball, research, research, peer tutoring, tennis club, internships and more! Through the many events and activities, it is very easy to be able to find your community and place on campus to get support whether it be in your classes, through clubs, research or even all the fun musical events we have here on campus, there is always a place for every student and I definitely have always felt welcome and supported in everything I did and continue to do here at UC Davis!"What would you tell prospective students about UC Davis?"To have fun and find a way to balance both academics and personal life because it is very achievable here at UC Davis!" Why did you choose UC Davis?"It was my dream school ever since I was a little girl!"What do you like about academics and student life here?"I like how friendly everyone is and is willing to help! There are so many amazing resources that are available to students to help them succeed!"'
