["https://ucdavis.edu/about/visit/tour-guides/thomas-kao"]
title = "Thomas Kao | UC Davis"
description = "Thomas KaoMajor: History Minors: English, education, East Asian studies"
full_description = '''Thomas KaoMajor: History Minors: English, education, East Asian studiesHow do you feel UC Davis is helping you grow and preparing you for success? "Through the specialized history honors program, I am tackling graduate and professional level papers and research, giving me a taste of what it’s like to be a historian. It’s honestly still surreal that my professor is my private mentor and co-writer." What would you tell prospective students about UC Davis?"When choosing where you will find your next years of educational growth, don’t forget the importance of the environment and ecosystem of students that surround your studies. There’s a miraculous charm and comforting work ethic that grows out of the quiet, leafy and breathing small town of Davis."Why did you choose UC Davis?"Excellency, well-roundedness and challenging work, in the cutest and sweetest small town I’ve ever had the chance to roll my bike wheels onto. Cats, ice cream and turkey were an added bonus."What do you like about academics and student life here?"Not a single student nor faculty member has ever once pushed me below or sprouted a feeling of incompetence. Us Aggies are all climbers, and we are scaling the same cliff (quite literally at the gym), and the community we've built over the last 100 years is one of comfort, teamwork and pure joy."'''
author = "Derrick Anthony Phipps"
