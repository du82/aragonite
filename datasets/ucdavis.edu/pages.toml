["http://ucdavis.edu/about/locations/transportation"]
title = "Transportation | UC Davis"
description = "Bikes, trains, planes and automobiles Imagine almost 38,000-plus students, faculty, staff and visitors at UC Davis on the main Davis campus on any given weekday — and 85 percent of them travel here from off-campus. What’s their transport of choice? By the numbers On an average weekday, here’s how people get to UC Davis:"
full_description = "Bikes, trains, planes and automobiles Imagine almost 38,000-plus students, faculty, staff and visitors at UC Davis on the main Davis campus on any given weekday — and 85 percent of them travel here from off-campus. What’s their transport of choice? By the numbers On an average weekday, here’s how people get to UC Davis: 37 percent bike 30 percent drive alone 19 percent ride the bus 8 percent walk or skate 5 percent carpool 1 percent rides Amtrak We know the answer! Bikes, feet, skates, cars, buses, trains — and the very occasional airplane. More than a third of those UC Davis commuters pedal to campus. Bikes rule (and rules for bikes) Once cyclists enter the largest campus in the University California system, our bike paths make it fast and efficient to get from class to laboratory to a workout at the Activities and Recreation Center. Newcomers can learn about bicycle education and advice on the Transportation and Parking Services website so they will know the rules of the road. Safe cycling is one of many great reasons to join our bicycling community. The campus’s preference for two wheels has helped the city of Davis earn its “Bicycle Capital of the U.S.” claim. UC Davis has also been named a platinum-level bicycle friendly university by the League of American Bicyclists. Both the campus and city promote this “cyclist-friendly” environment. Transportation and Parking Services and the Police Department are important partners for bicyclists, ensuring that riders, pedestrians, and drivers have a safe and enjoyable experience in their travel. Many services for bicyclists TAPS offers a number of services for bicyclists. Bike parking, including bike lockers at four campus locations, can be found throughout the campus. We also have showers for commuters and bike-lock cutting services. The campus maintains bike stations for adding air to tires and making simple repairs. Our Bike Barn, located next to The Silo on central campus, is a full-service repair shop — and that’s where you can rent bikes if you need temporary wheels. The auto option With nearly a third of commuters coming by car, you would expect that the campus is prepared for automobiles. And we are, with parking facilities strategically placed throughout the campus. Drivers can arrange for parking permits through TAPS. We also offer complimentary motorist assistance for anyone coming to campus: Lockout service Tire inflation Ride to a gas station A battery jump start"
author = "Josh Staab"
year_published = 2021
year_updated = 2021
clearnet = "http://ucdavis.edu/about/locations/transportation"
