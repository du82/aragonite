title = "Sustainability | UC Davis"
description = "UC Davis is a global leader in sustainability and climate change research — on campus, in the classroom and abroad. From the arboretum to the numerous farms and green houses located throughout campus, our university is a living laboratory dedicated to developing, testing and providing solutions to address the world’s most pressing issues."
full_description = "Committed to growing a green campus UC Davis is a global leader in sustainability and climate change research — on campus, in the classroom and abroad. From the arboretum to the numerous farms and green houses located throughout campus, our university is a living laboratory dedicated to developing, testing and providing solutions to address the world’s most pressing issues. UC Davis supports the U.N.'s 17 Sustainable Development Goals An ambitious set of 17 global goals, the Sustainable Development Goals (SDGs) were adopted by all UN member states in 2015, laying out a framework to end poverty, rescue the planet and build a peaceful world, while calling for all sectors of society to achieve these goals by 2030. UC Davis students, faculty and staff are already addressing all 17 UN SDGs in the U.S. and across more than 80 countries around the world. To support these goals and our university’s role as a public, land-grant institution, UC Davis completed a campus-wide SDG Voluntary University Review (VUR) in 2021. UC Davis’ Global Affairs, Sustainability, and Diversity, Equity and Inclusion offices spearheaded this effort. More about our sustainability goals Majors in sustainability Sustainability issues are covered throughout the UC Davis curriculum. Please check the course catalog for class schedules and offerings. Agriculture and Environmental Education Create sustainable agricultural and environmental systems. Learn the concepts of natural and social science. Get real-world activities and hands-on training for those interested in careers that blend social and natural sciences in agricultural and environmental industries. Design Follow a variety of career paths upon graduation: Some go directly into further graduate study. Others obtain design positions in different fields including visual communications, interiors, fashion, textiles, exhibition, and product and sustainable design. Environmental Policy Analysis and Planning UC Davis environmental policy analysis and planning graduates work in all levels of government and public agencies concerned with air and water quality management, environmental planning and consulting firms. This is also an excellent major for students planning to enter law school. Environmental Toxicology Discover a broad range of courses and topics with career outcomes in high-demand law offices, organizations and governmental agencies. Many environmental toxicology graduates go into medical, pharmacological, public health and forensic science fields. Sustainable Environmental Design Gain skills in urban and environmental design, local government planning and green building. Graduates often pursue careers in city and regional planning, landscape architecture and urban development policy. More Classes in Sustainability What to Do with a Major in Sustainability"
author = "Josh Staab"
year_published = 2021
year_updated = 2023
