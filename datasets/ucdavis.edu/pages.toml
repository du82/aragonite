["https://ucdavis.edu/about/visit/tour-guides/olivia-westall"]
title = "Olivia Westall | UC Davis"
description = "Olivia WestallMajor: Chemical engineering How do you feel UC Davis is helping you grow and preparing you for success?"
full_description = 'Olivia WestallMajor: Chemical engineering How do you feel UC Davis is helping you grow and preparing you for success? "I feel that UC Davis is preparing me for success through comprehensive classes. The chemical engineering curriculum does a good job of balancing technical material with soft skills and real-world simulation activities that will serve me well when I get into the working world."Where have you found community and support on campus?"I am a part of Project Catalyst, a volunteer organization that goes to Davis and Woodland elementary schools to do science experiments with kids and talk to them about science as well as higher education in general. I am also a part of the American Institute of Chemical Engineers which is a professional society that connects current chemical engineers with other students, faculty, and industry officials. They also host lots of student social events. Lastly I have previously been a part of the club ski and snowboard team. I would say that I found my greatest sense of community through my orientation group (it’s where I met my best friend) and in my smaller classes."Why did you choose UC Davis?"I chose UC Davis for two primary reasons. It has an amazing engineering program that has a well-established reputation and network in industry. I also loved the location. Having a small town was really important to me, but it’s not far from major cities for recreation and internships and jobs!"What do you like about academics and student life here?"My favorite part about academics and student life at Davis is how collaborative everything is. There is not a sense of competition in classes, clubs, or social activities; it is much more welcoming and friendly. Teachers are very accessible and take a great interest in making sure their students succeed."'
