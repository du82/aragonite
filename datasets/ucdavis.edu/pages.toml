["https://ucdavis.edu/about/visit/directions-parking"]
title = "Directions and Parking | UC Davis"
description = "Planning to visit UC Davis? We welcome you! Use these directions and parking information to arrive at the UC Davis Welcome Center safely and without hassle."
full_description = "Where is UC Davis? Our main campus borders the Northern California city of Davis. We’re also located in Sacramento, the state capital, where UC Davis Health is headquartered. UC Davis Welcome Center Planning to visit UC Davis? Please use the directions and parking information below to arrive at the UC Davis Welcome Center. If you’d like to use your GPS, enter 550 Alumni Lane, Davis, CA 95616 as your destination or use our Google Map link. Parking at UC Davis A valid UC Davis permit is required to park on campus. UC Davis uses AggiePark, an app that allows drivers to conduct parking permit transactions from their mobile devices. Visit UC Davis Transportation Services for daily visitor rates. Visitors with a disabled placard/plate may park without displaying an additional permit, and may park in spaces where UC Davis DSA permits are honored. Disabled placards/plates are not valid in restricted spaces (such as 1 hour A permit spaces), loading zones, red zones, center core and reserved areas. We encourage you to wear walking shoes and bring a water bottle to take advantage of filtered drinking water available at hydration stations throughout campus. Parking locations"
author = "Josh Staab"
