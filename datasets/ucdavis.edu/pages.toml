["http://ucdavis.edu/about/jobs/benefits"]
title = "Benefits | UC Davis"
description = "Perks of working at UC Davis UC Davis was named one of America’s best large employers by Forbes in 2023 for the tenth year in a row. The university has been honored for our range of employee benefits, including extras and work-life initiatives that go beyond salary to create a positive work environment. Here’s why you should work for UC Davis: Health care For most employees working 50 percent or more time, you’re offered:"
full_description = "Perks of working at UC Davis UC Davis was named one of America’s best large employers by Forbes in 2023 for the tenth year in a row. The university has been honored for our range of employee benefits, including extras and work-life initiatives that go beyond salary to create a positive work environment. Here’s why you should work for UC Davis: Health care For most employees working 50 percent or more time, you’re offered: Medical and behavioral health Choice of options depending on your address, including HMO, PPO or PPO with a health savings account. You may enroll your spouse, domestic partner, children and grandchildren (biological or adopted, stepchildren, domestic partner’s children) and legal ward. Vision The UC Davis plan covers many vision care services, including eye exams, corrective lenses and frames. Dental The UC Davis plan offers coverage through a PPO or HMO. Both options cover preventative, basic and prosthetic dentistry, and orthodontics. Time off For most employees working 50 percent or more time, you’re offered: Paid sick leave. 12 days per calendar year. Paid holidays. 13 days per calendar year. Paid vacation. Starting at 15 and reaching 24 days per calendar year. The amount you accrue depends on the number of your monthly working hours. Retirement The UC retirement plan is a comprehensive array of retirement benefits, savings programs and educational and counseling resources. It also offers additional, convenient ways to save beyond the program, including tax-deferred 403(b), 457(b) Deferred Compensation Plan and Defined Contribution Plan. More Information Human Resources Benefits website Full explanations in the UC Employee Benefits Guide Student staff health insurance information Additional Benefits As an employee of UC Davis, you can enjoy cultural, intellectual and physical fitness benefits that complement your paycheck in a big way. Wellness Staff can access state-of-the-art exercise equipment, group fitness classes, climbing wall, running track and ball courts, swimming pools, intramural sports programs, craft classes, equestrian center, outdoor adventures and youth programs with an Activities and Recreation Center membership. Faculty and staff can participate in the Health and Well-being Program to socialize and practice weight management, mindfulness and meditation, art and more. Faculty can participate in the WorkLife Program for community and resources, including professional development, elder care and childcare options. Workplace Flexibility Many units have informal systems that support flexibility on an occasional basis, such as compressed workweek, flextime and telework. Family Care Resources UC Davis provides access to prescreened caregivers, pet sitters, tutors and other family services. Tax-Savings Programs Health Flexible Spending Account (HSA) and Dependent Care Flexible Spending Account (FSA) benefits lower your taxable income by allowing payment for eligible expenses on a pretax basis. Some medical plans also offer Tax Savings on Insurance Premium (TIP) options. Transportation subsidies through the goClub allow pretax payroll deductions for purchasing discounted regional bus, train, carpool and vanpool passes. Tuition Assistance & Professional Development Eligible UC Davis staff can receive 20 percent off at Open Campus courses. The UC Davis Staff Scholarship Program awards funding for eligible staff to pursue professional certificates as well as Associate, Bachelor or graduate degrees at community colleges, state colleges, universities and professional schools. The UC Davis Staff Dependent Scholarship Program awards funding for dependents of eligible staff who are attending UC Davis as undergraduate students. The UC Davis Graduate School of Management Staff MBA Scholarship Program awards a significant scholarship to eligible staff for the Sacramento or Bay Area Part-time MBA programs. Staff Development and Professional Services on the Davis campus and Training and Development on the Sacramento campus offer courses, programs, certificate series, mentoring, confidential career counseling, online toolkits and more. Merchandise and Services Discounts A membership in the Pin Program provides a 10 percent discount on services in education, technology, entertainment and health, including Apple, Dell, AT&T, Verizon, Sprint, Starbucks, massage therapy, auto repair, fitness clubs, and UC Davis gifts and clothing. All UC Davis employees can buy discounted tickets for the Robert and Margrit Mondavi Center for the Performing Arts. More Information Housing Resources Davis Community Resources Staff Assembly Campus Map Quick guide to campus abbreviations"
author = "Rebecca D Huval"
year_published = 2021
year_updated = 2023
