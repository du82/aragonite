["https://ucdavis.edu/about/visit/tour-guides/miguel-moran"]
title = "Miguel Moran | UC Davis"
description = "Miguel MoranPronouns: he/him/hisMajor: Landscape architecture"
full_description = '''Miguel MoranPronouns: he/him/hisMajor: Landscape architecture Minor: Chicana/o studiesHow do you feel UC Davis is helping you grow and preparing you for success? "UC Davis introduced me to so many things I had no idea I was even passionate about. I always knew I liked gardening but I never expected to develop such a passion for horticulture and creating climate-ready gardens. If it wasn't for the resources I gained at the arboretum, I would have never discovered what landscape architecture was. UC Davis has given me the opportunity to bring my planting design projects to life, by allowing me to aid in the design and build process of various gardens around campus."What would you tell prospective students about UC Davis?"I genuinely am so thankful for so many of the experiences I've had here, and all of the people I've met. I can't imagine having gone anywhere else. Davis really does feel like my home and I am so thankful for all of the different programs our campus has to offer." Why did you choose UC Davis?"I chose UC Davis because I was really interested in its different environmental programs. I didn't really know what I wanted to major in, but I knew I wanted to do something related to environmentalism, and I loved how many different programs Davis had to offer. I also thought the arboretum was super cool, and I wanted the opportunity to work there and take classes there as well."What do you like about academics and student life here?"I love how friendly everyone is! I find that connecting with others and finding community on campus is really easy as there's so many groups of people who I really identify with here. I love the landscape architecture department here as well. The studio culture is super fun and it's amazing having such talented students and faculty working alongside me."'''
author = "Derrick Anthony Phipps"
year_published = 2024
year_updated = 2025
