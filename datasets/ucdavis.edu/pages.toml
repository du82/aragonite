["https://ucdavis.edu/about/visit/tour-guides/elise-hernandez"]
title = "Elise Hernandez | UC Davis"
description = "Elise HernandezPronouns: she/her/hersMajor: Design"
full_description = '''Elise HernandezPronouns: she/her/hersMajor: DesignMinor: Gender, sexuality and women's studiesWhere have you found community and support on campus?"I have been involved in a few different activities! I was an orientation leader for two years and I have been a part of Prytanean Women’s Honors Society since my second year. Additionally, I have been a tour guide since my second year and I have been a part of our SAC Communications team since my third year. Though each of these experiences have brought me amazing friends and community, I feel the tour program has been especially special in the experiences, connections and support it provides not only myself but each member of the organization." What would you tell prospective students about UC Davis?"For all the prospective students out there, UC Davis is special. As a fourth year looking back, my time at UC Davis has been one of the most rewarding experiences of my life. Knowing that this is my last year, I am that much more grateful for the kind people, gorgeous campus and supportive atmosphere that I have been a part of for the last three years. As a prospective student, UC Davis offers an immense amount of possibilities and I hope that if you choose to attend our school you find the experience as rewarding as I have." Why did you choose UC Davis?"I chose UC Davis for the people, the campus and the opportunities! After getting accepted, my mom and I came to visit and as cliche as it sounds, I fell in love with the campus and the community. We rented bikes, explored campus and met a few students and staff. The lovely and welcoming atmosphere I encountered during our visit convinced me without a doubt that Davis was the place for me." What do you like about academics and student life here?"I love how many opportunities there are to get involved and how welcoming everyone is! I feel a big part of the UC Davis culture is students uplifting each other. I have experienced this in both our classroom environment as well as in extracurricular activities and it has made me more motivated and excited to be a part of student life."'''
