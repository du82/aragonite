full_description = '''Esin DemirayPronouns: she/her/hersMajor: Neurobiology, physiology and behavior How do you feel UC Davis is helping you grow and preparing you for success? "Being a student at Davis has taught me to pursue any new thing I could be passionate about, simply because there's so many opportunities to be explored here."Where have you found community and support on campus?"Besides working as a tour guide, I am a member of the Research Experience in Surgery program, where I get to connect with other students and researchers passionate about human health. Students at Davis are so, so welcoming and passionate, and I've loved meeting everyone here!"What would you tell prospective students about UC Davis?"I would tell prospective students to immerse themselves as much as they can! The more energy and effort you put into your college experience, the more you will get out of it, and this is especially true for Davis. The people really do make the place here."Why did you choose UC Davis?"The incredible people and rewarding opportunities!"'''
