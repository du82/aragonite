title = "Raynisha Fields | UC Davis"
description = "Raynisha FieldsPronouns: she/her/hersMajor: Environmental policy analysis and planning"
full_description = 'Raynisha FieldsPronouns: she/her/hersMajor: Environmental policy analysis and planningMinor: CommunicationsHow do you feel UC Davis is helping you grow and preparing you for success? "I am feeling very prepared for life after graduation! Having the Career Center helps me feel more confident, especially since their services are available a year after graduation."What would you tell prospective students about UC Davis?"I would tell prospective students to be themselves and visit as many parts of UC Davis as they can and really take things in!"Why did you choose UC Davis?"I chose UC Davis for the warm, welcoming environment and the awesome programs they offer!"What do you like about academics and student life here?"I love how the professors are down to earth and are truly wanting you to succeed! I also love that we have office hours so that everyone gets a chance to meet with their professors one on one."'
