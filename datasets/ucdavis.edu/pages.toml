full_description = 'Teresa YubetaPronouns: she/her/hersMajor: Landscape architectureHow do you feel UC Davis is helping you grow and preparing you for success? "During my time at Davis, I have grown in confidence, adaptability, communication, time management, leadership, knowledge and the list goes on! UC Davis is preparing me to be successful both in my career and my relationships." Where have you found community and support on campus?"Apart from giving fun campus tours, I get to enjoy nature by leading camping and backpacking trips with Outdoor Adventure each quarter! I also have found an amazing community at the Newman Catholic Center that supports me so well!"Why did you choose UC Davis?"I chose UC Davis because it is a friendly, college town where I knew I could find a strong community, while also receiving leading, high-level academics."What do you like about academics and student life here?"I like that while Davis is such a large university, students still have the opportunity to receive extensive academic support from their professors and meet friendly people everywhere, even in the classroom! The students here support, encourage and build you up in academics, which I have found a big part of my success at UC Davis."'
