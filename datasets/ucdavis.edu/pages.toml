["https://ucdavis.edu/about/visit/tour-guides/bianca-pahler"]
title = "Bianca Pahler | UC Davis"
description = "Bianca PahlerPronouns: she/her/hersMajor: Environmental science and management and economics"
full_description = '''Bianca PahlerPronouns: she/her/hersMajor: Environmental science and management and economics How do you feel UC Davis is helping you grow and preparing you for success? "UC Davis and my classes are preparing me well for success. These include skills I will use in work with excel, coding and group projects. In addition, I have felt great support from our career center that gives workshops and resume help that builds my career profile. I have also felt my experiences with my classmates and professors from diverse backgrounds have helped me overall to be a better friend and person." What would you tell prospective students about UC Davis?"I would tell prospective students that UC Davis is an awesome college town that will provide fun, rigorous academics and the opportunities to grow as a person. I would take any opportunity you can get and live day by day. It goes by very fast. Work hard and enjoy learning and making new friends in a great place like Davis." Why did you choose UC Davis?"I chose UC Davis because of the strong environmental program and its dedication to sustainability, the campus life and the diversity of the student body." What do you like about academics and student life here?"I like that everyone aims to do well and be helpful in assisting others learning. There is a lot of collaboration here in projects and studying. You are able to form study groups very easily and in turn assist in each other's learning. Student life is also very busy and plentiful. You can easily find something to do whether for enjoyment or for career. There are tons of restaurants and activities to do downtown and on campus. You just have to put yourself out there!"'''
author = "Derrick Anthony Phipps"
year_published = 2024
year_updated = 2025
