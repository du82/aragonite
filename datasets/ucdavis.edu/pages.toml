["http://ucdavis.edu/about/visit/tour-guides/aidan-hymel"]
title = "Aidan Hymel | UC Davis"
description = "Aidan HymelPronouns: he/him/hisMajor: Cognitive science with a neuroscience emphasis"
full_description = 'Aidan HymelPronouns: he/him/hisMajor: Cognitive science with a neuroscience emphasisMinor: Public healthWhere have you found community and support on campus?"Fortunately I was very lucky to meet some of my best friends for life on my dorm floor when I first came to UC Davis. In addition to being a tour guide, I have been involved in Undergraduate Research where I worked at the Center for Mind and Brain and also served as Philanthropy Chairman of the Sigma Chi Fraternity. I have been blessed to meet so many amazing people through all of these experiences."What would you tell prospective students about UC Davis?"I would tell students that UC Davis is a very special and unique environment and community to be a part of. I always tell prospective students and families that UC Davis really is a place for everyone and that UC Davis is home. Students will grow not only academically and professionally, but will also see a lot of personal growth and be happy with who they have become at the end of their time here." Why did you choose UC Davis?"I chose UC Davis because of all the schools I visited and toured in high school, this place was the only one that I truly envisioned myself fitting in. Davis was always my dream school although many people do not believe me. I love the college town environment, the beautiful campus, the friendliest and most genuine people, everything about this place is perfect."What do you like about academics and student life here?"My favorite part about Academics here at UC Davis is that although we have a very challenging and rigorous academic schedule, we also have a very supportive community within as well. I have done some of my best work by forming study groups, attending the free tutoring around campus and I just love how everyone wants to help and see each other succeed."'
