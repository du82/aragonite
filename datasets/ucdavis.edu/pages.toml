["https://ucdavis.edu/academics/colleges-and-schools"]
title = "Colleges and Schools | UC Davis"
description = "Wide-Ranging and InterdisciplinaryOur four academic colleges invest in educating the next generation of leaders as much as they invest in cutting-edge research. The colleges of Letters and Science, Agriculture and Environmental Sciences, Biological Sciences, and Engineering collaborate to make real-world impacts that span disciplines."
full_description = "Wide-Ranging and InterdisciplinaryOur four academic colleges invest in educating the next generation of leaders as much as they invest in cutting-edge research. The colleges of Letters and Science, Agriculture and Environmental Sciences, Biological Sciences, and Engineering collaborate to make real-world impacts that span disciplines.Colleges Agricultural and Environmental Sciences This college is dedicated to solving problems in the agricultural, environmental and human/social sciences. Through scientific inquiry, we address critical challenges in agriculture, food systems, water, energy, climate change and the environment. Biological Sciences The College of Biological Sciences makes discoveries that lead to solutions to global challenges. Through access to hands-on research and world-class faculty, our undergraduate and graduate students become leaders who transform the world. Engineering Here, undergraduate and graduate students receive education in the essential creative, collaborative and technical aspects of engineering. Our students leave UC Davis prepared for successful careers developing the technologies of the future. Letters and Science We teach core courses to nearly all undergraduates at UC Davis. And we mentor more than 1,500 graduate students every year. Letters and Science is at the intersection of art, science and the humanities, preparing the change makers of the future. Graduate school Graduate Studies Graduate education includes more than 90 programs, most of which are interdisciplinary graduate groups. Our programs offer distinguished scholars, a diverse and collaborative community, cutting-edge research, and innovative teaching. Professional schools The Betty Irene Moore School of Nursing Breaking traditional boundaries, developing innovative partnerships and creating nurse leaders: These principles drive this school’s mission. We seek graduate students to lead the transformation of health care through nursing education and research. Graduate School of Management Dedicated to preparing the next generation of innovative and collaborative leaders who are committed to making a positive impact. We are consistently ranked among the premier business schools in the U.S. and internationally, and our faculty are globally renowned for their teaching excellence and research impact. School of Education We are transforming education through preparing the best education leaders, researchers and teachers in the country. Our goal is to eliminate inequities for diverse learners using the power of knowledge and the promise of education. School of Law This school prepares students to become socially responsible lawyers committed to professional excellence and high ethical standards. Its faculty, students and graduates focus on solving the complex legal problems confronting our society. School of Medicine We are known for life-changing biomedical discoveries, a passion for clinical care and a commitment to underserved communities. And, we are building a more diverse physician workforce and advancing leading-edge research to improve health care for all. School of Veterinary Medicine The goals of this school are to educate world leaders in academic and clinical veterinary medicine, contribute research for better animal and human care, and to serve the local and global community, connected into the school’s “One Health” approach."
author = "Thomas John Watts"
year_published = 2021
year_updated = 2024
