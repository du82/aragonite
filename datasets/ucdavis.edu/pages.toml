["https://ucdavis.edu/about/visit/tour-guides/cameron-green"]
title = "Cameron Green | UC Davis"
description = "Cameron GreenPronouns: she/her/hersMajor: Animal science"
full_description = '''Cameron GreenPronouns: she/her/hersMajor: Animal scienceHow do you feel UC Davis is helping you grow and preparing you for success? "UC Davis is preparing me for future success through the classes, advising and experiences my time here has provided me. The classes I have taken have been relevant to my future career aspirations as well as rigorous to force me to develop critical thinking and problem solving skills. The advising the university provides, particularly for me through my major advisors and health professions advising, has helped me stay on track with my degree and prepare for grad school and beyond. The experiences that I've had here through internships and job opportunities have also improved my confidence and people skills, which will aid in future success."Where have you found community and support on campus?"Besides being a tour guide I've been a member of the club cross country and track team and a research intern with the sheep mowers. Participating in club sports has been a wonderful way to make friends, stay active and continue doing a sport I love. Working with the sheepmowers was a wonderful opportunity as well to see how research and public engagement can come together." What would you tell prospective students about UC Davis?"I would tell them that UC Davis is a place where anyone can belong and thrive, regardless of your background, experiences or interests. There are so many opportunities available to everyone on campus that you will for sure find something that you are passionate about to participate in. The campus community as well is incredibly supportive, meaning you'll for sure meet amazing friends to support you through your college journey." Why did you choose UC Davis?"Honestly I chose UC Davis without knowing much about the campus beyond that they have an excellent program for my major. Upon going here though I have fallen in love with the supportive campus community, hands-on experiences in my classes and amazing atmosphere of the college town itself. I am so thankful I went with my gut and chose this wonderful school."'''
author = "Derrick Anthony Phipps"
