["http://ucdavis.edu/about/student-safety"]
title = "Student Safety | UC Davis"
description = "Safety encompasses more than just physical wellbeing. At UC Davis, we are committed to creating a safe space for living and learning, and offering resources that address physical, psychological, emotional, environmental and cyber safety. This directory is designed to help you find these resources."
full_description = "Call 911 to report an emergency, or from a cell phone dial 530-752-1230. Student Safety Breadcrumb UC Davis About Us Student Safety Safety encompasses more than just physical wellbeing. At UC Davis, we are committed to creating a safe space for living and learning, and offering resources that address physical, psychological, emotional, environmental and cyber safety. This directory is designed to help you find these resources. Urgent Assistance Resources for physical injury or illness, mental health challenges or addiction recovery support. Report a Crime or Misconduct Resources to report crimes, harassment, discrimination, hate crimes and social misconduct. Mental Health & Wellbeing Resources for mental health, addiction, grief management and social connection. Discrimination and Harassment Resources to address discrimination and harassment, including identity-based harassment and online harassment. Sexual and Gender-Based Violence Resources to address sexual violence, sexual harassment and stalking Free Speech Learn about your freedom of expression rights and the rights of others. Transportation Safety Bus services, biking safety tips, free rides at night and transportation for students with disabilities. Lab and Environmental Safety Research, lab, environmental, and emergency safety and more."
