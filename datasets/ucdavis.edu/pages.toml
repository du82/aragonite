["http://ucdavis.edu/about/locations"]
title = "Locations | UC Davis"
description = "Our main campus borders the Northern California city of Davis, a vibrant college town of about 68,000 people. We’re also located in Sacramento, the state capital, where UC Davis Health is headquartered. The state capital is 20 minutes away, and world-class destinations such as the San Francisco Bay Area, Lake Tahoe and the Napa Valley are within a two-hour drive."
full_description = "Locations Breadcrumb UC Davis About Us Locations In the Middle of Everywhere Transportation Unique to UC Davis Our locations Our main campus sits at the center of Davis in Northern California’s central valley. Davis is a vibrant college town of about 68,000 people with a student-friendly downtown right across the street from the university. UC Davis Health, the region’s only academic health center, is on our Sacramento campus only 20 minutes from Davis. World-class destinations such as the San Francisco Bay Area, Lake Tahoe and the Napa Valley are within a two-hour drive. Our campuses Main Campus Davis, California Bodega Marine Lab Bodega Bay, California UC Davis Health Sacramento, California Tahoe Environmental Research Center Incline Village, Nevada Redwoods NP Lassen Volcanic NP Lake Tahoe Sacramento San Francisco Silicon Valley Yosemite NP Sequoia NP In the middle of everywhere UC Davis is centrally located in Northern California. We’re a day trip away from some of the most beautiful places in the world. Explore the region UC Davis main campus Our 5,300-acre campus borders the town of Davis. Visit campus UC Davis Medical Center Our major academic health center is located in Sacramento. Visit UC Davis Health Tahoe Environmental Research Center (TERC) TERC leads research on the ecology of Lake Tahoe. Visit TERC Bodega Bay Marine Laboratory Our laboratory is perched on the iconic bluffs of Bodega Head. Visit the lab UC Davis San Diego Veterinary Medicine Center A satellite facility offering veterinary services in Southern California. Visit our San Diego center Natural Reserve System Outdoor laboratories, classrooms without walls, and nature's inspiration to all. Find a reserve San Francisco Bay Area Campus The UC Davis Part-Time MBA Program has one location in San Ramon. Learn more Sacramento Campus The UC Davis Part-Time MBA Program is also offered in Sacramento. Learn more UC Center Sacramento UCCS educates California’s future and current leaders in politics and policymaking. Contact the UC Center Explore our region California’s college town Davis is a laid back town, built around the university. Image In the middle of everywhere UC Davis is in Northern California, and we have locations from the coast to the mountains. Image Unique to UC Davis UC Davis is a special place full of traditions and amazing programs. Image Getting to main campus or the health center From the airportThe nearest airport to the main campus and the health center is the Sacramento International Airport, about a 20-minute trip for each. You can use public transportation to get to and from both places.Once on campus, buses and shuttles can get you to where you want to go. The health system operates the on-site Med-Transit Shuttle Services and the Davis campus is served by the local public bus system Unitrans, with terminals near the Memorial Union and the Silo.Parking at UC DavisA valid UC Davis permit is required to park on campus. UC Davis uses AggiePark, an app that allows drivers to conduct parking permit transactions from their mobile devices. Visit UC Davis Transportation Services for daily visitor rates.Visitors with a disabled placard/plate may park without displaying an additional permit, and may park in spaces where UC Davis DSA permits are honored. Disabled placards/plates are not valid in restricted spaces (such as 1 hour A permit spaces), loading zones, red zones, center core and reserved areas.We encourage you to wear walking shoes and bring a water bottle to take advantage of filtered drinking water available at hydration stations throughout campus."
author = "Tristan Peery"
year_published = 2021
year_updated = 2024
