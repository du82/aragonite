["https://ucdavis.edu/about/administration"]
title = "Administration | UC Davis"
description = "Gary S. May became UC Davis’ seventh chancellor on Aug. 1, 2017. He oversees all aspects of the university’s teaching, research and public service mission. Also included on this page is a short bio of Provost and Executive Vice Chancellor Mary Croughan and a comprehensive list of our other campus leadership."
full_description = "Administration Breadcrumb UC Davis About Us Administration Administration Diversity and Inclusion Rankings Locations Sustainability Visit UC Davis UC Davis Health Student Safety Chancellor Gary S. May Gary S. May became UC Davis’ seventh chancellor on Aug. 1, 2017. He oversees all aspects of the university’s teaching, research and public service mission. Chancellor May is boldly leading the university to new heights in academic excellence, enterprise research, public service and upward mobility for students from all backgrounds. He spearheaded the creation of “To Boldly Go,” a 10-year strategic plan for the university and created new programs to ensure we’re meeting students’ basic needs. These include affordable housing, food security and mental health services. A strong proponent of innovation and economic development, one of Chancellor May’s first significant efforts was partnering with the City of Sacramento to develop Aggie Square. This 25-acre “innovation ecosystem” on our UC Davis Health campus will be home to key research and academic programs and will serve as an incubator for start-ups. An electrical engineer, computer science expert and proud UC alumnus (UC Berkeley ’88 and ’91), Chancellor May is a dynamic leader with a passion for helping others succeed. He believes success is best judged by how we enhance the lives of others. Throughout his career, he has championed diversity and mentorship in both higher education and the workplace. He developed nationally recognized programs to attract, mentor and retain underrepresented groups in the STEM fields of science, technology, engineering and math. Learn more about the chancellor: Read his biography Visit his website Follow him on Twitter, LinkedIn, Facebook and Instagram Initiatives Principles and policies Top administrative units Org chart Staff resources #mc_embed_signup .button { font-family:inherit !important; background-color: #FFBF00 !important; border-radius: 0px !important; color: #002851 !important; font-size: 16px !important; font-weight: 700 !important; font-style: normal !important; height: auto !important; line-height: 1.2 !important; margin: 8px 0 0 0 !important; padding: .9em 1.25em !important; white-space: normal; } #mc_embed_signup .button:hover { background-color: #002851 !important; color:#ffffff !important; } Sign up for the Chancellor’s updates #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ * indicates required Email Address * First Name * Last Name * I am... Current student Alumni Faculty/Staff Parent/Guardian Community Other (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';fnames[5]='SIGNUP';ftypes[5]='text';}(jQuery));var $mcj = jQuery.noConflict(true); Provost and Executive Vice Chancellor Mary Croughan Mary S. Croughan is a seasoned administrator in higher education with 30 years of experience with the University of California and three years at the University of Nevada, Las Vegas. As UC Davis’ chief academic officer, her responsibilities include partnering with deans and faculty to achieve excellence across our academic mission of education, research and service. This includes implementing the strategic plan, strengthening and supporting the research enterprise, advancing student achievement and success, and fostering collaboration across UC Davis and in our communities. She oversees the university budget and daily campus operations, and partner with Chancellor May to develop Aggie Square. “I’m thrilled that Mary will join my leadership team during such a pivotal time for higher education,” May said. “She has deep roots in academia, and particularly with the UC system as an administrator and as a researcher in public health. She knows the impact and value of UC Davis, and we are proud to welcome her home.” Experience in the UC system Within the University of California system, Croughan served as executive director of the Research Grants Program Office at the UC Office of the President from 2010 to 2017. There she oversaw seven grant programs to develop and implement UC’s intramural research strategic vision, as well as overseeing research funds for the state of California. From 1987 to 2010, Croughan served as a faculty member at UC San Francisco in the School of Medicine. During her time with UCSF, she co-directed a required course in epidemiology and biostatistics and won multiple teaching awards, including the Academic Senate’s Distinguished Teaching Award. Also at UCSF, Croughan developed and led a practice-based research network with more than 600 community-based primary care physicians. Since 1987, she has conducted research in reproductive and perinatal epidemiology, specifically examining health outcomes of nearly 52,000 women treated for infertility, and their partners and their children. Croughan served as vice chair and chair of the UC systemwide Academic Senate and as a faculty representative on the UC Board of Regents from 2007 to 2009. Throughout her career, she has served on numerous committees, including the UCSF Academic Senate’s Committee on Academic Personnel, as chair of the Universitywide Committee on Academic Personnel and as chair of the UCSF Chancellor’s Advisory Committee on the Status of Women. Croughan served as a fellow of the American Council on Education with University of Miami President Donna Shalala in 2012-13. As an ACE fellow, she studied higher education within the United States and internationally, enhancing her expertise in undergraduate education, fundraising, athletics and crisis communications. Vice Chancellors Image Deans Image Vice Provosts Image"
author = "Thomas John Watts"
year_published = 2022
year_updated = 2024
