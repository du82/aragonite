["https://ucdavis.edu/about/locations/middle-of-everywhere"]
title = "In the Middle of Everywhere | UC Davis"
description = "We’re a day trip away from the beach, snowy mountains, San Francisco, Silicon Valley and six national parks! The capital of California, Sacramento, is only 15 miles from Davis. Whether you’re into skiing, museums, food, wine, technology, politics, big cities or wide open spaces, your interests are close to UC Davis."
full_description = "In the middle of everywhere Watch more In the Middle of Everywhere Transportation Unique to UC Davis All of Northern California is within reach We’re a day trip away from the beach, snowy mountains, San Francisco, Silicon Valley and six national parks! The capital of California, Sacramento, is only 15 miles from Davis. Whether you’re into skiing, museums, food, wine, technology, politics, big cities or wide open spaces, your interests are close to UC Davis. Image Day trips You can unwind from school with easy getaways. You don’t even need a car. Our campus is near Amtrak, which can take you to the Bay Area. Campus Recreation offers classes in white water rafting, rock climbing, snowshoeing and skiing that include transportation and equipment. UC Davis locations Custom Image Explore the bay area Custom Image Ski or hike the sierras Custom Image Soak up the beach Custom Image Bask in multiple wine countries Custom Image Visit a national park Regional facts South Lake Tahoe gets around 200 inches of snowfall per year. San Francisco has the most three-star Michelin restaurants of any U.S. city. Sacramento has the first solar-powered arena in the world. Yosemite Valley was first protected by the Yosemite Land Grant signed by President Lincoln in 1864. Sacramento is just next door California’s capital has a lot more to offer than politics. Sacramento has a bikeable downtown with farm-to-fork restaurants, vintage shopping, NBA basketball games, award-winning coffee shops, live music, art museums, fairs, festivals, and more. More about Sacramento Image Regional Attractions The San Francisco bay area is a short hour and a half drive from UC Davis. The bay is full of amazing restaurants, museums, sporting events and numerous other cultural attractions. Lake Tahoe is only a two hour drive from campus. The Tahoe region gives Aggies access to skiing, hiking, rafting, mountain biking and even mountain beach time. Napa valley is a quick 40 minute drive up highway 12 for access to amazing wineries and delicious food. We are literally surrounded by beautiful National Parks. Parks like Yosemite, Sequoia (pictured here), Lassen and Big Trees are a short day trip away. Last but definitely not least is our neighbor to the East, Sacramento. A few minutes by car, Sacramento has amazing restaurants, sports venues, museums and an active music scene. Locations UC Davis has several locations across Northern California. Image California’s college town The City of Davis is built for UC Davis students. Image Unique to UC Davis UC Davis is one of a kind. Image"
author = "Tristan Peery"
year_published = 2021
year_updated = 2024
