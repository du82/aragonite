["https://www.ucl.ac.uk/news/2025/feb/ucl-champions-universities-drivers-innovation-indias-global-business-summit"]
title = "UCL champions universities as drivers of innovation at India’s Global Business Summit | UCL News - UCL – University College London"
description = "Dr Michael Spence, UCL President and Provost, joined Indian Prime Minister Narendra Modi at Asia’s leading business forum for reimagining the future of business and society."
full_description = '''Dr Michael Spence, UCL President and Provost, joined Indian Prime Minister Narendra Modi at Asia’s leading business forum for reimagining the future of business and society. Dr Spence addressed an audience of business leaders, policymakers, and innovators at The Times Group ET NOW Global Business Summit in New Delhi this week. He joined Times Now news anchor Heena Gambhir to discuss the important role that universities can play as drivers of innovation, growth and cutting-edge thinking, especially when working in partnership with industry and government. In a session entitled ‘Campuses to Communities: Universities as Global Change-makers', Dr Spence explained how modern university campuses are fostering and fuelling innovation and entrepreneurship. Dr Michael Spence said: "It was wonderful to be back in India, to meet Prime Minister Narendra Modi and to connect with industry and government leaders at this important event. Fostering partnerships across sectors is a crucial way for the UK and India to drive growth and innovation, address global challenges, and create a more equitable and sustainable future for us all." Professor Christian Dustmann (UCL Economics, founding Director of the UCL Centre for Research and Analysis of Migration) also delivered a session at the Summit on “The Migrant Economy: Turning Movements into Momentum,” where he explored the economic opportunities migration can bring, the distributional consequences, and the political economy of migration. UCL enjoys a rich history of collaboration with India. Highlights in 2024 included the launch of a pioneering trilateral partnership with IIT Dehli and AIIMS on medical technology, and the launch of UCL’s first Summer School in India. Top: Dr Michael Spence on stage being interviewed by Heena Gambhir at the Global Business Summit; Dr Michael Spence meeting Prime Minister Narendra Modi Slideshow: Dr Michael Spence with Prime Minister Narendra Modi and guests; Dr Michael Spence spoke in conversation with Heena Gambhir on 'Universities as global change-makers'; Dr Michael Spence with Professor Christian Dustmann at the Global Business Summit.'''
