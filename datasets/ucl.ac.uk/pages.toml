["https://www.ucl.ac.uk/news/2024/aug/momentous-occasion-ucl-experts-greet-first-drug-approved-early-alzheimers-disease-uk"]
title = "'Momentous occasion': UCL experts greet first drug approved for early Alzheimer’s disease in the UK | UCL News - UCL – University College London"
description = "The Medicines and Healthcare Products Regulatory Agency (MHRA) has licensed the immunotherapy drug, Lecanemab, for use in the early stages of Alzheimer’s disease in the UK, following decades of work supported by UCL research."
full_description = "The Medicines and Healthcare Products Regulatory Agency (MHRA) has licensed the immunotherapy drug, Lecanemab, for use in the early stages of Alzheimer’s disease in the UK, following decades of work supported by UCL research. Lecanemab is the first treatment of Alzheimer’s disease licensed for use in Great Britain that shows some evidence of efficacy in slowing progression of the disease. A large-scale trial in 2022, involving 1,795 volunteers with early-stage Alzheimer’s, found that Lecanemab was able to slow cognitive decline by 27% over the course of 18 months of treatment. It also slowed down the decline in quality of life by up to 56%. Lecanemab was fully approved by the US Food and Drug Administration (FDA) as a treatment for early Alzheimer’s disease in July 2023. The decision from the MHRA today follows an application from Eisai (who make Lecanemab), made in May 2023. The approval was given as a result of expert scientific advice on the benefit risk of Lecanemab from the Commission on Human Medicines (CHM), the government’s independent advisory body. However, the National Institute for Health and Care Excellence (NICE) – who decide whether drugs should be made available on the NHS – have published draft guidance today, advising that the benefits of Lecanemab are too small to justify the cost to the NHS. The decision will be reviewed following a public consultation and a second independent committee meeting later this year. Director of the UCL Dementia Research Centre and Group Leader at the UK Dementia Research Institute at UCL, Professor Nick Fox said: “This is a momentous occasion. The MHRA approving Lecanemab brings us closer to providing a therapy that slows the progression of Alzheimer’s for the first time. This will be a great source of hope to people living with Alzheimer’s and their families. “However, the next hurdle is approval by NICE. It would further increase current inequities if this was only available to those who could pay privately."
