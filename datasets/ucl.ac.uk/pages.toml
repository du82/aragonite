full_description = "Study Being a student at UCL is about so much more than just acquiring knowledge. Studying here gives you the opportunity to realise your potential as an individual, and the skills and tools to thrive in whatever you choose to do. UCL programmes Undergraduate programmes Come to UCL as an undergraduate and get a world-class education in one of the most vibrant cities in the world. Undergraduate programmes Graduate programmes Maximise your potential with a UCL Master’s degree, leading research for an MPhil/PhD or gain a PGCE to become a qualified teacher. Graduate programmes Graduate degree apprenticeships Degree apprenticeships are a unique type of graduate programme that combines full-time paid work with part-time study. Apprentices split their time between university study and the workplace and gain a Master’s level qualification whilst getting on-the-job experience in their chosen profession. Graduate degree apprenticeships Summer school Choose from a wide variety of modules offered by many of our renowned academic departments. Most modules are taught on the Bloomsbury campus and, where possible, also make use of London as a learning space, including excursions and field trips to areas in and around the city. Summer school Short courses Whether you are learning for the fun of it, looking to get ahead in your career or you need professional accreditation, UCL has nearly 400 courses to choose from. Short courses Study abroad Welcome to London! As a Study Abroad student at UCL you have access to an extensive and flexible range of subject options. Study abroad Contact admissions Undergraduate Admissions If you are interested in applying to UCL for an Undergraduate programme and would like to find out more, please get in touch with us. Undergraduate Admissions Graduate Admissions Have a question for the Graduate or Teacher Training Admissions teams? Please do get in touch with us. Graduate Admissions International students UCL visits in your country UCL representatives travel around the world attending fairs, exhibitions and other public events for prospective students and offer holders. UCL visits in your country Prospective international students If you are interested in studying, see how you can start your journey to UCL today. Prospective international students Information by country Read general information about entry qualifications and their equivalents in your country use the Country Search. Information by country Immigration and Visas Read our guidance for international students applying for visas to study at UCL. Immigration and Visas UCL CLIE UCL's Centre for Languages & International Education (CLIE) offers a range of degree preparation and foundation courses for international students. UCL CLIE International students applying to UCL If you are ready to apply you can find specific information about entry requirements for all of our degree programmes and courses. International students applying to UCL Open Days Open Days We know open days, campus tours and visits help you make an informed choice about where to pursue further study, and there are many ways you can meet UCL. Discover UCL’s Virtual Open days and register your interest to be notified of details of upcoming virtual events that are relevant to you. Open Days Register your interest Register your interest today so that you can become part of the UCL community. Follow our updates about subjects, degrees, open days, scholarships and country visits. Register now UCL student experience I love the non-academic side of UCL: the student societies, guest speakers, and The Global Citizenship Programme. There is so much to get involved with, in addition to studying of course. I got involved in parkour at UCL Parkour Society, something I had never thought of trying before. Grace Guan Psychology BA Campus tours Visit our historic Bloomsbury campus and take the opportunity to ask general questions relating to your application. Campus tours Read news from our students Student stories from across UCL. Read news from our students Chat with a student on Unibuddy Don't just take our word for it, you can chat to a current student at UCL today. You can match with an Undergraduate or Postgraduate student ambassador, with students online from different countries studying a wide selection of subjects. Chat with a student on Unibuddy now UCL student life in London Accommodation UCL Accommodation offers a range of room types, with halls located in central London. We can also help to find options for students that choose to live outside of halls. Accommodation Living in London Discover why London is such a great place to study for UCL students. Living in London"
