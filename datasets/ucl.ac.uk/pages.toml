description = "UCL is consistently ranked as one of the top ten universities in the world (QS World University Rankings 2010-2022) and is No.2 in the UK for research power (Research Excellence Framework 2021)."
full_description = "Read inspirational student stories about making the most of the networking opportunities and career support available at UCL. Your wellbeing and access to support, whenever needed, are essential to your success. Our dedicated team is here to help. Search and view on-demand recordings, or look up upcoming online and in-person events for your programme of interest. The Medicines and Healthcare Products Regulatory Agency (MHRA) has licensed the immunotherapy drug, Lecanemab, for use in the early stages of Alzheimer’s disease in the UK, following decades of work supported by UCL research. UCL’s annual impact of £9.9bn across the UK economy is comparable to the trade boost delivered by the London 2012 Olympics, finds a new independent report into the university’s economic and social impact. The excellence of research at UCL and its positive real-world impact has improved since 2014, according to the Research Excellence Framework 2021 (REF) assessment results announced today. Last summer, we welcomed students from over 300 universities in more than 40 countries. Come and join us in London! All our public lectures, podcasts, videos, workshops, festivals, exhibitions and conferences, open to all Find out about UCL student societies through second year Comparative Literature student Ellie-Jean's experience. Professor Duncan Brumby explores how to engage with AI responsibly, balancing innovation with human oversight in Higher Education. This exhibition takes a critical look at UCL’s past, present and future relationship to eugenics explored via cultural activism and public art. Professor Daisy Fancourt discusses the UK's social prescribing initiative, its widespread adoption, and the ongoing debate about its effectiveness and potential to exacerbate health inequalities. UCL EGA Institute for Women’s Health are delighted to host a selection of free events to celebrate International Women's Day 2025"
