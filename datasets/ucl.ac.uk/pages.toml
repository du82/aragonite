["https://www.ucl.ac.uk/news/2024/aug/two-ucl-academics-awarded-national-teaching-fellowships"]
title = "Two UCL academics awarded National Teaching Fellowships | UCL News - UCL – University College London"
description = "Professor John Mitchell (UCL Electronic & Electrical Engineering) and Professor Tim Young (UCL Queen Square Institute of Neurology) have been awarded National Teaching Fellowships, recognising their salient work in higher education teaching."
full_description = "Professor John Mitchell (UCL Electronic & Electrical Engineering) and Professor Tim Young (UCL Queen Square Institute of Neurology) have been awarded National Teaching Fellowships, recognising their salient work in higher education teaching. The National Teaching Fellowship Scheme (NTFS) rewards and celebrates individuals who have made an outstanding impact on student outcomes and the teaching profession within higher education. Successful Fellows must be able to demonstrate individual brilliance in enhancing student outcomes and/or the teaching profession, as well as raising the profile of excellence by supporting colleagues and engaging beyond the nominee's immediate professional role. An individual must also show evidence of their commitment to the ongoing professional development of those around them with regard to teaching and learning support. Professor John Mitchell has been recognised for his impressive track record as a radical – yet eminently practical – innovator in education for over two decades at UCL. His far-sighted work on the Integrated Engineering Programme (IEP) is recognised as a trailblazer in Engineering Education. Through his work at UCL, Professor Mitchell has transformed education in this subject so that it has become an exemplar of research-based education and authentic assessment. Professor Mitchell has also been a determined champion for better recognition and clearer career progression for teaching staff, and has contributed greatly to the development of the UCL Education Awards. Each year, institutions can nominate up to three individuals for an NTF. The award has been running since 2000 and there are now over one thousand National Teaching Fellows, with a maximum of 55 individuals receiving the award each year. Professor Tim Young’s inspiring work at the UCL Queen Square Institute of Neurology has changed education, particularly for postgraduate students. He has taken cutting-edge research and linked it directly to medical education, and serves as an impressive example of what can be achieved through collaboration and education at UCL and further afield."
author = "UCL"
year_published = 2024
