["https://www.ucl.ac.uk/americas/events/2025/mar/public-seminar-series-united-states-china-and-global-economy-past-present-and-future"]
title = "Public Seminar Series: The United States, China, and the Global Economy: Past, Present and Future | UCL Institute of the Americas - UCL – University College London"
full_description = "AbstractHow and why did China—the world’s largest communist nation—converge with global capitalism? In her new book, Elizabeth Ingleson, a historian at the London School of Economics, tells the surprising story of how the United States and China went from Cold War foes to finding common cause by transforming China’s economy into a source of cheap labor and creating the economic interdependence that characterizes our world today. In this talk she will reflect on this history and how it can help us make sense of the present dynamics in US-China relations as well as some of the potential implications for the future of the global economy. Elizabeth Ingleson is the author of Made in China: When US-China Interests Converged to Transform Global Trade (Harvard University Press, 2024). Ingleson is currently writing a book under contract with Bloomsbury Academic, China and the United States Since 1949: An International History. She is on the management committee of the LSE’s Phelan US Center and currently serves on the Conference Committee of Society for Historians of American Foreign Relations (SHAFR) and as Membership Secretary for Historians of Twentieth Century United States (HOTCUS). Prior to her appointment, she held fellowships at Yale University, the University of Virginia, and Southern Methodist University. She earnt her PhD in history from the University of Sydney."
