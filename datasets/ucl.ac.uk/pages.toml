["https://www.ucl.ac.uk/news/2025/feb/ancient-egyptian-mummified-bodies-smell-woody-spicy-and-sweet"]
title = "Ancient Egyptian mummified bodies smell ‘woody,’ ‘spicy’ and ‘sweet’ | UCL News - UCL – University College London"
description = "Ancient Egyptian mummified bodies smell ‘woody,’ ‘spicy’ and ‘sweet’, finds a new study led by researchers from UCL and the University of Ljubljana, revealing new details about mumification practices."
full_description = "Ancient Egyptian mummified bodies smell ‘woody,’ ‘spicy’ and ‘sweet’, finds a new study led by researchers from UCL and the University of Ljubljana, revealing new details about mumification practices. The research, published in Journal of the American Chemical Society, is the first time that the smells of mummified bodies have been systematically studied combining a mix of instrumental and sensory techniques, including an electronic ‘nose’ and trained, human ‘sniffers.’ Nine ancient Egyptian mummified bodies were studied. This new data offers clues about the materials used in mummification and how practices and ingredients evolved, as well as reveal details about how museums have subsequently conserved the remains. It’s hoped that using this kind of chemical analysis can help keep conservators safe, protect ancient artifacts and preserve their olfactory heritage. Lead author, Professor Matija Strlič (UCL Bartlett School of Environment, Energy & Resources and the University of Ljubljana) said: “The smell of mummified bodies has for years attracted significant interest from experts and the general public, but no combined chemical and perceptual scientific study has been conducted until now. This ground-breaking research really helps us better plan conservation and understand the ancient embalming materials. It adds another layer of data to enrich the museum exhibition of mummified bodies.” Dr Cecilia Bembibre (UCL Bartlett School of Environment, Energy & Resources), added: “Two aspects of this study stand out to me. First, new information was revealed by the smells, highlighting the importance of using our senses to understand the past. “Secondly, while most of the studies on mummified bodies have taken place in European museums so far, here we worked closely with Egyptian colleagues to ensure their expertise and perceptual experience were represented, and we jointly developed an ethical and respectful approach to studying the mummified bodies.”"
author = "UCL"
