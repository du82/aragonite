["https://www.ucl.ac.uk/news/2022/jun/ucls-annual-economic-impact-comparable-london-2012-olympics"]
title = "UCL’s annual economic impact comparable to London 2012 Olympics | UCL News - UCL – University College London"
description = "UCL’s annual impact of £9.9bn across the UK economy is comparable to the trade boost delivered by the London 2012 Olympics, finds a new independent report into the university’s economic and social impact."
full_description = "UCL’s annual impact of £9.9bn across the UK economy is comparable to the trade boost delivered by the London 2012 Olympics, finds a new independent report into the university’s economic and social impact. The report captures the important role that UCL has in training the future workforce to navigate and prosper in a changing world, addressing global challenges through research and innovation and attracting international students to study in the UK. Led by policy and economics consultancy London Economics, the report reviewed UCL’s impact from a diverse range of activity including research, entrepreneurship, teaching and educational exports in the 2018-19 academic year. It found that every pound spent by UCL produced £5.90 in economic benefit across the UK, which is a 12% increase in UCL’s impact since 2015-16. It shows how we are supporting the economy and contributing to the ‘levelling up’ agenda by creating 19,000 full-time jobs across the UK (of which 7,400 were outside London) and promoting economic growth by investing £3bn through our supply chain. Just over a third of this impact occurs outside of London. Dr Michael Spence, UCL’s President & Provost, said: “The UK is home to some of the world’s leading universities, which are tremendous drivers of economic growth and magnets for international investment and collaboration. This study demonstrates for the first time the far-reaching extent to which UCL in particular is improving health and prosperity right across the UK through its work to expand knowledge, translate that into new technologies, techniques, activities and therapies, and nurture the talent of future generations to do the same. “With the UK facing big challenges but also real opportunities in the post-pandemic world, UCL has proven itself to be one of this country’s great engines of renewal, innovation and growth.” Our ground-breaking research and impactful knowledge exchange provided the largest financial boost, with £4.1bn contributed to the UK economy. This means that for every £1m that was publicly invested in research, UCL produced a benefit of £11.5m. This could only be achieved in collaboration with our partners; 77% of our academic partners are based outside of London."
