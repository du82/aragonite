["https://www.ucl.ac.uk/events/events/2025/mar/lunch-hour-lecture-ai-revolution-here-why-we-all-need-ai-literacy-higher-education"]
title = "Lunch Hour Lecture | The AI Revolution is Here: Why We All Need AI Literacy in Higher Education | UCL Events - UCL – University College London"
description = "Professor Duncan Brumby explores how to engage with AI responsibly, balancing innovation with human oversight in Higher Education."
full_description = "Professor Duncan Brumby explores how to engage with AI responsibly, balancing innovation with human oversight in Higher Education. Generative AI is transforming higher education, raising urgent questions about learning and assessment. Some fear it will erode academic integrity and critical thinking, while others see it as a vital tool for progress. But ignoring AI won’t make it disappear. This talk explores how to move beyond fear and embrace AI responsibly. Instead of banning it, we must name our fears, understand them, and develop AI literacy—helping people learn when and how to use AI effectively, ethically, and critically. The best jobs won’t go to AI tools but to those who know how to use them well. The lecture covers three key themes: (1) AI literacy—helping people evaluate AI-generated content; (2) preserving human voice—using AI to support, not replace, original thinking; and (3) pausing for reflection—resisting the “speed trap” of uncritical AI use. Through real-world examples, grounded in research, this talk explores how to engage with AI responsibly, balancing innovation with human oversight. Professor Duncan Brumby explores how digital tools shape human behaviour. His research tackles two of the most pressing challenges in technology today: managing the pervasive impact of smartphone use and harnessing the potential of generative AI. He has collaborated widely to translate academic insights into real-world impact and holds a senior educational leadership role in the Faculty of Brain Sciences at UCL. An ACM Distinguished Speaker, he has delivered keynotes to leading academic and industry groups and frequently contributes to public discussions on technology and society. Professor Yvonne Rogers FRS is a leading expert in Human-Computer Interaction and the Director of the UCL Interaction Centre. Her research focuses on designing interactive technologies that enhance everyday life, learning, and work. A key theme of her work is defining human-centred AI in practice. She co-authors the definitive Interaction Design textbook and is internationally recognized for her contributions to Ubiquitous Computing. Elected to the National Academy of Engineering and as a Fellow of the Royal Society, she has received major honours, including the ACM SIGCHI Lifetime Research Award and the Royal Society Robin Milner Medal for Computer Science."
author = "UCL"
year_published = 2025
