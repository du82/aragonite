["https://www.ucl.ac.uk/grand-challenges/news/2023/dec/academic-leads-appointed-ucl-grand-challenge-climate-crisis"]
title = "Academic leads appointed for the UCL Grand Challenge of Climate Crisis | UCL Grand Challenges - UCL – University College London"
description = "Professor Lisa Vanhala and Professor Mark Maslin have been appointed as Pro-Vice-Provosts to lead the new UCL Grand Challenges Theme of Climate Crisis"
full_description = "Professor Lisa Vanhala and Professor Mark Maslin have been appointed as Pro-Vice-Provosts to lead the new UCL Grand Challenges Theme of Climate Crisis Two academic leads have been appointed as Pro-Vice-Provosts to set the strategic direction of the new UCL Grand Challenges Theme of Climate Crisis. Professor Lisa Vanhala (UCL Political Science) and Professor Mark Maslin (UCL Geography) will jointly lead the programme, the second of the new Themes to launch. The UCL Grand Challenges programme was established in 2008, with the aim of bringing a cross-disciplinary, thematic approach to tackling some of the most pressing social problems. The UCL Strategic Plan 2022–2027 sets out the university’s commitment to grow the scope and scale of the Grand Challenges programme, covering not only research and knowledge exchange but also UCL’s approach to education and its institutional operations. The programme will develop an integral approach to how UCL understands and responds to the biggest issues facing humanity, inform and enable our partnerships, and offer context and critique for how universities can make a positive impact on the world. The Strategic Plan identifies five new Grand Challenges Themes: Mental Health & Wellbeing, Climate Crisis, Data-Empowered Societies, Inequalities and Intercultural Communication, to be launched sequentially over the next four years. Pro-Vice-Provosts leading the Mental Health & Wellbeing Theme were announced in October. Professor Vanhala is Professor of Political Science, with a background in climate change and the political and legal landscape of human rights and equality issues. Her current project explores attempts to address the losses and damages associated with climate change. Lisa has worked extensively with civil society and philanthropic organisations, including the Equality and Human Rights Commission, the Public Law Project and a range of charities. Professor Maslin is Professor of Earth System Science at UCL and the Natural History Museum of Denmark. He is a leading scientist with particular interest in understanding climate change and the major challenges facing humanity in the 21st century. Mark works extensively with businesses and the media, and regularly appears on radio and television. His most recent book is How to Save Our Planet: The Facts published by Penguin in 2021."
author = "UCL"
year_published = 2023
year_updated = 2024
