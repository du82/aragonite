title = "Services for media | UCL News - UCL – University College London"
description = "UCL Media Relations team is the university's central press office. We connect journalists to academics who are experts in their field and promote UCL research and teaching throughout the global media."
full_description = "UCL Media Relations team is the university's central press office. We connect journalists to academics who are experts in their field and promote UCL research and teaching throughout the global media. Media enquiriesCheck this page for all the latest data and information but if you can't find what you're looking for, contact the UCL Media Relations Team. Find an expertWe manage an extensive database of UCL academics who are happy to be contacted by the media in relation to their area of research and expertise. Please use our Find an Expert service to search for a relevant academic, but contact us if you can't find what you're looking for.Access UCL Experts databaseUCL press releasesAll our current and past press releases are available online. Also, make sure you sign up to receive future press releases.View UCL press releasesUCL in the mediaFor all current and past references to UCL research and news in the media, go to our UCL in the media archives. View UCL in the mediaFilming at UCLUCL Media Relations can advise broadcasters and production companies wishing to film at UCL, where this is linked to a UCL story or features a UCL researcher. Please contact us if you require our assistance.TV crews and production companies who wish to film on the UCL campus for non-UCL related stories should contact UCL Room Bookings directly on 020 3108 7577. The UCL Room Bookings website lists the rooms and areas that can be booked on campus. The team regularly takes calls from journalists and can assist in finding rooms to suit particular needs.Films about news, research and activities at UCL can also be found on our YouTube channel - UCLTV.Find an imageMembers of the media looking for a particular image should contact UCL Media Relations and we will do what we can to assist directly or refer you on to the appropriate contact.About UCLUCL is a modern, outward-looking institution, committed to engaging with the major issues of our times. One of the world's leading multidisciplinary universities, UCL is a true academic powerhouse - as reflected by performance in a range of international rankings and tables.Find out about UCL's history, key facts and figures and the institution as it is today.About UCLUCL student statistics"
