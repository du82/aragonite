["https://www.ucl.ac.uk/museums-collections/events/2025/feb/prejudice-power-contesting-pseudoscience-superiority"]
title = "Prejudice in Power: Contesting the Pseudoscience of Superiority | Museums and Collections - UCL – University College London"
description = "This exhibition takes a critical look at UCL’s past, present and future relationship to eugenics explored via cultural activism and public art."
full_description = "This exhibition takes a critical look at UCL’s past, present and future relationship to eugenics explored via cultural activism and public art. Housed in the UCL Student Centre, this exhibition explores how eugenics marginalised voices and created structural inequalities which still impact us today. Taking a critical look at UCL’s historical ties to eugenics, it also explores a parallel but untold story of resistance and dissent. The exhibition showcases the outputs of the Prejudice in Power programme, through which communities marginalised by eugenic thinking had the opportunity to respond creatively to UCL’s eugenics legacy. Works produced include artworks, zines, social media content, film and performance pieces. The Prejudice in Power programme was initiated in response to recommendations from a 2018 inquiry into UCL’s eugenics legacy commissioned by UCL’s former President & Provost Michael Arthur. An accompanying digital showcase on the project website provides a larger historical overview of UCL’s ties to eugenics, along with more detailed information about the Prejudice in Power programme. Access to the Student Centre, and all public areas within it, is step-free. Further information can be found on the Library Services accessibility page. The Student Centre is located in Bloomsbury, in the heart of central London. The nearest tube stations are Euston Square (Metropolitan, Circle, Hammersmith & City), Goodge Street (Northern Line), and Warren Street (Victoria Line)."
author = "UCL"
year_published = 2025
year_updated = 2025
