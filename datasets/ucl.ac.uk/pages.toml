["https://www.ucl.ac.uk/news/2022/jun/students-develop-software-revolutionise-computer-use-millions"]
title = "Students develop software to revolutionise computer use for millions | UCL News - UCL – University College London"
description = "Ground-breaking software that allows users to control their PC through their webcam using face and body movements has been developed by a team of UCL Computer Science students in collaboration with Intel, Microsoft, IBM and the NHS."
full_description = "Ground-breaking software that allows users to control their PC through their webcam using face and body movements has been developed by a team of UCL Computer Science students in collaboration with Intel, Microsoft, IBM and the NHS. The software could revolutionise the way that millions of people use computers by allowing those with mobility issues to easily interact with their PCs without the need to buy adapted computers and use pointer devices. It has already been endorsed by charities including the International Alliance of ALS/MND Associations, which supports people with Motor Neurone Disease (MND) around the world and is making a positive impact on people’s daily lives. Former elite gymnast Paris Baker, who won medals for Great Britain at the European and World Championships, was diagnosed with MND at the age of just 26. Now aged 31 and living with the disease, she said after becoming one of the first users of the software: “The potential for MotionInput to change lives is limitless.” Called ‘UCL MotionInput Version 3’, the software removes the need for a keyboard or mouse, allowing users to interact with their computer by moving their hands, fingers, head, eyes, nose, eyebrows, mouth or full body in front of the webcam. They can also simultaneously give spoken commands and dictate text, for example to fill in a website form, captured by their computer microphone. Professor Dean Mohamedally (UCL Computer Science), the academic who led the project and tasked the team of 54 students with developing the software, said: “We initially worked on the software in response to the Covid-19 pandemic as a means of supporting NHS frontline staff. We wanted a way to help prevent the spread of viruses and other bugs by enabling medical staff to use communal computers without touching the keyboard or mouse, but the applications are much further reaching than that.” “It is unique in that it can be used on the majority of Windows PCs and doesn’t require any specific equipment other than the webcam and microphone, which most laptops already have, meaning there are very few barriers to access. People don’t need pointers, or a mouse, to move a cursor. They can simply raise an eyebrow or open their mouth to click and use their eyes to direct the cursor."
