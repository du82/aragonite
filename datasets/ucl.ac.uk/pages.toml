["https://www.ucl.ac.uk/news/2022/apr/warming-climate-and-agriculture-halve-insect-populations-some-areas"]
title = "Warming climate and agriculture halve insect populations in some areas | UCL News - UCL – University College London"
description = "Climate change and intensive agricultural land use have already been responsible for a 49% reduction in the number of insects in the most impacted parts of the world, finds a new study by UCL researchers."
full_description = "Climate change and intensive agricultural land use have already been responsible for a 49% reduction in the number of insects in the most impacted parts of the world, finds a new study by UCL researchers. The study published in Nature is the first to identify that an interaction between rising temperatures and land use changes, is driving widespread losses in numerous insect groups across the globe. Lead author Dr Charlie Outhwaite (UCL Centre for Biodiversity & Environment Research, UCL Biosciences) said: “Many insects appear to be very vulnerable to human pressures, which is concerning as climate change worsens and agricultural areas continue to expand. Our findings highlight the urgency of actions to preserve natural habitats, slow the expansion of high-intensity agriculture, and cut emissions to mitigate climate change. “Losing insect populations could be harmful not only to the natural environment, where insects often play key roles in local ecosystems, but it could also harm human health and food security, particularly with losses of pollinators. “Our findings may only represent the tip of the iceberg as there is limited evidence in some areas, particularly in the tropics which we found have quite high reductions in insect biodiversity in the most impacted areas.” The researchers analysed a large dataset of insect abundance and species richness from areas across the globe, including three-quarters of a million records for nearly 20,000 insect species. The team compared insect biodiversity in different areas depending on how intensive agriculture is in the area, as well as how much historic climate warming the local area has experienced. They found that in areas with high-intensity agriculture and substantial climate warming, the number of insects was 49% lower than in the most natural habitats with no recorded climate warming, while the number of different species was 29% lower. Tropical areas saw the biggest declines in insect biodiversity linked to land use and climate change."
