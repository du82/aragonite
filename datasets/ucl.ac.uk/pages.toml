title = "Engage with us | Engage - UCL – University College London"
description = "Discover the many ways you can connect with UCL, and how we work with industry, government and not-for-profit organisations to tackle tough challenges."
full_description = "Engage with us Discover the many ways you can connect with UCL, and how we work with industry, government and not-for-profit organisations to tackle tough challenges. Alumni Your relationship with UCL continues long after graduation; through events, newsletters and opportunities to give back, we’ll keep you connected to UCL. Welcome to your global alumni community. Global Engagement As London's Global University, we're creating opportunities for communities and industries in our home city of London and around the globe. Find out how your organisation can collaborate with us. Industry and Business Partnerships Connect with the experts whose networks, knowledge and insights could transform your organisation, through partnerships, consultancies, licensing opportunities, access to talent and more. Public Policy We connect policy professionals with UCL's research and expertise. Our service is independent and non-partisan to enable informed, evidence-based decision-making. Find out more and get in touch. Research Discover opportunities for collaboration, learn about our latest research outputs, find an expert and explore how our research is changing the world. Schools and Priority Groups Our innovative, evidence-led work shapes national direction, working at all levels from primary through to mature students returning to education. Find out about our activities and how to get involved. Our campus is open to all Public events Talks, seminars, workshops, lectures, performances and exhibitions are open to everyone. There are both in-person and virtual events available. Find out more and book your place. Lunch hour lectures UCL's popular public Lunch Hour Lecture series has been running at UCL since 1942, and showcases the exceptional research work being undertaken across UCL. Lectures are free and open to all. Museums, galleries and theatres Did you know UCL is home to a family of world-class museums, galleries and theatres? From art to animals, archaeology to performance, science and beyond, there’s lots to explore on campus and online. Library exhibitions Learn more about UCL Library Services exhibitions, including our annual Main Library exhibition and Student Centre displays. All exhibitions are free and open to the public. Campus tours UCL’s campus sits in the heart of London and is home to more than 40,000 students and 15,000 staff. Whether you are a prospective student or visiting London, why don’t you explore our campus and learn more about UCL’s rich and radical history. Find out how we change lives through working with othersFunnelback feed: https://cms-feed.ucl.ac.uk/s/search.json?collection=drupal-office-vice-p...Double click the feed URL above to editView our talks, seminars, lectures and exhibitionsFunnelback feed: https://cms-feed.ucl.ac.uk/s/search.json?collection=drupal-meta-events&m...Double click the feed URL above to edit"
