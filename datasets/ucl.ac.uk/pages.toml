["https://www.ucl.ac.uk/news/2025/feb/our-mental-health-and-wellbeing-may-be-better-morning"]
title = "Our mental health and wellbeing may be better in the morning | UCL News - UCL – University College London"
description = "Generally, things really do seem better in the morning, with clear patterns across time of day in how we report our mental health and wellbeing, suggest the findings of a large study led by researchers at UCL."
full_description = "Generally, things really do seem better in the morning, with clear patterns across time of day in how we report our mental health and wellbeing, suggest the findings of a large study led by researchers at UCL. The findings, published in the open access journal BMJ Mental Health, suggest that people generally wake up feeling in the best frame of mind in the morning but in the worst around midnight, with day of the week and season also playing their part. But the researchers caution that the findings need to be replicated in other studies to be sure they are a true picture. Relatively few studies have looked at how mental health and wellbeing might change over the course of the day, and those that have tended to use small and selective samples, the researchers said. The team therefore wanted to explore whether time of day was associated with variations in mental health (depressive and/or anxiety symptoms), happiness (hedonic wellbeing), life satisfaction, sense of life being worthwhile (eudemonic wellbeing) and loneliness (social wellbeing). They also wanted to find out if these associations varied by day, season, and year. Lead author Dr Feifei Bu, from UCL’s Department of Behavioural Science & Health, said: “Our findings suggest that on average, people’s mental health and wellbeing are better in the morning and worst at midnight. We drew on a large sample of repeated data – nearly a million survey responses from 49,000 participants over two years. “However, this pattern could reflect when people choose to respond to the survey, rather than a direct effect of time of day. For example, those already feeling better in the morning might be more likely to engage with the survey at that time. “While these findings are intriguing, they need to be replicated in other studies that fully account for this potential bias. If validated, this could have important practical implications. Researchers investigating people’s mental health and wellbeing should take into account the time of day people respond. Mental health support services might consider adjusting resources to match fluctuating needs across the day—for instance, prioritising late-night availability.”"
author = "UCL"
year_published = 2025
year_updated = 2025
