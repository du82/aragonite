["https://www.ucl.ac.uk/news/2025/feb/hrh-princess-royal-visits-ucls-new-campus"]
title = "HRH The Princess Royal visits UCL’s new campus | UCL News - UCL – University College London"
description = "Her Royal Highness The Princess Royal saw groundbreaking UCL research in action in areas ranging from ecology and AI to robotics, healthcare and hydrogen technology on a tour of the new UCL East campus on Queen Elizabeth Olympic Park in Stratford, east London today."
full_description = "Her Royal Highness The Princess Royal saw groundbreaking UCL research in action in areas ranging from ecology and AI to robotics, healthcare and hydrogen technology on a tour of the new UCL East campus on Queen Elizabeth Olympic Park in Stratford, east London today. The Princess was visiting the campus in her role as Chancellor of the University of London, of which UCL is a member institution, to see how bringing disciplines together in cutting-edge research centres with first-in-the-world degree programmes is driving solutions to global challenges. The occasion also marked Her Royal Highness’s first visit to East Bank, the UK’s newest cultural quarter, where the UCL East campus is located on the Park, along the river from Sadler’s Wells East, UAL’s London College of Fashion, BBC Music Studios and V&A East Museum and Storehouse. During her visit, which began in the campus’s Marshgate building, The Princess Royal watched a demonstration by UCL Robotics and Autonomous Systems researchers who are using AI to train robots to help with search and rescue operations in dangerous terrains and to make surgery safer and more precise. The Princess then learned about advances being made in electrifying aircraft in the UCL Advanced Propulsion Lab, including a vertical take-off and landing aircraft set to improve the safety and cost of air travel. The Princess Royal also saw how this battery electric aircraft technology is transferring to electric vehicles to help reduce further the world's reliance on fossil fuels. Her Royal Highness then crossed over to the campus’ One Pool Street building, which houses the UCL People and Nature Lab, an interdisciplinary hub exploring innovative solutions for a more sustainable relationship between people and nature, in the face of biodiversity loss, global ecosystem degradation and climate change. The Princess Royal watched students demonstrating new technologies in environmental sensing and explored a virtual coral reef. The Princess also spoke to researchers collaborating with local communities through citizen science projects to gather data on water quality to improve the health of the River Lea, which runs through the UCL East campus."
