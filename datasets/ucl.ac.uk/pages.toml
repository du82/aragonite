["https://www.ucl.ac.uk/lccos/library-culture-collections-and-open-science-lccos"]
title = "Library, Culture, Collections and Open Science (LCCOS) | UCL Library, Culture, Collections & Open Science - UCL – University College London"
description = "Library, Culture, Collections and Open Science (LCCOS) is a department within the Office of the UCL Vice-Provost (Faculties). We provide outstanding staff, services and resources to support the world-class research, education and enterprise that is undertaken in UCL. We connect the world with UCL through innovative programming and engagement activities. We are the home of the Office for Open Science and Scholarship and a partner in the UCL Research Institute for Collections. LCCOS was formed in December 2021 and we are working to update the websites of our services to reflect our new identity."
full_description = "Library, Culture, Collections and Open Science (LCCOS) Library, Culture, Collections and Open Science (LCCOS) is a department within the Office of the UCL Vice-Provost (Faculties). We provide outstanding staff, services and resources to support the world-class research, education and enterprise that is undertaken in UCL. We connect the world with UCL through innovative programming and engagement activities. We are the home of the Office for Open Science and Scholarship and a partner in the UCL Research Institute for Collections. LCCOS was formed in December 2021 and we are working to update the websites of our services to reflect our new identity. Library Services UCL Library Services supports learning, teaching and research at UCL and includes libraries and learning spaces located across London, covering a wide range of specialist subjects. Office for Open Science and Scholarship The UCL Office for Open Science and Scholarship supports the UCL community in the adoption of Open practices and approaches. Museums The Grant Museum of Zoology, the Petrie Museum of Egyptian Archaeology, the UCL Art Museum and the UCL Pathology Museum curate and animate collections to support learning and cultural engagement. Find out What's On. Bloomsbury Theatre and Studio The Bloomsbury Theatre & Studio supports theatre related research and student activity at UCL, as well as hosting the very best of international artists. Includes UCL Event Ticketing service. Find out What’s On. Collections Find out more about our Science Collections, UCL object collections beyond our museums, and about our printed and digital library collections. Public Programmes Find out about our exhibitions and related events, and our cultural programmes. Public Engagement UCL's Co-Production and Public Engagement team supports staff and students to engage with public groups and communities outside UCL. About LCCOS Find out about how LCCOS is organised. LCCOS Strategy 2024-2027 LCCOS brings together some 450 staff across libraries, museums, theatre and public engagement. This new strategy will build on our collective successes and enable the flourishing of arts and cultural activities at UCL."
