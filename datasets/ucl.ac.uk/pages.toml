["https://ucl.ac.uk/about/who/history"]
title = "History | About UCL - UCL – University College London"
description = "Neuroscientist, entrepreneur and artificial intelligence pioneer Sir Demis Hassabis, a UCL alumnus who has retained close connections to the university, has been awarded the 2024 Nobel Prize in Chemistry. Sir Demis completed a PhD in Cognitive Neuroscience at UCL in 2009 before continuing as a post-doc at the Gatsby Computational Neuroscience Unit at UCL (the unit’s founder was also awarded a Nobel Prize), and then went on to co-found a London-based machine learning AI startup, Google DeepMind. Find out more"
full_description = '''UCL has a history of academic excellence and is consistently ranked amongst the world’s top universities, with many of our institutions leading their field. Renowned for world-class research, global influence and impact across a broad range of subject areas – our reputation attracts and empowers the best and bravest of thinkers, creating a home for the thought leaders of today and tomorrow.Use the tabs below to explore a few highlights of UCL's history. A detailed look at UCL's history can be found in The World of UCL.Nobel prize winnersFamous alumniAchievementsUniversity developmentsNow counting 32 Nobel laureates2020s2024: Sir Demis Hassabis – computational protein design and protein structure predictionNeuroscientist, entrepreneur and artificial intelligence pioneer Sir Demis Hassabis, a UCL alumnus who has retained close connections to the university, has been awarded the 2024 Nobel Prize in Chemistry. Sir Demis completed a PhD in Cognitive Neuroscience at UCL in 2009 before continuing as a post-doc at the Gatsby Computational Neuroscience Unit at UCL (the unit’s founder was also awarded a Nobel Prize), and then went on to co-found a London-based machine learning AI startup, Google DeepMind. Find out more2024: Professor Geoffrey E. Hinton – pioneering work in artificial intelligenceProfessor Geoffrey E. Hinton, who founded the Gatsby Computational Neuroscience Unit at UCL, has been awarded the Nobel Prize in Physics for his pioneering work that enabled artificial intelligence used today. Professor Hinton, who was born in London in 1947, is sometimes known as the “Godfather of AI” for his work on artificial neural networks that paved the way for current AI systems such as ChatGPT. Find out more2020: Professor Sir Roger Penrose – black holes researchProfessor Sir Roger Penrose, who was an undergraduate at UCL, is among three scientists to have been awarded the Nobel Prize in Physics for work relating to black holes - “for the discovery of a supermassive compact object at the centre of our galaxy”. Sir Roger, born in 1931, graduated with a first-class Mathematics degree at UCL in 1952. He was made an Honorary Fellow of UCL in 1975, and is UCL's 30th Nobel laureate. Find out more2010s2014: Professor John O'Keefe – the brain's 'inner GPS'Professor John O’Keefe, Director of the Sainsbury Wellcome Centre for Neural Circuits & Behaviour at UCL, is awarded the 2014 Nobel Prize in Physiology or Medicine for the discovery of cells that constitute a positioning system in the brain - an ‘inner GPS’ - that enables us to orient ourselves.2013: Professor James E. Rothman – a major transport system in our cellsJames Rothman shares the Nobel Prize in Physiology or Medicine with Randy W. Schekman and Thomas C. Südhof “for their discoveries of machinery regulating vesicle traffic, a major transport system in our cells”. Professor Rothman is establishing a laboratory at UCL under the Yale-UCL collaboration.2013: Professor Peter Higgs – origin of mass of subatomic particlesPeter Higgs and François Englert win the Nobel Prize in Physics “for the theoretical discovery of a mechanism that contributes to our understanding of the origin of mass of subatomic particles, and which recently was confirmed through the discovery of the predicted fundamental particle, by the ATLAS and CMS experiments at CERN’s Large Hadron Collider”. Higgs studied at UCL before going on to become a lecturer in mathematics.2000s2009: Professor Charles Kao – transmission of light in fibres for optical communicationCharles Kao is a pioneer in the development and use of fibre optics in telecommunications and in 2009 is awarded the Nobel Prize for his "groundbreaking achievements concerning the transmission of light in fibres for optical communication". Kao, who is known as the 'Godfather of Broadband', received his PhD degree in electrical engineering in 1965 from UCL.2007: Professor Sir Martin Evans – gene modifications in miceSir Martin Evans wins the Nobel Prize for "discoveries of principles for introducing specific gene modifications in mice by the use of embryonic stem cells". Today, genetically modified mice are considered vital for medical research.2001: Sir Paul Nurse – key regulators of the cell cycleSir Paul Nurse, Leland H. Hartwell and Tim Hunt win the Nobel Prize in Physiology or Medicine “for their discoveries of key regulators of the cell cycle”. Sir Paul goes on to become the first Director of the Francis Crick Institute, in which UCL is a founding partner.2000: Professor James Heckman – analysing selective samples in EconomicsJames Heckman wins the Nobel Prize in Economics "for his development of theory and methods for analysing selective samples". At UCL, Professor Heckman holds the Distinguished Chair of Economics.1990s1991: Professor Bert Sakmann – single ion channels in cellsBert Sakmann shares the Nobel Prize in Physiology or Medicine "for discoveries concerning the function of single ion channels in cells" and the invention of the patch clamp. In 1971, Sakmann moved from Munich to UCL, where he worked in the Department of Biophysics under Bernard Katz.1980s1988: Professor Sir James Black – propranolol and cimetidine developmentSir James Black is awarded the Nobel Prize in Physiology or Medicine for work leading to the development of propranolol and cimetidine, a drug used to treat stomach ulcers. He spent his career teaching and carrying out research in several universities in the UK.1970s1970: Professor Ulf Svante von Euler – humoral transmittors in nerve terminalsAlongside Sir Bernard Katz and Julius Axelrod, Ulf Svante von Euler wins the Nobel Prize in Physiology or Medicine in 1970 "for their discoveries concerning the humoral transmittors in the nerve terminals and the mechanism for their storage, release and inactivation". Von Euler’s father Hans von Euler-Chelpin won the Nobel Prize in 1929 for his research in the field of Chemistry.1970: Professor Sir Bernard Katz – humoral transmittors in the nerve terminalsFor his PhD, Sir Bernard Katz studies under Professor A. V. Hill at UCL, after which he leaves to continue his research in Australia. He returns to UCL once again in 1946, rejoining A. V. Hill's research unit as Assistant Director of Research and Henry Head Research Fellow (appointed by the Royal Society). Alongside Professor Ulf Svante von Euler and Julius Axelrod, he is awarded the Nobel Prize in Physiology or Medicine "for discoveries concerning the humoral transmittors in the nerve terminals and the mechanism for their storage, release and inactivation".1960s1967: George Porter (Baron Porter of Luddenham) – fast chemical reactions and short pulses of energyBaron Porter of Luddenham, Manfred Eigen and Ronald G. W. Norrish win the Nobel Prize in Chemistry "for their studies of extremely fast chemical reactions, effected by disturbing the equilibrium by means of very short pulses of energy". The same year, Baron Porter becomes Visiting Professor at UCL.1963: Professor Andrew Fielding Huxley – ionic mechanisms and the nerve cell membraneIn 1960, Andrew Fielding Huxley becomes head of the Department of Physiology at UCL and wins the Nobel Prize in Physiology or Medicine in 1963 during his tenure. He is awarded the Prize alongside Sir John Eccles and Alan L. Hodgkin "for their discoveries concerning the ionic mechanisms involved in excitation and inhibition in the peripheral and central portions of the nerve cell membrane".1962: Professor Francis Harry Compton Crick – molecular structure of nucleic acidsFrancis Crick, his good friend James Watson and Maurice Wilkins are awarded the Nobel Prize in Physiology or Medicine in 1962 "for their discoveries concerning the molecular structure of nucleic acids and its significance for information transfer in living material". Around the same time, he is also elected as a Fellow of UCL where he had obtained his BSc in Physics.1960: Professor Peter Brian Medawar – acquired immunological toleranceIn 1951, Peter Medawar is appointed Jodrell Professor of Zoology at UCL, where he remains until 1962. During this time, he is awarded the Nobel Prize in Physiology or Medicine "for the discovery of acquired immunological tolerance".1950s1959: Professor Jaroslav Heyrovsky – polarographic methods of analysis in electrochemistryStudying under Sir William Ramsay, W. C. Mc. C. Lewis and F. G. Donnan during his time at UCL, Jaroslav Heyrovsky becomes particularly interested in working on electrochemistry. He is awarded the Nobel Prize in Chemistry in 1959 "for his discovery and development of the polarographic methods of analysis".1955: Professor Vincent du Vigneaud – biochemically important sulphur compoundsVincent du Vigneaud wins the Nobel Prize in 1955 "for his work on biochemically important sulphur compounds, especially for the first synthesis of a polypeptide hormone". Du Vigneaud spent much time in both the United States and England where he carried out his research.1940s1947: Professor Sir Robert Robinson – plant products of biological importanceConsidered one of the great synthetic organic chemists of the 20th century, Sir Robert Robinson wins the Nobel Prize in Chemistry in 1947 “for his investigations on plant products of biological importance, especially the alkaloids”.1944: Professor Otto Hahn – fission of heavy nucleiAlthough Otto Hahn's research was interrupted by his service in the First World War, he went on to receive the Nobel Prize in Chemistry 1945 (one year after it was awarded to him) "for his discovery of the fission of heavy nuclei".1930s1939: Professor Corneille Jean Francois Heymans – sinus and aortic mechanisms in respirationCorneille Jean Francois Heymans is awarded the Nobel Prize in Physiology or Medicine "for the discovery of the role played by the sinus and aortic mechanisms in the regulation of respiration". Heymans worked in Ernest Starling’s laboratory at UCL.1936: Professor Otto Loewi – chemical transmission of nerve impulsesLoewi is jointly awarded the Nobel Prize in Physiology or Medicine with Sir Henry Hallett Dale “for their discoveries relating to chemical transmission of nerve impulses”. Loewi met Dale while working in Ernest Starling's laboratory at UCL, where they became lifelong friends.1936: Sir Henry Hallett Dale – chemical transmission of nerve impulsesSir Henry Hallett Dale and his lifelong friend Otto Loewi, whom he met while carrying out research at UCL, win the Nobel Prize in Physiology or Medicine in 1936 "for their discoveries relating to chemical transmission of nerve impulses".1920s1929: Sir Frederick Gowland Hopkins – discovery of the growth-stimulating vitaminsAt the age of 22, Sir Frederick Hopkins goes to UCL where he takes the Associateship Examination of the Institute of Chemistry, later winning the Nobel Prize in Physiology or Medicine for the research that led to his “discovery of the growth-stimulating vitamins".1928: Professor Owen Willans Richardson – thermionic emissionOwen Willans Richardson's research and work on thermionic emission wins him the Nobel Prize in Physics in 1928 and eventually led to the law named after him. Richardson was not however awarded the prize until a year later, in 1929.1922: Professor Archibald Vivian Hill – production of heat in the muscleArchibald Vivian Hill wins the Nobel Prize in 1922 (not receiving the prize until the following year, however) "for his discovery relating to the production of heat in the muscle". The Nobel Prize in Physiology or Medicine is divided equally between himself and German scientist Otto Fritz Meyerhof.1921: Professor Frederick Soddy – chemistry of radioactive substancesWorking at UCL with Sir William Ramsay, Frederick Soddy makes significant advancement in his study of radium emanation and is awarded the Nobel Prize in Chemistry "for his contributions to our knowledge of the chemistry of radioactive substances, and his investigations into the origin and nature of isotopes".1910s1915: Professor Sir William Henry Bragg – analysis of crystal structureSir William Henry Bragg, who was an honorary doctor of 12 universities, and his son William Lawrence are jointly awarded the Nobel Prize in Physics in 1915 "for their services in the analysis of crystal structure by means of X-rays".It is entirely due to the Braggs' research that X-rays are used as an instrument for the systematic revelation of the way in which crystals are built.1913: Rabindranath Tagore – voice of India's spiritual heritageCelebrated principally for his poetry, Rabindranath Tagore became the voice of India's spiritual heritage. His talent was recognised in 1913 when he was awarded the Nobel Prize in Literature for his "profoundly sensitive, fresh and beautiful verse".1900s1904: Professor Sir William Ramsay – discovery of helium, argon, neon, krypton and xenonHaving discovered the elements helium, argon, neon, krypton and xenon, Sir William Ramsay was awarded the Nobel Prize in Chemistry not only for the discovery but also for his “determination of their place in the Periodic system”.2000s2006: Rob Williams – rowingRob Williams (UCL Biotechnology 2006) wins gold in the lightweight men’s four at the World Rowing Championships in 2010. He follows this success with a silver medal at the 2012 London Olympics.2006: Joshua Hayward – musicJoshua Hayward (UCL Physics 2006) releases his first album Strange House with his band the Horrors in 2007. The band joins Florence and the Machine on their UK and Ireland tour in 2012.2005: Christine Ohuruogu – athleticsChristine Ohuruogu MBE (UCL Linguistics 2005) wins a gold medal at the Beijing Olympics in the 400m.1990s1996: Julian Baggini – publishingJulian Baggini (UCL Philosophy 1996) co-founds The Philosophers’ Magazine in 1997. His book, The Pig That Wants to Be Eaten: And Ninety-Nine Other Thought Experiments, is published in 2005.1996: Coldplay – musicChris Martin (UCL Greek and Latin 1996), Jonny Buckland (UCL Mathematics 1996), Will Champion (UCL Anthropology 1996) and Guy Berryman (UCL Engineering Sciences 1996) meet at Ramsay Hall during Freshers' Week and go on to form Coldplay.1993: Christopher Nolan – filmFormer student Christopher Nolan (UCL English 1993) directs his debut film Following in 1998. He goes on to direct Inception in 2010, shooting some of it in UCL's Gustave Tuck lecture theatre.1992: Justine Frischmann – musicJustine Frischmann (UCL Bartlett 1992) co-founds Suede with then-boyfriend Brett Anderson in 1989. Her new band, Elastica, releases their first album in 1995.1991: Brett Anderson – musicBrett Anderson (UCL Bartlett 1991) hits number one in the UK album charts as vocalist of Suede in 1993. The band breaks up in 2003 but reforms in 2010.1990: Douglas Gordon – filmDouglas Gordon (UCL Slade 1990) wins the Turner Prize in 1996. Zidane, un portrait du 21e siècle, a feature-length film following the French footballer during a match, premieres at the Cannes Film Festival in 2006.1980s1989: Farshid Moussavi – architectureFarshid Moussavi (UCL Bartlett 1989) co'''
