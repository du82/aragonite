cation Team"}]}, "offers": [{"@type": "Offer", "category": "Paid", "price": 124.99, "priceCurrency": "USD"}, {"@type": "Offer", "category": "Subscription"}], "provider": {"@type": "Organization", "name": "Sundog Education by Frank Kane", "sameAs": "www.udemy.com/user/frankkane/"}, "educationalCredentialAwarded": {"@type": "EducationalOccupationalCredential", "name": "Udemy Certificate", "credentialCategory": "Certificate", "url": "https://support.udemy.com/hc/en-us/sections/360011037194-Certificates-of-Completion?type=student"}, "publisher": {"@type": "Organization", "name": "Udemy", "sameAs": "www.udemy.com"}, "audience": {"@type": "Audience", "audienceType": ["Individuals performing a development or data science role seeking certification in machine learning and AWS."]}, "about": {"name": "IT & Software"}}, {"@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "IT & Software", "item": "https://www.udemy.com/courses/it-and-software/"}, {"@type": "ListItem", "position": 2, "name": "IT Certifications", "item": "https://www.udemy.com/courses/it-and-software/it-certification/"}, {"@type": "ListItem", "position": 3, "name": "AWS Certified Machine Learning - Specialty", "item": "https://www.udemy.com/topic/aws-certified-machine-learning-specialty/"}]}]}Preview this courseWhat you'll learnWhat to expect on the AWS Certified Machine Learning Specialty examAmazon SageMaker's built-in machine learning algorithms (XGBoost, BlazingText, Object Detection, etc.)Feature engineering techniques, including imputation, outliers, binning, and normalizationHigh-level ML services: Comprehend, Translate, Polly, Transcribe, Lex, Rekognition, and moreData engineering with S3, Glue, Kinesis, and DynamoDBExploratory data analysis with scikit_learn, Athena, Apache Spark, and EMRDeep learning and hyperparameter tuning of deep neural networksAutomatic model tuning and operations with SageMakerL1 and L2 regularizationApplying security best practices to machine learning pipelinesRequirementsAssociate-level knowledge of AWS services such as EC2Some existing familiarity with machine learningAn AWS account is needed to perform the hands-on lab exercisesDescriptionUpdated for the latest SageMaker features, and Generative AI (LLM's / Bedrock). Happy learning!Nervous about passing the AWS Certified Machine Learning - Specialty exam (MLS-C01)? You should be! There's no doubt it's one of the most difficult and coveted AWS certifications. A deep knowledge of AWS and SageMaker isn't enough to pass this one - you also need deep knowledge of machine learning, and the nuances of feature engineering and model tuning that generally aren't taught in books or classrooms. You just can't prepare enough for this one.This certification prep course is taught by Frank Kane, who spent nine years working at Amazon itself in the field of machine learning. Frank took and passed this exam on the first try, and knows exactly what it takes for you to pass it yourself. Joining Frank in this course is Stephane Maarek, an AWS expert and popular AWS certification instructor on Udemy.In addition to the 15-hour video course, a 30-minute quick assessment practice exam is included that consists of the same topics and style as the real exam. You'll also get four hands-on labs that allow you to practice what you've learned, and gain valuable experience in model tuning, feature engineering, and data engineering.This course is structured into the four domains tested by this exam: data engineering, exploratory data analysis, modeling, and machine learning implementation and operations. Just some of the topics we'll cover include:How generative AI and large language models (LLM's) work, including the Transformer architecture (GPT) and attention-based neural networks (masked self-attention)Amazon's newest generative AI services: Bedrock, SageMaker JumpStart for Generative AI, CodeWhisperer, and SageMaker Foundation ModelsS3 data lakesAWS Glue and Glue ETLKinesis data streams, firehose, and video streamsDynamoDBData Pipelines, AWS Batch, and Step FunctionsUsing scikit_learnData science basicsAthena and QuicksightElastic MapReduce (EMR)Apache Spark and MLLibFeature engineering (imputation, outliers, binning, transforms, encoding, and normalization)Ground TruthDeep Learning basicsTuning neural networks and avoiding overfittingAmazon SageMaker, including SageMaker Studio, SageMaker Model Monitor, SageMaker Autopilot, and SageMaker Debugger.Regularization techniquesEvaluating machine learning models (precision, recall, F1, confusion matrix, etc.)High-level ML services: Comprehend, Translate, Polly, Transcribe, Lex, Rekognition, and moreBuilding recommender systems with Amazon PersonalizeMonitoring industrial equipment with Lookout and MonitronSecurity best practices with machine learning on AWSMachine learning is an advanced certification, and it's best tackled by students who have already obtained associate-level certification in AWS and have some real-world industry experience. This exam is not intended for AWS beginners.If there's a more comprehensive prep course for the AWS Certified Machine Learning - Specialty exam, we haven't seen it. Enroll now, and gain confidence as you walk into that testing center. InstructorMy name is Stéphane Maarek, I am passionate about Cloud Computing, and I will be your instructor in this course. I teach about AWS certifications, focusing on helping my students improve their professional proficiencies in AWS.I have already taught 2,500,000+ students and gotten 800,000+ reviews throughout my career in designing and delivering these certifications and courses!With AWS becoming the centerpiece of today's modern IT architectures, I have decided it is time for students to learn how to be an AWS Machine Learning Professional. So, let’s kick start the course! You are in good hands!InstructorHey, I'm Frank Kane, and I'm also instructing this course. I spent nine years working for Amazon from the inside as a senior engineer and senior manager, where my specialty was recommender systems and machine learning. As an instructor, I'm best known for my top-selling courses in "big data", data analytics, machine learning, Apache Spark, system design, technical management and career growth, and Elasticsearch.I've been teaching on Udemy since 2015, where I've reached over 850,00 students all around the world!I've worked hard to keep this course up to date with the latest developments in AWS machine learning, and to make sure you're prepared for the latest version of this exam. Let's dive in and get you ready!This course also comes with:Lifetime access to all future updatesA responsive instructor in the Q&A SectionUdemy Certificate of Completion Ready for DownloadA 30 Day "No Questions Asked" Money Back Guarantee!Join us in this course if you want to prepare for the AWS Machine Learning Certification and master the AWS platform!Who this course is for:Individuals performing a development or data science role seeking certification in machine learning and AWS.Show moreShow lessFeatured reviewVille M.75 courses6 reviewsRating: 5.0 out of 55 years agoThis was a good course to prepare for the AWS ML Specialty Exam. This covers about anything in high-level detail you need to know in the exam. Labs were also really nice, pretty short and all the relevant content was still managed to get in. Overall, I recommend this course for everyone who are planning to take the exam!Show moreShow lessInstructorsSundog Education by Frank KaneJoin over 900K students learning ML, AI, AWS, and Data Eng.4.6 Instructor Rating169,708 Reviews959,466 Students38 CoursesSundog Education's mission is to make highly valuable career skills in data engineering, data science, generative AI, AWS, and machine learning accessible to everyone in the world. Our consortium of expert instructors shares our knowledge in these emerging fields with you, at prices anyone can afford. Sundog 