title = "Sidebar - shadcn/ui"
description = "A composable, themeable and customizable sidebar component."
full_description = '''Getting Started IntroductionInstallationcomponents.jsonThemingDark modeCLIMonorepoTailwind v4NewNext.js 15 + React 19TypographyOpen in v0BlocksFigmaChangelogInstallation Next.jsViteLaravelReact RouterNewRemixAstroTanstack StartNewManualComponents AccordionAlertAlert DialogAspect RatioAvatarBadgeBreadcrumbButtonCalendarCardCarouselChartCheckboxCollapsibleComboboxCommandContext MenuData TableDate PickerDialogDrawerDropdown MenuFormHover CardInputInput OTPLabelMenubarNavigation MenuPaginationPopoverProgressRadio GroupResizableScroll AreaSelectSeparatorSheetSidebarSkeletonSliderSonnerSwitchTableTabsTextareaToastToggleToggle GroupTooltipRegistry NewIntroductionGetting StartedOpen in v0FAQregistry.jsonregistry-item.jsonDocsSidebarSidebarA composable, themeable and customizable sidebar component.self.__wrap_b=(e,n,l)=>{let s=(l=l||document.querySelector(`[data-br="${e}"]`)).parentElement,r=e=>l.style.maxWidth=e+"px";l.style.maxWidth="";let a=s.clientWidth,c=s.clientHeight,o=a/2-.25,i=a+.5,t;if(a){for(;o+1<i;)r(t=Math.round((o+i)/2)),s.clientHeight===c?i=t:o=t;r(i*n+a*(1-n))}l.__wrap_o||"undefined"!=typeof ResizeObserver&&(l.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+l.dataset.brr,l)})).observe(s)};self.__wrap_b(":R96fnkv9u6ja:",1)A sidebar that collapses to icons. Sidebars are one of the most complex components to build. They are central to any application and often contain a lot of moving parts. I don't like building sidebars. So I built 30+ of them. All kinds of configurations. Then I extracted the core components into sidebar.tsx. We now have a solid foundation to build on top of. Composable. Themeable. Customizable. Browse the Blocks Library. Installation CLIManualRun the following command to install sidebar.tsxpnpmnpmyarnbunpnpm dlx shadcn@latest add sidebar CopyAdd the following colors to your CSS fileThe command above should install the colors for you. If not, copy and paste the following in your CSS file.We'll go over the colors later in the theming section.app/globals.css@layer base { :root { --sidebar-background: 0 0% 98%; --sidebar-foreground: 240 5.3% 26.1%; --sidebar-primary: 240 5.9% 10%; --sidebar-primary-foreground: 0 0% 98%; --sidebar-accent: 240 4.8% 95.9%; --sidebar-accent-foreground: 240 5.9% 10%; --sidebar-border: 220 13% 91%; --sidebar-ring: 217.2 91.2% 59.8%; } .dark { --sidebar-background: 240 5.9% 10%; --sidebar-foreground: 240 4.8% 95.9%; --sidebar-primary: 224.3 76.3% 48%; --sidebar-primary-foreground: 0 0% 100%; --sidebar-accent: 240 3.7% 15.9%; --sidebar-accent-foreground: 240 4.8% 95.9%; --sidebar-border: 240 3.7% 15.9%; --sidebar-ring: 217.2 91.2% 59.8%; } }Copy Structure A Sidebar component is composed of the following parts: SidebarProvider - Handles collapsible state. Sidebar - The sidebar container. SidebarHeader and SidebarFooter - Sticky at the top and bottom of the sidebar. SidebarContent - Scrollable content. SidebarGroup - Section within the SidebarContent. SidebarTrigger - Trigger for the Sidebar. Usage app/layout.tsximport { SidebarProvider, SidebarTrigger } from "@/components/ui/sidebar" import { AppSidebar } from "@/components/app-sidebar" export default function Layout({ children }: { children: React.ReactNode }) { return ( <SidebarProvider> <AppSidebar /> <main> <SidebarTrigger /> {children} </main> </SidebarProvider> ) }Copy components/app-sidebar.tsximport { Sidebar, SidebarContent, SidebarFooter, SidebarGroup, SidebarHeader, } from "@/components/ui/sidebar" export function AppSidebar() { return ( <Sidebar> <SidebarHeader /> <SidebarContent> <SidebarGroup /> <SidebarGroup /> </SidebarContent> <SidebarFooter /> </Sidebar> ) }Copy Your First Sidebar Let's start with the most basic sidebar. A collapsible sidebar with a menu. Add a SidebarProvider and SidebarTrigger at the root of your application.app/layout.tsximport { SidebarProvider, SidebarTrigger } from "@/components/ui/sidebar" import { AppSidebar } from "@/components/app-sidebar" export default function Layout({ children }: { children: React.ReactNode }) { return ( <SidebarProvider> <AppSidebar /> <main> <SidebarTrigger /> {children} </main> </SidebarProvider> ) }CopyCreate a new sidebar component at components/app-sidebar.tsx.components/app-sidebar.tsximport { Sidebar, SidebarContent } from "@/components/ui/sidebar" export function AppSidebar() { return ( <Sidebar> <SidebarContent /> </Sidebar> ) }CopyNow, let's add a SidebarMenu to the sidebar.We'll use the SidebarMenu component in a SidebarGroup.components/app-sidebar.tsximport { Calendar, Home, Inbox, Search, Settings } from "lucide-react" import { Sidebar, SidebarContent, SidebarGroup, SidebarGroupContent, SidebarGroupLabel, SidebarMenu, SidebarMenuButton, SidebarMenuItem, } from "@/components/ui/sidebar" // Menu items. const items = [ { title: "Home", url: "#", icon: Home, }, { title: "Inbox", url: "#", icon: Inbox, }, { title: "Calendar", url: "#", icon: Calendar, }, { title: "Search", url: "#", icon: Search, }, { title: "Settings", url: "#", icon: Settings, }, ] export function AppSidebar() { return ( <Sidebar> <SidebarContent> <SidebarGroup> <SidebarGroupLabel>Application</SidebarGroupLabel> <SidebarGroupContent> <SidebarMenu> {items.map((item) => ( <SidebarMenuItem key={item.title}> <SidebarMenuButton asChild> <a href={item.url}> <item.icon /> <span>{item.title}</span> </a> </SidebarMenuButton> </SidebarMenuItem> ))} </SidebarMenu> </SidebarGroupContent> </SidebarGroup> </SidebarContent> </Sidebar> ) }CopyYou've created your first sidebar.Your first sidebar. Components The components in sidebar.tsx are built to be composable i.e you build your sidebar by putting the provided components together. They also compose well with other shadcn/ui components such as DropdownMenu, Collapsible or Dialog etc. If you need to change the code in sidebar.tsx, you are encouraged to do so. The code is yours. Use sidebar.tsx as a starting point and build your own. In the next sections, we'll go over each component and how to use them. SidebarProvider The SidebarProvider component is used to provide the sidebar context to the Sidebar component. You should always wrap your application in a SidebarProvider component. Props NameTypeDescriptiondefaultOpenbooleanDefault open state of the sidebar.openbooleanOpen state of the sidebar (controlled).onOpenChange(open: boolean) => voidSets open state of the sidebar (controlled). Width If you have a single sidebar in your application, you can use the SIDEBAR_WIDTH and SIDEBAR_WIDTH_MOBILE variables in sidebar.tsx to set the width of the sidebar. components/ui/sidebar.tsxconst SIDEBAR_WIDTH = "16rem" const SIDEBAR_WIDTH_MOBILE = "18rem"Copy For multiple sidebars in your application, you can use the style prop to set the width of the sidebar. To set the width of the sidebar, you can use the --sidebar-width and --sidebar-width-mobile CSS variables in the style prop. components/ui/sidebar.tsx<SidebarProvider style={{ "--sidebar-width": "20rem", "--sidebar-width-mobile": "20rem", }} > <Sidebar /> </SidebarProvider>Copy This will handle the width of the sidebar but also the layout spacing. Keyboard Shortcut The SIDEBAR_KEYBOARD_SHORTCUT variable is used to set the keyboard shortcut used to open and close the sidebar. To trigger the sidebar, you use the cmd+b keyboard shortcut on Mac and ctrl+b on Windows. You can change the keyboard shortcut by updating the SIDEBAR_KEYBOARD_SHORTCUT variable. components/ui/sidebar.tsxconst SIDEBAR_KEYBOARD_SHORTCUT = "b"Copy Persisted State The SidebarProvider supports persisting the sidebar state across page reloads and server-side rendering. It uses cookies to store the current state of the sidebar. When the sidebar state changes, a default cookie named sidebar_state is set with the current open/closed state. This cookie is then read on subsequent page loads to restore the sidebar state. To persist sidebar state in Next.js, set up your SidebarProvider in app/layout.tsx like this: app/layout.tsximport { cookies } from "next/headers" import { SidebarProvider, SidebarTrigger } from "@/components/ui/sidebar" import { AppSidebar } from "@/components/app-sidebar" export async function Layout({ children }: { children: React.ReactNode }) { const cookieStore = await cookies() const defaultOpen = cookieStore.get("sidebar_state")?.value === "true" return ( <SidebarProvider defaultOpen={defaultOpen}> <AppSidebar /> <main> <SidebarTrigger /> {children} </main> </SidebarProvider> ) }Copy You can change the name of the cookie by updating the SIDEBAR_COOKIE_NAME variable in sidebar.tsx. components/ui/sidebar.tsxconst SIDEBAR_COOKIE_NAME = "sidebar_state"Copy Sidebar The main Sidebar component used to render a collapsible sidebar. import { Sidebar } from "@/components/ui/sidebar" export function AppSidebar() { return <Sidebar /> }Copy Props PropertyTypeDescriptionsideleft or rightThe side of the sidebar.variantsidebar, floating, or insetThe variant of the sidebar.collapsibleoffcanvas, icon, or noneCollapsible state of the sidebar. side Use the side prop to change the side of the sidebar. Available options are left and right. import { Sidebar } from "@/components/ui/sidebar" export function AppSidebar() { return <Sidebar side="left | right" /> }Copy variant Use the variant prop to change the variant of the sidebar. Available options are sidebar, floating and inset. import { Sidebar } from "@/components/ui/sidebar" export function AppSidebar() { return <Sidebar variant="sidebar | floating | inset" /> }Copy Note: If you use the inset variant, remember to wrap your main content in a SidebarInset component. <SidebarProvider> <Sidebar variant="inset" /> <SidebarInset> <main>{children}</main> </SidebarInset> </SidebarProvider>Copy collapsible Use the collapsible prop to make the sidebar collapsible. Available options are offcanvas, icon and none. import { Sidebar } from "@/components/ui/sidebar" export function AppSidebar() { return <Sidebar collapsible="offcanvas | icon | none" /> }Copy PropDescriptionoffcanvasA collapsible sidebar that slides in from the left or right.iconA sidebar that collapses to icons.noneA non-collapsible sidebar. useSidebar The useSidebar hook is used to control the sidebar. import { useSidebar } from "@/components/ui/sidebar" export function AppSidebar() { const { state, open, setOpen, openMobile, setOpenMobile, isMobile, toggleSidebar, } = useSidebar() }Copy PropertyTypeDescriptionstateexpanded or collapsedThe current state of the sidebar.openbooleanWhether the sidebar is open.setOpen(open: boolean) => voidSets the open state of the sidebar.openMobilebooleanWhether the sidebar is open on mobile.setOpenMobile(open: boolean) => voidSets the open state of the sidebar on mobile.isMobilebooleanWhether the sidebar is on mobile.toggleSidebar() => voidToggles the sidebar. Desktop and mobile. SidebarHeader Use the SidebarHeader component to add a sticky header to the sidebar. The following example adds a <DropdownMenu> to the SidebarHeader. A sidebar header with a dropdown menu. components/app-sidebar.tsx<Sidebar> <SidebarHeader> <SidebarMenu> <SidebarMenuItem> <DropdownMenu> <DropdownMenuTrigger asChild> <SidebarMenuButton> Select Workspace <ChevronDown className="ml-auto" /> </SidebarMenuButton> </DropdownMenuTrigger> <DropdownMenuContent className="w-[--radix-popper-anchor-width]"> <DropdownMenuItem> <span>Acme Inc</span> </DropdownMenuItem> <DropdownMenuItem> <span>Acme Corp.</span> </DropdownMenuItem> </DropdownMenuContent> </DropdownMenu> </SidebarMenuItem> </SidebarMenu> </SidebarHeader> </Sidebar>Copy SidebarFooter Use the SidebarFooter component to add a sticky footer to the sidebar. The following example adds a <DropdownMenu> to the SidebarFooter. A sidebar footer with a dropdown menu. components/app-sidebar.tsxexport function AppSidebar() { return ( <SidebarProvider> <Sidebar> <SidebarHeader /> <SidebarContent /> <SidebarFooter> <SidebarMenu> <SidebarMenuItem> <DropdownMenu> <DropdownMenuTrigger asChild> <SidebarMenuButton> <User2 /> Username <ChevronUp className="ml-auto" /> </SidebarMenuButton> </DropdownMenuTrigger> <DropdownMenuContent side="top" className="w-[--radix-popper-anchor-width]" > <DropdownMenuItem> <span>Account</span> </DropdownMenuItem> <DropdownMenuItem> <span>Billing</span> </DropdownMenuItem> <DropdownMenuItem> <span>Sign out</span> </DropdownMenuItem> </DropdownMenuContent> </DropdownMenu> </SidebarMenuItem> </SidebarMenu> </SidebarFooter> </Sidebar> </SidebarProvider> ) }Copy SidebarContent The SidebarContent component is used to wrap the content of the sidebar. This is where you add your SidebarGroup components. It is scrollable. import { Sidebar, SidebarContent } from "@/components/ui/sidebar" export function AppSidebar() { return ( <Sidebar> <SidebarContent> <SidebarGroup /> <SidebarGroup /> </SidebarContent> </Sidebar> ) }Copy SidebarGroup Use the SidebarGroup component to create a section within the sidebar. A SidebarGroup has a SidebarGroupLabel, a SidebarGroupContent and an optional SidebarGroupAction. A sidebar group. import { Sidebar, SidebarContent, SidebarGroup } from "@/components/ui/sidebar" export function AppSidebar() { return ( <Sidebar> <SidebarContent> <SidebarGroup> <SidebarGroupLabel>Application</SidebarGroupLabel> <SidebarGroupAction> <Plus /> <span className="sr-only">Add Project</span> </SidebarGroupAction> <SidebarGroupContent></SidebarGroupContent> </SidebarGroup> </SidebarContent> </Sidebar> ) }Copy Collapsible SidebarGroup To make a SidebarGroup collapsible, wrap it in a Collapsible. A collapsible sidebar group. export function AppSidebar() { return ( <Collapsible defaultOpen className="group/collapsible"> <SidebarGroup> <SidebarGroupLabel asChild> <CollapsibleTrigger> Help <ChevronDown className="ml-auto transition-transform group-data-[state=open]/collapsible:rotate-180" /> </CollapsibleTrigger> </SidebarGroupLabel> <CollapsibleContent> <SidebarGroupContent /> </CollapsibleContent> </SidebarGroup> </Collapsible> ) }Copy Note: We wrap the CollapsibleTrigger in a SidebarGroupLabel to render a button. SidebarGroupAction Use the SidebarGroupAction component to add an action button to the SidebarGroup. export function AppSidebar() { return ( <SidebarGroup> <SidebarGroupLabel asChild>Projects</SidebarGroupLabel> <SidebarGroupAction title="Add Project"> <Plus /> <span className="sr-only">Add Project</span> </SidebarGroupAction> <SidebarGroupContent /> </SidebarGroup> ) }Copy A sidebar group with an action button. SidebarMenu The SidebarMenu component is used for building a menu within a SidebarGroup. A SidebarMenu component is composed of SidebarMenuItem, SidebarMenuButton, <SidebarMenuAction /> and <SidebarMenuSub /> components. Here's an example of a SidebarMenu component rendering a list of projects. A sidebar menu with a list of projects. <Sidebar> <SidebarContent> <SidebarGroup> <SidebarGroupLabel>Projects</SidebarGroupLabel> <SidebarGroupContent> <SidebarMenu> {projects.map((project) => ( <SidebarMenuItem key={project.name}> <SidebarMenuButton asCh'''
