title = "Carousel - shadcn/ui"
description = "A carousel with motion and swipe built using Embla."
full_description = 'Getting Started IntroductionInstallationcomponents.jsonThemingDark modeCLIMonorepoTailwind v4NewNext.js 15 + React 19TypographyOpen in v0BlocksFigmaChangelogInstallation Next.jsViteLaravelReact RouterNewRemixAstroTanstack StartNewManualComponents AccordionAlertAlert DialogAspect RatioAvatarBadgeBreadcrumbButtonCalendarCardCarouselChartCheckboxCollapsibleComboboxCommandContext MenuData TableDate PickerDialogDrawerDropdown MenuFormHover CardInputInput OTPLabelMenubarNavigation MenuPaginationPopoverProgressRadio GroupResizableScroll AreaSelectSeparatorSheetSidebarSkeletonSliderSonnerSwitchTableTabsTextareaToastToggleToggle GroupTooltipRegistry NewIntroductionGetting StartedOpen in v0FAQregistry.jsonregistry-item.jsonDocsCarouselCarouselA carousel with motion and swipe built using Embla.self.__wrap_b=(e,n,l)=>{let s=(l=l||document.querySelector(`[data-br="${e}"]`)).parentElement,r=e=>l.style.maxWidth=e+"px";l.style.maxWidth="";let a=s.clientWidth,c=s.clientHeight,o=a/2-.25,i=a+.5,t;if(a){for(;o+1<i;)r(t=Math.round((o+i)/2)),s.clientHeight===c?i=t:o=t;r(i*n+a*(1-n))}l.__wrap_o||"undefined"!=typeof ResizeObserver&&(l.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+l.dataset.brr,l)})).observe(s)};self.__wrap_b(":R96fnkv9u6ja:",1)DocsAPI ReferencePreviewCodeStyle: Open in Copy12345Previous slideNext slide About The carousel component is built using the Embla Carousel library. Installation CLIManualpnpmnpmyarnbunpnpm dlx shadcn@latest add carousel Copy Usage import { Carousel, CarouselContent, CarouselItem, CarouselNext, CarouselPrevious, } from "@/components/ui/carousel"Copy <Carousel> <CarouselContent> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> </CarouselContent> <CarouselPrevious /> <CarouselNext /> </Carousel>Copy Examples Sizes To set the size of the items, you can use the basis utility class on the <CarouselItem />. PreviewCodeStyle: Open in Copy12345Previous slideNext slide Example// 33% of the carousel width. <Carousel> <CarouselContent> <CarouselItem className="basis-1/3">...</CarouselItem> <CarouselItem className="basis-1/3">...</CarouselItem> <CarouselItem className="basis-1/3">...</CarouselItem> </CarouselContent> </Carousel>Copy Responsive// 50% on small screens and 33% on larger screens. <Carousel> <CarouselContent> <CarouselItem className="md:basis-1/2 lg:basis-1/3">...</CarouselItem> <CarouselItem className="md:basis-1/2 lg:basis-1/3">...</CarouselItem> <CarouselItem className="md:basis-1/2 lg:basis-1/3">...</CarouselItem> </CarouselContent> </Carousel>Copy Spacing To set the spacing between the items, we use a pl-[VALUE] utility on the <CarouselItem /> and a negative -ml-[VALUE] on the <CarouselContent />. Why: I tried to use the gap property or a grid layout on the <CarouselContent /> but it required a lot of math and mental effort to get the spacing right. I found pl-[VALUE] and -ml-[VALUE] utilities much easier to use.You can always adjust this in your own project if you need to. PreviewCodeStyle: Open in Copy12345Previous slideNext slide Example<Carousel> <CarouselContent className="-ml-4"> <CarouselItem className="pl-4">...</CarouselItem> <CarouselItem className="pl-4">...</CarouselItem> <CarouselItem className="pl-4">...</CarouselItem> </CarouselContent> </Carousel>Copy Responsive<Carousel> <CarouselContent className="-ml-2 md:-ml-4"> <CarouselItem className="pl-2 md:pl-4">...</CarouselItem> <CarouselItem className="pl-2 md:pl-4">...</CarouselItem> <CarouselItem className="pl-2 md:pl-4">...</CarouselItem> </CarouselContent> </Carousel>Copy Orientation Use the orientation prop to set the orientation of the carousel. PreviewCodeStyle: Open in Copy12345Previous slideNext slide <Carousel orientation="vertical | horizontal"> <CarouselContent> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> </CarouselContent> </Carousel>Copy Options You can pass options to the carousel using the opts prop. See the Embla Carousel docs for more information. <Carousel opts={{ align: "start", loop: true, }} > <CarouselContent> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> </CarouselContent> </Carousel>Copy API Use a state and the setApi props to get an instance of the carousel API. PreviewCodeStyle: Open in Copy12345Previous slideNext slideSlide 0 of 0 import { type CarouselApi } from "@/components/ui/carousel" export function Example() { const [api, setApi] = React.useState<CarouselApi>() const [current, setCurrent] = React.useState(0) const [count, setCount] = React.useState(0) React.useEffect(() => { if (!api) { return } setCount(api.scrollSnapList().length) setCurrent(api.selectedScrollSnap() + 1) api.on("select", () => { setCurrent(api.selectedScrollSnap() + 1) }) }, [api]) return ( <Carousel setApi={setApi}> <CarouselContent> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> </CarouselContent> </Carousel> ) }Copy Events You can listen to events using the api instance from setApi. import { type CarouselApi } from "@/components/ui/carousel" export function Example() { const [api, setApi] = React.useState<CarouselApi>() React.useEffect(() => { if (!api) { return } api.on("select", () => { // Do something on select. }) }, [api]) return ( <Carousel setApi={setApi}> <CarouselContent> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> <CarouselItem>...</CarouselItem> </CarouselContent> </Carousel> ) }Copy See the Embla Carousel docs for more information on using events. Plugins You can use the plugins prop to add plugins to the carousel. import Autoplay from "embla-carousel-autoplay" export function Example() { return ( <Carousel plugins={[ Autoplay({ delay: 2000, }), ]} > // ... </Carousel> ) }Copy PreviewCodeStyle: Open in Copy12345Previous slideNext slide See the Embla Carousel docs for more information on using plugins.CardChartOn This PageAboutInstallationUsageExamplesSizesSpacingOrientationOptionsAPIEventsPluginsDeploy your shadcn/ui app on VercelTrusted by OpenAI, Sonos, Chick-fil-A, and more.Vercel provides tools and infrastructure to deploy apps and features at scale.Deploy NowDeploy to Vercel'
