description = "Accessible one-time password component with copy paste functionality."
full_description = '''Getting Started IntroductionInstallationcomponents.jsonThemingDark modeCLIMonorepoTailwind v4NewNext.js 15 + React 19TypographyOpen in v0BlocksFigmaChangelogInstallation Next.jsViteLaravelReact RouterNewRemixAstroTanstack StartNewManualComponents AccordionAlertAlert DialogAspect RatioAvatarBadgeBreadcrumbButtonCalendarCardCarouselChartCheckboxCollapsibleComboboxCommandContext MenuData TableDate PickerDialogDrawerDropdown MenuFormHover CardInputInput OTPLabelMenubarNavigation MenuPaginationPopoverProgressRadio GroupResizableScroll AreaSelectSeparatorSheetSidebarSkeletonSliderSonnerSwitchTableTabsTextareaToastToggleToggle GroupTooltipRegistry NewIntroductionGetting StartedOpen in v0FAQregistry.jsonregistry-item.jsonDocsInput OTPInput OTPAccessible one-time password component with copy paste functionality.self.__wrap_b=(e,n,l)=>{let s=(l=l||document.querySelector(`[data-br="${e}"]`)).parentElement,r=e=>l.style.maxWidth=e+"px";l.style.maxWidth="";let a=s.clientWidth,c=s.clientHeight,o=a/2-.25,i=a+.5,t;if(a){for(;o+1<i;)r(t=Math.round((o+i)/2)),s.clientHeight===c?i=t:o=t;r(i*n+a*(1-n))}l.__wrap_o||"undefined"!=typeof ResizeObserver&&(l.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+l.dataset.brr,l)})).observe(s)};self.__wrap_b(":R96fnkv9u6ja:",1)DocsPreviewCodeStyle: Open in Copy<style> [data-input-otp] { --nojs-bg: white !important; --nojs-fg: black !important; background-color: var(--nojs-bg) !important; color: var(--nojs-fg) !important; caret-color: var(--nojs-fg) !important; letter-spacing: .25em !important; text-align: center !important; border: 1px solid var(--nojs-fg) !important; border-radius: 4px !important; width: 100% !important; } @media (prefers-color-scheme: dark) { [data-input-otp] { --nojs-bg: black !important; --nojs-fg: white !important; } }</style> About Input OTP is built on top of input-otp by @guilherme_rodz. Installation CLIManualRun the following command:pnpmnpmyarnbunpnpm dlx shadcn@latest add input-otp CopyUpdate tailwind.config.jsAdd the following animations to your tailwind.config.js file:tailwind.config.js/** @type {import('tailwindcss').Config} */ module.exports = { theme: { extend: { keyframes: { "caret-blink": { "0%,70%,100%": { opacity: "1" }, "20%,50%": { opacity: "0" }, }, }, animation: { "caret-blink": "caret-blink 1.25s ease-out infinite", }, }, }, }Copy Usage import { InputOTP, InputOTPGroup, InputOTPSeparator, InputOTPSlot, } from "@/components/ui/input-otp"Copy <InputOTP maxLength={6}> <InputOTPGroup> <InputOTPSlot index={0} /> <InputOTPSlot index={1} /> <InputOTPSlot index={2} /> </InputOTPGroup> <InputOTPSeparator /> <InputOTPGroup> <InputOTPSlot index={3} /> <InputOTPSlot index={4} /> <InputOTPSlot index={5} /> </InputOTPGroup> </InputOTP>Copy Examples Pattern Use the pattern prop to define a custom pattern for the OTP input. PreviewCodeStyle: Open in Copy<style> [data-input-otp] { --nojs-bg: white !important; --nojs-fg: black !important; background-color: var(--nojs-bg) !important; color: var(--nojs-fg) !important; caret-color: var(--nojs-fg) !important; letter-spacing: .25em !important; text-align: center !important; border: 1px solid var(--nojs-fg) !important; border-radius: 4px !important; width: 100% !important; } @media (prefers-color-scheme: dark) { [data-input-otp] { --nojs-bg: black !important; --nojs-fg: white !important; } }</style> import { REGEXP_ONLY_DIGITS_AND_CHARS } from "input-otp" ... <InputOTP maxLength={6} pattern={REGEXP_ONLY_DIGITS_AND_CHARS} > <InputOTPGroup> <InputOTPSlot index={0} /> {/* ... */} </InputOTPGroup> </InputOTP>Copy Separator You can use the <InputOTPSeparator /> component to add a separator between the input groups. PreviewCodeStyle: Open in Copy<style> [data-input-otp] { --nojs-bg: white !important; --nojs-fg: black !important; background-color: var(--nojs-bg) !important; color: var(--nojs-fg) !important; caret-color: var(--nojs-fg) !important; letter-spacing: .25em !important; text-align: center !important; border: 1px solid var(--nojs-fg) !important; border-radius: 4px !important; width: 100% !important; } @media (prefers-color-scheme: dark) { [data-input-otp] { --nojs-bg: black !important; --nojs-fg: white !important; } }</style> import { InputOTP, InputOTPGroup, InputOTPSeparator, InputOTPSlot, } from "@/components/ui/input-otp" ... <InputOTP maxLength={4}> <InputOTPGroup> <InputOTPSlot index={0} /> <InputOTPSlot index={1} /> </InputOTPGroup> <InputOTPSeparator /> <InputOTPGroup> <InputOTPSlot index={2} /> <InputOTPSlot index={3} /> </InputOTPGroup> </InputOTP>Copy Controlled You can use the value and onChange props to control the input value. PreviewCodeStyle: Copy<style> [data-input-otp] { --nojs-bg: white !important; --nojs-fg: black !important; background-color: var(--nojs-bg) !important; color: var(--nojs-fg) !important; caret-color: var(--nojs-fg) !important; letter-spacing: .25em !important; text-align: center !important; border: 1px solid var(--nojs-fg) !important; border-radius: 4px !important; width: 100% !important; } @media (prefers-color-scheme: dark) { [data-input-otp] { --nojs-bg: black !important; --nojs-fg: white !important; } }</style>Enter your one-time password. Form PreviewCodeStyle: CopyOne-Time Password<style> [data-input-otp] { --nojs-bg: white !important; --nojs-fg: black !important; background-color: var(--nojs-bg) !important; color: var(--nojs-fg) !important; caret-color: var(--nojs-fg) !important; letter-spacing: .25em !important; text-align: center !important; border: 1px solid var(--nojs-fg) !important; border-radius: 4px !important; width: 100% !important; } @media (prefers-color-scheme: dark) { [data-input-otp] { --nojs-bg: black !important; --nojs-fg: white !important; } }</style>Please enter the one-time password sent to your phone.Submit Changelog 2024-03-19 Composition We've made some updates and replaced the render props pattern with composition. Here's how to update your code if you prefer the composition pattern. Note: You are not required to update your code if you are using the render prop. It is still supported. Update to the latest version of input-otp.pnpmnpmyarnbunpnpm add input-otp@latest CopyUpdate input-otp.tsxinput-otp.tsx- import { OTPInput, SlotProps } from "input-otp" + import { OTPInput, OTPInputContext } from "input-otp" const InputOTPSlot = React.forwardRef< React.ElementRef<"div">, - SlotProps & React.ComponentPropsWithoutRef<"div"> - >(({ char, hasFakeCaret, isActive, className, ...props }, ref) => { + React.ComponentPropsWithoutRef<"div"> & { index: number } + >(({ index, className, ...props }, ref) => { + const inputOTPContext = React.useContext(OTPInputContext) + const { char, hasFakeCaret, isActive } = inputOTPContext.slots[index]CopyThen replace the render prop in your code.<InputOTP maxLength={6}> <InputOTPGroup> <InputOTPSlot index={0} /> <InputOTPSlot index={1} /> <InputOTPSlot index={2} /> </InputOTPGroup> <InputOTPSeparator /> <InputOTPGroup> <InputOTPSlot index={3} /> <InputOTPSlot index={4} /> <InputOTPSlot index={5} /> </InputOTPGroup> </InputOTP>Copy 2024-03-19 Disabled To add a disabled state to the input, update <InputOTP /> as follows: input-otp.tsxconst InputOTP = React.forwardRef< React.ElementRef<typeof OTPInput>, React.ComponentPropsWithoutRef<typeof OTPInput> >(({ className, containerClassName, ...props }, ref) => ( <OTPInput ref={ref} containerClassName={cn( "flex items-center gap-2 has-[:disabled]:opacity-50", containerClassName )} className={cn("disabled:cursor-not-allowed", className)} {...props} /> )) InputOTP.displayName = "InputOTP"CopyInputLabelOn This PageAboutInstallationUsageExamplesPatternSeparatorControlledFormChangelog2024-03-19 Composition2024-03-19 DisabledDeploy your shadcn/ui app on VercelTrusted by OpenAI, Sonos, Chick-fil-A, and more.Vercel provides tools and infrastructure to deploy apps and features at scale.Deploy NowDeploy to Vercel'''
