t. (default: false) --src-dir use the src directory when creating a new project. (default: false) --no-src-dir do not use the src directory when creating a new project. --css-variables use css variables for theming. (default: true) --no-css-variables do not use css variables for theming. -h, --help display help for commandCopy add Use the add command to add components and dependencies to your project. pnpmnpmyarnbunpnpm dlx shadcn@latest add [component] Copy Options Usage: shadcn add [options] [components...] add a component to your project Arguments: components the components to add or a url to the component. Options: -y, --yes skip confirmation prompt. (default: false) -o, --overwrite overwrite existing files. (default: false) -c, --cwd <cwd> the working directory. defaults to the current directory. (default: "/Users/shadcn/Desktop") -a, --all add all available components (default: false) -p, --path <path> the path to add the component to. -s, --silent mute output. (default: false) --src-dir use the src directory when creating a new project. (default: false) --no-src-dir do not use the src directory when creating a new project. --css-variables use css variables for theming. (default: true) --no-css-variables do not use css variables for theming. -h, --help display help for commandCopy build Use the build command to generate the registry JSON files. pnpmnpmyarnbunpnpm dlx shadcn@latest build Copy This command reads the registry.json file and generates the registry JSON files in the public/r directory. Options Usage: shadcn build [options] [registry] build components for a shadcn registry Arguments: registry path to registry.json file (default: "./registry.json") Options: -o, --output <path> destination directory for json files (default: "./public/r") -c, --cwd <cwd> the working directory. defaults to the current directory. (default: "/Users/shadcn/Code/shadcn/ui/packages/shadcn") -h, --help display help for commandCopy To customize the output directory, use the --output option. pnpmnpmyarnbunpnpm dlx shadcn@latest build --output ./public/registry CopyDark modeMonorepoOn This PageinitOptionsaddOptionsbuildOptionsDeploy your shadcn/ui app on VercelTrusted by OpenAI, Sonos, Chick-fil-A, and more.Vercel provides tools and infrastructure to deploy apps and features at scale.Deploy NowDeploy to Vercel'
