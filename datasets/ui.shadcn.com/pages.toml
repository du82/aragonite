title = "Changelog - shadcn/ui"
description = "Latest updates and announcements."
full_description = '''Getting Started IntroductionInstallationcomponents.jsonThemingDark modeCLIMonorepoTailwind v4NewNext.js 15 + React 19TypographyOpen in v0BlocksFigmaChangelogInstallation Next.jsViteLaravelReact RouterNewRemixAstroTanstack StartNewManualComponents AccordionAlertAlert DialogAspect RatioAvatarBadgeBreadcrumbButtonCalendarCardCarouselChartCheckboxCollapsibleComboboxCommandContext MenuData TableDate PickerDialogDrawerDropdown MenuFormHover CardInputInput OTPLabelMenubarNavigation MenuPaginationPopoverProgressRadio GroupResizableScroll AreaSelectSeparatorSheetSidebarSkeletonSliderSonnerSwitchTableTabsTextareaToastToggleToggle GroupTooltipRegistry NewIntroductionGetting StartedOpen in v0FAQregistry.jsonregistry-item.jsonDocsChangelogChangelogLatest updates and announcements.self.__wrap_b=(e,n,l)=>{let s=(l=l||document.querySelector(`[data-br="${e}"]`)).parentElement,r=e=>l.style.maxWidth=e+"px";l.style.maxWidth="";let a=s.clientWidth,c=s.clientHeight,o=a/2-.25,i=a+.5,t;if(a){for(;o+1<i;)r(t=Math.round((o+i)/2)),s.clientHeight===c?i=t:o=t;r(i*n+a*(1-n))}l.__wrap_o||"undefined"!=typeof ResizeObserver&&(l.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+l.dataset.brr,l)})).observe(s)};self.__wrap_b(":R96fnkv9u6ja:",1)August 2024 - npx shadcn init The new CLI is now available. It's a complete rewrite with a lot of new features and improvements. You can now install components, themes, hooks, utils and more using npx shadcn add. This is a major step towards distributing code that you and your LLMs can access and use. First up, the cli now has support for all major React framework out of the box. Next.js, Remix, Vite and Laravel. And when you init into a new app, we update your existing Tailwind files instead of overriding. A component now ship its own dependencies. Take the accordion for example, it can define its Tailwind keyframes. When you add it to your project, we’ll update your tailwind.config.ts file accordingly. You can also install remote components using url. npx shadcn add https://acme.com/registry/navbar.json. We have also improve the init command. It does framework detection and can even init a brand new Next.js app in one command. npx shadcn init. We have created a new schema that you can use to ship your own component registry. And since it has support for urls, you can even use it to distribute private components. And a few more updates like better error handling and monorepo support. You can try the new cli today. pnpmnpmyarnbunpnpm dlx shadcn init sidebar-01 login-01 Copy Update Your Project To update an existing project to use the new CLI, update your components.json file to include import aliases for your components, utils, ui, lib and hooks. components.json{ "$schema": "https://ui.shadcn.com/schema.json", "style": "new-york", "tailwind": { // ... }, "aliases": { "components": "@/components", "utils": "@/lib/utils", "ui": "@/components/ui", "lib": "@/lib", "hooks": "@/hooks" } }Copy If you're using a different import alias prefix eg ~, replace @ with your prefix. April 2024 - Introducing Lift Mode We're introducing a new mode for Blocks called Lift Mode. Enable Lift Mode to automatically "lift" smaller components from a block template for copy and paste. View the blocks library With Lift Mode, you'll be able to copy the smaller components that make up a block template, like cards, buttons, and forms, and paste them directly into your project. Visit the Blocks page to try it out. March 2024 - Introducing Blocks One of the most requested features since launch has been layouts: admin dashboards with sidebar, marketing page sections, cards and more. Today, we're launching Blocks. View the blocks library Blocks are ready-made components that you can use to build your apps. They are fully responsive, accessible, and composable, meaning they are built using the same principles as the rest of the components in shadcn/ui. We're starting with dashboard layouts and authentication pages, with plans to add more blocks in the coming weeks. Open Source Blocks are open source. You can find the source on GitHub. Use them in your projects, customize them and contribute back. View the blocks library Request a Block We're also introducing a "Request a Block" feature. If there's a specific block you'd like to see, simply create a request on GitHub and the community can upvote and build it. View the blocks library v0 If you have a v0 account, you can use the Edit in v0 feature to open the code on v0 for prompting and further generation. That's it. Looking forward to seeing what you build with Blocks. March 2024 - Breadcrumb and Input OTP We've added a new Breadcrumb component and an Input OTP component. Breadcrumb An accessible and flexible breadcrumb component. It has support for collapsed items, custom separators, bring-your-own routing <Link /> and composable with other shadcn/ui components. PreviewCodeStyle: CopyHomeMoreToggle menuComponentsBreadcrumb See more examples Input OTP A fully featured input OTP component. It has support for numeric and alphanumeric codes, custom length, copy-paste and accessible. Input OTP is built on top of input-otp by @guilherme_rodz. PreviewCodeStyle: Copy<style> [data-input-otp] { --nojs-bg: white !important; --nojs-fg: black !important; background-color: var(--nojs-bg) !important; color: var(--nojs-fg) !important; caret-color: var(--nojs-fg) !important; letter-spacing: .25em !important; text-align: center !important; border: 1px solid var(--nojs-fg) !important; border-radius: 4px !important; width: 100% !important; } @media (prefers-color-scheme: dark) { [data-input-otp] { --nojs-bg: black !important; --nojs-fg: white !important; } }</style> Read the docs If you have a v0, the new components are available for generation. December 2023 - New components, CLI and more We've added new components to shadcn/ui and made a lot of improvements to the CLI. Here's a quick overview of what's new: Carousel - A carousel component with motion, swipe gestures and keyboard support. Drawer - A drawer component that looks amazing on mobile. Pagination - A pagination component with page navigation, previous and next buttons. Resizable - A resizable component for building resizable panel groups and layouts. Sonner - The last toast component you'll ever need. CLI updates - Support for custom Tailwind prefix and tailwind.config.ts. Carousel We've added a fully featured carousel component with motion, swipe gestures and keyboard support. Built on top of Embla Carousel. It has support for infinite looping, autoplay, vertical orientation, and more. PreviewCodeStyle: Copy12345Previous slideNext slide Drawer Oh the drawer component 😍. Built on top of Vaul by emilkowalski_. Try opening the following drawer on mobile. It looks amazing! PreviewCodeStyle: CopyOpen Drawer Pagination We've added a pagination component with page navigation, previous and next buttons. Simple, flexible and works with your framework's <Link /> component. PreviewCodeStyle: CopyPrevious123More pagesNext Resizable Build resizable panel groups and layouts with this <Resizable /> component. PreviewCodeStyle: CopyOneTwoThree <Resizable /> is built using react-resizable-panels by bvaughn. It has support for mouse, touch and keyboard. Sonner Another one by emilkowalski_. The last toast component you'll ever need. Sonner is now availabe in shadcn/ui. PreviewCodeStyle: CopyShow Toast CLI updates This has been one of the most requested features. You can now configure a custom Tailwind prefix and the cli will automatically prefix your utility classes when adding components. This means you can now easily add shadcn/ui components to existing projects like Docusaurus, Nextra...etc. A drop-in for your existing design system with no conflict. 🔥 <AlertDialog className="tw-grid tw-gap-4 tw-border tw-bg-background tw-shadow-lg" />Copy It works with cn, cva and CSS variables. The cli can now also detect tailwind.config.ts and add the TypeScript version of the config for you. That's it. Happy Holidays. July 2023 - JavaScript This project and the components are written in TypeScript. We recommend using TypeScript for your project as well. However we provide a JavaScript version of the components, available via the cli. Would you like to use TypeScript (recommended)? noCopy To opt-out of TypeScript, you can use the tsx flag in your components.json file. components.json{ "style": "default", "tailwind": { "config": "tailwind.config.js", "css": "src/app/globals.css", "baseColor": "zinc", "cssVariables": true }, "rsc": false, "tsx": false, "aliases": { "utils": "~/lib/utils", "components": "~/components" } }Copy To configure import aliases, you can use the following jsconfig.json: jsconfig.json{ "compilerOptions": { "paths": { "@/*": ["./*"] } } }Copy June 2023 - New CLI, Styles and more I have a lot of updates to share with you today: New CLI - Rewrote the CLI from scratch. You can now add components, dependencies and configure import paths. Theming - Choose between using CSS variables or Tailwind CSS utility classes for theming. Base color - Configure the base color for your project. This will be used to generate the default color palette for your components. React Server Components - Opt out of using React Server Components. The CLI will automatically append or remove the use client directive. Styles - Introducing a new concept called Style. A style comes with its own set of components, animations, icons and more. Exit animations - Added exit animations to all components. Other updates - New icon button size, updated sheet component and more. Updating your project - How to update your project to get the latest changes. New CLI I've been working on a new CLI for the past few weeks. It's a complete rewrite. It comes with a lot of new features and improvements. init pnpmnpmyarnbunpnpm dlx shadcn-ui@latest init Copy When you run the init command, you will be asked a few questions to configure components.json: Which style would you like to use? › Default Which color would you like to use as base color? › Slate Where is your global CSS file? › › app/globals.css Do you want to use CSS variables for colors? › no / yes Where is your tailwind.config.js located? › tailwind.config.js Configure the import alias for components: › @/components Configure the import alias for utils: › @/lib/utils Are you using React Server Components? › no / yesCopy This file contains all the information about your components: where to install them, the import paths, how they are styled...etc. You can use this file to change the import path of a component, set a baseColor or change the styling method. components.json{ "style": "default", "tailwind": { "config": "tailwind.config.ts", "css": "src/app/globals.css", "baseColor": "zinc", "cssVariables": true }, "rsc": false, "aliases": { "utils": "~/lib/utils", "components": "~/components" } }Copy This means you can now use the CLI with any directory structure including src and app directories. add pnpmnpmyarnbunpnpm dlx shadcn-ui@latest add Copy The add command is now much more capable. You can now add UI components but also import more complex components (coming soon). The CLI will automatically resolve all components and dependencies, format them based on your custom config and add them to your project. diff (experimental) pnpmnpmyarnbunpnpm dlx shadcn-ui diff Copy We're also introducing a new diff command to help you keep track of upstream updates. You can use this command to see what has changed in the upstream repository and update your project accordingly. Run the diff command to get a list of components that have updates available: pnpmnpmyarnbunpnpm dlx shadcn-ui diff Copy The following components have updates available: - button - /path/to/my-app/components/ui/button.tsx - toast - /path/to/my-app/components/ui/use-toast.ts - /path/to/my-app/components/ui/toaster.tsxCopy Then run diff [component] to see the changes: pnpmnpmyarnbunpnpm dlx shadcn-ui diff alert Copy const alertVariants = cva( - "relative w-full rounded-lg border", + "relative w-full pl-12 rounded-lg border" )Copy Theming with CSS Variables or Tailwind Colors You can choose between using CSS variables or Tailwind CSS utility classes for theming. When you add new components, the CLI will automatically use the correct theming methods based on your components.json configuration. Utility classes <div className="bg-zinc-950 dark:bg-white" />Copy To use utility classes for theming set tailwind.cssVariables to false in your components.json file. components.json{ "tailwind": { "config": "tailwind.config.js", "css": "app/globals.css", "baseColor": "slate", "cssVariables": false } }Copy CSS Variables <div className="bg-background text-foreground" />Copy To use CSS variables classes for theming set tailwind.cssVariables to true in your components.json file. components.json{ "tailwind": { "config": "tailwind.config.js", "css": "app/globals.css", "baseColor": "slate", "cssVariables": true } }Copy Base color You can now configure the base color for your project. This will be used to generate the default color palette for your components. components.json{ "tailwind": { "config": "tailwind.config.js", "css": "app/globals.css", "baseColor": "zinc", "cssVariables": false } }Copy Choose between gray, neutral, slate, stone or zinc. If you have cssVariables set to true, we will set the base colors as CSS variables in your globals.css file. If you have cssVariables set to false, we will inline the Tailwind CSS utility classes in your components. React Server Components If you're using a framework that does not support React Server Components, you can now opt out by setting rsc to false. We will automatically append or remove the use client directive when adding components. components.json{ "rsc": false }Copy Styles We are introducing a new concept called Style. You can think of style as the visual foundation: shapes, icons, animations & typography. A style comes with its own set of components, animations, icons and more. We are shipping two styles: default and new-york (with more coming soon). The default style is the one you are used to. It's the one we've been using since the beginning of this project. It uses lucide-react for icons and tailwindcss-animate for animations. The new-york style is a new style. It ships with smaller buttons, cards with shadows and a new set of icons from Radix Icons. When you run the init command, you will be asked which style you would like to use. This is saved in your components.json file. components.json{ "style": "new-york" }Copy Theming Start with a style as the base then theme using CSS variables or Tailwind CSS utility classes to completely change the look of your components. Exit animations I added exit animations to all components. Click on the combobox below to see the subtle exit animation. PreviewCodeStyle: CopySelect framework... The animations can be customized using utility classes. Other updates Button Added a new button size icon: PreviewCodeStyle: Copy S'''
