"} className={cn( "w-[280px] justify-start text-left font-normal", !date && "text-muted-foreground" )} > <CalendarIcon className="mr-2 h-4 w-4" /> {date ? format(date, "PPP") : <span>Pick a date</span>} </Button> </PopoverTrigger> <PopoverContent className="w-auto p-0"> <Calendar mode="single" selected={date} onSelect={setDate} initialFocus /> </PopoverContent> </Popover> ) }Copy See the React DayPicker documentation for more information. Examples Date Picker PreviewCodeStyle: Open in CopyPick a date Date Range Picker PreviewCodeStyle: Open in CopyJan 20, 2022 - Feb 09, 2022 With Presets PreviewCodeStyle: Open in CopyPick a date Form PreviewCodeStyle: CopyDate of birthPick a dateYour date of birth is used to calculate your age.SubmitData TableDialogOn This PageInstallationUsageExamplesDate PickerDate Range PickerWith PresetsFormDeploy your shadcn/ui app on VercelTrusted by OpenAI, Sonos, Chick-fil-A, and more.Vercel provides tools and infrastructure to deploy apps and features at scale.Deploy NowDeploy to Vercel'
