["https://ui.shadcn.com/docs/components/data-table"]
title = "Data Table - shadcn/ui"
description = "Powerful table and datagrids built using TanStack Table."
full_description = '''Getting Started IntroductionInstallationcomponents.jsonThemingDark modeCLIMonorepoTailwind v4NewNext.js 15 + React 19TypographyOpen in v0BlocksFigmaChangelogInstallation Next.jsViteLaravelReact RouterNewRemixAstroTanstack StartNewManualComponents AccordionAlertAlert DialogAspect RatioAvatarBadgeBreadcrumbButtonCalendarCardCarouselChartCheckboxCollapsibleComboboxCommandContext MenuData TableDate PickerDialogDrawerDropdown MenuFormHover CardInputInput OTPLabelMenubarNavigation MenuPaginationPopoverProgressRadio GroupResizableScroll AreaSelectSeparatorSheetSidebarSkeletonSliderSonnerSwitchTableTabsTextareaToastToggleToggle GroupTooltipRegistry NewIntroductionGetting StartedOpen in v0FAQregistry.jsonregistry-item.jsonDocsData TableData TablePowerful table and datagrids built using TanStack Table.self.__wrap_b=(e,n,l)=>{let s=(l=l||document.querySelector(`[data-br="${e}"]`)).parentElement,r=e=>l.style.maxWidth=e+"px";l.style.maxWidth="";let a=s.clientWidth,c=s.clientHeight,o=a/2-.25,i=a+.5,t;if(a){for(;o+1<i;)r(t=Math.round((o+i)/2)),s.clientHeight===c?i=t:o=t;r(i*n+a*(1-n))}l.__wrap_o||"undefined"!=typeof ResizeObserver&&(l.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+l.dataset.brr,l)})).observe(s)};self.__wrap_b(":R96fnkv9u6ja:",1)DocsPreviewCodeStyle: CopyColumns StatusEmailAmountsuccessken99@example.com$316.00Open menusuccessAbe45@example.com$242.00Open menuprocessingMonserrat44@example.com$837.00Open menusuccessSilas22@example.com$874.00Open menufailedcarmella@example.com$721.00Open menu0 of 5 row(s) selected.PreviousNext Introduction Every data table or datagrid I've created has been unique. They all behave differently, have specific sorting and filtering requirements, and work with different data sources. It doesn't make sense to combine all of these variations into a single component. If we do that, we'll lose the flexibility that headless UI provides. So instead of a data-table component, I thought it would be more helpful to provide a guide on how to build your own. We'll start with the basic <Table /> component and build a complex data table from scratch. Tip: If you find yourself using the same table in multiple places in your app, you can always extract it into a reusable component. Table of Contents This guide will show you how to use TanStack Table and the <Table /> component to build your own custom data table. We'll cover the following topics: Basic Table Row Actions Pagination Sorting Filtering Visibility Row Selection Reusable Components Installation Add the <Table /> component to your project: pnpmnpmyarnbunpnpm dlx shadcn@latest add table Copy Add tanstack/react-table dependency: pnpmnpmyarnbunpnpm add @tanstack/react-table Copy Prerequisites We are going to build a table to show recent payments. Here's what our data looks like: type Payment = { id: string amount: number status: "pending" | "processing" | "success" | "failed" email: string } export const payments: Payment[] = [ { id: "728ed52f", amount: 100, status: "pending", email: "m@example.com", }, { id: "489e1d42", amount: 125, status: "processing", email: "example@gmail.com", }, // ... ]Copy Project Structure Start by creating the following file structure: app └── payments ├── columns.tsx ├── data-table.tsx └── page.tsxCopy I'm using a Next.js example here but this works for any other React framework. columns.tsx (client component) will contain our column definitions. data-table.tsx (client component) will contain our <DataTable /> component. page.tsx (server component) is where we'll fetch data and render our table. Basic Table Let's start by building a basic table. Column DefinitionsFirst, we'll define our columns.app/payments/columns.tsx"use client" import { ColumnDef } from "@tanstack/react-table" // This type is used to define the shape of our data. // You can use a Zod schema here if you want. export type Payment = { id: string amount: number status: "pending" | "processing" | "success" | "failed" email: string } export const columns: ColumnDef<Payment>[] = [ { accessorKey: "status", header: "Status", }, { accessorKey: "email", header: "Email", }, { accessorKey: "amount", header: "Amount", }, ]CopyNote: Columns are where you define the core of what your table will look like. They define the data that will be displayed, how it will be formatted, sorted and filtered.<DataTable /> componentNext, we'll create a <DataTable /> component to render our table.app/payments/data-table.tsx"use client" import { ColumnDef, flexRender, getCoreRowModel, useReactTable, } from "@tanstack/react-table" import { Table, TableBody, TableCell, TableHead, TableHeader, TableRow, } from "@/components/ui/table" interface DataTableProps<TData, TValue> { columns: ColumnDef<TData, TValue>[] data: TData[] } export function DataTable<TData, TValue>({ columns, data, }: DataTableProps<TData, TValue>) { const table = useReactTable({ data, columns, getCoreRowModel: getCoreRowModel(), }) return ( <div className="rounded-md border"> <Table> <TableHeader> {table.getHeaderGroups().map((headerGroup) => ( <TableRow key={headerGroup.id}> {headerGroup.headers.map((header) => { return ( <TableHead key={header.id}> {header.isPlaceholder ? null : flexRender( header.column.columnDef.header, header.getContext() )} </TableHead> ) })} </TableRow> ))} </TableHeader> <TableBody> {table.getRowModel().rows?.length ? ( table.getRowModel().rows.map((row) => ( <TableRow key={row.id} data-state={row.getIsSelected() && "selected"} > {row.getVisibleCells().map((cell) => ( <TableCell key={cell.id}> {flexRender(cell.column.columnDef.cell, cell.getContext())} </TableCell> ))} </TableRow> )) ) : ( <TableRow> <TableCell colSpan={columns.length} className="h-24 text-center"> No results. </TableCell> </TableRow> )} </TableBody> </Table> </div> ) }CopyTip: If you find yourself using <DataTable /> in multiple places, this is the component you could make reusable by extracting it to components/ui/data-table.tsx.<DataTable columns={columns} data={data} />Render the tableFinally, we'll render our table in our page component.app/payments/page.tsximport { Payment, columns } from "./columns" import { DataTable } from "./data-table" async function getData(): Promise<Payment[]> { // Fetch data from your API here. return [ { id: "728ed52f", amount: 100, status: "pending", email: "m@example.com", }, // ... ] } export default async function DemoPage() { const data = await getData() return ( <div className="container mx-auto py-10"> <DataTable columns={columns} data={data} /> </div> ) }Copy Cell Formatting Let's format the amount cell to display the dollar amount. We'll also align the cell to the right. Update columns definitionUpdate the header and cell definitions for amount as follows:app/payments/columns.tsxexport const columns: ColumnDef<Payment>[] = [ { accessorKey: "amount", header: () => <div className="text-right">Amount</div>, cell: ({ row }) => { const amount = parseFloat(row.getValue("amount")) const formatted = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", }).format(amount) return <div className="text-right font-medium">{formatted}</div> }, }, ]CopyYou can use the same approach to format other cells and headers. Row Actions Let's add row actions to our table. We'll use a <Dropdown /> component for this. Update columns definitionUpdate our columns definition to add a new actions column. The actions cell returns a <Dropdown /> component.app/payments/columns.tsx"use client" import { ColumnDef } from "@tanstack/react-table" import { MoreHorizontal } from "lucide-react" import { Button } from "@/components/ui/button" import { DropdownMenu, DropdownMenuContent, DropdownMenuItem, DropdownMenuLabel, DropdownMenuSeparator, DropdownMenuTrigger, } from "@/components/ui/dropdown-menu" export const columns: ColumnDef<Payment>[] = [ // ... { id: "actions", cell: ({ row }) => { const payment = row.original return ( <DropdownMenu> <DropdownMenuTrigger asChild> <Button variant="ghost" className="h-8 w-8 p-0"> <span className="sr-only">Open menu</span> <MoreHorizontal className="h-4 w-4" /> </Button> </DropdownMenuTrigger> <DropdownMenuContent align="end"> <DropdownMenuLabel>Actions</DropdownMenuLabel> <DropdownMenuItem onClick={() => navigator.clipboard.writeText(payment.id)} > Copy payment ID </DropdownMenuItem> <DropdownMenuSeparator /> <DropdownMenuItem>View customer</DropdownMenuItem> <DropdownMenuItem>View payment details</DropdownMenuItem> </DropdownMenuContent> </DropdownMenu> ) }, }, // ... ]CopyYou can access the row data using row.original in the cell function. Use this to handle actions for your row eg. use the id to make a DELETE call to your API. Pagination Next, we'll add pagination to our table. Update <DataTable>app/payments/data-table.tsximport { ColumnDef, flexRender, getCoreRowModel, getPaginationRowModel, useReactTable, } from "@tanstack/react-table" export function DataTable<TData, TValue>({ columns, data, }: DataTableProps<TData, TValue>) { const table = useReactTable({ data, columns, getCoreRowModel: getCoreRowModel(), getPaginationRowModel: getPaginationRowModel(), }) // ... }CopyThis will automatically paginate your rows into pages of 10. See the pagination docs for more information on customizing page size and implementing manual pagination.Add pagination controlsWe can add pagination controls to our table using the <Button /> component and the table.previousPage(), table.nextPage() API methods.app/payments/data-table.tsximport { Button } from "@/components/ui/button" export function DataTable<TData, TValue>({ columns, data, }: DataTableProps<TData, TValue>) { const table = useReactTable({ data, columns, getCoreRowModel: getCoreRowModel(), getPaginationRowModel: getPaginationRowModel(), }) return ( <div> <div className="rounded-md border"> <Table> { // .... } </Table> </div> <div className="flex items-center justify-end space-x-2 py-4"> <Button variant="outline" size="sm" onClick={() => table.previousPage()} disabled={!table.getCanPreviousPage()} > Previous </Button> <Button variant="outline" size="sm" onClick={() => table.nextPage()} disabled={!table.getCanNextPage()} > Next </Button> </div> </div> ) }CopySee Reusable Components section for a more advanced pagination component. Sorting Let's make the email column sortable. Update <DataTable>app/payments/data-table.tsx"use client" import * as React from "react" import { ColumnDef, SortingState, flexRender, getCoreRowModel, getPaginationRowModel, getSortedRowModel, useReactTable, } from "@tanstack/react-table" export function DataTable<TData, TValue>({ columns, data, }: DataTableProps<TData, TValue>) { const [sorting, setSorting] = React.useState<SortingState>([]) const table = useReactTable({ data, columns, getCoreRowModel: getCoreRowModel(), getPaginationRowModel: getPaginationRowModel(), onSortingChange: setSorting, getSortedRowModel: getSortedRowModel(), state: { sorting, }, }) return ( <div> <div className="rounded-md border"> <Table>{ ... }</Table> </div> </div> ) }CopyMake header cell sortableWe can now update the email header cell to add sorting controls.app/payments/columns.tsx"use client" import { ColumnDef } from "@tanstack/react-table" import { ArrowUpDown } from "lucide-react" export const columns: ColumnDef<Payment>[] = [ { accessorKey: "email", header: ({ column }) => { return ( <Button variant="ghost" onClick={() => column.toggleSorting(column.getIsSorted() === "asc")} > Email <ArrowUpDown className="ml-2 h-4 w-4" /> </Button> ) }, }, ]CopyThis will automatically sort the table (asc and desc) when the user toggles on the header cell. Filtering Let's add a search input to filter emails in our table. Update <DataTable>app/payments/data-table.tsx"use client" import * as React from "react" import { ColumnDef, ColumnFiltersState, SortingState, flexRender, getCoreRowModel, getFilteredRowModel, getPaginationRowModel, getSortedRowModel, useReactTable, } from "@tanstack/react-table" import { Button } from "@/components/ui/button" import { Input } from "@/components/ui/input" export function DataTable<TData, TValue>({ columns, data, }: DataTableProps<TData, TValue>) { const [sorting, setSorting] = React.useState<SortingState>([]) const [columnFilters, setColumnFilters] = React.useState<ColumnFiltersState>( [] ) const table = useReactTable({ data, columns, onSortingChange: setSorting, getCoreRowModel: getCoreRowModel(), getPaginationRowModel: getPaginationRowModel(), getSortedRowModel: getSortedRowModel(), onColumnFiltersChange: setColumnFilters, getFilteredRowModel: getFilteredRowModel(), state: { sorting, columnFilters, }, }) return ( <div> <div className="flex items-center py-4"> <Input placeholder="Filter emails..." value={(table.getColumn("email")?.getFilterValue() as string) ?? ""} onChange={(event) => table.getColumn("email")?.setFilterValue(event.target.value) } className="max-w-sm" /> </div> <div className="rounded-md border"> <Table>{ ... }</Table> </div> </div> ) }CopyFiltering is now enabled for the email column. You can add filters to other columns as well. See the filtering docs for more information on customizing filters. Visibility Adding column visibility is fairly simple using @tanstack/react-table visibility API. Update <DataTable>app/payments/data-table.tsx"use client" import * as React from "react" import { ColumnDef, ColumnFiltersState, SortingState, VisibilityState, flexRender, getCoreRowModel, getFilteredRowModel, getPaginationRowModel, getSortedRowModel, useReactTable, } from "@tanstack/react-table" import { Button } from "@/components/ui/button" import { DropdownMenu, DropdownMenuCheckboxItem, DropdownMenuContent, DropdownMenuTrigger, } from "@/components/ui/dropdown-menu" export function DataTable<TData, TValue>({ columns, data, }: DataTableProps<TData, TValue>) { const [sorting, setSorting] = React.useState<SortingState>([]) const [columnFilters, setColumnFilters] = React.useState<ColumnFiltersState>( [] ) const [columnVisibility, setColumnVisibility] = React.useState<VisibilityState>({}) const table = useReactTable({ data, columns, onSortingChange: setSorting, onColumnFiltersChange: setColumnFilters, getCoreRowModel: getCoreRowModel(), getPaginationRowModel: getPaginationRowModel(), getSortedRowModel: getSortedRowModel(), getFilteredRowModel: getFilteredRowModel(), onColumnVisibilityChange: setColumnVisibility, state: { sorting, columnFilters, columnVisibility, }, }) return ( <div> <div className="flex items-center py-4"> <Input placeholder="Filter emails..." value={table.getColumn("email")?.getFilterValue() as string} onChange={(event) => table.getColumn("email")?.setFilterValue(event.target.value) } className="max-w-sm" /> <DropdownMenu> <DropdownMenuTrigger asChild> <Button variant="outline" className="ml-auto"> Columns </Button> </DropdownMenuTrigger> <DropdownMenuContent align="end"> {table .getAllColumns() .filter( (column) => column.getCanHide() ) .map((column) => { return ( <DropdownMenuCheckboxItem key={column.id} className="capitalize" checked={column.getIsVisible()} onChe'''
