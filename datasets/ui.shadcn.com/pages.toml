title = "Tailwind v4 - shadcn/ui"
description = "How to use shadcn/ui with Tailwind v4 and React 19."
full_description = '''Getting Started IntroductionInstallationcomponents.jsonThemingDark modeCLIMonorepoTailwind v4NewNext.js 15 + React 19TypographyOpen in v0BlocksFigmaChangelogInstallation Next.jsViteLaravelReact RouterNewRemixAstroTanstack StartNewManualComponents AccordionAlertAlert DialogAspect RatioAvatarBadgeBreadcrumbButtonCalendarCardCarouselChartCheckboxCollapsibleComboboxCommandContext MenuData TableDate PickerDialogDrawerDropdown MenuFormHover CardInputInput OTPLabelMenubarNavigation MenuPaginationPopoverProgressRadio GroupResizableScroll AreaSelectSeparatorSheetSidebarSkeletonSliderSonnerSwitchTableTabsTextareaToastToggleToggle GroupTooltipRegistry NewIntroductionGetting StartedOpen in v0FAQregistry.jsonregistry-item.jsonDocsTailwind v4Tailwind v4How to use shadcn/ui with Tailwind v4 and React 19.self.__wrap_b=(e,n,l)=>{let s=(l=l||document.querySelector(`[data-br="${e}"]`)).parentElement,r=e=>l.style.maxWidth=e+"px";l.style.maxWidth="";let a=s.clientWidth,c=s.clientHeight,o=a/2-.25,i=a+.5,t;if(a){for(;o+1<i;)r(t=Math.round((o+i)/2)),s.clientHeight===c?i=t:o=t;r(i*n+a*(1-n))}l.__wrap_o||"undefined"!=typeof ResizeObserver&&(l.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+l.dataset.brr,l)})).observe(s)};self.__wrap_b(":R96fnkv9u6ja:",1)It’s here! Tailwind v4 and React 19. Ready for you to try out. You can start using it today. Get StartedSee Demo What's New The CLI can now initialize projects with Tailwind v4. Full support for the new @theme directive and @theme inline option. All components are updated for Tailwind v4 and React 19. We’ve removed the forwardRefs and adjusted the types. Every primitive now has a data-slot attribute for styling. We've fixed and cleaned up the style of the components. We're deprecating the toast component in favor of sonner. Buttons now use the default cursor. We're deprecating the default style. New projects will use new-york. HSL colors are now converted to OKLCH. Note: this is non-breaking. Your existing apps with Tailwind v3 and React 18 will still work. When you add new components, they'll still be in v3 and React 18 until you upgrade. Only new projects start with Tailwind v4 and React 19. See it Live I put together a demo with all the updated components here: https://v4.shadcn.com Take a look and test the components. If you find any bugs, please let me know on GitHub. Try It Out You can test Tailwind v4 + React 19 today using the canary release of the CLI. See the framework specific guides below for how to get started. Next.jsNext.jsViteViteLaravelReact RouterAstroAstroTanStack StartGatsbyGatsbyReactManual Upgrade Your Project One of the major advantages of using shadcn/ui is that the code you end up with is exactly what you'd write yourself. There are no hidden abstractions. This means when a dependency has a new release, you can just follow the official upgrade paths. Here's how to upgrade your existing projects (full docs are on the way): 1. Follow the Tailwind v4 Upgrade Guide Upgrade to Tailwind v4 by following the official upgrade guide: https://tailwindcss.com/docs/upgrade-guide Use the @tailwindcss/upgrade@next codemod to remove deprecated utility classes and update tailwind config. 2. Update your CSS variables The codemod will migrate your CSS variables as references under the @theme directive. @layer base { :root { --background: 0 0% 100%; --foreground: 0 0% 3.9%; } } @theme { --color-background: hsl(var(--background)); --color-foreground: hsl(var(--foreground)); }Copy This works. But to make it easier to work with colors and other variables, we'll need to move the hsl wrappers and use @theme inline. Here's how you do it: Move :root and .dark out of the @layer base. Wrap the color values in hsl() Add the inline option to @theme i.e @theme inline { Remove the hsl() wrappers from @theme :root { --background: hsl(0 0% 100%); // <-- Wrap in hsl --foreground: hsl(0 0% 3.9%); } dark { --background: hsl(0 0% 3.9%); // <-- Wrap in hsl --foreground: hsl(0 0% 98%); } @theme inline { --color-background: var(--background); // <-- Remove hsl --color-foreground: var(--foreground); }Copy This change makes it much simpler to access your theme variables in both utility classes and outside of CSS for eg. using color values in JavaScript. 3. Update colors for charts Now that the theme colors come with hsl(), you can remove the wrapper in your chartConfig: const chartConfig = { desktop: { label: "Desktop", - color: "hsl(var(--chart-1))", + color: "var(--chart-1)", }, mobile: { label: "Mobile", - color: "hsl(var(--chart-2))", + color: "var(--chart-2)", }, } satisfies ChartConfigCopy 4. Use new size-* utility The new size-* utility (added in Tailwind v3.4), is now fully supported by tailwind-merge. You can replace w-* h-* with the new size-* utility: - w-4 h-4 + size-4Copy 5. Update your dependencies pnpm up "@radix-ui/*" cmdk lucide-react recharts tailwind-merge clsx --latestCopy 6. Remove forwardRef You can use the preset-19 codemod to migrate your forwardRef to props or manually update the primitives. For the codemod, see https://react.dev/blog/2024/04/25/react-19-upgrade-guide#typescript-changes. If you want to do it manually, here's how to do it step by step: Replace React.forwardRef<...> with React.ComponentProps<...> Remove ref={ref} from the component. Add a data-slot attribute. This will come in handy for styling with Tailwind. You can optionally convert to a named function and remove the displayName. Before const AccordionItem = React.forwardRef< React.ElementRef<typeof AccordionPrimitive.Item>, React.ComponentPropsWithoutRef<typeof AccordionPrimitive.Item> >(({ className, ...props }, ref) => ( <AccordionPrimitive.Item ref={ref} className={cn("border-b last:border-b-0", className)} {...props} /> )) AccordionItem.displayName = "AccordionItem"Copy After function AccordionItem({ className, ...props }: React.ComponentProps<typeof AccordionPrimitive.Item>) { return ( <AccordionPrimitive.Item data-slot="accordion-item" className={cn("border-b last:border-b-0", className)} {...props} /> ) }Copy Share Your Feedback We’d love for you to test these updates and share your feedback! If you run into anything weird or have suggestions, add a comment below.MonorepoNext.js 15 + React 19On This PageWhat's NewSee it LiveTry It OutUpgrade Your Project1. Follow the Tailwind v4 Upgrade Guide2. Update your CSS variables3. Update colors for charts4. Use new size-* utility5. Update your dependencies6. Remove forwardRefShare Your FeedbackDeploy your shadcn/ui app on VercelTrusted by OpenAI, Sonos, Chick-fil-A, and more.Vercel provides tools and infrastructure to deploy apps and features at scale.Deploy NowDeploy to Vercel'''
