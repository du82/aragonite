full_description = "Based on Fedora Linux, Ultramarine offers the latest and greatest in open-source software, yet maintaining rock-solid stability. Making sure things don't break is our top priority. Ultramarine provides both developer-friendly and user-friendly tools to make sure you can get the most out of your system. We're making it as easy and accessible as possible for everyone to create and package their software for Ultramarine (and in extension, Fedora!). Ultramarine applies pragmatic tweaks and settings to make sure your out-of-the-box experience is as smooth as it can be. We've tried to make sure that you'll be able to get started as quickly as possible."
