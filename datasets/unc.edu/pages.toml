description = "Check out photos and videos capturing life on campus and the great work done by Tar Heels."
full_description = "DiscoverMust-See UNCCheck out photos and videos capturing life on campus and the great work done by Tar Heels. Carolina in the snowTar Heels waited three years for snow to decorate the Carolina campus again and were then treated to a pair of snowfalls the evenings of Jan. 10 and 21. They went sledding, hung out with friends and took photos by the Old Well.(Photos by Johnny Andrews and Jon Gardiner, University Communications) Happy holidays from Chancellor Lee H. RobertsThe chancellor sent well wishes to the Carolina community and shared a video of him and Rameses exchanging gifts in celebration of the holiday spirit. Winter graduates take next step in their journeySee scenes from Winter Commencement as graduates joined the ranks of more than 367,000 living Carolina alumni. A joyous dayOver 1,800 Tar Heels received degrees Dec. 15 at the Dean E. Smith Center as the University held Winter Commencement. Check out scenes from a day of celebration for many students and their family and friends. (Photos by Jon Gardiner, University Communications) Sports broadcaster says ‘yes’ to allFrom “Sports Xtra” to the Olympics, “I am well prepared wherever I go because of Carolina,” Kyle Lobenhofer says. Oh what fun!’Tis the season for festive costumes, coming together with colleagues and getting steps in for a good cause.The Jingle Bell Jog, an annual tradition for Carolina faculty and staff, returned Dec. 6. Tar Heels turned into Santas, elves, reindeer and candy canes as they got out in the sun on a chilly Friday. Those who attended also had the opportunity to make canned-food donations to the Carolina Cupboard and support the Orange County Animal Shelter. (Photos by Jon Gardiner/UNC-Chapel Hill) 2024 is a year of Carolina centennials In this fun video, Chancellor Lee H. Roberts highlights four exciting milestones for the University. Rameses celebrates a century at CarolinaThe Tar Heels’ beloved ram mascot made his first appearance on campus 100 years ago this