["https://www.unc.edu/discover/a-life-at-the-bench"]
title = "A life at the bench - The University of North Carolina at Chapel Hill"
description = "Oliver Smithies devoted his life to research and science — a dedicated that led to a Nobel Prize."
full_description = "Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyNote: “A life at the bench” was originally published in Endeavors Magazine on January 1, 2008.In 1936, when Oliver Smithies was 11 years old, his uncle lent him a telescope with a broken lens. Oliver wanted to fix it, so he read stacks of Scientific American magazines at the local library.“I remember getting quite a long way with making an eight-inch lens,” Smithies says. “But at one stage I had to heat it up and unfortunately I didn’t understand something properly and it cracked.”Days of work down the drain. But Smithies shook it off and tried to make a smaller lens with the remnants of the first. He sprinkled grinding powder on a thick slab of mirrored glass and used a metal soup can attached to a drill press to cut the glass down to size. He wasn’t sure the edge of the soup can was sharp enough to cut the mirror, but he tried anyway. For hours, Smithies withstood the piercing screech of metal boring into glass, turning that drill handle and watching the soup can rotate slowly until it finally cut through.“And I did make that lens,” he says. “But I could never get that telescope to work.”Smithies, though, realized that he loved the process more than anything. He loved making things. And he did eventually make a telescope, along with a bunch of other cool stuff.As an adult, he was still tinkering and inventing. By age 60, in 1985, Smithies had garnered several awards for various discoveries and inventions, and was still working at his lab bench every day. But at that time, Smithies was in the throes of a complex series of experiments, well beyond telescopes and pulverized glass and so tediously long that graduate students left to pursue other goals. Many scientists doubted his hypothesis. Could Smithies actually insert a segment of DNA into the gene of a mammalian cell, and prove that the DNA segment took up residency at the proper location in the cell’s genetic material? Smithies thought he would have quite an invention on his hands — a way to target specific genes so that, potentially, mutated genes could be replaced or repaired.The method took years. It was cumbersome and unwieldy, but he got it to work. He successfully targeted a specific gene. Around the same time and independently of Smithies, geneticist Mario Capecchi also figured out gene targeting. And in England, Martin Evans had successfully isolated the embryonic stem cells in a mouse, altered the genes of those cells, and reintroduced the cells into a foster mouse to create genetically modified offspring.Biomedical research has never been the same. Using the discoveries of these three scientists, researchers around the world, including Smithies, created hundreds of mouse strains that genetically model human diseases. They also made thousands of mouse models that have altered genetic material so scientists can figure out what specific genes are responsible for doing.“There is no doubt that this work will lead to new therapies in virtually every disease that has a genetic basis,” says Etta Pisano, vice dean of UNC’s School of Medicine and professor of radiology and biomedical engineering.Mouse models have opened up countless avenues of research, created a vast amount of scientific knowledge, and led to the creation of drugs for cancer and other diseases. For this, Smithies, Capecchi, and Evans won the 2007 Nobel Prize for Physiology or Medicine.Smithies, 82, says the award capped a long career. “But,” he adds, “I don’t think I’m finished yet.”From comic books to OxfordThe son of an English teacher and an insurance salesman, Smithies grew up in Copley, a small industrial village two hundred miles north of London. It was a happy childhood spent with his fraternal twin brother and younger sister. But in 1932 Smithies contracted rheumatic fever, which can cause damage to the heart. He was bedridden for ten weeks and wasn’t allowed to play sports until he was fourteen.“It was sad not being able to play games outside as a boy, but I enjoyed reading,” he recalls. “And I’m naturally optimistic, so having rheumatic fever didn’t make me unhappy or anything. It was a fact of life.”While Smithies was reading, a character in a comic book — an inventor — caught his eye. Already fond of tinkering in his father’s garage, Smithies announced to his family that he would become an inventor. As luck or fate would have it, his best friend’s dad managed a clock-making company.“He had a lathe, a drill press, things like that,” Smithies says. “At first we got motorcycles to run and made radio-controlled boats. Oh, we had a grand time.”Smithies made radios and telescopes, and tried to make a remote speaker system out of a pig’s bladder, learning the scientist’s credo early in life: “If you need something that’s not available, you make it.” In his lab is equipment he made twenty years ago. He nods toward a polymerase chain reaction machine, which isolates different parts of the DNA sequence from genetic material. “When it was invented, you couldn’t buy one right away, so I made one,” he says.In 1943 Smithies earned a scholarship to Oxford instead of getting drafted into the army. “I never really understood what happened there,” he says, “but they had some sort of board that directed students what to do. I was directed to go on with my studies; I haven’t the faintest idea why. They must have decided that some people would make a greater contribution to the war effort by doing research or whatever, instead of, unfortunately, the horrible jobs that soldiers had to do.”At Oxford Smithies considered becoming a physicist, but then thought he’d be able to help more people in a direct way if he studied medicine. After two years of medical school he was given a choice between clinical work and extra schooling for an honors degree. He chose the latter and studied animal physiology.“And that’s when I realized I wanted to do research,” he says. “It’s not that I didn’t think medicine was interesting; I just couldn’t not do research, as it were.”During that honors year, his favorite teacher was Sandy Ogston, a molecular biologist at a time when molecular biology didn’t exist as a formal topic. Under Ogston’s tutelage, Smithies figured out a way to detect interactions between proteins by measuring osmotic pressures. The experiments took more than two years, and although they were ultimately successful, nobody ever used his method. He would later say that his discovery was useless, but he considered the work good training. And he felt satisfied.Smithies earned his doctorate, and then Ogston advised him to work abroad, maybe in the United States.“I wasn’t very keen on that idea,” Smithies remembers. “I didn’t particularly like America, but I didn’t know anything about the country.” Ogston told Smithies, “All the more reason you should go.”Remembering the jellySmithies did his post-doctoral work at the University of Wisconsin before heading to Connaught Medical Research Laboratory in Toronto, where he worked from 1952 to 1960. Scientists there had two main duties: make compounds not readily available in Canada and do research. Smithies worked with insulin; he suspected that there was a precursor to the hormone. To find out, he had to separate proteins in blood, and for that he chose a method called electrophoresis.The experiment went like this: you put a spot of protein mixture in one place on a wet piece of filter paper and then pass an electric current through the paper. Proteins that were negatively charged would move toward the positive end of the paper. Vice-versa for positively charged proteins. This way, the proteins would separate.“But I noticed that insulin stuck to the paper,” Smithies says. “It didn’t really move; it just unrolled like a carpet, and then it stopped.” He couldn’t figure out anything about insulin this way.Smithies turned to starch electrophoresis, a similar sort of experiment. “It was like having a tray full of wet sand,” he says. “You might call it a wet starch pie, a sand pie. When you’d pass an electric current through the starch, the proteins would migrate through the starch grains; they wouldn’t stick. But the only way of finding the proteins was to cut that starch pie into slices and do a protein determination for each slice.”That meant doing 50 protein determinations for one experiment.“I couldn’t afford to do that experiment,” Smithies says. “But I knew starch would work. I was thinking about this one day when I remembered my childhood. I used to help my mother do the laundry; she’d starch my father’s shirts, and in those days you cooked the starch. When finished, the starch turned into a jelly. So I thought, okay, all I had to do was cook the starch, make a jelly instead of a loose slurry, and then I could stain the proteins with dye because I knew that the dye wouldn’t stick to the starch. I could avoid this business of cutting that pie.”It worked. The proteins separated, the dye stained them, and Smithies studied them.Before this, scientists thought that a molecule of blood contained five different proteins. Smithies found 25, and also determined that all of us have very different mixtures of proteins in our blood. Scientists everywhere began looking for genetic differences in blood and finding them, opening up a whole new realm of biological understanding and leading to the use of blood proteins in forensic science. Scientists eventually found several hundred different proteins in blood.His invention, gel electrophoresis, turned out to be a much more powerful method for separating proteins than typical starch electrophoresis. Gel electrophoresis is the father of acrylamide gel electrophoresis, which labs everywhere still use today.For this work, Smithies won the Gairdner Foundation International Award, considered a precursor for the Nobel. More importantly, his experiments piqued his interest in genetic differences. Around the same time, Francis Crick and James Watson discovered the structure of DNA. Smithies became a geneticist.The eureka momentIn 1960 Smithies returned to the University of Wisconsin, where he discovered that some people have duplicates of parts of certain genes: they have two copies of a given gene instead of just one. He also found that these partially duplicated genes can match up on the chromosome in two different ways, in some cases leading to the creation of a gene that is three times the normal length.As genetic science advanced through the 1970s, Smithies began studying individual hemoglobin genes. Up until that point, scientists worked with hemoglobin proteins. Vernon Ingram, for instance, discovered the particular amino acid that causes sickle cell anemia. Then scientists discovered the lone gene implicated in the disease.Meanwhile, Smithies was one of the first scientists to physically separate a gene from the rest of the DNA of the human genome, a process referred to as isolating a gene. His lab then isolated the normal DNA that corresponds to the hemoglobin gene that is mutated in sickle cell patients.“So I thought surely it should be possible to use the normal DNA to correct the abnormal DNA,” Smithies says. He thought this could lead to cures for diseases in which one gene is implicated.Then in 1982 Smithies read a paper about a complex method for finding one piece of DNA among hundreds of thousands of pieces. He wondered if he could use a similar procedure to find out if a foreign piece of DNA that he inserted into a cell could find the corresponding spot in that cell’s genome, and then replace that gene. If this could work — this gene targeting — then theoretically scientists could correct faulty genes.“So I thought about that paper and taught about it — I was teaching a graduate class at the time — and then 10 days later I realized how to do the experiment,” he says.It took three years, but toward the end he found some evidence that DNA injected into cell culture did find the right spot in the cells’ DNA through a process called homologous recombination. But he still needed definite proof of success or failure. Smithies was trying to show that beta-globin genes and hemoglobin genes with eleven thousand base pairs were altered. If so, they’d have only seven thousand bases.“We had about thirty bottles of cells lined up and we thought that one of them ought to have worked,” Smithies says. “We should be able to find a piece of DNA that was seven thousand bases long. So we isolated the DNA from each of these thirty bottles, used an enzyme that cuts the DNA, and put it into a gel electrophoresis so that the bands of DNA would separate according to their sizes. And we looked to see if there was a band that was seven thousand bases long. One collection of cells had been altered. We knew it had worked.”Smithies says that his eureka moment felt like coming out of the clouds while flying a plane, a hobby he picked up in the 1970s.“Instruments indirectly tell you where the runway is so that when you come out of the clouds the runway should be right in front of you,” he says. “If not, there are procedures you can do to try again without crashing.”Smithies had landed, but the ride was a little rocky. His method was complicated.“It took three years and it did work,” he says. “But it was a poor method in the end; the success rate was extremely low. It’s not a method anybody would ever dream of using anymore. I don’t use it. But it showed the principle.”Until then, gene targeting had only been achieved in yeast. Many researchers were skeptical of targeting human genes because human genes and cells are much more complex than yeast. Smithies forged ahead along with a few other optimists, including Mario Capecchi, who Smithies says devised a more efficient method for gene targeting that allowed scientists to see what certain genes are responsible for.“Mario realized that it was important to knock out a gene in a mouse to see what that gene does,” Smithies says, “whereas I was interested in correcting a mistake — a mutated gene.”Then Smithies attended a conference in Scotland where Martin Evans showed how he had removed embryonic stem cells from a mouse, altered the genes, and inserted the stem cells into a different mouse. That mouse’s offspring had the same genetic alteration, and the implications were enormous. Smithies wanted those embryonic stem cells. He spoke with Evans, who later delivered some to Smithies in a vial in his shirt pocket.Smithies and Capecchi, still working independently but now in closer contact, grew the stem cells in their labs, studied how they evolve, and later created mouse models that show precisely how genes function and how gene mutations can cause human diseases. They won the Gairdner Award for their work in gene targeting; it was the second time Smithies won. In 2001, Smithies, Capecchi, and Evans won the Lasker Award, considered the American version of the Nobel Prize. Nearly 50 percent of Lasker winners go on to win the Nob"
