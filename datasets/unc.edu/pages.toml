["https://www.unc.edu/posts/2025/02/28/business-school-launches-program-for-recent-graduates"]
title = "Business school launches program for recent graduates | UNC-Chapel Hill"
description = "The Master of Science in Business Management teaches the basics to those who didn’t study business."
full_description = "(Jon Gardiner/UNC-Chapel Hill) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyThis fall, a new graduate program at UNC Kenan-Flagler Business School will help students develop essential business knowledge and practical skills through courses and hands-on experiences.The Master of Science in Management, a 10-month graduate-degree program, is designed for recent college graduates who haven’t studied business.“We are offering the Master of Science in Management program to prepare recent college graduates to launch business careers,” said Courtney Knoll, associate dean of the new program and the Master of Accounting program at UNC Kenan-Flagler. “It strengthens our graduate degree offerings for recent college graduates who want to pursue business careers and will prepare them to compete more effectively in the job market.”Classes will begin Aug. 18. The comprehensive curriculum covers key business disciplines including accounting, finance, marketing, analytics, economics, strategy, leadership, operations and business communication. Students may choose to concentrate their studies in either finance or marketing to deepen their expertise.In an experiential learning capstone course, they will sharpen their leadership, teamwork and problem-solving skills. Student teams will work on consulting projects with leaders from top companies and organizations to provide solutions to real business challenges.A career services team will help students refine their resumes, sharpen their interview skills and connect with employers in industries ranging from corporate, healthcare, tech to nonprofits. Students also will build connections in the UNC Kenan-Flagler alumni network, which includes over 51,000 alumni in 50 states and 97 countries.Tuition and fees are $45,923 for in-state residents and $53,260 for out-of-state residents for the 2025-26 academic year.The program start date and costs are pending final approval from the UNC System Board of Governors.Categories Academics, Kenan-Flagler Business School"
author = "Joshua McCormack"
year_published = 2025
year_updated = 2025
