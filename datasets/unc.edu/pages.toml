["https://www.unc.edu/posts/2025/02/26/science-meets-support-in-this-student-club"]
title = "Science meets support in this student club | UNC-Chapel Hill"
description = "Visibility in Physics offers a space for everyone to connect, find community and have fun."
full_description = "(Submitted photo) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyWith over 800 student organizations at Carolina, where do you sign up to meet a group of Tar Heels who love talking physics and sneaking in a few social activities, too? Rujula Yete and Mara Mayhew have the club for you.Yete and Mayhew are the co-presidents of Visibility in Physics, a student organization that offers a supportive and welcoming community for Tar Heels looking to meet others who are majoring or minoring in physics or share a casual enthusiasm for the subject.“We really want to encourage people in physics from different types of backgrounds and make sure that there’s a welcoming space for everyone,” said Yete. “We talk about different issues that exist, but also offer opportunities like networking, career advice and research. It’s about making sure everyone has the resources that they need to succeed in physics.”The club was originally established as Carolina Women in Physics in 2010, to address the fact that women tend to be underrepresented in the field. A few years ago, it evolved into Visibility in Physics to make it more inclusive for all underrepresented groups and allies, and every Carolina student is welcome to join.“I think people sometimes see science as only factual. There’s one point of view, and that’s the right point of view,” said Mayhew. “Science will always be based on facts, but you want everybody’s perspective represented, too. Underrepresented groups don’t always feel they have a voice or a community. Groups like Visibility in Physics offer a space to bring these perspectives together and make sure everyone feels heard and welcome.”The organization hosts weekly meetings that range from educational topics to social events. Members also participate in community outreach opportunities like Astronomy Days at the North Carolina Museum of Natural Sciences and events at Morehead Planetarium and Science Center.Beyond activities, the co-presidents of Visibility in Physics also say the club serves as a support system for those who may be struggling with a difficult course load.“Physics can be a tough major, and I would say we do have a bit of a challenge when it comes to recruitment and retainment,” said Mayhew. “Students can sometimes become discouraged in pursuing our major. We try to be a place where they feel supported and encouraged even when the class work becomes really hard.”“It’s also been amazing to have some of our members who are seniors or who have graduated give us advice and guidance on career paths in this field,” added Yete. “I’m really interested in space and want to pursue a career in research and astrophysics. Some of our members have gone on to follow that same path, and it’s been so helpful for me to see that and know I that I can do that, too.”Learn more about Visibility in Physics on Heel Life for more information on how to join.Categories Around Campus"
author = "Gillie"
year_published = 2025
year_updated = 2025
