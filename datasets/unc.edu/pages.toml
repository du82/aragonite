["https://www.unc.edu/athletics"]
title = "Athletics - The University of North Carolina at Chapel Hill"
full_description = "Athletics We believe athletics are a conduit for knowledge and inspiration. Whether you’ve been a teammate since T-ball or a solitary strider, a record-setter or a statistics-crunching spectator, there’s a part for you to play in Carolina athletics.Find an education in motion Varsity AthleticsAt Carolina, we educate and inspire through athletics. Follow our 28 varsity teams, the talented athletes who compete and the inspirational coaches who guide them. Campus RecreationBuild mind and body, set personal goals and meet your fitness challenges with campus recreational opportunities ranging from rock-climbing to lap-swimming. Intramural SportsSee what all the intramural buzz is about. Engage in some friendly competition against other Tar Heels. Gather a group of your best friends and start a team, or just join a sport you love. Sport ClubsRepresent Carolina in competition with other schools, learn an off-the-beaten-track activity or just get fit on one of our 50 club sport teams.Active Tar HeelsCarolina varsity athletes aren’t the only ones competing in Chapel Hill.Thousands of Tar Heels find plenty of ways to stay active through student groups, Campus Recreation’s Sport Clubs program and intramural sports. With a variety of teams, ranging from quidditch to tennis to wallyball to flag football, it’s easy to find a sport that is a good fit for you.From pools and climbing walls to fitness centers and expeditions, UNC Campus Recreation is ready to help members of the Carolina community hit their fitness goals this semester. Read more about sport clubsWhether you’re a novice or seasoned hiker, Carolina’s campus boasts five hiking trail systems to add to your list of ways to stay active and healthy this semester.Get outdoors on Carolina's hiking trailsA new competition at UNC Campus Recreation taps into a century-old lumberjack tradition by challenging Tar Heels to test their balance on a floating plastic log. Learn more about rolleo"
