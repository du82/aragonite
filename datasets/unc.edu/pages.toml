["https://www.unc.edu/posts/2025/02/21/cpals-befriend-young-cancer-patients"]
title = "CPALS Tar Heels befriend young cancer patients | UNC-Chapel Hill"
description = "Carolina Pediatric Attention, Love and Support is a student-run nonprofit based at UNC Hospitals."
full_description = "CPALS provide year-round support and companionship to pediatric cancer patients at UNC Hospitals and host events like the Festival of Hope. (Submitted photo) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyWithout skipping a beat, Carolina junior Lexi Brantley can recall the day her younger brother Mason found out he had cancer: April 5, 2013.At the time, the 9-year-old was understandably worried about her 5-year-old brother’s acute lymphoblastic leukemia diagnosis. He thankfully recovered after a yearslong battle at UNC Hospitals and is now a “hardheaded, typical boy” in his junior year of high school, according to his sister.Watching Mason’s health scare was tough for Brantley. But one silver lining was the compassion her brother and family received at Carolina — and not just from doctors and nurses.A Tar Heel student, Olivia (Stevens) Johnson ’15, befriended Mason and did everything from play cards to shoot hoops and simply hang out. Johnson was part of Carolina Pediatric Attention, Love and Support, a student-run nonprofit that supports hematology-oncology patients and their families at UNC Hospitals.Over a decade later, CPALS remains devoted to its mission of creating trusting and supportive relationships with patients — and Brantley is now part of the group herself.“When I got into UNC, I just knew that was something I was interested in and something I wanted to do to make the same impact,” she says.Brantley’s younger brother, Mason, with his CPAL, Olivia (Stevens) Johnson ’15. (Submitted photo)Providing ‘psychosocial support’Plenty of Tar Heels want to make a tough experience a bit easier for children fighting cancer. Senior Rachel Hodakowski, president of CPALS, says around 200 students are involved, with varying levels of commitment.Hodakowski, who plans to become a physician assistant, notes that CPALS isn’t a pre-health club. “Obviously there are clinical aspects, but our club specifically is this psychosocial support, which was a really unique avenue I wanted to learn more about and contribute,” she says.The most prominent way the organization provides that support is through its one-on-one program that pairs a student with a patient. Around 20 Tar Heels are actively paired with patients, a responsibility they all take seriously and only take on after serving a semester as a UNC Medical Center volunteer.Students like Aaren Capilitan, the nonprofit’s vice president, develop long-lasting relationships with patients by attending chemotherapy and radiation appointments and making multiple weekly visits.“I just fell in love with the environment and being able to personally help those kids and families,” says Capilitan, who plans to attend medical school.Around 200 Carolina students are involved with CPALS. (Submitted photo)CPALS members learn to embrace their buddies’ interests. For Hodakowski, that meant playing the card games a shy youngster liked and chatting with him about his favorite video game characters, Mario and Sonic the Hedgehog.Capilitan, a big gamer herself, has enjoyed hours of Fortnite and Minecraft. “I had so much fun with my school-age pal that our adviser was like, ‘Hey, do you want two more kids?’ I was like, ‘Yes, absolutely!’”Capilitan was also there to watch one of her patients ring a bell to mark the end of his chemotherapy, a party-like scene with plenty of dancing.“That is such a blessing,” she says.Plenty of ways to supportBeyond the one-on-one program, Hodakowski says students have many ways to get involved, such as painting windows at the hospital or making craft kits for patients.The organization is always looking to raise money for other initiatives like the CPALS Cares Grant, which helps with families’ medical expenses. There’s also the CPALS Scholarship, which is available to previous pediatric hematology-oncology patients at UNC Hospitals now entering college.The nonprofit’s big fundraising event this spring is the April 12 Golden Heroes 5K, a race named for the color of the childhood cancer awareness ribbon.“It started during the pandemic, so it was made virtual. This is our first time moving in-person fully,” Hodakowski said. “I’m super excited.”CPALS regularly decorate windows, rooms and common areas at UNC Hospitals. (Submitted photo)Categories Around Campus, Public Service"
author = "bpd323"
year_published = 2025
