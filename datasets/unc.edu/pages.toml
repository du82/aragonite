["https://www.unc.edu/posts/2025/02/28/special-awards-honor-excellence-in-instruction"]
title = "Special awards honor excellence in instruction | UNC-Chapel Hill"
description = "Learn how the winners of the Board of Governors, Mentor, Friday and Sitterson awards show creativity in teaching."
full_description = "(L-R) Luc Bovens, Kenneth Donnelly, Yaiza Canzani and Sudhanshu (Ashu) Handa. (Gillie Sibrian/UNC-Chapel Hill) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyBoard of Governors’ Award for Excellence in TeachingThe winner receives a citation and a one-time stipend of $12,500. One recipient is selected by each of the 16 constituent institutions of the UNC System.Yaiza Canzani, mathematics department, College of Arts and SciencesWho is the best teacher you’ve had and why?Federico Rodríguez Hertz was the professor who influenced me the most. As an undergraduate in Uruguay, I told him I wanted to pursue a Ph.D. at McGill University. He helped me design a thesis to make me stand out and mentored me through it, even though it wasn’t in his field. His support made all the difference.What’s something creative you’ve done to engage your students?One way I keep students engaged is by frequently polling them. I ask them to raise their hands in response to questions, assuring them I won’t call on anyone initially. Later, I invite those who feel comfortable to share their answers. This strategy encourages participation without pressure and boosts engagement.Mentor Award for Lifetime AchievementThe winner of this award, created in 1997, receives a one-time stipend of $5,000 and a framed citation.Sudhanshu (Ashu) Handa, public policy department, College of Arts and SciencesWho is the best teacher you’ve had and why?I was never good at English and history in high school and dreaded taking those courses. But my 12th grade American fiction teacher transformed my appreciation and understanding of literature. The things he uncovered in those passages along with the passion and pure love of literature he brought to class was contagious.What’s something creative you’ve done to engage your students?In my first-year seminar on poverty, students construct and justify a “poverty line” for Carolina undergraduate students. They apply the different concepts of well-being that we discuss, including basic needs, relative versus absolute poverty, capabilities and subjective well-being. It turns out that being able to afford a smart phone with airtime enters all poverty measures they construct!William C. Friday Award for Excellence in TeachingThe award was created by the Class of 1986 to honor the first president of the UNC System. The winner receives a stipend of $5,000 and a framed citation.Kenneth Donnelly, Lampe Joint Department of Biomedical EngineeringWho is the best teacher you’ve had and why?Brian Lawrenson, my semiconductor theory lecturer at the University of Dundee, used humor to make learning enjoyable. Also, as my final-year project supervisor, he gave me the freedom to explore and learn from mistakes, teaching me that failure is a natural and important part of the learning process.What’s something creative you’ve done to engage your students?In my study abroad class in Scotland, students interview local people and people from other European countries about health care attitudes. This exercise encourages local engagement, cultural exploration and creative problem-solving in Scotland’s diverse environment. Their findings fuel class discussions, broadening their understanding of international healthcare perspectives.J. Carlyle Sitterson Award for Teaching First-Year StudentsThese awards were created in 1998 by the Sitterson family to honor a tenured or tenure-track faculty member in the College. Two winners receive a one-time stipend of $5,000 and a framed citation.Luc Bovens, philosophy department, College of Arts and SciencesWho is the best teacher you’ve had and why?In Belgian high school, I turned to the humanities after inspiring history courses by Rik Camerlinckx, who made us question causes of political events.What’s something creative you’ve done to engage your students?In my classes, I probe philosophy, politics and economics students with similar “why” questions. For instance, I recently had them brainstorm about candidate explanations of the 2024 presidential election outcome.Categories Academics, Accolades, University News"
author = "Gillie"
year_published = 2025
year_updated = 2025
