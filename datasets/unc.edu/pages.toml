["https://www.unc.edu/posts/2025/02/24/super-bowl-provides-learning-experience-for-hussman-students"]
title = "Super Bowl provides learning experience for Hussman students | UNC-Chapel Hill"
description = "Anna Laible and Maya Waid helped cover the big game in New Orleans for The News & Observer."
full_description = "(Left) Maya Waid started writing about sports with her high school newspaper and (right) Anna Laible began sports reporting when she was selected as a Sports Illustrated Kids Reporter at 14. (Submitted photos; graphic by Gillie Sibrian/UNC-Chapel Hill) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyHours after the Philadelphia Eagles defeated the Kansas City Chiefs in New Orleans on Feb. 9 to win the 2025 Super Bowl, two Carolina students were roaming the field.Soaking in the moment at Caesars Superdome, Anna Laible and Maya Waid took a few pictures on the field together, then Laible scooped up a handful of confetti to bring home — a small memento from a life-changing week in New Orleans.“I think my favorite moment had to be the game overall, just the energy in the Superdome and how excited people were and being able to sit with all the other journalists,” Waid said. “It was the first NFL game either of us has covered — which is kind of crazy for it to be the Super Bowl. But we were very fortunate to just be there.”The experience could prove invaluable for two students at the UNC Hussman School of Journalism and Media who have already made a mark on the sports world.Laible, a sophomore from Pennsylvania, got her first taste of sportswriting at 14 when she was selected as a Sports Illustrated Kids Reporter. She’s created more than 100 episodes of her own Speak Up Sports Podcast, which focuses on trailblazing women in sports. Waid, a senior from Virginia, developed a love for sportswriting while working for her high school newspaper, later becoming editor-in-chief before enrolling at UNC-Chapel Hill.Both students said Hussman’s reputation as a premier journalism school was a key factor in choosing Carolina, and they’ve taken advantage of many opportunities and connections the school offers. Not only did Laible and Waid cover this year’s Super Bowl, they were also part of a team of Hussman students that traveled to the 2024 Paris Olympics last summer.“UNC Hussman’s faculty, staff and alumni network are committed to supporting the student journey through Carolina by providing them with experiential learning opportunities and other immersive experiences that encourage their success as students and empower them to lead in their careers,” said Raul Reis, Hussman dean. “Anna and Maya demonstrate how talented students can work their way to the center of the public square under the brightest lights on national and international stages.”Waid and Laible also covered the 2024 Paris Olympics along with other Hussman students. “The fact that Maya and I are doing these amazing things is just a testament to our hard work, because we continue to try to see what doors open for us at UNC and beyond,” Laible said. (Submitted photos)During Super Bowl week, Laible and Waid made time for some quintessential New Orleans experiences, from exploring Bourbon Street to eating beignets, jambalaya and even fried alligator.But the trip was no vacation. The duo spent the bulk of their time interviewing players and coaches with ties to the Carolinas and telling their stories. One of Waid’s favorite pieces was her feature on Eagles defensive ends/outside linebackers coach Jeremiah Washburn and his humble roots in the small town of Shelby, North Carolina.Meanwhile, Laible had multiple conversations with Chiefs star receiver DeAndre Hopkins and his mother, Sabrina Greenlee, writing a story about their special relationship and Hopkins’ journey from Clemson, South Carolina, to the Super Bowl. Those stories will undoubtedly stick with Laible and Waid for a long time, just like the memories of walking across the field after the Super Bowl — or the post-game confetti Laible took home in her luggage. It all still feels surreal.“I don’t think I would have ever imagined I’d cover my first Olympics and my first Super Bowl at 19 years old,” Laible said. “The fact that Maya and I are doing these amazing things is just a testament to our hard work, because we continue to try to see what doors open for us at UNC and beyond. I’m just really grateful to have had these opportunities together and to get to learn from each other along the way.”Categories Academics, Around Campus, Hussman School of Journalism and Media"
author = "Joshua McCormack"
year_published = 2025
year_updated = 2025
