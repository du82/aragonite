["https://www.unc.edu/about/history-and-traditions"]
title = "History and Traditions - The University of North Carolina at Chapel Hill"
full_description = "History of the UniversityThe University of North Carolina was the first public university in the nation. In 1789, William Richardson Davie wrote the act that established the University. In 1793, he and fellow trustees laid the cornerstone of the first building, Old East. Students arrived in 1795, and UNC became the only public university to award degrees in the 18th century.The School of Law was established in 1845. Other graduate programs began in 1876, followed by a summer school for teachers in 1877 and a medical program in 1897. Over the next century, leaders broadened the mission of the University to include research and public service. Professional schools were established as follows:School of Pharmacy (1897), now the Eshelman School of Pharmacy (2008)School of Education (1915)School of Commerce, now Kenan-Flagler Business School (1919)School of Public Welfare, now the School of Social Work (1920)School of Library Science, now the School of Information and Library Science (1931)Institute of Government, now the School of Government (1931)School of Public Health, now the Gillings School of Global Public Health (1936)Division of Health Affairs (1949)School of Dentistry (1949), now the Adams School of Dentistry (2019)School of Journalism, now the Hussman School of Journalism and Media (2019)School of Nursing (1950)In 1922, the Association of American Universities (AAU) admitted UNC as a member, an acknowledgment of its growth in research and graduate programs.In 1931, the North Carolina General Assembly established a Consolidated University comprised of the Chapel Hill campus, Woman’s College at Greensboro and North Carolina State College at Raleigh. In 1972, it created the UNC system, joining 16 state colleges and universities under a president and board of governors.Learn more about Carolina’s history at:The Carolina Story and History on the Hill.What’s a Tar HeelOne of the top questions about Carolina and its history is: What’s a Tar Heel? Learn how the nickname originated in North Carolina and became associated with the University’s varsity athletics teams.Other questions and information about the University that center on its many historic sites and landmarks include:The Old WellDavie Poplar Carolina Alumni MemorialCoker ArboretumConfederate MonumentForest TheatreMorehead-Patterson Bell Tower Old EastPlaymakers TheatreUnsung Founders Memorial9/11 Memorial GardenCarolina TraditionsMany legends and good luck omens have become popular lore at Carolina. Two of the most famous ones revolve around a poplar tree and a well. Read more on the Virtual Museum site.University DayUniversity Day is an occasion to remember the University’s past and celebrate its future. The date, October 12, marks the laying of the cornerstone of Old East, the institution’s first building and the oldest state university building in the nation. Read more at the University Day site.Bell Tower ClimbThe UNC General Alumni Association invites folks to climb the Morehead-Patterson Bell Tower several times each year, including prior to home football games and during Senior Weekeach spring."
