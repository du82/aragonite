["https://www.unc.edu/posts/2025/02/25/carolina-is-no-1-public-for-fulbrights-for-first-time"]
title = "Carolina is No. 1 public for Fulbrights for first time | UNC-Chapel Hill"
description = "In 2024-25, the prestigious cultural exchange program accepted 27 applicants from the University."
full_description = "Fulbright offers awards for faculty, staff, students and alumni to research, teach, pursue graduate studies and more. (Johnny Andrews/UNC-Chapel Hill) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyA top producing institution for the Fulbright U.S. Students Program for 15 of the last 16 years, this year UNC-Chapel Hill also earned the distinction of having more Fulbright U.S. students than any other public university.“This achievement is a testament to your institution’s deep commitment to international exchange and to building lasting connections between the people of the United States and the people of other countries,” Scott Weinhold, principal deputy assistant secretary at the U.S. Department of State, wrote in a letter to Chancellor Lee H. Roberts.The top producing institution designation recognizes U.S. higher education institutions for having the highest number of accepted applicants to the Fulbright U.S. Student Program. For the 2024-25 application cycle, UNC-Chapel Hill had 27 applicants accepted: 20 undergraduate students and seven graduate students.“Being the No. 1 public university for Fulbright U.S. Student Program recipients last year demonstrates Carolina’s commitment to developing global leaders,” said Marc Howlett, executive director of the Office of Distinguished Scholarships. “I’m inspired by the many Tar Heels around the world making a positive impact via the Fulbright program.”These recipients are among more than 2,100 U.S. citizens who are studying, researching or teaching abroad through the Fulbright U.S. Student Program. Currently, there are Carolina alumni participating in the program in 19 countries on five continents.“Fulbright prepares our students to be the next generation of global leaders,” said Barbara Stephenson, vice provost for global affairs and chief global officer. “We have long excelled in the Fulbright U.S. Student Program, and with the encouragement of University leadership, we believe we can earn this distinction among faculty, too.”Fulbright offers hundreds of awards annually for faculty, staff, students and alumni to research, teach, pursue graduate studies and more. The Fulbright U.S. Student Program is administered by the Office of Distinguished Scholarships in Honors Carolina. The Center for Faculty Excellence provides guidance to Carolina faculty pursuing Fulbright Scholar and Specialist Awards. UNC Global Affairs provides guidance to Carolina faculty seeking to host Fulbright visitors.Read more about the announcement.Categories Accolades, Global, University News"
author = "Gillie"
year_published = 2025
year_updated = 2025
