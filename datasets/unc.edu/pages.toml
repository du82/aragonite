full_description = '''Home231 years of public serviceUNC-Chapel Hill is at the heart of what’s next, preparing talented students from different perspectives and life experiences to become creators, explorers, entrepreneurs and leaders. Tar Heels develop a voice for critical thought and the courage to guide change.Carolina’s nationally recognized teaching, groundbreaking research and dedication to public service continue a legacy that began when the University was chartered in 1789 and opened to students four years later.1stand only public university in the United States to award degrees in the 18th century.No. 5public school in the country in U.S. News & World Report's 2025 Best Colleges rankings.No. 9among U.S. research institutions and top in NC for research activity (National Science Foundation)62national championships won by the Tar HeelsMeet a Tar Heel Emotion detective tracks effects of stressDoctoral candidate Adrienne Bonar studies the many factors that shape people’s feelings. Tar Heel takes to TaipeiMason Harkleroad spent her junior year immersed in the culture of Taiwan as a Phillips Ambassador and Boren Award scholar. ‘Insecure overachiever’ puts mental health firstAfter what he calls a “brain attack,” Michael Stutts sought help to put life and work in perspective.Explore Carolina See what Tar Heels are up to on campus and beyond. Imagine your HeelprintWhen Tar Heels arrive on our campus at the University of North Carolina at Chapel Hill, they meet a world of possibilities. In Chapel Hill, we’re all part of the same Tar Heel team, and everyone has a role to play. See how Tar Heels are leaving their Heelprint. Protecting your mental healthLearn about campus resources and how Tar Heel students, faculty and staff are using outreach and research to prioritize mental health on campus and beyond. Celebrating Black historyThroughout Carolina's history, there have been several pioneers who have broken down barriers for the generations of students to follow. Thei