["https://www.unc.edu/posts/2025/02/18/sloan-fellowship-awarded-to-carolina-chemist"]
title = "Sloan Fellowship awarded to Carolina chemist | UNC-Chapel Hill"
description = "Alex Zhukhovitskiy is one of 126 early-career scientists across the U.S. and Canada to receive the prestigious honor."
full_description = "Zhukhovitskiy researches large molecules called polymers, formed by repeatedly linking molecules to each other into long chains. (Graphic by Gillie Sibrian/UNC-Chapel Hill) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyAlex Zhukhovitskiy, William R. Kenan Jr. Fellow and an assistant professor in the chemistry department of the College of Arts and Sciences, has been awarded a 2025 Sloan Research Fellowship. The award is among the most prestigious given to early-career scientists.The Alfred P. Sloan Foundation made the announcement Feb. 18. A total of 126 early-career researchers received the fellowships, given to extraordinary U.S. and Canadian scientists whose creativity, innovation and research accomplishments make them stand out as the next generation of leaders. The new fellows, who were nominated by their peers, are drawn from 51 institutions across seven academic fields. More than 1,000 researchers are nominated by their fellow scientists each year.Winners receive a two-year, $75,000 fellowship which can be spent to advance the fellow’s research.Zhukhovitskiy is a chemist in the College of Arts and Sciences who has a keen interest in large molecules called polymers, formed by repeatedly linking molecules to each other into long chains. Biological polymers like proteins and DNA are the basis of life as we know it, and synthetic polymers like polyethylene and polyisoprene compose materials at the core of numerous modern technologies — from plastics used in vehicles to cancer therapeutics.Continued technological progress in this space — including how to make plastics more environmentally sustainable — hinges on advancing the chemistry of polymers. The Zhukhovitskiy group is focused on addressing fundamental challenges in polymer chemistry by implementing and advancing organic, inorganic and supramolecular chemistry methods. Researchers apply the insights gained from fundamental research to advance several applications, including polymer sustainability, tissue engineering, and solar energy capture and conversion.Zhukhovitskiy joined the Carolina faculty in 2019. He received his doctorate in chemistry from the Massachusetts Institute of Technology and was an LSRF Merck Postdoctoral Fellow at the University of California, Berkeley.The recipient of numerous awards, Zhukhovitskiy used his AFOSR Young Investigator Award to continue his work on conjugate polymers and nanowires. With a U.S Department of Energy Early Career Award, he worked on diene polymers to transform rubber waste into building blocks for functional materials. His other honors include an NSF Career Award, an Early Career Award from the Army Research Office and 3M’s Nontenured Faculty Award for Early Career Achievements.In outreach to the community, Zhukhovitskiy group members perform experiments over Zoom and in person with kindergarten through eighth grade students to engage them in thinking about science and the scientific method.“Alex is one of our rising stars at the interface of synthetic chemistry and polymer chemistry, and this Sloan Fellowship represents an extremely well-deserved recognition of his work, which spans from fundamental studies to real-world applications,” said James Cahoon, professor and chair of the chemistry department.Awarded annually since 1955, a Sloan Fellowship is among the most coveted awards given to young researchers, in part because many past fellows have gone on to great achievements in science, including receiving Nobel Prizes.“The Sloan Research Fellows represent the very best of early-career science, embodying the creativity, ambition and rigor that drive discovery forward,” said Adam F. Falk, president of the Alfred P. Sloan Foundation.Learn more about the new Sloan Fellows.Categories Accolades, College of Arts and Sciences, Research"
