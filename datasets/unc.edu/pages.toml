["https://www.unc.edu/posts/2024/12/16/damon-nahas-named-womens-soccer-head-coach"]
title = "Damon Nahas named women’s soccer head coach | UNC-Chapel Hill"
description = "As interim coach this past season, Nahas led Carolina to its 23rd national championship and became the fourth Tar Heel to win a national title in their first year at the helm."
full_description = "“Being part of this program for the past 10 years has meant so much to my family and me, and the chance to continue being a member of the Carolina family is a dream come true,” Nahas said. (Carolina Athletics) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyThe interim tag has officially been lifted.Damon Nahas, who led the Carolina women’s soccer team to its 23rd national championship last Monday, has been named the program’s head coach after a national search. Bubba Cunningham, Carolina’s director of athletics, informed Nahas of his decision before the NCAA title game, and the Board of Trustees approved the hire in the following days.Nahas spent the 2024 season as interim head coach following the retirement of legendary coach Anson Dorrance Aug. 11. Nahas has been part of the Tar Heels’ coaching staff since 2015, first serving as an assistant before being elevated to associate head coach in 2021. He becomes the second head coach in program history, succeeding Dorrance.“Damon Nahas has been an integral part of Carolina soccer for nearly a decade, and the way he has led, mentored, taught and inspired this year’s team as its head coach has been outstanding,” Cunningham said. “He is committed to developing players who win as both students and athletes and give back to the community, and he is dedicated to continuing the championship legacy of so many incredible soccer icons who have played at Carolina.”During his time as interim head coach, Nahas guided the Tar Heels to the 2024 NCAA championship title. It marked Carolina’s first national title since 2012 and 23rd overall – 19 more than any other program. He is the second coach in NCAA women’s soccer history to win a national championship in their first year as head coach, joining UCLA’s Margueritte Aozasa from 2022.Along with Erin Matson (field hockey, 2023), Carlos Somoano (men’s soccer, 2011) and Dave Klarmann (men’s lacrosse, 1991), Nahas is now the fourth Carolina head coach to win a national championship in their first year at the helm.“Coach Nahas has proven throughout his time as assistant and interim head coach that he is up to the task of leading our unparalleled women’s soccer program,” said Chancellor Lee H. Roberts. “The level of success that he has achieved this season is extraordinary and speaks to his commitment to excellence both on and off the field. As we look to the future, I know that Coach Nahas will continue to guide our remarkable student-athletes to even greater heights.”Nahas guided the Tar Heels to a 22-5 record and a 7-3 mark in the Atlantic Coast Conference en route to the NCAA title. It was the 21st 22-plus-win season in program history and the seventh since the turn of the century. Prior to being No. 1 in the final poll, the team was ranked in the top 10 and NCAA RPI’s top four every week.“I am honored to be named head coach of North Carolina women’s soccer and continue building upon the incredible legacy that has been established,” Nahas said. “Being part of this program for the past 10 years has meant so much to my family and me, and the chance to continue being a member of the Carolina family is a dream come true. I want to thank Chancellor Lee Roberts, Director of Athletics Bubba Cunningham, the Board of Trustees and everyone within UNC Athletics for their belief in my vision as well as their trust and confidence in me to lead this program.“Thank you to Anson, my friend and mentor, for his unwavering support and guidance. And to the team, staff and my family, who were the biggest factors for me throughout this process, words cannot express how grateful I am for each of you and what we accomplished together. To the fans, alumni and players: I am committed to making you proud, and I am excited for our bright future ahead.”Since Nahas has been on staff, over 30 Tar Heels have gone onto the professional ranks, highlighted by a team-record 11 players signing first-division professional contracts at the conclusion of the 2023 season. At the 2024 National Women’s Soccer League Draft, Carolina set NWSL records for most players selected by a single school in the first round (three) and overall (six), including the top two overall picks in Ally Sentnor (No. 1) and Savy King (No. 2).Having arrived in Chapel Hill in November 2015, Nahas brought with him 15 years of extensive experience in club coaching, national team directing and player development. In 2000, he developed a U7-U11 technical academy, Next Level Academy, which continues to be a leader in player development in the Triangle. He also served as the technical director of Raleigh’s Capital Area Soccer League, one of the most successful youth clubs in the country.Beginning his national-level coaching tenure with U.S. Soccer in 2011, Nahas was the girls’ U15 National Team coach until 2014. He oversaw the program’s training camps while also scouting and selecting players eligible for the teams. In 2014, he started a stint as the U17 National Team assistant and was invited to serve as an assistant coach for the full senior U.S. Women’s National Team during various camps.A native of East Northport, New York, Nahas attended and played soccer at NC State from 1992-96 before playing professionally with the Wilmington Hammerheads and Capital Express. He earned his bachelor’s degree from Southern New Hampshire University in 2021.Nahas and his wife, Nicole, have two sons, Crew and Grayson, and a daughter, Harper. His brother, Sean, is the head coach of the North Carolina Courage in the NWSL.Read the full story at GoHeels.comCategories Athletics"
