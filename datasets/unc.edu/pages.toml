title = "The University of North Carolina at Chapel Hill"
description = "The University of North Carolina at Chapel Hill, the nation’s first public university, is a global higher education leader known for innovative teaching, research and public service. A member of the prestigious Association of American Universities, Carolina regularly ranks as the best value for academic quality in U.S. public higher education."
full_description = '''Home231 years of public serviceUNC-Chapel Hill is at the heart of what’s next, preparing talented students from different perspectives and life experiences to become creators, explorers, entrepreneurs and leaders. Tar Heels develop a voice for critical thought and the courage to guide change.Carolina’s nationally recognized teaching, groundbreaking research and dedication to public service continue a legacy that began when the University was chartered in 1789 and opened to students four years later.1stand only public university in the United States to award degrees in the 18th century.No. 5public school in the country in U.S. News & World Report's 2025 Best Colleges rankings.No. 9among U.S. research institutions and top in NC for research activity (National Science Foundation)62national championships won by the Tar HeelsMeet a Tar Heel Emotion detective tracks effects of stressDoctoral candidate Adrienne Bonar studies the many factors that shape people’s feelings. Tar Heel takes to TaipeiMason Harkleroad spent her junior year immersed in the culture of Taiwan as a Phillips Ambassador and Boren Award scholar. ‘Insecure overachiever’ puts mental health firstAfter what he calls a “brain attack,” Michael Stutts sought help to put life and work in perspective.Explore Carolina See what Tar Heels are up to on campus and beyond. Imagine your HeelprintWhen Tar Heels arrive on our campus at the University of North Carolina at Chapel Hill, they meet a world of possibilities. In Chapel Hill, we’re all part of the same Tar Heel team, and everyone has a role to play. See how Tar Heels are leaving their Heelprint. Protecting your mental healthLearn about campus resources and how Tar Heel students, faculty and staff are using outreach and research to prioritize mental health on campus and beyond. Celebrating Black historyThroughout Carolina's history, there have been several pioneers who have broken down barriers for the generations of students to follow. Their courageous examples moved UNC-Chapel Hill closer to the ideal of the University of the people. Learn more about Tar Heels who paved the way for a more inclusive university. See what Tar Heels are up to on campus and beyond.The WellNews from Carolina Education, medical faculty honored for teachingFour receive Distinguished Teaching Awards for Post-Baccalaureate Instruction. Special awards honor excellence in instructionLearn how the winners of the Board of Governors, Mentor, Friday and Sitterson awards show creativity in teaching. Free dance lessons lead to fancy footwork George Moses Horton sought freedom with poetry Five College faculty receive Tanner awardsCreated in 1952, they honor excellence in teaching undergraduate students. Faculty honored with 2025 Chapman Family, Johnston awards Science meets support in this student clubRead Carolina news at The WellMust-see UNC Check out photos and videos capturing the Tar Heel experience Tar Heel Hockey turns 50The rapidly growing Carolina club hockey program will move into a more competitive division next year. Tar Heels revel in the snowWatch a time-lapse video and view scenes from the Feb. 19-20 snowfall at UNC-Chapel Hill. 230 years ago, he became the first Tar HeelHinton James walked from Wilmington to Chapel Hill in 1795 to enroll as the first student at Carolina. Check out photos and videos capturing the Tar Heel experience01 MarDrawing in the GalleriesAckland Art MuseumSat, March 110:00 amDrawing in the Galleries01 MarThe Process Series: "The Other American"Swain HallSat, March 107:30 pmThe Process Series: "The Other American"03 MarThis is America IICURRENT ArtSpace + StudioMon, March 307:30 pmThis is America II04 MarMeet with a TIAA Financial Consultant this springAdministrative Office BuildingTue, March 408:30 amMeet with a TIAA Financial Consultant this springView the University Calendar'''
