["https://www.unc.edu/massey-awards"]
title = "Massey Awards | UNC-Chapel Hill"
description = "Established in 1980 by the late C. Knox Massey ’25 of Durham, the C. Knox Massey Distinguished Service Award recognizes “unusual, meritorious or superior contributions” by University employees. The winners, selected through a campus-wide nomination process, each receive a $10,000 stipend and an award citation."
full_description = '''Massey Awards Established in 1980 by the late C. Knox Massey ’25 of Durham, the C. Knox Massey Distinguished Service Award recognizes “unusual, meritorious or superior contributions” by University employees. The winners, selected through a campus-wide nomination process, each receive a $10,000 stipend and an award citation.2024 C. Knox Massey Distinguished Service Award WinnersSeven Carolina employees, including one posthumous honoree, have been selected as the 2024 C. Knox Massey Distinguished Service Award winners, one of the most prestigious distinctions for faculty and staff. Linc Butler is an HR heroThe Massey Award winner “leads not by the example of his power, but by the power of his example.” Biology staff member honored for 'herculean' workMassey Award winner Summer Montgomery ’81 is a student service specialist in the University’s largest department. Desirée Rieckenberg lifts students in needThe Massey Award winner and dean of students is always on call to help them navigate difficult situations. Behind this day porter’s smile is a fighter’s spiritMassey winner Khin Su Su Kyi, a Myanmar refugee, models hard work and diligence. Robin Lee speaks up because she caresThe Massey Award-winning housekeeper advocates for her fellow employees and makes students feel at home. Nick Siedentop loves working behind the scenesThe Massey Award winner’s contributions to Carolina’s curriculum are vital but often hard to see. ‘Heart and soul’ of South Building honored posthumouslyExecutive assistant to two chancellors, Massey Award winner Elizabeth Williams made the University run smoothly. 2024 Massey Awards recognize employees’ service to CarolinaThe recipients include two housekeepers, two administrators, two academic staff members and one executive assistant.2023 C. Knox Massey Distinguished Service Award WinnersFive Carolina employees and one team have been selected as the 2023 C. Knox Massey Distinguished Service Award winners, one of the most prestigious distinctions for faculty and staff. Housing director helps students belongDuring the pandemic, Massey Award winner Allan Blattner expanded his role, meeting needs well beyond shelter. Third-shift housekeeper brings the clean — and the joyMassey Award winner David Barnette Jr. is busy on and off the job, but he always makes time to connect with others. Campus Health leadership rose to COVID challengeThe four-member team won a shared Massey Award for its “tireless commitment” during the pandemic and beyond. Operations manager welcomes all to LinebergerMassey Award winner Melissa Mack has put on thousands of events and is a mentor to many at Carolina’s premier cancer center. Housekeeper creates welcoming home for studentsMassey Award winner and self-described “big auntie” Chineka Stanley is free to be herself and bond with the residents she serves. GoHeels producer leads from backstageMassey Award winner Ken Cleary is a constant innovator, a broadcasting mentor and a manager who trusts others’ expertise. 2023 Massey Awards recognize service to CarolinaA Campus Health team, events organizer, producer, housing director and staff who keep facilities clean received Carolina’s highest honor for employees.2022 C. Knox Massey Distinguished Service Award WinnersSix Carolina employees received the 2022 C. Knox Massey Distinguished Service Award, one of the most prestigious distinctions for faculty and staff. Three recipients made up a team that helped launch the Carolina Together Testing Program.Stacy Davis keeps world-class coastal research center runningMore than 100 Massey Award nominators described how vital the practical knowledge and can-do spirit of this Outer Banks native is to the success of the Institute for Marine Sciences.Dr. Amir Barzin answers call to serviceWhen the pandemic hammered the Carolina community, the Massey Award recipient and grateful alumnus dove in to help establish a frontline defense against COVID-19.Amy Loftis takes charge and takes careWorking around the clock, this Massey Award winner and expert lab manager used thank you notes and chocolate to keep her COVID-19 testing lab team going.Eubanks grows through changes to become ‘heart of the workplace’While working for six vice chancellors since 2008, Massey Award winner Trevaughn Eubanks has always shown her signature pizzazz and an “unrelenting heart of service.”Pillar of Ground Services leads quietlyWhether preparing for Spring Commencement or cleaning up debris in fall, Massey winner Mark Moon keeps Carolina’s campus beautiful and his colleagues safe.Reluctant hero coaxed out of retirement to direct COVID-19 testing labA self-proclaimed “Debbie Downer,” Massey Award winner Susan Fiscus kept insisting that the impossible couldn’t be done even as she made it happen. Massey Awards honor service of 6 employeesThe recipients, including a team that helped launch the Carolina Together Testing Program, will receive recognition for their contributions at an in-person event.2021 C. Knox Massey Distinguished Service Award WinnersEight Carolina employees received the 2021 C. Knox Massey Distinguished Service Award, one of the most prestigious distinctions for faculty and staff. Given the exceptional year spent dealing with the global COVID-19 pandemic, the University bestowed eight awards, rather than the usual six. Leading with her heartFormer Employee Forum chair and Massey Award winner Shayna Hill has tirelessly advocated for University staff during a dark and difficult period. Finding her callingMassey Award recipient Sibby Anderson-Thompkins is a champion for diversity, equity and inclusion, from her days as a Carolina student throughout her career. Bloom where you’re plantedHousekeeper Teresa Golson received a Massey Award for 22 years of service to the University and helping the North Carolina Botanical Garden stay clean and safe for visitors during the pandemic. Nurturer of successMassey Award winner Vanessa Mitchell, computer support analyst at the UNC School of Social Work, is known for her high-quality work, self-improvement and helping others succeed. Good work and good troubleMassey Award recipient James Holman has spent his career at Carolina advocating for his fellow employees. A role model for us allThe email looked suspicious, but when housekeeper Sandra Foxx finally opened it, she got the surprise of her life. Always on callSports Medicine Director Dr. Mario Ciocca, a 2021 Massey Award winner, helped keep student-athletes healthy, safe and competitive during the pandemic. Dedicated to helpingWhether it’s driving through a snowstorm to rescue a stranded nurse visiting from Malawi or supporting world-class infectious disease faculty, 2021 Massey Award winner Kathy James is all about helping. Carolina employees earn prestigious Massey Awards for outstanding serviceGiven the exceptional year spent dealing with the global COVID-19 pandemic, the University is bestowing eight awards.2020 C. Knox Massey Distinguished Service Award WinnersSix Carolina employees were selected to receive the 2020 C. Knox Massey Distinguished Service Award, one of the most prestigious distinctions for faculty and staff. “Carolina is distinguished in the ways our teaching, research and service efforts benefit the people of our state,” Chancellor Kevin M. Guskiewicz said. “This work is made possible by the contributions of our extraordinary colleagues, who are the recipients of this year’s Massey Awards. I am grateful for their service and their dedication to our community.” Making it personalMassey Award winner Julie Cannefax takes care of business and nurtures students for the curriculum in toxicology and environmental medicine. Protecting the overstoryPainstaking stewardship and a long view of history drive Massey Award winner Tom Bythell as he cares for Carolina’s precious campus. The beating heart of the chancellor’s officeMassey Award winner Patti Wilkinson inspires with her warmth, problem-solving skills and knack for grace under pressure. Light, liberty and the promotion of black art, history and cultureMassey Award winner Joseph Jordan embodies the University’s “Lux, Libertas” motto and makes the Stone Center a vital part of campus. Excavating the past to serve the futureMassey Award winner Steve Davis has dedicated his life to preserving the history of North Carolina’s Native American peoples for future generations. Shining exampleMassey Award winner Carol Womack’s path took her from a Jamaican farm through some hard times and to a new life in North Carolina.2019 C. Knox Massey Distinguished Service Award WinnersIn recognition of their “unusual, meritorious or superior contributions,” six University employees received the 2019 C. Knox Massey Distinguished Service Awards. “These amazing colleagues who, through their dedicated work and commitment to excellence, continually up the pace of progress at the Carolina we cherish and love,” Guskiewicz said. “We thank them for their service to our University and our state. They are the soul of this most public of the public universities,” wrote Guskiewicz. Sharon Horton Jones’ motherly wisdom applies to life, academicsFor over 35 years Jones advises students in the School of Media and Journalism. As director of student service and assessment, Jones is a resource and moral support. “I am their mom away from home.” Making a difficult job look easyFor 29 years Deborah Hawkins has worked as manager of parking control and event operations. She says her team is like family and she’s dedicated to safety and access. ‘Mamma Douglas’ believes in the power – and joy – of giving backDouglas is director of volunteer engagement for University Development and is also a Carolina alumna. ‘Mr. North Carolina’ sticks to the subject he lovesWith 25 years of experience as the curator for the North Carolina Collection at University Libraries, Anthony is dedicated to knowledge, research and, of course, Carolina. Nancy Burton’s story includes support taken and givenFor the past 18 years, Burton has worked her way up through Housekeeping Services and is now the go-to person for problem-solving and support. Lynn Blanchard is the heart of Carolina’s public serviceAs director of the Carolina Center for Public Service, Blanchard is an advocate for social engagement, public health and working directly with communities. Six receive prestigious Massey Awards for meritorious serviceIn recognition of their “unusual, meritorious or superior contributions,” six University employees will receive the 2019 C. Knox Massey Distinguished Service Awards.2018 C. Knox Massey Distinguished Service Award WinnersSix employees at Carolina were selected by then-Chancellor Carol L. Folt to receive the 2018 C. Knox Massey Distinguished Service Awards, one of the most coveted distinctions earned by faculty and staff. “These amazing people, through their hard work and dedication, day in and day out, create the Carolina we love,” Folt said. “They are incredible community builders and we thank them for their service and commitment to excellence,” wrote Folt. Good deeds and leadership highlight Polk’s 37-year career in admissionsStephen Farmer said Barbara Polk's good deeds typically take place behind the scenes. "She has done them out of love for the University and the goodness of her heart," he said. Grandma’s wisdom, discipline help Odom epitomize Massey Award qualitiesMassey Award winner Daryl Odom has worked 30 years as a housekeeper in Kenan Center, helping the center fulfill its mission with his dedication, attention to detail and friendliness. A grateful heartWinning a Massey award was the latest bit of good fortune for Nan Kham and her family. Ronald Mangum, developer of peer support specialist program, has few peers"I don’t know what it’s like to live under a bridge. I don’t know what it’s like to be in a mental institution. These men and women who are certified do, and they can show them that there is a different way," said Ronald Mangum. Paying the bills is only part of what Martina Ballen doesMassey Award winner Martina Ballen has been paying the bills for athletics for the past 31 years, currently administering a budget of $95.5 million. Massey winner Gregory Gangi has a passion for the natural worldThe Massey award recognized the role Gregory Gangi has played as a catalyst for shaping interdisciplinary curriculum and learning opportunities beyond the classroom to better prepare students for emerging career paths. Outstanding service earns six employees prestigious Massey AwardsSaid Chancellor Carol L. Folt: "These amazing people, through their hard work and dedication, day in and day out, create the Carolina we love."Explore Carolina C. Knox Massey Distinguished Service Awards The Well — news from Carolina Careers at Carolina'''
year_published = 2025
clearnet = "https://www.unc.edu/massey-awards"
