title = "Libraries - The University of North Carolina at Chapel Hill"
full_description = "Your partner for inquiry and learningWorld-renowned library collections, innovative services and expert librarians create an environment for discovery and inspiration at any level and in every discipline. Whether you are a first-year student learning about research and citation or a practiced scholar engaged in specialized inquiry, UNC’s libraries are your trusted partner.María R. EstorinoVice Provost for University Libraries and University Librarian Your UNC One Card is your library cardYour University I.D. card, known as your One Card, also serves as your library card. If you are a member of Carolina Alumni, a library card is a membership benefit. North Carolina residents may buy a borrower’s card for $25 annually. Learn more about library cards.Get help from a librarianExpert librarians are available in person, by phone, by text and by online chat. Contact the libraries or find a librarian by specialty.Find out when a library is openDifferent libraries have different hours of operation. Check library hours.Learn web design, Photoshop and more in free workshopsCheck out the dozens of free classes on a variety of subjects through SkillfUL Tech at the Undergraduate Library.Create with 3-D printers, scanners, electronics and moreThe Library MakerSpace offers all of these resources for students and faculty. History lives at Wilson LibraryFrom ancient clay tablets, to the University’s founding documents, to Dolly Parton’s first recording and Andy Griffith’s guitar, you can find it at the Wilson Special Collections Library, along with exhibits and special events.Become a friendFriends of the Library enrich the experience of every student and instructor at Carolina. Anyone who makes a gift to the Library is a Friend of the Library. Benefits include a library card (minimum $25 annually), a subscription to the Windows newsletter, and invitations to Library events and exhibitions. Become a Friend today."
