["https://www.unc.edu/posts/2025/02/13/malawi-cancer-program-develops-diagnostic-breakthrough"]
title = "Malawi cancer program develops diagnostic breakthrough | UNC-Chapel Hill"
description = "Part of UNC Project Malawi, the program also provides clinical care, pathology training and other services to the African nation."
full_description = "The UNC Project Malawi Cancer Program is entering the second phase of developing a low-cost cancer diagnosis method. (Gillie Sibrian/UNC-Chapel Hill) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyIn the U.S., cancer diagnosis often involves costly biopsies and tests. In the south African country of Malawi, where the average annual income is around $300, patients can rarely afford such procedures — yet accurate diagnoses remain essential.To help, staff of the long-standing UNC Project Malawi Cancer Program are in the first phase of developing a low-cost genetic tumor sequencing method for making cancer diagnosis. “That would be a game-changer and useful throughout the world,” said program co-director Dr. Yuri Fedoriw.Fedoriw is the Labcorp Distinguished Professor in the UNC School of Medicine’s pathology and laboratory medicine department, global cancer pathology director for the UNC Institute for Global Health and Infectious Diseases and a member of the UNC Lineberger Comprehensive Cancer Center.Also working on the tumor sequencing project is Jeremy Wang, associate professor in the medical school’s genetics and pathology and laboratory medicine departments. Fedoriw and Wang are using a basic sequencer to test samples from Malawi and validate the process. With Malawian bioinformatician Benjamin Kumwenda, they have applied for an NIH grant to move the next phase into Malawi entirely. They also want to train Malawian researchers to run the program autonomously and to build infrastructure for in-country tumor testing.The cancer program, a collaboration between UNC Lineberger Comprehensive Cancer Center and the Institute for Global Health and Infectious Diseases, operates in partnership with the Malawi Ministry of Health. It is part of UNC Project Malawi, which began in the 1990s with research on HIV and sexually transmitted infections. About 300 UNC doctors, researchers, students and staff work in the program, which has expanded to focus on women’s health and HIV-associated cancers such as cervical cancer, lymphoma, esophageal cancer and Kaposi sarcoma.Co-directors of UNC Project Malawi Cancer Program Dr. Tamiwe Tomoka (Left) and Dr. Yuri Fedoriw (Right).The cancer program develops and supports diagnostic and clinical services, including the Kamuzu Central Hospital Lymphoma Study, AIDS Malignancy Consortium and NIH-funded clinical trials. Co-director with Fedoriw is Tamiwe Tomoka, head of pathology at Malawi’s Kamuzu Central Hospital.“In Malawi, access to critical cancer care resources such as radiation therapy and digital microscopy is extremely limited. Cancer therapeutics are sometimes not available,” Fedoriw said. Carolina faculty are working with Malawian colleagues to help patients and improve diagnosis and treatment.While the work focuses on global health, it can help researchers and clinicians better understand cancer and other health issues to help patients in North Carolina.Developing global cancer research leadersThe institute and Lineberger train and support cancer research leaders in Malawi and at Carolina through the Malawi Cancer Outcomes Research Training Program. Ten investigators focus on cancer-specific projects, and six are Carolina faculty. More than 20 Malawian clinicians and staff in the project are largely dedicated to cancer work.Since its first NIH grant in 1998, the project has centralized work in Malawi’s capital city of Lilongwe at Kamuzu Central Hospital and partnered with Kamuzu College of Health Sciences in Blantyre. Carolina’s building, adjacent to the National Cancer Hospital, houses Malawi’s only public pathology lab. In Malawi, there is one pathologist per 5 million people, compared to 65 to 70 pathologists per million in the U.S.Fedoriw spends several weeks in Malawi every year overseeing the project. He interacts with Malawi staff frequently from Chapel Hill, including weekly Zoom meetings with pathologists to review scans of tumor tissue samples from Malawian patients.He’s joined on these calls by other medical school faculty like assistant professor Dr. Amy Brownlee. A pathologist, Brownlee also directs global rotations for pathology medical residents and supports Tomoka in developing Malawi’s first pathology training program.“UNC staff are most proud of and see the most hope not just in our patients, but also in the fact that we’re developing researchers who will do this for their mother country,” Fedoriw said.Categories Global, Health and Medicine, School of Medicine, University News"
author = "Gillie"
year_published = 2025
year_updated = 2025
