["https://www.unc.edu/academics/online-education"]
title = "Online and Distance Education - The University of North Carolina at Chapel Hill"
full_description = "Of the public, for the public – in North Carolina and beyondAt its core, and fundamental to its future, Carolina is “of the public, for the public.” Historically, distance and continuing education has been a foundational part of this mission, serving as the “Gateway to Carolina” for the community. Looking ahead, this service mindset drives UNC-Chapel Hill’s planning via its strategic plan, Carolina Next: Innovations for Public Good.Online and distance education look very different than they did even one year ago, but they are still ultimately about the students. We’re working to extend Carolina learning opportunities to those who might not otherwise have access, removing barriers to a great education. Along the way, we’re bringing the best of current standards and emerging trends to our online offerings.We hope you’ll join us. Learn more about online and distance education.Todd NicoletVice Provost for Digital and Lifelong Learning Fall 2021 Online CoursesTo support students as they make degree progress, the University continues to provide limited online course options for undergraduate students who need to attend remotely. We have carefully selected a range of courses that are likely to help most undergraduate students, and we will reserve seats for those students who have been identified as needing this flexibility before opening registration to all students.Graduate Level Online ProgramsEshelman School of PharmacyMaster of Science Degree in Pharmaceutical SciencesGraduate School Professional Science Master’s in Biomedical and Health InformaticsKenan-Flagler Business SchoolMaster of Business AdministrationMaster of AccountingSchool of GovernmentMaster of Public AdministrationSchool of Media and JournalismCertificate in Digital CommunicationMaster of Arts in Digital CommunicationSchool of Information and Library ScienceProfessional Science Master’s in Digital Curation and ManagementSchool of Public HealthCertificate in Community Preparedness and Disaster ManagementCertificate in Core Public Health ConceptsCertificate in Field EpidemiologyCertificate in Global HealthCertificate in Occupational Health NursingCertificate in Public Health LeadershipExecutive DrPH in Health LeadershipMaster’s in Health Administration in Public Health Policy and ManagementMaster’s in Public Health in Public Health LeadershipMaster’s in Public Health in Public Health Policy and ManagementAllied Health SciencesMaster of Clinical Laboratory ScienceMaster’s in Radiologic ScienceTransitional Doctoral Program in Physical TherapyPrograms at other UNC institutionsVisit online.northcarolina.edu for current information about all online academic programs offered through the University of North Carolina System.State Authorization Reciprocity Agreement (SARA)The State Authorization Reciprocity Agreement is a voluntary agreement among member states, districts and territories that establishes comparable national standards for interstate offering of postsecondary distance education courses and programs. It is intended to make it easier for students to take online courses offered by postsecondary institutions based in another state. SARA is overseen by a National Council (NC-SARA) and administered by four regional education compacts.North Carolina is a member state of SARA, through the Southern Regional Education Board (SREB). UNC-Chapel Hill is a participating institution of SARA and authorized to offer distance education courses and programs to students located in all 50 states, the District of Columbia and U.S. territories.Student Complaints about Delivery of Distance EducationReauthorization of the Higher Education Act includes regulations regarding the delivery of distance education to out-of-state residents. The United States Department of Education requires that institutions comply with any applicable state approval or educational requirements in each state to which distance education instruction is delivered.Students have the right to file a complaint against an institution when these requirements are not followed or regarding the loss of tuition and fees as a result of unfair business practices. Institutions must provide both current and prospective students with contact information for filing complaints with its accrediting body and the appropriate state agency for handling complaints in a student’s resident state.Examples of consumer protection complaints for SARA purposes include, but are not limited to:Accuracy of recruitment and marketing materials;Accuracy of job placement data;Accuracy of information about tuition, fees and financial aid;Complete and accurate admission requirements for courses and programs;Accuracy of information about the institution’s accreditation and/or any programmatic/specialized accreditation held by the institution’s programs;Accuracy of information about whether course work meets any relevant professional licensing requirements or the requirements of specialized accrediting bodies;Accuracy of information about whether the institution’s course work will transfer to other institutions; andOperation of distance education programs consistent with practices expected by institutional accreditors (and, if applicable, programmatic/specialized accreditors) and/or the Council of Regional Accrediting Commissions (C‐RAC) Guidelines for distance education.If you have a complaint about UNC-Chapel Hill’s distance education programs and the issue could not be resolved internally, read more and learn about options and resources related to student complaints about delivery of distance education."
