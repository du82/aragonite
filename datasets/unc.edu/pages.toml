["https://www.unc.edu/posts/2025/02/14/why-is-black-youth-suicide-on-the-rise"]
title = "Why is Black youth suicide on the rise? | UNC-Chapel Hill"
description = "UNC School of Education faculty are looking at factors inside schools that may affect students’ mental health."
full_description = "Constance Lindsay is researching the connection between school discipline and the increasing rates of Black youth suicide. (Submitted photo) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyConstance Lindsay, assistant professor at the UNC School of Education, is conducting research alongside Carolina professors to learn about increasing suicide rates among Black youth over the past several years.Broadly, her work focuses on evaluating policies and practices to close racial achievement gaps in education. Part of this research is looking at what’s happening inside schools, by studying teachers, leaders and educators.Another part of Lindsay’s work is seeing what then happens outside of schools — how factors inside schools may affect student behavior and outcomes beyond the school building.“As we know, these rates are going up, so we are trying to investigate why,” said Lindsay. “We want to make this connection explicit between receiving discipline in schools and students’ later mental health outcomes.”This research is an interdepartmental collaboration within the school, with Lindsay and associate professors Marissa Marraccini and Dana Griffin. They are looking at Black youth, inside and outside of school, to see what contributes to their mental health outcomes.Lindsay first learned of Marraccini and Griffin’s work from the school’s lightning symposium, a recurring event where professors give a five-minute overview of their work. From there, the three came together to think how they could apply their individual expertise and findings to solve this issue. They started writing a research paper during the COVID-19 pandemic, which was published a year later in School Psychology Review and garnered attention.In that publication, they focused on providing school-based professionals, from counselors to teachers, to with existing resources to develop holistic approaches to mental health care for younger Black males, relating to trauma, justice and equity. But this work raised new questions for their research.“Being at a place like Carolina where I can collaborate with other schools and professors made me want to dig deeper,” said Lindsay.Lindsay and her colleagues hoped to receive funding to analyze the topic more in depth to help North Carolina children.In 2023, the Student Experience Research Network gave the group a grant to collect more data on the topic. The trio will use the funding to start making the connection between disparities in discipline and later mental health outcomes for Black students.The Walton Family Foundation also awarded the trio a grant to extend their data collection for several more years. They recently submitted a paper where they conducted a national review of all state education policies relating to Black youth to provide more quantitative analysis.Having already done interviews with school-based professionals, like counselors and administrators, the group plans to interview parents. They have co-designed sessions, bringing their research together into action for school-based professionals and parents to support the mental health needs of Black youth and work to prevent suicide.The group’s research is already being integrated into the School of Education’s school counseling and school psychology programs, which are training school professionals to provide mental health resources and care to K-12 students.“We want to offer solutions,” said Lindsay. “Our research has a holistic way of thinking about mental health that is useful for interacting with youth, so there is a lot of potential moving forward.”Lindsay hopes in the future the group can show the connection between early discipline experiences and later mental health outcomes to help school-based educators, professionals and administrators to truly understand the implications of in-school behaviors.Categories Health and Medicine, School of Education, University News, Wellness"
author = "Gillie"
year_published = 2025
