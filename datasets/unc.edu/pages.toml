["https://www.unc.edu/about/support-the-university"]
title = "Support the University - The University of North Carolina at Chapel Hill"
full_description = "Support the University Get involved!No matter what your affiliation is with Carolina, the Office of University Development aims to foster and grow a strong and lasting relationship to help you reach your philanthropic goals and move the University forward. Supporting CarolinaCarolina is a place like no other. Built from a public mission, we strive to make the world a better place for all. You play a vital role in what comes next. With your help, we can do more for our state, nation and world. Make a gift today and invest in Carolina’s future, explore areas and causes that you can support or find out how you can get involved and make an impact.GIVE NOWSupport the University Get involved!No matter what your affiliation is with Carolina, the Office of University Development aims to foster and grow a strong and lasting relationship to help you reach your philanthropic goals and move the University forward.Carolina StoriesThe true beneficiaries of gifts to Carolina are the students empowered to pursue their goals and passions; the researchers whose work will solve the world’s greatest problems; and the people we serve. Read about how your contribution makes an impact and changes lives.VISIT THE CAROLINA STORIES GALLERYCarolina Covenant Scholar Nya Smythe ’24 is a force in the Carolina community and wants to continue having an impact after graduation.READ NYA’S CAROLINA STORYKara Hume, associate professor at the UNC School of Education, is advancing research to build community through Power Hour.READ KARA’S CAROLINA STORYVeteran Matty Colón found new hope thanks to THRIVE, an empowering clinical outreach program for veterans and first responders.READ MATTY’S CAROLINA STORYHow to Support CarolinaCreate Your Carolina Legacy"
