title = "The Graduate School - The University of North Carolina at Chapel Hill"
full_description = "Excellence in graduate educationGraduate students and programs are crucial to UNC-Chapel Hill’s tradition of excellence in research, undergraduate teaching and community-engaged scholarship. The Graduate School supports its students from admission to academics — all to ensure career readiness and future success.The Graduate School is leading the Graduate Student Experience initiative, charged by the provost to recommend new policies and procedures to support graduate student academic success and overall wellbeing. The initiative is developing support and resources for teaching assistants, mentors and mentees and working to increase student access to mental health and wellbeing services. Read moreBeth Mayer-DavisDean of The Graduate School"
