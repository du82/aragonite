["https://www.unc.edu/about/mission"]
title = "Carolina's mission and values | UNC-Chapel Hill"
description = "The nation’s first public university serves North Carolina, the United States and the world through teaching, research, and public service."
full_description = "The University of North Carolina at Chapel Hill, the nation’s first public university, serves North Carolina, the United States, and the world through teaching, research, and public service. We embrace an unwavering commitment to excellence as one of the world’s great research universities.Our mission is to serve as a center for research, scholarship, and creativity and to teach a diverse community of undergraduate, graduate, and professional students to become the next generation of leaders. Through the efforts of our exceptional faculty and staff, and with generous support from North Carolina’s citizens, we invest our knowledge and resources to enhance access to learning and to foster the success and prosperity of each rising generation. We also extend knowledge-based services and other resources of the University to the citizens of North Carolina and their institutions to enhance the quality of life for all people in the State.With lux, libertas — light and liberty — as its founding principles, the University has charted a bold course of leading change to improve society and to help solve the world’s greatest problems.(Approved by the UNC Board of Governors, November 2009 and February 2014.)"
