title = "Holy Days and Observances | UNC-Chapel Hill"
description = "Use this calendar as a resource for education and accommodation as you plan classroom, academic and co-curricular events."
full_description = "January 2025Jan. 6Epiphany (Christian), also known as “Theophany” in Eastern Christian tradition, is a Christian feast day commemorating the visit of the Magi, the baptism of Jesus, and the wedding at Cana.Jan. 14 Makar Sankranti/Pongal (Hinduism), also called Vinayaka Chaturthi, marks the birth of the Hindu deity Ganesha, the elephant-headed god of prosperity, new beginnings, and wisdom.February 2025Feb. 26Maha Shivaratri (Hinduism) Each month in the Hindu calendar, a Shivaratri or “Night of Shiva” is observed, which is a festival with an all-night vigil to remember the importance of overcoming ignorance and darkness. The Maha Shivaratri or “Great Night of Shiva” is the most spiritually significant night of shiva that occurs before the arrival of summer.Feb. 28-March 30Ramadan/Ramazan (Islam) Focusing on faith, this holy observance celebrates the Quran being revealed for the first time during this month on the night of Laylat al Qadr.March 2025March 5Ash Wednesday (Christian) Signifying the beginning of Lent, a 40-day period leading up to Easter, during which many Christians give up some of their common pleasures. March 13-14Purim (Jewish), is a Jewish festival held in spring (on the 14th or 15th day of Adar) to commemorate the defeat of Haman’s plot to massacre the Jews as recorded in the Book of Esther.March 14Holi (Hinduism), known as the Festival of Colors, Festival of Spring and the Festival of Love, it is a celebration of the arrival of spring, the divine love of Radha Krishna and the victory of good over evil.March 25Annunciation Day (Eastern Orthodox, Roman Catholic and Protestant Christian) celebrates the belief that an angel announced to Mary, the mother of Jesus, that she was pregnant. March 29-30Eid Al-Fitr (Islam) Signifies the last day of Ramadan and the end of the fasting period.April 2025April 12-20Pesach/Passover (Jewish), also called Pesach, is a major Jewish holiday, that celebrates the Israelites’ escape from slavery in Egypt. Pesach starts on the 15th day of the Hebrew month of Nisan which is considered the first month of the Hebrew year.April 13Palm Sunday (Christian) celebrates the belief in the story of the entry of Jesus into Jerusalem. April 14Vaisakhi/Birthday of the Khalsa (Sikh) is the Sikh New Year and is regarded as one of the most important dates on the Sikh calendar. Vaisakhi marks the start of the Punjabi New Year, celebrates the birth of Khalsa, and symbolizes standing up to oppression.April 18Good Friday (Christian) commemorates the execution of Jesus, this Holy Day occurs the Friday before Easter. April 20Easter (Christian) is a celebration recognizing Jesus’ resurrection from death and is often recognized as the most ancient and important holiday in the Christian religious calendar.May 2025May 5Buddha Purnima (Buddhism) Purnima translates to “full moon” in Sanskrit Festival dedicated to the birth of the price Siddhartha Gautama, who later became Gautama Buddha, the founder of Buddhism.May 29Buddha (Christian) is a Celebration of the belief that Jesus ascended to heaven forty days after being resurrected.May 29Ascension Day (Christian) is a Celebration of the belief that Jesus ascended to heaven forty days after being resurrected.June 2025June 1-3 Shavuot (Jewish), also known as the Festival of Weeks, commemorates the giving of the Torah from God to the nation of Israel on top of Mount Sinai.June 7 Eid-Al-Adha (Islamic/Muslim), known as the “festival of the Sacrifice” is a celebration in honor of Ibrahim’s (Abraham) willingness to submit to God’s command to sacrifice his son.June 8Pentecost (Christian), which means “fifty” is a day when Christians celebrate their belief in the descent of the Holy Spirit on the followers of Jesus fifty days after Easter.July 2025July 5 Ashura, Muharram (Islamic) is the 10th day of the 1st month of the Islamic lunar calendar, Muharram.July 24Pioneer Day (The Church of Jesus Christ of Latter-day Saints), which commemorates the arrival of the first group of Latter-day Saints to the Salt Lake Valley, on July 24, 1847.August 2025Aug. 2-3 Tish’a’B’av (Jewish), (the ninth day of the Hebrew month of Av) is a memorial for all of the communal tragedies of Jewish history, and especially for the destruction of the Temple in Jerusalem in 70 C.E. Aug. 16Krishna Janmashtami (Hinduism) celebrates the birth of Krishna who was born on this day, and is the eighth avatar of the god Vishnu and worshiped as the Supreme god.Aug. 27Ganesh Chaturthi (Hinduism), also called Vinayaka Chaturthi, marks the birth of the Hindu deity Ganesha, the elephant-headed god of prosperity, new beginnings, and wisdom.September 2025Sept. 22-24 Rosh Hashana (Jewish), is literally the “head of the year”, or Jewish New Year, celebrated with remembrance and judgment and auguring in the 10 days of reflection and atonement leading up to Yom Kippur.Sept. 22-Oct. 2Navratri (Hinduism) is a festival dedicated to the Divine Feminine, often associated with Durga Ma and Goddess Parvati. The festival lasts for nine days and nine nights, in which the nine goddesses are worshipped. The celebration is dedicated to her victories over demons and evil.October 2025Oct. 1-2Yom Kippur (Jewish) is considered the holiest and most solemn day in the Jewish calendar. Jews often abstain from eating and drinking during this holiday.Oct. 2Vijayadashami, Dasara, Dussehra Puja (Hinduism) is a composite of “victory” (Vijaya) and “tenth” (Dashami) because of the victory of the Rama, an avatar of Vishnu, over the 10-headed demon king, Ravana, on the tenth day of the month of Ashvin. The festival symbolizes the victory of good over evil and marks the end of Sharada Navaratri. Oct. 6-13Shemini Atzeret (Jewish), “Eighth Day of the Solemn Assembly”, is a Jewish religious festival on the eighth day of Sukkoth (Feast of Booths), considered by some to be an independent celebration immediately following Sukkoth. October 13-15Sukkot (Jewish), is a week-long festival celebrated by dwelling in a temporary outdoor hut – a “sukkah” in which Jews celebrate and give thanks for the Fall harvest.October 14-15Simchat Torah (Jewish), means “rejoicing of the Torah” and is also known as Simhat Torah, a Jewish holiday that celebrates and marks the conclusion of the annual cycle of public Torah readings, and the beginning of a new cycle.November 2025Nov. 5Guru Nanak Gurpurab (Sikh), is one of the most important religious festivals of Sikhs, celebrated to commemorate the birth of Guru Nanak, the first Sikh Guru. December 2025Dec. 14-22Chanukah/Hannukah (Jewish), The Hebrew word Chanukah means “dedication,” and this holiday commemorates the rededication of the Holy Temple in Jerusalem. Dec. 25Christmas Day (Christian), honors the birth of Jesus Christ and his self-sacrifice."
