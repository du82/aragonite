full_description = "Where Carolina’s borders end, the town of Chapel Hill – a vibrant, welcoming community of 62,000 people – continues.Chapel Hill routinely ranks as one of the best college towns and best places to live in the United States, a reputation guided by the diverse social, cultural and professional opportunities that flow between campus and town. From live music and eclectic dining to quiet trails and historic architecture, discover more about Chapel Hill – and the surrounding area. About the Town Where Carolina’s borders end, the town of Chapel Hill – a vibrant, welcoming community of 62,000 people – continues.Chapel Hill routinely ranks as one of the best college towns and best places to live in the United States, a reputation guided by the diverse social, cultural and professional opportunities that flow between campus and town. From live music and eclectic dining to quiet trails and historic architecture, discover more about Chapel Hill – and the surrounding area.Among the first, frequently the best, always originalOur campus, our town and our people are all part of the mystique that will make you want to call Chapel Hill your “home” for four years or for a lifetime. Visit Chapel Hill Chapel Hill-Carrboro Chamber of Commerce Downtown Chapel Hill Town of Chapel Hill Town of Carrboro Town of Hillsborough Orange CountyWhat makes Chapel Hill so special?A look at some videos about the town and its people.Play VideoA look at the town and surrounding countyPlay VideoTown and University side-by-sidePlay VideoThe tastes, sites and sounds!"
