["http://www.unc.edu/universityday"]
title = "University Day | UNC-Chapel Hill"
description = "University Day is an occasion to remember the University’s past and celebrate its future. The date, October 12, marks the laying of the cornerstone of Old East, the institution’s first building and the oldest state university building in the nation."
full_description = "University Day 2024Join us for the University Day celebration and the installation of Chancellor Lee H. Roberts at 11 a.m. Oct. 11 at Memorial Hall.Classes will be canceled from 11 a.m.-12:20 p.m. in honor of the ceremony.Please note the following policies to enter the ceremony, including clear bags:Guests may bring a clear plastic bag no larger than 12 x 6 x 12 inches or a small clutch purse no larger than 4.5 x 6.5 inches.Signs larger than 8.5 x 11 inches are not permitted.A digital program of the event is available at universityday.unc.edu.University Day is an occasion to remember the University’s past and celebrate its future. The date, Oct. 12, marks the laying of the cornerstone of Old East, the institution’s first building and the oldest state university building in the nation. The Carolina community first celebrated University Day in 1877, after Governor Zebulon B. Vance, as chair of the Board of Trustees, ordered that the day “be observed with appropriate ceremonies under the direction of the faculty.”Subsequent celebrations have featured speeches from distinguished members of the faculty and honored visitors. President John F. Kennedy spoke in 1961, as did Bill Clinton in 1993. North Carolina governors have made University Day a traditional stop during their first term of office – including Luther Hodges, Jim Hunt, Terry Sanford, Jim Martin, Mike Easley, Bev Perdue, Pat McCrory and Roy Cooper.During the annual ceremony, Tar Heels who have made outstanding contributions to humanity are recognized with the Distinguished Alumna and Alumnus Awards.Beginning in 1957 with William B. Aycock, University Day became the traditional inauguration day for new chancellors: Paul F. Sharp in 1964, J. Carlyle Sitterson in 1965, N. Ferebee Taylor in 1972, Christopher C. Fordham III in 1980, Paul Hardin in 1988, Michael Hooker in 1995, James Moeser in 2000, Holden Thorp in 2008, Carol Folt in 2013 and Kevin Guskiewicz in 2020.Public higher education began in Chapel Hill in 1793, and for more than two hundred years, Carolina has symbolized the importance of education in a democratic nation. It remains a place defined by those values, as noted by Governor Terry Sanford in 1987, of “freedom and liberty and tolerance, the search for truth, the defense of dignity, courage to arrive freely at convictions, and the personal courage to stand for those hopes and truths.”"
