["https://www.unc.edu/posts/2025/02/10/emotion-detective-tracks-effects-of-stress"]
title = "Emotion detective tracks effects of stress | UNC-Chapel Hill"
description = "Doctoral candidate Adrienne Bonar studies the many factors that shape people’s feelings."
full_description = "Adrienne Bonar, a doctoral candidate in the psychology and neuroscience department, examines the social, psychological and physiological factors that shape our emotions. (Donn Young/College of Arts and Sciences) Share on Facebook Share on Twitter Share on Pinterest Share via EmailPrint FriendlyAdrienne Bonar was a huge fan of television crime shows in high school. One of her favorites, “Lie to Me,” featured world-renowned deception researcher and psychologist Cal Lightman, who examined criminal suspects’ facial movements, body language and tone of voice to determine if they were lying.At Carolina, the Waxhaw native followed her interests and took an introductory psychology class and a first-year seminar called “Psychology of Emotion.” The seminar instructor encouraged Bonar to get involved in the Carolina Affective Science Lab.“One thing that intrigued me early on was that emotions are such a core part of what it means to be human,” Bonar said.Bonar went on to major in psychology and women’s and gender studies. After graduation in 2018, she spent two years as a research assistant in the Child Imaging Research on Cognition and Life Experiences Lab, working with faculty members Margaret Sheridan and Adam Bryant Miller.Today, Bonar ’18 ’23 (MA) is a doctoral candidate and part of the Carolina Affective Science Lab — the same lab where she had a transformative research experience as an undergraduate. A Royster Fellowship from The Graduate School and a National Science Foundation Fellowship have supported her doctoral studies.Bonar is particularly interested in why people respond differently to stress. “Why is one person as cool as a cucumber, while another person is freaking out?” she asked.One project she is working on examines the differences in how people describe their emotional experience. When you ask some people how they are feeling, they can be really detailed about breaking that down, she said.“Research has shown us that the ability to be precise and nuanced about how you feel is really beneficial to your well-being,” she said.Bonar is also interested in how body sensations and body image inform how people make sense of their emotions and how stress can “get under the skin” to affect emotional processes and subsequent health.“I am interested in how stressful life experiences end up affecting the brain and the body — both early on and at any point in life,” she said. “How can this have a negative impact on physical and mental health? How does stress change the way the brain and body function?”Bonar knows that college can be a stressful time. Based on her own research into emotions, she has some advice for students on taking care of their own mental health.It’s helpful to be able to articulate how you are feeling, she said. And even though it seems like simple advice, science backs the benefits of sleep, exercise and proper hydration.“Social support is also important,” Bonar added. “Find those people you can commiserate and celebrate with — even just one person you can turn to when things are challenging and that you can spend quality time with.”Bonar said she sets an alarm that tells her when to go to bed each night. To keep her motivated to exercise, she has gym memberships for Pilates and cycling. She’s been busy this semester working on her dissertation, but she has also enjoyed activities like pottery classes at the Carrboro ArtsCenter.Finally, Bonar urged students to be willing to embrace a nonlinear academic path and to follow their passions. “Find something that interests you and stick with it,” she said.Read more about Adrienne Bonar.Categories College of Arts and Sciences, Research"
