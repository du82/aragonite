full_description = "Admissions and Aid At Carolina we help incredible students prepare to change the world. Get to know us, explore our community and learn what it means to be a Tar Heel. We can't wait to get to know you.Coming to Carolina Undergraduate AdmissionsWelcome to Carolina -- a community where students challenge each other to be better together than any of them could be individually. Graduate AdmissionsCarolina’s Graduate School supports a diverse community of students and upholds a tradition of excellence in research, undergraduate teaching and community-engaged scholarship. Scholarships and AidWe're committed to making a college education affordable for every student who earns a spot at Carolina. Nearly half of UNC-Chapel Hill students receive some form of financial aid. Tuition and FeesCarolina was founded to offer an excellent education that’s within everyone’s reach, and today we’re ranked in the top five in value among public universities. Explore the costs of studying at Carolina. New Student and Family ProgramsThe Carolina experience begins at orientation. New Student and Family Programs helps prepare new undergraduate students for a smooth transition into their time at UNC-Chapel Hill and works to build strong relationships between families and the University.Apply as an Undergraduate StudentApply as a Graduate StudentEstimate Your Costs"
