["https://www.unc.edu/alumni"]
title = "Alumni - The University of North Carolina at Chapel Hill"
full_description = '''Carolina Alumni Students for a few years. Alumni forever.Carolina Alumni, formerly the General Alumni Association, serves the University and all of its students — past, present and future. Tar Heel AlumniTar Heels are everywhere. Carolina’s more than 362,000 alumni live in all 50 states — with more than half of them in North Carolina — and 147 countries.Carolina Alumni Students for a few years. Alumni forever.Carolina Alumni, formerly the General Alumni Association, serves the University and all of its students — past, present and future.Keeping Connections StrongVisit the Carolina Alumni website for the latest events and programs, as well as news from the Carolina Alumni Review. Ringing Clear and TrueThe GAA's Official Class Ring ceremony connects students to a lineage stretching all the way back to the University's first student — Hinton James, class of 1798 — while signaling they are on "the cusp of endeavors ... you cannot begin to imagine." Black Alumni ReunionFrom celebrating Carolina's Black Pioneers — the 414 black students who came to Carolina between 1952 and 1972 — to supporting students through the Light on the Hill Society Scholarship, the Black Alumni Reunion continues to raise the BAR. Binding GenerationsFamilies celebrate their shared connections to Carolina at the annual Legacy Pinning Ceremony. Carolina Alumni ReviewSix times a year, in print and on your mobile devices, the Review brings Carolina to you. UNC Alumni AppWherever you go, keep Carolina in your pocket. Download the free UNC Alumni app and log in to discover nearby Alumni Association services and Tar Heel happenings relevant to you.Timeless TraditionsFor more than 175 years, the UNC General Alumni Association has served The University of North Carolina and everyone connected to it — alumni, students and the Carolina community. Our members make that possible.Play VideoEvery day is a #GDTBATH, especially when you call Carolina home.Join Carolina AlumniAlumni DirectoryStudent Alumni Association'''
