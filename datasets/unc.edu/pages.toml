full_description = "Campus Recreation Engage in some serious fun. Campus Recreation welcomes students, faculty, staff and family members of all ability levels to enjoy our inclusive social and physical activities, from personal fitness and outdoor education to intramural and club sports.Actively fun. Seriously recreational. ProgramsGet outside for a backpacking adventure. Swim, climb or train your way to your fitness goals. Or, get social with one of Carolina’s many club and intramural sports teams. The possibilities are endless – and all yours. FacilitiesWork out in our fully equipped fitness and aquatic centers, soar across our zip line or canoe on Kerr Lake. Make a splash, run the field, conquer the course -- and find your place to play. Group fitnessFrom running to cycling, yoga to weight training, we put a Carolina spin on getting fit together."
