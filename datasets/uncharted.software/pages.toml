full_description = "TechnologyInfluent The publications and talks shown below relate to Uncharted’s Influent. Filter by: Technology PanTera Provenant TellFinder Influent Argument Mapper GeoTime Field Finance Big Data Graphs Visualization Theory See All Publications Talks 2024 Visual Journey Analytics: lessons learned from real-world implementations Brath, R., P. Andersen, M. Matusiak, and R. Gerber, 1st Annual Workshop on Visual Process Analytics (VIPRA), 26th Eurographics Conference on Visualization (EuroVis), Odense, Denmark, May 2024 Process mining and more broadly journey analytics create sequences that can be understood with graph-oriented visual analytics. We have designed and implemented more than a dozen visual analytics on sequence data in production software over the last 20 years. We outline a variety of data challenges, user tasks, visualization layouts, node and edge representations, and interactions, including strengths and weaknesses and potential future research. View Paper 2014 Influent: Scalable Transaction Flow Analysis with Entity-Relationship Graphs Jonker D., S. Langevin, D. Gauldie and W. Wright, Poster, IEEE EuroVis 2014 In this paper, we present in-progress work on “Influent,” a graph analysis tool that enables an intelligence analyst to visually and interactively “follow the money” or other transaction flow. Summary visualizations of transactional patterns and entity characteristics, a left-to-right semantic flow layout, interactive link expansion and hierarchical entity clustering enable Influent to operate effectively at scale with millions of entities and hundreds of millions of transactions, with larger data sets in progress. View Paper Talks Publications 2015 Untangling Influence and Desire: Visual Analysis of Massive Graph Data Jonker, D. and S. Langevin, Strata, London, May 2015 This session demonstrates using open source tools and techniques for visually exploring massive node-link graphs in a web browser by visualizing all the data. Seeing all the data reveals informative patterns and provides important context to understanding insights. Examples will highlight large-scale graph analysis of social networks, customer purchase history, and healthcare industry data. View Slides Influent Watch Video"
