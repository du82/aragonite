full_description = "TechnologyGeoTime The publications and talks shown below relate to Uncharted’s prior development of GeoTime. Filter by: Technology PanTera Provenant TellFinder Influent Argument Mapper GeoTime Field Finance Big Data Graphs Visualization Theory See All Publications Talks 2008 Grand Challenge Award 2008: Support for Diverse Analytic Techniques Support for Diverse Analytic Techniques (Grand Challenge) Chien, L., A. Tat, P. Proulx, A. Khamisa and W. Wright, IEEE Visual Analytics Science and Technology VAST 2008 GeoTime and nSpace2 are interactive visual analytics tools that were used to examine and interpret all four of the 2008 VAST Challenge datasets. GeoTime excels in visualizing event patterns in time and space, or in time and any abstract landscape, while nSpace2 is a web-based analytical tool designed to support every step of the analytical process. View Paper Configurable Spaces: Temporal Analysis in Diagrammatic Contexts Kapler, T., R. Eccles, R. Harper and W. Wright, IEEE Visual Analytics Science and Technology VAST 2008 This paper traces progress from concept to prototype, and discusses how diagrams can be created, transformed and leveraged for analysis, including generating diagrams from knowledge bases, visualizing temporal concept maps, and the use of linked diagrams for exploring complex, multi-dimensional, sequences of events. View Paper 2007 Stories in GeoTime Best Paper Eccles, R., T. Kapler, R. Harper, W. Wright, IEEE VAST 2007 A story is a powerful abstraction used by intelligence analysts to conceptualize threats and understand patterns as part of the analytical process. This paper demonstrates a system that detects geo-temporal patterns and integrates story narration to increase analytic sense-making cohesion in GeoTime. View Paper nSpace and GeoTime - VAST 2006 Case Study Proulx, P., L. Chien, R. Harper, D. Schroh, T. Kapler, D. Jonker and W. Wright, IEEE Computer Graphics and Applications, September 2007 This paper is a detailed case study describing how the nSpace/GeoTime tools created an analytical environment that enabled two novice analysts to examine the scenario, discover patterns, trace connections, assess evidence, visually represent meaningful hypotheses with associated evidence, track progress, collaborate with others and then produce a final report. View Paper 2006 Avian Flu Case Study with nSpace and GeoTime Proulx, P., S. Tandon, A. Bodnar, D. Schroh, R. Harper, and W. Wright, IEEE VAST 2006 GeoTime and nSpace are new analysis tools that provide innovative visual analytic capabilities. This paper uses an epidemiology analysis scenario to illustrate and discuss these new investigative methods and techniques. In addition, this case study is an exploration and demonstration of the analytical synergy achieved by combining GeoTime’s geo-temporal analysis capabilities, with the rapid information triage, scanning and sensemaking provided by nSpace. View Paper 2005 Correlating Events with Tracked Movements in Time and Space: A GeoTime Case Study Kapler, T., R. Harper, and W. Wright, 2005 Intelligence Analysis Conference, Washington, DC., May 2005 GeoTime is a new paradigm for visualizing events, connections and movement in a combined temporal and spatial visualization. This paper will show how this information visualization capability allows intelligence analysts to quickly reveal relationships between tracked movements and events of interest. View Paper GeoTime Visualization of RFID: Providing Global Visibility of the DoD Supply Chain Shuping, D. (FC Business Systems) and W. Wright (Uncharted Software, Inc.), January 2005 GeoTime visualization exploits the collection and storage of RFID data, and provides global in-transit visibility of the DoD supply chain down to the last tactical mile. View Paper 2004 GeoTime Information Visualization Kapler, T. and W. Wright, IEEE InfoVis 2004 Analyzing observations over time and geography is a common task but typically requires multiple, separate tools. The objective of our research has been to develop a method to visualize, and work with, the spatial inter-connectedness of information over time and geography within a single, highly interactive 3-D view. A novel visualization technique for displaying and tracking events, objects and activities within a combined temporal and geospatial display has been developed. This technique has been implemented as a demonstrable prototype called GeoTime in order to determine potential utility. View Paper Talks Publications 2012 Human Movement Patterns: Space-Time Geography of Everyday Mobilities Garton, C. and W. Wright, Royal Geographic Society, Edinburgh, July 2012 From Royal Geographical Society with the Institute of British Geographers (RGS-IBG) conference 2010 Combining Space-Time and Network Analysis Wright, W., ESRI Conference on Space-Time Modeling and Analysis, Redlands, CA, 2010 From AHFE Cross-Cultural-Decision-Making (CCDM) conference GeoTime"
