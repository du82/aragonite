title = "High-Performance Engineering | Uncharted®"
description = """
Last summer we began tracking tweets that mention Donald Trump in preparation for our talk at Strata NY. At the time it looked like things were only going to get more interesting so we kept watching and, as of Feb 1, we’d processed over 59 million tweets. With the Iowa caucus last week it seemed like a good time to revisit some of our earlier analysis.                                                              Read More"""
full_description = "High-Performance Engineering Big Data is messy. We build distributed, AI-enhanced pipelines to transform billions of data points into visual insights in real time. Here are some examples from our blog below. Filter by: Tag Accolades Augmented Intelligence Enhanced Perception High-Performance Engineering Kinetic Interaction See All Page 3 Two Days of Trump in Iowa 2 million tweets, 700 thousand voices Rob Harper February 5, 2016 Last summer we began tracking tweets that mention Donald Trump in preparation for our talk at Strata NY. At the time it looked like things were only going to get more interesting so we kept watching and, as of Feb 1, we’d processed over 59 million tweets. With the Iowa caucus last week it seemed like a good time to revisit some of our earlier analysis. Read More TorFlow Data Flow in the Tor Network Chris Dickson and Kevin Birk January 17, 2016 The Tor project is an open network for anonymous communication over the internet. Tor routes users' internet traffic through a series of volunteer-run relay nodes to conceal its origin and destination from potential surveillance or censorship. While Tor is built for anonymity, the structure of the network and locations of many of the relay nodes is open. Read More Introducing Uncharted Salt Open source, multi-scale big data visualization Sean McIntyre December 22, 2015 One of the questions we’ve spent a lot of time pondering over the years is a deceptively simple one - How do we visualize billions of data points? To understand why this is a difficult question to answer, let’s look at two popular approaches. Read More Continuous Integration with Apache Spark Sean McIntyre November 6, 2015 We’ve been writing libraries for Spark at Uncharted for several years, and continuous integration involving the Spark runtime has always been a difficult thing to accomplish. Common approaches, such as creating a Spark context within a standard Scala runtime, can fail to accurately emulate nuances of the distributed Spark environment. I’d like to share a solution we’ve developed for creating a native Spark test environment within TravisCI. Read More Uncharted wins Most Innovative NASA World Wind Application October 1, 2012 «« « 1 2 3 » »»"
