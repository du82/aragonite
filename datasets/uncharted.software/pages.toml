["https://uncharted.software/blog/uncharted-at-ieee-vis-2021"]
title = "Uncharted at IEEE VIS 2021 | Uncharted®"
description = "Join us at any of our sessions or just reach out to discuss the latest in visual analytics."
full_description = "Back It’s time again for IEEE VisWeek, and Uncharted is excited to be on hand both as a sponsor of the VIS Diversity/Inclusivity Scholarships and a presenter of three new peer-reviewed research papers. We hope you’ll join us to talk about these latest innovations (see below for more information), keep up with the state-of-the-art in visual analytics, and chat about opportunities to join our team. A Mixed-Initiative Visual Analytics Approach for Qualitative Causal Modeling by Fahd Husain, Pascale Proulx, Meng-Wei Chang, Rosa Romero-Gómez, and Holland Marie Vasquez On Friday, October 29 from 08:00–09:30 AM CDT (UTC-5) in the main VIS track, we’ll discuss our short paper on Causemos, our mixed-initiative visual analytics platform for creating qualitative models of complex socio-natural systems. Causemos allows analysts to rapidly construct, explore, and curate models by leveraging causal relationships automatically extracted from literature across disparate domains. In the paper, we present findings of initial evaluations from technical analysts who used Causemos to try to find issues that contribute to food shortages in East Africa. A Multi-scale Visual Analytics Approach for Exploring Biomedical Knowledge Winner of the Best Paper Award, VAHC Workshop by Fahd Husain, Rosa Romero-Gómez, Emily Kuang, Dario Segura, Adamo Carolli, Lai Chung Liu, Manfred Cheung, and Yohann Paris In the Workshop on Visual Analytics in Healthcare (VAHC) on Sunday, October 24 at 10:00 CDT (UTC-5), we’ll present our work developing a prototype system for exploring large-scale knowledge graphs backed by hundreds of thousands of peer-reviewed scientific articles. This enables both the analysis of biomedical network processes and the exploration of scientific knowledge at scale. In the paper, which has been awarded Best Paper at VAHC, we utilize coordinated hierarchical and flow-based graph layouts, multi-faceted search and clustering visualizations to help researchers trace emerging research on biomedical processes such as COVID-19. Surveying Wonderland to Uncover More Literature Visualization Techniques by Richard Brath In the 6th Workshop on Visualization for the Digital Humanities on Sunday, October 24 from 10:00–11:30 AM CDT (UTC-5), we’ll present results of a survey of more than 50 visualizations of Alice’s Adventures in Wonderland to understand the range of literature visualization techniques used across domains to provide insights for new text visualizations and future text visualization research. VizSec 2021, IEEE Symposium on Visualization for Cyber Security Uncharted Senior Research Engineer Rosa Romero-Gómez will serve as the Program Co-Chair of the 18th IEEE Symposium on Visualization for Cyber Security. VizSec will be held on Wednesday, October 27 from 08:00–13:30 PM CDT (UTC-5). And more… Interested in learning more about Uncharted’s pioneering work in visual analytics and beyond? Check out our other recent publications: A Multi-Scale Approach for Biological Graph Visualization: Local Analysis in Global Context by Fahd Husain, Rosa Romero-Gómez, Dario Segura, Adamo Carolli, Lai Chung Liu, Manfred Cheung, and Yohann Paris Causeworks Collaboration: Simultaneous Causal Model Construction and Analysis by Thomas Kapler, Derek Gray, Holland Vasquez, and William Wright CauseWorks: A Framework for Transforming User Hypotheses into a Computational Causal Model by Thomas Kapler, Derek Gray, Holland Vasquez, and William Wright Acknowledgements Uncharted’s presenters and authors at VisWeek this year include Adamo Carolli, Dario Segura, Emily Kuang, Fahd Husain, Holland Marie Vasquez, Lai Chung Liu, Manfred Cheung, Meng-Wei Chang, Pascale Proulx, Richard Brath, Rosa Romero-Gómez, and Yohann Paris. This post was written by Michael Crouch with assistance from Fahd Husain and Richard Brath. Last Post Next Post"
