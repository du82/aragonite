["https://uncharted.software/research/finance"]
title = "Finance | Uncharted®"
description = "Uncharted solutions for the financial sector bring the power of rich, interactive visualization applications to some of the toughest problems in the industry. Dashboards are just the tip of the iceberg."
full_description = '''FieldFinance Filter by: Technology PanTera Provenant TellFinder Influent Argument Mapper GeoTime Field Finance Big Data Graphs Visualization Theory See All Publications Talks 2022 3Dify: Extruding Common 2D Charts with Timeseries Data Brath, R. and M. Matusiak, IEEE Conference on Virtual Reality + 3D User Interfaces (IEEE VR 2022), March 2022 3D charts are not common in financial services. We review chart use in practice. We create 3D financial visualizations starting with 2D charts used extensively in financial services, then extend into the third dimension with timeseries data. We embed the 2D view into the 3D scene; constrain interaction and add depth cues to facilitate comprehension. Usage and extensions indicate success. View Paper View Poster 2021 Automated Insights on Visualizations with Natural Language Generation Brath, R. and C. Hagerman, 25th International Conference Information Visualisation, Sydney, July 2021 Quantitative data, such as a 10k financial report, requires cognitive load to scan the columns and rows and identify patterns and important takeaways, whether novice or subject matter expert. Visualizations can be used to summarize and reveal patterns. However, it may still be difficult to understand what is most meaningful. What should the viewer pay attention to? In this research, we reduce the cognitive load in understanding tabular data by combining charts with ranked natural language generated (NLG) bullet point statements that summarize the top takeaways. View Paper 2019 Visual Analytic System for Subject Matter Expert Document Tagging using Information Retrieval and Semi-Supervised Machine Learning Hagerman, C., R. Brath and S. Langevin, IV19: 23rd International Conference Information Visualization, Paris, July 2019 We present a system that combines ambient visualization, information retrieval and machine learning to facilitate the ease and quality of document classification by subject matter experts for the purpose of organizing documents by “tags” inferred by the resultant classifiers. This system includes data collection, a language model, query exploration, feature selection, semi-supervised machine learning and a visual analytic workflow enabling non-data scientists to rapidly define, verify, and refine high-quality document classifiers. View Paper 2014 Challenges in Financial Visualization R. Brath, L. Comrie, D. Keller, E. Knuth and E. Sorenson, IEEE VisWeek 2014 Financial visualization has existed for more than 100 years. Ongoing growth of financial markets increases the frequency, complexity and scale of data while users need to discern meaningful insights for many different types of tasks and objectives. This panel brings together four established practitioners from the financial industry who use visualization tools every day. View Paper 3D InfoVis is Here to Stay Brath, R., IEEE VIS International Workshop on 3DVis, 2014 3D information visualization has existed for more than 100 years. 3D offers intrinsic attributes such as an extra dimension for encoding position and length, meshes and surfaces; lighting and separation. Further 3D can aid mental models for configuration of data within a 3D spatial framework. Perceived issues with 3D are solvable and successful, specialized information visualizations can be built. 2013 Financial Visualization Case Study: Correlating Financial Timeseries and Discrete Events to Support Investment Decisions Sorenson, E., R. Brath, IV13 Conference Bloomberg has designed and implemented a scalable visual representation for the depiction of many discrete timestamped events in use by hundreds of thousands of financial markets experts. This visualization enables a single screen to visually organize a large volume of event data; to facilitate inference through visual alignment of related data; and to provide a workflow from the single point of access to a wide variety of detailed information. View Paper 2007 Visual Analytics for Model-Based Policy Analysis: Exploring Rapid Changes in Commodities Markets. Mirel, B., P. Goldsmith, R. Brath, and B. Cort, Proceedings of the 8th Annual International Conference on Digital Government Research: Bridging Disciplines & Domains, 2007. Digital Government Society of North America We will demonstrate an interactive visualization prototype with capabilities for ad hoc exploration that we have not found in other tools for policy analysis outside of the intelligence community. This visual workspace is built on a dynamic butterfly economic model. It enables analysts to examine for policy purposes global trends in consumption, production, imports and exports at national and regional scales and to relate them to population, GDP and income elasticity. 2006 Spreadsheet Validation and Analysis through Content Visualization Brath, R. and M. Peters, EuSpRIG 2006 Visualizing spreadsheet content provides analytic insight and visual validation of large amounts of spreadsheet data. Oculus Excel Visualizer is a point and click data visualization experiment which directly visualizes Excel data and re-users the layout and formatting already present in the spreadsheet. View Paper 2005 Visualizing Spreadsheets Adds Exponential Value to Excel for Monitoring, Analysis and Modeling Brath, R. and M. Peters, dataWarehouse Direct, December 2005 Microsoft Excel has evolved beyond a simple data calculation tool to the point where it is now used as a sophisticated and flexible repository for collecting, analyzing and summarizing data from multiple sources. The power of Excel can be leveraged with visualization in many different ways: enhancing effectiveness, focusing communications, helping make anomalies pop out, facilitating comprehension and empowering collaboration. View Paper Visualization for Communication: The Importance of Aesthetic Sizzle Brath, R., M. Peters and R. Senior, IEEE IV05 2005 When creating a visualization for communication, the inclusion of aesthetically appealing elements can greatly increase a design’s appeal, intuitiveness and memorability. Used without care, this “sizzle” can reduce the effectiveness of the visualization by obscuring the intended message. Maintaining a focus on key design principles and an understanding of the target audience can result in an effective visualization for communication. This paper describes these principles and shows their use in creating effective designs. View Paper Information Visualization for Business - Past & Future Brath, R. and M. Peters, DM Review, January 2005 The opportunities for competitively harnessing information visualization to drive strategic business advantage are much bigger today than 10 years ago. Choose your visualization solutions carefully; fit is extremely important, and with visualization, a poor fit will show! View Paper 2004 Dashboard Design: Why Design is Important Brath, R. and M. Peters, DM Review / DM Direct, October 2004 Effective design is crucial for dashboards. A good information design will clearly communicate key information to users and makes supporting information easily accessible. View Paper 2003 Paper Landscapes: A Visualization Design Methodology Brath, R., SPIE 2003 Paper landscape refers to both an iterative design process and a document as an aid to the design and development process for creating new information visualizations. A paper landscape engages all stakeholders early in the process of creating new visualizations and is used to solicit input; clarify ideas, features, requirements, tasks; and obtain support for the proposal, whether group consensus, market validation or project funding. View Paper 2000 Visualization Value for Northern Trust Investors Wright, W. and J. O'Neil, Data Mining for Financial Services Conference, IBC, Chicago, 2000 Data Mining for Financial Services Conference, IBC, Chicago. 1999 Information Animation - Applications in the Capital Markets Wright, W., IEEE/ACM First Information Visualization Conference, October 1995. Selected for the first section in "Readings in Information Visualization", 1999 This groundbreaking book defines the emerging field of information visualization and offers the first-ever collection of the classic papers of the discipline, with introductions and analytical discussions of each topic and paper. The authors' intention is to present papers that focus on the use of visualization to discover relationships, using interactive graphics to amplify thought. Buy on Amazon 1998 Risk Visualization Wright, W., Invited speaker, Risk Management Technologies Conference, IBC, London UK, 1998 Invited speaker from Risk Management Technologies Conference Seeing Investment Strategy Wright, W., Global Investment Management, March 1998 From Global Investment Management 1997 Multi-Dimensional Representations - How Many Dimensions? Cluster Stack Visualization for Market Segmentation Analysis Wright, W., New Paradigms in Information Visualization and Manipulation, ACM Conference On Information and Knowledge Management, November 1997 “Information visualization methods present multi-dimensional data graphically by mapping data and properties to different visual shapes, colors, and positions… The purpose of visualization is to improve comprehension and reveal significance. It is easier to comprehend a visual representation than a numerical one, especially when the visual representation replaces many pages or screens of data. " View Paper Business Visualization Applications Wright, W., IEEE Computer Graphics and Applications, July 1997 From IEEE Computer Graphics and Applications, July issue View Paper Video, Ergo, Cogito - Seeing Investment Strategy Wright, W., Institutional Investor, 1997 Investment Roundtable, Amsterdam Institutional investor from Investment Roundtable Talks Publications 2023 New Frontiers in Data Visualization Brath, R. and W. Brooke. CMT Association 50th Annual Symposium, New York, April 2023 Expert technical analysts are always looking for new techniques to better understand supply, demand, and market prices. In this presentation, we examine the potential of alternative datasets, advanced AI and novel visualizations to reveal market movements. Watch Video (Membership Required)'''
