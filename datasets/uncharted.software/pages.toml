full_description = "TechnologyProvenant The publications and talks shown below relate to Uncharted’s Provenant. Filter by: Technology PanTera Provenant TellFinder Influent Argument Mapper GeoTime Field Finance Big Data Graphs Visualization Theory See All Publications 2018 TopicOnTiles: Tile-Based Spatio-Temporal Event Analytics via Exclusive Topic Modeling on Social Media Choi, M., S. Shin, J. Choi, S. Langevin, C. Bethune, P. Horne, N. Kronenfeld, R. Kannan, B. Drake, H. Park, J. Choo, ACM Conference on Human Factors in Computing Systems (CHI), April 2018 Detecting anomalous events of a particular area in a timely manner is an important task. Geo-tagged social media data are useful resources, but the abundance of everyday language in them makes this task still challenging. To address such challenges, we present TopicOnTiles, a visual analytics system that can reveal the information relevant to anomalous events in a multi-level tile-based map interface by using social media data. To this end, we adopt and improve a recently proposed topic modeling method that can extract spatio-temporally exclusive topics corresponding to a particular region and a time point. View Paper 2016 Graph Mapping: Multi-Scale Community Visualization of Massive Graph Data Jonker, D., S. Langevin, D. Giesbrecht, M. Crouch, and N. Kronenfeld, Information Visualization Journal, August 2016 Graph visualizations increase the perception of entity relationships in a network. However, as graph size and density increases, readability rapidly diminishes. In this cover article for the July 2017 edition of the Information Visualization journal, we present an end-to-end, tile-based visual analytic approach called graph mapping that utilizes cluster computing to turn large-scale graph (node-link) data into interactive visualizations in modern web browsers. View Paper 2015 Multi-Scale Community Visualization of Massive Graph Data Langevin, S., D. Jonker, D. Giesbrecht and M. Crouch, IEEE EGAS Exploring Graphs at Scale 2015 Graph visualizations increase the perception of entity relationships in a network. However, as graph size and density increases, readability rapidly diminishes. In this paper, we present a tile-based visual analytic approach that leverages cluster computing to create large-scale, interactive graph visualizations in modern web browsers. Our approach is optimized for analyzing community structure and relationships. View Paper Global to Local Pattern of Life Analysis with Tile-Based Visual Analytics Langevin, S., D. Jonker, K. Birk, C. Bethune and N. Kronenfeld, IEEE Vis 2015, Practitioner Session In this paper, we present in-progress work on applications of tile-based visual analytics (TBVA) to population pattern of life analysis and geo-temporal event detection. TBVA uses multiresolution data tiling, analytics and layered high-fidelity visualization to enable interactive multi-scale analysis of billions of records in modern web browsers through techniques made familiar by online map services. View Paper View Poster"
