["https://uncharted.software/research/theory"]
title = "Visualization Theory | Uncharted®"
description = "We empower people to be better --- with data. Uncharted conceives and creates cutting-edge technology with world-renowned companies and pioneers of global resilience."
full_description = "FieldVisualization Theory Filter by: Technology PanTera Provenant TellFinder Influent Argument Mapper GeoTime Field Finance Big Data Graphs Visualization Theory See All Publications Talks 2024 Visual Journey Analytics: lessons learned from real-world implementations Brath, R., P. Andersen, M. Matusiak, and R. Gerber, 1st Annual Workshop on Visual Process Analytics (VIPRA), 26th Eurographics Conference on Visualization (EuroVis), Odense, Denmark, May 2024 Process mining and more broadly journey analytics create sequences that can be understood with graph-oriented visual analytics. We have designed and implemented more than a dozen visual analytics on sequence data in production software over the last 20 years. We outline a variety of data challenges, user tasks, visualization layouts, node and edge representations, and interactions, including strengths and weaknesses and potential future research. View Paper Towards Accessible, Flexible and Collaborative Scientific Modeling with Terarium Proulx, P., J. Waese, M.W. Chang, et al, 1st Workshop on Human-Notebook Interactions, ACM CHI, Honolulu, HI, May 2024 In the evolving field of scientific modeling research, computational notebooks have made steps to promote collaboration by providing interactive environments for code execution, visualization, and narrative composition; however they are still limited. To overcome these limitations, we introduce Terarium, a platform that attempts to socialize scientific modeling for a broad audience, including students, researchers, and data scientists. View Paper 2023 Work Domain Analysis of Electric Transmission Networks and Operation Hilliard, A., R. Brath, and G. A. Jamieson, IEEE Systems Journal, December 2023 Electric networks are globally significant systems being transformed to support increased wind and solar generation. To structure development of real-time operator support, we developed a conceptual model of electric transmission network operation that represents physical, functional, and purposeful distinctions and summaries used by experts at a North American transmission operator and reliability coordinator. View Paper Visualizing Textual Distributions of Repeated LLM Responses to Characterize LLM Knowledge Brath, R., A. Bradley, D. Jonker, NLVIZ Workshop, IEEE VIS 2023, Melbourne, Australia, October 2023 The breadth and depth of knowledge learned by Large Language Models (LLMs) can be assessed through repetitive prompting and visual analysis of commonality across the responses. We show levels of LLM verbatim completions of prompt text through aligned responses, mind-maps of knowledge across several areas in general topics, and an association graph of topics generated directly from recursive prompting of the LLM. View Paper Visualizing LLM Text Style Transfer Brath, R., A. Bradley, D. Jonker, NLVIZ Workshop, IEEE VIS 2023, Melbourne, Australia, October 2023 Text Style Transfer (TST) retains semantic content while modifying stylistic features. Exploratory visualization of LLM-generated TST via semantically aligned text visualization reveals advanced stylistic techniques such as use of metaphors. LLM style inquiry can be used to articulate advanced stylistic devices such as interjections, idioms and rhetorical devices and visually depicted as multivariate style heatmaps. View Paper Many Types of Design Needed for Effective Visualizations Brath, R., VisGap Workshop, 25th Eurographics Conference on Visualization (EuroVis), Leipzig, Germany, June 2023 For effective visualizations, there are many types of design to consider. Visualization design focuses on core theory of tasks, data and visual encodings. Workflow design, user interface design and graphic design all contribute to successful visualizations. All design aspects range from initial design exploration to iterative design refinement. Guidelines can help, but have limitations. View Paper 2022 Causeworks: A Mixed-Initiative Framework for Causal Modeling Kapler, T., D. Gray, H. Vasquez, W. Wright, SN Computer Science, November 2022 The construction of computational causal models for complex systems has typically been completed manually by domain experts and is a time-consuming, cumbersome process. We introduce Causeworks, an application in which operators “sketch” complex systems, leverage AI tools and expert knowledge to transform the sketches into computational causal models, and then apply analytics to understand how to influence the system. View Paper Summarizing Text to Embed Qualitative Data into Visualizations Brath, R., IEEE VisWeek 2022, NLVIZ Workshop, October 2022 Qualitative data can be conveyed with strings of text. Fitting longer text into visualizations requires a) space to place the text inside the visualization; and b) appropriate text to fit the space available. To fit text within these layouts is a function for emerging NLP capabilities such as summarization. View Paper Multimodal Analogs to Infer Humanities Visualization Requirements Brath, R., IEEE VisWeek 2022, 7th Workshop on Visualization for the Digital Humanities, October 2022 Gaps and requirements for multi-modal interfaces for humanities can be explored by observing the configuration of real-world environments and the tasks of visitors within them compared to digital environments. Some of these capabilities exist, but not routinely available in implementations. View Paper Integrating Artificial Intelligence and Visualization for Visual Knowledge Discovery Kovalerchuk, B., K. Nazemi, R. Andonie, N. Datia, and E. Banissi (Eds.), Springer Nature, June 2022 Visual Analytics of Hierarchical and Network Timeseries Models Jonker, D., R. Brath, and S. Langevin Dual Y Axes Charts Defended: Case Studies, Domain Analysis and a Method Brath, R., C. Hagerman, and E. Sorenson VisIRML: Visualization with an Interactive Information Retrieval and Machine Learning Classifier Hagerman, C., R. Brath, and S. Langevin Uncharted contributed the following chapters to Integrating Artificial Intelligence and Visualization for Visual Knowledge Discovery: Visual Analytics of Hierarchical and Network Timeseries Models: Visual analytics that represent many aspects of timeseries models in one holistic application are perceptually scalable to exploration of millions of nodes. Dual Y Axes Charts Defended: Case Studies, Domain Analysis and a Method: We show dual axes charts are necessary for fine-grained correlation analysis that is not made obvious within single axis charts or other means. VisIRML: Visualization with an Interactive Information Retrieval and Machine Learning Classifier: VisIRML, a system to classify and display unstructured data, produces higher quality labels than semi-supervised learning techniques. Buy on Amazon 3Dify: Extruding Common 2D Charts with Timeseries Data Brath, R. and M. Matusiak, IEEE Conference on Virtual Reality + 3D User Interfaces (IEEE VR 2022), March 2022 3D charts are not common in financial services. We review chart use in practice. We create 3D financial visualizations starting with 2D charts used extensively in financial services, then extend into the third dimension with timeseries data. We embed the 2D view into the 3D scene; constrain interaction and add depth cues to facilitate comprehension. Usage and extensions indicate success. View Paper View Poster Self-Supervised Learning for Timeseries from Multi-Spectral Satellite Imagery Bethune, C., P. Horne, Z. Hills, S. Kramer, J. Gleason. B. Johnson, E. Barnett, R. Brath, S. Langevin, 2nd Annual LIKE (Location Intelligence Knowledge Exchange) Mother Earth Conference, March 2022 Distil is a system for constructing point-and-click machine learning models, here extended for multi-spectral satellite imagery for timeseries data leveraging an autoML pipeline, adding embedding model trained using self-supervised learning; rapid data labeling facilitated with image query; hierarchical geospatial timeseries modeling; and sub-image feature extraction using weakly supervised segmentation. View Paper 2021 Surveying Wonderland to Uncover More Literature Visualization Techniques Brath, R., IEEE VisWeek 2021, 6th Workshop on Visualization for the Digital Humanities (VIS4DH), October 2021 There are still many potential literature visualizations to be discovered. By focusing on a single text, the author surveys many existing visualizations across domains, in the wild, and creates new visualizations. Many dozen techniques are indicated, suggesting a wider variety of potential visualizations beyond research disciplines. View Paper A Mixed-Initiative Visual Analytics Approach for Qualitative Causal Modeling Husain, F., P. Proulx, M.W. Chang, R. Romero-Gómez, H. Vasquez, IEEE VisWeek 2021, October 2021 Modeling complex systems is a time-consuming, difficult and fragmented task, often requiring the analyst to work with disparate data, a variety of models, and expert knowledge across a diverse set of domains. Applying a user-centered design process, we developed a mixed-initiative visual analytics approach, a subset of the Causemos platform, that allows analysts to rapidly assemble qualitative causal models of complex socio-natural systems. View Paper A Multi-scale Visual Analytics Approach for Exploring Biomedical Knowledge Best Paper, VAHC Workshop, IEEE VisWeek 2021 Husain, F., R. Romero-Gómez, E. Kuang, D. Segura, A. Carolli, L.C. Liu, M. Cheung, Y. Paris, IEEE VisWeek 2021, 12th Workshop on Visual Analytics in Healthcare (VAHC), October 2021 This paper describes an ongoing multi-scale visual analytics approach for exploring and analyzing biomedical knowledge at scale. We utilize global and local views, hierarchical and flow-based graph layouts, multi-faceted search, neighborhood recommendations, and document visualizations to help researchers interactively explore, query, and analyze biological graphs against the backdrop of biomedical knowledge. View Paper Useable Machine Learning for Sentinel-2 Multispectral Satellite Imagery Langevin, S., C. Bethune, P. Horne, S. Kramer, J. Gleason, B. Johnson, E. Barnett, F. Husain, A. Bradley, SPIE Image and Signal Processing for Remote Sensing, September 2021 One of the challenges when building Machine Learning (ML) models using satellite imagery is building sufficiently labeled data sets for training. In the past, this problem has been addressed by adapting computer vision approaches to GIS data with significant recent contributions to the field. But when trying to adapt these models to Sentinel-2 multi-spectral satellite imagery these approaches fall short. To address this deficit, we present Distil, and demonstrate a specific method using our system for training models with all available Sentinel-2 channels. View Paper A Multi-scale Approach for Biological Graph Visualization: Local Analysis in Global Context Husain, F., R. Romero-Gómez, D. Segura, A. Carolli, L.C. Liu, M. Cheung, Y. Paris, International Society for Computational Biology ISMB/ECCB 2021, BioVis COSI: Biological Data Visualizations, July 2021 Biologists grapple with large multi-scale graphs to find relevant subgraphs for answering a range of biological questions. Our approach for scalable graph analysis enables biologists to interactively explore, query, and analyze biological graphs at different scales. Computational biologists see promise in our approach for various use cases such as drug interactions and disease propagation. View Poster Automated Insights on Visualizations with Natural Language Generation Brath, R. and C. Hagerman, 25th International Conference Information Visualisation, Sydney, July 2021 Quantitative data, such as a 10k financial report, requires cognitive load to scan the columns and rows and identify patterns and important takeaways, whether novice or subject matter expert. Visualizations can be used to summarize and reveal patterns. However, it may still be difficult to understand what is most meaningful. What should the viewer pay attention to? In this research, we reduce the cognitive load in understanding tabular data by combining charts with ranked natural language generated (NLG) bullet point statements that summarize the top takeaways. View Paper Causeworks Collaboration: Simultaneous Causal Model Construction and Analysis Kapler, T., D. Gray, H. Vasquez, W. Wright, ACM CHI, Late-Breaking Work Paper, 2021 Military planners use “Operational Design” (OD) to understand systems and relationships in complex operational environments. Causeworks is a visual analytics application for OD teams to collaboratively build causal models of environments to understand and find solutions to affect them. Collaborative causal modeling can help teams craft better plans, but there are unique challenges in developing synchronous collaboration tools for building and using causal models. Causeworks overlays analytics inputs and outputs over a shared causal model to flexibly support multiple modeling tasks simultaneously in a collaborative environment with minimal state management burden on users. View Paper Causeworks: A Framework for Transforming User Hypotheses into a Computational Causal Model Kapler, T., D. Gray, H. Vasquez, W. Wright, International Conference on Information Visualization Theory and Applications (IVAPP), 2021 Causal Model building for complex problems has typically been completed manually by domain experts and is currently a time-consuming, cumbersome process. The resulting models are simple diagrams produced on whiteboards, and do not support computational analytics, thus limiting usefulness. Causeworks helps operators “sketch” complex systems, and transforms sketches into computational causal models using automatic and semi-automatic causal model construction from knowledge extracted from unstructured and structured documents. Causeworks integrates computational analytics to assist users in understanding and influencing the system. View Paper 2020 Visualizing with Text Brath, R., AK Peters Visualization Series, CRC Press, November 2020 Visualizing with Text uncovers the rich palette of text elements usable in visualizations from simple labels through to documents. Using a multidisciplinary research effort spanning across fields including visualization, typography, and cartography, it builds a solid foundation for the design space of text in visualization. Buy from Publisher Literal Encoding: Text Is a First-Class Data Encoding Brath, R., IEEE VIS 2020, Workshop on Visualization for the Digital Humanities, Salt Lake City, October 2020 Digital humanities are rooted in text analysis. However, most visualization paradigms use only categoric, ordered or quantitative data. Literal text must be considered a base data type to encode into visualizations. Literal text offers functional, perceptual, cognitive, semantic and operational benefits. These are briefly illustrated with a subset of sample visualizations focused on semantic word sequences, indicating benefits over standard graphs, maps, treemaps, bar charts and narr"
year_published = 2024
