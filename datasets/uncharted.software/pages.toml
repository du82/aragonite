full_description = "High-Performance Engineering Big Data is messy. We build distributed, AI-enhanced pipelines to transform billions of data points into visual insights in real time. Here are some examples from our blog below. Filter by: Tag Accolades Augmented Intelligence Enhanced Perception High-Performance Engineering Kinetic Interaction See All AI and LLM-Assisted Scientific Modeling in Terarium Michael Crouch October 30, 2024 In a crisis like a pandemic, time stands still. Policymakers rush to chart a way out, trying to establish some consensus truth about the situation and the best path forward. The “open science” movement rallies to offer predictive models, but the models are seemingly limitless in number, of uncertain provenance and questionable suitability, and they don’t agree. Understanding and extending complex model code requires deep expertise and takes weeks at best, especially when there’s little transparency into the original intent and assumptions. Read More Radically Improving LLM Responses with Context-Tailored Knowledge Graphs Julian Whiting July 4, 2024 Uncharted has been working on applications of knowledge-graph augmented Retrieval-Augmented Generation (RAG) for months now and couldn’t be more excited about its potential. Read More From Geological Treasure Hunting to Future Proofing Supply Chains Michael Crouch December 8, 2023 Is your holiday wish list full of eco-friendly gadgets? Even if you’ve been decidedly nice, supply chain fragility may impact what ends up under your tree. Read More Uncharted at IEEE VIS 2021 Join us at any of our sessions or just reach out to discuss the latest in visual analytics. Michael Crouch October 20, 2021 It’s time again for IEEE VisWeek, and Uncharted is excited to be on hand both as a sponsor of the VIS Diversity/Inclusivity Scholarships and a presenter of three new peer-reviewed research papers. Read More Introducing GeoTime Live Live pings and real-time sharing on any device. Melissa Lameiras October 15, 2021 We’re excited to introduce GeoTime Live, a new crime-fighting tool that lets investigators use any device to instantly map live ping emails. GeoTime Live has already been successfully used in exigent scenarios for cases related to narcotics, homicide, fugitive, kidnappings, Amber Alerts, Silver Alerts, despondents and dispatch. Read More «« « 1 2 3 » »»"
