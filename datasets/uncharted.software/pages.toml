title = "Augmented Intelligence | Uncharted®"
description = """
In a crisis like a pandemic, time stands still. Policymakers rush to chart a way out, trying to establish some consensus truth about the situation and the best path forward. The “open science” movement rallies to offer predictive models, but the models are seemingly limitless in number, of uncertain provenance and questionable suitability, and they don’t agree. Understanding and extending complex model code requires deep expertise and takes weeks at best, especially when there’s little transparency into the original intent and assumptions.                                      Read More"""
full_description = "Augmented Intelligence The world belongs in the hands of humans. We empower faster, more informed decision-making with user-centered machine intelligence. Here are some examples from our blog below. Filter by: Tag Accolades Augmented Intelligence Enhanced Perception High-Performance Engineering Kinetic Interaction See All AI and LLM-Assisted Scientific Modeling in Terarium Michael Crouch October 30, 2024 In a crisis like a pandemic, time stands still. Policymakers rush to chart a way out, trying to establish some consensus truth about the situation and the best path forward. The “open science” movement rallies to offer predictive models, but the models are seemingly limitless in number, of uncertain provenance and questionable suitability, and they don’t agree. Understanding and extending complex model code requires deep expertise and takes weeks at best, especially when there’s little transparency into the original intent and assumptions. Read More Radically Improving LLM Responses with Context-Tailored Knowledge Graphs Julian Whiting July 4, 2024 Uncharted has been working on applications of knowledge-graph augmented Retrieval-Augmented Generation (RAG) for months now and couldn’t be more excited about its potential. Read More From Geological Treasure Hunting to Future Proofing Supply Chains Michael Crouch December 8, 2023 Is your holiday wish list full of eco-friendly gadgets? Even if you’ve been decidedly nice, supply chain fragility may impact what ends up under your tree. Read More Collect and Connect the Dots with LLMs Richard Brath and Adam Bradley August 24, 2023 Understanding and organizing a summation of knowledge is hard. Large language models (LLMs) can help, but words alone are not enough. Read More Uncharted Earns Another Spot on the Leaderboard in AI Competition by DARPA and USGS Uncharted's approaches for identifying a variety of map features win top rankings in follow-on critical minerals challenge. Michael Crouch December 19, 2022 When last we checked on the joint DARPA and USGS AI for Critical Mineral Assessment Competition, we were thrilled to discover that we won the Map Georeferencing challenge. We’re honored to find ourselves on the leaderboard once again for the second challenge, Map Feature Extraction. Read More «« « 1 2 3 4 » »»"
