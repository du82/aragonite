title = "Influent® - Follow the Money | Uncharted®"
description = "We empower people to be better --- with data. Uncharted conceives and creates cutting-edge technology with world-renowned companies and pioneers of global resilience."
full_description = '''Follow the Money Contact Uncharted AML & Threat Finance Investigations Enhance Monitoring & Speed up Alert Disposition by enabling investigators to follow the money. Financial Crimes and Forensic Accounting Present evidence visually in an easy to understand format. Identify and add new data sources as investigations progress. Wire Transfers and International Payments Enhances the understanding of large and dirty datasets. Powerful dashboards highlight critical information. Social Media and Communications Data Reason over complex communication networks; Understand who knew what, when, and how. "What normally takes me hours or days I can discover in Influent in a few minutes" - US Federal Analyst Unifying Disparate and Dirty Data Influent creates a single investigation platform, linking disparate and imperfect data sources to quickly access all the information on an entity of interest. Fuzzy searching and automated entity resolution dramatically reduce data wrangling and allows analysts to focus on the critical investigative aspects of their work. Unifying Disparate and Dirty Data Influent creates a single investigation platform, linking disparate and imperfect data sources to quickly access all the information on an entity of interest. Fuzzy searching and automated entity resolution dramatically reduce data wrangling and allows analysts to focus on the critical investigative aspects of their work. Maintain Clarity With Scale Understanding complex behaviors involving large numbers of entities is a major challenge for analysts. Influent's activity summary with clustering and link expansion allows analysts to rapidly identify and assess key actors and interactions from billions of records. See Temporal and Geographic Patterns Influent provides important insight into entity characteristics by grouping entities by key dimensions such as country of residence alongside patterns of activity, empowering rapid identification of important actors. See Temporal and Geographic Patterns Influent provides important insight into entity characteristics by grouping entities by key dimensions such as country of residence alongside patterns of activity, empowering rapid identification of important actors. Developed as part of DARPA's XDATA programme and deployed to hundreds of analysts at Federal Agencies and Major Banks, Influent has been successfully employed in numerous Counter Threat Finance and Anti-Money Laundering Investigations. The Science Behind Influent® Using graphs (node-link diagrams) to visualize extremely large entity-relationship datasets can be extremely challenging. "Hairballs" resulting from trying to portray even just a fraction of the data are difficult and time consuming to explore and understand. Influent was developed for a DARPA program whose mandate was to find new and better ways to work with huge datasets and solve these problems. Designed by Experts Uncharted brings the expertise of our own Richard Brath and David Jonker who wrote the book on graph analysis and visualization to the design of Influent. View Book Built for Perceptual Scalability Using on-demand expansion and hierarchical clustering, Influent applies the latest science of human cognition. View Publications Other Research Learn more about Influent® Contact Uncharted'''
