full_description = "Back VIS 2022 is back in person this year, and so is Uncharted! As proud sponsor of the visualization community’s leading conference, we’ll be in Oklahoma City to present our latest research and catch up with our talented peers and colleagues. We’d love to talk to you about the state of the art and how you can join our team. You’ll find several of us on the convention floor and at any of the following sessions. Summarizing Text to Embed Qualitative Data into Visualizations by Richard Brath NLViz, Sun, Oct 16 at 3:45–4:35 PM CDT Uncharted Managing Partner Richard Brath will present his paper on using emerging NLP to summarize long text explanations of qualitative data so they fit space-constrained visualizations. Multimodal Analogs to Infer Humanities Visualization Requirements by Richard Brath 7th Workshop on Visualization for the Digital Humanities, Sun, Oct 16 at 9:15–10:15 AM CDT Richard Brath will present another paper on observing real-world environments to identify interaction requirements for humanities visualization. Integrating Research and Products moderated by Zhicheng (Leo) Liu VisInPractice, Mon, Oct 17 at 3:45–5:00 PM CDT Richard Brath will join this panel to discuss how to successfully navigate between visualization research and development and fully realized products. And more… Interested in learning more about Uncharted’s pioneering work in visual analytics and beyond? Check out our other recent publications: Integrating Artificial Intelligence and Visualization for Visual Knowledge Discovery contains several chapters written by multiple Uncharted authors 3Dify: Extruding Common 2D Charts with Timeseries Data by Richard Brath and Martin Matusiak Self-Supervised Learning for Timeseries from Multi-Spectral Satellite Imagery by Chris Bethune, Philippe Horne, Zachary Hills, Steve Kramer, Jeffrey Gleason, Ben Johnson, Ezekial Barnett, Richard Brath, and Scott Langevin Unmasking Human Trafficking Risk in Commercial Sex Supply Chains with Machine Learning by Pia Ramchandani, Hamsa Bastani, and Emily Wyatt Acknowledgements Uncharted’s peer-reviewed papers being presented at VIS 2022 were written by Richard Brath. This post was written by Michael Crouch. Last Post Next Post"
