title = "Graphs | Uncharted®"
description = "We empower people to be better --- with data. Uncharted conceives and creates cutting-edge technology with world-renowned companies and pioneers of global resilience."
full_description = "FieldGraphs Filter by: Technology PanTera Provenant TellFinder Influent Argument Mapper GeoTime Field Finance Big Data Graphs Visualization Theory See All Publications Talks 2023 Work Domain Analysis of Electric Transmission Networks and Operation Hilliard, A., R. Brath, and G. A. Jamieson, IEEE Systems Journal, December 2023 Electric networks are globally significant systems being transformed to support increased wind and solar generation. To structure development of real-time operator support, we developed a conceptual model of electric transmission network operation that represents physical, functional, and purposeful distinctions and summaries used by experts at a North American transmission operator and reliability coordinator. View Paper 2022 Causeworks: A Mixed-Initiative Framework for Causal Modeling Kapler, T., D. Gray, H. Vasquez, W. Wright, SN Computer Science, November 2022 The construction of computational causal models for complex systems has typically been completed manually by domain experts and is a time-consuming, cumbersome process. We introduce Causeworks, an application in which operators “sketch” complex systems, leverage AI tools and expert knowledge to transform the sketches into computational causal models, and then apply analytics to understand how to influence the system. View Paper 2021 Surveying Wonderland to Uncover More Literature Visualization Techniques Brath, R., IEEE VisWeek 2021, 6th Workshop on Visualization for the Digital Humanities (VIS4DH), October 2021 There are still many potential literature visualizations to be discovered. By focusing on a single text, the author surveys many existing visualizations across domains, in the wild, and creates new visualizations. Many dozen techniques are indicated, suggesting a wider variety of potential visualizations beyond research disciplines. View Paper A Mixed-Initiative Visual Analytics Approach for Qualitative Causal Modeling Husain, F., P. Proulx, M.W. Chang, R. Romero-Gómez, H. Vasquez, IEEE VisWeek 2021, October 2021 Modeling complex systems is a time-consuming, difficult and fragmented task, often requiring the analyst to work with disparate data, a variety of models, and expert knowledge across a diverse set of domains. Applying a user-centered design process, we developed a mixed-initiative visual analytics approach, a subset of the Causemos platform, that allows analysts to rapidly assemble qualitative causal models of complex socio-natural systems. View Paper A Multi-scale Visual Analytics Approach for Exploring Biomedical Knowledge Best Paper, VAHC Workshop, IEEE VisWeek 2021 Husain, F., R. Romero-Gómez, E. Kuang, D. Segura, A. Carolli, L.C. Liu, M. Cheung, Y. Paris, IEEE VisWeek 2021, 12th Workshop on Visual Analytics in Healthcare (VAHC), October 2021 This paper describes an ongoing multi-scale visual analytics approach for exploring and analyzing biomedical knowledge at scale. We utilize global and local views, hierarchical and flow-based graph layouts, multi-faceted search, neighborhood recommendations, and document visualizations to help researchers interactively explore, query, and analyze biological graphs against the backdrop of biomedical knowledge. View Paper A Multi-scale Approach for Biological Graph Visualization: Local Analysis in Global Context Husain, F., R. Romero-Gómez, D. Segura, A. Carolli, L.C. Liu, M. Cheung, Y. Paris, International Society for Computational Biology ISMB/ECCB 2021, BioVis COSI: Biological Data Visualizations, July 2021 Biologists grapple with large multi-scale graphs to find relevant subgraphs for answering a range of biological questions. Our approach for scalable graph analysis enables biologists to interactively explore, query, and analyze biological graphs at different scales. Computational biologists see promise in our approach for various use cases such as drug interactions and disease propagation. View Poster Causeworks Collaboration: Simultaneous Causal Model Construction and Analysis Kapler, T., D. Gray, H. Vasquez, W. Wright, ACM CHI, Late-Breaking Work Paper, 2021 Military planners use “Operational Design” (OD) to understand systems and relationships in complex operational environments. Causeworks is a visual analytics application for OD teams to collaboratively build causal models of environments to understand and find solutions to affect them. Collaborative causal modeling can help teams craft better plans, but there are unique challenges in developing synchronous collaboration tools for building and using causal models. Causeworks overlays analytics inputs and outputs over a shared causal model to flexibly support multiple modeling tasks simultaneously in a collaborative environment with minimal state management burden on users. View Paper Causeworks: A Framework for Transforming User Hypotheses into a Computational Causal Model Kapler, T., D. Gray, H. Vasquez, W. Wright, International Conference on Information Visualization Theory and Applications (IVAPP), 2021 Causal Model building for complex problems has typically been completed manually by domain experts and is currently a time-consuming, cumbersome process. The resulting models are simple diagrams produced on whiteboards, and do not support computational analytics, thus limiting usefulness. Causeworks helps operators “sketch” complex systems, and transforms sketches into computational causal models using automatic and semi-automatic causal model construction from knowledge extracted from unstructured and structured documents. Causeworks integrates computational analytics to assist users in understanding and influencing the system. View Paper 2020 Strategy Mapper: Coloring the Gray Kondo, B., D. Sheffield, W. Wright, Prepared for IEEE VisWeek 2020 but restricted to limited distribution. Available for qualified recipients only. Strategy Mapper is a visual analytic tool for human-machine decision making in complex situations with uncertainty in estimating and understanding a competitor’s intent and tactics. Users can compare and reason through multiple hypotheses about one or more competitor’s behaviors, and consider recommendations to probe for more information. Using the “Gray Zone” as an application example, a user evaluation exercise shows the methods are usable and effective. View Abstract Why Two Y-Axes (Y2Y): A Case Study for Visual Correlation with Dual Axes Brath, R., C. Hagerman and E. Sorenson, 24th International Conference Information Visualisation, Vienna, September 2020 Many researchers and authors recommend against dual axis charts. We provide a case study of timeseries correlation analysis in financial services where dual axis charts superimpose series to facilitate observation of local patterns. Fine-grain patterns cannot be otherwise perceived using a single axis charts, normalization charts, scatterplots nor statistical correlation analysis. View Paper View Presentation 2017 An Open Source Adaptive User Interface for Network Monitoring Kortschot, S.W., D. Sovilj, H. Soh, G.A. Jamieson, S. Sanner, C. Carrasco, S. Ralph and S. Langevin, IEEE International Conference on Systems, Man, and Cybernetics (SMC), October 2017 Decision support systems for network security represent a critical element in the safe operation of computer networks. Unfortunately, due to their complexity, it can be difficult to implement and empirically assess novel techniques for displaying networks. This paper details an open source adaptive user interface that hopes to fill this gap. This system supports agile development and offers a wide latitude for human factors and machine learning design modifications. The intent of this system is to serve as an experimental testbed for determining the efficacy of different human factors and machine learning initiatives on operator performance in network monitoring. View Paper 2016 Adaptive Visualization of Complex Networks with FocalPoint: A Context Aware Level of Details Recommender System Inibhunu, C. and S. Langevin, Human Factors and Ergonomics Society (HFES) 2016, September 2016 We are investigating FocalPoint, an adaptive level of detail (LOD) recommender system tailored for hierarchical network information structures. FocalPoint reasons about contextual information associated with the network, user task, and user cognitive load to tune the presentation of network visualization displays to improve user performance in perception, comprehension and projection of current situational awareness. Our system is applied to two complex information constructs important to dynamic cyber network operations: network maps and attack graphs. View Paper Adapting Level of Detail in User Interfaces for Cybersecurity Operations Inibhunu, C. , S. Langevin, S. Ralph, N. Kronenfeld, H. Soh, G.A. Jamieson, S. Sanner, S.W. Kortschot, C. Carrasco, and M. White, IEEE Resilience Week, August 2016 Our research focus is on developing FocalPoint, a system that provides Adaptive Level of Detail (LOD) in user interfaces for cybersecurity operations. FocalPoint is a recommender system tailored for complex network information structures that reasons about contextual information associated with the network, user tasks, and cognitive load. This facilitates tuning cyber visualization displays, thereby improving user performance in perception, comprehension and projection of current Cybersecurity Situational Awareness (Cyber SA). View Paper Graph Mapping: Multi-Scale Community Visualization of Massive Graph Data Jonker, D., S. Langevin, D. Giesbrecht, M. Crouch, and N. Kronenfeld, Information Visualization Journal, August 2016 Graph visualizations increase the perception of entity relationships in a network. However, as graph size and density increases, readability rapidly diminishes. In this cover article for the July 2017 edition of the Information Visualization journal, we present an end-to-end, tile-based visual analytic approach called graph mapping that utilizes cluster computing to turn large-scale graph (node-link) data into interactive visualizations in modern web browsers. View Paper 2015 Multi-Scale Community Visualization of Massive Graph Data Langevin, S., D. Jonker, D. Giesbrecht and M. Crouch, IEEE EGAS Exploring Graphs at Scale 2015 Graph visualizations increase the perception of entity relationships in a network. However, as graph size and density increases, readability rapidly diminishes. In this paper, we present a tile-based visual analytic approach that leverages cluster computing to create large-scale, interactive graph visualizations in modern web browsers. Our approach is optimized for analyzing community structure and relationships. View Paper Graph Analysis and Visualization: Discovering Business Opportunity in Linked Data Brath R. and D. Jonker, John Wiley & Sons, January 2015 Graph Analysis and Visualization brings graph theory out of the lab and into the real world. Using sophisticated methods and tools that span analysis functions, this guide shows you how to exploit graph and network analytic techniques to enable the discovery of new business insights and opportunities. Buy on Amazon 2014 Influent: Scalable Transaction Flow Analysis with Entity-Relationship Graphs Jonker D., S. Langevin, D. Gauldie and W. Wright, Poster, IEEE EuroVis 2014 In this paper, we present in-progress work on “Influent,” a graph analysis tool that enables an intelligence analyst to visually and interactively “follow the money” or other transaction flow. Summary visualizations of transactional patterns and entity characteristics, a left-to-right semantic flow layout, interactive link expansion and hierarchical entity clustering enable Influent to operate effectively at scale with millions of entities and hundreds of millions of transactions, with larger data sets in progress. View Paper 2013 Louvain Clustering for Big Data Graph Visual Analytics Gauldie, D., S. Langevin, P. Schretlen, D. Jonker, N. Bozowsky and W. Wright, IEEE VisWeek, October 2013 Visual aggregation techniques, tools and easily tailorable components are needed that will support answering analytical questions with data description, characterization and interaction without loss of information. We present two case studies of prototype implementations of JavaScript browser-based visualization tools leveraging the Louvain clustering algorithm. View Paper 2008 Configurable Spaces: Temporal Analysis in Diagrammatic Contexts Kapler, T., R. Eccles, R. Harper and W. Wright, IEEE Visual Analytics Science and Technology VAST 2008 This paper traces progress from concept to prototype, and discusses how diagrams can be created, transformed and leveraged for analysis, including generating diagrams from knowledge bases, visualizing temporal concept maps, and the use of linked diagrams for exploring complex, multi-dimensional, sequences of events. View Paper Talks Publications 2023 Telling the Story of TellFinder: How We Harness Knowledge Graphs, AI and Deep Web Search to Combat Human Trafficking Wyatt, E., The Knowledge Graph Conference, New York, May 2023 TellFinder is a software platform that enables counter human trafficking investigators to search and visualize many millions of enriched adult service ads from the deep web. In this talk we discuss how TellFinder works and how it has impacted investigations and prosecutions during its active deployment with various agencies. Watch Video (Subscription Required) 2017 Text Analytics and New Visualization Techniques Brath, R. and S. Langevin, Strata, New York, September 2017 Text analytics have significantly advanced with techniques such as entity extraction and characterization, topic and opinion analysis, and sentiment and emotion extraction. But the visualization of text has advanced much more slowly. Recent visualization techniques for text, however, are providing new capabilities. In this talk we offer an overview of these new ways to organize massive volumes of text, characterize subjects, score synopses, and skim through a lot of documents. Together, these techniques can improve workflows for users focused on documents. View Slides Watch Video 2015 Untangling Influence and Desire: Visual Analysis of Massive Graph Data Jonker, D. and S. Langevin, Strata, London, May 2015 This session demonstrates using open source tools and techniques for visually exploring massive node-link graphs in a web browser by visualizing all the data. Seeing all the data reveals informative patterns and provides important context to understanding insights. Examples will highlight large-scale graph analysis of social networks, customer purchase history, and healthcare industry data. View Slides Influent Watch Video 2013 Visualizing Big Graphs and Social Networks Brath, R. and D. Jonker, Strata New York, October 2013 Big graphs are difficult to visualize because the scale of the data quickly results in complex network diagrams that can be difficult to decipher and have complicated interfaces with hundreds of options. Instead, we start "
