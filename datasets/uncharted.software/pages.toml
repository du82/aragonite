full_description = "High-Performance Engineering Big Data is messy. We build distributed, AI-enhanced pipelines to transform billions of data points into visual insights in real time. Here are some examples from our blog below. Filter by: Tag Accolades Augmented Intelligence Enhanced Perception High-Performance Engineering Kinetic Interaction See All Page 2 Visualizing Mobility in Times of Pandemic How might hyperlocal mobility data inform policy making and public health communication around COVID-19? Fahd Husain, Michael Crouch March 30, 2021 Many are wondering what more can be done to contain further outbreaks while a socially distanced world undertakes the time-consuming process of building immunity. We experimented to see how we might enable visualization tools for outbreak analysis. Read More Graph Mapping Featured in Leading InfoVis Research Journal Novel interactive visualization technique for massive graph data reveals hierarchical community structures and entity relationships in large-scale networks Michael Crouch August 24, 2017 An Uncharted research product for the visual analysis of massive graph data is featured in the pages and on the cover of the latest issue of Information Visualization, a leading peer-reviewed journal on the study and application of information visualization. Read More The Game within a Game Superbowl Marketing Retweets Richard Brath June 16, 2016 We’ve been looking at characteristics of break-out tweets and memes. All memes are NOT the same. One interesting approach is to use our Salt library to plot time (horizontally) and number of retweets (vertically). Read More Twitter Talks Trump Visualizing the most popular Trump-related tweets Rob Harper & Sean McIntyre March 3, 2016 Last summer we began tracking tweets that mention Donald Trump in preparation for our talk at Strata NY. We’ve continued monitoring the topic and, as of March 3rd 2016, we’ve processed over 91 million tweets. Read More Trump Climbs Primary Mountain Everyone's tweeting Trump leading up to Super Tuesday Richard Brath March 1, 2016 In our ongoing analysis of tweets about Donald Trump we pulled together 27 million tweets in the month of February from 3.7 million unique users. It seems like everyone is joining the conversation in different ways. Read More «« « 1 2 3 » »»"
