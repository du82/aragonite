["https://unco.edu/accreditation/index.aspx"]
title = "Accreditation | UNC"
description = "learn more about UNC's institutional and program-specific accreditation."
full_description = "Accreditation Accreditation is used in higher education to assure the public of the quality of programs and institutions. Colleges and universities are accredited by institutional or programmatic accrediting agencies recognized by the United States Department of Education. The State of Colorado requires colleges and universities to be accredited, and many of our programs hold specialized accreditation relevant to the field of study. The University of Northern Colorado is accredited by the Higher Learning Commission (HLC) and is recognized as a comprehensive baccalaureate and specialized graduate research university by the State of Colorado (C.R.S. § 23-40-101). Learn about UNC's 2024 HLC Self-Study. Contact UsOffice of AccreditationMichener L057 Phone: 970-351-1102kim.black@unco.edu Benefits of Accreditation Accreditation provides important benefits to students, including: Access to federal grants and loans to pay for college (federal and state financial aid); Eligibility to pursue licensure or certification in certain fields; Eligibility for transferring credits from one accredited institution to another; and Access to federally-supported programs and research opportunities (e.g., TRiO programs such as UNC's Center for Human Enrichment or McNair Scholars Program)"
