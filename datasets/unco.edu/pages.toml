["http://www.unco.edu/visit"]
title = "Visit Campus - University of Northern Colorado - Greeley, CO"
description = "Discover a sense of belonging on the UNC campus and open doors for opportunity and adventure, through a variety of visit experiences to meet your needs."
full_description = "Daily Campus Visits We host twice-daily Admissions Information Sessions which include a an admissions overview and student-led tour of campus. We also offer a growing number of opportunities to personalize your visit and connect individually with academic programs. VIEW DATES AND SIGN-UP Virtual Campus Tours Explore UNC's campus from the comfort of your home – or wherever you might be! Take Virtual Tour School Group Tour Experiences High school and community groups focused on helping students gain access to college are invited to bring up to 60 students for an approximately hour and a half visit experience. Please use the link below to select your preferred visit date. Due to limited availability, we are not accepting middle school visit requests via the portal below. To inquire about a visit, please email groupvisits@unco.edu. Schedule a Group Visit Discover UNC is our annual Sophomore/Junior Visit Day designed for high school students and their families to get an exciting look at what it means to be a UNC Bear. The schedule for the day includes a university welcome, admissions overview, student-led campus tour, college and academic breakout sessions, lunch on campus, an academic and resource fair, and, optional sessions on hot topics including housing and dining, financial aid, scholarships, and more! Monday, February 17, 2025Friday, May 02, 2025 Register Today! Destination UNC: Admitted Student Visit Days! Register now for one of three spring Destination UNC Admitted Student Visit Days! You will need to log into your UNC Student Portal in order to register. For questions about next steps and to access your personalized student portal, visit our Admitted Student Page. We are so excited to welcome you to campus for an admitted student visit soon! Saturday, March 1, 2025Saturday, March 29, 2025Friday, April 18, 2025 Learn more Customize Your Visit! View Dates & Register You can also customize your visit! In addition to the Admissions Presentation and tour, we offer a growing number of opportunities to customize your visit and maximize your time on campus. Below are our current custom daily visit options to choose from: College of Humanities and Social Sciences: First, explore the list of majors within the College of Humanities and Social Sciences. Select this experience and you'll have the opportunity to meet with a professor and/or academic advisor from the major of your choice! College of Natural and Health Sciences: First, explore the list of majors within the College of Natural and Health Sciences. Select this experience and you'll have the opportunity to meet with an academic advisor from the program of your choice and tour the NHS Advising Center. UNC Honors Program: Meet with an Honors Program representative and learn more about our unique UNC First Year Honors Experience, University Honors Program and Honors Capstone. Learn more about Honors here: https://www.unco.edu/honors/. School of Art and Design: Join us if you are interested in our award-winning College of Arts and Design. Whether you're taking an art class, getting a minor, or choosing to major in one of our programs. Guests will tour the Art School, see our studios and art-making facilities and have an opportunity to meet the Director of the School of Art and Design. Performing & Visual Arts for Non-Majors: No matter your program of study, there’s a place for you in our Arts Community. From theatre productions to intro studio classes, choirs to jazz combos, marching band to campus string orchestra there’s something for everyone. Guests will learn about our award-winning programs and tour Frasier Hall (see our fully professional recording studio!). Those interested in Art classes are welcome and will learn about studio classes. Performing & Visual Arts Audition Process: If you plan to audition for our School of Music, or, Theatre Arts and Dance, this session will help you gain confidence and know how to prepare! Guests will learn about the audition process, including upcoming in-person audition days and virtual audition options. Following a presentation, guests will tour Frasier Hall. College of Education and Behavioral Sciences: Visit this page to see the exciting majors that fall within UNC's College of Education and Behavioral Sciences. Guests will have the opportunity to meet with faculty, learn about our programs and get a feel for what makes our community special. Monfort College of Business: Come meet with an advisor and discover our diverse business undergraduate degree offerings! You'll also learn about our student support services available to help you succeed and the professional experience opportunities that set our students on the path to career success. Located in Greeley, a city of more than 105,000 residents and just an hour’s drive north of Denver, UNC is close to shopping, dining, theaters, music venues, outdoor trails, parks, a vibrant downtown and so much more! Discover what it means to become part of Bear Country — a connected, inclusive and growing community. There's something special about this place, but don't just take our word for it... Discover Greeley"
year_published = 2025
clearnet = "http://www.unco.edu/visit"
