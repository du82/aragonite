["https://unco.edu/admissions/how-to-apply/transfer.aspx"]
title = "Transfer Student Center - University of Northern Colorado"
description = "Here you will find all the transfer student resources you will need to apply to the University of Northern Colorado."
full_description = "Transfer Student Continue Your Journey at UNC At the University of Northern Colorado opportunities for your future will unfold! An education at UNC is research-driven and hands-on. Our faculty and staff support your success by promoting opportunities for experiential learning that range from making a difference in the community to studying abroad, and from fieldwork to the laboratory. FIND YOUR COUNSELOR How to Apply 1 Submit Application Submit the Bear App. 2 Pay Application Fee Submit the $50 application fee. Students who qualify for a need-based fee waiver or provide a valid fee waiver code will have their fee waived upon submission. 3 Submit Transcripts Send official transcripts from all institutions you've attended. Submission Information Submit official transcripts via the platform you prefer: Electronically through Parchment or your previous institution's electronic platform or email transcripts to admissions@unco.edu. Mail to: Office of Admissions1051 22nd St. Campus Box 10Greeley, CO 80639 Admission Criteria You're a strong candidate for admission with 24 or more transferable credits and a cumulative GPA of 2.4 from all institutions attended. If you have at least a 2.0 and are in good academic standing at college or universities you've attended, you're encouraged to apply. If you have more than 24 college credits, submit a proof of high school graduation. Otherwise submit a final official high school transcript. More information about our admission criteria can be found here. Application Deadlines Applications are accepted on a rolling basis. March 1st Fall Semester March 1st Hard deadline: August 1 November 1st Spring Semester November 1st Hard deadline: December 1 March 1st Summer Semester March 1st Hard deadline: May 1 The sooner you complete your application, the sooner you will hear about your admission decision. Transferring Credits The Office of the Registrar determines transferable credits and evaluates coursework based upon courses that have previously been transferred. Courses that don't have established equivalencies will be evaluated by Registrar staff and/or academic departments. Transferring Credits Want to see how your courses transfer? Transferology shows you how your credits will transfer to UNC. Just enter your information in the tool to find out what the transfer equivalencies are at UNC. Learn more about Transferology Colorado Community College Transfer Guides See which courses you should take at a Colorado Community College to efficiently transfer to UNC and obtain a bachelor’s degree as a Bear. Institutional Partnerships & Transfer Guides Admitted Transfer Students Congratulations! We can’t wait to welcome you to the Bear family. Now that you’ve been admitted, here are resources and steps to help you enroll at UNC. VISIT THE ADMITTED STUDENT PAGE Becoming a Bear Complete these steps to become a UNC Bear: Activate Ursa and Bearmail Accounts Ursa is your online portal where you pay your bill, register for classes and more, and Bearmail is your university email. Go to ursa.unco.edu and select account activation to get started. Make your enrollment confirmation deposit UNC requires a $200 enrollment deposit to hold your spot at UNC. Then that amount will be credited toward your fall semester tuition and fees. Confirm your spot File your FAFSA If you haven’t filed your Free Application for Federal Student Aid (FASFA) be sure to apply right away (even if you don’t think you’ll qualify, it’s important to apply). UNC’s Federal School Code: 001349. Other Funding OptionsLearn more about the Office Financial Aid and additional opportunities to fund your education including scholarships. Submit your Housing and Dining contract If you plan to live on-campus, submit your housing contract (make sure you've paid your enrollment deposit first). Consider our on-campus apartments, residence halls and residential learning communities, including one for transfer students. Check out our Residential Learning Communities to find out about housing options that connect you with students who have similar interests or goals. Sign up for a meal plan or purchase dining dollars through the housing and dining contract. Learn more about Dining Plans. Start Housing and Dining Contract Submit Immunizations Records Learn more about UNC’s Immunization requirements and be sure to submit your records so you can register for courses. Submit Final Transcript If you were still taking courses when you applied to UNC, you’ll need to contact your school to submit a final transcript to UNC.transcripts@unco. or to the Admissions office via mail. Once You're a Bear We’re so glad you’ve chosen UNC. We work hard to help our students succeed now – and long after graduation. Find your Advisor After you’ve attended orientation, our faculty and staff can help you choose and register for classes. Find your advisor: Education and Behavioral Sciences Humanities and Social Sciences Monfort College of Business Natural and Health Sciences College of Performing and Visual Arts SOAR (for those exploring a major) Student Support & Services Whether you need academic support, tutoring, wellness services or access to the Disability Resource Center, you’ll find faculty and staff who are ready to offer resources, support and strategies for success. All student support and services Additional Resources Colorado Reverse Transfer Liberal Arts Curriculum Library Did you know every major has a personal librarian? Find the librarian for your major here. International Student and Scholar Services Study Abroad Center for Career Readiness"
year_published = 2025
clearnet = "https://unco.edu/admissions/how-to-apply/transfer.aspx"
