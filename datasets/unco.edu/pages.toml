["https://unco.edu/admissions/costs-aid/index.aspx"]
title = "Costs and Aid at the University of Northern Colorado"
description = "Costs and Aid at the University of Northern Colorado"
full_description = "Tuition Costs and Aid Opportunities At UNC, you can earn a quality education that is rich in experiences and is an exceptional return on your investment. UNC offers the best tuition and fees rates among all other Colorado research universities. Research universities open up amazing opportunities for you to work alongside faculty to explore, inquire and discover, which are essential to be competitive in the workforce and pursue top careers.Our students graduate with low loan debt. In fact, UNC ranked #1 in average student loan debt at graduation among all 4-year, public doctoral universities in Colorado in 2020. Tuition and Fees for 2023-24 Academic Year (2 semesters) Your cost of attendance will vary based on your residency and qualification for financial aid programs. We are committed to working with you to figure out how to finance and achieve your educational goals. View Cost of Attendance on the financial aid website. Wondering what an education at the University of Northern Colorado will cost? By answering a few easy questions, the Financial Aid Net Price Calculator will give you an estimate of costs and let you know if you might qualify for scholarships, grants and loans. Net Price Calculator Scholarships - Fall 2025, Spring 2026 Apply for UNC scholarships to help reduce your tuition costs. To be eligible for automatic admissions scholarships students must be studying on the Greeley Campus or Denver-Lowry Campus, be a degree-seeking first-year or transfer student, and meet the GPA requirements. 95% of first-time students receive grants, scholarships or other aid! First-Year Scholarships(Weighted GPA) Colorado Resident WUE Resident Non-Resident & international Trustee(4.00 GPA) $4,500/yr $6,000/yr $8,000/yr Presidential(3.80 - 3.99 GPA) $3,500/yr $5,000/yr $7,000/yr Provost(3.40 - 3.79 GPA) $2,000/yr $3,500/yr $5,500/yr Bear(3.00 - 3.39 GPA) $1,000/yr $2,500/yr $4,500/yr Transfer Scholarships(Cumulative GPA) All Institutions Colorado Resident WUE Resident Non-Resident & international Transfer Trustee(3.50 - 4.00 GPA) $3,000/yr $3,500/yr $7,000/yr Transfer Presidential(3.00 - 3.49 GPA) $2,000/yr $2,500/yr $5,000/yr Northern Lights Transfer (2.75 - 2.99 GPA) $1,000/yr $1,500/yr $3,000/yr /*! // CSS only Responsive Tables // http://dbushell.com/2016/03/04/css-only-responsive-tables/ // by David Bushell */ .stable { /*! // IE needs inline-block to position scrolling shadows otherwise use: // display: block; // max-width: min-content; */ display: inline-block; vertical-align: top; max-width: 100%; overflow-x: auto; white-space: nowrap; border-collapse: collapse; border-spacing: 0; } .stable, .stable--flip tbody { -webkit-overflow-scrolling: touch; } .stable td:first-child, .stable--flip tbody tr:first-child { } .stable td:last-child, .stable--flip tbody tr:last-child { } .stable th { text-transform: uppercase; vertical-align:bottom; } .stable th, .stable td { padding: 6px 12px; border-width: 5px 15px; border-color: #fff; border-style: solid; text-align:center; width: 175px; } .stable td { vertical-align: middle; } .stable p { margin: 0; } .stable h1,h2,h3,h4,h5 { margin: 0; } .stable--flip { display: flex; overflow: hidden; } .stable--flip thead { display: flex; flex-shrink: 0; min-width: -webkit-min-content; min-width: -moz-min-content; min-width: min-content; } .stable--flip tbody { display: flex; position: relative; overflow-x: auto; overflow-y: hidden; } .stable--flip tr { display: flex; flex-direction: column; min-width: -webkit-min-content; min-width: -moz-min-content; min-width: min-content; flex-shrink: 0; } .stable--flip td, .stable--flip th { display: block; } .stable--flip td { } .stable--flip th:not(:last-child), .stable--flip td:not(:last-child) { } Apply for Scholarships Explore Transfer Scholarships Financial Aid The Office of Financial Aid at UNC ensures every student finds the help they need to reach their goals and be financially responsible in college. Visit the links below for more information on how to apply for federal or state financial aid. Free Application for Federal Student Aid (FAFSA) The first step to Financial Aid is to complete the Free Application for Federal Student Aid (FAFSA). UNC's FAFSA code is 001349. Apply as early as October 1, and submit by March 1, to be considered for the maximum amount of financial Aid. Fill out your FAFSA FAFSA Tips (PDF) Colorado Application for State Financial Aid (CASFA) The Colorado Application for State Financial Aid (CASFA) is for students who considered DREAMers (Undocumented or DACA recipients). Students who are eligible for Federal Title IV aid by completing the FAFSA should not complete the CASFA. LEARN MORE About CASFA Let's stay in touch. Sign up to receive emails and other communications to guide you through your college application process. // <![CDATA[ $(function() { /*$('#we-like-you-email').data('holder', $('#we-like-you-email').attr('placeholder')); $('#we-like-you-email').focusin(function() { $(this).attr('placeholder', ''); }); $('#we-like-you-email').focusout(function() { $(this).attr('placeholder', $(this).data('holder')); });*/ }); // ]]>"
