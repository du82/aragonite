title = "Colorado First-Year Admission Guarantee"
description = "Beginning fall 2023 entry team students who meet criteria will be eligible for UNC's Colorado First-Year Guarantee."
full_description = "Colorado First-Year Admission Guarantee At UNC we are deeply committed to a students-first approach. With more than 40% of our students identifying as first in their families to attend college, we understand how stressful the college search process can be. Our First-Year Admissions Guarantee for Colorado residents removes the guesswork from knowing whether UNC is a college option for you. All students who meet the criteria outlined below will qualify for automatic admission into the University of Northern Colorado.* Questions? Refer to our FAQ list below or contact us. Submit My Bear App SuBMIT My Common App First-Year Guarantee Requirements: Current Colorado high school student** 3.0 Cumulative High School GPA (Weighted) 4 years of English 4 years of Math (or 3 years of math with at least a B in Algebra 2) 3 years of Physical / Lab Sciences 3 years of Social Sciences Meet all other high school graduation requirements. Submit application for admission by March 1 of your graduation year * Admission to UNC requires submission of documents including school transcripts and a complete admission application (either a Bear Application or a Common Application). At times, our Office of Admissions may request additional required documentation before making an official decision. ** Graduates of a Colorado high school who, since graduating, have not enrolled at another college or university are eligible. Frequently Asked Questions If I don't meet the criteria, can I still be admitted to UNC? Absolutely! Students who do not meet the criteria still receive full consideration for admission through a holistic review of factors including applicants' academic course selection and rigor, overall GPA and trends as well as their involvement and leadership experiences, academic reflection, personal statement/essay and letters of recommendation, as provided. Are these the recommended high school courses for all students? No. These are our recommended minimum requirements. To best prepare for college, we advise all students to continue seeking academic challenges in your major areas of interest. Please note: Meeting the Colorado First-Year Guarantee requirements does not guarantee admission to any performing arts (music, theatre, musical theatre) programs which require an audition/interview for full admission. An Example: A student interested in studying health and physical sciences would be best-served to continue taking advanced mathematics and physical/natural sciences courses for all four years of high school, regardless of previous grades. What if I'm not from Colorado? While there is no guarantee, if you meet the requirements outlined in the first-year guarantee you can expect to be a competitive candidate for admission regardless of your home state or country. If you have specific questions, contact your admissions counselor or simply email us at admissions@unco.edu. Is it really so simple? Yep! UNC's Colorado First-Year Admissions Guarantee is straightforward on purpose. If you meet the requirements and submit all of the required documents on time, you will be assured of general admission to the university. What about foreign language requirements? For a number of reasons we not have a foreign language requirement. We know students may have unique circumstances that warrant an exception, such as already being bilingual/multilingual or students with learning disabilities or processing disorders. In addition, we recognize school environment circumstances are beyond students' control such as schools not offering foreign language courses due to nationwide teacher shortages or other reasons. I graduated from high school before 2023 and haven't attended college, am I eligible? Yep! All students who graduated from a Colorado high school and have not enrolled in college since then are eligible. Will I also qualify for scholarships? Absolutely! Students who have a cumulative GPA of a 3.0 or higher also qualify for automatic admissions scholarships. SUBMIT MY BEAR APP SUBMIT COMMON APP"
year_published = 2025
clearnet = "https://unco.edu/apply/co-first-year-guarantee.aspx"
