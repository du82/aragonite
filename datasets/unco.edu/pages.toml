["http://www.unco.edu/admissions"]
title = "Office of Admissions - University of Northern Colorado"
description = """
Current high school students or HS graduates (including GED/HiSet) who have not yet                                   enrolled in college coursework."""
full_description = "Bright Futures Start Here. At UNC, you get an outstanding return on your investment: A top-quality education learning from award-winning faculty with a passion for teaching and and the career-ready experiences that come from attending a four-year, research university. You will experience hands-on learning to advance your professional goals in a culturally rich academic environment. With a strong and welcoming community, UNC is deeply committed to your academic success, diversity and achievement. You will gain the knowledge and skills through our personalized education experience. Here, every student matters. Request Info CALL US: 970.351.2881 Create your Custom Viewbook Get Started How to Apply Pick your option below to be on your way to becoming a UNC Bear! First-Year Student Current high school students or HS graduates (including GED/HiSet) who have not yet enrolled in college coursework. Transfer Student High school graduates who have enrolled in college coursework after graduating from high school. NontraditionalStudent Review first-year and transfer definitions to determine which application is right for you. Dual/Concurrent Enrollment Interested in enrolling in courses at UNC while you're enrolled in high school? Military Student Find out how to apply and receive military benefits as you pursue your next goals. Other Calling all Bears, lifelong learners or students looking to enroll part-time as non-degree seeking students or online. Research Opportunities With real-world experiences and research opportunities from Day One, you'll be at the top of your field when you graduate. Learn More Perfectly Sized We're a family of about 9,000 warm and welcoming Bears. Here, you'll see your friends regularly, but won't get lost in the pack. GET TO KNOW US #1 in Upward Mobility Receive a world-class education at the #1 university for social mobility in Colorado, according to the 2021 Social Mobility Index. A UNC degree can transform lives. See HOW Connect With Us Reach out to one of our admission counselors with any questions about applying and being accepted to UNC or take a tour of our beautiful campus with on of our UNC ambassadors. Request Information Learn more about UNC by telling us about yourself. Visit Campus Connect with our campus through virtual or on-campus visit experiences. Apply to UNC Ready to apply? Get started on your application today. Find your Counselor Connect with one of our friendly (and knowledgeable) Admission Counselors. Academic Programs Learning occurs through critical inquiry, discovery and creation. At UNC, you'll gain the best of all worlds with a small, teaching-focused institution combined with the progressive knowledge of a research-based university. In addition to our Greeley campus, our Extended Campus facilitates diverse learning experiences online or at one of our off-campus centers located in Loveland and Denver. Looking to further your education, explore more than 100 graduate programs in our Graduate School. EXPLORE ACADEMIC PROGRAMS Student Life You will find so many activities, programs and experiences that makes life at UNC extraordinary. With sporting events, music and theater performances on campus and outdoor activities — not to mention all that Greeley and Colorado have to offer — you will find plenty of opportunities to help you roam and grow. Shape your Experience Financial Aid The Office of Financial Aid helps you understand the many options for funding and paying for your education and helps you learn to be financially responsible while in college. Apply For Financial Aid Scholarships Did you know 86% of incoming first-year students are awarded grants or scholarships. Learn about scholarships available to you when you become a UNC Bear. Find First-Year Scholarships Find Transfer student scholarships"
