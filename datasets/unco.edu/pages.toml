arships, or other financial aid. 44% of UNC students are the first in their family to attend college UNC was named a “Best of the Best" LGBTQ-friendly campus based on the Campus Pride index UNC offers more than 300 study abroad opportunities in over 60 countries UNC's specialized centers, institutes, and clinics offer both hands-on research and community support UNC will welcome the first class of students to the proposed College of Osteopathic Medicine in 2026 UNC faculty include 18 Fulbright Scholars, leading the way in teaching and research UNC is home to several initiatives that promote start-up businesses and innovation, directly investing back into our community'''
