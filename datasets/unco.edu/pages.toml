["https://unco.edu/accessibility-statement/index.aspx"]
title = "Accessibility Statement"
description = "The University of Northern Colorado (UNC) is committed to providing equitable access to UNC services to all students, faculty, staff, and visitors. UNC’s ongoing accessibility efforts work toward complying with the Web Content Accessibility Guidelines (WCAG) version 2.1, level AA criteria. These guidelines not only help make technology accessible to users with sensory, cognitive and mobility disabilities, but ultimately to all users, regardless of ability."
full_description = "Accessibility Statement The University of Northern Colorado (UNC) is committed to providing equitable access to UNC services to all students, faculty, staff, and visitors. UNC’s ongoing accessibility efforts work toward complying with the Web Content Accessibility Guidelines (WCAG) version 2.1, level AA criteria. These guidelines not only help make technology accessible to users with sensory, cognitive and mobility disabilities, but ultimately to all users, regardless of ability. UNC’s efforts are part of a meaningful change in making all State of Colorado services inclusive and accessible. UNC welcomes comments on how to improve our technology’s accessibility for users with disabilities and requests for accommodation for any UNC services. UNC strives to make our campus an inclusive and accessible environment for all users as more fully described below: UNC Accessibility Features UNC implemented the following features to its native website to remove accessibility barriers and ensure compliance with the Technology Accessibility Rules: Alternative Text (Alt Text): Images on our website are accompanied by descriptive alt text to assist users who rely on screen readers. Images used solely for decoration have a blank alt tag so that they are overlooked by screen readers. Keyboard Navigation: UNC’s website can be navigated using only a keyboard, ensuring compatibility with assistive technologies. Semantic Markup: UNC uses semantic HTML markup to enhance the browsing experience for users of assistive technologies. To address accessibility of online learning platforms, UNC has tested and purchased a Universal Design Online content Inspection Tool (UDOIT) that will scan all course content (by course), generate a list of accessibility issues and provide guidance on how to correct them. To enhance accessibility and ensure quality assurance, UNC has adopted Acquia Optimize. This platform automatically scans our website to identify potential issues that could impact accessibility. Continuing Efforts to Remove Accessibility Barriers In accordance with UNC’s Accessibility Plan, UNC is making good faith efforts to remove accessibility barriers in the following areas: Remediating electronic documents, including PDFs, Word documents, and presentations, ensuring they are created and maintained in accessible formats for users with disabilities. Redesigning native university website to ensure compliance with accessibility standards, including WCAG 2.1 AA. Ensuring accessibility of online learning platforms, such as UNC’s course management system, to ensure students and faculty can access and engage with course materials and content. Offering training and resources to faculty, staff, and students on creating and maintaining accessible digital content. Making digital communication, such as emails, newsletters, announcements, and social media accessible to people with disabilities using plain language and accessible formats. Evaluating existing software vendors for compliance with WCAG 2.1 AA and requiring compliance as an eligibility criterion for future vendors. Providing captions, transcripts, and audio descriptions for all video and audio content. UNC will optimize color contrast to improve readability for users with visual impairments. Since July 1, 2024, UNC convened a cross-functional working group to coordinate compliance with HB21-1110. On Sept 3, 2024, UNC hosted a training seminar for faculty and staff regarding the requirements of HB21-1110. In November 2024, UNC's cross functional working group split into three smaller groups to focus on public facing website, internal online program and LMS course content. Requests for Accommodations and Feedback UNC is committed to providing equal access to individuals with disabilities, including reasonable accommodations for individuals accessing or attempting to access a program or activity of the university. UNC welcomes requests for accommodation and feedback about the accessibility of UNC’s services. Please let us know if you encounter accessibility barriers. UNC is committed to responding within one (1) business day. To request an accommodation or provide feedback, please contact the applicable UNC office below: Students Disability Resource Center Phone: 970-351-2289 E-mail: DRC@unco.edu Faculty Teaching with Canvas Instructional Design and Development Phone: 970-351-4357 E-mail: help@unco.edu University Employees Human Resources Phone: 970-351-2718 E-mail: human.resources@unco.edu The Public and University Community Office of Institutional Equity & Compliance Phone: 970-351-4899 E-mail: titleix@unco.edu Submit a Concern UNC’s Technology Accessibility Statement is updated quarterly to demonstrate UNC’s good faith progress toward meeting its goal to remove accessibility barriers. UNC welcomes feedback regarding the accessibility barriers. If you encounter any accessibility barriers or have suggestions for improvement, please contact: Office of Insitutional Equity & CompliancePhone: 970-351-4899E-mail: titleix@unco.edu Date of Last Revision: [December, 2, 2024]"
year_published = 2025
clearnet = "https://unco.edu/accessibility-statement/index.aspx"
