["http://www.unco.edu/about"]
title = "About the University of Northern Colorado"
description = "From campus life, to people that make our university stand out, get to know more about UNC."
full_description = '''Get to Know the University of Northern Colorado Student-focused. Service-oriented. Approachable. Driven. Nestled between the Rocky Mountains and Colorado’s stunning high plains, the University of Northern Colorado (UNC) is a public, doctoral research and educational institution that is home to about 9,000 students and more than 200 undergraduate and graduate programs, many of which are nationally recognized. Founded as a teacher’s college in 1889, we graduated generations of educators, more than any other Colorado university. Our culture is marked by academic excellence in education, health sciences, business, the humanities and performing and visual arts. UNC is committed to supporting our students and providing them with a high-quality education, hands-on experiences and a community where they can thrive. We are a welcoming, inclusive campus and proud to be Colorado’s newest Hispanic Serving Institution. UNC is more than a place to earn a degree. It’s a place where students build meaningful connections that last a lifetime. Our community says everything about who we are. Recognized as a top university for social mobility, UNC is proud to be a Hispanic Serving Institution and to serve more than 42% of our undergraduates who are the first in their family to attend college. The university’s just-right size, expert faculty, and tradition of research and hands-on learning gives students exceptional opportunities and a personalized education. Once a bear, always a bear. UNC graduates join a strong network of over 140,000 alumni living and working in 50 states and 90 countries who help build communities that save and transform lives. Accreditation UNC has been accredited by the Higher Learning Commission (HLC) since 1916. The HLC is an institutional accrediting body recognized by the United States Department of Education and is one of seven regional accrediting bodies in the country. Land Acknowledgement We acknowledge that the grounds upon which our university stands are inextricably tied to the history and culture of indigenous peoples. We pay our respect to Elders past, present and future, and to those who have stewarded this land throughout the generations. The University of Northern Colorado occupies the lands in the territories of the Ute, Cheyenne, Arapaho, and Lakota peoples. Further, we acknowledge the 48 tribes that are historically tied to the state of Colorado. We challenge ourselves to be better stewards of the land we inhabit, as well as learn the stories and practices of Indigenous people’s history and culture. 14:1 Student-to-Faculty Ratio with 686 total faculty (441 of which are full-time) Student Enrollment* *As reported in Fall 2023 Census Undergraduate Snapshot 91% Full-time students Average full-time course load: 14 credit hours 42% of incoming first-year students are first generation 5,182 In-state students Graduate Snapshot 68% Masters Students 21% Doctoral Students 5% Specialist Students 3% Licensure/Certificate Students 3% Unclassified Students Masters - 68% Doctoral - 21% Specialist - 5% Licensure/Certificate - 3% Unclassified - 3% .grad-snapshot .chart { overflow: hidden; width: 100%; } .grad-snapshot .chart .block { display: block; height: 3rem; float: left; background-color: #013c65; position: relative; overflow: hidden; } @media only screen and (min-width: 40.063em) { .grad-snapshot .chart .block { height: 5rem; } } .grad-snapshot .chart .block:nth-of-type(4) .value { color: #013c65; } .grad-snapshot .chart .block:nth-of-type(5) .value { color: #013c65; } .grad-snapshot .chart .block p { margin-bottom: 0; display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); } .grad-snapshot .chart .block .value { color: #fff; font-weight: 700; } .grad-snapshot .block:nth-of-type(2), .grad-snapshot .legend li:nth-of-type(2):before { background-color: #33577a; } .grad-snapshot .block:nth-of-type(3), .grad-snapshot .legend li:nth-of-type(3):before { background-color: #66819b; } .grad-snapshot .block:nth-of-type(4), .grad-snapshot .legend li:nth-of-type(4):before { background-color: #99abbd; } .grad-snapshot .block:nth-of-type(5), .grad-snapshot .legend li:nth-of-type(5):before { background-color: #ccd5de; } .grad-snapshot .legend { margin: 0; padding: 0.5rem 0 0 0; } .grad-snapshot .legend li { list-style: none; line-height: 1em; padding-bottom: 0.5rem; } @media only screen and (min-width: 40.063em) { .grad-snapshot .legend li { display: inline-block; padding-bottom: 0; } .grad-snapshot .legend li:not(:first-child) { padding-left: 1.5rem; } } .grad-snapshot .legend li:before { content: ""; margin-right: 0.5rem; display: inline-block; width: 0.75rem; height: 0.75rem; background-color: #013c65; } .grad-snapshot .legend li span.show-for-small-only { display: inline !important; } @media only screen and (min-width: 40.063em) { .grad-snapshot .legend li span.show-for-small-only { display: none !important; } } $('.grad-snapshot .chart .block .value').each(function() { var text = $(this).text(); $(this).parents().eq(1).css('width', text); }); Graduate and Undergraduate Ethnicity 60% White 26% Latinx/Hispanic <1% Not Reported/Unknown 5% Multi-racial 4% African American 2% Asian <1% Native American <1% Hawaiian Stories from Bear Country Leadership for a Changing World This year marks 20 years for UNC’s Stryker Institute for Leadership Development, and it continues to give students leadership skills that help them make a difference in the lives of others.Read More New Deans Join UNC Three new academic deans joined UNC this summer and share a vision for and commitment to student success. Read More Alumni Spotlight - Holding High Expectations UNC Trustee Shashwata Prateek Dutta BS 08, EdLD, believes in the importance of education as a driver of social mobility — something he’s experienced in his own journey to success. Read More'''
