["https://unco.edu"]
title = "Home - University of Northern Colorado"
description = "The University of Northern Colorado is a public doctoral research university committed to the success of its students, offering more than 200 undergraduate, graduate, extended campus and online programs, designed to help you pursue your goals and find your path."
full_description = "North of the Norm. At UNC, you can see the world through your own lens, learn at your own pace and move to the beat of your own drum. It's about finding success in the quality of the journey, not just in the destination. As a public, doctoral research university, we offer more than 200 undergraduate and graduate programs online and on-campus to help you pursue your goals and dreams. Explore our programs of study Your Browser does not support this HTML5 video. Affordable, Accessible Education We are committed to your academic success while keeping costs accessible and affordable. In addition to offering lower-than-average tuition across universities in Colorado, we offer several aid programs to help students achieve their academic goals and graduate with as little debt as possible. Tuition and Costs #1 UNC has the lowest debt at graduation among similar four year universities in Colorado. 96% Percentage of students who receive some type of financial aid or scholarships. 700+ Over 700 scholarships are available to students every academic year. Colorado First Year Admission Guarantee With more than 40% of our students identifying as first in their families to attend college, we understand how stressful the college search process can be. Our First-Year Admission Guarantee for Colorado residents removes the guesswork from knowing whether UNC is the best choice and fit for you. Fast Track Your Acceptance Attend an Event See Events Take A Tour Schedule Tour Apply Now Get Started UNC's proposed College of Osteopathic Medicine Lawmakers recently approved HB24-1231, a bill that will fund UNC's proposed College of Osteopathic Medicine. The strategic initiative to help address Colorado's critical shortage of physicians will enroll 150 medical students annually, with an inaugural class anticipated to start as early as fall 2026. LEARN MORE ABOUT THE NEW COLLEGE Colorado's Newest Hispanic-Serving Institution UNC is now an official Hispanic Serving Institution (HSI) after working towards this historic milestone for several years. This federal designation will be instrumental in paving the way for improving student success, ensuring equitable outcomes and eliminating disparities. Discover how HSI status will impact UNC Fulbright Award Semifinalists Two graduating seniors, Pennie Nichol and Jenna Mischke, were named semifinalists for the 2024-25 Fulbright U.S. Student Program, one of the most prestigious international academic exchange programs in the world. Congratulations! LEARN About this global recognition Previous Slide Next Slide 90 %Classes Taught by Faculty 90% of all undergraduate classes are taught exclusively by faculty 91 %Students are Employed or in graduate school, or in a volunteer or service role within six months of graduation # 1In Social Mobility in Colorado by CollegeNet's Social Mobility Index, 2021 Proud to call Greeley home! Located between the mighty Rocky Mountains and and wide-open grasslands, we’re proud to call Greeley our home. Welcoming, authentic and just the right size, we love it, and we know you’ll love it too. Find your passion here and determine what your story will be. VISIT USEXPLORE GREELEY Take advantage of Free Application Days! To inspire more future students to earn a college degree, University of Northern Colorado is excited to host Free App Days on October 1, December 1, February 1, and April 1 each year.Learn More About Free App Days UNC's Tuition Promise To better support students and keep a college degree well within reach, the university offers the Tuition Promise Program that covers tuition and fees for eligible undergraduate Colorado students. Learn how the Tuition Promise works True North News Turning a New LEAF with Composting Forging Art and Community: The Maxine and Don Schwartz Foundry The Phelps Family Legacy is All About Paying It Forward Building Champions Garners Global Support and Empowers Student-Athletes Read more UNC News Events Game Night March 04 | 5:30 p.m. - 7:30 p.m. Take a break from school with a game night! We will offer PS5 and Nintendo Switch Games. There will be free prizes, food, and fun while supplies last :) See Details Staff Appreciation Celebration March 06 | 11:30 a.m. - 1 p.m. See Details UNC Jazz Lab Bands II & III March 10 | 7:30 p.m. - 9 p.m. See Details Honored Alumni Induction Ceremony March 29 | 6 p.m. - 8:30 p.m. See Details 73rd Annual Colorado All-State Band April 03 - April 05 | 12 a.m. See DetailsView Full Calendar"
