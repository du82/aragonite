["https://unco.edu/bears-go-big"]
title = "Bears Go Big"
description = "Bear Alumni do BIG things in the world, from leading change and companies to impacting their local community...see what these bears are up to!"
full_description = '''Bears Go Big Celebrating Alumni Careers After College Graduates of the University of Northern Colorado go on to do BIG things – from Broadway to boardrooms, from classrooms to community clinics, you are bound to find a UNC Bear doing big things in a city, career, or community near you. Explore the many careers that UNC alumni are pursuing after college, then connect with the UNC Alumni Association to put that Bear Network to work in building your career. Alumni Association Career Readiness Update Your Information "My experience throughout my four years at UNC solidified my desire to work in policy for my career and I reflect fondly on my time and experience with passionate professors and fellow students who ignited that passion in me and taught me many skills I use daily in my career." Molly Burich '05Otsuka Pharmaceutical Companies (U.S.) Senior Director - Head of Public Policy Alumni Employment Dashboard Explore the data behind successful alumni careers. "Graduates of the University of Northern Colorado go on to do BIG things - leading companies, leading social change, and even leading major league baseball clubs. With more than 140,000 living alumni making up the global Bear Network, we want to continue to be intentional in our efforts that tie curriculum to career paths that will help our students become the future leaders, change-makers, and innovators we need in the world." Lyndsey Crum '05Former Assistant Vice President for Alumni Relations Such Great Heights: UNC Alumni Working in Aviation The sky’s the limit when it comes to where a UNC education can take you, just ask Heath Montgomery, ’05, and Leah Schultz, ’17. Learn how their decision to attend UNC, and the education and experiences they gained on campus, helped their careers in aviation take off. Meet Heath and Leah @media only screen and (min-width:64.063em){ .why-unc .why-intro{ padding-top:0.5rem } } .why-unc .why-reasons{ padding-top:0.5rem } @media only screen and (min-width: