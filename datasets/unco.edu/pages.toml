["https://unco.edu/admissions/free-app-day/index.aspx"]
title = "Free Application Days! October 1, December 1, February 1, April 1"
description = "Colorado students, you can apply to the University of Northern Colorado for free! We’re excited to be part of a statewide initiative encouraging Colorado residents to submit a free application on any of the following dates: October 1, December 1, February 1, April 1"
full_description = "Apply to UNC for Free! To inspire more students to earn their first college degree, the University of Northern Colorado hosts Free Application Days each year on October 1, December 1, February 1, and April 1. UNC Free App Days are exclusive to undergraduate students. Free App Days offer a fantastic opportunity to apply to college and save money. To get started, create your Bear Application or Common Application and enter the fee waiver code UNCFREEAPPDAY. Complete and submit before 11:59 MST and your $50 fee will automatically be waived. It's that simple! Reach Your Full Potential UNC is committed to putting students first. Our hope is that efforts like these serve to remove barriers and also motivate students to take the next step in earning a college degree so they can pursue a quality and affordable education, develop value skills and join the 91% of UNC graduates who secure employment within 6 months of graduation. Do I qualify? All first-year freshmen applicants and transfer and second-bachelors applicants qualify for Free Application Day! How do I apply? Enter the fee waiver code UNCFREEAPPDAY in the fee waiver section of your Bear Application or Common Application and submit your application on October 1, December 1, February 1, or April 1 to be eligible for the fee waiver. Start your online application, save your work and submit it anytime that day before 11:59 p.m. MST. Become a Bear! Enter the UNC app fee waiver code: UNCFREEAPPDAY START A NEW BEAR APPLOGIN Use Common App only if you are a current high school student or high school graduate who has not attended a college or university since graduating. In our UNC member questions section, enter UNCFREEAPPDAY as your app fee waiver code COMMON APP Next Steps After You Apply After you submit your application, you'll receive access to your student admissions portal where you'll find your personalized checklists to complete your application. Your student portal is also where to find your admission counselor's contact information, and once available - your official admissions decision. We anticipate the Free Application for Federal Student Aid (FAFSA) will open for all students sometime in December or January. Submitting the FAFSA early gives you the best access to grants, scholarships and work-study positions to help pay for college so it's important to file as soon as possible. It's also a requirement for those eligible to receive the UNC Tuition Promise. If you don't qualify for federal financial aid, you may qualify for state aid through the Colorado Application for State Financial Aid (CASFA)."
year_published = 2025
clearnet = "https://unco.edu/admissions/free-app-day/index.aspx"
