d 4 ELECTIVE 3 Higher 4 PSY 120, ELECTIVE 6 5c Theatre Standard 4 THEA 130 3 3a Higher 4 THEA 100, 130 5 3a HAVE QUESTIONS? Reach out to our admission counselors and they can walk you through the whole process, from start to finish! GED Applicants Did you take the GED? Check out our GED Application Checklist. Let's stay in touch. Sign up to receive emails and other communications to guide you through your college application process. // <![CDATA[ $(function() { /*$('#we-like-you-email').data('holder', $('#we-like-you-email').attr('placeholder')); $('#we-like-you-email').focusin(function() { $(this).attr('placeholder', ''); }); $('#we-like-you-email').focusout(function() { $(this).attr('placeholder', $(this).data('holder')); });*/ }); // ]]>"
