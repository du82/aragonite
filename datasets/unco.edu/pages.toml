["https://unco.edu/academics/index.aspx"]
title = "Academics at University of Northern Colorado"
description = "It’s a student experience and an education unmatched in Colorado. Find out why UNC is a great fit for you."
full_description = '''Academics What sets UNC apart from other universities? Our faculty connect innovative teaching with relevant research for an education that not only prepares you for your future career, but sets you apart from the crowd. Undergraduate ProgramsGraduate Program Our Unique Learning Environment You gain the best of a small, teaching-focused institution combined with the progressive knowledge of a research-based university. At UNC, our professors don’t have to choose between teaching and research because they have the opportunity to work closely with students while sharing their research in the classroom. And that makes for a passionately different approach to education for our students. Benefit From Innovative Teaching Founded in 1889 as Colorado’s teachers college, UNC is a comprehensive baccalaureate and public doctoral research university that fuses its history for innovative teaching with transformative, hands-on education through programs across six colleges. Teaching is in our DNA, and when you are a student at UNC, you learn from experts in your field who are innovative educators. Cultivate Your Unique Potential Because of UNC’s just-right size and unique approach to education, you are encouraged to explore your interests and customize your options for a learning experience that lets your potential shine. You might lose yourself in your studies and immerse yourself in your field, but you won’t get lost in the crowd. Learn In and Outside the Classroom UNC is recognized as a leader in community and civic engagement opportunities. That means that you can broaden your horizons through internships, volunteer work, study abroad, research projects and field work. You’ll cultivate the type of experience-deep education employers are seeking. Succeed with Individualized Support Our alumni tell us their professors and the support and encouragement they received as a student played a significant role in their success and increased their credibility in their profession. Your professor will know you by name and will actively encourage your growth and academic experience. Explore our academic options by interest Arts Business Earth and Environmental Education Health and Wellness Humanities Pre-Professional Science and Technology Social Science Social Service Or view all of our programs .program-buttons ul li .button { padding: 1.25rem; margin-bottom: 0; background-color: rgba(255,255,255,.5); } .program-buttons ul li .category { position: relative; } .program-buttons ul li .category img.icon { display: block; width: 2.25em; height: 2.25em; } .program-buttons ul li .category p { position: absolute; top: 50%; transform: translateY(-50%); padding-left: 3.5em; font-weight: 700 !important; line-height: 1.25; text-transform: none; text-align: left; } Academics at a Glance 9,881 total students making one large family (6,979 undergraduate and2,902 graduate students) Guidance post An illustration of signs pointing left and right on a post in the ground. Students choose UNC because of our academic reputation, the cost of attendance, our size, graduates get good jobs and our reputation for social activities 100+ undergraduate programs Find the right undergraduate program for you 25Students is our average class size, and 76% of our courses have fewer than 30 students A journey An illustration of an open door. Students' long-term goals include to be well-off financially and help others who are in difficulty.~From a survey of UNC students by the Office of Assessment 14:1 Student-to-Faculty Ratio with 686 total faculty (441 of which are full-time) Fivecolleges Learn more about our colleges 1 in every 4incoming studentsis a transfer Learn more about the resources available to transfer students .homepage-research-row { background-image: url("/_resources/includes/homepage/research/_research-background.jpg"); background-size: cover; background-position: center; background-color: #013c65; } .homepage-research-row h2 { color: white; } .homepage-research-row img.icon { max-width: 3.5em; } .homepage-research-row .research-panels .panel { padding: 0; background-color: white; border: none; box-shadow: 0 15px 35px rgba(50, 50, 90, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07); } @media only screen and (max-width: 40.063em) { .homepage-research-row .research-panels .panel { margin-bottom: .9375rem; } } .homepage-research-row .research-panels .panel .cover-image { height: 10em; background-size: cover; overflow: hidden; } .homepage-research-row .research-panels .panel .panel-info { padding: 1.25rem; margin-top: -2.5em; } .homepage-research-row .research-panels .panel .panel-info h3 { width: 90%; background-color: white; margin: 0 0 .3rem 0; line-height: 1.65rem; outline: .5em solid white; } .homepage-research-row .research-panels .panel .panel-info p.publish-info { text-transform: uppercase; font-size: .8rem; margin-bottom: .8rem; } .homepage-research-row .research-panels .panel .panel-info span.read-time:before { content: '\00B7'; padding: 0 .4rem; } .homepage-research-row .research-panels .panel .panel-info a.keep-reading { margin-bottom: 0; } .homepage-research-row .research-panels .panel .panel-info a.keep-reading:after { content: " »"; } Research at UNC A Place in Colorado History Professor George Junne's wide range of research explores African-American Success and resilience across the years. Lessons in Listening UNC researchers capture the songs and study the behavior of canyon and rock wrens in natural area just west of Loveland. Skeleton Crews UNC anthropologist Britney Kyle and her students reconstruct the past by examining the bones of ancient civilizations.'''
