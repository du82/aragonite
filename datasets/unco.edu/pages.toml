["http://www.unco.edu/news"]
title = "True North"
description = "News and stories from the University of Northern Colorado (UNC) in Greeley, Colorado, home of the Bears!"
full_description = '''Health Engineering With Heart: Life-Saving Vision Takes Shape at UNC Environment Turning a New LEAF with Composting Alumni ‘In It for the Long Haul,’ Alumna and District 6 Educator Wins Presidential Teaching Award Latest Stories Philanthropy Forging Art and Community: The Maxine and Don Schwartz FoundryFebruary 13, 2025 — UNC parents Maxine and Don Schwartz shared a passion for sculpture that led to the creation of their foundry. Today, their children honor that by supporting the UNC Foundry and Sculpture program. Philanthropy The Phelps Family Legacy is All About Paying It ForwardFebruary 13, 2025 — Bob and Bonnie Phelps have big hearts for philanthropy. Having fallen in love with UNC’s campus community, they continually pour their support into its students. Philanthropy Building Champions Garners Global Support and Empowers Student-AthletesFebruary 13, 2025 — This fall, UNC Athletics pioneered its inaugural giving day campaign, Building Champions. The day of giving surpassed expectations and displayed an overwhelming amount of support for student-athletes. Philanthropy Crossing the Finish Line: The Edmissons Help Students Complete Their DegreesFebruary 13, 2025 — Rob, '76, and Michele Edmisson, '75, contribute to UNC’s record retention rates by investing in upper-class students’ education. SEE ALL STORIES Have a story idea or news to share? We want to hear from you!Review submissions guidelinesSubmit News Editor'sPick First Recipient Daniel Garza awarded the Nicholas Feinstein Technology Internship Scholarship For The Media Are you a journalist or other member of the media? Find newsroom contact information, download photos, see recent news releases and find experts on various topics on our dedicated page for media. For The MediaFind an Expert Check out our online newsletter Around UNC!Get UNC News headlines straight to your inbox with Around UNC! Around UNC is our weekly student, faculty and staff newsletter distributed every Monday. Stay up to date on the latest news all from the comfort of your own email inbox! See Around UNC News OnlineContact Newsroom to Sign Up Latest News Releases Governor Polis Reappoints Monfort and Campos-Spitze to UNC’s Board of TrusteeJanuary 17, 2025 UNC Choirs Brings Together Guest Musicians, Alumni, Students and Faculty for Major Works November 7, 2024 Week-Long Celebration to Honor First-Generation College StudentsOctober 28, 2024 UNC Arts to Host “The President’s Own” United States Marine Band September 26, 2024 See All News Releases Listen to our podcast: Bear In Mind! Bear In Mind is an award-winning podcast produced by the University of Northern Colorado offering insights on issues of local or national importance featuring UNC faculty, staff, students and alumni voices.See All Podcasts Bear Pantry: Food and supplies for everyone on campus November 22, 2024 — With students in mind, but open to any campus partner, Bear Pantry offers free food and hygienic supplies to be a Hunger Free Campus. Listen to the director of student outreach and support and the graduate assistant for Bear Pantry talk about the new Center for Student Wellbeing coming up next semester. Read More/Listen Search Stories by Keyword (function() { window.__gcse = { callback: myCallback }; function myCallback() { $(".gsc-input").removeAttr("style"); $(".gsc-input-box").removeAttr("id"); $(".gsc-input-box").removeAttr("class"); // Attach event listener to the search box $(".gsc-search-box").on("submit", function(event) { event.preventDefault(); var searchQuery = $(".gsc-input").val(); redirectToSearchResults(searchQuery); }); } function redirectToSearchResults(query) { // Specify the URL of your search results page var searchResultsUrl = "/news/search/"; // Encode the search query for the URL var encodedQuery = encodeURIComponent(query); // Construct the final URL with the search query as a parameter var finalUrl = searchResultsUrl + "?q=" + encodedQuery; // Redirect the user to the search results page 