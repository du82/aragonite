["https://uncorrected.net/sparkmail-and-a-clever-use-of-obscuring"]
title = "Sparkmail and a Clever Use of Obscuring - Uncorrected"
description = "Sparkmail does a clever thing that I've never seen in an email client: composing a new message does not automatically show you your inbox. Let me explain. If I sign into Gmail, I see this before I can craft my message: Gmail So the first step in creating a new email is seeing your received"
full_description = "Sparkmail and a Clever Use of Obscuring Sparkmail does a clever thing that I’ve never seen in an email client: composing a new message does not automatically show you your inbox. Let me explain. If I sign into Gmail, I see this before I can craft my message: Gmail So the first step in creating a new email is seeing your received messages, most notably new ones (if you have any). MailMate is a first-class Mac-assed Mac app, and it of course shows you whatever you were last looking at when you last used it. Which was probably your inbox… MailMate’s inbox (Distortion Mode for photo purposes) Spark Desktop, though, has a feature called “Home Screen” that, if enabled, hides your inbox after 15 minutes (or whatever you set it to). As you busy yourself elsewhere, Spark will eventually display a picture and notify you if there are any new emails in your inbox (but not show your inbox). Nice enough feature. But Spark takes it a step further: if you switch to Spark to compose an email, you can tap the “C” key or click the pencil icon and compose a new message… all without ever seeing your inbox. Once you send the message, you’re back in the Home Screen. It’s a subtle thing and easily deactivate, but if you’re prone to intrusive adrenaline boosts that accompany new messages in your inbox, Spark can help you maintain focus and keep doing what you need to do. Spark’s Home Screen Settings March 24, 2023 Alex Nonnemacher"
author = "Alex Nonnemacher"
