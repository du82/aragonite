description = 'Here’s this week’s list of things to check out. This is a special sportsball edition of Sunday Serial: Readkit Where Windows is a barren wasteland of RSS readers\, the Mac and iOS are a bounty of riches. Readkit has been around for a long time, but its most recent incarnation is the fastest and best'
full_description = 'Sunday Serial: ReadKit, Tally, and Human Graciousness Here’s this week’s list of things to check out. This is a special sportsball edition of Sunday Serial: Readkit Where Windows is a barren wasteland of RSS readers\<1>, the Mac and iOS are a bounty of riches. Readkit has been around for a long time, but its most recent incarnation is the fastest and best version yet. I love how it handles showing and hiding the feed list on an iPad rotated to portrait orientation. It’s a cheap subscription and worth it even if you hop between readers (as do I). Grinder I am prone to rising at the same time every morning on the weekends (vacations are an exception, when the mornings slowly unfurl into something more organic). I am likewise the earliest riser in the house on any given morning, because those meters aren’t going to row themselves. As such, there are occasions when I need to grind coffee, but am loathe to engage the burr grinder and wake my slumbering brood. To remedy this, I ordered a cheap-ish manual burr grinder, which arrived this morning. Aaron and I both made cups of AeroPress, and it was delicious. For emergencies only, of course. Human Graciousness Thank you. \<hr> \<sup>1\</sup> Using Windows, for the end user, is like using a Chromebook. January 26, 2025 Alex Nonnemacher'
