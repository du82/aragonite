description = "Daryl Austin, Writing for The Atlantic: Although a perpetrator might use the silent treatment in many different scenarios, this is what every scenario has in common: “People use the silent treatment because they can get away with it without looking abusive to others,” Williams explained, “and because it’s highly effective in making the targeted individual"
full_description = "The Silent Treatment Daryl Austin, Writing for The Atlantic: Although a perpetrator might use the silent treatment in many different scenarios, this is what every scenario has in common: “People use the silent treatment because they can get away with it without looking abusive to others,” Williams explained, “and because it’s highly effective in making the targeted individual feel bad.” The silent treatment is a particularly insidious form of abuse because it might force the victim to reconcile with the perpetrator in an effort to end the behavior, even if the victim doesn’t know why they’re apologizing. “It’s especially controlling because it deprives both sides from weighing in,” Williams said. “One person does it to the other person, and that person can’t do anything about it.” What You’re Saying When You Give Someone the Silent Treatment April 20, 2023April 20, 2023 Alex Nonnemacher"
