["https://uncorrected.net/a-few-more-days-with-the-beats-iphone-case"]
title = "A Few More Days with the Beats iPhone Case - Uncorrected"
description = "In the intervening 131 days since I first posted about the Beats case I’m rocking on my iPhone 16 Pro Max, I’ve gathered a bit of data to share. It’s Slippery: I will cop to dropping my phone sometimes. But I think almost all of the blemishes here are from the phone slipping out of"
full_description = "A Few More Days with the Beats iPhone Case In the intervening 131 days since I first posted about the Beats case I’m rocking on my iPhone 16 Pro Max, I’ve gathered a bit of data to share. Beats Case Beats Case Beats Case It’s Slippery: I will cop to dropping my phone sometimes. But I think almost all of the blemishes here are from the phone slipping out of my pocket when I’m getting in the car. Sometimes it slips out between the seats, but often it enough it clatters to the asphalt in the parking lot when I’m not using it. When you drop your phone because you’re using it while walking or doing something else, you kind of assume responsibility for it. It happens. But in this case? You’re often doing what should be the most protective responsible thing you can and it falls anyway. This is exacerbated by nylon interior pockets, which enable a new-to-me jacket to hold my crap while I’m in transit. It’s entirely possible that other garments would hold the device better. Of course, pants pockets do a nicer job. It Takes a Beating : As you can see, the case can take a beating. But unlike a nice leather case, which will only be more charming with a blemish, the Beats case looks like ass after a few falls. I’m going to try magic padding the blemishes to see if the shit-brown discolorations will come off. I mean, the ground… it’s dirty down there. February 10, 2025 Alex Nonnemacher"
