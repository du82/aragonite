title = "Valentines Day + Dinner - Uncorrected"
description = "We like to nip out for a meal often. Thursday are sometimes pizza night, because Aaron and I go to guitar lessons at 6 pm. Last night was a challenge, because one, it was the night before Valentines Day, and two, the night before the big parade in Philly to celebrate the Eagles’ winning the"
full_description = "Valentines Day + Dinner We like to nip out for a meal often. Thursday are sometimes pizza night, because Aaron and I go to guitar lessons at 6 pm. Last night was a challenge, because one, it was the night before Valentines Day, and two, the night before the big parade in Philly to celebrate the Eagles’ winning the Super Bowl. We drove past the Double Eagle, our neighborhood pub, and it was packed. So we soldiered forth to Ikura for some sushi. The operators are Chinese (we chat), but they make good sushi. Rhonda and I had agreed over 18 years ago that, for Aaron’s scheduled C-Section, Valentines Day would be a good birthday. We never really celebrated it all that seriously, and were more inclined to go out to dinner for it on a non-hallmark-holiday evening. I generally dislike going to even my favorite spots on holidays, because you aren’t going to get the normal experience. It will be crowded, or there will be a reduced menu, or something else that mars an otherwise normal experience. We’ve felt bad, though, because often even casual meals on his birthday are tough to swing. Tonight’s gonna be Chinese takeout. He was good with that. Fancier non-holiday meals await! February 14, 2025 Alex Nonnemacher"
