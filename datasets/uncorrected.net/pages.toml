title = "Sunday Serial: Glass, The Boys, and Glasstown’s “The Manor” Saison - Uncorrected"
description = '''Here's this week's list of things to check out: Glass: Glass started as an app on the App Store for iOS; it's a Flickr-like service where you can upload photos, follow other photographers, and browse. The founders describe it as "a sustainable home for photographers." I take a lot of pictures but I hate posting'''
full_description = "Sunday Serial: Glass, The Boys, and Glasstown’s “The Manor” Saison Here’s this week’s list of things to check out: Glass: Glass started as an app on the App Store for iOS; it’s a Flickr-like service where you can upload photos, follow other photographers, and browse. The founders describe it as “a sustainable home for photographers.” I take a lot of pictures but I hate posting on FaceBook and Instagram save for once in a while. Glass lets me share. The Boys: We just watched Season 4, and it was another good one, different than the first two. I want to write a post about Homelander, as he’s the most obviously disturbed character, but the whole shebang is pretty fucked up. When a former coworker mentioned it to me, I imagined a cop show. The Boys is most certainly not. The boys (Joey and Aaron) informed me that Homelander is a roman à clef for Donald Trump. Glasstown “The Manor” Saison: I read an article on The Manual celebrating this style, which described the style as “subset of the farmhouse ale is often pale in color, is very effervescent (almost sparkling wine-like), and has a dry, lightly spicy, fruity, often yeasty flavor profile.” I grabbed a four-pack while we were out shopping for the holiday weekend. I’ve always liked the style, but I wouldn’t describe Glasstown’s version as yeasty. I had it with some passable Chinese food, and enjoyed the whole pint. Gluggable at least. Glasstown’s “The Manor” SaisonHere’s this week’s list of things to check out: Glass July 7, 2024 Alex Nonnemacher"
