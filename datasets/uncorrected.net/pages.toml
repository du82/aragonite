title = "Sunday Serial: Aeropress Go Plus, Morning View XIII, and Glasstown 609 IPA - Uncorrected"
description = "Here's this week's list of things to check out: Aeropress Go Plus: Leo and Micah mentioned this on on Ask the Tech Guys; it's a travel Aeropress with an insulated tumbler you press the brew into. Morning View XIII: Incubus' Brandon Boyd on 'Morning View' Re-Recording, Tour, Lizzo (rollingstone.com) I found this while searching for"
full_description = "Sunday Serial: Aeropress Go Plus, Morning View XIII, and Glasstown 609 IPA Here’s this week’s list of things to check out: Aeropress Go Plus: Leo and Micah mentioned this on on Ask the Tech Guys; it’s a travel Aeropress with an insulated tumbler you press the brew into. Morning View XIII: Incubus’ Brandon Boyd on ‘Morning View’ Re-Recording, Tour, Lizzo (rollingstone.com) I found this while searching for something to listen to this weekend; Incubus re-recorded their 2001 album Morning View. This was my introduction to the band, so it was fun to hear it anew. You can hear the age in Brandon’s voice, but the versions are all great and looser versions of the originals. …we did our very best to honor the songs in as many ways possible, but we did embellish here and there, and the embellishments that we made were things that have evolved out of live performances of the songs. So the versions that are on _Morning View XXIII_ are very true to the originals, but it’s almost as if we did real recordings of the versions that we’ve been playing live of them. Glasstown 609 IPA): I may have include₫ this is a previous list, but it’s worth a re-mention. We can get it on tap everywhere around here, and it’s a great version of the style: hoppy, malty, high in ABV. Glasstown Brewing 609 IPA; June 30, 2024 Alex Nonnemacher"
