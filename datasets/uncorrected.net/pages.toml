title = "Serial Sunday: Notion Calendar, - Uncorrected"
description = "Here's this week's list of things to check out: 1. Notion Calendar: One of the development artifacts of macOS's UNIX routes is a preference for single-purpose apps. Unlike Outlook, Apple includes separate mail, contact, and calendar apps. You can swap out your favorite software for any of those build-in apps; I use MailMate, MimeStream, and"
full_description = "Serial Sunday: Notion Calendar, Here’s this week’s list of things to check out: 1. Notion Calendar: One of the development artifacts of macOS’s UNIX routes is a preference for single-purpose apps. Unlike Outlook, Apple includes separate mail, contact, and calendar apps. You can swap out your favorite software for any of those build-in apps; I use MailMate, MimeStream, and Fantastical on my Mac, and Fantastical and Spark on iOS and iPadOS. Microsoft touts Outlook as an integrated solution, and is deprecating its standalone apps in favor of it. I’ve been generally happy using Outlook on Windows, but I still search for good standalone options. Notion Calendar is no Fantastical, but it looks quite a lot like it, and works nicely on Windows (it is severely limited on iOS, though). 2. Blue Cork Winery: I recently visit the town of my soon-to-be employer, and stopped on the ride home to grab a bottle of wine to share with Rhonda. We’ve been drinking Rosé at most of the wineries we’ve visited, and while this was a solo mission, I was glad to find their Cab Franc Rosé in the fridge. We had it with sushi Friday night, and while it’s a bit more berry-forward than Sharrot or Bellview’s take on this wine, it was very Outer-Coastal-tasting and emblematic of the local style. 3. Dr. Martens Men’s 1460 in Cherry Red: A fit of nostalgia found me searching online for Doc Martens in blood red. I didn’t find that color, but the Cherry Red is, I suppose, the modern equivalent. I haven’t work Docs in over 20 years, but I started thinking they might not look bad with some of my officewear and especially my more casual selections (which I am prone to, at work, these days). They are pricey but I have really enjoyed wearing them since they came in, although they’re tough to break in. I imagine some black and brown Docs are in my future! Notion Calendar Blue Cork Rosé Blue Cork Rosé **Doc Martens Cherry Red** March 10, 2024March 10, 2024 Alex"
