["https://uncorrected.net/tiktok-isnt-for-therapy"]
title = "TikTok Isn’t for Therapy - Uncorrected"
description = "Angela Haupt, writing at Time, about social media's misuse of clinical terminology: While terms like gaslighting have existed in therapeutic practice for decades or longer, most only started to become common lingo within the past few years, fueled by use on social-media platforms. One viral Reddit post or TikTok video is all it takes for"
full_description = "TikTok Isn’t for Therapy Angela Haupt, writing at Time, about social media’s misuse of clinical terminology: While terms like gaslighting have existed in therapeutic practice for decades or longer, most only started to become common lingo within the past few years, fueled by use on social-media platforms. One viral Reddit post or TikTok video is all it takes for the masses to latch onto a previously overlooked word. TikTok is awash with “coaches” of dubious credibility helping everyone see how they were trauma-bonded to a narcissist. The unmediated Psych-101-ism is appalling. Sending an apology gift of flowers isn’t love bombing, disagreeing isn’t gaslighting, and calling it quits over different expectations doesn’t mean a relationship was toxic. Here we have a “coach” authoritatively listing the 7 stages of a trauma bond Three, just three Inside the mind (and pickup truck) of a narcissist Trauma Bonding Done Right If your SO says four out of six of these things, he’s a narcissist. We have more videos for you to watch if that’s the case. You can also sign up for a coaching session. Gaslighting, Narcissist, and More Psychology Terms You’re Misusing April 10, 2023 Alex Nonnemacher"
