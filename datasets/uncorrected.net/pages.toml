title = "Today’s 10K Rowing Workout: A New Personal Record - Uncorrected"
description = "I had no expectations going in to today's 10K; I was on the fence about whether I should even attempt one, considering last night's over-indulgence in delicious locally grown wines. Top 5 10K Rowing Workouts Yet I found myself crouching into every last meter, realizing early on that I was at least close to matching"
full_description = "Today’s 10K Rowing Workout: A New Personal Record I had no expectations going in to today’s 10K; I was on the fence about whether I should even attempt one, considering last night’s over-indulgence in delicious locally grown wines. Top 5 10K Rowing Workouts Yet I found myself crouching into every last meter, realizing early on that I was at least close to matching last November’s pre-COVID 10K personal record. I felt good; the pace was below 30 strokes per minute, and I was able, with focus, to keep things at 2:02 or lower for most strokes. My heart rate stayed in the lower 160s till the end of the piece. I felt good and in control throughout the row. Today’s 10K PR I ended up shaving about 20 seconds off of November’s PR. That’s not a lot of time, cosmically speaking, but 20 seconds is a long time when you’re pretending to win a boat race. November 2023’s 10K PR To be fair, I have lowered my drag setting a bit. February 18, 2024 Alex Nonnemacher"
