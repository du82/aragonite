title = "DropShelf: Yoink for Windows - Uncorrected"
description = "One app on the Mac that I love and use all the time is Yoink, a digital shelf for files. Example use case: I grab a screenshot, grab the thumbnail in the lower right corner of the screen, and then drag it into Yoink's shelf. From there, I can drag the file into an email,"
full_description = "DropShelf: Yoink for Windows One app on the Mac that I love and use all the time is Yoink, a digital shelf for files. Example use case: I grab a screenshot, grab the thumbnail in the lower right corner of the screen, and then drag it into Yoink’s shelf. From there, I can drag the file into an email, iMessage, or MarsEdit. There’s a Yoink-like app for Windows, it turns out: DropShelf. There are some differences between DropShelf and Yoink, but it is functionally equivalent. I do not, for example, like how DropShelf is activated: You select a file or files in File Explorer, and shake your cursor. The gesture requires a lot of “shaking” to the point that I think the invocation doesn’t work. It should work just by dragging, as does Yoink. DropShelf March 21, 2024 Alex"
