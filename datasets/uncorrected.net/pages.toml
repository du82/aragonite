description = "By Alex Nonnemacher"
full_description = 'Today’s 30 minute row Blew myself up today on this 30-minute piece. I did a 10-minute warmup with the missus using Apple Fitness+ (intervals with Josh) which set me up with almost 2500 meters before the 30. Ranked me in the middle of the pack. Ride the wave. 30 minute row Ranked Middle of the Pack November 8, 2023 Alex DIY Sriracha I’m spacing on this week’s Sunday Serial, but I did want to share that my youngest son, the culnarian, is making his own sriracha sauce. He took thai chilis from the garden and chopped them up. They are currently fermenting in a brine, needing a daily burp. Can’t wait to try the finished product. Sriracha, ASAP October 22, 2023 Alex Samsung 990 Pro Upgrade Stock 256GB Drive Samsung 990 Pro I replaced the 256 GB Kingston stock SSD in my Asus Zenbook with one of the new Samsung 990 Pro SSDs. I’m not sure that I’ll be able to tell the difference doing basic office work, but the stats look nice. Reinstalling the OS makes a big difference, too. Not something I experience with macOS. October 17, 2023 Alex Trying Mud\Wtr I have no problem with my daily caffeine jags, but I’ll try anything once. September 28, 2023 Alex Friday 10k 10k row A notch better than all previous efforts. Lost focus near the end a bit and dropped some watts. The quest for 40 mins continues apace. September 15, 2023 Alex Aeropress Office Coffee Upgrade After making serial cups in the original Aeropress, I can make two cups at a time with the big brother. September 14, 2023 Alex Another good trend My overall cardio fitness, as measured by the Apple Watch, has been low for a long long time. No more tho! August 11, 2023 Alex'
