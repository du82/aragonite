["https://uncorrected.net/10k-rowing-update-2"]
title = "10k Rowing Update - Uncorrected"
description = "I hit the basement this past Sunday for another 10k. I skipped it last weekend (not rowing, just the 10k) because I hadn't taken a break the previous Saturday (before Easter), and my knees were sqwaking at me. I approach most 10ks with the same mix of apprehension I used to experience when squatting weights"
full_description = "10k Rowing Update I hit the basement this past Sunday for another 10k. I skipped it last weekend (not rowing, just the 10k) because I hadn’t taken a break the previous Saturday (before Easter), and my knees were sqwaking at me. I approach most 10ks with the same mix of apprehension I used to experience when squatting weights from 325 on my (never-met) march to 400 lbs. I’m not even competing with anyone, just myself. There’s nothing on the line save my self-regard, I suppose. Anyway, despite the whisky from the day before, I put forth my best effort yet: Top-10-10k-rows I shaved 16.6 seconds off my previous PR of 40:41.6 to finish in 40 minutes, 25 seconds. I was feeling pretty confident from the outset of the row, settling in to 2:00 to 2:01 splits early on in the piece, before surrendering some gains due to exertion and concentration.1 I even started writing this post in my head, albeit crowing that I’d achieved a 40-minute 10k. That didn’t happen, but this did. My Best 10k to Date 1 I wrote before how people have asked me if I watch movies or something while I row. I don’t do that; I watch the erg computer (PM5) or my phone’s display of (mostly) the same data (the PM5 connects to your iPhone via bluetooth to the ErgData app, the interface of which is customizable in ways the PM5 is not). But my point is that it sounds ridiculous to say that concentration is involved, but avid fitness nuts know what I’m talking about. After a while, just doing the thing isn’t enough: if you’ve lost the weight or whatever and find yourself still (manically) engaged in the pursuit, it’s often for mental wellness, maintenance of course, and a borderline obsession with your stats. And for 40 minutes at a steady state, focus is both necessary and elusive. April 15, 2024 Alex Nonnemacher"
