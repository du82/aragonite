["https://uncorrected.net/xsearch-marginalia"]
title = "xSearch marginalia - Uncorrected"
description = "I wrote about xSearch here on Uncorrected around Christmas, and I still think it’s a neat utility. One thing that I was curious about, orthogonally related to xSearch, was alternative search engines. I use Google and Duck Duck Go all the time and generally find the search results useful, but one thing that I did"
full_description = "xSearch marginalia I wrote about xSearch here on Uncorrected around Christmas, and I still think it’s a neat utility. One thing that I was curious about, orthogonally related to xSearch, was alternative search engines. I use Google and Duck Duck Go all the time and generally find the search results useful, but one thing that I did observe was that many of the most interesting posts that I’ve read, especially in the software/tech nerd realm, are from small, independent blogs and sites. Google and Duck Duck Go generally show me results from larger sites, and there’s a lot of SEO bullshit and listicles and things of questionable quality that come up in search results. To remedy this, I started poking around the web for alternatives to some of the big dogs. Marginalia Search “prioritizes non-commercial content,” according to Marginalia. I’m just dipping my toes into the engine so I can’t say much about the results, but it does sport a “Blogs” filter. Marginalia Search It’s a simple trick to add Marginalia to xSearch: LaunchBar next! January 25, 2025 Alex Nonnemacher"
