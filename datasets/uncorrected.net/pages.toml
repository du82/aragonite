["https://uncorrected.net/author/alex/page/4"]
title = "Alex Nonnemacher - Uncorrected - Page 4"
description = "By Alex Nonnemacher"
full_description = "Email Yourself Articles to Feedbin I noticed that I got a copy of Steven Sinofsky’s latest Hardcore Software Substack post in my inbox, and realized that I hadn’t moved it over to Feedbin. After doing this, I wondered: could I just email myself something at my Feedbin newsletter email address and have it show up in my feed? Lo and behold, you can indeed. I’m not sure how much I’ll use this, but it’s a cool feature. A didn’t see that it was documented, but I guess the mechanism is the same. January 14, 2025 Alex Nonnemacher Unschedule Just for Practice I made an unschedule for today just to build the habit. I should have made one for tomorrow but bed calls. January 13, 2025 Alex Nonnemacher University of Delaware and a Hot Pot Deflowering I took Aaron to the University of Delaware today for a tour. It was cold and still empty from the break. It was my second visit; I took Joe a couple of years ago. I don’t remember college tours being so cold. I do remember enjoying them though. We followed up with some hot pot at Kungfu Hot Pot. It was the lunch special and there were two kinds of broth (we settled on spicy sichuan and beef broths. I told the guy, “first time.” He was patient.) We also ordered some kind of spicy Korean beef, pork belly, another kind of beef, and something else. There was an adjoining room with all kinds of grizzly bits and tripe and noodles and fish cakes and there’s too much to mention. Oh veggies too. And sauces. All kinds of sauces. Hot Pot Table I had no idea what was going on, save for the idea that things should be dunked in the roiling broth before us. Hot Pot Add Ins We tucked in hard. Hot Pot Broth As I write this, the joint is still open. What sort of boozehoundery must ensue at this late hour? I got a pound of coffee, too. January 13, 2025 Alex Nonnemacher Sunday Serial: Forever Notes, Half Growlers, The Unschdule, and OmniOutliner Whew it’s kinda late. Here’s this week’s list of things to check out. Forever Notes Since diving back into Apple’s Notes app, I’ve wondered about how best to organize the notes. I don’t subscribe as fully to the magic of search as I used to; it’s necessary, for sure, but not sufficient. I set up Notes using Tiago Forte’s PARA Method and, despite my continuing confusion of what, exactly, goes into the “Areas” folder, it’s working out pretty well. But me being me, I always wonder… Sample Forever Note for Aaron’s College Search Forever Notes doesn’t suggest much in the way of organization, but focuses more on linking notes and using some characters to enhance your search powers. It reminded me of some of my early uses of TaskPaper as a kind of project anchor document. Hookmark largely obviated the need for this kind of document for me, though. It’s a good way to learn all the goodies in Notes you’re not using. Half Growlers This adorable upstart is, as its name suggests, half of a standard wine growler at our favorite local haunt. I neglected to bring our one liter growler to fill up on their Lynx wine, and was about to buy a new one when I spied the halflings on the shelf below. I drink exactly 100 grams of wine with dinner most nights of the week, so 500 ml will be just about right. Started this evening in fact with the sous vide chicken drums and Mac and cheese we had. Half Growler of Lynx Red Wine ChatGPT tells me that they got the name “growler” from the gurgling sound they made when people sloshed them around in buckets. The Unschedule I’ve been trying to read Neil Fiori’s The Now Habit since I purchased it long enough ago that it’s not even ironic any more. It’s an interesting take on procrastination, but some of the core strategies Fiori recommends are purely behavioral, and in the case of the Unscheduled, cribbed from the practice of BF Skinner himself. Without getting into it too much, the Unscheduled shows you have to track how you spend your time each day in discreet blocks of time, blocking out commitments and things you have to do (like commuting, making coffee, prepping dinner) and then build in time for things you like to do (reading, writing, socializing, gaming…whatever it is that you do intrinsically). It’s effectively time blocking, but a little less granular. Friday’s Unschedule… My First Attempt (For my part, I cannot understand how someone who’s properly using a to-do app to time-block with the surfeit of very short tasks that inevitably populate your system.) For example, you might pick a project that you’re having a hard time getting started on and block out just one half-hour to work on it with uninterrupted focus. You then track the minutes that you spend doing the project, and reward yourself for completing the 30-minute dash by doing something preferable. The larger point of all of this is to help you see that you don’t have to work interminably to make progress, and that planning for play will make you more, not less, productive. OmniOutliner It inevitably comes to the mind of any good tech nerd that unscheduling begs for the creative application of software. I looked at some PDF templates and set something up in Notes, but I also cobbled together a quick OmniOutliner document that totals up the time logged in a cell. I love using OmniOutliner but don’t often find a good use for it. It sits in a weird space between outliner, notes app, to-do list, planner, and spreadsheet. It’s impossible not to love, a kind of Emacs for Mac nerds . It’s dense and challenging, although this has improved to some degree in this regard over subsequent releases for me (mostly around formatting). I suspect OmniOutliner doesn’t sell in anything close to the volume of OmniFocus, and so might not be as actively developed. But it’s fantastic on the Mac, iPad, and iPhone, and sync is fast over iCloud. Today’s Unschedule, just tweaking the design January 12, 2025January 24, 2025 Alex Nonnemacher"
