title = "Apple Intelligence Needs a Chatbot - Uncorrected"
description = "Six Colors: It’s also not much of a prediction to say that Apple Intelligence will continue to be the same mishmash of useful and useless features as it has been up to now. I’m not sure if anyone in the tech industry really knows which AI features will be the ones that blossom into game"
full_description = "Apple Intelligence Needs a Chatbot Six Colors: It’s also not much of a prediction to say that Apple Intelligence will continue to be the same mishmash of useful and useless features as it has been up to now. I’m not sure if anyone in the tech industry really knows which AI features will be the ones that blossom into game changers and which ones will be duds. So for now, everyone just keeps throwing spaghetti against the wall. Apple’s got several pots full of spaghetti still on a boil. It’s also not much of a prediction to say that Apple Intelligence will continue to be the same mishmash of useful and useless features as it has been up to now. I’m not sure if anyone in the tech industry really knows which AI features will be the ones that blossom into game changers and which ones will be duds. So for now, everyone just keeps throwing spaghetti against the wall. Apple’s got several pots full of spaghetti still on a boil. I’ve been using ChatGPT, and before that, Microsoft Copilot, for my chatbot needs. I really really like ChatGPT, but I want the deeper OS integration that would come with a more fulsome Siri… or maybe something else. Whatever it is, I hope it’s a lot like the chat I had today on the ride home. I was asking ChatGPT, via the iOS app, some questions, and even learned about a CLI for the Mac App Store, mas-cli. One of my favorite things about using windows is using Winget instead of their store. I was asking about Honebrew and our “chat” led me to find out about mas-cli. That wouldn’t have happened outside of that chat. Impressive. This Week in Apple: I’m goin’ to Wendy’s! January 3, 2025 Alex Nonnemacher"
