["https://uncorrected.net/author/admin/page/3"]
title = "Alex - Uncorrected - Page 3"
description = "By Alex Nonnemacher"
full_description = "Feelings Beget Consciousness A typically dense read from The Marginalian: …neuroscience affirms the body as the instrument of feeling that makes the symphony of consciousness possible: feelings, which arise from the dialogue between the body and the nervous system, are not a byproduct of consciousness but made consciousness emerge. and Consciousness… is a particular state of mind resulting from a biological process toward which multiple mental events make a contribution… These contributions converge, in a regimented way, to produce something quite complex and yet perfectly natural: the encompassing mental experience of a living organism caught, moment after moment, in the act of apprehending the world within itself and, wonder of wonders, the world around itself. Organisms progress from “minding”: create images from sensory experience, to thoughts: rendering the internal world in the same way. I Feel, Therefore I Am: Neuroscientist Antonio Damasio on Consciousness as a Full-Body Phenomenon March 21, 2024 Alex DropShelf: Yoink for Windows One app on the Mac that I love and use all the time is Yoink, a digital shelf for files. Example use case: I grab a screenshot, grab the thumbnail in the lower right corner of the screen, and then drag it into Yoink’s shelf. From there, I can drag the file into an email, iMessage, or MarsEdit. There’s a Yoink-like app for Windows, it turns out: DropShelf. There are some differences between DropShelf and Yoink, but it is functionally equivalent. I do not, for example, like how DropShelf is activated: You select a file or files in File Explorer, and shake your cursor. The gesture requires a lot of “shaking” to the point that I think the invocation doesn’t work. It should work just by dragging, as does Yoink. DropShelf March 21, 2024 Alex Serial Sunday: Quick Accent in PowerToys, Butter Steak, and la Jolie Fleur Here’s this week’s things of check out: Quick Accent in PowerToys: I’ve written about my love for PowerToys on Windows before, but necessity was the mother of discovery for me this week. While trying to type “café” a few times this week, I struggled to find the accented “e” character in Windows. A quick web search helped me discover that PowerToys has an affordance similar to that offered on the Mac: to find and enter an accented letter, hold down the letter key and tap the space bar. Presto: atop your screen appears a list of possible accented letters. You use the number key or the arrow keys to select your target. Pretty bueno. Butter Steak: Rhonda and I had a neighbor who used to crow about this downmarket grocery store nearby and their “butter steaks.” I didn’t know what a butter steak was and suspected the name was an Orwellian trick to call the steak the opposite of what it was. Having seen them in our local butchers, I knew they were cheap and kinda homely. Turns out it’s a flat iron steak, which is a much sturdier sounding name. I’ve had exactly one flat iron steak before, at the now-defunct (pour one out) Winfield’s in Millville, NJ, site of many excellent meals shared with family and friends before it closed during the COVID pandemic. I purchased one butter steak alongside a more fanciful ribeye roast (two bones) for under four bucks, chucked it in the sous vide tanking along with the ribeye, and seared it off on the grill with the roast. I sliced it on the bias and served for everyone to try. I was excellent; more tender than a flank, more chew than a filet mignon. What a great, cheap, if ugly, cut of beef. La Jolie Fleur Rosé: Rhonda and I nipped out Friday to the around-the-corner Greenview Inn. We have been sipping rosé regularly at local wineries, and taking a bottle along from said wineries to our favorite BYOBs in town. Greenview offering a full bar, we ordered off of the menu, and tried the only rosé on the list: la Jolie Fleur. It was more grapefruity than the Outer Coastal Plains varietals we’ve been enjoying, with some sediment at the bottom of the bottle. Very crisp. Would be nice to sip chilled by the pool this summer. Quick Accent in PowerToys March 17, 2024 Alex"
