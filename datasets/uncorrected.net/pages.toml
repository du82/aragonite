["https://uncorrected.net/being-stress-free-isnt-the-goal"]
title = "Being “Stress Free” Isn’t the Goal - Uncorrected"
description = "This a powerful video that echoes a line of thinking that’s currently ascendant around the web. Call it “antifragility,” Stoicism, productive struggle, or not giving a fck. I do like Vivek Murthy’s twist on it, though, in that he highlights relationships as the antidote. The more you look into the productivity literature, the more you"
full_description = "Being “Stress Free” Isn’t the Goal This a powerful video that echoes a line of thinking that’s currently ascendant around the web. Call it “antifragility,” Stoicism, productive struggle, or not giving a fck. I do like Vivek Murthy’s twist on it, though, in that he highlights relationships as the antidote. The more you look into the productivity literature, the more you read about managing stress and other internal states and cognitions. Fulfillment is not the lack of hardship and it’s also not lack of stress in your life and I think sometimes we assume that we got to get rid of all stress in order to be happy but when we’re truly rooted in relationships and purpose and service that foundation actually makes us more resilient in the face of stress. in life there are going to be some stresses and struggles that come our way and the question is can we be in a position where we’re more able to manage them and handle them because we’re not alone…because we have folks around us to support. January 7, 2025 Alex Nonnemacher"
