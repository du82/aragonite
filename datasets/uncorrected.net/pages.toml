title = "Sunday Serial: Tonewood Brewing’s Coffee Porter, ChatGPT for iOS, and Humboldt Fog Cheese - Uncorrected"
description = "Tonewood Brewing’s Revolution Coffee Porter 2 Row, dark specialty malts, dash of flaked oats. Cacao Nibs and Coﬀee from Revolution Rhonda and I stopped at Tonewood last night after dinner for Joey’s birthday at Fuji (for his 20th 😯 birthday) while the boys shopped the House of Fun, and I got one of these. It"
full_description = "Sunday Serial: Tonewood Brewing’s Coffee Porter, ChatGPT for iOS, and Humboldt Fog Cheese Tonewood Brewing’s Revolution Coffee Porter 2 Row, dark specialty malts, dash of flaked oats. Cacao Nibs and Coﬀee from Revolution Rhonda and I stopped at Tonewood last night after dinner for Joey’s birthday at Fuji (for his 20th 😯 birthday) while the boys shopped the House of Fun, and I got one of these. It was delicious and I’m glad I got to try it. I wanted to last weekend but I tried two other styles instead. Rhonda got the Stratocaster, which was also good. Tonewood Coffee Porter Humboldt FogGoat Cheese I can’t believe that I haven’t written about Humboldt Fog here on Uncorrected yet! This soft-ripened goat cheese from Cypress Grove has a brie-like rind and a creamy outer layer, with a more traditional goat cheese center. We get it at Bagliani’s when we go, and when it looks fresh. When it’s looking old, it gets really runny in the brie-like section, and loses some of it structural rigidity. You can tell for sure. It’s worth getting if you like brie and goat cheese. I like it just by itself, but it pairs really nicely with a drizzle of honey. Humboldt Fog Cheese ChatGPT Integration in iOS I’ve been using ChatGPT, and before that, Microsoft Copilot, for my chatbot needs. I really really like ChatGPT, but I want the deeper OS integration that would come with a more fulsome Siri… or maybe something else. Whatever it is, I hope it’s a lot like the chat I had Friday on the commute home. I was asking ChatGPT, via the iOS app, some questions, which led to my learning about a CLI for the Mac App Store, mas-cli. (One of my favorite things about using Windows is using Winget instead of their GUI-based store.) I was asking about Honebrew and our “chat” led me to find out about mas-cli. That wouldn’t have happened outside of that chat. I’m pretty excited for Siri to work this way… I just hope that happens. I’ve been waiting for Siri to be more useful for a long time. The integration of the Apple ecosystem is one of the defining experiences of using the platform. ChatGPT on iOS January 5, 2025 Alex Nonnemacher"
