full_description = "Drexel Tour is a Good Excuse to Lunch in Chinatown Rhonda and I took Aaron for a tour of Drexel University today. It was a carbon copy of the trip I took with Joe two years ago. It was rainy and cold, so I didn’t get any good pics on campus, but lunch was a nice adventure after. Chuan Kee Skewer I found this joint on Eater Philly, and it sounded good. I had three places in mind, but this was the consensus due to hot pot… or so we thought. They didn’t have it on the menu, and the server seemed befuddle₫ when I showed him pics of the dish (on Chuan Kee’s Yelp page). So we got some grilled stuff, dumplings, and ramen. Spicy Dumplings BBQ Reading Terminal Market I didn’t realize how close this was, so we walked from Chuan Kee. Cannoli from Termini Bros! Cannoli Rays Coffee and Tea House They still make siphon coffee, but I ordered the house blend before I realized it. Next time. April 2, 2024 Alex"
