description = "Here's this week's list of things to check out: Tabbs: Tabbs is a Chrome extension that adds some flair and functionality to the default tab search in your Chromium-based browser of choice (I'm using Brave). You can search your open tabs, close duplicates, creat tab groups, and more. Tri-Tip Roast: Tri-Tip might get its own"
full_description = "Serial Sunday: Tabbs Chrome Extension, Tri-Tip Roast, and Dune Here’s this week’s list of things to check out: Tabbs: Tabbs is a Chrome extension that adds some flair and functionality to the default tab search in your Chromium-based browser of choice (I’m using Brave). You can search your open tabs, close duplicates, creat tab groups, and more. Tri-Tip Roast: Tri-Tip might get its own post here on Uncorrected. This roast is from the sirloin of the steer, and this one came complete with a nice fat cap. I sous vided it at 129 for about three hours and seared over lump charcoal for about ten minutes. Delicious. Dune: I haven’t seen the second install ment of Villaneuva’s interpretation of the Frank Herbert sci-fi classic, but I can’t wait. It’s getting good reviews. I read all six of the original books in college. My roommate was one book behind me and gobbled them up right after I did. Tabbs Dune February 25, 2024 Alex"
