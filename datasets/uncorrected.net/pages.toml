description = "Sad news, but I suppose with four-cylinder turbos being so ubiquitous, this made more sense. Rhonda had one of these that she bought in like 2002 if I remember correctly. It was an Indigo Blue VR6 GTI with leather and some kind of fancy speaker system. It was a blast to drive, powerful and throaty."
full_description = "Pour One Out for the VW VR6 Sad news, but I suppose with four-cylinder turbos being so ubiquitous, this made more sense. Rhonda had one of these that she bought in like 2002 if I remember correctly. It was an Indigo Blue VR6 GTI with leather and some kind of fancy speaker system. It was a blast to drive, powerful and throaty. It was, sadly, plagued with electrical problems, so between that and the difficulty of putting an infant travel system in the back of a hatchback coupe, we traded it in for a more practical grocery getter. Cool Cars I can only find this picture of the GTI. It was pre-iPhone days, so casual photography was still a more purposeful endeavor than it is today. My favorite part, though, is that you can see my 2000 Toyota MR2 Spyder on the other side of the GTI. Look how tiny! That was a fun car: mid-engine, rear-wheel drive, light, and of course, a drop-top roadster. Volkswagen Has Ended VR6 Production, Silencing Its Six-Cylinder Song January 5, 2025 Alex Nonnemacher"
