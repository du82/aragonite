description = "I was listening to Cal Newport’s The Deep Life this morning on my way in to the office and he was talking about a guy who used a spreadsheet to log how he felt each day. A -2 was the worst feeling he would score a day, and 2 was a great day. He’d tab"
full_description = "Soulver and the Good Life Algorithm I was listening to Cal Newport’s The Deep Life this morning on my way in to the office and he was talking about a guy who used a spreadsheet to log how he felt each day. A -2 was the worst feeling he would score a day, and 2 was a great day. He’d tab over and add notes in the adjoining column. I thought about trying this out and, after considering using Numbers, it would make a great Soulver sheet. So I’m doing that. March 3, 2025 Alex Nonnemacher Soulver and the Good Life Algorithm I was listening to Cal Newport’s The Deep Life this morning on my way in to the office and he was talking about a guy who used a spreadsheet to log how he felt each day. A -2 was the worst feeling he would score a day, and 2 was a great day. He’d tab over and add notes in the adjoining column. I thought about trying this out and, after considering using Numbers, it would make a great Soulver sheet. So I’m doing that. March 3, 2025 Alex Nonnemacher Post navigation ← Sunday Serial: Ivory, Tapestry, and a Black Magic TrackpadDaredevil Season 4 Premiere is Tonight! →"
