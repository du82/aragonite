description = "I've shared before that one of my rowing goals is to row a 10k in 40 minutes flat. I've gotten close but I still have some seconds to shave off my best time: Today's 7500 was a surprising jump, especially for a weekday row (fueled by nothing more than a cup of coffee and some"
full_description = "On the Way to 10k I’ve shared before that one of my rowing goals is to row a 10k in 40 minutes flat. I’ve gotten close but I still have some seconds to shave off my best time: My Best 10k to Date Today’s 7500 was a surprising jump, especially for a weekday row (fueled by nothing more than a cup of coffee and some pineapple). I managed to keep my pace at just about 2:00 and finished just over 30 minutes. That’s only 75% of the 10k total I’m shooting for, but I was pleased. 7500 meter row March 14, 2024 Alex"
author = "Alex"
