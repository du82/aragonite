description = "I featured Tabbs back in February as a Sunday Serial pick. My subscription just renewed, and I thought I'd dig back into this extension. After a little configuration rejiggering (ctrl-j is the default trigger for the extention on Windows, which conflicts with Edge's default shortcut for showing your downloads), I got to peeking around in"
full_description = "Manage Your Browser Tabs with Tabbs I featured Tabbs back in February as a Sunday Serial pick. My subscription just renewed, and I thought I’d dig back into this extension. After a little configuration rejiggering (ctrl-j is the default trigger for the extention on Windows, which conflicts with Edge’s default shortcut for showing your downloads), I got to peeking around in the settings configuation. Without using keyboard shortcuts, Tabbs looks nicer than the default tab switcher in Chrome-based browsers, but mousing isn’t any faster or different from the browser default. This is where Tabbs really shines: after invoking the extension, typing alt-c will close a tab without switching to it. Similarly, you can pin tabs to the Tabbs menu to keep it at the top. Tabbs Extension Panel Another way that Tabbs speeds up your browsing is by allowing you to interact with a tab in a submenu from the Tabbs pane. After invoking the extension, you click or arrow to a tab (or search for it) and then type the slash character (/), which reveals a second panel with commands specifc to the selected tab: – Pin – Close – Bookmark – Select – Nap Tab Tabbs Submenu In addition to searching your open tabs, Tabbs will search your browser history. If you spend a lot of time in a browser, Tabbs is worth a serious look. Do note, though, that it requires a subscription to use all of the features. August 21, 2024 Alex Nonnemacher"
