full_description = "Chickenbag Hot on the heels of eggbag, I bring you: chickenbag. Arguably another portmanteau, chickenbag is a bag fashioned from aluminum foil that I use to store chicken, hot off the grill, for service (ie dinner). We have grilled chicken breasts about once a week, but sometimes it’s just something I make for Joe when the rest of us are having beef. I tear off a big sheet, crimp the fold and sides into a seam, and leave the top open for chicken to go into after it’s done. I can cook in batches and move it off to the side until dinner is served. Grilled chicken, pre-bag Grilled chicken in chickenbag Chickenbag April 1, 2024 Alex"
