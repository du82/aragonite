["https://uncorrected.net/sunday-serial-ipad-mini-7-plagidos-winery-and-readwise-chat"]
title = "Sunday Serial: iPad Mini 7, Plagido’s Winery, and Readwise Chat - Uncorrected"
description = "Here’s this week’s list of things to check out. I’m deep into cheese and aperol spritzes in anticipation of the game. I don’t really care about football but it’s a fun night! iPad Mini 7 Apple neglects this little version of their tablet for a while, and then incrementally updates it from time to time."
full_description = "Sunday Serial: iPad Mini 7, Plagido’s Winery, and Readwise Chat Here’s this week’s list of things to check out. I’m deep into cheese and aperol spritzes in anticipation of the game. I don’t really care about football but it’s a fun night! iPad Mini 7 Apple neglects this little version of their tablet for a while, and then incrementally updates it from time to time. The most recent version is the seventh iteration, and it’s understandably criticized for having a 60 Hz refresh rate and an older chip. But like the first iPad mini, which did not compare favorably to the full-sized iPads available when it was released, it is useful and charming in ways that defy expectation. It’s a great iPad to take notes on, read, and do some light work. They are popular assistive tech devices for our students for sure. I honestly can’t say that this one I’ve been using wants for anything, although I would appreciate ProMotion. iPad Mini 7 iPad Mini 7 iPad mini 7 Plagido’s Winery in Hammonton, NJ Rhonda and I stopped by our usual haunt, Bellview Winery, yesterday for a growler fill and a bottle of rosé, but unsurprisingly, it was packed with pre-game revelers enjoying a chocolate and wine event. We usually stay away when these things are going on. Our backup plan included possibly driving to nearby Hammonton, NJ, and getting some salami and cheeses at Bagliani’s. We made a b-line for Plagido’s winery in town, which a colleague and friend described as having very good wine after a wine trail event stop there. The interior is industrial where Bellview’s more rustic and bucolic, but you do get to learn a fair bit about the wine if the owner is working. We enjoyed a bottle of Vidal Blanc and a cheese plate. We will be back for sure, and will be eager to try the outdoor seating. We tried a red blend that was finished with espresso beans, too. Readwise: “Chat with Your Highlights” Feature Pretty much every night, when I brush my teeth before bed, I read the five highlights that Readwise exhumes from my ever-deepening stash of quotes from ebooks and websites I’ve, at one time or another, highlighted. This is a valuable feature and the main reason I subscribe to the service. The other night, I noticed this feature and clicked in to check it out. It works on the web, as well; you can type in a prompt, and Readwise will return an answer with citations from your highlights. It’s a genius feature and approximates what many of us are bullish about using AI for: synthesizing your personal library of content across sources. February 9, 2025February 9, 2025 Alex Nonnemacher"
