["https://uncorrected.net/author/admin/page/2"]
title = "Alex - Uncorrected - Page 2"
description = "By Alex Nonnemacher"
full_description = "New Maraschino Cherries Finished up the can of Starlino Hotel cherries. Trying these Amarena cherries tonight 🍸 June 10, 2024 Alex “It’s a constant assault against all of your efforts.” This is how I described gardening to Rhonda when she was talking about all of the animals trying to boost her crops. May 20, 2024May 19, 2024 Alex Sunday Serial: Tonewood Brewing, Dominick’s Tavern, and Pink Pants Serial Sunday: Tonewood Brewing: I’ve written about some of Tonewood’s styles here on Uncorrected before, but have never selected it for a Sunday Serial. Rhonda and I snuck over to Tonewood, as we do, after dropping the boys off at House of Fun. While they shopped, we tried a few beers; I had a 16-oz Block Party, which is a “Modern American IPA.” I was drawn to the Deep End but the Block Party won out; I did try a 10-oz Deep End, which is a Mexican Dark Lager. I was thinking Negro Modelo, which is OK, but this was much, much better. I was worried that I wouldn’t be able to taste much after having an IPA first, but even the Deep End was plenty hoppy. Rhonda got the Double-Dry Hopped Fuego, which we both tried on our last visit and loved, followed by a 10-oz Block Party. We got some to go, too; I dropped one of the cans in the driveway when we got home because I was trying to carry too much, and it sprung a leak, so there are only three cans. Dominick’s Tavern:: We have taken the boys and some of their friends here on numerous visits; it is one of our most frequent Camden County stops. The wings here are coated, so caveat emptor. They’re big-ass wings and there are a handful of sauces to try; I usually go for the 911, which seems like a buffalo hot sauce with some hot pickled cherry peppers mixed in. Rhonda got the Fat Daddy sauce, which is a buffalo sauce with bleu cheese and maybe vinegar stirred into it. I tried it once and thought it was OK. They always have Tonewood’s Fuego on tap. Pink pants: I got some. Tonewood IPAs Tonewood Deep End Dominick’s 911 Wings Pink Pants May 19, 2024 Alex"
