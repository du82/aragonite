["https://uncorrected.net/magic-trackpad"]
title = "Magic Trackpad - Uncorrected"
description = "I have, in what I’d generously refer to as a spirit of constant iteration, and in a more critical mood ascribe to rampant consumerism and existential dread, engaged my Apple Magic Trackpad in the service of my desktop Mac for the weekend in an effort to determine if it might, in fact, be a suitable"
full_description = "Magic Trackpad I have, in what I’d generously refer to as a spirit of constant iteration, and in a more critical mood ascribe to rampant consumerism and existential dread, engaged my Apple Magic Trackpad in the service of my desktop Mac for the weekend in an effort to determine if it might, in fact, be a suitable replacement for my beloved Logi MX Master 3. iPad Pro Duty My Magic Trackpad, and older lightning model, serves duty as the pointing interface for my iPad Pro at the office. I realized a long time ago that I like using a Magic Trackpad over a mouse with an iPad, because it very closely mimics the experience of touching the iPad itself, most notably using gestures. I’ve been a keen user of iPad gestures since they came out with the iPad 2. iPad Pro with Magic Trackpad On the Mac One discovery: data detectors. Using three fingers to select an item (for example, a date in a block of text from an email) reveals as more-iOSy pop-up panel, showing your calendar at that date.) When mousing, you. Can reveal similar options, but in a contextual menu with fewer visual affordances. Magic Trackpad Anyway, I didn’t get to spend enough time with the Trackpad this weekend, so we’ll have to see. I could order one, use it, and send it back if I don’t like it. Maybe I can sneak up to Best Buy this week and grab one. Or I’ll bring it home and go through the rigamarole of pairing and unpairing. I do find having my hand hovering over the wedge feels weird and stressful compared to using a mouse. February 9, 2025 Alex Nonnemacher"
