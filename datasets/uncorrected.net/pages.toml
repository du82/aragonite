["https://uncorrected.net/in-the-spirit-of-the-season"]
title = "In the Spirit of the Season - Uncorrected"
description = "Back before the holiday, I found myself reviewing OmniFocus and decided to, apropos of nothing, change the name of “Office Christmas Party” to “In the Spirit of the Season.” It occurred to me that I must have read or heard that somewhere and my mind dredged it up from my long-term memory. That’s pretty interesting"
full_description = "In the Spirit of the Season Back before the holiday, I found myself reviewing OmniFocus and decided to, apropos of nothing, change the name of “Office Christmas Party” to “In the Spirit of the Season.” It occurred to me that I must have read or heard that somewhere and my mind dredged it up from my long-term memory. That’s pretty interesting on its own, cognitively speaking. It also occurred to me that I might be getting soft and corny now that I’ve turned the page to the age of 50. But then I woke up on Sunday, on my side of the bed, and looked at the wall next to my warm spot, and saw this: Our wedding invitation It’s our wedding invitation, framed, which has been hanging on our wall ever since we got it. It think my mom had it done for us. And it opens, “In the Spirit of the Season.” Nice. January 8, 2025 Alex Nonnemacher"
