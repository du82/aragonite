title = "Feelings Beget Consciousness - Uncorrected"
description = "A typically dense read from The Marginalian: ...neuroscience affirms the body as the instrument of feeling that makes the symphony of consciousness possible: feelings, which arise from the dialogue between the body and the nervous system, are not a byproduct of consciousness but made consciousness emerge. and Consciousness… is a particular state of mind resulting"
full_description = "Feelings Beget Consciousness A typically dense read from The Marginalian: …neuroscience affirms the body as the instrument of feeling that makes the symphony of consciousness possible: feelings, which arise from the dialogue between the body and the nervous system, are not a byproduct of consciousness but made consciousness emerge. and Consciousness… is a particular state of mind resulting from a biological process toward which multiple mental events make a contribution… These contributions converge, in a regimented way, to produce something quite complex and yet perfectly natural: the encompassing mental experience of a living organism caught, moment after moment, in the act of apprehending the world within itself and, wonder of wonders, the world around itself. Organisms progress from “minding”: create images from sensory experience, to thoughts: rendering the internal world in the same way. I Feel, Therefore I Am: Neuroscientist Antonio Damasio on Consciousness as a Full-Body Phenomenon March 21, 2024 Alex"
