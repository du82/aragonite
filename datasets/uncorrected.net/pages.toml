description = "So check this out: Last year, about one year ago, while we were on vacation in Ocean City, Rhonda and I brought Aaron home during one day to pick up his girlfriend. I snuck in a 10k row while we were here. I was curious how my one-year-ago effort compared to my most recent 10ks,"
full_description = "Vacation-Adjacent 10k Rowing Comparison So check this out: Last year, about one year ago, while we were on vacation in Ocean City, Rhonda and I brought Aaron home during one day to pick up his girlfriend. I snuck in a 10k row while we were here. I was curious how my one-year-ago effort compared to my most recent 10ks, where I’ve taken to slowing things down a bit and focusing on form. Here’s the table: Vacation-adjacent 10ks Times are about equal, as is pace. Power(watts) are also equivalent. But comparing my heart rate shows a lower rate at the same effort year over year, and my stroke rate is considerably lower this year. I’ve pivoted from faster to something different… more efficient? More power per stroke? Interesting. August 2, 2024 Alex Nonnemacher"
