full_description = "Military Time I set my Mac and phone to military time probably 12 or so years ago. That’s a conspicuously nebulous timeframe for remembering when a person decided to complicate his life. My adoption of military time nearly bit me today; I almost made a rez at the Maplewood for 4:30 pm, because 1630 is 4:30 for civilians. My intention was a quiet table for two at a beloved local spot: at 6:30. Which is 1830. Fun, right? If you don’t know how military time works But the other side of this is… I had to solve a little problem. It was a few seconds, and probably good for my brain. January 24, 2025 Alex Nonnemacher"
