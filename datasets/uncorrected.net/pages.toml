title = "University of Delaware and a Hot Pot Deflowering - Uncorrected"
description = "I took Aaron to the University of Delaware today for a tour. It was cold and still empty from the break. It was my second visit; I took Joe a couple of years ago. I don’t remember college tours being so cold. I do remember enjoying them though. We followed up with some hot pot"
full_description = "University of Delaware and a Hot Pot Deflowering I took Aaron to the University of Delaware today for a tour. It was cold and still empty from the break. It was my second visit; I took Joe a couple of years ago. I don’t remember college tours being so cold. I do remember enjoying them though. We followed up with some hot pot at Kungfu Hot Pot. It was the lunch special and there were two kinds of broth (we settled on spicy sichuan and beef broths. I told the guy, “first time.” He was patient.) We also ordered some kind of spicy Korean beef, pork belly, another kind of beef, and something else. There was an adjoining room with all kinds of grizzly bits and tripe and noodles and fish cakes and there’s too much to mention. Oh veggies too. And sauces. All kinds of sauces. Hot Pot Table I had no idea what was going on, save for the idea that things should be dunked in the roiling broth before us. Hot Pot Add Ins We tucked in hard. Hot Pot Broth As I write this, the joint is still open. What sort of boozehoundery must ensue at this late hour? I got a pound of coffee, too. January 13, 2025 Alex Nonnemacher"
