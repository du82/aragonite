description = "You find yourself in need of a second spritz, but dispirited by a lack of prosecco, having finished your stash with someone special. The obvious answers--beer? White Claw?--prove unsatisfying. You lapse into a moment of despair, but alight from this fog inspired: what if you subbed out the prosecco with some Chardonnay? You extract yourself"
full_description = "A Riff on the Aperol Spritz You find yourself in need of a second spritz, but dispirited by a lack of prosecco, having finished your stash with someone special. The obvious answers–beer? White Claw?–prove unsatisfying. You lapse into a moment of despair, but alight from this fog inspired: what if you subbed out the prosecco with some Chardonnay? You extract yourself from the pool and trundle to the kitchen. Plenty of Aperol. Plenty of seltzer. Oranges, too. You pour some of the white stuff into a shaker filled with ice. Pour in the correct proportion of Aperol, 3:2 if you’re doing it right. You shake the mix up like Tom Cruise in a bad movie, strain into a glass with ice, and top up with seltzer and orange for garnish. You pad back out to the pool, deliver the drink, and pretend you didn’t taste it and already declare it a worthy backup (but not a replacement for the real thing). You done good. June 24, 2024 Alex Nonnemacher"
