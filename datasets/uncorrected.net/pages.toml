full_description = "Steve Lukather’s a Beauty If you, like me, are prone to going down a YouTube rat hole, you may have seen Rick Beato interviewing guitar legends. I saw his interview with Steve Lukatherlast night while brushing my teeth, and I never realized how many iconic songs from the 80s he played on. I knew he played on Michael Jackson’s Thriller , but the interview caused me to look up a playlist on Apple Music. One of my guilty MTV-inspired pleasures from the 80s is “She’s a Beauty” by the Tubes. I remember the video vividly, but have enjoyed the song every time it comes on. Which it does, on my iPhone. She’s a Beauty by the Tubes And the guitarist on that song? Steve Lukather. February 5, 2025 Alex Nonnemacher"
