["https://uncorrected.net/serial-sunday-markdown-monster-batterybar-pro-and-the-bankbar"]
title = "Serial Sunday: Markdown Monster, BatteryBar Pro, and The BankBar - Uncorrected"
description = "Here's this week's list of things to check out: Markdown Monster: I tried this Markdown blogging app a while back, but never got it to work. I installed it yesterday on my Alienware R6 (it's Aaron's old gaming rig, that sat unused in his closet for a while until I resurrected it and overstuffed it"
full_description = "Serial Sunday: Markdown Monster, BatteryBar Pro, and The BankBar Here’s this week’s list of things to check out: Markdown Monster: I tried this Markdown blogging app a while back, but never got it to work. I installed it yesterday on my Alienware R6 (it’s Aaron’s old gaming rig, that sat unused in his closet for a while until I resurrected it and overstuffed it with 32 GB of RAM), and it works pretty well. I’m having a hard time understanding how to get image posting working, but hopefully I’ll figure it out. It does some clever things, like grabbing your clipboard when you hit control-k to add a link to text in your post. I’m guessing you could just use Markdown Monster for all of your Markdown needs, but that’s what Typora is for. BatteryBar Pro: This little Windows utility is a nice stand-in for Coconut Battery on the Mac. It’s better than the default battery status report Windows will generate for you. Not that pretty but that’s Windows utilities for you. The BankBar in Gloucester City: I wrote this up a bit this morning, but it’s a good spot worth a stop. Gloucester City is a blue-collar town, and has always felt comfortable to me coming from Millville and Vineland, as I do. And hey: the name is CamelCased. Bank Bar Markdown Monster BatteryBar Pro April 7, 2024April 7, 2024 Alex Nonnemacher"
author = "Alex Nonnemacher"
year_published = 2024
