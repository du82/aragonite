["https://uncorrected.net/author/alex/page/2"]
title = "Alex Nonnemacher - Uncorrected - Page 2"
description = "By Alex Nonnemacher"
full_description = "Why Iggles Bleed Green I usually look to Vonnegut when the fan noise gets to be too much. But here’s a good explainer: A sports team is an expression of a fan’s sense of self, as I learned from dozens of interviews and research articles I surveyed for my book “The Secret Lives of Sports Fans,” is an expansion of a fan’s sense of self. It is not an obnoxious affectation when a devotee uses the word “we”; it’s a literal confusion in the brain about what is “me” and what is “the team.” In all kinds of unconscious ways, a fan mirrors the feelings, actions and even hormones of the players. Self-esteem rides on the outcome of the game and the image of the franchise. The psychology of why sports fans see their teams as extensions of themselves February 16, 2025 Alex Nonnemacher Lazy Sunday in Hammonton Discouraged by the likelihood of non-regulars flooding the local wineries, Rhonda and I made a rez at the Blue Rascal in Hammonton for late afternoon cocktails. We each had a rye Manhattan, proceeded by an old fashioned and a whisky sour. We brought our own provisions and stopped route at Baglianis for a restock. It was a short hop over to the Maplewood, so why not? Rye Manhattans at Blue Rascal Whisky Sour at Blue Rascal Maplewood Nino’s Special at the Maplewood 1 Comment February 16, 2025 Alex Nonnemacher Sunday Serial: BundlehuntSunday Edition! Say what you will about Reddit: I find out about a lot of cool software from there. TIL there was a bundle available and I got a few things. File List Export I have high expectations for this app, considering the synchrony with which it came into my life. I’m tryin to move my file system over from PARA to Johnny Dcimal and It’s a lot to think about. I’m thinking FLE will help me build a JDex. Can you imagine… a daily OPML of your files, viewable in OmniOutliner? But we’ll see. DisplayBuddy I’ve been plugging my Macs into external displays since forever, and in the most convenient applications, that was an Apple Display of some kind. Apple stopped making displays for a while, and the ones they make now are nice but expensive (and generally beyond my needs). I can live very comfortably with a 4k display of just about any kind, and a 60 Hz refresh rate doesn’t bother me at all…on a Mac. (Having recently experienced the difference between the display on the MacBook Pro and an M2 Air, however, I can attest to my preference for the Pro Display). More importantly, though, using an iPad or iPhone with ProMotion will spoil you for that display technology. But on a Mac? For my needs, 60 is fine. One of the bugaboos about using third-party displays on the Mac, however, is that while most of them will work as a display right out of the box, many have no additional software support outside of what macOS recognizes. I grabbed a cheap display around the holidays (a 27” Samsung G5) to use at the office, and I was suspicious that not all of the resolutions capable were shown in the System Settings app for the Mac. I found DisplayBuddy and BetterDisplay via Reddit, and have tried both. So this was a good chance to get a license. I did manage to change the resolution on my Mac Studio connected to a 32” Samsung U32J59 to something that didn’t work, and I had to go through a harrowing hour of trying to fix it. But if you’re even interested in reading at this point, you’re probably someone who has hosed your filesystem a few times or rm-ed something by accident, so carry on. DeltaWalker Pro I don’t need the unix Diff command very often, but when I do, I really love it. When you’re comparing long lists of data, and you find a tool like Diff that makes short work of such a boring, repetitive task, you can’t help but feel bad for someone who’s trying to accomplish something you just know could be handled by a terminal command, BBEdit, or DeltaWaker. February 16, 2025 Alex Nonnemacher"
