title = "Sunday Serial: ShareShot, Tapena, and Wine Growlers - Uncorrected"
description = "Here’s this week’s list of things to check out. Shareshot: Shareshot is a cool utility for iPhone and iPad that allows you to drop images from your Photos library into the app and add an iPhone background to the screenshot. There are a lot of fiddly options that make this fun and smart looking. Tameno:"
full_description = "Sunday Serial: ShareShot, Tapena, and Wine Growlers Here’s this week’s list of things to check out. Shareshot: Shareshot is a cool utility for iPhone and iPad that allows you to drop images from your Photos library into the app and add an iPhone background to the screenshot. There are a lot of fiddly options that make this fun and smart looking. Tameno: From the maker of the must-have Yoink comes Tameno, a timer app for iPhone and Apple Watch. You set one-off timers using a delightful swipe-driven interface, which responds adaptively to your touch, to set interval-based timers. As a quick example, you can set a two-minute timer that will tap you each 120 seconds. Simple, useful, cool. You can’t save a bank of timers, but you can check your history, which is just as good. Wine Growlers: Rhonda and I went from splitting a bottle of wine at our local haunt to splitting a growler. This move happened over one weekend and is now our default. This weekend, we graduated our practice to getting two growlers so that we’d have 1. Room to try something new and 2. Some wine to enjoy at home. Pro move. I feel like we’ve entered a new echelon of winery goer. Shareshot Tameno < p> August 25, 2024August 25, 2024 Alex Nonnemacher"
