["https://uncorrected.net/sunday-serial-reeder-marsedit-and-picanha"]
title = "Sunday Serial: Reeder, MarsEdit, and Picanha - Uncorrected"
description = "Here’s this week’s list of things to check out: Reeder: Reeder is one of the first RSS readers that came out for iOS, some 15 years ago (according to their website). I remember checking RSS feeds at Wheaton Village while playing and lunching with the boys back in the day. The original Reeder–now called “Reader"
full_description = 'Sunday Serial: Reeder, MarsEdit, and Picanha Here’s this week’s list of things to check out: Reeder: Reeder is one of the first RSS readers that came out for iOS, some 15 years ago (according to their website). I remember checking RSS feeds at Wheaton Village while playing and lunching with the boys back in the day. The original Reeder–now called “Reader Classic”– still exists as a one-off purchase, and supports good ‘ole RSS proper. The new Reeder is a different animal; it will certainly import your RSS feeds as an OPML file, as any good RSS client should, but once it’s up and running, it syncs over iCloud (if you need multiple device support) and doesn’t support external RSS sources. This, I dislike, but that’s what Classic is for. In addition to (or instead of) using Reeder as an RSS news reader, though, you can also subscribe to other feeds, including YouTube, Mastodon, and Reddit. It’s a cool all-in-one kind of aggregator. MarsEdit: MarsEdit is really a killer app\<sup>1\</sup> for blogging/bloggers. If you publish to WordPress, as I do here, MarsEdit is the best client out there. There’s nothing other than a Mac version, so that will inform your workflow. But for posting text and pictures to WordPress, MarsEdit can’t be beat. Picanha: The Picanha, or rump cap, is a piece of beef sirloin that has a large cap of fat on the top. I cooked it sous vide at 129 for a few hours and then finished it on the grill. It came out really good. It’s a common cut at Brazilian steakhouses, like the late great Chima in Philly. 1 And I mean that in the oldest sense of the term: it’s a reason to buy a Mac if you publish a lot. September 29, 2024 Alex Nonnemacher'
