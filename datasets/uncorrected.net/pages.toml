description = '''I [mentioned][1] OneNote's Feed and how it had been obscured in OneNote's GUI in favor of the Sticky Notes menu. A helpful Redditor mentioned that you could bring the Feed back by: Searching for the Feed in the the Search bar (alt-Q) Type "feed" in the Search box Right-click on the "Open Feed" item in'''
full_description = "Expose OneNote’s Feed I [mentioned][1] OneNote’s Feed and how it had been obscured in OneNote’s GUI in favor of the Sticky Notes menu. A helpful Redditor mentioned that you could bring the Feed back by: Searching for the Feed in the the Search bar (alt-Q) Type “feed” in the Search box Right-click on the “Open Feed” item in the resulting picklist Choose “Add to Quick Access Toolbar” Voila! The Feed will be in the upper-left hand of the application’s menu. Here’s a quick video I made to illustrate. https://uncorrected.net/wp-content/uploads/2024/07/Screen-Recording-2024-07-29-215349.mp4 July 31, 2024July 30, 2024 Alex Nonnemacher"
