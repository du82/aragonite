["https://uncorrected.net/camden-county-beer-crawl-tonewood-brewing-and-bankbar"]
title = "Camden County Beer Crawl: Tonewood Brewing and Bankbar - Uncorrected"
description = "Rhonda, the boys, and I took to the Expressway to hit up House of Fun (for the boys) while we absconded to Tonewood Brewing's Barrington location for a couple of beers. I had the Trail Beer and Rhonda a Halcyon; we followed those two pints with smaller double-dry-hopped Fuegos, which were excellent. The Fuego is,"
full_description = "Camden County Beer Crawl: Tonewood Brewing and Bankbar Rhonda, the boys, and I took to the Expressway to hit up House of Fun (for the boys) while we absconded to Tonewood Brewing‘s Barrington location for a couple of beers. I had the Trail Beer and Rhonda a Halcyon; we followed those two pints with smaller double-dry-hopped Fuegos, which were excellent. The Fuego is, to me, like Bonesaw’s Swoosh and Glasstown’s 609: consistently good, emblematic of the style, and an easy choice. (I particularly like having a couple of 609s at the Double Eagle with their wings.) Rhonda had been seeing a couple of guys review local bars for their wings and other pub food, and happened upon their review of the Bankbar in Gloucester City. That is only a hop, skip, and a jump away from Barrington, so we hit it up. We shared the loaded chips and their firecracker shrimp, and then Rhonda and I split two orders of wings (six wings per order) with dry rub and SoleDad sauce. Both were great, and they were giant wings. I think they might brine the wings; something in the texture leads me to think so. Aaron got 12 Soledad wings, while Joe got boneless wings. The fries are an afterthough here; they could do better with some fancier fries for sure. Aaaaand Fuego on tap. Bank Bar Fuego Bank Bar SoleDad Sauce Wings Bank Bar Tonewood Double-Dry-Hopped Fuego Loaded Chips April 6, 2024April 7, 2024 Alex Nonnemacher"
