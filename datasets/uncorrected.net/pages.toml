full_description = "Sunday Serial: Bluesky, Happy Scale, and Sharrot Winery Here’s this week’s of things to check out: Bluesky: This Twitter alternative moved from private to public this past week. So far, I like it very much, and a looking forward to native Mac clients. Follow me at @alexnonn.bsky.social Happy Scale: This is a cool app that reads your Apple Health body weight data and presents you with some graphically novel presentations of said data. It’s a subscription but very cheap. Sharrot Winery: Rhonda and I took Thursday off to check out a new (to us) winery in nearby Hammonton, Sharrot Winery. We split a bottle of their excellent rosé, and three plates: a burrata plate, mac and cheese, and a pepperoni flatbread. Everything was great, including the service and atmosphere. Can’t wait to go back. Bluesky Happy Scale Sharrot Winery February 11, 2024 Alex Nonnemacher"
