["https://uncorrected.net/author/alex/page/3"]
title = "Alex Nonnemacher - Uncorrected - Page 3"
description = "By Alex Nonnemacher"
full_description = "Trump’s Tarriffs: Inflation in the Wrong Direction Donald Trump, campaigning for president: “Inflation will vanish completely.” Today, on Marketwatch: Because the U.S. gets the majority of its imported oil from Canada, high tariffs on Canadian imports will “impact all industries directly or industry and trigger inflation pressures, which [are] already a concern for the U.S. economy,” according to a recent Dun & Bradstreet analysis of the potential impact of U.S. tariffs on Canada and Mexico. Only fools believe him. Does the president know how this inflation thing works? This country is a net exporter of petroleum products, meaning we export more than we import. That’s a good thing. Here’s how much gas could cost you if Trump’s threatened tariffs go through February 3, 2025 Alex Nonnemacher Sunday Serial: Sagamore Rye, Brew Ratio, and Tally Here’s this week’s list of things to check out. Last week was a hell of a week! Sagamore Rye Rhonda and I had this rye in Rehoboth Beach one night during a family vacation, and have been keen to get a bottle. She spied a bottle on sale last weekend, and we’ve been enjoying our manhattans with it all week. Sagamore Rye Brew Ratio Brew Ratio is a great coffee nerd app. You adjust your coffee, water, or ratio variables, and Brew Ratio adjusts everything else, to help you make a great cup of Joe. There’s a timer, too. I prefer when my scale has a timer, but my current scale doesn’t, so I’ve been using my Apple Watch when I need to set a timer. Brew Ratio Tally Tally, by Agile Tortoise, is a focused tally tracker by the maker of the essential Drafts. It’s dead simple but immediately useful. Behaviorists take note. Tally February 2, 2025 Alex Nonnemacher Unspoken Expectations are Premeditated Resentments, Even When It Comes to Cocktails and Pork Chops Neil Strauss’s advice–that not voicing expectations will likely yield to resentment–is usually applied to relationships. I take this to mean that, for example, if you don’t ask the kids to take out the trash or bring in the cans, but expect them to do so unbidden, you’re going down a path to resentment. An avoidable path. And hey: dinner and drinks work this way, too. By way of example, Rhonda and I often nip out to a joint around the corner, the Greenview Inn, for dinner and a cocktail. We have, on occasion, gotten a martinis or manhattans that were entirely too dry for our tastes. I make our Martinis at about a 6:1 ratio of gin to vermouth, and manhattans closer to 3:1. Rueing the prospect of slugging down another poorly made cocktail1; for reasons both epicurean and nutritional, I piped up: “Can you make that about 3:1?” The bartender reacted with surprise, remarking, “Oh, really sweet!” “If you say so,” I replied. Manhattans at the Greenview Inn He made them to our specs and they were fantastic. I haven’t consistently adopted this strategy, but I have been trying to when I can. We had another chance last night, while dining at the Savoy (another local favorite, in part due to its proximity to our house). Rhonda had attended a farewell party for a colleague a few days before, and had been served an entirely-too-dry gin martini. I, too, had ordered their pork chop about a month ago, and after being serially treated to succulent chop after chop in our local haunts, the Savoy served me a bone-dry version of the same one night while we were out on a date nite. I wanted to try the pork chop again last night at the Savoy; a number of non-steak options were tempting me, but the glory of a juicy chop on a cold January night? Irresistible. When TJ, our server, came over to ask about ordering dinner, I decided to speak up about my expectations, lest they fester into resentment. I told him that I’d ordered the chop once before, and why it wasn’t to my liking. He said he’d let the chef know how I liked it. The chop arrived, an exemplar of the dish. Savoy Porkchop 1 The popularity of dry vodka martinis–a boring if respectable standard cocktail–has unduly influenced people’s taste for properly balanced drinks. February 1, 2025February 1, 2025 Alex Nonnemacher"
