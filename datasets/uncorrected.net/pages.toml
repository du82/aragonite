["https://uncorrected.net/withings-body-smart"]
title = "Withings Body Smart - Uncorrected"
description = "Last Sunday, inspired largely by interest in how fucking intensely I experience the cold these days, I wanted to know what my body fat percentage was. I looked around a while ago (from the sofa) for where and how to do that, but it appeared to require a drive to Philly or Central Jersey. A"
full_description = "Withings Body Smart Last Sunday, inspired largely by interest in how fucking intensely I experience the cold these days, I wanted to know what my body fat percentage was. I looked around a while ago (from the sofa) for where and how to do that, but it appeared to require a drive to Philly or Central Jersey. A simpler solution emerged in the Withings Body Smart scale, which was on sale on Amazon. I’ve been weighing myself on our old bathroom scale, which works just fine. I manually logged my weight in the Health app on my iPhone. The app shows you the changes over time, and you can vary the scale. It’s been a useful companion. Apple Health App This version of data tracking is anachronistic compared to the rest of my life. With the Apple Watch and iPhone, I can track multiple data points, including workouts, without much, if any, effort on my part. The most analogous task is entering my food data in Foodnoms. With this app, I manually log what I eat, although I have some pre-set items (like Manhattans) that I follow to make logging easy. So! No longer. With the Withings, you sync your scale with the Withings app on your phone. The Withings app collects data from your weigh-ins, but also analyzes data from other sources, too (if you give it permission to access your health data). It has a lot to say about the quality of my sleep, for example, using nothing more than the same data that Apple Health collects. The Body Smart measures your weight, but also reports “body composition” data as well. This apparently disaggregates your fat mass, reported as a percentage, from your muscle mass. It further reports visceral fat, lean mass, and bone mass. So you can see what you’re lugging around each day in your bag of bones. This scale also reports a heart rate, but it’s always higher than what my watch reports, so I don’t trust the number. Maybe I’m excited to be stepping on Darrh Vader’s scale. Withings Body Smart Scale And about the body fat: I’m gonna be cagey. But let’s say I loosened the reigns a bit. January 26, 2025 Alex Nonnemacher"
author = "Alex Nonnemacher"
year_published = 2025
year_updated = 2025
