["https://uncorrected.net/page/3"]
title = "Uncorrected - By Alex Nonnemacher - Page 3"
description = "By Alex Nonnemacher - Page 3"
full_description = "OmniGroup: Omni Roadmap 2024 Ken Case, writing at the OmniGroup Blog: For example, we think there is opportunity to improve the way OmniFocus schedules tasks. Each task currently has two dates related to scheduling. Its due date is the date it should be completed by, while its defer date is the date it becomes available. (In OmniPlan, where tasks are scheduled in much more detail, we would call these the start after and end before constraints.) Both of these dates are important, but they leave an important question unanswered: when do you actually plan to do the task? (What is its “do” date?) Some people end up using (and moving) the due date to schedule their tasks, while others use the defer date. But neither of those fields are truly ideal for scheduling. We think adding a scheduled date would improve the way tasks are scheduled. This is pretty exciting for to-do app nerds. The battle rages on about “do” or start dates in Todoist, and is an often-cited friction point for users of that service. (It looks like they’re working on it.) OmniFocus is better than Todoist, in this regard, but far from perfect. (I maddeningly use flags and defer dates to narrow my focus.) Another level of filtering would help immensely, and would be interesting if the feature is not just another version of a start date. Omni Roadmap 2024 February 4, 2025February 3, 2025 Alex Nonnemacher Alain de Botton, Kintsugi, and the Modern | Wisdom Podcast Alain de Botton of School of Llfe fame was on the Modern | Podcast most recently. In his discussion about “rupture and repair” he mentioned Kintsugi, the craft of repairing broken pottery in a way that honors its original form while celebrating the flaws. Modern | Wisdom #898 – Alain de Botton – How To Fix Your Negative Patterns February 3, 2025 Alex Nonnemacher Wearing a Scarf (Put This On) Great infographic from Put This On: Style & Fashion Drawings: Ways To Wear A Scarf February 3, 2025 Alex Nonnemacher Trump’s Tarriffs: Inflation in the Wrong Direction Donald Trump, campaigning for president: “Inflation will vanish completely.” Today, on Marketwatch: Because the U.S. gets the majority of its imported oil from Canada, high tariffs on Canadian imports will “impact all industries directly or industry and trigger inflation pressures, which [are] already a concern for the U.S. economy,” according to a recent Dun & Bradstreet analysis of the potential impact of U.S. tariffs on Canada and Mexico. Only fools believe him. Does the president know how this inflation thing works? This country is a net exporter of petroleum products, meaning we export more than we import. That’s a good thing. Here’s how much gas could cost you if Trump’s threatened tariffs go through February 3, 2025 Alex Nonnemacher"
