["https://uncorrected.net/page/4"]
title = "Uncorrected - By Alex Nonnemacher - Page 4"
description = "By Alex Nonnemacher - Page 4"
full_description = "Grief is the Natural Way We Honor What Love Misses Connor Beaton on the Modern | Wisdom Podcast: Grief is the Natural Way We Honor What Love Misses There’s much more to this episode, including the connection between grief and success. Worth a listen. Modern Wisdom #890 – Connor Beaton – A Man’s Guide To Feeling Your Feelings January 16, 2025 Alex Nonnemacher YoUDee Whatever it is that doesn’t jibe with your brain when you read CamelCase? This is a mind-bender. January 15, 2025 Alex Nonnemacher Email Yourself Articles to Feedbin I noticed that I got a copy of Steven Sinofsky’s latest Hardcore Software Substack post in my inbox, and realized that I hadn’t moved it over to Feedbin. After doing this, I wondered: could I just email myself something at my Feedbin newsletter email address and have it show up in my feed? Lo and behold, you can indeed. I’m not sure how much I’ll use this, but it’s a cool feature. A didn’t see that it was documented, but I guess the mechanism is the same. January 14, 2025 Alex Nonnemacher Unschedule Just for Practice I made an unschedule for today just to build the habit. I should have made one for tomorrow but bed calls. January 13, 2025 Alex Nonnemacher University of Delaware and a Hot Pot Deflowering I took Aaron to the University of Delaware today for a tour. It was cold and still empty from the break. It was my second visit; I took Joe a couple of years ago. I don’t remember college tours being so cold. I do remember enjoying them though. We followed up with some hot pot at Kungfu Hot Pot. It was the lunch special and there were two kinds of broth (we settled on spicy sichuan and beef broths. I told the guy, “first time.” He was patient.) We also ordered some kind of spicy Korean beef, pork belly, another kind of beef, and something else. There was an adjoining room with all kinds of grizzly bits and tripe and noodles and fish cakes and there’s too much to mention. Oh veggies too. And sauces. All kinds of sauces. Hot Pot Table I had no idea what was going on, save for the idea that things should be dunked in the roiling broth before us. Hot Pot Add Ins We tucked in hard. Hot Pot Broth As I write this, the joint is still open. What sort of boozehoundery must ensue at this late hour? I got a pound of coffee, too. January 13, 2025 Alex Nonnemacher"
