["https://underscorejs.org"]
title = "Underscore.js"
full_description = "Underscore is a JavaScript library that provides a whole mess of useful functional programming helpers without extending any built-in objects. It’s the answer to the question: “If I sit down in front of a blank HTML page, and want to start being productive immediately, what do I need?” … and the tie to go along with jQuery's tux and Backbone's suspenders. Underscore provides over 100 functions that support both your favorite workaday functional helpers: map, filter, invoke — as well as more specialized goodies: function binding, javascript templating, creating quick indexes, deep equality testing, and so on. You may also read through the annotated source code. There is a modular version with clickable import references as well. You may choose between monolithic and modular imports. There is a quick summary of the options below, as well as a more comprehensive discussion in the article. The project is hosted on GitHub. You can report bugs and discuss features on the issues page or chat in the Gitter channel. You can support the project by donating on Patreon. Enterprise coverage is available as part of the Tidelift Subscription. In most cases, you can replace the version number above by latest so that your embed will automatically use the latest version, or stable if you want to delay updating until an update has proven to be free of accidental breaking changes. Example: https://cdn.jsdelivr.net/npm/underscore@latest/underscore-umd-min.js If you are hardcoding the path to the file within the package and you are unsure which build to use, it is very likely that you need underscore-umd.js or the minified variant underscore-umd-min.js. For functions with multiple aliases, the file name of the module is always the first name that appears in the documentation. For example, _.reduce/_.inject/_.foldl is exported from underscore/modules/reduce.js. Modular usage is mostly recommended for creating a customized build of Underscore. Underscore 1.x is backwards compatible with any engine that fully supports ES3, while also utilizing newer features when available, such as Object.keys, typed arrays and ES modules. We routinely run our unittests against the JavaScript engines listed below:"
