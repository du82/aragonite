["https://undraw.co/blog/shareboost-co-is-now-live-domains"]
title = "The new ShareBoost | unDraw Blog"
description = "Revisited an old project to make idle domains functional for free. Read to learn more if you are interested in ranking higher early."
full_description = "November 19, 2024The new ShareBoostAggelos Gesoulis,Software engineer, product @unDrawIf there is one other product that is connected to unDraw, that is ShareBoost . That's what I was working on in 2017 when unDraw launched. A website creation platform to create beautiful coming soon pages for upcoming products or sites. So when we were even brainstorming unDraw with Katerina, excited about sharing her work, she created a coming soon page with ShareBoost. Of course, it became the most successful launch using Shareboost, with more than a thousand people interested enough to subscribe. However, with unDraw taking off and for a few other reasons, ShareBoost faded out of my focus and I shut it down a year or so afterwards. Reboot With several other projects down the line, the need for ShareBoost kept coming back. But this time the focus is on getting ranked on search engines. To have your project show up in the first few results when someone searches for it, even a day after launching it. Also you get a place to see what you set out to create when you bought the domain. And a place to share that is minimal but real, instead of just an idea. These are the problems this new version is solving. And not focusing on vanity metrics or getting emails (at least for now). Product This is truly a minimum viable version but that doesn't mean it does not work great. It serves a super fast and SEO friendly small site. It gets indexed by Google and the other search engines. Even from A.I. crawlers. But it's minimal in the sense that it focuses only on what is absolutely necessary for now. It has no payments (it's free). You can add up to 3 domains and check their status. You can add your own copy and optionally a link for your visitors. You can even customize the color a bit. But that's it for now. I'll be adding more features as they become necessary for me or anyone who uses ShareBoost and hopefully it'll be even more awesome. If you want to use it, just visit ShareBoost and add your domains. There is a feedback widget on top, so feel free to also reach out with any comment you may have or just to say hi. Thank you for reading this and hope you'll like it."
author = "Aggelos Gesoulis"
year_published = 2024
