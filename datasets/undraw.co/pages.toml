["https://undraw.co/blog/undraw-and-adobe-express-m8523"]
title = "unDraw for Adobe Express | unDraw Blog"
description = "We partnered with Adobe to bring unDraw to the new Express. Learn more about the artwork and how to use the new add-on."
full_description = "May 8, 2023unDraw for Adobe ExpressKaterina Limpitsouni,Illustrator, creator of unDrawunDraw Silhouettes for Adobe Express is here and is a little different than the classic collection. Aimed for graphics and posters it contains a new style of artwork that will enable you to create awesome designs. Here's a quick look on its unique features and how you can use it. After you browse or search and find the image you want to use you can either click or drag and drop the image directly in your canvas. Basically that's all you need to do. But I forgot to mention the cool part! You can customize the color before you import and get the artwork to fully match your design and brand. To do that, just click on the button next to search and, depending on your browser, you will get a nice little native interface that will change the artwork color live, so you can sample it before using it. Even the background will adjust to your selection to a light/dark mode to make it better visible. You can, of course, search by relative terms to find specific images and it goes without saying that this add-on is governed the open license of unDraw, so no cost or need for attribution for you! Looking forward to seeing what amazing designs you'll create and hope you'll enjoy both Adobe Express and the new unDraw add-on!"
