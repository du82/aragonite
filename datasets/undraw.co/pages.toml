["https://undraw.co/blog/undraw-v1-now-live-57car"]
title = "unDraw+ v1 is now live | unDraw Blog"
description = "It's been a while since we posted an update but today is the day! Version 1 of unDraw+ is live after being in the works for quite some time."
full_description = "January 27, 2023unDraw+ v1 is now liveKaterina LimpitsouniAggelos GesoulisIt's been a while since we posted an update but today is the day! The v1 of unDraw+ is live after being in the works for quite some time. Not only a complete redesign but a major update for how everything works. The goal is not to simply enable everyone who wants to support unDraw. It’s to create something really useful that adds to the value of the open-source illustrations. So, now on unDraw+ you can find the icons collection new and improved. You'll also be able to generate covers for your content with iconography and color customization. The photo tools have also been rebuilt from the ground up, with the Auto-Edit now showing the improved version compared with the uploaded image, the Duotone tool is much faster with better results and we've also added the new Color Blend tool to edit images to match your brand tone. The biggest change however, is the new Social Cards tool that replaces the Text covers and offers so many new possibilities. Multiple starting points, more copy options to suit your content, precision palette customization and the ability to add logos/images. It also comes with expanded language support for Japanese, Hindu and many more languages. This brings unDraw+ to a stable version and the foundation to build and release new features like saving your own colors and more new tools. It also is now ready for the most exciting step of unDraw. So I’m really happy to be able to say that the new illustrations, which are the future of unDraw, will be available for supporters starting next week. Beautiful elements, new style and ready for more use cases! But that's a story for another time. Hope all of you who supported unDraw will enjoy the new version of unDraw+. If you haven't been able to join up to now, this is the last week that the price is reduced and non-recurring. Either way thank you for reading, for being a part of unDraw and/or unDraw+ and for celebrating this milestone with us!"
author = "Katerina Limpitsouni"
