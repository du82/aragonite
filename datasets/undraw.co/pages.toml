full_description = "For the amazing people in this community that provide support and motivation for unDraw throughout all these years. I just came across @unDraw_co in a UI/UX storyboarding course. Unbelievable, thank you so much @NinaLimpi ! I'm a developer not an artist, so this is my new essential Adobe XD plugin. Thanks @NinaLimpi for making an awesome resource in @unDraw_co . I've used your open sourve illustrations in some of my reports and presentations, including a copyright tag where appropriate so other people can find you. Keep up the good work! Wow! This is an awesome collection of free open-source illustrations in SVG and PNG formats for any type of project! A fantastic and beautiful resource of high quality vector drawings/graphics. Perfect for presentations and many others things - way to go! Thank you so much @unDraw_co @NinaLimpi https://t.co/g9cAryStNG @NinaLimpi I can't thank you enough for https://t.co/mZpKPg5JN0 😍 Amazing tool! #Webdesign #web #FrontEnd #illustratio @NinaLimpi Just someone saying thank you for the awesome works you have created. They just make the site very catch. A gem I discovered today https://t.co/HcM3gLjMLB. Big thanks to the folks doing great work @unDraw_co y'all are a blessing!� When I first discovered @NinaLimpi's @unDraw_co, I couldn't believe my eyes and my wild imagination's Juggernaut stopped for a while! So many jaw-dropping, heart-stopping drawings in one place for one person @NinaLimpi. And anyone can use them for free! Using @unDraw_co illustrations for class materials is a win-win; they look absolutely great, and they're open-source. Color customization is the icing on the cake. #edtech https://t.co/PzfhObQrKD Just wanted to express my appreciation for @unDraw_co: thank you for making my crappy prototypes 1000 times better I'm just going to share my love for @unDraw_co and acknowledge and spread the good word. If you are looking for some cool illustrations for your project, be sure to check it out via https://t.co/Pk1u79a0lL."
