title = "Source Code | ungoogled-chromium"
description = "Google Chromium, sans integration with Google"
full_description = "Source Code The main ungoogled-chromium repository only contains the common code for all platforms; it does not contain all the configuration and scripts necessary to build ungoogled-chromium. Most users will want to use platform-specific repos, where all the remaining configuration and scripts are provided for specific platforms: Find the repo for a specific platform here. If you wish to include ungoogled-chromium code in your own build process, consider using the tags of the main repo. These tags follow the format {chromium_version}-{revision} where chromium_version is the version of Chromium used in x.x.x.x format, and revision is a number indicating the version of ungoogled-chromium for the corresponding Chromium version. Additionally, most platform-specific repos extend their tag scheme upon this one. Building the source code: See docs/building.md"
