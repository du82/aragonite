["https://unifiedfontobject.org/versions/ufo2/fontinfo.plist"]
title = "fontinfo.plist"
description = """
key  type  description
  
    familyName  string  Family name.  styleName  string  Style name.  styleMapFamilyName  string  Family name used for bold, italic and bold italic style mapping.  styleMapStyleName  string  Style map style. The possible values are regular, italic, bold and bold italic. These are case sensitive.  versionMajor  integer  Major version.  versionMinor  integer  Minor version.  year  integer  The year the font was created. This attribute is deprecated as of version 2. It’s presence should not be relied upon by applications. However, it may occur in a font’s info so applications should preserve it if present."""
full_description = "fontinfo.plist File Format XML Property List This file contains information about the font itself, such as naming and dimensions. This file is optional. Not all values are required for a proper file. Changes from UFO 1 The key value pairs in the property list were modified and significantly expanded for UFO 2. The design of the structure follows these rules: All keys should be tagged for the format and/or table that they represent. For example, openTypeHheaAscender. If data can be used for more than one format and/or table, it is considered generic and the format specific tag is removed. For example, familyName. In several cases, data moved to generic keys can be used in a controlled, slightly altered form for format specific fields. In these cases, information about how this can be done is provided. These are merely suggestions for the sake of clarity. Compiler developers are free to interpret these as they wish. Specification Generic Identification Information key type description familyName string Family name. styleName string Style name. styleMapFamilyName string Family name used for bold, italic and bold italic style mapping. styleMapStyleName string Style map style. The possible values are regular, italic, bold and bold italic. These are case sensitive. versionMajor integer Major version. versionMinor integer Minor version. year integer The year the font was created. This attribute is deprecated as of version 2. It’s presence should not be relied upon by applications. However, it may occur in a font’s info so applications should preserve it if present. Generic Legal Information key type description copyright string Copyright statement. trademark string Trademark statement. Generic Dimension Information key type description unitsPerEm integer or float Units per em. descender integer or float Descender value. xHeight integer or float x-height value. capHeight integer or float Cap height value. ascender integer or float Ascender value. italicAngle float Italic angle. Generic Miscellaneous Information key type description note string Arbitrary note about the font. OpenType head Table Fields key type description openTypeHeadCreated string Creation date. Expressed as a string of the format “YYYY/MM/DD HH:MM:SS”. “YYYY/MM/DD” is year/month/day. The month should be in the range 1-12 and the day should be in the range 1-end of month. “HH:MM:SS” is hour:minute:second. The hour should be in the range 0:23. The minute and second should each be in the range 0-59. openTypeHeadLowestRecPPEM integer or float Smallest readable size in pixels. Corresponds to the OpenType head table lowestRecPPEM field. openTypeHeadFlags number list A list of bit numbers indicating the flags. The bit numbers are listed in the OpenType head specification. Corresponds to the OpenType head table flags field. Notes The OpenType head table specification. fontRevision can be derived from the generic versionMajor and versionMinor attributes. checkSumAdjustment should be calculated by the compiler. magicNumber should be set by the compiler. unitsPerEm is found at the generic unitsPerEm attribute. created can be calculated by subtracting the 12:00 midnight, January 1, 1904 (as specified in the head table documentation) from the date stored at openTypeHeadCreated. modified should be set by the compiler. xMin, yMin, xMax and yMax should be calculated by the compiler. macStyle can be derived from the generic styleMapStyleName attribute. indexToLocFormat should be set by the compiler. glyphDataFormat should be set by the compiler. OpenType hhea Table Fields key type description openTypeHheaAscender integer or float Ascender value. Corresponds to the OpenType hhea table Ascender field. openTypeHheaDescender integer or float Descender value. Corresponds to the OpenType hhea table Descender field. openTypeHheaLineGap integer or float Line gap value. Corresponds to the OpenType hhea table LineGap field. openTypeHheaCaretSlopeRise integer Caret slope rise value. Corresponds to the OpenType hhea table caretSlopeRise field. openTypeHheaCaretSlopeRun integer Caret slope run value. Corresponds to the OpenType hhea table caretSlopeRun field. openTypeHheaCaretOffset integer or float Caret offset value. Corresponds to the OpenType hhea table caretOffset field. Notes The OpenType hhea table specification advanceWidthMax should be calculated by the compiler. minLeftSideBearing should be calculated by the compiler. minRightSideBearing should be calculated by the compiler. xMaxExtent should be calculated by the compiler. metricDataFormat should be set by the compiler. numberOfHMetrics should be calculated by the compiler. OpenType Name Table Fields key type description openTypeNameDesigner string Designer name. Corresponds to the OpenType name table name ID 9. openTypeNameDesignerURL string URL for the designer. Corresponds to the OpenType name table name ID 12. openTypeNameManufacturer string Manufacturer name. Corresponds to the OpenType name table name ID 8. openTypeNameManufacturerURL string Manufacturer URL. Corresponds to the OpenType name table name ID 11. openTypeNameLicense string License text. Corresponds to the OpenType name table name ID 13. openTypeNameLicenseURL string URL for the license. Corresponds to the OpenType name table name ID 14. openTypeNameVersion string Version string. Corresponds to the OpenType name table name ID 5. openTypeNameUniqueID string Unique ID string. Corresponds to the OpenType name table name ID 3. openTypeNameDescription string Description of the font. Corresponds to the OpenType name table name ID 10. openTypeNamePreferredFamilyName string Preferred family name. Corresponds to the OpenType name table name ID 16. openTypeNamePreferredSubfamilyName string Preferred subfamily name. Corresponds to the OpenType name table name ID 17. openTypeNameCompatibleFullName string Compatible full name. Corresponds to the OpenType name table name ID 18. openTypeNameSampleText string Sample text. Corresponds to the OpenType name table name ID 20. openTypeNameWWSFamilyName string WWS family name. Corresponds to the OpenType name table name ID 21. openTypeNameWWSSubfamilyName string WWS Subfamily name. Corresponds to the OpenType name table name ID 22. Notes The OpenType name table specification. Name ID 0 (copyright) is found at the generic copyright attribute. Name ID 1 (font family name) is found at the generic styleMapFamilyName attribute. Name ID 2 (font subfamily name) can be interpreted from the generic styleMapStyleName attribute. Name ID 4 (full font name) can be created from the generic styleMapFamilyName and styleMapStyleName attributes following the rules defined in the specification. Name ID 6 (Postscript name) can be found at postscriptFontName. This should follow the rules defined in the specification. Name ID 7 (trademark) is found at the generic trademark attribute. To reiterate the point stated above, these notes are merely provided for clarity. Compilers can and should follow their own recipes for creating the name table. These notes make no considerations for platform specific variations in or application specific limitations on the strings. OpenType OS/2 Table Fields key type description openTypeOS2WidthClass integer Width class value. Must be in the range 1-9. Corresponds to the OpenType OS/2 table usWidthClass field. openTypeOS2WeightClass integer Weight class value. Must be a positive integer. Corresponds to the OpenType OS/2 table usWeightClass field. openTypeOS2Selection number list A list of bit numbers indicating the bits that should be set in fsSelection. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table selection field. Note: Bits 0 (italic), 5 (bold) and 6 (regular) should not be set here. These bits should be taken from the generic styleMapStyleName attribute. openTypeOS2VendorID string Four character identifier for the creator of the font. Corresponds to the OpenType OS/2 table achVendID field. openTypeOS2Panose number list The list should contain 10 integers that represent the setting for each category in the Panose specification. The integers correspond with the option numbers in each of the Panose categories. This corresponds to the OpenType OS/2 table Panose field. openTypeOS2FamilyClass number list Two integers representing the IBM font class and font subclass of the font. The first number, representing the class ID, should be in the range 0-14. The second number, representing the subclass, should be in the range 0-15. The numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table sFamilyClass field. openTypeOS2UnicodeRanges number list A list of bit numbers that are supported Unicode ranges in the font. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3 and ulUnicodeRange4 fields. openTypeOS2CodePageRanges number list A list of bit numbers that are supported code page ranges in the font. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table ulCodePageRange1 and ulCodePageRange2 fields. openTypeOS2TypoAscender integer or float Ascender value. Corresponds to the OpenType OS/2 table sTypoAscender field. openTypeOS2TypoDescender integer or float Descender value. Corresponds to the OpenType OS/2 table sTypoDescender field. openTypeOS2TypoLineGap integer or float Line gap value. Corresponds to the OpenType OS/2 table sTypoLineGap field. openTypeOS2WinAscent integer or float Ascender value. Corresponds to the OpenType OS/2 table usWinAscent field. openTypeOS2WinDescent integer or float Descender value. Corresponds to the OpenType OS/2 table usWinDescent field. openTypeOS2Type number list A list of bit numbers indicating the embedding type. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table fsType field. openTypeOS2SubscriptXSize integer or float Subscript horizontal font size. Corresponds to the OpenType OS/2 table ySubscriptXSize field. openTypeOS2SubscriptYSize integer or float Subscript vertical font size. Corresponds to the OpenType OS/2 table ySubscriptYSize field. openTypeOS2SubscriptXOffset integer or float Subscript x offset. Corresponds to the OpenType OS/2 table ySubscriptXOffset field. openTypeOS2SubscriptYOffset integer or float Subscript y offset. Corresponds to the OpenType OS/2 table ySubscriptYOffset field. openTypeOS2SuperscriptXSize integer or float Superscript horizontal font size. Corresponds to the OpenType OS/2 table ySuperscriptXSize field. openTypeOS2SuperscriptYSize integer or float Superscript vertical font size. Corresponds to the OpenType OS/2 table ySuperscriptYSize field. openTypeOS2SuperscriptXOffset integer or float Superscript x offset. Corresponds to the OpenType OS/2 table ySuperscriptXOffset field. openTypeOS2SuperscriptYOffset integer or float Superscript y offset. Corresponds to the OpenType OS/2 table ySuperscriptYOffset field. openTypeOS2StrikeoutSize integer or float Strikeout size. Corresponds to the OpenType OS/2 table yStrikeoutSize field. openTypeOS2StrikeoutPosition integer or float Strikeout position. Corresponds to the OpenType OS/2 table yStrikeoutPosition field. Notes The OpenType OS/2 table specification. The Panose specification. xAvgCharWidth should be calculated by the compiler. sFamilyClass is not supported. fsSelection can be derived from the generic styleMapStyleName attribute. (See question below.) usFirstCharIndex should be calculated by the compiler. usLastCharIndex should be calculated by the compiler. sxHeight is found at the generic xHeight attribute. sCapHeight is found at the generic capHeight attribute. usDefaultChar should be calculated by the compiler. OpenType fonts are required to have a .notdef character for fallback. usBreakChar should be calculated by the compiler. usMaxContext should be calculated by the compiler. OpenType vhea Table Fields key type description openTypeVheaVertTypoAscender integer or float Ascender value. Corresponds to the OpenType vhea table vertTypoAscender field. openTypeVheaVertTypoDescender integer or float Descender value. Corresponds to the OpenType vhea table vertTypoDescender field. openTypeVheaVertTypoLineGap integer or float Line gap value. Corresponds to the OpenType vhea table vertTypoLineGap field. openTypeVheaCaretSlopeRise integer Caret slope rise value. Corresponds to the OpenType vhea table caretSlopeRise field. openTypeVheaCaretSlopeRun integer Caret slope run value. Corresponds to the OpenType vhea table caretSlopeRun field. openTypeVheaCaretOffset integer or float Caret offset value. Corresponds to the OpenType vhea table caretOffset field. Notes The OpenType vhea table specification advanceHeightMax should be calculated by the compiler. minTopSideBearing should be calculated by the compiler. minBottomSideBearing should be calculated by the compiler. yMaxExtent should be calculated by the compiler. metricDataFormat should be set by the compiler. numberOfHMetrics should be calculated by the compiler. PostScript Specific Data key type description postscriptFontName string Name to be used for the FontName field in Type 1/CFF table. postscriptFullName string Name to be used for the FullName field in Type 1/CFF table. postscriptSlantAngle float Artificial slant angle. postscriptUniqueID integer A unique ID number as defined in the Type 1/CFF specification. postscriptUnderlineThickness integer or float Underline thickness value. Corresponds to the Type 1/CFF/post table UnderlineThickness field. postscriptUnderlinePosition integer or float Underline position value. Corresponds to the Type 1/CFF/post table UnderlinePosition field. postscriptIsFixedPitch boolean Indicates if the font is monospaced. A compiler could calculate this automatically, but the designer may wish to override this setting. This corresponds to the Type 1/CFF isFixedPitched field postscriptBlueValues number list A list of up to 14 integers or floats specifying the values that should be in the Type 1/CFF BlueValues field. This list must contain an even number of integers following the rules defined in the Type 1/CFF specification. postscriptOtherBlues number list A list of up to 10 integers or floats specifying the values that should be in the Type 1/CFF OtherBlues field. This list must contain an even number of integers following the rules defined in the Type 1/CFF specification. postscriptFamilyBlues number list A list of up to 14 integers or floats specifying the values that should be in the Type 1/CFF FamilyBlues field. This list must contain an even number of integers following the rules defined in the Type 1/CFF specification. postscriptFamilyOtherBlues number list A list of up to 10 integers or floats specifying the values that should be in the Type 1/CFF FamilyOtherBlues field. This list must contain an even number of integers following the rules define"
