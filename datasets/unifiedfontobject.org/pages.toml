e a plain text file.” lib.plist Added a mechanism for standardizing lib keys. Added a standard place for glyph order storage. layercontents.plist This is a new file. glyphs More than one glyphs directory is allowed. Each directory is a layer. glyphs/contents.plist The sample glyph name to file name algorithm was moved to the conventions page and it was abstracted and expanded to be more robust. Information about the allowed characters in glyph names was added. The information about the file name being stored in the property list was slightly updated to be more verbose. glyphs/layerinfo.plist This is a new file. glyphs/GLIF The version number was increased to 2. Contour A new identifier attribute was added. Component A new identifier attribute was added. A new rule explaining how components relate to layers was added. Point A new identifier attribute was added. Removed references to Super Bezier. Image A new image element was added. Guideline A new guideline element was added. Anchor A new anchor element was added. Lib Added a mechanism for standardizing lib keys. Added a standard place for glyph mark color storage. images The images directory was added. data The data directory was added. Important corrections Guideline The guideline’s angle attribute was changed from being measured in the clockwise direction to the counter-clockwise direction."
