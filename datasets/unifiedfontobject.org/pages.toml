full_description = "UFO 3 A UFO is a directory or zip representing font data with one or more glyph layers. Terminology The terms “must”, “must not”, “required”, “shall”, “shall not”, “should”, “should not”, “recommended”, “may”, and “optional” used throughout this specification conform to RFC 2119. The term “authoring tool” is used throughout this specification to refer to tools that read and write UFOs. Authoring tools may take many forms: A font editor that uses UFO as its native file format. A tool that allows for importing data from or exporting data to a UFO. A programming library for reading or writing UFO data. A script for modifying a UFO. This list is not exclusive. Storage Formats UFO has two possible storage formats. The first, “UFO Package”, is a multi-file, file system directory structure. The second, “UFO ZIP”, is a ZIP archive containing the same directory structure as defined for UFO Package. A UFO ZIP must be a ZIP archive that follows these specifications: ZIP64 format is allowed, but not required. File names must be encoded to UTF-8. All contents of the UFO must be contained within a single directory. For example, rootdirectory/metainfo.plist and rootdirectory/kerning.plist. The name of this directory will be arbitrary and no assumptions should be made about it’s name. The file may or may not be compressed. The file must not be encrypted. File Name Extensions .ufo UFO Package .ufoz UFO ZIP Directory Structure UFO 3 follows this file structure: *.ufo metainfo.plist fontinfo.plist groups.plist kerning.plist lib.plist layercontents.plist glyphs contents.plist layerinfo.plist *.glif images *.png data Each of the files and directories have unique meanings, purposes and data structures: metainfo.plist Format version, creator, etc. fontinfo.plist Various font info data. groups.plist Glyph group definitions. kerning.plist Kerning data. features.fea OpenType feature definitions. lib.plist Arbitrary custom data. layercontents.plist Glyphs directory name to