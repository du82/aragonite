["https://unifiedfontobject.org/versions/ufo3/glyphs/glif"]
title = "Glyph Interchange Format"
description = """
name  description
  
    name  The name of the glyph. It must be at least one character long. There is no maximum name length. Names must not contain control characters. Different font specifications, such as OpenType, often have their own glyph name restrictions. Authoring tools should not make assumptions about the validity of a glyph’s name for a particular font specification.  format  The major format version. 2 for this version.  formatMinor  The minor format version. Optional if the minor version is 0, must be present if the minor version is not 0."""
full_description = 'Glyph Interchange Format File Format XML The Glyph Interchange Format (GLIF) is a simple and clear XML representation of a single glyph. GLIF files typically have a .glif extension. The GLIF data follows this structure: glyph advance unicode note image guideline anchor outline contour point component lib Specification In all elements, where an attribute has a defined default value the attribute is optional unless otherwise stated. If the attribute is not defined, the value for the attribute is implicitly the default value. glyph: The top level element. Attributes name description name The name of the glyph. It must be at least one character long. There is no maximum name length. Names must not contain control characters. Different font specifications, such as OpenType, often have their own glyph name restrictions. Authoring tools should not make assumptions about the validity of a glyph’s name for a particular font specification. format The major format version. 2 for this version. formatMinor The minor format version. Optional if the minor version is 0, must be present if the minor version is not 0. The name attribute has limited uses in this version. The contents.plist file maps glyph names to file names, and one of the reasons to do this is to avoid having to parse all files just to get at a list of available glyph names. When reading GLIF files, the name attribute should be ignored, since manual editing may have caused a mismatch with the glyph name as stored in contents.plist, as well as with the file name, which is an algorithmic transformation of the glyph name. This attribute may become more useful in future versions of GLIF. Child Elements name description advance May occur at most once. unicode May occur any number of times. note May occur at most once. image May occur at most once. guideline May occur any number of times. anchor May occur any number of times. outline May occur at most once. lib May occur at most once. advance: Horizontal and vertical metrics. Attributes name type description default width integer or float The advance width. Optional if height is defined. 0 height integer or float The vertical advance. Optional if width is defined. 0 This element has no child elements. Example <advance width="400" /> unicode: Unicode code point. Attributes name type description hex string A unicode code point as a hexadecimal number. The string is case-insensitive and must contain the hex value without a prefix. This element has no child elements. The first occurrence of this element defines the primary Unicode value for this glyph. Unicode values should not be repeated for a glyph. Example <unicode hex="0041" /> image: An image reference. This optional element represents an image element in a glyph. It may occur at most once. The image should always be considered to be behind the outline element. Attributes name type description default fileName string The image file name, including any file extension, not an absolute or relative path in the file system. None xScale integer or float See below. 1 xyScale integer or float See below. 0 yxScale integer or float See below. 0 yScale integer or float See below. 1 xOffset integer or float See below. 0 yOffset integer or float See below. 0 color string The color that should be applied to the image. The format follows the color definition standard. This attribute is optional. no color xScale, xyScale, yxScale, yScale, xOffset, yOffset taken together in that order form an Affine transformation matrix, to be used to transform the image. The default matrix is [1 0 0 1 0 0], the identity transformation. One image width unit equals one horizontal font unit and one image height unit equals one vertical font unit before xScale, xyScale, yxScale, yScale, xOffset, yOffset are applied. This element has no child elements. Format All images must be in Portable Network Graphics (PNG) format. Coloring Images There are two places that the color for an image can be defined: the color attribute of the image element and the color defined in layerinfo.plist. The color defined in the image element’s color attribute always takes precedence. If that is not defined and the color is defined for the layer, the layer’s color should be used. If both of these are undefined, the image’s colors, without modification, should be used unless an authoring tool has a default color for images. If a color is to be applied, the authoring tool should convert the image to grayscale and then apply the color. This modified version of the image must not be saved into the images directory. Example <image fileName="Sketch 1.png" xOffset="100" yOffset="200" xScale=".75" yScale=".75" color="1,0,0,.5" /> guideline: A reference guideline. This element may occur any number of times. Attributes name type description default x integer or float The ‘x’ coordinate. Optional if y is provided and angle is not provided. See below for details. None y integer or float The ‘y’ coordinate. Optional if x is provided and angle is not provided. See below for details. None angle integer or float The angle of the guideline. This must be an angle between 0 and 360 degrees in a counter-clockwise direction from the horizontal. If x or y are not specified, angle must not be specified. See below for details. None name string An arbitrary name for the guideline. This attribute is optional. It must be at least one character long. There is no maximum name length. A name must not contain control characters. no name color string The color that should be applied to the guideline. The format follows the color definition standard. This attribute is optional. no color identifier string Unique identifier for the guideline. This attribute is not required and should only be added to guidelines as needed. However, once an identifier has been assigned to a guideline it must not be unnecessarily removed or changed. Identifiers may be changed in incoming guidelines during editing operations such as “paste,” but they should be maintained unless a duplicate identifier will be created. The identifier value must be unique within all identifiers (including identifiers for elements other than guidelines) in the glyph that the guideline belongs to but it is not required to be unique among the identifiers assigned in other glyphs or in fontinfo.plist. The identifier specification is detailed in the conventions. no identifier The guideline extends along angle to infinity in both directions out of the point defined by x and y. If y and angle are omitted, the element represents a vertical guideline. If x and angle are omitted, the element represents a horizontal guideline. This element has no child elements. anchor: A reference position. This element may occur any number of times. Attributes name type description default x integer or float The ‘x’ coordinate. None y integer or float The ‘y’ coordinate. None name string An arbitrary name for the anchor. This attribute is optional. It must be at least one character long. There is no maximum name length. A name must not contain control characters. no name color string The color that should be applied to the anchor. The format follows the color definition standard. This attribute is optional. no color identifier string Unique identifier for the anchor. This attribute is not required and should only be added to anchors as needed. However, once an identifier has been assigned to an anchor it must not be unnecessarily removed or changed. Identifiers may be changed in incoming anchors during editing operations such as “paste,” but they should be maintained unless a duplicate identifier will be created. The identifier value must be unique within all identifiers (including identifiers for elements other than anchors) in the glyph that the anchor belongs to but it is not required to be unique among the identifiers assigned in other glyphs or in fontinfo.plist. The identifier specification is detailed in the conventions. no identifier This element has no child elements. Anchor naming conventions The following are agreed upon standard naming conventions for special uses of the name attribute. Ligature Carets Anchors with a name starting with caret_ or vcaret_ indicate horizontal or vertical caret positions for ligature glyphs. Example usage would be to compile the OpenType GDEF Ligature Caret List table. Anchor names starting with caret_ provide the x value for a ligature caret position, and the y value is ignored. Likewise, anchor names starting with vcaret_ provide the y value for a ligature caret position, and the x value is ignored. Both names may be followed arbitrary text (caret_1, caret_blah, etc) for designers or applications to have unique caret position names. There must be exactly N-1 caret positions for N ligature components. Converting implied anchors in GLIF 1 to GLIF 2 anchor elements In GLIF 1 there was no official anchor element. Anchors were unofficially but widely supported through the use of a contour containing only one “move” point. For example: <contour> <point x="250" y="650" type="move" name="top"/> </contour> Authoring tools may convert instances of contours like this to anchor elements when converting GLIF 1 to GLIF 2. The required x and y and optional name attributes directly map to the same attributes of the anchor element. outline: Outline description. Note that this element contains descriptions of graphical data. Therefore, an empty outline element is semantically equivalent to the element not existing in the first place. an empty contour element is semantically equivalent to the element not existing in the first place. This element has no attributes. Child Elements name description component May occur any number of times. contour May occur any number of times. component: Insert another glyph as part of the outline. Attributes name type description default base string Name of the base glyph None xScale integer or float See below. 1 xyScale integer or float See below. 0 yxScale integer or float See below. 0 yScale integer or float See below. 1 xOffset integer or float See below. 0 yOffset integer or float See below. 0 identifier string Unique identifier for the component. This attribute is not required and should only be added to components as needed. However, once an identifier has been assigned to a component it must not be unnecessarily removed or changed. Identifiers may be changed in incoming components during editing operations such as “paste,” but they should be maintained unless a duplicate identifier will be created. The identifier value must be unique within all identifiers (including identifiers for elements other than components) in the glyph that the component belongs to but it is not required to be unique among the identifiers assigned in other glyphs, in any layerinfo.plist or in fontinfo.plist. The identifier specification is detailed in the conventions. no identifier xScale, xyScale, yxScale, yScale, xOffset, yOffset taken together in that order form an Affine transformation matrix, to be used to transform the base glyph. The default matrix is [1 0 0 1 0 0], the identity transformation. The base glyph referenced by a component may contain components. The base glyph must not create a circular reference to the glyph that contains the component. Components must only reference glyphs within the same layer that the component belongs to. This element has no child elements. Example <component base="A" xOffset="100" /> contour: Contour description. Attributes name type description default identifier string Unique identifier for the contour. This attribute is not required and should only be added to contours as needed. However, once an identifier has been assigned to a contour it must not be unnecessarily removed or changed. Identifiers may be changed in incoming contours during editing operations such as “paste” and component decomposition, but they should be maintained unless a duplicate identifier will be created. Identifiers should also be retained when possible during outline manipulation operations such as path direction changes and remove overlap. The identifier value must be unique within all identifiers (including identifiers for elements other than contours) in the glyph that the contour belongs to but it is not required to be unique among the identifiers assigned in other glyphs, in any layerinfo.plist or in fontinfo.plist. The identifier specification is detailed in the conventions. no identifier Child Elements name description point May occur any number of times. There is no requirement that a contour contain an on-curve point. If a contour contains only off-curve points the contour must be treated as a quadratic curve. point: An attributed coordinate pair. Attributes name type description default x integer or float The ‘x’ coordinate. None y integer or float The ‘y’ coordinate. None type string The point and/or segment type. The options are detailed below. offcurve smooth string This attribute must only be given when type indicates the point is on-curve. When set to yes, it signifies that a smooth curvature should be maintained at this point, either as a curve point or a tangent point in Fontographer terms. This attribute may be set for all point types except offcurve. no name string Arbitrary name or label for this point. The name does not have to be unique within a contour, nor within an outline. It must be at least one character long. There is no maximum name length. A name must not contain control characters. no name identifier string Unique identifier for the point. This attribute is not required and should only be added to points as needed. However, once an identifier has been assigned to a point it must not be unnecessarily removed or changed. Identifiers may be changed in incoming points during editing operations such as “paste” and component decomposition, but they should be maintained unless a duplicate identifier will be created. Identifiers should also be retained when possible during outline manipulation operations such as path direction changes and remove overlap. The identifier value must be unique within all identifiers (including identifiers for elements other than poinys) in the glyph that the point belongs to but it is not required to be unique among the identifiers assigned in other glyphs, in any layerinfo.plist or in fontinfo.plist. The identifier specification is detailed in the conventions. no identifier Point Types name description move A point of this type must be the first in a contour. The reverse is not true: a contour does not necessarily start with a move point. When a contour does start with a move point, it signifies the beginning of an open contour. A closed contour does not start with a move and is defined as a cyclic list of points, with no predominant start point. There is always a next point and a previous point. For this purpose the list of points can be seen as endless in both directions. The actual list of points can be rotate'
