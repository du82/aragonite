title = "fontinfo.plist"
description = "The Unified Font Object (UFO) is a cross-platform, cross-application, human readable, future proof format for storing font data."
full_description = "fontinfo.plist File Format XML Property List This file contains information about the font itself, such as naming and dimensions. This file is optional. Not all values are required for a proper file. Bit Numbers Throughout this specification are references to “bit numbers.” These are lists of integers that correspond to the bits that should be set for particular fields in the referenced font specifications. Consider this example from a fictional font specification: type name description USHORT foo Bit 0: Left Bit 1: Right Bit 2: Up Bit 3: Down Translated to the structure used in this specification would be: key type description fictionalFontSpecFoo list A list of bit numbers indicating the bits that should be set in foo. The bit numbers are listed in the fictional font specification. Corresponds to the foo field. In a fontinfo.plist file, to indicate “left” and “up” the data would look like this: <key>fictionalFontSpecFoo</key> <array> <integer>0</integer> <integer>2</integer> </array> Specification Generic Identification Information key type description familyName string Family name. Note: The specification is agnostic about how this value relates to openTypeNamePreferredFamilyName. styleName string Style name. Note: The specification is agnostic about how this value relates to openTypeNamePreferredSubfamilyName. styleMapFamilyName string Family name used for bold, italic and bold italic style mapping. styleMapStyleName string Style map style. The possible values are regular, italic, bold and bold italic. These are case sensitive. versionMajor integer Major version. versionMinor non-negative integer Minor version. year integer The year the font was created. This attribute is deprecated as of version 2. Its presence should not be relied upon by authoring tools. However, it may occur in a font’s info so authoring tools should preserve it if present. Generic Legal Information key type description copyright string Copyright statement. trademark string Trademark statement. Generic Dimension Information key type description unitsPerEm non-negative integer or float Units per em. descender integer or float Descender value. Note: The specification is agnostic about the relationship to the more specific vertical metric values. xHeight integer or float x-height value. capHeight integer or float Cap height value. ascender integer or float Ascender value. Note: The specification is agnostic about the relationship to the more specific vertical metric values. italicAngle integer or float Italic angle. This must be an angle in counter-clockwise degrees from the vertical. Generic Miscellaneous Information key type description note string Arbitrary note about the font. OpenType gasp Table Fields key type description openTypeGaspRangeRecords list A list of gasp Range Records. These must be sorted in ascending order based on the rangeMaxPPEM value of the record. gasp Range Record Format The records are stored as dictionaries of the following format. key type description rangeMaxPPEM non-negative integer The upper limit of the range, in PPEM. If any records are in the list, the final record should use 65535 (0xFFFF) as defined in the OpenType gasp specification. Corresponds to the rangeMaxPPEM field of the GASPRANGE record in the OpenType gasp table. rangeGaspBehavior list A list of bit numbers indicating the flags to be set. The bit numbers are defined below. Corresponds to the rangeGaspBehavior field of the GASPRANGE record in the OpenType gasp table. rangeGaspBehavior Bits The following bit numbers correspond to the matching bits in the OpenType gasp specification listed in the description column. value description 0 GASP_GRIDFIT (0x0001) 1 GASP_DOGRAY (0x0002) 2 GASP_SYMMETRIC_GRIDFIT (0x0004) 3 GASP_SYMMETRIC_SMOOTHING (0x0008) Notes The OpenType gasp table specification. OpenType head Table Fields key type description openTypeHeadCreated string Creation date. Expressed as a string of the format “YYYY/MM/DD HH:MM:SS”. “YYYY/MM/DD” is year/month/day. The month must be in the range 1-12 and the day must be in the range 1-end of month. “HH:MM:SS” is hour:minute:second. The hour must be in the range 0:23. The minute and second must each be in the range 0-59. The timezone is UTC. openTypeHeadLowestRecPPEM non-negative integer Smallest readable size in pixels. Corresponds to the OpenType head table lowestRecPPEM field. openTypeHeadFlags list A list of bit numbers indicating the flags. The bit numbers are listed in the OpenType head specification. Corresponds to the OpenType head table flags field. Notes The OpenType head table specification. fontRevision can be derived from the generic versionMajor and versionMinor attributes. checkSumAdjustment should be calculated by the authoring tool. magicNumber should be set by the authoring tool. unitsPerEm is found at the generic unitsPerEm attribute. created can be calculated by subtracting the 12:00 midnight, January 1, 1904 (as specified in the head table documentation) from the date stored at openTypeHeadCreated. modified should be set by the authoring tool. xMin, yMin, xMax and yMax should be calculated by the authoring tool. macStyle can be derived from the generic styleMapStyleName attribute. indexToLocFormat should be set by the authoring tool. glyphDataFormat should be set by the authoring tool. OpenType hhea Table Fields key type description openTypeHheaAscender integer Ascender value. Corresponds to the OpenType hhea table Ascender field. openTypeHheaDescender integer Descender value. Corresponds to the OpenType hhea table Descender field. openTypeHheaLineGap integer Line gap value. Corresponds to the OpenType hhea table LineGap field. openTypeHheaCaretSlopeRise integer Caret slope rise value. Corresponds to the OpenType hhea table caretSlopeRise field. openTypeHheaCaretSlopeRun integer Caret slope run value. Corresponds to the OpenType hhea table caretSlopeRun field. openTypeHheaCaretOffset integer Caret offset value. Corresponds to the OpenType hhea table caretOffset field. Notes The OpenType hhea table specification advanceWidthMax should be calculated by the authoring tool. minLeftSideBearing should be calculated by the authoring tool. minRightSideBearing should be calculated by the authoring tool. xMaxExtent should be calculated by the authoring tool. metricDataFormat should be set by the authoring tool. numberOfHMetrics should be calculated by the authoring tool. OpenType Name Table Fields key type description openTypeNameDesigner string Designer name. Corresponds to the OpenType name table name ID 9. openTypeNameDesignerURL string URL for the designer. Corresponds to the OpenType name table name ID 12. openTypeNameManufacturer string Manufacturer name. Corresponds to the OpenType name table name ID 8. openTypeNameManufacturerURL string Manufacturer URL. Corresponds to the OpenType name table name ID 11. openTypeNameLicense string License text. Corresponds to the OpenType name table name ID 13. openTypeNameLicenseURL string URL for the license. Corresponds to the OpenType name table name ID 14. openTypeNameVersion string Version string. Corresponds to the OpenType name table name ID 5. openTypeNameUniqueID string Unique ID string. Corresponds to the OpenType name table name ID 3. openTypeNameDescription string Description of the font. Corresponds to the OpenType name table name ID 10. openTypeNamePreferredFamilyName string Preferred family name. Corresponds to the OpenType name table name ID 16. openTypeNamePreferredSubfamilyName string Preferred subfamily name. Corresponds to the OpenType name table name ID 17. openTypeNameCompatibleFullName string Compatible full name. Corresponds to the OpenType name table name ID 18. openTypeNameSampleText string Sample text. Corresponds to the OpenType name table name ID 19. openTypeNameWWSFamilyName string WWS family name. Corresponds to the OpenType name table name ID 21. openTypeNameWWSSubfamilyName string WWS Subfamily name. Corresponds to the OpenType name table name ID 22. openTypeNameRecords list A list of name records. This name record storage area is intended for records that require platform, encoding and or language localization. Name Record Format The records are stored as dictionaries of the following format. key type description nameID non-negative integer The name ID. platformID non-negative integer The platform ID. encodingID non-negative integer The encoding ID. languageID non-negative integer The language ID. string string The string value for the record. Records should have a unique nameID, platformID, encodingID and languageID combination. In cases where a duplicate is found, the last occurrence of the nameID, platformID, encodingID and languageID combination must be taken as the value. Notes The OpenType name table specification. Name ID 0 (copyright) is found at the generic copyright attribute. Name ID 1 (font family name) is found at the generic styleMapFamilyName attribute. Name ID 2 (font subfamily name) can be interpreted from the generic styleMapStyleName attribute. Name ID 4 (full font name) can be created from the generic styleMapFamilyName and styleMapStyleName or openTypePreferredFamilyName and openTypePreferredSubfamilyName attributes following the rules defined in the specification. Name ID 6 (Postscript name) can be found at postscriptFontName. This should follow the rules defined in the specification. Name ID 7 (trademark) is found at the generic trademark attribute. Authoring tools should not make any assumptions about the validity (as defined by the OpenType specification) of the naming data contained in these fields. To reiterate the point stated above, these notes are merely provided for clarity. Authoring tools can and should follow their own recipes for creating the name table. These notes make no considerations for platform specific variations in or application specific limitations on the strings. OpenType OS/2 Table Fields key type description openTypeOS2WidthClass non-negative integer Width class value. Must be in the range 1-9. Corresponds to the OpenType OS/2 table usWidthClass field. openTypeOS2WeightClass non-negative integer Weight class value. Corresponds to the OpenType OS/2 table usWeightClass field. openTypeOS2Selection list A list of bit numbers indicating the bits that should be set in fsSelection. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table selection field. Note: Bits 0 (italic), 5 (bold) and 6 (regular) must not be set here. These bits should be taken from the generic styleMapStyleName attribute. openTypeOS2VendorID string Four character identifier for the creator of the font. Corresponds to the OpenType OS/2 table achVendID field. openTypeOS2Panose list The list must contain 10 non-negative integers that represent the setting for each category in the Panose specification. The integers correspond with the option numbers in each of the Panose categories. This corresponds to the OpenType OS/2 table Panose field. openTypeOS2FamilyClass list Two integers representing the IBM font class and font subclass of the font. The first number, representing the class ID, must be in the range 0-14. The second number, representing the subclass, must be in the range 0-15. The numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table sFamilyClass field. openTypeOS2UnicodeRanges list A list of bit numbers that are supported Unicode ranges in the font. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3 and ulUnicodeRange4 fields. openTypeOS2CodePageRanges list A list of bit numbers that are supported code page ranges in the font. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table ulCodePageRange1 and ulCodePageRange2 fields. openTypeOS2TypoAscender integer Ascender value. Corresponds to the OpenType OS/2 table sTypoAscender field. openTypeOS2TypoDescender integer Descender value. Corresponds to the OpenType OS/2 table sTypoDescender field. openTypeOS2TypoLineGap integer Line gap value. Corresponds to the OpenType OS/2 table sTypoLineGap field. openTypeOS2WinAscent non-negative integer Ascender value. Corresponds to the OpenType OS/2 table usWinAscent field. openTypeOS2WinDescent non-negative integer Descender value. Corresponds to the OpenType OS/2 table usWinDescent field. openTypeOS2Type list A list of bit numbers indicating the embedding type. The bit numbers are listed in the OpenType OS/2 specification. Corresponds to the OpenType OS/2 table fsType field. openTypeOS2SubscriptXSize integer Subscript horizontal font size. Corresponds to the OpenType OS/2 table ySubscriptXSize field. openTypeOS2SubscriptYSize integer Subscript vertical font size. Corresponds to the OpenType OS/2 table ySubscriptYSize field. openTypeOS2SubscriptXOffset integer Subscript x offset. Corresponds to the OpenType OS/2 table ySubscriptXOffset field. openTypeOS2SubscriptYOffset integer Subscript y offset. Corresponds to the OpenType OS/2 table ySubscriptYOffset field. openTypeOS2SuperscriptXSize integer Superscript horizontal font size. Corresponds to the OpenType OS/2 table ySuperscriptXSize field. openTypeOS2SuperscriptYSize integer Superscript vertical font size. Corresponds to the OpenType OS/2 table ySuperscriptYSize field. openTypeOS2SuperscriptXOffset integer Superscript x offset. Corresponds to the OpenType OS/2 table ySuperscriptXOffset field. openTypeOS2SuperscriptYOffset integer Superscript y offset. Corresponds to the OpenType OS/2 table ySuperscriptYOffset field. openTypeOS2StrikeoutSize integer Strikeout size. Corresponds to the OpenType OS/2 table yStrikeoutSize field. openTypeOS2StrikeoutPosition integer Strikeout position. Corresponds to the OpenType OS/2 table yStrikeoutPosition field. Notes The OpenType OS/2 table specification. The Panose specification. xAvgCharWidth should be calculated by the authoring tool. sFamilyClass is not supported. fsSelection can be derived from the generic styleMapStyleName attribute. (See question below.) usFirstCharIndex should be calculated by the authoring tool. usLastCharIndex should be calculated by the authoring tool. sxHeight is found at the generic xHeight attribute. sCapHeight is found at the generic capHeight attribute. usDefaultChar should be calculated by the authoring tool. OpenType fonts are required to have a .notdef character for fallback. usBreakChar should be calculated by the authoring tool. usMaxContext should be calculated by the authoring tool. OpenType vhea Table Fields key type description openTypeVheaVertTypoAscender integer Ascender value. Corresponds to the OpenType vhea table vertTypoAscender field. openTypeVheaVertTypoDescender integer Descender value. Corresponds to the OpenType vhea table vertTypoDescender field. openTypeVheaVertTypoLineGap integer Line gap value. Corresponds to the OpenType vhea table v"
