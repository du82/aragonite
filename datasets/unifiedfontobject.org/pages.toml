["https://unifiedfontobject.org/versions/ufo1"]
title = "UFO 1"
description = "The Unified Font Object (UFO) is a cross-platform, cross-application, human readable, future proof format for storing font data."
full_description = "UFO 1 A UFO file is a directory following this structure: *.ufo metainfo.plist fontinfo.plist groups.plist kerning.plist lib.plist glyphs contents.plist *.glif Each of the files has a unique meaning, purpose and data structure: metainfo.plist Format version, creator, etc. fontinfo.plist Various font info data. groups.plist Glyph group definitions. kerning.plist Kerning data. lib.plist Arbitrary custom data. glyphs A directory containing all glyphs in the font. glyphs/contents.plist File name to glyph name mapping. glyphs/*.glif A glyph definition."
