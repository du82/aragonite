["https://unifiedfontobject.org"]
title = "Overview"
description = "The Unified Font Object (UFO) is a cross-platform, cross-application, human readable, future proof format for storing font data."
full_description = "The Unified Font Object (UFO) is a cross-platform, cross-application, human readable, future proof format for storing font data. The UFO Design Philosophy The data must be human readable and human editable. The data should be application independent. Data duplication should be avoided unless absolutely necessary. Versions UFO 1 Published in 2004. UFO 2 Published in March 2009. UFO 3 Published in March 2012. UFO 4 In development. Contribute Contributions are welcome! The source for the documentation, an issue tracker and more are located on GitHub. Questions, Comments, Discussions If you have questions, comments or would like to discuss the UFO specification, please post to the UFO Specification Issue Tracker on our GitHub. Updates If you would like to stay informed about group meetings and other organizational matters, subscribe to the UFO Specification Google Group."
