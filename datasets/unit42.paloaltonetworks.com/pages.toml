["https://unit42.paloaltonetworks.com/advanced-backdoor-squidoor"]
title = "Squidoor: Suspected Chinese Threat Actor’s Backdoor Targets Global Organizations"
description = "We analyze the backdoor Squidoor, used by a suspected Chinese threat actor to steal sensitive information. This multi-platform backdoor is built for stealth. We analyze the backdoor Squidoor, used by a suspected Chinese threat actor to steal sensitive information. This multi-platform backdoor is built for stealth."
full_description = '''Threat Research CenterThreat ResearchMalware Malware Squidoor: Suspected Chinese Threat Actor’s Backdoor Targets Global Organizations 12 min read Related ProductsAdvanced Threat PreventionAdvanced URL FilteringAdvanced WildFireCloud-Delivered Security ServicesCortexCortex XDRCortex XSIAMNext-Generation FirewallUnit 42 Incident Response By:Lior RochbergerTom Fakterman Published:February 27, 2025 Categories:MalwareThreat Research Tags:BackdoorChinaLOLBASMicrosoft OutlookWeb shells Share Executive Summary This article reviews a cluster of malicious activity that we identify as CL-STA-0049. Since at least March 2023, a suspected Chinese threat actor has targeted governments, defense, telecommunication, education and aviation sectors in Southeast Asia and South America. The observed activity includes collecting sensitive information from compromised organizations, as well as obtaining information about high-ranking officials and individuals at those organizations. During our investigation, we were able to shed new light on the attacker’s tactics, techniques and procedures (TTPs), including the attack flow, entry vector via web shells and covert communication channels. The threat actor behind this activity cluster used a recently discovered sophisticated backdoor we named Squidoor (aka FinalDraft), which targets both Windows and Linux systems. This article reveals a new Windows variant of Squidoor, and provides a deeper understanding of Squidoor's command and control server (C2) communication than has been previously described. Squidoor is an advanced backdoor that supports multiple modules, designed for stealth. It features a rarely seen set of capabilities, including using multiple protocols to communicate with the C2 such as the following: Outlook API Domain Name System (DNS) tunneling Internet Control Message Protocol (ICMP) tunneling Based on our analysis of the TTPs, we assess with moderate-high confidence that this activity originates in China. Our objective in sharing this analysis is to equip cybersecurity professionals in these high-risk sectors with effective detection and mitigation strategies against these advanced threats. Palo Alto Networks customers are better protected from the threats discussed in this article through the following products and services: Cortex XDR and XSIAM Cloud-Delivered Security Services for the Next-Generation Firewall, including: Advanced WildFire Advanced URL Filtering Advanced Threat Prevention If you think you might have been compromised or have an urgent matter, contact the Unit 42 Incident Response team. Related Unit 42 Topics Backdoor, LOLBAS, China Initial Access to Networks: Deploying Multiple Web Shells To gain access to networks, the threat actor behind CL-STA-0049 primarily attempted to exploit various vulnerabilities in Internet Information Services (IIS) servers. They followed this initial compromise with the deployment of multiple web shells on infected servers. These web shells served as persistent backdoors, allowing the threat actor to maintain access and execute commands on compromised systems. Our research identified four primary web shells used in the attack: OutlookDC.aspx Error.aspx (1) Error.aspx (2) TimeoutAPI.aspx The deployed web shells exhibited significant similarities, indicating a common origin. The shared characteristics include the following: Embedded decryption keys of the same length (and sometimes shared among different samples) Extensive obfuscation using junk code (shown in Figure 1 below) Consistent string patterns and code structures Figure 1 shows a code snippet of one of the web shells. Figure 1. Code snippet of a web shell used in the attack. The threat actor stored some of the web shells on bashupload[.]com and downloaded and decoded them using certutil, as shown in the command-line string in Figure 2. Bashupload is a web application that enables users to upload files using the command line and download them to another server. Figure 2. Certutil is used to retrieve web shells from bashupload. Lateral Movement Within Compromised Endpoints: Spreading Web Shells We observed that the threat actor attempted to spread the web shells across different servers. To do that, it used curl and Impacket, as shown in Figure 3 below. The threat actor also tried to conceal one of the web shells as a certificate and copy it to other servers using Windows Management Instrumentation (WMI). Figure 3. Cortex alert data showing attempts to download and copy web shells to remote machines. Squidoor: A Modular Stealthy Backdoor We call the main backdoor the attackers used Squidoor. (Elastic Security Labs recently published similar research on this activity cluster, referring to the backdoor as FinalDraft.) Squidoor is a sophisticated backdoor that was built for stealth, allowing it to operate in highly monitored and secured networks. The threat actors primarily used this backdoor to: Maintain access Move laterally Create stealthy communication channels with its operators Collect sensitive information about the targeted organizations During our investigation, we discovered that Squidoor was in fact multi-platform malware, with versions for both Windows and Linux operating systems. Squidoor offers a range of different protocols and methods operators can use to configure the malware to communicate with its C2 server. The Windows version of Squidoor grants the attackers 10 different methods for C2 communication, and the Linux version allows nine. Some communication methods are meant for external communication with the C2, while other methods are for internal communication between Squidoor implants within a compromised network. This variety of communication methods enables the attackers to adjust to different scenarios and stay under the radar. Squidoor can receive the following commands: Collect information about the infected machine Execute arbitrary commands Inject payloads into selected processes Deliver additional payloads Figure 4 shows a diagram of the communication paths in a network infected with Squidoor, illustrating how threat operators configured most of the implants to only communicate internally to remain undetected. Figure 4. Example of communication paths for implants in a network infected with Squidoor. Using a Rarely Observed LOLBAS Technique: Cdb.exe To execute Squidoor, the threat actor abused the Microsoft Console Debugger binary named cdb.exe. Attackers delivered cdb.exe to the infected environments, saved it to disk as C:\ProgramData\fontdrvhost.exe and used it to load and execute shellcode in memory. While using cdb.exe is a known living-off-the-land-binaries-and-scripts (LOLBAS) technique, its use is quite rare and has only been reported a handful of times. Upon execution, cdb.exe (renamed by the attacker to fontdrvhost.exe) loaded the shellcode from a file named config.ini. After the first execution, we observed the attackers using one of Squidoor’s payloads (LoadShellcode.x64.dll, loaded into mspaint.exe) to load and decrypt another Squidoor implant from a file on disk named wmsetup.log. Figure 5 illustrates these two flows of execution. Figure 5. The execution flow of loading Squidoor. Squidoor’s persistence was achieved using a scheduled task named Microsoft\Windows\AppID\EPolicyManager. This task executed the shellcode. Figure 6 shows the command to create the scheduled task to keep Squidoor persistent. Figure 6. Command to create a scheduled task to maintain Squidoor persistence on an affected Windows host. Squidoor Execution Flow Once Squidoor was loaded into memory, it executed its exported function named UpdateTask. Squidoor’s execution flow begins with decrypting its hard-coded configuration. The configuration of Squidoor contains a single digit (0-9) corresponding to a switch case that determines which communication method it will use. There are other configuration fields that might not be used, depending on the variant of the malware. These fields include values needed for the communication with the C2 server, which will vary depending on which communication method it uses. These values can include the following: Domains IP addresses Listening ports Encryption key Access token Communication Methods The Windows version of Squidoor supports 10 different methods for C2 communication. Table 1 breaks out these 10 different methods based on their corresponding switch case digits. Switch Case Digit Internal Class Name Description 0 CHttpTransChannel HTTP-based communication 1 CReverseTcpTransChannel Reverse TCP connection to a remote server 2 CReverseUdpTransChannel Reverse UDP connection to a remote server 3 CBindTcpTransChannel Listen for incoming TCP connections (suspected to be used for only internal communication) 4 CBindHttpTransChannel Listen for incoming HTTP connections (become an HTTP Server) 5 COutLookTransChannel Communicate via an Outlook mail API 6 CIcmpTransChannel Utilize ICMP tunneling for communication 7 CDnsTransChannel Utilize DNS tunneling for communication 8 CWebTransChannel Communicate via a mail client retrieved from the configuration file 9 CBindSMBTransChannel Use named pipes for communication (only internal communication, and only on the Windows version) Table 1. Switch-case values for Squidoor C2 communication methods. These communication methods have distinct names in the malware’s code, as shown in Figure 7. Figure 7. Code snippets of Squidoor’s communication methods grouped by switch case. Outlook Transport Channel Analysis This section examines the Outlook mail client communication method. Figure 8 shows the flow of this method. Figure 8. Flow of the communication mechanism via Outlook API for Squidoor. When executed with the COutLookTransChannel configuration, Squidoor will first log in to the Microsoft identity platform using a hard-coded refresh token as shown in Figure 9. The Microsoft Graph API token is stored in the following registry keys, based on the user’s privileges: HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UUID\<uuid_stored_in_configuration> HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UUID\<uuid_stored_in_configuration> Figure 9. HTTP POST request by Squidoor for logging in to the Microsoft identity platform. Next, Squidoor sends an HTTP GET request to a specific Pastebin page that is hard coded in its configuration. The Pastebin page is named Local365, and only contains the number 1. We suspect the attackers monitor these GET requests to Pastebin as a method to track how many implants have connected via the Outlook API. Next, Squidoor uses the Outlook REST API to query the drafts folder, searching for mails with a subject containing the string p_{random_generated_number}. If it finds no such mail, Squidoor will send an email to the attackers with the aforementioned generated string as the subject, including a Base64-encoded random sequence of bytes in the content. Figure 10 shows an HTTP POST request of this C2 traffic. Figure 10. HTTP POST request for an email uploaded to the attackers’ Outlook account by Squidoor. The attackers use the {random_generated_number} identifier to differentiate between different Squidoor implants that query commands from the same Outlook mail inbox. After sending the initial beacon, Squidoor starts to query the email account for commands. To do so, it queries the drafts folder for mails containing the string r_{random_generated_number} in the subject with a preceding r instead of p with the same generated number value as before. Figure 11 shows an example of such a query sent by Squidoor. Figure 11. A query Squidoor uses to retrieve emails containing commands to execute. If such an email exists, Squidoor will retrieve its contents and delete it from the attacker's mailbox. Next, the contents of the retrieved message go through several stages of deobfuscation and decoding. This mechanism allows the malware to receive commands or additional malicious code from its C2 server disguised as innocent-looking Outlook network traffic. Decoding the Email Content The decoding mechanism of the content of the mails is as follows: Transform the email to bytes by using the CryptStringToBinaryA WinAPI Decode from Base64 encoding Decode the content via a combination of AES and a custom XOR decryption algorithm Decompress the decoded content using zlib 1.2.12 The decompressed content tells Squidoor which command it should execute, along with any additional relevant data for execution, such as additional payloads or file paths. Squidoor’s Main Capabilities Squidoor has a list of commands it can receive from the C2 server, which grants the attacker a variety of different capabilities to gain full control over the infected machine. These capabilities include: Host reconnaissance and fingerprinting, including: Username and privileges Hostname IP address Operating system (OS) type Executing arbitrary commands Querying files and directories Querying running processes Exfiltrating files Deploying additional malware Injecting payloads into additional processes Sending commands to other Squidoor implants via TCP Sending commands to other Squidoor implants via named pipes (Windows variant only) Squidoor Code Injection Squidoor can receive a command from the C2 instructing the malware to perform code injection into an additional process. Squidoor injects a payload using classic DLL injection, calling the following Windows API functions RtlCreateUserThread, ​​VirtualAllocEx and WriteProcessMemory. On the Windows version, depending on the command the attackers sent, Squidoor will determine which process it will use for injection. The two options available for the attacker are: Attempting to inject code into mspaint.exe If mspaint.exe does not exist in system32 (as is the case in Windows 11), it injects conhost.exe instead Performing an injection into an already running process on the system determined by a process ID (PID) selected by the attacker Modular Backdoor During our investigation, we observed Squidoor executing additional modules that it injected into other Windows OS processes, such as the following: mspaint.exe conhost.exe taskhostw.exe vmtoolsd.exe Figure 12 shows how, in one instance, the threat actor delivered payloads (modules) that they injected into multiple instances of mspaint.exe. The threat actor used these injected modules to move laterally using Windows Remote Management (WinRM), steal data and execute commands on remote endpoints. The modules require a password as an argument to run, to evade dynamic analysis and sandboxes. The observed passwords included: t0K1p092 PeN17PFS50 sElf98RqkF Aslire597 Figure 12. Squidoor injects multiple payloads into different mspaint.exe instances. The mspaint.exe injected payloads were not written to the disk and were executed in system memory. From the behavioral pattern, these payloads appear to support a number of command-line arguments to perform multiple actions such as the following: Uploading or deletin'''
author = "Lior Rochberger, Tom Fakterman"
