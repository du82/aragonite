title = "About Us - Palo Alto Networks"
description = "At Palo Alto Networks, our values of disruption, execution, collaboration, integrity and inclusion guide everything we do to protect our digital way of life. Those values are deeply held principles of the women and men who have proudly represented our Armed Services."
full_description = "RustDoor and Koi Stealer for macOS Used by North Korea-Linked Threat Actor to Target the Cryptocurrency Sector About UsOur vision is a world where each day is safer and more secure than the one beforeHero Dropdown WHAT WE DOWe enable cyber transformationOur best-of-breed platforms, world-class threat intelligence and expert services deliver what’s next in cybersecurity.Learn more OUR CULTURELiving our valuesMaking Palo Alto Networks the cybersecurity workplace of choice.Learn more Chief Executive Officer and Chairman Nikesh AroraNikesh Arora joined as chairman and CEO of Palo Alto Networks in June 2018. Before joining Palo Alto Networks, Nikesh served as president and chief operating officer of SoftBank Group Corp. Prior to that, he held a number of positions at Google, Inc. during a 10-year span, including senior vice president and chief business officer, president of global sales operations and business development, and president of Europe, the Middle East and Africa. Prior to joining Google, Nikesh held the role of chief marketing officer for the T-Mobile International Division of Deutsche Telekom AG. He was chief executive officer and founder of T-Motion PLC, which merged with T-Mobile International in 2002.Nikesh serves on the board of Compagnie Financière Richemont S.A., a public Switzerland-based luxury goods holding company, and Tipping Point, a non-profit organization that fights poverty in the Bay Area. Previously, he served on the boards of SoftBank Group Corp., Sprint Corp., Colgate-Palmolive Inc. and Yahoo! Japan, among others. He holds an M.S. in Business Administration from Northeastern University, an M.S. in finance from Boston College and a B. Tech. in electrical engineering from the Institute of Technology at Banaras Hindu University. President BJ JenkinsBJ joined Palo Alto Networks in August 2021. As president, BJ oversees the company’s go-to-market functions, including sales, support, consulting, business development and operations, and partnerships.Previously, BJ served as president and CEO of Barracuda Networks, leading the company’s IPO on the New York Stock Exchange, as well as the strategic acquisitions of SignNow, Intronis, Sonian and PhishLine. Prior to joining Barracuda, BJ held multiple business unit and sales and marketing leadership roles at EMC, including president of EMC’s Backup Recovery Systems (BRS) Division.BJ earned an engineering degree from the University of Illinois and an M.B.A. from Harvard Business School."
