              YALE UNIVERSITY WELCOMES UNITED IN ANGER              
                        Mar 6                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
                        Jim Hubard and George Chauncey, Co-Director Yale Research Initiative on History of Sexualities. Photo: Ron Gregg                  

  


  





  The Yale Research Initiative on the History of Sexualities recently invited me to present United in Anger: A History of ACT UP.  Nearly one hundred Yale faculty and students came to see the special screening of the film, followed by a rousing discussion.United in Anger is a valuable teaching tool, and the screening at Yale was a testament to that. More than 80% of the audience was under 25 years of age, and many said they previous to seeing the film, they did not know about the contributions of ACT UP to counter government neglect and indifference.


































































  

  
  
                    
                                                                                                                                
                            
                        Susan Cahan, Associate Dean of the Arts and Jim Hubbard, Photo: Ron Gregg                  

  


  





  Read an interview with me from the Yale Daily News here.The mission of our film is to put ACT UP into mainstream U.S. history, where it has been excluded for decades.  We hope when people see United in Anger, they will start integrating ACT UP into their notions about what’s important, and know how ACT UP changed history. Ryan Nees, a student who saw the film wrote, “Remembering this period is important because accounting for it all is so difficult given the scale of the devastation. But especially for those of us who are young and gay — and because being gay isn’t to have gay parents and inherit this heritage directly — real work has to be done to make sure this legacy is understood and carried forth. I’m thankful you’re doing it.” 


































































  

  
  
                    
                                                                                                                                
                            
                        Our wonderful Yale audience                  

  


  





  The screening at Yale was just the first step in bringing the history of ACT UP to college and university curricula across the world.If you are interested in bringing United in Anger to your college or university, or adding it to your library collection, please email me at jim@jimhubbardfilms.com.
























      
                              
  
  Ethan Shoshan


https://www.disiterate.com
                  
                                                
  



  
  
  


  


      
                        
