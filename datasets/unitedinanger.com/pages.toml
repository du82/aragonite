perts." That's why in our film you will not hear authoritative opinions from employees of Merck Pharmaceutical. Jim scrupulously sorted through almost 2000 hours of footage, which he digitized and preserved and immediately made available for free to others. From this he only chose footage taken from ACT UP's point of view. From inside demonstrations, from inside meetings. There is no narrator in this film. Mike Signorile and Ann Northrop were two of a number of media geniuses who worked for ACT UP. Mike came from People Magazine and Ann from CBS. We also had our beloved friend, the late Bob Rafsky, who had been an ad executive. For the action, Seize Control of the FDA (Food and Drug Administration) the ACT UP media committee invited the national regional press, and then presented people with AIDS from a wide range of states, so that the regional papers could talk to People With AIDS from their areas. It was brilliant.Regarding what you are calling "Messaging" which I believe we called "politics" - The purpose of slogans and posters and floats, banners and chants was to inform the public and to recruit activists. Silence=Death was aimed at the gay community. It was meant to confront them with the truth, that if they didn't do something they would die. It was accurate. The problem that you are referring to is that many of the slogans that we are inundated with today are not truthful and are not accurate. One of my least favorite is the utterly false "It Gets Better." ACT-UP is known for being very media savvy – from the compelling posters and slogans to the use of video and the ways actions were planned to generate media attention. Can you give some specific examples of the ways in which ACT-UP used media to its advantage and/or a campaign you think was particularly successful? JH: What’s most important to me is the AIDS Activist Video movement that ACT UP fostered. There are dozens of videotapes ranging from a few minutes to feature-length that tell the story of the AIDS crisis from the point of view of people actually fighting the disease. ACT UP’s media savvy and compelling graphics caused the mainstream media to pay attention and ACT UP was able to get its sound bites on TV and its quotes in the newspapers. But the mainstream media was always going to simplify the ideas, slant the story to fit their worldview and give far more credit to straight, white men than they ever deserved.The only way to tell your story is to tell it yourself. And that’s what AIDS Activist Videomakers did. It is because they created so much footage that I was able to make United in Anger and I see this film as a continuation of that tradition. SS: There are so many. Scheduling demonstrations to coincide with live feeds for the local 6 pm news. One of the inventions of video activism (since the camcorder was invented in the middle of ACT UP) was to shoot our own footage and then send it to the tv stations. But we also did not respect the boundaries of mainstream media. John Weir and others notoriously interrupted Dan Rather's live news broadcast shouting "Fight AIDS, Not Arabs." I also recall, when faxes were first invented, that we faxed the hated NY TIMES (we called them the New York Crimes) a mile of black paper and made it impossible for them to receive faxes. Etc. Etc. Popular media tends to paint every struggle within a linear liberation narrative or progress narrative as Sarah has mentioned, so I really appreciate what you’ve both done with this film as a way to counteract that misconception. What are some of the most staggering examples you’ve seen of the false memories of the AIDS crisis or of the LGBT movement in general? JH: The most staggering example of false memory in the AIDS crisis is the idea that the valiant straight white government scientists and their great allies in the pharmaceutical industries cracked the code of HIV and discovered the medicines that saved people’s lives out of a selfless devotion to pure science and to humanity. This is a lie. They were forced by thousands of dedicated activists, many of whom gave their lives so that those scientists would pay attention and do their work. SS: The most egregious fuck-up in recent memory is running the Don't Ask Don't Tell Campaign- not as an issue of employment discrimination, but as a patriotic desire for queer people to join immoral wars and kill Muslims. I also personally hate the men-who-have-sex-with-men rhetoric and have seen no evidence that it works. Speaking of things that run counter to a linear narrative of things just “getting better” - one of the things that really haunts me about this film and about ACT-UP is the way in which all these diverse people were able to work together to create change, different races, different classes, different genders – while the present LGBT movement/community in the US is very much segregated, and in many instances racist. How did we get from ACT-UP to a media that is saturated with the belief that black gay and bisexual men are to blame for AIDS and black people are to be blamed for the lack of marriage equality and locally we have bourgeois white gay men in the west village who – instead of fighting homelessness – just want to get rid of the queer and trans youth of color that are sullying their streets? Is this backsliding into racism part of the function of homonationalism? JH: To be frank there were always issues of race in ACT UP and a tension between those who were interested in drug development and those interested in universal drug access that too often played out in racial terms. But people struggled to think about and confront these issues in ACT UP in a way that I think is missing in contemporary LGBT politics. But I also think much of what you point out is the result of the fundamental racism in American culture and not unique to queer culture. The mainstream media is largely responsible for blaming black gay and bisexual men for AIDS. My feeling is that there aren’t very many bourgeois gay men left in the Village. They died of AIDS and have been replaced by straight, white families who don’t want the kids of color on the pier.As someone who has been in a loving and supportive relationship with the same man for nearly thirty years, I am completely uninterested in gay marriage. We want to define our relationship on our own terms. I don’t want to assimilate into American culture. I want to fundamentally transform it and make it better. If we had universal healthcare, if people had their rights because they were individual human beings and not because they were legally attached to another person, we wouldn’t need gay marriage. SS: On one hand there has always been a racist and male supremacist wing of the Gay Movement. As you well know, gay male racial supremacist movements have overlapped with fascism in the past and continue to do so today in The Netherlands, Germany etc. There has also always been a feminist and anti-racist tendency in gay liberation. Today we see this split between'''
