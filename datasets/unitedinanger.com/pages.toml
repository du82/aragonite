              UNITED IN ANGER WORLD PREMIERE AT MOMA              
                        Jan 30                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  You’re invited to the world premiere of United in Anger: A History of ACT UP.We are thrilled that our film will be the opening night of the Museum of Modern Art’s Documentary Fortnight festival. We hope you’ll join us! Jim Hubbard & Sarah Schulman will be there to present the film, and for a Q&A afterwards.United in Anger World PremiereDocumentary Fortnight 2012: MoMA’s InternationalFestival of Nonfiction Film and MediaThursday, February 16, 20128:00 PMThe Titus One Theater11 West 53rd Street, New York, NY Tickets go on sale February 10th.$12 adults$10 seniors$8 studentsFree for MoMA members.United in Anger: A History of ACT UP is an inspiring documentary about the birth and life of the AIDS activist movement from the perspective of the people in the trenches fighting the epidemic. Utilizing oral histories of members of ACT UP, as well as rare archival footage, the film depicts the efforts of ACT UP as it battles corporate greed, social indifference, and government neglect. See you on February 16th!In solidarity,Jim Hubbard & Sarah SchulmanCo-Founders, ACT UP Oral History ProjectView the United In Anger trailer here.
























      
                              
  
  Ethan Shoshan


