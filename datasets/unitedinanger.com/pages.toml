   THE PRODUCERS
























  
  
  


  


  
  



    
  
                     










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  jim hubbard, DirectorJim Hubbard has been making films since 1974. He made United in Anger: A History of ACT UP, a feature length documentary on ACT UP, the AIDS activist group, which won Best Documentary at MIX Milano and Reel Q Pittsburgh LGBT Film Festival and has played at over 150 museums, universities and film festivals worldwide. Sarah Schulman and he completed 187 interviews as part of the ACT UP Oral History Project. One hundred and two of those interviews were on view in a 14-monitor installation at the Carpenter Center for the Arts, Harvard University as part of the exhibition ACT UP New York: Activism, Art, and the AIDS Crisis, 1987–1993, October 15 – December 23, 2009. A version with 114 interviews showed at the White Columns Gallery in New York, September 8 – October 23, 2010. He, along with James Wentzy, created a 9-part cable access television series based on the Project. Among his 25 other films are Elegy in the Streets (1989), Two Marches (1991), The Dance (1992) and Memento Mori (1995). His films are in the collection of the Museum of Modern Art and have been shown at the Warhol Museum, ICA Boston, the Harvard Film Archive, Tokyo University, der Zürcher Museen, mumok (Vienna), Mudam (Luxembourg), the Berlin Film Festival, the London Film Festival, the San Francisco Jewish Film Festival, the New York, San Francisco, Los Angeles, Tokyo, London, Torino and many other Lesbian and Gay Film Festivals. His film Memento Mori won the Ursula for Best Short Film at the Hamburg Lesbian & Gay Film Festival in 1995. He co-founded MIX - the New York Queer Experimental Film Festival. Under the auspices of the Estate Project for Artists with AIDS, he created the AIDS Activist Video Collection at the New York Public Library. He curated the series Fever in the Archive: AIDS Activist Videotapes from the Royal S. Marks Collection for the Guggenheim Museum in New York. The 8-program series took place December 1-9, 2000. He also co-curated the series, Another Wave: Recent Global Queer Cinema at the Museum of Modern Art in New York, July and September 2006. In 2013-14, he curated an 8-program series of AIDS activist video from the collection of the New York Public Library to accompany their landmark exhibition Why We Fight: Remembering AIDS Activism. In 2018 and 2019, he received grants from the Al Larvick Conservation Fund to digitize footage from Lesbian & Gay Pride March and other Queer demonstration footage and Queer home movies, spanning more than 40 years.To see some of his other films and for more information, see https://www.jimhubbardfilms.com/


































































  

  
  
                    
                                                                                                                                
                            
            

  


  





  sarah schulmanSarah Schulman is a novelist, playwright, screenwriter, nonfiction writer and AIDS historian. Her 20th book, LET THE RECORD SHOW: A Political History of ACT UP, New York 1987-1993 will be published in May by FSG.For more information about LET THE RECORD SHOW, see https://us.macmillan.com/books/9780374185138
























  
  
  


  


      
                                
  
  
  
  
  
  


  
  



    
  
                     


