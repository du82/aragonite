  ACTIVIST GUIDE
























  
  
  


  


  
  



    
  
                    


  United in Anger: A History of ACT UP is a moving and inspiring film, and a great resource for organizers and activists of all stripes. This packet of discussion guides is designed to help groups learn from the example of ACT UP and apply the lessons of ACT UP’s organizing tactics and campaign strategies to their own movements today. The first guide in the packet is for a single viewing of the full film, with discussion questions and an activity. The second guide splits the film into four sections, for groups of activists who want to watch and reflect on the film over the course of a month of weekly meetings. No matter which discussion guide your organization uses, this film will help your members recommit to organizing and action on the pressing issues of today.Download the packet here.If you work for a nonprofit organization or volunteer with an activist group, you can purchase a DVD to accompany the activist guide, for $10 (to cover shipping and handling) from the Building Movement Project. Please click here to use BMP’s online order form. Be sure to select DVD for “United in Anger” Guide, and completely fill out the form.
























  
  
  


  


      
                                
  
  
  
  
  
  


  
  



    
  
                     


