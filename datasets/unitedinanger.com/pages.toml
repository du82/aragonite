              SARAH SCHULMAN REPORT FROM RUSSIA              
                        Nov 7                Written By Ethan Shoshan                  
            


  Sarah and I traveled to Russia to screen United in Anger, and to meet with activists working on HIV and LGBT issues. Here’s her report:FINAL REPORT FROM RUSSIAby Sarah SchulmanGoodbye Russia. Well, we are exhausted. It’s hard to sum up everything we learned, but here it is:WHAT IS HAPPENING TO QUEER PEOPLE:Queer people are in a danger in Russia right now. A legal apparatus is being put into place that- even if it is never activated- has a chilling effect, causes fear and self-censorship and produces an open season for violence. This week the European Community announced a new openness towards Russian queer refugees and asylum seekers. And a number of people gay and straight said they anticipate more emigration.Some people argue that the new anti-gay wave is Putin looking for scapegoats to distract from political problems. But others say that many Russians are fine with Putin, and are comfortable with the racism and prejudice. The anti-gay stuff is in sync with deep anti-Muslim waves aimed at people from former Soviet Republics. Both groups (and their cross-over points) are targeted by Nationalists, Racists and Orthodox Christians, who the state allows to act with violence and hateful incitement.Another perspective suggests that because they were successful in organizing groups, and were reaching out into the regions, queers became a target for the government – not because of homosexuality per se- but because they were effective and visible political organizers. And the Putin government does not want organized political sectors. Which explains the new laws against assembly and protest. Also, because many queer people around the world have diasporic identities and care about other queers across borders, Russian queers have many international relationships, access to resources and the ability to communicate that surpass some other sectors. This makes them susceptible to “foreign agents” bills and other anti-NGO laws. Closing off these connections further isolates them and makes them more vulnerable.The emphasis on “propaganda” that “corrupts youth” is a big part of the anti-gay wave. Cutting off young people from events and gatherings and information is serious. Cutting them off from HIV and sex education equally so. But it can also be used to cut them off from films, from internet information, even potentially from books. (Although when I donated copies of TIES THAT BIND: Familial Homophobia and Its Consequences to a library, the cool librarian assured me that there would be no restrictions on access by age. Yet.) This separation of queers over 18 from minors is one of the most tragic elements of the who crack-down, from my POV.HIVThe situation in Russia is very different from the US, because most people with HIV are straight and were infected through needles, or straight sex with men infected with needles. There are significant divisions between the drug user HIV activists and the queer ones.The preventions problems are basically that there is no sex education and no methadone. VERY SIGNIFICANT problems.The treatment problems are basically that there is no centralized purchasing of drugs (health care is free and paid for by the state) so out-moded drugs in non-sensical combinations are in place when newer better treatments exist. For example they don’t have truvata, so they have more children born hiv+ than is necessary.I was really impressed with the straight Harm Reduction, former addict activists. They are focused on winnable goals, seem to have wisdom about how to go about getting the drugs they need, and I feel that they will succeed in improving treatments. Although getting those treatments to more than 10% of the million infected Russians is another matter.They, it seems, will not have the same problems as the queers and the Migrants who are really being set-up for some serious violence, fear and repression.OLYMPICSIn my view, former Olympic champions should show up at Sochi with their medals to protest Russia’s anti-gay laws. The boycott just isn’t happening, and media-wise that seems like the easiest and most attention grabbing kind of action to organize.What happens after the Olympics is very worrisome, and using the Olympics to draw attention to this now is a unique opportunity.WHAT IS TO BE DONEAs people have told us. Protests are appreciated, coming to Russia with queer events, exhibits, shows, films, is important. Celebrities or people with credibility coming is important. The Dutch consulate and others have been visibly helpful, diplomatic condemnation of these laws, pressure from the EU, offers of Asylum. All of that matters. But none of it is a fix-it. This is a pathological situation that will go on for a long time and will probably get worse.
























      
                              
  
  Ethan Shoshan


