                        Nov 20                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  Visual AIDS, an organization with a mission to utilize art to fight AIDS by provoking dialogue, is generously distributing United in Anger: A History of ACT UP in honor of World AIDS Day/Day With(out) Art on December 1st.Screenings are taking place in 30+ cities across the globe, from Paris, France to Tacoma, Washington, and The Bronx, New York to St. Louis, Missouri. All the screenings are listed below. Visual AIDS has also developed a downloadable resource guide to accompany the film and stimulate audience participation and education.For even more inspiration from United in Anger, check out the Visual AIDS tumblr, Wisdom in Being United in Anger, with posts and quotes from the film.And much more from the Visual AIDS Blog


































































  

  
  
                    
                                                                                                                                
                            
            

  


  





