              ACT UP IS AT IT AGAIN - 25TH ANNIVERSARY              
                        Apr 26                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
                        Jim Hubbard at the 25th anniversary of ACT UP yesterday. Photo by Kate Huh                  

  


  





  Happy 25th Anniversary ACT UP!In today’s article “ACT UP Is at It Again” in Truthout, Melissa Gira Grant describes viewing United in Anger as a way to meet the activists of the early days of ACT UP. These activists were passionate and angry enough to take to the streets and save each others lives.She says activists today can take notes from ACT UP.She writes of the film, “Captured in all that glorious 80s footage is a raw, life-affirming anger. For all the comparisons drawn between Occupy and ACT UP,  Occupy has yet to fully embody this urgency, or this rage, that transforms pain into action and back again…“What cannot be ignored, in this film or in our attempts to make sense of the early years of the epidemic, is the power of people to organize in the face of death, to claim expertise, to lead.”Read the whole article here.
























      
                              
  
  Ethan Shoshan


