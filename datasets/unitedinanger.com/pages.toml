              UNITED IN ANGER AT HOT DOCS              
                        May 15                Written By Ethan Shoshan                  
            


  United in Anger created a lot of buzz with our Canadian premiere at Hot Docs, North America’s largest documentary festival.


































































  

  
  
                    
                                                                                                                                
                            
                        Producer Sarah Schulman, me and Editor Ali Cotterill on opening night                  

  


  













































  

  
  
                    
                                                                                                                                
                            
                        Our fabulous audience opening night                  

  


  





  We had great audiences and Q&A’s, featuring local activists from AIDS Action Now. We were reminded that AIDS is not over, and United in Anger is desperately needed to tell the history of the movement, and to provide a roadmap for the future of AIDS activism.


































































  

  
  
                    
                                                                                                                                
                            
                        Tim McCaskell of AIDS Action Now, Hot Docs Programmer Heather Haynes and me                  

  


  





  We were pleasantly surprised to see that we made the cover of Xtra!


































































  

  
  
                    
                                                                                                                                
                            
                        Photo courtesy of Randi Cecchine                  

  


  





  Here’s some links to our press:Ten Hottest Docs to Watch at Hot Docs, IndiewireUnited in Protest: Documentary examines early years of AIDS activism, Xtra!See more photos of our Canadian premiere on Facebook.
























      
                              
  
  Ethan Shoshan


