 or different stories?5. In the film, director Jim Hubbard juxtaposes contemporary interviews, conducted 20-30 years after the fact, with archival footage of the same person when they were in ACT UP. What does this comparison reveal to you? Which of these juxtapositions is the most memorable?6. Why do you think Hubbard, like other AIDS video activists, chose not to use a narrator in his film, instead relying primarily on oral histories and archival footage? Why did he include no professional commentators, such as doctors, professors, or paid scientists? How does this decision affect your sense of history?Discussion Section 3: The Audience This section asks you to think about the relationship that various audiences (including you) might have to United in Anger. 1. What is your relationship to the film? Where are you watching it and why?2. What did you know about AIDS, AIDS activism and ACT UP before watching the film, and how did that knowledge or lack of knowledge influence how you received the film?3. Who do you think the intended audience is for the film. Why?4. If you watched this film in a class, how does it compare to other texts in your course? If you are familiar with other documentaries or AIDS narratives, how does the film compare to those?5. To whom would you recommend United in Anger and why? STUDY GUIDE HOME INTRODUCTORY LETTER PRE-VIEWING EXERCISESUNIT 1: HISTORICIZING ACT UP UNIT 1: DISCUSSION GUIDE UNIT 1: PROJECTS AND EXERCISES UNIT 1: RESOURCESUNIT 2: THE STRUCTURE OF ACT UP UNIT 2: DISCUSSION GUIDE UNIT 2: PROJECTS AND EXERCISES UNIT 2: RESOURCESUNIT 3: ACT UP IN THE STREETS UNIT 3: DISCUSSION GUIDE UNIT 3: PROJECTS AND EXERCISES UNIT 3: RESOURCESUNIT 4: THE POLITICS OF HIV/AIDS MEDICINE UNIT 4: DISCUSSION GUIDE UNIT 4: PROJECTS AND EXERCISES UNIT 4: RESOURCESUNIT 5: ACTIVIST ART UNIT 5: DISCUSSION GUIDE UNIT 5: PROJECTS AND EXERCISES UNIT 5: RESOURCESGLOSSARYCOLLECTED RESOURCES"
