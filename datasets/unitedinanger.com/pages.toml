              UNITED IN ANGER EDUCATIONAL DVD NOW AVAILABLE!              
                        Mar 11                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
                        Our audience at Yale February 27, 2012                  

  


  





  Want to share United in Anger: A History of ACT UP with your students?  The film and study guide are now available for schools, colleges, universities and libraries.Hundreds of students whose schools have already hosted screenings around the globe have learned about the legacy of ACT UP, most of them for the first time.After the film screened at Yale, George Chauncey, Chair of the LGBT Studies Program said, “My students, all of whom were born after ACT UP’s founding, were electrified, informed and inspired by United in Anger.  Nothing they had read about ACT UP had given them so vivid a sense of the militancy, courage, compassion, tactics, media smarts, and influence of the organization, or its complex internal culture and politics.  I plan to screen it every year in my LGBT history class, and highly recommend that other teachers do the same.”The Study Guide has been designed largely in response to feedback offered during many screenings of the film, primarily at national and international film festivals and in college classrooms over a number of years.  Many of the questions posed in the guide are ones asked by students and activists in their efforts to better understand the legacy of ACT UP, the film’s role in preserving that legacy, and its meaning for their own lives.  We are deeply appreciative to all those who have contributed their comments and questions.To purchase either a DVD or a streaming file of the film for an educational institution please contact Jim Hubbard at jim@jimhubbardfilms.com .
























      
                              
  
  Ethan Shoshan


https://www.disiterate.com
                  
                                                
  



  
  
  


  


      
                        
