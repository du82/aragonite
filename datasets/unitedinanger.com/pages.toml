                        Apr 30                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  Great review from the Toronto Film Scene!Stephanie Hubbard writes:“Despite knowing the basic history of ACT UP, I did not realize the intensity of their anger or have any real knowledge about the organization. There were moments during this documentary that brought me to tears, and although their methods to show the public just how many people AIDS has killed may seem unorthodox, they are incredibly haunting. In a stand-out protest from the ’90s a group activists scattered the ashes of their loved ones who had died of AIDS on the White House lawn. Moving, effective and incredibly sad.”
























      
                              
  
  Ethan Shoshan


