              PRESERVING THE HISTORY OF WOMEN IN ACT UP              
                        Apr 2                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  AfterEllen posted a great review of United in Anger today:“I’m encouraged to see so many women in the film. In my experience, most of the caretakers for dying AIDS victims were women — many lesbian and bisexual. Public action always drew large numbers of women, ready to unite with our brothers to bring attention to the disease and the lack of funding for research. Those of us who were activists then still have that bond with the men who survived. And thanks to United in Anger, that history will be preserved.”
























      
                              
  
  Ethan Shoshan


https://www.disiterate.com
                  
                                                
  



  
  
  


  


      
                        
