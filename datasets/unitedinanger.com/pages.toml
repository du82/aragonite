  Since our sold-out premiere at MoMA, everyone’s been asking when they can see United in Anger on the big screen in New York.  Now you can, during our week-long run at The Quad Cinema July 6-12!Daily showtimes are 1:00, 3:00, 5:30, 7:40 and 10:00.  Special Q&A’s:Jim Hubbard – July 6, 7, 8 and 10 at 7:40 screeningRon Goldberg – July 9 at 7:40 screeningAnn Northrop – July 11 at 7:40 screeningDeb Levine – July 12 at 7:40 screeningSave the date and bring all your friends!
























      
                              
  
