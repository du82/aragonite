                        May 23                Written By Ethan Shoshan                  
            










































  

  
  
                    
                                                                                                                                
                            
            

  


  





  We’re thrilled to announce that we’re in Frameline36-San Francisco International LGBT Film Festival. Jim Hubbard will be in attendance.Tuesday, June 1911:00amCastro TheatreFrom the Frameline site:“This fascinating documentary reveals the group’s complex culture, from its meetings to affinity groups to how it strategized on civil disobedience. Most importantly, the film demonstrates the ways in which ACT UP helped to shift how AIDS was represented in U.S. culture and responded to by the government.”  See more here.
























      
                              
  
