full_description = '''在知道Neurodiversity之后（2）unknown cat, Thu Sep 28 2023 • modeling myselfBack一些资料整理！ Spoon, Fork and Splines Theory: Spoon theory: People with chronic condition have only certain number of spoons everyday, never know how many spoons are there when waking up, and never know what will happen that will accidentally take more spoons than expected from hand. https://butyoudontlooksick.com/articles/written-by-christine/the-spoon-theory/ Fork theory: People have a "Fork Limit", which represents how many minor (or not minor) stressors or annoyances one can handle simultaneously without breaking down. http://jenrose.com/fork-theory/ Splines theory (my favorite one): This one extends the spoon theory. It states that every different task needs more time to load than NT, which is "reticulate the splines". No matter it's a hard task like writing/learning for hours, doing a project, or just "easy" ones like mailing boxes, making a phone call, different type of home chores, shopping for groceries, or just the going out action. Also reticulating splines can cost spoons. https://www.corbden.com/2013/10/splines-theory-spoons-metaphor-for.html Resources & Tips I Like: ASD日常生存工具包里有什么？ https://philome.la/jace_harr/you-feel-like-shit-an-interactive-self-care-guide/play/index.html https://www.hackingyouradhd.com/podcast 这个播客真的很不错！ 阿星球的阿星人bilibili 青衫Aspie，有微信公众号和网站 微信公众号：韦师生活妙招 （也有小红书） https://www.understood.org/ 长毛象孤独谱系障碍tag Executive Functions: https://neurowonderful.tumblr.com/post/133200389886/what-is-executive-functioning-how-do-people-use https://www.theottoolbox.com/adults-executive-function-disorder/ https://www.hackingyouradhd.com/podcast/executive-function https://www.scotthyoung.com/blog/2008/02/06/20-tips-for-batching-to-save-time-and-cut-stress/ Recipes which costs less spoons Decision Fatigue Autism Burnout & Pacing System 孤独症倦怠（Autistic Burnout） https://neurodivergentinsights.com/blog/how-to-use-pacing-systems https://neurodivergentinsights.com/blog/how-to-avoid-autistic-burnout Sensory & Meltdown: https://justkeepstimming.com/2018/04/07/managing-and-preventing-meltdowns/ weighted blanket roll yourself in a comforter or fabric you like Regulation & Emotion: https://www.theottoolbox.com/zones-of-regulation-activities/ box breathing exercises Ask for support https://thinkingautismguide.com/2022/01/autism-checklist-of-doom.html General Resources: https://thinkingautismguide.com/resources http://dart.ed.ac.uk/ https://autisticadvocacy.org/resources/ https://kpagination.wordpress.com/autism-resources/#beingautistic https://autisticscienceperson.com/resources/ 2023 © unknown cat.RSS'''
