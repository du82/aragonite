title = "在知道Neurodiversity之后（1）"
description = "unknown cat"
full_description = "在知道Neurodiversity之后（1）unknown cat, Wed Sep 06 2023 • modeling myselfBack五月中旬，我的微信对话框里出现了这样一个链接： 解读阿斯伯格：天赋的另一面 和好友都惊人的relate到文章里提到的很多东西，我们一起做起了里面的量表们。双双发现好几个结果过于贴近之后，做不下去了，互相在聊天栏里发出一些“草……………………”。 过后翻阅了各种各样的NeuroDiversity相关的文章和资料，觉得我自己可能在ASC里的某个点上。这个过程中我了解了很多ND trait，并意识到到已经用masking的方式生活很久了。比较开心的是，我在各种分享和网络上的信息里能获得目前需要的对自己的状况的解释和对生活的改善方法和tips，which are totally different from normal life hacks。 就，adult life is too hard for me，我希望自己是一只草履虫（。） 认识到这些之后，我对于从童年时期就开始听到的评价和自我评价有了很大的relief，比如：“你不要把所有事太当真”/“太敏感了”/“你怎么不和别人玩”/“你怎么总是一副死人脸”/“不合群”/“不懂人情世故”/“被保护的太好了”/“过于单纯”/“想太多”/“你这样怎么去社会上要不就呆学校里吧”等等。更大的一个relief是，ASC trait实际上也保护了幼年时期的我很多，比如不太被他人的评价影响，以及很难发觉自己被孤立。同时，我觉得我可以更好的认识到自己有哪些方面不应该勉强，不应该希望自己去完完全全改掉，大概就是对自己的接纳（摆烂）程度又往上提高了一个等级吧。 目前打算先整理一下自己有的ASC属性，并找到一个能帮助我更好地解释/support生活的模型。我看过最多的trait文章里面大概有一百条多，虽然看的时候一直在觉得啊我有这个我也有那个，但里面东西过于细碎，这里只先整理出比较重要和典型的几个类别，以及对我而言有很大影响的属性。 在开始之前我还想强调一点，每一个人，每一个ASC人都是不一样的。请不要给自己打标签。 泛自闭症表型（BAP）视频文字版 Glossary： AS = Asperger Syndrome ASC = Autism Spectrum Condition NT = Neurotypical ND = Neurodivergent 1）与人交往上的障碍 用一种神秘的第六感感知情绪而且会非常敏感，甚至会导致meltdown/shutdown 我会有时候各种情绪混在一起过于强烈突然哭出来，没有办法说怎么了。对我自己而言这像是身体里装不下那么多情绪，需要流出去一些。 述情障碍 对自己的情绪的描述只能归类为还行和糟糕（“反正就是不太舒服”，“不太好”，之类） ，不太能很好的理解和表达自己的情绪（谢谢情绪轮盘！正在学习！） 所以经常情绪太多又不知道怎么回事然后就哭，小时候因为爱哭经常被我妈骂：） 读空气差劲（缺乏非语言交流） 表达自己的困难： 我没有办法用语言表达我的头脑，始终觉得它们之间有一层隔阂 我好像没有办法教人东西，或者讲出我的思路，或者讲清楚讲明白我对什么东西的理解 理解他人的困难@社交场景： 我几乎95%的时候都会把玩笑或者客套话当真。如果同一个人经常说同一个玩笑我理解之后就能辨别，或者我对一个人足够了解足够熟悉了就能判断。这个点最开始出现是从小到大我都完全无法理解为什么我妈要假装邀请别人来家里玩，或者开玩笑问我一些奇怪的问题。觉得这个世界充满了困惑和不信任。 和新的人接触需要花一段时间对ta的行为模式进行分析和了解，尤其是经常接触的人。经常觉得在三次元的社交里遇到超出我认知的interaction，比如一个朋友突然把头靠在我的肩膀上（我以前几乎不能接受肢体接触），一个关系比较不错的同学突然尝了我的奶茶，我会感觉极度诧异。所以养成了飘在空中压抑自我感受进行人类观察的习惯…… 再次重复一遍，真的很难分辨客套话玩笑话谎话和真心话，所有话都当真。读不懂暗示。⇒ 所以不喜欢和人接触，觉得客观对象才是我的伙伴，比如书，电脑，MP3，和它们相处我才觉得熟悉和安全。 音调平板，不会在重要字词上加强语气，说话音量无法控制的过小或过大 不能眼神交流，对话过程中会有暂时性失聪（也可能是注意力突然消失） 难进行普通的社交活动，比如small talk，coffee chat，team building event，会特别消耗 清楚地知道自己是在模仿NT的社交照葫芦画瓢 年纪更小一点的时候我有更多的无视场景讨论在NT人眼里可能不合适讨论的内容的行为，说话时机不恰当或者不恰当回应别人说的话，后来学会闭嘴了（ 在社交活动之前我会提前想象会发生什么，应该说什么，over prepare，甚至是我去看医生也会…… 2）对环境变化的敏感 文章里relate的点： 对变化的过于敏感导致不喜欢变化：提前过度学习环境中会产生的各种波动，过度估计环境的变化 比如之前举过的例子，去社交场合之前过度预习 过度预习搬家，每次搬家我都会很早就开始焦虑，也会提前很就开始准备 没去过的要和人interaction地方会在门口徘徊很久不敢进去甚至可能直接退缩（可参考：波奇酱@孤独摇滚） “AS会建立起一套自己的规则体系，当世界如此运行时AS觉得舒服，当规则被打破时注意力会去到变化的地方。规则的打破带来的不可预测性产生了更多信息量，从而带来极大的焦虑，直到新的规则被建立。这使得多数AS更有道德，正义感，规则意识，以及固定习惯，刻板行为” “AS一直处于：观察环境分析归纳→建立规则→精神放松或集中注意专心做事(思路清晰)→规则打破（伴随着负面情绪）→观察环境分析归纳(焦虑，注意力经常放在环境的观察上)→建立新规则。这样的循环中。如果新规则迟迟无法建立起来，那AS会持续处于焦虑中，负面情绪持续时间过长就会导致抑郁。” 不太能灵活性的遵从各样规则，有一些固执的习惯或者常规 规则被打破并且新规则没有被建立的时候负面情绪过长导致了抑郁:（ 可以一直吃同一家餐馆的同一种食物（不是麦当劳！不过每次去麦当劳我都是点同样的，鸡块薯条冰淇淋……） “高可预测，低信息量的环境下会表现对感兴趣内容的高度专注，倾向于局部的思维模式会对该内容越陷越深。注意力取决于是否感兴趣，环境信息量，环境可预测性，焦虑程度。” 比如突然开始被非当前任务抓走了兴趣然后开始注意力漂移并且沉迷 文章里所说的“陷入某种跟负面情绪有关的内容导致陷入高效思考该负面内容的循环里”，或者“持续陷入令人亢奋的内容导致失眠”我也都有。（现在就是会很在意睡眠，注意提前wind down把大脑放空。） 只能做自己当前感兴趣的东西 我有一些进入就会浑身不适的场景，大多数都是低可预测环境+社恐共同的作用： 健身房（人越多越不敢进） 上学的时候，自己一个人进教室是需要极大的勇气的……人越多的教室需要的勇气越大…… 去任何一个活动也是，不敢自己一个人去，一定要找一个熟悉的人一起 除此之外注意力，固执或狭窄兴趣有关的情况，我可能还有一些ADHD的trait（也可能是ASD&ADHD common trait），尤其是inattentive。 从来，没有，办法，听讲。任何纯听的输入我可能只能坚持十分钟不到注意力就会消失，不论是不是感兴趣的内容。所以开会对我而言很难。 在社交场合/聚会里只跟感兴趣/关系好的人说话，如果一个都没有就感觉坐如针毡 不感兴趣的东西不想学 刻板行为 非常容易在听东西或者对话的时候走神 开车的时候会有注意力消失的瞬间 3）executive function working memory很差： 短期记忆特别差，刚刚读到或者听到的东西(尤其是听到的东西)容易忘，所以做一件事情的步骤变多就会很难去follow或者只能做前两步就去做别的了 三次元里时常在对话的时候突然失聪失忆不知道对面刚说了什么 task initiation很难： 任何一个事情即使我脑子里很想做特别想做，如果需要一些准备，步骤多，或者有一些前提条件我就很容易做不了： 如果健身房不在家楼下我就不会去 一想到瑜伽垫要拿出来铺好用完再收回去我就没有办法把它拿出来 有些事情需要但没有planning的时候想到要planning也会增加做它的obstacle general的开始做任何一件事情都很难，从前也经常被质疑是不是真的想做某件事情(我想但我做不了实在太正常了T T) 做事情的惯性很大（executive function + attention） 无法出门（x），如果出门一次会提前规划好路线把所有需要出门的事情全部做完 以前比较缺乏mental flexibility（也会导致更多的depression和anxiety）： routine change会引起很大的焦虑 曾经更容易钻牛角尖或者死胡同，听不进去话，比如别人说某个东西不可行我还想试试是不是确实不可行（努力克服了） 曾经更难不去抗拒/控制/逃避过去经历的重要个人事件及带来的痛苦感受/冲动/情绪（learned and practiced, still working on better acceptance） 无法归类在哪里所以放在这里的不良习惯：一件事情正在ongoing的时候会没办法上厕所（膀胱和肾脏正在哭泣），也没办法吃饭，会被喊吃饭喊很久 我很容易到晚上该睡觉了没有去换衣服刷牙或者洗澡的力气(aka spoon)，只能直接去床上睡觉 4）性别相关（Aspie女生的中性化） 我的性格比较gender stereotype neutral 从小就觉得gender不重要，不应当把人二元化 当然，生理性别我必须承认 5）other traits motor function problem： 随机把东西掉在地上，容易在做家务的时候因为遭遇过多的该事件而崩溃，手机绝对不能不套壳 上一点加上经常控制不好手上的力度，所以很怕掰东西和开易拉罐，几乎次次都掰飞，极度害怕厨房，易碎品，切东西 小时候因为总掉筷子，一掉我妈就很生气，拥有了过多的心理阴影 非常容易在身上见到不知道怎么受的伤，身体空间感受很差容易撞到磕到 没法穿紧身衣服，一点点紧都不行，会特别特别特别不舒服 消化系统受到一点点压力就会胀气 被子不能盖在脖子上 感官过载：（HSP&ASD共有trait）身体上的不适以及感官上的input很影响整个人的状态 有时候会因为很小的事情而生气/崩溃，比如碗和勺子之间碰到的声音，说话声 饿的时候整个人的心情会特别糟糕并且会发射到周围人身上 身体有疼痛的时候整个人都不太好，尤其是随机出现的疼痛会让心情骤然下降 过敏的时候就更不用提了 去滑雪的时候天气、风速、流鼻涕、衣服和鞋子舒不舒服、袖口和衣服粘了多少雪、护具和sports bra有没有把自己卡胀气……等等因素都会让我特别难受 好了，收工了！ 之后会整理一下各种我觉得不错的或者有用的参考资料，也试图去解释和建立一个自己生活上的系统。2023 © unknown cat.RSS"
