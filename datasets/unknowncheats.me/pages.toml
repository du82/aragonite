full_description = '''Elite: Dangerous From UnKnoWnCheaTs Game Hacking Wiki Jump to: navigation, search Elite: Dangerous Developer(s) Frontier Developments Engine COBRA Platform(s) MS Windows Release date(s) December 16, 2014 Genre(s) Space trading and combat, first-person shooter Mode(s) Online multiplayer, online single-player Contents 1 General Information 2 Game Hacking 2.1 Cheat Guides and Methods 2.2 The Poison Cabinet, advanced methods to get you banned 2.3 The Archive, this means old stuff 2.4 Threads 2.5 Firewall Guide General Information Elite: Dangerous is a space adventure, trading, and combat simulator that is the fourth release in the Elite video game series. Piloting a spaceship, the player explores a realistic 1:1 scale open world galaxy based on the real Milky Way, with the gameplay being open-ended. The game is the first in the series to attempt to feature massively multiplayer gameplay, with players' actions affecting the narrative story of the game's persistent universe, while also retaining single player options. It is the sequel to Frontier: First Encounters, the third game in the Elite series, released in 1995. Having been unable to agree to a funding deal with a publisher for many years, the developer began its Kickstarter campaign in November 2012. Pre-release test versions of the game had been available to backers since December 2013, and the final game was released for Windows on 16 December 2014. Game Hacking Cheat Guides and Methods These are cheats and hacks that fokus on being not detectable. But nonetheless: use at your own risk! EliteLua New Script with rewritten code! The Poison Cabinet, advanced methods to get you banned These cheats and hacks offer more functionality, but they are easy to spot for other players and can be recognizes in the server logs of FD. USE AT YOUR OWN RISK EVEN MORE! General usage Addon CT (maintained by hoki) The Archive, this means old stuff OLD Howto Cheats for v1.2.03/1.2.04 OLD Beginners Guide for v1.1.