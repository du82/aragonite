["https://unsongbook.com/chapter-57-now-taking-on-ahanias-form"]
title = "Unsong"
description = "The word of the LORD is a great deal of research activity in this area, and probabilistic algorithms have been fruitfully applied. — kingjamesprogramming.tumblr.com Evening, May 13, 2017 Citadel West Sohu asked whether I wanted to help her with the … Continue reading →"
full_description = "The word of the LORD is a great deal of research activity in this area, and probabilistic algorithms have been fruitfully applied. — kingjamesprogramming.tumblr.com Sohu asked whether I wanted to help her with the error correction process. It was the highlight of my life thus far. It was like getting asked to debate philosophy with Aristotle, or play one-on-one against Michael Jordan. Did I want to study the kabbalah with Sohu West? My heart leapt at the thought. So we walked through sunless streets until we reached a building on the perimeter, right up against the stone wall of the mountain. Sarah came with me, of course, I couldn’t help that, and Sohu led us up a staircase and down a long corridor to her study. Everywhere in the citadel seemed equally dreary, lit by fluorescent lights and built to exactly the sort of utilitarian specifications you would expect of a bunker, but Sohu’s study was full of books and a big oak table, and for a moment it reminded me of a hundred libraries and synagogues and classrooms I’d been in. The life of the mind was the same everywhere. We started working. Usually the hardest part of these things is to add up the gematria value of all the different subsets of letters, but of course Sarah did it instantly. The second-hardest part was figuring out which chapter of the books had the equations you needed, but Sohu had a photographic memory and would think for a second, pull a volume off the fourth shelf on the far wall, open it up to chapter sixteen, and put her finger halfway down the first page. “Um,” I said, trying to think quickly, “maybe if we see which Goldblum subsets are invariant under a temurah transformation, we could…” But Sohu interrupted. “For a non-supernally based Name like this one, that’s equivalent to a basic transformation of phonetic triplets,” she said. “Maharaj, 1992.” And before I could ask how she even knew that applied here, Sarah announced to us that all of the phonetic triplets checked out. By that point Sohu’s attention had been lost, and on she went to the next book, the next theory. “Any corresponding Psalms?” she asked, and before I could even remember exactly how many psalms there were Sarah shook her head and said that none of them corresponded."
