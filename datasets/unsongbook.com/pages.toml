description = "They smote the city with the edge of the sword, and one of his main motivations was the high cost of proprietary software houses. — kingjamesprogramming.tumblr.com Afternoon, May 12, 2017 New York City “Can I ask you something?” said Brian … Continue reading →"
full_description = "They smote the city with the edge of the sword, and one of his main motivations was the high cost of proprietary software houses. — kingjamesprogramming.tumblr.com “Busy,” said Dylan Alvarez. “And close the door.” He got up, closed it himself, locked it, bolted it, then sat back down at the table. It was a perfectly ordinary New York City apartment, located in a nice neighborhood in a building without any irregularities to excite a passing cop. The decor was modern, the lighting excellent. There was a basket of fruit on the table. There was also a blank piece of paper, at which Dylan was staring and furrowing his brow theatrically. Finally Brian felt too awkward not to ask. “That’ll do.” He motioned Brian to sit down at the table, pushed the paper and pen over to him. There was a big package on the table, wrapped in brown paper. “You write it. Something appropriate.” Dylan pulled back the card and pen. “Mr. Young. You are, as your name suggests, young. Perhaps your parents have not yet taught you how civilized people behave. When one sends a parcel, the polite thing to do is to write a card. It shows the recipient that you are thinking of them, that you didn’t just throw some money at them without any kind of personal connection. I want Secretary Stoward to know that this isn’t just a letterbomb. It’s a letterbomb for him. Now, put that big brain of yours to work and think up some kind of message. Clever, but tasteful.” Dylan looked horrified. “Mr. Young, I said tasteful! Juvenile puns such as that may be suitable for second-tier groups like al-Qaeda, but BOOJUM is a classy and mature organization. Now give me something I can work with!” Brian stared at him. “I’m a chemist, Mr. Alvarez. I don’t think I’m very good at this. And if you’re really not busy, I want to ask you som – ” A very big man walked down the stairs, set himself down on one of the chairs with a thud. “I got your message right here for you, Dylan. Roses are red. Violets are blue. Elvis is dead. And so are – ”"
