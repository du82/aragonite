["http://unsongbook.com/chapter-31-the-foundation-of-empire"]
title = "Unsong"
description = "Together, we can build a better America, colonize it, and use the old one for raw materials and target practice. — Steven Kaas January 30, 1981 Camp David, Maryland I. The song goes: Who can retell The things that befell … Continue reading →"
full_description = "Together, we can build a better America, colonize it, and use the old one for raw materials and target practice. — Steven Kaas Who can retell The things that befell Us so long ago? But in every age A hero or sage Came to our aid As the 1970s drew to a close, America was at a low point. The armies of Thamiel had been defeated by twin miracles in the East and West. But technology and infrastructure were still shattered, the state governments could barely maintain order, and outside the Eastern Seaboard the country was still divided into the regional powers that had taken over after Nixon’s fall. When he came, it was out of California. A popular governor had been presumed dead in the chaos; now he reappeared, restoring order to the fledgling California Republic. When he talked, people listened. Matthew 7:28 – “For he spoke as one having authority, and not as the scribes and Pharisees”. He traveled the land, talking about the American Dream, and where he went the impossible seemed possible. People dropped their quarrels and swore loyalty. John 7:46 – “Never man spake like this man.” There had been no midterm election in 1978. The war was too desperate, lines of communication too frayed. Nobody had expected an election in 1980 either. But now the impossible seemed possible. The remnants of the federal government in Washington came together to make it happen. By train or ship or ox-cart, the votes rolled in, steering carefully around the smoking ruins of the Midwest. The ballots were counted. The results had never been in doubt. It was the biggest landslide in American history. And so on January 20, 1981, Ronald Reagan stood in front of the Capitol Building and declared that it was morning in America. In 1 Samuel, King Saul of Israel has grown paranoid and is trying to kill his former general David. David has only 600 men; Saul has 3000; open battle would be suicide. So David waits for cover of night, and along with his friend Abishai he sneaks into Saul’s camp. They steal a spear and water jug from the sleeping Saul. The next morning, they show off their treasures. Saul realizes that David could have killed him in his sleep; that he chose to spare the king’s life proved that he must still be loyal. There in his camp Saul embraced young David and begged his forgiveness for his former suspicion. David, for his part, kneels before Saul and swears a renewed oath of loyalty."
