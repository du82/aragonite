title = "Unsong"
description = "Art, starting with a cover for Kabbalah: A Modern Approach (I can’t find the original artist, tell me who you are so I can give you credit!): And by Tumblr user topquarkintown, Uriel stacking twelve-dimensional shapes: …and Erica: Here’s a … Continue reading →"
full_description = "Art, starting with a cover for Kabbalah: A Modern Approach (I can’t find the original artist, tell me who you are so I can give you credit!): Jaskologist on a theory of magic vanishing from the universe. His timeline matches Unsong’s pretty well. Also, more Jaskologist on magic. “Schroeder believes, quite earnestly, that the city of Indianapolis was built to be a gateway to Hell by Masonic pagans” (h/t deusvulture) Plot-relevant articles: Bush’s inaugural address, Lovecraft’s Fungi From Yuggoth, Obama and Trump in Bible prophecy, chashmal (and more), telepathy in kabbalah, God killing 2.8 million people in the Bible, Irving Greenberg and Holocaust theology, Cathar parfaits, Derek Parfit. Thanks to everyone who said hi to me and talked to me about Unsong at the Asilomar conference. I have to say, it’s scary enough knowing that cool Silicon Valley people read Slate Star Codex. Knowing that some of them read Unsong is just a little too much for me. Here’s a picture from the conference of me with Sam Teller, a director at SpaceX. Cf. Chapter 10 – “The kabbalistic meaning [of Teller] is ‘someone who calls down destructive celestial energies'”! Also, shirt orders closed today. Thanks to everyone who ordered one – demand went way beyond expectations (something like a hundred shirts overall), so it’ll take me a few days to mail them all (also, affirming the “people are basically good” theory is the number of people who sent extra money just in case it ended up costing me more than expected). (Note: if you’re the person who filled in their email in the mailing address space and also didn’t reply to my email asking where to mail the shirt, please email me your address so I know where to mail your shirt). depends on your shirt size – the people who forgot their address also didn’t pay (and aren’t answering my email), so I’m leaning towards offering their shirts to anyone who’s late and wants one. (email me at the rot13 of funxrq.xbcyrjvgm gmail com if you want to check)."
