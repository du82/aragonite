full_description = "[A picture of a ship with bright multicolored sails in front of a city with various strange skyscrapers. The text says “Your faith was strong but you needed proof / Hay hay yud tav mem tav vav kuf / A ship on which another sailed before us / She saw his flag on the highest mast / She saw a dream that couldn’t last / The Comet King receiving haMephorash – Leonard Cohen, HaMephorash”. City image by a reader who wishes to remain unnamed; ship image is a photoshop of this concept yacht] Your faith was strong but you needed proof You saw her bathing on the roof Her beauty and the moonlight overthrew you She tied you to a kitchen chair She broke your throne, and she cut your hair And from your lips she drew the Hallelujah Pattern detected: first line is the same each time. Therefore (thank you Google) the next verse will likely start “I did not take the Name in vain”. Also, although Pickle is mostly right, I sort of blended it with the Jeff Buckley version (“I’ve seen your flag on the marble arch”). Nope. First line of first verse of “Hallelujah” ends with “chord”, that of “HaMephorash” ends with “word”. You say I took the Name in vain I don’t even know the Name But if I did, well really, what’s it to ya? There’s a blaze of light in every word It doesn’t matter which you heard The holy or the broken Hallelujah Actually yeah… we’ve heard a lot about “Royal Colorado”, but who’s king there now that TCK is dead? The last we heard out of Colorado, someone called the Other King was laying siege to “the West children”, which presumably means the Cometspawn. So “Royal Colorado” may be a reference to the Other King’s monarchy, to whoever the Comet King’s heir was, or just to the fact that it used to be the Comet King’s seat. I think it’s unlikely that there’s a legitimate heir in power, though, given how much of a mess things are. I think the simplest explanation is just that it refers to the Comet King’s domain (or former domain, I guess). But it’s possible that the Other King succeeded the Comet King, making it all three."
