["http://unsongbook.com/interlude-%D7%9C-new-york-city"]
title = "Unsong"
description = "September 3, 1978 New York City I. Flanked by two guards, Mayor Ed Koch walked into the room. It seemed out of place in the middle of New York City. Poorly lit, musty, packed with books of diffent ages and … Continue reading →"
full_description = "It seemed out of place in the middle of New York City. Poorly lit, musty, packed with books of diffent ages and provenances. The furniture was all wooden, and either antique or made by someone with a dim view of aesthetic innovations after about 1800. And then there was the man in the ornate wooden chair. He was old too. And he looked older than he was. His beard was long and white, and his clothing cut from the same aesthetic mold as his furniture. And in another sense he looked too young, like at any moment he could jump up and start singing. The Rebbe had a funny way of showing it. He’d made the Mayor wait until midnight for an appointment – that was always the rule, too busy with religious functions during the day – and then Koch had to wait outside while the Rebbe adjudicated a dispute between two elderly Jewish men who had come in before him and were apparently arguing about ownership of a goat. Who even had goats in Brooklyn? But Koch’s aides had warned him about this. It was first-come-first-served with the Rebbe, honors and offices gained you nothing, and you visited him on his terms or not at all. “Rabbi Schneerson,” said the Mayor. “I’m sorry I haven’t visited you in so long. I do value your advice. But politics!” He waved his arm in a gesture of dismissal. “You know how it is!” Koch never knew whether to feel intimidated by the Rebbe or hug him. He had a sweet face, almost angelic-looking. But his light blue eyes were unusual, very unusual, and there was a lurking power in the old man, like a coiled snake. Koch just nodded. “You’ve heard what’s been happening,” he said, then realized he might not have. What did the Rebbe hear? He could have believed the man knew everything that happened in the furthest corner of the Earth, but he could also have believed that news of the Industrial Revolution hadn’t quite reached him yet. “After the federal government collapsed, the demons broke their alliance. They swept down into Canada. What was left of the Army went up to stop them. There were a lot of battles. They won. It took two years, but Canada’s fallen. Now they’ve crossed the border into the US. Two attacks. One to the west, straight down the plains from Saskatchewan, bearing down on Salt Lake City. The other to the east, due south from Ottawa. They’ve got to be headed for New York City. The US Army’s in shambles; President Carter has promised to dispatch a couple of people up here but it’s not enough, he’s mostly worried about DC. Governor Carey has called up the state militia, but it’s not enough. And – I feel silly even asking this, but I was wondering if you might have some way of getting some, you know, supernatural aid.”"
