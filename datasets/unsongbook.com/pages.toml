["https://unsongbook.com/chapter-70-nor-for-itself-hath-any-care"]
title = "Unsong"
description = "Evening, May 14, 2017 Colorado Springs I. It was called Tava, or “sun mountain”, by the Ute. El Capitan, meaning “the leader”, by the Spanish. But its modern name “Pike’s Peak” comes from explorer Zebulon Pike, and his name in … Continue reading →"
full_description = "It was called Tava, or “sun mountain”, by the Ute. El Capitan, meaning “the leader”, by the Spanish. But its modern name “Pike’s Peak” comes from explorer Zebulon Pike, and his name in turn comes from the Biblical Zebulon, son of Jacob. Moses says in Deuteronomy 33: “Rejoice, Zebulon, in your journeys. You call the people to your mountain, and there they will offer a sacrifice of the righteous.” Taken to refer to Mr. Pike, the journeys part checks out. The mountain part definitely checks out. The sacrifice of the righteous part is kind of obscure. Sohu hoped, as she rematerialized on the summit of Pike’s Peak, that it didn’t have anything to do with her. She had chosen her terrain carefully. She was north of Citadel West; Thamiel would have to come through here to get to her family. She could see in every direction. The bunker to her south, the highway to her north, the city to her east. If she had to do something drastic, she was far enough from human habitation that they would escape collateral damage. Poor, lovely Colorado Springs! It was so small from up here, still smaller than Denver after forty years as the capital. They all thought her father had decided to stay because of the bunker, or the air force base, or the nuclear silos scattered in the hills. But he’d stayed because it was where he’d grown up, and that was always the thing that scared him, losing his humanity, falling completely into his form of stars and fire and night. Colorado Springs was small and lovely and it was home, and even when he was two thousand feet underground in the mountain it had been near and that had made him happy. She felt it before she saw it, a low buzz that seemed to wax and wane like the beating of an enormous heart. Then it filled the northern sky, a cross between a black storm cloud and a colony of bats. She had seen Thamiel before, but never this, never an entire host. It saw her. The dark cloud changed directions, headed right towards her. Its radius must have measured miles. Finally it was atop her, buzzing over her, like her own personal rainstorm."
