["https://unsongbook.com/interlude-%d7%a1-binary"]
title = "Unsong"
description = "“Today I will expound unto you the kabbalistic theory of the creation of the world,” said Ana. “It all starts with Leibniz…” We were sitting together on the couch after dinner. Erica and Eli Foss were on the other couch. … Continue reading →"
full_description = "“Today I will expound unto you the kabbalistic theory of the creation of the world,” said Ana. “It all starts with Leibniz…” We were sitting together on the couch after dinner. Erica and Eli Foss were on the other couch. Zoe Farr was in the armchair. Ana was wearing a blue t-shirt saying “I WENT TO THEODICY CON 2014 AND ALL I GOT WAS THIS CRAPPY TSHIRT, AND I DON’T UNDERSTAND WHY A JUST GOD WOULD ALLOW THIS TO HAPPEN.” It was pouring outside, and the occasional gust of wind added eerie punctuation to her argument. “See, there’s this idea called divine simplicity. People keep asking, okay, so God created the Universe, but who created God? The answer is that God doesn’t need creating. He’s perfectly simple. He’s just a natural thing for there to be. People act like you need God to explain why the universe isn’t just nothing. But why should the Universe be nothing? Why shouldn’t it be, I don’t know, a piece of bread? The only reason people think ‘nothing’ needs no explanation, but a piece of bread does need an explanation, is that nothing is simpler than bread. Well, God is just as simple as nothing. So there.” “I’m getting to Leibniz! Right now we’re at information theory. A well-defined mathematical explanation of simplicity. We can measure the complexity of a concept in bits. The number of binary digits it would take to specify the concept in some reasonable encoding system. We can do it with numbers. The numbers 0 and 1 are one bit. Two is 10, three is 11; those are two bits. Four is 100, five is 101, six is 110, seven is 111; so three bits. And so on. We can do it with computer programs; just count how many bits and bytes they take up on a computer. We can do it with images if you can get them into a format like .gif or .jpg. And we can do it with material objects. All you have to do is figure out how long it would take to write a program that specifies a description of the material object to the right level of complexity. There are already weather simulators. However many bits the most efficient one of those is, that’s how complex the weather is.”"
