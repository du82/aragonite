["https://unsongbook.com/interlude-%d7%90-the-cracks-in-the-sky"]
title = "Unsong"
description = "March 14, 1969 Washington, DC Richard Nixon was confused and upset. It wasn’t that he hadn’t expected problems. He’d only been on the job six weeks, but he knew a president had to be ready for anything. But “anything” was … Continue reading →"
full_description = "It wasn’t that he hadn’t expected problems. He’d only been on the job six weeks, but he knew a president had to be ready for anything. But “anything” was supposed to mean economic downturns, or crime waves, or The Russians. Instead Apollo 8 had crashed into some kind of weird space glass, the sky was cracking open, the clouds were forming ominous patterns, and Tuesdays had stopped happening. The Tuesdays were the most worrying part. For the past three weeks, people all over the world had gone to sleep on Monday and woken up Wednesday. Everything had been in order. The factories had kept running. Lawns had been mowed. Some basic office work had even gotten done. But of the preceding twenty-four hours, no one had any memories. Today was a Friday, and it had happened three times. The President had gone to sleep Friday night, and woken up Friday morning to a call from the Chief of Staff telling him that everyone was very upset because it was Friday morning again and how was this happening? Everything that had happened in the past twenty-four hours had unhappened, been rolled back somehow. Or maybe everyone’s Saturday-morning consciousness had been shot back into their Friday-morning bodies. He had no idea, and the American people were starting to demand answers. He’d called the head of the CIA and asked him to get whatever department full of eggheads had covered up Roswell as a weather balloon, tell them to concoct some plausible story for whatever chronological tomfoolery was going on now. The head of the CIA had just stood there, unflappable. “Mr. President, Roswell was a weather balloon. There was no cover-up. Our organization has no department dedicated to covering up inexplicable events.” “I’m the [expletive deleted] President, Helms!” Nixon had shouted. “You don’t have to lie to me! Get me your cover-up eggheads immediately!” “[expletive deleted] [expletive deleted]”, Nixon had answered. “Get the [expletive deleted] out of here!”"
