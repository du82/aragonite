["https://unsongbook.com/interlude-%d7%98-the-general-assembly"]
title = "Unsong"
description = "And Satan stood up against them in the global environment. — kingjamesprogramming.tumblr.com December 14, 1972 New York City “Ladies. Gentlemen. Mr. Secretary General. We are a proud people. Like so many of the other fledgling countries represented here today, our … Continue reading →"
full_description = "We are a proud people. Like so many of the other fledgling countries represented here today, our national identity was forged in a struggle against imperialist aggression, and it was our pride that told us to continue fighting when all other counsel urged surrender. It is with that same pride that I stand before you today as the newest member of the United Nations, honored to at last be recognized as part of the world community. I am not the monster you think. In my spare time, I play the violin competitively. I help blind children. I raise awareness of healthy plant-based foods. And my country? We are not your enemy. We are strange, yes. But we share the same values as all of you, the same drive to build a more just and equitable world. What the American Dream is in fantasy, we are in reality. We accept everyone alike, regardless of race, color, or creed. We put up no barbed wire, we turn back no boats full of refugees. We take heart in the old words of Emma Lazarus: give me your tired, your poor. Your huddled masses, yearning to breathe free. The wretched refuse of your teeming shore. Send them, your homeless, your tempest-tossed, to me. And send them you do, a tide of humanity struggling toward our gates with a desperation that puts Ellis Island to shame, and we turn none back, nay, not even the meanest. Especially not the meanest. What the workers’ paradise of the Soviets aspires toward, we have reached. There are no class distinctions: slave is treated the same as sultan, stockbroker the same as sailor. The almighty dollar has been cast low; no one need worry about hunger or illness, nor shiver in the cold for want of a home. Private property has been abolished, yet none feel its want. Marx describes capitalist society as “everlasting uncertainty and agitation”, but within our borders precisely the opposite prevails. We do not persecute dissidents. We do not censor the media. We do not pollute. We treat men and women equally. We allow the practice of any or no religion. We fund no terrorists. We build no bombs. Our criminal justice system is free from bias, and its punishments are always just."
