title = "Unsong"
description = "Where wast thou when I laid the foundations for theoretical computer science? — kingjamesprogramming.tumblr.com 3??? BC Heaven I. Beyond the nimbus and stratus, in the furthest reaches of the heavens, the parliament of the angels convened in the eye of … Continue reading →"
full_description = "Where wast thou when I laid the foundations for theoretical computer science? — kingjamesprogramming.tumblr.com Beyond the nimbus and stratus, in the furthest reaches of the heavens, the parliament of the angels convened in the eye of a great cyclone. The walls of the storm curved in toward the center, so that they formed tier upon tier of seating for the angelic hosts. At the very bottom and in the very center was a whirlwind that concealed the archangel Metatron, the expression of God in the created world. Seated around him were thrones for the nine other archangels. Above them in concentric circles based on rank sat various cherubim, seraphim, ophanim, dominions, powers, principalities, weird lamb-dragon hybrids with hundreds of faces, glowing starlike beings rapt in meditation, geometric shapes covered with lidless golden eyes, and others even harder to describe. Metatron did not speak. Metatron never spoke. No one was worthy to hear the voice of Metatron. Raziel was missing, as always, out doing his thing, whatever Raziel’s thing was. That left Sataniel as highest-ranking. Sataniel, the morning star, the amber-hued, the bringer of dawn, the beautiful, peerless in understanding, gracious in mercy. For the past aeon, even Sataniel had been gone, off exploring the inner core of the world, and it had been Zadkiel who had held the golden feather that represented dominion, who had conducted the choirs and moved some to sound and others to silence. Now Sataniel had returned, and it was with joy and humility that Zadkiel handed over the feather and sat back down upon his throne of cloudstuff and carnelian. “My brothers,” said Sataniel, “for an aeon of the world, I have been exploring the very center of the Earth. Now, by the mercy of God, blessed be His holy Name, I have returned.” At the mention of God, all the assembled angels broke out into applause and cheering for seven days and seven nights. When the euphoria died down, Sataniel again raised the golden feather and spoke."
