["http://unsongbook.com/chapter-18-no-earthly-parents-i-confess"]
title = "Unsong"
description = "Said the night wind to the little lamb, Do you see what I see? Way up in the sky, little lamb, Do you see what I see? A star, a star, dancing in the night With a tail as big … Continue reading →"
full_description = "Said the night wind to the little lamb, Do you see what I see? Way up in the sky, little lamb, Do you see what I see? A star, a star, dancing in the night With a tail as big as a kite — Noël Regney, Do You Hear What I Hear? “Maiden” can mean either “young woman” or “virgin”. Its Greek and Hebrew equivalents have the same ambiguity, which is why some people think the person we call the Virgin Mary was actually supposed to be the Young Woman Mary – which might change the significance of her subsequent pregnancy a bit. People grew up faster, back in the days when they spoke of “maidens”. Mary was probably only fourteen when she gave birth. I am a kabbalist. Words matter. Nowadays we have replaced “maiden” with “teenage girl”. A maiden and a teenager are the same thing, but their names drag different tracks through lexical space, stir up different waters. Synonymity aside, some young women are maidens and others are teenagers. The girl in our story was definitely a maiden, even though it was the 1970s and being a maiden was somewhat out of fashion. She was hiking with her brother in the hills of Colorado; while he dozed off in a meadow, she had wandered off exploring. She had gotten lost, and decided to climb a hill to see what she could see from the top. But the hill had been higher than she had first judged, and it had grown dark, and now she sat upon the summit and looked out at the stars. Violently they shone, far brighter than in the lamplit valleys of her home, so white they were almost blue. The Milky Way shone a phosphoric ribbon, and the cracks in the sky made a glowing lattice like a spiderweb of light. There was another power in Heaven tonight. Behold Comet West, the Great Comet of 1976. It shot exultant through the winter sky, laughing as it felt the void against its icy skin. It flamed over peaks and rivers and countries and oceans, until at last it flew over the Continental Divide and reached its namesake. The true West strong and free. And there it alit upon the highest of the Rocky Mountains, pausing in contemplation, and no one but our maiden saw it land."
