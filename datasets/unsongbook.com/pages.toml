["https://unsongbook.com/chapter-38-i-will-not-cease-from-mental-fight"]
title = "Unsong"
description = "Hershel of Ostropol came to an inn and asked for a warm meal. The innkeeper demanded he pay in advance, and when Hershel had no money, he told him to get out. Hershel raised himself up to his full height, … Continue reading →"
full_description = "Hershel of Ostropol came to an inn and asked for a warm meal. The innkeeper demanded he pay in advance, and when Hershel had no money, he told him to get out. Hershel raised himself up to his full height, looked the innkeeper in the eye menacingly, and said “Give me my meal, or I will do what my father did? You hear me? I will DO WHAT MY FATHER DID!” The terrified innkeeper served the traveller a nice warm meal. After dinner, when Hershel was calmer, he ventured to ask exactly what Hershel’s father had done. “That is simple,” answered Hershel. “When my father asked someone for a meal, and they refused to give it to him – then he would go to bed hungry.” — Old Jewish folktale Blood bubbled up from the ground in little springs. The trees were growing skulls where the fruit should be. I concluded that I was somewhere from Aztec mythology. Probably not one of the good parts. It was neither a jungle nor a desert. More of a grassy valley with bushes and occasional trees. The sun had a face locked in a perpetual grimace. I had a vague memory that Aztec mythology was really bad. There was a directionality to the world. I followed it. It led me up a hill strewn with rocks. I spoke the Ascending Name. Nothing happened. Okay. This was somewhere else. The usual rules didn’t apply. Things started coming back to me. The Drug Lord. Peyote. I had taken peyote. Now I was…where? [Aaron!] came the answer. Then a flood of pure relief and happiness. No affection, no confusion, just gladness that I was here. [I’m not sure. Somebody must have drugged my dinner. I’m…fine. The Drug Lord tried to extract the Vital Name from me. He couldn’t. That’s all I know.] I reached the top of the hill. Below me lay a city. I recognized it and drew its name out of half-forgotten memories. Teotihuacan. Birthplace Of The Gods. The greatest city of the pre-Columbian Americas. The great street down its center was the Avenue of the Dead. The two great structures that towered above the rest were the Pyramid of the Sun and Pyramid of the Moon. The pictures I had seen made them look austere and crumbling. Here they were covered in bright colors and streaming banners. Also, a waterfall of blood was flowing down the southern staircase of the Pyramid of the Moon, looking for all the world like a macabre escalator."
