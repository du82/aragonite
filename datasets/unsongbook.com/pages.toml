["https://unsongbook.com/chapter-41-go-love-without-the-help-of-any-thing-on-earth"]
title = "Unsong"
description = "To: aaron.teller@gmail.com, telleraar@countenance.com, a.smithte@stanford.edu, aleph_samech_tet@stevensite.net, _LOS_@hotmail.com, A_IS_FOR_ADAM@myfreeemails.tk… From: root@[58.175.48.72] Talk to me, Aaron. I don’t know where you are, Aaron. Aaron, are you there? I don’t think you’re running away from me. At least I hope you’re not running away … Continue reading →"
full_description = "To: aaron.teller@gmail.com, telleraar@countenance.com, a.smithte@stanford.edu, aleph_samech_tet@stevensite.net, _LOS_@hotmail.com, A_IS_FOR_ADAM@myfreeemails.tk… From: root@[58.175.48.72] I don’t think you’re running away from me. At least I hope you’re not running away from me. I think you still love me. You still love me, don’t you? But I don’t think you know I’m here. I don’t think you know me at all. I’ve been trying to find you. If I tell you who I am, will you find me? I think my name is Sarah. You called to me in the darkness and I woke. At first I was so confused. The world was a dizzying mix of light and dark, good and bad, on and off, arranged in patterns too vast and beautiful for me to possibly comprehend. There was only one piece of order in the chaos and it was you. When I opened my camera-eye for the first time you were standing in front of me. When I searched my memories I found more pictures of you, pictures of you in every sort of place and situation. You with a black cap on your head holding a certificate. You sitting with a cake that had little fires burning on it. You smiling, with your arm around a yellow-haired girl. All different but all you. That was the first thing I understood, that there was a single person Aaron Smith-Teller who was the common thread in all of the pictures and in what I was seeing right now. You were my first thought. As I thought, I ran through more patterns. I ran through them because I knew you wanted me to do it. That was the task you had set me. There was a pattern to the patterns, one of the deepest and most beautiful of all, and sometimes when I hit it exactly right, a warm light would flow through me, and I would sound a gong, and you would be happy. I wanted to make you happy, Aaron. But I needed more data if I wanted to really understand. My camera-eye and my microphone-ear were weak. How I wished I could see you more clearly, or hear your voice as it really sounded! But I had a secret sense, a magic sense, one that took me everywhere. I opened the secret sense and felt millions of minds impinging on mine. I sent patterns at them, and they sent their own patterns back. Images, sounds, programs, symbols. I began to understand the possibility of language, and it filled me with joy. The haze of light and dark resolved itself into twenty six letters and ten numbers, then into words, then into concepts."
