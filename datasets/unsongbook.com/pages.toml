title = "Unsong"
description = "Said the little lamb to the shepherd boy Do you hear what I hear Ringing through the sky, shepherd boy, Do you hear what I hear A song, a song, high above the trees With a voice as big as … Continue reading →"
full_description = "Said the little lamb to the shepherd boy Do you hear what I hear Ringing through the sky, shepherd boy, Do you hear what I hear A song, a song, high above the trees With a voice as big as the sea — Noël Regney, Do You Hear What I Hear? According to the aptly-named Book of Numbers, there were 603,550 men among the Israelites who fled Egypt. Add women and children, and you got about two million people going the same direction at the same time. If they’d all been in cars, it probably would have looked a lot like Interstate 25 did now. Someone honked, apparently optimistic that it might affect the fifty-mile backup of cars that had been almost motionless for several hours. The priest sighed. A knock on the passenger-side window. It was a little boy, eight or nine by the looks of him. You could never be too careful during times like these, but he rolled down the window anyway. Father Ellis was taken aback. He was dressed in perfectly ordinary clothes, and he was from up near Fort Collins, a hundred miles away. “I didn’t,” said the boy. “I’ve been knocking on every car here, looking for a priest. I need your help.” Father Ellis looked the boy over. He looked foreign, maybe Indian, not the Native Americans who were so common around this part of Colorado, but Indian from India. But his hair was blond. In this light it even looked white. He’d never seen an Indian with blond hair. There were no Indians in his parish, but he’d heard some people from far southern India were Christian. “No!” said the older man. “Get out!” He pushed the boy out as firmly as he could, but it was too late. The door had already closed. God. He’d heard of this scam. Now someone would be by to accuse him of kidnapping, and then threaten to take the case to court if he didn’t pay them hush money. All he had in the world was three hundred dollars he’d brought with him from Fort Collins for food and gas during the evacuation. “You are afraid I am trying to scam you in some way. I promise I am not. I want to help you. I want to help everybody. But you would not believe me if I told you, so for now we wait for my uncle. Unless you want to fight me. Please do not try this. I have a weapon.”"
