["https://unsongbook.com/postscript-1-wrap-parties-fan-music"]
title = "Unsong"
description = "It’s kabbalistically important that there only be ten author’s notes, so this is a postscript even though the book isn’t technically finished yet. The Berkeley wrap party will be at 4:30 on Sunday, location and directions here. There is no … Continue reading →"
full_description = "It’s kabbalistically important that there only be ten author’s notes, so this is a postscript even though the book isn’t technically finished yet. The Berkeley wrap party will be at 4:30 on Sunday, location and directions here. There is no entrance fee, but donations to help cover the cost of the venue would be appreciated. Other wrap parties include NYC, Tel Aviv, Boston; and Austin; I’m bolding the last one since I missed mentioning it on the last chapter. I’m planning to release Chapter 72 around 8 PM EST on Sunday. If you’re going to hold a wrap party, want to read the chapter at the party, and need it before then, I can email it to you a little early (may not have last minute edits). If you want to do this, comment here with your email address. There will be an Epilogue published next Wednesday. I’m still not sure whether I’ll read it at the wrap party. Let’s see how my voice is doing. And James Koppel has an Unsong filk song “Far Into The Kingdom Of Heaven Bright” up here at his Soundcloud. I don’t know about the first one, but Scott has mentioned that he’s been approached by multiple publishing companies. Scott mentioned that he wants to do it sometime, but probably not anytime soon because he has a bunch of stuff going on right now. I have a question. I do not understand the difference between the four worlds within the tree of life and the worlds in God’s garden We’re trying to do an Oxford wrap party at the FHI, though we may not get enough people for it to count as a “party”. COMPLETELY random? I guess ask the organizers, but I assume that most of the attendees will be people who’ve been reading the book and are caught up to the last chapter. Scott has, before past SSC meetups, emphatically stated that “If you are reading this, you are invited.” I cannot imagine that someone who has read Unsong and is posting here would somehow still not be specific enough to attend any particular Unsong wrap party. Thank you, Michael Blume for posting this. I had expected Chapter 72 to have been published by 8PM Eastern on Sunday and when it hadn’t been I went looking to find out when it might be. And found this. Just as the Baysean Choir finished and just before Scott stepped up to read."
