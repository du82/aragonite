["http://unsongbook.com/chapter-44-a-world-within-opening-its-gates"]
title = "Unsong"
description = "The LORD sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give unto all this evil that was come to the decisive step of mathematical abstraction — kingjamesprogramming.tumblr.com 1993 Gulf Of Mexico I. “TELL ME,” said Uriel, … Continue reading →"
full_description = "The LORD sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give unto all this evil that was come to the decisive step of mathematical abstraction — kingjamesprogramming.tumblr.com “Well,” said Sohu, “the Hebrew root contains the three letters kuf, bet, and lamed, and means ‘tradition’. Kuf connects Binah to Hesed, and Bet goes from Chokmah to Hesed, so both cross the Abyss and symbolize something transmitted from God to Man. Lamed, on the other hand, goes to Yesod, which signals the background superstructure of the universe. So the whole effect is one of hidden knowledge that points to the Divine, meaning that the connotations of the individual letters perfectly match the connotation of the word, exactly as would be expected.” “We find analogues in almost every other language. For example, the Arabic ‘qibla’ means the direction you face to pray, which is also about pointing to the Divine, albeit in a more literal sense. In Hindu myth, the sage who brought the secret divine knowledge to Earth was named ‘Kapila’. The Latin ‘capella’ means cloak, which is also about secrets and hidden things, as is the English ‘cabal’, and even the English ‘cable’ if you think of it as an undersea cable transmitting information below the surface. Also some version of the word ‘chaplain’ or ‘kaplan’ means ‘priest’ in pretty much every European language.” “THAT IS RIGHT AND YOU ARE GOOD,” said the angel, but he was fidgeting with his hands. It was never good when he was fidgeting with his hands. “All right! Fine! Out with it!” said Sohu. “This is even more annoying than when you criticize me. What did I forget?” Sohu let out a sigh. “Nothing,” she said. “I make nothing of Turkish. What does a tiger have to do with hidden divine knowledge anyway?” AND WHAT SHOULDER, AND WHAT ART COULD TWIST THE SINEWS OF THY HEART? AND WHEN THY HEART BEGAN TO BEAT, WHAT DREAD HAND AND WHAT DREAD FEET? WHAT THE HAMMER? WHAT THE CHAIN? IN WHAT FURNACE WAS THY BRAIN? WHAT THE ANVIL? WHAT DREAD GRASP? DARE ITS DEADLY TERRORS CLASP?”"
