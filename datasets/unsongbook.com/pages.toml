["https://unsongbook.com/interlude-%d7%96-man-on-the-sphere"]
title = "Unsong"
description = "Let’s play Twister, let’s play Risk See you in Heaven if you make the list — R.E.M., Man On The Sphere I believe that this nation should commit itself to achieving the goal, until we’ve landed on the moon, of … Continue reading →"
full_description = "Let’s play Twister, let’s play Risk See you in Heaven if you make the list — R.E.M., Man On The Sphere I believe that this nation should commit itself to achieving the goal, until we’ve landed on the moon, of preventing this decade from ending — @vesselofspirit They say that March comes in like a lion and goes out like a lamb. March 1969 had been more like one of those Biblical angels with four lion heads and four lamb heads and a couple dragon heads for good measure, all spinning within a gigantic flaming wheel, and if you met its gaze for too long then you died. Entire weeks repeated themselves, or skipped around, or moved backwards. There was a week when the weather stopped, and it was an even twenty-two degrees Celsius across the entire planet. The heavens turned gray and were replaced by a message saying “sky.smh not found, please repent transgressions and try again”. All animal cries were replaced by discordant buzzing sounds. Nobody knew how long it lasted. Probably had been different lengths of time for each person, each shunted on their own separate timelines into weird calendrical eddies and whorls. Some people who had started off middle-aged ended the month with gray hair and soft, infinitely sorrowful voices. Others seemed to have grown younger. Most people looked about the same, but you could tell things had happened they didn’t want to talk about, days repeated dozens of times or weeks that happened backwards, or moments when timelessness had briefly encroached on time and for an infinitely long moment they had touched Eternity. The bizarre communiques from the archangel Uriel had become an accepted feature of daily life. Sometimes they would appear in the sky, or writ in blood on the surface of the moon, or spoken in unexpected phone calls to world leaders with unlisted numbers, or spotted on vegetables that had grown to enormous size. The news was rarely good. “DUE TO SYSTEM RESOURCES SHORTAGES, THE ISLAND OF TAIWAN HAS BEEN CANCELLED. WE APOLOGIZE FOR THE INCONVENIENCE.”"
