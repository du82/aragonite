["https://unsongbook.com/chapter-2-arise-to-spiritual-strife"]
title = "Unsong"
description = "Jerusalem is builded as a city that is in the public domain. — kingjamesprogramming.tumblr.com May 10, 2017 San Jose Right down the road from Berryessa Station there’s a big house with a hidden basement. The people who live there – … Continue reading →"
full_description = "Right down the road from Berryessa Station there’s a big house with a hidden basement. The people who live there – usually six to eight of us, rarely the same from one month to the next – are the sort of artsy college students and aimless twenty-somethings who think that houses should have names. We call it Ithaca. Six days out of the week it’s an ordinary group house, with the ordinary arguments about who has to cook and when the living room is going to get cleaned. But on Wednesday nights people from all over the Bay Area gather in the basement to hold the secret rites of a faith banned throughout the civilized world. I took out my key and walked inside. I wasn’t alone. The celebrants looked a lot like the rest of Silicon Valley – mostly male twenty or thirty-somethings in jeans and hoodies, shuffling in awkwardly, grumbling about traffic. Their banality wasn’t quite an act, but call it a facade. These were dangerous men. The enforcers of the Shrouded Constitution have cracked the mobs, cracked the cartels, but these men of the ratty t-shirts and faded jeans they have not cracked. A resistance that has never been broken. A cabal that spans centuries and crosses continents. Fanatical, implacable, deadly. The cracks in the sky, the death of Reverend Stevens, the Shrouded Constitution; all of these had rent what was once a more innocent faith and driven it underground, forced it to change tactics. These were the new breed of Unitarians. A host of singers, cantors, open-sorcerors, Marxist-Lurianists, rebels, seekers, counterculture types. All the sundry outcasts Ginsberg had called “angel-headed hipsters burning for the ancient heavenly connection to the starry dynamo in the machinery of night.” Never mind that the ancient heavenly connection had since been definitively located in a giant hurricane three hundred miles off the coast of Louisiana, or that by this point the machinery of night was pretty much held together with duct tape and bubble gum. They burned still."
