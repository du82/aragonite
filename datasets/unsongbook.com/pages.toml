["http://unsongbook.com/chapter-4-tools-were-made-and-born-were-hands"]
title = "Unsong"
description = "And ye shall be sorrowful, but your sorrow shall be turned into effective devices for computing in any direction. — kingjamesprogramming.tumblr.com May 10, 2017 San Jose Even before Erica finished formally adjourning the meeting, I wove my way through the … Continue reading →"
full_description = "And ye shall be sorrowful, but your sorrow shall be turned into effective devices for computing in any direction. — kingjamesprogramming.tumblr.com Even before Erica finished formally adjourning the meeting, I wove my way through the crowd of garrulous people and up the stairs into my bedroom. I grabbed my laptop from the desk, then knocked on Ana’s door. She was there waiting for me. She sat down on the bed. I sat down on the floor. She stretched, cracked her back, cracked her neck, took a deep breath. “Today at work, I accidentally discovered a Name that gives souls to non-living objects. Like, not just turns them into golems. But actual souls. Nobody knows. Wasn’t a work Name.” “Euphemism,” said Ana. She got the implications immediately. “Wait, a month? You should be world emperor within a week!” The basis of the Information Age was brute-force generation of kabbalistic Names. That meant me and thousands like me on factory floors, reading potential Names and seeing if they worked any miracles. Given the billions of potential combinations, you needed a whole lot of employees working a whole lot of hours for a whole lot of time in order to get anywhere at all. Every other field had been revolutionized by automation. Tailors had their sewing machines, builders had their bulldozers, manufacturers had their industrial robots. And so about thirty years ago, someone had the bright idea: why not automate the generation of Divine Names? A factory with a hundred workers, each testing one Name every twenty seconds, all working eight hour days – discovers a new Name of ten letters or more about once a month. If a computer could test a thousand names a second, twenty-four hours a day, it could discover a new Name almost every hour. A Name must be spoken. It can’t merely be subvocalized, or sounded out completely in the imagination. So fine. Connect the computer up to a speaker. Have it speak a thousand times faster than any human, until the stream of Names just sounds like a uniform high-pitched hum. Then write a program that calculates potential Names off some open-source namespace software, plays them from the speaker, and records the ones that work."
