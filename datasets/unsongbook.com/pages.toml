title = "Unsong"
description = "In a large and complicated system there might be various things that are pleasing in His eyes. — kingjamesprogramming.tumblr.com Evening, May 13, 2017 Las Vegas Holy Scripture only mentions vampires once, but once is enough. The context is Isiaiah 34. … Continue reading →"
full_description = "In a large and complicated system there might be various things that are pleasing in His eyes. — kingjamesprogramming.tumblr.com The context is Isiaiah 34. God is doing His usual thing where He talks about all of the horrible curses that will befall someone who pissed Him off – in this case the Edomites. He starts with standard fare; everyone will die, the stink of their carcasses shall fill the land, the mountains will be melted with their blood. The stars will fall from the sky like withered leaves on a grapevine, the skies will dissolve, the streams will be filled with burning oil. Then He gets creative. He starts naming all the horrible animals that will come to dwell in Edom. Exactly which ones depends on your preferred translation. The King James Version translates these as unicorns, satyrs, and screech-owls. The original Hebrew word translated “screech-owls” is “lilit”, and we may question King James’ judgment. If God starts by promising unicorns and satyrs, screech-owls are going to be something of a let-down. What is being hidden from our tender sensibilities? We turn to the New International Version, which glosses “lilit” as the more promising “night creatures”. A couple more translations along these lines and we get to the New Revised Standard Version. It translates the same word as “Lilith the Night Monster”, which you have to admit is more interesting than “screech owls”. For the next reference to this figure, we have to go forward about a thousand years to the Talmud. Rabbi Hanina writes “One must never sleep in a house alone, for whoever sleeps in a house alone shall be seized by Lilith the Night Monster.” Have I mentioned that the Talmud is kind of crazy? From there we go another thousand years, to a mysterious little tenth century text called the Alphabet of Ben Sira. One day King Nebuchadnezzar asks the saint Ben Sira to heal his infant son. The saint speaks a holy Name, curing the baby instantly, and the king asks him to tell the story of how that Name came to have such power. Ben Sira explains that when Adam was alone in the Garden of Eden, God created a female companion for him named Lilith. The two of them decided to have sex, but both of them wanted to be on top, and they got into a big argument, and finally Lilith spoke a Name that granted her the power of flight and flew away. God sent a bunch of angels to get Lilith back, and they confronted her over the Red Sea, telling her that her purpose was to serve as a helpmate for Adam and primordial mother of the human race. Lilith said that she had a better idea, which was to become a night monster and kill a hundred babies every day. The angels admitted that this sounded pretty awesome, so they let her go, but first of all they made her swear that she would desist from her baby-killing at the sound of a certain holy Name. Thus Nebuchadnezzar’s son’s sudden recovery."
