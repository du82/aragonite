title = "Unsong"
description = "It is good practice to have your program poke around at runtime and see if it can be used to give a light unto the Gentiles. — kingjamesprogramming.tumblr.com May 10, 2017 Palo Alto The apocalypse began in a cubicle. Its … Continue reading →"
full_description = "It is good practice to have your program poke around at runtime and see if it can be used to give a light unto the Gentiles. — kingjamesprogramming.tumblr.com Its walls were gray, its desk was gray, its floor was that kind of grayish tile that is designed to look dirty so nobody notices that it is actually dirty. Upon the floor was a chair and upon the chair was me. My name is Aaron Smith-Teller and I am twenty-two years old. I was fiddling with a rubber band and counting the minutes until my next break and seeking the hidden transcendent Names of God. That wasn’t a hidden transcendent Name of God. That wasn’t surprising. During my six months at Countenance I must have spoken five hundred thousand of these words. Each had taken about five seconds, earned me about two cents, and cost a small portion of my dignity. None of them had been hidden transcendent Names of God. “AR-ASH-KON-CHEL-NA-VAN-TSIS,” ordered my computer, and I complied. “AR-ASH-KON-CHEL-NA-VAN-TSIS,” I said. The little countdown clock on my desk said I had seven minutes, thirty nine seconds until my next break. That made a total of 459 seconds, which was appropriate, given that the numerical equivalents of the letters in the Hebrew phrase “arei miklat” meaning “city of refuge” summed to 459. There were six cities of refuge in Biblical Israel, three on either side of the Jordan River. There were six ten minute breaks during my workday, three on either side of lunch. None of this was a coincidence because nothing was ever a coincidence. “AR-ASH-KON-CHEL-NA-VAN-TSIT” was my computer’s next suggestion. “AR-ASH-KON-CHEL-NA-VAN-TSIT,” I said. God created Man in His own image but He created everything else in His own image too. By learning the structure of one entity, like Biblical Israel, we learn facts that carry over to other structures, like the moral law, or the purpose of the universe, or my workday. This is the kabbalah. The rest is just commentary. Very, very difficult commentary, written in Martian, waiting to devour the unwary."
