["http://unsongbook.com/chapter-8-laughing-to-scorn-thy-laws-and-terrors"]
title = "Unsong"
description = "Love is the law, but it is poorly enforced. — Reverend Raymond Stevens, “Singers In The Hands Of An Angry God” March 20, 2001 Agloe The holy city of traditional kabbalah is Tzfat in Israel, where Rabbi Isaac Luria taught … Continue reading →"
full_description = "Love is the law, but it is poorly enforced. — Reverend Raymond Stevens, “Singers In The Hands Of An Angry God” The holy city of traditional kabbalah is Tzfat in Israel, where Rabbi Isaac Luria taught and died. The holy city of modern kabbalah ought to be Agloe, New York. The story goes like this: two mapmakers had just finished collecting geographic data for the definitive map of New York State. They worried that other people might steal their work and pass it off as their own. They’d never be able to prove anything, since all accurate maps look alike. So the mapmakers played a little trick; they combined their initials to make the word AGLOE, then added it as a fake town on the map in an out-of-the-way location. Any other mapmakers whose work included Agloe would be revealed as plagiarists. One day a man came to an empty crossroads and decided to build a store there. He looked at his map, found that the spot was named Agloe, and named his business AGLOE GENERAL STORE. The store was a success, the location attracted more people, and soon the town of Agloe sprang up in earnest. In traditional semiotics, reality is represented by symbols which are themselves inert. In kabbalah, reality and symbols alike are representations of Adam Kadmon. The territory is a representation of Adam Kadmon, and the map is a representation of the territory and Adam Kadmon. Differences between the map and the territory may not be mere mistakes, but evolutions of the representational schema that affect both alike. The territory has power over the map, but the map also has power over the territory. This is the kabbalah. The rest is just commentary. When map and the territory both depend on each other, to assert copyright is a dangerous act. The two cartographers stuck their name on the map to claim dominion, but dominion over the divine order producing both map and territory belongs only to God. But the two cartographers named the city by combining the initials of their names. This is an ancient kabbalistic technique called notarikon in which words are generated from the initials of longer phrases. Many of the Names of God are notarikons of Bible verses or prayers; some say all Names, however long, are notarikons for increasingly accurate descriptions of God. But the most famous such notarikon uses only four words: the short liturgical formula “atah gibor le’olam A—-i” meaning “thou art mighty forever, O Lord”. The phrase’s initials become the famous four-letter Name AGLA."
