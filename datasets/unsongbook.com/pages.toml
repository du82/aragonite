["http://unsongbook.com/chapter-47-for-he-beheld-new-female-forms"]
title = "Unsong"
description = "February 1984 Citadel West “Evening,” the Comet King said from across the table, stifling a yawn. “Why don’t you tell me something about yourself and why I should marry you?” Her name was Jessica. She was twenty-three and beautiful, long … Continue reading →"
full_description = "“Evening,” the Comet King said from across the table, stifling a yawn. “Why don’t you tell me something about yourself and why I should marry you?” Her name was Jessica. She was twenty-three and beautiful, long dark wavy hair, curves to die for, deep brown eyes, et cetera. She bit her lip in a way the Comet King assumed was supposed to be seductive. “I graduated from University of Colorado with double degrees in physics and political science,” she said. “I’ve been reading about you ever since you won that battle at Silverthorne. I always thought you were a real hero, like out of some fairy tale. The day you became King of Colorado was one of the happiest days of my life, because I know we had someone wonderful here taking care of us. I think I’ve been in love with you ever since I saw the coronation on TV. If you let me be your Queen, I will try to be an inspiration to young Coloradoan women everywhere. I’ll serve you well and give you lots of babies.” “You’re very beautiful,” said the Comet King, in the same way a judge at a dog show might pronounce a certain poodle to be very beautiful. “Thank you for your time. My staff will get back to you within three to five days.” “That’s…it?” asked Jessica. She tossed her hair seductively. “But I thought we would be able to spend…you know…more time together.” “I wouldn’t have to wait until our wedding. Even if you’re not interested in getting married, we could still…you know.” “I appreciate the offer and my staff will get back to you in three to five days.” He got up from the table, gave her a little bow, and walked out to the atrium of the palace. Nathanda and Caelius were fighting over a toy. He gave them a quick glance, and both of them tried to push the toy at the other, then stood to attention. He smiled and found Father Ellis, sitting alone beside one of the big targeting computers, looking annoyed. “She wanted to have my babies,” said the Comet King. “She knew about the curse, she knew they would die screaming and cursing their father’s name, and she still wanted to have them.”"
