["https://unsongbook.com/chapter-71-but-for-another-gives-its-ease"]
title = "Unsong"
description = "Everybody already has enlightenment. Why did Buddha sit for six years, see a star, and then get enlightenment? That’s stupid! If you see a star, you get enlightenment now! — Ch’unsong Sunim Evening, May 14, 2017 Fire Island I. Opening … Continue reading →"
full_description = "Everybody already has enlightenment. Why did Buddha sit for six years, see a star, and then get enlightenment? That’s stupid! If you see a star, you get enlightenment now! — Ch’unsong Sunim Opening the door to the Captain’s cabin, Ana saw a small room, dark and unadorned, with only a bare wooden bed. The Captain sat upon it, writing something, pages of notes strewn all about. He looked up at Ana, his face unreadable through the dark glasses. She hesitated for just a second, then spoke. This we derive from gematria, where both Leviathan and Malkuth – the sephirah corresponding to the material world – have identical values of 496. 496 is a perfect number, from which we can derive that the world is perfect – helpful, since we probably wouldn’t derive that otherwise. The analogy between the world and a sea monster cuts across faiths. The Norse speak of Jormungand, the World Serpent, who circles the earth to grasp its own tail. The Babylonians say that the heavens and earth were built from the corpse of the primordial sea dragon Tiamat. Even the atheists represent the cosmos as part of a great whale, saying that the whole world is a gigantic fluke. And the same motif of sea-monster-as-world is found in every form of art and scholarship. Herman Melville uses the whale Moby Dick as a symbol for the forces of Nature. Thomas Hobbes uses the Leviathan as his metaphor for human society. Even Leonard Cohen writes, in his Anthem, “There is a kraken: everything”. The world, like Leviathan, is very big. The world, like Leviathan, is difficult for humans to understand, let alone subdue. The world, like Leviathan, holds out its promise – if only you could catch up with it, measure up to it, maybe things would make sense. The world, like Leviathan in Job 40:19, is “the first of the works of God”; like Leviathan in Job 41:9, it “humbles the mighty and lays them low”, like Leviathan in Psalm 104:25, it is “that who You formed to play with”. And like Leviathan in Job 41:34, it is “king over all the sons of pride”. Those who are proud chase after worldly things, worship the world, treat it as their king. They obsess, they pursue, they seek to dominate and control. Even the English phrase has obvious kabbalistic echoes: “chasing your white whale”."
