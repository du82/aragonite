["https://unsongbook.com/book-iii-revelation"]
title = "Unsong"
description = "[A picture of Malia Ngo sitting at her desk, with a city on fire visible outside the window. The text says “You say I took the Name in vain / And after that I lost the Name / I gave … Continue reading →"
full_description = "[A picture of Malia Ngo sitting at her desk, with a city on fire visible outside the window. The text says “You say I took the Name in vain / And after that I lost the Name / I gave it back to Him who holds it for us / But echoes sound in every word / It doesn’t matter what occurred / You never really lose the HaMephorash”. Image credit to Tasty_Y at learning-to-draw-stuff.tumblr.com] Skipping straight from Exodus to Revelation? Well, first off, something is very, very off with this Torah, and second off, we’re in for a really bad time. Revelation?? Last book then presumably?? Huh. (Skipping Chronicles, even. 😛 ) I guess that does make a bit more sense than cramming three more books in, but, wow. Ugh. 0, 1, ∞. I need to learn not to try to use HTML entities by memory… (&alefsym; for ℵ is another horribly unintuitive one). I thought it was pretty interesting watching people fail to update after the chapter count for Book II got implausibly high. There were two alternatives – that the number of books promised was lower than 5, or that the number of chapters promised was greater than 72. We know there’s going to be a Book IV, don’t we? Didn’t Scott say when he was searching for an artist for this book’s cover that there was someone he was reserving for the next one? Hm, that’s a good point (though the Tumblr post seems to have been deleted, or at least I can’t find it). Could be like a 1-chapter book at the end or something. Guess it wouldn’t be a 0, 1, ∞ progression then. 0, 1, ω, ω+1? That seems a little doubtful… (Also 0, 1, ∞ is usually heard in cardinal contexts.) And I remember thinking a couple of weeks ago that that would be pretty weird: having 5 books like the Torah, which would require a 5th verse of HaMephorash. Now it all makes more sense So what comes after Revelation? Possibilities: 1. Something entirely new (most likely, I think) 2. Per LHC’s suggestion, going back before the “ב” in “Bereshit”; which would be what? Chaos and void? Tohu and bohu? Seems possible. 3. The Quran? Unlikely, Scott has said he doesn’t know enough about Islamic mythology to include any, and anyway the Muslims would insist that the Quran isn’t exactly after Revelation 4. The Book of Mormon? We haven’t really seen anything Mormon so far, unless the story’s America-centrism counts 😛 More likely than the Quran, though, I guess."
