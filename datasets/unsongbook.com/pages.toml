["http://unsongbook.com/chapter-14-cruelty-has-a-human-heart"]
title = "Unsong"
description = "Because the law worketh wrath: for where no law is, there is power: and who may stand in thy sight are but as yesterday when it is applied. These two rules describe the essence of a computer programmer trainee — … Continue reading →"
full_description = "Because the law worketh wrath: for where no law is, there is power: and who may stand in thy sight are but as yesterday when it is applied. These two rules describe the essence of a computer programmer trainee — kingjamesprogramming.tumblr.com Gradually it came back to me. I’d tried to fight UNSONG and failed miserably. They’d seized me and presumably my computer too, driven goodness knows how many hours with me in the back of a black van, then deposited me in a cell somewhere. I had fallen asleep. Now I had woken up. I was still in an UNSONG cell. There were guards outside the window. The wrongness was subtler than that. It pierced to the bone. It was like hearing your own heartbeat, pounding in your ears, except that it was off, in some way that you couldn’t explain, and you kept thinking maybe you had some rare heart disease that was going to kill you any moment now. I tried to get up, and was mildly surprised when I succeeded. Whatever was wrong wasn’t physically wrong. I tried to speak and found that I was gagged. Obvious precaution. You capture a kabbalist, you don’t want them speaking. No chance UNSONG was going to forget that. The cell was spacious – although to be fair my standards had been set by the sort of rooms I could rent for minimum wage in the Bay Area. It was well-kept, as if advertising that UNSONG didn’t need to deny its prisoners any of their physical needs in order to break them. Or maybe I was reading too much into it, because everything around me still felt horribly wrong. There was nothing. Either Ana was far away, or distracted, or asleep, or – I couldn’t make myself think “dead”. I would have felt it if she died. That, I told myself, is definitely how kabbalistic marriages work. So I banged on the door of my cell, hoping that the guards would hear me and take me away to whatever awful fate was awaiting me, rather than leave me here where something was horribly wrong. Both guards looked at me. One of them muttered something I couldn’t hear, probably along the lines of “He’s awake”. I was surprised to see they looked like ordinary people. The one on the left wore a sort of serious expression that reminded me of Eliot Foss for some reason. The one on the right looked a combination of pissed off and scared. I wondered if he, too, could feel that something was horribly wrong."
