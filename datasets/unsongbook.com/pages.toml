["http://unsongbook.com/chapter-49-terrors-of-the-sun-and-moon"]
title = "Unsong"
description = "December 4, 1993 Gulf Of Mexico Right on cue, people noticed the sun speeding up. There were times when this would have been a cause for concern. As it was, the astronomical community just shrugged their shoulders and said “Uriel’s … Continue reading →"
full_description = "Right on cue, people noticed the sun speeding up. There were times when this would have been a cause for concern. As it was, the astronomical community just shrugged their shoulders and said “Uriel’s doing something again”, and there the matter rested. The unplanned solar eclipse of December 4, 1993 would reach totality around 11:08 over the Pacific Ocean. The path would continue northeast, until it reached the point of longest duration of totality over the permanent hurricane in the Gulf of Mexico just after 2:30. From there it would pass over Florida before dwindling away in the North Atlantic. “I AM GOING TO HAVE MICROMANAGE THE MOON FROM THIS POINT ON,” said Uriel. “IT IS VERY DIFFICULT. PLEASE DO NOT DISTURB ME UNTIL TOTALITY HAS PASSED. YOU KNOW WHAT TO DO?” “Yeah, for the thousandth time,” said Sohu. “When the totality hits, step into Yetzirah, look through – not with – the eye – and report back.” “YOU ARE GOOD,” said Uriel. “QUIET TIME NOW.” He started rearranging the glowing letters in front of him. It was a new moon, so Sohu couldn’t tell if the moon was wobbling in the sky or not. Sohu took out a book – not the Torah this time, she’d been able to teleport to some bookstores and get some light reading and had developed an appetite for comics – and sat on the edge of her cloud, glancing up every few minutes to check the state of the sky. “YES. I JUST REMEMBERED. I FORGOT TO TELL YOU. DO NOT STARE STRAIGHT AT THE SUN. IT WILL HURT YOUR EYES.” “Thanks, Uriel,” said Sohu, with an eye-roll, and returned to her pasttime as Uriel returned to his. She couldn’t concentrate on the comics. She put it down on the cloud, carefully folded to the last page she had read. Another verse, this one from her kabbalistic studies: I reign over you, sayeth the God of Justice, in whose hands the Sun is a sword, and the Moon a through thrusting fire… The sky started to darken. Ignoring the archangel’s advice, Sohu risked a brief glance at the sun and saw a bite taken out of it."
