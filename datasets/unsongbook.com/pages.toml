["http://unsongbook.com/chapter-36-my-fathers-business"]
title = "Unsong"
description = "Fill the god-shaped hole in your soul with molten metal, then shatter your soul, leaving only a metal god — Gap Of Gods October 31, 1991 Gulf Of Mexico Curled up on a cloud, Sohu sat studying Talmud. She was … Continue reading →"
full_description = "Fill the god-shaped hole in your soul with molten metal, then shatter your soul, leaving only a metal god — Gap Of Gods Curled up on a cloud, Sohu sat studying Talmud. She was just starting to consider packing it in for the night when her vision was seared by a nearby lightning strike. The subsequent thunder was instantaneous. She was still trying to get her sight back when her father strode through the door. She jumped up from her desk in delight. Of course she ran right into a wall – vision doesn’t recover from a point blank lightning strike that quickly – but luckily it was made of cloud and did her no harm. She stumbled a little, then quite literally fell into her father’s arms. She smiled. “I don’t know how you look. One of the disadvantages of you going everywhere by lightning bolt. Sit down.” She gestured at the only chair in the room, which was Sohu-sized. Her bed was covered with books, all open to different pages. The Comet King sized it up, but his distaste for putting books on the floor got the best of him, and he put himself on the floor instead, settling naturally into a lotus position. Sohu shrugged and took the chair. “Uriel destroyed the city of Madrid. The King of Spain, the Prime Minister of Israel, Secretary Baker, and dozens of diplomats are dead. Thamiel is disincorporated. I don’t know the whole story. Uriel’s still in the crater. I want you gone by the time he comes back here. You are not safe.” “Oh. Father, I was the one who told him to go. I thought it would be good for him. They must have…it was Thamiel. It must have all been a trick of Thamiel’s. I’m so dumb. Father, this is all my fault.” Sohu got up, started pacing. Tears welled into her eyes. “No. Uriel’s…different, but this isn’t him. You have to trust him, Father.” “Sohu, I told you I sent you here to learn the celestial kabbalah. I told you it would be dangerous if you did not know it. That was true in more ways than you knew. I sent you here because I knew Uriel was capable of this. Uriel is not good, Sohu. He is not evil in the same way Thamiel is, but neither is he safe. And he controls the universe. I cannot allow the universe to be controlled by a loose cannon, but for the present I lack any other options. Not even I can do what he does.” He frowned. “That is why I sent you here, Sohu. So that if Uriel becomes too dangerous to be allowed to continue, I will have someone with whom to replace him. That is why I sent you here, even though it placed you in danger. I thought the danger was worthwhile, if it gave me a backup demiurge when the time came. Now I no longer think the danger is worthwhile. We will find another way to teach you. Come home with me.”"
