["http://unsongbook.com/chapter-23-now-descendeth-out-of-heaven-a-city"]
title = "Unsong"
description = "Though thou exalt thyself as the eagle, and though thou set thy nest among the stars, thence will I bring thee down, saith the LORD. — Obadiah 1:4 Afternoon, May 12, 2017 San Francisco Even though she could no longer … Continue reading →"
full_description = "Though thou exalt thyself as the eagle, and though thou set thy nest among the stars, thence will I bring thee down, saith the LORD. — Obadiah 1:4 Even though she could no longer hear it with her ears, it still rang in the back of her mind. A note, a single impossibly pure note that seemed to overpower everything else. But it grew fainter and fainter and finally faded away entirely. She didn’t miss it. She knew a minute longer up there and she would have lost herself, lost even the ability to know what losing herself entailed, lost the ability to think or feel or know or question anything ever again, turned into a perfect immobile crystal that was blindingly beautiful and totally inert. “Oh God,” said Ana. They had brought her aboard the ship and helped her onto a bed in one of the cabins. “I almost felt transcendent joy. It was awful.” None of them laughed. There were three of them. An older man with a short white beard. A military-looking fellow with bright eyes and closely cut hair. And an Asian man wearing a necklace. Ana’s addled brain searched for relevant memories and came back empty. Memories came crashing in. The Comet King’s old yacht, converted into a diversion for the idle rich and renamed to head off questions from annoying kabbalists. Fastest ship in the world. Ten million bucks a month for a cabin, sold to rich people who wanted to talk to God, not in a pious prayer way, but in a way that maybe gave them the chance to punch Him in the face depending on what He answered. Traveled the world. Docked at weird out-of-the-way places to avoid the attention of the Other King, who was supposed to have a personal grudge against it. She tried to remember if she’d ever heard anything about the crew, but there was nothing. Paul tried to stand. He took a second to catch his breath. Kesey – the thing in Kesey’s body – seemed content to let him. It just stood there, hovering. “NO. I AM NEIL ARMSTRONG. ELEVEN MONTHS AGO, I FELL THROUGH A CRACK IN THE SKY INTO THE EIN SOF, THE TRUE GOD WHOSE VASTNESS SURROUNDS CREATION. LIKE ENOCH BEFORE ME, I WAS INVESTED WITH A PORTION OF THE MOST HIGH, THEN SENT BACK INTO CREATION TO SERVE AS A MESSENGER. I AM TO SHOW MANKIND A CITY UPON A HILL, A NEW JERUSALEM THAT STANDS BEYOND ALL CONTRARIES AND NEGATIONS.”"
year_published = 2016
