["https://unsongbook.com/chapter-16-if-perchance-with-iron-power-he-might-avert-his-own-despair"]
title = "Unsong"
description = "There’s a story about an old man walking down a beach. He sees a child picking up starfish and throwing them into the water. The man asks the child what he’s doing, and the child says that these starfish are … Continue reading →"
full_description = "There’s a story about an old man walking down a beach. He sees a child picking up starfish and throwing them into the water. The man asks the child what he’s doing, and the child says that these starfish are stuck on land at low tide. They can’t survive out of water, so he’s throwing them back in the ocean to save them. The old man says, “But surely you know that there are millions of starfish just on this one beach. And there are thousands of beaches all around the world. And this same thing happens at high tide day after day, forever. You’ll never be able to make a difference.” And the child just picks up another starfish, throws it into the ocean, and said “Made a difference to that one!” I remember when I told the Comet King this story. He got very quiet, and finally I asked what he was thinking. Still half-lost in thought, he answered: “Even a small change to the moon’s orbit could prevent the tidal cycle. Moving the moon would take immense energy, but the Wrathful Name has the power of a hydrogen bomb and can be written on a piece of paper weighing only a fraction of a gram. The Saturn V has a payload of about ten thousand kilograms, so perhaps twenty million instances of the Wrathful Name…hmmmmmm…no, it still wouldn’t be enough. We’d need a better rocket. Perhaps if you could combine a methane/LOX full-flow system with a prayer invoking the Kinetic Name…” He picked up a napkin and started sketching, and was diverted from his trance only when I reminded him that starfish had evolved for life in the intertidal zone and were probably fine. He flashed me one of his fierce smiles and I couldn’t tell whether or not he had been joking all along. An enterprising member of the household staff pocketed the napkin and sold it to Celestial Virgin for an undisclosed sum; the Comet King’s partially-completed sketch became the basis of all modern rocketry. Runes of glowing fire troubled Sohu’s dreams, and she woke up the next morning to find them inscribed upon her skin in big dark welts. She ran out of her cottage, almost fell off the edge of the cloud."
