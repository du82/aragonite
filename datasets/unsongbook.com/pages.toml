title = "Unsong"
description = "The greatest trick the Devil ever pulled was spreading a catchy quote denying all tricks greater than the one about faking nonexistence. — Steven Kaas [Content warning: Part II of this chapter contains graphic scenes including references to Hell, gore, … Continue reading →"
full_description = "The greatest trick the Devil ever pulled was spreading a catchy quote denying all tricks greater than the one about faking nonexistence. — Steven Kaas [Content warning: Part II of this chapter contains graphic scenes including references to Hell, gore, rape, psychological torture, and death. Some commenters are saying it was excessive even beyond the level suggested by this content warning, so take that into account. If you don’t want to read it, you can skip to Part III without missing too much plot-wise. Thanks to Pyth for helping out as Hell Consultant.] We’d been talking about theodicy, as usual. Ana was explaining how the Cainites had made the terrible mistake of trying to munchkin Biblical morality. Munchkin-ing is this idea from role-playing games where instead of trying to tell a good story, you search for weird little loopholes that violate the spirit of the rules and make things much too easy. The Bible says – check your Luke 15:6 – that “in heaven there will be more rejoicing over one sinner who repents than over ninety-nine souls that are righteous and have no need of repentance.” Solve for maximum rejoicing in heaven, and the obvious munchkin solution is to deliberately sin in order to repent later. Add some common-sense assumptions about the relationship between magnitude of crime and magnitude of repentance-related heavenly rejoicing, and…well, you can see where this is going. “Holy frick you’re a kabbalist and now you’re against the letter of the law? Forget the letter! We’re supposed to believe that even the tiny extra dots and brushstrokes on some of the letters in the Bible have special meaning! When God said you couldn’t start a fire on the Sabbath, and the rabbis interpreted that to mean you couldn’t use electricity either, the Israelis just went ahead and programmed all their elevators to constantly go up and down stopping on every floor, because then you could enter and not push buttons and you wouldn’t technically be the one initiating the electricity. The whole point of the kabbalah is that God wouldn’t include something in the Bible that you could interpret a certain way unless He meant you to have that interpretation. And you’re saying a really really obvious thing not just suggesting that repentance is better than righteousness but actually giving a numerical conversion factor was a mistake?”"
