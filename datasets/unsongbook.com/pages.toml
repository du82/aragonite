["http://unsongbook.com/chapter-17-that-the-children-of-jerusalem-may-be-saved-from-slavery"]
title = "Unsong"
description = "And the LORD said unto Moses, Pharaoh’s heart is hardened, he refuseth to let the user control whether or not to memoize thunks — kingjamesprogramming.tumblr.com I. April 10, 2017 San Jose “Why are we celebrating Passover?” asked Bill. “Are any … Continue reading →"
full_description = "And the LORD said unto Moses, Pharaoh’s heart is hardened, he refuseth to let the user control whether or not to memoize thunks — kingjamesprogramming.tumblr.com “My great-grandmother came from the Kaifeng Jews,” said Ally. “They have been in Asia for many generations.” “We’re celebrating Passover,” said Erica, bringing in a plate of brisket, “because we’re freedom fighters, and Passover is a celebration of freedom. It binds us to everyone across history and around the world who has struggled to escape bondage, from the Israelites in Egypt to the proletariat of today. Across thousands of years and thousands of miles, we’re all joined together, saying the same words, eating the same foods – ” “I have matzah!” said Erica. She brought in a plate of matzah. It had been cut into the shapes of little frogs and locusts. They had little eyes made of frosting. “Sour to represent the sourness of slavery in Egypt, sweet to represent the sweetness of freedom!” suggested Ana. Ally nodded enthusiastically. Pirindiel had been looking unusually glum this month, ever since one of the big theonomics had rejected his attempt at a business deal, politely explaining that “angel investor” didn’t mean what he thought it meant. Now he brightened up, and almost seemed to bounce with excitement. “Elijah!” he exclaimed. “I didn’t know he was coming! It’s been ages since the last time we – ” “He’s not coming,” said Erica. “It’s a metaphor.” Pirindiel’s face fell. He stared down at his plate in what I thought was embarrassment. Erica finished pouring the wine and went to the head of the table. “We are gathered here today,” she said, “to celebrate how the Israelites went from slavery into freedom. Yet in a sense, we are still slaves. Wiliam Blake said: ‘I must create my own system, or be enslaved by another man’s’. We are no longer slaves to a Pharaoh, but we are slaves to a system, a system that takes the work of our hands and minds and forces us to toil for its benefit. We celebrate tonight not only our current freedom, but the freedom yet to come, when the Names of God will be free for all the people of the earth.” She raised her glass. “To freedom!”"
