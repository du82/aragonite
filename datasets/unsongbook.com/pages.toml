full_description = "Yes — Will Godwin Evening, May 14, 2017 Citadel West And the voice said: [Blowhole-y of holies.] [Ana! You’re alive!] [Not…exactly.] [Oh.] [But sort of! Kabbalistic marriage seems to have some hidden features we didn’t realize. All those nights looking … Continue reading → If we are worthy, our Master will redeem us by justice, and if not, He will redeem us with mercy. — Rabbinic saying Evening, May 14, 2017 Citadel West I. Sohu pushed the heavy steel door open and entered the … Continue reading → It’s kabbalistically important that there only be ten author’s notes, so this is a postscript even though the book isn’t technically finished yet. The Berkeley wrap party will be at 4:30 on Sunday, location and directions here. There is no … Continue reading → Everybody already has enlightenment. Why did Buddha sit for six years, see a star, and then get enlightenment? That’s stupid! If you see a star, you get enlightenment now! — Ch’unsong Sunim Evening, May 14, 2017 Fire Island I. Opening … Continue reading → Evening, May 14, 2017 Colorado Springs I. It was called Tava, or “sun mountain”, by the Ute. El Capitan, meaning “the leader”, by the Spanish. But its modern name “Pike’s Peak” comes from explorer Zebulon Pike, and his name in … Continue reading → This is by Raymond Arnold. And hopefully you didn’t miss the Bayesian Choir’s rendition of the title song. Relevant wiki articles: Garden of the Gods, Samuel Butler, the Butlerian Jihad, The Red Wheelbarrow, The New Colossus, Eli, Eli, Pike’s Peak, … Continue reading → Afternoon, May 14, 2017 Citadel West The alarms went silent. North American airspace went black. The lights went out. THARMAS went quiet, then released an arc of electrical energy which briefly lit the otherwise pitch-black room before dying back down. … Continue reading → [A picture of the Comet King, aged beyond his years, his face looking haggard but determined, lost in shadows. The text says “Somebody had to, no one would / I tried to