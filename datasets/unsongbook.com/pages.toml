title = "Unsong"
description = "Object gods have meta gods Up in their skies to smite them And meta gods have meta gods, And so ad infinitum. — Steven Kaas January 30, 2002 Puerto Penasco, Mexico With a look of mad determination, the big man … Continue reading →"
full_description = "Object gods have meta gods Up in their skies to smite them And meta gods have meta gods, And so ad infinitum. — Steven Kaas With a look of mad determination, the big man marched to the center of the crowded bar. “I’ll say it,” he said. “The Other King is a bad man.” A dozen conversations went silent. The bartender stopped pouring mid-glass. Several people eyed the door. Only the mariachi music from the stereo in the corner carried on regardless. “No want trouble,” said the bartender in heavily accented English. A few people slunk out the door before things got worse. Others laughed nervously, decided the safest course was to return to their drinks, started mentally rehearsing the phrase “I didn’t hear nothing”. But the big man wouldn’t be cowed. He stood up from his stool, faced the tables in the back. “The Other King is a bad man.” James sighed and put his hand on the big man’s shoulder. “You’re drunk,” said James. “And you’re saying things you’re going to regret. Lemme walk you back to the barracks.” “Not drunk,” said the man. “The Other King’s a bad man and you’re not going to shut me up about it. All those people crucified. Isn’t right. Crucifixion. Horrible way to die.” “Should leave now, por favor,” said the bartender, but the man was bigger than he was. And probably a soldier to boot; everyone here was soldiers, James was a soldier, his companions over at the table were soldiers, Puerto Penasco was rotten with soldiers. The Other King’s soldiers, who had taken over the city. The loyalist soldiers, who were mostly dying painfully on crosses erected upon the road north. “Zip it and come have a drink with us,” said James, and dragged the big man over to his table as the bartender watched helplessly. This was mind-bogglingly stupid. Saying bad things about the Other King or even hanging out with the sort of people who said them was a good way to end up charged with sedition and crucified. But James didn’t want the big man to die. All he’d done was get drunk enough to say what all of them were thinking. James had been thinking it ever since he’d signed on in Vegas. It had seemed like a good deal. Good wages, good benefits, and not a whole lot of risk; anybody who could kill the Comet King in single combat was probably the winning team. Sure enough, James and his battalion had taken over Phoenix, Yuma, and Puerto Penasco in quick succession without any losses. Except their innocence. The big man was right. The Other King was a bad man."
