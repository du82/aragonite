["http://unsongbook.com/chapter-6-till-we-have-built-jerusalem"]
title = "Unsong"
description = "God, grant me the serenity to accept that I will never have the serenity to accept the things I cannot change. — Steven Kaas Early morning, May 11, 2017 San Jose The computer whirred and chattered: the speaker producing Names … Continue reading →"
full_description = "God, grant me the serenity to accept that I will never have the serenity to accept the things I cannot change. — Steven Kaas The computer whirred and chattered: the speaker producing Names faster than the ear could follow. I stared at the screen. I already knew I wouldn’t sleep tonight. Last year I’d posted my paper “Exploitable Irregularities In NEHEMOTH-Maharaj Mappings” to one of the big Singer bulletin boards online. I’d been nervous. Bad things happened to people who put Names online. The law said webmasters were responsible for monitoring their own sites; anyone who didn’t delete a Name was just as guilty as the person who’d posted it in the first place. But there were rumors of worse things, webmasters being visited by men in black UNSONG uniforms and politely “asked” to hand over IP addresses. People corresponding to those IP addresses getting jailed, or just disappearing and never being seen again. There had been a site in the Harmonious Jade Dragon Empire that had just presented a list of like a hundred Names, right there for anyone who wanted to read them, but none of the search engines would show it and anybody who linked to it got taken down in all senses of the word. I’d checked a few months ago and it was gone. But there was nothing illegal about posting methods to break klipot. It was just math. They couldn’t make math illegal. It would be like banning triangles. So I was nervous, but not too nervous. I remember sitting at my laptop – this was just after I’d gotten Sarah – clicking the reload button every couple of seconds. Watching the view count gradually increment up, from zero to one, from one to two. Then a comment – some sort of stupid objection to the math, I don’t remember what it was. Then another comment, “Wow, I think you’ve actually done it.” Then the view count going to fifty, sixty, a hundred as people started linking to it. I remember that because of the compulsive refreshing. Each time I clicked the little button might mean another morsel of praise, a few more people noticing me, another stepping stone on my path to stardom."
