["http://unsongbook.com/chapter-30-over-the-dark-deserts"]
title = "Unsong"
description = "You don’t truly understand necromancy if you can’t explain it to your great-great-great-grandmother. — Steven Kaas Evening, May 12, 2017 Mojave Desert I. California shifted around us. Plains, then mountains, then taller mountains sloping down at last into a mind-boggling … Continue reading →"
full_description = "You don’t truly understand necromancy if you can’t explain it to your great-great-great-grandmother. — Steven Kaas California shifted around us. Plains, then mountains, then taller mountains sloping down at last into a mind-boggling flatness of desert. And there we were. I had spent my entire life in that tiny strip of California coastline between the mountains and the sea. Now I was in the real West, a Biblical wilderness of scrub and harsh rocks unlike anything I had seen before. The land where the great dramas of the late twentieth century had played out, the twin stories of the Comet King and the Other King. In the blazing sunlight it felt more real and solid than the dreamland I had left behind. Before the sky cracked, Wall Drug had been a shopping center in South Dakota. There aren’t a lot of things in South Dakota, so the owners of the shopping center had tried to turn it into a tourist attraction. They put up billboards along the highway – “Only thirty miles to Wall Drug!” – “Only twenty miles to Wall Drug!” – “Only another ten miles to go before WALL DRUG!” Presumably the expectation of getting ever closer would turn an ordinary shopping center into some sort of transcendental recreational/commercial experience. The radius had grown. “Only fifty miles to Wall Drug!” “Wall Drug, in just another hundred miles!” Finally, it metastasized through the entire Midwest, becoming the omphalos of its own coordinate system: “I don’t know what state we’re in, but it’s only another two hundred eighty miles to Wall Drug.” Some wag at US McMurdo Station had briefly planted a “9,333 Miles To Wall Drug” sign at the South Pole. After the sky cracked, the Wall Drug coordinate system started to impose itself more and more upon the ordinary coordinate system of longitude and latitude. Worse, the two didn’t exactly correspond. You could be driving from New York to New Jersey, and find a billboard promising Wall Drug in only thirty miles. Drive another ten, and sure enough, WALL DRUG, TWENTY MILES. Drive ten more, and you’d be promised a South Dakotan shopping center, only ten miles away. Drive another ten, and…who knows? No one has returned from Wall Drug in a generation. It’s become not only an omphalos, but a black hole in the center of the United States, a one-way attraction and attractor fed by an interstate highway system which never gives up its prey. Some say it is in Heaven, others in Hell, others that it remains in South Dakota, from which no word has been heard for thirty years."
