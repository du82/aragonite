["http://unsongbook.com/chapter-7-the-perishing-vegetable-memory"]
title = "Unsong"
description = "Sleep like nothing is watching. Gaze at the stars like it will never hurt. — Steven Kaas Early morning, May 11, 2017 San Jose My watch read 5 AM. Bill Dodd lived an hour’s walk away, close to the weird … Continue reading →"
full_description = "My watch read 5 AM. Bill Dodd lived an hour’s walk away, close to the weird morass of swamps and mud flats that passed for the San Francisco Bay in this area. He woke up around six and left at seven for some tutoring job up in the North Bay. I figured by the time I got to his home, it would be just about morning and I could catch him while he was getting ready. The streets were deserted, the houses dark. The cracks in the sky were barely visible through the hazy glow of the Silicon Valley megalopolis’ united streetlamps. I could see a few stars. There was a time when the stars had meant something. Blake thought they were angels. Byron called them the “poetry of Heaven”. The march of science transformed but did not lessen them. They became burning suns trillions of miles away, around which humankind might one day find new worlds to colonize. Of all the scientists, only Enrico Fermi had come close to the truth, and in the end even he had recoiled from it. One day back in the 50s, Fermi was having lunch out with my great-uncle out in Los Alamos, and the topic of conversation turned to where all the aliens were. If there were truly billions of stars with billions of planets, and the Universe was billions of years old, then there had been ample opportunities for life to evolve on other worlds. Earth’s sun was a cosmic infant – other stars were incalculably older. Why in those billions of years had their civilizations not overtaken us, reached and colonized Earth just as Earthly civilizations had reached and colonized their more isolated neighbors? Maybe life was incalculably rare, a spectacular fluke? Nonsense; even in those days scientists knew that if they stuck hydrocarbons in a jar and shook really hard, they’d get some very biological-looking compounds. Maybe it was multicellular life that was the bottleneck? Unlikely – it evolved three separate times on Earth alone. Sapience? Dolphins are practically sapient, so it must also be as common as dirt. Civilization? Developed separately in the Near East, China, Mexico, Peru, et cetera et cetera. Space travel? You’re trying to tell me that of a billion civilizations on a billion worlds over a billion years, not one would think of taking a really big rocket and pointing it up?"
