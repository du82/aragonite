["http://unsongbook.com/interlude-%d7%91-the-code-of-the-world"]
title = "Unsong"
description = "For the LORD will work for each type of data it is applied to. — kingjamesprogramming.tumblr.com “The Code Of The World”, by Aaron Smith-Teller Published in the March 2017 issue of the Stevensite Standard The Talmud says that God created … Continue reading →"
full_description = "“The Code Of The World”, by Aaron Smith-Teller Published in the March 2017 issue of the Stevensite Standard The Talmud says that God created the Torah nine hundred seventy-four generations before He created the world. Generations of who, I don’t know. The Talmud is kind of crazy. But the Torah is basically a few short stories about Creation and the distant past followed by a long and intricate biography of Moses. Why would God care so much about one Israelite guy that He would lovingly sketch out his story long before the first day rose upon the universe in which that guy was to live? There’s another episode in the Talmud, one where Moses is ascending Mt. Sinai to receive the Torah. God discusses how carefully He wrote the Torah over countless eons, and the angels say – then why are you giving it to this Moses guy? Who’s he? Some random mortal nobody! We’re angels! Give it to us! Moses argues that the people of Israel are sinful and so need it more. The angels accept his reasoning. But this argument is less interesting for what it says than for what it leaves out. Moses doesn’t say “Uh, guys, have you even read the Torah? Four of the five books are totally about me, personally. There’s even a section describing how God gives me the Torah, in the Torah. How can you challenge my right to have my own biography?” The rabbis explain this by dividing “Torah” into the historical Torah, meaning the records of Moses’ life – and the legal Torah, meaning the ritual code. God wrote the legal Torah beforehand. The angels wanted the legal Torah for themselves. But that doesn’t work either. Take a look at the legal Torah and it’s all sorts of rules about which kinds of animals to eat and which close relatives are too close to have sex with. This also seems like the sort of thing you don’t necessarily need to have finished 974 generations before you create the world. And it also seems like the sort of thing that angels don’t have to worry about. So what’s up?"
