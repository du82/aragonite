["https://unsongbook.com/chapter-33-the-doors-of-perception"]
title = "Unsong"
description = "May 13, 2017 Ensenada, Mexico Bizarre surrealist painter Salvador Dali once said: “I do not do drugs. I am drugs.” He was being silly. He wasn’t drugs. He was Salvador Dali. The men rowing out on little boats heavy with … Continue reading →"
full_description = "Bizarre surrealist painter Salvador Dali once said: “I do not do drugs. I am drugs.” He was being silly. He wasn’t drugs. He was Salvador Dali. Ana watched them lazily, her head resting against the green mast. The three men were in their cabin, and the place was crowded and sweaty. She’d told James that Amoxiel would be out here watching her, so where was the danger? Their first mate had reluctantly agreed. Ensenada looked like any other quiet harbor town. The people coming aboard looked like any other people. Maybe a little sleepier, their pupils a little wider. But she knew the truth. They weren’t people. They were drugs. Even if there were people in Ensenada – which she doubted – they wouldn’t be sent for something important like this. James had rowed ashore alone when the sun rose. Amoxiel and the Captain had watched him very carefully as he landed on a dock, found an Ensenadan man, and started talking to him. They couldn’t hear what he was saying, but they didn’t care. They were looking for one thing – did the Ensenadan feed or inject James with any material? As best they could tell, they didn’t. James rowed back to Not A Metaphor, and the crew let him back on. He seemed normal. But he would seem normal, no matter what happened. “Once,” he said. “In the nineties. On business. And then a little tourism afterwards. Mexico City. Veracruz. And Teotihuacan. With its giant pyramids, standing all solemn and huge in a row.” “Sorry! It’s a game I used to play, with a friend. Unintentional Biblical pun corrections. It’s…kind of compulsive now.” An awkward silence, which she tried to fill. “What is your business, anyway?” Then, as the first of the druggies came aboard, enlightenment struck. “You’re Simeon Azore! From Bareketh!” It was so obvious. The face she was looking at, minus ten years and with darker hair, could have been the face she’d seen in various magazines and TV news shows. The face behind Bareketh Capital and an early-level investor in Countenance and half of the most successful theonomics. A stakeholder in every company she had protested in the last ten years. “But…but you’re terrible!” Then she recoiled. “Sorry! Um! Also…compulsive, I guess. I didn’t mean to…”"
