["https://unsongbook.com/interlude-%d7%97-war-and-peace"]
title = "Unsong"
description = "Exodus 15:3 says “The LORD is a man of war; the LORD is His Name.” But this verse is ambiguous: “man of war” can mean either a type of Portuguese jellyfish or a type of British warship. Which one is … Continue reading →"
full_description = "Exodus 15:3 says “The LORD is a man of war; the LORD is His Name.” But this verse is ambiguous: “man of war” can mean either a type of Portuguese jellyfish or a type of British warship. Which one is the LORD? I suggest that He is the latter. A jellyfish is a primitive and ignorant animal, unworthy to be compared to the glories of God. But a warship is mighty and inspires awe, and divine comparisons are entirely suitable; indeed, God may be the only thing worthy of being compared to it. For it is written, “The LORD alone is worthy of warship.” — From “A Call To Arms”, by Aaron Smith-Teller Submitted for the January 2017 issue of the Stevensite Standard Rejected with extreme prejudice by editor Erica Lowry It’s hard for me to imagine what it must have been like to be alive in ’69, to see the demons spill forth from the ground and the angels descend from the clouds. But – okay, personal disclosure time. When I was little, six or seven, I thought Nazis were a kind of fictional monster. You’d see movies where the heroes fought zombies. You’d see movies where the heroes fought vampires. And then you’d see other movies where the heroes fought Nazis. Zombies spoke with a silly slow droning voice and said BRAAAAAINS a lot. Vampires spoke with a silly Eastern European accent and said “I VANT TO SUCK YOUR BLOOD” a lot. Nazis spoke with a silly German accent and said “HEIL HITLER” a lot. Zombies dressed in ragged clothes that were falling apart. Vampires dressed in stylish black capes. Nazis dressed in brown uniforms with snazzy red armbands. In any case, the point was that they were this weird subspecies of humanity that didn’t follow normal rules, that was out to kill everybody for unspecified reasons, and you could shoot them without feeling guilty. And then when I was eight I picked up a history book, and it was all in there, and I felt sick and vomited for the rest of the evening. And that night I was too scared to sleep. Not scared of Nazis – the history book explained that they had been beaten decisively a long time ago, and besides they never made it to America anyway – but scared of vampires coming to suck my blood. After all, if I could be wrong about one thing, who was to say I wasn’t wrong about everything else?"
