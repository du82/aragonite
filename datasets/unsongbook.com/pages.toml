["https://unsongbook.com/interlude-%d7%a2%e2%80%8e-eighties-and-nineties"]
title = "Unsong"
description = "In Daniel 5, King Belshazzar throws a feast which is interrupted by a giant disembodied hand writing on the wall: MENE TEKEL UPHARSIN. The wise men of the kingdom are confused; they recognize these words only as measures of silver … Continue reading →"
full_description = "In Daniel 5, King Belshazzar throws a feast which is interrupted by a giant disembodied hand writing on the wall: MENE TEKEL UPHARSIN. The wise men of the kingdom are confused; they recognize these words only as measures of silver (“mene” is cognate with the classical “mina”, “tekel” with the classical “shekel”, and “upharsin” is about half a mina.) Belshazzar summons the prophet Daniel for explanation, and Daniel interprets the inscription as a complicated kabbalistic pun. MENE represents not a literal weight of silver, but the concept of weighing or judging. TEKEL represents not just a shekel but a small and insufficient amount of money. And UPHARSIN is a pun on the Persians, the Babylonians’ arch-enemies. So he interprets the words to mean “You have been judged against the Persians and found wanting” – in other words, by exiling the Jews, Babylon had displayed such wickedness that God would allow the Persians to destroy them. The prophecy was fulfilled when King Cyrus of Persia conquered Babylon and executed Belshazzar for his wickedness. In 538 BC, the triumphant monarch allowed the Jews to return to Israel. From these events kabbalists derive a correspondence between silver, the number 538, and accurate prediction of changes in political leadership. WASHINGTON DC – President Reagan is expected to make a full recovery after being shot in the head by an assassin while leaving the Washington Hilton. Spectators report that the assassin, later identified as a mentally ill man named John Hinckley, pulled out a gun and shot six times. Five of the bullets hit members of the President’s retinue, one of whom is currently in critical condition at George Washington University Hospital. The sixth hit the President in the head. According to three separate eyewitnesses interviewed by The New York Times, the bullet passed straight through Reagan’s head and out the other side. Despite the injury, the President tackled the assassin and held him pinned to the ground until Secret Service agents could respond. Then, say the eyewitnesses, the President stooped to the ground, picked up a handful of earth, and filled the hole in his head as if nothing had happened."
