["https://unsongbook.com/book-i-genesis"]
title = "Unsong"
full_description = "So the quote is a the song “Hallelujah,” with words changed. Leonard Cohen played a version of it https://www.youtube.com/watch?v=ttEMYvpoR-k Original: Well I’ve heard there was a secret chord That David played and it pleased the Lord But you don’t really care for music, do you? Well it goes like this: The fourth, the fifth, the minor fall and the major lift The baffled king composing Hallelujah chord -> word David -> Jala pleased -> named care for music, do you -> know of magic, or us tav -> fourth fifth -> resh minor fall -> fearsome joy major lift -> fervent wish Baffled King -> Comet King composing -> incanting Hallelujah -> haMephorash The Shem HaMephorash is “an originally Tannaitic term describing a hidden name of God in Kabbalah” (Wikipedia) Leonard Cohen also wrote “Who by Fire,” a piece relating to Deathism, a philosophy that is usually a part of Rationalism. This song is sometimes sung at Solstice Rituals, which Scott goes to. The Comet King is referenced in the first chapter as being one of the “four kabbalists [that] have ever gazed upon Adam Kadmon bare” The guy in the picture is probably the main character (of Chapter 1 at least), while the girl is probably “Ana” As revealed in the first chapter, Aaron Smith-Teller, our protagonist, is 22 years old. Perhaps he is the tav. “Who by Fire” also includes the line “Who by very slow decay”, the title of a famous SSC post. If anyone wants a kindle version of this book, I’ve adapted a ruby scraper here: https://github.com/JasonGross/unsong_scraper. (If desired, I can take it down.) So I’m not sure whether you were the one who drew the cover art or whether someone else did, but I must nitpick and say that the lady’s legs are far too short. Legs are significantly longer than most people intuitively try to draw them. If you fold your legs up to your chest, you will find (within a reasonable margin of error) that your thighs and your shins are about the same length as your torso."
