description = "September 29, 1990 Gulf of Mexico Ever since the sky cracked there has been a hurricane off the coast of Louisiana that never moves or decays. In its eye stands the Archangel Uriel. He is five hundred feet tall, and … Continue reading →"
full_description = "Ever since the sky cracked there has been a hurricane off the coast of Louisiana that never moves or decays. In its eye stands the Archangel Uriel. He is five hundred feet tall, and around him whirl colorful streams of letters from every alphabet and syllabary and abjad of every culture in history, making subtle and complex geometric patterns before they disappear in bursts of rainbow light. Occasionally he reaches out and snatches one with his colossal hand and inserts it elsewhere in the stream, and then rain falls, or empires crumble, or new islands rise from the deep. Today he is doing none of those things. Today he is looking very carefully at something no one else can see, and talking to himself. “TIFERET,” he says. “THE SUN, BEAUTY, MIRACLES. BUT ALSO REVERSAL. A MIRROR SET AT THE CENTER OF THE TREE, REFLECTING WHATEVER IT SEES.” He stares more intently now. “A PULSE OF ENERGY FROM BINAH TO HESED, THEN A RETURN PULSE FROM HESED TO BINAH. THE LETTER KUF. BUT DOUBLED. REFLECTED.” Now he pauses. “SOMETHING IS MISSING. TIFERET ARCING DOWNWARD TO NETZACH. A YUD. TWO KUFS REFLECTED ABOUT A YUD.” The streams slow down. Somewhere in the wide world, something is happening involving a kayak, something important enough to disturb the subtle threads of the machinery of Heaven. Is it a prophet being carried down a river in Asia? A future king traversing an ocean in Europe? Is the kayak metaphorical? On the River of Time? On the Ocean of Knowledge? Might it… A kayak shot out of the walls of cloud at two hundred miles an hour and missed Uriel’s head by half an inch. “Oh God help I don’t know how to steer help help help somebody help I can’t steer!” someone screamed. Only slightly off balance, the archangel reached out a hand and caught the errant vessel. He lifted it until it was directly in front of his face, stared at it with his giant eyes. “Oh god I’m so sorry I’m so sorry I didn’t mean to do that I couldn’t steer,” she said. She was young, even for a human, maybe only seven or eight years old. She had light brown skin, dark brown eyes, braided black hair. She was wearing a life jacket. She was obviously terrified. Finally she managed to pull herself together, and said:"
