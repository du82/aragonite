["https://unsongbook.com/chapter-24-why-dost-thou-come-to-angels-eyes"]
title = "Unsong"
description = "Morning, May 12, 2017 Los Angeles A ray of early morning sun beat on my face. Clouds flew by me like trucks rushing down a highway, and the heavens seemed to sing. It’s weird. You spend your entire adult life … Continue reading →"
full_description = "A ray of early morning sun beat on my face. Clouds flew by me like trucks rushing down a highway, and the heavens seemed to sing. It’s weird. You spend your entire adult life searching for Names of God and hanging out with angels, and the closest you come to a spiritual experience is paddling a flying kayak thousands of feet above San Bernardino County. I was flush with excitement at my close escape and at my other close escape and frankly at being pressed up against Jane so closely and of course at the view where I could see all of Southern California stretching out around us, lines of crumpled mountains one after another, and then… There’s an old California joke. What happens when the smog lifts? The answer is the name of one of the state’s top colleges: UCLA. There was something very precious about the California coast from this perspective, a narrow strip between the foreboding mountains and the endless oceans, a little wire of humanity trapped between the desert and the deep blue sea. California had come through the last few decades very well. Of all the Untied States, it had been least damaged by the sudden shattering of the neat physical laws of reality into a half-coherent delirium. I think part of the reason was that in a way California had never entirely been a real place. It was impossible to live there for any amount of time and think it was just another state, like Nevada or Ohio or Vermont. It was a state like joy, or exaltation, the ultimate west, part of the world only by a technicality. Named for an Amazon queen in the terrestrial paradise. Colonized by fortune-seekers who were told the rivers were strewn with gold nuggets the size of your fist. The beach bums and the wannabe actresses and the hippies and the venture capitalists, all alike in that they had one foot on that little patch and the other in some fantasy of their own imagination. From that tiny winding wire of precious flat ground had come John Steinbeck, hippies, gay rights, the computer revolution, Ronald Reagan, every Hollywood movie, blue jeans, Barbie dolls, Joe DiMaggio, fortune cookies, popsicles, lap dances, hula hoops, the Beach Boys, Disneyland, an entire continent’s worth of positive affect scrunched up into a coastline and paved over with Mission architecture."
