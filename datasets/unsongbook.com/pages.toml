["https://unsongbook.com/chapter-15-o-where-shall-i-hide-my-face"]
title = "Unsong"
description = "You saved your shillings and your last six pence Cause in God’s Name they built a barbed wire fence Be glad you sail for a better day But don’t forget there’ll be Hell to pay Rebels are we Though heavy … Continue reading →"
full_description = "You saved your shillings and your last six pence Cause in God’s Name they built a barbed wire fence Be glad you sail for a better day But don’t forget there’ll be Hell to pay Rebels are we Though heavy our hearts shall always be Ah, no ball or chain no prison shall keep We’re the rebels of the sacred heart — Rebels Of The Sacred Heart We Bay Arians (Ana and I had debated multiple demonyms, including Bay Arean and Bay Aryan, before deciding we were more heretical than warlike, and definitely not the master race) tend to to think of the Central Valley as a nightmarish stretch of endless farms inhabited by people who, while not exactly dead, could hardly be called living. So far nothing Ana had seen in the two hour taxi ride to Ione had changed her mind. Now here was the town itself, in all its glory. There wasn’t anything that looked like a secret detention facility, although she supposed that was what made it a secret detention facility. But it was already dark, and she didn’t fancy looking. She also didn’t fancy waiting until morning; she wasn’t really an expert in infilitrating secret facilities, but night seemed like potentially the best time, even if you could turn invisible. It was a calculated choice. New enough that the theonomics were still guarding it closely, but old enough that it had leaked to a few singer groups and the UNSONG sentinels were listening for it. Chosen to lure the dragon from its den. Sure enough, a white van showed up at the gas station where the cab had dropped her off, and some men in black uniforms got out and started looking around. The process of infiltrating them was harder than Ana expected; she couldn’t just open the door of the van and walk in; there was still someone inside and he might notice the doors opening of their own accord. And if the van was full, she was worried someone would try to sit in her lap on the way back to headquarters. And starting any other Names would break her invisibility, so… She watched in disgust as the men, having finished their search of the premises, got back in their van and drove off. This was harder than it was in stories."
