["https://unsongbook.com/chapter-9-with-art-celestial"]
title = "Unsong"
description = "The claim that the Talmudic sages were great kabbalists is a historical error. Most sages make no mention of the kabbalistic tradition at all. Shimon bar Yochai, who lived in a cave and composed 1700 pages of kabbalistic texts, is … Continue reading →"
full_description = "The claim that the Talmudic sages were great kabbalists is a historical error. Most sages make no mention of the kabbalistic tradition at all. Shimon bar Yochai, who lived in a cave and composed 1700 pages of kabbalistic texts, is an exception and should be considered separately. Bar Yochai spent thirteen years hiding from the Romans in a cavern near Peki’in, and took advantage of his long downtime to write what would later become the Zohar – the founding work of kabbalah, as brilliant as it is impenetrable. Worried that it would lead younger students into flights of overwrought superstition, the orthodox banned study of the Zohar to everyone except married Jews above the age of forty -and even these carefully selected students tended to go off the deep end after a while. The circumstances of the Zohar’s composition are widely believed to be the origin of the old rabbinic proverb against delving too deep into arcane secrets: לֹא תִּיכָּנֵס לַמְעָרוֹת , meaning “don’t go into the caves”. — Gebron and Eleazar, Kabbalah: A Modern Approach “WE SAY THAT MAN WAS MADE IN THE IMAGE OF GOD,” said Uriel. “BUT GOD IS INEFFABLE AND WITHOUT PHYSICAL FORM. RESOLVE THE PARADOX.” She was sitting on a little cloud, a dozen or so meters across. In the middle, the cloud-stuff had been piled up into a little amorphous cottage where she slept and stored her books. On the far end of the cloud was the flying kayak, tied down with cloud-ropes. The archangel bent down, reached into the deep, and placed a giant grouper the size of a Jeep on Sohu’s cloud. It flailed half-heartedly for a moment, then stared at Sohu with dinner-plate-sized lidless eyes. It looked resigned. “AS I WAS SAYING, GOD HAS NO PHYSICAL FORM, SO THE CLAIM THAT HUMANS WERE MADE IN THE IMAGE OF GOD MUST HAVE SOME MORE SUBTLE MEANING. RABBI AKIVA PROPOSED – ” Fast as lightning, the archangel rearranged some of the glowing letters in front of him, causing them to pulse and whirl ominously."
