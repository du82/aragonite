title = "Unsong"
description = "Work hard, play hard, converge to a transcendent and unified end state of human evolution called the Omega Point as predicted by Teilhard. — @GapOfGods Noon, May 12, 2017 San Francisco I. The resemblances between San Francisco and the Biblical … Continue reading →"
full_description = "Work hard, play hard, converge to a transcendent and unified end state of human evolution called the Omega Point as predicted by Teilhard. — @GapOfGods The highest point in Jerusalem was King Solomon’s Temple Mount; the highest point in San Francisco is the suspiciously-named Mount Davidson. To the north of the Temple was the Golden Gate, leading to the city of Tiberias; to the north of Mount Davidson is the Golden Gate Bridge, leading to the city of Tiburon. Southwest of Jerusalem city center was the Roman legions’ camp (Latin: “castrum”); southwest of San Francisco city center is the Castro District. To the south of Jerusalem lay Gehennam, the Valley of Sulfur; to the south of San Francisco lies Silicon Valley. To the east of Jerusalem was the giant dungheap where the Israelites would throw their refuse; to the east of San Francisco is Oakland. Like I said, uncanny. The east gate of Jerusalem is called the Bab al-Buraq; the east gate of San Francisco is called the Bay Bridge. The Bab al-Buraq has been bricked up since the Crusades; the Bay Bridge has been barricaded since the 1970s. Ana Thurmond spoke a Name, became invisible, and slipped past the barricades, the guards in their guard towers none the wiser. Just inside the Bab al-Buraq was the Temple Treasury; just past the barricades on the Bay Bridge is Treasure Island. The Temple Treasury became a base for the Knights Templar; Treasure Island became a base for the US Navy. Both military forces abandoned their respective bases a few decades later; both had their partisans who prophecied they would one day regain their former glory. The Temple Treasury, upon the coming of Moshiach and the construction of the Third Temple; Treasure Island, after the San Francisco government completed an environmental impact evaluation and approved a real estate development plan. God in His wisdom alone knows which will happen first. Ana passed Treasure Island, went into the tunnel through Yerba Buena. There are tunnels underneath Jerusalem, too, built for sieges. Some of them have the earliest known paleo-Hebrew inscriptions on them. The Yerba Buena tunnel had a sign. It said:"
