["https://unsongbook.com/interlude-%d7%9b-the-outer-gate"]
title = "Unsong"
description = "I. Imagine there’s no Heaven. It’s easy if you try. So easy that millions of people throughout history did it entirely by accident. They went to church, they read their Bibles, they knelt prostrate in prayer, and then they went … Continue reading →"
full_description = "Imagine there’s no Heaven. It’s easy if you try. So easy that millions of people throughout history did it entirely by accident. They went to church, they read their Bibles, they knelt prostrate in prayer, and then they went home and lived a life of sin regardless. A group of psychologists once did an experiment on children’s willpower. They placed a young child in front of a marshmallow, and said if he could sit there without eating it for just five short minutes, he could have two marshmallows later. The “marshmallow test”, as it came to be called, was found to correlate with all sorts of later-life outcomes like health, wealth, and success. Because unless you were a truly exceptional kid, you couldn’t sit there all five of those minutes with that luscious marshmallow staring at you, begging to be eaten – just for a reward in some sucky future. So up the stakes a little bit. Sit there for five minutes, and we’ll give you all the marshmallows you can eat, forever. We will give you an entire dimension made entirely out of marshmallows. You can live in a great marshmallow mansion surrounded by woods made of jelly-beans, with gingerbread-man servants, and seventy-two houris made entirely out of sugar. But eat the marshmallow, even a tiny part of it, and you will be carried away to Soviet Russia – where marshmallows impale you on a stick, hold you over a fire, and roast you. I’m not talking about atheists here. I’m talking about the people who accept the entire premise, the people who go “Yup, this world is basically a cosmic marshmallow test, where if we can go the merest infinitesmal moment without sin we will be rewarded forever and ever with joy beyond our wildest dreams, but if we grab the marshmallow we will be punished forever in ways too terrible to imagine” – and then go “Eh, what the heck,” and eat the marshmallow. (The Lord said unto Adam: “You are free to eat from any tree in the garden, but you must not eat this marshmallow, for it is the marshmallow of the knowledge of good and evil, and when you eat of it, you will surely die.”)"
year_published = 2016
