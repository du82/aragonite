title = "Unsong"
description = "February 1984 Colorado “What can I do for you today?” Robin asked the Comet King. He was in his study, sitting at his big desk of Colorado pine. On the shelves he had gifts given him by various ambassadors and … Continue reading →"
full_description = "He was in his study, sitting at his big desk of Colorado pine. On the shelves he had gifts given him by various ambassadors and heads of state. A medieval orrery from the European Communion. A Faberge egg from the Cyrillic Union. An exquisite bonsai tree from the Harmonious Jade Dragon Empire. From Israel, a lovely turquoise sculpture with a microscopic listening device planted in it – which he usually covered with a piece of Scotch tape, but into which he spoke clearly and distinctly whenever he wanted to pass false information on to the Mossad. And of course books. Books lining the walls. The walls were fifty feet high here, so high they looked like they could break through the top of the mountain and show him blue sky on the top. He had filled forty feet with shelving, and it was growing all the time. When he needed a reference, he would speak the Ascending Name, float to the appropriate level, take the book, and then sink back to his desk. He worried that in a few years he would have exhausted the available space. His one-year old daughter Sohu was curled up at his feet, grasping her Bible, trying to memorize the thing. She was up to the Song of Songs already, more than halfway done. He approved of this. It kept her quiet. “I just wanted to spend some time with you,” he told Robin. “Get to, uh, know you better. Since we’re…getting married, and all.” She was in a light blue dress. It was, he noticed, the color of a robin’s egg. He wondered if that was intentional. Was it okay to ask if that was intentional? “I read your book,” he said, handing her back the work by Singer. “Would you like to talk about it?” “No. Well, yes.” He pointed to a map stretched out on his desk. “There is much to do, but many years to do. Like with Moses, this generation cannot be the one to enter the Promised Land. There are too few of us. We have no heavy industry. The collapse and the wars have hit us too hard. We need ten, twenty years to rebuild and reproduce, increase our numbers before we can take the war back to Hell. And there are other things to do in the meantime. Defeating Hell will mean nothing if I cannot destroy it. I must find the Explicit Name of God. They say that only those who can chase down Metatron upon his golden boat can obtain it. I think with enough knowledge it may be possible. I am designing a ship, but it must be perfect. It will take years to get right. And then the war itself. I will need guns, tanks, airships. Strategic nuclear defense systems. An economy to support all of this. And logistics. Marching a million men from Colorado to Siberia will not be easy, even if I can part the Bering Strait, Moses-style. Which I think I can. And…yes, I am busy. But not so busy we cannot talk.”"
