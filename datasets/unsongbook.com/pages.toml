["http://unsongbook.com/chapter-12-borne-on-angels-wings"]
title = "Unsong"
description = "May 11, 2017 San Jose Sitting in bed with her computer on her lap, Erica Lowry watched the sun rise and writing the news. The overt meaning of “news” is “new things”. The kabbalistic meaning of “news” is “the record … Continue reading →"
full_description = "This we derive by notarikon, interpreting “news” as an acronym for the four cardinal points: north, east, west, and south. There is a second notarikon of the same form. In Greek, the four cardinal points are arktos (north), dysis (west), anatole (east), and mesembria (south). When God took dust from the four corners of the world to make the first man, He named him after those four corners in notarikon; thus, “Adam”. Despite this similarity, the two words have a difference: news goes n-e-w-s and Adam, converted to the English equivalents, goes n-w-e-s. The middle two letters are reversed. Why? (when I was explaining this to Ana, I added that there was a third word in this class, that being “snew”. When she asked “What’s snew?” I said “Not much! What’s snew with you?” and she refused to speak to me for the rest of the day.) I offer the following explanation for the variation. During the day, the sun goes from east to west. This sunrise – sunset cycle represents the natural course of the world, the movement from birth to death. Adam is the only one in history who reversed that pattern; he went from dead clay to living man. And his descendants continue upon that road, trying to reverse nature, to wrest a bubble of order out of the general decay. They raise children, build cities, unify empires. But nature always has the last word. Children grow old and die. Cities fall. Empires crumble. The works of man succumb to the natural cycle. The west-east movement reverses itself, and the east-west course of the sun and the world takes over. And when it does, we call it news. Erica’s Stevensite Standard was one of the most popular magazines of the Bay Area countercultural scene. She had a gift. If I had to name it, I’d say it was a gift at taking things seriously. If someone organized a protest, and only five people attended, and then it started raining and so they all went inside and had lunch, Erica could make it sound slightly more heroic and monumental than the First Crusade. She didn’t misreport the facts, she didn’t gloss over things, she just wrote from the heart, and her heart was convinced that whatever she and anyone in her vicinity were doing was the most important thing."
