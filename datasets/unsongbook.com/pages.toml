["https://unsongbook.com/chapter-32-the-human-form-divine"]
title = "Unsong"
description = "August 7, 1991 Gulf of Mexico I. Sohu stretched, splayed out further. “Knock knock,” she said. “OH. THIS AGAIN.” “Knock knock.” “WHO’S….THERE?” “So.” “SO WHO?” “Sohu’s at the door, better let her in.” “HA! HA! HA!” Uriel’s laughter boomed, shook … Continue reading →"
full_description = "“HA! HA! HA!” Uriel’s laughter boomed, shook the clouds, shook the ocean, drowned out the everpresent thunder of the surrounding storm. It was a fiery golden laugh, like pyrotechnics, like solar flares. “Yes,” said Sohu. “You are going to learn this. I have decided. You will learn knock knock jokes, and you will be good at them.” “I’m serious about this! You’re like the best person I know at finding unexpected connections between words and meanings! That’s what jokes are! You’re missing your calling! Come on! Try it!” “UM. ACCORDING TO THE BOOK OF ZECHARIAH, THE RESURRECTION OF THE DEAD WILL BEGIN ON THE MOUNT OF OLIVES.” “How does that – ? Oh. Aleph. Olives. Um. Sort of. But it needs to be sudden and surprising. It needs to have pizazz. You’ll get it eventually.” One got the impression that if Uriel had not been hundreds of feet tall, Sohu would have tried to pat his head. “Aaaaaaaaaah!” Sohu waved her arms. “That! That should have been your joke! Knock knock! Who’s there? Aleph. Aleph who? All of my jokes are terrible.” “I don’t get it! You are so good at all of this language stuff, and you can find like seven zillion connections between apparently unrelated words, and you can’t crack a basic knock-knock joke! Why? WHY?” “OF ALL KABBALISTIC CORRESPONDENCES, THE MOST IMPORTANT IS THE CLAIM THAT GOD MADE MAN IN HIS OWN IMAGE. EXPLAIN HOW THE STRUCTURE OF DIVINITY CORRESPONDS TO THE HUMAN BODY.” “The ten fingers are the ten sephirot, the ten emanations by which God manipulates the material world. The bilateral symmetry is the two branches of the Tree of Life, which correspond to the two human arms. The right branch is called Mercy and the left branch is called Severity.” “SEVERAL MONTHS AGO, I GAVE YOU A HOMEWORK ASSIGNMENT. YOU WERE TO FIGURE OUT WHY IN HUMAN POLITICS, THE RIGHT-WING TENDS TO BE CONCERNED WITH JUSTICE AND THE LEFT-WING WITH MERCY, EVEN THOUGHT THESE ARE THE OPPOSITES OF THE KABBALISTIC CORRESPONDENCES.”"
