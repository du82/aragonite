["http://unsongbook.com/chapter-45-in-the-remotest-bottoms-of-the-caves"]
title = "Unsong"
description = "Praise the LORD from my hand for my son, to make a faster machine. — kingjamesprogramming.tumblr.com Evening, May 13, 2017 Citadel West Sarah finished telling her story. “Wow,” said Jinxiang. She mulled it over for a second to see if … Continue reading →"
full_description = "Praise the LORD from my hand for my son, to make a faster machine. — kingjamesprogramming.tumblr.com Sarah finished telling her story. “Wow,” said Jinxiang. She mulled it over for a second to see if she had any other comment, then just added, again: “Wow”. During the Cold War, the United States had lived in uneasy peace with the Soviets on the mutual knowledge that if the Soviets nuked America, then America would nuke them back. This led some of the more paranoid military brass to ask: what if the Soviets nuked our Department Of Nuking Things Back first, then nuked the rest of us? Then where would we be? It was decided to spare no expense to place the Department Of Nuking Things Back somewhere so indestructible that if ever the sun were to crash into the Earth at a million miles an hour, all they would notice would be a soft ‘thud’ and a slight increase in heating bills. The spot chosen for this auspicious project was Cheyenne Mountain, a ten thousand foot high solid granite peak right outside Colorado Springs. They dug two thousand feet into the solid rock, cleared out five acres of space, surrounded the whole area in electromagnetic shielding, and built a tiny little town inside the mountain. There the Department of Nuking Things Back aka NORAD watched the skies throughout the Cold War; when the Soviet threat dissipated, the Comet King made it his home. Now it was Citadel West, part palace, part nerve center, part government office. The impregnable heart of the Royal Coloradan state. The three of us had rematerialized in an alcove of the citadel’s chapel amidst a Beanie Baby heptagram just like the one we’d left. As soon as I arrived, Sarah had grabbed me out of the way as Jinxiang burnt the purple dragons to ashes to prevent anything from following us through. Something clicked. The Vanishing Name took you to a situation complementary to the one you’d left. If you were smart, you’d start testing what exactly it meant for a situation to be complementary. Arrange artificial complementary situations, and maybe you could control your destination. If, for example, there was some sort of totally ridiculous structure that you could be sure there was only one of in the entire world – for example, a heptagram made up sparkling purple Beanie Baby dragons – then if you made a second such structure, it would be uniquely complementary to the first. That meant a portable portal anywhere you traveled, capable of returning you home. My mind boggled with the implications. How long ago had the Vanishing Name been discovered? Last month? The month before? The Cometspawn must have heard about it, realized the implications, done a slew of tests to determine what situations counted as complementary, and ended up sitting on a technology which could change the world almost as dramatically as the Vital Name itself. Meanwhile, we Singers had stolen the same Name, and all we’d done was make jokes among ourselves about which band of hooligans we’d rather be accosted by. I started to feel very small."
