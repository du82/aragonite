["https://unsongbook.com/interlude-%d7%93-n-grammata"]
title = "Unsong"
description = "The shortest effective Name of God is the Tetragrammaton. This was the Name recorded in the Bible, the one the High Priests of Israel would speak in the Temple of Solomon. The rabbis said it was so holy that God … Continue reading →"
full_description = "The shortest effective Name of God is the Tetragrammaton. This was the Name recorded in the Bible, the one the High Priests of Israel would speak in the Temple of Solomon. The rabbis said it was so holy that God would smite any impure person who said it. Some of them went on wild flights of raptures about the holiness of this Name, said it was the Shem haMephorash, the holiest Name of all. In these more enlightened times, we know better. We call it the Mortal Name, and it just so happens to be a Name whose power is to kill the speaker. As the shortest Name, it kept working long after the flow of divine light into the universe had dropped to a trickle; there were records of men dying by speaking the Mortal Name as late as Jesus’ time. If the kabbalists had just said “Yup, Names do lots of things, this one kills whoever says it,” then there would have been no problem, but this was back when Rabbi Shimon was working on the Zohar and the kabbalists were still underground, sometimes literally. So instead everybody assumed a Name powerful enough that God smote anyone who said it must have been very important, and people kept trying to say it to prove their holiness and kept dying. They worked out this whole horrible system. On Yom Kippur, the High Priest would go into the Holy of Holies in the Temple, place his hands upon the Ark of the Covenant, and speak the Tetragrammaton. The theory was that if the holiest person went into the holiest place on the holiest day and touched the holiest thing, maybe that would be enough holiness to speak the Tetragrammaton and live to tell about it. Did it work? The Bible is silent on the subject, but Rabbi Klass of Brooklyn points out that during the 420 years of the Second Temple, there were three hundred different High Priests, even though each High Priest was supposed to serve for life. Clearly, High Priests of Israel had the sorts of life expectancies usually associated with black guys in horror movies. Also, some medieval manuscripts mention that the High Priest would have a rope tied around his leg at the time, to make it easier for his flock to drag his body out after he died."
