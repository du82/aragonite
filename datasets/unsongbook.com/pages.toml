["http://unsongbook.com/chapter-39-fearful-symmetry"]
title = "Unsong"
description = "Tiferet’s position down the center between Keter and Yesod indicates to many Kabbalists that it is somewhat of a “converting” Sephirot between form (Yesod) and force (Keter). In other words, all crossing over the middle path via Tiferet results in … Continue reading →"
full_description = "Tiferet’s position down the center between Keter and Yesod indicates to many Kabbalists that it is somewhat of a “converting” Sephirot between form (Yesod) and force (Keter). In other words, all crossing over the middle path via Tiferet results in a reversed polarity. Ana groaned, grudgingly regained consciousness. James was shaking her, lightly. “Are you awake?” he whispered. Her mouth was desert-dry. Her muscles were sore. She tried to get up, only to find she was tied to the bed. “Long story. Edgar Crane cornered one of the druggies on the ship, told the Drug Lord that Simeon Azore was on the ship, offered to dose him in exchange for help getting Reno back. Drug Lord was interested because he figured Azore would know secret Names. He gave Crane some buttons, Crane stuck them in the soup tonight at dinner. I was meeting with John and the captain and we were late for dinner, and drugs don’t work on Amoxiel. So it was just you, Azore, Hope, Tomas and Lin who got dosed. There was a bit of a fight. Amoxiel’s vicious when he wants to be. Now Crane’s dead. John’s really injured. But the Drug Lord couldn’t take over the ship. He gave up and we tied up the others so they’d be safe while they came down. When we tried to tie you up, you told us that if we tried to touch you you’d jump off the side of the ship and drown yourself. So we let you be. Then an hour or so later you stopped resisting and just fell asleep, so we tied you up.” He untied the last rope and lifted Ana out of bed. “You all right?” Things were getting interesting. The hills of Baja California had given way to lush jungle. “Where are we?” asked Ana. The whole crew was assembled on the deck now. The Captain rarely spoke, but when he did he meant business. Now he faced them and said “John’s dying. Lin used the Static Name on him and bought him a little time. I give him a day or two. At most. We need to go to Kennedy Space Center.” “There’s a launch a day from now. On any other ship it would be impossible. On Not A Metaphor, we can make it. But only if we cross the Canal.”"
