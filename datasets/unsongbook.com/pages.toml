["http://unsongbook.com/prologue-2"]
title = "Unsong"
description = "I. In retrospect, there had been omens and portents. (“We are now approaching lunar sunrise,” said William Anders, “and for all the people back on Earth, the crew of Apollo 8 has a message that we would like to send … Continue reading →"
full_description = "(“We are now approaching lunar sunrise,” said William Anders, “and for all the people back on Earth, the crew of Apollo 8 has a message that we would like to send to you.”) Rivers flowed uphill. A new star was seen in the night sky. A butchered pig was found to have the word “OMEN” written on its liver in clearly visible letters. (“In the beginning, God created the heaven and the earth. And the earth was without form, and void; and darkness was upon the face of the deep.”) Lightning struck in clear weather. Toads fell from the clouds. All ten thousand lakes in Minnesota turned to blood; scientists blamed “phytoplankton”. (“And the Spirit of God moved upon the face of the waters. And God said, Let there be light: and there was light. And God saw the light, that it was good: and God divided the light from the darkness.”) A majestic golden eagle flew onto the Vatican balcony as Pope Paul VI was addressing the faithful. The bird gingerly removed the Pontiff’s glasses with its beak, then poked out his left eye before flying away with an awful shriek. (“And God called the light Day,” said Jim Lovell, “and the darkness He called Night. And the evening and the morning were the first day.”) (“And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.”) Pieces of paper with the word “OMEN” written on them fell from the clouds. A beached whale was seen in the night sky. Babies left unattended began to roll slowly, but unmistakeably, uphill. (“And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament: and it was so. And God called the firmament Heaven. And the evening and the morning were the second day.”) One of the additional eyes on the four-eyed baby was discovered to be the left eye of Pope Paul VI, missing since the eagle incident. The provenance of the fourth eye was never determined. (“And God said, Let the waters under the heaven be gathered together unto one place,” said Frank Borman, “and let the dry land appear: and it was so.”)"
