["https://unsongbook.com/chapter-11-drive-the-just-man-into-barren-climes"]
title = "Unsong"
description = "May 11, 2017 San Jose I. Time and chance, according to the Book of Ecclesiastes, happeneth to us all. Ana had planned to sleep in, but it so happeneth that she woke up hungry and found herself out of milk. … Continue reading →"
full_description = "Time and chance, according to the Book of Ecclesiastes, happeneth to us all. Ana had planned to sleep in, but it so happeneth that she woke up hungry and found herself out of milk. She threw on an old t-shirt – one she had gotten at a theodicy conference a few years ago, with the motto WHO WATCHES THE WATCHMAKER? on the front – grabbed a shopping bag, and headed out to the 7-11 on the corner. Seven represents the world – thus the seven days of creation, the seven worldly sephirot below the Abyss, and the seven continents. Eleven represents excess, a transcendence of the supernatural completeness of ten into an unlawful proliferation of forms. Added together they make eighteen, corresponding to the gematria value of the Hebrew word “chai”, meaning life. Therefore, 7-11 represents an excess of worldly life-sustaining goods – in other words, too much food. In keeping with the secret laws of God, Ana caved in and bought a box of donuts. When she saw the vans, she briefly hoped that her housemate Aaron, the alternately annoying and lovable amateur kabbalist who had a crush on her but whom she tolerated anyway – was still at Stanford picking up library books. That hope vanished when she saw the street plunged into darkness, heard the sound of gunshots. There was a part of her that wanted to run back and help (how? wielding the bag of groceries as a weapon?) and another part that wanted to at least run inside to destroy the computers before UNSONG could get its hands on them. She knew some Names – maybe not as fluently as I did, but she knew them. But she also knew that only total idiots engaged in magical duels against an armed opponent, so instead she ran, her bag of milk and donuts bobbing beside her. I don’t know why she didn’t drop it, except that maybe when you’re panicked you don’t think straight. Five minutes’ running brought her to the Berryessa BART Station, all sweaty and out of breath. She took out her card, ran it through the turnstyle. A train arrived almost immediately. She got on, not even looking at where it was going. She had to get away, as far as possible, somewhere that would make UNSONG’s search area unmanageably large. And so hour and a half later, she reached the end of the line and stepped off the BART at Pleasanton and started putting distance between herself and the station. After ten minutes’ running through parking lots and subdivisions she sat down in a field by the side of the road and let herself breathe again, let herself think."
