["https://unsongbook.com/chapter-27-the-starry-floor-the-watery-shore"]
title = "Unsong"
description = "May 12-13, 2017 Pacific Ocean I. James Belowdecks was the crew quarters. Ana didn’t expect her own room and didn’t get it. Her berth had four beds: one for her, three others for James, Lin, and Tomas. Her bed was … Continue reading →"
full_description = "Belowdecks was the crew quarters. Ana didn’t expect her own room and didn’t get it. Her berth had four beds: one for her, three others for James, Lin, and Tomas. Her bed was technically Amoxiel’s, but the angel didn’t sleep. As far as they could tell, he just sort of sat on the deck all night, staring wistfully at the stars. She was used to living with men; she’d lived in a group house for over a year now. She wasn’t picky; if she had been, the cramped atmosphere of the Not A Metaphor would have desensitized her quickly. James was in the bunk below her. Even during his short nap, he had fitful dreams. Ana asked him what he dreamt of. For a while he didn’t answer. “Things I did,” he eventually said. “I was in the Other King’s army once. Before we really knew how bad he was. After Never Summer, but not by much. But he was still bad. I shot folks, probably innocent ones. That’s what I dream about. And the Broadcast. I dream about the Broadcast, and I worry that’s going to be me.” “They say anyone who sincerely repents and promises to live a virtuous life will be saved,” said Ana. “Yeah, and here I am. On a boat, trying to find God so we can board his ship and, I dunno, hijack him or something,” said James. “Virtuous life, my left foot.” If James was taciturn, Lin wouldn’t shut up. He talked about anything. He talked about whether they would have good winds, he talked about the calculations pinning down Metatron’s next appearance near Fire Island in New York, he talked about his youth as an apprentice ritualist in Arizona. “That was back when placebomancy was just another strain of ritualism,” he told Ana. “The counterculture version, started by Shea and Wilson back in ’76. Dabbled in it myself, found it helpful. Then everything went to hell when Alvarez killed the Council. Ritualism fell apart, placebomancy became associated with Alvarez and violence, now practically nobody does either. Anybody gets too good at ritual magic, Alvarez kills them. Or if he doesn’t, they think you’re working with Alvarez and get more and more suspicious till you’re fired on some dumb pretext. There’s no future in it anymore. With time we would have been able to do as much as the kabbalists, and without the copyright restrictions. Instead we’re looking over our shoulders and being shown the door.”"
