["https://unsongbook.com/chapter-10-bring-the-swift-arrows-of-light"]
title = "Unsong"
description = "Notice also that the sharing is what enables us to increase the trespass of thy brethren. — kingjamesprogramming.tumblr.com May 11, 2017 San Jose Campus library hadn’t changed much since I got expelled. I checked out three big books without even … Continue reading →"
full_description = "Notice also that the sharing is what enables us to increase the trespass of thy brethren. — kingjamesprogramming.tumblr.com Campus library hadn’t changed much since I got expelled. I checked out three big books without even so much as a “You don’t look like an Ana Thurmond,” let alone UNSONG goons hauling me off somewhere. Thank goodness for automatic card reader machines. I spotted them as soon as I got to our street. Three big black vans parked in front of Ithaca. There were about a dozen officers? – soldiers? – let’s stick with goons – in black uniforms organizing somne kind of formation to knock on the door. My mind ran through all of the scenarios. Somehow Bill had found out why we needed his computer and ratted on us. No, there was no way for him to figure that out, and even though I didn’t like the guy he wasn’t a Judas. Okay, maybe UNSONG had just gotten generally tired of us hosting secret Unitarian meetings. It was possible. They’d gotten that group in Colorado. Maybe they were cracking down. Except that would mean that the whole thing with the Vital Name was a coincidence, and nothing was ever a coincidence. Then I thought of the drop-dead simple, blindingly obvious answer, which was that Llull was well-ordered. Unless you gave it a random seed, it would always start in the same part of Maharaj space and go in the same direction, checking potential Names in the same order. So if UNSONG ever wanted to catch anyone who had found a way to make Llull work, all they would have to do is retrace Llull’s steps by hand. Through unfortunate coincidence, it was only a couple of hours before Llull got its first Name, the sort of performance a good sweatshop could replicate in a week. UNSONG had handed the Llull Maharaj ordering over to a sweatshop, gotten the first Name out of it – that stupid Moon-Finding Name, no less – and then tattooed it on the ears of their sentinels. Just in case. Frick. They were smart. They were operating at a level so far above me I couldn’t even see them. I had really, really blown it."
