["http://unsongbook.com/interlude-%D7%9E-miss-american-pie"]
title = "Unsong"
description = "April 22, 2017 San Jose A piece of onion flew past my head. This was a common occurrence when I argued with Erica while she was trying to cook. Today we were arguing about the lyrics of American Pie. She … Continue reading →"
full_description = "A piece of onion flew past my head. This was a common occurrence when I argued with Erica while she was trying to cook. Today we were arguing about the lyrics of American Pie. She thought it was about rock n’ roll. I thought it was about Christian soteriology’s claim to supersede the Jewish conception of divine law. The first stanza was clearly setting up a contrast between the twin poles of song and dance. Song represented divine goodness or mercy. Its first three letters were “son”, corresponding to the second person of the Christian Trinity, and there were the kabbalistic implications from UNSONG and Peter Singer to consider. Dance represented divine justice, because its first three letters were “dan”, and “dan” or “din” is Hebrew for “judgment”, like in the Beth Din or the name Daniel, “judgment of God”. That wasn’t how I earned the onion, though. I’d earned the onion because of the chorus. He drove a Chevy to the levee, but the levee was dry. Well, “shevet” was the Hebrew word for “tribe”, so a Chevy at the levee means the Tribe of Levi, ie the priesthood. John 7:24 says that “Whoever believes in me, as the Scripture has said, ‘Out of his heart will flow rivers of living water.’” When the song says that the levee/Levites were dry, it’s pushing the standard Christian line that the Pharisee priests of Jesus’ day had become so obsessed with the Law that they had lost true faith. Apparently Erica believed this interpretation merited an onion, even though in the very next line they refer to whiskey, which comes from the Irish uisce beatha, meaning “water of life”, which is practically an exact match for the John quote. I had a tough audience. Bill Dodd walked in through the unlocked door, saw the table empty but for myself. “Am I early?” he asked. “Everyone else is late, as usual,” said Erica. “Please, save me. Aaron was just trying to convince me that American Pie is about Christian soteriology.” Then she had to explain the whole conversation thus far to Bill, and then Bill protested that it was obviously about the history of rock and roll, even though it clearly wasn’t. “Seriously!” I protested. “The very next stanza starts out with ‘Did you write the Book of Love / Do you have faith in God above / if the Bible tells you so?’ How do you not see that as an attempt to contrast the Old Testament – the Book of the Law – with the New Testament as the Book of Love, offering salvation by faith?”"
