["http://unsongbook.com/chapter-26-for-not-one-sparrow-can-suffer-and-the-whole-universe-not-suffer-also"]
title = "Unsong"
description = "St. Francis saw above him, filling the whole heavens, some vast immemorial unthinkable power, ancient like the Ancient of Days, whose calm men had conceived under the forms of winged bulls or monstrous cherubim, and all that winged wonder was … Continue reading →"
full_description = "St. Francis saw above him, filling the whole heavens, some vast immemorial unthinkable power, ancient like the Ancient of Days, whose calm men had conceived under the forms of winged bulls or monstrous cherubim, and all that winged wonder was in pain like a wounded bird. — St. Francis of Assisi, by G.K. Chesterton Sohu sat on her cloud, snacking on manna with ketchup on top. He had been doing this increasingly often over the past few weeks, asking her to tell him about a word, never satisfied with the amount of meaning she was able to wring from it. It didn’t matter how many connections she drew, how many languages she was able to weave together, he would always just say something like “YES, BUT WHAT DO YOU MAKE OF PROTO-NABATEAN, IN WHICH THE SAME WORD REFERS TO AN OBSCURE KIND OF COOKING-IMPLEMENT?” and she would have to admit that, for some reason, that had never crossed her mind. She sighed theatrically, but gave no further protest. “In Proto-Semitic,” she said, “it is akwa. In Proto-Eurasiatic, also akwa. In Proto-Amerind, akwa again. So we’re getting a very strong aleph-kaf-vav vibe. Aleph connects Chesed to Gevurah, and kaf connects Chesed to Binah, and vav connects Binah to Keter, so we’re getting two paths out of Chesed, one all the way up to Kether, and the other down to Gevurah.” “So we’re invoking Chesed, the kindness of God. Compare Psalm 65: “You visit the Earth and water it, you greatly enrich it with the river of God, which is full of water.” But we’re also invoking Gevurah, the severity of God. Water is the kindess of God, but also His severity; think Noah’s flood, where it was His severity that punished the wicked, but His kindness that saved Noah and promised never again to flood the Earth. We’ve got Binah, the understanding of God. Spiritual growth. Compare John 4:14: “Whosoever drinketh of the water that I give him shall never thirst; the water that I shall give him shall be a well of water springing up into eternal life.” And finally, we’ve got Kether. The crown of God. Human beings are 66% water. The human brain is something like 90%. Human beings are made in God’s own image. Therefore, Kether."
