["http://unsongbook.com/chapter-37-love-that-never-told-can-be"]
title = "Unsong"
description = "May 13, 2017 Las Vegas “Sinner” in Biblical Hebrew is “aval”, no doubt kabbalistically connected to our English word “evil”. The gematria value of “aval” is 106. Bishop Ussher, the Biblical chronologist who fixed Creation at 4004 BC, tells us … Continue reading →"
full_description = "“Sinner” in Biblical Hebrew is “aval”, no doubt kabbalistically connected to our English word “evil”. The gematria value of “aval” is 106. Bishop Ussher, the Biblical chronologist who fixed Creation at 4004 BC, tells us that 106 years passed between Noah’s flood and the Tower of Babel. This is unsurprising; the decision to build a tower to Heaven out of vanity is a sinful act; thus instances of 106, the number of sinners, will appear around it. Jane and I were eating breakfast in the Top Of The World observation deck/restaurant on the 106th floor of the Stratosphere Tower in Las Vegas. All around us, floor-to-ceiling glass windows presented a view of Las Vegas that would normally require a flying kayak. I wondered if Jane had contacts in Los Angeles who would retrieve her boat for her. It seemed like too wonderful an artifact to just abandon. “So the plan,” said Jane, in between bites of crepe, “is to take the bus to Rogue Toys on the strip, which everyone says has pretty much every Beanie Baby ever made. We’ll get the purple dragon, then get out.” She was serious. She had her luggage with her and she’d bought me a backpack. We weren’t even coming back to the hotel afterwards. We were getting that dragon and then getting the hell out of Vegas. “Get out where?” I asked. Colorado was besieged; getting through enemy lines would be almost impossible. Were we going straight back to Los Angeles? Jane smiled. “You’ll see,” she said. At least now her obstinate denial of information was pleasant instead of confrontational. She’d still made me sleep gagged and handcuffed to the bed last night, but she’d sounded a little apologetic about it. I was starting to hope she’d just been in a temper after the debacle at the Angel Reserve, and that she could be nice enough when she wanted to be. Should I tell her about the Beanie Baby hidden in my Apple-Ade? Part of me wanted to abandon my suspicions and commit to working with Jane. Part of me even wanted to walk back on the the plea for help I’d given Ana, tell her that things seemed sort of under control, that I was with a genuine Coloradan who was showing me the world, luxurious hotel by luxurious hotel. But – I thought – Jane would replace her Beanie Baby at the store today anyway, and all I’d do by telling her was lose her trust. Better to let her buy a replacement, then trash the Apple-Ade bottle with her never the wiser."
