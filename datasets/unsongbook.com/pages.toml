["https://unsongbook.com/chapter-5-never-seek-to-tell-thy-love"]
title = "Unsong"
description = "My beloved is like a bit of information that flows in the system. — kingjamesprogramming.tumblr.com I. I remember the first time I met Ana Thurmond. I’d just been kicked out of Stanford. My mother was a wreck. I had to … Continue reading →"
full_description = "My beloved is like a bit of information that flows in the system. — kingjamesprogramming.tumblr.com I’d just been kicked out of Stanford. My mother was a wreck. I had to get away from her. I took the first minimum wage job I could find, a clerk position at Cash For Gold. It wasn’t so bad. There was a sort of kabbalah to it, freely interchanging symbols with material reality. I could respect that. I sat behind a register and studied Talmud and Zohar most of the day, and sometimes an elderly woman would come in to trade her jewelery for rather less than it was worth, and I would facilitate the transaction. Every so often I would get to a particularly interesting Talmudic tractate and stay past closing time. Sometimes I’d be there late into the night. It was a more congenial environment than my mother’s apartment. Nobody noticed and nobody cared. That was why I was still there at eleven or so one night when I heard a sort of commotion outside. I opened the door and caused a stunningly beautiful girl to fall off a stepladder. “Euphemism!” she said. I swear to God she said “Euphemism.” “Are you okay?” I asked. She was. She was holding two big yellow letters. I looked up at our sign. It was missing two big yellow letters. “What do you think you’re doing?” I asked. I am bad at sounding threatening, but she was like 5’4, maybe 5’5, and also lying on the ground looking very ashamed, and so putting menace into my voice was easier than usual. “You’re not a kabbalist. If you were a kabbalist, you’d have more respect! You can’t just go removing letters from signs like that! Matthew 5:18: ‘Verily I say unto you, not a single letter, nor even a stroke of a letter, shall be removed until all is fulfilled.'” “Oh, you want to go there?” She caught her breath and stood back up. “Matthew 16:4: ‘This evil and adulterous generation wants a sign, but no sign shall be given to it.’” “But,” I said, “By removing the letter L, you make “God” out of “gold”. But the warning against idolatry in Exodus 20:23 says ‘You shall not make a god out of gold.'”"
