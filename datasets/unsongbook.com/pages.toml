["http://unsongbook.com/chapter-53-lover-of-wild-rebellion"]
title = "Unsong"
description = "Morning, May 13, 2017 New York City Alvarez’s apartment was so packed with books, bomb-making supplies, and extra people that somebody had to sleep in the closet. Erica had volunteered. She figured the former Lord High Magician of the Midwest … Continue reading →"
full_description = "Alvarez’s apartment was so packed with books, bomb-making supplies, and extra people that somebody had to sleep in the closet. Erica had volunteered. She figured the former Lord High Magician of the Midwest deserved the sofa more than she did. Any sacrifice for the Revolution. Erica sat up and shrugged. The older man closed the door, turned on the light, and sat down beside her. He had to almost contort himself not to touch her, not to give any hint of impropriety. “Doesn’t do anything unless I’m sending it at him. I think. Still new to this. What’s the problem?” Mark sighed. “Look. I’m doing this because I promised, because it’s his condition for springing me out of prison. Which he got me into. But you could just go invisible right now, vanish, never see him again. Listen. I know he’s charming, I know he’s fascinating, heck, I spent my college years getting caught up in one of his hare-brained schemes after another, but listen, Erica, all that stuff about Mexico, it’s total lies, for all I know he grew up third-generation immigrant in the States. There’s no reason. He doesn’t care. He’s a narcissist, he’s a psychopath, at the bottom of all the flowery words and wisecracks there’s nothing there, just blankness. If you stick with him he’ll grind you up and use you in some way that looks hilarious from the outside but will leave you dead or broken. You should never have linked your mind to him, you should never have come here, but please, listen to me, it’s not too late for you to get out.” “I shouldn’t have tried to do this,” said Mark. He started to get up. Erica put a hand on his knee. He sat back down again. “I don’t know Dylan,” Erica said. Not in the way you would say ‘I don’t know that man over by the corner,’ but in the way a stoner might say ‘I don’t know my own hand, like, not really.’ “I’m not doing this for Dylan. I’m doing it for me.” “You think you’re doing it for you,” Mark said. “He’s like a black hole. Everything ends up in his orbit eventually.”"
