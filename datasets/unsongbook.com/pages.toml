["https://unsongbook.com/chapter-13-the-image-of-eternal-death"]
title = "Unsong"
description = "October 10, 1990 Gulf of Mexico I. “Good morning,” said Sohu as she stepped out of her cottage. Technically it was already afternoon. She hadn’t slept late, but she’d stayed inside, studying, dreading to open the door. Uriel had no … Continue reading →"
full_description = "“Good morning,” said Sohu as she stepped out of her cottage. Technically it was already afternoon. She hadn’t slept late, but she’d stayed inside, studying, dreading to open the door. Uriel had no concept of small talk, and precious little concept of scheduling. She knew the moment she walked outside he would start expounding kabbalah at her, talking faster than she could follow and demanding impossible feats of scholarship. It wasn’t that she dreaded it, exactly. Just that she wanted to be able to steel herself a little before facing it. As for the archangel, he never seemed to notice or care about the time. She suspected she could have just stayed inside all week and spared herself any lessons at all, if she had been so inclined. But then why live with an archangel in a hurricane? “LAST WEEK I SAID YOUR HOMEWORK ASSIGNMENT WAS TO LEARN EVERY LANGUAGE,” said Uriel. “DID YOU – ” “YOU HAVE SEEMED SOMEWHAT LOST RECENTLY. I BORROWED A HUMAN BOOK ON EDUCATION. IT SAYS THAT IN ORDER TO KEEP CHILDREN ENGAGED, YOU SHOULD TELL JOKES THROUGHOUT YOUR LESSON.” Sohu mentally assessed whether this was better or worse than the normal way Uriel did things, came up blank. “Slow down! I say knock knock. You say who’s there. I say a name. You say that same name, and then you add ‘who’. And then I make a joke.” “I said Avery, like it was my name. But actually, I was using it as part of the phrase ‘a very silly knock knock joke.'” “It’s like…it’s like what you were saying about kabbalistic correspondences. Two different things that have the same structure. The name Avery, and the words ‘a very’, and you don’t see it at first, but then later you do.” Uriel stood quietly, glowing letters swirling all around him. He seemed to be thinking deeply, as if this were a far harder problem than merely stabilizing the El Nino cycle (his project for yesterday) or defragmenting mammalian DNA (the day before). “‘NACHASH’ IS THE HEBREW WORD FOR SERPENT, BUT IT HAS A GEMATRIA VALUE OF 358, WHICH IS THE SAME AS THE HEBREW WORD “MOSHIACH’, MEANING MESSIAH. THUS, ALTHOUGH THE SERPENT INTRODUCES SIN INTO THE WORLD AND THE MESSIAH REDEEMS THE WORLD FROM SIN, BOTH ARE KABBALISTICALLY IDENTICAL. YOU ARE NOT LAUGHING.”"
