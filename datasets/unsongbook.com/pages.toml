["http://unsongbook.com/chapter-52-the-king-of-light-beheld-her-mourning"]
title = "Unsong"
description = "And the shepherds returned, glorifying and praising God for all the possible values of x and f(x). — kingjamesprogramming.tumblr.com July 29, 2001 Gulf Of Mexico Winter ended. Summer passed. Another and another. Uriel taught Sohu for eight more years after … Continue reading →"
full_description = "And the shepherds returned, glorifying and praising God for all the possible values of x and f(x). — kingjamesprogramming.tumblr.com Winter ended. Summer passed. Another and another. Uriel taught Sohu for eight more years after the eclipse, eight years without her aging a day. In 1993, Sohu used Kefitzat Haderech to join her family in Colorado for Hanukkah. Her father said nothing when she came unannounced, striking the table deep in her father’s bunker in the form of a lightning bolt, just smiled, and said she was welcome, and that he hoped this meant she would be visiting more often. In 1994, when Sohu was twelve years old by the calendar, Uriel suggested she get a Bat Mitzvah. “I’m not Jewish and I never age!” Sohu protested. “WHAT ARE YOU?” asked Uriel. “Half Hopi Indian, a quarter Hindu, and a quarter comet,” she said. “WHAT DO HALF-HOPI QUARTER-HINDU QUARTER-COMET PEOPLE DO WHEN THEY TURN TWELVE?” asked Uriel. “Order in pizza,” said Sohu. So they did. In 1995, Sohu mastered Turkish, just to make Uriel happy, and Proto-Turkic to boot. Then she learned Aramaic, so she could tease him about a language he couldn’t understand. In 1996, Uriel declared that Sohu understood Yetzirah sufficiently to attempt contact with the world above it, Briah. The first time Sohu touched Briah, she accidentally made all the rivers in the world run in reverse. “AT LEAST YOU ARE CONSISTENT,” Uriel told her. In 1997, Sohu declared that she was going to learn to cook. She brought a stove, an oven, and several cabinets full of ingredients back with her to the hurricane and very gradually progressed from awful to terrible to at-least-better-than-manna. She made Uriel try some of her concoctions. He always said they were VERY GOOD, but when pressed he admitted he didn’t have a sense of taste and was calculating in his head how the gustatory-receptor binding profiles would work. In 1998, Sohu stayed in the hurricane almost full-time, trying to get a sufficient grasp of the archetypes and correspondences that she could touch Briah without messing it up. The going was difficult, and the occasional successes almost inevitably marked by failures that followed soon afterwards."
