["https://unsongbook.com/chapter-43-lest-they-be-annihilated-in-thy-annihilation"]
title = "Unsong"
description = "And Abraham said unto the LORD, “Will you not destroy the world if there are even a million righteous people in it?” And the LORD replied unto Abraham, “The world shall not be destroyed if there are even a thousand … Continue reading →"
full_description = "And Abraham said unto the LORD, “Will you not destroy the world if there are even a million righteous people in it?” And the LORD replied unto Abraham, “The world shall not be destroyed if there are even a thousand competent people in it. I don’t have anything to do with the process, mind, just making a prediction.” — Eliezer Yudkowsky This meaning we derive from Genesis 18-19. God tells Abraham that He has decided to destroy Sodom for its wickedness. Abraham asks God to spare the city if there are even fifty righteous men, and God agrees. Step by step, Abraham bargains God down to a mere ten righteous men, but he doesn’t try to bargain any further. And there turns out to be only one righteous man – Abraham’s nephew Lot. So God destroys Sodom, but warns Lot and his family to run away and not look back. Lot and his family rush out of the city, but his wife can’t help looking back to see what’s going on, and for her disobedience God turns her into a pillar of salt. Today President Reagan is meeting with the Devil in the White House to try to escape destruction by heavenly fire, and the name of the summit is Strategic Arms Limitations Talk (SALT). When the sky cracked, the world briefly escaped nuclear apocalpyse; atomic weapons were among the many technologies that stopped working. The respite lasted until the early 1980s, when a European rabbi studying Vayeira managed to extract fifty letters to make the Wrathful Name, an incantation that leveled cities. Originally a Neu Hansa state secret, within months it leaked to the Untied States. President Reagan ordered scrolls containing the Name placed atop the remaining Minuteman rockets, and thus was born the ICKM – the inter-continental kabbalistic missile. Hell was not above using its citizens as human shields. When Thamiel learned of the Name’s existence, he gathered hundreds of thousands of children from all across his empire into the strategically valuable cities. America hesitated. Before they could come to a decision, it was too late. Hell had stolen the Name. Demons couldn’t use Names directly, but they had various human prisoners and collaborators. Soon Thamiel had ICKMs of his own."
