["http://unsongbook.com/chapter-50-silent-as-despairing-love"]
title = "Unsong"
description = "Praise the LORD from my hand for my son, to make a faster machine. — kingjamesprogramming.tumblr.com Evening, May 13, 2017 Citadel West They had taken us back to the NORAD command center. We sat at the big table, listening to … Continue reading →"
full_description = "Praise the LORD from my hand for my son, to make a faster machine. — kingjamesprogramming.tumblr.com They had taken us back to the NORAD command center. We sat at the big table, listening to the reassuring hum of a missile-free North American airspace. NORAD is a very Semitic-looking word. The Hebrew stem would be nun-resh-dalet; and indeed we find it in the Bible, referring to a plant we English-speakers transliterate as “nard”. During New Testament times produced a very expensive perfumed oil, and Mary of Bethany was so excited when Jesus came to visit that she anointed his feet with it. Judas Iscariot chewed her out, saying that she could have sold the oil instead and gotten enough money to feed dozens of poor people. Jesus quieted him down by saying “The poor you will always have with you, but you will not always have me.” But there are other options. Hebrew has “narad”, meaning to go down or descend. Greek has “Nereid”, the goddesses of the deep. English has “nerd”, a technologically-minded smart person, and “neared”, ie having drawn closer. Put it all together, and we get somewhere down very deep, filled with smart people and technology, dedicated to watching for things that might be drawing closer to them. Nathanda sat at the center of the big table, flanked by Sohu, Caelius, and Vihaan. Jinxiang, Sarah and I took the other side. No one was at the head of the table. The Comet King’s black opal throne dominated the room with its emptiness. “The poor you will always have with you,” it seemed to say, “but you will not always have me.” Sarah was awake now. She clutched my leg so hard it was almost painful, but she didn’t try anything. The Cometspawn had her outclassed, and she knew it. Gebron and Eleazar’s book said that only four kabbalists had ever gazed upon Adam Kadmon bare. One was the archangel Uriel. One was Rabbi Isaac Luria. One was the Comet King. And there was the fourth, sitting in front of me, looking to all the world like an eight-year old girl. Charming, disarming, innocent."
