["http://unsongbook.com/chapter-46-to-talk-of-patience-to-the-afflicted"]
title = "Unsong"
description = "Why some people think the self is a prison escapes me. — @GapOfGods Dawn, May 13, 2017 Ossining, NY Commenters say Song of Songs 4:12 describes the imprisonment of the divine presence in the material world. “A garden locked is … Continue reading →"
full_description = "Commenters say Song of Songs 4:12 describes the imprisonment of the divine presence in the material world. “A garden locked is my sister, my bride,” it begins. “A rock garden locked, a spring sealed up.” The most famous prison in the Eastern Untied States is called Sing Sing, and Mark McCarthy was serving four consecutive twelve-year sentences there. This is not a coincidence because nothing is ever a coincidence. “Look not upon me,” says the Song of Songs, “because I am black, because the sun hath looked upon me.” Mark McCarthy’s cellmate was black, but the sun no longer looked upon him. He was in for life. “My mother’s children were angry with me; they made me the keeper of the vineyards; but mine own vineyard have I not kept.” He’d gotten really drunk one night, then killed his brother in an argument over drugs. Now he slept, snoring like a freight train. Mark didn’t sleep. He wasn’t very good at sleeping these days. The prison doctor had given him a wheel with seven scrolls of the Somnolent Name, but he wasn’t going to see the doctor again for a month. The old conundrum. Run through seven scrolls in a week and get no sleep for the following three? Or space them out and spend tonight listening to Moe snoring? He knew the Somnolent Name. It was short, only fourteen letters. He could speak it. He could fall asleep right now. He could have the UNSONG agent in Sing Sing hear him and add another few years to his sentences. Four twelve-year sentences for killing four High Ritual Magicians. It was less than he’d expected. The judge had instructed the jury to take his past sterling behavior and apparently good character into account. No one had believed him when he said the past sterling behavior and good character indicated that he didn’t do it, that Dylan Alvarez had somehow infiltrated the American Board of Ritual Magic and then framed him for the killings. The evidence had been too overwhelming. The gun in Mark’s left pocket. The incriminating emails found on his account. His lawyer had tried in vain to convince the jury that Alvarez had planted the gun there when he hugged him goodbye, or that Mark and Dylan had roomed together in college and Mark had never changed any of his passwords. It was too far-fetched. Mark supposed even he wouldn’t have believed it, had he been a juror."
