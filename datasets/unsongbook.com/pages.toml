["http://unsongbook.com/chapter-48-bring-me-my-chariot-of-fire"]
title = "Unsong"
description = "Rage in favor of the proposition that the machine is somehow important in a way that could be uncovered through dispassionate analysis. — Steven Kaas Morning, May 14, 2017 Caribbean Sea I. Unfurling four of its seven sails , the … Continue reading →"
full_description = "Rage in favor of the proposition that the machine is somehow important in a way that could be uncovered through dispassionate analysis. — Steven Kaas Unfurling four of its seven sails , the world’s fastest ship shot out of the Panama Canal. It rocketed through the Caribbean and wove in and out of the Cayman Islands. It somehow skipped Cuba – the space that Not A Metaphor sailed through with its many-colored sails open wasn’t quite the same as the normal ocean – and nearly crashed into the Bahamas before executing a sudden turn that knocked everyone against the port railing. Four hours after the ship left the Gatun Locks, Amoxiel spotted the Florida coast. The launch was at noon. There would be no more launches for weeks – longer than John would hang on. They would make it to Cape Canaveral by noon, or their friend’s soul was toast. James paced back and forth on the deck, his responsibilities lightened by the rediscovery of the ship’s autopilot – if that was what you wanted to call the intelligence that animated the entire vessel like a golem. He was on the foredeck, tan in the Caribbean sun, letting the ship itself handle the steering. It was a vicious cycle. Simeon was old, he’d been hurt in the scuffle with the Drug Lord, and he’d been seizing pretty bad during the worst parts of the the Panama crossing. For a while they hadn’t been sure he would make it. Ana, wracked with guilt about verbally abusing him, had been by his side all through the Gulf Coast, bringing him food from the galley and keeping him company. But being Ana, it was impossible for her not to start talking politics, and soon she was abusing him more than ever – a situation that seemed to keep the old man relatively entertained. “It’s the final insult,” Ana said, “in which divine justice is perverted the same way the human justice of the state already has been. Poor person steals some bread? Eternity in Hell. Rich person steals the wealth of an entire state? Not only do the courts do nothing, but he can buy a ticket on Celestial Virgin and his soul ends up squeaky clean in the World To Come.”"
