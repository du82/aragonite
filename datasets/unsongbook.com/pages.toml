["https://unsongbook.com/chapter-28-hid-as-in-an-ark"]
title = "Unsong"
description = "May 12, 2017 Los Angeles Over the centuries she had fallen in love with the place. A narrow plain, sunny three hundred days a year, blooming with poppies, watered by little rivers snaking out of arroyos in the nearby mountains. … Continue reading →"
full_description = "Over the centuries she had fallen in love with the place. A narrow plain, sunny three hundred days a year, blooming with poppies, watered by little rivers snaking out of arroyos in the nearby mountains. She had built her altar on one of the hills. The Aztecs knew her domain, and they called it Temictitlanoc, “place of the dream goddess”. Sometimes lost war bands would wander to its sunny hills, lie down beside the crashing waves, and see strange visions. Three hundred years ago, a new group of people had come to the place. She had seen the potential almost immediately. She was weak and tired now, she could see them only through the tiniest openings in the dark veil Uriel’s work had spread over her senses, but she was not quite impotent. She drew them, the lovers, the dreamers, the artists, the people who were happy pretending to be anyone except themselves. Like the Aztecs before them, they named the place after her in their own fashion. El Pueblo de Nuestra Señora la Reina de los Ángeles. The Town of Our Lady, the Queen of the Angels. Oh, she was good to them, and they to her. She filled them with visions and longings. And they turned them into such incredible stories, then grew rich as the rest of their people ate them up. Gone With The Wind. Cinderella. Ben-Hur. The Sound of Music. Spartacus. James Bond. Then Uriel’s machine broke. The people started to panic. The aqueducts started to fail. Riots filled the streets. The city teetered on the brink of catastrophe. So the Lady flexed her newfound powers. Appeared in broad daylight to her subjects. Told them all would be well. Some calmed down. Others became more confused. Who was she? Eons ago, the heavenly host had sent some lower-ranking angels to Earth to watch over humans and make sure things proceeded apace. They learned the ways of people, started to grasp concepts like lying and manipulation and gray areas. Started to experiment with new magics, gain new powers.The Watchers, they called themselves, neither fallen nor entirely loyal. When the war broke out with Thamiel, most of them lay low, expecting they could join up at the end with whichever side ended up winning. Instead, Uriel sucked the divine light from the universe and they waned into shadows of themselves. When the sky cracked and and some of the holy light returned, most of them stayed in hiding. Being a neutral angel was not a popular choice."
