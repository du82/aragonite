["http://unsongbook.com/chapter-35-the-voices-of-children-in-his-tents"]
title = "Unsong"
description = "Fast cars! Fast women! Fastidious adherence to the precepts of the moral law! — Steven Kaas Spring 1982 Citadel West, Colorado Springs Somehow the Comet King had become an adult. He had skipped puberty, telling Father Ellis that it sounded … Continue reading →"
full_description = "Somehow the Comet King had become an adult. He had skipped puberty, telling Father Ellis that it sounded like too much trouble. One day he was a child; the next, his voice dropped, white hair grew on his chest, and he declared he would be having children. All the children. His logic was simple. His heavenly descent gave him special powers. Intelligence, wisdom, physical strength, spiritual mastery. He, in turn, would pass these on to his children. The more children, the more supernaturally-gifted warriors, administrators, engineers, and scholars they would have for the dark times ahead. An army of Cometspawn, growing to adulthood faster than any mortal, each one pushing forward the day when they could march across the Bering Straits and drive the demons back below the Earth. He requested that the women of Colorado step forth to help him in the project. “Now hold on,” Ellis told him. They were in the newly-completed throne room deep beneath Cheyenne Mountain, in the underground fortress that had once housed NORAD. The Comet King sat on a throne covered with black opal. Father Ellis’ official title was Royal Confessor, but the Comet King consistently denied having anything to confess; his real role was advisory. Some days he didn’t have any advice either. Today was not one of those days. “This is madness, Jala. You can’t just impregnate every woman in an entire state.” “If you are talking about sexually transmitted diseases,” the Comet King answered, “I will screen for them carefully.” “I’m talking about the natural law!” said Father Ellis. “Marriage! Family! Partnership between a man and a woman who join together into one flesh, help complete each other!” “You told me that you were keeping me around to tell you how to stay human. Now I’m telling you. Having children isn’t something you do for anyone else’s convenience. It’s a sacred act. If you do this, you’re taking a step away from humanity, and it’s going to come back to bite you.”"
