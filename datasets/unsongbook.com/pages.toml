["http://unsongbook.com/chapter-19-the-form-of-the-angelic-land"]
title = "Unsong"
description = "Morning, May 12, 2017 ???? I. For a moment I was totally disoriented by the scene before me. Then vast, dark shapes began to take form. Shelves. Shelves full of books, all the way up, from the immacuately polished marble … Continue reading →"
full_description = "For a moment I was totally disoriented by the scene before me. Then vast, dark shapes began to take form. Shelves. Shelves full of books, all the way up, from the immacuately polished marble floor to a ceiling that was too high to see clearly. So many shelves that they blocked my view, made it impossible to see how big the room was or get any other sense of where I was. It was dark, but not absolutely so. The whole room was filled with a rosy light, and I wondered if somewhere there were colossal windows to match the colossal shelves, letting in the first glow of dawn. I passed beyond the shelves only to find more shelves. I passed beyond those only to find more shelves still. No chairs, no tables, and no sign of a card catalog. I tried to make out the title of one of the books. It was too dark to read. “Don’t use the Vanishing Name,” I had told the other Singers, “unless you are in a situation where it is absolutely vital to your well-being and continued survival that you be accosted by a different band of hooligans than the ones who are currently accosting you.” There I had been, in UNSONG, the Director-General breathing down my neck. Through what I can only assume will be forever remembered as a stroke of dazzling genius, I’d used the Vanishing Name and escaped to what my contact in San Antonio had suggested would be a “complementary situation”. Presumably that should be pretty bad. And here I was. A library the size of a cathedral. I looked around for demons or monsters or something and didn’t see any. I considered going to sleep, but I’d actually slept pretty well in my jail cell just a few hours ago. Also, I was really, really wired. Judging by my heartbeat, my body still hadn’t accepted that I was safe, and wouldn’t for some time. Too many questions beat at my mind to start thinking about any particular one. Where was Ana? I had felt a moment of telepathic contact with her, but she hadn’t sounded like a prisoner. She had sounded like she was coming to rescue me, which was absurd, how would she even find an UNSONG base let alone infiltrate one? For that matter, where were Erica and my other housemates? What the hell was wrong with Malia Ngo? Did she have Sarah? What would happen to the world if she did?"
