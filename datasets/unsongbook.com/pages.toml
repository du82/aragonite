description = "Interlude ח is now up. Relevant Wikipedia articles for the past few chapters: Comet West, the Kaifeng Jews, Had Gadya, the Gale-Shapley algorithm, John Dee, Enochian language, location arithmetic, Metatron, Raziel, Samyazaz, the Watcher Angels, the Golden Gate in Jerusalem, … Continue reading →"
full_description = "Relevant Wikipedia articles for the past few chapters: Comet West, the Kaifeng Jews, Had Gadya, the Gale-Shapley algorithm, John Dee, Enochian language, location arithmetic, Metatron, Raziel, Samyazaz, the Watcher Angels, the Golden Gate in Jerusalem, Coit Tower (and the eye mural within), non-overlapping magisteria, Isaac Bashevis Singer, the Avgad cipher, the Terracotta Army, “only Nixon can go to China”, Whinfield’s Rubaiyat. Gadit (@thetransintransgenic) is “microficcing the Omer”, ie writing a new Unsong micro-fanfic for each of the forty-nine days between Passover and Shavuot. She hasn’t quite kept to the schedule, but you can read what she’s got here. I’ve helped with this one and this one, which you can consider canon if you want (the others probably don’t fit). The sudden inclusion of transfemale angel Gadiriel is not a deliberate Gadit homage, but you’re welcome to think of it as a sort of unintentional kabbalistic cameo if you want. 75thTrombone is working on a sort of index of relevant facts which might get transferred to a wiki at some point. My girlfriend Eloise has made some really amazing Sohu fan art. And here’s a sketch of Uriel by @responsible-reanimation. Astro Teller, grandson of Edward Teller, who was mentioned in the last Author’s Note, has gone on the record to state that fear of intelligent computers is overblown. Note also the name of the reporter conducting the interview. This is not a coincidence because nothing is ever a coincidence. Alternative link to the interview with Astro Teller, on archive.is (I seem to be unable to view the page even when I disable my adblock.) For anyone who knows a bit about IBS, while he’s an incredible author, his older brother (IMO) was the far better story teller – who I highly recommend to this community. I think we’re IJS hipsters. What do you recommend from either Singer? I loved The Karnovski Family but was disappointed when I tried to read more. I’m hiking up Mount Baldy next week. If I run into Astro Teller up there I’m giving up and joining a yeshiva."
