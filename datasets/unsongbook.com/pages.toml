["https://unsongbook.com/chapter-72-and-builds-a-heaven-in-hells-despair"]
title = "Unsong"
description = "If we are worthy, our Master will redeem us by justice, and if not, He will redeem us with mercy. — Rabbinic saying Evening, May 14, 2017 Citadel West I. Sohu pushed the heavy steel door open and entered the … Continue reading →"
full_description = "If we are worthy, our Master will redeem us by justice, and if not, He will redeem us with mercy. — Rabbinic saying The others ran towards her, hugged her, started firing questions at her. Even I ran towards her and hugged her, overcome with the spirit of the moment. Only Caelius stayed where he was, staring at his computer, occasionally reaching out a wavering finger to stab a key or flip a switch. “Thamiel…not gonna bother us…for a while,” she said. “Summoned Uriel. He helped take care of things. I’m…tired. Anything to eat?” It was hard to judge in the dim glow of the Luminous Name, but she looked drained. In the absence of the usual servants, I ran out to get her something. When I got back with a jar of cookies, there were a couple of soldiers talking to Nathanda. “The Other King’s broken through the passes,” she announced to us. “Everybody’s retreating. Total rout. He’s flying here. Alone. Less than an hour. A few minutes.” “While you were away, we’ve been reading up on this Acher,” Jinxiang told Sohu. “Elisha ben Abuyah. Strange guy. No obvious weaknesses. You know anything we don’t?” Caelius limped over, joined the circle, almost sunk into his chair. “She’s rebooting,” he said. “Don’t know how long it will take. Computer that size…” He trailed off. I couldn’t believe he was even still conscious. None of us dared suggest he leave. For a little while we all just sat there, quietly, in the dark. A few furtive glances at the entrance, as if the Other King was already through the big blast door and could walk in at any moment. Almost hopeful. Anything would have been better than waiting quietly in the dark room. Finally, Nathanda picked up her book. “I guess I should talk,” she said. “There’s nothing in here about secret weaknesses or magic spells. But there are a lot of stories. There’s a story about how each year, on the Day of Atonement, a great voice would ring forth from the holy places, saying ‘Repent, o children of Israel, for the Lord your God is merciful and shall forgive you. Except you, Elisha ben Abuyah.’"
