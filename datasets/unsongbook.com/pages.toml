["http://unsongbook.com/chapter-34-why-wilt-thou-rend-thyself-apart-jerusalem"]
title = "Unsong"
description = "He said, Go and utterly destroy them; namely, the Hittites, and the Girgashites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, which were not defiled with women; for they are not very good for implementing high-performance … Continue reading →"
full_description = "He said, Go and utterly destroy them; namely, the Hittites, and the Girgashites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, which were not defiled with women; for they are not very good for implementing high-performance floating-point calculations or calculations that intensively manipulate bit vectors. It was the second day of the Madrid Conference on the Israeli-Palestinian peace process. In the interests of fitting in the conference room, Uriel had shrunk to a mere ten feet tall. “AREN’T HUMANS USUALLY SHORTER THAN THAT?”, he had asked Sohu. “Yes,” she had told him, “but in order to succeed at diplomacy, you need to be intimidating.” She hadn’t mentioned how uncomfortable it was trying to sit in the chairs provided without his legs jutting out at an awkward angle. He had finally settled on leaning back in the chair, which kept his mind pleasantly occupied with the second-to-second task of maintaining his balance without breaking any physical laws. “The question of Jerusalem can be settled later,” Archbishop Tauran of the European Communion was saying. “For now, we need a bare-bones agreement on whether the Israelis can stop their settlements.” It had been going on like this for hours. The Israelis, led by a short old man with a mustache, kept insisting that the Palestinians were violent terrorists. The Palestinians, led by various people with no power who kept sneaking out to consult with unsavory figures whom the Israelis refused to confront directly, kept insisting the Israelis were greedy imperialists. Occasionally they would start shouting at each other, and then the Europeans and Americans would have to step in and calm everyone down. Protesters outside were shouting even louder, and twice they’d been forced to stop for security breaches, real or imagined. It didn’t seem like a very effective way to make peace. “With all due respect,” said the Prince of Hell, “there’s no reason to think that the issue of land can be separated from the issue of Jerusalem that easily. Israeli incursions into traditionally Muslim areas of Jerusalem are no different from those in any other part of the West Bank.”"
