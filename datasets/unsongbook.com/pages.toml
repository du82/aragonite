["http://unsongbook.com/chapter-25-lie-down-before-my-feet-o-dragon"]
title = "Unsong"
description = "Afternoon, May 12, 2017 Los Angeles I. Coming from the edge of my consciousness, a faint voice: [Thou shalt not krill] The organizing soul within me – the kabbalists would have called it the neshamah – awoke, even as my … Continue reading →"
full_description = "The organizing soul within me – the kabbalists would have called it the neshamah – awoke, even as my body dozed on the hotel bed. [I spent the morning kayaking with a pretty girl, and then she invited me back to her hotel room and handcuffed me to the bed.] I opened my eyes, taking care not to break the hypnopompic trance that smoothed the telepathic link between us. The clock told me it was early afternoon. Jane was nowhere to be found. I still had a gag in my mouth to prevent me from speaking any Names, and I still had my hands cuffed to the bedposts to prevent me from taking off the gag. I’d asked Jane why she carried a gag and handcuffs with her in her luggage, and she hadn’t answered. Too rushed to restrain me so that she could run out and search for her precious Beanie Baby. [Really,] I said, and sent Ana my memories of that morning. Speaking the Vanishing Name right under Malia Ngo’s watchful eyes. Escaping the Strategic Angel Reserve with Jane. The frantic search for her missing Beanie Baby, no amount of pleading inducing her to offer an explanation. Then her restraining me so she could expand the search to the rest of the city. [And you! What happened to you? You were with me in UNSONG! And then you learned a Name! Where are you? Are you safe? Where is Erica?] [I’m on a boat,] she said. [I haven’t seen Erica, but she’s not dead. The link from the partial marriage ceremony would have told me that, I think. I keep trying to telepathically ping her, but I’ve never been able to feel her as strong as you.] Then she sent me her own memories. Sarah appearing mysteriously in her hotel room. San Francisco. The Comet King’s ship. Everything I’d been doing up until now had been predicated on Ana having Sarah. If Ana had Sarah, the plan was still intact. She would become mighty. She would rescue me. We would be rich and important. If Ana didn’t have Sarah, then the error correction was our only hope. Otherwise, I’d be back to being nobody. The thought was somehow worse than being a fugitive, worse than being cuffed to a bed. I could take a lot if I was somebody. The thought of falling back into my cog-in-the-machine status filled me with dread."
