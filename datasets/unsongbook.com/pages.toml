title = "Unsong"
description = "Ring the bells that still can ring Forget your perfect offering There is a crack in everything That’s how the light gets in. — Leonard Cohen, “Anthem” “There’s A Hole In My Bucket”, by Aaron Smith-Teller Submitted for the June … Continue reading →"
full_description = "Ring the bells that still can ring Forget your perfect offering There is a crack in everything That’s how the light gets in. — Leonard Cohen, “Anthem” “There’s A Hole In My Bucket”, by Aaron Smith-Teller Submitted for the June 2017 issue of the Stevensite Standard You’ve probably heard the old children’s song. “There’s a hole in my bucket, dear Liza, dear Liza.” A child named Henry asks his friend Liza for help with a hole in his bucket. Liza tells him to mend it with straw, but Henry needs – successively – a knife to cut the straw, a stone to sharpen the knife, water to wet the stone, and a bucket to get the water. He ends up in the same place he started – there is a hole in his bucket and he doesn’t know what to do. All of this has obvious kabbalistic implications. Looking up “Liza” we find it derives from Hebrew Elisheba, a complicated name I have seen translated as “God is an oath”, “God is satisfaction”, “God is wrath” or – if you take it entirely literally – “God is seven”. Okay. Let’s put that one on hold for now. Looking up “Henry” we find that it is the written form of the name spoken as “Harry”. Why write a name differently than it’s spoken? In Hebrew there is a tradition of writing the Names one way and speaking them differently – thus A—-i becomes “HaShem”. A few months ago, I jokingly told a friend that the Explicit Name was “Harold”, based on the prayer “Our Father in Heaven, Harold be thy name”. If Harold is indeed a divine Name, it makes sense that it should be written differently than it is spoken. So the word in the nursery rhyme should be read as “Harry”, which is an unmistakable refence to the most famous kabbalist of all time: Rabbi Isaac Luria, better known by his Hebrew nickname Ha’Ari. Ha’Ari dedicated his life to the same question that consumes so many of us: why would a perfectly good God create a universe filled with so much that is evil? Malachi 3 describes God as “like a refiner’s fire”, but only because the ancient Hebrews didn’t know the word “H-bomb”. God is infinite energy, uncontrollable power, likely to scorch and burn anything He touches. If God even touched the Universe for a second with His little finger, it would shatter like a dropped egg. So how does God create the universe? How does He sustain it?"
