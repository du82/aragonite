["https://untested.sonnet.io/notes/heres-a-list-of-toys"]
title = "Here's a List of Toys · Untested"
description = "Projects, experiments and toys by Rafał Pastuszak"
full_description = '''I love making toys. I learn and rest through building seemingly useless things. Building "useless" projects for me is also a way to vent, explore, or just get out of my own head (Why make toys, why play?). Inspired by this post by nicole@web and my promise to write here instead of commenting on social media, I prepared a short list of useless toy projects I've built over the past few years. It's not complete, but this site is called untested for a reason. I love writing useless software! Here's some useless software I wrote this year: The Uncolouring Book Add strokes to colours to give them meanings. MeatGPT "Prime answers to rare questions." The success of the site was to a large part driven by terrible AI site catalogues, and their hallucinated ideas of what Meat-GPT is about. Irony deficency is not a joke. Remember to get tested regularly. The (Medieval) Times (a.k.a. Medieval Content Farm) Your biased and hallucinated news source curated by a team of talented writers. Every day they scour the internet for the most interesting and relevant events of the realm. They're so good, the thing just writes itself. Please read the Why section for more (serious) context. 🧈 Butter · an adblocker for humans, by humans! Mrr Are you ready to Mrrr? Mrrr (physically accurate) Are you ready to Mrrr, Newton? Sketch: Music for 18 Musicians Interactive Album cover for 18 Musicians by Steve Reich, performed by Eric Hall (check the site for credits). Reactive Hole A browser-based P2P file sharing app. 🎈 Happy times A balloon appears on the screen every time a new person is born. A mix between the Web Animations API and hand-drawn animations. Return to Castle KittenStein™ A purely browser-based augmented reality (dance!) game where you get a chance to fight an evil army of kittens with bananas, glowsticks and body paint. Rainbotron An art installation/impromptu photo studio made from old furniture salvaged in Brick Lane. WebSockets meets Spotify meets your grandma's wardrobe. My Bootleg T-shirts Sometimes I make hand-drawn bootleg band t-shirts for my friends. King Gizzard and the Gizzard Gizzard is one of our favourite bands. Bird-knife Note that some of the entries here, like MeatGPT or Medieval Content Farm, are just substitutes for blog posts or essays, over-engineered as I found it easier to express myself through playing with code, rather than cleaning up a 5000 word article. Btw, here's a longer list (including some accidentally useful stuff). Make more toys! References My Personal Projects on Sonnet.io Projects and apps I built for my own well-being#^35cfc4'''
