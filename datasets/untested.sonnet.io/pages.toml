["https://untested.sonnet.io/notes/celebrating-world-egg-day"]
title = "Celebrating World Egg Day · Untested"
description = "Projects, experiments and toys by Rafał Pastuszak"
full_description = "Original title: When you realise that you forgot the egg Hi there! I've been taking things slow this week (no writing, no coding besides client work, Mango's gotta eat). I'm happy I took a break instead escaping into the more comfortable nook of my brain... with one small slip. Then this masterful toot caught my attention: Fuck, it's Egg Day! Thank you for the nudge Matthias. Here are some of my egg-inspired works, chosen at random under 3 minutes: My first attempt at stop motion animation Source: Mmm... egg The interlude of my first attempt at a newsletter Source: Weekly Notes #6 Vaguely Lynchian Prima Aprilis My first attempt at teaching the egg how to walk This was a prototype of a Liero inspired multiplayer deathmatch game, finding the last egg rolling so to speak. It would be hard to achieve this level of realism without Inverse Kinematics and procedural animation. A longer description would deserve separate post. Suffice to say, things didn't go that smooth as the algorithm I applied was more suitable for arthropods rather than anything with human legs. (imagine a bipedal human sized spider, now compare it to a walking human). Also, some leggs (typo, but I'm keeping it) were so displeased with my rigging skills, they decided to fly away, just like my dad when he went to buy those cigarettes. Something I noticed while editing this: so many of these projects are my firsts: first newsletter, first stop motion animation, first IK experiment, first egg in drag for the first of April. Writing truly is thinking! This animated loop from an article on sonnet.io (HTML+CSS) Why I made it: I needed a looped video on my site and the easiest way to create it was to: animate it in CSS record via QuickTime (I miss Macromedia Flash) You can find the article and the video here. This drawing I share instead of saying it's a balancing act Source: Balancing Act Finally, Chomsky, geopolitics, egg massage An accidental find from the times of the Plague. I suspect it's the least entertaining or informative example here. Please, don't judge the egg, judge me. That's all for today. Anyway, what's your favourite egg? Let me know. P.S. Thanks for reaching so far, please take this NSFW True Detective inspired Egg Erotica as a token of my gratitude. And remember, to quote Obvious Plant: this isn't real, nothing is real."
