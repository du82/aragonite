["https://untested.sonnet.io/notes/chthonic-companion"]
title = "Chthonic Companion · Untested"
description = "Projects, experiments and toys by Rafał Pastuszak"
full_description = "At the time of writing this I've had about 300 Say Hi calls! Many of the people I meet share their art with me (digitally or analog via mail, if I'm lucky). A recent caller made made a graffiti with an anglerfish. I have a few anglerfishes in my notebook too, so I thought I'd share mine. There are three four things I liked about this drawing. One, it looks like it was made by a kid. It tickles my sense of perfectionism in a way that's a little bit uncomfortable. It also forces me to let things go: I can't fix or unmake it, you can't unsee it. My heart is lighter. Thinking/writing about this observation prompted me to write Insomnia, Control. Two, the light from the lantern does not reveal anything and it doesn't cast any shadows. It just removes the canvas, cue Wittgenstein, Parmenides, or Parmesan talking about death. (This post is titled Chthonic Companion, what did you expect?) Three, the passengers are not travelling alone. Four, they're looking through the window and just admiring the reef (through the window, so neither back, nor forward). The reef is only as permanent as their blinks and saccadic intrusions. This drawing is somewhat silly (but cheesy as it may sound) it left me a wiser person. How it was made Sticking to the spirit of this site, let's see how a half-awake, half-baked person without any formal training draws something like this in the middle of the night: Working title: A Fish Walks Home Alone At Night (content warning: 9/10 of my drawings start as flying dicks sophisticated Roman art will briefly flash at the beginning) That's all, thanks for watching! P.S. Regular, technical content will follow soon. P.P.S. For more fish related content visit potato.horse"
