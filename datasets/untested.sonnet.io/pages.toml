title = "Kind software · Untested"
description = "Projects, experiments and toys by Rafał Pastuszak"
full_description = "Working Definition: Kind software supports my own well-being (mine as that of the user or author). It doesn't get in my way, it doesn't try to extract value from me. It doesn't actively make the world a worse place. It is sustainable, not greedy. as the author, I charge as much as I need to make it work, within the framework of my own life. If it's not sustainable, we scale it down enough to make it such and give the smallest possible thing. If the smallest possible (sustainable) thing doesn't exist, move on. Kind software is good enough, it doesn't change for the sake of change, or greed. A VC-backed soon-to-be-unicorn vs. a lifestyle business is a false dichotomy. People who say that tend to forget that carpenters, cleaners or people operating funeral houses exist. References Projects and apps I built for my own well-being Things to support my own well-being – a wishlist Be kind, be curious"
