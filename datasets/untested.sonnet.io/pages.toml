["https://untested.sonnet.io/notes/2-2-2-project-scoping-technique"]
title = "2-2-2 Project Scoping Technique · Untested"
description = "Projects, experiments and toys by Rafał Pastuszak"
full_description = '''My earlier work titled: "A Quick Study of the Canine Form" 2-2-2 stands for 2 hours, 2 days and 2 weeks. It's a technique of scoping experiment work I learned from Jordi Bruin and I've applied it to a bunch of projects including Sit. . It reminds me of the 3-3-3 Rule for Rescue Dogs, but imagine that you're replacing dogs with... idea puppies! Edit: Jordi!!! published a talk about his approach on Vimeo. I haven't watched it yet, so please consider the note below a weird cousin of his idea (probably very similar). 2-2-2 101 So, you have an idea. Here's how to test it: You have 2 hours to build a proof of concept. Answer the question: is it possible? does it even make sense? if not: bin it, start again! You have 2 days to build a prototype to share with friends. Is it solving their problem? Is it entertaining? Does it have the effect you want it to have? if not bin it, start again! You have 2 weeks to build an MVP. Make it useful. Make it a paid product if your goal is to charge for it. None of this is really new. Perhaps you've built your own products or worked for an XP shop, a HCD shop, or any design-driven organisation that that does more than Agile Pantomime — this split of work should sound familiar. And that's what I like about this approach: it's so concise. It communicates so well the value of: sharing your work often (Share your unfinished, scrappy work) testing your work with real users and learning from them being strategic about your time and resources: bailing if things don't work scaling up your effort (e.g. time) and testing scope (e.g. audience) Plus, it's an excuse to give yourself some structure by separating focussed time from play. 2 hours just doesn't seem like a huge time commitment to start with. But what if 2 hours is not enough? Related: Code Spikes. Reduce scope: Rick a subproblem. Redefine the problem (turn it into n problems). Allocate more than 2 hours. This is not a cult, you're allowed to make changes. No one will spank you if you do (I think.) Don't do it. Pick a different idea to work on. Related: Instead or writing a comment, write a post and link it'''
