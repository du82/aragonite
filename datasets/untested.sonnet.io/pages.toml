full_description = "I've gathered sooo much direct feedback for Ensō over the past few years! The nice thing about relying on people messaging me directly (via email or Say Hi calls, instead of analytics) is the quality of that feedback. I can actually engage with people using the product, bounce off ideas in an email thread or a call. Besides being a good motivator, this lets me feel like I have something concrete, something actionable to work with. Analytics just feel like a bunch of unnecessary steps between me and the problem at hand. The list below is based on that user feedback plus my own experience having written + 1,000,000 2,000,000 words in it in the past half a decade. Snippet - How to count words in a folder. If you see anything missing, hit me up! Changes: First, keep the website running and the web version private and free (Ensō Design Constraints, Kind software). Coffeeshop mode (Sketch - Ensō Coffeeshop Mode) add a writing timer toggle autocorrect toggle word count customise the number of visible lines Theme: OLED theme (a.k.a. night mode Heart of Dorkness, Obsidian for Vampires) dark light Sync theme with OS appearance (a.k.a. dark/light mode) Personalise font colour cursor Backups (store the past three notes in memory) Windows support (still not sure about that one, given the cost vs. time and effort) Related: Enso Technical Roadmap, Enso product feedback"
