full_description = "Sometimes I make hand-drawn bootleg band t-shirts for my friends. This is a draft and an evergreen note, so I'll start with just a few pictures, plus some short descriptions. Stay tuned for a full post and a tutorial! (How I Make My Bootleg T-shirts) Setup: acrylic markers, foil and iPad in guided access mode. Note that the shirt says King Gizzard and the Gizzard Gizzard. Checkmate copyright lawyers. The t-shirt was so good, my dog woke up. and Two older designs, based on a drawing from potato.horse King Gizzard and the Lizard Wizard × Achewood mashup SourceUpdateI based them on some of my older drawings from potato.horse: Three-pointer Good Cat Perfect Cat My Deer TIL: White acrylic paint on black fabric seems to handle washing much worse than dark/colour on white.Perfect Cat Perfect cat (front) Perfect cat (back)Details TIL: The child-like / the Cure album wannabe cover style was quite hard to transfer from my iPad to fabric. It looks much better after the first wash."
