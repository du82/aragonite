full_description = '''Privacy Policy for UntoolsAt Untools, accessible from untools.co, one of our main priorities is the privacy of our visitors. This Privacy Policy document contains types of information that is collected and recorded by Untools and how we use it.If you have additional questions or require more information about our Privacy Policy, do not hesitate to contact us.This Privacy Policy applies only to our online activities and is valid for visitors to our website with regards to the information that they shared and/or collect in Untools. This policy is not applicable to any information collected offline or via channels other than this website.ConsentBy using our website, you hereby consent to our Privacy Policy and agree to its terms.Information we collectThe personal information that you are asked to provide, and the reasons why you are asked to provide it, will be made clear to you at the point we ask you to provide your personal information.If you contact us directly, we may receive additional information about you such as your name, email address, phone number, the contents of the message and/or attachments you may send us, and any other information you may choose to provide.When you register for an Account, we may ask for your contact information, including items such as name, company name, address, email address, and telephone number.How we use your informationWe use the information we collect in various ways, including to:Provide, operate, and maintain our websteImprove, personalize, and expand our websteUnderstand and analyze how you use our websteDevelop new products, services, features, and functionalityCommunicate with you, either directly or through one of our partners, including for customer service, to provide you with updates and other information relating to the webste, and for marketing and promotional purposesSend you emailsFind and prevent fraudLog FilesUntools follows a standard procedure of using log files. These files log visitors