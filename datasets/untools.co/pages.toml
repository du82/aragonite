["https://untools.co/confidence-determines-speed-vs-quality"]
title = "Confidence determines speed vs. quality | Untools"
description = "Determine a trade-off between speed and quality when building products."
full_description = '''Confidence determines speed vs. qualityDECISION MAKINGDetermine a trade-off between speed and quality when building products.In product development, speed and quality are two important variables. Prioritizing one is typically at the expense of the other. This tool will help you make that trade-off. How to use it? Your decision to prioritize speed or quality should be based on your confidence in: importance of the problem you're solving correctness of the solution to said problem Before you start, make sure that your confidence is based on data instead of subjective views. There are three basic outcomes: Is your confidence in the problem importance low? Focus on speed. Is your confidence in the problem and the solution high? Focus on quality. Is your confidence in the problem importance high, but low in the solution? Balance both speed and quality. Of course, confidence isn't a switch but rather a scale. Therefore your outcome will be also more nuanced.Sources"Product management mental models for everyone" by Brandon ChuShare this toolCopy linkShare on TwitterMore decision making toolsSecond-order thinkingDECISION MAKINGConsider the long-term consequences of your decisions.Hard choice modelDECISION MAKINGFigure out what kind of a decision you're making.'''
