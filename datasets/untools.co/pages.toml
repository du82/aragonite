full_description = "About UntoolsUntools is a collection of thinking tools and frameworks to help you solve problems, make decisions and understand systems.Hi, I'm Adam Amran 👋I'm a product designer from Brno 🇨🇿, and a maker of Untools.Let me tell you why I created this little site.As a designer, I'm paid for good thinking. I solve problems and make decisions on day-to-day basis. A while ago, I began to look into purposefully improving my thinking. There are plenty of digital design tools, but they are not enough. I couldn't find one place that would offer a good overview of thinking tools.Eventually, I found plenty of these tools, but scattered around the web. My goal is to build a collection of tools and frameworks, covering areas like problem solving, systems thinking or decision making. I started building it for myself, but I hope it will be useful to many of you.I'm happy to hear your feedback and any suggestions you might have. I'm always looking to add new tools and improve this resource.Connect with me on Twitter if you have any feedback or a suggestion."
