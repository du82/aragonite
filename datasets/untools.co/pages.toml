["https://untools.co/connection-circles"]
title = "Connection circles | Untools"
description = "Understand relationships and identify feedback loops within systems."
full_description = '''Connection circlesSYSTEMS THINKINGUnderstand relationships and identify feedback loops within systems.Connection circles are a tool for visualising relationships in a story or a system. They help you understand complexity by seeing causes and effects in the system. Connection circles can also help you identify feedback loops – whether reinforcing or balancing. This is what a connection circle can look like. But how do you create one? How to create a connection circle Start with a circle on a piece of paper. Next, identify the key elements of the system you're examining. How do you know what's a key element? It meets these criteria: It's important to changes in the system Increases or decreases in the system Can be described by a noun Write these elements around the circle (don't include more than 10). Look for cause and effect. Which elements are directly causing other elements to increase or decrease? Draw an arrow between these elements. Indicate an increase (draw a "+") or a decrease (draw a "–") for the second element in each relationship. Find all of the cause-and-effect relationships. These can be based on data or they can be a hypothesis. Look for elements whose relationships form closed loops. These are feedback loops. Example It's best to illustrate with an example. Let's say our product has been dealing with unhappy customers. We know they've been complaining about too many bugs in the product and slow response times from our support (as customers create more support tickets). At the same time, we've been shipping more features to make them happier. Let's use make a connection circle so that we can make sense of this. From this story, we can identify the key elements: unhappy customers, bugs in the product, response times, support tickets and new features. We'll document them around our connection circle: Now we need to document the relationships between them. For example, we know that unhappy customers create more support tickets. More tickets means longer response time which in turn produces even more unhappy customers. We try to ship new features which lower the number of unhappy customers. But they also produce more bugs and those lead to more unhappy customers again. Let's map these relationships to the connection circle: The connection circle is now nicely showing the key elements of the system and the relationships between them. There's even one feedback loop that we can see here: The completed connection circle and an identified feedback loop make you better understand the system. This understanding will greatly help you make changes that you need. Takeaway Connection circles is a great tool for understanding systems. It's about identifying key elements and mapping the relationships between them. This tool can help you identify feedback loops as well. Template for Connection Circles I created a handy worksheet to help you put this tool into practice. It comes with a simple how-to guide including an example. Get it in a bundle with 9 other useful tools: Get the worksheet Preview of the worksheet and guide: Sources"Learning about Connection circles" on Systems ThinkerShare this toolCopy linkShare on TwitterMore systems thinking toolsReinforcing feedback loopSYSTEMS THINKINGUnderstand the force behind exponential changes.Balancing feedback loopSYSTEMS THINKINGMechanism that pushes back against a change to create stability.'''
