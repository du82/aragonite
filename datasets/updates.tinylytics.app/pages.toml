full_description = "March 1st, 2025 changelog 👾🚀 Today I improved the way hits are processed to allow much greater flow through the system. The old flow worked fine but it’s now super charged. Saying that, lifetime hits might be calculated slightly after we’ve processed a hit. This is by design. I’m monitoring this and will add an extra lifetime weekly update to make sure it’s always correct and up to date (due to the old hit collector sometimes failing to update the lifetime count). Anyway, all is looking great!"
