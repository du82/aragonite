["https://updates.tinylytics.app/post/2024-12-16"]
title = "• 🚀🔥 Speed improvements all... | Tinylytics Updates"
description = "• 🚀🔥 Speed improvements all around! Yes, that's right. No more waiting 10 years (not actual 10 years) to get your current data back when you just want to see your 30 day snapshot. For..."
full_description = "December 16th, 2024 changelog 🚀🔥 Speed improvements all around! Yes, that's right. No more waiting 10 years (not actual 10 years) to get your current data back when you just want to see your 30 day snapshot. For sites that have a lot of lifetime hits, or just a lot of data in general, there is a non-scientific, nor tested, 10x improvement when loading your normal dashboard. Filtering is also super quick for any pre-defined range. If you have a custom range from the beginning of time... well, that might just be a little slower — although quicker than what it was. 🚀👾 Path, country and referrer data is now paged on the site dashboard, showing up to 10 entries. If you have more, there will now be a little pager. Great to show you just the top 10... and everything else on another page. I might make that a setting to allow different amount of items. 🧹 In addition to the above, when you're on a smaller screen, the data in the tables now scroll nicely, always showing you the hits on the right side. 🐛😭⏰ Timezones... yes, those. The data for your actual timezone should now always be correct! There were a few issues where timezone calculation was incorrectly applied especially when filtering. So when you select a date, it'll now show the actual data on that day for your set timezone. This has been a long standing issue which required some 4AM work 😵‍💫 This also correctly applies to your email reports. 🧹 General tweaks to the layout, for example slightly larger maximum width for wider screens, and a quicknav on your site dashboard that actually highlights the section you're on (for paid accounts). 😵‍💫 Probably something else, but going to leave it there ✌️❤️"
year_published = 2025
clearnet = "https://updates.tinylytics.app/post/2024-12-16"
tags = ["changelog", "data"]
language = "en"
