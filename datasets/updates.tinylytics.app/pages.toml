full_description = "February 27th, 2025 status Thank you all for your patience over the past few days. Server config changes have now been made to address slow processing of hits, which had caused other issues like slow running background processes that were backed up, like email report sending, that in turn re-ran other jobs responsible for looking for sites that required a stats report — meaning it could have had 15 of the same checks before the actual email was sent causing more than duplicate emails at the same time."
