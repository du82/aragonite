full_description = '''December 31st, 2024 changelog 🐛😅 FINALLY I worked on fixing that "where is my stat report" email bug that has been on and off the past few months. I'm hoping that today everyone got their email reports without issue as the system was in place for the last 24 hours now. In the past it would send emails in one massive batch using one background process. That may have accidentally just "lost" an outgoing email randomly (with no errors). Now it'll do the same background job, but will create new jobs for each site that is ready to send. I could get technical, but let's move on. That's it for this year 😂'''
