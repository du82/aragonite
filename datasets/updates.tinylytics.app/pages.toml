full_description = "• 👾🚀 Today I improved the way hits are processed to allow much greater flow through the system. The old flow worked fine but it’s now super charged. Saying that, lifetime hits might be calculated... March 1st, 2025 changelog • 🐛👾 Fixed an issue with consistently calculating average usage data for your account. This now also happens in the background once a day. February 27th, 2025 changelog • 🛠️ Made underlying config changes to allow for greater throughput of background jobs and other server side tweaks. • 💌😅 Added extra checks for email reports that marks if an email is processing before... February 27th, 2025 changelog Thank you all for your patience over the past few days. Server config changes have now been made to address slow processing of hits, which had caused other issues like slow running background processes that... February 27th, 2025 status 😵😕 Looks like we’re running a little slow in processing hit data. I’m monitoring and there is only so much I can do whilst on holiday. I’m aware of the issue and I’ll do my... February 24th, 2025 status 😵‍💫😵 So sorry for the multiple email reports today. I’ve turned off delivery of reports and will look into what’s causing this when I’m back from holiday on Wednesday. Sorry if you haven’t received any... February 24th, 2025 status Mid February 2025 Updates This is a more unusual change log entry because there have been a lot of changes, and not enough blogging about it, so I thought I'll do a longer form update like this. • ✨... February 17th, 2025 changelog • 🐛 Fixed a bug where setting up an uptime monitor would throw a page error straight after creation. February 17th, 2025 changelog Accent colours, default filter and new email report layout Yikes, so much to show you in this release. I'm incredibly happy that I could get this all out for you, so let's dive straight in. This is just the beginning of a long year... February 10th, 2025 features"
year_published = 2025
