["https://updates.tinylytics.app/post/accent-colours-default-filter-and-new-email-report-layout"]
title = "Accent colours, default filter and new email report layout | Tinylytics Updates"
description = "Yikes, so much to show you in this release. I'm incredibly happy that I could get this all out for you, so let's dive straight in. This is just the beginning of a long year..."
full_description = '''February 10th, 2025 Accent colours, default filter and new email report layout features Yikes, so much to show you in this release. I'm incredibly happy that I could get this all out for you, so let's dive straight in. This is just the beginning of a long year ahead as I smooth out existing features that haven't gotten much love to just simple improvements. Accent colours for your sites That's right, you can now choose an accent colour for you blog in your settings (for the site). It's for the paid plan only (gotta entice you somehow 😅). This was a "I want to scratch that itch" kinda a feature that had me going for a while and I hope you like it. Find the new setting in UI Settings for your site and choose any colour you would like using the browsers built in colour picker (if you have problems choosing, or your browser does not support this feature, please let me know). When enabled, you turn your little site accent to something like this: Pink site stats in dark mode. And something like this on light mode: Pink site stats on light mode. It will try and pick colours that look good on both light and dark depending on the hue you've chosen — it might be a little off so I am happy to look at it if you find anything hard to read. You can do this for any site and the stats on the overview page will always reflect this: Site overview with different accent colours for each site. Pretty happy with the way this turned out. It's still in infancy so I might bring across the accent to other parts of the UI as time goes. Default stats filter range This one has been on my mind for some time, and now you can select the preferred date range you want to see when you first navigate to your site settings, or in the site overview. And yes, another paid feature. Default filter dropdown in site settings. The default is always 30 days, but you now can tweak it to suit your needs — similar to the quick link filter buttons you have. 14 days is great! Additionally this filtered range is also reflected when viewing your site on the sites overview screen, so each site can have different metrics to suit your needs. Email stats tweaks In another "finally", I reworked the theme for the stats emails that get sent to you every Monday. It's cleaner and easier to read — in addition of surfacing the top 20 paths without breaking your scroll range. I hope you like it. I might do some further tweaks as I go of course. For paid accounts you'll also see a breakdown of the unique hits if you have it enabled. Anyway, way better than before. Email report template. In addition to that, I wanted the ability to manually send the latest report — so now you can. Just go to your site settings and you'll see a new button. Just click and it'll come your way. Send another report email button and confirmation. And that's it. Hope you enjoy these and hopefully it allows you to personalise everything a little. Looking forward of making Tinylytics better this year and really polish it as time goes. "Keep moving forward" — Walt Disney'''
year_published = 2025
