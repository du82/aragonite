["https://updates.tinylytics.app/post/mid-february-2025-updates"]
title = "Mid February 2025 Updates | Tinylytics Updates"
description = """
This is a more unusual change log entry because there have been a lot of changes, and not enough blogging about it, so I thought I'll do a longer form update like this.
• ✨..."""
full_description = '''February 17th, 2025 Mid February 2025 Updates changelog This is a more unusual change log entry because there have been a lot of changes, and not enough blogging about it, so I thought I'll do a longer form update like this. ✨ I've been working on a UI refresh across Tinylytics, which includes a new homepage, new site list and also a tweaked header area for the site overview. This is an ongoing redesign to make things a little bit more modern, without loosing what Tinylytics is. Saying that, there will be more tweak here and if you ever notice anything that doesn't look right, just let me know. Here is a before and after of the site overview page (with the header changes): Old header in dashboard New dashboard header area ✨ In addition to the above screenshot, here is a new site list design also. ✨ Continuing on this you will find new dropdown designs, empty states that look nicer and better instructions for getting started. Anyway, there is a lot here and as I said, just getting warmed up here and loving the direction. Check out the homepage also and see what you think. ✨💌 OK, and as you guessed it, email reports now have a new design also. 🤷‍♂️ Let's move on... and make this more of a change log again... I'll keep it in order of when I shipped them. 🚀 Added the ability to send an email report manually from within site settings so you know what to expect — or if you wanted it again... or it went missing (which I hope it won't). 🐛 Fixed a bug where emails with large amounts of data would sometimes not send by improving the way the hits are gathered up without loading all hits of all time into memory (yikes). 👾 Improved the way your site URL is saved, which now allows paths to be set also, for example if you had a "Scribbles" site, like this: https://scribbles.page/updates — it will now save it like this. 👾 The embed script now automatically loads the script on a "www" subdomain if it wasn't set initially in the URL without having to tick the "allow on any domain" option. Also, there are general improvements to the way domains are validated in general. 🐛 Fixed filtering on archived sites where a date range would have had no effect. 🐛 Fixed various issues on the public stats page, especially around filtering and displaying paths and hits. 🧹 Tweaked wording across the site, especially in site settings. ✨ New documentation page and content, which I'll be expanding on. ✨ Also added an integrations page in documentation for third-party plugins and themes. More to expand here... and if you are working on something, let me know. ... did I mention the new design? Like a tweaked onboarding flow and better uptime view? No? 😋 OK, that's it for now'''
year_published = 2025
clearnet = "https://updates.tinylytics.app/post/mid-february-2025-updates"
tags = ["changelog", "february", "header", "updates"]
language = "en"
internal-references = ["none"]
external-references = ["tinylytics.app"]

