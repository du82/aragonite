full_description = "Linden Houses, Brooklyn. All photographs by Kris Graves Walkups and towers of public housing developments across New York City are receiving a new look: their familiar brown brick facades covered by insulated panels in shades of gray with colored accents. Recladding is a material solution to the leaks and loose bricks plaguing buildings where maintenance and repairs have long been deferred. It has also become a symbol of the larger policy changes that have brought the renovations underway. Under a program called PACT (Permanent Affordability Commitment Together), the New York City Housing Authority has leased 146 developments so far to private development and management teams who can access public funds the public housing authority cannot. To many observers, it’s the only way to address the monumental physical needs of New York’s working class city-within-a-city, population 361,000 plus. But some of the conversions’ long-term consequences are uncertain. While they represent long-sought improvements and repairs, for some residents, the facelifts are signs of ill portent. Does a new look erase the culture and memory of generations of residents who have made a home in public housing? After decades of disinvestment, will PACT bring the public promise of healthy and safe homes for people of modest means closer to its end? Lizzie MacWillie helps make sense of the transformation unfolding before our eyes. The Lower Manhattan skyline is an icon of glass and steel, global wealth and power. But just north of the Brooklyn Bridge, the profile turns to mountains of brick. The towers of the Smith, LaGuardia, and Vladeck Houses — home to a combined total of over 11,000 residents — follow the East River up to the Williamsburg Bridge. Similar brick-faced public housing complexes continue up the waterfront to 14th Street, then resume along the Harlem River uptown. Brick has been used to construct housing across the spectrums of time and wealth; it features on New York City’s modest working-class row houses and Beaux-Arts mansions alike. But brick has long been closely associated with public housing, constructed and funded by the US federal government to house residents of modest means. Most of the developments the New York City Housing Authority (NYCHA) built — from the aptly named First Houses, which opened in 1935, through the Morrisania Air Rights housing complex, completed in 1981 — are brick. But after almost 100 years, NYCHA buildings across the city are getting a new look with overcladding: a process that applies a continuous insulation and cladding system atop an existing facade, obscuring the familiar brown masonry. Edenwald Houses, Bronx The facelifts come with the rollout of a new program to address decades of funding shortages and overdue maintenance at NYCHA. While the overcladding process is one of esthetic and functional change, it’s also bound with a complex history of cultural identity, racialized stigmatization, and the failures of federal, state, and local housing policy to maintain a stock of public housing in good repair. The needs are monumental and growing: In 2023, NYCHA estimated a 20-year capital investment need of $78.3 billion, up from $45.2 billion in 2017. Residents frequently experience broken elevators, exposure to mold and lead paint, and other dangerous conditions. NYCHA’s Executive Vice President for Real Estate Development, Jonathan Gouveia, remarked in December 2024: “Given our building stock’s severe capital needs, it is likely that all of our developments will need investment in the building envelope to better insulate the building from moisture and for energy-efficiency requirements.” How much investment depends on the age of the building, its original materials and design, and the quality of construction. The cost to fix the aging brick facades, which pose dangers for residents and passersby, has been estimated to be over $3 billion. NYCHA and other public housing authorities (PHAs) across the country rely on congressional appropriations — along with state and local funds, and the rent tenants pay (which is capped at 30 percent of their income) — to operate and maintain their properties. Section 9 of the United States Housing Act of 1937 authorized the federal Public Housing Capital Fund to provide local public housing authorities with money for the repair and construction of public housing. But those funds have long been insufficient, while the need for repair grows. Edenwald Houses, Bronx In 2011, the US Department of Housing and Urban Development (HUD) calculated that public housing across the country required $26 billion in capital repairs. In the same report, it estimated that after that backlog was addressed, the annual need for new repairs would be $3.4 billion. That year, Congress appropriated $2.5 billion for the Public Housing Capital Fund. (In the last two decades appropriations have fluctuated unpredictably from $3 billion in 2001 to $3.4 billion in 2024, not adjusted for inflation.) To address the colossal need for repairs and an inability to plan for long-term upkeep, the Obama administration created a new program — Rental Assistance Demonstration, or RAD — to allow for new forms of investment in the existing stock of public housing. RAD allows the conversion of “traditional,” publicly owned and managed public housing to private management, making a development eligible for federal assistance in the form of Project-Based Vouchers or Project-Based Rental Assistance. Since 1974, federally funded Section 8 Tenant-Based Vouchers have assisted individual tenants in paying rent to private landlords. Under RAD, vouchers are attached to specific housing units, with the subsidies going directly to the landlords. (While the funding for voucher programs is also dependent on congressional appropriations, funding for Section 8 has increased in recent years: HUD’s proposed fiscal year 2025 budget saw an increase of $1.4 billion in discretionary spending for Section 8 programs from FY24.) Under RAD, a local PHA can enter into a partnership with a private entity, which takes responsibility for the development and financing of a housing project. That for-profit or nonprofit developer can access funding mechanisms that a PHA cannot, like low-income housing tax credits, state and local grants, and debt financing to fund rehabilitation and repairs. Penn-Wortman, Brooklyn Implemented as Permanent Affordability Commitment Together (PACT), RAD came to New York City in 2015. As of January 2025, 146 NYCHA developments are in pre-development, under construction, or have completed construction through the program. NYCHA prioritizes properties it deems most need of repair and most challenging in terms of operations for PACT conversion. Under the PACT program, NYCHA maintains ownership of a development’s land and buildings, but grants a 99-year lease to a team that takes over the repair, maintenance, and management of the campus. Members of the project team — which may include multiple developers, an architect, a landscape architect, and other consultants — are contracted for design, financing, and construction. A management partner (sometimes one of the development entities on the team) is contracted to manage the facilities and property after construction is finished. The project team works with NYCHA to select a social service partner to provide on-site career services, recreational activities, or educational programming. These changes have many implications for residents’ day-to-day lives and hazy consequences for the availability of public housing at low rents in the long term. But some of the most visible and immediate changes are the physical ones: the renovations that are required to take place once a development is converted to the PACT program. HUD’s requirements for PHAs participating in RAD do not cover design. According to a senior official at HUD, the agency is trying to encourage housing authorities to find the resources to upgrade their properties. But since HUD does not give them any money to do it, the agency is careful in what requirements it imposes. In New York City, the type and extent of PACT renovations are specific to each project and site, but “must, at minimum, address the 20-year capital needs of the properties,” as stipulated by NYCHA. “There are certain things that you have to do. NYCHA has made it a requirement that a lot of the hazardous materials that we find on site be completely abated. So lead, asbestos — these are must-dos and there’s no arguing about that,” said Karen Hu, Executive Vice President and Head of Development at Camber Development, which has led the redevelopment of several PACT projects. Outside of those “must-dos,” determining the scope of repairs for each site takes place through an iterative pre-design community engagement process that can take up to a year. Linden Houses, Brooklyn One step in that process is determining whether overcladding will be included in the project scope. In 2022, NYCHA established a set of design guidelines based on best practices for multifamily construction and lessons learned over the first six years of the PACT program. These guidelines assume that all building envelopes will receive repairs as needed. According to Ben Leer, a New York City-based building science consultant who specializes in passive house design, part of the reason that so many NYCHA buildings need brick facade repair is their detailing. “A lot of older buildings have these articulated facades where they’ve got a lot of decorative pieces that were all meant to kick water away from the facade. The big cornices, the decorative lintels on the windows, even any statues you’d see. Gargoyles used to do that for old churches. When we moved to a more modern esthetic, a lot of that ornamentation disappeared. It’s flat brick. The first problem with the buildings is that the design didn’t shed the water.” Water gets absorbed into the bricks and into the mortar, expanding and contracting with changes in temperature, causing the bricks to come apart. A lack of maintenance exacerbates this wear and tear. Necessary repairs include replacing failing or fallen bricks, tuck-pointing (repairing the mortar between bricks to help keep water out), and air-sealing facade penetrations (making the facade more air-tight for resident comfort and energy efficiency). The PACT design guidelines also encourage each development team to consider ways to increase the insulation on all exterior opaque walls to create a building envelope that more efficiently keeps heat in during the winter, and out during the summer. Elliott-Chelsea Houses, Manhattan There are two ways to add insulation to a brick building. You can add it to the interior: first removing the existing plaster or drywall, installing new insulation, and then reinstalling a base wall material. But many NYCHA apartments were built to the minimum room size allowed by law, so additional insulation would take away precious inches of living space. The other route is through overcladding: prefabricated panels — assemblies of an exterior finish, continuous insulation, and a drainage medium — are glued or fastened to the exterior of the existing wall. The design of the exterior, including the material selection, color palette, and the pattern in which the panels are applied, is part of the design process undertaken by the architect and consultants. Baychester Houses, Bronx The architecture firm Curtis + Ginsberg is currently working on its seventh PACT project. Its first, Baychester Houses in the Bronx, was completed in 2021 and praised by architecture critics for the spotless campus and dignified architecture. The designers covered the brick facades of eleven buildings with exterior insulation and finish systems (EIFS) panels in white, gray, and terracotta. For the development team, the benefits of overcladding are both functional and esthetic. “It changes the look and the feel. That has a very positive impact on the residents and the people who actually live in the buildings and their willingness to participate in the community, and desire to call it home. There’s a very strong community in all of the complexes that we have worked on already, which is great,” said Rick Gropper, a principal of Camber Development, one of the developers on the Baychester project team. “What we saw at Baychester was the residents were very receptive to a shift in the visual appeal of their home, and are really proud of the way that it looks. That has a positive effect on everybody who lives there, but also on the landlord because people, we found, tend to take better care of their home and of the property.” Linden Houses, Brooklyn Undoubtedly, after generations of neglect, an infusion of investment may change the way residents feel about a place. But residents have been asking for basic repairs for decades. Ramona Ferreyra is a resident of Mitchel Houses and a founder of Save Section 9, a tenant-led advocacy group dedicated to organizing and educating public housing residents. She argues that plenty of NYCHA residents already take great pride in their homes: “For 90 percent of the people in public housing, we love our homes. They are the center of our families’ history. Our apartments are passed down through generations and hold all these memories.” While the renovations may contribute to a sense of pride for some, they also put at risk other aspects of public housing in which people already find pride and meaning. Public housing in the US began with broad public support. But many early developments were segregated and designated as “whites only.” In the 1950s and ’60s, spurred by federal mortgage subsidies and investments in highways, white families left American cities for the suburbs, and public housing became increasingly Black and Latinx. James Rodriguez, who grew up in Rutgers Houses and is a professor of Urban Studies at CUNY, locates the negative associations people have with the appearance of public housing in this history. “In some circles, the inherent assumption that this design is bad comes from a longer, more stigmatized history that really started when public housing became primarily a home for Black and brown folks. And then we start to see this turn towards austerity, that brought not only repair and maintenance questions, but also issues of danger and dysfunction.” In the 1970s, the federal government began to steadily disinvest from public housing, which led to a decline in services, maintenance, and repairs. Ferreyra sees the physical changes happening now through PACT as part of this legacy of racism and stigmatization. “It’s racist because we know that public housing has been associated with primarily Black Americans. And when you make the architectural choice to change it, you’re basically sitting there and saying that the homes that have provided affordability and stability to now three generations of Black New Yorkers are visual"
