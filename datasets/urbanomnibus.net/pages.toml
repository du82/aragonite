title = "Who Plans? - Urban Omnibus"
description = "Over more than two decades, Hester Street expanded means and methods by which New Yorkers might shape their city. What does the nonprofit's demise mean for the practices of community planning and engagement in the future?"
full_description = "A brainstorm meeting at Hester Street Collaborative, 2017. Photo via Instagram Whose priorities are represented in urban plans and projects? Who has a say in the processes that shape the city? The last two decades saw an effervescence and evolution of practices of what we call community planning and engagement. Hester Street, a nonprofit organization that expanded from creative involvement in its Lower East Side neighborhood to providing planning and development assistance and fulfilling public engagement contracts citywide, was both sui generis and vanguard of a nebulous field that spans disciplines and organizations. To many, the announcement of its closure in summer 2024 spelled the end of an era. Hester Street, which had celebrated its twentieth birthday the year prior, had become a New York institution of sorts. But as it struggled with the costs of growth and the indirect impacts of the Covid pandemic, it was unable to establish a more permanent place in the planning landscape. Oscar Perry Abello surveys Hester Street’s unique approach to “people shaping their city,” asking what the city has lost, and what might fill the gap the organization leaves behind. This story was co-published with Next City, a nonprofit newsroom reporting on solutions for equitable and just cities. Get Next City’s stories in your inbox: nextcity.org/newsletter. Right where Manhattan’s Chinatown and Lower East Side start fading into each other, the below-grade garden-style storefront that Hester Street Collaborative called home for most of its existence was constantly awash in color. Post-its everywhere. Whiteboards, easel pad paper stuck up on walls, covered in handwritten notes. Giant print-outs summarizing community input for building redesigns or neighborhood rezonings. Artwork made onsite by students from the middle school across the street, who came for workshops or just to hang out. The people who worked at Hester Street were even more colorful than the space itself. Some were born-and-raised New Yorkers, others came from across the country and beyond. They looked and sounded as diverse as the neighborhoods around them. They were designers and architects, urban planners, data analysts, real estate and finance professionals. It was a group that the nonprofit’s leadership carefully curated over time. What brought them together was this idea that all of their disciplines — and by extension cities as a whole — suffered when they didn’t listen to and take seriously the ideas, input, and perspectives of historically disenfranchised and marginalized communities. “We arrived at this same destination through different pathways, but all committed to the vision of New Yorkers shaping their city,” said Cinthia De La Rosa, a former senior project manager at Hester Street. “That was our tagline. As an organization, it’s one of those things that tied the bow. Not once working on a project did I ever feel lost in that mission.” In some ways, that mission was vague. Hester Street didn’t specialize in any particular type of project or policy area with any specific impact in mind. It developed tools and methodologies to bring voices that were typically left out into a dizzying variety of projects and processes. Supporting students to create temporary or permanent art installations at Sara Roosevelt Park, or local artist installations at the Allen Street Malls and Pier 42 on the Lower East Side waterfront. Engaging communities in a citywide process to address long-standing disparities in cultural spending. Working with residents to shape city-led projects, like redesigning public libraries in Brooklyn or redeveloping the massive Kingsbridge Armory in the Bronx. Helping grassroots organizations acquire property to renovate or build permanent spaces for their work in Corona, Queens or Downtown Brooklyn. Inside the Hester Street Collaborative offices in 2009. Photo courtesy of Hester Street At the same time, Hester Street faced the same constraints and challenges as all nonprofits. Highly motivated by the mission of the organization, Hester Street’s workers often went far above and beyond what its funders were willing or able to pay. The burden of bringing in funding and projects fell largely on the shoulders of executive directors who could only bear that weight for so long. The hustle to get projects done while searching for new opportunities didn’t leave much time or space to reflect on how things might need to work differently as the organization grew from a staff of seven and $700,000-dollar budget in 2015 to around 40 people and more than $5 million in 2022. In August 2024, Hester Street’s board shocked many by announcing that Hester Street was sunsetting its operations, more than 20 years after the community development luminary was founded by New York architectural practice Leroy Street Studio. “We’ve determined that Hester Street’s financial model has proven unsustainable,” the board said. Hester Street’s final two years were also marked with internal conflict: The board struggled to find a new executive director to meet the moment, staffers rankled at the new full-time executive director’s management style, board members blamed the new executive director for not providing clear enough financial reports to make better decisions, and the new executive director blamed the board for handing her an unrealistic budget. I spoke to more than a dozen people, including Hester Street’s founders, former executive directors, former staff, former board members, former partners and former clients, to understand exactly what went wrong. Ultimately, it seems, Hester Street’s financial model was sustainable only as long as the organization could find an executive director who would throw themself into the role in an unsustainable way. It’s not clear what happens next for the projects in Hester Street’s portfolio at the time of the sunsetting announcement. In any case, now is a moment to understand what exactly the city has lost with the closure of Hester Street, as well as how it came to be what it is, drawing out any lessons for others who might aspire to fill in the gap it’s leaving behind. “Hester Street brought a track record, experience, a history of doing that work with integrity, with real groundedness, with real professionalism that was welcome in lots of different spaces,” said Sandra Lobo, executive director at the Northwest Bronx Community and Clergy Coalition, which worked with Hester Street on a community-led vision for the Kingsbridge Armory. “They allowed people to engage in a process with confidence that they would be heard, that their input would be taken seriously, not changed to fit an already figured-out outcome. That’s the crux of what we lost.” Hester Street partnered with the New York City Economic Development Corporation to draw up a community engagement strategy centering the priorities of Kingsbridge residents in efforts to revitalize the Kingsbridge Armory. Photo courtesy of Hester Street People Shaping Their Neighborhoods Hester Street’s vision of New Yorkers shaping their city was a product of its context. “So much of the early thinking of Hester Street was really informed by the history of activism in the Lower East Side and Chinatown,” said Anne Frederick, who served from 2002 to 2014 as the founding executive director of Hester Street Collaborative. “There was already this really rich tradition of communities galvanized and organized around land use and decision making, issues that I think informed us and became part of the DNA of the organization.” Back in 1998, Morgan Hare and Marc Turkel were in the market for a new home for Leroy Street Studio, the architecture firm they’d founded in 1995. A friend owned a former tablecloth factory at 113 Hester Street, which had sat vacant for about ten years. According to Hare, the friend was having trouble renting it out, so the firm was happy to take it off his hands. Though the building was, Hare said, “a mess,” the architects saw potential. Hester Street’s early office at 113 Hester Street. Interior of Hester Street’s early office. Photos courtesy of Hester Street Back at the firm itself, Hare and Turkel had just hired Frederick onto their growing team. Fresh out of the Parsons School of Design, Frederick was impressed by Leroy Street’s work with the East New York Youth Corps. The nonprofit, which already had a portfolio of affordable housing, had acquired a vacant building where it planned to build a community center and new housing for some of its tenants. It brought Leroy Street in as the architect for the project, and East New York Youth Corps’s full-time tenant organizer helped facilitate discussions between the architects and the future tenants of the building to design their new home. “The future tenants of this building actually existed,” Hare said. “At the time, we didn’t realize how unusual that was for an affordable housing project, but it is very unusual to actually know who your tenants are going to be.” It was the kind of work that appealed to Frederick as an architect. People who were normally ignored when it came to designing spaces for them actually got to help shape their space. She came to work at Leroy Street Studio in 1998 with every intention to do more projects like that. Instead, she started out on high-end design projects. Frederick pushed Hare and Turkel about wanting to do more of the work she came there to do; in the meantime, she spent nights and weekends on the Lower East Side, helping residents design and build community gardens and outdoor theaters. Then came 9/11. It ended up being a “big catalyst,” Frederick said. The dust was still settling, literally and emotionally, in Lower Manhattan and across New York. In the summer of 2002, the trio walked across the street from their new studio to M.S. 131. After temporarily closing in the wake of 9/11, the middle school was going to reopen that coming fall. The trio asked the principal how they could support the students, maybe through some public art programming or design education classes. “Right away she gave us an admonition, a warning that if you’re going to offer up to get involved, lots of people come and go, and it’s almost detrimental to the process,” Turkel said. “If you’re going to do this, she said to us, you need to commit and stay and really be here.” Student participants in the MS 131 “Ground Up” program (2002–2017) presented an annual lantern installation in Sara Roosevelt Park, photographed in 2009 (left) and 2013 (right). Images courtesy of Hester Street Participants in the “Ground Up” program installed a community mosaic at Sara Roosevelt Park. Photo courtesy of Hester Street And stay they did. That conversation flowered into Hester Street’s first program, “Ground Up.” According to Hester Street’s website, from 2002 to 2017, the program supported over a thousand students at M.S. 131 and also the nearby P.S. 134 through design classes and public art projects in the spaces around or near their schools, including an annual lantern installation at Sara Roosevelt Park. Leroy Street converted the ground floor of its storefront into a workshop space for students to make mosaics, sculptures, and screen-printed t-shirts. “There would be kids who would just show up after school, just really hungry for something different than your traditional, distinct classroom setting,” Frederick said. It was a small start, but it became an important way to build and maintain relationships with neighbors. Leroy Street officially incorporated Hester Street Collaborative as a nonprofit in 2003. Frederick began splitting her time between the two affiliated organizations, with Hare and Turkel volunteering on Hester Street’s founding board. By 2004, Frederick was working full-time at the new nonprofit. Branching out into the neighborhood, Frederick encountered base-building groups like Good Old Lower East Side, CAAAV: Organizing Asian Communities, University Settlement, Two Bridges Neighborhood Council, and tenant associations in local public housing communities. The Lower East Side helped birth a mass movement of tenants taking over housing from absentee landlords and turning them into income-restricted co-ops across the city. It was also the birthplace of the modern community garden movement. Family associations and family businesses had spent generations building and preserving Chinatown as an affordable immigrant neighborhood. “I really owe a lot of those early values of the organization to just the relationships in the community,” Frederick said. “Just learning from these long-time organizers and activists who have decades of struggle around land use, and just realizing so often it’s done so poorly and it’s done at the expense of working class communities and working class communities of color in particular.” As City coffers started filling with post-9/11 reconstruction funds, Hester Street joined the base-building groups to advocate for some of those funds to be spent on public spaces in the neighborhood — underutilized street malls with dangerous crossings and little other than a few benches, a former industrial waterfront inaccessible to the public. Together they arranged community engagement fairs, surveys and focus groups to gather input from the people who had an interest in using these spaces. Hester Street worked with residents, students, and local artists to create temporary installations meant to inspire ideas for how to make better use of them. The “Waterfront on Wheels” was a scale model of the Lower East Side waterfront mounted to a bike trolley that was used as an engagement tool in schools, parks, and community spaces. Photo courtesy of Hester Street Hester Street and the base-building groups formed the OUR Waterfront Coalition in 2007. Under the coalition’s banner, Hester Street facilitated a yearlong community engagement process, conducted in Spanish, Chinese and English. That resulted in “A People’s Plan for the East River Waterfront,” presented as an alternative to NYCEDC’s post-9/11 waterfront plan, which the coalition argued could fuel gentrification and displacement. One outgrowth of the People’s Plan was Paths to Pier 42, a series of temporary art and design installations that started in 2013, informing and building momentum for the transformation of the derelict space between the East River and the FDR Drive into a new park, for which construction finally broke ground in 2017. The new Pier 42 park finally completed construction and opened to the public in July 2024. A temporary functional installation as part of Paths to Pier 42, photographed in 2014. Photo courtesy of Hester Street “We started to kind of evolve into these partnerships where we’d work in coalition with base-building groups that represented different facets of the community,” Frederick said. “And then that set the model for other communities who could use this kind of support.” All along, the base-building groups would st"
