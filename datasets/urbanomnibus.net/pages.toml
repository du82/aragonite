full_description = "Collage of discount storefronts in New York City. Image by Gloria Lau A sign of scarcity, or abundance? Neighborhood resource, or extractive enterprise? Creative fount, or environmental nightmare? It’s hard to know what to make of the dollar store, that category of discount retail promising low, low prices and opening in greater and greater numbers across the US. Reports of predatory tactics and economic harm, and even fostering violence, are growing along with the national chains’ presence, and municipalities are moving to limit their reach and protect other retailers in vulnerable neighborhoods. In New York City, the picture is a little different. Family Dollar cracked the Center for an Urban Future’s list of the city’s most prevalent national chain retailers in 2015, and now has more locations than Pizza Hut, Mattress Firm, or Pret a Manger. But the majority of our 99 cent stores are mom-and-pops — and they outnumber all the Walgreens, Dunkin’, Starbucks and McDonald’s outlets citywide. Gloria Lau and Daphne Lundi counted them all. The urban planners, artists, and co-founders of Laudi CoLab have been tracing 99 cent stores’ imprint on New York City’s neighborhoods, alongside the ambivalent feelings they inspire. Below, they explore the dollar retail landscape inside and out, from signage to store layouts, and from culturally specific commodities to dubious discounts. “You are a kind of utopia, / you know. God’s garage,” Joshua Bennett opens the poem “Owed to the 99 Cent Store” conjuring the many possibilities and contradictions of the dollar store. It’s a place of abundance and excess, the kind that leaves one full but perhaps not well nourished. He points to the enduring draw of these spaces and their “sweet ecology,” how their alluring price point makes small joys possible. The siren call of these stores is especially audible to those who don’t have the spending power to shop in other places, or don’t have a local supermarket or hardware store. There are more 99 cent stores in New York City than Walgreens (227), Dunkin’s (620), Starbucks (316), and McDonald’s (191) combined. Discount stores represent a ubiquitous but often invisible part of the urban landscape. They’re everywhere and nowhere. New stores are popping up in new developments, and major dollar store chains are increasing their presence in the city. To the urban planner, dollar stores are undesirable uses, typically concentrated in low-income Black and brown neighborhoods. To the economist, the popularity of low-cost stores is a direct response to growing financial precarity, preying on an expanding underclass. To the climate advocate, they’re spaces that generate waste through the steady import of low-cost plastic products. To the optimist, these stores fill a gap in the retail space and allow for affordable home improvement and creativity. And then there is our personal perspective. Growing up, we both spent time in 99 cent stores — Daphne growing up in central Brooklyn and Gloria in the suburbs of the Bay Area as an immigrant from Hong Kong. These stores were part of our retail experience, where we shopped for cleaning and school supplies. But beyond this, what we knew about them was limited to the formal critique of these places as undesirable. We wanted to demystify the role these stores play in the city, how they function as businesses, and what they mean in the New York City retail landscape. Dollar store in new construction in Flatbush, Brooklyn. Photo by Gloria Lau The dollar store’s ancestors date back to the variety and general stores of the 19th and early 20th centuries. The United States’ westward colonial expansion created new communities in areas with limited access to retail stores. The general store became a one-stop shop in rural towns: a post and telegram office, a grocery store, a pharmacy, and haberdashery all at once. As these small towns grew, general stores developed into department stores, drugstores, and other types of retail. Dollar General, one of the largest and most profitable discount chains in the US, is considered the country’s first dollar store. The financial precarity of the Great Depression paved the way for their new retail model. Struggling retailers and manufacturers were looking for opportunities to offload merchandise at steep discounts. Beginning in 1939, J.L. Turner and Son, a wholesale and retail business in Scottsville, Kentucky, purchased these goods and then sold them to customers at low prices. Over time, the dollar store model evolved from selling discounted unsold inventory from other stores to working directly with manufacturers to create products that sold for a dollar or less. Opening of the first Dollar General Store in Springfield, KY. Photo via Dollar General Family Dollar started in North Carolina, Dollar Tree in Virginia, and Fred’s in Mississippi. What began as a regional phenomenon has become the fastest-growing retailer in the country. Seventy-five percent of Americans now live within five miles of a Dollar General. The passage of the Consumer Goods Pricing Act (CGPA) of 1975 paved the way for more dollar store chains and big box stores. Previously, manufacturers were able to set a minimum price for the sale of goods, blocking discount sellers from offering products at lower prices. Once the CGPA was passed, stores like Walmart and Dollar General rapidly expanded across the country, luring customers with much lower price tags than local retailers. Much like the economic precarity of the Great Depression, the Great Recession and the subprime mortgage crisis laid the groundwork for a boom in chain discount stores. Between 2011 and 2018, the number of Dollar General and Dollar Tree locations increased by fifty percent, from approximately 20,000 to 30,000. This exponential growth and investment in thousands of new storefronts relied on unending poverty. “Essentially what the dollar stores are betting on in a large way is that we are going to have a permanent underclass in America,” says former VP of Retail Intelligence at Cushman & Wakefield Garrick Brown in a 2017 Bloomberg Businessweek article on Dollar General’s expansion in rural America. In New York City, 17 of 195 total Neighborhood Tabulation Areas (NTAs) have 20 or more 99 cent stores. (NTAs are aggregations of census tracts that roughly align with NYC neighborhood boundaries.) Fifteen of those NTAs are majority Black, Latinx, or Asian. Many of these same neighborhoods are also rated as having high or moderate supermarket needs. Nationwide, dollar stores are now beginning to carry fresh food items, in an attempt to both address the criticism and capitalize on the fact that they’re disproportionately located in food deserts or food swamps, areas that have a high concentration of fast food restaurants. In 2021, the industry magazine Progressive Grocer named Dollar General the retailer of the year. That year, 77 percent of Dollar General’s business was in consumables, which included food goods. Like all major chains, national dollar stores are consistent in their branding and messaging. The word “dollar” features prominently in three of the major national chains. Dollar Tree, Family Dollar, and Dollar General stores feature bright, simple signs, with sans-serif fonts. While the national landscape of dollar stores is overwhelmingly made up of these chains, in NYC they are largely independently owned small businesses. The inconsistent naming conventions of 99 cent stores make it hard to put together a definitive list of their locations in New York City. Using a business search engine, we identified roughly 1,359 New York City businesses as dollar stores in 2021. 87 percent of dollar stores were privately-owned small businesses. The remaining 13 percent were one of the major dollar store chains: Family Dollar, Dollar General, Dollar Tree, or Five Below. Dollar stores in New York City in 2021, Neighborhood Tabulation Areas with 20 or more dollar stores. Sources: Brooklyn Public Library, Data Axle Reference Solutions. Map by Daphne Lundi Independent 99 cent stores in New York City have distinctive signage that sets them apart from other businesses, featuring bright colors, red or silver backgrounds with large, illuminated, 3D lettering that signals the affordable bounty that awaits the shopper. “Super Deal Outlet,” “City 99 Cents Store,” “Crazy Deals,” “99 Cents Papa,” “Dollar Outlet,” and “108 Discount & Gift Store.” In the way that a bodega owner must distinguish their store from the bodega across the street or down the block, so too must dollar store owners find a unique name and branding to stand out in a busy marketplace. New York City 99 cent stores by ownership. Source: World in Data. Image by Gloria Lau Dollar store storefronts and interior layouts highlight the contrast between small businesses and major chains. While chain dollar stores have set layouts and merchandise, mom-and-pop stores tend to have more variety and flexibility. 99 cent stores are often run by immigrant business owners; they can provide a pathway for secure jobs and upward mobility that’s less physically taxing than owning and operating a restaurant or working in a factory. Immigrant dollar store owners often stock products in their stores that connect them to their homeland. In culturally hyperdiverse New York City, 99 cent business owners can curate the items they stock to cater to their neighborhood’s residents. A dollar store in Sunset Park might carry Asian-style slippers and cookware, while a dollar store in central Brooklyn might carry Eco hairstyling gel and coconut milk. Exterior of Lotus Enterprises 99 Cents store in Bensonhurst, Brooklyn. Photo by Gloria Lau Lotus Enterprises 99 Cents (Bensonhurst) Family recipes are embedded in certain cookware. When I crave certain steamed and stir-fried dishes, I go in search of cooking tools that I used growing up in Hong Kong and oftentimes can only find in certain 99 cent stores. Bensonhurst has one of the city's highest concentrations of discount stores and of immigrants from Hong Kong. Chinese-owned 99 cent stores line the 86th Street commercial corridor. Different types of brooms and artificial flowers (plum blossoms left over from Lunar New Year) front the store. Tight aisles that can barely fit two people side by side divide the interior into rows. Colorful plastic stools, stainless steel cookware, and bamboo clothing clips bring a sense of familiarity amid the traditional dollar store fare of plastic food containers and tissue boxes. – Gloria Interior of Lotus Enterprises 99 Cents store in Bensonhurst, Brooklyn. Photos by Gloria Lau Series of 99 cent storefronts in Bensonhurst, Brooklyn. Photo by Gloria Lau Compared to mom-and-pop discount stores, chain discount stores lean heavily on creating a standardized brand and operational model that appeals to lower-income customers’ bargain hunting desires. On the real estate section of its website in 2022, Dollar Tree signaled to potential partners the amount of space (10,000 – 12,000 square feet) and socioeconomic markers (target median household income of $30,000 – $60,000; compared to 2021 US median household income of $70,784) that are practical for a Dollar Tree or Family Dollar location (these guidelines have recently changed). Exterior of Dollar Tree in Greenwood Heights, Brooklyn. Photo by Gloria Lau Dollar Tree (Greenwood Heights) Under the shadow of the Gowanus Expressway, nuzzled in the industrial zone at the border of Red Hook and Greenwood Heights and next to that giant Home Depot, is a Dollar Tree. The exterior and interior of the store are covered in signature dark and light green stripes. On the logo, seen on the storefront and through the store, the stripes form the canopy of a tree and a “1” forms the trunk: a literal dollar tree. Inside the store, the aisles are wide enough for a few people to linger, while space is maximized to place as many products as possible. White shelves serve as bare infrastructure for the merchandise and are lined with familiar national product brands. The prices are cheaper, and the product size might be smaller than at traditional retailers. Signature graphics cover the walls and shelves announce “The Thrill of the Hunt!” “Extreme Value Every Day,” and “New Items Weekly!” and instill an atmosphere of bargain and adventure. Refrigerators with dairy and frozen food items line the back of the store. Several aisles are devoted to canned food and pantry items. Interior of Dollar Tree in Greenwood Heights, Brooklyn. Photos by Gloria Lau Interior of Dollar Tree in Greenwood Heights, Brooklyn. Photos by Gloria Lau Mom-and-pop discount stores across the five boroughs are less uniform. Objects are often stacked floor to ceiling. Recovering from an overwhelming first impression, one can start to divine an organized system of display. Even without the streamlined logistic operations of chain stores, discount store owners still follow some basic parameters. A quick survey of discount store layout offerings shows a similar formula to chain discount stores, utilizing square footage and maximizing shelf space. One dollar store supplier describes their philosophy: “Your dollar store shelves should be more than just stocked; they should be over-stocked. When customers enter a dollar store, they want to immediately sense that the store is crammed full of treasures.” Examples of 99 cent store layouts offered by suppliers. Images via BuckStore Exterior of U-Need 99 Cents & Up Super Store (left) and Super 99 Cents Plus in Kensington, Brooklyn (right). Images via Google Street View Church Avenue (Kensington) There are several 99 cent stores within five blocks of Church Avenue. Their layout reflects the types of space they occupy. U-Need 99 Cents & Up Super Store takes up the ground floor of two buildings. The store space is wide and deep — six aisles wide and two aisles long. The aisles allow two people to pass at the same time. Though spacious, this store still adheres to a mom-and-pop aesthetic, with shelves stocked floor to ceiling high with goods. A block away, Super 99 Cents Plus occupies a long and narrow space that can only accommodate three narrow aisles. Each resembles a long hallway filled with all kinds of objects, where only one person can pass comfortably. Interior view of U-Need 99 Cents & Up Super Store (left) and Super 99 Cents Plus (right). Photos by Gloria Lau The bags of Ricola cough drops at the Dollar Tree in Greenwood Heights are smaller than the standard size you’ll find at a drugstore. Is the dollar price tag really a bargain if you compare the unit cost per cough drop? At a 99 cent store on Cortelyou Road in Ditmas Park, a brand of soap produced in India and distributed by a company in Trinidad sits next to brands wrapped in Russian and Polish text, reflecting the many communities around Central Brooklyn. How do discount store owners source their products and are there items specifically packaged for dollar store"
