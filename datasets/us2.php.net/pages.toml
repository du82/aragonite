["https://us2.php.net/manual/en/function.ignore-user-abort.php"]
title = "PHP: ignore_user_abort - Manual"
description = """
Description
  
   ignore_user_abort(?bool $enable = null): int

  
   Sets whether a client disconnect should cause a script to be aborted.
  
  
   When running PHP as a command line script, and the script's tty goes
   away without the script being terminated then the script will die the
   next time it tries to write anything, unless
   enable is set to true"""
full_description = "Description ignore_user_abort(?bool $enable = null): int Sets whether a client disconnect should cause a script to be aborted. When running PHP as a command line script, and the script's tty goes away without the script being terminated then the script will die the next time it tries to write anything, unless enable is set to true When running PHP as a command line script, and the script's tty goes away without the script being terminated then the script will die the next time it tries to write anything, unless enable is set to true If set and not null, this function will set the ignore_user_abort ini setting to the given enable. Otherwise, this function will only return the previous setting without changing it. PHP will not detect that the user has aborted the connection until an attempt is made to send information to the client. Simply using an echo statement does not guarantee that information is sent, see flush()."
year_published = 2025
