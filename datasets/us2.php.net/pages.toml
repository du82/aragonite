["https://us2.php.net/manual/en/functions.first_class_callable_syntax.php"]
title = "PHP: First class callable syntax - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "The first class callable syntax is introduced as of PHP 8.1.0, as a way of creating anonymous functions from callable. It supersedes existing callable syntax using strings and arrays. The advantage of this syntax is that it is accessible to static analysis, and uses the scope at the point where the callable is acquired. CallableExpr(...) syntax is used to create a Closure object from callable. CallableExpr accepts any expression that can be directly called in the PHP grammar: CallableExpr(...) has the same semantics as Closure::fromCallable(). That is, unlike callable using strings and arrays, CallableExpr(...) respects the scope at the point where it is created: Object creation by this syntax (e.g new Foo(...)) is not supported, because new Foo() syntax is not considered a call. The first-class callable syntax cannot be combined with the nullsafe operator. Both of the following result in a compile-time error:"
year_published = 2025
