title = "PHP: News Archive - 2022"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = '''phpday 2023 17 Dec 2022 Join us for the 20th edition of phpday! On May 18-19 2023 you can attend the in-person event in Verona (Italy) or online. Organized by GrUSP (the Italian PHP user group), phpday is one of the first historic European conferences dedicated to PHP, development tools and best practices. We are a community whose intent is to improve the web development ecosystem in Italy and to organize affordable, high-quality events and workshops for developers. We are committed to diversity, inclusion and accessibility values: we apply a Code of Conduct and we have a Scholarship program. Our Call For Papers will be open until January 16th and we're accepting submissions for 25 or 50 minute talks. The event is international and all sessions will be in English. We really appreciate submissions from first time speakers, and we can offer support for the entire process. Don't miss the opportunity to take part in this amazing community event with international speakers from all over the world where everyone can share, learn and grow professionally. Do you only want to attend? Grab your ticket at a discounted price. Follow us on Twitter and Facebook PHP 8.2.0 Released! 08 Dec 2022 The PHP development team announces the immediate availability of PHP 8.2.0. This release marks the latest minor release of the PHP language. PHP 8.2 comes with numerous improvements and new features such as: Readonly classes Disjunctive Normal Form (DNF) Types New stand-alone types: null, false, and true New "Random" extension Constants in traits Deprecate dynamic properties And much much more... For source downloads of PHP 8.2.0 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. The migration guide is available in the PHP Manual. Please consult it for the detailed list of new features and backward incompatible changes. Kudos to all the contributors and supporters! International PHP Conference Berlin 2023 06 Dec 2022 The International PHP Conference is the world's first PHP conference and stands since more than a decade for top-notch pragmatic expertise in PHP and web technologies. At the IPC, internationally renowned experts from the PHP industry meet up with PHP users and developers from large and small companies. Here is the place where concepts emerge and ideas are born - the IPC signifies knowledge transfer at highest level. All delegates of the International PHP Conference have, in addition to PHP program, free access to the entire range of the webinale taking place at the same time. Basic facts: Date: May 22 ‒ 26, 2023 Location: Maritim ProArte Hotel, Berlin or Online Highlights: 70+ best practice sessions 50+ international top speakers PHPower: Hands-on Power Workshops Expo with exciting exhibitors on May 23 & 24 Conference Combo: Visit the webinale for free All inclusive: Changing buffets, snacks & refreshing drinks Official certificate for attendees Free Swag: Developer bag, T-Shirt, magazines etc. Exclusive networking events For further information on the International PHP Conference Berlin visit: www.phpconference.com/berlin-en/'''
