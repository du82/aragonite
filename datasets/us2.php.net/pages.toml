full_description = "PHPKonf 2020 Online 30 Nov 2020 Selam! Due to the COVID-19 pandemic we have transformed PHPKonf Istanbul PHP Conference 2020 to an online event. On December 12th we will offer a 1-day, multi-track event free of charge for all attendees! Go to http://phpkonf.org for registration and more information. PHP 8.0.0 Released! 26 Nov 2020 The PHP development team announces the immediate availability of PHP 8.0.0. This release marks the latest major release of the PHP language. PHP 8.0 comes with numerous improvements and new features such as: Union Types Named Arguments Match Expressions Attributes Constructor Property Promotion Nullsafe Operator Weak Maps Just In Time Compilation And much much more... Take a look at the PHP 8.0 Announcement Addendum for more information. For source downloads of PHP 8.0.0 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. The migration guide is available in the PHP Manual. Please consult it for the detailed list of new features and backward incompatible changes. Many thanks to all the contributors and supporters! PHP 7.3.25 Released! 26 Nov 2020 The PHP development team announces the immediate availability of PHP 7.3.25. This is a bug fix release. All PHP 7.3 users are encouraged to upgrade to this version. For source downloads of PHP 7.3.25 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. PHP 7.4.13 Released! 26 Nov 2020 The PHP development team announces the immediate availability of PHP 7.4.13. This is a bug fix release. All PHP 7.4 users are encouraged to upgrade to this version. For source downloads of PHP 7.4.13 please visit our downloads page, Windows source and binaries can be found on windows.php.net/download/. The list of changes is recorded in the ChangeLog. Laracon EU Online 2021 23 Nov 2020 A full week for Laravel developers with a series of cutting edge presentations, webinars and networking events. Discover January 18-22th on https://laracon.eu/online/"
