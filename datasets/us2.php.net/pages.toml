["https://us2.php.net/manual/en/language.operators.increment.php"]
title = "PHP: Increment and Decrement - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = '''PHP supports pre- and post-increment and decrement operators. Those unary operators allow to increment or decrement the value by one. The increment and decrement operators have no effect on values of type bool. A E_WARNING is emitted as of PHP 8.3.0, because this will implicitly cast the value to int in the future. The decrement operator has no effect on values of type null. A E_WARNING is emitted as of PHP 8.3.0, because this will implicitly cast the value to int in the future. The decrement operator has no effect on non- numeric string. A E_WARNING is emitted as of PHP 8.3.0, because a TypeError will be thrown in the future. Internal objects that support overloading addition and/or subtraction can also be incremented and/or decremented. One such internal object is GMP. This feature is soft-deprecated as of PHP 8.3.0. The str_increment() function should be used instead. It is possible to increment a non- numeric string in PHP. The string must be an alphanumerical ASCII string. Which increments letters up to the next letter, when reaching the letter Z the increment is carried to the value on the left. For example, $a = 'Z'; $a++; turns $a into 'AA'. If the alphanumerical string can be interpreted as a numeric string it will be cast to an int or float. This is particularly an issue with strings that look like a floating point numbers written in exponential notation. The str_increment() function does not suffer from these implicit type cast. This is because the value "5e0" is interpreted as a float and cast to the value 5.0 before being incremented.'''
year_published = 2025
