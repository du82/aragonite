title = "PHP: Enumeration methods - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "Enums (both Pure Enums and Backed Enums) may contain methods, and may implement interfaces. If an Enum implements an interface, then any type check for that interface will also accept all cases of that Enum. In this example, all four instances of Suit have two methods, color() and shape(). As far as calling code and type checks are concerned, they behave exactly the same as any other object instance. Methods may be arbitrarily complex, but in practice will usually return a static value or match on $this to provide different results for different cases. Note that in this case it would be a better data modeling practice to also define a SuitColor Enum Type with values Red and Black and return that instead. However, that would complicate this example. The above hierarchy is logically similar to the following class structure (although this is not the actual code that runs): Methods may be public, private, or protected, although in practice private and protected are equivalent as inheritance is not allowed."
