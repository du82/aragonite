["https://us2.php.net/archive/2003.php"]
title = "PHP: News Archive - 2003"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = '''[22-Dec-2003] The Vancouver PHP Users Association presents The PHP Vancouver Conference on January 22-23, a professional and technical conference focused on the PHP scripting language. The goal of this conference is to bring together some of the world's leading PHP developers and business professionals to share their experience with both students and PHP professionals in a series of talks. [18-Dec-2003] Members of the PHP community are seeking volunteers to help develop the first Web site that is created both by the community and for the community. The features of this project will be driven by the needs and desires of the community as much as possible and may include such things as blogs, news, FAQs, articles, links, and tutorials. If you would like to contribute, please contact Chris Shiflett, who is coordinating this project. There is a need for every type of contributor, including developers, translators, administrators, designers, writers, and advocates. [15-Dec-2003] Software & Support Media, producers of the International PHP Conference, are pleased to announce a new monthly version of their print publication, the "International PHP Magazine", published in PDF format and distributed electronically. The first issue is available for free on the magazine's website. [13-Dec-2003] The PHP Québec is pleased to announce the immediate availability of PHP Québec DVD. Over 6 hours of conferences, recorded in Montréal, in March 2003. DVD is subtitled in English and French, making legendary sessions from Rasmus and Zeev available anywhere in the world. [12-Dec-2003] The Call for Participation for the 2004 MySQL User Conference is now open. MySQL is looking for sessions that speak to your peers: practical, pragmatic and clueful presentations that focus on how you solved problems in a demanding or unique technical environment. Additionally, the conference is looking for solid proposals for Bird-of-a-Feather (BoF) sessions and Lightning Talks. The call for papers closes on January 14th. The call for BoFs and lightning talks closes on February 14th. The conference will take place on April 14th to 16th in Orlando, Florida, USA.'''
