["https://us2.php.net/manual/en/language.enumerations.basics.php"]
title = "PHP: Basic enumerations - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = 'Enums are similar to classes, and share the same namespaces as classes, interfaces, and traits. They are also autoloadable the same way. An Enum defines a new type, which has a fixed, limited number of possible legal values. This declaration creates a new enumerated type named Suit, which has four and only four legal values: Suit::Hearts, Suit::Diamonds, Suit::Clubs, and Suit::Spades. Variables may be assigned to one of those legal values. A function may be type checked against an enumerated type, in which case only values of that type may be passed. An Enumeration may have zero or more case definitions, with no maximum. A zero-case enum is syntactically valid, if rather useless. By default, cases are not intrinsically backed by a scalar value. That is, Suit::Hearts is not equal to "0". Instead, each case is backed by a singleton object of that name. That means that: It also means that enum values are never < or > each other, since those comparisons are not meaningful on objects. Those comparisons will always return false when working with enum values. This type of case, with no related data, is called a "Pure Case." An Enum that contains only Pure Cases is called a Pure Enum. All Pure Cases are implemented as instances of their enum type. The enum type is represented internally as a class. It is also possible to use the defined() and constant() functions to check for the existence of or read an enum case if the name is obtained dynamically. This is, however, discouraged as using Backed enums should work for most use cases.'
year_published = 2025
clearnet = "https://us2.php.net/manual/en/language.enumerations.basics.php"
