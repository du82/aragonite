["https://us2.php.net/manual/en/language.namespaces.faq.php"]
title = "PHP: FAQ - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = 'This FAQ is split into two sections: common questions, and some specifics of implementation that are helpful to understand fully. There are a few implementation details of the namespace implementations that are helpful to understand. No. Namespaces do not affect any existing code in any way, or any as-yet-to-be-written code that does not contain namespaces. You can write this code if you wish: Names that begin with a \ always resolve to what they look like, so \my\name is in fact my\name, and \Exception is Exception. Names that contain a backslash but do not begin with a backslash like my\name can be resolved in 2 different ways. If there is an import statement that aliases another name to my, then the import alias is applied to the my in my\name. Function or constant names that do not contain a backslash like name can be resolved in 2 different ways. Finally, if the constant or function name does not exist in the current namespace, a global constant or function name is used if it exists. There is no name conflict, even though the class MyClass exists within the my\stuff namespace, because the MyClass definition is in a separate file. However, the next example causes a fatal error on name conflict because MyClass is defined in the same file as the use statement. It is very important to realize that because the backslash is used as an escape character within strings, it should always be doubled when used inside a string. Otherwise there is a risk of unintended consequences: Any undefined constant that is unqualified like FOO will produce a notice explaining that PHP assumed FOO was the value of the constant. Any constant, qualified or fully qualified, that contains a backslash will produce a fatal error if not found. Any attempt to define a namespaced constant that is a special, built-in constant results in a fatal error'
year_published = 2025
