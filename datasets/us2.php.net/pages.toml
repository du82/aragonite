["https://us2.php.net/manual/en/function.define.php"]
title = "PHP: define - Manual"
description = """
Description
  
   define(string $constant_name, mixed $value, bool $case_insensitive = false): bool

  
   Defines a named constant at runtime."""
full_description = "Description define(string $constant_name, mixed $value, bool $case_insensitive = false): bool Defines a named constant at runtime. It is possible to define() constants with reserved or even invalid names, whose value can (only) be retrieved with constant(). However, doing so is not recommended. The value of the constant. In PHP 5, value must be a scalar value (int, float, string, bool, or null). In PHP 7, array values are also accepted. While it is possible to define resource constants, it is not recommended and may cause unpredictable behavior. If set to true, the constant will be defined case-insensitive. The default behavior is case-sensitive; i.e. CONSTANT and Constant represent different values. Defining case-insensitive constants is deprecated as of PHP 7.3.0. As of PHP 8.0.0, only false is an acceptable value, passing true will produce a warning. This example illustrates the possibility to define a constant with the same name as a magic constant. Since the resulting behavior is obviously confusing, it is not recommended to do this in practise, though."
year_published = 2025
