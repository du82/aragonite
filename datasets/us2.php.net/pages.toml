["https://us2.php.net/manual/en/function.pg-pconnect.php"]
title = "PHP: pg_pconnect - Manual"
description = '''
Description
  
   pg_pconnect(string $connection_string, int $flags = 0): PgSql\Connection|false

  
   pg_pconnect() opens a connection to a
   PostgreSQL database. It returns a PgSql\Connection instance that is
   needed by other PostgreSQL functions.
  
  
   If a second call is made to pg_pconnect() with
   the same connection_string as an existing connection, the
   existing connection will be returned unless you pass
   PGSQL_CONNECT_FORCE_NEW as
   flags.
  
  
   To enable persistent connections, the
   pgsql.allow_persistent
   php.ini directive must be set to "On" (which is the default).
   The maximum number of persistent connections can be defined with the
   pgsql.max_persistent
   php.ini directive (defaults to -1 for no limit).
   The total number of connections can be set with the
   pgsql.max_links
   php.ini directive.
  
  
   pg_close() will not close persistent links
   generated by pg_pconnect().'''
full_description = 'Description pg_pconnect(string $connection_string, int $flags = 0): PgSql\Connection|false pg_pconnect() opens a connection to a PostgreSQL database. It returns a PgSql\Connection instance that is needed by other PostgreSQL functions. If a second call is made to pg_pconnect() with the same connection_string as an existing connection, the existing connection will be returned unless you pass PGSQL_CONNECT_FORCE_NEW as flags. To enable persistent connections, the pgsql.allow_persistent php.ini directive must be set to "On" (which is the default). The maximum number of persistent connections can be defined with the pgsql.max_persistent php.ini directive (defaults to -1 for no limit). The total number of connections can be set with the pgsql.max_links php.ini directive. pg_close() will not close persistent links generated by pg_pconnect().'
year_published = 2025
