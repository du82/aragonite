["https://us2.php.net/manual/en/language.oop5.anonymous.php"]
title = "PHP: Anonymous classes - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "They can pass arguments through to their constructors, extend other classes, implement interfaces, and use traits just like a normal class can: Nesting an anonymous class within another class does not give it access to any private or protected methods or properties of that outer class. In order to use the outer class' protected properties or methods, the anonymous class can extend the outer class. To use the private properties of the outer class in the anonymous class, they must be passed through its constructor: Note that anonymous classes are assigned a name by the engine, as demonstrated in the following example. This name has to be regarded an implementation detail, which should not be relied upon."
