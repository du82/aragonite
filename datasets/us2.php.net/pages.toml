full_description = "The foreach construct provides an easy way to iterate over arrays and Traversable objects. foreach will issue an error when used with a variable containing a different data type or with an uninitialized variable. The first form traverses the iterable given by iterable_expression. On each iteration, the value of the current element is assigned to $value. The second form will additionally assign the current element's key to the $key variable on each iteration. Note that foreach does not modify the internal array pointer, which is used by functions such as current() and key(). It is possible to iterate over an array of arrays and unpack the nested array into loop variables by using either array destructuring via [] or by using the list() language construct as the value. In both of the following examples $a will be set to the first element of the nested array and $b will contain the second element: When providing fewer variables than there are elements in the array, the remaining elements will be ignored. Similarly, elements can be skipped over by using a comma: It is possible to directly modify array elements within a loop by preceding $value with &. In that case the value will be assigned by reference. Reference to a $value of the last array element remain even after the foreach loop. It is recommended to destroy these using unset(). Otherwise, the following behavior will occur:"
