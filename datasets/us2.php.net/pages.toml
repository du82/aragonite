title = "PHP: Fiber::resume - Manual"
description = """
Description
  
   public Fiber::resume(mixed $value = null): mixed

  
   Resumes the fiber using the given value as the result of the current Fiber::suspend() call.
  
  
   If the fiber is not suspended when this method is called, a FiberError will be thrown."""
full_description = "Description public Fiber::resume(mixed $value = null): mixed Resumes the fiber using the given value as the result of the current Fiber::suspend() call. If the fiber is not suspended when this method is called, a FiberError will be thrown. The value to resume the fiber. This value will be the return value of the current Fiber::suspend() call. The value provided to the next call to Fiber::suspend() or null if the fiber returns. If the fiber throws an exception before suspending, it will be thrown from the call to this method."
