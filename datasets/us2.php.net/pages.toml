["https://us2.php.net/manual/en/features.commandline.options.php"]
title = "PHP: Options - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = '''The list of command line options provided by the PHP binary can be queried at any time by running PHP with the -h switch: Specifies either a directory in which to look for php.ini, or a custom INI file (which does not need to be named php.ini), e.g.: Parse and execute the specified file. The -f is optional and may be omitted - providing just the filename to execute is sufficient. Syntax check but do not execute the given PHP code. The input from standard input will be processed if no filenames are specified, otherwise each filename will be checked. On success, the text No syntax errors detected in <filename> is written to standard output. On failure, the text Errors parsing <filename> is written to standard output in addition to the internal parser error. If any failures are found in the specified files (or standard input), the shell return code is set to -1, otherwise the shell return code is set to 0. Allows execution of PHP included directly on the command line. The PHP start and end tags (<?php and ?>) are not needed and will cause a parse error if present. Care must be taken when using this form of PHP not to collide with command line variable substitution done by the shell. The problem here is that sh/bash performs variable substitution even when using double quotes ". Since the variable $foo is unlikely to be defined, it expands to nothing which results in the code passed to PHP for execution actually reading: The correct way would be to use single quotes '. Variables in single-quoted strings are not expanded by sh/bash. If using a shell other than sh/bash, further issues might be experienced - if appropriate, a bug report should be opened at » https://github.com/php/php-src/issues. It is still easy to run into trouble when trying to use variables (shell or PHP) in command-line code, or using backslashes for escaping, so take great care when doing so. You have been warned! This option is only intended for very basic code, so some configuration directives (such as auto_prepend_file and auto_append_file) are ignored in this mode.'''
