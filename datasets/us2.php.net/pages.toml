["https://us2.php.net/manual/en/language.generators.syntax.php"]
title = "PHP: Generator syntax - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "A generator function looks just like a normal function, except that instead of returning a value, a generator yields as many values as it needs to. Any function containing yield is a generator function. When a generator function is called, it returns an object that can be iterated over. When you iterate over that object (for instance, via a foreach loop), PHP will call the object's iteration methods each time it needs a value, then saves the state of the generator when the generator yields a value so that it can be resumed when the next value is required. Once there are no more values to be yielded, then the generator can simply return, and the calling code continues just as if an array has run out of values. The heart of a generator function is the yield keyword. In its simplest form, a yield statement looks much like a return statement, except that instead of stopping execution of the function and returning, yield instead provides a value to the code looping over the generator and pauses execution of the generator function. Internally, sequential integer keys will be paired with the yielded values, just as with a non-associative array. PHP also supports associative arrays, and generators are no different. In addition to yielding simple values, as shown above, you can also yield a key at the same time. The syntax for yielding a key/value pair is very similar to that used to define an associative array, as shown below. Generator functions are able to yield values by reference as well as by value. This is done in the same way as returning references from functions: by prepending an ampersand to the function name. Generator delegation allows you to yield values from another generator, Traversable object, or array by using the yield from keyword. The outer generator will then yield all values from the inner generator, object, or array until that is no longer valid, after which execution will continue in the outer generator. If a generator is used with yield from, the yield from expression will also return any value returned by the inner generator."
year_published = 2025
clearnet = "https://us2.php.net/manual/en/language.generators.syntax.php"
