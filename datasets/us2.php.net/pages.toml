["https://us2.php.net/manual/add-note.php"]
title = "PHP: Add Manual Note"
description = """
Please read What not to enter    we have many comments to moderate and there is an overwhelming number of    users ignoring this important section.        Good notes rise to the top as they are voted up; this makes    them easier to find.        Poor notes fall to the bottom and are faded out to discourage    their use; after certain threshold they are removed.    Any form of spam is removed immediately."""
full_description = '''We have a simple conversion in place to convert the @ signs and dots in your address. You may still want to include a part in the email address that is understandable only by humans as our conversion can be performed in the opposite direction. You may submit your email address as user@NOSPAM.example.com for example (which will be displayed as user at NOSPAM dot example dot com. If we remove your note we can only send an email if you use your real email address. Note that HTML tags are not allowed in the posts, but the note formatting is preserved. URLs will be turned into clickable links, PHP code blocks enclosed in the PHP tags <?php and ?> will be source highlighted automatically. So always enclose PHP snippets in these tags. Double-check that your note appears as you want during the preview; that's why it is there! Please note that periodically the developers go through the notes and may incorporate information from them into the documentation. This means that any note submitted here becomes the property of the PHP Documentation Group and will be available under the same license as the documentation. Your IP Address will be logged with the submitted note and made public on the PHP manual user notes mailing list. The IP address is logged as part of the notes moderation process, and won't be shown within the PHP manual itself. The SPAM challenge requires numbers to written out in English, so, an appropriate answer may be nine but not 9. To add a note, you must click on the "Add Note" button (the plus sign) on the bottom of a manual page so we know where to add the note!'''
year_published = 2025
clearnet = "https://us2.php.net/manual/add-note.php"
