["https://us2.php.net/manual/en/language.types.declarations.php"]
title = "PHP: Type declarations - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "Type declarations can be added to function arguments, return values, as of PHP 7.4.0, class properties, and as of PHP 8.3.0, class constants. They ensure that the value is of the specified type at call time, otherwise a TypeError is thrown. Every single type that PHP supports, with the exception of resource can be used within a user-land type declaration. This page contains a changelog of availability of the different types and documentation about usage of them in type declarations. When a class implements an interface method or reimplements a method which has already been defined by a parent class, it has to be compatible with the aforementioned definition. A method is compatible if it follows the variance rules. Atomic types have straight forward behaviour with some minor caveats which are described in this section. Name aliases for scalar types (bool, int, float, string) are not supported. Instead, they are treated as class or interface names. For example, using boolean as a type declaration will require the value to be an instanceof the class or interface boolean, rather than of type bool: Returning by reference from a void function is deprecated as of PHP 8.1.0, because such a function is contradictory. Previously, it already emitted the following E_NOTICE when called: Only variable references should be returned by reference. If a pass-by-reference parameter has a type declaration, the type of the variable is only checked on function entry, at the beginning of the call, but not when the function returns. This means that a function can change the type of variable reference. Composite type declarations are subject to a couple of restrictions and will perform a redundancy check at compile time to prevent simple bugs. Prior to PHP 8.2.0, and the introduction of DNF types, it was not possible to combine intersection types with union types. It is not possible to combine the two singleton types false and true together in a union type. Use bool instead. Prior to PHP 8.2.0, as false and null could not be used as standalone types, a union type comprised of only these types was not permitted. This comprises the following types: false, false|null, and ?false."
year_published = 2025
clearnet = "https://us2.php.net/manual/en/language.types.declarations.php"
