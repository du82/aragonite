["https://us2.php.net/manual/en/features.commandline.interactive.php"]
title = "PHP: Interactive shell - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "The CLI SAPI provides an interactive shell using the -a option if PHP is compiled with the --with-readline option. As of PHP 7.1.0 the interactive shell is also available on Windows, if the readline extension is enabled. The interactive shell also features tab completion for functions, constants, class names, variables, static method calls and class constants. Pressing the tab key twice when there are multiple possible completions will result in a list of these completions: When there is only one possible completion, pressing tab once will complete the rest on the same line: Completion will also work for names that have been defined during the current interactive shell session: The interactive shell stores your history which can be accessed using the up and down keys. The history is saved in the ~/.php_history file. As of PHP 8.4.0, the path to the history file can be set using the PHP_HISTFILE environment variable. The CLI SAPI provides the php.ini settings cli.pager and cli.prompt. The cli.pager setting allows an external program (such as less) to act as a pager for the output instead of being displayed directly on the screen. The cli.prompt setting makes it possible to change the php > prompt. Files included through auto_prepend_file and auto_append_file are parsed in this mode but with some restrictions - e.g. functions have to be defined before called. If the readline extension is not available, prior to PHP 8.1.0, invoking the CLI SAPI with the -a option provided the interactive mode. In this mode, a complete PHP script is supposed to be given via STDIN, and after termination with CTRL +D (POSIX) or CTRL +Z followed by +ENTER (Windows), this script is evaluated. This is basically the same as invoking the CLI SAPI without the -a option. As of PHP 8.1.0, invoking the CLI SAPI with the -a option fails, if the readline extension is not available."
year_published = 2025
