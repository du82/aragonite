["https://us2.php.net/manual/en/language.variables.predefined.php"]
title = "PHP: Predefined Variables - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = 'PHP provides a number of predefined variables. PHP also provides an additional set of predefined arrays containing variables from the web server (if applicable), the environment, and user input. These arrays are automatically available in every scope. For this reason, they are often known as "superglobals". (There is no mechanism in PHP for user-defined superglobals.) Refer to the list of superglobals for details. If certain variables in variables_order are not set, their appropriate PHP predefined arrays are also left empty.'
