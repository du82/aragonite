["https://us2.php.net/manual/en/features.commandline.differences.php"]
title = "PHP: Differences to other SAPIs - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "Though the CGI SAPI provides a way to suppress HTTP headers, there's no equivalent switch to enable them in the CLI SAPI. CLI is started up in quiet mode by default, though the -q and --no-header switches are kept for compatibility so that it is possible to use older CGI scripts. It does not change the working directory to that of the script. (-C and --no-chdir switches kept for compatibility) There are certain php.ini directives which are overridden by the CLI SAPI because they do not make sense in shell environments: Setting this to true means that scripts executed via the CLI SAPI always have access to argc (number of arguments passed to the application) and argv (array of the actual arguments). The PHP variables $argc and $argv are automatically set to the appropriate values when using the CLI SAPI. These values can also be found in the $_SERVER array, for example: $_SERVER['argv']. The presence of $argv or $_SERVER['argv'] is not a reliable indication that a script is being run from the command line because they may be set in other contexts when register_argc_argv is enabled. The value returned by php_sapi_name() should be checked instead. These directives cannot be initialized with another value from the configuration file php.ini or a custom one (if specified). This limitation is because the values are applied after all configuration files have been parsed. However, their values can be changed during runtime (although this is not sensible for all of them, such as register_argc_argv). It is recommended to set ignore_user_abort for command line scripts. See ignore_user_abort() for more information. The CGI SAPI supports this CLI SAPI behaviour by means of the -C switch when run from the command line."
year_published = 2025
