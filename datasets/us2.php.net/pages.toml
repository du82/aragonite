["https://us2.php.net/manual/en/language.oop5.constants.php"]
title = "PHP: Class Constants - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "It is possible to define constants on a per-class basis remaining the same and unchangeable. The default visibility of class constants is public. Class constants can be redefined by a child class. As of PHP 8.1.0, class constants cannot be redefined by a child class if it is defined as final. It's also possible for interfaces to have constants. Look at the interface documentation for examples. It's possible to reference the class using a variable. The variable's value can not be a keyword (e.g. self, parent and static). The special ::class constant allows for fully qualified class name resolution at compile time, this is useful for namespaced classes: Note: As of PHP 8.3.0 visibility variance is checked more strictly. Prior to this version, the visibility of a class constant could be different from the visibility of the constant in the implemented interface."
