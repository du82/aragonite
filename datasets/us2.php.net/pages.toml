["https://us2.php.net/manual/en/language.namespaces.importing.php"]
title = "PHP: Aliasing and Importing - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "The ability to refer to an external fully qualified name with an alias, or importing, is an important feature of namespaces. This is similar to the ability of unix-based filesystems to create symbolic links to a file or to a directory. Importing is performed at compile-time, and so does not affect dynamic class, function or constant names. In addition, importing only affects unqualified and qualified names. Fully qualified names are absolute, and unaffected by imports. The use keyword must be declared in the outermost scope of a file (the global scope) or inside namespace declarations. This is because the importing is done at compile time and not runtime, so it cannot be block scoped. The following example will show an illegal use of the use keyword: Importing rules are per file basis, meaning included files will NOT inherit the parent file's importing rules. Classes, functions and constants being imported from the same namespace can be grouped together in a single use statement."
