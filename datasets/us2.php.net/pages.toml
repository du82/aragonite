full_description = "[19-Dec-2000] This release includes improvements for a large number of defects and numerous enhancements in the PHP core, the language implementation and extensions. Download, ChangeLog. [21-Oct-2000] PHP 3.0.18 was released. This is a bug-fix release, including fixes for file uploads and a backported imagetypes() function from PHP 4.0. The ChangeLog contains a full list of changes. [15-Oct-2000] Due to two problems discovered in PHP 4.0.3, PHP 4.0.3pl1 is now available. This release fixes an issue that prevented the Apache php_value mechanism from working correctly with .conf files, and a memory leak that was discovered in the module versions of PHP. [11-Oct-2000] Version 4.0.3 includes several security-oriented fixes and enhancements, as well as several new features and bug fixes. It is strongly recommended for all users of PHP to upgrade to this version. You can read the changelog here. [29-Aug-2000] The new version features new functions, many bug fixes, and increased performance. Download now! You can read the changelog here. [30-June-2000] PHP 4.0.1pl2 addresses two bugs that were discovered in PHP 4.0.1, that prevent error_reporting() and readdir() from working properly. [28-June-2000] The first maintenance release for PHP 4.0 is out. The new release features increased stability under Windows, improved error handling, several new features and lots of bug fixes. (the full list of changes is available) It's a recommended upgrade for all PHP users. Download now! [22-May-2000] It's here, it's ready, and it has the long awaited 'Release' tag. The successor of PHP 3.0 has finally been released. At this point, everyone is encouraged to begin upgrading their systems to use this version. Download it now! [05-Apr-2000] PHP 3.0.16 was released. This is mostly a bug fix release which adds support for gd-1.8, ucd-snmp 4.1, and high-resolution timers on OS/2. OpenBSD support has been improved considerably. The source package and Win32 binaries are available from the PHP homepage. The ChangeLog contains a full list of changes."
