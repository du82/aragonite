description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "[31-Dec-2002] We are at the end of 2002, and it seemed appropriate to look back on the development issues of the past year. So starts the first PHP Look Back! You can find it in on the non-official personal website of one of the PHP Developers here. [27-Dec-2002] The PHP developers are pleased to announce the immediate availability of PHP 4.3.0, the latest and greatest version of this extremely popular and widely used scripting language. This release contains a multitude of changes, bug fixes and improvements over the previous one, PHP 4.2.3. It further elevates PHP's standing as a serious contender in the general purpose scripting language arena. Please see the full release announcement. [27-Dec-2002] The 11th sample of the CHM edition is available for download from today. The sample hopefully fixed the missing page bugs forever, introduces a new integration method (see documentation inside) and contains actual manual text, mirrors list and user notes. See the edition's page for download. We also would like to ask you to help out in testing our new on-the-fly syntax highlighter, which would make the CHM significantly smaller, and would give you more options in displaying the pages. See the edition's page for more information. [16-Dec-2002] MySQL AB is proud to host the world's First Annual MySQL User Conference, to be held in the heart of Silicon Valley, April 10-12, 2003. This event promises to be the biggest gathering of MySQL database users ever in one location. Designed for both the MySQL developer and the corporate decision maker, this is the place to learn about the latest in MySQL technology, discover new business opportunities, take a pulse on industry direction and commune with like minds. More information on the event's website. [01-Dec-2002] The news of PHP.net is available now in RSS 1.0 format via our new news.rss file. You can add this file to any news reader or portal site to get the latest official PHP news. We strongly recommend you to cache the contents locally on your side, as the newsfeed is updated daily. The RSS file is available on every mirror site."
