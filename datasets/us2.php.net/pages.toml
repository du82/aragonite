full_description = "[31-Dec-2004] The PHP Development Team has issued an important statement that deals with the security of PHP, and of PHP-based applications. The trigger for releasing this statement was the growing misconception in the PHP community regarding recent security problems, which exploited bugs in PHP applications, rather than bugs in PHP itself. It's a recommended read for anybody using PHP. [27-Dec-2004] Surely, some of our visitors are back at work for a few days between holidays, and hopefully they will find our post-christmas gift useful. The function list suggestions we started to test a year ago seemed to be working better as some bugs were found and fixed, so it was time to make the result available on all php.net pages. Whenever you type something into the search field, while having the function list search option selected, you will get a list of suggested functions starting with the letters you typed in. You can browse the list with the up/down keys, and you will be able to autocomplete the function name with the spacebar. If you are not interested in this feature, you can turn it off for yourself on the My PHP.net page. More information about is available on the search page. [15-Dec-2004] The PHP Development Team would like to announce the immediate release of PHP 4.3.10 and PHP 5.0.3. These are maintenance releases that in addition to non-critical bug fixes address several very serious security issues. All Users of PHP are strongly encouraged to upgrade to one of these releases as soon as possible. For changes since PHP 4.3.9, please consult the PHP 4 ChangeLog. For changes since PHP 5.0.2, please consult the PHP 5 ChangeLog. [15-Dec-2004] The second Web Technology conference in Bulgaria will be held in March 2005 at the city of Sofia. Within its framework, the Second Bulgarian PHP Conference and first IT Business conference will be held. The purpose of this meeting is to discuss the new tendencies in this direction and to popularize the internet technologies in the spheres of business, education, and services. The range of subjects includes technologies like PHP, Perl, business systems through web, education through the internet, and others."
