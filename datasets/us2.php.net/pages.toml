full_description = "[10-Dec-2001] PHP 4.1.0 is a key new release in the PHP 4 family. It includes highly-improved performance, especially under Windows; a more security-friendly way of accepting form variables; output compression; and much, much more. Read the full release announcement, or check out the changelog. Windows binaries are also available. [27-Nov-2001] After one week our Windows HTML Help Manual Survey is over now. We received nearly six hundred processable forms with many wishes and comments. Thanks for you all, who contributed to making the best help system for PHP on Windows. You can get more information about the ongoing project, including the detailed results of the survey at the project's own page. [18-Oct-2001] PHP-GTK documentation is starting to be more filled out. The manual is now rebuilt every night and downloadable versions of it in different formats are also available. If you have been working with PHP-GTK and would like to contribute to the documentation effort, please let us know. [17-Sep-2001] Thanks to the generous folks at Rackspace, we have added additional capacity for hosting the PHP project's efforts. Currently, the machine they have provided is serving downloads for www.php.net and snaps.php.net. We will continue to re-balance our resource needs across all of the machines provided by our supporters. [11-Sep-2001] The worldwide PHP community is horrified by recent events and would like to offer its deepest sympathies to the friends and families of those who lost their lives. Support the Red Cross. [28-Aug-2001] There is no need now to come to the main php.net server, if you would like to read the manual notes, as they are mirrored worldwide, and you can read them on all our mirror sites. You can get better response times by visiting the closest mirror. See the bottom of our pages. [17-Aug-2001] PHP enthusiasts from all over the world will meet three days to attend powerworkshops and sessions presented by the inventors of PHP, members of the core group and other well known people from the community. More information at www.php-conference.de."
