full_description = "21-Dec-2012 The PHP development team announces the immediate availability of PHP 5.5.0alpha2. This release adds new features and fix some bugs from alpha1. All users of PHP are encouraged to test this version carefully, and report any bugs in the bug tracking system. THIS IS A DEVELOPMENT PREVIEW - DO NOT USE IT IN PRODUCTION! PHP 5.5.0 Alpha 2 comes with new features and improvements such as (incomplete list) : Support for using empty() on the result of function calls and other expressions, Systemtap support by enabling systemtap compatible dtrace probes on linux, Optimized access to temporary and compiled VM variables. 8% less memory reads. Please, note that this alpha version also introduces the ext/mysql depreciation. You can read the full list of changes in the NEWS file contained in the release archive. For source downloads of PHP 5.5.0 Alpha 2 please visit the download page, Windows binaries can be found on windows.php.net/qa/. Thank you for helping us making PHP better. 20-Dec-2012 After a very successful 2012 edition, we are proud to announce PHPBenelux Conference 2013. This event will take place on Friday January 25th and Saturday January 26th 2013 in Antwerp, Belgium. We organize a community oriented conference that is built around an excellent lineup and awesome socials. Our schedule has been announced and tickets are available. Go to http://conference.phpbenelux.eu/2013/ for more information. 20-Dec-2012 The PHP development team announces the immediate availability of PHP 5.4.10 and PHP 5.3.20. These releases fix about 15 bugs. Please note that the PHP 5.3 series will enter an end of life cycle and receive only critical fixes as of March 2013. All users of PHP are encouraged to upgrade to PHP 5.4. For source downloads of PHP 5.4.10 and PHP 5.3.20 please visit our downloads page, Windows binaries can be found on windows.php.net/download/. The list of changes are recorded in the ChangeLog. 19-Dec-2012 We are pleased to announce that tek13 will be taking place this year again at it's traditional location in Chicago, IL. This year's dates are from May 14th - 17th, 2013. It will again be a 3-track conference with a focus on the community. The Call for Papers has been announced and will be running until January 15th, 2013. Conference registration will open on January 1st. We look forward to seeing many of you there this year!"
