["https://us2.php.net/manual/en/fiber.suspend.php"]
title = "PHP: Fiber::suspend - Manual"
description = """
Description
  
   public static Fiber::suspend(mixed $value = null): mixed

  
   Suspends execution of the current fiber. The value provided to this method will be returned from the call to
   Fiber::start(), Fiber::resume(), or
   Fiber::throw() that switched execution into the current fiber.
  
  
   When the fiber is resumed, this method returns the value provided to Fiber::resume().
   If the fiber is resumed using Fiber::throw(), the exception given to that method will be
   thrown from the call to this method.
  
  
   If this method is called from outside a fiber, a FiberError will be thrown."""
full_description = "Description public static Fiber::suspend(mixed $value = null): mixed Suspends execution of the current fiber. The value provided to this method will be returned from the call to Fiber::start(), Fiber::resume(), or Fiber::throw() that switched execution into the current fiber. When the fiber is resumed, this method returns the value provided to Fiber::resume(). If the fiber is resumed using Fiber::throw(), the exception given to that method will be thrown from the call to this method. If this method is called from outside a fiber, a FiberError will be thrown."
