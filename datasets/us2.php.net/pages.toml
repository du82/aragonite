["https://us2.php.net/manual/en/control-structures.match.php"]
title = "PHP: match - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "The match expression branches evaluation based on an identity check of a value. Similarly to a switch statement, a match expression has a subject expression that is compared against multiple alternatives. Unlike switch, it will evaluate to a value much like ternary expressions. Unlike switch, the comparison is an identity check (===) rather than a weak equality check (==). Match expressions are available as of PHP 8.0.0. Note: When a match expression is used as a standalone expression it must be terminated by a semicolon ;. As switch statements, match expressions are executed match arm by match arm. In the beginning, no code is executed. The conditional expressions are only evaluated if all previous conditional expressions failed to match the subject expression. Only the return expression corresponding to the matching conditional expression will be evaluated. For example: match expression arms may contain multiple expressions separated by a comma. That is a logical OR, and is a short-hand for multiple match arms with the same right-hand side. A special case is the default pattern. This pattern matches anything that wasn't previously matched. For example: A match expression must be exhaustive. If the subject expression is not handled by any match arm an UnhandledMatchError is thrown. It is possible to use a match expression to handle non-identity conditional cases by using true as the subject expression."
year_published = 2025
