full_description = "Refer to external platform specific documentation for enabling operating system DTrace support. For example, on Oracle Linux boot a UEK3 kernel and do: Instead of using chmod, you could instead use an ACL package rule to limit device access to a specific user. This makes the static probes available in core PHP. Any PHP extensions that provide their own probes should be built separately as shared extensions. If the Apache web server is running, the module name might be, for example, libphp5.so, and there would be multiple blocks of listings, one per running Apache process. The Function column refers to PHP's internal C implementation function names where each provider is located. This script uses the -Z option to dtrace, allowing it to be run when there is no PHP process executing. If this option were omitted the script would immediately terminate because it knows none of the probes to be monitored are in existence. The script traces all core PHP static probe points throughout the duration of a running PHP script. Run the D script: Run a PHP script or application. The monitoring D script will output each probe's arguments as it fires. On multi-CPU machines the probe ordering might not appear to be sequential. This depends on which CPU was processing the probes, and how threads migrate across CPUs. Displaying probe time stamps will help reduce confusion, for example:"
