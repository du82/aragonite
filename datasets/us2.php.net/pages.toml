title = "PHP: Socket context options - Manual"
description = "PHP is a popular general-purpose scripting language that powers everything from your blog to the most popular websites in the world."
full_description = "Description Socket context options are available for all wrappers that work over sockets, like tcp, http and ftp. Socket context options are available for all wrappers that work over sockets, like tcp, http and ftp. Used to specify the IP address (either IPv4 or IPv6) and/or the port number that PHP will use to access the network. The syntax is ip:port for IPv4 addresses, and [ip]:port for IPv6 addresses. Setting the IP or the port to 0 will let the system choose the IP and/or port. As FTP creates two socket connections during normal operation, the port number cannot be specified using this option. This is important in particular when trying to listen on IPv4 addresses separately while there exists a binding on [::]. Setting this option to true will set SOL_TCP,NO_DELAY=1 appropriately, thus disabling the TCP Nagle algorithm."
