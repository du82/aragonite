full_description = "Strategic Email for Authors with Brennan DunnBrennan's personal playbook for using email to drive his book launchIf you’ve ever searched for how to use email in a strategic, authentic, high-value way, you’ve ended up finding something written by Brennan Dunn that blew everyone else’s advice out of the water.In this Nonfiction Authors Community Q&A, we touch on what most folks get wrong about marketing their creative work, how to do it better, and how he plans to prepare for and launch his own upcoming book. Plus, plenty of time for audience questions.Timestamps & topics0:00 Welcome0:40 Strategic email and author platforms4:13 Helping readers to ACT5:23 The three touchpoints of personalization6:22 From broadcast to dialogue9:00 Evergreen onboarding for new subscribers10:54 Three crucial tools11:23 Spam, deliverability, and replies13:25 How much to give away, what to charge for15:29 Pricing power, courses, and upsells18:34 Time efficiency by turning replies into content19:54 On lead magnets, promotion, and friction20:58 The point and power of personalization22:41 Closing & thanks23:13 Throwing dice in international watersReady to start your own writing journey? Join the Useful Books Academy and learn how to create a book so useful that readers can't help but recommend it. Hit the ground running with a six week video course and continue to grow with full access to the Community and Help This Book.Enroll NowByRob FitzpatrickFiledResourcesInterviewPublished30 October 2021"
