full_description = '''Get startedRead the bookCatalogResourcesSupportSign inJoin nowJoin now — $30/monthHit the ground running with an in-depth, six-week video course, then stay on track with a year's free access to the Useful Books Community and Help This Book, our modern beta reading software.AcademyAcademyWrite a book that outgrows you.Instead of betting on either marketing, luck, or fame, this course helps you follow the path of craft: to create a book so useful that readers can’t help but recommend it.You’ll learn to build your book as if it were any other product, iteratively improving and debugging it — even before it has been written — by using real data from real readers. This means embracing some potentially scary activities — like beginning beta reading while you know the book still has some problems — and requires doing a bit of seed marketing to get things started. But after that, marketing will become more of an option than an obligation, and your book will continue to grow. Useful Books Academy6 week, self-paced course60+ video lessonsDigital copy of Write Useful BooksAnd inludes 1 year of membership for free:1 year of Help This Book1 year of Useful Books CommunityJoin the academy — $495About the course About the courseLearn who this course is for, and how it helps you write better non-fictionWatch lesson 1 Start learningDive right in with lesson one — The goal: A book that sells itselfGet the next three lessons Continue learningSign up with your email and receive the next three lessons for freeEach module focuses on mastery over a crucial book-killing blunder.Throughout the course, we’ll cover all major tools and techniques of writing a useful book, including plenty of worked examples and actionable next steps. Dive right into lesson 1 for free, right now.Module 1: Crucial foundationsView lessonsDesigning for recommendability: promise, problem, and ideal reader.1.1 — The goal: A book that sells itself1.2 — A useful book is a problem-solving product1.3 — Title, subtitle, and cover set the promise1.4 — The process: Better feedback, better book1.5 — Cautionary: All the stuff that doesn't matter (yet)1.6 — The 3 crucial habits (and teasing out the resistance)1.7 — Case study: The Mom Test's path to 200,000 copies1.8 — Workshop: Putting the promise on the coverModule 2: How recommendations really workHide lessonsModule 3: What keeps a reader readingHide lessonsModule 4: Faster better feedbackHide lessonsModule 5: The 80/20 solution to showing your work (and finding your fans)Hide lessonsModule 6: Continuing to the finish lineHide lessonsWhat our students say about Useful Books Academy.On the academyI almost didn't take the course because I thought, well, I'm a pretty good writer. I know what I'm going to write […] But I went ahead and took the course and it was so good […] took it from just a great book that nobody wants to a great book that people are recommending and my beta readers are telling me they can't wait for it to get out in the world, and can't wait to recommend it to other people.Dave WernliAuthor of Stewarding Wounded Hearts <img loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2F30fea08f-6b79-444a-a336-9fc250b0bb2d%2FLxGq%2Fdave.png%3FlastEdited%3D2024-07-24T15%3A39%3A00.000Z&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2F30fea08f-6b79-444a-a336-9fc250b0bb2d%2FLxGq%2Fdave.png%3FlastEdited%3D2024-07-24T15%3A39%3A00.000Z&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2F30fea08f-6b79-444a-a336-9fc250b0bb2d%2FLxGq%2Fdave.png%3FlastEdited%3D2024-07-24T15%3A39%3A00.000Z&amp;w=828&amp;q=75 828w, /_