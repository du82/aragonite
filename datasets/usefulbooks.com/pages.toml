full_description = "Get startedRead the bookCatalogResourcesSupportSign inJoin nowJoin now — $30/monthBusinessCommunityHelp This BookWrite Useful BooksCatalogMake It CountAlex MerryTHE BOOK YOU WISH YOU'D READ BEFORE YOUR LAST PRESENTATION...There comes a point in your career where the presentations you're being asked to deliver are too important to just get through. Whether you're presenting to management, senior leadership, the board, your investors, your boss, the whole company - whoever it is, when stakes are high, you need to make it count.The problem is, you've got to where you are by walking the walk, not by talking it. And until you have learned to bring high-stakes presenting into your comfort zone you will miss out on the opportunity to influence and impress the people that matter.In Make It Count, Alex Merry will show you how to do exactly that. You'll learn how to communicate your message clearly and concisely, how to structure a presentation for impact, how to connect with your audience, and how to deliver presentations with confidence.Alex is a former COO turned public speaking coach who has spent the last 15 years refining the art of delivering highly effective business presentations. He learned how to present out of necessity, not out of love of the limelight. Now he works with fast-growing start-ups and corporate juggernauts to help their leaders deliver presentations worth listening to.Get the bookhello@usefulbooks.com© Useful Books LimitedDive inEnroll in Useful Books AcademyJoin the CommunityRead Write Useful BooksAbout usFAQPrivacy policyTs & Cs"
