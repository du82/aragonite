full_description = "Get startedRead the bookCatalogResourcesSupportSign inJoin nowJoin now — $30/monthEducationHelp This BookCatalogWrite Useful BooksRob FitzpatrickWriting a nonfiction book is a wonderful project, allowing you to preserve & share the most important things you’ve ever learned. Plus, a successful book will improve your reputation, your career, your earnings, & the lives of your readers.Up until fairly recently, it was possible to receive at least some of these benefits by writing any book, regardless of its quality. But today, a million new titles are published per year and it’s no longer enough to simply join the pile. Instead, you must create something that is able to stand out & succeed. And the most reliable path toward that goal — especially for an unproven author who lacks a pre-existing audience — is to write a book so startlingly useful that readers can’t stop talking about it.This guide proposes a different way of planning, writing, & refining nonfiction, drawn from the hard-won lessons of product designers & entrepreneurs. Applied properly, it leads to books that can grow organically via reader recommendations for many years, without relying on either heavy marketing or a large author platform.Get the bookhello@usefulbooks.com© Useful Books LimitedDive inEnroll in Useful Books AcademyJoin the CommunityRead Write Useful BooksAbout usFAQPrivacy policyTs & Cs"
