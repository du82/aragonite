full_description = '''Get startedRead the bookCatalogResourcesSupportSign inJoin nowJoin now — $30/monthImmediately practical, eminently insightful, tried and tested, Fitzpatrick has written a book worth its weight in gold.Write Useful Books is the definitive guide for the next generation of bestselling nonfiction authors.Nir Eyal, bestselling author of Hooked and Indistractable.Buy on AmazonIf you want your book to thrive, you need a better process.Rob's first two nonfiction titles have grown organically to reach more than 100k happy readers and are now generating $160k per year in royalties. All with nearly zero active marketing. This is due to how the books were built.The process for building useful nonfiction is iterative, data-driven, and reader-centric. It's the polar opposite of the standard gamble of “plan, polish, publish, and pray.”This guide contains everything Rob knows about how to design, test, and refine nonfiction that is able to endure for years, get recommended, and grow on its own. Whether you're aiming for royalties, reputation, reach, or impact, this guide can help you get there.What authors are sayingOn processWrite Useful Books is an incredibly useful book. With Rob’s lessons, I was able to write my own bestseller, and I kept referring back to it, underlining and highlighting, throughout the process. If you’re thinking of writing a book, I cannot recommend Useful Books highly enough.Matt LernerAuthor of Growth Levers <img loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2Fbe9734ba-eed6-486b-beef-a962bcec9813%2FLxGq%2Fmatt-lerner-book-website.webp%3FlastEdited%3D2024-07-06T11%3A30%3A00.000Z&amp;w=640&amp;q=75 640w, /_next/image?url=ht