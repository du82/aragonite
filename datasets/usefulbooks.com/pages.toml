%2Fcms-asset%2Fpage%2F5ba0325b-7744-4919-918a-7c4e4091123e%2FLxGq%2Fece0c091-6bde-49e2-8abe-c3ef100ab4bf.jpg%3FlastEdited%3D2024-07-05T10%3A09%3A00.000Z&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2F5ba0325b-7744-4919-918a-7c4e4091123e%2FLxGq%2Fece0c091-6bde-49e2-8abe-c3ef100ab4bf.jpg%3FlastEdited%3D2024-07-05T10%3A09%3A00.000Z&amp;w=3840&amp;q=75"/>On processEven if you aren’t currently planning to write a book, Write Useful Books is so helpful for thinking about the jobs-to-be-done of readers and for writing useful things. It was so helpful for writing my own book.Michele HansenAuthor of Deploy Empathy <img loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2Fa837b818-7186-4095-92ac-db2c5b11d971%2FLxGq%2F1pGSfk8u_400x400.jpg%3FlastEdited%3D2024-07-06T11%3A32%3A00.000Z&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2Fa837b818-7186-4095-92ac-db2c5b11d971%2FLxGq%2F1pGSfk8u_400x400.jpg%3FlastEdited%3D2024-07-06T11%3A32%3A00.000Z&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2Fa837b818-7186-4095-92ac-db2c5b11d971%2FLxGq%2F1pGSfk8u_400x400.jpg%3FlastEdited%3D2024-07-06T11%3A32%3A00.000Z&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2Fa837b818-7186-4095-92ac-db2c5b11d971%2FLxGq%2F1pGSfk8u_400x400.jpg%3FlastEdited%3D2024-07-06T11%3A32%3A00.000Z&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fusefulbooks.com%2Fapi%2Fcms-asset%2Fpage%2Fa837b818-7186-4095-92ac-db2c5b11d971%2FLxGq%2F1pGSfk8u_400x400.jpg%3FlastEdited%3D2024-07-06T11%3A32%3A00.000Z&amp