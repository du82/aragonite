full_description = "Jermey Matthews (Acquisitions Editor @ MIT Press)Tradpub nuance, popular science, market research vs. timing, and entrepreneurial authorsIn this Useful Books Community Q&A, we’re joined by Jermey Matthews, Acquisitions Editor at MIT Press (i.e., the person who decides whether an author gets a publishing deal).Jermey joined the MIT Press after working for nine years as industry reporter and book reviews editor for Physics Today magazine. He holds a bachelor’s degree in chemistry and a master’s and a PhD degree in chemical engineering.Jermey is now responsible for commissioning, acquiring, and publishing books on topics in the physical sciences, engineering, and mathematics. Jermey is also the co-founder of STEM Reads Book Club, formerly a subscription book box for children that is now being transformed into a community for educators, librarians, parents, creators, and anyone passionate about using stories to introduce STEM topics and STEM careers to young children.Timestamps & topics0:00 Hello!0:53 “Acquisitions editor”?1:58 Predicting a book’s success3:17 Entrepreneurial authors & reader communities5:01 Beta readers & peer review6:12 On mass-market math books7:23 Books for learning vs. books for doing8:10 Business model, profitability, & pricing10:38 Warning signs & exciting indicators13:52 Post-publication priorities15:35 Royalties, advances, & investing in an author16:44 Pitching a publisher vs. being recruited17:58 Researching (and timing) the market for a book20:13 Tradpub vs. indie publishing?21:20 Nuances of a publishing deal24:09 Learning more from JermeyReady to start your own writing journey? Join the Useful Books Academy and learn how to create a book so useful that readers can't help but recommend it. Hit the ground running with a six week video course and continue to grow with full access to the Community and Help This Book.Enroll NowByRob FitzpatrickFiledResourcesInterviewPublished12 November 2021"
