full_description = '''Launch Experiments with Jeff GothelfLessons learned from launching book 5: What worked and what didn’tFive-time author and sometime publisher Jeff Gothelf joins author Jurriaan Kamer to talk about launching his latest book, Who Does What By How Much?: A Practical Guide to Customer-Centric OKRs.Thanks Jurriaan for hosting! More on Jurriaan at his website.Topics & timestamps1:09 Jeff's experience as an author and publisher8:54 Going from working with traditional publisher to starting a publishing company11:22 Publishing a very short book as an experiment12:48 Jeff's OKRs for this book launch15:20 What drives people to buy books?18:08 What has worked, and what has failed?19:55 Building an email list and LinkedIn group of early readers22:00 Setting up podcast appearances22:45 "Cousin reviews"24:10 Interpreting the results since launch26:59 Launch year and recommendations27:50 Also experimenting with PR and paid advertisements28:28 More about PR30:17 Asking people to share and post about the book33:20 Never shut up about your book36:09 Make every post, email, and reminder valuable to build good will37:50 Offering bulk discounts and bonuses39:40 Handling fulfillment for bulk purchases42:06 What would you do differently next time?43:43 Beta reading44:56 Book launch parties45:35 Bulk purchase as part of conference speaker feeReady to start your own writing journey? Join the Useful Books Academy and learn how to create a book so useful that readers can't help but recommend it. Hit the ground running with a six week video course and continue to grow with full access to the Community and Help This Book.Enroll NowByUseful BooksFiledResourcesInterviewPublished12 September 2024'''
