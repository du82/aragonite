full_description = "Get startedRead the bookCatalogResourcesSupportSign inJoin nowJoin now — $30/monthBusinessCommunityHelp This BookWrite Useful BooksCatalogReframing MarketingSimon BatchelarA 3-step plan for effective and ethical marketing for coaches, consultants, solopreneurs, freelancers, mentors, and thought leaders.What does your marketing say about you?More than you think. Before someone gets to know you as a client, they see you through your marketing. High-pressure sales, relentless ads and complicated funnels rely on fear and manipulation. Is this how you want to start a client relationship?Marketing advice for big brands or ecommerce doesn’t work for coaches, consultants or freelancers. Tactics, pressure and persuasion rarely attract good clients. When you’re marketing yourself and your work, your marketing is a reflection of you.There is another way. Marketing can be both ethical and effective. It’s time to reframe your marketing.This book is a practical guide for people who run their own businesses. The 3-step plan will give you clarity about who you want to work with, what value you can offer them and why they can trust you to deliver it.Reframing Marketing is an alternative to ego-driven bulldozer marketing – no more slick tactics, get-rich-quick schemes or high-pressure sales pitches. This book is about ethical marketing that is manageable and connects you with clients who are ready to say yes.I don’t believe in tick-box lists or quick fixes that work for everyone, every time – marketing is more personal than that.This book takes you step by step through creating your own effective and ethical personal marketing plan.Get the bookhello@usefulbooks.com© Useful Books LimitedDive inEnroll in Useful Books AcademyJoin the CommunityRead Write Useful BooksAbout usFAQPrivacy policyTs & Cs"
