["https://usefulparentingadvice.com/how-to-praise-a-child-with-words"]
title = "How To Praise A Child With Words - UPA"
description = "Words of praise play an essential role in guiding a child’s development. However, not all forms of praise are beneficial. So, let’s explore four critical tips for how to praise a child with words."
full_description = "Parenting Advice How To Praise A Child With Words May 10, 2022Rick Kettner7 min read Subscribe TwitterLinkedInFacebookEmail Words of praise play an essential role in guiding a child’s development. However, not all forms of praise are beneficial. In fact, some common approaches are even harmful despite the good intentions behind them. The right kind of praise can help a child adopt positive behaviors, take on bigger challenges, and unlock their full potential in life. However, the wrong kind of praise can encourage them to avoid difficult tasks, quit when the going gets tough, and even cheat to get a desired result. So, let’s explore four critical tips for how to praise a child with words. 1. Praise The Process, Not The Result It’s often tempting to praise a child for specific achievements, such as receiving a good grade, winning a competition, or completing a goal. After all, these kinds of outcomes provide clear and tangible evidence of success that we want to encourage. Unfortunately, results are not an accurate measurement of a child’s effort or growth. Some achievements are easy, while others are far more challenging. Thus, parents that praise outcomes can unintentionally incentivize their children to select easier goals while avoiding challenges that require extra effort. A better approach is to praise the effort or process that led to success. Thus, when a milestone has been reached, identify specific actions that contributed to the result. Then, offer up praise that reinforces the behaviors that are likely to contribute to further achievements in the future. For example, you might say, “you worked hard to prepare for the tournament, and it shows!” or “you studied hard for that test, and it paid off!” One important caveat is that such praise should be reserved for situations where real learning or growth has occurred. We should never be content with effort that is failing to produce results. Instead, we should find out why such effort isn’t working and help children discover alternative strategies that may work better. Rather than praising kids for ineffective effort, social psychologist Carol Dweck recommends saying, “I like the effort you put in, but it looks like that method didn’t work. Let’s try another way.” Then, once they discover how to achieve a meaningful milestone or outcome, praise the effort and persistence that led to that success. 2. Avoid Praising Intelligence or Speed A common mistake that adults make is praising kids for fixed traits, such as being smart, clever, or talented. This often includes praise for the speed at which they learn something new or complete an assignment. For example, a parent might say, “wow, you are so smart! You learned that very quickly!” On the surface, this seems positive. After all, it feels nice to be told you’re smart or talented. However, this kind of praise can lead to unintended consequences. The act of labeling a child with fixed traits can cause them to develop a fixed mindset, as defined by Carol Dweck in her book Mindset. When that happens, kids start to think of their abilities and level of intelligence as largely set in stone. In other words, they view being “smart” or “talented” as a trait people either have or they don’t. This becomes a real problem when they inevitably face challenges or setbacks. That’s because a fixed mindset causes them to assume they lack the skills or intelligence to overcome difficulties. After all, if learning quickly means they’re smart or talented, what should they assume about themselves when they are learning slowly or struggling? Over time, children with a fixed mindset become incentivized to avoid challenging situations. So, for example, if something starts to feel difficult, they’re more likely to quit, feign disinterest, or stop making an effort. That way, they can avoid confirming to themselves or others that they aren’t as smart as people once thought. A better approach is to return to praising the effort or process that led to success. For example, instead of saying, “you’re talented,” you might say, “your practice time is really paying off!” or “It must feel great to be rewarded for all your hard work!” This kind of praise fosters a growth mindset in children. Rather than seeing their abilities as fixed, they understand they can learn and grow through hard work and persistence. Naturally, they still experience many difficulties, but instead of feeling permanently stuck, they view setbacks as temporary challenges to be overcome. Now, in situations where a child learns something quickly without investing effort, the best solution is to briefly apologize for not challenging them and then find a more worthy task. For example, you might say, “Sorry, I guess that was too easy. Let’s find something more challenging, so you can continue to learn and grow!” 3. Highlight Specific Actions Or Behaviors Fortunately, praise doesn’t have to be bland or generic to be effective. In fact, the most powerful form of praise is that which highlights specific things a child is doing well, as described in How To Talk So Kids Will Listen by Adele Faber and Elaine Mazlish. For example, you might say things like, “I love that you’re always trying new things,” “I admire how you kept playing hard all game, even though your team was behind,” or “I like how you’re always looking to make smart passes to your teammates.” Such feedback is influential for two distinct reasons. First, it shows that you really care about what they’re doing and how they’re doing it. Second, it highlights specific actions or behaviors that you want to see repeated in the future. Consider how it feels to receive a generic compliment, such as “great job!” versus someone saying, “I admire your attention to detail and your ability to take initiative!” The latter is far more rewarding and more likely to inspire continued effort. The key to providing detailed praise, of course, is to pay close attention to what your children are doing. That way, you can identify actions or behaviors that are beneficial. For example, things they are doing well or things that might lead to further progress. 4. Avoid The Use Of ‘Fake Praise’ It can be tempting to use praise as a tool to prompt or encourage behavior that isn’t yet taking place. For example, a parent might say, “I like how you’re committed to finishing your homework,” even when a child is not living up to the praise. This kind of fake praise is often used in a sincere yet misguided attempt to motivate kids to take a desired action. However, praise is most effective as a tool for reinforcing behaviors that children are already doing. In contrast, fake praise comes across as insincere, manipulative, or just plain confusing. As powerful as praise can be, it’s the wrong tool for promoting a new behavior. Instead, we must find other ways to encourage our children to adopt new behaviors, and then use appropriate praise to reinforce successful results. To that end, I will soon be publishing a short guide on how to get kids to do chores, homework, or almost anything else. If you’re interested in learning more about helping kids start a new behavior, be sure to subscribe to the Helpful Parenting Advice channel on YouTube, so you don’t miss that video when it’s released. Rick Kettner Rick is an avid reader and lifelong entrepreneur. He co-founded popular online music education platforms including Drumeo, Pianote, and Guitareo. He now spends much of his time sharing tips on business strategy, marketing, and entrepreneurship. View all posts You may also like Parenting Advice The 7 Best Alternatives To Punishing A Child November 25, 20227 min read Parenting Advice 7 Reasons Why Kids Have Temper Tantrums And How To Avoid Them November 4, 20228 min read Parenting Advice How To Help Children Learn Faster And Smarter – 7 Tips! July 3, 202212 min read #ezw_tco-5 .ez-toc-widget-container ul.ez-toc-list li.active{ background-color: #ededed; } Table Of Contents 1. Praise The Process, Not The Result2. Avoid Praising Intelligence or Speed3. Highlight Specific Actions Or Behaviors4. Avoid The Use Of ‘Fake Praise’"
