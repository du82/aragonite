title = "How To Talk So Kids Will Listen And Listen So Kids Will Talk - Book Summary - UPA"
description = "Learn how to communicate with children more effectively in this How To Talk So Kids Will Listen and Listen So Kids Will Talk by Adele Faber and Elaine Mazlish book summary and review."
full_description = "Book Summaries How To Talk So Kids Will Listen And Listen So Kids Will Talk – Book Summary September 2, 2022Rick Kettner24 min read Subscribe TwitterLinkedInFacebookEmail Being a parent isn’t easy. Children are prone to experiencing negative feelings, sudden mood swings, and even temper tantrums. As a result, it can be challenging to respond to their needs while managing our own emotions. How To Talk So Kids Will Listen And Listen So Kids Will Talk by Adele Faber and Elaine Mazlish is about how to communicate with children more effectively. It explains how to address a child’s feelings, engage cooperation, and resolve conflicts. Plus, it tackles related topics, including alternatives to punishments, offering praise, and preventing children from falling into predefined roles. So, let’s explore the six key insights covered in the book. 1. Helping Children Deal With Their Feelings Parents often reject their children’s feelings by saying things like: “you don’t really feel that way”, “you’re just saying that because you’re tired”, or “there’s no reason to be so upset.” Yet, denial of personal feelings can confuse and further agitate kids. It can also teach them not to trust their feelings. When we are upset, as adults, the last thing we want is advice, denial of our feelings, or pity. Those kinds of responses only make us feel worse. What we really need is someone to acknowledge our pain and give us a chance to talk more about what is troubling us. The same is true of our children. Here are four ways to help children deal with their feelings: 1. Listen With Full Attention It’s discouraging to talk to someone who is distracted or only half listening. It’s much easier to share your troubles with a parent who is giving their full attention. Often silent sympathy is all a child needs to work through their feelings. 2. Acknowledge Their Feelings With A Word It’s hard for a child to think constructively when someone is questioning, blaming, or advising them. A better approach is to acknowledge their feelings by saying, “oh…”, “mmm…”, or “I see.” Words like these, coupled with a caring attitude, help a child explore her own thoughts and feelings, and possibly come up with solutions. Note: Children don’t need to have their feelings agreed with; they only need to have them acknowledged. 3. Give Their Feelings A Name Children are deeply comforted by hearing words that accurately describe what they’re experiencing. Look beyond what a child is saying to identify what they may be feeling. Then, identify a word or two that describes their feelings and come up with a statement to show the child that you understand them. Some examples include: “Boy, you sound angry!”, “That must have been disappointing”, “Hmm, you seem to be having doubts about going to the party”, “Sounds as if you really resent all that homework”, or “That sounds frustrating!” 4. Give Them Their Wishes In Fantasy Sometimes just having someone understand how much you want something makes reality easier to bear. When a child demands something that you can’t provide, share your desire to meet their needs rather than explaining why you cannot. Examples include: “I wish I could make the banana ripe for you right now”, “I sure wish I had the magical power to make a giant box of your favorite cereal appear”, or “I wish you could just stay up all night and play with your new toys.” Other Helpful Tips For Managing Feelings It’s much more helpful for a child to hear, “I see something is making you sad,” than to be interrogated with questions such as, “What happened?” or “Why do you feel that way?” So, aim to recognize and acknowledge their feelings right away. Avoid using generic language such as “I understand how you feel” because some children won’t believe you. They’ll answer, “No, you don’t.” But, if you specify what they are experiencing, they will know you really do understand. Of course, there are situations where you must set clear boundaries. For example, if a child is upset and being physical with a sibling, you might say: “I can see you are angry at your brother. Tell him what you want with words, not fists.” 2. Engaging Cooperation One of the frustrations of parenthood is the daily struggle to get children to behave in ways that are acceptable to us and to society. We seek some semblance of order, cleanliness, courtesy, and routine. Yet, children often don’t care about such things. In an effort to get kids to cooperate, parents often resort to blaming, warning, threats, name-calling, lecturing, making comparisons, or using sarcasm. However, these short-sighted approaches often hurt a child’s sense of self-esteem and leave them with negative feelings. Fortunately, there are five skills that are more effective for engaging cooperation. Not every option will work with every child, and none will be effective 100% of the time, but they help foster a climate of mutual respect. 1. Describe It’s hard to do what needs to be done when feedback feels personal. It’s easier to concentrate on the problem when someone just describes it. When grown-ups point out a problem, it gives children a chance to tell themselves what to do. For example, instead of placing blame by saying, “You left a wet towel on my bed,” describe what you see, “There’s a wet towel on the bed.” Likewise, instead of telling a child, “your bedroom is a mess,” consider saying, “I see a messy room.” 2. Give Information It’s much easier to accept information than an accusation. When children are given clear information, they can usually figure out what needs to be done. So, if a child doesn’t understand the problem, look for ways to add information. For example, you might say, “The towel is getting my blanket wet”, “Couches are for sitting, not jumping”, or “Loud noises can wake up a sleeping baby.” 3. Say It With A Word Children dislike hearing lectures, sermons, or lengthy explanations. For them, the shorter the reminder, the better. Therefore, look for opportunities to get your message across with just a word. For example, if a child is heading out the door without his lunch, you might say, “Jamie, your lunch!” Likewise, if a wet towel was left where it shouldn’t be, you might say, “Sam, the towel!” This approach gives the child a chance to exercise his own intelligence and initiative. When he hears you say, “The towel,” he has to think, “What about the towel? … oh, yeah, I didn’t put it away . . . I guess I’d better do that now.” 4. Talk About Your Feelings Children are entitled to hear their parents’ honest feelings. By describing what we feel, we can be genuine without being hurtful. It’s easier for a child to cooperate with someone who is expressing irritation or anger so long as they aren’t feeling attached to it. So, instead of saying “you make me feel…”, simply say “I feel…” Examples include: ‘I’m feeling frustrated right now’, ‘I don’t like sleeping in a wet bed!’, or ‘I feel upset when loud noises wake up the baby.’ 5. Write A Note Sometimes nothing we say is as effective as the written word. Most children love receiving notes—both those who can read and those who can’t. If they cannot read, they’re often interested in having the words read and explained to them. Notes can be placed on a bedside table, or they can be attached to relevant triggers. For example, a note saying “please hang your towel so it will dry” can be placed above the towel rack. Likewise, a reminder saying “please finish all homework before watching television” can be taped to the TV remote. Combine Multiple Strategies Each of these strategies can be used individually or in combination. For example, you might start out by saying, “The towel there is getting my blanket wet.” You could then add information by saying, “Wet towels belong in the bathroom.” If the child isn’t listening, you might increase the volume while adding, “Jill, the towel!” And, if she still doesn’t budge, you can get louder still while saying, “Jill, I don’t want to have to sleep in a cold, wet bed all night!” Alternatively, you might consider saving your voice by dropping a note on her bedside table saying, “Wet towels on my bed make me see red!” If you’re really upset, you might even tell her, “I don’t like being ignored. I’m putting away your wet towel, and now you have an upset mother!” Other Helpful Tips For Engaging Cooperation The attitude behind your words is as important as the words themselves. The sentiment that children thrive on is one that communicates, “You’re basically a lovable, capable person. Right now, there’s a problem that needs attention. Once you’re aware of it, you’ll probably respond responsibly.” The attitude that defeats children is one that communicates, “You’re basically irritating and inept. You’re always doing something wrong, and this latest incident is even more proof of your wrongness.” Note: Avoid using the word “please” when you’re upset. We say “please” to model a socially acceptable way to make a small request. But this is appropriate in relaxed environments. When you want something done right away, it’s a good idea to speak forcefully rather than plead. For example, you might use a loud, firm voice to explain, “Sofas are not for jumping on!” 3. Alternatives to Punishments Parents turn to punishments for a variety of reasons. Here are some examples quoted in the book: “if you don’t punish them, kids will try to get away with murder”, “sometimes I get so frustrated, I don’t know what else to do”, or “how will my child learn that what he did was wrong and not to do it again if I don’t punish him?” The problem with punishments is they don’t work. Instead of the child feeling sorry or thinking about how to make amends, he becomes preoccupied with revenge fantasies. Thus, punishing a child deprives him of the crucial inner process of facing his own misbehavior. Fortunately, there are seven alternatives to punishments. 1. Point Out A Way To Be Helpful Children like to be helpful when given the opportunity. Therefore, when a child is acting out, consider identifying ways in which they could be helpful. For example, if they are being difficult during a grocery shopping trip, you could ask them to pick out apples or oranges while browsing the produce section. 2. Express Strong Disapproval (Without Attacking Character) When necessary, express your feelings strongly without making it about the child. For example, you might say, “I’m furious that my new saw was left outside to rust in the rain!” or “I don’t like what’s going on! It’s disturbing to shoppers when children are running in the aisles!” 3. State Your Expectations Clarify how you expect their future behavior to change. For example, you could say, “I expect when my tools are borrowed that they will be returned promptly and in good condition!” or “I expect a calm and relaxed atmosphere when shopping.” 4. Show The Child How To Make Amends Whenever possible, along with our disapproval, we should point out how a child can make amends. After his initial remorse, the child needs a chance to restore good feelings about himself and to see himself as a respected, responsible family member once again. Instead of offering a punishment, provide an opportunity for the child to make up for his misbehavior. For example, if he left a saw out in the rain to rust, you might say, “what this saw needs now is a little steel wool and a lot of elbow grease.” Note: Some children use “I’m sorry” as a way to placate an angry parent. They’re quick to apologize and just as quick to repeat their misbehavior. Repeat-offenders can be told: “sorry means behaving differently” or “I’m glad to hear you’re sorry. That’s the first step. The second step is to ask yourself what can be done about it.” 5. Offer A Choice Another option is to offer a choice. For example, if a child is running around a grocery store, you might say, “You can walk or you can sit in the cart. Which do you prefer?” Likewise, if they borrow tools without returning them, you might say, “You can use my tools if you return them or you can give up the privilege, you decide.” 6. Natural Consequences If the child continues to misbehave, then it’s time to take action. For example, if the child continues to run around the grocery store after being given an option to walk or sit in the cart, you might say, “I see you decided to sit in the cart.” Likewise, if a child borrows tools without returning them, it’s time to place a lock on the toolbox. Critically, this step should not involve lecturing or moralizing. Instead, it should simply convey the natural consequences of their actions or misbehavior. 7. Problem Solve When a problem persists, it’s usually safe to assume it’s more complex than it originally appeared. In such situations, it’s important to engage in problem-solving. Here are the five steps to work through with your child: Talk about the child’s feelings and needs. Don’t rush this step. Let your attitude be: “I’m really trying to get clear on how you feel about this.” Only when the child feels heard will she be able to consider your feelings.Talk about your feelings and needs. Keep this part short and clear. It’s hard for a child to listen to a parent who goes on and on about worry, anger, or resentment.Brainstorm together to find a mutually agreeable solution. If possible, let the child come up with the first few ideas. Refrain from evaluating or commenting on them. All ideas should be welcome.Write down all ideas—without evaluating them. Just make a complete list so the child sees that all of their suggestions are being taken seriously.Decide which suggestions you like, which you don’t like, and which you plan to follow through on. Avoid rejecting any ideas. Instead, describe your personal reactions: “I wouldn’t be comfortable with that because…” or “That sounds like something I could do.” In the case of the missing tools, you might start out by saying, “What can we work out so that you can use my tools when you need them and so that I can be sure they’re there when I need them?” Then, work through the process to come up with a solution that works for you and your child. 4. Encouraging Autonomy One of our most crucial goals as parents is to help our children develop into independent individuals. That way, they will be able to function on their own when they eventually move out. So, let’s explore five ways to encourage autonomy. 1. Let Children Make Choices Each small choice that a child makes is a chance to exert some control over his or her life. Thus, it’s important to look for opportunities to provide them with options. For example, when crossing a street, a father might ask, “Do you want to hold onto Mommy’s hand or my hand?” This can be taken a step further by adding, “…or maybe you have another option that is safe?” The child may ask to hold onto the baby’s stroller as an alternative. 2. Show Respect For A Child’s Struggle Parents used to believe that telling a child something is “easy” was a great way to provide encouragement."
