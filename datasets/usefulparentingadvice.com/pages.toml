title = "How To Get Kids To Do Chores, Homework, Or Anything Else - UPA"
description = "One challenge every parent must face is teaching kids responsibilities. So, let’s explore five powerful tips on how to effectively get kids to do chores, homework, or anything else."
full_description = "Parenting Advice How To Get Kids To Do Chores, Homework, Or Anything Else May 25, 2022Rick Kettner13 min read Subscribe TwitterLinkedInFacebookEmail One of the challenges every parent must face is teaching kids to manage their personal responsibilities, including doing chores and completing homework. Unfortunately, it’s often tempting to resort to short-term solutions, such as pleading, demanding, or even bribing kids to take action. However, these approaches only tend to make things more difficult over the long term, and they risk damaging the relationship, trust, and influence you have with your kids. So, let’s explore five powerful tips on how to teach kids more effectively to do chores, homework, and other important activities. 1. Turn Responsibilities Into Predictable Routines Before solving a problem, it’s helpful to start at the end by clarifying our desired outcome. That way, we can ensure we’re working towards an effective solution. In this case, the goal is to have our children manage their household responsibilities independently. We don’t want to have to remind them to do things or always take time to keep them accountable. Otherwise, they will continue to depend on our oversight and may even struggle when they eventually move out on their own. The solution is to turn our children’s responsibilities into automatic habits. This involves converting haphazard or random tasks into more predictable routines, just like waking up, brushing one’s teeth, or eating breakfast. That way, children no longer view chores or homework as things to “fit into the day” but rather as consistent parts of their normal, automatic routine. The challenge, of course, is that establishing new habits can be difficult. Even as adults, there are plenty of things we want to do that we fail to follow through on, such as starting an exercise or reading habit. Fortunately, there are proven strategies for turning almost any chore or activity into an automatic routine. The first step is to recognize the value of doing so. That way, we will be willing to put in the time and effort required to make it happen. 2. Understand The Basics Of Behavioral Change Before we can help our kids build new habits, we must understand the three factors that drive all behavioral change: motivation, ability, and a prompt. Each of these elements must be present for a new behavior to take place, according to renowned social scientist BJ Fogg. They’re the core building blocks behind everything we do, including casual activities like watching television, browsing social media, or cooking dinner. If any of the three factors are missing, we will not engage in the relevant behavior. So, let’s quickly explore all three elements more closely. The first is motivation. We must have a reason to take action. For example, we may be motivated by fun, enjoyment, pleasure, acceptance, praise, satisfaction, hope, or an increase in freedom. We may also be driven by a chance to reduce negative outcomes, including pain, fear, rejection, boredom, or a loss of control. Next is ability. We must have what it takes to engage in the habit or behavior. This might include having enough time, money, strength, knowledge, confidence, or experience. Critically, the easier it is to do something, the more likely we will do it. Finally, every behavior requires a prompt. We must have some kind of nudge or reminder to get us to take action. In some cases, this may involve an internal trigger, such as a feeling of hunger, loneliness, or exhaustion. In other cases, we might require an external trigger, such as an alarm, a reminder from a friend, or a linked activity. These three elements form the Fogg Behavioral Model, “B=MAP” or “behavior = motivation, ability, and a prompt.” Many parents intuitively understand the importance of motivation, but they tend to fall into a pattern of relying on just one or two strategies. For example, they may bribe their child with a reward or threaten them with a punishment. However, parents that take the time to understand the power of the Fogg Behavioral Model have many more tools available at their disposal. This is especially true when they appreciate the crucial relationship between motivation and ability. 3. How To Help Kids Establish A New Chore When a task is easy, it requires very little motivation to get someone to do it. Furthermore, as someone repeats a new behavior, their ability to engage in that activity increases, enabling them to take on greater responsibility over time. Therefore, the most reliable strategy for establishing a new routine is starting very small and focusing on consistency. In practice, this involves identifying the gap between someone’s existing behavior and the desired behavior. Then, selecting a small change to subtly shift their routine a little bit closer to the desired behavior. For example, let’s say that you want your kids to rinse off their dishes and put them into the dishwasher after every meal. Furthermore, let’s say that their current behavior is to leave the table without making any effort to clean up. In such a case, you might start with a small, simple request such as, “when you get up from the table, can you please put your dishes in the sink?” Then, each time they do so, reinforce the behavior by saying something like, “thank you for helping with the dishes!” or “I appreciate your help clearing the table!” Now, if you’re used to telling your kids exactly what to do and when to do it, this may seem wildly inefficient. After all, the dishes are now in the sink, they didn’t get rinsed off, nor did they make it to the dishwasher. Furthermore, it may take several days, or even weeks, before your kids are consistently taking this first small step. However, let’s quickly break down why this method is so effective. Firstly, we established a clear prompt by linking the behavior to the moment kids get up from the table. Second, we started with a simple request that requires very little ability or motivation. Finally, we reinforced the change with an appropriate level of praise. This process lays a solid foundation for a reliable, consistent habit. The resulting behavior will soon become automatic. The initial praise used to reinforce the routine quickly becomes optional as the habit takes hold. And most important of all, we can build on this foundation to establish a more robust and useful routine. Once kids consistently incorporate the new habit, you can follow up with another small change. For example, you might say, “when you take your dishes to the sink, can you please take a moment to rinse them off?” Once again, you can reinforce the new change by offering up an appropriate level of praise when they complete the desired behavior. For example, by saying, “thank you for rinsing off your dishes” or “I appreciate how helpful you’ve become!” To be clear, with each change, you may need to remind kids for a short period of time. Furthermore, if they do a poor job, you may need to provide further guidance, such as showing them how to use a cleaning sponge to wipe their dishes off. Once again, the focus is on taking small steps consistently. That way, their ability steadily increases, even as their need for motivation or praise decreases. The next natural step would be to ask them to place their dishes directly into the dishwasher after rinsing them. Sometimes, kids may even take this last step on their own out of a desire to show how helpful they can be. You can increase the odds of this by subtly modeling the behavior when clearing your own dishes from the table. Just remember, there are three important things to keep in mind when introducing new steps. First, don’t make a change until the existing routine is consistent. Second, be sure that each new step remains small and easy to do. Third, reinforce each new change with casual, appropriate praise after they have taken the new step. 4. How To Help Kids Build A Homework Routine One of the challenges with homework is that it’s less predictable than other chores. A child may have more or less to do on any given day. Furthermore, unlike many other habits, it’s not appropriate to build a homework routine by starting with only part of the task because kids are expected to complete all of their homework each day. Fortunately, we can still make things easier by considering the factors outlined in the Fogg Behavioral Model. Again, these include motivation, ability, and a prompt. A quick way to bring order to the chaos is to establish a predictable time and place for children to complete their homework. While duration may vary from day to day, we can make things easier by creating a reliable prompt. For example, they can begin immediately after arriving home from school, right after eating dinner, or even at a set time using an alarm. Naturally, it’s best to select an option that is consistent across as many days of the week as possible. Having a predictable location is just as important. For example, kids can do their homework at the dinner table, dining table, or at a desk in their bedroom. Just keep in mind that it’s best to choose a space that is always available and has as few distractions as possible, so it takes less effort to remain focused. Remember, the easier it is to do something, the more likely people will do it. By creating a predictable and distraction-free environment, you can steadily lower the level of ability needed to follow through on the behavior. That, in turn, reduces the amount of motivation required to take action, creating a virtuous cycle. Beyond improving predictability, it’s also helpful to remain nearby to answer questions. This, too, helps with streamlining ability. Of course, we need to be careful to avoid being drawn into the work itself, but we can and should let our children know that we are available to point them in the right direction when they hit a roadblock. Of course, none of this will have an impact if a child lacks motivation. So, let’s explore creative ways to inspire kids to complete their homework. 5. What To Do When Kids Lack Motivation One of the key revelations of the Fogg Behavioral Model is the strong link between ability and motivation. The more ability a behavior requires, the more motivation is needed to do it. That is why, up until this point, we’ve placed such a huge emphasis on making things easier. Doing so is almost always more effective than adding motivation, especially when building self-sufficient habits that are designed to last. With that said, motivation is still a critical factor. After all, no matter how much we simplify something, a child will not act if they don’t have a good reason to do so. For very young children, simple rewards can go a long way. However, as kids grow older, it’s essential that we increasingly rely on more meaningful and substantive incentives that are likely to stand the test of time. Some of the best forms of motivation include: intrinsic motivation, personal identity, praise or recognition, fun or entertainment, and freedom or autonomy. Let’s explore each in a little more detail. Intrinsic Motivation – Certain activities provide their own reward. For example, reading is intrinsically rewarding for those that love exploring new information. Personal Identity – When someone identifies as being helpful, healthy, or punctual, their identity often provides enough motivation to follow through on related behaviors. The same is true for many other traits or virtues that people link with their identity. Praise or Recognition – It feels good when people recognize and praise our actions. Better still, praise helps shape or reinforce a positive self-identity, which again provides a renewable source of motivation for related behaviors. Fun or Entertainment – When a task or behavior is fun or can be made fun by turning it into a game or contest, that alone can increase the motivation to participate. Freedom or Autonomy – When the completion of one behavior unlocks attractive new options elsewhere in life, people are more likely to take action. In effect, they are giving up a little bit of freedom now for increased freedom in the future. As parents, we should always look for motivators that are naturally linked with the desired behavior rather than turning to arbitrary rewards or punishments. When considering a new habit or routine, ask yourself: Does the behavior relate to a positive trait or uplifting identity that could be praised after a child takes action?Would the routine be more enjoyable if turned into a game, contest, or group activity?What are the natural positive outcomes that result from the behavior?What new freedoms or options are made possible by completing the routine?What is there to lose if they fail to take responsibility? Is it clear that the loss would be tied to their failure to act rather than being an arbitrary punishment? Such questions can help us discover motivations that are a better fit for the behavior we are trying to establish. And by finding the right motivation, we can increase the odds that the change will stick and will not require further oversight in the future. For example, clearing the dishes is linked with positive traits such as being helpful, organized, or responsible. Thus, if a child has shown signs of taking pride in one or more of these traits, it can be beneficial to make the link more explicit when praising their behavior by saying something like, “Thank you for clearing the dishes! I appreciate your efforts to keep our home so organized!” Not only does this approach re-affirm the positive view they have of themselves, but it also provides them with another outlet to apply themselves in a helpful way. Begin Today With One New Habit Or Routine Remember to start small and focus on consistency. Don’t try to change everything all at once. Begin by identifying one habit that would have the most significant impact on your child, such as establishing a daily homework routine. Then, look for ways to address the need for motivation, ability, and a prompt. Remember that casual praise is a powerful way to reinforce new habits. Now, it’s worth noting that not all praise is beneficial. The right kind of praise can help a child adopt positive behaviors and take on bigger challenges, while the wrong kind of praise can encourage them to avoid difficult tasks or quit when the going gets tough. So, I’ve published a guide covering four practical tips for how to praise a child with words. It’s a natural follow-up to the insights covered here, so I encourage you to check it out if you want to use praise to guide your child’s growth and development. If you’re interested in more useful parenting advice, be sure to subscribe to the Useful Parenting Advice channel on YouTube. Rick Kettner Rick is an avid reader and lifelong entrepreneur. He co-founded popular online music education platforms including Drumeo, Pianote, and Guitareo. He now spends much of his time sharing tips on "
