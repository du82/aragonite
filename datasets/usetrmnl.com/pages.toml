["https://usetrmnl.com/blog/introducing-byos"]
title = "TRMNL | Introducing BYOS: an OSS TRMNL client"
description = "Run TRMNL on your own network, server, and firmware, in under 10 minutes."
full_description = "Introducing BYOS: an OSS TRMNL client January 22, 2025 On Day 1 we made a promise: build an un-brickable device. Because we've all been there: new tool, great potential, something goes wrong, energy wasted.A frequent Kickstarter Backer myself, I knew this was a losing strategy to build trust. I also knew it would take time to get it right, so thanks for the patience these last 6 months.In this video demo we achieve the following in under 10 minutes:mod, build, and flash the TRMNL firmware on my own devicespin up an open source TRMNL server + Device management UIset up my device + point it to my local networkbuild a custom plugin with raw HTMLrender the plugin on my deviceDon't believe us? Get the code (client, server) and try it yourself.There's a lot more to come. New BYOS features, more quickstart servers in Node, Django, PHP, and office hours to help customize your stack.But for now I think it's fair to say that today (Day 210), our promise came true."
year_published = 2025
