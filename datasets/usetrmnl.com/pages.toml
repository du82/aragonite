["https://usetrmnl.com/blog/batch-1-sold-out"]
title = "TRMNL | Batch #1 is Sold Out!"
description = "A quick word of thanks and next steps."
full_description = '''Batch #1 is Sold Out! December 19, 2024 We did it. You did it.An idea, then a Raspberry Pi prototype, followed by a crowdfunding campaign, has come to life. And now we're all sold out. v0.1 - Raspberry Pi + Waveshare + Inkblot (OSS lib) Our first batch had 2,250 devices. With ~1,500 presales we figured this would last a few months. But then something happened: the internet found out. From unboxing posts on X, to comments on reddit and Hacker News, the TRMNL community shared the vision and people listened. Our team built 57 plugins, users built 100s more, and many of them are already open source. Stats from our Admin Panel A few weeks ago we began placing new purchase orders. We hope to never run out again. But until then we're offering a small token of apology: use code "bad-at-logistics" or "stop-going-viral" at checkout to save $15. Shipping in the USA is also free.While we wait to restock, here is what we're working on:1. Finishing our first open source, BYOS self-hosted server option2. Improving our logistics to support more couriers (DHL, UPS, FedEx)3. Building a handful of new plugins4. Making it easier to share Plugin Recipes 5. Improving documentation for no-code plugin building6. Designing + open sourcing a 3D-printable grid mounting system7. Launching our CLI (currently in private beta)8. Adding more components to the Design System9. (Probably) rebuilding Sleep Mode to support multiple time periodsTo get in touch, email [email protected].Stay focused.'''
year_published = 2024
