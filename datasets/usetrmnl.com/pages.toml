["https://usetrmnl.com"]
title = "TRMNL | E-ink dashboard to stay focused"
description = "Clarity, at a glance."
full_description = "Choose from 8 layouts to build the perfect dashboard. Create groups for different periods of the day. Just point and click. You don't want to maintain another device. TRMNL adds value without any fuss. It even puts itself to sleep. We achieve this through 1 way communication between client and server, versus the other way around. Learn more. Love it, super useful, super simple device. With the upgraded battery, it's entirely possible I'll only need to charge it once before the heat death of the universe. Incredible craftsmanship. While I've not had much time with it do to a mix of work and life things popping up I was getting started with it earlier and appreciated the simplicity for startup. Using the WiFi portal method for setup is genius. And the quality of the device is great. It's not entirely solid, there is a small very tiny feeling of fragility. But it's really well manufactured. I'm curious what the material texture on the outside is called or how that's achieved. It makes it feel soft. Nice to hold. Outstanding. I love the device and keep thinking of ways to integrate it into my day. Flexible, quiet, useful, calm, extensible - could not have asked for anything more. Fantastic and open little device. I love the product and ecosystem built around it as I don't have a lot of time to 'hack' it right now. I was able to get up and running with several basic screens that have been helpful in my daily life.I also love that it's open so, god forbid, the company goes away one day the display will still be useful and I can easily host my own server or repurpose it for another project. Every product should be this way and, in my opinion, it adds a huge layer of value! After 24 hours of using my TRMNL, I'm really impressed. The device looks great, the UI is smooth, and the overall experience is excellent. There's always room for improvement, but you’ve done a fantastic job creating a solid foundation to build on. I got this as a gift for a tech enthusiast. He has been thrilled with the ink display and has been working to customize it with the developer edition."
