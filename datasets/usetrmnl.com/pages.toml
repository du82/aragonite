["https://usetrmnl.com/blog/developer-edition"]
title = "TRMNL | What's the Developer edition?"
description = "Advanced features and benefits of upgrading your device for a one-time fee."
full_description = '''What's the Developer edition? November 04, 2024 Fun fact: over 40% of TRMNL customers are software developers, hardware hackers, or DIY tinkerers.With so many developers using TRMNL in their daily lives, it makes sense to invest heavily in an ecosystem that fits their requirements. Here's our track record so far:open sourced our firmwarelocalized the in-app experience to several languagesbegan sharing plugin recipespublished API docs and launched a public marketplacecreated a custom plugin editor with inline previewstarted a private Discord sever for developers onlyAnd that's not all. We've also added a slew of in-app features called "Developer perks" that make the TRMNL building experience even better: TRMNL Developer Perks Want to disable new firmware updates? Build your own device that pings our servers? Use your own firmware? No problem, just click a button.Want to force refresh any plugin? Also not a problem, as this is available for all plugins with the Developer edition. Force Refresh in 1 click And if you're having issues with custom plugins, or the API generally, just head to your very own server logs: TRMNL logs Unlock the Developer editionAll TRMNL devices have the same hardware, making it possible for any user to upgrade their setup at any time.For lifetime access to all of the above features, just pay a one time fee of $20 here:https://usetrmnl.com/upgrade (requires login)This small fee helps us support your journey building custom plugins -- whether via email or live chat in the private Discord -- and of course handle the onslaught of compute you may throw at us with renderable content.We can't wait to see what you build.'''
year_published = 2024
