["https://usetrmnl.com/blog/the-unbrickable-pledge"]
title = "TRMNL | The Unbrickable Pledge"
description = "Our promise to open source all the things if we can't make the numbers work."
full_description = "The Unbrickable Pledge February 18, 2025 We made a promise to never brick your device. Here's a progress report:1. July 2024 - open sourced our firmware2. December 2024 - built or commissioned server clients in Ruby, Elixir, and Python3. January 2025 - began selling BYOD licenses - DIY build docs coming soon4. February 2025 - launched Framework, a beautiful and free e-ink UI kit 5. February 2025 - onboarded a senior engineer to focus on OSS (hi Brooke!)But there's still 1 concern.As more TRMNL devices opt into our lifetime-access hosted platform, how will we handle growing server costs?Introducing the Unbrickable Pledge.As of February 18, 2025, the entire TRMNL team, operating under TRMNL Holdings LLC, hereby affirms our intent to release the core web application source code if and when we ever become insolvent as a company.Wayback Machine:https://web.archive.org/web/20250218195522/https://usetrmnl.com/blog/the-unbrickable-pledgeSharing source code is the right thing to do for our customers. Preventing e-waste is the right thing to do for our planet. And sharing How is the right thing to do for TRMNL.We hope this alleviates concerns by those who are much better at math than us and wondered: how is this business model possible?It's possible because of you.To staying focused,Ryan and the TRMNL team"
