["https://uss-la-ca135.org/50b/1950bell1.html"]
title = "George Bell Photos 1"
full_description = '''I was stationed on the USS Los Angeles from June 1958 until December 1960 when I was separated as an ET2. During that time, we made two (2) cruises to WESTPAC. In 1960, the ship underwent an overhaul (in drydock) at the Long Beach Naval Shipyard and then made a trip to Pearl Harbor in August for a change of command ceremony. Electronic Technicians (ETs) maintained the radios, radars and some other electronic gear on the ship. There were about 18 people in OE div (OE means Operations, Electronics). Max Shuck, on the right, was our division petty officer. He was a cool guy - we called him "Sam". Sam passed away in the winter of 1997. Sam is also shown in the division photo above, on the left in the first row. 1959 28 March 4-8 April 12 April 18-21 April 24-26 April 28 April-8 May 15-17 May 18-21 May 31 May 3-9 June 13-15 June 19-29 June 10-11 July 18 July Enroute WestPac Pearl Harbor Midway Guam Buckner Bay Yokosuka Shimoda, Japan Kobe, Japan Buckner Bay Hong Kong Nagoya, Japan Yokosuka Pearl Harbor Long Beach Click on pictures below to view larger pictures. Use your browser's Back button to return to this page. Click on pictures below to view larger pictures. Use your browser's Back button to return to this page.'''
