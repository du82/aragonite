title = "USS LA CA-135 Veterans Info"
full_description = "Veterans must be enrolled with the VA to obtain this service. Go to your local VA hospital or clinic. Take a copy of your DD-214 to prove that you were in the service. If you are eligible for medical care, you can get free or low cost prescription drugs through the VA. You may be eligible for military service ribbons & medals. Ribbons earned from wars or conflicts the ship participated in are listed here: The right-hand column tells where to get service ribbons. The same information is available from your local VA office. Standard Form (SF 180), Request Pertaining to Military Records, is recommended for requesting medals and awards: Military Record Requests (SF 180) Where to write for medals Bureau of Naval Personnel Liaison Office Room 5409 9700 Page Avenue St. Louis, MO 63132-5100 Where medals are mailed from Bureau of Naval Personnel Liaison Office Room 5409 9700 Page Avenue St. Louis, MO 63132-5100 Where to write in case of a problem or an appeal Chief of Naval Operations (OPNAV 09B33) Awards & Special Projects Washington, DC 20350-2000 A medal has been awarded for service during the Korean War by the Republic of Korea on the fiftieth anniversary of the conflict. This medal was awarded to all U.S. servicemen who participated and required a special act of the U.S. Congress since it was previously not allowed to accept military awards from foreign countries. The VFW lobbies for veterans rights and provides comradeship through local posts. It also provides timely veterans information to its members through the national magazine and local newsletters."
year_published = 2025
clearnet = "https://uss-la-ca135.org/2vets-info.html"
