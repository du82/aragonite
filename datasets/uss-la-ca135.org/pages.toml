["https://uss-la-ca135.org/3history.html"]
title = "uss la history"
full_description = "During the next 6 months, she ranged the coastal waters of the Korean Peninsula from Hungnam in the east, to Haeju in the west while her guns pounded enemy coastal positions. After returning to the United States on 17 December 1951 for overhaul and training, she made her second deployment to Korean waters on 9 October 1952, and participated in the 11 October concentrated shelling of enemy bunkers and observation points at Koji-ni. During the next few months, she continued to provide offshore gunfire support for American ground operations and, in addition, she cruised the Sea of Japan with the fast carriers of the Seventh Fleet. During the bombardment of Wonsan late in March and early April 1953, she was hit twice by enemy shore batteries. No lives were lost, but twelve men were wounded when an enemy shell struck the ship's mainmast. The men were awarded Purple Hearts; see Purple Hearts and this video. She continued operations until sailing for the United States west coast in mid April. She arrived in Long Beach, California, on 15 May 1953. While serving two tours of duty in Korea, she fired about 25,000 rounds of ammunition at enemy shores (see Navy message below). She was the first U.S. Navy vessel to take enemy fire in Korea, and established a record for the longest-sustained bombardment ever logged by an American warship. In 1954, the Los Angeles began modifications to deploy a stern-launched, sub-sonic REGULUS I guided missile system. The first Operational Suitability Test for REGULUS I took place on 15 February 1955 with the successful launch of the first operational tactical missile system (minus nuclear components) from the USS Los Angeles (CA-135) near Hawaii. The Los Angeles deployed soon after to the Western Pacific, carrying three tactical missiles, each armed with W-5 nuclear warheads. On 27 August 1958, the Los Angeles made an emergency deployment to Formosa (now Taiwan), departing from Long Beach with only 24 hours notice. Known as the Quemoy-Matsu Crisis, Los Angeles joined Task Group 77.6 of the Seventh Fleet on 10 September, 35 miles from Formosa, to protect Formosa from a possible invasion by Communist China."
author = "george"
year_published = 2025
