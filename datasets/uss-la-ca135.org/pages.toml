["https://uss-la-ca135.org/3la-timeline.html"]
title = "uss la timeline"
full_description = '''Sept - Oct 15, '45 Gunnery exercises & drills, followed by final Atlantic Fleet inspection - Guantanamo Bay, Cuba ~ Mar 20 Amoy, China ~ Mar 23 Hong Kong ~ May 1 & May 9 Hong Kong ~ May 20 Woo Sung, China ~ May 22 Tsingtao, China ~ May 26 Shanghai Late May - early June '51 East coast of Korea, flagship for Rear Admiral Arleigh A. Burke's Cruiser Division Five June '51 Kosong, Korea, shore bombardment July '51 [Cease-fire talks begin in Korea] Late July '51 Haeju Man, on Korea's west coast; shore bombardment Early Aug '51 Returned to east coast of Korea Sept '51 Kojo, Korea, shore bombardment Nov '51 Kojo, shore bombardment Mid Dec '51 Returned to Long Beach (about 8,000 rounds were fired in N. Korea) Late Apr '53 En route to Yokosuka, Japan & Korea (about 17,000 rounds were fired in N. Korea) Mid May '53 Returned to Long Beach Late May '55 Crossed the equator on May 24, 1955 at Latitude 00000, Longitude 107deg. 35" E, en route to Singapore Late Oct '56 Visit to Saigon, Republic of Viet Nam, for a week; So. Vietnam's 1st anniversary as an independent country Apr '57 The USS LA went into dry-dock at MINSY. Shortly after drydocking, a small earthquake occurred, but there was no damage or delays in the drydocking process. Apparently some local newspapers incorrectly reported otherwise. Click on pictures below to view larger pictures. Use your browser's Back button to return to this page.'''
