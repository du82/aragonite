["https://uss-la-ca135.org/40/1940creagan.html"]
title = "Ray Creagan Photos"
full_description = "Unless otherwise noted, click to enlarge photos Use your browser's Back button to return to this page. Will thou, Jack, have this woman as thy wedded wife, to live together insofar as the Bureau of Naval Personnel will allow? Wilt thou love her, comfort, honor, and keep her, take to the movies and come home to her regularly on the 4:30 bus? I will. Wilt thou, Jane, take this sailor as thy wedded husband, bearing in mind liberty hours, boat schedules, watches, sudden orders, uncertain mail communications, and all the other penalties of Navy life? Wilt thou obey him, honor him and wait for him, press his uniform, and let him smoke Navy plug in the Home? I will. I, Jack, take thee, Jane, as my wedded wife from 4:30 pm until 8:00 am as far as permitted by the commanding officer, liberty subject to change without notice, for better or worse, for earlier or for later. I, Jane, take thee, Jack, as my wedded husband, subject to the whims of the officer of the deck, changing my residence whenever the ship moves, to have and to hold just as long as my allotment comes regularly, and therefore, I give my troth. The original LOS ANGELES, and the Graf Zeppelin, were the only dirigibles built since World War I that did not have a disastrous ending. The LOS ANGELES was decommissioned in 1932 after eight years of uninterupted service, which was two years longer than the other ship. The U.S.Navy, after having built one dirigible and purchased another, decided to make a thorough test of dirigibles, and in 1921 the Allied Council of Ambassadors in Europe agreed to vary the treaty restrictions and permit the Zeppelin Works in Germany to build an airship for this country on the reparation account. The airship was completed in 1924, and was originally known as the ZR-3. It was 650 feet long and 90 3/4 feet in diameter; with its five 400 hp engines it maintained a cruising speed of between 45 and 71 miles an hour and had a cruising range of 5000 miles. The gas capacity was 2,475,000 cubic feet; it could lift 150,000 pounds, 60% of which was useful load. Originally designed as a commercial craft, it could accomodate 30 passengers and carried the same number as members of the crew."
year_published = 2025
