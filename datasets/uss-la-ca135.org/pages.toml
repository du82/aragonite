["https://uss-la-ca135.org/3org-manual.htm"]
title = "USS Los Angeles CA-135 Page"
full_description = '''Ship Drawings: 2 views of the ship may assist in locating items on the ship. Use "Back" to return to this page. 1. Frames are numbered from the bow (stem) to stern (about #165). 2. The ship/hull is divided into 3 sections from bow area (A) to midships area (B) to stern area (C). Section A: stem to frame 65. Section B: frame 65 to frame 120. Section C: frame 120 to 165 Within in each section, spaces are numbered from fore to aft. 3. Decks are numbered: main deck (1) to keel (9) & superstructure first level (01) to top level (06). 4. There were 2 passageways running from fore to aft on the 2nd & 3rd decks. These passageways were dividing lines between spaces to starboard (S), spaces to port (P), & the spaces between the passageways (CL) Examples: a. Electronics (ET) Shop is located in compartment B-206-1L, between frames 87 & 90 on port side (P). This means the space was on the first deck down from the main deck, about midships on the port side. b. Post Office is also located in B-206-1L, between frames 84 & 86 on center line (CL). The Post Office is just forward of the ET Shop & across the port passageway. There are 3 pages of this information, & the information is contained on GIF format pictures (each is 90 KB or smaller). There are 6 pages of this information, & the information is contained on GIF format pictures (each is 150 KB or smaller). In the table below, click on a page number to find the allocation of ratings per department, sorted by ratings. There are 2 pages of this information, & the information is contained on GIF format pictures (each is 70 KB or smaller). There are 2 pages of this information, & the information is contained on GIF format pictures (each is 70 KB or smaller). This section will include interior compartments & spaces. There are 18 pages of this information, & the information is contained on GIF format pictures (each is 130 KB or smaller). In the table below, click on a Division Name to view that division's responsibilities. Use "Back" to return to this page.'''
