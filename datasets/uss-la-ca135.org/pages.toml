title = "Fred Mallgrave Photos"
full_description = "Photos & Info from Fred Mallgrave, LTJG, M div (on LA '45)Note: Fred passed away 5 Apr 2008. RIP, Fred. Fred joined the Navy in June 1943 and was assigned to the USS Gambier Bay, CVE-73. Following her commissioning in Dec '43, the Gambier Bay sailed to the Pacific war & participated in several combat engagements. Fred was B div. officer when the Gambier Bay was sunk (25 Oct '44) during the Battle of Leyte Gulf. He spent over two days in the water before being rescued by the USS Shaw, DD-373. Unless otherwise noted, click to enlarge photos Use your browser's Back button to return to this page."
