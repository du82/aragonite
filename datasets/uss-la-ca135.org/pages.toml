["https://uss-la-ca135.org/news/members/2000-2003.html"]
title = "USS LA CA-135 special events"
full_description = '''Excerpt from the award presentation: "Dr. Dessart is the 'quiet man' who has excelled in teaching, in research, and in public service," says one nominator of Lifetime Achievement Award winner Donald Dessart. "He has always impressed me as a willing leader who does more than his share of the work but never seeks the acclaim or reward for the success of the work." The article goes on to say, "...after college, he applied his mathematics knowledge in the U.S. Navy as a gunnery officer for three years during the Korean War." The Republic of China on Formosa (Taiwan) has awarded a medal to every veteran who was at the 1958 Quemoy and Matsu campaign. Then in the later part of 1999, their Ministry of Defense changed the eligibility to any veteran who served on around or over their territories from 1949 to present. On 25 June, Knoxville-area LA sailors James E. Baker, Don Dessart, Don Woody ? Ray Woodruff got together to reminisce about their Korean War experiences on the ship. A Knoxville newspaperman wrote a story about this meeting ? James Baker took pictures of the event. A picture ? the article are included below. The following article appeared in the Knoxville News-Sentinel on June 25, 2000. The article is reproduced in its entirety, including the credits at the end. Ray Woodruff remembers the first time it dawned on him that the glory of war ain't all it's cracked up to be. "There was this stone that we used to scrub the wooden deck," says Woodruff, who was stationed aboard the USS Los Angeles during the Korean War. "The stone had an indentation in it. You had to put a broom handle down in it, and then you scrubbed 'round and 'round with sand and water. Well, one day, we ran out of sand. So they sent 12 or 14 of us ashore to get more." We're talking "ashore" as in the beach -- which just happened to be behind enemy lines and well-fortified with North Korean troops. "They sent a squad of Marines with us for protection. We dug sand all afternoon and put it in bags and carried it back out to the ship. Here we'd been bombarding the place for weeks, and now we're out on the beach digging sand. That's when I started gettin' the idea this was a crazy war!"'''
author = "george"
year_published = 2025
clearnet = "https://uss-la-ca135.org/news/members/2000-2003.html"
