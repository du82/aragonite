["https://uss-la-ca135.org/2photohistory.html"]
title = "USS LA CA-135 Photo History"
full_description = '''There is a fine collection of USS LA photos at the Nav Source website: http://www.navsource.org/archives/04/135/04135.htm I would like to give a very special thank you to Norm Booth (on LA '51-'52). His contributions & moral support since 1999 have been very much appreciated. A brief summary follows: - In September 1999, Norm sent me a copy of the 1995 Reunion booklet, & information from the booklet was added to the web page. Later on, I visited Norm & took pictures of some of his memorabilia - these picures are now included herein. - He also mailed me a copy of the ship's organization manual - this is the ship's "bible" & data from it has been added to the Organization Manual section. - He sent several color photos he took while aboard the LA - these are now included in the Photo History section. - He was a key figure in the preservation of USS LA CA-135 artifacts & memorabilia at the Los Angeles Maritime Museum & at Gibson Park (both in San Pedro, CA). See the Memorials section. - He has been very instrumental in organizing the "Roundups" in San Pedro; these events have been held during the year following the official USS LA reunions.'''
