["https://uss-la-ca135.org/40/1940ruffin.html"]
title = "Thomas Ruffin Photos"
full_description = "Photos from Thomas F. Ruffin -deceased, RD3, K div. (on LA '45-'46) (Photos sent by Shawn M. Bohannon, Noel Memorial Library, LSU Shreveport, LA) Unless otherwise noted, click to enlarge photos Use your browser's Back button to return to this page. After his 18th birthday on November 25, 1943, Thomas F. Ruffin enlisted in the U.S. Navy. Following his induction on March 15, 1944, he was sent to Great Lakes, Michigan for boot camp and radio technician training. However, he forwent radio technician school when he had an opportunity to enter the V-12 training program. After attending V-12 training at the University of Illinois, Urbana, Illinois from July 1944-October 1944, he transferred to the V-12 unit at Columbia University, New York, November 1944-March 1945. Following various assignments in Hoboken, New Jersey and Newport, Rhode Island, Tom Ruffin was assigned to the newly commissioned heavy cruiser U.S.S. Los Angeles (CA-135) becoming a “plank owner.” Departing Philadelphia, the Los Angeles underwent a rugged shakedown cruise in the Caribbean before passing through the Panama Canal en route to the Pacific. After a brief stay at Los Angeles and Pearl Harbor, the ship sailed for China where it operated for the next year. During his time aboard the ship, Tom was promoted to Radarman 3rd Class, served as editor of the ship’s newspaper “The Angelo” and operated the small rental “Ruffin-Wright-Sykes-Maloney Library.” He left the Los Angeles in June 1946 and returned to the United States aboard the U.S.S. Mount Olympus (AGC-8). Tom received the China Service Medal, American Campaign Medal, Asiatic-Pacific Campaign Medal, and World War II Victory Medal. He was honorably discharged from the Navy on August 8, 1946."
year_published = 2025
clearnet = "https://uss-la-ca135.org/40/1940ruffin.html"
