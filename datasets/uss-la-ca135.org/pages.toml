["https://uss-la-ca135.org/50a/1950davis.html"]
title = "Eugene Davis Photos"
full_description = '''Piloted by Lt. William W. Wear, USNR, of Cedar Rapids, Iowa, the copter was hovering over the destroyer deck and discharging a passenger by hoist when the craft lost power. Dangling in his harness below the aircraft when it developed engine trouble, he quickly slipped out of the hoist harness and dropped to the deck a few feet below and sprinted clear. "I looked up and saw the helicopter and ran forward to avoid the rotors", related Ens. Howe later. To keep from striking the after five-inch mount Lt. Wear skillfully slipped the helicopter aft. It bounced against a loaded charge rack and settled on deck with one wheel astride one 400 pound can of TNT. "I'm trying to find a helo pilot that was aboard the LA during '52 and '53. My father, Eugene P. Davis (davng@bright.net), BT1, was onboard the USS Orleck DD 886 during this time and was able to take some photos of a helo from the LA after it had made an emergency landing on the fantail of the Orleck and of the recovery of the helo by a cruiser assumed to be the LA. One of these photos shows the pilot and helo after the landing and one could possibly recognize the pilot if they knew him then. ...My father would like to give these photos to the pilot" Note 1: Jerry Huck, USS Los Angeles '52-'56, has confirmed that the helicopter was from the LA - a photo of the incident appears in the 1952-1953 cruise book. If you have any more information about this incident or the helicopter crew, please email the webmaster.'''
year_published = 2025
clearnet = "https://uss-la-ca135.org/50a/1950davis.html"
