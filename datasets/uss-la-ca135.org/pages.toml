["https://uss-la-ca135.org/40/1940henrietta.htm"]
title = "Bill Henrietta Photos"
full_description = "May 7th 1945 the Germans threw in the towel and the cleanup was beginning. By August 15th, thanks to President Harry Truman, who had the courage to use the bomb, the Jap's followed suit. The official signing would be later right in Tokyo Bay aboard the USS Missouri, September 2nd 1945. In the meantime we were ordered to the West Indies. All merchant ships including the one I was on were ordered to jettison all the large caliber live ammunition, and as soon as we tied up to the pier all Naval personnel left the ship and we were taken to a temporary US Navy Transfer Unit. Orders continued to come in regarding the selective destruction of most of the military equipment in the area, such as jeeps, tractors etc. That was quite a sight seeing the workers using a cutting torch to cut up a brand new jeeps and other things. Ah yes, more of the idiocy of war. The idea behind this useless destruction was to prevent the use of this equipment by anyone and force them to buy new, and therefore create work for the returning work force to America, brilliant right? About a month after the two bombs had been dropped, a group of us Armed Guards were placed on a LST and sent to Nagasaki Japan. We were allowed limited shore leave in Nagasaki. It was messed up a bit, but there was still a lot of the town still standing unscathed, I don't ever recall having a problem with radiation sickness. Although later I did lose my hair, and I cannot seem to handle more than three Martinis without getting dizzy. I have considered filing a lawsuit against the government, but what the hey. We transferred to another merchant ship the SS Dolly Madison and returned to San Francisco and Treasure Island. As Naval Reserve I was entitled to be discharged and I was assigned to a transfer unit. For some reason my love for the Navy seemed unfulfilled so after a brief leave I re-enlisted in the regular Navy. I remained on Treasure Island and was appointed Master At Arms at a transfer barracks and remained on shore duty there at Treasure Island for a short time."
year_published = 2025
clearnet = "https://uss-la-ca135.org/40/1940henrietta.htm"
