["https://uss-la-ca135.org/40/1940synodis.htm"]
title = "James Synodis Photos"
full_description = "Working Divisions: 3 & 4 Uniform of the Day: Officers & CPO’s: Service Dress blue; Khaki or grey optional. Crew : Undress blue - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - Carry out the daily routine and the following special events: 0330 Call galley force. 0515 Call MAA’s, bugler, mess cooks, and steward’s mates. 0530 Call duty PPO’s. 0600 All hands. 0615 Turn to. Early mess for mess cooks. 0630 Mess gear. 0645 Pipe to breakfast. 0700 Change uniform of day. See above. 0800 Muster on stations. Turn to, ship’s work. Divisions complete stowage of living spaces. 0930 General Quarters. 1045 O.O.D. inspect mess cooks and steward’s mates. 1115 Early mess for mess cooks. 1145 Mess gear. 1200 Pipe to dinner. 1300 Turn to. Complete cleaning and painting in compartments. 1400 Collision drill. 1500 School call. 1615 Early mess for mess cooks. 1645 Mess gear. 1700 Pipe to supper. 1800 Pipe sweepers. Rig movies. 1930 Eight o’clock reports. Movies. Note 1. The expenditure of mess gear is extremely excessive. All hands are called upon to conserve. Inattenation will necessitate prohibiting the use of mess gear outside of messing compartments. Note 2. About 0130 tonight the ship will pass through the Bonin Islands, one of which is Iwo Jima. Tuesday morning Ryukyu Islands will be sighted. One of these is Okinawa. The ship now expects to enter Yangtze River on morning of 3 January, arriving Shanghai in afternoon. Note 3. Only one more day remains to make decks shipshape below topside. Thursday will be Field Day topside if temperature permits. Division Officers have berthing compartments settled in order to receive large flag complement, and have other flag operation spaces available on arrival. Note 4. Average water consumption per man per day during the month of December was 25 gallons; average per man per day during the past week was 30 gallons. Both these figures are too high and indicate extreme carelessness in the use of fresh water. Division Officers instruct their men in the conservation of water and the reasons therefor. If immediate improvement in this condition is not evidenced, more stringent water hours will be necessary."
year_published = 2025
clearnet = "https://uss-la-ca135.org/40/1940synodis.htm"
