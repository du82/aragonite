description = "Background and legal information about the Unicode/UTF-8 character table"
full_description = "This site is intended as a reference for the UTF8-8 encoding of Unicode characters. You can look up the UTF-8 encoding in various formats (decimal, hexadecimal, octal, binary, and as literals for use e.g. in Perl strings), and you can test if your browser will display the actual glyphs (if not, depending on your pbrowser and operating system you will typically see a square sysmbol or a question mark. You can also select to have displayed named HTML character entities (where defined for this character), and the numeric HTML representation of the character The site will only disply correctly if your browser and operating system can correctly process UTF-8 encoded pages. if you want to serach for Unicode characters try our search engine Search characters in Unicode 8.0.0"
