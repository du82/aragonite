["https://www.uvm.dk/forberedende-grunduddannelse"]
title = "Reform af det forberedende område | Børne– og Undervisningsministeriet"
full_description = "Forside Forberedende grunduddannelse - FGU Forberedende grunduddannelse er et fleksibelt uddannelsestilbud til unge under 25 år, der ikke har gennemført eller er i gang med en ungdomsuddannelse og som heller ikke er i beskæftigelse. Om FGU Uddannelsens opbygning og indhold, samarbejde mellem FGU og KUI, ydelser og specialpædagogisk støtte. Målgruppe og optagelse Målgruppevurdering, afsøgningsforløb og optagelse. Undervisning og læringsmiljø Undervisningens tilrettelæggelse, læreplaner og fagbilag samt læringsmiljø. Læringskonsulenterne Vejledning, rådgivning, temadage, dialogmøder, inspirationsseminarer og sparring, samt rådgivningsforløb målrettet udfordrede skoler. Institutioner, organisering og ledelse Ansvaret for drift og tilsyn af skolerne og udvikling af uddannelsen er fordelt på forskellige aktører. Love og regler Love og centrale bekendtgørelser på området. Skoleudvikling Klare mål sætter rammerne for skolernes arbejde med kvalitet og kompetenceudvikling. Prøver og eksamen Prøveformer, oversigter og retningslinjer ved afholdelse af prøver på forberedende grunduddannelse (FGU). Nyheder og orienteringer Nyheder, orientering og nyhedsbreve. Spørgsmål og svar Se en samlet liste med svar på spørgsmål om forberedende grunduddannelse. TEMAER NYHED Lovende FGU-tal 65 procent af de elever, der fuldfører FGU, går på en ungdomsuddannelse eller er i beskæftigelse, fire måneder efter de er stoppet på FGU. Om FGU Spørgsmål og svar Få svar på mest stillede spørgsmål om FGU'en. OVERBLIK Uddannelsens opbygning og indhold Uddannelsens tre spor, basis, niveauer, varighed, erhvervstræning og kombinationsforløb. Seneste nyheder og orienteringer Nyhed · 24. februar 2025 Ny måling: Elevernes trivsel på landets ungdomsuddannelser og fgu er fortsat høj Nyhed · 11. december 2024 Nye anbefalinger til forenkling og forbedring af læreplaner, fagbilag og didaktiske principper på fgu Nyhed · 22. november 2024 Finanslov for 2025: Trecifret millionbeløb til forsøg med skolemad Se alle"
