full_description = "Forside Almen voksenuddannelse (avu) Ansvar og aktører på almen voksenuddannelse Ansvaret for drift af institutionerne og udvikling af almen voksenuddannelse (avu) er fordelt på forskellige aktører. Bestyrelse og ledelse Institutionens bestyrelse har ansvaret for mål, rammer og vilkår. Institutionens leder har ansvaret for den daglige drift. Ministerium og institutioner Børne- og Undervisningsministeriet har det overordnede ansvar for almen voksenuddannelse (avu). Råd og udvalg En række råd og udvalg spiller en vigtig rådgivende rolle på området for almen voksenuddannelse. Klager Klager over et VUC’s afgørelse vedrørende almen voksenuddannelse (avu) Tilsyn Tilsynet med almen voksenuddannelse (avu) omfatter økonomisk tilsyn og tilsyn med den faglige kvalitet."
