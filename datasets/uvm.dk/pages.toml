["https://www.uvm.dk/folkeskolen/test-evaluering-og-skoleudvikling"]
title = "Test, evaluering og skoleudvikling | Børne– og Undervisningsministeriet"
description = "Et bredt udvalg af redskaber og evalueringsmetoder skal bidrage til en st&aelig;rk evalueringskultur &ndash; herunder om ordblindhed og sprogvurdering, screening af h&oslash;jtbegavede elever, UPV, obligatoriske og frivillige test og meddelelsesbog"
full_description = "Forside Folkeskolen Test, evaluering og skoleudvikling Et bredt udvalg af redskaber og evalueringsmetoder skal bidrage til en stærk evalueringskultur. Om evalueringskultur i folkeskolen Det fremtidige evaluerings- og bedømmelsessystem skal skabe en stærkere evalueringskultur i folkeskolen, der gør det nemmere at støtte alle elevers faglige og alsidige udvikling. Obligatoriske og frivillige test i folkeskolen Læs om Folkeskolens Nationale Overgangstest, Folkeskolens Nationale Færdighedstest samt frivillige adaptive test. Risikotest for ordblindhed, sprogvurdering og screeningtest En række test- og screeningsværktøjer skal hjælpe med at opdage elever med sprog- og læsevanskeligheder, så de kan få støtte tidligt i deres skolegang. Screening for læsevanskeligheder i 1. klasse Fra skoleåret 2025/2026 skal alle elever screenes for læsevanskeligheder i 1. klasse. Redskab til screening for tegn på høj begavelse for elever i 1. klasse Fra skoleåret 2024/25 får skolerne et redskab til screening for tegn på høj begavelse for elever i 1. klasse. Det skal hjælpe til en tidlig opsporing, så alle elever bliver så dygtige, de kan. Mærkningsordning for test Muligheden for at udvikle en mærkningsordning for test er blevet undersøgt. Meddelelsesbog Meddelelsesbogen erstatter elevplanen, og skal bruges i dialogen mellem skole, forældre og elever. Den skal indeholde få væsentlige fokuspunkter. Skoleudviklingssamtaler Skoleudviklingssamtaler er en ramme for tillidsfuld og faglig dialog mellem kommunalbestyrelsen og skolen om skolens udviklings- og indsatsområder. Skoler med bekymrende kvalitet Kommunerne skal tidligt have mulighed for at opdage skoler, der har eller er i risiko for at få udfordringer med faglig kvalitet, fravær eller trivsel. Forsøgsprogram med forskellige karakter- og bedømmelsesformer Folkeskoleforligskredsen har igangsat forsøg med nye karakter- og bedømmelsesformer, der skal undersøge hvordan karaktersystemer påvirker elevernes trivsel og motivation. Trivselsmåling Alle folkeskoler skal hvert år gennemføre en trivselsmåling blandt eleverne i børnehaveklassen til og med 9. klasse. Test- og evalueringsbank I test- og evalueringsbanken kan skolerne finde viden om formativ evaluering og konkrete feedbackredskaber, som kan tilpasses alle klassetrin."
