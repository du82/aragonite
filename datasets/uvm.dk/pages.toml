title = "Prøver og eksamen ved Almen voksenuddannelse (avu) | Børne– og Undervisningsministeriet"
description = "Om prøver, evaluering og almen forberedelseseksamen."
full_description = "Forside Almen voksenuddannelse (avu) Prøver og eksamen på almen voksenuddannelse Om prøver, evaluering og almen forberedelseseksamen. Afgørelser om snyd Det er institutionslederens ansvar at sikre, at eksaminanderne kender reglerne om snyd. Ved formodning om snyd, skal institutionens leder vurdere sagen og beslutte eventuelle konsekvenser. Information om prøver og eksamen Information om prøver ved avu og om den almene forberedelseseksamen. Regler og orienteringer Bekendtgørelser og orienteringer, der er relevante for administratorer, lærere, censorer og kursister. Brug af AI-baserede værktøjer til prøverne og under forberedelse Regler for brug af AI-baserede værktøjer f.eks. ChatGPT ved de mundtlige og skriftlige prøver samt under en eventuel forberedelse på avu. Beviser og attestationer Beskrivelser af beviser og attestationer samt eksempler. Kalender for prøver og eksamen for almen voksenuddannelse Oversigten giver indblik over skriftlige prøvedatoer på almen voksenuddannelse (avu) for hhv. sommerterminen 2025, vinterterminen 2025, sommerterminen 2026 og vinterterminen 2026. Klager over prøver Kursisters klager over prøver skal sendes til den skole, der har afholdt prøven. Materiale fra skriftlige prøver Censorer og institutionerne kan anvende tidligere stillede opgavesæt fra skriftlige prøver. Spørgsmål og åbningstider Spørgsmål til prøver og eksamen på almen voksenuddannelse. Forsøg med prøven i matematik G på avu Styrelsen for Undervisning og Kvalitet udbyder forsøg med prøven i matematik niveau G på avu ved sommerterminen 2025. Information til censorer Rapport om prøveafholdelse, indberetning fra censor og erfaringsmøder for lærere og censorer."
