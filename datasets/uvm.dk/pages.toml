["https://www.uvm.dk/dagtilbud/viden-og-undersoegelser/kvalitetsundersoegelse-paa-dagtilbudsomraadet"]
title = "Kvalitetsundersøgelse på dagtilbudsområdet | Børne– og Undervisningsministeriet"
full_description = "Kvalitetsundersøgelsen af kommunale dagtilbud for 0-2-årige børn viser, at der er stor variation i kvaliteten i både daginstitutioner og dagplejen. Kvalitetsundersøgelsen på 0-2-årsområdet og den kommende kvalitetsundersøgelse af dagtilbud for 3-5-årige børn laves af Danmarks Evalueringsinstitut (EVA) og Det Nationale Forsknings- og Analysecenter for Velfærd (VIVE) på vegne af Børne- og Undervisningsministeriet. Kvalitetsundersøgelserne er igangsat af børne- og undervisningsministeren med inddragelse af interessenterne på dagtilbudsområdet. Undersøgelserne omfatter en repræsentativ stikprøve af kommunale dagtilbud og undersøger blandt andet dagtilbuddenes rammer og læringsmiljøer. Undersøgelserne er igangsat på baggrund af aftalerne mellem Regeringen og KL om kommunernes økonomi for 2022 og 2023. Forud for igangsættelsen af undersøgelsen af dagtilbud for 0-2-årige børn har EVA og VIVE lavet et omfattende forarbejde, der har dannet grundlag for beslutningen om tilrettelæggelse af kvalitetsundersøgelsen. Forud for undersøgelsen af dagtilbud for 3-5-årige børn har EVA og VIVE ligeledes lavet et forarbejde, der har dannet grundlag for en beslutning om, hvorvidt undersøgelsen af dagtilbud for 3-5-årige børn skulle udvides til også at undersøge børns trivsel, læring, udvikling og dannelse i dagtilbud. Det er med afsæt i forarbejdet og inddragelse af interessenterne på dagtilbudsområdet besluttet, at undersøgelsen af dagtilbud for 3-5-årige børn ikke skal udvides. Kvalitetsundersøgelse af kommunale dagtilbud for 0-2-årige børn: Opdateret maj 2023 Hent undersøgelsen: ”Kvalitet i dagtilbud” (pdf) Se metodebilag: ”Kvalitet i dagtilbud – Undersøgelsesdesign, metode, bilagstabeller” (pdf) Der er desuden udarbejdet to materialer målrettet kommunerne med opsummering af kvalitetsundersøgelsens hovedfund og forslag til refleksionsspørgsmål på baggrund af undersøgelsen. Se materialet (emu.dk). Forarbejder om undersøgelsen af kvalitet i dagtilbud: Opdateret februar 2023 med en justeret version af leverance 7 del 1. Forarbejde til kvalitetsundersøgelse – leverance 1 del 1: Vidensbehov på lokalt niveau (pdf) Forarbejde til kvalitetsundersøgelse – leverance 1 del 2: Vidensbehov på nationalt og kommunalt niveau (pdf) Forarbejde til kvalitetsundersøgelse – leverance 2: Erfaringer med at undersøge kvalitet kommunalt (pdf) Forarbejde til kvalitetsundersøgelse – leverance 3: Erfaringer med at undersøge kvalitet nationalt (pdf) Forarbejde til kvalitetsundersøgelse – leverance 4: Overblik over relevant registerdata (pdf) Forarbejde til kvalitetsundersøgelse – leverance 5: Vurdering af relevante redskaber (pdf) Forarbejde til kvalitetsundersøgelse – leverance 6: Første møde med videnskabelig referencegruppe (pdf) Forarbejde til kvalitetsundersøgelse – leverance 7 del 1: Overordnede valg vedrørende kvalitetsundersøgelse (pdf) Forarbejde til kvalitetsundersøgelse – leverance 7 del 2: Model for kvalitetsundersøgelsen (pdf) Forarbejder om evt. tillæg til kvalitetsundersøgelsen af dagtilbud for 3-5-årige børn om børns trivsel, læring, udvikling og dannelse i dagtilbud: Notat 1 - Forarbejde om, hvordan man kan undersøge børns trivsel, læring, udvikling og dannelse i dagtilbud (pdf) Notat 2 - Forarbejde om, hvordan man kan undersøge børns trivsel, læring, udvikling og dannelse i dagtilbud (pdf) Notat 3 - Forarbejde om, hvordan man kan undersøge børns trivsel, læring, udvikling og dannelse i dagtilbud (pdf)"
