full_description = "Forside Forberedende voksenundervisning (FVU) FVU er til voksne over 25 år, der ønsker at forbedre sine læse-, skrive- og matematikfærdigheder eller sine færdigheder inden for digital opgaveløsning og engelsk. Undervisningens enkelte trin kan afsluttes med prøve. Det øverste trin svarer færdighedsmæssigt til folkeskolens 9. klasse. Om forberedende voksenundervisning (FVU) Uddannelsens formål, målgruppe og indhold. Adgangskrav og optagelse Om optagelse, adgangskrav og økonomiske støttemuligheder. Indhold og fag Fagenes indhold er reguleret i læreplanerne i FVU-bekendtgørelsen og beskrevet yderligere i undervisningsvejledninger. Love og regler Her finder du oversigt over love med betydning for forberedende voksenundervisning (FVU) og centrale bekendtgørelser. Prøver og eksamen Datoer, oversigter og retningslinjer ved afholdelse af prøver ved forberedende voksenundervisning (FVU). Ansvar og aktører Ansvaret for drift af institutionerne og udvikling af forberedende voksenundervisning (FVU) er fordelt på forskellige aktører. Rapporter og evalueringer Oversigt over rapporter og evalueringer om forberedende undervisning (FVU). Viden om FVU på emu.dk emu.dk formidler viden, erfaringer og inspiration til lærere. Spørgsmål og svar Læs svarene på de oftest stillede spørgsmål om forberedende voksenundervisning (FVU). Breve fra STUK Breve til institutionerne om fortolkning, præcisering eller indskærpelse af regler på FVU-området. Trepartsaftale om VEU-systemet Danskernes kompetencer skal styrkes gennem hele livet. Læs om initiativerne. Aftaler To nye aftaler skal opkvalificere arbejdsstyrken. Flere temaer"
