["https://www.uvm.dk/sitecore/content/global/news/uvm/2025/feb/250206-ny-undersoegelse-forudser-en-markant-stigning"]
title = "Ny undersøgelse forudser en markant stigning i antallet af elever på internationale gymnasieuddannelser  | Børne– og Undervisningsministeriet"
full_description = "Hvad er det fremtidige behov for den internationale gymnasieuddannelse International Baccalaureate (IB) i Danmark? Det har en ny undersøgelse gennemført af Epinion for Børne- og Undervisningsministeriet kastet lys over. Antallet af elever på den internationale engelsksprogede gymnasieuddannelse IB forventes ifølge den nye undersøgelse at stige med cirka 1400 elever frem mod 2033. Det svarer til en stigning på cirka 70 procent. Den forventede udvikling hænger sammen med udviklingen i international arbejdskraft. IB er en 2-årig engelsksproget gymnasial uddannelse, som kan tages i over 100 lande. I Danmark er der i dag 13 offentlige IB-udbud og 3 private. I 2023 gik der 2105 elever på IB i Danmark. Det er en markant stigning, da der i 2012 kun gik 948 elever. Antallet af offentlige IB-udbud er ikke blevet udvidet siden 2014, hvor antallet blev hævet fra 10 til 13. Undersøgelsen viser, at den forventede fremtidige stigning i antallet af IB-elever særligt vil være drevet af udenlandske elever mens antallet af danske elever forventes at ligge nogenlunde stabilt. De nuværende IB-institutioner oplyser i undersøgelsen, at de forventer at have kapacitet til at optage flere elever, men det fremgår samtidig, at der lokalt opleves efterspørgsel på nye IB-udbud. Om International Baccalaureate Diploma Programme International Baccalaureate Diploma Programme, også kaldet IB, er en engelsksproget 2-årig gymnasial uddannelse. I Danmark er der i dag 13 offentlige IB-udbud og 3 private. En IB er sidestillet med en dansk studentereksamen og er adgangsgivende til alle videregående uddannelser i Danmark, såfremt specifikke adgangskrav mødes. I Danmark er der mulighed for at tage en pre-IB, inden selve IB-uddannelsen påbegyndes. Pre-IB er 1-årig og svarer til 1.g i de to 3-årige uddannelser stx og htx. Antallet af offentlige IB-udbud er fastlagt på baggrund af en politisk aftale fra 2014 mellem den daværende regering (Socialdemokratiet og Radikale Venstre) og Venstre, Dansk Folkeparti, SF og Det Konservative Folkeparti. Læs mere Læs undersøgelsen (pdf)"
year_published = 2025
clearnet = "https://www.uvm.dk/sitecore/content/global/news/uvm/2025/feb/250206-ny-undersoegelse-forudser-en-markant-stigning"
