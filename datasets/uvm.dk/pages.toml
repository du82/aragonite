full_description = "Alle fakturaer til offentlige myndigheder skal være elektroniske. Fakturaer dækker i denne sammenhæng over alle former for fakturaer og kreditnotaer. Nedenfor kan du se, hvordan du skal fremsende elektroniske fakturaer til E-fakturering i ministeriet. EAN-lokationsnumre, VANS-udbyder, Læs ind-bureauer og fakturaportal Elektroniske fakturaer skal fremsendes til et EAN-lokationsnummer. Herunder er angivet, hvilke EAN-lokationsnumre ministeriet benytter. Organisation 2021 EAN-nummer Departementet 5798000562264 Styrelsen for Undervisning og Kvalitet 5798000562288 Styrelsen for It og Læring 5798000562271 Forsøgs- og udviklingsmidler 5798000555242 Departementet – taxametertilskud 5798000555259 Administration af Udlodningsmidlerne (tidligere Tips- og Lotto) 5798000555273 Administration af specialpædagogisk støtte (SPS) 5798000555181 Fakturaportal Hvis I ikke har et it-system, der understøtter afsendelse af elektroniske fakturaer, kan der anvendes en gratis elektronisk fakturablanket på hjemmesiden (virk.dk). Oplysninger, der skal fremgå af fakturaen De elektroniske fakturaer skal indeholde nogle bestemte oplysninger: EAN-lokationsnummer (skal påføres faktura) Personreference eller anden opgivet reference Eventuel kontostreng til brug for ministeriets interne kontering (kan påføres faktura, hvis oplyst af ordreafgiver) Du bedes være opmærksom på, at ordreafgiveren i ministeriet senest ved afgivelsen af sin bestilling – som minimum - skal oplyse om punkt 1 og 2. Eventuelle serviceoplysninger (adresseændringer osv.) kan ikke meddeles via en faktura, men bedes sendt til e-mailadressen uvm-regnskab@uvm.dk. Virksomhedsnumre Cvr. 20453044 Børne- og Undervisningsministeriet SE nummer 41794550 P-enhed: 1003400473, Frederiksholms Kanal 21, 1220 København K P-enhed: 1009480958, Frederiksholms Kanal 26, 1220 København K P-enhed: 1011096758, Frederiksholms Kanal 25, 1220 København K P-enhed: 1029075146, Teglholmsgade 1, 2450 København SV Cvr. 29634750 Styrelsen for 