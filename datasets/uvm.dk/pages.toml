["https://www.uvm.dk/dagtilbud/lovgivning--politiske-aftaler-og-puljer/minimumsnormeringer-i-privatinstitutioner"]
title = "Minimumsnormeringer i privatinstitutioner | Børne– og Undervisningsministeriet"
full_description = "Den 1. januar 2025 træder bekendtgørelse om opgørelse af normering i privatinstitutioner i kraft, og privatinstitutioner skal hermed sikre en normering, som indebærer, at der minimum skal være én pædagogisk personale pr. tre børn i vuggestue og minimum én pædagogisk personale pr. seks børn i børnehave. Normeringen skal følge barnets alder, så børn, der rykkes i børnehave, før de er fyldt tre år, sikres en normering på minimum 1 pædagogisk personale pr. 3 børn – svarende til en vuggestuenormering. Børne- og Undervisningsministeriet har udarbejdet et eksempel på et opgørelsesværktøj i form af et excelark til beregning af normering, som privatinstitutionerne frit kan vælge at anvende til beregning af privatinstitutionens normering. Der stilles ligeledes en videoguide til rådighed, som trin for trin vejleder i, hvorledes opgørelsesværktøjet udfyldes korrekt for at beregne privatinstitutionens normering. Børne- og Undervisningsministeriet står ikke til rådighed for brugervejledning i Excel. Hent eksempel på opgørelsesværktøj (xlsx) Videoguide Læs mere Bekendtgørelse om opgørelse af normering i privatinstitutioner (retsinformation.dk) Vejledning om opgørelse af normering i privatinstitutioner (retsinformation.dk)"
