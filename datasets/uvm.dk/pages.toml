title = "Særlige specialundervisningstilbud (tidligere interne skoler) | Børne– og Undervisningsministeriet"
description = "Information om behandlings- og specialundervisningstilbud til børn og unge og specialundervisningstilbud på børne- og ungehjem (tidligere interne skoler)."
full_description = "Forside Specialundervisningstilbud på børne- og ungehjem (SBU) og behandlings- og specialundervisningstilbud (BOS) Find information om specialundervisningstilbud på børne- og ungehjem og om behandlings- og specialundervisningstilbud (tidligere interne skoler). Kvalitetsaftaler for SBU og BOS Den kommune, som tilbuddet ligger i (beliggenhedskommunen), skal have en indgået en kvalitetsaftale med tilbuddet, før der kan henvises elever dertil. Henvisning til SBU og BOS For at henvise en elev til et SBU eller et BOS skal der være truffet to afgørelser. Der skal træffes en afgørelse både ud fra barnets lov og ud fra folkeskoleloven. Det kommunale tilsyn med kvalitetsaftaler mv. Den kommune, som et specialundervisningstilbud ligger i (beliggenheds-kommunen), har myndighedsansvaret for og fører tilsyn med tilbuddet. Love og regler Her finder du love og centrale bekendtgørelser med betydning for behandlings- og specialundervisningstilbud samt specialundervisningstilbud på børne- og ungehjem samt vejledninger om fortolkningen af love og regler. Vejledning og rådgivning Kommunerne kan fremover få rådgivning fra et statsligt rejsehold til at forbedre kvaliteten af undervisningen på behandlings- og specialundervisningstilbud og specialundervisningstilbud på børne- og ungehjem. Spørgsmål og svar Få svar på de ofte stillede spørgsmål om de nye regler. Afrapporteringer Se afrapporteringer i relation til Børnene Først-aftalen på undervisningsområdet."
