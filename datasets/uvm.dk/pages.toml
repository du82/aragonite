["https://www.uvm.dk/saerligt-tilrettelagt-ungdomsuddannelse"]
title = "Særligt tilrettelagt ungdomsuddannelse (stu) | Børne– og Undervisningsministeriet"
description = "Stu er en tre&aring;rig ungdomsuddannelse for unge udviklingsh&aelig;mmede og andre unge med s&aelig;rlige behov."
full_description = "Forside Særligt tilrettelagt ungdomsuddannelse (stu) Stu er en treårig ungdomsuddannelse for unge med særlige behov, som ikke kan gennemføre en anden ungdomsuddannelse. Om stu Med stu kan unge med særlige behov udvikle deres personlige, sociale og faglige kompetencer. Målgruppe og optagelse Stu henvender sig til unge med særlige behov. Uddannelsens tilrettelæggelse Stu tilrettelægges individuelt og består af undervisning og praktiske aktiviteter, herunder praktik i virksomheder og institutioner. Uddannelsens elementer skal beskrives i en forløbsplan for uddannelsen. Ressourcepapir og uddannelsesbevis Der er ikke eksamener i den særligt tilrettelagte ungdomsuddannelse. Overgangen til, hvad den unge skal efter stu, forberedes med et ressourcepapir, og uddannelsen afsluttes med et uddannelsesbevis. Evalueringer, benchmarkanalyse og best practice Epinion har gennemført en række evalueringer og en benchmarkanalyse af stu for ministeriet. Spørgsmål og svar Oftest stillede spørgsmål og svar om stu. Ansvar og aktører Ansvaret for tilrettelæggelse af særligt tilrettelagt ungdomsuddannelse er placeret kommunalt, men kommunen kan indgå kvalitetsaftale med forskellige uddannelsessteder om tilrettelæggelse af uddannelsen. Love, regler og politiske aftaler Find gældende love og regler for stu og se de seneste politiske aftaler. STU-aftale Regeringen og et bredt flertal i Folketinget har den 24. maj 2022 indgået en aftale, der skal sikre unge med særlige behov flere rettigheder, når de skal vælge en ungdomsuddannelse. VIBUS Vidensenhed om børn og unge med særlige behov."
