["https://www.uvm.dk/dagtilbud/om-dagtilbud/private-pasningsordninger"]
title = "Private pasningsordninger | Børne– og Undervisningsministeriet"
description = "Forældre kan få tilskud til at ansætte en privat børnepasser, hvis kommunen godkender pasningsaftalen."
full_description = "Private pasningsordninger er ordninger, hvor forældre modtager et økonomisk tilskud fra kommunen til brug for ansættelse af en privat børnepasser. Den private pasningsordning baserer sig på en aftale mellem forældrene og den private børnepasser. Kommunen skal altid godkende pasningsaftalen som betingelse for, at forældrene kan modtage et økonomisk tilskud. Private pasningsordninger er omfattet af dagtilbudslovens generelle formålsbestemmelse om blandt andet at skulle skabe trivsel, udvikling og læring for barnet, men de er ikke omfattet af dagtilbudslovens specifikke formål for dagtilbud samt kravet om pædagogiske læreplaner mv. Private pasningsordninger kan fx drives som institutionslignende pasningsordninger eller dagplejelignende pasningsordninger. Tilsyn Kommunen skal føre tilsyn med den private pasningsordning, ligesom kommunen skal give tilladelse, hvis flere end to børn passes mod betaling. Foregår pasningen i et privat hjem, kan der gives tilladelse til pasning af op til 5 børn. Varetages pasningen af flere personer, kan kommunalbestyrelsen give tilladelse til, at der kan modtages op til 10 børn. Opdateret 18/10 2024 kl. 12:48 Hvad er forskellen på privat dagpleje og private pasningsordninger? Privat dagpleje er et dagtilbud til børn, der er baseret på en aftale om drift mellem kommunen og den private dagplejer. Den private dagpleje er derved en del af den kommunale forsyning. Private pasningsordninger er baseret på en privat pasningsaftale mellem den private børnepasser og forældrene. Den private pasningsordning drives som udgangspunkt uden offentlige midler og finansieres helt eller delvist ved forældrenes betaling. Det er dog muligt for forældre at søge om tilskud til privat pasning. Kommunalbestyrelsen kan beslutte, at der kun gives et tilskud til privat pasning til forældre med børn i en bestemt del af aldersgruppen. Reglerne om tilskud til privat pasning er ikke omfattet af de almindelige regler for forældrebetaling og tilskud i dagtilbud. Forældre kan derfor ikke få økonomisk fripladstilskud i forbindelse med tilskud til privat pasning. Private pasningsordninger må alene anvende betegnelsen privat pasningsordning om ordningen i alle offentlige sammenhænge. Opdateret 18/10 2024 kl. 12:51 Hvordan oprettes en privat pasningsordning? En privatpasningsordning kan være organiseret på en hvilken som helst måde, fx én eller flere fysiske personer eller en juridisk person såsom et A/S, ApS, I/S eller en fond. Uanset hvordan pasningen tilrettelægges, skal private pasningsordninger, der modtager flere end to børn til pasning mod betaling, have tilladelse fra kommunalbestyrelsen til at modtage børn til pasning. Der skal i så fald foreligge en pasningsaftale mellem den private børnepasser og forældrene, som skal godkendes af kommunen, førend der kan modtages børn til pasning eller udbetales tilskud til pasningen. Private pasningsordninger kan eksempelvis oprettes ved at forældrene ansætter en passer, ved at flere selvstændige passere går sammen, eller ved at ejeren af en selvstændig pasningsordning ansætter en eller flere børnepassere. Den konkrete pasningsaftale skal dog altid indgås af forældrene og den person, der passer barnet. Børnepasseren skal ligeledes godkendes af kommunalbestyrelsen, hvis der modtages flere end to børn. Hvis flere selvstændige pasningsordninger ønsker et fælles pasningssted, skal pasningsstedet godkendes af kommunalbestyrelsen, herunder om stedet er egnet til flere pasningsordninger. Opdateret 18/10 2024 kl. 12:53 Hvad skal en pasningsaftale indeholde? Følgende oplysninger kan fremgå af en pasningsaftale. Listen er vejledende: Navn, adresse og eventuelt CVR-nummer på aftalens parter. Pasningsadresse og telefonnummer. Antal af børn i pasningen, samt navnet og CPR-nummeret for barnet. Forventet pasningsperiode. Barnets pasningsbehov/børnepasserens arbejdstid. Fridage og ferie - herunder omfang og vilkår for brug af vikar(er). Betalingen for pasningen pr. måned (hvilke udgifter søges dækket). Hvilke opsigelsesvarsler gælder fra forældrenes side og fra børnepasserens side. Hvor i kommunen kan yderligere oplysninger fås (kontaktperson). Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven)"
year_published = 2025
