["https://uvm.dk/sitecore/content/global/news/uvm/2025/feb/250225-trivselskommissionens-anbefalinger-er-klar"]
title = "Trivselskommissionens anbefalinger er klar | Børne– og Undervisningsministeriet"
full_description = 'Vi skal have en ny måde at tale om trivsel på. Børns smartphonedebut skal udskydes til, de er 13 år, og telefonerne skal helt ud af grundskolen. Vi skal styrke børn og unges tro på egne evner, ansvarsfølelse og vedholdenhed. Alle børn og unge bør have en fritidsaktivitet sammen med andre. Sådan lyder nogle af de anbefalinger, som Trivselskommissionen kommer med i sin afrapportering. Afrapporteringen består af kommissionens trivselsforståelse, et statusbillede på børn og unges trivsel, en analyse af årsager til trivselsudfordringerne samt kommissionens anbefalinger til løsninger. ”Kommissionens ambition er at præsentere en ny vej frem. Et sporskifte. Afrapporteringen ’Et dansk svar på en vestlig udfordring’ dækker over ambitionen om, at formulere et dansk svar på de trivselsudfordringer, vi er stillet overfor – med udgangspunkt i det, vi er gode til herhjemme: pædagogik, dannelse, civilsamfund, livsoplysning, karakterdannelse og fællesskaber. Et svar, hvor børn og unge selv, forældre, pædagoger, lærere, trænere og frivillige i civilsamfundet bliver en del af løsningen," siger Rasmus Meyer, formand for Trivselskommissionen. ”Kommissionens anbefalinger er både væsentlige og vigtige. Smartphonen skal ud af de mindste børns liv og erstattes af fritidsaktiviteter sammen med andre. Derfor er jeg også glad for, at vi nu sparker smartphonen ud af skolen og forhåbentlig kan vi fylde tiden op med sport, leg og kulturoplevelser. Samtidig lægger kommissionen op til en vigtig debat om det moderne forældreskab og et opgør med den måde, vi har talt om trivsel på tidligere. For det er naturligvis ikke en sygdom at være ung, og vi er nødt til at være ærlige omkring, at vi alle møder bump på vejen," siger kulturminister Jakob Engel-Schmidt. ”Jeg kan allerede nu sige, at regeringen bakker op om mobilfrie folkeskoler. Vi går derfor nu i gang med at forberede en lovændring, der med respekt for lokal medbestemmelse skal få mobilerne ud af både klasselokaler og skolegårde. Derudover er der flere andre af kommissionens forslag, som vil blive til virkelighed. Vi har for eksempel i sidste uge besluttet at afsætte et stort beløb til, at flere familier med lave indtægter kan få deres barn på efterskole," siger Børne- og undervisningsminister Mattias Tesfaye. “Langt de fleste danske børn og unge har et trygt liv og trives. Det skal vi glæde os over. Men når der samtidig er kommet flere børn og unge i gruppen, der er i dårligst trivsel og færre, i gruppen, der trives bedst - så kalder det samtidig på handling. Tak til Trivselskommissionen for gennemarbejde anbefalinger til, hvordan vi fremmer børn og unges trivsel. Jeg synes, at anbefalingerne understreger en vigtig pointe: At trivselsudfordringerne skal løses i et fællesskab mellem børnene og de unge selv, forældre og familier, civilsamfund og forenings- og fritidsliv, institutioner, skoler og erhvervsliv. Jeg er sikker på, at mange gode kræfter kan og vil bidrage til og tage ansvar for at give et solidt dansk svar på opgaven," siger økonomiminister Stephanie Lose Trivselskommissionens anbefalinger Trivselskommissionen har i alt udarbejdet 35 anbefalinger, og de skal – om end de har forskellig målgrupper og forskellig karakter – ses som en helhed, der samlet vil bidrage til, at børn og unge fremadrettet får bedre forudsætninger for at trives og leve gode børne- og ungeliv. Læs anbefalingerne Læs Trivselskommissionens afrapportering – herunder anbefalingerne (pdf) Læs pixiudgaven af Trivselskommissionens afrapportering og anbefalinger (pdf) Trivselskommissionens arbejde Trivselskommissionen blev nedsat i august 2023 af regeringen og har haft til opgave at komme med anbefalinger, der understøtter børn og unges trivsel, myndiggørelse og livsmod. Kommissionen har igangsat et omfattende vidensarbejde baseret på eksisterende forskning og undersøgelser, eksterne undersøgelser og inddragende aktiviteter, som kommissionen har iværksat, samt inputs fra forskere, fagpersoner og en lang række interessenter. Trivselskommissionens medlemmer er: Rasmus Meyer (formand), forstander, Krogerup Højskole Andreas Rasch Christensen, forskningschef, VIA University College Christine Ravn Lund, forkvinde, Dansk Ungdoms Fællesråd Hanne Kirk, programleder, COOP Crew Karin Ingemann, udviklingschef, Danmarks Idrætsforbund Khalil Abdeddaim, playmaker (frivillig træner), GAME Lene Tanggaard, rektor, Designskolen Kolding, professor, Aalborg Universitet Marie Holt Hermansen, forhenværende formand, Danske Skoleelever Mie Oehlenschläger, uafhængig tech- og policyrådgiver Simon Calmar Andersen, chef, TrygFondens Børneforskningscenter, professor i statskundskab, Aarhus Universitet Vibeke Jenny Koushede, dekan, Det Samfundsvidenskabelige Fakultet, Københavns Universitet.'
year_published = 2025
