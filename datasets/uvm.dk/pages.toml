["https://www.uvm.dk/dagtilbud/plads-i-dagtilbud/lukkedage-og-aabningstider"]
title = "Lukkedage og åbningstider | Børne– og Undervisningsministeriet"
description = "Det er kommunerne, som fasts&aelig;tter &aring;bningstiden og lukkedagene i dagtilbuddene."
full_description = "Lukkedage Forældre med et barn i dagtilbud har ret til pasning på alle hverdage. Der er ikke ret til pasning i weekenden, på helligdage samt den 5. juni (Grundlovsdag) og den 24. december (Juleaftensdag). Kommunerne kan planlægge lukkedage i dagtilbuddene på øvrige almindelige hverdage. Forældre skal altid have tilbud om alternativ pasning på disse lukkedage. Lukkedage må kun lægges på hverdage, hvor der er meget få børn, der ville benytte dagtilbuddet, og hvor udgiften ved at holde åbent ville være uforholdsmæssigt omkostningstung. Det kan for eksempel være i sommerferien, mellem jul og nytår eller fredagen efter Kristi Himmelfartsdag. Det er kommunerne selv, der skal fastsætte grænsen for lavt fremmøde. Information til forældre I god tid forinden lukkedage skal kommunerne informere forældrene om, at der afholdes lukkedage, og at kommunen stiller et alternativt dagtilbud til rådighed. Kommunerne skal også i god tid informere forældrene om, hvor den alternative pasning finder sted. Oversigter over lukkedage findes på kommunernes egne hjemmesider. Åbningstider Der stilles ikke specifikke krav til åbningstiderne i dagtilbuddene i dagtilbudsloven. Men det er lovfastsat, at den daglige åbningstid skal udgøre et reelt pasningstilbud, og at åbningstiden under ét skal fastsættes, så den er egnet til at dække det lokale behov for fleksible pasningsmuligheder i dagtilbud. Hvis der er behov for det lokalt, kan dagtilbud oprettes med åbent både i dag- og nattetimerne. I januar 2017 offentliggjorde ministeriet en undersøgelse af dagtilbud med udvidede åbningstider (pdf). Undersøgelsen viser, hvilke kommuner der tilbyder pasningstilbud uden for almindelig arbejdstid, og hvordan kommuner og daginstitutioner organiserer fleksible pasningstilbud. Undersøgelsen viser også kommunernes oplevelse af efterspørgslen og brugen af fleksible pasningstilbud, og hvordan kommunerne tilrettelægger alternativ pasning på lukkedage. Undersøgelsen er foretaget af KORA."
