["https://www.uvm.dk/sitecore/content/global/news/uvm/indlaeg-og-taler-af-m/2025/mit-nytaarsforsaet-i-2024-var-simpelt-jeg-skulle-tale-med-tusind-unge-her-er-hvad-jeg-laerte"]
title = "Mit nytårsforsæt i 2024 var simpelt. Jeg skulle tale med tusind unge. Her er, hvad jeg lærte | Børne– og Undervisningsministeriet"
full_description = "Jeg er forelsket. Igen. Denne gang ikke i en kvinde, men i en gruppe: Teenagerne! Mit nytårsforsæt i 2024 var simpelt. Jeg skulle tale med tusind unge. Om deres valg: gymnasiet eller erhvervsuddannelse? I den forbindelse har jeg besøgt gymnasier over hele landet. Sludret med efterskoleelever på et folkemøde i Valbyparken. Lyttet opmærksomt på fremtidsdrømme fra en 8. klasse på Lolland. Talt med lærlinge i en skurvogn lidt uden for Haderslev. På skole efter skole har jeg prøvet at gemme ministeriets talepapir væk og i stedet lytte nysgerrigt. Jeg vidste nemlig, at 2024 ville blive et år med mange politiske diskussioner om ungdomsuddannelserne. En større reform har været undervejs længe. Men politikere har det med at diskutere problemerne i det uddannelsessystem, hvor de selv har gået. Og dermed skabes fremtidens skole ved at reformere nutidens skole på baggrund af en diskussion af fortidens skole. Det er dømt til at gå galt. Jeg vil derfor gerne, at Christiansborg blev forstyrret af virkeligheden, af teenagerne. Så hvad fortalte de mig i 2024? Først og fremmest, at stadig flere afviser den skarpe sondring mellem teori og praksis. Flere unge på erhvervsuddannelserne vil gerne udfordres i boglige fag på gymnasialt niveau. Mange gymnasieelever drømmer om praktisk undervisning og undervisningsforløb i samarbejde med erhvervslivet. Det er præcis derfor, at jeg er forelsket. De unge afviser den gamle verdens adskilte kategorier: Værktøj eller bøger? Erhvervsliv eller skolebænk? At vide eller at kunne? Mange af dem svarer: både-og! Man skal selvfølgelig ikke altid indrette skolen efter de unges egne ønsker. Uddannelsespolitik må også handle om, hvad samfundet vil med de unge. At næste generation forstår sig selv som en del af noget større. Med et ansvar over for historien, medmennesker, naturen og de næste generationer. Nogle gange er det derfor nødvendigt, at de voksne holder fast i erfaringer og strukturer, som har virket gennem mange år. Når regeringen alligevel har foreslået at oprette en ny erhvervs- og professionsrettet gymnasieuddannelse (epx), så skyldes det blandt andet, at de unge har fat i noget væsentligt: Der er brug for at bygge bro mellem teori og praksis. Og som altid dækker tendenser i ungdommens tilsyneladende tilfældige ønsker over nogle mere grundlæggende forandringer i samfundet. Så hvad reagerer de mon på? Mit bud er følgende: For det første reagerer de unge på en hastig teknologisk udvikling, særligt omkring kunstig intelligens (AI). Unge har aldrig været maskinstormere. Heldigvis. Men mange elever er ramt af et enormt meningstab i disse år. Hvorfor bruge flere timer på en engelskaflevering, hvis ChatGPT kan løse hovedparten af opgaven på sekunder? At bede de unge om at slukke for AI virker lige så meningsløst på nutidens unge, som hvis vi andre var blevet bedt om at bruge fjer og blæk. Her har en mere erhvervs- og professionsrettet undervisning enormt meget at byde på. I et mere anvendelsesorienteret undervisningsforløb, hvor der skrives handelsbreve med hjælp fra kunstig intelligens, bliver det mere tydeligt for eleverne, hvorfor gode engelskfærdigheder er forudsætningen for, at mennesker kan beherske maskinen – og at det ikke ender omvendt. Ligesom det er lettere at forstå, hvilke etiske krav der stilles til en ansat i sundhedsvæsenet, når man er blevet undervist i operationsrobotternes muligheder og begrænsninger. Menneskets evne til at foretage etiske og æstetiske valg på et solidt fagligt grundlag bliver stadig mere efterspurgte, efterhånden som robotter og AI fylder mere i både samfunds- og arbejdsliv. Mennesket er i stand til noget, som ChatGPT ikke er i stand til. Men det forudsætter både teoretisk indsigt, praktiske færdigheder og en solid portion almen dannelse. Vi skal altså ikke være bange for kloge maskiner, vi skal være bange for dumme mennesker. Og derfor bør vi heller ikke være bekymrede for, at mange unge afviser den skarpe sondring mellem det tyvende århundredes adskilte kategorier: At vide eller at kunne. Alment gymnasium eller erhvervsuddannelse. Gode gamle Grundtvig ville heller ikke acceptere denne adskillelse af krop og ånd: Man skal gribe, før man kan begribe, sagde han. Han ville derfor nok mene, at de to unge, der i oktober foreslog mig at integrere AI på en erhvervs- og professionsrettet gymnasieuddannelse, er på helt rette spor. For det andet reagerer unge på det store paradoks i samtiden, at vi aldrig har været så oplyste om verdens uretfærdigheder, samtidig med at flertallet af unge ifølge undersøgelser har såkaldt lav demokratisk selvtillid. Vi scroller på Instagram og ser klimakatastrofer og døde børn i krigszoner. Men hvad skal man dog gøre ved al denne lidelse? Thomas Vinterbergs fremragende miniserie, ’Familier som vores’, handler om en dansk befolkning, der flygter fra oversvømmelser. Ikke en befolkning, der bliver og bygger diger og dæmninger. Vi kritiserer og diskuterer og forarges som aldrig før, men savner samtidig oplevelsen af, at vi faktisk kan påvirke vores omgivelser. Men kritik er den dovnes terræn. Jeg glæder mig derfor over unge, der skruer i deres knallerter. Begynder at bage surdejsbrød. Forlænger levetiden på et par jeans. Eller koder deres egne computerspil. Det er ikke kun en længsel efter materialitet. Jeg tolker det også som et enormt sympatisk behov for selv at være med til at formgive verden. De vil ikke kun være forbrugere og debattører. De vil være deltagere og producenter. Denne længsel skal skolen gribe. Den nye folkeskolelov, som eleverne især kommer til at kunne mærke til sommer, har derfor markant flere timer til de ældste elever med praktiske og æstetiske fag. Det er blandt andet fordi madkundskab, billedkunst og håndværk og design er fag, der fremelsker elevernes evne til at formgive og dermed påvirke deres omgivelser. Ligesom det nye valgfag om teknologi til skolens ældste elever skal lære eleverne at forstå og påvirke teknologien, så de kan herske over maskinen, i stedet for at blive behersket af bigtech-firmaer fra Kina og Silicon Valley. Det er altså fag med stort demokratisk potentiale. Når unge efter grundskolen i højere grad søger denne kombination af teori og praksis, kan det være et udtryk for, at den næste generation ikke bare vil flygte fra katastroferne. De vil slippe apatien og tage ansvar for at gøre noget ved problemerne. Derfor elsker jeg den stigende interesse for iværksætteri på handelsgymnasierne. Derfor bliver jeg glad, når snedkerlærlinge gerne selv vil tegne de opgaver, de skal udføre. Og derfor forstår jeg de fire hf-elever på et københavnsk gymnasium, der fortalte mig, at det vigtigste for deres uddannelsesvalg var, at de vil gøre en forskel. Det ville have glædet Søren Kierkegaard, der sagde; det er ikke din skyld, men det er dit ansvar! Og derfor lytter jeg også ekstra meget, når unge fortæller mig, at de meget gerne vil have, at iværksætteri, design og formgivning tænkes mere aktivt ind i den nye gymnasieuddannelse, epx, end der ellers oprindeligt var lagt op til. Og endeligt – for det tredje – reagerer unge på en samtid præget af, at de konstant bedømmes på, hvem de er, hvordan de ser ud, og hvilken identitet de søger at etablere. Unge er ikke skrøbelige snowflakes, som de ellers ofte nedladende bliver karakteriseret som. De kan godt holde til at blive bedømt. Men de vil bedømmes på deres evner, ikke deres væren. Det kan være svært for os voksne helt at forstå, hvor radikalt smartphonen har ændret ungdomslivet. For alle os født i 80’erne er det rart med MobilePay, Netflix og Google Maps i baglommen. Det har erstattet kontanter, dvd’er og Kraks Kort. Men det er jo dybest set bare vores gamle liv, der er blevet digitalt. Nutidens unge har ikke fået lov til først at udvikle sociale relationer i skolegården, finde sig selv som teenagere og først bagefter få foræret en digital værktøjskasse, der gør voksenlivet lettere. Hele deres personlige udvikling sker, samtidig med at skærmen er tændt. For de unge betyder Snapchat, at vennerne konstant ved, hvor man befinder sig, og hvem man er sammen med. Selfies på sociale medier skaber et permanent spejlkabinet, som slider selvbilledet op. Og når dette kombineres med, at religion fylder mindre, og at unge er frisat fra nødvendigvis at skulle gå i fars eller mors fodspor og derfor har en oplevelse af at stå mere alene, så beskriver nogle teenagere tilværelsen som én lang eksamenstilstand. Det er blevet kaldt en perfekthedskultur. Nogle få stresser helt sammen og får stillet diagnoser og udskrevet medicin. De fleste går bare rundt og føler sig pressede. Jeg er ikke imod at unge bedømmes. Men de skal bedømmes på det, som de kan. Ikke hvem de er. Det er derfor, at vi for nyligt afskaffede vurderingen af uddannelsesparathed, der blandt andet bad skolen om at vurdere elevernes tolerance. Og netop derfor er det også forståeligt, hvis unge længes efter de karakteregenskaber, som den nye erhvervs- og professionsrettede gymnasieuddannelse (epx) har som formål at fremelske. Praksisfaglige fag, undervisning og eksamen flytter nemlig blikket væk fra eleven og hen på produktet. Og dermed de unges blik væk fra spejlet og hen på problemstillingen. Med mulighed for at glemme sig selv uden at miste sig selv. Sådan bliver fejl ikke noget, der skal ændres inde i mennesket. Enhver håndværker eller sygeplejerske ved, at perfekt udført arbejde er noget, man stræber efter, ikke noget man realiserer. Mosaikgulvet kan altid lægges smukkere. Sygeplejen kan altid udføres bedre. Derfor kan man også højest få sølvmedalje til en svendeprøve. Hvor videnskab er en stræben efter sandhed, så er praksisfaglighed en stræben efter det gode – både i en etisk og æstetisk forstand. De dyder, der fremelskes i sådan et undervisningsmiljø, handler om at fordybe sig i gentagelsen, at gøre sig umage og at kunne optræde professionelt over for kolleger, kunder eller borgere. Det erhvervs- og professionsrettede handler altså ikke kun om at tilegne sig teoretisk viden og praktiske færdigheder, men også om at kunne omsætte det bedst muligt i en situation, hvor økonomi, tid og andre ressourcer er begrænsede. Og med en dyb – nærmest kristen – erkendelse af, at intet af det, mennesket kan frembringe, er perfekt. Det har været åbenlyst for alle, at de muligheder, vi har til unge efter grundskolen, ikke fungerer efter hensigten. Der er for mange, der kæmpede med tal og bogstaver i folkeskolen, men alligevel starter på en gymnasial uddannelse efterfølgende, og som derfor ikke trives rent fagligt på en meget boglig uddannelse. Omvendt er der mange andre, der dropper ud af erhvervsskolerne, fordi de synes, det er svært at vælge mellem 101 meget specifikke erhvervsuddannelser allerede som 16-17 årig. Disse udfordringer er ikke skolernes eller undervisernes skyld. De laver et virkeligt flot arbejde. Det skyldes derimod det gammeldags valg, som vi beder de unge om at træffe: Mellem teori eller praksis. På Christiansborg har vi stadig målsætninger om, hvor mange der skal vælge det ene eller det andet lige efter folkeskolen. Vi vil så gerne have, at de unge passer ind i kasserne. Men trods adskillige reformer afviser de unge stadig. Måske fordi det er strukturer, der er skabt i en anden tid. Til et arbejdsmarked præget af industrialiseringens arbejdsdeling, hvor man adskilte hovedet fra kroppen. Til en opdragelse, der handlede mere om at frisætte unge end om at hjælpe dem med at slå rødder. Til et samfund, hvor teknologi primært handlede om at sætte strøm til den gamle verden og ikke som nu, hvor AI præger det nye menneske. Det er disse modsætninger, som jeg har oplevet, de unge reagerer på. Og selvom vi ikke skal være et infantilt samfund, som altid gør, hvad vores børn foreslår, så bør vi lytte opmærksomt og forstå, hvorfor vores nuværende skarpe vejvalg mellem teori og praksis ikke fungerer. Det er som regel fra næste generation, at man skal høre de mest ærlige sandheder om det eksisterende. Og det budskab jeg fik i 2024 var præcist sådan. Ærligt. Men også forfriskende præcist og klogt. Det er derfor, jeg grundlæggende er optimist på fremtidens vegne. Det er derfor, jeg elsker denne generation."
year_published = 2025
clearnet = "https://www.uvm.dk/sitecore/content/global/news/uvm/indlaeg-og-taler-af-m/2025/mit-nytaarsforsaet-i-2024-var-simpelt-jeg-skulle-tale-med-tusind-unge-her-er-hvad-jeg-laerte"
