["https://www.uvm.dk/folkeskolen/folkeskolens-proever/proeveafholdelse/nedbrud-af-3--parts-programmer-under-proeven"]
title = "Nedbrud af 3. parts programmer under prøven | Børne– og Undervisningsministeriet"
full_description = "Hvad er et 3. parts program? Et 3. parts program er fx et oplæsningsprogram, online ordbøger, elektroniske hjælpemidler mv., som en eller flere elever anvender ved prøverne. Der er tale om programmer mv., som ikke er stillet til rådighed af STIL eller STUK, og som ikke serviceres af STUK eller STIL. Hvad gør man, hvis et 3. parts program går ned under en prøve? Hvis et 3. parts program går ned under en prøve, skal skolen vurdere, om nedbruddet af 3. parts programmer har indflydelse på elevernes besvarelse af prøven. Hvis dette er tilfældet, har skolen mulighed for at sætte prøven på pause for de pågældende elever og genoptage den, når 3. parts programmet igen fungerer. Prøven forlænges derefter med den tid, den har været sat på pause. Eleverne skal holdes under opsyn i den tid, hvor prøven er sat på pause, så de ikke har mulighed for at kommunikere med hinanden. Eleverne må ikke forlade prøvelokalet uden opsyn. Husk at informere forældrene, hvis skolen forlænger tiden ved en eller flere prøver. Hvem kontakter man, hvis et 3. parts program går ned under en prøve? Hvis et 3. parts program går ned under en prøve, og prøven sættes på pause, skal skolen kontakte 3. parts programmets udbyder og Kontor for Prøver, Eksamen og Test på telefon 3392 6100. Hvad gør man, hvis 3. parts programmet ikke kommer op at køre igen? Hvis et 3. parts program ikke kommer op at køre igen, afventes der vejledning og information fra styrelsen vedrørende videre håndtering. Hvad betyder fejl og mangler under en prøve? Fejl og mangler er et begreb fra prøvebekendtgørelsen (kapitel 9). Det betyder, at der har været forstyrrelser i prøveaflæggelsen, fejl i selve prøven eller fejl ved prøveforløbet. Udfordringer med 3. parts programmer kan i nogle tilfælde betragtes som fejl og mangler. Hvad skal skolen gøre, hvis der har været fejl eller mangler under en prøve? Hvis der er tale om væsentlige fejl og mangler i forbindelse med prøver, herunder fejl og mangler, der kan have haft betydning for karakterfastsættelsen, tilbyder skolens leder en omprøve. En omprøve ved en skriftlig prøve vil tidligst kunne aflægges ved næste prøvetermin. Det vil sige enten i prøveterminen december-januar eller i prøveterminen maj-juni afhængigt af, hvilken prøvetermin prøven, som giver anledning til en omprøve, er aflagt. Kan elever få en lavere karakter til en omprøve i forbindelse med fejl og mangler? Nej. En omprøve kan ikke resultere i en lavere karakter, jf. § 66, stk. 1, i prøvebekendtgørelsen. Skal elever, der tager imod tilbuddet om omprøve, have et bevis? Elever, der tilbydes en omprøve og tager imod tilbuddet, skal i første omgang have udstedt et bevis, der indeholder karakteren for den prøve, som eleven er blevet tilbudt omprøve i. Efter omprøven udsteder skolen et nyt bevis til eleven, såfremt eleven har forbedret sin prøvekarakter."
year_published = 2025
clearnet = "https://www.uvm.dk/folkeskolen/folkeskolens-proever/proeveafholdelse/nedbrud-af-3--parts-programmer-under-proeven"
