full_description = "Forside Folkeskolen Organisering og ledelse Driften af folkeskolen er en kommunal opgave. Folkeskoleloven giver dog også beføjelser til skolebestyrelsen og skolens leder. Ministeriet fører tilsyn med folkeskolen. Skolens ledelse Skolebestyrelsen fastsætter principper for skolens virksomhed. Skolens leder har ansvar for skolens pædagogiske og administrative drift. Den kommunale opgave Kommunalbestyrelsen har ansvar for driften af folkeskolen herunder for udarbejdelse af kvalitetsrapporter. Forældrenes rolle Folkeskolens opgave skal løses i samarbejde med forældrene gennem dialog og arbejdet i skolebestyrelsen. Elevrådet og elevernes stemme i folkeskolen Eleverne kan være med til at påvirke skoledagen og skolens udvikling blandt andet gennem elevrådet. Tilsyn Ministeriet fører tilsyn med skolernes kvalitetsudvikling og kommunernes overholdelse af reglerne om undervisningstid og minimumstimetal."
