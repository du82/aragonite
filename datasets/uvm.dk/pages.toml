["https://www.uvm.dk/folkeskolen/folkeskolens-proever/faglig-forberedelse/oeveproever-og-eksempelproever/afproev-tekstfeltet-i-sprogfagene-inden-sommerens-proever"]
title = "Afprøv tekstfeltet i sprogfagene inden sommerens prøver | Børne– og Undervisningsministeriet"
full_description = "Afprøvning af tekstfeltet Eleverne har forinden afviklingen af skriftlige sprogprøver mulighed for at afprøve tekstfeltet, der er obligatorisk fra vinterterminen 2024/2025. Målet er, at alle skoler er trygge ved formatet og har haft mulighed for at afprøve tekstfeltet forud for øve- og sommerprøverne. Tekstfeltet er ikke bundet op på en bestemt prøve, hvilket betyder, at det er muligt at afprøve tekstfeltet sammen med et hvilket som helst prøveoplæg. Det kan både være tidligere prøveoplæg og/eller øvesæt, der findes på Prøvebanken, eller prøveoplæg der er udarbejdet i undervisningen. Se vejledningen nedenfor for hvordan en skole kan afprøve tekstfeltet. Prøvebanken.dk og udpakning af zip-filer På prøvebanken.dk kan skoler finde tidligere prøvesæt i engelsk, tysk og fransk, hvor tekstfeltet er integreret. Hvis skolen ønsker at afprøve tekstfeltet, skal skolen: Gå ind på Prøvebanken.dk Hente et prøvesæt med et integreret tekstfelt (en zip-fil) Distribuere denne til eleverne ved enten, at: a. pakke zip-filen ud inden eleverne modtager filen b. sende zip-filen til eleverne, der selv pakker filen ud på deres computer Eleverne kan nu benytte tekstfeltet heri til at besvare den stillede opgave Se styrelsens vejledning til udpakning af zip-filer (pdf) OBS. Når øveprøver og ordinære prøver i skriftlig fremstilling i engelsk, tysk og fransk skal afvikles, tilgås prøveoplæggene og tekstfeltet fra testogprøver.dk. Ved aflæggelse af disse prøver, skal der ikke udpakkes en zip-fil. Muligheder for anvendelse af digitale hjælpeprogrammer med tekstfeltet for elever, der aflægger prøve på særlige vilkår Tekstfeltet er blevet afprøvet i samarbejde med leverandørerne bag de mest anvendte læse- og skriveværktøjer, som ordblinde elever anvender, herunder AppWriter og IntoWords. Elever, der aflægger prøve på særlige vilkår, anvender digitale hjælpemidler i tekstfeltet med henblik på at blive stillet lige med øvrige elever i prøvesituationen. Det anbefales, at ordblinde elever anvender én af de ovenstående læse- og skriveværktøjer. Styrelsen anbefaler, at elever, der aflægger prøve på særlige vilkår, inden prøven, har afprøvet deres læse- og skriveværktøjer i tekstfeltet, så eleven føler sig tryg ved at bruge programmerne i en prøvesituation. Undervisere har mulighed for at hjælpe elever med at afprøve læse- eller skriveværktøjer i tekstfeltet ved at hente et prøvesæt med tekstfeltet i på Prøvebanken. Vigtig information om cloud-baserede hjælpeprogrammer Bemærk at nogle hjælpeprogrammer (for eksempel AppWriter eller IntoWords) ikke nødvendigvis har tilladelse til at anvendes på filer, der ligger lokalt på en elevs computer. Hvis en elev oplever problemer med at benytte for eksempel AppWriter Cloud på et opgavesæt, der er hentet ned fra prøvebanken, skal man derfor gøre følgende: Højreklik på AppWriter-udvidelsen i browseren Gå ind under ”Administrer udvidelsen” Klik på ”Tillad adgang til webadresser på filer” Hvis I oplever problemer med AppWriter eller et andet 3.-partsprogram bedes I kontakte leverandøren af programmet. Hvor længe gemmes besvarelsen i tekstfeltet, når vi afprøver tekstfeltet i undervisningen? Tekstfeltet er designet så det løbende gemmer en midlertidig kopi af elevens besvarelse lokalt i elevens browser, hvorfra prøvebesvarelsen udarbejdes. Det betyder, at hvis eleven ved en fejl kommer til at lukke sit browservindue eller slukke sin computer, vil elevens besvarelse stadig være at finde, når eleven igen åbner prøven med samme browser. Læs mere Om tekstfeltet, herunder i hvilke fag, det anvendes og tekstfeltets formål Om tekstfeltets funktioner (viden.stil.dk)"
year_published = 2025
clearnet = "https://www.uvm.dk/folkeskolen/folkeskolens-proever/faglig-forberedelse/oeveproever-og-eksempelproever/afproev-tekstfeltet-i-sprogfagene-inden-sommerens-proever"
