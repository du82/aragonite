full_description = "Forside Efterskoler Efterskolerne tilbyder samvær og undervisning svarende til folkeskolens ældste klasser. Om efterskoler Efterskolerne er et tilbud til alle unge mellem 14 og 18 år. Kort og godt om efterskolerne. Mål, planer og evaluering Efterskoler skal sætte mål for undervisningen og udarbejde indholds- og årsplaner. Afgangsprøve På de fleste efterskoler skal elever i 9. klasse aflægge folkeskolens afgangsprøve. Spørgsmål og svar Få svar på nogle af de oftest stillede spørgsmål om efterskoler. Love, vejledninger og politiske aftaler Her finder du love med betydning for efterskoler, centrale bekendtgørelser og vejledninger samt politiske aftaler. Tilsyn Tilsyn med efterskoler omfatter den faglige kvalitet, regeloverholdelse og skolens økonomi."
