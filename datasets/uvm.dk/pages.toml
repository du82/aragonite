["https://www.uvm.dk/dagtilbud/plads-i-dagtilbud"]
title = "Plads i dagtilbud | Børne– og Undervisningsministeriet"
description = "Alle b&oslash;rn i alderen 6 m&aring;neder og indtil skolestart har i henhold til pasningsgarantien ret til en plads i et dagtilbud i Danmark."
full_description = "Forside Dagtilbud Plads i dagtilbud Alle børn i alderen 6 måneder og indtil skolestart har i henhold til pasningsgarantien ret til en plads i et dagtilbud i Danmark. Det er kommunalbestyrelsen, som har pligt til at sikre, at pasningsgarantien overholdes, og at rammerne for optagelse, det sunde frokostmåltid samt lukkedage stemmer overens med dagtilbudslovgivningen. Pasningsgaranti Alle børn har ret til en plads i et alderssvarende dagtilbud til børn i alderen fra 26 uger og indtil barnets skolestart. Plads over kommunegrænser Forældre har rettigheder i forbindelse med at bevare en plads eller få tilbudt en plads i et dagtilbud ved flytning til en anden kommune. Optagelse i dagtilbud Det er den enkelte kommune, der fastsætter retningslinjer og træffer afgørelse om optagelse i dagtilbud, bortset fra privatinstitutioner. Lukkedage og åbningstider Det er kommunerne, som fastsætter åbningstiden og lukkedagene i dagtilbuddene. Tilskud og egenbetaling Her kan du læse om de forskellige tilskudsmuligheder, der eksisterer for forældre, samt læse mere om tilskud og egenbetaling generelt."
