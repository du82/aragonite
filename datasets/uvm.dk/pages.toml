title = "Aftale om folkeskolens kvalitetsprogram | Børne– og Undervisningsministeriet"
full_description = "Forside Folkeskolen Folkeskolens mål, love, regler og politiske aftaler Politiske aftaler Aftale om folkeskolens kvalitetsprogram Læs om initiativerne i Aftale om folkeskolens kvalitetsprogram - frihed og fordybelse, der blev indgået den 19. marts 2024. Om aftalen Læs mere om Aftale om folkeskolens kvalitetsprogram, økonomien bag aftalen og planen for aftalens ikrafttrædelse. Fagfornyelsen I Fagfornyelsen skal folkeskolens læreplaner fornyes og gøres mere enkle i tæt samarbejde med folkeskolens parter, eksperter og praktikere. Frisættelse af folkeskolen og mere indflydelse til skolebestyrelserne Læs mere om de eksisterende frihedsgrader og fleksibilitet i folkeskolen, og de nye frihedsgrader der er indført med folkeskolens kvalitetsprogram m.v. Mere praktisk undervisning og valgfrihed til de ældste elever Læs mere om den nye timetalsfordeling og de initiativer, der skal sikre mere praktisk undervisning, færre prøver og bedre faglokaler. Ro og rammer - nødvendigt for nogle, godt for alle Læs mere om initiativerne, der skal sikre mere ro i klassen, respekt om lærerne og trygge, stabile rammer om skolens hverdag. Drøftelser af centrale emner med folkeskolens parter og folkeskoleforligskredsen Med Aftale om folkeskolens kvalitetsprogram - frihed og fordybelse lægges der op til at fortsætte drøftelsen af centrale emner for folkeskolen."
