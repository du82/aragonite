["https://www.uvm.dk/ministeriet/ministeriets-hjemmesider/cookies"]
title = "Cookies | Børne– og Undervisningsministeriet"
description = "Læs om, hvordan ministeriets hjemmesider bruger cookies."
full_description = 'Børne- og Undervisningsministeriet indsamler på uvm.dk, stukuvm.dk, stil.dk, spsu.dk, eng.uvm.dk, duu.dk, sosupraktik.dk, ordblindhed.dk og børns-læring.dk oplysninger om vores brugere i overensstemmelse med databeskyttelsesloven. Oplysningerne indsamler vi for at yde den bedst mulige service og forbedre vores hjemmesider. De oplysninger vi indsamler er: IP-adresse (i anonymiseret form), sessions-ID (besøgs-ID) og tekniske oplysninger om den enhed, du tilgår hjemmesiden fra personoplysninger som du selv giver os, eksempelvis i forbindelse med tilmelding til nyhedsbreve, pressemeddelelser eller arrangementer svar i forbindelse med bruger- og tilfredshedsundersøgelser. Vi bruger cookies på vores hjemmesider Uvm.dk, stukuvm.dk, stil.dk, spsu.dk, eng.uvm.dk, duu.dk, sosupraktik.dk og børns-læring.dk anvender cookies ligesom stort set alle andre hjemmesider. En cookie er en fil, som lægges på din enhed (pc, smartphone, tablet eller lignende). Den gør det muligt at genkende din enhed og samle information om, hvilke sider og funktioner, der besøges med din browser. Men cookies kan ikke se, hvem du er, hvad du hedder, hvor du bor eller om enheden bruges af en eller flere personer. Den kan heller ikke sprede virus eller skadelige programmer. Første gang du lander på en af vores hjemmesider, ser du et banner med information om cookies til statistik. Hvis du klikker på linket "Nej tak til statistik-cookies ved at klikke her", lægges der ingen cookies til statistik. Vi bruger dog en cookie for at huske dit nej tak til statistik. Hvis du klikker dig videre til endnu en side uden at vælge "Nej tak ..." eller hvis du klikker "OK", lægges der en cookie til at samle statistik om din brug af hjemmesiden, og banneret forsvinder. Vi bruger statistikken til at forbedre brugervenligheden af vores hjemmesider og andre tjenester. Oplysningerne i statistikken er anonyme, og bliver ikke koblet til dig som bruger. Cookies ved brugerundersøgelser Når der gennemføres brugerundersøgelser, anvendes der cookies dels til at styre hvor mange gange, du som bruger ser invitationen til undersøgelsen. Dels registrerer cookies, om du har svaret på undersøgelsen, og sikrer dermed, at du ikke ser invitationen til undersøgelsen igen, efter du har svaret. Tredjeparts-cookies I visse tilfælde benytter vi også cookies, der stammer fra tredjeparter. Der henvises i øvrigt til oversigt over de enkelte cookies nedenfor. Sådan afviser eller sletter du cookies Ønsker du helt at undgå cookies, skal du slå cookies fra i din browser. Mange cookies bruges til at forbedre brugervenligheden eller funktionaliteten på websites. Derfor kan en deaktivering af cookies forhindre dig i at bruge bestemte dele af vores hjemmesider. Nedenfor har vi beskrevet hvordan og hvorfor vi benytter de anvendte cookies. Dine rettigheder Du har på grund af databeskyttelsesforordningen en række rettigheder i forhold ministeriets behandling af dine oplysninger. Du har ret til indsigt, ret til at gøre indsigelse mod behandlingen, ret til at få berigtiget, slettet eller blokeret oplysninger, der viser sig urigtige eller vildledende eller på lignende måde er behandlet i strid med lovgivningen. Du kan læse mere om dine rettigheder i Datatilsynets vejledning om de registreredes rettigheder (datatilsynet.dk). Børne- og Undervisningsministeriets databeskyttelsesrådgiver Ministeriet har udpeget en koncernfælles databeskyttelsesrådgiver, der blandt andet har til opgave at rådgive om persondatareglerne og overvåge ministeriets efterlevelse af reglerne. Dette omfatter ministeriets departement og de to styrelser Styrelsen for Undervisning og Kvalitet og Styrelsen for It og Læring. Ministeriets databeskyttelsesrådgiver er organisatorisk placeret i Styrelsen for It og Læring. Databeskyttelsesrådgiveren kan oplyse dig nærmere om reglerne for databeskyttelse. Databeskyttelsesrådgiveren kan også vejlede dig om dine rettigheder i forhold til behandling af personoplysninger i ministeriets to styrelser og departement. Databeskyttelsesrådgiveren kan kontaktes på e-mail: dpo@uvm.dk eller på tlf.: 2016 7513. Klager Du har ret til at klage over ministeriets behandling af dine oplysninger til Datatilsynet efter reglerne i databeskyttelsesforordningens artikel 77. Du kan kontakte Datatilsynet fra din digitale postkasse på borger.dk, ved almindelig e-mail til dt@datatilsynet.dk eller med almindelig post til Datatilsynet, Borgergade 28, 5., 1300 København K. Opdater samtykke Du kan til enhver tid ændre i dit samtykke til hvilke cookies der må sættes af hjemmesiden. Redigér indstillinger for cookies'
year_published = 2025
