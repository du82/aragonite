["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/dec/051224---amu-vest-har-indleveret-egenbegaering-om-konkurs"]
title = "AMU-Vest har indleveret egenbegæring om konkurs | Børne– og Undervisningsministeriet"
full_description = "Bestyrelsen for institutionen AMU-Vest har i dag indleveret egenbegæring om konkurs til Skifteretten i Esbjerg. Det sker, efter at bestyrelsen har vurderet, at AMU-Vest ikke længere har mulighed for at opretholde driften og svare sine økonomiske forpligtelser. AMU-Vest udbyder en række erhvervs- og arbejdsmarkedsuddannelser i Esbjerg. Institutionen har i flere år været udfordret økonomisk med årlige underskud og gældsætning samt et faldende antal elever og kursister. Styrelsen for Undervisning og Kvalitet (STUK) har siden 2017 forsøgt at understøtte institutionen med blandt andet tilsyn og likviditetslån ad flere omgange. På trods af det har institutionen dog ikke udsigt til at opnå en bæredygtig drift. Har du brug for at komme i kontakt med styrelsen omkring dit uddannelsesforløb? Er du elev eller kursist på AMU-Vest og har brug for at komme i kontakt med Styrelsen for Undervisning og Kvalitet, kan du kontakte styrelsen på + 45 33 92 50 00. Styrelsen for Undervisning og Kvalitet vil hurtigst muligt træffe beslutning om tildeling af uddannelsestilbuddene til en anden institution med henblik på at sikre det bedste forløb for kursisterne. Børne- og Undervisningsministeriet arbejder på, at der fortsat kan sikres et udbud af uddannelserne lokalt. ”Min absolutte førsteprioritet er, at elever og kursister i Esbjerg og omegn kan begynde på og færdiggøre deres uddannelse som planlagt. Og at de får så få dage som muligt uden undervisning. Det er fuldstændig afgørende for regeringen, at vi kan tilbyde uddannelser af høj kvalitet i hele landet. Jeg vil gerne garantere, at der fortsat bliver mulighed for at tage de erhvervsuddannelser og kurser, som AMU-Vest hidtil har udbudt, i den del af landet,” siger børne- og undervisningsminister Mattias Tesfaye. Underskud og skærpet tilsyn AMU-Vest er godkendt til at udbyde en række erhvervsuddannelser og arbejdsmarkedsuddannelser inden for blandt andet vejgodstransport, anlægsarbejde samt havn og terminal. AMU-Vest har været under skærpet økonomisk tilsyn siden 2017. Institutionen har igennem flere år haft årlige underskud som følge af et faldende antal elever og kursister og høje omkostninger til bl.a. bygninger. I 2021 udtrykte AMU-Vests revisor bekymring for institutionens økonomiske situation, og institutionen igangsatte en mere fokuseret tilpasning og genopretning af økonomien. AMU-Vests revisor har også i 2022 og 2023 udtrykt bekymring for institutionens økonomiske situation. Styrelsen for Undervisning og Kvalitet har løbende været i dialog med AMU-Vest og understøttet tilpasningen. Generelt er AMU-området løbende blevet prioriteret de seneste år. I 2020 og 2021 blev alle AMU-udbydere som følge af corona-hjælpepakkerne kompenseret for deres aktivitetsfald. Med trepartsaftalen mellem regeringen og arbejdsmarkedets parter fra 2023 blev der blandt andet afsat 119 millioner kroner årligt til varigt at videreføre takstforhøjelser samt en kvalitetspulje til udbydere af arbejdsmarkedsuddannelser, som AMU-Vest altså har modtaget en del af. AMU-Vest er derudover løbende blevet understøttet i form af statslige likviditetslån samt tildelt afdragsfrihed i dele af perioden. I perioden 2017-2022 bevilgede Børne- og Undervisningsministeriet institutionen likviditetslån for i alt 20,4 millioner kroner. På trods af flere års forsøg på økonomisk genopretning har institutionen dog ikke udsigt at kunne opnå en bæredygtig drift. Om AMU-Vest AMU-Vest er en selvejende institution, der modtager taxametertilskud for antallet af kursister/elever, som institutionen underviser. Det betyder, at institutionen ledes af en uafhængig bestyrelse, der over for Børne- og Undervisningsministeriet er ansvarlig for institutionens drift. Bestyrelsen er blandt andet ansvarlig for at forvalte institutionens midler, der overvejende består af statstilskud, så de er til størst mulig gavn for institutionens formål. AMU-Vest havde i 2023 149 årselever på AMU og 28 årselever på erhvervsuddannelser. Institutionen havde i 2023 ca. 50 årsværk ansat. AMU-Vests portefølje af udbud består af: arbejdsmarkedsuddannelser betegnet som fælles kompetencebeskrivelser (FKB’er) og erhvervsuddannelser relateret hertil. For tre af institutionens FKB’er gælder det, at AMU-Vest er eneudbyder eller afholder hovedparten af aktiviteten i landet."
year_published = 2025
