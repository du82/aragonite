["https://www.uvm.dk/folkeskolen/folkeskolens-proever/faglig-forberedelse/standpunktskarakterer"]
title = "Standpunktskarakterer | Børne– og Undervisningsministeriet"
description = "Om standpunktskarakterer og hvornår de skal afgives på 8., 9. og 10. klassetrin."
full_description = "Elevens præstation og standpunkt skal bedømmes på grundlag af de faglige krav til de enkelte fag på det tidspunkt, karaktererne gives. Der gives standpunktskarakterer mindst to gange om året i 8., 9. og 10. klasse. Der kan ikke gives standpunktskarakterer på andre klassetrin. Kriterier for at give standpunktskarakterer Standpunktskarakterer er udtryk for elevernes faglige niveau på det tidspunkt, karaktererne gives. Standpunktet fastsættes i forhold til de faglige mål, som gælder for faget. Det betyder, at standpunktskarakterer gives ud fra lærerens vurdering af, i hvor høj grad eleven opfylder fagets kompetencemål inden for de bindende færdigheds- og vidensområder i faget. Elevens arbejdsindsats eller opførsel i klassefællesskabet indgår som udgangspunkt ikke i grundlaget for karaktergivningen. Hvis faget har mål, der omfatter disse evner, indgår de i karaktergivningen. Standpunktskarakterer i 8. og 9. klasse I 8. og 9. klasse gives der standpunktskarakterer i følgende fag og fagområder: I dansk gives der fire standpunktskarakterer: Læsning Retskrivning Skriftlig fremstilling Mundtlig dansk I matematik gives der tre standpunktskarakterer: Matematik uden hjælpemidler Matematik med hjælpemidler Mundtlig matematik I hvert af fagene engelsk, tysk og fransk gives to karakterer: Mundtlig Skriftlig I hvert af fagene nedenfor gives én karakter: Fysik/kemi, biologi og geografi Historie, samfundsfag og kristendomskundskab Idræt Håndværk og design (valgfag) Madkundskab (valgfag) Musik (valgfag) Billedkunst (valgfag) Standpunktskarakterer i 10. klasse I 10. klasse gives der standpunktskarakterer i følgende fag og fagområder. I dansk gives to karakterer: Skriftlig fremstilling Mundtlig dansk I hvert af fagene matematik, engelsk, tysk og fransk gives to karakterer: Mundtlig Skriftlig I fysik/kemi gives én karakter. De elever, som aflægger folkeskolens 9. klasseprøver i 10. klasse, skal gives standpunktskarakterer ud fra det valgte prøveniveau. Udtalelse i idræt i 10. klasse Elever i 10. klasse skal have en udtalelse i idræt to gange om året. Den sidste udtalelse skal vedlægges elevens prøvebevis. Tidspunkt for afgivelse af standpunktskarakterer De sidste standpunktskarakterer gives umiddelbart før de skriftlige prøver og skal afspejle elevens faglige standpunkt på det tidspunkt. Skolelederen kan beslutte, at de sidste standpunktskarakterer i de fag eller dele af fag, der ikke afsluttes med en skriftlig prøve, gives umiddelbart inden de mundtlige prøver starter. Elever og forældre skal informeres om standpunktskaraktererne, når de er givet. Vejledning I vejledningen finder du inspiration og vejledning til afgivelse af standpunktskarakterer i folkeskolen (pdf) Formålet med vejledningen er at hjælpe lærere og skoleledelser, når der skal afgives standpunktskarakterer ved at uddybe og konkretisere de gældende regler. Du finder information om de lovgivningsmæssige krav, der er til standpunktskarakterer og inspiration til, hvordan du kan arbejde med at afgive standpunktskarakterer i din klasse og på din skole. Du finder også eksempler på, hvordan du kan observere og indhente data og observationer i undervisningen med henblik på at kunne vurdere den enkelte elevs faglige standpunkt. Og så kan du få inspiration til, hvad du kan gøre i situationer, hvor du finder det vanskeligt at bedømme en elevs faglige standpunkt. Regelgrundlag Regelgrundlaget fremgår af folkeskoleloven § 13, stk. 5 og 6, og § 19h, stk. 3, prøvebekendtgørelsen, bilag 3 og karakterbekendtgørelsen. Læs mere Lov om folkeskolen (retsinformation.dk) Bekendtgørelse om folkeskolens prøver (retsinformation.dk) Bekendtgørelse om karakterskala og anden bedømmelse (retsinformation.dk) Om 7-trins-skalaen Standpunktskarakterer Fold alle ud/ind Opdateret 07/11 2022 kl. 15:59 Hvornår gives der standpunktskarakterer i folkeskolen? Elever på 8. og 9. klassetrin skal have standpunktskarakterer mindst to gange om året i alle prøvefag. Standpunktskarakteren er en bedømmelse af elevens præstation og standpunkt i forhold til de faglige krav, der er opstillet for de enkelte fag. De sidste standpunktskarakterer skal som udgangspunkt gives umiddelbart før de skriftlige prøver og overføres til det bevis elever får, når de forlader folkeskolen. Reglerne om standpunktskarakterer fremgår af folkeskolelovens § 13, stk. 3 og 4. De samme regler gælder for prøvefag i 10. klasse, jf. § 19 h, stk. 3 og 4. For elever, der modtager specialundervisning, er der særlige regler, som gør det muligt at erstatte karaktergivning med en udtalelse. Læs mere i specialundervisningsbekendtgørelsens § 14. Opdateret 19/09 2017 kl. 18:41 Gives der årskarakterer i folkeskolen? Der gives ikke årskarakterer i folkeskolen. Elever på 8. og 9. klassetrin skal mindst to gange om året gives standpunktskarakterer, der afspejler elevens opfyldelse af de faglige mål for det enkelte fag, på det tidspunkt karaktererne gives. Den sidst afgivne standpunktskarakter overføres til det bevis elever får, når de forlader folkeskolen. Det samme gælder for prøvefag i 10. klasse. Opdateret 19/09 2017 kl. 18:41 På hvilket grundlag skal lærerne give standpunktskarakterer? Standpunktskarakterer er en bedømmelse af elevernes standpunkter i fagene, det vil sige en vurdering af deres faglige niveau. Elevens arbejdsindsats eller opførsel i klassefællesskabet kan som udgangspunkt ikke indgå i grundlaget for karaktergivningen. Sådanne faktorer kan alene inddrages, hvis de påvirker elevens faglige niveau, eller hvis faget på det pågældende trin indeholder mål, der omfatter disse forhold. Standpunktskarakteren skal afspejle elevens aktuelle faglige niveau. Det vil sige, i hvor høj grad eleven lever op til de faglige mål, som gælder på det tidspunkt, hvor karakteren gives. Det betyder, at standpunktskarakterer givet i begyndelsen af skoleåret ikke uden videre kan overføres til en senere standpunktskaraktergivning. Opdateret 16/06 2023 kl. 11:02 Hvordan gives der standpunktskarakterer, hvis skolen ikke har grundlag for bedømmelse? Standpunktskarakterer skal gives på baggrund af elevens præstation på det tidspunkt, karakteren gives. I tilfælde af langvarigt fravær på grund af sygdom, er der ikke umiddelbart grundlag for at give standpunktskarakterer. I et sådant tilfælde kan der gennemføres ekstraordinære prøver/test eller særlige samtaler. Tidligere karakterer kan inddrages i karaktergivningen, men de kan ikke stå alene, da eleven skal vurderes ud fra det niveau, som følger af målene for faget på tidspunktet for karaktergivningen. Opdateret 17/02 2017 kl. 12:10 Skal der gives standpunktskarakterer i de enkelte fag fysik/kemi, biologi og geografi efter indførelsen af den nye prøve? Ja, der gives standpunktskarakterer i de enkelte fag fysik/kemi, biologi og geografi. Standpunktskarakterer er en bedømmelse af elevernes standpunkter i de enkelte fag, det vil sige en vurdering af deres faglige niveau set i forhold til de enkelt fags faglige mål. Det er således kun til den fælles prøve i fysik/kemi, biologi og geografi, at der gives én samlet karakter."
year_published = 2025
