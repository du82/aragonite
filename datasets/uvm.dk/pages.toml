title = "Oplæring | Børne– og Undervisningsministeriet"
description = "Oplæring i en eller flere virksomheder er en del af erhvervsuddannelsen. Du skal lave en uddannelsesaftale med en virksomhed for at komme i oplæring. Alternativt kan du komme i skoleoplæring."
