["https://www.uvm.dk/efterskoler/spoergsmaal-og-svar"]
title = "Spørgsmål og svar om efterskoler | Børne– og Undervisningsministeriet"
description = "Find spørgsmål og svar om efterskoler."
full_description = "Spørgsmål og svar om efterskoler Fold alle ud/ind Opdateret 25/09 2024 kl. 13:28 Kan man klage til ministeriet over en efterskole? Ministeriet er ikke klageinstans i forhold til konkrete afgørelser, som en efterskole måtte træffe. En efterskole er en fri skole, og det betyder, at en efterskoles øverste myndighed er skolens bestyrelse, hvortil man kan klage, hvis man er utilfreds med en afgørelse, som skolens ledelse har truffet. Ministeriet fører alene et såkaldt legalitetstilsyn med efterskolerne. Det vil sige, at ministeriet fører tilsyn med, at en godkendt efterskole overholder efterskoleloven og de regler, der er udstedt i medfør af loven. Det drejer sig primært om tilsyn med overholdelse af lovens krav til undervisningen og samværet på skolerne og betingelserne for tilskud. En tilsynssag kan derudover indledes på baggrund af en konkret henvendelse til ministeriet, fx gennem whistleblowerordningen. Tilsynet indebærer, at ministeriet er beføjet til at udstede påbud til en skole, hvis ministeriet mener, at skolens virksomhed ikke er i overensstemmelse med loven eller de regler eller aftaler, der er fastsat eller indgået i henhold til loven. Ministeriet har ikke i øvrigt beføjelser til at træffe retligt bindende afgørelser i forhold til efterskolerne. Læs om whistleblowerordningen for efterskoler Opdateret 25/09 2024 kl. 13:42 Findes der regler om bortvisning af elever fra efterskoler? En efterskole er en fri skole, og som fri skole er det op til efterskolens ledelse og i sidste ende bestyrelsen at fastlægge den daglige pædagogiske praksis. Dette dækker også skolens ordensregler og eventuelle reaktioner ved overtrædelse heraf. En skole skal, inden den træffer en beslutning om udskrivning af en elev, sikre, at eleven inddrages, så elevens perspektiv og eventuelle synspunkter kan komme til udtryk alt efter elevens alder og modenhed. Opdateret 25/09 2024 kl. 13:43 Hvilke krav stilles der til undervisningen af undervisningspligtige elever på en efterskole? En fri skole har en række friheder til selv at tilrettelægge undervisningen på skolen, så længe undervisningen står mål med, hvad der almindeligvis kræves i folkeskolen. Undervisningen skal altså som minimum kunne leve op til de slutmål, der er sat for undervisningen i folkeskolen. Men præcis hvordan man når frem til dette mål, er altså i vid udstrækning op til skolen selv. Så selvom der skal gives undervisning i de samme fag, som i folkeskolen (evt. med undtagelse af kristendomskundskab), er der ikke noget i vejen for, at undervisningen i nogle fag for eksempel samles i nogle uger, mens der ikke er undervisning i disse fag i andre uger. Der er heller ikke for de frie skoler krav om, at der skal gives undervisning i et bestemt antal timer i de enkelte fag. Er man utilfreds med tilrettelæggelsen af undervisningen på en efterskole, må man tage det op med skolens ledelse. Opdateret 19/03 2020 kl. 09:21 Hvilke krav stilles der til undervisningen i prøveperioder? Efterskolerne er kostskoler. Det betyder, at det ikke er muligt at give eleverne egentlig læseferie. Efterskolerne skal opfylde lovens krav til undervisningens omfang i prøveperioderne, og der kan derfor ikke gives læseferie – hverken i hjemmet eller på skolen – men der skal selvfølgelig ske en kvalificeret forberedelse af eleverne til deltagelse i prøverne. Efterskolerne er forpligtede både i forhold til undervisning og samvær, og det forudsættes, at skolen sørger for god kvalitet i sit tilbud – også i prøveperioden. Der er nærmere vejledning i styrelsens hyrdebrev af 25. april 2019 (pdf). Opdateret 09/01 2023 kl. 13:48 Hvordan kan man få elevstøtte til et efterskoleophold? En af betingelserne herfor er, at eleven er dansk statsborger, eller efter international overenskomst har ret til elevstøtte på lige fod med danske statsborgere eller ligestilles i støttemæssig henseende med danske statsborgere efter regler fastsat af ministeren. Elevstøtten beregnes på grundlag af husstandsindkomsten to år før skolestart. Husstandsindkomsten vil sige forældrenes indkomst, hvis forældrene er gift med hinanden eller bor sammen. Er forældrene ikke gift med hinanden eller bor sammen, så er det, den forælder, som eleven bor hos, og denne forælders eventuelle samlevers indkomst, som indgår i beregningen. Indkomstgrundlaget er den personlig indkomst efter AM-bidrag med tillæg af positiv kapitalindkomst samt aktieindkomst, som beskattes efter personskattelovens §8 a, stk.2 For elever, hvis indkomstbestemte elevstøtte beregnes på baggrund af indkomstgrundlaget for den af forældrene, hos hvem eleven har bopæl eller senest har haft bopæl, og denne forælders eventuelle samlever, fastsættes en nedsættelse af indkomstgrundlaget for hvert barn af forælderen eller den eventuelle samlever bortset fra eleven, hvis barnet ved kursets begyndelse er under 18 år og har bopæl hos forælderen og en eventuel samlever. Elevstøtten i forhold til indkomstgrundlaget fastsættes på finansloven og kan ses i ministeriets takstkatalog. Den efterskole, hvor eleven er optaget, ansøger på elevens/forældrenes vegne Styrelsen for Undervisning og Kvalitet om statslig elevstøtte. Det er normal procedure, at de relevante papirer udfyldes i forbindelse med, at alle optagelsespapirer udfyldes forud for skolestart. Man kan beregne elevstøtten ved at benytte en prisberegner, som Efterskoleforeningen har lagt på deres hjemmeside. Herudover yder staten, jf. efterskolelovens § 37, individuel supplerende elevstøtte. Støtten ydes som individuel støtte til elever efter skolens vurdering. Elever kan søge individuel supplerende elevstøtte på skolen. Læs mere om tilskud til efterskoler og frie fagskoler på ministeriets hjemmeside. Opdateret 25/09 2024 kl. 13:44 Hvilke regler gælder for rygning på efterskoler? Som følge af Lov om røgfri miljøer fra 2021er ikke tilladt for elever på efterskoler at ryge eller anvende tobaksvarer, tobakssurrogater eller urtebaserede rygeprodukter i skoletiden. Lederen af en efterskole skal oplyse om forbuddet, herunder om konsekvenser af overtrædelse heraf. Tjenesteboliger, som er beliggende på institutionens område, er ikke omfattet af forbuddet. Det er dog ikke tilladt at ryge, når børn og unge, der er optaget på institutionen m.v., opholder sig i tjenesteboligen. Opdateret 22/02 2017 kl. 15:33 Kan man få tilskud til befordring til og fra en efterskole? Staten yder tilskud til nedbringelse af transportudgifter i forbindelse med brobygning for efterskoleelever i 9. og 10. klasse. Derudover gives der ikke tilskud til befordring af elever på efterskoler."
year_published = 2025
