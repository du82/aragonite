["https://www.uvm.dk/global/news/uvm/2023/jun/230606-regeringen-igangsaetter-initiativer--der-loefter-kvaliteten-i-daginstitutionerne"]
title = "Regeringen igangsætter initiativer, der løfter kvaliteten i daginstitutionerne | Børne– og Undervisningsministeriet"
full_description = "Regeringen har besluttet at videreføre en række elementer fra Aftale om minimumsnormeringer, som den tidligere S-regering indgik med Radikale Venstre, Socialistisk Folkeparti, Enhedslisten og Alternativet i december 2020. Der er også enkelte initiativer, som ikke videreføres – blandt andet af hensyn til ikke at pålægge kommunerne unødvendigt bureaukrati. Få overblik over, hvilke initiativer regeringen og aftalekredsen bag finansloven for 2023 har besluttet at videreføre, samt hvilke initiativer regeringen har besluttet ikke skal videreføres, herunder: Initiativer, som videreføres Puljerne til indfasning af minimumsnormeringer 2023 Ca. 1,3 mia. kr. i 2023, til indfasning af minimumsnormeringer, videreføres. Det betyder, at kommunerne kan forbedre normeringerne frem mod, at lovkravet om minimumsnormeringer i daginstitutioner træder i kraft 1. januar 2024. Midlerne for 2023 er udmøntet til kommunerne. Pulje til sociale normeringer, 2023-2025 Den afsatte bevilling til puljen til mere pædagogisk personale i daginstitutioner med mange børn i udsatte positioner på ca. 350 mio. kr. årligt fra 2023 og frem videreføres. De kommuner, der har ansøgt puljen, har den 2. juni 2023 modtaget et tildelingsbrev fra Styrelsen for Undervisning og Kvalitet. Pulje til mere uddannet pædagogisk personale (opkvalificeringspulje) De afsatte midler til en opkvalificeringspulje videreføres. Med opkvalificeringspuljen er der afsat hhv. 107 mio. kr. i 2023 og 195,9 mio. kr. årligt i 2024-2030. Den konkrete udmøntningsmodel for opkvalificeringspuljen er under udarbejdelse. Mere fleksibel meritpædagoguddannelse Nedsættelsen af adgangskravet til meritpædagoguddannelsen fra fem til to års relevant erhvervserfaring, kombineret med et alderskrav, videreføres. Initiativet er foreløbigt implementeret som et femårigt forsøg. Øget gennemsigtighed på institutionsniveau Initiativet om udvidelse af dagtilbudsportalen bl.a. med informationer på institutionsniveau, herunder normeringer, personalets uddannelsesniveau og børnenes oprykningsalder, videreføres. Data på institutionsniveau for kommunale og selvejende daginstitutioner forventes at være tilgængeligt på dagtilbudsportalen ultimo 2023. Initiativer som ikke videreføres Drøftelse af normeringer på institutionsniveau og praktisk oplevede normeringer Der gennemføres ikke drøftelse af eventuelle minimumsnormeringer på institutionsniveau i 2023, ligesom der ikke udvikles et egentligt redskab til opgørelse af den praktisk oplevede normering i de enkelte daginstitutioner. Privatinstitutioner og private pasningsordninger Der arbejdes ikke videre med at fjerne muligheden for at trække overskud ud af privatinstitutioner og at nedsætte loftet for antal børn i private pasningsordninger. Der arbejdes herudover ikke videre med initiativet om at stille krav til løn- og arbejdsvilkår i privatinstitutioner. Lovkrav om minimumsnormeringer i daginstitutioner og styrket tilsyn i dagtilbud Folketinget har vedtaget, at der fra den 1. januar 2024 skal være minimum 1 pædagogisk personale pr. 3 børn i alderssvarende daginstitutioner til 0-2 årige (vuggestuer) og minimum 1 pædagogisk personale pr. 6 børn i alderssvarende daginstitutioner til 3-årige børn indtil skolestart (børnehaver). Minimumsnormeringerne opgøres som et årligt gennemsnit på kommuneniveau. Det kommende lovkrav om minimumsnormeringer gælder ligeledes i privatinstitutioner, hvor normeringen mindst skal svare til den gennemsnitlige normering i kommunen. Herudover er der indført skærpede krav til kommunernes tilsyn med dagtilbud, som trådte i kraft den 1. januar 2022. I 2022 er der desuden etableret et statsligt tilsynsrejsehold, som tilbyder sparring og rådgivning til kommunerne om den kommunale tilsynspraksis."
year_published = 2025
