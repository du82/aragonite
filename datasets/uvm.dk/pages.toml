["https://www.uvm.dk/ungdomsskolen"]
title = "Ungdomsskolen | Børne– og Undervisningsministeriet"
description = "Læs om ungdomsskolen, undervisningstilbud i i ungdomsskolen og om kommunernes og ministeriets rolle for ungdomsskolerne."
full_description = "Målgruppe Ungdomsskolen er et tilbud til unge mellem 14 og 18 år, der er tilmeldt kommunens folkeregister. Kommunalbestyrelsen kan beslutte, at unge under 14 år og over 18 år kan optages i ungdomsskolen, hvis kommunalbestyrelsen finder, at disse børn og unge kan have gavn af ungdomsskolens tilbud. Formål Ungdomsskolen har til formål at: give unge mennesker mulighed for at fæstne og uddybe deres kundskaber. give de unge forståelse af samfundslivet og dygtiggøre dem til det. bidrage til at give de unges tilværelse forøget indhold. udvikle de unges interesse for aktiv medvirken i et demokratisk samfund og skærpe deres evner for denne medvirken. Reglerne findes i ungdomsskoleloven. Organisering Ungdomsskolen har en daglig leder, der står for driften. Det foregår inden for den kommunale ramme og inden for de ønsker, ungdomsskolens bestyrelse har til skolens virksomhed. Bestyrelsen har 7 eller flere medlemmer, og dens sammensætning bestemmes af kommunalbestyrelsen. Der er dog altid repræsentanter for: organisationer med særlig interesse for ungdomsskolearbejdet, herunder arbejdsmarkedets parter medarbejderne ved ungdomsskolen eleverne på ungdomsskolen. Ved hver ungdomsskole har eleverne ret til at danne et elevråd. Kommunalbestyrelsen kan indgå aftale med andre kommunalbestyrelser om samarbejde mellem kommunernes ungdomsskoler om undervisningstilbud med mere. Indhold Den enkelte kommune bestemmer selv ungdomsskolens indhold inden for lovens rammer. Derfor er der forskel på fagtilbuddene fra kommune til kommune. Ungdomsskoletilbuddet skal omfatte: almen undervisning i emner, der lokalt er interesse for blandt de unge prøveforberedende undervisning, specialundervisning og undervisning særligt tilrettelagt for unge indvandrere i dansk sprog og danske samfundsforhold. Derudover kan kommunalbestyrelsen beslutte, at tilbuddet skal omfatte: undervisning i færdselslære og knallertkørsel heltidsundervisning, aktiviteter, som kan indgå i kommunens samlede ungdomspolitik, danskuddannelse for nyankomne udlændinge mellem 18-25 år og undervisning i folkeskolens fag og obligatoriske emner samt valgfag på 7.-10. klassetrin. Det kan også besluttes, at tilbuddet skal omfatte klub- og anden fritidsvirksomhed. Ungdomsskolens tilbud er således en central del af kommunernes ungdomspolitik, og et selvstændigt undervisnings- og fritidstilbud, der både rummer egne aktiviteter for og med de unge i kommunen, og støtter og supplerer folkeskolens undervisning og aktiviteter. Ungdomsskolens elever har mulighed for at gå op til folkeskolens prøver, læs om mulighederne her. Ungdomsskolens samarbejde med kommunens folkeskoler Ungdomsskolen indgår samarbejder med kommunens folkeskoler. Disse samarbejder kan bidrage til at opfylde både ungdomsskolens og folkeskolens formål. Ungdomsskolen kan dermed spille en væsentlig rolle i arbejdet med åben skole. Lovgrundlag Lov om ungdomsskoler (retsinformation.dk) Læs mere om ungdomsskolen Ungdomsskoleforeningen (ungdomsskoleforeningen.dk) Ungdomsringen er en forening for alle fritidsklubber, juniorklubber og ungdomsklubber i Danmark (ungdomsskoleforeningen.dk) Internationale uddannelsesprogrammer i grundskolen"
