title = "Prøveafholdelse | Børne– og Undervisningsministeriet"
description = "Her finder du retningslinjer for afholdelse af prøverne. Skolelederen skal sørge for, at administrative medarbejdere, lærere, tilsynsførende og elever er informerede om relevante retningslinjer."
full_description = "Forside Folkeskolen Folkeskolens prøver Prøveafholdelse Her finder du retningslinjer for afholdelse af prøverne. Skolelederen skal sørge for, at administrative medarbejdere, lærere, tilsynsførende og elever er informerede om relevante retningslinjer. Digitale hjælpemidler og kunstig intelligens Læs reglerne om digitale hjælpemidler og kunstig intelligens ved folkeskolens prøver, såsom ChatGPT og stave- og grammatikkontrol. Retningslinjer for prøver Læs retningslinjerne for de skriftlige og mundtlige prøver. Om snyd og tilsyn Læs om håndtering af snyd og tilsyn ved folkeskolens prøver. Forsendelsesprocedurer Procedurer for forsendelse af elevbesvarelser ved de skriftlige prøver afhænger af prøven. Fejl og mangler Sådan skal fejl og mangler ved prøven håndteres og udbedres. Nedbrud af 3. parts programmer På denne side findes information om, hvad skolen skal gøre i tilfælde af nedbrud af 3. parts programmer under prøveafholdelsen."
