["https://www.uvm.dk/gymnasiale-uddannelser/adgang-og-optagelse/optagelse"]
title = "Optagelse | Børne– og Undervisningsministeriet"
description = "Hvordan du søger om optagelse på en gymnasial uddannelse."
full_description = "Ansøgere til en gymnasial uddannelse (htx, hhx, stx, hf og pre-IB) skal søge via optagelse.dk senest den 1. marts kl. 12 det år, hvor ansøgeren ønsker at starte på sin uddannelse. Hvis en ansøger har søgt optagelse på en gymnasial uddannelse inden ansøgningsfristen, vil ansøgeren indgå i den centrale elevfordeling og få tildelt en foreløbig pladsreservation senest den 8. maj. Ansøgeren er først endeligt optaget, når vedkommende lever op til de gældende adgangskrav for uddannelsen. Prioriteter Når man søger om optagelse på en gymnasial uddannelse på optagelse.dk, skal man angive sine prioriteter. En prioritet er en kombination af en uddannelse (stx, hf, hhx, htx og pre-IB) og et uddannelsessted (et bestemt gymnasium eller VUC-institution). I ansøgningen på optagelse.dk skal ansøger angive sine prioriteter i den rækkefølge, som ansøger ønsker at få dem opfyldt. Ansøgers 1. prioritet skal være det ønske, som ansøger helst vil have opfyldt. Ansøgers højeste prioritet forsøges altid opfyldt først. Når ansøger har fået reserveret en foreløbig plads, bliver ansøgers lavere prioriteter ikke afprøvet. Det er derfor vigtigt, at ansøger er omhyggelig med at angive sine prioriteter i den rækkefølge, som ansøger ønsker dem opfyldt. Ansøger kan søge om optagelse på alle de uddannelser og uddannelsessteder (offentlige og private), som ansøger ønsker. Visse elevgrupper har mulighed for at opnå forrang til optagelse på en bestemt institution. Opdateret 24/09 2024 kl. 15:16 Hvilken betydning har det, hvis man efter 9. eller 10. klasse tager et år til udlandet og først derefter begynder på sin gymnasiale uddannelse? Opfylder man alle adgangsforudsætningerne til de treårige gymnasiale uddannelser i 9. klasse ved afslutningen af 9. klasse herunder krav til uddannelsesparathedsvurderingen og resultaterne af folkeskolens afgangseksamen, kan ansøgere opnå retskrav på optagelse i op til to år efter, at de har afsluttet 9. klasse. Tilsvarende kan ansøgere opnå retskrav på optagelse i op til ét år efter, at de har afsluttet 10. klasse. Dermed kan har ansøgere opnå retskrav på optagelse til en gymnasial uddannelse efter et udlandsophold, hvis dette er afsluttet mindre end to år efter, at ansøgeren har afsluttet 9. klasse eller ét år efter, at ansøger har afsluttet 10. klasse. Dette forudsætter, at ansøgeren havde retskrav på optagelse efter henholdsvis 9.- eller 10. klasse. Opdateret 24/09 2024 kl. 15:17 Er det stadig muligt at få orlov, når man er gået i gang med sin uddannelse? Ja, muligheden for at få orlov efter gennemførelsen af mindst et års uddannelse gælder stadig. Orlov skal i disse tilfælde aftales med institutionens leder og må højest vare et år. Ved længere tids orlov end et år, skal der søges om optagelse på ny. Opdateret 24/09 2024 kl. 15:17 Har det nogen betydning for optagelse på en gymnasial uddannelse, hvis en elev, for eksempel på grund af skoleskift, har skiftet 2. fremmedsprog? I forhold til reglerne om retskrav på optagelse på en gymnasial uddannelse har det ikke betydning for opfyldelsen af betingelsen om at have haft 2. fremmedsprog, hvis eleven har foretaget et skift mellem fransk og tysk, for eksempel i forbindelse med skoleskift. Opdateret 24/09 2024 kl. 15:18 Skal man aflægge prøve i 2. fremmedsprog i 10. klasse, hvis man ikke har aflagt prøven i 9. klasse, og man ønsker optagelse på uddannelsen til hf-eksamen? Hvis en elev i 9. klasse har været tilmeldt folkeskolens 9.-klasseprøve i 2. fremmedsprog og enten har været udtrukket til prøven og aflagt den eller ikke har været udtrukket til prøven (men altså haft risikoen for det), så er der ikke noget krav om, at eleven skal aflægge 10.-klasseprøve i 2. fremmedsprog ved afslutningen af undervisningen efter 10. klasse. Muligheden for at aflægge 10.-klasseprøve i 2. fremmedsprog ved afslutningen af 10. klassetrin bliver relevant i tilfælde, hvor en elev, der i 9. klasse har været udtrukket til at aflægge folkeskolens 9.-klasseprøve i 2. fremmedsprog, af en eller anden grund ikke har gjort det. En sådan elev kan nemlig, i forhold til optagelse på uddannelsen til hf-eksamen, rette op på dette ved at aflægge folkeskolens 10.-klasseprøve i 2. fremmedsprog efter 10. klasse. Opdateret 24/09 2024 kl. 15:19 Hvis man ikke har modtaget undervisning i tysk i 9. klasse, men i øvrigt har modtaget tyskundervisning fra 5.-8. klasse, kan man så alligevel få retskrav ved at følge tyskundervisningen og aflægge prøve i 10. klasse? For at have retskrav på optagelse skal man have modtaget prøveforberedende undervisning i 2. fremmedsprog i 5.-9. klasse. Hvis man ikke har modtaget undervisning i 2. fremmedsprog i 9. klasse, er det ikke muligt at ændre på det ved at modtage undervisning i 2. fremmedsprog i 10. klasse. Læs mere Gå til optagelse.dk Læs mere om adgangskrav og retskrav Læs mere om elevfordeling og fordelingen af pladser Læs mere om forrang (ug.dk)"
year_published = 2025
clearnet = "https://www.uvm.dk/gymnasiale-uddannelser/adgang-og-optagelse/optagelse"
tags = ["15:16", "15:17", "15:18", "15:19", "24/09", "5.-8.", "aflagt", "aflægge", "afsluttet", "alligevel"]
