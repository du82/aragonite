["https://uvm.dk/sitecore/content/global/news/uvm/indlaeg-og-taler-af-m/2025/250210-lad-mig-goere-det-helt-klart-den-naeste-generation-skal-ikke-have-mindre-matematik"]
title = "Lad mig gøre det helt klart: Den næste generation skal ikke have mindre matematik | Børne– og Undervisningsministeriet"
full_description = "Jeg blev noget overrasket, da jeg læste Altinget i går. For der stod fejlagtigt, at jeg skulle være kommet med et ret vildt forslag. Lad mig gøre det helt klart: Jeg har aldrig sagt, at vi skal have mindre matematik, kemi, fysik eller biologi. Det passer simpelthen ikke. Tværtimod. Regeringen har netop gennemført en ændring af timetallet i folkeskolen og her var det vigtigt for os at fastholde matematikundervisningen. Ligesom vi fra dette skoleår har fået nye og bedre læreplaner i gymnasieskolens matematik. Men det jeg har sagt er, at vi lever i en tid, der kalder på åndelig oprustning i folkeskolen. At det europæiske demokrati er under pres, og at vi derfor skal uddanne næste generation til at vide, hvor de kommer fra. Og hvorfor det er værd at forsvare. Det betyder, at der er behov for mere fokus på kulturfagene. På den store dannelsesopgave. Så vores børn og unge blandt andet bliver klogere på den historie, vi deler med resten af Europa. Demokratiet handler ikke kun om institutioner som Folketinget, Højesteret og frie valg. Det bygger også på en stærk fællesskabsfølelse – en forståelse af, at vi hører sammen, at vi har et ansvar for hinanden, og at vi deler en historie og kultur, der binder os sammen. Den fællesskabsfølelse er blevet svagere, og det er et problem. For et stærkt samfund kræver ikke kun økonomisk vækst og sikkerhedspolitik – det kræver også, at vi ved, hvem vi er, og hvad vi står for. Vi skal styrke vores sammenhængskraft og forstå, at demokratiet ikke kun er noget, vi bare har – det er noget, vi aktivt skal tage del i og værne om. Men det betyder ikke, vi skal nedprioritere matematik og naturfag. Jeg tror bestemt på, at der er plads til matematikken og de andre fag. Og at de også bidrager en hel del til vores dannelse. I en tid præget af misinformation er evnen til at tænke struktureret og analysere data måske vigtigere end nogensinde. Men hverken det eller kulturfagene kan stå alene. Derfor skal vi stoppe med at sætte fagene op mod hinanden. Og i stedet arbejde for at sikre, at alle fag bidrager bedst muligt til elevernes dannelse og fremtid. Derfor er vi også nødt til at tage diskussionen om, hvordan vi fordeler fagene bedre. I dag får rigtig mange studenterhuen på hovedet efter tre år med samfundsfag. Det mener jeg godt man kan diskutere fornuften i, og det synspunkt står jeg fuldstændig ved."
year_published = 2025
clearnet = "https://uvm.dk/sitecore/content/global/news/uvm/indlaeg-og-taler-af-m/2025/250210-lad-mig-goere-det-helt-klart-den-naeste-generation-skal-ikke-have-mindre-matematik"
tags = ["generation", "gøre", "helt", "ikke", "indlæg", "klart:", "matematik", "mindre", "ministerens", "næste"]
language = "en"
