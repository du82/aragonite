title = "Skoleudvikling | Børne– og Undervisningsministeriet"
description = "Klare mål sætter rammerne for skolernes arbejde med kvalitet og kompetenceudvikling. Samtidig er der fokus på øget gennemførelse og etablering af miljøer, der er fagligt og socialt appellerende."
full_description = "Forside Erhvervsuddannelser Skoleudvikling på erhvervsuddannelser Klare mål sætter rammerne for skolernes arbejde med kvalitet og kompetenceudvikling. Samtidig er der fokus på øget gennemførelse og etablering af miljøer, der er fagligt og socialt appellerende. Klare mål Kvalitetsmålene sætter tydelige rammer for skolernes arbejde. Lokale undervisningsplaner (LUP) Skolerne skal beskrive nye undervisningsforløb. Læringskonsulenterne Skoler med erhvervsuddannelser kan få rådgivning om, hvad der virker. Lærerkompetencer Faglige og pædagogiske kompetencer styrkes gennem to initiativer. Kostafdelinger Læs om oprettelse og drift af kostafdelinger på erhvervsuddannelserne. Forsøg og udvikling Forsøg og udvikling skal bidrage til videreudvikling af praksis. Erhvervsskolernes kvalitetsarbejde Alle erhvervsskoler skal have et kvalitetssystem, der skal sikre, at institutionerne udvikler kvaliteten. Videnscentrene Læs om videnscentrene."
