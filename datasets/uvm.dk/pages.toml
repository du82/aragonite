["https://www.uvm.dk/sitecore/content/global/news/uvm/2025/jan/250104---evaluering-af-forsoeg-med-frisaettelse-klar"]
title = "Evaluering af forsøg med frisættelse klar | Børne– og Undervisningsministeriet"
full_description = "I maj 2021 blev Helsingør og Rebild Kommuner frisat fra en række statslige og kommunale regler på dagtilbudsområdet, samtidig med at Esbjerg og Holbæk Kommuner blev frisat på folkeskoleområdet. Formålet var at udvikle velfærden på områderne og skabe større handlerum for medarbejdere og ledere til at øge kvaliteten og nærværet i velfærden til gavn for borgere. Nu har VIVE gennemført en tværgående slutevaluering af virkningerne i forsøgskommunerne. Evalueringen viser, at der blandt lokale politikere, ledere og medarbejdere har været en generel opbakning til forsøgene med kommunal frisættelse, og at medarbejderne har oplevet at have et større fagligt råderum. Dog viser evalueringen også, at der ikke kan aflæses markante ændringer i kvaliteten for børn og elever. ”Frisættelse i skoler og dagtilbud giver mere plads til lokale løsninger og en oplevelse af større faglig frihed. Der er mange erfaringer fra velfærdsforsøgene, som andre kommuner kan lade sig inspirere sig af, bl.a. i forhold til den kommunale styring, hvor der i forsøgene har været fokus på tillidsbaseret ledelse og udvikling af en ny styrings- og ledelseskultur. Samtidig har folkeskoleforligskredsen været inspireret af erfaringerne, som bl.a. har dannet afsæt for Aftale om folkeskolens kvalitetsprogram fra marts 2024. Men evalueringen på dagtilbuds- og folkeskoleområdet viser også, at frisættelse ikke er en mirakelkur, der løser alle problemener hen over natten,” siger børne- og undervisningsminister Mattias Tesfaye. Erfaringer på dagtilbudsområdet På dagtilbudsområdet har personalets vurdering af kvaliteten af de pædagogiske miljøer været høj både ved forsøgets start og afslutning. Generelt er der ikke sket større ændringer i medarbejdernes oplevelse af kvaliteten, men der er sket et lille fald i andelen af medarbejdere, der mener, at deres dagtilbud i tilstrækkelig grad understøtter trivsel, læring, udvikling og dannelse for børn i udsatte positioner. Der er ikke viden om, hvor mange aktiviteter, der har været igangsat på dagtilbudsområdet, og det kan på den baggrund heller ikke kan opgøres, hvor mange af de igangsatte aktiviteter, der har krævet frisættelse fra statslige regler. En vurdering midtvejs i forsøgsperioden var, at hovedparten af de igangsatte forsøgsaktiviteter på dagtilbudsområdet ikke har krævet fritagelse fra statslig lovgivning. Fra statslig side har Folketinget i 2024 vedtaget en række regelforenklinger på dagtilbudsområdet, som bl.a. fjerner dokumentations- og evalueringskrav til arbejdet med den pædagogiske læreplan, så personalet f.eks. kan bruge mere tid med børnene. Erfaringer på folkeskoleområdet På folkeskoleområdet oplever medarbejderne generelt ikke større ændringer i kvaliteten af undervisningen gennem forsøgsperioden. Der ses heller ikke tydelige forandringer i elevernes faglige resultater, trivsel eller fravær. Medarbejderne oplever dog, at elever med lav motivation i undervisningen trives mere med kortere skoledage, tovoksenordninger og mere praksisrettet undervisning. Parallelt med forsøget med velfærdsaftaler er der gennemført en række ændringer af lovgivningen, som giver en række frihedsgrader, som ikke var gældende, da forsøget blev igangsat. Senest er der med vedtagelsen af lovforslaget om folkeskolens kvalitetsprogram indført en række ændringer, der bl.a. giver skolerne mulighed for at afkorte skoledagen og sikrer lærerne mere frihed i undervisningen. Læs mere om evalueringen af forsøget på VIVE’s hjemmeside (VIVE.dk) Om forsøget med velfærdsaftaler De oprindelige aftaler om velfærdsaftaler på hhv. dagtilbudsområdet og folkeskoleområdet blev indgået i 2020 af den daværende regering (Socialdemokratiet) sammen med en række af Folketingets partier (Venstre, Radikale Venstre, Socialistisk Folkeparti, Enhedslisten, Det Konservative Folkeparti, Nye Borgerlige, Liberal Alliance og Alternativet) og fire af landets kommuner. Når forsøget med velfærdsaftalerne udløber i juli 2025, vil kommunerne skulle følge de samme statslige regler, som gælder for landets øvrige kommuner."
year_published = 2025
