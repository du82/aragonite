["https://uvm.dk/sitecore/content/global/news/uvm/indlaeg-og-taler-af-m/2025/250123-haderslev-katedralskole-viser-en-ny-vej-til-uddannelse-for-unge-sportstalenter"]
title = "Haderslev Katedralskole viser en ny vej til uddannelse for unge sportstalenter | Børne– og Undervisningsministeriet"
full_description = "I Sønderjylland har unge sportstalenter fået nye muligheder for at tilrettelægge deres uddannelse, så den kan kombineres med deres sportsgren. På Haderslev Katedralskole er det netop, med et nyt treårigt forsøg godkendt af Børne- og Undervisningsministeriet, blevet muligt for idrætstalenter at tage en hf-uddannelse over tre år frem for to. Det kan få en hverdag med træning og uddannelse til også at hænge sammen for de elever, der ønsker at tage en hf. At kombinere elitesport og ungdomsuddannelse har indtil nu kun været for en mindre gruppe elever under den særlige Team Danmark-ordning. Vi glæder os over, at det nu i Haderslev også bliver muligt for hf-elever, som ikke er under Team Danmark-ordningen, at kombinere elitesport og hf-uddannelse. I Danmark har vi mange dygtige unge atleter på tværs af landet. Haderslev-området markerer sig bl.a. på grønsvær og på is, men har i det hele taget et rigt forenings- og idrætsliv, hvor der fostres talenter i en række sportsgrene. Vi håber og tror på, at det nye tilbud kan styrke muligheden for at tilrettelægge undervisningstilbud for sportstalenter flere steder. Både for Team Danmark-atleter og, lige så vigtigt, for sportstalenter uden for de største byer, hvor elevgrundlaget eksempelvis ikke er tilstrækkeligt til at oprette Team Danmark-klasser. Regeringen er lige nu ved at forhandle en ny ungdomsuddannelse. Der er endnu ikke taget stilling til, hvad der skal ske med tilbud som disse, men det klare udgangspunkt er, at det også skal være en mulighed i det fremtidige uddannelseslandskab at forene det at dyrke et sportstalent med en ungdomsuddannelse. Et af de vigtigste formål med regeringens planer om en ny ungdomsuddannelse er at skabe attraktive uddannelsestilbud og sociale ungdomsmiljøer for unge i hele landet. Uddannelser og miljøer, der både gør de unge fagligt og menneskeligt stærkere, og som hjælper på vej til en afklaring om ens fremtid i uddannelse og arbejdsmarked. Det gælder selvfølgelig også landets mange dygtige atleter. Derfor vil vi gerne sende et skulderklap fra os til gode kræfter i Haderslev for at bane vejen for nye muligheder for de unge sportstalenter."
year_published = 2025
