["https://www.uvm.dk/sitecore/content/global/news/uvm/2025/feb/250219-frie-internationale-grundskoler-kan-fortsat-udbyde-et-10--skoleaar"]
title = "Frie internationale grundskoler kan fortsat udbyde et 10. skoleår | Børne– og Undervisningsministeriet"
full_description = 'Med aftalen om den nye epx-gymnasieuddannelse er der besluttet et nyt ungdomsuddannelses- og institutionslandskab. Blandt andet afskaffes 10. klasse som selvstændigt tilbud og integreres delvist i epx. Regeringen vil sikre, at frie internationale grundskoler, der underviser efter et andet undervisningssystem end det danske, og hvor grundskolen først afsluttes i det skoleår, som svarer til 10. klasse, fx year 11, fortsat har mulighed for dette og modtager statstilskud hertil. Det kan for eksempel være Cambridge- eller IB-systemet, hvor grundskolen først afsluttes i det skoleår, der svarer til 10. klasse, for eksempel year 11. Det skal blandt andet sikre, at det fortsat er attraktivt for international arbejdskraft at komme til Danmark. ”Vi har indgået en politisk aftale om at oprette en ny gymnasieuddannelse, epx. Det har konsekvenser for andre uddannelsestilbud. Det er vigtigt, at vi tager hensyn til blandt andet de familier, som kommer til Danmark og har behov for, at deres børn kan afslutte deres internationale grundskoleuddannelse i Danmark,” siger børne- og undervisningsminister Mattias Tesfaye. "International arbejdskraft bidrager markant til dansk økonomi og er med til at skabe værdi i danske virksomheder og for det danske samfund. Derfor er det godt, at vi har et uddannelsessystem, som understøtter, at børnene kan fortsætte deres internationale grundskoleuddannelse, hvis deres forældre arbejder i Danmark. Det skaber den nødvendige mobilitet for børnene og forældrene, som jo muligvis på et tidspunkt skal videre til andre lande", siger økonomiminister Stephanie Lose. "Jeg er meget glad for, at vi bevarer de internationale frie grundskoler. Det er vigtigere end nogensinde før, at vi holder dørene til omverdenen åbne", siger uddannelses- og forskningsminiser Christina Egelund. Læs mere Læs mere om økonomien for 10. skoleår på frie internationale grundskoler (pdf) Læs mere om epx'
year_published = 2025
