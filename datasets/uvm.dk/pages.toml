title = "Prøver og eksamen | Børne– og Undervisningsministeriet"
description = "I erhvervsuddannelserne er der prøver undervejs og som afslutning på uddannelserne. Læs om grundforløbsprøven, prøver i grundfag og de afsluttende prøver."
full_description = "Forside Erhvervsuddannelser Prøver og eksamen på erhvervsuddannelser Samlet overblik over prøver og eksamener på de forskellige niveauer i en erhvervsuddannelse. Om prøver og eksamen Om rammerne for prøver på grundforløbene og hovedforløbet. Grundforløbsprøven Grundforløbets 2. del afsluttes med en grundforløbsprøve. Prøver i grundfag Grundfag i erhvervsuddannelserne afsluttes typisk med mundtlige prøver. De afsluttende prøver Prøverne tester elevens praktiske færdigheder kombineret med teoretisk viden. Prøver og eksamen på eux På eux aflægger eleverne prøver på gymnasialt niveau. Prøver på særlig vilkår på erhvervsuddannelser Eksaminander med funktionsnedsættelser eller et andet modersmål end dansk kan på erhvervsuddannelser få tilladelse til at gå til prøver på særlige vilkår. Beviser mv. Vejledninger og skabeloner for indholdet af beviser, skolevejledning og erklæringer om gennemført undervisning på erhvervsuddannelser. Brug af AI-baserede værktøjer til prøverne og under forberedelse Regler for brug af AI-baserede værktøjer ved de mundtlige og skriftlige prøver. Forsøg med grundfagsprøven i matematik niveau F inden for hovedområdet teknologi, byggeri og transport på erhvervsuddannelserne Institutioner har nu mulighed for at tilmelde sig forsøget. Om censur Information om opgaven som censor, censorindberetning og særlig censur. Spørgsmål og åbningstider Spørgsmål til prøver og eksamener på erhvervsuddannelserne."
