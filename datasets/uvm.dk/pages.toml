["https://www.uvm.dk/flere-muligheder-for-voksne/internationale-uddannelsesprogrammer-paa-voksenuddannelser"]
title = "Internationale uddannelsesprogrammer i voksenuddannelser | Børne– og Undervisningsministeriet"
description = "En r&aelig;kke uddannelsesprogrammer giver tilskud til international mobilitet og samarbejde med fokus p&aring; l&aelig;ring og uddannelse.&nbsp;"
full_description = "Erasmus+ Erasmus+ er EU’s program for uddannelse, ungdom og idræt. Institutioner og organisationer, der arbejder med voksenuddannelse, kan via Erasmus+ søge om tilskud til at sende medarbejdere på efteruddannelse i Europa, udlandsophold for kursister og europæiske samarbejdsprojekter. Læs mere om Erasmus+ (ufm.dk) Nordplus Nordisk Ministerråds mobilitets- og netværksprogram for uddannelsesområdet tilbyder økonomisk støtte til blandt andet udveksling af kursister og undervisere samt til netværk og samarbejdsprojekter i Norden og de baltiske lande. Nordplus finansieres af Nordisk Ministerråd. Læs mere om Nordplus (ufm.dk) Interreg Europe Interreg Europes formål er at gennemføre politikker og programmer for regional udvikling i EU. Interreg Europe opererer på to forskellige måder ved enten at støtte offentlige organisationers samarbejde over en kortere periode eller ved at etablere netværk med henblik på vidensdeling til brug for den politiske proces. Læs mere om Interreg Europe på programmets hjemmeside (interregeurope.eu)"
