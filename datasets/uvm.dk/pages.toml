["https://www.uvm.dk/folkeskolen/folkeskolens-proever/bedoemmelse-og-censur/beviser-og-bestaakrav"]
title = "Beviser og beståkrav | Børne– og Undervisningsministeriet"
description = "Få overblik over retningslinjer for udstedelse og opbevaring af beviser."
full_description = "Skolelederen udsteder bevis for folkeskolens prøver i 9. og 10. klasse og bevis til elever, der udskrives efter 7. klasse. Herudover er det også skolelederen, der udsteder enkeltfagsbeviser. Retningslinjerne for udstedelse af bevis er beskrevet herunder. Retningslinjer Fold alle ud/ind Opdateret 02/10 2024 kl. 09:31 Bevis for folkeskolens afgangseksamen Bevis for folkeskolens afgangseksamen skal udstedes for de elever i 9. klasse, der har opnået et gennemsnit på 2,0 eller derover ved folkeskolens obligatoriske prøver, eller elever i 10. klasse, som har aflagt prøve i en eller flere af de bundne prøver på 9. klasseniveau. Beviset skal indeholde: elevens navn og CPR-nummer fag, som eleven har modtaget undervisning i på 1.-7. klassetrin klassetrin og eventuel klassebetegnelse navn og adresse på skolen, hvorfra eleven udskrives elevens seneste standpunktskarakterer eller eventuelle skriftlige udtalelser om specialundervisning og anden specialpædagogisk støtte i de obligatoriske fag dansk, engelsk, kristendomskundskab, historie, samfundsfag, matematik, geografi, biologi, fysik/kemi, idræt og tysk eller fransk elevens seneste standpunktskarakterer i valgfagene håndværk og design, madkundskab, billedkunst samt musik med angivelse af på hvilket klassetrin standpunktskaraktererne givet på karakter ved folkeskolens obligatoriske 8.-klasseprøve i håndværk og design, madkundskab, billedkunst eller musik karakter(er) ved folkeskolens frivillige 8.-klasseprøver klasseprøver i håndværk og design, madkundskab, billedkunst og/eller musik karakterer ved folkeskolens 9.-klasseprøver udskrivningsdato og skolelederens underskrift Gennemsnittet for folkeskolens obligatoriske 8. og 9.-klasse prøver. Ved beregning af gennemsnittet indgår én karakter for skriftlig dansk og én karakter for skriftlig matematik samt en for hver af de øvrige obligatoriske prøver. Karakteren i skriftlig dansk og skriftlig matematik beregnes som gennemnittet af delprøverne. Gennemsnittet for folkeskolens obligatoriske 9.-klasse prøver. Ved beregning af gennemsnittet indgår én karakter for skriftlig dansk og én karakter for skriftlig matematik. Beviset udstedes på hvidt A4-papir. Oplysninger om fag, som eleven har modtaget undervisning i, på 1.- 7. klassetrin, kan udelades, hvis eleven ikke har modtaget undervisning på de pågældende klassetrin på den skole, der udsteder beviset. Et bevis kan efter elevens valg indeholde følgende oplysninger: karakterer for den obligatoriske projektopgave og for den frie selvvalgte opgave på 9. klassetrin skriftlige udtalelser for bedømmelse af den obligatoriske projektopgave og for den frie selvvalgte opgave på 9. klassetrin skriftlige vurderinger i andre fag end prøvefagene fag eller kurser, der er gennemført i den kommunale ungdomsskole med angivelse af indhold, tidsmæssigt omfang og eventuelle karakterer og skriftlige vurderinger. Opdateret 02/10 2024 kl. 09:32 Beståkrav til folkeskolens afgangseksamen For at bestå folkeskolens afgangseksamen skal eleven aflægge otte obligatoriske prøver. Elevens skal opnå en gennemsnitskarakter på 2,0 (ingen oprunding) i de otte prøver. Ved beregning af gennemsnittet indgår én karakter for skriftlig dansk og én karakter for skriftlig matematik samt en for hver af de øvrige obligatoriske prøver. Karakteren i skriftlig dansk og skriftlig matematik beregnes som gennemsnittet af delprøverne. Prøven i skriftlig dansk består af to delprøver: én delprøve i læsning og retskrivning én delprøve i skriftlig fremstilling. Karakteren i læsning og karakteren i retskrivning tæller derfor hver især en kvart, mens karakteren i skriftlig fremstilling tæller en halv i forhold til den samlede karakter for skriftlig dansk. Prøven i matematik består af to delprøver: én delprøve i matematik uden hjælpemidler én delprøve i matematik med hjælpemidler. Hver karakter i delprøverne i matematik tæller derfor en halv i forhold til den samlede karakter for skriftlig matematik. Elever, der bliver fritaget for en obligatorisk prøve, kan ikke bestå folkeskolens afgangseksamen. Opdateret 02/10 2024 kl. 09:33 Beregning af gennemsnit og bestå-kravet Ved beregning af gennemsnittet indgår én karakter for skriftlig dansk og én karakter for skriftlig matematik samt en for hver af de øvrige obligatoriske prøver. Karakteren i skriftlig dansk og skriftlig matematik beregnes som gennemsnittet af delprøverne. Eksempel på hvordan bestå-kravet af folkeskolens afgangseksamen udregnes: Prøve Prøvekarakter Vægt Beregnet karakter Mundtlig dansk 4 1 4 Læsning 4 0,25 3,5 Retskrivning 02 0,25 Skriftlig fremstilling 4 0,5 Matematik uden hjælpemidler 4 0,5 3 Matematik med hjælpemidler 02 0,5 Mundtlig engelsk 02 1 2 Fælles prøve naturfag 10 1 10 Udtræksprøve 02 1 2 Udtræksprøve 4 1 4 Praktisk/musisk valgfagsprøve (8. klasse) 10 1 10 Beregning af bestå-krav (4+3,5+3+2+10+2+4+10)/8 = 4,81 Opdateret 16/10 2024 kl. 14:49 Forbedring af 9. klassekarakterer og aflæggelse af 9. klasseprøver i 10. klasse Hvis en elev ikke har været til prøve i 9. klasse i de bundne prøver i dansk, mundtlig engelsk eller skriftlig matematik, eller hvis eleven i øvrigt gerne vil forbedre sit resultat i disse 9. klasseprøver, har eleven mulighed for at forbedre sit resultat ved at aflægge de pågældende prøver i 10. klasse og dermed opfylde beståkravet til folkeskolens afgangseksamen. Selvom det er muligt at bestå folkeskolens afgangseksamen gennem aflæggelse af 9. klasseprøver i 10. klasse, er det fortsat obligatorisk at aflægge 9. klasseprøverne ved afslutningen af undervisningen på 9. klassetrin med mindre, at eleven fritages for prøve jf. prøvebekendtgørelsens § 36. Konsekvenser af fritagelse for optagelse på ungdomsuddannelser: Elever, der er fritaget for en eller flere prøver i 9. klasse jf. prøvebekendtgørelsens § 36, eller som af anden grund ikke har aflagt alle de obligatoriske FP9-prøver på 9. klassetrin, kan ikke opnå retskrav på optagelse på gymnasial ungdomsuddannelse ved at aflægge den/de manglende FP9-prøver i 10. klasse. Det fremgår af ministeriets hjemmeside om optagelse på gymnasial ungdomsuddannelse, at et af kravene for at opnå retskrav er, at en elev skal have aflagt folkeskolens obligatoriske prøver efter 9. klasse. Læs mere om optagelse på gymnasial uddannelse Opdateret 02/10 2024 kl. 09:35 Bevis for 9. klasse Et bevis til elever, der har afsluttet prøverne i 9. klasse, skal indeholde følgende oplysninger: 1) Elevens navn og CPR-nummer 2) Fag, som eleven har modtaget undervisning i, på 1.- 7. klassetrin. 3) Klassetrin og eventuel klassebetegnelse. 4) Navn og adresse på skolen hvorfra eleven udskrives. 5) Elevens seneste standpunktskarakterer eller eventuelle skriftlige udtalelser om specialundervisning og anden specialpædagogisk støtte i de obligatoriske fag dansk, engelsk, kristendomskundskab, historie, samfundsfag, matematik, geografi, biologi, fysik/kemi, idræt og tysk eller fransk. 6) Elevens seneste standpunktskarakterer i valgfagene håndværk og design, madkundskab, billedkunst samt musik med angivelse af på hvilket klassetrin standpunktskaraktererne givet på. 7) Karakter ved folkeskolens obligatoriske og/eller frivillige 8.-klasseprøver i håndværk og design, madkundskab, billedkunst eller musik. 8) Karakterer ved folkeskolens 9.-klasseprøver. 9) Udskrivningsdato og skolelederens underskrift. Beviset udstedes på hvidt A4-papir. Oplysninger om fag, som eleven har modtaget undervisning i, på 1.- 7. klassetrin, kan udelades, hvis eleven ikke har modtaget undervisning på de pågældende klassetrin på den skole, der udsteder beviset. Et bevis kan efter elevens valg indeholde følgende oplysninger: 1) Karakterer for den obligatoriske projektopgave og for den frie selvvalgte opgave på 9. klassetrin. 2) Skriftlige udtalelser for bedømmelse af den obligatoriske projektopgave og for den frie selvvalgte opgave på 9. klassetrin. 3) Skriftlige vurderinger i andre fag end prøvefagene. 4) Fag eller kurser, der er gennemført i den kommunale ungdomsskole med angivelse af indhold, tidsmæssigt omfang og eventuelle karakterer og skriftlige vurderinger. Opdateret 02/10 2024 kl. 09:35 Bevis for 10. klasseprøver Et bevis til elever, der har afsluttet prøverne i 10. klasse, skal indeholde følgende oplysninger: 1) Elevens navn og CPR-nummer. 2) Klassetrin og eventuel klassebetegnelse. 3) Navn og adresse på skolen, hvorfra eleven udskrives. 4) Elevens seneste standpunktskarakterer i fagene dansk, matematik, engelsk, tysk, fransk og fysik/kemi. 5) Karakterer ved folkeskolens 10.-klasseprøver. 6) Karakterer for aflæggelse af en eller flere af folkeskolens bundne 9.-klasseprøver i 10. klasse. 7) Udskrivningsdato og skolelederens underskrift. Beviset udstedes på hvidt A4-papir. Et bevis kan efter elevens valg indeholde følgende oplysninger: 1) Skriftlige vurderinger i andre fag end prøvefagene. 2) Skriftlige udtalelser i og/eller karakterer for den obligatoriske selvvalgte opgave. 3) Gennemførte brobygnings- og praktikforløb med angivelse af indhold og tidsmæssigt omfang af forløbene. 4) Fag eller kurser, der er gennemført i den kommunale ungdomsskole med angivelse af indhold, tidsmæssigt omfang og eventuelle karakterer og skriftlige vurderinger. Opdateret 02/10 2024 kl. 09:36 Bevis til elever, der udskrives efter 7. klasse Et bevis til elever, der udskrives efter 7. klasse, skal indeholde følgende oplysninger: 1) Elevens navn og CPR-nummer. 2) Fag, som eleven har modtaget undervisning i, på 1.-7. klassetrin. 3) Klassetrin og eventuel klassebetegnelse. 4) Navn og adresse på skolen hvorfra eleven udskrives. 5) Seneste standpunktskarakterer eller skriftlige udtalelser om specialundervisning og anden specialpædagogisk bistand, i fagene, dansk, engelsk, kristendomskundskab, historie, samfundsfag, matematik, geografi, biologi, fysik/kemi, idræt og tysk eller fransk. 6) Elevens seneste standpunktskarakterer i valgfagene håndværk og design og madkundskab, billedkunst samt musik med angivelse af på hvilket klassetrin standpunktskaraktererne givet på. 7) Udskrivningsdato og skolelederens underskrift. Fag, som eleven har modtaget undervisning i, på 1.-7. klassetrin, kan udelades, hvis eleven ikke har modtaget undervisning på de pågældende klassetrin på den skole, der udsteder beviset. Opdateret 02/10 2024 kl. 09:36 Enkeltfagsbevis Skolens leder kan udstede enkeltfagsbevis eller andre former for beviser til privatister. Et enkeltfagsbevis skal indeholde følgende oplysninger: 1) Elevens navn og CPR-nummer. 2) Klassetrin. 3) Navn og adresse på den skole, hvor eleven har aflagt prøve. 4) Karakterer opnået ved folkeskolens 8.-, 9.- eller 10.-klasseprøve. 5) Dato og skolelederens underskrift. Opdateret 24/01 2018 kl. 17:37 Skriftlig udtalelse i stedet for karakterer Hvis karaktergivning i et eller flere fag er erstattet af en skriftlig udtalelse om elevens standpunkt, skal denne medtages på elevens bevis. Det kan for eksempel være tilfældet ved specialundervisning eller anden form for socialpædagogisk støtte. Hvis der gives en udtalelse i et eller flere fag i stedet for en standpunktskarakter og eleven samtidig er fritaget fra prøve i det eller de fag, kan udtalelsen gælde som evaluering. Når en elev fritages fra prøve skal en evaluering træde i stedet for prøveaflæggelsen. Opdateret 02/10 2024 kl. 09:38 Fritagelse for prøve Prøvefritagelse skal kun fremgå af beviset i fag eller dele af et fag, som enten er obligatoriske for alle elever, eller som er udtrukket for den pågældende klasse eller det pågældende hold. Hvis en elev er fritaget for prøve i et fag, som ikke bliver udtrukket til prøve, skal der ikke laves en evaluering. Opdateret 24/01 2018 kl. 17:37 Opbevaring af beviser Skolen skal opbevare alle relevante oplysninger, der er nødvendige for at udstede beviser og udtalelser. Oplysningerne må aldrig kasseres, jævnfør Kulturministeriets lovgivning om offentlige arkivalier. Hvis en elev har mistet sit bevis eller en udtalelse, har skolen pligt til at udlevere en kopi af beviset eller udstede et nyt originalbevis. Opdateret 02/02 2022 kl. 15:52 Bevis med engelske oversættelser Skolens leder kan udstede enkeltfagsbevis eller bevis for folkeskolens 8.-, 9.- og 10.-klasseprøver oversat til engelsk. Opdateret 24/01 2018 kl. 17:37 Beviser som skal bruges i udlandet Skolen kan stille beviser for folkeskolens prøver, der er oversat til engelsk, til rådighed for private udbydere i udlandet. Skolen er ikke forpligtet på at betale udgifter til beviser, der oversættes til engelsk og stilles til rådighed for udbydere i udlandet. Skolen kan bede eleven eller forældre om at dække udgifterne. Hvis du har spørgsmål til uddannelser i udlandet, kan du kontakte Styrelsen for Videregående Uddannelser. Opdateret 21/12 2022 kl. 12:34 Skal det fremgå af beviset, såfremt en prøvekarakter under covid-19 pandemien er opnået ved ophøjelse af en afsluttende standpunktskarakter? Nej. De afsluttende standpunktskarakterer, der blev ophøjet til prøvekarakterer efter diverse nødprøveregler under covid-19 pandemien, bevarer deres gyldighed som prøvekarakterer og skal derfor medtages som prøvekarakterer på beviserne. Det må ikke fremgå af beviset, at der er tale om en ophøjet standpunktskarakter. Bemærk at det ikke fremadrettet er muligt at ophøje standpunktskarakterer til prøvekarakterer. Regelgrundlag Regelgrundlaget fremgår af prøvebekendtgørelsen, kap. 8 og bilag 3, karakterbekendtgørelsen og folkeskoleloven § 13, stk. 7 og 8, og 19h, stk. 4. Læs mere Lov om folkeskolen (retsinformation.dk) Bekendtgørelse om folkeskolens prøver (retsinformation.dk) Bekendtgørelse om karakterskala og anden bedømmelse (retsinformation.dk)"
