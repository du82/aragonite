["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/dec/051224---erhvervsskolen-rybners-overtager-midlertidigt-udbuddet-af-uddannelser-fra-amu-vest"]
title = "Erhvervsskolen Rybners overtager midlertidigt udbuddet af uddannelser fra konkursramte AMU-Vest | Børne– og Undervisningsministeriet"
full_description = "Skifteretten i Esbjerg har i dag afsagt konkursdekret over AMU-Vest, hvilket betyder, at institutionen er gået konkurs. Styrelsen for Undervisning og Kvalitet har frataget AMU-Vest dens godkendelse til at udbyde erhvervs- og arbejdsmarkedsuddannelser i Esbjerg. Dermed ophører al uddannelsesaktivitet på AMU-Vest øjeblikkeligt. Elever og kursister på AMU-Vest kan dog se frem til at kunne begynde på eller fortsætte sin uddannelse i Esbjerg inden for kort tid. Styrelsen har - med henblik på at videreføre udbuddene på kort sigt - besluttet at pålægge erhvervsskolen Rybners i Esbjerg udbuddene midlertidigt. Rybners udbyder i forvejen erhvervs- og arbejdsmarkedsuddannelser i Esbjerg. Den primære hensigt har været at sikre det bedste forløb for kursisterne, og at de får så kort tid som muligt uden undervisning. Nuværende elever og kursister vil inden længe modtage et brev fra Styrelsen for Undervisning og Kvalitet med oplysninger om forventet start m.v. På længere sigt får alle udbydere mulighed for at søge om udbudsgodkendelserne. ”Det er et rigtig stort arbejde og ansvar, vi nu beder Rybners om at løfte. Det er jeg sikker på, de er i stand til. Jeg er utrolig glad for, at der så hurtigt er fundet en anden institution til at overtage undervisningen fra AMU-Vest, så elever og kursister kan begynde eller fortsætte på deres uddannelse hurtigst muligt, indtil der er fundet en mere permanent løsning,” siger børne- og undervisningsminister Mattias Tesfaye. Har du brug for at komme i kontakt med styrelsen omkring dit uddannelsesforløb? Er du elev eller kursist på AMU-Vest og har brug for at komme i kontakt med Styrelsen for Undervisning og Kvalitet, kan du kontakte styrelsen på + 45 33 92 50 00. Det bedste forløb for kursisterne Styrelsen for Undervisning og Kvalitet har afdækket, hvor AMU-Vests uddannelser bedst kunne placeres med henblik på at sikre det bedste forløb for kursisterne. På kort sigt er det vurderet mest hensigtsmæssigt at pålægge Rybners uddannelsesudbuddene. Pålægget af AMU-kurserne sker efter høring af Rådet for Voksen- og Efteruddannelse, mens erhvervsuddannelsesloven giver børne- og undervisningsministeren mulighed for at pålægge en statsligt selvejende uddannelsesinstitution at videreføre erhvervsuddannelsesudbud. En privat udbyder, der allerede udbyder voksen- og efteruddannelser, har over for Børne- og Undervisningsministeriet udvist interesse for at overtage AMU-Vest udbudsgodkendelser. Der er dog ikke hjemmel i uddannelseslovgivningen til at tildele uddannelsesudbuddene direkte til en privat udbyder. På længere sigt kan alle udbydere, herunder også private udbydere, søge om udbudsgodkendelserne. På AMU-området er der en udbudsrunde i januar 2025, hvor private udbydere også vil kunne søge om de AMU-udbud, som AMU-Vest har haft. På erhvervsuddannelsesområdet tildeler Børne- og Undervisningsministeriet løbende godkendelser på baggrund af ansøgninger fra interesserede aktører. Ministeriet vil sørge for at tilrettelægge en særlig proces for udbud af de erhvervsuddannelser, AMU-Vest hidtil har dækket, med afklaring hurtigst muligt i 2025. Beslutning om godkendelse af ansøgninger om udbud skal udarbejdes på baggrund af udtalelser fra henholdsvis Rådet for Voksen- og Efteruddannelse (VEU-rådet) og Rådet for grundlæggende Erhvervsrettede Uddannelser (REU). De to råd rådgiver børne- og undervisningsministeren om forhold om henholdsvis erhvervsrettet og almen voksen- og efteruddannelse samt erhvervsrettede uddannelser. Læs mere Læs mere om AMU-Vests konkursbegæring her"
year_published = 2025
