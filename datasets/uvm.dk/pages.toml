full_description = "Forside Statistik og analyse Dyk ned i fakta om uddannelsesområdet. Børne- og Undervisningsministeriet stiller en lang række databaser og notater om uddannelsesstatistik til rådighed. Dagtilbud Find nøgletal om børn, personale og normeringer på dagtilbudsområdet i Dagtilbudsportalen (ministeriets datavarehus). Grundskolen Tal og notater om nationale mål, karakterer og test, skoler, elever og personale. Gymnasiale uddannelser Tal og notater om karakterer, elever, personale og institutioner. Erhvervsuddannelserne Tal og notater om lærepladsstatistik, elever og institutioner. Øvrige ungdomsuddannelser og forberedende forløb Tal om produktionsskoler, erhvervsgrunduddannelsen (egu) og ungdomsuddannelse for unge med særlige behov (STU). Uddannelser til voksne Tal om AMU-aktiviteten og voksen- og efteruddannelsesområdet. Tværgående Find nøgletal om uddannelser i datavarehuset og læs om profilmodellen samt anden tværgående statistik. Nye tal på uddannelsesstatistik.dk Her får du et overblik over datoer for de kommende offentliggørelser samt årshjul fordelt på uddannelsesområder. Tal, der taler Tal, der taler er ministeriets korte analyser, der sætter fokus på aktuelle problemstillinger og relevante fakta på ministeriets område. Nyheder Nyhed · 12. november 2024 Nye tal: Stadig færre elever begynder på htx Nyhed · 8. november 2024 Nye tal: Så mange flere forventes at begynde i gymnasiet i din kommune i 2035 Tal, der taler · 30. september 2024 Markant flere elever med ordblindhed gennemfører de obligatoriske prøver i 9. klasse Flere nyheder I fokus Link Uddannelsesstatistik Uddannelsesstatistik giver adgang til en række prædefinerede rapporter og grafer med statistiske oplysninger. Der er også mulighed for at definere egne rapporter. Værktøj Skoletal Se hvor nemt det er at få et overblik over nøgletallene på dit barns skole. Genvej Socioøkonomiske reference Den socioøkonomiske reference viser, hvordan elever på landsplan med samme målbare baggrundsforhold som skolens elever har klaret prøverne."
