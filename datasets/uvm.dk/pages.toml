["https://www.uvm.dk/kommunale-internationale-grundskoler"]
title = "Kommunale internationale grundskoler | Børne– og Undervisningsministeriet"
full_description = "Loven om kommunale internationale grundskoler giver kommunerne mulighed for at oprette internationale grundskoletilbud i kommunalt regi. Derved forbedres kommunernes mulighed for lokalt at styrke indsatsen for at rekruttere højt kvalificeret udenlandsk arbejdskraft og for at tiltrække udenlandske virksomheder. Fritstående skoler Kommunale internationale grundskoler skal oprettes som fritstående skoler uden for rammerne af folkeskolen. Bestemmelser i folkeskoleloven finder derfor kun anvendelse for kommunale internationale grundskoler i det omfang, det fremgår af loven. Krav til undervisningen Undervisningen, der skal gives inden for børnehaveklassen og 1.-9. klassetrin, skal stå mål med, hvad der almindeligvis kræves i folkeskolen. Undervisningssprog Undervisningssproget i en kommunal international grundskole er efter kommunalbestyrelsens bestemmelse enten engelsk, tysk eller fransk. I faget dansk er undervisningssproget dansk. Optag Kommunale internationale grundskoler optager undervisningspligtige børn af udlændinge, der har midlertidigt ophold her i landet på grundlag af beskæftigelse, og hvis forældre ønsker dem optaget i skolen. Hvis det ikke er muligt at imødekomme alle ønsker om optagelse i skolen, sker optagelse efter objektive kriterier, for eksempel afstands- og søskendekriterier, der er fastsat af kommunalbestyrelsen. Hvis der er ledig kapacitet på en kommunal international grundskole, kan der også optages danske børn og andre udenlandske børn, der bor eller opholder sig her i landet, og hvis forældre ønsker dem optaget i skolen. Hvis det ikke er muligt at imødekomme alle ønsker om optagelse i skolen, sker optagelse efter objektive kriterier, der er fastsat af kommunalbestyrelsen. Udgifter påhviler kommunalbestyrelsen Alle udgifter ved kommunale internationale grundskoler påhviler kommunalbestyrelsen. Som følge heraf kan kommunalbestyrelsen ikke opkræve forældrebetaling for undervisningen på en kommunal international grundskole. Der skal dog opkræves betaling af forældre til børn, der er optaget i skolens skolefritidsordning. Lovens ikrafttrædelse og anvendelse Loven om kommunale internationale grundskoler trådte i kraft den 8. maj 2015 med virkning fra skoleåret 2015/16. Læs mere Fremsættelsestale (pdf) Lovforslag (pdf) Internationale uddannelsesprogrammer i grundskolen Link til Lov om kommunale internationale grundskoler Lov om kommunale internationale grundskoler (retsinformation.dk) Spørgsmål og svar Fold alle ud/ind Opdateret 13/04 2023 kl. 10:21 Hvordan oprettes kommunale internationale grundskoler? Kommunalbestyrelsens beslutning om oprettelse af en kommunal international grundskole skal træffes på et møde. Da kommunalbestyrelsens møder er offentlige, sikres der derved mulighed for, at oprettelsen af en kommunal international grundskole i kommunen kan blive et tema i den lokale debat. I forbindelse med oprettelsen af en kommunal international grundskole skal kommunalbestyrelsen fastsætte mål og rammer for den enkelte skoles virksomhed, herunder bevillinger og økonomiske rammer, skolens omfang med hensyn til klassetrin, specialundervisning og anden specialpædagogisk bistand, undervisning i fritiden, antal skoledage samt rammer for klassedannelsen, elevernes undervisningstimetal, skoledagens længde m.v. Kommunalbestyrelsen skal i forbindelse med vurderingen af, om der er behov for at oprette en kommunal international grundskole, undersøge mulighederne for, om de internationale frie grundskoler, herunder skoleafdelinger, i lokalområdet kan fremskaffe de nødvendige pladser. Ved vurderingen af, om de internationale frie grundskoler, herunder skoleafdelinger, kan fremskaffe de nødvendige pladser, kan kommunalbestyrelsen blandt andet lægge vægt på kvaliteten af undervisningen og niveauet for forældrebetalingen. Opdateret 08/11 2022 kl. 15:05 Hvilket elevtal skal en kommunal international grundskole have? Oprettelse af kommunale internationale grundskoler forudsætter, at kommunalbestyrelsen vurderer, at der er et tilstrækkeligt elevtal til at oprette et sådan skoletilbud, således at der kan tilvejebringes et undervisnings- og læringsmiljø, der både kan tilgodese elevernes faglige og sociale kompetencer. Ved et tilstrækkeligt elevtal forstås normalt, at der kan oprettes en enkeltsporet skole med børnehaveklasse og 1.-9. klassetrin ved fuld indfasning. Der er dog intet til hinder for, at kommunalbestyrelsen kan beslutte, at skolen skal omfatte færre klassetrin end børnehaveklassen og 1.-9. klassetrin. Skolen bør dog altid omfatte mindst 3 sammenhængende klassetrin. Opdateret 12/03 2017 kl. 19:24 Kan kommunale internationale grundskoler have en skolefritidsordning? Kommunalbestyrelsen kan på et møde træffe beslutning om at oprette en skolefritidsordning på den kommunale internationale grundskole. Beslutningen kan træffes i forbindelse med oprettelsen af den kommunale internationale grundskole eller på et senere tidspunkt. Opdateret 13/04 2023 kl. 10:21 Hvilke elever kan optages på en kommunal international grundskole? Kommunale internationale grundskoler optager undervisningspligtige børn af udlændinge, der har midlertidigt ophold her i landet på grundlag af beskæftigelse, og hvis forældre ønsker dem optaget i skolen. Hvis det ikke er muligt at imødekomme alle ønsker om optagelse i skolen, sker optagelse efter objektive kriterier, der er fastsat af kommunalbestyrelsen. Hvis der er ledig kapacitet på en kommunal international grundskole, kan der optages danske børn og andre udenlandske børn, der bor eller opholder sig her i landet, og hvis forældre ønsker dem optaget i skolen. Hvis det ikke er muligt at imødekomme alle ønsker om optagelse i skolen, sker optagelse ligeledes efter objektive kriterier, der er fastsat af kommunalbestyrelsen. Opdateret 13/04 2023 kl. 10:21 Skal undervisningen på de kommunale internationale grundskoler følge folkeskolelovens bestemmelser om Fælles Mål? Der er tale om fritstående skoler uden for rammerne af folkeskolen. Folkeskolelovgivningen finder derfor som udgangspunkt ikke anvendelse for kommunale internationale grundskoler. Kommunalbestyrelsen skal fastsætte slutmål for de fagområder, som folkeskolens fagkreds naturligt kan opdeles i, og for folkeskolens obligatoriske emner. Kommunalbestyrelsen skal desuden fastsætte delmål for undervisningen i dansk, matematik, engelsk, geografi, biologi, og fysik/kemi. I det omfang kommunalbestyrelsen ikke har fastsat slutmål og delmål for undervisningen gælder folkeskolens Fælles Mål. Opdateret 08/11 2022 kl. 15:06 Hvor mange undervisningstimer skal eleverne have? Det er kommunalbestyrelsen, der fastsætter elevernes undervisningstimetal. Ved fastsættelsen af undervisningstimetallet skal der tages hensyn til, at undervisningen står mål med, hvad der almindeligvis kræves i folkeskolen. Kommunalbestyrelsen skal fastsætte slutmål for de fagområder, som folkeskolens fagkreds naturligt kan opdeles i, og for folkeskolens obligatoriske emner. Kommunalbestyrelsen skal desuden fastsætte delmål for undervisningen i dansk, matematik, engelsk, geografi, biologi og fysik/kemi på bestemte tidspunkter i det samlede undervisningsforløb. I det omfang kommunalbestyrelsen ikke har fastsat slutmål og delmål, gælder folkeskolens Fælles Mål. Ved fastsættelsen af elevernes undervisningstimetal skal der også tages hensyn til, at eleverne kan nå de fastsatte slut- og delmål eller folkeskolens Fælles Mål. Opdateret 12/03 2017 kl. 19:24 Hvilke kvalifikationskrav stilles til lærerpersonalet? Lovforslaget indeholder ikke formelle kvalifikationskrav til lærerpersonalet. Det er kommunalbestyrelsen, der vurderer, hvorvidt en ansøger til en lærerstilling har de fornødne pædagogiske og faglige forudsætninger for at varetage undervisningen, herunder de nødvendige kvalifikationer til at undervise på det valgte undervisningssprog for den kommunale internationale grundskole. Opdateret 08/11 2022 kl. 15:07 Hvordan sikres kvaliteten af undervisningen i kommunale internationale grundskoler? Det er kommunalbestyrelsen, der har ansvaret for at sikre kvaliteten af undervisningen. Opdateret 13/04 2023 kl. 10:21 Skal undervisningen på kommunale internationale grundskoler internationalt certificeres? Kommunalbestyrelsen kan træffe beslutning om, at undervisningen på den pågældende kommunale internationale grundskole skal certificeres. Det er dog en forudsætning, at undervisningen fortsat kan stå mål med, hvad der almindeligvis kræves i folkeskolen. Friskoleloven indeholder heller ikke et krav om, at de internationale friskoler skal certificeres. Det er den enkelte skole, der træffer beslutning herom. Der er således de samme vilkår for så vidt angår international certificering for de kommunale internationale grundskoler og de private internationale friskoler. Opdateret 08/11 2022 kl. 15:07 Hvem fører tilsyn med de kommunale internationale grundskoler? De kommunale internationale grundskoler er omfattet af det almindelige tilsyn med den kommunale forvaltning. Tilsynet varetages i 1. instans af Ankestyrelsen. Ankestyrelsens tilsyn vedrører alene lovligheden af kommunale beslutninger. Tilsynet i 2. instans varetages af indenrigs- og boligministeren. Opdateret 08/11 2022 kl. 15:08 Kan kommuner samarbejde om oprettelse og drift af en kommunal international grundskole? Efter § 60 i den kommunale styrelseslov kan kommunalbestyrelser indgå aftale om samarbejde, som vil medføre indskrænkning i de enkelte deltagende kommunalbestyrelsers beføjelser med Ankestyrelsens godkendelse. Efter denne bestemmelse vil det være muligt for flere kommunalbestyrelser at oprette og drive en kommunal international grundskole sammen. Opdateret 08/11 2022 kl. 15:08 Kan en kommunal international grundskole etableres i en del af en eksisterende skolebygning? Kommunalbestyrelsen vil kunne oprette den kommunale internationale grundskole i egne lokaler. Der vil dog ikke være noget til hinder for, at eventuelle ledige lokaler på en folkeskole benyttes under forudsætning af, at der er en klar institutionel adskillelse mellem den kommunale internationale grundskole og folkeskolen."
year_published = 2025
