["https://www.uvm.dk/almen-voksenuddannelse-avu/spoergsmaal-og-svar"]
title = "Spørgsmål og svar | Børne– og Undervisningsministeriet"
full_description = "Udbud af avu Fold alle ud/ind Opdateret 18/09 2024 kl. 09:16 Hvem udbyder avu? Avu udbydes af voksenuddannelsescentre (VUC), som findes rundt om i landet (vuc.dk/kort/). Derudover udbydes avu på enkelte institutioner, der er blevet sammenlagt med et VUC eller indgår i campusdannelse med et VUC samt på uddannelsesafdelinger ved fængsler og arresthuse under Direktoratet for Kriminalforsorgen. Opdateret 10/10 2022 kl. 12:27 Hvilke krav er der til udbydere om geografisk dækningsområde? VUC’er har pligt til at tilbyde avu, så der sikres en passende geografisk placering af udbuddet og et tilstrækkeligt og varieret tilbud til alle. Som udgangspunkt skal udbuddet ske inden for VUC’ets geografiske dækningsområde. Det enkelte VUC’s forsyningsansvar i forhold til et defineret geografisk dækningsområde indebærer imidlertid ikke en begrænsning i en virksomheds ret til at indgå aftale om undervisning med et VUC, selvom virksomheden eller virksomhedens afdeling ligger uden for VUC’s geografiske dækningsområde. Forsyningsansvarets geografiske afgrænsning indebærer dog, at et VUC’s markedsføring alene må ske i forhold til det område, som forsyningsansvaret dækker. Opdateret 10/10 2022 kl. 12:28 Hvor ofte skal avu-fag udbydes? VUC’er skal udbyde kernefag mindst én gang om året. Institutionen træffer selv beslutning om, hvilke tilbudsfag der udbydes, og på hvilke tidspunkt på kursusåret de enkelte tilbudsfag udbydes og oprettes. Kursusåret omfatter perioden 1. august til 31. juli. Det faglige udbud skal til enhver tid fremgå af institutionens hjemmeside. Andre institutioner end VUC’er, som er godkendt til at udbyde avu (aktuelt kun fængselsskoler) bestemmer selv i hvilket omfang, de vil udbyde og oprette avu. Til toppen Adgang til og deltagelse i avu Fold alle ud/ind Opdateret 02/12 2022 kl. 15:17 Hvem er i målgruppen for avu? Avu er et tilbud rettet mod voksne over 25 år, som ønsker at forbedre deres almene kundskaber i et eller flere fag. Det er uddannelsesinstitutionen, der beslutter, om en ansøger kan optages. Optagelse på forskellige fag og niveauer sker ud fra en konkret vurdering af ansøgers forudsætninger for at kunne følge undervisningen. Opdateret 02/12 2022 kl. 15:19 Hvilket grundlag skal der til for at blive optaget på avu? Det er uddannelsesinstitutionen, der beslutter, om en ansøger kan optages. Optagelse på forskellige fag og niveauer sker ud fra en konkret vurdering af ansøgers forudsætninger for at kunne følge undervisningen. Den faglige vurdering af den enkelte ansøger skal altid finde sted før optagelsen på et konkret hold/niveau og før undervisningens start. Det er ikke en del af det enkelte fags identitet og formål at skulle være kompetenceafklarende i forhold til den enkelte kursists faglige standpunkt. Det er i uddannelsen kun introducerende undervisning, der kan anvendes til afdækning af en kursists faglige forudsætninger og uddannelsesmæssige muligheder. Som udgangspunkt er undervisningssproget i avu dansk, hvorfor der som tommelfingerregel kræves danskkundskaber svarende til bestået danskprøve 2 for at kunne følge undervisningen. En ansøger, der kan fremvise en bestået danskprøve 2, har dog ikke retskrav på at blive optaget. Institutionen kan endvidere ikke fastsætte lokale regler om, at danskprøven skal være bestået med en vis karakter. Der skal foretages en konkret vurdering af ansøgers sproglige niveau. Hvis institutionen finder det vanskeligt at vurdere ansøgers konkrete forudsætninger for at følge undervisningen, bør institutionen foretage en screening for at sikre, at ansøger har de nødvendige forudsætninger. Dette kan ske ved selvudviklet materiale ved relevante faglærere eller ved brug af forlagenes screeningsmaterialer. Ved optagelsen af andetsprogede kursister bør institutionen inddrage andetsprogskompetencer fx gennem direkte inddragelse af undervisere med dsa-kvalifikationer. Opdateret 02/12 2022 kl. 15:19 Kan en ung under 25 år få adgang til avu? Som udgangspunkt er avu for voksne over 25 år, mens unge under 25 år skal bruge den forberedende grunduddannelse (FGU), hvis de mangler forudsætninger for at komme videre i en ungdomsuddannelse. Det er den kommunale ungeindsats i den unges bopælskommune, der afgør, om en ung under 25 år er i målgruppen for FGU. Unge under 25 år kan dog i en række undtagelsestilfælde optages til avu. Opdateret 02/12 2022 kl. 15:19 Hvilke betingelser skal være opfyldt, for at en ung person under 25 år kan få adgang til avu? Den unge under 25 år må ikke være optaget på forberedende grunduddannelse eller deltage i et afsøgningsforløb efter lov om kommunal indsats for unge under 25 år. Desuden er det helt generelt en betingelse, at institutionen vurderer, at den unge har forudsætningerne for at kunne følge undervisningen med udbytte. Desuden skal den unge opfylde mindst én af de oplistede betingelser i avu-lovens § 2, stk. 2, nr. 1-6, som er: Personen er selvforsørgende eller er og vedbliver med at være i deltidsbeskæftigelse i minimum 20 timer om ugen. Personen har gennemført en ungdomsuddannelse, men ønsker faglig opkvalificering. Personen er i gang med en ungdomsuddannelse, men har behov for supplerende fag. Personen tager hf-enkeltfag, men har behov for faglig opkvalificering inden for et enkelt fag med undtagelse af fag nævnt i § 5, stk. 1, nr. 1 og 2, for at kunne gennemføre det gymnasiale niveau, og den faglige opkvalificering er af mindre tidsmæssigt omfang end hf-enkeltfagene. Personen benytter sig af retten til fravær efter kapitel 4 i barselsloven og ønsker at følge enkelte fag. Personen følger undervisning på uddannelsesinstitutioner under Kriminalforsorgen. Opdateret 02/12 2022 kl. 15:19 Kan en ung under 25 år, der går på hf-enkeltfag, få adgang til avu? En ung under 25 år, der vurderes at have forudsætninger for at uddanne sig på gymnasialt niveau, og som hovedsageligt læser hf-enkeltfag, skal have mulighed for at læse et enkelt avu-fag, sideløbende med hf-fagene, hvis det er nødvendigt for, at den unge på et senere tidspunkt kan følge det pågældende fag på hf-niveau. Jf. undtagelserne i Avu-lovens § 2, stk. 2, nr. 4 gælder dette dog ikke avu-fagene dansk og dansk som andetsprog. Den faglige opkvalificering med avu-fag skal være af mindre tidsmæssigt omfang end hf-enkeltfagene, og der kan højst tages ét fag på avu-niveau pr. halvår. Opdateret 02/12 2022 kl. 15:19 Kan en ung under 25 år, der har færdiggjort FGU, få adgang til avu? Et afsluttet FGU-forløb alene berettiger ikke til adgang til avu. En ung under 25 år kan optages til avu, når en af betingelserne i avu-lovens § 2, stk. 2 er opfyldt. De afsluttede uddannelser, der jf. avu-lovens § 2, stk. 2, nr. 1-6 giver mulighed for optagelse til avu for en person under 25 år, er ungdomsuddannelser. FGU er ikke en ungdomsuddannelse. Tværtimod er det en uddannelse, der skal forberede til en ungdomsuddannelse. Opdateret 02/12 2022 kl. 15:19 Kan en ung under 25 år, der deltager i STU, få adgang til avu? Udgangspunktet er, at avu er forbeholdt personer, som er fyldt 25 år, mens STU er for unge indtil det fyldte 25 år. Jf. undtagelserne i avu-lovens § 2, stk. 2, nr. 3 kan en ung under 25 år følge fag på avu, hvis den unge er i gang med en ungdomsuddannelse og har behov for supplerende fag. Eftersom STU er en ungdomsuddannelse, kan en STU-elev ved siden af sin STU-uddannelse deltage i avu. Den unge kan også som led i sin STU deltage i avu, hvis det indgår i den unges forløbsplan. Opdateret 02/12 2022 kl. 15:19 Kan en tosproget være i målgruppen for avu? Ja. Som hovedregel har alle voksne, der er fyldt 25 år, adgang til avu. Det er uddannelsesinstitutionen, der beslutter, om en ansøger kan optages. Optagelse på forskellige fag og niveauer sker ud fra en konkret vurdering af ansøgerens forudsætninger for at kunne følge undervisningen. Som udgangspunkt er undervisningssproget i avu dansk, hvorfor der som tommelfingerregel kræves danskkundskaber svarende til bestået danskprøve 2 for at kunne følge undervisningen. En ansøger, der kan fremvise en bestået danskprøve 2, har dog ikke retskrav på at blive optaget. Institutionen kan endvidere ikke fastsætte lokale regler om, at danskprøven skal være bestået med en vis karakter. Der skal altid foretages en konkret vurdering af ansøgers sproglige niveau. Hvis institutionen finder det vanskeligt at vurdere ansøgers konkrete forudsætninger for at følge undervisningen, bør institutionen foretage en screening for at sikre, at ansøger har de nødvendige forudsætninger. Screeningen bør inddrage andetsprogskompetencer fx gennem direkte inddragelse af undervisere med dsa-kvalifikationer. Opdateret 02/12 2022 kl. 15:19 Kan voksne med en videregående uddannelse deltage i avu? Ja. Som hovedregel har alle voksne, der er fyldt 25 år, adgang til avu. Deltagere, der har en videregående uddannelse, skal betale fuld deltagerbetaling. Opdateret 04/12 2024 kl. 15:25 Hvad koster det, at deltage i avu? Institutionen skal opkræve deltagerbetaling af avu-kursister for deltagelse i undervisning og prøver, samt af selvstuderende for at gå til prøve. Den almindelige deltagerbetaling udgør aktuelt (2025) 140 kroner for kernefag, og 1.430 kroner for tilbudsfag. Kursister, der modtager efterløn eller en aldersbetinget pension, betaler en forhøjet deltagerbetaling på 750 kroner ekstra pr. fag. Kursister, der har en videregående uddannelse, skal betale fuld deltagerbetaling. Prisen afhænger af uddannelsestiden og varierer derfor mellem cirka 4.800 kroner 20.100 kroner. Deltagerbetaling skal være betalt, før kursisten påbegynder undervisningen, og for selvstuderende før prøven påbegyndes. Når en person har betalt for et fag, skal der ikke betales for det følgende niveau. Det betyder imidlertid ikke, at den pågældende kursist automatisk kan rykke op til næste niveau. Opdateret 02/12 2022 kl. 15:19 Hvor mange gange kan en kursist deltage i samme fag på samme niveau? Deltagelse i samme fag på samme niveau flere gange (omgængeri) skal have undtagelsens karakter. Institutionen skal forud for optag på avu vurdere, om den pågældende ansøger har forudsætninger for at kunne følge undervisningen og afslutte denne inden for det centralt fastsatte timetal. I forbindelse med optagelsessamtaler bør institutionerne spørge ind til ansøgers evt. tidligere aktiviteter på avu, herunder på andre institutioner. Har en ansøger allerede flere gange fulgt et fag på et givent niveau, kan personen som hovedregel ikke optages på samme niveau endnu engang. Dansk og dansk som andetsprog er sidestillede danskfag, som blot er målrettet forskellige målgrupper. Det betragtes derfor som omgængeri, hvis en kursist tager samme niveau inden for begge fag. Til toppen Betaling af lediges avu-forløb Fold alle ud/ind Opdateret 10/10 2022 kl. 12:37 Hvem betaler for ledige, der deltager i avu-forløb? Ledige kan deltage i avu som led i en aktiv beskæftigelsesindsats eller efter eget initiativ. Kommunen har betalingsforpligtelsen for avu-forløb, der gives som led i en aktiv beskæftigelsesindsats. Hvis deltagelsen derimod sker efter eget initiativ, vil deltageren udløse taxameter. Et uddannelsestilbud anses som givet som led i beskæftigelsesindsats, når jobcenteret har givet et konkret tilbud om uddannelse efter kapitel 14 i lov om en aktiv beskæftigelsesindsats (LAB-loven) til en person, som er omfattet af LAB-lovens målgrupper i § 6. Hvis et uddannelsestilbud er givet om led i en aktiv beskæftigelsesindsats, og derfor er omfattet af kommunal betalingsforpligtelse, vil det fremgå af personens ”Min Plan”, jf. § 41, stk. 2 i LAB-loven. Deltagelse som ledig forudsætter, at deltageren fortsat står til rådighed for arbejdsmarkedet. Til toppen Fag og undervisning Fold alle ud/ind Opdateret 05/07 2023 kl. 09:33 Hvad er reglerne for holddannelse? Der er ingen centralt fastsatte regler om holddannelse. Et hold kan derfor omfatte kursister, der undervises på forskellige niveauer af én eller flere undervisere. Der er heller ikke et lovmæssigt fastsat maksimum for antal deltagere på et hold. Undervisningen skal dog tilrettelægges således, at institutionen for hver kursist kan sikre den for niveauet angivne uddannelsestid samt opfyldelsen af de faglige mål mv. for det niveau, kursisten er optaget på. Opdateret 02/12 2022 kl. 15:21 Hvilke fag indgår i Almen forberedelseseksamen? I den almene forberedelseseksamen indgår fagene dansk eller dansk som andetsprog på niveau D, engelsk på niveau D, matematik på niveau D samt to fag af kursistens valg på mindst niveau G. Almen forberedelseseksamen giver retskrav på optagelse på 2-årigt HF, hvis de to valgfrie fag på minimum G-niveau består af naturvidenskab samt ét af fagene historie, samfundsfag, tysk eller fransk. De enkelte prøver i fagene skal være bestået, dvs. som minimum have opnået karakteren 02 efter 7-trins-skalaen i hver af de prøver, der indgår i almen forberedelseseksamen. Opdateret 10/10 2022 kl. 12:39 Hvad er fagelementer? Fagelementer består af dele af et fag og giver mulighed for forløb med fokus på særlige emner i det pågældende fag. Varigheden vil afhænge af det enkelte elements faglige fokus, der afspejler den konkrete målgruppes uddannelsesbehov og forudsætninger. Et fagelement skal udgøre en afgrænset enhed og kan udgøre indtil halvdelen af det pågældende fags uddannelsestid. Fagelementet må ikke udbydes som led i et fuldt fagforløb og må ikke kombineres med andre fagelementer eller fag. Institutionen skal for det enkelte fagelement udarbejde en beskrivelse af indholdet, der skal ligge inden for det pågældende fags mål. Kursisterne skal gøres bekendt med indholdsbeskrivelsen. Fagelementer kan tilrettelægges i samarbejde med virksomheder. Såfremt institutionen er indstillet på at forlægge undervisningen til virksomhedens lokaler, er der ingen regler til hinder for dette, blot skal udbuddet offentliggøres. Opdateret 10/10 2022 kl. 12:39 Hvornår er en kursist aktivt deltagende? Den enkelte institution er forpligtet til at fastsætte regler om kursistens aktive deltagelse i undervisningen og orden. Institutionens regler om kursistens aktive deltagelse i undervisningen skal også kunne anvendes til at dokumentere kursistens studieaktivitet, hvis undervisningen tilrettelægges virtuelt. I forbindelse med fastsættelsen af regler om aktiv deltagelse vil institutionen kunne fastsætte regler om mødepligt. Reglerne om aktiv deltagelse og orden skal desuden beskrive konsekvenser for kursister, der ikke overholder reglerne. Kursisten skal gøres bekendt med reglerne, og de skal fremgå af institutionens hjemmeside. Til toppen Prøver og eksamen Fold alle ud/ind Opdateret 02/12 2022 kl. 15:21 Kan uddannelsesinstitutionen nægte en deltager at gå til prøve? Uddannelsesinstitutionerne kan ikke nægte en deltager at gå til prøve. Efter almen eksamensbekendtgørelsens § 7 har en deltager ret til at gå til prøve, hvis betingelserne for at gå til prøve er opfyldt. Det vil sige, at deltageren har fulgt undervisningen i det pågældende forløb, og at deltageren har opfyldt de formelle krav til opgaver mv., som skal bruges ved eksaminatione"
