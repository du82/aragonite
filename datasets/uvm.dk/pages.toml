full_description = "Forside Vejledning og støttemuligheder Vejledning samt specialpædagogiske og økonomiske støtteordninger skal bidrage til at sikre børn, unge og voksne de bedst mulige rammer for uddannelse. Vejledning Børn, unge og voksne kan få vejledning om uddannelses- og jobmuligheder. SPS - Specialpædagogisk støtte Specialpædagogisk støtte (SPS) skal sikre, at elever og studerende med en fysisk eller psykisk funktionsnedsættelse kan gennemføre uddannelsen. Ordblindetesten Identificering af personer med ordblindhed. VIBUS Vidensenhed om børn og unge med særlige behov. SU, SVU og anden uddannelsesstøtte Statens økonomiske støtteordninger til elever, studerende og kursister. VIBUS Vidensenhed for børn og unge med særlige behov (VIBUS) skal bidrage til at styrke indsatsen inden for inklusion og specialundervisning. Genveje Uddannelsesparathed Uddannelsesplan Læs om alle uddannelser på UddannelsesGuiden (ug.dk) Find kurser til efteruddannelse (efteruddannelse.dk) Få vejledning på telefon, sms, mail, chat, Facebook eller via digitale møder (ug.dk) Digitale vejledningsværktøjer Find forskellige digitale værktøjer, der kan hjælpe unge og voksne i forbindelse med overvejelser om uddannelsesvalg. Specialpædagogisk støtte (SPS) SPS skal sikre, at elever og studerende kan uddanne sig på lige fod med andre, selvom de har en funktionsnedsættelse. Nyheder Nyhed · 22. marts 2023 Arbejdsgruppe foreslår at afskaffe uddannelsesparathedsvurdering Nyhed · 25. marts 2021 Unge søger ungdomsuddannelser ligesom sidste år Nyhed · 29. januar 2021 Ny aftale sikrer unge bedre vejledning til valg af ungdomsuddannelse"
