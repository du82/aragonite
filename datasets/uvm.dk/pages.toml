["https://www.uvm.dk/dagtilbud/plads-i-dagtilbud/pasningsgaranti"]
title = "Pasningsgaranti | Børne– og Undervisningsministeriet"
full_description = "Kommunen har pligt til at anvise en plads i et alderssvarende dagtilbud til alle børn i alderen fra 26 uger og indtil barnets skolestart. Kommunalbestyrelsen i den enkelte kommune skal tilbyde pasningsgaranti. Pasningsgarantien betyder, at kommunalbestyrelsen i den enkelte kommune har pligt til at anvise en plads i et alderssvarende dagtilbud til alle børn i alderen fra 26 uger og indtil barnets skolestart. Plads i direkte forlængelse af barnets 26 uger Kommunalbestyrelsen i den enkelte kommune skal udmelde frister for ansøgning for forældre, der ønsker en plads i direkte forlængelse af, at barnet er fyldt 26 uger. Denne frist skal overholdes for, at forældrene opnår retten til at få en plads i direkte forlængelse af, at barnet er fyldt 26 uger. Ønsker forældre en plads i direkte forlængelse af barnets 26 uger, og har forældrene ansøgt om plads i dagtilbud inden for kommunens ansøgningsfrist, skal kommunalbestyrelsen for at opfylde pasningsgarantien derfor kunne tilbyde en plads til barnet senest 4 uger efter, at barnet er fyldt 26 uger, uanset om det er i direkte forlængelse af forældrenes barselsorlov. Ingen garanti for plads i bestemt dagtilbud Pasningsgarantien indebærer ikke en garanti for en plads i et bestemt dagtilbud. Forældre har dog altid en ret til at tilkendegive ønsker om optagelse i konkrete dagtilbud i kommunen. Kommunalbestyrelsen kan opfylde pasningsgarantien inden for den vifte af dagtilbud, der fremgår af dagtilbudsloven, dog ikke privatinstitutioner og private pasningsordninger. Mere herom findes i dagtilbudslovens § 23. Kommunen vil i almindelighed bede forældrene om at oplyse, hvornår de har behov for en plads. Kommunen kan i disse situationer fastsætte den dato, hvor forældrene skal have en plads til den dato, hvor forældrene har behov for en plads. Pasningsgarantien brydes ikke, hvis fristen for en plads forlænges efter ønske fra forældrene. Kontakt kommunen for konkrete oplysninger om optagelse og pasningsgaranti. Brud på pasningsgarantien En kommune bryder pasningsgarantien, hvis kommunen ikke kan tilbyde en plads i et dagtilbud senest 4 uger efter, at barnet er fyldt 26 uger, hvis forældrene har overholdt kommunens fastsatte frist for ansøgning. Ved brud på pasningsgarantien skal kommunen tilbyde enten at dække forældrenes udgifter til en privatinstitution eller en privat pasningsordning, dække udgifterne til en plads over kommunegrænsen eller give tilskud til pasning af egne børn. Mere herom findes i dagtilbudslovens § 24. Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven) Læs mere Borger.dk"
