["https://www.uvm.dk/flere-muligheder-for-voksne/hf-enkeltfag"]
title = "Hf-enkeltfag | Børne– og Undervisningsministeriet"
description = "Hf som enkeltfag er en fleksibel gymnasial uddannelse rettet mod voksne."
full_description = "For dem, der har brug for en hel gymnasial uddannelse og gerne vil tage den i sit eget tempo på grund af job eller lignende, er der mulighed for at sammenstykke enkeltfagene til en fuld hf-eksamen. Der er deltagerbetaling på uddannelsen, og man kan søge Statens Uddannelsesstøtte. Om man opnår støtte, er dels afhængig af antal fag som følges, dels afhængig af personlige forhold. Det konkrete uddannelsesforløb for den enkelte afhænger af antallet af fag og fagniveauer, men hvert fag varer gennemsnitligt ½-1 år. Fagudbuddet på hf-enkeltfag omfatter enkeltfag og faggrupper på gymnasialt niveau. De fleste fag fra de øvrige gymnasiale uddannelser kan i princippet udbydes som enkeltfag. Adgang til videregående uddannelse En fuld hf-eksamen giver adgang til alle videregående uddannelser, hvis man opfylder eventuelle specifikke adgangskrav til uddannelsen. På nogle mellemlange videregående uddannelser kan man søge optagelse med enkelte hf-fag. Der udbydes derfor også enkeltfag samlet i fagpakker, der sigter mod optagelse på en bestemt videregående uddannelse. Optagelseskrav En ansøger til hf-enkeltfagsundervisning kan tidligst optages et år efter, at ansøgeren har afsluttet folkeskolens 9. eller 10. klasse eller har gennemført en undervisning, der står mål med, hvad der almindeligvis kræves i folkeskolen. Desuden er der krav til de faglige forudsætninger. Det er det konkrete uddannelsessted, som ud fra en vurdering af ansøgerens kvalifikationer, afgør, om en ansøger kan optages til hf-enkeltfagsundervisningen. Uddannelsessteder Enkeltfagsundervisningen foregår ved voksenuddannelsescentre (VUC) og hf-kurser rundt omkring i landet. Der findes både dag- og aftenundervisning. På alle uddannelsessteder får du tilbudt rådgivning og vejledning, mens de går der. Læs mere UddannelsesGuiden (ug.dk) Hf-uddannelsen Fag og læreplaner"
year_published = 2025
