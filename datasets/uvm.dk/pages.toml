["https://www.uvm.dk/dagtilbud/lovgivning--politiske-aftaler-og-puljer/kvalitetsforum-for-dagtilbud"]
title = "Kvalitetsforum for dagtilbud | Børne– og Undervisningsministeriet"
description = "Kvalitetsforum for Dagtilbud skaber rammen for at udvikle dagtilbuddene, s&aring; alle b&oslash;rn trives, udvikler sig og l&aelig;rer."
full_description = "I Danmark går stort set alle børn i dagtilbud, og vi har gode og velfungerende dagtilbud, hvor den generelle forældretilfredshed er høj. Men der er også udfordringer. Hvorfor et kvalitetsforum? Kvalitetsforum for Dagtilbud skal danne rammen for at drøfte styrker og udfordringer på dagtilbudsområdet - og ikke mindst, hvordan får vi håndteret udfordringerne. Vi ved, at den negative sociale arv ikke er brudt, at der ikke altid arbejdes vidensbaseret og systematisk med børns læring, og at forældre ikke i udstrakt grad inddrages i børns læring. Derudover er overgangen til skolen svær for en gruppe af børn. Hvad skal diskuteres? I Kvalitetsforum forholder områdets centrale aktører sig aktivt til udfordringer og løsninger på dagtilbudsområdet. Temaer for forummet er blandt andet: En styrket pædagogisk læreplan Styrket tidlig indsats Muligheden for forældresamarbejde Hvordan der skabes mere tid til børnene gennem blandt andet færre dokumentationskrav Hvordan balance for familie- og arbejdsliv kan forbedres Hvordan pædagogisk personale får adgang til ny viden m.v. Temaer kan ændre sig løbende, idet alle medlemmer af forummet har mulighed for at komme med forslag til mødetemaer, oplæg m.v. Fælles dialog og udvikling Parterne skal, i kraft af deres viden og erfaringer, blandt andet være med til at kvalificere kommende nye initiativer til gavn for børnene. Hvem er Kvalitetsforum for Dagtilbud Kvalitetsforum for Dagtilbud består af repræsentanter fra: Kommunernes Landsforening (KL) Børne- og Ungdomspædagogernes Landsforbund (BUPL) Fag og Arbejde (FOA) Børne- og Kulturchefforeningen (BKF) Forældrenes Landsforening (FOLA) Daginstitutionernes Landsorganisation (DLO) BUPL's lederforening. Derudover deltager Rådet for Børns Læring, Danmarks Evalueringsinstitut og formanden for Partnerskab for kvalitet i dagtilbud som associerede medlemmer. Vidensbaggrunden for en styrket pædagogisk læreplan Internationale erfaringer med læreplaner på dagtilbudsområdet (eva.dk)"
year_published = 2025
