["https://www.uvm.dk/erhvervsuddannelser/ansvar-og-aktoerer"]
title = "Ansvar og aktører | Børne– og Undervisningsministeriet"
description = "Læs om hvordan ansvaret for såvel daglig drift som overordnet udvikling af erhvervsskolerne er fordelt. Og læs om procedurer for tilsyn, klager og godkendelse som udbyder af erhvervsuddannelser."
full_description = "Forside Erhvervsuddannelser Ansvar og aktører på erhvervsuddannelser Læs om hvordan ansvaret for såvel daglig drift som overordnet udvikling af erhvervsskolerne er fordelt. Og læs om procedurer for tilsyn, klager og godkendelse som udbyder af erhvervsuddannelser. Skolens bestyrelse Bestyrelsen har det overordnede ansvar for erhvervsskolens drift og virksomhed. Skolelederen Erhvervsskolens leder har ansvaret for den daglige administrative og pædagogiske ledelse af skolen. Elevråd Eleverne kan få indflydelse på deres uddannelse og deres skole gennem elevrådet. Råd og udvalg Lokale uddannelsesudvalg, faglige udvalg og tre uafhængige råd og nævn er centrale aktører. Udbud Om udbud af erhvervsuddannelser og godkendelse som skoleoplæringscenter. Tilsyn Tilsynet med erhvervsuddannelserne omfatter økonomisk tilsyn og tilsyn med den faglige kvalitet. Klager Hvis du vil klage over en skoles afgørelse, skal du sende klagen til skolen."
