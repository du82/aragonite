["https://www.uvm.dk/dagtilbud/viden-og-undersoegelser"]
title = "Viden og undersøgelser | Børne– og Undervisningsministeriet"
full_description = "Forside Dagtilbud Viden og undersøgelser Ministeriet prioriterer løbende at støtte og igangsætte projekter, der skal udvikle ny viden til brug for politik- og praksisudvikling på dagtilbudsområdet. Kvalitetsundersøgelse I efteråret 2024 igangsætter Børne- og Undervisningsministeriet en kvalitetsundersøgelse af dagtilbud for 3-5-årige børn. Undersøgelsen igangsættes i forlængelse af en lignende undersøgelse af dagtilbud for 0-2-årige børn. Internationale uddannelsesprogrammer i dagtilbud Pædagoger, ledere og andet relevant personale i daginstitutioner kan deltage i en række europæiske og nordiske uddannelsesprogrammer. Viden om dagtilbud på emu.dk Emu.dk formidler viden, gode eksempler og inspiration til aktiviteter og læringsforløb i dagtilbud."
