["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/mar/240306-regeringen-fjerner-en-raekke-regler-paa-dagtilbudsomraadet"]
title = "Regeringen fjerner en række regler på dagtilbudsområdet | Børne– og Undervisningsministeriet"
full_description = "Regeringen og KL har i aftalen om kommunernes økonomi for 2024 aftalt at indgå et flerårigt samarbejde, som skal understøtte kommunernes arbejde med at nedbringe udgifterne til administration og udvikle de borgernære velfærdsområder, herunder på dagtilbuds- og folkeskoleområdet. Regeringens frisættelsestiltag afspejles også i forsøgene med velfærdsaftaler, hvor fire kommuner på henholdsvis dagtilbuds- og folkeskoleområdet er frisat fra statslige og kommunale regler. KL er kommet med en række forslag til regelforenklinger på dagtilbudsområdet, og regeringen har besluttet, at gå videre med følgende regelforenklinger: Kravet om at udarbejde en skriftlig pædagogisk læreplan i den enkelte daginstitution/enhed og for hele dagplejen fjernes. Dagtilbuddene vil fortsat skulle arbejde med børns trivsel og læring mv. med udgangspunkt i den pædagogiske læreplan, herunder det pædagogiske grundlag, som det er fastsat i dagtilbudsloven. Kravet om evaluering af den pædagogiske læreplan hvert andet år fjernes. Der vil uændret være krav om etablering af en evalueringskultur i dagtilbuddene med hensyn på at udvikle den pædagogiske kvalitet. Regler om 30 timers plads til søskende mod en reduceret forældrebetaling under forældres barsel fjernes. Krav om, at kommunerne skal beskrive, hvordan tilsynet med dagtilbuddene tilrettelægges, fjernes. Der igangsættes en proces, der skal udbore, hvordan reglerne om forældres fravalg af et sundt frokostmåltid i daginstitutioner kan forenkles samt en proces for at se på forenkling af dele af reglerne om tilsyn med dagtilbud. Kommunernes indberetningspligt til dagtilbudsportalen forenkles, så kommunernes ikke skal bruge administrative ressourcer på at validere personaledata på institutionsniveau, som ikke understøtter et lovkrav. Forslaget indebærer, at der ikke vil blive indsamlet data om normeringer på institutionsniveau. Flere af regelforenklingerne kræver ændring af dagtilbudsloven. Der forventes fremsat lovforslag i efteråret 2024. På folkeskoleområdet præsenterede regeringen i oktober 2023 sit forslag til, hvordan folkeskolen skal frisættes med folkeskoleudspillet Forberedt til fremtiden II. Udspillet indeholder en række forslag til regelforenklinger, bl.a. en række af de forslag, som KL har ønsket. Regeringen vil desuden gå videre med en række andre forslag, bl.a. KL’s forslag om ensretning af regler for revisitation af børn, der endnu ikke har påbegyndt skolegangen."
year_published = 2025
