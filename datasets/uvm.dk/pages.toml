["https://www.uvm.dk/folkeskolen"]
title = "Folkeskolen | Børne- og Undervisningsministeriet | Børne– og Undervisningsministeriet"
description = "Find generel information om folkeskolen, folkeskolens prøver, mål og lov - og læs om de initiativer, der skal løfte fagligheden og trivslen blandt elever"
full_description = "Forside Folkeskolen Find generel information om folkeskolen og læs om de initiativer, der skal løfte fagligheden og trivslen blandt eleverne og mindske betydningen af social baggrund. Folkeskolens mål, love, regler og politiske aftaler Om folkeskolen og folkeskolens formål, regelgrundlag, nationale mål, praksisfaglighed og politiske aftaler samt spørgsmål og svar-sektion. Organisering og ledelse Aktører på folkeskoleområdet, deres roller, opgaver og ansvar – herunder den kommunale opgave, skolens ledelse, forældrenes rolle og elevernes stemme. Fag, timetal og overgange Overblik over Fælles Mål, skoledagens længde, timetal, holddannelse, skolestart og udskoling – herunder 10. klasse. Læring og læringsmiljø Trivsel, inklusion, specialundervisning, tosprogede elever samt læringsmål og varierede undervisningsformer. Læringskonsulenterne Mød læringskonsulenterne og se muligheder for vejledning, arrangementer og sparring til kommuner og skoler. Folkeskolens prøver Datoer, oversigter og retningslinjer for tilmelding, afholdelse og bedømmelse af prøver. Test, evaluering og skoleudvikling Et bredt udvalg af redskaber og evalueringsmetoder skal bidrage til en stærk evalueringskultur – herunder om ordblindhed og sprogvurdering, screening af højtbegavede elever, UPV, obligatoriske og frivillige test og meddelelsesbog Viden og kompetencer Forskning, undersøgelser, forsøg og kompetenceudvikling til udvikling af folkeskolen. Aktuelt Aftale om folkeskolens kvalitetsprogram - frihed og fordybelse Læs om initiativerne i Aftale om folkeskolens kvalitetsprogram - frihed og fordybelse, der blev indgået den 19. marts 2024. Nyhed · 6. februar 2025 Arbejdet med Fagfornyelsen indtræder i ny fase Nyhed · 6. februar 2025 Kommuner kan nu tilmelde skoler til nye forsøg med holddannelse og co-teaching Nyhed · 4. februar 2025 Evaluering af forsøg med frisættelse klar Se flere nyheder I fokus Fag Fælles Mål Fælles Mål for folkeskolens fag fra børnehaveklasse til 10. klasse, val