description = "Læs om frie grundskolers prøver, test og evaluering, love og regler, tilsyn, specialundervisning samt spørgsmål og svar om frie grundskoler."
full_description = "Forside Frie grundskoler Frie grundskoler er et alternativ til folkeskolen. Mål og planer for undervisningen kan tilpasses skolens værdigrundlag. Om skoler og formål Hvad er en fri grundskole og hvor kan du finde dem? Ansvar og aktører Optagelse og udskrivning på frie grundskoler. Ledelsens, forældrenes og elevernes roller og ansvar. Rammer for undervisningen Der skal være sammenhæng mellem den undervisning, der foregår på skolen hver dag, og de mål og planer, skolen har for undervisningen. Prøver, test og evaluering De frie skoler kan vælge at afholde folkeskolens prøver. De har også adgang til at bruge Folkeskolens Nationale Overgangstest. Tilsyn Tilsyn med frie grundskoler omfatter den faglige kvalitet, regeloverholdelse og skolens økonomi. Internationale uddannelsesprogrammer i frie grundskoler Pædagogisk personale, lærere og ledere i frie grundskoler samt elever kan deltage i en række europæiske og nordiske uddannelsesprogrammer. Love, regler og politiske aftaler Love med betydning for efterskoler, centrale bekendtgørelser og vejledninger samt politiske aftaler. Aktuelt Certificering af frie grundskoler med særlig specialundervisningsprofil Fristen for at ansøge om certificering som fri grundskole, der har en særlig specialundervisningsprofil gældende fra den 1. januar 2025, er den 8. juli 2024. Nyhed · 19. februar 2025 Frie internationale grundskoler kan fortsat udbyde et 10. skoleår Nyhed · 19. december 2024 Resultater af ny undersøgelse: Sådan håndterer kommuner langvarigt fravær, tilsyn med hjemmeundervisning og børn uden for skoletilbud Nyhed · 23. november 2024 Ny undersøgelse: Skærme forstyrrer mere end hver 3. elev i undervisningen Flere nyheder I fokus Aftale Arbejdstidsaftale i staten Som en del af OK21 blev der i januar 2021 indgået en aftale om arbejdstid for lærere, der er ansat i staten. Information Prøver og test Læs mere om prøver, test og evaluering på området for frie grundskoler. Tema Underretningspligt - den professionelle bekymring En vejledning til frie skoler om børn og unge der mistrives."
