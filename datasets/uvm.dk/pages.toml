["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/maj/240507-bredt-politisk-flertal-begraenser-brugen-af-skaerme-i-dagtilbud"]
title = "Bredt politisk flertal begrænser brugen af skærme i dagtilbud | Børne– og Undervisningsministeriet"
full_description = "Børn tilbringer mere og mere af deres tid foran en skærm. Den udvikling skal dagtilbud ikke bidrage til. Det mener et bredt politisk flertal, der i dag har vedtaget en lovændring, som sikrer en mere restriktiv tilgang til brug af skærme i dagtilbud og private pasningsordninger. Afsættet for ændringen er et forsigtighedsprincip målrettet de yngste børn. Lovændringen sker som følge af den politiske aftale fra den 31. oktober 2023, der blev indgået mellem regeringen og et bredt flertal af Folketingets partier (Socialistisk Folkeparti, Enhedslisten, Radikale Venstre, Dansk Folkeparti, Alternativet, og Nye Borgerlige). Der er ikke tale om et fuldstændigt forbud mod brug af skærme, men lovændringen medfører en mere restriktiv tilgang til brug af digitale redskaber i dagtilbud mv. Med anvendelse af digitale redskaber forstås aktiviteter, hvor barnets opmærksomhed er rettet mod en computer, tv, mobiltelefoner og tablets. Lovændringen betyder, at dagtilbud fremover skal følge disse principper: I alderssvarende tilbud og private pasningsordninger til 0-2 årige børn kan digitale redskaber kun i helt særlige tilfælde anvendes i det pædagogiske arbejde med børns trivsel, læring, udvikling og dannelse. Særlige tilfælde kan f.eks. omfatte børn med handicap eller kognitive udfordringer. I alderssvarende tilbud og private pasningsordninger til 3-årige børn og ind til skolestart kan digitale redskaber kun anvendes i det pædagogiske arbejde med børns trivsel, læring, udvikling og dannelse, hvis det fagligt kan begrundes. Det pædagogiske personales anvendelse af digitale redskaber i forbindelse med kommunikation med forældrene eller til administrative formål, som fx arbejdet med den pædagogiske læreplan eller opfølgning på tilsynsbesøg, er ikke omfattet af lovændringen. De nye regler skal blandt andet ses i forlængelse af Sundhedsstyrelsens anbefalinger fra oktober 2023 om, at børn under to år ikke bør bruge skærm uden aktivt samvær med en voksen. Loven træder i kraft den 1. juli 2024. Læs mere Læs hele lovforslaget (ft.dk) Sundhedsstyrelsens anbefalinger om brug af skærm til børn, unge, voksne og forældre (sst.dk)"
