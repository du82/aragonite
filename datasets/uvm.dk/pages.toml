["https://www.uvm.dk/efterskoler/om-efterskoler"]
title = "Kort om efterskoler | Børne– og Undervisningsministeriet"
description = "Efterskolerne er et kostskoletilbud til alle unge mellem 14 og 18 år med fokus på livsoplysning, folkelig oplysning og demokratisk dannelse."
full_description = 'Efterskoler er et kostskoletilbud, hvor eleverne bor på skolen. Formålet med efterskolerne er at tilbyde undervisning og samvær, der har fokus på "livsoplysning, folkelig oplysning og demokratisk dannelse". Efterskolernes undervisning bliver tilrettelagt med henblik på "elevernes hele menneskelige udvikling og modning samt deres almene opdragelse og uddannelse" (citater fra lov om efterskoler og frie fagskoler (retsinformation.dk)). Holdningsskoler Skolerne er meget forskellige. Nogle efterskoler bygger på et religiøst livssyn, nogle på en bestemt pædagogik. De enkelte skolers pædagogiske tænkning og syn på, hvordan børn lærer, kan også være forskellig, alt efter hvilket grundlag skolerne har. Nogle efterskoler har fokus på særlige fagområder som for eksempel musik eller idræt. Interesseområder kan afspejle sig i en særlig fagsammensætning på skolen. De særlige fagområder må dog aldrig være på bekostning af kravet om, at undervisningen skal have bred almen karakter eller kravet om, at undervisningen skal stå mål med, hvad der almindeligvis kræves i folkeskolen. Kurset skal være åbent for alle. Det vil sige, at deltagelse i et kursus ikke kan være betinget af bestemte kundskaber, køn eller andet. Nogle efterskoler har et samlet særligt tilbud til elever med behov for specialpædagogisk støtte, for eksempel ordblinde eller elever med generelle indlæringsvanskeligheder. En efterskole må planlægge og gennemføre undervisningen på en anden måde end folkeskolen. Det vælger en del af skolerne at gøre, fordi det passer bedre til deres værdigrundlag, og fordi de har mulighed for det på baggrund af deres skoleform. På efterskole i 8. eller 9. klasse Efterskoler optager elever, der er undervisningspligtige i henhold til folkeskoleloven. Det drejer sig om elever i 8. eller 9. klasse. Når undervisningspligtige elever går på efterskole, skal de tilbydes en undervisning, der står mål med, hvad der almindeligvis kræves i folkeskolen. På efterskole i 10. klasse Efterskolerne kan også tilbyde undervisning på 10. klassetrin. Hvis en elev går på efterskole i 10. klasse, skal eleven: modtage en undervisning i dansk, engelsk og matematik, som står mål med undervisningen i folkeskolen i disse fag i brobygning til en ungdomsuddannelse have udarbejdet en uddannelsesplan i samarbejde med forældrene lave den obligatoriske selvvalgte opgave tilbydes prøver i de obligatoriske fag. Efterskolerne kan også vælge at tilbyde undervisning på 10. klassetrin som 10. årgang. 10. årgang er ikke særskilt reguleret i efterskoleloven. Rammen for undervisningens indhold er formålsparagraffen, som nævnt øverst på denne side. Enkelte fag eller faggrupper kan på 10. årgang godt have en fremtrædende plads, men aldrig på bekostning af det almene. Kurserne skal tilbydes med henblik på elevernes hele menneskelige udvikling og modning samt deres almene opdragelse og uddannelse. Der skal, som i 8., 9. og 10. klasse, ugentligt undervises mindst 21 timer eksklusiv pauser. Der kan ikke aflægges nogen af folkeskolens prøver i forlængelse af 10. årgang. Læs styrelsens opsamling på tilsyn med 10. årgang (uvm.dk) Hvis et efterskoleophold er anbefalet i en udtalelse fra Pædagogisk Psykologisk Rådgivning (PPR) eller UU-vejledningen i elevens tidligere skolekommune, så kan en elev over 18 år optages. Om efterskoler Efterskolerne er et kostskoletilbud til alle unge mellem 14 og 18 år med fokus på livsoplysning, folkelig oplysning og demokratisk dannelse. Efterskoler er et kostskoletilbud, hvor eleverne bor på skolen. Formålet med efterskolerne er at tilbyde undervisning og samvær, der har fokus på "livsoplysning, folkelig oplysning og demokratisk dannelse". Efterskolernes undervisning bliver tilrettelagt med henblik på "elevernes hele menneskelige udvikling og modning samt deres almene opdragelse og uddannelse" (citater fra lov om efterskoler og frie fagskoler (retsinformation.dk)). Holdningsskoler Skolerne er meget forskellige. Nogle efterskoler bygger på et religiøst l