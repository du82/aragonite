["https://www.uvm.dk/sitecore/content/global/news/uvm/2025/feb/250206-kommuner-kan-nu-tilmelde-skoler-til-nye-forsoeg-med-holddannelse-og-co-teaching"]
title = "Kommuner kan nu tilmelde skoler til nye forsøg med holddannelse og co-teaching | Børne– og Undervisningsministeriet"
full_description = "Kommunerne kan fra skoleåret 2025/26 tilmelde deres folkeskoler to nye landsdækkende forsøg med holddannelse og co-teaching. Forsøgene skal blandt andet bidrage med mere viden om, hvad nye tilgange til undervisning i dansk og matematik betyder for elevernes læring og trivsel. Forsøg med co-teaching i dansk I det ene forsøg skal skolerne arbejde med co-teaching, og forløbet skal gennemføres i dansk på 5. klassetrin i skoleårene 2025/26 og 2026/27. Co-teaching indebærer, at to undervisere samarbejder om undervisningen i klassen. I forsøget skal klassens dansklærer sammen med den ekstra underviser ugentligt planlægge, gennemføre og evaluere fire lektioner i dansk. Forsøget strækker sig over 28 uger i løbet af skoleåret. Det tætte samarbejde mellem to undervisere har til formål at give eleverne en mere intensiv og differentieret undervisning. Kommunen vil modtage midler til at dække omkostninger til den ekstra underviser. Som en del af forsøget vil underviserne gennemgå et kompetenceudviklingsforløb, og eleverne vil gennem et evalueringsredskab skulle reflektere over deres motivation og arbejdsindsats i undervisningen. Forsøg med holddannelse i matematik I det andet forsøg skal skolerne arbejde med holddannelse i matematik i 5. klasse. Det skal gennemføres i fem lektioner om ugen fordelt over 16 sammenhængende uger i skoleårene 2025/26 og 2026/27. Her bliver klasserne opdelt i mindre hold, og undervisningen skal varetages af to lærere. Underviserne skal sammen planlægge og gennemføre undervisningen med henblik på, at eleverne oplever en mere målrettet og differentieret undervisning. Kommunen vil modtage midler til at dække omkostningerne til en ekstra lærer. Inden forsøget starter, får skolerne en introduktion til holddannelseskonceptet. ”Jeg er glad for, at vi nu giver udvalgte skoler endnu bedre mulighed for at afprøve undervisning med to voksne og for at dele klasserne op. Det giver lærerne mulighed for at sparre med hinanden. Og så kan det give mere ro i klasseværelserne. Det er der behov for flere steder. Fra næste sommer er det også tilført ekstra økonomi til folkeskolen. Men det er op til lokal beslutning, hvad man vil bruge de ekstra ressourcer på. Nogle steder kan co-teaching være det rigtige, mens det andre steder vil være undervisning i små hold eller noget helt tredje. Der skal være lokale muligheder for at sikre en ordentlig undervisning,” siger børne- og undervisningsminister Mattias Tesfaye. Tilmelding og deltagelse Kommuner kan tilmelde skoler til forsøgene i perioden d. 19. februar til den 19. marts 2025. Samlet kan 60 klasser deltage pr. forsøg. Det forventes, at skolerne får tilbagemelding om deltagelse inden udgangen af april 2025, så der er mulighed for at planlægge det kommende skoleår. Det vil via lodtrækning blive afgjort, hvilket skoleår de deltagende skoler skal gennemføre forsøgene. Det er obligatorisk for de deltagende skoler at deltage i en evaluering af forsøgene. Det skal bidrage til større viden om, hvordan holddannelse og co-teaching kan understøtte læring og trivsel blandt eleverne. I Aftalen om folkeskolens kvalitetsprogram fra 2024 indgår der en række initiativer – bl.a. styrket indsats for de mest udfordrede elever i dansk og matematik samt folkeskolens timebank, der giver mulighed for øget brug af holddannelse og co-teaching. Viden fra forsøget om holddannelse og co-teaching vil derfor også på sigt kunne understøtte skolernes arbejdet med at implementere de to initiativer fra folkeskolens kvalitetsprogram. Der er afsat i alt 10,7 mio. kr. til de to forsøg, der løber frem til 2027 Tilmelding Tilmeldingen sker via puljeudmeldingerne til de to forsøg: Systematisk forsøg med co-teaching i dansk i 5. klasse i folkeskolen Systematisk forsøg med holddannelse i matematik i 5. klasse i folkeskolen"
year_published = 2025
clearnet = "https://www.uvm.dk/sitecore/content/global/news/uvm/2025/feb/250206-kommuner-kan-nu-tilmelde-skoler-til-nye-forsoeg-med-holddannelse-og-co-teaching"
