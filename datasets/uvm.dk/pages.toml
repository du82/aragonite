full_description = "Forside Ordblindeundervisning for voksne Ordblindeundervisning for voksne er en særligt tilrettelagt undervisning, der har til formål at afhjælpe eller begrænse deltagerens læse- og skrivevanskeligheder. Om ordblindeundervisning for voksne Formålet med ordblindeundervisning for voksne er at forbedre deltagerens muligheder for at klare sig i sammenhænge, der kræver skriftlighed. Adgang og udbydere Samtale og test viser om ordblindeundervisning for voksne er det rette for dig. Alle voksenuddannelsescentre udbyder ordblindeundervisning for voksne. Tilsyn Tilsynet med ordblindeundervisning for voksne omfatter økonomisk tilsyn og tilsyn med den faglige kvalitet. Love, vejledninger og rapporter Love, vejledninger og relevante rapporter der omhandler ordblindeundervisning for voksne. Spørgsmål og svar Læs svarene på de oftest stillede spørgsmål om ordblindeundervisning for voksne (OBU). Ordblindepakke V Otte nye initiativer skal styrke arbejde med ordblindhed hos unge og voksne. Ordblindeportalen Viden om ordblindhed til ordblinde, pårørende og fagpersoner. Flere temaer"
