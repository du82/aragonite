["https://www.uvm.dk/internationalt-arbejde"]
title = "Internationalt arbejde | Børne– og Undervisningsministeriet"
description = "Ministeriets arbejde med international uddannelsespolitik og andre internationale temaer."
full_description = "Forside Internationalt arbejde Ministeriets arbejde med international uddannelsespolitik og andre internationale temaer. Om det internationale arbejde Danske børn, unge og voksne skal rustes til en stadig mere globaliseret verden, og dansk uddannelsespolitik henter inspiration fra andre lande. EU og Europa Danmark deltager i europæisk uddannelsessamarbejde i EU og Europarådet. Norden De nordiske lande har udbredt samarbejde om uddannelse og forskning. Danmark deltager desuden i en række uddannelsesprogrammer. UNESCO UNESCO er en del af FN og bidrager til fred og sikkerhed ved at fremme samarbejde mellem nationer inden for uddannelse, videnskab, kultur og kommunikation. ASEM ASEM er en uformel proces for dialog og samarbejde mellem europæiske og asiatiske lande. Internationale undersøgelser Undersøgelser om hvordan danske elever klarer sig internationalt, og hvad vi kan lære af andre lande. Uddannelseseksport Uddannelseseksport er uddannelsesaktiviteter fra danske aktører, der betales af en udenlandsk aktør. Data om voksnes færdigheder Styrelsen for Undervisning og Kvalitet inviterer til webinar om, hvordan forskere, analytikere og studerende kan få adgang til og anvende data fra den kommende PIAAC-undersøgelse. Education at a Glance Education at a Glance er OECD’s årlige publikation for uddannelsessektoren. Unesco På unesco.dk kan du læse om UNESCO i Danmark arbejde for kerneværdier som uddannelse til alle, ytringsfrihed, demokrati, beskyttelse af kulturarv og ligestilling former alles liv og hverdag. TALIS 2018 Danmark deltog i 2018 for tredje gang i TALIS-undersøgelsen. Læs mere om undersøgelsen her. Nyheder Nyhed · 10. december 2024 Ny undersøgelse: Mange voksne har stadig mangelfulde færdigheder i læsning og regning Nyhed · 30. maj 2024 Sådan får forskere og analytikere data om voksnes færdigheder Nyhed · 1. maj 2024 Christine Antorini bliver ny formand for Den danske UNESCO-nationalkommission Flere nyheder"
