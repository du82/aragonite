["https://www.uvm.dk/arbejdsmarkedsuddannelser/undervisningens-tilrettelaeggelse-og-proever"]
title = "Undervisningens tilrettelæggelse og prøver | Børne– og Undervisningsministeriet"
description = "Fleksibel tilrettel&aelig;ggelse, kombination af AMU og andre uddannelser samt regler og rammer for pr&oslash;ver."
