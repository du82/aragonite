["https://www.uvm.dk/dagtilbud/om-dagtilbud/pasning-af-egne-boern"]
title = "Pasning af egne børn | Børne– og Undervisningsministeriet"
description = "Det er kommunalbestyrelsen, der afgør, om kommunen giver tilskud til pasning af egne børn."
full_description = "Den enkelte kommune, som har besluttet at give forældre mulighed for at søge tilskud til pasning af egne børn, fastsætter også tilskuddets størrelse og for hvilken aldersgruppe, der kan modtage tilskud. Kommunen kan give forældre et tilskud til at passe deres egne børn mellem 24 uger og indtil skolestart i stedet for at få en plads i et dagtilbud. Hvis kommunalbestyrelsen beslutter at tilbyde forældre et tilskud til pasning af egne børn, kan kommunalbestyrelsen beslutte, at tilbuddet kun skal gælde for børn i en bestemt aldersgruppe. Betingelser for at modtage tilskud til pasning af egne børn Et tilskud til pasning af egne børn er et alternativ til at få sit barn optaget i et dagtilbud. Forældre kan derfor ikke, samtidig med at de modtager tilskud til pasning af egne børn, have det samme barn optaget i et dagtilbud efter dagtilbudslovens §§ 19 og 21 eller modtage tilskud til privat pasning efter dagtilbudslovens § 80. har tilstrækkelige danskkundskaber til at kunne udvikle barnets dansksproglige kompetencer, ikke samtidig modtager offentlig overførselsindkomst eller har en arbejdsindtægt, ikke er omfattet af § 13, stk. 10, og § 13 f, stk. 1-4, jf. § 26, stk. 4-10, i lov om aktiv socialpolitik, og har opholdt sig her i riget i 7 ud af de seneste 8 år. Kravene om tilstrækkelige danskkundskaber og om ophold her i riget gælder ikke for EU/EØS-borgere, i det omfang de efter EU-retten er berettiget til ydelsen. Find yderligere vejledning om EU-rettens regler (nyidanmark.dk) Antal tilskud pr. husstand og tilskudsperiodens længde Tilskud til pasning af egne børn kan gives for en periode på minimum 8 uger og maksimalt 1 år. Kommunalbestyrelsen kan fastsætte en længere minimumsperiode og en kortere maksimumperiode. Der kan maksimalt udbetales tilskud til tre børn pr. husstand. Kommunalbestyrelsen kan alene give et tilskud pr. barn og kun i et tidsrum, der holder sig inden for de fastsatte minimums -og maksimumsgrænser. Tilskuddet tildeles det enkelte barn for en periode, der holder sig inden for de fastsatte tidsgrænser. Den samlede tilskudsperiode kan deles i to og må samlet set ikke overstige den fastsatte maksimumsperiode. Hvis tilskudsperioden opdeles i to, kan perioden deles mellem barnets forældre, hvis begge forældre har ret til ydelser og opfylder betingelserne for at modtage tilskud til pasning af egne børn. Tilskuddets størrelse Det er kommunalbestyrelsen i den enkelte kommune, der fastsætter tilskuddet til pasning af egne børn. Tilskuddet skal fastsættes ens for alle børn inden for samme aldersgruppe. Tilskuddet kan højst udgøre 85 procent af den billigste nettodriftsudgift i et dagtilbud til samme aldersgruppe i kommunen. Det samlede tilskud pr. husstand kan ikke overstige beløbet for maksimale dagpenge. Tilsyn med en forælder, der passer egne børn Kommunalbestyrelsen har en generel forpligtigelse til at føre tilsyn med de forhold, hvorunder børn i kommunen lever. Opdateret 17/10 2024 kl. 18:43 Spørgsmål om tilskud m.m. Spørgsmål om konkrete muligheder for modtagelse af tilskud, herunder om ansøgning med mere, skal rettes til din kommune. Mange svar findes også på borger.dk, hvor der også kan ansøges om tilskud med mere. Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven) Læs mere Rapport: Kort fortalt om kommuners tilskud til pasning af egne børn (2018)"
year_published = 2025
