["https://www.uvm.dk/folkeskolen/folkeskolens-proever/proeveafholdelse/brug-af-digitale-hjaelpemidler-og-kunstig-intelligens-ved-folkeskolens-proever"]
title = "Brug af digitale hjælpemidler og kunstig intelligens ved folkeskolens prøver | Børne– og Undervisningsministeriet"
full_description = "Adgang til hjælpemidler via internettet Medmindre det fremgår af prøvebekendtgørelsens bilag 1 og 2, må internettet ikke anvendes til at søge efter, tilgå eller anvende hjælpemidler. Hjælpemidler skal i den forbindelse forstås bredt som både informationer, noter, værktøjer mv. En undtagelse er dansk skriftlig fremstilling, hvor enhver information fra internettet må anvendes. Hjælpemidler, som har været anvendt i den daglige undervisning, må kun tilgås via internettet, hvis de ikke kan medbringes eller opbevares lokalt. Det kan fx være programmer, digitale værktøjer og/eller digitale undervisningsmaterialer. Skolens leder skal tage stilling til, om de konkrete hjælpemidler kan tilgås lokalt (for eksempel på elevens computer, usb-stik, elevens eller skolens drev/lukkede netværk) eller medbringes i papirform, inden der gives tilladelse til at tilgå hjælpemidler via internettet eller i skyen. Internettet må ikke bruges til at søge efter ny viden i prøvesituationen, hvis der fx stilles opgaver i områder, som eleven ikke har modtaget undervisning i. Hvis skolen opbevarer programmer og/eller dokumenter i en cloud-løsning, må elever gerne i prøvesituationen tilgå disse programmer og/eller dokumenter, hvis det ikke er muligt at downloade disse til elevens pc'er og/eller tablet eller lignende. ChatGPT og kunstig intelligens Det er ikke tilladt at benytte ChatGPT, WolframAlpha og andre tekstgenererende chatbot-værktøjer ved hverken de skriftlige eller mundtlige prøver i folkeskolen. Det gælder under hele prøvetiden, herunder i forbindelse med informationssøgning, korrekturlæsning, opgavebesvarelse, redigering mv. Hvis der er afsat forberedelsestid forud for prøven, må eleverne heller ikke benytte chatbots, eksempelvis til at besvare de lærerstillede spørgsmål. Til grund for dette ligger bekendtgørelse om folkeskolens prøver § 43, stk. 2 (retsinformation.dk). Det betragtes som snyd og skal indberettes til skolens leder, hvis en elev ”har udgivet en andens arbejde for sit eget”. Det vil således være i strid med prøvebekendtgørelsen, hvis en elev afleverer en besvarelse, hvor hele eller dele af besvarelsen er genereret af et chatbot-værktøj. Ekspertgruppe undersøger imødegåelse af snyd med digitale hjælpemidler I maj 2023 nedsatte børne- og undervisningsministeren en ekspertgruppe, der skal undersøge ChatGPT og andre digitale hjælpemidlers konsekvenser for prøverne på landets skoler, ungdomsuddannelser og voksenuddannelser. Ekspertgruppen afleverede sine anbefalinger til Børne- og Undervisningsministeriet i april 2024. Læs ekspertgruppens anbefalinger om ChatGPT og andre digitale hjælpemidler (pdf). Digitale hjælpemidler ved folkeskolens skriftlige prøver i engelsk, tysk og fransk Til folkeskolens skriftlige prøver i fremmedsprog (engelsk, tysk og fransk) FP9 og FP10 må elever under delprøven i skriftlig fremstilling ikke anvende tekstbehandling med stave- og grammatikkontrol. Eleverne skal i stedet anvende et nyt, centralt stillet tekstfelt til besvarelse af delprøven i skriftlig fremstilling i tysk, engelsk og fransk. Tekstfeltet erstatter tekstbehandlingsprogrammer som Word og Google Docs i fremmedsprogfagsprøverne. Eleverne skal fremover downloade den digitale prøve i skriftlig fremstilling og skrive deres besvarelse direkte ind i et lukket skrivefelt på en hjemmeside i stedet for at udarbejde besvarelsen i et tekstbehandlingsprogram. Når opgaven er færdiggjort, vil besvarelsen kunne omdannes til en PDF, der kan gemmes, printes og afleveres. Læs mere om tekstfeltet Tekstfeltet indeholder ikke stave- og grammatikkontrol, der fra skoleåret 2024/2025 ikke længere er et tilladt hjælpemiddel ved de skriftlige prøver i fremmedsprogsfagene. Det betyder, at tekstfeltet hverken viser de blå og røde streger, der indikerer en stave- eller grammatikfejl eller alternative skrivemåder (ordforslag). Eleverne skal således selv forsøge at finde frem til den korrekte stavemåde. Reglerne for anvendelsen af hjælpemidler ved de skriftlige prøver i engelsk, tysk og fransk (FP9 og FP10) fremgår her: Bilag 1, pkt. 5.5., 6.5, 7.5. og Bilag 2, pkt. 3.5., 4.5. og 5.5 i bekendtgørelse om folkeskolens prøver (retsinformation.dk) og vejledningerne til folkeskolens prøver i engelsk, tysk og fransk i 9. og 10. klasse. For andre fagspecifikke retningslinjer og vejledning i tilladte hjælpemidler henviser Styrelsen for Undervisning og Kvalitet til Prøvevejledninger til folkeskolens prøver. Ingen adgang til stave- og grammatikkontrol fra vinterterminen 2024 Fra prøveterminen i december 2024 vil eleverne skulle anvende et tekstfelt til at besvare delprøven i skriftlig fremstilling i fremmedsprogsfagene engelsk, tysk og fransk. Tekstfeltet vil ikke tilbyde stave- og grammatikkontrol som hjælpemiddel. Ændringen vil gøre det lettere at føre tilsyn ved prøverne og hjælpe eleverne med at undgå utilsigtet snyd. Eleverne vil fortsat kunne anvende ordbøger og grammatiske oversigter som hjælpemiddel. Kan disse ikke medbringes eller opbevares lokalt, kan de efter skolelederens nærmere anvisninger tilgås via internettet. Elever på særlige prøvevilkår vil kunne få adgang til de samme hjælpemidler som hidtil, og tekstfeltet er kompatibelt med læse- og skriveværktøjer. Styrelsen for Undervisning og Kvalitet sørger for at udsende vejledningsmateriale forud for prøverne i december 2024. ChatGPT og kunstig intelligens til folkeskolens prøver Fold alle ud/ind Opdateret 07/10 2024 kl. 17:32 Må eleverne benytte ChatGPT eller andre chatbots under folkeskolens prøver? Nej, det er ikke tilladt at bruge ChatGPT til nogen af folkeskolens prøver. Opdateret 07/10 2024 kl. 17:32 Må eleverne benytte ChatGPT eller andre chatbots til at fremsøge information under de skriftlige prøver? Nej, det er ikke tilladt at bruge ChatGPT til at fremsøge information, idet elevens besvarelse skal være selvstændig. Opdateret 07/10 2024 kl. 17:32 Må eleverne benytte ChatGPT eller andre chatbots til korrekturlæsning under folkeskolens skriftlige prøver? Nej. Eleverne må ikke bruge ChatGPT eller andre chatbots til korrekturlæsning. Det betragtes som snyd, hvis en elev udgiver en andens arbejde for at være sit eget, herunder også en chatbots arbejde. Opdateret 07/10 2024 kl. 17:29 Må eleverne benytte ChatGPT eller andre chatbots til at konstruere tekststykker, sætninger eller hele opgaver under de skriftlige prøver? Nej. Eleverne må hverken bruge en chatbot til at konstruere korte eller lange tekststykker. Det betragtes som snyd, hvis en elev udgiver en andens arbejde for at være sit eget, herunder også en chatbots arbejde. Opdateret 07/10 2024 kl. 17:30 Må eleverne benytte ChatGPT eller andre chatbots under den tilrettelagte forberedelsestid i en mundtlig prøve, eksempelvis til besvarelsen af de lærerstillede spørgsmål i kulturfagene? Nej, ligesom ved de skriftlige prøver må eleverne ikke udgive en andens arbejde for at være sit eget. Stave- og grammatikkontrol til folkeskolens skriftlige prøver i engelsk, tysk og fransk (FP9 og FP10) Fold alle ud/ind Opdateret 28/04 2023 kl. 10:20 Må elever anvende stave- og grammatikkontrol ved folkeskolens skriftlige prøver i engelsk, tysk og fransk (FP9 og FP10)? Nej. Eleverne skal anvende det centralt stillede tekstfelt. Tekstfeltet vil ikke tilbyde stave- og grammatikkontrol som hjælpemiddel. Opdateret 28/04 2023 kl. 10:20 Hvilke hjælpemidler er tilladt ved folkeskolens skriftlige prøver i engelsk, tysk og fransk (FP9 og FP10)? Ved delprøverne i lytte- og læsefærdigheder (kun ved FP9): Ingen hjælpemidler er tilladt. Ved delprøven i sprogligt fokus: Der må kun anvendes ordbøger og grammatiske oversigter. Ordbøger og grammatiske oversigter, som ikke kan medbringes eller opbevares lokalt, kan efter skolelederens nærmere anvisning tilgås via internettet. Ved delprøven i skriftlig fremstilling: Eleverne må fortsat anvende ordbøger og grammatiske oversigter som hjælpemiddel. Kan disse ikke medbringes eller opbevares lokalt, kan de efter skolelederens nærmere anvisninger tilgås via internettet. Elever på særlige prøvevilkår kan få adgang til de samme hjælpemidler som hidtil, og tekstfeltet er kompatibelt med læse- og skriveværktøjer. Ved snyd med digitale hjælpemidler Fold alle ud/ind Opdateret 28/04 2023 kl. 10:20 Hvilke konsekvenser er der i tilfælde af snyd med digitale hjælpemidler ved folkeskolens prøver? Opstår der før, under eller efter en prøve mistanke om snyd, skal den tilsynsførende indberette dette til skolens leder. Bliver mistanken før, under eller efter en prøve bekræftet og har handlingen fået eller ville kunne få betydning for bedømmelsen af prøvebesvarelsen kan skolens leder: bortvise eleven fra prøven, beslutte, at prøvebesvarelsen bortfalder, og beslutte, at eventuelle karakterer bortfalder. En elev, der bortvises fra en prøve, skal ved både bekræftet eller ubekræftet mistanke om snyd, tilbydes at aflægge prøve på ny, jf. §43 bekendtgørelse om folkeskolens prøver. Opdateret 28/04 2023 kl. 10:19 Hvordan håndteres snyd med digitale hjælpemidler ved folkeskolens skriftlige prøver? Hvis en tilsynsførende under en skriftlig prøve får mistanke om snyd, bør den tilsynsførende i de fleste tilfælde undlade at forstyrre den pågældende elev. Dette er af hensyn til eleven, da konsekvensen er, at eleven skal aflægge prøven igen, også i tilfælde af, at formodningen ikke kan bekræftes. Griber den tilsynsførende en elev i utvivlsomt at snyde, skal skolens leder straks informeres og bortvise eleven fra den pågældende prøve. Tilsyn under prøverne Fold alle ud/ind Opdateret 28/04 2023 kl. 10:23 Hvem er ansvarlig for, at reglerne omkring anvendelsen af digitale hjælpemidler ved folkeskolens prøver bliver overholdt under prøveafholdelsen? Det er skoleleders ansvar at sikre, at eleverne inden prøven bliver grundigt orienteret om anvendelse af hjælpemidler ved prøven og konsekvenser ved at skaffe sig selv eller yde andre uretmæssig hjælp, benytte ikke-tilladte hjælpemidler, udgive en andens arbejde for sit eget eller anvende eget tidligere bedømt arbejde uden henvisning hertil. Prøve på særlige vilkår Fold alle ud/ind Opdateret 28/04 2023 kl. 10:25 Hvilke digitale hjælpemidler må elever, der aflægger prøve på særlige vilkår, bruge? For elever, der eksempelvis er ordblinde, kan der blive stillet en række ekstra hjælpemidler til rådighed. Der kan findes mere information om dette på hjemmesiden under ’Prøver på særlige vilkår og fritagelser”."
year_published = 2025
