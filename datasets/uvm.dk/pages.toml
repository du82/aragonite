["https://www.uvm.dk/erhvervsuddannelser/oplaering/uddannelsesaftaler/indgaa-uddannelsesaftaler"]
title = "Indgå uddannelsesaftaler | Børne– og Undervisningsministeriet"
description = "Her kan du l&aelig;se om, hvordan man indg&aring;r uddannelsesaftaler digitalt p&aring; L&aelig;repladsen.dk eller manuelt p&aring; pdf-blanketter."
full_description = "Den digitale uddannelsesaftale kan indgås via Lærepladsen.dk. Ved brug af den digitale uddannelsesaftale på Lærepladsen.dk er det nemt at udfylde uddannelsesaftalen korrekt, og samarbejdet mellem skole, virksomhed og elev foregår hurtigt og problemfrit. Underskrift med NemID samt digital forsendelse og opbevaring giver både mindre administration og mere sikker administration. Hjælp til oprettelse af uddannelsesaftale? Har du brug for hjælp til oprettelse af uddannelsesaftale så kontakt erhvervsskolen. Alternativt kan du kontakte supporten for Lærepladsen.dk via supportsag (jura.stil.dk) eller telefonisk på tlf. 70 21 21 57. Hvordan kommer man i gang? Adgang til digitale uddannelsesaftaler sker via Lærepladsen.dk. Virksomheden eller skolen skal logge på med NemID for at oprette en aftale. Virksomheden kan sende en kladde til skolen og bede om hjælp til udfyldelsen. Oprettes uddannelsesaftalen af skolen, modtager virksomheden en mail med link til uddannelsesaftalen. Virksomheden kan udfylde eventuelle mangler og underskrive aftalen med NemID. Aftalen kommer automatisk til underskrift hos eleven/lærlingen via en mail med link til uddannelsesaftalen. Eleven/lærlingen skal underskrive aftalen med NemID. Elever/lærlinge under 18 år skal efter underskrift sende uddannelsesaftalen videre til forældre/værge. Når aftalen er underskrevet af begge parter (elev/lærling og virksomhed), får skolen besked og færdigregistrerer aftalen. Når skolen er færdig med at behandle/registrere aftalen, sendes der automatisk besked til virksomhed og elev. Læs mere om Lærepladsen.dk og de digitale uddannelsesaftaler på viden.stil.dk. Blanketter og vejledninger til uddannelsesaftaler Uddannelsesaftale (pdf) Vejledning til uddannelsesaftale (pdf) Tillæg til uddannelsesaftale (pdf) Vejledning til tillæg om uddannelsesaftale (pdf) Ophævelse af uddannelsesaftale (pdf) Vejledning til ophævelse af uddannelsesaftale (pdf) Erklæring om delvis gennemført oplæring (pdf)"
