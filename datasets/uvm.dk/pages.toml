full_description = "Forside Uddannelsessystemet Om det danske uddannelsessystem, 7-trinsskalaen og den danske kvalifikationsramme. Overblik over uddannelsessystemet Om det ordinære uddannelsessystem og det parallelle voksen- og efteruddannelsessystem. 7-trins-skalaen Få overblik over karakterer på skalaen, brugen af skalaen og oversættelse fra 13-skalaen. Den danske kvalifikationsramme Om sammenligning af uddannelsers niveau og anerkendelse af kvalifikationer i uddannelsessystemet. Ekspertgruppe for ændring af karakterskalaen Regeringen nedsatte i foråret 2020 en ekspertgruppe, der skulle se på fordele og ulemper ved modeller for en ændret karakterskala. 7-trins-skalaen Studerende er bestået, når hun/han får karakteren 02, 4, 7, 10 eller 12. Se beskrivelsen af alle syv karakterer. Genveje Oversigt over uddannelsessystemet Oversigt over voksen- og efteruddannelsessystemet Oversæt 13-skalaen til 7-trins-skalaen"
