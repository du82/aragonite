["https://www.uvm.dk/almen-voksenuddannelse-avu"]
title = "Almen voksenuddannelse (avu) | Børne– og Undervisningsministeriet"
description = "<p>Avu er for voksne, som vil forbedre deres almene kundskaber og muligheder for videre uddannelse.</p>"
full_description = "Forside Almen voksenuddannelse (avu) Avu er et tilbud til voksne, som ønsker at forbedre deres almene kundskaber. Uddannelsen udbydes som undervisning i enkeltfag, der afsluttes med prøver og eksamen. Om avu Uddannelsens formål, målgruppe og indhold. Adgangskrav og tilmelding Optagelse, kursisters egenbetaling og støttemuligheder. Undervisning og fag Fag, læreplaner, fagkonsulenter og individuel kompetencevurdering. Prøver og eksamen Om prøver, evaluering og almen forberedelseseksamen. Ansvar og aktører Love og centrale bekendtgørelser med betydning for avu. Love og regler Love og centrale bekendtgørelser med betydning for avu. Spørgsmål og svar Læs svarene på de oftest stillede spørgsmål om almen voksenuddannelse. Breve fra STUK Breve til institutionerne om fortolkning, præcisering eller indskærpelse af regler på avu-området. Eftersyn af avu og hf-e Ministeriet har gennemført et eftersyn af avu og hf-enkeltfag. Læs den fulde beretning. Bedre veje til uddannelse og job Det forberedende område skal forenkles og indsatsen for de unge, som ikke følger den lige vej efter grundskolen, skal styrkes. Nyheder Nyhed · 10. december 2024 Ny undersøgelse: Mange voksne har stadig mangelfulde færdigheder i læsning og regning Nyhed · 5. december 2024 Erhvervsskolen Rybners overtager midlertidigt udbuddet af uddannelser fra konkursramte AMU-Vest Nyhed · 5. december 2024 AMU-Vest har indleveret egenbegæring om konkurs Flere nyheder"
