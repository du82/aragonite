full_description = "Forside Arbejdsmarkedsuddannelser Arbejdsmarkedsuddannelser (AMU) er uddannelser for ufaglærte og faglærte, der ønsker erhvervsrettede kompetencer og kvalifikationer. Hvad og hvor? Hvad er AMU, og hvor bliver det udbudt? Regelsæt og aktører Relevante love, bekendtgørelser og vejledninger, samt beskrivelse af ansvar og aktører i AMU. Adgang og tilmelding Målgruppen for AMU, adgangskravene samt hvordan man tilmelder sig en AMU-uddannelse. Særlige målgrupper samt støttemuligheder AMU for tosprogede, TAMU, AMU i fængsler/ arresthuse, SPS og basale færdigheder. Undervisningens tilrettelæggelse og prøver Fleksibel tilrettelæggelse, kombination af AMU og andre uddannelser samt regler og rammer for prøver. Deltagerbetaling og tilskudsmuligheder Deltagerbetaling på AMU samt muligheder for tilskud og VEU-godtgørelse. Puljer, forsøg og kvalitetssikring Puljer og forsøgsordninger, kvalitetssikring og Viskvalitet.dk samt tilsyn på AMU."
