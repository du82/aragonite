["https://www.uvm.dk/global/news/uvm/2025/feb/250218-aftale-om-ny-gymnasieuddannelse-paa-plads"]
title = "Aftale om ny gymnasieuddannelse på plads | Børne– og Undervisningsministeriet"
full_description = '''Alle unge skal efter grundskolen have mulighed for at begynde på en uddannelse i nærheden af, hvor de bor, hvor der er et stærkt ungdomsmiljø, og som holder alle døre åbne til videre uddannelse. Det mener regeringen (Socialdemokratiet, Venstre og Moderaterne) og Socialistisk Folkeparti og Dansk Folkeparti, der i dag har indgået en aftale om en milliardinvestering i en ny gymnasieuddannelse. I forhandlingerne har der særligt været fokus på samtidig at styrke uddannelsesmulighederne uden for de større byer. Regeringen og partierne er enige om, at der skal oprettes en ny erhvervs- og professionsrettet gymnasieuddannelse (epx), som skal slå dørene op i august 2030. Med aftalen prioriteres der cirka 5 milliarder kroner årligt til at drive epx, når uddannelsen er fuldt indfaset. Det skal understøtte, at elever på uddannelsen både skal have boglig og praktisk undervisning af høj kvalitet og skal have adgang til udstyr og værksteder som for eksempel simulationsrum, medielokaler, værksteder og laboratorier. Derudover afsættes der 4,8 milliarder kroner i 2027-2034 til implementering, herunder især engangsinvesteringer i værksteder, nye faglokaler og udstyr. Aftalen indebærer merudgifter på cirka 2,3 milliarder kroner årligt fra 2030. Det svarer til et løft på cirka 10 procent i forhold til udgifterne til ungdomsuddannelserne i dag. Epx-gymnasiet i overskrifter 1. Epx åbner i 2030 Elever kan begynde på epx fra 2030, hvor de vil møde en kombination af praktisk og teoretisk undervisning. 2. Epx lukker ingen døre til videre uddannelse Unges valg af ungdomsuddannelse må ikke lukke døre for videre uddannelse senere i livet. Med epx får unge mulighed for adgang til videregående uddannelser og erhvervsuddannelser. 3. Epx er for alle, der har bestået folkeskolen Omkring 10.000 flere unge årligt får mulighed for at gå i gymnasiet. Stort set alle unge kan dermed få et par år i et godt socialt miljø til at blive klogere på, hvad de gerne vil. 4. Epx-reform sikrer gymnasier i hele landet En række gymnasier uden for de større byer er udfordret af faldende ungdomsårgange. Med epx-reformen kan de opretholdes. 5. Epx er den største investering i de unge i årtier Der afsættes 5 milliarder kroner årligt til at drive epx samt 4,8 milliarder kroner i engangsinvesteringer til værksteder, nye faglokaler og udstyr. Ny praktisk gymnasieuddannelse, epx Uddannelsen bliver en toårig gymnasieuddannelse med mulighed for en etårig overbygning. Elevernes skoledag bliver en kombination af praktisk og boglig undervisning. Det er aftalepartiernes ambition, at epx-uddannelsen skal være præget af undervisning i tæt samarbejde med erhvervsliv og relevante offentlige institutioner. På epx vil unge i Danmark få en ny vej til studiekompetence og almen dannelse med både humanistiske, tekniske, naturvidenskabelige, etiske, æstetiske og digitale perspektiver. Uddannelsen opbygges med faglinjer og eleverne får en fast klasse for at sikre gode klassefællesskaber. Valget af faglinje vil tage afsæt i elevens egen interesse og vil ikke fastlåse elevens efterfølgende uddannelsesvalg. Aftalen sikrer, at der også i fremtiden er uddannelsesmuligheder for unge uden for de større byer. Både for dem, som ønsker sig en praktisk vej, og dem, som ønsker sig en mere boglig vej. Epx holder dørene åbne til de videregående uddannelser Den toårige epx giver adgang til erhvervsuddannelser og erhvervsakademiuddannelser. Der vil være mulighed for at tage en overbygning på et år, som giver adgang til alle professionsbacheloruddannelser. Adgang til akademiske bacheloruddannelserne vil kræve efterfølgende supplering eller udvidet fagpakke på op til seks måneder, som det kendes fra hf i dag. Eleverne kan inden for de eksisterende adgangskrav med en epx uden overbygning endvidere opnå adgang til visse professionsbacheloruddannelser via kvote 2, hvis de vælger og består bestemte gymnasiale fag i løbet af uddannelsen. Det er dog ambitionen at justere optagelsessystemet i god tid, før det er relevant for ansøgere fra epx, jf. Aftale om rammerne for reform af universitetsuddannelser i Danmark. Det vil kræve en bestået folkeskolens afgangseksamen eller aflagt prøve fra den forberedende grunduddannelse (fgu) at blive optaget på epx. På uddannelsens første år skal alle elever i udgangspunktet have dansk, matematik og engelsk på gymnasialt C-niveau. På andet og tredje år kan eleverne vælge at løfte disse og andre fag til B- og A-niveau. Eleverne vil derudover blive undervist i en række erhvervsfag og professionsrettede fag. Der nedsættes en faglig ekspertgruppe, som skal komme med anbefalinger til den konkrete tilrettelæggelse af epx-uddannelsen, blandt andet uddannelsens struktur, fag og prøveformer. Med reformen af ungdomsuddannelseslandskabet afskaffes den toårige hf, 10. klasse, eux og grundforløbets 1. del på erhvervsuddannelserne og erstattes af epx. Dette giver mulighed for at sikre mere sammenhængende forløb for alle unge og styrke uddannelsesmulighederne uden for de største byer. Det er aftalekredsens ambition, at epx skal have samme brede geografiske tilgængelighed, som stx har det i dag, og at reformen samtidig kan fastholde de mange stx-gymnasier, som i dag er truet af mindre ungdomsårgange. Skoler og kommuner skal kunne tage forskud på nogle af de ændringer, reformen medfører. Blandt andet skal lovgivningen ændres, så der bliver mulighed for, at hf også kan forberede elever til erhvervsuddannelserne. Samtidig skal der være bedre muligheder for, at kommuner og erhvervsskoler kan samarbejde om 10. klasse. Gode muligheder for dem, der ikke er klar Aftalen sikrer, at unge og voksne, som ikke tager den lige vej i det ordinære uddannelsessystem, eller som senere ønsker at skifte spor, får fleksible uddannelsesmuligheder i det nye uddannelseslandskab. Det vil således fortsat være muligt at tage gymnasiale enkeltfag, som man kender fra hf i dag. Tilmed afskaffes egenbetalingen i enkeltfagssystemet for personer i den erhvervsaktive alder, der ikke har en gymnasial eksamen. Nye krav til hhx, (htx) og stx Det faglige niveau på hhx, (htx) og stx skal hæves. Regeringen og aftale-partierne har derfor med aftalen besluttet at hæve karakterkravet til hhx, (htx) og stx til 6,0 i karaktergennemsnit i både de afsluttende standpunktskarakterer og i de lovbundne prøver fra folkeskolens afgangseksamen. Nye regler om optagelse er uddybet i faktaark 4 nedenfor. Derudover har aftalepartierne en ambition om, at der også fremadrettet skal være bred geografisk dækning af tekniske gymnasietilbud. En ekspertgruppe skal se på, om det er hensigtsmæssigt at integrere htx i stx, og skal beskrive konkrete modeller herfor. Med aftalen følger også en række ændringer, som skal understøtte udfordrede institutioner med at tiltrække ansøgere og derved sikre et bæredygtigt elevgrundlag eller en mere balanceret elevsammensætning. Eksempelvis vil profilgodkendelse fremover forudsætte, at godkendelsen enten kan bidrage til at sikre gymnasier i tyndt befolkede områder eller til at skabe en mere balanceret elevsammensætning. Det er aftalepartiernes ambition, at de første elever skal starte på de nye gymnasier i august 2030. Aftalen indebærer ændringer, der er omfattet af gymnasieforliget samt forliget om 10. klasse. Regeringen har opsagt begge forlig, og der indgås i stedet et nyt gymnasieforlig ved indgåelse af aftalen om en ny erhvervs- og professionsrettet gymnasieuddannelse. ”Rigtig mange unge er glade for at gå i gymnasiet. Her bliver de dygtigere og mere afklarede, inden de vælger efterfølgende uddannelse. Den mulighed burde alle unge have. Derfor er jeg meget glad for, at et flertal i Folketinget nu afsætter et milliardbeløb til en ny gymnasieuddannelse, der vil være åben for alle, der ønsker sig en blanding af boglig og praktisk undervisning. Her får tusindvis af unge mulighed for at blive klogere, dygtigere og mere afklarede i et stærkt ungdomsmiljø,” siger børne- og undervisningsminister Mattias Tesfaye. ”Jeg er glad for, at vi i dag kan præsentere en aftale om en ny reform af vores ungdomsuddannelser. Med tilføjelsen af den nye erhvervs- og professionsrettede gymnasieuddannelse til vores uddannelseslandskab sikrer vi, at alle unge i fremtiden får mulighed for at få et stærkt og sammenhængende uddannelsestilbud i et attraktivt ungdomsmiljø, hvor dørene til videre uddannelse er åbne, og der er mere tid til at modnes og afklares. Den nye reform er samtidig et strukturelt svar på, hvordan vi fremtidssikrer ungdomsuddannelserne i landdistrikterne - og formentlig den selvstændige beslutning med størst positiv betydning for landdistrikternes uddannelsesdækning, der er truffet i årevis. Samtidig anerkender vi efterskolernes unikke og vigtige rolle for vores unge og holder fast i, at man stadig kan tage et 10. skoleår på en efterskole. Det var en bunden opgave at handle på de udfordringer, vores ungdomsuddannelser står overfor. Jeg vil gerne sige tak for aftalepartierne for et godt og seriøst samarbejde, der sikrer et ambitiøst svar på udfordringerne,” siger Økonomiminister Stephanie Lose. “Jeg har selv været direktør for en erhvervsskole, hvor jeg oplevede, at skolens pressede økonomi og manglende sociale miljø fik de unge til at søge andre steder hen, selvom de egentlig havde interesse for erhvervsskolen. Det laver vi om på nu. Vi sikrer med den nye aftale, at de unge får et langt mere attraktivt ungdomsmiljø med fester og jævnaldrene kammerater. Og vi giver et slagkraftigt økonomisk boost til epx på 5 milliarder kroner. På epx'en får eleverne en tæt kobling mellem teori og praksis og mulighed for samarbejde med erhvervslivet. Det giver super relevant erfaring til de unge, når de måske skal videre på de videregående uddannelser," siger Kulturminister Jakob Engel-Schmidt. ”Jeg er så glad for, at vi nu lytter til de unge. Vi sikrer, at alle unge kan få nogle gode og spændende år i gymnasiet, hvor de kan prøve forskellige faglige interesser af uden at lukke nogen døre for deres valg af uddannelse senere hen. I stedet for i dag, hvor der er mange unge på kun 15-16 år, der skal vælge mellem mere end hundrede erhvervsuddannelser og hvor for mange af dem falder fra igen. Med aftalen får vi desuden, som mange unge har efterlyst, et mere praktisk gymnasium, og vi sikrer, at der også i fremtiden vil være gymnasier tæt på de unge, også i landdistrikterne,” siger Astrid Krag, Socialdemokratiet. “Med den nye EPX skaber vi en ny ungdomsuddannelse som sikrer at alle unge efter grundskolen vil have mulighed for at starte på en uddannelse tæt på hvor de bor. For Venstre har det været vigtigt at værne om efterskolerne og sikre at unge fortsat kan tage et 10. skoleår på efterskolerne. Desuden er vi i Venstre glade for at landbrugsskolerne kommer til at kunne tilbyde en grøn EPX-linje . Alt i alt en meget stor og vigtig aftale, som jeg er stolt af at vi er nået i mål med," siger Anni Mathiesen, Venstre. ”Unge er forskellige. Alligevel har gymnasiet i over 100 år kun været for de boglige. Det har presset over 70% af en årgang ind i en ramme, som de ikke alle sammen passer ind i. Det har medført unødig mistrivsel og stress samt et rekordhøjt antal ufaglærte studenter, der ikke er kommet videre 5 år efter, de fik huen på. Det ændrer vi på med den her reform. Vi udvider gymnasiet til også at rumme et erhvervs- og professionsrettet gymnasium, hvor unge, der ikke nødvendigvis brænder for oldtidskundskab og tredjegradsligninger kan få en mere virkelighedsnær undervisning og blive en del af et attraktivt ungdomsmiljø. Det er helt afgørende at give disse unge et attraktivt tilbud i en tid, hvor erhvervs- og professionsuddannelserne oplever vigende ansøgertal samtidig med at behovet for professionerne stiger. Jeg er meget stolt af at være en del af den her aftale og glæder mig inderligt over, at mine to drenge efter 9. klasse kigger ind i et ungdomsuddannelseslandskab, hvor epx er en del af det," siger Rasmus Lund-Nielsen, Moderaterne. ”Vi har i SF kæmpet i årevis for at få en ny karakterskala og et karakterfrit 1.g. Det kommer nu. Så når regeringen har stået stejlt på karakterkravet, har vi fået lettet presset, de steder vi kunne. Vi sørger samtidig for, at det sociale tilskud til efterskoler hæves. En lille, men vigtig del af den her milliardstore aftale. Og milliardinvesteringen er faktisk det vigtigste. Det her er ikke en spareøvelse eller ren omrokering af uddannelsespenge. Det er mange nye ressourcer, vi nu sætter af til fremtidens uddannelsessystem og de unge, der plejer at få færrest uddannelseskroner, på tværs af landet og på tværs af interesser," siger Sofie Lippert, Socialistisk Folkeparti. “Dansk Folkeparti glæder sig over, at vi med denne aftale ud over en oprettelse af en praktisk gymnasieuddannelse (epx) sikrer landdistriktsgymnasierne, afskaffer færdiggørelsestaxameteret, gør det markant billigere for børn fra lavindkomstfamilier at komme på efterskole, indfører et karakterkrav på 7 og 6 for at komme i gymnasiet og påbegynder en justering af karakterskalaen," Siger Alex Ahrendtsen, Dansk Folkeparti. Aftaletekst Læs hele aftaleteksten (pdf) Bilag 1: Nye muligheder efter 9. klasse (pdf) Bilag 2: Danmarkskort (pdf) Faktaark 1. Epx-gymnasiet i overskrifter (pdf) 2. Økonomi (pdf) 3. Epx – et erhvervs- og professionsrettet gymnasium (pdf) 4. Skærpede karakterkrav til hhx, (htx) og stx (pdf) 5. Håndtering af ansøgere til de gymnasiale uddannelser (pdf) 6. Antal elever på gymnasiale uddannelser i 2035 (pdf) 7. Landkort med epx-udbud (pdf) Se video fra pressemødet'''
