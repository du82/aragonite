["https://www.uvm.dk/almen-voksenuddannelse-avu/tilmelding-og-deltagerbetaling"]
title = "Tilmelding og deltagerbetaling | Børne– og Undervisningsministeriet"
description = "Optagelse, kursisters egenbetaling og støttemuligheder."
full_description = "Undervisningen foregår primært på voksenuddannelsescentre og udbydes af VUC (vuc.dk), som findes rundt om i landet. Adgangskrav Det er institutionen, der beslutter om en ansøger kan optages. Optagelse på forskellige fag og niveauer sker ud fra en konkret vurdering af ansøgerens forudsætninger for at kunne følge undervisningen. Man skal som hovedregel være fyldt 25 år for at starte på avu, men voksne under 25 år kan under særlige omstændigheder få adgang, eksempelvis hvis vedkommende er selvforsørgende eller deltidsbeskæftiget. Undtagelsesbestemmelserne følger af avu-lovens § 2. Deltagerbetaling Der er deltagerbetaling ved avu. Den almindelige deltagerbetaling udgør aktuelt (2025) 140 kroner for kernefag, og 1.430 for tilbudsfag. Læs mere om de enkelte fag på avu Kursister, der modtager efterløn eller en aldersbetinget pension, betaler en forhøjet deltagerbetaling på 750 kroner ekstra pr. fag. Kursister, der har en videregående uddannelse, skal betale fuld deltagerbetaling. Prisen afhænger af uddannelsestiden og varierer derfor mellem cirka 4.800 kroner og 20.100 kroner. Støtte Du kan få uddannelsesstøtte til avu, hvis en række betingelser er opfyldt. For at få SU (Statens Uddannelsesstøtte) skal du blandt andet være fyldt 18 år, have mindst 23 undervisningstimer om ugen (17 timer, hvis du har et hjemmeboende barn under 7 år) og være studieaktiv. Hvis du er SU-modtager, kan du også få tilskud til dækning af deltagerbetaling. Du kan højst få dækket 85 procent af det månedlige beløb. Du kan få SVU (Statens Voksenuddannelsesstøtte) til avu, hvis en række nærmere omstændigheder er opfyldt, herunder at du er fyldt 25 år, er i beskæftigelse og har aftalt uddannelsesforløbet med din arbejdsgiver. Læs mere om dine søgemuligheder nedenfor. Læs mere Bekendtgørelse om deltagerbetaling ved almen voksenuddannelse og gymnasiale enkeltfag (retsinformation.dk) Lov om almen voksenuddannelse og om anerkendelse af realkompetence i forhold til fag i almen voksenuddannelse, i uddannelsen til hf-eksamen og i uddannelsen til almen studentereksamen (avu-loven) (retsinformation.dk) Beregner af kursuspris for personer med videregående uddannelse Statens Uddannelsesstøtte (su.dk) Mulighederne for tilskud til dækning af deltagerbetaling (su.dk) Statens Voksenuddannelsesstøtte (svu.dk)"
year_published = 2025
