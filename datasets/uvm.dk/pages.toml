title = "Fejl og mangler i forbindelse med prøver  | Børne– og Undervisningsministeriet"
description = "Ved afholdelse af prøver kan der opstå fejl og mangler. Læs om hvordan du som skoleleder eller prøveansvarlig håndterer sådanne."
full_description = "Fejl og mangler ved prøver kan være udefrakommende larm, fejl i selve prøveoplægget eller fejl i prøveforløbet. Hvis der er fejl i et prøveoplæg til en skriftlig prøve, skal skolelederen eller den prøveansvarlige straks kontakte Kontor for Prøver, Eksamen og Test på telefon: 33 92 61 00. Kontor for Prøver, Eksamen og Test vurderer, om fejlen kan udbedres under prøven, eller om eleverne skal tilbydes en ombedømmelse eller omprøve. Hvis der opstår andre fejl og mangler ved en prøve, skal skolelederen eller den prøveansvarlige håndtere disse efter nedenstående retningslinjer. Retningslinjer ved fejl og mangler Fold alle ud/ind Opdateret 17/02 2017 kl. 13:29 Udefrakommende forstyrrelser Forstyrrelserne kan for eksempel være larm fra en boremaskine eller en alarm. Hvis det er muligt, skal skolelederen straks stoppe forstyrrelsen. Hvis det ikke umiddelbart er muligt at stoppe forstyrrelsen, sættes prøven i bero, og eleverne holdes under opsyn, indtil larmen er stoppet. Prøven genoptages herefter samtidig med, at prøvetiden sættes i gang igen. På den måde får eleverne samlet den fastsatte tid for prøven. Hvis skolelederen vurderer, at forstyrrelsen er for langvarig, kan skolelederen tilbyde eleverne en ny prøve snarest muligt. Opdateret 17/02 2017 kl. 13:29 Fejl i et prøveoplæg til en mundtlig prøve Hvis der i prøveoplægget til en mundtlig prøve mangler et afsnit i et af bilagene, vurderer skolelederen, om den manglende tekst har påvirket elevens præstation og bedømmernes mulighed for at bedømme korrekt ved prøven. Hvis dette gør sig gældende, tilbyder skolens leder eleven en ny prøve snarest muligt. Hvis fejlen i et prøveoplæg til en mundtlig prøve har haft indflydelse på elevens præstation og bedømmernes mulighed for at bedømme præstationen korrekt, kan skoleleder lade eleven gå til ny prøve i samme prøvetermin, hvis det praktisk kan lade sig gøre. Opdateret 17/02 2017 kl. 13:29 Fejl og mangler af særlig grov karakter Ved fejl og mangler af særlig grov karakter, som ikke vedrører fejl i prøvesættet, kan skolelederen beslutte, at en afholdt prøve annulleres. Skolelederen skal herefter tilbyde eleverne en omprøve. Opdateret 17/02 2017 kl. 13:29 Fejl ved prøveforløb - eleven får ikke den fastsatte forberedelses- eller prøvetid Skolelederen vurderer, om den manglende tid har påvirket elevens præstation ved prøven. Hvis skolens leder finder, at bedømmerne kan tage højde for den manglende tid i bedømmelsen af elevens besvarelse, gennemføres prøven. Hvis skolelederen mener, at den manglende forberedelses- eller prøvetid påvirker elevpræstationen og karakterfastsættelsen, tilbydes eleverne en ny prøve snarest muligt. Ved mundtlige prøver kan skolens leder lade eleverne få en omprøve i samme prøvetermin, hvis det praktisk kan lade sig gøre. Opdateret 17/02 2017 kl. 13:29 Fejl ved prøveforløbet - eleven får ikke adgang til de tilladte hjælpemidler Skoleleder vurderer, om de manglende hjælpemidler har påvirket elevens præstation ved prøven. Hvis skolens leder vurderer, at bedømmerne kan tage højde for de manglende hjælpemidler i bedømmelsen af elevens præstation, gennemføres. Hvis skolens leder vurderer, at de manglende hjælpemidler har påvirket elevens præstation i et sådant omfang, at besvarelsen ikke kan vurderes på et tilstrækkeligt grundlag, må tilbydes eleven en ny prøve snarest muligt. Ved mundtlige prøver kan skolens leder lade eleven få en omprøve i samme prøvetermin, hvis det praktisk kan lade sig gøre. Opdateret 24/04 2018 kl. 15:32 Fejl ved prøveforløbet - oplæsningsfejl i retskrivningsprøven En tilsynsførende kontrollerer, at lærerens diktering er korrekt, og skal straks gøre opmærksom på en eventuel fejldiktering eller anden afvigelse fra instruktionerne på lærerarket. Der kan ikke efterfølgende gives særregler eller tages specielle hensyn i forhold til fejldiktering; eventuelle fejl skal rettes med det samme. Opdateret 05/03 2020 kl. 09:36 Karaktergivning ved ombedømmelse og omprøve på grund af fejl eller mangler Ombedømmelse og omprøve på grund af fejl og mangler kan ikke resultere i en lavere karakter på prøvebeviset, medmindre omprøven skyldes annullering af den oprindelige prøve. Hvis en elev får en lavere karakter ved omprøven eller ombedømmelsen end ved den oprindelige prøve, er det den højeste karakter fra den oprindelige prøve, som er gældende. Opdateret 17/02 2017 kl. 13:29 Bevis Skolelederen eller Styrelsen for Undervisning og Kvalitet kan beslutte, at et prøvebevis først udstedes, når en omprøve er eller ombedømmelse er foretaget. Regelgrundlaget Regelgrundlaget fremgår af prøvebekendtgørelsen, kap. 9. Læs mere Bekendtgørelse om folkeskolens prøver (retsinformation.dk)"
