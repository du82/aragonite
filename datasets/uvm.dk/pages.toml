["https://www.uvm.dk/flere-muligheder-for-voksne/euv"]
title = "Erhvervsuddannelse for voksne (euv) | Børne– og Undervisningsministeriet"
description = "Euv er en erhvervsuddannelse tilrettelagt særligt for voksne."
full_description = "Euv er erhvervsuddannelse for voksne elever og lærlinge på 25 år og derover. Mange voksne er både modne og målrettede, og har måske erfaringer fra en anden uddannelse eller beskæftigelse. Derfor er en euv som udgangspunkt af kortere varighed end den tilsvarende uddannelse for elever og lærlinge under 25 år. Kompetencevurdering Det konkrete uddannelsesforløb for den enkelte afhænger af, hvad eleven eller lærlingen har med i bagagen. Den voksnes uddannelsesforløb tilrettelægges på baggrund af en grundig og systematisk kompetencevurdering, som gennemføres som den indledende del af uddannelsen. En kompetencevurdering kan også gennemføres efter reglerne om enkeltfag under åben uddannelse, og finder da sted forud for optagelsen til uddannelsen. Læs mere om vurdering af kompetencer i euv-pjecen (pdf) På baggrund af kompetencevurderingen udarbejdes elevens eller lærlingens personlige uddannelsesplan, der beskriver hvilket af tre uddannelsesforløb, eleven eller lærlingen skal gennemføre. Euv 1: For voksne elever og lærlinge, der har mindst 2 års relevant erhvervserfaring Eleven eller lærlingen skal gennemføre følgende forløb: uden grundforløb uden oplæring i virksomhed standardafkortning af hovedforløb – de faglige udvalg har beskrevet en afkortning på mindst 10 % af skoleundervisningen eventuelt individuel godskrivning af kompetencer. Euv 2: For voksne elever og lærlinge, der har mindre end 2 års relevant erhvervserfaring og/eller en uddannelse Eleven eller lærlingen skal gennemføre følgende forløb: måske grundforløb eller dele deraf standardafkortning af hovedforløb - de faglige udvalg har beskrevet en afkortning på mindst 10 % af skoleundervisningen eventuelt individuel godskrivning af kompetencer. Euv 3: For voksne elever eller lærlinge, der ikke har relevant erhvervserfaring eller en uddannelse Eleven eller lærlingen skal gennemføre følgende forløb: samme forløb som de unge eventuelt individuel godskrivning. Læs mere om euv Læs mere om erhvervsuddannelse for voksne Lovhjemmel Euv har ligesom erhvervsuddannelserne for unge hjemmel i lov om erhvervsuddannelser. Det betyder, at der gælder de samme regler for euv som for erhvervsuddannelserne for unge, medmindre der er fastsat særlige regler for euv, som for eksempel i LBK nr. 1868 af 28/09/2021 – Bekendtgørelse af lov om erhvervsuddannelsesloven, kapitel 7 (retsinformation.dk). Grundlæggende voksenuddannelse (GVU) nedlagt Med oprettelsen af euv er den grundlæggende voksenuddannelse (GVU) - nedlagt, det vil sige lukket for ny tilgang. Voksne med mindst 2 års relevant erhvervserfaring kan derfor nå til faglært niveau ved at gennemføre uddannelsesvej euv1. Voksne, der er begyndt på en GVU før den 1.8.2015, kan fortsat gennemføre deres uddannelse som en GVU, men kan også vælge den nye euv1. Skolen fastsætter overgangsordninger for disse elever, som er begyndt på GVU, men ønsker at gennemføre uddannelsen som euv1. Læs mere i bekendtgørelse om erhvervsuddannelser § 131. stk.4 (retsinformation.dk)"
year_published = 2025
clearnet = "https://www.uvm.dk/flere-muligheder-for-voksne/euv"
