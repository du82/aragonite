["https://uvm.dk/sitecore/content/global/news/uvm/2025/feb/250224-invitation-til-pressemoede-om-trivselskommissionens-anbefalinger"]
title = "Invitation til pressemøde om Trivselskommissionens anbefalinger | Børne– og Undervisningsministeriet"
full_description = "Kulturminister Jakob Engel-Schmidt, børne- og undervisningsminister Mattias Tesfaye samt økonomiminister Stephanie Lose deltager i pressemødet for at modtage Trivselskommissionens afrapportering og anbefalinger. Medlemmerne af Trivselskommissionen vil også være til stede ved pressemødet. Praktik og tilmelding Pressemødet finder sted tirsdag d. 25. februar 2025 kl. 9:30 i Hafnia Hallen, Julius Andersens Vej 6, 2450 Kbh. SV. Journalister kan stille op fra kl. 8.30. Journalister kan tilmelde sig pressemødet via mail til presserådgiver i Kulturministeriet Kristian K. Jørgensen, krkj@kum.dk. Der skal fremvises gyldigt pressekort ved ankomst i Hafnia Hallen. Trivselskommissionen Trivselskommissionen blev nedsat i august 2023 af regeringen og har haft til opgave at komme med anbefalinger, der understøtter børn og unges trivsel, myndiggørelse og livsmod. Kommissionen har igangsat et omfattende vidensarbejde baseret på eksisterende forskning og undersøgelser, eksterne undersøgelser og inddragende aktiviteter, som kommissionen har iværksat, samt inputs fra forskere, fagpersoner og en lang række interessenter. Læs mere om Trivselskommissionen. Yderligere oplysninger Kulturministeriets pressetelefon: 22 76 51 16"
year_published = 2025
