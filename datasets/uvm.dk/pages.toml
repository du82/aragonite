["https://www.uvm.dk/folkeskolen/folkeskolens-proever/faglig-forberedelse/proevevejledninger"]
title = "Prøvevejledninger til folkeskolens prøver | Børne– og Undervisningsministeriet"
description = "Læs om sammenhængen mellem prøven, faget og folkeskolens formål"
full_description = "Formålet med prøvevejledningerne er at uddybe de krav, der stilles i prøvebekendtgørelsen. I prøvevejledningerne tydeliggøres også den sammenhæng, der er mellem folkeskolens formål, faget og reglerne i prøvebekendtgørelsen. Du kan altid finde de gældende versioner af prøvevejledningerne på denne side. Vejledningerne er gældende, indtil en ny version udgives. Justeringer af prøvevejledningerne Der er i efteråret 2024 lavet præciseringer i prøvevejledningerne i forlængelse af spørgsmål fra sektoren og gældende praksis. I indledningen i de opdaterede vejledninger kan du læse, hvad der er præciseret i de enkelte vejledninger. Vejledningerne er sat ind i en ny skabelon, og har derfor et nyt grafisk udtryk, men der er ingen ændringer af selve prøverne. Prøvevejledninger Fold alle ud/ind Billedkunst Vejledning til folkeskolens prøve i valgfaget billedkunst (obligatorisk prøve i 8. klasse) (pdf) Vejledning til folkeskolens prøve i valgfaget billedkunst (frivillig prøve i 8./9. klasse) (pdf) Dansk Vejledning til folkeskolens prøver i dansk i 9. klasse (pdf) Vejledning til folkeskolens prøver i dansk i 10. klasse (pdf) Engelsk Vejledning til folkeskolens prøver i engelsk i 9. klasse (pdf) Vejledning til folkeskolens prøver i engelsk i 10. klasse (pdf) Fransk Vejledning til folkeskolens prøver i fransk i 9. klasse (pdf) Vejledning til folkeskolens prøver i fransk i 10. klasse (pdf) Fysik/kemi, biologi og geografi Vejledning til folkeskolens prøve i den fælles prøve i fysik/kemi, biologi og geografi i 9. klasse (pdf) Vejledning til folkeskolens prøve i biologi i 9. klasse (skriftlig udtræksprøve) (pdf) Vejledning til folkeskolens prøve i fysik/kemi i 9. klasse (skriftlig udtræksprøve) (pdf) Vejledning til folkeskolens prøve i fysik/kemi i 10. klasse (pdf) Vejledning til folkeskolens prøve i geografi i 9. klasse (skriftlig udtræksprøve) (pdf) Historie, samfundsfag og kristendomskundskab Vejledning til folkeskolens prøver i historie, samfundsfag og kristendoms