title = "Typer af tilbud | Børne– og Undervisningsministeriet"
description = "Information om dagplage, private pasordninger, daginstitutioner og pasning af egne børn"
full_description = "Forside Dagtilbud Om dagtilbud Dagtilbud er en samlet betegnelse for tilbud til børn i alderen fra 0 år og indtil skolestart, som kan være etableret på flere forskellige måder. Som alternativer til dagtilbud er private pasningsordninger og tilskud til pasning af egne børn. Daginstitutioner Daginstitutioner kan etableres og drives i forskellige former. Efter aftale med kommunen kan daginstitutioner etableres og drives af andre end kommunen. Dagpleje Dagplejen adskiller sig fra daginstitutioner ved, at pasningen omfatter et mindre antal børn, og at pasningen foregår i et hjemligt miljø. Private pasningsordninger Forældre kan få tilskud til at ansætte en privat børnepasser, hvis kommunen godkender pasningsaftalen. Pasning af egne børn Det er kommunalbestyrelsen i den enkelte kommune, der afgør, om kommunen giver tilskud til pasning af egne børn."
